name: Secondary Erythromelalgia
creation_date: "2026-08-17T00:00:00Z"
description: >-
  Secondary (acquired) erythromelalgia is erythromelalgia arising in the context
  of an identifiable underlying disorder rather than from an inherited
  sodium-channel lesion. Its best-characterized and best-evidenced form is
  the erythromelalgia of the myeloproliferative neoplasms (MPN) — essential
  thrombocythemia and polycythemia vera — where the mechanism is not nociceptor
  channelopathy but platelet-mediated arteriolar inflammation and thrombotic
  occlusion of the acral microvasculature. Skin punch biopsies from affected
  areas show arteriolar inflammation, fibromuscular intimal proliferation, and
  platelet-rich thrombotic occlusions; platelet survival is shortened, platelet
  activation markers are elevated, and the entire syndrome is abolished by
  cyclooxygenase inhibition. Other acquired routes — autoimmune connective-tissue
  disease, small-fiber peripheral neuropathy, and drug exposure — are recognized
  but far less mechanistically resolved. This entry is the acquired sibling of
  `Primary_Erythermalgia` (SCN9A/Nav1.7 gain-of-function) and sits beneath the
  umbrella entry `erythromelalgia`; the two are distinguished mechanistically
  (platelet-microvascular versus neuronal-channelopathy) and therapeutically (the
  dramatic aspirin responsiveness of MPN-associated disease versus the
  characteristic aspirin refractoriness of the primary form). The underlying MPN
  pathophysiology itself is curated in `Polycythemia_Vera` and
  `Essential_Thrombocythemia` and is deliberately not re-derived here.
category: Complex
parents:
- disease
disease_term:
  preferred_term: secondary erythromelalgia
  term:
    id: MONDO:0035149
    label: secondary erythromelalgia
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:I73.8
      label: Other specified peripheral vascular diseases
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO:0035149
    mapping_justification: >-
      MONDO:0035149 carries ICD10CM:I73.8 as a cross-reference. The predicate is broadMatch, not
      exactMatch: I73.8 is a residual "other specified peripheral vascular diseases" bucket that
      does not distinguish primary from secondary erythromelalgia, so an ICD-10-CM-coded cohort
      cannot be used as a case definition for this entry.
notes: >-
  Deliberate non-conformance to the `thrombogenesis` module. The acral thrombi of
  MPN-associated erythromelalgia are platelet- and von Willebrand factor-rich with
  only weak fibrin staining, and develop despite therapeutic anticoagulation, with
  no rise in prothrombin fragment 1+2 (PMID:8883266) — i.e. thrombin generation is
  not required. The `thrombogenesis` module explicitly scopes out "VWF-platelet
  microangiopathy ... unless a distinct conventional thrombin/fibrin thrombosis
  branch is explicitly evidenced", and no such branch is evidenced here, so no
  `conforms_to` edge is asserted. This is recorded rather than silently omitted
  because the disease looks superficially like a thrombogenesis conformer.


  `datasets:` is intentionally empty. `just discover-datasets` returns no GEO
  candidates, and the obvious relaxations are both unsafe here: this syndrome has
  no causal gene of its own, so a gene-keyed search has nothing to key on, and
  searching the underlying myeloproliferative neoplasms would return datasets that
  belong to `Polycythemia_Vera` / `Essential_Thrombocythemia` rather than to this
  entry. Adding those would be Named Entity Confusion reached through dataset
  search, so nothing is recorded.


  `clinical_trials:` is likewise intentionally empty. The interventional trials in
  erythromelalgia recruit primary/inherited or idiopathic disease and explicitly
  exclude patients whose extremity pain has another cause — the EASE study of ATX01
  topical amitriptyline 15% (NCT05917912, AlgoTherapeutix, 14 participants), the
  burst spinal-cord-stimulation study (NCT04039633, St. Olavs Hospital, 6
  participants), and the Nav1.7-targeted agent studies (NCT01090622, NCT01486446,
  NCT01769274). None of them enrol secondary erythromelalgia, so listing them here
  would misattribute trial evidence to this entity. The two lead identifiers were
  checked against the ClinicalTrials.gov API directly, not only against the
  deep-research report, because identifiers inside free-text `notes:` are not
  reference-validated by `just validate-disorders`.
pathophysiology:
- name: Clonal Thrombocythemia in Myeloproliferative Neoplasm
  biological_scale: ORGANISM
  description: >-
    The upstream trigger of MPN-associated erythromelalgia is the clonal
    thrombocythemia of essential thrombocythemia or polycythemia vera, which
    supplies a population of qualitatively abnormal, hyperactivatable platelets.
    The dependence is causal rather than merely associative: erythromelalgia
    remits during cytoreduction-induced haematological remission and recurs when
    the thrombocythemia relapses. Notably the threshold is low — symptoms occur at
    platelet counts only slightly above normal — so absolute platelet mass is not
    the determinant. The clonal driver biology itself (JAK2 V617F and the
    haematopoietic consequences) is curated in `Polycythemia_Vera` and
    `Essential_Thrombocythemia`.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The erythromelalgia was alleviated during busulfan-induced remissions of thrombocythemia and its recurrence coincided with relapsing thrombocythemia."
    explanation: >-
      Remission-and-relapse concordance with the underlying thrombocythemia establishes
      the MPN as the causal upstream driver rather than a coincidental association.
  - reference: PMID:9263352
    reference_title: 'Erythromelalgia: a pathognomonic microvascular thrombotic complication in essential thrombocythemia and polycythemia vera.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Erythromelalgia is a characteristic thrombotic complication in patients with the myeloproliferative disorders, essential thrombocythemia and polycythemia vera."
    explanation: >-
      Identifies the two myeloproliferative neoplasms that constitute the principal underlying
      disorders of this secondary form. Classified OTHER because this is a narrative minireview
      summarizing the authors' prior work rather than a report of primary data.
  - reference: PMID:8951772
    reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythromelalgia in thrombocythemia already occurred at slightly increased platelet counts above 400 x 10(9)/l."
    explanation: >-
      Symptoms arise at only slightly elevated platelet counts, indicating that qualitative
      platelet hyperreactivity rather than absolute platelet mass drives the mechanism.
  downstream:
  - target: Thromboxane-Dependent Platelet Activation and Aggregation
    description: The clonal platelet population undergoes intravascular cyclooxygenase-dependent activation and aggregation.
    evidence:
    - reference: PMID:8883266
      reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data suggest that erythromelalgia is caused by the intravascular activation and aggregation of platelets with subsequent sludging or occlusion of the acral arterial microvasculature."
      explanation: Links the thrombocythemic platelet population to intravascular platelet activation and aggregation.
- name: Thromboxane-Dependent Platelet Activation and Aggregation
  biological_scale: CELLULAR
  description: >-
    Circulating MPN platelets undergo intravascular activation and aggregation in
    the acral microcirculation. The process is strictly cyclooxygenase-metabolite
    dependent: it is abolished by aspirin and indomethacin but not by
    sodium salicylate or by non-COX platelet inhibitors (dipyridamole,
    sulfinpyrazone, ticlopidine, dazoxiben). In vivo activation is measurable as
    elevated beta-thromboglobulin, platelet factor 4, thrombomodulin, and urinary
    thromboxane B2, together with a markedly shortened platelet survival time that
    aspirin normalizes. Critically, thrombin generation is NOT required — prothrombin
    fragment 1+2 and fibrin degradation products are unchanged, and the lesions
    develop despite heparin or coumarin anticoagulation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  - preferred_term: platelet aggregation
    modifier: INCREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  - preferred_term: prostanoid (thromboxane) biosynthesis
    modifier: INCREASED
    term:
      id: GO:0046457
      label: prostanoid biosynthetic process
  molecular_functions:
  - preferred_term: platelet cyclooxygenase-1 activity
    term:
      id: GO:0004666
      label: prostaglandin-endoperoxide synthase activity
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete relief of pain and restoration of microvascular circulation disturbances was obtained with the cyclo-oxygenase inhibitors aspirin and indomethacin, but not with sodium-salicylate or the platelet inhibitors dipyridamole, sulfinpyrazone, ticlopidine, and dazoxiben."
    explanation: >-
      The pharmacological dissection — COX inhibitors work, other antiplatelet agents do not —
      establishes cyclooxygenase metabolites as mechanistically necessary.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, cyclooxygenase metabolites are necessary for erythromelalgia to develop."
    explanation: States the necessity of cyclooxygenase metabolites explicitly.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significant higher levels of platelet activation markers beta-thromboglobulin, thrombomoduline and increased urinary thromboxane B2 excretion in thrombocythemia patients suffering from erythromelalgia"
    explanation: Quantifies in vivo platelet activation and thromboxane generation specifically in symptomatic patients.
  - reference: PMID:8883266
    reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that erythromelalgia is caused by the intravascular activation and aggregation of platelets with subsequent sludging or occlusion of the acral arterial microvasculature."
    explanation: Directly states intravascular platelet activation and aggregation as the causal mechanism.
  - reference: PMID:8883266
    reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The generation of thrombin appears not to be essential for the formation of these platelet thrombi, thereby giving a plausible explanation for the inefficacy of coumadin derivatives and heparin in the prevention and treatment of erythromelalgia in essential thrombocythemia."
    explanation: >-
      Establishes the thrombin-independence of the mechanism — the basis for this entry's
      deliberate non-conformance to the thrombin/fibrin `thrombogenesis` module.
  - reference: PMID:7792731
    reference_title: 'Platelet consumption in thrombocythemia complicated by erythromelalgia: reversal by aspirin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The increased platelet consumption in erythromelalgia is attributed to the formation of platelet thrombi in the arterial microvasculature."
    explanation: Radiolabelled platelet-survival kinetics independently confirm ongoing platelet consumption in microvascular thrombi.
  downstream:
  - target: Arteriolar Inflammation and Fibromuscular Intimal Proliferation
    description: Activated platelets and their released mediators injure and remodel the arteriolar wall.
    evidence:
    - reference: PMID:12781799
      reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Local platelet consumption in erythromelalgic areas became evident by the demonstration of arteriolar fibromuscular intimal proliferation and occlusions by platelet-rich thrombi in skin biopsies"
      explanation: Ties local platelet consumption directly to the arteriolar intimal-proliferative lesion.
  - target: Acral Arteriolar Microvascular Occlusion
    description: Platelet aggregates sludge and occlude the acral arterial microvasculature.
    evidence:
    - reference: PMID:8883266
      reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "intravascular activation and aggregation of platelets with subsequent sludging or occlusion of the acral arterial microvasculature"
      explanation: States the causal step from platelet aggregation to acral microvascular occlusion.
- name: Arteriolar Inflammation and Fibromuscular Intimal Proliferation
  biological_scale: TISSUE
  description: >-
    Skin punch biopsies taken from erythromelalgic areas show a distinctive
    arteriolar lesion — inflammation of the arteriolar wall with fibromuscular
    proliferation of the intima — accompanying the thrombotic occlusions. This
    inflammatory and proliferative wall response, together with the elevated
    thrombomodulin indicating endothelial injury, distinguishes the lesion from a
    bland intraluminal clot and is what makes "platelet-mediated arteriolar
    inflammation" rather than simple thrombosis the accurate description.
  cell_types:
  - preferred_term: arteriolar endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: arteriolar smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: smooth muscle cell proliferation
    modifier: INCREASED
    term:
      id: GO:0048659
      label: smooth muscle cell proliferation
  locations:
  - preferred_term: arteriole
    term:
      id: UBERON:0001980
      label: arteriole
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin punch biopsy samples taken from the affected areas showed typical arteriolar inflammation, fibromuscular intima proliferation, and thrombotic occlusions."
    explanation: Direct histopathological demonstration of the arteriolar inflammatory and intimal-proliferative lesion in affected skin.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the demonstration of arteriolar fibromuscular intimal proliferation and occlusions by platelet-rich thrombi in skin biopsies"
    explanation: Independently restates the arteriolar intimal-proliferative and platelet-rich occlusive histopathology.
  downstream:
  - target: Acral Arteriolar Microvascular Occlusion
    description: Intimal proliferation narrows the arteriolar lumen and compounds platelet-driven occlusion.
    evidence:
    - reference: PMID:3977194
      reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Skin punch biopsy samples taken from the affected areas showed typical arteriolar inflammation, fibromuscular intima proliferation, and thrombotic occlusions."
      explanation: The inflammatory/intimal-proliferative change and the thrombotic occlusion are demonstrated together in the same affected-skin biopsies.
- name: Acral Arteriolar Microvascular Occlusion
  biological_scale: TISSUE
  description: >-
    The convergent lesion is occlusion of acral arterioles by platelet-rich,
    von Willebrand factor-positive thrombi with only weak fibrin content. The
    resulting acral perfusion disturbance is the immediate substrate of the
    erythromelalgic flare and, if unrelieved, of progressive digital ischemia. The
    VWF-rich, fibrin-poor composition of these thrombi is the histological
    counterpart of the biochemical finding that thrombin generation is dispensable.
  locations:
  - preferred_term: arteriole
    term:
      id: UBERON:0001980
      label: arteriole
  evidence:
  - reference: PMID:8883266
    reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathologic and immunohistochemical analysis of biopsies derived from erythromelalgic skin areas of 2 ET patients showed that erythromelalgic thrombi stained positively for von Willebrand factor opposed to only a weak fibrin staining."
    explanation: >-
      Immunohistochemistry establishes the VWF-rich, fibrin-poor composition of the occluding
      thrombi, distinguishing them from conventional fibrin-platelet thrombi.
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "platelet-mediated inflammatory and occlusive arteriolar changes play a part in the etiology of erythromelalgia"
    explanation: Summarizes occlusive arteriolar change as the operative lesion in the aetiology of the syndrome.
  downstream:
  - target: Episodic Acral Burning Pain, Erythema, and Warmth
    description: Acral microvascular occlusion and the accompanying congestion produce the erythromelalgic attack.
    evidence:
    - reference: PMID:3977194
      reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complete relief of pain and restoration of microvascular circulation disturbances was obtained with the cyclo-oxygenase inhibitors aspirin and indomethacin"
      explanation: >-
        Pain relief and restoration of the microvascular circulation move together under COX inhibition,
        supporting the microvascular disturbance as the proximate cause of the flare.
  - target: Progression to Acrocyanosis and Digital Ischemic Necrosis
    description: Untreated, sustained occlusion progresses to fixed acral ischemia.
    evidence:
    - reference: PMID:8951772
      reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Untreated erythromelalgia progressed to acrocyanosis or peripheral ischemia with necrosis in a toe or fingertip in 14 cases."
      explanation: The untreated occlusive process progresses to acrocyanosis and acral necrosis in a defined fraction of patients.
- name: Episodic Acral Burning Pain, Erythema, and Warmth
  biological_scale: ORGANISM
  description: >-
    The clinical expression is the erythromelalgic attack: localized burning pain
    with redness and warm congestion of the distal extremities, documentable by
    thermography, most often in the forefoot sole and toes and less often in the
    fingertips or palm. Unlike the bilaterally symmetric flares of the primary
    form, secondary attacks are frequently asymmetric or unilateral, and
    erythromelalgic "hot spots" on the legs can be misread as superficial
    thrombophlebitis. No `biological_processes` are bound to this node: the obvious
    candidate (vasodilation) is not measured by any cited study and would sit
    awkwardly against this entry's occlusive model, in which the red, warm skin
    accompanies platelet-rich arteriolar obstruction rather than simple vasodilation.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The localized painful burning, redness, and warm congestion in the extremities could be accurately documented with thermography."
    explanation: Describes the flare phenotype and its objective thermographic correlate.
  - reference: PMID:8951772
    reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythromelalgia was localized in the forefoot sole and toes in 28, the fingertips in 9, the handpalm in 2."
    explanation: Quantifies the acral, foot-predominant anatomical distribution of attacks in a 50-patient thrombocythemia series.
  - reference: PMID:32491719
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although erythromelalgia is typically bilateral, it can present unilaterally, especially in secondary cases."
    explanation: >-
      Supports asymmetric/unilateral presentation as a feature that clinically distinguishes
      secondary from the characteristically bilateral primary form.
- name: Progression to Acrocyanosis and Digital Ischemic Necrosis
  biological_scale: TISSUE
  description: >-
    When the platelet-mediated occlusive process is not interrupted, the reversible
    erythromelalgic flare progresses to fixed acral ischemia: acrocyanosis and
    then frank ischemic necrosis or gangrene of toes or fingertips. This
    ischemic-progression arm is a mechanistically distinct outcome from the
    self-inflicted cold-immersion tissue injury that dominates complications in the
    primary form, and it is the reason MPN-associated erythromelalgia is treated as
    a thrombotic complication rather than purely a pain syndrome.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythromelalgia often progressed to ischemic acrocyanosis or necrosis in toes or fingers."
    explanation: Documents progression from the reversible flare to fixed acral ischemic tissue loss.
  - reference: PMID:8951772
    reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Untreated erythromelalgia progressed to acrocyanosis or peripheral ischemia with necrosis in a toe or fingertip in 14 cases."
    explanation: Quantifies ischemic progression in 14 of 50 thrombocythemia patients when erythromelalgia was left untreated.
- name: Non-Platelet Acquired Routes (Neuropathic, Autoimmune, Drug-Induced)
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Beyond the myeloproliferative neoplasms, erythromelalgia is reported secondary
    to small-fiber peripheral neuropathy, autoimmune connective-tissue disease, and
    drug exposure. These routes are recognised clinically but are far less
    mechanistically resolved than the MPN arm: combined neural and vascular
    abnormalities are invoked rather than a single demonstrated lesion, and
    critically these forms do NOT share the aspirin responsiveness of the
    platelet-mediated arm, which is why the historical Drenth-Michiels
    classification separated aspirin-resistant "secondary erythermalgia" from
    aspirin-responsive thrombocythemic erythromelalgia. Curated here as a
    deliberately low-resolution node rather than a speculative mechanism chain.
  evidence:
  - reference: PMID:40428878
    reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is often linked to underlying conditions such as myeloproliferative disorders (e.g., essential thrombocythemia, polycythemia vera), autoimmune diseases, infections, tumors, or medication use"
    explanation: >-
      Enumerates the acquired etiologies named in this node — autoimmune disease, infection,
      neoplasia and drug exposure alongside the myeloproliferative neoplasms.
  - reference: PMID:18713229
    reference_title: 'Incidence of erythromelalgia: a population-based study in Olmsted County, Minnesota.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "if the erythromelalgia was thought to be attributable to another cause such as medications, human immunodeficiency virus, or mushroom poisoning"
    explanation: >-
      A population-based study's own case definition independently names the drug, infection and
      toxin routes as recognized non-MPN causes of secondary erythromelalgia.
  - reference: PMID:15075045
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "secondary, which is associated with myeloproliferative disorders-related thrombocythemia, polycythemia, collagen-vascular diseases, diabetes mellitus, peripheral neuropathy, autoimmune and infectious diseases, and use of certain medicaments"
    explanation: >-
      Names the acquired associations modeled by this node — collagen-vascular disease, diabetes
      mellitus, peripheral neuropathy, autoimmune and infectious disease, and drug exposure —
      alongside the myeloproliferative route curated separately above.
  - reference: PMID:30609105
    reference_title: Review of primary and secondary erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "secondary erythromelalgia, which is often associated with underlying medical disorders"
    explanation: >-
      Establishes the defining feature of the secondary form — association with an underlying
      medical disorder — as distinct from the genetically defined primary form.
  - reference: PMID:29641704
    reference_title: 'Erythromelalgia: a cutaneous manifestation of neuropathy?'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Primary erythromelalgia is an autosomal dominant inherited disorder, while secondary is associated with myeloproliferative diseases, among others. In its etiopathogenesis, there are neural and vascular abnormalities that can be combined."
    explanation: >-
      Support is PARTIAL — the review asserts combined neural and vascular contributions to
      secondary disease without resolving a specific lesion for the non-MPN routes.
  - reference: PMID:32491719
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Secondary erythermalgia: Aspirin resistant and associated with different medical conditions."
    explanation: >-
      States that the non-thrombocythemic acquired forms are aspirin resistant, separating them
      pharmacologically from the platelet-mediated MPN arm modeled above.
  downstream:
  - target: Episodic Acral Burning Pain, Erythema, and Warmth
    description: These acquired routes converge on the same clinical flare phenotype by mechanisms that remain incompletely defined.
    evidence:
    - reference: PMID:29641704
      reference_title: 'Erythromelalgia: a cutaneous manifestation of neuropathy?'
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Erythromelalgia is an infrequent episodic acrosyndrome affecting mainly both lower limbs symmetrically with the classic triad of erythema, warmth and burning pain."
      explanation: >-
        Support is PARTIAL — the review establishes that the acquired routes present with the same
        clinical triad, but does not resolve the causal steps linking them to it.
phenotypes:
- name: Erythromelalgia
  category: Clinical
  frequency: OBLIGATE
  description: >-
    The defining phenotype: episodic redness, warmth, and burning pain of the
    distal extremities. `OBLIGATE` because this phenotype *is* the disease — every
    patient with secondary erythromelalgia has it by definition, so the band is a
    statement about the entity rather than an observed proportion. Note the
    distinction from the separate question of how often erythromelalgia occurs
    *among MPN patients*: that proportion is curated on the MPN entries
    (`Polycythemia_Vera`, `Essential_Thrombocythemia`), which record `OCCASIONAL`
    from Orphanet. The two hospital series cited below report far higher fractions
    (26/40 = 65%; 31/50 = 62%), but those come from a hematology group that
    specialized in this syndrome and are referral-biased; they are cited here for
    the disease-phenotype association and the MPN link, NOT as the basis for this
    band.
  phenotype_term:
    preferred_term: Erythromelalgia
    term:
      id: HP:0032147

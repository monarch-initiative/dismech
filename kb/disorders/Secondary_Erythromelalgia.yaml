diagnosis:
- name: Evaluation for an underlying myeloproliferative neoplasm
  description: >-
    Because erythromelalgia is regarded as a pathognomonic microvascular
    complication of essential thrombocythemia and polycythemia vera — and frequently
    its presenting manifestation — a new diagnosis of erythromelalgia warrants
    haematological evaluation for an occult MPN, including a platelet count that may
    be only modestly elevated.
  results: >-
    Thrombocytosis (possibly only slightly above 400 x 10^9/L) with an MPN diagnosis
    supports platelet-mediated secondary erythromelalgia.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythromelalgia was the presenting symptom in 26 of 40 patients with thrombocythemia in its primary form or when associated with polycythemia vera."
    explanation: Erythromelalgia is the presenting symptom in most such patients, justifying MPN evaluation on presentation.
- name: Skin punch biopsy of an affected area
  description: >-
    Histopathology of affected acral skin demonstrates the characteristic arteriolar
    inflammation, fibromuscular intimal proliferation, and platelet-rich thrombotic
    occlusions that distinguish platelet-mediated secondary erythromelalgia from the
    primary neuropathic form.
  results: Arteriolar inflammation, fibromuscular intimal proliferation, and thrombotic occlusion.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin punch biopsy samples taken from the affected areas showed typical arteriolar inflammation, fibromuscular intima proliferation, and thrombotic occlusions."
    explanation: Establishes the diagnostic histopathological findings on skin punch biopsy.
- name: Therapeutic response to aspirin as a diagnostic discriminator
  description: >-
    The dramatic, complete, and sustained response of platelet-mediated
    erythromelalgia to a cyclooxygenase inhibitor is itself diagnostically
    informative: the historical Drenth-Michiels classification of red, burning
    extremities was built on aspirin responsiveness, separating aspirin-responsive
    thrombocythemic erythromelalgia from the aspirin-resistant primary and other
    secondary forms.
  results: Complete relief of pain with aspirin supports the platelet-mediated (MPN-associated) form.
  evidence:
  - reference: PMID:32491719
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The term erythromelalgia and erythermalgia were differentiated on the basis of responsiveness to aspirin by Drenth and Michiels"
    explanation: Documents aspirin responsiveness as the historical basis for discriminating these entities.
treatments:
- name: Low-dose aspirin
  description: >-
    The mechanism-matched treatment of MPN-associated erythromelalgia. Irreversible
    inhibition of platelet cyclooxygenase-1 abolishes the thromboxane-dependent
    platelet activation that drives arteriolar occlusion, producing complete relief
    of pain, restoration of microvascular circulation, normalization of shortened
    platelet survival, and fall of platelet-activation markers to normal. This
    dramatic responsiveness is the therapeutic hallmark separating MPN-associated
    secondary erythromelalgia from the characteristically aspirin-refractory primary
    (SCN9A/Nav1.7) form. Safety caveat: at very high platelet counts
    (roughly >1000-2000 x 10^9/L) thrombocythemia converts to a bleeding diathesis,
    and aspirin — while still preventing the microcirculatory disturbance — further
    increases the risk of serious haemorrhage.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Erythromelalgia
    term:
      id: HP:0032147
      label: Erythromelalgia
  target_mechanisms:
  - target: Thromboxane-Dependent Platelet Activation and Aggregation
    treatment_effect: INHIBITS
    description: >-
      Aspirin inhibits platelet cyclooxygenase-1, removing the thromboxane metabolites
      shown to be necessary for erythromelalgia to develop and thereby interrupting the
      platelet activation/aggregation node upstream of arteriolar occlusion.
    evidence:
    - reference: PMID:16673274
      reference_title: 'Clinical and laboratory features, pathobiology of platelet-mediated thrombosis and bleeding complications, and the molecular etiology of essential thrombocythemia and polycythemia vera: therapeutic implications.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inhibition of platelet cyclooxygenase-1 by aspirin is followed by relief of microvascular disturbances"
      explanation: States the drug target (platelet COX-1) and the mechanistic consequence of inhibiting it.
    - reference: PMID:12781799
      reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, cyclooxygenase metabolites are necessary for erythromelalgia to develop."
      explanation: Establishes that the inhibited pathway is necessary for the disease process, licensing the INHIBITS edge.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete relief of pain and restoration of microvascular circulation disturbances was obtained with the cyclo-oxygenase inhibitors aspirin and indomethacin"
    explanation: Documents complete symptomatic and microvascular response to cyclooxygenase inhibition.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aspirin treatment of erythromelalgia in thrombocythemia patients resulted in the disappearance of the erythromelalgic, thrombotic signs and symptoms, correction of the shortened platelet survival times"
    explanation: Confirms clinical and platelet-kinetic reversal on aspirin.
  - reference: PMID:8951772
    reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this situation aspirin prevents erythromelalgic and microcirculatory circulation disturbances, but further increases the risk of serious bleeding complications."
    explanation: >-
      Support is PARTIAL because it qualifies rather than endorses the treatment — at very high
      platelet counts aspirin remains effective for the microvascular disturbance but raises bleeding risk.
- name: Indomethacin
  description: >-
    A second cyclooxygenase inhibitor with the same mechanism-matched efficacy,
    confirming that the therapeutic effect is a class effect of COX inhibition
    rather than an aspirin-specific property. Notably sodium salicylate and the
    non-COX platelet inhibitors dipyridamole, sulfinpyrazone, ticlopidine, and
    dazoxiben are all ineffective, which is the pharmacological argument for the
    thromboxane mechanism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: indomethacin
      term:
        id: CHEBI:49662
        label: indometacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Thromboxane-Dependent Platelet Activation and Aggregation
    treatment_effect: INHIBITS
    description: Indomethacin inhibits the same platelet cyclooxygenase pathway targeted by aspirin.
    evidence:
    - reference: PMID:3977194
      reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complete relief of pain and restoration of microvascular circulation disturbances was obtained with the cyclo-oxygenase inhibitors aspirin and indomethacin, but not with sodium-salicylate or the platelet inhibitors dipyridamole, sulfinpyrazone, ticlopidine, and dazoxiben."
      explanation: >-
        Indomethacin shares aspirin's efficacy while non-COX antiplatelet agents fail, establishing
        cyclooxygenase inhibition as the operative drug mechanism.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete relief of pain and restoration of microvascular circulation disturbances was obtained with the cyclo-oxygenase inhibitors aspirin and indomethacin"
    explanation: Documents complete symptomatic and microvascular relief with indomethacin alongside aspirin.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete relief from erythromelalgic and acrocyanotic pain is obtained with the cyclooxygenase inhibitors aspirin and indomethacin, but not with sodiumsalicylate, dipyridamol, sulfinpyrozone and ticlopedine."
    explanation: Independently confirms indomethacin efficacy and the failure of non-COX antiplatelet agents.
- name: Cytoreduction of the underlying myeloproliferative neoplasm
  description: >-
    Treating the upstream disorder resolves the erythromelalgia: symptoms remit
    during cytoreduction-induced haematological remission of the thrombocythemia and
    recur on relapse. Contemporary cytoreductive agent selection is a matter for the
    MPN entries (`Polycythemia_Vera`, `Essential_Thrombocythemia`) rather than this
    entry; the historical evidence cited here used busulfan.
  treatment_term:
    preferred_term: cytoreductive therapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Clonal Thrombocythemia in Myeloproliferative Neoplasm
    treatment_effect: INHIBITS
    description: Cytoreduction removes the clonal thrombocythemia that supplies the hyperreactive platelet population.
    evidence:
    - reference: PMID:3977194
      reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The erythromelalgia was alleviated during busulfan-induced remissions of thrombocythemia and its recurrence coincided with relapsing thrombocythemia."
      explanation: Remission of the thrombocythemia relieves the erythromelalgia, supporting an INHIBITS edge on the upstream node.
  evidence:
  - reference: PMID:3977194
    reference_title: Erythromelalgia caused by platelet-mediated arteriolar inflammation and thrombosis in thrombocythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The erythromelalgia was alleviated during busulfan-induced remissions of thrombocythemia and its recurrence coincided with relapsing thrombocythemia."
    explanation: Cytoreduction-induced haematological remission relieves the erythromelalgia, and relapse brings it back.
  - reference: PMID:12781799
    reference_title: 'Platelet-mediated microvascular inflammation and thrombosis in thrombocythemia vera: a distinct aspirin-responsive arterial thrombophilia, which transforms into a bleeding diathesis at increasing platelet counts.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "which specifically respond to low-dose aspirin or reduction of platelet counts to normal"
    explanation: >-
      Support is PARTIAL — the quoted response applies to the accompanying transient ischemic
      manifestations, but it establishes platelet-count reduction as an effective alternative to aspirin
      for the platelet-mediated microvascular syndrome as a whole.
- name: Treatment of the underlying condition in non-MPN secondary disease
  description: >-
    For acquired erythromelalgia not driven by a myeloproliferative neoplasm,
    management is directed primarily at the underlying disease, supplemented by
    trigger avoidance. Aspirin is characteristically ineffective in these
    non-platelet-mediated forms. Note this is a statement about *cause-directed*
    therapy, not a claim that nothing helps symptomatically — symptomatic options
    with trial evidence are curated in the sibling treatment entry below.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40428878
    reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary EM tends to be more variable in presentation, may be unilateral or localized, and treatment usually targets the underlying condition."
    explanation: >-
      A 2025 systematic review states that treatment of secondary erythromelalgia usually targets
      the underlying condition.
  - reference: PMID:29641704
    reference_title: 'Erythromelalgia: a cutaneous manifestation of neuropathy?'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Since there is no specific and effective treatment, control should focus on the underlying disease."
    explanation: >-
      Support is PARTIAL. This 2018 narrative review's blanket "no specific and effective
      treatment" is used only for the cause-directed management principle; the later systematic
      review (PMID:40428878) reports measurable symptomatic benefit for several agents, so the
      unqualified negative is not adopted here.
  - reference: PMID:29641704
    reference_title: 'Erythromelalgia: a cutaneous manifestation of neuropathy?'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prevention of crisis is based on a strict control of triggers and promotion of preventive measures."
    explanation: Supports trigger control as the preventive component of management.
- name: Symptomatic pharmacotherapy for aspirin-unresponsive disease
  description: >-
    Where the platelet-mediated COX-1 mechanism does not apply — the non-MPN
    acquired routes, and MPN disease inadequately controlled by aspirin — symptomatic
    options with controlled or cohort evidence include topical amitriptyline-ketamine,
    lidocaine, and the prostaglandin analogues iloprost and misoprostol. IMPORTANT
    EVIDENCE CAVEAT, which is why these are curated as a single node without
    per-agent mechanism edges: the systematic review supplying this evidence pooled
    120 patients across primary, idiopathic and secondary erythromelalgia and did NOT
    report outcomes stratified by aetiology, so efficacy specific to secondary
    disease is not established. Misoprostol in particular caused severe
    gastrointestinal toxicity.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amitriptyline
      term:
        id: CHEBI:2666
        label: amitriptyline

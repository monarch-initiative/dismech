environmental:
- name: Limb warming, exercise, and dependency as attack precipitants
  description: >-
    Erythromelalgic attacks are provoked by warmth and by anything that raises acral
    blood flow or venous pressure — exercise, physical activity, limb dependency,
    prolonged standing, and occlusive footwear — and are relieved by cooling and
    elevation. These are precipitants of the flare, not causes of the underlying
    disorder, so they are modeled as EXACERBATES on the flare node rather than as a
    trigger of the upstream mechanism. Note the therapeutic hazard shared with the
    primary form: patients self-treat by prolonged cold-water immersion, which causes
    skin maceration and secondary tissue injury.
  influences_mechanisms:
  - target: Episodic Acral Burning Pain, Erythema, and Warmth
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Heat and exertion precipitate the erythromelalgic attack; cooling relieves it.
    evidence:
    - reference: PMID:40428878
      reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Triggers for symptoms included warmth, exercise, dependency, tight footwear or gloves, physical activity, immersion, and emotional stress."
      explanation: Enumerates the attack precipitants recorded across the systematic review's patient cohorts.
    - reference: PMID:32491719
      reference_title: Erythromelalgia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The episodes are typically precipitated by exercise and relieved by cooling the affected parts."
      explanation: States the precipitation-by-exertion and relief-by-cooling pattern that defines the flare.
  evidence:
  - reference: PMID:40428878
    reference_title: 'Comparative Efficacy and Tolerability of Treatments for Erythromelalgia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common relievers involve cooling methods such as local skin cooling or ice water immersion."
    explanation: Documents cooling as the characteristic reliever, the counterpart of the warming trigger.

  presence: Elevated
  notes: >-
    Alpha-granule release marker of in vivo platelet activation; significantly
    elevated in thrombocythemia patients with erythromelalgia compared with
    asymptomatic thrombocythemia patients and controls, and normalized by aspirin
    in parallel with clinical resolution.
  evidence:

- name: Platelet survival time
  presence: Shortened
  notes: >-
    Radiolabelled autologous platelet survival is markedly shortened in
    thrombocythemia complicated by erythromelalgia (4.2 days) relative to
    asymptomatic thrombocythemia (6.6 days) and reactive thrombocytosis (8.0 days),
    and is restored by aspirin — a direct functional readout of ongoing platelet
    consumption in microvascular thrombi.

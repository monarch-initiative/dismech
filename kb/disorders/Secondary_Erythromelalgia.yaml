differential_diagnoses:
- name: Primary erythermalgia
  disease_term:
    preferred_term: primary erythermalgia
    term:
      id: MONDO:0007571
      label: primary erythermalgia
  description: >-
    The principal differential. Primary/inherited erythromelalgia is an autosomal
    dominant SCN9A (Nav1.7) gain-of-function channelopathy of nociceptors,
    characteristically bilateral and symmetric, and characteristically refractory to
    aspirin — the mechanistic and therapeutic mirror image of the platelet-mediated
    secondary form modeled here. Curated separately as `Primary_Erythermalgia`.
  evidence:
  - reference: PMID:8203771
    reference_title: 'Thrombocythemic erythromelalgia, primary erythermalgia, and secondary erythermalgia: three distinct clinicopathologic entities.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the authors discern three distinct types of red, congested, and burning extremities that need to be distinguished for effective treatment according to their etiology: erythromelalgia in thrombocythemia, primary erythermalgia, and secondary erythermalgia"
    explanation: >-
      Establishes that thrombocythemic erythromelalgia and primary erythermalgia are distinct
      clinicopathologic entities requiring different treatment.
  - reference: PMID:32491719
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary erythermalgia: Refers to an idiopathic or inherited disorder. Also called aspirin-resistant erythermalgia of unknown origin."
    explanation: Documents the aspirin resistance of primary erythermalgia, the therapeutic discriminator from the MPN-associated form.
  - reference: PMID:30609105
    reference_title: Review of primary and secondary erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recent discoveries of the genetic mutations that now define primary erythromelalgia, as opposed to secondary erythromelalgia"
    explanation: States that genetic mutations define the primary form in contradistinction to the secondary form.
- name: Superficial thrombophlebitis
  description: >-
    Painful red, warm, indurated erythromelalgic "hot spots" on the skin of the
    upper legs in thrombocythemia are readily misdiagnosed as superficial
    thrombophlebitis, which would be treated quite differently.
  evidence:
  - reference: PMID:8951772
    reference_title: 'Erythromelalgic, thrombotic and hemorrhagic manifestations in 50 cases of thrombocythemia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Painful red, warm and indurated erythromelalgic hot spots in the skin of the upper legs were misdiagnosed as superficial thrombophelebitis in 5 PT and 2 PV patients."
    explanation: Documents this specific misdiagnosis in 7 of 50 thrombocythemia patients.
discussions:
- discussion_id: av_shunting_vs_occlusion_paradox
  prompt: >-
    How does an arteriole occluded by platelet-rich thrombi produce a skin surface that
    is visibly red and *hotter* than normal? Is microvascular arteriovenous shunting
    the reconciling mechanism, and if so does it operate in the MPN-associated form or
    only in the non-platelet acquired routes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Episodic Acral Burning Pain, Erythema, and Warmth
  - pathophysiology#Acral Arteriolar Microvascular Occlusion
  rationale: >-
    This entry's occlusive model has an unresolved surface paradox. The demonstrated
    lesion is arteriolar obstruction by platelet-rich thrombi, which should reduce
    perfusion — yet the defining clinical sign is a red, warm, congested extremity,
    and the flare node above therefore deliberately binds no `vasodilation` process
    rather than assert a mechanism it cannot evidence.


    The classical reconciliation is microvascular arteriovenous shunting: blood
    bypasses the nutritive capillary bed through shunts, so the skin is simultaneously
    hyperemic and warm at the surface while the tissue itself is hypoxic. That model
    is asserted in the older review literature (PMID:15075045) but, critically, is
    asserted there as a *single common mechanism for all* erythromelalgia — a claim
    the later Nav1.7 channelopathy findings contradict, and which this KB already
    flags as PARTIAL on the umbrella `erythromelalgia` entry. The deep-research report
    for this entry describes the same shunting model with a low-transcutaneous-oxygen
    correlate, but its only source there is a textbook chapter with no PMID and no
    quotable passage, so it cannot be curated as an evidence-backed pathophysiology
    node.


    What would settle it: paired measurements in *aetiologically stratified* patients
    — laser Doppler skin blood flow and transcutaneous oxygen tension during a flare,
    in MPN-associated versus non-MPN secondary disease. Until then this entry models
    only what the histopathology and platelet kinetics directly demonstrate, and
    records the shunting hypothesis here rather than promoting it to a node.
  evidence:
  - reference: PMID:15075045
    reference_title: Erythromelalgia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A wide variety of etiological conditions can cause erythromelalgia, all having a single common pathogenetic mechanism - microvascular arteriovenous shunting."
    explanation: >-
      States the arteriovenous-shunting hypothesis. Support is PARTIAL and deliberately so: this
      2004 review asserts shunting as the SINGLE common mechanism across all erythromelalgia,
      which the SCN9A/Nav1.7 findings curated in `Primary_Erythermalgia` contradict. It is cited
      as the source of an open hypothesis, not as support for a curated mechanism.
  - reference: PMID:8883266
    reference_title: Erythromelalgia in essential thrombocythemia is characterized by platelet activation and endothelial cell damage but not by thrombin generation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intravascular activation and aggregation of platelets with subsequent sludging or occlusion of the acral arterial microvasculature"
    explanation: >-
      Establishes the occlusive half of the paradox — the demonstrated lesion in MPN-associated
      disease is microvascular occlusion, which is what makes the warm, hyperemic surface
      appearance require an explanation.
- discussion_id: secondary_em_nomenclature_scope
  prompt: >-
    Does MONDO:0035149 "secondary erythromelalgia" include the platelet-mediated
    erythromelalgia of the myeloproliferative neoplasms, or only the
    aspirin-resistant non-MPN acquired forms that the historical Drenth-Michiels
    classification called "secondary erythermalgia"?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Clonal Thrombocythemia in Myeloproliferative Neoplasm
  - pathophysiology#Non-Platelet Acquired Routes (Neuropathic, Autoimmune, Drug-Induced)
  rationale: >-
    Two incompatible nomenclatures are in circulation. The historical
    Drenth-Michiels scheme is three-way and defined by aspirin responsiveness:
    (a) aspirin-responsive erythromelalgia in thrombocythemia, (b) aspirin-resistant
    primary erythermalgia, (c) aspirin-resistant "secondary erythermalgia" associated
    with other medical conditions. Under that scheme, MPN-associated disease is NOT
    "secondary". Contemporary usage is instead a two-way primary/secondary split that
    places MPN-associated disease squarely within "secondary" — the Olmsted County
    population study classified patients as secondary precisely when they had a
    coexisting myeloproliferative disorder, and a 2025 systematic review lists
    myeloproliferative disorders first among the conditions secondary EM is linked to.
    This entry follows that contemporary usage and models the MPN platelet arm as the
    principal, best-evidenced secondary mechanism, while retaining the non-MPN routes
    as a separate, deliberately low-resolution node.


    THE GAP, stated precisely: which of the two senses MONDO:0035149 itself intends is
    NOT established here. Its only synonym is "Secondary erythermalgia" EXACT
    [Orphanet:529864] — i.e. Orphanet's label is the very term the historical narrow
    scheme used for the aspirin-RESISTANT non-MPN category. No Orphanet definition row
    was quotable at curation time (the Orphadata bulk XML was not available locally),
    so this entry's scope decision rests on contemporary clinical/epidemiological usage
    rather than on a cited ontology definition. Resolving it needs
    `just structured-rebuild-orphanet --id 529864` and a quoted `ORPHA:529864`
    definition row. Curators reading the older literature should meanwhile note that
    "secondary erythermalgia" there means something narrower than this entry's scope,
    and that the aspirin-responsiveness contrast is therefore a contrast between the
    MPN arm and everything else, not between "secondary" and "primary" as such.
  evidence:
  - reference: PMID:32491719
    reference_title: Erythromelalgia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "(a) Erythromelalgia in thrombocythemia: It is platelet mediated and aspirin responsive. This occurs in association with essential thrombocytosis and polycythemia vera."
    explanation: >-
      Documents the historical three-way classification in which thrombocythemic erythromelalgia is
      its own aspirin-responsive category, separate from "secondary erythermalgia".
  - reference: PMID:18713229
    reference_title: 'Incidence of erythromelalgia: a population-based study in Olmsted County, Minnesota.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were considered to have secondary erythromelalgia if they had a coexisting diagnosis of a myeloproliferative disorder such as polycythemia vera, chronic myelocytic leukemia, or thrombocythemia at the time of diagnosis of erythromelalgia"
    explanation: >-
      Contemporary epidemiology classifies MPN-associated disease as secondary, the usage this
      entry follows and the one matching MONDO/Orphanet.

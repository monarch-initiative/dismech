- name: Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  description: >-
    Oxidative phosphorylation is impaired in patient-derived cells, and the
    founding infants had a multisystem mitochondrial cytopathy. The defect is
    tissue-selective: muscle respiratory chain activity and histochemistry were
    normal in the Spanish siblings, and residual enzyme activity is thought to
    keep most tissues above threshold while the high-demand renal tubule
    fails.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:21255763
    reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An uncharacterized multisystemic mitochondrial cytopathy was diagnosed in
      two infants from consanguineous Palestinian kindred living in a single
      village.
    explanation: The founding infants had a mitochondrial cytopathy.
  - reference: PMID:24034276
    reference_title: A new mutation in the gene encoding mitochondrial seryl-tRNA synthetase as a cause of HUPRA syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients II-1 and II-2, unlike the Palestinian patients, had a more
      severe anemia, a milder developmental delay, normal levels of blood
      lactate, and normal COX histochemistry and mitochondrial respiratory

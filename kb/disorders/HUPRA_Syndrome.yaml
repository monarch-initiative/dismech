    description: The interstitium becomes fibrotic.
  - target: Metabolic alkalosis
    causal_link_type: DIRECT
    description: The tubulopathy produces a hypochloremic metabolic alkalosis, even with renal failure.
  - target: Hyponatremia
    causal_link_type: DIRECT
    description: Renal sodium loss produces hyponatremia.
  - target: Hypomagnesemia
    causal_link_type: DIRECT
    description: Renal magnesium loss produces hypomagnesemia.
  - target: Hyperuricemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced filtration and volume depletion from polyuria raise serum uric acid.
    evidence:
    - reference: PMID:33751860
      reference_title: Novel SARS2 variants identified in a Chinese girl with HUPRA syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Significant hyperuricemia in HUPRA syndrome is derived from the
        reduction of uric acid filtration caused by declined glomerular
        filtration rate, masking the tendency to hypouricemia due to the
        mitochondrial tubular diseases.
      explanation: The authors' account of the hyperuricemia.
  - target: Increased blood urea nitrogen
    causal_link_type: DIRECT
    description: Urea rises out of proportion to creatinine.
- name: Multisystem Energy Failure
  biological_scale: ORGANISM
  description: >-
    Beyond the kidney, infants have pulmonary hypertension with right
    ventricular hypertrophy, anemia, failure to thrive, hypotonia and
    developmental delay, and most were born preterm. How the defect produces
    the pulmonary hypertension and the anemia has not been studied.
  evidence:
  - reference: PMID:38264205
    reference_title: "Variants in the SARS2 gene cause HUPRA syndrome with atypical features: two case reports and review of the literature."

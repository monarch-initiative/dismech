- name: Renal Tubular Energy Failure
  biological_scale: TISSUE
  conforms_to: "mitochondrial_translation_deficiency#Tissue-Selective Energy Failure"
  description: >-
    The renal tubule is the main organ of the disease. Biopsies show tubular
    atrophy, interstitial fibrosis and markedly enlarged mitochondria in
    tubular epithelial cells, with normal glomeruli. The tubulopathy causes
    hyponatremia, hypomagnesemia, polyuria and hypochloremic alkalosis, and
    the renal failure that follows is tubulointerstitial; the hyperuricemia is
    attributed to the falling filtration rate and to volume depletion.
  cell_types:
  - preferred_term: renal tubular epithelial cell
    term:
      id: CL:1000449
      label: epithelial cell of nephron
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:33751860
    reference_title: Novel SARS2 variants identified in a Chinese girl with HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Renal biopsy was performed in three patients, who were characterized by
      interstitial fibrosis, tubular atrophy, and markedly enlarged mitochondria
      in tubular epithelial cells without glomerular lesion
    explanation: The renal histology across three biopsied patients.
  - reference: PMID:33751860
    reference_title: Novel SARS2 variants identified in a Chinese girl with HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathology suggested that renal failure of HUPRA syndrome is because
      of tubular interstitial damage.
    explanation: The renal failure is tubulointerstitial.
  - reference: PMID:36698945
    reference_title: Novel variants of seryl-tRNA synthetase resulting in HUPRA syndrome featured in pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The predominant organ affected by HUPRA syndrome and other mitochondrial
      diseases is usually the kidney, especially renal tubules, which require a
      large amount of ATP for reabsorption functions.
    explanation: Why the renal tubule dominates the phenotype.
  downstream:

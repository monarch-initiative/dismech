    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Pulmonary hypertension develops in most infants; its mechanism is unknown.
  - target: Right ventricular hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The right ventricle hypertrophies, consistent with pulmonary hypertension.
  - target: Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Anemia appears in early infancy, before advanced renal failure in some.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Infants fail to thrive.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

      explanation: The proposed reason the tubule is most vulnerable.
  - target: Multisystem Energy Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Other organs are affected less consistently.
  - target: Increased circulating lactate concentration
    causal_link_type: DIRECT

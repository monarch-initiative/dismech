    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The typical presentation for HUPRA syndrome is characterized by
      early-onset progressive renal failure, hyperuricemia, hyponatremia,
      hypomagnesemia, metabolic alkalosis, associated with systemic
      manifestations which include pulmonary hypertension, failure to thrive,
      global developmental delay, hypotonia, and ventricular hypertrophy.
    explanation: The systemic features that accompany the renal disease.
  downstream:

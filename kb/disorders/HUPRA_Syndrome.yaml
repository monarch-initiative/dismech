name: HUPRA Syndrome
creation_date: "2026-11-27T14:28:49Z"
category: Mendelian
disease_term:
  preferred_term: hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
  term:
    id: MONDO:0013458
    label: hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
synonyms:
- hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
- hyperuricemia, pulmonary hypertension, renal failure, and alkalosis
- hyperuricemia, pulmonary hypertension, renal failure, and alkalosis syndrome
- HUPRAS
parents:
- Mitochondrial Disease
description: >-
  HUPRA syndrome (hyperuricemia, pulmonary hypertension, renal failure in
  infancy and alkalosis) is an autosomal recessive mitochondrial disease
  caused by biallelic variants in SARS2, which encodes the mitochondrial
  seryl-tRNA synthetase. It is not the cytoplasmic seryl-tRNA synthetase
  SARS1, whose deficiency is a separate neurodevelopmental disorder. SARS2
  charges the two mitochondrial serine tRNAs, and pathogenic variants mainly
  reduce charging of tRNA-Ser(AGY), which is then degraded, impairing
  mitochondrial translation. Some missense variants act through the
  transcript: the Palestinian founder p.Asp390Gly and the recurrent
  p.Arg402His both reduce inclusion of exon 13.

  Infants, most of them born preterm, develop a renal tubulopathy with
  hyperuricemia, hyponatremia, hypomagnesemia and hypochloremic metabolic
  alkalosis, progressive renal failure with tubular atrophy and interstitial
  fibrosis, pulmonary hypertension with right ventricular hypertrophy, anemia,
  failure to thrive, hypotonia and developmental delay. Most reported infants
  died before three years of age. Some patients lack pulmonary hypertension or
  alkalosis, and two Palestinian girls had acidosis, leukopenia and salt
  wasting instead.

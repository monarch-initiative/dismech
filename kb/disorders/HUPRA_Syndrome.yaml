- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients are homozygous, often in consanguineous or isolated communities,
    or compound heterozygous for SARS2 variants.
  evidence:
  - reference: PMID:38264205
    reference_title: "Variants in the SARS2 gene cause HUPRA syndrome with atypical features: two case reports and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hyperuricemia, pulmonary hypertension, renal failure in infancy, and
      alkalosis (HUPRA syndrome) is a rare autosomal recessive mitochondrial
      disease
    explanation: States the autosomal recessive inheritance.
  - reference: PMID:21255763
    reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using genome-wide SNP homozygosity analysis, we identified a homozygous
      identity-by-descent region on chromosome 19 and detected the pathogenic
      mutation c.1169A>G (p.Asp390Gly) in SARS2, encoding the mitochondrial
      seryl-tRNA synthetase.
    explanation: Homozygosity mapping in a consanguineous kindred.
genetic:
- name: SARS2
  gene_term:
    preferred_term: SARS2
    term:
      id: hgnc:17697
      label: SARS2
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Biallelic SARS2 variants cause the disease, in about six reported families
    from Palestine, Spain and China, with reduced charging and abundance of
    tRNA-Ser(AGY) in patient cells and rescue by wild-type SARS2 in patient
    induced pluripotent stem cells.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:21255763
      reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By using genome-wide SNP homozygosity analysis, we identified a
        homozygous identity-by-descent region on chromosome 19 and detected the
        pathogenic mutation c.1169A>G (p.Asp390Gly) in SARS2, encoding the
        mitochondrial seryl-tRNA synthetase.
      explanation: A homozygous founder allele in a consanguineous kindred.
  notes: >-
    The relationship is typed UNKNOWN rather than CAUSATIVE, which this schema
    reserves for Definitive or Strong gene-disease validity: ClinGen rates
    SARS2 Moderate (autosomal recessive) for mitochondrial disease
    (MONDO:0044970), a broader concept than this entry's MONDO:0013458, so no
    tier is recorded in gene_disease_validity. SARS2 is the mitochondrial
    enzyme; the cytoplasmic seryl-tRNA synthetase is SARS1 (see
    SARS1-Related_Neurodevelopmental_Disorder). A homozygous SARS2 splice
    variant causes a different presentation, progressive spastic paresis
    without the HUPRA features (PMID:27279129), and SARS2 expression has been
    reported as a genetic modifier of onset age in hereditary spastic paraplegia
    type 4 (PMID:36056923); neither is covered by this entry.
  variants:
  - name: c.1169A>G, p.Asp390Gly
    description: >-
      The Palestinian founder allele, homozygous in the first three infants;
      it reduces charging of tRNA-Ser(AGY) and inclusion of exon 13.
    evidence:
    - reference: PMID:21255763
      reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The carrier rate of this mutation among inhabitants of this Palestinian
        isolate was found to be 1:15.
      explanation: The allele is a founder variant in one isolate.
  - name: c.1205G>A, p.Arg402His
    description: >-
      The most frequently detected allele, homozygous in Spanish siblings and
      compound heterozygous in two Chinese patients. It reduces exon 13
      inclusion but did not alter oxygen consumption in a cellular model.
    evidence:
    - reference: PMID:42220212
      reference_title: Multiple mechanisms lead to loss-of-function effects of pathogenic SARS2 variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Interestingly, certain variants (including the most commonly detected
        pathogenic SARS2 variant, R402H) did not affect mitochondrial function
        in our model system.
      explanation: The allele's effect is not seen in that model's respiration readout.
  evidence:
  - reference: PMID:21255763
    reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The same homozygous mutation was later identified in a third infant with HUPRA syndrome.
    explanation: The founding kindred and a further infant.
  - reference: PMID:24034276
    reference_title: A new mutation in the gene encoding mitochondrial seryl-tRNA synthetase as a cause of HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Several data support that p.R402H mutation in SARS2 is a new cause of HUPRA syndrome.
    explanation: A Spanish family with a second allele.
  - reference: PMID:33751860
    reference_title: Novel SARS2 variants identified in a Chinese girl with HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SARS2 gene compound heterozygotes variants were detected in this Chinese
      patient (c.667G>A/c.1205G>A).
    explanation: A compound heterozygous patient.
  - reference: PMID:36698945
    reference_title: Novel variants of seryl-tRNA synthetase resulting in HUPRA syndrome featured in pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed novel compound heterozygous variants of
      SARS2 (c.1205G > A and c.680G > A).
    explanation: A further compound heterozygous patient, in whom pulmonary hypertension dominated.
pathophysiology:
- name: SARS2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic SARS2 variants lower mitochondrial seryl-tRNA synthetase
    activity. Variants studied biochemically bind and charge tRNA poorly, and
    the two commonest missense variants, p.Asp390Gly and p.Arg402His, also
    reduce correct splicing of exon 13. The variants differ in how much they
    reduce respiration in a cellular model, which may underlie the clinical
    variability.
  genes:
  - preferred_term: SARS2
    term:
      id: hgnc:17697
      label: SARS2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: serine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004828
      label: serine-tRNA ligase activity
  evidence:
  - reference: PMID:36350636
    reference_title: Selective degradation of tRNASer(AGY) is the primary driver for mitochondrial seryl-tRNA synthetase-related disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both mutants exhibited severely diminished tRNA binding and aminoacylation capacities.
    explanation: Two patient variants nearly abolish tRNA binding and charging in vitro.
  - reference: PMID:42220212
    reference_title: Multiple mechanisms lead to loss-of-function effects of pathogenic SARS2 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Computational and functional studies revealed that two missense variants
      in exon 13 (D390G and R402H) reduce exon inclusion, suggesting
      loss-of-function effects via impaired transcript processing.
    explanation: The common missense variants also impair splicing.
  - reference: PMID:42220212
    reference_title: Multiple mechanisms lead to loss-of-function effects of pathogenic SARS2 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These efforts revealed compelling variant-dependent effects on oxygen
      consumption that will be useful for genotype-phenotype correlations.
    explanation: Variants differ in how strongly they impair respiration.
  downstream:
  - target: Reduced Mitochondrial tRNA-Ser(AGY) Charging and Stability
    causal_link_type: DIRECT
    description: Less synthetase activity leaves tRNA-Ser(AGY) uncharged.
- name: Reduced Mitochondrial tRNA-Ser(AGY) Charging and Stability
  biological_scale: MOLECULAR
  description: >-
    SARS2 charges both mitochondrial serine tRNAs, but disease variants
    affect mainly tRNA-Ser(AGY): its charged form is lost and the uncharged
    tRNA is degraded, while tRNA-Ser(UCN) is largely spared. The loss of
    tRNA-Ser(AGY) is proposed to be the main driver of the disease.
  biological_processes:
  - preferred_term: mitochondrial seryl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0070158
      label: mitochondrial seryl-tRNA aminoacylation
  evidence:
  - reference: PMID:21255763
    reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of amino acylation of the two target tRNAs, extracted from
      immortalized peripheral lymphocytes derived from two patients, revealed
      that the p.Asp390Gly mutation significantly impacts on the acylation of
      tRNA(Ser)(AGY) but probably not that of tRNA(Ser)(UCN).
    explanation: Charging of tRNA-Ser(AGY) is impaired in patient cells.
  - reference: PMID:21255763
    reference_title: Mutations in the mitochondrial seryl-tRNA synthetase cause hyperuricemia, pulmonary hypertension, renal failure in infancy and alkalosis, HUPRA syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Marked decrease in the expression of the nonacylated transcript and the
      complete absence of the acylated tRNA(Ser)(AGY) suggest that this
      mutation leads to significant loss of function and that the uncharged
      transcripts undergo degradation.
    explanation: Uncharged tRNA-Ser(AGY) is degraded.
  - reference: PMID:36350636
    reference_title: Selective degradation of tRNASer(AGY) is the primary driver for mitochondrial seryl-tRNA synthetase-related disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A marked reduction in mitochondrial tRNASer(AGY) was observed due to RNA
      degradation in patient-derived induced pluripotent stem cells (iPSCs),
      causing impaired translation and comprehensive mitochondrial function
      deficiencies.
    explanation: tRNA-Ser(AGY) is degraded in patient stem cells.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: Too little charged tRNA-Ser(AGY) limits translation of AGY serine codons.

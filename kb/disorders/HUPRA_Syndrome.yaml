diagnosis:
- name: Exome sequencing for biallelic SARS2 variants
  description: >-
    The diagnosis is molecular. A renal tubulopathy with hyperuricemia and
    alkalosis in a preterm infant with renal failure and pulmonary hypertension
    suggests it, but alkalosis and pulmonary hypertension can be absent, and
    muscle respiratory chain studies and lactate can be normal.
  evidence:
  - reference: PMID:38264205
    reference_title: "Variants in the SARS2 gene cause HUPRA syndrome with atypical features: two case reports and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using single whole exome sequencing, we identified two homozygous
      pathogenic variants in the SARS2 gene
    explanation: Exome sequencing made the diagnosis.
treatments:
- name: Supportive care with renal replacement therapy
  description: >-
    No disease-modifying therapy exists. Management is supportive: fluid,
    electrolyte and alkali or salt replacement as the tubulopathy requires,
    nutritional support, management of pulmonary hypertension, and dialysis
    for end-stage renal failure, as in one infant who started peritoneal
    dialysis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Peritoneal Dialysis
    term:
      id: NCIT:C15297
      label: Peritoneal Dialysis
  target_mechanisms:
  - target: Renal insufficiency
    description: Replaces failed renal function; it does not address the mitochondrial defect.
  evidence:
  - reference: PMID:24034276
    reference_title: A new mutation in the gene encoding mitochondrial seryl-tRNA synthetase as a cause of HUPRA syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A catheter was placed and ambulatory peritoneal dialysis was started due
      to creatinine values of 6.3 mg/dL.
    explanation: Peritoneal dialysis for renal failure in one infant.
animal_models:
- name: Sars2 patient-variant knock-in mouse
  species: Mouse
  genotype: Sars2 knock-in of either patient variant (c.654-14T>A or c.1519dupC equivalents)
  description: >-
    Mice carrying either of two patient SARS2 variants die early in embryonic
    development when homozygous; heterozygous mice have reduced serine tRNA
    levels in muscle.
  publication: PMID:36350636
  modeled_mechanisms:
  - target: Reduced Mitochondrial tRNA-Ser(AGY) Charging and Stability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Heterozygous mice show reduced serine tRNAs in muscle.
    limitations: >-
      Homozygous mice die as early embryos, so the renal, pulmonary and
      developmental disease of infants cannot be studied; only heterozygotes,
      which correspond to unaffected human carriers, survive.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Homozygous embryos die before any organ phenotype appears, so the model
        speaks only to the tRNA-level consequence in heterozygous tissue.
    evidence:
    - reference: PMID:36350636
      reference_title: Selective degradation of tRNASer(AGY) is the primary driver for mitochondrial seryl-tRNA synthetase-related disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Heterozygous mice displayed reduced muscle tissue-specific levels of tRNASers.
      explanation: Reduced serine tRNAs in heterozygous mouse muscle.
  evidence:
  - reference: PMID:36350636
    reference_title: Selective degradation of tRNASer(AGY) is the primary driver for mitochondrial seryl-tRNA synthetase-related disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Either mutation caused early embryonic fatality in mice.
    explanation: Homozygosity for either patient variant is embryonic lethal.
differential_diagnoses:
- name: SARS1-related neurodevelopmental disorder
  description: >-
    The cytoplasmic seryl-tRNA synthetase SARS1 causes a different recessive
    neurodevelopmental disorder; the paralogue names are easily confused.
  disease_term:
    preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
    term:
      id: MONDO:0060577
      label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
  notes: Curated separately as SARS1-Related_Neurodevelopmental_Disorder.
references:
- reference: PMID:33751860
  title: Novel SARS2 variants identified in a Chinese girl with HUPRA syndrome.
notes: >-
  No GeneReviews chapter covers SARS2 or HUPRA syndrome. Fewer than ten
  patients with HUPRA syndrome are reported; the 2021 review in PMID:33751860
  tabulates the first six and the 2023 report in PMID:38264205 adds two
  atypical cases. Survival in the first reports was 10 to 26 months
  (PMID:33751860). The NAR 2022 study (PMID:36350636) describes its patients'
  disorder as multisystem without naming it HUPRA; its mechanistic findings
  are used here for SARS2 loss of function in general.

    explanation: Muscle respiratory chain activity can be normal.
  downstream:
  - target: Renal Tubular Energy Failure
    causal_link_type: DIRECT
    description: The energy-demanding renal tubular epithelium is the tissue that fails first.
    evidence:
    - reference: PMID:38264205
      reference_title: "Variants in the SARS2 gene cause HUPRA syndrome with atypical features: two case reports and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Therefore, may account for tubulopathy, which needs high energy to

    snippet: "Elevated levels of DSM-IV-TR ADHD Inattentive symptoms were reported on the CAARS by 22% of the NPS sample."
    explanation: Reports the ADHD symptom frequency in the surveyed NPS cohort.

- name: Depression
  category: Behavioral
  description: >-
    Elevated depressive symptoms co-occurring with ADHD symptoms in adults with

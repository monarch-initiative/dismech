    On electron microscopy, NPS kidneys show characteristic irregular
    ("moth-eaten") thickening of the glomerular basement membrane with
    electron-lucent zones and deposits of fibrillar (striated type III) collagen
    in the lamina densa - the diagnostic ultrastructural lesion of NPS
    nephropathy.
  diagnostic: true
  evidence:

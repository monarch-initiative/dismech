animal_models:
- name: Lmx1b V265D/+ dominant-negative mouse
  species: Mouse
  genotype: Lmx1b V265D/+ (Icst), homeodomain missense abolishing DNA binding
  publication: PMID:24809698
  description: >-
    An ENU-induced homeodomain missense (V265D) that abolishes LMX1B DNA binding
    and acts dominant-negatively; heterozygotes develop glaucomatous eye disease,
    unlike heterozygous null mice which have no phenotype. Used to dissect the
    trabecular-meshwork mitochondrial mechanism of IOP elevation and its rescue
    by nicotinamide.
  modeled_mechanisms:
  - target: Trabecular Meshwork Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Single-cell profiling of V265D/+ trabecular meshwork shows TM3-specific
      mitochondrial dysfunction (swollen mitochondria, reduced cristae).
    limitations: >-
      V265D is a dominant-negative allele rather than the haploinsufficiency that
      predominates in human NPS, and models the ocular branch only.
    readouts:
    - name: TM3 mitochondrial ultrastructure
      target: Trabecular Meshwork Dysfunction
      direction: ALTERED
      interpretation: Swollen mitochondria with reduced cristae area in mutant TM3 cells.
      evidence:
      - reference: PMID:39829808
        reference_title: Single-cell profiling of trabecular meshwork identifies mitochondrial dysfunction in a glaucoma model that is protected by vitamin B3 treatment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mitochondria in TM cells of V265D/+ mice are swollen with a reduced cristae area, further supporting a role for mitochondrial dysfunction in the initiation of IOP elevation in these mice."
        explanation: Reports the mitochondrial ultrastructural readout in the model.
    - name: Intraocular pressure with nicotinamide
      target: Trabecular Meshwork Dysfunction
      direction: RESTORED
      interpretation: Vitamin B3 (nicotinamide) protected mutant mice from IOP elevation.
      evidence:
      - reference: PMID:39829808
        reference_title: Single-cell profiling of trabecular meshwork identifies mitochondrial dysfunction in a glaucoma model that is protected by vitamin B3 treatment.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "treatment with vitamin B3 (nicotinamide), to enhance mitochondrial function and metabolic resilience, significantly protected Lmx1b mutant mice from IOP elevation."
        explanation: Reports the therapeutic rescue readout in the model.
    evidence:
    - reference: PMID:24809698
      reference_title: "A dominant-negative mutation of mouse Lmx1b causes glaucoma and is semi-lethal via LDB1-mediated dimerization [corrected]."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous Icst causes glaucomatous eye defects and is semi-lethal, probably due to kidney failure."
      explanation: Establishes the model as informative for the ocular outflow mechanism.

- name: Lmx1b-null mouse
  species: Mouse
  genotype: Lmx1b knockout (homozygous null)
  publication: PMID:9590288
  description: >-
    Conventional Lmx1b knockout recapitulates the core limb phenotype
    (symmetrical ventral-ventral autopods lacking nails and patellae) and NPS-like
    kidney pathology, but is perinatal lethal and heterozygous nulls have no
    phenotype - so it models embryonic patterning rather than the adult human
    disease course.
  modeled_mechanisms:
  - target: Failed Dorsoventral Limb Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Homozygous loss reproduces failed dorsal limb specification with absent
      nails and patellae.
    limitations: >-
      Recapitulation requires the homozygous null; heterozygous null mice (the
      genotype analogous to human carriers) show no phenotype, and homozygotes
      die perinatally.
    evidence:
    - reference: PMID:9590288
      reference_title: Limb and kidney defects in Lmx1b mutant mice suggest an involvement of LMX1B in human nail patella syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lmx1b is essential for the specification of dorsal limb fates at both the zeugopodal and autopodal level with prominent phenotypes including an absence of nails and patellae."
      explanation: Establishes the null mouse as informative for the limb-patterning mechanism.

discussions:
- discussion_id: nps-haploinsufficiency-vs-dominant-negative
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is human NPS uniformly a haploinsufficiency disorder, or do some homeodomain
    variants act dominant-negatively - and does the mouse faithfully model the
    human dosage mechanism?
  rationale: >-
    Human NPS is dominantly inherited and largely attributed to
    haploinsufficiency, yet heterozygous Lmx1b-null mice have no phenotype while
    a heterozygous dominant-negative allele (V265D) does. This divergence means
    the standard mouse null does not model the human heterozygous state, and it
    is unresolved which human variants act by simple dosage loss versus
    dominant-negative interference - a distinction with implications for
    genotype-based prognosis and therapy.
  attaches_to:
  - pathophysiology#LMX1B Haploinsufficiency

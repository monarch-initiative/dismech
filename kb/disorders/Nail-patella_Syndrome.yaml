    reference_title: Kidney disease in nail-patella syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with NPS show characteristic irregular thickening of the glomerular basement membrane, including deposits of bundles of striated type III collagen fibers in the lamina densa"
    explanation: The pathognomonic ultrastructural GBM lesion of NPS on electron microscopy.


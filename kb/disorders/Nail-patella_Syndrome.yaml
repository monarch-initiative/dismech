    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "standard treatment for decreased bone mineral density, hypertension, constipation, inflammatory bowel disease, glaucoma, epilepsy, and dental anomalies"
    explanation: GeneReviews management confirms decreased bone mineral density as an NPS feature.

- name: Hypertension
  category: Physical
  description: >-
    Hypertension is a recognized manifestation managed as part of NPS care,

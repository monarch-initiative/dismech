name: Nail-patella Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  Nail-patella syndrome (NPS) is a rare autosomal dominant, multisystem
  connective-tissue disorder caused by heterozygous loss-of-function variants in
  the LIM-homeodomain transcription factor LMX1B. It classically presents with a
  tetrad of nail dysplasia, hypoplastic or absent patellae, elbow dysplasia, and
  iliac horns, with variable renal (proteinuric/FSGS-type nephropathy) and ocular
  (primary open-angle glaucoma) involvement and an emerging neurologic phenotype.
disease_term:
  preferred_term: nail-patella syndrome
  term:
    id: MONDO:0008061
    label: nail-patella syndrome
parents:
- Dysostosis
- Autosomal dominant disease

references:
- reference: PMID:20301311
  title: Nail-Patella Syndrome.
  tags:
  - GeneReviews

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    NPS is an autosomal dominant single-gene disorder caused by heterozygous
    LMX1B variants, with complete penetrance for the syndrome overall but highly
    variable expressivity of individual organ manifestations. Approximately 88%
    of probands have an affected parent; the remainder are simplex/de novo.
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NPS is inherited in an autosomal dominant manner. Eighty-eight percent of individuals diagnosed with NPS have an affected parent."
    explanation: GeneReviews establishes autosomal dominant inheritance and the proportion of familial cases.

pathophysiology:
- name: LMX1B Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in LMX1B (a LIM-homeodomain
    transcription factor on 9q33.3) reduce functional LMX1B dosage below a
    developmental threshold in every LMX1B-expressing lineage. Haploinsufficiency
    is the predominant mechanism (supported by whole-gene deletion phenocopies),
    though a subset of homeodomain missense alleles that abolish DNA binding can
    act by a dominant-negative mechanism. The reduced transcription-factor
    activity is the shared initiating lesion for the organ-specific branches
    below.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: LMX1B
      term:
        id: hgnc:6654
        label: LMX1B
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous loss-of-function reduces LMX1B dosage below the developmental
      threshold (haploinsufficiency); some homeodomain missense alleles are
      dominant-negative.
  downstream:
  - target: Failed Dorsoventral Limb Patterning
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9590288
      reference_title: Limb and kidney defects in Lmx1b mutant mice suggest an involvement of LMX1B in human nail patella syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lmx1b is essential for the specification of dorsal limb fates at both the zeugopodal and autopodal level with prominent phenotypes including an absence of nails and patellae."
      explanation: Targeted Lmx1b disruption in mice ties loss of LMX1B function directly to failed dorsal limb specification.
  - target: Podocyte Transcriptional Program Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11175791
      reference_title: Regulation of glomerular basement membrane collagen expression by LMX1B contributes to renal disease in nail patella syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data indicate that LMX1B directly regulates the coordinated expression of alpha 3(IV) and alpha 4(IV) collagen required for normal GBM morphogenesis and that its dysregulation in GBM contributes to the renal pathology and nephrosis in NPS."
      explanation: Links reduced LMX1B activity to dysregulation of its podocyte transcriptional targets.
  - target: Trabecular Meshwork Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39829808
      reference_title: Single-cell profiling of trabecular meshwork identifies mitochondrial dysfunction in a glaucoma model that is protected by vitamin B3 treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "LMX1B is emerging as a key transcription factor for normal mitochondrial function and its expression is much higher in TM3 cells than other limbal cells."
      explanation: Identifies LMX1B as an active transcription factor whose loss perturbs the trabecular meshwork.
  - target: Monoaminergic Neuron Developmental Deficit
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21184584
      reference_title: "Increased symptoms of attention deficit hyperactivity disorder and major depressive disorder symptoms in Nail-patella syndrome: potential association with LMX1B loss-of-function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Analyses of lmx1b mutant mice have revealed the role of Lmx1b in the development of mesencephalic dopaminergic neurons and the serotonergic system"
      explanation: Mouse data establish LMX1B's role in monoaminergic neuron development, the substrate for the neurologic branch.
  molecular_functions:
  - preferred_term: LMX1B DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:34545091
    reference_title: Identification of limb-specific Lmx1b auto-regulatory modules with Nail-patella syndrome pathogenicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LMX1B haploinsufficiency causes Nail-patella syndrome (NPS; MIM 161200), characterized by nail dysplasia, absent/hypoplastic patellae, chronic kidney disease, and glaucoma."
    explanation: States the human haploinsufficiency mechanism and the multiorgan phenotype it produces.

- name: Failed Dorsoventral Limb Patterning
  description: >-
    In the dorsal limb mesenchyme LMX1B is the master dorsalizing transcription
    factor (induced by Wnt7a from the dorsal ectoderm). Reduced dosage produces a
    partial "double-ventral" limb, manifesting as dysplasia of dorsal-derived
    structures: nails, patellae, elbows, and the iliac horns. In mice, complete
    loss yields symmetrical ventral-ventral autopods lacking nails and patellae.
  biological_scale: TISSUE
  downstream:
  - target: Nail dysplasia
  - target: Hypoplastic or absent patella
  - target: Radial head dislocation
  - target: Iliac horns
  biological_processes:
  - preferred_term: dorsal/ventral limb pattern formation
    modifier: DECREASED
    term:
      id: GO:0009953
      label: dorsal/ventral pattern formation
  evidence:
  - reference: PMID:34545091
    reference_title: Identification of limb-specific Lmx1b auto-regulatory modules with Nail-patella syndrome pathogenicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lmx1b is induced by Wnt7a from the dorsal ectoderm, and its expression is restricted to the dorsal mesoderm"
    explanation: Places LMX1B in the dorsalizing limb-patterning pathway whose failure underlies the skeletal tetrad.

- name: Podocyte Transcriptional Program Failure
  description: >-
    LMX1B is expressed in glomerular podocytes into postnatal life and is
    required to induce and maintain the podocyte differentiation program,
    including type IV collagen genes (COL4A3/COL4A4) and slit-diaphragm genes
    (NPHS2/podocin, CD2AP). Reduced LMX1B activity impairs this program and also
    the maintenance of the mature podocyte actin cytoskeleton.
  biological_scale: CELLULAR
  downstream:
  - target: Glomerular Basement Membrane Defect
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11175791
      reference_title: Regulation of glomerular basement membrane collagen expression by LMX1B contributes to renal disease in nail patella syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Lmx1b(-/-) mice, expression of both alpha(3)IV and alpha(4)IV collagen is strongly diminished in GBM, whereas that of alpha1, alpha2 and alpha5(IV) collagen is unchanged."
      explanation: Loss of the podocyte transcriptional program reduces the collagen chains needed for a normal GBM.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: podocyte development
    modifier: DECREASED
    term:
      id: GO:0072015
      label: podocyte development
  evidence:
  - reference: PMID:18535845
    reference_title: Kidney disease in nail-patella syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although LMX1B is a developmental LIM-homeodomain transcription factor, it is expressed in post-natal life in the glomerular podocyte, suggesting a regulatory role in that cell."
    explanation: Establishes LMX1B expression and regulatory role in the podocyte, the cell targeted in NPS nephropathy.
  - reference: PMID:23990680
    reference_title: LMX1B is essential for the maintenance of differentiated podocytes in adult kidneys.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our report establishes the importance of LMX1B in fully differentiated podocytes and argues that LMX1B is essential for the maintenance of an appropriately structured actin cytoskeleton in podocytes."
    explanation: Shows LMX1B is required for maintenance of adult podocytes, relevant to progressive nephropathy.

- name: Glomerular Basement Membrane Defect
  description: >-
    Reduced type IV collagen (alpha3/alpha4) deposition and podocyte dysfunction
    produce the characteristic ultrastructural GBM lesion of NPS: irregular
    ("moth-eaten") thickening with electron-lucent zones and deposits of fibrillar
    collagen. The filtration barrier defect causes proteinuria, hematuria, and, in
    a subset, FSGS-type glomerulosclerosis progressing to kidney failure.
  biological_scale: TISSUE
  downstream:
  - target: Proteinuria
  - target: Hematuria
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301311
      reference_title: Nail-Patella Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Kidney involvement, first manifest as proteinuria with or without hematuria, occurs in 30%-50% of affected individuals"
      explanation: The GBM filtration-barrier defect manifests as proteinuria with or without hematuria.
  - target: Focal segmental glomerulosclerosis
  - target: End-stage kidney disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18535845
      reference_title: Kidney disease in nail-patella syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A small minority (5-10%) of individuals with NPS develop nephrotic-range proteinuria as early as childhood or young adulthood and progress to end-stage kidney failure over variable periods of time."
      explanation: A subset with progressive nephrotic-range proteinuria advances to end-stage kidney failure.
  biological_processes:
  - preferred_term: glomerular basement membrane organization
    modifier: DECREASED
    term:
      id: GO:0071711
      label: basement membrane organization
  evidence:
  - reference: PMID:18535845
    reference_title: Kidney disease in nail-patella syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with NPS show characteristic irregular thickening of the glomerular basement membrane, including deposits of bundles of striated type III collagen fibers in the lamina densa"
    explanation: Describes the pathognomonic GBM ultrastructural lesion produced by this mechanism.

- name: Trabecular Meshwork Dysfunction
  description: >-
    LMX1B is one of the most active transcription factors in the anterior-segment
    trabecular meshwork and is most highly expressed in the contractile,
    metabolically active TM3 cell subtype. In an Lmx1b homeodomain-variant
    (V265D) mouse model, TM3 cells show mitochondrial swelling with reduced
    cristae, implicating mitochondrial dysfunction in outflow failure.
  biological_scale: CELLULAR
  downstream:
  - target: Elevated Intraocular Pressure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39829808
      reference_title: Single-cell profiling of trabecular meshwork identifies mitochondrial dysfunction in a glaucoma model that is protected by vitamin B3 treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mitochondria in TM cells of V265D/+ mice are swollen with a reduced cristae area, further supporting a role for mitochondrial dysfunction in the initiation of IOP elevation in these mice."
      explanation: Links LMX1B-mutant trabecular meshwork mitochondrial dysfunction to the initiation of IOP elevation.
  cell_types:
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  evidence:
  - reference: PMID:39829808
    reference_title: Single-cell profiling of trabecular meshwork identifies mitochondrial dysfunction in a glaucoma model that is protected by vitamin B3 treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LMX1B is emerging as a key transcription factor for normal mitochondrial function and its expression is much higher in TM3 cells than other limbal cells."
    explanation: Grounds the trabecular meshwork branch in LMX1B-dependent TM cell biology.

- name: Elevated Intraocular Pressure
  description: >-
    Impaired aqueous-humor outflow through the dysfunctional trabecular meshwork
    raises intraocular pressure, the proximate driver of the open-angle glaucoma
    and ocular hypertension seen at increased frequency and younger age in NPS.
  biological_scale: ORGANISM
  downstream:
  - target: Open-angle glaucoma
  - target: Ocular hypertension
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301311
      reference_title: Nail-Patella Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary open-angle glaucoma and ocular hypertension occur at increased frequency and at a younger age than in the general population."
      explanation: Elevated intraocular pressure manifests as ocular hypertension and open-angle glaucoma.
  evidence:
  - reference: PMID:24809698
    reference_title: "A dominant-negative mutation of mouse Lmx1b causes glaucoma and is semi-lethal via LDB1-mediated dimerization [corrected]."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous Icst causes glaucomatous eye defects and is semi-lethal, probably due to kidney failure."
    explanation: The dominant-negative Lmx1b allele produces glaucomatous eye disease, modeling the ocular outflow phenotype.

- name: Monoaminergic Neuron Developmental Deficit
  description: >-
    LMX1B is required for the specification and maintenance of midbrain
    dopaminergic and hindbrain serotonergic neurons and for dorsal spinal cord
    sensory-relay interneurons. Reduced dosage is proposed to underlie the
    reduced pain/temperature sensation and the elevated ADHD/depressive
    symptomatology reported in NPS. This branch is the most inferential, resting
    largely on mouse neurodevelopmental biology with human correlation from a
    survey study.
  biological_scale: CELLULAR
  downstream:
  - target: Impaired pain sensation
  - target: Attention deficit hyperactivity disorder
  - target: Depression
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:21184584
    reference_title: "Increased symptoms of attention deficit hyperactivity disorder and major depressive disorder symptoms in Nail-patella syndrome: potential association with LMX1B loss-of-function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analyses of lmx1b mutant mice have revealed the role of Lmx1b in the development of mesencephalic dopaminergic neurons and the serotonergic system"
    explanation: Supports the monoaminergic developmental role underlying the neurologic/neuropsychiatric branch.

phenotypes:
- name: Nail dysplasia
  category: Physical
  description: >-
    Nails may be absent, hypoplastic, or dystrophic; ridged, pitted, discolored,
    or split, following a radial-to-ulnar severity gradient (thumb most severe).
    A defining tetrad feature.
  phenotype_term:
    preferred_term: Nail dysplasia
    term:
      id: HP:0002164
      label: Nail dysplasia
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nail-patella syndrome (NPS) encompasses the classic clinical tetrad of nail abnormalities, abnormal and unstable patella with knee abnormalities, limited elbow mobility, and iliac horns on radiographs."
    explanation: Nail abnormalities are the first, defining element of the NPS tetrad.

- name: Hypoplastic or absent patella
  category: Physical
  description: >-
    The patellae may be small, irregularly shaped, or absent, causing recurrent
    subluxation/dislocation, instability, and early osteoarthritis.
  phenotype_term:
    preferred_term: Hypoplastic or absent patella
    term:
      id: HP:0006498
      label: Aplasia/Hypoplasia of the patella
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patellae may be small, irregularly shaped, or absent."
    explanation: GeneReviews describes the patellar dysplasia (hypoplasia to aplasia) that defines the second tetrad feature.

- name: Limited elbow movement
  category: Physical
  description: >-
    Elbow dysplasia limits mobility, part of the classic NPS tetrad.
  phenotype_term:
    preferred_term: Limited elbow mobility
    term:
      id: HP:0002996
      label: Limited elbow movement
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nail-patella syndrome (NPS) encompasses the classic clinical tetrad of nail abnormalities, abnormal and unstable patella with knee abnormalities, limited elbow mobility, and iliac horns on radiographs."
    explanation: Limited elbow mobility is the third element of the NPS tetrad.

- name: Radial head dislocation
  category: Physical
  description: >-
    Elbow dysplasia with limitation of extension, pronation and supination,
    cubitus valgus, antecubital pterygia, and posterior subluxation of the
    radial head.
  phenotype_term:
    preferred_term: Radial head dislocation (elbow dysplasia)
    term:
      id: HP:0003083
      label: Dislocated radial head
  evidence:
  - reference: PMID:18535845
    reference_title: Kidney disease in nail-patella syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elbow dysplasia, often involving posterior subluxation of the radial head"
    explanation: Documents the radial-head component of NPS elbow dysplasia.

- name: Iliac horns
  category: Physical
  description: >-
    Bilateral conical bony processes projecting posteriorly and laterally from
    the ilia; asymptomatic and radiographically detected. Considered
    pathognomonic, present in about 70% of affected individuals.
  phenotype_term:
    preferred_term: Iliac horns
    term:
      id: HP:0009780
      label: Iliac horns
  frequency: FREQUENT
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Iliac horns are bilateral, conical, bony processes that project posteriorly and laterally from the central part of the iliac bones of the pelvis."
    explanation: Defines the pathognomonic iliac-horn feature.
  - reference: PMID:18535845
    reference_title: Kidney disease in nail-patella syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although iliac horns are pathognomonic of NPS, they occur in only approximately 70% of individuals with NPS"
    explanation: Quantifies iliac-horn frequency.

- name: Proteinuria
  category: Laboratory
  description: >-
    Kidney involvement first manifests as proteinuria with or without hematuria
    in 30-50% of affected individuals; may be intermittent, remit, or progress.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  frequency: FREQUENT
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney involvement, first manifest as proteinuria with or without hematuria, occurs in 30%-50% of affected individuals; end-stage kidney disease occurs in up to 15% of affected individuals."
    explanation: Gives the proteinuria frequency for NPS nephropathy.

- name: Hematuria
  category: Laboratory
  description: >-
    Microscopic hematuria may accompany proteinuria in NPS nephropathy.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney involvement, first manifest as proteinuria with or without hematuria, occurs in 30%-50% of affected individuals"
    explanation: Documents hematuria as part of NPS renal involvement.

- name: Focal segmental glomerulosclerosis
  category: Physical
  description: >-
    NPS nephropathy shows FSGS-pattern glomerulosclerosis on light microscopy
    with the characteristic ultrastructural GBM lesion; specific LMX1B
    homeodomain variants can cause isolated FSGS without extrarenal features.
  phenotype_term:
    preferred_term: Focal segmental glomerulosclerosis
    term:
      id: HP:0000097
      label: Focal segmental glomerulosclerosis
  evidence:
  - reference: PMID:23687361
    reference_title: LMX1B mutations cause hereditary FSGS without extrarenal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in LMX1B cause nail-patella syndrome, characterized by dysplasia of the patellae, nails, and elbows and FSGS with specific ultrastructural lesions of the glomerular basement membrane (GBM)."
    explanation: Establishes the FSGS pattern of NPS renal disease.

- name: End-stage kidney disease
  category: Physical
  description: >-
    A minority (up to ~15%) of affected individuals progress to end-stage kidney
    disease requiring dialysis or transplantation.
  phenotype_term:
    preferred_term: End-stage kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "end-stage kidney disease occurs in up to 15% of affected individuals"
    explanation: Quantifies progression to ESKD.

- name: Open-angle glaucoma
  category: Physical
  description: >-
    Primary open-angle glaucoma occurs at increased frequency and at a younger
    age than in the general population, warranting lifelong ophthalmologic
    surveillance.
  phenotype_term:
    preferred_term: Open-angle glaucoma
    term:
      id: HP:0012108
      label: Open angle glaucoma
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary open-angle glaucoma and ocular hypertension occur at increased frequency and at a younger age than in the general population."
    explanation: Documents open-angle glaucoma as an NPS feature.

- name: Ocular hypertension
  category: Physical
  description: >-
    Elevated intraocular pressure without established glaucomatous damage occurs
    at increased frequency in NPS.
  phenotype_term:
    preferred_term: Ocular hypertension
    term:
      id: HP:0007906
      label: Ocular hypertension
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary open-angle glaucoma and ocular hypertension occur at increased frequency and at a younger age than in the general population."
    explanation: Documents ocular hypertension in NPS.

- name: Impaired pain sensation
  category: Physical
  description: >-
    Reduced pain and temperature sensation, attributed to failed development of
    dorsal spinal cord nociceptive-relay interneurons; a source of unrecognized
    burns and injury requiring patient education.
  phenotype_term:
    preferred_term: Reduced pain and temperature sensation
    term:
      id: HP:0007328
      label: Impaired pain sensation
  evidence:
  - reference: PMID:20301311
    reference_title: Nail-Patella Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "education regarding reduced pain and temperature sensation to avoid burns and injuries"
    explanation: GeneReviews management confirms reduced pain and temperature sensation as an NPS feature.

- name: Attention deficit hyperactivity disorder
  category: Behavioral

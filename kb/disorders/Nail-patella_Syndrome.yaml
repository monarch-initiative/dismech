diagnosis:
- name: Molecular genetic testing of LMX1B
  description: >-
    Diagnosis is clinical (classic tetrad; iliac horns are pathognomonic) and is
    confirmed by identifying a heterozygous pathogenic LMX1B variant. A tiered
    approach uses single-gene sequencing, then gene-targeted deletion/duplication
    analysis, with renal/glaucoma multigene panels or exome/genome sequencing and
    karyotype for atypical or sequencing-negative cases.

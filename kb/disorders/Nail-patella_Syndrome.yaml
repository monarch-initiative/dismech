genetic:
- name: LMX1B
  gene_term:
    preferred_term: LMX1B
    term:
      id: hgnc:6654
      label: LMX1B
  notes: >-
    NPS is caused by heterozygous loss-of-function variants in LMX1B (missense,
    nonsense, frameshift, splice-site, whole/partial gene deletions, rare
    translocations/inversions, and non-coding LARM enhancer variants).
    Haploinsufficiency is the predominant mechanism, although some homeodomain
    missense alleles that abolish DNA binding may act dominant-negatively.
    Mutation location carries genotype-phenotype information for nephropathy:
    homeodomain variants confer a higher proteinuria risk than LIM-domain
    variants, whereas no clear correlation exists for extrarenal features.
    Specific homeodomain missense variants at residue R246 (R246Q/R246P) cause
    an allelic, isolated LMX1B-associated FSGS/nephropathy without the classic
    nail/skeletal/ocular features, so LMX1B belongs on hereditary-FSGS gene
    panels even absent NPS skeletal findings.
  evidence:
  - reference: PMID:34545091
    reference_title: Identification of limb-specific Lmx1b auto-regulatory modules with Nail-patella syndrome pathogenicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report on two NPS patient families with normal LMX1B coding sequence, but with loss-of-function variations in the LARM1/2 region"
    explanation: Demonstrates loss-of-function LMX1B (including non-coding enhancer) variants as the cause of NPS in patient families.
  - reference: PMID:15928687
    reference_title: Genotype-phenotype studies in nail-patella syndrome show that LMX1B mutation location is involved in the risk of developing nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with an LMX1B mutation located in the homeodomain showed significantly more frequent and higher values of proteinuria compared to subjects carrying mutations in the LIM domains."
    explanation: Establishes the mutation-location genotype-phenotype correlation for nephropathy risk.
  - reference: PMID:24809698
    reference_title: "A dominant-negative mutation of mouse Lmx1b causes glaucoma and is semi-lethal via LDB1-mediated dimerization [corrected]."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Icst is a dominant-negative allele of Lmx1b. These findings indicate a reassessment of whether nail-patella syndrome is always haploinsufficient."
    explanation: Documents that a homeodomain missense allele can act by a dominant-negative mechanism rather than pure haploinsufficiency.
  - reference: PMID:23687361
    reference_title: LMX1B mutations cause hereditary FSGS without extrarenal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we screened 73 additional unrelated families with FSGS and found mutations involving the same amino acid (R246) in 2 families"
    explanation: Supports the isolated LMX1B-associated (R246) nephropathy allelic phenotype without extrarenal features.
  - reference: CGGV:assertion_c89e1a52-3ef8-4a61-bf56-1e43cf88fc6e-2021-07-27T144211.405Z
    reference_title: LMX1B / nail-patella syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LMX1B | HGNC:6654 | nail-patella syndrome | MONDO:0008061 | AD | Definitive"
    explanation: ClinGen classifies the LMX1B-nail-patella syndrome gene-disease relationship as Definitive (autosomal dominant).


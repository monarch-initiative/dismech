discussions:
- discussion_id: gap_hhat_skeletal_phenotype_uncharacterised
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the radiographic features of the chondrodysplasia in HHAT-related
    disease, and do they justify its placement among the spondylometaphyseal
    dysplasias?
  attaches_to:
  - pathophysiology#Skeletal Dysplasia with Short Stature
  - phenotypes#Short stature
  - phenotypes#Skeletal dysplasia
  rationale: >-
    The nosology places this syndrome in the spondylometaphyseal group, but the
    published reports describe the skeletal component only as "skeletal
    dysplasia" or as a generalised chondrodysplasia with micromelia,
    brachydactyly and a bell-shaped thorax, without the vertebral and
    metaphyseal radiographic detail that the group name asserts. Every other row
    in the group is defined radiographically. Two further things point the same
    way. MONDO gives MONDO:0010814 no skeletal dysplasia parent at all, placing
    it under syndromic disease, hereditary disease and 46,XY disorder of sex
    development. And mechanistically the disorder sits apart: the other five
    group-12 members act through matrix, secretion or growth-plate metabolism,
    while this one is a morphogen-range defect that happens to include cartilage
    among its targets. The phenotype has been delineated carefully for its
    neurological, ocular and gonadal features, and a comparable radiographic
    series has not been published - unsurprising given that most reported
    conceptuses did not survive, but it leaves the classification resting on less
    evidence than the rest of the group. Recording the mismatch matters because a
    curator using group 12 as a proxy for a radiographic phenotype will be misled
    by this member. The classification itself follows the nosology as a
    transcription, per the schema's guidance that this axis transcribes an expert
    committee's placements rather than inferring them.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      The most detailed published delineation, which still describes the
      skeletal component only as "skeletal dysplasia".
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first sibling displayed severe dwarfism with generalized chondrodysplasia,
      a narrow, bell-shaped thorax, micromelia, brachydactyly, severe microcephaly
      with cerebellar vermis hypoplasia, facial anomalies, hypoplastic irides, and
      coloboma of both optic discs.
    explanation: >-
      The founding skeletal description is generalised rather than specifically
      spondylometaphyseal, which is the basis of the question.
  proposed_experiments:
  - experiment_id: exp_hhat_radiographic_reappraisal
    name: Radiographic reappraisal of the reported HHAT skeletal phenotype
    description: >-
      Obtain and re-read the original skeletal surveys of the reported patients,
      scoring specifically for vertebral and metaphyseal involvement against the
      criteria used for the other group-12 disorders, and refer the finding to
      the ISDS Nosology Committee.
    would_support:
    - pathophysiology#Skeletal Dysplasia with Short Stature
    supporting_outcome:
    - >-
      Documented platyspondyly with metaphyseal irregularity would confirm the
      committee's placement on radiographic grounds and close the question.
    would_refute:
    - pathophysiology#Skeletal Dysplasia with Short Stature
    refuting_outcome:
    - >-
      Absence of a vertebral-plus-metaphyseal pattern would make this a placement
      of convenience for a syndromic chondrodysplasia and a candidate for
      regrouping in a future revision.
- discussion_id: hhat_phenotype_breadth_and_null_lethality
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#HHAT-related chondrodysplasia with 46,XY disorder of sex development
  prompt: >-
    How wide is the HHAT phenotype, and is a complete null ever compatible with
    live birth?
  rationale: >-
    The replication question this gap originally recorded has been answered. The
    2014 authors searched large skeletal-disorder and DSD cohorts without finding
    a second family; eight patients were on record by 2025 and a further four
    were then reported from two unrelated families, so the gene-disease
    relationship is replicated and the single-family framing no longer holds.
    What the newer series changes is the phenotype rather than the genotype -
    ptosis and marked visual impairment appeared for the first time, and
    microphthalmia joined coloboma in the ocular spectrum, which is the signature
    of a boundary still being set by who happens to be looked at. Two things stay
    open. The original search was framed by chondrodysplasia-plus-DSD and would
    have missed a milder or differently weighted presentation. And because
    Hedgehog signalling is required across so many systems, a complete null may
    be embryonic-lethal and so never ascertained as a syndrome at all - every
    reported allele is missense or an in-frame deletion.
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that the frequency of pathogenic variants of HHAT is extremely low
      within the general population, which would explain the absence of other listed
      cases of Nivelon-Nivelon-Mabille syndrome.
    explanation: >-
      The founding authors' reading of their failed search. Later reports found
      the additional families this inference argued against, so it is retained as
      the 2014 position rather than the current one.
  - reference: PMID:40326711
    reference_title: >-
      Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ptosis and marked visual impairment were present only in the current study.
    explanation: >-
      Features appearing for the first time in the ninth-to-twelfth patients is
      the signature of a phenotype whose boundary is still being drawn by
      ascertainment.
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is possible that other mutations in the HHAT locus may lead to severe defects
      in HHAT
    explanation: >-
      The authors raise the possibility of a broader allelic spectrum, which is
      the alternative to simple rarity recorded in this gap.
  proposed_experiments:
  - experiment_id: exp_hhat_phenotype_agnostic_variant_search
    name: Phenotype-agnostic search for biallelic HHAT variants
    description: >-
      Query large aggregated sequencing datasets and matchmaking services for
      biallelic HHAT variants without conditioning on chondrodysplasia or DSD,
      and separately assess whether HHAT is depleted of biallelic
      loss-of-function in population reference data to the degree expected of an
      embryonic-lethal gene.
    would_support:
    - pathophysiology#Biallelic HHAT Variants in the MBOAT Domain
    supporting_outcome:
    - >-
      Further unrelated families with biallelic HHAT variants and an overlapping
      phenotype would extend the allelic and phenotypic series.
    would_refute:
    - disease#HHAT-related chondrodysplasia with 46,XY disorder of sex development
    refuting_outcome:
    - >-
      Biallelic HHAT carriers with no chondrodysplasia and no DSD would argue
      that the reported syndrome requires something beyond the HHAT genotype
      alone.

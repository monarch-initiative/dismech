differential_diagnoses:
- name: Holoprosencephaly spectrum from SHH pathway variants
  description: >-
    Variants in SHH itself and in its pathway cause holoprosencephaly with
    midline craniofacial anomalies. The gonadal and skeletal features are what
    point past those genes to HHAT, since only HHAT acts on all three Hedgehog
    ligands at once.
  distinguishing_features:
  - 46,XY gonadal dysgenesis, which SHH-pathway holoprosencephaly does not cause
  - Chondrodysplasia with short stature from attenuated Indian Hedgehog signalling
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation occurred in the conserved membrane bound O-acyltransferase (MBOAT) domain and experimentally disrupted the ability of HHAT to palmitoylate Hh proteins such as DHH and SHH.
    explanation: >-
      Establishes that HHAT acts on more than one Hedgehog ligand, which is why
      its phenotype exceeds that of any single-ligand defect.
discussions:
- discussion_id: gap_hhat_skeletal_phenotype_uncharacterised
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the radiographic features of the chondrodysplasia in HHAT-related
    disease, and do they justify its placement among the spondylometaphyseal
    dysplasias?
  attaches_to:
  - pathophysiology#Skeletal Dysplasia with Short Stature
  - phenotypes#Short stature
  rationale: >-
    The nosology places this syndrome in the spondylometaphyseal group, but the
    published reports describe the skeletal component only as "skeletal
    dysplasia" or "chondrodysplasia" with short stature, without the vertebral
    and metaphyseal radiographic detail that the group name asserts. Every other
    row in the group is defined radiographically. The phenotype has been
    delineated carefully for its neurological, ocular and gonadal features, and
    a comparable radiographic series has not been published - unsurprising given
    that most reported conceptuses did not survive, but it leaves the
    classification resting on less evidence than the rest of the group.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the phenotype.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      The most detailed published delineation, which still describes the
      skeletal component only as "skeletal dysplasia".

name: HHAT-related chondrodysplasia with 46,XY disorder of sex development
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive multiple congenital anomaly syndrome caused by biallelic
  HHAT variants, listed historically as chondrodysplasia-pseudohermaphroditism
  syndrome and now more often as Nivelon-Nivelon-Mabille syndrome or
  HHAT-related multiple congenital anomaly syndrome. The phenotype spans
  microcephaly, cerebellar vermis hypoplasia, holoprosencephaly, agenesis of the
  corpus callosum, intellectual disability, short stature and skeletal dysplasia,
  microphthalmia or anophthalmia, and 46,XY gonadal dysgenesis presenting as
  female external genitalia. HHAT is the acyltransferase that attaches palmitate
  to Hedgehog ligands, a modification required for their multimerisation and
  long-range signalling potency, so the syndrome is what happens when every
  Hedgehog ligand - Sonic, Indian and Desert - is under-modified at once. That
  explains its otherwise puzzling combination: SHH governs midline forebrain and
  craniofacial patterning, IHH the growth plate, DHH testicular cord formation
  and fetal Leydig cell differentiation. It remains the only reported human
  disease of Hedgehog ligand lipidation.
disease_term:
  preferred_term: chondrodysplasia with 46,XY disorder of sex development
  term:
    id: MONDO:0010814
    label: chondrodysplasia-pseudohermaphroditism syndrome
parents:
- hereditary disease
synonyms:
- Nivelon-Nivelon-Mabille syndrome
- HHAT-related multiple congenital anomaly syndrome
- chondrodysplasia-pseudohermaphroditism syndrome
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 12
      "Spondylometaphyseal dysplasias (SMD)", row NOS 12-0060
      "Chondrodysplasia-pseudohermaphroditism syndrome, HHAT-related"
      (MIM 600092, autosomal recessive). The nosology retains the 1992 name of
      the condition; this entry uses a current one and keeps the historical
      form as a synonym so the nosology row and the MONDO class both remain
      findable.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic HHAT variants, reported as homozygous missense changes and one
    homozygous in-frame deletion in consanguineous or related families, with
    healthy heterozygous parents.
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we report a unique case of autosomal recessive syndromic 46,XY Disorder of Sex Development (DSD) with testicular dysgenesis and chondrodysplasia resulting from a homozygous G287V missense mutation in the hedgehog acyl-transferase (HHAT) gene.
    explanation: >-
      Establishes recessive inheritance and the homozygous causal variant.
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents were healthy and found to be carriers of this sequence variant while it was absent in the unaffected elder female sibling.
    explanation: >-
      Segregation evidence consistent with recessive inheritance in an
      independent family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. Twelve patients are on record: eight reported up to 2025, plus
    four new patients from two unrelated families in a 2025 series. Three
    families had been reported at the time of the 2021 delineation, the third
    contributing three affected conceptuses. The founding 2014 report noted that
    an explicit search through large skeletal-disorder and DSD cohorts had found
    no second family - a statement about ascertainment in 2014, since superseded.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we describe the third family with multiple malformations in three pregnancies with a novel biallelic in-frame deletion, c.365_367del; (p.Thr122del) in exon 5 of HHAT in the living proband.
    explanation: >-
      Establishes the number of reported families at the 2021 delineation.
  - reference: PMID:40326711
    reference_title: >-
      Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only eight patients with NNMS have been reported in the literature. In
      this study, four new patients from two unrelated families were presented
    explanation: >-
      Gives the current caseload - twelve patients across multiple families -
      which supersedes the founding report's single-family framing.
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite an extensive search through large cohorts of patients suffering from
      skeletal disorders and/or DSD, we have not been able to identify a second
      familial case with a pathogenic mutation in the HHAT locus.
    explanation: >-
      Documents the deliberate, unsuccessful 2014 search for further cases.
      Recorded as the ascertainment state at gene discovery, not as the current
      caseload - further families were reported subsequently.
pathophysiology:
- name: Biallelic HHAT Variants in the MBOAT Domain
  biological_scale: MOLECULAR
  description: >-
    The reported disease alleles - G287V, L257P and the in-frame T122del -
    fall in or near the conserved membrane-bound O-acyltransferase (MBOAT)
    domain that carries the enzyme's catalytic activity. That clustering is the
    structural counterpart of the functional result: the mutant enzyme cannot
    palmitoylate its substrates.
  genes:
  - preferred_term: HHAT
    term:
      id: hgnc:18270
      label: HHAT
  molecular_functions:
  - preferred_term: palmitoyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016409
      label: palmitoyltransferase activity
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation occurred in the conserved membrane bound O-acyltransferase (MBOAT) domain and experimentally disrupted the ability of HHAT to palmitoylate Hh proteins such as DHH and SHH.
    explanation: >-
      Locates the variant in the catalytic domain and demonstrates the
      functional consequence experimentally.
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Leu257 residue also lies in the MBOAT domain.
    explanation: >-
      Confirms that a second independent family's variant falls in the same
      catalytic domain.
  downstream:
  - target: Failure of Hedgehog Ligand Palmitoylation
    description: >-
      Loss of HHAT acyltransferase activity leaves SHH, IHH and DHH without
      their N-terminal palmitate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24784881
      reference_title: >-
        Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This mutation occurred in the conserved membrane bound O-acyltransferase (MBOAT) domain and experimentally disrupted the ability of HHAT to palmitoylate Hh proteins such as DHH and SHH.
      explanation: >-
        Direct demonstration that the mutant enzyme fails to palmitoylate
        Hedgehog ligands.
- name: Failure of Hedgehog Ligand Palmitoylation
  biological_scale: MOLECULAR
  description: >-
    Hedgehog proteins are covalently modified with both cholesterol and
    palmitate, and those lipids are what allow the ligand to multimerise and to
    signal at a distance rather than only to its immediate neighbours. Without
    palmitoylation the ligand is made and secreted but is a weak,
    short-range morphogen. Because HHAT acts on all three mammalian Hedgehog
    ligands, one enzyme defect attenuates three developmental programmes at
    once.
  biological_processes:
  - preferred_term: protein palmitoylation
    modifier: DECREASED
    term:
      id: GO:0018345
      label: protein palmitoylation
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Post-translational covalent attachment of cholesterol and palmitate to Hh proteins are critical for multimerization and long range signaling potency.
    explanation: >-
      Establishes why loss of the palmitate specifically degrades long-range
      signalling.
  - reference: PMID:30912300
    reference_title: >-
      Biallelic novel missense HHAT variant causes syndromic microcephaly and cerebellar-vermis hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      encoding an enzyme required for the attachment of palmitoyl residues that are critical for multimerization and long and short range hedgehog signaling
    explanation: >-
      Independent statement of the enzyme's role in Hedgehog signalling range.
  downstream:
  - target: Attenuated Hedgehog Signalling Across Multiple Developmental Fields
    description: >-
      Under-modified ligand means weakened Hedgehog pathway output in every
      tissue that depends on it.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24784881
      reference_title: >-
        Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The Hedgehog (Hh) family of secreted proteins act as morphogens to control embryonic patterning and development in a variety of organ systems.
      explanation: >-
        Establishes the breadth of developmental programmes the pathway
        controls, and so the breadth of the consequence.
- name: Attenuated Hedgehog Signalling Across Multiple Developmental Fields
  biological_scale: TISSUE
  description: >-
    The common node from which the syndrome's separate features descend. Mouse
    Hhat loss of function recapitulates most of the human testicular, skeletal,
    neuronal and growth phenotypes, which is the strongest evidence that the
    diverse human features share this single upstream cause rather than
    reflecting a contiguous-gene effect or coincidence.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with the patient phenotype, HHAT was found to be expressed in the somatic cells of both XX and XY gonads at the time of sex determination, and Hhat loss of function in mice recapitulates most of the testicular, skeletal, neuronal and growth defects observed in humans.
    explanation: >-
      Mouse genetics establishing that one enzyme's loss reproduces the
      multi-system human phenotype.
  downstream:
  - target: Testicular Dysgenesis with 46,XY Disorder of Sex Development
    description: >-
      Desert Hedgehog signalling from Sertoli cells is the arm that fails in the
      gonad.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of DHH signalling to the fetal Leydig and peritubular myoid lineages.
    evidence:
    - reference: PMID:24784881
      reference_title: >-
        Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the developing testis, HHAT is not required for Sertoli cell commitment but plays a role in proper testis cord formation and the differentiation of fetal Leydig cells.
      explanation: >-
        Localises the gonadal defect downstream of Sertoli cell commitment, at
        cord formation and fetal Leydig differentiation.
  - target: Midline Forebrain and Craniofacial Maldevelopment
    description: >-
      Sonic Hedgehog patterns the ventral midline of the forebrain and the face;
      attenuating it produces the holoprosencephaly end of the spectrum.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33749989
      reference_title: >-
        Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
      explanation: >-
        Records holoprosencephaly and the associated midline features among the
        consequences of HHAT loss.
  - target: Cerebellar Hypoplasia
    description: >-
      A distinct Hedgehog-dependent developmental programme from the ventral
      midline one, and the arm for which the independent human evidence is
      strongest.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30912300
      reference_title: >-
        Biallelic novel missense HHAT variant causes syndromic microcephaly and cerebellar-vermis hypoplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The phenotypic overlap with the family we report herein provides further evidence implicating HHAT in cerebellar development and the pathogenesis of this rare spectrum.
      explanation: >-
        Independent human evidence implicating HHAT specifically in cerebellar
        development.
  - target: Microcephaly with Neurodevelopmental Impairment
    description: >-
      Reduced brain growth with intellectual disability, present across the
      reported families.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30912300
      reference_title: >-
        Biallelic novel missense HHAT variant causes syndromic microcephaly and cerebellar-vermis hypoplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report two siblings with microcephaly, early infantile onset seizures, and cerebellar vermis hypoplasia, in whom whole exome sequencing revealed a novel homozygous missense
      explanation: >-
        Documents microcephaly and seizures in a molecularly confirmed sibship.
  - target: Skeletal Dysplasia with Short Stature
    description: >-
      Indian Hedgehog is the growth-plate Hedgehog ligand, and its attenuation
      is the presumed route to the chondrodysplasia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33749989
      reference_title: >-
        Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HHAT knockout mice showed that the loss of function of HHAT can cause severe malformations that include holoprosencephaly, acrania, agnathia, dwarfism, skeletal defects, osteochondrogenic defects, and variation of sexual characteristics
      explanation: >-
        Mouse knockout evidence including the skeletal and osteochondrogenic
        defects this node describes.
- name: Testicular Dysgenesis with 46,XY Disorder of Sex Development
  biological_scale: ORGANISM
  description: >-
    Gonadal dysgenesis in a 46,XY individual, presenting as female external
    genitalia. HHAT is expressed in the somatic cells of both XX and XY gonads
    at the time of sex determination, and the defect is downstream of Sertoli
    cell commitment - the cells are specified, but testis cord formation and
    fetal Leydig differentiation fail.
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, they provide the first clinical evidence of the essential role played by lipid modification of Hh proteins in human testicular organogenesis and embryonic development.
    explanation: >-
      States the human significance of the gonadal phenotype.
  downstream:
  - target: Gonadal dysgenesis
    causal_link_type: DIRECT
    description: >-
      Failure of testis cord formation and fetal Leydig differentiation is the
      gonadal dysgenesis itself, read at the level of the organ.
  - target: Primary amenorrhea
    causal_link_type: DIRECT
    description: >-
      A dysgenetic testis cannot support puberty, so menarche never occurs
      despite normal external female genitalia.
- name: Midline Forebrain and Craniofacial Maldevelopment
  biological_scale: ORGANISM
  description: >-
    Holoprosencephaly, agenesis of the corpus callosum, microphthalmia or
    anophthalmia, and a characteristic face with deep-set eyes, small irides and
    an everted upper lip - the ventral midline programme that Sonic Hedgehog
    patterns.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      Names the midline forebrain and craniofacial features of this node within
      the delineated spectrum.
  downstream:
  - target: Holoprosencephaly
    causal_link_type: DIRECT
    description: >-
      Incomplete cleavage of the ventral forebrain, the canonical readout of
      attenuated Sonic Hedgehog signalling at the midline.
  - target: Agenesis of corpus callosum
    causal_link_type: DIRECT
    description: >-
      Callosal agenesis, the commissural consequence of the same midline
      patterning failure.
  - target: Microphthalmia
    causal_link_type: DIRECT
    description: >-
      Small globes; Hedgehog signalling sets eye-field size as well as optic
      fissure closure.
  - target: Optic disc coloboma
    causal_link_type: DIRECT
    description: >-
      Failure of optic fissure closure, a recognised consequence of deficient
      Sonic Hedgehog signalling in the developing eye.
  - target: Iris hypoplasia
    causal_link_type: DIRECT
    description: The anterior-segment component of the same ocular Hedgehog signature.
  - target: Deeply set eye
    causal_link_type: DIRECT
    description: >-
      Part of the recognisable craniofacial appearance produced by the midline
      patterning defect.
  - target: Ptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported for the first time in the 2025 series. No mechanism has been
      proposed and it may reflect ascertainment rather than a distinct
      developmental route.
  - target: Myopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Refractive error identified at adolescent follow-up, plausibly secondary to
      the globe and anterior-segment maldevelopment rather than an independent
      feature.
- name: Cerebellar Hypoplasia
  biological_scale: ORGANISM
  description: >-
    A small cerebellar vermis. This is a separate Hedgehog-dependent programme
    from the ventral midline one, and the feature that a molecularly confirmed
    sibship established as implicating HHAT in cerebellar development
    specifically.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      Names the cerebellar feature within the delineated spectrum.
  downstream:
  - target: Cerebellar vermis hypoplasia
    causal_link_type: DIRECT
    description: >-
      Hypoplasia of the vermis, whose granule precursors proliferate under Sonic
      Hedgehog control.
- name: Microcephaly with Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    Microcephaly with intellectual disability, and early infantile seizures in
    some patients.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      Names microcephaly and intellectual disability within the delineated
      spectrum.
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
    description: >-
      Reduced brain growth, present across the reported families.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Whether it follows from the reduced brain growth, the cerebellar
      hypoplasia, or the seizures is not established.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Early infantile onset seizures in a molecularly confirmed sibship; the
      route from attenuated Hedgehog signalling to cortical hyperexcitability
      has not been worked out.
- name: Skeletal Dysplasia with Short Stature
  biological_scale: ORGANISM
  description: >-
    Chondrodysplasia with short stature, the feature that places the syndrome in
    the skeletal nosology at all. It is the least well characterised arm of the
    phenotype: the reports describe it as skeletal dysplasia without the
    radiographic detail that would let it be typed within the
    spondylometaphyseal group.
  evidence:
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      Records short stature and skeletal dysplasia in the delineated spectrum,
      at the level of detail the literature provides.
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
    description: >-
      Indian Hedgehog drives the growth-plate proliferative programme, so
      attenuating it shortens the long bones.
  - target: Skeletal dysplasia
    causal_link_type: DIRECT
    description: >-
      The generalised chondrodysplasia, which is the feature the ISDS group-12
      assignment rests on.
  - target: Micromelia
    causal_link_type: DIRECT
    description: Limb shortening, the appendicular expression of the patterning defect.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      Short digits - the distal limb field is among the most
      Hedgehog-dependent structures in the body.
  - target: Bell-shaped thorax
    causal_link_type: DIRECT
    description: A narrow, bell-shaped chest from the axial skeletal involvement.

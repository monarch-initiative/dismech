genetic:
- name: HHAT
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HHAT
    term:
      id: hgnc:18270
      label: HHAT
  notes: >-
    Biallelic variants clustering in or near the MBOAT catalytic domain.
    Reported alleles are p.Gly287Val (long isoform numbering; p.Gly150Val on the
    short isoform), p.Leu257Pro and the in-frame p.Thr122del, with three further
    novel variants in the 2025 series. Note that the same substitution carries
    two different protein designations depending on which RefSeq isoform is used,
    which is a practical trap when comparing reports. The founding family's
    variant was the only one surviving an autosomal recessive filtering model in
    the exome, and is absent from dbSNP.
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of WES results using an autosomal recessive model revealed a
      homozygous G287V missense mutation in the hedgehog acyl-transferase ( HHAT)
      gene.
    explanation: The gene-discovery result and the founding causal allele.
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Gly287 residue lies in the highly conserved MBOAT (Membrane bound acyl transferase) domain
    explanation: >-
      Places the founding family's allele in the catalytic MBOAT domain. The
      same change is designated p.Gly150Val on the short isoform in that report,
      which is the source of the numbering caution recorded here.
  - reference: PMID:33749989
    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this family, they identified a biallelic missense variant, c.770C > T, p.(Leu257Pro) in exon 7 of HHAT (NM_001122834.3) as the likely cause of the multiple malformation syndrome (Abdel-Salam et al., 2019).
    explanation: >-
      Records the second family's allele.
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Gly287 residue is a highly conserved amino acid which, when mutated, leads
      to a non-functional HHAT protein that lacks the ability to palmitoylate
      hedgehog proteins.
    explanation: >-
      Establishes both the conservation of the residue and the functional
      consequence of substituting it.
  - reference: PMID:40326711
    reference_title: >-
      Four New Patients of HHAT-Related Multiple Congenital Anomalies Syndrome (Nivelon-Nivelon-Mabille Syndrome) and a Comprehensive Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole exome analysis revealed three novel variants of the HHAT gene
    explanation: >-
      Three further pathogenic HHAT variants beyond the previously reported
      alleles, establishing an allelic series rather than a single recurrent
      allele.

treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists and there is no prospect of one directed
    at the enzyme. Care is supportive across neurology, endocrinology,
    ophthalmology and orthopaedics, and the disorder carries a substantial
    perinatal mortality - one reported family lost two of three affected
    pregnancies.

differential_diagnoses:
- name: Holoprosencephaly spectrum from SHH pathway variants
  description: >-
    Variants in SHH itself and in its pathway cause holoprosencephaly with
    midline craniofacial anomalies. The gonadal and skeletal features are what
    point past those genes to HHAT, since only HHAT acts on all three Hedgehog
    ligands at once.
  distinguishing_features:
  - 46,XY gonadal dysgenesis, which SHH-pathway holoprosencephaly does not cause
  - Chondrodysplasia with short stature from attenuated Indian Hedgehog signalling
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation occurred in the conserved membrane bound O-acyltransferase (MBOAT) domain and experimentally disrupted the ability of HHAT to palmitoylate Hh proteins such as DHH and SHH.
    explanation: >-
      Establishes that HHAT acts on more than one Hedgehog ligand, which is why
      its phenotype exceeds that of any single-ligand defect.
- name: Other Causes of 46,XY Gonadal Dysgenesis
  description: >-
    SRY, NR5A1, MAP3K1, DHH and WT1 variants all cause 46,XY gonadal dysgenesis.
    What distinguishes HHAT is that the gonadal defect never comes alone: the
    same enzyme lesion attenuates Indian and Sonic Hedgehog signalling as well,
    so a chondrodysplasia and a midline brain malformation accompany it.
  distinguishing_features:
  - Generalised chondrodysplasia with severe short stature
  - Severe microcephaly with cerebellar vermis hypoplasia
  - Ocular coloboma and iris hypoplasia
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we report a unique case of autosomal recessive syndromic 46,XY Disorder of Sex Development (DSD) with testicular dysgenesis and chondrodysplasia resulting from a homozygous G287V missense mutation in the hedgehog acyl-transferase (HHAT) gene.
    explanation: >-
      The DSD is explicitly syndromic and accompanied by chondrodysplasia, which
      is what separates it from isolated 46,XY gonadal dysgenesis.
- name: Other Spondylometaphyseal Dysplasias
  description: >-
    The other five members of ISDS group 12 are defined by a vertebral and
    metaphyseal radiographic pattern and act through matrix, secretion or
    growth-plate metabolism. This disorder is a morphogen-range defect whose
    skeletal component is generalised, and it is the only member with a disorder
    of sex development.
  distinguishing_features:
  - 46,XY gonadal dysgenesis, absent from every other group-12 disorder
  - Severe microcephaly with cerebellar vermis hypoplasia
  - Generalised rather than specifically spondylometaphyseal skeletal involvement
  evidence:
  - reference: PMID:24784881
    reference_title: >-
      Loss of function mutation in the palmitoyl-transferase HHAT leads to syndromic 46,XY disorder of sex development by impeding Hedgehog protein palmitoylation and signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first sibling displayed severe dwarfism with generalized chondrodysplasia,
      a narrow, bell-shaped thorax, micromelia, brachydactyly, severe microcephaly
      with cerebellar vermis hypoplasia, facial anomalies, hypoplastic irides, and
      coloboma of both optic discs.
    explanation: >-
      The published skeletal description is generalised rather than specifically
      spondylometaphyseal, which is the basis of the distinction.
animal_models:
- name: Hhat loss-of-function mouse
  species: Mouse
  genotype: Hhat loss of function
  publication: PMID:24784881
  description: >-
    Mice lacking functional Hhat, used to test whether the human syndrome follows
    from loss of Hedgehog palmitoylation. The model reproduces most of the human
    phenotype across all four affected systems, which is what allows the diverse
    human features to be attributed to a single enzymatic lesion.
  modeled_mechanisms:
  - target: Skeletal Dysplasia with Short Stature
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Hhat loss of function in mice reproduces the testicular, skeletal, neuronal
      and growth defects seen in patients, which is what allows the human
      phenotype to be attributed to the enzymatic lesion rather than to a
      coincidental second variant.
    limitations: >-
      The recapitulation is stated as covering most, not all, of the human
      defects, and the mouse model is a loss of function rather than a knock-in
      of a human allele, so it does not test any specific variant. The mouse
      gonadal phenotype also cannot model the 46,XY sex-reversal presentation
      directly.
    evidence:

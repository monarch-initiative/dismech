    reference_title: >-
      Hedgehog acyl-transferase-related multiple congenital anomalies: Report of an additional family and delineation of the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcephaly, small cerebellar vermis, holoprosencephaly, agenesis of corpus callosum, intellectual disability, short stature, skeletal dysplasia, microphthalmia-anophthalmia, and sex reversal constitute the phenotypic spectrum of this condition with variable expression.
    explanation: >-
      The delineated spectrum from which the recognisable combination is drawn.
- name: Karyotype in a phenotypically female infant
  description: >-
    A 46,XY karyotype in a phenotypic female with microcephaly and skeletal
    dysplasia is what converts a nonspecific malformation syndrome into this
    specific diagnosis.
  results: 46,XY karyotype with female external genitalia.

      snippet: >-
        Hhat loss of function in mice recapitulates most of the testicular, skeletal, neuronal and growth defects observed in humans
      explanation: >-
        States the scope of the recapitulation across all four affected organ
        systems.
  - target: Testicular Dysgenesis with 46,XY Disorder of Sex Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hhat loss of function in mice reproduces the gonadal arm of the syndrome,
      and localises the requirement for palmitoylated Desert Hedgehog to a
      specific step of testis morphogenesis.
    limitations: >-
      The mouse gonadal phenotype cannot model the 46,XY sex-reversal

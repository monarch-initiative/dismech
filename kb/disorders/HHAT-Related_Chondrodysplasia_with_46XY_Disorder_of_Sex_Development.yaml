diagnosis:
- name: Clinical recognition of the multisystem pattern
  description: >-
    The combination that identifies the disorder is microcephaly with cerebellar
    vermis hypoplasia, skeletal dysplasia and short stature, and 46,XY gonadal
    dysgenesis. Any one of the three in isolation has many causes; together they
    are close to specific.
  presence: >-
    Microcephaly with cerebellar vermis hypoplasia, skeletal dysplasia and
    46,XY gonadal dysgenesis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:

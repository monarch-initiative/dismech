notes: >-
  Curated to complete ISDS Nosology group 12 (Spondylometaphyseal dysplasias),
  row NOS 12-0060. The entry name uses current terminology for the sex
  development phenotype; MONDO:0010814's canonical label retains the historical
  "pseudohermaphroditism" wording and is reproduced exactly on disease_term as
  term validation requires, with the historical name kept as a synonym so the
  nosology row stays findable. An open knowledge gap records that the skeletal
  phenotype has never been characterised radiographically at the level the
  group placement implies.

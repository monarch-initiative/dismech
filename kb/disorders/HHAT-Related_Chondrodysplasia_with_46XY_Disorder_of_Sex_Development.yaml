notes: >-
  Curated to complete ISDS Nosology group 12 (Spondylometaphyseal dysplasias),
  row NOS 12-0060. The entry name uses current terminology for the sex
  development phenotype; MONDO:0010814's canonical label retains the historical
  "pseudohermaphroditism" wording and is reproduced exactly on disease_term as
  term validation requires, with the historical name kept as a synonym so the
  nosology row stays findable. An open knowledge gap records that the skeletal
  phenotype has never been characterised radiographically at the level the
  group placement implies.

  This entry is the merge of two independently curated entries for
  MONDO:0010814 that reached the repository at the same time - one on main under
  this filename, and one on the ISDS group-12 branch as
  Chondrodysplasia-Pseudohermaphroditism_Syndrome.yaml. The surviving file keeps
  main's name and its per-organ decomposition of the Hedgehog phenotype, and
  takes from the branch entry its Hhat-null mouse model, the 2025 four-patient
  series (PMID:40326711), the skeletal, ocular and gonadal phenotype records,
  the differential diagnoses, and the pathophysiology-to-phenotype wiring. The
  superseded history records were moved into this slug directory with
  target.superseded_by blocks.

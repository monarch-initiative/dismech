    evidence_source: HUMAN_CLINICAL
    snippet: >-
      "Chondrodysplasia-pseudo-hermaphroditism syndrome" (MIM# 600092) described by Nivelon et al. is the first clinical report of a family with an affected female with short stature, skeletal dysplasia, microcephaly, deep-set eyes, small iris, everted upper lip and sex reversal with a karyotype of 46, XY.
    explanation: >-
      The founding case, in which the karyotype is what defined the syndrome.
- name: HHAT sequencing
  description: >-
    Molecular confirmation, by exome sequencing in every reported family.
    Variants should be reported against a stated RefSeq isoform, since the two
    HHAT isoforms give different protein designations for the same change.
  results: Biallelic HHAT variants in or near the MBOAT domain.

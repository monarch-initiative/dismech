  infectious_agent_term:
    preferred_term: Staphylococcus epidermidis
    term:
      id: NCBITaxon:1282
      label: Staphylococcus epidermidis
  description: >-
    The leading cause of acute postoperative endophthalmitis, introduced from
    the patient's own periocular flora at the time of intraocular surgery,

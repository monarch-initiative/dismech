name: Endophthalmitis
creation_date: "2026-08-26T23:26:14Z"
category: Infectious Disease
disease_term:
  preferred_term: endophthalmitis
  term:
    id: MONDO:0016047
    label: endophthalmitis
description: >-
  Sight-threatening inflammation of the intraocular cavities (aqueous and
  vitreous humor), usually caused by microbial invasion of the eye. The eye is
  an immune-privileged site; once that privilege is breached and organisms
  gain access to the vitreous cavity, the host's own neutrophil- and
  cytokine-driven inflammatory response to the pathogen becomes a second,
  largely independent driver of retinal damage, which is why the inflammatory
  cascade can produce tissue destruction that exceeds the direct damage
  caused by the microorganisms themselves, and why adjunctive
  anti-inflammatory therapy (intravitreal corticosteroids) has been
  investigated alongside intravitreal antibiotics. Route of microbial entry
  defines the major clinically distinct forms, captured here as subtypes
  along a route-of-entry axis: postoperative (acute and chronic/delayed-onset),
  post-traumatic, bleb-associated, post-intravitreal-injection, and endogenous
  (hematogenous) endophthalmitis.
parents:
- eye infectious disorder
- inflammatory disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:23438028
      reference_title: Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Endophthalmitis means bacterial or fungal infection inside the eye
        involving the vitreous and/or aqueous humors.
      explanation: >-
        Endophthalmitis is fundamentally a microbial infectious disease of
        the eye, placing it in Harrison's Infectious Diseases Part.
has_subtypes:
- name: Acute Postoperative
  display_name: Acute postoperative endophthalmitis
  description: >-
    The most common clinical form, presenting within about a week of
    intraocular surgery (typically cataract surgery). Most commonly caused by
    coagulase-negative staphylococci (e.g. Staphylococcus epidermidis)
    introduced from the patient's own periocular/conjunctival flora at the
    time of surgery.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      acute post-cataract endophthalmitis complicates this procedure in c.
      0.1% of cases
    explanation: >-
      Establishes acute postoperative endophthalmitis as a defined,
      quantified complication of cataract surgery.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coagulase-negative staphylococci are the most common causes of
      post-cataract endophthalmitis, and these bacteria and viridans
      streptococci cause most cases of post-intravitreal anti-VEGF injection
      endophthalmitis, Bacillus cereus is a major cause of post-traumatic
      endophthalmitis, and Staphylococcus aureus and streptococci are
      important causes of endogenous endophthalmitis associated with
      endocarditis.
    explanation: >-
      Identifies coagulase-negative staphylococci as the predominant
      organism in post-cataract (acute postoperative) endophthalmitis.
- name: Chronic Postoperative
  display_name: Chronic (delayed-onset) postoperative endophthalmitis
  description: >-
    A low-grade, indolent form presenting weeks to months after intraocular
    surgery, classically associated with Cutibacterium acnes (formerly
    Propionibacterium acnes) sequestered within the capsular bag, producing a
    smoldering inflammation rather than the fulminant course of acute
    postoperative disease.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic post-cataract endophthalmitis is usually caused by
      Propionibacterium acnes, and presents as a persistent low-grade
      inflammation in the anterior chamber.
    explanation: >-
      Directly establishes Cutibacterium (Propionibacterium) acnes as the
      classic cause of chronic/delayed postoperative endophthalmitis with an
      indolent presentation.
- name: Post-Traumatic
  display_name: Post-traumatic endophthalmitis
  description: >-
    Follows open-globe (penetrating) ocular trauma, with organisms introduced
    directly by the injury, often including soil-associated or
    organic-material-associated organisms such as Bacillus cereus; retained
    intraocular foreign bodies and delayed primary repair further increase risk.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endophthalmitis occurs in 3–10% of cases after penetrating trauma to
      the eye
    explanation: Quantifies the incidence of endophthalmitis after open-globe trauma.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacillus cereus is a major pathogen in post-traumatic endophthalmitis,
      and causes a fulminant infection with very poor visual outcome
    explanation: >-
      Establishes Bacillus cereus as the characteristic, especially
      virulent, organism in post-traumatic endophthalmitis.
- name: Bleb-Associated
  display_name: Bleb-associated (blebitis-related) endophthalmitis
  description: >-
    A delayed complication of filtering (trabeculectomy) glaucoma surgery, in
    which the thin, avascular filtering bleb provides a chronic portal of
    entry for conjunctival organisms, often streptococcal species, and can
    occur years after the original surgery.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because only conjunctiva separates the ocular surface flora from the
      aqueous humor at the bleb, endophthalmitis may occur at any time. The
      risk of endophthalmitis is c. 1.3% per patient-year
    explanation: >-
      Explains the bleb-specific anatomical vulnerability and quantifies the
      annual risk of bleb-associated endophthalmitis.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Streptococci, including Streptococcus pneumoniae, cause 50% of cases."
    explanation: >-
      Identifies streptococci, notably Streptococcus pneumoniae, as the
      predominant organisms in bleb-associated endophthalmitis.
- name: Post-Intravitreal-Injection
  display_name: Post-intravitreal-injection endophthalmitis
  description: >-
    A rare but recognized complication of intravitreal injection of
    anti-VEGF and other therapeutic agents, with an incidence low enough per
    injection that its overall clinical burden is driven by the very high
    volume of injections performed.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of endophthalmitis per injection is low, with reported rates
      varying from 0.025% to 0.2%
    explanation: Quantifies the low per-injection risk of this subtype.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coagulase-negative staphylococci cause c. 60% of cases and viridans
      streptococci cause 25%
    explanation: >-
      Quantifies the organism distribution in post-intravitreal-injection
      endophthalmitis, noting the comparatively higher streptococcal share.
- name: Endogenous
  display_name: Endogenous (hematogenous) endophthalmitis
  description: >-
    Results from hematogenous seeding of the eye during bacteremia or
    fungemia from a distant source (e.g. endocarditis, urinary tract
    infection, indwelling catheter, hepatic abscess) rather than direct
    inoculation. Candida species are a leading cause in the fungal endogenous
    route; see Invasive_Candidiasis.yaml, which curates Candida
    chorioretinitis/endophthalmitis as a metastatic complication of
    candidemia rather than duplicating that content here.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endogenous bacterial endophthalmitis arises from bacteraemic seeding of
      the eye. Endocarditis, usually caused by S. aureus or streptococci,
      accounts for 40% of endogenous endophthalmitis cases in the USA
    explanation: >-
      Establishes hematogenous seeding as the defining mechanism of
      endogenous endophthalmitis and quantifies endocarditis as a leading
      source in the USA.
pathophysiology:
- name: Breach of the Blood-Ocular Barrier and Loss of Immune Privilege
  role: trigger
  biological_scale: TISSUE
  description: >-
    The eye is an immune-privileged site maintained in part by the
    blood-aqueous and blood-retinal barriers, which normally limit
    infiltration of systemic immune cells into the intraocular cavities.
    Surgical incision, penetrating trauma, a filtering bleb, an intravitreal
    injection needle track, or hematogenous seeding each provide a route by
    which this barrier is breached and organisms gain direct access to the
    aqueous and vitreous humor.
  evidence:
  - reference: PMID:31424768
    reference_title: Bacterial Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anatomically, the eye is normally protected from infection by several
      defense mechanisms, including an intact corneal epithelium,
      conjunctival immune surveillance, tear-film antimicrobial components,
      and the blood–aqueous and blood–retinal barriers. These barriers
      maintain ocular immune privilege by limiting infiltration of systemic
      immune cells.
    explanation: >-
      Establishes the anatomical/immunological barriers whose breach defines
      the entry point of the disease.
  downstream:
  - target: Intravitreal Microbial Proliferation
    causal_link_type: DIRECT
    description: >-
      Once organisms cross the breached barrier into the vitreous cavity,
      the compartment's low baseline immune surveillance permits microbial
      proliferation before an effective host response is mounted.
    evidence:
    - reference: PMID:31424768
      reference_title: Bacterial Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The vitreous cavity, in particular, provides a relatively avascular
        and immunologically protected environment, allowing bacteria to
        multiply with minimal early immune containment.
      explanation: >-
        Directly connects barrier breach to unchecked early microbial
        proliferation within the vitreous cavity.
- name: Intravitreal Microbial Proliferation
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Bacteria or fungi replicate within the vitreous cavity. The organism
    identity differs systematically by route of entry (coagulase-negative
    staphylococci in acute postoperative disease, Cutibacterium acnes in
    chronic postoperative disease, Bacillus cereus in post-traumatic
    disease, streptococci in bleb-associated and post-injection disease, and
    Staphylococcus aureus, streptococci, or Candida in endogenous disease),
    which is why empirical antibiotic selection is route-of-entry-dependent.
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coagulase-negative staphylococci are the most common causes of
      post-cataract endophthalmitis, and these bacteria and viridans
      streptococci cause most cases of post-intravitreal anti-VEGF injection
      endophthalmitis, Bacillus cereus is a major cause of post-traumatic
      endophthalmitis, and Staphylococcus aureus and streptococci are
      important causes of endogenous endophthalmitis associated with
      endocarditis.
    explanation: >-
      Summarizes the route-of-entry-dependent organism spectrum that this
      node generalizes over.
  downstream:
  - target: Bacterial Peptidoglycan Precursor and Lipid II Synthesis (Vancomycin Target)
    causal_link_type: DIRECT
    description: >-
      Growth and division of the proliferating gram-positive organisms
      depends on ongoing peptidoglycan cell-wall synthesis, the step
      inhibited by empirical intravitreal vancomycin.
  - target: Bacterial Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
    causal_link_type: DIRECT
    description: >-
      Growth of gram-negative and additional gram-positive organisms also
      depends on PBP-mediated peptidoglycan cross-linking, the step
      inhibited by empirical intravitreal ceftazidime.
  - target: Bacterial mRNA Translation by the Ribosome (Aminoglycoside Target)
    causal_link_type: DIRECT
    description: >-
      As an alternative to ceftazidime for gram-negative coverage, empirical
      therapy may instead inhibit bacterial ribosomal translation with
      intravitreal amikacin.
  - target: Neutrophil Recruitment and Cytokine-Driven Intraocular Inflammation
    causal_link_type: DIRECT
    description: >-
      Microbial replication and the release of pathogen-associated molecular
      patterns trigger an intense innate immune response within the
      confined intraocular space.
    evidence:
    - reference: PMID:31424768
      reference_title: Bacterial Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Once bacterial proliferation reaches a critical threshold,
        pathogen-associated molecular patterns (PAMPs) trigger a robust
        inflammatory response mediated by cytokines, complement activation,
        and neutrophilic infiltration.
      explanation: >-
        Directly links microbial proliferation to the onset of the
        cytokine- and neutrophil-driven inflammatory cascade.
- name: Bacterial Peptidoglycan Precursor and Lipid II Synthesis (Vancomycin Target)
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Precursor and Lipid II Synthesis"
  description: >-
    Gram-positive organisms causing endophthalmitis (coagulase-negative
    staphylococci, Cutibacterium acnes, streptococci) assemble the lipid II
    peptidoglycan precursor terminating in a D-Ala-D-Ala dipeptide.
    Glycopeptides such as vancomycin bind and sequester this exposed
    D-Ala-D-Ala terminus, blocking peptidoglycan polymerization. This is the
    fungus- and host-cell-independent, bacteria-specific vulnerability
    exploited by empirical intravitreal vancomycin.
  biological_processes:
  - preferred_term: Peptidoglycan Biosynthetic Process
    term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
  evidence:
  - reference: PMID:18302341
    reference_title: >-
      Vancomycin derivative with damaged D-Ala-D-Ala binding cleft binds to
      cross-linked peptidoglycan in the cell wall of Staphylococcus aureus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the antimicrobial activity of other vancosamine-modified glycopeptides
      depends upon both d-Ala-d-Ala stem-terminus recognition (primary
      binding site) and stem-bridge recognition (secondary binding site).
    explanation: >-
      Solid-state NMR study confirming that glycopeptide antibiotics
      including vancomycin act by recognizing the D-Ala-D-Ala stem terminus
      of the peptidoglycan precursor.
- name: Bacterial Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    Penicillin-binding protein (PBP) transpeptidases cross-link peptidoglycan
    peptide stems to give the bacterial cell wall its load-bearing strength.
    Beta-lactams such as the third-generation cephalosporin ceftazidime
    acylate the PBP active-site serine and irreversibly block this
    cross-linking, the target exploited by empirical intravitreal
    ceftazidime for gram-negative and additional gram-positive coverage.
  biological_processes:
  - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:22203377
    reference_title: >-
      From the regulation of peptidoglycan synthesis to bacterial growth and
      morphology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peptidoglycan synthesis requires glycosyltransferases (GTases) to
      polymerize the glycan chains and DD-transpeptidases (DD-TPases) to
      crosslink the peptides
    explanation: >-
      Review establishing that peptidoglycan cross-linking by
      DD-transpeptidases (PBPs) is a required step of cell-wall synthesis,
      the beta-lactam target. Evidence source is OTHER as this is a review
      article.
- name: Bacterial mRNA Translation by the Ribosome (Aminoglycoside Target)
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    The bacterial 70S ribosome translates mRNA into protein. Aminoglycosides
    such as amikacin bind the 30S subunit and cause misreading, a
    bactericidal effect. Amikacin is used as an alternative to ceftazidime
    for empirical gram-negative coverage in endophthalmitis, though repeated
    intravitreal injection is avoided owing to retinal toxicity.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ribosome is one of the main antibiotic targets in the bacterial cell."
    explanation: >-
      Review establishing the bacterial ribosome as a principal antibiotic
      target, the step this node represents. Evidence source is OTHER as
      this is a review article.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intravitreal vancomycin 1 mg/0.1 mL normal saline plus either
      ceftazidime 2.25 mg/0.1 mL or amikacin 0.4 mg/0.1 mL
    explanation: >-
      Documents amikacin as the empirically used alternative to ceftazidime
      in endophthalmitis therapy.
- name: Neutrophil Recruitment and Cytokine-Driven Intraocular Inflammation
  role: consequence
  biological_scale: TISSUE
  description: >-
    Resident and infiltrating cells release pro-inflammatory cytokines and
    chemokines that recruit large numbers of neutrophils into the aqueous
    and vitreous. This is the mechanistic thread distinct from direct
    microbial invasion: the intensity of the intraocular inflammatory
    response, not organism burden alone, is a principal driver of tissue
    injury, and elevated intravitreal cytokine levels correlate with disease
    severity in patients.
  biological_processes:
  - preferred_term: Neutrophil Chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
  evidence:
  - reference: PMID:30296277
    reference_title: >-
      Elevated cytokine levels in vitreous as biomarkers of disease severity
      in infectious endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrated elevated expression of 16 mediators such as
      GCSF, GRO, IFN-γ, IL-1α, IL-1β, IL-1 RA, IL-6, IL-8, IP-10, MCP-1,
      MCP-3, MIP-1α, IL-1β, TGF-α, TNF-α in patients with culture positive
      endophthalmitis.
    explanation: >-
      Human vitreous-sample study demonstrating the pro-inflammatory
      cytokine and chemokine elevation this node describes, and linking it
      to disease severity.
  - reference: PMID:29661181
    reference_title: >-
      TLR4 modulates inflammatory gene targets in the retina during
      Bacillus cereus endophthalmitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genes related to acute inflammation and inflammatory cell recruitment
      including CXCL1 (KC), CXCL2 (MIP2-α), CXCL10 (IP-10), CCL2 (MCP1), and
      CCL3 (MIP1-α)) were significantly upregulated 5-fold or greater in
      C57BL/6 J retinas.
    explanation: >-
      Mouse model of Bacillus cereus endophthalmitis showing TLR4-dependent
      upregulation of neutrophil-recruiting chemokines in the retina during
      infection.
  downstream:
  - target: Neutrophil- and Cytokine-Mediated Retinal Toxicity
    causal_link_type: DIRECT
    description: >-
      Activated neutrophils release proteolytic enzymes and reactive oxygen
      species, and the cytokine milieu itself contributes to retinal
      damage, producing an inflammatory cascade whose tissue destruction can
      exceed that caused by the organism alone.
    evidence:
    - reference: PMID:31424768
      reference_title: Bacterial Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This inflammatory cascade contributes substantially to tissue
        destruction, often exceeding the direct damage caused by the
        microorganisms themselves.
      explanation: >-
        States directly that the host inflammatory cascade, not the
        organism, is often the larger contributor to tissue destruction.
- name: Neutrophil- and Cytokine-Mediated Retinal Toxicity
  role: consequence
  biological_scale: TISSUE
  description: >-
    Neutrophil-derived proteases and reactive oxygen species, together with
    sustained pro-inflammatory cytokine signaling, damage the retina and
    underlying retinal pigment epithelium. Current therapeutics are often
    unable to fully mitigate this damaging inflammation independently of
    antimicrobial killing, which is the rationale for investigating
    adjunctive intravitreal corticosteroids alongside intravitreal
    antibiotics: the corticosteroid targets host-driven inflammatory injury
    rather than the organism itself, although the clinical evidence for
    benefit remains limited and low-certainty.
  evidence:
  - reference: PMID:29661181
    reference_title: >-
      TLR4 modulates inflammatory gene targets in the retina during
      Bacillus cereus endophthalmitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because current therapeutics are often unsuccessful in mitigating
      damaging inflammation during endophthalmitis, more rational targets
      are needed.
    explanation: >-
      Directly motivates the rationale that host inflammation, separate
      from antimicrobial therapy, is an undertreated driver of damage in
      this disease.
  downstream:
  - target: Irreversible Retinal Structural Damage and Vision Loss
    causal_link_type: DIRECT
    description: >-
      Sustained neutrophilic and cytokine-driven injury to the retina and
      retinal pigment epithelium produces structural damage that does not
      reverse even with organism eradication.
- name: Irreversible Retinal Structural Damage and Vision Loss
  role: consequence
  biological_scale: TISSUE
  description: >-
    The combination of direct microbial toxicity and host-driven
    inflammatory injury produces structural retinal damage that is the
    proximate cause of the poor visual outcomes characteristic of
    endophthalmitis, even among eyes in which the infection is
    microbiologically cured. Prompt vitrectomy, which surgically debrides
    the infected and inflamed vitreous, improves outcomes in the most
    severely affected eyes.
  evidence:
  - reference: PMID:31424768
    reference_title: Bacterial Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition is a fulminant infection that can cause profound,
      irreversible vision loss within hours to days if not promptly
      recognized and treated.
    explanation: Establishes the irreversibility and time-criticality of the tissue damage.
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitrectomy decreased the rate of severe vision loss from 47% (tap
      group) to 20% (vitrectomy group) in patients who presented with the
      worst vision (light perception only).
    explanation: >-
      Reports the Endophthalmitis Vitrectomy Study result showing that
      surgical debridement of the vitreous reduces severe vision loss in the
      most severely affected eyes.

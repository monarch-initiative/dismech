- name: Bacillus cereus
  infectious_agent_term:
    preferred_term: Bacillus cereus
    term:
      id: NCBITaxon:1396
      label: Bacillus cereus
  description: >-
    A major and especially virulent cause of post-traumatic endophthalmitis,

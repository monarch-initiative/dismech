  - reference: PMID:31424768
    reference_title: Bacterial Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On examination, clinicians may observe conjunctival injection,
      corneal edema, anterior chamber cells and flare, hypopyon, vitritis,
      and reduced fundus visibility.
    explanation: Documents corneal edema as a characteristic examination finding.
infectious_agent:

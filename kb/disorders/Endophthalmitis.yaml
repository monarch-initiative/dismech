    explanation: Documents intravitreal ceftazidime as first-line empirical broad-spectrum therapy.
  target_mechanisms:
  - target: Bacterial Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: >-
      Ceftazidime acylates the penicillin-binding protein active site,
      blocking peptidoglycan cross-linking to provide gram-negative and
      additional gram-positive coverage.
    evidence:
    - reference: PMID:23438028

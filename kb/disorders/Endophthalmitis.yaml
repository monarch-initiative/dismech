      snippet: >-
        intravitreal vancomycin 1 mg/0.1 mL normal saline plus either
        ceftazidime 2.25 mg/0.1 mL or amikacin 0.4 mg/0.1 mL
      explanation: Documents intravitreal ceftazidime as first-line empirical therapy.
- name: Intravitreal Amikacin
  description: >-
    Alternative empirical intravitreal antibiotic for gram-negative
    coverage when ceftazidime is not used; repeated injection is avoided
    owing to concerns about retinal toxicity.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeated injections of amikacin are avoided, owing to concerns
      about retinal toxicity.
    explanation: >-
      Documents intravitreal amikacin as an empirical alternative to
      ceftazidime, with a dose-limiting retinal-toxicity caveat.
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Aminoglycoside Target)
    treatment_effect: INHIBITS
    description: >-
      Amikacin binds the bacterial 30S ribosomal subunit, causing
      translational misreading and bactericidal effects in gram-negative
      organisms.
    evidence:
    - reference: PMID:23438028
      reference_title: Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Repeated injections of amikacin are avoided, owing to concerns
        about retinal toxicity.
      explanation: >-
        Documents intravitreal amikacin as an empirical alternative and
        notes its dose-limiting retinal toxicity.
- name: Intravitreal Corticosteroid
  description: >-
    Adjunctive intravitreal corticosteroid (dexamethasone) investigated
    alongside intravitreal antibiotics to target the neutrophil- and
    cytokine-driven retinal toxicity that can persist independently of
    antimicrobial killing. Evidence for benefit is low-certainty: a Cochrane
    review found current evidence on adjunctive steroid therapy versus
    antibiotics alone to be inadequate, though a combined analysis of two
    small trials suggested a higher probability of a good visual outcome at
    three months with adjunctive dexamethasone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:28225198
    reference_title: >-
      Adjunctive steroid therapy versus antibiotics alone for acute
      endophthalmitis after intraocular procedure.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current evidence on the effectiveness of adjunctive steroid therapy
      versus antibiotics alone in the management of acute endophthalmitis
      after intraocular surgery is inadequate.
    explanation: >-
      Cochrane review's own authors' conclusion, quoted to keep the
      treatment entry honest about the limited certainty of current
      evidence for this adjunctive therapy.
  target_mechanisms:
  - target: Neutrophil- and Cytokine-Mediated Retinal Toxicity
    treatment_effect: INHIBITS
    description: >-
      Intravitreal dexamethasone is intended to suppress neutrophil- and
      cytokine-driven inflammatory injury to the retina independently of
      antimicrobial action against the causative organism.
    evidence:
    - reference: PMID:28225198
      reference_title: >-
        Adjunctive steroid therapy versus antibiotics alone for acute
        endophthalmitis after intraocular procedure.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Low-certainty evidence from two studies showed that a higher
        proportion of participants who received adjunctive dexamethasone
        had a good visual outcome (Snellen visual acuity 6/6 to 6/18) at
        three months compared with those in the antibiotics-alone group (RR
        1.95, 95% CI 1.05 to 3.60; 60 participants).
      explanation: >-
        Cochrane systematic review reporting low-certainty evidence of
        visual-outcome benefit from adjunctive intravitreal dexamethasone;
        supports the mechanistic rationale but the review's overall
        conclusion (inadequate evidence) is captured in the treatment
        description rather than overstated here.
- name: Pars Plana Vitrectomy
  description: >-
    Surgical removal of infected, inflamed vitreous, indicated for eyes
    with the most severe vision loss at presentation.
  treatment_term:
    preferred_term: Vitrectomy
    term:
      id: NCIT:C50837
      label: Vitrectomy
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitrectomy decreased the rate of severe vision loss from 47% (tap
      group) to 20% (vitrectomy group) in patients who presented with the
      worst vision (light perception only).
    explanation: >-
      Endophthalmitis Vitrectomy Study finding, as reported in this review,
      establishing the clinical benefit of vitrectomy in the most severely
      affected eyes.
  target_mechanisms:
  - target: Intravitreal Microbial Proliferation
    treatment_effect: INHIBITS
    description: >-
      Vitrectomy surgically debrides the infected vitreous humor, physically
      removing the microbial and inflammatory-mediator reservoir, similar to
      draining an abscess.
    evidence:
    - reference: PMID:23438028
      reference_title: Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vitrectomy decreased the rate of severe vision loss from 47% (tap
        group) to 20% (vitrectomy group) in patients who presented with the
        worst vision (light perception only).
      explanation: >-
        Reports the Endophthalmitis Vitrectomy Study finding that
        vitrectomy reduces severe vision loss in the most severely affected
        eyes.

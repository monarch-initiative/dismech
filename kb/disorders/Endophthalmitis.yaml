treatments:
- name: Intravitreal Vancomycin
  description: >-
    Empirical intravitreal antibiotic covering gram-positive organisms
    (including coagulase-negative staphylococci), the predominant pathogens
    in postoperative endophthalmitis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
  evidence:
  - reference: PMID:23438028
    reference_title: Endophthalmitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intravitreal vancomycin 1 mg/0.1 mL normal saline plus either
      ceftazidime 2.25 mg/0.1 mL or amikacin 0.4 mg/0.1 mL
    explanation: Documents intravitreal vancomycin as first-line empirical broad-spectrum therapy.
  target_mechanisms:
  - target: Bacterial Peptidoglycan Precursor and Lipid II Synthesis (Vancomycin Target)
    treatment_effect: INHIBITS
    description: >-
      Vancomycin sequesters the D-Ala-D-Ala terminus of the lipid II
      peptidoglycan precursor, blocking cell-wall synthesis in the
      predominantly gram-positive organisms causing endophthalmitis.
    evidence:
    - reference: PMID:23438028
      reference_title: Endophthalmitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        intravitreal vancomycin 1 mg/0.1 mL normal saline plus either
        ceftazidime 2.25 mg/0.1 mL or amikacin 0.4 mg/0.1 mL
      explanation: Documents intravitreal vancomycin as first-line empirical therapy.
- name: Intravitreal Ceftazidime
  description: >-
    Empirical intravitreal antibiotic covering gram-negative organisms,
    combined with intravitreal vancomycin for broad-spectrum coverage pending
    culture results.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftazidime

name: Neuromuscular Disease And Ocular Or Auditory Anomalies With Or Without Seizures
creation_date: "2026-09-21T00:00:00Z"
description: >-
  A dominant neurodevelopmental disorder caused by de novo heterozygous missense
  variants in DHX16, also called neuromuscular oculoauditory syndrome (NMOAS).
  DHX16 is the human orthologue of yeast Prp2: a DEAH-box RNA-dependent ATPase
  that activates the spliceosome immediately before the first catalytic step of
  splicing. It is core housekeeping machinery, required for the splicing of
  introns generally rather than of any particular transcript.

  That makes the phenotype the interesting thing about this disease. A defect in
  general pre-mRNA splicing does not produce a generalised disorder; it produces a
  specific and fairly consistent combination of developmental delay, neuromuscular
  involvement, and retinal or auditory disease, with seizures in some patients.
  Why the retina, the cochlea and muscle should be the tissues that fail when a
  universal splicing factor is impaired is not established, and is recorded here
  as the entry's principal knowledge gap rather than explained.

  Every reported disease-causing allele is missense, essentially all de novo, and
  the functional data - dominant-negative DHX16 in cell lines, and patient-variant
  assays showing intron retention in specific transcripts - point to a
  dominant-negative rather than a haploinsufficiency mechanism. Codon 454 is a
  recurrent site: two unrelated patients carry different substitutions of the same
  arginine.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Spliceosomopathy
disease_term:
  preferred_term: neuromuscular disease and ocular or auditory anomalies with or without seizures
  term:
    id: MONDO:0032890
    label: neuromuscular disease and ocular or auditory anomalies with or without seizures
synonyms:
- NMOAS
- neuromuscular oculoauditory syndrome
- DHX16-related neurodevelopmental disorder
- NEDMOAS
notes: >-
  Entry scope. Curated as a single DISEASE. The stub recorded no MONDO descendants
  and one causal gene, hgnc:2739 DHX16 (read from
  stubs/Neuromuscular_Disease_And_Ocular_Or_Auditory_Anomalies_With_Or_Without_Seizures.yaml).
  All reported patients carry de novo heterozygous DHX16 missense alleles and
  share the neuromuscular/sensory core, so there is one pathograph. No
  `has_subtypes` rows: the phenotypic range is continuous and does not track
  allele or domain, and the one paper that looked at domain position notes that
  no published variant sits upstream of the helicase domain except its own.

  Case count. Ten published cases as of PMID:40326698 (2025), which reports itself
  as the tenth, plus at least two later reports curated here (PMID:41052356,
  PMID:42562406). Treat any count in this entry as a snapshot.

  A curated observation worth a reader's attention: codon 454 is recurrent.
  PMID:37574199 reports c.1360C>T p.Arg454Trp and PMID:42562406 reports
  c.1360C>G p.Arg454Gly - the same nucleotide, two different substitutions, in
  unrelated patients - and PMID:41052356 reports a third patient with the Trp
  allele. Two independent substitutions at one residue is the pattern expected of
  a dominant-negative hotspot rather than of simple loss of function.

  The mitochondrial finding is curated as secondary and the entry says so.
  PMID:37574199 found mitochondrial DNA depletion in skeletal muscle and no
  variant in any mitochondrial maintenance gene; its authors conclude the mtDNA
  depletion could be a secondary manifestation. PMID:37664979 independently reports
  mitochondrial deficiency. It is therefore recorded as a phenotype, not as a
  pathophysiology node, because nothing establishes a route from the splicing
  lesion to mtDNA maintenance.

  Module conformance checked and left unset. `just list-modules` was read and
  `kb/modules/` grepped for `splic`, `spliceosom`, `RNA`, `helicase`,
  `transcript` and `mRNA`. No module covers spliceosomal dysfunction. This is a
  plausible future module - the spliceosomopathies are a real recurrent family
  (DHX16, DHX37, DDX54, DHX34, EFTUD2, SNRPB, and the retinitis-pigmentosa PRPF
  genes) - and it is recorded as a CURATION_TODO discussion rather than created
  from one disease.

  No GeneReviews chapter exists for this disorder. Checked offline with
  `just check-genereviews kb/disorders/Neuromuscular_Disease_And_Ocular_Or_Auditory_Anomalies_With_Or_Without_Seizures.yaml`
  against the committed Bookshelf index; NO_CHAPTER for GeneReviews.
references:
- reference: PMID:31256877
  title: "Paralog Studies Augment Gene Discovery: DDX and DHX Genes."
  tags: []
  findings:
  - statement: >-
      The gene-discovery study that established DHX16 as a disease gene, in four
      individuals, reached by way of a paralog hypothesis: variation in one member
      of a paralogous family predicts disease association in the others, and DHX30
      and DDX3X were already known.
- reference: PMID:20423332
  title: "Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing."
  tags: []
  findings:
  - statement: >-
      Establishes what DHX16 does in human cells: it is required for pre-mRNA
      splicing after the pre-catalytic spliceosome has formed, at the step yeast
      Prp2 performs, and helicase-domain mutants accumulate unspliced
      intron-containing transcripts.
- reference: PMID:20841358
  title: "Nuclear retention of unspliced pre-mRNAs by mutant DHX16/hPRP2, a spliceosomal DEAH-box protein."
  tags: []
  findings:
  - statement: >-
      Shows the transcript-level consequence in human cells: a dominant-negative
      DHX16 mutant causes intron retention across many genes, and the unspliced
      RNAs are retained in the nucleus rather than degraded by nonsense-mediated
      decay.
- reference: PMID:37574199
  title: "Infantile onset encephalomyopathy, retinopathy, optic atrophy, and mitochondrial DNA depletion associated with a novel pathogenic DHX16 variant."
  tags: []
  findings:
  - statement: >-
      A patient with fatal encephalomyopathy, retinopathy, optic atrophy and
      sensorineural hearing loss carrying de novo p.Arg454Trp, with mitochondrial
      DNA depletion in skeletal muscle and no variant in any mitochondrial
      maintenance gene - which is why the mtDNA finding is read as secondary.
- reference: PMID:37664979
  title: "Expansion of the phenotypic spectrum associated with pathogenic missense variation in DHX16."
  tags: []
  findings:
  - statement: >-
      Reports that all previously described disease-causing DHX16 variants are
      missense and nearly all de novo, and adds mitochondrial deficiency and
      primary ovarian insufficiency to the phenotype.
- reference: PMID:42562406
  title: "A De Novo DHX16 Variant Associated With Neuromuscular Oculoauditory Syndrome Regulates Pre-mRNA Splicing In Vitro."
  tags: []
  findings:
  - statement: >-
      The only functional assay of a patient allele. Cells expressing the
      p.Arg454Gly mutant show aberrant intron retention in HSPH1 and FOS
      transcripts, connecting a patient variant directly to a splicing defect.
- reference: PMID:40326698
  title: "DHX16-Associated Neuromuscular Oculoauditory Syndrome: A Novel Case."
  tags: []
  findings:
  - statement: >-
      The tenth published case, and the clearest summary of the phenotype across
      the series. Also notes that no published variant sits upstream of the
      helicase domain, and that its own in-silico and structural analyses
      disagree - pathogenicity predictors positive, Missense3D showing no
      structural damage.
- reference: PMID:41052356
  title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
  tags: []
  findings:
  - statement: >-
      Detailed ophthalmological characterisation of the retinal arm - severe macular
      atrophy with outer retinal thinning and photoreceptor disruption on OCT - in
      a second patient with the p.Arg454Trp allele.
inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants, essentially all arising de novo. No transmitted
    pedigree and no biallelic case has been reported, and no truncating allele has
    been reported in an affected individual - which is itself informative, since it
    is what a dominant-negative rather than a haploinsufficiency mechanism predicts.
  evidence:
  - reference: PMID:37664979
    reference_title: "Expansion of the phenotypic spectrum associated with pathogenic missense variation in DHX16."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All DHX16 disease-causing variants previously reported in affected individuals are missense in nature, nearly all of which were found to be de novo."
    explanation: "States both the allele class and the inheritance mode across the whole reported series."
  - reference: PMID:42562406
    reference_title: "A De Novo DHX16 Variant Associated With Neuromuscular Oculoauditory Syndrome Regulates Pre-mRNA Splicing In Vitro."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuromuscular oculoauditory syndrome (NMOAS; OMIM# 618733) is a rare neurodevelopmental disorder caused by heterozygous variants in DHX16, a gene in the DExD/H-box RNA helicase family."
    explanation: "Independent statement of heterozygous inheritance, with the OMIM anchor for the entity."
pathophysiology:
- name: De Novo DHX16 Missense Variant
  biological_scale: MOLECULAR
  role: Initiating genetic lesion
  description: >-
    A heterozygous missense change in DHX16, arising de novo. The reported alleles
    cluster in and around the helicase domain; p.Arg231Pro is the one published
    variant upstream of it, and its describing authors note that little is known
    about the upstream domains. Codon 454 is hit recurrently by two different
    substitutions in unrelated patients.
  genetic_context:
    gene:
      preferred_term: DHX16
      term:
        id: hgnc:2739
        label: DHX16
    variant_origin: DE_NOVO
    allele_type: SNV
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION on three converging grounds:
      every reported disease allele is missense and none is truncating, the
      cell-biology literature shows that mutant DHX16 added to wild-type nuclear
      extract actively inhibits splicing rather than merely failing to support it,
      and one residue is hit by two different substitutions. It is an inference
      from allele spectrum and from non-patient constructs, not a measurement on a
      patient allele in a patient cell, and is flagged as such in `discussions`.
  genes:
  - preferred_term: DHX16
    term:
      id: hgnc:2739
      label: DHX16
  evidence:
  - reference: PMID:37664979
    reference_title: "Expansion of the phenotypic spectrum associated with pathogenic missense variation in DHX16."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All DHX16 disease-causing variants previously reported in affected individuals are missense in nature, nearly all of which were found to be de novo."
    explanation: "Establishes the allele class and origin that this node describes."
  - reference: PMID:40326698
    reference_title: "DHX16-Associated Neuromuscular Oculoauditory Syndrome: A Novel Case."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing revealed a de novo Likely Pathogenic DHX16 variant, c.692G>C; p.R231P."
    explanation: "A specific de novo allele, and the one reported outside the helicase domain."
  downstream:
  - target: Impaired Spliceosome Activation
    description: >-
      The mutant helicase is incorporated into spliceosomes and impairs the
      activation step rather than being absent from it.
    evidence:
    - reference: PMID:20423332
      reference_title: "Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Adding extracts containing DHX16-G724N or DHX16-S552L mutant proteins to HeLa cell nuclear extracts resulted in reduced splicing, indicating that the mutant protein directly inhibited splicing in vitro."
      explanation: "The direct-inhibition result: mutant protein added to a competent extract reduces splicing, which is what a dominant-negative edge asserts."
- name: Impaired Spliceosome Activation
  biological_scale: MOLECULAR
  role: Core molecular lesion
  description: >-
    DHX16 is the human Prp2 orthologue and acts after the pre-catalytic B complex
    has assembled, converting it to a catalytically competent spliceosome. A
    defective DHX16 therefore does not block spliceosome assembly - the B complex
    still forms - it blocks the transition to catalysis. This is a precise
    step-level lesion, and it is why the disease is a spliceosomopathy of
    activation rather than of assembly.
  molecular_functions:
  - preferred_term: DHX16 RNA-dependent ATPase and helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: precatalytic spliceosome
    term:
      id: GO:0071011
      label: precatalytic spliceosome
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: "mRNA splicing, via spliceosome"
    modifier: DECREASED
  evidence:
  - reference: PMID:20423332
    reference_title: "Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In the present study, we show that DHX16 is required for pre-mRNA splicing after the formation of a pre-catalytic spliceosome."
    explanation: "Places the requirement precisely at the activation step, after assembly."
  - reference: PMID:20423332
    reference_title: "Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Nuclear extracts isolated from the dominant-negative DHX16-G724N-expressing cells formed splicing complex B, but were impaired in splicing."
    explanation: "The discriminating observation: complex B forms normally and splicing still fails, so the block is at activation and not at assembly."
  downstream:
  - target: Intron Retention and Nuclear Retention of Unspliced Transcripts
    description: >-
      Transcripts that cannot be spliced keep their introns and are held in the
      nucleus.
    evidence:
    - reference: PMID:20841358
      reference_title: "Nuclear retention of unspliced pre-mRNAs by mutant DHX16/hPRP2, a spliceosomal DEAH-box protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, a perturbation of human PRP2/DHX16 results in accumulation of unspliced transcripts, similar to the outcome in yeast prp2 mutants."
      explanation: "States the transcript-level consequence of impairing the same step."
- name: Intron Retention and Nuclear Retention of Unspliced Transcripts
  biological_scale: CELLULAR
  role: Transcriptome-level consequence
  description: >-
    Affected transcripts retain introns and accumulate in the nucleus rather than
    being degraded by nonsense-mediated decay - which matters, because it means the
    cell neither makes the protein nor clears the failed message. Only a subset of
    intron-containing genes is affected in the dominant-negative experiments, and
    in the one assay performed on an actual patient allele the affected transcripts
    were HSPH1 and FOS. Which transcripts are sensitive, and why, is not known.
  biological_processes:
  - preferred_term: failure of intron removal
    term:
      id: GO:0000398
      label: "mRNA splicing, via spliceosome"
    modifier: DECREASED
  evidence:
  - reference: PMID:20841358
    reference_title: "Nuclear retention of unspliced pre-mRNAs by mutant DHX16/hPRP2, a spliceosomal DEAH-box protein."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The unspliced RNAs were retained in the nucleus, and block of nonsense-mediated decay did not affect their accumulation."
    explanation: "Both halves of this node: nuclear retention, and the fact that it is not an NMD-clearance phenomenon."
  - reference: PMID:42562406
    reference_title: "A De Novo DHX16 Variant Associated With Neuromuscular Oculoauditory Syndrome Regulates Pre-mRNA Splicing In Vitro."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In vitro assays revealed aberrant intron retention in HSPH1 and FOS transcripts in cells expressing the mutant DHX16-1360G, suggesting impaired splicing efficiency."
    explanation: "The only demonstration of intron retention caused by an allele found in a patient rather than by an engineered construct."
  downstream:
  - target: Selective Failure of Neuromuscular and Sensory Tissues
    description: >-
      The step the literature does not explain, curated as an edge so that the gap
      has a location. Impaired splicing of an unidentified subset of transcripts
      is followed by failure of specific tissues.
    evidence:
    - reference: PMID:40326698
      reference_title: "DHX16-Associated Neuromuscular Oculoauditory Syndrome: A Novel Case."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic variants cause poor functioning of the spliceosome complex leading to intron retention in gene transcripts."
      explanation: "The causal claim as the literature states it, which stops at intron retention. INDIRECT because the step from intron retention to the specific tissue involvement is asserted by nobody and is the entry's principal knowledge gap."
- name: Selective Failure of Neuromuscular and Sensory Tissues
  biological_scale: TISSUE
  role: Tissue-selectivity node, mechanism unresolved
  description: >-
    A node for the fact that a universal splicing defect produces a selective
    phenotype. Retina, cochlea, skeletal muscle and the developing CNS are
    consistently affected; most other tissues are not. This is not an oddity of
    this disease alone - it is the central puzzle of the spliceosomopathies as a
    class, where core spliceosome components produce retinitis pigmentosa or
    craniofacial disease rather than global collapse.

    Nothing curated here explains it, and the node exists to hold the gap rather
    than to assert a mechanism. Candidate explanations in the wider field - tissue
    differences in splicing-factor abundance, in transcript intron burden, or in
    the reserve capacity of the spliceosome - are not tested in DHX16 and are not
    asserted.
  evidence:
  - reference: PMID:41052356
    reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in DEAH-box helicase 16 (DHX16) that are critical regulators of mRNA metabolism have been linked to neuromuscular oculoauditory syndrome (NMOAS), a rare disorder characterized by sensorineural hearing loss, neuromuscular deficits, and retinal abnormalities."
    explanation: "States the tissue selectivity - and, implicitly, the contrast between a general regulator of mRNA metabolism and a three-tissue phenotype."
  downstream:
  - target: Retinal degeneration
    description: The ocular arm.
    evidence:
    - reference: PMID:41052356
      reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Spectral-domain optical coherence tomography confirmed outer retinal thinning and disruption of the photoreceptor integrity."
      explanation: "Structural retinal degeneration documented on OCT in a patient."
  - target: Sensorineural hearing impairment
    description: The auditory arm.
    evidence:
    - reference: PMID:41052356
      reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report covers a rare case of a 6-month-old girl with congenital SNHL, global hypotonia, and distinctive bilateral retinal dystrophy."
      explanation: "Congenital sensorineural hearing loss in a patient, alongside the hypotonia and retinal disease."
  - target: Hypotonia
    description: The neuromuscular arm as it presents in infancy.
    evidence:
    - reference: PMID:41052356
      reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report covers a rare case of a 6-month-old girl with congenital SNHL, global hypotonia, and distinctive bilateral retinal dystrophy."
      explanation: "Global hypotonia in the same patient."
  - target: Global developmental delay
    description: The neurodevelopmental arm.
    evidence:
    - reference: PMID:31256877
      reference_title: "Paralog Studies Augment Gene Discovery: DDX and DHX Genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we describe 15 unrelated individuals who have DD and/or ID, central nervous system (CNS) dysfunction, vertebral anomalies, and dysmorphic features and were found to have probably damaging variants in DExD/H-box RNA helicase genes."
      explanation: "Developmental delay and intellectual disability across the founding cohort, four of whom carried DHX16 variants."

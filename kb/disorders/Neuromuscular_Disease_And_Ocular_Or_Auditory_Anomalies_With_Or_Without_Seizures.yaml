genetic:
- name: DHX16
  gene_term:
    preferred_term: DHX16
    term:
      id: hgnc:2739
      label: DHX16
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: De novo heterozygous missense variants, clustering in and around the helicase domain
  presence: Positive
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Two things about the variant spectrum are worth a curator's attention and are
    easy to lose in prose. First, it is missense-only: no truncating allele has
    been reported in an affected individual, across a series now in double figures.
    For a gene this constrained that is unlikely to be chance, and it is the
    strongest argument that the mechanism is dominant-negative rather than
    haploinsufficiency. Second, codon 454 recurs with two different substitutions
    in unrelated patients - p.Arg454Trp (PMID:37574199, and again in PMID:41052356)
    and p.Arg454Gly (PMID:42562406). Distinct substitutions at one residue in
    unrelated people is the signature of a specific functional site rather than of
    a tolerant one.

    A caution on variant interpretation here: PMID:40326698 reports in-silico
    pathogenicity predictors positive for its allele while Missense3D shows no
    structural damage. For a helicase whose disease mechanism is probably an
    interaction defect rather than a folding defect, structural-damage prediction
    may be the wrong instrument, and a negative one should not be read as
    reassurance.
  evidence:
  - reference: PMID:31256877
    reference_title: "Paralog Studies Augment Gene Discovery: DDX and DHX Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified ten total individuals with missense variants in three other DDX/DHX paralogs: DHX16 (four individuals), DDX54 (three individuals), and DHX34 (three individuals)."
    explanation: "The four founding DHX16 individuals that established the gene-disease relationship."
  - reference: PMID:37574199
    reference_title: "Infantile onset encephalomyopathy, retinopathy, optic atrophy, and mitochondrial DNA depletion associated with a novel pathogenic DHX16 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified previously unpublished variant in DHX16 gene, a de novo heterozygous c.1360C>T (p. Arg454Trp)"
    explanation: "One of the two substitutions at the recurrent codon 454."
  - reference: PMID:42562406
    reference_title: "A De Novo DHX16 Variant Associated With Neuromuscular Oculoauditory Syndrome Regulates Pre-mRNA Splicing In Vitro."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-exome sequencing identified a de novo DHX16 variant (c.1360C>G, p.Arg454Gly) in a 2-year-old boy with NMOAS"
    explanation: "The second substitution at the same nucleotide in an unrelated patient, which is what makes codon 454 a recurrent site."
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    The diagnosis is molecular and, because the variants are de novo, trio testing
    is what makes it tractable - a de novo call in a singleton is a variant of
    uncertain significance until the parents are tested. In one reported patient a
    targeted inherited-retinal-disorder panel returned only variants of uncertain
    significance and it took trio exome sequencing to find the answer, which is a
    general warning against phenotype-restricted panels in a multisystem disease.
  diagnosis_term:
    preferred_term: trio exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40326698
    reference_title: "DHX16-Associated Neuromuscular Oculoauditory Syndrome: A Novel Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An inherited retinal disorder panel identified nondiagnostic variants of uncertain significance. Trio exome sequencing revealed a de novo Likely Pathogenic DHX16 variant, c.692G>C; p.R231P."
    explanation: "The panel failed and trio exome sequencing succeeded, in the same patient."
  - reference: PMID:41052356
    reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole trio genome sequencing identified a de novo heterozygous variant in DHX16, c.1360C>T (p.Arg454Trp), previously described in only one patient, and classified as likely pathogenic."
    explanation: "Trio genome sequencing as the diagnostic route in a second patient."
- name: Ophthalmological Assessment with Optical Coherence Tomography
  description: >-
    Retinal imaging is both diagnostic and, in an infant with hypotonia and hearing
    loss, the finding that points at this gene rather than at the much larger
    differential of infantile neuromuscular disease. OCT resolves the lesion to the
    outer retina and photoreceptors.
  diagnosis_term:
    preferred_term: spectral-domain optical coherence tomography
    term:
      id: NCIT:C162464
      label: Spectral Domain-Optical Coherence Tomography
  evidence:
  - reference: PMID:41052356
    reference_title: "Severe Macular Atrophy in an Infant With Neuromuscular Oculoauditory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands the understanding of DHX16-associated NMOAS and the importance of comprehensive ophthalmological assessment and genetic analysis in infants with multisystem involvement."
    explanation: "The authors' own conclusion about the diagnostic role of ophthalmological assessment here."
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A literature count only. Four individuals in the 2019 founding cohort; five
    patients as of PMID:37574199; ten published cases as of PMID:40326698, which
    reports itself as the tenth; and at least two further reports since
    (PMID:41052356, PMID:42562406). No population-based estimate exists and no
    rate is recorded. Read the count as a snapshot - it has roughly doubled in the
    two years covered by the sources cited here.

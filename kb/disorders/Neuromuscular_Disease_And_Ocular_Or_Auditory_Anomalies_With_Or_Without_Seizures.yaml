clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The reported range is wide and does not track anything yet identified. At one
    end, a 3-year-old with mild developmental delay, ocular anomalies and
    dysmorphism; at the other, fatal infantile encephalomyopathy. Sensory
    impairment - hearing loss and progressive retinal degeneration - is a
    substantial lifelong burden even in the milder patients, and the retinal
    disease appears progressive. With a series still in double figures, VARIABLE
    reflects genuine uncertainty about the distribution as much as genuine
    variability.
  evidence:
  - reference: PMID:37574199
    reference_title: "Infantile onset encephalomyopathy, retinopathy, optic atrophy, and mitochondrial DNA depletion associated with a novel pathogenic DHX16 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a patient with mitochondrial DNA depletion in skeletal muscle and a multiorgan phenotype, including fatal encephalomyopathy, retinopathy, optic atrophy, and sensorineural hearing loss."
    explanation: "The severe end: a fatal encephalomyopathy."
  - reference: PMID:40326698
    reference_title: "DHX16-Associated Neuromuscular Oculoauditory Syndrome: A Novel Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a tenth case: a 3-year-old female, initially presented at 7 months of age, with mild developmental delay, ocular anomalies, dysmorphia, and increased infections."
    explanation: "The mild end, in a patient old enough for the assessment to mean something."
discussions:
- discussion_id: dhx16_tissue_selectivity_of_a_general_splicing_defect
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Selective Failure of Neuromuscular and Sensory Tissues
  prompt: >-
    Why does impairing a core, universally required spliceosome activator produce
    retinal, cochlear and neuromuscular disease specifically, rather than a
    generalised cellular failure?
  rationale: >-
    This is the entry's principal gap and the reason the pathograph has a node
    that asserts a selectivity it cannot explain. DHX16 is the human Prp2
    orthologue, needed for the catalytic activation of every spliceosome, and the
    dominant-negative work shows intron retention across many genes. Yet the
    phenotype is a fairly reproducible three-tissue syndrome.

    The question is not specific to DHX16 - the spliceosomopathies as a class have
    it, with core PRPF components causing isolated retinitis pigmentosa and others
    causing craniofacial disease - which is an argument for looking at it as a
    class rather than one gene at a time. The candidate explanations in the wider
    field (tissue differences in splicing factor abundance, in intron burden, or
    in spliceosome reserve capacity) are untested in DHX16 and are deliberately not
    curated as edges.
  proposed_experiments:
  - experiment_id: dhx16_patient_transcriptome_by_tissue
    name: Transcriptome-wide intron-retention profiling in patient cells of several lineages
    description: >-
      The only patient-allele splicing data available is from a heterologous
      cell line and covers two transcripts. Profiling intron retention genome-wide
      in patient-derived fibroblasts, iPSC-derived retinal organoids and myotubes
      from the same individual would show whether affected tissues retain more
      introns, or different ones, than unaffected tissue from the same person -
      which is the discriminating comparison and is not confounded by genotype.
    readouts:
    - name: Genome-wide intron retention by lineage
      target: pathophysiology#Intron Retention and Nuclear Retention of Unspliced Transcripts
      direction: INCREASED
      interpretation: >-
        More retention in retinal and muscle lineages than in fibroblasts from the
        same patient would support differential tissue vulnerability; equal
        retention would point away from it and toward the identity of the
        transcripts rather than the amount.
- discussion_id: dhx16_dominant_negative_inferred_not_measured
  status: OPEN
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#De Novo DHX16 Missense Variant
  - genetic#DHX16
  prompt: >-
    Is the mechanism genuinely dominant-negative, and has that been shown for any
    patient allele in a patient cell?
  rationale: >-
    The entry records `functional_impact_category: DOMINANT_NEGATIVE`, and the
    grounds for that are worth stating openly because they are circumstantial. The
    allele spectrum is missense-only with no truncating variant reported; one
    residue recurs with two substitutions; and mutant DHX16 added to competent
    nuclear extract actively inhibits splicing. But the direct-inhibition
    experiments used engineered constructs (G724N, S552L), not patient alleles, and
    the one patient-allele assay (p.Arg454Gly) measured intron retention in a
    transfected cell line without testing whether the mutant interferes with
    wild-type DHX16.

    Pushing against it: PMID:37574199 found DHX16 expression *decreased* in
    patient fibroblasts and muscle, which is what a destabilising loss-of-function
    allele would do, and is not what a stable interfering protein predicts. Those
    two observations have not been reconciled.
- discussion_id: dhx16_spliceosomopathy_module_candidate
  status: OPEN
  kind: CURATION_TODO
  attaches_to:
  - disease#Neuromuscular Disease And Ocular Or Auditory Anomalies With Or Without Seizures
  prompt: >-
    Should dismech carry a spliceosomopathy mechanism module, and would this entry
    conform to it?
  rationale: >-
    `kb/modules/` was grepped for `splic`, `spliceosom`, `RNA`, `helicase`,
    `transcript` and `mRNA`, and `just list-modules` read in full: nothing covers
    spliceosomal dysfunction, so `conforms_to` is unset here. But the family is
    real and recurrent - DHX16, DHX37, DDX54 and DHX34 came out of one paper, and
    EFTUD2, SNRPB and the PRPF retinitis-pigmentosa genes sit alongside them - and
    it shares the tissue-selectivity puzzle above as a defining feature rather than
    as an incidental one.

    Not created here, because a module built from a single disease encodes that
    disease rather than the mechanism. Recorded so the next spliceosomopathy
    curated has somewhere to find the argument.

    The peers already exist in the KB and each models the pathway locally in its
    own `pathophysiology` block rather than through `conforms_to`, which is the
    duplication a module would remove: `PRPF31-Related_Retinopathy` (a
    tri-snRNP assembly factor, and the closest structural analogue - one gene,
    dominant, one MONDO term, no subtypes), `Burn-McKeown_Syndrome`,
    `Mandibulofacial_Dysostosis_with_Microcephaly` and
    `Cerebrocostomandibular_Syndrome`. All four were verified present in
    `kb/disorders/` while writing this note. Note what that list already shows: a
    tri-snRNP assembly factor gives isolated retinal disease, an EFTUD2-family
    defect gives craniofacial disease, and a catalytic-activation helicase gives
    this neuromuscular-sensory syndrome. Five entries, five different tissues, one
    machine - which is the argument for a module and simultaneously the reason a
    module would have to be built around the selectivity question rather than
    around the splicing step.

    Surfaced by the automated second-opinion comment on the claim issue
    (dismech#12391), which named the four peers and independently reached the same
    conclusion that no core-spliceosome module exists.

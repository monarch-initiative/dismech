progression:
- phase: Long-term symptomatic improvement and remission
  notes: >-
    Prospective adult studies generally show symptomatic improvement over time,
    although estimates vary with cohort, treatment exposure, remission
    definition, and follow-up duration. A meta-analysis of 11 studies found
    long-term diagnostic remission in 50%-70% of participants.
  evidence:
  - reference: PMID:30599336
    reference_title: "Long-term clinical and functional course of borderline personality disorder: A meta-analysis of prospective studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between 50% and 70% of the BPD patients achieved remission in the
      long-term.
    explanation: >-
      The prospective-study meta-analysis directly quantifies long-term
      diagnostic remission.
  - reference: PMID:29795363
    reference_title: Borderline personality disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients gradually enter symptomatic remission, and their rate of
      remission can be accelerated by evidence-based psychosocial treatments.
    explanation: >-
      The disease primer describes gradual symptomatic remission and the role
      of evidence-based psychosocial care.
- phase: Persistent functional vulnerability and possible recurrence
  notes: >-
    Symptomatic remission does not guarantee durable social and vocational
    recovery. In one intensively assessed inpatient cohort followed for 24
    years, sustained remission was more common than sustained recovery, and
    loss of recovery was more common than symptomatic recurrence; those
    cohort-specific percentages should not be generalized as population rates.
  evidence:
  - reference: PMID:39480146
    reference_title: "Sustained Symptomatic Remission and Recovery and Their Loss Among Patients With Borderline Personality Disorder and Patients With Other Types of Personality Disorders: A 24-Year Prospective Follow-Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the results of this study suggest that sustained
      symptomatic remission is substantially more common than sustained
      recovery from BPD.
    explanation: >-
      The 24-year prospective cohort distinguishes symptom remission from the
      stricter outcome of remission plus good social and vocational
      functioning.
  - reference: PMID:39480146
    reference_title: "Sustained Symptomatic Remission and Recovery and Their Loss Among Patients With Borderline Personality Disorder and Patients With Other Types of Personality Disorders: A 24-Year Prospective Follow-Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They also suggest that loss of sustained recovery is more common than
      symptomatic recurrences for those with BPD.
    explanation: >-
      Long follow-up supports continued attention to functioning even after
      diagnostic symptoms improve.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    BPD can substantially disrupt relationships, education, employment, and
    housing and is associated with recurrent crises, nonsuicidal self-injury,
    suicide attempts, psychiatric comorbidity, and high health-care and social
    costs. Functional impairment can persist after symptomatic remission.
  evidence:
  - reference: PMID:41613746
    reference_title: Practice Assessment Tool for the Care of Patients With Borderline Personality Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPD is associated with substantial lifetime burdens and psychosocial
      impairments, including high rates of co-occurring psychiatric disorders;
      disruptions in interpersonal relationships, school, work, and housing;
      and suicide attempts and nonsuicidal self-injury.
    explanation: >-
      The APA practice-assessment publication directly describes the lifetime,
      functional, comorbidity, and self-harm burden.
  - reference: PMID:29795363
    reference_title: Borderline personality disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Caretakers are often intimidated or alienated by patients with borderline
      personality disorder (BPD), compounding the clinical challenges posed by
      the severe morbidity, high social costs and substantial prevalence of
      this disorder in many health-care settings.
    explanation: >-
      The disease primer characterizes BPD as having severe morbidity and high
      social costs.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    BPD has moderate heritability and familial aggregation but is not modeled
    as a Mendelian disorder. The register-family design supports distributed
    inherited liability without identifying a deterministic variant or gene.
  evidence:
  - reference: DOI:10.1038/s41380-019-0442-0
    reference_title: "Familial risk and heritability of diagnosed borderline personality disorder: a register study of the Swedish population"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heritability was estimated at 46% (95% CI = 39–53), and the remaining
      variance was explained by individually unique environmental factors.
    explanation: >-
      The family model establishes moderate inherited liability; describing it
      as polygenic is a disease-level interpretation rather than a locus-level
      result from this study.
  - reference: DOI:10.1038/s41380-019-0442-0
    reference_title: "Familial risk and heritability of diagnosed borderline personality disorder: a register study of the Swedish population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The familial association decreased along with genetic relatedness.
    explanation: >-
      The relatedness gradient supports inherited liability while remaining
      compatible with a multifactorial rather than Mendelian architecture.
mechanistic_hypotheses:
- hypothesis_group_id: multifactorial_liability_model
  hypothesis_label: Multifactorial genetic and non-shared-environment liability
  status: CANONICAL
  description: >-
    Familial aggregation, moderate heritability, and substantial individually
    unique environmental variance support a multifactorial liability model.
    The specific variants, exposures, developmental pathways, and
    gene-environment relationships remain unresolved.
  evidence:
  - reference: DOI:10.1038/s41380-019-0442-0
    reference_title: "Familial risk and heritability of diagnosed borderline personality disorder: a register study of the Swedish population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heritability was estimated at 46% (95% CI = 39–53), and the remaining
      variance was explained by individually unique environmental factors.
    explanation: >-
      The population-register family model directly supports both inherited
      and non-shared-environment contributions.
- hypothesis_group_id: autonomic_stress_correlate_model
  hypothesis_label: Autonomic, HPA-axis, inflammatory, and cardiometabolic correlate model
  status: EMERGING
  description: >-
    Altered heart-rate variability and HPA-axis, inflammatory, and metabolic
    findings have been proposed as part of BPD biology. Available evidence here
    is a narrative synthesis of human associations and does not determine
    whether these findings precede BPD, follow chronic stress and illness, or
    reflect comorbidity, medication, behavior, or other confounding.
  evidence:
  - reference: DOI:10.3390/ijms252212286
    reference_title: "Metabolic Dysfunctions, Dysregulation of the Autonomic Nervous System, and Echocardiographic Parameters in Borderline Personality Disorder: A Narrative Review"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altered heart rate variability (HRV), reflecting the dysregulation of the
      autonomic nervous system, is associated with some BPD core symptoms, such
      as emotional instability and impulsivity.
    explanation: >-
      The review supports association with BPD symptoms but not causal
      direction.

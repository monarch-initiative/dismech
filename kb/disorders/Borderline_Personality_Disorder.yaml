datasets:
- accession: geo:GSE52222
  title: Aberrant methylation of gene associated CpG sites occurs in borderline personality disorder
  description: Borderline personality disorder (BPD) is a complex psychiatric disease with an increased impact in the last years. While the diagnosis and therapy are well established, little is known on the pathogenesis of borderline personality disorder. Previously, a significant increase in DNA methylation of relevant neuropsychiatric genes in BPD patients has been reported. In our study we performed genome wide methylation analysis and revealed specific CpG sites that exhibited increased methylation in 26 BPD patients compared to 11 healthy controls.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 36
  publication: PMID:24367640
  notes: Identified by GEO DataSets index search for Borderline Personality Disorder (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
review_notes: >-
  Re-reviewed from cached primary studies, systematic reviews, and registry
  records; the Falcon deep-research artifact was used only for source
  discovery. Broad inherited and non-shared-environment liability is retained,
  but no single causal gene is asserted. Autonomic, HPA-axis, inflammatory, and
  cardiometabolic findings were collapsed into one provisional correlate node,
  and prior arrows that treated cross-sectional associations as causes were
  removed. Clinical diagnosis remains longitudinal and syndromic; no
  group-level physiological finding is represented as a diagnostic biomarker.
  Pharmacotherapy is not represented as disease-directed first-line treatment
  because the curated evidence supports psychotherapy as first-line and the
  disease primer cautions that misleading pharmacological interventions rarely
  succeed. ClinicalTrials.gov was queried on 2026-07-24; three representative,
  disease-specific active interventional trials were retained, while
  observational studies, broad transdiagnostic records, and redundant
  psychotherapy trials were excluded. Active registry status and phase do not
  imply efficacy. A Monarch D2P audit on 2026-07-24 found no OMIM- or
  Orphanet-backed phenotype rows for MONDO:0001156; three additional clinical
  phenotypes were therefore added only from direct APA publication evidence,
  and all eight curated phenotypes are connected to the clinical pathograph.

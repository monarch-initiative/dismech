name: Borderline Personality Disorder
creation_date: "2026-04-28T00:00:00Z"
category: Psychiatric
description: >-
  Borderline personality disorder (BPD) is a psychiatric disorder defined by a
  long-term pattern of instability in interpersonal relationships, self-image,
  affect, and impulse control. Presentations can include abandonment
  sensitivity, recurrent self-injury or suicidal behavior, anger dysregulation,
  transient paranoid ideation, and stress-related dissociation. Liability is
  multifactorial; group-level autonomic, stress-axis, inflammatory, and
  cardiometabolic findings are correlates rather than validated diagnostic
  biomarkers or established causal pathways.

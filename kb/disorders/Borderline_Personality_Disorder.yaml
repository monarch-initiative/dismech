    reference_title: "Mentalisierungsbasierte Therapie Versus Bona-fide-Therapie für Patient:Innen Mit Borderline-Persönlichkeitsstörung in Deutschland (MaGnet): Eine Prospektive, Multizentrische Randomisiert-kontrollierte Studie Mentalization-based Treatment Versus Bona-fide Treatment for Patients With Borderline Personality Disorder in Germany (MAGNET): a Prospective, Multi-centre Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary objective of this RCT is to investigate whether outpatient
      MBT is more effective in the reduction of crisis events (incidences of
      NSSI and suicide attempts) compared with BFT (namely psychodynamic or
      cognitive-behavioural psychotherapy) in Germany.
    explanation: >-
      The registry directly states the randomized comparison and primary crisis
      outcome.

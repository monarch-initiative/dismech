discussions:
- discussion_id: gap_bpd_autonomic_stress_causality
  prompt: >-
    Are autonomic, HPA-axis, inflammatory, and cardiometabolic differences
    causal contributors to BPD, consequences of chronic stress and illness, or
    correlates of comorbidity, medication, and health behavior?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Autonomic, Stress-System, and Cardiometabolic Correlates
  rationale: >-
    The available source is a narrative review of heterogeneous human
    associations. Direction, specificity, temporal precedence, and individual
    diagnostic utility remain unestablished.
  evidence:
  - reference: DOI:10.3390/ijms252212286
    reference_title: "Metabolic Dysfunctions, Dysregulation of the Autonomic Nervous System, and Echocardiographic Parameters in Borderline Personality Disorder: A Narrative Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altered heart rate variability (HRV), reflecting the dysregulation of the
      autonomic nervous system, is associated with some BPD core symptoms, such
      as emotional instability and impulsivity.
    explanation: >-
      The source uses associative language and therefore leaves causal
      direction unresolved.
- discussion_id: gap_bpd_symptomatic_vs_functional_recovery
  prompt: >-
    Which mechanisms and care components convert symptomatic remission into
    durable social and vocational recovery, and prevent subsequent loss of
    recovery?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Persistent functional vulnerability and possible recurrence
  rationale: >-
    Long follow-up shows that remission of diagnostic symptoms is more common
    than sustained functional recovery, so symptom-only outcomes can overstate
    recovery.
  evidence:
  - reference: PMID:39480146
    reference_title: "Sustained Symptomatic Remission and Recovery and Their Loss Among Patients With Borderline Personality Disorder and Patients With Other Types of Personality Disorders: A 24-Year Prospective Follow-Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the results of this study suggest that sustained
      symptomatic remission is substantially more common than sustained
      recovery from BPD.
    explanation: >-
      The prospective cohort directly establishes the outcome gap motivating
      this question.
- discussion_id: gap_bpd_comparative_psychotherapy_effectiveness
  prompt: >-
    Which psychotherapy components and delivery formats produce the most
    durable benefits for particular BPD presentations beyond common therapeutic
    factors and bona fide active comparators?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Evidence-Based Psychotherapy
  - treatments#Mentalization-Based Treatment
  - clinical_trials#NCT06018272
  rationale: >-
    Psychotherapy is first-line and several modalities improve outcomes, but
    direct active-comparator evidence and treatment-matching evidence remain
    limited. Current trials should not be interpreted as proof of superiority.
  evidence:
  - reference: clinicaltrials:NCT06018272
    reference_title: "Mentalisierungsbasierte Therapie Versus Bona-fide-Therapie für Patient:Innen Mit Borderline-Persönlichkeitsstörung in Deutschland (MaGnet): Eine Prospektive, Multizentrische Randomisiert-kontrollierte Studie Mentalization-based Treatment Versus Bona-fide Treatment for Patients With Borderline Personality Disorder in Germany (MAGNET): a Prospective, Multi-centre Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yet, randomized-controlled trials (RCT) on MBT in outpatient settings
      compared with bona fide treatment (BFT) are still scarce and none has been
      conducted in Germany.
    explanation: >-
      The trial record explicitly identifies scarcity of MBT comparisons with
      bona fide outpatient treatment.

- name: Patient-Derived AChR Antibody Passive Transfer in Lewis Rats
  species: Rattus norvegicus
  background: Four-week-old female Lewis rats
  category: Passive antibody transfer
  description: A single injection of aG101 plus bG402-G1 induced weakness, complement deposition, receptor loss, and junction fragmentation. Total antibody dose was matched to individual-antibody arms; behavior was assessed in 6–7 animals per group pooled from two experiments. A separate early histology cohort assessed complement and morphology. Single antibodies did not produce the overt behavioral phenotype, although aG101 alone increased C3 staining.
  publication: PMID:36074148
  notes: Acute passive transfer into four-week-old female Lewis rats bypasses human loss of tolerance and antibody production. bG402 was artificially switched from IgG4 to IgG1. The model does not test aging, late-onset initiation, chronic disease, or MuSK autoimmunity.

treatments:
- name: Thymectomy
  description: >
    Surgical removal of the thymus. The randomized evidence base is explicitly adult and
    age-bounded — MGTX enrolled patients aged 18 to 65 with generalized non-thymomatous
    AChR-antibody-positive disease — so it speaks to the early-onset end of the adult-onset spectrum.
    Whether the benefit extends to late-onset disease is not established by randomized data.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: thymectomy
    term:
      id: NCIT:C29894
      label: Thymectomy
  target_mechanisms:
  - target: Thymic Follicular Hyperplasia and Ectopic Germinal Centre Formation
    treatment_effect: INHIBITS
    description: Removes the hyperplastic thymus in which the early-onset anti-AChR response is generated and sustained.
    evidence:
    - reference: PMID:27273086
      reference_title: "Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Altogether, based on the pathological and molecular thymic abnormalities found in MG patients, this review provides some explanations for the benefit of thymectomy in early-onset MG patients."
      explanation: Links the surgical target (the hyperplastic thymus) to the observed early-onset benefit.
  evidence:
  - reference: PMID:27509100
    reference_title: "Randomized Trial of Thymectomy in Myasthenia Gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 18 to 65 years of age who had generalized nonthymomatous myasthenia gravis with a disease duration of less than 5 years were included"
    explanation: >-
      Defines the age window of the only randomized thymectomy trial — the reason this entry treats
      the thymectomy evidence as onset-age-bounded rather than general to myasthenia gravis.
  - reference: PMID:27509100
    reference_title: "Randomized Trial of Thymectomy in Myasthenia Gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who underwent thymectomy had a lower time-weighted average Quantitative Myasthenia Gravis score over a 3-year period than those who received prednisone alone (6.15 vs. 8.99, P<0.001)"
    explanation: Demonstrates benefit within that adult, non-thymomatous population.
  - reference: PMID:40022458
    reference_title: "Can Non-Thymomatous Late-Onset Myasthenia Gravis Benefit From Thymectomy? A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thymectomy is beneficial for treating early-onset acetylcholine receptor antibody-positive myasthenia gravis (MG); however, its effects on late-onset MG (LOMG) remain less well understood."
    explanation: >-
      States the asymmetry directly: established for early onset, unresolved for late onset. Marked
      PARTIAL because it qualifies rather than supports a general thymectomy recommendation.
  - reference: PMID:40022458
    reference_title: "Can Non-Thymomatous Late-Onset Myasthenia Gravis Benefit From Thymectomy? A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thymectomy may be a potentially effective treatment for LOMG, particularly in patients who undergo the procedure soon after diagnosis. A randomized controlled study for LOMG patients is needed."
    explanation: >-
      The meta-analysis' own hedged conclusion, including its explicit statement that randomized
      evidence for late onset does not yet exist.
  - reference: PMID:23893883
    reference_title: "Late-onset myasthenia gravis: a review when incidence in older adults keeps increasing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The most controversial issue in treatment is thymectomy, because not enough data are available."
    explanation: Independent statement that thymectomy remains the unsettled question in late-onset management.
- name: Corticosteroid and Azathioprine Immunosuppression
  description: >
    Combination corticosteroid plus azathioprine immunosuppression, reported to improve outcome in
    generalized non-thymomatous late-onset disease — the subgroup in which the thymectomy evidence is
    weakest and in which comorbidity constrains treatment choice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  target_mechanisms:
  - target: Autoantibody-Mediated Neuromuscular Junction Failure
    treatment_effect: INHIBITS
    description: Broad immunosuppression reduces the autoantibody response driving endplate damage.
    evidence:
    - reference: PMID:31811563
      reference_title: "Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Use of prednisone + azathioprine had significantly positive effect on outcome."
      explanation: Outcome evidence that immunosuppression modifies the disease in the late-onset subgroup.
  evidence:
  - reference: PMID:31811563
    reference_title: "Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Use of prednisone + azathioprine had significantly positive effect on outcome."
    explanation: Direct outcome evidence for this combination specifically within generalized non-thymomatous late-onset disease.
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyridostigmine is the preferred symptomatic treatment, and for patients who do not adequately respond to symptomatic therapy, corticosteroids, azathioprine, and thymectomy are first-line immunosuppressive treatments."
    explanation: Places corticosteroids and azathioprine as first-line immunosuppression in the subgroup-based treatment framework.
- name: Pyridostigmine
  description: >
    Acetylcholinesterase inhibition as symptomatic therapy, the preferred first symptomatic treatment
    across myasthenia gravis subgroups including adult-onset disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Autoantibody-Mediated Neuromuscular Junction Failure
    treatment_effect: INHIBITS
    description: >-
      Prolongs acetylcholine availability at the endplate, partially compensating for the reduced
      receptor number without modifying the autoimmune process.
    evidence:
    - reference: PMID:26376969
      reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Pyridostigmine is the preferred symptomatic treatment"
      explanation: >-
        Supports the symptomatic role. Marked PARTIAL because the source establishes preference,
        not the endplate-level mechanism asserted in the description.
  evidence:
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyridostigmine is the preferred symptomatic treatment"
    explanation: Establishes pyridostigmine as the preferred symptomatic therapy in the subgroup-based framework.
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term drug treatment is essential for most patients and must be tailored to the particular form of myasthenia gravis."
    explanation: Supports the entry's premise that treatment is tailored by subgroup rather than uniform.

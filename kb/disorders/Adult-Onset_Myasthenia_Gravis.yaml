clinical_trials:
- name: NCT00294658
  phase: PHASE_III
  status: COMPLETED
  description: MGTX compared extended transsternal thymectomy plus standardized prednisone with prednisone alone in 126 adults with generalized nonthymomatous AChR-positive MG of less than five years duration. The three-year randomized results support clinical benefit and steroid sparing. Enrollment age 18–65 included older adults; this is not a dedicated, adequately powered very-late-onset trial.
  notes: Registry status checked against ClinicalTrials.gov API on 2026-09-21. The generated cache contains a brief summary, so status and complete design were separately checked in the live record.

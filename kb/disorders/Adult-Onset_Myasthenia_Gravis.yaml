- name: Vaccination and Infection-Risk Management
  description: Review vaccination and infection risks before immunotherapy. Complement inhibition requires meningococcal precautions and, where urgent initiation precludes adequate vaccine protection, antibiotic prophylaxis according to the applicable regimen. Live vaccines are generally avoided during immunotherapy. Protection is not complete after vaccination.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: If the effectiveness of the vaccination cannot be waited for or if a vaccination success cannot be assumed due to the immunotherapy, prophylactic antibiotic therapy should be started in addition to the vaccination.
    explanation: Guideline complement-inhibitor precaution.
- name: Clinical and Treatment-Toxicity Monitoring
  description: Assess clinical strength, function, MG-ADL or related scales, quality of life, and treatment toxicity over time. Routine antibody titers should not substitute for clinical disease-activity assessment.
  action_category: MONITORING
  evidence:
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Therefore, routine clinical use of autoantibody testing to determine disease activity cannot be recommended.
    explanation: Correlation is too variable for routine activity monitoring.
- name: Fatigue Management and Rehabilitation
  description: Assess persistent fatigue separately from muscle weakness, optimize disease control and sleep, and support appropriately paced exercise, nutrition, and psychological care. Fatigue-drug evidence is limited.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Patients’ self-efficacy should be enhanced via modification of lifestyle factors, such as good sleep hygiene, balanced diet, avoidance of excessive alcohol consumption, and performance of aerobic exercise. If necessary, additional psychological support may be helpful.
    explanation: Guideline supportive care.
  target_mechanisms:
  - target: Fatigue
    treatment_effect: MODULATES
    description: Addresses contributors to perceived fatigue and function.
    evidence:
    - reference: PMID:38152089
      reference_title: Guideline for the management of myasthenic syndromes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Patients should be encouraged to not overprotect themselves or exert themselves beyond the limits set by MG.
      explanation: Individual pacing rather than unrestricted exercise.
- name: Pregnancy and Reproductive Counseling
  description: Arrange specialist counseling before or during pregnancy, review drug-specific fetal risks and treatment alternatives, and coordinate maternal and neonatal care. Transient neonatal disease from maternal antibody transfer is distinct from inherited congenital myasthenic syndromes.
  action_category: COUNSELING_INFORMATIONAL
  evidence:
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In case of pregnancy and a desire to have children, a specific consultation should be made in a center specialized in myasthenia.
    explanation: Specialist counseling recommendation.
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Because of the risk of neonatal MG and peripartum deterioration of maternal MG, child delivery should be planned in a maximum care hospital, including those with neonatology and neuropediatric expertise and intensive care monitoring capabilities.
    explanation: Supports coordinated delivery and neonatal planning.
- name: Medication and Exacerbation Education
  description: Review new medications for possible worsening, discuss infection and intercurrent-illness plans, and teach recognition of bulbar or respiratory deterioration. Medication risk is contextual and should not be replaced by a blanket prohibition of every drug reported to worsen MG.
  action_category: COUNSELING_INFORMATIONAL
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK559331/
    reference_title: Myasthenia Gravis - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: take their medications as directed and to avoid taking new medicines without checking with the medical provider.
    explanation: Medication review and adherence advice.

    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Bulbar, neck and respiratory muscles are involved with fast progression of the disease to life-threatening symptoms
    explanation: Review describes the MuSK-associated distribution.
- name: Myasthenic Crisis
  category: Respiratory
  description: Severe respiratory-muscle or bulbar weakness can cause respiratory failure requiring ventilatory support. A historical cohort observed crises in 13% of both generalized early- and late-onset groups; that cohort does not establish equal risk in all populations.
  phenotype_term:
    preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:22476514
    reference_title: Characteristics of late-onset myasthenia gravis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Myasthenic crisis was equally common in generalized EOMG and LOMG (13 %).
    explanation: Source-specific observation; no general population frequency is assigned.
  - reference: PMID:39105625
    reference_title: 'Myasthenia gravis: the future is here.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Generalized weakness can range from highly isolated manifestations, particularly bulbar muscles, to widespread muscle weakness, including respiratory insufficiency producing respiratory failure
    explanation: Supports the respiratory-failure manifestation; the cohort quote separately supports only its source-specific crisis frequency.
- name: Fatigue
  category: Constitutional
  description: Patient-reported fatigue may persist despite control of demonstrable muscle weakness. Sleep disturbance, psychological factors, and disease activity may contribute; this is distinct from use-dependent neuromuscular fatigability.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:39105625
    reference_title: 'Myasthenia gravis: the future is here.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Despite resolution of manifest weakness with treatment, many patients complain of general fatigue
    explanation: Review distinguishes fatigue from manifest weakness.
- name: Thymic Follicular Hyperplasia
  category: Thymic
  description: Follicular hyperplasia with germinal centers is enriched in early-onset AChR-positive MG, especially women. Surgical series do not establish its population prevalence.
  phenotype_term:
    preferred_term: Thymus hyperplasia
    term:
      id: HP:0010516
      label: Thymus hyperplasia
  evidence:
  - reference: PMID:27273086
    reference_title: 'Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We show that among patients presenting a thymic hyperplasia with germinal centers (GC), 80 % are females
    explanation: Primary histological result; the denominator is those with hyperplasia, not all women with MG.
  subtype: EOMG
- name: Thymoma
  category: Thymic
  description: A thymic epithelial tumor occurs in a minority and changes oncological management independently of the onset-age category.
  phenotype_term:
    preferred_term: Thymoma
    term:
      id: HP:0100522
      label: Thymoma
  evidence:
  - reference: ORPHA:391490
    reference_title: Adult-onset myasthenia gravis
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: generalized muscle weakness, and occasionally associated with thymoma.
    explanation: Structured adult-onset disease record.
biochemical:
- name: Anti-Acetylcholine Receptor Antibody
  context: AChR antibodies are diagnostically useful in a compatible clinical presentation. Detection rates vary with clinical distribution, assay, and cohort; antibody concentration does not reliably quantify current disease activity.
  biomarker_term:
    preferred_term: Anti-acetylcholine receptor antibody positivity
    term:
      id: HP:6001064
      label: Anti-acetylcholine receptor antibody positivity
  evidence:
  - reference: PMID:22476514
    reference_title: Characteristics of late-onset myasthenia gravis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Anti-AChR antibody titers were elevated in 78 % of patients (65 % with EOMG vs. 85 % with LOMG; p = 0.003)
    explanation: Gives the onset-stratified seropositivity rates in a single cohort tested identically.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Anti-Titin Antibody
  subtype: LOMG
  context: Titin antibodies are associated with older onset and thymoma in selected cohorts, but are not established causes of neuromuscular transmission failure. A retrospective series found an association with generalized disease within its late-onset subgroup; this is not a validated prediction of progression.
  biomarker_term:
    preferred_term: Anti-titin antibody positivity
    term:
      id: HP:5000038
      label: Anti-titin antibody positivity
  evidence:
  - reference: PMID:31811563
    reference_title: 'Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 95 patients with generalized non-thymomatous LOMG, 60 (63%) were men, 45 (47%) had mild disease, 80 (84%) were anti-AChR, and 56 (61%) were anti-titin positive.
    explanation: Quantifies anti-titin seropositivity at 61% in generalized non-thymomatous late-onset disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:38505076
    reference_title: Anti-titin antibodies in a cohort of myasthenia gravis patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Anti-titin positivity was significantly associated with generalized MG in the late-onset group (P=0.005).
    explanation: Establishes the late-onset-specific clinical correlate of anti-titin positivity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: The 2019 cohort abstract reports 56 positive and 61% within 95 participants without specifying the tested denominator in the excerpt. No pooled frequency is inferred. In the 2024 cohort, 130 of 230 clinic patients were tested; 32 were positive, and testing often occurred long after thymectomy.
- name: Anti-Ryanodine Receptor Antibody
  subtype: LOMG
  context: RyR reactivity occurs in MG with striational autoimmunity, but the 2019 cell-based assay also detected substantial reactivity in disease controls and healthy controls. It is neither diagnostic of late-onset MG nor proof of pathogenicity.
  biomarker_term:
    preferred_term: Anti-ryanodine receptor antibody
    term:
      id: HP:5000047
      label: Anti-ryanodine receptor antibody
  notes: 'No onset-stratified frequency is asserted here: the late-onset cohorts cited in this entry quantified anti-titin but not anti-ryanodine-receptor seropositivity, so a frequency would be unsupported.'
  evidence:
  - reference: PMID:30918333
    reference_title: Cytometric cell-based assays for anti-striational antibodies in myasthenia gravis with myositis and/or myocarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MG patients with myositis and/or myocarditis as well as late-onset and thymoma-associated MG had anti-titin, anti-ryanodine receptor, and anti-Kv1.4 antibodies.
    explanation: Places anti-ryanodine-receptor antibody within the striational panel of late-onset and thymoma-associated disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30918333
    reference_title: Cytometric cell-based assays for anti-striational antibodies in myasthenia gravis with myositis and/or myocarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, patients with early-onset MG, those with other myopathies and healthy controls did not have anti-titin or anti-Kv1.4 antibodies with some exceptions, but they possessed anti-ryanodine receptor antibodies.
    explanation: The control reactivity supports the stated specificity limitation.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Anti-MuSK Antibody
  context: MuSK antibodies identify an antibody-mediated subgroup with different effector mechanisms and treatment responses. Negative AChR serology alone does not establish MuSK disease.
  biomarker_term:
    preferred_term: Anti-muscle-specific tyrosine kinase antibody
    term:
      id: HP:0030210
      label: Anti-muscle-specific tyrosine kinase antibody
  evidence:
  - reference: PMID:33458590
    reference_title: 'Myasthenia gravis: MuSK MG, late-onset MG and ocular MG.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Anti-MuSK antibodies are extremely rare in MG with prolonged pure ocular symptoms.
    explanation: Subtype and clinical-distribution context, not a universal frequency.
genetic:
- name: HLA-B*08
  subtype: EOMG
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  features: A major association in North European AChR-positive, nonthymomatous early-onset MG. The 2012 study analyzed 649 cases and 2,596 controls; eligibility allowed onset above 10 years, so it was not exclusively adult-onset. Conditioning on HLA-B*08 removed the marginal DRB1*03:01 signal, but linkage disequilibrium prevents a simple inference of a unique causal allele or demonstrated CD8-cell mechanism.
  evidence:
  - reference: PMID:23055271
    reference_title: Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We observed the strongest association in the HLA class I region at rs7750641
    explanation: Locates the strongest early-onset genome-wide signal in the HLA class I region.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:23055271
    reference_title: Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By imputation and conditional analyses, HLA-B*08 proves to be the major associated allele (p = 2.87 × 10(-113) ; OR, 6.41).
    explanation: Imputation and conditional analysis support the association, without a functional antigen-presentation assay.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:23055271
    reference_title: Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'All EOMG cases included in these studies were North European and met the following criteria: 1) clinical diagnostic criteria for MG; 2) anti-AChR antibody positive; 3) no evidence of thymoma; 4) onset-age >10 years and either <40 years or <45 years with hyperplastic thymic histology.'
    explanation: Defines the ancestry, serotype, thymoma exclusion, and juvenile inclusion.
- name: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  features: Onset-associated HLA class II signals differ between cohorts. The 2017 study reports enrichment of DRB1*03 in early-onset and DRB1*01 in late-onset cases. These marginal associations do not prove independence from linked HLA loci. The 2024 GWAS also observed opposite directions for several HLA alleles across onset groups, potentially reflecting modulation of onset timing.
  evidence:
  - reference: PMID:28495048
    reference_title: HLA and age of onset in myasthenia gravis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HLA-DRB1*03 allele was overrepresented in the global MG. When the early-onset subgroup was considered, this association became even stronger.
    explanation: Shows the class II risk allele concentrating in the early-onset subgroup.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:28495048
    reference_title: HLA and age of onset in myasthenia gravis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Regarding the late-onset subgroup, the frequency of HLA-DRB1*01 allele was higher than in the CP.
    explanation: Shows a different class II allele associating with the late-onset subgroup in the same cohort.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: HLA-DQA1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  features: In a European AChR-positive, nonthymomatous case-control study, DQA1*05:01 was associated with lower odds of late-onset disease but higher odds in the previously studied early-onset cohort. Conditional analyses favored DQA1 among class II candidates, without proving that it is the unique causal gene. The 532 late-onset cases and their 449-person onset-at-least-60 subset are one cohort, not independent replication.
  evidence:
  - reference: PMID:26562150
    reference_title: 'Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Moreover, the strongest associations were in opposite directions from EOMG, including an OR of 0.54 for DQA1*05:01 in LOMG (P = 5.9 × 10-12) versus 2.82 in EOMG (P = 3.86 × 10-45).
    explanation: 'States the onset-direction reversal directly, with both effect sizes: DQA1*05:01 is protective in late-onset and predisposing in early-onset disease.'
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26562150
    reference_title: 'Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Association and conditioning studies for the MHC region showed three distinct and largely independent association peaks for LOMG corresponding to (a) MHC class II (highest attenuation when conditioning on DQA1), (b) HLA-A and (c) MHC class III SNPs.
    explanation: Three conditional association peaks were observed. Attenuation with DQA1 conditioning does not uniquely identify the causal allele or mechanism.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:26562150
    reference_title: 'Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT

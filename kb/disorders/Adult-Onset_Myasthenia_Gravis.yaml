- name: Human iPSC-Derived Neuromuscular Coculture with MG Sera
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Adult-fibroblast-derived iPSCs differentiated into MYOD-induced myotubes and NGN2-induced neurons
  description: Neuronal AMPA stimulation and myotube calcium imaging assessed functional transmission after serum exposure. MG sera inhibited the response after heat inactivation, supporting a complement-independent component. The six cloned antibodies and their tested combinations did not reproduce direct blockade. The assay tests serum effects in an engineered junction, not spontaneous adult-onset autoimmunity or the precise blocking epitope.
  publication: PMID:36074148
  modeled_mechanisms:
  - target: AChR Functional Blockade
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Patient sera reduced the stimulation-evoked myotube response independently of active complement.
    limitations: Calcium activity is an integrated functional readout; individual serum constituents and blocking epitopes remain unresolved.

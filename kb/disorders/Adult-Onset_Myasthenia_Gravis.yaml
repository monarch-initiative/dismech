    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The purpose of this trial is to determine if thymectomy combined with prednisone therapy is more beneficial in treating non-thymomatous myasthenia gravis than prednisone therapy alone.

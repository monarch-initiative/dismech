      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: myasthenic crisis, an acute respiratory paralysis that requires intensive care
      explanation: Respiratory complication requiring intensive care.
- name: Ocular Symptom Support
  description: Occlusion can relieve diplopia; selected stable small-angle deviations may benefit from prisms. Ptosis aids and, in persistent stable refractory cases, specialist surgical assessment can complement medical treatment.
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:33458590
    reference_title: 'Myasthenia gravis: MuSK MG, late-onset MG and ocular MG.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Eye patches for diplopia, prisms when eye movement limitation is mild and eyelid crutches for ptosis can be useful.
    explanation: Symptomatic ocular support.
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Ptosis
    treatment_effect: MODULATES
    description: Compensates for the visual consequences without correcting autoimmunity.

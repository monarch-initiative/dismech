- name: Ectopic Thymic Germinal Center Formation
  description: Ectopic thymic follicles provide a niche for B-cell clonal expansion and maturation, particularly in AChR-positive early-onset disease. A 2025 single-cell study analyzed 11 immunotherapy-naive thymi after one of 12 recruited samples failed quality control; inferred trajectories are not lineage tracing.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:40117520
    reference_title: Single-Cell Transcriptomics Identifies a Prominent Role for the MIF-CD74 Axis in Myasthenia Gravis Thymus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Clonally expanded sequences were most enriched in the GC and cycling B-cell subsets
    explanation: Primary BCR sequencing supports local clonal expansion, not antigen specificity of every expanded clone.
  - reference: PMID:38886398
    reference_title: Comparison of juvenile and adult myasthenia gravis in a French cohort with focus on thymic histology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Compared to other studies, the notably high incidence of thymectomy in MG patients from our database can be attributed to the fact that our cohort was mainly collected from a specialized cardio-thoracic surgical center.
    explanation: The French histology cohort is surgically selected, so its germinal-center frequencies are not population frequencies.
  biological_processes:

experimental_models:
- name: AChR-Transfected HEK Antibody-Combination Assays
  experimental_model_type: CELL_LINE
  cell_source: Transfected HEK cells with recombinant AChR and patient-derived monoclonal antibodies
  description: Complement deposition and live-cell receptor clustering were measured after exposure to individual antibodies or equal-total-concentration combinations. Epitope combinations showed synergy in the tested panel. The proposed two-dimensional receptor-antibody lattice is a hypothesis; imaging of surface clustering does not itself quantify internalization or prove a universal requirement for multiple epitopes in patients.
  publication: PMID:36074148
  modeled_mechanisms:
  - target: Complement Activation at the Endplate
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Selected antibody combinations increased C3 deposition on receptor-expressing cells.
    limitations: Transfected cells lack a mature neuromuscular endplate and endogenous autoimmunity.
    evidence:
    - reference: PMID:36074148
      reference_title: Receptor clustering and pathogenic complement activation in myasthenia gravis depend on synergy between antibodies with multiple subunit specificities.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The combination of dG101 and eG101, each at half the concentration (i.e., same final concentration as the previously tested single antibodies), and each with negligible ability to activate complement alone, induced strong complement activation
      explanation: Direct complement assay.
    readouts:
    - name: Cell-associated C3 fluorescence
      target: Complement Activation at the Endplate
      direction: INCREASED
      interpretation: Selected antibody combinations increased C3 deposition on receptor-expressing cells.

- name: Rituximab
  description: 'CD20-directed B-cell depletion is particularly supported for MuSK-positive MG. AChR-positive trial results depend on population and endpoint: BeatMG missed its primary steroid-sparing endpoint, whereas RINOMAX supported benefit in new-onset disease. Infusion, infection, and immunoglobulin risks require specialist monitoring; no efficacy ranking against other targeted drugs is inferred.'
  action_category: THERAPEUTIC
  evidence:
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Rituximab is a monoclonal chimeric Ab that specifically binds to the marker CD20 on the membrane of pre-B and mature B lymphocytes and causes transient B-cell depletion
    explanation: Mechanism summarized in the guideline.
  - reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The recently completed randomized-controlled phase III RINOMAX trial demonstrated that patients with new-onset AChR-Ab-positive gMG on a low-dose rituximab regimen (one infusion of 500 mg) were significantly more likely to meet the primary end point of minimal disease manifestation at 16 weeks than placebo-treated patients.
    explanation: New-onset trial context; not all refractory MG populations.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: AChR Autoantibody Production
    treatment_effect: MODULATES
    description: B-cell depletion can reduce replenishment of antibody-producing cells; long-lived plasma cells are not uniformly depleted.

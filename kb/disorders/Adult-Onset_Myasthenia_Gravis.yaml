    explanation: Locates the strongest early-onset genome-wide signal in the HLA class I region.
  - reference: PMID:23055271
    reference_title: "Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By imputation and conditional analyses, HLA-B*08 proves to be the major associated allele (p = 2.87 × 10(-113) ; OR, 6.41)."
    explanation: Resolves the signal to HLA-B*08 specifically and gives the effect size quoted in the description.
- name: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  features: >-
    Class II susceptibility that differs by onset age: HLA-DRB1*03 is over-represented in myasthenia
    gravis overall and more strongly still in the early-onset subgroup, while a different allele is
    enriched in late-onset patients.
  evidence:
  - reference: PMID:28495048
    reference_title: "HLA and age of onset in myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA-DRB1*03 allele was overrepresented in the global MG. When the early-onset subgroup was considered, this association became even stronger."
    explanation: Shows the class II risk allele concentrating in the early-onset subgroup.
  - reference: PMID:28495048
    reference_title: "HLA and age of onset in myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding the late-onset subgroup, the frequency of HLA-DRB1*01 allele was higher than in the CP."
    explanation: Shows a different class II allele associating with the late-onset subgroup in the same cohort.
- name: HLA-DQA1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  features: >-
    The class II allele that carries this entry's central immunogenetic claim: the direction of
    HLA association reverses across the age-at-onset axis. DQA1*05:01 is a risk allele in
    early-onset disease (OR 2.82) and a protective allele in late-onset disease (OR 0.54) in the
    same comparison. Conditional analysis identifies DQA1 as the class II peak in late-onset
    disease, so the reversal sits at the locus that dominates the class II signal rather than at
    a bystander allele. This is the genetic evidence that the two onset groups are not one
    disease sampled at different ages.
  evidence:
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the strongest associations were in opposite directions from EOMG, including an OR of 0.54 for DQA1*05:01 in LOMG (P = 5.9 × 10-12) versus 2.82 in EOMG (P = 3.86 × 10-45)."
    explanation: >-
      States the onset-direction reversal directly, with both effect sizes: DQA1*05:01 is
      protective in late-onset and predisposing in early-onset disease.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Association and conditioning studies for the MHC region showed three distinct and largely independent association peaks for LOMG corresponding to (a) MHC class II (highest attenuation when conditioning on DQA1), (b) HLA-A and (c) MHC class III SNPs."
    explanation: >-
      Establishes by conditional analysis that DQA1 accounts for the class II peak in late-onset
      disease, so the reversed allele is the locus driving the class II signal.
- name: TNIP1
  subtype: EOMG
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: TNIP1
    term:
      id: hgnc:16903
      label: TNIP1
  features: >-
    A coding variant at position 151 in TNIP1 confers early-onset risk exceeding that of PTPN22,
    implicating ubiquitin-dependent NF-kB regulation. The signal is specific to early onset — it is
    absent in late-onset cohorts.
  evidence:
  - reference: PMID:23055271
    reference_title: "Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association at TNIP1 in EOMG implies disease mechanisms involving ubiquitin-dependent dysregulation of NF-κB signaling."
    explanation: Establishes the TNIP1 association and its mechanistic reading in early-onset disease.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, EOMG-associated SNPs in TNIP1 showed no association in LOMG, nor did other loci suggested for EOMG."
    explanation: Establishes that the TNIP1 signal is early-onset-specific and does not extend to late onset.
- name: PTPN22
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: PTPN22
    term:
      id: hgnc:9652
      label: PTPN22
  features: >-
    The R620W autoimmunity variant contributes risk in early-onset disease and shows only suggestive

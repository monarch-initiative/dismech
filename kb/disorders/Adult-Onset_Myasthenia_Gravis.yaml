    consistency:
    - reference: ORPHA:391490
      consistent: CONSISTENT
      notes: "MONDO:0018324 | Exact"
  - term:
      id: MONDO:0009688
      label: myasthenia gravis
    mapping_predicate: skos:broadMatch
    mapping_source: ORPHA:391490
    mapping_justification: >-
      Orphanet classes ORPHA:391490 as a clinical subtype of a disorder, and MONDO asserts
      MONDO:0018324 is_a MONDO:0009688; the general myasthenia gravis concept is therefore broader
      than this entry. Curated as `skos:broadMatch` so it is not mistaken for a mapping that would
      retire MONDO:0009688 from the curation queue — that concept is curated separately in
      `Myasthenia_Gravis.yaml`.
  icd10cm_mappings:

- name: Inebilizumab
  description: CD19-directed cytolytic therapy is labeled for adults with AChR- or MuSK-antibody-positive generalized MG. MINT demonstrated overall MG-ADL benefit at week 26. The label describes the therapeutic mechanism as presumed; CD20 counts were used to assess B-cell depletion because the drug interferes with CD19 assays. Screen for HBV, tuberculosis and immunoglobulin deficiency, address vaccination and active infection, and monitor infusion reactions and immunoglobulins.
  action_category: THERAPEUTIC

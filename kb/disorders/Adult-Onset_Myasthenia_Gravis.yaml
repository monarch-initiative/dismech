- name: Thymoma-Associated Loss of Immune Tolerance
  description: In thymoma-associated disease, abnormal T-cell selection and export of autoreactive T cells can support AChR autoimmunity. Tumor histology and immune changes vary; no single molecular lesion is asserted for every thymoma.

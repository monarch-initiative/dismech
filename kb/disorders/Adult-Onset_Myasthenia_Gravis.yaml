      Orphanet records ICD-10 G70.0 as a *narrower* cross-reference direction for ORPHA:391490 —
      i.e. the ORPHA subtype is narrower than the ICD code — so from this entry's perspective the
      ICD code is the broader concept.
    consistency:
    - reference: ORPHA:391490
      consistent: CONSISTENT
      notes: "ICD-10:G70.0 | Narrower"
definitions:
- name: Orphanet disease definition
  definition_type: CASE_DEFINITION
  description: >
    Orphanet defines adult-onset myasthenia gravis as a rare autoimmune disorder of the
    neuromuscular junction with fatigable muscle weakness, frequent ocular signs and/or generalized
    weakness, and occasional thymoma association.
  evidence:
  - reference: ORPHA:391490
    reference_title: "Adult-onset myasthenia gravis (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare autoimmune disorder of the neuromuscular junction characterized by fatigable muscle weakness with frequent ocular signs and/or generalized muscle weakness, and occasionally associated with thymoma."
    explanation: Orphanet's definition for the adult-onset subtype anchors the scope of this entry.

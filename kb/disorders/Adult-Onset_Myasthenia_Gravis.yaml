    explanation: Defines the primary study population.
- name: TNIP1
  subtype: EOMG
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: TNIP1
    term:
      id: hgnc:16903
      label: TNIP1
  features: The p.Pro151Ala variant was associated with early-onset MG in 2012, but its functional effect was not measured. Ubiquitin/NF-kB signaling was a proposed interpretation rather than an established variant mechanism. Failure to detect a signal in the modest 2015 late-onset cohort does not establish universal early-onset specificity; the 2024 meta-analysis also implicated this region in overall MG, while its early-onset replication was unsuccessful.
  evidence:
  - reference: PMID:23055271
    reference_title: Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: These data thus implicate the TNIP1 151Ala replacement itself in EOMG pathogenesis, although without direct functional data, this remains a hypothesis to be proven.
    explanation: The authors explicitly distinguish association from untested function.
  - reference: PMID:26562150
    reference_title: 'Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, EOMG-associated SNPs in TNIP1 showed no association in LOMG, nor did other loci suggested for EOMG.
    explanation: Absence of a detected association in this cohort is not evidence of absence in every late-onset population.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

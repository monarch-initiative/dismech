- name: Intravenous Immunoglobulin
  description: Rapid immunomodulation is used for exacerbation or crisis and selected bridging situations. Selection versus plasma exchange depends on comorbidity, access, and clinical circumstances. Maintenance use is individualized and has a different evidence base from crisis treatment.
  action_category: THERAPEUTIC
  evidence:
  - &id001
    reference: PMID:38152089
    reference_title: Guideline for the management of myasthenic syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In the event of an impending and manifest myasthenic crisis, rapid admission and treatment must be provided in a monitoring or intensive care unit with experience in neuromuscular disease. IVIG or PE/IA must be used in this situation.
    explanation: Urgent rescue guideline recommendation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy

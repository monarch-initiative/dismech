- name: Crisis Monitoring and Respiratory Support
  description: Urgent specialist monitored or intensive care includes serial respiratory and bulbar assessment, airway protection or ventilation when necessary, treatment of precipitants, and concurrent rapid immunotherapy.
  action_category: THERAPEUTIC
  evidence:
  - *id001
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Mechanical Ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Myasthenic Crisis
    treatment_effect: BYPASSES
    description: Ventilation supports gas exchange during severe respiratory weakness.

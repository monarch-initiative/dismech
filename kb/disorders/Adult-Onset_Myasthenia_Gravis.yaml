has_subtypes:
- name: EOMG
  display_name: Early-Onset MG (onset before ~50 years)
  description: >
    Adult-onset disease beginning before approximately 50 years of age. Female-predominant, strongly
    associated with thymic follicular hyperplasia containing ectopic germinal centres, and carrying
    the strongest HLA signal in myasthenia gravis (HLA-B*08 / DRB1*03).
  subtype_term:
    preferred_term: early-onset myasthenia gravis
  evidence:
  - reference: PMID:40675735
    reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EOMG often presents with distinct immunological and genetic profiles, a predominance of female patients, and a higher incidence of thymic hyperplasia."
    explanation: Defines the early-onset subgroup by its immunogenetic profile, sex skew, and thymic pathology.
- name: LOMG
  display_name: Late-Onset MG (onset at or after ~50 years)
  description: >
    Adult-onset disease beginning at or after approximately 50 years of age. Male-predominant,
    typically arising against an atrophic (age-involuted) thymus, frequently anti-AChR and anti-titin
    positive, and with a genetically distinct susceptibility architecture from EOMG.
  subtype_term:
    preferred_term: late-onset myasthenia gravis
  evidence:
  - reference: PMID:33458590
    reference_title: "Myasthenia gravis: MuSK MG, late-onset MG and ocular MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOMG with onset ≥ 50 years of age is more common in men and ocular onset is common. Frequency of anti-AChR and anti-titin antibodies are high."
    explanation: Gives the conventional ≥50-year onset boundary together with the male skew and antibody profile that define the subgroup.
  - reference: PMID:40675735
    reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, LOMG and VLOMG are characterized by thymic atrophy, differing genetic associations, and milder long-term disease courses with variable treatment responses."
    explanation: Contrasts late-onset thymic and genetic biology with the early-onset subgroup.
- name: VLOMG
  display_name: Very Late-Onset MG (onset after ~65 years)
  description: >
    A further tier within late-onset disease, conventionally onset after about 65 years. Incidence in
    this age band has risen continuously, with a clear male predominance. Presentation is typically
    focal (ocular or bulbar), and diagnosis is described as requiring a high index of suspicion.
  subtype_term:
    preferred_term: very late-onset myasthenia gravis
  evidence:
  - reference: PMID:23893883
    reference_title: "Late-onset myasthenia gravis: a review when incidence in older adults keeps increasing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We define late-onset myasthenia gravis (LOMG) when symptoms appear at ≥65 years of age. There has been a continuous increase in the incidence of LOMG with a clear male predominance."
    explanation: >-
      Documents the ≥65-year boundary used for the very-late-onset tier — and, by differing from the
      ≥50-year boundary used elsewhere, shows that the cut-point itself is a convention rather than a
      measured discontinuity.
  - reference: PMID:23893883
    reference_title: "Late-onset myasthenia gravis: a review when incidence in older adults keeps increasing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commonly, patients present with focal (ocular or bulbar) weakness. A high index of suspicion required to achieve early diagnosis and to improve prognosis."
    explanation: Supports focal presentation and diagnostic delay as characteristic of the oldest-onset group.
prevalence:
- population: Worldwide (all myasthenia gravis; context for the adult-onset majority)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.0
  notes: >-
    Approximately 20 per million person-years, converted to 2.0 per 100,000. Reported for myasthenia
    gravis overall rather than for adult-onset disease specifically; adult onset accounts for the
    large majority of cases.
  evidence:
  - reference: PMID:40675734
    reference_title: "Epidemiology of myasthenia gravis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent high-quality studies have found an annual MG incidence of approximately 20 per million person-years, and a prevalence of approximately 25 per 100,000 population."
    explanation: >-
      Gives the contemporary incidence figure. Marked PARTIAL because the quoted rate is for
      myasthenia gravis as a whole, not for the adult-onset subtype in isolation.
- subtype: LOMG
  population: Denmark, 1970-1999 (population-based, anti-AChR seropositive)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 0.47
  rate_high: 2.08
  notes: >-
    Late-onset annual incidence rose from 4.7 to 20.8 per million (0.47 to 2.08 per 100,000) over
    three decades while early-onset incidence stayed flat at 3.5 per million. The range crosses a
    band boundary — it starts in the 1-9 per 1,000,000 band and ends in the 1-9 per 100,000 band;
    `prevalence_class` records the band it ended in, and that crossing is itself the finding.
  evidence:
  - reference: PMID:16186537
    reference_title: "Increasing incidence of late-onset anti-AChR antibody-seropositive myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean annual incidence rate of early-onset MG was constant at 3.5 x 10(-6). In late-onset MG, the rate increased from 4.7 to 20.8 x 10(-6). The two onset types of MG may thus be distinct disorders."
    explanation: >-
      Directly quantifies the divergent incidence trajectories of the two onset subgroups, which is
      the epidemiological argument that they are not merely two ends of one homogeneous population.
- subtype: LOMG
  population: Global (secular trend)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: Qualitative secular trend rather than a rate; recorded for the direction of change only.
  evidence:
  - reference: PMID:40675734
    reference_title: "Epidemiology of myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MuSK MG is more common in the Mediterranean area, juvenile MG is most common in China, whereas late onset MG with AChR antibodies is a subtype that has increased in incidence and prevalence globally."
    explanation: Confirms that the late-onset AChR-antibody subgroup is the one driving the global rise.
  - reference: PMID:40675734
    reference_title: "Epidemiology of myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MG prevalence has increased in recent years because of more elderly people in the general population, improved case finding, and improved MG treatment with reduced mortality."
    explanation: >-
      Attributes the rise partly to population ageing and partly to ascertainment and survival —
      an important caveat against reading the trend as purely biological.
progression:
- phase: Onset
  age_range: After puberty (adult onset)
  notes: >-
    Onset after puberty is the defining feature of this entry. The boundary is not arbitrary: thymic
    follicular hyperplasia, the central early-onset lesion, is markedly more prominent in females
    after puberty than before it.
  evidence:
  - reference: PMID:38886398
    reference_title: "Comparison of juvenile and adult myasthenia gravis in a French cohort with focus on thymic histology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings reveal distinct patterns in JMG patients, particularly regarding thymic follicular hyperplasia, which appears to be exacerbated in females after puberty."
    explanation: >-
      Provides a thymic-histological rationale for the pubertal boundary between juvenile and
      adult-onset myasthenia gravis rather than treating it as a purely administrative cut-point.
pathophysiology:
- name: Age-at-Onset Stratification of Myasthenia Gravis
  notes: >-
    Age at onset partitions myasthenia gravis into subgroups that differ in immunological profile,
    autoantibody spectrum, thymic pathology, genetic association, and treatment response. This node
    is the organising claim of the entry: onset age is not a descriptive label attached after the
    fact but an axis along which the upstream immunopathology itself differs.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:40675735
    reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at disease onset significantly influences the clinical course, pathophysiology, and treatment response in Myasthenia Gravis (MG)."
    explanation: States the central claim of this entry directly.
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subgroups based on serum antibodies and clinical features include early-onset, late-onset, thymoma, MUSK, LRP4, antibody-negative, and ocular forms of myasthenia gravis."
    explanation: >-
      Establishes that onset age sits alongside serotype as a first-class subgrouping axis in the
      standard classification — the justification for curating it separately from the
      serotype-stratified parent entry.
  downstream:
  - target: Thymic Follicular Hyperplasia and Ectopic Germinal Centre Formation
    causal_link_type: DIRECT
    description: Early onset is the branch in which the thymus itself becomes the autoimmunizing organ.
    hypothesis_groups:
    - thymic_autoimmunization_eomg
    evidence:
    - reference: PMID:40675735
      reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "EOMG often presents with distinct immunological and genetic profiles, a predominance of female patients, and a higher incidence of thymic hyperplasia."
      explanation: Assigns the thymic-hyperplasia branch specifically to the early-onset subgroup.
  - target: Late-Onset Autoimmunity Against an Involuted Thymus
    causal_link_type: DIRECT
    description: Late onset is the branch in which disease arises without a hyperplastic thymic germinal-centre reaction.
    hypothesis_groups:
    - extrathymic_lomg
    evidence:
    - reference: PMID:40675735
      reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, LOMG and VLOMG are characterized by thymic atrophy, differing genetic associations, and milder long-term disease courses with variable treatment responses."
      explanation: Assigns the atrophic-thymus branch specifically to the late- and very-late-onset subgroups.
  - target: Onset-Age-Stratified Immunogenetic Susceptibility
    causal_link_type: DIRECT
    description: Both branches carry their own, largely non-overlapping susceptibility architecture.
    evidence:
    - reference: PMID:28495048
      reference_title: "HLA and age of onset in myasthenia gravis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study confirms a different genetic background of MG subgroups regarding age of onset."
      explanation: Supports the edge from onset-age stratification to a differing genetic background.
- name: Thymic Follicular Hyperplasia and Ectopic Germinal Centre Formation
  description: >
    In early-onset disease the hyperplastic thymus acquires the full architecture of a tertiary
    lymphoid organ: high endothelial venules and lymphatic neoangiogenesis, chemokine-driven
    recruitment of peripheral B cells and T follicular helper cells, and ectopic germinal centres.
    Because thymic epithelial and myoid cells express the acetylcholine receptor, the autoantigen is
    presented in situ to the recruited cells, so the thymus can both initiate and sustain the
    anti-AChR response rather than merely accompany it.
  biological_scale: TISSUE
  subtypes:
  - EOMG
  cell_types:
  - preferred_term: Thymic Epithelial Cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  - preferred_term: Germinal Centre B Cell
    term:
      id: CL:0000844
      label: germinal center B cell
  - preferred_term: T Follicular Helper Cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  biological_processes:
  - preferred_term: Ectopic Germinal Centre Formation
    term:
      id: GO:0002467
      label: germinal center formation
    modifier: INCREASED
  - preferred_term: Positive Regulation of Immunoglobulin Production
    term:
      id: GO:0002639
      label: positive regulation of immunoglobulin production
    modifier: INCREASED
  evidence:
  - reference: PMID:29125185
    reference_title: "Thymus involvement in early-onset myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hyperplastic MG thymus displays all the characteristics of tertiary lymphoid organs (TLOs): neoangiogenic processes with high endothelial venule and lymphatic vessel development, chemokine overexpression favoring peripheral cell recruitment, and ectopic germinal center development."
    explanation: Establishes the tertiary-lymphoid-organ conversion of the thymus specifically in early-onset disease.
  - reference: PMID:29125185
    reference_title: "Thymus involvement in early-onset myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As thymic epithelial cells or myoid cells express AChR, a specific antigen presentation can easily occur within the thymus in the presence of recruited peripheral cells, such as B cells and T follicular helper cells."
    explanation: Supplies the mechanism by which the autoantigen is presented inside the thymus to recruited effector cells.
  - reference: PMID:27273086
    reference_title: "Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of anti-AChR antibodies is correlated with the degree of follicular hyperplasia, suggesting that the thymus is a source of anti-AChR antibodies."
    explanation: >-
      Correlates germinal-centre burden with antibody level across 1035 patients, supporting the
      thymus as a source rather than a bystander.
  - reference: PMID:27273086
    reference_title: "Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that among patients presenting a thymic hyperplasia with germinal centers (GC), 80 % are females, indicating that thymic follicular hyperplasia is mainly a disease of women."
    explanation: Ties the germinal-centre lesion to the female predominance that characterizes the early-onset subgroup.
  downstream:
  - target: Autoantibody-Mediated Neuromuscular Junction Failure
    causal_link_type: DIRECT
    description: Intrathymic germinal centres supply the anti-AChR antibody that damages the endplate.
    hypothesis_groups:
    - thymic_autoimmunization_eomg
    evidence:
    - reference: PMID:27273086
      reference_title: "Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of anti-AChR antibodies is correlated with the degree of follicular hyperplasia, suggesting that the thymus is a source of anti-AChR antibodies."
      explanation: Supports the causal direction from thymic germinal-centre reaction to circulating anti-AChR antibody.
- name: Late-Onset Autoimmunity Against an Involuted Thymus
  description: >
    Late- and very-late-onset disease arises when the thymus is atrophic rather than hyperplastic, so
    the germinal-centre mechanism that explains early-onset disease is largely unavailable. The
    late-onset subgroup is instead characterized by high anti-AChR seropositivity, frequent
    striational (anti-titin, anti-ryanodine-receptor) antibodies, male predominance, and a high
    burden of age-related comorbidity that constrains treatment. The initiating event in a thymus
    that no longer supports germinal centres is not established.
  biological_scale: ORGANISM
  subtypes:
  - LOMG
  - VLOMG
  cell_types:
  - preferred_term: Thymic Epithelial Cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  biological_processes:
  - preferred_term: Age-Related Thymic Involution
    description: >-
      Physiological age-related atrophy of the thymus, in which functional thymic tissue is
      progressively replaced by adipose tissue. Deliberately left unbound: GO has no thymic
      involution term, and involution is not reduced thymus development, so the nearest
      candidate (GO:0048538 thymus development, DECREASED) would misstate the biology.
      Needs an NTR to GO.
  evidence:
  - reference: PMID:40675735
    reference_title: "Special populations in myasthenia gravis: Early, late, and very late-onset MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, LOMG and VLOMG are characterized by thymic atrophy, differing genetic associations, and milder long-term disease courses with variable treatment responses."
    explanation: Establishes thymic atrophy, rather than hyperplasia, as the thymic state in late-onset disease.
  - reference: PMID:22476514
    reference_title: "Characteristics of late-onset myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-AChR antibody titers were elevated in 78 % of patients (65 % with EOMG vs. 85 % with LOMG; p = 0.003)"
    explanation: Quantifies the higher anti-AChR seropositivity of the late-onset subgroup within one cohort.
  - reference: PMID:22476514
    reference_title: "Characteristics of late-onset myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular MG was more common in LOMG compared to EOMG (40 vs. 18 %, p = 0.021). Diabetes was more prevalent with LOMG (27 vs. 5 %; p = 0.0002)."
    explanation: Quantifies both the more ocular-restricted phenotype and the excess diabetes burden in late-onset disease.
  - reference: PMID:22476514
    reference_title: "Characteristics of late-onset myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A higher burden of comorbidities, such as diabetes mellitus, may warrant a modified approach to treatment of myasthenia in LOMG."
    explanation: Supports the claim in the description that comorbidity burden constrains late-onset treatment choice.
  - reference: PMID:31811563
    reference_title: "Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 95 patients with generalized non-thymomatous LOMG, 60 (63%) were men, 45 (47%) had mild disease, 80 (84%) were anti-AChR, and 56 (61%) were anti-titin positive."
    explanation: Gives the male predominance and the combined anti-AChR / anti-titin serological profile of generalized late-onset disease.
  downstream:
  - target: Striational Autoantibody Response
    causal_link_type: DIRECT
    description: The late-onset immune response characteristically broadens beyond AChR to intracellular muscle antigens.
    hypothesis_groups:
    - extrathymic_lomg
    evidence:
    - reference: PMID:31811563
      reference_title: "Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 95 patients with generalized non-thymomatous LOMG, 60 (63%) were men, 45 (47%) had mild disease, 80 (84%) were anti-AChR, and 56 (61%) were anti-titin positive."
      explanation: Documents the co-occurrence of the striational anti-titin response with late-onset disease at 61%.
  - target: Autoantibody-Mediated Neuromuscular Junction Failure
    causal_link_type: DIRECT
    description: Late-onset disease converges on the same postsynaptic effector lesion by a different upstream route.
    evidence:
    - reference: PMID:22476514
      reference_title: "Characteristics of late-onset myasthenia gravis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Anti-AChR antibody titers were elevated in 78 % of patients (65 % with EOMG vs. 85 % with LOMG; p = 0.003)"
      explanation: >-
        Confirms that late-onset patients reach the same anti-AChR effector mechanism, at an even
        higher seropositivity rate than early onset.
- name: Striational Autoantibody Response
  description: >
    The late-onset immune response characteristically broadens beyond the acetylcholine receptor to
    intracellular striational antigens. Anti-titin is the onset-discriminating member of the panel:
    it tracks older onset age and, in late-onset patients, generalized disease, while in
    younger-onset patients it instead flags thymoma. Anti-ryanodine-receptor antibody travels with
    the panel but is *not* itself onset-discriminating — it has been detected in early-onset
    patients and controls as well. All of these target intracellular proteins that circulating IgG
    cannot reach in intact muscle, so they are best read as markers of a broadened autoimmune
    response rather than as established effectors of weakness.
  biological_scale: MOLECULAR
  subtypes:
  - LOMG
  - VLOMG
  evidence:
  - reference: PMID:38505076
    reference_title: "Anti-titin antibodies in a cohort of myasthenia gravis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-titin positivity was significantly associated with generalized MG in the late-onset group (P=0.005)."
    explanation: Links anti-titin seropositivity specifically to generalized disease within the late-onset subgroup.
  - reference: PMID:38505076
    reference_title: "Anti-titin antibodies in a cohort of myasthenia gravis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-titin positivity correlated with thymoma in patients with age of onset bellow 50 years (P=0.028)."
    explanation: >-
      Shows the *same* antibody carries a different meaning either side of the 50-year onset
      boundary — thymoma marker in early onset, generalization marker in late onset — which is a
      concrete demonstration that onset age changes interpretation, not just description.
  - reference: PMID:33458590
    reference_title: "Myasthenia gravis: MuSK MG, late-onset MG and ocular MG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOMG with onset ≥ 50 years of age is more common in men and ocular onset is common. Frequency of anti-AChR and anti-titin antibodies are high."
    explanation: Independent review confirming high anti-titin frequency in the late-onset subgroup.
  - reference: PMID:31811563
    reference_title: "Late-onset generalized myasthenia gravis: clinical features, treatment, and outcome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of anti-titin antibodies had no significant effect on severity and outcome."
    explanation: >-
      Counterweight to over-reading the striational antibodies: in generalized non-thymomatous
      late-onset disease they did not predict severity or outcome, supporting the marker-not-effector
      framing in the description.
- name: Onset-Age-Stratified Immunogenetic Susceptibility
  description: >
    Early- and late-onset disease have largely non-overlapping genetic architectures. Early onset
    carries an exceptionally strong HLA class I signal that maps to HLA-B*08, plus non-HLA risk at
    TNIP1 and PTPN22. Late onset carries weaker MHC effects — with the strongest associations
    running in the *opposite* direction to early onset — plus its own loci (TNFRSF11A, ZBTB10), while
    the early-onset TNIP1 signal is absent altogether.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:23055271
    reference_title: "Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By imputation and conditional analyses, HLA-B*08 proves to be the major associated allele"
    explanation: Localizes the dominant early-onset MHC signal to a class I allele.
  - reference: PMID:23055271
    reference_title: "Risk for myasthenia gravis maps to a (151) Pro→Ala change in TNIP1 and to human leukocyte antigen-B*08."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association at TNIP1 in EOMG implies disease mechanisms involving ubiquitin-dependent dysregulation of NF-κB signaling. The localization of the major HLA signal to the HLA-B*08 allele suggests that CD8(+) T cells may play a key role in disease initiation or pathogenesis."
    explanation: Gives the mechanistic reading of the early-onset-specific loci.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, EOMG-associated SNPs in TNIP1 showed no association in LOMG, nor did other loci suggested for EOMG."
    explanation: Demonstrates that the early-onset non-HLA architecture does not transfer to late onset.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many SNPs within the major histocompatibility complex (MHC) region showed strong associations in LOMG, but with smaller effect sizes than in EOMG (highest OR ~2 versus ~6 in EOMG). Moreover, the strongest associations were in opposite directions from EOMG"
    explanation: >-
      The directional reversal of MHC association is the strongest single piece of evidence that the
      two onset subgroups are not one susceptibility population sampled at different ages.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, these findings emphasize the value of subgrouping myasthenia gravis patients for clinical and basic investigations and imply distinct predisposing mechanisms in LOMG."
    explanation: The authors' own conclusion that onset-age subgrouping reflects distinct predisposing mechanisms.
  - reference: PMID:28495048
    reference_title: "HLA and age of onset in myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms a different genetic background of MG subgroups regarding age of onset."
    explanation: Independent replication of an onset-age-dependent HLA background in a separate population.
- name: Autoantibody-Mediated Neuromuscular Junction Failure
  description: >
    The shared effector lesion of all myasthenia gravis: autoantibody binding at the postsynaptic
    membrane with complement activation and loss of functional acetylcholine receptor, producing
    fatigable weakness. Included here only as the convergence point of the two onset branches; the
    full effector mechanism is curated in `Myasthenia_Gravis.yaml` and is not re-derived.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Skeletal Muscle Cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: Neuromuscular Synaptic Transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  - preferred_term: Complement Activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  evidence:
  - reference: PMID:26376969
    reference_title: "Myasthenia gravis: subgroup classification and therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myasthenia gravis is an autoimmune disease that is characterised by muscle weakness and fatigue, is B-cell mediated, and is associated with antibodies directed against the acetylcholine receptor, muscle-specific kinase (MUSK), lipoprotein-related protein 4 (LRP4), or agrin in the postsynaptic membrane at the neuromuscular junction."
    explanation: States the shared postsynaptic autoantibody mechanism that both onset branches converge on.
mechanistic_hypotheses:
- hypothesis_group_id: thymic_autoimmunization_eomg
  hypothesis_label: Intrathymic autoimmunization drives early-onset disease
  status: CANONICAL
  description: >
    In early-onset disease the hyperplastic thymus is the site of autoimmunization: it converts to a
    tertiary lymphoid organ, presents acetylcholine receptor locally, and generates the anti-AChR
    response. This model predicts — and is supported by — the benefit of thymectomy in the
    early-onset, non-thymomatous, AChR-positive population.
  applies_to_subtypes:
  - EOMG
  evidence:
  - reference: PMID:27273086
    reference_title: "Thymic Germinal Centers and Corticosteroids in Myasthenia Gravis: an Immunopathological Study in 1035 Cases and a Critical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, based on the pathological and molecular thymic abnormalities found in MG patients, this review provides some explanations for the benefit of thymectomy in early-onset MG patients."
    explanation: Explicitly connects the thymic-autoimmunization model to the therapeutic benefit observed in early-onset patients.
- hypothesis_group_id: extrathymic_lomg
  hypothesis_label: Late-onset disease arises without a thymic germinal-centre reaction
  status: ALTERNATIVE
  description: >
    In late- and very-late-onset disease the thymus is atrophic and the germinal-centre mechanism is
    largely unavailable, so autoimmunization is presumed to occur elsewhere. The genetic architecture
    is distinct from — and in the MHC partly directionally opposite to — early-onset disease, and the
    incidence trajectories of the two subgroups have diverged over decades. What the initiating
    event actually is in the involuted thymus remains unidentified; this is recorded as an open
    knowledge gap rather than asserted.
  applies_to_subtypes:
  - LOMG
  - VLOMG
  evidence:
  - reference: PMID:16186537
    reference_title: "Increasing incidence of late-onset anti-AChR antibody-seropositive myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two onset types of MG may thus be distinct disorders. The author hypothesized that late-onset nonthymoma anti-acetylcholine receptor antibody-seropositive MG may be provoked by environmental factors."
    explanation: The original epidemiological statement of the two-disorder hypothesis, including its environmental-trigger corollary.
  - reference: PMID:26562150
    reference_title: "Genome-Wide Association Study of Late-Onset Myasthenia Gravis: Confirmation of TNFRSF11A and Identification of ZBTB10 and Three Distinct HLA Associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, these findings emphasize the value of subgrouping myasthenia gravis patients for clinical and basic investigations and imply distinct predisposing mechanisms in LOMG."
    explanation: Genetic support for distinct predisposing mechanisms in the late-onset subgroup.
discussions:
- discussion_id: onset_dichotomy_vs_continuum
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are early-onset and late-onset myasthenia gravis mechanistically distinct disorders, or one
    continuous disease whose features shift with age at onset?
  attaches_to:
  - pathophysiology#Age-at-Onset Stratification of Myasthenia Gravis
  rationale: >
    The genetic and epidemiological evidence points to separation: the MHC associations differ in
    magnitude and in direction between the subgroups, the early-onset TNIP1 signal is absent in late
    onset, and late-onset incidence has risen four-fold in a population where early-onset incidence
    did not move at all. The clinical evidence points the other way: cohort comparisons find
    extensively overlapping features and read the difference as a shift in proportions along one
    spectrum rather than a boundary. Note also that the conventional cut-point is itself unstable in
    the literature — 50 years in most genetic and cohort work, 65 years in others — which is hard to
    reconcile with a true biological discontinuity. This entry curates the subgroups because the
    upstream immunopathology and treatment evidence genuinely differ by onset age, without asserting
    that they are separate diseases.
  evidence:
  - reference: PMID:22476514
    reference_title: "Characteristics of late-onset myasthenia gravis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Overlapping clinical features of EOMG and LOMG are consistent with a continuous clinical spectrum of a single condition, with more frequent occurrence of seropositive and ocular MG with a late onset."
    explanation: >-
      Direct argument against a two-disorder reading, from a cohort that compared the subgroups
      clinically. Recorded as REFUTE against the strong separation claim.
  - reference: PMID:16186537
    reference_title: "Increasing incidence of late-onset anti-AChR antibody-seropositive myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two onset types of MG may thus be distinct disorders."
    explanation: The epidemiological argument for separation, stated by the authors themselves.
- discussion_id: lomg_initiating_event
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If the atrophic late-onset thymus cannot support the germinal-centre reaction that explains
    early-onset autoimmunization, where and how is the anti-AChR response initiated in late-onset
    disease?
  attaches_to:
  - pathophysiology#Late-Onset Autoimmunity Against an Involuted Thymus
  rationale: >
    The thymic model of myasthenia gravis is well evidenced for the hyperplastic, early-onset thymus
    and is the mechanistic basis for thymectomy. No comparably specified site or trigger has been
    established for late-onset disease, which is now the subgroup driving the global rise in
    incidence. The gap matters therapeutically: the thymectomy evidence base does not transfer, and
    the leading published hypothesis — an environmental provocation — has not been resolved to a
    specific exposure.
  proposed_experiments:
  - experiment_id: lomg_bcr_compartment_repertoire
    name: Compartment-resolved B-cell receptor repertoire comparison by onset age
    description: >-
      Compare single-cell B-cell receptor repertoires from thymic, lymph-node, and bone-marrow
      compartments between early- and late-onset AChR-antibody-positive patients, to locate the
      compartment in which late-onset anti-AChR clones are generated and maintained.
    would_support:
    - >-
        Recovery of clonally expanded, somatically hypermutated anti-AChR lineages from an
        extrathymic compartment in late-onset patients but not early-onset patients would support an
        extrathymic site of autoimmunization in late-onset disease.
    would_refute:
    - >-
        Recovery of the same intrathymic clonal architecture in both onset groups would refute the
        claim that the germinal-centre mechanism is unavailable in the involuted thymus.
  - experiment_id: lomg_thymic_tolerance_seroconversion
    name: Prospective association of thymic self-antigen presentation with late-onset seroconversion
    description: >-
      Test whether age-related loss of thymic self-antigen presentation is quantitatively associated
      with anti-AChR seroconversion in prospectively sampled older adults.
    would_support:
    - >-
        An inverse association between residual thymic self-antigen presentation and incident
        seroconversion would support failing central tolerance as the late-onset initiating event.
    would_refute:
    - >-
        No association across the observed range would refute a central-tolerance-failure model and
        redirect attention to peripheral or environmental triggers.
  evidence:
  - reference: PMID:16186537
    reference_title: "Increasing incidence of late-onset anti-AChR antibody-seropositive myasthenia gravis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The author hypothesized that late-onset nonthymoma anti-acetylcholine receptor antibody-seropositive MG may be provoked by environmental factors."
    explanation: >-
      The leading published proposal for the late-onset trigger is explicitly framed as a hypothesis,
      which is what makes this an open gap rather than a settled mechanism.

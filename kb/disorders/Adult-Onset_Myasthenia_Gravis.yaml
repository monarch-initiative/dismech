- name: Engineered MuSK Activation in 3T3 Fibroblasts
  experimental_model_type: CELL_LINE
  cell_source: 3T3 fibroblasts expressing an engineered MuSK activation-loop mutant without LRP4
  description: MuSK L746M/S747T enabled phosphorylation in the nonmuscle context. Patient IgG4 did not reduce this LRP4-independent activation or MuSK surface expression. These are engineered assay substitutions, not patient pathogenic variants. The phosphorylation result indirectly constrains a direct dimerization-blocking explanation; it is not a direct measurement of MuSK–MuSK binding.

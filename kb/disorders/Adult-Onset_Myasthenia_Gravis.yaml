name: Adult-Onset Myasthenia Gravis
creation_date: '2026-08-19T09:00:00Z'
description: >-
  Adult-onset myasthenia gravis is acquired autoimmune myasthenia gravis whose symptoms begin after
  puberty. It shares the postsynaptic neuromuscular-junction effector mechanism of myasthenia gravis
  generally — autoantibody binding, complement-mediated damage to the endplate, and fatigable
  weakness — but is defined by an additional axis that the serotype axis does not capture: age at
  onset. Early-onset disease (EOMG, conventionally onset before 50 years) is female-predominant and
  is driven by a hyperplastic thymus that behaves as a tertiary lymphoid organ, with ectopic
  germinal centres, intrathymic acetylcholine-receptor antigen presentation, and a very strong
  HLA-B*08/DRB1*03 class I-anchored susceptibility signal. Late-onset disease (LOMG, onset at or
  after 50 years, with a very-late-onset tier beyond 65 years) is male-predominant, arises against an
  atrophic involuted thymus, carries striational (anti-titin and anti-ryanodine-receptor)
  autoantibodies, and has an HLA architecture that is weaker and in places directionally opposite to
  EOMG. LOMG incidence has risen substantially in ageing populations while EOMG incidence has stayed
  flat, and the thymectomy evidence base is restricted to the adult non-thymomatous population.
category: Autoimmune
synonyms:
- adult-onset acquired myasthenia
- adult-onset autoimmune myasthenia gravis
parents:
- Myasthenia Gravis
- Neuromuscular Disease
- Autoimmune Disease
disease_term:
  preferred_term: adult-onset myasthenia gravis
  term:
    id: MONDO:0018324
    label: adult-onset myasthenia gravis
notes: >-
  Scope relative to `Myasthenia_Gravis.yaml` (MONDO:0009688): the parent entry stratifies myasthenia
  gravis by **serotype** (AChR / MuSK / seronegative). This entry stratifies the same disease by
  **age at onset**, which MONDO models as an explicit post-composition
  (MONDO:0018324 = myasthenia gravis and has-onset HP:0003581 adult onset) and which the literature
  treats as an independent and equally load-bearing subgrouping. Content here is deliberately
  restricted to what is onset-age-specific — thymic pathology by onset age, onset-stratified HLA and
  non-HLA genetics, the striational antibody profile of late onset, the divergent incidence trends,
  and the age-bounded thymectomy evidence. The shared serotype and effector biology is not
  re-derived; see the parent entry.

  The `has_subtypes` entries (EOMG / LOMG / VLOMG) deliberately carry a `preferred_term` with no
  bound `term:`. `SubtypeDescriptor.term` binds to MONDO or NCIT, and neither ontology has a term
  for early-, late-, or very-late-onset myasthenia gravis — MONDO's only onset-qualified myasthenia
  gravis class is MONDO:0018324 itself, which is this entry. Binding an approximate term here would
  assert an identity that does not exist, so the slot is left unbound rather than filled.

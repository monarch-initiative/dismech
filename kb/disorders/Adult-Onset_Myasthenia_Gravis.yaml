review_notes: Comprehensive review read the original entry, matching falcon research report, citation sidecar and extracted entity table; every original cited abstract; and actual cached full scientific bodies rather than trusting content-type metadata. Original full sources consumed were PMID27509100, 26562150, 30918333, 33458590, 38505076, 38886398 and 40022458; PMID23055271 was regenerated to full XML and independently audited. Added full sources PMID38152089, 39105625, 40117520, 24297891 and 36074148, plus the existing full 2024 GWAS PMID39537604 (independent complete Methods/Results/Discussion audit). The 2025 epidemiology/special-population papers and unrecovered older sources remain abstract-supported. The general MG StatPearls chapter was read in full for clinical presentation and diagnosis; its older treatment and simplified molecular claims were not imported over the newer guideline and primary evidence. No adult-onset-specific GeneReviews chapter was found by the repository baseline check. The 2023 guideline was consumed across diagnosis, immune therapy, crisis, ocular disease, fatigue, vaccination, pregnancy and specialist care; its 2024 erratum corrects authorship and ravulizumab
  day-15 dosing, so no uncorrected dosing schedule is reproduced. The MGTX erratum record was identified but its correction text was unavailable; no alternate-day dose schedule is transcribed. Current FDA/manufacturer labels supply the newer inebilizumab and nipocalimab indications and trial outcomes; regulatory labels describe trial results but do not constitute head-to-head efficacy comparisons. Seven registry summaries were generated and their full live records checked for current status. Research clinical, genetic, mechanistic, diagnostic and treatment themes are represented; predictive metabolomics and causal viral initiation remain exploratory, while immune-checkpoint-inhibitor-induced MG is a related acquired subgroup rather than a proved driver of ordinary early/late-onset disease. All specific numeric frequencies retain their source denominators and ascertainment limits. Independent reviews assessed old and new GWAS interpretation, mechanism graph and clinical care. No reference cache was hand-edited.

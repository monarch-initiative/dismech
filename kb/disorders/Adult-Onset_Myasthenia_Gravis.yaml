    explanation: The late-onset replication was not restricted to verified late-onset cases.
  - reference: PMID:34400559
    reference_title: Myasthenia gravis genome-wide association study implicates AGRN as a risk locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: MG onset-specific analysis reveals differences in the genetic architecture of early-onset MG (EOMG) versus late-onset MG (LOMG).
    explanation: The abstract supports differences, not complete genetic separation.
  discussion_id: adult-mg-interpretation-1
  prompt: Onset-associated genetic architecture and ascertainment
  rationale: Onset-age strata show differing HLA and non-HLA associations, with shared susceptibility and substantial ascertainment limits. Older studies were enriched for European AChR-positive, nonthymomatous disease and early-onset cohorts could include adolescents. The 2024 discovery analysis included 5,708 cases and 432,028 controls and reused prior European cohorts; replication used 3,989 self-reported cases and 226,643 controls. Its early-onset replication used age below 50 at participation, while late-onset replication used all cases because onset age was unavailable. These results do not prove that the age strata are distinct diseases or establish clinical diagnostic use of polygenic scores.
  kind: INTERPRETATION
  status: OPEN
- evidence:
  - reference: PMID:30918333
    reference_title: Cytometric cell-based assays for anti-striational antibodies in myasthenia gravis with myositis and/or myocarditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: MG patients with myositis and/or myocarditis as well as late-onset and thymoma-associated MG had anti-titin, anti-ryanodine receptor, and anti-Kv1.4 antibodies.
    explanation: Primary selected-sample assay findings; no general frequency or pathogenic function is inferred.
  discussion_id: adult-mg-interpretation-2
  prompt: Striational antibodies and associated muscle or cardiac inflammation
  rationale: Myositis and myocarditis can accompany MG, particularly in selected thymoma-associated or late-onset series. A 2019 study analyzed stored sera from 30 patients selected for MG with myositis and/or myocarditis; it was not a population-incidence study. Titin and Kv1.4 antibodies were common in that selected group, while RyR reactivity lacked specificity. These assays do not establish that the antibodies caused muscle or cardiac injury, and myocarditis mortality must not be presented as the mortality of myasthenic crisis.
  kind: INTERPRETATION
  status: OPEN
- evidence:
  - reference: PMID:40117520
    reference_title: Single-Cell Transcriptomics Identifies a Prominent Role for the MIF-CD74 Axis in Myasthenia Gravis Thymus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Clonally expanded sequences were most enriched in the GC and cycling B-cell subsets
    explanation: Measured clonal enrichment in the primary dataset; antigen specificity and proposed communication require further validation.
  discussion_id: adult-mg-interpretation-3
  prompt: Emerging thymic cell-interaction hypotheses
  rationale: Single-cell and BCR profiling of untreated early-onset MG thymi identified clonal expansion and inferred cell-state trajectories and MIF–CD74 communication. Spatial proximity and protein staining support the tissue context but do not demonstrate signaling necessity, lineage ancestry, or response to MIF blockade. Serum MIF associations are exploratory and are not a validated diagnostic or disease-activity test.
  kind: EMERGING_HYPOTHESIS
  status: OPEN

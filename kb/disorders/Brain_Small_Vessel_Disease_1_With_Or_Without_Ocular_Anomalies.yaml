progression:
- phase: Prenatal / perinatal
  age_range: In utero to neonatal
  notes: >-
    Intracranial hemorrhage can occur antenatally (detectable on fetal ultrasound)
    or perinatally, precipitated by delivery, producing porencephaly, infantile
    hemiparesis, and seizures at the severe end.
  evidence:
  - reference: PMID:24374867
    reference_title: "Fetal intracerebral hemorrhage and cataract: think COL4A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several authors have reported mutations in COL4A1 as a Mendelian cause of prenatal onset intracranial hemorrhage (ICH)."
    explanation: Documents the prenatal/perinatal onset window.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- phase: Childhood presentations
  age_range: Infancy through adolescence
  notes: A retrospective cohort distinguished perinatal, early-childhood and late-childhood presentations. Earlier onset correlated with greater neurologic impairment, whereas later presentations more often showed isolated leukoencephalopathy. These are provisional clinical strata, not validated molecular subtypes or inevitable sequential stages. Clinical onset must be distinguished from delayed genetic diagnosis.
  evidence:
  - reference: PMID:42099677
    reference_title: Stratification of Phenotypes in Childhood-Onset COL4A1/COL4A2-Related Disorders Based on Age of Presentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Perinatal and early childhood presentations exhibit a more prominent neurologic phenotype compared with late childhood presentations.
    explanation: Combined-gene cohort conclusion, with gene-specific findings separately reported.
    quote_role: PRIMARY_RESULT
- phase: Adulthood
  age_range: Adult
  notes: >-
    In milder cases the disease presents in adulthood as small-vessel disease —
    ischemic or hemorrhagic stroke (mean stroke onset ~36 years), migraine,
    leukoencephalopathy, and aneurysms — sometimes as the first manifestation.
  evidence:
  - reference: PMID:20558831
    reference_title: "COL4A1 mutations as a monogenic cause of cerebral small vessel disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have been recently recognized as a further monogenic cause of small vessel disease that can present in adulthood."
    explanation: Documents adult-onset small-vessel-disease presentation.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: Other hereditary cerebral small-vessel diseases
  description: >-
    CADASIL (NOTCH3), CARASIL (HTRA1), and other monogenic small-vessel diseases
    share leukoencephalopathy and stroke; the presence of porencephaly, ocular
    anterior-segment anomalies, retinal arterial tortuosity, or the HANAC systemic

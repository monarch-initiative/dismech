genetic:
- name: COL4A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: COL4A1
    term:
      id: hgnc:2202
      label: COL4A1
  notes: >-
    Most described pathogenic variants are triple-helical glycine substitutions; the 2016 review enumerated
    68 glycine-substitution occurrences among 93 reported COL4A1 mutation occurrences, not a universal 90%
    fraction. Initiation-codon, splice, frameshift, nonsense and other variants occur. Two families with COL4A1
    haploinsufficiency had aberrant transcripts and reduced protein. HANAC-associated variants cluster around
    residues Gly498-Gly528 in exons 24-25, but position is not a deterministic clinical predictor. COL4A2-related
    BSVD2 is a distinct, overlapping disorder. COL4A1 overexpression due to 3-prime UTR variants in PADMAL
    or COL4A1/COL4A2 copy-number gains has a distinct dosage mechanism and is not equated with this entry.
  evidence:

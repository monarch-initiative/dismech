  description: >-
    Fluid-filled cavities in the brain, typically the resorbed sequelae of
    perinatal cerebral hemorrhage, and the hallmark severe-end phenotype. Clinically
    manifests as infantile hemiparesis, seizures, and intellectual disability,
    though it can occasionally be an incidental finding.
  phenotype_term:
    preferred_term: Porencephaly
    term:
      id: HP:0002132
      label: Porencephalic cyst
  evidence:
  - reference: PMID:16107487
    reference_title: "Novel mutations in three families confirm a major role of COL4A1 in hereditary porencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observation confirms COL4A1 as a major locus for genetic predisposition to perinatal cerebral haemorrhage and porencephaly"
    explanation: Confirms COL4A1 as a major cause of hereditary porencephaly.
  - reference: PMID:15905400
    reference_title: "Mutations in Col4a1 cause perinatal cerebral hemorrhage and porencephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "approximately 18% of survivors had porencephaly."
    explanation: Recapitulation of porencephaly in the Col4a1 mouse model.
- category: Neurological

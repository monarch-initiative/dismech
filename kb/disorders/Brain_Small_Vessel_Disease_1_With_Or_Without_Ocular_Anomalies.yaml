inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant inheritance with a 50% transmission risk for each child of a heterozygous individual.
    Inherited and de novo variants both occur. The GeneReviews estimate of at least 27% de novo cases reflects
    historically ascertained families rather than a fixed population rate. Clinical expression is highly variable;
    an asymptomatic carrier with abnormal brain MRI still has a detectable manifestation. Overall penetrance
    is not precisely established across variants, ages and organs.
  evidence:

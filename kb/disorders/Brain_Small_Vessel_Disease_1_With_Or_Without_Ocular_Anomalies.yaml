      label: Autosomal dominant inheritance
  description: >-
    COL4A1-related disorders are inherited in an autosomal dominant manner. Most
    affected individuals have an affected parent, but a substantial fraction of
    cases arise de novo (GeneReviews estimates at least 27%). Each child of an
    affected individual has a 50% chance of inheriting the variant. Penetrance and
    expressivity are highly variable, even within a family, and asymptomatic
    obligate carriers with only white-matter changes on MRI are documented. The
    founding mouse model behaves semidominantly.
  evidence:
  - reference: PMID:20301768
    reference_title: "COL4A1-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "COL4A1-related disorders are inherited in an autosomal dominant manner."
    explanation: GeneReviews establishes autosomal dominant inheritance.
  - reference: PMID:20301768
    reference_title: "COL4A1-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The proportion of cases caused by a de novo pathogenic variant is estimated to be at least 27%."
    explanation: Quantifies the de novo fraction.
  - reference: PMID:16107487
    reference_title: "Novel mutations in three families confirm a major role of COL4A1 in hereditary porencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The last mutation was also present in an asymptomatic obligate carrier with white matter abnormalities on brain magnetic resonance imaging."
    explanation: Documents reduced penetrance / variable expression in an obligate carrier.
genetic:
- name: COL4A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: COL4A1
    term:
      id: hgnc:2202
      label: COL4A1
  notes: >-
    COL4A1 encodes the alpha-1 chain of type IV collagen. Approximately 90% of
    pathogenic variants are missense substitutions of a glycine in the Gly-X-Y
    repeat of the triple-helical collagenous domain; nonsense, splice, indel, and
    start-codon variants also occur. Because the position of the substitution
    within the molecule influences which phenotypes predominate, a
    genotype-phenotype correlation exists: variants clustering in exons 24-25 are
    associated with the HANAC systemic (renal/muscular/aneurysmal) phenotype, while
    variants distributed more broadly are associated with severe porencephaly and
    cerebral small-vessel disease. The obligate partner gene COL4A2 causes a closely
    overlapping phenotype (brain small vessel disease 2), because the two chains
    obligately co-assemble into a shared heterotrimer.
  evidence:
  - reference: PMID:27794444
    reference_title: "Genotype-phenotype correlations in pathology caused by collagen type IV alpha 1 and 2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "glycine (Gly) substitutions within the triple helical domain are the most common class of mutations."
    explanation: Establishes glycine substitutions in the triple helix as the dominant variant class.
  - reference: PMID:18160688
    reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three closely located glycine mutations in exons 24 and 25 of the gene COL4A1, which encodes procollagen type IV alpha1."
    explanation: Localizes the HANAC-associated variants to exons 24-25.
  - reference: PMID:25719457
    reference_title: "The expanding phenotype of COL4A1 and COL4A2 mutations: clinical data on 13 newly identified families and a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since 2005, COL4A1 mutations have been known as an autosomal dominant cause of hereditary porencephaly."
    explanation: Establishes COL4A1 as the causative autosomal dominant gene.
mechanistic_hypotheses:
- hypothesis_group_id: intracellular_gain_of_function
  hypothesis_label: Intracellular collagen retention and ER stress (gain-of-function)
  status: CANONICAL
  description: >-
    Mutant heterotrimers are retained within the endoplasmic reticulum, triggering
    ER stress and the unfolded protein response with reduced proliferation,
    apoptosis, and cytotoxicity. In mouse models, intracellular accumulation of
    mutant collagen in vascular endothelial cells and pericytes is a key trigger of
    intracerebral hemorrhage, and an FDA-approved chemical chaperone reduces the
    accumulation — evidence that the intracellular toxicity arm is a driver, not a
    bystander.
  evidence:
  - reference: PMID:22209247
    reference_title: "COL4A2 mutations impair COL4A1 and COL4A2 secretion and cause hemorrhagic stroke."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "two of the three putative mutations found in patients trigger ER stress and activate the unfolded protein response."
    explanation: >-
      Directly demonstrates ER stress and UPR activation for pathogenic collagen IV
      variants; shown for COL4A2 but mechanistically applicable to COL4A1 because the
      two chains form an obligate shared heterotrimer.
  - reference: PMID:25753534
    reference_title: "Molecular and Genetic Analyses of Collagen Type IV Mutant Mouse Models of Spontaneous Intracerebral Hemorrhage Identify Mechanisms for Stroke Prevention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that intracellular accumulation of mutant collagen in vascular endothelial cells and pericytes was a key triggering factor of ICH."
    explanation: Establishes intracellular accumulation in vascular mural cells as a key ICH trigger.
- hypothesis_group_id: extracellular_matrix_insufficiency
  hypothesis_label: Extracellular basement-membrane insufficiency (loss-of-function arm)
  status: ALTERNATIVE
  description: >-
    Impaired secretion of both mutant and co-assembled wild-type heterotrimers
    reduces the amount of functional collagen IV reaching the basement membrane,
    producing structurally defective, fragile vascular basement membranes. This
    extracellular-insufficiency arm operates alongside the intracellular
    gain-of-function arm; their relative contributions vary by tissue, and
    disentangling them remains an open mechanistic question with therapeutic
    implications.
  evidence:
  - reference: PMID:15905400
    reference_title: "Mutations in Col4a1 cause perinatal cerebral hemorrhage and porencephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a semidominant mutation in the procollagen type IV alpha 1 gene (Col4a1) in mice, which inhibits the secretion of mutant and normal type IV collagen."
    explanation: Establishes secretion impairment of both mutant and normal collagen IV.
pathophysiology:
- name: COL4A1 Glycine Substitution and Triple-Helix Destabilization
  biological_scale: MOLECULAR
  description: >-
    A heterozygous COL4A1 variant — most often a glycine substitution within the
    Gly-X-Y repeat of the triple-helical domain — disrupts the obligate glycine at
    every third position that permits tight collagen triple-helix folding. Because
    COL4A1 and COL4A2 co-assemble into a single [alpha1(IV)]2-alpha2(IV)
    heterotrimer that is a major component of nearly all basement membranes, a
    single mutant chain compromises the whole trimer (a dominant-negative /
    antimorphic effect).
  genes:
  - preferred_term: COL4A1
    term:
      id: hgnc:2202
      label: COL4A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  evidence:
  - reference: PMID:22914737
    reference_title: "COL4A1 and COL4A2 mutations and disease: insights into pathogenic mechanisms and potential therapeutic targets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Heterotrimers composed of collagen type IV alpha 1 (COL4A1) and alpha 2 (COL4A2) constitute one of the most abundant components of nearly all basement membranes."
    explanation: Establishes the heterotrimer as a ubiquitous basement-membrane component.
  - reference: PMID:27794444
    reference_title: "Genotype-phenotype correlations in pathology caused by collagen type IV alpha 1 and 2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "COL4A1 and COL4A2 are extracellular matrix proteins that form heterotrimers and are present in nearly all basement membranes in every organ."
    explanation: Supports the molecular identity and ubiquity of the collagen IV heterotrimer.
  downstream:
  - target: Impaired Collagen IV Secretion and ER Stress
    description: >-
      The misfolded triple helix cannot be secreted efficiently, retaining mutant
      and co-assembled wild-type heterotrimers inside the cell.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15905400
      reference_title: "Mutations in Col4a1 cause perinatal cerebral hemorrhage and porencephaly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a semidominant mutation in the procollagen type IV alpha 1 gene (Col4a1) in mice, which inhibits the secretion of mutant and normal type IV collagen."
      explanation: Directly links the mutation to impaired secretion of both mutant and normal collagen IV.
- name: Impaired Collagen IV Secretion and ER Stress
  biological_scale: CELLULAR
  description: >-
    Retention of the malformed heterotrimer in the endoplasmic reticulum has two
    consequences that jointly drive disease: intracellularly, ER accumulation
    triggers ER stress and the unfolded protein response with reduced proliferation
    and increased apoptosis (a cytotoxic gain of function); extracellularly, less
    functional collagen IV reaches the basement membrane (a matrix insufficiency).
    The retained collagen is degraded via the proteasome, and clearance capacity
    appears to be a disease modifier.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  evidence:
  - reference: PMID:22209247
    reference_title: "COL4A2 mutations impair COL4A1 and COL4A2 secretion and cause hemorrhagic stroke."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these putative mutations cause intracellular accumulation of COL4A1 and COL4A2 at the expense of their secretion, which supports their pathogenecity."
    explanation: >-
      Demonstrates intracellular accumulation at the expense of secretion in a cellular
      assay; the assayed variants are in COL4A2, applicable to COL4A1 via the obligate
      shared heterotrimer.
  - reference: PMID:24001601
    reference_title: "Chemical chaperone treatment reduces intracellular accumulation of mutant collagen IV and ameliorates the cellular phenotype of a COL4A2 mutation that causes haemorrhagic stroke."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This intracellular accumulation led to ER stress, unfolded protein response activation, reduced cell proliferation and increased apoptosis."
    explanation: >-
      Establishes the ER-stress / UPR / apoptosis cascade from intracellular collagen
      accumulation; demonstrated for a COL4A2 variant and applicable to COL4A1 via the
      obligate shared heterotrimer.
  downstream:
  - target: Vascular Basement Membrane Fragility
    description: >-
      The combined intracellular toxicity and reduced basement-membrane deposition
      produce structurally defective, fragile vascular basement membranes.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced deposition of functional collagen IV into the vascular basement membrane
    - ER-stress-mediated injury of endothelial cells and pericytes
    evidence:
    - reference: PMID:25753534
      reference_title: "Molecular and Genetic Analyses of Collagen Type IV Mutant Mouse Models of Spontaneous Intracerebral Hemorrhage Identify Mechanisms for Stroke Prevention."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that intracellular accumulation of mutant collagen in vascular endothelial cells and pericytes was a key triggering factor of ICH."
      explanation: Links intracellular accumulation in vascular mural cells to hemorrhage.
- name: Vascular Basement Membrane Fragility
  biological_scale: TISSUE
  description: >-
    Focal disruptions of vascular basement membranes weaken the vessel wall.
    Because type IV collagen is present in the basement membranes of essentially
    every organ, the defect is systemic, but the thin-walled cerebral
    microvasculature is especially vulnerable, giving the brain-predominant
    phenotype. Complex basement-membrane defects are demonstrable in kidney and
    skin as well.
  evidence:
  - reference: PMID:25753534
    reference_title: "Molecular and Genetic Analyses of Collagen Type IV Mutant Mouse Models of Spontaneous Intracerebral Hemorrhage Identify Mechanisms for Stroke Prevention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Col4a1 mutations cause abnormal vascular development, which triggers small-vessel disease, recurrent hemorrhagic strokes, and age-related macroangiopathy."
    explanation: Establishes abnormal vascular development as the tissue-level substrate of small-vessel disease.
  - reference: PMID:18160688
    reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologic analysis revealed complex basement-membrane defects in kidney and skin."
    explanation: Documents the multi-organ basement-membrane defect histologically.
  downstream:
  - target: Cerebral Small-Vessel Fragility and Hemorrhage
    description: Cerebral microvascular basement-membrane weakness predisposes to hemorrhage and ischemia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16598045
      reference_title: "Role of COL4A1 in small-vessel disease and hemorrhagic stroke."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a mutation in the mouse Col4a1 gene, encoding procollagen type IV alpha1, predisposes both newborn and adult mice to intracerebral hemorrhage."
      explanation: Directly links the vascular defect to cerebral hemorrhage predisposition.
  - target: Ocular Basement Membrane Dysgenesis
    description: >-
      The same basement-membrane defect disrupts development and integrity of ocular
      anterior-segment and retinal vascular structures.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28237965
      reference_title: "Genetic dissection of anterior segment dysgenesis caused by a Col4a1 mutation in mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "COL4A1 mutations cause multi-system disorders in patients, including ASD (congenital cataracts, Axenfeld-Rieger's anomaly, Peter's anomaly and microphthalmia) and congenital or juvenile glaucoma."
      explanation: Links the collagen IV defect to the ocular anterior-segment dysgenesis spectrum.
  - target: Renal and Muscular Basement Membrane Involvement
    description: >-
      Glomerular, tubular, and muscle basement-membrane defects produce the HANAC
      systemic constellation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18160688
      reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical renal manifestations of the HANAC syndrome in these families include hematuria and bilateral, large cysts."
      explanation: Links basement-membrane involvement to the renal HANAC phenotype.
- name: Cerebral Small-Vessel Fragility and Hemorrhage
  biological_scale: ORGANISM
  description: >-
    Fragile cerebral small vessels give the defining brain phenotype: antenatal and
    perinatal hemorrhage that resorbs into porencephalic cavities, later-life
    recurrent intracerebral hemorrhage, lacunar (ischemic) infarction, diffuse
    leukoencephalopathy, cerebral microbleeds, dilated perivascular spaces,
    intracranial aneurysm, and migraine. A recurring theme is that hemorrhage is
    frequently precipitated by an environmental "second hit" — birth trauma, head
    trauma, intense physical activity, anticoagulation, or hypertension — on top of
    the constitutional vascular fragility.
  evidence:
  - reference: PMID:16598045
    reference_title: "Role of COL4A1 in small-vessel disease and hemorrhagic stroke."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "persons with COL4A1 mutations may be predisposed to hemorrhage, especially after environmental stress."
    explanation: States the constitutional-fragility-plus-environmental-trigger model for hemorrhage.
  - reference: PMID:20558831
    reference_title: "COL4A1 mutations as a monogenic cause of cerebral small vessel disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemorrhages, often recurrent, have been associated with physical trauma and activity and anticoagulant therapy."
    explanation: Documents the environmental precipitants of hemorrhage in human carriers.
  downstream:
  - target: Porencephaly
    description: Resorption of perinatal cerebral hemorrhage leaves fluid-filled porencephalic cavities.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Perinatal intracerebral hemorrhage with subsequent tissue cavitation
    evidence:
    - reference: PMID:16107487
      reference_title: "Novel mutations in three families confirm a major role of COL4A1 in hereditary porencephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This observation confirms COL4A1 as a major locus for genetic predisposition to perinatal cerebral haemorrhage and porencephaly"
      explanation: Links COL4A1-driven perinatal hemorrhage to porencephaly.
  - target: Intracerebral hemorrhage
    description: Small-vessel wall fragility causes antenatal, perinatal, and later-life hemorrhage.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16598045
      reference_title: "Role of COL4A1 in small-vessel disease and hemorrhagic stroke."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "predisposes both newborn and adult mice to intracerebral hemorrhage."
      explanation: Establishes hemorrhage across the lifespan.
- name: Ocular Basement Membrane Dysgenesis
  biological_scale: TISSUE
  description: >-
    Type IV collagen is required for normal development and maintenance of ocular
    basement membranes. Its disruption produces anterior-segment dysgenesis
    (Axenfeld-Rieger anomaly, congenital cataract, Peters anomaly, microphthalmia),
    secondary congenital/juvenile glaucoma, and retinal arterial tortuosity — the
    "ocular anomalies" of the disease name. In mouse models, the cataract arises
    from a lens-autonomous requirement for collagen IV.
  evidence:
  - reference: PMID:17696175
    reference_title: "COL4A1 mutation in Axenfeld-Rieger anomaly with leukoencephalopathy and stroke."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse leukoencephalopathy associated with ocular malformations of the Axenfeld-Rieger type was observed in five individuals."
    explanation: Human family co-segregating Axenfeld-Rieger ocular malformation with leukoencephalopathy.
  - reference: PMID:28237965
    reference_title: "Genetic dissection of anterior segment dysgenesis caused by a Col4a1 mutation in mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "50-75% of patients with ASD develop early onset and aggressive glaucoma."
    explanation: Links the anterior-segment dysgenesis to secondary glaucoma risk.
  downstream:
  - target: Axenfeld-Rieger anomaly
    description: Anterior-segment dysgenesis of the Axenfeld-Rieger type.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17696175
      reference_title: "COL4A1 mutation in Axenfeld-Rieger anomaly with leukoencephalopathy and stroke."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We delineate a novel association between the Axenfeld-Rieger anomaly and leukoencephalopathy and stroke."
      explanation: Establishes the Axenfeld-Rieger association directly.
- name: Renal and Muscular Basement Membrane Involvement
  biological_scale: TISSUE
  description: >-
    Glomerular and tubular basement-membrane defects cause hematuria and bilateral
    renal cysts, and muscle basement-membrane involvement causes cramps with
    elevated creatine kinase — together with intracranial aneurysms, these define
    the HANAC (hereditary angiopathy with nephropathy, aneurysms, and muscle cramps)
    end of the spectrum, most associated with exon 24-25 variants.
  cell_types:
  - preferred_term: kidney epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  evidence:
  - reference: PMID:18160688
    reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The systemic angiopathy of the HANAC syndrome appears to affect both small vessels and large arteries."
    explanation: Defines the HANAC systemic angiopathy affecting small and large vessels.
  downstream:
  - target: Hematuria
    description: Glomerular basement-membrane defect produces micro- or macroscopic hematuria.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18160688
      reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical renal manifestations of the HANAC syndrome in these families include hematuria and bilateral, large cysts."
      explanation: Links the renal basement-membrane defect to hematuria and cysts.
phenotypes:
- category: Neurological

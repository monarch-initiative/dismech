- name: FN1 candidate modifier
  relationship_type: MODIFIER
  notes: The murine MoGS1 locus contains 18 protein-coding genes including Fn1. Increased Fn1 expression and altered integrin signaling nominate it as a candidate modifier of ocular dysgenesis and myopathy. The interval did not suppress intracerebral hemorrhage. This is neither a demonstrated human modifier nor single-gene causal resolution of the interval.
  evidence:
  - reference: PMID:34424299
    reference_title: Identification of fibronectin 1 as a candidate genetic modifier in a Col4a1 mutant mouse model of Gould syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Of the four positional candidate genes that were differentially expressed, Fn1 is a strong functional candidate.
    explanation: Expression and functional considerations nominate Fn1 within the mouse modifier interval; single-gene causality and human modification remain unproven.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34424299
    reference_title: Identification of fibronectin 1 as a candidate genetic modifier in a Col4a1 mutant mouse model of Gould syndrome.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: MoGS1 had no effect on ICH

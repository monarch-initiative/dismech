    reference_title: "COL4A1 mutations and hereditary angiopathy, nephropathy, aneurysms, and muscle cramps."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three closely located glycine mutations in exons 24 and 25 of the gene COL4A1, which encodes procollagen type IV alpha1."

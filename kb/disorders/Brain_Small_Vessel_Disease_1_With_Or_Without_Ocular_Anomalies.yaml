  biological_scale: CELLULAR
  description: Unfolded-protein responses occur in selected collagen IV cellular and animal models, but intracellular retention does not invariably activate measurable ER stress. The COL4A2 G702D fibroblast study is comparative evidence, not direct proof in COL4A1 cerebral endothelium. Col4a1 mutant lenses accumulated collagen without detectable UPR activation. ER stress therefore cannot be assigned as the obligatory link to all vascular or ocular disease.

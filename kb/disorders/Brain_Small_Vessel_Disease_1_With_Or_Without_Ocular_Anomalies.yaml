name: Brain Small Vessel Disease 1 With Or Without Ocular Anomalies
category: Mendelian
creation_date: "2026-07-30T23:40:00Z"
synonyms:
- COL4A1-related brain small vessel disease
- Brain small vessel disease with hemorrhage
- Brain small vessel disease with Axenfeld-Rieger anomaly
- COL4A1 porencephaly
- Autosomal dominant porencephaly type 1
- BSVD1
description: >-
  Brain small vessel disease 1 with or without ocular anomalies (BSVD1) is an autosomal dominant COL4A1 disorder
  with cerebrovascular involvement ranging from prenatal hemorrhagic injury and porencephaly to adult small-vessel
  disease or clinically silent MRI abnormalities. Ocular, renal, muscular and other systemic manifestations
  overlap variably with the wider COL4A1 spectrum. COL4A1 encodes the alpha-1 chain of the alpha1-alpha1-alpha2
  type IV collagen heterotrimer. Pathogenic variants commonly alter triple-helical glycine residues, but splice,
  initiation-codon, truncating and other variants also occur. Intracellular retention, quantitative collagen
  deficiency, abnormal extracellular networks and altered vascular signaling contribute in variant- and tissue-dependent
  combinations. Clinical severity is highly variable within families. Hemorrhage can be spontaneous or modified
  by trauma, anticoagulant exposure and other vascular risks. Management is multidisciplinary surveillance,
  risk reduction and treatment of individual manifestations; mechanism-directed therapies remain experimental.

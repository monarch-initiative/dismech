prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    A precise population prevalence has not been established; the disorder is rare,
    with fewer than 100 families formally described at the time of the GeneReviews
    chapter, and cumulative literature reporting several hundred patients and >70
    variants. In ascertained cohorts, COL4A1/COL4A2 variants account for a minority
    of pediatric porencephaly/childhood cerebral hemorrhage and of sporadic adult
    intracerebral hemorrhage cases.
  evidence:
  - reference: PMID:25719457
    reference_title: "The expanding phenotype of COL4A1 and COL4A2 mutations: clinical data on 13 newly identified families and a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "COL4A1 and COL4A2 mutations have been reported with a broader spectrum of cerebrovascular, renal, ophthalmological, cardiac, and muscular abnormalities"
    explanation: >-
      Establishes the disorder as a rare but multi-system Mendelian entity; a precise
      population rate is not quantified, hence measure_type UNKNOWN.

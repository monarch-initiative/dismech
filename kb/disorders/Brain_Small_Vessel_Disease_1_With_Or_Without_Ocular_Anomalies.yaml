- name: Fetal/neonatal imaging clue
  description: >-
    Prenatal intracranial hemorrhage, especially with cataract or other lens abnormalities, should raise suspicion
    for COL4A1 disease. This combination is a diagnostic clue rather than a pathognomonic finding.
  evidence:
  - reference: PMID:24374867
    reference_title: "Fetal intracerebral hemorrhage and cataract: think COL4A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COL4A1 mutation should be envisaged in fetuses with prenatal ICH, especially in the presence of lens abnormalities at ultrasound examination."
    explanation: Establishes the prenatal ICH-plus-cataract diagnostic clue.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Multiorgan baseline assessment
  description: Brain MRI and head/neck vascular imaging, ophthalmologic assessment, renal imaging and renal-function/urine evaluation, CK measurement and cardiac assessment help define involvement. The 2025 consensus extends systematic cardiac screening to ECG and echocardiography. Choice and timing of repeated tests are individualized.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK7046/
    reference_title: COL4A1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT

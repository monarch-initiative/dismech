pathophysiology:
- name: Pathogenic COL4A1 Variation
  biological_scale: MOLECULAR
  description: Heterozygous germline COL4A1 variants perturb alpha1-alpha1-alpha2 collagen IV production or function. Glycine substitutions and in-frame splice defects can compromise heterotrimers, whereas some truncating or splice variants reduce transcript and protein abundance. These alternatives are not assumed to act identically.
  evidence:
  - reference: PMID:16107487
    reference_title: Novel mutations in three families confirm a major role of COL4A1 in hereditary porencephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: There were two missense mutations of glycine residues predicted to result in abnormal collagen IV assembly, and one mutation predicted to abolish the traditional COL4A1 start codon.
    explanation: Human families establish variant heterogeneity; assembly effects were predicted.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23065703
    reference_title: Novel COL4A1 mutations cause cerebral small vessel disease by haploinsufficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: nonsense-mediated decay (NMD) of the mutant COL4A1 messenger RNAs (mRNAs) and a clear reduction of COL4A1 protein expression were demonstrated
    explanation: Patient fibroblast protein reduction supports the quantitative-deficiency arm.
    quote_role: PRIMARY_RESULT

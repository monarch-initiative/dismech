    explanation: Situates COL4A1 among the monogenic small-vessel diseases requiring differentiation.
discussions:
- discussion_id: bsvd1_intracellular_vs_extracellular_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    To what extent is COL4A1-related disease driven by intracellular collagen
    retention with ER stress (gain of function) versus extracellular
    basement-membrane insufficiency (loss of function), and does the balance differ
    by tissue?
  attaches_to:
  - "pathophysiology#Impaired Collagen IV Secretion and ER Stress"
  rationale: >-
    Both arms are experimentally supported: pathogenic variants trigger ER stress
    and the unfolded protein response, and intracellular accumulation in vascular
    endothelial cells and pericytes is a key hemorrhage trigger in mice; yet the
    same variants also reduce secretion of functional collagen IV into the basement
    membrane. The relative contribution matters therapeutically — a predominantly
    intracellular mechanism favors chaperone/proteostasis strategies, whereas a
    predominantly extracellular mechanism favors matrix-restoration or gene-based
    approaches — and appears to vary by tissue. Resolving the balance per tissue is
    an open question.
  evidence:
  - reference: PMID:22209247
    reference_title: "COL4A2 mutations impair COL4A1 and COL4A2 secretion and cause hemorrhagic stroke."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest that COL4A2 mutations impair COL4A1 and COL4A2 secretion and can also result in cytotoxicity."
    explanation: >-
      Documents both the secretion-impairment and cytotoxicity arms in COL4A2,
      applicable to COL4A1 via the obligate shared heterotrimer, framing the open
      question.
notes: >-
  Curated from the COL4A1-Related Disorders GeneReviews chapter (PMID:20301768) plus
  primary genetics, neuropathology, mouse-model, and cellular-mechanism literature,
  cross-checked against a claude_code deep-research report (the falcon/Edison and
  OpenScientist providers were unavailable at curation time — Edison returned an
  auth error). MONDO:0008289 (OMIM:175780) is the cerebrovascular-predominant BSVD1
  node of the broader COL4A1 spectrum; the isolated ocular forms are curated
  separately (see Retinal_Arterial_Tortuosity), and the HANAC systemic constellation
  is represented here as the renal/muscular/aneurysmal arm rather than as a separate
  entry. Frequencies are drawn from the Lanfranconi & Markus systematic review of 52
  carriers (PMID:20558831); because that cohort is ascertained, the bands are best
  read as lower bounds on the imaged/symptomatic population. Deferred to follow-up
  passes (real but not curated here for lack of a verified quotable frequency at
  curation time): facial paresis, mitral valve prolapse, unilateral renal atrophy
  with progressive GFR decline, and the zebrafish mmp9 and
  gene-therapy-parameterization model threads described in the deep-research report.

environmental:
- name: Environmental "second hit" precipitants of hemorrhage
  description: >-
    Constitutional vascular fragility is converted to overt hemorrhage by
    environmental stressors. In humans and mouse models these include birth
    (delivery) trauma, head trauma, intense physical activity, anticoagulant
    exposure, and hypertension. Avoiding these is the cornerstone of management.
  evidence:
  - reference: PMID:15905400
    reference_title: "Mutations in Col4a1 cause perinatal cerebral hemorrhage and porencephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we propose that Col4a1 mutations conspire with environmental trauma in causing the disease."
    explanation: Establishes the gene-environment (second-hit) model.
  - reference: PMID:25753534
    reference_title: "Molecular and Genetic Analyses of Collagen Type IV Mutant Mouse Models of Spontaneous Intracerebral Hemorrhage Identify Mechanisms for Stroke Prevention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "environmental factors such as intense exercise or anticoagulant medication modulated disease severity"
    explanation: Identifies specific environmental modifiers of severity.

- name: Small-vessel disease on brain MRI
  description: >-
    Brain MRI may show periventricular hemorrhagic infarction, porencephalic cavities, diffuse or patchy white-matter
    abnormality, lacunes, microbleeds and dilated perivascular spaces. Some clinically asymptomatic carriers
    have abnormal imaging. Dedicated vascular imaging assesses aneurysms and vessel tortuosity. The 2026 pediatric
    study adapted an injury-severity score from another population; it is not a validated diagnostic or prognostic
    score for COL4A1 disease.
  evidence:
  - reference: PMID:20301768
    reference_title: "COL4A1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On imaging studies, small-vessel brain disease is manifest as diffuse periventricular leukoencephalopathy,
      lacunar infarcts, microhemorrhage, dilated perivascular spaces, and deep intracerebral hemorrhages.
    explanation: >-
      GeneReviews core imaging findings; variable clinical expression is described separately.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20558831
    reference_title: "COL4A1 mutations as a monogenic cause of cerebral small vessel disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dilated perivascular spaces (19.2%)."
    explanation: Quantifies dilated perivascular spaces among carriers.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
environmental:
- name: Environmental "second hit" precipitants of hemorrhage
  description: >-
    Trauma, intense exertion, anticoagulant exposure and vascular risk factors can modify hemorrhagic susceptibility;
    hemorrhage may also occur spontaneously or prenatally before delivery. These exposures are risk modifiers
    rather than required causes. Mouse surgical-delivery protection does not establish a universal human delivery
    recommendation.
  evidence:
  - reference: PMID:15905400
    reference_title: "Mutations in Col4a1 cause perinatal cerebral hemorrhage and porencephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we propose that Col4a1 mutations conspire with environmental trauma in causing the disease."
    explanation: Establishes the gene-environment (second-hit) model.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:25753534
    reference_title: "Molecular and Genetic Analyses of Collagen Type IV Mutant Mouse Models of Spontaneous Intracerebral Hemorrhage Identify Mechanisms for Stroke Prevention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "environmental factors such as intense exercise or anticoagulant medication modulated disease severity"
    explanation: Identifies specific environmental modifiers of severity.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
diagnosis:
- name: COL4A1 molecular genetic testing
  description: >-
    Diagnosis combines compatible clinical/imaging findings with a pathogenic or likely pathogenic COL4A1 variant.
    Multigene testing including COL4A1 and COL4A2 is useful because phenotypes overlap; negative testing with
    strong suspicion may justify broader genomic analysis, including poorly covered or intronic regions. A
    VUS alone is not confirmatory. Baseline multiorgan assessment is advised even when symptoms are mild.
  evidence:
  - reference: PMID:20301768
    reference_title: "COL4A1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on clinical findings and molecular genetic testing of COL4A1."
    explanation: GeneReviews diagnostic principle.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS

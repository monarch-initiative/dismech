name: Brain Small Vessel Disease 1 With Or Without Ocular Anomalies
category: Mendelian
creation_date: "2026-07-30T23:40:00Z"
synonyms:
- COL4A1-related brain small vessel disease
- Brain small vessel disease with hemorrhage
- Brain small vessel disease with Axenfeld-Rieger anomaly
- COL4A1 porencephaly
- Autosomal dominant porencephaly type 1
- BSVD1
description: >-
  Brain small vessel disease 1 with or without ocular anomalies (BSVD1) is the
  cerebrovascular-predominant, autosomal dominant phenotype of the COL4A1-related
  disorder spectrum. It is caused by heterozygous mutations in COL4A1, which
  encodes the alpha-1 chain of type IV collagen — a protein that, together with
  the alpha-2 chain (COL4A2), forms the [alpha1(IV)]2-alpha2(IV) heterotrimer that
  is a major structural component of nearly all basement membranes, including those
  of the cerebral microvasculature. The great majority of pathogenic variants are
  missense substitutions of a glycine residue within the Gly-X-Y collagenous
  triple-helical domain; these destabilize triple-helix folding and impair
  secretion of both mutant and co-assembled wild-type heterotrimers, producing a
  dual insult of intracellular collagen retention with endoplasmic-reticulum stress
  and extracellular basement-membrane insufficiency. The resulting cerebral
  small-vessel fragility manifests as porencephaly, perinatal and later-life
  intracerebral hemorrhage, ischemic (lacunar) stroke, diffuse leukoencephalopathy,
  cerebral microbleeds, dilated perivascular spaces, intracranial aneurysm, and
  migraine, with severity strongly modulated by environmental second hits such as
  birth trauma, head trauma, intense exercise, anticoagulation, and hypertension.
  Because type IV collagen is a ubiquitous basement-membrane protein, the disorder
  is pleiotropic: the "with ocular anomalies" qualifier reflects the frequent
  anterior-segment dysgenesis (Axenfeld-Rieger anomaly, congenital cataract,
  glaucoma) and retinal arterial tortuosity, and additional systemic features
  (nephropathy with hematuria and renal cysts, muscle cramps with elevated creatine
  kinase, cerebral aneurysms — the HANAC constellation, Raynaud phenomenon, cardiac
  arrhythmia, and hemolytic anemia) can co-occur. There is no disease-modifying
  therapy; management is risk reduction and supportive.

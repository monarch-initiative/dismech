    reference_title: "Genotype-phenotype correlations in pathology caused by collagen type IV alpha 1 and 2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "glycine (Gly) substitutions within the triple helical domain are the most common class of mutations."
    explanation: Establishes glycine substitutions in the triple helix as the dominant variant class.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS

  description: A specialist obstetric and fetal/neonatal team should consider the maternal and fetal genotype and clinical condition. The 2025 consensus makes cesarean delivery a case-by-case option when mother or fetus carries a pathogenic variant, updating the blanket recommendation in the older GeneReviews chapter. A 2026 retrospective combined-gene pediatric study found no association between delivery mode and several childhood outcomes, but confounding by prenatal injury and small sample size prevent a conclusion of equivalent safety.

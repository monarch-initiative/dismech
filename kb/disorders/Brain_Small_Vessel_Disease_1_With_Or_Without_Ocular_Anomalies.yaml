discussions:
- discussion_id: bsvd1_intracellular_vs_extracellular_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which COL4A1 variants and tissues are driven predominantly by intracellular retention, quantitative deficiency
    or extracellular mutant-collagen dysfunction?
  attaches_to:
  - pathophysiology#Intracellular Collagen IV Retention
  - pathophysiology#Abnormal Extracellular Collagen IV Network
  rationale: >-
    Human haploinsufficiency, secretion-impaired mouse alleles, lenses without measurable UPR, and mutation-dependent
    chaperone benefit or harm demonstrate that a single retention-to-apoptosis pathway is insufficient. Retinal
    NOTCH3/TGF-beta, arterial PIP2/calcium and human iPSC metalloproteinase findings identify further context-dependent
    branches. Their relative contributions in individual patients remain uncertain.
  evidence:
  - reference: PMID:31051113
    reference_title: COL4A1 Mutations Cause Neuromuscular Disease with Tissue-Specific Mechanistic Heterogeneity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: can ameliorate or exacerbate myopathy in a mutation-dependent manner
    explanation: Contrasting preclinical treatment response motivates genotype and tissue stratification.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23065703
    reference_title: Novel COL4A1 mutations cause cerebral small vessel disease by haploinsufficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: nonsense-mediated decay (NMD) of the mutant COL4A1 messenger RNAs (mRNAs) and a clear reduction of COL4A1 protein expression were demonstrated
    explanation: Human quantitative deficiency provides a distinct mechanistic case.
    quote_role: PRIMARY_RESULT
notes: >-
  This entry retains the cerebrovascular-predominant COL4A1 BSVD1 concept (MONDO:0008289), including variably
  overlapping renal, muscular and ocular findings. HANAC-associated systemic manifestations are qualified by
  their ascertainment; isolated retinal arterial tortuosity and PADMAL due to COL4A1 overexpression are not
  treated as equivalent diagnoses. COL4A2 models provide explicitly comparative evidence. Published cohort
  fractions depend on genotype mix, referral patterns, age and which organs were screened, and are not population
  penetrance estimates.

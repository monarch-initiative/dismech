- name: Sodium phenylbutyrate (preclinical)
  description: The chemical chaperone sodium 4-phenylbutyrate promotes collagen secretion and can reduce retention and selected disease outcomes in mice. Responses depend on mutation, tissue, dose and treatment timing. Delta-exon-41 myopathy improves, whereas G394V muscle histology worsens despite improved peripheral myelination. In G1064D mice, preventive treatment reduces MRI hemorrhage volume; adult treatment reduces histologic hemosiderin without a clear MRI burden change. Matrix structural defects persist and skin mechanical stability can worsen. Ocular rescue at high prenatal doses in another model coincides with maternal/perinatal toxicity. These findings do not establish human efficacy or a safe disease-specific regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

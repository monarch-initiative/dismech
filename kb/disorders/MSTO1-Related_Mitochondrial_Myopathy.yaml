    snippet: "MSTO1 deficiency enhances RAD51 binding to mitochondrial DNA (mtDNA), disrupting mtDNA replication and causing mtDNA damage."
    explanation: The specific mechanism by which loss of MSTO1 would deplete mtDNA without passing through a fusion defect.
  - reference: PMID:42098462

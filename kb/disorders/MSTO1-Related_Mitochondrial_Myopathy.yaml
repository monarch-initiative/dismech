    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report a distinct pattern of selective involvement on muscle MRI in MSTO1-RD."
    explanation: The claim that muscle MRI shows a disorder-specific pattern, from an independent group.
biochemical:
- name: Normal blood lactate and normal respiratory chain enzyme activities
  presence: Normal
  notes: >-
    The standard mitochondrial biochemical screen is normal in most patients.
    Lactate is not elevated, respiratory chain complex activities in muscle
    homogenate are normal or near normal, and fibroblast respiration is normal.
    This is the opposite of what a clinician expects in a disease that has been
    proposed to belong among the mtDNA depletion syndromes, and it is the main
    reason these
    patients were historically not identified through metabolic pathways. The
    2026 adult-onset case is the exception, with reduced membrane potential and
    respiratory capacity.

    Curated as a normal-result biomarker because the negative result carries
    diagnostic information - it must not be used to exclude the diagnosis. No
    LOINC-coded reference range is attached because the sources report
    qualitative normality rather than an interval.
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our biochemical analyses were not indicative of a mitochondrial disorder: patients showed normal lactate levels, and hardly any defect of MRC complex activities or cell respiration"
    explanation: The direct statement that the mitochondrial biochemical workup is uninformative in this disorder.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As for other mutations affecting genes involved in mitochondrial dynamics, no biochemical defects typical of mitochondrial disorders were reported."
    explanation: Places the negative biochemistry in context as a property of mitochondrial-dynamics disorders generally, not an anomaly of this cohort.
- name: Reduced citrate synthase activity in muscle
  presence: Decreased
  notes: >-
    Citrate synthase activity, the conventional index of mitochondrial mass, was
    markedly reduced in patient muscle in the 2017 recessive series even though
    respiratory chain complex activities normalised to citrate synthase were
    unremarkable. Read together with the reduced mtDNA content, this supports a
    model of fewer mitochondria rather than defective ones, and it is the
    biochemical counterpart of the dissociation node in the pathograph.

    Reported in a single family (patients A1 and A2 of PMID:28544275). It has
    not been measured systematically in later cohorts, so its sensitivity as a
    biomarker is unknown and it should not be used as a diagnostic test.
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we detected markedly low activity of citrate synthase and reduced mtDNA amount, suggesting a reduction in mitochondrial mass."
    explanation: The finding and the authors' interpretation of it as reduced mitochondrial mass.
- name: Reduced mitochondrial DNA copy number
  presence: Decreased
  notes: >-
    Quantitative measurement of mtDNA relative to nuclear DNA is the one
    laboratory assay that is reliably abnormal. Patient fibroblasts show 30-70%
    depletion, and the single patient in whom muscle was assayed had 27% of
    control. Because the assay is available in most mitochondrial diagnostic
    laboratories, it is a reasonable supporting test once an MSTO1 genotype is
    suspected - though not a screening test, since mtDNA depletion is shared
    with many other genetic causes.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a significant reduction in mtDNA copy number across all fibroblast lines, ranging from 30 to 70% depletion"
    explanation: The quantitative fibroblast result across all seven patient lines.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mtDNA amount was reduced to 27% of the mean control value"
    explanation: The only muscle measurement, in the index patient of the 2017 recessive series.
diagnosis:
- name: Exome or genome sequencing with bi-allelic MSTO1 variant interpretation
  description: >-
    Molecular diagnosis rests on identifying bi-allelic MSTO1 variants against
    transcript NM_018116.3, and in practice the diagnosis has almost always been
    made by broad sequencing after targeted neuromuscular panels returned
    negative. Three interpretive points follow from the published experience.
    First, both parents should be tested to establish that the two variants are
    in trans, since heterozygotes are unaffected. Second, if only one
    heterozygous sequence variant is found in a compatible phenotype, proceed to
    deletion/duplication analysis, because at least one reported patient carried
    a multi-exon intragenic deletion as the second allele. Third, and specific
    to this gene, confirm that a called variant is not a mis-mapped read from
    the adjacent MSTO2P pseudogene - the misassignment that produced the
    literature's only reported dominant family.
  evidence:
  - reference: PMID:41653646
    reference_title: "MSTO1-related mitochondrial myopathy and ataxia syndrome: Case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome or genome sequencing was used to identify genetic variants in patients with suspected hereditary myopathy who had negative results on targeted genetic panels."
    explanation: Describes the diagnostic route actually used, and the reason panel-negative myopathy should prompt broad sequencing.
  - reference: PMID:31604776
    reference_title: "Novel biallelic variants in MSTO1 associated with mitochondrial myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletion encompassing exons 7-14 of MSTO1"
    explanation: Supports the specific recommendation to pursue copy-number analysis when only one sequence variant is found.
  - reference: PMID:37431815
    reference_title: "Answer to Gerber et al. \"Autosomal recessive pathogenic MSTO1 variants in hereditary optic atrophy\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but also confirm finding of Gerber et al that the mutation is in MSTO2p pseudogene"
    explanation: The documented instance of pseudogene misassignment that justifies the third interpretive caution.
- name: Serum creatine kinase and neurological examination
  description: >-
    The pre-test clinical pattern that should trigger sequencing is a child with
    early-onset, slowly progressive or static proximal weakness, a raised
    creatine kinase, a wide-based waddling gait, cerebellar signs on limb
    coordination testing, and brisk reflexes. The combination of a myopathic
    weakness pattern with upper motor neuron signs is unusual and is the
    strongest bedside pointer. Creatine kinase is elevated in the large majority
    but not all patients.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum creatine kinase (CK) levels were significantly increased in all patients, except for P15, ranging from 300 to 5000 U/L."
    explanation: Establishes both the diagnostic value and the limits of creatine kinase as a screening test.
- name: Brain MRI
  description: >-
    Brain MRI is indicated in any child with an unexplained dystrophic myopathy
    and should be read specifically for cerebellar volume. Cerebellar atrophy or
    hypoplasia of the vermis and both hemispheres was present in every patient
    imaged in the largest cohort, and finding it in a child whose muscle biopsy
    reads as congenital muscular dystrophy substantially narrows the
    differential.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "involving the vermis and both hemispheres in all 12"
    explanation: The imaging finding and its consistency across the cohort.
- name: Ophthalmological assessment with multimodal retinal imaging
  description: >-
    Formal ophthalmological review with fundus autofluorescence and optical
    coherence tomography is recommended even in patients without visual symptoms,
    for two reasons. First, the retinopathy causes concentric field constriction
    with initially preserved acuity, so it is asymptomatic until late. Second,
    the largest cohort reported no retinopathy but did not examine every patient,
    so the true frequency is unknown and can only be established by
    protocolised examination.
  evidence:
  - reference: PMID:40542878
    reference_title: "Seventeen-year follow-up of mitochondrial myopathy and ataxia in a Chinese family: case reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multimodal imaging of the retina is beneficial for diagnosing MMYAT-associated retinal dystrophy."
    explanation: The authors' explicit recommendation for the imaging modality, from the only detailed ophthalmological study of this disorder.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding was not reported in any of the patients in our cohort; however, formal ophthalmologic examination was not pursued in all patients."
    explanation: The incomplete-ascertainment admission that makes protocolised examination necessary.
- name: Mitochondrial DNA copy number quantification
  description: >-
    Quantitative mtDNA content in fibroblasts or muscle is a supportive rather
    than a diagnostic test. It is consistently reduced in MSTO1 patients, which
    can help resolve a variant of uncertain significance, but depletion is
    shared with many other nuclear-gene mtDNA depletion syndromes and so has no
    specificity on its own. Conversely, a normal respiratory chain assay must
    not be used to exclude the diagnosis.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a significant reduction in mtDNA copy number across all fibroblast lines, ranging from 30 to 70% depletion"
    explanation: Establishes the consistency of the finding that makes it useful as supporting evidence.
differential_diagnoses:
- name: Marinesco-Sjogren syndrome
  disease_term:
    preferred_term: Marinesco-Sjogren syndrome
    term:
      id: MONDO:0009567
      label: Marinesco-Sjogren syndrome
  description: >-
    The closest clinical mimic and the one most likely to be considered first.
    Marinesco-Sjogren syndrome, caused by bi-allelic SIL1 variants, pairs a
    myopathy with raised creatine kinase and cerebellar atrophy with ataxia,
    which is precisely the MSTO1 core. The index patient of the first recessive
    MSTO1 family had SIL1 sequenced and excluded before the MSTO1 diagnosis was
    reached, which is direct documentation that this differential is worked
    through in practice.
  distinguishing_features:
  - Early-onset bilateral cataract is a cardinal feature of Marinesco-Sjogren syndrome and was absent in all 15 patients of the largest MSTO1 cohort.
  - Hypergonadotropic hypogonadism and short stature are typical of Marinesco-Sjogren syndrome and are not established features of MSTO1 disease.
  - Marinesco-Sjogren muscle shows rimmed autophagic vacuoles with abnormal membranous whorls, whereas MSTO1 muscle shows a non-specific dystrophic pattern.
  - Only the causal gene distinguishes the two definitively; SIL1 was verified as HGNC:24624 and Marinesco-Sjogren syndrome as MONDO:0009567 with OMIM:248800 using OAK and the HGNC REST API on 2026-08-01.
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following genes were previously excluded by Sanger sequencing: SPG7, FKTN, POMT1, POMT2, LARGE, POMGNT1, and SIL1."
    explanation: >-
      Documents that SIL1 - and the dystroglycanopathy genes - were actively
      excluded in an MSTO1 patient, which is what makes this a real rather than
      a theoretical differential.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients had a history of seizures, cataracts, hearing or cardiac involvement."
    explanation: The absence of cataract in every MSTO1 patient is the single most useful clinical discriminator from Marinesco-Sjogren syndrome.
- name: Dystroglycanopathy-type congenital muscular dystrophy
  description: >-
    A child with congenital or early-childhood dystrophic weakness, a raised
    creatine kinase and cerebellar abnormality on MRI fits the
    dystroglycanopathy phenotype closely, and these genes are on every
    congenital muscular dystrophy panel while MSTO1 historically was not. The
    first recessive MSTO1 family had FKTN, POMT1, POMT2, LARGE and POMGNT1
    sequenced and excluded before MSTO1 was found, so this is the differential
    that actually delays diagnosis.
  distinguishing_features:
  - Dystroglycanopathies typically show cobblestone lissencephaly, brainstem and cerebellar dysplasia with cysts, and ocular malformation; MSTO1 disease shows isolated cerebellar volume loss with a structurally normal cortex.
  - Immunohistochemistry for glycosylated alpha-dystroglycan is reduced in dystroglycanopathies and is not reported as abnormal in MSTO1 muscle.
  - Corticospinal tract signs are a recurrent feature of MSTO1 disease and are not characteristic of the dystroglycanopathies.
  - No MONDO term is bound for this differential because it names a genetically heterogeneous group rather than a single ontology entity; the genes are named instead, quoted from the source below.
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following genes were previously excluded by Sanger sequencing: SPG7, FKTN, POMT1, POMT2, LARGE, POMGNT1, and SIL1."
    explanation: The dystroglycanopathy genes named as having been excluded in a patient who turned out to have MSTO1 disease.
- name: Mitochondrial DNA depletion syndrome, myopathic form
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome, myopathic form
    term:
      id: MONDO:0012301
      label: mitochondrial DNA depletion syndrome, myopathic form
  description: >-
    The nosological neighbour. TK2-related myopathic mtDNA depletion syndrome is
    the disorder MSTO1 disease most resembles at the level of laboratory
    mechanism - both present with a myopathy and reduced mtDNA copy number - and
    the largest MSTO1 cohort argued explicitly that MSTO1 deficiency should be
    classified as an mtDNA depletion syndrome. The distinction is therefore
    genetic and clinical rather than biochemical.
  distinguishing_features:
  - TK2 disease is a defect of the mitochondrial nucleoside salvage pathway (TK2 verified as HGNC:11831 via the HGNC REST API on 2026-08-01), whereas MSTO1 encodes a cytosolic protein acting on organelle dynamics.
  - TK2 myopathy is typically relentlessly progressive with respiratory failure, whereas MSTO1 weakness is slowly progressive or static in every patient of the largest cohort.
  - Cerebellar atrophy with ataxia and corticospinal signs is core to MSTO1 disease and is not a feature of the myopathic form of TK2 disease.
  - Ragged red and COX-negative fibres with respiratory chain deficiency are usual in TK2 muscle; MSTO1 muscle shows a dystrophic pattern with normal oxidative histochemistry and normal respiratory chain activities.
  - MONDO:0012301 was verified with OAK on 2026-08-01, returning OMIM:609560 and RO:0004003 HGNC:11831 TK2.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this novel link to mtDNA depletion in patient fibroblasts suggests that MSTO1-deficiency should also be considered a mtDNA depletion syndrome"
    explanation: Establishes that the two disorders belong to the same mechanistic class, which is what makes the clinical distinctions above necessary.
- name: Kearns-Sayre syndrome
  disease_term:
    preferred_term: Kearns-Sayre syndrome
    term:
      id: MONDO:0010787
      label: Kearns-Sayre syndrome
  description: >-
    The differential that the pigmentary retinopathy generates. A patient with
    pigmentary retinopathy, ataxia and a myopathy will be investigated for
    Kearns-Sayre syndrome, and the single-large-scale mtDNA deletion syndromes
    are a standard part of that workup. The two are distinguished by the
    remainder of the Kearns-Sayre triad and by the genetic mechanism.
  distinguishing_features:
  - Kearns-Sayre syndrome requires chronic progressive external ophthalmoplegia with onset before age 20; ophthalmoplegia and ptosis are not features of MSTO1 disease.
  - Cardiac conduction block is a defining and life-limiting component of Kearns-Sayre syndrome; cardiac involvement was absent in all 11 MSTO1 patients who had echocardiography.
  - Kearns-Sayre syndrome is caused by a single large-scale mtDNA deletion, usually sporadic, whereas MSTO1 disease is nuclear and autosomal recessive with an inheritance risk to siblings.
  - Ragged red fibres and COX-negative fibres are typical in Kearns-Sayre muscle and absent in MSTO1 muscle.
  - MONDO:0010787 was verified with OAK on 2026-08-01 (OMIM:530000) and matches the disease_term already bound in kb/disorders/Kearns-Sayre_Syndrome.yaml.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients had a history of seizures, cataracts, hearing or cardiac involvement."
    explanation: Absence of cardiac and audiological involvement in MSTO1 disease is the practical discriminator from Kearns-Sayre syndrome.
- name: Charcot-Marie-Tooth disease type 2A2
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease type 2A2
    term:
      id: MONDO:0012231
      label: Charcot-Marie-Tooth disease type 2A2
  description: >-
    Included as a mechanistic rather than a clinical differential. CMT2A2 is
    caused by variants in MFN2, the outer-membrane mitofusin that executes the
    fusion reaction MSTO1 is thought to support, and MFN2 disease is one of the
    two fusion disorders in which mtDNA depletion was first demonstrated. The
    pairing establishes that lesions at adjacent points of one fusion pathway
    both produce neurological disease with mtDNA depletion, which is the
    argument for treating fusion-related mtDNA depletion as a coherent group.
  distinguishing_features:
  - CMT2A2 is a length-dependent axonal neuropathy with distal weakness, sensory loss, areflexia and foot deformity; MSTO1 disease is proximal, myopathic and often hyperreflexic.
  - CMT2A2 is usually autosomal dominant, whereas MSTO1 disease is recessive with unaffected carrier parents.
  - Creatine kinase is normal or minimally raised in CMT2A2 and substantially raised in most MSTO1 patients.
  - MFN2 acts at the mitochondrial outer membrane as a GTPase; MSTO1 is cytosolic and no GTPase activity has been demonstrated for it.
  - MONDO:0012231 was verified with OAK on 2026-08-01, returning OMIM:609260 and RO:0004003 HGNC:16877 MFN2. Note that MONDO:0007308 (CMT2A1) is a distinct term associated with KIF1B and is deliberately NOT the term bound here.
  notes: >-
    The MONDO identifier for this differential was checked rather than recalled,
    and the check mattered: the obvious search hit for "Charcot-Marie-Tooth
    disease type 2A" is MONDO:0007308, which OAK reports as CMT2A1 with causal
    gene KIF1B, not MFN2. Binding that term would have attached the wrong gene
    to the mechanistic argument this differential makes. No evidence item is
    attached because the comparison is a reasoned cross-reference rather than a
    quoted finding.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists and none is in trial. Management follows
    the components of the phenotype: physiotherapy and mobility aids for the
    proximal weakness and ataxia, scheduled spirometry with non-invasive
    ventilation if vital capacity falls, orthopaedic surveillance and
    intervention for scoliosis and chest deformity, speech and language therapy
    for dysarthria and speech delay, educational support for learning
    difficulty, and low-vision services where retinopathy is present. Routine
    cardiac surveillance has no established indication in this disorder, which
    distinguishes management from that of most muscular dystrophies.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No treatment claim in this entry is supported by an interventional study in
    MSTO1 disease, because none exists. The management components above are
    inferred from the documented phenotype rather than from trial evidence, and
    are recorded here rather than as evidenced treatment entries for that
    reason.
- name: Physiotherapy and mobility support
  description: >-
    Directed at the proximal weakness, the waddling wide-based gait and the
    cerebellar incoordination. Because weakness is slowly progressive or static
    in most patients, maintenance of function over decades is a realistic goal
    rather than a holding measure.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All 15 patients reported either relatively slow progression or no progression of their muscle weakness."
    explanation: >-
      Marked PARTIAL: this supports the rationale for long-term functional
      maintenance but is not evidence that physiotherapy alters outcome in this
      disorder, which has never been tested.
- name: Respiratory surveillance and non-invasive ventilation
  description: >-
    Forced vital capacity was reduced to 60-79% of predicted in every patient
    tested in the largest cohort, and these measurements came from screening
    rather than from symptoms. Scheduled spirometry, with sleep studies and
    non-invasive ventilation if values decline, is therefore the rational
    approach; chest wall deformity from scoliosis and pectus excavatum
    compounds the diaphragmatic weakness.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed reduced forced vital capacity (FVC) measurements, ranging from 60 to 79% predicted"
    explanation: Establishes that clinically silent restrictive physiology is present, which is the justification for scheduled rather than symptom-triggered testing.
- name: Orthopaedic management of scoliosis and chest deformity
  description: >-
    Spinal deformity is the most common non-neurological problem and can be
    severe, including marked scoliosis with hemithorax asymmetry. Management
    follows standard neuromuscular scoliosis practice, with bracing and surgical
    correction considered on curve progression and respiratory grounds.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient showed severe asymmetry of the chest, with enlargement of the right hemithorax, pectus excavatum, and marked scoliosis"
    explanation: Documents the severity that the orthopaedic component of management has to address.
- name: Genetic counselling
  description: >-
    Counselling is straightforward once the genotype is established -
    autosomal recessive, with a 25% recurrence risk for siblings and unaffected
    carrier parents - but it depends on the two variants having been confirmed
    in trans, and on the reported variants not being pseudogene artefacts. The
    recessive model should be stated without the historical dominant caveat,
    which no longer applies.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since haploinsufficiency, as is present in some of the heterozygous parents in our cohort, does not cause a clinical phenotype"
    explanation: The evidence that carrier parents are unaffected, which is the substance of the counselling message.
discussions:
- discussion_id: msto1-dominant-claim-retracted
  kind: CONTROVERSY
  status: RESOLVED
  prompt: >-
    Is autosomal dominant inheritance a real mode for MSTO1 disease, given that
    it was reported in 2017, repeated in reviews through 2019, and still appears
    in the HPO annotation set for OMIM:617675?
  rationale: >-
    This entry answers no, and the reasoning should be auditable rather than
    implicit. The claim originated with a single Hungarian family in which a
    heterozygous c.22G>A (p.Val8Met) change segregated with a multisystem
    phenotype dominated by psychiatric and endocrine features; the report was
    titled as revealing the first dominant MSTO1 mutation, and the authors also
    proposed a possible dominant-negative mechanism. In 2023 Gerber et al
    challenged the variant assignment, and in their published reply the original
    authors confirmed that the mutation lies in the MSTO2P pseudogene rather
    than in MSTO1; EMBO Molecular Medicine issued an erratum to the 2017 paper.
    Independently, the largest cohort had already observed that heterozygous
    parents carrying MSTO1 loss-of-function alleles are unaffected, which
    removes haploinsufficiency as a plausible dominant route. Every other
    reported family is bi-allelic. The residual open question, and the reason
    the discussion is retained rather than deleted, is what the MSTO2P variant
    was doing in that family: the original authors maintain that their patients
    genuinely had reduced MSTO1 mRNA and protein, and whether the pseudogene
    variant contributed to that reduction is explicitly unresolved.
  attaches_to:
  - "genetic#MSTO1"
  - "pathophysiology#Bi-allelic Loss-of-Function Variants in MSTO1"
  resolution_note: >-
    Resolved for the purpose of this entry: only autosomal recessive inheritance
    is asserted, and the phenotypes unique to the MSTO2P family are excluded.
    The subsidiary question of whether an MSTO2P variant can lower MSTO1
    expression remains open and is recorded in the rationale.
  proposed_experiments:
  - experiment_id: msto1-msto2p-expression-test
    name: Test whether MSTO2P variants modulate MSTO1 expression
    description: >-
      Introduce the MSTO2P c.22G>A-equivalent change into cells on an otherwise
      isogenic background and measure MSTO1 mRNA and protein, to determine
      whether a pseudogene variant can account for the reduced MSTO1 levels
      reported in the original family or whether that observation had another
      cause.
  - experiment_id: msto1-pseudogene-alignment-audit
    name: Audit of MSTO1 variant calls for pseudogene mis-mapping
    description: >-
      Re-examine reported heterozygous MSTO1 variants in clinical databases with
      alignment methods that discriminate MSTO1 from MSTO2P, to establish how
      often the misassignment recurs in routine diagnostics.
  evidence:
  - reference: PMID:37431816
    reference_title: "Autosomal recessive pathogenic MSTO1 variants in hereditary optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gerber et al report 2 autosomal recessive pathogenic Misato homolog 1 (MSTO1) variants causing hereditary optic atrophy and raise concerns about a previously identified dominant variant of MSTO1 by Gal et al (2017)."
    explanation: The published challenge to the dominant variant.
  - reference: PMID:37431815
    reference_title: "Answer to Gerber et al. \"Autosomal recessive pathogenic MSTO1 variants in hereditary optic atrophy\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but also confirm finding of Gerber et al that the mutation is in MSTO2p pseudogene"
    explanation: The original authors' confirmation, which is what makes this resolved rather than merely disputed.
  - reference: PMID:37431815
    reference_title: "Answer to Gerber et al. \"Autosomal recessive pathogenic MSTO1 variants in hereditary optic atrophy\"."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether MSTO2p variant contributes to the observed decrease in MSTO1 levels in patients remains unclear."
    explanation: The explicitly unresolved residue, which is why the discussion carries proposed experiments rather than being closed outright.
- discussion_id: msto1-retinopathy-denominator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of patients with bi-allelic MSTO1 variants actually have a
    pigmentary retinopathy, given that the feature names the disease term but
    was absent from the largest published cohort?
  rationale: >-
    The MONDO and Orphanet labels for this disorder include pigmentary
    retinopathy, and the feature is unambiguously real: both probands of the
    report that named it, the index patient of the first recessive series and
    two Chinese sisters followed for seventeen
    years all have it, and the 2025 ophthalmological study calls retinal
    dystrophy a key characteristic. Yet none of the fifteen patients in the
    largest cohort had it recorded. The authors of that cohort state that formal
    ophthalmological examination was not pursued in all patients, so the
    conflict may be entirely one of ascertainment - a rod-predominant dystrophy
    with concentric field loss and preserved acuity is asymptomatic for years
    and will not be found unless it is looked for. The alternative is a genuine
    genotype- or ancestry-dependent difference in retinal involvement. The
    distinction matters for practice, because if the retinopathy is common but
    silent then every patient needs baseline retinal imaging, whereas if it is
    genuinely rare then targeted examination suffices. It also matters for
    nosology: a disease named after a feature that most patients lack is a
    naming problem that MONDO may eventually need to address.
  attaches_to:
  - "phenotypes#Pigmentary retinopathy"
  - "pathophysiology#Retinal Degeneration with Pigmentary Change"
  proposed_experiments:
  - experiment_id: msto1-protocolised-retinal-imaging
    name: Protocolised retinal imaging in every ascertained MSTO1 patient
    description: >-
      Apply a common protocol - wide-field fundus autofluorescence, optical
      coherence tomography, visual fields and full-field electroretinography -
      to all newly ascertained and, where possible, previously reported patients,
      to convert an inconsistent set of case observations into a real numerator
      and denominator.
  - experiment_id: msto1-genotype-retina-correlation
    name: Genotype-retinal phenotype correlation across the published cohort
    description: >-
      Test whether retinal involvement tracks with allele class or residual
      protein level by collating genotype alongside protocolised retinal
      phenotyping, which would distinguish an ascertainment artefact from a
      genotype effect.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding was not reported in any of the patients in our cohort; however, formal ophthalmologic examination was not pursued in all patients."
    explanation: >-
      States both halves of the gap - the absence of the finding, and the
      incomplete ascertainment that prevents interpreting the absence.
  - reference: PMID:40542878
    reference_title: "Seventeen-year follow-up of mitochondrial myopathy and ataxia in a Chinese family: case reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased awareness and comprehensive ophthalmic examination are crucial for obtaining an early and accurate diagnosis."
    explanation: The ophthalmological group's own conclusion that systematic examination is what is missing, which is the substance of the proposed experiments.
- discussion_id: msto1-mtdna-depletion-tissue-gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is mtDNA depletion present in the tissues that are actually diseased -
    skeletal muscle and cerebellum - or only in the cultured fibroblasts where
    it has almost always been measured?
  rationale: >-
    mtDNA depletion is the observation that reclassified this disorder as an
    mtDNA depletion syndrome, and it is consistent wherever it has been looked
    for. But the evidence base is narrower than the claim. Seven of seven
    fibroblast lines in the largest cohort showed 30-70% depletion, and the
    same paper states that muscle tissue was not available for further mtDNA
    content studies; the only muscle measurement in the literature is 27% of
    control in a single patient in a different series. No cerebellar tissue from
    an MSTO1 patient has ever been examined. Fibroblasts divide and muscle
    fibres and Purkinje cells do not, and mtDNA copy number regulation differs
    substantially between proliferating and postmitotic cells, so the
    extrapolation is not safe. Until depletion is measured in muscle in a series
    rather than in one patient, the causal edge from mtDNA depletion to muscle
    and cerebellar pathology in this entry rests on an inference.
  attaches_to:
  - "pathophysiology#mtDNA Depletion and Nucleoid Reorganisation"
  - "pathophysiology#Dystrophic Degeneration of Skeletal Muscle Fibres"
  proposed_experiments:
  - experiment_id: msto1-muscle-mtdna-series
    name: Quantitative mtDNA content in MSTO1 patient muscle across a series
    description: >-
      Measure mtDNA relative to nuclear DNA in stored muscle biopsy material
      from as many reported patients as can be recovered, with single-fibre
      analysis where possible, to establish whether the fibroblast depletion is
      reproduced in the diseased tissue and whether it is uniform or mosaic
      across fibres.
  - experiment_id: msto1-ipsc-neurons-and-myotubes
    name: Patient iPSC-derived myotubes and cerebellar organoids
    description: >-
      Differentiate patient iPSC into myotubes and cerebellar organoids and
      measure mtDNA content, nucleoid distribution and network morphology in
      postmitotic, disease-relevant cell types rather than in dividing
      fibroblasts.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "all fibroblasts were found to have depletion of mtDNA ranging from 30 to 70% along with alterations to mtDNA nucleoids"
    explanation: The strength of the fibroblast evidence, which is exactly what makes the absence of tissue evidence conspicuous.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "mtDNA amount was reduced to 27% of the mean control value"
    explanation: >-
      The entire muscle evidence base for this disorder is this one
      measurement, in one patient. Marked PARTIAL for that reason.
- discussion_id: msto1-mechanism-ordering
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Is impaired mitochondrial fusion the primary consequence of losing MSTO1, or
    is it downstream of a cytosolic proteostasis defect, or of a direct effect on
    mtDNA replication through RAD51?
  rationale: >-
    Three accounts of MSTO1's molecular function are now on the table and they
    make different predictions. The canonical fusion-first model, in place since
    2017, is supported by rescue kinetics in patient fibroblasts and by analogy
    with MFN2 and OPA1, but has never demonstrated the connecting steps in MSTO1
    cells and leaves the protein without a defined molecular activity. The 2026
    TRiC model gives it one - chaperonin assembly factor - and its
    temporal-ordering experiment directly contradicts the canonical ordering,
    with TRiC falling at day two and mitochondria fragmenting only at day six;
    but it is an unreviewed preprint from one laboratory, and the TRiC substrate
    that connects proteostasis to the organelle is unidentified since tubulin
    and actin were excluded. The 2026 RAD51 model would explain mtDNA depletion
    without a fusion intermediate, but it is entirely in cancer cell systems. The
    three are not mutually exclusive and the entry models all three as separate
    hypothesis groups rather than picking one. Which is correct determines what a
    therapeutic target would even be: the fusion machinery, the chaperonin
    system, or mtDNA replication.
  attaches_to:
  - "pathophysiology#Loss of Cytosolic MSTO1 Protein"
  - "pathophysiology#Failure of TRiC Chaperonin Assembly"
  - "pathophysiology#Unrestrained RAD51 Binding to Mitochondrial DNA"
  proposed_experiments:
  - experiment_id: msto1-tric-replication-in-patient-cells
    name: Independent replication of the TRiC assembly result in patient fibroblasts
    description: >-
      Measure TRiC/CCT subunit levels and assembly intermediates in the
      established panel of MSTO1 patient fibroblast lines in a second
      laboratory, with peer review, before the proteostasis model is treated as
      more than a lead.
  - experiment_id: msto1-tric-substrate-screen
    name: Identify the TRiC substrate that links proteostasis to mitochondrial morphology
    description: >-
      Screen TRiC substrates for one whose depletion reproduces mitochondrial
      fragmentation, given that tubulin and actin were explicitly excluded, to
      supply the missing intermediate in the proteostasis model.
  - experiment_id: msto1-rad51-in-patient-fibroblasts
    name: Test the MSTO1-RAD51 interaction in patient rather than cancer cells
    description: >-
      Assay mitochondrial RAD51 occupancy on mtDNA in MSTO1 patient fibroblasts
      and ask whether inhibiting mitochondrial RAD51 rescues mtDNA content, which
      would establish whether the RAD51 route operates in the human disease.
  evidence:
  - reference: PMID:42539026
    reference_title: "MSTO1 functions as a TRiC assembly factor linking cytosolic proteostasis to mitochondrial function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using rapid depletion of MSTO1, we found that mitochondrial fragmentation appears only after six days."
    explanation: The kinetic observation that puts the canonical ordering in question.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "further suggests that impairments in mitochondrial dynamics are upstream of mtDNA depletion in MSTO1 patient fibroblasts"
    explanation: The canonical ordering, stated by its proponents on the basis of rescue kinetics.
- discussion_id: msto1-no-animal-model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why has no vertebrate animal model of MSTO1 deficiency been reported, and
    what does its absence prevent?
  rationale: >-
    A literature search on 2026-08-01 across all 32 PubMed records for MSTO1
    found no mouse, zebrafish or other vertebrate model of MSTO1 loss. The
    non-vertebrate precedents are informative but distant: null mutations of
    misato in Drosophila cause irregular chromosome segregation, and disruption
    of DML1 in Saccharomyces cerevisiae impairs mtDNA inheritance and
    mitochondrial segregation - and it is notable that the yeast phenotype is
    about mtDNA, which prefigures the human depletion finding by nearly two
    decades. But neither organism has a cerebellum, skeletal muscle of the
    mammalian type, or a neurosensory retina, so the three affected tissues in
    this disorder are unmodelled. The consequence is concrete: every
    tissue-level causal edge in this entry - from mtDNA depletion to muscle
    degeneration, to cerebellar hypoplasia, to retinal degeneration - is an
    inference from fibroblast biology plus clinical observation, with no in vivo
    corroboration in any species. There is also no preclinical platform on which
    any therapeutic idea could be tested.
  attaches_to:
  - "pathophysiology#Dystrophic Degeneration of Skeletal Muscle Fibres"
  - "pathophysiology#Cerebellar Hypoplasia and Cortical Atrophy"
  - "pathophysiology#Retinal Degeneration with Pigmentary Change"
  proposed_experiments:
  - experiment_id: msto1-mouse-knockout
    name: Constitutive and conditional Msto1 knockout mouse
    description: >-
      Generate a germline null and, if it is embryonic lethal, muscle-specific
      and Purkinje-cell-specific conditional knockouts, and phenotype muscle
      histology, cerebellar volume, retinal structure and mtDNA content in each
      tissue - the experiment that would test the tissue-level causal edges this
      entry currently infers.
  - experiment_id: msto1-zebrafish-mutant
    name: Stable germline msto1 zebrafish mutant
    description: >-
      Create a CRISPR germline mutant and assess mitochondrial network
      morphology in muscle, motor behaviour, cerebellar development and retinal
      structure, providing a tractable vertebrate system for modifier and
      compound screens.
  notes: >-
    The Drosophila misato and yeast DML1 results referred to in the rationale
    are described in the introductions of PMID:28554942 and PMID:31604776 as
    citations to primary work from 1997 and 2002 that is not itself cached here.
    They are therefore recorded in this rationale rather than quoted as evidence
    snippets, and no `animal_models:` block is asserted for this entry.

  - preferred_term: MSTO1
    term:
      id: hgnc:29678
      label: MSTO1
  cellular_components:
  - preferred_term: mitochondrial nucleoid
    modifier: ABNORMAL
    term:
      id: GO:0042645
      label: mitochondrial nucleoid
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
  notes: >-
    Scope caveat. PMID:42098462 is a cancer-biology paper: the mechanistic work
    is in tumour and cultured cell models and the clinical bioinformatics arm
    uses TCGA. It contains no patient with an MSTO1-related myopathy. It is
    curated here because it is direct experimental evidence about the molecular
    activity of the disease protein at the mitochondrial genome, but the
    cGAS-STING inflammatory arm in particular has never been looked for in a
    patient with this disorder and is not asserted as part of the human disease.

    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic loss-of-function variants in MSTO1 manifest clinically with a remarkably consistent phenotype of childhood-onset muscular dystrophy, corticospinal tract dysfunction and early-onset non-progressive cerebellar atrophy."
    explanation: Names corticospinal tract dysfunction as one of the three core components of the phenotype.
  - reference: PMID:33612823
    reference_title: "A novel homozygous MSTO1 mutation in Ashkenazi Jewish siblings with ataxia and myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often with upper motor neuron signs and varied cognitive impairment"
    explanation: Independent confirmation that upper motor neuron signs are a recurrent feature rather than a single-cohort observation.
- name: Retinal Degeneration with Pigmentary Change
  biological_scale: TISSUE
  description: >-
    The retinal component is the feature that names the MONDO and Orphanet terms
    and simultaneously the least consistent part of the phenotype. Where it is
    present it is a genuine retinal dystrophy: widespread salt-and-pepper
    pigmentation, macular atrophy, mottled hypoautofluorescence and loss of the
    ellipsoid zone on multimodal imaging in a Chinese sibling pair followed for
    seventeen years, and pigmentary retinopathy with pallor of the disc and
    concentric visual field constriction, but preserved visual acuity, in the
    index patient of the first recessive series (PMID:28544275). Both probands
    of the report that gave the syndrome its MONDO name (PMID:29339779) had
    pigmentary retinopathy. Yet it was reported in none of
    the fifteen patients of the largest cohort, where formal ophthalmological
    examination was not performed in every patient - so the true denominator is
    unknown and the discrepancy may be ascertainment rather than biology.
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  notes: >-
    The two cell types bound here are the cells whose degeneration produces the
    imaging phenotype described in PMID:40542878 (ellipsoid-zone loss is a
    photoreceptor readout; mottled hypoautofluorescence and salt-and-pepper
    pigmentation are retinal pigment epithelium readouts). No histopathology of
    an MSTO1 patient retina exists, so the cell-type assignment is inferred from
    the imaging modality rather than demonstrated.
  evidence:
  - reference: PMID:29339779
    reference_title: "Novel recessive mutations in MSTO1 cause cerebellar atrophy with pigmentary retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing in two unrelated patients showing cerebellar atrophy, intellectual disability, and pigmentary retinopathy."
    explanation: The report that established pigmentary retinopathy as part of the MSTO1 phenotype and gave the MONDO term its name.
  - reference: PMID:40542878
    reference_title: "Seventeen-year follow-up of mitochondrial myopathy and ataxia in a Chinese family: case reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmic multimodal imaging examination revealed typical characteristics of retinal dystrophy in both patients, including binocular widespread salt-and-pepper pigmentation, macular atrophy, a mottled pattern of hypoautofluorescence, and degeneration of the ellipsoid zone."
    explanation: The most detailed retinal characterisation available, and the source of the cell-layer inference recorded in this node's notes.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmological examination revealed the presence of pigmentary retinopathy with papillary pallor, associated with concentric restriction of the visual field but no abnormality of visual acuity."
    explanation: >-
      Shows the functional signature - field constriction with preserved acuity
      - that distinguishes this rod-predominant retinopathy from a maculopathy
      or an optic neuropathy.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding was not reported in any of the patients in our cohort; however, formal ophthalmologic examination was not pursued in all patients."
    explanation: >-
      The direct counter-evidence: zero of fifteen patients in the largest
      cohort, with the authors' own caveat that ophthalmological assessment was
      incomplete. This is why retinopathy is curated as inconstant rather than
      as a defining feature.
- name: Proximal Weakness with Restrictive Respiratory Compromise
  biological_scale: ORGANISM
  description: >-
    The organism-level expression of the muscle disease. Presentation is with
    hypotonia and delayed motor milestones between birth and three years,
    followed by independent but waddling, wide-based ambulation and
    predominantly proximal weakness that then remains relatively stable. Loss of
    respiratory muscle strength shows up as a reduced forced vital capacity
    before it produces symptoms, which is the argument for scheduled pulmonary
    function testing rather than symptom-triggered testing. A later-onset arm of
    the spectrum exists: a 2026 series reported diagnosis between 13 and 30
    years, and a separate 2026 case had adult-onset disease.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically presented with hypotonia and delayed motor milestones with first symptoms recognized between birth and three years of age."
    explanation: Establishes the age window and the presenting features of the muscle disease.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 15 patients reported either relatively slow progression or no progression of their muscle weakness."
    explanation: The natural-history claim that distinguishes this from the rapidly progressive congenital muscular dystrophies.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed reduced forced vital capacity (FVC) measurements, ranging from 60 to 79% predicted"
    explanation: Quantifies subclinical restrictive lung physiology in nine tested patients, which is the basis for routine spirometry.
- name: Ataxia, Dysmetria and Dysarthria
  biological_scale: ORGANISM
  description: >-
    The organism-level expression of the cerebellar lesion. In the largest
    cohort dysmetria was recorded in 11 of 15, gait ataxia in 9 of 15 and
    abnormal speech in 12 of 15, the last comprising speech delay in five and
    dysarthria in eight. Because the cerebellar atrophy is usually stable, these
    signs typically do not worsen substantially over time, and the functional
    trajectory of most patients is dominated by the muscle disease rather than
    by the cerebellar disease.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar symptoms manifested as dysmetria in 11, gait ataxia in nine and abnormal speech in 12, which included a history of speech delay in five and dysarthria in eight patients, respectively."
    explanation: The per-sign denominators for the cerebellar phenotype in the only cohort large enough to provide them.
mechanistic_hypotheses:
- hypothesis_group_id: msto1_fusion_first
  hypothesis_label: Fusion failure is the primary lesion and mtDNA depletion is downstream of it
  status: CANONICAL
  description: >-
    The standard model, held since the first recessive families were described
    in 2017 and restated by every clinical group that has reported the disorder
    since. Loss of cytosolic
    MSTO1 impairs mitochondrial fusion; the fragmented, poorly distributed
    network then fails to distribute the mtDNA replication machinery and to
    segregate nucleoids, and mtDNA content falls. The strongest direct argument
    for the ordering comes from rescue kinetics in patient fibroblasts:
    re-expressing wild-type MSTO1 fully restores mitochondrial and lysosomal
    morphology by 48 hours but only partially restores mtDNA, which is what one
    expects if the genome defect is the later, downstream event. The model is
    also supported by analogy, since the same fusion-to-depletion relationship
    is established for MFN2 and OPA1. Its weakness is that the connecting steps
    have never been demonstrated in MSTO1 cells, and that a cytosolic protein
    with no demonstrated enzymatic activity is an odd fusion factor.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "further suggests that impairments in mitochondrial dynamics are upstream of mtDNA depletion in MSTO1 patient fibroblasts"
    explanation: The authors' own statement of the causal ordering, based on the differential recovery kinetics after rescue.
  - reference: PMID:28554942
    reference_title: "MSTO1 is a cytoplasmic pro-mitochondrial fusion protein, whose mutation induces myopathy and ataxia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSTO1 likely has a physiologically relevant role in mitochondrial morphogenesis by supporting mitochondrial fusion."
    explanation: The canonical functional assignment for the protein.
- hypothesis_group_id: msto1_tric_proteostasis
  hypothesis_label: MSTO1 is a TRiC/CCT chaperonin assembly factor and the mitochondrial phenotype is secondary to a cytosolic proteostasis defect
  status: EMERGING
  description: >-
    Proposed in a 2026 preprint that has not been peer reviewed. Rapid,
    auxin-induced degradation of MSTO1 lowers TRiC within two days while
    mitochondrial fragmentation does not appear until day six; early TRiC
    assembly subcomplexes accumulate in the absence of MSTO1; MSTO1
    co-immunoprecipitates with TRiC; TRiC is reduced in patient fibroblasts; and
    depleting TRiC alone is sufficient to fragment mitochondria. If confirmed,
    this reverses the direction of the canonical model and would make
    MSTO1-related disease a cytosolic chaperonopathy with a mitochondrial
    readout. It would also predict phenotypic overlap with CCT-subunit disorders
    that has not yet been looked for clinically. It is recorded as EMERGING
    rather than ALTERNATIVE because it currently rests on one unreviewed
    preprint from one laboratory.
  evidence:
  - reference: PMID:42539026
    reference_title: "MSTO1 functions as a TRiC assembly factor linking cytosolic proteostasis to mitochondrial function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our findings identify MSTO1 as a TRiC assembly factor and connect mitochondrial defects caused by MSTO1-depletion to the loss of TRiC."
    explanation: The authors' summary statement of the hypothesis.
  - reference: PMID:42539026
    reference_title: "MSTO1 functions as a TRiC assembly factor linking cytosolic proteostasis to mitochondrial function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSTO1 patient-derived fibroblasts have fragmented mitochondria and a striking loss of mtDNA."
    explanation: >-
      Confirms that the model is being built against the same cellular phenotype
      that defines the human disease, rather than against an unrelated cell
      system.
- hypothesis_group_id: msto1_rad51_mtdna
  hypothesis_label: MSTO1 restrains RAD51 at the mitochondrial genome and its loss depletes mtDNA directly
  status: EMERGING
  description: >-
    Proposed in 2026 from cancer cell models. MSTO1 binds RAD51 through a
    conserved FxxA motif and restrains its mitochondrial, but not its nuclear,
    activity; losing MSTO1 increases RAD51 occupancy on mtDNA, disrupts mtDNA
    replication and depletes the genome. This would make the mtDNA phenotype a
    direct consequence of MSTO1 loss rather than a sequela of fragmentation, and
    it is not mutually exclusive with the fusion model - both could contribute.
    The principal limitation is that the work is entirely in cancer and cultured
    cell systems, with no patient material, and that the accompanying
    cGAS-STING inflammatory arm has never been sought in a patient.
  evidence:
  - reference: PMID:42098462
    reference_title: "MSTO1 modulates RAD51 activity to safeguard mitochondrial DNA integrity and control immune responses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of MSTO1 impairs mitochondrial membrane potential, reduces mtDNA content, and increases susceptibility to oxidative stress."
    explanation: Shows that MSTO1 loss reproduces the patient mtDNA phenotype in a system where the proposed direct mechanism was mapped.
genetic:
- name: MSTO1
  association: Bi-allelic loss-of-function variants; no recurrent founder allele; a single reported dominant family was subsequently shown to carry its variant in the MSTO2P pseudogene
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MSTO1
    term:
      id: hgnc:29678
      label: MSTO1
  notes: >-
    Nomenclature and locus. HGNC:29678 is symbol MSTO1, "misato mitochondrial
    distribution and morphology regulator 1", at 1q22, Entrez 55154, Ensembl
    ENSG00000125459, UniProt Q9BUK6, with alias symbols FLJ10504, LST005, MST and
    misato (HGNC REST API, retrieved 2026-08-01). The reference transcript used
    consistently across the clinical literature is NM_018116.3.

    The MSTO2P pseudogene problem, which is a practical laboratory issue and not
    only a historical curiosity. MSTO2P (HGNC:26329, verified against the HGNC
    REST API on 2026-08-01, which returns symbol MSTO2P, name "misato family
    member 2, pseudogene", locus_type "pseudogene", locus 1q22) is not a
    processed pseudogene: PMID:31463572 places it in a roughly 240 kb tandem
    segmental duplication at 1q22 arising from a duplication event in the human
    lineage, with 99.5% exonic nucleotide identity to MSTO1. That identity
    means short-read alignments can place pseudogene reads on the parent gene and
    vice versa. This is exactly what happened to the family reported as the first
    dominant MSTO1 case: the c.22G>A (p.Val8Met) variant was later confirmed by
    the original authors to lie in MSTO2P. Any laboratory reporting a
    heterozygous MSTO1 variant, and particularly a variant near the 5' end of the
    gene, should confirm that the read alignment is not pseudogene-derived before
    issuing a report.

    Allelic architecture. Reported alleles span the protein and include missense
    (for example p.Arg256Gln, p.Arg279His, p.Asp236His, p.Asp236Gly, p.Phe217Leu,
    p.Thr324Ile, p.Arg191Trp, p.Arg256Trp, p.Pro479Ser, p.Ala243Pro,
    p.Leu468Gln, p.Glu447Lys), frameshift (p.Gly420ValfsTer2), nonsense
    (p.Gln27*), splice-acceptor (c.1099-1G>A) and start-loss (c.1A>G, p.M1?)
    changes, together with at least one multi-exon intragenic deletion covering
    exons 7 to 14. Variant names in this note are transcribed from the abstracts
    of the cached references and are recorded here rather than as evidence
    snippets because each comes from a different paper. Because a copy-number
    allele can be one of the two hits, an exome that finds a single heterozygous
    MSTO1 variant in a compatible phenotype should be followed by
    deletion/duplication analysis rather than closed.

    Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense
    Z) are not recorded anywhere in this entry because no cached source consulted
    here reports them and they must not be written from memory. No ClinGen
    gene-disease validity classification could be retrieved (see the entry-level
    notes), so the gene-disease relationship is typed CAUSATIVE on the strength
    of the published families - at least 20 independent families across the
    cited reports, with segregation, patient-cell functional data and rescue -
    rather than on a curated external assertion. No modifier locus, methylation
    episignature, founder allele or somatic mechanism has been established.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present extensive phenotypic and genetic data from 12 independent families, including 15 new patients harbouring a broad array of bi-allelic MSTO1 pathogenic variants"
    explanation: >-
      The largest single body of gene-disease evidence - twelve independent
      families with bi-allelic variants and matching functional data.
  - reference: PMID:37431815
    reference_title: "Answer to Gerber et al. \"Autosomal recessive pathogenic MSTO1 variants in hereditary optic atrophy\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but also confirm finding of Gerber et al that the mutation is in MSTO2p pseudogene"
    explanation: >-
      The original authors' own confirmation that the variant underlying the
      reported dominant family lies in MSTO2P and not in MSTO1. This is the
      single most important genetic correction for this disease and the reason
      no dominant mode is asserted.
  - reference: PMID:31604776
    reference_title: "Novel biallelic variants in MSTO1 associated with mitochondrial myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with disease-associated variants in MSTO1 present with biallelic variants suggesting autosomal recessive inheritance; however, one family has been reported with a single variant and presumed autosomal dominant inheritance."
    explanation: >-
      Documents the pre-2023 balance of evidence, in which a single family stood
      against all others, and identifies precisely which claim was later
      overturned.
  - reference: PMID:31604776
    reference_title: "Novel biallelic variants in MSTO1 associated with mitochondrial myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletion encompassing exons 7-14 of MSTO1"
    explanation: Establishes that an intragenic copy-number deletion can constitute the second allele, which drives the diagnostic recommendation above.
phenotypes:
- name: Muscle weakness
  category: Musculoskeletal
  diagnostic: true
  description: >-
    Predominantly proximal weakness is the most constant clinical feature and
    usually the presenting one. Onset is between birth and three years in most
    patients, with hypotonia and delayed motor milestones; independent
    ambulation is generally achieved but with a waddling, wide-based gait.
    Progression is slow or absent, so this behaves as a static or very slowly
    progressive myopathy rather than as a relentlessly progressive dystrophy.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
    clinical_course: STABLE
  frequency: VERY_FREQUENT
  notes: >-
    Frequency band derived from an explicit count: at last examination all 15
    patients in PMID:31463572 had predominantly proximal weakness, and all four
    patients in PMID:41653646 exhibited myopathy of variable severity.
    VERY_FREQUENT (80-99%) rather than OBLIGATE because the total published
    denominator is around 30 and no systematic ascertainment has been done.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically presented with hypotonia and delayed motor milestones with first symptoms recognized between birth and three years of age."
    explanation: Documents the presenting features and the age window.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 15 patients reported either relatively slow progression or no progression of their muscle weakness."
    explanation: Supports both the near-universal frequency and the STABLE clinical course qualifier.
  - reference: PMID:41653646
    reference_title: "MSTO1-related mitochondrial myopathy and ataxia syndrome: Case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients exhibited myopathy of variable severity."
    explanation: Independent 2026 replication of the near-universal myopathy in a separate four-patient series.
- name: Muscular dystrophy
  category: Musculoskeletal
  diagnostic: true
  description: >-
    Muscle histology in this disorder is dystrophic rather than merely
    myopathic, which is diagnostically important because it sends the workup
    towards the congenital muscular dystrophy panel rather than towards a
    mitochondrial panel. Biopsies show variation in fibre size, internalised
    nuclei, whorled fibres and mild necrosis with regeneration. Importantly the
    conventional oxidative histochemical markers of mitochondrial myopathy were
    absent where they were sought, so a normal COX and SDH stain does not
    exclude the diagnosis.
  phenotype_term:
    preferred_term: Muscular dystrophy
    term:
      id: HP:0003560
      label: Muscular dystrophy
  notes: >-
    No frequency band is asserted. Muscle biopsy was performed in 10 of 15
    patients in PMID:31463572 and all were dystrophic, but a 10/15 denominator
    reflects who was biopsied rather than who has the pathology, and biopsy in
    the era of first-line genome sequencing is increasingly selective.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies were performed in ten patients and were consistent with a dystrophic process"
    explanation: Establishes the dystrophic character of the muscle pathology in the largest series.
  - reference: PMID:31130378
    reference_title: "A novel case of MSTO1 gene related congenital muscular dystrophy with progressive neurological involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive mutations in the MSTO1 gene, encoding for a mitochondrial distribution and morphology regulator, have been recently described in a very limited number of patients with multisystem involvement, mostly characterized by myopathy or dystrophy, cerebellar ataxia, pigmentary retinopathy and raised creatine kinase levels."
    explanation: Summarises the histological spectrum from myopathic to frankly dystrophic across reported patients.
- name: Elevated creatine kinase
  category: Metabolic
  diagnostic: true
  description: >-
    A raised serum creatine kinase is the most useful single screening
    abnormality. Levels in the largest cohort ranged from 300 to 5000 U/L and
    were increased in 14 of 15 patients, so a normal creatine kinase makes the
    diagnosis less likely but does not exclude it. Combined with brisk reflexes
    and a wide-based gait in a child with proximal weakness, a raised creatine
    kinase is the pattern that should prompt sequencing.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  frequency: VERY_FREQUENT
  notes: >-
    Frequency band derived directly from the quoted count of 14 of 15 patients
    (93%) in PMID:31463572, which falls in the VERY_FREQUENT (80-99%) band.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum creatine kinase (CK) levels were significantly increased in all patients, except for P15, ranging from 300 to 5000 U/L."
    explanation: Both the numerator/denominator for the frequency band and the reported concentration range.
  - reference: PMID:31604776
    reference_title: "Novel biallelic variants in MSTO1 associated with mitochondrial myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing revealed elevated plasma creatine kinase, and electromyogram results were consistent with longstanding generalized myopathy."
    explanation: Independent confirmation in a separately reported adult patient.
- name: Cerebellar atrophy
  category: Neurologic
  diagnostic: true
  description: >-
    Cerebellar atrophy or hypoplasia involving the vermis and both hemispheres
    is the imaging hallmark. It is present early - four patients in the largest
    cohort were imaged before age two and already showed significantly reduced
    cerebellar volume - and in most patients it does not progress on repeat
    imaging, which distinguishes it from most acquired and many genetic
    cerebellar degenerations. A minority of reports describe progression.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  frequency: VERY_FREQUENT
  notes: >-
    Frequency band derived from an explicit count: 12 of 12 patients imaged in
    PMID:31463572. VERY_FREQUENT rather than OBLIGATE because only 12 of the 15
    patients in that cohort had imaging available, and because PMID:41653646
    reported MRI evidence of cerebellar atrophy in only one of four patients -
    a discrepancy that is itself notable and that argues against treating the
    cerebellar lesion as obligate.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "involving the vermis and both hemispheres in all 12"
    explanation: The 12/12 denominator and the anatomical distribution.
  - reference: PMID:41653646
    reference_title: "MSTO1-related mitochondrial myopathy and ataxia syndrome: Case series and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging evidence of cerebellar atrophy was noted in Patient 3."
    explanation: >-
      Marked PARTIAL because in this four-patient 2026 series cerebellar atrophy
      was noted in only one patient, which is the counterweight to the 12/12
      figure and the reason the band is not OBLIGATE.
- name: Ataxia
  category: Neurologic
  diagnostic: true
  description: >-
    Cerebellar signs are the second clinical pillar of the syndrome. Gait ataxia
    was present in 9 of 15 patients in the largest cohort and dysmetria in 11 of
    15. Because the underlying cerebellar atrophy is usually stable, the ataxia
    is typically non-progressive; the exceptions are the reported cases with
    progressive cerebellar involvement and the adult-onset progressive case.
  phenotype_term:
    preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
  frequency: FREQUENT
  notes: >-
    Frequency band derived from the explicit count of gait ataxia in 9 of 15
    patients (60%) in PMID:31463572, which falls in the FREQUENT (30-79%) band.
    Dysmetria at 11 of 15 is curated as a separate phenotype below.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar symptoms manifested as dysmetria in 11, gait ataxia in nine and abnormal speech in 12, which included a history of speech delay in five and dysarthria in eight patients, respectively."
    explanation: Provides the numerator and denominator for the frequency band.
  - reference: PMID:36468072
    reference_title: "Indentification of novel MSTO1 compound heterozygous mutations in a Chinese family with recessive cerebellar atrophy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we reported two siblings with progressive cerebellar atrophy and ataxia in a Chinese family."
    explanation: Independent replication, and one of the reports describing a progressive rather than a static cerebellar course.
- name: Dysmetria
  category: Neurologic
  description: >-
    Appendicular cerebellar dysfunction, recorded in 11 of 15 patients in the
    largest cohort and the most frequently detected cerebellar sign in that
    series - more common than gait ataxia, which means examination of limb
    coordination is a higher-yield test than observing gait in this disorder.
  phenotype_term:
    preferred_term: Dysmetria
    term:
      id: HP:0001310
      label: Dysmetria
  frequency: FREQUENT
  notes: >-
    Frequency band derived from the explicit count of 11 of 15 (73%) in
    PMID:31463572, in the FREQUENT (30-79%) band.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT

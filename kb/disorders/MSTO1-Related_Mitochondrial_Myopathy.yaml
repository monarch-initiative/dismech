    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Furthermore, MSTO1 deficiency triggers BAX/BAK-dependent mtDNA leakage, activating the cGAS-STING pathway and driving inflammatory responses."
    explanation: >-
      A potentially important innate-immune consequence. Marked PARTIAL because
      it is shown only in cancer cell models and no inflammatory phenotype has
      been reported in any patient with MSTO1-related disease.
  downstream:
  - target: mtDNA Depletion and Nucleoid Reorganisation
    causal_link_type: DIRECT
    hypothesis_groups:

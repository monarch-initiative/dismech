- name: Absence of seizures, cataract, deafness and cardiac involvement
  category: Neurologic
  description: >-
    A deliberately negative phenotype entry, because what this disorder does NOT
    do is diagnostically load-bearing. None of the 15 patients in the largest
    cohort had seizures, cataracts, hearing loss or cardiac involvement, and
    echocardiography was normal in all 11 who underwent it. This separates MSTO1
    disease from Marinesco-Sjogren syndrome (cataract), from Kearns-Sayre
    syndrome and other mtDNA disorders (cardiac conduction disease,
    sensorineural deafness), and from the encephalopathic mtDNA depletion
    syndromes (seizures). It also means routine cardiac surveillance, which is
    standard in most muscular dystrophies, has no established indication here.

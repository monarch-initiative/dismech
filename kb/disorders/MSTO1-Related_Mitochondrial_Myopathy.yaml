      label: chaperonin-containing T-complex
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  notes: >-
    Evidence status matters here and is stated rather than implied.
    PMID:42539026 is a bioRxiv preprint (posted 2026-07-23) and has not been
    peer reviewed; it is the sole source for this node. It is included because
    it is the only work that proposes a concrete molecular activity for MSTO1
    and because its temporal-ordering experiment is a direct test of the
    canonical model, but no clinical or diagnostic claim in this entry depends
    on it, and the node is grouped under an EMERGING hypothesis rather than
    placed on the canonical causal path.

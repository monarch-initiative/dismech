histopathology:
- name: Dystrophic muscle with increased variability in fibre diameter
  description: >-
    Muscle biopsies in ten patients of the largest cohort were consistent with a
    dystrophic process, with variation in fibre type size, mild necrosis and
    regeneration, internalised nuclei and whorled fibres. The oxidative
    histochemical hallmarks of mitochondrial myopathy - ragged red fibres and
    cytochrome c oxidase negative fibres - were not present where they were
    sought, and the earlier 2017 recessive series explicitly recorded no oxidative
    histochemical defect in COX or SDH. A pathologist reading this biopsy
    without genetic information would report a congenital muscular dystrophy,
    not a mitochondrial myopathy.
  finding_term:
    preferred_term: Dystrophic muscle with increased variability in fibre diameter, internalised nuclei, whorled fibres and mild necrosis with regeneration
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies were performed in ten patients and were consistent with a dystrophic process"
    explanation: The histological conclusion from ten biopsies.
imaging_findings:
- name: Cerebellar atrophy and hypoplasia of vermis and hemispheres on brain MRI
  modality: MRI
  imaging_finding_term:
    preferred_term: Cerebellar atrophy or hypoplasia of vermis and both hemispheres
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  located_in:
    preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  laterality: BILATERAL
  description: >-
    Brain MRI is the single most informative imaging study. Moderate to severe
    cerebellar atrophy or hypoplasia involving the vermis and both hemispheres
    was present in all twelve patients imaged in the largest cohort, four of
    whom were imaged before age two. Repeat imaging in four patients confirmed
    no progression, with only one patient showing mild progression between ages
    one and six. Supratentorial white matter signal change has been reported in
    individual patients but is not a consistent feature.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "involving the vermis and both hemispheres in all 12"
    explanation: Establishes the distribution and the 12/12 imaging denominator.
- name: Selective pattern of muscle involvement on lower-limb muscle MRI
  modality: MRI
  imaging_finding_term:
    preferred_term: Selective fatty replacement of thigh muscles with relative sparing of semimembranosus and biceps femoris
  located_in:
    preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  description: >-
    Muscle MRI shows a distinct and potentially recognisable pattern. In the
    largest cohort, imaging in four patients ranged from severe fatty
    replacement of all upper-leg muscles except semimembranosus and biceps

    snippet: "Bi-allelic loss-of-function variants in MSTO1 manifest clinically with a remarkably consistent phenotype of childhood-onset muscular dystrophy, corticospinal tract dysfunction and early-onset non-progressive cerebellar atrophy."
    explanation: States the early-onset, non-progressive character of the cerebellar atrophy for the cohort as a whole.

- name: Dystrophic Degeneration of Skeletal Muscle Fibres
  biological_scale: TISSUE
  description: >-
    Muscle is the tissue in which MSTO1 loss produces the most consistent
    structural damage. Biopsies show a dystrophic rather than a purely myopathic
    process: variation in fibre size, internalised nuclei, whorled fibres, and a
    mild degree of necrosis and regeneration, with electron microscopy in
    earlier reports showing increased subsarcolemmal and intermyofibrillar
    mitochondria with lipid and glycogen accumulation. Notably the classical
    oxidative histochemical stigmata of mitochondrial myopathy - ragged red
    fibres, cytochrome c oxidase negative fibres - were absent in the cases
    where they were sought, consistent with the biochemical dissociation node
    above. Ongoing fibre necrosis and regeneration is what produces the raised
    creatine kinase, which is the single most useful screening abnormality in
    this disorder.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT

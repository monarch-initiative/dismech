    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "fragments were devoid of mitochondrial genomes in patient cells"
    explanation: >-
      The distribution failure made concrete: some organelle fragments have no
      genome at all, which is the expected consequence of losing fusion-mediated
      content mixing.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this novel link to mtDNA depletion in patient fibroblasts suggests that MSTO1-deficiency should also be considered a mtDNA depletion syndrome"
    explanation: The nosological consequence drawn by the authors of the largest cohort - that MSTO1 deficiency belongs among the mtDNA depletion syndromes.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT

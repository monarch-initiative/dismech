    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cerebellar lesion is present from early childhood and often before age
      two, so at least part of it is developmental rather than degenerative; how
      mtDNA depletion produces a hypoplastic cerebellum is not known.
  - target: Corticospinal Tract Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Long descending motor axons are among the most energetically demanding
      structures in the nervous system and are a recurrent target in
      mitochondrial dynamics disorders, but no pathological material from an
      MSTO1 patient's spinal cord exists.
  - target: Retinal Degeneration with Pigmentary Change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptors and retinal pigment epithelium have among the highest
      oxidative demands of any tissue. The link is inconstant across cohorts,
      which is itself curated as a knowledge gap.
  - target: Dissociation Between mtDNA Depletion and Respiratory Chain Function
    causal_link_type: DIRECT
    description: >-
      The depletion is real but, in most patients studied, is not accompanied by
      the respiratory chain deficiency that mtDNA depletion syndromes usually
      produce. That dissociation is modelled explicitly rather than ignored.
- name: Dissociation Between mtDNA Depletion and Respiratory Chain Function
  biological_scale: CELLULAR
  description: >-
    A patient with MSTO1 disease usually does not look biochemically like a
    classical mitochondrial patient. Lactate is normal, respiratory chain
    complex activities in muscle homogenate are normal or near normal, and
    fibroblast respiration measured by micro-oxygraphy is normal, even though
    mtDNA is reduced and the network is fragmented. What is abnormal is citrate
    synthase activity, which is markedly low and indexes mitochondrial mass
    rather than mitochondrial function, so the coherent reading is that these
    cells have fewer, poorly distributed mitochondria carrying less mtDNA rather
    than mitochondria that respire badly. This matters diagnostically: a normal
    mitochondrial biochemical screen does not exclude the diagnosis, and it is a
    large part of why the disorder was reached by exome sequencing rather than
    by metabolic workup. The dissociation is not absolute - the 2026 adult-onset
    case did show reduced membrane potential and respiratory capacity - and that
    exception is carried here rather than hidden.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:

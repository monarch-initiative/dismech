name: MSTO1-Related Mitochondrial Myopathy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
  term:
    id: MONDO:0044714
    label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
description: >-
  Mitochondrial myopathy and ataxia (MMYAT) is an ultra-rare disorder caused by
  bi-allelic loss-of-function variants in MSTO1, the gene encoding misato
  homolog 1. Unusually for a mitochondrial disease gene, MSTO1 is not a
  mitochondrial resident enzyme: it is a soluble cytosolic protein, distantly
  related to the tubulin/FtsZ GTPase superfamily, that acts at the interface
  between the cytosol and the mitochondrial outer membrane to support
  mitochondrial fusion, network continuity and organelle distribution. Loss of
  the protein produces a stereotyped cellular triad in patient fibroblasts -
  absent or strongly reduced MSTO1, a fragmented mitochondrial network, and
  depletion of mitochondrial DNA with reorganisation of mtDNA nucleoids - which
  is why MSTO1 deficiency has been proposed as a mitochondrial DNA depletion
  syndrome even though the disease was first described as a disorder of
  mitochondrial dynamics.

  Clinically the core is neuromuscular rather than encephalopathic: early-onset,
  largely non-progressive proximal weakness with dystrophic muscle histology and
  a raised creatine kinase, cerebellar atrophy or hypoplasia that is present
  from early childhood and manifests as dysmetria, gait ataxia and dysarthria,
  and corticospinal tract signs. Skeletal features (scoliosis, pectus
  excavatum), restrictive lung physiology and learning difficulties without
  major cognitive impairment are common. The pigmentary retinopathy that names
  the MONDO and Orphanet terms is a genuine but inconstant feature: it was
  central to the two probands whose report gave the syndrome its name,
  and a Chinese sibling pair followed for seventeen years shows a well
  characterised retinal dystrophy, yet it was reported in none of the fifteen
  patients of the largest published cohort, in which formal ophthalmological
  examination was not universally performed. This entry therefore treats
  retinopathy as an important but non-obligate component rather than as a
  defining criterion.

  Two things about this entity are contested and are curated as such rather than
  smoothed over. First, inheritance: the single family that established a
  dominant mode was subsequently shown to carry its variant in the MSTO2P
  pseudogene rather than in MSTO1, and every other reported family is
  bi-allelic, so autosomal recessive is the only mode this entry asserts.
  Second, mechanism: whether mtDNA depletion is downstream of failed fusion,
  downstream of a direct MSTO1-RAD51 interaction at the mitochondrial genome, or
  downstream of a cytosolic proteostasis defect (MSTO1 as an assembly factor for
  the TRiC/CCT chaperonin) is unresolved, and all three routes are modelled
  explicitly as competing hypothesis groups.
parents:
- Mitochondrial Disease
synonyms:
- MMYAT
- mitochondrial myopathy and ataxia
- mitochondrial myopathy-cerebellar atrophy-pigmentary retinopathy syndrome
- MSTO1-related mitochondrial myopathy and ataxia syndrome
- MSTO1-related myopathy
- MSTO1-RD
- misato homolog 1 deficiency
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The morbidity of this disorder is almost entirely neuromuscular and
      neurological: a dystrophic myopathy with proximal weakness, congenital or
      early-childhood cerebellar atrophy with ataxia and dysarthria, and
      corticospinal tract signs. The skeletal deformities (scoliosis, pectus
      excavatum) and the restrictive respiratory physiology are secondary to the
      myopathy rather than independent organ disease, and the retinopathy is a
      lesion of the neurosensory retina. Cardiac, hepatic, renal and endocrine
      involvement have not been established (echocardiography was normal in all
      11 patients screened in the largest cohort), so a single NEUROLOGIC
      chapter assignment is correct. Endocrine and psychiatric features that
      appear in the OMIM/HPO annotation set for this disease derive from the
      family whose variant was later localised to the MSTO2P pseudogene and are
      deliberately not carried here; see the entry-level notes.
    evidence:
    - reference: PMID:31463572
      reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bi-allelic loss-of-function variants in MSTO1 manifest clinically with a remarkably consistent phenotype of childhood-onset muscular dystrophy, corticospinal tract dysfunction and early-onset non-progressive cerebellar atrophy."
      explanation: Defines the phenotype of the largest cohort as a muscular dystrophy plus two central-nervous-system components, which is the basis for the NEUROLOGIC assignment.
notes: >-
  Entity verification. Before any content was written, the target term was
  confirmed with OAK on 2026-08-01: `runoak -i sqlite:obo:mondo info
  MONDO:0044714 -O obo` gives name "mitochondrial myopathy-cerebellar
  ataxia-pigmentary retinopathy syndrome", xrefs OMIM:617675, Orphanet:502423,
  MEDGEN:1620960, UMLS:C4540096, GARD:0017934, synonym "MMYAT", and
  `is_a MONDO:0009637` (inborn mitochondrial myopathy). `runoak -i
  sqlite:obo:mondo relationships -p RO:0004003 MONDO:0044714` returns exactly one
  gene, HGNC:29678 MSTO1. HGNC:29678 was independently confirmed against the HGNC
  REST API as symbol MSTO1, name "misato mitochondrial distribution and
  morphology regulator 1", locus 1q22, Entrez 55154, Ensembl ENSG00000125459,
  UniProt Q9BUK6, alias symbols FLJ10504, LST005, MST and misato (retrieved
  2026-08-01). The alias list matters for reading the literature: the founding
  cell-biology paper (PMID:17349998) calls the protein "Misato" throughout and
  never uses the string MSTO1.

  NEC preflight. Every one of the 32 PubMed records returned for the query
  `MSTO1` on 2026-08-01 was inspected. MSTO1 is the dominant and usually the only
  disease gene named in the clinical papers used here; there is no competing gene
  in this literature. Four records were audited and rejected as not bearing on
  this disorder: PMID:42388255 and PMID:41503457 (a glucocorticoid-induced ocular
  hypertension GWAS and its preprint, in which MSTO1 appears only as a locus
  annotation), PMID:40646730 (a mud-crab weight-trait GWAS), PMID:23047795 (a
  prostate-radiotherapy fatigue expression study), and PMID:37565517, which is an
  FDX2 rhabdomyolysis case report that mentions MSTO1 only in differential
  discussion. PMID:39129082 (renal-cell-carcinoma prognostic signature) was
  likewise excluded. No named-entity confusion risk was identified: the disorder
  has no eponym, and its acronym MMYAT is unique in MONDO.

  The dominant-inheritance claim, and why it is not asserted here. This is the
  single most important correction in the entry. Gal et al 2017 (PMID:28554942)
  reported a Hungarian family with a heterozygous c.22G>A (p.Val8Met) change and
  titled their conclusion "the first dominant mutation in MSTO1". Gerber et al
  (PMID:37431816) subsequently raised concerns about that variant, and in their
  reply (PMID:37431815) the original authors confirmed that the mutation lies in
  the MSTO2P pseudogene (HGNC:26329, verified against the HGNC REST API on
  2026-08-01) rather than in MSTO1. EMBO Molecular Medicine published a
  corresponding erratum to the 2017 paper (PMID:37431817). The practical
  consequences are followed through consistently in this entry: (i) only
  autosomal recessive inheritance is asserted; (ii) the clinical features unique
  to that family - schizophrenia, depression, anxiety, hyperthyroidism, raised
  prolactin, primary amenorrhoea, multiple lipomas, mandibular prognathia,
  hearing impairment - are NOT curated as phenotypes of this disorder even though
  they remain in the HPO annotation set for OMIM:617675; and (iii) the
  cell-biology results of PMID:28554942 that do not depend on the patients'
  genotype (siRNA silencing of MSTO1 in HeLa cells, subcellular localisation,
  interaction with the fusion machinery) are still cited, tagged IN_VITRO, while
  its patient-fibroblast results are not used to support any claim about this
  disease.

  Contaminated annotation source, flagged not propagated. The HPO annotation set
  retrieved from https://ontology.jax.org/api/network/annotation/OMIM:617675 on
  2026-08-01 lists both HP:0000007 (Autosomal recessive inheritance) and
  HP:0000006 (Autosomal dominant inheritance), together with HP:0100753
  Schizophrenia, HP:0000716 Depression, HP:0000739 Anxiety, HP:0000836
  Hyperthyroidism, HP:0000870 Increased circulating prolactin concentration,
  HP:0000786 Primary amenorrhea and HP:0001012 Multiple lipomas. Those
  annotations trace to the Hungarian family described above. They are recorded
  here as an upstream data-quality observation and are not reproduced as
  phenotypes or as an inheritance mode. No file outside this entry was edited.

  Structured-source evidence was unavailable. `data/orphadata/` and
  `data/clingen/` in this checkout contain only `MANIFEST.yaml` with no
  downloaded payload, and no `references_cache/ORPHA_502423.md` or MSTO1-bearing
  `CGGV_*` cache file exists, so neither an Orphanet prevalence class nor a
  ClinGen gene-disease-validity classification could be consulted or quoted. This
  is recorded as a gap, not as an assertion that no such classification exists.
  Per the scope rules the manifests were not touched.

  No GeneReviews chapter was found. A PubMed search on 2026-08-01 for
  `MSTO1 AND GeneReviews[All Fields]` returned no records, so no GeneReviews
  phenotype baseline was available to this curation and the phenotype list is
  assembled from the primary cohorts instead. This records the result of that
  search, not an assertion that no such chapter exists.

  Frequency bands. `frequency:` is asserted only where a published denominator
  exists in a cached source - chiefly the 15-patient cohort of PMID:31463572,
  which reports explicit counts. Where the only support is an aggregate statement
  across the literature, the band is omitted and the count is recorded in the
  phenotype `notes:` instead. Total published experience is small enough (31-33
  cases as of 2025-2026) that a single reclassified patient moves most features
  across a band boundary.

  Cohort arithmetic. Two recent reviews give slightly different literature
  totals: PMID:40542878 (2025) counts 33 confirmed cases across 11 articles up to
  2025, while PMID:42051546 (2026) states 31 cases reported globally. Both are
  quoted verbatim in `prevalence:` rather than reconciled into a single number,
  because the difference reflects different inclusion decisions (most obviously
  whether the MSTO2P family is counted) that neither paper spells out in its
  abstract. PMID:41653646 adds four further patients from three families in 2026.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging MSTO1 alleles, in the great majority of
    reported families as compound heterozygous missense, truncating or
    splice-site variants, and in at least one Ashkenazi Jewish family as a
    homozygous missense variant. Heterozygous parents are unaffected, and the
    largest cohort makes that point explicitly as an argument about mechanism:
    haploinsufficiency for MSTO1 does not produce disease. Penetrance in
    bi-allelic individuals appears complete on present evidence and is recorded
    as such, with the caveat that the total published experience is around 30
    patients and no unaffected bi-allelic individual has been sought
    systematically in population databases.

    The historically competing dominant mode is deliberately not asserted. It
    rested on a single family whose variant was later shown to lie in the MSTO2P
    pseudogene; see the entry-level notes and the `msto1-dominant-claim-retracted`
    discussion. Reviews published between 2018 and 2019 that describe "both
    autosomal dominant and recessive modes" predate that correction, and the 2018
    statement is quoted below as evidence of the state of the field at the time
    rather than as a current claim.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  evidence:
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here the first families carrying recessive variants in the MSTO1 gene: compound heterozygous mutations were identified in two sisters and in an unrelated singleton case, who presented a multisystem complex phenotype mainly characterized by myopathy and cerebellar ataxia."
    explanation: The first demonstration of recessive transmission at this locus, in three probands from two families.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present extensive phenotypic and genetic data from 12 independent families, including 15 new patients harbouring a broad array of bi-allelic MSTO1 pathogenic variants"
    explanation: Fifteen patients from twelve independent families, all bi-allelic, is the strongest single body of evidence for recessive inheritance.
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since haploinsufficiency, as is present in some of the heterozygous parents in our cohort, does not cause a clinical phenotype"
    explanation: >-
      Establishes that a single damaged MSTO1 allele is tolerated, which is the
      genetic argument against a simple loss-of-function dominant mechanism and
      the reason carrier parents need no surveillance.
  - reference: PMID:33612823
    reference_title: "A novel homozygous MSTO1 mutation in Ashkenazi Jewish siblings with ataxia and myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report confirms that MSTO1 mutations are typically recessive, and associated with clinical phenotypes characterized by early-onset muscle impairment and ataxia, often with upper motor neuron signs and varied cognitive impairment."
    explanation: An independent group's explicit statement of the recessive conclusion, based on a homozygous family.
  - reference: PMID:41653646
    reference_title: "MSTO1-related mitochondrial myopathy and ataxia syndrome: Case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report clinical and genetic features in four patients from 3 independent families with an ultra-rare autosomal recessive myopathy associated with biallelic pathogenic or likely pathogenic variants in MSTO1."
    explanation: The most recent case series, in 2026, still describes the disorder as autosomal recessive and bi-allelic.
  - reference: PMID:29339779
    reference_title: "Novel recessive mutations in MSTO1 cause cerebellar atrophy with pigmentary retinopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Both autosomal dominant and recessive modes of inheritance have been suggested."
    explanation: >-
      Marked PARTIAL because it documents the state of the field in 2018, before
      the dominant family's variant was localised to the MSTO2P pseudogene. It
      is quoted to show that the ambiguity was real and contemporaneous, not to
      support a dominant mode.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate of any kind has been published for this
    disorder, and no Orphanet epidemiology record was reachable from this
    checkout, so the class is NOT_YET_DOCUMENTED rather than a numeric or
    qualitative band and `rate_per_100000` is deliberately left empty. What is
    available is a case count. A 2025 ophthalmological review counted 33
    confirmed cases across 11 published articles; a 2026 report states 31 cases
    reported globally; a 2022 case report put the figure at 31 patients. A 2026
    Mayo Clinic series adds four more patients from three families. The
    discrepancy between the counts is not resolved in any of the abstracts and
    is left visible here. Most reports state no ancestry for their patients at
    all, so no geographic distribution should be read off the author
    affiliations. Where ancestry is stated it is heterogeneous - the ethnicity
    row of the largest cohort lists Caucasian, African, Chinese,
    Caucasian/Hispanic and Native American across its fifteen patients, one
    patient of the 2017 recessive series is recorded as of British Caucasian
    descent, and separate reports describe Chinese families and one Ashkenazi
    Jewish sibship - which is consistent with ascertainment through
    neuromuscular and exome-sequencing referral networks rather than with any
    population restriction. No founder allele has been established.
  evidence:
  - reference: PMID:40542878
    reference_title: "Seventeen-year follow-up of mitochondrial myopathy and ataxia in a Chinese family: case reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A literature review was conducted, analysing the data from 11 published articles encompassing 33 confirmed cases of MMYAT up to 2025."
    explanation: The highest published case count, from a 2025 systematic literature review of the disorder.
  - reference: PMID:42051546
    reference_title: "Mild-cerebellar ataxia due to impaired mitochondrial function caused by the MSTO1 variations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in MSTO1 are linked to a rare mitochondrial disorder characterized by early-onset myopathy and cerebellar ataxia, with 31 cases reported globally to date, which underscores its exceptional rarity."
    explanation: >-
      A second, slightly lower literature count published a year later. Marked
      PARTIAL because it disagrees with the 2025 review's total of 33 and neither
      source explains the difference.
pathophysiology:
- name: Bi-allelic Loss-of-Function Variants in MSTO1
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to MSTO1 at 1q22, reported against
    transcript NM_018116.3. The allelic spectrum is broad and includes missense
    substitutions across the length of the protein, frameshift and nonsense
    alleles, a start-loss allele, splice-acceptor variants and at least one
    multi-exon intragenic deletion, and there is no recurrent founder allele.
    The functional consequence converges regardless of allele class: in every
    patient fibroblast line assayed to date the MSTO1 protein is absent or
    strongly reduced, so the disease behaves as a loss of protein rather than as
    a set of allele-specific effects. Heterozygous parents are unaffected, so
    one intact allele suffices.
  genes:
  - preferred_term: MSTO1
    term:
      id: hgnc:29678
      label: MSTO1
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present extensive phenotypic and genetic data from 12 independent families, including 15 new patients harbouring a broad array of bi-allelic MSTO1 pathogenic variants"
    explanation: Establishes both the bi-allelic requirement and the breadth of the allelic spectrum.
  - reference: PMID:31604776
    reference_title: "Novel biallelic variants in MSTO1 associated with mitochondrial myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletion encompassing exons 7-14 of MSTO1"
    explanation: >-
      Documents that one of the two alleles can be an intragenic copy-number
      deletion rather than a sequence variant, which is the diagnostic reason a
      negative exome does not exclude the disorder.
  downstream:
  - target: Loss of Cytosolic MSTO1 Protein
    causal_link_type: DIRECT
    description: >-
      Truncating, frameshift, start-loss and deletion alleles remove the coding
      capacity outright; the missense alleles tested behave as
      protein-destabilising rather than as separation-of-function changes, so
      both classes converge on absence of the protein.
- name: Loss of Cytosolic MSTO1 Protein
  biological_scale: MOLECULAR
  description: >-
    MSTO1 is a soluble cytosolic protein, not a mitochondrial matrix or
    inner-membrane resident, and this is the feature that makes the disorder
    mechanistically unusual among mitochondrial diseases. Its localisation was
    initially reported as the mitochondrial outer membrane, but two later groups
    working independently on patient material and on transfected cells placed it
    predominantly in the cytosol, interacting with the outer-membrane fusion
    machinery from the cytosolic face rather than residing in the organelle. The
    protein carries a region homologous to the tubulin/FtsZ GTPase superfamily,
    the same fold family used for chromosome segregation in eukaryotes and for
    organelle division in bacteria and algae, but no GTPase activity has been
    demonstrated for the human protein and its molecular activity remained
    undefined until 2026. In patient fibroblasts the protein is undetectable by
    western blot in every line examined in the largest series, and strongly
    reduced in the others, so this node is the convergence point of the whole
    allelic spectrum.
  genes:
  - preferred_term: MSTO1
    term:
      id: hgnc:29678
      label: MSTO1
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  - preferred_term: mitochondrial outer membrane
    modifier: ABNORMAL
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  notes: >-
    Localisation is a genuine, unresolved disagreement in the primary
    literature and is presented as such rather than harmonised. Kimura and Okano
    (PMID:17349998) fractionated mitochondria and assigned Misato to the outer
    membrane. Gal et al (PMID:28554942) explicitly contradicted that result, and
    Nasca et al (PMID:28544275) independently found the protein to be mainly
    cytosolic. The weight of evidence favours a cytosolic protein that acts at
    the outer-membrane interface, which is how this entry models it, but the two
    outer-membrane and cytosolic evidence items below are both retained so the
    disagreement stays visible.
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSTO1 protein was not detectable in the cultured fibroblasts of all seven patients evaluated, suggesting that pathogenic variants result in a loss of protein expression and/or affect protein stability."
    explanation: Demonstrates that the disease-causing genotypes converge on absence of the protein, in seven independent patient lines.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that MSTO1 is mainly a cytosolic protein."
    explanation: Independent assignment of the protein to the cytosol rather than to the organelle.
  - reference: PMID:28554942
    reference_title: "MSTO1 is a cytoplasmic pro-mitochondrial fusion protein, whose mutation induces myopathy and ataxia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At variance with a previous report, we find MSTO1 to be localized in the cytoplasmic area with limited colocalization with mitochondria."
    explanation: >-
      The explicit contradiction of the earlier outer-membrane assignment. Cited
      for its cell-biology result only; the patient-genotype claims of this paper
      were later corrected and are not used anywhere in this entry.
  - reference: PMID:28554942
    reference_title: "MSTO1 is a cytoplasmic pro-mitochondrial fusion protein, whose mutation induces myopathy and ataxia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSTO1 interacts with the fusion machinery as a soluble factor at the cytoplasm-mitochondrial outer membrane interface."
    explanation: Places the protein's site of action at the cytosolic face of the outer membrane, which is the topology this entry models.
  - reference: PMID:17349998
    reference_title: "Human Misato regulates mitochondrial distribution and morphology."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Further experiments of fractionating mitochondria revealed that Misato was localized to the outer membrane."
    explanation: >-
      The original outer-membrane assignment, retained as PARTIAL because two
      subsequent groups could not reproduce it and reported a predominantly
      cytosolic distribution.
  downstream:
  - target: Impaired Mitochondrial Fusion and Network Fragmentation
    causal_link_type: DIRECT
    hypothesis_groups:
    - msto1_fusion_first
    description: >-
      The canonical route. Without MSTO1 at the cytosol-outer-membrane
      interface, fusion events fall and the network fragments; this is the
      oldest and most reproduced observation in the field.
  - target: Failure of TRiC Chaperonin Assembly
    causal_link_type: DIRECT
    hypothesis_groups:
    - msto1_tric_proteostasis
    description: >-
      The 2026 proteostasis route. On this model the proximate consequence of
      losing MSTO1 is not a mitochondrial event at all but failure to assemble
      the cytosolic chaperonin TRiC, with the mitochondrial phenotype following
      later.
  - target: Unrestrained RAD51 Binding to Mitochondrial DNA
    causal_link_type: DIRECT
    hypothesis_groups:
    - msto1_rad51_mtdna
    description: >-
      The 2026 genome-maintenance route. On this model MSTO1 restrains RAD51 at
      the mitochondrial genome, and losing it disrupts mtDNA replication
      directly rather than through the fusion machinery.
- name: Impaired Mitochondrial Fusion and Network Fragmentation
  biological_scale: CELLULAR
  description: >-
    Mitochondria are maintained as a dynamic, partly continuous reticulum by
    balanced fusion and fission. Fusion allows content mixing - complementation
    of damaged mtDNA and proteins between organelles - and its failure leaves a
    population of small, isolated, functionally isolated fragments. Every
    patient fibroblast line examined across four independent groups shows a
    fragmented mitochondrial network, and in one series the fragments coexist
    with abnormally enlarged structures. The effect is MSTO1-dependent in both
    directions: acute knockdown of MSTO1 in HeLa cells reproduces the
    fragmentation, over-expression of the protein drives the opposite phenotype
    of perinuclear mitochondrial aggregation, and re-expression of wild-type
    MSTO1 in patient cells restores the network. Loss of network continuity also
    degrades organelle distribution - the property for which the gene is named -
    which is expected to matter most in the long, highly polarised cells of
    muscle and the cerebellum.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: mitochondrial fusion
    modifier: DECREASED
    term:
      id: GO:0008053
      label: mitochondrial fusion
  - preferred_term: mitochondrion distribution within the cell
    modifier: ABNORMAL
    term:
      id: GO:0048312
      label: intracellular distribution of mitochondria
  cellular_components:
  - preferred_term: mitochondrion
    modifier: ABNORMAL
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:31463572
    reference_title: "MSTO1 mutations cause mtDNA depletion, manifesting as muscular dystrophy with cerebellar involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with impaired mitochondrial fusion, mitochondrial networks in fibroblasts were found to be fragmented."
    explanation: Fragmentation confirmed across the seven patient lines of the largest cohort.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies in patients' fibroblasts revealed that MSTO1 protein levels were strongly reduced, the mitochondrial network was fragmented, and the fusion events among mitochondria were decreased"
    explanation: >-
      Couples the morphological readout to a direct measurement of fusion
      events, which is what makes this a fusion defect rather than merely an
      altered shape.
  - reference: PMID:33612823
    reference_title: "A novel homozygous MSTO1 mutation in Ashkenazi Jewish siblings with ataxia and myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that MSTO1 protein level was reduced and that mitochondrial network was fragmented or formed enlarged structures"
    explanation: Independent replication in a homozygous genotype, with the additional observation of enlarged as well as fragmented structures.
  - reference: PMID:28554942
    reference_title: "MSTO1 is a cytoplasmic pro-mitochondrial fusion protein, whose mutation induces myopathy and ataxia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Short-term silencing of MSTO1 in HeLa cells reproduced the impairment of mitochondrial morphology and dynamics observed in the fibroblasts without damaging bioenergetics."

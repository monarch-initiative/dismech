- name: Corticospinal Tract Dysfunction
  biological_scale: TISSUE
  description: >-
    An upper motor neuron component sits alongside the myopathy and is easy to
    miss because weakness is usually attributed to the muscle disease. Increased
    tone, a spastic catch, clonus and brisk deep tendon reflexes were recorded
    in eight of fifteen patients in the largest cohort, and upper motor neuron
    signs are singled out in an independent report as part of the typical
    picture. Its presence is diagnostically useful: brisk reflexes in a child
    with a dystrophic myopathy and a high creatine kinase point away from a
    pure muscular dystrophy and towards a central component.

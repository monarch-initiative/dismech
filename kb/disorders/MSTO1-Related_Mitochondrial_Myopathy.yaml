      contradicting line is exactly the sort of finding that should stay visible.
- name: Enlarged Lysosomal Vacuoles
  biological_scale: CELLULAR
  description: >-
    Markedly enlarged lysosomal vacuoles were found across all MSTO1 patient
    fibroblast lines in the largest series, a finding not previously reported in
    the context of MSTO1 dysfunction. Mitochondrial and lysosomal compartments
    are functionally coupled, and lysosomal enlargement is a recurring accompaniment
    of mitochondrial dysfunction, but for MSTO1 the connecting steps are
    undetermined and the finding has not yet been replicated by another group.
    It is curated because it recovered on re-expression of wild-type MSTO1 on the
    same timescale as mitochondrial morphology, which argues it is a genuine
    consequence of losing the protein rather than a culture artefact.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast

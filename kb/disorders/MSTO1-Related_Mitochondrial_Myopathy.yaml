    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our biochemical analyses were not indicative of a mitochondrial disorder: patients showed normal lactate levels, and hardly any defect of MRC complex activities or cell respiration"
    explanation: The clearest statement that the standard mitochondrial biochemical screen is normal in this disorder.
  - reference: PMID:28544275
    reference_title: "Recessive mutations in MSTO1 cause mitochondrial dynamics impairment, leading to myopathy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we detected markedly low activity of citrate synthase and reduced mtDNA amount, suggesting a reduction in mitochondrial mass."
    explanation: >-
      Reframes the abnormality as reduced mitochondrial mass rather than reduced
      per-mitochondrion function, which is the interpretation this node encodes.
  - reference: PMID:28554942
    reference_title: "MSTO1 is a cytoplasmic pro-mitochondrial fusion protein, whose mutation induces myopathy and ataxia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Short-term silencing of MSTO1 in HeLa cells reproduced the impairment of mitochondrial morphology and dynamics observed in the fibroblasts without damaging bioenergetics."
    explanation: Acute MSTO1 depletion fragments the network without a bioenergetic penalty, which is the experimental counterpart of the clinical dissociation.
  - reference: PMID:42051546
    reference_title: "Mild-cerebellar ataxia due to impaired mitochondrial function caused by the MSTO1 variations."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Functional studies revealed significantly reduced MSTO1 protein expression, mtDNA depletion, and impaired mitochondrial function, as reflected by decreased mitochondrial membrane potential and respiratory capacity, suggesting a pathogenic role for these variants."

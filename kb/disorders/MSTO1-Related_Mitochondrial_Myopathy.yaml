- name: Unrestrained RAD51 Binding to Mitochondrial DNA
  biological_scale: MOLECULAR
  description: >-
    A second 2026 account, this one placing MSTO1 directly at the mitochondrial
    genome. In cancer cell models MSTO1 interacts with the recombinase RAD51
    through a conserved FxxA motif and restrains its activity specifically
    within mitochondria, without affecting RAD51's nuclear functions. When MSTO1
    is lost, RAD51 binding to mtDNA increases, mtDNA replication is disrupted
    and mtDNA damage accumulates, membrane potential falls and mtDNA content
    drops. The same work reports that mtDNA then leaks to the cytosol through a
    BAX/BAK-dependent route and activates cGAS-STING signalling, which would
    give MSTO1 deficiency an innate-immune arm. This route would explain mtDNA
    depletion without requiring the fusion defect as an intermediate, and it is
    therefore modelled as a competing hypothesis rather than as an addition to
    the canonical chain.

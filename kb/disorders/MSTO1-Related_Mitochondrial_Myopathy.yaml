- name: Failure of TRiC Chaperonin Assembly
  biological_scale: MOLECULAR
  description: >-
    An alternative account of what MSTO1 actually does, published as a preprint
    in July 2026 and not yet peer reviewed. Using auxin-inducible degradation to
    strip MSTO1 from cells within hours, the authors found that TRiC (the
    chaperonin-containing T-complex, CCT), the essential cytosolic ATP-dependent
    chaperonin that folds actin, tubulin and a large set of other substrates,
    falls within two days, whereas mitochondrial fragmentation does not appear
    until day six. Early TRiC assembly subcomplexes accumulate when MSTO1 is
    absent, MSTO1 co-immunoprecipitates with TRiC, and TRiC is also reduced in
    MSTO1 patient fibroblasts. Critically, knocking down TRiC on its own is
    sufficient to fragment mitochondria, and does so without measurable changes
    in tubulin or actin. If this holds, the ordering of the whole pathograph
    changes: the mitochondrial phenotype becomes a downstream consequence of a
    cytosolic proteostasis defect rather than the primary lesion, and MSTO1
    becomes a chaperonin assembly factor that happens to have been discovered
    through a mitochondrial phenotype.

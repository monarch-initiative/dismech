datasets:
- accession: ega:EGAS00001000085
  title: Linking genes, genomic instability and molecular subgroups in medulloblastoma
  description: Brain tumors are the second most common pediatric cancer and carry the highest mortality rates in this age group. Medulloblastoma is the most frequent malignant brain tumor of childhood. Recent studies indicate that medulloblastoma comprises at least four sub-entities (SHH-signaling, WNT-signaling, Group-C, Group-D) that differ in molecular alterations, cell of origin, clinicopathological features and outcome. Further characterization of the entire spectrum of genomic alterations underlying the formation of these distinct groups is urgently needed to identify diagnostic and prognostic biomarkers for clinical management and uncover novel therapeutic targets.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WGS
  publication: PMID:22265402
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Medulloblastoma"); description-level mentions were not accepted. EGA study_type: Whole Genome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000273
  title: Stratifying and Targeting Pediatric Medulloblastoma through Genomics
  description: 'In this project, genomic analyses of pediatric medulloblastoma samples, obtained through the international medulloblastoma consortium, will be performed. RNA and miRNA expression profiles of 1000 samples, representing all four subgroups (Wnt, Shh, Group C, and D), will be studied to identify novel subtypes within each subgroup. The resulting subtype-specific expression profiles will support the development of reliable and robust biomarkers to more accurately and reliably classify medulloblastomas for treatment in clinical trials. For that purpose, two assays will be developed: an antibody-based immunohistochemical assay and an orthogonal nucleic acid-based hybridization assay.'

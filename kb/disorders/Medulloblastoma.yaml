  description: 'Archer TC, Ehrenberger T, Mundt F, Gold MP, Krug K, Mah CK, Mahoney EL, Daniel CJ, LeNail A, Ramamoorthy D, Mertins P, Mani DR, Zhang H, Gillette MA, Clauser K, Noble M, Tang LC, Francois JP, Silterra J, Jensen J, Tamayo P, Korshunov A, Pfister SM, Kool M, Northcott PA, Sears RC, Lipton JO, Carr SA, Mesirov JP, Pomeroy SL, Fraenkel E. Cancer Cell 2018. There is a pressing need to identify therapeutic targets in tumors with low mutation rates such as the malignant pediatric brain tumor medulloblastoma.'

phenotypes:
- category: Neurological
  name: Headache
  description: >-
    Headache from increased intracranial pressure due to obstructive
    hydrocephalus, typically worse in the morning. Common at presentation
    across molecular subgroups.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and nausea (39%)."
    explanation: In a cohort of 72 histologically proven medulloblastoma patients, headache was a presenting symptom in 60%, supporting headache as a common presenting feature of medulloblastoma.
- category: Neurological
  name: Ataxia
  description: >-
    Cerebellar ataxia reflecting tumor involvement of cerebellar structures;
    truncal with midline tumors, appendicular with lateral hemispheric tumors.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and nausea (39%)."
    explanation: In a cohort of 72 histologically proven medulloblastoma patients, ataxia was a presenting symptom in 40%, supporting cerebellar ataxia as a common presenting feature of medulloblastoma.
- category: Neurological
  name: Vomiting
  description: >-
    Vomiting from raised intracranial pressure, characteristically in the
    morning; a common presenting symptom across subgroups.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and nausea (39%)."
    explanation: In a cohort of 72 histologically proven medulloblastoma patients, vomiting was the single most common presenting symptom (67%), supporting vomiting as a hallmark presenting feature of medulloblastoma.
- category: Neurological
  name: Macrocephaly
  description: >-
    Increased head circumference in infants due to hydrocephalus from CSF
    obstruction; may be the presenting sign in young infants before other
    cerebellar signs emerge.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  evidence:
  - reference: PMID:22120270
    reference_title: "Surgical treatment of brain tumors in infants younger than six months of age and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children most often presented with a bulging fontanelle, hydrocephalus, or macrocephaly (seven patients)."
    explanation: In a surgical series of infant brain tumors that included primitive neuroectodermal tumor/medulloblastoma, macrocephaly (with bulging fontanelle and hydrocephalus) was the most common presenting sign, supporting macrocephaly from CSF obstruction as a presenting feature of medulloblastoma in young infants.
- category: Neurological
  name: Papilledema
  description: >-
    Optic-disc swelling from raised intracranial pressure; may produce
    visual symptoms if prolonged.
  phenotype_term:
    preferred_term: Papilledema
    term:
      id: HP:0001085
      label: Papilledema
  evidence:
  - reference: PMID:34055437
    reference_title: "Neuroophthalmic Manifestations of Intracranial Tumours in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Papilledema, ophthalmoparesis, and nystagmus were the most frequent ophthalmological signs."
    explanation: In a study of pediatric intracranial tumours (with medulloblastoma among the most frequent histopathological diagnoses), papilledema was the most frequent ophthalmological sign, supporting papilledema from raised intracranial pressure as a presenting sign of medulloblastoma.
treatments:
- name: Surgical Resection
  description: >-
    Maximal safe resection is the first-line treatment across molecular
    subgroups. Extent of resection is prognostic; near-total or gross-total
    resection is achievable in most cases.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Craniospinal Irradiation
  description: >-
    Craniospinal irradiation (CSI) is standard for medulloblastoma due to the
    risk of leptomeningeal dissemination. CSI is generally avoided in children
    <3 years to limit neurocognitive late effects, and dose-reduction trials
    are exploring lower-intensity CSI for the favorable-prognosis WNT
    subgroup.
  treatment_term:
    preferred_term: Craniospinal Irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
- name: Chemotherapy
  description: >-
    Multi-agent adjuvant chemotherapy is standard. In infants, intensive
    chemotherapy regimens are used to delay or avoid radiation; in the WNT
    subgroup, de-escalation trials are exploring reduced-intensity regimens.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: lomustine
      term:
        id: CHEBI:6520
        label: lomustine
notes: >-
  This entry is a parent / root-level dismech record for medulloblastoma
  organising the four molecular subgroups recognised under WHO 2021. Subgroup-
  specific pathophysiology, driver genetics, and subgroup-targeted therapy are
  curated in separate dismech files where available
  (`Medulloblastoma_WNT_Activated`, `Medulloblastoma_SHH_Activated`). Group 3
  and Group 4 entries are scoped as follow-up work.

name: Medulloblastoma
creation_date: '2026-05-12T00:00:00Z'
description: >-
  Medulloblastoma is an embryonal, malignant brain tumor that arises in the
  cerebellum and is the most common malignant pediatric posterior-fossa
  tumor. WHO CNS5 (2021) classifies medulloblastoma along two parallel axes.
  The **molecularly defined** axis recognises four entities: WNT-activated;
  SHH-activated and TP53-wildtype; SHH-activated and TP53-mutant (split into
  two separate entities because TP53 status carries markedly different
  prognosis); and non-WNT/non-SHH. The historical transcriptional Groups 3
  and 4 are retained under WHO 2021 as *provisional subtypes within
  non-WNT/non-SHH* rather than as top-level groups, alongside a set of
  provisional methylation subtypes. A parallel **histologically defined**
  axis recognises classic, desmoplastic/nodular, medulloblastoma with
  extensive nodularity (MBEN), and large-cell/anaplastic morphology, which
  retain independent prognostic weight. These groups differ in developmental
  cell of origin, driver alterations, age distribution, metastatic
  propensity, and prognosis. All share a posterior-fossa location,
  derivation from cerebellar/rhombic-lip progenitor populations, and a
  clinical syndrome dominated by raised intracranial pressure (headache,
  vomiting) and cerebellar dysfunction (ataxia). Standard care for children >3 years is
  maximal-safe resection followed by craniospinal irradiation and multi-agent
  chemotherapy; subgroup-specific de-escalation and targeted-therapy strategies
  (e.g., SHH-pathway inhibitors, WNT-subgroup radiation reduction) are active
  areas of investigation. Subgroup-specific molecular detail is curated in
  separate dismech entries (e.g., `Medulloblastoma_WNT_Activated`,
  `Medulloblastoma_SHH_Activated`); Group 3 and Group 4 are not yet curated.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Embryonal Tumor
- Molecularly Defined Tumor
has_subtypes:
- name: WNT
  display_name: WNT-Activated Medulloblastoma
  description: >-
    Approximately 10% of medulloblastomas. Driven by CTNNB1 exon 3 mutations
    or germline APC mutations. Best prognosis (>95% long-term survival);
    candidate for treatment de-escalation. Curated as
    `Medulloblastoma_WNT_Activated`.
- name: SHH
  display_name: SHH-Activated Medulloblastoma
  description: >-
    Approximately 30% of medulloblastomas. Driven by PTCH1/SMO/SUFU loss or
    GLI2/MYCN amplification. WHO 2021 splits this group into two distinct
    entities by TP53 status — SHH-activated and TP53-wildtype, and
    SHH-activated and TP53-mutant — because TP53-mutant tumours carry a
    markedly worse prognosis and are enriched for Li-Fraumeni syndrome.
    Bimodal age distribution (infants and adults). Curated as
    `Medulloblastoma_SHH_Activated`.
- name: Non-WNT/Non-SHH
  description: >-
    The fourth WHO 2021 molecularly defined entity, accounting for roughly
    60% of medulloblastomas and encompassing the historical transcriptional
    Groups 3 and 4, which WHO 2021 retains as provisional subtypes rather
    than separate entities. Not yet curated as a separate dismech entry.
- name: Group 3
  description: >-
    A provisional subtype within non-WNT/non-SHH under WHO 2021, not a
    top-level entity. Approximately 25% of medulloblastomas. MYC
    amplification is common; high metastatic rate and worst prognosis. Not
    yet curated as a separate dismech entry.
- name: Group 4
  description: >-
    A provisional subtype within non-WNT/non-SHH under WHO 2021, not a
    top-level entity. The most common single transcriptional group
    (approximately 35% of medulloblastomas). Heterogeneous drivers including
    MYCN amplification and SNCAIP duplication; intermediate prognosis. Not
    yet curated as a separate dismech entry.
pathophysiology:
- name: Cerebellar Progenitor Proliferation
  description: >-
    All molecular subgroups arise from progenitor populations of the
    developing cerebellum and rhombic lip, and converge on dysregulated
    proliferation, but they do not share a single cell of origin. SHH tumors
    derive from external-granule-layer granule-neuron precursors; WNT tumors
    from lower-rhombic-lip / dorsal brainstem progenitors; and Group 3 and
    Group 4 (non-WNT/non-SHH) tumors from rhombic-lip-derived progenitors,
    with Group 4 in particular linked to the unipolar brush cell lineage.
    The subgroup-specific oncogenic pathways (WNT/beta-catenin, Sonic
    Hedgehog, MYC-driven programs) feed a common proliferative phenotype
    across these distinct progenitor lineages. Cell Ontology currently has no
    class for unipolar brush cells or rhombic-lip progenitors, so the
    non-SHH lineages are bound to the generic neural progenitor cell class.
  evidence:
  - reference: PMID:35489737
    reference_title: "Molecular Stratification of Medulloblastoma: Clinical Outcomes and Therapeutic Interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medulloblastoma (MB) is the most common malignant pediatric posterior fossa"
    explanation: Establishes medulloblastoma as the most common malignant pediatric posterior-fossa tumor, anchoring the cerebellar-progenitor framing of the disease.
  cell_types:
  - preferred_term: cerebellar granule neuron precursor (SHH subgroup cell of origin)
    term:
      id: CL:0002362
      label: cerebellar granule cell precursor
  - preferred_term: rhombic lip-derived progenitor (WNT and non-WNT/non-SHH cell of origin)
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:

has_subtypes:
- name: WNT
  display_name: WNT-Activated Medulloblastoma
  curated_in: Medulloblastoma_WNT_Activated
  description: >-
    Approximately 10% of medulloblastomas. Driven by CTNNB1 exon 3 mutations
    or germline APC mutations, typically with chromosome 6 monosomy. Best
    prognosis (>90% long-term survival); candidate for treatment
    de-escalation. Curated in `Medulloblastoma_WNT_Activated`.
  evidence:
  - reference: PMID:35489737
    reference_title: "Molecular Stratification of Medulloblastoma: Clinical Outcomes and Therapeutic Interventions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "WNT is the least common subgroup with the best prognosis, characterized by nuclear β-catenin expression, mutations in Catenin beta-1 (CTNNB1), and chromosome 6 monosomy."
    explanation: Summarizes the molecular drivers and favorable prognosis of the WNT-activated subgroup.
- name: SHH
  display_name: SHH-Activated Medulloblastoma
  curated_in: Medulloblastoma_SHH_Activated
  description: >-
    Approximately 30% of medulloblastomas. Driven by PTCH1/SMO/SUFU loss or
    GLI1/GLI2/MYCN alterations. WHO 2021 splits this group into two distinct
    entities by TP53 status — SHH-activated and TP53-wildtype, and
    SHH-activated and TP53-mutant — because TP53-mutant tumours carry a
    markedly worse prognosis and are enriched for Li-Fraumeni syndrome.
    Bimodal age distribution (infants and adults). Curated in
    `Medulloblastoma_SHH_Activated`.
  evidence:
  - reference: PMID:28613723
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The 2021 World Health Organization (WHO) Classification categorizes medulloblastoma by molecular subgroup: WNT-activated, SHH-activated/TP53-wildtype, SHH-activated/TP53-mutant, and non-WNT/non-SHH (encompassing groups 3 and 4), incorporating integrated molecular-histologic diagnostics."
    explanation: Documents the WHO 2021 split of SHH-activated medulloblastoma by TP53 status alongside WNT-activated and non-WNT/non-SHH entities.
- name: Non-WNT/Non-SHH
  display_name: Non-WNT/Non-SHH Medulloblastoma (Groups 3 and 4)
  curated_in: Medulloblastoma_Non_WNT_Non_SHH
  description: >-
    The fourth WHO 2021 molecularly defined entity, accounting for roughly
    60% of medulloblastomas and encompassing the historical transcriptional
    Groups 3 (~25%, enriched for MYC amplification, high metastatic rate, and
    poorest prognosis) and Group 4 (~35%, enriched for PRDM6 enhancer
    hijacking, SNCAIP duplication, KDM6A mutation, and isochromosome 17q),
    which WHO 2021 retains as provisional subtypes alongside methylation
    subtypes I-VIII. Curated in `Medulloblastoma_Non_WNT_Non_SHH`.
  evidence:
  - reference: PMID:35489737
    reference_title: "Molecular Stratification of Medulloblastoma: Clinical Outcomes and Therapeutic Interventions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The third non-WNT/non-SHH MB (Group3/4) subgroup is genetically highly heterogeneous and displays several molecular patterns, including MYC and OTX2 amplification, GFI1B activation, KBTBD4 mutation, GFI1 rearrangement, PRDM6 enhancer hijacking, KDM6A mutation, LCA histology, chromosome 10 loss, isochromosome 17q, SNCAIP duplication, and CDK6 amplification."
    explanation: Details the genomic heterogeneity and recurrent alterations across the non-WNT/non-SHH (Group 3/4) entity.
stages:
- name: Modified Chang Metastatic Staging (M0-M4)
  description: >-
    Clinicoradiological staging based on postoperative cranial/spinal MRI and
    cerebrospinal fluid cytology: M0 indicates no subarachnoid or hematogenous
    metastasis, M1 microscopic tumor cells in CSF, M2 intracranial nodular
    seeding, M3 spinal subarachnoid seeding, and M4 extraneural metastasis.
  evidence:
  - reference: PMID:23245832
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The Modified Chang Staging System is still in use, but a number of other factors, including age, completeness of resection, histological subtype and genetic markers now contribute to treatment decisions and prognostication."
    explanation: Confirms continued clinical use of the Modified Chang Staging System integrated with resection status, age, histology, and molecular markers.
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients ultimately found to have MO disease were diagnosed more slowly (16.1 +/- 20 weeks) than those with M1 (7.3 +/- 5.3 weeks), M2 (6 +/- 5.3 weeks), or M3 disease (6.8 +/- 5.9 weeks) M0 vs. M1-3, P < 0.02)."
    explanation: Illustrates clinical M0-M3 metastatic staging in a consecutive cohort of 72 histologically proven medulloblastoma patients.
- name: Consensus Molecular-Clinical Risk Stratification
  description: >-
    Heidelberg consensus stratification for childhood medulloblastoma (ages
    3-17) defines four prognostic risk strata integrating molecular subgroup
    with metastatic stage and cytogenetics: low risk (>90% survival, e.g.
    non-metastatic WNT), standard/average risk (75-90% survival), high risk
    (50-75% survival, e.g. metastatic SHH or Group 4, or MYCN-amplified SHH),
    and very high risk (<50% survival, e.g. metastatic Group 3 or TP53-mutant
    SHH).
  evidence:
  - reference: PMID:27040285
    reference_title: "Risk stratification of childhood medulloblastoma in the molecular era: the current consensus."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The following risk groups were defined based on current survival rates: low risk (>90 % survival), average (standard) risk (75-90 % survival), high risk (50-75 % survival) and very high risk (<50 % survival) disease."
    explanation: Defines the four international consensus risk strata used to guide therapy intensity in childhood medulloblastoma.
pathophysiology:
- name: Cerebellar Progenitor Proliferation
  biological_scale: CELLULAR
  conforms_to: "sustaining_proliferative_signaling#Growth-Factor-Independent Proliferation"
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    All molecular subgroups arise from progenitor populations of the
    developing cerebellum and rhombic lip, and converge on dysregulated
    proliferation, but they do not share a single cell of origin. SHH tumors
    derive from external-granule-layer granule-neuron precursors; WNT tumors
    from lower-rhombic-lip / dorsal brainstem progenitors; and Group 3 and
    Group 4 (non-WNT/non-SHH) tumors from rhombic-lip-derived progenitors,
    with Group 4 in particular linked to the unipolar brush cell lineage.
    The subgroup-specific oncogenic pathways (WNT/beta-catenin, Sonic
    Hedgehog, MYC-driven programs) feed a common proliferative phenotype
    across these distinct progenitor lineages; while rare cases arise on a
    germline cancer-predisposition background (APC, SUFU, PTCH1, TP53), the
    neoplastic proliferation itself is driven by somatic clonal expansion in
    hindbrain progenitors. Cell Ontology includes CL:4023161 (unipolar brush
    cell), which represents the differentiated glutamatergic interneuron rather
    than the proliferative progenitor population, and has no rhombic-lip
    progenitor class, so the non-SHH progenitor lineages are bound to the
    generic neural progenitor cell class.
  evidence:
  - reference: PMID:35489737
    reference_title: "Molecular Stratification of Medulloblastoma: Clinical Outcomes and Therapeutic Interventions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Medulloblastoma (MB) is the most common malignant pediatric posterior fossa tumor."
    explanation: Establishes medulloblastoma as the most common malignant pediatric posterior-fossa tumor, anchoring the cerebellar-progenitor framing of the disease.
  - reference: PMID:28613723
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Classified as a World Health Organization (WHO) grade 4 embryonal tumor, medulloblastoma arises primarily in the posterior fossa, most often from the cerebellum."
    explanation: Confirms WHO grade 4 embryonal origin in the cerebellum within the posterior fossa.
  cell_types:
  - preferred_term: cerebellar granule neuron precursor (SHH subgroup cell of origin)
    term:
      id: CL:0002362
      label: cerebellar granule cell precursor
  - preferred_term: rhombic lip-derived progenitor (WNT and non-WNT/non-SHH cell of origin)
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: cerebellum development
    modifier: ABNORMAL
    term:
      id: GO:0021549
      label: cerebellum development
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: rhombic lip
    term:
      id: UBERON:0006215
      label: rhombic lip
  downstream:
  - target: Posterior Fossa Mass and Fourth Ventricular Outflow Obstruction
    causal_link_type: DIRECT
    description: >-
      Unchecked proliferation of cerebellar/rhombic-lip progenitors forms a
      rapidly expanding infratentorial mass in the cerebellum and fourth
      ventricle that compresses cerebellar parenchyma and blocks CSF outflow.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "They arise infratentorially in the cerebellum or fourth ventricle and hence the most common presenting symptoms are those associated with raised intracranial pressure."
      explanation: Links infratentorial embryonal tumor growth in the cerebellum or fourth ventricle to downstream mass effect and raised intracranial pressure.
  - target: Leptomeningeal Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ventricular and subarachnoid tumor shedding into cerebrospinal fluid
    description: >-
      Malignant embryonal cells shed into the fourth ventricular and
      subarachnoid CSF spaces and colonize the cranial and spinal
      leptomeninges (Chang M1-M3 stages).
    evidence:
    - reference: PMID:8756384
      reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients ultimately found to have MO disease were diagnosed more slowly (16.1 +/- 20 weeks) than those with M1 (7.3 +/- 5.3 weeks), M2 (6 +/- 5.3 weeks), or M3 disease (6.8 +/- 5.9 weeks) M0 vs. M1-3, P < 0.02)."
      explanation: Documents microscopic CSF (M1) and intracranial/spinal subarachnoid nodular (M2-M3) dissemination in consecutive medulloblastoma patients at presentation.
    - reference: PMID:31494131
      reference_title: "Medulloblastoma: Clinical presentation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the \"metastatic\" cluster, which associates altered status, initial metastases, hydrocephalus, and diagnostic delay."
      explanation: Pediatric cohort study delineating an initial metastatic presentation cluster in medulloblastoma.
- name: Posterior Fossa Mass and Fourth Ventricular Outflow Obstruction
  biological_scale: TISSUE
  description: >-
    Rapidly expanding tumor growth within the cerebellar vermis, cerebellar
    hemispheres, or fourth ventricle disrupts cerebellar motor coordination
    circuits and obstructs cerebrospinal fluid circulation through the fourth
    ventricle.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: fourth ventricle
    term:
      id: UBERON:0002422
      label: fourth ventricle
  evidence:
  - reference: PMID:23245832
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "They arise infratentorially in the cerebellum or fourth ventricle and hence the most common presenting symptoms are those associated with raised intracranial pressure."
    explanation: Establishes tumor growth in the cerebellum and fourth ventricle as the anatomical basis for cerebellar signs and CSF obstruction.
  - reference: PMID:31494131
    reference_title: "Medulloblastoma: Clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medulloblastomas present generally a-specifically as a fast-evolving posterior fossa tumor."
    explanation: Cohort of 91 pediatric cases characterizing medulloblastoma as a fast-evolving posterior fossa mass.
  downstream:
  - target: Obstructive Hydrocephalus and Increased Intracranial Pressure
    causal_link_type: DIRECT
    description: >-
      Fourth ventricular CSF outflow obstruction causes obstructive
      hydrocephalus and intracranial hypertension.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Advances in surgical techniques have allowed a greater attainment of the two primary surgical goals: restoring normal cerebrospinal fluid (CSF) flow and maximal tumour resection."
      explanation: Identifies CSF flow obstruction by the posterior fossa tumor as the direct driver of hydrocephalus requiring surgical CSF restoration.
  - target: Ataxia
    causal_link_type: DIRECT
    description: >-
      Direct invasion and compression of cerebellar vermian and hemispheric
      pathways impairs gait and limb coordination, producing cerebellar ataxia.
    evidence:
    - reference: ORPHA:616
      reference_title: "Medulloblastoma"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A rare embryonic tumor of the neuroepithelial tissue characterized clinically by increased intracranial pressure and cerebellar dysfunction, with the most common presenting symptoms being headache, vomiting, and ataxia."
      explanation: Directly connects cerebellar dysfunction from the posterior-fossa tumor to presenting ataxia.
  - target: Nystagmus
    causal_link_type: DIRECT
    description: >-
      Involvement of vestibulocerebellar and brainstem gaze-holding pathways by
      the posterior fossa mass produces nystagmus.
    evidence:
    - reference: PMID:34055437
      reference_title: "Neuroophthalmic Manifestations of Intracranial Tumours in Children."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Papilledema, ophthalmoparesis, and nystagmus were the most frequent ophthalmological signs."
      explanation: Pediatric intracranial tumor cohort (with medulloblastoma among the leading diagnoses) identifying nystagmus as a frequent neuro-ophthalmic manifestation.
- name: Obstructive Hydrocephalus and Increased Intracranial Pressure
  biological_scale: TISSUE
  description: >-
    Impaired CSF egress from the fourth ventricle causes ventricular dilation
    and constant intracranial hypertension, driving the classic morning
    headache-vomiting triad, papilledema, and in young infants with open
    cranial sutures, progressive macrocephaly and fontanelle bulging.
  locations:
  - preferred_term: fourth ventricle
    term:
      id: UBERON:0002422
      label: fourth ventricle
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  evidence:
  - reference: PMID:31494131
    reference_title: "Medulloblastoma: Clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intracranial hypertension was constant; we further observed that altered general status was common (16.5%) and correlated with a metastatic tumor."
    explanation: In 91 pediatric medulloblastoma observations, intracranial hypertension was a constant feature at presentation.
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: Ventricular CSF accumulation manifests clinically and radiographically as obstructive hydrocephalus.
    evidence:
    - reference: PMID:22120270
      reference_title: "Surgical treatment of brain tumors in infants younger than six months of age and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Children most often presented with a bulging fontanelle, hydrocephalus, or macrocephaly (seven patients)."
      explanation: Documents obstructive hydrocephalus at presentation in infants with intracranial tumors including medulloblastoma/PNET.
  - target: Increased intracranial pressure
    causal_link_type: DIRECT
    description: Ventricular outflow obstruction directly elevates intracranial pressure.
    evidence:
    - reference: ORPHA:616
      reference_title: "Medulloblastoma"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A rare embryonic tumor of the neuroepithelial tissue characterized clinically by increased intracranial pressure and cerebellar dysfunction, with the most common presenting symptoms being headache, vomiting, and ataxia."
      explanation: Establishes increased intracranial pressure as a defining clinical manifestation of medulloblastoma.
  - target: Headache
    causal_link_type: DIRECT
    description: Raised intracranial pressure stretches pain-sensitive dural and vascular structures, causing headache.
    evidence:
    - reference: ORPHA:616
      reference_title: "Medulloblastoma"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A rare embryonic tumor of the neuroepithelial tissue characterized clinically by increased intracranial pressure and cerebellar dysfunction, with the most common presenting symptoms being headache, vomiting, and ataxia."
      explanation: Connects increased intracranial pressure in medulloblastoma to presenting headache.
  - target: Vomiting
    causal_link_type: DIRECT
    description: Intracranial hypertension and fourth-ventricular floor compression stimulate the medullary emetic center, causing vomiting.
    evidence:
    - reference: PMID:8756384
      reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and nausea (39%)."
      explanation: Documents vomiting as the single commonest presenting symptom (67%) in 72 medulloblastoma patients.
  - target: Nausea
    causal_link_type: DIRECT
    description: Raised intracranial pressure and area postrema irritation produce nausea alongside vomiting.
    evidence:
    - reference: PMID:8756384
      reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and nausea (39%)."
      explanation: Documents nausea in 39% of medulloblastoma patients at presentation.
  - target: Macrocephaly
    causal_link_type: DIRECT
    description: In infants with unfused cranial sutures, obstructive hydrocephalus expands cranial circumference, producing macrocephaly.
    evidence:
    - reference: PMID:22120270
      reference_title: "Surgical treatment of brain tumors in infants younger than six months of age and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Children most often presented with a bulging fontanelle, hydrocephalus, or macrocephaly (seven patients)."
      explanation: Connects hydrocephalus in young infants with brain tumors to presenting macrocephaly.
  - target: Papilledema
    causal_link_type: DIRECT
    description: Elevated CSF pressure transmitted along the optic nerve sheath causes optic disc swelling (papilledema).
    evidence:
    - reference: PMID:34055437
      reference_title: "Neuroophthalmic Manifestations of Intracranial Tumours in Children."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Papilledema, ophthalmoparesis, and nystagmus were the most frequent ophthalmological signs."
      explanation: Documents papilledema as a leading neuro-ophthalmic sign of pediatric intracranial tumors including medulloblastoma.
- name: Leptomeningeal Dissemination
  biological_scale: ORGANISM
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    Medulloblastoma has a pronounced propensity to disseminate via the
    cerebrospinal fluid along the cranial and spinal leptomeninges (Chang

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients ultimately found to have MO disease were diagnosed more slowly (16.1 +/- 20 weeks) than those with M1 (7.3 +/- 5.3 weeks), M2 (6 +/- 5.3 weeks), or M3 disease (6.8 +/- 5.9 weeks) M0 vs. M1-3, P < 0.02)."
    explanation: Demonstrates frequent M1-M3 CSF/leptomeningeal metastasis at diagnosis and its association with rapid clinical progression.
  - reference: PMID:31494131
    reference_title: "Medulloblastoma: Clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the \"metastatic\" cluster, which associates altered status, initial metastases, hydrocephalus, and diagnostic delay."
    explanation: Identifies a clinical metastatic presentation cluster in pediatric medulloblastoma combining initial metastases, hydrocephalus, and altered general status.

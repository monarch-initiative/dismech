- accession: ega:EGAS00001000347
  title: Genetic landscape of pediatric Medulloblastoma
  description: Medulloblastoma is a heterogenous disease made up of at least four distinct subtypes of disease which appear to exploit and disrupt naturally occurring developmental pathways of cellular growth and hindbrain development. To better understand the driver mutations of this disease, we performed whole genome sequencing of 37 medulloblastomas and the corresponding normal DNA of the 37 affected children treated at St. Jude Children's Research Hospital. We have found several novel mutations which appear subtype specific. These mutations were checked for frequency in a separate tumor cohort of 56 children with medulloblastoma, also treated on the St.

diagnosis:
- name: Cranial and Spinal Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Pre- and postoperative contrast-enhanced cranial MRI defines the posterior
    fossa primary mass, hydrocephalus, and extent of residual tumor, while
    whole-spine MRI evaluates leptomeningeal drop metastases (M2/M3 staging).
  evidence:
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were staged by use of the operative findings, pre- and postoperative cranial computed tomography (CT) scans and, later in the series, cranial magnetic resonance imaging (MRI) studies and, for determination of the M stage, myelography, spinal MRI, and postoperative cerebrospinal fluid cytology."
    explanation: Establishes cranial and spinal MRI as standard diagnostic and metastatic staging modalities in medulloblastoma.
- name: Postoperative Cerebrospinal Fluid Cytology via Lumbar Puncture
  diagnosis_term:
    preferred_term: lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  description: >-
    Lumbar puncture for postoperative cerebrospinal fluid cytology detects
    microscopic leptomeningeal tumor dissemination (Chang M1 disease) not
    visible on neuroimaging.
  evidence:
  - reference: PMID:8756384
    reference_title: "Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at the time of diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were staged by use of the operative findings, pre- and postoperative cranial computed tomography (CT) scans and, later in the series, cranial magnetic resonance imaging (MRI) studies and, for determination of the M stage, myelography, spinal MRI, and postoperative cerebrospinal fluid cytology."
    explanation: Documents postoperative CSF cytology as an essential component of M-stage determination in medulloblastoma.
- name: Integrated Molecular Profiling and DNA Methylation Classification
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Integrated WHO CNS5 (2021) diagnosis combines histopathology with genome-wide
    DNA methylation profiling, copy-number analysis (e.g., MYC/MYCN amplification,
    chromosome 6 monosomy, isochromosome 17q), and targeted sequencing (CTNNB1,
    PTCH1, SUFU, SMO, TP53) to assign molecular subgroup and risk stratum.
  evidence:
  - reference: PMID:29539639
    reference_title: "DNA methylation-based classification of central nervous system tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a comprehensive approach for the DNA methylation-based classification of central nervous system tumours across all entities and age groups, and demonstrate its application in a routine diagnostic setting."
    explanation: Establishes routine diagnostic DNA methylation-based classification across CNS tumors including medulloblastoma molecular subgroups.
  - reference: PMID:28613723
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The 2021 World Health Organization (WHO) Classification categorizes medulloblastoma by molecular subgroup: WNT-activated, SHH-activated/TP53-wildtype, SHH-activated/TP53-mutant, and non-WNT/non-SHH (encompassing groups 3 and 4), incorporating integrated molecular-histologic diagnostics."
    explanation: Confirms integrated molecular-histologic diagnostics as the WHO 2021 diagnostic standard for medulloblastoma.
treatments:
- name: Surgical Resection
  description: >-
    Maximal safe resection is the first-line treatment across molecular
    subgroups to relieve fourth-ventricular CSF obstruction and achieve maximal
    cytoreduction. Extent of resection is prognostic; near-total or gross-total
    resection is achievable in most cases.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Posterior Fossa Mass and Fourth Ventricular Outflow Obstruction
    description: >-
      Surgical debulking removes the posterior fossa mass and restores normal
      CSF outflow through the fourth ventricle.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Advances in surgical techniques have allowed a greater attainment of the two primary surgical goals: restoring normal cerebrospinal fluid (CSF) flow and maximal tumour resection."
      explanation: Directly supports surgical resection targeting both the posterior fossa tumor mass and CSF outflow obstruction.
  evidence:
  - reference: PMID:23245832
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Advances in surgical techniques have allowed a greater attainment of the two primary surgical goals: restoring normal cerebrospinal fluid (CSF) flow and maximal tumour resection."
    explanation: Establishes maximal tumor resection and restoration of CSF flow as the primary surgical objectives in medulloblastoma.
- name: Craniospinal Irradiation
  description: >-
    Craniospinal irradiation (CSI) with a posterior-fossa/tumor-bed boost is
    standard for children >=3 years due to the risk of leptomeningeal
    dissemination. CSI is generally avoided or delayed in children <3 years to
    limit neurocognitive and neuroendocrine late effects, and dose-reduction
    trials evaluate lower-intensity CSI for low-risk WNT medulloblastoma.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Craniospinal Irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
  target_mechanisms:
  - target: Cerebellar Progenitor Proliferation
    description: >-
      Posterior-fossa boost and craniospinal radiation eradicate residual
      proliferating embryonal tumor cells in the primary bed.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Radiotherapy to the craniospinal axis with a boost to the posterior fossa has been standard practice, but improvement in radiotherapy techniques and quality control has enabled optimisation of the trade-off between tumour control and normal tissue late toxicities."
      explanation: Supports craniospinal irradiation with posterior fossa boost for primary tumor control.
  - target: Leptomeningeal Dissemination
    description: >-
      Irradiation of the entire craniospinal neuroaxis sterilizes microscopic
      or macroscopic CSF/leptomeningeal seeding.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Radiotherapy to the craniospinal axis with a boost to the posterior fossa has been standard practice, but improvement in radiotherapy techniques and quality control has enabled optimisation of the trade-off between tumour control and normal tissue late toxicities."
      explanation: Explains why the entire craniospinal axis is irradiated to control neuraxis dissemination.
  evidence:
  - reference: PMID:23245832
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Radiotherapy to the craniospinal axis with a boost to the posterior fossa has been standard practice, but improvement in radiotherapy techniques and quality control has enabled optimisation of the trade-off between tumour control and normal tissue late toxicities."
    explanation: Confirms craniospinal irradiation with posterior fossa boost as standard-of-care radiotherapy in medulloblastoma.
- name: Multi-Agent Adjuvant Chemotherapy
  description: >-
    Multi-agent cytotoxic chemotherapy (commonly cisplatin, vincristine,
    cyclophosphamide, and lomustine) is standard adjuvant therapy after
    surgery and radiation. In infants and young children (<3 years), intensive
    chemotherapy regimens are used to delay or avoid craniospinal irradiation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: lomustine
      term:
        id: CHEBI:6520
        label: lomustine
  target_mechanisms:
  - target: Cerebellar Progenitor Proliferation
    description: >-
      Cytotoxic DNA-crosslinking, alkylating, and antimitotic agents kill
      rapidly dividing medulloblastoma cells and suppress micrometastatic
      outgrowth.
    evidence:
    - reference: PMID:23245832
      reference_title: "Medulloblastoma."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "Combination chemotherapy is usually given adjuvantly, although it may be used to delay or avoid the use of radiotherapy in infants."
      explanation: Supports adjuvant multi-agent chemotherapy targeting residual proliferating medulloblastoma cells and radiation-sparing infant therapy.
  evidence:
  - reference: PMID:23245832
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Combination chemotherapy is usually given adjuvantly, although it may be used to delay or avoid the use of radiotherapy in infants."
    explanation: Confirms standard adjuvant combination chemotherapy and its radiation-sparing role in infants.
  - reference: PMID:28613723
    reference_title: "Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Despite advances in multimodal therapy, including surgical resection, craniospinal irradiation, and chemotherapy, medulloblastoma remains a leading cause of cancer-related morbidity and mortality in children. Overall, 5-year survival ranges from 65% to 70%, with survivors frequently experiencing long-term neurocognitive and neuroendocrine complications."
    explanation: Documents multimodal therapy combining surgical resection, craniospinal irradiation, and chemotherapy, with overall 5-year survival of 65% to 70%.

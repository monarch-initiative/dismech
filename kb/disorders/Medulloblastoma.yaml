notes: >-
  This entry is the parent / root-level dismech record for medulloblastoma
  organising the WHO CNS5 (2021) molecular entities across three child dismech
  entries: `Medulloblastoma_WNT_Activated` (WNT-activated),
  `Medulloblastoma_SHH_Activated` (SHH-activated, encompassing TP53-wildtype
  and TP53-mutant), and `Medulloblastoma_Non_WNT_Non_SHH` (non-WNT/non-SHH,
  encompassing Group 3 and Group 4). Subgroup-specific driver genetics,
  developmental lineage circuitry, and targeted clinical trials (such as SMO
  inhibitors in SHH-activated disease and CSI dose reduction in WNT-activated
  disease) live in those child entries, whereas shared posterior-fossa mass
  effect, CSF outflow hydrocephalus, leptomeningeal staging, and backbone
  multimodal therapy are curated here.

notes: >-
  Gene identity was checked against HGNC directly rather than taken from the
  deep-research report: TRIM37 is hgnc:7523 (tripartite motif containing 37,
  17q22). The Perplexity report used for this entry asserted "HGNC:16287", which
  is NFU1, an unrelated iron-sulfur cluster scaffold gene. See the PR and the
  history record for the other citation defects found in that report.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Mulibrey nanism follows autosomal recessive inheritance. In Finland most
    patients are homozygous for the Finn major TRIM37 frameshift allele.
  evidence:
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mulibrey nanism (MUL) is an autosomal recessive disease caused by mutations in the TRIM37 gene encoding the peroxisomal TRIM37 protein of unknown function.
    explanation: >-
      States the inheritance pattern and the causal gene in the cohort that
      defined the diagnostic criteria.
  - reference: PMID:10888877
    reference_title: Gene encoding a new RING-B-box-Coiled-coil protein is mutated in mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mulibrey nanism (for muscle-liver-brain-eye nanism, MUL; MIM 253250) is an autosomal recessive disorder that involves several tissues of mesodermal origin, implying a defect in a highly pleiotropic gene.
    explanation: >-
      The positional cloning paper states the recessive inheritance and the
      mesodermal, pleiotropic character of the disorder.
genetic:
- name: TRIM37
  gene_term:
    preferred_term: TRIM37
    term:
      id: hgnc:7523
      label: TRIM37
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in TRIM37 cause Mulibrey nanism.
    Reported alleles span frameshift, nonsense, splice-site and large genomic
    deletions, plus a single TRAF-domain missense variant. The Finnish founder
    allele is a frameshift predicting a truncated protein.
  evidence:
  - reference: PMID:10888877
    reference_title: Gene encoding a new RING-B-box-Coiled-coil protein is mutated in mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a gene with four independent MUL-associated mutations that all cause a frameshift and predict a truncated protein.
    explanation: >-
      Establishes TRIM37 as the causal gene by positional cloning, with a
      loss-of-function allele class.
  - reference: PMID:15108285
    reference_title: Novel mutations in the TRIM37 gene in Mulibrey Nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we have characterized the genomic structure of the TRIM37 gene, which has 24 exons spanning approximately 109 kb of genomic DNA.
    explanation: Defines the gene structure within which the reported alleles fall.
  - reference: PMID:15108285
    reference_title: Novel mutations in the TRIM37 gene in Mulibrey Nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The sixth mutation (c.965G>T) is the first missense mutation (p.Gly322Val) associated with Mulibrey nanism. It affects the TRAF domain of TRIM37 and results in altered subcellular localization of the mutant TRIM37 protein, further suggesting that it is pathogenic.
    explanation: >-
      The only reported missense allele acts through mislocalisation, which
      supports subcellular targeting as part of the loss-of-function mechanism.
pathophysiology:
- name: TRIM37 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic TRIM37 variants abolish or mislocalise the TRIM37
    RING-B-box-coiled-coil ubiquitin ligase. This is the initiating lesion;
    every node below is downstream of it.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: SNV
    zygosity: HOMOZYGOUS
  molecular_functions:
  - preferred_term: TRIM37 ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  downstream:
  - target: Prenatal-Onset Growth Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth failure is the most consistent finding in the disorder and must
      be downstream of the germline lesion, but nothing is known about the
      route. The intermediates are recorded as unknown rather than guessed:
      the knockout mouse, which reproduces the infertility and the cardiac
      and hepatic phenotypes, does not reproduce the growth failure at all.
    evidence:
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Trim37(-/-) mice were viable and had normal weight development until approximately 12 months of age, after which they started to manifest increasing problems in wellbeing and weight loss.
      explanation: >-
        Refutes any account of the growth failure that the mouse model would
        support: the null mouse has normal weight development for the first
        year. Recorded on this edge because the absence of a model is what
        leaves the intermediates unknown.
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Assessment of skeletal parameters with computer tomography revealed significantly smaller skull size, but no difference in the lengths of long bones in Trim37(-/-) mice as compared with wild-type.
      explanation: >-
        The skeletal counterpart: skull size is reduced in the mouse but
        long-bone length is not, so the model reproduces the craniofacial
        arm of the phenotype without the linear-growth arm.
  - target: Mesodermal Ocular Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The choroidal lesion is downstream of the germline lesion by
      elimination, since every feature of the syndrome is, but no step
      between TRIM37 loss and choroidal hypoplasia has been described in any
      source cited here.
  - target: Gonadal Failure and Insulin Resistance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The endocrine and metabolic axis. Typed as having unknown
      intermediates because the mouse localises the lesion to the gonad
      itself — germ cell aplasia with Leydig cell hyperplasia — without
      establishing what TRIM37 does there, and nothing at all connects the
      lesion to the insulin-resistance arm.
  - target: Peroxisomal TRIM37 Depletion
    causal_link_type: DIRECT
    description: >-
      TRIM37 is a peroxisomal protein and the major Finnish mutant fails to
      reach the peroxisome, so the germline lesion removes TRIM37 from that
      compartment.
    evidence:
    - reference: PMID:11938494
      reference_title: "The TRIM37 gene encodes a peroxisomal RING-B-box-coiled-coil protein: classification of mulibrey nanism as a new peroxisomal disorder."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Peroxisomal localization is compromised in mutant protein representing the major Finnish TRIM37 mutation but is retained in the protein representing the minor Finnish mutation.
      explanation: >-
        Directly links the commonest disease allele to loss of TRIM37 from the
        peroxisome.
  - target: Centrosomal Ubiquitin Ligase Deficiency
    causal_link_type: DIRECT
    description: >-
      TRIM37 also acts at the centrosome, where it restrains PLK4 self-assembly,
      so loss of the ligase removes that restraint.
    evidence:
    - reference: PMID:32908304
      reference_title: TRIM37 controls cancer-specific vulnerability to PLK4 inhibition.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that acentrosomal spindle assembly following PLK4 inhibition depends on levels of the centrosomal ubiquitin ligase TRIM37.
      explanation: >-
        Identifies TRIM37 as a centrosomal ubiquitin ligase. Graded INDIRECT
        because the experiments were performed in cancer and RPE1 cell lines to
        study a therapeutic vulnerability, not in Mulibrey nanism patient
        material.
  evidence:
  - reference: PMID:10888877
    reference_title: Gene encoding a new RING-B-box-Coiled-coil protein is mutated in mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MUL is ubiquitously expressed and encodes a new member of the RING-B-box-Coiled-coil (RBCC) family of zinc-finger proteins, whose members are involved in diverse cellular functions such as developmental patterning and oncogenesis.
    explanation: >-
      Establishes the protein family and the ubiquitous expression that makes a
      multisystem phenotype plausible.
- name: Peroxisomal TRIM37 Depletion
  biological_scale: CELLULAR
  description: >-
    Endogenous TRIM37 is a peroxisomal protein of ~130 kD, and its loss from
    that compartment is what led to Mulibrey nanism being classified as a
    peroxisomal disorder. The node is deliberately named for the depletion of
    TRIM37 from the peroxisome rather than for peroxisomal failure: patient
    fibroblasts stain normally for peroxisomal matrix and membrane markers, so
    biogenesis is apparently intact and no downstream metabolic consequence has
    been demonstrated in patients. See the knowledge gap attached to this node.
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:11938494
    reference_title: "The TRIM37 gene encodes a peroxisomal RING-B-box-coiled-coil protein: classification of mulibrey nanism as a new peroxisomal disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the human TRIM37 cDNA encodes a peroxisomal protein with an apparent molecular weight of 130 kD.
    explanation: Establishes the peroxisomal localisation of the TRIM37 protein.
  - reference: PMID:11938494
    reference_title: "The TRIM37 gene encodes a peroxisomal RING-B-box-coiled-coil protein: classification of mulibrey nanism as a new peroxisomal disorder."
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts derived from patients with mulibrey nanism lack C-terminal TRIM37 immunoreactivity but stain normally for both peroxisomal matrix and membrane markers, suggesting apparently normal peroxisome biogenesis in patient fibroblasts.
    explanation: >-
      Refutes the stronger reading of this node as a peroxisome biogenesis
      defect. The same paper that established the peroxisomal localisation
      reports intact biogenesis in patient cells, so the two items are split by
      quoted sentence rather than merged.
- name: Centrosomal Ubiquitin Ligase Deficiency
  biological_scale: CELLULAR
  description: >-
    TRIM37 normally prevents PLK4 from self-assembling into
    centrosome-independent condensates and controls levels of the centrosomal
    component CEP192. In its absence, ectopic PLK4 condensates form and can act as
    microtubule-organising centres, altering spindle assembly. This is the
    strongest current candidate for a mechanism that would produce both the
    developmental and the neoplastic features, but it has not been shown in
    Mulibrey nanism patient tissue.
  biological_processes:
  - preferred_term: centriole replication
    modifier: ABNORMAL
    term:
      id: GO:0007099
      label: centriole replication
  - preferred_term: mitotic spindle assembly
    modifier: ABNORMAL
    term:
      id: GO:0090307
      label: mitotic spindle assembly
  downstream:
  - target: Disturbed Organ Architecture and Tumor Predisposition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of mitotic fidelity in proliferating tissue is the proposed route to
      the ectopic tissues and the excess of benign and malignant tumours seen in
      patients. The link is an inference from cell-line work to patient
      pathology, not a demonstrated chain.
    evidence:
    - reference: PMID:32908304
      reference_title: TRIM37 controls cancer-specific vulnerability to PLK4 inhibition.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        We find that inactivating TRIM37 improves acentrosomal mitosis because TRIM37 prevents PLK4 from self-assembling into centrosome-independent condensates that serve as ectopic microtubule-organizing centres.
      explanation: >-
        Establishes what TRIM37 loss does to centrosome biology in cultured
        cells. Graded INDIRECT: the inference to patient organ architecture is
        an added step this paper does not make.
  evidence:
  - reference: PMID:32908304
    reference_title: TRIM37 controls cancer-specific vulnerability to PLK4 inhibition.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Low TRIM37 levels accelerate acentrosomal spindle assembly and improve proliferation following PLK4 inhibition, whereas high TRIM37 levels inhibit acentrosomal spindle assembly, leading to mitotic failure and cessation of proliferation.
    explanation: >-
      Shows the loss-of-function direction relevant to Mulibrey nanism has a
      measurable mitotic phenotype. INDIRECT for the same reason as above.
- name: Disturbed Organ Architecture and Tumor Predisposition
  biological_scale: TISSUE
  description: >-
    Patients show disturbed organ architecture with ectopic tissues, together
    with a high frequency of both benign and malignant tumours across internal
    organs. This is an observed patient-level finding, independent of which
    upstream mechanism proves correct.
  downstream:
  - target: Wilms tumor
    causal_link_type: DIRECT
    description: Wilms tumour is the commonest malignancy in this predisposition.
  evidence:
  - reference: PMID:19334051
    reference_title: High frequency of tumours in Mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results show that the MUL patients have disturbed architecture with ectopic tissues and a high frequency of both benign and malignant tumours detectable in several internal organs.
    explanation: >-
      The national cohort establishes both the architectural disturbance and the
      tumour excess directly in patients.
  - reference: PMID:19334051
    reference_title: High frequency of tumours in Mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 210 tumorous lesions were detected in 66/89 patients (74%).
    explanation: Quantifies the tumour burden in the 89-patient national cohort.
- name: Gonadal Failure and Insulin Resistance
  biological_scale: ORGANISM
  description: >-
    The endocrine and metabolic arm of the disease, and the one that emerges
    latest. In males the gonad fails progressively after a normal pubertal
    onset, giving hypergonadotropic hypogonadism and near-universal
    infertility; in females the ovarian stroma instead produces sex
    cord-stromal tumours. Insulin resistance runs alongside and ends in early
    type 2 diabetes. Curated as one node because the knockout mouse shows
    the gonadal and glycaemic abnormalities together and neither has been
    shown to cause the other.
  downstream:
  - target: Hypergonadotropic hypogonadism
    causal_link_type: DIRECT
    description: The clinical expression of the testicular failure in adult males.
  - target: Type 2 diabetes mellitus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Through the insulin resistance recorded as its own phenotype. The
      intermediate is known and named but is not modelled as a separate
      node.
  evidence:
  - reference: PMID:21865362
    reference_title: "Testicular failure and male infertility in the monogenic Mulibrey nanism disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All adult MUL males have a unique disorder of testicular function with small testes, elevated FSH and LH, and low inhibin B.
    explanation: >-
      The human gonadal finding, in all adult males of the national cohort.
  - reference: PMID:17548484
    reference_title: "Growth and growth hormone therapy in subjects with mulibrey nanism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mulibrey nanism is a monogenic disorder with prenatal-onset growth restriction, mild dysmorphic features, and a strong tendency for insulin resistance but no major neurologic handicap.
    explanation: >-
      The human metabolic finding, in the largest growth cohort.
  - reference: PMID:27044324
    reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both male and female Trim37(-/-) mice were infertile, the gonads showing germ cell aplasia, hilus and Leydig cell hyperplasia and accumulation of lipids in and around Leydig cells.
    explanation: >-
      Localises the gonadal lesion to the gonad itself in the null mouse,
      with a histological description that no human study provides.
  - reference: PMID:27044324
    reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Six-month-old Trim37(-/-) mice had elevated fasting blood glucose and low fasting serum insulin levels.
    explanation: >-
      The glycaemic abnormality in the same model, which is why the two arms
      are curated as one node rather than as unrelated findings.
  notes: >-
    Note the mouse and human metabolic phenotypes are not identical: the
    mouse has elevated fasting glucose with LOW fasting insulin, whereas the
    human literature describes insulin resistance. The direction of the
    insulin abnormality differs, and that is recorded rather than smoothed
    over.
- name: Pericardial Constriction
  biological_scale: TISSUE
  description: >-
    A thickened, non-compliant pericardium restricts diastolic filling, giving
    raised venous pressure, hepatomegaly and congestive heart failure. This is
    the feature that dominates outcome, and the step connecting TRIM37 loss to
    pericardial fibrosis is not established — see the knowledge gap attached to
    this node.
  downstream:
  - target: Hepatomegaly
    causal_link_type: DIRECT
    description: >-
      Constriction raises systemic venous pressure, producing hepatic congestion
      and hepatomegaly.
    evidence:
    - reference: PMID:10888877
      reference_title: Gene encoding a new RING-B-box-Coiled-coil protein is mutated in mulibrey nanism.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Characteristic features include severe growth failure of prenatal onset and constrictive pericardium with consequent hepatomegaly.
      explanation: >-
        States the causal relationship between pericardial constriction and
        hepatomegaly in this disorder.
  evidence:
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congestive heart failure and pericardial constriction were diagnosed during infancy in 12% and 6% of the patients, respectively.
    explanation: >-
      Quantifies how often the cardiac manifestations are already present in
      infancy in the Finnish cohort.
- name: Prenatal-Onset Growth Failure
  biological_scale: ORGANISM
  description: >-
    Growth failure begins prenatally and there is no postnatal catch-up, so the
    height deficit widens with age. It is the most consistent finding in the
    disorder and is present essentially independent of organ involvement.
  evidence:
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All except four of the patients (95%) had a prenatal onset growth failure without postnatal catch up growth.
    explanation: >-
      Establishes both the prenatal onset and the absence of catch-up in the
      defining cohort.
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean length standard deviation score (SDS) was -3.1 and -4.0 at birth and at diagnosis, respectively.
    explanation: >-
      Quantifies the deficit at birth and its widening by the time of diagnosis.
- name: Mesodermal Ocular Involvement
  biological_scale: TISSUE
  description: >-
    Focal choroidal hypoplasia with overlying pigment disturbance produces the
    yellowish fundus dots that are part of the diagnostic picture. The choroid
    is mesodermal, which is consistent with the mesodermal framing of the
    syndrome as a whole.
  evidence:
  - reference: PMID:6818830
    reference_title: "Mulibrey nanism, an autosomal recessive syndrome with ocular involvement."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By fluorescein angiography areas of focal choroidal hypoplasia have been noted.
    explanation: Identifies the choroidal lesion behind the fundus findings.
  - reference: PMID:6818830
    reference_title: "Mulibrey nanism, an autosomal recessive syndrome with ocular involvement."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings do confirm the hypothesis that the choroidal changes represent one further manifestation originating from mesodermal tissues in these patients.
    explanation: >-
      Supports the mesodermal framing. Graded INDIRECT because the mesodermal
      origin is the authors' interpretation of the histology rather than a
      direct observation.
  locations:
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid

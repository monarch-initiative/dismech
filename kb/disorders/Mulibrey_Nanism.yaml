name: Mulibrey Nanism
category: Mendelian
creation_date: '2026-09-08T08:30:00Z'
synonyms:
- MUL
- muscle-liver-brain-eye nanism
- Perheentupa syndrome
- pericardial constriction and growth failure
- TRIM37 deficiency
description: >-
  Mulibrey nanism is an autosomal recessive, prenatal-onset growth disorder
  caused by biallelic loss-of-function variants in TRIM37, which encodes a
  RING-B-box-coiled-coil (RBCC/TRIM) protein carrying a C-terminal TRAF domain
  and RING-dependent ubiquitin ligase activity. The name is an acronym for the
  tissues involved — muscle, liver, brain, eye — all of mesodermal origin, which
  was the original argument for a single highly pleiotropic gene. The disease is
  enriched in Finland through a founder frameshift allele ("Finn major") and is
  rare elsewhere.

  Clinically the constant findings are severe growth failure of prenatal onset
  without postnatal catch-up, and a characteristic craniofacial appearance
  (scaphocephaly, facial triangularity, high broad forehead, low nasal bridge)
  present in over 90% of patients. Constrictive pericarditis with consequent
  hepatomegaly is the feature that dominates outcome. Yellowish dots in the
  ocular fundi, a high-pitched voice, cutaneous naevi flammei, fibrous dysplasia
  of long bones, and mild muscular hypotonia complete the picture, but organ
  manifestations vary considerably in early childhood.

  The mechanistic link from TRIM37 loss to this phenotype is genuinely
  unresolved, and this entry is curated to say so rather than to pick a side.
  Two non-exclusive models have authoritative primary support. TRIM37 was
  localised to peroxisomes, which led to Mulibrey nanism being classified as a
  new peroxisomal disorder — but the same study found that patient fibroblasts
  stain normally for peroxisomal matrix and membrane markers, so peroxisome
  biogenesis is apparently intact and the peroxisomal classification does not on
  its own explain the disease. Separately, TRIM37 is a centrosomal ubiquitin
  ligase that restrains PLK4 self-assembly and controls CEP192, so its loss
  permits ectopic microtubule-organising condensates and disturbs mitotic
  fidelity; that work was done in a cancer-vulnerability context rather than in
  patient tissue, so its application to Mulibrey nanism is an inference. What is
  directly observed in patients is disturbed organ architecture with ectopic
  tissues and a high frequency of benign and malignant tumours, which is at
  least consistent with a mitotic-fidelity mechanism.

treatments:
- name: Pericardiectomy
  description: >-
    Surgical decompression of the constricted pericardium is the definitive
    treatment for the cardiac manifestation that dominates outcome. It addresses
    the mechanical consequence of the pericardial lesion, not its cause.
  treatment_term:
    preferred_term: pericardiectomy
    term:
      id: NCIT:C51643
      label: Pericardiectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Pericardial Constriction
    description: >-
      Removing the constricting pericardium restores diastolic filling and
      relieves the raised venous pressure that causes hepatomegaly and
      congestive failure.
  notes: >-
    Left without a treatment-specific evidence item deliberately. Pericardial
    constriction is documented in this cohort (PMID:14757854) and pericardiectomy
    is its standard management, but no quotable statement of the operation's
    effect in Mulibrey nanism was found in the abstracts cached for this entry,
    and the reference cache holds abstracts rather than full text. A curator with
    access to the Finnish cardiac follow-up series should attach evidence here.
discussions:
- discussion_id: peroxisomal_classification_unsupported
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Peroxisomal TRIM37 Depletion
  prompt: >-
    Does loss of peroxisomal TRIM37 produce any measurable peroxisomal
    dysfunction in patients, or is the peroxisomal localisation incidental to
    the disease mechanism?
  rationale: >-
    Mulibrey nanism was classified as a peroxisomal disorder on the strength of
    TRIM37's localisation, and that classification has propagated widely. But
    the same paper reported that patient fibroblasts stain normally for both
    peroxisomal matrix and membrane markers, i.e. biogenesis appears intact, and
    no study has demonstrated the biochemical signature of a peroxisomal
    disorder — raised very-long-chain fatty acids, reduced plasmalogens — in
    Mulibrey nanism patients. Secondary sources routinely present the
    peroxisomal chain as if it were established; it is a localisation result
    plus an inference. Resolving this matters because it decides whether
    peroxisomal metabolites are useful biomarkers here at all.
- discussion_id: pericardial_fibrosis_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pericardial Constriction
  prompt: >-
    By what route does TRIM37 loss cause pericardial fibrosis and constriction?
  rationale: >-
    Pericardial constriction is the feature that determines survival and the
    main indication for surgery, yet no mechanism connects it to the TRIM37
    lesion. Neither the peroxisomal model nor the centrosomal/mitotic model
    predicts a fibrotic pericardium specifically, and no animal or cellular
    model of the pericardial phenotype has been reported. This is the largest
    single gap in the entry: the clinically dominant manifestation has no
    upstream edge that can be evidenced.
- discussion_id: centrosomal_mechanism_not_shown_in_patients
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Centrosomal Ubiquitin Ligase Deficiency
  prompt: >-
    Does the TRIM37-PLK4 centrosomal mechanism, established in RPE1 and cancer
    cell lines, operate in the tissues affected in Mulibrey nanism?
  rationale: >-
    The centrosomal work is the most mechanistically satisfying account of
    TRIM37 and is the one that plausibly explains both disturbed organ
    architecture and tumour predisposition. But it was done to explain a
    cancer-specific therapeutic vulnerability, in immortalised and transformed
    cell lines, and the cancer-relevant direction is TRIM37 amplification and
    over-expression, whereas Mulibrey nanism is loss of function. The
    loss-of-function arm was studied, so the direction is covered, but nothing
    has been shown in patient-derived cells or in a TRIM37-null organism with
    the human phenotype. Every edge in this entry that depends on this mechanism
    is therefore graded INDIRECT.

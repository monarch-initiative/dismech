histopathology:
- name: Peliosis, vascularised cysts and nodular lesions
  description: >-
    The visceral lesion the disease produces, seen on imaging and confirmed
    histologically: strongly dilated blood vessels, vascularised cysts and
    nodular lesions across liver and other organs. Vascular rather than
    epithelial, which is what distinguishes the benign tumour burden here
    from ordinary adenomatous disease.
  evidence:
  - reference: PMID:19334051
    reference_title: High frequency of tumours in Mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumours detected by radiology in the liver and other organs mainly comprised strongly dilated blood vessels (peliosis), vascularized cysts and nodular lesions.
    explanation: >-
      Describes the composition of the benign lesions.
  - reference: PMID:19334051
    reference_title: High frequency of tumours in Mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lesions showed strong expression of the endothelial cell markers CD34 and CD31 as well as the myocyte marker alpha-smooth muscle actin (alpha-SMA).
    explanation: >-
      The immunohistochemistry, which is what establishes the lesions as
      endothelial and smooth-muscle rather than epithelial.

diagnosis:
- name: Clinical diagnostic criteria
  description: >-
    Diagnosis rests on the clinical gestalt — growth failure plus the
    craniofacial features — with the organ manifestations variable at
    presentation. The defining cohort proposed formal criteria on that
    basis.
  diagnosis_term:
    preferred_term: clinical evaluation against Mulibrey nanism diagnostic criteria
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Prenatal-onset growth failure without catch-up, plus scaphocephaly,
    facial triangularity, high broad forehead and low nasal bridge.
  evidence:
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on these findings, we propose new diagnostic criteria for MUL.
    explanation: >-
      The paper's own statement that it proposes diagnostic criteria.
  - reference: PMID:14757854
    reference_title: "Mulibrey nanism: clinical features and diagnostic criteria."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of the diagnosis, characteristic craniofacial features of scaphocephaly, facial triangularity, high and broad forehead, and low nasal bridge were evident in over 90% of the patients.
    explanation: >-
      The craniofacial component, present in over 90% at diagnosis, which is
      the most consistent finding after growth failure.
  notes: >-
    The criteria themselves are not reproduced here: the cached record is
    the abstract, which states that criteria were proposed without listing
    them. What is curated is the evidence base the criteria rest on, not the
    criteria.
- name: TRIM37 molecular genetic testing
  description: >-
    Confirmatory testing. Twenty-three disease-associated TRIM37 variants
    were known at the time of the mouse paper, with a Finnish founder allele
    accounting for most Finnish cases.
  diagnosis_term:
    preferred_term: TRIM37 sequence analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic loss-of-function TRIM37 variants.
treatments:
- name: Pericardiectomy
  description: >-
    Surgical decompression of the constricted pericardium is the definitive
    treatment for the cardiac manifestation that dominates outcome. It addresses
    the mechanical consequence of the pericardial lesion, not its cause.
  treatment_term:
    preferred_term: pericardiectomy
    term:
      id: NCIT:C51643
      label: Pericardiectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Pericardial Constriction
    description: >-
      Removing the constricting pericardium restores diastolic filling and
      relieves the raised venous pressure that causes hepatomegaly and
      congestive failure.
  evidence:
  - reference: PMID:35257621
    reference_title: "The Importance of Early Pericardiectomy in Mulibrey Nanism Syndrome, a Case Report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of a patient with Mulibrey nanism syndrome who underwent pericardiectomy at 12 years old and was able to live 44 years more with relatively stable and asymptomatic diastolic congestive heart failure (CHF).
    explanation: >-
      The operation's effect in this disease, from the oldest reported case:
      pericardiectomy at 12 followed by 44 further years with stable,
      asymptomatic diastolic heart failure. Graded INDIRECT because a single
      uncontrolled case cannot establish that the survival followed from the
      operation.
  - reference: PMID:35257621
    reference_title: "The Importance of Early Pericardiectomy in Mulibrey Nanism Syndrome, a Case Report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Constrictive pericarditis and diastolic dysfunction are the most common causes of mortality.
    explanation: >-
      States why the operation matters: constrictive pericarditis and
      diastolic dysfunction are the commonest causes of death in this
      disease.
  notes: >-
    The evidence here is one case report and is graded accordingly. No
    controlled or cohort comparison of operated against unoperated Mulibrey
    patients exists, so the size of the survival benefit is unknown even
    though the indication is not in doubt.
- name: Recombinant human growth hormone therapy
  description: >-
    Growth hormone given for the prenatal-onset growth failure, evaluated
    over a median of 5.7 years in 30 of 72 subjects followed to 30 years —
    the only long-term treatment evaluation in this disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone
      term:
        id: NCIT:C837
        label: Somatropin
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Prenatal-Onset Growth Failure
    description: >-
      Acts on the growth deficit symptomatically. It does not address the
      TRIM37 lesion and, on the cohort's own numbers, does not restore
      normal stature.
  evidence:
  - reference: PMID:17548484
    reference_title: "Growth and growth hormone therapy in subjects with mulibrey nanism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth hormone treatment improved the prepubertal growth but had only little impact on adult height (+5 cm).
    explanation: >-
      The result, stated as the authors state it: prepubertal growth
      improved, adult height by about 5 cm. This is the honest headline and
      it is a modest one.
  - reference: PMID:17548484
    reference_title: "Growth and growth hormone therapy in subjects with mulibrey nanism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The final adult height averaged 136 cm in girls and 150 cm in boys.
    explanation: >-
      The untreated final heights, which is the baseline the 5 cm is
      measured against.
  - reference: PMID:17548484
    reference_title: "Growth and growth hormone therapy in subjects with mulibrey nanism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the contrary, the subjects who were treated with growth hormone were slimmer and had less metabolic syndrome as young adults.
    explanation: >-
      The unexpected metabolic result. Growth hormone raises insulin
      resistance in other settings, so the concern here was that it would
      worsen the disease's own metabolic tendency; the treated subjects were
      slimmer and had less metabolic syndrome instead.
  notes: >-
    Non-randomised: the 30 treated subjects were not allocated, so the
    metabolic finding in particular could reflect who was selected for
    treatment rather than an effect of it. Recorded because a
    counterintuitive safety result is worth having, not because the
    comparison is controlled.
- name: Tumour surveillance
  description: >-
    Periodic imaging and clinical review for the tumours that occur in most
    patients. Wilms tumour in childhood is the reason surveillance starts
    early; ovarian sex cord-stromal tumours in adult women and the wider
    benign vascular and adenomatous burden are why it continues.
  treatment_term:
    preferred_term: tumour surveillance imaging and clinical review
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Disturbed Organ Architecture and Tumor Predisposition
    description: >-
      Detects the consequence rather than modifying the mechanism.
      Surveillance does not reduce tumour incidence; it changes the stage at
      which tumours are found.
  evidence:
  - reference: PMID:19334051
    reference_title: High frequency of tumours in Mulibrey nanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen malignancies occurred in 13 patients (15%), seven of them in the kidney (five Wilms' tumours), three in the thyroid gland, two gynaecological cancers, one gastrointestinal carcinoid tumour, one neuropituitary Langerhans cell histiocytosis and one case of acute lymphoblastic leukaemia (ALL).
    explanation: >-
      The malignancy burden that surveillance is directed at: 15
      malignancies in 13 of 89 patients, across kidney, thyroid,
      gynaecological and haematological sites.
  - reference: PMID:19329943
    reference_title: "Gynecological tumors in Mulibrey nanism and role for RING finger protein TRIM37 in the pathogenesis of ovarian fibrothecomas."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than half of female patients with Mulibrey nanism develop benign mesenchymal tumors of ovarian sex cord-stromal origin.
    explanation: >-
      The adult female component, which is what extends surveillance beyond
      the childhood Wilms tumour window.
  notes: >-
    No published surveillance protocol for Mulibrey nanism appears in any
    source cited here — no interval, no modality, no evidence that
    surveillance changes outcome in this disease. The treatment is curated
    because the tumour burden is documented and unmanaged risk of that size
    is itself a finding, but the evidence attached establishes the risk and
    not the intervention. Do not read the presence of this entry as a
    recommendation.
animal_models:
- name: Trim37 knockout mouse
  species: Mouse
  genotype: Trim37(-/-) congenic knock-out
  description: >-
    The only reported animal model. It reproduces the infertility, the
    cardiomyopathy, the fatty liver and the tumour predisposition, and
    reproduces none of the growth failure that names the disease.
  publication: PMID:27044324
  modeled_mechanisms:
  - target: Gonadal Failure and Insulin Resistance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Infertility in both sexes with germ cell aplasia and Leydig cell
      hyperplasia, raised FSH and LH with preserved testosterone, and raised
      fasting glucose. The most consistent phenotype in the model.
    limitations: >-
      The glycaemic abnormality runs the other way from the human one: the
      mouse has raised fasting glucose with LOW fasting insulin, whereas
      patients are described as insulin resistant. Testosterone is
      maintained in the mouse and levels off in patients. And the model is
      not a model of the human sex difference — female patients develop
      ovarian sex cord-stromal tumours, which the paper does not report.
    evidence:
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both male and female Trim37(-/-) mice were infertile, the gonads showing germ cell aplasia, hilus and Leydig cell hyperplasia and accumulation of lipids in and around Leydig cells.
      explanation: >-
        The gonadal phenotype with its histology, in both sexes.
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Six-month-old Trim37(-/-) mice had elevated fasting blood glucose and low fasting serum insulin levels.
      explanation: >-
        The metabolic phenotype, with the direction of the insulin
        abnormality that the limitations record.
  - target: Prenatal-Onset Growth Failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not reproduce the defining feature of the disease.
      Weight development is normal to about 12 months and long-bone length
      does not differ from wild-type; only skull size is reduced.
    limitations: >-
      This is a negative result about the model, not about the disease. It
      means the growth arm of Mulibrey nanism currently has no experimental
      system at all, and any mechanism proposed for it cannot be tested in
      this mouse.
    evidence:
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Trim37(-/-) mice were viable and had normal weight development until approximately 12 months of age, after which they started to manifest increasing problems in wellbeing and weight loss.
      explanation: >-
        Normal weight development for the first year, against severe
        prenatal-onset failure in patients.
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Assessment of skeletal parameters with computer tomography revealed significantly smaller skull size, but no difference in the lengths of long bones in Trim37(-/-) mice as compared with wild-type.
      explanation: >-
        The skeletal detail: reduced skull size but unchanged long bones, so
        the craniofacial arm is reproduced and the linear-growth arm is not.
  - target: Peroxisomal TRIM37 Depletion
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Liver peroxisome number and morphology are normal in the null mouse,
      which is the same negative that patient fibroblasts give.
    limitations: >-
      Morphology is not function: normal peroxisome number and appearance do
      not exclude a metabolic defect that was not assayed. The result is
      recorded as a failure to reproduce a peroxisomal phenotype, not as
      proof that peroxisomal function is intact.
    evidence:
    - reference: PMID:27044324
      reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The amount and morphology of liver peroxisomes seemed normal in Trim37(-/-) mice.
      explanation: >-
        The negative peroxisomal result in the model, independent of the
        human fibroblast result the entry already cites for the same claim.
  evidence:
  - reference: PMID:27044324
    reference_title: "Trim37-deficient mice recapitulate several features of the multi-organ disorder Mulibrey nanism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Trim37(-/-) mice recapitulate several features of the human MUL disease and thus provide a good model to study disease pathogenesis related to TRIM37 deficiency, including infertility, non-alcoholic fatty liver disease, cardiomyopathy and tumorigenesis.
    explanation: >-
      The authors' own statement of what the model is for, which is the
      scope of every link above.
discussions:
- discussion_id: peroxisomal_classification_unsupported
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Peroxisomal TRIM37 Depletion
  prompt: >-
    Does loss of peroxisomal TRIM37 produce any measurable peroxisomal
    dysfunction in patients, or is the peroxisomal localisation incidental to
    the disease mechanism?
  rationale: >-
    Mulibrey nanism was classified as a peroxisomal disorder on the strength of
    TRIM37's localisation, and that classification has propagated widely. But
    the same paper reported that patient fibroblasts stain normally for both
    peroxisomal matrix and membrane markers, i.e. biogenesis appears intact, and
    no study has demonstrated the biochemical signature of a peroxisomal
    disorder — raised very-long-chain fatty acids, reduced plasmalogens — in
    Mulibrey nanism patients. Secondary sources routinely present the
    peroxisomal chain as if it were established; it is a localisation result
    plus an inference. Resolving this matters because it decides whether
    peroxisomal metabolites are useful biomarkers here at all.
- discussion_id: pericardial_fibrosis_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pericardial Constriction
  prompt: >-
    By what route does TRIM37 loss cause pericardial fibrosis and constriction?
  rationale: >-
    Pericardial constriction is the feature that determines survival and the
    main indication for surgery, yet no mechanism connects it to the TRIM37
    lesion. Neither the peroxisomal model nor the centrosomal/mitotic model
    predicts a fibrotic pericardium specifically, and no animal or cellular
    model of the pericardial phenotype has been reported. This is the largest
    single gap in the entry: the clinically dominant manifestation has no
    upstream edge that can be evidenced.
- discussion_id: centrosomal_mechanism_not_shown_in_patients
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Centrosomal Ubiquitin Ligase Deficiency
  prompt: >-
    Does the TRIM37-PLK4 centrosomal mechanism, established in RPE1 and cancer
    cell lines, operate in the tissues affected in Mulibrey nanism?
  rationale: >-
    The centrosomal work is the most mechanistically satisfying account of
    TRIM37 and is the one that plausibly explains both disturbed organ
    architecture and tumour predisposition. But it was done to explain a
    cancer-specific therapeutic vulnerability, in immortalised and transformed
    cell lines, and the cancer-relevant direction is TRIM37 amplification and
    over-expression, whereas Mulibrey nanism is loss of function. The
    loss-of-function arm was studied, so the direction is covered, but nothing
    has been shown in patient-derived cells or in a TRIM37-null organism with
    the human phenotype. Every edge in this entry that depends on this mechanism
    is therefore graded INDIRECT.

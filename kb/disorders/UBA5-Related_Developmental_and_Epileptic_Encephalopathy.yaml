discussions:

- discussion_id: gap_which_downstream_arm_drives_the_seizures
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Neuronal Firing
  prompt: >-
    Which downstream consequence of reduced UFMylation - ER stress, mitochondrial damage,
    or the GABAergic interneuron deficit - actually produces the seizures?
  rationale: >-
    Three downstream arms are established, each in a different model system: ER stress and
    UPR activation in patient fibroblasts and organoids, mitochondrial damage in zebrafish,
    and a GABAergic interneuron deficit in organoids. No source demonstrates that any one
    of them causes the abnormal network activity, and none is shown to be upstream of
    another. This entry therefore hangs the ER and mitochondrial arms off the conjugation
    node in parallel rather than in series. No causal edge is added from the GABAergic
    interneuron development deficit to aberrant firing; that relationship remains
    unresolved, consistent with the following firing-direction knowledge gap. Placing the
    findings in a chain would assert a precedence that has not been established.
  proposed_experiments:
  - experiment_id: exp_arm_specific_rescue_in_organoids
    name: Arm-specific rescue in patient-derived organoids
    description: >-
      Rescue each arm independently in the patient-derived organoid model - a chemical
      chaperone or UPR modulator for the ER arm, a mitophagy or mitochondrial-protective
      agent for the mitochondrial arm - and ask which, if either, normalizes the
      multi-electrode firing phenotype without correcting UBA5 abundance itself.

- discussion_id: gap_direction_of_the_organoid_firing_abnormality
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Neuronal Firing
  prompt: >-
    In which direction is network activity abnormal in UBA5 patient organoids, and does it
    match the hyperexcitability the clinical phenotype implies?
  rationale: >-
    The pathophysiology node deliberately says "aberrant" rather than "increased". The
    accessible source text establishes that firing is abnormal but does not specify which
    parameters move which way. The same abstract reports a GABAergic-interneuron
    development defect, but does not describe loss of that population or show that the
    development finding causes the firing abnormality. Curating a direction or causal link
    that the quotable evidence does not state would manufacture that finding.
  proposed_experiments:
  - experiment_id: exp_report_directional_mea_parameters
    name: Directional reporting of organoid multi-electrode parameters
    description: >-
      Report, from the multi-electrode organoid data, the separate directions of mean
      firing rate, single-electrode burst frequency and network burst frequency, so that a
      concordance or divergence between cellular and network excitability can be curated
      explicitly.

- discussion_id: mismatch_null_mouse_models_a_different_lethal_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic UBA5 Variants Reducing E1 Enzyme Function
  prompt: >-
    Can a complete-null animal model inform a disease represented clinically by genotypes
    that retain partial UBA5 function?
  rationale: >-
    No biallelic-null affected individual is represented in the cited clinical series,
    while most functionally analysed affected individuals carry at least one mild or
    partial-function allele. A germline null therefore is not genotype matched to those
    documented cohorts. The CNS-specific Ufm1 knockout is informative in a different way -
    it causes neonatal death with microcephaly and neuronal apoptosis, establishing that
    the pathway is essential for CNS development - but essentiality of the pathway is a
    weaker claim than fidelity to the human hypomorphic disease. The zebrafish lines and
    humanized flies, which grade residual activity, are better-matched models.
  proposed_experiments:
  - experiment_id: exp_patient_matched_hypomorphic_mouse
    name: Patient-genotype-matched hypomorphic mouse
    description: >-
      Generate a mouse carrying the human-equivalent p.Ala371Thr allele in trans with a
      null, matching the actual patient genotype, and ask whether it reproduces the
      seizure and movement phenotype that the null cannot be used to test.

- discussion_id: controversy_can_modest_upregulation_be_therapeutic
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Global UFM1 Conjugation
  prompt: >-
    Is increasing UBA5 abundance a viable therapeutic strategy, and what dose and
    durability would be required?
  rationale: >-
    Asymptomatic adults homozygous for the mild p.Ala371Thr allele show that this genotype
    can be compatible with health, but they do not establish that modest upregulation is
    sufficient in affected compound genotypes. Two approaches that augment UBA5 protein
    abundance rescued phenotypes in cultured models. Durability, minimum effective dose,
    upper safe bound and in-vivo translation remain unknown; the absence of an overt
    phenotype after fly overexpression does not establish human safety.
  proposed_experiments:
  - experiment_id: exp_uba5_dose_response_window
    name: UBA5 abundance dose-response and durability
    description: >-
      Establish a dose-response relationship between UBA5 protein abundance and correction
      of the organoid electrophysiological and ER-stress phenotypes, identifying both the
      minimum effective and maximum tolerated increase, and measure the durability of
      correction beyond the intervals so far reported.

notes: >-
  Scope: this entry curates DEE44 only. UBA5 also causes autosomal recessive
  spinocerebellar ataxia 24 (SCAR24, OMIM 617133) at the mild end of the same allelic
  spectrum, and a severe congenital neuropathy phenotype at the other; both are referenced
  for contrast but are not modeled here as part of DEE44.

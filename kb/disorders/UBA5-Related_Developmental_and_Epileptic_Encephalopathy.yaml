name: UBA5-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T00:20:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 44
- DEE44
- EIEE44
- Early infantile epileptic encephalopathy 44
- UBA5-associated encephalopathy
description: >-
  UBA5-related developmental and epileptic encephalopathy (DEE44) is an autosomal
  recessive disorder caused by biallelic variants in UBA5, the E1 activating enzyme of
  the ubiquitin-fold modifier 1 (UFM1) conjugation cascade. UFMylation is a ubiquitin-like
  modification system distinct from canonical ubiquitination. Affected children present in the first
  weeks to months of life with severe irritability, dystonia and stagnation of
  development, followed by drug-resistant epilepsy, often including epileptic
  spasms - together with axial hypotonia, appendicular hypertonia, postnatal
  microcephaly and failure to thrive. Most reported individuals are compound
  heterozygous for a mild partial-function allele - often recurrent c.1111G>A
  (p.Ala371Thr) - and a more severe allele, although symptomatic partial-function plus
  partial-function combinations are also reported. Functional allelic strength appears
  to contribute substantially to severity, but does not by itself establish an exact
  clinical prognosis.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 44
  term:

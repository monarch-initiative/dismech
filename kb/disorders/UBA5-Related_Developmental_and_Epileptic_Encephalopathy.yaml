differential_diagnoses:
- name: Other UFMylation-pathway neurodevelopmental disorders
  description: >-
    Disorders caused by biallelic UFM1 or UFC1 variants and by UFSP2 variants overlap with
    DEE44 through developmental delay, hypotonia or spasticity, seizures, microcephaly and
    myelination abnormalities. Molecular testing distinguishes the affected UFMylation
    component.
  distinguishing_features:
  - UFSP2 variants support developmental and epileptic encephalopathy 106 rather than DEE44.
  - Biallelic UFM1 variants support hypomyelinating leukodystrophy 14.
  - Biallelic UFC1 variants support neurodevelopmental disorder with spasticity and poor growth.
  evidence:
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All these disorders cause global developmental delay, hypotonia, spasticity,
      seizures, delayed myelination, and microcephaly, consistent with them sharing a
      similar etiology"
    explanation: >-
      The article synthesizes the overlapping clinical features of UFSP2-, UFM1- and
      UFC1-related disorders discussed immediately before this sentence.

- name: UBA5-related SCAR24 and severe congenital neuropathy presentations
  description: >-
    Biallelic UBA5 variants also occur in childhood-onset spinocerebellar ataxia 24 and a
    severe congenital neuropathy presentation. These are mechanistically allelic to DEE44
    but remain distinct clinical concepts rather than subtypes curated inside this entry.
  distinguishing_features:
  - Infantile encephalopathy with developmental stagnation and epilepsy favors DEE44.
  - Childhood-onset gait and limb ataxia with cerebellar atrophy favors SCAR24.
  - Reduced fetal movements and severe sensorimotor neuropathy without central nervous system involvement favor the congenital neuropathy presentation.
  evidence:
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Biallelic UBA5 has also been associated with spinocerebellar ataxia 24
      (OMIM: #617133), which is characterized by a childhood-onset gait and limb ataxia"
    explanation: >-
      Defines the principal clinical boundary between SCAR24 and infantile DEE44.
  - reference: PMID:38046095
    reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "five individuals with severe congenital neuropathy associated with reduced
      fetal movements and severe sensory-motor peripheral neuropathy, with no central
      nervous system involvement"
    explanation: >-
      Defines the peripheral, antenatal-presentation boundary of the congenital neuropathy
      pole.


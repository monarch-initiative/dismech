genetic:
- name: UBA5
  gene_term:
    preferred_term: UBA5
    term:
      id: hgnc:23230
      label: UBA5
  relationship_type: CAUSATIVE
  association: >-
    UBA5 encodes the E1 activating enzyme of the UFM1 cascade. Pathogenic variants are
    missense, nonsense, frameshift and splice-affecting, and their functional consequence
    ranges from mild attenuation to near-complete loss. The recurrent c.1111G>A
    (p.Ala371Thr) hypomorphic allele carries an allele frequency of 0.28% in Europeans and
    is found in trans with a more severe variant in most affected individuals.
  evidence:
  - reference: PMID:27545674
    reference_title: "Biallelic Variants in UBA5 Link Dysfunctional UFM1 Ubiquitin-like Modifier Pathway to Severe Infantile-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals were compound heterozygous for a missense
      substitution, c.1111G>A (p.Ala371Thr; allele frequency of 0.28% in Europeans), and a
      nonsense variant or c.164G>A that encodes an amino acid substitution p.Arg55His"
    explanation: >-
      Gives the recurrent hypomorphic allele, its population frequency, and the
      compound-heterozygous architecture.
  - reference: PMID:33811063
    reference_title: "A description of novel variants and review of phenotypic spectrum in UBA5-related early epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have the recurrent mild c.1111G > A (p.Ala371Thr) variant in trans with a
      second UBA5 variant"
    explanation: >-
      Independent series confirming the same recurrent-allele-in-trans pattern.
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (21/25) individuals are compound heterozygous for one allele from Group
      IA or IB and another allele from Group III or IV"
    explanation: >-
      Quantifies the mild-plus-severe pairing across the reported cohort using the
      functionally defined allelic-strength groups, which is what makes the architecture a
      measurement rather than an impression.
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, there is a strong correlation between in vivo and in vitro
      phenotypes, establishing a classification of LoF variants into mild, intermediate,
      and severe allelic strengths"
    explanation: >-
      Establishes that the functional grading of alleles is reproducible across
      independent assay systems, which is the basis for treating allelic strength as the
      severity determinant.
  notes: >-
    A second UBA5-related disorder, autosomal recessive spinocerebellar ataxia 24
    (SCAR24, OMIM 617133), sits at the mild end of the same allelic spectrum and is
    deliberately not curated here as part of DEE44. It is referenced only for contrast.

diagnosis:
- name: Video Electroencephalography
  description: >-
    EEG is abnormal in essentially all affected children. The characteristic picture is
    multifocal and generalized epileptiform discharge on a disorganized background, with
    hypsarrhythmia where epileptic spasms dominate - a pattern that leads to a clinical
    diagnosis of West syndrome before the genetic cause is known.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:40217280
    reference_title: "Developmental and epileptic encephalopathy 44 due to compound heterozygous variants in the UBA5 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical manifestations are spasmodic seizures, global
      developmental delay, and electroencephalogram (EEG) hyperarrhythmia, consistent with
      clinical diagnosis of West syndrome"
    explanation: >-
      States the EEG pattern and the clinical syndromic diagnosis it produces. Note the
      source's spelling "hyperarrhythmia"; the intended term is hypsarrhythmia, and the
      quote is reproduced as published rather than silently corrected.
  - reference: PMID:40217280
    reference_title: "Developmental and epileptic encephalopathy 44 due to compound heterozygous variants in the UBA5 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multifocal and generalized epileptiform discharges throughout the entire
      brain region"
    explanation: >-
      Records the interictal discharge distribution in a genotype-confirmed case.

- name: Exome or Genome Sequencing
  description: >-
    Diagnosis is genotype-driven. There is no disease-specific biomarker, and the clinical
    and EEG picture is shared with dozens of other genetic developmental and epileptic
    encephalopathies, so broad sequencing rather than targeted testing is what identifies
    the cause. Segregation testing in the parents is needed to confirm that the two
    variants are in trans.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:27545681
    reference_title: "Biallelic Variants in UBA5 Reveal that Disruption of the UFM1 Cascade Can Result in Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Via whole-exome sequencing, we identified rare autosomal-recessive variants
      in UBA5 in five children from four unrelated families"
    explanation: >-
      Exome sequencing is how the gene-disease relationship was established and remains the
      diagnostic route.
  - reference: PMID:28965491
    reference_title: "Compound heterozygous mutations in UBA5 causing early-onset epileptic encephalopathy in two sisters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recent, extensive use of next-generation sequencing has identified a
      large number of genes in epileptic encephalopathies, including UBA5"
    explanation: >-
      Places UBA5 among the genes reachable only by broad sequencing in this phenotype
      group.

treatments:
- name: Antiseizure Medication
  description: >-
    Seizures characteristically require multiple agents and typically remain incompletely
    controlled. No agent is established as preferred in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40217280
    reference_title: "Developmental and epileptic encephalopathy 44 due to compound heterozygous variants in the UBA5 gene: a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We administered a combined ACTH and magnesium sulfate treatment as a shock
      therapy based on the symptoms, but did not observe satisfactory clinical efficacy,
      as the child continued to experience several seizures every day"
    explanation: >-
      Disease-specific treatment evidence, curated as REFUTE because it documents a
      genotype-confirmed DEE44 child in whom the regimen failed. A recorded failure is
      more informative than silence: it tells a later curator what has already been tried.
  notes: >-
    No antiseizure agent has established efficacy in UBA5-related DEE. The evidence item
    above records an attempted ACTH and magnesium sulfate regimen and its explicit lack of
    effect, rather than supporting a recommendation.

- name: Globus Pallidus Internus Deep Brain Stimulation
  description: >-
    Bilateral GPi-DBS has been used for medically refractory status dystonicus in
    UBA5-related disorder, with a reported rapid and sustained response. This is a single
    reported patient, so it is curated as a described intervention rather than an
    established standard.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Deep Brain Stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  evidence:
  - reference: PMID:37130202
    reference_title: "Deep brain stimulation for medically refractory status dystonicus in UBA5-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral globus pallidus internus deep brain stimulation (GPi-DBS) is
      increasingly used in the treatment of medically-refractory dystonia in children,
      including for status dystonicus"
    explanation: >-
      Establishes the intervention and its indication in the population this patient
      belongs to.

animal_models:
- name: uba5 mutant zebrafish
  species: Zebrafish
  genotype: uba5ex1s (p.E5Ffs*1) and uba5ex3d (p.A73_V80del)
  publication: PMID:38046095
  description: >-
    Two independent CRISPR-engineered uba5 mutant lines that together provide the
    strongest in vivo evidence for the mitochondrial arm of the disease, in central
    nervous system, peripheral nerve and skeletal muscle.
  modeled_mechanisms:
  - target: Reduced Global UFM1 Conjugation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Directly measures the conjugation deficit that defines the biochemical lesion.
    readouts:
    - name: Ufm1-conjugate level
      target: Reduced Global UFM1 Conjugation
      direction: DECREASED
      interpretation: >-
        Conjugates fall to 30% of wild type, with free Ufm1 falling further still.
      evidence:
      - reference: PMID:38046095
        reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ufm1-conjugate levels were reduced to 30%, in uba5 mutant animals and,
          interestingly, non-conjugated Ufm1 was also found to be reduced to 9-11% of that in"
        explanation: >-
          The measurement behind this readout, in both directions reported.
    evidence:
    - reference: PMID:38046095
      reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The loss of Uba5 function is further indicated by the increase in
        unconjugated Ufm1 and decrease in Ufm1 conjugates seen in both mutant strains"
      explanation: >-
        Supports treating these lines as informative for the conjugation node, in both
        independent strains.
  - target: Mitochondrial Structural Damage
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Mitochondrial pathology is established in zebrafish tissue; the corresponding
      ultrastructural finding has not been demonstrated in human patient tissue, so the
      arm rests on model evidence.
    description: >-
      Ultrastructural mitochondrial pathology across CNS, PNS and skeletal muscle.
    readouts:
    - name: Mitochondrial ultrastructure in cerebellar neurons and nerve terminals
      target: Mitochondrial Structural Damage
      direction: ALTERED
      interpretation: >-
        Elongated mitochondria and double-membraned degenerative profiles.
      evidence:
      - reference: PMID:38046095
        reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, we detected elongated mitochondria and 'onion-ring' double
          membranous structures at the peripheral nerve terminals, indicating
          mitochondrial degradation"
        explanation: >-
          The ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:38046095
      reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, degenerating mitochondria, visible as 'onion-ring'
        structures with a double membrane, and dark cytoplasmic condensations were

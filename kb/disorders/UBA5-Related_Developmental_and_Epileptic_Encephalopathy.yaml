genetic:
- name: UBA5
  gene_term:
    preferred_term: UBA5
    term:
      id: hgnc:23230
      label: UBA5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    UBA5 encodes the E1 activating enzyme of the UFM1 cascade. Pathogenic variants are
    missense, nonsense, frameshift and splice-affecting, and their functional consequence
    ranges from mild attenuation to near-complete loss. The recurrent c.1111G>A
    (p.Ala371Thr) partial-function allele carries an allele frequency of 0.28% in the
    founding European dataset and is found in trans with a more severe variant in many
    affected individuals. Across a 25-person retrospective allelic analysis, 21 carried a
    mild Group IA/IB allele with a severe Group III/IV allele, while two symptomatic
    partial-function plus partial-function combinations show that this is a hierarchy,
    not an absolute genotype rule.
  variants:
  - name: NM_024818.6(UBA5):c.1111G>A (p.Ala371Thr)
    type: missense
    gene:
      preferred_term: UBA5
      term:
        id: hgnc:23230
        label: UBA5
    description: >-
      Recurrent very mild partial-loss-of-function allele. It impairs UFM1 transfer to
      UFC1 in vitro, yet adult homozygotes without an apparent neurologic phenotype show
      that it is not sufficient alone to cause DEE44. Its disease relevance is therefore
      genotype-context dependent, most often in trans with a more severe UBA5 allele.
    evidence:
    - reference: PMID:27545674
      reference_title: "Biallelic Variants in UBA5 Link Dysfunctional UFM1 Ubiquitin-like Modifier Pathway to Severe Infantile-Onset Encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we show that the p.Ala371Thr variant is hypomorphic with attenuated ability
        to transfer the activated UFM1 to UFC1"
      explanation: >-
        Establishes a partial biochemical defect rather than complete loss of function.
    - reference: PMID:28965491
      reference_title: "Compound heterozygous mutations in UBA5 causing early-onset epileptic encephalopathy in two sisters."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we have identified three adult Icelanders homozygous for the p.Ala371Thr
        mutation who show no signs of neurological disease"
      explanation: >-
        Shows directly that homozygosity for this very mild allele is not sufficient for
        the DEE44 phenotype in the three observed adults.
  evidence:
  - reference: PMID:27545674
    reference_title: "Biallelic Variants in UBA5 Link Dysfunctional UFM1 Ubiquitin-like Modifier Pathway to Severe Infantile-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals were compound heterozygous for a missense
      substitution, c.1111G>A (p.Ala371Thr; allele frequency of 0.28% in Europeans), and a
      nonsense variant or c.164G>A that encodes an amino acid substitution p.Arg55His"
    explanation: >-
      Gives the recurrent hypomorphic allele, its population frequency, and the
      compound-heterozygous architecture.
  - reference: PMID:33811063
    reference_title: "A description of novel variants and review of phenotypic spectrum in UBA5-related early epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have the recurrent mild c.1111G > A (p.Ala371Thr) variant in trans with a
      second UBA5 variant"
    explanation: >-
      Independent series confirming the same recurrent-allele-in-trans pattern.
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (21/25) individuals are compound heterozygous for one allele from Group
      IA or IB and another allele from Group III or IV"
    explanation: >-
      Quantifies the mild-plus-severe pairing across the reported cohort using the
      functionally defined allelic-strength groups, which is what makes the architecture a
      measurement rather than an impression.
  - reference: PMID:38079206
    reference_title: "Allelic strengths of encephalopathy-associated UBA5 variants correlate between in vivo and in vitro assays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, two individuals from a previous report (IA/II) and this study
      (IB/II) show that the disease is also associated with a combination of two partial
      LoF alleles"
    explanation: >-
      Documents the partial-function plus partial-function exceptions to the dominant
      mild-plus-severe pattern.
  notes: >-
    The UBA5 allelic spectrum also includes autosomal recessive spinocerebellar ataxia 24
    (SCAR24, OMIM 617133) and a severe congenital neuropathy presentation. They overlap
    mechanistically but remain distinct clinical disease concepts; this entry is limited
    to MONDO:0014933 DEE44.


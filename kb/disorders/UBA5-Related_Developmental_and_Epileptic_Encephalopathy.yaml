name: UBA5-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T00:20:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 44
- DEE44
- EIEE44
- Early infantile epileptic encephalopathy 44
- UBA5-associated encephalopathy
description: >-
  UBA5-related developmental and epileptic encephalopathy (DEE44) is an autosomal
  recessive disorder caused by biallelic variants in UBA5, the E1 activating enzyme of
  the ubiquitin-fold modifier 1 (UFM1) conjugation cascade. It was among the first
  human diseases attributed to a defect in UFMylation, a ubiquitin-like modification
  system distinct from canonical ubiquitination. Affected children present in the first
  weeks to months of life with severe irritability, dystonia and stagnation of
  development, followed by drug-resistant epilepsy - most characteristically epileptic
  spasms - together with axial hypotonia, appendicular hypertonia, postnatal
  microcephaly and failure to thrive. The genotype is almost always compound
  heterozygous, pairing the recurrent hypomorphic c.1111G>A (p.Ala371Thr) allele with a
  more severe variant on the other chromosome, and the residual enzymatic activity of
  that pair is the dominant determinant of severity.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 44
  term:
    id: MONDO:0014933
    label: developmental and epileptic encephalopathy, 44
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic UBA5 variants are required. In symptomatic individuals the two alleles are
    almost always non-equivalent - one hypomorphic and one severe - because two severe
    alleles are thought to be incompatible with survival and two mild alleles can be
    asymptomatic.
  evidence:
  - reference: PMID:27545674
    reference_title: "Biallelic Variants in UBA5 Link Dysfunctional UFM1 Ubiquitin-like Modifier Pathway to Severe Infantile-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data imply that the combination of a hypomorphic p.Ala371Thr variant in
      trans with a loss-of-function allele in UBA5 underlies a severe infantile-onset
      encephalopathy"
    explanation: >-
      States the biallelic, compound-heterozygous architecture that defines the disorder.

pathophysiology:

- name: Biallelic UBA5 Variants Reducing E1 Enzyme Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Pathogenic UBA5 variants reduce the activity of the UFM1 E1
    activating enzyme, by impairing catalysis, ATP binding, or protein stability
    depending on where the residue sits. This node is the genetic lesion only; the
    separate enzymatic steps it disrupts are curated as their own nodes below, because
    the sources measure them separately.
  molecular_functions:
  - preferred_term: UFM1 activating enzyme activity
    modifier: DECREASED
    term:
      id: GO:0071566
      label: UFM1 activating enzyme activity
  evidence:
  - reference: PMID:27545681
    reference_title: "Biallelic Variants in UBA5 Reveal that Disruption of the UFM1 Cascade Can Result in Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical studies of mutant UBA5 proteins and studies in fibroblasts from
      affected individuals revealed that UBA5 mutations impair the process of ufmylation"
    explanation: >-
      Establishes that patient variants impair UFMylation, measured biochemically and in
      patient fibroblasts.
  downstream:
  - target: Impaired UFM1 Adenylation and Thioester Formation
    causal_link_type: DIRECT
    description: >-
      Loss of enzyme function acts first on the two catalytic steps UBA5 performs.

- name: Impaired UFM1 Adenylation and Thioester Formation
  biological_scale: MOLECULAR
  description: >-
    UBA5 is a non-canonical E1 that carries its catalytic cysteine inside the adenylation
    domain rather than in a separate domain. It adenylates the UFM1 C-terminal glycine
    and then forms a thioester bond through Cys250. This node covers those two steps on
    the enzyme itself, and is kept separate from the handoff to UFC1 because the two are
    assayed independently and specific variants dissociate them - p.Tyr53Phe leaves E1
    activity at 3.4% but transthiolation at 6.8% of wild type.
  molecular_functions:
  - preferred_term: UFM1 adenylation and thioester bond formation at Cys250
    modifier: DECREASED
    term:
      id: GO:0071566
      label: UFM1 activating enzyme activity
  evidence:
  - reference: PMID:28360427
    reference_title: "Novel insights into the interaction of UBA5 with UFM1 via a UFM1-interacting sequence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the activation process UBA5 adenylates UFM1 C-terminal Gly and then forms
      a thioester bond with the UFM1 C-terminus via its active site Cys250"
    explanation: >-
      Defines the two catalytic steps this node covers and names the catalytic residue.
  - reference: PMID:28360427
    reference_title: "Novel insights into the interaction of UBA5 with UFM1 via a UFM1-interacting sequence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UBA5 is a non-canonical E1 activating enzyme that possesses an adenylation
      domain but lacks a distinct cysteine domain"
    explanation: >-
      Explains why the catalytic cysteine sits inside the adenylation domain, which is
      why a single missense change can affect both steps.
  downstream:
  - target: Impaired UFM1 Transfer to UFC1
    causal_link_type: DIRECT
    description: >-
      A charged E1 is the substrate for the transthiolation handoff.

- name: Impaired UFM1 Transfer to UFC1
  biological_scale: MOLECULAR
  description: >-
    Transthiolation - transfer of activated UFM1 from the UBA5 active-site cysteine to
    the E2 enzyme UFC1. The recurrent hypomorphic p.Ala371Thr allele was characterised
    specifically at this step, showing attenuated rather than absent transfer, which is
    what makes it viable in trans with a severe allele.
  molecular_functions:
  - preferred_term: transthiolation transfer of UFM1 to the E2 enzyme UFC1
    modifier: DECREASED
    term:
      id: GO:0071566
      label: UFM1 activating enzyme activity
  evidence:
  - reference: PMID:27545674
    reference_title: "Biallelic Variants in UBA5 Link Dysfunctional UFM1 Ubiquitin-like Modifier Pathway to Severe Infantile-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that the p.Ala371Thr variant is hypomorphic with attenuated ability
      to transfer the activated UFM1 to UFC1"
    explanation: >-
      Localises the recurrent hypomorphic allele's defect to this specific step, and
      records it as attenuated rather than abolished.
  downstream:
  - target: Reduced Global UFM1 Conjugation
    causal_link_type: DIRECT
    description: >-
      Failure of the handoff starves every downstream substrate of activated UFM1.

- name: Reduced Global UFM1 Conjugation
  biological_scale: CELLULAR
  description: >-
    The cell-level readout of the enzymatic defect - the pool of UFM1-conjugated
    substrates falls. Curated as its own node rather than merged with the enzymology
    because it is measured differently (conjugate levels on blot, in an intact animal)
    and because the zebrafish measurement carries an informative second finding: free,
    unconjugated Ufm1 falls further than the conjugates do.
  biological_processes:
  - preferred_term: protein ufmylation
    modifier: DECREASED
    term:
      id: GO:0071569
      label: protein ufmylation
  evidence:
  - reference: PMID:38046095
    reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ufm1-conjugate levels were reduced to 30%, in uba5 mutant animals and,
      interestingly, non-conjugated Ufm1 was also found to be reduced to 9-11% of that in"
    explanation: >-
      Quantifies the conjugation deficit in an intact animal and records that the free
      Ufm1 pool falls further than the conjugated pool.
  downstream:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response Activation
    causal_link_type: DIRECT
    description: >-
      UFMylation substrates are concentrated at the ER, so loss of conjugation is felt
      there first.
  - target: Mitochondrial Structural Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mitochondrial pathology is a separate downstream arm, reported in the same mutant
      animals but not shown to run through the ER arm.

- name: Endoplasmic Reticulum Stress and Unfolded Protein Response Activation
  biological_scale: CELLULAR
  description: >-
    Loss of UFMylation perturbs ER homeostasis and drives an exaggerated unfolded protein
    response. This is the arm with the most direct human-cell evidence, having been shown
    both in patient fibroblasts as abnormal ER structure and in patient-derived organoids
    and engineered cells as an exacerbated UPR.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  - preferred_term: response to unfolded protein
    modifier: INCREASED
    term:
      id: GO:0006986
      label: response to unfolded protein
  evidence:
  - reference: PMID:27545681
    reference_title: "Biallelic Variants in UBA5 Reveal that Disruption of the UFM1 Cascade Can Result in Early-Onset Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBA5 mutations impair the process of ufmylation, resulting in an abnormal
      endoplasmic reticulum structure"
    explanation: >-
      Links the UFMylation defect to ER abnormality in cells from affected individuals.
  - reference: PMID:40333994
    reference_title: "Patient-derived models of UBA5-associated encephalopathy identify defects in neurodevelopment and highlight potential therapeutic avenues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we showed that ER homeostasis is perturbed along with an exacerbated
      unfolded protein response pathway in engineered U87-MG cells and patient-derived
      organoids expressing UBA5 pathogenic variants"
    explanation: >-
      Confirms the ER/UPR arm in a humanized neuronal model carrying patient genotypes.
  downstream:
  - target: GABAergic Interneuron Development Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed route from cell-level ER stress to the lineage-specific developmental
      defect. Marked indirect because the organoid work establishes both findings in the
      same model without demonstrating that one produces the other.

- name: Mitochondrial Structural Damage
  biological_scale: CELLULAR
  description: >-
    A parallel arm, not a consequence of the ER arm. Mutant animals show enlarged
    mitochondria with abnormal cristae, vacuolar degeneration, and double-membraned
    "onion-ring" profiles in cerebellar neurons, peripheral nerve terminals and skeletal
    muscle.
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: ABNORMAL
    term:
      id: GO:0007005
      label: mitochondrion organization
  evidence:
  - reference: PMID:38046095
    reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mitochondrial damage was more striking within the skeletal muscle of the"
    explanation: >-
      Introduces the mitochondrial pathology; the ultrastructural detail is quoted on the
      mitophagy node below.
  downstream:
  - target: Mitophagy Activation
    causal_link_type: DIRECT
    description: >-
      Damaged mitochondria are the signal that recruits the mitophagy machinery.

- name: Mitophagy Activation
  biological_scale: CELLULAR
  description: >-
    Accumulation of full-length PINK1 at the outer mitochondrial membrane, the canonical
    signal for PARKIN recruitment and mitophagy. Curated separately from the structural
    damage node because it is a distinct measurement (a protein isoform readout, not
    morphology) and is a cellular response to the damage rather than the damage itself.
  biological_processes:
  - preferred_term: autophagy of mitochondrion
    modifier: INCREASED
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
  evidence:
  - reference: PMID:38046095
    reference_title: "Genetic model of UBA5 deficiency highlights the involvement of both peripheral and central nervous systems and identifies widespread mitochondrial abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Damaged mitochondria produce a signal that leads to an accumulation of the
      full-length isoform of PINK1 at the outer mitochondrial membrane, resulting in the
      recruitment of PARKIN and initiation of mitophagy"
    explanation: >-
      States the mechanism by which the observed full-length PINK1 accumulation indicates
      mitophagy activation.

- name: GABAergic Interneuron Development Deficit
  biological_scale: CELLULAR
  description: >-
    Single-cell RNA sequencing of patient-derived cortical organoids identified defects in
    the development of GABAergic interneurons. This is the most disease-proximal
    inhibitory-side finding available in a human model, and is the node through which this
    disorder attaches to the conserved excitation-inhibition module.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  evidence:
  - reference: PMID:40333994
    reference_title: "Patient-derived models of UBA5-associated encephalopathy identify defects in neurodevelopment and highlight potential therapeutic avenues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Single-cell RNA sequencing of 100-day organoids identified defects in
      GABAergic interneuron development"
    explanation: >-
      Establishes the interneuron-lineage deficit in organoids carrying patient genotypes.
  downstream:
  - target: Aberrant Neuronal Firing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of inhibitory population is the proposed substrate for the abnormal network
      activity measured in the same organoids.

- name: Aberrant Neuronal Firing
  biological_scale: CELLULAR
  description: >-
    Patient-derived organoids show abnormal neuronal firing on multi-electrode recording.
    Curated at the level the source states it - "aberrant" - without asserting a direction,
    because the abstract that is available establishes that firing is abnormal but does
    not, in the text accessible here, specify which parameters rose and which fell. See
    the knowledge-gap discussion on this point.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  evidence:
  - reference: PMID:40333994
    reference_title: "Patient-derived models of UBA5-associated encephalopathy identify defects in neurodevelopment and highlight potential therapeutic avenues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated aberrant neuronal firing and reduction in size of
      patient-derived organoids"
    explanation: >-
      Supports abnormal network electrophysiology, and separately the organoid size
      reduction curated on the microcephaly node.
  notes: >-
    Conformance deliberately attaches at the module's Excitation-Inhibition Imbalance node
    rather than at Neuronal Hyperexcitability and Hypersynchrony. The latter carries an
    INCREASED action-potential modifier and describes neurons firing excessively, which
    would re-assert the very direction this entry records as unknown in
    gap_direction_of_the_organoid_firing_abnormality. Attaching there would have let the
    module silently supply a directional claim the evidence does not make.
  downstream:
  - target: Drug-Resistant Epilepsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal network activity is the proposed cellular substrate for the clinical
      seizure disorder.

- name: Reduced Organoid Growth
  biological_scale: TISSUE
  description: >-
    Patient-derived cortical organoids are smaller than isogenic controls. Curated as a
    tissue-scale growth phenotype in a human model, distinct from the clinical
    microcephaly phenotype it plausibly corresponds to.
  evidence:
  - reference: PMID:40333994
    reference_title: "Patient-derived models of UBA5-associated encephalopathy identify defects in neurodevelopment and highlight potential therapeutic avenues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated aberrant neuronal firing and reduction in size of
      patient-derived organoids"
    explanation: >-
      Supports the organoid growth deficit as a measured model phenotype.

- name: Drug-Resistant Epilepsy
  biological_scale: ORGANISM
  description: >-
    The clinical seizure disorder - characteristically epileptic spasms beginning in the
    first year, progressing to seizures that resist antiseizure medication.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  evidence:
  - reference: PMID:28965491
    reference_title: "Compound heterozygous mutations in UBA5 causing early-onset epileptic encephalopathy in two sisters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sisters, born in 2004 and 2006, presented with infantile spasms at six
      months of age, which later progressed to recurrent, treatment-resistant seizures"
    explanation: >-
      Documents the spasms-to-refractory-seizures course in a genotyped sibship.


  downstream:
  - target: Reduced EDNRA-Gq Signaling
    description: Nonproductive mutant-GNAI3 association is proposed to limit receptor availability for Gq activation. The horizontal inhibitory effect is experimentally observed; receptor competition is its mechanistic interpretation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27072656
      reference_title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: We found that expression of any of the five ACS-associated Gαi3 mutants decreased Gq activation upon ET-1 stimulation ~65 to 85% (Fig. 6D).
      explanation: HEK293T BRET assays show reduced Gq activation when mutant Gi3 is coexpressed at a substoichiometric ratio.
- name: Reduced EDNRA-Gq Signaling
  biological_scale: MOLECULAR
  description: EDNRA preferentially activates Gq in the tested heterologous system. Disease-associated GNAI3 proteins suppress that response while leaving the weak Gi3 response largely unchanged under the same conditions. Normal GNAI3 is therefore not represented as an obligatory positive intermediate between EDNRA and PLCB4.

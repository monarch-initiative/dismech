- name: Mandibular distraction osteogenesis
  description: Distraction can be used for selected severe mandibular hypoplasia and associated airway compromise. Timing and repeat procedures are individualized. Case reports document improvement, but distraction does not ensure resolution of central apnea or define a universal operative age.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: mandibular osteotomy with distraction osteogenesis
    term:
      id: NCIT:C51903
      label: Osteotomy
  evidence:

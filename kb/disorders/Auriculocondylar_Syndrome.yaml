  - pathophysiology#Abnormal Mandibular Skeletal Morphogenesis
  prompt: How do variant mechanism and species affect the craniofacial phenotype?
  rationale: Human recessive PLCB4 loss-of-function disease coexists with reports of normal skull morphology in Plcb4-null mice. The Arg621His founder experiment tested homozygous and knock-in/indel genotypes, not a simple heterozygote. Fish plcb3 mutants and broad endothelin-pathway knockouts establish developmental requirements without making every model equivalent to a human ACS allele.
  evidence:
  - reference: PMID:35284927
    reference_title: Auriculocondylar syndrome 2 results from the dominant-negative action of PLCB4 variants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Of the 69 embryos harvested at E18.5, we identified three embryos harboring at least one knock-in allele; one was homozygous for the knock-in allele (Plcb4KI/KI) and the other two were compound heterozygotes harboring the knock-in allele and an insertion/deletion (indel) allele generated by non-homologous end joining (NHEJ) (Plcb4Indel/KI).
    explanation: The actual founders comprise one homozygote and two knock-in/indel embryos, not simple heterozygotes.
  - reference: PMID:27072656
    reference_title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.

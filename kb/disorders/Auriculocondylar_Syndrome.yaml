    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The patient underwent bilateral mandibular osteotomy and distraction osteogenesis at 17 days after birth. A second procedure at 16 months old improved mandibular growth.
    explanation: The neonatal report describes staged distraction with later improvement in jaw growth.
  - reference: url:https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf

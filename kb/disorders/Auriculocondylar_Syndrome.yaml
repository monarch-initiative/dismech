- name: PLCB4-variant DAG and transcriptional reporter assays
  experimental_model_type: CELL_LINE
  description: HEK293T cells express EDNRA, wild-type or variant PLCB4 and DAG sensors. Arg621His and three other tested ACS substitutions attenuate the stimulated signal; synthetic Pro838Ala in cis with Arg621His reduces interference. A separate HEK293 SRE-luciferase experiment assesses downstream reporter output with constitutively active Gq.
  notes: DAG-sensor and SRE readouts are not purified-enzyme kinetics, a direct ERK-phosphorylation assay or fetal DLX expression. Proposed PIP2 trapping and altered GAP function were not directly tested. The synthetic interface mutation is not a clinical therapy.

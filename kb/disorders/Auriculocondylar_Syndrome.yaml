- name: Impaired GNAI3 GTP Binding
  biological_scale: MOLECULAR
  description: Purified GNAI3 S47R retains GDP binding but fails to bind GTP efficiently. G40R, G45V, T48N and N269Y also show impaired GTP-dependent protease protection after expression in HEK293T cells. This replaces the earlier structure-based gain-of-function prediction; it does not establish generalized loss of GDP binding.
  evidence:
  - reference: PMID:27072656
    reference_title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Together, these results demonstrate that Gαi3 S47R retains the capability to bind GDP but fails to bind GTP, rendering the G protein unable to switch into an active conformation.
    explanation: Purified S47R directly retains GDP but loses efficient GTP binding; other variants were assessed with cell-expressed limited-proteolysis assays.
  genes:
  - preferred_term: GNAI3
    term:
      id: hgnc:4387
      label: GNAI3
  downstream:
  - target: Increased Mutant GNAI3 Receptor Association
    description: Failure to complete nucleotide-dependent activation is proposed to favor nonproductive receptor complexes. Increased association is measured, but the kinetic trapping mechanism is inferred.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27072656
      reference_title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: We found that all 5 ACS-associated Gαi3 mutants displayed increased binding (3- to 5-fold) to myc-tagged ETAR compared to Gαi3 WT (Fig. 5D).
      explanation: Co-immunoprecipitation measures increased receptor association, not a directly measured receptor residence time or equilibrium affinity.
- name: Increased Mutant GNAI3 Receptor Association
  biological_scale: MOLECULAR
  description: The five tested mutant GNAI3 proteins associate more strongly with EDNRA in co-immunoprecipitation and with Ric-8A in yeast assays. Sustained nonproductive receptor occupancy is the proposed explanation for interference with another G-protein class; binding kinetics were not directly measured.
  evidence:

  description: Obtain audiologic assessment and address the identified cause. Tympanostomy tubes have been used for selected conductive loss. Ossicular abnormalities and cholesteatoma warrant specialist evaluation; the reported mastoidectomy/tympanoplasty case does not provide a quantified postoperative hearing result.

- name: GNAI3-variant expression in Xenopus embryos
  species: Xenopus laevis
  genotype: Injected mRNA encoding wild-type or ACS-associated GNAI3 variants
  description: Expression of G40R, G45V, S47R, T48N or N269Y increases a gastrulation-associated gravitational-inversion phenotype relative to wild-type GNAI3 expression at the tested doses.
  notes: This is an ectopic-expression developmental bioassay scored around neurulation, not an ACS craniofacial model. The signaling pathway responsible for the inversion phenotype was not established, and it is not evidence of facial rescue or a nucleotide-binding assay in vivo.
  evidence:
  - reference: PMID:27072656
    reference_title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: expression of any of the five mutants (G40R, G45V, S47R, T48N and N269Y) increased the frequency of gravitational inversion in embryos compared to those expressing wild-type Gαi3
    explanation: Variant expression modifies the embryonic bioassay phenotype.
  modeled_mechanisms:
  - target: Heterozygous GNAI3 Variants
    relationship: PERTURBS
    limitations: mRNA injection does not recreate a heterozygous human genomic allele; the endpoint is gastrulation, not jaw formation.

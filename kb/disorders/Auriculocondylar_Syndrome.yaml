      snippet: severe microretrognathia, full cheeks, microstomia, and cleft palate (Figure 1m–o) leading to severe upper airway obstruction and feeding difficulties.
      explanation: The severe GNAI3 case connects craniofacial malformation with upper-airway obstruction and feeding problems.
    intermediate_mechanisms:
    - restricted oral space and impaired oral function
- name: Upper-Airway Narrowing
  biological_scale: TISSUE
  description: Mandibular and tongue abnormalities can narrow the oropharyngeal airway. This mechanical branch explains obstructive respiratory complications in selected patients; persistent central apnea requires separate assessment.
  evidence:
  - reference: PMID:38618928
    reference_title: 'Auriculocondylar syndrome 2 caused by a novel PLCB4 variant in a male Chinese neonate: A case report and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Computed tomography (CT) revealed a narrowed oropharynx airway and absent condylar fossae, shortened mandibular rami, and obtuse mandibular angles (Figure 2).
    explanation: CT documents oropharyngeal narrowing in the severely affected neonate.
  downstream:
  - target: Respiratory distress
    description: Severe upper-airway compromise can produce neonatal respiratory distress.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf
      reference_title: https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: severe microretrognathia, full cheeks, microstomia, and cleft palate (Figure 1m–o) leading to severe upper airway obstruction and feeding difficulties.
      explanation: The severe GNAI3 case connects craniofacial malformation with upper-airway obstruction and feeding problems.
  - target: Obstructive sleep apnea
    description: Mechanical upper-airway compromise can contribute to obstructive apnea during sleep.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24268655
      reference_title: Mutations in endothelin 1 cause recessive auriculocondylar syndrome and dominant isolated question-mark ears.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: obstructive respiratory distress, and sleep apnea.
      explanation: The EDN1-associated adult had obstructive respiratory distress and apnea; the mechanical contribution is clinical interpretation.
      directness: INDIRECT
- name: Middle-Ear Ossicular Malformation
  biological_scale: TISSUE
  description: Middle-ear malformation can include congenital-appearing malleoincudal fusion. Histology supports an abnormal joint-development process in one adolescent; coexisting cholesteatoma can contribute to worsening hearing.
  evidence:
  - reference: url:https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
    reference_title: https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the malleoincudal joint appeared to be partially ankylosed laterally .
    explanation: Temporal-bone CT demonstrates the structural ossicular abnormality in one case.
  downstream:
  - target: Conductive hearing impairment
    description: Ossicular fusion can impede sound conduction; the reported case also had cholesteatoma, so the contribution of each lesion was not experimentally isolated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
      reference_title: https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: We therefore hypothesize that the conductive hearing loss was likely due primarily to ossicular fusion secondary to ACS, which progressed due to the addition of cholesteatoma.
      explanation: The authors explicitly qualify their attribution of conductive loss to fusion and cholesteatoma.
      directness: INDIRECT

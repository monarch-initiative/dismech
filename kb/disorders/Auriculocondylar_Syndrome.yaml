references:
- reference: PMID:22560091
  title: A human homeotic transformation resulting from mutations in PLCB4 and GNAI3 causes auriculocondylar syndrome.
  findings:
  - statement: Entire recovered primary body, table and figures reviewed. Gene discovery and selected-case anatomy are distinct from four postnatal mandibular cultures versus 17 calvarial controls. The old GNAI3 gain-of-function structural prediction is superseded by direct 2016 functional experiments.
- reference: PMID:23315542
  title: Heterogeneity of mutational mechanisms and modes of inheritance in auriculocondylar syndrome.
  findings:
  - statement: Actual accessible content is the abstract and repository metadata, despite a full-HTML cache label. Recessive PLCB4 deletion and central-apnea observations are supported at abstract scope; a complete primary body could not be recovered.
- reference: PMID:24123988
  title: 'Understanding the basis of auriculocondylar syndrome: Insights from human, mouse and zebrafish genetic studies.'
  findings:
  - statement: Entire generated developmental review and clinical table reviewed. Mouse and fish identity-patterning findings are distinguished from human allelic mechanisms and postnatal osteoblast measurements.
- reference: PMID:24268655
  title: Mutations in endothelin 1 cause recessive auriculocondylar syndrome and dominant isolated question-mark ears.
  findings:
  - statement: Entire recovered primary body, table and figures reviewed. Human segregation is direct; variant-specific EDN1 processing and residual-ligand explanations are inferred from motifs and related substitutions, not directly assayed.
- reference: PMID:28328130
  title: Targeted molecular investigation in patients within the clinical spectrum of Auriculocondylar syndrome.
  findings:
  - statement: Complete abstract reviewed. Two of three typical index cases in an 11-person mixed-phenotype series had PLCB4 variants; this is not general diagnostic sensitivity. Primary full text was not accessible.
- reference: PMID:34750192
  title: 'New locus underlying auriculocondylar syndrome (ARCND): 430 kb duplication involving TWIST1 regulatory elements.'
  findings:
  - statement: Entire primary main body, Methods, Results, Discussion and figure captions reviewed, with an independent bounded peer audit. Capture-C tissue, three-donor cultures, transcript versus catalytic activity, absent rescue and unresolved mediation are retained.
- reference: PMID:34789173
  title: 'Prenatal diagnosis of auriculocondylar syndrome with a novel missense variant of GNAI3: a case report.'
  findings:
  - statement: Entire primary prenatal report and literature table reviewed. A single fetus with severe jaw hypoplasia and no characteristic ear appearance does not establish prenatal specificity or general penetrance.
- reference: PMID:38618928
  title: 'Auriculocondylar syndrome 2 caused by a novel PLCB4 variant in a male Chinese neonate: A case report and review of the literature.'
  findings:
  - statement: Entire report and regenerated Tables1–3 reviewed. Ser643Phe is likely pathogenic in the body, with structural prediction rather than an activity assay. The 33-case compilation is selected; inconsistent secondary HGVS entries are not copied.
- reference: PMID:39014351
  title: 'Novel GNAI3 mutation in a Chinese family with auriculocondylar syndrome and treatment of severe dentofacial deformities: a 5-year follow-up case report.'
  findings:
  - statement: Entire adult case report, clinical/variant table and figures reviewed. Multiple combined procedures had favorable follow-up, without a comparator or component-specific efficacy estimate.
- reference: PMID:27072656
  title: Dominant-negative Gα subunits are a mechanism of dysregulated heterotrimeric G protein signaling in human disease.
  findings:
  - statement: Entire available functional main body and Methods reviewed. Purified S47R GDP/GTP assays, cell-expressed variant activation, receptor association, horizontal Gq inhibition and Xenopus gastrulation are kept distinct. Main figure legends are absent from this cache.
- reference: PMID:35284927
  title: Auriculocondylar syndrome 2 results from the dominant-negative action of PLCB4 variants.
  findings:
  - statement: Entire functional primary body, Methods and figure captions reviewed. DAG/BRET and SRE reporter readouts, synthetic interface perturbation and mixed-genotype F0 skeletal observations are separately scoped.
- reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4666574/
  title: Novel variants in GNAI3 associated with auriculocondylar syndrome strengthen a common dominant negative effect - PMC
  findings:
  - statement: Novel variants in GNAI3 associated with auriculocondylar syndrome strengthen a common dominant negative effect. Genuine full PMC body of PMID25026904 reviewed; the canonical PMID cache contains only a Nature abstract/reference page. Segregation and hearing observations are used without promoting structural modeling to functional assays.
- reference: url:https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf
  title: https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf
  findings:
  - statement: Further delineation of auriculocondylar syndrome based on 14 novel cases and reassessment of 25 published cases. Version-of-record full PDF of PMID35170830, Methods, Results, Tables1–2, Discussion and captions reviewed. It supersedes numerical differences in an accepted manuscript. The 39-person selected ACS/IQME cohort has outcome-specific denominators and tentative care recommendations; linked supplementary patient details were not independently read.
- reference: url:https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
  title: https://lab.research.sickkids.ca/wp-content/uploads/sites/22/2015/09/Propst_et_al_Ossicular-Fusion-and-cholesteatoma-in-Auriculo-Condylar-Syndrome_2013.pdf
  findings:
  - statement: 'Ossicular fusion and cholesteatoma in auriculo-condylar syndrome: in vivo evidence of arrest of embryogenesis. Complete institutional full PDF of PMID22865651 reviewed, including operative, histological and figure details. One adolescent had congenital-appearing ossicular fusion plus cholesteatoma; no quantified postoperative hearing benefit was reported.'
review_notes: Comprehensive review of every original cited source at its actual available depth, matching deep-research report and recovered primary full texts. No dedicated GeneReviews chapter was located. Full bodies, tables and methods were used where available; abstract-only and missing-supplement limits are recorded in the bibliography. The entry distinguishes gene lesions, measured signaling and transcriptional readouts, developmental model inference, selected clinical cohorts and case-based care. Unsupported phenotype frequency bands and untested serial mechanisms were removed; the published population rarity estimate is retained as explicitly background evidence, without treating a reported-case count as prevalence. The existing dbGaP record was independently verified.

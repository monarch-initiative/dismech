- name: Orthodontic and orthognathic treatment
  description: Dentofacial deformity and malocclusion may be treated with coordinated orthodontics and staged orthognathic surgery. One adult report documented improved occlusion, mouth opening and apnea indices at long follow-up after several combined procedures; it cannot isolate the contribution of each component or establish a standard protocol.

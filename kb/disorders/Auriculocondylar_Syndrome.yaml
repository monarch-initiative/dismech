  prompt: Which extra-craniofacial findings are causally attributable to individual ACS genotypes?
  rationale: Central apnea may persist after correction of mechanical obstruction. Small series report vascular, rib, developmental and genital findings, but do not establish precise population risks or the cellular intermediates. These observations are retained without forcing every finding through mandibular homeosis.

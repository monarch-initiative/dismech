    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Attention needs to be paid to middle and inner ear function by way of an audiogram in all patients with ACS to evaluate for hearing loss.
    explanation: Case-series authors recommend audiologic assessment.
  - reference: url:https://pure.rug.nl/ws/files/217832848/Human_Mutation_2022_Vegas_Further_delineation_of_auriculocondylar_syndrome_based_on_14_novel_cases_and_reassessment.pdf

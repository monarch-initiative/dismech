      label: PLCB4
  description: 'Autosomal dominant PLCB4-related auriculocondylar syndrome, typically caused by heterozygous missense variants. Note on the binding: MONDO has not adopted OMIM''s ARCND2A/2B relabel, so MONDO:0013845 is still plain "auriculocondylar syndrome 2" with no "2A" synonym and no inheritance axiom. It is bound here on the strength of its OMIM:614669 xref, which matches this row exactly. It and MONDO:0957544 (bound to the ARCND2B row below) both point at PLCB4 and are distinguished only by OMIM entry, not by a dominant/recessive assertion in MONDO.'
  evidence:
  - reference: PMID:38618928
    reference_title: 'Auriculocondylar syndrome 2 caused by a novel PLCB4 variant in a male Chinese neonate: A case report and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Four subtypes of ARCND have been described so far, that is, ARCND1 (OMIM # 602483), ARCND2 (ARCND2A, OMIM # 614669; ARCND2B, OMIM # 620458), ARCND3 (OMIM # 615706), and ARCND4 (OMIM # 620457).'
    explanation: This identifies ARCND2A and its OMIM identifier.
    quote_role: BACKGROUND
  - reference: PMID:35284927
    reference_title: Auriculocondylar syndrome 2 results from the dominant-negative action of PLCB4 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: These results illustrate that PLCB4 p.Arg621His interferes with PLCB activity even when it is expressed at a sub-stoichiometric level relative to wild-type PLCB4, exemplifying a characteristic of a dominant-negative protein.
    explanation: DAG-sensor BRET detects dominant interference by Arg621His; three additional tested missense variants also attenuated the response.

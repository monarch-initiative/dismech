- name: Regulatory-duplication patient iPSC neural-crest cultures
  experimental_model_type: IPSC_DERIVED_MODEL
  description: iPSCs from three affected members of one family and three controls were differentiated toward neural crest. Patient cultures showed increased TWIST1 and HDAC9 mRNA and reduced 24-hour scratch closure without a detected cell-cycle distribution difference.
  notes: Controls were not isogenic; one control was reprogrammed by a different method. Capture-C was performed in separate nonpatient embryonic calvarial mesenchyme and does not demonstrate altered contacts in these patient cells. No TWIST1-specific correction, rescue or necessity experiment was performed. EDN-pathway transcripts were unchanged or too low to assess, not proof of normal signaling.
  publication: PMID:34750192
  cell_source: Three patient-derived and three unrelated control iPSC lines
  evidence:
  - reference: PMID:34750192
    reference_title: 'New locus underlying auriculocondylar syndrome (ARCND): 430 kb duplication involving TWIST1 regulatory elements.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: However, an increase in HDAC9 (3.15-fold, unpaired t-test p=0.009) and TWIST1 (2.03-fold, unpaired t-test p=0.03) mRNA was observed in the ARCND-iNCC (figure 2A, B) compared with controls (unpaired t-test).
    explanation: Three affected-donor iPSC-derived neural-crest cultures show increased transcripts relative to three controls; no isogenic correction isolates the causal mediator.
    directness: INDIRECT
  - reference: PMID:34750192
    reference_title: 'New locus underlying auriculocondylar syndrome (ARCND): 430 kb duplication involving TWIST1 regulatory elements.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Although no significant difference in cell cycle distribution was detected between patient and control cells, a significant decrease in migratory capacity of ARCND iNCCs was observed compared with controls (4.3-fold decrease, Student’s t-test, p=0.0009) (figure 2C–E).
    explanation: A 24-hour scratch assay measures reduced wound closure in the patient-derived cultures; it does not measure migration into human pharyngeal arches.
    directness: INDIRECT
  modeled_mechanisms:

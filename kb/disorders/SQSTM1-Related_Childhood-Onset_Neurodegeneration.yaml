    snippet: >-
      biallelic pathogenic variants of SQSTM1 can cause child-onset and multisystem
      neurodegeneration, including cerebellar ataxia, dystonia, and vertical gaze palsy
      (NADGP)
    explanation: >-
      Names vertical gaze palsy as one of the three phenotype-defining features.
  - reference: PMID:41307082
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During 2 years of follow-up, the second patient developed gaze palsy.
    explanation: >-
      Documents that gaze palsy can emerge after the ataxia, so its absence at first
      assessment does not exclude the diagnosis.

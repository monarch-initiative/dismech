progression:
- phase: Presymptomatic childhood
  notes: >
    Early development is normal. No presymptomatic biomarker or imaging change has been
    described, and no intervention window has been studied because no disease-modifying
    therapy exists to deploy in one.
- phase: Onset with gait ataxia
  notes: >
    Presentation in later childhood or adolescence, typically with recurrent falls, unsteady
    gait and emerging dysarthria. Initial metabolic and routine workup is characteristically
    unremarkable.
  evidence:
  - reference: PMID:41307082
    reference_title: "Novel SQSTM1 (c.838G>T) Mutation Identified in Two Unrelated Cases of Cerebellar Ataxia and Gaze Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient was a 12-year-old boy of Iraqi and Iranian descent, who presented with
      a 3-year history of recurrent falls, swaying while walking, and difficulties with
      writing and speech.
    explanation: >-
      A representative presentation: falls and gait disturbance in the first decade, with
      speech involvement.
- phase: Established combined cerebellar-extrapyramidal-oculomotor syndrome
  notes: >
    Appendicular ataxia, dysarthria, dystonia and choreoathetosis are joined by vertical
    supranuclear gaze palsy, which may appear only on follow-up. Mild cognitive decline
    becomes apparent. Dysautonomia emerges in a subset.

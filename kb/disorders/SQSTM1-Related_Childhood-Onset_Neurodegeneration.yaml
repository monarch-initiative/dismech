name: SQSTM1-Related Childhood-Onset Neurodegeneration
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
synonyms:
- NADGP
- neurodegeneration with ataxia, dystonia, and gaze palsy, childhood-onset
- Childhood-onset neurodegeneration with ataxia, dystonia and gaze palsy
- Biallelic SQSTM1-related neurodegeneration
- p62/sequestosome-1 deficiency
description: >
  Childhood-onset neurodegeneration with ataxia, dystonia and gaze palsy (NADGP) is an
  ultra-rare autosomal recessive neurodegenerative disorder caused by biallelic
  loss-of-function variants in SQSTM1, the gene encoding the selective-autophagy cargo
  receptor p62/sequestosome-1. Early development is normal; affected children present in
  later childhood or adolescence with progressive gait ataxia and evolve a combined
  cerebellar, extrapyramidal and oculomotor syndrome — appendicular ataxia, dysarthria,
  dystonia, choreoathetosis, vertical supranuclear gaze palsy and mild cognitive decline.

  The zygosity split matters and is the reason this is a separate entry. SQSTM1 is far
  better known for two *dominant* diseases caused by heterozygous, usually missense,
  alleles: Paget disease of bone (recurrent UBA-domain p.Pro392Leu) and ALS/frontotemporal
  dementia. Those are allelic disorders of altered p62 function in adults. NADGP is
  instead a state of complete p62 absence, confirmed by immunoblot in patient fibroblasts,
  and every reported NADGP allele to date is predicted-null (nonsense, frameshift, splice,
  start-loss, or a synonymous change shown to disrupt splicing). No missense NADGP allele
  has been reported. The two disease groups therefore differ in zygosity, allele class,
  age of onset and affected organ system, and their evidence must not be merged.

  Mechanistically the disorder sits with the congenital disorders of autophagy. p62
  polymerises through its PB1 domain, binds ubiquitinated cargo through its UBA domain and
  delivers that cargo to the forming autophagosome through its LC3-interacting region. Its
  absence leaves selective autophagy without a cargo adaptor: patient and knockout cells
  fail to build ubiquitin-positive aggregates in response to misfolded-protein stress,
  autophagic flux decelerates, and the early PINK1-dependent steps of mitochondrial quality
  control are disrupted even though bulk mitochondrial clearance is preserved.

  A caveat that constrains everything downstream: no human neuropathology has been
  published. The step from cellular proteostatic and mitochondrial failure to
  region-selective degeneration of cerebellum, brainstem gaze centres and basal ganglia is
  inferred from imaging, from zebrafish sqstm1 knockdown and from p62-null mice, not
  demonstrated in patient tissue. It is curated here as an explicit knowledge gap rather
  than asserted.

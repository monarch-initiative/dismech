inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic — homozygous or compound heterozygous — loss-of-function SQSTM1 variants
    segregating in multiple independent, frequently consanguineous families. Obligate
    heterozygous carriers are reported clinically unaffected for this phenotype. This is
    the axis that separates NADGP from the dominant SQSTM1 disorders.
  evidence:
  - reference: PMID:27545679
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified three different biallelic loss-of-function variants in SQSTM1 in nine
      affected individuals from four families with a childhood- or adolescence-onset
      neurodegenerative disorder characterized by gait abnormalities, ataxia, dysarthria,
      dystonia, vertical gaze palsy, and cognitive decline
    explanation: >-
      The defining report establishes biallelic loss-of-function inheritance across four
      independent families.
  - reference: PMID:29959261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study offers an accurate clinical characterization of this recently recognized
      neurodegenerative disorder caused by biallelic inactivating mutations in SQSTM1 and
      links this phenotype to defective selective autophagy.
    explanation: >-
      Independent replication of biallelic inactivating inheritance in three consanguineous
      families.
  - reference: PMID:39126919
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pathogenic variants in SQSTM1 gene are known to cause Neurodegeneration with ataxia,
      dystonia, and gaze palsy in autosomal recessive inheritance fashion.
    explanation: >-
      States the autosomal recessive mode of inheritance for this named phenotype.
genetic:
- name: SQSTM1
  gene_term:
    preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    SQSTM1 (chr5q35.3) encodes p62/sequestosome-1, a 440-residue multidomain scaffold with
    PB1 self-oligomerisation, ZZ zinc-finger, TRAF6-binding, LC3-interacting (LIR),
    KEAP1-interacting (KIR) and ubiquitin-associated (UBA) domains. Every NADGP allele
    reported to date is predicted-null: nonsense (p.Arg96Ter, p.Glu19Ter, p.Glu280Ter),
    frameshift (p.Glu104fs, p.Leu251SerfsTer4, c.790del), canonical splice-site (c.301+2T>A),
    start-loss (c.1A>G), or a synonymous change that disrupts splicing (c.969G>A). No
    missense NADGP allele has been reported, in pointed contrast to the dominant allelic
    disorders, whose defining alleles are missense.
  evidence:
  - reference: PMID:29959261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 3 homozygous inactivating variants, including a splice site substitution
      (c.301+2T>A) causing aberrant transcript processing and accelerated degradation of a
      resulting protein lacking exon 2, as well as 2 truncating changes (c.875_876insT and
      c.934_936delinsTGA).
    explanation: >-
      Documents the null allele classes — splice-site and truncating — that characterise
      this disorder.
  - reference: PMID:41307082
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both cases, initial workup was unremarkable, but whole-exome sequencing revealed a
      novel homozygous pathogenic truncating mutation, SQSTM1 (c.838G>T, p. Glu280Ter).
    explanation: >-
      A further homozygous truncating allele, recurrent in two unrelated Iranian families.
  - reference: PMID:35957775
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous deletion variant that changes the frame shift in the SQSTM1 gene named
      c.790 Del A .T was detected in case childhood onset and progressive neurodegeneration
      with ataxia, and gaze palsy.
    explanation: >-
      An independent homozygous frameshift allele in the same phenotype.
  - reference: PMID:39587727
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified compound heterozygous variants in SQSTM1(NM_003900.5): c.1A>G p.(Met1?)
      in the initial codon, and c.969G>A, located at the 3' end of exon 6, which is novel and
      seemingly a synonymous but is actually a truncating variant causing aberrant splicing.
    explanation: >-
      Compound heterozygosity for a start-loss and a splice-disrupting synonymous allele,
      showing that a nominally silent change can be a null allele in this gene.
pathophysiology:
- name: Biallelic SQSTM1 Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Two null SQSTM1 alleles — nonsense, frameshift, canonical-splice, start-loss, or a
    synonymous change that disrupts splicing — are inherited from carrier parents. The
    resulting transcripts are degraded or encode truncated, non-functional protein.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  evidence:
  - reference: PMID:27545679
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified three different biallelic loss-of-function variants in SQSTM1 in nine
      affected individuals from four families with a childhood- or adolescence-onset
      neurodegenerative disorder characterized by gait abnormalities, ataxia, dysarthria,
      dystonia, vertical gaze palsy, and cognitive decline
    explanation: >-
      Establishes biallelic SQSTM1 loss of function as the initiating lesion.
  downstream:
  - target: Absence of p62/Sequestosome-1 Protein
    causal_link_type: DIRECT
    description: >-
      Null alleles on both chromosomes leave no functional p62 to be translated.
- name: Absence of p62/Sequestosome-1 Protein
  biological_scale: MOLECULAR
  description: >
    p62 protein is undetectable in patient cells. This is a complete-absence state rather
    than an altered-function state, which is the molecular distinction from the dominant
    SQSTM1 disorders, where a missense p62 is present but behaves abnormally.
  molecular_functions:
  - preferred_term: ubiquitin-binding autophagy cargo receptor activity of p62
    term:
      id: GO:0043130
      label: ubiquitin binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27545679
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed absence of the SQSTM1/p62 protein in affected individuals' fibroblasts and
      found evidence of a defect in the early response to mitochondrial depolarization and
      autophagosome formation.
    explanation: >-
      Directly demonstrates absent p62 protein in patient-derived cells, establishing this
      node as a measured rather than inferred state.
  - reference: PMID:39587727
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An SQSTM1 protein expression assay using urine-derived cells (UDCs) demonstrated that
      both variants (c.1A>G and c.969G>A) were unable to induce normal splicing of
      premessenger RNA.
    explanation: >-
      Independent functional confirmation, in a second patient-derived cell type, that the
      alleles abolish normal p62 production.
  downstream:
  - target: Failure of Selective Autophagy Cargo Recognition
    causal_link_type: DIRECT
    description: >-
      p62 is the adaptor that couples ubiquitinated cargo to the autophagosome; without it
      the coupling step has no substrate-recognition module.
  - target: Blunted KEAP1-NRF2 Antioxidant Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - nrf2_axis_failure
    description: >-
      p62 also competes with NRF2 for the same binding site on KEAP1. Its absence is
      inferred to reduce NRF2 stabilisation and therefore antioxidant gene transcription.
      This edge is hypothesis-scoped and has not been demonstrated in patients.
- name: Failure of Selective Autophagy Cargo Recognition
  biological_scale: CELLULAR
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  description: >
    Without p62 the cell cannot polymerise ubiquitinated cargo into sequestration-competent
    bodies or hand them to LC3 on the phagophore. Patient and knockout cells fail to form
    ubiquitin-positive aggregates under misfolded-protein stress and autophagic flux slows.
    Note that this is a cargo-recognition lesion, not a defect of the core autophagy
    machinery: the autophagosome can still be built, but selectively loading it fails.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  - preferred_term: aggrephagy
    term:
      id: GO:0035973
      label: aggrephagy
    modifier: DECREASED
  molecular_functions:
  - preferred_term: LC3-interacting region binding of p62 to the phagophore
    term:
      id: GO:0043130
      label: ubiquitin binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29959261
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that loss of SQSTM1 causes impaired production of ubiquitin-positive protein
      aggregates in response to misfolded protein stress and decelerated autophagic flux.
    explanation: >-
      Directly demonstrates the cargo-handling and flux defect that defines this node.
  - reference: PMID:16286508
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The depletion of p62 inhibited recruitment of LC3 to autophagosomes under starvation
      conditions.
    explanation: >-
      Establishes the normal p62-LC3 coupling step whose loss this node describes. Indirect
      because it is p62 depletion in a non-patient experimental system, not NADGP material.
  - reference: PMID:29112993
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      ATG5-associated autosomal-recessive ataxia syndrome, SQSTM1/p62-associated
      childhood-onset neurodegeneration, and several forms of the hereditary spastic
      paraplegias.
    explanation: >-
      Places this disorder within the congenital disorders of autophagy. Indirect because it
      is a review classifying the disorder rather than reporting a measurement.
  downstream:
  - target: Impaired Mitochondrial Quality Control
    causal_link_type: DIRECT
    description: >-
      Damaged mitochondria are one of the cargo classes that p62 normally routes to the
      autophagosome.
  - target: Cerebellar and Brainstem Neuron Proteostatic Stress
    causal_link_type: DIRECT
    description: >-
      Undegraded ubiquitinated cargo accumulates in long-lived post-mitotic neurons, which
      have limited capacity to dilute it by division.
- name: Impaired Mitochondrial Quality Control
  biological_scale: CELLULAR
  description: >
    p62 loss disrupts the early, PINK1-dependent steps of mitophagy — PINK1 recruitment and
    ubiquitin phosphorylation on depolarised mitochondria — and alters mitochondrial gene
    expression and respiratory function. Importantly, bulk clearance of mitochondria is
    preserved, so the defect is best described as impaired mitochondrial function and
    early-response quality control rather than a mitophagy block.
  biological_processes:
  - preferred_term: autophagy of mitochondrion
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    modifier: DECREASED
  evidence:
  - reference: PMID:33891871
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that SQSTM1 depletion causes altered mitochondrial gene expression and
      functionality, as well as autophagy flux, in iPSC-derived neurons.
    explanation: >-
      Demonstrates the mitochondrial consequence in a human neuronal context.
  - reference: PMID:33891871
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, SQSTM1 is not essential for mitophagy despite having a significant impact on
      early PINK1-dependent mitophagy processes including PINK1 recruitment and
      phosphorylation of ubiquitin on depolarized mitochondria.
    explanation: >-
      Delimits the claim: the lesion is in the early PINK1-dependent steps, not in
      mitochondrial clearance overall. Curated so this node is not overread as a mitophagy
      block.
  - reference: PMID:27545679
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed absence of the SQSTM1/p62 protein in affected individuals' fibroblasts and
      found evidence of a defect in the early response to mitochondrial depolarization and
      autophagosome formation.
    explanation: >-
      The same early mitochondrial-depolarisation response defect, measured in patient
      fibroblasts rather than an engineered knockout.
  downstream:
  - target: Cerebellar and Brainstem Neuron Proteostatic Stress
    causal_link_type: DIRECT
    description: >-
      Mitochondrial dysfunction compounds the proteostatic burden in neurons with high and
      sustained metabolic demand.
- name: Blunted KEAP1-NRF2 Antioxidant Response
  biological_scale: CELLULAR
  description: >
    p62's KEAP1-interacting region normally competes with NRF2 for the KEAP1 binding site,
    so p62 stabilises NRF2 and sustains antioxidant gene transcription. Complete p62 loss is
    therefore predicted to leave NRF2 less protected from KEAP1-directed degradation and the
    antioxidant response blunted. This node is an inference from the inverse experiment
    (p62 overproduction stabilises NRF2); it has not been measured in NADGP patients or
    patient cells, and is scoped to a hypothesis group for that reason.
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: DECREASED
  evidence:
  - reference: PMID:20173742
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      p62 interacts with the Nrf2-binding site on Keap1, a component of Cullin-3-type
      ubiquitin ligase for Nrf2.
    explanation: >-
      Establishes the molecular interaction on which this node depends.
  - reference: PMID:20173742
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Thus, an overproduction of p62 or a deficiency in autophagy competes with the
      interaction between Nrf2 and Keap1, resulting in stabilization of Nrf2 and
      transcriptional activation of Nrf2 target genes.
    explanation: >-
      Indirect and inverted: the demonstrated direction is that excess p62 stabilises NRF2,
      from which blunted NRF2 signalling under complete p62 absence is inferred rather than
      shown.
  downstream:
  - target: Cerebellar and Brainstem Neuron Proteostatic Stress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - nrf2_axis_failure
    description: >-
      Reduced antioxidant capacity is proposed to lower the threshold at which affected
      neurons decompensate. Not demonstrated in this disorder.
- name: Cerebellar and Brainstem Neuron Proteostatic Stress
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >
    Long-lived cerebellar and brainstem neurons carry the combined burden of undegraded
    ubiquitinated cargo, dysfunctional mitochondria and — hypothetically — reduced
    antioxidant reserve. This is the disorder-specific substitution into the conserved
    cerebellar-degeneration trigger node, whose module description explicitly admits
    impaired protein quality control as one of its heterogeneous initiating lesions.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:29959261
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      The consequences of sqstm1 down-modulation on the structural integrity of the
      cerebellum in zebrafish documented a variable but reproducible phenotype characterized
      by cerebellum anomalies ranging from depletion of axonal connections to complete
      atrophy.
    explanation: >-
      Ties loss of sqstm1 specifically to cerebellar structural failure. Indirect because it
      is a zebrafish knockdown, not human tissue.
  - reference: PMID:18346206
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      we report age-dependent constitutive activation of glycogen synthase kinase 3beta,
      protein kinase B, mitogen-activated protein kinase, and c-Jun-N-terminal kinase in
      adult p62(-/-) mice resulting in hyperphosphorylated tau, neurofibrillary tangles, and
      neurodegeneration
    explanation: >-
      Shows that constitutive p62 loss is sufficient to cause neurodegeneration in a mammal.
      Indirect: the mouse lesion is tau-driven and its relevance to human NADGP is unproven.
  downstream:
  - target: Regional Neurodegeneration of Cerebellum, Brainstem and Basal Ganglia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inferred step. No human neuropathology has been published, so the transition from
      cellular stress to region-selective neuronal loss rests on imaging and model systems.
- name: Regional Neurodegeneration of Cerebellum, Brainstem and Basal Ganglia
  biological_scale: TISSUE
  description: >
    Progressive, bilateral and symmetric degeneration selectively involving cerebellar
    circuitry, the rostral brainstem supranuclear vertical-gaze pathways, and the basal
    ganglia, with milder diffuse cortical involvement. The regional pattern is read off the
    clinical syndrome and imaging rather than from tissue: cerebellar atrophy is variable
    and often absent on MRI, and brainstem lesions have been reported only once.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:29959261
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To characterize clinically and molecularly an early-onset, variably progressive
      neurodegenerative disorder characterized by a cerebellar syndrome with severe ataxia,
      gaze palsy, dyskinesia, dystonia, and cognitive decline affecting 11 individuals from 3
      consanguineous families.
    explanation: >-
      The combined cerebellar, oculomotor and extrapyramidal syndrome is the clinical
      signature of this regional distribution.
  - reference: PMID:34147300
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case had brainstem lesions on brain magnetic resonance imaging that have not been
      previously reported.
    explanation: >-
      Direct radiological evidence of brainstem involvement, although reported in a single
      patient.
  downstream:
  - target: Progressive Gait Ataxia
    causal_link_type: DIRECT
    description: Loss of cerebellar cortical output produces gait and limb incoordination.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: Cerebellar involvement of speech motor control.
  - target: Vertical Supranuclear Gaze Palsy
    causal_link_type: DIRECT
    description: Involvement of rostral midbrain supranuclear vertical-gaze pathways.
  - target: Dystonia
    causal_link_type: DIRECT
    description: Basal ganglia involvement.
  - target: Choreoathetosis
    causal_link_type: DIRECT
    description: Basal ganglia involvement producing hyperkinetic movement.
  - target: Cognitive Decline
    causal_link_type: DIRECT
    description: Diffuse cortical and subcortical involvement.
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    description: >-
      Where cerebellar tissue loss is sufficient it becomes visible on MRI, though it
      frequently is not.
mechanistic_hypotheses:
- hypothesis_group_id: nrf2_axis_failure
  hypothesis_label: Blunted KEAP1-NRF2 antioxidant signalling contributes to neuronal loss
  status: EMERGING
  description: >
    Beyond its cargo-receptor role, p62 sequesters KEAP1 and thereby stabilises NRF2. The
    proposal is that complete p62 absence leaves NRF2 under-protected, blunts the antioxidant
    transcriptional programme and lowers the threshold at which stressed cerebellar and
    brainstem neurons decompensate. The supporting biochemistry is established, but only in
    the opposite direction — p62 overproduction stabilising NRF2 — and no NADGP patient or
    patient-derived cell has been assayed for NRF2 target-gene output. The hypothesis is
    curated separately because it is the one mechanistic branch here that would be directly
    therapeutically actionable if confirmed.

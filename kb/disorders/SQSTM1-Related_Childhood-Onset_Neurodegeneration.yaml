      id: UBERON:0002037
      label: cerebellum
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:29959261
    reference_title: "Biallelic SQSTM1 mutations in early-onset, variably progressive neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To characterize clinically and molecularly an early-onset, variably progressive

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To characterize clinically and molecularly an early-onset, variably progressive
      neurodegenerative disorder characterized by a cerebellar syndrome with severe ataxia,
      gaze palsy, dyskinesia, dystonia, and cognitive decline affecting 11 individuals from 3
      consanguineous families.
    explanation: >-
      Describes the established combined syndrome.
- phase: Advanced motor disability
  notes: >
    Slow but relentless progression to loss of independent ambulation, commonly in young
    adulthood, with severe dysarthria. Patients survive into adult life; no disease-specific
    survival data have been published. Progression rate varies between and within families
    for reasons that are unexplained.
diagnosis:
- name: Next-generation sequencing
  description: >
    Diagnosis is made by identifying biallelic loss-of-function SQSTM1 variants on clinical
    exome or genome sequencing. There is no biochemical screening test and no
    disease-specific imaging finding — MRI is frequently normal — so sequencing is the
    definitive step. Every reported family was ascertained this way after an unremarkable
    metabolic and routine workup, which is itself part of the diagnostic pattern.
  diagnosis_term:
    preferred_term: clinical exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:31525130
    reference_title: "Homozygous sequestosome 1 (SQSTM1) mutation: a rare cause for childhood-onset progressive cerebellar ataxia with vertical gaze palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case highlights the importance of next-generation sequencing in the diagnosis of
      inherited ataxia syndromes.
    explanation: >-
      States that next-generation sequencing is the diagnostic route for this presentation.
  - reference: PMID:41307082
    reference_title: "Novel SQSTM1 (c.838G>T) Mutation Identified in Two Unrelated Cases of Cerebellar Ataxia and Gaze Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both cases, initial workup was unremarkable, but whole-exome sequencing revealed a
      novel homozygous pathogenic truncating mutation, SQSTM1 (c.838G>T, p. Glu280Ter).
    explanation: >-
      Shows the diagnostic sequence in practice: unremarkable first-line workup followed by
      exome sequencing that establishes the genetic diagnosis.
- name: p62/SQSTM1 immunoblot on patient-derived cells
  description: >
    Immunoblotting patient fibroblasts or urine-derived cells for p62/SQSTM1 demonstrates
    complete absence of the protein. This is the functional confirmation that a candidate
    allele pair is null, and it is what distinguishes this disorder from the dominant
    SQSTM1 diseases, in which an abnormal protein is present.
  diagnosis_term:
    preferred_term: p62/SQSTM1 immunoblot
    term:
      id: NCIT:C16357
      label: Western Blotting
  evidence:
  - reference: PMID:27545679
    reference_title: "Absence of the Autophagy Adaptor SQSTM1/p62 Causes Childhood-Onset Neurodegeneration with Ataxia, Dystonia, and Gaze Palsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed absence of the SQSTM1/p62 protein in affected individuals' fibroblasts and
      found evidence of a defect in the early response to mitochondrial depolarization and
      autophagosome formation.
    explanation: >-
      Establishes the absent-protein immunoblot result in patient fibroblasts.
  - reference: PMID:39587727
    reference_title: "A Novel Synonymous Variant in SQSTM1 Causes Neurodegeneration With Ataxia, Dystonia, and Gaze Palsy Revealed by Urine-Derived Cells-Based Functional Analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting showed that the SQSTM1 was absent in the UDCs of Patients 1 and 2
    explanation: >-
      The same absent-protein result obtained in a second, non-invasively sampled patient
      cell type.
- name: Urine-derived cell functional assay for variants of uncertain significance
  description: >
    Where sequencing returns a variant whose effect is not obvious — the reported case is a
    synonymous change at the 3' end of exon 6 that in fact abolishes splicing — culturing
    urine-derived cells and assaying SQSTM1 expression resolves it without a skin biopsy.
    NCIT has no clinical-action term for this assay, so no term is bound.
  diagnosis_term:
    preferred_term: urine-derived cell SQSTM1 expression and splicing assay
  evidence:
  - reference: PMID:39587727
    reference_title: "A Novel Synonymous Variant in SQSTM1 Causes Neurodegeneration With Ataxia, Dystonia, and Gaze Palsy Revealed by Urine-Derived Cells-Based Functional Analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An SQSTM1 protein expression assay using urine-derived cells (UDCs) demonstrated that
      both variants (c.1A>G and c.969G>A) were unable to induce normal splicing of
      premessenger RNA.
    explanation: >-
      Demonstrates the assay resolving two variants, one of them a nominally synonymous
      change, into confirmed null alleles.
differential_diagnoses:
- name: Niemann-Pick disease type C
  disease_term:
    preferred_term: Niemann-Pick disease type C
    term:
      id: MONDO:0018982
      label: Niemann-Pick disease type C
  description: >
    The principal phenocopy. Both are autosomal recessive, both begin in childhood or
    adolescence after normal early development, and both combine cerebellar ataxia,
    dysarthria, dystonia and cognitive decline with vertical supranuclear gaze palsy —
    which is the most characteristic sign of Niemann-Pick type C and the oculomotor
    hallmark of this disorder. A child with progressive ataxia and vertical gaze palsy
    should be evaluated for both.
  distinguishing_features:
  - >-
    Niemann-Pick type C is neurovisceral: the neurological syndrome is usually preceded by
    systemic signs, either neonatal cholestatic jaundice or splenomegaly and
    hepatosplenomegaly in infancy and childhood. Biallelic SQSTM1 disease is purely
    neurological and no visceral involvement has been reported in it.
  - >-
    Gelastic cataplexy is a further Niemann-Pick type C discriminator and has never been
    reported in biallelic SQSTM1 disease.
  - >-
    Niemann-Pick type C is confirmed biochemically by filipin staining of cultured
    fibroblasts and by plasma oxysterols, and genetically by NPC1 or NPC2 variants; biallelic
    SQSTM1 disease has no biochemical marker and is confirmed by sequencing alone.
  - >-
    Niemann-Pick type C has a licensed disease-specific therapy in Europe and several other
    countries; biallelic SQSTM1 disease has none, so the distinction changes management.
  evidence:
  - reference: PMID:20525256
    reference_title: "Niemann-Pick disease type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most characteristic sign is vertical supranuclear gaze palsy.
    explanation: >-
      Establishes vertical supranuclear gaze palsy as the characteristic sign of
      Niemann-Pick type C, which is the feature shared with this disorder.
  - reference: PMID:20525256
    reference_title: "Niemann-Pick disease type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      conditions with cerebellar ataxia, dystonia, cataplexy and supranuclear gaze palsy in
      older children and adults
    explanation: >-
      Niemann-Pick type C's own differential is stated as the same clinical combination this
      disorder presents with, so the relationship is symmetric.
  - reference: PMID:22810120
    reference_title: "Vertical supranuclear gaze palsy in Niemann-Pick type C disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VSGP is present in approximately 65 % of the cases and is, with gelastic cataplexy, an
      important risk indicator for NP-C.
    explanation: >-
      Quantifies how often the shared sign occurs in Niemann-Pick type C and names gelastic
      cataplexy as the accompanying discriminator.
- name: Ataxia-telangiectasia and the ataxia with oculomotor apraxia syndromes
  disease_term:
    preferred_term: ataxia telangiectasia
    term:
      id: MONDO:0008840
      label: ataxia telangiectasia
  description: >
    Childhood-onset progressive ataxia with an oculomotor sign is the shared presentation.
    Oculomotor apraxia is reported in this disorder, and it is the defining eye finding of
    ataxia-telangiectasia and the ataxia with oculomotor apraxia syndromes, so those
    conditions were the working diagnoses in reported SQSTM1 patients before sequencing.
  distinguishing_features:
  - >-
    Oculocutaneous telangiectasia, raised serum alpha-fetoprotein, immunodeficiency and
    cancer predisposition mark ataxia-telangiectasia and none of them occurs in biallelic
    SQSTM1 disease.
  - >-
    Telangiectasia and alpha-fetoprotein were explicitly looked for and normal in the
    reported SQSTM1 patients, which is how the two were separated at the bedside before
    sequencing.
  - >-
    Vertical supranuclear gaze palsy is a defining feature of biallelic SQSTM1 disease and
    is not a feature of ataxia-telangiectasia.
  evidence:
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      In ataxia, nystagmus is common, but other findings such as oculomotor apraxia,
      supranuclear gaze palsy, impaired fixation, or saccadic pursuit can contribute to
      diagnoses such as ataxia with oculomotor apraxia, Niemann-Pick type C, or ataxia
      telangiectasia.
    explanation: >-
      Places oculomotor apraxia and supranuclear gaze palsy — both curated as phenotypes
      here — in the diagnostic path toward these conditions. Indirect because it is an
      educational review of eye signs, not a study of SQSTM1 patients.
  - reference: PMID:41307082
    reference_title: "Novel SQSTM1 (c.838G>T) Mutation Identified in Two Unrelated Cases of Cerebellar Ataxia and Gaze Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, myoclonus, chorea, dystonia, and telangiectasia were absent.
    explanation: >-
      Records that telangiectasia was specifically looked for and absent in a SQSTM1
      patient with oculomotor apraxia, which is how the two are separated clinically.
- name: Wilson disease
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  description: >
    A treatable autosomal recessive cause of childhood and adolescent movement disorder
    with dystonia, tremor, dysarthria and cognitive change, so it is screened for in every
    child presenting the way these patients do. Missing it has direct consequences, since
    Wilson disease is treatable and this disorder is not.
  distinguishing_features:
  - >-
    Normal serum copper and ceruloplasmin exclude Wilson disease and were documented in the
    reported SQSTM1 patients.
  - >-
    Kayser-Fleischer rings and hepatic involvement occur in Wilson disease and have not been
    reported in biallelic SQSTM1 disease.
  - >-
    Vertical supranuclear gaze palsy and a progressive cerebellar syndrome point away from
    Wilson disease and toward this disorder.
  evidence:
  - reference: PMID:41307082
    reference_title: "Novel SQSTM1 (c.838G>T) Mutation Identified in Two Unrelated Cases of Cerebellar Ataxia and Gaze Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive laboratory investigations, including hematological parameters, renal and
      liver function tests, serum albumin, thyroid function, cholesterol, triglycerides,
      alpha-fetoprotein, copper, and ceruloplasmin levels, were all within normal limits.
    explanation: >-
      Documents that copper and ceruloplasmin were measured and normal, which is the step
      that excludes Wilson disease in these patients.
  - reference: PMID:35402641
    reference_title: "Eye Movement Disorders in Movement Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Gaze impersistence in a patient with chorea suggests Huntington's disease, but in a
      patient with dystonia or tremor, Wilson's disease is more likely.
    explanation: >-
      Places Wilson disease in the differential reached from the dystonia and tremor curated
      here. Indirect because it is a review of eye signs rather than a SQSTM1 study.
- name: Hereditary chorea syndromes
  description: >
    Chorea and athetosis were the presenting hyperkinetic features in an adolescent-onset
    family, and the authors of that report argue explicitly that this disorder belongs in
    the differential for hereditary chorea alongside Huntington disease and the other
    inherited choreas.
  distinguishing_features:
  - >-
    The inherited choreas are separated from one another by their own genetic tests; no
    clinical feature does it alone.
  - >-
    Chorea accompanied by cerebellar ataxia, vertical supranuclear gaze palsy and either
    consanguinity or affected siblings points toward biallelic SQSTM1 disease.
  - >-
    Chorea occurs in only a minority of reported SQSTM1 patients and is never the whole
    picture, so its absence does not exclude the diagnosis.
  evidence:
  - reference: PMID:39587727
    reference_title: "A Novel Synonymous Variant in SQSTM1 Causes Neurodegeneration With Ataxia, Dystonia, and Gaze Palsy Revealed by Urine-Derived Cells-Based Functional Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our findings suggest that NADGP should be considered as a differential diagnosis of
      hereditary chorea
    explanation: >-
      The authors state the differential-diagnosis relationship directly.
- name: Other inherited childhood-onset cerebellar ataxias
  description: >
    Before the gene was known these children were classified simply as inherited ataxia.
    The combination that should raise this specific diagnosis is progressive cerebellar
    ataxia with an ophthalmological abnormality and cognitive impairment, which the case
    reports converge on as the referral pattern for sequencing.
  distinguishing_features:
  - >-
    No single clinical feature separates this disorder from the other autosomal recessive
    childhood ataxias, and MRI is frequently normal, so the separation is genetic.
  - >-
    Vertical supranuclear gaze palsy together with dystonia narrows the field but does not
    close it.
  evidence:
  - reference: PMID:34147300
    reference_title: "Homozygous SQSTM1 nonsense variant identified in a patient with brainstem involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous SQSTM1 variant should be considered in the differential diagnosis in
      patients presenting with cerebellar findings, gaze palsy, and cognitive impairment to
      facilitate early diagnosis and genetic counseling.
    explanation: >-
      States the clinical trigger for placing this disorder in the inherited-ataxia
      differential.
  - reference: PMID:31525130
    reference_title: "Homozygous sequestosome 1 (SQSTM1) mutation: a rare cause for childhood-onset progressive cerebellar ataxia with vertical gaze palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SQSTM1 mutation should be considered in the differential diagnosis in a patient with
      both cerebellar ataxia and ophthalmological manifestations.
    explanation: >-
      Independently states the same differential-diagnosis rule from a second case report.
treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    Physiotherapy for gait, balance and falls prevention, and maintenance of function as
    ambulation declines. No disease-specific rehabilitation protocol has been published;
    practice mirrors that for other childhood-onset ataxia-dystonia syndromes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Speech and Language Therapy
  description: >
    Management of progressive cerebellar dysarthria and, in later disease, of communication
    and swallowing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
- name: Genetic Counseling
  description: >
    Counselling of consanguineous and carrier couples on the 25% recurrence risk, with
    carrier testing of relatives and prenatal or preimplantation testing once the familial
    variants are known. This is the only intervention with a preventive effect at family
    level.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_mechanisms:
  - target: Biallelic SQSTM1 Loss-of-Function
    description: >-
      Acts on the initiating genetic lesion at the level of recurrence risk rather than in an
      affected individual.
- name: Supportive and Multidisciplinary Care
  description: >
    Multidisciplinary neurological, rehabilitative and educational support, management of
    orthostatic hypotension where dysautonomia is present, and falls prevention. No
    disease-modifying therapy exists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
experimental_models:
- name: Patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >
    Fibroblasts from affected individuals in the index cohort, used to confirm absence of p62
    protein and to assay the response to mitochondrial depolarisation and autophagosome
    formation.
  publication: PMID:27545679
  modeled_mechanisms:
  - target: Absence of p62/Sequestosome-1 Protein
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Direct patient material establishing the complete-absence state at protein level.
    limitations: >-
      Fibroblasts are non-neuronal, so they establish the molecular lesion but not the
      neuron-specific consequences.
    readouts:
    - name: p62/SQSTM1 protein abundance on immunoblot
      target: Absence of p62/Sequestosome-1 Protein
      direction: ABOLISHED
      interpretation: >-
        Absent p62 protein confirms the null state predicted by the biallelic alleles.
      evidence:
      - reference: PMID:27545679
        reference_title: "Absence of the Autophagy Adaptor SQSTM1/p62 Causes Childhood-Onset Neurodegeneration with Ataxia, Dystonia, and Gaze Palsy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We confirmed absence of the SQSTM1/p62 protein in affected individuals' fibroblasts
          and found evidence of a defect in the early response to mitochondrial depolarization
          and autophagosome formation.
        explanation: >-
          Reports the immunoblot measurement behind this readout.
- name: Patient urine-derived cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >
    Urine-derived cells from affected siblings, used as a non-invasive functional assay to
    resolve a variant of uncertain significance — a synonymous change that proved to disrupt
    splicing.
  publication: PMID:39587727
  modeled_mechanisms:
  - target: Absence of p62/Sequestosome-1 Protein
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Establishes that both alleles fail to produce normally spliced SQSTM1 transcript,
      supporting a null state without requiring a skin biopsy.
    limitations: >-
      Non-neuronal, and the assay reports on splicing and protein expression rather than on
      autophagic function.
    evidence:
    - reference: PMID:39587727
      reference_title: "A Novel Synonymous Variant in SQSTM1 Causes Neurodegeneration With Ataxia, Dystonia, and Gaze Palsy Revealed by Urine-Derived Cells-Based Functional Analysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        An SQSTM1 protein expression assay using urine-derived cells (UDCs) demonstrated that
        both variants (c.1A>G and c.969G>A) were unable to induce normal splicing of
        premessenger RNA.
      explanation: >-
        Supports treating urine-derived cells as informative for the p62-absence node.
- name: SQSTM1-knockout human iPSC-derived cortical neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >
    CRISPR knockout of SQSTM1 in human induced pluripotent stem cells differentiated to
    cortical neurons, used to dissect the mitochondrial and autophagic consequences of p62
    loss in a human neuronal context.
  publication: PMID:33891871
  modeled_mechanisms:
  - target: Impaired Mitochondrial Quality Control
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces altered mitochondrial gene expression, respiratory function and autophagic
      flux, and localises the mitophagy lesion to the early PINK1-dependent steps.
    limitations: >-
      Cortical rather than cerebellar or brainstem neuronal identity, an engineered knockout
      rather than patient genotype, and a two-dimensional culture that cannot report the
      region-selective vulnerability that defines the human disease.
    readouts:
    - name: Mitochondrial gene expression and respiratory function
      target: Impaired Mitochondrial Quality Control
      direction: ALTERED
      interpretation: >-
        Mitochondrial function, not mitochondrial clearance, is the affected axis.
      evidence:
      - reference: PMID:33891871
        reference_title: "The role of SQSTM1 (p62) in mitochondrial function and clearance in human cortical neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          These findings suggest that SQSTM1 is important for mitochondrial function rather
          than clearance.
        explanation: >-
          States the direction and nature of the measured mitochondrial change.
    evidence:
    - reference: PMID:33891871
      reference_title: "The role of SQSTM1 (p62) in mitochondrial function and clearance in human cortical neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that SQSTM1 depletion causes altered mitochondrial gene expression and
        functionality, as well as autophagy flux, in iPSC-derived neurons.
      explanation: >-
        Supports treating this model as informative for the mitochondrial quality-control
        node.
- name: Patient iPSC line IGIBi010-A
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >
    An induced pluripotent stem cell line derived from a patient homozygous for the
    p.Leu251SerfsTer4 frameshift allele. It is a resource rather than a completed experiment:
    no disease phenotype has yet been reported from it.
  publication: PMID:39126919
  modeled_mechanisms:
  - target: Absence of p62/Sequestosome-1 Protein
    relationship: MEASURES
    fidelity: UNKNOWN
    description: >-
      Carries a patient null genotype and is available for differentiation into
      disease-relevant neuronal lineages.
    limitations: >-
      A characterised line only. No differentiated phenotype, no isogenic control comparison
      and no functional result have been published, so it cannot yet support a mechanistic
      claim.
    evidence:
    - reference: PMID:39126919
      reference_title: "Generation and characterization of human-derived induced pluripotent stem cell line (IGIBi010-A) from a patient with neurodegenerative disease phenotype carrying mutation in SQSTM1/p62 gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We report here, the generation of induced pluripotent stem cell (iPSC) line
        (IGIBi010-A) carrying a novel homozygous frameshift variant in SQSTM1 i.e.
        p.Leu251SerfsTer4.
      explanation: >-
        Establishes the existence and genotype of the patient-derived line.
animal_models:
- name: Zebrafish sqstm1 knockdown
  species: Zebrafish
  genotype: sqstm1 loss-of-function down-modulation
  publication: PMID:29959261
  description: >
    Down-modulation of sqstm1 in zebrafish, generated specifically to test whether loss of the
    gene damages the cerebellum, in support of the human genetic finding.
  modeled_mechanisms:
  - target: Cerebellar and Brainstem Neuron Proteostatic Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of sqstm1 produces a reproducible cerebellar structural phenotype, tying the gene
      directly to the cerebellar axis of the human disorder.
    limitations: >-
      A larval knockdown, not a stable biallelic null across the lifespan. It has no readout
      for vertical gaze palsy, dystonia or cognitive decline, and it reports cerebellar
      structure rather than the region-selective adult-onset degeneration seen in patients.
    readouts:
    - name: Cerebellar structural integrity
      target: Cerebellar and Brainstem Neuron Proteostatic Stress
      direction: DECREASED
      interpretation: >-
        Cerebellar axonal connectivity and gross structure degrade in proportion to sqstm1
        loss.
      evidence:
      - reference: PMID:29959261
        reference_title: "Biallelic SQSTM1 mutations in early-onset, variably progressive neurodegeneration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The consequences of sqstm1 down-modulation on the structural integrity of the
          cerebellum in zebrafish documented a variable but reproducible phenotype
          characterized by cerebellum anomalies ranging from depletion of axonal connections
          to complete atrophy.
        explanation: >-
          Reports the cerebellar structural measurement behind this readout.
- name: p62/Sqstm1 knockout mouse
  species: Mouse
  genotype: Sqstm1 (p62) constitutive homozygous knockout
  publication: PMID:18346206
  description: >
    The constitutive p62-null mouse. It develops age-dependent neurodegeneration, but by a
    tau-driven route with a systemic metabolic phenotype, neither of which is documented in
    human NADGP.
  modeled_mechanisms:
  - target: Cerebellar and Brainstem Neuron Proteostatic Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that constitutive p62 loss is sufficient to cause neurodegeneration in a
      mammal, which is the claim the human disorder needs from this model.
    limitations: >-
      The mouse phenotype is a tau/neurofibrillary-tangle Alzheimer-like pathology with
      hippocampal and behavioural involvement, plus mature-onset obesity and insulin
      resistance. Human NADGP is a cerebellar-brainstem-basal ganglia syndrome; no tau
      pathology has been examined in patients and no metabolic phenotype is reported. The
      model therefore supports the sufficiency of p62 loss but not the regional pattern or
      the molecular route.
    evidence:
    - reference: PMID:18346206
      reference_title: "Genetic inactivation of p62 leads to accumulation of hyperphosphorylated tau and neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we report age-dependent constitutive activation of glycogen synthase kinase 3beta,
        protein kinase B, mitogen-activated protein kinase, and c-Jun-N-terminal kinase in
        adult p62(-/-) mice resulting in hyperphosphorylated tau, neurofibrillary tangles, and
        neurodegeneration
      explanation: >-
        Supports treating the p62-null mouse as informative for neurodegeneration following
        constitutive p62 loss, while naming the tau route that differs from the human disease.
discussions:
- discussion_id: nadgp_no_human_neuropathology
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which neuronal populations actually degenerate in NADGP, and does the pathology match the
    cerebellar-brainstem-basal ganglia pattern inferred from the clinical syndrome?
  attaches_to:
  - "pathophysiology#Regional Neurodegeneration of Cerebellum, Brainstem and Basal Ganglia"
  rationale: >-
    No autopsy neuropathology has been published for this disorder. The regional map curated
    on that node is read off the clinical syndrome, off MRI that is frequently normal, and off
    model systems — it is not a tissue observation. In particular, Purkinje cell loss is
    assumed rather than shown, which is why this entry conforms only to the trigger node of
    the cerebellar Purkinje degeneration module and not to its degeneration node. Any curator
    tempted to strengthen that edge should note that the evidence to do so does not yet exist.
  proposed_experiments:
  - experiment_id: nadgp_postmortem_neuropathology
    name: Post-mortem neuropathological characterisation of NADGP
    description: >-
      Systematic neuropathological examination of a NADGP brain — cerebellar cortex and deep
      nuclei, rostral midbrain vertical-gaze centres, striatum and pallidum — with
      quantification of Purkinje and granule cell density, ubiquitin and p62 immunostaining,
      and assessment of tau and iron deposition.
    would_support:
    - "pathophysiology#Regional Neurodegeneration of Cerebellum, Brainstem and Basal Ganglia"
    supporting_outcome:
    - >-
      Selective loss of Purkinje and granule neurons with midbrain and striatal involvement,
      matching the clinical syndrome.
    refuting_outcome:
    - >-
      Preserved cerebellar cortical neurons with the pathology localising elsewhere, which
      would require the regional model curated here to be rewritten.
- discussion_id: nadgp_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the defining phenotypes of the p62-null mouse — tau hyperphosphorylation with
    neurofibrillary tangles, and mature-onset obesity with insulin resistance — occur in
    humans with complete p62 absence?
  attaches_to:
  - "pathophysiology#Cerebellar and Brainstem Neuron Proteostatic Stress"
  - "animal_models#Mouse"
  rationale: >-
    The p62-null mouse is the only constitutive mammalian model of this genotype, and it is a
    poor phenotypic match. It develops an Alzheimer-like tauopathy with hippocampal
    involvement, memory impairment and depression-like behaviour, and separately a mature-onset
    obesity and insulin-resistance syndrome. Human NADGP presents in childhood as a cerebellar,
    extrapyramidal and oculomotor disorder; no tau pathology has been looked for in patients
    because no tissue exists, and no metabolic phenotype has been reported in any published
    family. This is evidence that exists in a model whose translational validity is the open
    question, not absent evidence. It matters practically: the tau result has been used to
    argue that p62 is a general anti-tauopathy factor, and importing that framing into NADGP
    would assert a mechanism no patient observation supports.
  evidence:
  - reference: PMID:16517408
    reference_title: "Mature-onset obesity and insulin resistance in mice deficient in the signaling adapter p62."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report here that p62(-/-) mice develop mature-onset obesity, leptin resistance, as
      well as impaired glucose and insulin intolerance.
    explanation: >-
      Documents the mouse metabolic phenotype that has no counterpart in the human disorder.
  - reference: PMID:35662390
    reference_title: "Central role for p62/SQSTM1 in the elimination of toxic tau species in a mouse model of tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In PS19 mice deficient in p62 (PS19/p62-KO), increased accumulation of phosphorylated
      tau, acceleration of neuronal loss, and exacerbation of neuroinflammation were observed
      in the hippocampus as compared with PS19 mice.
    explanation: >-
      Reinforces the mouse tau-centred framing of p62 loss, which is the framing this
      mismatch warns against importing into NADGP.
  proposed_experiments:
  - experiment_id: nadgp_tau_and_metabolic_phenotyping
    name: Tau and metabolic phenotyping of NADGP patients
    description: >-
      Prospective assessment of plasma and CSF phosphorylated-tau species and, where feasible,
      tau PET in genetically confirmed NADGP patients, alongside structured metabolic
      phenotyping for obesity, glucose intolerance and insulin resistance.
    would_refute:
    - "animal_models#Mouse"
    supporting_outcome:
    - >-
      Elevated phosphorylated tau and a metabolic syndrome in patients, which would upgrade
      the mouse from a poor to a fair model.
    refuting_outcome:
    - >-
      Normal tau biomarkers and normal metabolic phenotype, confirming that the mouse
      phenotypes are species-specific and must not be curated as human mechanism.
- discussion_id: nadgp_heterozygote_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are heterozygous carriers of a NADGP truncating allele at increased risk of Paget disease
    of bone or of ALS/frontotemporal dementia, the dominant SQSTM1 disorders?
  attaches_to:
  - "genetic#SQSTM1"
  - "inheritance#Autosomal recessive inheritance"
  rationale: >-
    The dominant SQSTM1 disorders are caused predominantly by missense alleles — the recurrent
    UBA-domain p.Pro392Leu in Paget disease, and missense variants in ALS cohorts — whereas
    every NADGP allele reported is a null. Whether a single null allele confers any risk of the
    dominant phenotypes is unknown: NADGP parents are reported unaffected, but they are young
    relative to the age of onset of Paget disease and ALS and no cohort has been followed. The
    answer determines whether carrier relatives identified during cascade testing need
    surveillance, and it also bears on whether the dominant diseases are haploinsufficiency or
    altered-function disorders.
  evidence:
  - reference: PMID:11992264
    reference_title: "Recurrent mutation of the gene encoding sequestosome 1 (SQSTM1/p62) in Paget disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening SQSTM1/p62 for mutations led to the identification of a recurrent
      nonconservative change (P392L) flanking the ubiquitin-associated domain (UBA) (position
      394-440) of the protein that was not present in 291 control individuals.
    explanation: >-
      Establishes that the dominant Paget allele is a specific UBA-domain missense change, not
      a null — the contrast that makes carrier risk an open rather than settled question.
  - reference: PMID:22084127
    reference_title: "SQSTM1 mutations in familial and sporadic amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 10 novel SQSTM1 mutations (9 heterozygous missense and 1 deletion) in 15
      patients (6 with familial ALS and 9 with sporadic ALS).
    explanation: >-
      Shows the ALS-associated allele spectrum is predominantly heterozygous missense,
      reinforcing the allele-class distinction from NADGP.
  proposed_experiments:
  - experiment_id: nadgp_carrier_cohort_surveillance
    name: Longitudinal surveillance of obligate NADGP carriers
    description: >-
      Assembly of a multi-family cohort of obligate heterozygous carriers of NADGP null alleles
      with longitudinal bone turnover markers, skeletal imaging and neurological assessment,
      compared against age-matched non-carrier relatives.
    would_support:
    - "genetic#SQSTM1"
notes: >-
  Lump/split decision: curated as a standalone DISEASE entry, not as a subtype of any
  existing SQSTM1 entry. The split is by zygosity and allele class. Paget_Disease_of_Bone is
  already curated in this KB and is caused by heterozygous, recurrent UBA-domain missense
  alleles acting in adult bone; ALS/FTD3 is likewise a dominant, predominantly missense,
  adult-onset condition. NADGP is biallelic null, childhood-onset, and neurological, with a
  demonstrated complete-absence protein state that the dominant disorders do not share. The
  two groups have different age of onset, different affected organ system, different allele
  class and different molecular consequence, so a has_subtypes relationship on either
  dominant entry would misstate all four.

  Coverage check performed against kb/ before curating, since a grep hit is not coverage.
  SQSTM1/hgnc:11280 already appears in Paget_Disease_of_Bone (causal, dominant),
  Amyotrophic_Lateral_Sclerosis (on a mechanism node listing autophagy-receptor genes),
  Huntington_Disease (genetic entry with association Pathophysiological Role, not causal),
  and kb/groupings/Macroautophagy_Deficiency_Disorders.yaml (as the representative
  autophagy-receptor gene on the ALS member). MONDO:0014940 was bound nowhere. Elsewhere in
  kb/ — including Myofibrillar_Myopathy and Spinocerebellar_Ataxia_Autosomal_Recessive_31 —
  SQSTM1 appears as the p62 protein in mechanism prose, not as a causal gene. So this entry
  is the first causal binding of SQSTM1 to a recessive phenotype in the KB.

  Module conformance. Two edges are declared and both are deliberate.
  `disabled_macroautophagy#Failure of Cytoplasmic Quality Control` is declared on the
  cargo-recognition node: p62 is the canonical selective-autophagy cargo receptor, and the
  Macroautophagy_Deficiency_Disorders grouping already names SQSTM1 as the representative
  autophagy-receptor gene for exactly this failure point.
  `cerebellar_purkinje_degeneration#Cerebellar Neuron Insult` is declared on the neuronal
  stress node because that module's trigger explicitly admits "impaired protein quality
  control" as one of its heterogeneous initiating lesions and its scope covers autosomal
  recessive ataxias. Conformance is deliberately NOT declared to that module's `Purkinje
  Neuron Degeneration` node: no human neuropathology exists for this disorder, so Purkinje
  cell loss is inferred and not demonstrated. See the nadgp_no_human_neuropathology
  discussion. Conformance to `disabled_macroautophagy#Autophagy Machinery Decline` is also
  not declared — that node is framed as age-associated decline of autophagic capacity, and
  this is a congenital genetic null with no defect in the core machinery.

  Deliberately not curated. No `datasets:` block: no NADGP omics dataset was identified and
  a dataset accession found by searching the gene alone would surface the dominant SQSTM1
  diseases rather than this one, which is the named-entity-confusion trap for this gene. No
  `clinical_trials:` block: no interventional trial for biallelic SQSTM1 disease was found.
  No `environmental:` block: this disorder has no reported environmental contributor,
  trigger or modifier.

  A treatment claim that could not be evidenced. The one published treatment narrative
  (PMID:40728085, de Almeida Marcelino et al.) reports non-response to levodopa/carbidopa,
  baclofen, trihexyphenidyl and tetrabenazine. That record exposes neither abstract nor full
  text in the reference cache, so there is no quotable substring and the claim is recorded
  here in notes rather than curated as a treatment with fabricated evidence. Several other
  case reports in this literature (PMID:38279634, PMID:38532471, PMID:41482852,
  PMID:41708390, PMID:42014241, PMID:42403283) are correspondence-format publications with
  no abstract in the cache and were likewise not used as evidence.

  Orphanet has no dedicated ORPHA code for this entity that could be located, so no ORPHA
  evidence row is cited. The prevalence record is therefore anchored on a published case
  count rather than an Orphanet epidemiology class.

  GeneReviews. Searched PubMed on 2026-09-02 via E-utilities. `SQSTM1[Title] AND
  GeneReviews[Book]` returns nothing; `GeneReviews AND SQSTM1` across all fields returns a
  single record, PMID:20301623 "Amyotrophic Lateral Sclerosis Overview", which covers the
  dominant SQSTM1 disorder and not this recessive entity; and `GeneReviews AND
  ("neurodegeneration with ataxia, dystonia, and gaze palsy" OR NADGP)` returns nothing.
  There is therefore no GeneReviews chapter to tag in `references:`, and the absence is a
  finding rather than an omission — this entity has ~30 published patients and no chapter
  has been commissioned. Re-run the query when the case count grows.

  Phenotypes left out for want of a quotable source. The deep-research report lists urinary
  incontinence and bilateral internuclear ophthalmoplegia in the phenotypic tail. Neither is
  curated: no cached reference in this PR contains the word "incontinence", and the single
  internuclear-ophthalmoplegia report is one of the correspondence-format publications whose
  cache body is empty. Both should be added when a citable source is available.

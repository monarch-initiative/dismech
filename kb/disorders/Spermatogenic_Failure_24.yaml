genetic:
- name: CFAP69
  association: Causal
  gene_term:
    preferred_term: CFAP69
    term:
      id: hgnc:26107
      label: CFAP69
  notes: >-
    Reported alleles are homozygous and truncating: c.763C>T (p.Gln255*) and
    c.860+1G>A (Dong 2018), c.1069_1070insAC (p.Leu357Hisfs*11) and c.647G>A
    (p.Trp216*) (He 2019), and c.2061dup (p.Pro688Thrfs*5) (Tang 2023).
    Biallelic CFAP69 variants accounted for about 2.5 to 5.7% of the MMAF
    cohorts in which they were found. ClinGen has not classified this
    gene-disease pair, so no validity tier is recorded.
  evidence:
  - reference: PMID:29606301
    reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the identification of homozygous truncating mutations (one stop-gain and one splicing variant) in CFAP69 of two unrelated individuals by whole-exome sequencing of a cohort of 78 infertile men with MMAF."
    explanation: Primary gene-disease report.
  - reference: PMID:30415212
    reference_title: "Novel homozygous CFAP69 mutations in humans and mice cause severe asthenoteratospermia with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frameshift mutation (p.Leu357Hisfs*11) was identified in the gene encoding CFAP69 (cilia and flagella-associated protein 69), which is highly expressed in testis."
    explanation: Independent replication in a consanguineous family.
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel frameshift variant in CFAP69 (c.2061dup, p. Pro688Thrfs*5) from a MMAF-affected infertile male with low sperm motility and malformed morphology of sperm."
    explanation: A further family with a truncating allele.
mechanistic_hypotheses:
- hypothesis_group_id: cfap69_sperm_restricted_phenotype
  hypothesis_label: CFAP69 loss causes isolated sperm flagellar failure without respiratory ciliary disease
  status: EMERGING
  description: >-
    All reported men have isolated infertility, and no respiratory, laterality
    or other primary ciliary dyskinesia features have been described. CFAP69
    is preferentially expressed in testis but is also present in olfactory
    sensory neuron cilia in mice, where its loss changes transduction kinetics
    without abolishing ciliary signalling. Whether other cilia in patients are
    affected has not been examined, and the patient series is small.
  evidence:
  - reference: PMID:30415212
    reference_title: "Novel homozygous CFAP69 mutations in humans and mice cause severe asthenoteratospermia with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "a homozygous frameshift mutation (p.Leu357Hisfs*11) was identified in the gene encoding CFAP69 (cilia and flagella-associated protein 69), which is highly expressed in testis."
    explanation: High testicular expression is consistent with a sperm-restricted phenotype.
  - reference: PMID:28495971
    reference_title: "Cilia- and Flagella-Associated Protein 69 Regulates Olfactory Transduction Kinetics in Mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "In the olfactory epithelium, CFAP69 is enriched in OSN cilia, where olfactory transduction occurs."
    explanation: >-
      CFAP69 also acts in olfactory cilia in mice, so the protein is not
      sperm-restricted. Olfactory function has not been tested in patients.
animal_models:
- name: Cfap69 knockout mouse
  species: Mouse
  genotype: Cfap69-/- (knockout), homozygous
  publication: PMID:29606301
  description: >-
    Male Cfap69 knockout mice are infertile with MMAF and severe disruption of
    flagellar structure, while all stages of the seminiferous epithelium are
    present. A second CRISPR-Cas9 knockout gave the same male phenotype.
  modeled_mechanisms:
  - target: Failed Sperm Flagellum Assembly During Spermiogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout reproduces flagellar disruption with preserved earlier spermatogenesis.
    limitations: >-
      Mouse testicular sperm were analyzed, whereas patient findings come from
      ejaculated sperm; the two original patients were oligozoospermic and the
      later ones were not.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse sperm differ from human sperm in head shape and flagellar length,
        so the head defects reported in patients (tapered heads, small
        acrosomes) cannot be read directly off the mouse.
    evidence:
    - reference: PMID:29606301
      reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, we found that sperm from a Cfap69 knockout mouse model recapitulated the MMAF phenotype."
      explanation: The knockout recapitulates human MMAF.
    - reference: PMID:30415212
      reference_title: "Novel homozygous CFAP69 mutations in humans and mice cause severe asthenoteratospermia with multiple morphological abnormalities of the sperm flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Remarkably, male Cfap69-knockout mice manifested with MMAF phenotypes."
      explanation: Independent knockout with the same phenotype.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. In the one CFAP69 couple with a
    reported outcome, eight of ten oocytes were fertilized, three blastocysts
    formed and a frozen-thawed embryo transfer gave a healthy live birth. In a
    mixed MMAF series that included a CFAP69 proband, fertilization and
    pregnancy rates did not differ by genotype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection of a sperm into the oocyte makes flagellar form and motility irrelevant to fertilization.
    evidence:
    - reference: PMID:37392306
      reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following ICSI, eight oocytes got fertilized, six zygotes developed into transferable embryos, and three blastocysts formed at day 5"
      explanation: Sperm with MMAF fertilize oocytes normally when injected.
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After the frozen-thawed embryo transfer, the female partner of L015 proband got pregnant and gave birth to a full-term healthy girl."
    explanation: Live birth after ICSI in a CFAP69 couple.
  - reference: PMID:34529793
    reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The fertilisation rate was not statistically different between the MMAF (65.7%) and the non-MMAF (66.0%) couples and it did not differ according to the genotype or the flagellar phenotype of the subjects or use of the HOS test."
    explanation: >-
      A pooled MMAF series that included a CFAP69 proband; outcomes are not
      reported separately for CFAP69.
- name: Genetic Counseling
  description: >-
    Counselling on autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP69 alleles are known. The authors of the
    ICSI report also advise screening the female partner before ICSI.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the genetic screening of the wives of male patients carrying CFAP69 variants should also be considered before the couple asks for ICSI to reduce the risk of hereditary diseases in offspring."
    explanation: Recommendation for partner screening before ICSI.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis. Probands have been identified by whole-exome
    sequencing or a multigene MMAF panel, with Sanger confirmation. Semen
    analysis and ultrastructure point to a flagellar gene but cannot name it,
    because MMAF is genetically heterogeneous.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing with next-generation sequencing (NGS) panel of 22 MMAF-associated genes and Sanger sequencing was performed in a cohort of 35 infertile males with MMAF to identify pathogenic variants."
    explanation: Panel sequencing identified the causal allele.
  - reference: PMID:29606301
    reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the identification of homozygous truncating mutations (one stop-gain and one splicing variant) in CFAP69 of two unrelated individuals by whole-exome sequencing of a cohort of 78 infertile men with MMAF."
    explanation: Whole-exome sequencing identified the first probands.
- name: Semen Analysis
  description: >-
    Shows severe asthenozoospermia with MMAF; sperm concentration is usually
    normal but can be low.
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, sperm motility, especially progressive motility, was extremely low (sperm motility: 1–9%; progressive motility: 0–3%)."
    explanation: Semen analysis reveals the motility defect.
- name: Transmission Electron Microscopy of Sperm Flagella
  description: >-
    Shows disorganized axonemes and peri-axonemal structures, typically with
    loss of the central pair.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP69-affected sperm displayed as a large cytoplasmic bag in the longitudinal section and presented with disorganized axonemal and peri-axonemal components, such as the absence of CP and the disorder of MT and ODF arrangement."
    explanation: TEM findings in patient sperm.
discussions:
- discussion_id: cfap69_olfaction_in_patients
  kind: KNOWLEDGE_GAP
  attaches_to:
  - mechanistic_hypotheses#cfap69_sperm_restricted_phenotype
  prompt: >-
    Do men with biallelic CFAP69 loss-of-function variants have altered
    olfaction?
  rationale: >-
    In mice CFAP69 is enriched in olfactory sensory neuron cilia, and neurons
    lacking it respond with faster kinetics and the animals perform worse in
    an odor-masked food-finding test. No reported patient has had olfaction
    tested, so whether SPGF24 is purely a sperm disorder in humans is unknown.
  evidence:
  - reference: PMID:28495971
    reference_title: "Cilia- and Flagella-Associated Protein 69 Regulates Olfactory Transduction Kinetics in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "OSNs lacking CFAP69, remarkably, displayed faster kinetics in both the on and off phases of electrophysiological responses at both the neuronal ensemble level as observed by electroolfactogram and the single-cell level as observed by single-cell suction pipette recordings."
    explanation: Mouse olfactory phenotype that has not been examined in patients.

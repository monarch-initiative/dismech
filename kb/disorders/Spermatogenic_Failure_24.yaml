name: Spermatogenic Failure 24
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF24
- spermatogenic failure 24
- CFAP69-related multiple morphological abnormalities of the sperm flagella
- CFAP69-related asthenoteratozoospermia
description: >-
  Spermatogenic failure 24 (SPGF24) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP69 (formerly C7orf63),
  which encodes a testis-enriched cilia- and flagella-associated protein with
  predicted Armadillo-type repeats. In control sperm CFAP69 is concentrated in
  the flagellar midpiece, and its Chlamydomonas orthologue FAP69 is associated
  with the C1b projection of the axonemal central apparatus. All reported
  alleles are truncating (stop-gain, frameshift or splice-site) and abolish or
  sharply reduce the protein in sperm.

  Affected men have severe asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): absent, short, coiled, bent and
  irregular-caliber flagella, near-zero progressive motility, and frequent
  head defects such as tapered heads and abnormal acrosomes. Sperm
  concentration is normal in most patients but was very low in the two
  original probands. Electron microscopy shows disorganized axonemes and
  peri-axonemal structures, typically with loss of the central pair of
  microtubules. Cfap69 knockout mice reproduce MMAF with preserved stages of
  spermatogenesis, placing the defect in spermiogenesis. Respiratory or other
  ciliary disease has not been reported. A live birth after intracytoplasmic
  sperm injection (ICSI) has been reported.
disease_term:
  preferred_term: spermatogenic failure 24
  term:
    id: MONDO:0054728
    label: spermatogenic failure 24
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 617959; the CFAP69 gene entry
  is OMIM 617949. ClinGen has no gene-disease validity classification for
  CFAP69: the ClinGen gene-validity export snapshot of 2026-10-14
  (data/clingen/gene_validity.csv) has no CFAP69 row, and no GeneReviews
  chapter covers this disease (Bookshelf index snapshot 2026-09-10). Five families with
  biallelic CFAP69 variants have been reported in the primary literature
  (PMID:29606301, PMID:30415212, PMID:37392306), and one further proband was
  among the genotyped men in an ICSI outcome series (PMID:34529793). The Dong
  2018 and He 2019 reports are cached as abstracts only. CFAP69 is also
  enriched in olfactory sensory neuron cilia in mice, where its loss speeds
  olfactory transduction kinetics (PMID:28495971); olfaction has not been
  reported in affected men, so no olfactory phenotype is recorded.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP69 variants. All reported genotypes are
    homozygous truncating variants, in consanguineous and non-consanguineous
    families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigree analysis of the family manifested an autosomal recessive inheritance pattern, which is consistent with the previous studies"
    explanation: Recessive segregation of a homozygous frameshift variant in a non-consanguineous family.
  - reference: PMID:30415212
    reference_title: "Novel homozygous CFAP69 mutations in humans and mice cause severe asthenoteratospermia with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted whole exome sequencing in a male individual with MMAF from a consanguineous Han Chinese family."
    explanation: Homozygous variant identified in a consanguineous family, consistent with recessive inheritance.
pathophysiology:
- name: Loss of CFAP69 Protein in Sperm
  description: >-
    Biallelic stop-gain, frameshift and splice-site variants abolish or sharply
    reduce CFAP69 in the sperm flagellum. CFAP69 is concentrated in the
    midpiece of control sperm. Its precise structural role in mammalian sperm
    is not established: it carries predicted Armadillo-type repeats, and its
    Chlamydomonas orthologue is associated with the C1b projection of the
    central apparatus, so it is treated here as a structural component of the
    axoneme.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP69
    term:
      id: hgnc:26107
      label: CFAP69
  molecular_functions:
  - preferred_term: structural molecule activity
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  cellular_components:
  - preferred_term: Sperm midpiece
    term:
      id: GO:0097225
      label: sperm midpiece
  downstream:
  - target: Failed Sperm Flagellum Assembly During Spermiogenesis
    causal_link_type: DIRECT
    description: >-
      Without CFAP69 the flagellum fails to assemble or is not stabilized, while
      earlier stages of spermatogenesis proceed normally.
    evidence:
    - reference: PMID:29606301
      reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ultrastructural analysis of testicular sperm from the knockout mice showed severe disruption of flagellum structure, but histological analysis of testes from these mice revealed the presence of all stages of the seminiferous epithelium, indicating that the overall progression of spermatogenesis is preserved and that the sperm defects likely arise during spermiogenesis."
      explanation: Knockout mice place the defect in spermiogenesis rather than in earlier spermatogenesis.
  evidence:
  - reference: PMID:29606301
    reference_title: "Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of the Flagella in Human and Mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunostaining experiments in sperm from fertile control individuals showed that CFAP69 localized to the midpiece of the flagellum, and the absence of CFAP69 was confirmed in both individuals carrying CFPA69 mutations."
    explanation: Midpiece localization in control sperm and protein absence in both patients' sperm.
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "transmission electron microscopy and immunofluorescence staining revealed that the variant induced the aberrant ultrastructure and reduction of CFAP69 expression in the proband's spermatozoa"
    explanation: Reduced CFAP69 in sperm of a further proband with a homozygous frameshift.
  - reference: PMID:37392306
    reference_title: "A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and a literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "suggested that FAP69 (the orthologue of CFAP69 in C. reinhardtii) is involved in the C1b projection of central pair microtubules in flagella"
    explanation: >-
      Background statement, citing Chlamydomonas work, that places the
      orthologue on a central apparatus projection. It supports treating
      CFAP69 as an axonemal structural component by inference from the alga.
  - reference: PMID:28495971
    reference_title: "Cilia- and Flagella-Associated Protein 69 Regulates Olfactory Transduction Kinetics in Mice."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Bioinformatic analysis suggests that a large portion of CFAP69 can form Armadillo-type α-helical repeats, which may mediate protein-protein interactions."
    explanation: Sequence analysis predicting a repeat fold suited to protein scaffolding rather than an enzymatic activity.
- name: Failed Sperm Flagellum Assembly During Spermiogenesis
  description: >-
    The flagellum is not properly built or stabilized in elongating
    spermatids. Testicular histology in knockout mice shows all stages of the
    seminiferous epithelium, so meiosis and earlier steps are preserved.

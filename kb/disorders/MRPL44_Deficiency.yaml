    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient CMs showed an increase of 2.5-fold in mtDNA copy number compared to controls"
    explanation: >-
      Quantifies the compensatory mtDNA amplification in patient cardiomyocytes. Preprint evidence from
      a single patient iPSC line.
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"

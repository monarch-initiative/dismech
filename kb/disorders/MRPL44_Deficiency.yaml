- name: Combined Complex I and IV Deficiency
  biological_scale: CELLULAR
  description: >
    Because only complexes I, III, IV, and V contain mtDNA-encoded subunits, the
    translation defect produces a combined rather than isolated respiratory chain
    deficiency, with a reproducible emphasis on complex IV and complex I.
    Blue-native PAGE shows incompletely assembled complex I and reduced complex IV
    holocomplex, MT-CO1 protein is reduced while the nuclear-encoded ATP5F1B is
    normal, and high-resolution respirometry shows deficient complex I- and
    complex IV-linked oxygen consumption. The disproportionate complex IV
    involvement is unexplained, since the measured synthesis rates of complex I
    and complex IV subunits are similarly reduced.

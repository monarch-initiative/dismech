    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
      MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found severely reduced MRPL44 levels in the patient's heart, skeletal muscle and fibroblasts
      suggesting that the missense mutation affected the protein stability."
    explanation: >-
      Patient tissue and fibroblast protein measurements show reduced mL44 abundance; altered stability
      is the authors’ interpretation, not a directly measured degradation rate in every tissue.
  - reference: PMID:26221731
    reference_title: "A Role for the Mitochondrial Protein Mrpl44 in Maintaining OXPHOS Capacity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that it can form multimers, and confirm that it is part of the large subunit of
      the mitochondrial ribosome."
    explanation: >-
      Confirms mL44 is a bona fide constituent of the large mitoribosomal subunit that oligomerizes.
  - reference: PMID:26221731
    reference_title: "A Role for the Mitochondrial Protein Mrpl44 in Maintaining OXPHOS Capacity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show by immunofluorescence microscopy and subcellular fractionation that Mrpl44 is localized
      to the matrix of the mitochondria."
    explanation: >-
      Establishes the mitochondrial matrix localization of mL44.
  downstream:
  - target: Large Mitoribosomal Subunit Assembly Defect
    causal_link_type: DIRECT
    description: >-
      Depletion of mL44 removes a structural component of the 39S subunit and
      compromises its assembly and stability.
- name: Large Mitoribosomal Subunit Assembly Defect
  biological_scale: MOLECULAR
  description: >
    Loss of mL44 reduces the amount of assembled large (39S) mitoribosomal
    subunit and destabilizes the mtDNA-encoded 16S rRNA that forms its scaffold,
    while leaving the small (28S) subunit largely intact. Retroviral
    re-expression of wild-type MRPL44 in patient fibroblasts restores the large
    subunit assembly defect, establishing the causal direction.

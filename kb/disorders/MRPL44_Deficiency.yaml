    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show this to be caused by reduced mitochondrial DNA encoded protein synthesis affecting
      all subunits, and resulting in dysfunction of complex I and IV assembly."
    explanation: >-
      Establishes globally reduced mtDNA-encoded protein synthesis as the proximate cause of the OXPHOS
      assembly defects.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The degree of oxidative phosphorylation dysfunction correlated with the impairment of mitochondrial
      protein synthesis due to different pathogenic variants."
    explanation: >-
      The authors report a relation between translation and OXPHOS impairment across two patient genotypes.
      The second translation result was not conventionally significant (p=0.08), and both clinical outcomes
      were fatal; this is not a validated allele-severity scale.
  - reference: PMID:23315540
    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
      MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite this assembly defect, de novo mitochondrial translation was only mildly affected
      in fibroblasts suggesting that MRPL44 may have a function in the assembly/stability of nascent mitochondrial
      polypeptides exiting the ribosome."
    explanation: >-
      Qualifies the translation defect - in fibroblasts of the index family the de novo translation deficit
      was mild, raising an additional peptide-exit chaperoning role for mL44.

- name: Cardiomyocyte Bioenergetic Failure and Mitochondrial Proliferation
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >
    Cardiac muscle shows the most profound enzyme deficiency of any tissue
    examined, with a profound decrease in complex IV, a strong decrease in
    complex I, and incompletely assembled complex V. Electron microscopy of the
    myocardium shows a diffuse proliferation of enlarged, atypically shaped
    mitochondria with aberrant cristae that displace and replace contractile
    elements - the structural correlate of compensatory mitochondrial biogenesis
    failing to restore ATP supply. The result is hypertrophic remodelling and
    progressive contractile failure of the neonatal and infant heart.

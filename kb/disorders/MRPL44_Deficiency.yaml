prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients were described through the two 2021 clinical reports. A Tunisian sibling pair with
    hypertrophic cardiomyopathy was reported in 2025, but their shared delins allele remained formally
    a VUS; they are not counted as two additional molecularly established cases. No population prevalence
    or carrier-frequency estimate is supplied by these case reports.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, five patients have been described with pathogenic variants in MRPL44, encoding
      the ml44 protein which is part of the large subunit of the mitochondrial ribosome (mitoribosome)."
    explanation: >-
      Establishes that only five patients had been published before this 2021 report added two more, confirming
      ultra-rare status.
  - reference: PMID:40402202
    reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44)
      associated with hypertrophic cardiomyopathy in Tunisian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reports a novel MRPL44 variant associated with HCM in a Tunisian family."
    explanation: >-
      Reports another family with HCM and a segregating MRPL44 variant, formally classified as a VUS.
      This is a candidate family, not a confirmed-case prevalence denominator.
progression:
- notes: >
    Variable course. Infantile-onset disease is dominated by rapidly progressive hypertrophic cardiomyopathy;
    cardiac decompensation within the first year of life has been fatal in several reported infants despite
    inotropes, ventricular assist devices, and ECMO. Children who stabilize after the first year may remain
    well with asymptomatic cardiomyopathy into adolescence, and at least one case of spontaneous resolution
    of the cardiomyopathy has been described. Some individuals homozygous for the recurrent p.Leu156Arg
    allele subsequently developed a slowly progressive multisystem phenotype in the second and third decades,
    with myopathy, exercise intolerance, hepatopathy, renal insufficiency, hemiplegic migraine, pigmentary
    retinopathy, and Leigh-like brain MRI lesions. This age-dependent emergence of neurological involvement
    is prognostically important when cardiac transplantation is being considered in infancy. No prospective
    natural-history study, survival estimate, or validated prognostic biomarker exists.
  evidence:
  - reference: PMID:25797485
    reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset
      hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, neurological and neuro-ophthalmological impairment seems to be a disease feature
      of the second and third decades of life, which should be taken into account in patient management
      and counseling."
    explanation: >-
      Documents the delayed, age-dependent onset of neurological and neuro-ophthalmological involvement
      in survivors.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A decompensation of the cardiac function in the first year resulted in demise."
    explanation: >-
      Documents fatal first-year cardiac decompensation in the infantile presentation.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first child died in infancy of cardiac failure following an acute infection, whereas

name: MRPL44 Deficiency
category: Genetic
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- COXPD16
- Combined oxidative phosphorylation deficiency 16
- Combined oxidative phosphorylation defect type 16
- Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
- MRPL44-related mitochondrial disease
description: >-
  MRPL44 deficiency (COXPD16; OMIM #615395; ORPHA:352563) is an autosomal recessive mitochondrial translation
  disorder caused by biallelic pathogenic MRPL44 variants. MRPL44 encodes mL44 in the large mitoribosomal
  subunit. Reduced mL44 abundance and impaired subunit assembly or stability compromise mitochondrial
  protein synthesis and oxidative phosphorylation, particularly complexes I and IV. Tissue and assay effects
  vary: cardiac muscle was most severely affected in the extensively studied infant, whereas fibroblast
  enzymology could be borderline or normal. The clinical spectrum includes rapidly progressive infantile
  hypertrophic cardiomyopathy with hypoglycemia and poor growth, and later cardiac and skeletal myopathy
  with neurological, retinal, renal and hepatic involvement. Cardiac hypertrophy was recognized only at
  age 21 years in one adult. Some children stabilize; later multisystem progression is possible rather
  than inevitable. Supportive cardiac and nutritional treatment is documented. A single-patient iPSC-cardiomyocyte
  preprint proposes nutrient-dependent stress as a contributor to hypertrophy; it does not establish a
  dietary treatment.

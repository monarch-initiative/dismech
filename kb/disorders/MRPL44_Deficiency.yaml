    explanation: >-
      Establishes the quantitative translation assay as a genotype-severity
      readout.
- name: Reduced MT-CO1 protein with preserved nuclear-encoded ATP5F1B
  presence: DECREASED
  context: >
    Western blotting shows reduced MT-CO1 (a mtDNA-encoded complex IV subunit) in
    all tissues examined while the nuclear-encoded ATP synthase subunit ATP5F1B
    is normal - a discriminating pattern that localizes the defect to
    mitochondrial rather than cytosolic translation.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amount of MT-CO1 was decreased in all tissues, but the amount of ATP5FB1 was normal"
    explanation: >-
      Demonstrates selective loss of a mtDNA-encoded subunit with preservation of
      a nuclear-encoded one.
genetic:
- name: MRPL44 biallelic pathogenic variants
  gene_term:
    preferred_term: MRPL44
    term:
      id: hgnc:16650
      label: MRPL44
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    MRPL44 (2q36.1) encodes mL44, a 39S mitoribosomal subunit protein with an
    RNase III-like domain spanning residues 86-228. The three functionally
    characterised disease alleles (p.Leu156Arg, p.Leu156Pro, p.Thr161Serfs*2) lie
    in or immediately adjacent to the conserved hydrophobic pocket of that domain
    and have all been shown to reduce mL44 protein abundance. The remaining two
    reported alleles, p.Arg78Gln and p.(Trp66_His69delinsCysAsn), lie outside the
    RNase III-like domain and have not been functionally assayed, so no protein
    abundance claim is made for them. No validated modifier gene, susceptibility
    locus, or protective allele is known, and no reliable gnomAD allele
    frequencies have been published for the disease alleles.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >
      Disease requires biallelic MRPL44 variants - homozygous in consanguineous
      or founder settings, compound heterozygous otherwise. One reported patient
      became homozygous through complete maternal uniparental isodisomy of
      chromosome 2 rather than by biparental transmission, so a homozygous MRPL44
      result with only one carrier parent should prompt uniparental disomy
      testing (and altered recurrence-risk counselling) rather than being
      dismissed as non-paternity.
    evidence:
    - reference: PMID:23315540
      reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein MRPL44 to underlie mitochondrial infantile cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We investigated the genetic basis for infantile onset recessive hypertrophic cardiomyopathy in two siblings."
      explanation: Establishes recessive inheritance in the index sibship.
    - reference: PMID:33742325
      reference_title: "Uniparental isodisomy of chromosome 2 causing MRPL44-related multisystem mitochondrial disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Short-tandem repeat and genome-wide SNP microarray analyses of the family trio confirmed complete maternal uniparental isodisomy of chromosome 2."
      explanation: >-
        Documents uniparental isodisomy as an alternative route to MRPL44
        homozygosity, with direct counselling implications.
  variants:
  - name: MRPL44 c.467T>G, p.(Leu156Arg)
    description: >
      The recurrent missense allele, present in 9 of the first 10 published
      disease alleles. It is located in the conserved hydrophobic pocket of the
      RNase III-like domain and strongly reduces mL44 protein levels while
      leaving some residual protein and activity. Homozygotes have been reported
      with both fatal infantile cardiomyopathy and with later-onset multisystem
      disease, so genotype alone does not predict the clinical course.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23315540
      reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein MRPL44 to underlie mitochondrial infantile cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing uncovered a homozygous mutation (L156R) in MRPL44 of both siblings."
      explanation: First identification of the recurrent p.Leu156Arg allele.
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant c.467T>G; p.(Leu156Arg) is a commonly recurring causal pathogenic variant present in 9 of 10 alleles published"
      explanation: Quantifies the dominance of this allele in the published cohort.
  - name: MRPL44 c.233G>A, p.(Arg78Gln)
    description: >
      A missense allele identified in compound heterozygosity with the recurrent
      p.Leu156Arg variant in a patient with childhood-onset hypertrophic
      cardiomyopathy plus late multisystem features. No clinical_significance is
      recorded here deliberately: unlike the other four alleles, p.Arg78Gln has
      never been assigned a formal ACMG classification in the literature and has
      not been functionally assayed (no protein-abundance, mitoribosome-assembly,
      or translation data exist for it), so any classification would be curator
      invention rather than a sourced claim.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    evidence:
    - reference: PMID:25797485
      reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified two further unrelated patients harboring the previously reported mutation c.467T > G, p.Leu156Arg in MRPL44 in the homozygous state and compound heterozygous with a novel missense mutation c.233G > A, p.Arg78Gln, respectively."
      explanation: Reports the p.Arg78Gln allele in trans with p.Leu156Arg.
  - name: MRPL44 c.481_484delinsTC, p.(Thr161Serfs*2)
    description: >
      A frameshift allele predicted to trigger nonsense-mediated decay or produce
      a premature stop codon, i.e. a true null. In trans with p.Leu156Arg it
      produced the most severe biochemical phenotype in the published series -
      mitochondrial protein synthesis at roughly a third of controls - and fatal
      infantile cardiomyopathy.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant in Patient 1 c.481_484delinsTC p.Thr161Serfs*2 is predicted to cause either nonsense-mediated mRNA decay or a premature stop codon."
      explanation: Defines this allele as a predicted null.
  - name: MRPL44 c.467T>C, p.(Leu156Pro)
    description: >
      A second substitution at the recurrent Leu156 residue. Proline substitutions
      are strongly disruptive of secondary structure, and this allele results in
      strongly decreased but not absent mL44 protein.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The additional variant in Patient 2 affected the same amino acid Leu156, but the change was to proline instead of arginine."
      explanation: Documents a second pathogenic substitution at the Leu156 hotspot.
  - name: MRPL44 c.198_205delinsTA, p.(Trp66_His69delinsCysAsn)
    description: >
      A homozygous delins allele reported in a Tunisian family with severe
      hypertrophic cardiomyopathy affecting two siblings. It shortens the protein
      and was absent from ClinVar and HGMD at the time of reporting; formal ACMG
      classification was VUS, with pathogenicity supported by co-segregation and
      in silico structural modelling rather than by functional assays.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44) associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proband harboured a homozygous variant, NM_022915.5: c.198_205delinsTA; p.(Trp66_His69 delinsCysAsn), in the MRPL44 gene, leading to a shorter protein."
      explanation: Reports the novel Tunisian allele.
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44) associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: "In silico analysis showed significant structural differences in the mutated mL44 protein, disrupting its interaction with ribosomal complex components and impairing translation and protein synthesis."
      explanation: >-
        Pathogenicity rests on in silico modelling rather than functional assay,
        so the mechanistic claim is scored PARTIAL.
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44) associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant is novel, being absent in ClinVar and Human Gene Mutation Database (HGMD) and classified as VUS according to American College of Medical Genetics and Genomics (ACMG) criteria."
      explanation: Records the formal ACMG classification as VUS.
  evidence:
  - reference: PMID:30384889
    reference_title: "Genetic Basis of Severe Childhood-Onset Cardiomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease genes converge on metabolic causes (PRKAG2, MRPL44, AARS2, HADHB, DNAJC19, PPA2, TAZ, BAG3), MAPK pathways (HRAS, PTPN11, RAF1, TAB2), development (NEK8 and TBX20), calcium signaling (JPH2, CALM1, CACNA1C), and the sarcomeric contraction cycle (TNNC1, TNNI3, ACTC1, MYH7, NRAP)."
    explanation: >-
      A countrywide severe childhood cardiomyopathy cohort places MRPL44 among the
      established metabolic cardiomyopathy genes.
differential_diagnoses:
- name: MRPL3-related combined oxidative phosphorylation deficiency (COXPD9)
  disease_term:
    preferred_term: Combined oxidative phosphorylation defect type 9
    term:
      id: MONDO:0013811
      label: combined oxidative phosphorylation defect type 9
  description: >-
    The closest mimic. MRPL3 encodes another protein of the same large (39S)
    mitoribosomal subunit, so COXPD9 shares the exact mechanism - a mitoribosomal
    translation defect - and presents with infantile-onset severe hypertrophic
    cardiomyopathy, failure to thrive, raised lactate, abnormal liver enzymes and
    a combined respiratory chain deficiency.
  distinguishing_features:
  - >-
    Only molecular testing separates them reliably. COXPD9 characteristically
    involves complexes I, III, IV and V, whereas MRPL44 deficiency shows the
    complex I and IV emphasis; COXPD9 also features prominent psychomotor delay
    and hepatomegaly from infancy, while MRPL44 cognition is typically normal in
    infancy with neurological features deferred to the second and third decades.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2, YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3 [3]."
    explanation: >-
      Lists MRPL3 alongside MRPL44 among the mitochondrial translation genes
      causing cardiomyopathy.
- name: MTO1 deficiency (mitochondrial hypertrophic cardiomyopathy with lactic acidosis)
  disease_term:
    preferred_term: Mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1 deficiency
    term:
      id: MONDO:0013865
      label: mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1 deficiency
  description: >-
    A mitochondrial tRNA-modification (rather than mitoribosomal structural)
    translation defect presenting with infantile hypertrophic cardiomyopathy and
    lactic acidosis. Clinically near-indistinguishable from MRPL44 deficiency at
    presentation, and a documented source of named-entity confusion in the
    literature and in automated curation.
  distinguishing_features:
  - >-
    Molecular. MTO1 acts on mt-tRNA taurinomethyl modification, not on the 39S
    subunit; lactic acidosis is typically more severe and more consistently
    present in MTO1 deficiency, and MTO1 patients more often show early
    encephalopathy.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2, YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3 [3]."
    explanation: Lists MTO1 among the mitochondrial translation cardiomyopathy genes.
- name: Other mitochondrial translation-defect cardiomyopathies
  description: >-
    A broader group of nuclear mitochondrial translation genes causes
    biochemically indistinguishable infantile cardiomyopathy with combined
    respiratory chain deficiency: aminoacyl-tRNA synthetases (AARS2, YARS2, GARS,
    KARS), other mitoribosomal proteins (MRPS22, MRPS14), elongation and assembly
    factors (TSFM, RMND1), and tRNA-modifying enzymes (ELAC2, TRMT5, GTPBP3,
    HSD17B10).
  distinguishing_features:
  - >-
    Not separable on respiratory chain enzymology or muscle histology; requires a
    nuclear mitochondrial gene panel, exome, or genome. This is the practical
    argument for not stopping at a targeted cardiomyopathy panel.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2, YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3 [3]."
    explanation: >-
      Enumerates the mitochondrial translation genes in which cardiomyopathy has
      been described, defining this differential group.
- name: SLC25A3-related cardiomyopathy-hypotonia-lactic acidosis syndrome
  disease_term:
    preferred_term: Cardiomyopathy-hypotonia-lactic acidosis syndrome
    term:
      id: MONDO:0012557
      label: cardiomyopathy-hypotonia-lactic acidosis syndrome
  description: >-
    Mitochondrial phosphate-carrier deficiency presenting with infantile
    hypertrophic cardiomyopathy, hypotonia, and lactic acidosis - overlapping the
    MRPL44 infantile presentation closely enough to be a recognized confusable
    entity.
  distinguishing_features:
  - >-
    Mechanistically distinct: a solute-carrier (substrate import) defect rather
    than a translation defect, so mitochondrial protein synthesis and
    mitoribosome assembly are normal and the respiratory chain deficiency pattern
    differs. Marked hypotonia is a more prominent early feature.
- name: Non-mitochondrial metabolic and sarcomeric infantile cardiomyopathies
  description: >-
    Pompe disease (glycogen storage disease II), Barth syndrome (TAZ),
    fatty-acid-oxidation defects, and primary sarcomeric hypertrophic
    cardiomyopathy all present with infantile or childhood hypertrophic
    cardiomyopathy.
  distinguishing_features:
  - >-
    These are separable without sequencing: Pompe by acid alpha-glucosidase
    enzyme assay and marked creatine kinase elevation; Barth by cyclic
    3-methylglutaconic aciduria, neutropenia and X-linked inheritance;
    fatty-acid-oxidation defects by a diagnostic acylcarnitine profile; sarcomeric
    HCM by dominant inheritance, later onset, and the absence of lactic acidosis
    or combined respiratory chain deficiency.
diagnosis:
- name: Molecular genetic testing of MRPL44
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is molecular. Every reported case was solved by exome sequencing or
    a nuclear mitochondrial-disease/cardiomyopathy panel that includes MRPL44;
    notably, a targeted comprehensive cardiomyopathy panel was non-diagnostic in
    one infant, so a mitochondrial-inclusive panel or trio exome is preferred.
    When a homozygous variant appears with only one carrier parent, add
    short-tandem-repeat and SNP-microarray testing for uniparental disomy.
  results: >-
    Biallelic (homozygous or compound heterozygous) pathogenic MRPL44 variants
    confirm the diagnosis.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing demonstrated compound heterozygosity for pathogenic variants in the MRPL44 gene"
    explanation: Documents exome sequencing as the confirmatory diagnostic test.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a comprehensive cardiomyopathy sequencing panel did not report any variants."
    explanation: >-
      Important diagnostic caveat - a standard cardiomyopathy gene panel missed
      the diagnosis, arguing for exome or a mitochondrial-inclusive panel.
- name: Respiratory chain enzymology of heart and skeletal muscle
  diagnosis_term:
    preferred_term: respiratory chain enzyme assay
  description: >-
    Spectrophotometric respiratory chain enzyme activities showing a combined
    complex I and IV deficiency support the diagnosis, but the yield is strongly
    tissue-dependent: the defect is profound in myocardium, intermediate in
    skeletal muscle, and only borderline in fibroblasts. A normal fibroblast
    whole-cell homogenate does NOT exclude MRPL44 deficiency - in one patient the
    complex IV deficit was apparent only in a mitochondrial isolate.
  results: >-
    Combined deficiency of complexes I and IV, most marked in cardiac tissue.
  evidence:
  - reference: PMID:23315540
    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of respiratory chain enzymes revealed a combined deficiency of complexes I and IV in the heart and skeletal muscle."
    explanation: Establishes the diagnostic biochemical signature.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In fibroblasts the respiratory chain enzyme activities were normal in the 600 × g homogenate, but showed low complex IV activity in a mitochondrial isolate."
    explanation: >-
      Documents the false-negative risk of fibroblast whole-homogenate
      enzymology.
- name: Skeletal muscle biopsy with mitochondrial histochemistry
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle biopsy shows ultrastructurally abnormal mitochondria, but the routine
    mitochondrial-myopathy histochemical markers can be entirely absent, so a
    normal Gomori trichrome and COX stain does not exclude the diagnosis.
  results: >-
    Abnormal mitochondria with granular content and abnormal cristae, without
    ragged red/blue fibers and without COX-negative fibers.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gomori trichrome staining did not reveal ragged blue fibers, and there were no cytochrome c oxidase negative fibers."
    explanation: >-
      Establishes that the standard mitochondrial myopathy histochemical markers
      may be absent in MRPL44 deficiency.
- name: Mitochondrial protein synthesis (translation) assay
  diagnosis_term:
    preferred_term: mitochondrial translation assay
  description: >-
    A specialist functional assay measuring 35S-amino-acid incorporation into
    mtDNA-encoded polypeptides in patient fibroblasts. It both confirms the
    translation defect and grades allele severity, which is useful for
    classifying novel MRPL44 variants.
  results: >-
    Reduced incorporation of labelled amino acids into mtDNA-encoded
    polypeptides, proportional to the severity of the genotype.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The degree of oxidative phosphorylation dysfunction correlated with the impairment of mitochondrial protein synthesis due to different pathogenic variants."
    explanation: >-
      Supports the translation assay as a genotype-severity readout usable for
      variant interpretation.
- name: Echocardiography
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography establishes and monitors the defining cardiac phenotype and
    is the basis for surveillance in at-risk siblings and in survivors of the
    infantile presentation.
  results: >-
    Left ventricular hypertrophy with variably depressed ejection fraction.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an echocardiogram revealed an ejection fraction of 25% (normal 55–70%) with left ventricular dysfunction and hypertrophy"
    explanation: Documents the echocardiographic findings that define the cardiac phenotype.
treatments:
- name: Supportive Heart Failure Management
  description: >
    No disease-modifying therapy exists. Care is supportive and cardiac-directed:
    beta blockade and standard anti-failure pharmacotherapy, nutritional support
    via nasogastric or gastrostomy feeding, avoidance of catabolic stress, and
    surveillance echocardiography. Intercurrent infection is a recognized trigger
    of fatal cardiac decompensation.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient responded well to treatment and was discharged at 71 days of life while being treated with beta blockers and receiving feeding mainly via gastrostomy tube."
    explanation: >-
      Documents beta blockade and enteral nutritional support as the initial
      management, with initial clinical response.
- name: Beta Blocker Therapy
  description: >
    Beta blockade is the specific anti-failure pharmacotherapy documented in
    MRPL44 deficiency; an affected infant was discharged on beta blockers with
    gastrostomy feeding after an initial clinical response, although the
    cardiomyopathy later decompensated fatally.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient responded well to treatment and was discharged at 71 days of life while being treated with beta blockers and receiving feeding mainly via gastrostomy tube."
    explanation: >-
      Documents beta blockade in an affected infant with an initial response.
      Scored PARTIAL - this is single-case, uncontrolled use extrapolated from
      general pediatric heart failure practice, not MRPL44-specific efficacy data.
- name: Genetic Counseling
  description: >
    Autosomal recessive counselling with a specific caveat: one reported patient
    was homozygous through complete maternal uniparental isodisomy of chromosome
    2 rather than biparental transmission. A homozygous MRPL44 result with only
    one carrier parent should therefore prompt uniparental disomy testing, since
    the recurrence risk differs substantially from the standard 25%.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33742325
    reference_title: "Uniparental isodisomy of chromosome 2 causing MRPL44-related multisystem mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short-tandem repeat and genome-wide SNP microarray analyses of the family trio confirmed complete maternal uniparental isodisomy of chromosome 2."
    explanation: >-
      Establishes uniparental isodisomy as a documented route to homozygosity in
      MRPL44 disease, which directly changes recurrence-risk counselling.
- name: Mechanical Circulatory Support
  description: >
    Ventricular assist device placement and venoarterial extracorporeal membrane
    oxygenation have been used aggressively in infants with MRPL44-related
    cardiogenic shock, on the rationale that some patients stabilize after the
    first year. In the published case this did not prevent death from multiorgan
    failure and opportunistic infection, so the benefit is unproven.
  treatment_term:
    preferred_term: ventricular assist device placement
    term:
      id: NCIT:C80452
      label: Ventricular Assist Device Placement
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Progressive Heart Failure
    treatment_effect: INHIBITS
    description: >-
      Mechanical unloading substitutes for the failing bioenergetically depleted
      myocardium; it does not correct the underlying translation defect.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aggressive management including left ventricle assist device was performed in the case presented here."
    explanation: Documents the use of mechanical circulatory support and its rationale.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "She remained in cardiogenic shock and hepatic failure, and ultimately developed disseminated Candida lusitanease infection which resulted in her death two days after her first birthday."
    explanation: >-
      Shows that mechanical support did not rescue the reported infant, so
      efficacy is unestablished.
- name: Cardiac Transplantation
  description: >
    Cardiac transplantation has been explicitly considered for infantile
    MRPL44-related cardiomyopathy, since the heart bears the most severe
    biochemical defect. The counterargument, which must be discussed at the time
    of listing, is that the same OXPHOS deficiency persists in all other tissues
    and can produce progressive neurological, ophthalmological, renal, and
    hepatic disease in the second and third decades.
  treatment_term:
    preferred_term: heart transplantation
    term:

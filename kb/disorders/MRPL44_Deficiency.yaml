- name: Combined Complex I and IV Deficiency
  biological_scale: CELLULAR
  description: >-
    Combined respiratory-chain deficiency emphasizes complexes I and IV but varies by patient, tissue
    and preparation. Patient 1 had profound cardiac complex IV and strong complex I deficiency, milder
    muscle deficits and borderline fibroblast complex IV activity, with abnormal complex I/V assembly.
    Patient 2 had multiple muscle deficiencies but normal fibroblast complex I/V assembly and complex
    IV holocomplex; complex IV activity was low only in the mitochondrial isolate. Reduced synthesis of
    mtDNA-encoded subunits supports the OXPHOS defect, but does not fully explain disproportionate complex
    IV involvement.

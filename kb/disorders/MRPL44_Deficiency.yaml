      at the time of publication at age 14 years"
    explanation: >-
      Illustrates the marked intrafamilial variability in course between siblings carrying the same genotype.
mechanistic_hypotheses:
- hypothesis_group_id: nutrient_dependent_postnatal_manifestation
  hypothesis_label: >-
    Postnatal glucose-to-fatty-acid fuel switch as the trigger for
    MRPL44 cardiomyopathy manifestation
  status: EMERGING
  description: >-
    A single-patient preprint proposes that nutrient-dependent mitochondrial stress contributes to perinatal
    hypertrophy. One homozygous p.Leu156Arg iPSC line was compared with three healthy donor lines, without
    an isogenic correction. The 72-hour media comparison used 2 g/L glucose versus 1 g/L glucose with
    oleate 100 μM and palmitate 50 μM, not glucose-free fatty-acid conditions. In glucose-rich medium,
    mtDNA copy number, mitochondrial area and transcripts increased despite reduced complex I protein.
    Lipid-enriched medium induced mitochondrial and partial ER stress, with XBP1 expression but no splicing
    and no FGF21 induction. Transcript-based mTOR prediction and inferred lipid utilization do not measure
    mTOR activity or fatty-acid oxidation flux. The proposed contribution to hypertrophic growth remains
    provisional and does not justify dietary treatment.
  evidence:
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These observations provide a mechanistic basis for postnatal disease manifestation and highlight
      nutrient metabolism as a key driver in development of infantile-onset mitochondrial hypertrophic
      cardiomyopathy."
    explanation: >-
      States the hypothesis directly. Preprint, one patient iPSC line, awaiting peer review and replication.
pathophysiology:
- name: Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
  biological_scale: MOLECULAR
  description: >-
    Pathogenic MRPL44 genotypes reduce steady-state mL44 abundance in examined patient tissues and fibroblasts.
    The recurrent p.Leu156Arg allele is associated with protein instability. The p.Thr161Serfs*2 allele
    is predicted to be null; p.Leu156Pro was observed in trans with p.Leu156Arg, so residual protein cannot
    be assigned specifically to the proline allele. These functional observations are not extended to
    the p.Arg78Gln or 2025 delins alleles. mL44 is a mitochondrial large-subunit protein; murine-expression
    experiments support matrix localization and multimer formation.

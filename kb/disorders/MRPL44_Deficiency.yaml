    reference_title: A Role for the Mitochondrial Protein Mrpl44 in Maintaining OXPHOS Capacity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: |-
      qRT-PCR analysis for mitochondrial versus nuclear DNA found that altered Mrpl44 expres-
      sion had no impact on the mitochondrial DNA content of cells ( S4 Fig).
    explanation: >-
      Murine NIH3T3 knockdown/overexpression did not alter mtDNA content. This system-specific counterpoint
      limits generalization of the human cardiomyocyte result, without asserting absence of the response
      in MRPL44 patients.
    directness: INDIRECT
- name: Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
  biological_scale: CELLULAR
  description: >-
    Lipid-enriched medium induced mitochondrial stress-response and partial ER-stress transcripts in the
    p.Leu156Arg iPSC-cardiomyocyte line, with lipid droplets and altered lipid-uptake/cholesterol genes.
    ATF5 targets increased; FGF21 induction and XBP1 splicing were absent. Fatty-acid utilization was
    inferred from these data rather than directly measured as oxidation flux. Ingenuity pathway analysis
    predicted mTOR changes; direct mTORC1 activation was not measured. The authors propose that nutrient-dependent
    stress promotes hypertrophic growth, a preprint hypothesis requiring replication and in-vivo testing.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast the lipid-enriched medium triggered both mitochondrial and endoplasmic reticulum
      -related stress responses, disrupted lipid and cholesterol homeostasis, accompanied by remodeling
      of the central biosynthetic pathway of one carbon metabolism."
    explanation: >-
      Documents the nutrient-conditional stress response. Preprint, in vitro, single patient line.
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cells accumulated lipids while also inducing lipid uptake and synthesis genes, suggesting
      maladaptive metabolic rewiring."
    explanation: >-
      Documents the maladaptive lipid handling in mutant cardiomyocytes.
  downstream:

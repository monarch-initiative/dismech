- name: Failed Compensatory mtDNA Replication and Transcription
  biological_scale: CELLULAR
  description: >
    In MRPL44-mutant patient iPSC-derived cardiomyocytes grown in glucose-rich
    (fetal-like) medium, mtDNA copy number rises about 2.5-fold and mtDNA-encoded
    transcripts - particularly complex I and complex V subunits - are strongly
    induced, with increased mitochondrial content per cell. Despite this
    transcriptional and replicative upregulation, steady-state complex I protein
    remains markedly reduced: the cell mounts a mitochondrial biogenesis response
    that operates upstream of, and therefore cannot bypass, the translation
    block. This is the cellular counterpart of the mitochondrial proliferation
    seen ultrastructurally in patient myocardium.

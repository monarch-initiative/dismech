name: MRPL44 Deficiency
category: Genetic
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- COXPD16
- Combined oxidative phosphorylation deficiency 16
- Combined oxidative phosphorylation defect type 16
- Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
- MRPL44-related mitochondrial disease
description: >
  Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency (COXPD16;
  OMIM #615395; ORPHA:352563) is an ultra-rare autosomal recessive disorder of
  mitochondrial translation caused by biallelic pathogenic variants in MRPL44,
  which encodes mL44, a eukaryote-specific structural protein of the large (39S)
  subunit of the mitochondrial ribosome located near the peptide exit tunnel.
  Loss of mL44 destabilizes the large mitoribosomal subunit and 16S rRNA,
  reducing synthesis of the thirteen mtDNA-encoded respiratory chain subunits
  and producing a combined oxidative phosphorylation deficiency with a
  characteristic emphasis on complexes I and IV. The biochemical defect is
  markedly tissue-graded - most severe in heart muscle, intermediate in skeletal
  muscle, and borderline in fibroblasts - which explains the cardiac-dominant
  clinical presentation. Affected children present in the neonatal period or
  infancy with hypertrophic cardiomyopathy, mild lactic acidosis, hypoglycemia,
  failure to thrive, and easy fatigue with muscle weakness; cardiac
  decompensation in the first year is often fatal. Individuals who survive
  infancy can develop a slowly progressive multisystem phenotype in the second
  and third decades with hepatopathy, renal insufficiency, myopathy, hemiplegic
  migraine, pigmentary retinopathy, and Leigh-like lesions of the thalami, basal
  ganglia and cerebellum on brain MRI. Fewer than a dozen patients have been
  reported worldwide; the recurrent missense allele c.467T>G, p.(Leu156Arg)
  accounts for the majority of published alleles. No disease-modifying therapy
  exists and management is supportive and cardiac-directed. Note that no
  MRPL44-specific GeneReviews chapter exists; the GeneReviews-tagged reference in
  this entry is the umbrella Primary Mitochondrial Disorders Overview and was not
  used as a phenotype baseline, since its abstract contains no MRPL44-specific
  clinical characteristics.

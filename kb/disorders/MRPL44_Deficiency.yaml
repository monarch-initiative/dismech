- name: Abnormal Skeletal Muscle Mitochondria without Ragged Red Fibers
  description: >
    Skeletal muscle shows abnormal mitochondria with granular content and
    abnormal cristae, and enlarged mitochondria in some fibers. Notably, Gomori
    trichrome staining did not reveal ragged blue fibers and there were no
    cytochrome c oxidase-negative fibers, so routine mitochondrial muscle
    histochemistry can be unrevealing in MRPL44 deficiency.

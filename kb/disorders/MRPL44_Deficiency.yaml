- name: Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
  biological_scale: CELLULAR
  description: >
    Under lipid-enriched (postnatal-like) conditions, MRPL44-mutant iPSC
    cardiomyocytes activate the mitochondrial integrated stress response (ISRmt)
    - ATF5 with its targets TRIB3, ASNS, MTHFD2 and GDF15, plus DDIT3, the de
    novo serine biosynthesis genes PSAT1/PSPH and CEBPG - alongside partial ER
    stress (HERPUD1, NUPR1, XBP1, CHAC1, HSPA5, without XBP1 splicing). FGF21
    induction is notably absent. The cells simultaneously accumulate lipid
    droplets and upregulate lipid-uptake and cholesterol-synthesis genes, a
    maladaptive rewiring that the authors link to persistent anabolic signaling
    rather than to ATP deficiency alone. This node is hypothesis-tagged:
    the evidence is preprint, in vitro, and from one patient genotype.

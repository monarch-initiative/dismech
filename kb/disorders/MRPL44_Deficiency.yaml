- name: Failed Compensatory mtDNA Replication and Transcription
  biological_scale: CELLULAR
  description: >-
    In glucose-rich medium, a single p.Leu156Arg patient iPSC-cardiomyocyte line showed about 2.5-fold
    higher mtDNA copy number, elevated mitochondrial transcripts and increased mitochondrial content,
    despite reduced complex I protein. Compensation is the authors’ interpretation of these readouts.
    The observations do not demonstrate that increased DNA replication itself causes the stress response
    seen under a different nutrient condition, or that all patient tissues share this response.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:

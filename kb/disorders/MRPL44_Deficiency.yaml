      allele.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Fewer translationally competent mitoribosomes reduce the rate of synthesis
      of mtDNA-encoded polypeptides.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  description: >-
    Patient fibroblast assays demonstrate reduced mtDNA-encoded protein synthesis, with variation by genotype
    and assay. In the 2021 series, Patient 1 retained 33% of control incorporation (p<0.01) and Patient
    2 56% (p=0.08). This two-patient comparison suggests residual-function differences but does not validate
    clinical severity prediction; both infants died. The original family had a milder fibroblast translation
    defect despite impaired large-subunit assembly, raising an additional nascent-polypeptide stability
    hypothesis.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:

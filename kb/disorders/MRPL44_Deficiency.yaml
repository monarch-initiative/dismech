    description: >-
      Cardiomyocytes respond to the translation block by amplifying mtDNA and
      mitochondrial transcripts, a response that cannot restore protein output.
      Hypothesis-tagged: rests on a single unreviewed patient iPSC-cardiomyocyte
      study, and a mouse NIH3T3 knockdown study found no mtDNA copy-number effect.
  - target: Combined Complex I and IV Deficiency

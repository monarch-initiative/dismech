- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  description: >
    The assembly defect lowers mitochondrial protein synthesis, measured by
    35S-amino-acid incorporation into mtDNA-encoded polypeptides in patient
    fibroblasts. The reduction affects all thirteen mtDNA-encoded subunits rather
    than a single complex, and its magnitude tracks the severity of the
    underlying genotype - a null/missense compound heterozygote had roughly a
    third of control incorporation, while a missense/missense compound
    heterozygote retained more. mL44 sits at the peptide exit tunnel, and the
    original report noted the assembly defect exceeded the de novo translation
    defect in fibroblasts, suggesting an additional role in the folding or
    stability of nascent polypeptides as they leave the ribosome.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED

- name: Systemic Energy Deficit and Late Multisystem Involvement
  biological_scale: ORGANISM
  description: >
    Outside the heart the same combined OXPHOS deficiency produces a
    lower-grade, cumulative energy deficit. In skeletal muscle it manifests as
    exercise intolerance, easy fatigue, and myopathy; in liver as steatosis with
    elevated transaminases; in kidney as renal insufficiency; and in the central
    nervous system and retina - typically only in the second and third decades -
    as hemiplegic migraine, transient hemiparesis and confusion, spasticity,
    ataxia, pigmentary retinopathy, and Leigh-like lesions of the thalami, basal
    ganglia, midbrain and cerebellum.

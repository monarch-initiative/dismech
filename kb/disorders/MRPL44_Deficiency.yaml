    86–228. Patient genotypes containing p.Leu156Arg, p.Leu156Pro or p.Thr161Serfs*2 showed reduced mL44
    abundance; the compound-heterozygous assays did not resolve residual protein from each individual
    allele. The p.Arg78Gln allele and the 2025 p.(Trp66_His69delinsCysAsn) allele lie outside that domain.
    The reviewed sources do not establish allele-specific protein-abundance effects for them; the 2025
    delins interpretation is computational and its formal classification remains VUS. These case reports
    do not establish population allele frequencies or validated modifier effects.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >
      Disease requires biallelic MRPL44 variants - homozygous in consanguineous
      or founder settings, compound heterozygous otherwise. One reported patient
      became homozygous through complete maternal uniparental isodisomy of
      chromosome 2 rather than by biparental transmission, so a homozygous MRPL44
      result with only one carrier parent should prompt uniparental disomy
      testing (and altered recurrence-risk counselling) rather than being
      dismissed as non-paternity.
    evidence:
    - reference: PMID:23315540
      reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
        MRPL44 to underlie mitochondrial infantile cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We investigated the genetic basis for infantile onset recessive hypertrophic cardiomyopathy
        in two siblings."
      explanation: >-
        Establishes recessive inheritance in the index sibship.
    - reference: PMID:33742325
      reference_title: "Uniparental isodisomy of chromosome 2 causing MRPL44-related multisystem mitochondrial
        disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Short-tandem repeat and genome-wide SNP microarray analyses of the family trio confirmed
        complete maternal uniparental isodisomy of chromosome 2."
      explanation: >-
        Documents uniparental isodisomy as an alternative route to MRPL44 homozygosity, with direct counselling
        implications.
  variants:
  - name: MRPL44 c.467T>G, p.(Leu156Arg)
    description: >
      The recurrent missense allele, present in 9 of the first 10 published
      disease alleles. It is located in the conserved hydrophobic pocket of the
      RNase III-like domain and strongly reduces mL44 protein levels while
      leaving some residual protein and activity. Homozygotes have been reported
      with both fatal infantile cardiomyopathy and with later-onset multisystem
      disease, so genotype alone does not predict the clinical course.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23315540
      reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
        MRPL44 to underlie mitochondrial infantile cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing uncovered a homozygous mutation (L156R) in MRPL44 of both siblings."
      explanation: >-
        First identification of the recurrent p.Leu156Arg allele.
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
        translation defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant c.467T>G; p.(Leu156Arg) is a commonly recurring causal pathogenic variant
        present in 9 of 10 alleles published"
      explanation: >-
        Quantifies the dominance of this allele in the published cohort.
  - name: MRPL44 c.233G>A, p.(Arg78Gln)
    description: >
      A missense allele identified in compound heterozygosity with the recurrent
      p.Leu156Arg variant in a patient with childhood-onset hypertrophic
      cardiomyopathy plus late multisystem features. No clinical_significance is
      recorded here deliberately: unlike the other four alleles, p.Arg78Gln has
      never been assigned a formal ACMG classification in the literature and has
      not been functionally assayed (no protein-abundance, mitoribosome-assembly,
      or translation data exist for it), so any classification would be curator
      invention rather than a sourced claim.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    evidence:
    - reference: PMID:25797485
      reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset
        hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified two further unrelated patients harboring the previously reported mutation
        c.467T > G, p.Leu156Arg in MRPL44 in the homozygous state and compound heterozygous with a novel
        missense mutation c.233G > A, p.Arg78Gln, respectively."
      explanation: >-
        Reports the p.Arg78Gln allele in trans with p.Leu156Arg.
  - name: MRPL44 c.481_484delinsTC, p.(Thr161Serfs*2)
    description: >
      A frameshift allele predicted to trigger nonsense-mediated decay or produce
      a premature stop codon, i.e. a true null. In trans with p.Leu156Arg it
      produced the most severe biochemical phenotype in the published series -
      mitochondrial protein synthesis at roughly a third of controls - and fatal
      infantile cardiomyopathy.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
        translation defect."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The variant in Patient 1 c.481_484delinsTC p.Thr161Serfs*2 is predicted to cause either
        nonsense-mediated mRNA decay or a premature stop codon."
      explanation: >-
        Defines this allele as a predicted null.
  - name: MRPL44 c.467T>C, p.(Leu156Pro)
    description: >-
      A second substitution at Leu156, observed in trans with p.Leu156Arg. The authors predict a disruptive
      proline substitution. Reduced mL44 abundance was measured in the compound-heterozygous cells, without
      assigning residual protein specifically to the proline allele.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34140213
      reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
        translation defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The additional variant in Patient 2 affected the same amino acid Leu156, but the change
        was to proline instead of arginine."
      explanation: >-
        Documents a second pathogenic substitution at the Leu156 hotspot.
  - name: MRPL44 c.198_205delinsTA, p.(Trp66_His69delinsCysAsn)
    description: >
      A homozygous delins allele reported in a Tunisian family with severe
      hypertrophic cardiomyopathy affecting two siblings. It shortens the protein
      and was absent from ClinVar and HGMD at the time of reporting; formal ACMG
      classification was VUS, with pathogenicity supported by co-segregation and
      in silico structural modelling rather than by functional assays.
    gene:
      preferred_term: MRPL44
      term:
        id: hgnc:16650
        label: MRPL44
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44)
        associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proband harboured a homozygous variant, NM_022915.5: c.198_205delinsTA; p.(Trp66_His69
        delinsCysAsn), in the MRPL44 gene, leading to a shorter protein."
      explanation: >-
        Reports the novel Tunisian allele.
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44)
        associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "In silico analysis showed significant structural differences in the mutated mL44 protein,
        disrupting its interaction with ribosomal complex components and impairing translation and protein
        synthesis."
      explanation: >-
        Pathogenicity rests on in silico modelling rather than functional assay, so the mechanistic claim
        remains an untested computational prediction.
    - reference: PMID:40402202
      reference_title: "A novel likely pathogenic variant in the mitochondrial ribosomal protein L44 (MRPL44)
        associated with hypertrophic cardiomyopathy in Tunisian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant is novel, being absent in ClinVar and Human Gene Mutation Database (HGMD)
        and classified as VUS according to American College of Medical Genetics and Genomics (ACMG) criteria."
      explanation: >-
        Records the formal ACMG classification as VUS.
  evidence:
  - reference: PMID:30384889
    reference_title: "Genetic Basis of Severe Childhood-Onset Cardiomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease genes converge on metabolic causes (PRKAG2, MRPL44, AARS2, HADHB, DNAJC19, PPA2,
      TAZ, BAG3), MAPK pathways (HRAS, PTPN11, RAF1, TAB2), development (NEK8 and TBX20), calcium signaling
      (JPH2, CALM1, CACNA1C), and the sarcomeric contraction cycle (TNNC1, TNNI3, ACTC1, MYH7, NRAP)."
    explanation: >-
      A countrywide severe childhood cardiomyopathy cohort places MRPL44 among the established metabolic
      cardiomyopathy genes.
differential_diagnoses:
- name: MRPL3-related combined oxidative phosphorylation deficiency (COXPD9)
  disease_term:
    preferred_term: Combined oxidative phosphorylation defect type 9
    term:
      id: MONDO:0013811
      label: combined oxidative phosphorylation defect type 9
  description: >-
    The closest mimic. MRPL3 encodes another protein of the same large (39S)
    mitoribosomal subunit, so COXPD9 shares the exact mechanism - a mitoribosomal
    translation defect - and presents with infantile-onset severe hypertrophic
    cardiomyopathy, failure to thrive, raised lactate, abnormal liver enzymes and
    a combined respiratory chain deficiency.
  distinguishing_features:
  - >-
    Only molecular testing separates them reliably. COXPD9 characteristically
    involves complexes I, III, IV and V, whereas MRPL44 deficiency shows the
    complex I and IV emphasis; COXPD9 also features prominent psychomotor delay
    and hepatomegaly from infancy, while MRPL44 cognition is typically normal in
    infancy with neurological features deferred to the second and third decades.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2,
      YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3
      [3]."
    explanation: >-
      Lists MRPL3 alongside MRPL44 among the mitochondrial translation genes causing cardiomyopathy.
- name: MTO1 deficiency (mitochondrial hypertrophic cardiomyopathy with lactic acidosis)
  disease_term:
    preferred_term: Mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1
      deficiency
    term:
      id: MONDO:0013865
      label: mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1 deficiency
  description: >-
    A mitochondrial tRNA-modification (rather than mitoribosomal structural)
    translation defect presenting with infantile hypertrophic cardiomyopathy and
    lactic acidosis. Clinically near-indistinguishable from MRPL44 deficiency at
    presentation, and a documented source of named-entity confusion in the
    literature and in automated curation.
  distinguishing_features:
  - >-
    Molecular. MTO1 acts on mt-tRNA taurinomethyl modification, not on the 39S
    subunit; lactic acidosis is typically more severe and more consistently
    present in MTO1 deficiency, and MTO1 patients more often show early
    encephalopathy.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2,
      YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3
      [3]."
    explanation: >-
      Lists MTO1 among the mitochondrial translation cardiomyopathy genes.
- name: Other mitochondrial translation-defect cardiomyopathies
  description: >-
    A broader group of nuclear mitochondrial translation genes causes
    biochemically indistinguishable infantile cardiomyopathy with combined
    respiratory chain deficiency: aminoacyl-tRNA synthetases (AARS2, YARS2, GARS,
    KARS), other mitoribosomal proteins (MRPS22, MRPS14), elongation and assembly
    factors (TSFM, RMND1), and tRNA-modifying enzymes (ELAC2, TRMT5, GTPBP3,
    HSD17B10).
  distinguishing_features:
  - >-
    Not separable on respiratory chain enzymology or muscle histology; requires a
    nuclear mitochondrial gene panel, exome, or genome. This is the practical
    argument for not stopping at a targeted cardiomyopathy panel.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, cardiomyopathy has for instance been described in the following genes: AARS2,
      YARS2, GARS, KARS, MRPL3, MRPS22, MRPS14, MRPL44, TSFM, RMND1, MTO1, HSD17B10, ELAC2, TRMT5, GTPBP3
      [3]."
    explanation: >-
      Enumerates the mitochondrial translation genes in which cardiomyopathy has been described, defining
      this differential group.
- name: SLC25A3-related cardiomyopathy-hypotonia-lactic acidosis syndrome
  disease_term:
    preferred_term: Cardiomyopathy-hypotonia-lactic acidosis syndrome
    term:
      id: MONDO:0012557
      label: cardiomyopathy-hypotonia-lactic acidosis syndrome
  description: >-
    Mitochondrial phosphate-carrier deficiency presenting with infantile
    hypertrophic cardiomyopathy, hypotonia, and lactic acidosis - overlapping the
    MRPL44 infantile presentation closely enough to be a recognized confusable
    entity.
  distinguishing_features:
  - >-
    Mechanistically distinct: a solute-carrier (substrate import) defect rather
    than a translation defect, so mitochondrial protein synthesis and
    mitoribosome assembly are normal and the respiratory chain deficiency pattern
    differs. Marked hypotonia is a more prominent early feature.
- name: Non-mitochondrial metabolic and sarcomeric infantile cardiomyopathies
  description: >-
    Pompe disease (glycogen storage disease II), Barth syndrome (TAZ),
    fatty-acid-oxidation defects, and primary sarcomeric hypertrophic
    cardiomyopathy all present with infantile or childhood hypertrophic
    cardiomyopathy.
  distinguishing_features:
  - >-
    These are separable without sequencing: Pompe by acid alpha-glucosidase
    enzyme assay and marked creatine kinase elevation; Barth by cyclic
    3-methylglutaconic aciduria, neutropenia and X-linked inheritance;
    fatty-acid-oxidation defects by a diagnostic acylcarnitine profile; sarcomeric
    HCM by dominant inheritance, later onset, and the absence of lactic acidosis
    or combined respiratory chain deficiency.
diagnosis:
- name: Molecular genetic testing of MRPL44
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is molecular. Every reported case was solved by exome sequencing or
    a nuclear mitochondrial-disease/cardiomyopathy panel that includes MRPL44;
    notably, a targeted comprehensive cardiomyopathy panel was non-diagnostic in
    one infant, so a mitochondrial-inclusive panel or trio exome is preferred.
    When a homozygous variant appears with only one carrier parent, add
    short-tandem-repeat and SNP-microarray testing for uniparental disomy.
  results: >-
    Biallelic (homozygous or compound heterozygous) pathogenic MRPL44 variants
    confirm the diagnosis.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing demonstrated compound heterozygosity for pathogenic variants in
      the MRPL44 gene"
    explanation: >-
      Documents exome sequencing as the confirmatory diagnostic test.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a comprehensive cardiomyopathy sequencing panel did not report any variants."
    explanation: >-
      Important diagnostic caveat - a standard cardiomyopathy gene panel missed the diagnosis, arguing
      for exome or a mitochondrial-inclusive panel.
- name: Respiratory chain enzymology of heart and skeletal muscle
  diagnosis_term:
    preferred_term: respiratory chain enzyme assay
  description: >-
    Respiratory-chain enzyme activity measurements can support the diagnosis, but yield varies by tissue,
    patient and preparation. In the extensively studied first 2021 infant, the cardiac defect was profound,
    muscle involvement milder and fibroblast complex IV activity borderline. The second infant had normal
    fibroblast whole-homogenate activities but low complex IV activity in a mitochondrial isolate, so
    a normal whole-homogenate result does not exclude the disorder.
  results: >-
    Combined deficiency of complexes I and IV, most marked in cardiac tissue.
  evidence:
  - reference: PMID:23315540
    reference_title: "Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
      MRPL44 to underlie mitochondrial infantile cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of respiratory chain enzymes revealed a combined deficiency of complexes I and
      IV in the heart and skeletal muscle."
    explanation: >-
      Establishes the diagnostic biochemical signature.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In fibroblasts the respiratory chain enzyme activities were normal in the 600 × g homogenate,
      but showed low complex IV activity in a mitochondrial isolate."
    explanation: >-
      Documents the false-negative risk of fibroblast whole-homogenate enzymology.
- name: Skeletal muscle biopsy with mitochondrial histochemistry
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle biopsy shows ultrastructurally abnormal mitochondria, but the routine
    mitochondrial-myopathy histochemical markers can be entirely absent, so a
    normal Gomori trichrome and COX stain does not exclude the diagnosis.
  results: >-
    Abnormal mitochondria with granular content and abnormal cristae, without
    ragged red/blue fibers and without COX-negative fibers.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gomori trichrome staining did not reveal ragged blue fibers, and there were no cytochrome
      c oxidase negative fibers."
    explanation: >-
      Establishes that the standard mitochondrial myopathy histochemical markers may be absent in MRPL44
      deficiency.
- name: Mitochondrial protein synthesis (translation) assay
  diagnosis_term:
    preferred_term: mitochondrial translation assay
  description: >-
    Specialist 35S-amino-acid incorporation assays can demonstrate impaired mitochondrial translation
    in patient fibroblasts. The two 2021 patients differed in residual incorporation and OXPHOS assays,
    but this does not establish a validated clinical-severity or novel-variant classification test.
  results: >-
    Reduced incorporation of labelled amino acids into mtDNA-encoded
    polypeptides, proportional to the severity of the genotype.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The degree of oxidative phosphorylation dysfunction correlated with the impairment of mitochondrial
      protein synthesis due to different pathogenic variants."
    explanation: >-
      The two-patient functional comparison supports measuring residual translation, not a validated prognostic
      or variant-classification threshold.
- name: Echocardiography
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography establishes and monitors the defining cardiac phenotype and
    is the basis for surveillance in at-risk siblings and in survivors of the
    infantile presentation.
  results: >-
    Left ventricular hypertrophy with variably depressed ejection fraction.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an echocardiogram revealed an ejection fraction of 25% (normal 55–70%) with left ventricular
      dysfunction and hypertrophy"
    explanation: >-
      Documents the echocardiographic findings that define the cardiac phenotype.
treatments:
- name: Supportive Heart Failure Management
  description: >
    No disease-modifying therapy exists. Care is supportive and cardiac-directed:
    beta blockade and standard anti-failure pharmacotherapy, nutritional support
    via nasogastric or gastrostomy feeding, avoidance of catabolic stress, and
    surveillance echocardiography. Intercurrent infection is a recognized trigger
    of fatal cardiac decompensation.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient responded well to treatment and was discharged at 71 days of life while being
      treated with beta blockers and receiving feeding mainly via gastrostomy tube."
    explanation: >-
      Documents beta blockade and enteral nutritional support as the initial management, with initial
      clinical response.
- name: Beta Blocker Therapy
  description: >
    Beta blockade is the specific anti-failure pharmacotherapy documented in
    MRPL44 deficiency; an affected infant was discharged on beta blockers with
    gastrostomy feeding after an initial clinical response, although the
    cardiomyopathy later decompensated fatally.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient responded well to treatment and was discharged at 71 days of life while being
      treated with beta blockers and receiving feeding mainly via gastrostomy tube."
    explanation: >-
      Documents beta blockade in an affected infant with an initial response. This is single-case, uncontrolled
      use extrapolated from general pediatric heart failure practice, not MRPL44-specific efficacy data.
- name: Genetic Counseling
  description: >
    Autosomal recessive counselling with a specific caveat: one reported patient
    was homozygous through complete maternal uniparental isodisomy of chromosome
    2 rather than biparental transmission. A homozygous MRPL44 result with only
    one carrier parent should therefore prompt uniparental disomy testing, since
    the recurrence risk differs substantially from the standard 25%.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33742325
    reference_title: "Uniparental isodisomy of chromosome 2 causing MRPL44-related multisystem mitochondrial
      disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short-tandem repeat and genome-wide SNP microarray analyses of the family trio confirmed
      complete maternal uniparental isodisomy of chromosome 2."
    explanation: >-
      Establishes uniparental isodisomy as a documented route to homozygosity in MRPL44 disease, which
      directly changes recurrence-risk counselling.
- name: Mechanical Circulatory Support
  description: >
    Ventricular assist device placement and venoarterial extracorporeal membrane
    oxygenation have been used aggressively in infants with MRPL44-related
    cardiogenic shock, on the rationale that some patients stabilize after the
    first year. In the published case this did not prevent death from multiorgan
    failure and opportunistic infection, so the benefit is unproven.
  treatment_term:
    preferred_term: ventricular assist device placement
    term:
      id: NCIT:C80452
      label: Ventricular Assist Device Placement
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Congestive Heart Failure
    treatment_effect: INHIBITS
    description: >-
      Mechanical unloading substitutes for the failing bioenergetically depleted
      myocardium; it does not correct the underlying translation defect.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aggressive management including left ventricle assist device was performed in the case presented
      here."
    explanation: >-
      Documents the use of mechanical circulatory support and its rationale.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She remained in cardiogenic shock and hepatic failure, and ultimately developed disseminated
      Candida lusitanease infection which resulted in her death two days after her first birthday."
    explanation: >-
      Shows that mechanical support did not rescue the reported infant, so efficacy is unestablished.
- name: Cardiac Transplantation
  description: >-
    The clinical authors considered cardiac transplantation for infantile MRPL44 cardiomyopathy. Their
    stated caveat is that progressive neurological and other extra-cardiac involvement may emerge later.
    This is a proposed clinical option, not a reported transplant outcome, and does not imply that OXPHOS
    deficiency was measured in every organ.
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We were considering cardiac transplantation as an option in this condition in infancy, bearing
      in mind that in adolescence a progressive clinical involvement including neurological symptoms may
      still occur."
    explanation: >-
      States both the rationale for and the principal caveat against cardiac transplantation in MRPL44
      deficiency.
- name: Mitochondrial Biogenesis Induction (Investigational)
  description: >-
    The authors propose increasing mL44 abundance with mitochondrial-biogenesis approaches such as NRF2,
    PGC-1-alpha or PPAR-delta activation. This is untested in MRPL44 deficiency and is not established
    by the two-patient residual-translation comparison. The cardiomyocyte preprint shows increased mtDNA/transcripts
    despite reduced complex I protein, limiting the assumption that more biogenesis alone restores function.
  treatment_term:
    preferred_term: investigational pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
    treatment_effect: INHIBITS
    description: >-
      Raising MRPL44 transcription is proposed to partially compensate for the
      reduced steady-state abundance of the destabilized mL44 protein.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the amount of residual activity is related to translational efficiency, to improve
      the function and perhaps allow infants to recover from the cardiac dysfunction, increasing the amount
      of ml44 should be considered."
    explanation: >-
      States the therapeutic hypothesis. Indirect support because the paper proposes but does not test
      this strategy.
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MRPL44 deficiency impairs mitochondrial translation but induces mtDNA replication and transcription
      in iPSC-derived cardiomyocytes."
    explanation: >-
      Tempers the biogenesis-induction rationale - patient cardiomyocytes already mount a biogenesis response
      that fails to correct the translation block. Preprint, in vitro.
discussions:
- discussion_id: gap_disproportionate_complex_iv_deficiency
  prompt: >-
    Why is complex IV activity disproportionately reduced relative to complex I
    in MRPL44 deficiency, when the measured synthesis rates of complex I and
    complex IV mtDNA-encoded subunits are similarly depressed and complex I has
    more than twice as many mtDNA-encoded subunits?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Translation
  - pathophysiology#Combined Complex I and IV Deficiency
  rationale: >-
    In most mitochondrial transcription and translation defects, complex I (seven
    mtDNA-encoded subunits) is more affected than complex IV (three) simply
    through subunit stoichiometry. MRPL44 deficiency inverts this, as do LRPPRC
    and TACO1 disease. The 2021 functional study excluded the obvious explanation
    by showing that the newly synthesized complex IV subunits (MT-CO1, MT-CO2,
    MT-CO3) were reduced to approximately the same degree as complex I subunits
    (average 30.1% versus 34.3% of controls, not significantly different). A
    difference in post-synthetic stability of the assembled subunits was proposed
    but could not be excluded or confirmed. Resolving this matters because a
    complex IV-selective post-translational bottleneck would be a different
    therapeutic target from generic mitoribosome insufficiency.
  proposed_experiments:
  - experiment_id: exp_mrpl44_cox_subunit_pulse_chase
    name: Pulse-chase stability assay of mtDNA-encoded complex IV versus complex I subunits
    description: >-
      In MRPL44-patient and isogenic corrected cardiomyocytes, perform 35S
      pulse-chase labelling with quantification of the decay rate of newly
      synthesized MT-CO1/2/3 versus MT-ND subunits, to test whether the excess
      complex IV deficit arises from accelerated degradation of unassembled
      cytochrome c oxidase subunits rather than from unequal synthesis.
    experiment_type:
      preferred_term: pulse-chase protein stability assay
    model_systems:
    - name: Patient iPSC-derived cardiomyocyte
      description: >-
        MRPL44-mutant patient iPSC-derived cardiomyocytes with isogenic corrected
        controls, providing the human cardiac context where the biochemical defect
        is most severe.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The reason for this more pronounced defect in complex IV is not clear."
    explanation: >-
      The authors explicitly state that this mechanistic question is unresolved.
- discussion_id: mismatch_yeast_mrpl3_l156r_equivalent
  prompt: >-
    Can the yeast MrpL3/mL44 homolog or a mouse Mrpl44 knockout serve as a valid
    model for human MRPL44 disease alleles, given that the human disease mutation
    modelled at the equivalent yeast residue does not impair function and that
    mouse null loss is embryonically lethal?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
  - pathophysiology#Large Mitoribosomal Subunit Assembly Defect
  rationale: >-
    Yeast MrpL3/mL44 is the tractable genetic model for mL44 function, and
    mutagenesis of its conserved hydrophobic pocket does identify residues
    critical for assembling translationally active mitoribosomes. However, the
    exact human disease substitution modelled at the equivalent yeast residue
    (A186) had no major functional impact, and the authors concluded the two
    orthologs have diverged in evolution. Mouse Mrpl44 loss is a different kind of
    mismatch: knockout is embryonically lethal, whereas human patients carry
    hypomorphic alleles with residual protein and survive with tissue-restricted
    disease. Neither model therefore reproduces the human hypomorphic,
    cardiac-selective genotype-phenotype relationship, and both should be treated
    as tools for general mitoribosome biology rather than as MRPL44 disease
    models. Patient-derived iPSC cardiomyocytes are the emerging replacement, but
    the only published line covers a single genotype and the work remains a
    preprint.
  proposed_experiments:
  - experiment_id: exp_mrpl44_isogenic_ipsc_cardiomyocyte
    name: Isogenic MRPL44 iPSC-derived cardiomyocyte allelic series
    description: >-
      Engineer an allelic series (p.Leu156Arg, p.Leu156Pro, p.Thr161Serfs*2, and
      corrected wild type) in a common human iPSC background, differentiate to
      cardiomyocytes, and quantify mL44 abundance, 39S assembly, mitochondrial
      translation, complex I and IV activity, and contractile function, testing
      whether the human cardiac context reproduces the allele-severity gradient
      that neither yeast nor mouse captures.
    experiment_type:
      preferred_term: isogenic iPSC-derived cardiomyocyte allelic series
    model_systems:
    - name: Human iPSC-derived cardiomyocyte
      description: >-
        Cardiomyocytes differentiated from gene-edited human iPSCs carrying the
        reported MRPL44 disease alleles, preserving the human sequence context
        that diverges from yeast MrpL3.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein
      for mitotranslation and transcript preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the introduction of the disease-related mutation into the equivalent position in the yeast
      protein (residue A186) was found to not have a major impact on function"
    explanation: >-
      Directly demonstrates that the yeast ortholog does not phenocopy the human disease allele.
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein
      for mitotranslation and transcript preference."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The human and yeast mL44 proteins share many similarities in sequence and structure; however
      results presented here indicate that these two proteins have diverged somewhat in evolution."
    explanation: >-
      The authors themselves flag the evolutionary divergence limiting model validity.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, it is expressed widely throughout multiple tissues during development and its absence
      is embryonically lethal"
    explanation: >-
      Mouse null lethality contrasts with the survivable, tissue-restricted human hypomorphic phenotype,
      the second arm of the model mismatch.
- discussion_id: gap_cardiac_tissue_selectivity
  prompt: >-
    What determines the striking tissue gradient of MRPL44 deficiency, in which
    heart muscle shows profound respiratory chain deficiency, skeletal muscle
    intermediate, and fibroblasts only borderline changes, despite comparable
    reduction of mL44 protein in all three tissues?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Contractile Element Loss
  rationale: >-
    mL44 protein levels are reduced in heart, skeletal muscle, and fibroblasts
    alike, yet the enzymatic and clinical consequences are overwhelmingly
    cardiac. Candidate explanations include the higher OXPHOS flux demand and
    mitochondrial density of the myocardium, the postnatal switch to fatty-acid
    oxidation (the nutrient-dependent hypothesis), tissue-specific differences in
    mitoribosome assembly-factor buffering, and a possible transcript hierarchy in
    mitochondrial translation - the yeast work showed that MrpL3/mL44 mutation
    does not affect all mtDNA-encoded transcripts equally. Distinguishing a
    threshold effect from a genuinely cardiac-specific mechanism is required
    before extrapolating any therapy tested in fibroblasts to the heart.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are tissue specific differences. The enzyme deficiency was most pronounced in cardiac
      muscle tissue, where there was massive proliferation of mitochondria on electron microscopy displacing
      contractile elements."
    explanation: >-
      Documents the tissue gradient that this gap seeks to explain.
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein
      for mitotranslation and transcript preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we observed that mutation of the MrpL3/mL44 does not impact the translation of all mitochondrial
      encoded proteins equally, suggesting the mitochondrial translation system may exhibit a transcript
      hierarchy and prioritization."
    explanation: >-
      Offers a candidate mechanism (transcript hierarchy) for differential consequences, though demonstrated
      in yeast rather than human tissue.
- discussion_id: gap_nutrient_dependent_hypothesis_validation
  prompt: >-
    Does the postnatal glucose-to-fatty-acid fuel switch causally trigger
    MRPL44 hypertrophic cardiomyopathy in vivo, and does the ISRmt/lipid-handling
    arm represent a tractable therapeutic target distinct from OXPHOS repletion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
  rationale: >-
    The nutrient-dependent model is currently supported by a single unreviewed
    preprint using one patient iPSC line in short-term culture, with immature
    in-vitro cardiomyocyte physiology. It is mechanistically attractive because it
    would explain the otherwise puzzling perinatal timing of disease onset, and
    because it points to a stress-signalling rather than purely bioenergetic
    target. It must not, however, be translated into fat restriction, ketogenic
    diet, or any other dietary manipulation: no clinical evidence supports this,
    and fasting/catabolic stress is itself a recognized hazard in mitochondrial
    disease. Replication across genotypes, in matured or engineered heart tissue,
    and ideally in vivo is required.
  proposed_experiments:
  - experiment_id: exp_mrpl44_fuel_switch_replication
    name: Multi-genotype nutrient-switch replication in matured cardiac tissue
    description: >-
      Replicate the glucose-versus-lipid comparison across at least three MRPL44
      genotypes plus isogenic controls in maturation-promoted engineered heart
      tissue, with longitudinal transcriptomics, lipidomics, contractile force,
      and ISRmt readouts, and test whether pharmacological ISRmt attenuation
      rescues the lipid-condition phenotype.
    experiment_type:
      preferred_term: engineered heart tissue nutrient-switch assay
    model_systems:
    - name: Engineered human heart tissue
      description: >-
        Maturation-promoted 3D engineered heart tissue from MRPL44-mutant and
        isogenic control iPSCs, addressing the immaturity limitation of monolayer
        iPSC cardiomyocytes.
      experimental_model_type: OTHER
  evidence:
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that glucose and lipids, the latter being the postnatally favored
      cardiac fuel, exert remarkably different consequences in MRPL44 deficient cardiomyocytes."
    explanation: >-
      States the finding whose in-vivo validity and therapeutic tractability are the open question. Preprint,
      single patient line.
- discussion_id: mrpl44_metabolic_and_feeding_attribution
  prompt: Which mechanisms account for early metabolic and feeding findings?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Lactic Acidosis
  - phenotypes#Hypoglycemia
  - phenotypes#Hypothermia
  - phenotypes#Hyperammonemia
  - phenotypes#Feeding Difficulties in Infancy
  - phenotypes#Failure to Thrive
  rationale: >-
    The infant report establishes neonatal acidosis, hypoglycemia and feeding difficulty, with transient
    hyperammonemia in Patient 2 and hypothermia in Patient 1. A qualified OXPHOS-to-lactic-acidosis route
    is represented using established pyruvate/redox physiology and the MRPL44 clinical measurements; missing
    tissue-level reconstruction does not negate that relation. The precise tissue contribution and possible
    cardiac/illness amplification remain unresolved. Intrinsic hypoglycemia, hypothermia, hyperammonemia
    and feeding difficulty are less causally localized by these sources. Hypoglycemia preceded cardiac
    shock; the shock link concerns its acute exacerbation only. Feeding insufficiency has a supported
    nutritional route to poor growth. Patient 1 also carried a 16q23.3 deletion. No blanket ATP-depletion
    fanout is asserted.
  evidence:
  - reference: PMID:34140213
    reference_title: Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a
      mitochondrial translation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She presented on the second day of life with Kussmaul breathing due to metabolic
      acidosis (pH < 7.0, base excess – 27 mEq/L), with elevated lactate 19 mmol/L (normal < 2
      mmol/L) and mildly elevated ammonia 180 μM (normal < 100 μM).
    explanation: >-
      Patient 2’s neonatal metabolic episode defines the acidosis, breathing and ammonia findings; the
      source does not resolve the intrinsic metabolic pathway.
  - reference: PMID:34140213
    reference_title: Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a
      mitochondrial translation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two infants who presented with cardiomyopathy from the neonatal period,
      failure to thrive, hypoglycemia and in one infant lactic acidosis.
    explanation: >-
      The two-infant clinical summary establishes the recurring metabolic/growth presentation, not its
      separate tissue mechanisms.
  - reference: PMID:34140213
    reference_title: Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a
      mitochondrial translation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chromosomal microarray revealed a deletion of 16q23.3
    explanation: >-
      The first infant’s additional chromosome deletion limits exclusive attribution of every isolated
      finding to MRPL44.
- discussion_id: mrpl44_chronic_hepatorenal_attribution
  prompt: What distinguishes chronic hepatorenal involvement from acute circulatory complications?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hepatic Steatosis
  - phenotypes#Elevated Hepatic Transaminases
  - phenotypes#Renal Insufficiency
  - phenotypes#Hepatic Failure
  rationale: >-
    Chronic renal insufficiency and hepatopathy occur in the multisystem literature; the Orphanet definition
    specifies steatosis and elevated transaminases. These sources do not establish a renal cell compartment
    or demonstrate a liver-specific lipid/ATP pathway. The infant’s renal dysfunction and hepatic failure
    during shock support separately qualified secondary circulatory routes, which must not be transferred
    to the chronic organ findings. Cardiac iPSC lipid droplets are not evidence for a hepatocyte steatosis
    mechanism.
  evidence:
  - reference: ORPHA:352563
    reference_title: "Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare mitochondrial oxidative phosphorylation disorder with complex I and IV deficiency
      characterized by hypertrophic cardiomyopathy, hepatic steatosis with elevated liver transaminases,
      exercise intolerance and muscle weakness."
    explanation: >-
      Orphanet's expert clinical definition includes hepatic steatosis with elevated liver transaminases
      as a characteristic feature.
  - reference: PMID:25797485
    reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset
      hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we observed several additional clinical signs and symptoms including pigmentary
      retinopathy, hemiplegic migraine, Leigh-like lesions on brain MRI, renal insufficiency, and hepatopathy."
    explanation: >-
      Reports renal insufficiency among the additional features of the two patients in this series. No
      frequency band is assigned: the source enumerates features without per-patient attribution or any
      count, so any band would be unsupported.
- discussion_id: mrpl44_respiratory_infection_scope
  prompt: Does MRPL44 deficiency directly cause respiratory failure?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Respiratory Failure
  - phenotypes#Hypoxemia
  rationale: >-
    The source reports respiratory failure during RSV infection with recovery to baseline, followed by
    a separate cardiac shock admission. A direct MRPL44 pulmonary or respiratory-muscle mechanism was
    not established. The source-supported acidosis-to-Kussmaul route and qualified shock-to-hypoxia route
    explain those particular components without explaining the infection itself.
  evidence:
  - reference: PMID:34140213
    reference_title: Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a
      mitochondrial translation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At nine months of age during a respiratory syncytial viral infection, she was admitted
      for hypoxia and had respiratory failure for ten days after which she recovered back to
      baseline.
    explanation: >-
      The acute respiratory failure was infection-associated. It does not establish primary chronic pulmonary
      involvement from MRPL44.
- discussion_id: mrpl44_multisystem_intermediates
  prompt: Which tissue mechanisms mediate the clinically attributed multisystem syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Translation
  - phenotypes#Myopathy
  - phenotypes#Muscle Weakness
  - phenotypes#Exercise Intolerance
  - phenotypes#Fatigue
  - phenotypes#Hemiplegic Migraine
  - phenotypes#Pigmentary Retinopathy
  - phenotypes#Ataxia
  - phenotypes#Spasticity
  - phenotypes#Cognitive Impairment
  - phenotypes#Hemiparesis
  - phenotypes#Confusion
  - phenotypes#Impaired Executive Functioning
  rationale: >-
    The clinical reports explicitly attribute the multisystem disorder to MRPL44-related mitochondrial
    dysfunction, and Horga links the adult phenotype to a demonstrable translation defect. Those qualified
    causal attributions are represented even though intervening tissue mechanisms are unknown. No measured
    chronic ATP deficit is claimed in kidney, liver, retina or brain, and MRI distribution alone is not
    taken as proof that a particular lesion causes ataxia, spasticity or migraine. Case-specific modifiers
    remain possible, particularly in the chromosome 2 isodisomy case.
  evidence:
  - reference: PMID:33742325
    reference_title: Uniparental isodisomy of chromosome 2 causing MRPL44-related multisystem
      mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: confirms that MRLP44 mutations cause a mitochondrial translation defect that may
      present as a multisystem disorder with neurological involvement.
    explanation: >-
      The authors’ causal interpretation supports the broad syndrome attribution while leaving tissue
      intermediates unresolved.
    directness: INDIRECT
  - reference: PMID:25797485
    reference_title: MRPL44 mutations cause a slowly progressive multisystem disease with
      childhood-onset hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Our findings expand the clinical spectrum associated with MRPL44 mutations and indicate
      that MRPL44-associated mitochondrial dysfunction can also manifest as a progressive
      multisystem disease with central nervous system involvement.
    explanation: >-
      The independent clinical report supports a multisystem mitochondrial interpretation, without identifying
      specific downstream cellular mediators.
    directness: INDIRECT
- discussion_id: mrpl44_source_and_phenotype_scope
  prompt: How were the sparse clinical sources and phenotype terms scoped?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - phenotypes#Cognitive Impairment
  - phenotypes#Hemiplegic Migraine
  rationale: >-
    The 2013, 2015 and adult-2021 primary abstracts were read, and detailed case observations were checked
    against the full 2021 infant paper, which explicitly summarizes the earlier cases. Accessible DOI
    fetches did not provide full text of the 2015 or adult-2021 reports; no inaccessible table was treated
    as read. GeneReviews PMID20301403 is an umbrella overview, not an MRPL44-specific chapter or phenotype
    baseline. Cognitive impairment replaces a specific-learning-disability term because the source does
    not identify a particular academic skill deficit. Migraine is retained as the broader binding because
    the current Migraine with aura HPO definition excludes motor weakness and a dedicated hemiplegic term
    was not retrieved. Regional Leigh-like MRI findings remain in imaging_findings; central cores and
    hypercontracted fibers are preserved as biopsy observations, not invented causal nodes.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial
      translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth patient from age 14 years on developed cardiomyopathy, hemiplegic migraines,
      learning difficulties, myopathy, tapetoretinal dystrophy, and Leigh-like lesions in thalami, basal
      ganglia and cerebellum on brain MRI"
    explanation: >-
      The report names learning difficulties without identifying a specific academic-skill deficit or
      excluding general cognitive impairment in that individual; the broader cognitive term avoids an
      unsupported specific-learning-disability claim.
  - reference: PMID:25797485
    reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset
      hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we observed several additional clinical signs and symptoms including pigmentary
      retinopathy, hemiplegic migraine, Leigh-like lesions on brain MRI, renal insufficiency, and hepatopathy."
    explanation: >-
      The two-case report includes hemiplegic migraine. The generic Migraine binding retains the motor
      subtype in the name: the current HPO Migraine with aura definition explicitly excludes motor weakness,
      and no dedicated hemiplegic-migraine HP term was retrieved. No frequency is inferred.

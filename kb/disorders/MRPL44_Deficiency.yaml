discussions:
- discussion_id: gap_disproportionate_complex_iv_deficiency
  prompt: >-
    Why is complex IV activity disproportionately reduced relative to complex I
    in MRPL44 deficiency, when the measured synthesis rates of complex I and
    complex IV mtDNA-encoded subunits are similarly depressed and complex I has
    more than twice as many mtDNA-encoded subunits?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Translation
  - pathophysiology#Combined Complex I and IV Deficiency
  rationale: >-
    In most mitochondrial transcription and translation defects, complex I (seven
    mtDNA-encoded subunits) is more affected than complex IV (three) simply
    through subunit stoichiometry. MRPL44 deficiency inverts this, as do LRPPRC
    and TACO1 disease. The 2021 functional study excluded the obvious explanation
    by showing that the newly synthesized complex IV subunits (MT-CO1, MT-CO2,
    MT-CO3) were reduced to approximately the same degree as complex I subunits
    (average 30.1% versus 34.3% of controls, not significantly different). A
    difference in post-synthetic stability of the assembled subunits was proposed
    but could not be excluded or confirmed. Resolving this matters because a
    complex IV-selective post-translational bottleneck would be a different
    therapeutic target from generic mitoribosome insufficiency.
  proposed_experiments:
  - experiment_id: exp_mrpl44_cox_subunit_pulse_chase
    name: Pulse-chase stability assay of mtDNA-encoded complex IV versus complex I subunits
    description: >-
      In MRPL44-patient and isogenic corrected cardiomyocytes, perform 35S
      pulse-chase labelling with quantification of the decay rate of newly
      synthesized MT-CO1/2/3 versus MT-ND subunits, to test whether the excess
      complex IV deficit arises from accelerated degradation of unassembled
      cytochrome c oxidase subunits rather than from unequal synthesis.
    experiment_type:
      preferred_term: pulse-chase protein stability assay
    model_systems:
    - name: Patient iPSC-derived cardiomyocyte
      description: >-
        MRPL44-mutant patient iPSC-derived cardiomyocytes with isogenic corrected
        controls, providing the human cardiac context where the biochemical defect
        is most severe.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reason for this more pronounced defect in complex IV is not clear."
    explanation: The authors explicitly state that this mechanistic question is unresolved.
- discussion_id: mismatch_yeast_mrpl3_l156r_equivalent
  prompt: >-
    Can the yeast MrpL3/mL44 homolog or a mouse Mrpl44 knockout serve as a valid
    model for human MRPL44 disease alleles, given that the human disease mutation
    modelled at the equivalent yeast residue does not impair function and that
    mouse null loss is embryonically lethal?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
  - pathophysiology#Large Mitoribosomal Subunit Assembly Defect
  rationale: >-
    Yeast MrpL3/mL44 is the tractable genetic model for mL44 function, and
    mutagenesis of its conserved hydrophobic pocket does identify residues
    critical for assembling translationally active mitoribosomes. However, the
    exact human disease substitution modelled at the equivalent yeast residue
    (A186) had no major functional impact, and the authors concluded the two
    orthologs have diverged in evolution. Mouse Mrpl44 loss is a different kind of
    mismatch: knockout is embryonically lethal, whereas human patients carry
    hypomorphic alleles with residual protein and survive with tissue-restricted
    disease. Neither model therefore reproduces the human hypomorphic,
    cardiac-selective genotype-phenotype relationship, and both should be treated
    as tools for general mitoribosome biology rather than as MRPL44 disease
    models. Patient-derived iPSC cardiomyocytes are the emerging replacement, but
    the only published line covers a single genotype and the work remains a
    preprint.
  proposed_experiments:
  - experiment_id: exp_mrpl44_isogenic_ipsc_cardiomyocyte
    name: Isogenic MRPL44 iPSC-derived cardiomyocyte allelic series
    description: >-
      Engineer an allelic series (p.Leu156Arg, p.Leu156Pro, p.Thr161Serfs*2, and
      corrected wild type) in a common human iPSC background, differentiate to
      cardiomyocytes, and quantify mL44 abundance, 39S assembly, mitochondrial
      translation, complex I and IV activity, and contractile function, testing
      whether the human cardiac context reproduces the allele-severity gradient
      that neither yeast nor mouse captures.
    experiment_type:
      preferred_term: isogenic iPSC-derived cardiomyocyte allelic series
    model_systems:
    - name: Human iPSC-derived cardiomyocyte
      description: >-
        Cardiomyocytes differentiated from gene-edited human iPSCs carrying the
        reported MRPL44 disease alleles, preserving the human sequence context
        that diverges from yeast MrpL3.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein for mitotranslation and transcript preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the introduction of the disease-related mutation into the equivalent position in the yeast protein (residue A186) was found to not have a major impact on function"
    explanation: >-
      Directly demonstrates that the yeast ortholog does not phenocopy the human
      disease allele.
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein for mitotranslation and transcript preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The human and yeast mL44 proteins share many similarities in sequence and structure; however results presented here indicate that these two proteins have diverged somewhat in evolution."
    explanation: The authors themselves flag the evolutionary divergence limiting model validity.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, it is expressed widely throughout multiple tissues during development and its absence is embryonically lethal"
    explanation: >-
      Mouse null lethality contrasts with the survivable, tissue-restricted human
      hypomorphic phenotype, the second arm of the model mismatch.
- discussion_id: gap_cardiac_tissue_selectivity
  prompt: >-
    What determines the striking tissue gradient of MRPL44 deficiency, in which
    heart muscle shows profound respiratory chain deficiency, skeletal muscle
    intermediate, and fibroblasts only borderline changes, despite comparable
    reduction of mL44 protein in all three tissues?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Bioenergetic Failure and Mitochondrial Proliferation
  rationale: >-
    mL44 protein levels are reduced in heart, skeletal muscle, and fibroblasts
    alike, yet the enzymatic and clinical consequences are overwhelmingly
    cardiac. Candidate explanations include the higher OXPHOS flux demand and
    mitochondrial density of the myocardium, the postnatal switch to fatty-acid
    oxidation (the nutrient-dependent hypothesis), tissue-specific differences in
    mitoribosome assembly-factor buffering, and a possible transcript hierarchy in
    mitochondrial translation - the yeast work showed that MrpL3/mL44 mutation
    does not affect all mtDNA-encoded transcripts equally. Distinguishing a
    threshold effect from a genuinely cardiac-specific mechanism is required
    before extrapolating any therapy tested in fibroblasts to the heart.
  evidence:
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are tissue specific differences. The enzyme deficiency was most pronounced in cardiac muscle tissue, where there was massive proliferation of mitochondria on electron microscopy displacing contractile elements."
    explanation: Documents the tissue gradient that this gap seeks to explain.
  - reference: PMID:38950860
    reference_title: "Importance of conserved hydrophobic pocket region in yeast mitoribosomal mL44 protein for mitotranslation and transcript preference."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "we observed that mutation of the MrpL3/mL44 does not impact the translation of all mitochondrial encoded proteins equally, suggesting the mitochondrial translation system may exhibit a transcript hierarchy and prioritization."
    explanation: >-
      Offers a candidate mechanism (transcript hierarchy) for differential
      consequences, though demonstrated in yeast rather than human tissue.
- discussion_id: gap_nutrient_dependent_hypothesis_validation
  prompt: >-
    Does the postnatal glucose-to-fatty-acid fuel switch causally trigger
    MRPL44 hypertrophic cardiomyopathy in vivo, and does the ISRmt/lipid-handling
    arm represent a tractable therapeutic target distinct from OXPHOS repletion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
  rationale: >-
    The nutrient-dependent model is currently supported by a single unreviewed
    preprint using one patient iPSC line in short-term culture, with immature
    in-vitro cardiomyocyte physiology. It is mechanistically attractive because it
    would explain the otherwise puzzling perinatal timing of disease onset, and
    because it points to a stress-signalling rather than purely bioenergetic
    target. It must not, however, be translated into fat restriction, ketogenic
    diet, or any other dietary manipulation: no clinical evidence supports this,
    and fasting/catabolic stress is itself a recognized hazard in mitochondrial
    disease. Replication across genotypes, in matured or engineered heart tissue,
    and ideally in vivo is required.
  proposed_experiments:
  - experiment_id: exp_mrpl44_fuel_switch_replication
    name: Multi-genotype nutrient-switch replication in matured cardiac tissue
    description: >-
      Replicate the glucose-versus-lipid comparison across at least three MRPL44
      genotypes plus isogenic controls in maturation-promoted engineered heart
      tissue, with longitudinal transcriptomics, lipidomics, contractile force,
      and ISRmt readouts, and test whether pharmacological ISRmt attenuation
      rescues the lipid-condition phenotype.
    experiment_type:
      preferred_term: engineered heart tissue nutrient-switch assay
    model_systems:
    - name: Engineered human heart tissue
      description: >-
        Maturation-promoted 3D engineered heart tissue from MRPL44-mutant and
        isogenic control iPSCs, addressing the immaturity limitation of monolayer
        iPSC cardiomyocytes.
      experimental_model_type: OTHER
  evidence:
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that glucose and lipids, the latter being the postnatally favored cardiac fuel, exert remarkably different consequences in MRPL44 deficient cardiomyocytes."
    explanation: >-
      States the finding whose in-vivo validity and therapeutic tractability are
      the open question. Preprint, single patient line.

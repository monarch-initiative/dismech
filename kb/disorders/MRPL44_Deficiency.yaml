imaging_findings:
- name: Leigh-Like Lesions on Brain MRI
  modality: MRI
  description: >
    Symmetric signal abnormalities of the thalami, basal ganglia, midbrain, and
    cerebellar and subcortical white matter resembling Leigh syndrome have been
    documented in older MRPL44-deficient patients. No brain MRI abnormality has
    been reported in the infantile cardiac-dominant presentation, but infant
    neuroimaging is sparse - one neonate had a normal cranial ultrasound and no
    infant brain MRI has been published, so the apparent sparing is unconfirmed.
  phenotype_term:
    preferred_term: Abnormal basal ganglia MRI signal intensity
    term:

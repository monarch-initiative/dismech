progression:
- notes: >
    Bimodal. Infantile-onset disease is dominated by rapidly progressive
    hypertrophic cardiomyopathy; cardiac decompensation within the first year of
    life has been fatal in several reported infants despite inotropes,
    ventricular assist devices, and ECMO. Children who stabilize after the first
    year may remain well with asymptomatic cardiomyopathy into adolescence, and
    at least one case of spontaneous resolution of the cardiomyopathy has been
    described. Survivors homozygous for the recurrent p.Leu156Arg allele
    subsequently develop a slowly progressive multisystem phenotype in the second
    and third decades, with myopathy, exercise intolerance, hepatopathy, renal
    insufficiency, hemiplegic migraine, pigmentary retinopathy, and Leigh-like
    brain MRI lesions. This age-dependent emergence of neurological involvement
    is prognostically important when cardiac transplantation is being considered
    in infancy. No prospective natural-history study, survival estimate, or
    validated prognostic biomarker exists.
  evidence:
  - reference: PMID:25797485
    reference_title: "MRPL44 mutations cause a slowly progressive multisystem disease with childhood-onset hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, neurological and neuro-ophthalmological impairment seems to be a disease feature of the second and third decades of life, which should be taken into account in patient management and counseling."
    explanation: >-
      Documents the delayed, age-dependent onset of neurological and
      neuro-ophthalmological involvement in survivors.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A decompensation of the cardiac function in the first year resulted in demise."
    explanation: Documents fatal first-year cardiac decompensation in the infantile presentation.
  - reference: PMID:34140213
    reference_title: "Pathogenic variants in MRPL44 cause infantile cardiomyopathy due to a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first child died in infancy of cardiac failure following an acute infection, whereas in her sister the cardiomyopathy stabilized, and she remained well with only asymptomatic cardiomyopathy at the time of publication at age 14 years"
    explanation: >-
      Illustrates the marked intrafamilial variability in course between siblings
      carrying the same genotype.
mechanistic_hypotheses:
- hypothesis_group_id: nutrient_dependent_postnatal_manifestation
  hypothesis_label: >-
    Postnatal glucose-to-fatty-acid fuel switch as the trigger for
    MRPL44 cardiomyopathy manifestation
  status: EMERGING
  description: >
    An emerging model proposes that ATP deficiency alone does not explain why
    MRPL44 hypertrophic cardiomyopathy declares itself around birth. In patient
    iPSC-derived cardiomyocytes, glucose-rich (fetal-like) conditions provoke a
    partly compensatory response - increased mtDNA copy number and mitochondrial
    transcription - whereas lipid-enriched (postnatal-like) conditions instead
    trigger the mitochondrial integrated stress response (ISRmt) with partial ER
    stress, lipid-droplet accumulation, and maladaptive upregulation of lipid
    uptake and cholesterol synthesis genes. On this model the perinatal switch
    to fatty-acid oxidation is the critical window that converts a compensated
    translation defect into hypertrophic disease. This is preprint,
    single-patient-line, in-vitro evidence and does NOT justify any dietary
    intervention.
  evidence:
  - reference: DOI:10.1101/2025.09.24.678132
    reference_title: "Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These observations provide a mechanistic basis for postnatal disease manifestation and highlight nutrient metabolism as a key driver in development of infantile-onset mitochondrial hypertrophic cardiomyopathy."
    explanation: >-
      States the hypothesis directly. Preprint, one patient iPSC line, awaiting
      peer review and replication.
pathophysiology:
- name: Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic MRPL44 variants - most often the recurrent missense
    c.467T>G, p.(Leu156Arg) - destabilize the mL44 protein rather than abolishing
    its transcription, so patient heart, skeletal muscle, and fibroblasts all show
    sharply reduced steady-state mL44 levels. Frameshift alleles (e.g.
    c.481_484delinsTC, p.Thr161Serfs*2) are predicted to yield no protein at all,
    and a second substitution at the same residue, p.(Leu156Pro), is likewise
    strongly destabilizing. mL44 is a eukaryote-specific component of the large
    mitoribosomal subunit, forms a dimer, localizes to the mitochondrial matrix,
    and sits near the peptide exit channel.

name: Proteasome-Associated Autoinflammatory Syndrome
creation_date: "2026-04-14T05:24:49Z"
category: Mendelian
synonyms:
- PRAAS
- proteasome disability syndrome
- CANDLE syndrome
- Nakajo-Nishimura syndrome
- JMP syndrome
- autoinflammation-lipodystrophy-dermatosis syndrome
description: >
  Proteasome-associated autoinflammatory syndrome (PRAAS) is a genetically
  heterogeneous Mendelian type I interferonopathy caused by loss-of-function
  defects in proteasome or immunoproteasome subunits and proteasome assembly
  factors. The disease spectrum encompasses the historically named CANDLE,
  Nakajo-Nishimura, and JMP syndromes and is characterized by proteotoxic
  stress, chronic interferon activation, inflammatory skin disease,
  progressive lipodystrophy, joint contractures, and systemic inflammatory
  complications.
disease_term:
  preferred_term: proteasome-associated autoinflammatory syndrome
  term:
    id: MONDO:0009726
    label: proteosome-associated autoinflammatory syndrome
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
  - classification_value: DERMATOLOGY
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  iuis_category:
    classification_value: autoinflammatory syndrome
    notes: >-
      IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 7
      "Autoinflammatory disorders", section 3 "Non-Inflammasome Related
      Conditions", the PSMB8 and PSMG2 CANDLE rows. The table's text extraction
      fuses the end of the PSMB8 associated-features cell onto the start of the
      disease name in the next row, giving "feversCANDLE", so the quoted snippets
      stop at the cell boundary. IUIS marks the PSMB8 row with an asterisk whose
      footnote names PSMB4, PSMB9, PSMA3 and POMP as further proposed causes of
      the same CANDLE phenotype, which is the spectrum this umbrella entry
      curates.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PSMB8* AR and AD 256040 Keratinocytes, B cell adipose cells Contractures, panniculitis, ICC"
      explanation: >-
        The IUIS Table 7 row places the PSMB8 proteasome defect, with OMIM 256040
        and its contracture and panniculitis phenotype, among the
        autoinflammatory disorders.
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CANDLE (chronic atypical neutrophilic dermatitis with lipodystrophy) PSMG2 AR"
      explanation: >-
        The same Table 7 block names the disease CANDLE and adds the PSMG2
        assembly-factor genotype, confirming that the proteasome and
        assembly-factor spectrum curated here is one autoinflammatory table
        entry.
parents:
- Autoinflammatory diseases
- Interferonopathies
- Inborn errors of immunity
notes: >
  This disease-level entry uses the umbrella name PRAAS for the shared
  proteasome/immunoproteasome interferonopathy spectrum. The literature also
  uses CANDLE syndrome, Nakajo-Nishimura syndrome, and JMP syndrome for
  partially overlapping presentations within that spectrum, so those labels
  are retained as synonyms rather than treated as separate umbrella disorders
  here. MONDO:0009726 is the ontology anchor for the umbrella disease, but its
  canonical label is misspelled as "proteosome-associated autoinflammatory
  syndrome"; the entry name and preferred_term use the standard "proteasome"
  spelling while term.label follows MONDO exactly for validation.
  The OMIM-numbered forms PRAAS1 to PRAAS6 are curated as has_subtypes rows, each
  bound to its own MONDO class and to the gene reported for it. Two of the six sit
  at the edge of the umbrella. PRAAS2 was named POMP-related autoinflammation and
  immune dysregulation disease by its discovery study, and PRAAS6 was reported with
  an explicit proposal that it be treated as a separate category, PRAAS-ID, rather
  than as a PRAAS subtype, because the two patients had pulmonary hypertension and
  combined immunodeficiency without lipoatrophy. Both are kept as subtype rows here
  because MONDO places their classes directly under this umbrella and maps each to
  its own OMIM concept, and the countervailing argument is carried as evidence on
  the PRAAS6 row.
  The two genetic routes into the cascade are separated in the pathograph: the
  subunit genes are bound to Proteasome Subunit Loss of Function and the assembly
  chaperones POMP and PSMG2 to Proteasome Assembly Chaperone Loss of Function, both
  feeding Impaired Proteasome Biogenesis and Activity.
review_notes: >
  Initial disease-level curation for issue 1276. Emphasis was placed on
  spectrum-aware naming, chaining proteasome dysfunction to UPR and PKR-driven
  interferonopathy, and capturing mechanism-grounded treatment evidence for
  baricitinib and anifrolumab.
has_subtypes:
- name: PRAAS1
  display_name: PRAAS1 (PSMB8)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 1
    term:
      id: MONDO:0054698
      label: proteasome-associated autoinflammatory syndrome 1
  genes:
  - preferred_term: PSMB8
    description: >-
      Encodes the inducible immunoproteasome catalytic subunit beta-5i. Recessive
      loss-of-function variants are the founding PRAAS genotype and the one the
      dominant and digenic architectures were recognised against.
    term:
      id: hgnc:9545
      label: PSMB8
  description: >-
    The PSMB8-associated form and the reference presentation of the umbrella
    disease. Recessive variants in the inducible beta-5i catalytic subunit cause
    CANDLE, and the same gene underlies the JMP presentation curated in this
    entry. Per-gene detail is in the PSMB8 record of the genetic section.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:26524591
      reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Autosomal recessive mutations in proteasome subunit β 8 (PSMB8), which
        encodes the inducible proteasome subunit β5i, cause the
        immune-dysregulatory disease chronic atypical neutrophilic dermatosis
        with lipodystrophy and elevated temperature (CANDLE)
      explanation: >-
        States the recessive architecture of the PSMB8-associated form directly.
  evidence:
  - reference: PMID:21129723
    reference_title: "PSMB8 encoding the β5i proteasome subunit is mutated in joint contractures, muscle atrophy, microcytic anemia, and panniculitis-induced lipodystrophy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that mutations in PSMB8 cause JMP syndrome, most probably by affecting MHC class I antigen processing."
    explanation: >-
      The discovery study establishes PSMB8 as causative for the JMP presentation,
      one of the historically named phenotypes this subtype row covers.
- name: PRAAS2
  display_name: PRAAS2 (POMP)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 2
    term:
      id: MONDO:0054700
      label: proteasome-associated autoinflammatory syndrome 2
  genes:
  - preferred_term: POMP
    description: >-
      Encodes proteasome maturation protein, a chaperone for proteasome assembly
      that is critical for incorporating the catalytic subunits. The reported
      disease variants are frameshifts in the penultimate exon that escape
      nonsense-mediated decay and act by a dominant-negative mechanism, so this
      is an assembly-chaperone defect rather than a proteasome-subunit defect.
    term:
      id: hgnc:20330
      label: POMP
  description: >-
    The POMP-associated form, distinguished by early-onset combined
    immunodeficiency alongside the inflammatory neutrophilic dermatosis and
    autoimmunity. Its discovery study named it POMP-related autoinflammation and
    immune dysregulation disease (PRAID). PRAAS2 is the name MONDO:0054700 carries
    as a synonym, mapped to OMIM:618048.
  inheritance:
  - name: Autosomal dominant, de novo
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      A single heterozygous POMP variant is sufficient, acting by a
      dominant-negative mechanism on proteasome assembly.
    evidence:
    - reference: PMID:29805043
      reference_title: "Heterozygous Truncating Variants in POMP Escape Nonsense-Mediated Decay and Cause a Unique Immune Dysregulatory Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        de novo heterozygous frameshift variants in the penultimate exon of POMP
        escape nonsense-mediated mRNA decay (NMD) and result in a truncated
        protein that perturbs proteasome assembly by a dominant-negative
        mechanism
      explanation: >-
        Reports both the de novo heterozygous architecture and the
        dominant-negative mechanism that makes one allele sufficient.
    - reference: PMID:26524591
      reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        1 patient was heterozygous for a POMP mutation, thus establishing a
        digenic and autosomal dominant inheritance pattern of PRAAS
      explanation: >-
        Independent report of a single heterozygous POMP variant in a PRAAS
        patient, cited for the dominant arm it establishes.
  evidence:
  - reference: PMID:38111302
    reference_title: Proteasome-associated autoinflammatory syndrome 2 in a neonate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proteasome-associated autoinflammatory syndrome-2 (PRAAS2) is characterized by early onset combined immunodeficiency, inflammatory neutrophilic dermatosis, and autoimmunity."
    explanation: >-
      Names the PRAAS2 entity and its defining features, which is what this
      subtype row asserts.
  - reference: PMID:38111302
    reference_title: Proteasome-associated autoinflammatory syndrome 2 in a neonate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel de novo frameshift proteasome maturation protein (POMP) mutation (c.333delT (p.t111fs)) was detected, confirming the diagnosis."
    explanation: >-
      Ties the PRAAS2 diagnosis to a de novo POMP frameshift variant in a
      further, independent patient.
  - reference: PMID:29805043
    reference_title: "Heterozygous Truncating Variants in POMP Escape Nonsense-Mediated Decay and Cause a Unique Immune Dysregulatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we characterize and describe POMP-related autoinflammation and immune dysregulation disease (PRAID) discovered in two unrelated individuals with a unique constellation of early-onset combined immunodeficiency, inflammatory neutrophilic dermatosis, and autoimmunity."
    explanation: >-
      The discovery study's own naming of the POMP entity, and the clinical
      constellation that distinguishes it inside the PRAAS spectrum.
- name: PRAAS3
  display_name: PRAAS3 (PSMB4)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 3
    term:
      id: MONDO:0054699
      label: proteasome-associated autoinflammatory syndrome 3
  genes:
  - preferred_term: PSMB4
    description: >-
      Encodes the beta-7 subunit of the constitutive 20S proteasome. Beta-7 is a
      structural subunit of the beta-ring, not one of the three catalytic active
      site subunits. PSMB4 is reported both as a biallelic cause and as a
      constitutive-component partner in the digenic architecture this entry
      curates.
    term:
      id: hgnc:9541
      label: PSMB4
  description: >-
    The PSMB4-associated form. PSMB4 was one of four proteasome genes newly
    linked to CANDLE/PRAAS by the additive loss-of-function study, which reported
    it both as a compound-heterozygous cause in one patient and as a constitutive
    subunit participating in digenic genotypes.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:26524591
      reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient was compound heterozygous for PSMB4 mutations"
      explanation: >-
        A compound-heterozygous genotype in a single patient, which is the
        recessive architecture of this form.
  evidence:
  - reference: PMID:26524591
    reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 8 mutations in 4 proteasome genes, PSMA3 (encodes α7), PSMB4
      (encodes β7), PSMB9 (encodes β1i), and proteasome maturation protein
      (POMP), that have not been previously associated with disease
    explanation: >-
      The study that first associated PSMB4 with the disease, naming the subunit
      it encodes.
- name: PRAAS4
  display_name: PRAAS4 (PSMG2)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 4
    term:
      id: MONDO:0030931
      label: proteasome-associated autoinflammatory syndrome 4
  genes:
  - preferred_term: PSMG2
    description: >-
      Encodes proteasome assembly chaperone 2 (PAC2). Like POMP this is an
      assembly-chaperone defect rather than a proteasome-subunit defect, which is
      why the two are wired to the chaperone node of the pathograph.
    term:
      id: hgnc:24929
      label: PSMG2
  description: >-
    The PSMG2-associated form, reported in a patient with CANDLE features who
    also had autoimmune hemolytic anemia. PSMG2 encodes the PAC2 assembly
    chaperone, making this the second chaperone-defect form alongside PRAAS2.
  evidence:
  - reference: PMID:30664889
    reference_title: "Novel proteasome assembly chaperone mutations in PSMG2/PAC2 cause the autoinflammatory interferonopathy CANDLE/PRAAS4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the proteasome chaperone, PSMG2/PAC2 are a novel cause of CANDLE."
    explanation: >-
      Establishes PSMG2 as a cause of the CANDLE presentation curated by this
      entry.
- name: PRAAS5
  display_name: PRAAS5 (PSMB10)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 5
    term:
      id: MONDO:0030924
      label: proteasome-associated autoinflammatory syndrome 5
  genes:
  - preferred_term: PSMB10
    description: >-
      Encodes the inducible immunoproteasome catalytic subunit beta-2i (MECL1),
      the third inducible subunit alongside beta-5i (PSMB8) and beta-1i (PSMB9).
    term:
      id: hgnc:9538
      label: PSMB10
  description: >-
    The PSMB10-associated form. Compound-heterozygous PSMB10 variants were found
    in three unrelated Brazilian patients with a CANDLE/PRAAS phenotype, and the
    variants were shown to block incorporation of the beta-2i subunit into mature
    proteasomes.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:37600812
      reference_title: "Identification of eight novel proteasome variants in five unrelated cases of proteasome-associated autoinflammatory syndromes (PRAAS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four patients were compound heterozygous for novel pathogenic variants in
        the known CANDLE/PRAAS associated genes, PSMB8 and PSMB10
      explanation: >-
        Compound heterozygosity across the reported patients is the recessive
        architecture of this form.
  evidence:
  - reference: PMID:37600812
    reference_title: "Identification of eight novel proteasome variants in five unrelated cases of proteasome-associated autoinflammatory syndromes (PRAAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients were compound heterozygous for novel pathogenic variants in
      the known CANDLE/PRAAS associated genes, PSMB8 and PSMB10
    explanation: >-
      Names PSMB10 as an established CANDLE/PRAAS gene and reports the genotypes
      this row is keyed on.
  - reference: PMID:37600812
    reference_title: "Identification of eight novel proteasome variants in five unrelated cases of proteasome-associated autoinflammatory syndromes (PRAAS)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All newly identified mutations substantially impact the steady-state expression of the affected proteasome subunits and/or their incorporation into mature 26S proteasomes."
    explanation: >-
      Functional evidence that the reported variants act by impairing subunit
      expression or incorporation, the mechanism this entry models downstream.
- name: PRAAS6
  display_name: PRAAS6 (PSMB9)
  subtype_term:
    preferred_term: proteasome-associated autoinflammatory syndrome 6
    term:
      id: MONDO:0968983
      label: proteasome-associated autoinflammatory syndrome 6
  genes:
  - preferred_term: PSMB9
    description: >-
      Encodes the inducible immunoproteasome catalytic subunit beta-1i. The
      reported disease variant is a recurrent de novo heterozygous missense
      change at glycine 156 that sits on the beta-ring interface.
    term:
      id: hgnc:9546
      label: PSMB9
  description: >-
    The PSMB9-associated form. This row is the most contested in the series. The
    two reported patients carried the same de novo heterozygous PSMB9 G156D
    variant and had pulmonary hypertension and combined immunodeficiency without
    lipoatrophy, and their authors proposed a separate category, PRAAS-ID, rather
    than a PRAAS subtype. MONDO:0968983 instead labels it
    proteasome-associated autoinflammatory syndrome 6, maps it to OMIM:620796 and
    places it directly under this umbrella, which is the nosology this row follows;
    the countervailing argument is recorded here and in the entry notes.
  inheritance:
  - name: Autosomal dominant, de novo
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:34819510
      reference_title: "Heterozygous missense variant of the proteasome subunit β-type 9 causes neonatal-onset autoinflammation and immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we report a de novo heterozygous missense variant of the PSMB9
        proteasome subunit gene in two unrelated Japanese infants resulting in
        amino acid substitution of the glycine (G) by aspartic acid (D) at
        position 156 of the encoded protein β1i.
      explanation: >-
        Reports the de novo heterozygous architecture in both patients.
  evidence:
  - reference: PMID:34819510
    reference_title: "Heterozygous missense variant of the proteasome subunit β-type 9 causes neonatal-onset autoinflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to PRAAS-like manifestations, these individuals suffer from pulmonary hypertension and immunodeficiency, which are distinct from typical PRAAS symptoms."
    explanation: >-
      Supports PSMB9 variants producing a PRAAS-like disease while naming the two
      features that separate it from the rest of the spectrum.
  - reference: PMID:34819510
    reference_title: "Heterozygous missense variant of the proteasome subunit β-type 9 causes neonatal-onset autoinflammation and immunodeficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose the term, proteasome-associated autoinflammatory syndrome with immunodeficiency (PRAAS-ID), to indicate a separate category of autoinflammatory diseases, similar to, but distinct from PRAAS, that describes the patients in this study."
    explanation: >-
      Cited against this row's placement: the reporting authors argue the PSMB9
      entity is a separate category rather than a PRAAS subtype.
  - reference: PMID:26524591
    reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 8 mutations in 4 proteasome genes, PSMA3 (encodes α7), PSMB4
      (encodes β7), PSMB9 (encodes β1i), and proteasome maturation protein
      (POMP), that have not been previously associated with disease
    explanation: >-
      PSMB9 was first linked to CANDLE/PRAAS in this cohort, which is the basis
      for treating the gene as part of the umbrella spectrum.
inheritance:
- name: Autosomal recessive (classic CANDLE/PRAAS)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The founding form of the disease: biallelic PSMB8 variants causing CANDLE.
    This remains the commonest architecture and is the reference point the
    dominant and digenic patterns below were recognized against.
  evidence:
  - reference: PMID:26524591
    reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive mutations in proteasome subunit β 8 (PSMB8), which
      encodes the inducible proteasome subunit β5i, cause the
      immune-dysregulatory disease chronic atypical neutrophilic dermatosis
      with lipodystrophy and elevated temperature (CANDLE)
    explanation: >-
      States the recessive PSMB8 architecture of classic CANDLE explicitly.
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous POMP variant is sufficient in at least one reported
    patient, establishing a dominant arm alongside the recessive and digenic
    ones.
  evidence:
  - reference: PMID:26524591
    reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      1 patient was heterozygous for a POMP mutation, thus establishing a
      digenic and autosomal dominant inheritance pattern of PRAAS
    explanation: >-
      The same sentence that establishes the digenic pattern names the dominant
      one; both are asserted by the discovery study.
- name: Digenic (inducible plus constitutive subunit)
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    A distinct and mechanistically specific two-locus architecture: six patients
    from four families each carried a heterozygous missense variant in an
    INDUCIBLE proteasome subunit together with a variant in a CONSTITUTIVE
    subunit. The two lesions are not interchangeable partners drawn from one
    gene set - they hit the two different proteasome populations, which is the
    sense in which the discovery study titled the mechanism additive loss of
    function. Its functional work showed the mutations converging, by varied
    routes, on proteasome activity; the abstract does not decompose the digenic
    phenotype against either subunit class alone, so no such comparison is
    asserted here. Because the Inheritance class has no genes slot, the genes
    in which that study reported mutations are named: PSMA3, PSMB4, PSMB9,
    PSMB8 and POMP - the inducible subunits among them being PSMB8 and PSMB9
    and the constitutive ones PSMA3 and PSMB4. Note the abstract does not say
    which pairs occurred in which digenic family, so the per-family
    combinations are deliberately not stated. A 2026 report extends the pattern to PSMA6
    (PMID:41205671), which is not curated here because no abstract is available
    to quote.
  evidence:
  - reference: PMID:26524591
    reference_title: "Additive loss-of-function proteasome subunit mutations in CANDLE/PRAAS patients promote type I IFN production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6 patients from 4 families were heterozygous for a missense mutation in 1
      inducible proteasome subunit and a mutation in a constitutive proteasome
      subunit
    explanation: >-
      Reports the two-locus genotype and its recurrence across four independent
      families, which is what distinguishes it from a single-family observation.
      Note the abstract states the subunit CLASSES that pair, not the individual
      genes per family.
  - reference: PMID:38578475
    reference_title: "Proteasome-Associated Syndromes: Updates on Genetics, Clinical Manifestations, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Proteasome-associated diseases have complex inheritance, including
      monogenic, digenic and oligogenic disorders and can be dominantly or
      recessively inherited.
    explanation: >-
      A 2024 review confirming digenic and oligogenic inheritance as an
      established part of the proteasome-disease spectrum, not a single report.

genetic:
- name: Proteasome subunit and assembly-factor loss-of-function variants
  association: Causative
  notes: >
    PRAAS is genetically heterogeneous and includes recessive, digenic, and de
    novo dominant-negative defects affecting proteasome catalytic subunits and
    proteasome assembly factors. Reported genes across the spectrum include
    PSMB8, PSMB9, PSMB7, PSMA3, POMP, PSMG2, PSMB10, PSMA5, and PSMC5. This
    spectrum-level record is retained for the genes in that list which are not the
    gene of any of the six numbered forms curated as subtype rows: PSMB7, PSMA5 and
    PSMC5. Of the two genes
    reported for the first time in the 2023 case series, the authors judged the
    PSMA5 variant most likely disease-causing and stated that the clinical impact
    of the PSMC5 variant could not be determined, so neither is bound as a gene
    here. The numbered forms and their genes are curated as has_subtypes rows with
    matching per-gene records below.
  evidence:
  - reference: PMID:31827472
    reference_title: "Contribution of the Unfolded Protein Response (UPR) to the Pathogenesis of Proteasome-Associated Autoinflammatory Syndromes (PRAAS)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By definition, PRAAS are caused by inherited and/or de novo loss-of-function mutations in genes encoding proteasome subunits such as PSMB8, PSMB9, PSMB7, PSMA3, or proteasome assembly factors including POMP and PSMG2, respectively."
    explanation: Review abstract defines the umbrella disease genetically and anchors the core subunit and assembly-factor gene set.
  - reference: PMID:37600812
    reference_title: "Identification of eight novel proteasome variants in five unrelated cases of proteasome-associated autoinflammatory syndromes (PRAAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in two previously not associated proteasome genes, PSMA5 and PSMC5, were found in a patient who also carried the PSMB8 founder mutation, p.T75M."
    explanation: Recent case-series evidence expands the PRAAS gene spectrum beyond the earlier canonical set.
- name: PSMB8
  association: Recurrent causative gene
  relationship_type: CAUSATIVE
  subtype: PRAAS1
  gene_term:
    preferred_term: PSMB8
    term:
      id: hgnc:9545
      label: PSMB8
  notes: >
    PSMB8 encodes the inducible immunoproteasome beta-5i catalytic subunit and
    remains the best-established recurrent PRAAS gene across CANDLE,
    Nakajo-Nishimura, and JMP presentations.
  evidence:

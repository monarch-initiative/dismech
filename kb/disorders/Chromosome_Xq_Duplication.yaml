- name: Genetic Counseling
  description: >
    Recurrence risk is substantial where a parent carries a structural
    rearrangement, most often a maternally inherited intrachromosomal
    duplication. Because de novo events cluster in the terminal duplication
    class, rearrangement architecture informs counselling. Prenatal diagnosis
    by cytogenetic testing including FISH and/or DNA quantification, and
    preimplantation genetic testing, are available.
  treatment_term:
    preferred_term: Genetic Counseling

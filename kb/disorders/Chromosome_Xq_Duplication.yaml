  description: >
    Diagnosis rests on recognition of the clinical phenotype and is confirmed
    by demonstration of the copy-number gain. Array comparative genomic
    hybridization is the confirmatory test of choice, having superseded
    karyotyping, which detects only duplications above roughly 5-10 Mb.
  derivation_basis: ESTABLISHED_CRITERIA
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis \nis based on clinical features and is confirmed by CGH array techniques."
    explanation: States the diagnostic pathway.

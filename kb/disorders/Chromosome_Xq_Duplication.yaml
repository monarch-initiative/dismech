name: Chromosome Xq Duplication
creation_date: '2026-08-12T00:00:00Z'
category: Genetic
parents:
- Chromosomal Disorder
- Neurodevelopmental Disorder
disease_term:
  preferred_term: chromosome Xq duplication
  term:
    id: MONDO:0017010
    label: partial duplication of the long arm of chromosome X
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0017010
      label: partial duplication of the long arm of chromosome X
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0017010 is the grouping term for segmental copy-number gain of the
      long arm of the X chromosome, carrying "partial duplication of chromosome
      Xq" and "partial trisomy of the long arm of chromosome X" as EXACT
      synonyms and an RO:0004030 (disease has location) relation to Xq. It is
      the exact concept this entry models.
description: >
  Chromosome Xq duplication comprises a heterogeneous group of segmental
  copy-number gains involving the long arm of the X chromosome. They arise
  either as intrachromosomal duplications or through unbalanced X/Y or
  X/autosome translocations. The pathophysiological core is gene *dosage*
  rather than loss of function: an extra copy of one or more dosage-sensitive
  genes within the duplicated interval produces intellectual disability,
  hypotonia, and dysmorphism, and — depending on gene content — hypopituitarism,
  genital anomalies, and proneness to infection.

  Expression is governed by whether X-chromosome dosage compensation succeeds.
  In XY males any structural Xq disomy is necessarily functional disomy, so
  males are typically severely affected. In females the duplicated X is usually
  preferentially inactivated, and carriers are frequently asymptomatic or
  mildly affected; manifesting females are those in whom compensation fails —
  through a random rather than skewed inactivation pattern, or because an
  unbalanced translocation separates the duplicated segment from the
  X-inactivation centre in cis so that it cannot be silenced at all.

  Recurrent, dosage-defined intervals are modelled here as subtypes. The best
  characterised is Xq28 duplication encompassing MECP2, the single most
  important dosage-sensitive gene in distal Xq duplications; SOX3 at
  Xq26.3–q27.1 accounts for the hypopituitary presentations, and a 173 kb
  minimal region at Xq25 containing STAG2 defines a duplication cohesinopathy.
notes: >
  Relationship to the existing dismech entry MECP2 Duplication Syndrome: that
  entry is curated against MONDO:0010283 (syndromic X-linked intellectual
  disability Lubs type, OMIM:300260), a sibling MONDO concept scoped to the
  MECP2-containing duplication as a named Mendelian syndrome. This entry is the
  broader chromosomal grouping (MONDO:0017010) covering the full range of Xq
  segmental gains. The Xq28/MECP2 subtype below is deliberately kept to the
  dosage mechanism and the features that place it within the Xq duplication
  spectrum; the detailed MECP2-specific pathograph (neurodegeneration,
  astrocyte and microglial contributions, mouse reversal studies) is not
  re-derived here and lives in MECP2_Duplication_Syndrome.yaml. Curators editing
  either entry should check the other so the two do not silently diverge.
inheritance:
- name: X-linked inheritance
  description: >
    Most Xq duplications in affected males are inherited from a carrier mother
    who is herself unaffected or only mildly affected because of skewed
    X-inactivation; de novo events and unbalanced products of a parental
    balanced rearrangement also occur. Rearrangement architecture predicts
    recurrence risk: de novo events are much more common among terminal
    duplications than tandem duplications.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrence risk is 
significant if a structural rearrangement is present in one of the parent, the 
most frequent situation being that of an intrachromosomal duplication inherited 
from the mother."
    explanation: States the predominant X-linked maternal transmission pattern.
  - reference: PMID:39696717
    reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 65% of de novo events \noccurred in the Terminal duplication group in contrast with 17% observed in \nTandem duplications."
    explanation: >
      Quantifies how rearrangement architecture predicts de novo versus
      inherited origin, which drives recurrence counselling.
has_subtypes:
- name: Xq28 (MECP2)
  display_name: Xq28 duplication encompassing MECP2
  description: >
    Duplication spanning MECP2 at Xq28, consistently including L1CAM in the
    interstitial microduplication form. The most frequently reported and best
    characterised Xq duplication; increased MECP2 dosage is the principal
    driver of the neurodevelopmental phenotype. Rearrangement structures are
    heterogeneous — tandem duplications, terminal duplications (mostly
    translocations), inverted triplications and other complex genomic
    rearrangements — and this architecture modulates severity. Corresponds to
    the separately curated entry MECP2 Duplication Syndrome (MONDO:0010283).
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  - preferred_term: L1CAM
    term:
      id: hgnc:6470
      label: L1CAM
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These microduplications are var-\niable in size, ranging from 0.2 to 2.2 Mb, but consistently\ninclude MECP2 and L1 cell adhesion molecule (L1CAM), as\nwell as intervening genes"
    explanation: Defines the size range and obligate gene content of the Xq28 interstitial interval.
  - reference: PMID:39696717
    reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication sizes in the cohort ranging from 64.6 kb to 16.5 Mb were \nclassified into four categories comprising of tandem duplications (48%), \nterminal duplications (22%), inverted triplications (20%), and other CGRs (10%)."
    explanation: >
      Contemporary 137-individual cohort defining the size range and structural
      classes of MECP2-spanning gains.
- name: Xq26-qter
  display_name: Xq26–qter duplication / distal Xq functional disomy
  description: >
    Larger, cytogenetically visible duplications of the distal long arm,
    spanning Xq26–q28 (often reported as Xq27–qter). These yield the classic
    recognisable distal Xq disomy phenotype and overlap the Xq28/MECP2 subtype
    in gene content, but carry a heavier burden of growth failure,
    microcephaly, and craniofacial dysmorphism.
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, the Xq26–q28 chromosome region yields a\nrecognisable phenotype including distinctive facial fea-\ntures, major axial hypotonia, severe developmental delay,\nsevere feeding difficulties, abnormal genitalia and prone-\nness to infections"
    explanation: Defines the distal Xq26-q28 interval as a recognisable clinical entity.
- name: Xq26.3-q27.1 (SOX3)
  display_name: Xq26.3–q27.1 duplication encompassing SOX3
  description: >
    Duplication of the Xq26–q27 region containing the transcription factor
    SOX3. Presents with hypopituitarism, anterior pituitary hypoplasia, ectopic
    posterior pituitary and absent infundibulum. Notably, SOX3 over- and
    underdosage converge on the same pituitary phenotype, and intellectual
    disability is not obligate.
  genes:
  - preferred_term: SOX3
    term:
      id: hgnc:11199
      label: SOX3
  evidence:
  - reference: PMID:15800844
    reference_title: "Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a submicroscopic duplication of Xq27.1, the smallest reported to date (685.6 kb), in two siblings \nwith variable hypopituitarism, callosal abnormalities, anterior pituitary hypoplasia (APH), an ectopic posterior pituitary (EPP), and an absent \ninfundibulum."
    explanation: Defines the minimal SOX3-containing duplication and its pituitary phenotype.
- name: Xq25 (STAG2)
  display_name: Xq25 duplication encompassing STAG2
  description: >
    Xq25 microduplication with a shortest region of overlap of 173 kb
    containing only STAG2, a subunit of the cohesin complex. Presents with
    delayed milestones, speech disturbance, intellectual disability, abnormal
    behaviour and characteristic facial dysmorphism. Increased STAG2 dosage
    makes this a cohesinopathy — mechanistically distinct from the
    chromatin-reader (MECP2) and transcription-factor (SOX3) intervals.
  genes:
  - preferred_term: STAG2
    term:
      id: hgnc:11355
      label: STAG2
  evidence:
  - reference: PMID:25677961
    reference_title: "Xq25 duplication: the crucial role of the STAG2 gene in this novel human cohesinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common duplicated \ninterval allowed further refinement of the shortest region of overlap to 173 kb, \nincluding only one gene, STAG2, which encodes a component of the cohesin \ncomplex."
    explanation: Defines the minimal Xq25 interval and identifies STAG2 as the dosage-sensitive gene.
- name: Xq25-q26
  display_name: Xq25–q26 duplication (hypopituitarism and hemihyperplasia)
  description: >
    Mid-Xq gains spanning Xq25–q26 associated with two further presentations:
    X-linked panhypopituitarism with variable intellectual disability mapping
    to a duplicated dosage-sensitive locus, and a 1.65 Mb critical region at
    Xq25 for hemihyperplasia with digital anomalies.
  evidence:
  - reference: PMID:9106538
    reference_title: "X-linked recessive panhypopituitarism associated with a regional duplication in Xq25-q26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An apparent extra copy of the \nmarker DXS102, observed in the region of the disease gene in affected males and \nheterozygous carrier females, suggests that a segment including this marker is \nduplicated."
    explanation: Establishes an Xq25-q26 duplication segregating with panhypopituitarism.
  - reference: PMID:20101693
    reference_title: "Delineation of a 1.65 Mb critical region for hemihyperplasia and digital anomalies on Xq25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have delineated a 1.65 Mb critical region for hemihyperplasia and digital anomalies on chromosome Xq25"
    explanation: Defines the Xq25 critical region for the hemihyperplasia/digital presentation.
- name: Xq21-q24
  display_name: Proximal Xq (Xq21–q24) duplication
  description: >
    Proximal long-arm duplications, reported less often and more heterogeneous
    in breakpoint. Patients show craniofacial dysmorphism, aberrant brain
    myelination, hypotonia, psychomotor and growth retardation, feeding
    problems and hypoplastic genitalia.
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients show craniofacial dysmorphism, brain and neurologic\nabnormalities such as aberrant brain myelination, hypot-\nonia, mental, psychomotor and growth retardation, feed-\ning issues, hypoplasic genitalia."
    explanation: Describes the proximal Xq duplication phenotype.
pathophysiology:
- name: Segmental Copy Number Gain on Xq
  biological_scale: MOLECULAR
  description: >
    An extra copy of a segment of the long arm of the X chromosome. In males
    this arises most often as an intrachromosomal duplication transmitted by a
    non-manifesting mother, and less often from an unbalanced X/Y or
    X/autosome translocation. Duplication size and gene content vary widely,
    from cytogenetically visible multi-megabase segments to submicroscopic
    gains encompassing only one or a few genes detectable by array CGH.
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Xq duplications may be caused either by an \nintrachromosomal duplication or an unbalanced X/Y or X/\nautosome translocation."
    explanation: Establishes the two structural routes to an Xq segmental gain.
  downstream:
  - target: Failure of X-Chromosome Dosage Compensation
    causal_link_type: DIRECT
    description: >
      Whether the extra segment is phenotypically expressed depends entirely on
      whether X-inactivation can silence it.
- name: Failure of X-Chromosome Dosage Compensation
  biological_scale: CELLULAR
  description: >
    X-chromosome inactivation, initiated from the X-inactivation centre (XIC)
    at Xq13, normally equalises X-linked gene expression between XX and XY
    cells. This safeguard fails in three distinguishable ways. In XY males
    there is no second X to inactivate, so any structural Xq disomy is
    obligatorily functional disomy. In females carrying an intrachromosomal
    duplication, inactivation is usually skewed towards the abnormal X, which
    rescues the phenotype; manifesting females are those with a random
    inactivation pattern. In females with an unbalanced X/autosome
    translocation, the translocated X segment is physically separated from its
    XIC in cis and therefore cannot be inactivated at all, so the phenotype is
    fully expressed and can be as severe as in males.
  biological_processes:
  - preferred_term: X-chromosome inactivation
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
    modifier: DECREASED
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In XY males, structural X disomy always results in functional disomy. In \nfemales, failure of X chromosome dosage compensation could result from a variety \nof mechanisms, including an unfavourable pattern of inactivation, a breakpoint \nseparating an X segment from the X-inactivation centre in cis, or a small ring \nchromosome."
    explanation: States the sex-dependent mechanisms by which dosage compensation fails.
  - reference: PMID:16080119
    reference_title: "Duplication of the MECP2 region is a frequent cause of severe mental retardation and progressive neurological symptoms in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The duplications segregate with the disease in the families, and asymptomatic \ncarrier females show complete skewing of X inactivation."
    explanation: Demonstrates that successful skewing towards the duplicated X protects female carriers.
  downstream:
  - target: Functional Xq Disomy and Increased Gene Dosage
    causal_link_type: DIRECT
    description: >
      Uncompensated duplicated genes are expressed at double their normal level.
    evidence:
    - reference: PMID:19232094
      reference_title: "Distal Xq duplication and functional Xq disomy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Functional disomy\n(FD) is the double expression of X-linked genes compared\nto their normal level."
      explanation: Defines functional disomy as the direct consequence of failed compensation.
- name: Functional Xq Disomy and Increased Gene Dosage
  biological_scale: MOLECULAR
  description: >
    Double expression of the X-linked genes lying within the duplicated
    segment. Because most X-linked genes are not tolerant of a twofold
    expression increase, the identity of the dosage-sensitive genes captured by
    the duplication determines which organ systems are affected — this is why
    breakpoint position, not duplication size alone, drives the phenotype.
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations widely vary \ndepending on the gender of the patient and on the gene content of the duplicated \nsegment."
    explanation: Links phenotypic outcome to which genes the duplicated segment contains.
  downstream:
  - target: MECP2 Overexpression
    causal_link_type: DIRECT
    description: Distal Xq duplications spanning Xq28 raise MECP2 dosage.
  - target: SOX3 Overdosage
    causal_link_type: DIRECT
    description: Xq26.3-q27.1 duplications raise SOX3 dosage.
  - target: Increased STAG2 Dosage and Cohesin Dysregulation
    causal_link_type: DIRECT
    description: Xq25 duplications raise STAG2 dosage.
  - target: Increased IRAK1 Dosage
    causal_link_type: DIRECT
    description: >
      IRAK1 lies immediately adjacent to MECP2 and is co-duplicated in most
      Xq28 gains.
- name: MECP2 Overexpression
  biological_scale: MOLECULAR
  description: >
    MeCP2 is a methyl-CpG-binding chromatin protein expressed most highly in
    post-mitotic, post-migratory neurons. Its level must be tightly regulated
    in both directions: loss of function causes Rett syndrome, while a roughly
    twofold increase from duplication is itself pathogenic. The duplicated
    allele is structurally wild type, so this is a quantitative overexpression
    rather than a qualitative change in protein function. Copy number is
    transmitted through to protein: patient-derived lymphoblastoid RNA and
    protein levels are correlated, and triplications produce significantly more
    MECP2 transcript than duplications.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  molecular_functions:
  - preferred_term: methyl-CpG binding
    term:
      id: GO:0008327
      label: methyl-CpG binding
    modifier: INCREASED
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MECP2 gene in Xq28 is the most important dosage-sensitive gene 
responsible for the abnormal phenotype in duplications of distal Xq."
    explanation: Identifies MECP2 dosage as the principal driver in distal Xq duplication.
  - reference: PMID:16080119
    reference_title: "Duplication of the MECP2 region is a frequent cause of severe mental retardation and progressive neurological symptoms in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate \nthat, in humans, not only impaired or abolished gene function but also increased \nMeCP2 dosage causes a distinct phenotype."
    explanation: Establishes increased MECP2 dosage as causal in humans, distinct from loss of function.
  - reference: PMID:39696717
    reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrating that genomic aberrations spanning MECP2 lead to altered MECP2 RNA \nand MECP2 protein levels."
    explanation: Confirms the copy-number-to-protein-dosage step in patient-derived cells.
  downstream:
  - target: Impaired Neuronal Maturation and Progressive Neurological Decline
    causal_link_type: DIRECT
    description: >
      Excess MeCP2 perturbs the transcriptional programs of maturing neurons.
    evidence:
    - reference: PMID:15351775
      reference_title: "Mild overexpression of MeCP2 causes a progressive neurological disorder in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data demonstrate that \nMeCP2 levels must be tightly regulated in vivo, and that even mild \noverexpression of this protein is detrimental."
      explanation: Transgenic mice at ~2x wild-type MeCP2 develop a progressive neurological disorder.
  - target: Dosage- and Architecture-Dependent Severity Gradient
    causal_link_type: DIRECT
    description: >
      The absolute level of MeCP2 reached - highest in triplications - is one of
      the two determinants of where an individual falls on the severity
      gradient.
    evidence:
    - reference: PMID:39696717
      reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RNA-seq data from lymphoblastoid cell lines indicated that \nthe MECP2 transcript quantity in MECP2 triplications is statistically different \nfrom all duplications"
      explanation: >
        Links the MECP2 dosage node to the graded severity node via measured
        transcript differences between triplications and duplications.
- name: Impaired Neuronal Maturation and Progressive Neurological Decline
  biological_scale: CELLULAR
  description: >
    Excess MeCP2 disturbs activity-dependent transcriptional regulation in
    maturing neurons. In transgenic mice expressing MeCP2 at approximately
    twice wild-type levels the course is biphasic and delayed: an early period
    of enhanced hippocampal synaptic plasticity and learning is followed after
    20 weeks by seizures, hypoactivity and premature death. This delayed,
    progressive trajectory mirrors the human course, in which early hypotonia
    and developmental delay give way to progressive spasticity and epilepsy.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron maturation
    term:
      id: GO:0042551
      label: neuron maturation
    modifier: DECREASED
  evidence:
  - reference: PMID:15351775
    reference_title: "Mild overexpression of MeCP2 causes a progressive neurological disorder in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "After 20 weeks of age, however, these mice developed seizures, became hypoactive and \napproximately 30% of them died by 1 year of age."
    explanation: Documents the delayed, progressive neurological course under MeCP2 overexpression.
  - reference: PMID:16080119
    reference_title: "Duplication of the MECP2 region is a frequent cause of severe mental retardation and progressive neurological symptoms in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a small duplication at Xq28 in a large family with a \nsevere form of MR associated with progressive spasticity."
    explanation: Human counterpart - severe intellectual disability with progressive spasticity.
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: >
      Disrupted neuronal maturation underlies the cognitive impairment.
    evidence:
    - reference: PMID:16080119
      reference_title: "Duplication of the MECP2 region is a frequent cause of severe mental retardation and progressive neurological symptoms in males."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Comparison of the \nclinical features in these patients and in a previously reported patient enables \nrefinement of the genotype-phenotype correlation and strongly suggests that \nincreased dosage of MECP2 results in the MR phenotype."
      explanation: Links increased MECP2 dosage to the intellectual disability phenotype.
  - target: Progressive Spasticity
    causal_link_type: DIRECT
    description: >
      The progressive motor component of the neurological decline.
    evidence:
    - reference: PMID:16080119
      reference_title: "Duplication of the MECP2 region is a frequent cause of severe mental retardation and progressive neurological symptoms in males."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a \nsevere form of MR associated with progressive spasticity."
      explanation: Progressive spasticity accompanies the neurological decline in Xq28 duplication.
  - target: Seizures
    causal_link_type: DIRECT
    description: >
      Epilepsy emerges as part of the delayed, progressive phase.
    evidence:
    - reference: PMID:15351775
      reference_title: "Mild overexpression of MeCP2 causes a progressive neurological disorder in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "After 20 weeks of age, however, these mice developed seizures"
      explanation: >
        Seizure onset in the delayed phase of the MeCP2 overexpression mouse
        model. MODEL_ORGANISM evidence; the human seizure frequency is
        separately evidenced on the phenotype itself.
- name: Dosage- and Architecture-Dependent Severity Gradient
  biological_scale: ORGANISM
  description: >
    Severity is graded rather than all-or-none, and is set by two partly
    separable variables: the absolute level of MeCP2 (triplication worse than
    duplication) and the structural class of the rearrangement itself.
    Phenotypic burden — survival, developmental level, microcephaly, epilepsy,
    and genitourinary/eye anomalies — worsens progressively across tandem
    duplications, other complex rearrangements, terminal
    duplications/translocations, and triplications. Rearrangement structure
    therefore contributes to expression variability independently of copy
    number alone, plausibly through position effects and disruption of
    regulatory architecture at the breakpoints.
  evidence:
  - reference: PMID:39696717
    reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analyses indicated a gradual \nworsening of phenotypic features, including overall survival, developmental \nlevels, microcephaly, epilepsy, and genitourinary/eye abnormalities in the \nfollowing order: Tandem duplications, Other complex duplications, Terminal \nduplications/Translocations, and Triplications encompassing MECP2."
    explanation: Establishes the ordered severity gradient across rearrangement classes.
  - reference: PMID:39696717
    reference_title: "Structural variant allelic heterogeneity in MECP2 duplication syndrome provides insight into clinical severity and variability of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas the \nlevel of MECP2 is a key determinant of the phenotype, the DNA rearrangement \nstructure can contribute to clinical severity and disease expression \nvariability."
    explanation: >
      Separates the two contributions - MECP2 level and rearrangement
      architecture - to clinical severity.
- name: SOX3 Overdosage
  biological_scale: MOLECULAR
  description: >
    SOX3 is a developmental transcription factor at Xq27.1 expressed in the
    infundibulum. Both over- and underdosage impair infundibular development
    and produce hypopituitarism, indicating a narrow tolerated expression
    window rather than a simple loss-of-function relationship. This is the
    mechanistic basis of the hypopituitary presentations of Xq26-q27
    duplication.
  biological_processes:
  - preferred_term: adenohypophysis development
    term:
      id: GO:0021984
      label: adenohypophysis development
    modifier: DECREASED
  evidence:
  - reference: PMID:15800844
    reference_title: "Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that both \nover- and underdosage of SOX3 are associated with similar phenotypes, consisting \nof infundibular hypoplasia and hypopituitarism but not necessarily MR."
    explanation: Establishes SOX3 dosage sensitivity in both directions for the pituitary phenotype.
  downstream:
  - target: Hypopituitarism
    causal_link_type: DIRECT
    description: >
      Infundibular and anterior pituitary hypoplasia produce deficient
      anterior pituitary hormone output.
- name: Increased STAG2 Dosage and Cohesin Dysregulation
  biological_scale: MOLECULAR
  description: >
    STAG2 encodes a subunit of the cohesin complex, which mediates sister
    chromatid cohesion and, critically for this phenotype, shapes chromatin
    architecture and enhancer-promoter looping. Increased STAG2 copy number at
    Xq25 is proposed to act by dysregulating cohesin downstream target genes,
    placing this interval among the cohesinopathies. The transcriptional
    consequences are inferred from the mapping data rather than directly
    measured in patients.
  biological_processes:
  - preferred_term: sister chromatid cohesion
    term:
      id: GO:0007062
      label: sister chromatid cohesion
    modifier: INCREASED
  evidence:
  - reference: PMID:25677961
    reference_title: "Xq25 duplication: the crucial role of the STAG2 gene in this novel human cohesinopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that increased STAG2 gene copy number and dysregulation of \nits downstream target genes may be responsible for the specific clinical \nfindings of this syndrome."
    explanation: >
      Proposes the cohesin-dysregulation mechanism. Marked PARTIAL because the
      source frames it as a suggestion ("may be responsible") supported by
      mapping rather than direct transcriptional measurement in patients.
- name: Increased IRAK1 Dosage
  biological_scale: MOLECULAR
  description: >
    IRAK1 and IKBKG lie immediately telomeric to MECP2 and are usually
    contained within the duplicated Xq28 segment. Both are innate immune
    signalling components downstream of the Toll-like and IL-1 receptors, and
    their increased dosage has been proposed as the explanation for the
    recurrent respiratory infections that distinguish Xq28 functional disomy
    from other X-linked intellectual disability/hypotonia syndromes. This
    remains a proposed rather than demonstrated mechanism.
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrent infections\nmight result from the increased dosage of the IRAK1 or\nIKBKG genes generally present in the duplicated region"
    explanation: >
      Proposes IRAK1/IKBKG dosage as the basis of recurrent infection. Marked
      PARTIAL because the source states this as a hypothesis ("might result
      from"), not a demonstrated mechanism.
  downstream:
  - target: Recurrent Respiratory Infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Unresolved. Dysregulated innate immune signalling is the proposed route,
      but aspiration secondary to severe hypotonia and feeding difficulty is a
      competing, non-immune explanation for the same clinical finding.
    description: >
      Proposed contribution of innate immune gene dosage to infection
      proneness.

discussions:
- discussion_id: gap_xq_dup_irak1_vs_aspiration
  kind: KNOWLEDGE_GAP
  prompt: >
    Is the recurrent-infection phenotype of Xq28 functional disomy caused by
    increased innate-immune gene dosage (IRAK1/IKBKG), or is it secondary to
    aspiration from severe hypotonia and feeding difficulty?
  attaches_to:
  - pathophysiology#Increased IRAK1 Dosage
  rationale: >
    The IRAK1/IKBKG dosage hypothesis is stated only speculatively in the
    primary literature ("might result from"), and no study has demonstrated
    altered innate immune signalling in patient cells. A purely mechanical
    explanation is plausible given that severe axial hypotonia, dysphagia and
    gastroesophageal reflux are themselves near-universal in this population.
    The distinction matters clinically: an immune mechanism would justify
    immunological evaluation and possibly prophylaxis, whereas an aspiration
    mechanism directs management to feeding and airway protection.
  proposed_experiments:
  - experiment_id: exp_xq_dup_irak1_signalling
    name: Innate immune signalling assay in patient-derived cells
    description: >
      Quantify IRAK1 and IKBKG transcript and protein levels and measure
      TLR/IL-1 pathway output in cells from individuals with Xq28 duplication,
      stratified by whether the duplication includes IRAK1/IKBKG.
  - experiment_id: exp_xq_dup_infection_stratified
    name: Genotype-stratified infection burden comparison
    description: >
      Compare respiratory infection rates between individuals whose
      duplications do and do not encompass IRAK1/IKBKG, controlling for degree
      of hypotonia and documented aspiration.
- discussion_id: gap_xq_dup_female_manifesting_carriers
  kind: KNOWLEDGE_GAP
  prompt: >
    What determines whether a female carrier of an Xq duplication is
    asymptomatic or manifests a male-like phenotype?
  attaches_to:
  - pathophysiology#Failure of X-Chromosome Dosage Compensation
  rationale: >
    X-inactivation pattern explains most of the variance - skewing towards the
    duplicated X protects, random inactivation manifests, and an unbalanced
    translocation separating the segment from the XIC in cis produces full
    expression. But rare manifesting females have been described despite
    favourable skewing, for which local escape from inactivation, expression of
    recessive alleles on the active X, or gene disruption at the breakpoint
    have all been proposed without resolution. Predicting carrier outcome is
    directly actionable for genetic counselling.
  evidence:
  - reference: PMID:19232094
    reference_title: "Distal Xq duplication and functional Xq disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In rare cases, a favourable skewed\nX-inactivation is observed. For these cases, other explana-\ntions such as local escape from inactivation, expression of\nrecessive genes from the active X, or disruption of a gene\nby the rearrangement have been suggested"
    explanation: States the unresolved alternatives for manifesting females with favourable skewing.
- discussion_id: gap_xq_dup_stag2_transcriptional_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >
    Which cohesin-dependent transcriptional programs are dysregulated by
    increased STAG2 dosage, and do they explain the Xq25 duplication phenotype?
  attaches_to:
  - pathophysiology#Increased STAG2 Dosage and Cohesin Dysregulation
  rationale: >
    The Xq25 interval has been mapped to a 173 kb region containing STAG2
    alone, which is strong positional evidence, but the proposed mechanism -
    dysregulation of cohesin downstream target genes - is an inference rather
    than a measurement. No patient-derived transcriptomic data establishing
    which targets change, or in which direction, has been reported. Without it,
    Xq25 duplication is classified as a cohesinopathy on positional grounds
    alone, and the mechanistic contrast with loss-of-function STAG2
    cohesinopathies remains untested.
  proposed_experiments:
  - experiment_id: exp_xq25_stag2_transcriptome
    name: Transcriptomic profiling of STAG2 duplication patient cells
    description: >
      RNA-seq of patient-derived cells carrying the Xq25 duplication versus
      controls, testing whether cohesin target gene sets are differentially
      expressed and whether the direction of change is opposite to that seen in
      STAG2 loss-of-function cohesinopathy.

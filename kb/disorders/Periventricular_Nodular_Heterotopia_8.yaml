discussions:
- discussion_id: controversy_arf1_haploinsufficiency_vs_constitutive_activation
  prompt: >-
    Does the ARF1-related disorder arise from ARF1 haploinsufficiency
    (loss of function) or from constitutive activation (gain of function) of the
    ARF1 GTPase?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#ARF1 GTPase Cycle Dysregulation
  rationale: >-
    The first clinical report framed the mechanism as haploinsufficiency, citing
    an inherited loss-type variant with variable expressivity. The functional
    data are directly contradictory for the recurrent p.R99H variant: one group's
    GST-GGA3 pulldown found that the patient variants caused a significant
    decrease in active ARF1 (a loss-of-function reading), whereas another group
    found the same variant has increased GDP/GTP exchange, tighter effector
    binding, resistance to brefeldin A, and Golgi swelling - the signature of
    constitutive activation. Both readings converge on Golgi disruption and
    impaired neuronal migration, so the downstream pathograph is unaffected, but
    the allele-level mechanism (and therefore the expected effect of truncating
    versus missense variants) is unresolved.
  evidence:
  - reference: PMID:34353862
    reference_title: "ARF1 haploinsufficiency causes periventricular nodular heterotopia with variable clinical expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haploinsufficiency of this gene causes a recognisable neurological disorder with abnormal neuronal migration and variable clinical expressivity."
    explanation: States the haploinsufficiency (loss-of-function) interpretation.
  - reference: PMID:37185208
    reference_title: "ARF1-related disorder: phenotypic and molecular spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "were evaluated by the functional pulldown assay all caused a significant decrease in ARF1 activity (figure 2, p<0.05)."
    explanation: A functional pulldown of five patient variants (including R99H) found decreased active ARF1, supporting the loss-of-function reading.
  - reference: PMID:36345169
    reference_title: "A neurodevelopmental disorder associated with an activating de novo missense variant in ARF1."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "indicating that the pathogenetic mechanism of the R99H-ARF1 variant involves constitutive activation with resultant Golgi and endosomal alterations."
    explanation: Functional evidence for constitutive activation of the same R99H variant, contradicting the loss-of-function reading.

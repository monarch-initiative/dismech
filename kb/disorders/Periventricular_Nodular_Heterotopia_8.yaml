genetic:
- name: ARF1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ARF1
    term:
      id: hgnc:652
      label: ARF1
  notes: >-
    Heterozygous ARF1 variants cause the autosomal dominant ARF1-related
    disorder, of which PVNH8 is the periventricular nodular heterotopia
    presentation. Most variants are de novo missense; the recurrent c.296G>A
    p.R99H substitution has been identified in multiple unrelated individuals.
    ARF1 encodes ADP-ribosylation factor 1, activated by the GEF ARFGEF2, whose
    biallelic loss causes the autosomal recessive form of periventricular
    heterotopia.
  evidence:
  - reference: PMID:37185208
    reference_title: "ARF1-related disorder: phenotypic and molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm the role of ARF1 in an autosomal dominant syndrome with a phenotypic spectrum including severe ID, microcephaly, seizures and PVNH due to impaired neuronal migration."
    explanation: Confirms ARF1 as the autosomal dominant causative gene.
  variants:
  - name: p.Arg99His
    description: >-
      Recurrent de novo missense variant (c.296G>A; p.R99H) identified in
      multiple unrelated individuals, and the variant carrying the most
      functional data. Those data conflict: some studies report increased
      GDP/GTP exchange, tighter binding to the effector GGA3 and constitutive
      activation, while another reports a decreased level of steady-state active
      ARF1 (the mechanism controversy recorded in discussions). They agree it
      disrupts the Golgi and causes a neuronal migration defect; notably one
      R99H individual did not have periventricular nodular heterotopia.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36345169
      reference_title: "A neurodevelopmental disorder associated with an activating de novo missense variant in ARF1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we report a pediatric patient with an ARF1-related disorder because of a monoallelic de novo missense variant (c.296 G > A; p.R99H) in the ARF1 gene, associated with developmental delay, hypotonia, intellectual disability and motor stereotypies."
      explanation: Identifies the recurrent de novo p.R99H variant and its clinical features in a patient.
    - reference: PMID:36345169
      reference_title: "A neurodevelopmental disorder associated with an activating de novo missense variant in ARF1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The absence of periventricular nodular heterotopias in this R99H-ARF1 subject also indicates that this finding may not be a consistent phenotypic expression of all ARF1-related disorders."
      explanation: Shows PVNH is not an obligate feature even for the recurrent R99H variant.
  - name: p.Leu170Pro
    description: >-
      De novo missense variant (c.509T>C; p.Leu170Pro) reported in the first
      Chinese individual with ARF1-related disease, who presented with
      drug-refractory focal epilepsy and mild developmental delay but no
      periventricular nodular heterotopia. Molecular modelling and
      co-immunoprecipitation indicate it weakens the ARF1-GGA3 effector
      interaction, reinforcing that PVNH is not an obligate feature.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:40689678
      reference_title: "ARF1-Related Diseases in China: The Initial Study of Phenotype and Molecular Profile."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A de novo variant, c.509T > C (p.Leu170Pro), was detected in the ARF1 gene"

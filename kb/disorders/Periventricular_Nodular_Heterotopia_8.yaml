name: Periventricular Nodular Heterotopia 8
category: Mendelian
creation_date: "2026-10-25T00:00:00Z"
synonyms:
- PVNH8
- ARF1-related periventricular nodular heterotopia
- ARF1-related neurodevelopmental disorder
- ARF1-related disorder
description: >-
  Periventricular nodular heterotopia 8 (PVNH8) is the periventricular nodular
  heterotopia form of the autosomal dominant ARF1-related neurodevelopmental
  disorder. ARF1 encodes ADP-ribosylation factor 1, a small GTPase that cycles
  between GDP- and GTP-bound states to drive COPI-vesicle coat assembly and
  membrane traffic at the Golgi apparatus; it is activated by the guanine
  nucleotide exchange factor ARFGEF2, whose own loss causes an autosomal
  recessive form of periventricular heterotopia. Disease variants disrupt the
  ARF1 GTPase cycle and the Golgi apparatus, impairing the vesicle trafficking
  and cell-cell adhesion that maintain apical radial-glial / neuroependymal
  integrity at the ventricular surface, so neurons fail to initiate migration
  from the periventricular germinal zone and remain as nodules of gray matter
  lining the lateral ventricles. The broader phenotype is dominated by
  intellectual disability, with variable microcephaly, seizures, corpus callosum
  abnormalities, hypotonia, and sensorineural/visual impairment; periventricular
  nodular heterotopia itself is a variable (minority) feature across the reported
  cohort rather than an obligate finding. Most variants are de novo, though
  inherited transmission with markedly variable expressivity has been documented.
disease_term:
  preferred_term: periventricular nodular heterotopia 8
  term:
    id: MONDO:0032588
    label: periventricular nodular heterotopia 8
parents:
- Periventricular Nodular Heterotopia
notes: >-
  No GeneReviews chapter exists for ARF1-related disorder / PVNH8 (checked
  2026-10 via the committed Bookshelf index and a PubMed genereviews[book] title
  search). The disorder is MONDO-named for the periventricular nodular
  heterotopia feature, but the ARF1-related phenotype is broader than PVNH, which
  was present in only 3/15 of the best-phenotyped cohort (PMID:37185208).
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    PVNH8 follows autosomal dominant inheritance. Most reported ARF1 variants are
    de novo, but an inherited variant with markedly variable expressivity has
    been documented, where a mildly affected father transmitted the variant to a
    daughter with intellectual disability and periventricular nodular heterotopia.
  evidence:
  - reference: PMID:37185208
    reference_title: "ARF1-related disorder: phenotypic and molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo variants (10 missense, 1 frameshift, 1 splice altering resulting in 9 residues insertion) in ARF1 were identified among 17 unrelated individuals."
    explanation: Establishes that ARF1 disease variants are predominantly de novo across an international cohort.
  - reference: PMID:34353862
    reference_title: "ARF1 haploinsufficiency causes periventricular nodular heterotopia with variable clinical expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first inherited variant of ARF1 in a girl with intellectual disability and periventricular nodular heterotopia who inherited the variant from the father with previously undiagnosed single nodular heterotopia and mild clinical expression."
    explanation: Documents inherited transmission with variable clinical expressivity, supporting autosomal dominant inheritance.
pathophysiology:
- name: ARF1 GTPase Cycle Dysregulation
  biological_scale: MOLECULAR
  description: >-
    ARF1 is a small GTPase that acts as a molecular switch at the Golgi, inactive
    when bound to GDP and active when bound to GTP. Heterozygous disease variants
    disrupt this cycle, but the direction of the functional effect is contested:
    for the same recurrent p.R99H variant one study found a decreased level of
    steady-state active (GTP-bound) ARF1, while others found increased GDP/GTP
    exchange and constitutive activation. The readings converge on Golgi
    disruption regardless (see the mechanism controversy in discussions).
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:39052890
    reference_title: "Variations associated with neurodevelopmental disorders affect ARF1 function and cortical development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ARF1-p.R19C, -p.F51L, -p.R99C and -p.R99H exhibit higher GDP/GTP exchange activity compared to ARF1 wild type (WT)."
    explanation: Biochemical assay shows disease variants dysregulate the ARF1 GTPase cycle.
  downstream:
  - target: Golgi Vesicular Trafficking Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36345169
      reference_title: "A neurodevelopmental disorder associated with an activating de novo missense variant in ARF1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "indicating that the pathogenetic mechanism of the R99H-ARF1 variant involves constitutive activation with resultant Golgi and endosomal alterations."
      explanation: Links the ARF1 variant directly to Golgi and endosomal disruption.
- name: Golgi Vesicular Trafficking Failure
  biological_scale: CELLULAR
  description: >-
    Dysregulated ARF1 disrupts COPI-dependent vesicular transport at the Golgi
    apparatus. Expression of disease variants causes swelling and expansion of
    the Golgi in cultured cells and in migrating cortical neurons.
  biological_processes:
  - preferred_term: Golgi vesicle transport
    modifier: DECREASED
    term:
      id: GO:0048193
      label: Golgi vesicle transport
  evidence:
  - reference: PMID:36345169
    reference_title: "A neurodevelopmental disorder associated with an activating de novo missense variant in ARF1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the expression of this variant caused swelling of the Golgi apparatus"
    explanation: Demonstrates Golgi structural disruption by a pathogenic ARF1 variant in cultured cells.
  - reference: PMID:39052890
    reference_title: "Variations associated with neurodevelopmental disorders affect ARF1 function and cortical development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of these variants resulted in the expansion of the Golgi apparatus in migrating cortical neurons."
    explanation: Shows Golgi disruption in migrating cortical neurons in vivo.
  downstream:
  - target: Radial Glial and Neuroependymal Integrity Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24089482
      reference_title: "Filamin A regulates neuronal migration through brefeldin A-inhibited guanine exchange factor 2-dependent Arf1 activation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Arf1 is required for maintenance of cell-cell junction connectivity and focal adhesion assembly."
      explanation: Links Arf1-dependent trafficking to the cell-adhesion junctions that maintain neuroependymal integrity.
- name: Radial Glial and Neuroependymal Integrity Failure
  biological_scale: CELLULAR
  description: >-
    Impaired vesicle trafficking and cell-cell adhesion compromise the apical
    attachment of radial glial cells and the integrity of the neuroependymal
    lining at the ventricular surface, the scaffold on which neurons migrate.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  evidence:
  - reference: PMID:34353862
    reference_title: "ARF1 haploinsufficiency causes periventricular nodular heterotopia with variable clinical expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The primary anatomical defect leading to periventricular nodular heterotopia occurs within the neural progenitors along the neuroepithelial lining of the lateral ventricles and results from a defect in the initiation of neuronal migration, following disruption of the neuroependyma and impaired neuronal motility."
    explanation: Places the anatomical defect at the neuroependymal lining of the lateral ventricles.
  - reference: PMID:24089482
    reference_title: "Filamin A regulates neuronal migration through brefeldin A-inhibited guanine exchange factor 2-dependent Arf1 activation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "coordinated interactions between actin (through FlnA) and vesicle trafficking (through Big2-Arf) direct the assembly and disassembly of membrane protein complexes required for neuronal migration and neuroependymal integrity."
    explanation: Establishes Arf1-dependent trafficking as required for neuroependymal integrity in a mouse model.
  downstream:
  - target: Neuronal Migration Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34353862
      reference_title: "ARF1 haploinsufficiency causes periventricular nodular heterotopia with variable clinical expressivity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "results from a defect in the initiation of neuronal migration, following disruption of the neuroependyma and impaired neuronal motility."
      explanation: Asserts that neuroependymal disruption precedes and causes the migration defect.

name: Spinocerebellar Ataxia, Autosomal Recessive, With Axonal Neuropathy 3
category: Mendelian
creation_date: '2026-10-27T00:00:00Z'
synonyms:
- SCAN3
- Spinocerebellar ataxia with axonal neuropathy type 3
- COA7-related spinocerebellar ataxia with axonal neuropathy
- COA7-related disorder
description: >-
  Spinocerebellar ataxia with axonal neuropathy type 3 (SCAN3) is an autosomal
  recessive mitochondrial disorder caused by biallelic loss-of-function variants in
  COA7, which encodes a metazoan-specific cytochrome c oxidase (complex IV) assembly
  factor of the mitochondrial intermembrane space. The core picture is an early-onset,
  slowly progressive axonal sensorimotor neuropathy resembling Charcot-Marie-Tooth
  disease combined with cerebellar ataxia and cerebellar atrophy. Leukoencephalopathy
  (cavitating in the first reported patient), spinal cord atrophy, mild cognitive
  impairment, subclinical mitochondrial myopathy, and, in a few patients, dystonia or
  levodopa-responsive parkinsonism make up a wider COA7-related spectrum; onset ranges
  from infancy to the fourth decade. Patient cells show isolated or predominant complex
  IV deficiency with reduced assembled complex IV that is rescued by wild-type COA7.
  Only a small number of patients, most of them Japanese, have been described.

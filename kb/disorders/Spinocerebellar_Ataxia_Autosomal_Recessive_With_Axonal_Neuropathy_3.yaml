  description: SETX-related recessive ataxia with axonal neuropathy (SCAN2).
  disease_term:
    preferred_term: SCAN2 / AOA2
    term:
      id: MONDO:0018996
      label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
  distinguishing_features:
  - Ocular signs such as oculomotor apraxia, absent in SCAN3
  - More cognitive impairment than SCAN3
  evidence:
  - reference: PMID:35603692
    reference_title: A novel compound heterozygous mutation in the COA7 gene responsible for a Chinese patient with spinocerebellar ataxia with axonal neuropathy type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Compared with SCAN1 and SCAN2 patients, SCAN3 patients had earlier onset age, less
      cognitive impairment, and no ocular signs.
    explanation: Literature comparison of SCAN1, SCAN2 and SCAN3.

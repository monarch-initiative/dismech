- name: Bioenergetic Failure in Energy-Demanding Neural and Muscle Tissue
  conforms_to: complex_iv_assembly_deficiency#High-Energy Tissue Dysfunction
  description: >-
    Energy failure in the tissues the disease affects: peripheral nerve, cerebellum,
    cerebral white matter, spinal cord, the nigrostriatal system and skeletal muscle.
    This is the module's high-energy tissue step with the COA7-specific tissue tropism
    substituted. It is inferred from the biochemical defect and the tissue findings; no
    study has measured energy status in patient neural tissue, and why these tissues are
    selectively affected is not known.
  biological_scale: TISSUE

genetic:
- name: COA7
  notes: >-
    COA7 (formerly C1orf163, SELRC1, RESA1) encodes a 231-residue protein with five
    Sel1-like repeats that is present in animals but absent from yeast. Reported alleles
    are mostly missense, with a frameshift, a nonsense, a splice-donor and a whole-exon-2
    deletion; the exon deletion was found by MLPA after sequencing detected only one
    allele. c.17A>G (p.Asp6Gly) recurs in Japanese patients on a shared haplotype. No
    ClinGen gene-disease validity record for COA7 is cached, so none is recorded.
  gene_term:
    preferred_term: COA7
    term:
      id: hgnc:25716
      label: COA7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified four unrelated patients with recessive mutations in COA7 among
      a Japanese case series of 1396 patients with Charcot-Marie-Tooth disease (CMT) or
      other inherited peripheral neuropathies, including complex forms of CMT.
    explanation: Gene identification in the founding series.
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lentiviral-mediated expression of recombinant wild-type COA7 cDNA in the patient
      fibroblasts led to the recovery of the defect in COX activity and restoration of
      normal COX amount.
    explanation: Complementation with wild-type COA7 confirms causality.
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      COA7 is a 231aa-long mitochondrial protein present in animals, containing five
      Sel1-like tetratricopeptide repeat sequences, which are likely to interact with
      partner proteins.
    explanation: Describes the COA7 protein.
  variants:
  - name: c.17A>G (p.Asp6Gly)
    description: >-
      Recurrent missense allele, homozygous or compound heterozygous in most Japanese
      patients and in one Chinese patient, carried on a common haplotype in Japan.
      Classified pathogenic by ACMG criteria in the 2023 Japanese series.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37750949
      reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A haplotype analysis of the mutation hotspot in Japan, c.17A > G (p.D6G),
        uncovered a common haplotype block.
      explanation: Recurrent Japanese allele on a shared haplotype.
    - reference: PMID:37750949
      reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Taken together, both variants were classified as pathogenic according to the
        ACMG guideline.
      explanation: ACMG pathogenic classification of p.Asp6Gly and p.Arg39Trp.
    - reference: PMID:37264311
      reference_title: "Parkinsonism in spinocerebellar ataxia with axonal neuropathy caused by adult-onset COA7 variants: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome analysis revealed COA7 missense mutation in homozygotes (NM_023077.2:c.17A
        > G, NP_075565.2: p.Asp6Gly).
      explanation: Homozygous p.Asp6Gly in the adult-onset patient.
  - name: c.115C>T (p.Arg39Trp)
    description: >-
      Missense allele found in trans with an exon 2 deletion in one patient and
      homozygous in another; classified pathogenic in the 2023 Japanese series.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29718187
      reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings suggest that Patient 2 has a compound heterozygous genotype that
        comprises a deletion of exon 2 (inherited from mother) and a missense variant
        (inherited from father).
      explanation: p.Arg39Trp in trans with an exon 2 deletion.
    - reference: PMID:37750949
      reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Taken together, both variants were classified as pathogenic according to the
        ACMG guideline.
      explanation: ACMG pathogenic classification of p.Asp6Gly and p.Arg39Trp.
  - name: c.410A>G (p.Tyr137Cys) / c.287+1G>T
    description: >-
      Compound heterozygous missense and splice-donor alleles in the first reported
      patient; the splice variant causes in-frame skipping of exon 2. Both
      mutant proteins are imported poorly and degraded by the proteasome.
    type: missense
    evidence:
    - reference: PMID:27683825
      reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found compound heterozygous mutations in COA7: a paternal c.410A>G, p.Y137C,
        and a maternal c.287+1G>T variants.
      explanation: Identifies the two alleles in the first patient.
    - reference: PMID:27683825
      reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        whereas the splice site mutation produces the in-frame deletion of the 47 amino
        acids encoded by exon 2
      explanation: The splice-donor variant causes in-frame loss of exon 2.
    - reference: PMID:30885959
      reference_title: Inhibition of proteasome rescues a pathogenic variant of respiratory chain assembly factor COA7.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also found that pathogenic mutant versions of COA7 are imported slower than the
        wild-type protein, and mislocalized proteins are degraded in the cytosol by the
        proteasome.
      explanation: The Y137C and exon 2-deleted proteins are imported slowly and degraded.
  - name: c.554G>A (p.Trp185*)
    description: Nonsense allele in trans with p.Asp6Gly in a Chinese patient.
    type: nonsense
    evidence:
    - reference: PMID:35603692
      reference_title: A novel compound heterozygous mutation in the COA7 gene responsible for a Chinese patient with spinocerebellar ataxia with axonal neuropathy type 3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole exome next-generation sequencing identified a novel compound heterozygous
        mutation of COA7 (c.17A>G p.D6G; c.554G>A, p.W185*) in this patient.
      explanation: Identifies the nonsense allele.
  - name: c.511G>A (p.Ala171Thr) / c.566A>G (p.Asn189Ser)
    description: Compound heterozygous missense alleles in the infantile encephalopathic form.
    type: missense
    evidence:
    - reference: PMID:34322155
      reference_title: Biallelic COA7-Variants Leading to Developmental Regression With Progressive Spasticity and Brain Atrophy in a Chinese Patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Trio-exome sequencing revealed compound heterzygous variants in COA7 (c.511G >
        A/p.Ala171Thr and c.566A > G/p.Asn189Ser).
      explanation: Identifies the two alleles.
  - name: c.449G>A (p.Cys150Tyr)
    description: >-
      Missense allele in the fourth Sel1-like repeat, in trans with p.Asp6Gly in the
      infantile dystonia patient; classified likely pathogenic.
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:37750949
      reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition to our original report, which involved four patients until 2018, we
        identified biallelic variants of the COA7 gene in another three unrelated
        patients, and the variants were c.17A > G (p.D6G), c.115C > T (p.R39W), and
        c.449G > A (p.C150Y; novel).
      explanation: Identifies p.Cys150Tyr.
    - reference: PMID:37750949
      reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Altogether, we classified these variants as likely pathogenic according to the
        ACMG guideline.
      explanation: ACMG likely pathogenic classification.
  - name: c.457C>T (p.Leu153Phe)
    description: Novel missense allele carried in compound heterozygosity by two Italian siblings.
    type: missense
    evidence:
    - reference: PMID:42182620
      reference_title: Compound Heterozygous COA7 Variants Presenting With Childhood-Onset Axonal Neuropathy in 2 Siblings.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe 2 siblings carrying compound heterozygous COA7 variants, one of which
        (c.457C>T; p.Leu153Phe) is novel.
      explanation: Identifies p.Leu153Phe.
treatments:
- name: Levodopa
  description: >-
    Levodopa improved parkinsonism in one patient and slightly in a second, and gave
    an initial transient response in the infantile generalized dystonia patient.
    There is no disease-modifying therapy for SCAN3.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency
    description: Levodopa replaces striatal dopamine lost with nigrostriatal terminal degeneration.
  evidence:
  - reference: PMID:37264311
    reference_title: "Parkinsonism in spinocerebellar ataxia with axonal neuropathy caused by adult-onset COA7 variants: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Levodopa administration improved parkinsonism in this patient.
    explanation: Levodopa response in an adult-onset patient.
  - reference: PMID:37750949
    reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 2 presented with cerebellar ataxia, neuropathy, as well as parkinsonism,
      and showed a slight improvement upon levodopa administration.
    explanation: Slight levodopa response in a second patient.
- name: Deep Brain Stimulation
  description: >-
    Deep brain stimulation gave an initial transient benefit for infantile-onset
    generalized dystonia in one patient, who nonetheless became bedridden by age 19.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  evidence:
  - reference: PMID:37750949
    reference_title: "Dystonia and Parkinsonism in COA7-related disorders: expanding the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite experiencing an initial transient positive response to levodopa and deep
      brain stimulation, he became bedridden by the age of 19.
    explanation: Transient response to levodopa and deep brain stimulation for dystonia.
- name: Baclofen
  description: Baclofen partially controlled progressive spasticity in the infantile encephalopathic form.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baclofen
      term:
        id: CHEBI:2972
        label: baclofen
  evidence:
  - reference: PMID:34322155
    reference_title: Biallelic COA7-Variants Leading to Developmental Regression With Progressive Spasticity and Brain Atrophy in a Chinese Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the following 5 months, the spasticity worsened, repeatedly induced by
      intestinal infection but was reasonably controlled with baclofen treatment.
    explanation: Baclofen controlled spasticity in one patient.
- name: Protirelin Tartrate
  description: >-
    Protirelin tartrate, a thyrotropin-releasing hormone preparation used for ataxia in
    Japan, gave only slight transient improvement in ataxia in one patient before the
    symptoms became refractory.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: protirelin
      term:
        id: CHEBI:35940
        label: protirelin
  evidence:
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment with protirelin tartrate (TRH-T) resulted in slight transient
      improvement in ataxia. However, the symptoms progressively worsened and became
      refractory.
    explanation: Only a slight, transient benefit in a single patient.
- name: Supportive Care and Orthoses
  description: >-
    Management is supportive, including ankle-foot orthoses for distal weakness and
    walking aids; no COA7-specific supportive regimen has been evaluated.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At her last follow-up examination, at 19 years of age, she was able to walk alone
      only with ankle-foot orthotic aids and had developed a marked dorsal-lumbar
      scoliosis.
    explanation: Use of ankle-foot orthoses for walking.
animal_models:
- name: Drosophila neuron-specific dCOA7 RNAi knockdown
  species: Drosophila melanogaster
  genotype: elav-GAL4 driven UAS-dCOA7 RNAi (CG13865), two independent RNAi lines
  publication: PMID:29718187
  description: >-
    Pan-neuronal knockdown of the fly COA7 orthologue shortens lifespan, causes an
    age-dependent climbing defect and shortens larval motor neuron synaptic branches at
    the neuromuscular junction; eye-specific knockdown gives a rough eye.
  modeled_mechanisms:
  - target: Length-Dependent Peripheral Axonal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Neuronal loss of dCOA7 damages motor neuron presynaptic terminals and motor
      function, in line with the motor axonal neuropathy.
    limitations: >-
      RNAi knockdown rather than patient alleles, in an invertebrate without myelinating
      Schwann cells; axonal degeneration of peripheral nerve and complex IV activity were
      not measured in the flies, so the link to human axonal degeneration is inferred
      from terminal morphology and locomotion.
    readouts:
    - name: Larval neuromuscular junction synaptic branch length
      target: Length-Dependent Peripheral Axonal Degeneration
      direction: DECREASED
      interpretation: Shorter motor neuron terminal branches after neuronal dCOA7 knockdown.
      evidence:
      - reference: PMID:29718187
        reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Measurement of the total length of synaptic branches of motor neurons in these
          larvae indicated that the total branch length was significantly decreased
        explanation: Reports the decreased synaptic branch length.
    evidence:
    - reference: PMID:29718187
      reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, Drosophila COA7 (dCOA7) knockdown models showed rough eye
        phenotype, reduced lifespan, impaired locomotive ability and shortened synaptic
        branches of motor neurons.
      explanation: Summarizes the neurodegenerative phenotype of the fly model.
experimental_models:
- name: COA7 patient-derived skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary and immortalized fibroblasts from patients carrying biallelic COA7 variants,
    used to measure complex IV assembly and activity, to test complementation with
    wild-type COA7, and to test rescue by proteasome inhibitors.
  publication: PMID:27683825
  modeled_mechanisms:
  - target: Complex IV Assembly Stall After COX1 Module Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Patient fibroblasts show the complex IV assembly defect and its rescue.
    limitations: >-
      Fibroblasts are not the affected neural cells, and in one patient fibroblast
      respiratory chain activity was normal despite muscle mitochondrial abnormalities,
      so fibroblasts can under-report the defect.
    readouts:
    - name: Complex IV activity after proteasome inhibition
      target: Complex IV Assembly Stall After COX1 Module Formation
      direction: RESTORED
      interpretation: >-
        Proteasome inhibitors raised mitochondrial COA7 and complex IV activity in
        patient fibroblasts, an in vitro rescue only.
      evidence:
      - reference: PMID:30885959
        reference_title: Inhibition of proteasome rescues a pathogenic variant of respiratory chain assembly factor COA7.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Interestingly, proteasome inhibition rescued both the mitochondrial
          localization of COA7 and complex IV activity in patient-derived fibroblasts.
        explanation: Reports the partial rescue of complex IV activity.
    evidence:
    - reference: PMID:27683825
      reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In patient-derived immortalised fibroblasts, the levels of fully assembled cIV
        and of the cIII2+cIV supercomplex were clearly lower relative to controls
      explanation: Patient fibroblasts reproduce the assembly defect.
differential_diagnoses:
- name: Spinocerebellar ataxia with axonal neuropathy type 1
  description: TDP1-related recessive ataxia with axonal neuropathy.
  disease_term:
    preferred_term: SCAN1
    term:
      id: MONDO:0011801
      label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 1
  distinguishing_features:
  - Later onset than SCAN3
  evidence:
  - reference: PMID:35603692
    reference_title: A novel compound heterozygous mutation in the COA7 gene responsible for a Chinese patient with spinocerebellar ataxia with axonal neuropathy type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Compared with SCAN1 and SCAN2 patients, SCAN3 patients had earlier onset age, less
      cognitive impairment, and no ocular signs.
    explanation: Literature comparison of SCAN1, SCAN2 and SCAN3.

  downstream:
  - target: Glycolytic Shift With Increased Lactate Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired oxidative metabolism shifts pyruvate toward lactate, raising lactate and
      pyruvate in blood and CSF.
  - target: Bioenergetic Failure in Energy-Demanding Neural and Muscle Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced respiratory chain capacity limits oxidative energy supply to tissues with
      high demand, chiefly the long peripheral axons, cerebellum, white matter, spinal
      cord and muscle.
    evidence:
    - reference: PMID:29718187
      reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        we identified recessive mutations in COA7, and showed that loss-of-function
        mutations in COA7 result impair MRC activities and could cause early onset,
        progressive axonal neuropathy and ataxia with or without leukoencephalopathy or
        spinal cord atrophy.
      explanation: >-
        The founding study's conclusion links impaired respiratory chain activity to the
        neurological disease; the tissue energy-failure step is inferred.
- name: Glycolytic Shift With Increased Lactate Production
  conforms_to: complex_iv_assembly_deficiency#Lactic Acidosis and Metabolic Decompensation
  description: >-
    Lactate and pyruvate are mildly elevated in blood or CSF in several patients. Overt
    lactic acidosis or metabolic decompensation has not been described; the lactate

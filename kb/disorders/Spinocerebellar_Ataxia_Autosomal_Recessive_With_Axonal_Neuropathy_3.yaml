- name: Peripheral Nerve Bioenergetic Insult
  conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
  description: >-
    Peripheral motor and sensory neurons with long axons, and the Schwann cells that
    ensheathe them, are the initiating site of the neuropathy. COA7 is expressed in the
    cytoplasm of Schwann cells in human sural nerve, and neuron-specific knockdown of the
    fly orthologue impairs motor neuron terminals and locomotion, supporting a
    requirement in neurons. Oxidative stress, which the module records at this node, has
    not been examined in COA7 disease.

    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all four patients, nerve conduction studies showed axonal sensorimotor
      neuropathy with mild decrease in motor conduction velocity (49.6 to 51.5 m/s) in

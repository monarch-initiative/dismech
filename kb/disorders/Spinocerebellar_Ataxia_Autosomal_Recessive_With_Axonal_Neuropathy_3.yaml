    modifier: DECREASED
  evidence:
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      With regard to Patients 2 and 3, MRC enzyme assay revealed a significant decrease
      in complex IV activity (24% and 9% of control, respectively)
    explanation: Complex IV activity in patient fibroblasts is well below control.
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical analysis of the mitochondrial respiratory chain revealed the presence

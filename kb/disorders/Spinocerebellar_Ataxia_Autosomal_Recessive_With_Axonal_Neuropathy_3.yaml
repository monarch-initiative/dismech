notes: >-
  No GeneReviews chapter names this disease (just check-genereviews, Bookshelf index
  snapshot 2026-09-10 plus live PubMed title search, returned NO_CHAPTER), so the
  primary case reports are the clinical baseline. The subcellular location of COA7 was
  first reported as the mitochondrial matrix (PMID:27683825); later import and
  structural studies place it in the intermembrane space (PMID:24333015,
  PMID:30885959, PMID:35210360), which is the location used here.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic COA7 variants, homozygous (including in a child of
    consanguineous parents) or compound heterozygous, and variants segregate with
    disease in the reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Validated mutations were located at highly conserved residues among different
      species and segregated with the disease in each family.
    explanation: Segregation of biallelic COA7 variants with disease in four families.
  - reference: PMID:42182620
    reference_title: Compound Heterozygous COA7 Variants Presenting With Childhood-Onset Axonal Neuropathy in 2 Siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Biallelic pathogenic variants in COA7 have been reported to date, consistent with
      recessive inheritance.
    explanation: Summarizes the recessive inheritance pattern across reported patients.
  - reference: PMID:35603692
    reference_title: A novel compound heterozygous mutation in the COA7 gene responsible for a Chinese patient with spinocerebellar ataxia with axonal neuropathy type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spinocerebellar ataxia with axonal neuropathy type 3 (SCAN3) is a very rare
      autosomal recessive hereditary disease.
    explanation: States the autosomal recessive mode of inheritance of SCAN3.
prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disease is known only from case
    reports and small series; four of 1396 Japanese patients screened for inherited
    peripheral neuropathy carried biallelic COA7 variants in the founding study, and
    the 2022 Chinese report counted five previously documented patients. Later reports
    have added a few more Japanese and Italian patients.
  evidence:
  - reference: PMID:35603692
    reference_title: A novel compound heterozygous mutation in the COA7 gene responsible for a Chinese patient with spinocerebellar ataxia with axonal neuropathy type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: So far, only five SCAN3 patients with COA7 mutations have been documented.
    explanation: Documents the very small number of reported patients as of 2022.
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified four unrelated patients with recessive mutations in COA7 among
      a Japanese case series of 1396 patients with Charcot-Marie-Tooth disease (CMT) or
      other inherited peripheral neuropathies, including complex forms of CMT.
    explanation: Gives the diagnostic yield in a large Japanese inherited-neuropathy series.
pathophysiology:
- name: Reduced Mitochondrial COA7 Protein
  description: >-
    Pathogenic COA7 missense and in-frame alleles produce proteins that are imported
    into the mitochondrial intermembrane space more slowly than wild type through the
    MIA (CHCHD4) disulfide-relay pathway; mutant protein left in the cytosol is degraded
    by the proteasome, so little or no COA7 accumulates in mitochondria. In fibroblasts
    from the first reported patient no COA7 protein was detectable. Truncating alleles
    are presumed to abolish the protein, but this has not been tested.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein import into mitochondrial intermembrane space
    term:
      id: GO:0045041
      label: protein import into mitochondrial intermembrane space
    modifier: DECREASED
  - preferred_term: proteasomal degradation of mislocalized COA7
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:30885959
    reference_title: Inhibition of proteasome rescues a pathogenic variant of respiratory chain assembly factor COA7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also found that pathogenic mutant versions of COA7 are imported slower than the
      wild-type protein, and mislocalized proteins are degraded in the cytosol by the
      proteasome.
    explanation: Shows slowed import and proteasomal degradation of patient COA7 variants.
  - reference: PMID:30885959
    reference_title: Inhibition of proteasome rescues a pathogenic variant of respiratory chain assembly factor COA7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that COA7 requires the mitochondrial IMS import and assembly (MIA) pathway
      for efficient accumulation in the IMS
    explanation: Identifies the import route whose inefficiency lowers mitochondrial COA7.
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No COA7 cross-reacting material was immunodetectable, and the amount of two COX
      structural subunits (MT-CO2 and MT-CO3) was reduced in the mutant sample, relative
      to control cells
    explanation: COA7 protein is absent from patient fibroblasts.
  downstream:
  - target: Loss of COA7 Disulfide Reductase Activity
    causal_link_type: DIRECT
    description: >-
      With little COA7 in the intermembrane space, its heme-binding disulfide reductase
      activity toward the copper chaperones is lost.
- name: Loss of COA7 Disulfide Reductase Activity
  description: >-
    COA7 is a heme-binding protein built from five helix-turn-helix (Sel1-like) repeats
    that interacts transiently with the copper metallochaperones SCO1 and SCO2 and
    reduces disulfide bonds in them, which is proposed to regenerate the copper relay
    that delivers copper to COX2. Loss of COA7 removes this activity. The step is shown
    biochemically and in COA7 knockout cells; that patient variants act through it is
    inferred.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COA7
    term:
      id: hgnc:25716
      label: COA7
    modifier: DECREASED
  molecular_functions:
  - preferred_term: protein-disulfide reductase activity
    term:
      id: GO:0015035
      label: protein-disulfide reductase activity
    modifier: DECREASED
  - preferred_term: heme binding
    term:
      id: GO:0020037
      label: heme binding
    modifier: DECREASED
  evidence:
  - reference: PMID:35210360
    reference_title: "Mitochondrial COA7 is a heme-binding protein with disulfide reductase activity, which acts in the early stages of complex IV assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      COA7 interacts transiently with the copper metallochaperones SCO1 and SCO2 and
      catalyzes the reduction of disulfide bonds within these proteins, which are crucial
      for copper relay to COX2.
    explanation: Defines the disulfide reductase activity toward SCO1 and SCO2 that is lost.
  - reference: PMID:35210360
    reference_title: "Mitochondrial COA7 is a heme-binding protein with disulfide reductase activity, which acts in the early stages of complex IV assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      COA7 binds heme with micromolar affinity, through axial ligation to the central
      iron atom by histidine and methionine residues.
    explanation: Establishes heme binding as part of COA7 function.
  downstream:
  - target: Complex IV Assembly Stall After COX1 Module Formation
    causal_link_type: DIRECT
    description: >-
      Without COA7, complex IV assembly stops after the COX1 module forms, at the step
      that needs copper incorporation and addition of the COX2 and COX3 modules.
    evidence:
    - reference: PMID:35210360
      reference_title: "Mitochondrial COA7 is a heme-binding protein with disulfide reductase activity, which acts in the early stages of complex IV assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show that loss of COA7 blocks complex IV assembly after the initial step
        where the COX1 module is built, progression from which requires the incorporation
        of copper and addition of the COX2 and COX3 modules.
      explanation: COA7 knockout cells show the assembly block that follows loss of COA7.
    - reference: PMID:35210360
      reference_title: "Mitochondrial COA7 is a heme-binding protein with disulfide reductase activity, which acts in the early stages of complex IV assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We therefore propose that COA7 is a heme-binding disulfide reductase for
        regenerating the copper relay system that underpins complex IV assembly.
      explanation: Proposes the link between the reductase activity and complex IV assembly.
- name: Complex IV Assembly Stall After COX1 Module Formation
  conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
  description: >-
    Cytochrome c oxidase cannot progress past the COX1 module, so the mtDNA-encoded
    subunits MT-CO2 and MT-CO3 and the fully assembled holoenzyme and the complex
    III2-IV supercomplex are reduced in patient cells. Re-expression of wild-type COA7
    restores normal complex IV amount, and COA7 knockdown or knockout in human cell lines
    reproduces the assembly defect. COA7 is the substituted early assembly factor in this
    instance of the complex IV biogenesis failure module.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:29718187
    reference_title: Mutations in COA7 cause spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BN-PAGE immunoblotting and densitometry analysis indicated dramatically reduced
      levels of fully assembled complex IV of Patients 2 and 3 (3.8% and 9.9% remained,
      respectively).
    explanation: Patient fibroblasts have very little fully assembled complex IV.
  - reference: PMID:27683825
    reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In patient-derived immortalised fibroblasts, the levels of fully assembled cIV and
      of the cIII2+cIV supercomplex were clearly lower relative to controls
    explanation: Reduced assembled complex IV and supercomplex in patient fibroblasts.
  - reference: PMID:24333015
    reference_title: C1orf163/RESA1 is a novel mitochondrial intermembrane space protein connected to respiratory chain assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The activity of complexes I and IV is reduced in C1orf163-depleted cells, and we
      observe the strongest defects in the assembly of complex IV.
    explanation: COA7 (C1orf163) knockdown in human cells chiefly impairs complex IV assembly.
  downstream:
  - target: Deficient Cytochrome c Oxidase Electron Transfer and Respiration
    causal_link_type: DIRECT
    description: Too little assembled holoenzyme leaves too little complex IV activity.
    evidence:
    - reference: PMID:27683825
      reference_title: COA7 (C1orf163/RESA1) mutations associated with mitochondrial leukoencephalopathy and cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lentiviral-mediated expression of recombinant wild-type COA7 cDNA in the patient
        fibroblasts led to the recovery of the defect in COX activity and restoration of
        normal COX amount.
      explanation: >-
        Restoring COA7 restores both complex IV amount and activity together, tying the
        activity deficit to the assembly defect.
- name: Deficient Cytochrome c Oxidase Electron Transfer and Respiration
  conforms_to: complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis
  description: >-
    Complex IV activity is reduced in patient fibroblasts, skeletal muscle and skin, and
    mitochondrial respiration falls. One patient's fibroblasts instead showed a decrease
    in complex I activity with only a slight reduction in assembled complex IV, and one
    Chinese patient had normal fibroblast respiratory chain activities despite
    mitochondrial abnormalities in muscle, so fibroblast testing can miss the defect.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775

- name: Length-Dependent Sensorimotor Nerve Fiber Dysfunction
  conforms_to: peripheral_axonal_degeneration#Length-Dependent Nerve Fiber Dysfunction
  description: >-
    Nerve conduction shows absent or severely reduced motor and sensory action potentials
    in the lower limbs with near-normal median motor conduction velocity, the
    electrophysiological signature of a length-dependent axonal neuropathy. Clinically
    this gives distal weakness and wasting, distal sensory loss, reduced or absent
    reflexes, foot deformity, steppage gait and a sensory component to the ataxia.

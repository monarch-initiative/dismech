notes: >-
  BAG5 (hgnc:941) is distinct from BAG3, an autosomal dominant DCM gene; no
  BAG3 evidence is used here. Two primary reports could not be quoted because
  their text was unavailable to the reference fetcher: Inoue et al. 2023
  (PMID:37873655, compound heterozygous BAG5 variants) and Hakui et al. 2022
  (PMID:36130910, refractory ventricular arrhythmias); their content enters
  only through the summary in PMID:38796549. The ClinGen BAG5 assertion
  (Moderate, AR) is for MONDO:0005021 and is therefore not recorded in
  gene_disease_validity. GeneReviews check (just check-genereviews --online,
  2026-10-08) found no BAG5- or CMD2F-specific GeneReviews or StatPearls
  chapter; the general Dilated Cardiomyopathy Overview (NBK1309) is used
  only for family-assessment guidance. Supportive treatments are extrapolated
  from general heart-failure guidance.

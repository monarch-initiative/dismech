phenotypes:
- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: >-
    Present in all reported biallelic patients (five in the founding report,
    three genotyped siblings in the Middle Eastern family). Onset is in
    adolescence or young adulthood; the Middle Eastern probands were 15 and
    17 years old at evaluation. These are ascertained cases and do not
    establish a population frequency.

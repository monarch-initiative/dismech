genetic:
- name: BAG5
  gene_term:
    preferred_term: BAG5
    term:
      id: hgnc:941
      label: BAG5
  variant_origin: GERMLINE
  association: >-
    Autosomal recessive DCM gene supported by about seven families: four
    Japanese families (five homozygous patients) in the founding report, two
    unrelated compound-heterozygous Japanese patients known here only from a
    secondhand summary, and one consanguineous Middle Eastern family with
    three affected genotyped siblings. Two recurrent nonsense alleles
    (p.Arg197Ter, p.Arg390Ter) appear in several Japanese families.
  notes: >-
    ClinGen classifies BAG5 for the broader term dilated cardiomyopathy
    (MONDO:0005021), autosomal recessive, Moderate (2024-06-14). Because that
    record is not for MONDO:0030680 or an exact-match term,
    gene_disease_validity is left empty. relationship_type is left unset
    because the schema defines CAUSATIVE as ClinGen Definitive or Strong, and
    ClinGen rates BAG5 Moderate (AR) under the parent term. The 2026 ClinGen DCM panel
    reassessment lists BAG5 among newly assessed high-evidence genes, a
    category that includes Moderate. Heterozygous truncating BAG5 variants
    were also reported in three patients with tachycardia-induced
    cardiomyopathy; that is a separate, unconfirmed susceptibility claim and
    not part of CMD2F.
  evidence:
  - reference: PMID:35044787
    reference_title: Loss-of-function mutations in the co-chaperone protein BAG5 cause dilated cardiomyopathy requiring heart transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: we identified that homozygous truncating mutations in the gene encoding Bcl-2–associated athanogene (BAG) co-chaperone 5 (BAG5) caused inherited DCM in five patients among four unrelated families with complete penetrance.
    explanation: Founding gene-disease report.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Exome and Sanger sequencing identified a novel BAG5 variant, c.444_445delGA (p.Lys149AsnfsTer6), homozygous in affected siblings and heterozygous in parents and unaffected siblings.
    explanation: Independent replication with a different truncating allele.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Subsequently, Inoue et al. reported two unrelated cases of DCM caused by compound heterozygous truncating variants in BAG5.
    explanation: Secondhand account of a further report.
  - reference: CGGV:assertion_97fe83b7-fe12-4014-9706-6847446fa9bd-2024-06-14T160000.000Z

name: Cardiomyopathy Dilated 2F
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cardiomyopathy, dilated, 2F
  term:
    id: MONDO:0030680
    label: cardiomyopathy, dilated, 2F
synonyms:
- CMD2F
- cardiomyopathy, dilated, 2F
- BAG5-related dilated cardiomyopathy
- BAG5-associated dilated cardiomyopathy
description: >-
  Cardiomyopathy, dilated, 2F (CMD2F) is an autosomal recessive dilated
  cardiomyopathy caused by biallelic truncating variants in BAG5, which
  encodes a five-BAG-domain co-chaperone that acts as a nucleotide exchange
  factor for HSC70/Hsp70. Affected individuals present in adolescence or
  young adulthood with left ventricular dilatation, reduced ejection fraction,
  advanced heart failure and ventricular arrhythmias that can be refractory.
  The clinical evidence base is small: five patients from four Japanese
  families in the founding report, two further compound-heterozygous patients
  known here only through a later summary, and three affected siblings from
  one consanguineous Middle Eastern family. Two mechanisms have been proposed,
  both from stress-provoked mouse models: disruption of junctional membrane
  complexes with abnormal calcium handling under catecholamine stimulation,
  and an impaired endoplasmic reticulum stress response with excess
  cardiomyocyte apoptosis. Wild-type BAG5 delivered by AAV9 rescued one mouse
  model; this is not a human treatment. BAG5 is distinct from BAG3, a separate
  autosomal dominant dilated cardiomyopathy gene.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder

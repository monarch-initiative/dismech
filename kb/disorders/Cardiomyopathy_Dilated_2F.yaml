  notes: >-
    About ten genotyped patients from about seven families have been published
    (five homozygous patients from four Japanese families, two
    compound-heterozygous Japanese patients known secondhand, and three
    homozygous siblings from one Middle Eastern family), plus one deceased
    ungenotyped sibling. A case report of refractory arrhythmia (2022) may
    overlap the founding cohort. GenCC counts about 12 cases; the difference
    from the 10 genotyped patients counted here may reflect the 2022 case
    report or heterozygous carriers. This is a publication count, not a
    population prevalence.

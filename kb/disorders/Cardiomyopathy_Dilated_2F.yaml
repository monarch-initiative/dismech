inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic truncating BAG5 variants (homozygous, or compound heterozygous
    in a later report) segregate with disease. The founding report describes
    complete penetrance in five biallelic patients; this is a small-sample
    observation, not a population penetrance estimate. Heterozygous parents
    were clinically unaffected, although minor ECG changes were noted in two
    of three female carriers in one family.
  evidence:
  - reference: PMID:35044787
    reference_title: Loss-of-function mutations in the co-chaperone protein BAG5 cause dilated cardiomyopathy requiring heart transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: we identified that homozygous truncating mutations in the gene encoding Bcl-2–associated athanogene (BAG) co-chaperone 5 (BAG5) caused inherited DCM in five patients among four unrelated families with complete penetrance.
    explanation: Homozygous truncating variants in four unrelated families support recessive inheritance.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Exome and Sanger sequencing identified a novel BAG5 variant, c.444_445delGA (p.Lys149AsnfsTer6), homozygous in affected siblings and heterozygous in parents and unaffected siblings.
    explanation: Segregation in an independent consanguineous family is consistent with recessive inheritance.
  - reference: CGGV:assertion_97fe83b7-fe12-4014-9706-6847446fa9bd-2024-06-14T160000.000Z
    reference_title: BAG5 / dilated cardiomyopathy (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: BAG5 | HGNC:941 | dilated cardiomyopathy | MONDO:0005021 | AR | Moderate
    explanation: ClinGen records an autosomal recessive mode for BAG5; the record is for the parent dilated cardiomyopathy term, not CMD2F itself.
pathophysiology:
- name: Biallelic BAG5 Truncating Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  description: >-
    Reported pathogenic alleles are nonsense or frameshift variants
    (p.Arg197Ter, p.Arg390Ter and p.His7ThrfsTer5 in Japanese families;
    p.Lys149AsnfsTer6 in a Middle Eastern family), carried homozygously or in
    compound heterozygosity. The gene-disease link rests on about seven
    families, so the trigger is graded provisional rather than established.
  genes:
  - preferred_term: BAG5
    term:
      id: hgnc:941
      label: BAG5
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: nonsense and frameshift
    description: >-
      Most reported patients are homozygous; two Japanese patients are
      reported, secondhand, as compound heterozygous for p.Arg197Ter and
      p.Arg390Ter. Loss of function is inferred from the truncating allele
      class, absent Bag5 protein in a knock-in mouse, and reduced BAG5
      immunostaining in patient myocardium.
  evidence:
  - reference: PMID:35044787
    reference_title: Loss-of-function mutations in the co-chaperone protein BAG5 cause dilated cardiomyopathy requiring heart transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: we identified that homozygous truncating mutations in the gene encoding Bcl-2–associated athanogene (BAG) co-chaperone 5 (BAG5) caused inherited DCM in five patients among four unrelated families with complete penetrance.
    explanation: The founding gene-disease report.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Exome and Sanger sequencing identified a novel BAG5 variant, c.444_445delGA (p.Lys149AsnfsTer6), homozygous in affected siblings and heterozygous in parents and unaffected siblings.
    explanation: An independent family with a different truncating allele.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Subsequently, Inoue et al. reported two unrelated cases of DCM caused by compound heterozygous truncating variants in BAG5.
    explanation: Secondhand summary of the 2023 compound-heterozygous report, whose own text could not be retrieved.
  downstream:
  - target: Loss of BAG5 Protein
    causal_link_type: DIRECT
    description: Truncating alleles are expected to abolish or markedly reduce BAG5 protein.
    evidence:
    - reference: PMID:38796549
      reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Western blot analysis revealed that the expression of Bag5 protein in cardiac tissue was completely absent in Bag5−/− mice and decreased in Bag5+/− mice, when compared to that in Bag5+/+ mice
      explanation: The mouse equivalent of p.Lys149AsnfsTer6 abolishes cardiac Bag5 protein when homozygous.
    - reference: PMID:38796549
      reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: BACKGROUND
      snippet: Immunohistochemical analysis of heart tissue from these patients revealed a significant reduction in BAG5 and SERCA2 protein expression.
      explanation: Reduced BAG5 in compound-heterozygous patient myocardium, as summarized by a later paper.
- name: Loss of BAG5 Protein
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    BAG5 is a co-chaperone with five BAG domains. Its fifth BAG domain binds
    the Hsp70 nucleotide-binding domain and promotes ADP release. Absence of
    BAG5 protein is shown in the knock-in mouse heart and reduced BAG5 is
    reported in patient myocardium.
  genes:
  - preferred_term: BAG5
    term:
      id: hgnc:941
      label: BAG5
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Western blot analysis revealed that the expression of Bag5 protein in cardiac tissue was completely absent in Bag5−/− mice and decreased in Bag5+/− mice, when compared to that in Bag5+/+ mice
    explanation: Protein loss measured in mouse heart.
  downstream:
  - target: Impaired HSC70 Nucleotide Exchange and Protein Refolding
    causal_link_type: DIRECT
    description: Without BAG5, its nucleotide-exchange activity on HSC70/Hsp70 is lost. The biochemistry is in vitro; that this deficit operates in patient cardiomyocytes is inferred.
    evidence:
    - reference: PMID:20223214
      reference_title: The C-terminal BAG domain of BAG5 induces conformational changes of the Hsp70 nucleotide-binding domain for ADP-ATP exchange.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: Therefore, BAG5 can function as the nucleotide exchange factor of Hsp70 for the enhancement of protein refolding.
      explanation: Structural and refolding assays establish the normal activity whose loss is inferred.
  - target: Impaired Cardiomyocyte ER Stress Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: In cultured rat cardiomyocytes Bag5 rises in the ER during ER stress and stabilizes GRP78; loss of this buffer is proposed to leave cardiomyocytes vulnerable to ER stress.
    evidence:
    - reference: PMID:26729625
      reference_title: GRP78 Interacting Partner Bag5 Responds to ER Stress and Protects Cardiomyocytes From ER Stress-Induced Apoptosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: Mechanistically, we found that Bag5 protein expression is significantly increased in the ER during ER stress and that this in turn modulates GRP78 protein stability and reduces ER stress.
      explanation: Neonatal rat cardiomyocyte data on normal Bag5 function; not a disease-allele experiment.

discussions:
- discussion_id: cmd2f_small_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How representative is the reported CMD2F phenotype, given that it rests on about seven families, two of them known here only secondhand?
  attaches_to:
  - genetic#BAG5
  rationale: >-
    Five founding patients, two compound-heterozygous patients summarized by
    a later paper, and three genotyped siblings in one consanguineous family
    make up the clinical record. The case report of refractory arrhythmia and
    the compound-heterozygous report could not be retrieved, and patient
    counts may overlap. Phenotype frequencies, penetrance and prognosis
    cannot be estimated from these data.
  evidence:
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Notably, all individuals carrying homozygous or compound heterozygous BAG5 variants developed DCM, highlighting a strong genotype–phenotype correlation.
    explanation: The penetrance claim rests on a handful of patients.
- discussion_id: cmd2f_stress_dependent_mouse_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Patients develop DCM without a known trigger, but both knock-in mice need an exogenous stressor; which mechanism, if either, operates in human myocardium?
  attaches_to:
  - pathophysiology#Junctional Membrane Complex Disruption
  - pathophysiology#Impaired Cardiomyocyte ER Stress Response
  - pathophysiology#Cardiomyocyte Apoptosis
  rationale: >-
    One mouse needs catecholamine stimulation and the other tunicamycin to
    show cardiac dysfunction; the unstressed p.Lys149fs-equivalent mouse is
    normal to 12 months. The ER-stress study found no genotype difference in
    CHOP or GRP78 and used one heart per group for apoptosis. Arrhythmia
    appeared only in male mice, whereas ECG changes among human carriers
    appeared only in females. Patient-derived cardiomyocytes or explanted
    myocardium would be needed to tell the branches apart.
  evidence:
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Bag5-/- mice displayed no abnormalities up to 12 months old and showed no anomalies during an exercise stress test.
    explanation: The unstressed model lacks the human phenotype.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Interestingly, only Bag5 KI male mice demonstrated arrhythmia, which was more pronounced in Bag5-/- than in Bag5+/-males.
    explanation: Sex pattern opposite to that seen in human carriers.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: These findings suggest that BAG5 might potentially exert a protective role in mitigating ER stress-induced cardiomyocyte apoptosis through alternative pathways, possibly involving ATF6 or XBP1, warranting further exploration.
    explanation: The ER-stress effector pathway is unresolved.
  proposed_experiments:
  - experiment_id: exp_cmd2f_ipsc_cardiomyocytes
    name: Compare JMC integrity, calcium transients and ER-stress apoptosis in BAG5-null iPSC cardiomyocytes
    description: >-
      Derive iPSC cardiomyocytes from a biallelic BAG5 patient with isogenic
      corrected controls. Measure junctional membrane complex protein
      abundance and calcium transients with and without isoproterenol, and
      apoptosis and UPR branch activation (ATF6, XBP1 splicing) with and
      without tunicamycin, to test which branch is present without in vivo
      stress.
- discussion_id: cmd2f_heterozygous_carriers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do heterozygous BAG5 truncating variants carry any cardiac risk?
  attaches_to:
  - genetic#BAG5
  rationale: >-
    Heterozygous truncations were reported in three patients with
    tachycardia-induced cardiomyopathy, and two of three female heterozygous
    relatives in one family had borderline ECG changes. Both observations are
    small and unconfirmed, and they are not part of the recessive CMD2F
    phenotype.
  evidence:
  - reference: PMID:35044787
    reference_title: Loss-of-function mutations in the co-chaperone protein BAG5 cause dilated cardiomyopathy requiring heart transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: We also identified heterozygous truncating mutations in three patients with tachycardia-induced cardiomyopathy, a reversible DCM subtype associated with abnormal calcium homeostasis.
    explanation: Possible heterozygous susceptibility in a different phenotype.
  - reference: PMID:38796549
    reference_title: A novel BAG5 variant impairs the ER stress response pathway, causing dilated cardiomyopathy and arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: suggesting a potential predisposition to arrhythmia in female carriers of the BAG5 variant.
    explanation: Based on two female carriers with borderline ECG changes.

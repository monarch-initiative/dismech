name: Cleft Palate With Or Without Ankyloglossia, X-linked
creation_date: "2026-10-31T08:57:34Z"
category: Mendelian
synonyms:
- X-linked cleft palate and ankyloglossia
- X-linked cleft palate
- cleft palate with ankyloglossia
- CPX
description: >-
  An X-linked semidominant orofacial cleft disorder caused by loss of function
  of the T-box transcription factor gene TBX22 at Xq21.1. Affected males show a
  spectrum running from an occult or overt submucous cleft palate and bifid or
  absent uvula to a complete cleft of the secondary palate, very often with
  ankyloglossia (tongue-tie). About a third of carrier females are affected,
  frequently with ankyloglossia alone. Hypodontia, cleft lip and choanal
  atresia are less common parts of the spectrum. TBX22 coding variants also
  account for a few percent of apparently non-syndromic cleft palate. In the
  mouse, Tbx22 loss delays osteoblast maturation in the posterior hard palate,
  which reduces palatal bone formation and produces the submucous cleft.
disease_term:
  preferred_term: cleft palate with or without ankyloglossia, X-linked
  term:
    id: MONDO:0010560
    label: cleft palate with or without ankyloglossia, X-linked
notes: >-
  OMIM 303400 and Orphanet 324601. ClinGen (Craniofacial Malformations GCEP,
  2024) lumps Abruzzo-Erickson syndrome (OMIM 302905, MONDO:0010554) into this
  disease entity, judging that the two do not differ in molecular mechanism,
  inheritance or phenotypic variability. It is therefore recorded here as a
  subtype rather than as a separate entry; a 2026 case series instead proposes
  gain of function for the Abruzzo-Erickson alleles, which is recorded as an
  open question under discussions. No GeneReviews chapter covers this disease
  or TBX22 (offline Bookshelf index checked with just check-genereviews).
  Clinodactyly, syndactyly and dental crossbite appear in the MONDO/Orphanet
  definition but were not found in a citable primary source and are not
  curated as phenotypes.

inheritance:
- name: X-linked semidominant
  inheritance_term:
    preferred_term: X-linked semidominant inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Hemizygous males are affected and roughly one third of heterozygous carrier
    females show a phenotype, most often ankyloglossia without a cleft.
    Expression varies widely within and between families, from ankyloglossia
    alone to a complete cleft of the hard and soft palate.
  evidence:
  - reference: PMID:11559848
    reference_title: "The T-box transcription factor gene TBX22 is mutated in X-linked cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cleft palate with ankyloglossia (CPX; MIM 303400) is inherited as a semidominant X-linked disorder previously described in several large families of different ethnic origins"
    explanation: States the semidominant X-linked inheritance of CPX across several large families.
  - reference: PMID:19648291
    reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CPX is an X-linked semi-dominant craniofacial disorder affecting male patients and approximately one-third of female carriers (7). Ankyloglossia without a CP is seen in many carrier females and occasionally in males, indicating a partial penetrance"
    explanation: The introduction of the mouse paper summarises the human pedigrees, giving the carrier-female fraction and partial penetrance.
  - reference: PMID:1570839
    reference_title: "The gene responsible for X-linked cleft palate (CPX) in a British Columbia native kindred is localized between PGK1 and DXYS1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA marker linkage studies have been performed in a large British Columbia (B.C.) Native family in which cleft palate segregates as an X-linked trait."
    explanation: Pre-gene linkage study documenting X-linked segregation in a large kindred.

has_subtypes:
- name: Classic CPX
  display_name: Classic X-linked cleft palate with or without ankyloglossia
  description: >-
    The common presentation: complete, partial or submucous cleft of the
    secondary palate, bifid or absent uvula, and ankyloglossia, in any
    combination, without extracranial malformations.
  genes:
  - preferred_term: TBX22
    term:
      id: hgnc:11600
      label: TBX22
  evidence:
  - reference: PMID:22784330
    reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked cleft palate (CPX) is caused by mutations in the gene encoding the TBX22 transcription factor and is known to exhibit phenotypic variability, usually involving either a complete, partial or submucous cleft palate, with or without ankyloglossia."
    explanation: Defines the classic CPX phenotype range.
- name: Abruzzo-Erickson Syndrome
  display_name: Abruzzo-Erickson syndrome (CHARGE-like)
  description: >-
    A CHARGE-like presentation in which cleft palate is accompanied by
    coloboma, hypospadias, deafness, short stature and radial synostosis. A
    TBX22 splice acceptor variant (c.593-5T>A) segregates with it in the
    original family, and a second family carries a different TBX22 variant.
    ClinGen lumps it with classic CPX; whether its alleles act differently from
    classic loss-of-function alleles is unresolved.
  subtype_term:
    preferred_term: Abruzzo-Erickson syndrome
    term:
      id: MONDO:0010554
      label: Abruzzo-Erickson syndrome
  genes:
  - preferred_term: TBX22
    term:
      id: hgnc:11600
      label: TBX22
  evidence:
  - reference: PMID:22784330
    reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel TBX22 splice acceptor mutation (c.593-5T>A) was identified that tracked with the phenotype in this family."
    explanation: Identifies the TBX22 variant segregating with Abruzzo-Erickson syndrome.
  - reference: "CGGV:assertion_c7700e51-c293-487b-a06a-1392fb1b6209-2024-09-19T160000.000Z"
    reference_title: "TBX22 / cleft palate with or without ankyloglossia, X-linked (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the following disease entities have been lumped into one disease entity, Abruzzo-Erikson syndrome (OMIM:302905) and cleft palate with ankyloglossia (OMIM:303400)"
    explanation: ClinGen's lumping decision, which is why Abruzzo-Erickson syndrome is a subtype of this entry.

pathophysiology:
- name: TBX22 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift, splice-site, missense and promoter variants abolish or
    reduce TBX22 function. TBX22 is a sequence-specific transcriptional
    repressor; pathogenic missense variants cluster in the DNA-binding T-box
    domain, weaken DNA binding and impair repression, and all of them lose
    SUMO-1 conjugation at lysine 63, which the repressor activity requires.
    Promoter variants that lower transcription of an otherwise normal gene
    produce the same phenotype.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TBX22
    term:
      id: hgnc:11600
      label: TBX22
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity
    modifier: DECREASED
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  biological_processes:
  - preferred_term: TBX22 sumoylation
    modifier: DECREASED
    term:
      id: GO:0016925
      label: protein sumoylation
  evidence:
  - reference: PMID:11559848
    reference_title: "The T-box transcription factor gene TBX22 is mutated in X-linked cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of nonsense, splice-site, frameshift and missense mutations we have identified in this study indicates that the cleft phenotype results from a complete loss of TBX22 function."
    explanation: The allelic spectrum in CPX families indicates complete loss of TBX22 function as the disease mechanism.
  - reference: PMID:17846996
    reference_title: "TBX22 missense mutations found in patients with X-linked cleft palate affect DNA binding, sumoylation, and transcriptional repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that TBX22 functions as a transcriptional repressor and that TBX22 missense mutations result in impaired repression activity."
    explanation: Cell-based assays show TBX22 is a repressor and that patient missense alleles impair repression.
  - reference: PMID:17846996
    reference_title: "TBX22 missense mutations found in patients with X-linked cleft palate affect DNA binding, sumoylation, and transcriptional repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the site of SUMO attachment at the lysine at position 63 is upstream of the T-box domain, loss of SUMO-1 modification is consistently found in all pathogenic CPX missense mutations."
    explanation: Loss of SUMO-1 conjugation is shared by all pathogenic missense alleles tested.
  - reference: PMID:25373698
    reference_title: "Loss-of-function mutation in the X-linked TBX22 promoter disrupts an ETS-1 binding site and leads to cleft palate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EMSA and ChIP assays demonstrated that the allele A disrupts the binding site of ETS-1, thus markedly decreases the activity of the TBX22 promoter"
    explanation: A promoter variant segregating with cleft palate reduces TBX22 promoter activity, a quantitative route to loss of function.
  downstream:
  - target: Delayed Osteoblast Maturation in the Posterior Palate
    causal_link_type: DIRECT
    description: >-
      Without TBX22, posterior palatal mesenchyme condenses but its osteoblasts
      mature at least a day late.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ossification is severely reduced after condensation of the palatal mesenchyme, resulting from a delay in the maturation of osteoblasts."
      explanation: In Tbx22-null mice, loss of the gene delays osteoblast maturation in the palate.
  - target: Abnormal Tongue Frenulum Development
    causal_link_type: DIRECT
    description: >-
      TBX22 is expressed at the tongue attachment, and its loss leaves an
      anteriorly placed caudal attachment of the tongue.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further comparative histological analysis of craniofacial structures between wild-type and Tbx22null mouse embryos revealed a more anterior caudal attachment of the tongue to the mandible"
      explanation: Loss of Tbx22 alters the tongue attachment in mouse embryos.
  - target: Persistent Oro-nasal Membrane
    causal_link_type: DIRECT
    description: >-
      Tbx22 is expressed in the nasal mesenchyme where the oro-nasal membrane
      normally ruptures; in null mice the membrane persists.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also find persistent oro-nasal membranes or, in some mice a partial rupture, resulting in choanal atresia."
      explanation: Tbx22-null mice show persistent oro-nasal membranes.

- name: Delayed Osteoblast Maturation in the Posterior Palate
  biological_scale: CELLULAR
  description: >-
    Runx2 expression is initially normal, but alkaline phosphatase activity and
    the number of differentiated osteoblasts in the posterior palatine
    osteogenic centre are reduced, indicating a Runx2-independent delay in late
    osteoblast differentiation.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  locations:
  - preferred_term: hard palate
    term:
      id: UBERON:0003216
      label: hard palate
  evidence:
  - reference: PMID:19648291
    reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results therefore indicate a role for TBX22 in Runx2-independent and late differentiation of osteoblasts in the posterior palate."
    explanation: Places the cellular defect in late osteoblast differentiation in the posterior palate.
  - reference: PMID:12374769
    reference_title: "Craniofacial expression of human and murine TBX22 correlates with the cleft palate and ankyloglossia phenotype observed in CPX patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We describe TBX22 expression in early human development, where expression is found in the palatal shelves and is highest prior to elevation to a horizontal position above the tongue."
    explanation: Human embryonic expression in the palatal shelves is consistent with a palatal role, though it does not itself show the osteoblast defect.
  downstream:
  - target: Reduced Intramembranous Ossification of the Posterior Hard Palate
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A delay of at least one embryonal day (as mirrored by the alkaline phoshatase expression) seems sufficient for a reduction in bone formation and function of the palate."
      explanation: Links the delay in osteoblast maturation to reduced palatal bone formation.

- name: Reduced Intramembranous Ossification of the Posterior Hard Palate
  biological_scale: TISSUE
  description: >-
    Bone formation in the posterior hard palate and the vomer is markedly
    reduced, leaving the midline notch of the posterior hard palate that defines
    a submucous cleft. TBX22 acts as a determinant of intramembranous palatal
    bone formation rather than of palatal shelf closure; overt clefts occur in a
    minority of null mice.
  biological_processes:
  - preferred_term: intramembranous ossification
    modifier: DECREASED
    term:
      id: GO:0001957
      label: intramembranous ossification
  locations:
  - preferred_term: hard palate
    term:
      id: UBERON:0003216
      label: hard palate
  - preferred_term: vomer
    term:
      id: UBERON:0002396
      label: vomer
  evidence:
  - reference: PMID:19648291
    reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rather than having a major role in palatal shelf closure, we show that Tbx22 is an important determinant for intramembranous bone formation in the posterior hard palate, which underpins normal palate development and function."
    explanation: Identifies reduced intramembranous ossification of the posterior hard palate as the tissue-level lesion.
  downstream:
  - target: Submucous cleft palate
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Analysis of the craniofacial skeleton demonstrates a marked reduction in bone formation in the posterior hard palate, resulting in the classic notch associated with SMCP."
      explanation: The reduced posterior palatal bone produces the notch of a submucous cleft palate.
  - target: Cleft palate
    causal_link_type: DIRECT
    description: >-
      Only a small minority of Tbx22-null mice show an overt cleft, so this edge
      is weaker than the one to submucous cleft palate.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tbx22null mice show multiple craniofacial defects that include submucous or overt CP, choanal atresia, reduced vomer and ankyloglossia"
      explanation: Overt cleft palate occurs within the Tbx22-null phenotype alongside the submucous cleft.

- name: Abnormal Tongue Frenulum Development
  biological_scale: TISSUE
  description: >-
    TBX22 is expressed in the mesenchyme at the base of the tongue in the region
    of the frenulum in human and mouse embryos. Loss of Tbx22 gives a short,
    anteriorly attached frenulum, the anatomical basis of ankyloglossia.
  biological_processes:
  - preferred_term: tongue development
    modifier: ABNORMAL
    term:
      id: GO:0043586
      label: tongue development
  locations:
  - preferred_term: lingual frenulum
    term:
      id: UBERON:0006689
      label: frenulum of tongue
  evidence:
  - reference: PMID:12666195
    reference_title: "Expression of mouse Tbx22 supports its role in palatogenesis and glossogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The localization in the tongue frenulum perfectly correlates with the ankyloglossia phenotype in CPX."
    explanation: Mouse Tbx22 is expressed in the tongue frenulum, matching the ankyloglossia of CPX.
  - reference: PMID:12374769
    reference_title: "Craniofacial expression of human and murine TBX22 correlates with the cleft palate and ankyloglossia phenotype observed in CPX patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mRNA is also detected in the base of the tongue in the region of the frenulum that corresponds to the ankyloglossia seen in CPX patients."
    explanation: Human embryonic expression at the frenulum corresponds to the ankyloglossia of CPX patients.
  downstream:
  - target: Ankyloglossia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is similar to the shortened frenulum, frequently seen in human CPX patients with ankyloglossia. This feature was consistent in all mutant animals studied (n = 30)"
      explanation: The altered tongue attachment in every null mouse corresponds to the shortened frenulum of ankyloglossia.

- name: Persistent Oro-nasal Membrane
  biological_scale: TISSUE
  description: >-
    The oro-nasal membrane normally ruptures to open the choanae. In Tbx22-null
    mice it persists, narrowing or blocking the posterior nasal passage, with
    expanded Pax9 expression across the membrane. Choanal atresia has since
    been reported in human TBX22 families.
  locations:
  - preferred_term: oro-nasal membrane
    term:
      id: UBERON:0009672
      label: oronasal membrane
  evidence:
  - reference: PMID:19648291
    reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, in Tbx22null embryos, a persistent oro-nasal membrane (Fig. 4B), which narrows or blocks this passage, restricts nasal breathing."
    explanation: Documents the persistent oro-nasal membrane in Tbx22-null embryos.
  downstream:
  - target: Choanal atresia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also find persistent oro-nasal membranes or, in some mice a partial rupture, resulting in choanal atresia."
      explanation: The persistent membrane results in choanal atresia in the mouse model.

phenotypes:
- category: Craniofacial
  name: Submucous cleft palate
  description: >-
    Occult or overt submucous cleft of the palate, with a notch in the posterior
    hard palate, often with a bifid or absent uvula. It is one of the most
    characteristic presentations in CPX families.
  phenotype_term:
    preferred_term: Submucous cleft palate
    term:
      id: HP:5201016
      label: Submucous cleft palate
  evidence:
  - reference: PMID:19648124
    reference_title: "A functional haplotype variant in the TBX22 promoter is associated with cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical variability in CPX ranges from a mild or occult submucous cleft palate to a severe, complete cleft of the secondary palate."
    explanation: Submucous cleft palate is the mild end of the CPX clefting spectrum.
  - reference: PMID:1570839
    reference_title: "The gene responsible for X-linked cleft palate (CPX) in a British Columbia native kindred is localized between PGK1 and DXYS1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A previous clinical description of the clefting defect in this kindred included submucous cleft palate and bifid or absent uvula."
    explanation: Submucous cleft palate in an affected CPX kindred.
  sequelae:
  - target: Velopharyngeal insufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25368910
      reference_title: "Submucous cleft palate: a systematic review of surgical management based on perceptual and instrumental analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Submucous cleft palate (SMCP) is a congenital condition associated with abnormal development of the soft palate musculature. In a proportion of cases, this results in velopharyngeal insufficiency (VPI)"
      explanation: Submucous cleft palate of any cause leads to velopharyngeal insufficiency in a proportion of cases; not specific to TBX22.

- category: Craniofacial
  name: Cleft palate
  description: >-

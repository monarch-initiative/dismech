    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our recent reevaluation of the family has indicated that ankyloglossia (tongue-tie) is also a feature of X-linked cleft palate in some of the affected males and carrier females."
    explanation: Ankyloglossia in affected males and carrier females of a CPX kindred.
  - reference: PMID:21248356
    reference_title: "Cleft lip with cleft palate, ankyloglossia, and hypodontia are associated with TBX22 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations R120Q and P389Q were identified in patients with ankyloglossia only"
    explanation: TBX22 variants found in patients with ankyloglossia and no cleft.

- category: Craniofacial
  name: Velopharyngeal insufficiency

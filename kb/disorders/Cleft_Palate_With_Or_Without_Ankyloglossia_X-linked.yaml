genetic:
- name: TBX22
  gene_term:
    preferred_term: TBX22
    term:
      id: hgnc:11600
      label: TBX22
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TBX22 lies at Xq21.1 and encodes a T-box transcriptional repressor. Disease
    alleles include nonsense, frameshift, canonical and non-canonical splice,
    T-box missense and promoter variants; the mechanism is loss of function.
    In the mouse, palatal Tbx22 expression is activated by MN1 and, in the
    early face, induced by FGF8 and restricted by BMP4.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: "CGGV:assertion_c7700e51-c293-487b-a06a-1392fb1b6209-2024-09-19T160000.000Z"
    evidence:
    - reference: "CGGV:assertion_c7700e51-c293-487b-a06a-1392fb1b6209-2024-09-19T160000.000Z"
      reference_title: "TBX22 / cleft palate with or without ankyloglossia, X-linked (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TBX22 | HGNC:11600 | cleft palate with or without ankyloglossia, X-linked | MONDO:0010560 | XL | Definitive"
      explanation: ClinGen classifies the TBX22 relationship to this disease as Definitive (X-linked).
  evidence:
  - reference: PMID:11559848
    reference_title: "The T-box transcription factor gene TBX22 is mutated in X-linked cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that CPX is caused by mutations in the gene encoding the recently described T-box transcription factor TBX22 (ref. 14)."
    explanation: Original identification of TBX22 as the CPX gene.
  - reference: PMID:22784330
    reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel splice donor variant (c.767+5G>A) and a known canonical splice donor mutation (c.767+1G>A) affecting the same exon were identified in patients with classic CPX phenotypes"
    explanation: Further TBX22 splice variants in classic CPX patients.
  - reference: PMID:29932061
    reference_title: "Novel TBX22 mutations in Chinese nonsyndromic cleft lip/palate families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel and essential splicing site mutation, IVS6-1G>C , was detected in a family with cleft palate"
    explanation: A TBX22 splice variant in a Chinese cleft palate family.
  case_fractions:
  - population: Patients with non-syndromic cleft palate (pooled estimate)
    case_fraction_percent: 5.0
    notes: Around 5% of non-syndromic cleft palate, as summarised from earlier patient screens.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Further studies show that TBX22 mutations are also found in around 5% of non-syndromic cleft palate patients."
      explanation: Pooled figure for the TBX22 share of non-syndromic cleft palate.
  - population: Thai patients with non-syndromic cleft palate
    case_fraction_percent: 7.5
    cohort_size: 53
    notes: Four potentially pathogenic variants in 53 unrelated patients.
    evidence:
    - reference: PMID:17868388
      reference_title: "TBX22 mutations are a frequent cause of non-syndromic cleft palate in the Thai population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we performed mutation analysis covering all the coding regions of the TBX22 gene in 53 unrelated Thai patients with non-syndromic CP. We identified four potentially pathogenic mutations"
      explanation: Four of 53 Thai non-syndromic cleft palate patients carried TBX22 variants.
  variants:
  - name: c.358C>T (p.Arg120Trp)
    description: >-
      T-box domain missense variant segregating with CPX in a Tunisian family
      with four affected males and two affected females.
    evidence:
    - reference: PMID:15602089
      reference_title: "Mutation analysis of TBX22 reveals new mutation in Tunisian CPX family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis of TBX22 gene revealed a novel change c.358C>T in exon 3 (R120W) located in the T-BOX domain; this change was present in all affected members and none of the 100 controls."
      explanation: The variant segregates with disease and is absent from controls.
  - name: c.767+1G>A
    description: Canonical splice donor variant found in classic CPX.
    evidence:
    - reference: PMID:22784330
      reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All three variants were predicted to abolish normal mRNA splicing and an in vitro assay indicated that use of alternative splice sites was a likely outcome."
      explanation: The splice variants are predicted and shown in vitro to disrupt normal splicing.
  - name: c.-73G>A (promoter)
    description: >-
      Promoter variant at an ETS-1 binding site, co-segregating with cleft
      palate without ankyloglossia in a six-generation family.
    evidence:
    - reference: PMID:25373698
      reference_title: "Loss-of-function mutation in the X-linked TBX22 promoter disrupts an ETS-1 binding site and leads to cleft palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation was detected in all five affected male members cosegregating with the affected phenotype and heterozygote occurred only in some unaffected females of the family"
      explanation: Co-segregation of the promoter variant with cleft palate in affected males.
- name: TBX22 promoter haplotype (rs41307258)
  gene_term:
    preferred_term: TBX22
    term:
      id: hgnc:11600
      label: TBX22
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    A promoter haplotype containing the rare allele of rs41307258 lowers TBX22
    promoter activity by up to half and is associated with cleft palate, most
    strongly in patients with ankyloglossia. It is a risk factor acting with
    other genetic or environmental factors, not a Mendelian cause.
  evidence:
  - reference: PMID:19648124
    reference_title: "A functional haplotype variant in the TBX22 promoter is associated with cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the patient cohorts stratified for the presence of ankyloglossia significantly increases these associations."
    explanation: The promoter haplotype association with cleft palate strengthens in patients with ankyloglossia.
  - reference: PMID:19648124
    reference_title: "A functional haplotype variant in the TBX22 promoter is associated with cleft palate and ankyloglossia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An important functional role for rs41307258 results in a decreased promoter activity of up to 50%."
    explanation: Reporter assays show the risk allele reduces TBX22 promoter activity.
  - reference: PMID:25918826
    reference_title: "Two promoter polymorphisms in TBX22 are associated with the risk of NSCLP in Indian women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant associations of rs7055763 (P=0.034) and rs41307258 (P=0.022) with NSCLP were found only in women."
    explanation: An independent south Indian case-control study associates rs41307258 (and the linked rs7055763) with nonsyndromic cleft lip with or without cleft palate in women, extending the risk beyond cleft palate only.

diagnosis:
- name: Molecular genetic testing of TBX22
  diagnosis_term:
    preferred_term: TBX22 sequencing or exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing TBX22, or exome or genome sequencing in familial or isolated
    cleft palate, confirms the diagnosis. Families thought to be non-syndromic
    can turn out to be CPX, so examination for ankyloglossia and an X-linked
    pedigree pattern are the main clinical pointers.
  evidence:
  - reference: PMID:30462376
    reference_title: "Unmasking familial CPX by WES and identification of novel clinical signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two canonical splice-site mutations were found in TBX22."
    explanation: Exome sequencing of apparently non-syndromic cleft families identified TBX22 splice variants.
  - reference: PMID:35281813
    reference_title: "Monogenic Versus Multifactorial Inheritance in the Development of Isolated Cleft Palate: A Whole Genome Sequencing Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic or likely pathogenic variants were discovered in genes associated with CP (TBX22, COL2A1, FBN1, PCGF2, and KMT2D) in five patients"
    explanation: Genome sequencing of isolated cleft palate patients finds TBX22 among the diagnostic genes.

treatments:
- name: Cleft palate repair
  description: >-
    Surgical repair of an overt cleft, and of a submucous cleft when it causes
    velopharyngeal dysfunction; techniques include palatoplasty, pharyngeal flap
    and pharyngoplasty. No TBX22-specific surgical data were found; the evidence
    is from submucous cleft palate of any cause.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: palatoplasty
    term:
      id: NCIT:C168380
      label: Palatorrhaphy
  evidence:
  - reference: PMID:33105231
    reference_title: "Management of submucous cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Early diagnosis and surgical intervention for SMCP are associated with improved speech outcomes."
    explanation: Surgical repair of submucous cleft palate improves speech outcomes.
  - reference: PMID:25368910
    reference_title: "Submucous cleft palate: a systematic review of surgical management based on perceptual and instrumental analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The review found little evidence to support any specific surgical intervention."
    explanation: No surgical technique for submucous cleft palate has been shown superior to the others.
  target_mechanisms:
  - target: Cleft palate
  - target: Velopharyngeal insufficiency
- name: Frenotomy
  description: >-
    Division of the lingual frenulum for ankyloglossia that impairs feeding.
    Trial evidence comes from tongue-tie in general, not from CPX, and is
    limited.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lingual frenotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37839892
    reference_title: "Frenotomy with breastfeeding support versus breastfeeding support alone for infants with tongue-tie and breastfeeding difficulties: the FROSTTIE RCT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants were randomly allocated to frenotomy with standard breastfeeding support or standard breastfeeding support without frenotomy."
    explanation: Frenotomy is the procedure evaluated for tongue-tie with feeding difficulty; the trial stopped early, so efficacy remains uncertain.
  target_mechanisms:
  - target: Ankyloglossia
- name: Genetic counseling
  description: >-
    Counseling on X-linked semidominant transmission, including the risk to
    sons of carrier mothers and the variable expression in carrier daughters.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:839509
    reference_title: "A new syndrome of cleft palate associated with coloboma, hypospadias, deafness, short stature, and radial synostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The need for accurate and complete family histories in cases involving cleft palate and cleft lip/palate is discussed in relation to genetic counselling and recurrent risk estimates."
    explanation: Family history is needed for counseling and recurrence-risk estimates in familial cleft palate.

differential_diagnoses:
- name: Isolated cleft palate
  disease_term:
    preferred_term: isolated cleft palate
    term:
      id: MONDO:0007336
      label: isolated cleft palate
  description: >-
    Most cleft palate is multifactorial, and TBX22 accounts for only a few
    percent of apparently non-syndromic cases.
  distinguishing_features:
  - An X-linked pedigree with affected males and mildly affected carrier females
  - Ankyloglossia in the patient or relatives
  evidence:
  - reference: PMID:30462376
    reference_title: "Unmasking familial CPX by WES and identification of novel clinical signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study emphasizes the importance of WES analysis in familial CLP cases, combined with deep (reverse) phenotyping in \"a priori\" non-syndromic clefts."
    explanation: CPX can be mistaken for non-syndromic cleft palate until sequencing and re-phenotyping.
- name: Isolated ankyloglossia
  disease_term:
    preferred_term: ankyloglossia
    term:
      id: MONDO:0007125
      label: ankyloglossia
  description: >-
    Familial ankyloglossia, sometimes with tooth-number anomalies, can be
    autosomal dominant and unrelated to TBX22, and TBX22 coding variants are
    rare in isolated tongue-tie.
  distinguishing_features:
  - Male-to-male transmission excludes the X-linked TBX22 gene
  - No palatal cleft in the family
  evidence:
  - reference: PMID:29704302
    reference_title: "Familial autosomal dominant severe ankyloglossia with tooth abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "male-to-male transmission was in favor of an autosomal dominant inheritance, which allowed us to exclude the X-linked TBX22 gene"
    explanation: Male-to-male transmission separates autosomal dominant ankyloglossia from CPX.
  - reference: PMID:21905918
    reference_title: "TBX22 and tongue-tie."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the coding region of the TBX22 gene are not a major cause of ankyloglossia in the Finnish population"
    explanation: TBX22 coding variants are rare in isolated tongue-tie.
- name: Van der Woude syndrome
  disease_term:
    preferred_term: van der Woude syndrome
    term:
      id: MONDO:0019508
      label: van der Woude syndrome
  description: >-
    Autosomal dominant orofacial clefting (IRF6, GRHL3) that also causes cleft
    palate only in some carriers.
  distinguishing_features:
  - Lower lip pits
  - Autosomal dominant transmission
- name: CHARGE syndrome
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  description: >-
    The Abruzzo-Erickson presentation (coloboma, deafness, cleft palate,
    hypospadias) overlaps CHARGE syndrome.
  distinguishing_features:
  - CHD7 variant, usually de novo, rather than X-linked TBX22
  evidence:
  - reference: PMID:22784330
    reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study hypothesized a possible involvement of TBX22 in a family with X-linked, CHARGE-like Abruzzo-Erickson syndrome, of unknown etiology."
    explanation: Abruzzo-Erickson syndrome is described as CHARGE-like.

animal_models:
- name: Tbx22 null mouse
  species: Mouse
  genotype: Tbx22 null (deletion of exons 1-3)
  publication: PMID:19648291
  description: >-
    Hemizygous males and homozygous females have a submucous cleft palate,
    reduced vomer, ankyloglossia in every animal, occasional overt clefts and,
    in some, choanal atresia that causes about 50% postnatal lethality.
    Heterozygous females are unaffected.
  modeled_mechanisms:
  - target: Reduced Intramembranous Ossification of the Posterior Hard Palate
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The null mouse shows the posterior hard palate notch of a submucous cleft.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report a Tbx22(null) mouse, which has a submucous cleft palate (SMCP) and ankyloglossia, similar to the human phenotype, with a small minority showing overt clefts."
      explanation: The mouse reproduces the submucous cleft and ankyloglossia of the human disease.
  - target: Abnormal Tongue Frenulum Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Ankyloglossia is fully penetrant and mild in the mouse, whereas in
      patients it is partially penetrant and variable.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Contrary to the variable penetrance in CPX patients, this defect was detected in all Tbx22null mice studied."
      explanation: Ankyloglossia is present in all null mice, unlike the variable human penetrance.
  - target: Persistent Oro-nasal Membrane
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      Choanal atresia was found in the mouse before it was recognised in
      patients and has since been reported in only a few human families, so its
      human frequency is unknown.
    evidence:
    - reference: PMID:19648291
      reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
      supports: SUPPORT

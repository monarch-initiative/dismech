discussions:
- discussion_id: cpx_carrier_female_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why are about a third of human heterozygous carrier females affected while
    heterozygous Tbx22 mutant female mice are all unaffected?
  attaches_to:
  - inheritance#X-linked semidominant
  - pathophysiology#TBX22 Loss of Function
  rationale: >-
    Carrier-female expression is what makes CPX semidominant rather than
    recessive, and it matters for counseling daughters of affected men. The
    mouse model reproduces the hemizygous male phenotype but not the carrier
    phenotype, and its authors name additional genetic or environmental
    factors or differences in X-inactivation as possible explanations. None has
    been tested.
  evidence:
  - reference: PMID:19648291
    reference_title: "Tbx22null mice have a submucous cleft palate due to reduced palatal bone formation and also display ankyloglossia and choanal atresia phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is also interesting to note that unlike in the human, female heterozygote mutant mice are all unaffected whereas the null females are the same as male null animals."
    explanation: States the divergence between human carrier females and heterozygous female mice.
- discussion_id: abers_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the TBX22 variants found in Abruzzo-Erickson syndrome act by loss of
    function like classic CPX alleles, or by a different mechanism that would
    explain the extra coloboma, deafness, hypospadias and limb findings?
  attaches_to:
  - has_subtypes#Abruzzo-Erickson Syndrome
  - pathophysiology#TBX22 Loss of Function
  rationale: >-
    ClinGen lumped Abruzzo-Erickson syndrome with classic CPX on the view that
    the molecular mechanism does not differ. The original splice acceptor
    variant was predicted to cause aberrant splicing, as were splice variants
    in classic CPX families. A 2026 case series of a second family proposes
    gain of function instead. No functional study of the Abruzzo-Erickson
    alleles has compared them with classic alleles.
  evidence:
  - reference: PMID:41630180
    reference_title: "Case Reviews for Two Families With Unique Variants in TBX22 Causing Abruzzo-Erickson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, we hypothesize that gain-of-function pathogenic variants in TBX22 are the probable cause of ABERS in both Family A and Family B."
    explanation: Proposes a gain-of-function mechanism for the Abruzzo-Erickson alleles, in tension with the ClinGen lumping.
  - reference: "CGGV:assertion_c7700e51-c293-487b-a06a-1392fb1b6209-2024-09-19T160000.000Z"
    reference_title: "TBX22 / cleft palate with or without ankyloglossia, X-linked (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we found no difference in molecular mechanism, inheritance pattern, or phenotypic variability"
    explanation: ClinGen's basis for lumping the two entities.


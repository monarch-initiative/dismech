    reference_title: "X-linked CHARGE-like Abruzzo-Erickson syndrome and classic cleft palate with ankyloglossia result from TBX22 splicing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually involving either a complete, partial or submucous cleft palate, with or without ankyloglossia"
    explanation: Complete and partial cleft palate are part of the classic CPX phenotype.
  - reference: PMID:25373698

- category: Craniofacial
  name: Ankyloglossia
  description: >-
    Tongue-tie from a short, hypertrophic or anteriorly attached lingual
    frenulum. Present in most patients and the main diagnostic marker of CPX,
    but often missed or unreported. It occurs with or without a cleft and is
    the commonest finding in carrier females.

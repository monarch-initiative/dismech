    reference_title: "Unmasking familial CPX by WES and identification of novel clinical signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to X-linked inheritance, ankyloglossia, present in the majority of CPX patients, is an important diagnostic marker, but it is frequently missed or unreported, as it is a \"minor\" feature."
    explanation: Ankyloglossia is present in the majority of CPX patients and is a diagnostic marker.
  - reference: PMID:1570839

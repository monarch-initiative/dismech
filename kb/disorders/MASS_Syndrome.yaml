pathophysiology:
- name: Germline Heterozygous FBN1 Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline FBN1 variant. Reported MASS variants include missense
    changes, canonical and deep intronic splice variants, and a frameshifting
    insertion. A deep intronic variant in one MASS patient inserted ten intronic
    nucleotides into the mRNA and created a premature stop codon, so the mutant
    transcript is expected to be at least partly degraded or to encode a
    C-terminally truncated fibrillin-1.

    evidence_source: HUMAN_CLINICAL
    snippet: "Results of histopathological examination and electron microscopy demonstrated markedly abnormal elastic fibers."
    explanation: >-
      Direct demonstration of abnormal elastic fibers in the skin of a patient
      with the MASS phenotype and an FBN1 mutation.

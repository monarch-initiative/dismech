    explanation: >-
      Table 1 row (columns MVPS, MASS, Marfan syndrome, P): anterior leaflet
      prolapse in 11 of 13 adults with clinically defined, FBN1-negative MASS.
  - reference: PMID:31185693
    reference_title: "Characterization of Two Novel Intronic Variants Affecting Splicing in FBN1-Related Disorders."

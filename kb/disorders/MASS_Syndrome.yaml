  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, detection of a causative FBN1 mutation in MASS raised concerns about MASS to evolve into outright MFS and overt dissection or rupture of the aorta"
    explanation: >-
      An FBN1 result changes the aortic risk assessment for a patient with MASS.

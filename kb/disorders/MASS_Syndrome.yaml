    explanation: >-
      States that FBN1 mutations underlie some, not all, cases of the MASS
      phenotype.
  - reference: PMID:34155898
    reference_title: "Mitral Valve Prolapse and Its Motley Crew-Syndromic Prevalence, Pathophysiology, and Progression of a Common Heart Condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The genetic basis of MASS phenotype is currently unknown, although some patients who presented with MASS had identifiable FBN1 mutations, leading some researchers to believe that this condition is a milder form of Marfan syndrome."
    explanation: >-
      Records both the FBN1 association and its incompleteness: only some
      patients with the MASS phenotype carry an FBN1 mutation.
  - reference: PMID:34491247
    reference_title: "[Comportamiento y decisión cardiovascular en el síndrome de MASS. Reporte de un caso y revisión de la literatura]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "el síndrome de MASS es producto de una inserción de cuatro pares de bases (TTCA) en el nucleótido 5138 del gen de la FBN1"
    explanation: >-
      Reports, from OMIM, that the catalogued MASS allele is a 4-bp TTCA

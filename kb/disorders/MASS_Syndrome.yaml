    reference_title: "Characterization of Two Novel Intronic Variants Affecting Splicing in FBN1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Variants in FBN1 cause a wide range of autosomal dominant heritable connective tissue disorders, including Marfan syndrome (MFS; OMIM 154700), mitral valve–aorta–skeleton–skin syndrome (MASS syndrome; OMIM 604308)"
    explanation: >-
      Lists MASS syndrome (OMIM 604308) among the autosomal dominant FBN1
      disorders. Taken from the paper's introduction, not from its own results.
  - reference: PMID:42743781
    reference_title: "FBN1-related connective tissue disorders: unraveling cardiovascular, skeletal, and ocular complications through TGF-β signaling dysregulation and genotypic correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pathogenic variants in the fibrillin 1 gene (FBN1) give rise to a spectrum of autosomal dominant connective tissue disorders collectively termed type-1 fibrillinopathies, which include Marfan syndrome, geleophysic dysplasia 2, acromicric dysplasia, Weill-Marchesani syndrome 2, marfanoid-progeroid-lipodystrophy syndrome, stiff skin syndrome, MASS syndrome, and isolated ectopia lentis 1."
    explanation: >-
      A review placing MASS syndrome among the autosomal dominant type 1
      fibrillinopathies.
genetic:
- name: FBN1
  gene_term:
    preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    FBN1 variants reported with a MASS diagnosis include missense and splice
    variants (five probands in a Sri Lankan exome series, PMID:41502793) and a
    deep intronic variant, c.7571-12T>A, that activates a cryptic acceptor site
    and introduces a premature stop codon (PMID:31185693). OMIM's MASS allele is
    a 4-bp insertion at nucleotide 5138, as quoted from OMIM by PMID:34491247. No
    variant class is specific to MASS, and no genotype-phenotype rule separates
    it from the related FBN1 conditions (PMID:23794388). Not every patient
    meeting the clinical MASS criteria carries an FBN1 variant, so the clinical
    phenotype is probably genetically heterogeneous. HGNC lists MASS as an alias
    symbol of FBN1. No ClinGen classification exists for this gene and disease.
  evidence:
  - reference: PMID:24740214
    reference_title: "Atrophic skin patches with abnormal elastic fibers as a presenting sign of the MASS phenotype associated with mutation in the fibrillin 1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent medical genetics evaluation led ultimately to the diagnosis of the MASS phenotype and the discovery of an underlying FBN1 mutation."
    explanation: >-
      A case of the MASS phenotype with an FBN1 mutation.
  - reference: PMID:31185693
    reference_title: "Characterization of Two Novel Intronic Variants Affecting Splicing in FBN1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report two unrelated individuals with the FBN1 deep intronic variants c.6872-24T>A and c.7571-12T>A, clinically associated with MFS and MASS syndrome, respectively."
    explanation: >-
      A woman with MASS syndrome carrying a likely pathogenic deep intronic FBN1
      variant.
  - reference: PMID:41502793
    reference_title: "Characterisation of Type-1 Fibrillinopathies in a Sri Lankan Cohort: Genotype-Phenotype Correlations and Novel FBN1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype found in these patients together with the associated genotype was as follows: ... MASS syndrome - 5 (41.7%)"
    explanation: >-
      Five of 12 sporadic Sri Lankan patients with heterozygous FBN1 variants had
      MASS syndrome, each with a distinct variant.
  - reference: PMID:23794388

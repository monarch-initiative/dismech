    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining 17% would be classified as ectopia lentis syndrome (ELS), mitral valve prolapse syndrome or mitral valve, aorta, skeleton and skin (MASS) syndrome, or potential MFS in patients aged less than 20 years."
    explanation: >-
      Names ectopia lentis syndrome and MASS as separate categories for FBN1
      carriers who do not meet the Marfan criteria.
discussions:
- discussion_id: why_fbn1_gives_mass_not_marfan
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#FBN1
  - pathophysiology#Dysregulated TGF-beta Signaling
  prompt: >-
    Why does an FBN1 variant produce MASS, with a normal lens and a
    non-progressive aortic root, in some people and Marfan syndrome in others,
    and is TGF-beta dysregulation part of the mitral valve disease in MASS?
  rationale: >-
    No genotype-phenotype rule separates MASS from Marfan syndrome. One
    splice-variant report speculates that MASS alleles preserve the TGF-beta
    binding domains of fibrillin-1 while aortic disease follows their loss, and
    a review proposes TGF-beta dysregulation as the driver of MASS mitral valve
    disease while noting it is untested. Neither has been examined in a series
    of MASS patients.
  evidence:
  - reference: PMID:23794388
    reference_title: "Juvenile idiopathic arthritis, mitral valve prolapse and a familial variant involving the integrin-binding fragment of FBN1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Among these clinically related conditions, there is no compelling evidence that genotype predicts phenotype, with the exception of neonatal Marfan syndrome, mutations in which cluster within FBN1 exons 24-32."
    explanation: >-
      No genotype-phenotype correlation separates MASS from the related
      FBN1 conditions.
  - reference: PMID:31185693
    reference_title: "Characterization of Two Novel Intronic Variants Affecting Splicing in FBN1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We can speculate that in Individual 1 aortic involvement might be, at least in part, due to the loss of TGFβ binding domain, which, in turn, is preserved in the truncated protein predicted in Individual 2 (MASS syndrome), who showed normal aorta."
    explanation: >-
      A two-patient speculation about the domain-level basis of the MASS versus
      Marfan difference, offered by its authors as speculation.

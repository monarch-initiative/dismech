- name: Borderline aortic root enlargement
  category: Cardiovascular
  description: >-
    The aortic component is at most borderline: the 1989 description reported
    mild dilatation of the aortic root, while the revised Ghent nosology requires
    an aortic root Z-score below 2, so many patients diagnosed under the current
    criteria have a normal-sized root. The enlargement did not progress to
    aneurysm or dissection in the longitudinal data available. Bound to the HPO
    term whose definition, widening of the aortic root, covers enlargement of
    any degree; a Z-score of 2 or more moves the diagnosis toward Marfan
    syndrome.
  phenotype_term:

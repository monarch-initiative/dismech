  - reference: PMID:31185693
    reference_title: "Characterization of Two Novel Intronic Variants Affecting Splicing in FBN1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted NGS analysis revealed the FBN1 heterozygous c.7571-12T>A variant in intron 61"

notes: >-
  Lump/split decision: recorded as a separate disease entry rather than as a
  has_subtypes row of Marfan_Syndrome. A subtype row would assert that every
  MASS patient has Marfan syndrome, and three things contradict that. First,
  the revised Ghent nosology defines MASS as a separate diagnostic category
  whose criteria exclude the two cardinal Marfan features, ectopia lentis and
  aortic root aneurysm (PMID:28616514), and FBN1 carriers who meet the MASS
  criteria are classified out of Marfan syndrome (PMID:21564093). Second, the
  clinical phenotype is not confined to FBN1: its genetic basis is described as
  unknown with only some patients carrying FBN1 variants (PMID:34155898), and a
  longitudinal MASS cohort was FBN1-negative, so MASS is not a stratum of the
  FBN1 disease. Third, the course differs, with no aortic complications in
  MASS against aortic surgery in about half of Marfan patients by age 47
  (PMID:28616514). MONDO (MONDO:0011431) and OMIM (604308) also keep MASS as
  its own concept, and the sibling FBN1 category, ectopia lentis syndrome, is
  curated the same way (Ectopia_Lentis_1_Isolated_Autosomal_Dominant). For FBN1
  carriers the boundary with Marfan syndrome is a classification boundary on
  one continuum that can move with age, so the entry records it in
  definitions, progression and differential_diagnoses.
  The causal gene is recorded as FBN1 because MONDO and OMIM name it, but the
  evidence linking FBN1 to MASS specifically is case-level (single families,
  small series and individual case reports), and a review states that the
  genetic basis of the phenotype is unknown. The largest longitudinal MASS
  cohort (PMID:28616514) excluded FBN1, TGFBR1 and TGFBR2 carriers by design, so
  its phenotype and outcome figures describe clinically defined, gene-negative
  MASS. No GeneReviews or StatPearls chapter names MASS syndrome or its
  synonyms in the committed Bookshelf index or a live PubMed title search. No ClinGen
  gene-disease validity record exists for FBN1 and MONDO:0011431, so
  gene_disease_validity is left empty. No node declares conforms_to: the
  aortopathy_tgfbeta_dysregulation module models progressive aortic wall
  failure, which this entry excludes by definition, and no mitral valve or
  elastic fiber module exists.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The FBN1-related form is an autosomal dominant type 1 fibrillinopathy, like
    Marfan syndrome. No MASS-specific segregation study with a penetrance
    estimate was found.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

definitions:
- name: Revised Ghent nosology MASS phenotype
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Under the revised Ghent nosology (2010), MASS is diagnosed in a person with
    mitral valve prolapse, a systemic score of at least 5 points that includes at
    least one skeletal feature, an aortic root Z-score below 2, and no ectopia
    lentis. With a systemic score below 5 the same picture is mitral valve
    prolapse syndrome. Because the Marfan phenotype can emerge with age, the
    classification is provisional in young patients.
  evidence:
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, MASS was present with MVP, exclusion of aortic root dilatation ≥ 2 Z-scores and ectopia lentis, but with a systemic score ≥ 5 points including at least one skeletal feature."
    explanation: >-
      The operational Ghent-2 definition of MASS applied in the cohort.
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast to MVPS the definition of MASS requires a systemic score ≥ 5 points."
    explanation: >-
      The systemic score separates MASS from mitral valve prolapse syndrome.
- name: Original MASS phenotype description
  definition_type: CASE_DEFINITION
  description: >-
    Glesby and Pyeritz (1989) proposed the MASS acronym for patients with mitral
    valve prolapse, mild aortic root dilatation and skeletal and skin features
    who did not meet the criteria for Marfan syndrome, framing them as an overlap
    heritable connective tissue disorder on a continuum from Marfan syndrome to
    isolated mitral valve prolapse.
  evidence:
  - reference: PMID:2739055
    reference_title: "Association of mitral valve prolapse and systemic abnormalities of connective tissue. A phenotypic continuum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest the acronym \"MASS phenotype\" to emphasize involvement of the mitral valve, aorta, skeleton, and skin."
    explanation: >-
      The original definition of the MASS phenotype.
  - reference: PMID:2739055
    reference_title: "Association of mitral valve prolapse and systemic abnormalities of connective tissue. A phenotypic continuum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype of patients with mitral valve prolapse constitutes a continuum, from Marfan syndrome at one extreme to isolated mitral valve prolapse due to myxomatous proliferation of the valve leaflets."
    explanation: >-
      Places MASS on a continuum between Marfan syndrome and isolated mitral
      valve prolapse.
progression:
- phase: Childhood and adolescence
  notes: >-
    The phenotype is usually defined in childhood or the teenage years. FBN1
    carriers classified as MASS or ectopia lentis syndrome may go on to develop
    classic Marfan syndrome, so aortic follow-up continues.
  evidence:
  - reference: PMID:39459359
    reference_title: "Magnetic Resonance Imaging of Temporomandibular Joint and Aortic Root Score in Fibrillinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MASS had a moderate expression in our study and the phenotypic findings were defined early, during childhood, or teenage"
    explanation: >-
      MASS features were established in childhood or adolescence.
  - reference: PMID:21564093
    reference_title: "The new Ghent criteria for Marfan syndrome: what do they change?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taking into account the median age at last follow-up (29 years), the possibility has to be considered that these patients would go on to develop classic MFS with time."
    explanation: >-
      FBN1 carriers classified as MASS, ectopia lentis syndrome or potential
      Marfan syndrome may progress to Marfan syndrome.
- phase: Adulthood
  notes: >-
    In adults with clinically defined MASS the aortic root stays stable while
    mitral valve disease can progress to regurgitation and surgery.
  evidence:
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study provides evidence that MVPS and MASS are Marfan-like syndromes with stability of aortic dilatation but with progression of mitral valve prolapse."
    explanation: >-
      Longitudinal outcome of the aortic and mitral components in adults.
diagnosis:
- name: Echocardiographic assessment of the aortic root and mitral valve
  description: >-
    Transthoracic echocardiography measures the aortic root at the sinuses of
    Valsalva for a Z-score, which must stay below 2, and documents mitral valve
    prolapse and regurgitation. It is repeated over time because the diagnosis is
    revised if the aortic root enlarges.
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used standard 2-dimensional transthoracic echocardiographic recordings to assess aortic root diameters in the parasternal long-axis view at the level of the aortic sinuses at end-diastole using the leading-edge method with calculation of Z-scores using Devereux's formula"
    explanation: >-
      The echocardiographic method used to apply the aortic criterion.
  - reference: PMID:21564093
    reference_title: "The new Ghent criteria for Marfan syndrome: what do they change?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic criteria should be a flexible and dynamic tool so that reclassification of patients with alternative diagnosis is possible, requiring regular clinical and aortic follow-up."
    explanation: >-
      Regular aortic follow-up is needed because alternative diagnoses such as
      MASS can be reclassified.
- name: Clinical diagnosis by exclusion with molecular testing
  description: >-
    The diagnosis is clinical and by exclusion: there is no validated genetic
    test for MASS. Gene panel sequencing of FBN1 and the other aortopathy genes
    identifies FBN1 carriers, whose aortic risk is reassessed because they can
    later meet the criteria for Marfan syndrome.

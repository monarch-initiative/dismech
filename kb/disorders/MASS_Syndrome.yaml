differential_diagnoses:
- name: Marfan syndrome
  description: >-
    The same gene and an overlapping systemic phenotype. Ectopia lentis or an
    aortic root aneurysm excludes MASS and, with the other Ghent criteria, leads
    to a Marfan syndrome diagnosis. About 10% of FBN1 carriers diagnosed with
    Marfan syndrome under the 1996 criteria were reclassified as ectopia lentis
    syndrome or MASS under the 2010 criteria, in the absence of aortic
    dilatation.
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  distinguishing_features:
  - Ectopia lentis
  - Aortic root aneurysm with a Z-score of 2 or more, or aortic dissection
  evidence:
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Unlike in Marfan syndrome (MFS), the presence of ectopia lentis and aortic aneurysm preclude diagnosis of MVPS and MASS."
    explanation: >-
      The two features whose presence rules out MASS.
  - reference: PMID:21564093
    reference_title: "The new Ghent criteria for Marfan syndrome: what do they change?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, 10% of MFS patients were reclassified as ELS or MASS in the absence of aortic dilatation; conversely, 5% were reclassified as MFS in the presence of aortic dilatation."
    explanation: >-
      Aortic dilatation is the feature that moves FBN1 carriers between the
      Marfan and MASS categories.
- name: Mitral valve prolapse syndrome
  description: >-
    Mitral valve prolapse with a few Marfan-like features, no aortic root
    aneurysm and no ectopia lentis, but a systemic score below 5. It shares the
    aortic and lens exclusions with MASS and differs in the number of systemic
    features; outcome in the one comparative series did not depend on the
    distinction.
  distinguishing_features:
  - Systemic score below 5 points
  evidence:
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast to MVPS the definition of MASS requires a systemic score ≥ 5 points."
    explanation: >-
      The systemic score threshold separating the two categories.
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current nosology uses the number of systemic Marfan-like features to distinct MVPS from MASS, but the number of these features does not seem to have impact on clinical outcomes."
    explanation: >-
      The distinction did not predict outcome in the comparative series.

name: MASS Syndrome
creation_date: "2026-10-30T18:00:00Z"
description: >-
  MASS syndrome (MASS phenotype) is a heritable connective tissue disorder on the
  type 1 fibrillinopathy spectrum, named for its involvement of the mitral valve,
  aorta, skeleton and skin. Affected individuals have mitral valve prolapse,
  myopia, at most borderline and non-progressive enlargement of the aortic root,
  striae, and Marfan-like skeletal features such as long limbs, pectus deformity
  and scoliosis, but they lack ectopia lentis and an aortic root aneurysm, the two
  cardinal features of Marfan syndrome. The term was introduced in 1989 for
  patients who could not be classified as having Marfan syndrome yet showed a
  systemic extracellular-matrix defect, and the revised Ghent nosology of 2010
  defines it as mitral valve prolapse with a systemic score of at least 5 points,
  including a skeletal feature, an aortic root Z-score below 2 and no ectopia
  lentis. Heterozygous FBN1 variants are reported in some patients, and MONDO and
  OMIM record FBN1 as the causal gene, but the diagnosis is clinical and patients
  without an FBN1 variant also meet it. Prognosis is dominated by mitral valve
  disease rather than by the aorta: in a longitudinal series no patient with MASS
  developed an aortic complication, while mitral valve disease progressed. An FBN1
  carrier diagnosed with MASS, particularly a young one, can later meet the
  criteria for Marfan syndrome, so the classification is provisional and needs
  aortic follow-up.
category: Mendelian
parents:
- Type 1 Fibrillinopathy
- Heritable Connective Tissue Disorder
synonyms:
- MASS phenotype
- mitral valve-aorta-skeleton-skin syndrome
- Mitral valve prolapse, Aortic enlargement, Skin and Skeletal findings

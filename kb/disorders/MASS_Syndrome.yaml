phenotypes:
- name: Mitral valve prolapse
  category: Cardiovascular
  description: >-
    The defining cardiac feature, and a required criterion for MASS under the
    revised Ghent nosology. Anterior leaflet prolapse predominates; in a
    clinically defined adult cohort posterior and bileaflet prolapse were less
    frequent in MASS than in Marfan syndrome. A pooled analysis of published
    reports, which did not all apply the revised criteria, gave a median MVP
    prevalence of 74.3% in patients diagnosed with the MASS phenotype.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Mitral valve prolapse
    term:
      id: HP:0001634
      label: Mitral valve prolapse
  evidence:
  - reference: PMID:34155898
    reference_title: "Mitral Valve Prolapse and Its Motley Crew-Syndromic Prevalence, Pathophysiology, and Progression of a Common Heart Condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis shows a median prevalence of 74.3% of MVP in patients diagnosed with the MASS phenotype"
    explanation: >-
      Pooled median prevalence across published MASS series; 74.3% falls in the
      frequent band.
  - reference: PMID:2739055
    reference_title: "Association of mitral valve prolapse and systemic abnormalities of connective tissue. A phenotypic continuum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a group, these patients share many manifestations of the Marfan syndrome including long limbs, deformity of the thoracic cage, striae atrophicae, mitral valve prolapse, and mild dilatation of the aortic root."
    explanation: >-
      Mitral valve prolapse is among the manifestations of the patients for whom
      the MASS phenotype was named.
  - reference: PMID:28616514
    reference_title: "Mitral valve prolapse syndrome and MASS phenotype: Stability of aortic dilatation but progression of mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

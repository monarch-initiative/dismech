  downstream:
  - target: Defective Fibrillin-1 Microfibrils and Elastic Fibers
    description: >-
      The variant reduces normal fibrillin-1 or introduces an abnormal monomer
      into the microfibrils of elastic and non-elastic connective tissue.
    causal_link_type: DIRECT
- name: Defective Fibrillin-1 Microfibrils and Elastic Fibers
  biological_scale: TISSUE
  description: >-
    Fibrillin-1 microfibrils are the scaffold of elastic fibers and a structural
    element of the mitral valve, aortic wall, dermis, periosteum and dura.
    Abnormal elastic fibers have been shown directly in MASS skin by histology
    and electron microscopy. The systemic phenotype is read as a consequence of
    this extracellular-matrix defect in each tissue, by analogy with Marfan
    syndrome; the tissue-level steps have not been studied in MASS itself, and
    why the ciliary zonule and the aortic media are spared is not known.
  biological_processes:
  - preferred_term: elastic fiber assembly
    term:
      id: GO:0048251
      label: elastic fiber assembly
    modifier: ABNORMAL
  evidence:

name: GATA2 Deficiency
creation_date: "2026-08-31T00:00:00Z"
description: >-
  GATA2 deficiency is an autosomal dominant disorder of haematopoiesis and
  immunity caused by heterozygous germline loss-of-function variants in the
  GATA2 transcription factor. Affected individuals develop progressive
  cytopenia of monocytes, B lymphocytes, natural killer cells and dendritic
  cells, with susceptibility to disseminated nontuberculous mycobacterial
  infection, severe human papillomavirus disease and invasive fungal
  infection, together with a high lifetime risk of myelodysplastic syndrome
  and acute myeloid leukaemia, frequently in adolescence and frequently
  accompanied by monosomy 7. The condition has been described under several
  names that represent presentations of one disorder, including MonoMAC
  syndrome, dendritic cell-monocyte-B and NK lymphoid deficiency, Emberger
  syndrome and familial MDS/AML.
category: Mendelian
parents:
- hereditary disease
synonyms:
- MonoMAC syndrome
- DCML deficiency
- dendritic cell, monocyte, B lymphocyte and natural killer lymphocyte deficiency
- immunodeficiency 21
- GATA2 haploinsufficiency
disease_term:
  preferred_term: GATA2 deficiency
  term:
    id: MONDO:0042982
    label: GATA2 deficiency with susceptibility to MDS/AML
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    GATA2 deficiency results from heterozygous germline GATA2 variants,
    including coding loss-of-function alleles and variants in the intron 5
    +9.5 kb enhancer, transmitted as an autosomal dominant trait with
    incomplete penetrance and variable expressivity. A substantial minority
    of cases are de novo.
  evidence:
  - reference: PMID:34387894
    reference_title: "GATA2 deficiency syndrome: A decade of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GATA2 deficiency syndrome (G2DS) is a rare autosomal dominant genetic
      disease predisposing to a range of symptoms, of which myeloid malignancy
      and immunodeficiency including recurrent infections are most common.
    explanation: >-
      States the autosomal dominant inheritance pattern and the two dominant
      clinical axes of the disorder.
  - reference: PMID:36455197
    reference_title: "The spectrum of GATA2 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited or de novo germ line heterozygous mutations in the gene encoding
      the transcription factor GATA2 lead to its deficiency.
    explanation: >-
      Establishes that both inherited and de novo heterozygous germline alleles
      cause the disorder.
pathophysiology:
- name: GATA2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous null alleles, missense variants in the second zinc finger,
    and regulatory variants in the intron 5 +9.5 kb enhancer all reduce
    functional GATA2 dosage below the threshold required for hematopoietic
    stem and progenitor cell maintenance.
  genes:
  - preferred_term: GATA2
    term:
      id: hgnc:4171
      label: GATA2
  evidence:
  - reference: PMID:24227816
    reference_title: "GATA2 deficiency: a protean disorder of hematopoiesis, lymphatics, and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of the hematopoietic transcription factor GATA2
      underlies monocytopenia and mycobacterial infections; dendritic cell,
      monocyte, B, and natural killer (NK) lymphoid deficiency; familial
      myelodysplastic syndromes (MDS)/acute myeloid leukemia (AML); and Emberger
      syndrome (primary lymphedema with MDS).
    explanation: >-
      Names haploinsufficiency as the mechanism and enumerates the presentations
      it unifies.
  downstream:
  - target: Hematopoietic Stem and Progenitor Cell Depletion
    description: >-
      Reduced GATA2 dosage falls below the threshold needed to maintain stem
      and progenitor survival and self-renewal, so the compartment attrits over
      years.
  - target: Lymphatic Vascular Development Defect
    description: >-
      GATA2 is independently required in lymphatic endothelium for valve
      morphogenesis, so the same reduced dosage acts on a second, non-
      haematopoietic tissue.
- name: Hematopoietic Stem and Progenitor Cell Depletion
  biological_scale: CELLULAR
  description: >-
    Reduced GATA2 dosage impairs survival and self-renewal of hematopoietic
    stem and progenitor cells, producing a progressively hypocellular marrow
    with multilineage dysplasia.
  evidence:
  - reference: PMID:36455197
    reference_title: "The spectrum of GATA2 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The bone marrow failure is typically characterized by hypocellularity.
    explanation: >-
      Confirms the hypocellular marrow that follows progenitor depletion.
  - reference: PMID:40138552
    reference_title: "Hematological phenotypes in GATA2 deficiency syndrome arise from aging, maladaptation to proliferation, and somatic events."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similar to what has been observed in patients, our models showed that
      GATA2 haploinsufficiency leads to B lymphopenia, monocytopenia, lethal
      bone marrow failure (BMF), myelodysplasia, and lymphoblastic leukemia.
    explanation: >-
      Mouse models of GATA2 haploinsufficiency reproduce the marrow failure and
      cytopenias, supporting a dosage-dependent progenitor defect.
  downstream:
  - target: Mononuclear Cytopenia
    description: >-
      Loss of the shared multilineage progenitor removes the source of
      monocytes, B lymphocytes, natural killer cells and dendritic cells.
  - target: Clonal Evolution to Myeloid Malignancy
    description: >-
      A chronically stressed, hypocellular marrow under replicative pressure
      provides the substrate on which somatic second hits are selected.
- name: Mononuclear Cytopenia
  biological_scale: ORGANISM
  description: >-
    Progressive loss of circulating monocytes, B lymphocytes, natural killer
    cells and dendritic cells is the characteristic peripheral blood
    signature of the disorder.
  evidence:
  - reference: PMID:36455197
    reference_title: "The spectrum of GATA2 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical manifestations result from the loss of a multilineage
      progenitor that gives rise to B lymphocytes, monocytes, natural killer
      cells, and dendritic cells, leading to cytopenias of these lineages and
      subsequent infections.
    explanation: >-
      Attributes the characteristic four-lineage cytopenia to loss of a shared
      multilineage progenitor.
  downstream:
  - target: Impaired Antimycobacterial and Antiviral Immunity
    description: >-
      Depletion of the monocyte, natural killer and dendritic cell compartments
      removes the effectors that control intracellular pathogens and
      papillomavirus.
  - target: Alveolar Macrophage Depletion
    description: >-
      Alveolar macrophages depend on continuous replacement from circulating
      monocytes, so the monocytopenia propagates directly into the lung.
- name: Impaired Antimycobacterial and Antiviral Immunity
  biological_scale: ORGANISM
  description: >-
    Loss of monocyte and natural killer cell compartments removes control of
    intracellular pathogens, producing disseminated nontuberculous
    mycobacterial infection, severe and refractory human papillomavirus
    disease, and invasive fungal infection.
  evidence:
  - reference: PMID:36455197
    reference_title: "The spectrum of GATA2 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This results in a constellation of clinical features including
      nontuberculous mycobacterial, bacterial, fungal, and human papillomavirus
      infections, lymphedema, pulmonary alveolar proteinosis, and myelodysplasia.
    explanation: >-
      Lists the infectious consequences that follow the mononuclear cytopenia.
- name: Alveolar Macrophage Depletion
  biological_scale: TISSUE
  description: >-
    Alveolar macrophages are continuously replenished from circulating
    monocytes. With the monocyte compartment depleted, that replenishment
    fails and surfactant clearance falls, producing pulmonary alveolar
    proteinosis and impaired gas transfer. The lesion is upstream of GM-CSF
    receptor signalling, which distinguishes it mechanistically from
    hereditary PAP.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  evidence:
  - reference: PMID:40264496
    reference_title: "GATA2 Deficiency With Early-Onset and Progressive Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common respiratory diseases are pulmonary alveolar proteinosis,
      recurrent respiratory tract infections, and pulmonary hypertension.
    explanation: >-
      Establishes pulmonary alveolar proteinosis as the leading respiratory
      manifestation of the disorder.
  - reference: PMID:40264496
    reference_title: "GATA2 Deficiency With Early-Onset and Progressive Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation is known to cause a decrease in haematopoietic stem cells and
      a decrease in monocytes, dendritic cells, NK cells, and B cells, leading to
      various diseases such as haematological, infectious, respiratory, and
      neurological diseases.
    explanation: >-
      Links the monocyte deficit to the respiratory disease, the causal step this
      node encodes.
- name: Clonal Evolution to Myeloid Malignancy
  biological_scale: CELLULAR
  description: >-
    Marrow under replicative stress acquires secondary cytogenetic and
    somatic lesions, characteristically monosomy 7, trisomy 8 and ASXL1
    mutation, driving transformation to myelodysplastic syndrome and acute
    myeloid leukaemia.
  evidence:
  - reference: PMID:36455197
    reference_title: "The spectrum of GATA2 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter 3 malignancies often occur in the setting of monosomy 7,
      trisomy 8, and acquired mutations in ASXL1 or in STAG2.
    explanation: >-
      Names the specific somatic second hits that accompany transformation, the
      lesions this node asserts.
  - reference: PMID:38067298
    reference_title: "Development of MDS in Pediatric Patients with GATA2 Deficiency: Increased Histone Trimethylation and Deregulated Apoptosis as Potential Drivers of Transformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease progression (GATA2-EB, n = 6) was associated with increased GATA2
      mRNA levels, restored expression of the GATA2 target EZH2, and increased
      H3K27me3.
    explanation: >-
      Molecular correlate of progression in pediatric GATA2 deficiency marrow,
      from a 57-patient biopsy series.
  - reference: PMID:38067298
    reference_title: "Development of MDS in Pediatric Patients with GATA2 Deficiency: Increased Histone Trimethylation and Deregulated Apoptosis as Potential Drivers of Transformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, our findings highlight the potential drivers of disease
      progression in GATA2 deficiency, particularly increased histone
      trimethylation and dysregulated apoptosis.
    explanation: >-
      Summarises the two proposed drivers of transformation.
  - reference: PMID:38887897
    reference_title: "GATA2 heterozygosity causes an epigenetic feedback mechanism resulting in myeloid and erythroid dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that cell-intrinsic compensatory mechanisms, needed
      to obtain normal levels of Gata2b in heterozygous HSPCs to maintain their
      integrity, result in aberrant lineage differentiation, thereby representing
      a critical step in the predisposition to MDS.
    explanation: >-
      Zebrafish model showing the compensatory response to heterozygosity is
      itself the predisposing step toward MDS.
- name: Lymphatic Vascular Development Defect
  biological_scale: TISSUE
  description: >-
    GATA2 is required for lymphovenous and lymphatic valve development;
    reduced dosage produces primary lymphedema in a subset of patients, the
    feature that defines the Emberger presentation.
  evidence:
  - reference: PMID:34387894
    reference_title: "GATA2 deficiency syndrome: A decade of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apart from lymphedema in which haploinsufficiency seems necessary, the
      mutational requirements of the other less common G2DS phenotypes is still
      unclear.
    explanation: >-
      Indicates that the lymphatic phenotype specifically requires true
      haploinsufficiency rather than any GATA2 variant class.
  - reference: PMID:31582413
    reference_title: "GATA2 controls lymphatic endothelial cell junctional integrity and lymphovenous valve morphogenesis through miR-126."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GATA2 is necessary for the development of lymphatic valves and lymphovenous
      valves, and for the patterning of lymphatic vessels.
    explanation: >-
      Directly supports the developmental requirement this node asserts, which the
      genotype-correlation quote above does not establish on its own.
  - reference: PMID:31582413
    reference_title: "GATA2 controls lymphatic endothelial cell junctional integrity and lymphovenous valve morphogenesis through miR-126."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GATA2 is also necessary for the expression of the cell junction molecules
      VE-cadherin and claudin 5 in lymphatic vessels.
    explanation: >-
      Gives the junctional mechanism behind the valve defect.

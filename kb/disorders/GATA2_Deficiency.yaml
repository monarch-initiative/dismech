genetic:
- name: GATA2
  notes: >-
    Heterozygous germline GATA2 variants cause the disorder. Three variant
    classes are recognised: coding null alleles (frameshift, nonsense,
    whole-gene deletion) acting by haploinsufficiency; missense alleles
    concentrated in the second zinc finger that impair sequence-specific DNA
    binding; and regulatory variants disrupting the intron 5 +9.5 kb enhancer.
    Null alleles are over-represented among patients with lymphedema and severe
    viral disease.
  gene_term:
    preferred_term: GATA2
    term:
      id: hgnc:4171
      label: GATA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24227816
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Viral infections and lymphedema were more common in individuals with null
      mutations (P = .038 and P = .006, respectively).
    explanation: >-
      Supports a genotype-phenotype correlation in which null alleles drive the
      viral and lymphatic features.
  - reference: PMID:34387894
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variant types appear to predispose to myeloid malignancy and
      immunodeficiency.
    explanation: >-
      Indicates the malignant and immune risks are not restricted to one variant
      class, in contrast to the lymphatic phenotype.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT replaces the GATA2-haploinsufficient hematopoietic
    compartment and is the only intervention that reverses the marrow failure,
    immunodeficiency and malignant predisposition. Timing is the central
    clinical question: transplant before evolution to monosomy 7 or advanced
    MDS gives markedly better outcomes than salvage after transformation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hematopoietic Stem and Progenitor Cell Depletion
    description: >-
      Donor stem cells restore a hematopoietic compartment with two functional
      GATA2 alleles, correcting the progenitor deficit at its source.
  evidence:
  - reference: PMID:29412158
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic hematopoietic stem cell transplantation (HSCT) reverses the bone
      marrow failure syndrome due to GATA2 deficiency.
    explanation: >-
      States that transplant reverses the marrow failure phenotype.
  - reference: PMID:29412158
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At a median follow-up of 24 months (range, 9 to 50), 19 of 22 patients were
      alive with reversal of the disease phenotype and correction of the
      myelodysplastic syndrome, including eradication of cytogenetic
      abnormalities.
    explanation: >-
      Prospective outcome data for busulfan-based conditioning in 22 patients.
  - reference: PMID:36455197
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic hematopoietic stem cell transplantation (HSCT) results in
      reversal of the phenotype.
    explanation: >-
      Independent review confirming transplant as the definitive treatment.

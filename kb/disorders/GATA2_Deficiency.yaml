  phenotype_term:
    preferred_term: Monocytopenia
    term:
      id: HP:0012312
      label: Decreased total monocyte count
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:24227816
    reference_title: "GATA2 deficiency: a protean disorder of hematopoiesis, lymphatics, and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monocytopenia, B, NK, and CD4 lymphocytopenia correlated with the presence
      of disease (P < .001).
    explanation: >-
      Establishes this cytopenia as a disease-associated finding in the NIH cohort.
- category: Hematologic

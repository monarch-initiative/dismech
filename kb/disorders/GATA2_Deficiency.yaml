- category: Immunologic
  name: Disseminated Nontuberculous Mycobacterial Infection
  description: >-
    Disseminated infection with nontuberculous mycobacteria, especially
    Mycobacterium avium complex, is the defining infectious presentation.
  phenotype_term:
    preferred_term: Recurrent mycobacterial infections
    term:
      id: HP:0011274
      label: Recurrent mycobacterial infections
  evidence:
  - reference: PMID:24227816
    reference_title: "GATA2 deficiency: a protean disorder of hematopoiesis, lymphatics, and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a broad spectrum of disease: hematologic (MDS 84%, AML 14%,
      chronic myelomonocytic leukemia 8%), infectious (severe viral 70%,
      disseminated mycobacterial 53%, and invasive fungal infections 16%),
      pulmonary (diffusion 79% and ventilatory defects 63%, pulmonary alveolar
      proteinosis 18%, pulmonary arterial hypertension 9%), dermatologic (warts
      53%, panniculitis 30%), neoplastic (human papillomavirus+ tumors 35%,
      Epstein-Barr virus+ tumors 4%), vascular/lymphatic (venous thrombosis 25%,
      lymphedema 11%), sensorineural hearing loss 76%, miscarriage 33%, and
      hypothyroidism 14%.
    explanation: >-
      Frequencies for this feature in the 57-patient NIH GATA2 deficiency cohort.

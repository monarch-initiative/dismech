notes: >-
  KRT1 keratinopathies represent a phenotypic continuum unified by
  dominant-negative variants in keratin 1. The presence or absence of palmoplantar
  involvement, the generalized versus localized distribution, and the cyclic
  versus persistent course are determined by variant location within the KRT1
  gene. The entry groups four gene-defined rows, each bound to the KRT1 member of
  a MONDO gene series: epidermolytic hyperkeratosis 1 (MONDO:0700249), ichthyosis
  hystrix of Curth-Macklin (MONDO:0007808), ichthyosis, annular epidermolytic, 2
  (MONDO:0859574), and palmoplantar keratoderma, epidermolytic, 2
  (MONDO:0957303). Each of those series also has a sibling member caused by a
  different keratin gene, which is why the entry's scope is the gene rather than
  any one MONDO class: epidermolytic hyperkeratosis 2 (MONDO:0958184) is the KRT10
  disease, ichthyosis, annular epidermolytic 1 (MONDO:0100303) is its KRT10
  counterpart, and epidermolytic palmoplantar keratoderma, 1 (MONDO:0007758) is
  the KRT9 disease. None of those three siblings is bound anywhere else in `kb/`,
  and none belongs on this entry: MONDO:0958184 is queued as
  `stubs/Epidermolytic_Hyperkeratosis_2.yaml`, whose notes also record
  MONDO:0100303 as the other uncurated KRT10 concept, and the KRT9 disease belongs
  with KRT9. GeneReviews has no chapter for epidermolytic ichthyosis
  or for any KRT1 keratinopathy in the 2026-09-10 Bookshelf index snapshot that
  `just check-genereviews` reads, so the clinical baseline here is the StatPearls
  chapter and the primary literature rather than a GeneReviews chapter. Orphanet
  could not be consulted: no `references_cache/ORPHA_*.md` file covers these
  concepts, and populating one needs a maintainer-level Orphadata refresh.

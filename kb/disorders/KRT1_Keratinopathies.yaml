      label: epidermolytic hyperkeratosis 1
  description: >-
    Classic generalized form characterized by congenital erythroderma, blistering
    and erosions at birth, evolving into widespread ichthyosiform hyperkeratosis
    with palmoplantar keratoderma. Caused by heterozygous missense mutations at
    highly conserved helix boundary motifs of KRT1. MONDO separates the KRT1 form
    of epidermolytic hyperkeratosis (MONDO:0700249) from the KRT10 form
    (MONDO:0958184); this row is the KRT1 form.
  genes:
  - preferred_term: KRT1
    term:
      id: hgnc:6412
      label: KRT1
  inheritance:
  - name: Autosomal dominant inheritance
    description: >-
      Generalized epidermolytic ichthyosis segregates as an autosomal dominant
      trait with complete penetrance, and about half of probands carry a de novo
      variant.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:15663649
      reference_title: "Epidermolytic hyperkeratosis: a keratin 1 or 10 mutational event."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetically, this is an autosomal dominant disease with complete penetrance; however, 50% are spontaneous mutations."
      explanation: States the autosomal dominant mode, complete penetrance, and de novo rate for generalized epidermolytic hyperkeratosis.
  evidence:

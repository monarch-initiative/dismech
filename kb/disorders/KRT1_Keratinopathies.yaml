    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidermolytic ichthyosis (EI) is a hereditary keratinization disorder caused by mutations in the keratin 1 (KRT1) or keratin 10 (KRT10) genes."
    explanation: Confirms EI as a hereditary keratinization disorder caused by KRT1 or KRT10 mutations.
- name: Ichthyosis Hystrix Curth-Macklin
  display_name: Ichthyosis Hystrix of Curth-Macklin
  subtype_term:
    preferred_term: ichthyosis hystrix of Curth-Macklin
    term:
      id: MONDO:0007808
      label: ichthyosis hystrix of Curth-Macklin
  description: >-
    Rare variant characterized by generalized spiky or verrucous hyperkeratosis
    and severe palmoplantar keratoderma. Distinguished from classic EI by the
    presence of binucleated cells and absence of typical tonofilament clumping.
    Reported KRT1 variants truncate the V2 tail domain. MONDO asserts KRT1 as the
    causal gene of MONDO:0007808, and the paper cited below reports a sporadic
    patient whose causal variant was instead a de novo three-base-pair deletion
    in KRT10, so the V2 tail of either keratin of the K1/K10 pair can produce
    this phenotype.
  genes:
  - preferred_term: KRT1
    term:
      id: hgnc:6412
      label: KRT1
  evidence:
  - reference: PMID:29689068
    reference_title: "Role of the keratin 1 and keratin 10 tails in the pathogenesis of ichthyosis hystrix of Curth Macklin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ichthyosis Hystrix of Curth-Macklin (IH-CM) is a rare manifestation of epidermolytic ichthyosis (EI) that is characterised by generalised spiky or verrucous hyperkeratosis."
    explanation: Confirms IH-CM as a rare EI variant with distinctive verrucous hyperkeratosis.
- name: Annular Epidermolytic Ichthyosis
  display_name: Annular Epidermolytic Ichthyosis / Cyclic Ichthyosis
  subtype_term:
    preferred_term: KRT1-associated annular epidermolytic ichthyosis
    term:
      id: MONDO:0859574
      label: ichthyosis, annular epidermolytic, 2
  description: >-
    Distinct phenotype with neonatal erythema and erosions that improve, followed
    by palmoplantar hyperkeratosis and dramatic episodic flares of annular,
    polycyclic erythematous plaques with scale. Flares last weeks to months with
    intervening periods of near-normal skin. Caused by mutations in the 2B domain
    of keratin K1. MONDO splits annular epidermolytic ichthyosis
    (MONDO:0011870) into a KRT10 form, MONDO:0100303, and a KRT1 form,
    MONDO:0859574; this row is the KRT1 form.
  genes:
  - preferred_term: KRT1
    term:
      id: hgnc:6412
      label: KRT1
  inheritance:
  - name: Autosomal dominant inheritance
    description: >-
      Affected members of two reported families carry heterozygous K1 variants at
      a single codon that were absent from unaffected relatives and controls,
      which is the pattern of a dominant allele rather than a recessive one.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:10053007
      reference_title: "Cyclic ichthyosis with epidermolytic hyperkeratosis: A phenotype conferred by mutations in the 2B domain of keratin K1."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both mutations were excluded in both a control population and all unaffected family members tested."
      explanation: Segregation of a heterozygous K1 variant with disease, absent from unaffected relatives and controls, supports a dominant mode; the paper does not name the mode itself.
  evidence:
  - reference: PMID:10053007
    reference_title: "Cyclic ichthyosis with epidermolytic hyperkeratosis: A phenotype conferred by mutations in the 2B domain of keratin K1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three affected individuals exhibit dramatic episodic flares of annular, polycyclic erythematous plaques with scale, which coalesce to involve most of the body surface."
    explanation: Describes the cyclic flaring pattern that distinguishes this subtype from classic EI.
- name: Epidermolytic PPK
  display_name: Epidermolytic Palmoplantar Keratoderma (Vorner Type)
  subtype_term:
    preferred_term: KRT1-associated epidermolytic palmoplantar keratoderma
    term:
      id: MONDO:0957303
      label: palmoplantar keratoderma, epidermolytic, 2
  description: >-
    Epidermolytic palmoplantar keratoderma limited to the palms and soles,
    without generalized ichthyosis. Autosomal dominant, caused by KRT1 mutations.
    Historically classified as Vorner type (epidermolytic) vs. Unna-Thost type
    (nonepidermolytic), though re-examination suggests overlap. MONDO splits the
    epidermolytic palmoplantar keratodermas by gene: MONDO:0007758 is the KRT9
    form and MONDO:0957303 the KRT1 form, so this row binds the latter and the
    KRT9 disease belongs to a KRT9 entry.
  genes:

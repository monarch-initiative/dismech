name: KRT1 Keratinopathies
creation_date: "2026-04-04T00:00:00Z"
category: Mendelian
description: >-
  KRT1 keratinopathies are a spectrum of autosomal dominant skin disorders caused
  by heterozygous dominant-negative mutations in the KRT1 gene encoding keratin 1,
  the major type II intermediate filament protein of suprabasal keratinocytes.
  Mutations disrupt keratin filament assembly, leading to tonofilament clumping,
  cytolysis of suprabasal keratinocytes, and epidermolytic hyperkeratosis.
  The phenotypic spectrum ranges from generalized epidermolytic ichthyosis with
  neonatal blistering and erythroderma, through annular/cyclic ichthyosis, to
  isolated epidermolytic palmoplantar keratoderma, and includes the rare
  ichthyosis hystrix of Curth-Macklin. KRT1 mutations are distinguished from
  KRT10 mutations by their frequent association with palmoplantar keratoderma.
disease_term:
  preferred_term: KRT1 keratinopathies
parents:
- keratinopathic ichthyosis
- ichthyosis
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0007239
      label: epidermolytic ichthyosis
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0007239 was previously bound as this entry's disease_term, which
      asserted that an entry scoped to one gene is the whole epidermolytic
      ichthyosis class. MONDO asserts no causal gene on MONDO:0007239, and its
      four direct children are MONDO:0020702 autosomal dominant epidermolytic
      ichthyosis, MONDO:0044742 autosomal recessive epidermolytic ichthyosis,
      MONDO:0700249 epidermolytic hyperkeratosis 1 (KRT1, hgnc:6412) and
      MONDO:0958184 epidermolytic hyperkeratosis 2 (KRT10, hgnc:6413), so the
      class spans both keratin genes and both inheritance modes while this entry
      covers only the KRT1 allelic series. The class is also not a superclass of
      this entry: two of the four subtype rows sit outside it, namely
      MONDO:0007808 ichthyosis hystrix of Curth-Macklin, whose parents are
      MONDO:0017266 keratinopathic ichthyosis and MONDO:0859383 ichthyosis
      hystrix, and MONDO:0957303 palmoplantar keratoderma, epidermolytic, 2,
      whose parent is MONDO:0968949 palmoplantar keratoderma, epidermolytic.
      Synonym-inclusive searches of MONDO through ols:mondo for the strings
      KRT1, keratin, keratin 1 and keratinopathy returned no human class
      denoting this gene's allelic series; the only class named for the gene is
      MONDO:1012893 ichthyosis, KRT1-related, dog, and the nearest human
      groupings, MONDO:0017266 keratinopathic ichthyosis and MONDO:0045011
      keratinization disease, are broader still. The disease_term slot therefore
      carries a free-text preferred term with no binding, and this class is
      recorded as a broad match so that MONDO:0007239 stays in the curation
      queue rather than being retired through this entry.
synonyms:
- bullous congenital ichthyosiform erythroderma
- epidermolytic hyperkeratosis
- bullous ichthyosiform erythroderma

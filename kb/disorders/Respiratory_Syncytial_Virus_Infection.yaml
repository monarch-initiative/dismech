- accession: geo:GSE263272
  title: Human iPS cell-derived respiratory organoids as a model for respiratory syncytial virus infection
  description: Respiratory syncytial virus (RSV) is a seasonal respiratory pathogen that primarily affects young children, potentially causing severe lower respiratory tract disease. Despite the high disease burden, understanding of RSV pathophysiology remains limited. To address this, advanced RSV infection models are needed. While HEp-2 cells are widely used due to their high susceptibility to RSV, they do not accurately reflect the host response of the human respiratory tract.

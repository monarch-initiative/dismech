- accession: geo:GSE77087
  title: Nasopharyngeal microbiota, host transcriptome and disease severity in children with respiratory syncytial virus infection
  description: 'Rationale: Respiratory syncytial virus (RSV) is the leading cause of acute lower respiratory tract infections and hospitalizations in infants worldwide. Known risk factors, however, incompletely explain the variability of RSV disease severity among children. We postulate that severity of RSV infection is influenced in part by modulation of the host immune response by the local microbial ecosystem at the time of infection. Objectives: To define whether different nasopharyngeal microbiota profiles are associated with distinct host transcriptome profiles and severity in children with RSV infection.'

  data_type: WES
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Respiratory Syncytial Virus Infection"); description-level mentions were not accepted. EGA study_type: Exome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

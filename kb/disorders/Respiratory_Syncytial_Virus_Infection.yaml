- accession: ega:EGAS50000001971
  title: TMEM259 alleles modulate respiratory syncytial virus infection and ER-stress-triggered apoptosis
  description: 'Whole Exome Sequencing data for the IRIS1, IRIS2, and IRIS3 cohorts. Abstract: Respiratory syncytial virus (RSV) is a main cause of infant morbidity and mortality. Susceptibility factors for severe RSV bronchiolitis in previously healthy children are unclear. We analyze genetic variants in 5,141 genes involved in virus sensing, interferon (IFN) signaling and effector functions in a population of n=101 previously healthy infants with severe RSV bronchiolitis. Comparing the allele frequencies of the patient cohort with the Exome Aggregation Consortium (ExAC) dataset our analysis reveals 94 non-synonymous coding single nucleotide polymorphisms (SNPs) mapping to 79 potential risk genes.'
  organism:

notes: >-
  Curated as part of a review of Mendelian intellectual disability coverage; the
  disorder was absent from kb/disorders despite being one of the better-known
  recessive ID syndromes. Deliberately curated alongside the chromatinopathy
  work in the same pass as a non-chromatin counterexample: it does NOT conform
  to the `epigenetic_machinery_neurodevelopmental_dysregulation` module, and
  should not be wired to it.

  Prevalence is not curated as a numeric rate. Cohen syndrome is strongly
  enriched in the Finnish population through a founder variant, so a single
  worldwide band would misrepresent it, and no reliable global estimate was
  found in the sources used here.

  The "cheerful and friendly disposition" described in GeneReviews is kept in
  the description as prose and is intentionally not bound to an HP term.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic VPS13B variants are required. Heterozygous parents are
    asymptomatic carriers; sibling recurrence risk is 25%.
  evidence:
  - reference: PMID:20301655
    reference_title: "Cohen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cohen syndrome is inherited in an autosomal recessive manner. If both
      parents are known to be heterozygous for a VPS13B pathogenic variant, each
      sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance
      of being unaffected and not a carrier.
    explanation: >-
      States the inheritance pattern and the recurrence figures used in
      counselling.
genetic:
- name: VPS13B
  gene_term:
    preferred_term: VPS13B
    term:
      id: hgnc:2183
      label: VPS13B
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic pathogenic VPS13B variants cause Cohen syndrome. The gene encodes a
    Golgi-localised bulk lipid-transport protein. Hypomorphic alleles, including
    an in-frame exon-skipping splice variant, produce an attenuated phenotype.
  evidence:
  - reference: PMID:20301655
    reference_title: "Cohen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Cohen syndrome is established in a proband with
      suggestive findings and biallelic pathogenic variants in VPS13B identified
      by molecular genetic testing.
    explanation: >-
      Establishes VPS13B as the causal gene and the biallelic requirement.
  - reference: PMID:34425733
    reference_title: A rare canonical splice-site variant in VPS13B causes attenuated Cohen syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic analysis identified a homozygous rare splice donor variant in the
      VPS13B gene (c.5024+2T>C) that was demonstrated to lead to skipping of the
      in-frame exon 31 (p.Gln1607_Ser1675delinsHis).
    explanation: >-
      Documents the hypomorphic allele underlying the attenuated presentation,
      supporting an allelic range rather than a single uniform phenotype.
pathophysiology:
- name: VPS13B Loss of Function
  description: >-
    Biallelic loss-of-function variation abolishes or severely reduces VPS13B, a
    member of a protein family implicated in bulk lipid transport between
    adjacent membranes.

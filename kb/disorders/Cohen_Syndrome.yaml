  downstream:
  - target: Impaired Golgi Membrane Expansion and Integrity
    causal_link_type: DIRECT

- name: Impaired Golgi Membrane Expansion and Integrity
  description: >-
    VPS13B is concentrated at the interface between cis and trans Golgi
    sub-compartments, where its lipid-transport activity is thought to supply
    membrane for Golgi expansion. In VPS13B-null cells, re-formation of the Golgi
    complex after Brefeldin A-induced disruption is delayed - a direct functional
    demonstration that the organelle depends on VPS13B. The same delay follows
    loss of FAM177A1, a VPS13B interactor whose own mutations also cause a
    developmental disorder, and the two genes interact genetically in zebrafish.
  role: central_effector
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:38187698
    reference_title: "VPS13B is localized at the cis-trans Golgi complex interface and is a functional partner of FAM177A1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that VPS13B is localized at the interface between cis and
      trans Golgi sub-compartments and that Golgi complex re-formation after
      Brefeldin A (BFA) induced disruption is delayed in VPS13B KO cells.
    explanation: >-
      The core mechanistic observation: precise sub-Golgi localisation plus a
      functional deficit in Golgi re-formation when VPS13B is absent.
  - reference: PMID:38187698
    reference_title: "VPS13B is localized at the cis-trans Golgi complex interface and is a functional partner of FAM177A1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, these findings raise the possibility that bulk lipid
      transport by VPS13B may play a role in expanding Golgi membranes
    explanation: >-
      States the mechanistic interpretation. Note the authors' own hedging
      ("raise the possibility", "may") - this node is a well-supported model, not
      a settled mechanism.
  downstream:
  - target: Defective Glycosylation and Secretory Output
    causal_link_type: DIRECT
  - target: Adipocyte Insulin-Response Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Defective Glycosylation and Secretory Output
  description: >-
    Golgi dysfunction impairs the glycosylation and secretory processing that the
    organelle performs. Because every affected tissue depends on Golgi-dependent
    processing, this is the step that converts a single lipid-transport defect
    into a multisystem phenotype spanning brain, retina and marrow. No cell type
    is bound to this node: the sources cited here establish the glycosylation
    defect but not the mechanism linking it to any particular lineage, and in
    particular the route from Golgi dysfunction to the near-universal
    neutropenia is not established, so neutropenia is curated as a phenotype
    rather than as a mechanistic claim at this node.
  role: effector
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:26358774
    reference_title: Insulin response dysregulation explains abnormal fat storage and increased risk of diabetes mellitus type 2 in Cohen Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cohen Syndrome (CS) is a rare autosomal recessive disorder, with defective
      glycosylation secondary to mutations in the VPS13B gene, which encodes a
      protein of the Golgi apparatus.
    explanation: >-
      States the glycosylation defect and attributes it to the Golgi localisation
      of VPS13B, which is the edge into this node.
  downstream:
  - target: Multisystem Developmental and Haematologic Phenotype
    causal_link_type: DIRECT

- name: Adipocyte Insulin-Response Dysregulation
  description: >-
    A tissue-specific branch explaining the syndrome's most counterintuitive
    feature - truncal obesity appearing in the early teens without any increase
    in appetite or intake. Loss of VPS13B in pre-adipocytes and in patient
    fibroblasts accelerates adipogenic differentiation through an increased
    response to insulin stimulation; the resulting fat cells then show reduced
    AKT2 phosphorylation after insulin, i.e. insulin resistance. This makes the
    obesity a cell-intrinsic adipocyte phenotype rather than a hypothalamic
    appetite phenotype, and grounds the increased type 2 diabetes risk.
  role: effector
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:26358774
    reference_title: Insulin response dysregulation explains abnormal fat storage and increased risk of diabetes mellitus type 2 in Cohen Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In both models, VPS13B invalidation led to accelerated differentiation into
      fat cells, which was confirmed by the earlier and increased expression of
      specific adipogenic genes, consequent to the increased response of cells to
      insulin stimulation.
    explanation: >-
      Direct experimental support in two independent models for accelerated,
      insulin-driven adipogenesis on VPS13B loss.
  - reference: PMID:26358774
    reference_title: Insulin response dysregulation explains abnormal fat storage and increased risk of diabetes mellitus type 2 in Cohen Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      At the end of the differentiation protocol, these fat cells exhibited
      decreased AKT2 phosphorylation after insulin stimulation, which suggests
      insulin resistance.
    explanation: >-
      Supports the insulin-resistance arm of this node. Note the source's own
      hedge - it reports decreased AKT2 phosphorylation and says this
      "suggests" insulin resistance; the increased type 2 diabetes risk is the
      paper's broader argument and is not asserted by this sentence.
  downstream:
  - target: Multisystem Developmental and Haematologic Phenotype
    causal_link_type: DIRECT

- name: Multisystem Developmental and Haematologic Phenotype
  description: >-
    The clinical output: hypotonia with developmental delay and
    moderate-to-profound intellectual disability, the biphasic growth trajectory
    ending in truncal obesity with short stature, progressive myopia and retinal
    dystrophy, near-universal neutropenia with its infection risk, and joint
    laxity leading to kyphosis and scoliosis.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20301655
    reference_title: "Cohen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cohen syndrome is characterized by early-onset hypotonia, developmental
      delay, and moderate-to-profound intellectual disability; at least 20% of
      individuals are unable to communicate verbally.
    explanation: >-
      States the neurodevelopmental output and quantifies the most severe
      communication outcome.

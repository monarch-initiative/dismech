name: Cohen Syndrome
creation_date: "2026-08-22T19:30:00Z"
category: Genetic
synonyms:
- COH1
- Pepper syndrome
- VPS13B-related Cohen syndrome
description: >
  Cohen syndrome is an autosomal recessive multisystem disorder caused by
  biallelic pathogenic variants in VPS13B, and it is the classic example of an
  intellectual disability syndrome whose mechanism is **not** chromatin,
  synaptic or metabolic but **intracellular membrane biology**. VPS13B belongs
  to a family of bulk lipid-transport proteins acting at membrane contact sites;
  it is concentrated in the Golgi complex, specifically at the interface between
  the cis and trans Golgi sub-compartments, and Golgi re-formation after
  pharmacological disruption is delayed in VPS13B-null cells. The unifying
  hypothesis is that Golgi membrane expansion and hence Golgi-dependent
  glycosylation and secretion fail, which is why a single gene produces a
  phenotype spanning brain, retina, marrow and adipose tissue.

  Clinically the syndrome has an unusually specific and recognisable
  constellation: early-onset hypotonia with developmental delay and
  moderate-to-profound intellectual disability - at least a fifth of affected
  individuals never communicate verbally; a **biphasic growth trajectory** in
  which poor weight gain from feeding difficulty in infancy and childhood gives
  way in the early teens to rapid truncal weight gain that occurs without any
  change in appetite, food intake or activity; progressive high myopia and
  retinal dystrophy beginning in early childhood; and a mild-to-moderate
  neutropenia present in almost all affected individuals, which can bring
  recurrent infections and aphthous ulceration.

  Two curation points are worth stating plainly. First, the teenage weight gain
  is explicitly **not** hyperphagic, which distinguishes Cohen syndrome from
  Prader-Willi syndrome, its main differential; supporting cell work finds
  accelerated adipogenic differentiation and an increased response to insulin
  when VPS13B is lost, so the obesity is curated as a cell-intrinsic adipocyte
  phenotype rather than as an appetite phenotype. Second, a cheerful and
  friendly disposition is a described part of the phenotype but is deliberately
  left as prose here rather than bound to an ontology term, because it is a
  clinical gestalt impression rather than a measurable finding.

  The disorder shows allelic range: a hypomorphic splice variant has been
  reported to produce attenuated Cohen syndrome with normal appearance, stature
  and head size, in which retinal dystrophy, obesity and mild cognitive
  impairment were the presenting features. Absence of microcephaly or the
  characteristic facies therefore does not exclude the diagnosis.

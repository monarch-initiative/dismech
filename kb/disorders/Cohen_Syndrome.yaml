differential_diagnoses:
- name: Prader-Willi syndrome
  description: >-
    The principal differential for the combination of infantile hypotonia, poor
    early feeding, intellectual disability and later truncal obesity. The
    discriminator is appetite: in Cohen syndrome the teenage weight gain occurs
    without any change in appetite or food intake, whereas Prader-Willi obesity
    is driven by hyperphagia. Neutropenia and retinal dystrophy also point to
    Cohen syndrome.
  evidence:
  - reference: PMID:20301655
    reference_title: "Cohen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the early teen years rapid weight gain (without a change in
      appetite, food intake, or activity) leads to significant truncal obesity
    explanation: >-
      Supplies the discriminating feature - non-hyperphagic weight gain - on
      which this differential turns.

    explanation: >-
      Human CRISPR-edited I79N hiPSC-cardiomyocyte evidence directly linking
      the TNNT2-mutant calcium-handling defect to an electrophysiological
      arrhythmia substrate.
  - reference: PMID:34977031
    reference_title: "Mechanisms of Arrhythmogenicity of Hypertrophic Cardiomyopathy-Associated Troponin T (TNNT2) Variant I79N."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While wild-type (WT) hiPSC-CMs were accurately entrained to frequencies

      A novel cardiac troponin T gene mutation, arginine 92 tryptophan, was
      identified in 19 of 48 members of two affected pedigrees.
    explanation: >-
      Independent confirmation of a second missense allele at the codon 92
      hotspot cosegregating with disease in two large pedigrees.
  - reference: CGGV:assertion_ef922dc4-4e41-422b-ac3d-605fea375005-2021-02-04T050000.000Z
    reference_title: "TNNT2 / hypertrophic cardiomyopathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNT2 | HGNC:11949 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Moderate
    explanation: >-
      ClinGen classifies the TNNT2-hypertrophic cardiomyopathy gene-disease
      relationship as Moderate.
  - reference: PMID:40310325
    reference_title: The p.Asn271Ile Variant in the TNNT2 Gene Is Associated With Low-Risk Late-Onset Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late-onset HCM and incomplete age-related penetrance were observed
      (estimated median diagnosis age 60.1 years). ... Codon 92 variants'
      carriers (76 individuals, 28 probands) had a higher penetrance, being
      diagnosed 19.4 years earlier, and they exhibited a significantly worse
      prognosis (primary endpoint in 34.3%; P < 0.001).
    explanation: >-
      Documents that TNNT2 genotype-phenotype correlation must be made at the
      allele level: the founder variant p.Asn271Ile is low-risk and
      late-onset, in direct contrast to the malignant codon-92 hotspot
      variants that define the classic CMH2 phenotype.
  notes: >-
    Disease-associated TNNT2 variants for CMH2 are overwhelmingly missense and
    concentrate in the tropomyosin-binding N-terminal and central regions of
    cardiac troponin T, with codon 92 (Arg92Gln, Arg92Trp, Arg92Pro/Leu) as the
    best-characterized hotspot for the malignant, minimal-hypertrophy
    phenotype. Other alleles cited in this entry with human genotype-phenotype
    data: Ile79Asn, K280N (reported homozygous), E163R, and the low-risk
    founder variant p.Asn271Ile. A splice-donor mutation in intron 15,
    predicted to act as a null allele, was among the original TNNT2 alleles
    reported and was used to argue that abnormal sarcomeric protein
    stoichiometry, not only a poison-peptide mechanism, can produce the
    phenotype.
mechanistic_hypotheses:
- hypothesis_group_id: tnnt2_calcium_sensitization_uncoupling
  hypothesis_label: Myofilament calcium sensitization with loss of PKA-mediated desensitization
  status: CANONICAL
  description: >-
    The canonical model of CMH2 is that HCM-associated TNNT2 variants are
    incorporated into the thin filament as poison peptides that increase
    myofilament calcium sensitivity - a near-universal finding across the
    disease-associated alleles studied to date, from the founder R92Q mutation
    in transgenic mice to recombinant and patient-derived troponin carrying
    K280N, DeltaE160, S179F, and other substitutions. A second, recurring
    feature specific to several TNNT2 (and other thin-filament) HCM mutations
    is "uncoupling": normal cardiac troponin I phosphorylation by protein
    kinase A lowers myofilament calcium sensitivity as part of the lusitropic
    (relaxation-enhancing) response to adrenergic stimulation, but mutant
    troponin T blunts or abolishes this modulation, removing a physiological
    brake on calcium sensitivity precisely when it is most needed.
  evidence:
  - reference: PMID:27036851
    reference_title: Mutations in troponin T associated with Hypertrophic Cardiomyopathy increase Ca(2+)-sensitivity and suppress the modulation of Ca(2+)-sensitivity by troponin I phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The R92Q TnT mutation in troponin from transgenic mouse increased
      Ca(2+)-sensitivity and was also completely uncoupled.
    explanation: >-
      Directly demonstrates both halves of the canonical mechanism - increased
      calcium sensitivity and uncoupling from troponin I phosphorylation - for
      the founding R92Q CMH2 allele.
  - reference: PMID:37159677
    reference_title: Low expression of the K280N TNNT2 mutation is sufficient to increase basal myofilament activation in human hypertrophy cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Myofilament Ca2+-sensitivity was higher in homozygous cTnT-K280N
      cardiomyocytes and was not corrected by AP- and PKA-treatment. ... A low
      level (14%) of the cTnT-K280N sensitizes myofilaments to Ca2+, a
      universal finding of human HCM.
    explanation: >-
      Human explanted-myocardium and isogenic hiPSC-cardiomyocyte study
      showing that even a low mutant protein fraction (14%) is sufficient to
      raise calcium sensitivity, and that PKA treatment does not correct it -
      corroborating the uncoupling component of the mechanism directly in
      human tissue rather than only in transgenic mice.
- hypothesis_group_id: tnnt2_variant_specific_ec_coupling_divergence
  hypothesis_label: Mutation-specific balance between myofilament and excitation-contraction coupling remodeling
  status: ALTERNATIVE
  description: >-
    A second, complementary account holds that the relative contribution of
    primary myofilament dysfunction versus secondary excitation-contraction
    (E-C) coupling remodeling to the CMH2 phenotype is mutation-specific rather
    than uniform across the gene. In paired mouse models, the R92Q allele
    produced comparatively modest myofilament-level sarcomeric changes beyond
    calcium sensitization but profound secondary E-C coupling remodeling
    (blunted inotropic reserve, slowed calcium-transient decay, reduced SERCA
    function, increased CaMKII activity), whereas the E163R allele produced
    prominent primary myofilament abnormalities (altered sarcomere energetics,
    elevated resting tension) with comparatively preserved calcium handling.
    Both alleles converge on diastolic dysfunction and arrhythmogenicity, but
    by different routes, with implications for which class of therapy -
    sarcomere-targeting versus ion-channel/calcium-targeting - is mechanistically
    matched to a given carrier's genotype.
  evidence:
  - reference: PMID:28735292
    reference_title: "Pathogenesis of Hypertrophic Cardiomyopathy is Mutation Rather Than Disease Specific: A Comparison of the Cardiac Troponin T E163R and R92Q Mouse Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In R92Q myocardium, we found a blunted response to inotropic
      interventions, slower decay of Ca2+ transients, reduced SERCA function,
      and increased Ca2+/calmodulin kinase II activity. Contrarily, secondary
      alterations of E-C coupling and signaling were minimal in E163R
      myocardium.
    explanation: >-
      States the divergence explicitly: the R92Q model is dominated by
      excitation-contraction coupling remodeling while the E163R model is
      dominated by primary myofilament energetic abnormalities, both producing
      the shared HCM phenotype by different molecular routes.
  - reference: PMID:11600691
    reference_title: "Cardiac troponin T mutations: correlation between the type of mutation and the nature of myofilament dysfunction in transgenic mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data indicate that an important mutation-linked effect on cardiac
      function is the result of an inefficient use of ATP at the myofilament
      level. Furthermore, the extent of the mutation-induced dysfunction
      depends not only on the nature of the mutation, but also on the
      concentration of the mutant protein in the sarcomere.
    explanation: >-
      Independent transgenic-mouse evidence that both which TNNT2 mutation is
      present and how much mutant protein is expressed determine the nature
      and severity of myofilament dysfunction. PARTIAL because it documents
      dose- and mutation-dependence in general rather than the specific
      myofilament/E-C-coupling divergence claimed by the R92Q/E163R
      comparison.
pathophysiology:
- name: Cardiac Troponin T Thin Filament Regulatory Defect
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TNNT2 encodes cardiac troponin T, which anchors the troponin complex to
    tropomyosin on the thin filament and couples calcium binding by troponin C
    to the azimuthal movement of tropomyosin that exposes or occludes the
    myosin-binding sites on actin. Disease-associated TNNT2 missense variants
    concentrate in the tropomyosin-binding region, most classically Arg92Gln
    and Arg92Trp, and act as dominant poison peptides that are incorporated
    into the thin filament - even at low mutant fraction - rather than acting
    through simple loss of protein. This is the primary cardiomyocyte insult of
    CMH2.

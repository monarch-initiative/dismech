diagnosis:
- name: Genotype-Informed Risk Stratification and Cascade Genetic Testing
  description: >-
    Because the malignant TNNT2 alleles that define CMH2 can produce a high
    risk of sudden cardiac death despite mild or subclinical hypertrophy,
    wall-thickness-based risk stratification alone is insufficient for these
    families; genetic testing to establish TNNT2 genotype, and cascade testing
    of relatives, is emphasized for management and counselling. Risk
    assessment must additionally be made at the level of the specific variant,
    since not every TNNT2 allele (for example the low-risk founder variant
    p.Asn271Ile) carries the malignant phenotype. General hypertrophic
    cardiomyopathy management - beta-blockers, mavacamten and other cardiac
    myosin inhibitors, ICD implantation for high-risk carriers, and septal
    reduction therapy for outflow obstruction - is curated on the umbrella
    Hypertrophic Cardiomyopathy entry and is not duplicated here.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Identifies a pathogenic TNNT2 variant and its specific allele
  evidence:
  - reference: PMID:7898523
    reference_title: Mutations in the genes for cardiac troponin T and alpha-tropomyosin in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations are characterized by relatively mild and sometimes
      subclinical hypertrophy but a high incidence of sudden death. Genetic
      testing may therefore be especially important in this group.
    explanation: >-
      States directly that genetic testing is especially valuable for TNNT2
      carriers because clinical (wall-thickness) risk markers understate the
      true risk.
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because this is one of poor prognosis, despite deceptively mild or
      undetectable hypertrophy, genotyping at this locus may be particularly
      informative in patient management and counselling.
    explanation: >-
      Independent recommendation that genotyping at the TNNT2 locus is
      particularly informative for management and counselling, corroborating
      the rationale for genotype-informed rather than imaging-only risk
      assessment.
  - reference: PMID:40310325
    reference_title: The p.Asn271Ile Variant in the TNNT2 Gene Is Associated With Low-Risk Late-Onset Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variant-specific rather than gene-specific prognosis should be
      considered during sudden cardiac death risk assessment.
    explanation: >-
      Supports the variant-level (not gene-level) granularity required for
      TNNT2 risk counselling, since a low-risk founder variant coexists with
      the malignant codon-92 hotspot within the same gene.
  notes: >-
    Curated under `diagnosis:` rather than `treatments:` - it is a diagnostic
    and risk-stratification procedure, not a therapy. The entry carries no
    `treatments:` section by design: every therapeutic option for CMH2
    (beta-blockers, cardiac myosin inhibitors, ICD, septal reduction) is
    cross-gene HCM management curated on the umbrella entry, and duplicating
    it per gene was a deliberate lumping call (see the scope note below).

    The wider diagnostic workup - echocardiographic and CMR wall-thickness
    criteria, late gadolinium enhancement, ECG and ambulatory monitoring - is
    not modeled here because neither cached reference that would source it is
    minable: PMID:38718139 caches as an abstract-only AIM/METHODS/STRUCTURE
    stub with no criteria in it, and the GeneReviews chapter PMID:20301725
    caches as its purpose statement alone. Adding those procedures would
    require citations not currently in this PR's reference cache.


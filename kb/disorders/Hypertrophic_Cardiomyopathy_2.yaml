    snippet: >-
      The mean (+/- SD) maximal thickness of the left ventricular wall in
      subjects with cardiac troponin T mutations (16.7 +/- 5.5 mm) was
      significantly less than that in subjects with beta cardiac myosin
      heavy-chain mutations (23.7 +/- 7.7 mm, P < 0.001).
    explanation: >-
      Directly quantifies the milder hypertrophy in TNNT2 mutation carriers
      compared with MYH7 mutation carriers in the same cohort.
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      maximal ventricular wall thickness 11.3 +/- 5.4 mm) and low disease
      penetrance by clinical criteria (40% by echocardiography)
    explanation: >-
      Independent pedigree confirmation of minimal hypertrophy on
      echocardiography in gene carriers of the Arg92Trp allele.
  downstream:

    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  frequency: FREQUENT
  evidence:
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ... a high incidence of sudden cardiac death (mean age 17 +/- 9 years).

    reference_title: "Alpha-tropomyosin and cardiac troponin T mutations cause familial hypertrophic cardiomyopathy: a disease of the sarcomere."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense mutations (Ile79Asn; Arg92Gln) and a mutation in the splice
      donor sequence of intron 15 of the cardiac troponin T gene are also
      shown to cause FHC.
    explanation: >-
      Founding demonstration that TNNT2 missense mutations cause familial
      hypertrophic cardiomyopathy.
- name: Left Ventricular Hypertrophy, Often Mild
  description: >-
    Increased left ventricular wall thickness that, in carriers of malignant
    TNNT2 alleles such as the codon-92 hotspot, is frequently only mildly or

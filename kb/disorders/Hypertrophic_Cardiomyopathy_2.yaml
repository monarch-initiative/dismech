name: Hypertrophic Cardiomyopathy 2
creation_date: "2026-08-17T00:00:00Z"
synonyms:
- CMH2
- TNNT2 hypertrophic cardiomyopathy
- hypertrophic cardiomyopathy caused by mutation in TNNT2
- hypertrophic cardiomyopathy type 2
- cardiomyopathy, hypertrophic, 2
- cardiomyopathy, familial hypertrophic, type 2
- familial hypertrophic cardiomyopathy type 2
description: >-
  Hypertrophic cardiomyopathy 2 (CMH2) is the TNNT2-related form of familial
  hypertrophic cardiomyopathy. TNNT2 encodes cardiac troponin T (cTnT), the
  tropomyosin-binding subunit of the heterotrimeric troponin complex that,
  together with troponin C and troponin I, transduces the calcium signal into
  tropomyosin movement and crossbridge cycling on the thin filament. TNNT2 was
  one of the two genes, together with TPM1, whose 1994 discovery established
  hypertrophic cardiomyopathy as a disease of the sarcomere, and cardiac
  troponin T mutations accounted for roughly 15% of familial HCM in the
  founding referral-centre cohort. CMH2 is molecularly and clinically
  distinctive among the sarcomeric HCM series: disease-associated variants,
  most classically Arg92Gln/Trp/Pro in the tropomyosin-binding domain, act as
  dominant "poison peptides" that sensitize the thin filament to calcium and
  are incorporated whether the carrier is asymptomatic or not. The clinical
  signature that follows is the "malignant but mild" phenotype first described
  for the Arg92 hotspot: left ventricular wall thickness is frequently only
  mildly or subclinically increased, yet the incidence of sudden cardiac death
  is disproportionately high relative to the degree of hypertrophy, making
  genotype-informed risk assessment - rather than wall-thickness measurement
  alone - especially important for carriers of these variants. Not every TNNT2
  allele follows this pattern: variant-specific studies (for example the founder
  variant p.Asn271Ile) show that some TNNT2 alleles instead produce late-onset,
  low-risk disease, so genotype-phenotype correlation in CMH2 is stated at the
  level of the individual variant rather than the gene as a whole.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A previous report suggested that mutations in the cardiac troponin T
      gene were notable because they were associated with a particularly poor
      prognosis but only mild hypertrophy.
    explanation: >-
      Documents the poor overall prognosis of TNNT2 mutation carriers, of

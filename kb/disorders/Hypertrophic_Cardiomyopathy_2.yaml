prevalence:
- population: Familial hypertrophic cardiomyopathy referral cohorts
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the TNNT2-specific form
    of hypertrophic cardiomyopathy. What is documented is the share of HCM
    cases attributable to TNNT2, which is a minority but larger than most other
    non-MYH7/MYBPC3 sarcomere genes: roughly 15% of familial cases in the
    founding referral-centre survey. The population occurrence of hypertrophic
    cardiomyopathy as a whole (about 1 in 500) is curated on the umbrella
    Hypertrophic Cardiomyopathy entry and is not duplicated here.
  evidence:
  - reference: PMID:7898523
    reference_title: Mutations in the genes for cardiac troponin T and alpha-tropomyosin in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in cardiac troponin T account for approximately 15 percent of
      cases of familial hypertrophic cardiomyopathy in this referral-center
      population.
    explanation: >-
      Quantifies the TNNT2 share of familial HCM cases in the founding
      referral-centre cohort.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMH2 is transmitted as an autosomal dominant trait. ClinGen's Hereditary
    Cardiovascular Disease Gene Curation Expert Panel classifies the
    TNNT2-hypertrophic cardiomyopathy relationship as Moderate with autosomal
    dominant inheritance (an older, 2021 SOP7 curation, in contrast to the
    Definitive classifications now recorded for MYH7, MYBPC3, and TPM1 - see
    notes). Penetrance by echocardiographic criteria is incomplete and lower
    than for MYH7, and disease-associated variants are frequently incorporated
    into the sarcomere while producing only mild or subclinical hypertrophy,
    which is itself part of the CMH2 phenotype rather than evidence against
    pathogenicity.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: CGGV:assertion_ef922dc4-4e41-422b-ac3d-605fea375005-2021-02-04T050000.000Z
    reference_title: "TNNT2 / hypertrophic cardiomyopathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TNNT2 | HGNC:11949 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Moderate
    explanation: >-
      ClinGen's Hereditary Cardiovascular Disease GCEP records autosomal
      dominant inheritance for the TNNT2-hypertrophic cardiomyopathy
      relationship with Moderate clinical validity.
  - reference: PMID:32731933
    reference_title: Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 15 years follow-up, estimated HCM penetrance by causal gene was as
      follows: MYBPC3 43% (95% CI: 32% to 57%), MYH7 66% (95% CI: 47% to 83%),
      TNNI3 17% (95% CI: 7% to 39%), TNNT2 50% (95% CI: 30% to 74%), TPM1 42%
      (95% CI: 11% to 92%)
    explanation: >-
      Gene-specific penetrance estimate for TNNT2 (50% at 15 years). Quoted
      with its full confidence interval, which overlaps every other gene in the
      table, so the point estimate should not be counselled as sharply
      distinguishing TNNT2 from the other sarcomere genes.
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      maximal ventricular wall thickness 11.3 +/- 5.4 mm) and low disease
      penetrance by clinical criteria (40% by echocardiography) but a high
      incidence of sudden cardiac death (mean age 17 +/- 9 years).
    explanation: >-
      Direct pedigree-level statement of low echocardiographic penetrance
      combined with minimal hypertrophy for the Arg92Trp founder variant,
      establishing that low penetrance by imaging is a feature of CMH2 rather
      than an artifact of ascertainment.
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance varied from ≈32% for MYL3 (myosin light chain 3) to ≈55% for
      MYBPC3 (myosin-binding protein C3), ≈60% for TNNT2 (troponin T2) and
      TNNI3 (troponin I3), and ≈65% for MYH7 (myosin heavy chain 7).
    explanation: >-
      A contemporary, larger meta-analytic estimate of TNNT2 penetrance in
      cascade-screened relatives (~60%), corroborating the earlier
      PMID:32731933 estimate (50% at 15 years) with a substantially larger
      evidence base (455 manuscripts assessed) and placing TNNT2 penetrance
      between MYBPC3 and MYH7 among the sarcomere genes.

    causal_link_type: DIRECT

- name: Cardiomyocyte Hypercontractility and Energetic Inefficiency
  biological_scale: CELLULAR
  role: effector
  description: >-
    The calcium-sensitized, uncoupled thin filament produces cardiomyocyte
    hypercontractility with a disproportionate rise in the energetic cost of
    tension generation: mutant fibres develop increased force per unit calcium
    but consume ATP inefficiently relative to the tension produced, and the
    magnitude of this energetic penalty scales with the fraction of mutant
    protein incorporated into the sarcomere. Downstream, mutation-specific
    secondary changes in excitation-contraction coupling (blunted inotropic
    reserve, slowed calcium-transient decay, altered SERCA function and
    CaMKII activity for the R92Q allele) compound the primary myofilament
    lesion, so cellular dysfunction in CMH2 is not attributable to the
    thin-filament defect alone.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: INCREASED
  - preferred_term: ATP metabolic process
    term:
      id: GO:0046034
      label: ATP metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11600691
    reference_title: "Cardiac troponin T mutations: correlation between the type of mutation and the nature of myofilament dysfunction in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At short SL, Ca2+-activated maximal tension in both R92Q and cTnT(DEL)
      fibres decreased significantly (24 and 21 %, respectively; P < 0.005),
      with no corresponding decrease in Ca2+-activated maximal ATPase
      activity. Therefore, at short SL, the tension cost in R92Q and
      cTnT(DEL) fibres increased by 35 and 29 %, respectively (P < 0.001).
    explanation: >-
      Quantifies the energetic inefficiency directly: ATP turnover is
      maintained while force generation falls, raising the tension cost of
      contraction in both TNNT2 mutant fibre types studied.
  - reference: PMID:28735292
    reference_title: "Pathogenesis of Hypertrophic Cardiomyopathy is Mutation Rather Than Disease Specific: A Comparison of the Cardiac Troponin T E163R and R92Q Mouse Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Echocardiography showed left ventricular hypertrophy, enhanced
      contractility, and diastolic dysfunction in both models; however, these
      phenotypes were more pronounced in the R92Q mice.
    explanation: >-
      Documents enhanced (hypercontractile) function and diastolic
      dysfunction in both TNNT2 mouse models, with the R92Q allele showing the
      more severe phenotype.
  - reference: PMID:37159677
    reference_title: Low expression of the K280N TNNT2 mutation is sufficient to increase basal myofilament activation in human hypertrophy cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The cTnT-K280N mutation increases myofilament Ca2+-sensitivity,
      elevates diastolic Ca2+, enhances contractility and impairs cellular
      relaxation.
    explanation: >-
      Human patient-derived and isogenic hiPSC-cardiomyocyte confirmation that
      the calcium-sensitized thin filament produces cellular hypercontractility
      with impaired relaxation.
  downstream:
  - target: Cardiomyocyte Hypertrophy with Disarray and Fibrosis, Often Disproportionately Mild
    causal_link_type: DIRECT

- name: Cardiomyocyte Hypertrophy with Disarray and Fibrosis, Often Disproportionately Mild
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Chronic myofilament hypercontractility and calcium-dependent hypertrophic
    signaling drive cardiomyocyte hypertrophy, myofiber disarray, and
    interstitial fibrosis, the histological substrate common to hypertrophic
    cardiomyopathy generally. The distinguishing feature of CMH2 is that this
    remodeling is frequently mild or subclinical on echocardiography relative
    to carriers of MYH7 variants, even though the underlying myofilament
    defect and downstream arrhythmic risk are severe - the wall-thickness
    measurement systematically understates disease severity for many TNNT2
    alleles.
  cell_types:

- name: Beat-to-Beat Calcium and Electrophysiological Instability
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Because the calcium-sensitized thin filament buffers cytosolic calcium
    more avidly, the beat-to-beat cytosolic calcium transient is reduced and
    its decay altered, which destabilizes cardiomyocyte electrophysiology
    independent of any structural change. In human CRISPR-edited I79N hiPSC
    cardiomyocytes and in transgenic I79N/F110I/R278C mouse hearts, this
    manifests as beat-to-beat instability, action potential triangulation, and
    - at increasing pacing frequency - alternans of both membrane voltage and
    calcium transients, together with increased dispersion of ventricular
    conduction velocity. This electrophysiological branch is the direct
    mechanistic link between the calcium-handling lesion and the malignant
    arrhythmic phenotype, distinct from and largely independent of the degree
    of structural hypertrophy.

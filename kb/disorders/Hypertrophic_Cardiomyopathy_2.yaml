- reference: PMID:38718139
  title: "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
notes: >-
  Scope note: this entry is the TNNT2 gene-specific entity (MONDO:0007266), not
  the HCM umbrella. The umbrella entry Hypertrophic_Cardiomyopathy
  (MONDO:0005045) carries the cross-gene phenotype and treatment picture
  (mavacamten, beta-blockers, ICD implantation, septal reduction therapy);
  content here is deliberately restricted to what is specific to TNNT2
  thin-filament biology and to the malignant-but-mild genotype-phenotype pattern
  that most distinguishes CMH2 from the other numbered CMH entries.

  ClinGen classification note: the TNNT2-hypertrophic cardiomyopathy
  gene-disease validity assertion
  (CGGV:assertion_ef922dc4-4e41-422b-ac3d-605fea375005-2021-02-04T050000.000Z)
  is classified Moderate under the older
  SOP7 framework (2021), in contrast to the Definitive classifications now
  recorded for MYH7, MYBPC3, and TPM1 under SOP9. This is a curation-vintage
  artifact, not a statement that TNNT2 causality is weaker than the founding
  1994 discovery and the extensive subsequent genotype-phenotype literature
  would suggest; it is recorded here rather than silently upgraded.

  Named Entity Confusion (NEC) preflight: the CMH numbered series is a
  documented high-NEC-risk class (numbered disease-by-gene series). The
  requested falcon (Edison) deep-research provider was run
  (research/Hypertrophic_Cardiomyopathy_2-deep-research-falcon.md, reference
  validation: 11/11 references resolved, 0 confabulated) and
  `just preflight-dr research/Hypertrophic_Cardiomyopathy_2-deep-research-falcon.md
  MONDO:0007266` was run before any of its content was used for curation.
  Automated verdict was SKIP (MONDO:0007266 records no RO:0004003 causal-gene
  relationship for the automated gene-identity check to key on, even though the
  earlier `runoak ... -O obo` lookup used to source this entry's disease_term
  does show that relationship), so the manual fallback in the SOP was applied:
  gene check - TNNT2 dominates the report's gene mentions (89 occurrences versus
  4 each for NPPA/NPPB, the next most frequent); OMIM check - the report's
  cited OMIM (115195) matches the MONDO xref exactly; synonym check - the
  report's own framing statement explicitly disambiguates CMH2/TNNT2 from other
  TNNT2-associated phenotypes (dilated cardiomyopathy, left ventricular
  noncompaction) rather than conflating them. All three checks passed, so the
  report was used as a lead-generation source. Three PMIDs it surfaced were
  independently verified and incorporated: PMID:37929589 (a larger,
  contemporary penetrance meta-analysis corroborating PMID:32731933),
  PMID:34977031 (human iPSC-cardiomyocyte and transgenic-mouse evidence for the
  electrophysiological arrhythmia mechanism, added as its own pathophysiology
  node), and the report's TNNT2 case-fraction and hotspot-variant framing, which
  matched what independent PubMed search had already produced. All PMIDs cited
  in this entry - both those the report surfaced and those found independently
  via PubMed search - were fetched with `just fetch-reference` and every
  snippet was verified against the cached abstract; none were taken from the
  report's own quotes without independent re-verification against the primary
  source.

  Unsourced/limited-evidence items intentionally omitted: no population-based
  prevalence for the TNNT2-specific entity exists, so prevalence is recorded
  as NOT_YET_DOCUMENTED rather than estimated. The 2024 AHA/ACC guideline
  (PMID:38718139) is carried in the top-level references for provenance but is
  deliberately not mined for an evidence snippet, because its cached PubMed
  record contains only AIM/METHODS/STRUCTURE sections with no quotable
  clinical recommendation text - the same limitation noted on the sibling
  Hypertrophic_Cardiomyopathy_4 entry. Mavacamten and other genotype-agnostic
  HCM pharmacotherapy are left to the umbrella entry rather than duplicated
  here without TNNT2-specific mechanistic evidence.

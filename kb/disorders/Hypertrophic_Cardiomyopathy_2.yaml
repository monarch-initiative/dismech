  description: >-
    The defining phenotype of CMH2: unexplained left ventricular hypertrophy,
    which is frequently only mild or subclinical relative to the underlying
    disease severity in carriers of malignant TNNT2 alleles.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Echocardiography showed left ventricular hypertrophy, enhanced
      contractility, and diastolic dysfunction in both models
    explanation: >-
      Echocardiographic demonstration of diastolic dysfunction in both TNNT2
      mouse models studied.
- name: Ventricular Arrhythmia
  description: >-
    Malignant ventricular arrhythmia - the clinical event that the
    arrhythmogenic substrate produces and that precedes sudden cardiac death
    in CMH2. Its burden is strongly variant-dependent within TNNT2: it is the
    dominant component of the adverse-outcome endpoint in the low-risk
    p.Asn271Ile founder cohort and is far more frequent in codon-92 carriers.
  phenotype_term:
    preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  evidence:
  - reference: PMID:40310325
    reference_title: The p.Asn271Ile Variant in the TNNT2 Gene Is Associated With Low-Risk Late-Onset Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only 4.2% of patients reached the primary endpoint (3.2% malignant
      ventricular arrhythmia, 1.1% end-stage heart failure). Codon 92
      variants' carriers (76 individuals, 28 probands) had a higher
      penetrance, being diagnosed 19.4 years earlier, and they exhibited a
      significantly worse prognosis (primary endpoint in 34.3%; P < 0.001).
    explanation: >-
      Direct human documentation of malignant ventricular arrhythmia as an
      observed outcome in TNNT2 carriers, and of its variant-dependence. No
      `frequency:` is asserted because the two rates quoted here are not
      comparable bands: 3.2% is the isolated arrhythmia rate in the low-risk
      p.Asn271Ile cohort, while 34.3% is a composite endpoint that also
      includes end-stage heart failure.
  - reference: PMID:34977031
    reference_title: "Mechanisms of Arrhythmogenicity of Hypertrophic Cardiomyopathy-Associated Troponin T (TNNT2) Variant I79N."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice expressing the I79N variant were particularly susceptible to
      ventricular tachycardia and arrhythmias that was coincident with an
      increased myofibrillar Ca2+ sensitivity, action potential triangulation,
      and increased dispersion of ventricular conduction velocities at fast
      heart rates in the absence of structural abnormalities
    explanation: >-
      Model-organism corroboration that the arrhythmia arises from the
      calcium-sensitization and repolarization-instability mechanism curated
      upstream, and that it does so in the absence of structural
      abnormality - the defining CMH2 dissociation of arrhythmic risk from
      degree of hypertrophy. Supporting, not sole, evidence for this human
      phenotype.
- name: Sudden Cardiac Death
  description: >-
    Sudden, presumed arrhythmic death, disproportionately frequent relative to
    the degree of hypertrophy for carriers of malignant TNNT2 alleles such as
    the codon-92 hotspot, and the clinical feature that most distinguishes
    CMH2 from milder-risk sarcomeric HCM entities.

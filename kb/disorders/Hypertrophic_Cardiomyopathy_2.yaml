- name: Increased Myofilament Calcium Sensitivity and Loss of PKA-Mediated Desensitization
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Mutant cardiac troponin T shifts the thin filament toward the calcium-bound,
    open regulatory state at lower calcium concentrations than wild type,
    raising myofilament calcium sensitivity - a consistent finding across the
    TNNT2 HCM alleles studied by in vitro motility, skinned-fibre, and
    hiPSC-cardiomyocyte assays. A second, mutation-recurring abnormality is
    uncoupling of calcium sensitivity from troponin I phosphorylation by
    protein kinase A, which normally lowers calcium sensitivity as part of the
    beta-adrenergic lusitropic response; several TNNT2 mutant troponins are
    unresponsive to this modulation, removing the physiological
    desensitization reserve.

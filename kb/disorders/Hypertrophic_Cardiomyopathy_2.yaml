- name: Malignant Arrhythmogenic Substrate Despite Mild Hypertrophy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical hallmark of CMH2, first described for the Arg92 hotspot and
    confirmed in independent pedigrees, is a dissociation between the degree
    of left ventricular hypertrophy and the risk of sudden cardiac death:
    carriers of malignant TNNT2 alleles have a high incidence of sudden death,
    often at a young age, despite mild or even subclinical hypertrophy on
    imaging. This "malignant but mild" pattern means that wall-thickness-based
    risk stratification alone systematically underestimates risk for these
    carriers, and it is why genetic testing and genotype-specific counselling
    are emphasized for TNNT2 families. The pattern is allele-dependent rather
    than gene-wide: the founder variant p.Asn271Ile instead produces late-onset,
    low-risk disease, so risk assessment must be made at the level of the
    specific variant.
  evidence:
  - reference: PMID:7898523
    reference_title: Mutations in the genes for cardiac troponin T and alpha-tropomyosin in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations are characterized by relatively mild and sometimes
      subclinical hypertrophy but a high incidence of sudden death.
    explanation: >-
      States the defining dissociation between mild hypertrophy and high
      sudden-death risk for TNNT2 mutations directly.
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support the observation that apparently diverse cardiac
      troponin T gene mutations produce a consistent disease phenotype.
      Because this is one of poor prognosis, despite deceptively mild or
      undetectable hypertrophy, genotyping at this locus may be particularly
      informative in patient management and counselling.
    explanation: >-
      Independent pedigree study confirming the malignant-but-mild phenotype
      across multiple distinct troponin T alleles, and explicitly recommending
      genotype-based counselling as a result.
  - reference: PMID:40310325
    reference_title: The p.Asn271Ile Variant in the TNNT2 Gene Is Associated With Low-Risk Late-Onset Hypertrophic Cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variant-specific rather than gene-specific prognosis should be
      considered during sudden cardiac death risk assessment.
    explanation: >-
      PARTIAL because this variant is the counter-example rather than a
      confirmation of the malignant pattern: it establishes that the
      malignant-but-mild phenotype is a property of specific TNNT2 alleles
      (codon 92 hotspot) and not of the gene as a whole.
  downstream:
  - target: Progressive Heart Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A minority of carriers who survive without a sudden arrhythmic event
      progress to structural heart failure through the same remodeling
      pathway shared with hypertrophic cardiomyopathy generally.

- name: Diastolic Dysfunction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  biological_scale: ORGANISM
  role: effector
  description: >-
    Impaired relaxation from the calcium-sensitized, hypercontractile
    myofilament and (in the R92Q-type allelic branch) secondary alterations in
    calcium-transient decay together produce diastolic dysfunction, with
    prolonged twitch relaxation demonstrated directly in TNNT2 mutant mouse
    myocardium and trabeculae and impaired relaxation seen in human
    TNNT2-mutant cardiomyocytes.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:28735292
    reference_title: "Pathogenesis of Hypertrophic Cardiomyopathy is Mutation Rather Than Disease Specific: A Comparison of the Cardiac Troponin T E163R and R92Q Mouse Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both E163R and R92Q trabeculae showed prolonged twitch relaxation and
      increased occurrence of premature beats.
    explanation: >-
      Direct physiological measurement of prolonged relaxation and increased
      ectopy in trabeculae from both TNNT2 mouse models.
  - reference: PMID:37159677
    reference_title: Low expression of the K280N TNNT2 mutation is sufficient to increase basal myofilament activation in human hypertrophy cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Impaired cardiomyocyte relaxation was only evident in homozygous
      cTnT-K280N hiPSC-CMs.
    explanation: >-
      Human iPSC-cardiomyocyte confirmation of impaired relaxation, with a
      gene-dose relationship (homozygous but not heterozygous mutant cells
      showing the impairment) that maps to the diastolic-dysfunction node.
  downstream:
  - target: Progressive Heart Failure
    causal_link_type: DIRECT

- name: Progressive Heart Failure
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    In carriers who do not experience a sudden arrhythmic event, sustained
    hypercontractility, diastolic dysfunction, and interstitial fibrosis
    progress over years to structural cardiac impairment and congestive heart
    failure, following the same generic maladaptive-remodeling trajectory
    shared with hypertrophic cardiomyopathy generally and detailed on the
    umbrella Hypertrophic Cardiomyopathy entry.
  evidence:
  - reference: PMID:9060892
    reference_title: Sudden death due to troponin T mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A previous report suggested that mutations in the cardiac troponin T
      gene were notable because they were associated with a particularly poor
      prognosis but only mild hypertrophy.
    explanation: >-
      Establishes the poor overall prognosis associated with TNNT2 mutations,
      of which the minority progressing to heart failure (rather than sudden
      death) is a component.
  - reference: PMID:22752727
    reference_title: "The role of TWEAK/Fn14 in cardiac remodeling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiological basis of heart failure is cardiac remodeling, a
      process that comprises structural and functional changes including
      cardiomyocyte proliferation, hypertrophy, necrosis, apoptosis,
      autophagy, interstitial fibrosis, contractile dysfunction and
      ventricular dilatation.
    explanation: >-
      Anchors the consequence node to the generic cardiomyopathy remodeling
      pathway shared with the cardiomyopathy_maladaptive_remodeling module.
      Evidence source is OTHER because this is a mechanistic review.

phenotypes:

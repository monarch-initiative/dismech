    though downstream arrhythmic risk is high.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  frequency: FREQUENT
  evidence:
  - reference: PMID:7898523
    reference_title: Mutations in the genes for cardiac troponin T and alpha-tropomyosin in hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean (+/- SD) maximal thickness of the left ventricular wall in
      subjects with cardiac troponin T mutations (16.7 +/- 5.5 mm) was
      significantly less than that in subjects with beta cardiac myosin
      heavy-chain mutations (23.7 +/- 7.7 mm, P < 0.001).
    explanation: >-
      Quantifies left ventricular hypertrophy in TNNT2 carriers and its
      relative mildness compared with MYH7 carriers. FREQUENT is used for the
      presence of hypertrophy itself (documented across cohorts), while its
      characteristic mildness is captured in the description and the
      pathophysiology node rather than as a separate frequency claim.
- name: Myocardial Fibrosis

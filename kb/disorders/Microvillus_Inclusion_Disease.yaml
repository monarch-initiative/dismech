name: Microvillus Inclusion Disease
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- MVID
- microvillous inclusion disease
- congenital microvillus atrophy
- Davidson disease
- diarrhea 2, with microvillus atrophy
description: >-
  Microvillus inclusion disease (MVID) is an ultra-rare autosomal recessive
  congenital enteropathy and the prototype of the "defective enterocyte
  trafficking and polarity" class of congenital diarrheas and enteropathies
  (CODEs). Biallelic loss-of-function variants in MYO5B, which encodes the
  unconventional actin-based motor myosin Vb, disable apical recycling-endosome
  traffic in the polarized enterocyte. Apical transporters and brush-border
  components are no longer delivered to or retained at the apical membrane;
  instead the brush border is lost and internalized microvilli accumulate inside
  the cell as the pathognomonic intracytoplasmic microvillus inclusions, with
  subapical accumulation of periodic-acid-Schiff-positive secretory granules.
  Affected neonates have profuse, life-threatening watery diarrhea that begins in
  the first days of life (early-onset form) or within the first months
  (late-onset form) and, critically, does NOT remit on fasting or on removal of
  any dietary constituent - the feature that separates MVID from the
  substrate-dependent diet-induced congenital diarrheas. Children are dependent
  on parenteral nutrition from birth, and the natural history is dominated by
  the complications of that dependence: intestinal-failure-associated liver
  disease, catheter sepsis, growth failure and renal impairment. Small-bowel
  transplantation remains the only definitive treatment. Because myosin Vb also
  organizes apical traffic at the hepatocyte canalicular membrane, MYO5B
  variants additionally cause a low-GGT intrahepatic cholestasis (PFIC10) that
  may occur with or without the enteropathy, making MVID a two-organ disease of
  one shared trafficking mechanism rather than a purely intestinal disorder.

- name: Cholestasis
  category: Hepatic
  description: >-
    Low-gamma-glutamyl-transferase intrahepatic cholestasis from the hepatic
    (canalicular) arm of the MYO5B trafficking defect, which may occur with or
    without the enteropathy. This is distinct from the
    intestinal-failure-associated liver disease caused by long-term parenteral
    nutrition, which affects the great majority of these children independently.

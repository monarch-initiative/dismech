    not used as evidence for this phenotype and no frequency band is asserted.
diagnosis:
- name: Small-intestinal biopsy with electron microscopy
  description: >-
    Duodenal or jejunal biopsy is the diagnostic cornerstone. Light microscopy
    shows villous atrophy without significant inflammatory infiltrate; periodic
    acid-Schiff and CD10 staining reveal abnormal subapical granular deposits;
    electron microscopy demonstrates the pathognomonic intracytoplasmic
    microvillus inclusions and the sparse or absent apical brush border.
  evidence:
  - reference: PMID:18724368
    reference_title: "MYO5B mutations cause microvillus inclusion disease and disrupt epithelial cell polarity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MVID is characterized by lack of microvilli on the surface of enterocytes
      and occurrence of intracellular vacuolar structures containing microvilli.
    explanation: >-
      Describes the two ultrastructural findings that establish the diagnosis on
      electron microscopy.
- name: MYO5B and STX3 sequencing
  description: >-
    Molecular confirmation by sequencing of MYO5B and, where MYO5B is negative,
    STX3. Whole-exome or whole-genome sequencing early in the evaluation of
    neonatal intractable diarrhea shortens the diagnostic odyssey and can
    establish the diagnosis before mucosal findings are available.
  evidence:
  - reference: PMID:29654747
    reference_title: "Advances in Evaluation of Chronic Diarrhea in Infants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Whole-exome and genome sequencing in the early stages of evaluation can
      reduce the time required for a definitive diagnosis of CODEs
    explanation: >-
      Supports early genomic testing as the recommended diagnostic strategy for
      congenital diarrheas including MVID. Evidence source is OTHER because this
      is a review.
treatments:
- name: Total Parenteral Nutrition
  description: >-
    Lifelong total parenteral nutrition is required from the neonatal period,
    because the absorptive surface is absent and enteral autonomy is essentially
    never achieved. It is supportive, not disease-modifying: it sustains the
    child while the underlying trafficking defect persists, and it carries its
    own substantial morbidity (intestinal-failure-associated liver disease,
    catheter sepsis, metabolic bone disease, renal impairment). Management in an
    expert intestinal-failure centre measurably improves outcome.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Intractable Secretory Diarrhea and Lifelong Intestinal Failure
    treatment_effect: BYPASSES
    description: >-
      Parenteral nutrition bypasses the non-functional intestinal absorptive
      surface entirely, delivering nutrition intravenously; it does not act on
      the trafficking defect or restore the brush border.
    evidence:
    - reference: PMID:21407114
      reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PN in MVID is difficult to manage and requires expertise.
      explanation: >-
        Supports parenteral nutrition as the mainstay of management and records
        that outcome depends on the expertise with which it is delivered.
- name: Small-Bowel Transplantation
  description: >-
    Small-bowel transplantation, isolated or combined with liver transplantation
    when intestinal-failure-associated liver disease has advanced, is the only
    definitive treatment. It replaces the defective epithelium with donor
    intestine carrying two functional MYO5B alleles. In a 24-patient cohort,
    survival was 77% with transplantation versus 63% without, and catch-up growth
    followed transplantation in some children.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Small Bowel Transplantation
    term:
      id: NCIT:C157985
      label: Small Bowel Transplantation
  target_mechanisms:
  - target: Loss of Apical Absorptive and Ion-Transport Capacity
    treatment_effect: RESTORES
    description: >-
      Replacing the intestine with genotypically normal donor epithelium restores
      an intact brush border and absorptive capacity, the only intervention that
      addresses the effector node rather than compensating for it.
    evidence:
    - reference: PMID:21407114
      reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SBTx, despite being complicated, remains the only hope to improve the
        quality of life and long-term prognosis of these children.
      explanation: >-
        States that small-bowel transplantation is the only intervention that
        improves long-term prognosis, supporting it as the definitive treatment.
    - reference: PMID:21407114
      reference_title: "Microvillous inclusion disease: how to improve the prognosis of a severe congenital enterocyte disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient survival rates were 63% without SBTx and 77% with SBTx.
      explanation: >-
        Quantifies the survival difference associated with transplantation in the
        cohort.
notes: >-
  MVID sits in the "defective enterocyte trafficking and polarity" class of
  congenital diarrheas and enteropathies, alongside congenital tufting
  enteropathy. It deliberately does NOT conform to the
  diet_induced_osmotic_diarrhea module: that module requires a normal
  villus-to-crypt ratio and substrate-dependent diarrhea that remits on dietary
  withdrawal, whereas MVID has villous atrophy and diarrhea that persists during
  complete bowel rest. The two disorders are distinguished at exactly this point
  in the current CODE nosology (PMID:29654747). MVID is curated as a conformer of the
  enterocyte_polarity_trafficking_failure module, which factors out the chain it
  shares with congenital tufting enteropathy. That module admits two molecularly
  distinct trigger arms - apical-delivery trafficking failure (this entry, via
  MYO5B/STX3) and junctional adhesion failure (tufting enteropathy, via
  EpCAM) - which converge on loss of a functionally polarized absorptive
  surface. The arms are not equivalent and their histologies differ, so this
  entry substitutes its own lesion rather than the module's generic description.

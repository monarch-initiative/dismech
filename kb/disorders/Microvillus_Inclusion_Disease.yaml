inheritance:
- name: Autosomal recessive inheritance
  description: >-
    MVID is inherited in an autosomal recessive manner. Reported cohorts are
    strongly enriched for consanguineous families, particularly of Mediterranean
    and Middle Eastern origin, and affected individuals are typically homozygous
    for a founder or private MYO5B variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

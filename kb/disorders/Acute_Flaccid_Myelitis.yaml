discussions:
- discussion_id: afm_ev_d68_human_causation_boundary
  prompt: >-
    What proportion of human AFM is directly caused by EV-D68 neuroinvasion,
    and which tests can establish that cause in an individual patient?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - infectious_agent#Enterovirus D68
  - pathophysiology#Non-polio Enterovirus Respiratory Infection
  rationale: >-
    Outbreak timing, respiratory detections, CSF antibodies, animal causation,
    and human-organoid infection form a coherent causal case. However, viral RNA
    is rarely detected in human CSF, case-control estimates are heterogeneous,
    and AFM is a syndrome with other infectious and noninfectious mimics. The
    graph therefore treats EV-D68 neuroinvasion as the canonical model for
    epidemic disease without assigning it to every case.
  evidence:
  - reference: PMID:42066114
    reference_title: "Enterovirus D68 and Acute Neurologic Outcomes: A Systematic Review and Meta-Analysis (2010-2025)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Across 98 studies, the pooled odds ratio (OR) was 1.39 (95% CI 1.14-1.69),
      with high heterogeneity (I2 = 98.9%; prediction interval 0.24-8.15).
    explanation: The high heterogeneity quantifies uncertainty in human association estimates.
  - reference: PMID:31409689
    reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supports the plausibility of a link between EV infection and AFM that warrants further investigation"
    explanation: The CSF-antibody study explicitly frames its evidence as plausibility, not proof.
  posed_date: "2026-07-20T00:00:00Z"
- discussion_id: afm_respiratory_wave_paralysis_mismatch
  prompt: >-
    Why do large EV-D68 respiratory waves not consistently produce parallel AFM
    peaks, and what host or viral determinants govern the rare paralytic outcome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - epidemiology#United States surveillance since the 2018 peak
  - environmental#EV-D68 respiratory circulation and wastewater seasonality
  rationale: >-
    AFM counts remained low during the 2022 US EV-D68 circulation increase.
    Prospective linked respiratory, wastewater, genomic, host-immunologic, and
    neurologic surveillance is needed to distinguish viral genotype, prior
    immunity, ascertainment, and host susceptibility effects.
  evidence:
  - reference: PMID:38300829
    reference_title: "Surveillance for Acute Flaccid Myelitis - United States, 2018-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is unclear why EV-D68 circulation in 2022 was not associated with an increase in AFM cases"
    explanation: The national surveillance report states the mismatch directly.
  posed_date: "2026-07-20T00:00:00Z"
- discussion_id: afm_organoid_mouse_translation_limit
  prompt: >-
    Which immune and developmental features must be added to organoid and mouse
    systems to reproduce human AFM motor-neuron loss and recovery?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - experimental_models#Human iPSC-derived spinal cord organoids infected with EV-D68
  - animal_models#mouse
  rationale: >-
    Organoids show prolonged productive infection without appreciable cytopathy
    and lack a complete immune compartment. Mice are not native EV-D68 hosts and
    commonly require neonatal or modified conditions. These systems prove
    mechanistic capabilities but cannot determine the human balance between
    direct infection and immune-mediated injury.
  evidence:
  - reference: DOI:10.1128/mbio.01058-23
    reference_title: Contemporary enterovirus-D68 isolates infect human spinal cord organoids
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mice are not native hosts for EV-D68, and thus, existing mouse models use
      immunosuppressed or neonatal mice, mouse-adapted viruses, or intracranial
      inoculations.
    explanation: The organoid paper directly states key limitations of animal translation.
  posed_date: "2026-07-20T00:00:00Z"
review_notes: >-
  Comprehensive 2026 review corrected AFM identity and scope, replaced
  virus-associated pseudo-subtypes with infectious-agent relationships, and
  separated human association from experimental causation. The pathograph now
  connects infection, receptor-mediated entry, neural tropism, gray-matter and
  motor-neuron injury, lower-motor-neuron dysfunction, and every curated
  phenotype with typed, cited edges. MRI, CSF/virologic diagnosis, major
  differentials, long-term prognosis, supportive/rehabilitative/surgical care,
  experimental models, and surveillance uncertainty were audited.

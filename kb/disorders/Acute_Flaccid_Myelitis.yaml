definitions:
- name: Clinical and radiologic AFM syndrome
  definition_type: CASE_DEFINITION
  description: >-
    AFM is defined clinically by acute flaccid limb weakness with objective
    evidence of spinal cord gray-matter involvement, typically by MRI, and/or
    supporting cerebrospinal-fluid inflammation after exclusion of mimics such
    as Guillain-Barre syndrome, spinal cord infarction, poliomyelitis, and
    transverse myelitis.
  criteria_sets:
  - name: Core AFM features
    core_clinical_characteristics:
    - preferred_term: acute flaccid limb weakness
      term:
        id: HP:0003690
        label: Limb muscle weakness
      description: Rapid onset limb weakness with lower motor neuron features.
    - preferred_term: spinal cord gray matter lesion
      term:
        id: HP:0100561
        label: Spinal cord lesion
      description: >-
        MRI lesion centered in spinal cord gray matter, especially the anterior
        horns.
    - preferred_term: CSF pleocytosis
      term:
        id: HP:0012229
        label: CSF pleocytosis
      description: >-
        Supportive inflammatory cerebrospinal-fluid finding in probable or
        definite AFM criteria.
    evidence:
    - reference: PMID:31409689
      reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Classification criteria for a confirmed AFM case are acute flaccid limb
        weakness and magnetic resonance imaging evidence of a predominantly gray
        matter lesion that spans at least one spinal segment
      explanation: >-
        This reproduces the surveillance definition for confirmed AFM and
        directly supports the two required core criteria.
  evidence:
  - reference: PMID:27422805
    reference_title: "Acute flaccid myelitis: A clinical review of US cases 2012-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acute flaccid limb weakness with spinal cord gray matter lesions"
    explanation: >-
      The US case review directly supports the core clinical-radiologic
      definition used here.
  - reference: PMID:33357469
    reference_title: "Acute flaccid myelitis: cause, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no single sensitive and specific test for AFM"
    explanation: >-
      The Lancet review supports modeling AFM as a syndromic diagnosis requiring
      integrated clinical, MRI, CSF, and exclusionary evidence.
infectious_agent:
- name: Enterovirus D68
  infectious_agent_term:
    preferred_term: Enterovirus D68
    term:
      id: NCBITaxon:42789
      label: Enterovirus D68
  description: >-
    EV-D68 is the best-supported infectious exposure associated with epidemic
    AFM. Temporal clustering, respiratory detections, CSF enterovirus-antibody
    enrichment, animal causation, and human neural-model infection support a
    causal role, but viral RNA is rarely found in CSF and not every AFM case is
    attributable to EV-D68.
  evidence:
  - reference: PMID:31409689
    reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "antibodies to EV peptides were present in CSF of 11 of 14 AFM patients (79%)"
    explanation: >-
      CSF enterovirus-antibody enrichment supplies biologic evidence of prior
      enterovirus exposure when viral nucleic acid is no longer detectable.
  - reference: PMID:31409689
    reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "EV RNA was confirmed in CSF from only 1 adult AFM case"
    explanation: >-
      Rare direct CSF detection is important negative context: it limits
      patient-level etiologic confirmation despite the broader association.
  - reference: PMID:42066114
    reference_title: "Enterovirus D68 and Acute Neurologic Outcomes: A Systematic Review and Meta-Analysis (2010-2025)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "AFM case-control studies did not (OR 0.86, 95% CI 0.40-1.86, k = 20)"
    explanation: >-
      The 2026 meta-analysis finds design-dependent and heterogeneous estimates,
      preventing a simplistic claim that EV-D68 explains every AFM case.
- name: Enterovirus A71
  infectious_agent_term:
    preferred_term: Enterovirus A71
    term:
      id: NCBITaxon:39054
      label: Enterovirus A71
  description: >-
    EV-A71 is a recognized non-polio enterovirus associated with some AFM cases,
    but it is not the principal explanation for the recent North American
    biennial AFM pattern. Viral association is represented here as an agent
    relationship rather than as a formal disease subtype.
  evidence:
  - reference: PMID:36268734
    reference_title: "Epidemiology of acute flaccid myelitis in children in the Netherlands, 2014 to 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EV-D68 and EV-A71"
    explanation: >-
      The surveillance report identifies both viruses among non-polio
      enteroviruses associated with AFM.
mechanistic_hypotheses:
- hypothesis_group_id: ev_d68_direct_neuroinvasion_model
  hypothesis_label: EV-D68 Direct Neuroinvasion Model
  status: CANONICAL
  description: >-
    In the best-supported model for epidemic AFM, EV-D68 respiratory infection
    is followed rarely by CNS access, receptor-mediated infection of spinal
    neural cells, and anterior-horn motor-neuron injury. Epidemiologic and human
    CSF evidence support the association, while mouse and organoid systems show
    that contemporary EV-D68 strains can infect neural tissue and cause
    paralytic myelitis. The model does not imply virologic confirmation in every
    patient.
  evidence:
  - reference: PMID:28231269
    reference_title: A mouse model of paralytic myelitis caused by enterovirus D68.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Virus isolated from spinal cords of infected mice transmitted disease when injected into naïve mice, fulfilling Koch's postulates in this model."
    explanation: >-
      Experimental transmission establishes direct causation in the mouse model,
      while the qualification "in this model" prevents overextension to humans.
  - reference: PMID:33357469
    reference_title: "Acute flaccid myelitis: cause, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the disease appears to be caused by non-polio enterovirus infection"
    explanation: >-
      The clinical review identifies non-polio enterovirus infection as the
      leading human etiologic model.
- hypothesis_group_id: secondary_immune_mediated_injury_model
  hypothesis_label: Secondary Immune-Mediated Neural Injury Model
  status: EMERGING
  description: >-
    Direct neural infection may initiate AFM without being sufficient to cause
    the full motor-neuron injury. Persistent productive infection with little
    cytopathic effect in human spinal-cord organoids suggests that host immune
    responses or other secondary injury mechanisms may contribute to neuronal
    loss.
  evidence:
  - reference: DOI:10.1128/mbio.01058-23
    reference_title: Contemporary enterovirus-D68 isolates infect human spinal cord organoids
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      EV-D68 infection is not the sole mediator of neuronal cell death in the
      spinal cord in those with AFM and that secondary injury from the immune
      response likely contributes to pathogenesis.
    explanation: >-
      The human organoid study explicitly proposes secondary immune injury after
      observing prolonged productive infection without appreciable cytopathy.
epidemiology:
- name: Rare pediatric disease with biennial outbreaks
  description: >-
    AFM is rare, occurs mainly in children, and has shown seasonal biennial
    outbreak peaks in the United States and other regions since 2012.
  evidence:
  - reference: PMID:33357469
    reference_title: "Acute flaccid myelitis: cause, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mainly affecting children"
    explanation: >-
      The Lancet review summarizes AFM as a mainly pediatric polio-like illness.
  - reference: PMID:32143233
    reference_title: "Acute Flaccid Myelitis: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "every 2 years since 2012"
    explanation: >-
      This clinical review describes the US biennial seasonal peak pattern.
- name: United States surveillance since the 2018 peak
  description: >-
    CDC surveillance found only 28-47 confirmed US AFM cases per year during
    2019-2022. Counts remained low despite increased EV-D68 circulation in 2022,
    showing that respiratory-virus circulation alone does not reliably predict
    AFM burden and that additional host, viral, or exposure factors are likely.
  evidence:
  - reference: PMID:38300829
    reference_title: "Surveillance for Acute Flaccid Myelitis - United States, 2018-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The number of AFM cases was low during 2019-2022 (28-47 cases per year)"
    explanation: >-
      The CDC surveillance report supplies the post-2018 annual range.
  - reference: PMID:38300829
    reference_title: "Surveillance for Acute Flaccid Myelitis - United States, 2018-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the number of cases remained low in 2022 despite evidence of increased EV-D68 circulation in the United States"
    explanation: >-
      The discordance between respiratory circulation and paralysis motivates
      explicit uncertainty about the determinants of neuroinvasive disease.
- name: Netherlands pediatric incidence
  description: >-
    Retrospective multicenter surveillance in the Netherlands found a very low
    mean pediatric AFM incidence during 2014-2019.
  minimum_value: 0.06
  unit: cases per 100000 children per year
  evidence:
  - reference: PMID:36268734
    reference_title: "Epidemiology of acute flaccid myelitis in children in the Netherlands, 2014 to 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "0.06/100,000 children/year"
    explanation: >-
      The Dutch cohort reports the pediatric mean incidence estimate encoded
      here.
- name: Orphanet onset spectrum
  description: >-
    Orphanet records AFM onset across infancy, childhood, adolescence, and
    adulthood, consistent with a predominantly pediatric disorder that can also
    occur outside childhood.
  evidence:
  - reference: ORPHA:623801
    reference_title: Acute flaccid myelitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Childhood"
    explanation: >-
      Orphanet records childhood onset among AFM natural-history categories.
  - reference: ORPHA:623801
    reference_title: Acute flaccid myelitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Adult"
    explanation: >-
      Orphanet also records adult onset, supporting a broad age range despite
      pediatric predominance.
- name: Population-based pediatric risk factors
  description: >-
    A closed-population pediatric cohort identified male sex, Asian ancestry,
    asthma or atopic dermatitis history, and head injury history as AFM risk
    factors. These associations support host-susceptibility modeling but do not
    establish a Mendelian or deterministic risk mechanism.
  evidence:
  - reference: PMID:30985511
    reference_title: "Incidence, Risk Factors and Outcomes Among Children With Acute Flaccid Myelitis: A Population-based Cohort Study in a California Health Network Between 2011 and 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors included male sex, Asian ancestry and history of asthma, atopic dermatitis or head injury."
    explanation: >-
      The California population-based cohort provides the specific risk-factor
      associations summarized here.
- name: European EV-D68-associated AFM surveillance
  description: >-
    A European ENPEN survey found 130 reported AFM cases across 14 countries
    during 2016-2023, including 48 EV-D68-laboratory-confirmed cases; most
    occurred in years of increased EV-D68 circulation. The same report cautions
    that structural AFM surveillance was limited, so counts should be
    interpreted as incomplete surveillance data.
  evidence:
  - reference: PMID:40444374
    reference_title: "Acute flaccid myelitis in Europe between 2016 and 2023: indicating the need for better registration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The survey revealed 130 AFM cases for 14 countries, with 48 (37%) EV-D68-laboratory-confirmed."
    explanation: >-
      The European survey directly supports the cross-country case count and
      EV-D68-confirmed subset.
  - reference: PMID:40444374
    reference_title: "Acute flaccid myelitis in Europe between 2016 and 2023: indicating the need for better registration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "70% (n = 91) occurred in 2016, 2018 and 2022, when EV-D68 circulation increased."
    explanation: >-
      This supports the temporal association between AFM occurrence and
      increased EV-D68 circulation in Europe.
environmental:
- name: EV-D68 respiratory circulation and wastewater seasonality
  presence: PRESENT
  description: >-
    EV-D68 circulation is the main environmental infectious exposure context for
    AFM surveillance. Wastewater monitoring can detect EV-D68 seasonality and
    regional timing before or alongside clinical respiratory diagnoses, which
    may help public-health preparedness even though AFM remains rare relative to
    EV-D68 infection.
  effect: >-
    Increased EV-D68 circulation raises concern for AFM preparedness but is not
    sufficient on its own to predict individual paralysis risk.
  evidence:
  - reference: PMID:41853773
    reference_title: "Enterovirus D68 in United States wastewater: a longitudinal surveillance study integrating climatic, demographic, and clinical data."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Enterovirus D68 (EV-D68) can cause severe respiratory illness and acute flaccid myelitis (AFM)"
    explanation: >-
      The wastewater surveillance study frames EV-D68 as a respiratory pathogen
      relevant to AFM preparedness.
  - reference: PMID:41853773
    reference_title: "Enterovirus D68 in United States wastewater: a longitudinal surveillance study integrating climatic, demographic, and clinical data."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We observed a biennial EV-D68 pattern with a national peak in September 2024"
    explanation: >-
      Wastewater data support the seasonal and biennial environmental
      circulation pattern encoded here.
pathophysiology:
- name: Non-polio Enterovirus Respiratory Infection
  description: >-
    AFM most often occurs after a respiratory or febrile illness. EV-D68 is the
    leading epidemic-associated virus. Only a very small fraction of respiratory
    infections are followed by AFM, and the route and determinants that permit
    subsequent CNS access in children remain unresolved.
  locations:
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  biological_processes:
  - preferred_term: response to virus
    modifier: INCREASED
    term:
      id: GO:0009615
      label: response to virus
  evidence:
  - reference: PMID:33357469
    reference_title: "Acute flaccid myelitis: cause, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the disease appears to be caused by non-polio enterovirus infection"
    explanation: >-
      This clinical synthesis supports the enterovirus model while appropriately
      using probabilistic wording.
  - reference: PMID:31409689
    reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The cause of AFM remains elusive. An infectious agent is only rarely detected in cerebrospinal fluid (CSF)."
    explanation: >-
      Direct human etiologic confirmation is uncommon and the graph therefore
      does not represent neuroinvasion as proven in every case.
  downstream:
  - target: Prodromal respiratory tract infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - ev_d68_direct_neuroinvasion_model
    description: >-
      Respiratory enterovirus infection commonly produces the febrile or
      respiratory prodrome that precedes neurologic weakness.
    evidence:
    - reference: PMID:32143233
      reference_title: "Acute Flaccid Myelitis: A Clinical Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In most cases, prodromal fever or respiratory symptoms occur"
      explanation: The review links the prodrome temporally to AFM onset.
  - target: MFSD6- and ICAM5-Mediated EV-D68 Neural Cell Entry
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ev_d68_direct_neuroinvasion_model
    description: >-
      Respiratory infection precedes rare CNS access and neural-cell entry, but
      the route of spread and other intervening determinants are not established.
    evidence:
    - reference: PMID:40132641
      reference_title: MFSD6 is an entry receptor for enterovirus D68.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MFSD6 as a host entry factor for EV-D68"
      explanation: The receptor study establishes the downstream entry step.
- name: MFSD6- and ICAM5-Mediated EV-D68 Neural Cell Entry
  description: >-
    MFSD6 is a directly demonstrated EV-D68 entry receptor in respiratory and
    neural primary cells. ICAM5 is a proposed neuron-specific receptor and is
    retained as complementary, lower-tier evidence rather than treated as a
    universal AFM receptor mechanism.
  genes:
  - preferred_term: MFSD6
    term:
      id: hgnc:24711
      label: MFSD6
  - preferred_term: ICAM5
    term:
      id: hgnc:5348
      label: ICAM5
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:40132641
    reference_title: MFSD6 is an entry receptor for enterovirus D68.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockout of MFSD6 expression abrogated EV-D68 infection in cell lines and primary cells corresponding to respiratory and neural cells."
    explanation: >-
      Genetic loss-of-function and primary-cell experiments directly support
      MFSD6-dependent entry.
  - reference: PMID:41467840
    reference_title: "Enterovirus D68 receptor usage: from static attachment to dynamic entry."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "ICAM-5) as a neuron-specific receptor that provides a molecular explanation for neurotropism in AFM."
    explanation: >-
      A receptor-usage review supports ICAM5 as a neuron-specific alternative,
      but this is weaker evidence than the MFSD6 perturbation experiments.
  downstream:
  - target: Spinal Neural Cell Tropism and Infection
    causal_link_type: DIRECT
    hypothesis_groups:
    - ev_d68_direct_neuroinvasion_model
    description: >-
      Receptor-dependent cell entry permits productive EV-D68 infection in
      susceptible neural cells.
    evidence:
    - reference: PMID:40132641
      reference_title: MFSD6 is an entry receptor for enterovirus D68.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MFSD6 localized to the plasma membrane and was required for viral entry into host cells."
      explanation: This directly links receptor availability to viral entry.
- name: Spinal Neural Cell Tropism and Infection
  description: >-
    Contemporary EV-D68 strains productively infect human spinal-cord organoids.
    Tropism differs by strain across neurons, cycling astrocytes, and
    oligodendrocyte precursor cells, indicating that neural susceptibility is
    neither uniform nor explained by motor neurons alone.
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  evidence:
  - reference: DOI:10.1128/mbio.01058-23
    reference_title: Contemporary enterovirus-D68 isolates infect human spinal cord organoids
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "productively infected with contemporary strains, but not a historic strain, of EV-D68"
    explanation: >-
      Productive infection in human spinal-cord organoids establishes direct
      human-cell neural tropism and a strain effect.
  - reference: DOI:10.3389/fmicb.2025.1698639
    reference_title: Strain-specific tropism and transcriptional responses of enterovirus D68 infection in human spinal cord organoids
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "distinct viral tropism and host transcriptional responses"
    explanation: Single-cell profiling supports strain- and cell-type-specific tropism.
  downstream:
  - target: Spinal Gray Matter Inflammation and Motor Neuron Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - ev_d68_direct_neuroinvasion_model
    - secondary_immune_mediated_injury_model
    description: >-
      Neural infection can precede motor-neuron injury through direct viral
      effects and/or secondary inflammatory injury; their relative contribution
      in human AFM remains unresolved.
    evidence:
    - reference: DOI:10.1128/mbio.01058-23
      reference_title: Contemporary enterovirus-D68 isolates infect human spinal cord organoids
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "secondary injury from the immune response likely contributes to pathogenesis"
      explanation: >-
        Organoid infection with limited cytopathy specifically supports an
        intervening secondary-injury mechanism.
    - reference: PMID:28231269
      reference_title: A mouse model of paralytic myelitis caused by enterovirus D68.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "infection and loss of motor neurons in the anterior horns of spinal cord segments corresponding to paralyzed limbs."
      explanation: The mouse model links spinal infection to regional motor-neuron loss.
- name: Spinal Gray Matter Inflammation and Motor Neuron Injury
  description: >-
    AFM injury is centered on spinal gray matter and anterior-horn motor neurons.
    Cranial motor nuclei can also be involved, accounting for facial, bulbar,
    and respiratory manifestations that cannot be attributed to spinal anterior
    horns alone.
  locations:
  - preferred_term: ventral horn of spinal cord
    term:
      id: UBERON:0002257
      label: ventral horn of spinal cord
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  cell_types:
  - preferred_term: anterior horn motor neuron
    term:
      id: CL:2000048
      label: anterior horn motor neuron
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:32143233
    reference_title: "Acute Flaccid Myelitis: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary site of injury in AFM is the anterior horn cells of the spinal cord"

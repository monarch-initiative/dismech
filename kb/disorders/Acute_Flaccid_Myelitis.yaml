      explanation: The organoid infection directly models the curated tropism mechanism.
  - target: Spinal Gray Matter Inflammation and Motor Neuron Injury
    description: >-
      Separates productive viral infection from overt cytopathic injury and
      motivates testing secondary immune-mediated damage.

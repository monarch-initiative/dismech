diagnosis:
- name: MRI-centered AFM evaluation
  description: >-
    Suspected AFM evaluation centers on urgent neurologic examination and MRI of
    the entire spinal cord and brainstem to detect gray-matter lesions. CSF
    analysis, respiratory and stool testing, poliovirus exclusion, and early
    electrodiagnostic testing help characterize inflammation, seek an infectious
    association, and distinguish peripheral neuropathy.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  results: >-
    Longitudinal spinal cord gray-matter lesions, especially anterior horn
    involvement, support AFM in the right clinical context.
  evidence:
  - reference: PMID:26621554
    reference_title: Recognition and Management of Acute Flaccid Myelitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spinal gray matter lesions"
    explanation: >-
      Pediatric case series supports MRI detection of spinal gray matter lesions
      as a key recognition feature.
  - reference: PMID:33357469
    reference_title: "Acute flaccid myelitis: cause, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical, neuroimaging, and cerebrospinal fluid characteristics"
    explanation: >-
      The Lancet review supports an integrated diagnostic workup rather than a
      single confirmatory test.
- name: CSF and respiratory or stool enterovirus testing
  description: >-
    CSF cell count and protein are supportive, while respiratory and stool
    specimens should be collected early for enterovirus typing and poliovirus
    exclusion. A negative CSF PCR does not exclude AFM or an enterovirus
    association because viral RNA is rarely recovered from CSF.
  results: >-
    Pleocytosis supports CNS inflammation; enterovirus detection outside CSF can
    support an association but does not independently prove viral causation of
    the neurologic syndrome.
  evidence:
  - reference: PMID:31409689
    reference_title: Antibodies to Enteroviruses in Cerebrospinal Fluid of Patients with Acute Flaccid Myelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An infectious agent is only rarely detected in cerebrospinal fluid (CSF)."
    explanation: Rare CSF detection explains why negative CSF PCR cannot exclude AFM.
  - reference: PMID:26720027
    reference_title: "Acute Flaccid Myelitis of Unknown Etiology in California, 2012-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No pathogens were isolated from the cerebrospinal fluid."
    explanation: The 59-case series illustrates the low yield of CSF pathogen testing.
- name: Mimic exclusion
  description: >-
    AFM diagnosis requires careful exclusion of other causes of acute flaccid
    paralysis, especially Guillain-Barre syndrome, spinal cord stroke, acute
    transverse myelitis, poliomyelitis, and compressive or structural spinal
    cord disease.
  notes: >-
    Key mimics include Guillain-Barre syndrome, spinal cord infarction,
    transverse myelitis, poliomyelitis, and structural spinal cord disease.
  evidence:
  - reference: PMID:32143233
    reference_title: "Acute Flaccid Myelitis: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Guillain-Barre syndrome, spinal cord stroke, and transverse myelitis"
    explanation: >-
      The clinical review explicitly lists these major AFM mimics.
differential_diagnoses:
- name: Guillain-Barre syndrome
  disease_term:
    preferred_term: Guillain-Barre syndrome
    term:
      id: MONDO:0016218
      label: Guillain-Barre syndrome
  description: >-
    GBS also causes acute weakness and areflexia, but weakness is usually more
    symmetric, sensory deficits are more common, progression to nadir is slower,
    CSF protein is higher relative to leukocytes, and spinal gray-matter lesions
    favor AFM.
  distinguishing_features:
  - AFM reached nadir sooner in a pediatric comparison (3 versus 8 days).
  - Asymmetric weakness and lack of sensory deficits favored AFM.
  - Spinal-cord lesions were found only in AFM in the comparative cohort.
  evidence:
  - reference: PMID:34747551
    reference_title: "Acute flaccid myelitis and Guillain-Barré syndrome in children: A comparative study with evaluation of diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      shorter interval between onset of weakness and nadir (3 vs. 8 days, p <
      0.001), more often had asymmetric limb weakness (58% vs. 0%, p < 0.001),
      and less frequently had sensory deficits (0% vs. 40%, p < 0.001)
    explanation: The direct pediatric comparison supplies the principal early distinctions.
- name: Acute transverse myelitis
  disease_term:
    preferred_term: acute transverse myelitis
    term:
      id: MONDO:0015342
      label: acute transverse myelitis
  description: >-
    Transverse myelitis can produce acute weakness and a spinal lesion, but a
    sensory level, bowel or bladder dysfunction, upper-motor-neuron evolution,
    and a lesion not selectively centered in anterior-horn gray matter favor
    transverse myelitis over AFM.
  distinguishing_features:
  - Sensory and autonomic spinal-cord dysfunction are more prominent.
  - MRI involvement is not restricted to the anterior-horn gray-matter pattern.
  evidence:
  - reference: PMID:36996587
    reference_title: "Pediatric acute flaccid myelitis: Evaluation of diagnostic criteria and differentiation from other causes of acute flaccid paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients initially classified as probable or possible AFM were most commonly diagnosed with transverse myelitis (16/25)."
    explanation: This diagnostic study establishes transverse myelitis as the main probable/possible AFM mimic.
- name: Poliomyelitis
  disease_term:
    preferred_term: poliomyelitis
    term:
      id: MONDO:0017373
      label: poliomyelitis
  description: >-
    Poliomyelitis can be clinically and anatomically indistinguishable from AFM.
    Travel and vaccination history plus urgent stool testing for poliovirus are
    required because a non-polio AFM label must not delay public-health response
    to possible poliovirus.
  distinguishing_features:
  - Poliovirus detection establishes poliomyelitis rather than non-polio AFM.
  - Epidemiologic exposure and immunization history change the pretest probability.
  evidence:
  - reference: PMID:32143233
    reference_title: "Acute Flaccid Myelitis: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "striking similarities to cases of poliomyelitis"
    explanation: The clinical review supports the close phenotypic overlap.
- name: Spinal cord infarction
  description: >-
    Spinal cord infarction can cause abrupt flaccid weakness and initially mimic
    AFM. Hyperacute maximal deficit, a vascular or hypotensive context, restricted
    diffusion, and a vascular-territory pattern favor infarction.
  distinguishing_features:
  - Deficit is often maximal at onset rather than progressing over several days.
  - Diffusion restriction and vascular-territory MRI findings favor infarction.
  evidence:
  - reference: PMID:32143233
    reference_title: "Acute Flaccid Myelitis: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Guillain-Barre syndrome, spinal cord stroke, and transverse myelitis."
    explanation: The AFM clinical review explicitly includes spinal cord stroke among major mimics.
progression:
- phase: Rapid progression to acute nadir
  notes: >-
    Weakness progresses over hours to days. In a direct pediatric comparison,
    AFM reached nadir sooner than GBS, reinforcing the need for prompt MRI,
    respiratory monitoring, and specimen collection.
  evidence:
  - reference: PMID:34747551
    reference_title: "Acute flaccid myelitis and Guillain-Barré syndrome in children: A comparative study with evaluation of diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "shorter interval between onset of weakness and nadir (3 vs. 8 days, p < 0.001)"
    explanation: >-
      The comparative cohort places median AFM nadir at three days.
- phase: Chronic motor deficit with partial functional recovery
  notes: >-
    Persistent focal paralysis is common, although disability and activity of
    daily living can continue to improve over years. Motor recovery is generally
    less complete than recovery of nonmotor neurologic findings.
  evidence:
  - reference: PMID:33388543
    reference_title: Three-Year Longitudinal Motor Function and Disability Level of Acute Flaccid Myelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFM has a high rate of persistent motor deficits showing one- to two-limb paralysis."
    explanation: >-
      Three-year follow-up establishes persistence of focal motor deficits.
  - reference: PMID:33388543
    reference_title: Three-Year Longitudinal Motor Function and Disability Level of Acute Flaccid Myelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disability level of patients with AFM, however, generally improved at the three-year time point."
    explanation: >-
      Functional improvement despite residual paralysis gives a more nuanced
      prognosis than either full recovery or fixed disability.
- phase: Long-term respiratory morbidity after acute respiratory failure
  notes: >-
    Children requiring respiratory support during the acute illness have a
    higher risk of chronic respiratory support, health-care use, and prolonged
    neurologic disability.
  evidence:
  - reference: PMID:39657203
    reference_title: "Pediatric Patients With Acute Flaccid Myelitis: Long-term Respiratory and Neurologic Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among children with respiratory failure, 6 patients (75%) required follow-up respiratory support."
    explanation: >-
      Six of eight children with acute respiratory failure required later
      respiratory support, defining a high-risk prognostic subgroup.

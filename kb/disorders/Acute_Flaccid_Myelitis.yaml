      explanation: The clinical review explicitly links anterior-horn injury to motor neuronopathy.
- name: Segmental and Cranial Lower Motor Neuron Dysfunction
  description: >-
    Dysfunction of segmental anterior-horn and cranial motor systems produces
    rapid flaccid weakness, depressed reflexes, asymmetry, and, when brainstem or
    respiratory motor pools are affected, facial, bulbar, or ventilatory
    impairment.
  locations:
  - preferred_term: ventral horn of spinal cord
    term:
      id: UBERON:0002257
      label: ventral horn of spinal cord

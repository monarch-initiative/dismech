      explanation: This exact observation supports the finding.
  - statement: Cell tropism differs between contemporary EV-D68 strains.
    supporting_text: >-
      US/IL/14-18952 showed a significant preference for neurons, while
      US/MA/18-23089 exhibited higher rates of infection in cycling astrocytes
      and OPCs.
    evidence:
    - reference: DOI:10.3389/fmicb.2025.1698639
      reference_title: Strain-specific tropism and transcriptional responses of enterovirus D68 infection in human spinal cord organoids
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "US/IL/14-18952 showed a significant preference for neurons"
      explanation: The single-cell study directly supports strain-specific tropism.
  evidence:

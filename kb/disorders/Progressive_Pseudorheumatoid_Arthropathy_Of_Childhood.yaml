name: Progressive Pseudorheumatoid Arthropathy of Childhood
creation_date: "2026-08-30T06:20:00Z"
category: Mendelian
parents:
- Skeletal Dysplasia
- Spondyloepiphyseal Dysplasia
synonyms:
- PPAC
- PPRD
- progressive pseudorheumatoid dysplasia
- spondyloepiphyseal dysplasia tarda with progressive arthropathy
- SEDT-PA
disease_term:
  preferred_term: progressive pseudorheumatoid arthropathy of childhood
  term:
    id: MONDO:0008827
    label: progressive pseudorheumatoid arthropathy of childhood
description: >-
  Progressive pseudorheumatoid arthropathy of childhood (PPRD) is an autosomal
  recessive skeletal dysplasia caused by biallelic loss-of-function variants in
  CCN6 (WISP3). Articular cartilage degenerates progressively in the complete
  absence of inflammation, producing symmetric joint stiffness and enlargement,
  prominent interphalangeal joints, platyspondyly, short stature and early
  secondary osteoarthritis, with onset typically between three and six years.

  The defining clinical problem is not the arthropathy but the mistake it
  invites. PPRD looks like juvenile idiopathic arthritis and is routinely
  treated as such, sometimes for years, with drugs that cannot work: ESR, CRP,
  rheumatoid factor and ANA are normal, and there is nothing inflammatory for
  an immunosuppressant to act on. In one Turkish cohort the median age at
  symptom onset was four years and at diagnosis 9.7. The cost of that delay is
  measurable — 47.7% of those patients lost independent walking at a median age
  of twelve.

  There is no disease-modifying therapy. Joint arthroplasty for end-stage large
  joints is the one intervention with substantial outcome data behind it.
definitions:
- name: PPRD diagnostic criteria
  definition_type: CASE_DEFINITION
  description: >-
    Established in a proband with characteristic radiographic features and/or
    biallelic pathogenic CCN6 variants. Clinical ascertainment rests on
    progressive stiffness of multiple joints, characteristic wide metaphyses of
    the interphalangeal joints, and platyspondyly.
  scope: Disease-level ascertainment, and separation from inflammatory arthritis.
  evidence:
  - reference: PMID:26610319
    reference_title: Progressive Pseudorheumatoid Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PPRD is established in a proband with characteristic
      radiographic features and/or biallelic pathogenic variants in CCN6
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criteria.
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients with progressive stiffness of multiple joints, characteristic
      wide metaphysis of interphalangeal (IP) joints and platyspondyly were
      clinically diagnosed with PPRD.
    explanation: >-
      Gives the clinical triad used for ascertainment in a large cohort.
epidemiology:
- name: Rare and systematically under-ascertained
  description: >-
    Prevalence is put at roughly one per million, but that figure is explicitly
    described as an underestimate because cases are undiagnosed or carried as
    juvenile idiopathic arthritis. The largest cohorts come from consanguineous
    or endemic populations — India, China, Turkey, Egypt — each with its own
    founder or hotspot allele.
  evidence:
  - reference: PMID:36550675
    reference_title: A rare skeletal dysplasia-close mimicker of juvenile idiopathic arthritis-progressive pseudorheumatoid dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalence underestimated as one per million and most of the cases remain
      undiagnosed or treated as Juvenile Idiopathic Arthritis (JIA).
    explanation: >-
      States both the prevalence figure and the reason it is an underestimate.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    The source gives "one per million" and immediately qualifies it as an
    underestimate, without a measure type or a denominator. Recorded here as the
    coarse band with measure_type UNKNOWN rather than promoted to a point
    prevalence the source does not claim.
  evidence:
  - reference: PMID:36550675
    reference_title: A rare skeletal dysplasia-close mimicker of juvenile idiopathic arthritis-progressive pseudorheumatoid dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalence underestimated as one per million and most of the cases remain
      undiagnosed or treated as Juvenile Idiopathic Arthritis (JIA).
    explanation: >-
      The only published rate, quoted with the author's own caveat.
progression:
- phase: Clinically silent at birth and in infancy
  age_range: Birth to about 3 years
  notes: >-
    The disease is silent at birth and in infancy; height is initially normal.
    An early-onset subgroup presents before age three with genu varum
    deformity, which the Turkish cohort identified as an early sign.
  evidence:
  - reference: PMID:22791401
    reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is clinically silent at birth and in infancy.
    explanation: >-
      Establishes the asymptomatic early period.
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed that genu varum deformity before the age of 3 years was an
      early sign for PPRD
    explanation: >-
      Identifies the early-onset presenting sign.
- phase: Interphalangeal onset in early childhood
  age_range: Typically 3 to 6 years
  notes: >-
    Onset begins with the interphalangeal joints, with joint pain and
    progressive stiffness. In the classical group the initial symptom was
    widening of the interphalangeal joints; median age of onset of IP stiffness
    was 5 years, elbow and knee 9, and hip 12.2.
  evidence:
  - reference: PMID:26610319
    reference_title: Progressive Pseudorheumatoid Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset – typically between ages three and six years – begins with the
      involvement of the interphalangeal joints.
    explanation: >-
      GeneReviews gives the age and site of onset.
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset of IP, elbow, knee and hip stiffness, which became
      progressive with growth was 5, 9, 9 and 12.2 years, respectively.
    explanation: >-
      Gives the ordered joint-by-joint progression with ages.
- phase: Spinal involvement and loss of ambulation
  age_range: Late childhood and adolescence
  notes: >-
    Spine involvement develops in late childhood and adolescence, producing a
    short trunk with thoracolumbar kyphosis; adult height is usually below the
    third centile. Platyspondyly develops late and can be the first radiographic
    clue. Nearly half of patients lose independent walking.
  evidence:
  - reference: PMID:22791401
    reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spine involvement develops in late childhood and adolescence leading to
      short trunk with thoracolumbar kyphosis. Adult height is usually below the
      3rd percentile.
    explanation: >-
      Documents the spinal phase and its effect on stature.
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 47.7% lost independent walking ability at the median age of 12
      years.
    explanation: >-
      Quantifies the disability endpoint.
- phase: Diagnostic delay
  notes: >-
    Curated as a phase of its own because in this disease the delay is part of
    the natural history rather than a service-quality footnote. Median onset 4
    years, median diagnosis 9.7 years in the Turkish cohort; the review reports
    that diagnosis is most often made only in the second decade, and that
    affected children often receive unnecessary anti-inflammatory and
    immunosuppressive treatment in the interval.
  evidence:
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset of symptoms and of diagnosis was 4 and 9.7 years,
      respectively.
    explanation: >-
      Quantifies the delay in a genetically confirmed cohort.
  - reference: PMID:22791401
    reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In spite of the first symptoms appearing in early childhood, the diagnosis
      of PPRD is most often made only in the second decade and affected children
      often receive unnecessary anti-inflammatory and immunosuppressive
      treatments.
    explanation: >-
      States both the delay and the inappropriate treatment that fills it.

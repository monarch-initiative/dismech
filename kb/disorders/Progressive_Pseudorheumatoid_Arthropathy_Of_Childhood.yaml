differential_diagnoses:
- name: Juvenile idiopathic arthritis
  description: >-
    The differential that matters, because the error is common, costly and runs
    in one direction. PPRD patients are routinely diagnosed with and treated for
    JIA. The discriminators are normal ESR and CRP, negative RF and ANA, bony
    rather than synovial joint enlargement, platyspondyly, and absent response
    to anti-inflammatory therapy. Suspecting this should prompt molecular
    testing rather than escalation of immunosuppression.
  evidence:
  - reference: PMID:34749805
    reference_title: "Progressive pseudorheumatoid dysplasia misdiagnosed as juvenile idiopathic arthritis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features of progressive pseudorheumatoid dysplasia resemble those
      of juvenile idiopathic arthritis. Patients with progressive
      pseudorheumatoid dysplasia are usually misdiagnosed as having juvenile
      idiopathic arthritis
    explanation: >-
      States both the resemblance and that misdiagnosis is the usual outcome.
  - reference: PMID:36550675
    reference_title: A rare skeletal dysplasia-close mimicker of juvenile idiopathic arthritis-progressive pseudorheumatoid dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baseline biochemistry, erythrocyte sedimentation rate (ESR), C-reactive
      protein (CRP), rheumatoid factor and ANA, were within normal limits.
    explanation: >-
      Gives the laboratory panel that separates the two.
- name: Czech dysplasia (COL2A1)
  description: >-
    A naming hazard rather than a clinical one, and worth recording because it
    has already caused a citation error in this repository. "Progressive
    pseudorheumatoid dysplasia" is used both for this CCN6 recessive disorder
    and, loosely, for the COL2A1 dominant Czech dysplasia. They are
    mechanistically unrelated. kb/disorders/Czech_Dysplasia.yaml documents a
    deep-research report for that entry citing PMID:27587938, which is about the
    CCN6 disease. Any citation carrying the phrase needs checking against which
    of the two diseases it actually reports.
  evidence:
  - reference: PMID:22791401
    reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive pseudorheumatoid dysplasia (PPRD) is a genetic,
      non-inflammatory arthropathy caused by recessive loss of function
      mutations in WISP3 (Wnt1-inducible signaling pathway protein 3; MIM
      603400), encoding for a signaling protein.
    explanation: >-
      Anchors the name used in this entry to the recessive WISP3 disease, which
      is what distinguishes it from the dominant COL2A1 disorder.
discussions:
- discussion_id: no_mouse_model_for_ccn6_loss
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Wisp3-deficient mice have no apparent phenotype. What does a species with no
    disease tell us about the human mechanism, and what model should replace the
    mouse for preclinical work?
  attaches_to:
  - pathophysiology#Loss of CCN6 Modulation of BMP and Wnt Signaling
  rationale: >-
    This is a translational block rather than a gap in evidence. Loss of Wisp3
    in the mouse produces no apparent phenotype, and neither does overexpression
    — so the standard preclinical species is uninformative for a disease that is
    fully penetrant in humans. Two readings are open. Either mouse cartilage has
    a redundancy that human articular cartilage lacks, in which case the
    interesting biology is what compensates; or the human phenotype depends on
    mechanical loading histories, growth duration or joint geometry that a mouse
    does not reproduce. The zebrafish work is currently the only in vivo system
    where CCN6 loss does something, and it reports pharyngeal cartilage
    morphology rather than progressive articular degeneration. Until this is
    resolved there is no animal system in which a disease-modifying therapy
    could be tested, which is a plausible part of why none exists.
  evidence:
  - reference: PMID:17823661
    reference_title: The CCN family member Wisp3, mutant in progressive pseudorheumatoid dysplasia, modulates BMP and Wnt signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in mice there is no apparent phenotype caused by Wisp3 deficiency or
      overexpression
    explanation: >-
      The negative result that constitutes the mismatch.
- discussion_id: bmp_wnt_to_cartilage_loss_intermediates
  kind: KNOWLEDGE_GAP
  prompt: >-
    What are the intermediate steps between deregulated BMP/Wnt signalling and
    progressive loss of human articular cartilage in PPRD?
  attaches_to:
  - pathophysiology#Failure of Articular Chondrocyte Matrix Homeostasis
  rationale: >-
    Both ends of this chain are well supported and the middle is not. CCN6's
    inhibition of BMP and Wnt signalling is demonstrated by gain-of-function in
    zebrafish; progressive articular cartilage loss is documented
    radiographically in patients. Between them sit at least three competing
    proposals — loss of matrix-synthetic drive on type II collagen and aggrecan,
    loss of superoxide dismutase-dependent antioxidant protection, and
    increased chondrocyte IGF-1 sensitivity driving hypertrophic differentiation
    — none demonstrated in human articular cartilage. They are not mutually
    exclusive, which is part of why none has been excluded. The edge in this
    entry is typed INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.
  evidence:
  - reference: PMID:16480948
    reference_title: WISP-3 functions as a ligand and promotes superoxide dismutase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      WISP-3 may also promote superoxide dismutase expression and activity in
      chondrocytes
    explanation: >-
      One of the competing intermediate proposals, stated with the authors' own
      hedge.

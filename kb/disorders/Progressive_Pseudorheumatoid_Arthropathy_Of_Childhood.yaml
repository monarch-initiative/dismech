genetic:
- name: CCN6
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CCN6
    term:
      id: hgnc:12771
      label: CCN6
  notes: >-
    Biallelic loss-of-function CCN6 (WISP3) variants on chromosome 6q22 cause
    PPRD. The mutational spectrum is dominated by single-nucleotide variants and
    small indels and is strongly population-structured, with a distinct founder
    or hotspot allele in each large cohort: c.1010G>A (p.Cys337Tyr) in 10 of 25
    Indian families, c.156C>A (p.Cys52*) in 53.3% of Turkish families, and
    c.624dupA among Chinese patients, where 79% of variants were seen only in
    that population. Two genotype-phenotype signals are reported from the
    Chinese cohort: c.624dupA is associated with later onset, more joints
    involved and elbow predilection, and biallelic null variants with at least
    one in exon 2 with long-bone shortening and severe deformity.
  variants:
  - name: CCN6 c.1010G>A (p.Cys337Tyr)
    description: >-
      The commonest Indian allele, homozygous in 10 unrelated families of 25.
  - name: CCN6 c.156C>A (p.Cys52*)
    description: >-
      Nonsense allele found in 53.3% of Turkish families.
  - name: CCN6 c.624dupA (p.C209Mfs*21)
    description: >-
      Chinese hotspot allele associated with later onset, more extensive joint
      involvement and elbow involvement.
  evidence:
  - reference: PMID:37377052
    reference_title: Molecular analysis of WISP3 (CCN6) gene in Egyptian patients with progressive pseudorheumatoid dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPRD occurs due to loss of function pathogenic variants in WISP3 (CCN6)
      gene, located on chromosome 6q22.
    explanation: >-
      States the causal gene, its locus and the loss-of-function mechanism.
  - reference: PMID:22987568
    reference_title: Clinical and mutation profile of progressive pseudorheumatoid dysplasia in Indian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One missense mutation (c.1010G>A; p.Cys337Tyr) appears to be the most
      common in our population being seen in 10 unrelated families.
    explanation: >-
      Establishes the Indian founder allele and its frequency.
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      c.156C>A(p.Cys52*) variant was found in 53.3% of the families.
    explanation: >-
      Establishes the Turkish founder allele and its frequency.
  - reference: PMID:36622578
    reference_title: "Genotype and phenotype characteristics and genotype-phenotype correlation of Chinese patients with progressive pseudorheumatoid dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-three variants, including nine novels and five hotspot variants,
      were identified, with 26/33 (79%) variants exclusively seen in the Chinese
      population.
    explanation: >-
      Documents the population-specific structure of the mutational spectrum.
  - reference: PMID:36622578
    reference_title: "Genotype and phenotype characteristics and genotype-phenotype correlation of Chinese patients with progressive pseudorheumatoid dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the five hotspot variants, c.624dupA is associated with later onset
      of disease, more extensive joint involvement, and a tendency to affect
      elbow joints.
    explanation: >-
      The reported genotype-phenotype correlation for the Chinese hotspot
      allele.
pathophysiology:
- name: Biallelic CCN6 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CCN6
      term:
        id: hgnc:12771
        label: CCN6
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic nonsense, frameshift, splice-site and missense variants abolish
      CCN6 function. Disease-causing amino-acid substitutions reduce the
      protein's signalling-inhibitory activity in a zebrafish assay.
  evidence:
  - reference: PMID:37377052
    reference_title: Molecular analysis of WISP3 (CCN6) gene in Egyptian patients with progressive pseudorheumatoid dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPRD occurs due to loss of function pathogenic variants in WISP3 (CCN6)
      gene, located on chromosome 6q22.
    explanation: >-
      Names the gene and the loss-of-function mechanism defining this node.
  downstream:
  - target: Loss of CCN6 Modulation of BMP and Wnt Signaling
    causal_link_type: DIRECT
    description: >-
      CCN6 normally inhibits BMP and Wnt signalling by binding BMP ligand and
      the Wnt co-receptors LRP6 and Frizzled; disease alleles reduce that
      inhibition.
    evidence:
    - reference: PMID:17823661
      reference_title: The CCN family member Wisp3, mutant in progressive pseudorheumatoid dysplasia, modulates BMP and Wnt signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overexpression of zebrafish Wisp3 protein inhibited bone morphogenetic
        protein (BMP) and Wnt signaling in developing zebrafish
      explanation: >-
        Establishes the signalling activity that disease alleles impair.
- name: Loss of CCN6 Modulation of BMP and Wnt Signaling
  biological_scale: MOLECULAR
  description: >-
    CCN6 is a secreted matricellular protein that binds BMP ligand and the Wnt
    co-receptors LRP6 and Frizzled. Loss of that binding removes a brake on both
    pathways in developing and mature cartilage.
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  evidence:
  - reference: PMID:17823661
    reference_title: The CCN family member Wisp3, mutant in progressive pseudorheumatoid dysplasia, modulates BMP and Wnt signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overexpression of zebrafish Wisp3 protein inhibited bone morphogenetic
      protein (BMP) and Wnt signaling in developing zebrafish
    explanation: >-
      The inhibitory activity whose loss defines this node, demonstrated by
      gain-of-function in the zebrafish assay.
  downstream:
  - target: Failure of Articular Chondrocyte Matrix Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deregulated BMP/Wnt signalling in cartilage is proposed to disturb
      chondrocyte matrix maintenance, but the intermediate steps between the
      signalling change and cartilage loss are not established in human tissue.
    evidence:
    - reference: PMID:17823661
      reference_title: The CCN family member Wisp3, mutant in progressive pseudorheumatoid dysplasia, modulates BMP and Wnt signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overexpression of zebrafish Wisp3 protein inhibited bone morphogenetic
        protein (BMP) and Wnt signaling in developing zebrafish
      directness: INDIRECT
      explanation: >-
        The link from this signalling activity to human articular cartilage
        failure is an inference across species and across development; the edge
        is typed accordingly.
- name: Failure of Articular Chondrocyte Matrix Homeostasis
  biological_scale: CELLULAR
  description: >-
    WISP-3 acts on chondrocytes as an autocrine and paracrine ligand,
    upregulating type II collagen and aggrecan and promoting superoxide
    dismutase activity, so its loss removes both a matrix-synthetic and an
    antioxidant input. A separate proposal is that mutant WISP3 loses its
    ability to restrain IGF-1, increasing chondrocyte IGF-1 sensitivity and
    shifting cells toward hypertrophic differentiation. These are complementary
    hypotheses rather than an established sequence.
  cell_types:
  - preferred_term: articular chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:16480948
    reference_title: WISP-3 functions as a ligand and promotes superoxide dismutase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      WISP-3 may also promote superoxide dismutase expression and activity in
      chondrocytes
    explanation: >-
      Establishes an antioxidant function of the protein in the affected cell
      type. The authors' own hedge is preserved.
  downstream:
  - target: Progressive Noninflammatory Articular Cartilage Loss
    causal_link_type: DIRECT
    description: >-
      Loss of chondrocyte matrix maintenance produces progressive narrowing of
      all articular spaces as cartilage is lost.
    evidence:
    - reference: PMID:22791401
      reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There is a progressive narrowing of all articular spaces as articular
        cartilage is lost.
      explanation: >-
        The radiographic observation of the cartilage loss this edge produces.
- name: Progressive Noninflammatory Articular Cartilage Loss
  biological_scale: TISSUE
  description: >-
    Articular cartilage is lost progressively across multiple joints with no
    inflammatory component. The absence of inflammation is not incidental — it
    is what makes anti-inflammatory and immunosuppressive treatment futile, and
    it is the feature that should separate PPRD from juvenile idiopathic
    arthritis at the bedside.
  evidence:
  - reference: PMID:26610319
    reference_title: Progressive Pseudorheumatoid Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive pseudorheumatoid dysplasia (PPRD) is a skeletal dysplasia
      characterized by predominant involvement of articular cartilage with
      progressive joint stiffness and enlargement in the absence of
      inflammation.
    explanation: >-
      States both the tissue target and the absence of inflammation.
  - reference: PMID:22791401
    reference_title: "The diagnostic challenge of progressive pseudorheumatoid dysplasia (PPRD): a review of clinical features, radiographic features, and WISP3 mutations in 63 affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, signs of inflammation are absent and anti-inflammatory treatment
      is of little help
    explanation: >-
      Connects the absence of inflammation to the failure of anti-inflammatory
      therapy.
  downstream:
  - target: Joint Contracture, Deformity and Loss of Ambulation
    causal_link_type: DIRECT
    description: >-
      Cartilage loss across large joints and the spine causes contractures, gait
      disturbance and spinal deformity, culminating for many patients in loss of
      independent walking.
    evidence:
    - reference: PMID:26610319
      reference_title: Progressive Pseudorheumatoid Dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Over time, involvement of large joints and the spine causes significant
        joint contractures, gait disturbance, and scoliosis and/or kyphosis,
        resulting in abnormal posture and significant morbidity.
      explanation: >-
        States the progression from joint involvement to functional morbidity.
- name: Joint Contracture, Deformity and Loss of Ambulation
  biological_scale: ORGANISM
  description: >-
    The functional endpoint. Waddling gait occurred in 97.7% of the Turkish
    cohort and 47.7% lost independent walking at a median age of twelve.
  evidence:
  - reference: PMID:34919662
    reference_title: "Specific early signs and long-term follow-up findings of progressive pseudorheumatoid dysplasia (PPRD) in the Turkish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Waddling gait occurred in 97.7% of the patients. A total of 47.7% lost
      independent walking ability at the median age of 12 years.
    explanation: >-
      Quantifies both the gait abnormality and the loss of ambulation.

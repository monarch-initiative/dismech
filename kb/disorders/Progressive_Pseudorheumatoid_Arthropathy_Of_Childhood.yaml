notes: >-
  Naming hazard, recorded because this repository has already been bitten by it.
  "Progressive pseudorheumatoid dysplasia" names both this CCN6 recessive
  disorder and, loosely, the COL2A1 dominant Czech dysplasia.
  kb/disorders/Czech_Dysplasia.yaml carries a note that a deep-research report
  generated for that entry cited PMID:27587938, which is about the CCN6 disease.
  Every citation used here was checked against which of the two diseases the
  paper actually reports; PMID:27587938 is not cited in this entry, and the
  cross-reference is curated as a differential_diagnoses entry so the confusion
  is discoverable from either side.

  Deep research: eight wrong ontology bindings in one report. One OpenScientist
  report was generated (research/Progressive_Pseudorheumatoid_Arthropathy_Of_Childhood-deep-research-openscientist.md)
  and contributed most of the cohort literature used here. Its reference
  validation was clean — 29/29 verified, confabulation rate 0.0 — but its term
  validation set needs_review: true with 14 label mismatches, of which eight
  were CURIEs naming entirely different concepts. None was used:

  - MONDO:0009215 suggested as the disease term; it is Fanconi anemia
    complementation group A. This entry uses MONDO:0008827, the stub's term,
    which was independently confirmed by OAK lookup.
  - HP:0000944 for platyspondyly; it is Abnormal metaphysis morphology.
    HP:0000926 is used here.
  - HP:0100360 for enlarged interphalangeal joints; it is Upper-limb joint
    contracture. HP:0006237 is used here.
  - HP:0002826 for spinal canal stenosis; it is Halberd-shaped pelvis. No spinal
    stenosis phenotype is curated.
  - NCIT:C157866 for total hip arthroplasty; it is Gluten Free Diet.
    NCIT:C51691 is used here.
  - NCIT:C51765 for physical therapy; it is Bilateral Salpingectomy with
    Oophorectomy. NCIT:C15302 is used here.
  - NCIT:C1898 for calcitriol; it is Physical Carcinogens. CHEBI:17823 is used
    here as a therapeutic_agent.
  - UBERON:0002217 for articular cartilage and UBERON:0003656 for
    interphalangeal joint resolve to synovial joint and mesopodium bone
    respectively. No UBERON terms are bound in this entry.

  Every CURIE used in this entry was checked against the committed term cache or
  looked up directly with OAK, and none was copied from the report.

  Deliberately not curated. Camptodactyly, scoliosis and kyphosis are described
  in the sources and are real features, but the quotable sentences bundle them
  with other findings in a way that would make the phenotype-level snippet
  weaker than the ones used; they appear in progression prose instead. No
  histopathology section: the cited sources describe radiographic joint-space
  narrowing rather than tissue-level findings. No datasets. No model_organism
  animal_models entry, because the informative animal result here is the
  zebrafish morpholino work and the mouse null result, and both are curated as a
  discussion rather than as a model card — the mouse has no phenotype to link a
  modeled_mechanisms readout to, and the zebrafish reports pharyngeal cartilage
  morphology rather than the articular degeneration this disease is about.

  Frequency bands are given only for joint stiffness and waddling gait, where a
  denominator-backed figure or an "in the absence of inflammation" defining
  statement supports one.

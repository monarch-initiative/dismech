treatments:
- name: Total Joint Arthroplasty
  description: >-
    The one intervention in PPRD with substantial outcome data. In four
    genetically confirmed patients undergoing one-stage bilateral total hip
    arthroplasty, Harris Hip Score rose from 39.67 to 91.67 and SF-36 from 19.67
    to 71.33 over a mean 47.9 months, with no aseptic loosening. GeneReviews
    recommends arthroplasty for severe joint pain from advanced osteoarthritis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: total hip arthroplasty
    term:
      id: NCIT:C51691
      label: Arthroplasty
  target_mechanisms:
  - target: Joint Contracture, Deformity and Loss of Ambulation
    treatment_effect: BYPASSES
    description: >-
      Arthroplasty replaces the destroyed joint rather than acting on the
      cartilage-loss process, so it restores function without altering the
      disease. That is why it is a BYPASSES link, and why it does not stop
      progression at other joints.
    evidence:

name: Blepharocheilodontic Syndrome 1
creation_date: "2026-10-24T01:30:00Z"
category: Mendelian
synonyms:
- BCDS1
- CDH1 blepharo-cheilo-odontic syndrome
- blepharo-cheilo-odontic syndrome caused by mutation in CDH1
- CDH1-related blepharocheilodontic syndrome
disease_term:
  preferred_term: blepharocheilodontic syndrome 1
  term:
    id: MONDO:0054740
    label: blepharocheilodontic syndrome 1
parents:
- Blepharocheilodontic syndrome
- Ectodermal dysplasia syndrome
- Orofacial clefting syndrome
description: >-
  Blepharocheilodontic syndrome 1 (BCDS1, OMIM 119580) is the CDH1-associated
  form of blepharocheilodontic (BCD) syndrome, a rare autosomal dominant
  malformation syndrome of the eyelids, lips and teeth. The eyelid anomalies
  are euryblepharon, ectropion of the lower eyelids, lagophthalmos and
  distichiasis; the orofacial cleft is classically bilateral cleft lip and
  palate but is variable and can be absent within CDH1 families; the dental
  anomalies are oligodontia with conical and notched teeth. Sparse hair and
  other ectodermal signs occur, and imperforate anus, thyroid agenesis or
  hypothyroidism and neural tube defects have been reported in a few
  clinically diagnosed individuals. The disorder is caused by heterozygous
  CDH1 variants; CDH1 encodes E-cadherin, the principal adhesion molecule of
  epithelial adherens junctions. BCDS-associated CDH1 alleles are missense,
  small in-frame deletion and exon 9 splice-donor variants that alter the
  extracellular cadherin repeats, with missense changes clustering at the
  calcium-binding linker between EC1 and EC2. In cell assays these variants
  dimerize with wild-type E-cadherin and impair adherens junction formation in
  a dominant-negative manner, which is thought to disrupt epithelial
  morphogenesis of the eyelid, lip, palate and tooth germ. CDH1 is also the
  gene of hereditary diffuse gastric cancer, where the alleles are mostly
  truncating loss-of-function variants; whether BCDS1 carries a diffuse
  gastric cancer risk is unresolved, with one reported BCDS family member who
  developed diffuse gastric cancer and no tumours in other reported carriers.
notes: >-
  Scope: this entry covers only the CDH1-associated form. The parent concept
  blepharocheilodontic syndrome (MONDO:0007339) also includes the
  CTNND1-associated blepharocheilodontic syndrome 2 (MONDO:0040503), which is
  a separate disease with its own curation stub and is listed here only as a
  differential. OMIM 119580 was the clinical BCD syndrome entry before the
  genes were known, so much of the clinical literature (case reports from
  1996 to 2016) describes BCD syndrome without a molecular diagnosis and may
  include CTNND1 cases; evidence items drawn from those reports say so in
  their explanation, and features reported only there (imperforate anus,
  thyroid agenesis, hypothyroidism, taurodontism, maxillary hypoplasia with
  skeletal class III malocclusion) are not confirmed as CDH1-specific. A CDH1
  missense variant was also found by exome sequencing in a girl with cleft
  lip and palate, meningoencephalocele, tetralogy of Fallot and developmental
  delay (PMID:27566442); that report did not diagnose BCD syndrome, so the
  heart defect is not recorded as a BCDS1 phenotype here. MONDO lists
  "Elschnig syndrome" as a synonym of the parent concept MONDO:0007339, not
  of BCDS1, so it is not used as a synonym of this entry. Not cited, and why:
  the 2020 Genet Med letter "Confirmation of risk of cancer in
  blepharocheilodontic syndrome" (PMID:32483297), the 2013 Int J Cancer
  report on cleft lip and palate in hereditary diffuse gastric cancer
  families (PMID:23124477) and the 2004 report on surgical management of
  euryblepharon and nocturnal eyelid eversion (PMID:15220581) cached with no
  quotable text on the fetches made; they are leads for a curator with
  full-text access. No ClinGen gene-disease validity assertion for CDH1 and
  BCDS1 is present in the committed ClinGen ingest (the only CDH1 record there
  is for the diffuse gastric and lobular breast cancer syndrome), so
  gene_disease_validity is not recorded. No existing mechanism module covers
  adherens junction failure (the adhesion modules cover desmosomal and
  dermal-epidermal junction failure), so no conforms_to is declared.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous CDH1 variants cause the disorder. Cases are de novo or
    segregate dominantly in multigenerational families with variable
    expressivity; asymptomatic carrier parents have been described, so
    penetrance is incomplete.
  evidence:
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blepharocheilodontic syndrome (BCDS) consists of lagophthalmia, ectropion of the lower eyelids, distichiasis, euryblepharon, cleft lip/palate and dental anomalies and has autosomal dominant inheritance with variable expression."
    explanation: Autosomal dominant inheritance with variable expression in the molecular cohort.
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "performed exome sequencing for 5 families with de novo BCD syndrome cases"
    explanation: De novo occurrence in five of the eight families of the founding cohort.
  - reference: PMID:9511975
    reference_title: "Blepharo-Cheilo-Dontic (BCD) syndrome: report on four new patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variable expressivity and autosomal dominant inheritance were observed."
    explanation: >-
      Mother-to-son transmission in a clinically defined BCD family; the
      report predates molecular diagnosis.
  - reference: PMID:30661051
    reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first group also detected two asymptomatic parents carrying either a CDH1 or a CTNND1 mutation, suggesting incomplete penetrance of the genotype."
    explanation: A review summarising the Ghoumid cohort, which included unaffected carrier parents.
genetic:
- name: CDH1
  gene_term:
    preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Heterozygous missense, in-frame deletion or exon 9 splice-donor variant altering the extracellular cadherin repeats
  notes: >-
    BCDS-associated CDH1 variants reported in the two founding cohorts all
    affect the extracellular domain: missense changes at the EC1-EC2
    calcium-binding linker (Asp254, Asn256, Asp257) and elsewhere in EC2 and
    EC3, the in-frame deletion p.Val454del, and splice variants at the exon 9
    donor, which cause exon 9 skipping and loss of much of EC3. This contrasts
    with hereditary diffuse gastric cancer, in which almost all truncating
    variants act by complete loss of function. relationship_type CAUSATIVE is
    set because two independent cohorts identified CDH1 variants in most BCDS
    index patients and the variants were shown to be deleterious in functional
    assays; no ClinGen record exists to copy a validity tier from. CTNND1,
    which causes BCDS2, is not part of this entry.
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five CDH1 heterozygous missense mutations and three CTNND1 heterozygous truncating mutations leading to loss-of-function or haploinsufficiency."
    explanation: First report of heterozygous CDH1 variants in BCD syndrome.
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified heterozygous variants in two genes of the cadherin-catenin complex, CDH1, encoding E-cadherin, and CTNND1, encoding p120 catenin delta1 in 15 of 17 BCDS index patients"
    explanation: Independent replication of CDH1 as a BCDS gene.
  - reference: PMID:36552944
    reference_title: "A Novel CDH1 Variant Identified in a Chinese Family with Blepharocheilodontic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous missense variant c.1198G>A (p.Asp400Asn) in the CDH1 gene in the proband and his mother with BCD syndrome."
    explanation: A further CDH1 family with co-segregation.
  - reference: PMID:41563506
    reference_title: "Prenatal diagnosis of Blepharo-Cheilo-Dontic syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After sonographic diagnosis of the bilateral cleft lip and palate and the persistent open eyelids, amniocentesis with subsequent molecular genetics confirmed the sonographically presumed de-novo mutation of the CDH1 gene"
    explanation: A prenatally diagnosed de novo CDH1 case.
  - reference: PMID:30661051
    reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of note, all CDH1 mutations described in this context affect the E-cadherin extracellular domain, possibly impairing its ability to homodimerise and, consequently, interfering with its adhesive function."
    explanation: All BCDS-associated CDH1 variants affect the extracellular domain.
  - reference: PMID:39596675
    reference_title: "The Recurrent E-Cadherin (CDH1) Mutation c.760G>A Causes Orofacial Clefts but Does Not Predispose to Hereditary Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations associated with the HDGC spectrum include almost all cadherin truncating variants (stop codons, frameshifts, splicing) suggesting a complete loss-of-function as a disease mechanism"
    explanation: Contrasts the allele class of hereditary diffuse gastric cancer with the extracellular missense and splice alleles of BCDS.
  variants:
  - name: c.760G>A (p.Asp254Asn)
    description: >-
      A recurrent missense variant at the first residue of the conserved
      Asp254-Gln255-Asn256-Asp257 calcium-binding linker between EC1 and EC2,
      reported in seven BCDS cases in the Kievit cohort and also segregating
      in families with nonsyndromic cleft lip with or without cleft palate. In
      a review of 27 heterozygous carriers from seven families, an orofacial
      cleft was present in all 16 males and 5 of 11 females, and no carrier
      had a gastrointestinal tumour, including three carriers aged 68 to 77
      years. The nonsyndromic cleft study that first reported it concluded
      that CDH1 haploinsufficiency was the likely mechanism, which differs
      from the dominant-negative interpretation of the BCDS functional work.
    type: missense variant
    gene:
      preferred_term: CDH1
      term:
        id: hgnc:1748
        label: CDH1
    evidence:
    - reference: PMID:39596675
      reference_title: "The Recurrent E-Cadherin (CDH1) Mutation c.760G>A Causes Orofacial Clefts but Does Not Predispose to Hereditary Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We determined a significant sex preponderance for this variant regarding CL/P: all 16 male and 5 of 11 female heterozygotes presented with CL/P."
      explanation: Sex-dependent penetrance of clefting for this allele.
    - reference: PMID:39596675
      reference_title: "The Recurrent E-Cadherin (CDH1) Mutation c.760G>A Causes Orofacial Clefts but Does Not Predispose to Hereditary Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This review of 27 mutation carriers, including 3 who were 68, 70, and 77 years of age, indicates that c.760G>A does not confer an increased risk for HDGC."
      explanation: No hereditary diffuse gastric cancer among 27 carriers of this allele.
    - reference: PMID:26123647
      reference_title: "Rare Variants in the Epithelial Cadherin Gene Underlying the Genetic Etiology of Nonsyndromic Cleft Lip with or without Cleft Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three probably pathogenic variants (c.760G>A ... segregated according to autosomal dominant inheritance in four nonsyndromic cleft lip with or without cleft palate (NSCL/P) families"
      explanation: >-
        The same allele segregates dominantly in nonsyndromic cleft families,
        showing that its expression ranges from isolated clefting to BCDS.
    - reference: PMID:26123647
      reference_title: "Rare Variants in the Epithelial Cadherin Gene Underlying the Genetic Etiology of Nonsyndromic Cleft Lip with or without Cleft Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CDH1 contributes to NSCL/P with mainly rare, moderately penetrant variants, and CDH1 haploinsufficiency is the likely etiological mechanism."
      explanation: >-
        The authors' mechanistic conclusion for nonsyndromic cleft alleles,
        including this one; it is an alternative to the dominant-negative
        model and is recorded here rather than on the mechanism node.
  - name: c.1198G>A (p.Asp400Asn)
    description: >-
      A missense variant in the extracellular cadherin repeats that
      co-segregated with BCD syndrome in a Chinese mother and son who had
      eyelid and dental anomalies, sparse hair and no orofacial cleft.
    type: missense variant
    gene:
      preferred_term: CDH1
      term:
        id: hgnc:1748
        label: CDH1
    evidence:
    - reference: PMID:36552944
      reference_title: "A Novel CDH1 Variant Identified in a Chinese Family with Blepharocheilodontic Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a novel heterozygous missense variant c.1198G>A (p.Asp400Asn) in the CDH1 gene in the proband and his mother with BCD syndrome."
      explanation: Identification and segregation of the variant.
  - name: c.1320+1G>C
    description: >-
      A splice-donor variant at intron 9 that induces exon 9 skipping and
      removes a large part of EC3; one of several BCDS variants at this donor
      site.
    type: splice donor variant
    gene:

    description: Corrects the structural consequences of abnormal eyelid development.
  evidence:
  - reference: PMID:11476703
    reference_title: "Management of eyelid anomalies associated with Blepharo-cheilo-dontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The essential role for the p120Ctn complex in fusion of the lip and palate in vivo was confirmed by conditional ablation of Ctnnd1 in oral epithelia in mice."
      explanation: >-
        Oral-epithelial loss of the E-cadherin partner p120 catenin causes
        clefting in mice; indirect for CDH1 because the ablated gene is the
        partner, not CDH1 itself.
  - target: Defective Odontogenesis
    description: >-

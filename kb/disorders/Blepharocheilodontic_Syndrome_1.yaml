pathophysiology:
- name: Heterozygous CDH1 Extracellular Domain Variant
  description: >-
    A heterozygous germline CDH1 variant alters the extracellular cadherin
    repeats of E-cadherin: missense changes at the conserved calcium-binding
    linker between EC1 and EC2 or at other conserved EC residues, the
    in-frame deletion p.Val454del in EC3, or exon 9 splice-donor variants
    that skip exon 9 and remove much of EC3. Each such change is expected to
    perturb calcium binding or ectodomain conformation and so the ability of
    E-cadherin to form adhesive dimers.
  biological_scale: MOLECULAR
  genetic_context:
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Germline, de novo or inherited. DOMINANT_NEGATIVE follows the Kievit
      cell assays in which BCDS variants dimerized with wild-type E-cadherin
      and suppressed junction formation. Ghoumid et al instead reported
      accelerated degradation of the variant protein, which would reduce the
      amount of E-cadherin; the two observations are not mutually exclusive
      (see the discussion cdh1_bcds_allele_mechanism).
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  evidence:
  - reference: PMID:30661051
    reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "both studies detected missense mutations at the conserved Asp254-Gln255-Asn-256-Asp257 'linker' region that comprises a calcium ion-binding site between extracellular domains 1 and 2"
    explanation: BCDS missense variants cluster at the EC1-EC2 calcium-binding linker.
  - reference: PMID:36552944
    reference_title: "A Novel CDH1 Variant Identified in a Chinese Family with Blepharocheilodontic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In prior studies, all BCD-associated missense variations were found at highly conserved extracellular cadherin-type repeats of CDH1, which directly interact with Ca2+ ion"
    explanation: All BCDS missense variants lie in conserved, calcium-binding extracellular repeats.
  - reference: PMID:32260281
    reference_title: "CDH1 Mutation Distribution and Type Suggests Genetic Differences between the Etiology of Orofacial Clefting and Gastric Cancer."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Five missense variants associated with CL/P occur in this region, as compared to none of the likely pathogenic/pathogenic HDGC variants considered in this study."
    explanation: >-
      A structural mapping of curated variants shows that the EC1-EC2 linker
      (amino acids 253 to 260) carries cleft-associated but no
      cancer-associated missense variants.
  downstream:
  - target: Mutant E-cadherin Dimerization with Wild-Type Protein
    description: >-
      The variant protein pairs with wild-type E-cadherin, so that the altered
      ectodomain is carried into adhesive complexes formed with the product of
      the normal allele.
    causal_link_type: DIRECT
  - target: Accelerated E-cadherin Degradation
    description: >-
      In the Ghoumid functional studies the variant protein accumulated
      perinuclearly and was degraded faster.
    causal_link_type: DIRECT
- name: Mutant E-cadherin Dimerization with Wild-Type Protein
  description: >-
    E-cadherin forms adhesive dimers through its ectodomain, which is
    rigidified by calcium bound at each inter-domain linker. In cells
    co-expressing tagged wild-type and BCDS variant E-cadherin, the variant
    dimerized with the wild-type protein and interfered with adherens junction
    formation, whereas hereditary diffuse gastric cancer variants tested for
    comparison did not, which led the authors to define BCDS variants as a
    distinct, dominant-negative class.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  molecular_functions:
  - preferred_term: E-cadherin homophilic binding (variant and wild-type heterodimers)
    term:
      id: GO:0098641
      label: cadherin binding involved in cell-cell adhesion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional experiments in zebrafish and human cells showed that the CDH1 variants impair the cell adhesion function of the cadherin-catenin complex in a dominant-negative manner."
    explanation: >-
      The dominant-negative effect was shown in human cell co-expression
      experiments, with supporting zebrafish injections in the same study.
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional experiments reported here indicated the BCDS variants comprise a distinct class of CDH1 variants."
    explanation: BCDS variants behave differently from cancer-associated CDH1 variants.
  - reference: PMID:30661051
    reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "in the case of BCDS variants, mutant proteins dimerise with WT proteins and interfere with the formation of adherens junctions, impairing cell-cell adhesion."
    explanation: Review summary of the Kievit co-transfection experiment.
  - reference: PMID:32260281
    reference_title: "CDH1 Mutation Distribution and Type Suggests Genetic Differences between the Etiology of Orofacial Clefting and Gastric Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Strong and stable adhesion requires chelation of Ca2+ ions in each linker region that separates the EC domains"
    explanation: Why linker substitutions are expected to disable the adhesive ectodomain.
  downstream:
  - target: Impaired Epithelial Adherens Junction Formation
    description: >-
      Heterodimers containing the variant ectodomain suppress the adhesive
      activity contributed by the wild-type allele.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30661051
      reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "in the case of BCDS variants, mutant proteins dimerise with WT proteins and interfere with the formation of adherens junctions, impairing cell-cell adhesion."
      explanation: Dimerization with wild-type protein is the step that interferes with junction formation.
- name: Accelerated E-cadherin Degradation
  description: >-
    In the Ghoumid functional analysis, BCDS CDH1 missense variants behaved
    like hereditary diffuse gastric cancer missense variants, accumulating
    perinuclearly with accelerated E-cadherin degradation, which would lower
    the amount of functional E-cadherin at the membrane.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  biological_processes:
  - preferred_term: E-cadherin protein catabolism
    term:
      id: GO:0030163
      label: protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of CDH1 mutations confirmed their deleterious impact and suggested accelerated E-cadherin degradation."
    explanation: Cell-based functional analysis of the BCDS CDH1 missense variants.
  - reference: PMID:30661051
    reference_title: "Clinical spectrum and pleiotropic nature of CDH1 germline mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "While Ghoumid et al reported that BCDS CDH1 missense variants behave similarly to HDGC-associated ones, with perinuclear accumulation and accelerated E-cadherin degradation"
    explanation: Review summary contrasting the two functional interpretations.
  downstream:
  - target: Impaired Epithelial Adherens Junction Formation
    description: Less E-cadherin reaches or remains at the membrane to form junctions.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Epithelial Adherens Junction Formation
  description: >-
    E-cadherin is the core adhesive component of epithelial adherens
    junctions and is linked through p120 catenin (CTNND1) and other catenins
    to the cytoskeleton; p120 catenin binding prevents E-cadherin endocytosis.
    BCDS variants impair the cell adhesion function of the cadherin-catenin
    complex, weakening epithelial cell-cell adhesion. That the BCDS2 gene
    CTNND1 encodes the E-cadherin partner p120 catenin places both forms of
    BCD syndrome on the same adhesion complex.
  biological_scale: CELLULAR
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  biological_processes:
  - preferred_term: adherens junction assembly
    term:
      id: GO:0034333
      label: adherens junction assembly
    modifier: DECREASED
  - preferred_term: cell-cell adhesion mediated by cadherin
    term:
      id: GO:0044331
      label: cell-cell adhesion mediated by cadherin
    modifier: DECREASED
  cell_types:
  - preferred_term: embryonic epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  evidence:
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CDH1 plays an essential role in epithelial cell adherence; CTNND1 binds to CDH1 and controls the stability of the complex."
    explanation: Places both BCDS genes in the epithelial adhesion complex.
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "The encoded protein, p120ctn, prevents E-cadherin endocytosis and stabilizes its localization at the cell surface."
    explanation: The partner protein stabilises membrane E-cadherin, linking the BCDS1 and BCDS2 genes mechanistically.
  downstream:
  - target: Defective Eyelid Morphogenesis
    description: >-
      Reduced epithelial adhesion is proposed to disturb eyelid development;
      conditional Cdh1 and Ctnnd1 deletion in animal models produces features
      reminiscent of BCD syndrome. The tissue-level steps are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28301459
      reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "Conditional deletion of Cdh1 and Ctnnd1 in various animal models induces features reminiscent of BCD syndrome and underlines critical role of the E-cadherin-p120ctn interaction in eyelid, craniofacial, and tooth development."

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Strong E-cadherin staining seen in all oral epithelia (basal and periderm layers)."
    explanation: Immunostaining of human fetal palatal tissue at the time of secondary palate fusion.

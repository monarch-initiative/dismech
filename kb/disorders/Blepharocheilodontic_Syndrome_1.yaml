diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis is clinical, prompted by the combination of eyelid, lip and
    dental anomalies, and confirmed by finding a heterozygous CDH1 variant;
    CTNND1 should be tested in parallel because it causes the clinically
    overlapping BCDS2. The founding cases were found by exome sequencing.
    Cleft lip and palate with persistently open eyelids on fetal ultrasound
    should prompt examination of the eyelids and genetic testing.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "performed exome sequencing for 5 families with de novo BCD syndrome cases"
    explanation: Exome sequencing identified the gene.
  - reference: PMID:39442179
    reference_title: "Periocular manifestations of blepharocheilodontic syndrome and their management: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children that present with cleft lip and palate, dental, and eyelid abnormalities should be suspected to have BCD syndrome."
    explanation: The clinical triad that should prompt testing.
  - reference: PMID:41563506
    reference_title: "Prenatal diagnosis of Blepharo-Cheilo-Dontic syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once a facial cleft is diagnosed prenatally, an accurate examination of the fetal eylids should be performed"
    explanation: Prenatal examination of the eyelids in fetuses with a facial cleft.
treatments:
- name: Eyelid reconstruction
  description: >-
    Surgical correction of ectropion, eyelid retraction, euryblepharon and
    lagophthalmos (lateral tarsal strips, retractor disinsertion,
    myocutaneous advancement, canthoplasty, tarsorrhaphy and midface
    augmentation) reduces exposure morbidity and improves appearance; several
    procedures may be needed.
  treatment_term:
    preferred_term: eyelid reconstruction
    term:
      id: NCIT:C157852
      label: Eyelid Reconstruction
  therapeutic_modality: SURGERY
  target_mechanisms:

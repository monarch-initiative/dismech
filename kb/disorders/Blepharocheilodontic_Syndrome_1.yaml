- name: Diffuse Gastric Cancer Predisposition
  description: >-
    In hereditary diffuse gastric cancer, a germline CDH1 loss-of-function
    allele is followed by somatic loss of the second allele or promoter
    methylation. Whether BCDS alleles predispose in the same way is
    unresolved: one individual from a CDH1 BCDS family developed diffuse
    gastric cancer while affected relatives did not, no gastric or breast
    cancers were seen in the Kievit BCDS cohort, and no tumours were reported
    in 27 carriers of the recurrent p.Asp254Asn allele.
  biological_scale: CELLULAR
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  cell_types:
  - preferred_term: gastric epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  evidence:
  - reference: PMID:32302040
    reference_title: "CDH1-related blepharocheilodontic syndrome is associated with diffuse gastric cancer risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first case of diffuse gastric cancer in an individual with familial blepharocheilodontic syndrome (BCD) due to a germline CDH1 likely pathogenic variant."
    explanation: A single BCDS family member with diffuse gastric cancer.
  - reference: PMID:39596675
    reference_title: "The Recurrent E-Cadherin (CDH1) Mutation c.760G>A Causes Orofacial Clefts but Does Not Predispose to Hereditary Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The loss of the other allele and promoter methylation occur as second genetic hits in CDH1-related HDGC"
    explanation: The two-hit mechanism established for hereditary diffuse gastric cancer.
  - reference: PMID:29348693
    reference_title: "Variants in members of the cadherin-catenin complex, CDH1 and CTNND1, cause blepharocheilodontic syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "no cases of gastric or breast cancer have been reported in our BCDS cases"
    explanation: >-
      No cancer in the Kievit BCDS cohort; indirect because many carriers were
      children or young adults.
  - reference: PMID:39596675
    reference_title: "The Recurrent E-Cadherin (CDH1) Mutation c.760G>A Causes Orofacial Clefts but Does Not Predispose to Hereditary Cancer."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "This review of 27 mutation carriers, including 3 who were 68, 70, and 77 years of age, indicates that c.760G>A does not confer an increased risk for HDGC."
    explanation: >-
      No cancer risk for the most frequently reported BCDS allele; indirect
      because it concerns one allele and some carriers had nonsyndromic
      clefts.
  downstream:
  - target: Stomach cancer
    description: >-
      Somatic inactivation of the remaining CDH1 allele in gastric epithelium
      is the established route to diffuse gastric cancer in CDH1 carriers; it
      has not been studied in the BCDS tumour.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

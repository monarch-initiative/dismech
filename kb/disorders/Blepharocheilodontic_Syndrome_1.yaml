- name: Failed Lip and Palate Fusion
  description: >-
    Failure of fusion of the facial processes and palatal shelves produces an
    orofacial cleft, classically bilateral cleft lip and palate. E-cadherin is
    strongly expressed in the basal and periderm layers of the human fetal
    oral epithelium at the time of palatal fusion. Clefting is variable: it
    was absent in a two-generation CDH1 family, and for the recurrent
    p.Asp254Asn allele it is more penetrant in males.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: primary palate and upper lip development
    term:
      id: GO:1903929
      label: primary palate development
    modifier: ABNORMAL
  - preferred_term: secondary palate development
    term:
      id: GO:0062009
      label: secondary palate development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29805042

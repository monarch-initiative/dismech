    explanation: >-
      Consensus guideline for hereditary diffuse gastric cancer CDH1
      carriers; indirect because it does not address BCDS alleles.
differential_diagnoses:
- name: Blepharocheilodontic syndrome 2
  description: >-
    The CTNND1-associated form, caused by heterozygous CTNND1 variants in the
    gene encoding p120 catenin, the E-cadherin binding partner. It shares the
    eyelid, cleft and dental features.
  disease_term:
    preferred_term: blepharocheilodontic syndrome 2
    term:
      id: MONDO:0040503
      label: blepharocheilodontic syndrome 2
  distinguishing_features:
  - The causal gene is CTNND1 rather than CDH1; molecular testing distinguishes the two.
  - The phenotype appeared more severe with CDH1 variants in the founding cohort.
  - CTNND1 truncating variants can additionally cause cardiac, limb and neurodevelopmental anomalies.
  evidence:
  - reference: PMID:28301459
    reference_title: "Blepharocheilodontic syndrome is a CDH1 pathway-related disorder due to mutations in CDH1 and CTNND1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the phenotype seems to appear more severe in case of CDH1 mutations"
    explanation: Tentative genotype-phenotype difference between the two genes.
  - reference: PMID:32196547
    reference_title: "Novel truncating mutations in CTNND1 cause a dominant craniofacial and cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting with craniofacial dysmorphisms including cleft palate and hypodontia, as well as congenital cardiac anomalies, limb dysmorphologies and neurodevelopmental disorders"
    explanation: The broader multisystem phenotype reported with CTNND1 truncating variants.
- name: CDH1-related diffuse gastric and lobular breast cancer syndrome
  description: >-
    The allelic cancer predisposition syndrome caused mostly by truncating
    CDH1 loss-of-function variants, curated as
    `CDH1-Related_Hereditary_Diffuse_Gastric_Cancer`. Cleft lip and palate
    occur in some of its families, and the boundary with BCDS1 for cancer risk
    is unresolved.
  disease_term:
    preferred_term: CDH1-related diffuse gastric and lobular breast cancer syndrome
    term:
      id: MONDO:0100488
      label: CDH1-related diffuse gastric and lobular breast cancer syndrome
  distinguishing_features:
  - Cancer-predisposition alleles are mostly truncating, whereas BCDS alleles are extracellular missense, in-frame or exon 9 splice variants.
  - Eyelid malformation and oligodontia are not features of the cancer syndrome.
  evidence:
  - reference: PMID:32260281
    reference_title: "CDH1 Mutation Distribution and Type Suggests Genetic Differences between the Etiology of Orofacial Clefting and Gastric Cancer."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We have identified a statistically significant difference in the frequency of missense versus nonsense mutations in HDGC compared with CL/P"
    explanation: Allele classes differ between the cancer and clefting phenotypes.
discussions:
- discussion_id: cdh1_bcds_allele_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do BCDS CDH1 variants act mainly as dominant negatives, by accelerated
    degradation, or both, and why do they cause a developmental syndrome
    rather than (or in addition to) cancer predisposition?
  attaches_to:
  - pathophysiology#Heterozygous CDH1 Extracellular Domain Variant
  - pathophysiology#Mutant E-cadherin Dimerization with Wild-Type Protein
  - pathophysiology#Accelerated E-cadherin Degradation
  rationale: >-
    Kievit et al showed dominant-negative interference with junction
    formation by co-expressing variant and wild-type E-cadherin, while
    Ghoumid et al found that the same class of missense variants behaved like
    cancer-associated variants with accelerated degradation, and a
    nonsyndromic cleft study concluded haploinsufficiency for alleles
    including p.Asp254Asn. Neither BCDS study modelled the developing eyelid,
    lip or tooth germ directly. Variant surveys are consistent with an
    allele-class split (linker missense for clefting, truncating for cancer),
    but the split is not absolute. A link from E-cadherin loss to
    beta-catenin release and Wnt or epithelial-mesenchymal transition
    signalling is plausible from cancer biology but has not been shown in
    BCDS tissue, so it is not encoded as a mechanism node.
  proposed_experiments:
  - experiment_id: cdh1_bcds_side_by_side_assay
    name: Side-by-side co-expression and stability assay
    description: >-
      Express each BCDS variant alone and with wild-type CDH1 at 1:1 in
      E-cadherin-null epithelial cells, alongside truncating and missense
      hereditary diffuse gastric cancer variants, and measure surface
      stability, degradation rate, junction formation and aggregation.
  - experiment_id: cdh1_bcds_knockin_mouse
    experiment_design: TARGETED_PERTURBATION
    name: Heterozygous Cdh1 linker knock-in mouse
    description: >-
      Generate heterozygous knock-in mice for the Asp254Asn linker variant and
      examine eyelid closure, lip and palate fusion and tooth development.
- discussion_id: cdh1_bcds_cancer_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the lifetime diffuse gastric and lobular breast cancer risk for
    carriers of BCDS-associated CDH1 variants, and does it differ by allele?
  attaches_to:
  - pathophysiology#Diffuse Gastric Cancer Predisposition
  - phenotypes#Stomach cancer
  rationale: >-
    One case of diffuse gastric cancer has been reported in a CDH1 BCDS
    family, whereas no cancer was reported in the Kievit cohort or in 27
    carriers of the recurrent p.Asp254Asn allele. Many reported BCDS carriers
    are children or young adults, so absence of cancer is weak evidence. The
    answer determines whether endoscopic surveillance or prophylactic
    gastrectomy should be offered.

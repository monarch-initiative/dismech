- name: Defective Odontogenesis
  description: >-
    Tooth agenesis is severe and unusual in pattern, involving teeth that are
    normally resistant to agenesis such as the upper central incisors and
    canines, with conical, notched and taurodont teeth; primary teeth can also
    be absent. Conditional ablation of E-cadherin in mouse oral epithelium and
    its enamel organ progeny produces tooth anomalies, although of root and
    pulp rather than agenesis.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: odontogenesis of dentin-containing tooth

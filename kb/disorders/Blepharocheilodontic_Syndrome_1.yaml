    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple surgical procedures including lateral canthoplasty, tarsorrhaphy, and midface augmentation may be necessary for correction of eyelid malposition and achieving cosmetic and functional improvements."
    explanation: Several procedures may be required.

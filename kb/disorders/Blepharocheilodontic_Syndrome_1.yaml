    directness: INDIRECT
    snippet: "conditional ablation of E-cadherin in the oral epithelium, and its progeny, results in dental anomalies involving elongation of the molar root, shrinkage of the pulp space, and alterations of the periapical area, including cementum hyperplasia"
    explanation: >-

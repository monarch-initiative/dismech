- name: Luminal Obliteration and Loss of Conducting Lymphatics
  description: >-
    The end state of the fibrosis: vessels that no longer carry lymph. Biopsy
    series count fewer lymphatic vessels in affected skin, and a subdermal
    conducting lymphatic in an affected foot was shown to be fibrosed and
    impermeable to injected dye - the functional proof, not just the
    histological one.
  biological_scale: TISSUE
  downstream:
  - target: Lymphatic Obstruction and Lymph Stasis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2604475
    reference_title: "Soil particles in the tissues of the foot in endemic elephantiasis of the lower legs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The conducting lymphatic in the subdermal tissue is found to be impermeable to Patent Blue Violet dye and to be fibrosed."
    explanation: >-
      The functional demonstration that the fibrosed vessel no longer conducts -
      dye impermeability alongside the histological fibrosis.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage 3-5 disease was histopathologically characterised by epidermal and dermal thickening, verrucous acanthosis, inflammatory cell infiltrates (predominantly lymphoplasmacytic), dilated and ectatic and a reduced number of lymphatic vessels, eccrine ductal hyperplasia, and sclerosis such as thickened collagen bundles."
    explanation: >-
      The advanced-stage histopathology, which reports a reduced number of
      lymphatic vessels alongside the sclerosis.

- name: Lymphatic Obstruction and Lymph Stasis
  description: >-
    Lymph cannot leave the limb. The clinical result is swelling that begins at
    the feet and progressively involves the legs, bilateral in about seven of
    eight patients, frequently asymmetric between them, and in almost all cases
    staying below the knee.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lower limb
    term:
      id: UBERON:0008784
      label: lower limb segment
  downstream:
  - target: Dermal Sclerosis and Nodule Formation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mineral particles in red-clay soils are absorbed through the skin of the foot and engulfed by macrophages in the lower limb lymphatic system, inducing an inflammatory response in the lymphatic vessels, which results in fibrosis and obstruction of the vessel lumen."
    explanation: Names lymphatic obstruction as the terminal step of the mechanism.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 251 (86.9%) patients, both legs were affected by podoconiosis and in 38 (13.1%) only one leg was affected."
    explanation: >-
      The laterality figures behind the "bilateral but not universal" claim,
      from a 289-patient series.

- name: Dermal Sclerosis and Nodule Formation
  description: >-
    Chronic stasis lays down collagen in the dermis, producing thickened
    sclerotic bundles and the firm nodules of established disease. Nodules are
    present in about two fifths of patients and are what nodulectomy removes.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin of the lower leg and foot
    term:
      id: UBERON:0001511
      label: skin of leg
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Epidermal Hyperkeratosis and Barrier Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage 3-5 disease was histopathologically characterised by epidermal and dermal thickening, verrucous acanthosis, inflammatory cell infiltrates (predominantly lymphoplasmacytic), dilated and ectatic and a reduced number of lymphatic vessels, eccrine ductal hyperplasia, and sclerosis such as thickened collagen bundles."
    explanation: >-
      The dermal half of the advanced-stage histopathology - thickening and
      sclerosis with thickened collagen bundles.
  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermal collagen bundles were thickened, and elastic fibers were dramatically reduced."
    explanation: >-
      The second biopsy series' account of the same change, adding the elastic
      fibre loss.

- name: Epidermal Hyperkeratosis and Barrier Failure
  description: >-
    The epidermis thickens into verrucous acanthosis and the warty "mossy"
    plaques the disease is named for, present in about three quarters of
    patients. Curated separately from the dermal change because it is a
    different tissue layer and, more importantly, a different claim: this is
    where the skin stops being a barrier, and it is the node that leads to the
    acute attacks.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin of the lower leg and foot
    term:
      id: UBERON:0001511
      label: skin of leg
  downstream:
  - target: Acute Dermatolymphangioadenitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fissured, hyperkeratotic skin is the portal of entry for the skin flora
      that precipitate the acute attacks.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "220 (77.5%) patients had warty lesions, 114 (39.4%) had nodules."
    explanation: The frequencies of warty lesions and nodules in a 289-patient series.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage 3-5 disease was histopathologically characterised by epidermal and dermal thickening, verrucous acanthosis, inflammatory cell infiltrates (predominantly lymphoplasmacytic), dilated and ectatic and a reduced number of lymphatic vessels, eccrine ductal hyperplasia, and sclerosis such as thickened collagen bundles."
    explanation: >-
      The epidermal half of the same histopathology - epidermal thickening and
      verrucous acanthosis.
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include dermal nodules and a rough, velvet-like appearance to the skin known as mossy changes which are pathognomonic for the disease."
    explanation: >-
      States that the mossy change is pathognomonic, which is why this node
      carries diagnostic weight rather than only descriptive weight.

- name: Acute Dermatolymphangioadenitis
  description: >-
    Recurrent episodes of fever, pain, erythema and abrupt worsening of the
    swelling, precipitated by bacteria entering through fissured skin. Each
    episode damages the lymphatics further, so the entry models it as feeding
    back into the fibrotic lesion rather than as a terminal complication. It is
    also the outcome every trial in this disease is powered on, because it is
    what patients lose working days to.
  biological_scale: ORGANISM
  downstream:
  - target: Lymphatic Vessel Wall Collagenization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The self-reinforcing loop. Repeated acute inflammation is held to
      accelerate the underlying fibrosis; the step is described consistently in
      the clinical literature but has not been dissected, so it is curated with
      unknown intermediates.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased episodes of ADLA were significantly associated with stage 3-5 podoconiosis (P = 0.002), while burning pain in the feet was more common in stage 1 or 2 podoconiosis."
    explanation: >-
      Ties attack frequency to advanced stage, which is the observation behind
      the feedback edge - and notes that burning pain instead marks early
      disease.
  - reference: PMID:37612446
    reference_title: "Tropical leg lymphedema caused by podoconiosis is associated with increased colonisation by anaerobic bacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphedema can lead to skin lesions, which can serve as entry points for bacteria that may cause ADLA attacks leading to progression of the lymphedema."
    explanation: >-
      States the skin-breach-to-attack-to-progression sequence, which is the
      loop this node closes. The source hedges it ("can", "may") and so does
      this entry: the edge is curated INDIRECT_UNKNOWN_INTERMEDIATES.
  - reference: PMID:37612446
    reference_title: "Tropical leg lymphedema caused by podoconiosis is associated with increased colonisation by anaerobic bacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We revealed a positive correlation between increasing lymphedema severity and non-commensal anaerobic bacteria, especially Anaerococcus provencensis, as well as a negative correlation with the presence of Corynebacterium, a constituent of normal skin flora."
    explanation: >-
      Identifies what colonises the affected skin and how it tracks severity -
      anaerobes up, normal commensal Corynebacterium down. The correlation is
      with stage, so it does not establish direction on its own.


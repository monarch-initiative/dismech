name: Podoconiosis
creation_date: "2026-09-07T00:00:00Z"
category: Environmental Lymphatic Disease
parents:
- Lymphedema
- Neglected Tropical Disease
disease_term:
  preferred_term: podoconiosis
  term:
    id: MONDO:0005425
    label: podoconiosis
synonyms:
- Endemic non-filarial elephantiasis
- Mossy foot
- Geochemical elephantiasis
description: >-
  Podoconiosis is a non-infectious lymphoedema of the lower legs caused by years
  of barefoot contact with red-clay soil derived from alkalic volcanic rock. It
  is the clearest gene-environment disease among the neglected tropical
  diseases: there is no pathogen and no vector, the exposure is a mineral, and
  the susceptibility is an HLA class II haplotype. Endemic soils carry
  kaolinite, smectite, quartz, iron oxides and trace beryllium and zirconium;
  kaolinite is the species actually identified in human lymph node tissue, and
  which of them is the trigger is unknown. Colloid-sized silicate particles
  cross the plantar skin, are taken up by dermal macrophages, and reach the
  lower-limb lymphatics. In people carrying the risk haplotypes
  this is followed by a sustained inflammatory response - read as CD4
  T-cell-mediated from the class II association, though no antigen-specific
  response has been demonstrated - that collagenizes and obliterates the
  lymphatic lumen. The swelling starts at the feet, is bilateral in about seven
  of eight patients, is often asymmetric between the legs, and in almost all
  cases stays below the knee. The skin thickens into the warty, nodular "mossy"
  changes the disease is named
  for it, and recurrent bacterial acute dermatolymphangioadenitis drives further
  lymphatic damage in a self-reinforcing loop. Roughly four million people are
  affected across some 32 countries, about a quarter of them in Ethiopia. The
  disease is entirely preventable with shoes, and its early stages are
  reversible; established fibrosis is not.
pathophysiology:
- name: Chronic Barefoot Contact with Alkalic Volcanic Clay Soil
  description: >-
    The necessary exposure. Subsistence farmers working barefoot on red clay
    weathered from alkalic volcanic bedrock accumulate contact over years to
    decades. The soil is the operative agent, not the terrain: endemicity tracks
    bedrock geochemistry and the pedogenic conditions that produce these clays -
    high altitude and high rainfall - rather than any vector distribution.
  biological_scale: ORGANISM
  downstream:
  - target: Transdermal Entry of Silicate Mineral Particles
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis is a tropical lymphedema resulting from long-term barefoot exposure to red-clay soil derived from volcanic rock. The World Health Organization recently designated it as a neglected tropical disease. Podoconiosis develops in only a subgroup of exposed people, and studies have shown familial clustering with high heritability (63%)."
    explanation: >-
      States the exposure and its duration, which is what this node records, and
      the heritability figure that makes the exposure necessary rather than
      sufficient.
  - reference: PMID:40623043
    reference_title: "Associations between podoconiosis and pedogenic factors globally - A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine studies found a correlation between podoconiosis occurrence and regions with underlying alkalic volcanic bedrock, and six linked pedogenic factors (altitude and rainfall) with disease occurrence. Several studies linked specific soil mineralogy and geochemistry with endemic regions, including an abundance of phyllosilicate clay minerals, quartz, and trace elements, notably iron, beryllium and zirconium."
    explanation: >-
      The systematic review's bedrock and pedogenic correlations, and the
      mineral inventory that the next node's particles come from.
  - reference: PMID:37719165
    reference_title: "Epidemiology of podoconiosis in sub-Saharan Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Walking barefoot adjusted odd ratio (AOR) 5.35 (95% CI: 1.65, 9.05), p = 0.001, not washing feet with soap and water regularly AOR 2.8 (95% CI: 1.16, 4.44, p = 0.001), and an increased age AOR 2.23 (95% CI: 1.25, 5.58) were factors significantly associated with the prevalence of podoconiosis."
    explanation: >-
      The effect estimate for the behaviour itself - walking barefoot carries an
      adjusted odds ratio above five in pooled sub-Saharan data.

- name: Transdermal Entry of Silicate Mineral Particles
  description: >-
    Colloid-sized silicate particles cross the plantar and dorsal skin of the
    foot and lodge in the dermis. Their identity is partly known and partly not:
    kaolinite predominates in lymph node microanalysis at 0.2-2 micrometres, and
    endemic soils are enriched in smectite, mica, quartz, iron oxides, beryllium
    and zirconium - but which constituent is the operative trigger has never
    been established.
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis of the foot
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Macrophage Phagocytosis of Mineral Particles
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2604475
      reference_title: "Soil particles in the tissues of the foot in endemic elephantiasis of the lower legs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of microparticles of clay is demonstrated in the dermis of the foot in a patient with endemic elephantiasis. The particles are seen to be in the phagosomes of macrophages or in the cytoplasm of other cells."
      explanation: >-
        Shows the particles already inside macrophage phagosomes in the foot
        dermis, which is the step this edge asserts.
  evidence:
  - reference: PMID:2604475
    reference_title: "Soil particles in the tissues of the foot in endemic elephantiasis of the lower legs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of microparticles of clay is demonstrated in the dermis of the foot in a patient with endemic elephantiasis. The particles are seen to be in the phagosomes of macrophages or in the cytoplasm of other cells."
    explanation: >-
      The direct demonstration that clay microparticles are present in the
      dermal tissue of an affected foot.
  - reference: PMID:39591258
    reference_title: "Differences in Cytokine Expression at Baseline and in Response to Mineral Stimulation by Peripheral Blood Mononuclear Cells from Podoconiosis Cases and Healthy Control Individuals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The predominant silica particles were mainly of the kaolinite type, sized between 0.2 and 2 µm"
    explanation: >-
      Gives the dominant mineral species and its size range, which is what makes
      transdermal entry mechanically plausible. Graded OTHER because the
      sentence is this paper's summary of the earlier microanalysis literature,
      not its own measurement.

- name: Macrophage Phagocytosis of Mineral Particles
  description: >-
    Dermal macrophages engulf the silicate particles. This step is not itself
    pathological - particles are found in the lymph nodes of unaffected
    residents of endemic areas too, which is why the entry treats deposition as
    necessary and the host response as what separates disease from exposure.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: dermal macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    modifier: INCREASED
    term:
      id: GO:0006909
      label: phagocytosis
  locations:
  - preferred_term: dermis of the foot
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Lymphatic Transport of Particle-Laden Macrophages
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2604475
    reference_title: "Soil particles in the tissues of the foot in endemic elephantiasis of the lower legs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of microparticles of clay is demonstrated in the dermis of the foot in a patient with endemic elephantiasis. The particles are seen to be in the phagosomes of macrophages or in the cytoplasm of other cells."
    explanation: >-
      The particles inside macrophage phagosomes, which is precisely this node's
      claim.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease develops in only some people exposed to irritant soils, although mineral particles can be seen in the lymphatic system and lymph nodes of unaffected as well as affected people."
    explanation: >-
      The observation that makes this node insufficient on its own: particles
      are present in unaffected people too. Curated here because it is the
      reason the HLA node exists.

- name: Lymphatic Transport of Particle-Laden Macrophages
  description: >-
    Particle-laden macrophages migrate into the lower-limb lymphatic vessels and
    on to the regional lymph nodes, where the silicates are recoverable by
    microanalysis. From here the chain forks: one arm needs the HLA class II
    susceptibility, the other does not.
  biological_scale: CELLULAR
  locations:
  - preferred_term: lower-limb lymphatic vessel
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: HLA Class II-Restricted CD4 T-Cell Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How a mineral particle comes to be presented on an HLA class II molecule
      is the central unsolved step in this disease, so the edge is curated with
      unknown intermediates rather than asserted as antigen presentation.
  - target: Endolymphangitis
    causal_link_type: DIRECT
    description: >-
      Silica delivered directly into a lymphatic provokes macrophage reaction
      and fibrosis in the vessel wall without requiring the adaptive arm, which
      is the second, HLA-independent route to the same lesion.
    evidence:
    - reference: PMID:3006293
      reference_title: "The effects of silica on lymph nodes and vessels--a possible mechanism in the pathogenesis of non-filarial endemic elephantiasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Intralymphatic silica provoked an immediate and intense macrophage reaction with later fibrosis both within lymph vessels and to a lesser extent within lymph nodes. Lymphography indicated that the consequent obstruction resulted more from the effects of silica on vessels than on nodes."
      explanation: >-
        The intralymphatic injection experiment, which establishes that the
        particles alone can produce the vessel lesion and locates the effect in
        vessels rather than nodes.
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mineral particles in red-clay soils are absorbed through the skin of the foot and engulfed by macrophages in the lower limb lymphatic system, inducing an inflammatory response in the lymphatic vessels, which results in fibrosis and obstruction of the vessel lumen."
    explanation: >-
      States the transport-to-lymphatics model this node represents, and names
      the inflammatory consequence the downstream nodes carry.
  - reference: PMID:39591258
    reference_title: "Differences in Cytokine Expression at Baseline and in Response to Mineral Stimulation by Peripheral Blood Mononuclear Cells from Podoconiosis Cases and Healthy Control Individuals."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Silicate particles of the kaolinite and aluminum types have been identified in femoral lymph node biopsy samples from endemic area residents, suggesting a possible role in the pathogenesis of podoconiosis."
    explanation: >-
      Locates the particles in femoral lymph node biopsies, the endpoint of the
      transport this node describes. Graded OTHER: background prose citing the
      earlier microanalysis literature, not this study's own result.

- name: HLA Class II-Restricted CD4 T-Cell Response
  description: >-
    The susceptibility step. Genome-wide association in Ethiopian populations
    places the signal squarely in the HLA class II region, replicated across
    three ethnic groups and with no other locus reaching significance in a
    better-powered second study. A class II association in a non-communicable
    disease is read as a CD4 T-cell-mediated response - but the antigen itself
    is unidentified, and whether the mineral is presented, modifies a self
    peptide, or binds the groove directly is unknown. Berylliosis is the
    explicit comparator.
  biological_scale: CELLULAR
  genes:
  - preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  - preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: antigen processing and presentation via MHC class II
    modifier: INCREASED
    term:
      id: GO:0019886
      label: antigen processing and presentation of exogenous peptide antigen via MHC class II
  downstream:
  - target: Chronic Systemic Immune Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a genomewide significant association of podoconiosis with the single-nucleotide polymorphism (SNP) rs17612858, located 5.8 kb from the HLA-DQA1 locus (in the allelic model: odds ratio, 2.44; 95% confidence interval [CI], 1.82 to 3.26; P=1.42×10(-9); and in the additive model: odds ratio, 2.19; 95% CI, 1.66 to 2.90; P=3.44×10(-8))"
    explanation: The genome-wide significant signal that anchors this node, with its effect size.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA typing showed the alleles HLA-DRB1*0701 (odds ratio, 2.00), DQA1*0201 (odds ratio, 1.91), and DQB1*0202 (odds ratio, 1.79) and the HLA-DRB1*0701-DQB1*0202 haplotype (odds ratio, 1.92) were risk variants for podoconiosis."
    explanation: >-
      The classical HLA typing behind the SNP association, naming the risk
      alleles and the haplotype.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Association between variants in HLA class II loci with podoconiosis (a noncommunicable disease) suggests that the condition may be a T-cell-mediated inflammatory disease and is a model for gene-environment interactions that may be relevant to other complex genetic disorders."
    explanation: >-
      Graded INDIRECT because the T-cell interpretation follows from the class
      II association by inference; the authors state it as a suggestion, and no
      antigen-specific T-cell response has been demonstrated.
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen SNPs in the HLA class II region showed significant genome-wide association (P < 5.0 × 10-8) with podoconiosis. The lead SNP was rs9270911 (P = 5.51 × 10-10; OR 1.53; 95% CI 1.34-1.74), located near HLA-DRB1."
    explanation: >-
      The replication in a larger, three-population sample, with its own lead
      SNP near HLA-DRB1.
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings confirm the HLA class II association with podoconiosis suggesting HLA-mediated abnormal induction and regulation of immune responses may have a direct role in its pathogenesis."
    explanation: >-
      The replication study's own reading of what the association implies, again
      hedged - "may have a direct role" - which is the strength this node claims.
  - reference: PMID:33099652
    reference_title: "Multiplexed gene expression analysis of HLA class II-associated podoconiosis implicates chronic immune activation in its pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene ontology analysis showed differentially expressed genes to be closely related to major histocompatibility complex protein, cytokine and TNF receptor binding genes. Pathway enrichment analysis revealed involvement of lymphocyte activation, adaptive immunity, cytokine signalling, antigen processing and the IL-12 pathways."
    explanation: >-
      The functional bridge from the genetic association to a mechanism: the
      differentially expressed genes in affected lymph node tissue enrich for
      MHC protein and antigen processing, which is what a class II association
      predicts and had not previously been shown.
  - reference: PMID:33099652
    reference_title: "Multiplexed gene expression analysis of HLA class II-associated podoconiosis implicates chronic immune activation in its pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NanoString technology was used to assess expression of 579 immune-related genes in formalin-fixed and paraffin-embedded lymph node archival samples from podoconiosis patients and unaffected controls."
    explanation: >-
      Records that the measurement was made in lymph node tissue rather than
      blood, which is what makes it evidence about the lesion site.

- name: Chronic Systemic Immune Activation
  description: >-
    Patients carry a measurably activated immune system at rest: raised HLA-DR
    on circulating CD4 and CD8 T cells, raised CD40 and CD86 on monocytes and
    dendritic cells, lower CD62L, and higher unstimulated TNF-alpha and
    IL-1beta than endemic controls. The activation is systemic, not confined to
    the affected limb.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Endolymphangitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The systemic activation is measured in blood and the lesion is in the
      limb lymphatics; no study connects the two directly, so the edge is
      curated with unknown intermediates. The direction is assumed, not shown:
      every cited measurement is cross-sectional case-control, and systemic
      activation is at least as plausibly a consequence of chronic lesional
      inflammation and recurrent acute attacks as a cause of them.
  evidence:
  - reference: PMID:38448477
    reference_title: "Evidence for immune activation in pathogenesis of the HLA class II associated disease, podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral blood immunophenotyping of T cells indicated podoconiosis patients had significantly higher CD4 and CD8 T cell surface HLA-DR expression compared to healthy controls while CD62L expression was significantly lower."
    explanation: The T-cell activation phenotype this node records, against endemic healthy controls.
  - reference: PMID:38448477
    reference_title: "Evidence for immune activation in pathogenesis of the HLA class II associated disease, podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of the activation markers CD40 and CD86 were significantly higher on monocytes and dendritic cell subsets in patients compared to the controls."
    explanation: The antigen-presenting-cell arm of the same activation state.
  - reference: PMID:38448477
    reference_title: "Evidence for immune activation in pathogenesis of the HLA class II associated disease, podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our finding provides evidence that podoconiosis is associated with high levels of immune activation and inflammation with over-expression of genes within the pro-inflammatory axis."
    explanation: The study's summary claim, which is what this node asserts.
  - reference: PMID:39591258
    reference_title: "Differences in Cytokine Expression at Baseline and in Response to Mineral Stimulation by Peripheral Blood Mononuclear Cells from Podoconiosis Cases and Healthy Control Individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results showed that the levels of TNF-α and IL-1β from in vitro cell cultures were significantly higher in unstimulated samples from patients compared to controls (p = 0.04 and p = 0.005, respectively)."
    explanation: >-
      The baseline cytokine difference, measured without stimulation, which is
      the "at rest" part of this node's claim.
  - reference: PMID:39591258
    reference_title: "Differences in Cytokine Expression at Baseline and in Response to Mineral Stimulation by Peripheral Blood Mononuclear Cells from Podoconiosis Cases and Healthy Control Individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The minerals kaolinite and chlorite induced two and three-fold higher levels of IL-1β following 24 h of stimulation in healthy controls compared to patients, respectively."
    explanation: >-
      Counterintuitive and load-bearing. On stimulation with kaolinite and
      chlorite it was the healthy endemic controls, not the patients, who
      produced more IL-1beta - the opposite of what a hypersensitivity model
      predicts. It is graded SUPPORT because it supports *this* node's claim, a
      chronically activated or exhausted immune state, rather than the
      hypersensitivity reading; `supports` is relative to the record it sits on,
      and no node in this entry asserts hypersensitivity for it to refute. The
      argument is carried in the `podo_inverted_mineral_response` discussion.

- name: Endolymphangitis
  description: >-
    Inflammation of the lymphatic vessel wall, with subendothelial oedema and a
    lymphoplasmacytic infiltrate. This is the lesion the two upstream arms - the
    HLA-restricted response and the direct particle effect - converge on.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: lymphatic vessel endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  locations:
  - preferred_term: lymphatic vessel of the lower limb
    term:
      id: UBERON:0001473
      label: lymphatic vessel
  downstream:
  - target: Lymphatic Vessel Wall Collagenization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:3006293
    reference_title: "The effects of silica on lymph nodes and vessels--a possible mechanism in the pathogenesis of non-filarial endemic elephantiasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intralymphatic silica provoked an immediate and intense macrophage reaction with later fibrosis both within lymph vessels and to a lesser extent within lymph nodes. Lymphography indicated that the consequent obstruction resulted more from the effects of silica on vessels than on nodes."
    explanation: >-
      The macrophage reaction within lymph vessels, and the finding that the
      vessel is the dominant site over the node.
  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A moderate lymphoplasmacytic infiltrate was joined by mast cells and scattered macrophages; neutrophils and eosinophils were sparse."
    explanation: >-
      The human counterpart, so this node does not rest on rabbit data alone:
      the infiltrate in affected human skin is lymphoplasmacytic with mast cells
      and macrophages, and conspicuously not neutrophilic.
  - reference: PMID:38448477
    reference_title: "Evidence for immune activation in pathogenesis of the HLA class II associated disease, podoconiosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Price also observed that silicate particles caused subendothelial edema, endolymphangitis, collagenisation and obliteration of the lymphatic lumen"
    explanation: >-
      Names subendothelial oedema and endolymphangitis in human tissue, which is
      this node's exact claim. Graded OTHER and INDIRECT because the sentence is
      this paper's summary of Price's earlier work rather than its own result.

- name: Lymphatic Vessel Wall Collagenization
  description: >-
    Sustained inflammation lays down collagen in and around the lymphatic vessel
    wall. This is the fibrogenic process; the closed lumen it produces is the
    next node.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Luminal Obliteration and Loss of Conducting Lymphatics
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38448477
    reference_title: "Evidence for immune activation in pathogenesis of the HLA class II associated disease, podoconiosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Price also observed that silicate particles caused subendothelial edema, endolymphangitis, collagenisation and obliteration of the lymphatic lumen"
    explanation: >-
      Names collagenisation of the lymphatic wall in sequence with the
      obliteration it causes, which is the split this pair of nodes represents.
      Graded OTHER and INDIRECT: the sentence summarises Price's earlier work

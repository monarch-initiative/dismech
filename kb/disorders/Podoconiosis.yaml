stages:
- name: Stage 1
  description: >-
    Early and reversible. Burning pain in the feet, splaying of the forefoot,
    accentuated skin markings over the metatarsophalangeal joints.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "B) Stage 1: splaying of the right forefoot, accentuation of the skin markings on the metatarsophalangeal joint."
    explanation: The clinical description of this stage, from the series' own figure legend.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased episodes of ADLA were significantly associated with stage 3-5 podoconiosis (P = 0.002), while burning pain in the feet was more common in stage 1 or 2 podoconiosis."
    explanation: >-
      Places burning pain in the early stages, which is the symptom this stage
      is recognised by.
- name: Stage 2
  description: >-
    Bilateral lymphoedema below the knee, still soft, with warty hyperkeratotic
    papules beginning to cover the dorsum of the feet.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C) Stage 2: bilateral lymphoedema below the knee."
    explanation: The stage description from the series' figure legend.
- name: Stage 3
  description: >-
    Fibrotic, non-pitting oedema below the knee, with early nodules and skin
    changes. The transition from stage 2 to stage 3 is where reversibility is
    lost.
  notes: >-
    Curated without its own evidence item. The cached source illustrates stages
    1, 2, 4 and 5 in its figure legends but not stage 3 separately; the
    description follows the five-stage system the source cites rather than a
    quotable sentence, and is flagged here rather than given a snippet that does
    not say it.
- name: Stage 4
  description: >-
    Non-pitting oedematous swelling extending above the knee, with skin
    depigmentation around the ankle. Reached by only a small minority.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "G) Stage 4 (right) and stage 2 (left). Right foot: non pitting oedematous swelling of the leg extending above the knee with an area of skin depigmentation around the ankle."
    explanation: >-
      The stage description, and incidentally a demonstration that the two legs
      can sit at different stages in one patient.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A small number (1.4%) of patients had leg swelling extending above the knee."
    explanation: >-
      How rarely this stage is reached - 1.4% of the series had swelling above
      the knee at all.
- name: Stage 5
  description: >-
    Fixed, globular, woody swelling with ankylosis of the ankle joint, multiple
    nodules and band-like redundant skin folds.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "H) Stage 5: fibrotic globular swelling of the left foot and ankle with ankylosis of the ankle joint, multiple areas of scarring (from traditional bloodletting)."
    explanation: >-
      The stage description, which is also the source of the ankylosis
      phenotype's evidence.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recruited 289 patients for the study, 178 (61.6%) had stage 1 or 2 podoconiosis, and 111(38.4%) stage 3 to 5 podoconiosis."
    explanation: >-
      The distribution across the two stage bands in a community series - about
      three fifths early, two fifths advanced.

histopathology:
- name: Verrucous Acanthosis with Thickened Collagen Bundles and Reduced Lymphatic Vessels
  description: >-
    The advanced-stage biopsy picture: epidermal and dermal thickening,
    verrucous acanthosis, a predominantly lymphoplasmacytic infiltrate, dilated
    and ectatic but fewer lymphatic vessels, eccrine ductal hyperplasia, and
    sclerotic collagen.
  finding_term:
    preferred_term: verrucous acanthosis with dermal sclerosis and reduced lymphatic vessels
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage 3-5 disease was histopathologically characterised by epidermal and dermal thickening, verrucous acanthosis, inflammatory cell infiltrates (predominantly lymphoplasmacytic), dilated and ectatic and a reduced number of lymphatic vessels, eccrine ductal hyperplasia, and sclerosis such as thickened collagen bundles."
    explanation: The full histopathological description this finding records.

- name: Mast Cell and Macrophage Infiltrate with Elastic Fibre Loss
  description: >-
    A second biopsy series adds the cellular detail: a moderate lymphoplasmacytic
    infiltrate joined by mast cells and scattered macrophages, with neutrophils
    and eosinophils sparse, dramatically reduced elastic fibres, and lymphatics
    that are reduced in number and mostly not dilated. The cell mix is that of a
    chronic sterile inflammatory process, not an acute infective one.
  finding_term:
    preferred_term: lymphoplasmacytic infiltrate with mast cells and elastic fibre loss
  evidence:
  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All specimens showed verrucous acanthosis and papillomatosis. Eccrine ducts demonstrated hyperplasia, syringofibroadenomatous changes and miliaria. Dermal collagen bundles were thickened, and elastic fibers were dramatically reduced. A moderate lymphoplasmacytic infiltrate was joined by mast cells and scattered macrophages; neutrophils and eosinophils were sparse. Blood vessels were increased, dilated, and often sclerotic while lymphatics were reduced and largely not dilated."
    explanation: >-
      The cellular and structural findings this record names, including the
      sparse neutrophils that argue against an infective picture in the steady
      state.
  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis demonstrates distinctive changes of chronic lymphedema with extensive sclerosis, loss of elastic fibers, verrucous acanthosis (not HPV induced) and reactive changes of eccrine structures."
    explanation: >-
      The authors' summary, which also flags mast cells and macrophages as
      candidate participants rather than bystanders.

- name: Verrucous Acanthosis Without Human Papillomavirus
  description: >-
    The warty, papillomatous surface change is not virally driven. Every
    specimen tested was HPV-PCR negative, which removes the obvious alternative
    explanation for a verrucous epidermis and keeps the change attributable to
    chronic lymphoedema.
  finding_term:
    preferred_term: verrucous acanthosis, HPV-negative
  evidence:
  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HPV-PCR was negative in all specimens."
    explanation: >-
      Supports this record, which asserts the verrucous change is *not* virally
      driven; a negative PCR across all specimens is exactly that claim's
      evidence. Graded SUPPORT rather than REFUTE because `supports` is relative
      to the record it sits on, not to the hypothesis the result rules out.

environmental:
- name: Long-term barefoot contact with red-clay soil derived from alkalic volcanic rock
  description: >-
    The necessary environmental cause. Exposure is transdermal rather than
    inhalational, occurs over years of subsistence farming without footwear, and
    is determined by soil geochemistry - endemic areas sit on alkalic volcanic
    bedrock at high altitude with high rainfall, the conditions that weather it
    into the implicated clays.
  exposure_term:
    preferred_term: barefoot contact with alkalic volcanic red-clay soil
    term:
      id: ECTO:7000012
      label: exposure to soil
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Classified chemical on the same basis as the mineral-dust exposures in
        silicosis and coal workers' pneumoconiosis - the operative agent is a
        silicate particle, not a living organism. The secondary bacterial
        infection that drives acute attacks is a consequence of the skin
        breakdown, not the exposure being classified here.
    exposure_route:
    - classification_value: DERMAL
      notes: >-
        The distinguishing feature against the other mineral-dust entries in
        this knowledge base that carry `exposure_classifications` - silicosis,
        coal workers' pneumoconiosis and asbestosis all record INHALATION. Note
        that dermal routes are not unique to podoconiosis across the KB as a
        whole: `Chronic_Beryllium_Disease` curates a "Dermal beryllium exposure"
        entry as a second route to sensitization, though that file carries no
        `exposure_classifications` block to compare against.
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  notes: >-
    No IARC group is recorded. IARC has not classified this soil exposure, and
    podoconiosis is not a neoplastic outcome. No GHS class is recorded either:
    the exposure is a natural soil rather than a classified substance.
  influences_mechanisms:
  - target: Transdermal Entry of Silicate Mineral Particles
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Barefoot soil contact is the route by which the mineral particles reach
      the skin at all; there is no other described exposure pathway.
    evidence:
    - reference: PMID:40898820
      reference_title: "Podoconiosis: a comprehensive clinical review and strategies for control and elimination."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It arises due to prolonged exposure of bare feet to irritant red-clay soils in genetically susceptible individuals."
      explanation: >-
        States the exposure and the susceptibility requirement together, which
        is exactly what this edge and its downstream HLA node jointly assert.
        Graded OTHER: the source is a narrative review and the sentence is its
        own summary statement, not a reported result.
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis is a tropical lymphedema resulting from long-term barefoot exposure to red-clay soil derived from volcanic rock. The World Health Organization recently designated it as a neglected tropical disease. Podoconiosis develops in only a subgroup of exposed people, and studies have shown familial clustering with high heritability (63%)."
    explanation: The canonical statement of the exposure and its duration.
  - reference: PMID:40623043
    reference_title: "Associations between podoconiosis and pedogenic factors globally - A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine studies found a correlation between podoconiosis occurrence and regions with underlying alkalic volcanic bedrock, and six linked pedogenic factors (altitude and rainfall) with disease occurrence. Several studies linked specific soil mineralogy and geochemistry with endemic regions, including an abundance of phyllosilicate clay minerals, quartz, and trace elements, notably iron, beryllium and zirconium."
    explanation: >-
      The bedrock, pedogenic and mineralogical correlates that make this a
      geochemically defined exposure rather than a geographic one.
  - reference: PMID:40623043
    reference_title: "Associations between podoconiosis and pedogenic factors globally - A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it remains unclear whether these are covariates or direct contributors to the pathogenesis of the disease"
    explanation: >-
      The systematic review's own caution that the mineral correlations may be
      covariates rather than causes. Curated because this entry names specific
      minerals and should not imply more than the source does.

genetic:
- name: HLA class II susceptibility haplotype
  gene_term:
    preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  frequency: common susceptibility variants, lead SNP odds ratio approximately 1.5-2.4
  notes: >-
    Curated as a susceptibility locus, not a causative gene. `gene_term` carries
    HLA-DQA1 because the slot is single-valued and the first genome-wide
    significant SNP sits 5.8 kb from it; the replication study's lead SNP lies
    near HLA-DRB1, and DQB1 is implicated by the risk haplotype. All three are
    bound on the pathophysiology node. Heritability is estimated at 63% and the
    sibling recurrence risk ratio at 5.07, so the genetic contribution is
    substantial - but no variant is sufficient without the soil exposure, and no
    locus outside HLA class II reached significance in a better-powered second
    genome-wide study.
  evidence:
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a genomewide significant association of podoconiosis with the single-nucleotide polymorphism (SNP) rs17612858, located 5.8 kb from the HLA-DQA1 locus (in the allelic model: odds ratio, 2.44; 95% confidence interval [CI], 1.82 to 3.26; P=1.42×10(-9); and in the additive model: odds ratio, 2.19; 95% CI, 1.66 to 2.90; P=3.44×10(-8))"
    explanation: The primary genome-wide association result.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HLA typing showed the alleles HLA-DRB1*0701 (odds ratio, 2.00), DQA1*0201 (odds ratio, 1.91), and DQB1*0202 (odds ratio, 1.79) and the HLA-DRB1*0701-DQB1*0202 haplotype (odds ratio, 1.92) were risk variants for podoconiosis."
    explanation: The HLA-typed risk alleles and haplotype behind the SNP signal.
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen SNPs in the HLA class II region showed significant genome-wide association (P < 5.0 × 10-8) with podoconiosis. The lead SNP was rs9270911 (P = 5.51 × 10-10; OR 1.53; 95% CI 1.34-1.74), located near HLA-DRB1."
    explanation: >-
      Replication across three Ethiopian populations, with the lead signal
      shifting to HLA-DRB1.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "188 (64.1%) had a family history of podoconiosis."
    explanation: >-
      Graded INDIRECT: family history in two thirds of patients is consistent
      with a heritable component but does not by itself separate shared genes
      from shared soil, since families farm the same land.

diagnosis:
- name: Clinical Diagnosis with Exclusion of Lymphatic Filariasis
  description: >-
    There is no confirmatory test. Diagnosis rests on the exposure history, the
    bilateral below-knee distribution and the mossy skin change, with a negative
    filarial antigen test to exclude the principal mimic. The HLA association is
    a research finding and is not a diagnostic test.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologists performed a patient history, physical examination, filariasis test strip, and skin biopsy for histopathologic examination."
    explanation: >-
      The assessment sequence used in a large field series, including the
      filariasis test strip that does the excluding.
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include dermal nodules and a rough, velvet-like appearance to the skin known as mossy changes which are pathognomonic for the disease."
    explanation: >-
      The pathognomonic sign that carries the positive half of the diagnosis
      once filariasis is excluded.

differential_diagnoses:
- name: Lymphatic Filariasis
  description: >-
    The principal differential and the reason a filarial antigen test is part of
    every case definition. The distinction this entry curates is mechanistic
    rather than a bedside rule of thumb: in filariasis the lymphatic disruption
    is proximal, at worm nests in the groin or armpits, whereas in podoconiosis
    the insult enters at the feet and the disease stays localised to the legs.
    The two are co-endemic in a number of countries, so geography does not
    settle it either.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologists performed a patient history, physical examination, filariasis test strip, and skin biopsy for histopathologic examination."
    explanation: >-
      Shows the exclusion being performed in practice - the test strip is part
      of the standard workup, not an optional extra.
  - reference: PMID:33348721
    reference_title: "Addition of Lymphatic Stimulating Self-Care Practices Reduces Acute Attacks among People Affected by Moderate and Severe Lower-Limb Lymphedema in Ethiopia, a Cluster Randomized Controlled Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whereas the lymphatic disruption in LF is proximal (worm nests in the groin or armpits), in podoconiosis the exposure is at the feet"
    explanation: >-
      The mechanistic contrast this record now rests on - proximal worm nests
      versus distal soil entry. Graded OTHER: the sentence is the paper's
      framing of the two diseases rather than a result of its trial.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis is a localised disease, primarily starting from the feet, progressively involving the legs, yet in most cases remaining below the knee."
    explanation: >-
      The localisation half of the contrast, in the source's own words. An
      earlier draft of this record asserted an "ascending" versus "descending"
      distinction and groin sparing; no cited source says any of that, and it
      has been replaced with what the sources do say.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis is a tropical lymphedema resulting from long-term barefoot exposure to red-clay soil derived from volcanic rock. The World Health Organization recently designated it as a neglected tropical disease. Podoconiosis develops in only a subgroup of exposed people, and studies have shown familial clustering with high heritability (63%)."
    explanation: >-
      Graded INDIRECT: the sentence establishes podoconiosis as a
      soil-exposure disease rather than an infection, which is the basis for
      the distinction, without itself comparing the two conditions.

treatments:
- name: Lymphoedema Self-Care Package
  description: >-
    Foot hygiene, skin care, bandaging, exercise, elevation, and consistent use
    of socks and shoes, delivered through lay community agents. This is the
    mainstay and the only management with randomised evidence in this disease.
    Its measured effect is on acute attacks rather than on limb size, and the
    effect is real but partial - about a fifth fewer episodes, against a
    baseline of more than twenty per person-year.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Acute Dermatolymphangioadenitis
    description: >-
      Hygiene and emollients close the portals of bacterial entry created by
      fissured hyperkeratotic skin, which is the step the trial's primary
      outcome measures.
  evidence:
  - reference: PMID:29773516
    reference_title: "Lymphoedema management to prevent acute dermatolymphangioadenitis in podoconiosis in northern Ethiopia (GoLBeT): a pragmatic randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were randomly assigned (1:1) to either receive a package containing instructions for foot hygiene, skin care, bandaging, exercises, and use of socks and shoes, with support by lay Community Podoconiosis Agents at monthly meetings (intervention group)"
    explanation: The contents of the package, which is what this treatment describes.
  - reference: PMID:29773516
    reference_title: "Lymphoedema management to prevent acute dermatolymphangioadenitis in podoconiosis in northern Ethiopia (GoLBeT): a pragmatic randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ratio of incidence rate in the intervention group to that of the control group was 0·81 (0·74 to 0·89; p<0·0001), with a rate difference of -4·5 (-5·1 to -3·8) episodes per person-year."
    explanation: >-
      The effect estimate. Quoted with the absolute rates attached because the
      rate ratio alone hides how high the baseline burden is.
  - reference: PMID:29773516
    reference_title: "Lymphoedema management to prevent acute dermatolymphangioadenitis in podoconiosis in northern Ethiopia (GoLBeT): a pragmatic randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A simple, inexpensive package of lymphoedema self-care is effective in reducing the frequency and duration of acute dermatolymphangioadenitis."
    explanation: The trial's own conclusion and recommendation.
  - reference: PMID:33348721
    reference_title: "Addition of Lymphatic Stimulating Self-Care Practices Reduces Acute Attacks among People Affected by Moderate and Severe Lower-Limb Lymphedema in Ethiopia, a Cluster Randomized Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a significant between-group difference in patients who reported any acute attacks over the study period (control n = 22 (38%), intervention n = 7 (12%), p = 0.014)."
    explanation: >-
      A second randomised trial, testing whether adding lymphatic stimulation to
      the standard package helps. It did, on acute attacks.

- name: Nodulectomy
  description: >-
    Surgical excision of woody fibrotic nodules under local anaesthesia, wounds
    left to heal by secondary intention under compression. Reserved for nodules
    that do not respond to conservative care. It improves quality of life and,
    unexpectedly for a debulking procedure, reduces acute attack frequency.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Dermal Sclerosis and Nodule Formation
    description: >-
      The procedure removes the fibrotic nodules this node produces; it does not
      address the lymphatic obstruction upstream of them.
  evidence:
  - reference: PMID:33481805
    reference_title: "Surgical debulking of podoconiosis nodules and its impact on quality of life in Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DLQI values were significantly better six months after surgery than before surgery (P<0.0001)."
    explanation: The quality-of-life outcome at six months.
  - reference: PMID:33481805
    reference_title: "Surgical debulking of podoconiosis nodules and its impact on quality of life in Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Also the number of ADLA episodes per three months was significantly lower six months after surgery than before surgery (P<0.0001)."
    explanation: >-
      The acute-attack reduction, which is the more surprising result: removing
      nodules also removed some of the infection risk.
  - reference: PMID:33481805
    reference_title: "Surgical debulking of podoconiosis nodules and its impact on quality of life in Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excisions after nodulectomy were left to heal by secondary intention with compression bandaging."
    explanation: >-
      The wound-management detail that makes this a resource-appropriate
      procedure rather than one requiring a theatre and grafting.

- name: Antibiotic Therapy for Acute Attacks
  description: >-
    Antibiotics, penicillin among them, are the recommended treatment for
    interrupting an acute dermatolymphangioadenitis episode. Curated with the
    qualifier the source attaches to it and that this entry will not drop: in
    the remote rural populations where the disease actually occurs, they are not
    routinely available. The recommendation and its reach are different claims.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Acute Dermatolymphangioadenitis
    description: >-
      Antibiotics act on the bacterial arm of the acute episode, not on the
      lymphatic obstruction that produced the portal of entry.
  evidence:
  - reference: PMID:29773516
    reference_title: "Lymphoedema management to prevent acute dermatolymphangioadenitis in podoconiosis in northern Ethiopia (GoLBeT): a pragmatic randomised controlled trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Antibiotic therapy (including penicillin), which has been recommended for interruption of acute dermatolymphangioadenitis episodes,17 is not routinely available for patients in remote rural populations in Ethiopia."
    explanation: >-
      Carries both halves of the claim in one sentence - the recommendation and
      the availability caveat. Graded OTHER: the sentence is this trial's
      background framing, citing an earlier recommendation, not a result of the
      trial itself. No trial of antibiotic therapy in podoconiosis is cited in
      this entry.
  notes: >-
    No specific agent is bound. The source names penicillin as an example inside
    a general recommendation, and no cited source in this entry reports a
    regimen, so `therapeutic_agent` is left absent rather than fixed on one drug.

- name: Consistent Footwear Use
  description: >-
    Shoes are the primary prevention, and in early-stage disease they are also
    treatment. Because the exposure is transdermal and the early lymphoedema is
    reversible, interrupting soil contact can halt or reverse stage 1-2 disease.
    This is the intervention that makes podoconiosis eliminable in a way its
    fellow lymphoedemas are not.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: consistent footwear use to interrupt soil contact
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Chronic Barefoot Contact with Alkalic Volcanic Clay Soil
    description: >-
      Footwear acts on the exposure itself rather than on any downstream
      mechanism, which is why it can prevent as well as treat.
  evidence:
  - reference: PMID:40898820
    reference_title: "Podoconiosis: a comprehensive clinical review and strategies for control and elimination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early intervention, including consistent use of footwear and improved foot hygiene, can greatly reduce disease burden."
    explanation: >-
      States the effect of footwear and hygiene on disease burden. Graded OTHER
      because it is a review's summary statement rather than a measured result.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In stages 1 and 2, simple lymphoedema management can completely reverse the clinical changes, but if the condition is not managed with appropriate foot care and consistent shoe wearing, it can lead to subsequent ir"
    explanation: >-
      The reversibility claim this treatment rests on, stated for stages 1 and 2
      and tied to consistent shoe wearing. Without it the description's "halt or
      reverse" would be asserting more than the footwear evidence shows.
  - reference: PMID:37719165
    reference_title: "Epidemiology of podoconiosis in sub-Saharan Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Walking barefoot adjusted odd ratio (AOR) 5.35 (95% CI: 1.65, 9.05), p = 0.001, not washing feet with soap and water regularly AOR 2.8 (95% CI: 1.16, 4.44, p = 0.001), and an increased age AOR 2.23 (95% CI: 1.25, 5.58) were factors significantly associated with the prevalence of podoconiosis."
    explanation: >-
      Graded INDIRECT: the odds ratio is for walking barefoot as a risk factor,
      so the protective effect of footwear follows by inversion rather than
      being measured directly. No randomised trial of footwear exists.

clinical_trials:
- name: ISRCTN67805210
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    GoLBeT, the Gojjam Lymphoedema Best Practice Trial: a pragmatic
    single-blind randomised controlled trial of a community-delivered
    lymphoedema self-care package in northern Ethiopia, powered on acute
    dermatolymphangioadenitis episodes. Results published as PMID:29773516.
  target_phenotypes:
  - preferred_term: recurrent acute dermatolymphangioadenitis
    term:
      id: HP:0100658
      label: Cellulitis
  evidence:
  - reference: ICTRP:ISRCTN67805210
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Study design | Pragmatic single-blind randomized controlled trial (Treatment) |"
    explanation: >-
      The registry record establishing the trial's design. Graded OTHER because
      a registration document is not itself study evidence; the results are
      curated on the Lymphoedema Self-Care Package treatment.
  notes: >-
    Keyed on the WHO ICTRP identifier rather than an NCT number - this trial is
    registered with ISRCTN and has no ClinicalTrials.gov record.

- name: ISRCTN16764792
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Enhanced self-care for advanced lymphoedema: a comparative study in Ethiopia
    and Bangladesh testing whether adding lymphatic stimulation - self-massage
    and deep breathing - to the standard hygiene package improves outcomes.
    Results published as PMID:33348721.
  evidence:
  - reference: ICTRP:ISRCTN16764792
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Countries of recruitment | Bangladesh; Ethiopia |"
    explanation: >-
      The registry record. Listed because the trial's published results are

  - reference: PMID:25401490
    reference_title: "Histopathological and immunohistochemical features of nodular podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermal collagen bundles were thickened, and elastic fibers were dramatically reduced."

    Swelling that begins at the feet and works up the legs, bilateral in about
    seven of eight patients and frequently asymmetric between them in stage or
    in type. It stays below the knee in almost all cases - only 1.4% of one
    large series had swelling above it. Unilateral involvement is described as a
    clinical variant rather than the rule.

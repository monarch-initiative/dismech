inheritance:
- name: Non-Mendelian inheritance
  inheritance_term:
    preferred_term: complex HLA class II-associated susceptibility
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >-
    Podoconiosis is inherited as a susceptibility, not as a disease. A
    segregation analysis of multi-generational Ethiopian families fitted an
    autosomal co-dominant major-gene model with a sibling recurrence risk ratio
    of 5.07 and heritability of 0.63; two subsequent genome-wide association
    studies located the signal in the HLA class II region and found nothing
    outside it. The entry binds `HP:0001426` rather than `HP:0032113`
    (Semidominant inheritance) because the latter sits under *Mendelian
    inheritance* in HPO, and no genotype produces podoconiosis without the soil
    exposure.
  evidence:
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A segregation analysis of 59 multi-generational podoconiosis families from the Wolaita ethnic group in southwest Ethiopia indicated an autosomal co-dominant pattern of inheritance with an estimated sibling recurrence risk ratio (λs) and heritability of 5.07 and 0.63 respectively"
    explanation: >-
      The segregation model, the sibling recurrence risk ratio and the
      heritability estimate, all in one sentence.
  - reference: PMID:22455414
    reference_title: "HLA class II locus and susceptibility to podoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Podoconiosis is a tropical lymphedema resulting from long-term barefoot exposure to red-clay soil derived from volcanic rock. The World Health Organization recently designated it as a neglected tropical disease. Podoconiosis develops in only a subgroup of exposed people, and studies have shown familial clustering with high heritability (63%)."
    explanation: >-
      Confirms the 63% heritability independently, and states in the same breath
      that the disease develops only in exposed people.

prevalence:
- population: Sub-Saharan Africa
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2660.0
  rate_low: 2240.0
  rate_high: 3100.0
  rate_denominator: POPULATION
  notes: >-
    Pooled across 16 studies and 2,195,722 individuals. Heterogeneity is
    extreme (I-squared 99.9%), which is expected for a disease whose
    distribution is set by local bedrock - the pooled figure describes the
    region, not any district in it.
  evidence:
  - reference: PMID:37719165
    reference_title: "Epidemiology of podoconiosis in sub-Saharan Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of podoconiosis was 2.66 (95% confidence interval (CI): 2.24, 3.10) with heterogeneity index (I2) of 99.9%."
    explanation: The pooled estimate and its confidence interval and heterogeneity index.

- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    About four million people affected globally, concentrated in tropical
    highland regions. Recorded as a case count rather than a rate because the
    source gives an absolute burden without a denominator.
  evidence:
  - reference: PMID:33558538
    reference_title: "Replication of HLA class II locus association with susceptibility to podoconiosis in three Ethiopian ethnic groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is estimated that there are 4 million people living with podoconiosis globally, mainly living in highland regions of tropical countries in Africa, South and Central America and southeast Asia"
    explanation: The global burden estimate and its geographic distribution.

epidemiology:
- name: Exposure-Dependent Distribution Set by Bedrock and Climate
  description: >-
    The disease occurs where alkalic volcanic bedrock weathers under high
    altitude and high rainfall into the implicated clays, and where people farm
    that soil barefoot. Both conditions are required, which is why podoconiosis
    is absent from equally volcanic areas where footwear is universal.
  evidence:
  - reference: PMID:40623043
    reference_title: "Associations between podoconiosis and pedogenic factors globally - A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine studies found a correlation between podoconiosis occurrence and regions with underlying alkalic volcanic bedrock, and six linked pedogenic factors (altitude and rainfall) with disease occurrence. Several studies linked specific soil mineralogy and geochemistry with endemic regions, including an abundance of phyllosilicate clay minerals, quartz, and trace elements, notably iron, beryllium and zirconium."
    explanation: The bedrock and pedogenic correlations behind the distribution.
  - reference: PMID:37719165
    reference_title: "Epidemiology of podoconiosis in sub-Saharan Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Walking barefoot adjusted odd ratio (AOR) 5.35 (95% CI: 1.65, 9.05), p = 0.001, not washing feet with soap and water regularly AOR 2.8 (95% CI: 1.16, 4.44, p = 0.001), and an increased age AOR 2.23 (95% CI: 1.25, 5.58) were factors significantly associated with the prevalence of podoconiosis."
    explanation: >-
      The behavioural half of the requirement, with foot hygiene and age
      alongside it.

progression:
- phase: Reversible Early Disease
  notes: >-
    Stages 1-2. Swelling is soft and pitting and still responds to elevation,
    footwear and hygiene. About three fifths of patients in a community series
    were in this band, which is where the prevention argument has its purchase.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recruited 289 patients for the study, 178 (61.6%) had stage 1 or 2 podoconiosis, and 111(38.4%) stage 3 to 5 podoconiosis."
    explanation: The stage distribution this phase describes.

- phase: Fixed Fibrotic Disease
  notes: >-
    Stages 3-5. Non-pitting oedema, established dermal sclerosis, nodules and
    eventually ankylosis. Acute attacks become more frequent as the stage
    advances, so the fibrotic phase is also the phase with the highest acute
    burden. Self-care still helps here; reversal does not.
  evidence:
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased episodes of ADLA were significantly associated with stage 3-5 podoconiosis (P = 0.002), while burning pain in the feet was more common in stage 1 or 2 podoconiosis."
    explanation: >-
      The association between advanced stage and acute-attack frequency that
      makes this phase clinically distinct.
  - reference: PMID:35604949
    reference_title: "Podoconiosis: Clinical spectrum and microscopic presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage 3-5 disease was histopathologically characterised by epidermal and dermal thickening, verrucous acanthosis, inflammatory cell infiltrates (predominantly lymphoplasmacytic), dilated and ectatic and a reduced number of lymphatic vessels, eccrine ductal hyperplasia, and sclerosis such as thickened collagen bundles."
    explanation: The histological correlates of the fixed phase.

animal_models:
- name: Intralymphatic silica injection model
  species: Rabbit
  genotype: Wild type
  description: >-
    Fine silica particles injected directly into lymphatic vessels, designed to
    test whether the mineral alone can produce the obstructive lesion and to
    locate its main site of action. It bypasses the skin and the adaptive immune
    system entirely, which is both its power and its limit. The species is taken
    from the record's MeSH indexing (Rabbits); the abstract itself says only
    "animal experiments".
  publication: PMID:3006293
  modeled_mechanisms:
  - target: Endolymphangitis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Silica provoked immediate intense macrophage reaction and later fibrosis
      within lymph vessels, with lymphographic obstruction attributable more to
      the vessels than to the nodes.
    limitations: >-
      Direct intralymphatic injection is not the human exposure route: it skips
      transdermal entry, delivers a bolus rather than a decades-long trickle,
      and uses silica rather than the kaolinite that predominates in human
      lymph node microanalysis. It also cannot model the HLA class II
      susceptibility, since the animals are not selected for it - so the model
      shows the mineral is sufficient for the vessel lesion in an unselected
      host, which is a different claim from the human one.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The plantar skin barrier and the whole transdermal entry step are
        outside the model. Everything this entry curates upstream of the
        lymphatic is untested by it.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The injected material is fine silica; the quantity the human node
        concerns is chronic kaolinite-dominant silicate deposition arriving via
        macrophage transport. Same mineral class, different species and
        different delivery.
    - divergence_type: POPULATION_MISMATCH
      materiality: INVALIDATING
      description: >-
        Human disease occurs in the subset of exposed people carrying HLA class
        II risk haplotypes. The experimental animals are unselected, so the
        model cannot speak to the susceptibility step that decides who gets the
        disease.
    evidence:
    - reference: PMID:3006293
      reference_title: "The effects of silica on lymph nodes and vessels--a possible mechanism in the pathogenesis of non-filarial endemic elephantiasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Intralymphatic silica provoked an immediate and intense macrophage reaction with later fibrosis both within lymph vessels and to a lesser extent within lymph nodes. Lymphography indicated that the consequent obstruction resulted more from the effects of silica on vessels than on nodes."
      explanation: >-
        The experimental result, including the vessel-over-node localisation
        that this entry's chain follows.

discussions:
- discussion_id: podo_soil_trigger_unidentified
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which constituent of alkalic volcanic red clay is the trigger, and how does
    a mineral particle come to be presented by an HLA class II molecule?
  rationale: >-
    This is the hole at the centre of the disease. The exposure is known, the
    susceptibility locus is known and replicated, and the lesion is described in
    detail - but the antigen is not identified, and no mechanism connects a
    silicate particle to class II presentation. Kaolinite, smectite, quartz,
    iron oxides, beryllium and zirconium are all correlated with endemicity and
    none is established as causal; the systematic review that assembled them says
    outright that they may be covariates. Without the trigger there is no
    biomarker, no early diagnostic, and no target - which is why the entry's
    edge from particle transport to the HLA node is curated with unknown
    intermediates rather than as antigen presentation.
  attaches_to:
  - pathophysiology#Lymphatic Transport of Particle-Laden Macrophages
  - pathophysiology#HLA Class II-Restricted CD4 T-Cell Response
  - environmental#Long-term barefoot contact with red-clay soil derived from alkalic volcanic rock

- discussion_id: podo_inverted_mineral_response
  kind: INTERPRETATION
  prompt: >-
    Why do healthy exposed controls mount a larger IL-1beta response to kaolinite
    and chlorite than patients do?
  rationale: >-
    The intuitive model - patients are hypersensitive to the mineral - is
    contradicted by the only in vitro stimulation study in this disease.
    Patients had higher unstimulated TNF-alpha and IL-1beta, but on stimulation
    the controls produced two to three times more IL-1beta. The authors read
    this as persistent in vivo activation, with exhaustion or regulation
    blunting the response to a further hit. The entry curates the result as a
    SUPPORT item on the immune-activation node - it supports that node's
    chronic-activation reading, and `supports` is relative to the record an item
    sits on rather than to the hypothesis the result rules out. It is curated
    rather than omitted because an entry that quietly dropped it would imply a
    hypersensitivity model the evidence does not support. It is a single small
    study and should not be treated as settled either way.
  attaches_to:
  - pathophysiology#Chronic Systemic Immune Activation

- discussion_id: podo_no_animal_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can any existing model system reproduce podoconiosis, given that the disease
    requires both a human HLA class II haplotype and barefoot bipedal soil
    contact?
  rationale: >-
    The only experimental model in the literature injects silica directly into
    lymphatics, which reproduces the vessel lesion while bypassing the skin, the
    exposure route, the mineral species and the susceptibility genotype. There is
    no animal that walks barefoot on volcanic clay carrying a human class II
    risk haplotype, and no natural veterinary counterpart has been described. So
    every mechanistic claim upstream of the lymphatic vessel in this entry rests
    on human tissue and human genetics alone, and the one model available cannot
    arbitrate between the HLA-dependent and HLA-independent routes to the same
    lesion.
  attaches_to:
  - pathophysiology#HLA Class II-Restricted CD4 T-Cell Response
  - animal_models#Rabbit

notes: >-
  Why this entry exists. Podoconiosis is the cleanest gene-environment disease
  available: a mineral exposure with no pathogen and no vector, an HLA class II
  susceptibility replicated across three populations, and a heritability of 63%
  layered on an obligate environmental cause. Neither half produces disease
  alone - mineral particles are found in the lymph nodes of unaffected residents,
  and no genotype causes podoconiosis without the soil.

  Two things are curated as evidence rather than smoothed away. The in vitro
  mineral stimulation result runs against the obvious model and is kept with an
  explanation that says so and a discussion that argues it out. And the
  systematic review's caution that
  the implicated minerals may be covariates rather than causes is quoted
  directly, because this entry names specific minerals and should not assert
  more than its sources do.

  The exposure is DERMAL, and it is recorded in `exposure_classifications`
  rather than only in prose. Among the KB entries that carry that block, the
  mineral-dust diseases - silicosis, coal workers' pneumoconiosis and asbestosis
  - all record INHALATION, so podoconiosis is the transdermal member of that
  set. Two things that would make a stronger claim false, and are worth stating:
  `Byssinosis` is classified BIOLOGICAL rather than as a mineral dust, and
  `Chronic_Beryllium_Disease` curates a "Dermal beryllium exposure" entry of its
  own - it simply has no `exposure_classifications` block, so it does not appear
  in the comparison.

  Not curated. The deep-research report describes depression and anxiety odds
  ratios, quality-of-life subdomain scores, economic burden figures, a
  standardized mortality ratio of about 6, and a Rwandan barefoot-walking ban.
  These trace to sources this session did not fetch, so none is included. The
  report also suggested three UBERON terms its own validator flagged as naming
  something else - `UBERON:0002387` for dermis (it is *pes*), `UBERON:0004357`
  for dorsum of foot (*paired limb/fin bud*), and `UBERON:0001511` for "leg
  structures" (*skin of leg*) - plus `UBERON:0002391` for lymph node (*lymph*),
  which its weaker "worth a second look" section listed. None is bound as the
  report proposed it. `UBERON:0001511` *is* used here, but for what UBERON
  actually calls it: the skin of the leg.

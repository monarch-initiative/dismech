treatments:
- name: Calorie-adequate low-fat diet
  therapeutic_modality: BEHAVIORAL
  description: >-
    Management guidance recommends adequate calories for growth together with a
    low-fat diet, generally limiting long-chain fat that cannot be transported
    normally in chylomicrons. This reduces gastrointestinal fat load but does
    not correct the MTTP defect.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired Intestinal Lipid Absorption
    treatment_effect: MODULATES
    description: Reducing dietary long-chain fat limits the substrate burden on the impaired intestinal transport pathway.
    evidence:
    - reference: PMID:30358967
      reference_title: Abetalipoproteinemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "low-fat diet (10%-20% of total calories from fat)"
      explanation: GeneReviews provides the low-fat dietary management framework.
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adequate caloric intake to alleviate growth deficiency; low-fat diet (10%-20% of total calories from fat)"
    explanation: GeneReviews recommends adequate calories and a low-fat diet for growth and gastrointestinal management.
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fatty foods, particularly those rich in long-chain fatty acids."
    explanation: GeneReviews identifies long-chain-fat-rich foods as the principal dietary exposure to avoid.
- name: High-dose fat-soluble vitamin supplementation
  description: >-
    Long-term vitamins A, D, E, and K replace nutrients that remain poorly
    absorbed. Observational evidence suggests early replacement may prevent or
    delay retinal and neuromuscular progression, but established dysfunction is
    not reliably reversed. Dosing requires specialist biochemical monitoring;
    vitamin A needs pregnancy-specific adjustment because excess can harm the
    developing fetus.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Reduced Fat-Soluble Vitamin Bioavailability
    treatment_effect: MODULATES
    description: High-dose replacement increases vitamin availability despite persistent intestinal malabsorption without restoring normal chylomicron transport.
    evidence:
    - reference: PMID:33994405
      reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "High dose vitamin supplementation is the mainstay for treatment and may prevent, delay, or alleviate the complications"
      explanation: The review supports replacement as the treatment mainstay while using appropriately qualified benefit language.
  - target: Vitamin A/E-Associated Retinal Degeneration
    treatment_effect: MODULATES
    description: Vitamin A and E replacement may slow retinal deterioration, particularly when started early.
    evidence:
    - reference: PMID:7171526
      reference_title: Combined vitamin A and E therapy prevents retinal electrophysiological deterioration in abetalipoproteinaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After initiation of vitamin A and E therapy no progression of disturbed visual function could be detected in any patient."
      explanation: An eight-patient follow-up observed stable retinal function after combined vitamin therapy.
  - target: Vitamin E-Associated Neuromuscular Injury
    treatment_effect: MODULATES
    description: High-dose vitamin E may slow or arrest progressive neuropathy and myopathy, but the evidence is observational.
    evidence:
    - reference: PMID:2981135
      reference_title: Arrest of neuropathy and myopathy in abetalipoproteinemia with high-dose vitamin E therapy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It was concluded that treatment with high doses of vitamin E was responsible for the arrest of the usually progressive neuropathy and myopathy."
      explanation: A long-term single-patient observation supports possible arrest of progressive neuromuscular disease.
  evidence:
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, it cannot fully prevent or restore impaired function."
    explanation: The review cautions that vitamin replacement is not fully preventive or restorative.
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vitamin A excess can be harmful to the developing fetus."
    explanation: GeneReviews supports pregnancy-specific caution with high-dose vitamin A.
- name: Essential fatty acid supplementation
  description: >-
    Small amounts of oils rich in polyunsaturated fatty acids can be used as
    tolerated to provide essential fatty acids despite overall dietary fat
    restriction.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "essential fatty acid supplementation (up to 1 teaspoon per day of oils rich in polyunsaturated fatty acids, as tolerated)"
    explanation: GeneReviews recommends essential-fatty-acid supplementation as tolerated.
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "supplementation with essential fatty acids and high oral doses of fat soluble vitamins."
    explanation: The management review lists essential fatty acids among treatment mainstays.
- name: Multisystem surveillance
  description: >-
    Longitudinal follow-up assesses growth, blood count and reticulocytes,
    coagulation, liver tests and imaging, fat-soluble vitamins and related
    chemistries, lipids, and neurologic and ophthalmologic status. The intervals
    in GeneReviews provide a general evidence source rather than individualized
    medical instructions.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complete blood count, INR, reticulocyte count, liver function tests (AST,
      ALT, GGT, total and direct bilirubin, alkaline phosphatase, and albumin),
      fat-soluble vitamin levels
    explanation: GeneReviews specifies annual hematologic, coagulation, hepatic, and vitamin monitoring.
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ultrasound of the liver every three years. Ophthalmology and neurology evaluations every six to 12 months."
    explanation: GeneReviews specifies periodic liver imaging and specialist neurologic and ophthalmologic review.
- name: Genetic counseling and family evaluation
  description: >-
    Counseling addresses autosomal-recessive recurrence risk, carrier testing,
    evaluation of at-risk siblings, and reproductive options when familial MTTP
    variants are known.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier"
    explanation: GeneReviews provides the autosomal-recessive recurrence-risk framework.
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Carrier testing for at-risk relatives and prenatal and preimplantation genetic testing are possible if the pathogenic MTTP variants in the family are known."
    explanation: GeneReviews supports carrier and reproductive testing after familial-variant identification.
diagnosis:
- name: Plasma lipid and apoB measurement
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  description: >-
    Absent or extremely low LDL cholesterol, triglyceride, and apoB is the
    defining biochemical pattern and should prompt molecular testing. LDL-C and
    apoB below 15 mg/dL have been proposed as Japanese screening or
    eligibility thresholds, not as universal stand-alone diagnostic criteria.
  results: Absent or extremely low LDL cholesterol, triglyceride, and apoB strongly supports the diagnosis but does not distinguish MTTP-related ABL from all genetic mimics.
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "absent or extremely low LDL-cholesterol, triglyceride, and apolipoprotein (apo) B levels"
    explanation: GeneReviews defines the characteristic biochemical diagnostic pattern.
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "our diagnostic criteria and the entry criterion of low-density lipoprotein cholesterol (LDL-C) ＜15 mg/dL and apoB ＜15 mg/dL can be useful in universal or opportunistic screening"
    explanation: The review frames the numerical thresholds as screening or program-entry criteria rather than a universal molecular diagnosis.
- name: Peripheral blood smear morphology
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    A peripheral blood smear can demonstrate acanthocytosis, a strong
    supportive clue in the appropriate severe-hypolipidemia and malabsorption
    phenotype.
  results: Acanthocytosis supports the clinical diagnosis but is not a substitute for molecular confirmation.
  evidence:
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical diagnosis is based on signs and symptoms, acanthocytosis on blood smear, and virtually absent apo B-containing lipoproteins"
    explanation: The review identifies acanthocytosis on smear as part of clinical diagnosis.
- name: MTTP molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:

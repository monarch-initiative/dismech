  role: mediator
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hematologic manifestations may include acanthocytosis (irregularly spiculated erythrocytes), anemia, reticulocytosis, and hemolysis with resultant hyperbilirubinemia."
    explanation: GeneReviews directly supports the linked hematologic manifestation set.
  downstream:
  - target: Acanthocytosis
    description: Altered erythrocyte morphology is observed as acanthocytosis.
    causal_link_type: DIRECT
  - target: Anemia
    description: Hemolysis can contribute to anemia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - shortened erythrocyte survival
  - target: Reticulocytosis
    description: Compensatory erythropoiesis can produce reticulocytosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - increased erythropoietic response to hemolysis
  - target: Hyperbilirubinemia
    description: Erythrocyte destruction increases bilirubin production.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - heme catabolism after hemolysis
- name: Vitamin K-Related Coagulopathy
  description: >-
    Vitamin K deficiency secondary to fat-soluble-vitamin malabsorption can
    increase the international normalized ratio or prolong prothrombin time and
    can manifest clinically as bleeding.
  role: mediator
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Malabsorption of fat-soluble vitamins (A, D, E, and K) can result in an increased international normalized ratio (INR)."
    explanation: GeneReviews links fat-soluble-vitamin malabsorption to increased INR.
  downstream:
  - target: Prolonged prothrombin time
    description: Reduced vitamin-K-dependent coagulation activity prolongs prothrombin time.
    causal_link_type: DIRECT
  - target: Abnormal bleeding
    description: Clinically significant coagulopathy can produce abnormal bleeding.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired vitamin-K-dependent coagulation
- name: Hepatic Triglyceride Retention
  description: >-
    Failure to export triglyceride in apoB100-containing VLDL promotes lipid
    retention in hepatocytes. Steatosis is variably expressed and can rarely
    progress to fibrosis or cirrhosis.
  role: mediator
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  evidence:
  - reference: PMID:32039990
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia: liver disease and cardiovascular disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fatty liver, cirrhosis and hepatocellular carcinoma have been reported in FHBL and ABL probably due to decreased triglyceride export from the liver."
    explanation: The review supports hepatic triglyceride-export failure as the likely mechanism of liver disease.
  - reference: PMID:24842304
    reference_title: Homozygous MTTP and APOB mutations may lead to hepatic steatosis and fibrosis despite metabolic differences in congenital hypocholesterolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They suggest that the genetic defect in VLDL assembly is critical for the occurrence of liver steatosis leading to fibrosis"
    explanation: A human ABL/FHBL cohort supports the VLDL-assembly defect as critical to steatosis and fibrosis.
  downstream:
  - target: Hepatomegaly
    description: Hepatic lipid accumulation can enlarge the liver.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hepatocyte lipid accumulation
  - target: Hepatic steatosis
    description: Hepatocyte triglyceride retention is observed as hepatic steatosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24288038
      reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "neuropathy and coagulopathy. Hepatic steatosis is also common."
      explanation: The review directly supports hepatic steatosis as a common ABL manifestation.
  - target: Hepatic fibrosis
    description: Chronic hepatic injury can progress to fibrosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic hepatocyte injury and fibrogenic activation
  - target: Cirrhosis
    description: Advanced chronic hepatic injury can rarely progress to cirrhosis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - progressive hepatic fibrosis
  - target: Hypoalbuminemia
    description: Hepatic or nutritional involvement can be accompanied by hypoalbuminemia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

differential_diagnoses:
- name: Familial hypobetalipoproteinemia 1
  description: >-
    Severe biallelic APOB-related familial hypobetalipoproteinemia can be
    clinically and biochemically very similar to abetalipoproteinemia, but it is
    caused by APOB rather than MTTP variants.
  disease_term:
    preferred_term: familial hypobetalipoproteinemia 1
    term:
      id: MONDO:0014252
      label: familial hypobetalipoproteinemia 1
  distinguishing_features:
  - Biallelic pathogenic MTTP variants establish abetalipoproteinemia; biallelic APOB variants establish severe familial hypobetalipoproteinemia.
  - Obligate heterozygous parents usually have normal lipid levels in MTTP-related ABL but approximately half-normal apoB-containing lipoproteins in severe APOB-related disease.
  evidence:
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutations either in both alleles of the MTP (alias MTTP) gene encoding microsomal triglyceride transfer protein (MTP) or both alleles of the APOB gene itself in the case of ABL and HHBL, respectively."
    explanation: The review distinguishes the two phenocopies by their causal genes.
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Obligate heterozygote parents of ABL patients usually have normal lipids"
    explanation: The review supplies a useful family-lipid discriminator.
  - reference: PMID:36243606
    reference_title: Guidance for the diagnosis and treatment of hypolipidemia disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we focus on abetalipoproteinemia, homozygous hypobetalipoproteinemia and chylomicron retention disease"
    explanation: Contemporary guidance treats these as related but distinct monogenic hypolipidemia disorders.
- name: Chylomicron retention disease
  description: >-
    SAR1B-related chylomicron retention disease also causes early fat
    malabsorption, hypocholesterolemia, and fat-soluble-vitamin deficiency, but
    the defect is ER-to-Golgi transport of chylomicron cargo rather than
    MTTP-dependent apoB-particle lipidation and assembly.
  disease_term:
    preferred_term: chylomicron retention disease
    term:
      id: MONDO:0009528
      label: chylomicron retention disease
  distinguishing_features:
  - Biallelic MTTP variants favor abetalipoproteinemia, whereas biallelic SAR1B variants favor chylomicron retention disease.
  - Postprandial absence of chylomicrons and apoB48 with a SAR1B/COPII transport defect supports chylomicron retention disease.
  evidence:
  - reference: PMID:30640893
    reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CRD patients present with SAR1B mutations, which disable the formation of coat protein complex II and thus blocks the transport of chylomicron cargo from the endoplasmic reticulum to the Golgi."
    explanation: The review identifies the distinct SAR1B/COPII transport mechanism.
  - reference: PMID:30640893
    reference_title: "Chylomicron retention disease: genetics, biochemistry, and clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Molecular testing for CRD is recommended to distinguish the disease from other congenital fat malabsorptions"
    explanation: The review explicitly recommends molecular testing to distinguish this phenocopy.
review_notes: >-
  Re-reviewed in July 2026 as MTTP-specific abetalipoproteinemia. The revision
  removed the historical APOB disease conflation and disease-external analogies,
  rebuilt the causal graph around apoB-particle assembly and secretion, added
  treatment-modified natural history, monitoring, diagnostic separation, and
  structured differentials, and aligned every retained evidence title with its
  cache. Remaining mechanistic gaps include the detailed erythrocyte-membrane
  pathway to acanthocytosis, reliable genotype-phenotype correlations, and
  long-term natural-history data under modern treatment.

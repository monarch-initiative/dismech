      evidence_source: IN_VITRO
      snippet: "Biochemical analysis of lysates from these cells showed that the Arg to His conversion interrupted the interaction between the 97-kDa subunit and protein disulfide isomerase."
      explanation: Functional evidence shows one MTTP missense variant disrupts formation of the MTP complex.

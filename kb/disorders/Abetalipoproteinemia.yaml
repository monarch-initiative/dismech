progression:
- phase: Infancy
  age_range: Infancy
  notes: >-
    The usual untreated presentation is gastrointestinal, with steatorrhea,
    vomiting, fat malabsorption, and failure to thrive. Earlier recognition and
    nutritional treatment can substantially modify this course.
  evidence:
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with ABL typically manifest steatorrhea, vomiting, and failure to thrive in infancy."
    explanation: The review identifies the characteristic infantile gastrointestinal and growth presentation.
- phase: Childhood to adolescence
  age_range: First to second decades
  notes: >-
    Persistent fat-soluble-vitamin deficiency can be followed by progressive
    neuromuscular disease, including loss of reflexes and proprioception,
    weakness, dysarthria, and ataxia.
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "dysarthria; and ataxia typically manifest in the first or second decades of life."
    explanation: GeneReviews places the typical emergence of neuromuscular manifestations in the first two decades.
- phase: Adulthood and later life
  age_range: Adulthood onward
  notes: >-
    Untreated retinal disease may cause progressive loss of night and color
    vision in adulthood. Hepatic involvement is variable. High-dose vitamin
    replacement may delay complications and improve survival, but established
    dysfunction is not reliably reversed and complications can still occur.
  evidence:
  - reference: PMID:30358967
    reference_title: Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "with progressive loss of night vision and/or color vision in adulthood."
    explanation: GeneReviews supports adult progression of retinal visual dysfunction when disease is untreated.
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "High dose vitamin supplementation is the mainstay for treatment and may prevent, delay, or alleviate the complications and improve the prognosis"
    explanation: The review describes treatment-modified prognosis while avoiding a claim of cure.
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, it cannot fully prevent or restore impaired function."
    explanation: The review explicitly cautions that vitamin replacement does not fully prevent or reverse established dysfunction.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_mttp_lipoprotein_assembly_model
  hypothesis_label: Canonical MTTP ApoB-Lipoprotein Assembly Model
  status: CANONICAL
  description: >-
    Biallelic MTTP loss of function disrupts the microsomal triglyceride
    transfer protein complex and prevents normal assembly and secretion of
    intestinal apoB48-containing chylomicrons and hepatic apoB100-containing
    VLDL. The resulting absence of apoB lipoproteins produces severe
    hypolipidemia, intestinal fat and fat-soluble-vitamin malabsorption, hepatic
    triglyceride retention, and downstream multisystem complications.
  notes: >-
    The proximal MTTP-to-apoB-assembly mechanism is established. The detailed
    intermediates linking apoB-lipoprotein absence to acanthocyte formation
    remain incompletely resolved, and this entry does not treat retinal MTTP
    expression or single hypomorphic cases as established alternative disease
    mechanisms or genotype-phenotype rules.
  evidence:
  - reference: PMID:1439810
    reference_title: Absence of microsomal triglyceride transfer protein in individuals with abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MTP activity and the 88-kilodalton component of MTP were present in intestinal biopsy samples from eight control individuals but were absent in four abetalipoproteinemic subjects."
    explanation: Human intestinal-biopsy data directly demonstrate absent MTP protein and activity in affected individuals.
  - reference: PMID:7782284
    reference_title: A 30-amino acid truncation of the microsomal triglyceride transfer protein large subunit disrupts its interaction with protein disulfide-isomerase and causes abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only the normal subunit was able to form a stable, soluble complex with protein disulfide-isomerase"
    explanation: Functional reconstitution shows that a disease-associated truncation disrupts the MTP-PDI complex.
  - reference: PMID:33994405
    reference_title: Current Diagnosis and Management of Abetalipoproteinemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deficiency of microsomal triglyceride transfer protein (MTTP) abrogates the assembly of apolipoprotein (apo) B-containing lipoprotein in the intestine and liver"
    explanation: The contemporary review states the canonical proximal mechanism in the affected intestinal and hepatic compartments.

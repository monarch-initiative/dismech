differential_diagnoses:
- name: Organophosphate Poisoning
  disease_term:
    preferred_term: organophosphate poisoning
    term:
      id: MONDO:0800386
      label: organophosphate poisoning
  description: >-
    Presents with an indistinguishable acute muscarinic, nicotinic, and central
    cholinergic crisis from acetylcholinesterase inhibition, so acute bedside
    resuscitation and atropine titration are identical. Organophosphates
    irreversibly phosphorylate and "age" acetylcholinesterase, producing longer
    courses, oxime responsiveness prior to aging, and delayed intermediate
    syndrome or delayed polyneuropathy that are largely absent in carbamate
    poisoning.
  distinguishing_features:
  - Irreversible phosphorylation and enzyme "aging" requiring hepatic de novo enzyme synthesis for recovery, versus rapid spontaneous decarbamylation (<24-48 hours)
  - Delayed intermediate syndrome and organophosphate-induced delayed polyneuropathy occur after organophosphate exposure but are absent in prospective carbamate cohorts
  evidence:
  - reference: PMID:29489157
    reference_title: Carbamate Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While they possess a similar mechanism of action to the irreversible phosphorylation of acetylcholinesterase by organophosphates, carbamates bind to acetylcholinesterase reversibly. Subsequently, carbamates have a similar toxicological presentation to OP poisonings with a duration of toxicity that is typically less than 24 hours."
    explanation: Contrasts reversible carbamylation and shorter clinical duration (<24 hours) with irreversible organophosphate phosphorylation.
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With OP insecticides (but not carbamates), \"aging\" may also occur by partial dealkylation of the serine group at the active site of AChE; recovery of AChE activity requires synthesis of new enzyme in the liver."
    explanation: Identifies irreversible active-site aging as specific to organophosphates rather than carbamates.

biochemical:
- name: Red-cell acetylcholinesterase activity
  presence: DECREASED
  loinc_term:
    id: LOINC:1709-5
    label: Acetylcholinesterase [Enzymatic activity/volume] in Red Blood Cells
  notes: >-
    Red-cell acetylcholinesterase activity confirms anticholinesterase poisoning
    as a proxy for synaptic enzyme inhibition. In carbamate poisoning the result
    can read falsely normal because the reversible carbamyl-enzyme bond can
    reactivate spontaneously in vitro before assay.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring butyrylcholinesterase and/or red-cell acetylcholinesterase activity."
    explanation: Identifies red-cell acetylcholinesterase activity as a confirmatory biomarker of anticholinesterase pesticide poisoning.
- name: Plasma butyrylcholinesterase activity
  presence: DECREASED
  loinc_term:
    id: LOINC:2098-2
    label: Cholinesterase [Enzymatic activity/volume] in Serum or Plasma
  notes: >-
    Plasma butyrylcholinesterase (pseudocholinesterase) activity is a sensitive
    marker of anticholinesterase exposure, though subject to the same rapid
    in vitro decarbamylation caveat as erythrocyte acetylcholinesterase.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring butyrylcholinesterase and/or red-cell acetylcholinesterase activity."
    explanation: Identifies plasma butyrylcholinesterase activity alongside red-cell acetylcholinesterase as a confirmatory biomarker.
diagnosis:
- name: Clinical cholinergic toxidrome assessment
  description: >-
    Bedside recognition of acute muscarinic, nicotinic, and central cholinergic
    features (pinpoint pupils, hyperhidrosis, bronchorrhea, bronchospasm,
    bradycardia, hypotension, convulsions, or coma) in a compatible pesticide
    exposure context. Emergency resuscitation and atropine titration are guided
    immediately by clinical features rather than awaiting laboratory assays.
  diagnosis_term:
    preferred_term: Physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring butyrylcholinesterase and/or red-cell acetylcholinesterase activity. However, such assays cannot be performed in the ward. Furthermore, emergency therapy should be determined by the patient's clinical features, not by knowledge of the ingested poison."
    explanation: Establishes that acute bedside diagnosis and treatment initiation rely on clinical cholinergic features rather than ward-unavailable laboratory assays.
- name: Red-cell acetylcholinesterase and plasma butyrylcholinesterase activity
  description: >-
    Laboratory measurement of erythrocyte acetylcholinesterase and plasma
    butyrylcholinesterase activity confirms anticholinesterase exposure, though
    rapid spontaneous decarbamylation can normalize enzyme activity if specimen
    analysis is delayed.
  diagnosis_term:
    preferred_term: cholinesterase activity measurement
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  measurements:
  - preferred_term: Erythrocyte acetylcholinesterase
    term:
      id: LOINC:1709-5
      label: Acetylcholinesterase [Enzymatic activity/volume] in Red Blood Cells
  - preferred_term: Plasma cholinesterase
    term:
      id: LOINC:2098-2
      label: Cholinesterase [Enzymatic activity/volume] in Serum or Plasma
  notes: >-
    No numerical diagnostic threshold or severity band is recorded because the
    cited clinical protocol specifies no activity cut-off and warns against
    relying on static severity scores in unstable acutely poisoned patients.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring butyrylcholinesterase and/or red-cell acetylcholinesterase activity."
    explanation: Identifies erythrocyte acetylcholinesterase and plasma butyrylcholinesterase measurements as confirmatory diagnostic tests.
progression:
- phase: Acute cholinergic crisis
  notes: >-
    Onset is within minutes to about two hours of exposure, and the course is
    usually self-limited over hours to a few days as acetylcholinesterase
    spontaneously reactivates. Because the carbamate adduct does not age, the
    delayed intermediate syndrome seen after organophosphate poisoning is
    largely absent.
  evidence:
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "no patients showed delayed onset of toxicity akin to the intermediate syndrome seen after OP insecticide poisoning"
    explanation: The cohort found no delayed intermediate syndrome, consistent with a reversible, non-aging inhibitor.
environmental:
- name: Carbamate insecticide self-poisoning by ingestion
  description: >-
    Deliberate ingestion of carbamate insecticides is the dominant cause of
    severe carbamate poisoning and death in agricultural regions of South and
    Southeast Asia.
  exposure_term:
    preferred_term: exposure to pesticide via ingestion

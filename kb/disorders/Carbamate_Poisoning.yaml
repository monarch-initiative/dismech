name: Carbamate Poisoning
creation_date: "2026-10-28T00:00:00Z"
category: Environmental
synonyms:
- carbamate insecticide poisoning
- carbamate intoxication
- carbamate toxicity
notes: >-
  MONDO has no class for carbamate poisoning. runoak -i sqlite:obo:mondo search
  "l~carbamate" returns only urea-cycle and carbamazepine terms, and the
  "poisoning" subtree (MONDO:0029000) has no carbamate, pesticide, insecticide
  or cholinesterase-inhibitor child, so the entry carries no disease_term, as
  Arsenic_Poisoning does. The concept is cross-referenced to the parent
  MONDO:0029000 poisoning as a broadMatch only. ICD-10-CM groups carbamates with
  organophosphates under one code (T60.0), and MeSH has no "carbamate poisoning"
  descriptor, only the agent class Carbamates and Cholinesterase Inhibitors.


  The entry conforms to the acetylcholinesterase_inhibition module. Its
  agent-specific divergence from the organophosphate and nerve-agent conformers
  is that carbamylation is reversible and the inhibited enzyme does not age, so
  the course is usually shorter and the organophosphate delayed syndromes
  (intermediate syndrome, OPIDN) are largely absent; that distinction is carried
  on the carbamylation node and in progression, not in the shared module.


  Scope: this entry covers carbamate *insecticide* poisoning. The therapeutic
  carbamate cholinesterase inhibitors (physostigmine, rivastigmine,
  pyridostigmine) act by the same mechanism but are out of scope here.
mappings:
  mondo_mappings:
  - mapping_predicate: skos:broadMatch
    term:
      id: MONDO:0029000
      label: poisoning
pathophysiology:
- name: Acetylcholinesterase carbamylation
  conforms_to: "acetylcholinesterase_inhibition#Acetylcholinesterase Inhibition"
  biological_scale: MOLECULAR
  description: >-
    N-methyl carbamate insecticides (and carbamate drugs) carbamylate the serine
    hydroxyl in the catalytic site of acetylcholinesterase, inactivating the
    enzyme that hydrolyses acetylcholine. Unlike the organophosphate adduct, the
    carbamyl-enzyme bond hydrolyses spontaneously (decarbamylation) and does not
    "age", so inhibition is reversible and recovery does not require synthesis of
    new enzyme.
  molecular_functions:
  - preferred_term: acetylcholinesterase activity
    modifier: DECREASED
    term:
      id: GO:0003990
      label: acetylcholinesterase activity
  biological_processes:
  - preferred_term: acetylcholine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006581
      label: acetylcholine catabolic process
  downstream:
  - target: Synaptic acetylcholine accumulation
    description: Loss of acetylcholinesterase activity prevents breakdown of acetylcholine at synapses.
  evidence:
  - reference: PMID:25455666
    reference_title: Organophosphate and carbamate poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both classes inhibit acetylcholinesterase (AChE) enzymes, leading to excess acetylcholine accumulation at nerve terminals."
    explanation: States that carbamates inhibit AChE, the initiating lesion of this node.
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With OP insecticides (but not carbamates), \"aging\" may also occur by partial dealkylation of the serine group at the active site of AChE; recovery of AChE activity requires synthesis of new enzyme in the liver."
    explanation: Supports that the carbamate adduct, unlike the organophosphate one, does not age.
  - reference: PMID:25455666
    reference_title: Organophosphate and carbamate poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The toxic effects from OPs and carbamates differ with respect to reversibility, subacute, and chronic effects."
    explanation: Supports the reversibility of carbamate inhibition that distinguishes this node from the organophosphate conformer.
- name: Synaptic acetylcholine accumulation
  conforms_to: "acetylcholinesterase_inhibition#Synaptic Acetylcholine Accumulation"
  biological_scale: CELLULAR
  description: >-
    With acetylcholinesterase carbamylated, acetylcholine released at cholinergic
    synapses is not degraded and accumulates at autonomic, neuromuscular and
    central synapses, producing sustained receptor stimulation.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Muscarinic receptor overstimulation
    description: Excess acetylcholine overstimulates muscarinic acetylcholine receptors.
  - target: Nicotinic receptor overstimulation
    description: Excess acetylcholine overstimulates nicotinic acetylcholine receptors.
  - target: Central cholinergic overstimulation
    description: Excess acetylcholine overstimulates central nervous system cholinergic pathways.
  evidence:
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both organophosphorus (OP) and carbamate insecticides inhibit acetylcholinesterase (AChE), which results in accumulation of acetylcholine (ACh) at autonomic and some central synapses and at autonomic postganglionic and neuromuscular junctions."
    explanation: Supports acetylcholine accumulation across autonomic, central, and neuromuscular synapses for carbamates.
- name: Muscarinic receptor overstimulation
  conforms_to: "acetylcholinesterase_inhibition#Muscarinic Receptor Overstimulation"
  biological_scale: CELLULAR
  description: >-
    Accumulated acetylcholine overstimulates muscarinic receptors on smooth
    muscle, glands and the heart, producing the muscarinic toxidrome: miosis,
    lacrimation, salivation, sweating, bronchorrhea, bronchospasm, bradycardia
    and gastrointestinal hypermotility (the SLUDGE/DUMBELS pattern).
  biological_processes:
  - preferred_term: G protein-coupled acetylcholine receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007213
      label: G protein-coupled acetylcholine receptor signaling pathway
  downstream:
  - target: Miosis
  - target: Hyperhidrosis
  - target: Bronchospasm
  - target: Bronchorrhea
  - target: Bradycardia
  - target: Hypotension
  - target: Cholinergic crisis and respiratory failure
    description: Bronchorrhea and bronchospasm impair gas exchange and contribute to respiratory failure.
  evidence:
  - reference: PMID:26563788
    reference_title: Organophosphorus and carbamate insecticide poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACh binds to, and stimulates, muscarinic and nicotinic receptors, thereby producing characteristic features."
    explanation: Supports muscarinic receptor stimulation as the source of the muscarinic features.
- name: Nicotinic receptor overstimulation
  conforms_to: "acetylcholinesterase_inhibition#Nicotinic Receptor Overstimulation"
  biological_scale: CELLULAR
  description: >-
    Accumulated acetylcholine overstimulates nicotinic receptors at the
    neuromuscular junction and autonomic ganglia, causing fasciculations
    followed by weakness, and neuromuscular-junction failure that can persist
    into the cholinergic crisis.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  downstream:
  - target: Muscle weakness
  - target: Cholinergic crisis and respiratory failure
    description: Neuromuscular-junction failure weakens the respiratory muscles and contributes to respiratory failure.
  evidence:
  - reference: PMID:25455666
    reference_title: Organophosphate and carbamate poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the setting of toxicity from either agent class, clinical syndromes result from excessive nicotinic and muscarinic neurostimulation."
    explanation: Supports nicotinic overstimulation as a source of the clinical syndrome for carbamates.
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "suggesting NMJ failure that developed during the cholinergic crisis"
    explanation: Reports neuromuscular-junction failure arising during the carbamate cholinergic crisis.
- name: Central cholinergic overstimulation
  conforms_to: "acetylcholinesterase_inhibition#Central Cholinergic Overstimulation"
  biological_scale: CELLULAR
  description: >-
    Acetylcholine accumulation in the central nervous system overstimulates
    central cholinergic pathways, producing convulsions, depression of the
    central respiratory drive, and reduced consciousness.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Seizure
  - target: Reduced consciousness
  - target: Cholinergic crisis and respiratory failure
    description: Central depression of the respiratory center contributes to respiratory failure.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Watch out for convulsions and treat with intravascular (IV) diazepam immediately if they do occur."
    explanation: Convulsions in carbamate-poisoned patients evidence central cholinergic overstimulation.
- name: Cholinergic crisis and respiratory failure
  conforms_to: "acetylcholinesterase_inhibition#Cholinergic Crisis and Respiratory Failure"
  biological_scale: ORGANISM
  description: >-
    The muscarinic, nicotinic and central arms converge on a cholinergic crisis
    whose principal cause of death is respiratory failure, from the combination
    of bronchorrhea and bronchospasm, respiratory-muscle failure, and central
    depression of the respiratory drive.
  biological_processes:
  - preferred_term: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
  downstream:
  - target: Respiratory failure
    description: The converging arms produce the respiratory failure that is the principal cause of death.
  evidence:
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Intubation and ventilation was required for 183 (14.2%) patients while 71 (5.5%) died."
    explanation: Quantifies the respiratory failure and mortality of the cholinergic crisis in a carbamate cohort.

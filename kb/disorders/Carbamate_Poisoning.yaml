      explanation: Documents the agricultural replacement of organophosphates by carbamate insecticides.
treatments:
- name: Muscarinic Antagonist (atropine)
  description: >-
    Atropine is the specific antidote, titrated to drying of secretions, a clear
    chest and adequate oxygenation rather than to pupils or heart rate alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Muscarinic receptor overstimulation
    treatment_effect: INHIBITS
    description: Blocks the overstimulated muscarinic receptors, reversing secretions and bronchospasm.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because atropine dries secretions and reduces bronchospasm, its administration will improve patient oxygenation."
    explanation: Atropine reverses the muscarinic arm, the mechanism this treatment targets.
- name: Oxime reactivator (pralidoxime)
  description: >-
    An oxime reactivates carbamylated acetylcholinesterase, but because the
    carbamate adduct does not age and reactivates spontaneously, oximes are
    usually not recommended in carbamate poisoning.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    The role of oximes in carbamate poisoning is debated; the spontaneous
    reactivation that makes them often unnecessary is the same feature that
    distinguishes carbamate from organophosphate inhibition.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pralidoxime
      term:
        id: CHEBI:8354
        label: pralidoxime
  target_mechanisms:
  - target: Acetylcholinesterase carbamylation
    treatment_effect: INHIBITS
    description: Reactivates carbamylated acetylcholinesterase, though usually unnecessary given spontaneous reactivation.
  evidence:
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "oximes are usually not recommended in carbamate poisoning due to rapid spontaneous reactivation of AChE"
    explanation: States that oximes are usually not recommended for carbamate poisoning.
- name: Benzodiazepine
  description: >-
    A benzodiazepine is first-line for the convulsions of the central arm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Central cholinergic overstimulation
    treatment_effect: INHIBITS
    description: Suppresses the convulsions driven by central cholinergic overstimulation.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Watch out for convulsions and treat with intravascular (IV) diazepam immediately if they do occur."
    explanation: Diazepam is the recommended anticonvulsant for carbamate-poisoning convulsions.
- name: Resuscitation and ventilatory support
  description: >-
    Early airway management, oxygen and mechanical ventilation support the
    patient through the respiratory failure of the cholinergic crisis.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Cholinergic crisis and respiratory failure
    treatment_effect: INHIBITS
    description: Ventilatory support sustains gas exchange through the respiratory failure.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "provide high-flow oxygen if available and ensure a patent airway through the placement of a Guedel airway or access"
    explanation: Airway and oxygen support are the first steps of management.

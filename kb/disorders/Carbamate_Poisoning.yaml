biochemical:
- name: Red cell and plasma cholinesterase activity
  presence: DECREASED
  notes: >-
    Low red-cell acetylcholinesterase or plasma butyrylcholinesterase activity
    confirms anticholinesterase poisoning. In carbamate poisoning the result can
    read falsely normal, because the reversible carbamyl-enzyme bond can
    reactivate in the sample before it is assayed.
  evidence:
  - reference: PMID:15566582
    reference_title: Early management after self-poisoning with an organophosphorus or carbamate pesticide - a treatment protocol for junior doctors.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring butyrylcholinesterase and/or red-cell acetylcholinesterase activity."
    explanation: Identifies red-cell acetylcholinesterase and plasma butyrylcholinesterase activity as the confirmatory biomarkers.
progression:
- phase: Acute cholinergic crisis
  notes: >-
    Onset is within minutes to about two hours of exposure, and the course is
    usually self-limited over hours to a few days as acetylcholinesterase
    spontaneously reactivates. Because the carbamate adduct does not age, the
    delayed intermediate syndrome seen after organophosphate poisoning is
    largely absent.
  evidence:
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "no patients showed delayed onset of toxicity akin to the intermediate syndrome seen after OP insecticide poisoning"
    explanation: The cohort found no delayed intermediate syndrome, consistent with a reversible, non-aging inhibitor.
environmental:
- name: Carbamate insecticide self-poisoning by ingestion
  description: >-
    Deliberate ingestion of carbamate insecticides is the dominant cause of
    severe carbamate poisoning and death in agricultural regions of South and
    Southeast Asia.
  exposure_term:
    preferred_term: exposure to pesticide via ingestion
    term:
      id: ECTO:0900419
      label: exposure to pesticide via ingestion
  evidence:
  - reference: PMID:27252029
    reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We prospectively studied 1288 patients self-poisoned with carbamate insecticides admitted to six Sri Lankan hospitals."
    explanation: Establishes deliberate self-poisoning by ingestion as the dominant severe exposure.
  influences_mechanisms:
  - target: Acetylcholinesterase carbamylation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Ingested carbamate reaches cholinergic synapses and carbamylates acetylcholinesterase.
    evidence:
    - reference: PMID:27252029
      reference_title: "High lethality and minimal variation after acute self-poisoning with carbamate insecticides in Sri Lanka - implications for global suicide prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We prospectively studied 1288 patients self-poisoned with carbamate insecticides admitted to six Sri Lankan hospitals."
      explanation: Establishes self-poisoning by ingestion as the exposure route in this cohort.
- name: Occupational and agricultural carbamate insecticide exposure
  description: >-
    Carbamate insecticides are widely used in agriculture, increasingly as

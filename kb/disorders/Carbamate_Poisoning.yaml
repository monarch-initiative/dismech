name: Carbamate Poisoning
creation_date: "2026-10-28T00:00:00Z"
category: Environmental
parents:
- pesticide poisoning
synonyms:
- carbamate insecticide poisoning
- carbamate intoxication
- carbamate toxicity
description: >-
  Carbamate poisoning is an acute cholinergic toxic syndrome caused by exposure
  to N-methyl carbamate insecticides (such as carbofuran, carbosulfan, methomyl,
  fenobucarb, carbaryl, propoxur, and aldicarb), either through intentional
  self-poisoning by ingestion or occupational agricultural exposure. Carbamates
  reversibly carbamylate the catalytic serine of acetylcholinesterase, preventing
  hydrolysis of acetylcholine at autonomic, neuromuscular, and central nervous
  system synapses. Resulting muscarinic, nicotinic, and central overstimulation
  produces miosis, bronchorrhea, bronchospasm, bradycardia, hyperhidrosis,
  hypotension, muscle weakness, convulsions, reduced consciousness, and
  life-threatening respiratory failure. Unlike organophosphates, the carbamyl-enzyme
  adduct hydrolyses spontaneously and does not undergo irreversible aging, so
  clinical toxicity typically resolves faster and delayed organophosphate
  syndromes (intermediate syndrome and delayed polyneuropathy) are largely
  absent. Management centers on airway and ventilatory support, titrated
  antimuscarinic therapy with atropine, and benzodiazepines for seizures.
notes: >-
  MONDO has no class for carbamate poisoning. runoak -i sqlite:obo:mondo search
  "l~carbamate" returns only imported chemical and exposure classes
  (CHEBI:13941 carbamate and ECTO:9000282 exposure to carbamate), and the
  "poisoning" subtree (MONDO:0029000) has no carbamate, pesticide, insecticide
  or cholinesterase-inhibitor child, so the entry carries no disease_term, as
  Arsenic_Poisoning does. The concept is cross-referenced to the parent
  MONDO:0029000 poisoning as a broadMatch only. ICD-10-CM groups carbamates with
  organophosphates under one code (T60.0), and MeSH has no "carbamate poisoning"
  descriptor, only the agent class Carbamates and Cholinesterase Inhibitors.
  The StatPearls chapter Carbamate Toxicity (PMID:29489157) is tagged in
  references and caches as abstract-only because the Bookshelf full-text archive
  is not configured.


  The entry conforms to the acetylcholinesterase_inhibition module. Its
  agent-specific divergence from the organophosphate and nerve-agent conformers
  is that carbamylation is reversible and the inhibited enzyme does not age, so
  the course is usually shorter and the organophosphate delayed syndromes
  (intermediate syndrome, OPIDN) are largely absent; that distinction is carried
  on the carbamylation node and in progression, not in the shared module.


  Scope: this entry covers carbamate *insecticide* poisoning. The therapeutic
  carbamate cholinesterase inhibitors (physostigmine, rivastigmine,
  pyridostigmine) act by the same mechanism but are out of scope here.

animal_models:
- name: ap1g1 knockout zebrafish
  species: Zebrafish (Danio rerio)
  genotype: ap1g1 knockout generated by CRISPR/Cas9; homozygous null and heterozygous carriers
  category: Knockout
  background: Tg(neurod1:EGFP) reporter crossed in for neuronal population analysis
  publication: PMID:37108275
  description: >-
    Homozygous null embryos arrest at the blastula stage, so the informative
    genotype is the heterozygote - which is also the genotype that matches the
    dominant human disease. Heterozygous fish reach adulthood with reduced brain
    volume, missing neuronal populations in the midbrain, midbrain-hindbrain
    boundary and telencephalon, fewer spinal cord neurons, and dysregulated
    cadherin-mediated adhesion.
  modeled_mechanisms:
  - target: AP1G1 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The heterozygous fish is a direct model of one-allele loss of ap1g1 and shows
      that this dosage alone produces a phenotype.
    limitations: >-
      Zebrafish ap1g1 is an ortholog rather than the human gene, and the
      heterozygous phenotype includes reduced fertility and gut and gonadal
      changes that are not reported features of the human disorder. The model
      addresses dosage only; it says nothing about the dominant missense alleles.
    readouts:
    - name: Total brain volume
      target: AP1G1 Haploinsufficiency
      direction: DECREASED
      interpretation: Reduced brain volume in the heterozygote is the structural correlate of the human neurodevelopmental phenotype.
      evidence:
      - reference: PMID:37108275
        reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In our knockout model, the heterozygous fish displayed abnormalities in specific brain areas and spinal cord neurons, and the brain volume is reduced."
        explanation: "Reports the brain-volume reduction measured in heterozygous animals."
    evidence:
    - reference: PMID:37108275
      reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The zebrafish ap1g1 knock-out model revealed the indispensable function of the family of AP1 complexes for vertebrate development and that heterozygosity causes disease phenotypes."
      explanation: "States that heterozygosity is sufficient for disease phenotypes, which is what makes this model informative for the haploinsufficiency node."

- name: Cadherin Mis-sorting and Adherens Junction Instability
  biological_scale: CELLULAR
  description: >-
    Cadherins carry canonical AP-1 sorting motifs and reach adherens junctions by
    an AP-1-dependent route from the trans-Golgi network. In ap1g1 heterozygous
    zebrafish, cadherin-mediated cell adhesion is dysregulated and epithelial
    adherens junction formation is impaired. This is the best-characterized
    individual cargo defect in AP1G1 deficiency.
  biological_processes:
  - preferred_term: cell-cell adhesion mediated by cadherin
    term:
      id: GO:0044331
      label: cell-cell adhesion mediated by cadherin
    modifier: DECREASED
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: DECREASED
  evidence:
  - reference: PMID:37108275
    reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "An analysis of mRNA profiles of different marker proteins and altered tissue morphologies revealed dysregulated cadherin-mediated cell adhesion."
    explanation: "Direct result in the ap1g1 heterozygous zebrafish identifying cadherin-mediated adhesion as the dysregulated process."
  - reference: PMID:37108275
    reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, adult heterozygous fish showed impaired cell adhesion in epithelial tissues, such as cadherin protein sorting and adherent junction (AJ) formation."
    explanation: "Links the adhesion defect specifically to cadherin protein sorting and adherens junction formation."
  downstream:
  - target: Perturbed Neurodevelopment and Reduced Brain Growth
    description: >-
      Cadherin-dependent adhesion is required for the tissue architecture of the
      developing brain, so cadherin mis-sorting contributes to the
      neurodevelopmental phenotype alongside the neuron-intrinsic sorting defect.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37108275
      reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This phenotype confirms the contributions of the AP1 complex in polarized epithelial cells and neurons; a more detailed investigation of E-cadherin sorting steps would contribute to understanding this phenotype."
      explanation: "The authors themselves state that the cadherin-sorting steps behind the neuronal phenotype remain to be worked out, which is why this edge records unknown intermediates."

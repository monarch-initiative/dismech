    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In c.196G>A mutant fibroblasts, although GM130 labeling remained comparable to that in the controls, the organization of the trans-Golgi cisternae appeared more diffuse and disorganized."
    explanation: "Direct morphological readout in patient fibroblasts showing that the trans-Golgi compartment, and not the cis-Golgi, is the one disturbed."
  - reference: PMID:41226632
    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, the c.196G>A mutation in AP1G1 disrupts membrane association and impairs vesicular trafficking at the trans-Golgi level, potentially resulting in significant functional consequences."
    explanation: "The authors' own conclusion that trafficking at the trans-Golgi is impaired by the dominant allele."
  downstream:
  - target: Impaired Somatodendritic Protein Sorting in Neurons
    description: >-
      Neurons depend on AP complexes for the polarized delivery of somatodendritic
      membrane proteins, so a TGN sorting failure is expressed in neurons as loss
      of that polarity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34102099
      reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "Adaptor protein (AP) complexes mediate selective intracellular vesicular trafficking and polarized localization of somatodendritic proteins in neurons."
      explanation: "States the neuron-specific function that this edge carries forward from the general TGN sorting defect."
  - target: Cadherin Mis-sorting and Adherens Junction Instability
    description: >-
      Cadherins are AP-1 cargo and are transported from the TGN to the plasma

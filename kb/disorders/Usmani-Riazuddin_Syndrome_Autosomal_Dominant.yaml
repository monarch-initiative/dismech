      explanation: "Identifies cadherin as AP1G1-dependent TGN cargo, which is the step this edge asserts."
- name: Endosomal Recycling Impairment
  biological_scale: CELLULAR
  description: >-
    AP-1 also functions on endosomes, and an endosome-recycling defect is the one
    directly measured consequence of AP1G1 missense alleles: the mutant proteins
    still assemble with the other AP-1 subunits but internalized cargo returns to
    the plasma membrane inefficiently. Scope caveat, stated plainly: that
    measurement was made on the BIALLELIC RECESSIVE alleles, which belong to the
    sibling disorder MONDO:0859196 and are not curated in this entry. Whether the
    dominant alleles engage the same step has not been tested. The node is kept
    here because it is a real, cited step in AP-1 biology downstream of the same
    complex, and is marked PROVISIONAL rather than attributed to the dominant
    alleles.

  description: >-
    The convergent tissue-level consequence: specific brain regions and spinal
    cord neuronal populations fail to be specified or to differentiate normally,
    and total brain volume is reduced in the heterozygous animal model. This is
    the node from which the clinical neurodevelopmental phenotype follows.

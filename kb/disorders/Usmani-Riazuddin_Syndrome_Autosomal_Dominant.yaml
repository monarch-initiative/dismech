pathophysiology:
- name: AP1G1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo AP1G1 alleles that abolish production of a full-length
    gamma-1 adaptin from one allele - frameshift, splice-acceptor and whole-gene
    deletion alleles - leave a single functional copy. The whole-gene deletion
    case is the cleanest demonstration that halving AP1G1 dosage alone is
    sufficient to produce the syndrome, since no mutant protein is made.
  genetic_context:
    gene:
      preferred_term: AP1G1
      term:
        id: hgnc:555
        label: AP1G1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Applies to the truncating, splice-site and whole-gene-deletion dominant
      alleles. The dominant missense alleles are modelled separately.
  genes:
  - preferred_term: AP1G1
    term:
      id: hgnc:555
      label: AP1G1
  evidence:
  - reference: PMID:38840441
    reference_title: "Whole genome sequencing for copy number variant detection to improve diagnosis and management of rare diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first reported case with whole‐gene deletion and presents with a mild but consistent phenotype."
    explanation: "A whole-gene deletion makes no mutant protein, so this allele can only act by halving gene dosage; it is the cleanest human evidence for haploinsufficiency in this disorder."
  - reference: PMID:38840441
    reference_title: "Whole genome sequencing for copy number variant detection to improve diagnosis and management of rare diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all three cases, WGS identified CNVs and confirmed zygosity and pathogenicity, resulting in genetic diagnoses of PRKN-related Parkinson disease, TAOK1-related neurodevelopmental disorder, and AP1G1-related Usmani-Riazuddin syndrome."
    explanation: "Confirms that the deletion case was diagnosed as Usmani-Riazuddin syndrome, tying the dosage lesion to this disorder."
  downstream:
  - target: AP-1 Adaptor Complex Dysfunction
    description: >-
      A single functional AP1G1 allele reduces the amount of gamma-1 adaptin
      available to assemble into AP-1 heterotetramers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37108275
      reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The zebrafish ap1g1 knock-out model revealed the indispensable function of the family of AP1 complexes for vertebrate development and that heterozygosity causes disease phenotypes."
      explanation: "In zebrafish, losing one ap1g1 allele is by itself enough to produce phenotypes, which is the dosage-sensitivity step this edge asserts."
- name: Dominant-Negative Gamma-1 Adaptin Missense Protein
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo AP1G1 missense alleles produce a full-length but
    misfolded gamma-1 adaptin. Rather than simply being absent, the mutant
    protein interferes with the wild-type protein: co-injecting wild-type and
    mutant human AP1G1 mRNA fails to rescue the zebrafish null, and injecting
    mutant mRNA into wild-type embryos is itself damaging. This is a different
    lesion from haploinsufficiency even though both act through the same complex.
  genetic_context:
    gene:
      preferred_term: AP1G1
      term:
        id: hgnc:555
        label: AP1G1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Applies to the dominant missense alleles. The published functional argument
      for a dominant-negative rather than a purely hypomorphic effect rests on
      failure of co-injection rescue and on toxicity of mutant mRNA in a
      wild-type background; both authors describe the alternative of a toxic
      gain-of-function as not yet excluded.
  genes:
  - preferred_term: AP1G1
    term:
      id: hgnc:555
      label: AP1G1
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In silico analysis and 3D protein modeling simulation predicted alteration of AP1γ1 protein folding for missense variants, which was consistent with the observed altered AP1γ1 levels in heterologous cells."
    explanation: "3D modeling predicts misfolding of the mutant gamma-1 adaptin and heterologous cells show altered protein levels, which is the molecular state this node describes."
  - reference: PMID:41226632
    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phenotype was also not rescued when ap1g1-/- zebrafish embryos were co-injected with both human wild-type and mutated mRNAs, supporting the dominant-negative effect of the new variant."
    explanation: "Failure of the wild-type transcript to rescue in the presence of the mutant transcript is the direct experimental basis for the dominant-negative call."
  - reference: PMID:41226632
    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The observed phenotype is likely due to a dominant-negative effect or a toxic gain-of-function of the mutant AP1G1, impairing the activity or recruitment of the wild-type protein."
    explanation: "States the interference-with-wild-type mechanism, and records that the authors have not separated dominant-negative from toxic gain-of-function - which is why this node is marked PROVISIONAL."
  downstream:
  - target: AP-1 Adaptor Complex Dysfunction
    description: >-
      The misfolded gamma-1 adaptin impairs the activity or recruitment of the
      wild-type subunit, so AP-1 function falls below the level expected from
      loss of one allele alone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41226632
      reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The observed phenotype is likely due to a dominant-negative effect or a toxic gain-of-function of the mutant AP1G1, impairing the activity or recruitment of the wild-type protein."
      explanation: "Names impaired activity or recruitment of the wild-type protein as the step between the mutant allele and complex dysfunction."
- name: AP-1 Adaptor Complex Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Gamma-1 adaptin is one of four subunits of AP-1. The complex recognizes
    sorting motifs in the cytoplasmic tails of transmembrane cargo and recruits
    clathrin, so a deficient or interfered-with gamma-1 subunit reduces
    AP-1-mediated cargo loading into clathrin-coated vesicles.
  protein_complexes:
  - preferred_term: AP-1 adaptor complex
    term:
      id: GO:0030121
      label: AP-1 adaptor complex
  biological_processes:
  - preferred_term: AP-1-mediated cargo loading into clathrin-coated vesicles
    term:
      id: GO:0035653
      label: clathrin-coated vesicle cargo loading, AP-1-mediated
    modifier: DECREASED
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The AP1γ1-mediated adaptor complex is essential for the formation of clathrin-coated intracellular vesicles."
    explanation: "States the essential role of the complex in clathrin-coated vesicle formation, which is the function lost at this node."
  - reference: PMID:37108275
    reference_title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Only AP1 and AP2 complexes form clathrin-coated vesicles (CCVs)."
    explanation: "Establishes that AP-1 is one of only two clathrin-coat-forming adaptor complexes, which is why loss of its gamma subunit is not buffered by the other AP complexes."
  - reference: PMID:10026148
    reference_title: "Early embryonic death of mice deficient in gamma-adaptin."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The heterotetrameric adaptor protein complex 1 (AP-1) promotes the formation of clathrin-coated vesicles at the trans-Golgi network."
    explanation: "Locates the complex's clathrin-coat-forming activity at the trans-Golgi network, the compartment the next node describes."
  downstream:
  - target: Trans-Golgi Network Cargo Sorting Failure
    description: >-
      AP-1 operates at the trans-Golgi network, so reduced complex function
      manifests first as disordered sorting and export from the TGN.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41226632
      reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "AP1G1 is a subunit of the AP-1 adaptor complex responsible for the recognition of protein cargo and the formation of clathrin-coated vesicles between the TGN and endosomes."
      explanation: "Places the AP-1 complex's cargo-recognition function at the TGN-to-endosome step that this edge targets."
  - target: Endosomal Recycling Impairment
    description: >-
      AP-1 also acts on endosomes, and the recessive missense alleles perturb the
      endosome recycling pathway while leaving complex assembly intact.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34102099
      reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies of the recessively inherited missense variants revealed no apparent impact on the interaction of AP1γ1 with other subunits of the AP-1 complex but rather showed to affect the endosome recycling pathway."
      explanation: "Directly reports an endosome-recycling defect downstream of AP1G1 missense alleles."
- name: Trans-Golgi Network Cargo Sorting Failure
  biological_scale: CELLULAR
  description: >-
    In patient fibroblasts carrying a dominant AP1G1 missense allele the cis-Golgi
    marker GM130 is preserved but the trans-Golgi cisternae are diffuse and
    disorganized, and the authors conclude that vesicular trafficking at the
    trans-Golgi level is impaired. Cargo that depends on AP-1 for export from the
    TGN therefore reaches its destination inefficiently.

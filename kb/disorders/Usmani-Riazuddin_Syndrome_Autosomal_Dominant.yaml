discussions:
- discussion_id: ad_ar_one_entity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the autosomal dominant and autosomal recessive AP1G1 disorders one disease
    with two inheritance modes, or two diseases that share a gene?
  attaches_to:
  - disease#Usmani-Riazuddin Syndrome, Autosomal Dominant
  - genetic#AP1G1
  rationale: >-
    They were delineated in one cohort, are described in the follow-up literature
    as showing overlapping clinical features, and both converge on one protein
    complex - which argues for a single entry. Against that: the functional
    evidence separates the allele classes, since the recessive missense proteins
    assemble normally into AP-1 and perturb endosomal recycling while the dominant
    missense proteins interfere with the wild-type subunit, and the dominant class
    also includes whole-gene deletions that can only act through dosage. No study
    has compared the two groups' phenotypes systematically; the only comparison in
    print is the qualitative statement that they overlap.
    They are curated as separate entries for a structural reason rather than a
    biological one: MONDO:0859174 and MONDO:0859196 are siblings under
    MONDO:0003847 with no umbrella term, so neither can be the other's parent, and
    a single entry would need either a new umbrella MONDO term or a
    `mappings.mondo_mappings` anchor plus a real curation pass over the recessive
    form. Resolving this question means doing that work or publishing the
    phenotype comparison, not re-reading the papers already cited here.
  evidence:
  - reference: PMID:41226632
    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Its dominant and recessive forms have been reported in a cohort of patients showing overlapping clinical features."
    explanation: "The published statement that the two inheritance forms overlap clinically, which is the argument for eventually merging them into one entry."
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies of the recessively inherited missense variants revealed no apparent impact on the interaction of AP1γ1 with other subunits of the AP-1 complex but rather showed to affect the endosome recycling pathway."
    explanation: "The functional difference between the two allele classes, which is the argument against lumping."
- discussion_id: dominant_negative_vs_toxic_gof
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the dominant AP1G1 missense alleles act by dominant-negative interference
    with wild-type gamma-1 adaptin, or by a toxic gain of function?
  attaches_to:
  - pathophysiology#Dominant-Negative Gamma-1 Adaptin Missense Protein
  rationale: >-
    The evidence for a dominant effect is strong - co-injection of wild-type
    transcript does not rescue, and mutant transcript is damaging in a wild-type
    background - but both published groups state the two interpretations without
    separating them. The distinction matters therapeutically: a dominant-negative
    allele is a target for allele-selective knockdown, whereas haploinsufficiency
    from the same gene would call for dosage restoration, and the dominant allele
    classes in this disorder include both.
  evidence:
  - reference: PMID:41226632
    reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The observed phenotype is likely due to a dominant-negative effect or a toxic gain-of-function of the mutant AP1G1, impairing the activity or recruitment of the wild-type protein."
    explanation: "The authors state both interpretations as open, which is the gap this discussion records."

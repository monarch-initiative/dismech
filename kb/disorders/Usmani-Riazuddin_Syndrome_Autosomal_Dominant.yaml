name: Usmani-Riazuddin Syndrome, Autosomal Dominant
creation_date: "2026-09-18T00:00:00Z"
description: >-
  The autosomal dominant AP1G1-related neurodevelopmental disorder (USRISD, OMIM
  619467), caused by heterozygous de novo variants in AP1G1, which encodes the
  gamma-1 adaptin subunit of the heterotetrameric clathrin adaptor protein
  complex 1 (AP-1). AP-1 selects cargo and nucleates clathrin-coated vesicles at
  the trans-Golgi network and on endosomes, and is required for the polarized
  delivery of somatodendritic membrane proteins in neurons. Affected individuals
  have mild to severe intellectual disability, speech delay, global developmental
  delay and aggressive behavior, with variable epilepsy, hypotonia, spasticity,
  autistic features, facial dysmorphism and limb defects. The reported dominant
  allele classes are missense, splice-site, frameshift and whole-gene deletion, so
  this form spans both haploinsufficiency and a dominant-negative or toxic effect
  of a misfolded gamma-1 adaptin on the residual wild-type protein. A separate
  autosomal recessive AP1G1 disorder (USRISR, OMIM 619548, MONDO:0859196) exists
  and is not curated here.
category: Mendelian
parents:
- Neurodevelopmental Disorder
disease_term:
  preferred_term: Usmani-Riazuddin syndrome, autosomal dominant
  term:
    id: MONDO:0859174
    label: Usmani-Riazuddin syndrome, autosomal dominant
notes: >-
  Entry scope. This entry curates the AUTOSOMAL DOMINANT form only
  (MONDO:0859174, OMIM 619467). MONDO carries a second AP1G1 term,
  MONDO:0859196 Usmani-Riazuddin syndrome, autosomal recessive (OMIM 619548).
  The two are SIBLINGS, not parent and child: both assert RO:0004003 to hgnc:555
  AP1G1 and both sit directly under MONDO:0003847 hereditary disease, with no
  umbrella term over them (checked with `runoak -i sqlite:obo:mondo info
  MONDO:0859174 MONDO:0859196 -O obo`). The recessive form is therefore NOT
  represented here as a subtype - that would assert a hierarchy the ontology
  contradicts - and is carried in the curation queue instead as
  stubs/Usmani-Riazuddin_Syndrome_Autosomal_Recessive.yaml.
  Whether the two should eventually become one umbrella entry is a real open
  question and is recorded in `discussions`, not settled here: the founding
  cohort delineated both forms in one series and the follow-up literature calls
  their clinical features overlapping, but merging them would need either a new
  umbrella MONDO term or a `mappings.mondo_mappings` anchor, plus an actual
  curation pass over the recessive form.
  No mechanism module was applied. `just list-modules` was searched for
  trafficking, vesicle, Golgi, endosome, sorting and cargo modules, and
  `kb/modules/` was grepped for clathrin, adaptinopathy, AP-1 complex and
  trans-Golgi: the only hits are `synaptic_vesicle_cycle` (presynaptic AP-2 and
  clathrin-mediated synaptic vesicle endocytosis, not AP-1 sorting at the TGN)
  and `apical_neuroependyma_integrity_failure` (ventricular lining integrity).
  Neither describes AP-1-dependent cargo selection at the trans-Golgi network, so
  `conforms_to` was left unset rather than forced.
  No GeneReviews chapter exists for this disorder. This was checked offline with
  `just check-genereviews` against the committed Bookshelf index snapshot of
  2026-09-10 (958 GeneReviews chapters indexed), which reports NO_CHAPTER for both
  GeneReviews and StatPearls. The phenotype baseline for this entry is therefore
  the primary literature rather than a review chapter.
  A deep-research pass was run against this entry
  (research/Usmani-Riazuddin_Syndrome_Autosomal_Dominant-deep-research-claude_code.md,
  provider claude_code). `just preflight-dr` returns PASS against MONDO:0859174 and
  the report's own reference validation reports 11/11 verified with a 0.0
  confabulation rate. Reconciling it against this entry added the two mouse models
  (PMID:10026148, PMID:27090238) and the hyperactivity, hearing-impairment and
  vertebral phenotypes. Two of its claims were deliberately NOT taken up: the
  gnomAD constraint figures (pLI 1.0, LOEUF 0.2) and a neonatal death in the
  founding cohort are both attributed to PMID:34102099, whose cached record is
  abstract-only and contains neither, so neither is quotable and neither is
  asserted here.
references:
- reference: PMID:34102099
  title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
  tags: []
  findings:
  - statement: >-
      De novo heterozygous and bi-allelic AP1G1 variants cause a neurodevelopmental
      disorder with mild to severe intellectual disability, epilepsy and
      developmental delay, established across eleven families.
- reference: PMID:41226632
  title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
  tags: []
  findings:
  - statement: >-
      A de novo AP1G1 missense allele leaves the trans-Golgi cisternae diffuse and
      disorganized in patient fibroblasts, and is not rescued by co-injected
      wild-type transcript in zebrafish, which supports a dominant-negative effect.
- reference: PMID:37108275
  title: "Deficiency of AP1 Complex Ap1g1 in Zebrafish Model Led to Perturbation of Neurodevelopment, Female and Male Fertility; New Insight to Understand Adaptinopathies."
  tags: []
  findings:
  - statement: >-
      Zebrafish homozygous for ap1g1 loss arrest at the blastula stage, while
      heterozygotes survive with reduced brain volume, missing neuronal populations
      and dysregulated cadherin-mediated cell adhesion.
- reference: PMID:38665048
  title: "Usmani-Riazuddin syndrome can have a recognizable phenotype: Report of a novel AP1G1 variant."
  tags: []
  findings:
  - statement: >-
      A second published patient with a de novo AP1G1 variant, carrying the first
      described distinctive facial features for this syndrome.
- reference: PMID:10026148
  title: "Early embryonic death of mice deficient in gamma-adaptin."
  tags: []
  findings:
  - statement: >-
      Mice lacking gamma-1 adaptin die before implantation, and heterozygotes carry
      half the normal amount of assembled AP-1 complex, quantifying the dosage
      effect of losing one allele in a mammal.
- reference: PMID:27090238
  title: "A hypomorphic mutation of the gamma-1 adaptin gene (Ap1g1) causes inner ear, retina, thyroid, and testes abnormalities in mice."
  tags: []
  findings:
  - statement: >-
      A spontaneous in-frame Ap1g1 deletion produces viable adult mice with inner
      ear, retina, thyroid and testes abnormalities, the only mammalian model of
      partial gamma-1 adaptin function surviving past embryogenesis.
- reference: PMID:38840441
  title: "Whole genome sequencing for copy number variant detection to improve diagnosis and management of rare diseases."
  tags: []
  findings:
  - statement: >-
      A de novo whole-gene AP1G1 deletion at 16q22.2, resolved by trio genome
      sequencing after array CGH left it a variant of uncertain significance; the
      disorder's only reported pure dosage lesion.

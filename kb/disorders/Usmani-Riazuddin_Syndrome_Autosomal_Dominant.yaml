- name: Human AP1G1 mRNA rescue and overexpression zebrafish assay
  species: Zebrafish (Danio rerio)
  genotype: ap1g1-/- and wild-type embryos microinjected at the one-cell stage with human wild-type or mutant AP1G1 mRNA
  category: mRNA rescue and overexpression assay
  publication: PMID:41226632
  description: >-
    The assay used to distinguish a dominant-negative from a simple loss-of-function
    allele. Human wild-type AP1G1 mRNA rescues the ap1g1 null; mutant mRNA does
    not; and co-injecting both fails to rescue, which is the signature of
    interference with the wild-type product rather than of its mere absence.
  modeled_mechanisms:
  - target: Dominant-Negative Gamma-1 Adaptin Missense Protein
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Introducing the mutant human transcript into a vertebrate embryo tests
      directly whether the mutant protein is harmful in the presence of wild-type
      protein.
    limitations: >-
      This is transient mRNA microinjection at supraphysiological levels, not an
      engineered heterozygous allele, so the dose does not correspond to a patient
      heterozygote. It also cannot separate a dominant-negative effect from a toxic
      gain-of-function, which the authors state explicitly.
    readouts:
    - name: Larval locomotor activity
      target: Dominant-Negative Gamma-1 Adaptin Missense Protein
      direction: DECREASED
      interpretation: Reduced swum distance after mutant mRNA injection, against normal activity after wild-type mRNA injection.
      evidence:
      - reference: PMID:41226632
        reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Zebrafish larvae injected with WT AP1G1 mRNA displayed normal locomotor activity, whereas larvae injected with MUT AP1G1 exhibited a marked reduction in swum distance."
        explanation: "The locomotor measurement behind this readout, with the wild-type transcript as the internal control."
    evidence:
    - reference: PMID:41226632
      reference_title: "Usmani-Riazuddin Syndrome: Functional Characterization of a Novel c.196G>A Variant in the AP1G1 Gene and Phenotypic Insights Using Zebrafish as a Vertebrate Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phenotype was also not rescued when ap1g1-/- zebrafish embryos were co-injected with both human wild-type and mutated mRNAs, supporting the dominant-negative effect of the new variant."
      explanation: "The co-injection result is what makes this assay informative for a dominant-negative mechanism specifically."
  - target: Perturbed Neurodevelopment and Reduced Brain Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Mutant transcript injected into wild-type embryos produces developmental

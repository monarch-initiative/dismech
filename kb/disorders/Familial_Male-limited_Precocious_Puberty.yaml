- name: GnRH Agonist for Secondary Central Puberty
  description: >-
    A GnRH agonist (deslorelin, triptorelin or buserelin in the reports) is
    added when secondary central puberty develops, restoring control of growth
    and bone maturation. Given alone during the gonadotropin-independent phase
    it has no effect on testosterone, growth or bone age.

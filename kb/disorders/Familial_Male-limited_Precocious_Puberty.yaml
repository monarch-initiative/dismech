genetic:
- name: LHCGR
  gene_term:
    preferred_term: LHCGR
    term:
      id: hgnc:6585
      label: LHCGR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous constitutively activating missense variants, most in exon 11
    (Asp578Gly, Asp578Tyr, Thr577Ile, Ala568Val, Met398Thr and others).
    Loss-of-function LHCGR variants cause the opposite phenotype, Leydig cell
    hypoplasia. Somatic activating variants found only in testicular tissue
    (for example Asp578His) cause sporadic testotoxicosis or Leydig cell tumours
    and are outside this entry. No ClinGen gene-disease validity record was
    found for this pair.
  evidence:
  - reference: PMID:7692306
    reference_title: "A constitutively activating mutation of the luteinizing hormone receptor in familial male precocious puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single A-->G base change that results in substitution of glycine for aspartate at position 578 in the sixth transmembrane helix of the LH receptor was found in affected individuals from eight different families."
    explanation: Original identification of the causal LHCGR variant.
  - reference: PMID:30711030
    reference_title: "Diseases caused by mutations in luteinizing hormone/chorionic gonadotropin receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Familial male-limited precocious puberty, Leydig cell hypoplasia, and empty follicle syndrome are caused by LHCGR mutations."
    explanation: Review naming FMPP among the LHCGR disorders.
diagnosis:
- name: LHCGR genetic testing
  description: >-
    Peripheral precocious puberty in a boy with high testosterone, prepubertal
    or suppressed gonadotropins and only modest testicular enlargement is
    confirmed by finding a heterozygous activating LHCGR variant in blood DNA.
    If none is found, testicular tissue can be tested for a somatic variant.
  diagnosis_term:
    preferred_term: LHCGR gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:9703386
    reference_title: "Testicular seminoma in a patient with a constitutively activating mutation of the luteinizing hormone/chorionic gonadotropin receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this diagnosis was confirmed by molecular genetic analysis that demonstrated the presence of a heterozygous constitutive activating mutation of the luteinizing hormone/chorionic gonadotropin receptor"
    explanation: Molecular confirmation of a clinical FMPP diagnosis.
  - reference: PMID:31394950
    reference_title: "Testotoxicosis without Testicular Mass: Revealed by Peripheral Precocious Puberty and Confirmed by Somatic LHCGR Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observation underlines the need to look for a somatic LHCGR gene mutation from the testicular biopsies of all boys with testotoxicosis with no constitutive LHCGR gene mutation identified from blood DNA"
    explanation: Supports testing testicular tissue when blood testing is negative.
treatments:
- name: Bicalutamide plus Anastrozole
  description: >-
    The regimen recent reports describe as current treatment: the nonsteroidal
    androgen receptor antagonist bicalutamide with the third-generation
    aromatase inhibitor anastrozole, both once a day. Testosterone production is
    not reduced; the drugs block its action at the receptor and its conversion
    to estradiol. The one prospective trial (BATT, 14 boys, 12 months,
    single-arm) normalized the ratio of bone age to chronological age, but the
    change in its primary outcome, growth rate, was small and variable.
    Gynecomastia was the commonest adverse event. Case reports describe both
    sustained control over four to five years and treatment failure.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: once daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bicalutamide
      term:
        id: CHEBI:3090
        label: bicalutamide
    - preferred_term: anastrozole
      term:
        id: CHEBI:2704
        label: anastrozole
  target_mechanisms:
  - target: Androgen Receptor Activation in Target Tissues
    treatment_effect: INHIBITS
    description: Bicalutamide is an androgen receptor antagonist.
    evidence:
    - reference: PMID:29858851
      reference_title: "Central precocious puberty in a case of late-diagnosed familial testotoxicosis and long-term treatment monitoring."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Bicalutamide as an anti-androgen medication and anastrozole as an aromatase inhibitor have been proposed as agents that can be safely used in children."
      explanation: Names bicalutamide as the antiandrogen component of the regimen.
  - target: Peripheral Aromatization of Testosterone to Estradiol
    treatment_effect: INHIBITS
    description: Anastrozole inhibits aromatase, lowering conversion of testosterone to estradiol.
    evidence:
    - reference: PMID:20713483
      reference_title: "Bicalutamide and third-generation aromatase inhibitors in testotoxicosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Recently, the use of combination therapy with a potent antiandrogen agent (bicalutamide) and a third-generation aromatase inhibitor (anastrozole or letrozole) was reported to yield encouraging short-term results."
      explanation: Names anastrozole as the aromatase inhibitor component of the regimen.
  evidence:
  - reference: PMID:21158211
    reference_title: "Bicalutamide plus anastrozole for the treatment of gonadotropin-independent precocious puberty in boys with testotoxicosis: a phase II, open-label pilot study (BATT)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bone age/chronological age ratio was reduced from 2.1 (+/- 0.6) at baseline to 1.0 (+/- 0.4) (p = 0.00013)."
    explanation: Phase II trial in 14 boys; bone maturation normalized over one year.
  - reference: PMID:21158211
    reference_title: "Bicalutamide plus anastrozole for the treatment of gonadotropin-independent precocious puberty in boys with testotoxicosis: a phase II, open-label pilot study (BATT)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 1 year, the mean (standard deviation) change from baseline in growth rate was -1.6 (+/- 5.1) cm/year and -0.1 (+/- 1.8) SD units, and in bone maturation was -2.3 (+/- 0.5) years."
    explanation: >-
      The primary outcome, growth rate, fell by a mean of 1.6 cm/year with a
      standard deviation of 5.1, so the effect on growth was small and variable
      in this uncontrolled trial.
  - reference: PMID:21158211
    reference_title: "Bicalutamide plus anastrozole for the treatment of gonadotropin-independent precocious puberty in boys with testotoxicosis: a phase II, open-label pilot study (BATT)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gynecomastia (42.9%) and breast tenderness (12.5%) were the most common treatment-related adverse events."
    explanation: Adverse events of the combination in the same trial.
  - reference: PMID:16939760
    reference_title: "Treatment of familial male-limited precocious puberty with bicalutamide and anastrozole."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical improvements include decreased facial acne and pubic hair. Most importantly, a marked decrease in growth velocity and skeletal advancement has been achieved."
    explanation: First report of the combination, in two boys.
  - reference: PMID:20713483
    reference_title: "Bicalutamide and third-generation aromatase inhibitors in testotoxicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present here the results of longer-term treatment (4.5 and 5 years) with this combination therapy in 2 boys who demonstrated that it is well tolerated, slows bone-age advancement in the face of continued linear growth, and prevents progression of virilization."
    explanation: Control maintained over 4.5 and 5 years in two boys.
  - reference: PMID:20333877
    reference_title: "Treatment of familial male-limited precocious puberty (testotoxicosis) with anastrozole and bicalutamide in a boy with a novel mutation in the luteinizing hormone receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical response showed decreased advancement of skeletal maturation, secondary sexual characteristics and aggressiveness with no short-term side effects."
    explanation: Response in a 5-year-old boy with a novel LHCGR variant.
  - reference: PMID:26831561
    reference_title: "Testotoxicosis: Report of Two Cases, One with a Novel Mutation in LHCGR Gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Combination of bicalutamide+anastrozole was ineffective in slowing pubertal progression and bone age."
    explanation: Two patients in whom bicalutamide plus anastrozole failed; response is not universal.
- name: Spironolactone plus Testolactone
  description: >-
    The original National Institutes of Health regimen: spironolactone as a
    weak androgen receptor blocker with testolactone, a first-generation
    aromatase inhibitor. Either drug alone was unsatisfactory; together they
    returned growth rate and bone maturation to prepubertal values. Followed to
    adult height with a GnRH agonist added at central puberty, the approach
    gave adult heights within the normal male range and modestly below
    midparental height. Later reports use anastrozole or letrozole in place of
    testolactone, which also cross-reacts in testosterone immunoassays.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

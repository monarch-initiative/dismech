    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early intervention using a regimen including letrozole and spironolactone, and later GnRHa, appears beneficial in limiting physical signs and improving adult height without major side effects."
    explanation: Six treated boys in a ten-patient series; two reached adult heights of 176 and 173 cm.
  - reference: PMID:29654692
    reference_title: "Adult height in patients with familial male-limited precocious puberty and the role of an aromatase inhibitor in patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aromatase inhibitor therapy is associated with a positive height outcome in FMPP but the outcome with and without intervention is unpredictable."
    explanation: Compilation of adult height in 25 men, 21 of them treated, with the authors' caution about predictability.
- name: Ketoconazole
  description: >-
    Ketoconazole inhibits cytochrome P450 steroidogenic enzymes, in particular
    the 17,20-lyase step, and lowers testosterone within a day. Unlike the
    receptor-blocking regimens it reduces testosterone production, so serum
    testosterone can be used to follow it. In one five-patient series adult
    height matched target height; in another, adult height outcome was limited.
    Escape occurs when central puberty begins, more readily in boys with
    advanced bone age. One series reported a transient rise in transaminases
    in one of five boys; one boy on a high dose developed liver and renal
    failure with pneumonitis that resolved when the drug was stopped.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: every 8 hours
  dosing_interval_days: 0.33
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ketoconazole
      term:
        id: CHEBI:47519
        label: ketoconazole
  target_mechanisms:
  - target: CYP17A1 17,20-Lyase Step of Leydig Cell Androgen Synthesis
    treatment_effect: INHIBITS
    description: Inhibits C17-20 lyase and so lowers testosterone production.
    evidence:
    - reference: PMID:3539979
      reference_title: "Gonadotropin-independent precocious puberty (\"testotoxicosis\"): influence of maturational status on response to ketoconazole."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Serum testosterone levels fell significantly within 24 h in all three patients, with reciprocal changes in serum 17-hydroxyprogesterone, consistent with inhibition of C17-20 lyase activity."
      explanation: Ketoconazole lowered testosterone and raised 17-hydroxyprogesterone, the signature of lyase inhibition.
  evidence:
  - reference: PMID:3539979
    reference_title: "Gonadotropin-independent precocious puberty (\"testotoxicosis\"): influence of maturational status on response to ketoconazole."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

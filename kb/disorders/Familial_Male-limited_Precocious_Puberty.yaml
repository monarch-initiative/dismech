    explanation: Buserelin added to ketoconazole after escape restored hormonal control.
  - reference: PMID:3080571
    reference_title: "The NIH experience with precocious puberty: diagnostic subgroups and response to short-term luteinizing hormone releasing hormone analogue therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with peripheral precocious puberty, however, had no significant change in gonadotropin or sex steroid levels, growth rate, or the rate of bone age maturation, and no improvement in secondary sexual characteristics."
    explanation: >-
      In the NIH series, which included six boys with familial male precocious
      puberty, an LHRH analogue alone did nothing in peripheral precocious
      puberty. This supports restricting the drug to the central phase.
  - reference: PMID:6223935
    reference_title: "Gonadotropin-independent familial sexual precocity with premature Leydig and germinal cell maturation (familial testotoxicosis): effects of a potent luteinizing hormone-releasing factor agonist and medroxyprogesterone acetate therapy in four cases."

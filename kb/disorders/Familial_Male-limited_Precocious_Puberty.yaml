    evidence_source: HUMAN_CLINICAL
    snippet: "The potent LRF analog D-Trp6-Pro9-NEt-LRF did not result in suppression of plasma testosterone or Leydig cell function even after 3 months of daily treatment in two patients which provides additional support of pituitary gonadotropin independence and of the lack of a direct effect of the analog on Leydig cell function."
    explanation: Three months of an LRF agonist alone did not lower testosterone in two boys.
- name: Testicular Surveillance from Mid-Puberty
  description: >-
    Self-examination and periodic testicular ultrasound from mid-puberty into
    adulthood have been recommended because germ cell tumours and Leydig cell
    adenomas have been found in young men with FMPP. The recommendation rests
    on case reports and a literature review; no study has tested a surveillance
    schedule.
  action_category: MONITORING
  notes: >-
    The phenotypes this surveillance looks for are the entry's
    phenotypes#Testicular germ cell tumor in adulthood and
    phenotypes#Leydig cell adenoma. They are named here rather than in
    target_phenotypes, which is a therapeutic-action slot.
  evidence:
  - reference: PMID:36071555
    reference_title: "Familial Male-limited Precocious Puberty (FMPP) and Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, prolonged patient monitoring from mid-pubertal age onward including instruction for self-examination and periodic testicular ultrasound investigation in patients with a germline LHCGR pathogenic variant might contribute to early detection and thus early treatment of testicular GCT."
    explanation: Surveillance recommendation from two families and a literature review.
  - reference: PMID:29029242
    reference_title: "Germ Cell Neoplasia in Situ and Preserved Fertility Despite Suppressed Gonadotropins in a Patient With Testotoxicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend regular clinical examination and ultrasonic evaluation of the testes in these patients due to potential increased risk of malignancy."
    explanation: Same recommendation from a 25-year single-patient follow-up.

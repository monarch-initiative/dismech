      snippet: "Furthermore, for the first time, a marked pubertal-type LH response was found after GnRH administration in contrast to the absent response consistently found in all patients before ketoconazole therapy."
      explanation: The GnRH-stimulated LH response changed from absent to pubertal when central puberty began.
  evidence:
  - reference: PMID:6223935
    reference_title: "Gonadotropin-independent familial sexual precocity with premature Leydig and germinal cell maturation (familial testotoxicosis): effects of a potent luteinizing hormone-releasing factor agonist and medroxyprogesterone acetate therapy in four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These events appear to be nongonadotropin-dependent in view of the absence of a pubertal pattern of pulsatile LH secretion, persistence of a prepubertal LH response to LRF even after long standing sexual precocity, prepubertal basal levels of LH and undetectable hCG, and the absence of biologically active LH-hCG by bioassay."
    explanation: Prepubertal basal LH and prepubertal LH response to releasing factor in four boys.

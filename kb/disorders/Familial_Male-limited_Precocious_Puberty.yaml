    intermediate_mechanisms:
    - CYP17A1 17,20-Lyase Step of Leydig Cell Androgen Synthesis
  - target: CYP17A1 17,20-Lyase Step of Leydig Cell Androgen Synthesis
    description: >-
      cAMP-driven steroidogenesis in the Leydig cell runs through the
      cytochrome P450 steps of androgen synthesis. The edge is placed from
      general Leydig cell physiology; the patient evidence for the lyase step
      is on the node itself.
    causal_link_type: DIRECT
  - target: Premature Leydig Cell Proliferation
    description: cAMP signalling drives early Leydig cell proliferation and differentiation.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:7692306
    reference_title: "A constitutively activating mutation of the luteinizing hormone receptor in familial male precocious puberty."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COS-7 cells expressing the mutant LH receptor exhibited markedly increased cyclic AMP production in the absence of agonist, suggesting that autonomous Leydig cell activity in FMPP is caused by a constitutively activated LH receptor."
    explanation: >-
      Transfected cells expressing the Asp578Gly receptor show agonist-independent
      cAMP production.
  - reference: PMID:23861372
    reference_title: "Precocious puberty and Leydig cell hyperplasia in male mice with a gain of function mutation in the LH receptor gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In transfected cells, mouse D582G mLHR exhibited constitutive activity with a 23-fold increase in basal cAMP levels compared with the wild-type receptor."
    explanation: >-
      The mouse equivalent of the human Asp578Gly receptor raises basal cAMP
      23-fold in transfected cells.
- name: CYP17A1 17,20-Lyase Step of Leydig Cell Androgen Synthesis
  description: >-
    Testosterone made by the autonomous Leydig cells still passes through the
    17,20-lyase (C17-20 lyase) reaction of CYP17A1, which converts
    17-hydroxylated C21 steroids to C19 androgens. This is the step ketoconazole
    blocks: testosterone falls within a day and the substrate
    17-hydroxyprogesterone rises.
  role: Intermediate
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYP17A1
    term:
      id: hgnc:2593
      label: CYP17A1
  molecular_functions:
  - preferred_term: steroid 17,20-lyase activity of CYP17A1
    description: >-
      Oxidative cleavage of the C17 to C20 bond of 17-alpha-hydroxysteroids to
      C19 androgen precursors, the second reaction of the CYP17A1 polypeptide
      and the one ketoconazole blocks. Deliberately unbound, as in
      Congenital_Adrenal_Hyperplasia: GO:0004508 is defined as the
      17-alpha-hydroxylation, a different reaction of the same enzyme, and
      GO:0047442 (17-alpha-hydroxyprogesterone aldolase activity, the EC
      4.1.2.30 name for this reaction) is obsolete in GO, so no identifier is
      asserted rather than reusing the hydroxylase term.
  biological_processes:
  - preferred_term: androgen biosynthetic process
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  downstream:
  - target: Gonadotropin-Independent Testosterone Synthesis
    description: The lyase reaction supplies the C19 precursors of testosterone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3539979
      reference_title: "Gonadotropin-independent precocious puberty (\"testotoxicosis\"): influence of maturational status on response to ketoconazole."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Serum testosterone levels fell significantly within 24 h in all three patients, with reciprocal changes in serum 17-hydroxyprogesterone, consistent with inhibition of C17-20 lyase activity."
      explanation: >-
        Blocking the lyase step with ketoconazole lowered testosterone and raised
        the substrate 17-hydroxyprogesterone in three boys, which places this
        reaction upstream of the testosterone excess. The inference is from drug
        response.
  evidence:

    explanation: Ketoconazole rapidly lowered testosterone by blocking C17-20 lyase.
  - reference: PMID:3539979
    reference_title: "Gonadotropin-independent precocious puberty (\"testotoxicosis\"): influence of maturational status on response to ketoconazole."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, after 1-3 months of continuing treatment, an \"escape\" phenomenon occurred, characterized by progressive increases in serum LH, FSH, and testosterone concentrations."
    explanation: Escape from ketoconazole within one to three months in three boys with advanced bone age, as central puberty started.
  - reference: PMID:15522928
    reference_title: "Adult height after ketoconazole treatment in patients with familial male-limited precocious puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult height was 173 cm (median; interquartile range, 14), similar to target height (175 cm; interquartile range, 9) and significantly higher than pretreatment predicted height (165 cm; interquartile range, 12; P < 0.01)."
    explanation: Adult height in five boys treated for a median of 6.2 years.
  - reference: PMID:18088394
    reference_title: "Long-term treatment of familial male-limited precocious puberty (testotoxicosis) with cyproterone acetate or ketoconazole."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term treatment with cyproterone acetate or ketoconazole resulted in similar outcomes without important side-effects in boys with testotoxicosis. However, both therapies showed limited efficacy in attaining normal adult height."
    explanation: Five boys on ketoconazole for a mean of 8 years; growth slowed but adult height outcome was limited.
  - reference: PMID:9362394
    reference_title: "Long-term outcome of male-limited gonadotropin-independent precocious puberty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ketoconazole was effective in reducing testosterone secretion, but its real effect on final height cannot be determined"
    explanation: Effective on testosterone, with uncertain effect on adult height.
  - reference: PMID:7819701
    reference_title: "Hazards of ketoconazole therapy in testotoxicosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that this boy's illness, including the interstitial pneumonitis, represented a reaction to ketoconazole which was dose-related rather than idiosyncratic."
    explanation: Severe multi-organ toxicity in a boy receiving 1200 mg daily, resolving on withdrawal.
  notes: >-
    The dosing interval is the 8-hourly schedule used in the 1987 study that
    established the mechanism (PMID:3539979), where the dose was 200 mg.
    Later series dosed by weight (a median of 16.2 mg/kg per day in
    PMID:15522928; 10 mg/kg in PMID:18088394), so neither the dose nor the
    interval is a general recommendation.
- name: Cyproterone Acetate
  description: >-
    An antiandrogen used alone or with an aromatase inhibitor. Testosterone stays high during treatment. Results are
    mixed: one retrospective study found growth slowing similar to
    ketoconazole, another found no clinical effect and no gain in final
    height.

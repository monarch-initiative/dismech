    explanation: Current Orphadata classifies laryngeal stenosis as occasional (29-5%) in Atelosteogenesis type I.
  - reference: PMID:23401428
    reference_title: "Clinical report: Two patients with atelosteogenesis type I caused by missense mutations affecting the same FLNB residue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory insufficiency with tracheal hypoplasia, laryngeal stenosis,
      and pulmonary hypoplasia have all been described in patients with AO type
      I and we conclude that compromised pulmonary function is a major
      contributor to morbidity and mortality in this condition.
    explanation: The clinical report directly identifies laryngeal stenosis within the AO1 respiratory phenotype.
diagnosis:
- name: Prenatal Ultrasound and MRI
  description: >
    Detailed fetal ultrasound and, when useful, MRI can recognize an AO-like
    pattern of severe limb shortening, dislocations, thoracic hypoplasia, and
    delayed or absent ossification. Because several lethal skeletal dysplasias
    overlap radiographically, imaging establishes suspicion and guides testing;
    molecular confirmation defines FLNB-AO1.
  evidence:
  - reference: PMID:12454961
    reference_title: "Prenatal diagnosis of atelosteogenesis type I at 21 weeks' gestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meticulous evaluation using fetal US and MRI permits a definitive prenatal
      diagnosis of AO I to be made.
    explanation: >-
      This historical case supports imaging-based prenatal recognition; current
      spectrum knowledge and genetic heterogeneity argue against treating the
      imaging pattern alone as molecularly definitive.
- name: Molecular FLNB Testing and Spectrum Diagnosis
  description: >
    Molecular diagnosis uses a skeletal-dysplasia gene panel, exome sequencing,
    or genome sequencing to identify a heterozygous gain-of-function FLNB
    variant in a fetus or neonate with AOI-like findings. Molecular results are
    important for distinguishing FLNB-AOI from AO-like lethal dysplasias caused
    by other genes, including SLC26A2-related atelosteogenesis type II, and from
    recessive FLNB loss-of-function disorders such as spondylocarpotarsal
    synostosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: FLNB
        term:
          id: hgnc:3755
          label: FLNB
  results: A heterozygous gain-of-function pathogenic FLNB variant.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of other FLNB-related disorders (LS, AO1, AO3) is
      established in a proband by identification of a heterozygous
      gain-of-function pathogenic variant in FLNB by molecular genetic testing.
    explanation: GeneReviews defines heterozygous gain-of-function FLNB molecular confirmation as the diagnostic standard.
  - reference: PMID:24624349
    reference_title: "Identification of a de novo heterozygous missense FLNB mutation in lethal atelosteogenesis type I by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to screen all possible genes associated with AO-like lethal
      skeletal dysplasias simultaneously, we performed whole-exome sequencing in
      a female newborn having clinical features of AO-I.
    explanation: >-
      Demonstrates exome sequencing as a diagnostic approach for AOI-like lethal
      skeletal dysplasia with differential genetic causes.
  - reference: PMID:24624349
    reference_title: "Identification of a de novo heterozygous missense FLNB mutation in lethal atelosteogenesis type I by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified a novel missense variant (c.517G>A;
      p.Ala173Thr) in exon 2 of the FLNB gene in the patient.
    explanation: >-
      Supports molecular confirmation of AOI by identifying a heterozygous FLNB
      variant in a clinically affected newborn.
treatments:
- name: Individualized Perinatal Respiratory and Palliative Planning
  description: >
    No disease-modifying treatment is established for perinatal-lethal AO1.
    Prenatal counseling and delivery planning should prepare families and the
    neonatal team for potentially severe thoracic, pulmonary, and upper-airway
    compromise. Decisions about respiratory intervention and comfort-focused
    care should be individualized to the infant's anatomy, response to support,
    prognosis, and family goals.
  treatment_term:
    preferred_term: palliative care
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  evidence:
  - reference: PMID:9779808
    reference_title: "Prenatal ultrasonographic description and postnatal pathological findings in atelosteogenesis type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      anticipation of the poor prognosis in AO1 is essential for appropriate
      genetic counseling of the parents and for determining postnatal treatment
      options.
    explanation: >-
      Supports prenatal planning and postnatal treatment decisions around AOI's
      poor prognosis.
  - reference: PMID:23401428
    reference_title: "Clinical report: Two patients with atelosteogenesis type I caused by missense mutations affecting the same FLNB residue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical course of one child was influenced by airway instability and
      bronchopulmonary dysplasia that complicated intubation and prevented
      separation from ventilator support.
    explanation: >-
      Demonstrates why neonatal respiratory support decisions in AOI require
      careful perinatal planning.
- name: Genetic Counseling and Parental Mosaicism Assessment
  description: >
    Genetic counseling should explain dominant inheritance, the usual de novo
    origin of lethal AOI, and the residual recurrence risk from parental somatic
    or gonadal mosaicism. Parental FLNB testing is important when a parent has
    mild limb asymmetry or other subtle FLNB-spectrum findings.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30231296
    reference_title: "Diagnosis of Atelosteogenesis Type I suggested by Fetal Ultrasonography and Atypical Paternal Phenotype with Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      parents affected with a mild phenotype, probably with somatic mosaicism,
      can generate offspring with a much more severe phenotype of AOI.
    explanation: >-
      Supports counseling families that a mildly affected mosaic parent can have
      a child with lethal AOI.
  - reference: PMID:30231296
    reference_title: "Diagnosis of Atelosteogenesis Type I suggested by Fetal Ultrasonography and Atypical Paternal Phenotype with Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense mutation not previously described in the literature was detected
      in the FLNB gene, affecting ∼ 20% of the evaluated cells and, therefore,
      confirming the diagnosis of mosaic AOI in the father.
    explanation: >-
      Directly supports parental molecular testing for suspected mosaicism.
differential_diagnoses:
- name: Atelosteogenesis type II
  description: >
    A clinically and radiographically overlapping perinatal-lethal skeletal
    dysplasia in the SLC26A2 sulfate-transporter spectrum, with autosomal
    recessive inheritance and distinctive cartilage-matrix pathology rather
    than monoallelic FLNB gain of function.
  disease_term:
    preferred_term: atelosteogenesis type II
    term:
      id: MONDO:0009727
      label: atelosteogenesis type II
  distinguishing_features:
  - Biallelic SLC26A2 disorder rather than a heterozygous FLNB disorder
  - Distinctive chondro-osseous histopathology with disturbed cartilage-matrix sulfation
  evidence:
  - reference: PMID:9133349
    reference_title: "Atelosteogenesis syndromes: a review, with comments on their pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atelosteogenesis type II shows distinctive chondro-osseous histopathology
      with a major disturbance in cartilage matrix macromolecules.
    explanation: The review identifies the cartilage-matrix pathology that separates AO2 from AO1.
- name: Atelosteogenesis type III
  description: >
    An allelic monoallelic FLNB gain-of-function skeletal dysplasia that overlaps
    AO1, but survival beyond the neonatal period can occur, especially with
    intensive respiratory support.
  disease_term:
    preferred_term: atelosteogenesis type III
    term:
      id: MONDO:0007168
      label: atelosteogenesis type III
  distinguishing_features:
  - Survival beyond the neonatal period is possible
  - Overlapping FLNB disorder requiring phenotype-spectrum interpretation
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with FLNB-AO3, survival beyond the neonatal period is
      possible with intensive and invasive respiratory support.
    explanation: GeneReviews distinguishes AO3 from perinatal-lethal AO1 by possible longer survival.
- name: Larsen syndrome
  description: >
    A generally milder monoallelic FLNB gain-of-function disorder with congenital
    large-joint dislocations, clubfeet, craniofacial findings, and vertebral
    anomalies that overlap AO1 but without the defining perinatal-lethal
    micromelic presentation.
  disease_term:
    preferred_term: Larsen syndrome
    term:
      id: MONDO:0007875
      label: Larsen syndrome
  distinguishing_features:
  - Usually milder than FLNB-AO1 and compatible with longer-term survival
  - Congenital dislocations and clubfeet overlap, so molecular and spectrum-level interpretation is needed
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNB-LS is characterized by combinations of congenital dislocations of
      the hip, knee, and elbow; clubfeet (equinovarus or equinovalgus foot
      deformities); scoliosis and cervical kyphosis (which can be associated
      with a cervical myelopathy); short, broad, spatulate distal phalanges;
      distinctive craniofacial features (prominent forehead, depressed nasal
      bridge, malar flattening, and widely spaced eyes); vertebral anomalies;
      and supernumerary carpal and tarsal ossification centers.
    explanation: GeneReviews describes the overlapping but generally milder FLNB-Larsen phenotype.
notes: >
  Atelosteogenesis type I is usually fatal in the perinatal period and belongs
  to the severe end of the monoallelic FLNB gain-of-function spectrum, with
  boomerang and Piepkorn dysplasia now best treated as part of the FLNB-AOI
  spectrum, AOIII as an overlapping but sometimes survivable disorder, and
  Larsen syndrome as a milder dominant FLNB disorder. This mechanism is distinct
  from SLC26A2-related atelosteogenesis type II and from autosomal recessive
  FLNB loss-of-function spondylocarpotarsal synostosis. Most lethal AOI cases
  are de novo, but parental somatic mosaicism can produce a mild parental
  phenotype and a severely affected child. Increased F-actin affinity and
  cellular F-actin clustering are demonstrated for selected actin-binding-domain
  substitutions, but the in-vivo steps linking different FLNB variants to fetal
  cartilage disorganization and the full AO1 phenotype remain incompletely
  resolved; variant-specific experimental results should not be generalized to
  every AO1 allele.

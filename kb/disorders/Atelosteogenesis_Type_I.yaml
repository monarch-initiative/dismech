progression:
- phase: Prenatal onset with perinatal lethality
  age_range: Prenatal to neonatal period
  notes: >
    Skeletal abnormalities arise prenatally and are detectable by fetal imaging.
    FLNB-AO1 is generally lethal in the perinatal period; compromised pulmonary
    function, including thoracic restriction, pulmonary hypoplasia, and upper
    airway instability or stenosis, is a major contributor to mortality.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FLNB-AO1 is lethal in the perinatal period."
    explanation: The current GeneReviews update defines the usual outcome of FLNB-AO1.
  - reference: PMID:23401428
    reference_title: "Clinical report: Two patients with atelosteogenesis type I caused by missense mutations affecting the same FLNB residue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory insufficiency with tracheal hypoplasia, laryngeal stenosis,
      and pulmonary hypoplasia have all been described in patients with AO type
      I and we conclude that compromised pulmonary function is a major
      contributor to morbidity and mortality in this condition.
    explanation: The two-patient report identifies respiratory compromise as a major determinant of the severe clinical course.
pathophysiology:
- name: Monoallelic FLNB gain-of-function and abnormal actin binding
  description: >
    FLNB-AO1 is caused by heterozygous gain-of-function FLNB variants, commonly
    clustered in the CH2 actin-binding domain or repeats 14-15. Biochemical work
    on the actin-binding-domain substitutions W148R and M202V showed increased
    F-actin affinity, and cellular work on W148R showed F-actin clustering,
    focal-adhesion rearrangement, and delayed directional migration. These
    experiments establish a plausible cytoskeletal mechanism for an important
    variant subset; they do not demonstrate that every AO1 variant has the same
    biochemical effect or fully resolve the bridge from altered FLNB to fetal
    cartilage pathology.

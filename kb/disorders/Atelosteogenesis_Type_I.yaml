name: Atelosteogenesis Type I
creation_date: '2026-03-04T07:42:25Z'
category: Mendelian
description: >
  Atelosteogenesis type I (FLNB-AO1) is the perinatal-lethal end of the
  monoallelic FLNB gain-of-function skeletal-dysplasia spectrum. It is
  characterized by severe short-limbed dwarfism, incomplete or regionally absent
  ossification, vertebral and long-bone abnormalities, congenital joint
  dislocations, clubfeet, distinctive craniofacial findings, and respiratory
  compromise from thoracic, pulmonary, and laryngotracheal abnormalities.

  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum
      of phenotypic severity ranging from apparently isolated clubfoot to Larsen
      syndrome (FLNB-LS), atelosteogenesis type 3 (FLNB-AO3), and
      atelosteogenesis type 1 (FLNB-AO1), which is perinatal lethal.
    explanation: GeneReviews classifies FLNB-AO1 as a monoallelic gain-of-function disorder.
  - reference: PMID:16752402
    reference_title: "Mutations in two regions of FLNB result in atelosteogenesis I and III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the mutations resided in exon 2 and exon 3, which encode
      the CH2 domain of the actin-binding region of filamin B. The remaining
      mutations were found in exon 28 and exon 29, which encode repeats 14 and
      15 of filamin B.
    explanation: >-
      The AOI/AOIII series identifies two recurrent variant clusters, including
      the actin-binding domain.
  - reference: PMID:19505475
    reference_title: "Disease-associated substitutions in the filamin B actin binding domain confer enhanced actin binding affinity in the absence of major structural disturbance: Insights from the crystal structures of filamin B actin binding domains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Characterisation of the wild type and mutant ABD F-actin binding activities
      via co-sedimentation assays shows that the mutant FLNB ABDs have increased
      F-actin binding affinities, with dissociation constants of 2.0 microM
      (W148R) and 0.56 microM (M202V), compared to the wild type ABD K(d) of 7.0
      microM.
    explanation: >-
      Purified-protein assays demonstrate increased F-actin affinity for two
      disease-associated actin-binding-domain substitutions.
  - reference: PMID:26491051
    reference_title: F-actin clustering and cell dysmotility induced by the pathological W148R missense mutation of filamin B at the actin-binding domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ectopic expression of FLNB-W148R and, to a lesser extent, FLNB-E227K
      induced prominent F-actin accumulations and the consequent rearrangement
      of focal adhesions, myosin II, and septin filaments and results in a
      delayed directional migration of the cells.
    explanation: >-
      Cell experiments connect selected pathological FLNB substitutions to
      abnormal actin organization and migration.
  downstream:
  - target: Abnormal growth-plate cartilage and endochondral ossification
    description: >
      Altered FLNB-actin behavior is proposed to disturb chondrocyte organization
      and skeletal development, but the intervening in-vivo steps are not fully
      established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26491051
      reference_title: F-actin clustering and cell dysmotility induced by the pathological W148R missense mutation of filamin B at the actin-binding domain.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        The F-actin clustering through the interaction with the mutant FLNB ABD
        may limit the cytoskeletal reorganization, preventing normal skeletal
        development.
      explanation: >-
        The study proposes the cytoskeletal-to-skeletal link for selected
        variants but does not resolve it in fetal growth-plate tissue.
- name: Abnormal growth-plate cartilage and endochondral ossification
  description: >
    AO1 cartilage shows irregular clusters that can include giant chondrocytes,
    while cartilage anlagen undergo incomplete ossification. The pathological
    observations support abnormal cartilage organization and endochondral bone
    formation, although they do not identify a single universal cellular step.

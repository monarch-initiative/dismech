definitions:
- name: FLNB-AO1 spectrum definition
  definition_type: OTHER
  description: >
    A monoallelic FLNB gain-of-function disorder at the perinatal-lethal end of
    the FLNB skeletal-dysplasia spectrum; contemporary GeneReviews scope also
    subsumes the historically named boomerang and Piepkorn dysplasias under the
    FLNB-AO1 spectrum.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum
      of phenotypic severity ranging from apparently isolated clubfoot to Larsen
      syndrome (FLNB-LS), atelosteogenesis type 3 (FLNB-AO3), and
      atelosteogenesis type 1 (FLNB-AO1), which is perinatal lethal.
    explanation: The current GeneReviews update defines FLNB-AO1 within the monoallelic gain-of-function spectrum and states its perinatal lethality.
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For the purposes of this GeneReview, the previously described entities
      Piepkorn dysplasia and boomerang dysplasia are subsumed under the FLNB-AO1
      spectrum.
    explanation: The current GeneReviews scope supplies the historical-entity boundary used here.
inheritance:
- name: Autosomal dominant FLNB disorder
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    The disease model is autosomal dominant and is caused by a heterozygous
    gain-of-function FLNB pathogenic variant. Most lethal FLNB conditions arise
    de novo, but transmission from a heterozygous or mosaic parent is possible.
  de_novo_rate: The vast majority of lethal FLNB conditions result from de novo pathogenic variants.
  evidence:
  - reference: PMID:16752402
    reference_title: "Mutations in two regions of FLNB result in atelosteogenesis I and III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOI and AOIII are autosomal dominant lethal skeletal dysplasias
      characterized by overlapping clinical findings that include vertebral
      abnormalities, disharmonious skeletal maturation, hypoplastic long bones,
      and joint dislocations.
    explanation: >-
      This directly supports dominant inheritance and lethal disease severity in
      AOI.
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some individuals have the disorder as the result of a de novo pathogenic
      variant (the vast majority of lethal FLNB conditions are the result of de
      novo pathogenic variants).
    explanation: GeneReviews supports the usual de novo origin while preserving the possibility of familial or mosaic transmission.

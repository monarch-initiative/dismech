- category: Treatment Response
  name: Refractoriness to Oral Iron
  frequency: VERY_FREQUENT
  description: >-
    Not a symptom but a therapeutic-response phenotype, and it is close to being
    part of the disease definition rather than an outcome of it - the entity was
    delimited by the failure of oral iron in multiplex kindreds before the gene
    was known. Curated here so it is queryable rather than buried in the treatment
    section.

    Banded VERY_FREQUENT rather than OBLIGATE, and the demotion is evidence-led
    rather than cautious. Two siblings with compound heterozygous TMPRSS6 variants
    already reported in classic IRIDA have been maintained on low-dose oral iron
    alone since diagnosis. One published exception is enough to make an OBLIGATE
    band false, and this exception is well characterised: genotype-confirmed, and
    reported precisely because it expands the disease spectrum.

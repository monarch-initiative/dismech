- name: Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Matriptase-2 cleaves haemojuvelin at the plasma membrane. Haemojuvelin is a
    BMP co-receptor that drives HAMP transcription, so removing it from the
    hepatocyte surface lowers hepcidin; failing to remove it keeps hepcidin up.

    Graded PROVISIONAL, and the reason is specific rather than generic caution.
    The supporting evidence is strong for the reaction and weak for the location.
    Eight IRIDA missense alleles were assayed and seven of them impair
    matriptase-2 autoactivation, reduce membrane haemojuvelin cleavage, and fail
    to inhibit haemojuvelin-dependent hepcidin activation - a genotype-activity
    correspondence across human disease alleles, not a single anecdote. But every
    one of those measurements is in transfected cells, none is in a patient
    hepatocyte, and in vivo mouse work finds the liver behaving differently from
    hepatoma cells for an adjacent substrate.

    The sharper problem is that in vivo dissection has since shown the catalytic
    domain to be required for hepcidin suppression while its proteolytic activity
    is not. The cleavage reaction is real and human disease alleles impair it; what
    is in doubt is whether the suppression runs through it. This node is retained
    rather than deleted for that reason, and the discussions carry the argument.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: BMP signaling through membrane hemojuvelin
    modifier: INCREASED
    term:

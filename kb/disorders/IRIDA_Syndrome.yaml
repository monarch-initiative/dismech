      0.001).
    explanation: >-
      The head-to-head comparison against iron-deficient controls, with both
      directions and both p values.
  - reference: PMID:35163840
    reference_title: "Transferrin Saturation/Hepcidin Ratio Discriminates TMPRSS6-Related Iron Refractory Iron Deficiency Anemia from Patients with Multi-Causal Iron Deficiency Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      develop microcytic anemia with remarkably low transferrin saturation (TSAT),
      low-normal ferritin levels, and a poor response to oral iron treatment
    explanation: >-
      States the expected ferritin range in IRIDA alongside the other two elements
      of the laboratory signature.
  notes: >-
    Bound to the general term HP:0040133 "Abnormal circulating ferritin
    concentration" rather than to the increased or decreased child terms, and the
    choice is deliberate. The finding is neither: it is a value that would be
    unremarkable in isolation and is abnormal only relative to the iron status.
    This is the same ontology gap as the hepcidin binding in this entry - HPO
    represents direction of change but not inappropriateness for a physiological
    context - and both are recorded in `notes` rather than papered over with a
    child term that asserts a direction the patients do not reliably show.
- category: Laboratory
  name: Hyperferritinemia at Presentation
  frequency: VERY_RARE
  description: >-
    A documented departure from the expected picture: two French-Canadian siblings
    presented with severe microcytic anaemia, hypoferremia and *raised* ferritin,
    a combination that fits no previously described genetic iron-deficiency
    anaemia, and both were carrying compound heterozygous TMPRSS6 variants
    previously reported to cause classic IRIDA.

    Curated because it is the presentation that would stop a clinician
    considering the diagnosis, and because the same kindred is the counterexample

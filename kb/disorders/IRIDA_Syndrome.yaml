inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Recessive transmission was inferred in the defining study from unaffected
    parents of affected sibling pairs, with consanguinity in one of the five
    multiplex kindreds, and biallelic TMPRSS6 variants were identified where
    phase could be determined. Later reviews treat the disease as recessive
    without qualification.

    One caveat is worth recording because it recurs in variant interpretation.
    In one of the original kindreds only a single paternal allele was found; the
    authors did not exclude a second lesion of a class their sequencing could
    not see, such as a large deletion. A patient with a convincing IRIDA
    phenotype and one apparent TMPRSS6 allele is therefore not evidence against
    the recessive model.

    A later registry series takes this further and reports monoallelic patients
    as a recognised group rather than as unresolved cases: they present later in
    life with a milder microcytic anaemia than biallelic patients, who typically
    present in childhood. The disease is still described as autosomal recessive,
    and this entry keeps that classification, but the monoallelic observation is
    recorded here because it bears directly on whether a single pathogenic allele
    in a symptomatic adult should be reported.

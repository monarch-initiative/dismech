  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of inappropriately elevated urinary hepcidin levels in
      individuals with IRIDA provides insight into the pathophysiology of the
      disorder
    explanation: >-
      The primary measurement of non-suppressed hepcidin in patients.
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the low/undetectable hepcidin levels observed in acquired
      iron deficiency, in patients with Matriptase-2 deficiency, serum hepcidin
      is inappropriately high for the low iron status
    explanation: >-
      States the contrast with acquired iron deficiency that gives the finding
      its discriminating value.
- category: Laboratory
  name: Serum Ferritin Inappropriately Preserved
  frequency: VERY_FREQUENT
  description: >-
    The lab value that most cleanly separates IRIDA from acquired iron deficiency,
    and it separates them by not being low enough. Ferritin in IRIDA sits in the
    low-normal range because the body's iron is misplaced rather than absent -
    hepcidin holds it in macrophages - whereas in acquired deficiency the stores
    really are empty. Measured head to head, ferritin was significantly higher in
    IRIDA patients than in iron-deficient controls at p < 0.001.

    The direction of the abnormality is therefore the opposite of what "iron
    deficiency anaemia" leads a reader to expect, which is why it is curated as a
    phenotype in its own right rather than left implicit.
  phenotype_term:
    preferred_term: Serum ferritin inappropriately preserved for the degree of iron deficiency
    term:

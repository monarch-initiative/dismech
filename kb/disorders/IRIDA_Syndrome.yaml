biochemical:
- name: Serum hepcidin
  presence: PRESENT
  biomarker_term:
    preferred_term: Elevated circulating hepcidin concentration
    term:
      id: HP:0031877
      label: Elevated circulating hepcidin concentration
  evidence:
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hallmarks of this disease are microcytic hypochromic anemia, low
      transferrin saturation and normal/high serum hepcidin values.
    explanation: >-
      Establishes serum hepcidin as a hallmark laboratory measurement in the
      disease.
  notes: >-
    The single most informative test in the differential, precisely because the
    abnormality is directional rather than a threshold crossing. A hepcidin value
    that would be unremarkable in a healthy person is abnormal in a patient with
    a transferrin saturation of five percent.

    No reference range is curated here on purpose. Hepcidin immunoassays and
    mass-spectrometry methods are not harmonised, absolute values are not
    comparable between laboratories, and there is no consensus adult interval to
    cite - so a numeric range in this entry would be a false precision. See the
    knowledge-gap discussion on assay standardisation.
- name: Transferrin saturation
  presence: PRESENT
  biomarker_term:
    preferred_term: Decreased transferrin saturation
    term:
      id: HP:0012464
      label: Decreased transferrin saturation
  evidence:
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transferrin saturation (%) was calculated by dividing the serum iron level
      by the total iron binding capacity and multiplying by 100.
    explanation: >-
      The measurement definition used to characterise the defining cohort.
  notes: >-
    Low, and required to interpret the hepcidin result. The pair is the test, not
    either value alone.
definitions:
- name: Transferrin saturation to hepcidin ratio
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  scope: >-
    Early discrimination of TMPRSS6-related IRIDA from other causes of iron
    deficiency anaemia, in a patient already found to be iron deficient.
  description: >-
    A single computable quantity - transferrin saturation in percent divided by
    plasma hepcidin-25 in nM - with a derived threshold of 5.6 %/nM. Below the
    threshold suggests IRIDA; above it suggests iron deficiency from another
    cause.

    The ratio is the right form for this test because the abnormality it detects
    is relative. Neither the transferrin saturation nor the hepcidin level is
    diagnostic alone: a patient with acquired iron deficiency and an IRIDA patient
    can share a transferrin saturation, and a hepcidin value that is normal in
    absolute terms is the abnormal finding here. Dividing one by the other is what
    turns "inappropriately high for the iron status" into a number.

    Two preconditions are part of the rule, not caveats attached to it. It applies
    only when the patient has had no iron therapy in the preceding three months and
    has no moderate-to-severe inflammation, because both raise hepcidin
    independently of TMPRSS6 and would push a control across the threshold.
  inclusion_criteria:
  - preferred_term: Established iron deficiency anaemia
    description: Iron deficiency anaemia already demonstrated on standard haematological and iron indices.
  - preferred_term: No iron therapy in the previous three months
    description: >-
      The derivation cohort's controls were required to be iron-therapy naive over
      this window, because administered iron raises hepcidin directly.
  - preferred_term: C-reactive protein below 10.0 mg/L
    description: >-
      The inflammation ceiling used in the derivation study, excluding
      moderate-to-severe inflammation.
  - preferred_term: Hepcidin-25 measured by a mass-spectrometry-calibrated method
    description: >-
      The threshold is expressed in nM against standardised isotope dilution mass
      spectrometry and is not portable to an uncalibrated immunoassay.
  exclusion_criteria:
  - preferred_term: Recent oral or parenteral iron therapy
    description: >-
      Raises hepcidin independently of TMPRSS6 and can move an IRIDA patient above
      the threshold, producing a false negative.
  - preferred_term: Moderate-to-severe inflammation
    description: >-
      Raises hepcidin through the inflammatory axis and reproduces the IRIDA
      pattern in a patient who does not have it.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Validated against TMPRSS6 genotype as the reference standard, which is the
      correct gold standard for this question, and the discrimination was
      complete: area under the curve 1.000, sensitivity and specificity both 100%.

      Recorded as VALIDATED_AGAINST_GOLD_STANDARD on that basis, with the
      qualification that this is a derivation study rather than an external
      validation. Twenty registry-ascertained IRIDA patients and 39 selected
      controls is a small and enriched sample; the confidence intervals the
      authors report are the honest summary of the precision, and they themselves
      ask for further exploration in a broader population. No independent cohort
      has been reported applying the 5.6 %/nM threshold.
    evidence:
    - reference: PMID:35163840
      reference_title: "Transferrin Saturation/Hepcidin Ratio Discriminates TMPRSS6-Related Iron Refractory Iron Deficiency Anemia from Patients with Multi-Causal Iron Deficiency Anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The area under the curve for the TSAT/hepcidin ratio was 1.000 with 100%
        sensitivity and specificity (95% confidence intervals 84-100% and
        91-100%, respectively) at an optimal cut-off point of 5.6%/nM.
      explanation: >-
        The operating characteristics and the threshold, together with the
        confidence intervals that carry the precision.
  evidence:
  - reference: PMID:35163840
    reference_title: "Transferrin Saturation/Hepcidin Ratio Discriminates TMPRSS6-Related Iron Refractory Iron Deficiency Anemia from Patients with Multi-Causal Iron Deficiency Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IRIDA patients had significantly lower TSAT/hepcidin ratios compared to IDA
      controls, median 0.6%/nM (interquartile range, IQR, 0.4-1.1%/nM) and
      16.7%/nM (IQR, 12.0-24.0%/nM), respectively.
    explanation: >-
      The separation the threshold sits inside, with both group distributions
      given rather than only the cut-off.
  - reference: PMID:35163840
    reference_title: "Transferrin Saturation/Hepcidin Ratio Discriminates TMPRSS6-Related Iron Refractory Iron Deficiency Anemia from Patients with Multi-Causal Iron Deficiency Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TSAT/hepcidin ratio shows excellent performance in discriminating IRIDA
      from TMPRSS6-unrelated IDA early in the diagnostic work-up of IDA provided
      that recent iron therapy and moderate-to-severe inflammation are absent.
    explanation: >-
      Graded PARTIAL because the sentence carries its own conditions: the
      performance claim holds only under the two exclusions curated above, which
      is why they are inclusion criteria of the rule rather than footnotes to it.
  attaches_to:
  - "biochemical#Serum hepcidin"
  - "biochemical#Transferrin saturation"
  - "pathophysiology#Inappropriately Elevated Circulating Hepcidin"
  notes: >-
    The 5.6 %/nM threshold is method-bound. Hepcidin was measured by standardised
    isotope dilution mass spectrometry, and routine hepcidin immunoassays are not
    calibrated to it, so the numeric cut-off cannot be carried to another
    laboratory without cross-calibration. Applying it to an uncalibrated
    immunoassay result would be a units error dressed as a diagnosis.
genetic:
- name: TMPRSS6
  gene_term:
    preferred_term: TMPRSS6
    term:
      id: hgnc:16517
      label: TMPRSS6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    TMPRSS6 encodes matriptase-2, a type II transmembrane serine protease
    expressed primarily in the liver. Its ectodomain carries CUB and LDL-receptor
    class A modules and a trypsin-like serine protease domain; the mutations
    reported in IRIDA span all of these.
  notes: >-
    Two points that matter when interpreting a new variant.

    First, the disease-associated allelic spectrum is broad. The defining cohort
    found frameshift, splice-junction, nonsense and missense variants, all distal
    to exon 8, and by 2013 forty distinct alleles had been reported across the
    whole large ectodomain. Absence from the catalytic domain is not reassuring.

    Second, and less widely appreciated, common TMPRSS6 variation is a
    quantitative modifier of iron status in the general population as well as a
    cause of this Mendelian disease. This entry curates only the biallelic
    loss-of-function disease; the common-variant association is a different claim
    with a different evidence base and is deliberately not asserted here.

    Third, genotype carries prognostic information. Patients with two nonsense
    alleles have more severe anaemia and microcytosis and higher hepcidin than
    other genotypes, which is the expected direction if residual matriptase-2
    activity is what sets hepcidin. That correlation is drawn from a series of 21
    patients and should be read as a tendency, not a rule for an individual.
  evidence:
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals harbored frame-shift mutations, splice junction
      mutations or missense mutations altering residues conserved
    explanation: >-
      The classes of variant found, supporting the loss-of-function mechanism.
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the disease-associated variants were present in the NCBI and
      Ensembl SNP databases or in 100 control chromosomes
    explanation: >-
      Population-absence evidence for pathogenicity of the reported alleles.
  - reference: PMID:25064705
    reference_title: "Iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The discovery that many of these cases harbor mutations in the TMPRSS6
      gene led to the recognition that they represent a single clinical entity:
      iron-refractory iron deficiency anemia (IRIDA).
    explanation: >-
      Independent statement that TMPRSS6 genotype is what delimits the entity.
  - reference: PMID:25156943
    reference_title: "Functional and clinical impact of novel TMPRSS6 variants in iron-refractory iron-deficiency anemia patients and genotype-phenotype studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our genotype-phenotype correlation analysis demonstrates that patients
      carrying two nonsense mutations present a more severe anemia and
      microcytosis and higher hepcidin levels than the other patients.
    explanation: >-
      The genotype-severity correlation recorded in the notes above.
  - reference: PMID:25156943
    reference_title: "Functional and clinical impact of novel TMPRSS6 variants in iron-refractory iron-deficiency anemia patients and genotype-phenotype studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirm that TMPRSS6 mutations are spread along the gene and that
      mechanistically they fully or partially abrogate hepcidin inhibition.
    explanation: >-
      Supports the statement that the allelic spectrum is not confined to the
      catalytic domain, and that the functional effect is graded rather than
      binary.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate is published. The literature describes the
    entity through kindreds and case series rather than through an epidemiological
    denominator, and the closest quantitative anchor is the count of distinct
    reported TMPRSS6 alleles - forty by 2013 - which counts mutations, not
    patients, and is recorded here only as an order-of-magnitude indication that
    the reported population is small.

    rate_per_100000 is deliberately left empty. Deriving a rate from an allele
    count would be an invention.
  evidence:
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 40 different Matriptase-2 mutations have been reported, affecting
      all the functional domains of the large ectodomain of the protein.
    explanation: >-
      Graded PARTIAL: it bounds the size of the reported literature but is a
      count of alleles rather than of patients, and is not a prevalence
      measurement.
treatments:
- name: Parenteral Iron
  description: >-
    The mainstay of treatment. It bypasses the blocked duodenal step but not the
    macrophage one, so the response is slow and the correction partial rather
    than complete.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:29033
        label: iron(2+)
  target_mechanisms:
  - target: Impaired Duodenal Iron Absorption
    treatment_effect: BYPASSES
    description: >-
      Delivering iron intravenously circumvents the enterocyte export block
      entirely. It does nothing about the hepcidin elevation that caused it,
      which is why this is curated as BYPASSES rather than INHIBITS or RESTORES.
    evidence:
    - reference: PMID:23729726
      reference_title: "Iron refractory iron deficiency anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The disease is refractory to oral iron treatment but shows a slow
        response to intravenous iron injections and partial correction of the
        anemia.
      explanation: >-
        Supports parenteral iron as effective where oral iron is not, and records
        that the correction is partial.
  evidence:
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current treatment of iron refractory iron deficiency anemia is based
      on parenteral iron administration
    explanation: >-
      Names parenteral iron as the current standard of care.
- name: Oral Iron
  description: >-
    Curated because it is what patients are given for years before the diagnosis
    is made, not because it works. It does not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:29033
        label: iron(2+)
  evidence:
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abnormal iron absorption characterized by no hematological improvement
      following treatment with oral iron
    explanation: >-
      Graded REFUTE against the claim that oral iron treats this disease. The
      quoted finding is a negative therapeutic result and is the reason the
      entity has "refractory" in its name.
  - reference: PMID:30594846
    reference_title: "Favourable improvement in haematological parameters in response to oral iron and vitamin C combination in children with Iron Refractory Iron Deficiency Anemia (IRIDA) phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We prospectively evaluated our IRIDA cohort (n = 7) with oral iron and
      vitamin c dose over a period of 10 weeks and noted complete response in
      majority (6/7 = 86%) with >2 g/dL rise in Hb along with significant
      improvement of other iron related indices.
    explanation: >-
      Points the other way from the item above and is graded PARTIAL rather than
      SUPPORT for two reasons stated by the source itself. The cohort is seven
      children, uncontrolled and unblinded; and the paper's own title describes
      them as having the IRIDA *phenotype*, not confirmed biallelic TMPRSS6
      genotype, so some may have had oral-iron-responsive iron deficiency that
      IRIDA was never the explanation for. This is evidence that the combination
      deserves a trial, not that the refractoriness claim is wrong.
  notes: >-
    No target_mechanisms link is curated for oral iron, and the omission is
    deliberate: the drug does not act on any node in this pathograph, which is
    precisely the clinical point. That holds for the ascorbate combination too -
    ascorbate acts on luminal iron reduction and uptake, upstream of the
    ferroportin export step that hepcidin blocks, so even a real effect would not
    be acting on a node curated here.

    The two evidence items on this treatment deliberately disagree, and the
    disagreement is the content. One is a defining-cohort negative result, the
    other a seven-patient uncontrolled positive result in a phenotypically
    defined group. Collapsing them to a single grade would misrepresent the
    literature.
- name: Hepcidin-Lowering Therapy
  description: >-
    Not an available treatment. Curated as a stated therapeutic direction because
    the mechanism identifies the target unusually cleanly - the disease is caused
    by hepcidin that is too high, so an agent that lowers it would address the
    lesion rather than its consequence.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the future, manipulation of the hepcidin pathway with the aim of
      suppressing it might become an alternative therapeutic approach
    explanation: >-
      Graded PARTIAL because the source states this as a prospect, not as a
      demonstrated therapy. No clinical trial in IRIDA is cited here, and none
      should be inferred from this item.
  notes: >-
    Deliberately carries no target_mechanisms link and no therapeutic_agent.
    Linking a hypothetical agent to the hepcidin node would render an arrow on
    the pathograph asserting a therapeutic action that has not been demonstrated
    in this disease.
animal_models:
- name: mask mouse (Tmprss6 splice-site mutant)
  species: Mouse
  genotype: Tmprss6 mask, homozygous ENU-induced splicing defect
  publication: PMID:18451267
  description: >-
    A chemically induced recessive mouse mutant recovered on phenotype - hair
    loss and microcytic anaemia - and mapped to a Tmprss6 splicing defect. It is
    the model that established what the human gene does, and it was published
    within weeks of the human gene discovery.
  modeled_mechanisms:
  - target: Failure to Suppress Hepcidin Transcription in Iron Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces the core lesion - Tmprss6 loss, high hepcidin, reduced
      dietary iron absorption, microcytic anaemia - and is the system in which the
      Hamp-promoter mechanism was demonstrated.
    limitations: >-
      One phenotypic divergence is worth stating rather than glossing. The mouse
      is named for progressive loss of body but not facial hair, and alopecia of
      this kind is not a feature of human IRIDA. Whatever produces the mask coat
      phenotype is therefore either mouse-specific or an aspect of matriptase-2
      biology that human patients do not show, and it should not be used to
      predict a human phenotype.
    readouts:
    - name: Red cell volume and dietary iron absorption
      target: Failure to Suppress Hepcidin Transcription in Iron Deficiency
      direction: DECREASED
      interpretation: >-
        Microcytic anaemia resulting from reduced dietary iron absorption, the
        mouse counterpart of the human erythroid phenotype.
      evidence:
      - reference: PMID:18451267
        reference_title: "The serine protease TMPRSS6 is required to sense iron deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The mask phenotype results from reduced absorption of dietary iron
          caused by high levels of hepcidin and is due to a splicing defect in
          the transmembrane serine protease 6 gene Tmprss6.
        explanation: >-
          Reports the measured absorption defect and its hepcidin cause in the
          mutant.
    evidence:
    - reference: PMID:18451267
      reference_title: "The serine protease TMPRSS6 is required to sense iron deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        TMPRSS6 is an essential component of a pathway that detects iron
        deficiency and blocks Hamp transcription, permitting enhanced dietary
        iron absorption.
      explanation: >-
        Supports treating this model as informative for the hepcidin-suppression
        node.
experimental_models:
- name: Matriptase-2 hemojuvelin cleavage assay in transfected cells
  experimental_model_type: CELL_LINE
  description: >-
    Co-expression of matriptase-2 - wild type, the mask truncation, or the human
    disease allele R774C - with haemojuvelin in cultured cells, read out by
    hepcidin promoter activity and by cleavage of membrane haemojuvelin.
  modeled_mechanisms:
  - target: Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates the proposed enzymatic step and shows it is graded by
      genotype: absent for the mouse truncation, partial for the human missense
      allele.
    limitations: >-
      Overexpression in a heterologous cell line rather than a hepatocyte
      carrying the variant at its endogenous locus, so the assay establishes that
      the reaction can occur and is genotype-sensitive, not that it is the
      rate-limiting step in a patient's liver. Fidelity is graded MODERATE on
      that basis.
    readouts:
    - name: Membrane hemojuvelin cleavage by matriptase-2 variants
      target: Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
      direction: DECREASED
      interpretation: >-
        Cleavage is abolished by the mask truncation and reduced by the human
        R774C allele relative to wild-type matriptase-2.
      evidence:
      - reference: PMID:18976966
        reference_title: "The serine protease matriptase-2 (TMPRSS6) inhibits hepcidin activation by cleaving membrane hemojuvelin."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          matriptase-2(MASK) shows no cleavage activity and the human mutant only
          partial cleavage capacity
        explanation: >-
          The graded cleavage result that this readout records.
    evidence:
    - reference: PMID:18976966
      reference_title: "The serine protease matriptase-2 (TMPRSS6) inhibits hepcidin activation by cleaving membrane hemojuvelin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we confirm the inhibitory effect of matriptase-2 on hepcidin
        promoter; we show that matriptase-2 lacking the serine protease domain,
        identified in the anemic Mask mouse (matriptase-2(MASK)), is fully
        inactive and that mutant R774C found in patients with genetic iron
        deficiency has decreased inhibitory activity.
      explanation: >-
        Supports the assay as informative for the cleavage node, with an explicit
        genotype-activity relationship.
differential_diagnoses:
- name: Acquired iron deficiency anemia
  description: >-
    The differential that matters, because it is overwhelmingly more common and
    the two overlap heavily on a full blood count and iron panel. They are not
    strictly indistinguishable: measured head to head, IRIDA patients had lower
    MCV and higher ferritin than iron-deficient controls, both significantly. But
    those are group differences with overlapping distributions, not a rule for an
    individual, and the ferritin difference points the counter-intuitive way -
    higher in the patient with the genetic iron-handling defect.

    The separating test is hepcidin, read against the transferrin saturation:
    suppressed in acquired deficiency, not suppressed in IRIDA. The therapeutic
    trial separates them too, but only after months of ineffective treatment, and
    a genotype-confirmed kindred responsive to oral iron shows even that is not
    absolute.
  distinguishing_features:
  - Hepcidin is low or undetectable in acquired iron deficiency, but within or above the normal range in IRIDA despite an equally low transferrin saturation.
  - Ferritin is significantly higher in IRIDA than in acquired iron deficiency, because the iron is sequestered rather than absent - the opposite of the naive expectation.
  - A haematological response to oral iron argues strongly against IRIDA, but does not exclude it; a genotype-confirmed kindred has been maintained on low-dose oral iron alone.
  evidence:
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the low/undetectable hepcidin levels observed in acquired
      iron deficiency, in patients with Matriptase-2 deficiency, serum hepcidin
      is inappropriately high for the low iron status
    explanation: >-
      States the discriminating direction of the hepcidin result between the two
      conditions.
- name: Thalassemia trait and other inherited microcytoses
  description: >-
    A congenital microcytic anaemia with a very low MCV in a child invites a
    haemoglobinopathy work-up first, and IRIDA is commonly found only after that
    is negative. The defining study excluded the other inherited causes of
    microcytosis explicitly before implicating TMPRSS6.
  distinguishing_features:
  - Transferrin saturation is low in IRIDA and typically normal in thalassaemia trait.
  - Haemoglobin electrophoresis is normal in IRIDA.
  evidence:
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acquired causes of iron deficiency and other inherited causes of
      microcytosis were rigorously excluded
    explanation: >-
      Records that the entity was delimited by exclusion of exactly this
      differential.
  - reference: PMID:23729726
    reference_title: "Iron refractory iron deficiency anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A challenge for the clinicians and pediatricians is the recognition of the
      disorder among iron deficiency and other microcytic anemias commonly found
      in pediatric patients.
    explanation: >-
      States the recognition problem this differential describes.
discussions:
- discussion_id: irida_two_mechanisms_one_gene
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is matriptase-2's suppression of hepcidin a proteolytic event at all, and if
    not, what does that mean for interpreting a patient's missense variant?
  attaches_to:
  - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
  - "pathophysiology#Failure to Suppress Hepcidin Transcription in Iron Deficiency"
  rationale: >-
    Two papers published months apart in 2008 give different answers, and this
    entry curates them as parallel arms rather than resolving a question it has
    no basis to resolve.

    The haemojuvelin account is enzymatic and extracellular: matriptase-2 cleaves
    membrane haemojuvelin, removing a BMP co-receptor that drives HAMP
    transcription. The promoter account is not enzymatic at all - the mouse work
    reports that the cytoplasmic domain mediates Hamp suppression through
    proximal promoter elements, which is not something an ectodomain protease
    activity explains.

    A third result reframes the question rather than settling it between those
    two. Dissecting the proteolytic and non-proteolytic contributions in mice,
    with a protease-dead full-length allele and a truncation lacking the catalytic
    domain, found that the catalytic domain was required to suppress hepcidin -
    but its proteolytic activity was not. Binding, not cutting: the ectodomain
    engaging haemojuvelin, Alk3, ActRIIA and Hfe. A disease-causing allele in that
    same work could still be activated and still failed to suppress hepcidin, and
    what it had lost was its interaction with those partners.

    So the live question is no longer only *which domain*, it is *whether the
    disease is a loss of proteolysis at all*. Note the entry keeps the cleavage
    node rather than deleting it: matriptase-2 does cleave haemojuvelin, the
    reaction is real, and human disease alleles impair it. What is now in doubt is
    whether that cleavage is what the hepcidin suppression runs through.

    The reason this is not academic, and it has sharpened. Every functional assay
    used to classify a novel TMPRSS6 variant reads out cleavage. If suppression is
    a binding function, a variant that cleaves normally in an assay may still be
    pathogenic through lost partner interaction, and a cleavage-normal result is
    not reassurance. The same paper says so in its own conclusion - that
    proteolytic activity is not an appropriate target for modulating MT2
    therapeutically - which is the drug-discovery version of the same point.
  proposed_experiments:
  - experiment_id: exp_irida_domain_separation
    name: Separation-of-function TMPRSS6 alleles in hepatocytes
    description: >-
      Express catalytically dead and cytoplasmic-domain-deleted TMPRSS6 at
      endogenous levels in primary or iPSC-derived human hepatocytes and measure
      HAMP transcription and membrane haemojuvelin independently. If catalytic
      inactivation alone reproduces the full loss of Hamp suppression, the
      cytoplasmic-domain effect is downstream or dispensable.
    would_support:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    supporting_outcome:
    - A catalytically dead allele fails to suppress HAMP and fails to clear membrane haemojuvelin, while the cytoplasmic-domain deletion behaves like wild type.
    would_refute:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    refuting_outcome:
    - A catalytically dead allele still suppresses HAMP normally, placing the operative activity outside the protease domain.
  - experiment_id: exp_irida_binding_versus_cleavage_variant_panel
    name: Partner-binding assay alongside cleavage for a panel of TMPRSS6 variants
    description: >-
      Assay a panel of reported IRIDA missense variants for both haemojuvelin
      cleavage and ectodomain binding to haemojuvelin, ALK3, ACTRIIA and HFE, and
      test which readout better predicts hepcidin suppression. If binding predicts
      and cleavage does not, the standard functional assay used in variant
      classification is measuring the wrong thing.
    would_support:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    supporting_outcome:
    - Cleavage capacity predicts hepcidin suppression across the panel at least as well as partner binding does.
    would_refute:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    refuting_outcome:
    - Variants that cleave haemojuvelin normally but bind partners poorly fail to suppress hepcidin, showing the disease runs through binding rather than proteolysis.
  evidence:
  - reference: PMID:32384154
    reference_title: "The ectodomain of matriptase-2 plays an important nonproteolytic role in suppressing hepcidin expression in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies of the protease-dead full-length Mt2 (Mt2S762A) and the truncated
      Mt2 that lacks the catalytic domain (Mt2mask) indicate that the catalytic
      domain, but not its proteolytic activity, was required for Mt2 to suppress
      hepcidin expression.
    explanation: >-
      The separation-of-function result that reframes the question: domain
      required, activity not.
  - reference: PMID:32384154
    reference_title: "The ectodomain of matriptase-2 plays an important nonproteolytic role in suppressing hepcidin expression in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Coimmunoprecipitation analysis revealed that Mt2I286F, but not Mt2S762A, had
      reduced interactions with Hjv, ActRIIA, and Hfe.
    explanation: >-
      Ties a disease-causing allele's failure to lost partner binding rather than
      to lost catalysis, which is what makes the variant-interpretation point
      concrete rather than theoretical.
  - reference: PMID:32384154
    reference_title: "The ectodomain of matriptase-2 plays an important nonproteolytic role in suppressing hepcidin expression in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these observations support the idea that the substrate interaction with Mt2
      plays a determinant role and suggest that the proteolytic activity is not an
      appropriate target to modulate the function of MT2 for clinical applications
    explanation: >-
      The authors' own conclusion, including its therapeutic corollary.
- discussion_id: irida_hepcidin_assay_standardisation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the diagnostic hepcidin measurement be interpreted across laboratories,
    and what is the decision rule?
  attaches_to:
  - "biochemical#Serum hepcidin"
  - "phenotypes#Hepcidin Not Suppressed Despite Iron Deficiency"
  rationale: >-
    A decision rule exists, it performs extremely well, and it is not yet safe to
    treat as a general-purpose test. Those three things are all true and the
    entry curates the rule in `definitions` rather than in prose so the caveats
    travel with it.

    The rule is the transferrin-saturation-to-hepcidin ratio, below 5.6 %/nM, and
    in its derivation study it separated 20 IRIDA patients from 39 iron-deficient
    controls with an area under the curve of 1.000 - perfect separation, sensitivity
    and specificity both 100%. That is a stronger result than this differential
    usually gets.

    What is not settled is whether the number transfers. Three things about the
    derivation constrain it. Hepcidin was measured by standardised isotope-dilution
    mass spectrometry, and the cut-off is expressed in nM against that method;
    routine hepcidin immunoassays are not calibrated to it, so 5.6 %/nM is not
    portable to another laboratory's units without recalibration. The controls were
    selected to exclude recent iron therapy and CRP of 10.0 mg/L or above, which
    removes the two commonest confounders in exactly the population where the test
    would be used. And with an AUC of 1.000 in 59 people, the confidence intervals
    are what carry the information, not the point estimate: the authors report
    them as 84-100% and 91-100% and say the observations warrant further
    exploration in a broader population.

    This is why `reference_ranges` on the hepcidin biomarker is still empty. A
    single-analyte interval is the wrong object here - the informative quantity is
    the ratio, and the ratio's threshold is method-bound.
  proposed_experiments:
  - experiment_id: exp_irida_hepcidin_ratio_external_validation
    name: External validation of the TSAT/hepcidin ratio in an unselected population
    description: >-
      Apply the 5.6 %/nM threshold prospectively in consecutive patients presenting
      with iron deficiency anaemia in routine practice - without excluding recent
      iron therapy or mild inflammation - with TMPRSS6 sequencing as the reference
      standard, and report the operating characteristics alongside a
      cross-calibration of the local hepcidin assay against isotope-dilution mass
      spectrometry.
    would_support:
    - "definitions#Transferrin saturation to hepcidin ratio"
    supporting_outcome:
    - The published threshold retains a useful positive predictive value in consecutive unselected patients after assay cross-calibration.
    would_refute:
    - "definitions#Transferrin saturation to hepcidin ratio"
    refuting_outcome:
    - Discrimination degrades substantially once recent iron therapy and mild inflammation are no longer exclusions, or the threshold shifts materially between hepcidin methods.
- discussion_id: irida_neogenin_liver_versus_cell_line
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does matriptase-2 cleave its partners in the liver the way it does in cultured
    hepatoma cells, and which system should a variant's functional assay be run in?
  attaches_to:
  - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
  rationale: >-
    Nearly all the functional evidence for this disease is transfected-cell
    biochemistry, and there is now a direct demonstration that at least one of
    those cell-line results does not hold in vivo.

    Matriptase-2 cleaves neogenin and sharply reduces neogenin levels in cultured
    hepatoma cells. In mouse liver it does the opposite - it stabilises neogenin -
    and matriptase-2's suppression of hepcidin turns out to require neogenin to be
    present. The same protease, the same partner, opposite directions in the two
    systems.

    That is a `HUMAN_MODEL_MISMATCH` rather than a `KNOWLEDGE_GAP` in the strict
    sense used here: the evidence exists and is good, and what is uncertain is
    which system's answer describes a patient's hepatocyte. The practical stake is
    variant interpretation. A novel TMPRSS6 missense variant is currently assessed
    by exactly the transfected-cell cleavage assay whose fidelity this result puts
    in question, and a variant that cleaves normally in a hepatoma line is not
    thereby shown to be benign.

    Note the mismatch here is model-to-model, mouse liver against human cell line,
    with the human hepatocyte unobserved in both. That makes it a weaker claim
    about human biology than the label might suggest, and a stronger one about not
    trusting the cell line alone.
  proposed_experiments:
  - experiment_id: exp_irida_cleavage_assay_system_comparison
    name: Same-allele comparison across hepatoma line, primary hepatocyte and liver
    description: >-
      Run the same panel of IRIDA missense alleles through the haemojuvelin and
      neogenin cleavage assays in a hepatoma line, in primary or iPSC-derived human
      hepatocytes, and in humanised mouse liver, and compare the rank order of
      functional impairment across the three systems. Concordant rank order would
      license continued use of the cheap assay; discordance would say which alleles
      have been misclassified.
    would_support:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    supporting_outcome:
    - Allele impairment ranks the same way in the hepatoma line as in hepatocytes and liver, so the cell-line assay is a valid surrogate.
    would_refute:
    - "pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin"
    refuting_outcome:
    - Alleles that look severely impaired in the hepatoma line behave normally in hepatocytes or liver, or the reverse.

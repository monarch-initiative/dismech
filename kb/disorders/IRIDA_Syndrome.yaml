- category: Laboratory
  name: Hepcidin Not Suppressed Despite Iron Deficiency
  frequency: VERY_FREQUENT
  description: >-
    The discriminating laboratory finding, and the reason a single hepcidin
    assay can separate IRIDA from acquired iron deficiency. The abnormality is
    relative, not absolute: values sit within or above the normal range at a time
    when they should be undetectable.

    Curated as VERY_FREQUENT rather than OBLIGATE deliberately. It is
    mechanistically obligate, but the published human measurements are five
    individuals from three kindreds in the defining paper plus subsequent series,
    and hepcidin assays were not standardised across them - so the frequency
    band records what has been measured rather than what the model predicts.

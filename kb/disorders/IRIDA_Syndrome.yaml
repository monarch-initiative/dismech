    snippet: >-
      We report a French-Canadian kindred in which 2 siblings presented in early
      childhood with severe microcytic anemia, hypoferremia, and
      hyperferritinemia. Both children have been successfully treated solely with
      low-dose oral iron since diagnosis.
    explanation: >-
      The presentation and, in the same sentence, the treatment response that
      makes this kindred doubly exceptional.
  - reference: PMID:23319530

  icimd_category:
  - classification_value: iron_metabolism
    notes: >-
      ICIMD group "Disorders of iron metabolism" under category 22, disorders of
      trace elements and metals. Placed on the metabolic axis rather than treated
      as a primary bone-marrow disorder: the erythroid compartment is normal and
      is starved of substrate by a defect in systemic iron handling upstream of
      it.

      No `mechanistic_category` is assigned. That enum is a small closed set of
      protein-class nosologies (RASopathy, ciliopathy, laminopathy and so on) and
      none of them describes a hepatic protease that regulates a hormone; leaving
      it empty is the accurate answer rather than a gap.

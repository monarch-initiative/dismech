notes: >-
  Scope. This entry covers the Mendelian disease caused by biallelic TMPRSS6
  loss of function. Common TMPRSS6 polymorphisms are robustly associated with
  haemoglobin and iron indices in the general population, but that is a
  quantitative-trait association rather than this disease, and asserting it here
  would blur a monogenic entity into a susceptibility claim.

  On the two hepcidin-related HP bindings. Both the phenotype "Hepcidin Not
  Suppressed Despite Iron Deficiency" and the biochemical marker use
  HP:0031877 "Elevated circulating hepcidin concentration". HPO has no term for
  hepcidin that is inappropriately high for iron status, which is what the
  disease actually shows, and HP:0031877 is the nearest true statement rather
  than an exact one. The distinction is carried in preferred_term, the
  descriptions, and the assay discussion. A future curator should not "improve"
  this by binding to a term implying an absolute elevation that patients
  frequently do not have.

  On GeneReviews. There is no GeneReviews chapter for IRIDA or for TMPRSS6 - a
  PubMed search of `GeneReviews[Book] OR GeneReviews[Title]` against both terms
  returns nothing. PMID:25064705 is a Hematol Oncol Clin North Am review and
  should not be mistaken for one.

  Not curated for want of quotable evidence in the sources fetched here:
  numeric haematological values from the defining cohort's Table 1 (a table this
  cache renders as prose, so quoting a cell would be unsafe), the natural
  history into adulthood, and pregnancy management.

  Provenance. The entry was built from primary literature; an OpenScientist deep
  research report was run alongside it and is committed as
  `research/IRIDA_Syndrome-deep-research-openscientist.md`. Four of the six
  references added in the second pass - the TSAT/hepcidin ratio study, the
  TMPRSS6 variant functional series, the oral-iron-plus-ascorbate cohort, and
  the anti-TMPRSS6 antibody trial - were leads the report surfaced and this
  curator did not have. Each was verified against PubMed and fetched through
  `just fetch-reference` before use; none was taken from the report's own
  quotation of it. Two of the report's leads changed a conclusion rather than
  adding detail: the ratio study contradicted a draft claim that no validated
  decision rule existed, and the antibody trial supplied human causal evidence
  the entry previously lacked.

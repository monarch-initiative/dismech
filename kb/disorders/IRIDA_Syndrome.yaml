      label: BMP signaling pathway
  evidence:
  - reference: PMID:18976966
    reference_title: "The serine protease matriptase-2 (TMPRSS6) inhibits hepcidin activation by cleaving membrane hemojuvelin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Matriptase-2 cleaves hemojuvelin (HJV), a regulator of hepcidin, on plasma

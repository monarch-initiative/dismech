name: IRIDA Syndrome
creation_date: "2026-08-29T11:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Iron-refractory iron deficiency anemia
  term:
    id: MONDO:0008788
    label: IRIDA syndrome
description: >-
  Iron-refractory iron deficiency anaemia (IRIDA) is an autosomal recessive
  microcytic hypochromic anaemia caused by biallelic loss-of-function variants
  in TMPRSS6, which encodes the hepatocyte type II transmembrane serine protease
  matriptase-2.

  Its interest is out of proportion to its rarity, because it is the disease
  that establishes the direction of a regulatory arrow. Hepcidin restricts iron
  entry into plasma, and it is suppressed when the body is iron deficient. What
  performs that suppression was unknown until IRIDA and its mouse counterpart
  were mapped to the same gene. Matriptase-2 is the sensor arm: without it,
  hepcidin cannot be turned down, and the body responds to iron deficiency by
  behaving as though it were iron replete.

  The consequence is a diagnostically inverted picture. In ordinary iron
  deficiency, hepcidin falls to undetectable levels and oral iron works. In
  IRIDA hepcidin is normal or high while the patient is iron deficient, so the
  duodenal enterocyte cannot export absorbed iron into plasma and the macrophage
  cannot release its stores. Oral iron therefore fails, and parenteral iron -
  which bypasses the gut but is still handled by macrophages - corrects the
  anaemia only slowly and partially. The laboratory signature is the
  combination that should prompt the diagnosis: microcytosis with a very low
  MCV, low transferrin saturation, and a hepcidin level that is inappropriately
  high for the iron status rather than low.

  Two mechanistic accounts of how matriptase-2 suppresses hepcidin were
  published within months of each other in 2008 and are not the same claim. One
  locates the activity in the protease ectodomain, which cleaves membrane
  haemojuvelin and so removes a BMP co-receptor that drives HAMP transcription.
  The other locates it in the cytoplasmic domain, acting on the Hamp proximal
  promoter. The entry curates both and does not merge them; the discussion below
  says why that matters for interpreting a patient's missense variant.

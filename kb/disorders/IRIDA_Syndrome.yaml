  evidence:
  - reference: PMID:18408718
    reference_title: "Mutations in TMPRSS6 cause iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abnormal iron absorption characterized by no hematological improvement
      following treatment with oral iron
    explanation: >-
      Oral-iron refractoriness as one of the defining key features of the
      phenotype.
  - reference: PMID:25064705
    reference_title: "Iron-refractory iron deficiency anemia (IRIDA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      multiple family members are affected with iron deficiency anemia that is
      unresponsive to oral iron supplementation and only partially responsive to
      parenteral iron therapy
    explanation: >-
      Independent restatement, and it also records the partial parenteral
      response curated as its own phenotype below.
  - reference: PMID:23319530
    reference_title: "Iron refractory iron deficiency anemia: presentation with hyperferritinemia and response to oral iron therapy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the phenotype associated with the unique combination of mutations
      uncovered in both patients expands the spectrum of disease associated with
      TMPRSS6 mutations to include iron deficiency anemia that is accompanied by
      hyperferritinemia at initial presentation and is responsive to continued
      oral iron therapy.
    explanation: >-
      Graded REFUTE against the claim that oral-iron refractoriness is obligate.
      This is the counterexample that sets the frequency band, and it is quoted
      from the authors' own conclusion rather than inferred from their case
      description.

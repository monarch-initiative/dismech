pathophysiology:
- name: Biallelic TMPRSS6 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline TMPRSS6 variants - frameshift, splice-junction, nonsense and
    missense - on both alleles. In the defining cohort every variant lay distal
    to exon 8, in the region encoding the conserved ectodomain modules and
    especially the trypsin-like serine protease domain, and homozygous
    frameshifts predicted to disrupt only the catalytic domain were sufficient
    to cause disease.

    The reported allelic spectrum has since broadened across the whole large
    ectodomain rather than concentrating in the catalytic domain, which is why a
    novel missense variant outside the protease domain cannot be dismissed on
    position alone.

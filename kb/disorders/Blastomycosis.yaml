  description: >-
    Human blastomycosis is caused by thermally dimorphic fungi in the genus
    Blastomyces, especially B. dermatitidis and B. gilchristii in North America.
    Less common species with different geography include B. helicus,
    B. percursus, and B. emzantsi.

pathophysiology:
- name: Conidial Inhalation and Yeast-Phase Conversion
  description: >-
    Blastomyces hyphae in soil produce conidia; after soil disturbance, inhaled
    conidia and hyphal fragments enter the lung and switch from environmental
    mold to pathogenic yeast at 37 degrees C.
  role: trigger

name: Blastomycosis
creation_date: "2026-11-15T00:00:00Z"
synonyms:
- Gilchrist disease
- North American blastomycosis
description: >-
  Blastomycosis is a systemic mycosis caused by thermally dimorphic Blastomyces
  species. Environmental mold-phase organisms form conidia that become airborne
  when soil and decaying organic material near water are disturbed; inhaled
  conidia or hyphal fragments convert to pathogenic budding yeasts in the lung.
  Yeast-phase cells express BAD1/WI-1, which promotes tissue adhesion and
  suppresses phagocyte TNF-alpha responses, enabling pyogranulomatous pulmonary
  infection that can disseminate hematogenously to skin, bone, genitourinary
  tissue, and the central nervous system. Diagnosis rests on culture, direct
  visualization of broad-based budding yeasts in stained specimens, and antigen
  testing; treatment uses itraconazole for mild-to-moderate non-CNS disease and
  amphotericin B induction with azole step-down for severe, CNS, disseminated,
  or immunosuppressed-host disease.

treatments:
- name: Itraconazole for mild to moderate non-CNS blastomycosis
  description: >-
    Oral itraconazole is the first-line triazole for mild-to-moderate,
    non-CNS blastomycosis and is also used as step-down therapy after
    amphotericin B induction.
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: itraconazole
      term:
        id: CHEBI:6076
        label: itraconazole
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Pyogranulomatous Pulmonary Infection and Dissemination
    description: >-
      Itraconazole inhibits Blastomyces growth and clears mild-to-moderate
      infection.
  evidence:
  - reference: PMID:28797487
    reference_title: "Clinical Manifestations and Treatment of Blastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Itraconazole is the first-line agent for the treatment of mild to moderate, non-CNS blastomycosis"
    explanation: >-
      Supports itraconazole as the first-line agent for mild-to-moderate
      non-CNS blastomycosis and step-down treatment after amphotericin B.
- name: Amphotericin B induction for severe or disseminated blastomycosis
  description: >-
    Lipid amphotericin B induction is recommended for severe pulmonary disease,
    disseminated disease, CNS involvement, pregnancy, neonates, and
    immunosuppressed-host blastomycosis, followed by azole step-down after
    clinical improvement.
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: amphotericin B
      term:
        id: CHEBI:2682
        label: amphotericin B
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Pyogranulomatous Pulmonary Infection and Dissemination
    description: >-
      Amphotericin B rapidly kills Blastomyces yeasts in severe, disseminated,
      CNS, pregnant, neonatal, and immunosuppressed-host disease.
  evidence:
  - reference: PMID:28797487
    reference_title: "Clinical Manifestations and Treatment of Blastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Polyene AmB formulations are recommended for the treatment of patients with severe pulmonary infection"
    explanation: >-

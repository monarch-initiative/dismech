    explanation: >-
      The guideline identifies the two primary North American Blastomyces
      species and describes the geography of rarer pathogenic species.
transmission:
- name: Inhalation of airborne conidia after soil disruption
  description: >-
    Mold-phase Blastomyces grows in soil and organic debris, especially near
    freshwater drainage systems in endemic regions. Soil-disrupting activities
    aerosolize infectious conidia and hyphal fragments; inhaled fungal particles
    reach the lung and convert to the yeast phase at mammalian body temperature.
  evidence:
  - reference: PMID:28797487
    reference_title: "Clinical Manifestations and Treatment of Blastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "aerosolized conidia and mold fragments inhaled into the lungs"
    explanation: >-
      States the inhalational route after environmental soil disruption.
  - reference: PMID:34364529
    reference_title: "Global guideline for the diagnosis and management of the endemic mycoses: an initiative of the European Confederation of Medical Mycology in cooperation with the International Society for Human and Animal Mycology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Blastomyces spp have been isolated in soils near freshwater drainage systems"
    explanation: >-
      Places the environmental reservoir in soil near freshwater drainage systems.

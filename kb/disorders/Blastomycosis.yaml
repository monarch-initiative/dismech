notes: >-
  The infectious agent is bound at the Blastomyces genus because the principal
  North American species, B. dermatitidis and B. gilchristii, and rarer
  geographic species share the same root dimorphic mechanism and disease
  identity. The first-pass pathophysiology models the BAD1/WI-1 virulence
  program rather than every known Blastomyces virulence factor; DRK1, DPPIVA,
  PRA1, ZRT1, and additional nutritional virulence genes are documented leads
  for future mechanistic expansion.

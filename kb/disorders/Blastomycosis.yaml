progression:
- phase: Pulmonary incubation to symptomatic disease
  notes: >-
    Symptoms usually begin weeks after inhalation, and the initial presentation
    ranges from subclinical infection to pneumonia and ARDS.
  evidence:
  - reference: PMID:28797487
    reference_title: "Clinical Manifestations and Treatment of Blastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Onset of symptoms occur 3 weeks to 3.5 months following inhalation"
    explanation: >-
      The review reports the incubation interval after inhalation.
- phase: Extrapulmonary dissemination
  notes: >-
    Symptomatic disease can disseminate from the lung to skin, bone,
    genitourinary tissue, CNS, and other organs.
  evidence:
  - reference: PMID:28797487
    reference_title: "Clinical Manifestations and Treatment of Blastomycosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

- name: BAD1-Mediated Yeast Adhesion and TNF Suppression
  description: >-
    The yeast-phase BAD1/WI-1 protein attaches Blastomyces yeasts to host tissue
    and inhibits macrophage and neutrophil TNF-alpha production, impairing local
    inflammatory activation while the fungus establishes infection.
  role: effector

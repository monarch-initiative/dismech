name: Chondrodysplasia Blomstrand Type
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >
  Blomstrand chondrodysplasia (Blomstrand osteochondrodysplasia, BOCD, MIM
  #215045) is an ultra-rare, perinatally lethal autosomal recessive
  osteochondrodysplasia caused by biallelic loss-of-function variants in PTH1R,
  the gene encoding the type 1 parathyroid hormone / parathyroid hormone-related
  peptide (PTH/PTHrP) receptor. In the normal growth plate, PTHrP acting through
  PTH1R holds chondrocytes in the proliferative pool and delays their exit into
  hypertrophy, as the distal limb of an Indian hedgehog-PTHrP negative feedback
  loop. When the receptor cannot bind ligand or generate a second messenger,
  that brake is removed: chondrocytes differentiate prematurely, the proliferative
  and hypertrophic zones become hypoplastic and disorganized, and endochondral
  ossification runs far ahead of gestational age. Affected fetuses show
  extremely advanced skeletal maturation, generalized osteosclerosis and severe
  tetramicromelia with dumbbell-shaped, metaphyseally flared long bones,
  together with polyhydramnios, hydrops fetalis, thoracic hypoplasia and a
  characteristic face with retro-micrognathia and a protruding tongue. Because
  PTHrP-PTH1R signaling also drives epithelial-mesenchymal interactions outside
  the skeleton, affected fetuses additionally lack nipples and breasts and have
  severely impacted teeth. The condition is uniformly lethal in utero or shortly
  after birth. It is the mechanistic mirror image of Jansen metaphyseal
  chondrodysplasia, in which constitutively activating PTH1R variants delay
  chondrocyte differentiation.

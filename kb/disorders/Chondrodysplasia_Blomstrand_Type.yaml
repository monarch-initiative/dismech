animal_models:
- name: PTH/PTHrP receptor null mouse
  species: Mus musculus
  genotype: Pth1r (PTH/PTHrP receptor) homozygous null, generated by homologous recombination
  category: KNOCKOUT
  genes:
  - preferred_term: PTH1R
    term:
      id: hgnc:9608
      label: PTH1R
  publication: PMID:8662561
  description: >
    Germline deletion of the murine PTH/PTHrP receptor. Most homozygotes die in
    mid-gestation; survivors show accelerated chondrocyte differentiation, and
    their bones are refractory to PTHrP and hedgehog in explant culture. This is
    the closest available model of the human disease and it reproduces both the
    cellular lesion and the lethality.
  modeled_mechanisms:
  - target: Accelerated Chondrocyte Hypertrophic Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Receptor-null mice show the same accelerated chondrocyte differentiation
      that defines the human condition, from the same molecular lesion (complete
      loss of PTH1R function).
    limitations: >-
      The mouse is a complete germline null while human Blomstrand alleles are
      point mutations that leave a surface-expressed but signaling-dead receptor,
      and most null embryos die in mid-gestation before the skeletal phenotype
      can be fully assessed, so the surviving embryos are a selected subset.
      Radiographic osteosclerosis, the cardinal human finding, is not reported in
      this paper.
    readouts:
    - name: Chondrocyte differentiation timing in developing bone
      target: Accelerated Chondrocyte Hypertrophic Differentiation
      direction: INCREASED
      interpretation: >
        Accelerated differentiation in the receptor-null mouse is the direct
        cellular counterpart of the accelerated chondrocyte differentiation
        described in human Blomstrand autopsy histology.
      evidence:
      - reference: PMID:8662561
        reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice that survived exhibited accelerated differentiation of chondrocytes in bone, and their bones, grown in explant culture, were resistant to the effects of PTHrP and Sonic hedgehog."
        explanation: Reports the accelerated differentiation phenotype and the associated ligand resistance.
    evidence:
    - reference: PMID:10912527
      reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking PTHrP show accelerated chondrocyte differentiation, and thus premature ossification of those bones that are formed through an endochondral process, and similar but more-severe abnormalities are observed in PTH1R-ablated animals."
      explanation: Independent review confirming that PTH1R ablation in mice reproduces (more severely) the accelerated-differentiation phenotype.
  - target: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Explanted receptor-null bone is unresponsive to PTHrP and hedgehog,
      demonstrating in tissue the same signaling failure shown for human
      Blomstrand alleles in transfected cells.
    limitations: >-
      Responsiveness was assayed in explant culture rather than in vivo, and the
      hedgehog ligand used was Sonic rather than Indian hedgehog.
    readouts:
    - name: Responsiveness of explanted bone to PTHrP and hedgehog
      target: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
      direction: ABOLISHED
      interpretation: >
        Loss of ligand responsiveness in receptor-null tissue is the tissue-level
        equivalent of the abolished cAMP and inositol phosphate response measured
        for Blomstrand alleles in transfected cells.
      evidence:
      - reference: PMID:8662561
        reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice that survived exhibited accelerated differentiation of chondrocytes in bone, and their bones, grown in explant culture, were resistant to the effects of PTHrP and Sonic hedgehog."
        explanation: Documents the loss of ligand responsiveness in receptor-null bone.
    evidence:
    - reference: PMID:8662561
      reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that the PTH/PTHrP receptor mediates the effects of Indian Hedgehog and PTHrP on chondrocyte differentiation."
      explanation: Supports treating the receptor-null mouse as informative for the human signaling-failure node.
  evidence:
  - reference: PMID:8662561
    reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Most PTH/PTHrP receptor (-/-) mutant mice died in mid-gestation, a phenotype not observed in PTHrP (-/-) mice, perhaps because of the effects of maternal PTHrP."
    explanation: Establishes that receptor ablation, unlike ligand ablation, is embryonic-lethal in the mouse, paralleling the perinatal lethality of the human condition.
discussions:
- discussion_id: blomstrand_osteosclerosis_absent_from_mouse_null
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Why is generalized osteosclerosis a cardinal radiographic feature of human
    Blomstrand chondrodysplasia when the PTH/PTHrP receptor-null mouse is
    reported for accelerated chondrocyte differentiation and mid-gestation
    lethality rather than for increased bone density?
  rationale: >
    The cellular lesion — accelerated chondrocyte differentiation — is faithfully
    reproduced in the Pth1r-null mouse, and the review literature states that
    PTH1R-ablated animals show premature endochondral ossification. But the
    defining human radiographic finding, generalized osteosclerosis, is not what
    the mouse work reports; most null embryos die in mid-gestation, before a
    skeleton dense enough to assess radiographically has formed. It is therefore
    unresolved whether human osteosclerosis is simply the accumulated end state
    of premature ossification carried to 25-40 weeks of gestation, or whether it
    additionally requires a species-specific or later-gestation contribution
    (for example altered osteoclast activity in the absence of PTH1R signaling in
    bone) that the mouse never lives long enough to display. This matters because
    it determines whether the mouse can be used to test any intervention aimed at
    the sclerotic phenotype.
  attaches_to:
  - pathophysiology#Premature and Advanced Endochondral Ossification
  - phenotypes#Generalized osteosclerosis
  proposed_experiments:
  - experiment_id: blomstrand_conditional_pth1r_late_gestation
    name: Chondrocyte-restricted, late-gestation Pth1r deletion with skeletal radiography
    description: >
      Delete Pth1r conditionally in growth plate chondrocytes at a stage that
      bypasses mid-gestation lethality, and image the skeleton radiographically
      and by micro-CT through late gestation and the perinatal period, to test
      whether generalized osteosclerosis emerges once the animal survives long
      enough.
    would_support:
    - phenotypes#Generalized osteosclerosis
    supporting_outcome:
    - Radiographic bone density rises progressively once mid-gestation lethality is bypassed, reproducing the human sclerotic phenotype from the same chondrocyte-autonomous lesion
    refuting_outcome:
    - Late-gestation chondrocyte-restricted deletion accelerates ossification without producing generalized osteosclerosis, implying an additional non-chondrocyte or human-specific contribution
  - experiment_id: blomstrand_bse_histomorphometry
    name: Quantitative mineral density distribution in human Blomstrand bone
    description: >
      Quantitative backscattered-electron imaging and histomorphometry on
      non-decalcified bone from molecularly confirmed Blomstrand fetuses,
      compared with gestational-age-matched controls, to establish whether the
      radiographic osteosclerosis reflects true tissue hypermineralization or the
      geometry of prematurely ossified, structurally abnormal bone.
    would_support:
    - pathophysiology#Premature and Advanced Endochondral Ossification
    supporting_outcome:
    - Tissue mineral density is normal and the radiographic density reflects prematurely formed bone occupying space that should still be cartilage
    refuting_outcome:
    - Bone tissue is genuinely hypermineralized, implying a mineralization defect additional to accelerated ossification
  evidence:
  - reference: PMID:8662561
    reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Most PTH/PTHrP receptor (-/-) mutant mice died in mid-gestation, a phenotype not observed in PTHrP (-/-) mice, perhaps because of the effects of maternal PTHrP."
    explanation: The mid-gestation lethality that truncates the mouse skeletal phenotype is the basis of the mismatch.
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-rays of four fetuses evaluated postmortem showed advanced bone maturation, generalized osteosclerosis, and dumbbell-like appearance of long bones due to metaphyseal enlargement."
    explanation: Documents the human radiographic osteosclerosis that the mouse literature does not report.
notes: >
  Nomenclature: the condition is reported under several names — Blomstrand
  chondrodysplasia, Blomstrand lethal osteochondrodysplasia, and Blomstrand
  osteochondrodysplasia (BOCD) — and the causal gene is written both PTH1R (HGNC
  approved symbol, used here) and PTHR1 (used in much of the primary literature,
  including in quoted snippets).

  Extraskeletal features are almost certainly under-reported. Absent nipples and
  breasts and impacted teeth were found only when specifically looked for
  (PMID:11297619), in fetuses whose earlier reports had not mentioned them. Any
  future autopsy of a suspected case should examine the breast and dentition.

  No population prevalence, natural-history cohort, or GeneReviews chapter exists
  for this condition; the evidence base is a handful of case reports and one
  five-fetus series. Numeric frequency bands here are stated only where the
  denominator is that series (5 fetuses on ultrasound, 4 on postmortem
  radiography), and even there no FrequencyEnum band is asserted, because
  denominators of 4 and 5 cannot separate OBLIGATE from VERY_FREQUENT. The
  numerator/denominator is recorded in each phenotype's notes instead. The one
  band that is asserted is OBLIGATE on perinatal lethality, which rests on the
  whole literature rather than on that series: no survivor has ever been
  reported, and lethality is definitional for this entity.

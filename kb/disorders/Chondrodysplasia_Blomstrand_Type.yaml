genetic:
- name: PTH1R
  gene_term:
    preferred_term: PTH1R
    term:
      id: hgnc:9608
      label: PTH1R
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:27353973
      reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Blomstrand osteochondrodysplasia (BOCD) is a rare autosomal recessive sclerosing skeletal dysplasia characterized by accelerated chondrocyte differentiation."
      explanation: States the recessive inheritance pattern.
  notes: >
    PTH1R at 3p21.31 encodes the 593-residue type 1 PTH/PTHrP receptor, a class B
    G protein-coupled receptor that couples to both Gs (cAMP) and Gq (inositol
    phosphate) pathways. Reported Blomstrand alleles include a homozygous P132L
    missense substitution in the N-terminal extracellular ligand-binding domain
    (recovered independently by two groups) and a maternally inherited splice-site-
    creating substitution at nucleotide 1176 that deletes the first 11 residues of
    the fifth transmembrane domain, with the paternal allele not expressed. PTH1R
    is the locus of a striking allelic series in which the direction of the
    receptor defect predicts the direction of the skeletal phenotype: constitutively
    activating heterozygous alleles cause Jansen metaphyseal chondrodysplasia with
    delayed chondrocyte differentiation, complete loss-of-function recessive alleles
    cause Blomstrand chondrodysplasia with accelerated differentiation, and a
    recessive C-terminal cytoplasmic-tail truncation causes Eiken syndrome with
    delayed ossification.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blomstrand osteochondrodysplasia (BOCD, MIM #215045) is an ultrarare lethal skeletal dysplasia (LSD) perinatally, characterized by extremely advanced bone maturation, generalized osteosclerosis, and severe tetramicromelia caused by biallelic loss-of-function mutations in the parathyroid hormone receptor-1 gene (PTHR1)."
    explanation: Attributes the condition to biallelic loss-of-function PTH1R variants.
  - reference: PMID:15525660
    reference_title: Recessive mutations in PTHR1 cause contrasting skeletal dysplasias in Eiken and Blomstrand syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first description of opposite manifestations resulting from distinct recessive mutations in the same gene."
    explanation: Documents that different recessive PTH1R alleles produce opposite skeletal phenotypes, the basis for the allelic-series note above.
diagnosis:
- name: Prenatal ultrasound
  description: >
    Second-trimester ultrasound showing severe shortening of all four limbs with
    a hypoplastic thorax and retro-micrognathia establishes that a lethal
    skeletal dysplasia is present; a protruding tongue and severe metaphyseal
    flaring narrow that to Blomstrand osteochondrodysplasia.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of retro-micrognathia along with a protruding tongue and severe metaphyseal flaring can suggest a diagnosis of BOCD, when prenatal ultrasound findings are indicative for LSD."
    explanation: States the prenatal sonographic features that suggest this specific diagnosis.
- name: Postmortem radiography and fetal autopsy
  description: >
    Babygram after delivery or termination shows advanced bone maturation,
    generalized osteosclerosis and dumbbell-shaped long bones; histology of the
    long bones shows the narrow cartilaginous cap and disorganized physis that
    confirm the diagnosis when molecular testing is unavailable.
  evidence:
  - reference: PMID:27353973
    reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we discuss three cases where lethal skeletal dysplasia was suspected and Blomstrand dysplasia was diagnosed by autopsy."
    explanation: Establishes fetal autopsy as the diagnostic modality in three reported cases.
- name: PTH1R sequencing
  description: >
    Identification of biallelic loss-of-function PTH1R variants confirms the
    diagnosis and is what makes accurate recurrence-risk counselling and
    subsequent prenatal testing possible.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be ascertained through postmortem clinical and radiological evaluation and/or molecular testing."
    explanation: States that molecular testing is a route to diagnostic confirmation.
differential_diagnoses:
- name: Jansen metaphyseal chondrodysplasia
  description: >
    The other end of the PTH1R allelic series. Jansen is caused by heterozygous
    constitutively activating PTH1R variants and shows delayed, not accelerated,
    chondrocyte differentiation and endochondral ossification; it is compatible
    with survival to adulthood. The two conditions are radiographic mirror
    images and are distinguished by the direction of the skeletal maturation
    abnormality as well as by inheritance pattern.
  evidence:
  - reference: PMID:9649554
    reference_title: Absence of functional receptors for parathyroid hormone and parathyroid hormone-related peptide in Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormalities that are the mirror image of those observed in Jansen's chondrodysplasia"
    explanation: States the mirror-image relationship between the two PTH1R disorders.
- name: Eiken syndrome
  description: >
    Also recessive and also PTH1R-related, but caused by truncation of the
    C-terminal cytoplasmic tail rather than by complete loss of ligand binding.
    Eiken syndrome is survivable and shows delayed ossification, the opposite
    skeletal direction to Blomstrand.
  evidence:
  - reference: PMID:15525660
    reference_title: Recessive mutations in PTHR1 cause contrasting skeletal dysplasias in Eiken and Blomstrand syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a truncation mutation in the C-terminal cytoplasmic tail of the parathyroid hormone (PTH)/PTH-related peptide (PTHrP) type 1 receptor (PTHR1) gene as the cause of this syndrome."
    explanation: Identifies the distinct Eiken allele class within the same gene.
- name: Other lethal short-rib skeletal dysplasias
  description: >
    Thanatophoric dysplasia, short-rib polydactyly syndromes and osteogenesis
    imperfecta type II all present prenatally with severe micromelia and a
    hypoplastic thorax. What separates Blomstrand from all of them is the
    direction of skeletal maturation: advanced ossification with generalized
    osteosclerosis rather than deficient or disordered mineralization.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We aim to describe prenatal ultrasonographic features in a retrospective fetal case series of BOCD and emphasize the importance of multidisciplinary antenatal evaluation of LSDs to improve the differential diagnosis."
    explanation: Frames the case series explicitly as a contribution to the differential diagnosis of lethal skeletal dysplasias.
treatments:
- name: Genetic counselling and recurrence-risk assessment
  description: >
    There is no treatment for the fetus. The clinically actionable intervention
    is counselling the couple: a 25% recurrence risk per pregnancy, carrier
    testing where the causal PTH1R alleles are known, and the option of targeted
    molecular prenatal diagnosis or early anomaly scanning in a subsequent
    pregnancy. Recurrence in sibs is documented, so this is not a theoretical
    concern.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:9268097

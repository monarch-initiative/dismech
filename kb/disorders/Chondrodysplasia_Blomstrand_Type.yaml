    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on two sibs with a rare lethal chondrodysplasia born to a non-consanguineous couple."
    explanation: Documents sib recurrence in a non-consanguineous couple, which is what makes recurrence-risk counselling necessary.
- name: Molecular confirmation by PTH1R testing
  description: >
    Sequencing PTH1R in the affected fetus converts a morphological diagnosis
    into a molecular one, which is the prerequisite for carrier testing and
    targeted prenatal diagnosis in later pregnancies.
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

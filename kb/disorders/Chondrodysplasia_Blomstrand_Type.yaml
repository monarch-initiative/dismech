  preferred_term: Blomstrand osteochondrodysplasia
  term:
    id: MONDO:0008970
    label: chondrodysplasia Blomstrand type
parents:
- Skeletal disorder of parathyroid hormone signaling
- Lethal osteochondrodysplasia
synonyms:
- Blomstrand chondrodysplasia
- Blomstrand lethal chondrodysplasia
- Blomstrand lethal osteochondrodysplasia
- Blomstrand osteochondrodysplasia
- BOCD
- BLC
classifications:
  isds_skeletal_category:
  - classification_value: parathyroid_hormone_signaling
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 28 "Skeletal disorders of parathyroid
      hormone signaling cascade", which lists "Blomstrand dysplasia (PTH1R)" as a
      member. The 2019 revision placed Blomstrand in the neonatal osteosclerotic
      dysplasia group; the 2023 table moved it into the new PTH-signaling group
      alongside the other PTH1R disorders (Jansen and Eiken).
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Blomstrand chondrodysplasia segregates as an autosomal recessive trait.
    Affected fetuses carry homozygous or compound heterozygous PTH1R alleles;
    parental consanguinity and recurrence of the phenotype in sibs of both sexes
    born to unaffected parents were the original evidence for recessive
    inheritance, and have since been confirmed molecularly.
  evidence:
  - reference: PMID:10552065
    reference_title: "Blomstrand chondrodysplasia: a lethal sclerosing skeletal dysplasia. Case report and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive inheritance has been proposed because of parental consanguinity of affected siblings in all reported cases, including this one."
    explanation: States the consanguinity/sib-recurrence basis for recessive inheritance across the reported case series.
  - reference: PMID:9268097
    reference_title: "Familial Blomstrand chondrodysplasia with advanced skeletal maturation: further delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This recurrence affecting a male and a female fetus, born to the same couple, suggests autosomal recessive inheritance."
    explanation: Recurrence in a male and a female sib of unaffected parents demonstrates autosomal rather than X-linked recessive transmission.
  - reference: PMID:27353973
    reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous and compound heterozygous mutations in PTHR1 gene have been implicated in the pathogenesis of this chondrodysplasia."
    explanation: Confirms that the causal PTH1R genotypes are biallelic (homozygous or compound heterozygous).
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >
    No population-based prevalence estimate exists. Blomstrand chondrodysplasia
    is described in the literature only as case reports and very small fetal
    series (the largest published series below comprises five fetuses collected
    over 19 years at a single prenatal diagnosis unit), and it is consistently
    characterized as "ultrarare". Because ascertainment depends on prenatal
    imaging followed by fetal autopsy and molecular confirmation, published
    counts are certainly an undercount; no numerator/denominator is available,
    so no numeric rate is asserted here.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blomstrand osteochondrodysplasia (BOCD, MIM #215045) is an ultrarare lethal skeletal dysplasia (LSD) perinatally, characterized by extremely advanced bone maturation, generalized osteosclerosis, and severe tetramicromelia caused by biallelic loss-of-function mutations in the parathyroid hormone receptor-1 gene (PTHR1)."
    explanation: Characterizes the condition as ultrarare, supporting the qualitative ULTRA_RARE band in the absence of a population estimate.
pathophysiology:
- name: Biallelic PTH1R Loss-of-Function
  biological_scale: MOLECULAR
  description: >
    PTH1R encodes the type 1 PTH/PTHrP receptor, a class B G protein-coupled
    receptor. Blomstrand alleles abolish receptor function outright rather than
    merely reducing it: a splice-creating point mutation deletes the first 11
    residues of the fifth transmembrane domain and yields a receptor that reaches
    the cell surface but neither binds PTH or PTHrP nor generates cAMP or
    inositol phosphates, while the recurrent P132L substitution in the
    N-terminal extracellular domain leaves surface expression intact but
    destroys ligand binding. Both alleles must be affected; heterozygous carrier
    parents are unaffected.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous or compound heterozygous germline PTH1R alleles with complete
      loss of receptor function.
  gene:
    preferred_term: PTH1R
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:9608
      label: PTH1R
  molecular_functions:
  - preferred_term: PTH/PTHrP type 1 receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004991
      label: parathyroid hormone receptor activity
  downstream:
  - target: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
    description: >
      A receptor that cannot bind its ligands cannot transduce the PTHrP signal
      in chondrocytes, which is the immediate cellular consequence of the
      genotype.
    evidence:
    - reference: PMID:9649554
      reference_title: Absence of functional receptors for parathyroid hormone and parathyroid hormone-related peptide in Blomstrand chondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the mutant receptor was well expressed in COS-7 cells, but did not bind PTH or PTHrP, and failed to induce detectable stimulation of either cAMP or inositol phosphate production in response to these ligands"
      explanation: Directly demonstrates that the patient's allele produces a surface-expressed but signaling-dead receptor.
  evidence:
  - reference: PMID:9649554
    reference_title: Absence of functional receptors for parathyroid hormone and parathyroid hormone-related peptide in Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of PTH/PTHrP receptor cDNA demonstrated that: (a) this point mutation caused the deletion of the first 11 amino acids of exon M5 (encoding the fifth transmembrane domain of the receptor), resulting from the use of a novel splice site created by the base substitution;"
    explanation: Identifies the molecular lesion in the index patient's PTH1R transcript.
  - reference: PMID:9832466
    reference_title: Inactivating mutation in the human parathyroid hormone receptor type 1 gene in Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single homozygous nucleotide exchange in exon E3 of the gene encoding the parathyroid hormone receptor type 1 (PTHR1) was identified in an infant with Blomstrand chondrodysplasia born to consanguineous parents."
    explanation: Independent identification of a homozygous inactivating PTH1R allele in an affected infant.
  - reference: PMID:9745456
    reference_title: A homozygous inactivating mutation in the parathyroid hormone/parathyroid hormone-related peptide receptor causing Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with Blomstrand chondrodysplasia, a lethal genetic disorder characterized by extremely advanced endochondral bone maturation, in whom a homozygous missense mutation is present in the gene coding for the PTH/PTHrP receptor that leads to the substitution of a proline for a leucine in the N-terminal portion of the receptor (P132L)."
    explanation: Reports the recurrent homozygous P132L allele in an affected patient.
- name: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
  biological_scale: CELLULAR
  description: >
    PTHrP produced in the periarticular perichondrium normally acts on PTH1R
    borne by proliferating and prehypertrophic growth plate chondrocytes,
    raising cAMP and mobilizing inositol phosphates. In Blomstrand
    chondrodysplasia the receptor on the patient's own chondrocytes is
    non-functional, so this ligand-stimulated second messenger response is
    abolished. Loss of both the cAMP and the inositol phosphate arm has been
    demonstrated for the alleles recovered from affected fetuses.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: PTH1R-stimulated cAMP second messenger signaling
    modifier: DECREASED
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  downstream:
  - target: Loss of the Indian Hedgehog-PTHrP Brake on Chondrocyte Differentiation
    description: >
      PTH1R is the effector arm of the Ihh-PTHrP feedback loop; abolishing
      receptor signaling disables the loop even though Ihh itself is intact.
    evidence:
    - reference: PMID:8662561
      reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that the PTH/PTHrP receptor mediates the effects of Indian Hedgehog and PTHrP on chondrocyte differentiation."
      explanation: Establishes PTH1R as the receptor through which both Ihh and PTHrP act on chondrocyte differentiation, so its loss breaks the loop.
  evidence:
  - reference: PMID:9745456
    reference_title: A homozygous inactivating mutation in the parathyroid hormone/parathyroid hormone-related peptide receptor causing Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PTH-induced cAMP accumulation was severely reduced in COS-7 cells expressing P132L receptors compared to that of cells expressing wild-type receptors, and PTH-induced inositol phosphate accumulation was not detectable in cells expressing the mutant receptor."
    explanation: Quantifies the loss of both second messenger arms for the P132L Blomstrand allele.
  - reference: PMID:9832466
    reference_title: Inactivating mutation in the human parathyroid hormone receptor type 1 gene in Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COS-1 cells expressing the mutant receptor did not accumulate cyclic adenosine 3',5'-monophosphate in response to PTH or PTH-related peptide (PTHrP) and did not bind the radiolabeled ligand."
    explanation: Confirms abolished ligand binding and cAMP response for the same allele in an independent laboratory.
  - reference: PMID:9832466
    reference_title: Inactivating mutation in the human parathyroid hormone receptor type 1 gene in Blomstrand chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of the mutant protein on the cell surface of transiently transfected COS-1 cells and in growth plate chondrocytes derived from the affected infant suggests that proline 132 is critical for the receptor's intrinsic binding activity."
    explanation: Locates the defective receptor in the affected infant's own growth plate chondrocytes, tying the signaling failure to the relevant cell type in vivo.
- name: Loss of the Indian Hedgehog-PTHrP Brake on Chondrocyte Differentiation
  biological_scale: CELLULAR
  description: >
    In the developing growth plate, prehypertrophic chondrocytes secrete Indian
    hedgehog, which induces PTHrP at the periarticular end; PTHrP in turn signals
    back through PTH1R to keep chondrocytes proliferating and to delay their exit
    into hypertrophy. The output of this loop is a negative regulation of
    chondrocyte differentiation. With PTH1R non-functional the loop has no
    effector, and the negative regulation is lost.
  biological_processes:
  - preferred_term: PTHrP-mediated negative regulation of chondrocyte differentiation
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0032331
      label: negative regulation of chondrocyte differentiation
  downstream:
  - target: Accelerated Chondrocyte Hypertrophic Differentiation
    description: >
      Removing the brake advances the timetable of chondrocyte differentiation.
    evidence:
    - reference: PMID:10912527
      reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking PTHrP show accelerated chondrocyte differentiation, and thus premature ossification of those bones that are formed through an endochondral process, and similar but more-severe abnormalities are observed in PTH1R-ablated animals."
      explanation: Ablating either the ligand or the receptor accelerates chondrocyte differentiation, establishing the direction of the causal edge.
  evidence:
  - reference: PMID:10912527
    reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PTHrP is generated in response to Indian hedgehog (Ihh), which mediates its actions through the membrane receptor patched, but interacts also with hedgehog-interacting protein (Hip)."
    explanation: States the Ihh-PTHrP relationship whose effector arm PTH1R provides.
  - reference: PMID:8662561
    reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice that survived exhibited accelerated differentiation of chondrocytes in bone, and their bones, grown in explant culture, were resistant to the effects of PTHrP and Sonic hedgehog."
    explanation: Receptor-null bone is refractory to both hedgehog and PTHrP, showing the loop cannot operate without PTH1R.
- name: Accelerated Chondrocyte Hypertrophic Differentiation
  biological_scale: CELLULAR
  description: >
    Chondrocytes leave the proliferative pool early and pass into hypertrophy
    ahead of schedule. This is the defining cellular lesion of Blomstrand
    chondrodysplasia and is the exact inverse of Jansen metaphyseal
    chondrodysplasia, where constitutive PTH1R activity delays the same
    transition.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: INCREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  downstream:
  - target: Growth Plate Hypoplasia and Disorganization
    description: >
      Early exhaustion of the proliferative pool leaves a thin, disordered
      physis.
    evidence:
    - reference: PMID:27353973
      reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Histology of long bones revealed narrow cartilagenous cap and changes in the physeal growth zone which showed severe hypoplasia and disorganization of proliferative phase and hypertrophic phase."
      explanation: Fetal autopsy histology shows the hypoplastic, disorganized physis that follows accelerated differentiation.
  - target: Premature and Advanced Endochondral Ossification
    description: >
      Chondrocytes that hypertrophy early are replaced by bone early.
    evidence:
    - reference: PMID:10912527
      reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking PTHrP show accelerated chondrocyte differentiation, and thus premature ossification of those bones that are formed through an endochondral process, and similar but more-severe abnormalities are observed in PTH1R-ablated animals."
      explanation: Explicitly links accelerated chondrocyte differentiation to premature endochondral ossification.
  evidence:
  - reference: PMID:27353973
    reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blomstrand osteochondrodysplasia (BOCD) is a rare autosomal recessive sclerosing skeletal dysplasia characterized by accelerated chondrocyte differentiation."
    explanation: Names accelerated chondrocyte differentiation as the defining cellular feature of the human disease.
  - reference: PMID:15525660
    reference_title: Recessive mutations in PTHR1 cause contrasting skeletal dysplasias in Eiken and Blomstrand syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the skeletal features are opposite to those in Blomstrand chondrodysplasia, which is caused by inactivating recessive mutations in PTHR1."
    explanation: Situates Blomstrand at the accelerated-maturation end of the PTH1R allelic series, opposite the delayed-maturation phenotypes.
- name: Growth Plate Hypoplasia and Disorganization
  biological_scale: TISSUE
  description: >
    Long bone histology in affected fetuses shows a narrow cartilaginous cap
    with severe hypoplasia and disorganization of both the proliferative and the
    hypertrophic zones. Because longitudinal growth is generated by the
    proliferative zone, its early exhaustion truncates limb elongation.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Severe micromelia
    description: >
      Loss of the proliferative reserve that generates longitudinal growth
      produces extreme shortening of all four limbs.
    evidence:
    - reference: PMID:9832466
      reference_title: Inactivating mutation in the human parathyroid hormone receptor type 1 gene in Blomstrand chondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that the Blomstrand form of human short-limbed dwarfism arises from defective PTHR1 signaling in the developing cartilaginous skeleton."
      explanation: Attributes the short-limbed phenotype specifically to defective PTH1R signaling in cartilage.
  evidence:
  - reference: PMID:27353973
    reference_title: "Usefulness of fetal autopsy in the diagnosis of blomstrand chondrodysplasia: a report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology of long bones revealed narrow cartilagenous cap and changes in the physeal growth zone which showed severe hypoplasia and disorganization of proliferative phase and hypertrophic phase."
    explanation: Primary histological description of the growth plate lesion in three autopsy-confirmed fetuses.
- name: Premature and Advanced Endochondral Ossification
  biological_scale: TISSUE
  description: >
    Cartilage anlagen are converted to bone far ahead of gestational age, so
    ossification centres that should not yet be present are already mineralized
    and the skeleton reads as radiographically "mature" in a mid-gestation fetus.
    The same process produces a diffuse increase in bone density and the
    dumbbell-shaped, metaphyseally flared long bones seen on postmortem
    radiography.
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: INCREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  downstream:
  - target: Accelerated skeletal maturation
    description: >
      Premature conversion of cartilage to bone is what "advanced skeletal
      maturation" measures radiographically.
    evidence:
    - reference: PMID:9649554
      reference_title: Absence of functional receptors for parathyroid hormone and parathyroid hormone-related peptide in Blomstrand chondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the absence of functional parathyroid hormone (PTH)/PTH-related peptide (PTHrP) receptors (PTH/PTHrP receptor) in Blomstrand chondrodysplasia, a genetic disorder characterized by advanced endochondral bone maturation."
      explanation: Defines the disease by advanced endochondral bone maturation and attributes it to absent receptor function.
  - target: Generalized osteosclerosis
    description: >
      The excess of prematurely formed bone presents radiographically as a
      diffuse increase in density.
    evidence:
    - reference: PMID:10552065
      reference_title: "Blomstrand chondrodysplasia: a lethal sclerosing skeletal dysplasia. Case report and review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The main findings in this lethal osteochondrodysplasia are osteosclerosis and advanced skeletal maturation."
      explanation: Pairs osteosclerosis with advanced maturation as the two cardinal findings of the same process.
  - target: Dumbbell-shaped long bones with metaphyseal flaring
    description: >
      Premature metaphyseal ossification and enlargement give the long bones
      their characteristic dumbbell outline.
    evidence:
    - reference: PMID:35808914
      reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "X-rays of four fetuses evaluated postmortem showed advanced bone maturation, generalized osteosclerosis, and dumbbell-like appearance of long bones due to metaphyseal enlargement."
      explanation: Attributes the dumbbell appearance to metaphyseal enlargement in the same radiographs that show advanced maturation.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-rays of four fetuses evaluated postmortem showed advanced bone maturation, generalized osteosclerosis, and dumbbell-like appearance of long bones due to metaphyseal enlargement."
    explanation: Postmortem radiographic confirmation of advanced ossification in four molecularly confirmed fetuses.
- name: Impaired PTHrP-Dependent Epithelial-Mesenchymal Signaling in Breast and Tooth
  biological_scale: TISSUE
  description: >
    PTHrP signaling through PTH1R is not confined to cartilage: in mice it also
    governs the epithelial-mesenchymal interactions that build the mammary gland
    and position the erupting tooth, and both PTHrP and PTH1R are expressed in
    the developing human breast and tooth. Loss of receptor function therefore
    produces extraskeletal developmental defects in the same fetuses, which is
    the most direct human evidence that this pathway is required outside the
    growth plate.
  biological_processes:
  - preferred_term: PTHrP-dependent epithelial-mesenchymal signaling in breast and tooth development
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0071374
      label: cellular response to parathyroid hormone stimulus
  downstream:
  - target: Absent nipples and breasts
    description: >
      Mammary bud development fails without PTHrP-PTH1R signaling.
    evidence:
    - reference: PMID:11297619
      reference_title: Absence of functional type 1 parathyroid hormone (PTH)/PTH-related protein receptors in humans is associated with abnormal breast development and tooth impaction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These fetuses lack nipples and breasts."
      explanation: Direct observation of absent breast development in two Blomstrand fetuses.
  - target: Impacted teeth
    description: >
      Without PTH1R signaling the alveolar bone is not resorbed ahead of the
      erupting tooth, which becomes impacted and distorted.
    evidence:
    - reference: PMID:11297619
      reference_title: Absence of functional type 1 parathyroid hormone (PTH)/PTH-related protein receptors in humans is associated with abnormal breast development and tooth impaction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Developing teeth were present, but they were severely impacted within the surrounding alveolar bone, leading to distortions in their architecture and orientation."
      explanation: Direct observation of tooth impaction in the same fetuses.
  evidence:
  - reference: PMID:11297619
    reference_title: Absence of functional type 1 parathyroid hormone (PTH)/PTH-related protein receptors in humans is associated with abnormal breast development and tooth impaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compatible with the involvement of PTHR1 and PTHrP in human breast and tooth morphogenesis, both were expressed within the developing breasts and teeth of normal human fetuses."
    explanation: Establishes that the ligand and receptor are expressed at the affected sites in normal human fetal development.
phenotypes:
- category: Skeletal
  name: Severe micromelia
  description: >
    Extreme shortening of all four limbs (tetramicromelia), the most conspicuous
    prenatal sonographic finding and the feature that first raises the
    possibility of a lethal skeletal dysplasia.
  diagnostic: true
  phenotype_term:
    preferred_term: Tetramicromelia
    term:
      id: HP:0002983
      label: Micromelia
  notes: >
    5 of 5 fetuses in the single largest published series presented with
    tetramicromelia on prenatal ultrasound. No FrequencyEnum band is asserted:
    the observed fraction is 100%, but a denominator of 5 cannot distinguish
    OBLIGATE from VERY_FREQUENT, and the series is a referred prenatal-diagnosis
    cohort rather than a complete ascertainment.
  evidence:
  - reference: PMID:35808914
    reference_title: "Prenatal ultrasonographic features in Blomstrand osteochondrodysplasia: Antenatal case series confirmed by postmortem radiology and molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All fetuses presented with severe sonographic findings of LSDs comprising tetramicromelia, thoracic hypoplasia, and retro-micrognathia."
    explanation: All five fetuses in the series had tetramicromelia.
  - reference: PMID:9268097
    reference_title: "Familial Blomstrand chondrodysplasia with advanced skeletal maturation: further delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmarks of this affection, also called Blomstrand chondrodysplasia, are short limbs, polyhydramnios, hydrops fetalis, facial anomalies, increased bone density, and a remarkable advance in skeletal maturation."
    explanation: Lists short limbs among the hallmark features of the condition.
- category: Skeletal
  name: Accelerated skeletal maturation
  description: >
    Ossification is grossly advanced for gestational age — the single most
    characteristic radiological finding, and the feature the disease is named
    for in the original delineation.
  diagnostic: true
  phenotype_term:
    preferred_term: Accelerated skeletal maturation
    term:
      id: HP:0005616
      label: Accelerated skeletal maturation
  notes: >
    Advanced bone maturation was present on postmortem radiography in 4 of the 4
    fetuses so evaluated in the largest published series. No FrequencyEnum band
    is asserted: a denominator of 4 cannot distinguish OBLIGATE from
    VERY_FREQUENT.
  evidence:
  - reference: PMID:10552065
    reference_title: "Blomstrand chondrodysplasia: a lethal sclerosing skeletal dysplasia. Case report and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main findings in this lethal osteochondrodysplasia are osteosclerosis and advanced skeletal maturation."
    explanation: Names advanced skeletal maturation as a cardinal finding.
  - reference: PMID:10552065
    reference_title: "Blomstrand chondrodysplasia: a lethal sclerosing skeletal dysplasia. Case report and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathological study of the bones confirmed the advanced skeletal maturation radiological features."

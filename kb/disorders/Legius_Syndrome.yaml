diagnosis:
- name: Clinical criteria with SPRED1 molecular confirmation
  description: >-
    In an individual without an affected parent, the international consensus
    criteria require six or more bilaterally distributed café-au-lait macules,
    no other NF1 diagnostic features apart from axillary or inguinal freckling,
    and a heterozygous pathogenic SPRED1 variant in apparently normal tissue.
    Molecular confirmation is especially important because pigmentary findings
    alone overlap strongly with neurofibromatosis type 1.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six or more café-au-lait macules (Supplementary Fig. 12) bilaterally
      distributed and no other NF1-related diagnostic criteria except for
      axillary or inguinal freckling
    explanation: >-
      States the consensus pigmentary and exclusion criteria used together with
      identification of a heterozygous pathogenic SPRED1 variant.
differential_diagnoses:
- name: Neurofibromatosis type 1
  description: >-
    NF1 shares the pigmentary presentation of Legius syndrome (multiple café-au-lait
    macules and skinfold freckling) but, unlike Legius syndrome, develops
    neurofibromas, Lisch nodules, optic pathway gliomas, and other tumor complications
    and carries a markedly higher tumor risk. Because roughly half of individuals with
    Legius syndrome would satisfy the older NIH pigmentary criteria for NF1, molecular
    testing (identifying a SPRED1 rather than an NF1 variant) is often required to
    distinguish the two; the revised international consensus criteria formalize this
    distinction.
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No individuals with LGSS have developed Lisch nodules, neurofibromas, or other
      complications of NF1.
    explanation: >-
      The absence of NF1 tumor complications is the key clinical distinction between
      Legius syndrome and NF1.
treatments:
- name: Genetic Counseling and Molecular Diagnosis
  description: >-
    Genetic counseling with SPRED1 molecular testing is central to management, both to
    confirm the diagnosis and to distinguish Legius syndrome from NF1, which carries a
    markedly different tumor risk and surveillance burden. Inheritance is autosomal
    dominant.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19366998
    reference_title: "SPRED1 germline mutations caused a neurofibromatosis type 1 overlapping phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NIH diagnostic criteria for NF1 must be revised in view of this newly
      characterised Legius syndrome in order to establish a specific genetic
      counselling.
    explanation: >-
      Highlights the role of distinguishing Legius syndrome from NF1 for appropriate
      genetic counseling.
- name: Supportive and Multidisciplinary Care
  description: >-
    Management is supportive and symptom-directed: developmental and educational
    support for learning disability/ADHD, and clinical reassurance given the absence of
    the tumor complications of NF1. No disease-specific pharmacotherapy exists.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  Legius syndrome is one of the germline RASopathies identified in issue #6206 as
  missing from the knowledge base. Related NF1-spectrum entries already present include
  Neurofibromatosis_Type_1 and Neurofibroma. The remaining requested RASopathy entries
  (Neurofibromatosis-Noonan syndrome, CBL-related disorder) are left as follow-ups. A
  key differential is the absence of neurofibromas, Lisch nodules, optic pathway
  gliomas, and malignant peripheral nerve sheath tumors, which distinguishes Legius
  syndrome from NF1.

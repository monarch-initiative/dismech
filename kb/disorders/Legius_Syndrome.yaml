    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the reported disorder resemble those of
      neurofibromatosis type 1 and consist of multiple café-au-lait spots, axillary
      freckling and macrocephaly.
    explanation: >-
      Multiple café-au-lait spots are a cardinal feature in the original description.

name: Legius Syndrome
creation_date: "2026-07-13T00:00:00Z"
description: >-
  Legius syndrome (LGSS, also called neurofibromatosis type 1-like syndrome) is an
  autosomal dominant RASopathy of the RAS-MAPK pathway caused by heterozygous
  loss-of-function variants in SPRED1. It clinically overlaps the pigmentary features
  of neurofibromatosis type 1 (NF1) - multiple café-au-lait macules, with or without
  axillary or inguinal skinfold freckling, and macrocephaly - but is distinguished by
  the absence of the tumor manifestations and other complications of NF1: no
  neurofibromas, no Lisch nodules, and no optic pathway gliomas or malignant peripheral
  nerve sheath tumors. Learning disability, mild cognitive impairment, and attention
  deficit-hyperactivity disorder occur in a subset. SPRED1 is a Sprouty-related, EVH1
  domain-containing negative regulator of RAS-MAPK signaling that binds neurofibromin
  (the NF1 gene product) and recruits it to the plasma membrane, so SPRED1 loss and NF1
  loss converge on the same pathway, explaining the phenotypic overlap. Because Legius
  syndrome lacks the tumor risk of NF1, distinguishing the two - typically requiring
  molecular testing - is the central clinical management issue.
category: Genetic
parents:
- RASopathy

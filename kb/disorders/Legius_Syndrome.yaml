- name: Neurofibroma (Explicitly Absent)
  description: >-
    The defining negative feature separating Legius syndrome from NF1, recorded
    here as an explicitly absent phenotype. In the largest genotype-phenotype
    cohort, none of 42 SPRED1-positive individuals had discrete cutaneous or
    plexiform neurofibromas, typical NF1 osseous lesions, or symptomatic optic
    pathway gliomas. This absence is the reason the 2021 consensus group declined
    to classify the disorder as a subtype of neurofibromatosis.
  phenotype_term:
    preferred_term: Neurofibroma
    term:
      id: HP:0001067
      label: Neurofibroma
    modifier: ABSENT
  evidence:
  - reference: PMID:19920235
    reference_title: "Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the 42 SPRED1-positive individuals (0%; 95% CI, 0%-7%) had discrete
      cutaneous or plexiform neurofibromas, typical NF1 osseous lesions, or
      symptomatic optic pathway gliomas.
    explanation: >-
      Directly documents the absence of neurofibromas and other NF1 tumor
      manifestations in the SPRED1-positive cohort.
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."

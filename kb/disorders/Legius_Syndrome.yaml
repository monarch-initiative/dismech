definitions:
- name: 2021 international consensus diagnostic criteria for Legius syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The International Consensus Group on Neurofibromatosis Diagnostic Criteria
    (I-NF-DC) established the first formal diagnostic criteria for Legius
    syndrome in 2021. Unlike the NF1 criteria, which can be met clinically, the
    Legius syndrome criteria require molecular confirmation: a heterozygous
    pathogenic SPRED1 variant at a ~50% variant allele fraction in apparently
    normal tissue, together with six or more bilaterally distributed café-au-lait
    macules and no NF1-related diagnostic criteria other than axillary or
    inguinal freckling. A child of an affected parent needs only one of these.
    Fewer than six café-au-lait macules does not exclude the diagnosis.
  scope: >-
    Clinical and molecular diagnosis of non-mosaic Legius syndrome. Separate
    criteria exist for mosaic Legius syndrome, which is very rare.
  inclusion_criteria:
  - preferred_term: Six or more bilaterally distributed cafe-au-lait macules
    term:
      id: HP:0007565
      label: Multiple cafe-au-lait spots
    description: >-
      Six or more café-au-lait macules with a bilateral distribution. Fewer than
      six does not exclude the diagnosis.
  - preferred_term: Heterozygous pathogenic SPRED1 variant at ~50% variant allele fraction
    description: >-
      A heterozygous pathogenic variant in SPRED1 with a variant allele fraction
      of 50% in apparently normal tissue such as white blood cells. This
      molecular criterion is required and is what distinguishes the Legius
      syndrome criteria from the clinically satisfiable NF1 criteria.
  exclusion_criteria:
  - preferred_term: Any NF1-related diagnostic criterion other than skinfold freckling
    description: >-
      Presence of any other NF1 diagnostic criterion — neurofibromas, Lisch
      nodules or choroidal abnormalities, optic pathway glioma, or a distinctive
      NF1 osseous lesion — excludes Legius syndrome. Axillary or inguinal
      freckling is the sole permitted exception.
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A: The diagnostic criteria for Legius syndrome are met in an individual who
      does not have a parent diagnosed with Legius syndrome if the following
      CRITERIA are present:
    explanation: Introduces the consensus diagnostic criteria table for Legius syndrome.
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous pathogenic variant in SPRED1 with a variant allele fraction
      of 50% in apparently normal tissue such as white blood cells
    explanation: >-
      States the required molecular criterion that distinguishes the Legius
      syndrome criteria from the clinically satisfiable NF1 criteria.
  notes: >-
    The consensus group explicitly considered and rejected classifying Legius
    syndrome as an NF1 subtype, on the grounds that in the absence of
    neurofibromas it is inappropriate to consider it a type of neurofibromatosis.
diagnosis:
- name: Clinical criteria with SPRED1 molecular confirmation
  description: >-
    In an individual without an affected parent, the international consensus
    criteria require six or more bilaterally distributed café-au-lait macules,
    no other NF1 diagnostic features apart from axillary or inguinal freckling,
    and a heterozygous pathogenic SPRED1 variant in apparently normal tissue.
    Molecular confirmation is especially important because pigmentary findings
    alone overlap strongly with neurofibromatosis type 1.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six or more café-au-lait macules (Supplementary Fig. 12) bilaterally
      distributed and no other NF1-related diagnostic criteria except for
      axillary or inguinal freckling
    explanation: >-
      States the consensus pigmentary and exclusion criteria used together with
      identification of a heterozygous pathogenic SPRED1 variant.

differential_diagnoses:
- name: Neurofibromatosis type 1
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  description: >-
    The principal differential and the reason the disorder was originally named
    "NF1-like syndrome". The two are clinically indistinguishable in early
    childhood when only pigmentary findings are present, and about half of
    SPRED1-positive individuals satisfy the older NIH clinical criteria for NF1.
  distinguishing_features:
  - Legius syndrome lacks neurofibromas (cutaneous and plexiform), Lisch nodules, symptomatic optic pathway gliomas, and the distinctive NF1 osseous lesions.
  - The causal gene differs — SPRED1 rather than NF1 — although both converge on failure of neurofibromin-mediated RAS inactivation.
  - Legius syndrome is roughly 20-fold rarer (birth prevalence ~1/46,000-1/75,000 versus ~1/2,000-1/3,000 for NF1).
  evidence:
  - reference: PMID:19920235
    reference_title: "Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 42 SPRED1-positive individuals from the clinical cohort, 20 (48%;
      95% confidence interval ... 32%-64%) fulfilled National Institutes of
      Health (NIH) NF1 diagnostic criteria based on the presence of more than 5
      CALMs with or without freckling or an NF1-compatible family history.
    explanation: >-
      Quantifies the clinical overlap that makes NF1 the principal differential
      diagnosis.
  - reference: PMID:19920235
    reference_title: "Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among individuals in this study, NFLS was not associated with the
      peripheral and central nervous system tumors seen in NF1.
    explanation: >-
      States the tumor-risk contrast that distinguishes Legius syndrome from NF1.
- name: Constitutional mismatch repair deficiency syndrome
  description: >-
    CMMRD can present in childhood with multiple café-au-lait macules and
    skinfold freckling mimicking NF1 or Legius syndrome, but carries a severe
    early-onset cancer predisposition, so it must be excluded before pigmentary
    findings are attributed to a RASopathy.
  distinguishing_features:
  - CMMRD carries a high early-onset malignancy risk (brain, hematologic, gastrointestinal) absent in Legius syndrome.
  - Biallelic germline mismatch repair gene variants rather than a heterozygous SPRED1 variant.
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If only café-au-lait macules and freckling are present, the diagnosis is
      most likely mosaic neurofibromatosis type 1 but rarely might be mosaic
      Legius syndrome or constitutional mismatch repair deficiency (CMMRD)
      syndrome.
    explanation: >-
      The consensus criteria list CMMRD among the conditions to consider when only
      pigmentary findings are present.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    Management is symptom-directed. Reported components include behavioral
    modification and/or pharmacologic therapy for ADHD; physical, speech, and
    occupational therapy for developmental delays; individualized education plans
    for learning disorders; dermatologic referral for lipoma management;
    orthopedic management of pectus excavatum and scoliosis; standard seizure
    management; and otolaryngology referral for hearing loss.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20945555
    reference_title: "Legius Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Consideration of behavioral modification
      and/or pharmacologic therapy for those with ADHD; physical, speech, and
      occupational therapy for those with identified developmental delays;
      individualized education plans for those with learning disorders; referral
      to dermatologist as needed for lipoma management
    explanation: >-
      GeneReviews enumerates the symptom-directed management components for
      Legius syndrome.
- name: Developmental and Behavioral Surveillance
  description: >-
    Recommended surveillance is developmental and dermatologic rather than
    oncologic — a direct consequence of the absent tumor predisposition. Monitor
    developmental progress, educational needs, and behavior at each visit; assess
    for pigmentary lesions, lipomas, scoliosis, and new-onset seizures at each
    visit; hearing evaluation as needed.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20945555
    reference_title: "Legius Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Monitor developmental progress, educational needs, and
      behavioral assessment at each visit; assess for pigmentary lesions,
      lipomas, scoliosis, and new-onset seizures at each visit; hearing
      evaluation as needed.
    explanation: >-
      GeneReviews specifies the surveillance schedule, notably without tumor
      screening.
- name: Genetic Counseling
  description: >-
    Genetic counseling is central, both for the 50% recurrence risk and because
    reclassifying a presumed NF1 diagnosis as Legius syndrome substantially
    changes prognosis and surveillance. Once the familial SPRED1 variant is known,
    prenatal and preimplantation genetic testing are possible.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20945555
    reference_title: "Legius Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with Legius syndrome caused by a germline
      SPRED1 pathogenic variant has a 50% chance of inheriting the pathogenic
      variant. Once the SPRED1 pathogenic variant has been identified in an
      affected family member, prenatal and preimplantation genetic testing are
      possible.
    explanation: >-
      GeneReviews states the recurrence risk and reproductive testing options that
      genetic counseling addresses.
discussions:
- discussion_id: gap_legius_residual_tumor_risk
  prompt: >-
    Is the tumor risk in Legius syndrome truly at population baseline, or does the
    absence of tumors in published cohorts reflect limited sample size and
    incomplete adult follow-up?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RAS-MAPK Pathway Hyperactivation
  rationale: >-
    The clinical management of Legius syndrome — developmental rather than
    oncologic surveillance — rests on the claim that SPRED1 loss does not confer
    the tumor predisposition of NF1. The strongest supporting observation is
    nonetheless a zero count in a modest cohort: 0 of 42 SPRED1-positive
    individuals, with a 95% confidence interval extending to 7%. A tumor risk
    anywhere below that upper bound is statistically compatible with the data,
    and the cohorts are weighted toward children, so adult-onset risk is
    especially poorly constrained. Because SPRED1 and NF1 converge on the same
    RAS-inactivation step, a mechanistic prior for some residual risk is not
    unreasonable, and resolving this determines whether any oncologic
    surveillance is warranted.
  evidence:
  - reference: PMID:19920235
    reference_title: "Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the 42 SPRED1-positive individuals (0%; 95% CI, 0%-7%) had discrete
      cutaneous or plexiform neurofibromas, typical NF1 osseous lesions, or
      symptomatic optic pathway gliomas.
    explanation: >-
      Supports the absence of NF1 tumor manifestations, but the reported
      confidence interval bounds the residual risk only loosely at 7%.
  proposed_experiments:
  - experiment_id: exp_legius_population_scale_cancer_risk_ascertainment
    name: Genomic-ascertainment cohort of adult SPRED1 variant carriers
    description: >-
      Identify carriers of pathogenic and likely pathogenic germline SPRED1
      variants in large unselected biobank/health-system genomic datasets rather
      than in neurofibromatosis clinics, and compare age-stratified adult cancer
      incidence against non-carrier controls. Genomic rather than clinical
      ascertainment removes the referral bias that inflates the apparent
      specificity of the pigmentary phenotype, and biobank scale provides the
      person-years needed to tighten the upper confidence bound well below 7%.
- discussion_id: gap_legius_human_model_cognitive_mechanism
  prompt: >-
    Does the hippocampal LTP/LTD disequilibrium seen in Spred1-null mice account
    for the learning disability and ADHD observed in humans with heterozygous
    SPRED1 loss of function?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hippocampal Synaptic Plasticity Impairment
  rationale: >-
    The mechanistic account of the neurocognitive phenotype rests entirely on a
    mouse model, and two gaps separate it from the human disease. First is a
    dosage mismatch: the electrophysiology and behavioral deficits are reported
    in homozygous Spred1(-/-) animals, whereas humans with Legius syndrome are
    heterozygous. Second, no human study has demonstrated a corresponding
    hippocampal plasticity or ERK-signaling abnormality, so the inference from
    rodent CA1 physiology to human learning disability remains an extrapolation
    rather than a demonstrated mechanism. This matters therapeutically, because
    MEK-inhibitor-based cognitive rescue strategies proposed for RASopathies
    presuppose that the human deficit is ERK-driven in the same way.
  evidence:
  - reference: PMID:19118178
    reference_title: "Spred1 is required for synaptic plasticity and hippocampus-dependent learning."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We investigated hippocampus-dependent learning and memory as well as
      synaptic plasticity in Spred1(-/-) mice, an animal model of this newly
      discovered human syndrome.
    explanation: >-
      The mechanism is established in homozygous null mice, whereas human Legius
      syndrome results from heterozygous loss of function.
  proposed_experiments:
  - experiment_id: exp_legius_heterozygous_model_and_human_cognitive_phenotyping
    name: Heterozygous Spred1 model plus matched human cognitive-electrophysiological phenotyping
    description: >-
      Repeat the CA1 LTP/LTD and Morris water maze characterization in
      Spred1(+/-) animals to test whether the phenotype survives at the dosage
      that models human disease, and pair this with a prospective human cohort
      combining standardized neuropsychological testing, ADHD assessment, and
      non-invasive plasticity readouts in SPRED1 carriers versus NF1-matched and
      unaffected controls.
notes: >-
  Naming: the disorder was described in 2007 as an "NF1-like syndrome" (NFLS).
  The eponym "Legius syndrome" was subsequently proposed and widely adopted
  because reference to NF1 in the name was thought to confuse families about
  prognosis. The 2021 international consensus group considered classifying it as
  an NF1 subtype and explicitly rejected this, reasoning that in the absence of
  neurofibromas it is inappropriate to consider it a type of neurofibromatosis;
  the group did, however, note that a more appropriate nomenclature for the
  neurofibromatosis family as a whole remains a future task.

  Relationship to NF1 at the mechanistic level: Legius syndrome and NF1 are not
  merely phenotypic look-alikes but converge on the same molecular step. SPRED1
  recruits neurofibromin to activated RAS at the plasma membrane; NF1 encodes
  neurofibromin itself. Losing either protein impairs GAP-mediated RAS
  inactivation. The clinical divergence — pigmentary-only versus tumor-prone —
  therefore reflects a quantitative and cell-type-dependent difference in the
  severity of RAS dysregulation rather than involvement of a different pathway.

  Grouping: this entry uses the free-text `RASopathy` parent tag established by
  the Noonan, Costello, and cardiofaciocutaneous entries. A dedicated
  `kb/groupings/RASopathies.yaml` grouping is a reasonable follow-up now that
  enough RASopathy entries exist, but is intentionally out of scope here.

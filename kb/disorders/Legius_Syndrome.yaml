genetic:
- name: SPRED1
  gene_term:
    preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  association: Pathogenic Variants
  notes: >-
    Legius syndrome is caused by heterozygous loss-of-function SPRED1 variants
    (nonsense, frameshift, splice, and missense). SPRED1 encodes a Sprouty-related,
    EVH1 domain-containing negative regulator of RAS-MAPK signaling that recruits
    neurofibromin to the plasma membrane. SPRED1 variants account for roughly 1% of
    sporadic and 19% of familial cases presenting with pigmentary NF1 features
    (café-au-lait macules and freckling) only.
  evidence:
  - reference: PMID:19366998
    reference_title: "SPRED1 germline mutations caused a neurofibromatosis type 1 overlapping phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline loss-of-function mutations in the SPRED1 gene have recently been
      identified in patients fulfilling the National Institutes of Health (NIH)
      diagnostic criteria for neurofibromatosis type 1 (NF1) but with no NF1
      (neurofibromin 1) mutation found, suggesting a neurofibromatosis type 1-like
      syndrome.
    explanation: >-
      Confirms germline loss-of-function SPRED1 variants as the molecular cause in
      NF1-like patients without an NF1 mutation.

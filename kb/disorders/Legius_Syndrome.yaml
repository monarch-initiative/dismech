name: Legius Syndrome
creation_date: '2026-07-11T23:44:13Z'
description: >-
  Legius syndrome (historically "NF1-like syndrome") is an autosomal dominant
  RASopathy caused by germline loss-of-function variants in SPRED1, a
  Sprouty-related negative regulator of RAS-MAPK signaling. SPRED1 normally
  recruits neurofibromin (the NF1 gene product and a RAS GTPase-activating
  protein) to the plasma membrane to down-regulate RAS-GTP; loss of SPRED1
  function therefore de-represses the RAS-MAPK pathway, the same pathway
  dysregulated in neurofibromatosis type 1. Clinically it produces a pigmentary
  phenotype that overlaps the early presentation of NF1 - multiple café-au-lait
  macules with or without axillary/inguinal freckling, often with macrocephaly
  and mild learning or behavioral difficulties - but characteristically
  WITHOUT the neurofibromas, Lisch nodules, optic pathway gliomas, bony
  dysplasia, or the malignant tumor predisposition of NF1. It is therefore a key
  molecular differential of NF1 (MONDO:0012669; OMIM:611431; SPRED1). This entry
  is the first of four missing core RASopathy entries requested in issue #6206.
category: Genetic
parents:
- RASopathy
disease_term:
  preferred_term: Legius syndrome
  description: >-
    An autosomal dominant RASopathy caused by loss-of-function variants in
    SPRED1, presenting with an NF1-like pigmentary phenotype (café-au-lait
    macules and freckling) without the tumor features of neurofibromatosis
    type 1.
  term:
    id: MONDO:0012669
    label: Legius syndrome
pathophysiology:
- name: SPRED1 Loss-of-Function
  description: >-
    Heterozygous germline loss-of-function variants in SPRED1 reduce the dosage
    of this Sprouty/SPRED-family negative regulator of the RAS-MAPK pathway.
    SPRED1 acts as a feedback brake on RAS-to-RAF signaling, so haploinsufficiency
    (further compounded by somatic second hits in specific lesions) removes a
    physiological restraint on the pathway.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  biological_processes:
  - preferred_term: negative regulation of Ras protein signal transduction
    term:
      id: GO:0046580
      label: negative regulation of Ras protein signal transduction
    modifier: DECREASED
  downstream:
  - target: Impaired Neurofibromin Membrane Recruitment
    description: >-
      Loss-of-function SPRED1 can no longer recruit neurofibromin to the plasma
      membrane, the step required for SPRED1's inhibitory action on RAS.
    evidence:
    - reference: PMID:22751498
      reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        neurofibromin, the NF1 gene product, is a Spred1-interacting protein
        that is necessary for Spred1's inhibitory function.
      explanation: >-
        Establishes that SPRED1's negative-regulatory function is executed
        through its interaction with neurofibromin, the step lost when SPRED1 is
        inactivated.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report germline loss-of-function mutations in SPRED1 in a newly
      identified autosomal dominant human disorder.
    explanation: >-
      Identifies germline loss-of-function SPRED1 variants as the cause of this
      autosomal dominant disorder (Legius syndrome).
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SPRED1 is a member of the SPROUTY/SPRED family of proteins that act as
      negative regulators of RAS->RAF interaction and mitogen-activated protein
      kinase (MAPK) signaling.
    explanation: >-
      Supports SPRED1 as a negative regulator of RAS-MAPK signaling, so its loss
      of function de-represses the pathway.
- name: Impaired Neurofibromin Membrane Recruitment
  description: >-
    SPRED1 normally binds neurofibromin and drives its localization to the plasma
    membrane, where neurofibromin acts as a RAS GTPase-activating protein (GAP)
    to convert active RAS-GTP to inactive RAS-GDP. When SPRED1 is lost, this
    recruitment fails and neurofibromin-mediated RAS inactivation at the membrane
    is diminished - the molecular convergence point that Legius syndrome shares
    with neurofibromatosis type 1.
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Reduced membrane recruitment of neurofibromin lowers RAS-GAP activity at
      the membrane, raising RAS-GTP levels and increasing downstream MAPK/ERK
      signaling.
    evidence:
    - reference: PMID:22751498
      reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that Spred1 binding induces the plasma membrane localization of
        NF1, which subsequently down-regulates Ras-GTP levels.
      explanation: >-
        Demonstrates the SPRED1-dependent recruitment of neurofibromin that
        down-regulates RAS-GTP; loss of SPRED1 removes this control and raises
        RAS-GTP.
  evidence:
  - reference: PMID:22751498
    reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss-of-function mutations in one feedback regulator of Ras/MAPK
      signaling, SPRED1 (Sprouty-related protein with an EVH1 domain), cause
      Legius syndrome, an autosomal dominant human disorder that resembles
      Neurofibromatosis-1 (NF1).
    explanation: >-
      Frames SPRED1 loss of function as the cause of Legius syndrome via the
      shared RAS/MAPK feedback-regulation mechanism with NF1.
- name: RAS-MAPK Pathway Hyperactivation
  description: >-
    Diminished neurofibromin GAP activity at the membrane increases RAS-GTP and
    downstream ERK/MAPK signaling. This is the shared effector abnormality of the
    RASopathies; in Legius syndrome the degree and tissue distribution of
    dysregulation is milder and more restricted than in NF1, consistent with the
    pigmentary-predominant, tumor-sparing phenotype.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  downstream:
  - target: Melanocyte Dysregulation and Café-au-lait Macule Formation
    description: >-
      Increased RAS-MAPK signaling in melanocytic lineages drives the pigmentary
      manifestations (café-au-lait macules and skinfold freckling).
    evidence:
    - reference: PMID:17704776
      reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical features of the reported disorder resemble those of
        neurofibromatosis type 1 and consist of multiple café-au-lait spots,
        axillary freckling and macrocephaly.
      explanation: >-
        Links RAS-MAPK dysregulation from SPRED1 loss to the characteristic
        pigmentary and macrocephaly phenotype.
- name: Melanocyte Dysregulation and Café-au-lait Macule Formation
  description: >-
    Café-au-lait macules in Legius syndrome arise where complete loss of SPRED1
    function occurs in melanocytes: an acquired somatic second-hit mutation in
    the wild-type SPRED1 allele, on top of the germline variant, is required to
    generate a macule - a two-hit pattern analogous to NF1 café-au-lait biology.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Melanocytes from a café-au-lait spot showed, in addition to the germline
      SPRED1 mutation, an acquired somatic mutation in the wild-type SPRED1
      allele, indicating that complete SPRED1 inactivation is needed to generate
      a café-au-lait spot in this syndrome.
    explanation: >-
      Demonstrates a somatic second-hit mechanism in melanocytes underlying
      café-au-lait macule formation in Legius syndrome.
phenotypes:
- category: Cutaneous
  name: Multiple Café-au-lait Macules
  phenotype_term:
    preferred_term: Multiple cafe-au-lait spots
    term:
      id: HP:0007565
      label: Multiple cafe-au-lait spots
  description: >-
    Multiple café-au-lait macules are the cardinal and often only clinical sign,
    overlapping the pigmentary presentation of early NF1.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the reported disorder resemble those of
      neurofibromatosis type 1 and consist of multiple café-au-lait spots,
      axillary freckling and macrocephaly.
    explanation: >-
      Supports multiple café-au-lait macules as a defining feature of Legius
      syndrome.
- category: Cutaneous
  name: Axillary Freckling
  phenotype_term:
    preferred_term: Axillary freckling
    term:
      id: HP:0000997
      label: Axillary freckling
  description: >-
    Skinfold (axillary and inguinal) freckling can accompany the café-au-lait
    macules, further mimicking NF1.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the reported disorder resemble those of
      neurofibromatosis type 1 and consist of multiple café-au-lait spots,
      axillary freckling and macrocephaly.
    explanation: >-
      Supports axillary freckling as a recognized cutaneous feature of Legius
      syndrome.
- category: Craniofacial
  name: Macrocephaly
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  description: >-
    Macrocephaly (often relative macrocephaly) is a commonly reported feature,
    consistent with RAS-MAPK-pathway overgrowth signaling.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the reported disorder resemble those of
      neurofibromatosis type 1 and consist of multiple café-au-lait spots,
      axillary freckling and macrocephaly.
    explanation: >-
      Supports macrocephaly as part of the Legius syndrome phenotype.
- category: Neurodevelopmental
  name: Learning and Behavioral Difficulties
  phenotype_term:
    preferred_term: Specific learning disability
    term:
      id: HP:0001328
      label: Specific learning disability
  description: >-
    Mild learning disabilities and behavioral or attention difficulties are
    reported in a subset of individuals, generally milder than the cognitive
    burden of NF1. Frequency band is intentionally omitted pending a
    quantitative source.
genetic:
- name: SPRED1
  gene_term:
    preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  association: Loss-of-Function Pathogenic Variants
  notes: >-
    SPRED1 (chromosome 15q14) is the only gene definitively associated with
    Legius syndrome. Heterozygous loss-of-function variants act via
    haploinsufficiency of a RAS-MAPK negative regulator. Among individuals
    presenting with pigmentary features of NF1 only, SPRED1 variants account for
    a minority of cases, underscoring that most such presentations are still NF1.
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LGSS, inherited in an autosomal dominant pattern, is characterized by
      multiple CALMs similar to NF1 with or without skinfold freckling, caused
      by heterozygous PVs in SPRED1, located on chromosome 15.
    explanation: >-
      Confirms SPRED1 heterozygous pathogenic variants on chromosome 15 as the
      cause of Legius syndrome.
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies have shown that SPRED1 PVs account for 1% of sporadic
      cases and 19% of familial cases with pigmentary features of NF1 (CALMs and
      freckling) only.
    explanation: >-
      Quantifies the fraction of NF1-like pigmentary presentations explained by
      SPRED1 (Legius syndrome).
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Legius syndrome is inherited in an autosomal dominant pattern; heterozygous
    SPRED1 loss-of-function variants are sufficient to cause the disorder.
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LGSS, inherited in an autosomal dominant pattern, is characterized by
      multiple CALMs similar to NF1 with or without skinfold freckling, caused
      by heterozygous PVs in SPRED1, located on chromosome 15.
    explanation: >-
      Documents autosomal dominant inheritance of Legius syndrome.
differential_diagnoses:
- name: Neurofibromatosis type 1
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  description: >-
    NF1 is the principal differential: it shares the early pigmentary phenotype
    (café-au-lait macules and skinfold freckling) but, unlike Legius syndrome,
    additionally develops neurofibromas, Lisch nodules, optic pathway gliomas,
    bony dysplasia, and a defined malignancy risk. Molecular testing
    distinguishing SPRED1 from NF1 variants resolves ambiguous pigmentary-only
    presentations.
  distinguishing_features:
  - Neurofibromas, Lisch nodules, optic pathway gliomas, and tumor predisposition occur in NF1 but not in Legius syndrome.
  - A pathogenic SPRED1 variant supports Legius syndrome, whereas a pathogenic NF1 variant supports NF1.
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If only café-au-lait macules and freckling are present, the diagnosis is
      most likely NF1 but exceptionally the person might have another diagnosis
      such as Legius syndrome.
    explanation: >-
      Establishes NF1 as the primary differential diagnosis for pigmentary-only
      presentations, with Legius syndrome as the key alternative.
treatments:
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal dominant recurrence risk and the
    prognostic distinction from NF1 once a SPRED1 variant is confirmed.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
- name: Supportive and Developmental Care
  description: >-
    Management is supportive: developmental and educational support for learning
    or attention difficulties, and reassurance given the absence of the NF1
    tumor-surveillance burden once the diagnosis is molecularly established.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:34012067
      reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        LGSS, inherited in an autosomal dominant pattern, is characterized by
        multiple CALMs similar to NF1 with or without skinfold freckling, caused
        by heterozygous PVs in SPRED1, located on chromosome 15.
      explanation: >-
        Supports classification as an inherited (germline, autosomal dominant)
        RAS-MAPK pathway genetic disorder.

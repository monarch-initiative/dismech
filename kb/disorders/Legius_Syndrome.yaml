name: Legius Syndrome
creation_date: "2026-07-25T00:00:00Z"
description: >-
  Legius syndrome (LGSS; formerly "neurofibromatosis type 1-like syndrome", NFLS)
  is an autosomal dominant RASopathy caused by heterozygous germline
  loss-of-function variants in SPRED1. SPRED1 encodes a Sprouty-related, EVH1
  domain-containing negative regulator of RAS-MAPK signaling whose principal
  function is to recruit neurofibromin — the RAS-GTPase-activating protein encoded
  by NF1 — to activated RAS at the plasma membrane. Loss of SPRED1 therefore
  phenocopies the pigmentary arm of neurofibromatosis type 1: multiple bilateral
  café-au-lait macules with or without axillary/inguinal freckling, macrocephaly,
  lipomas, and a mild neurocognitive profile of learning disability, ADHD, and
  developmental delay. Critically, and unlike NF1, Legius syndrome is not
  associated with neurofibromas, Lisch nodules, symptomatic optic pathway gliomas,
  or the characteristic NF1 osseous lesions, which is why it is classified as a
  RASopathy rather than a form of neurofibromatosis. Because the two conditions
  are clinically indistinguishable in early childhood when only pigmentary
  findings are present, molecular confirmation of a SPRED1 variant is the
  defining diagnostic criterion in the 2021 international consensus revision.
category: Genetic
parents:
- RASopathy
synonyms:
- NF1-like syndrome
- neurofibromatosis type 1-like syndrome
- NFLS

disease_term:
  preferred_term: Legius syndrome
  description: >-
    An autosomal dominant RASopathy caused by loss-of-function SPRED1 variants,
    presenting with an NF1-like pigmentary phenotype but without the tumors and other
    complications of neurofibromatosis type 1.
  term:
    id: MONDO:0012669
    label: Legius syndrome
pathophysiology:
- name: SPRED1 Loss of Function
  description: >-
    Legius syndrome is caused by germline heterozygous loss-of-function variants in
    SPRED1, a member of the SPROUTY/SPRED family that normally acts as a negative
    regulator of the RAS-RAF interaction and downstream MAPK signaling. Loss of SPRED1
    function removes this brake on the pathway. In the affected café-au-lait
    melanocytes, a second somatic hit inactivating the wild-type SPRED1 allele is
    found, indicating that complete SPRED1 inactivation drives the pigmentary lesion.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  biological_processes:
  - preferred_term: negative regulation of MAPK cascade
    term:
      id: GO:0043409
      label: negative regulation of MAPK cascade
    modifier: DECREASED
  downstream:
  - target: Neurofibromin Mislocalization and Loss of RAS-GAP Recruitment
    description: >-
      Loss of SPRED1 removes the adaptor that recruits neurofibromin to the plasma
      membrane, impairing membrane-localized RAS-GTP hydrolysis.
    evidence:
    - reference: PMID:22751498
      reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that Spred1 binding induces the plasma membrane localization of NF1,
        which subsequently down-regulates Ras-GTP levels.
      explanation: >-
        SPRED1 loss removes the signal that localizes neurofibromin to the membrane,
        the mechanistic link to increased RAS-GTP.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report germline loss-of-function mutations in SPRED1 in a newly identified
      autosomal dominant human disorder.
    explanation: >-
      Establishes germline loss-of-function SPRED1 variants as the cause of the
      disorder.
- name: Neurofibromin Mislocalization and Loss of RAS-GAP Recruitment
  description: >-
    Neurofibromin, the NF1 gene product and a RAS-GTPase-activating protein, is a
    SPRED1-interacting partner whose inhibitory function toward RAS depends on SPRED1.
    SPRED1 binding induces plasma-membrane localization of neurofibromin, positioning
    it to down-regulate RAS-GTP. When SPRED1 is lost, neurofibromin fails to be
    recruited to the membrane and its RAS-inactivating activity is impaired, providing
    the molecular bridge that explains why SPRED1 loss (Legius syndrome) and NF1 loss
    (neurofibromatosis type 1) share overlapping pathophysiology.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  - preferred_term: NF1 (neurofibromin)
    term:
      id: hgnc:7765
      label: NF1
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Impaired neurofibromin-mediated RAS-GTP hydrolysis elevates active RAS and
      sustains downstream MAPK signaling.
    evidence:
    - reference: PMID:22751498
      reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that neurofibromin, the NF1 gene product, is a
        Spred1-interacting protein that is necessary for Spred1's inhibitory function.
      explanation: >-
        Loss of SPRED1 impairs neurofibromin's RAS-inhibitory function, elevating RAS
        signaling.
  evidence:
  - reference: PMID:22751498
    reference_title: "A shared molecular mechanism underlies the human rasopathies Legius syndrome and Neurofibromatosis-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This novel mechanism for the regulation of neurofibromin provides a molecular
      bridge for understanding the overlapping pathophysiology of NF1 and Legius
      syndrome.
    explanation: >-
      Establishes the shared SPRED1-neurofibromin mechanism underlying the overlap
      between Legius syndrome and NF1.
- name: RAS-MAPK Pathway Hyperactivation
  description: >-
    Like the other RASopathies, Legius syndrome results from germline dysregulation of
    the RAS-MAPK (RAS/ERK) signal transduction pathway. SPRED1 normally restrains
    RAS-RAF coupling and MAPK activation; its loss shifts the pathway toward increased
    signaling. This shared final common mechanism places Legius syndrome within the
    group of phenotypically overlapping RAS-MAPK disorders.
  biological_processes:
  - preferred_term: positive regulation of MAPK cascade
    term:
      id: GO:0043410
      label: positive regulation of MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disorder is yet another member of the recently characterized group of
      phenotypically overlapping syndromes caused by mutations in the genes encoding
      key components of the RAS-MAPK pathway.
    explanation: >-
      Places Legius syndrome within the RAS-MAPK RASopathy group sharing pathway
      dysregulation.

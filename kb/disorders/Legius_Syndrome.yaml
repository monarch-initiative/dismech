pathophysiology:
- name: Germline SPRED1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Legius syndrome is caused by heterozygous germline loss-of-function variants
    in SPRED1, a member of the SPROUTY/SPRED family of proteins that act as
    negative regulators of the RAS-RAF interaction and downstream MAPK signaling.
    This was the first human disease attributed to the SPRY/SPRED gene family and
    placed the disorder within the RASopathy group of RAS-MAPK pathway disorders.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  biological_processes:
  - preferred_term: negative regulation of Ras protein signal transduction
    term:
      id: GO:0046580
      label: negative regulation of Ras protein signal transduction
    modifier: DECREASED
  downstream:
  - target: Impaired Neurofibromin Recruitment to Activated RAS
    description: >-
      Loss of functional SPRED1 removes the adaptor that delivers neurofibromin
      to RAS at the plasma membrane.
    evidence:
    - reference: PMID:26635368
      reference_title: "Interaction between a Domain of the Negative Regulator of the Ras-ERK Pathway, SPRED1 Protein, and the GTPase-activating Protein-related Domain of Neurofibromin Is Implicated in Legius Syndrome and Neurofibromatosis Type 1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data clearly demonstrate that SPRED1 inhibits the Ras-ERK pathway
        by recruiting neurofibromin to Ras through the EVH1-GRD interaction
      explanation: >-
        Establishes neurofibromin recruitment as the mechanism by which SPRED1
        suppresses RAS-ERK signaling, and therefore the step lost when SPRED1
        function is lost.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report germline loss-of-function mutations in SPRED1 in a newly
      identified autosomal dominant human disorder. SPRED1 is a member of the
      SPROUTY/SPRED family of proteins that act as negative regulators of
      RAS->RAF interaction and mitogen-activated protein kinase (MAPK)
      signaling.
    explanation: >-
      The founding report establishing germline SPRED1 loss of function as the
      cause of the disorder and its role as a RAS-MAPK negative regulator.
  - reference: PMID:11493923
    reference_title: "Spred is a Sprouty-related suppressor of Ras signalling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Like Sprouty, Spred inhibited growth-factor-mediated activation of MAP
      kinase.
    explanation: >-
      Original functional characterization of Spred proteins as suppressors of
      growth-factor-driven MAPK activation, the activity lost in Legius syndrome.
- name: Impaired Neurofibromin Recruitment to Activated RAS
  biological_scale: MOLECULAR
  description: >-
    SPRED1 suppresses RAS-ERK signaling not by acting on RAS directly but by
    serving as a membrane-targeting adaptor for neurofibromin, the RAS-GAP
    encoded by NF1. The SPRED1 EVH1 domain binds short N- and C-terminal helical
    extensions flanking the GAP-related domain (GRD) of neurofibromin — regions
    dispensable for GAP catalysis and absent from p120GAP, which explains the
    selectivity of SPRED1 for neurofibromin among RasGAPs. Pathogenic EVH1-domain
    missense variants found in Legius syndrome reduce GRD binding affinity and
    correspondingly abolish the ERK-suppressing activity of SPRED1, providing a
    direct molecular link between genotype and pathway dysregulation. Structural
    work confirms that SPRED1-mediated membrane targeting allows neurofibromin to
    engage activated KRAS simultaneously.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  molecular_functions:
  - preferred_term: GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Without membrane-recruited neurofibromin, RAS-GTP is inefficiently
      hydrolyzed and flux through the RAF-MEK-ERK cascade is sustained.
    evidence:
    - reference: PMID:26635368
      reference_title: "Interaction between a Domain of the Negative Regulator of the Ras-ERK Pathway, SPRED1 Protein, and the GTPase-activating Protein-related Domain of Neurofibromin Is Implicated in Legius Syndrome and Neurofibromatosis Type 1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        EVH1 domain mutations with reduced binding to the GRD also disrupted the
        ERK suppression activity of SPRED1.
      explanation: >-
        Directly couples loss of the SPRED1-neurofibromin interaction to failure
        of ERK suppression.
  evidence:
  - reference: PMID:26635368
    reference_title: "Interaction between a Domain of the Negative Regulator of the Ras-ERK Pathway, SPRED1 Protein, and the GTPase-activating Protein-related Domain of Neurofibromin Is Implicated in Legius Syndrome and Neurofibromatosis Type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that the SPRED1 EVH1 domain interacts with the N-terminal 16 amino
      acids and the C-terminal 20 amino acids of the GTPase-activating protein
      (GAP)-related domain (GRD) of neurofibromin
    explanation: >-
      Maps the SPRED1-neurofibromin interface whose disruption underlies Legius
      syndrome.
  - reference: PMID:26635368
    reference_title: "Interaction between a Domain of the Negative Regulator of the Ras-ERK Pathway, SPRED1 Protein, and the GTPase-activating Protein-related Domain of Neurofibromin Is Implicated in Legius Syndrome and Neurofibromatosis Type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      pathogenic missense mutations in the EVH1 domain of SPRED1 in Legius
      syndrome reduced the binding affinity between the EVH1 domain and the GRD
    explanation: >-
      Shows that Legius-associated EVH1 missense variants act by weakening
      neurofibromin binding.
  - reference: PMID:32697994
    reference_title: "Structural Insights into the SPRED1-Neurofibromin-KRAS Complex and Disruption of SPRED1-Neurofibromin Interaction by Oncogenic EGFR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The structure provides insight into how the membrane targeting of
      neurofibromin by SPRED1 allows simultaneous interaction with activated
      KRAS.
    explanation: >-
      Structural confirmation that SPRED1 positions neurofibromin at the membrane
      to act on active RAS.
  - reference: PMID:32697994
    reference_title: "Structural Insights into the SPRED1-Neurofibromin-KRAS Complex and Disruption of SPRED1-Neurofibromin Interaction by Oncogenic EGFR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the neurofibromin-SPRED1 interface provides a rationale for
      mutations observed in Legius syndrome and suggests why SPRED1 can bind to
      neurofibromin but no other RasGAPs.
    explanation: >-
      Explains both the pathogenicity of interface variants and the selectivity
      of SPRED1 for neurofibromin rather than other RasGAPs.
- name: RAS-MAPK Pathway Hyperactivation
  biological_scale: CELLULAR
  description: >-
    Like the other RASopathies, Legius syndrome results from germline
    dysregulation of the RAS-MAPK (RAS/ERK) signal transduction cascade. The
    shared pathway lesion places the disorder in the same phenotypically
    overlapping family as neurofibromatosis type 1, Noonan syndrome, Costello
    syndrome, and cardiofaciocutaneous syndrome, and accounts for the
    macrocephaly, pigmentary, and neurocognitive features shared across the
    group. In Legius syndrome the dysregulation is comparatively mild and does
    not reach the threshold required for neurofibroma or other NF1 tumor
    formation.
  biological_processes:
  - preferred_term: positive regulation of MAPK cascade
    term:
      id: GO:0043410
      label: positive regulation of MAPK cascade
    modifier: INCREASED
  downstream:
  - target: Biallelic SPRED1 Inactivation in Melanocytes
    description: >-
      Pathway dysregulation becomes phenotypically manifest in skin only where a
      somatic second hit removes the remaining SPRED1 allele.
    evidence:
    - reference: PMID:17704776
      reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        indicating that complete SPRED1 inactivation is needed to generate a
        café-au-lait spot in this syndrome
      explanation: >-
        Establishes that the pigmentary lesion requires biallelic, not
        heterozygous, SPRED1 loss.
  - target: Hippocampal Synaptic Plasticity Impairment
    description: >-
      Sustained ERK activation in hippocampal circuits perturbs the balance of
      long-term potentiation and depression.
    evidence:
    - reference: PMID:19118178
      reference_title: "Spred1 is required for synaptic plasticity and hippocampus-dependent learning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This indicates that deficits in hippocampus-dependent learning and
        synaptic plasticity induced by SPRED1 deficiency are related to
        hyperactivation of the Ras/ERK pathway.
      explanation: >-
        Links Ras/ERK hyperactivation to the synaptic plasticity defect in the
        Spred1-null mouse model.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disorder is yet another member of the recently characterized group of
      phenotypically overlapping syndromes caused by mutations in the genes
      encoding key components of the RAS-MAPK pathway.
    explanation: >-
      Places Legius syndrome within the RAS-MAPK (RASopathy) group sharing this
      final common mechanism.
- name: Biallelic SPRED1 Inactivation in Melanocytes
  biological_scale: CELLULAR
  description: >-
    Melanocytes isolated from a café-au-lait macule of an affected individual
    carried, in addition to the germline SPRED1 variant, an acquired somatic
    mutation in the wild-type SPRED1 allele. Café-au-lait macule formation in
    Legius syndrome therefore follows a two-hit, mosaic-somatic logic in the
    melanocyte lineage, mirroring the second-hit requirement described for NF1
    pigmentary lesions, rather than arising from germline haploinsufficiency
    alone.
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  downstream:
  - target: Cafe-au-lait Macule Formation
    description: >-
      Clonal patches of SPRED1-null melanocytes produce the hyperpigmented
      macules that define the clinical phenotype.
    evidence:
    - reference: PMID:17704776
      reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Melanocytes from a café-au-lait spot showed, in addition to the germline
        SPRED1 mutation, an acquired somatic mutation in the wild-type SPRED1
        allele
      explanation: >-
        Documents the somatic second hit in lesional melanocytes as the proximate
        cause of the macule.
  evidence:
  - reference: PMID:17704776
    reference_title: "Germline loss-of-function mutations in SPRED1 cause a neurofibromatosis 1-like phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      indicating that complete SPRED1 inactivation is needed to generate a
      café-au-lait spot in this syndrome
    explanation: >-
      States the biallelic-inactivation requirement for the pigmentary lesion.
- name: Cafe-au-lait Macule Formation
  biological_scale: TISSUE
  description: >-
    The cardinal and often sole objective finding of Legius syndrome: multiple,
    bilaterally distributed café-au-lait macules, with or without skinfold
    (axillary or inguinal) freckling, clinically indistinguishable from those of
    neurofibromatosis type 1. Because the pigmentary phenotype is shared, roughly
    half of individuals with a SPRED1 variant satisfy the older NIH clinical
    criteria for NF1 despite having a different natural history — the observation
    that drove the 2021 consensus revision to make a molecular SPRED1 result a
    required diagnostic criterion.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LGSS, inherited in an autosomal dominant pattern, is characterized by
      multiple CALMs similar to NF1 with or without skinfold freckling, caused by
      heterozygous PVs in SPRED1, located on chromosome 15.
    explanation: >-
      Consensus statement describing the defining pigmentary phenotype and its
      genetic basis.
- name: Hippocampal Synaptic Plasticity Impairment
  biological_scale: CELLULAR
  description: >-
    Spred1-null mice show impaired performance in the Morris water maze and
    visual-discrimination T-maze with normal basic neuromotor and sensory
    abilities, together with defects in short- and long-term hippocampal synaptic
    plasticity including a disequilibrium between long-term potentiation and
    long-term depression in CA1. Increased ERK phosphorylation is measurable in
    Spred1-null slices after LTP induction, linking the plasticity defect to
    Ras/ERK hyperactivation. This is the candidate substrate for the learning
    disability, ADHD, and developmental delay reported in affected individuals,
    but the translational step from mouse hippocampal physiology to the human
    cognitive phenotype has not been directly demonstrated (see the
    HUMAN_MODEL_MISMATCH discussion).
  genes:
  - preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  biological_processes:
  - preferred_term: long-term synaptic potentiation
    term:
      id: GO:0060291
      label: long-term synaptic potentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19118178
    reference_title: "Spred1 is required for synaptic plasticity and hippocampus-dependent learning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electrophysiological recordings on brain slices from these animals
      identified defects in short- and long-term synaptic hippocampal
      plasticity, including a disequilibrium between long-term potentiation (LTP)
      and long-term depression in CA1 region.
    explanation: >-
      Documents the hippocampal plasticity defect in the Spred1-null mouse model.
  - reference: PMID:19118178
    reference_title: "Spred1 is required for synaptic plasticity and hippocampus-dependent learning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spred1(-/-) mice show decreased learning and memory performance in the
      Morris water maze and visual-discrimination T-maze, but normal basic
      neuromotor and sensory abilities.
    explanation: >-
      Shows a selective learning and memory deficit rather than a general
      sensorimotor impairment in the model.

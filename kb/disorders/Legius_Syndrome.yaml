genetic:
- name: SPRED1
  gene_term:
    preferred_term: SPRED1
    term:
      id: hgnc:20249
      label: SPRED1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous loss-of-function variants in SPRED1 (chromosome 15) cause Legius
    syndrome. The mutational spectrum is broad — 34 distinct SPRED1 variants were
    identified across 43 probands in the defining anonymous cohort — so there is
    no single recurrent variant, in contrast to the single recurrent SHOC2
    p.Ser2Gly variant of NS/LAH. Pathogenic missense variants cluster in the EVH1
    domain and act by weakening the neurofibromin GRD interaction. SPRED1 variants
    account for approximately 1% of sporadic and 19% of familial cases presenting
    with pigmentary features of NF1 only.
  evidence:
  - reference: PMID:19920235
    reference_title: "Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the anonymous cohort of 1318 individuals, 34 different SPRED1 mutations
      in 43 probands were identified: 27 pathogenic mutations in 34 probands and
      7 probable nonpathogenic missense mutations in 9 probands.
    explanation: >-
      Documents the breadth of the SPRED1 mutational spectrum and the absence of a
      single recurrent variant.
  - reference: PMID:34012067
    reference_title: "Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies have shown that SPRED1 PVs account for 1% of sporadic cases
      and 19% of familial cases with pigmentary features of NF1 (CALMs and
      freckling) only.
    explanation: >-
      Quantifies the diagnostic yield of SPRED1 testing in individuals with
      isolated pigmentary NF1 features.
inheritance:
- name: Autosomal Dominant
  description: >-
    Legius syndrome is inherited in an autosomal dominant manner. Unlike many
    ultra-rare RASopathies, most affected individuals have an affected parent
    rather than a de novo variant, and each child of an affected individual has a
    50% recurrence risk.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20945555
    reference_title: "Legius Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Legius syndrome is inherited in an autosomal dominant manner. Many
      individuals diagnosed with Legius syndrome have an affected parent.
    explanation: >-
      GeneReviews states the autosomal dominant inheritance pattern and the
      predominance of inherited rather than de novo variants.

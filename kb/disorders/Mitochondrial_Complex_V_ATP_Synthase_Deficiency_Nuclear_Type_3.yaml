genetic:
- name: ATP5F1E
  notes: >-
    ATP5F1E (formerly ATP5E; 20q13.32) encodes the epsilon subunit of the F1
    catalytic head of mitochondrial ATP synthase — the smallest F1 subunit, part
    of the central stalk with gamma and delta, and the only F1 subunit with no
    bacterial or chloroplast homologue. Exactly one pathogenic allele is known:
    c.35A>G (p.Tyr12Cys), homozygous in all three reported patients from three
    unrelated families. The gene has a processed pseudogene, ATP5EP1, which is a
    practical consideration for primer design and read mapping.
  gene_term:
    preferred_term: ATP5F1E
    term:
      id: hgnc:838
      label: ATP5F1E
  relationship_type: CAUSATIVE
  variants:
  - name: ATP5F1E c.35A>G (p.Tyr12Cys)
    description: >-
      The only reported disease-causing ATP5F1E allele, homozygous in all three
      patients from three unrelated families and unobserved in controls. Tyrosine
      12 is highly conserved. The substituted protein is still made and still
      incorporated into the complex, but the amount of complex assembled falls by
      60-70 percent.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34954817
      reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In these patients, the same homozygous c.35A>G (p.Tyr12Cys) missense variant was found, whereas their unaffected parents were heterozygous for the mutation."
      explanation: The recurrent homozygous allele in three unrelated families.
    - reference: PMID:20566710
      reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mitochondrial content of the ATP synthase complex was equally reduced, but its size was normal and it contained the mutated epsilon subunit."
      explanation: Shows that the mutant protein is incorporated, so the allele is not a simple null.
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first case of a mitochondrial disease due to a mutation in a nuclear encoded structural subunit of the ATP synthase."
    explanation: Establishes ATP5F1E as the first nuclear structural-subunit cause of ATP synthase disease.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, we were able to replicate ATP5F1E as a recessive disease gene in three unrelated patients, all of whom shared an identical homozygous variant."
    explanation: Independent replication of ATP5F1E as a recessive disease gene.

biochemical:
- name: Oligomycin-sensitive ATPase activity in fibroblasts
  notes: >-
    The functional assay that defines the biochemical diagnosis: ATP synthase
    activity measured as the oligomycin-sensitive fraction, reduced by 60-70
    percent in cultured patient fibroblasts, together with a matching reduction in
    mitochondrial ATP synthesis and in the amount of assembled complex. Two
    features of the result matter diagnostically. It is ISOLATED - the
    electron-transport complexes are not reduced - and the shortfall is in enzyme
    amount rather than in enzyme quality, so an assay that normalised activity to
    complex V content would miss it.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  readouts:
  - target: "pathophysiology#Reduced Mitochondrial ATP Synthesis"
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    description: Oligomycin-sensitive ATPase activity in cultured patient fibroblasts.
    interpretation: >-
      A direct readout of the mechanism node rather than a correlate: the assay
      measures the ATP synthase activity whose loss the node asserts, reduced by
      60-70 percent relative to control fibroblasts and in step with the
      reduction in mitochondrial ATP synthesis and in assembled complex V.
      `direction` is left absent because the BiomarkerReadoutDirectionEnum values
      describe the direction of association with a clinical endpoint, and no
      endpoint association has been studied for this assay in a three-patient
      disease; the direction of the measurement itself is stated here and in the
      node.
    evidence:
    - reference: PMID:20566710
      reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts showed 60-70% decrease in both oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis."
      explanation: The quantitative biochemical deficit measured in patient fibroblasts.
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed 60-70% decrease in both oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis."
    explanation: Establishes the reduced ATP synthase activity that constitutes the biochemical diagnosis.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three patients from three unrelated families have ever been reported, all
    homozygous for the same allele. No population prevalence, birth prevalence or
    carrier frequency has been estimated, so the qualitative ULTRA_RARE tier is
    used rather than a numeric Orphanet band. For scale within the nuclear
    ATP-synthase disorders, TMEM70 had already accumulated nearly 50 diagnosed
    patients when ATP5E still had one.
  evidence:
  - reference: PMID:24564666
    reference_title: "Nuclear genetic defects of mitochondrial ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Up to now, only two patients with mutations in ATP5A1 and one patient each with mutations in ATP5E and ATPAF2 genes were reported pointing to the level of rareness of these disorders."
    explanation: The 2014 tally, showing a single ATP5E patient against nearly 50 for TMEM70; graded OTHER as a review count.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, we were able to replicate ATP5F1E as a recessive disease gene in three unrelated patients, all of whom shared an identical homozygous variant."
    explanation: Brings the reported total to three patients as of 2022.

experimental_models:
- name: ATP5F1E-silenced HEK293 cells
  experimental_model_type: CELL_LINE
  description: >-
    RNA-interference knockdown of ATP5E in HEK293 cells, the model that separated
    the consequences of low epsilon dosage from the consequences of the patient's
    particular substitution. Activity, complex content and ADP-stimulated
    respiration all fall to about 40 percent of control; alpha, beta, a and d fall
    with them; subunit c does not, and is found in orphan 200-400 kDa
    subcomplexes.
  evidence:
  - reference: PMID:20026007
    reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Silencing of the ATP5E gene in HEK293 cells resulted in downregulation of the activity and content of the mitochondrial ATP synthase complex and of ADP-stimulated respiration to approximately 40% of the control."
    explanation: Establishes the knockdown line as an informative model of reduced epsilon dosage.
  modeled_mechanisms:
  - target: Impaired F1 Assembly and Reduced Complex V Content
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the reduced content and activity of assembled ATP synthase seen
      in patient fibroblasts, from epsilon depletion alone.
    limitations: >-
      An immortalised embryonic kidney line, not a neuron or a myocyte, and
      knockdown reduces epsilon abundance whereas the patients express a
      substituted epsilon that is still incorporated into the complex. The model
      therefore tests the dosage arm of the mechanism and not the specific
      consequences of p.Tyr12Cys.
    readouts:
    - name: Assembled ATP synthase content and activity
      target: Impaired F1 Assembly and Reduced Complex V Content
      direction: DECREASED
      interpretation: >-
        Complex content, enzyme activity and ADP-stimulated respiration all fall
        to about 40 percent of control on epsilon knockdown.
      evidence:
      - reference: PMID:20026007
        reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Silencing of the ATP5E gene in HEK293 cells resulted in downregulation of the activity and content of the mitochondrial ATP synthase complex and of ADP-stimulated respiration to approximately 40% of the control."
        explanation: The measurement behind this readout.
  - target: Subunit c Accumulation in Insoluble Form
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the selective sparing and mis-assembly of subunit c that
      distinguishes this lesion from other F1 subunit defects.
    limitations: >-
      Same cell-line and knockdown-versus-missense caveats. The subcomplexes are
      resolved by blue-native electrophoresis, so their composition is inferred
      from co-migration rather than directly imaged.
    readouts:
    - name: Subunit c abundance and distribution
      target: Subunit c Accumulation in Insoluble Form
      direction: UNCHANGED
      interpretation: >-
        Subunit c abundance is not reduced when every other subunit is, and the
        excess appears in subcomplexes lacking both F1 and the other Fo subunits —
        an unchanged amount that is itself the abnormal result.
      evidence:
      - reference: PMID:20026007
        reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The decreased content of the epsilon subunit was paralleled by a decrease in the F1 subunits alpha and beta and in the Fo subunits a and d while the content of the subunit c was not affected."
        explanation: The abundance measurement behind this readout.

- name: Saccharomyces cerevisiae epsilon p.Tyr11Cys strain
  experimental_model_type: OTHER
  description: >-
    A yeast model of the patient allele, built by introducing the equivalent
    Y11C substitution into the yeast epsilon subunit gene ATP15, plus a companion
    strain expressing the wild-type human ATP5E. It is included here because it
    is a clean negative: the mutation that devastates enzyme assembly in humans
    does almost nothing in yeast, which is evidence that ATP synthase biogenesis
    differs between the two organisms rather than evidence about the patient.
  evidence:
  - reference: PMID:25954304
    reference_title: "Biochemical investigation of a human pathogenic mutation in the nuclear ATP5E gene using yeast as a model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To better define how it affects ATP synthase, we have modeled this mutation in the yeast Saccharomyces cerevisiae."
    explanation: States the purpose and construction of the model; graded OTHER because yeast is neither an animal model nor a cultured-cell system in this schema's sense.
  modeled_mechanisms:
  - target: Impaired F1 Assembly and Reduced Complex V Content
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The yeast equivalent of p.Tyr12Cys had no significant effect on respiratory
      growth and no significant impact on the assembly or stability of the ATP
      synthase complex — the opposite of the human result, where assembly is the
      thing that fails.
    limitations: >-
      A unicellular fungus with a demonstrably different ATP synthase assembly
      pathway: biogenesis factors of the yeast enzyme are not conserved in humans
      and vice versa. The negative result is informative about that divergence,
      not about whether p.Tyr12Cys is pathogenic in patients, and it should not be
      cited as evidence against pathogenicity.
    readouts:
    - name: ATP synthase assembly and stability in yeast
      target: Impaired F1 Assembly and Reduced Complex V Content
      direction: UNCHANGED
      interpretation: >-
        Blue-native analysis of the Y11C strain showed no significant effect on
        assembly or stability of the complex, in contrast to the severe assembly
        defect in patient fibroblasts.
      evidence:
      - reference: PMID:25954304
        reference_title: "Biochemical investigation of a human pathogenic mutation in the nuclear ATP5E gene using yeast as a model."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "On the contrary, this mutation which has been shown to have a strong impact on the assembly of the ATP synthase complex in humans, shows no significant impact on the assembly/stability of this complex in yeast, suggesting that biogenesis of this complex differs significantly."
        explanation: The assembly measurement behind this negative readout, together with the authors' interpretation.
    evidence:
    - reference: PMID:25954304
      reference_title: "Biochemical investigation of a human pathogenic mutation in the nuclear ATP5E gene using yeast as a model."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A yeast equivalent of this mutation (Y11C) had no significant effect on the growth of yeast on non-fermentable carbon sources (glycerol/ethanol or lactate), conditions under which the activity of the mitochondrial energy transducing system is absolutely essential."
      explanation: The growth phenotype is absent, which is why this link is a failure to recapitulate rather than a partial one.

diagnosis:
- name: Biochemical demonstration of isolated complex V deficiency
  description: >-
    The diagnostic route is biochemical first: an isolated reduction of
    oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis in
    fibroblasts or muscle, with the electron-transport complexes intact, in a
    child with neonatal lactic acidosis and 3-methylglutaconic aciduria. The
    isolated pattern is what directs sequencing to the nuclear ATP-synthase genes
    rather than to a general OXPHOS panel.
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed 60-70% decrease in both oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis."
    explanation: The biochemical finding that establishes the complex V deficiency.
- name: Molecular genetic testing
  description: >-
    Confirmation is by sequencing ATP5F1E, in practice within exome or genome
    sequencing. Because a single recurrent homozygous allele accounts for every
    reported patient, c.35A>G is the specific thing to look for. Historically
    ATP5E was reached only after TMEM70 was excluded; in the 2022 cohort the
    patients were found by unbiased exome analysis, including two ascertained from
    a dystonia rather than a mitochondrial-disease cohort.
  evidence:
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients with ATPase variants had undergone WES according to previously reported methodologies"
    explanation: Exome sequencing as the route by which the further ATP5F1E patients were identified.

differential_diagnoses:
- name: TMEM70-related mitochondrial complex V deficiency (MC5DN1)
  description: >-
    The common nuclear cause of isolated ATP synthase deficiency and the first
    alternative to exclude: a neonatal encephalo-cardiomyopathy with lactic
    acidosis, 3-methylglutaconic aciduria and hypertrophic cardiomyopathy, with a
    recurrent c.317-2A>G splice allele and a marked founder effect. It shares the
    isolated complex V biochemistry with MC5DN3 and is distinguished clinically by
    the cardiomyopathy, which the ATP5F1E patient did not have, and mechanistically
    by being an assembly-factor rather than a structural-subunit defect.
  distinguishing_features:
  - Biallelic TMEM70 rather than ATP5F1E variants
  - Hypertrophic cardiomyopathy, absent in the reported ATP5F1E patient
- name: MT-ATP6 and MT-ATP8 disorders (NARP, maternally inherited Leigh syndrome)
  description: >-
    The mitochondrial-genome diseases of the same enzyme. They produce an
    overlapping biochemical picture but a different genetics entirely — maternal
    transmission, heteroplasmy-dependent threshold effects, and no recurrence risk
    for the father's relatives — and a different clinical spectrum dominated by
    retinitis pigmentosa, neurogenic weakness and subacute necrotising
    encephalomyelopathy. Distinguishing them is the main reason to sequence mtDNA
    before or alongside the nuclear ATP-synthase genes.
  distinguishing_features:
  - Pathogenic mtDNA variant with maternal transmission rather than a biallelic nuclear variant
  - Heteroplasmy-dependent severity and tissue variability
- name: Other nuclear ATP synthase subunit disorders (ATP5F1A, ATP5F1D, ATP5MK, ATP5PO, ATP5MC3)
  description: >-
    A small set of ultra-rare disorders of other complex V subunits, several
    described after ATP5F1E, ranging from lethal infantile encephalopathy to
    metabolic crises that resolve spontaneously. They share the isolated complex V
    biochemistry and are separated only by the gene.
  distinguishing_features:
  - The specific ATP-synthase subunit gene involved
- name: Combined OXPHOS deficiencies with a complex V component
  description: >-
    Complex V deficiency is frequently reported as one arm of a combined
    respiratory-chain defect — in mtDNA maintenance, translation and cofactor
    disorders. These are excluded from MC5DN3 by the isolated biochemical pattern:
    in the ATP5F1E patient the electron-transport complexes were not reduced but
    increased.
  distinguishing_features:
  - Reduction of one or more of complexes I-IV alongside complex V

treatments:
- name: Supportive management of metabolic decompensation
  description: >-
    No disease-modifying therapy exists. Management is the standard mitochondrial
    approach: treating acute lactic acidosis, avoiding and aggressively managing
    catabolic triggers such as intercurrent infection, and symptomatic care of the
    neurological features. It is worth recording that the metabolic instability in
    these patients improved with age in all three — spontaneously in patient 2 and
    with resolution of the infection-triggered episodes in the index patient — so
    the natural history of the metabolic component is towards stabilisation rather
    than progression.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Episodes of infection-triggered metabolic deterioration, observed in her first years of life9, had resolved."
    explanation: Documents that the infection-triggered metabolic episodes resolved over an 11-year follow-up, which is what makes supportive management through the early years the substance of care.
- name: Symptomatic treatment of dystonia
  description: >-
    Dystonia is the feature most likely to need active treatment and the one that
    responded worst: in patient 2 the generalised dystonia responded poorly to the
    medications tried. No specific agent or class is recommended by the reports.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic abnormalities improved spontaneously, but she experienced development delay and progressively developed generalized dystonia with poor response to trialed medications; she also had visual and hearing deficits."
    explanation: Records that trialed medications did not control the dystonia; the report names no agent, so this supports no specific treatment claim.

discussions:
- discussion_id: mc5dn3_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#ATP5F1E"
  prompt: >-
    Is ATP5F1E an established disease gene, given that every reported patient
    carries the same homozygous allele?
  rationale: >-
    Three patients, three families, one allele. That is enough for the 2022 group
    to call ATP5F1E replicated as a recessive disease gene, and the functional
    evidence is strong and independent of the allele — knockdown in HEK293 cells
    reproduces the biochemistry. But the same group had written a year earlier
    that the association "has not been firmly established", and the constraint is
    real: with a single recurrent variant, an allele-specific artefact and a
    shared founder haplotype cannot be excluded on genetics alone, and no
    genotype-phenotype range can be described because there is no second genotype.
    The practical consequence is that a laboratory finding a DIFFERENT biallelic
    ATP5F1E variant has no comparable case to reason from, and would need
    functional work to call it. Curating the entry is not in tension with the gap:
    the mechanism is well characterised, it is the allelic and phenotypic spectrum
    that is unknown.
  proposed_experiments:
  - experiment_id: exp_mc5dn3_haplotype_and_new_alleles
    name: Haplotype analysis of the recurrent allele and search for a second genotype
    description: >-
      Determine whether the three families share a haplotype around c.35A>G, and
      screen large isolated-complex-V-deficiency and unsolved-mitochondrial-disease
      cohorts for any other biallelic ATP5F1E genotype, with fibroblast complex V
      content and activity measured on anything found.
    would_support:
    - "genetic#ATP5F1E"
    supporting_outcome:
    - >-
      A second, different biallelic genotype producing the same isolated complex V
      assembly defect would establish the gene independently of the single allele
      and open up a genotype-phenotype spectrum.
    refuting_outcome:
    - >-
      A shared founder haplotype with no second genotype found in large cohorts
      would leave the association resting on one allele and one biochemical
      phenotype.

- discussion_id: mc5dn3_why_the_epsilon_lesion_spares_catalysis
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Subunit c Accumulation in Insoluble Form"
  prompt: >-
    What happens to the subunit c that accumulates in a detergent-insoluble form,
    and does it contribute to the disease or merely mark the assembly defect?
  rationale: >-
    The selective accumulation of subunit c is the most distinctive feature of
    this lesion and the least followed up. Two readings are possible and the
    published data do not separate them. Either it is a bystander — surplus c-ring
    protein left over when there is not enough epsilon to load it, inert and
    simply a marker of where assembly stalls — or it is itself injurious, since
    insoluble accumulation of subunit c is the storage material of the neuronal
    ceroid lipofuscinoses and has been noted in other neurological disease. The
    distinction matters mechanistically: if the accumulated c is toxic then the
    disease has a proteinopathy arm that no current node captures, and
    subunit-c-directed readouts would belong in the diagnostic and therapeutic
    picture rather than only in the assembly story.
  proposed_experiments:
  - experiment_id: exp_mc5dn3_subunit_c_fate
    name: Fate and consequences of accumulated subunit c in epsilon-deficient cells
    description: >-
      In patient fibroblasts and ATP5F1E-knockdown cells, localise the
      detergent-insoluble subunit c by immuno-electron microscopy, ask whether it
      is lysosomal, and test whether preventing its accumulation (by reducing
      ATP5MC1/2/3 dosage) alters viability, membrane potential or oxidative stress.
    would_support:
    - "pathophysiology#Subunit c Accumulation in Insoluble Form"
    supporting_outcome:
    - >-
      Lysosomal accumulation of subunit c with a measurable improvement in cell
      physiology when it is prevented would make the accumulation a mechanism
      rather than a marker.
    refuting_outcome:
    - >-
      Diffuse, non-lysosomal deposition with no physiological change when it is
      prevented would confirm it as an inert marker of the stalled assembly.

notes: >-
  Entity boundaries, which are the main curation decision in this entry.

  MT-ATP6 and MT-ATP8 disease supplied no evidence here. NARP and the MT-ATP6
  Leigh phenotypes affect the same enzyme and have a much larger literature, and
  the deep-research report committed with this entry mentions MT-ATP6 eleven
  times — the Named Entity Confusion preflight flagged it as a rival gene at 28
  percent of ATP5F1E's mention count. Every reference cited in this file was
  selected and read directly rather than taken from the report, and each is
  either specifically about ATP5F1E/ATP5E or a review section explicitly about the
  ATP5E patient. The two dismech entries for the mitochondrial-genome diseases,
  `NARP_syndrome` and `MT-ATP6_MT-ATP8-Related_Infantile_Hypertrophic_Cardiomyopathy`,
  are listed as differential diagnoses and nothing was imported from them.

  Combined-OXPHOS material is excluded the same way. Complex V deficiency is
  commonly reported as one arm of a combined defect, and a search on the enzyme
  returns those cohorts; none is cited here. The `Isolated Complex V Deficiency
  with Preserved Respiratory Chain` node exists to state the boundary explicitly,
  and the index patient's electron-transport complexes were increased rather than
  reduced, which is the opposite of a combined defect.

  No frequency bands are assigned to any phenotype. The entire disease is three
  patients described in two papers of unequal clinical detail, and a band computed
  from n=3 would assert a precision the literature does not have — 2 of 3 is not
  the same claim as "30-79 percent of patients". The per-patient distribution is
  written into each phenotype description instead. The 2022 paper's figure of
  dystonia in 7 of 10 patients is explicitly NOT used, because that denominator
  spans four different ATPase genes and the authors flag its ascertainment bias.

  The absence of cardiomyopathy is the sharpest clinical discriminator from
  TMEM70-related complex V deficiency, but it is NOT curated as a phenotype
  record: the `Phenotype` class has no `presence` slot, so an entry bound to
  HP:0001638 would assert the cardiomyopathy rather than deny it. The negative is
  recorded in the TMEM70 differential diagnosis and in that entry's
  distinguishing features instead.

  `Screening for nuclear genetic defects in the ATP synthase-associated genes
  TMEM70, ATP12 and ATP5E in patients with 3-methylglutaconic aciduria`
  (PMID:21815885) is listed in `references` but carries no evidence item and no
  claim: its reference cache has `content_type: unavailable`, so nothing it
  reports can be quoted or verified. It is listed because it is the one published
  attempt to find more ATP5E patients and a reader should know it exists.

  Not curated: `clinical_trials` and `datasets`, because there are none for this
  entity; `animal_models`, because none exists — the yeast strain is filed under
  `experimental_models` since yeast is not an animal, and it is a negative model
  in any case; `progression`, because with three patients there is no staged
  natural history, though the direction of travel — early metabolic instability
  resolving into a static neurological deficit — is recorded in the description
  and in the treatments block.

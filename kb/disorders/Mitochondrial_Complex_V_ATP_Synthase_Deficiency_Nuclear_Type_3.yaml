name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 3
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 3
  term:
    id: MONDO:0013547
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 3
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 3 (MC5DN3) is
  the isolated ATP synthase deficiency caused by biallelic variants in ATP5F1E,
  the nuclear gene for the epsilon subunit of the F1 catalytic head. It was the
  first mitochondrial disease attributed to a mutation in a nuclear-encoded
  STRUCTURAL subunit of complex V — until 2010 the nuclear causes of isolated
  ATP synthase deficiency were the assembly factors TMEM70 and ATPAF2, and the
  structural causes were mitochondrial-genome genes.

  The whole disease is three patients, all homozygous for the same allele,
  c.35A>G (p.Tyr12Cys), reported in two papers eleven years apart. The 2010 index
  case was a 22-year-old woman with neonatal-onset lactic acidosis,
  3-methylglutaconic aciduria, mild intellectual disability, exercise intolerance
  and peripheral neuropathy; her parents were healthy heterozygotes. In 2022 a
  multi-centre nuclear-ATPase cohort found two further unrelated patients with the
  identical homozygous variant and re-examined the first. Across the three, the
  shared picture is neonatal or infantile metabolic crisis with lactic acidosis
  and respiratory compromise, followed by a stabilising course with intellectual
  disability, ataxia, dystonia and peripheral neuropathy.

  Mechanistically the epsilon subunit turns out to matter for building the enzyme
  rather than for running it. In patient fibroblasts oligomycin-sensitive ATPase
  activity and mitochondrial ATP synthesis fall by 60-70 percent, and the amount
  of assembled complex V falls by the same proportion — but the complex that does
  assemble is of normal size, contains the mutant epsilon subunit, and hydrolyses
  and synthesises normally. Every F1 and Fo subunit is reduced in parallel with
  one exception: subunit c accumulates in a detergent-insoluble form, which is
  what implicates epsilon in loading the c-ring onto the rotor rather than merely
  in stabilising F1. Knocking ATP5F1E down in HEK293 cells reproduces both halves
  of that result independently of any patient allele.

  Two entities are deliberately excluded. The maternally inherited MT-ATP6
  diseases — NARP and the MT-ATP6 Leigh phenotypes — affect the same enzyme with a
  far larger literature, are separate dismech entries, and contributed no evidence
  here; the distinction is not pedantic, because they are transmitted maternally
  with heteroplasmy-dependent severity while MC5DN3 is nuclear recessive. And
  complex V deficiency reported as one arm of a COMBINED OXPHOS defect is a
  different biochemical entity from the isolated deficiency curated here: the
  ATP5F1E lesion leaves complexes I-IV intact and in fact provokes a compensatory
  rise in the electron-transport complexes.

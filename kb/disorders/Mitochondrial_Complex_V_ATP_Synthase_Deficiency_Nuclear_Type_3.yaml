inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All three reported patients are homozygous for ATP5F1E c.35A>G (p.Tyr12Cys)
    with heterozygous, unaffected parents. ATP5F1E is nuclear and autosomal
    (20q13.32), so despite the disease being a defect of a mitochondrial enzyme
    the transmission is nuclear recessive — a 25 percent sibling recurrence risk,
    no maternal transmission, and none of the heteroplasmy-dependent variability
    that characterises the MT-ATP6 diseases of the same enzyme.
  evidence:
  - reference: PMID:24564666
    reference_title: "Nuclear genetic defects of mitochondrial ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sequencing of ATP5E gene coding for subunit ε (Mayr et al. 2010) uncovered homozygous missense mutation c.35A>G replacing highly conserved tyrosine 12 with cysteine. Parents were healthy heterozygous carriers."
    explanation: States the homozygous genotype with healthy heterozygous parents; graded OTHER because this is a review restating the index report.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, the same homozygous c.35A>G (p.Tyr12Cys) missense variant was found, whereas their unaffected parents were heterozygous for the mutation."
    explanation: Confirms the recessive segregation independently in two further unrelated families.
pathophysiology:
- name: ATP5F1E p.Tyr12Cys Substitution
  biological_scale: MOLECULAR
  description: >-
    A single allele accounts for the whole disease: c.35A>G, replacing the highly
    conserved tyrosine at position 12 of the epsilon subunit with cysteine,
    homozygous in all three reported patients and absent from controls. Epsilon is
    the smallest F1 subunit and the only one with no bacterial or chloroplast
    homologue, sitting in the central stalk with gamma and delta. The mutant
    protein is made and is incorporated into the enzyme — this is not a null
    allele — but its presence depresses the biosynthesis of the complex.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous germline missense allele. Classified as partial loss of function
      rather than loss of function because the assembled enzyme retains normal
      synthetic and hydrolytic activity per complex; what is lost is the amount of
      enzyme built, not the catalytic competence of what is built.
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with a homozygous p.Tyr12Cys mutation in the epsilon subunit encoded by the nuclear gene ATP5E."
    explanation: Identifies the causal allele and gene in the index patient.
  - reference: PMID:20026007
    reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The subunit epsilon of mitochondrial ATP synthase is the only F1 subunit without a homolog in bacteria and chloroplasts and represents the least characterized F1 subunit of the mammalian enzyme."
    explanation: Establishes the structural singularity of the epsilon subunit that makes this lesion distinct from other F1 subunit defects.
  downstream:
  - target: Impaired F1 Assembly and Reduced Complex V Content
    description: >-
      The mutant epsilon subunit depresses biosynthesis of the enzyme, so less
      complex V is built.

- name: Impaired F1 Assembly and Reduced Complex V Content
  biological_scale: MOLECULAR
  description: >-
    The primary biochemical lesion is a shortage of assembled enzyme, not a broken
    enzyme. Mitochondrial content of the ATP synthase complex falls by 60-70
    percent in patient fibroblasts, matching the fall in activity; the complex
    that is present is of normal size and contains the mutant epsilon subunit, and
    it hydrolyses and synthesises normally. F1 and Fo subunits fall together, and
    the reduction of the assembled 600 kDa complex is not accompanied by F1
    subcomplexes — the enzyme fails to be built rather than falling apart after
    assembly. Silencing ATP5F1E in HEK293 cells reproduces this without any
    patient allele, confirming that reduced epsilon dosage alone is sufficient.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: proton-transporting ATP synthase complex assembly
    term:
      id: GO:0043461
      label: proton-transporting ATP synthase complex assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial ATP synthase complex
    term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
    modifier: DECREASED
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mitochondrial content of the ATP synthase complex was equally reduced, but its size was normal and it contained the mutated epsilon subunit."
    explanation: Establishes that the deficiency is of enzyme amount, with the assembled enzyme structurally normal and carrying the mutant subunit.
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicate an essential role of the epsilon subunit in the biosynthesis and assembly of the F1 part of the ATP synthase."
    explanation: The authors' conclusion assigning epsilon an assembly role rather than a catalytic one.
  - reference: PMID:20026007
    reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Silencing of the ATP5E gene in HEK293 cells resulted in downregulation of the activity and content of the mitochondrial ATP synthase complex and of ADP-stimulated respiration to approximately 40% of the control."
    explanation: Independent knockdown reproduces the reduced enzyme content and activity without a patient allele.
  - reference: PMID:24564666
    reference_title: "Nuclear genetic defects of mitochondrial ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The contents of both ATP synthase subunits and of fully assembled complex V were severely reduced."
    explanation: Independent restatement of the reduced content of assembled complex V; graded OTHER as a review summary.
  downstream:
  - target: Subunit c Accumulation in Insoluble Form
    description: >-
      With too little epsilon, subunit c is not incorporated into the rotor and
      accumulates instead.
  - target: Reduced Mitochondrial ATP Synthesis
    description: >-
      Fewer assembled enzymes means less ATP synthesised, even though each enzyme
      works normally.

- name: Subunit c Accumulation in Insoluble Form
  biological_scale: MOLECULAR
  description: >-
    The one asymmetry in the biochemistry, and the reason this lesion says
    something about enzyme biogenesis. Every investigated F1 and Fo subunit falls
    in proportion to the assembled complex except subunit c, which instead
    accumulates in a detergent-insoluble form. The same accumulation appears in
    ATP5F1E-silenced HEK293 cells, where subunit c is found in 200-400 kDa
    subcomplexes containing neither F1 nor other Fo subunits. This implicates the
    epsilon subunit in loading the hydrophobic c-ring onto the rotor, a role
    distinct from stabilising F1.
  biological_processes:
  - preferred_term: proton-transporting ATP synthase complex assembly
    term:
      id: GO:0043461
      label: proton-transporting ATP synthase complex assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A similar reduction was found in all investigated F1 and Fo subunits with the exception of Fo subunit c, which was found to accumulate in a detergent-insoluble form."
    explanation: The defining asymmetry — subunit c accumulates while every other subunit falls.
  - reference: PMID:20026007
    reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The subunit c was present in the full-size ATP synthase complex and in subcomplexes of 200-400 kDa that neither contained the F1 subunits, nor the Fo subunits."
    explanation: Resolves the accumulated subunit c into orphan subcomplexes in the knockdown model.
  - reference: PMID:20026007
    reference_title: "Knockdown of F1 epsilon subunit decreases mitochondrial content of ATP synthase and leads to accumulation of subunit c."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results indicate that the epsilon subunit is essential for the assembly of F1 and plays an important role in the incorporation of the hydrophobic subunit c into the F1-c oligomer rotor of the mitochondrial ATP synthase complex."
    explanation: States the c-ring loading role that this node asserts.

- name: Reduced Mitochondrial ATP Synthesis
  biological_scale: CELLULAR
  description: >-
    Oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis both fall
    by 60-70 percent in patient fibroblasts, in step with the loss of assembled
    enzyme. ADP-stimulated respiration is reduced and the mitochondrial membrane
    potential is raised under state-3 conditions, the pattern expected when the
    proton gradient is generated normally but cannot be discharged through a
    sufficient number of ATP synthases.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: proton motive force-driven mitochondrial ATP synthesis
    term:
      id: GO:0042776
      label: proton motive force-driven mitochondrial ATP synthesis
    modifier: DECREASED
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed 60-70% decrease in both oligomycin-sensitive ATPase activity and mitochondrial ATP synthesis."
    explanation: Quantifies the functional deficit in patient cells.
  - reference: PMID:24564666
    reference_title: "Nuclear genetic defects of mitochondrial ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the patient fibroblasts decreased activities of ATP synthase and ADP-stimulated respiration with increased mitochondrial membrane potential at state 3-ADP were found, indicating an insufficient capacity of ATP synthase."
    explanation: Adds the reduced ADP-stimulated respiration and the raised membrane potential; graded OTHER as a review summary of the index study.
  downstream:
  - target: Isolated Complex V Deficiency with Preserved Respiratory Chain
    description: >-
      The defect is confined to complex V; complexes I-IV are intact and in fact
      increased.
  - target: Lactic acidosis
    description: >-
      Insufficient oxidative ATP production shifts the cell towards glycolysis
      with lactate accumulation.

- name: Isolated Complex V Deficiency with Preserved Respiratory Chain
  biological_scale: CELLULAR
  description: >-
    This node exists to state the boundary of the entity. The ATP5F1E lesion is an
    ISOLATED complex V deficiency: the electron-transport complexes are not
    reduced, and in the index patient's fibroblasts they were increased, an
    apparently compensatory change that does not rescue the energetic defect. That
    is what separates MC5DN3 from the combined-OXPHOS presentations in which
    complex V deficiency is one component among several, and it is the biochemical
    signature that points a diagnostic workup at the nuclear ATP-synthase genes.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "So far, mitochondrial diseases caused by isolated disorders of the ATP synthase have been shown to result from mutations in mtDNA genes for the subunits ATP6 and ATP8 or in nuclear genes encoding the biogenesis factors TMEM70 and ATPAF2."
    explanation: Frames the entity as an isolated ATP synthase disorder and names the pre-existing causes it was added to; graded OTHER because this background sentence reports no experiment.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In support of these findings, fluorescence staining of OXPHOS proteins in fibroblasts from patient 2 revealed markedly decreased amounts of the ATPase marker ATP5F1A relative to controls"
    explanation: Independent confirmation of reduced ATP synthase amount in a second patient's fibroblasts.

phenotypes:
- name: Lactic acidosis
  category: Metabolism
  description: >-
    The presenting abnormality in all three patients, beginning in the neonatal
    period or infancy. In the index patient and in patient 3 the metabolic
    episodes were infection-triggered and resolved with age; in patient 2 they
    improved spontaneously.
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
    onset:
      onset_category: NEONATAL
  evidence:
  - reference: PMID:20566710
    reference_title: "Mitochondrial ATP synthase deficiency due to a mutation in the ATP5E gene for the F1 epsilon subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 22-year-old woman presented with neonatal onset, lactic acidosis, 3-methylglutaconic aciduria, mild mental retardation and developed peripheral neuropathy."
    explanation: Lactic acidosis from the neonatal period in the index patient.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 3, a 13-year-old girl, was evaluated for intellectual disability, gait ataxia, and peripheral neuropathy. During infancy, she manifested lactic acidosis with transient respiratory failure, developmental delay, and episodes of generalized tonic-clonic seizures."
    explanation: Infantile lactic acidosis in a second unrelated patient with the same genotype.

- name: 3-Methylglutaconic aciduria
  category: Metabolism
  description: >-
    Documented in the index patient. 3-methylglutaconic aciduria is the organic
    aciduria that flags nuclear ATP-synthase and phospholipid-remodelling defects,
    and it was the screening handle used to look for further ATP5E patients.

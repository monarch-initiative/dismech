name: Chorioamnionitis
creation_date: "2026-08-04T00:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: chorioamnionitis
  term:
    id: MONDO:0000409
    label: chorioamnionitis
description: >
  Chorioamnionitis is inflammation of the fetal membranes (chorion and amnion),
  in most cases provoked by ascending polymicrobial invasion of the amniotic
  cavity from the lower genital tract. It is simultaneously a clinical syndrome
  of the laboring patient, a histopathological lesion of the placenta, and a
  fetal exposure, and these three faces do not overlap neatly. Because the same
  neutrophilic lesion can be produced by microorganisms or, in the absence of
  demonstrable organisms, by endogenous danger signals, the entity is best
  modeled as a shared inflammatory final common pathway rather than as a single
  infection. It is a leading antecedent of preterm labor, preterm prelabor
  rupture of membranes, early-onset neonatal sepsis, and the fetal inflammatory
  response syndrome that links intrauterine inflammation to periventricular
  leukomalacia, cerebral palsy, and chronic lung disease of prematurity.
synonyms:
- intraamniotic infection
- intra-amniotic infection
- intrauterine inflammation or infection or both
- Triple I
- amnionitis
- fetal membrane inflammation
parents:
- Bacterial infectious disease
- Inflammatory disease
- Disorder of extraembryonic membrane
- Obstetric infection

has_subtypes:
- name: Clinical
  display_name: Clinical chorioamnionitis (intraamniotic infection, Triple I)
  description: >
    The intrapartum clinical syndrome, suspected when maternal fever is
    accompanied by additional maternal or fetal signs of inflammation. The 2015
    NICHD workshop argued this label had been stretched across a heterogeneous
    set of conditions and proposed the descriptive replacement term Triple I,
    stressing that isolated maternal fever is not the same thing as
    chorioamnionitis.
  evidence:
  - reference: PMID:26855098
    reference_title: "Evaluation and Management of Women and Newborns With a Maternal Diagnosis of Chorioamnionitis: Summary of a Workshop."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is particularly important to recognize that an isolated maternal fever
      is not synonymous with chorioamnionitis.
    explanation: >-
      NICHD expert-panel workshop statement establishing that the clinical
      subtype is a defined syndrome rather than fever alone. Evidence source is
      OTHER because this is a consensus workshop summary rather than primary
      data.
  - reference: PMID:26855098
    reference_title: "Evaluation and Management of Women and Newborns With a Maternal Diagnosis of Chorioamnionitis: Summary of a Workshop."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The panel noted that the term chorioamnionitis has been used to label a
      heterogeneous array of conditions characterized by infection and
      inflammation or both with a consequent great variation in clinical
      practice for mothers and their newborns.
    explanation: >-
      Documents the heterogeneity that motivates splitting the clinical syndrome
      from the histologic lesion in this entry.

- name: Histologic Acute
  display_name: Acute histologic chorioamnionitis
  description: >
    The placental-pathology diagnosis: diffuse neutrophilic infiltration of the
    chorioamniotic membranes, staged and graded by the Amsterdam criteria. It is
    far more common than the clinical syndrome and its frequency rises steeply as
    gestational age at delivery falls. It is subdivided into the maternal
    inflammatory response (maternal neutrophils in chorion and amnion) and the
    fetal inflammatory response (funisitis and chorionic vasculitis).
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute inflammatory lesions of the placenta consist of diffuse infiltration
      of neutrophils at different sites in the organ.
    explanation: >-
      Defines the histologic subtype as a neutrophil-infiltration lesion of the
      placenta.
  - reference: PMID:27223167
    reference_title: "Sampling and Definitions of Placental Lesions: Amsterdam Placental Workshop Group Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The terminology and microscopic descriptions for maternal vascular
      malperfusion, fetal vascular malperfusion, delayed villous maturation,
      patterns of ascending intrauterine infection, and villitis of unknown
      etiology were agreed upon.
    explanation: >-
      Amsterdam Placental Workshop Group consensus supplying the standardized
      diagnostic criteria under which this subtype is reported.

- name: Chronic
  display_name: Chronic chorioamnionitis
  description: >
    A mechanistically distinct lesion sharing the name: lymphohistiocytic rather
    than neutrophilic, characterized by maternal CD8+ T cell infiltration of the
    chorioamniotic membranes and attributed to maternal anti-fetal rejection
    rather than to infection. It is the most common placental lesion of late
    spontaneous preterm birth. It is curated here so that the acute infectious
    entity is not silently conflated with it.
  evidence:
  - reference: PMID:26428503
    reference_title: "Chronic inflammation of the placenta: definition, classification, pathogenesis, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic chorioamnionitis is the most common lesion in late spontaneous
      preterm birth and is characterized by the infiltration of maternal CD8+ T
      cells into the chorioamniotic membranes.
    explanation: >-
      Establishes the chronic subtype as a distinct, T-cell-mediated lesion of
      the same anatomical site.

infectious_agent:
- name: Ureaplasma urealyticum
  infectious_agent_term:
    preferred_term: Ureaplasma urealyticum
    term:
      id: NCBITaxon:2130
      label: Ureaplasma urealyticum
  description: >
    Genital mycoplasma that is the most frequently recovered organism from the
    amniotic cavity in intraamniotic infection. Despite a reputation as a
    low-virulence commensal, it provokes a substantial host inflammatory
    response when it is the sole isolate.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common microorganisms are Ureaplasma species, and polymicrobial
      infections occur in 70% of cases.
    explanation: >-
      Identifies Ureaplasma as the predominant isolate and documents the
      polymicrobial character of the infection.
  - reference: PMID:9822511
    reference_title: "Microbial invasion of the amniotic cavity with Ureaplasma urealyticum is associated with a robust host response in fetal, amniotic, and maternal compartments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of a positive amniotic fluid culture in which the only
      microbial isolate was U urealyticum was 21% (25/120) and that of positive
      cultures with other or mixed microorganisms was 9% (11/120).
    explanation: >-
      Human amniocentesis series in preterm prelabor rupture of membranes
      showing U. urealyticum as the single most frequently isolated organism,
      more common than all other organisms combined.

- name: Ureaplasma parvum
  infectious_agent_term:
    preferred_term: Ureaplasma parvum
    term:
      id: NCBITaxon:134821
      label: Ureaplasma parvum
  description: >
    The other genital Ureaplasma species recovered from amniotic fluid, commonly
    detected by molecular rather than culture methods.

- name: Mycoplasma hominis
  infectious_agent_term:
    preferred_term: Mycoplasma hominis
    term:
      id: NCBITaxon:2098
      label: Metamycoplasma hominis
  description: >
    Frequent co-isolate with Ureaplasma species; concurrent detection is
    associated with true intra-amniotic infection rather than sterile
    inflammation. The NCBI Taxonomy label is the reassigned genus name
    Metamycoplasma hominis; the clinically used name is retained in
    preferred_term.
  evidence:
  - reference: PMID:34238107
    reference_title: "Intra-amniotic infection and sterile intra-amniotic inflammation in women with preterm labor with intact membranes are associated with a higher rate of Ureaplasma species DNA presence in the cervical fluid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concurrent presence of Ureaplasma spp. and Mycoplasma hominis DNA was
      higher in women with intra-amniotic infection (42% (5/12)) than women with
      sterile intra-amniotic inflammation (7% (2/29))
    explanation: >-
      Human cohort of preterm labor showing co-detection of M. hominis marks the
      infectious rather than the sterile form.

- name: Streptococcus agalactiae
  infectious_agent_term:
    preferred_term: Streptococcus agalactiae
    term:
      id: NCBITaxon:1311
      label: Streptococcus agalactiae
  description: >
    Group B Streptococcus. A less frequent cause of intraamniotic infection than
    the genital mycoplasmas but a disproportionately important one, because it is
    a leading cause of early-onset neonatal sepsis and is the target of
    intrapartum antibiotic prophylaxis.

- name: Escherichia coli
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  description: >
    Gram-negative organism whose lipopolysaccharide is the canonical TLR4 ligand
    in this pathway; a major cause of early-onset sepsis in preterm neonates.

- name: Fusobacterium nucleatum
  infectious_agent_term:
    preferred_term: Fusobacterium nucleatum
    term:
      id: NCBITaxon:851
      label: Fusobacterium nucleatum
  description: >
    Anaerobe of oral origin, notable because it reaches the amniotic cavity
    hematogenously rather than by ascent, providing the mechanistic link between
    periodontal disease and intrauterine infection.

pathophysiology:
- name: Vaginal Dysbiosis and Cervical Barrier Breach
  biological_scale: ORGANISM
  description: >
    Loss of Lactobacillus dominance and overgrowth of anaerobes associated with
    bacterial vaginosis lowers the chemical and ecological barrier at the cervix,
    permitting organisms of the lower genital tract to reach the choriodecidual
    interface. Instrumentation of the cervix during labor, prolonged rupture of
    membranes, and cerclage act on the same step by breaching the mechanical
    barrier.
  role: trigger
  downstream:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    causal_link_type: DIRECT
    description: >
      Breach of the cervical barrier permits ascent of lower genital tract
      organisms into the choriodecidual space and amniotic cavity.

- name: Ascending Microbial Invasion of the Amniotic Cavity
  biological_scale: TISSUE
  description: >
    Organisms colonize the choriodecidual space and then cross into the amniotic
    fluid. The infection is characteristically polymicrobial and dominated by
    genital mycoplasmas, which is why culture-based diagnosis systematically
    underestimates it. Invasion is the step that distinguishes true
    intraamniotic infection from sterile intra-amniotic inflammation.
  locations:
  - preferred_term: amniotic fluid
    term:
      id: UBERON:0000173
      label: amniotic fluid
  - preferred_term: fetal membrane
    term:
      id: UBERON:0005630
      label: fetal membrane
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common microorganisms are Ureaplasma species, and polymicrobial
      infections occur in 70% of cases.
    explanation: >-
      Characterizes the microbiology of the invading flora at this node.
  - reference: PMID:28742677
    reference_title: "Committee Opinion No. 712: Intrapartum Management of Intraamniotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intraamniotic infection, also known as chorioamnionitis, is an infection
      with resultant inflammation of any combination of the amniotic fluid,
      placenta, fetus, fetal membranes, or decidua.
    explanation: >-
      Professional-society definition establishing the anatomical compartments
      invaded at this node.
  - reference: PMID:34238107
    reference_title: "Intra-amniotic infection and sterile intra-amniotic inflammation in women with preterm labor with intact membranes are associated with a higher rate of Ureaplasma species DNA presence in the cervical fluid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-amniotic infection and sterile inflammation were identified in 14%
      (16/115) and 25% (29/115) of the women, respectively.
    explanation: >-
      Quantifies, in a human preterm-labor cohort, how often microbial invasion
      is actually demonstrable versus inflammation without organisms, supporting
      the split between this node and the sterile arm.
  downstream:
  - target: Pattern Recognition Receptor Activation at the Maternal-Fetal Interface
    causal_link_type: DIRECT
    description: >
      Microbial products including lipopolysaccharide and mycoplasmal
      lipoproteins engage innate pattern recognition receptors on membrane and
      decidual cells.

- name: Alarmin Release and Sterile Intra-amniotic Inflammation
  biological_scale: MOLECULAR
  description: >
    Endogenous danger signals released by cellular stress or cell death in the
    membranes engage the same innate receptors as microbial products, producing
    an inflammatory lesion indistinguishable from the infectious one in the
    absence of demonstrable organisms. This arm is not a curiosity: in cohorts of
    preterm labor it is detected more often than microbial invasion itself, and
    it is the reason chorioamnionitis is modeled here as an inflammatory rather
    than a purely infectious final common pathway.
  role: trigger
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Danger signals that are released during the course of cellular stress or
      cell death can also induce the release of neutrophil chemokines.
    explanation: >-
      Establishes that endogenous alarmins drive the same chemokine output as
      microbial invasion.
  - reference: PMID:34238107
    reference_title: "Intra-amniotic infection and sterile intra-amniotic inflammation in women with preterm labor with intact membranes are associated with a higher rate of Ureaplasma species DNA presence in the cervical fluid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-amniotic infection and sterile inflammation were identified in 14%
      (16/115) and 25% (29/115) of the women, respectively.
    explanation: >-
      Human cohort in which sterile intra-amniotic inflammation was nearly twice
      as frequent as demonstrable intra-amniotic infection.
  downstream:
  - target: Pattern Recognition Receptor Activation at the Maternal-Fetal Interface
    causal_link_type: DIRECT
    description: >
      Alarmins converge on the same innate receptor machinery engaged by
      microbial ligands.

- name: Pattern Recognition Receptor Activation at the Maternal-Fetal Interface
  biological_scale: MOLECULAR
  description: >
    Toll-like receptors on amnion epithelium, chorionic trophoblast, decidual
    stromal cells, and resident macrophages read both microbial products and
    endogenous danger signals. TLR2 and TLR4 expression in the chorioamniotic
    membranes is increased in the presence of histologic chorioamnionitis. This
    node is the convergence point that makes the infectious and sterile arms
    mechanistically indistinguishable downstream.
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  - preferred_term: response to lipopolysaccharide
    term:
      id: GO:0032496
      label: response to lipopolysaccharide
    modifier: INCREASED
  cell_types:
  - preferred_term: chorionic trophoblast cell
    term:
      id: CL:0011101
      label: chorionic trophoblast cell
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  evidence:
  - reference: PMID:15507964
    reference_title: "Toll-like receptor-2 and -4 in the chorioamniotic membranes in spontaneous labor at term and in preterm parturition that are associated with chorioamnionitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous labor at term and preterm delivery with histologic
      chorioamnionitis, regardless of the membrane status (intact or ruptured),
      are associated with an increased expression of Toll-like receptor-2 and -4
      in the chorioamniotic membranes.
    explanation: >-
      Human membrane tissue study demonstrating upregulated TLR2 and TLR4 in the
      chorioamniotic membranes of cases with histologic chorioamnionitis,
      directly supporting this node.
  downstream:
  - target: Proinflammatory Cytokine and Chemokine Production
    causal_link_type: DIRECT
    description: >
      Toll-like receptor engagement is signal 1, the priming step: it drives
      NF-kB-dependent transcription of the inflammatory cytokine and chemokine
      program, including inactive pro-IL-1 beta.
  - target: NLRP3 Inflammasome Activation and Pyroptosis
    causal_link_type: DIRECT
    description: >
      Priming also licenses the cell to assemble the NLRP3 inflammasome, which
      when triggered constitutes signal 2 and converts the primed pro-IL-1 beta
      into its mature form.

- name: NLRP3 Inflammasome Activation and Pyroptosis
  biological_scale: CELLULAR
  description: >
    Assembly of the NLRP3 inflammasome activates caspase-1, which both matures
    pro-IL-1 beta and IL-18 and cleaves gasdermin D. Gasdermin D pores drive
    pyroptosis of amnion and decidual cells, releasing further alarmins and
    closing a self-amplifying loop. This is the step that converts a local
    signal into a syndrome: transcription alone yields inactive pro-IL-1 beta,
    so without this node the mechanism by which the cytokine becomes
    biologically active is unexplained. The node is engaged in both the
    infectious and the sterile arm, which is part of why the two are
    indistinguishable downstream.
  biological_processes:
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  cellular_components:
  - preferred_term: NLRP3 inflammasome complex
    term:
      id: GO:0072559
      label: NLRP3 inflammasome complex
  evidence:
  - reference: PMID:31461796
    reference_title: "Gasdermin D: Evidence of pyroptosis in spontaneous preterm labor with sterile intra-amniotic inflammation or intra-amniotic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gasdermin D was detected in the amniotic fluid and chorioamniotic
      membranes from women who underwent spontaneous preterm labor/birth with
      either sterile intra-amniotic inflammation or intra-amniotic infection,
      but was rarely detected in those without intra-amniotic inflammation.
    explanation: >-
      Human amniotic fluid and membrane study showing the pyroptosis effector
      gasdermin D is present specifically when intra-amniotic inflammation is
      present, and in both the sterile and the infectious arm.
  - reference: PMID:30596885
    reference_title: "Inhibition of the NLRP3 inflammasome can prevent sterile intra-amniotic inflammation, preterm labor/birth, and adverse neonatal outcomes†."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Herein, we investigated whether the alarmin S100B could induce sterile
      intra-amniotic inflammation by activating the NLRP3 inflammasome, and
      whether the inhibition of this pathway could prevent preterm labor/birth
      and adverse neonatal outcomes.
    explanation: >-
      Murine intra-amniotic model testing the NLRP3 inflammasome as the
      mechanistic link from alarmin to preterm birth. Recorded as
      MODEL_ORGANISM because the interventional causal step is demonstrated in
      mice, not in humans.
  downstream:
  - target: Proinflammatory Cytokine and Chemokine Production
    causal_link_type: DIRECT
    description: >
      Caspase-1 maturation of IL-1 beta supplies the biologically active
      cytokine that drives the downstream chemotactic and uterotonic arms.
  - target: Alarmin Release and Sterile Intra-amniotic Inflammation
    causal_link_type: DIRECT
    description: >
      Pyroptotic lysis of amnion and decidual cells releases further
      intracellular alarmins, feeding back onto the sterile trigger node.

- name: Proinflammatory Cytokine and Chemokine Production
  biological_scale: CELLULAR
  description: >
    Innate receptor signaling drives production of IL-1 beta, IL-6, TNF, and the
    neutrophil chemokine IL-8 within the membranes and decidua. Amniotic fluid
    IL-6 rises accordingly and is the operational marker of intra-amniotic
    inflammation. This node is the amplification step that converts a local
    signal into a syndrome, and it is the branch point from which the
    chemotactic, uterotonic, and matrix-degrading arms diverge.
  biological_processes:
  - preferred_term: cytokine production involved in inflammatory response
    term:
      id: GO:0002534
      label: cytokine production involved in inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      chemokines (such as interleukin-8 and granulocyte chemotactic protein)
      establish a gradient that favors the migration of neutrophils from the
      maternal or fetal circulation into the chorioamniotic membranes or
      umbilical cord, respectively
    explanation: >-
      Identifies the chemokine output of this node and the gradient it
      establishes.
  downstream:
  - target: Neutrophil Chemotaxis into the Chorioamniotic Membranes
    causal_link_type: DIRECT
    description: >
      IL-8 and related chemokines establish the gradient that recruits
      neutrophils.
  - target: Prostaglandin Synthesis and Myometrial Activation
    causal_link_type: DIRECT
    description: >
      IL-1 beta and TNF upregulate prostaglandin synthesis and myometrial
      activation.
    hypothesis_groups:
    - preterm_uterotonic_activation
  - target: MMP-Mediated Chorioamniotic Matrix Degradation
    causal_link_type: DIRECT
    description: >
      Cytokine signaling induces matrix metalloproteinases that degrade the
      membrane collagen scaffold.
  - target: Reduced Myometrial Contractility at Term
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      At term, the same inflammatory mediator load is associated with decreased
      uterine activity and dysfunctional labor rather than with effective
      contraction. The intermediates that determine the direction of this effect
      are not established.
    hypothesis_groups:
    - term_myometrial_suppression

- name: Neutrophil Chemotaxis into the Chorioamniotic Membranes
  biological_scale: CELLULAR
  description: >
    Neutrophils migrate along the chemokine gradient toward the amniotic cavity.
    Crucially the traffic has two separate sources: maternal neutrophils enter
    from decidual vessels through chorion into amnion, while fetal neutrophils
    later cross chorionic plate and umbilical vessels. This directional
    two-source migration is what the histologic lesion actually consists of.
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      chemokines (such as interleukin-8 and granulocyte chemotactic protein)
      establish a gradient that favors the migration of neutrophils from the
      maternal or fetal circulation into the chorioamniotic membranes or
      umbilical cord, respectively
    explanation: >-
      Describes the two-source neutrophil migration that constitutes this node.
  downstream:
  - target: Maternal Inflammatory Response and Acute Chorioamnionitis
    causal_link_type: DIRECT
    description: >
      Maternal neutrophil infiltration of chorion and amnion produces the
      maternal inflammatory response lesion.
  - target: Fetal Inflammatory Response with Funisitis and Chorionic Vasculitis
    causal_link_type: DIRECT
    description: >
      Fetal neutrophil migration into umbilical and chorionic plate vessels
      produces the fetal inflammatory response lesion.

- name: Maternal Inflammatory Response and Acute Chorioamnionitis
  biological_scale: TISSUE
  description: >
    Diffuse maternal neutrophil infiltration of the chorioamniotic membranes.
    This is the maternal arm of the histologic lesion and the one that gives the
    disease its name. Its frequency is steeply gestational-age dependent, which
    is the single most important epidemiological fact about the lesion.
  locations:
  - preferred_term: fetal membrane
    term:
      id: UBERON:0005630
      label: fetal membrane
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While acute chorioamnionitis is evidence of a maternal host response,
      funisitis and chorionic vasculitis represent fetal inflammatory responses.
    explanation: >-
      Establishes that acute chorioamnionitis proper is the maternal arm of the
      response, separating it from the fetal arm modeled in the adjacent node.

- name: Fetal Inflammatory Response with Funisitis and Chorionic Vasculitis
  biological_scale: TISSUE
  description: >
    Fetal neutrophils migrate into the walls of the umbilical vessels and
    chorionic plate vessels. Unlike the maternal lesion this represents the
    fetus's own response, and it is the histologic hallmark of systemic fetal
    inflammation. It predicts neonatal outcome considerably better than the
    maternal lesion does.
  locations:
  - preferred_term: umbilical cord
    term:
      id: UBERON:0002331
      label: umbilical cord
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Funisitis and chorionic vasculitis are the hallmarks of the fetal
      inflammatory response syndrome, a condition characterized by an elevation
      in the fetal plasma concentration of interleukin-6
    explanation: >-
      Links this histologic node to the systemic fetal syndrome it marks.
  - reference: PMID:33164775
    reference_title: "The fetal inflammatory response syndrome: the origins of a concept, pathophysiology, diagnosis, and obstetrical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathologic evidence of a systemic fetal inflammatory response indicates
      the presence of funisitis or chorionic vasculitis.
    explanation: >-
      Confirms funisitis and chorionic vasculitis as the pathological criteria
      for the fetal systemic response.
  downstream:
  - target: Fetal Inflammatory Response Syndrome
    causal_link_type: DIRECT
    description: >
      The local fetal vascular lesion is the histologic counterpart of the
      systemic fetal inflammatory syndrome.

- name: Prostaglandin Synthesis and Myometrial Activation
  biological_scale: MOLECULAR
  description: >
    Inflammatory cytokines upregulate prostaglandin synthesis while the enzyme
    that normally degrades prostaglandins is downregulated, and gap-junction and
    oxytocin-receptor expression rise. The quiescent myometrium is converted into
    a contractile syncytium, driving labor at a gestational age at which it
    should not be occurring.
  biological_processes:
  - preferred_term: prostaglandin biosynthetic process
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
    modifier: INCREASED
  notes: >-
    GO:0007567 parturition was deliberately not bound here: it is a
    whole-organism process and this node is tagged MOLECULAR. The
    myometrial-activation semantics are carried by the node name, the
    description, and the downstream edge to Preterm Labor and Birth.
  downstream:
  - target: Preterm Labor and Birth
    causal_link_type: DIRECT
    description: >
      Prostaglandin-driven myometrial activation produces preterm contractions
      and delivery.
    hypothesis_groups:
    - preterm_uterotonic_activation

- name: MMP-Mediated Chorioamniotic Matrix Degradation
  biological_scale: MOLECULAR
  description: >
    Neutrophil-derived matrix metalloproteinase-8 (neutrophil collagenase) and
    MMP-9, together with elastase, degrade the collagen scaffold of the
    amniochorion while tissue inhibitors of metalloproteinases fall. Amniotic
    fluid MMP-8 is correspondingly a sensitive marker of intra-amniotic
    infection.
  evidence:
  - reference: PMID:11717662
    reference_title: "Amniotic fluid matrix metalloproteinase-8 indicates intra-amniotic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that matrix metalloproteinase-8 is highly correlated
      with intra-amniotic infection
    explanation: >-
      Human case-control study of amniotic fluid establishing MMP-8 as the
      protease signature of this node.
  downstream:
  - target: Membrane Weakening and Preterm Prelabor Rupture of Membranes
    causal_link_type: DIRECT
    description: >
      Collagen degradation reduces the tensile strength of the fetal membranes.

- name: Membrane Weakening and Preterm Prelabor Rupture of Membranes
  biological_scale: TISSUE
  description: >
    Loss of tensile strength in the amniochorion leads to rupture before the
    onset of labor. This closes a vicious circle: rupture removes the remaining
    physical barrier and permits further ascending colonization, so preterm
    prelabor rupture of membranes is both a consequence and a cause of
    intra-amniotic infection.
  locations:
  - preferred_term: fetal membrane
    term:
      id: UBERON:0005630
      label: fetal membrane
  downstream:
  - target: Preterm Labor and Birth
    causal_link_type: DIRECT
    description: >
      Preterm prelabor rupture of membranes precipitates preterm delivery.
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    causal_link_type: DIRECT
    description: >
      Rupture removes the barrier to further ascending colonization, feeding
      back onto the invasion node.

- name: Preterm Labor and Birth
  biological_scale: ORGANISM
  description: >
    Delivery before 37 completed weeks. Intrauterine infection and inflammation
    account for a substantial share of spontaneous preterm births, and the
    proportion rises as gestational age at delivery falls.

- name: Reduced Myometrial Contractility at Term
  biological_scale: TISSUE
  description: >
    At term the inflammatory milieu is associated with the opposite uterine
    behavior from the preterm case: decreased uterine activity, failure to
    progress in labor, higher cesarean rates, and postpartum uterine atony with
    hemorrhage. This is curated as a distinct node rather than as a
    sign-reversing edge on the uterotonic arm, because the mechanisms are
    separated by gestational age and receptor context rather than contradicting
    one another.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical chorioamnionitis is associated with decreased uterine activity,
      failure to progress in labor, and postpartum hemorrhage
    explanation: >-
      Documents the term-gestation myometrial phenotype that this node
      represents.
  - reference: PMID:28742677
    reference_title: "Committee Opinion No. 712: Intrapartum Management of Intraamniotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maternal morbidity from intraamniotic infection also can be significant,
      and may include dysfunctional labor requiring increased intervention,
      postpartum uterine atony with hemorrhage, endometritis, peritonitis,
      sepsis, adult respiratory distress syndrome and, rarely, death.
    explanation: >-
      Professional-society statement independently documenting dysfunctional
      labor and postpartum atony as consequences of this node.

- name: Fetal Inflammatory Response Syndrome
  biological_scale: ORGANISM
  description: >
    A systemic inflammatory response mounted by the fetus itself, defined
    operationally by elevated fetal or cord plasma IL-6 and pathologically by
    funisitis or chorionic vasculitis. It is the fetal counterpart of the adult
    systemic inflammatory response syndrome, it is multi-organ, and it is the
    mechanistic bridge between an obstetric infection and lifelong
    neurodevelopmental and respiratory disability.
  evidence:
  - reference: PMID:33164775
    reference_title: "The fetal inflammatory response syndrome: the origins of a concept, pathophysiology, diagnosis, and obstetrical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FIRS can be diagnosed by an increased concentration of umbilical cord
      plasma or serum acute phase reactants such as C-reactive protein or
      cytokines (e.g., interleukin-6).
    explanation: >-
      Defines the biochemical criterion for this node.
  - reference: PMID:33164775
    reference_title: "The fetal inflammatory response syndrome: the origins of a concept, pathophysiology, diagnosis, and obstetrical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neonates born with FIRS have a higher rate of complications, such as
      early-onset neonatal sepsis, intraventricular hemorrhage, periventricular
      leukomalacia, and death, than those born without FIRS.
    explanation: >-
      Establishes the downstream neonatal consequences modeled by the edges from
      this node.
  downstream:
  - target: Microglial Activation and Preterm White Matter Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Circulating fetal cytokines activate microglia and injure the vulnerable
      pre-oligodendrocyte population of the preterm white matter.
    intermediate_mechanisms:
    - Systemic fetal cytokinemia
    - Blood-brain barrier permeability change
  - target: Fetal Pulmonary Inflammation and Arrested Alveolarization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Aspirated infected amniotic fluid and circulating cytokines inflame the
      fetal lung and disturb alveolar and microvascular development.
    intermediate_mechanisms:
    - Fetal pneumonitis
  - target: Early-Onset Neonatal Sepsis
    causal_link_type: DIRECT
    description: >
      Fetal systemic inflammation and microbial exposure predispose to
      early-onset invasive neonatal infection.

- name: Microglial Activation and Preterm White Matter Injury
  biological_scale: CELLULAR
  description: >
    Fetal systemic inflammation activates microglia; pre-oligodendrocytes, which
    are exquisitely vulnerable in the 23 to 32 week window, die by oxidative and
    excitotoxic injury and myelination fails. This is the cellular substrate of
    periventricular leukomalacia and of the cerebral palsy that follows.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:10989405
    reference_title: "Chorioamnionitis as a risk factor for cerebral palsy: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a random effects model, clinical chorioamnionitis was significantly
      associated with both cerebral palsy (RR, 1.9; 95% CI, 1.4-2.5) and cPVL
      (RR, 3.0; 95% CI, 2.2-4.0) in preterm infants.
    explanation: >-
      Meta-analysis quantifying the association of chorioamnionitis with cystic
      periventricular leukomalacia and cerebral palsy, the clinical readouts of
      this node.
  - reference: PMID:33164775
    reference_title: "The fetal inflammatory response syndrome: the origins of a concept, pathophysiology, diagnosis, and obstetrical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Survivors are at risk for long-term sequelae that may include
      bronchopulmonary dysplasia, neurodevelopmental disorders, such as cerebral
      palsy, retinopathy of prematurity, and sensorineuronal hearing loss.
    explanation: >-
      Links fetal systemic inflammation to the long-term neurodevelopmental
      outcomes this node produces.

- name: Fetal Pulmonary Inflammation and Arrested Alveolarization
  biological_scale: TISSUE
  description: >
    Fetal lung exposure to infected amniotic fluid and inflammatory cytokines
    produces pneumonitis and a dissociation between functional and structural
    maturation: surfactant production is induced while alveolarization and
    microvascular development are suppressed, the arrested-development phenotype
    underlying bronchopulmonary dysplasia. The strength of this association in
    humans is genuinely contested, and the entry records that dispute rather than
    smoothing it over.
  evidence:
  - reference: PMID:21697236
    reference_title: "Chorioamnionitis as a risk factor for bronchopulmonary dysplasia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled unadjusted OR showed that CA was significantly associated with
      BPD (OR 1.89, 95% CI 1.56 to 2.3).
    explanation: >-
      Meta-analysis of 59 human studies quantifying the association with
      bronchopulmonary dysplasia.
  - reference: PMID:21697236
    reference_title: "Chorioamnionitis as a risk factor for bronchopulmonary dysplasia: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite a large body of evidence, CA cannot be definitively considered a
      risk factor for BPD.
    explanation: >-
      The same meta-analysis found strong evidence of publication bias and
      declined to call the association definitive. Recorded as PARTIAL so the
      entry does not overstate this edge.

- name: Early-Onset Neonatal Sepsis
  biological_scale: ORGANISM
  description: >
    Invasive neonatal infection within the first 72 hours of life. Notably, the
    rate of culture-confirmed neonatal bacteremia after clinical chorioamnionitis
    is low in absolute terms even though the relative risk is high, which is the
    tension underlying the modern shift from treating every exposed newborn to
    risk-stratified evaluation.
  evidence:
  - reference: PMID:33957655
    reference_title: "Chorioamnionitis and Risk for Maternal and Neonatal Sepsis: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both histologic and clinical chorioamnionitis were associated with early-
      and late-onset sepsis in neonates.
    explanation: >-
      Systematic review and meta-analysis of 103 human studies supporting this
      node for both the histologic and clinical subtypes.
  - reference: PMID:28742677
    reference_title: "Committee Opinion No. 712: Intrapartum Management of Intraamniotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intraamniotic infection can be associated with acute neonatal morbidity,
      including neonatal pneumonia, meningitis, sepsis, and death.
    explanation: >-
      Professional-society statement of the acute neonatal infectious outcomes
      at this node.
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The fetal attack rate is low, and the rate of positive neonatal blood
      cultures ranges between 0.2% and 4%.
    explanation: >-
      Qualifies the absolute risk at this node, which is the basis for
      risk-stratified rather than universal neonatal antibiotic treatment.

- name: Chronic Chorioamnionitis and Maternal Anti-Fetal Rejection
  biological_scale: TISSUE
  description: >
    A separate, non-neutrophilic arm that shares the anatomical site and the
    name. Maternal CD8+ T cells infiltrate the chorioamniotic membranes and can
    induce trophoblast apoptosis, in a process framed as rejection of the fetal
    semiallograft rather than as infection. It is the most common placental
    lesion in late spontaneous preterm birth.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  locations:
  - preferred_term: fetal membrane
    term:
      id: UBERON:0005630
      label: fetal membrane
  evidence:
  - reference: PMID:26428503
    reference_title: "Chronic inflammation of the placenta: definition, classification, pathogenesis, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These cytotoxic T cells can induce trophoblast apoptosis and damage the
      fetal membranes.
    explanation: >-
      Describes the effector mechanism of the chronic, immune-mediated arm.
  downstream:
  - target: Preterm Labor and Birth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Chronic chorioamnionitis is the most common placental lesion of late
      spontaneous preterm birth, though the intermediate steps from T-cell
      infiltration to the onset of labor are not established.

mechanistic_hypotheses:
- hypothesis_group_id: preterm_uterotonic_activation
  hypothesis_label: Inflammation-driven uterotonic activation causing preterm labor
  status: CANONICAL
  description: >
    The canonical model: inflammatory cytokines raise prostaglandin synthesis and
    myometrial gap-junction and oxytocin-receptor expression, converting the
    quiescent preterm uterus into a contractile organ and precipitating preterm
    labor.

- hypothesis_group_id: term_myometrial_suppression
  hypothesis_label: Inflammation-associated suppression of myometrial contractility at term
  status: EMERGING
  description: >
    The apparently contradictory observation that at term the same inflammatory
    setting is associated with decreased uterine activity, dysfunctional labor,
    and postpartum atony rather than with effective contraction. Curated as a
    separate hypothesis group rather than as a sign-reversal on the preterm edge,
    because the two are separated by gestational age and receptor context; the
    determinants of the direction of effect are not established.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical chorioamnionitis is associated with decreased uterine activity,
      failure to progress in labor, and postpartum hemorrhage
    explanation: >-
      Documents the term-gestation direction of effect that motivates a separate
      hypothesis group.


histopathology:
- name: Acute Chorioamnionitis, Funisitis and Chorionic Vasculitis
  description: >
    The defining acute inflammatory lesions of the placenta: diffuse
    neutrophilic infiltration at different sites in the organ. Site determines
    whose response it is, which is the whole diagnostic point. Neutrophils in
    chorion and amnion are maternal; neutrophils in the umbilical cord
    (funisitis) and chorionic plate vessels (chorionic vasculitis) are fetal.
    Severity progresses from subchorionitis through chorioamnionitis to
    necrotizing chorioamnionitis, and in the fetal compartment from umbilical
    phlebitis through arteritis to necrotizing funisitis.
  diagnostic: true
  subtype: Histologic Acute
  finding_term:
    preferred_term: Acute histologic chorioamnionitis
    term:
      id: NCIT:C111944
      label: Histologic Chorioamnionitis
  notes: >-
    Only the chorioamnionitis component is bindable. NCIT does have
    NCIT:C97077 Funisitis and NCIT:C117324 Fetal Chorionic Vasculitis, but both
    sit under NCIT:C2991 Disease or Disorder rather than under
    NCIT:C83490 Histopathology Result, so neither is reachable from the
    HistopathologyFindingTerm enum roots and neither can be bound here. That is
    an upstream NCIT placement gap, not a curation choice.
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These lesions include acute chorioamnionitis, funisitis, and chorionic
      vasculitis and represent a host response (maternal or fetal) to a
      chemotactic gradient in the amniotic cavity.
    explanation: >-
      Enumerates the acute placental lesions and frames them as host responses
      to the amniotic chemotactic gradient.
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While acute chorioamnionitis is evidence of a maternal host response,
      funisitis and chorionic vasculitis represent fetal inflammatory responses.
    explanation: >-
      Establishes the maternal versus fetal attribution that the staging system
      formalizes.

stages:
- name: Maternal Inflammatory Response
  description: >
    The maternal arm of the acute lesion, corresponding to the pathophysiology
    node Maternal Inflammatory Response and Acute Chorioamnionitis, and to the
    Histologic Acute subtype. It is staged by how far maternal neutrophils have
    advanced from the decidual side toward the amniotic cavity, with a separate
    two-tier grade for severity. This is the more reproducible of the two axes.
  substages:
  - name: MIR Stage 1
    description: >
      Acute subchorionitis or subchorionic chorionitis: maternal neutrophils
      confined to the subchorionic fibrin and the chorionic plate, the earliest
      recognizable maternal response.
  - name: MIR Stage 2
    description: >
      Acute chorioamnionitis proper: neutrophils have advanced through the
      chorionic connective tissue and into the amnion. This is the stage the
      unqualified term chorioamnionitis usually denotes.
  - name: MIR Stage 3
    description: >
      Necrotizing chorioamnionitis: amnionic epithelial necrosis, basement
      membrane thickening, and karyorrhectic neutrophil debris, indicating a
      prolonged rather than merely severe process.
  evidence:
  - reference: PMID:14708737
    reference_title: "Amniotic infection syndrome: nosology and reproducibility of placental reaction patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Grading and staging of maternal and fetal inflammatory responses was found
      to be more reproducible using a two- versus three-tiered grading system
      than a three- versus five-tiered staging system (overall agreement 81% vs.
      71%).
    explanation: >-
      Society for Pediatric Pathology reproducibility study establishing that
      the maternal and fetal inflammatory responses are separately graded and
      staged, and quantifying observer agreement for each scheme.
  notes: >-
    The stage boundaries are carried as substage descriptions, which assert
    nothing beyond the standard Amsterdam definitions and require no evidence.
    The attached evidence covers only what the cited abstract actually supports:
    that the maternal and fetal responses are separately graded and staged, and
    how reproducible each scheme is. The full Amsterdam Stage 1-3 and Grade 1-2
    text lives in the consensus chapter body rather than in any cached abstract,
    so it is described but never quoted as evidence.

- name: Fetal Inflammatory Response
  description: >
    The fetal arm, corresponding to the pathophysiology node Fetal Inflammatory
    Response with Funisitis and Chorionic Vasculitis, and to the Histologic
    Acute subtype. It is staged by which fetal vessels neutrophils have entered.
    It predicts neonatal outcome considerably better than the maternal stage,
    because it reflects the fetus's own response rather than the mother's.
  substages:
  - name: FIR Stage 1
    description: >
      Chorionic vasculitis or umbilical phlebitis: fetal neutrophils in the
      chorionic plate vessels or the umbilical vein only.
  - name: FIR Stage 2
    description: >
      Umbilical arteritis: involvement of one or both umbilical arteries.
      Arterial involvement matters because arterial blood is flowing from the
      fetus, so it marks a more established systemic fetal response.
  - name: FIR Stage 3
    description: >
      Necrotizing funisitis: concentric perivascular bands of neutrophil debris
      and cellular necrosis in Wharton's jelly, indicating a chronic and
      advanced fetal response and carrying the worst prognosis.
  evidence:
  - reference: PMID:14708737
    reference_title: "Amniotic infection syndrome: nosology and reproducibility of placental reaction patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Grading and staging of maternal and fetal inflammatory responses was found
      to be more reproducible using a two- versus three-tiered grading system
      than a three- versus five-tiered staging system (overall agreement 81% vs.
      71%).
    explanation: >-
      Same reproducibility study, covering the fetal response as the second
      separately staged axis.
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Funisitis and chorionic vasculitis are the hallmarks of the fetal
      inflammatory response syndrome, a condition characterized by an elevation
      in the fetal plasma concentration of interleukin-6
    explanation: >-
      Ties the fetal staging axis to the systemic fetal syndrome it marks.

environmental:
- name: Obstetric Instrumentation and Prolonged Labor
  influences_mechanisms:
  - target: Vaginal Dysbiosis and Cervical Barrier Breach
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Repeated vaginal examination and prolonged membrane exposure breach the
      mechanical barrier itself, which is why the risk scales with the number
      of examinations rather than with any single procedure. It targets the
      barrier node rather than the invasion node downstream of it, so the
      contrast with the periodontal route is preserved: instrumentation goes
      through the cervical barrier, whereas oral organisms bypass it entirely.
    evidence:
    - reference: PMID:2782335
      reference_title: "Risk factors for intraamniotic infection: a prospective epidemiologic study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Logistic regression analysis identified four variables independently associated with intraamniotic infection: the number of vaginal examinations, duration of ruptured membranes, use of internal monitors, and duration of total labor."
      explanation: >-
        Identifies the number of vaginal examinations among the variables
        independently associated with intraamniotic infection, the ascending
        route this node describes.
  description: >
    The dominant modifiable exposures here are procedural and mechanical rather
    than chemical: repeated digital vaginal examinations, prolonged rupture of
    membranes, internal fetal or uterine monitoring, and long total labor. Each
    either breaches the cervical barrier or prolongs the breach, which is why
    they act on the trigger node of this entry's pathograph and why minimizing
    examinations after rupture is standard prevention advice.
  presence: PRESENT
  evidence:
  - reference: PMID:2782335
    reference_title: "Risk factors for intraamniotic infection: a prospective epidemiologic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Logistic regression analysis identified four variables independently
      associated with intraamniotic infection: the number of vaginal
      examinations, duration of ruptured membranes, use of internal monitors,
      and duration of total labor.
    explanation: >-
      Prospective epidemiologic study identifying the four independent
      procedural and labor-duration risk factors, all of which act on the
      cervical-barrier trigger node.

- name: Oral and Periodontal Infection
  influences_mechanisms:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A haematogenous rather than ascending route, and the exception to this
      entry's usual model: oral Fusobacterium can seed the amniotic cavity
      from the bloodstream. Recorded as predisposing because the evidence is a
      single case demonstration rather than an established pathway.
    evidence:
    - reference: PMID:23115747
      reference_title: "Acute chorioamnionitis at term caused by the oral pathogen Fusobacterium nucleatum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition to its role in periodontal disease and preterm birth, our case demonstrates that intrauterine infection with Fusobacterium nucleatum can result in severe disease at term."
      explanation: >-
        Reports a case of intrauterine infection with Fusobacterium linked to
        periodontal disease, a documented but singular demonstration of the
        oral route.
  description: >
    Periodontal disease provides a hematogenous rather than ascending route into
    the amniotic cavity, which is how an oral anaerobe such as Fusobacterium
    nucleatum reaches the fetal membranes. This is the documented exception to
    the ascending-infection route that the rest of the entry models.
  presence: PRESENT
  evidence:
  - reference: PMID:23115747
    reference_title: "Acute chorioamnionitis at term caused by the oral pathogen Fusobacterium nucleatum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to its role in periodontal disease and preterm birth, our case
      demonstrates that intrauterine infection with Fusobacterium nucleatum can
      result in severe disease at term.
    explanation: >-
      Case report of acute chorioamnionitis at term caused by an oral pathogen,
      supporting the periodontal-hematogenous exposure route. A single case, so
      the exposure is recorded without any frequency claim.

biochemical:
- name: Amniotic Fluid Interleukin-6
  presence: INCREASED
  notes: >-
    The operational gold standard for intra-amniotic inflammation. An elevated
    amniotic fluid IL-6 concentration defines the inflammatory state regardless
    of whether organisms are recoverable, which is precisely what allows sterile
    intra-amniotic inflammation to be distinguished from intra-amniotic
    infection.
  evidence:
  - reference: PMID:34238107
    reference_title: "Intra-amniotic infection and sterile intra-amniotic inflammation in women with preterm labor with intact membranes are associated with a higher rate of Ureaplasma species DNA presence in the cervical fluid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-amniotic inflammation was determined based on the concentration of
      interleukin-6 in the amniotic fluid.
    explanation: >-
      Human cohort using amniotic fluid IL-6 as the defining marker of
      intra-amniotic inflammation.

- name: Amniotic Fluid Matrix Metalloproteinase-8
  presence: INCREASED
  notes: >-
    Neutrophil collagenase released into amniotic fluid, serving both as a
    diagnostic marker of intra-amniotic infection and as the effector of membrane
    matrix degradation. A rapid bedside test format exists.
  evidence:
  - reference: PMID:11717662
    reference_title: "Amniotic fluid matrix metalloproteinase-8 indicates intra-amniotic infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that matrix metalloproteinase-8 is highly correlated
      with intra-amniotic infection
    explanation: >-
      Human case-control study establishing MMP-8 as a marker of intra-amniotic
      infection.

- name: Fetal Plasma Interleukin-6
  presence: INCREASED
  notes: >-
    Elevated fetal or umbilical cord plasma IL-6 is the defining biochemical
    criterion of the fetal inflammatory response syndrome and the best available
    biochemical predictor of neonatal outcome.
  evidence:
  - reference: PMID:33164775
    reference_title: "The fetal inflammatory response syndrome: the origins of a concept, pathophysiology, diagnosis, and obstetrical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FIRS can be diagnosed by an increased concentration of umbilical cord
      plasma or serum acute phase reactants such as C-reactive protein or
      cytokines (e.g., interleukin-6).
    explanation: >-
      Defines cord plasma IL-6 as the diagnostic criterion for the fetal
      syndrome.

prevalence:
- population: Term placentas
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4000.0
  rate_low: 3000.0
  rate_high: 5000.0
  subtype: Histologic Acute
  notes: >-
    Histologic acute chorioamnionitis present in 3-5% of term placentas.
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of chorioamnionitis is a function of gestational age at
      birth, and present in 3-5% of term placentas and in 94% of placentas
      delivered at 21-24 weeks of gestation.
    explanation: >-
      Source for the term-placenta histologic prevalence.

- population: Placentas delivered at 21-24 weeks of gestation
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 94000.0
  subtype: Histologic Acute
  notes: >-
    Histologic acute chorioamnionitis present in 94% of placentas delivered at
    21-24 weeks. The steep inverse gradient with gestational age is the single
    most striking epidemiological feature of the lesion.
  evidence:
  - reference: PMID:26428501
    reference_title: "Acute chorioamnionitis and funisitis: definition, pathologic features, and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of chorioamnionitis is a function of gestational age at
      birth, and present in 3-5% of term placentas and in 94% of placentas
      delivered at 21-24 weeks of gestation.
    explanation: >-
      Source for the extreme-preterm histologic prevalence.

- population: Women with preterm labor and intact membranes
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 14000.0
  notes: >-
    Intra-amniotic infection identified in 14% and sterile intra-amniotic
    inflammation in 25% of 115 women with preterm labor and intact membranes.
    Deliberately left unassigned to a subtype. This is amniocentesis-detected
    subclinical intra-amniotic infection in women presenting with preterm
    labor, which is neither the Clinical subtype (an overt intrapartum syndrome
    defined by fever plus supporting signs) nor a placental-histology figure.
    It is a fourth thing the three-subtype axis does not cover, and forcing it
    into one of them would misrepresent what was measured.
  evidence:
  - reference: PMID:34238107
    reference_title: "Intra-amniotic infection and sterile intra-amniotic inflammation in women with preterm labor with intact membranes are associated with a higher rate of Ureaplasma species DNA presence in the cervical fluid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-amniotic infection and sterile inflammation were identified in 14%
      (16/115) and 25% (29/115) of the women, respectively.
    explanation: >-
      Human cohort quantifying demonstrable infection versus sterile
      inflammation.

treatments:
- name: Intrapartum Ampicillin and Gentamicin
  description: >
    The standard intrapartum regimen when intraamniotic infection is suspected or
    confirmed, given to reduce neonatal sepsis. Treatment is directed at the
    ascending-invasion node rather than at the inflammatory response itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: gentamicin
      term:
        id: CHEBI:17833
        label: gentamycin
  target_mechanisms:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    treatment_effect: INHIBITS
    description: >
      Antibiotics act on the invading organisms rather than on the downstream
      inflammatory cascade.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intrapartum antibiotic administration is the standard treatment to reduce
      neonatal sepsis.
    explanation: >-
      Establishes intrapartum antibiotics as standard therapy and states the
      outcome they target.
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with ampicillin and gentamicin have been recommended by
      professional societies
    explanation: >-
      Identifies the specific first-line agents curated here.
  notes: >-
    Gentamicin is bound to the CHEBI base term whose canonical label is
    gentamycin; the clinical spelling is retained in preferred_term. The
    aminoglycoside component is also the one genuinely actionable
    pharmacogenomic consideration in this regimen, via MT-RNR1-associated
    aminoglycoside ototoxicity.

- name: Anaerobic Coverage for Cesarean Delivery
  description: >
    Clindamycin or metronidazole added at cord clamp when delivery is by
    cesarean, extending coverage to the anaerobes prominent in polymicrobial
    intraamniotic infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    treatment_effect: INHIBITS
    description: >
      Extends antimicrobial coverage to the anaerobic component of the
      polymicrobial flora.
  evidence:
  - reference: PMID:33007269
    reference_title: "Management of clinical chorioamnionitis: an evidence-based approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In both study groups, patients who underwent cesarean delivery also
      received clindamycin after cord clamping to extend coverage for anaerobic
      organisms.
    explanation: >-
      States both the timing (after cord clamping, at cesarean) and the
      rationale (anaerobic coverage) for this treatment.

- name: Ceftriaxone, Clarithromycin and Metronidazole Eradication Regimen
  description: >
    A regimen selected to cover the genital mycoplasmas that dominate the
    microbiology and that are not covered by ampicillin. Reported to reduce
    intra-amniotic inflammation and infection on follow-up amniocentesis, which
    challenges the default assumption that demonstrated intra-amniotic infection
    always mandates immediate delivery.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    treatment_effect: INHIBITS
    description: >
      Directed specifically at eradicating the organisms occupying the amniotic
      cavity, including genital mycoplasmas.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We have used the combination of ceftriaxone, clarithromycin, and
      metronidazole, which has been shown to eradicate intraamniotic infection
      with microbiologic studies.
    explanation: >-
      Source for the composition and the eradication rationale of this regimen.
  - reference: PMID:26441216
    reference_title: "A new antibiotic regimen treats and prevents intra-amniotic inflammation/infection in patients with preterm PROM."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rates of intra-amniotic inflammation and intra-amniotic
      inflammation/infection in patients who received regimen 2 decreased during
      treatment from 68.8% to 52.1% and from 75% to 54.2%, respectively.
    explanation: >-
      Retrospective cohort with serial amniocenteses quantifying the fall in
      intra-amniotic inflammation and infection under this regimen, whereas the
      comparator ampicillin and cephalosporin regimen showed rising rates.

- name: Antenatal Corticosteroids
  description: >
    Betamethasone or dexamethasone for fetal maturation. Administered at eligible
    gestational ages even in the presence of chorioamnionitis, where the net
    benefit favours administration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betamethasone
      term:
        id: CHEBI:3077
        label: betamethasone
  target_mechanisms:
  - target: Fetal Pulmonary Inflammation and Arrested Alveolarization
    treatment_effect: MODULATES
    description: >
      Accelerates fetal surfactant production and lung maturation, acting on the
      pulmonary arm of the fetal inflammatory response rather than on the
      infection itself.
  evidence:
  - reference: PMID:33007269
    reference_title: "Management of clinical chorioamnionitis: an evidence-based approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current evidence suggests that the administration of antenatal
      corticosteroids for fetal lung maturation and of magnesium sulfate for
      fetal neuroprotection to patients with clinical chorioamnionitis between
      24 0/7 and 33 6/7 weeks of gestation
    explanation: >-
      Supports administering antenatal corticosteroids specifically in the
      setting of clinical chorioamnionitis, and bounds the gestational-age
      window in which it is advised.

- name: Group B Streptococcal Screening and Intrapartum Antibiotic Prophylaxis
  description: >
    Universal antenatal vaginal-rectal GBS culture at 36 0/7 to 37 6/7 weeks,
    with intrapartum penicillin for those who screen positive. This is
    prevention rather than treatment: it targets the ascending-invasion node
    before it is reached, and it is the reason Streptococcus agalactiae is a far
    less common cause of early-onset neonatal sepsis than its virulence would
    otherwise predict.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: penicillin G
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  target_mechanisms:
  - target: Ascending Microbial Invasion of the Amniotic Cavity
    treatment_effect: INHIBITS
    description: >
      Suppresses maternal genital-tract GBS carriage during labor, preventing
      the ascent and vertical transmission that would otherwise seed the
      amniotic cavity and the newborn.
  evidence:
  - reference: PMID:31977795
    reference_title: "Prevention of Group B Streptococcal Early-Onset Disease in Newborns: ACOG Committee Opinion, Number 797."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The American College of Obstetricians and Gynecologists now recommends
      performing universal GBS screening between 36 0/7 and 37 6/7 weeks of
      gestation.
    explanation: >-
      Establishes the universal screening arm of this intervention and its
      timing.
  - reference: PMID:31977795
    reference_title: "Prevention of Group B Streptococcal Early-Onset Disease in Newborns: ACOG Committee Opinion, Number 797."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All women whose vaginal-rectal cultures at 36 0/7-37 6/7 weeks of
      gestation are positive for GBS should receive appropriate intrapartum
      antibiotic prophylaxis unless a prelabor cesarean birth is performed in
      the setting of intact membranes.
    explanation: >-
      Establishes the prophylaxis arm and the single exception to it.
  - reference: PMID:31977795
    reference_title: "Prevention of Group B Streptococcal Early-Onset Disease in Newborns: ACOG Committee Opinion, Number 797."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the absence of intrapartum antibiotic prophylaxis, 1-2% of those
      newborns will develop GBS EOD.
    explanation: >-
      Quantifies the untreated baseline risk this intervention removes.
  notes: >-
    The frequently quoted population effect of universal screening plus
    prophylaxis (early-onset GBS disease falling from roughly 1.8 to 0.23 per
    1,000 live births) comes from CDC surveillance reports rather than from this
    committee opinion, so it is described here but not asserted as a quoted
    evidence claim.

- name: Delivery
  description: >
    Delivery is definitive therapy for the maternal disease. Importantly,
    chorioamnionitis by itself is not an indication for cesarean delivery, and
    the route should be decided on standard obstetric grounds.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Obstetric delivery
  evidence:
  - reference: PMID:28742677
    reference_title: "Committee Opinion No. 712: Intrapartum Management of Intraamniotic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intraamniotic infection alone is rarely, if ever, an indication for
      cesarean delivery.
    explanation: >-
      Professional-society statement constraining how this treatment should be
      applied; recorded so the entry does not imply that the diagnosis mandates
      operative delivery.
  notes: >-
    Deliberately left without a `term:` binding. NCIT has no clinical-action
    term for obstetric delivery, and the nearest candidate (NCIT:C15329
    Surgical Procedure) would contradict this treatment's own evidence, which
    states that intraamniotic infection is rarely an indication for cesarean.
    Per CLAUDE.md, omitting the term is preferred over a misleading one;
    `therapeutic_modality` is OTHER for the same reason. A candidate for an NCIT
    new-term request. This treatment covers the delivery decision generally, not
    cesarean specifically.

diagnosis:
- name: Amniocentesis with Amniotic Fluid Analysis
  description: >
    Definitive diagnosis in uncertain cases rests on sampling amniotic fluid and
    testing in parallel for organisms and for inflammation, because either can be
    present without the other.
  evidence:
  - reference: PMID:38233317
    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In cases of uncertainty, a definitive diagnosis can be made by analyzing
      amniotic fluid with methods to detect bacteria (Gram stain, culture, or
      microbial nucleic acid) and inflammation (white blood cell count, glucose
      concentration, interleukin-6, interleukin-8, matrix metalloproteinase-8).
    explanation: >-
      Specifies the dual microbiological and inflammatory testing strategy.

- name: Placental Histopathological Examination
  description: >
    Examination of the placenta and membranes after delivery, reported using the
    Amsterdam consensus criteria, which stage and grade the maternal and fetal
    inflammatory responses separately. This is the reference standard for the
    lesion but is by nature retrospective.
  evidence:
  - reference: PMID:27223167
    reference_title: "Sampling and Definitions of Placental Lesions: Amsterdam Placental Workshop Group Consensus Statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The terminology and microscopic descriptions for maternal vascular
      malperfusion, fetal vascular malperfusion, delayed villous maturation,
      patterns of ascending intrauterine infection, and villitis of unknown
      etiology were agreed upon.
    explanation: >-
      Amsterdam consensus supplying the standardized reporting criteria for
      ascending intrauterine infection patterns.

discussions:
- discussion_id: chorio_sterile_vs_infectious_boundary
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If sterile intra-amniotic inflammation is more common than demonstrable
    intra-amniotic infection in preterm labor and produces an indistinguishable
    placental lesion, is chorioamnionitis correctly classified as an infectious
    disease at all?
  attaches_to:
  - pathophysiology#Alarmin Release and Sterile Intra-amniotic Inflammation
  - pathophysiology#Ascending Microbial Invasion of the Amniotic Cavity
  rationale: >-
    This entry is filed under Infectious Disease and MONDO classifies
    MONDO:0000409 partly under bacterial infectious disease, yet a human cohort
    found sterile inflammation in 25% versus demonstrable infection in 14% of
    women with preterm labor. The classification is defensible historically but
    sits uneasily with the mechanism as currently understood, and the entry
    models the two triggers as parallel arms converging on shared receptor
    signaling rather than forcing one to be primary.

- discussion_id: chorio_bpd_association_strength
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is chorioamnionitis a genuine independent risk factor for bronchopulmonary
    dysplasia, or is the reported association an artifact of publication bias
    and residual confounding by gestational age?
  attaches_to:
  - pathophysiology#Fetal Pulmonary Inflammation and Arrested Alveolarization
  rationale: >-
    The largest meta-analysis found a significant pooled association but also
    strong evidence of publication bias, more conservative adjusted estimates,
    and infants exposed to chorioamnionitis being younger and lighter at birth.
    Its authors explicitly declined to call chorioamnionitis a definitive risk
    factor. The corresponding evidence items are recorded as PARTIAL rather than
    SUPPORT.
  evidence:
  - reference: PMID:21697236
    reference_title: "Chorioamnionitis as a risk factor for bronchopulmonary dysplasia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite a large body of evidence, CA cannot be definitively considered a
      risk factor for BPD.
    explanation: >-
      The meta-analysis authors' own statement of the unresolved status of this
      association.

- discussion_id: chorio_placental_architecture_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do results from sheep and other large-animal models of intra-amniotic
    inflammation transfer to human disease, given that their placental
    architecture is epitheliochorial and cotyledonary rather than hemochorial
    and discoid?
  attaches_to:
  - pathophysiology#Fetal Pulmonary Inflammation and Arrested Alveolarization
  - pathophysiology#Microglial Activation and Preterm White Matter Injury
  rationale: >-
    Much of the mechanistic evidence for the fetal lung and brain injury arms
    comes from intra-amniotic endotoxin models in sheep, which are the workhorse
    for fetal physiology precisely because the fetus is large enough to
    instrument. But an epitheliochorial placenta interposes more cellular layers
    between maternal blood and fetus than the human hemochorial placenta does,
    which plausibly alters both microbial access and cytokine transfer. The
    mismatch concerns translational validity, not absence of evidence, so it is
    recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP. Mouse models
    carry a separate mismatch, since murine parturition depends on progesterone
    withdrawal and human parturition does not.

- discussion_id: chorio_no_causal_genes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any replicated host-genetic contribution to chorioamnionitis
    susceptibility?
  rationale: >-
    Chorioamnionitis is an acquired condition with no causal genes, no OMIM
    entry, and no genetic testing indication. A candidate-gene literature exists
    for inflammatory mediators such as TNF, IL6, IL1RN and TLR4 in relation to
    preterm birth and intra-amniotic inflammation, but it is small and largely
    unreplicated. No genetic block is curated in this entry rather than
    populating one from unreplicated single studies. This note exists so that a
    future curator does not read the empty genetic section as an oversight.

notes: >-
  Scope decisions worth recording. First, this entry deliberately keeps three
  things distinct that clinical usage blurs: the intrapartum clinical syndrome,
  the acute histologic placental lesion, and chronic chorioamnionitis, which is
  a lymphocytic lesion of maternal anti-fetal rejection that merely shares the
  name. They are modeled as subtypes rather than as one blended graph. Second,
  the fetal inflammatory response syndrome is curated here as a pathophysiology
  node rather than as a separate disease entry, because it is the mechanistic
  bridge from this exposure to the neonatal outcomes; the downstream diseases
  themselves (cerebral palsy, bronchopulmonary dysplasia) stay in their own
  entries, and Cerebral_Palsy already carries the reciprocal risk-factor
  evidence from the same meta-analysis (PMID:10989405). Third, only FIRS type I
  (the acute, cord-IL-6-defined, funisitis-associated form) is modeled here;
  FIRS type II, a chronic CXCL10-associated form tied to maternal anti-fetal
  rejection, belongs with chronic chorioamnionitis and villitis of unknown
  etiology rather than with the acute infectious entity, and is deliberately not
  merged into the Fetal Inflammatory Response Syndrome node.

  Ontology gaps found while curating, all verified rather than assumed. HPO has
  no term for chorioamnionitis or funisitis. The obvious term for maternal fever
  in pregnancy (HP:0030244) sits outside the curatable Phenotypic abnormality
  hierarchy, under Past medical history. HPO has no uterine or fundal tenderness
  term either (only nipple, scalp, costovertebral-angle, cervical-motion and
  peroneal tenderness), so that clinical criterion is described in the Clinical
  subtype and in the diagnostic criteria snippets but is not curated as a bound
  phenotype. HPO has no bronchopulmonary dysplasia term, so the BPD phenotype is
  bound to the parent HP:0006528 Chronic lung disease. NCIT has no obstetric
  delivery clinical-action term. And although NCIT:C111944 Histologic
  Chorioamnionitis is correctly placed under NCIT:C83490 Histopathology Result
  and is bound on the histopathology record, its two companion lesions,
  NCIT:C97077 Funisitis and NCIT:C117324 Fetal Chorionic Vasculitis, sit under
  NCIT:C2991 Disease or Disorder instead, so neither is reachable from the
  HistopathologyFindingTerm enum roots and neither can be bound as a
  histopathological finding. That is an upstream NCIT placement gap rather than
  a missing term. These are all recorded here rather than papered over with
  poorly fitting bindings, and each is a reasonable upstream new-term or
  reclassification request.

  Deliberately out of scope: the additional minor amniotic-cavity isolates
  (Gardnerella, Sneathia, Bacteroides, Candida, Listeria, Trichomonas) are real
  but contribute no distinct mechanism beyond the six curated agents; the
  differential diagnosis list, animal models, and clinical trials are left for a
  follow-up pass rather than populated thinly here.

    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The condition is suspected when intrapartum fever is associated with two
      other maternal and fetal signs of local or systemic inflammation (eg,
      maternal tachycardia, uterine tenderness, maternal leukocytosis,
      malodorous vaginal discharge or amniotic fluid, and fetal tachycardia).
    explanation: >-
      Lists maternal tachycardia among the defining supporting signs.
  subtype: Clinical

- category: Laboratory
  name: Maternal Leukocytosis
  description: >
    Elevated maternal white blood cell count, one of the supporting criteria for

    reference_title: "Clinical chorioamnionitis at term: definition, pathogenesis, microbiology, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The condition is suspected when intrapartum fever is associated with two
      other maternal and fetal signs of local or systemic inflammation
    explanation: >-
      Establishes fever as the obligate anchor sign of the clinical syndrome,
      requiring additional signs for diagnosis.
  - reference: PMID:26855098
    reference_title: "Evaluation and Management of Women and Newborns With a Maternal Diagnosis of Chorioamnionitis: Summary of a Workshop."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It is particularly important to recognize that an isolated maternal fever
      is not synonymous with chorioamnionitis.
    explanation: >-
      Qualifies the frequency assignment: fever is obligate for the diagnosis
      but is not by itself diagnostic.
  subtype: Clinical

- category: Clinical
  name: Maternal Tachycardia

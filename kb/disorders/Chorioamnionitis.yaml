treatments:
- name: Intrapartum Ampicillin and Gentamicin
  description: >
    The standard intrapartum regimen when intraamniotic infection is suspected or
    confirmed, given to reduce neonatal sepsis. Treatment is directed at the
    ascending-invasion node rather than at the inflammatory response itself.
  therapeutic_modality: SMALL_MOLECULE

    explanation: >-
      Lists maternal leukocytosis among the defining supporting signs.
  subtype: Clinical

- category: Clinical
  name: Premature Rupture of Membranes
  description: >
    Rupture of the fetal membranes before the onset of labor. Both a risk factor

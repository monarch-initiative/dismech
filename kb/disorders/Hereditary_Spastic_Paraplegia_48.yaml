animal_models:
- name: Ap5z1 knockout mouse
  species: Mus musculus
  genotype: Ap5z1 -/- (constitutive AP-5 zeta knockout)
  description: >-
    Mice carrying constitutive disruption of murine Ap5z1 (orthologous to human AP5Z1)
    develop age-dependent degeneration of corticospinal tract axons accompanied by impaired
    autophagic flux, defective lysosome recycling from autolysosomes, and progressive
    accumulation of autophagosomes, autolysosomes, and intracellular waste in neurons.
  publication: PMID:30930081
  modeled_mechanisms:
  - target: Impaired Autophagic Lysosome Reformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Ap5z1 knockout cells and neurons exhibit impaired autophagic flux and defective
      recycling of lysosomes from autolysosomes, with accumulation of autophagosomes,
      autolysosomes, and intracellular waste in vivo.
    limitations: >-
      Constitutive murine Ap5z1 loss models complete null deficiency in mouse neurons rather
      than patient-specific missense or truncating alleles in human neuronal subtypes.
    evidence:
    - reference: PMID:30930081
      reference_title: "A mouse model for SPG48 reveals a block of autophagic flux upon disruption of adaptor protein complex five."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We further show that both autophagic flux and the recycling of lysosomes from autolysosomes were impaired in knockout cells. In vivo, we observe an increase of autophagosomes and autolysosomes and, at later stages, the accumulation of intracellular waste in neurons."
      explanation: "Demonstrates impaired autophagic flux and lysosome recycling with neuronal autophagosome/autolysosome accumulation in Ap5z1 knockout mice."
  - target: Corticospinal Axon Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Ap5z1 knockout mice develop progressive age-dependent degeneration of corticospinal
      tract axons.
    limitations: >-
      Rodent corticospinal tracts are shorter and have different descending motor projections
      than human pyramidal tracts, resulting in milder motor disability than human spastic
      paraplegia.
    evidence:
    - reference: PMID:30930081
      reference_title: "A mouse model for SPG48 reveals a block of autophagic flux upon disruption of adaptor protein complex five."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report an AP5 zeta knockout mouse, which shows an age-dependent degeneration of corticospinal axons."
      explanation: "Demonstrates age-dependent corticospinal axon degeneration in the Ap5z1 knockout mouse."
  evidence:
  - reference: PMID:30930081
    reference_title: "A mouse model for SPG48 reveals a block of autophagic flux upon disruption of adaptor protein complex five."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report an AP5 zeta knockout mouse, which shows an age-dependent degeneration of corticospinal axons."
    explanation: "Primary characterization of the Ap5z1 knockout mouse model of SPG48."
references:
- reference: PMID:33543803
  title: "Expanding the Spectrum of AP5Z1-Related Hereditary Spastic Paraplegia (HSP-SPG48): A Multicenter Study on a Rare Disease."
notes: >-
  Pigmentary retinopathy, cataract, and hearing impairment are documented clinical features
  in reported SPG48 cohorts (PMID:37077568), but the downstream cellular and tissue
  mechanisms linking AP5Z1/AP-5 deficiency to retinal, lenticular, and cochlear/auditory
  pathway pathology remain unestablished in experimental or postmortem studies and are
  therefore left unwired from the pathophysiology graph.

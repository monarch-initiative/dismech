    directness: INDIRECT
    snippet: "Treatment is exclusively symptomatic and aimed mainly at reducing muscle spasticity and urinary urgency, and improving strength and gait. Therapeutic options include physical therapy, oral antispastic drugs (baclofen, progabide, dalfampridine), botulinum toxin therapy, and surgical baclofen pump implantation."

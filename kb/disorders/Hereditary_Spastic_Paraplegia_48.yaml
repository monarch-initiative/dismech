name: Hereditary Spastic Paraplegia 48
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Hereditary spastic paraplegia 48 (SPG48) is a rare autosomal recessive complicated or pure
  hereditary spastic paraplegia caused by biallelic pathogenic variants in AP5Z1, encoding
  the zeta subunit of the fifth adaptor protein complex (AP-5). AP-5 mediates cargo sorting
  and late endosome-to-Golgi retrieval and supports autophagic lysosome reformation; its
  loss causes accumulation of multilamellar storage material within aberrant endolysosomes
  and blocks autophagic flux, leading to length-dependent corticospinal tract and peripheral
  axonal degeneration as well as broader central neurodegeneration. Onset spans many decades
  from early childhood to late adulthood with progressive lower-limb spastic paraplegia and
  heterogeneous accompanying features including urinary incontinence, peripheral neuropathy,
  ataxia, cognitive impairment, parkinsonism, dystonia, cerebral white matter
  hyperintensities, thinning of the corpus callosum, pigmentary retinopathy, cataract, and
  hearing impairment.
synonyms:

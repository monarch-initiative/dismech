pathophysiology:
- name: AP5Z1/AP-5 Complex Deficiency
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in AP5Z1 abolish or deplete the AP-5 zeta subunit
    and destabilize associated AP-5 subunits (including mu5), disrupting assembly and
    clathrin-independent cargo-adaptor activity of the AP-5/SPG11/SPG15 endolysosomal
    coat-like complex.
  gene:
    preferred_term: AP5Z1
    term:
      id: hgnc:22197
      label: AP5Z1
  molecular_functions:
  - preferred_term: cargo adaptor activity
    term:
      id: GO:0140312
      label: cargo adaptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26085577
    reference_title: "Loss of AP-5 results in accumulation of aberrant endolysosomes: defining a new type of lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In all three patient-derived lines, we show that there is complete loss of AP-5 ζ protein and a reduction in the associated AP-5 µ5 protein."
    explanation: "Demonstrates that biallelic AP5Z1 nonsense variants abolish AP-5 zeta protein and destabilize the AP-5 complex in patient fibroblasts."
  - reference: PMID:39059408
    reference_title: "Early Diagnosis of AP5Z1/SPG48 Spastic Paraplegia: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blotting in cultured skin fibroblasts indicated reduced protein expression, which confirmed the genetic diagnosis and framed this as a case of protein reduction in a context of impaired autophagy."
    explanation: "Confirms reduced AP5Z1 protein expression in patient-derived fibroblasts harboring novel biallelic AP5Z1 mutations."
  downstream:
  - target: Impaired Late Endosome-to-Golgi Retrieval
    causal_link_type: DIRECT
    description: Loss of functional AP-5 adaptor complexes directly impairs cargo sorting out of late endosomes toward the trans-Golgi network.
  - target: Impaired Autophagic Lysosome Reformation
    causal_link_type: DIRECT
    description: Loss of the AP-5 zeta subunit impairs autophagic lysosome reformation and blocks autophagic flux.
- name: Impaired Late Endosome-to-Golgi Retrieval
  biological_scale: CELLULAR
  description: >-
    Loss of AP-5 disrupts a late-endosomal sorting pathway acting alongside retromer,
    impairing retrieval of cation-independent mannose 6-phosphate receptor (CIMPR) and
    Golgi-resident proteins (such as GOLIM4 and GOLM1) from late endosomes back to the
    trans-Golgi network.
  cellular_components:
  - preferred_term: late endosome
    term:
      id: GO:0005770
      label: late endosome
  biological_processes:
  - preferred_term: retrograde transport, endosome to Golgi
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
    modifier: DECREASED
  evidence:
  - reference: PMID:29381698
    reference_title: "Role of the AP-5 adaptor protein complex in late endosome-to-Golgi retrieval."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunolocalisation showed that loss of AP-5 led to impaired retrieval of the cation-independent mannose 6-phosphate receptor (CIMPR), GOLIM4, and GOLM1 from endosomes back to the Golgi region."
    explanation: "Establishes that AP5Z1 knockout impairs endosome-to-Golgi retrieval of CIMPR and Golgi membrane proteins."
  - reference: PMID:30930081
    reference_title: "A mouse model for SPG48 reveals a block of autophagic flux upon disruption of adaptor protein complex five."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our analysis of knockout fibroblasts supports a trafficking defect from late endosomes to the transGolgi network and reveals a structural defect of the Golgi."
    explanation: "Corroborates defective late endosome-to-trans-Golgi trafficking upon AP-5 zeta disruption."
  downstream:

genetic:
- name: AP5Z1 pathogenic variants
  gene_term:
    preferred_term: AP5Z1
    term:
      id: hgnc:22197
      label: AP5Z1
  association: Causative biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic nonsense, frameshift, splice-site, missense, or multi-exon deletion variants
    in AP5Z1 cause SPG48; a multicenter study (Breza et al. 2021) expanded the clinical and
    mutational spectrum of this rare disease.
  evidence:
  - reference: PMID:39059408
    reference_title: "Early Diagnosis of AP5Z1/SPG48 Spastic Paraplegia: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in AP5Z1, which are associated with spastic paraplegia type 48 (SPG48), are extremely rare and seldom described in children.We report the clinical, radiologic, and molecular studies performed in a child harboring novel biallelic mutations in AP5Z1."
    explanation: "Establishes biallelic pathogenic mutations in AP5Z1 as the genetic cause of SPG48."
diagnosis:
- name: AP5Z1 molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: PRESENT
  description: >-
    Definitive diagnosis requires molecular genetic testing (multi-gene HSP panel, exome/genome
    sequencing, and deletion/copy-number evaluation) identifying biallelic pathogenic variants
    in AP5Z1.
  markers: Biallelic pathogenic sequence variants or intragenic deletions in AP5Z1.
  evidence:
  - reference: PMID:37077568
    reference_title: "Hereditary spastic paraplegia (SPG 48) with deafness and azoospermia: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed the location of gene deletion by Sanger sequencing, identifying homozygous deletions in the chr7:4785904-4786677 region involving exon 10 of the AP5Z1 gene, NM_014855.3, c.1133-345_1311 + 249del, p.G378Vfs*93X (Figure 2)."
    explanation: "Demonstrates molecular confirmation of SPG48 by sequencing and deletion analysis of AP5Z1."
- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: PRESENT
  description: >-
    Brain MRI evaluates periventricular/frontal-horn white matter hyperintensities (including
    the 'ears of the lynx' sign), thinning of the corpus callosum, and mild cerebral atrophy.
  results: Periventricular white matter hyperintensities (frontal horns of lateral ventricles) and thinning of the corpus callosum.
  evidence:
  - reference: PMID:37077568
    reference_title: "Hereditary spastic paraplegia (SPG 48) with deafness and azoospermia: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most patients, brain MRI shows white matter lesions around corona radiata, semioval center and lateral ventricles. The “ears of the lynx” imaging sign suggests the presence of a genetic mutation, likely characteristic of HSP ( 12 ). The narrowing of corpus callosum is another relevant imaging characteristic in these patients."
    explanation: "Summarizes the characteristic brain MRI abnormalities supporting SPG48 evaluation."
- name: Electromyography
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  presence: PRESENT
  description: >-
    Electromyography and nerve conduction studies characterize accompanying axonal motor and
    sensory polyneuropathy in patients with SPG48.
  results: Reduced compound muscle action potential amplitudes and prolonged sensory/F-wave latencies in complicated SPG48 with neuropathy.
  evidence:
  - reference: PMID:37077568
    reference_title: "Hereditary spastic paraplegia (SPG 48) with deafness and azoospermia: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The electromyography investigation showed decreased amplitudes of compound muscle action potentials (CMAPs) in the right common peroneal nerve and left tibial nerve."
    explanation: "Documents electrodiagnostic evaluation of peripheral nerve involvement in SPG48."

name: Mesomelic Dysplasia, Kantaputra Type
synonyms:
- Mesomelic dysplasia, HOXD-related
- mesomelic dysplasia with ankle, carpal, and tarsal synostosis
- mesomelic dysplasia, Thai type
- MDK
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Mesomelic dysplasia of the Kantaputra type is an autosomal dominant skeletal
  dysplasia — dwarfism with marked shortening of the forearms and lower legs,
  carpal and tarsal synostosis, and dorsolateral deviation of the feet —
  originally described in a Thai family and caused by copy-number
  rearrangements at the HOXD cluster on 2q31. It is one of the clearest human
  examples of a disease of gene *regulation* rather than gene product: the
  rearrangements do not disrupt any coding sequence. They rewire which
  enhancers reach which HOXD genes, most consequentially by bringing HOXD13 —
  a digit-specific transcription factor — within reach of proximal limb
  enhancers, so that it is expressed where it does not belong and dominantly
  interferes with the patterning of the middle limb segment.
disease_term:
  preferred_term: mesomelic dysplasia, Kantaputra type
  term:
    id: MONDO:0007977
    label: mesomelic dysplasia, Kantaputra type
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
notes: >-
  Scope. The ISDS 2023 table gives this entity one row, "Mesomelic dysplasia,
  HOXD-related", whose label collects three eponyms — Kim (Korean), Kantaputra,
  and Fryns. This entry is keyed to the Kantaputra type, which has its own MONDO
  class and the largest published pedigree, and the other two are curated as
  differential diagnoses rather than subtypes: MONDO keeps them separate, the
  Fryns type is explicitly delimited in the literature as an upper-limb-only
  condition, and their rearrangement geometries differ even though the locus and
  the mechanism are shared. The shared mechanism is curated once, here, and the
  differentials point at it.

  What varies between the eponymous types is not the gene but the geometry —
  which enhancers end up adjacent to which HOXD genes, and therefore which limb
  segment misexpresses HOXD13. That is why one HOXD-related mesomelic dysplasia
  affects both limb pairs and another only the forearms.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian skeletal dysplasia caused by a structural variant; tagged on
      the genetics axis.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0110, listed as "Mesomelic dysplasia, HOXD-related (Kim or Korean
      type, Kantaputra type, Fryns type)" (MIM 156232, AD). The row's own
      comment states that the cause is duplications at the HOXD gene cluster
      locus and that the phenotype is variable even within families. This entry
      curates the Kantaputra type named in that row; the Kim/Korean and Fryns
      types are recorded as differential diagnoses. The 2019 revision (Mortier
      et al., PMID:31633310) numbered the same group 17.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Known from a small number of families. The original Thai pedigree carried 15
    affected members across three generations, which is large for the disorder;
    other reports are single families. No denominator-based estimate exists.
  evidence:
  - reference: PMID:9609995
    reference_title: "The gene for mesomelic dysplasia Kantaputra type is mapped to chromosome 2q24-q32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied a Thai family in which 15 members in 3 generations were
      affected with MDK.
    explanation: >-
      Gives the size of the defining pedigree, which is the basis for the rarity
      band recorded here.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Transmitted as an autosomal dominant trait; the original pedigree segregated
    the phenotype through three generations with a linkage LOD score above 4.
    The nosology records that expression is variable even within families, so a
    mildly affected parent does not predict a mildly affected child.
  evidence:
  - reference: PMID:9609995
    reference_title: "The gene for mesomelic dysplasia Kantaputra type is mapped to chromosome 2q24-q32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mesomelic dysplasia Kantaputra type (MDK) (MIM *156232) is a new autosomal
      dominant skeletal dysplasia characterized by dwarfism, shortening of the
      forearms/lower-legs, carpal/tarsal synostosis, and dorsolateral foot
      deviation.
    explanation: >-
      States the inheritance mode together with the defining clinical features.
pathophysiology:
- name: Copy-Number Rearrangement at the HOXD Locus
  biological_scale: MOLECULAR
  genetic_context:
    genes:
    - preferred_term: HOXD13
      term:
        id: hgnc:5136
        label: HOXD13
    allele_type: 2q31 microduplication spanning the HOXD cluster; also translocation and inversion alleles
    zygosity: HETEROZYGOUS
  description: >-
    Array CGH in the Kantaputra family found two microduplications at
    2q31.1-q31.2 of roughly 481 and 507 kb, separated by a segment of normal
    copy number, the centromeric one spanning the whole HOXD cluster plus EVX2
    and MTX2. Crucially, the causal rearrangements at this locus need not
    disrupt any gene at all: the t(2;8) translocation that causes a similar
    phenotype breaks about 60 kb from the HOXD complex and interrupts no coding
    sequence. The lesion is positional.
  evidence:
  - reference: PMID:20648051
    reference_title: "Mesomelic dysplasia Kantaputra type is associated with duplications of the HOXD locus on chromosome 2q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we performed array CGH and identified two microduplications on chromosome
      2 (2q31.1-q31.2) encompassing ∼481 and 507 kb, separated by a segment of
      normal copy number. The more centromeric duplication encompasses the
      entire HOXD cluster, as well as the neighboring genes EVX2 and MTX2.
    explanation: >-
      Identifies the specific rearrangement in the Kantaputra family and what it
      contains.
  - reference: PMID:11944980
    reference_title: "A t(2;8) balanced translocation with breakpoints near the human HOXD complex causes mesomelic dysplasia and vertebral defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that this translocation does not disrupt any gene, hence it most
      likely exerts its deleterious effect by modifying gene regulation.
    explanation: >-
      The clearest statement that the mechanism at this locus is regulatory
      rather than coding, from the allele class where that is unambiguous.
  downstream:
  - target: Reallocation of Limb Enhancer-Promoter Contacts
    causal_link_type: DIRECT
    description: >-
      A rearrangement that changes distances and topology changes which
      enhancers can reach which promoters.
- name: Reallocation of Limb Enhancer-Promoter Contacts
  biological_scale: MOLECULAR
  description: >-
    HOXD genes are read by enhancers in the two gene deserts flanking the
    cluster, one serving proximal and one distal limb territory, partitioned by
    topologically associating domain boundaries. Rearrangement moves genes
    across that partition. The consequences are not uniformly gain or loss: a
    duplication in the upstream regulatory desert has been shown to
    *down*-regulate transcription in developing digits by impairing physical
    contact between target genes and their enhancers, phenocopying deletion of
    those enhancers — so at this locus a duplication can produce a partial loss
    of function. In the mesomelic dysplasias the decisive event is the opposite
    one: HOXD13 is brought within reach of proximal enhancers.
  biological_processes:
  - preferred_term: Enhancer-driven regulation of HOXD transcription
    modifier: DYSREGULATED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:31591517
    reference_title: "Fryns type mesomelic dysplasia of the upper limbs caused by inverted duplications of the HOXD gene cluster."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The HoxD cluster is critical for vertebrate limb development. Enhancers
      located in both the telomeric and centromeric gene deserts flanking the
      cluster regulate the transcription of HoxD genes.
    explanation: >-
      Establishes the two-gene-desert regulatory architecture that the
      rearrangements reallocate.
  - reference: PMID:23134724
    reference_title: "Impact of copy number variations (CNVs) on long-range gene regulation at the HoxD locus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, one such duplication led to a transcriptional
      down-regulation in developing digits by impairing physical interactions
      between the target genes and their upstream regulatory elements, thus
      phenocopying the effect obtained when these enhancer sequences are deleted.
    explanation: >-
      Demonstrates in engineered mice that a duplication at this locus can cause
      loss of function, which is why the node's claim is reallocation rather
      than dosage gain.
  downstream:
  - target: Ectopic Proximal Expression of HOXD13
    causal_link_type: DIRECT
    description: >-
      The specific reallocation that matters for mesomelic dysplasia is HOXD13
      coming under proximal enhancer control.
- name: Ectopic Proximal Expression of HOXD13
  biological_scale: CELLULAR
  description: >-
    HOXD13 is normally a distal, digit-specifying transcription factor. When a
    rearrangement places it near proximal limb enhancers, those enhancers
    contact and activate it in proximal cells. Engineered mice carrying a 1 Mb
    inversion of the HoxD cluster develop mesomelic dysplasia by exactly this
    route, and — the decisive experiment — adding a HOXD13-null mutation in cis
    with the inversion completely rescues the skeletal phenotype. That rescue
    converts "HOXD13 is misexpressed" from a correlation into a demonstrated
    cause. The downstream damage appears to run through genes HOXD13 normally
    controls in distal cells, now switched on in the wrong territory.
  biological_processes:
  - preferred_term: anterior/posterior pattern specification in the limb
    modifier: DYSREGULATED
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  - preferred_term: limb morphogenesis
    modifier: DYSREGULATED
    term:
      id: GO:0035108
      label: limb morphogenesis
  evidence:
  - reference: PMID:34408147
    reference_title: "Mesomelic dysplasias associated with the HOXD locus are caused by regulatory reallocations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we engineer 1 Mb inversion including the HoxD gene cluster, which
      positioned Hoxd13 close to proximal limb enhancers. Using this model, we
      show that these enhancers contact and activate Hoxd13 in proximal cells,
      inducing the formation of mesomelic dysplasia.
    explanation: >-
      Direct demonstration that proximal enhancer capture of Hoxd13 induces the
      phenotype.
  - reference: PMID:34408147
    reference_title: "Mesomelic dysplasias associated with the HOXD locus are caused by regulatory reallocations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that a secondary Hoxd13 null mutation in-cis with the inversion
      completely rescues the alterations, demonstrating that ectopic HOXD13 is
      directly responsible for this bone anomaly.
    explanation: >-
      The in-cis rescue, which establishes ectopic HOXD13 as necessary for the
      phenotype rather than merely present.
  - reference: PMID:34408147
    reference_title: "Mesomelic dysplasias associated with the HOXD locus are caused by regulatory reallocations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Single-cell expression analysis and evaluation of HOXD13 binding sites
      suggests that the phenotype arises primarily by acting through genes
      normally controlled by HOXD13 in distal limb cells.
    explanation: >-
      Identifies the likely downstream targets. The source says "suggests", so
      this is PARTIAL and the effector genes are not named here.
  downstream:
  - target: Mesomelic Limb Shortening and Bowing
    causal_link_type: DIRECT
    description: >-
      Misspecified proximal limb mesenchyme fails to build a normal zeugopod.
- name: Mesomelic Limb Shortening and Bowing
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: severe shortening and bending of the middle limb
    segment, with carpal and tarsal synostosis and dorsolateral foot deviation
    in the Kantaputra type. The mouse Ulnaless inversion produces the same
    phenotype from the same locus, which is what licensed treating the human and
    mouse conditions as one problem.
  evidence:
  - reference: PMID:34408147
    reference_title: "Mesomelic dysplasias associated with the HOXD locus are caused by regulatory reallocations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human families with chromosomal rearrangements at 2q31, where the human
      HOXD locus maps, display mesomelic dysplasia, a severe shortening and
      bending of the limb. In mice, the dominant Ulnaless inversion of the HoxD
      cluster produces a similar phenotype suggesting the same origin for these
      malformations in humans and mice.
    explanation: >-
      States the human phenotype and the mouse correspondence that underpins the
      mechanistic work cited upstream.

genetic:
- name: HOXD cluster (2q31.1-q31.2)
  gene_term:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  relationship_type: CAUSATIVE
  notes: >-
    The causal unit here is a genomic region, not a gene. The gene_term binds
    HOXD13 because the mouse work identifies ectopic HOXD13 as the effector, but
    HOXD13's own coding sequence is intact in these patients — the pathogenic
    events are duplications, inversions, and translocations that reposition it
    relative to the flanking enhancer deserts. The centromeric duplication in
    the Kantaputra family also spans EVX2 and MTX2. Diagnostically this means
    HOXD13 sequencing is uninformative and copy-number or structural-variant
    analysis is required.
  evidence:
  - reference: PMID:20648051
    reference_title: "Mesomelic dysplasia Kantaputra type is associated with duplications of the HOXD locus on chromosome 2q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that MDK is caused by duplications that modify the topography
      of the locus and as such result in deregulation of HOXD gene expression.
    explanation: >-
      States the causal model for this specific disorder: topographic
      modification of the locus, not a coding lesion.
  - reference: PMID:9609995
    reference_title: "The gene for mesomelic dysplasia Kantaputra type is mapped to chromosome 2q24-q32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicated that the MDK locus is in the vicinity of D2S2284 and
      D2S2188 loci that are most likely mapped to 2q24-q32.
    explanation: >-
      The original linkage mapping that placed the locus at 2q, later refined to
      the HOXD cluster.
animal_models:
- name: HoxD 1 Mb inversion mouse
  species: Mouse
  genotype: Engineered 1 Mb inversion including the HoxD cluster; and the same inversion in cis with a Hoxd13 null allele
  publication: PMID:34408147
  description: >-
    An engineered inversion that reproduces the human rearrangement geometry,
    paired with an in-cis rescue allele. The rescue arm is what makes this a
    causal test rather than a phenocopy.
  modeled_mechanisms:
  - target: Ectopic Proximal Expression of HOXD13
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The inversion places Hoxd13 near proximal limb enhancers, which activate
      it there, and mesomelic dysplasia follows.
    limitations: >-
      The inversion is engineered to a chosen geometry rather than copied from a
      patient allele, and human MDK is caused by duplications rather than an
      inversion; the model tests the mechanism the duplications are thought to
      act through, not the duplications themselves.
    readouts:
    - name: Proximal limb Hoxd13 expression
      target: Ectopic Proximal Expression of HOXD13
      direction: INCREASED
      interpretation: >-
        Activation of a distal gene in proximal cells is the measured
        misexpression event.
      evidence:
      - reference: PMID:34408147
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we show that these enhancers contact and activate Hoxd13 in proximal
          cells, inducing the formation of mesomelic dysplasia
        explanation: >-
          Reports both the ectopic activation and the resulting phenotype.
    evidence:
    - reference: PMID:34408147
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that a secondary Hoxd13 null mutation in-cis with the inversion
        completely rescues the alterations, demonstrating that ectopic HOXD13 is
        directly responsible for this bone anomaly.
      explanation: >-
        The in-cis rescue establishes necessity, which is the strongest form of
        model evidence available for a mechanism claim.
  - target: Mesomelic Limb Shortening and Bowing
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Removing HOXD13 function in cis with the inversion completely rescues the
      skeletal alterations — a genetic rescue, not a treatment.
    limitations: >-
      The rescue is a germline in-cis allele engineered before development
      begins. It identifies the effector but offers no route to intervention in
      a patient whose limbs are already formed.
    evidence:
    - reference: PMID:34408147
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that a secondary Hoxd13 null mutation in-cis with the inversion
        completely rescues the alterations, demonstrating that ectopic HOXD13 is
        directly responsible for this bone anomaly.
      explanation: >-
        Reports the complete rescue that this link records.
diagnosis:
- name: Radiographic Recognition
  description: >-
    Suspected from mesomelic shortening of all four limbs with carpal and tarsal
    synostosis and dorsolateral foot deviation, in a dominant pedigree. The
    synostoses are the discriminating feature against the SHOX-related mesomelic
    dysplasias, which do not produce them.
  diagnosis_term:
    preferred_term: diagnostic radiography
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:9609995
    reference_title: "The gene for mesomelic dysplasia Kantaputra type is mapped to chromosome 2q24-q32."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mesomelic dysplasia Kantaputra type (MDK) (MIM *156232) is a new autosomal
      dominant skeletal dysplasia characterized by dwarfism, shortening of the
      forearms/lower-legs, carpal/tarsal synostosis, and dorsolateral foot
      deviation.
    explanation: >-
      Enumerates the radiographic feature set on which recognition rests.
- name: Structural-Variant Analysis of 2q31
  description: >-
    Confirmed by demonstrating a copy-number or structural rearrangement
    spanning or flanking the HOXD cluster. Sequencing HOXD13 will be normal;
    array CGH, and where available mate-pair or long-read genome sequencing,
    are the informative assays, because orientation and insertion point — not
    just copy number — determine the phenotype.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20648051
    reference_title: "Mesomelic dysplasia Kantaputra type is associated with duplications of the HOXD locus on chromosome 2q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the cause of MDK, we performed array CGH and identified two
      microduplications on chromosome 2 (2q31.1-q31.2)
    explanation: >-
      Array CGH is the assay that identified the causal rearrangement.
  - reference: PMID:31591517
    reference_title: "Fryns type mesomelic dysplasia of the upper limbs caused by inverted duplications of the HOXD gene cluster."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By aCGH, whole-genome mate-pair sequencing, long-range PCR and fiber
      fluorescent in situ hybridization, we studied patients from two families
      displaying mesomelic dysplasia limited to the upper limbs. We identified
      microduplications including the HOXD cluster and showed that
      microduplications were in an inverted orientation
    explanation: >-
      Shows that orientation — recoverable only with structural assays beyond
      copy-number arrays — is part of the diagnostic answer at this locus.
differential_diagnoses:
- name: Fryns type mesomelic dysplasia of the upper limbs
  description: >-
    Same locus, same mechanism, different geometry: inverted duplications
    inserted between the HOXD cluster and the telomeric enhancers, producing
    isolated ulnar dysplasia confined to the upper limbs. Listed in the same
    ISDS row as the Kantaputra type but kept separate in MONDO and delimited as
    its own dominant condition in the literature.
  evidence:
  - reference: PMID:31591517
    reference_title: "Fryns type mesomelic dysplasia of the upper limbs caused by inverted duplications of the HOXD gene cluster."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results highlight the existence of an autosomal dominant condition
      consisting of isolated ulnar dysplasia caused by microduplications
      inserted between the HOXD cluster and the telomeric enhancers.
    explanation: >-
      Delimits the Fryns type as its own condition with its own rearrangement
      geometry, which is why it is a differential here rather than a subtype.
- name: Mesomelic dysplasia with vertebral defects (t(2;8) translocation)
  description: >-
    A balanced translocation with a breakpoint about 60 kb from HOXD, causing
    upper-limb mesomelic dysplasia together with vertebral defects. The same
    regulatory mechanism reached by a different rearrangement class; the
    vertebral component reflects HOXD's role in axial as well as limb
    patterning.
  evidence:
  - reference: PMID:11944980
    reference_title: "A t(2;8) balanced translocation with breakpoints near the human HOXD complex causes mesomelic dysplasia and vertebral defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The HOXD complex lies approximately 60 kb from the translocation
      breakpoint on chromosome 2. This cluster of genes has an important role in
      the development of both the vertebral column and the limbs.
    explanation: >-
      Gives the breakpoint distance and the dual axial/limb role that explains
      the vertebral component.
- name: Leri-Weill dyschondrosteosis and Langer mesomelic dysplasia
  description: >-
    The SHOX-related mesomelic dysplasias. Neither produces carpal or tarsal
    synostosis, and a SHOX/PAR1 defect has been specifically excluded in
    Kantaputra-type patients.
discussions:
- discussion_id: mdk_geometry_to_phenotype_map
  kind: KNOWLEDGE_GAP
  prompt: >-
    What rule maps a given 2q31 rearrangement geometry onto which limb segments
    and which limb pairs are affected?
  attaches_to:
  - pathophysiology#Reallocation of Limb Enhancer-Promoter Contacts
  rationale: >-
    The locus produces at least three clinically separable conditions — the
    Kantaputra type affecting all four limbs, the Fryns type only the upper
    limbs, and a translocation form adding vertebral defects — from
    rearrangements that all sit within a megabase of each other. The mechanism
    is understood in the abstract (which enhancers reach HOXD13), but no
    published rule predicts the clinical picture from the breakpoints, and the
    nosology itself records that expression varies within families carrying the
    same allele. Until such a rule exists, a newly found 2q31 rearrangement
    cannot be given a prognosis, which is the practical question families ask.

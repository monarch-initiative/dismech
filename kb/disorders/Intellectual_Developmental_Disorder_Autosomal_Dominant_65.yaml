treatments:
- name: Supportive and Developmental Care
  description: >-
    No disease-specific therapy exists. Management is supportive: speech,
    physical and occupational therapy, special education, antiseizure
    medication for epilepsy, and CSF shunting for hydrocephalus. KDM4
    inhibitors are oncology tools and would be counterproductive in a
    loss-of-function disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    For de novo cases recurrence risk is low (germline mosaicism possible);
    for inherited variants the risk to offspring is 50% with variable
    expressivity, and biallelic offspring are possible where both parents
    carry a variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37526414
    reference_title: "Human phenotype caused by biallelic KDM4B frameshift variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our report suggests that homozygous KDM4B frameshift variants can be viable in humans at least female."
    explanation: Biallelic variants are viable, relevant to counselling where both parents carry a variant.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Exome or genome sequencing identifies the KDM4B variant; fetal agenesis of
    the corpus callosum or ventriculomegaly should prompt sequencing that
    includes KDM4B.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:

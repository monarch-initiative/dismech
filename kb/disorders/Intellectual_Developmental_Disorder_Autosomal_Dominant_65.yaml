name: Intellectual Developmental Disorder, Autosomal Dominant 65
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- MRD65
- mental retardation, autosomal dominant 65
- KDM4B-related neurodevelopmental disorder
description: >-
  Autosomal dominant intellectual developmental disorder 65 (MRD65) is a
  chromatinopathy caused by heterozygous variants in KDM4B (formerly JMJD2B),
  a JmjC-domain lysine demethylase that removes the repressive H3K9me3/me2
  histone mark. Affected individuals have global developmental delay with
  language and motor skills most affected, variable intellectual disability,
  dysmorphic features (no single feature consistent), and in a minority
  seizures and structural brain anomalies ranging from agenesis of the corpus
  callosum with hydrocephalus to polymicrogyria, abnormal hippocampi and cystic
  change. Behavioural abnormalities are reported. About
  two dozen patients are reported, mostly with de novo variants; a single
  biallelic case is more severely affected.

  Loss of KDM4B is proposed to leave excess repressive H3K9 methylation at
  neurodevelopmental loci, dysregulating their transcription. A heterozygous
  mouse reproduces the reduced brain volume, small dentate gyrus, partial
  corpus callosum agenesis and ventriculomegaly, and a neuron-specific knockout
  shows abnormal dendritic spine maturation with hyperactivity, memory deficits
  and seizures. There is no disease-specific therapy; management is supportive.
disease_term:
  preferred_term: intellectual developmental disorder, autosomal dominant 65
  term:
    id: MONDO:0023657
    label: intellectual developmental disorder, autosomal dominant 65
parents:
- Intellectual Disability
- Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 619320. ClinGen classifies KDM4B
  for MRD65 as Strong (2024). Not to be confused with the autosomal recessive
  KDM5B-related intellectual disability (a different demethylase; see #11440).
  The mechanism below is inferred for patients: KDM4B enzymatic function is
  established, the brain-malformation and synaptic steps are from mouse models,
  and no patient-tissue transcriptomic data exist. One biallelic (homozygous)
  human case exists and is more severely affected than the heterozygous
  mother. No GeneReviews chapter covers the disorder; the baseline is the
  Duncan et al. cohort and later case reports.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous KDM4B variants, mostly de novo, some inherited from mildly
    affected or apparently unaffected parents (incomplete penetrance, variable
    expressivity). A single biallelic case is reported and more severe.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

pathophysiology:
- name: KDM4B Loss of Function
  description: >-
    Heterozygous truncating, or missense variants in the catalytic JmjC or PHD
    domains, reduce functional KDM4B. A frameshift predicted to undergo
    nonsense-mediated decay and a fetal insertion with reduced protein support
    loss of function; for missense variants it is inferred.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KDM4B
    term:
      id: hgnc:29136
      label: KDM4B
  molecular_functions:
  - preferred_term: histone H3K9 demethylase activity
    modifier: DECREASED
    term:
      id: GO:0032454
      label: histone H3K9 demethylase activity
  downstream:
  - target: Excess Repressive H3K9 Methylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37526414
    reference_title: "Human phenotype caused by biallelic KDM4B frameshift variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous KDM4B loss-of-function variants cause autosomal dominant intellectual developmental disorder 65"
    explanation: The disorder is caused by KDM4B loss of function.
  - reference: PMID:38270710
    reference_title: "Genotype-phenotype correlation study of structural abnormalities in a fetal brain caused by a novel KDM4B variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The WB results indicated significantly reduced expression of the mutant protein, likely owing to decreased stability."
    explanation: A variant reduces KDM4B protein level.
- name: Excess Repressive H3K9 Methylation
  description: >-
    With less KDM4B, H3K9me3/me2 is under-demethylated, leaving excess
    repressive heterochromatin marks at target loci in neural progenitors and
    neurons. The enzymatic activity is established; the chromatin state in
    patients is inferred.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromatin organization
    modifier: ABNORMAL
    term:
      id: GO:0006325
      label: chromatin organization
  downstream:
  - target: Dysregulated Neurodevelopmental Transcription
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33232677
    reference_title: "Heterozygous Variants in KDM4B Lead to Global Developmental Delay and Neuroanatomical Defects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "H3K9 tri/di-demethylation is an important epigenetic mechanism responsible for silencing of gene expression in animal development and cancer."
    explanation: KDM4B removes the H3K9me3/me2 mark, so its loss leaves excess of it.
- name: Dysregulated Neurodevelopmental Transcription
  description: >-
    Altered H3K9 methylation dysregulates transcription of neurodevelopmental
    genes, disturbing progenitor proliferation, migration and neuronal
    maturation. Inferred; no patient transcriptomic data exist.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: forebrain development
    modifier: ABNORMAL
    term:
      id: GO:0030900
      label: forebrain development
  downstream:

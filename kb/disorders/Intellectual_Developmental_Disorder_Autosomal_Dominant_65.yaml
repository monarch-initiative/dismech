    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Defective Dendritic Spine Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27023172
    reference_title: "Deletion of JMJD2B in neurons leads to defective spine maturation, hyperactive behavior and memory deficits in mouse."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "JMJD2B is a histone demethylase enzyme that regulates gene expression through demethylation of H3K9me3."
    explanation: Established enzyme biochemistry restated in the mouse study's introduction, that KDM4B/JMJD2B regulates gene expression through H3K9me3 demethylation.
- name: Abnormal Forebrain Morphogenesis
  description: >-
    In a heterozygous mouse, total brain volume is reduced with a small

    reference_title: "Heterozygous Variants in KDM4B Lead to Global Developmental Delay and Neuroanatomical Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutant mice, the total brain volume was significantly reduced with decreased size of the hippocampal dentate gyrus, partial agenesis of the corpus callosum, and ventriculomegaly."

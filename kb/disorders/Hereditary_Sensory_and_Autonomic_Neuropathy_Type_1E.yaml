genetic:
- name: DNMT1
  association: Causal
  gene_term:
    preferred_term: DNMT1
    term:
      id: hgnc:2976
      label: DNMT1
  notes: >-
    All reported causal variants lie in exons 20 and 21, encoding the targeting
    sequence (replication focus targeting sequence) domain. Reported alleles include
    c.1484A>G (p.Tyr495Cys) in American and Japanese kindreds, the triple-nucleotide
    change c.1470-1472TCC>ATA (p.Asp490Glu-Pro491Tyr) in a European kindred, a novel
    p.Tyr495His, and c.1706A>G (p.His569Arg) in exon 21 in a sporadic Japanese case.
    Structural analysis of the founding variants indicates that Tyr495 sits in the
    hydrophobic core while Asp490 is solvent-accessible and unlikely to contribute,
    so within the p.Asp490Glu-Pro491Tyr allele the Pro491 change is the likely driver.
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing led to the identification of DNMT1 mutation c.1484A>G (p.Tyr495Cys) in two American kindreds and one Japanese kindred and a triple nucleotide change, c.1470-1472TCC>ATA (p.Asp490Glu-Pro491Tyr), in one European kindred."
    explanation: Establishes DNMT1 as causal and names the founding alleles.
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Asp490 is solvent accessible (ASA is 75.3 Å2) and is therefore unlikely to contribute to the disease phenotype (Fig. 2f)."
    explanation: The structural argument that dissects which half of the double substitution matters.
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a next-generation sequencing system, 16 candidate genes were analyzed and a novel missense mutation, c.1706A>G (p.His569Arg), was identified in exon 21 of DNMT1."
    explanation: The exon 21 allele producing an HSAN phenotype.
progression:
- phase: Adult onset and course
  age_range: onset 18-51 years (mean 37.7); survival 43-75 years (mean 53.6)
  notes: >-
    Onset is in adulthood and the course is measured in decades, not years. In the
    largest cohort, mean onset was 37.7 years and mean survival 53.6 years, so roughly
    sixteen years separate the first symptom from death. That cohort's range is wide at
    both ends - onset from 18 to 51, survival from 43 to 75 - which is worth holding
    alongside the domain-position hypothesis, since a positional rule that predicted
    severity as well as phenotype would be expected to narrow it.
  evidence:
  - reference: PMID:25678562
    reference_title: "Defects of mutant DNMT1 are linked to a spectrum of neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average survival of HSAN1E was 53.6 years"
    explanation: >-
      Mean survival across 45 affected subjects. Quoted short on purpose: the source
      sentence continues into a bracketed standard deviation, and the reference
      validator strips bracketed spans before matching, so a quote straddling the
      bracket fails verification even when it is character-for-character exact.
  - reference: PMID:25678562
    reference_title: "Defects of mutant DNMT1 are linked to a spectrum of neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mean onset age was 37.7 years"
    explanation: Mean age at onset in the same cohort, quoted separately for the same bracket reason.
diagnosis:
- name: Molecular genetic testing of DNMT1
  description: >-
    The diagnosis rests on finding a heterozygous DNMT1 pathogenic variant. Because
    the mutational spectrum is confined to exons 20 and 21, targeted sequencing of
    those exons is sufficient in a typical presentation, and that concentration is
    what the original cohort exploited.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because all reported mutations of DNMT1 are concentrated in exons 20 and 21, which encode the replication focus targeting sequence (RFTS) domain of Dnmt1, the RFTS domain could be a mutation hot spot."
    explanation: The basis for targeting those two exons diagnostically.
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DNMT1 disorder is established by identification of a heterozygous pathogenic variant in DNMT1 by molecular genetic testing."
    explanation: >-
      The GeneReviews diagnostic criterion, which makes the molecular test confirmatory
      rather than merely supportive. The item above says which exons to sequence; this
      one says that sequencing is what establishes the diagnosis.
- name: Electrophysiologic and Imaging Characterization
  description: >-
    None of this establishes the diagnosis - the DNMT1 variant does that - but it is
    what distinguishes the disease from its differentials before a variant is in hand,
    and what stages it afterwards. The reported work-up spans nerve conduction and
    electromyography, sural nerve biopsy, brain MRI and nuclear imaging,
    electroencephalography, sleep evaluation and neuropsychometry. Two findings are
    worth separating out because they change what the electrophysiology means: a case
    with severe sensory ataxia had largely preserved peripheral sensory nerve function
    with absent lower-limb somatosensory evoked potentials and spinal cord atrophy on
    MRI, so the deficit was a central tractopathy rather than a peripheral neuropathy.
    A normal nerve conduction study early in the course does not exclude the disease.
  diagnosis_term:
    preferred_term: nerve conduction study and electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:25678562
    reference_title: "Defects of mutant DNMT1 are linked to a spectrum of neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic characterizations included electromyography, brain magnetic resonance and nuclear imaging, electroencephalography, sural nerve biopsies, sleep evaluation and neuropsychometric testing."
    explanation: The modality set used to characterize the cohort, which is the practical work-up.
  - reference: PMID:32754641
    reference_title: "Expanded genetic insight and clinical experience of DNMT1-complex disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "his leg sensory abnormalities were primarily resulted from tractopathy originated from the central sensory pathways of the spinal cord instead of peripheral nerves"
    explanation: >-
      Why the electrophysiology needs reading carefully in this disease: the sensory
      deficit can be central, so a preserved sural response does not exclude it.
  - reference: PMID:32754641
    reference_title: "Expanded genetic insight and clinical experience of DNMT1-complex disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiometry at age 32 years was normal bilaterally, and nerve conduction study did not show evidence of polyneuropathy."
    explanation: >-
      A normal study in an affected individual, which is the reason a negative
      work-up early in the course is not reassuring.
treatments:
- name: Protective Foot and Skin Care for the Insensate Limb
  description: >-
    There is no disease-modifying therapy. The intervention with the clearest
    mechanistic rationale is preventing the injury the patient cannot feel: daily foot
    inspection, protective socks and shoes, and avoiding exposures that would injure
    skin with reduced sensation. This targets the downstream complication - infection
    and amputation - rather than the neuropathy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventive skin and foot care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Length-Dependent Sensory Axonal Degeneration
    description: >-
      Protection does not slow the degeneration; it prevents the injury that the
      degeneration makes possible. The link is recorded so the treatment attaches to
      the mechanism it mitigates the consequences of.
  evidence:
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The emphasis of management is to help affected individuals and their caregivers understand the sudomotor defect and injury prevention when sensory impairment is significant."
    explanation: The GeneReviews management statement, naming injury prevention as the emphasis.
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of feet daily for evidence of skin injury; annual routine clinical testing for dementia and audiogram to monitor hearing loss."
    explanation: >-
      The full GeneReviews surveillance recommendation. The daily foot inspection is
      what this treatment is; the annual dementia and audiogram testing is recorded
      here too because the three are one recommendation in the source.
- name: Hearing Amplification and Assistive Communication
  description: >-
    Hearing loss is often the first and sometimes the most disabling feature, and
    because it arrives before the dementia it is the one deficit that can be
    meaningfully supported while the patient can still use the support.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  evidence:
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because hearing loss may be severe, initial use of hearing aids and/or assistive communication methods may be needed."
    explanation: The GeneReviews recommendation for the auditory component.
- name: Sedative or Antipsychotic Pharmacotherapy for the Behavioural Symptoms of Dementia
  description: >-
    Symptomatic, and directed at the neuropsychiatric end of the disease rather than
    at the neuropathy. GeneReviews names sedative or antipsychotic drugs for the
    restlessness, roaming, delusions and hallucinations that accompany the dementia.
    This is the treatment for two phenotypes this entry already curates - Dementia and
    Auditory or visual hallucinations - which previously had none.

    No agent, dose or trial is named in the source, and none should be inferred here.
    The recommendation is a class-level statement of what helps, not evidence that a
    particular drug was studied in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antipsychotic agent
      term:
        id: NCIT:C29710
        label: Antipsychotic Agent
  target_mechanisms:
  - target: Central Nervous System Atrophy
    description: >-
      The link is symptomatic, not disease-modifying. These drugs do not slow the
      cortical degeneration; they manage the behavioural disturbance that the
      degeneration produces.
  evidence:
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sedative or antipsychotic drugs help to reduce extreme restlessness, roaming behavior, delusions, and hallucinations associated with dementia."
    explanation: The GeneReviews management statement, naming the drug classes and the symptoms they address.
- name: Caregiver Education and Psychological Support
  description: >-
    GeneReviews calls this essential rather than optional, and the reason is specific
    to this disease: loss of insight and judgment means the burden falls on partners
    and carers at exactly the point the patient stops being able to describe what is
    happening. Recorded as a treatment rather than as a note because the source places
    it in MANAGEMENT alongside the drugs.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: caregiver education and psychological support
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because behavioral changes and the loss of insight and judgment often present a considerable burden for partners or other caregivers, information about the disorder and psychological support for partners or other caregivers are essential."
    explanation: The GeneReviews statement, including the reason the burden falls where it does.
- name: Cochlear Implantation
  description: >-
    The one intervention in this entry with a measured outcome in a genetically
    confirmed patient rather than a class recommendation. A woman with the de novo
    p.T497P variant and bilateral severe sensorineural hearing loss received a left
    cochlear implant at age 38 and her audiograms improved dramatically; she began
    participating in conversations again.

    The caveat is as important as the result and is the authors' own. Her memory
    decline continued and limited the benefit, and they conclude that implantation
    before significant cognitive decline is likely to help more. That makes this a
    time-dependent intervention in a disease whose hearing loss arrives one to two
    decades before the dementia - which is the window this entry's progression
    section describes.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:32754641
    reference_title: "Expanded genetic insight and clinical experience of DNMT1-complex disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss treatment by cochlear implantation is helpful and should be considered."
    explanation: The authors' recommendation, drawn from the single implanted case below.
  - reference: PMID:32754641
    reference_title: "Expanded genetic insight and clinical experience of DNMT1-complex disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two months after surgery, she started participating in conversations and reported to hear the neighbors' dog barking across the street, something she could not do previously."
    explanation: >-
      The measured outcome in a genetically confirmed patient. A single case, which is
      why the claim here is that implantation worked in this patient rather than that
      it works in this disease.
  - reference: PMID:32754641
    reference_title: "Expanded genetic insight and clinical experience of DNMT1-complex disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her experience also indicated that an early implantation before significant cognitive decline is likely to have more beneficial effects on quality of life."
    explanation: >-
      The timing constraint, and the reason this intervention cannot simply be deferred:
      the benefit is bounded by the dementia that follows the hearing loss.
notes: >-
  Three things a reviewer is likely to look for and not find, recorded here so they
  read as decisions rather than as omissions.

  Narcolepsy and cataplexy pharmacotherapy is not curated. The deep-research report
  names wake-promoting agents and sodium oxybate and cites PMID:24727570 for them.
  That paper is cached on this branch and contains no treatment content at all - it
  is a phenotyping and CSF hypocretin study. A targeted search found no publication
  reporting narcolepsy pharmacotherapy in DNMT1 disorder specifically. Curating the
  treatment would mean citing general narcolepsy management for a claim about this
  disease, or citing a paper for a sentence it does not contain. Both are worse than
  the gap, so the gap stands until a real source exists.

  Charcot arthropathy is not curated. The research report lists it as Common and
  binds it to HP:0002828, which is Multiple joint contractures rather than a
  neuropathic arthropathy - the correct term would be HP:0002821. More to the point,
  no source on this branch reports neuropathic arthropathy in DNMT1 disorder; the
  only occurrence of "Charcot" across the cached references is Charcot-Marie-Tooth in
  a family history. The published Charcot-joint literature reached from this disease
  is about congenital insensitivity to pain with anhidrosis and HSAN II, which are
  different genes and different diseases. What this entry does curate from real
  sources is the injury pathway that would produce it: impaired pain sensation,
  painless foot ulcers, an unfelt toe fracture, and chronic osteomyelitis.

  Impaired temperature sensation is not curated for the same reason - no cached source
  names it in this disease, only pain and vibration.

  Relationship to ADCA-DN. The two are allelic DNMT1 targeting-sequence-domain
  disorders and GeneReviews treats them as one phenotypic spectrum under the title
  "DNMT1-Related Disorder". They are curated here as separate Disease entries -
  ADCA-DN already existed on main - because their leading clinical problems differ
  (sensory neuropathy and painless injury here, cerebellar ataxia and narcolepsy
  there) and their MONDO terms are distinct. The mechanistic_hypotheses block records
  that the boundary between them is contested rather than settled, and the evidence
  for and against the exon-position rule is curated on both sides.

  Two snippets in this entry are truncated at line boundaries in the cached source
  text (PMID:23365052 and PMID:22338191, both of which cache as hard-wrapped
  PubMed-style records rather than as single-line abstracts). Each is flagged in its
  own explanation with what follows it. They are quoted short rather than reflowed,
  because a snippet must be an exact substring of the cached reference and reflowing
  one would make it fail verification while looking more complete.

  No treatment here is disease-modifying, and GeneReviews says so directly. Both
  treatments listed act on consequences - the injury the patient cannot feel, and the
  hearing loss that arrives first.

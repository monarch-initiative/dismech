inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous DNMT1 variants segregate with disease in multiple kindreds and
    were absent from more than 1,500 unaffected controls. A sporadic case with a
    de novo-appearing variant has also been reported.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a group, HSAN1 has autosomal dominant inheritance with neurodegeneration that clinically manifests with loss of sensation leading to painless extremity injuries, infections and resultant amputations"
    explanation: States the inheritance mode of the disease group this entity belongs to, together with the clinical consequence of the sensory loss.
pathophysiology:
- name: DNMT1 Targeting-Sequence Domain Misfolding
  description: >-
    The initiating lesion. Causal variants cluster in the targeting sequence (TS,
    also RFTS) domain encoded by exons 20 and 21, and the residues involved sit in
    the hydrophobic core or the linker between the domain's two subdomains rather
    than at the catalytic site. Expressed in bacteria, wild-type TS domain is
    soluble while the mutant domains form inclusion bodies - direct evidence of
    misfolding rather than of an altered but folded protein.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Premature DNMT1 Degradation and Loss of Chromatin Targeting
    causal_link_type: DIRECT
    description: >-
      A misfolded domain is both unstable and unable to perform the binding the
      domain exists for, so the misfolding produces the degradation and the
      targeting failure together.
    evidence:
    - reference: PMID:21532572
      reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These mutations cause premature degradation of mutant proteins, reduced methyltransferase activity and impaired heterochromatin binding during the G2 cell cycle phase leading to global hypomethylation and site-specific hypermethylation."
      explanation: The founding paper's own causal chain, from the variant through protein stability and chromatin binding to the methylation phenotype.
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the TS mutants form inclusion bodies, a strong indication that they are misfolded (Supplementary Fig. 2)."
    explanation: Direct biophysical evidence that the variants destabilise the domain's fold.
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations are within the targeting-sequence domain of DNMT1."
    explanation: Establishes that the causal variants are confined to this one domain.
  - reference: PMID:28334952
    reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Strikingly, all causative mutations described to date affect a genomic region in DNMT1, which codes for the TS domain"
    explanation: Independent confirmation that the mutational spectrum is restricted to this domain.
  - reference: PMID:26070743
    reference_title: "Crystal Structure of Human DNA Methyltransferase 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The RFTS domain directly associates with the methyltransferase domain, thereby inhibiting the substrate binding of hDNMT1."
    explanation: >-
      Structural evidence that the domain the variants destabilise is not only a
      targeting module but an autoinhibitory one, which is why a misfold there disturbs
      catalysis without touching the active site.
  - reference: PMID:25678562
    reference_title: "Defects of mutant DNMT1 are linked to a spectrum of neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five novel mutations of DNMT1 were discovered; p.C353F, p.T481P, p.P491L, p.Y524D and p.I531N, all within the target-sequence domain, and two mutations (p.T481P, p.P491L) arising de novo."
    explanation: >-
      Five further alleles, all in the same domain, and the first de novo cases -
      which matter because they establish the variants as causal independently of
      segregation.
- name: Premature DNMT1 Degradation and Loss of Chromatin Targeting
  description: >-
    Three consequences of the same misfold, which is why they are one node rather
    than three. The protein is degraded in late S and G2 phase; it fails to remain
    associated with heterochromatin when it should; and it loses the UHRF1
    interaction that normally delivers it to hemimethylated substrate after
    replication. The enzyme's catalytic domain is intact, so this is a failure of
    delivery and persistence rather than of chemistry - which is why measured
    methyltransferase activity falls without the active site being touched.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Global Hypomethylation with Site-Specific Hypermethylation
    causal_link_type: DIRECT
    description: >-
      An enzyme that is not delivered to its substrate and does not persist through
      the cell cycle cannot maintain the methylation pattern across replication.
    evidence:
    - reference: PMID:28334952
      reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we showed that DNMT1 mutations P496Y and Y500C identified in HSANIE patients not only impair DNMT1 heterochromatin association, but also UHRF1 interaction resulting in hypomethylation."
      explanation: Traces the specific molecular failures - chromatin association and UHRF1 binding - through to the methylation outcome.
  evidence:
  - reference: PMID:28334952
    reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "With cell-based assays, we could show that HSANIE associated mutations perturb DNMT1 heterochromatin association and catalytic complex formation at methylation sites and decrease protein stability in late S and G2 phase."
    explanation: Names all three components of this node and the cell-cycle phase in which the instability appears.
  - reference: PMID:25033457
    reference_title: "Aberrant signature methylome by DNMT1 hot spot mutation in hereditary sensory and autonomic neuropathy 1E."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant DNMT1 protein shows premature degradation and reduced DNA methyltransferase activity."
    explanation: Independent statement of the stability and activity defect.
- name: Global Hypomethylation with Site-Specific Hypermethylation
  description: >-
    The epigenomic phenotype, and the reason this disease is not simply "loss of
    methylation". Whole-genome bisulfite sequencing of three patient-sibling pairs
    found consistent methylation loss across all chromosomes, with X and chromosome
    18 most affected, and over half a million differentially methylated CpG sites.
    Hypomethylation predominates in promoters, exons, most CpG islands and repeat
    classes - but within some CpG islands hypermethylated sites outnumber
    hypomethylated ones, and imprinted genes carry more differentially methylated
    sites than non-imprinted genes. A maintenance enzyme that is mistargeted rather
    than simply absent produces exactly this mixed picture.
  biological_scale: CELLULAR
  downstream:
  - target: Neuronal Apoptosis and Failed Neuronal Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cells expressing mutant DNMT1 die and fail to become neurons. Which of the
      thousands of differentially methylated regions mediates this is not
      established, so the intermediates are recorded as unknown.
    evidence:
    - reference: PMID:28334952
      reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To investigate the neuronal phenotype of HSANIE mutations, we performed DNMT1 rescue assays and could show that cells expressing mutated DNMT1 were prone to apoptosis and failed to differentiate into neuronal lineage."
      explanation: >-
        The cellular consequence, demonstrated in a rescue assay so the effect is
        attributable to the mutant protein rather than to the assay background.
  evidence:
  - reference: PMID:25033457
    reference_title: "Aberrant signature methylome by DNMT1 hot spot mutation in hereditary sensory and autonomic neuropathy 1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the 3 affected siblings, overall methylation loss was consistently found in all chromosomes with X and 18 being most affected."
    explanation: The genome-wide hypomethylation result in patient germline DNA.
  - reference: PMID:25033457
    reference_title: "Aberrant signature methylome by DNMT1 hot spot mutation in hereditary sensory and autonomic neuropathy 1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some CpG islands, hypermethylated CpGs outnumbered hypomethylated CpGs. In 201 imprinted genes, there were more DMCs than in non-imprinted genes and most were hypomethylated."
    explanation: >-
      The site-specific hypermethylation and the imprinted-gene excess, which are what
      make this node a redistribution rather than a simple deficit.
  - reference: PMID:25033457
    reference_title: "Aberrant signature methylome by DNMT1 hot spot mutation in hereditary sensory and autonomic neuropathy 1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differentially methylated region (DMR) analysis identified 5649 hypomethylated and 1872 hypermethylated regions."
    explanation: Quantifies the two directions of change at region level.
- name: Neuronal Apoptosis and Failed Neuronal Differentiation
  description: >-
    The cellular consequence. DNMT1 is highly expressed in postmitotic neurons
    despite its canonical role being replication-coupled, which is the standing
    puzzle of this disease: how a maintenance methyltransferase defect damages cells
    that are not dividing. Cells expressing mutant DNMT1 are apoptosis-prone and
    fail to enter the neuronal lineage in differentiation assays.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Length-Dependent Sensory Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sensory neurons are among the cell types lost. Why the loss is length-dependent
      and why sensory neurons are affected before motor neurons is not established.
  - target: Central Nervous System Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same cellular vulnerability in the central nervous system, producing the
      global atrophy seen on imaging and at autopsy.
  evidence:
  - reference: PMID:28334952
    reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite its well-known replication-coupled function as maintenance DNA methyltransferase in proliferating cells, DNMT1 is highly expressed in embryonic and adult postmitotic neurons, especially in the central nervous system (CNS)"
    explanation: The expression fact that makes a postmitotic neuronal phenotype possible at all for a replication-coupled enzyme.
- name: Length-Dependent Sensory Axonal Degeneration
  description: >-
    The peripheral arm. Quantitative sensory testing, nerve conduction studies and
    nerve biopsy all indicate progressive sensory axonal loss in a length-dependent
    distribution, with nerve pathology showing axonal loss without inflammatory or
    infiltrative inclusions. Sensory nerve action potentials are absent while motor
    conduction is near-normal, which is what makes this a pure sensory neuropathy
    rather than a sensorimotor one.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative sensory testing, nerve conductions, and nerve biopsy were indicative of length dependent progressive sensory axonal loss."
    explanation: Three independent modalities converging on the same pathological description.
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological studies revealed absent sensory nerve action potential with nearly normal motor nerve conduction studies."
    explanation: The electrophysiological dissociation that establishes the selectivity for sensory fibres.
- name: Central Nervous System Atrophy
  description: >-
    The central arm. Brain imaging shows global atrophy and autopsied brains are
    reduced in weight; functional imaging in one kindred suggested medial frontal and
    thalamic hypometabolism. As in the nerve, the pathology is axonal loss without
    infiltrative inclusions, so this is not a proteinopathy.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain imaging of affected persons showed global atrophy and reduced weight of autopsied brains."
    explanation: Imaging and post-mortem evidence of central neurodegeneration.
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologic studies of affected persons' nerve7, brain14 and spinal cord (Fig. 1) show axonal loss without interstitial infiltrative inclusions."
    explanation: >-
      Establishes that the lesion is axonal loss rather than an inclusion pathology.
      The snippet carries the source's inline reference markers, quoted as written.
mechanistic_hypotheses:
- hypothesis_group_id: domain_position_phenotype_correlation
  hypothesis_label: Whether variant position within the targeting-sequence domain determines HSAN1E versus ADCA-DN
  status: EMERGING
  description: >-
    HSAN1E and ADCA-DN are allelic - both are caused by DNMT1 targeting-sequence
    domain variants - and the usual summary is that exon 20 gives HSAN1E and exon 21
    gives ADCA-DN. GeneReviews treats them as one phenotypic spectrum rather than two
    diseases, which is the same observation from the other direction.

    The correlation is not clean. A Japanese patient with an exon 21 variant
    (p.His569Arg) presented with the HSAN phenotype and no definite cerebellar
    ataxia. A separate DNMT1 variant has been reported with an overlapping phenotype
    spanning both syndromes. And narcolepsy, once treated as the ADCA-DN
    discriminator, has been found to be common in HSAN1E as well. Meanwhile two
    HSAN1E kindreds with canonical targeting-sequence variants had no narcolepsy at
    all, and one showed prominent psychiatric features and seizures with later onset
    than previously reported cases.

    The strongest version of the rule is not about exons at all but about position
    within the domain. A nine-kindred, 45-subject cohort found every HSAN1E mutation
    in the middle or N-terminal end of the targeting-sequence domain and every ADCA-DN
    mutation at its C-terminal end - a finer and more mechanistically plausible
    statement than the exon 20 / exon 21 shorthand, and one the exon 21 HSAN case does
    not straightforwardly contradict, since exon boundaries and domain sub-regions are
    not the same partition.

    So position within the domain is a real gradient rather than a rule with a
    counterexample, but what it controls - why an N-terminal lesion takes the sensory
    neurons and a C-terminal one the cerebellum - is unresolved. This entry is curated
    as a distinct Disease from ADCA-DN on clinical grounds, which is also how the
    deepest phenotyping study of both describes them: two discrete clinical entities in
    one spectrum, overlapping to a variable degree.
  evidence:
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, two phenotypes produced by DNMT1 mutations have been reported, including hereditary sensory and autonomic neuropathy (HSAN) type IE with mutations in exon 20, and autosomal dominant cerebellar ataxia, deafness, and narcolepsy caused by mutations in exon 21."
    explanation: States the exon-to-phenotype correlation in its standard form.
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that mutation in exon 21 of DNMT1 may also produce a HSAN phenotype."
    explanation: >-
      The same paper's own counterexample to the rule it just stated. Recorded as
      REFUTE against the positional hypothesis, from a source that supports the
      hypothesis's premise.
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because all reported mutations of DNMT1 are concentrated in exons 20 and 21, which encode the replication focus targeting sequence (RFTS) domain of Dnmt1, the RFTS domain could be a mutation hot spot."
    explanation: The shared-domain premise both phenotypes rest on.
  - reference: PMID:23365052
    reference_title: "DNMT1 mutation hot spot causes varied phenotypes of HSAN1 with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One family carried previously identified mutation Tyr495Cys; the other carried a novel Tyr495His, both in the TS domain."
    explanation: Two kindreds with different substitutions at the same residue, which is the finest-grained version of the position question.
  - reference: PMID:25678562
    reference_title: "Defects of mutant DNMT1 are linked to a spectrum of neurological disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that all the mutations causal for HSAN1E are located in the middle part or N-terminus end of the TS domain, whereas all the mutations causal for autosomal dominant cerebellar ataxia, deafness and narcolepsy are located in the C-terminus end of the TS domain."
    explanation: >-
      The strongest statement of the positional rule, from the largest cohort - nine
      kindreds, 45 affected subjects - and framed by sub-domain position rather than by
      exon, which is what makes it survive the exon 21 counterexample.
  - reference: PMID:24727570
    reference_title: "Narcolepsy is a common phenotype in HSAN IE and ADCA-DN."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome and direct sequencing studies disclosed two different point mutations affecting exon 21 of DNMT1 gene in patients with ADCA-DN, a novel heterozygous point mutation in exon 20 in two affected HSAN IE siblings, and a trinucleotide deletion in exon 20 in the latter patient with HSAN IE."
    explanation: Independent segregation of exon 20 with HSAN1E and exon 21 with ADCA-DN across four families.
  - reference: PMID:24727570
    reference_title: "Narcolepsy is a common phenotype in HSAN IE and ADCA-DN."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic characterization pinpoints that ADCA-DN and HSAN IE represent two discrete clinical entities belonging to the same disease spectrum, with variable degree of overlap."
    explanation: >-
      The nosological conclusion this entry follows in curating the two separately while
      recording the spectrum, from the study that phenotyped both most deeply.
- hypothesis_group_id: postmitotic_neuron_vulnerability
  hypothesis_label: Why a replication-coupled maintenance methyltransferase damages postmitotic neurons
  status: EMERGING
  description: >-
    DNMT1's canonical job is copying the methylation pattern onto newly replicated
    DNA, which postmitotic neurons do not do. Yet the enzyme is highly expressed in
    adult neurons, and the disease is a neurodegeneration with no reported phenotype
    in the rapidly dividing tissues one would expect a maintenance methylation defect
    to hit first.

    Candidate explanations available in the literature cited here: the methylome
    analysis found that genes associated with differentially methylated regions were
    enriched for neurological disorders and implicated NAD+/NADH metabolism; the
    cellular work found apoptosis-proneness and failed neuronal differentiation,
    suggesting the lesion may act during neurogenesis rather than only in mature
    neurons. Neither has been shown to be the operative mechanism in patients, and
    the authors of the cellular study say so directly.
  evidence:
  - reference: PMID:25033457
    reference_title: "Aberrant signature methylome by DNMT1 hot spot mutation in hereditary sensory and autonomic neuropathy 1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, pathway analysis revealed 1693 genes associated with the identified DMRs were highly associated in diverse neurological disorders and NAD+/NADH metabolism pathways is implicated in the pathogenesis."
    explanation: >-
      A candidate route from the methylome change to neuronal vulnerability. This is a
      pathway enrichment over differentially methylated regions, not a demonstrated
      mechanism, and is treated accordingly.
  - reference: PMID:28334952
    reference_title: "DNMT1 mutations found in HSANIE patients affect interaction with UHRF1 and neuronal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the pathophysiological trajectories underlying these neurological disorders caused by DNMT1 mutations remain mostly unknown."
    explanation: The explicit statement that the mechanism is unresolved, which is why this is recorded as a hypothesis rather than as pathophysiology.
phenotypes:
- category: Neurological
  name: Sensory neuropathy with painless injury
  description: >-
    The defining peripheral phenotype. Loss of pain and vibration sense leads to
    unnoticed extremity injury, chronic infection including osteomyelitis, and
    amputation.
  phenotype_term:
    preferred_term: Sensory neuropathy
    term:
      id: HP:0000763
      label: Sensory neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a sporadic case in a Japanese patient with loss of pain and vibration sense, chronic osteomyelitis, autonomic system dysfunctions, hearing loss, and mild dementia, but without definite cerebellar ataxia."
    explanation: A single-patient description covering the sensory loss and its infective complication.
- category: Musculoskeletal
  name: Chronic osteomyelitis
  description: >-
    A consequence of the sensory loss rather than a primary feature: unfelt injury to
    an insensate extremity becomes chronic infection.
  phenotype_term:
    preferred_term: Osteomyelitis
    term:
      id: HP:0002754
      label: Osteomyelitis
    temporality: CHRONIC
  evidence:
  - reference: PMID:23521649
    reference_title: "Novel mutation in the replication focus targeting sequence domain of DNMT1 causes hereditary sensory and autonomic neuropathy IE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss of pain and vibration sense, chronic osteomyelitis, autonomic system dysfunctions"
    explanation: Records the osteomyelitis alongside the sensory loss that permits it.
- category: Auditory
  name: Sensorineural hearing loss
  description: >-
    Moderate-to-severe sensorineural hearing loss, beginning in the teens or early
    twenties and so typically the first manifestation.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected persons had very similar phenotypes (Table 1) and were normal in youth, but developed worsening sensorineural deafness and sensory neuropathy by ages 20-35 years."
    explanation: The age of onset and the pairing of deafness with the neuropathy.
- category: Neurological
  name: Dementia
  description: >-
    Progressive cognitive and behavioural decline, typically from the fourth decade,
    and the feature that turns the disease from a neuropathy into a condition
    requiring total care.
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21532572
    reference_title: "Mutations in DNMT1 cause hereditary sensory neuropathy with dementia and hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive cognitive and behavioral declines occurred by the fourth decade."
    explanation: The onset decade for the cognitive arm.
- category: Autonomic
  name: Sudomotor dysfunction
  description: >-
    Loss of sweating, listed by GeneReviews among the core features and part of the
    autonomic component that gives the disease its "autonomic" designation.
  phenotype_term:
    preferred_term: Hypohidrosis
    term:
      id: HP:0000966
      label: Hypohidrosis
  evidence:
  - reference: PMID:22338191
    reference_title: "DNMT1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "beginning in the teens or early 20s, sensory impairment, sudomotor dysfunction"
    explanation: >-
      The GeneReviews clinical characterisation, naming sudomotor dysfunction alongside
      the sensory impairment and the onset decade. Quoted to the end of the cached line
      because the record is hard-wrapped; the parenthetical "(loss of sweating)" follows
      on the next line.
- category: Autonomic
  name: Autonomic dysfunction
  description: >-
    Broader autonomic involvement beyond the sudomotor defect, recorded in a genotyped
    patient alongside the sensory loss. The disease is a hereditary sensory *and
    autonomic* neuropathy, so this is a defining component rather than an
    accompaniment. HPO retired its Dysautonomia term (HP:0002459) in favour of

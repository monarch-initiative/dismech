name: Hereditary Sensory and Autonomic Neuropathy Type 1E
creation_date: "2026-09-13T00:00:00Z"
category: Mendelian
synonyms:
- HSAN1E
- HSAN IE
- hereditary sensory neuropathy-deafness-dementia syndrome
- hereditary sensory and autonomic neuropathy with dementia and hearing loss
- HSAN1 with dementia and hearing loss
- DNMT1-related disorder, HSAN1E phenotype
description: >-
  Hereditary sensory and autonomic neuropathy type 1E (HSAN1E) is an adult-onset
  neurodegenerative disease caused by heterozygous variants in DNMT1, the
  maintenance DNA methyltransferase. It was the first adult-onset
  neurodegenerative disorder attributed to a defect in a methyltransferase gene.

  Every causal variant reported to date lies in the targeting sequence domain
  (also called the replication focus targeting sequence, RFTS), encoded by exons
  20 and 21. The domain is not the catalytic site: it controls where and when the
  enzyme acts, holding DNMT1 on heterochromatin during late S, G2 and M phase and
  mediating the UHRF1 interaction that delivers the enzyme to hemimethylated
  substrate. Mutant targeting-sequence domains misfold, are degraded prematurely,
  bind heterochromatin poorly and lose the UHRF1 interaction. The methylation
  consequence is not simple loss: whole-genome bisulfite sequencing of patients
  shows widespread hypomethylation together with site-specific hypermethylation,
  with imprinted genes disproportionately affected.

  Affected people are normal in youth, develop sensorineural deafness and a
  length-dependent sensory axonal neuropathy in their twenties and thirties, and
  then decline cognitively from the fourth decade. Sensory loss brings painless
  injury, chronic infection and amputation; sudomotor failure and, in some
  kindreds, narcolepsy with cataplexy complete the picture. There is no
  disease-modifying treatment.

  HSAN1E is allelic to ADCA-DN, which is curated separately here. The two are
  distinguished by which end of the same domain is hit, and the correlation is
  imperfect enough that this entry records it as an open question rather than a
  rule.

    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "IGHMBP2 is an ATP-dependent helicase, which binds to ribosomes and unwinds RNA and DNA duplexes."

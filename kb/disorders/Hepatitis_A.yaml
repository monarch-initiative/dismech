name: Hepatitis A
creation_date: "2026-08-22T00:00:00Z"
category: Infectious Disease
description: >-
  An acute, vaccine-preventable liver infection caused by hepatitis A virus
  (HAV), a positive-strand RNA picornavirus transmitted by the faecal-oral
  route through person-to-person contact and contaminated food or water. HAV
  causes an acute inflammatory reaction in the liver that in most people
  resolves spontaneously and leaves lifelong immunity. Critically, and unlike
  hepatitis B, C, D, and E, HAV never establishes chronic infection or chronic
  liver disease - the disease is either resolved or, rarely, fatal. Severity
  rises sharply with age at infection: children are usually asymptomatic while
  adults present with jaundice, abdominal pain, and hyperbilirubinaemia. Up to
  20% of patients have a prolonged or relapsing course and fewer than 1% develop
  acute liver failure. There is no specific antiviral treatment; care is
  supportive, and vaccination is the mainstay of control.
disease_term:
  preferred_term: hepatitis A virus infection
  term:
    id: MONDO:0005790
    label: hepatitis A virus infection
parents:
- Liver Disease
- Viral Hepatitis
infectious_agent:
- name: Hepatitis A virus (HAV)
  description: >-
    A small, non-enveloped positive-strand RNA virus of the family
    Picornaviridae (genus Hepatovirus). It is acid- and heat-stable, which
    underlies its persistence in the environment and its transmission through
    contaminated food and water.
  infectious_agent_term:
    preferred_term: Hepatovirus A
    term:
      id: NCBITaxon:12092
      label: Hepatovirus A
  evidence:
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis A virus (HAV) is a positive-strand RNA virus that is transmitted
      feco-orally through person-to-person contact.
    explanation: >-
      Identifies the agent's genome type and principal transmission route.
      Evidence source is OTHER because this is a clinical review.
transmission:
- name: Faecal-Oral Transmission
  description: >-
    Spread person-to-person by the faecal-oral route, and through food or water
    contaminated with faeces. Outbreaks cluster where sanitation is poor or
    populations are crowded. Infectivity peaks around the two weeks before
    jaundice appears, which is why outbreak control depends on rapid case
    identification rather than on isolating symptomatic people.
  evidence:
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Outbreaks are often linked to poor sanitation, overcrowding, or food and
      water contamination.
    explanation: >-
      Documents the settings in which faecal-oral transmission produces
      outbreaks. Evidence source is OTHER because this is a clinical review.
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      People are most infectious 14 days before and seven days after the
      development of jaundice.
    explanation: >-
      Establishes the infectious window relative to symptom onset, which is what
      makes presymptomatic spread the dominant transmission mode. Evidence
      source is OTHER because this is a clinical review.
pathophysiology:
- name: Faecal-Oral Acquisition and Hepatocyte Infection
  description: >-
    Ingested HAV reaches the liver and replicates in hepatocytes. The virus is
    shed back into bile and stool, sustaining faecal-oral transmission. Peak
    shedding and infectivity precede the onset of jaundice by roughly two weeks,
    so transmission is largely presymptomatic.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis A virus (HAV) is a positive-strand RNA virus that is transmitted
      feco-orally through person-to-person contact.
    explanation: >-
      Establishes the acquisition route that initiates this node. Evidence
      source is OTHER because this is a clinical review.
  downstream:
  - target: Acute Hepatic Inflammatory Reaction
    causal_link_type: DIRECT
    description: >-
      Infection of hepatocytes provokes an acute inflammatory response in the
      liver.

- name: Acute Hepatic Inflammatory Reaction
  description: >-
    HAV infection produces an acute inflammatory reaction in the liver, with
    hepatocellular injury reflected in raised transaminases and, when severe
    enough, jaundice and hyperbilirubinaemia. This is the central node of the
    disease and it is self-limiting in the great majority of cases. Whether it
    is clinically apparent at all depends on host factors rather than on viral
    ones - which is why the same infection is silent in a child and overt in an
    adult. B and T cell immunity is what controls the infection, and the injury
    is understood to be substantially immune-mediated rather than a direct
    cytopathic effect of the virus - but see the attached KNOWLEDGE_GAP: how
    adaptive immunity produces the liver injury, as distinct from clearing the
    virus, is not settled.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:37770459
    reference_title: "Hepatitis A virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HAV causes an acute inflammatory reaction in the liver that usually
      resolves spontaneously without chronic sequelae.
    explanation: >-
      States both the nature of this node and its usual outcome, including the
      absence of chronic sequelae that distinguishes HAV from the other
      hepatotropic viruses. Evidence source is OTHER because this is a review.
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection is often asymptomatic in children, but adults present with
      jaundice, abdominal pain, hepatitis, and hyperbilirubinemia.
    explanation: >-
      Documents the age-dependent clinical expression of this node. Evidence
      source is OTHER because this is a clinical review.
  - reference: PMID:29844218
    reference_title: "Adaptive Immune Responses in Hepatitis A Virus and Hepatitis E Virus Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The objective of this review is to summarize our understanding of the
      relationship between patterns of virus replication, adaptive immune
      responses, and acute liver injury in HAV and HEV infections.
    explanation: >-
      Establishes that acute liver injury in hepatitis A is understood in terms
      of the adaptive immune response rather than viral replication alone, which
      is the basis for annotating this node with adaptive immunity and its
      effector cells. Evidence source is OTHER because this is a review.
  downstream:
  - target: Host-Factor-Dependent Severity Modulation
    causal_link_type: DIRECT
    description: >-
      Host immunological status, age, pregnancy, and pre-existing liver disease
      determine how severe the inflammatory reaction becomes.
  - target: Spontaneous Resolution and Lifelong Immunity
    causal_link_type: DIRECT
    description: >-
      In most people the inflammatory reaction resolves and leaves protective
      anti-HAV IgG.

- name: Host-Factor-Dependent Severity Modulation
  description: >-
    The severity of hepatitis A is set by the host, not by viral genotype.
    Immunological status, age, pregnancy, and underlying liver disease all
    modify the outcome, which is why universal childhood vaccination in
    intermediate-endemicity settings and targeted vaccination of people with
    chronic liver disease are both rational strategies. Paradoxically,
    improvements in sanitation that delay the age of first exposure increase the
    burden of symptomatic disease.
  role: amplifier
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37770459
    reference_title: "Hepatitis A virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Host factors, such as immunological status, age, pregnancy and underlying
      hepatic diseases, can affect the severity of disease.
    explanation: >-
      Names the host variables that modulate this node, the basis for
      risk-targeted vaccination. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Prolonged, Relapsing, or Fulminant Course
    causal_link_type: DIRECT
    description: >-
      Unfavourable host factors shift the acute reaction toward a prolonged,
      relapsing, or fulminant course.

- name: Prolonged, Relapsing, or Fulminant Course
  description: >-
    A minority of patients depart from the usual self-limited course. Up to 20%
    have a prolonged or relapsing illness, and fewer than 1% develop acute liver
    failure. Acute liver failure is the mechanism of death in hepatitis A;
    because no antiviral exists, management is supportive and, in the most
    severe cases, transplantation.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37770459
    reference_title: "Hepatitis A virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, up to 20% of patients experience a prolonged or relapsed course
      and <1% experience acute liver failure.
    explanation: >-
      Quantifies both departures from the usual course. Evidence source is OTHER
      because this is a review.

- name: Spontaneous Resolution and Lifelong Immunity
  description: >-
    In the great majority of cases the infection resolves without treatment and
    without chronic sequelae. Anti-HAV IgG produced in response to infection
    persists for life and protects against re-infection; vaccine-induced
    antibody confers long-term protection by the same mechanism. This node is
    the reason hepatitis A has no chronic arm at all - there is no persistent
    reservoir, no cirrhosis pathway, and no virus-driven hepatocellular
    carcinoma.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37770459
    reference_title: "Hepatitis A virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anti-HAV IgG antibodies produced in response to HAV infection persist for
      life and protect against re-infection; vaccine-induced antibodies against
      hepatitis A confer long-term protection.
    explanation: >-
      Establishes lifelong humoral immunity after both natural infection and
      vaccination. Evidence source is OTHER because this is a review.
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease is usually self-limited, supportive care is often sufficient
      for treatment, and chronic infection or chronic liver disease does not
      occur.
    explanation: >-
      States explicitly that chronic infection does not occur, the guardrail
      that keeps this entry from being curated with a chronic arm. Evidence
      source is OTHER because this is a clinical review.
phenotypes:
- category: Clinical
  name: Jaundice
  description: >-
    Icterus with hyperbilirubinaemia, typical of symptomatic adult infection and
    usually absent in infected children.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infection is often asymptomatic in children, but adults present with
      jaundice, abdominal pain, hepatitis, and hyperbilirubinemia.
    explanation: >-
      Documents jaundice as a presenting feature in adults. Evidence source is
      OTHER because this is a clinical review.
- category: Clinical
  name: Constitutional Prodrome
  description: >-
    Fever and malaise typically precede jaundice and are more common in older
    children and adults than in young children. Dark urine accompanies the
    prodrome but is curated separately below, since it is bilirubinuria - an
    early marker of the cholestatic component - rather than a constitutional
    symptom.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Classic symptoms include fever, malaise, dark urine, and jaundice and are
      more common in older children and adults.
    explanation: >-
      Lists the prodromal symptoms and their age distribution. Evidence source
      is OTHER because this is a clinical review.
- category: Clinical
  name: Dark Urine
  description: >-
    Darkened urine from bilirubinuria, typically appearing with or shortly
    before jaundice. It reflects renal excretion of conjugated bilirubin that
    the inflamed liver cannot clear into bile, so it is a marker of the
    cholestatic component of the illness rather than a constitutional symptom.
  phenotype_term:
    preferred_term: Dark urine
    term:
      id: HP:0040319
      label: Dark urine
  evidence:
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Classic symptoms include fever, malaise, dark urine, and jaundice and are
      more common in older children and adults.
    explanation: >-
      Documents dark urine among the classic presenting features. Evidence
      source is OTHER because this is a clinical review.
- category: Clinical
  name: Acute Liver Failure
  description: >-
    Fulminant hepatic failure occurs in fewer than 1% of patients and is the
    mechanism of hepatitis A mortality.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Acute hepatic failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
  evidence:
  - reference: PMID:37770459
    reference_title: "Hepatitis A virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, up to 20% of patients experience a prolonged or relapsed course
      and <1% experience acute liver failure.
    explanation: >-
      Provides the frequency of acute liver failure recorded here as VERY_RARE
      (<1%). Evidence source is OTHER because this is a review.
diagnosis:
- name: Anti-HAV IgM Serology
  description: >-
    Acute hepatitis A is diagnosed by detecting IgM antibodies against HAV.
    Anti-HAV IgG, in contrast, marks past infection or vaccination and confers
    protection rather than indicating current disease.
  evidence:
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of acute infection requires the use of serologic testing for
      immunoglobulin M anti-hepatitis A antibodies.
    explanation: >-
      States the diagnostic test for acute infection. Evidence source is OTHER
      because this is a clinical review.
treatments:
- name: Supportive Care
  description: >-
    There is no specific antiviral therapy for hepatitis A. Because the disease
    is self-limited in almost all patients, supportive care is sufficient;
    management is escalated only for the small minority developing acute liver
    failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease is usually self-limited, supportive care is often sufficient
      for treatment, and chronic infection or chronic liver disease does not
      occur.
    explanation: >-
      Establishes supportive care as sufficient treatment for the usual course.
      Evidence source is OTHER because this is a clinical review.
- name: Hepatitis A Vaccination
  description: >-
    Inactivated hepatitis A vaccine is the mainstay of prevention and works by
    inducing the same lifelong protective antibody that natural infection
    produces. It is used both for routine childhood immunisation and for
    pre-exposure and post-exposure prophylaxis; immune globulin substitutes when
    the vaccine is contraindicated or the recipient is too young. Programme-level
    deployment has measurably reduced HAV incidence.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Faecal-Oral Acquisition and Hepatocyte Infection
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced anti-HAV antibody neutralises the virus before hepatocyte
      infection is established, preventing the whole downstream chain rather
      than modifying it.
    evidence:
    - reference: PMID:37770459
      reference_title: "Hepatitis A virus infection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To date, >25 countries worldwide have implemented such programmes,
        resulting in a reduction in the incidence of HAV infection.
      explanation: >-
        Provides population-level evidence that vaccination prevents infection
        rather than merely attenuating disease. Evidence source is OTHER because
        this is a review summarising national programme outcomes.
  evidence:
  - reference: PMID:32389358
    reference_title: "Hepatitis A: Epidemiology, Natural History, Unusual Clinical Manifestations, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vaccination is the mainstay of prevention and should be given before
      exposure whenever possible.
    explanation: >-
      States the role of vaccination in prevention. Evidence source is OTHER
      because this is a clinical review.
  - reference: PMID:34652109
    reference_title: "Hepatitis A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vaccine is usually recommended for pre- and postexposure prophylaxis,
      but immune globulin can be used in patients who are too young to be
      vaccinated or if the vaccine is contraindicated.
    explanation: >-
      Documents the pre- and post-exposure indications and the immune globulin
      alternative. Evidence source is OTHER because this is a clinical review.

discussions:
- discussion_id: hav_immunopathogenesis_unsettled
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does adaptive immunity produce the liver injury of hepatitis A, as
    distinct from clearing the virus - and why does HAV never persist?
  attaches_to:
  - "pathophysiology#Acute Hepatic Inflammatory Reaction"
  - "pathophysiology#Host-Factor-Dependent Severity Modulation"
  rationale: >-
    This entry asserts that severity is host-determined, and annotates the
    inflammatory node with adaptive immunity accordingly, but the mechanism
    connecting the two is not settled. The review literature states plainly that
    how HAV is so effectively controlled by B and T cell immunity, and why it
    lacks the propensity to persist that HBV and HCV have, cannot yet be
    adequately explained, and that recent work challenges long-held concepts of
    how antibodies and T cells contribute to pathogenesis. The entry therefore
    deliberately stops short of curating a specific cytotoxic effector
    mechanism: naming CD8 or NK-mediated killing as the cause of hepatocyte
    injury would assert more than the cited evidence supports.
  proposed_experiments:
  - experiment_id: hav_intrahepatic_immune_profiling
    name: Intrahepatic immune profiling across the age-severity gradient
    description: >-
      Comparing intrahepatic T cell, NK cell and antibody responses between
      asymptomatic infected children and symptomatic infected adults in the same
      outbreak would test directly whether the age-dependent severity this entry
      models is produced by the adaptive response, and identify which effector
      arm causes the injury.

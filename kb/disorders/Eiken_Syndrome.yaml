  variant_origin: GERMLINE
  association: >-
    Homozygous PTH1R variants: R485X (C-terminal tail truncation), E35K and
    Y134S (N-terminal extracellular domain), I237N and D241E (second
    transmembrane helix).
  notes: >-
    The variants alter rather than abolish receptor function: increased basal
    cAMP signaling and impaired beta-arrestin2 recruitment and desensitization,
    with ligand- and tissue-dependent gain- and loss-of-function effects.
  evidence:
  - reference: PMID:15525660
    reference_title: "Recessive mutations in PTHR1 cause contrasting skeletal dysplasias in Eiken and Blomstrand syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a truncation mutation in the C-terminal cytoplasmic tail of the parathyroid hormone (PTH)/PTH-related peptide (PTHrP) type 1 receptor (PTHR1) gene as the cause of this syndrome."
    explanation: Identifies PTH1R as the causal gene in the original family.
  - reference: PMID:29987841
    reference_title: "Report of second case and clinical and molecular characterization of Eiken syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a boy with Eiken syndrome caused by a homozygous missense variant in Parathyroid hormone 1 receptor (PTH1R) c.103G > A [p.(Glu35Lys)]."
    explanation: A second, unrelated family with a homozygous PTH1R missense variant confirms the gene-disease relationship.
  - reference: PMID:39276366
    reference_title: "Eiken syndrome with parathyroid hormone resistance due to a novel parathyroid hormone receptor type 1 mutation: clinical features and functional analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, however, a homozygous novel PTH1R variant was identified (c.710 T > A; p.IIe237Asn, p.I237N) that is located in the second transmembrane helical domain."
    explanation: A further family with a homozygous transmembrane-helix PTH1R variant.
pathophysiology:
- name: Biallelic PTH1R Signaling Alteration
  biological_scale: MOLECULAR
  description: >
    Homozygous PTH1R variants produce a receptor that is expressed and binds
    ligand but signals abnormally. The R485X truncation removes the C-terminal
    serine/threonine cluster that is phosphorylated on activation, increasing
    basal cAMP signaling. The E35K and Y134S extracellular-domain variants
    weaken PTHrP binding, and the I237N and D241E transmembrane-helix variants
    raise basal cAMP signaling while blunting responses to PTH and PTHrP.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      functional_impact_category is left unset: the reported alleles combine
      increased basal signaling with reduced ligand-induced responses, and the
      direction of the net effect depends on ligand and tissue.
  gene:
    preferred_term: PTH1R
    term:
      id: hgnc:9608
      label: PTH1R
  molecular_functions:
  - preferred_term: PTH/PTHrP type 1 receptor activity
    modifier: DYSREGULATED
    term:
      id: GO:0004991
      label: parathyroid hormone receptor activity
  evidence:
  - reference: PMID:37268817
    reference_title: "Altered Signaling and Desensitization Responses in PTH1R Mutants Associated with Eiken Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, using a variety of cell-based assays, we show that R485X increases the receptor's basal rate of cAMP signaling and decreases its capacity to recruit β-arrestin2 upon ligand stimulation."
    explanation: Cell-based assays show the C-tail truncation raises basal cAMP signaling.
  - reference: PMID:39276366
    reference_title: "Eiken syndrome with parathyroid hormone resistance due to a novel parathyroid hormone receptor type 1 mutation: clinical features and functional analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrated increased basal cAMP signaling for both variants, with relative blunting of responses to both PTH and PTH-related peptide (PTHrP) ligands"
    explanation: Transmembrane-helix variants show the same mixed profile of raised basal and blunted ligand-induced signaling.
  downstream:
  - target: Impaired Beta-Arrestin-Mediated PTH1R Desensitization
    description: Loss of C-tail phosphorylation sites or weakened PTHrP binding reduces beta-arrestin2 recruitment to the receptor.
    evidence:
    - reference: PMID:37268817
      reference_title: "Altered Signaling and Desensitization Responses in PTH1R Mutants Associated with Eiken Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The E35K and Y134S mutations each weaken the binding of PTHrP leading to impaired β-arrestin2 recruitment and desensitization of cAMP signaling response to PTHrP but not PTH."
      explanation: Links the extracellular-domain variants to impaired beta-arrestin2 recruitment and desensitization.
  - target: Renal Parathyroid Hormone Resistance
    description: The same variants reduce PTH-dependent signaling in kidney.
    evidence:
    - reference: PMID:42722652
      reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Blood and urine analysis in 3-month-old WT and R485X mice showing reduced serum calcium and 1,25(OH)2D, elevated endogenous serum PTH, and reduced urinary cAMP (corrected for creatinine) in R485X mice compared to WT mice, indicating PTH resistance"
      explanation: Humanized R485X knock-in mice show biochemical PTH resistance.
  - target: Eruption failure
    description: >-
      Failure of tooth eruption is attributed to reduced PTHrP-dependent PTH1R
      signaling in developing teeth, as in heterozygous PTH1R loss of function.
    evidence:
    - reference: PMID:40904804
      reference_title: "Human diseases caused by homozygous PTH1R mutations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The other clinical manifestations of Eiken syndrome, however, such as the mild PTH resistance and PFTE, are more likely explained by a loss-of-function effect on PTH1R signaling responses in kidney and teeth, as mediated by PTH and PTHrP, respectively."
      explanation: Review interpretation attributing failed tooth eruption to reduced PTH1R signaling in dental tissue.
- name: Impaired Beta-Arrestin-Mediated PTH1R Desensitization
  biological_scale: MOLECULAR
  description: >
    Beta-arrestin binding to the activated, phosphorylated receptor normally
    terminates PTHrP-induced signaling at the plasma membrane. In Eiken
    mutants this desensitization is reduced, so PTHrP signaling is less
    efficiently terminated.
  biological_processes:
  - preferred_term: desensitization of PTH1R signaling
    modifier: DECREASED
    term:
      id: GO:0002029
      label: desensitization of G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:42722652
    reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistic studies in cell-based assays and humanized R485X-PTH1R knock-in mice revealed that βarrestins dampen PTHrP-driven Gαs signaling at the plasma membrane but promote PTH-induced endosomal PTH1R signaling."
    explanation: Establishes beta-arrestin as the brake on PTHrP signaling that the R485X truncation disrupts.
  downstream:
  - target: Enhanced PTHrP Signaling in Growth Plate Chondrocytes
    description: With less desensitization, locally abundant PTHrP produces stronger cAMP signaling in growth plate chondrocytes.
    evidence:
    - reference: PMID:40904804
      reference_title: "Human diseases caused by homozygous PTH1R mutations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In fact, in the growth plates where local PTHrP levels are expected to be abundant, inefficient PTH1R desensitization is likely to enhance activation of the down-stream signaling pathway resulting in the delayed chondrocyte differentiation that underlies the mineralization defect in Eiken syndrome."
      explanation: Review synthesis linking impaired desensitization to enhanced growth plate signaling.
- name: Enhanced PTHrP Signaling in Growth Plate Chondrocytes
  biological_scale: CELLULAR
  description: >
    PTHrP acting through PTH1R in growth plate chondrocytes normally sustains
    proliferation and delays hypertrophic differentiation. Enhanced signaling
    in Eiken syndrome strengthens this brake.
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: PTH1R-Gs-cAMP signaling
    modifier: INCREASED
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:40904804
    reference_title: "Human diseases caused by homozygous PTH1R mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The bone phenotype in most patients with Eiken syndrome (i.e., delayed ossification) points toward a gain-of-function effect on PTHrP/PTH1R-mediated signaling in the growth plate"
    explanation: Review interpretation of the skeletal phenotype as increased PTHrP/PTH1R signaling in the growth plate.
  downstream:
  - target: Delayed Chondrocyte Hypertrophic Differentiation
    description: Increased PTHrP/PTH1R signaling holds chondrocytes in the proliferative state and delays hypertrophy.
    evidence:
    - reference: PMID:42722652
      reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Delayed mineralization in R485X mice is rescued by conditional ablation of PTHrP in growth plate chondrocytes."
      explanation: Removing chondrocyte PTHrP rescues the R485X skeletal defect, showing it depends on PTHrP signaling.
    - reference: PMID:10912527
      reference_title: "Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The mirror image of these skeletal findings, i.e., a severe delay in chondrocyte differentiation and endochondral ossification, is observed in transgenic mice that overexpress PTHrP under the control of the alpha1(II) procollagen promoter."
      explanation: Excess chondrocyte PTHrP signaling delays chondrocyte differentiation, the same direction as Eiken syndrome.

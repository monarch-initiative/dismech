animal_models:
- name: Humanized R485X-PTH1R knock-in mouse
  species: Mouse
  genotype: humanized PTH1R R485X knock-in
  publication: PMID:42722652
  description: >-
    Mice expressing humanized PTH1R carrying the Eiken R485X truncation show
    short tails, absent mineralization of carpal, metacarpal, tarsal and
    metatarsal bones at postnatal day 3, fewer hypertrophic chondrocytes, and
    biochemical PTH resistance. Delayed mineralization is rescued by
    chondrocyte-specific PTHrP ablation or prenatal PTHrP(7-36) antagonist.
  modeled_mechanisms:
  - target: Delayed Chondrocyte Hypertrophic Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reduced Col10-positive hypertrophic chondrocytes in the tibial growth plate.
    evidence:
    - reference: PMID:42722652
      reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNAscope of tibial sections of embryonic day (E) 15.5 WT- and R485X-hPTH1R littermate mice showing reduced Col10-positive hypertrophic chondrocytes (red) in R485X mice."
      explanation: The knock-in reproduces the delayed hypertrophic differentiation.
  - target: Renal Parathyroid Hormone Resistance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced serum calcium and 1,25(OH)2D, elevated PTH and reduced urinary cAMP.
    evidence:
    - reference: PMID:42722652
      reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Blood and urine analysis in 3-month-old WT and R485X mice showing reduced serum calcium and 1,25(OH)2D, elevated endogenous serum PTH, and reduced urinary cAMP (corrected for creatinine) in R485X mice compared to WT mice, indicating PTH resistance"
      explanation: The knock-in reproduces biochemical PTH resistance.
  evidence:
  - reference: PMID:42722652
    reference_title: "Spatial control of parathyroid hormone receptor-1 signaling dictates ligand-specific biological outcomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Newborn R485X mice treated prenatally with the antagonist exhibited increased bone mineralization compared to R485X mice treated prenatally with the vehicle."
    explanation: Pharmacological PTHrP antagonism improves mineralization in the model.
notes: >-
  Diagnostic pitfall: patients homozygous for PTH1R I237N presented with
  hypocalcemia and hyperphosphatemia that initially suggested
  pseudohypoparathyroidism, usually a GNAS disorder; the skeletal radiographic
  features pointed to Eiken syndrome. No GeneReviews chapter exists for Eiken
  syndrome. The ISDS 2023 nosology (PMID:36779427) places PTH1R disorders in a
  parathyroid hormone signaling group, but the cached text of that reference
  does not name Eiken syndrome, so no classification is recorded here.

treatments:
- name: Calcium and Active Vitamin D Supplementation
  description: >-
    Oral calcium and an active vitamin D analogue to correct symptomatic
    hypocalcemia in patients with PTH resistance. Management of the skeletal
    and dental features is otherwise supportive; no disease-specific therapy
    exists.
  therapeutic_modality: SMALL_MOLECULE

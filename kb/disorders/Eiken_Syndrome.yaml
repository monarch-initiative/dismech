name: Eiken Syndrome
creation_date: "2026-09-24T19:20:38Z"
category: Mendelian
description: >
  Eiken syndrome (MIM #600002) is an ultra-rare autosomal recessive skeletal
  dysplasia caused by biallelic PTH1R variants. It is characterized by markedly
  delayed ossification, principally of the epiphyses, pubic bones, sacrum and the
  bones of the hands and feet, with abnormal bone modeling, brachydactyly,
  metacarpal pseudoepiphyses and in some patients failure of tooth eruption.
  Some families additionally show resistance to parathyroid hormone (PTH), with
  elevated PTH and, in a subset, hypocalcemia and hyperphosphatemia. The
  reported alleles (R485X in the C-terminal tail; E35K and Y134S in the
  extracellular domain; I237N and D241E in the second transmembrane helix) do
  not abolish receptor function. They alter it: increased basal cAMP signaling
  and impaired beta-arrestin recruitment and desensitization, which enhance
  PTHrP-driven signaling in growth plate chondrocytes and delay their
  hypertrophic differentiation, while PTH-dependent signaling in kidney is
  reduced. Eiken syndrome therefore sits between Blomstrand chondrodysplasia
  (biallelic loss of function, accelerated ossification) and Jansen metaphyseal
  chondrodysplasia (heterozygous constitutive activation) in the PTH1R allelic
  series.

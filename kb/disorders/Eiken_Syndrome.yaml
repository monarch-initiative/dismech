    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Patients with Eiken syndrome display delayed bone mineralization, consistent with enhanced PTHrP actions, as well as hypocalcemia along with elevated PTH, which paradoxically indicates impaired PTH function."
    explanation: Summarizes the combination of enhanced PTHrP action in bone and impaired PTH action in patients.
  downstream:

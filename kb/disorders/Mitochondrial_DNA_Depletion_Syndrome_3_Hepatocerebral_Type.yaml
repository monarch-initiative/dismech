progression:
- phase: Neonatal or early infantile onset
  notes: >-
    Onset is neonatal (first month) in over half and within the first year in most
    of the rest. In the hepatocerebral form the median age of onset is one month and
    the median age at death 6.5 months. Some affected neonates are small for
    gestational age and unwell in the first days of life.
  evidence:
  - reference: PMID:39079226
    reference_title: "Natural history of deoxyguanosine kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the hepatocerebral disease phenotype, median age of onset was 1 month while the median age of death was 6.5 months implying rapid disease progression."
    explanation: Timing of onset and death in the hepatocerebral form.
  - reference: PMID:21107780
    reference_title: "Post mortem identification of deoxyguanosine kinase (DGUOK) gene mutations combined with impaired glucose homeostasis and iron overload features in four infants with severe progressive liver failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were born with low weights for gestational age and they presented adaptation trouble during the first days of life."
    explanation: Perinatal findings in a four-infant series.
- phase: Progression to liver failure and death
  notes: >-
    Without transplantation, one-year survival in the neonatal/infantile
    hepatocerebral form is about 11%. Median survival is 0.5 years for neonatal
    onset and 1.17 years for infantile onset. Liver failure causes most deaths.
  evidence:
  - reference: PMID:39079226
    reference_title: "Natural history of deoxyguanosine kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognosis was poor, especially for neonatal/ infantile-onset hepatocerebral disease for which 1 year survival was 11%."
    explanation: One-year survival in the hepatocerebral form.
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 0.5 years for the neonatal onset, 1.17 years for the infantile-onset and 67 years for the adult-onset group."
    explanation: Median survival by age at onset; the adult-onset figure belongs to the allelic myopathy entity.
- phase: Survival beyond infancy
  notes: >-
    A minority survive: those with isolated hepatic disease, occasional reversal of
    liver disease with residual enzyme activity, and transplant recipients. Survivors
    remain at risk of later neurological or muscle disease; a child transplanted at
    9 months later developed recurrent rhabdomyolysis with multiple mtDNA deletions
    in muscle.
  evidence:
  - reference: PMID:17073823
    reference_title: "Kinetic properties of mutant deoxyguanosine kinase in a case of reversible hepatic mtDNA depletion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residual DGUOK activity may play a crucial role in the phenotype reversal."
    explanation: Residual activity is the proposed basis of reversal in one patient.
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent rhabdomyolysis in a young female who had received a liver transplant at 9 months of age"
    explanation: Later muscle disease in an infant transplant survivor.
histopathology:
- name: Liver biopsy
  description: >-
    Steatosis, cholestasis, fibrosis, cirrhosis, siderosis and necrosis. Hepatic
    iron deposition occurs in about a quarter of biopsies and, with raised ferritin,
    can lead to a misdiagnosis of neonatal haemochromatosis.
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver specimen analyses revealed steatosis in 61/87 (70.1%) patients, cholestasis in 52/87 (59.8%), fibrosis in 49/87 (56.3%), cirrhosis in 29/87 (33.3%), siderosis in 23/87 (26.4%) and necrosis in 16/87 (18.4%)."
    explanation: Frequencies of each histological finding in 87 biopsies.

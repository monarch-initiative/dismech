- name: Deoxynucleoside or dGMP Prodrug Supplementation (Investigational)
  description: >-
    Substrate enhancement to bypass the missing kinase: purine deoxynucleosides or a
    dGMP prodrug (CERC-913). Evidence is preclinical only (zebrafish, rat
    hepatocyte cultures); no human treatment data for DGUOK deficiency are cited
    here and no DGUOK trial was found on ClinicalTrials.gov.
  therapeutic_modality: SMALL_MOLECULE

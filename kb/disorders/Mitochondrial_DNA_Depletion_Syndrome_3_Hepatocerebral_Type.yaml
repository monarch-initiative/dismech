    evidence:
    - reference: PMID:31127938
      reference_title: "Severe mtDNA depletion and dependency on catabolic lipid metabolism in DGUOK knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The movements and behavior were indistinguishable compared to wild-type (wt) mice."
      explanation: Absence of a neurological phenotype.

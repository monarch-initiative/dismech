    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxyguanosine
      term:
        id: CHEBI:17172
        label: 2'-deoxyguanosine
    - preferred_term: deoxyadenosine
      term:
        id: CHEBI:17256
        label: 2'-deoxyadenosine
  target_mechanisms:
  - target: Impaired Mitochondrial Purine Deoxynucleotide Supply
    description: Increases substrate for, or bypasses, the missing phosphorylation step.
  evidence:
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, in adult dguok-/- fish we detected a significant increase in liver mtDNA copy number when supplemented with both purine nucleosides."
    explanation: Liver mtDNA rescue in adult mutant fish with both purine nucleosides.
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "When supplemented with only one purine nucleoside (dGuo), mtDNA copy number in both mutant and wt juvenile animals was significantly reduced, contrasting with previous cell culture studies, possibly because of nucleotide pool imbalance."
    explanation: Single-nucleoside supplementation lowered mtDNA in juveniles, a caution against deoxyguanosine alone.
  - reference: PMID:33368311
    reference_title: "The nucleotide prodrug CERC-913 improves mtDNA content in primary hepatocytes from DGUOK-deficient rats."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CERC-913 increased mtDNA content in DGUOK-deficient hepatocytes up to 2.4-fold after 4 days of treatment in a dose-dependent fashion, which was significantly more effective than dGMP at similar concentrations."
    explanation: Prodrug rescue in cultured knockout rat hepatocytes.

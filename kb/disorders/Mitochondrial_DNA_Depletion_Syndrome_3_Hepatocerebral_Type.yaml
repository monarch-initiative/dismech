name: Mitochondrial DNA Depletion Syndrome 3 (Hepatocerebral Type)
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
  term:
    id: MONDO:0009636
    label: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
synonyms:
- MTDPS3
- deoxyguanosine kinase deficiency
- DGUOK deficiency
- DGUOK-related mitochondrial DNA depletion syndrome
- mitochondrial DNA depletion syndrome, hepatocerebral form due to DGUOK deficiency
description: >-
  Autosomal recessive mitochondrial DNA (mtDNA) maintenance disorder caused by
  biallelic loss-of-function variants in DGUOK, which encodes mitochondrial
  deoxyguanosine kinase, the enzyme that initiates salvage of purine
  deoxyribonucleosides for mtDNA synthesis. Loss of the enzyme leaves mtDNA
  replication short of purine precursors, producing severe, liver-predominant mtDNA
  depletion and a combined deficiency of the mtDNA-encoded respiratory chain
  complexes. The usual presentation is in the neonatal period or the first months
  of life, with cholestatic liver disease that progresses to liver failure, lactic
  acidosis and hypoglycaemia, together with hypotonia, nystagmus (classically
  rotary, evolving into opsoclonus) and developmental delay. A smaller group has
  isolated liver disease presenting later in infancy or childhood. Most infants
  with the hepatocerebral form die in the first year, usually of liver failure.
  Liver transplantation prolongs survival in selected children, but the role of
  pre-existing neurological signs in selecting candidates is contested, and
  hepatocellular carcinoma has been found in infancy, which is why surveillance
  with alpha-fetoprotein and liver ultrasound is recommended.
parents:
- mitochondrial DNA depletion syndrome, hepatocerebral form
- inborn disorder of purine metabolism
- mitochondrial DNA maintenance defect
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    notes: >-
      Progressive liver disease dominates the course and is the most common cause
      of death, so the hepatology chapter is the primary placement.
    evidence:
    - reference: PMID:20301766
      reference_title: "Deoxyguanosine Kinase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Progressive hepatic disease is the most common cause of death in both forms."
      explanation: Liver disease is the defining and fatal organ involvement.
  - classification_value: NEUROLOGIC
    notes: >-
      Neurological involvement (hypotonia, nystagmus, developmental delay) defines
      the hepatocerebral form, which is the majority presentation.
  icimd_category:
  - classification_value: nucleotide_pool_maintenance
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nucleotide pool
      maintenance" under category "Mitochondrial DNA maintenance and replication".
      DGUOK supplies purine deoxynucleotides to the mitochondrial dNTP pool, which
      is the mechanism the group is defined by.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:11687800
      reference_title: "The deoxyguanosine kinase gene is mutated in individuals with depleted hepatocerebral mitochondrial DNA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected tissues show both decreased activity of the mtDNA-encoded respiratory chain complexes (I, III, IV, V) and mtDNA depletion."
      explanation: >-
        A combined respiratory chain deficiency secondary to mtDNA depletion from a
        nuclear-gene defect places this among the primary mitochondrial diseases.
references:
- reference: PMID:20301766
  title: "Deoxyguanosine Kinase Deficiency."
  tags:
  - GeneReviews
has_subtypes:
- name: Hepatocerebral
  display_name: Neonatal/infantile multisystem (hepatocerebral) form
  description: >-
    The majority presentation. Liver disease (jaundice, cholestasis, hepatomegaly,
    raised transaminases) with neurological signs (hypotonia, nystagmus,
    developmental delay) within weeks of birth; lactic acidosis and hypoglycaemia
    are common. Onset is neonatal or infantile, and nearly all affected infants die
    in the first 18 months without transplantation.
  genes:
  - preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  evidence:
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of affected individuals have the multisystem illness with hepatic disease (jaundice, cholestasis, hepatomegaly, and elevated transaminases) and neurologic manifestations (hypotonia, nystagmus, and developmental delay) evident within weeks of birth."
    explanation: Defines the multisystem form and its timing.
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data on mortality revealed that 99/106 (93.4%) (4 N/A) patients died at an average age of 6.79 months (ranging from less than one month to 1.5 years), while 7/106 (6.6%) were still alive at the last follow-up, with an age that ranged from less than a month to seventeen years."
    explanation: Mortality in the hepatocerebral subgroup of the largest cohort (202 patients).
- name: Isolated Hepatic
  display_name: Isolated hepatic form (later infancy or childhood)
  description: >-
    Liver disease without, or with only later and mild, neurological involvement;
    renal involvement can occur. Presents later than the multisystem form and is the
    group with the better prognosis and the stronger case for liver transplantation.
  genes:
  - preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  evidence:
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those with isolated liver disease may also have renal involvement, and some later develop mild hypotonia."
    explanation: Describes the isolated hepatic form.
  - reference: PMID:18205204
    reference_title: "Clinical and molecular features of mitochondrial DNA depletion due to mutations in deoxyguanosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, two patients carrying missense mutations had isolated liver disease and are alive in their 4th year of life without liver transplant."
    explanation: Isolated liver disease with longer untransplanted survival.
- name: Hepatomyocerebral
  display_name: Hepatomyocerebral form
  description: >-
    Liver and brain involvement accompanied by skeletal-muscle signs (weakness,
    ptosis, ophthalmoplegia). Defined as a separate clinical subgroup in the 2024
    international cohort; it is not separated in GeneReviews.
  genes:
  - preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the clinical phenotype, we defined four different clinical subtypes: hepatocerebral (58.8%), isolated hepatopathy (21.9%), hepatomyoencephalopathy (9.6%), and isolated myopathy (9.6%)."
    explanation: >-
      Defines the hepatomyocerebral subgroup. The fourth subgroup, isolated
      (adult-onset) myopathy, is a separate MONDO entity and is not a subtype of
      this entry.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic DGUOK variants, homozygous or compound heterozygous. Founder alleles
    (Druze, Austrian, Japanese) and consanguinity account for a large share of
    homozygous cases.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

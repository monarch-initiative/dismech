    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DGUOK deficiency is inherited in an autosomal recessive manner."
    explanation: States the mode of inheritance.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z
    reference_title: "DGUOK / mitochondrial disease (Definitive)"

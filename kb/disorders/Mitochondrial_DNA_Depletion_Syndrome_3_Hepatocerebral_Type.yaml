pathophysiology:
- name: DGUOK Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic DGUOK variants abolish or reduce mitochondrial deoxyguanosine kinase.
    Truncating, splice and missense alleles are all reported; in the original Druze
    kindreds no dGK protein was detectable in liver. Missense alleles with residual
    activity are associated with milder, occasionally reversible hepatic disease.
  genes:
  - preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline DGUOK variants.
  molecular_functions:
  - preferred_term: deoxyguanosine kinase activity
    term:
      id: GO:0004138
      label: deoxyguanosine kinase activity
    modifier: DECREASED
  downstream:
  - target: Impaired Mitochondrial Purine Deoxynucleotide Supply
    description: >-
      Without dGK, the mitochondrial salvage phosphorylation of deoxyguanosine and
      deoxyadenosine, the first and rate-limiting step, does not occur.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11687800
      reference_title: "The deoxyguanosine kinase gene is mutated in individuals with depleted hepatocerebral mitochondrial DNA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The main supply of deoxyribonucleotides (dNTPs) for mtDNA synthesis comes from the salvage pathway initiated by dGK and thymidine kinase-2 (TK2)."
      explanation: Places dGK at the start of the salvage pathway supplying mtDNA precursors.
  evidence:
  - reference: PMID:11687800
    reference_title: "The deoxyguanosine kinase gene is mutated in individuals with depleted hepatocerebral mitochondrial DNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western-blot analysis did not detect dGK protein in the liver of affected individuals."
    explanation: Absence of the protein in patient liver establishes loss of function.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z
    reference_title: "DGUOK / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of disease is loss of function."
    explanation: ClinGen expert-panel statement of disease mechanism.
  - reference: PMID:17073823
    reference_title: "Kinetic properties of mutant deoxyguanosine kinase in a case of reversible hepatic mtDNA depletion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N46S/L266R DGUOK showed 14 and 10% residual activity as compared with controls with dG and deoxyadenosine as phosphate acceptors respectively."
    explanation: Missense alleles can leave measurable residual activity, the basis of the milder end of the spectrum.
- name: Impaired Mitochondrial Purine Deoxynucleotide Supply
  biological_scale: MOLECULAR
  description: >-
    dGK phosphorylates deoxyguanosine and deoxyadenosine to their monophosphates
    inside mitochondria. Its loss is proposed to leave the mitochondrial dNTP pool
    short of purines relative to pyrimidines. Direct measurement of mitochondrial
    dNTP pools in patient tissue is not among the sources cited here; the imbalance
    is stated as mechanism in the primary discovery paper and the 2024 cohort
    introduction.
  biological_processes:
  - preferred_term: deoxyguanosine salvage
    term:
      id: GO:0006180
      label: deoxyguanosine salvage
    modifier: DECREASED
  downstream:
  - target: Liver-Predominant mtDNA Depletion
    description: >-
      Insufficient purine precursors limit mtDNA replication, lowering mtDNA copy
      number.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38756539
      reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Autosomal recessive pathogenetic variants in the DGUOK gene cause a lack of dGk enzyme activity and consequently unbalanced dNTP pool for the reduction of deoxy purines versus deoxy pyrimidines, ultimately leading to mtDNA depletion and/or multiple deletions."
      explanation: States the chain from enzyme loss through dNTP imbalance to mtDNA depletion; an introduction sentence, not a result of the cohort study.
    - reference: PMID:11687800
      reference_title: "The deoxyguanosine kinase gene is mutated in individuals with depleted hepatocerebral mitochondrial DNA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The association of mtDNA depletion with mutated DGUOK suggests that the salvage-pathway enzymes are involved in the maintenance of balanced mitochondrial dNTP pools."
      explanation: The discovery paper's inference linking dGK loss to dNTP pool balance and mtDNA depletion.
  evidence:
  - reference: PMID:28215579
    reference_title: "Mitochondrial DNA maintenance defects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, mtDNA synthesis requires a balanced supply of nucleotides that is achieved by nucleotide recycling inside the mitochondria and import from the cytosol."
    explanation: Review statement of the nucleotide-supply requirement that dGK serves.
- name: Liver-Predominant mtDNA Depletion
  biological_scale: CELLULAR
  description: >-
    mtDNA copy number is severely reduced in liver, typically below 10-20% of
    control, in every liver sample analysed from patients with hepatic disease,
    whereas skeletal muscle is depleted in only about two thirds and blood only
    modestly. Why the liver is so much more vulnerable than other tissues is not
    settled.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  downstream:
  - target: Combined Respiratory Chain Deficiency
    description: >-
      Fewer mtDNA templates mean less synthesis of the 13 mtDNA-encoded respiratory
      chain subunits, with the entirely nuclear-encoded complex II spared.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28215579
      reference_title: "Mitochondrial DNA maintenance defects."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Defective mtDNA leads to organ dysfunction due to insufficient mtDNA-encoded protein synthesis, resulting in an inadequate energy production to meet the needs of affected organs."
      explanation: Review synthesis of the depletion-to-energy-failure link across mtDNA maintenance defects.
    - reference: PMID:31127938
      reference_title: "Severe mtDNA depletion and dependency on catabolic lipid metabolism in DGUOK knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mtDNA-encoded protein cytochrome c oxidase was much lower in Dguok-/- liver tissue than in the wt, whereas the expression of the nuclear-encoded succinate dehydrogenase complex subunit A was unaffected."
      explanation: In the knockout liver the mtDNA-encoded subunit falls while the nuclear-encoded one is preserved, the signature of depletion-driven deficiency.
  evidence:
  - reference: PMID:18205204
    reference_title: "Clinical and molecular features of mitochondrial DNA depletion due to mutations in deoxyguanosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial DNA content was below 10% of controls in liver in all but one case and modestly reduced in blood cells."
    explanation: Quantifies the liver-predominant depletion.
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetics studies demonstrated that mtDNA depletion was present in all liver samples analyzed in patients presenting signs/symptoms of hepatic disease whereas muscle samples analysis showed a reduction of mtDNA copy number in only 66% of the cases."
    explanation: Liver depletion is universal in hepatic disease; muscle is inconsistently affected.
  - reference: PMID:31127938
    reference_title: "Severe mtDNA depletion and dependency on catabolic lipid metabolism in DGUOK knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A decrease of mtDNA copy number occurred in multiple tissues, with the liver being the most severely affected."
    explanation: The knockout mouse reproduces the liver predominance.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Reduced activity of complexes I, III, IV and V, the complexes containing
    mtDNA-encoded subunits, with complex II preserved. Oxidative stress has been
    shown in the knockout mouse liver; it has not been measured directly in patient
    tissue in the sources cited here, so the oxidative arm of the conformed module
    node rests on model data.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  downstream:
  - target: Hepatocellular Injury and Progressive Liver Failure
    description: >-
      Energy failure in hepatocytes drives cholestasis, steatosis, fibrosis and
      necrosis and, in most infants, liver failure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28215579
      reference_title: "Mitochondrial DNA maintenance defects."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Defective mtDNA leads to organ dysfunction due to insufficient mtDNA-encoded protein synthesis, resulting in an inadequate energy production to meet the needs of affected organs."
      explanation: Review synthesis linking the respiratory chain defect to organ dysfunction.
  - target: Hepatocyte Ferroptosis Sensitivity Under Iron Load
    description: >-
      DGUOK-mutant hepatocytes are more susceptible to iron-induced ferroptosis
      than isogenic corrected cells; shown in vitro only.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34026460
      reference_title: "A Combined Model of Human iPSC-Derived Liver Organoids and Hepatocytes Reveals Ferroptosis in DGUOK Mutant mtDNA Depletion Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "DGUOK mutant iHep and iHep-Orgs, but not control and corrected one, are more sensitive to iron overload-induced ferroptosis, which can be rescued by N-Acetylcysteine (NAC)."
      explanation: Patient iPSC-derived hepatocytes and organoids, with CRISPR-corrected isogenic controls, show DGUOK-dependent ferroptosis sensitivity.
  - target: Central Nervous System Dysfunction
    description: >-
      The same energy failure is the presumed cause of the neurological signs. The
      sources cited here do not document brain mtDNA depletion or brain
      respiratory chain activity, and a contribution from liver failure itself
      cannot be excluded; see the discussion on this node.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28215579
      reference_title: "Mitochondrial DNA maintenance defects."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Defective mtDNA leads to organ dysfunction due to insufficient mtDNA-encoded protein synthesis, resulting in an inadequate energy production to meet the needs of affected organs."
      explanation: General review statement; it is not specific to brain in DGUOK deficiency.
  - target: Lactic Acidosis
    description: >-
      Impaired oxidative phosphorylation shifts pyruvate to lactate. Lactate may be
      only mildly raised early in the course.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11687800
    reference_title: "The deoxyguanosine kinase gene is mutated in individuals with depleted hepatocerebral mitochondrial DNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected tissues show both decreased activity of the mtDNA-encoded respiratory chain complexes (I, III, IV, V) and mtDNA depletion."
    explanation: Documents the combined deficiency of the mtDNA-dependent complexes in patient tissue.
  - reference: PMID:31127938
    reference_title: "Severe mtDNA depletion and dependency on catabolic lipid metabolism in DGUOK knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histopathology showed severe alterations and immunohistochemistry showed signs of both oxidative stress and regeneration in Dguok-/- liver."
    explanation: Model evidence for the oxidative-stress component of the conformed node.
- name: Hepatocyte Ferroptosis Sensitivity Under Iron Load
  biological_scale: CELLULAR
  description: >-
    Proposed link between the respiratory chain defect, hepatic iron deposition and
    hepatocyte death. In patient iPSC-derived hepatocytes and liver organoids, iron
    loading triggers ferroptosis through NCOA4-dependent ferritinophagy and labile
    iron release, rescued by N-acetylcysteine; corrected isogenic cells are
    resistant. Not yet shown in patient liver. The paper's introduction states that
    most patients develop iron overload, whereas siderosis was found in about a
    quarter of biopsies in the 2024 cohort, so how often this mechanism operates
    in vivo is unsettled.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: ferroptosis
    term:
      id: GO:0097707
      label: ferroptosis
    modifier: INCREASED
  downstream:
  - target: Hepatocellular Injury and Progressive Liver Failure
    description: Ferroptotic hepatocyte death is proposed to contribute to liver damage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34026460
    reference_title: "A Combined Model of Human iPSC-Derived Liver Organoids and Hepatocytes Reveals Ferroptosis in DGUOK Mutant mtDNA Depletion Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanically, this ferroptosis is a process mediated by nuclear receptor co-activator 4 (NCOA4)-dependent degradation of ferritin in lysosome and cellular labile iron release."
    explanation: Mechanism of the ferroptosis in the iPSC hepatocyte model.
- name: Hepatocellular Injury and Progressive Liver Failure
  biological_scale: TISSUE
  description: >-
    Cholestatic hepatopathy with steatosis, fibrosis, cirrhosis, siderosis and
    necrosis on biopsy, progressing to synthetic liver failure. Liver failure is
    the leading cause of death. Hepatic iron deposition and high ferritin can
    mimic neonatal haemochromatosis, and raised plasma tyrosine can mimic
    tyrosinaemia type I.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Hepatic Failure
    causal_link_type: DIRECT
  - target: Cholestasis
    causal_link_type: DIRECT
  - target: Jaundice
    causal_link_type: DIRECT
  - target: Hepatomegaly
    causal_link_type: DIRECT
  - target: Elevated Transaminases
    causal_link_type: DIRECT
  - target: Coagulopathy
    causal_link_type: DIRECT
  - target: Cirrhosis
    causal_link_type: DIRECT
  - target: Hypertyrosinemia
    description: >-
      Raised plasma tyrosine is a marker of hepatocellular dysfunction here; it is
      detected on newborn screening in some infants.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Alpha-Fetoprotein
    description: >-
      Very high AFP accompanies the liver disease; regeneration and early
      carcinoma have both been proposed as its source.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29137425
      reference_title: "A fatal case of mitochondrial DNA depletion syndrome with novel compound heterozygous variants in the deoxyguanosine kinase gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our patient, levels were as high as 29,090 ng/mL, which may occur due to the liver regeneration process or the early onset of hepatocellular carcinoma."
      explanation: The authors' two candidate explanations for the AFP elevation; neither is established.
  - target: Hepatocellular Carcinoma
    description: >-
      Hepatocellular carcinoma has been found in infants with DGUOK deficiency, as
      early as six months of age, including incidentally in an explant. The link
      between mtDNA depletion and tumorigenesis is proposed by the reporting
      authors, not demonstrated; whether it runs through cirrhosis and regeneration
      or through a cell-autonomous effect of mitochondrial dysfunction is unknown.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:16908739
      reference_title: "Hepatocerebral mitochondrial DNA depletion syndrome caused by deoxyguanosine kinase (DGUOK) mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One of our patients underwent liver transplantation; pathologic findings revealed (in addition to diffuse hepatopathy) a hepatocellular carcinoma, implying a possible link between mtDNA depletion syndrome and tumorigenesis."
      explanation: Case-level observation and the authors' proposed link.
  - target: Hypoglycemia
    description: >-
      Impaired hepatic glucose production in the failing liver is the presumed
      contribution. This edge is an inference from the liver disease; no cited
      source isolates the hepatic contribution from the islet-cell one.
    causal_link_type: UNKNOWN
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver specimen analyses revealed steatosis in 61/87 (70.1%) patients, cholestasis in 52/87 (59.8%), fibrosis in 49/87 (56.3%), cirrhosis in 29/87 (33.3%), siderosis in 23/87 (26.4%) and necrosis in 16/87 (18.4%)."
    explanation: Histological spectrum of the liver injury in 87 biopsied patients.
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive hepatic disease is the most common cause of death in both forms."
    explanation: Liver failure is the principal cause of death.
- name: Pancreatic Islet Cell Hyperplasia and Hyperinsulinism

treatments:
- name: Liver Transplantation
  description: >-
    The only intervention shown to change survival, and a contested one. The 2024
    international cohort found transplantation significantly improved survival in
    26 patients and, unlike earlier analyses, found no survival difference by
    presence of neurological involvement overall, though nystagmus at onset
    predicted worse post-transplant survival. A 2008 review concluded that profound
    hypotonia, psychomotor retardation or nystagmus make transplantation futile;
    GeneReviews limits it to children without, or with minimal, neurological
    involvement. About half of transplanted children in a separate collation died
    within two years, and neurological or muscle disease can emerge afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Hepatocellular Injury and Progressive Liver Failure
    description: Replaces the depleted, failing liver; does not correct extrahepatic tissues.
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver transplant significantly modified the survival rate in 26 treated patients when compared with untreated."
    explanation: Survival benefit in the largest cohort (retrospective, not randomised).
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, patients with nystagmus at disease onset had a negative outcome after LTx with a statistically significant difference in survival rate (Kaplan-Meier, P = 0.0275) (Fig. 3C)."
    explanation: Nystagmus at onset predicts worse post-transplant survival.
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver transplantation has been used to treat individuals without neurologic involvement or with minimal neurologic involvement."
    explanation: GeneReviews selection criterion.
  - reference: PMID:18825706
    reference_title: "Abnormal neurological features predict poor survival and should preclude liver transplantation in patients with deoxyguanosine kinase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In the presence of these features, there is increased mortality, and liver transplantation does not confer increased survival."
    explanation: Refutes benefit in children with profound hypotonia, significant psychomotor retardation or nystagmus.
  - reference: PMID:24478274
    reference_title: "Long-term outcomes after liver transplantation for deoxyguanosine kinase deficiency: a single-center experience and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 1-year survival rate was 64%; 36% survived for more than 5 years."
    explanation: Post-transplant survival in 14 children.
  - reference: PMID:39079226
    reference_title: "Natural history of deoxyguanosine kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-three patients received liver transplants, of whom 12 died within 2 years of transplant."
    explanation: High early post-transplant mortality in an independent collation.

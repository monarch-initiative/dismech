- discussion_id: cns_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neurological disease in DGUOK deficiency caused by mtDNA depletion and
    respiratory chain failure in the brain itself, by liver failure, or both?
  attaches_to:
  - pathophysiology#Central Nervous System Dysfunction
  rationale: >-
    The sources cited here document mtDNA depletion in liver, muscle and blood but
    not in brain, and the knockout mouse has no neurological phenotype. Neurological
    signs can appear after liver transplantation, which argues for a primary CNS
    component, but that observation does not measure brain mtDNA. The answer matters
    for transplant selection and for whether a nucleoside therapy would need to
    reach the brain.
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only six patients had additional mild neurological signs after liver transplant."
    explanation: New neurological signs after transplantation.
- discussion_id: hcc_risk_and_surveillance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the risk of hepatocellular carcinoma in DGUOK deficiency, by what age,
    and does it arise from cirrhosis and regeneration or from mitochondrial
    dysfunction itself?
  attaches_to:
  - phenotypes#Hepatocellular Carcinoma
  - diagnosis#Hepatocellular carcinoma surveillance
  rationale: >-
    HCC is documented in single patients from infancy, and GeneReviews recommends
    three-monthly AFP and ultrasound, but no cohort gives an incidence, and AFP is
    already very high from the liver disease, which limits it as a tumour marker.
    Evidence for the surveillance interval is expert opinion.
  evidence:
  - reference: PMID:29137425
    reference_title: "A fatal case of mitochondrial DNA depletion syndrome with novel compound heterozygous variants in the deoxyguanosine kinase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our patient, levels were as high as 29,090 ng/mL, which may occur due to the liver regeneration process or the early onset of hepatocellular carcinoma."
    explanation: AFP elevation is ambiguous between regeneration and tumour.
notes: >-
  Scope and lump/split. This entry is MONDO:0009636, the infantile hepatocerebral
  mtDNA depletion syndrome due to DGUOK, and includes the isolated hepatic and
  hepatomyocerebral forms as subtypes because GeneReviews and the natural-history
  cohorts treat them as one early-onset disease differing in organ involvement.
  Two allelic DGUOK disorders have their own MONDO terms and are recorded here only
  as differential diagnoses: noncirrhotic portal hypertension 1 (MONDO:8000013) and
  adult-onset progressive external ophthalmoplegia with multiple mtDNA deletions,
  autosomal recessive 4 (MONDO:0014899). ClinGen takes the opposite, lumping
  position: its Definitive DGUOK assertion is to "mitochondrial disease"
  (MONDO:0044970), and its summary states that the DGUOK phenotypes were lumped
  into one entity under the ClinGen lumping and splitting framework. The split here
  follows MONDO and the age-of-onset and tissue differences (liver and brain in
  infancy, muscle in adults), not a claim that the allelic disorders have different
  mechanisms.

  Frequencies. The 2024 cohort (PMID:38756539) figures used for frequency bands are
  for the whole cohort of 202, which includes about 10% adult-onset myopathy cases
  outside this entry's scope; frequencies in the infantile disease alone are
  therefore likely somewhat higher. Hypertyrosinemia uses the subset with abnormal
  amino acids as its denominator.

  Orphanet's definition of ORPHA:279934 calls this "a rare immune disease"; that
  phrase appears to be an error in the source and is not quoted.

  GeneReviews has a chapter (PMID:20301766); every feature named in its abstract is
  captured. No DGUOK-specific clinical trial was found on ClinicalTrials.gov for
  the queries DGUOK and "deoxyguanosine kinase" (September 2026).

discussions:
- discussion_id: lt_selection_neurological_signs
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Should neurological signs at presentation exclude an infant with DGUOK
    deficiency from liver transplantation, and if so which signs?
  attaches_to:
  - treatments#Liver Transplantation
  - phenotypes#Nystagmus
  rationale: >-
    A 2008 systematic review found that profound hypotonia, significant
    psychomotor retardation or nystagmus predicted death and that transplantation
    did not improve survival when they were present. The 2024 international cohort
    (26 transplanted) found no survival difference by neurological involvement,
    MRI abnormality, hypotonia or psychomotor delay, but did find worse survival
    with nystagmus at onset. A single-centre series reported long-term survivors
    with mild pre-transplant neurological signs. All data are retrospective and
    subject to selection, so the question is open; nystagmus is the sign on which
    the studies agree.
  evidence:
  - reference: PMID:18825706
    reference_title: "Abnormal neurological features predict poor survival and should preclude liver transplantation in patients with deoxyguanosine kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term survival is best predicted by the absence of profound hypotonia, significant psychomotor retardation, or nystagmus."
    explanation: The restrictive position.
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We compared the survival rate of individuals with or without neurological involvement but there was no statistically significant difference (Kaplan-Meier, P = 0.5410) (Fig. 3B)."
    explanation: The later cohort finding that neurological involvement as a whole did not predict post-transplant survival.
  - reference: PMID:24478274
    reference_title: "Long-term outcomes after liver transplantation for deoxyguanosine kinase deficiency: a single-center experience and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, a decision to carry out LT for patients with DGUOK deficiency remains difficult because neurological symptoms may occur and worsen after LT despite their absence before transplantation."
    explanation: Neurological outcome after transplantation is not predictable from pre-transplant status.
- discussion_id: genotype_phenotype_correlation
  kind: CONTROVERSY
  status: OPEN
  prompt: Do biallelic truncating DGUOK variants predict the hepatocerebral phenotype and earlier death?
  attaches_to:
  - genetic#DGUOK
  rationale: >-
    Two overlapping 2024 literature cohorts disagree. One reports no
    genotype-phenotype correlation; the other finds that two truncating alleles
    raise the risk of death and of the hepatocerebral phenotype. The 2008 series had
    already noted that every patient with two null alleles had early liver failure
    and neurological disease. The difference may reflect how variants were grouped
    rather than contradictory data, but it bears on prognostic counselling after a
    molecular diagnosis.
  evidence:
  - reference: PMID:38756539

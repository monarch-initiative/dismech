diagnosis:
- name: DGUOK molecular testing
  description: >-
    Biallelic pathogenic DGUOK variants establish the diagnosis. Intragenic
    deletions are recurrent in some populations, so sequencing alone can miss an
    allele.
  evidence:
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DGUOK deficiency is established in a proband by the identification of biallelic pathogenic variants in DGUOK on molecular genetic testing."
    explanation: Diagnostic criterion.
- name: Liver mtDNA copy number
  description: >-
    mtDNA quantification in liver is the informative tissue test; muscle biopsy can
    be normal in the hepatic forms.
  evidence:
  - reference: PMID:38756539
    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This highlights that muscle biopsy is not informative in patients with hepatopathy and it suggests that mtDNA copy number analysis is the gold standard for the diagnosis in liver biopsy in patients with hepatopathy as well as the mtDNA multiple deletions in muscle patients with isolated myopathy."
    explanation: Tissue choice for mtDNA studies.
- name: Newborn screening amino acids
  description: >-
    Raised tyrosine or phenylalanine on newborn screening has led to diagnosis
    before or at symptom onset.
  evidence:
  - reference: PMID:18205204
    reference_title: "Clinical and molecular features of mitochondrial DNA depletion due to mutations in deoxyguanosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, this disease should be considered if elevated tyrosine is identified by newborn screening."
    explanation: Newborn-screening signal.
- name: Hepatocellular carcinoma surveillance
  description: >-
    GeneReviews recommends alpha-fetoprotein and abdominal ultrasound every three
    months, alongside liver biochemistry, coagulation, fasting glucose and
    neurodevelopmental assessment at each visit. The interval is expert
    recommendation; no outcome data on surveillance are cited.
  evidence:
  - reference: PMID:20301766
    reference_title: "Deoxyguanosine Kinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFP and abdominal ultrasound every three months"
    explanation: GeneReviews surveillance recommendation.

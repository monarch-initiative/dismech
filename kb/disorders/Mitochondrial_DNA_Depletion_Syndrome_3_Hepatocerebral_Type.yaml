    reference_title: "Deoxyguanosine kinase deficiency: natural history and liver transplant outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetics studies demonstrated that mtDNA depletion was present in all liver samples analyzed in patients presenting signs/symptoms of hepatic disease whereas muscle samples analysis showed a reduction of mtDNA copy number in only 66% of the cases."
    explanation: Universal liver depletion in hepatic DGUOK disease is what separates it from TRMU deficiency.
- name: Tyrosinemia type I
  description: >-

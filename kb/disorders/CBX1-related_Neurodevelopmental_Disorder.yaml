  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal dominant monogenic chromatin disorder caused by de novo missense variants in the CBX1 chromodomain.
    evidence:
    - reference: PMID:37087635
      reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 3 unrelated individuals with developmental delay, hypotonia, and autistic features, we identified heterozygous de novo variants in CBX1. The identified variants were in the chromodomain, the functional domain of HP1β, which mediates interactions with chromatin."
      explanation: "Establishes the monogenic de novo dominant genetic etiology in CBX1."

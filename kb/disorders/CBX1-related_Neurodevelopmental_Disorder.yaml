pathophysiology:
- name: CBX1 Chromodomain Variant with Loss of H3K9me2/3 Binding
  description: >-
    De novo missense variants in CBX1 substitute conserved residues (Thr51,
    Trp52, Asn57, Leu40, Cys60) within the HP1-beta chromodomain, the domain
    that reads methylated histone H3K9. The variants reduce HP1-beta binding to
    H3K9me2/3 and mislocalize HP1-beta away from heterochromatic chromocenters
    to a homogeneous nuclear distribution.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CBX1
      term:
        id: hgnc:1551
        label: CBX1
    allele_type: missense
    variant_origin: DE_NOVO
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: histone H3K9me2/3 reader activity
    term:
      id: GO:0062072
      label: histone H3K9me2/3 reader activity
    modifier: DECREASED
  evidence:
  - reference: PMID:37087635
    reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modeling is consistent with the identified CBX1 variants abolishing the interaction between HP1β and methylated histones"
    explanation: Structural modeling predicts the chromodomain variants disrupt the histone-binding interface.
  - reference: PMID:37087635
    reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These observations are consistent with the notion that the CD mutants reduce the ability of HP1β to bind methylated histones found in heterochromatin"
    explanation: ChIP-Western blot shows the mutant's reduced binding to methylated heterochromatin marks, confirming the loss of H3K9me2/3 binding by this node.
  downstream:
  - target: Dominant-Negative Sequestration of HP1 Dimers
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "W52L and N57D heterozygous mutant samples demonstrated that HP1β localized throughout the nucleus without distinct accumulation at chromocenters seen in WT, despite the presence of WT HP1β, suggesting these Cbx1 variants exert a dominant-negative effect"
      explanation: Mutant HP1-beta mislocalizes despite wild-type HP1-beta being present, the signature of the dominant-negative sequestration step.
- name: Dominant-Negative Sequestration of HP1 Dimers
  description: >-
    Because HP1-beta forms homo- and heterodimers through its chromo shadow
    domain, the chromatin-binding-deficient chromodomain mutant retains
    dimerization and sequesters wild-type HP1-beta and other HP1 proteins,
    reducing the pool of functional chromatin-binding HP1 dimers.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Heterochromatin Organization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Because HP1β forms homodimers and heterodimers, mutant HP1β likely sequesters wild-type HP1β and other HP1 proteins, exerting dominant-negative effects"
      explanation: IP-MS and mutant-neuron data support dominant-negative sequestration of wild-type HP1 proteins.
- name: Impaired Heterochromatin Organization
  description: >-
    Loss of functional HP1 dimers disrupts assembly and maintenance of
    constitutive heterochromatin, and reduces HP1-beta recruitment of the
    GLP/G9a and PRC1.6 chromatin-silencing complexes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: heterochromatin organization
    term:
      id: GO:0070828
      label: heterochromatin organization
    modifier: DECREASED
  evidence:
  - reference: PMID:37087635
    reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.(Val23Met) and p.(Asn57Asp) mutants demonstrated impaired binding to the GLP/G9a complex"
    explanation: >-
      IP-MS shows the chromodomain mutant loses recruitment of the GLP/G9a
      silencing complex. p.(Asn57Asp) is a patient variant; p.(Val23Met) is a
      previously described experimental chromodomain mutant used as a control
      here, not one of this entry's patient variants.
  downstream:
  - target: Dysregulated Transcriptional Silencing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "H3K9 methylation is associated with chromatin silencing, and HP1β recognition of this methylated histone mark is necessary for this process"
      explanation: Established molecular biology linking HP1-beta/H3K9me recognition to transcriptional silencing.
- name: Dysregulated Transcriptional Silencing
  description: >-
    Reduced HP1-beta recruitment of the transcriptionally repressive GLP/G9a and
    PRC1.6 complexes is inferred to weaken silencing and de-repress normally
    silenced loci. This step is an inference from the protein-interaction and
    heterochromatin data; neither cited paper measures transcription directly in
    patient or neuronal cells, so no cell-type binding is asserted.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37087635
      reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Mutated CBX1 abolishes the interaction of HP1β with GLP/G9a and PRC1.6 complexes, raising the possibility of a shared molecular pathogenesis between several neurodevelopmental disorders"
      explanation: The authors propose, as a possibility rather than a measured result, that losing these silencing complexes is the route to the neurodevelopmental phenotype shared with related disorders.
- name: Abnormal Brain Development
  description: >-
    Dysregulated heterochromatin-dependent gene expression during brain
    development produces the neurodevelopmental phenotype; HP1-beta has a
    non-redundant role in neurocognitive development.
  biological_scale: ORGANISM
  downstream:
  - target: Global developmental delay
  - target: Intellectual disability
  - target: Hypotonia
  - target: Autistic behavior
  - target: Delayed speech and language development
  evidence:
  - reference: PMID:37087635
    reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These collective findings confirm the role of CBX1 in developmental disabilities through the disruption of HP1β chromatin binding during neurocognitive development"
    explanation: Ties the molecular defect to the developmental phenotype observed in patients.

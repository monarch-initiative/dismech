name: CBX1-related neurodevelopmental disorder
creation_date: "2026-10-30T00:00:00Z"
category: Mendelian
description: >-
  CBX1-related neurodevelopmental disorder (CBX1-related syndrome) is an
  autosomal dominant Mendelian neurodevelopmental disorder caused by de novo
  missense variants in CBX1, the gene encoding heterochromatin protein 1 beta
  (HP1-beta). HP1-beta is a chromodomain protein that reads di- and
  tri-methylated histone H3 lysine 9 (H3K9me2/3) and, as homo- and heterodimers,
  organizes constitutive heterochromatin to maintain transcriptional silencing.
  The reported pathogenic variants cluster in the chromodomain, abolishing
  HP1-beta binding to methylated histones; because HP1-beta dimerizes, mutant
  protein sequesters wild-type HP1 proteins and acts through a dominant-negative
  mechanism rather than simple haploinsufficiency. Affected individuals present
  with global developmental delay, intellectual disability, hypotonia, autistic
  features, and variable mild dysmorphic features such as a broad forehead.
synonyms:
- CBX1-related syndrome
disease_term:
  preferred_term: CBX1-related neurodevelopmental disorder
  term:
    id: MONDO:0700367
    label: CBX1-related neurodevelopmental disorder
parents:
- chromatin remodeling disorder
- neurodevelopmental disorder
genetic:
- name: CBX1
  gene_term:
    preferred_term: CBX1
    term:
      id: hgnc:1551
      label: CBX1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant (de novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      All reported individuals carry heterozygous de novo missense variants in
      the CBX1 chromodomain.
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified heterozygous de novo variants in CBX1. The identified variants were in the chromodomain, the functional domain of HP1β, which mediates interactions with chromatin"
      explanation: Establishes heterozygous de novo chromodomain variants as the cause.
  notes: >-
    The disorder is caused by dominant-negative chromodomain missense variants,
    not haploinsufficiency: CBX1 is loss-of-function constrained (0 observed vs
    11.5 expected LoF variants, pLI 0.98) yet heterozygous Cbx1 loss-of-function
    mice have no major phenotype, whereas heterozygous chromodomain-mutant mice
    recapitulate the dominant-negative cellular defect.
  variants:
  - name: p.Trp52Leu
    description: >-
      Chromodomain missense variant (NM_001127228.2:c.155G>T); one of the three
      founding de novo variants.
    clinical_significance: PATHOGENIC
  - name: p.Asn57Asp
    description: >-
      Chromodomain missense variant (NM_001127228.2:c.169A>G) lying directly
      within the HP1-beta histone-binding cleft.
    clinical_significance: PATHOGENIC
  - name: p.Thr51Pro
    description: >-
      Chromodomain missense variant (NM_001127228.2:c.151A>C); one of the three
      founding de novo variants.
    clinical_significance: PATHOGENIC
  - name: p.Leu40Pro
    description: >-
      Chromodomain missense variant reported in the spectrum-expansion cohort,
      associated with global developmental delay.
    clinical_significance: PATHOGENIC
  - name: p.Cys60Arg
    description: >-
      Chromodomain missense variant reported in the spectrum-expansion cohort,
      associated with global developmental delay.
    clinical_significance: PATHOGENIC
  - name: p.Cys60Gly
    description: >-
      Chromodomain missense variant reported in the spectrum-expansion cohort;
      showed an intermediate cellular phenotype and milder (speech-predominant)
      presentation.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:42867044
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is caused by heterozygous missense variants in CBX1, which encodes heterochromatin protein 1 beta (HP1β). These variants are situated within the chromodomain of HP1β"
    explanation: Confirms chromodomain missense variants as causative across an independent cohort.
pathophysiology:
- name: CBX1 Chromodomain Variant with Loss of H3K9me2/3 Binding
  description: >-
    De novo missense variants in CBX1 substitute conserved residues (Thr51,
    Trp52, Asn57, Leu40, Cys60) within the HP1-beta chromodomain, the domain
    that reads methylated histone H3K9. The variants reduce HP1-beta binding to
    H3K9me2/3 and mislocalize HP1-beta away from heterochromatic chromocenters
    to a homogeneous nuclear distribution.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: CBX1
      term:
        id: hgnc:1551
        label: CBX1
    allele_type: missense
    variant_origin: DE_NOVO
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: histone H3K9me2/3 reader activity
    term:
      id: GO:0062072
      label: histone H3K9me2/3 reader activity
    modifier: DECREASED
  evidence:
  - reference: PMID:37087635
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Molecular modeling is consistent with the identified CBX1 variants abolishing the interaction between HP1β and methylated histones"
    explanation: The chromodomain variants disrupt the histone-binding interface.
  downstream:
  - target: Dominant-Negative Sequestration of HP1 Dimers
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These observations are consistent with the notion that the CD mutants reduce the ability of HP1β to bind methylated histones found in heterochromatin"
      explanation: ChIP-Western blot shows reduced mutant HP1-beta binding to methylated heterochromatin marks.
- name: Dominant-Negative Sequestration of HP1 Dimers
  description: >-
    Because HP1-beta forms homo- and heterodimers through its chromo shadow
    domain, the chromatin-binding-deficient chromodomain mutant retains
    dimerization and sequesters wild-type HP1-beta and other HP1 proteins,
    reducing the pool of functional chromatin-binding HP1 dimers.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Heterochromatin Organization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because HP1β forms homodimers and heterodimers, mutant HP1β likely sequesters wild-type HP1β and other HP1 proteins, exerting dominant-negative effects"
      explanation: States the dominant-negative sequestration mechanism.
- name: Impaired Heterochromatin Organization
  description: >-
    Loss of functional HP1 dimers disrupts assembly and maintenance of
    constitutive heterochromatin, and reduces HP1-beta recruitment of the
    GLP/G9a and PRC1.6 chromatin-silencing complexes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: heterochromatin organization
    term:
      id: GO:0070828
      label: heterochromatin organization
    modifier: DECREASED
  downstream:
  - target: Dysregulated Transcriptional Silencing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "H3K9 methylation is associated with chromatin silencing, and HP1β recognition of this methylated histone mark is necessary for this process"
      explanation: Links HP1-beta/H3K9me recognition to transcriptional silencing.
- name: Dysregulated Transcriptional Silencing
  description: >-
    Disrupted heterochromatin and reduced recruitment of the transcriptionally
    repressive GLP/G9a and PRC1.6 complexes de-represses normally silenced loci,
    dysregulating gene expression in developing neurons.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutated CBX1 abolishes the interaction of HP1β with GLP/G9a and PRC1.6 complexes"
      explanation: Loss of silencing-complex recruitment is the proposed route to the shared neurodevelopmental pathway.
- name: Abnormal Brain Development
  description: >-
    Dysregulated heterochromatin-dependent gene expression during brain
    development produces the neurodevelopmental phenotype; HP1-beta has a
    non-redundant role in neurocognitive development.
  biological_scale: ORGANISM
  downstream:
  - target: Global developmental delay
  - target: Intellectual disability
  - target: Hypotonia
  - target: Autistic behavior
  - target: Delayed speech and language development
  evidence:
  - reference: PMID:37087635
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These collective findings confirm the role of CBX1 in developmental disabilities through the disruption of HP1β chromatin binding during neurocognitive development"
    explanation: Ties the molecular defect to the developmental phenotype.

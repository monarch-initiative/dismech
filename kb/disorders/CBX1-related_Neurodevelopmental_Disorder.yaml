pathophysiology:
- name: CBX1 Chromodomain Variant with Loss of H3K9me2/3 Binding
  description: >-
    De novo missense variants in CBX1 substitute conserved residues (Thr51,
    Trp52, Asn57, Leu40, Cys60) within the HP1-beta chromodomain, the domain
    that reads methylated histone H3K9. The variants reduce HP1-beta binding to
    H3K9me2/3 and mislocalize HP1-beta away from heterochromatic chromocenters
    to a homogeneous nuclear distribution.
  biological_scale: MOLECULAR

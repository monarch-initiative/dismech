animal_models:
- name: Cbx1 W52L knock-in mouse
  species: Mouse
  genotype: Cbx1 p.(Trp52Leu) heterozygous (W52L+/-), CRISPR/Cas9 knock-in
  publication: PMID:37087635
  description: >-
    Knock-in mouse carrying the patient chromodomain variant p.(Trp52Leu).
    Heterozygotes are viable; homozygotes are embryonic lethal. HP1-beta
    mislocalizes away from chromocenters in mutant neurons despite the presence
    of wild-type HP1-beta, and mutant mice show an increased latency-to-peak
    acoustic startle response.
  modeled_mechanisms:
  - target: Dominant-Negative Sequestration of HP1 Dimers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mutant HP1-beta localizes throughout the nucleus without accumulation at
      chromocenters despite wild-type HP1-beta being present, demonstrating the
      dominant-negative effect in primary neurons.
    limitations: >-
      The behavioral battery was largely normal apart from latency-to-peak
      startle; the model captures the molecular/cellular dominant-negative
      defect rather than the human cognitive phenotype, and only chromodomain
      missense alleles were modeled.
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "W52L and N57D heterozygous mutant samples demonstrated that HP1β localized throughout the nucleus without distinct accumulation at chromocenters seen in WT, despite the presence of WT HP1β, suggesting these Cbx1 variants exert a dominant-negative effect"
      explanation: Shows the knock-in model reproduces the dominant-negative mislocalization.
    readouts:
    - name: HP1-beta nuclear localization in primary neurons
      target: Dominant-Negative Sequestration of HP1 Dimers
      direction: ALTERED
      interpretation: Loss of chromocenter accumulation indicates impaired heterochromatin binding of HP1 dimers.
  - target: Abnormal Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Mutant mice show increased latency-to-peak acoustic startle response,
      interpreted as delayed neurotransmission; overt brain structure and most
      behaviors are normal.
    limitations: >-
      Mouse behavior does not reproduce the human developmental delay,
      intellectual disability, or autistic phenotype; the only robust deficit is
      the latency-to-peak startle response.
    evidence:
    - reference: PMID:37087635
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cbx1 chromodomain mutant mice displayed increased latency-to-peak response, suggesting the possibility of synaptic delay or myelination deficits"
      explanation: The in vivo neurofunctional deficit supports a role in neurodevelopment.
    readouts:
    - name: Latency-to-peak acoustic startle response
      target: Abnormal Brain Development
      direction: INCREASED
      interpretation: Slower startle response is consistent with delayed neurotransmission.

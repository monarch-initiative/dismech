    explanation: Structural modeling predicts the chromodomain variants disrupt the histone-binding interface.
  - reference: PMID:37087635
    reference_title: Dominant-negative variants in CBX1 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These observations are consistent with the notion that the CD mutants reduce the ability of HP1β to bind methylated histones found in heterochromatin"
    explanation: ChIP-Western blot shows the mutant's reduced binding to methylated heterochromatin marks, confirming the loss of H3K9me2/3 binding by this node.
  downstream:

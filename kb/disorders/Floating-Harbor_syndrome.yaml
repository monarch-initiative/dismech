    quote_role: REVIEW_SYNTHESIS
    snippet: "Each child of an individual with SRCAP-FHS has a 50% chance of inheriting the pathogenic variant. Prenatal and preimplantation genetic testing are possible for families in which the pathogenic variant has been identified."
    explanation: GeneReviews documents 50% offspring recurrence risk and availability of prenatal and preimplantation genetic testing.
pathophysiology:
- name: SRCAP truncation-driven chromatin dysregulation
  description: >-
    Heterozygous nonsense or frameshift variants clustering in exons 33 and 34
    of SRCAP produce a C-terminally truncated ATPase subunit lacking the three
    C-terminal AT-hook DNA-binding motifs while retaining N-terminal Helicase-SANT-Associated
    ATPase, and CBP-binding domains. In human embryonic cranial neural
    crest cells, C-terminally truncated SRCAP is largely excluded from the
    nucleus, exerting a dominant-negative effect on the multiprotein INO80-family
    SRCAP chromatin remodeling complex.
  genes:
  - preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
  - preferred_term: ATP-dependent H2AZ histone chaperone activity
    modifier: DECREASED
    term:
      id: GO:0140849
      label: ATP-dependent H2AZ histone chaperone activity
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:34474679
    reference_title: >-
      The ATPase SRCAP is associated with the mitotic apparatus, uncovering
      novel molecular aspects of Floating-Harbor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      FHS has a dominant inheritance pattern caused by nonsense or frameshift
      mutations in exons 33 and 34 of Srcap gene ... These mutations are
      supposed to produce a C-terminal-truncated SRCAP protein variant missing
      the AT-hook motifs with DNA-binding activity and are possibly responsible
      for a dominant negative effect triggering the onset of FHS
    explanation: >-
      Supports the mechanism of exon 33/34 truncating variants removing C-terminal
      AT-hook DNA-binding motifs and acting in a dominant-negative manner.
  - reference: DOI:10.3389/fgene.2022.846101
    reference_title: >-
      Molecular Genetics and Pathogenesis of the Floating Harbor Syndrome: Case
      Report of Long-Term Growth Hormone Treatment and a Literature Review
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we suggested a new model of FHS pathogenesis which provides
      possible basis for the dominant negative nature of FHS-causing mutations
      and explains limited effects of GH treatment in FHS.
    explanation: This supports a dominant-negative SRCAP disease mechanism underlying Floating-Harbor syndrome.
  downstream:
  - target: Defective SRCAP-Mediated H2A.Z Chromatin Incorporation
    description: >-
      Loss of functional nuclear SRCAP chromatin-remodeling complex activity
      impairs canonical H2A-to-H2A.Z histone exchange and CREBBP-mediated
      transcriptional coactivation.
  - target: Impaired Mitotic Spindle and Cytokinesis Regulation
    description: >-
      Depletion or perturbation of SRCAP disrupts its chromatin-independent
      association with centrosomes, the mitotic spindle, and the midbody during
      cell division.
- name: Defective SRCAP-Mediated H2A.Z Chromatin Incorporation
  description: >-
    The primary catalytic activity of the SRCAP complex is ATP-dependent
    replacement of canonical histone H2A with the H2A.Z variant at promoters
    and enhancers, alongside transcriptional coactivation via CREBBP (CBP)
    binding.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:34474679
    reference_title: >-
      The ATPase SRCAP is associated with the mitotic apparatus, uncovering
      novel molecular aspects of Floating-Harbor syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The primary function of SRCAP complex is to catalyze the exchange of
      canonical histone H2A with the H2A.Z variant
    explanation: >-
      Establishes H2A-to-H2A.Z histone variant exchange as the core chromatin
      remodeling function of the SRCAP complex.
  downstream:
  - target: Delayed Endochondral Ossification and Growth Plate Maturation
    description: >-
      Dysregulated H2A.Z deposition and CREBBP-coupled transcriptional
      programs impair bone mineralization and skeletal maturation.
  - target: Aberrant Cranial Neural Crest Development
    description: >-
      Altered epigenetic and transcriptional regulation in cranial neural crest
      cells disrupts craniofacial morphogenesis.
  - target: Neurodevelopmental Patterning Defect
    description: >-
      Disrupted SRCAP chromatin remodeling in developing neural tissues impairs
      speech, language, and neurocognitive development.
- name: Impaired Mitotic Spindle and Cytokinesis Regulation
  description: >-
    Independent of its interphase chromatin-remodeling role, SRCAP localizes
    dynamically to centrosomes, the mitotic spindle, and the midbody during
    cell division, where it interacts with cytokinesis regulators and promotes
    their midbody recruitment. SRCAP depletion causes chromosome misalignment,
    abnormally shaped spindles, chromatin bridges, and failed abscission,
    which may contribute to developmental growth failure.
  biological_processes:
  - preferred_term: mitotic spindle organization
    modifier: ABNORMAL
    term:
      id: GO:0007052
      label: mitotic spindle organization
  - preferred_term: mitotic cytokinesis
    modifier: ABNORMAL
    term:
      id: GO:0000281
      label: mitotic cytokinesis
  evidence:
  - reference: PMID:34474679
    reference_title: >-
      The ATPase SRCAP is associated with the mitotic apparatus, uncovering
      novel molecular aspects of Floating-Harbor syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, we found that SRCAP associates with components of the
      mitotic apparatus (centrosomes, spindle, midbody), interacts with a
      plethora of cytokinesis regulators, and positively regulates their
      recruitment to the midbody. Remarkably, SRCAP depletion perturbs both
      mitosis and cytokinesis.
    explanation: >-
      Demonstrates in HeLa cells that SRCAP localizes to the mitotic apparatus
      and that its depletion impairs mitosis and cytokinesis, suggesting a
      potential cell-division contribution to Floating-Harbor syndrome.
  downstream:
  - target: Delayed Endochondral Ossification and Growth Plate Maturation
    description: >-
      Defective mitotic progression and cytokinesis may contribute to delayed
      bone mineralization and growth deficiency.
  - target: Aberrant Cranial Neural Crest Development
    description: >-
      Mitotic and cytokinesis perturbations may contribute to craniofacial
      developmental abnormalities.
- name: Delayed Endochondral Ossification and Growth Plate Maturation
  description: >-
    Perturbed SRCAP-dependent transcriptional and mitotic programs cause
    delayed bone mineralization, prepubertal bone age delay that normalizes
    between ages six and 12 years, short stature, and appendicular skeletal
    anomalies.
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: ossification
    modifier: ABNORMAL
    term:
      id: GO:0001503
      label: ossification
  evidence:
  - reference: PMID:34474679
    reference_title: >-
      The ATPase SRCAP is associated with the mitotic apparatus, uncovering
      novel molecular aspects of Floating-Harbor syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Floating-Harbor syndrome (FHS), also known as Pelletier–Leisti syndrome
      ... is a human developmental disorder characterized by delayed bone
      mineralization and growth deficiency, which are often associated with
      intellectual disability and skeletal and craniofacial abnormalities
    explanation: >-
      Links SRCAP dysfunction to delayed bone mineralization, growth
      deficiency, and skeletal abnormalities.
  - reference: PMID:23193612
    reference_title: SRCAP-Related Floating-Harbor Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SRCAP-related Floating-Harbor syndrome (SRCAP-FHS) is characterized by
      typical craniofacial features; low birth weight, normal head
      circumference, and short stature; bone age delay that normalizes between
      ages six and 12 years; skeletal anomalies (brachydactyly, broad
      fingertips, clinodactyly, short thumbs, prominent joints, and clavicular
      abnormalities);
    explanation: >-
      Documents the core skeletal maturation delay, short stature, and
      appendicular skeletal anomalies of Floating-Harbor syndrome.
  downstream:
  - target: Short stature
    description: Delayed bone mineralization and skeletal maturation cause proportionate short stature.
  - target: Delayed skeletal maturation
    description: Retarded ossification manifests as markedly delayed bone age in early childhood.
  - target: Brachydactyly
    description: Disordered appendicular skeletal ossification produces brachydactyly.
  - target: Short thumb
    description: Disordered appendicular skeletal ossification produces short thumbs.
  - target: Broad fingertip
    description: Disordered distal phalangeal modeling produces broad fingertips.
  - target: Abnormal clavicle morphology
    description: Impaired skeletal ossification produces clavicular abnormalities.
- name: Aberrant Cranial Neural Crest Development
  description: >-
    Nuclear exclusion of C-terminally truncated SRCAP in embryonic cranial
    neural crest cells impairs craniofacial morphogenesis and pharyngeal/laryngeal
    structural development.
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  evidence:
  - reference: PMID:34474679
    reference_title: >-
      The ATPase SRCAP is associated with the mitotic apparatus, uncovering
      novel molecular aspects of Floating-Harbor syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Recently, localization assays in human embryonic cranial neural crest
      cells showed that overexpressed GFP/Flag-tagged versions of
      C-terminal-truncated SRCAP are largely excluded from the nucleus but
      present in the cytoplasm ... suggesting that FHS mutations affect the
      nuclear localization of SRCAP.
    explanation: >-
      Demonstrates defective nuclear localization of FHS-mutant SRCAP in human
      embryonic cranial neural crest cells.
  downstream:
  - target: Abnormal facial shape
    description: Impaired cranial neural crest patterning produces the characteristic triangular facies, deep-set eyes, bulbous nose with low-hanging columella, and short philtrum.
  - target: Hypernasal speech
    description: Craniofacial and velopharyngeal developmental abnormalities produce hypernasal resonance.
  - target: High-pitched voice
    description: Laryngeal and craniofacial developmental anomalies contribute to the characteristic high-pitched voice.
- name: Neurodevelopmental Patterning Defect
  description: >-
    Truncating variants in exons 33 and 34 of SRCAP disrupt chromatin-mediated
    neurodevelopmental transcriptional programs, causing speech and language
    impairment and intellectual disability.
  biological_processes:
  - preferred_term: nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:33909990
    reference_title: >-
      Truncating SRCAP variants outside the Floating-Harbor syndrome locus
      cause a distinct neurodevelopmental disorder with a specific DNA
      methylation signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Truncating variants in exons 33 and 34 of the SNF2-related CREBBP
      activator protein (SRCAP) gene cause the neurodevelopmental disorder
      (NDD) Floating-Harbor syndrome (FLHS), characterized by short stature,
      speech delay, and facial dysmorphism.
    explanation: >-
      Connects exon 33/34 truncating SRCAP variants to the neurodevelopmental
      disorder and speech delay of Floating-Harbor syndrome.
  downstream:
  - target: Intellectual disability
    description: Disrupted chromatin-associated neurodevelopmental regulation causes mild-to-moderate intellectual disability.
  - target: Delayed speech and language development
    description: Neurodevelopmental dysregulation produces severe receptive and expressive language impairment, particularly expressive verbal apraxia.

  - classification_value: NEUROLOGIC
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Extremely rare autosomal dominant syndrome with slightly more than 100
    cases reported worldwide in the medical literature.
  evidence:
  - reference: DOI:10.3389/fgene.2022.846101
    reference_title: >-
      Molecular Genetics and Pathogenesis of the Floating Harbor Syndrome: Case
      Report of Long-Term Growth Hormone Treatment and a Literature Review
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Floating Harbor syndrome (FHS) is an extremely rare disorder, with
      slightly more than a hundred cases reported worldwide. FHS is caused by
      heterozygous mutations in the SRCAP gene; however, little is known about
      the pathogenesis of FHS or the effectiveness of its treatment.
    explanation: >-
      This directly documents the ultra-rare literature case count for
      Floating-Harbor syndrome worldwide.
progression:
- phase: Prenatal and infantile growth onset
  age_range: Prenatal to infancy
  notes: >-

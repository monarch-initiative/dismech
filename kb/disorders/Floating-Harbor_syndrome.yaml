genetic:
- name: SRCAP
  association: Causal heterozygous truncating variant
  gene_term:
    preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  notes: >-
    Floating-Harbor syndrome is caused by heterozygous pathogenic SRCAP
    variants, especially nonsense or frameshift truncating variants clustering
    in exons 33 and 34 (such as p.Arg2444* and p.Arg2435*), whereas truncating
    variants proximal or distal to this locus cause a distinct non-FLHS
    SRCAP-related neurodevelopmental disorder.
  evidence:
  - reference: DOI:10.3389/fgene.2022.846101
    reference_title: >-
      Molecular Genetics and Pathogenesis of the Floating Harbor Syndrome: Case
      Report of Long-Term Growth Hormone Treatment and a Literature Review
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FHS is caused by heterozygous mutations in the SRCAP gene; however,
      little is known about the pathogenesis of FHS or the effectiveness of its
      treatment.
    explanation: This directly supports SRCAP as the causal gene for Floating-Harbor syndrome.
  - reference: PMID:33909990
    reference_title: >-
      Truncating SRCAP variants outside the Floating-Harbor syndrome locus
      cause a distinct neurodevelopmental disorder with a specific DNA
      methylation signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Truncating variants in exons 33 and 34 of the SNF2-related CREBBP
      activator protein (SRCAP) gene cause the neurodevelopmental disorder
      (NDD) Floating-Harbor syndrome (FLHS), characterized by short stature,
      speech delay, and facial dysmorphism.
    explanation: Confirms that truncating variants specifically in exons 33 and 34 of SRCAP cause Floating-Harbor syndrome.
  - reference: CGGV:assertion_5b414014-3a99-48f2-aac1-20903838af0f-2023-08-01T063000.000Z
    reference_title: "SRCAP / Floating-Harbor syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SRCAP | HGNC:16974 | Floating-Harbor syndrome | MONDO:0007621 | AD | Definitive"
    explanation: ClinGen classifies the SRCAP-Floating-Harbor syndrome gene-disease relationship as definitive with autosomal dominant inheritance.

      typical craniofacial features; low birth weight, normal head
      circumference, and short stature; bone age delay that normalizes between
      ages six and 12 years;
    explanation: >-
      Supports prenatal/neonatal low birth weight and early childhood short
      stature with bone age delay.
- phase: Childhood skeletal maturation catch-up
  age_range: 6 to 12 years
  notes: >-
    Markedly delayed bone age in early childhood characteristically accelerates
    and normalizes between 6 and 12 years of age.
  evidence:

      cause a distinct neurodevelopmental disorder with a specific DNA
      methylation signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because FLHS is known to be associated with a unique set of DNA
      methylation (DNAm) changes in blood, a DNAm signature, we investigated
      whether there was a distinct signature associated with our affected
      individuals. A machine-learning model, based on the FLHS DNAm signature,
      negatively classified all our tested subjects.
    explanation: >-
      Supports blood DNA methylation signature profiling as a specific
      diagnostic classifier for Floating-Harbor syndrome.

    recessive inheritance pattern, recurrence risk in consanguineous unions, and
    carrier testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
differential_diagnoses:
- name: Charcot-Marie-Tooth Disease Type 4K
  description: >-
    CMT4K (MONDO:0014733, SURF1-related) is a cytochrome c oxidase assembly
    defect rather than a Schwann-cell myelin-maintenance defect, and is
    distinguished clinically by lactic acidosis and by putaminal and
    periaqueductal lesions developing years after the neuropathy — features no
    other CMT4 subtype shows. It is listed in the has_subtypes roster above,
    because it is a hierarchical MONDO descendant of this entry's own term, and
    is kept here as well for those distinguishing features. Four subtypes of this
    compartment carry dedicated dismech entries - CMT4B3, CMT4C, CMT4D and CMT4K
    - so CMT4K is not the only one, which an earlier version of this text
    incorrectly claimed.
  distinguishing_features:
  - Lactic acidosis
  - Putaminal and periaqueductal brain MRI lesions
  - Cerebellar ataxia developing years after the polyneuropathy
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found SURF1 mutations in 5% of families (2/41) presenting with CMT4."
    explanation: >-
      Establishes SURF1 as a cause of CMT4 that this entry's has_subtypes list
      does not cover, and quantifies its share of otherwise unsolved CMT4.

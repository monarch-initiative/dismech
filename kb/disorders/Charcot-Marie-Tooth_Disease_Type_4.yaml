- name: Endosome-Lysosome Trafficking Defect
  description: >-
    The CMT4J route, and the reason FIG4 was previously the one CMT4 gene in this
    entry that reached no mechanism node. FIG4 is a
    phosphatidylinositol-3,5-bisphosphate 5-phosphatase. Fibroblasts from the
    Fig4 mutant pale tremor mouse carry an abnormal concentration of
    PtdIns(3,5)P2 and a cytoplasm filled with large LAMP-2-immunoreactive
    vacuoles, which the authors read as dysfunction of the late
    endosome-lysosome axis. FIG4 is a second phosphoinositide lesion in this
    compartment, alongside the myotubularin lesion of CMT4B1 and CMT4B2, but the
    pathology reported for it is vacuolar rather than the myelin outfolding that
    characterizes CMT4B.

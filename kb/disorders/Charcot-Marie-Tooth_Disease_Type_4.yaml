- name: Frabin Cdc42 Exchange Factor Defect
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    The CMT4H route. FGD4 encodes frabin, a GDP/GTP nucleotide exchange factor
    specific to Cdc42, a Rho-family GTPase. Truncated FRABIN mutants expressed in

      The conservation argument the authors use to nominate the exonic variant as
      pathogenic, which is the strength of the causal claim available here.
  - reference: PMID:23996628
    reference_title: "Founder mutations in NDRG1 and HK1 genes are common causes of inherited neuropathies among Roma/Gypsies in Slovakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected mutation p.R148X (g.631C>T) in the NDRG1 (NM_006096.3) gene in two families and mutation g.9712G>C in the HK1 (NM_033498) gene in the other two families. These mutations cause CMT4D and CMT4G, respectively."
    explanation: >-
      Independent replication of the HK1 founder variant in CMT4G families, in a
      cohort separate from the original HMSNR mapping study.
- name: FGD4
  gene_term:
    preferred_term: FGD4
    term:
      id: hgnc:19125
      label: FGD4
  association: Causal
  relationship_type: CAUSATIVE
  subtype: CMT4H
  notes: >-
    Encodes frabin, a GDP/GTP nucleotide exchange factor specific to Cdc42.
    Truncated FRABIN mutants expressed in rat primary motoneurons and rat
    Schwann cells induce significantly fewer microspikes than wild-type, which is
    the functional evidence for the actin-cytoskeletal lesion in CMT4H.
  evidence:
  - reference: PMID:17564959
    reference_title: "Mutations in FGD4 encoding the Rho GDP/GTP exchange factor FRABIN cause autosomal recessive Charcot-Marie-Tooth type 4H."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here the identification of mutations in FGD4, encoding FGD4 or FRABIN (FGD1-related F-actin binding protein), in both families."
    explanation: >-
      Establishes FGD4 as the CMT4H gene in the two mapped consanguineous
      families.
  - reference: PMID:17564959
    reference_title: "Mutations in FGD4 encoding the Rho GDP/GTP exchange factor FRABIN cause autosomal recessive Charcot-Marie-Tooth type 4H."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of truncated FRABIN mutants in rat primary motoneurons and rat Schwann cells induced significantly fewer microspikes than expression of wild-type FRABIN"
    explanation: >-
      The cell-culture measurement behind this record's mechanistic statement,
      and the evidence for the FGD4 pathophysiology node.
inheritance:
- name: Autosomal Recessive
  description: >-
    By definition, the CMT4 subtypes are inherited in an autosomal recessive
    manner: affected individuals carry biallelic (homozygous or compound
    heterozygous) pathogenic variants, most commonly in consanguineous families.
    Recessive CMT is generally earlier in onset and clinically more severe than
    the dominant CMT1/CMT2 forms.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive peripheral neuropathies are relatively rare but are clinically more severe than autosomal dominant forms of CMT"
    explanation: Documents autosomal recessive inheritance and the more severe course characteristic of CMT4.

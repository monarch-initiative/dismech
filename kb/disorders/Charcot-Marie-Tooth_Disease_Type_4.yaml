  - reference: PMID:11157804
    reference_title: "A mutation in periaxin is responsible for CMT4F, an autosomal recessive form of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "L- and S-periaxin are proteins of myelinating Schwann cells and homozygous periaxin-null mice display extensive demyelination of myelinated fibers in the peripheral nervous system"
    explanation: Periaxin-null mice show extensive PNS demyelination, supporting periaxin's role in Schwann-cell myelin maintenance in CMT4F.
- name: EGR2-Dependent Schwann Cell Differentiation Block
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    The CMT4E route. EGR2 is a transcription factor whose stable expression is
    specifically associated with the onset of peripheral myelination, and Egr2
    null mice show a block of Schwann-cell differentiation at an early stage.
    Recessive EGR2 missense mutation in humans produces congenital
    hypomyelinating neuropathy, a hypomyelinating rather than a demyelinating
    presentation. Note that the mouse evidence is from a null allele while the
    human CMT4E allele is missense, so the severity of the differentiation block
    in patients is an extrapolation, and this node records the program as
    abnormal rather than abolished.

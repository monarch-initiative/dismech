- name: Impaired Axon-Glia Interaction
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    Biallelic loss of Schwann-cell genes NDRG1 (CMT4D / HMSN-Lom) and PRX /
    periaxin (CMT4F) disrupts myelinating Schwann-cell function and the
    axon-glia interaction required to maintain the myelin sheath. NDRG1 loss
    produces Schwann-cell dysfunction with early axonal involvement, and
    periaxin loss destabilizes the myelin sheath, in both cases yielding a
    demyelinating neuropathy.

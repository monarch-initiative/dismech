name: Charcot-Marie-Tooth Disease Type 4
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4 (CMT4) is the autosomal-recessive
  compartment of Charcot-Marie-Tooth disease. It is the recessive counterpart of
  the dominant demyelinating (CMT1) and axonal (CMT2) compartments: the primary
  lesion is again in the myelinating Schwann cell (most CMT4 subtypes are
  demyelinating, with slowed nerve conduction and, in several forms, redundant
  myelin outfoldings or onion-bulb formation on nerve biopsy), but inheritance is
  autosomal recessive and the clinical course is generally earlier in onset and
  more severe than in the dominant forms. CMT4 is genetically heterogeneous, with
  each subtype defined by biallelic loss of a distinct Schwann-cell or
  neuronal gene: GDAP1 (CMT4A, mitochondrial dynamics), MTMR2 (CMT4B1) and SBF2 /
  MTMR13 (CMT4B2) in the myotubularin phosphoinositide-phosphatase family,
  SH3TC2 (CMT4C, the most common CMT4 subtype and a cause of early-onset
  scoliosis), NDRG1 (CMT4D / HMSN-Lom), PRX / periaxin (CMT4F), and FIG4 (CMT4J).
  Whatever the upstream gene, the subtypes converge on the same terminal node as
  the other CMT compartments — demyelination with secondary, length-dependent
  axonal degeneration — producing the shared clinical phenotype of distal
  weakness, wasting, sensory loss, foot deformity, and depressed reflexes.
disease_term:
  preferred_term: Autosomal recessive Charcot-Marie-Tooth disease (CMT4)
  term:
    id: MONDO:0018995
    label: Charcot-Marie-Tooth disease type 4
parents:
- Charcot-Marie-Tooth disease
has_subtypes:
- name: CMT4A
  display_name: CMT4A (GDAP1-related)
  description: >-
    Caused by biallelic mutations in GDAP1, which regulates mitochondrial
    fission and the mitochondrial network. CMT4A can present with axonal or
    demyelinating (or mixed) pathology and is often associated with vocal cord
    paresis. The same gene also causes dominant/recessive axonal CMT2K.
  evidence:
  - reference: PMID:11743580
    reference_title: "The gene encoding ganglioside-induced differentiation-associated protein 1 is mutated in axonal Charcot-Marie-Tooth type 4A disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish the molecular etiology of CMT4A (MIM 214400) and suggest that it may be associated with both axonal and demyelinating phenotypes."
    explanation: Establishes GDAP1 mutations as the molecular cause of CMT4A, with both axonal and demyelinating phenotypes.
- name: CMT4B1
  display_name: CMT4B1 (MTMR2-related)
  description: >-
    Autosomal recessive demyelinating neuropathy with characteristic focally
    folded (outfolded) myelin, caused by biallelic mutations in MTMR2 encoding
    myotubularin-related protein-2, a phosphoinositide (dual-specificity)
    phosphatase.
  evidence:
  - reference: PMID:10802647
    reference_title: "Charcot-Marie-Tooth type 4B is caused by mutations in the gene encoding myotubularin-related protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified in unrelated CMT4B patients mutations occurring in the gene MTMR2, encoding myotubularin-related protein-2, a dual specificity phosphatase (DSP)."
    explanation: Establishes MTMR2 mutations as the cause of demyelinating CMT4B (CMT4B1) with myelin outfoldings.
- name: CMT4B2
  display_name: CMT4B2 (SBF2 / MTMR13-related)
  description: >-
    Autosomal recessive demyelinating neuropathy with myelin outfoldings, in
    some families associated with early-onset glaucoma, caused by biallelic
    mutations in SBF2 (MTMR13), a catalytically inactive "pseudophosphatase"
    member of the myotubularin family.
  evidence:
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a demyelinating CMT, mainly characterized by the presence of myelin outfoldings on nerve biopsies, cosegregated as an autosomal recessive trait with early-onset glaucoma."
    explanation: Establishes SBF2 / MTMR13 mutations as the cause of demyelinating CMT4B2 with myelin outfoldings and early-onset glaucoma.
- name: CMT4C
  display_name: CMT4C (SH3TC2-related)
  description: >-
    Childhood-onset demyelinating CMT associated with early-onset scoliosis and
    a distinct Schwann-cell pathology, caused by biallelic mutations in SH3TC2
    (originally KIAA1985). CMT4C is the most frequently encountered CMT4 subtype.
  evidence:
  - reference: PMID:14574644
    reference_title: "Mutations in a gene encoding a novel SH3/TPR domain protein cause autosomal recessive Charcot-Marie-Tooth type 4C neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Charcot-Marie-Tooth disease type 4C (CMT4C) is a childhood-onset demyelinating form of hereditary motor and sensory neuropathy associated with an early-onset scoliosis and a distinct Schwann cell pathology."
    explanation: Establishes CMT4C as a childhood-onset demyelinating neuropathy with early-onset scoliosis caused by SH3TC2 (KIAA1985) mutations.
- name: CMT4D
  display_name: CMT4D / HMSN-Lom (NDRG1-related)
  description: >-
    Autosomal recessive demyelinating neuropathy (hereditary motor and sensory
    neuropathy-Lom, HMSNL) with Schwann-cell dysfunction and early axonal
    involvement, originally described in Roma communities with a founder NDRG1
    mutation.
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified the founder HMSNL mutation: a premature-termination codon at position 148 of the N-myc downstream-regulated gene 1 (NDRG1)."
    explanation: Establishes a founder NDRG1 truncating mutation as the cause of HMSN-Lom (CMT4D).
- name: CMT4F
  display_name: CMT4F (PRX / periaxin-related)
  description: >-
    Autosomal recessive demyelinating CMT (Dejerine-Sottas-like at the severe
    end) caused by biallelic mutations in PRX encoding periaxin, a protein of
    myelinating Schwann cells required for myelin sheath stability.
  evidence:
  - reference: PMID:11157804
    reference_title: "A mutation in periaxin is responsible for CMT4F, an autosomal recessive form of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a locus responsible for a demyelinating form of ARCMT disease, named CMT4F, has been mapped on 19q13 in a large consanguineous Lebanese family."
    explanation: Establishes CMT4F as a demyelinating autosomal recessive CMT, subsequently attributed to a PRX (periaxin) nonsense mutation.
- name: CMT4J
  display_name: CMT4J (FIG4-related)
  description: >-
    Autosomal recessive CMT caused by biallelic mutations in FIG4, a
    phosphatidylinositol-3,5-bisphosphate [PtdIns(3,5)P2] 5-phosphatase that
    regulates membrane trafficking in the endosome-lysosome axis.
  evidence:
  - reference: PMID:17572665
    reference_title: "Mutation of FIG4 causes neurodegeneration in the pale tremor mouse and patients with CMT4J."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified pathogenic mutations of human FIG4 (KIAA0274) on chromosome 6q21 in four unrelated patients with hereditary motor and sensory neuropathy. This novel form of autosomal recessive Charcot-Marie-Tooth disorder is designated CMT4J."
    explanation: Establishes biallelic FIG4 mutations as the cause of CMT4J in four unrelated patients.
pathophysiology:
- name: GDAP1 Mitochondrial Dynamics Defect
  description: >-
    Biallelic GDAP1 mutations (CMT4A) disrupt regulation of the mitochondrial
    network. GDAP1 promotes mitochondrial fission, and its loss impairs
    mitochondrial dynamics in Schwann cells and neurons, producing a neuropathy
    that can be axonal, demyelinating, or mixed and is frequently accompanied by
    vocal cord paresis.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: ABNORMAL
  genes:
  - preferred_term: GDAP1
    term:
      id: hgnc:15968
      label: GDAP1
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      GDAP1-driven mitochondrial dysfunction impairs Schwann-cell and axonal
      homeostasis, converging on demyelination with secondary axonal loss.
  evidence:
  - reference: PMID:11743580
    reference_title: "The gene encoding ganglioside-induced differentiation-associated protein 1 is mutated in axonal Charcot-Marie-Tooth type 4A disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish the molecular etiology of CMT4A (MIM 214400) and suggest that it may be associated with both axonal and demyelinating phenotypes."
    explanation: Establishes GDAP1 as the CMT4A gene with both axonal and demyelinating phenotypes.
- name: Myotubularin Phosphoinositide Dysregulation and Myelin Outfolding
  description: >-
    Biallelic loss of the myotubularin-family phosphoinositide phosphatases MTMR2
    (CMT4B1) and SBF2 / MTMR13 (CMT4B2) dysregulates Schwann-cell membrane
    phosphoinositide turnover. The resulting membrane-trafficking defect produces
    the redundant, focally folded (outfolded) myelin that is the histological
    hallmark of CMT4B, and a demyelinating neuropathy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: ABNORMAL
  genes:
  - preferred_term: MTMR2
    term:
      id: hgnc:7450
      label: MTMR2
  - preferred_term: SBF2
    term:
      id: hgnc:2135
      label: SBF2
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      Dysregulated Schwann-cell phosphoinositide metabolism produces myelin
      outfoldings and demyelination with secondary axonal loss.
  evidence:
  - reference: PMID:10802647
    reference_title: "Charcot-Marie-Tooth type 4B is caused by mutations in the gene encoding myotubularin-related protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gene mutated in Charcot-Marie-Tooth disease type 4B (CMT4B), an autosomal recessive demyelinating neuropathy with myelin outfoldings, has been mapped on chromosome 11q22."
    explanation: Establishes CMT4B as an autosomal recessive demyelinating neuropathy with myelin outfoldings; MTMR2 (CMT4B1) is the causal phosphoinositide phosphatase.
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two different nonsense mutations in the myotubularin-related 13 gene, MTMR13."
    explanation: Establishes SBF2 / MTMR13 loss as the CMT4B2 lesion in the same myotubularin outfolding mechanism.
- name: SH3TC2 Endosomal Recycling Defect in Schwann Cells
  description: >-
    Biallelic SH3TC2 (KIAA1985) mutations (CMT4C) disrupt an endosomal-recycling
    function required for normal Schwann-cell myelination, producing a
    childhood-onset demyelinating neuropathy with a distinct Schwann-cell
    pathology and prominent early-onset scoliosis.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: ABNORMAL
  genes:
  - preferred_term: SH3TC2
    term:
      id: hgnc:29427
      label: SH3TC2
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      Impaired SH3TC2-dependent Schwann-cell membrane trafficking produces
      demyelination with secondary axonal loss.
  evidence:
  - reference: PMID:14574644
    reference_title: "Mutations in a gene encoding a novel SH3/TPR domain protein cause autosomal recessive Charcot-Marie-Tooth type 4C neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We subsequently identified mutations in an uncharacterized transcript, KIAA1985, in 12 families with autosomal recessive neuropathy."
    explanation: Establishes SH3TC2 (KIAA1985) as the CMT4C gene across 12 autosomal recessive neuropathy families.
- name: Impaired Axon-Glia Interaction
  description: >-
    Biallelic loss of Schwann-cell genes NDRG1 (CMT4D / HMSN-Lom) and PRX /
    periaxin (CMT4F) disrupts myelinating Schwann-cell function and the
    axon-glia interaction required to maintain the myelin sheath. NDRG1 loss
    produces Schwann-cell dysfunction with early axonal involvement, and
    periaxin loss destabilizes the myelin sheath, in both cases yielding a
    demyelinating neuropathy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: Sensory neuron of peripheral nervous system
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Myelination in the peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  genes:
  - preferred_term: NDRG1
    term:
      id: hgnc:7679
      label: NDRG1
  - preferred_term: PRX
    term:
      id: hgnc:13797
      label: PRX
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      Loss of NDRG1- and periaxin-dependent Schwann-cell function impairs
      myelin maintenance and axon-glia interaction, producing demyelination
      with secondary axonal loss.
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HMSNL shows features of Schwann-cell dysfunction and a concomitant early axonal involvement, suggesting that impaired axon-glia interactions play a major role in its pathogenesis."
    explanation: Establishes impaired axon-glia interaction from Schwann-cell NDRG1 loss as the CMT4D (HMSN-Lom) mechanism.
  - reference: PMID:11157804
    reference_title: "A mutation in periaxin is responsible for CMT4F, an autosomal recessive form of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "L- and S-periaxin are proteins of myelinating Schwann cells and homozygous periaxin-null mice display extensive demyelination of myelinated fibers in the peripheral nervous system"
    explanation: Periaxin-null mice show extensive PNS demyelination, supporting periaxin's role in Schwann-cell myelin maintenance in CMT4F.
- name: Demyelination and Secondary Axonal Loss
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The shared terminal node of the autosomal-recessive CMT4 compartment. The
    diverse Schwann-cell and neuronal lesions (GDAP1 mitochondrial dysfunction,
    myotubularin phosphoinositide dysregulation, SH3TC2 trafficking defect,
    NDRG1 and periaxin loss) converge on demyelination — often with redundant
    myelin outfoldings or onion-bulb formation — and, over time, length-dependent
    secondary axonal degeneration. It is this secondary axonal loss, affecting
    the longest motor and sensory fibers first, that produces the progressive
    distal clinical deficit shared across all CMT compartments, typically with
    earlier onset and greater severity in the recessive forms.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: Sensory neuron of peripheral nervous system
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Myelination in the peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  downstream:
  - target: Distal Muscle Weakness
  - target: Distal Sensory Loss
  - target: Pes Cavus
  - target: Decreased Tendon Reflexes
  - target: Scoliosis
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive peripheral neuropathies are relatively rare but are clinically more severe than autosomal dominant forms of CMT"
    explanation: Supports the earlier-onset, more-severe clinical course that distinguishes the recessive CMT4 compartment from dominant CMT.

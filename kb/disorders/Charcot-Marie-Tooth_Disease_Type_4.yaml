- name: CMT4E
  display_name: CMT4E (EGR2-related; congenital hypomyelinating neuropathy)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 4E
    term:
      id: MONDO:0011527
      label: Charcot-Marie-Tooth disease type 4E
  genes:
  - preferred_term: EGR2
    term:
      id: hgnc:3239
      label: EGR2
  description: >-
    The transcription-factor subtype. EGR2 encodes a zinc-finger transcription
    factor whose stable expression is tied to the onset of peripheral
    myelination, and the recessive EGR2 disease presents as congenital
    hypomyelinating neuropathy. EGR2 is one of the CMT4 genes that also causes
    dominant disease: the report that found a recessive EGR2 mutation in
    congenital hypomyelinating neuropathy found two dominant missense mutations
    in the same study, one in a Charcot-Marie-Tooth type 1 family, so EGR2 spans
    the dominant and recessive demyelinating compartments rather than belonging
    to one.
  evidence:
  - reference: PMID:9537424
    reference_title: "Mutations in the early growth response 2 (EGR2) gene are associated with hereditary myelinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified one recessive and two dominant missense mutations in EGR2 (within regions encoding conserved functional domains) in patients with congenital hypomyelinating neuropathy (CHN) and a family with Charcot-Marie-Tooth type 1 (CMT1)"
    explanation: >-
      Establishes EGR2 as a hereditary myelinopathy gene with both a recessive
      allele - the CMT4E side - and dominant alleles, as this description states.
  - reference: PMID:20301641
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 4 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Detection of biallelic pathogenic variants in one of the following 11 genes establishes the diagnosis: GDAP1 (CMT4A), MTMR2 (CMT4B1), SBF2 (CMT4B2), SBF1 (CMT4B3), SH3TC2 (CMT4C), NDRG1 (CMT4D), EGR2 (CMT4E), PRX (CMT4F), HK1 (CMT4G), FGD4 (CMT4H), and FIG4 (CMT4J)."
    explanation: >-
      The GeneReviews CMT4 roster, which assigns EGR2 to CMT4E and confirms that
      biallelic EGR2 variants are diagnostic within this compartment.
- name: CMT4G
  display_name: CMT4G / HMSN-Russe (HK1-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 4G
    term:
      id: MONDO:0011534
      label: Charcot-Marie-Tooth disease type 4G
  genes:
  - preferred_term: HK1
    term:
      id: hgnc:4922
      label: HK1
  description: >-
    Hereditary motor and sensory neuropathy-Russe, a severe autosomal recessive
    neuropathy first identified in the Roma population and caused by a founder
    variant in an alternative untranslated exon of HK1. It is one of three
    autosomal recessive CMT subtypes with mutations private to that population,
    alongside CMT4C and CMT4D. Unlike every other subtype in this entry, the
    functional consequence of the CMT4G variant is unresolved: hexokinase
    activity and peripheral-nerve immunohistochemistry did not differ between
    patients and controls.
  evidence:
  - reference: PMID:19536174
    reference_title: "A mutation in an alternative untranslated exon of hexokinase 1 associated with hereditary motor and sensory neuropathy -- Russe (HMSNR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two sequence variants in complete linkage disequilibrium, a G>C in a novel alternative untranslated exon (AltT2) and a G>A in the adjacent intron, segregating with the disease in affected families and present in the heterozygote state in only 5/790 population controls."
    explanation: >-
      The genetic evidence locating the HMSNR variant in an alternative
      untranslated HK1 exon, with its frequency in population controls.
  - reference: PMID:19536174
    reference_title: "A mutation in an alternative untranslated exon of hexokinase 1 associated with hereditary motor and sensory neuropathy -- Russe (HMSNR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hexokinase activity measurement and immunohistochemistry of the peripheral nerve showed no difference between patients and controls. The mutational mechanism and functional effects remain unknown"
    explanation: >-
      Source for this description's statement that the functional consequence is
      unresolved, and the reason no upstream mechanism node is curated for HK1.
  - reference: PMID:23996628
    reference_title: "Founder mutations in NDRG1 and HK1 genes are common causes of inherited neuropathies among Roma/Gypsies in Slovakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are three subtypes of autosomal recessive CMT with mutations private to the Roma population: CMT4C, CMT4D and CMT4G."
    explanation: >-
      Source for the founder-population statement in this description, naming
      the three subtypes concerned.
- name: CMT4H
  display_name: CMT4H (FGD4 / frabin-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 4H
    term:
      id: MONDO:0012250
      label: Charcot-Marie-Tooth disease type 4H
  genes:
  - preferred_term: FGD4
    term:
      id: hgnc:19125
      label: FGD4
  description: >-
    Autosomal recessive demyelinating CMT caused by biallelic FGD4 mutations.
    FGD4 encodes frabin, a GDP/GTP nucleotide exchange factor specific to the
    Rho-family GTPase Cdc42, which places the CMT4H lesion in Schwann-cell actin
    cytoskeletal regulation rather than in myelin structure or membrane
    trafficking. It was the first Rho GEF implicated in CMT.
  evidence:
  - reference: PMID:17564959
    reference_title: "Mutations in FGD4 encoding the Rho GDP/GTP exchange factor FRABIN cause autosomal recessive Charcot-Marie-Tooth type 4H."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CMT4H subtype is an autosomal recessive demyelinating form of CMT that was recently mapped to a 15.8-Mb region at chromosome 12p11.21-q13.11, in two consanguineous families of Mediterranean origin, by homozygosity mapping. We report here the identification of mutations in FGD4, encoding FGD4 or FRABIN (FGD1-related F-actin binding protein), in both families."
    explanation: >-
      Establishes FGD4 as the CMT4H gene and characterizes the subtype as
      autosomal recessive and demyelinating.
  - reference: PMID:17564959
    reference_title: "Mutations in FGD4 encoding the Rho GDP/GTP exchange factor FRABIN cause autosomal recessive Charcot-Marie-Tooth type 4H."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first report of mutations in a Rho GEF protein being involved in CMT."
    explanation: >-
      Source for the statement that FGD4 was the first Rho GEF implicated in CMT.
- name: CMT4K
  display_name: CMT4K (SURF1-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 4K
    term:
      id: MONDO:0014733
      label: Charcot-Marie-Tooth disease type 4K
  genes:
  - preferred_term: SURF1
    term:
      id: hgnc:11474
      label: SURF1
  description: >-
    Demyelinating CMT4 caused by biallelic SURF1 variants: a cytochrome c
    oxidase assembly defect rather than a Schwann-cell myelin-maintenance defect.
    It is not among the eleven genes the GeneReviews CMT4 chapter lists, and its
    mechanism and course set it apart from the rest of the compartment - the
    differential_diagnoses entry below carries the distinguishing features.
    Gene-level curation lives in the dedicated entry Charcot-Marie-Tooth Disease
    Type 4K and is not duplicated here.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found SURF1 mutations in 5% of families (2/41) presenting with CMT4."
    explanation: >-
      Establishes SURF1 as a cause of CMT4 and quantifies its share of an
      otherwise unsolved CMT4 cohort.
pathophysiology:
- name: GDAP1 Mitochondrial Dynamics Defect
  description: >-
    Biallelic GDAP1 mutations (CMT4A) disrupt regulation of the mitochondrial
    network. GDAP1 promotes mitochondrial fission, and its loss impairs
    mitochondrial dynamics in Schwann cells and neurons, producing a neuropathy
    that can be axonal, demyelinating, or mixed and is frequently accompanied by
    vocal cord paresis.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: ABNORMAL
  genes:
  - preferred_term: GDAP1
    term:
      id: hgnc:15968
      label: GDAP1
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      GDAP1-driven mitochondrial dysfunction impairs Schwann-cell and axonal
      homeostasis, converging on demyelination with secondary axonal loss.
  evidence:
  - reference: PMID:11743580
    reference_title: "The gene encoding ganglioside-induced differentiation-associated protein 1 is mutated in axonal Charcot-Marie-Tooth type 4A disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish the molecular etiology of CMT4A (MIM 214400) and suggest that it may be associated with both axonal and demyelinating phenotypes."
    explanation: Establishes GDAP1 as the CMT4A gene with both axonal and demyelinating phenotypes.
- name: Myotubularin Phosphoinositide Dysregulation and Myelin Outfolding
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    Biallelic loss of the myotubularin-family phosphoinositide phosphatases MTMR2
    (CMT4B1) and SBF2 / MTMR13 (CMT4B2) dysregulates Schwann-cell membrane
    phosphoinositide turnover. The resulting membrane-trafficking defect produces
    the redundant, focally folded (outfolded) myelin that is the histological
    hallmark of CMT4B, and a demyelinating neuropathy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: ABNORMAL
  genes:
  - preferred_term: MTMR2
    term:
      id: hgnc:7450
      label: MTMR2
  - preferred_term: SBF2
    term:
      id: hgnc:2135
      label: SBF2
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-
      Dysregulated Schwann-cell phosphoinositide metabolism produces myelin
      outfoldings and demyelination with secondary axonal loss.
  evidence:
  - reference: PMID:10802647
    reference_title: "Charcot-Marie-Tooth type 4B is caused by mutations in the gene encoding myotubularin-related protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gene mutated in Charcot-Marie-Tooth disease type 4B (CMT4B), an autosomal recessive demyelinating neuropathy with myelin outfoldings, has been mapped on chromosome 11q22."
    explanation: Establishes CMT4B as an autosomal recessive demyelinating neuropathy with myelin outfoldings; MTMR2 (CMT4B1) is the causal phosphoinositide phosphatase.
  - reference: PMID:12687498
    reference_title: "Mutations in MTMR13, a new pseudophosphatase homologue of MTMR2 and Sbf1, in two families with an autosomal recessive demyelinating form of Charcot-Marie-Tooth disease associated with early-onset glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified two different nonsense mutations in the myotubularin-related 13 gene, MTMR13."
    explanation: Establishes SBF2 / MTMR13 loss as the CMT4B2 lesion in the same myotubularin outfolding mechanism.
- name: SH3TC2 Endosomal Recycling Defect in Schwann Cells
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    Biallelic SH3TC2 (KIAA1985) mutations (CMT4C) disrupt an endosomal-recycling
    function required for normal Schwann-cell myelination, producing a
    childhood-onset demyelinating neuropathy with a distinct Schwann-cell
    pathology and prominent early-onset scoliosis.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: ABNORMAL
  genes:
  - preferred_term: SH3TC2
    term:
      id: hgnc:29427
      label: SH3TC2
  downstream:
  - target: Demyelination and Secondary Axonal Loss
    description: >-

  notes: Identified by GEO DataSets index search for Leprosy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE269151
  title: Transcriptome immune-regulatory differences between leprosy patients and type 1 reaction patients, before onset of symptoms
  description: Leprosy is a chronic disease of the skin and peripheral nerves caused by Mycobacterium leprae. A major public health and clinical problem are leprosy reactions, which are inflammatory episodes that often contribute to nerve damage and disability. Type I reversal reactions (T1R) can occur after microbiological cure of leprosy and affect up to 50% of leprosy patients. Early intervention to prevent T1R and, hence, nerve damage, is a major focus of current leprosy control efforts. In this study, we compared transcript (i.e. isoform) expression and usage profiles from leprosy patients free of T1R at enrollment (who eventually developed T1R) against T1R-free leprosy patients.

name: Leprosy
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Leprosy is a chronic infectious disease caused by Mycobacterium leprae that
  primarily affects the skin and peripheral nervous system.
disease_term:
  term:
    id: MONDO:0005124
    label: leprosy
  preferred_term: Leprosy
parents:
- Bacterial Infection
- Neglected tropical disease
infectious_agent:
- name: Mycobacterium leprae
  infectious_agent_term:
    preferred_term: Mycobacterium leprae
    term:
      id: NCBITaxon:1769
      label: Mycobacterium leprae
  description: Acid-fast bacterium that causes leprosy.
  evidence:
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    snippet: "Leprosy is a chronic infectious disease caused by Mycobacterium (M.) leprae."
    explanation: The abstract identifies M. leprae as the causative agent.
transmission:
- name: Nasal droplet transmission
  description: Likely transmitted via nasal droplet infection.
  evidence:
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    snippet: "While the exact route of transmission remains unknown, nasal droplet infection is thought to be most likely."
    explanation: The abstract indicates nasal droplet infection as the most likely route.
review_notes: >-
  Deliberately lumped. The Ridley-Jopling forms of leprosy (TT, BT, BB, BL, LL)
  and the indeterminate form are kept as has_subtypes rows of this entry rather
  than promoted to separate entries. Lepromatous leprosy (MONDO:0005127) was
  assessed for promotion under the infectious-disease granularity ladder and
  did not clear two axes against its nearest sibling, borderline lepromatous
  leprosy. Its systemic involvement is described as a gradient "toward the
  lepromatous pole" rather than a discrete boundary; erythema nodosum leprosum
  is confined to BL and LL together, not to LL; and twelve-month multidrug
  therapy is the regimen for all multibacillary disease (BB, BL, LL and many
  BT patients), so it separates the multibacillary from the paucibacillary
  group rather than LL from BL. Patients also move along the spectrum
  (borderline disease upgrades or downgrades), and the agent, transmission,
  reservoir and drugs are shared. The pole-specific features (foamy
  macrophages, nasal and testicular infiltration, madarosis, leonine facies)
  are therefore recorded here as LL-scoped nodes and phenotypes. MONDO has no
  separate terms for BT, BB or BL, so those three rows are unbound children of
  the Borderline row, which carries MONDO:0005125. The WHO operational
  multibacillary and paucibacillary classes (MONDO:0041751, MONDO:0041752)
  cut across these rows by lesion count and smear result and are not modelled
  as subtypes here.
has_subtypes:
- name: Indeterminate
  display_name: Indeterminate leprosy (I)
  classification: clinical_spectrum
  subtype_term:
    preferred_term: indeterminate leprosy
    term:
      id: MONDO:0001391
      label: indeterminate leprosy
  description: >-
    The earliest clinical form, before the host response has placed the disease
    on the Ridley-Jopling spectrum: one or a few ill-defined hypopigmented
    patches with some sensory loss, no acid-fast bacilli on biopsy, and no
    reactions. About three quarters of lesions heal spontaneously; the rest
    become determinate forms. It is also recorded as the indeterminate phase in
    progression.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis is confirmed by biopsy in which there is peri- neurovascular infiltration. AFBs are absent."
    explanation: Distinguishes the indeterminate form by perineurovascular infiltration without acid-fast bacilli.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Seventy-five percent of the indeterminate lesions are healed by themselves, while the rest become determinate, which enter in the range as definite types"
    explanation: The indeterminate form usually self-heals or else enters the determinate spectrum, which is what sets it apart from the other rows.
- name: TT
  display_name: Tuberculoid leprosy (TT)
  classification: clinical_spectrum
  subtype_term:
    preferred_term: tuberculoid leprosy
    term:
      id: MONDO:0005126
      label: tuberculoid leprosy
  description: >-
    The stable high-resistance pole: up to three well-defined, dry, hairless,
    anesthetic plaques under 10 cm, typically with a single thickened nerve
    trunk near a lesion. Slit-skin smears show no acid-fast bacilli, the
    lepromin test is positive, and biopsy shows non-caseating epithelioid
    granulomas. Paucibacillary.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lesions are up to three in number, measuring <10 cm."
    explanation: Gives the lesion count and size that define the tuberculoid form.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Typically, a lone peripheral nerve trunk is thickened near the lesion. AFBs are absent on slit skin smears. The lepromin test is positive suggesting good immunity."
    explanation: Gives the single-nerve involvement, negative smear and positive lepromin test of the tuberculoid form.
- name: Borderline
  display_name: Borderline leprosy (BT, BB, BL)
  classification: clinical_spectrum
  children:
  - BT
  - BB
  - BL
  subtype_term:
    preferred_term: borderline leprosy
    term:
      id: MONDO:0005125
      label: borderline leprosy
  description: >-
    The immunologically unstable middle of the spectrum, comprising
    borderline tuberculoid, mid-borderline and borderline lepromatous disease.
    Patients can upgrade toward the tuberculoid pole or downgrade toward the
    lepromatous pole, and borderline disease carries most type 1 (reversal)
    reactions.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is a highly immunologically unstable form of disease in the leprosy spectrum"
    explanation: Describes borderline disease as the unstable part of the spectrum.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients can rapidly upgrade or downgrade toward either the TT form of the disease or the lepromatous pole."
    explanation: Borderline patients shift along the spectrum, which is the main reason the forms are kept as strata of one entry.
- name: BT
  display_name: Borderline tuberculoid leprosy (BT)
  classification: clinical_spectrum
  description: >-
    Lesions resemble tuberculoid plaques but are more numerous, larger and less
    well defined, often with satellite lesions, and nerves are asymmetrically
    thickened. MONDO has no separate term for this form; see the Borderline
    row.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lesions resemble TT; however, they are quite large in number, bigger, and not well-defined"
    explanation: Separates BT from TT by the number, size and definition of the lesions.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The nerves are asymmetrically thickened"
    explanation: Gives the asymmetric nerve involvement of BT.
- name: BB
  display_name: Mid-borderline leprosy (BB)
  classification: clinical_spectrum
  description: >-
    The most unstable form, with multiple asymmetric dimorphic lesions that
    share tuberculoid and lepromatous features, classically annular "Swiss
    cheese" plaques with a sloping outer and sharp inner margin. Acid-fast
    bacilli are present. MONDO has no separate term for this form; see the
    Borderline row.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dimorphic lesions are seen, which are characteristic of both TT and lepromatous types."
    explanation: Gives the dimorphic lesions that define mid-borderline disease.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The characteristic lesion is an annular plaque with a sloping outer margin and a well-defined inner margin presenting a characteristic Swiss cheese manifestation."
    explanation: Describes the characteristic BB plaque.
- name: BL
  display_name: Borderline lepromatous leprosy (BL)
  classification: clinical_spectrum
  description: >-
    Multiple, roughly symmetric macules that become infiltrated plaques and
    nodules, with thickened nerve trunks but less severe nerve injury than BT
    and strongly positive smears. BL patients can have both type 1 and type 2
    reactions; erythema nodosum leprosum is confined to BL and LL, though it is
    less frequent in BL (about 4% in field cohorts). MONDO has no separate term
    for this form; see the Borderline row.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with BL leprosy may show type 1 reactions or type 2 reactions. AFBs are strongly positive"
    explanation: BL is the one form subject to both reaction types, and is strongly smear positive.
  - reference: PMID:24098819
    reference_title: "A systematic review on the epidemiological data of erythema nodosum leprosum, a type 2 leprosy reaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For BL cases this varied from 2.7% ... to 5.1% ... on average 51/1231 (4,1%)."
    explanation: Pooled field-study frequency of ENL in BL, lower than in LL.
- name: LL
  display_name: Lepromatous leprosy (LL)
  classification: clinical_spectrum
  subtype_term:
    preferred_term: lepromatous leprosy
    term:
      id: MONDO:0005127
      label: lepromatous leprosy
  description: >-
    The stable low-resistance pole. Cell-mediated immunity is severely
    weakened, so bacilli multiply without restraint inside foamy dermal
    macrophages and smears are highly positive. Lesions are numerous and
    bilaterally symmetric over face, extremities and trunk, progressing from
    macules to diffuse infiltration and nodules with madarosis and leonine
    facies; the nasal mucosa and testes are infiltrated, and late disease shows
    glove-and-stocking anesthesia. LL carries the highest risk of erythema
    nodosum leprosum (about 15% in field cohorts) and is treated with
    twelve-month multibacillary multidrug therapy.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The cell-mediated immunity is harshly weakened leading to uncontrolled multiplication of bacilli. AFBs are highly positive. The lesions of LL are numerous with bilateral symmetry over the face, extremities, and trunk"
    explanation: Gives the immune state, bacillary load and lesion distribution that define LL.
  - reference: PMID:24098819
    reference_title: "A systematic review on the epidemiological data of erythema nodosum leprosum, a type 2 leprosy reaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In field-based studies 653/54,737 (1.2%) of all leprosy cases, 194/4,279 (4.5%) of MB cases, and 86/560 (15.4%) of LL cases develop ENL."
    explanation: Pooled field-study frequency of ENL is highest in LL.
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "While paucibacillary forms are treated with rifampicin and dapsone for at least six months, multibacillary leprosy is treated for at least twelve months, additionally requiring clofazimine."
    explanation: LL is multibacillary and so receives the twelve-month regimen, which it shares with the other multibacillary forms.
pathophysiology:
- name: Mycobacterial RNA Polymerase (Rifampicin Target)
  description: >-
    Mycobacterium leprae depends on DNA-dependent RNA polymerase for transcription.
    Rifampicin, the most potent bactericidal component of multidrug therapy, binds
    the RpoB beta subunit and blocks RNA elongation. Because a single rpoB mutation
    confers high-level resistance, rifampicin is always given with dapsone and
    clofazimine — the rationale for combination MDT.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)"
  biological_processes:
  - preferred_term: DNA-Templated Transcription
    term:
      id: GO:0006351
      label: DNA-templated transcription
  evidence:
  - reference: PMID:32342856
    reference_title: "Inhibition of RNA Polymerase by Rifampicin and Rifamycin-Like Molecules."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most clinically important and extensively studied class of antibiotics
      known to inhibit bacterial RNAP are the rifamycins.
    explanation: >-
      Establishes bacterial RNA polymerase as the rifampicin target, the step this
      node represents. Evidence source is OTHER as this is a review article.
- name: Mycobacterial Tetrahydrofolate Synthesis (Dapsone/DHPS Target)
  description: >-
    Dapsone, a sulfone, inhibits dihydropteroate synthase (DHPS) in the M. leprae
    de novo folate pathway, the same enzyme targeted by sulfonamides. Blocking THF
    synthesis is bacteriostatic and contributes the second arm of multidrug
    therapy alongside rifampicin.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_folate_synthesis_inhibition#Bacterial Tetrahydrofolate Synthesis (Antifolate Target)"
  biological_processes:
  - preferred_term: Tetrahydrofolate Biosynthetic Process
    term:
      id: GO:0046654
      label: tetrahydrofolate biosynthetic process
  evidence:
  - reference: PMID:27025730
    reference_title: "Utility of the Biosynthetic Folate Pathway for Targets in Antimicrobial Discovery."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An additional anti-folate target is dihyropteroate synthase (DHPS), which
      is unique to prokaryotes as they cannot acquire folate through dietary
      means.
    explanation: >-
      Supports DHPS (the dapsone/sulfonamide target) as the prokaryote-specific
      folate-synthesis enzyme this node represents. Evidence source is OTHER as
      this is a review article.
- name: Intracellular Residence in Macrophages and Schwann Cells (Cell-Penetrant Drug Requirement)
  description: >-
    M. leprae is an obligate intracellular pathogen that survives within
    macrophages and Schwann cells. Effective therapy requires agents that reach
    the intracellular organism; rifampicin and dapsone penetrate host cells,
    whereas cell-wall-active beta-lactams are not used — the lifestyle gating that
    constrains drug choice.
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_processes:
  - preferred_term: Biological Process Involved in Interaction with Host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Supports the intracellular-niche gating principle that constrains therapy to
      cell-penetrant agents. Evidence source is OTHER as this is a review article.
- name: Skin and peripheral nerve involvement
  description: The pathogen primarily affects skin and peripheral nerves.
  evidence:
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    snippet: "The pathogen primarily affects the skin and peripheral nervous system."
    explanation: The abstract states primary involvement of skin and peripheral nerves.
- name: Peripheral nerve affinity
  description: M. leprae shows affinity for peripheral nerves leading to neuropathy.
  evidence:
  - reference: PMID:11791665
    reference_title: "Mycobacterium leprae and leprosy: a compendium."
    supports: SUPPORT
    snippet: "The bacteria have affinity to the peripheral nerves and are likely to cause neuropathy."
    explanation: The abstract notes affinity for peripheral nerves and neuropathy.
- name: M. leprae Adhesion to Schwann Cells via Laminin-Dystroglycan
  description: >-
    M. leprae targets the peripheral nerve by binding the basal-lamina protein
    laminin-alpha2, which bridges the bacterium to the alpha/beta-dystroglycan
    complex on the Schwann cell surface. This receptor-mediated adhesion mediates
    neural invasion and Schwann cell injury, the molecular basis of the peripheral
    neuropathy that defines leprosy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Adhesion of symbiont to host cell
    term:
      id: GO:0044650
      label: adhesion of symbiont to host cell
  downstream:
  - target: Loss of sensation in skin lesions
    description: Involvement of the intradermal nerves within skin patches produces the sensory loss of leprosy lesions.
    evidence:
    - reference: PMID:37809252
      reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Nerve damage in leprosy can vary, where the intradermal nerves can be involved in skin patches or the peripheral nerve trunk can present a large lesion"
      explanation: Intradermal nerve involvement within skin patches is the nerve damage behind sensory loss in the lesions.
  - target: Glove-and-stocking sensory loss
    description: Toward the lepromatous pole the nerve damage takes a symmetric distal glove-and-stocking pattern.
    evidence:
    - reference: PMID:37809252
      reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Stocking and glove pattern of sensory damage is seen toward the lepromatous pole"
      explanation: The pattern of sensory nerve damage becomes glove-and-stocking toward the lepromatous pole.
  - target: Peripheral neuropathy
    description: Schwann cell invasion and injury lead to demyelination and the peripheral neuropathy characteristic of leprosy.
    evidence:
    - reference: PMID:11791665
      reference_title: "Mycobacterium leprae and leprosy: a compendium."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The bacteria have affinity to the peripheral nerves and are likely to cause neuropathy."
      explanation: The compendium states M. leprae affinity for peripheral nerves is likely to cause neuropathy, supporting the causal link from Schwann cell targeting to peripheral neuropathy.
  evidence:
  - reference: PMID:11791665
    reference_title: "Mycobacterium leprae and leprosy: a compendium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "M. leprae/laminin-alpha2 complexes bind to alpha/beta dystroglycan complexes expressed on the Schwann cell surface."
    explanation: The compendium describes M. leprae binding the Schwann cell surface through a laminin-alpha2 bridge to the alpha/beta-dystroglycan complex.
- name: Host T Cell Response Determines the Tuberculoid-Lepromatous Spectrum
  description: >-
    The clinical form of leprosy is set by the quality of the host T cell response.
    A Th1-polarized, strong cell-mediated response restricts the bacilli, producing
    the paucibacillary tuberculoid pole; a predominant Th2/humoral response fails to
    contain the organism, producing the multibacillary lepromatous pole, with
    unstable borderline forms in between.
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
  - preferred_term: Type 2 immune response
    term:
      id: GO:0042092
      label: type 2 immune response
  evidence:
  - reference: PMID:11791665
    reference_title: "Mycobacterium leprae and leprosy: a compendium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Th1-type immune response helps to kill the bacteria, but hosts are encroached upon when Th2-type response is predominant."
    explanation: The compendium attributes bacillary control to a Th1 response and failure of containment to a predominant Th2 response, the immunological axis of the leprosy spectrum.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At the TT pole, there is strong cell-mediated immunity, very few bacilli, and localized lesions"
    explanation: The review maps the tuberculoid pole to strong cell-mediated immunity with few bacilli and localized disease, the paucibacillary end of the spectrum.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At the other pole, that is, the lepromatous one, there is a lack of cell-mediated immunity, a strong humoral response, disseminated disease, and a large no of bacilli"
    explanation: The review maps the lepromatous pole to loss of cell-mediated immunity with a strong humoral response and disseminated, multibacillary disease.
  downstream:
  - target: Unrestricted Bacillary Multiplication in Foamy Macrophages
    description: >-
      At the lepromatous pole, failure of cell-mediated immunity lets the
      bacilli multiply without restraint.
    evidence:
    - reference: PMID:37809252
      reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The cell-mediated immunity is harshly weakened leading to uncontrolled multiplication of bacilli."
      explanation: States the causal step from weakened cell-mediated immunity to uncontrolled bacillary multiplication in LL.
- name: Unrestricted Bacillary Multiplication in Foamy Macrophages
  description: >-
    In lepromatous leprosy the bacilli multiply inside dermal macrophages that
    cannot kill them. The macrophages fill with bacilli, giving the foamy
    (Virchow, lepra) cells that are diffusely distributed through the dermis,
    and the bacteriological index on slit-skin smear is high. This bacillary
    load is what drives the diffuse tissue infiltration of the lepromatous
    pole and the immune-complex reactions of erythema nodosum leprosum.
  subtypes:
  - LL
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: foamy macrophage (Virchow cell)
    term:
      id: CL:0000891
      label: foam cell
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It shows foamy macrophages that are diffusely distributed in the dermis. Plasma cells and lymphocytes are seen scattered, and epithelioid cells are absent."
    explanation: Describes the foamy macrophage infiltrate of lepromatous leprosy.
  downstream:
  - target: Diffuse Dermal Infiltration of the Face
    description: Accumulating bacilli and macrophages infiltrate the skin diffusely, most markedly on the face and ear lobes.
    evidence:
    - reference: PMID:37809252
      reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Macules, if left untreated, may progress to develop induration which is more marked on the ear lobules and face"
      explanation: Untreated lepromatous macules become indurated by infiltration, most markedly on the face.
  - target: Nasal Mucosal Infiltration
    description: Bacillary infiltration extends to the nasal mucosa, which sheds bacilli.
    evidence:
    - reference: PMID:40065940
      reference_title: "A Case of Saddle Nose Deformity Secondary to Lepromatous Leprosy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Patients with Lepromatous Leprosy remain asymptomatic for years, and harbor bacteria in the nasal cavity, and these patients are responsible for the transmission of the disease in the community."
      explanation: Lepromatous patients carry the bacilli in the nasal cavity.
  - target: Testicular Infiltration
    description: Systemic dissemination toward the lepromatous pole reaches the testes.
    evidence:
    - reference: PMID:37809252
      reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Leprosy mainly involves the skin and nerves while systemic involvement is present toward the lepromatous pole."
      explanation: Systemic organ involvement, of which the testes are one site, is a feature of the lepromatous pole.

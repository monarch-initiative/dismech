datasets:
- accession: geo:GSE280021
  title: Dynamics of Th1/Th17 Responses and Antimicrobial Pathways in Leprosy Skin Lesions
  description: Reversal reactions (RR) in leprosy provide a unique opportunity to study the dynamics of the immune response against intracellular bacteria in humans. These episodes are often severe and difficult to treat, frequently progressing to permanent disabilities. We performed RNA sequencing on paired skin biopsy specimens from nine leprosy patients before and during RR, identifying a 64-gene antimicrobial response signature that correlated with the concomitant decrease in Mycobacterium leprae bacilli in RR patients. The upstream regulators of this signature included both innate (IL-1β, TNF) and adaptive (IFN-γ, IL-17) cytokines, indicating induction of both Th1 and Th17 responses.
  organism:

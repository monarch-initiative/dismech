histopathology:
- name: Diffuse dermal foamy macrophages with globi
  subtype: LL
  diagnostic: true
  description: >-
    Foamy macrophages diffusely distributed through the dermis, with scattered
    plasma cells and lymphocytes, no epithelioid cells, an atrophic epidermis
    separated by a clear Grenz zone, and acid-fast bacilli in parallel
    bundles, clusters or large globi.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It shows foamy macrophages that are diffusely distributed in the dermis. Plasma cells and lymphocytes are seen scattered, and epithelioid cells are absent."
    explanation: Describes the lepromatous dermal infiltrate.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "AFBs are arranged in parallel or in the form of clusters, or as large masses called globi."
    explanation: Describes the arrangement of acid-fast bacilli in lepromatous lesions.
- name: Non-caseating epithelioid granulomas without bacilli
  subtype: TT
  diagnostic: true
  description: >-
    Non-caseating granulomas of epithelioid cells, lymphocytes and Langhans
    giant cells in a periadnexal and perineural distribution in the superficial
    and deep dermis, with bacilli not detectable.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Granuloma is noncaseating, produced by epithelioid cells, lymphocytes, and Langhans cells."
    explanation: Describes the tuberculoid granuloma.
progression:
- phase: Incubation
  incubation_years: 2-7
  notes: >-
    Unusually long and variable latent period, from a few weeks to 20 years,
    averaging 2-7 years; paucibacillary disease tends to have the shorter
    incubation.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The latent period of the disease is variable and is unusually long. It can last from a few weeks to up to 20 years. However, the average incubation period of the disease is 2-7 years."
    explanation: Gives the range and average of the incubation period.
- phase: Indeterminate leprosy
  notes: >-
    The earliest clinical stage: one or a few ill-defined hypopigmented
    macules with subtle sensory loss and no acid-fast bacilli on biopsy.
    About three quarters heal spontaneously; the remainder become determinate
    and enter the Ridley-Jopling spectrum. Reactions do not occur at this
    stage.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first skin lesion to appear is usually a small- to medium-sized hypopigmented patch situated mostly on the thigh and face, having vague edges with some loss of sensation"
    explanation: Describes the indeterminate lesion.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Seventy-five percent of the indeterminate lesions are healed by themselves, while the rest become determinate, which enter in the range as definite types"
    explanation: Gives the two outcomes of the indeterminate stage.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prognosis of this type of leprosy is excellent. Reactions do not occur."
    explanation: Reactions are absent at the indeterminate stage.
- phase: Established disease across the Ridley-Jopling spectrum
  notes: >-
    Determinate disease is classified by host immunity along the
    Ridley-Jopling spectrum (TT, BT, BB, BL, LL), operationally grouped as
    paucibacillary tuberculoid and multibacillary lepromatous forms; the
    polar forms are stable while the borderline forms are unstable and prone
    to reactions. Untreated, progressive peripheral nerve damage leads to the
    deformities of advanced disease. The spectrum is a classification of
    established disease rather than a sequence of phases, so it is listed
    here as one phase.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Leprosy was classified by Ridley and Jopling based on histological and immunological features into five types: tuberculoid (TT), borderline tuberculoid (BT), mid borderline (BB), borderline lepromatous (BL), and lepromatous leprosy (LL)"
    explanation: Names the five Ridley-Jopling types of established disease.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The polar forms of leprosy are stable while the borderline forms have an increased propensity to develop reactions."
    explanation: Distinguishes stable polar from unstable borderline disease.
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinically, multibacillary lepromatous variants are distinguished from paucibacillary tuberculoid forms."
    explanation: Gives the operational paucibacillary versus multibacillary grouping.
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Advanced disease is characterized by disfiguring mutilations."
    explanation: Describes the end state of untreated established disease.
- phase: Type 1 (reversal) reaction
  notes: >-
    Acute immune-mediated episodes that punctuate the course before, during
    or after multidrug therapy. Type 1 reactions are delayed-type
    hypersensitivity responses with inflammation of existing skin lesions
    and acute neuritis, mainly in borderline disease, and are a major cause
    of nerve damage and disability.
  evidence:
  - reference: PMID:42157916
    reference_title: "Reactions in Leprosy: Updated Insights Into Pathophysiology, Clinical Spectrum, and Therapeutic Approaches-A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reaction can occur before, during, or after starting multidrug therapy and is a major cause of nerve damage, morbidity, and disability in affected individuals."
    explanation: Places reactions within the course relative to treatment.
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Delayed-type hypersensitivity reaction is represented by a reversal or type 1 reaction, which is predominantly seen in cases of borderline leprosy"
    explanation: Localises type 1 reactions to borderline disease.
- phase: Type 2 reaction (erythema nodosum leprosum)
  notes: >-
    Immune-complex-mediated systemic episodes with crops of tender
    subcutaneous nodules and systemic symptoms in multibacillary disease.
    ENL may be a single acute episode or run a chronic or recurrent course,
    and chronic ENL recovers less readily than acute ENL.
  evidence:
  - reference: PMID:37809252
    reference_title: "Leprosy Classification, Clinical Features, Epidemiology, and Host Immunological Responses: Failure of Eradication in 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "type 2 reaction is a type III hypersensitivity reaction with a sudden beginning of a severe inflammatory reaction because of the deposition of immune complexes"
    explanation: Defines the type 2 reaction as an immune-complex (type III) hypersensitivity episode.
  - reference: PMID:33035210
    reference_title: "Thalidomide in the treatment of erythema nodosum leprosum (ENL) in an outpatient setting: A five-year retrospective analysis from a leprosy referral centre in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with acute ENL were almost twice as likely to recover as those with chronic ENL."
    explanation: Distinguishes acute from chronic ENL courses by outcome.
- phase: Post-treatment (released from treatment)
  notes: >-
    After completing WHO multidrug therapy the patient is released from
    treatment, but the course is not over: reactions may still occur, and
    recurrence must be classified as early treatment failure, typically
    within 9 months of completing MDT, or true relapse, which occurs later.
    Leprosy lacks objective cure criteria, so this phase is defined by
    treatment completion rather than by microbiological cure. Early
    treatment frequently leaves no sequelae.
  evidence:
  - reference: DOI:10.1186/s12879-024-09937-2
    reference_title: Role of histopathological, serological and molecular findings for the early diagnosis of treatment failure in leprosy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms recurring within 9 months post-treatment completion is often indicative of TF rather than leprosy relapse, which commonly occurs later after MDT"
    explanation: Separates early treatment failure from later relapse after release from treatment.
  - reference: DOI:10.1186/s12879-024-09937-2
    reference_title: Role of histopathological, serological and molecular findings for the early diagnosis of treatment failure in leprosy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leprosy lacks clear-cut objective cure criteria, and the predictive value of post-MDT histopathological findings remains uncertain."
    explanation: Explains why the phase is defined by treatment completion.
  - reference: PMID:42157916
    reference_title: "Reactions in Leprosy: Updated Insights Into Pathophysiology, Clinical Spectrum, and Therapeutic Approaches-A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reaction can occur before, during, or after starting multidrug therapy and is a major cause of nerve damage, morbidity, and disability in affected individuals."
    explanation: Reactions continue to occur after treatment.
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early treatment frequently results in complete remission without sequelae."
    explanation: Gives the usual outcome after early treatment.
treatments:
- name: Multidrug therapy with rifampicin, dapsone, and clofazimine
  description: Multidrug therapy includes rifampicin, dapsone, and clofazimine for multibacillary disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: dapsone
      term:
        id: CHEBI:4325
        label: dapsone
    - preferred_term: clofazimine
      term:
        id: CHEBI:3749
        label: clofazimine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Mycobacterial RNA Polymerase (Rifampicin Target)
    description: >-
      Rifampicin binds the M. leprae RpoB subunit and blocks transcription — the
      bactericidal core of MDT.
  - target: Mycobacterial Tetrahydrofolate Synthesis (Dapsone/DHPS Target)
    description: >-
      Dapsone inhibits DHPS in the folate pathway, the second arm of MDT.
  - target: Intracellular Residence in Macrophages and Schwann Cells (Cell-Penetrant Drug Requirement)
    description: >-
      Rifampicin and dapsone penetrate host cells to reach intracellular M. leprae.
  evidence:
  - reference: PMID:28763601
    reference_title: "Leprosy - an overview of clinical features, diagnosis, and treatment."
    supports: SUPPORT
    snippet: "While paucibacillary forms are treated with rifampicin and dapsone for at least six months, multibacillary leprosy is treated for at least twelve months, additionally requiring clofazimine."
    explanation: The abstract describes multidrug therapy regimens.
- name: Corticosteroid therapy for Type 1 reaction
  description: Corticosteroids, particularly prednisone, are used to suppress the delayed-type hypersensitivity response in Type 1 (reversal) leprosy reactions, typically administered over 6 months or less.
  treatment_term:
    preferred_term: corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Type 1 Delayed-Type Hypersensitivity Response
    description: Corticosteroids suppress the cell-mediated immune response and delayed-type hypersensitivity that drives Type 1 reaction.
  evidence:
  - reference: PMID:30226355
    reference_title: "Corticosteroid therapy in borderline tuberculoid leprosy patients co-infected with HIV undergoing reversal reaction: a clinical study."
    supports: SUPPORT
    snippet: "Variables were analysed during and after multidrug therapy between the first and last days of prednisone, which occurred up to a maximum of 6 months after initiating corticosteroid therapy."
    explanation: The study documents prednisone use for treating reversal reactions in leprosy patients, with treatment durations up to 6 months.
- name: Thalidomide therapy for Type 2 reaction (ENL)
  description: Thalidomide is the most effective agent for treating Type 2 leprosy reactions (Erythema Nodosum Leprosum), either as monotherapy or in combination with corticosteroids. It acts as a TNF-alpha inhibitor and prevents recurrence of ENL.
  treatment_term:
    preferred_term: thalidomide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thalidomide
      term:
        id: CHEBI:9513
        label: thalidomide
  target_mechanisms:
  - target: Immune-Complex Formation in Type 2 Reaction
    description: Thalidomide inhibits TNF-alpha and modulates the immune-complex mediated response in ENL.
  evidence:
  - reference: PMID:12680478
    reference_title: "Thalidomide for erythema nodosum leprosum and other applications."
    supports: SUPPORT
    snippet: "Thalidomide, an inhibitor of tumor necrosis factor a, is the best known agent for short-term treatment of ENL skin manifestations, as well as postremission maintenance therapy to prevent recurrence. For this indication, it is effective as monotherapy and as part of combination therapy with corticosteroids."
    explanation: The review identifies thalidomide as the primary treatment for ENL, effective either alone or combined with corticosteroids, with proven ability to prevent recurrence.
  - reference: PMID:33035210
    reference_title: "Thalidomide in the treatment of erythema nodosum leprosum (ENL) in an outpatient setting: A five-year retrospective analysis from a leprosy referral centre in India."
    supports: SUPPORT
    snippet: "Management of ENL requires high doses of oral corticosteroids, which may not be universally effective and pose serious adverse effects. Thalidomide has proven to be a steroid-sparing agent and is useful in controlling the reactions."
    explanation: The study confirms thalidomide's role as a steroid-sparing alternative in ENL management, allowing reduction of corticosteroid doses while controlling reactions.
- name: Thalidomide and multidrug therapy for Lucio phenomenon
  description: Thalidomide combined with multidrug therapy is used to manage Lucio phenomenon, the most severe leprosy reaction characterized by necrotizing vascular lesions. Aggressive antimicrobial therapy and thalidomide provide better control of type 3 reactions.
  treatment_term:
    preferred_term: combination thalidomide and multidrug therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thalidomide
      term:
        id: CHEBI:9513
        label: thalidomide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: clofazimine
      term:
        id: CHEBI:3749
        label: clofazimine
  target_mechanisms:
  - target: Endothelial Cell Injury in Lucio Phenomenon
    description: Thalidomide combined with multidrug therapy suppresses endothelial cell injury and the vascular pathology of Lucio phenomenon.
  evidence:
  - reference: PMID:25432812
    reference_title: "Lucio's leprosy: a clinical and therapeutic challenge."
    supports: SUPPORT
    snippet: "Fortunately, reaction episodes have decreased with the use of multidrug therapy, and better control of the type 2 reactions has been managed with the use of thalidomide, as in Lucio's phenomenon."
    explanation: The review indicates that multidrug therapy combined with thalidomide improves control of Lucio phenomenon, the most severe form of leprosy reaction.
- name: BCG and Mycobacterium indicus pranii Immunoprophylaxis
  description: >-
    Immunoprophylaxis with Bacillus Calmette-Guerin (BCG), Mycobacterium
    indicus pranii (MiP), or subunit candidates such as LepVax primes Th1
    cell-mediated immunity against Mycobacterium leprae, reducing susceptibility
    to intracellular infection of macrophages and Schwann cells and enhancing
    protective efficacy when combined with single-dose rifampicin post-exposure
    prophylaxis.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Intracellular Residence in Macrophages and Schwann Cells (Cell-Penetrant Drug Requirement)
    treatment_effect: INHIBITS
    description: >-
      Vaccination with BCG, MiP, or LepVax primes antimycobacterial cell-mediated
      immunity that restricts intracellular Mycobacterium leprae establishment
      and replication in host macrophages and Schwann cells.
    evidence:
    - reference: DOI:10.3389/fimmu.2024.1298749
      reference_title: "Leprosy: treatment, prevention, immune response and gene function"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Schuring et al. demonstrated an 80% protective effect of SDR when the
        exposed person had received the BCG vaccine as part of a childhood
        vaccination program, compared to 58% without BCG vaccination ( 43).
      explanation: >-
        Demonstrates that BCG vaccination confers protective immunity against
        clinical leprosy in exposed contacts, reaching 80% protection when
        combined with single-dose rifampicin.
  evidence:
  - reference: DOI:10.3389/fimmu.2024.1298749
    reference_title: "Leprosy: treatment, prevention, immune response and gene function"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Immunoprophylaxis was mainly carried out through vaccination with the BCG but also included vaccines such as LepVax and MiP."
    explanation: >-
      Documents the use of BCG, LepVax, and Mycobacterium indicus pranii (MiP)
      vaccines for leprosy immunoprophylaxis.
  - reference: DOI:10.3389/fimmu.2024.1298749
    reference_title: "Leprosy: treatment, prevention, immune response and gene function"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Schuring et al. demonstrated an 80% protective effect of SDR when the
      exposed person had received the BCG vaccine as part of a childhood
      vaccination program, compared to 58% without BCG vaccination ( 43).
    explanation: >-
      Quantifies the additive protective effect of childhood BCG vaccination in
      preventing leprosy among exposed contacts.

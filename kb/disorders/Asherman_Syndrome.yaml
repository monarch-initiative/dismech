    snippet: >-
      in an IUA-like mouse model, the autophagy in endometrium was defective
      accompanied by EEC-EMT, and CQ could inhibit autophagy and aggravate
      endometrial fibrosis, whereas rapamycin or T3 treatment could improve the
      autophagic levels and blunt endometrial fibrosis
    explanation: >-
      In vivo corroboration in mouse, kept separate from the in vitro item so the
      evidence tiers are not blended.
  downstream:

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pregnancy rate in women with severe adhesion was significantly lower
      than that in women with mild adhesion (P = 0.021).
    explanation: >-
      Supports a dose-response between adhesion burden and reproductive failure.
      PARTIAL because it is measured after adhesiolysis, so it bounds the
      residual deficit rather than the untreated state.
- name: Menstrual Outflow Obstruction
  biological_scale: ORGANISM
  description: >-
    Where adhesions obstruct the cavity or cervical canal, menstrual effluent
    cannot escape. Most affected women have hypomenorrhea or amenorrhea, but up
    to a quarter menstruate painlessly and normally, so preserved menses does
    not exclude the diagnosis. In amenorrhoeic women the trapped effluent
    produces cyclic pelvic pain, and the accompanying retrograde menstruation is
    a recognized route to endometriosis — a second disease generated by the
    first.
  locations:
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  evidence:
  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most women with IUA have amenorrhea or hypomenorrhea, but up to a fourth
      have painless menses of normal flow and duration. Those who have
      amenorrhea may also have cyclic pelvic pain caused by outflow obstruction.
      The accompanying retrograde menstruation may lead to endometriosis.
    explanation: >-
      Single source for the whole node: the menstrual spectrum, the
      quarter-with-normal-menses caveat, the outflow-obstruction pain mechanism,
      and the retrograde-menstruation route to endometriosis.
phenotypes:
- category: Clinical
  name: Intrauterine adhesions
  description: >-
    The defining structural finding: fibrous bands bridging the walls of the
    uterine cavity, diagnosed and graded at hysteroscopy.
  phenotype_term:
    preferred_term: Uterine synechiae
    term:
      id: HP:0030712
      label: Uterine synechiae
  frequency: OBLIGATE
  evidence:
  - reference: PMID:37735465
    reference_title: "Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asherman's Syndrome is characterized by intrauterine adhesions or
      scarring, which cause infertility, menstrual abnormalities, and recurrent
      pregnancy loss.
    explanation: >-
      Adhesions are the definitional feature of the syndrome, which is what
      OBLIGATE asserts here.
- category: Clinical
  name: Hypomenorrhea
  description: >-
    Reduced menstrual flow, the commonest presenting menstrual abnormality. HPO
    has no hypomenorrhea term, so the phenotype is bound to the parent

- name: Intrauterine Adhesion Formation and Cavity Obliteration
  biological_scale: TISSUE
  description: >-
    The defining pathological structure. Because the uterine cavity is a
    potential space whose walls lie in apposition, fibrotic repair of opposing
    denuded surfaces produces bands of scar that bridge them. The result is
    partial or complete obliteration of the uterine cavity and, when the injury
    extends to the lower segment, of the cervical canal. Severity grading in the
    hysteroscopic classification systems tracks the extent and location of these
    bridges, and severity predicts reproductive prognosis.
  conforms_to: fibrotic_response#Architectural Distortion and Organ Dysfunction

prevalence:
- population: Women evaluated by hysteroscopy within 12 months of a miscarriage
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 19100.0
  rate_low: 12800.0
  rate_high: 27500.0
  notes: >-
    Pooled prevalence of intrauterine adhesions detected at hysteroscopy in 912
    women from 10 prospective studies, 19.1% (95% CI 12.8-27.5%). This is the
    prevalence of the lesion after a defined insult, not the population
    prevalence of symptomatic Asherman syndrome; the same review notes that more
    than half the adhesions found were mild and of unknown clinical relevance.
  evidence:
  - reference: PMID:24082042
    reference_title: "Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IUAs were detected in 183 women, resulting in a pooled prevalence of 19.1%
      [95% confidence interval (CI): 12.8-27.5%].
    explanation: >-
      The pooled point estimate and interval recorded in this record.
  - reference: PMID:24082042
    reference_title: "Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In more than half of these, the severity and extent of the adhesions was
      mild, with unknown clinical relevance.
    explanation: >-
      Deliberate limit on the number above: the pooled figure counts
      hysteroscopic lesions, most of them mild, and must not be read as the
      prevalence of symptomatic Asherman syndrome.
epidemiology:
- name: Number of curettage procedures as the principal risk gradient
  description: >-
    Risk of intrauterine adhesions rises with the number of miscarriages, and
    the meta-analysis identifies the number of dilatation and curettage
    procedures as the driver behind that association rather than the
    miscarriages themselves. This is the actionable epidemiology of the disease:
    it argues for minimizing instrumental evacuation, and it is the basis of the
    case for medical or expectant management of early pregnancy loss where
    feasible.
  evidence:
  - reference: PMID:24082042
    reference_title: "Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relative to women with one miscarriage, women with two or three or more
      miscarriages showed an increased risk of IUAs by a pooled OR of 1.41 and
      2.1, respectively. The number of dilatation and curettage (D&C) procedures
      seemed to be the main driver behind these associations.
    explanation: >-
      Quantifies the dose-response and attributes it to the D&C count rather
      than to miscarriage per se.
- name: Genital tuberculosis as an etiology in endemic settings
  description: >-
    In tuberculosis-endemic regions genital tuberculosis is a non-iatrogenic
    route to Asherman syndrome and to uterine-factor infertility. It matters
    clinically because the treatment differs — the adhesions are the end product
    of an active infection, and antituberculous therapy is the disease-directed
    intervention.
  evidence:
  - reference: PMID:31388435
    reference_title: "Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of genital tuberculosis causing Asherman's syndrome and
      resultant infertility.
    explanation: >-
      A single case report, which is the level of evidence this entry claims for
      the tuberculous etiology.
  - reference: PMID:31388435
    reference_title: "Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is a leading cause of infertility in endemic countries. The global
      incidence of tuberculosis (TB) is growing at approximately 0.4% per year
    explanation: >-
      Supports the endemic-setting framing at the level of tuberculous
      infertility generally, not of Asherman syndrome specifically — hence
      PARTIAL.
diagnosis:
- name: Hysteroscopy
  description: >-
    Hysteroscopy is the gold standard for diagnosis and simultaneously the route
    to treatment; it also provides the severity and localization grading on
    which prognosis and surgical planning depend. Less invasive contrast
    sonohysterography or hysterosalpingography is used for initial evaluation,
    and MRI is required when the cavity is totally obliterated.
  diagnosis_term:
    preferred_term: hysteroscopy
    term:
      id: NCIT:C148437
      label: Hysteroscopy
  evidence:
  - reference: PMID:39613882
    reference_title: Mechanistic insights into intrauterine adhesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hysteroscopy is the gold standard for diagnosis of IUA.
    explanation: >-
      Establishes hysteroscopy as the diagnostic standard.
  - reference: PMID:30936754
    reference_title: "Asherman's syndrome: current perspectives on diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For initial diagnosis the less invasive contrast sonohysterography or
      hysterosalpingography is useful. The final diagnosis is based on
      hysteroscopy. Magnetic resonance imaging is required in cases with totally
      obliterated uterine cavity.
    explanation: >-
      Supports the staged imaging pathway described here.
treatments:
- name: Hysteroscopic adhesiolysis
  description: >-
    Division of intrauterine adhesions under hysteroscopic vision, working from
    the centre of the cavity toward the periphery, is the definitive treatment
    and the gold standard of care. Miniature scissors are favoured over energy
    devices, on the reasoning that cold division avoids adding thermal injury to
    a tissue whose disease is caused by injury in the first place.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: hysteroscopy
    term:
      id: NCIT:C148437
      label: Hysteroscopy
  target_mechanisms:
  - target: Intrauterine Adhesion Formation and Cavity Obliteration
    treatment_effect: INHIBITS
    description: >-
      Mechanically divides the fibrous bridges, restoring the cavity. It removes
      the structure, not the tendency to form it, which is why adjuncts to
      prevent reformation are needed.
  evidence:
  - reference: PMID:28582327
    reference_title: "A comprehensive review of Asherman's syndrome: causes, symptoms and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical management with hysteroscopic lysis of adhesions is the gold
      standard for treatment and adopting an office-based approach offers
      several advantages.
    explanation: >-
      Establishes hysteroscopic adhesiolysis as the standard of care.
  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most efficacious appears to be the use of miniature scissors for
      adhesiolysis and the placement of a balloon stent inside the uterus
      immediately after surgery.
    explanation: >-
      Supports the choice of cold scissors over energy devices described here,
      and pairs it with the balloon stent curated as a separate treatment.
- name: Postoperative estrogen therapy
  description: >-
    Estrogen is given after adhesiolysis to stimulate regrowth of endometrium
    over the denuded cavity. It is the one treatment in the standard regimen
    that acts on the regenerative failure rather than on the scar, and it is
    conditional on residual basalis surviving somewhere in the cavity.

    Its clinical benefit is contested. A randomised trial withholding estrogen
    after successful adhesiolysis found no reduction in adhesion recurrence and
    no better reproductive outcome, so the entry curates the practice and its
    stated mechanism alongside the trial that fails to confirm any advantage
    from it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: estrogen therapy
    term:
      id: NCIT:C15483
      label: Estrogen Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
  target_mechanisms:
  - target: Endometrial Epithelial Loss and Differentiation Signalling Failure
    treatment_effect: INHIBITS
    description: >-
      Pharmacological estrogen drives proliferation of any surviving endometrium
      across the raw surface, opposing the epithelial-loss arm of the disease.
  evidence:
  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postoperative estrogen therapy is prescribed to stimulate endometrial
      regrowth.
    explanation: >-
      States both the intervention and the mechanism claimed for it.
  - reference: PMID:37396823
    reference_title: >-
      Hormonal support in women with Asherman syndrome does not lead to better
      outcomes: A randomized trial.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women who did not receive estrogen did not have more recurrences of
      adhesions in the first year prior to pregnancy (66.1% in the usual care
      group, 52.7% in the no-estrogen group, p = 0.15).
    explanation: >-
      A single-blind randomised trial of 114 women contradicts the clinical
      benefit claimed for the standard regimen: withholding estrogen after
      successful adhesiolysis did not increase adhesion recurrence, and
      pregnancy and live-birth rates at 3 years likewise did not differ. REFUTE
      is scoped to the outcome claim; the trial does not test whether estrogen
      drives proliferation of residual endometrium, so the mechanism curated in
      `target_mechanisms` is limited by this result rather than overturned
      by it.
- name: Intrauterine barrier device after adhesiolysis
  description: >-
    A balloon catheter or intrauterine contraceptive device placed after
    adhesiolysis holds the walls of the cavity apart during healing. The
    mechanistic logic is specific to this disease: adhesions form because
    opposing denuded surfaces heal in contact, so keeping them separated during
    the vulnerable window addresses the geometry rather than the fibrosis. No
    single method has shown superiority for preventing recurrence, which the
    entry records rather than smoothing over.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: intrauterine barrier placement after adhesiolysis
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    The generic `NCIT:C49236` binding is deliberate. NCIT has no
    clinical-intervention term for intrauterine barrier or device placement:
    searching the `Intrauterine`, `Device Insertion`, `Device Placement`,
    `Barrier` and `Contraceptive Device` label families returns only device
    entities (`NCIT:C42771` Intrauterine Device, `NCIT:C49838` Barrier Device,
    `NCIT:C42734` Contraceptive Device), dosage forms and routes of
    administration — none of them reachable from `NCIT:C25218` and so none of
    them valid for `treatment_term`. Rather than bind a device continuant where
    an action term is required, the action stays generic and
    `therapeutic_modality: DEVICE` carries the real signal.
  target_mechanisms:
  - target: Intrauterine Adhesion Formation and Cavity Obliteration
    treatment_effect: INHIBITS
    description: >-
      Physically separates the opposing raw surfaces so that fibrotic repair
      cannot bridge them.
  evidence:
  - reference: PMID:30936754
    reference_title: "Asherman's syndrome: current perspectives on diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use of intrauterine devices like balloon catheters or intrauterine
      contraceptive devices seems to be the preferred methods for the prevention
      of re-occurrence of adhesions after treatment.
    explanation: >-
      Supports barrier placement as the preferred adjunct, with the hedged
      wording ("seems to be") preserved.
  - reference: PMID:28582327
    reference_title: "A comprehensive review of Asherman's syndrome: causes, symptoms and treatment options."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevention of reformation of adhesions remains challenging and no single
      method for preventing recurrence has shown superiority.
    explanation: >-
      Retained as an explicit limit: the barrier approach is preferred by
      practice rather than by demonstrated superiority.
- name: Endometrial stem/progenitor cell therapy
  description: >-
    Investigational. Cell-based approaches aim to repopulate the regenerative
    compartment the disease destroys — the only strategy on this list that
    addresses the primary lesion rather than its consequences. It is curated
    here because it is the mechanistically matched intervention, not because it
    is established therapy; the evidence base remains preclinical and early
    clinical.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: stem cell therapy
    term:
      id: NCIT:C165194
      label: Stem Cell Therapy
  target_mechanisms:
  - target: Endometrial Epithelial Loss and Differentiation Signalling Failure
    treatment_effect: INHIBITS
    description: >-
      Restores a regenerative cell population capable of rebuilding endometrium,
      opposing the epithelial-loss arm.
  evidence:
  - reference: PMID:28582327
    reference_title: "A comprehensive review of Asherman's syndrome: causes, symptoms and treatment options."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cell-based therapies using endometrial stem/progenitor cells hold promise
      for future use in regenerating inadequate endometrium.
    explanation: >-
      Records the approach at the strength the source claims for it — promise
      for future use, not present efficacy — hence PARTIAL.
  - reference: PMID:30760192
    reference_title: "Endometrial Regeneration in Asherman's Syndrome: Clinical and Translational evidence of Stem Cell Therapies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Numerous studies have begun exploring the molecular mechanisms behind the
      fibrotic process underlying Asherman's Syndrome as well as the role of
      stem cells in the regeneration of the endometrium as a treatment modality.
    explanation: >-
      Records the existence and stage of the stem-cell approach as a treatment
      modality under investigation; the same review highlights current gaps in
      research, so nothing stronger is claimed.
- name: Antituberculous therapy for genital tuberculosis
  description: >-
    Where genital tuberculosis is the cause, antituberculous chemotherapy is the
    disease-directed treatment. It is included because it is the one etiology on
    this entry with an active, treatable upstream driver rather than a completed
    historical injury — and, unusually, menstrual function may partially return
    with treatment alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antitubercular agent
      term:
        id: NCIT:C280
        label: Antitubercular Agent
  notes: >-
    `therapeutic_agent` is bound to the NCIT drug *class* rather than to the
    individual CHEBI first-line agents. Neither the cited case report nor the
    entry's other sources names a regimen — PMID:31388435 records only "9 months
    of antituberculous therapy" — so enumerating rifampicin/isoniazid/
    pyrazinamide/ethambutol would assert a composition the evidence does not
    state. CLAUDE.md permits an NCIT class term for exactly this case.
  target_mechanisms:
  - target: Endometrial Basal Layer Injury
    treatment_effect: INHIBITS
    description: >-
      Eradicating the mycobacterial infection removes the ongoing source of
      endometrial injury.
  evidence:
  - reference: PMID:31388435
    reference_title: "Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was treated with 9 months of antituberculous therapy. While
      she has not yet succeeded in becoming pregnant, the patient has started to
      notice cyclic spotting, indicating possible return of menses.
    explanation: >-
      A single case with a partial menstrual response and no pregnancy — PARTIAL
      is the honest classification, and the snippet preserves the negative
      fertility outcome alongside the positive menstrual one.
progression:
- phase: Reproductive outcome after hysteroscopic adhesiolysis
  notes: >-
    Pooled across 54 studies and 4,640 women, roughly half conceive after
    adhesiolysis, but the pregnancies that follow are high-risk in a way that is
    mechanistically continuous with the disease: placenta accreta syndrome in
    about one in ten (10.1%) reflects implantation onto a scarred,
    basalis-deficient decidua, the same lesion that caused the infertility. The
    losses are also distributed across gestation rather than concentrated
    early — early pregnancy loss 17.7% and mid-trimester loss 11.5% — with
    cervical incompetence reported at 12.5% in the two studies that measured it.
    Ectopic pregnancy at 4.2% is the smallest of these. Antenatal surveillance
    for abnormal placentation is therefore part of the disease course, not an
    incidental precaution.
  evidence:
  - reference: PMID:30713131
    reference_title: "Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled rate of pregnancy was 50.7%
    explanation: >-
      The pooled conception rate after adhesiolysis across 53 studies. Quoted as
      a short fragment because the confidence interval that follows it in the
      source is parenthesised as "(95% CI [confidence interval]: 49.1 to 52.3)",
      and the bracketed gloss is stripped from snippets before matching, so the
      longer quote cannot be verified verbatim.
  - reference: PMID:30713131
    reference_title: "Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      early pregnancy loss was 17.7% (95% CI: 15.9 to 19.6) in 31 studies,
      ectopic pregnancy (EP) was 4.2% (95% CI: 2.8 to 6.3) in 9 studies,
      mid-trimester loss (MTL) was 11.5% (95% CI: 7.6 to 17.8) in 7 studies,
      cervical incompetence was 12.5% (95% CI: 3.3 to 33.5) in 2 studies and
      placenta accreta syndrome was 10.1% (95% CI: 8.6 to 11.8) in 23 studies
    explanation: >-
      The five adverse-outcome rates quoted in this record, including the
      placenta accreta figure that motivates the antenatal-surveillance point.
  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Follow-up studies to assure resolution of the scarring are mandatory
      before the patient attempts to conceive as is careful monitoring of
      pregnancies for cervical incompetence, placenta accreta, and intrauterine
      growth retardation.
    explanation: >-
      Supports the surveillance recommendation and names the same three
      pregnancy complications.
differential_diagnoses:
- name: Adenomyosis
  description: >-
    Also presents with abnormal menstruation, pelvic pain and impaired
    fertility, but the lesion is endometrial tissue within the myometrium rather
    than scar within the cavity, and the cavity itself is patent at
    hysteroscopy.
  distinguishing_features:
  - Uterine cavity patent at hysteroscopy, with no bridging fibrous bands
  - Junctional-zone thickening on MRI rather than cavity obliteration
- name: Endometriosis
  description: >-
    Shares cyclic pelvic pain and infertility. The direction of the relationship
    matters here: Asherman syndrome can cause endometriosis through obstructed
    retrograde menstruation, so the two may coexist as sequela rather than as
    alternatives.
  distinguishing_features:
  - Ectopic endometrial implants outside the uterus rather than intracavitary scar
- name: Hypothalamic or ovarian causes of secondary amenorrhea
  description: >-
    Amenorrhea from an outflow-tract lesion is distinguished from endocrine
    amenorrhea by a normal hormonal profile with absent withdrawal bleeding, and
    definitively by hysteroscopy.
  distinguishing_features:
  - Absent withdrawal bleeding despite adequate estrogen-progestin challenge
  - Normal gonadotropin and estradiol profile
discussions:
- discussion_id: mismatch_endmt_rat_model_only
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does endothelial-to-mesenchymal transition contribute to the myofibroblast
    pool in human Asherman syndrome, or is it a feature of the rat
    mechanical-injury model?
  rationale: >-
    The EndMT arm rests entirely on a rat intrauterine adhesion model, where
    CD31/alpha-SMA double-positive cells appear in endometrium 14 days after
    injury. No human tissue confirmation was found in this curation pass. The
    mismatch is mechanistically meaningful rather than cosmetic: the human
    single-cell atlas of Asherman endometrium characterizes the disease niche in
    detail and emphasizes epithelial loss, so if EndMT were a major human
    myofibroblast source it might be expected to have surfaced there. Rodent IUA
    models are also made by acute mechanical or dual injury, which may recruit
    vascular remodelling responses that the slower human iatrogenic lesion does
    not.
  attaches_to:
  - pathophysiology#Myofibroblast Generation and Mesenchymal Activation
  proposed_experiments:
  - experiment_id: exp_ias_human_myofibroblast_origin
    name: Lineage-resolved myofibroblast origin in human Asherman endometrium
    description: >-
      Re-analyse or extend human Asherman single-cell/single-nucleus datasets
      for endothelial-mesenchymal intermediate states, and confirm with dual
      CD31/alpha-SMA immunofluorescence on Asherman hysteroscopic biopsies
      against matched controls, to quantify what fraction of the myofibroblast
      pool is endothelium-derived in human disease.
- discussion_id: gap_regeneration_versus_scarring_switch
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the endometrium regenerate without scarring after menstruation and
    parturition, yet scar after curettage of the recently pregnant uterus?
  rationale: >-
    This is the central unanswered question of the disease and the reason the
    entry is modelled as a switch between repair programmes. The endometrium is
    an exemplar of scarless mammalian regeneration, including after the
    substantial tissue loss of childbirth, yet a comparatively minor iatrogenic
    insult in the same postpartum window produces permanent scar. Neither the
    depth of injury nor the pregnant state alone accounts for it, and
    identifying the determinant would be informative well beyond gynaecology —
    it is the question the regeneration literature explicitly poses of this
    tissue.
  attaches_to:
  - pathophysiology#Non-Regenerative Fibrotic Repair and Excessive ECM Deposition
  evidence:
  - reference: PMID:37843929
    reference_title: Mechanisms of Regeneration and Fibrosis in the Endometrium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the endometrium provides an exceptional platform to answer a central
      question of regenerative medicine: Why do some systems regenerate while
      others scar?
    explanation: >-
      The review poses this gap as an open question in exactly the terms used
      here, which is why it is recorded as a KNOWLEDGE_GAP rather than curated
      as a mechanism.
  proposed_experiments:
  - experiment_id: exp_ias_paired_injury_response_profiling
    name: Paired injury-response profiling across regenerative and scarring insults
    description: >-
      Profile the endometrial repair response after physiological shedding,
      postpartum involution, and instrumental evacuation in the same species and
      pregnancy state, to identify the divergence point at which the fibrotic
      programme is selected over the regenerative one.
- discussion_id: gap_prognosis_and_recurrence_prevention
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can reproductive prognosis after adhesiolysis be predicted, and can
    recurrence be prevented?
  rationale: >-
    Two related failures of the current standard of care. There is no
    established method for predicting the likelihood of a live birth after
    treatment, and no adjunct has been shown superior for preventing adhesion
    reformation — which is the principal clinical problem, since recurrence
    rather than initial division is what limits outcomes. Both are recorded here
    because the treatment block would otherwise read as more settled than it is.
  attaches_to:
  - pathophysiology#Intrauterine Adhesion Formation and Cavity Obliteration
  evidence:
  - reference: PMID:39613882
    reference_title: Mechanistic insights into intrauterine adhesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical treatments have shown limited success, particularly in severe
      cases.
    explanation: >-
      The review's own assessment of current treatment. Its adjacent sentence on
      the prognostic gap is quoted here only in the rationale, because as
      published it reads "remains established" where the sense requires
      "unestablished", and an evidence snippet should not carry a claim whose
      literal wording contradicts it.
  - reference: PMID:28582327
    reference_title: "A comprehensive review of Asherman's syndrome: causes, symptoms and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevention of reformation of adhesions remains challenging and no single
      method for preventing recurrence has shown superiority.
    explanation: >-
      Independent statement of the recurrence-prevention half of this gap.
  proposed_experiments:
  - experiment_id: exp_ias_live_birth_prognostic_model
    name: Prospective prognostic model for live birth after adhesiolysis
    description: >-
      Assemble a prospective multicentre cohort with standardized severity
      grading, residual endometrial thickness and second-look hysteroscopy, and
      derive and externally validate a live-birth prediction model.
  - experiment_id: exp_ias_anti_adhesion_adjunct_rct
    name: Head-to-head randomized comparison of anti-adhesion adjuncts
    description: >-
      Randomize balloon stent, intrauterine device, hyaluronic acid gel and no
      adjunct after adhesiolysis, with second-look hysteroscopy as the primary
      endpoint and live birth as a secondary endpoint.
- discussion_id: gap_postoperative_estrogen_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does postoperative estrogen actually improve outcomes after adhesiolysis,
    and if the mechanism is real, why does the trial not detect a benefit?
  rationale: >-
    Postoperative estrogen is the one element of the standard regimen aimed at
    the regenerative failure rather than at the scar, and it is given on an
    explicit mechanistic rationale — drive proliferation of surviving
    endometrium across the denuded cavity. A randomised trial that simply
    withheld it found no increase in adhesion recurrence and no reduction in
    pregnancy or live-birth rates, while noting side effects. That is a gap
    rather than a settled negative: at least three readings remain open and the
    trial does not separate them. The regenerative substrate may be absent in
    the patients who most need it, so a proliferative drug has nothing to act
    on; the endogenous cycling estrogen of an ovulatory cohort may already
    saturate the receptor, leaving exogenous estrogen no margin; or epithelial
    proliferation may simply not be rate-limiting for the outcomes measured,
    which are dominated by recurrence of fibrosis. Recording it keeps the entry
    from presenting a contested adjunct as established care, and keeps the
    mechanism curated at the strength the evidence supports — plausible
    pharmacology, unproven benefit.
  attaches_to:
  - pathophysiology#Endometrial Epithelial Loss and Differentiation Signalling Failure
  evidence:
  - reference: PMID:37396823
    reference_title: >-
      Hormonal support in women with Asherman syndrome does not lead to better
      outcomes: A randomized trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Usual care does not lead to better outcomes as compared with not giving
      exogenous estrogen but is associated with side effects.
    explanation: >-
      The trial's own conclusion, which is what opens the gap. It is cited as
      SUPPORT for the *existence* of the gap here, and separately as REFUTE
      against the benefit claim on the estrogen treatment entry.
  proposed_experiments:
  - experiment_id: exp_ias_estrogen_stratified_by_residual_endometrium
    name: Estrogen benefit stratified by residual functional endometrium
    description: >-
      Re-randomize or re-analyse post-adhesiolysis estrogen against no estrogen
      with patients stratified by residual endometrial thickness and by whether
      any basalis is identifiable at second-look hysteroscopy, to test whether a
      proliferative agent benefits only the subgroup that retains a substrate
      for it to act on.
  - experiment_id: exp_ias_estrogen_target_engagement
    name: Direct measurement of endometrial target engagement under estrogen
    description: >-
      Measure proliferation directly (endometrial thickness on serial
      ultrasound, Ki-67 index on second-look biopsy) in treated versus untreated
      arms, to establish whether the proliferative mechanism engages at all in
      this setting before attributing the null outcome result to it.
notes: >-
  Curated 2026-08-22 against issue #7837 (obstetric/gynaecologic coverage gap).
  The stub `stubs/Asherman_Syndrome.yaml` is deleted by the same change, with
  the lump/split call resolved as `DISEASE`.

  The entry was curated first from PubMed-retrieved primary literature and
  reviews, without a deep-research provider report; a DR run
  (`research/Asherman_Syndrome-deep-research-claude_code.md`, 15/15 references
  resolved, confabulation rate 0.0) was added afterwards at review request and
  cross-checked against the finished YAML. Its NEC preflight against
  MONDO:0015299 returns `SKIP` — MONDO records no causal gene for an acquired
  disease, so the gene-identity check cannot discriminate; the manual check
  passes (the report's top gene mentions are THBS1/SLPI/WNT7A/NOTCH2, all
  endometrial-fibrosis genes, and it carries no OMIM assertion to conflict
  with). The cross-check surfaced one substantive omission, now curated: the
  randomised trial of postoperative hormonal support (PMID:37396823), added as
  REFUTE evidence against the estrogen benefit claim and as the
  `gap_postoperative_estrogen_benefit` knowledge gap. Themes the report raised
  that are deliberately *not* curated here: hematometra as a separate phenotype
  (the report's own row is uncited, and the entry already carries the
  obstruction mechanism as `Menstrual Outflow Obstruction` feeding cyclic
  pelvic pain); the 3D-ultrasound diagnostic accuracy figures and the AFS/ESGE
  severity classifications (already listed below as second-pass work); the
  THBS1/PI3K-AKT and IGFBP3/5/6 anti-angiogenic molecular arms, which the
  report sources to reviews and preprints rather than to a quotable primary
  finding; and the single-cell GEO deposition, which needs
  `just verify-datasets` before any accession is asserted.

  Three modelling choices worth flagging for a reviewer. First, the three
  amplifier mechanisms (autophagy, ferroptosis, EndMT) are all deliberately kept
  off the canonical chain and expressed as `mechanistic_hypotheses` with
  `hypothesis_groups` on their edges, because each rests on a small patient
  observation plus rodent or in vitro perturbation; the shared upstream review
  (PMID:39613882) names exactly these three as the current pathogenesis
  frontier, which is corroboration of their salience but not of their causal
  status in human disease. Second, `HP:0000140 Abnormality of the menstrual
  cycle` is used for hypomenorrhea because HPO has no hypomenorrhea term —
  searched under `hypomenorrhea` and `menstr`. Third, the recurrent pregnancy
  loss phenotype is left ontology-unbound: `HP:0200067` exists and means exactly
  the right thing but is outside the `PhenotypeTerm` enum root, the recurring
  structural gap recorded as gap 3 of issue #7837. Both of the last two are the
  "no term beats a bad one" rule, applied once to a parent-term binding and once
  to omission.

  Endometrial receptivity biomarkers, the hysteroscopic severity classification
  systems (AFS/ESGE/March) as structured `definitions`, and the anti-adhesion
  gel barrier literature are all in scope for a second pass and are not curated
  here.

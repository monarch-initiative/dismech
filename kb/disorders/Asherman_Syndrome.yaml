- name: Mouse uterine injury with autophagy-pathway drugs
  species: Mouse
  background: Adult eight-week-old female C57BL/6 mice
  publication: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9542425/
  description: Curettage plus intrauterine LPS produces an IUA-like injury. Chloroquine and rapamycin begin two hours before surgery and continue for two weeks; T3 is administered on days 6–15. Histological fibrosis and epithelial/mesenchymal markers are measured, with four mice per group.
  notes: Rapamycin is preventive attenuation in this protocol rather than delayed clinical rescue. Chloroquine alone gives a mild nonsignificant fibrosis/EMT trend; injury initiates the model. No pregnancy or live-birth endpoint is measured. The paper inconsistently reports T3 as 40 mg/kg in Methods/Figure 8 and 40 micrograms/kg/day in Discussion; no dose is promoted as a clinical regimen. A mouse DIO2 gene-therapy experiment is not reported.
  modeled_mechanisms:
  - target: Reduced Epithelial Autophagy
    relationship: PERTURBS
    description: Autophagy-related drugs alter marker readouts in injured uterus.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9542425/
      reference_title: Defective autophagy contributes to endometrial epithelial-mesenchymal transition in intrauterine adhesions - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: in an IUA-like mouse model, the autophagy in endometrium was defective accompanied by EEC-EMT, and CQ could inhibit autophagy and aggravate endometrial fibrosis, whereas rapamycin or T3 treatment could improve the autophagic levels and blunt endometrial fibrosis
      explanation: Mouse histology and marker findings; prophylactic rapamycin and later T3 differ in timing.
    limitations: Pharmacological specificity and human flux mediation are unresolved.

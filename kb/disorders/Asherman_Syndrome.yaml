- category: Clinical
  name: Recurrent pregnancy loss
  description: >-
    Recurrent spontaneous abortion is a common presentation, reflecting failure
    of implantation and placentation on a scarred, partly obliterated cavity.

    The ontology binding is deliberately omitted. `HP:0200067` Recurrent
    spontaneous abortion is a real HPO term meaning exactly this, but it sits
    outside `HP:0000118` (phenotypic abnormality) in the pregnancy-history
    branch and so is not a member of the `PhenotypeTerm` dynamic enum.
    Substituting a term that means something else would be worse than leaving it
    unbound, so the meaning is carried by `preferred_term`. This is a further
    instance of the enum-root gap recorded as gap 3 of issue #7837, which
    `Familial_Hyperaldosteronism_Type_I` hit for `HP:0100602` and
    `Hemolytic_Disease_of_the_Fetus_and_Newborn` hit for `HP:0003826`
    Stillbirth.

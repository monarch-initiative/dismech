    description: >-
      Loss of autophagic flux destabilizes epithelial homeostasis and pushes
      epithelial cells toward a mesenchymal phenotype.
- name: Endometrial Ferroptosis
  biological_scale: CELLULAR
  description: >-
    A second amplifier arm. RNA-seq of endometrium from four patients with
    severe intrauterine adhesions against four normal controls showed an
    increased ferroptosis load, localized by immunohistochemistry;
    erastin-induced ferroptosis promoted EMT and fibrosis in endometrial
    epithelial cells, and ferrostatin-1 significantly ameliorated fibrosis in a
    dual-injury murine model. The stimulus did not act on stromal cells
    directly, so the arm is wired through the epithelium.

- name: Rat mechanical-plus-LPS uterine injury
  species: Rat
  background: Eight-week-old female Sprague-Dawley rats
  publication: PMID:34996477
  description: Uterine scraping plus an intrauterine LPS-bearing thread retained for 48 hours produces fibrosis, reduced glands and adhesion-associated histology. Observations at days 3, 7, 14 and 28 include CD31/alpha-SMA co-localization at day 14.
  notes: The injury can extend into myometrium and models severe acute injury. No endothelial lineage tracing, selective conversion blockade, source fraction or human validation is provided. Marker coexpression cannot establish all fibroblasts as endothelial-derived; sample-size reporting is limited.

    term:
      id: CL:0002149
      label: epithelial cell of uterus
  publication: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9542425/
  description: The strongest of three screened DIO2 siRNAs and a DIO2 overexpression construct alter ERK/MTOR phosphorylation, autophagy-associated markers and epithelial/mesenchymal markers. Chloroquine blockade and U0126 pretreatment test pharmacological pathway dependence.
  notes: No siRNA-resistant rescue, catalytic-dead comparison, direct DIO2-to-ERK binding assay or genetic ATG epistasis is reported. Most DIO2 assays are static marker/structure measurements. The paper uses Ishikawa cells for CCK-8 viability, so that reassurance is not assigned to all primary EEC exposures. Marker shifts do not trace a human fibroblast lineage.

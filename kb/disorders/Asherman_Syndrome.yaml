- name: Epithelial-supernatant stromal fibrosis assay
  experimental_model_type: CO_CULTURE
  cell_source: Endometrial epithelial and human endometrial stromal preparations reported in the abstract; further provenance unavailable
  publication: PMID:37302615
  description: Erastin-induced epithelial stress promotes EMT/fibrosis markers, whereas direct erastin does not induce stromal fibrogenic differentiation. Transfer of stimulated epithelial supernatant promotes the stromal response.
  notes: The abstract calls this a co-culture experiment; the accessible record does not establish simultaneous contact culture, the necessary soluble mediator, dose or donor replication. No mediator-neutralization result or direct epithelial lineage conversion is inferred.
  modeled_mechanisms:
  - target: Epithelial Profibrotic Supernatant Activity
    relationship: MEASURES
    description: Supernatant carries transferable fibrogenic activity.
    evidence:
    - reference: PMID:37302615
      reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Cell co-culture experiments showed that erastin-stimulated epithelial cell supernatants promoted fibrosis in HESCs (P < 0.05).
      explanation: Transferable supernatant activity supports epithelial-stromal coupling; the responsible mediator is unresolved in the accessible abstract.

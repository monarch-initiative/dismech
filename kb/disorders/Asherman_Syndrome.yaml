    description: >-
      Epithelial cells that undergo epithelial-mesenchymal transition, rather
      than being replaced, contribute directly to the myofibroblast pool. Both
      the autophagy-defect and ferroptosis hypotheses act on this edge, and both
      were demonstrated on the epithelial compartment specifically.
  - target: Non-Regenerative Fibrotic Repair and Excessive ECM Deposition
    causal_link_type: DIRECT

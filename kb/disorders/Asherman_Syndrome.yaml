    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our endometrial atlas highlights the loss of the endometrial epithelium,
      alterations to epithelial differentiation signaling pathways such as Wnt
      and Notch, and the appearance of characteristic epithelium expressing
      secretory leukocyte protease inhibitor during the window of implantation.
    explanation: >-
      The direct human observation of epithelial loss and of the Wnt/Notch
      differentiation-signalling alterations this node asserts.
  downstream:
  - target: Myofibroblast Generation and Mesenchymal Activation
    causal_link_type: DIRECT
    hypothesis_groups:
    - autophagy_defect_emt

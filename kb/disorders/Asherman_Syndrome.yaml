  evidence:
  - reference: PMID:31388435
    reference_title: Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: At this time, the patient was started on 2-month course of 4-drug Rifampin, Isoniazid, Pyrazinamide, and Ethambutol (RIPE) therapy followed by 4 months of ri- fampin and isoniazid.
    explanation: Actual reported regimen; individual management is not a universally validated AS treatment protocol.
- name: No routine perioperative antibiotic recommendation
  description: The AAGL/ESGE guideline finds insufficient evidence for or against antibiotics specifically to prevent postoperative adhesions. This uncertainty does not replace treatment of a documented infection or other independently indicated prophylaxis.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There is no evidence to support or refute the use of preoperative, intraoperative, or postoperative antibiotic therapy in surgical treatment of IUAs. Grade C
    explanation: No established adhesion-prevention benefit.
- name: Investigational regenerative and molecular therapies
  description: Stem-cell approaches and agents intended to alter vascular flow remain research interventions. Animal T3, rapamycin and ferrostatin findings do not establish human fertility benefit or a clinical regimen. Putative stem-cell benefit may involve niche/paracrine changes rather than durable replacement of all missing epithelial progenitors; controlled clinical efficacy remains a separate question.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Stem cell treatment may ultimately provide an effective adjuvant approach to the treatment of Asherman syndrome; however, evidence is very limited and this treatment should not be offered outside of rigorous research protocols. Grade C
    explanation: Research-only status in the guideline.
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The role of medications designed as adjuvants to improve vascular flow to the endometrium has not been established. Consequently, they should not be used outside of rigorous research protocols. Grade C
    explanation: No established vascular adjunct regimen.
clinical_trials:
- name: NCT05394662
  phase: PHASE_III
  status: COMPLETED
  description: Juveena Hydrogel barrier trial after adhesiolysis or myomectomy. The 2026 report randomized 150 participants (99 hydrogel, 51 control), including 102 undergoing adhesiolysis. In that subgroup, 60.3% versus 32.3% were adhesion-free at second look (OR 3.19, 95% CI 1.29–7.90). The mixed-procedure study and short-term hysteroscopic endpoint do not establish live-birth efficacy; reported device-safety follow-up extended through three weeks. The abstract does not establish that this product is interchangeable with all hyaluronic-acid barriers.

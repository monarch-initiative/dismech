- hypothesis_group_id: niche_dysfunction
  hypothesis_label: Altered epithelial differentiation within a dysfunctional niche
  status: EMERGING
  description: Human transcriptional and inferred communication differences suggest altered epithelial differentiation. Cross-sectional composition, HRT exposure and control-dataset differences do not establish WNT or NOTCH as necessary causal routes.
  evidence:
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Our endometrial atlas highlights the loss of the endometrial epithelium, alterations to epithelial differentiation signaling pathways such as Wnt and Notch, and the appearance of characteristic epithelium expressing secretory leukocyte protease inhibitor during the window of implantation.
    explanation: Human recovered-cell and transcriptional observations; cell proportions are not stereological tissue-volume measurements.

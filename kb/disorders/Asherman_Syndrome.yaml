    explanation: Guideline identifies retained menstrual blood among clinically relevant presentations.
- name: Placenta accreta
  category: Clinical
  description: Abnormally adherent placentation is a risk in pregnancies after intrauterine adhesion disease and its treatment. Estimates depend on the selected pregnancy cohort and do not describe all affected patients.
  phenotype_term:

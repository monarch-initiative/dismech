synonyms:
- intrauterine adhesions
- intrauterine synechiae
- uterine synechiae
- Asherman's syndrome
- IUA
description: Asherman syndrome is symptomatic intrauterine or endocervical adhesion disease. Endometrial injury, commonly after pregnancy-related uterine instrumentation and occasionally infection or other uterine procedures, can heal with fibrous tissue and bridging adhesions. Menstrual disturbance, cyclic pain, infertility or pregnancy loss may follow. Residual endometrium and regenerative capacity vary; complete stem-cell depletion is not required or demonstrated in every case. Hysteroscopy defines the cavity lesion and enables adhesiolysis, but recurrence and impaired reproductive outcomes may persist.
notes: Asymptomatic intrauterine adhesions are a related anatomical finding and are not automatically Asherman syndrome. This acquired disorder has no established Mendelian causal gene. Molecular expression changes and experimental perturbations are not inherited pathogenic variants. Clinical scope draws on the AAGL/ESGE guideline and the StatPearls chapter (PMID:28846336; NBK448088), with newer primary studies qualifying adjunct efficacy. The full autophagy paper (PMID:35196191; DOI:10.1080/15548627.2022.2038994) uses its generated PMC URL evidence identity because canonical PMID retrieval remained abstract-only. Human atlas and animal/culture mechanisms are distinguished from established clinical care.
definitions:
- name: Symptomatic intrauterine adhesion disease
  definition_type: DIAGNOSTIC_CRITERIA
  description: Intrauterine or endocervical adhesions accompanied by attributable menstrual disturbance, pain or reproductive dysfunction constitute the symptomatic syndrome; every symptom is not required.
  inclusion_criteria:
  - preferred_term: Intrauterine adhesions established by cavity assessment
  - preferred_term: Attributable pain, menstrual disturbance or subfertility in any combination
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The terms “Asherman syndrome” and IUAs are often used interchangeably, although the syndrome requires the constellation of signs and symptoms (in this case, pain, menstrual disturbance, and subfertility in any combination) related to the presence of IUAs
    explanation: Guideline distinction between an anatomical finding and the symptomatic syndrome.
- name: Hysteroscopic severity classification
  definition_type: OTHER
  description: Document adhesion extent, density, location and residual cavity/endometrium. AFS also incorporates menstrual features; March, ESGE and other schemes use different criteria. Categories describe severity rather than inevitable sequential stages.
  notes: No single system was endorsed as superior in the AAGL/ESGE guideline; outcome associations do not constitute a validated individual live-birth prediction tool.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intrauterine adhesions should be classified as prognosis is correlated with severity of adhesions. Level B.
    explanation: The guideline supports recording severity.
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Consequently, it is currently not possible to endorse any specific system. Level C.
    explanation: Classification systems remain heterogeneous.

mechanistic_hypotheses:
- hypothesis_group_id: nonregenerative_fibrotic_repair
  hypothesis_label: Basalis destruction switches endometrial repair from regeneration to scarring
  status: CANONICAL
  description: >-
    The accepted account. Injury that removes or destroys the endometrial basal
    layer eliminates the regenerative compartment from which the functionalis is
    normally rebuilt. Repair then proceeds by the generic fibrotic route —
    inflammation, myofibroblast generation, collagen deposition — and the
    resulting fibrous connective tissue replaces endometrium rather than being
    remodelled away. Because the injury is typically to opposing surfaces of a
    collapsed cavity, the scar bridges them, producing adhesions rather than
    simple mural fibrosis.
  evidence:
  - reference: PMID:39613882
    reference_title: Mechanistic insights into intrauterine adhesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrauterine adhesions (IUA), also known as Asherman's syndrome, arise
      from damage to the basal layer of the endometrium, frequently caused by
      intrauterine interventions. This damage leads to nonregenerative healing
      of endometrium resulting in replacement by fibrous connective tissue
    explanation: >-
      States the canonical chain in one sentence: basalis damage, then
      nonregenerative healing, then fibrous replacement.
- hypothesis_group_id: autophagy_defect_emt
  hypothesis_label: Defective epithelial autophagy (DIO2-MAPK/ERK-MTOR) drives epithelial-mesenchymal transition
  status: EMERGING
  description: >-
    Autophagy is defective in the endometrium of Asherman patients and is
    associated with DIO2 downregulation. In endometrial epithelial cells,
    blocking autophagy pharmacologically promotes EMT and enhancing it with
    rapamycin attenuates EMT; silencing DIO2 blocks autophagic flux and drives
    EMT through MAPK/ERK-MTOR. The patient observation is correlative and every
    causal step is cell-culture or mouse, so this is curated as an amplifier
    hypothesis rather than as part of the canonical chain.
  evidence:
  - reference: PMID:35196191
    reference_title: Defective autophagy contributes to endometrial epithelial-mesenchymal transition in intrauterine adhesions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that autophagy is defective in endometria of IUA patients,
      which aggravates EMT and endometrial fibrosis, and defective autophagy is
      related to DIO2 (iodothyronine deiodinase 2) downregulation
    explanation: >-
      States the hypothesis and names the DIO2 link. Classified IN_VITRO because
      the causal demonstrations in this paper are in endometrial epithelial cell
      culture; the patient data are descriptive.
- hypothesis_group_id: ferroptosis_amplification
  hypothesis_label: Increased ferroptosis load in injured endometrium amplifies epithelial EMT and fibrosis
  status: EMERGING
  description: >-
    RNA-seq of severe Asherman endometrium against normal controls found an
    increased ferroptosis load, and erastin-induced ferroptosis promoted EMT and
    fibrosis in endometrial epithelial cells while the ferroptosis inhibitor
    ferrostatin-1 ameliorated fibrosis in a dual-injury murine model. The
    compartment specificity matters and is preserved here: erastin did not
    produce pro-fibrotic differentiation in endometrial stromal cells directly,
    so the proposed route runs through the epithelium.
  evidence:
  - reference: PMID:37302615
    reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that ferroptosis load is increased in IUA endometria. In
      vitro experiments showed that erastin-induced ferroptosis promoted EMT and
      fibrosis in endometrial epithelial cells
    explanation: >-
      Establishes the patient-tissue observation and the in vitro causal step
      this hypothesis rests on.
  - reference: PMID:37302615
    reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      but did not lead to pro-fibrotic differentiation in endometrial stromal
      cells (HESCs)
    explanation: >-
      Retained as a deliberate negative limit on the hypothesis: the ferroptotic
      stimulus does not act directly on the stromal compartment, which is why
      the hypothesis is wired through the epithelial node and not the
      myofibroblast node.
- hypothesis_group_id: endmt_myofibroblast_origin
  hypothesis_label: Endothelial-to-mesenchymal transition contributes myofibroblasts to endometrial fibrosis
  status: EMERGING
  description: >-
    A rat intrauterine adhesion model showed cells doubly positive for the
    endothelial marker CD31 and the myofibroblast marker alpha-SMA in the
    endometrium 14 days after injury, with falling CD31 and rising alpha-SMA and
    vimentin, implicating endothelium as one source of the myofibroblast pool.
    No human confirmation was found in this curation pass, so the arm is
    EMERGING and carries a HUMAN_MODEL_MISMATCH discussion.
  evidence:
  - reference: PMID:34996477
    reference_title: "EndMT: New findings on the origin of myofibroblasts in endometrial fibrosis of intrauterine adhesions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence co-localization of CD31 and a-SMA showed that 14 days
      after moulding, double positive cells for CD31 and a-SMA could be clearly
      observed in the endometrium.
    explanation: >-
      The dual-marker observation on which the EndMT origin claim rests, in a
      rat model.
pathophysiology:
- name: Endometrial Basal Layer Injury
  biological_scale: TISSUE
  description: >-
    The initiating lesion. Instrumentation of the pregnant or recently pregnant
    uterus — classically sharp curettage after miscarriage or postpartum —
    strips or destroys the basal layer of the endometrium, the compartment that
    regenerates the functionalis after each shedding. Hysteroscopic surgery,
    uterine artery embolization and uterine tuberculosis produce the same lesion
    by different routes. The gravid or recently gravid state is the important
    modifier: the same instrument used on a non-pregnant uterus is far less
    likely to cause adhesions, which is why the risk concentrates around
    pregnancy-related evacuation.
  conforms_to: fibrotic_response#Tissue Injury

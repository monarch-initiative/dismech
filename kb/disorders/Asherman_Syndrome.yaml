  description: Human tissue and DIO2 culture experiments mainly show static autophagy-associated marker/structure changes. T3-associated chloroquine turnover provides dynamic flux support in culture; it should not be transferred to every human or DIO2 assay. Pharmacological effects support an autophagy-related hypothesis rather than a proven universal initiating lesion.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9542425/
    reference_title: Defective autophagy contributes to endometrial epithelial-mesenchymal transition in intrauterine adhesions - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In endometrial epithelial cells (EECs), pharmacological inhibition of autophagy by chloroquine (CQ) promoted EEC-EMT, whereas enhanced autophagy by rapamycin extenuated this process.
    explanation: Pharmacological effects on epithelial/mesenchymal markers; not genetic epistasis or lineage tracing.

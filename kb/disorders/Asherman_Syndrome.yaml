    snippet: 'placenta accreta syndrome was 10.1% (95% CI: 8.6 to 11.8) in 23 studies'
    explanation: A pooled post-adhesiolysis pregnancy complication, not an untreated disease frequency.
prevalence:
- population: Women evaluated by hysteroscopy within 12 months of a miscarriage
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 19100.0
  rate_low: 12800.0
  rate_high: 27500.0
  notes: The 2014 review included 912 women in ten prospective studies evaluated by hysteroscopy within twelve months of miscarriage after spontaneous expulsion or medical/surgical management. There were 183 detected adhesions; the pooled prevalence was 19.1% (95% CI 12.8–27.5%). Severity was reported for 124, of whom 58.1% had mild adhesions. This is selected post-miscarriage IUA prevalence, including findings of uncertain clinical importance, not general-population prevalence of symptomatic Asherman syndrome.
  evidence:
  - reference: PMID:24082042
    reference_title: 'Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'IUAs were detected in 183 women, resulting in a pooled prevalence of 19.1% [95% confidence interval (CI): 12.8-27.5%].'
    explanation: The pooled point estimate and interval recorded in this record.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24082042
    reference_title: 'Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In more than half of these, the severity and extent of the adhesions was mild, with unknown clinical relevance.
    explanation: 'Deliberate limit on the number above: the pooled figure counts hysteroscopic lesions, most of them mild, and must not be read as the prevalence of symptomatic Asherman syndrome.'
    quote_role: REVIEW_SYNTHESIS
epidemiology:
- name: Repeated uterine instrumentation
  description: Repeated miscarriage and dilation/curettage are associated with adhesion detection. The number of curettages may contribute, but pre-existing uterine conditions and indications for repeated treatment complicate causal attribution.
  evidence:
  - reference: PMID:24082042
    reference_title: 'Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The number of dilatation and curettage (D&C) procedures seemed to be the main driver behind these associations.
    explanation: The systematic review qualifies the proposed mediator.
- name: Pregnancy-related injury context
  description: Pregnancy-related and postpartum uterine procedures account for many reported cases. These case distributions are not procedure-specific risks, and nonpregnant uterine surgery can also precede adhesions.
  evidence:
  - reference: PMID:21437822
    reference_title: Asherman's syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Although it usually occurs following curettage of the pregnant or recently pregnant uterus, any uterine surgery can lead to intrauterine adhesions (IUA).
    explanation: Clinical review preserves the broader procedural spectrum.
- name: Genital tuberculosis
  description: Genital tuberculosis can injure the endometrium and cause adhesions, often alongside tubal disease. Consider exposure and regional context when clinically indicated; tuberculosis is not the cause of most post-instrumentation cases.
  evidence:
  - reference: PMID:31388435
    reference_title: Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We present a case of genital tuberculosis causing Asherman's syndrome and resultant infertility.
    explanation: One infection-associated case report; no population rate is inferred.
diagnosis:
- name: Hysteroscopy
  description: Direct visualization is the diagnostic reference standard when the cavity is accessible. Record location, extent, density and residual endometrium; it can permit concurrent adhesiolysis. Severe obliteration requires specialist assessment.
  diagnosis_term:
    preferred_term: Hysteroscopy
    term:
      id: NCIT:C148437
      label: Hysteroscopy
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Hysteroscopy is the most accurate method for diagnosis of IUAs and should be the investigation of choice when available. Level B.
    explanation: AAGL/ESGE recommendation.
- name: Contrast cavity imaging
  description: Saline/gel infusion sonography or hysterosalpingography may assess the cavity when hysteroscopy is unavailable or during initial evaluation. HSG also assesses tubal patency. False-positive and false-negative findings limit replacement of hysteroscopy.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If hysteroscopy is not available, HSG and SHG are reasonable alternatives. Level B.
    explanation: Alternative cavity assessment with imperfect accuracy.
- name: Selective MRI in an inaccessible cavity
  description: MRI is not a routine diagnostic requirement. The 2017 guideline restricts it to research, while the 2019 review describes possible value in rare totally obstructed cavities where standard cavity tests are limited; selection is specialist-dependent.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Magnetic resonance imaging should not be used for diagnosis of IUAs outside of clinical research studies. Level C.
    explanation: Guideline restriction.
  - reference: PMID:30936754
    reference_title: 'Asherman''s syndrome: current perspectives on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In these rare cases MRI can be valuable, although too expensive as a routine diagnostic tool.
    explanation: Later review discusses selective use after total obstruction.
- name: Amenorrhea and fertility evaluation
  description: Evaluate pregnancy and endocrine causes of amenorrhea and other contributors to infertility. Failure to bleed after an estrogen-progesterone challenge with otherwise intact ovarian-axis function supports an outflow/endometrial cause but is not itself definitive proof of adhesions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK448088/
    reference_title: Asherman Syndrome - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The failure to induce menses despite stimulating the endometrium with an estrogen-progesterone challenge, in a patient with secondary amenorrhea, with normal hypothalamic-pituitary-ovarian functions and hormone levels, points towards the diagnosis of Asherman's syndrome.
    explanation: Clinical differential assessment.
- name: Endometrial testing for suspected genital tuberculosis
  description: When exposure and clinical findings suggest infection, endometrial histology, acid-fast staining and mycobacterial culture can support the diagnosis. A negative chest radiograph does not exclude genital tuberculosis.
  evidence:
  - reference: PMID:31388435
    reference_title: Case report of pelvic tuberculosis resulting in Asherman's syndrome and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: necrotizing granulomas with acid- fast bacilli positive and culture positive for Mycobac- terium tuberculosis
    explanation: Confirmed infection in a selected patient, not universal screening or assay sensitivity.
progression:
- phase: Recurrence after adhesiolysis
  notes: Adhesions may recur after technically successful cavity restoration. More extensive baseline disease generally requires more treatment; an open cavity does not guarantee recovered endometrial function or fertility.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: recurrence is common and may occur in 30 to 66% of women treated for IUAs
    explanation: A guideline range from selected treated cohorts rather than a fixed patient prognosis.
- phase: Reproductive outcomes after adhesiolysis
  notes: A 2019 systematic review of 54 studies and 4,640 women of varying quality pooled pregnancy at 50.7% across 53 studies. Early loss, mid-trimester loss, ectopic pregnancy, cervical incompetence and abnormal placentation were reported in different subsets. These outcomes cannot be summed or treated as one longitudinal sequence or as frequencies in untreated disease. Residual severity, other fertility factors, follow-up and treatment protocols differ.
  evidence:
  - reference: PMID:30713131
    reference_title: 'Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: There were 54 studies (4640 women) of varying quality.
    explanation: Heterogeneous treated-study base.
  - reference: PMID:30713131
    reference_title: 'Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The pooled rate of pregnancy was 50.7%
    explanation: Post-treatment pooled pregnancy proportion.
  - reference: PMID:30713131
    reference_title: 'Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'early pregnancy loss was 17.7% (95% CI: 15.9 to 19.6) in 31 studies, ectopic pregnancy (EP) was 4.2% (95% CI: 2.8 to 6.3) in 9 studies, mid-trimester loss (MTL) was 11.5% (95% CI: 7.6 to 17.8) in 7 studies, cervical incompetence was 12.5% (95% CI: 3.3 to 33.5) in 2 studies and placenta accreta syndrome was 10.1% (95% CI: 8.6 to 11.8) in 23 studies'
    explanation: Each complication uses a distinct study subset; no disease-wide phenotype band is inferred.
differential_diagnoses:
- name: Endocrine or ovarian causes of amenorrhea
  description: Pregnancy, thyroid, hypothalamic/pituitary and ovarian dysfunction require assessment; ovarian-axis tests and cavity evaluation distinguish overlapping presentations.
  distinguishing_features:
  - Endocrine abnormalities or pregnancy without a required adhesion lesion
- name: Isolated cervical stenosis
  description: An outflow lesion may cause amenorrhea or cyclic pain without endometrial bridging adhesions throughout the cavity.
  distinguishing_features:
  - Localized cervical obstruction with an otherwise preserved cavity
- name: Endometriosis or adenomyosis
  description: These can cause pain and infertility and may coexist with adhesion disease. They do not require intrauterine synechiae; a patent cavity does not exclude either condition.
  distinguishing_features:
  - Endometriotic lesions outside the cavity or endometrial-type tissue within myometrium
treatments:
- name: Hysteroscopic adhesiolysis
  description: Direct-vision division of symptomatic adhesions is the standard lesion-directed approach (AAGL/ESGE Level B). Severe or extensive disease warrants experienced hysteroscopic care. Cold scissors avoid thermal injury, but randomized evidence does not establish superiority of one instrument. Blind curettage and blind probing are not supported. Image guidance may help selected difficult procedures without demonstrated prevention of perforation.
  treatment_term:
    preferred_term: Hysteroscopy
    term:
      id: NCIT:C148437
      label: Hysteroscopy
  target_mechanisms:
  - target: Intrauterine Adhesion Formation
    treatment_effect: INHIBITS
    description: Division of existing bridging adhesions restores cavity access; it does not assure recovered endometrial function or fertility.
    evidence:
    - reference: PMID:28603474
      reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Hysteroscopic lysis of adhesions by direct vision and a tool for adhesiolysis is the recommended approach for symptomatic IUAs. Level B
      explanation: Recommended lesion-directed treatment for symptomatic disease.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Hysteroscopic lysis of adhesions by direct vision and a tool for adhesiolysis is the recommended approach for symptomatic IUAs. Level B
    explanation: Recommended lesion-directed treatment for symptomatic disease.
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There is no evidence to support the use of blind dilation and curettage. Level C.
    explanation: Avoid replacing visual treatment with blind curettage.
- name: Temporary intrauterine physical barriers
  description: An inert large-surface-area IUD, balloon, stent or catheter may separate healing surfaces after adhesiolysis. The guideline grades reduced reformation A but notes limited subsequent fertility data; device and duration depend on clinical context. Copper-containing and progestin-containing IUDs should not be substituted for the recommended inert device.
  target_mechanisms:
  - target: Intrauterine Adhesion Formation
    treatment_effect: INHIBITS
    description: Temporary separation aims to reduce postoperative adhesion reformation.
    evidence:
    - reference: PMID:28603474
      reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: The use of an IUD, stent, or catheter appears to reduce the rate of postoperative adhesion reformation. There are limited data regarding subsequent fertility outcomes when these barriers are used. Grade A
      explanation: Recurrence and fertility are distinct outcomes.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The use of an IUD, stent, or catheter appears to reduce the rate of postoperative adhesion reformation. There are limited data regarding subsequent fertility outcomes when these barriers are used. Grade A
    explanation: Recurrence and fertility are distinct outcomes.
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If an IUD is used postoperatively, it should be inert and have a large surface area such as a Lippes loop. Intrauterine devices that contain progestin or copper should not be used after surgical division of IUAs. Grade C
    explanation: Device-specific limitation.
- name: Hyaluronic-acid adhesion barriers
  description: Selected postoperative semi-solid barriers can reduce adhesion reformation, but the size of benefit and reproductive outcomes vary by product, procedure and comparator. A network meta-analysis of 21 randomized trials and 2,406 patients did not establish a significant clinical-pregnancy advantage across the compared adjuvants; ranking changes in adhesion scores is not a live-birth recommendation.
  treatment_term:
    preferred_term: Hyaluronic-acid adhesion barrier
    therapeutic_agent:
    - preferred_term: hyaluronic acid
      term:
        id: CHEBI:16336
        label: hyaluronic acid
  target_mechanisms:
  - target: Intrauterine Adhesion Formation
    treatment_effect: INHIBITS
    description: Barrier-associated reduction in reformation does not prove regeneration of receptive endometrium.
    evidence:
    - reference: PMID:28603474
      reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Semi-solid barriers such as hyaluronic acid and auto-cross-linked hyaluronic acid gel reduce adhesion reformation. At this time, their effect on post-treatment pregnancy rates is unknown. Grade A
      explanation: The 2017 recommendation concerns adhesion reformation rather than established live-birth benefit.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Semi-solid barriers such as hyaluronic acid and auto-cross-linked hyaluronic acid gel reduce adhesion reformation. At this time, their effect on post-treatment pregnancy rates is unknown. Grade A
    explanation: The 2017 recommendation concerns adhesion reformation rather than established live-birth benefit.
  - reference: PMID:38493418
    reference_title: 'Intrauterine interventions options for preventing recurrence after hysteroscopic adhesiolysis: a systematic review and network meta-analysis of randomized controlled trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 21 randomized controlled trials involving 2406 patients
    explanation: Network review population; heterogeneous adjuncts and endpoints.
- name: Postoperative estrogen with or without progestin
  description: The 2017 guideline gives a Grade B recommendation that estrogen may reduce recurrence. A later single-centre randomized trial found no significant adhesion, pregnancy or living-child benefit from adding estrogen in selected women with previously regular ovulatory cycles, successful adhesiolysis and an inert IUD in both groups. Of 114 analyzed women, second-look recurrence was 16/59 versus 14/55; living-child outcomes were 40/59 versus 33/55. Wide uncertainty, selection and the shared barrier limit extrapolation to every regimen or anovulatory patient. Side effects were frequent in the estrogen group. These results do not demonstrate equivalence or a universal regenerative effect.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Following hysteroscopic-directed adhesiolysis, postoperative hormone treatment using estrogen, with or without progestin, may reduce recurrence of IUAs. Grade B
    explanation: Older conditional recommendation.
  - reference: PMID:37396823
    reference_title: 'Hormonal support in women with Asherman syndrome does not lead to better outcomes: A randomized trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of the women in usual care, 89.8% got pregnant within 3 years, and 67.8% got a living child; this was 83.6% and 60.0%, respectively, in the no-estrogen group (p = 0.33 and p = 0.39, respectively).
    explanation: Trial endpoints are nonsignificant, not proof of general equivalence.
- name: Post-treatment cavity reassessment
  description: Reassess the uterine cavity, preferably hysteroscopically (Grade B), because recurrence may require further treatment. Timing is individualized; the guideline discusses reassessment after two to three cycles and earlier second-look approaches. Surveillance identifies recurrence rather than independently restoring endometrial function.
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Follow-up assessment of the uterine cavity after treatment of IUAs is recommended, preferably with hysteroscopy. Grade B
    explanation: Recommended follow-up after treatment.
- name: Pregnancy and fertility follow-up
  description: Evaluate other infertility factors when conception does not follow cavity restoration. Subsequent pregnancies warrant attention to abnormal placentation, pregnancy loss, prematurity and retained placenta. Post-adhesiolysis cohort risks do not establish a fixed outcome for an individual pregnancy.
  evidence:
  - reference: PMID:30713131
    reference_title: 'Reproductive outcomes after surgical treatment of asherman syndrome: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'placenta accreta syndrome was 10.1% (95% CI: 8.6 to 11.8) in 23 studies'
    explanation: Selected treated-pregnancy evidence supports attention to placentation; it does not test a particular surveillance protocol.
- name: Treatment of confirmed genital tuberculosis
  description: Treat confirmed genital tuberculosis with appropriate multidrug antimicrobial care and infectious-disease input; adhesions and infertility may persist after microbiological treatment. One reported patient received two months of rifampin, isoniazid, pyrazinamide and ethambutol, followed by rifampin/isoniazid, with an extension after persistent acid-fast staining despite negative culture. Cyclic spotting returned only during subsequent estrogen priming; neither antibiotic-only menstrual recovery nor restored fertility was demonstrated.
  treatment_term:
    preferred_term: Antituberculous pharmacotherapy
    therapeutic_agent:

- name: Patient-derived endometrial epithelial organoids
  experimental_model_type: ORGANOID
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Three Asherman and three healthy-control endometrial donors; Asherman donors overlap the tissue cohort
  publication: PMID:37735465
  description: Hormone-treated passage-two organoids were profiled by single-cell RNA sequencing. Transcriptomic identities were assigned with a reference-trained classifier and compared between groups. AS organoid transcriptomic profiles differed from controls, particularly in glandular secretory epithelium; that result is not equated with the tissue-derived reduced-WNT communication signature.
  notes: Passage-two culture enriches organoid-forming cells. WNT inhibitor XAV939 in culture may mask differences; hormonal and selection effects limit extrapolation to untreated tissue. These assays neither trace progenitor fate nor show pathway-specific rescue or clinical cell-therapy efficacy.
  evidence:
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Organoids were generated from AS patients’ endometrium (n = 3) and from healthy control (n = 3) endometrium
    explanation: Three AS organoid donors overlap the nine-person human atlas cohort.
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: IN_VITRO

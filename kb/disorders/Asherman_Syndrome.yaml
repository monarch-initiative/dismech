    explanation: Authors explicitly limit interpretation of the organoid comparison.
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrauterine adhesions can develop from lesion of the basal layer of the
      endometrium caused by curettage of the newly pregnant uterus. The syndrome
      may also occur after hysteroscopic surgery, uterine artery embolization or
      uterine tuberculosis.
    explanation: >-
      Names the basal-layer lesion as the origin and enumerates the four routes
      to it that this node covers.
  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although it usually occurs following curettage of the pregnant or recently
      pregnant uterus, any uterine surgery can lead to intrauterine adhesions
      (IUA).
    explanation: >-
      Supports the pregnancy-associated concentration of risk while keeping the
      node general to uterine surgery.
  downstream:
  - target: Post-Injury Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      Tissue injury elicits the inflammatory phase of the wound-healing
      response.
  - target: Endometrial Epithelial Loss and Differentiation Signalling Failure
    causal_link_type: DIRECT
    description: >-
      Destruction of the regenerative basal compartment removes the source from

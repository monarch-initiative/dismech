- name: Myofibroblast Generation and Mesenchymal Activation
  biological_scale: CELLULAR
  description: >-
    The effector cell of the fibrotic programme. Myofibroblasts in endometrial
    fibrosis arise from more than one source: epithelial-mesenchymal transition
    of endometrial epithelial cells is the best-supported route in human tissue,
    and endothelial-to-mesenchymal transition has been demonstrated in a rat
    model, where CD31/alpha-SMA double-positive cells appear in the endometrium
    with falling CD31 and rising alpha-SMA and vimentin. This is the conserved
    mesenchymal-activation step of the fibrotic response module, with the
    organ-specific substitution being that the activated cell derives from
    epithelium and endothelium rather than from a resident tissue fibroblast
    population.

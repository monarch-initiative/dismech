- name: Endometrial Epithelial Loss and Differentiation Signalling Failure
  biological_scale: CELLULAR
  description: >-
    The endometrium-specific arm, and the reason this disease is not simply
    fibrosis in a uterus. Single-cell analysis of over 200,000 cells from
    Asherman patients found loss of the endometrial epithelium together with
    alterations in the Wnt and Notch pathways that direct epithelial
    differentiation, and the appearance during the implantation window of a
    characteristic epithelium expressing secretory leukocyte protease inhibitor.
    Losing the epithelium is not merely a consequence of scarring — it removes
    the compartment whose regeneration would otherwise close the wound without
    scar, so this node is both a consequence of the injury and a driver of the
    fibrotic outcome.

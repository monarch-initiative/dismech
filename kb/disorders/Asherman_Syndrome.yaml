  publication: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9542425/
  description: Chloroquine, rapamycin and T3 perturb autophagy-associated and epithelial/mesenchymal readouts. The T3 plus chloroquine comparison is the explicit dynamic turnover experiment.
  notes: Drug effects support pharmacological mediation with unresolved pleiotropy. No human fertility endpoint or transplant outcome is measured.

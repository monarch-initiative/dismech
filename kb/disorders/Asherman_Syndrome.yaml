- name: Defective Epithelial Autophagy
  biological_scale: CELLULAR
  description: >-
    An amplifier arm, not part of the asserted canonical chain. Autophagy is
    defective in the endometrium of Asherman patients in association with DIO2
    downregulation; in endometrial epithelial cells, inhibiting autophagy with
    chloroquine promotes epithelial-mesenchymal transition while rapamycin
    attenuates it, and silencing DIO2 blocks autophagic flux and drives EMT via
    MAPK/ERK-MTOR. Rapamycin and triiodothyronine both blunted endometrial
    fibrosis in an IUA-like mouse model.

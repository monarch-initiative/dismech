- name: Primary endometrial epithelial DIO2 perturbation
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Primary human endometrial epithelial cultures; individual donor independence is not established for every assay
  cell_types:

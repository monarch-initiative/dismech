- hypothesis_group_id: ferroptosis_amplification
  hypothesis_label: Ferroptotic epithelial stress promotes stromal fibrosis through transferable signals
  status: EMERGING
  description: Erastin affects epithelial preparations and their supernatant promotes stromal fibrosis, unlike direct stromal exposure. The necessary secreted mediator, pathway specificity and human causal sequence remain unresolved.
  evidence:
  - reference: PMID:37302615
    reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In vitro experiments showed that erastin-induced ferroptosis promoted EMT and fibrosis in endometrial epithelial cells (P < 0.05), but did not lead to pro-fibrotic differentiation in endometrial stromal cells (HESCs).
    explanation: Abstract-limited preparation-specific perturbation; epithelial and stromal responses differ.
  - reference: PMID:37302615
    reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Cell co-culture experiments showed that erastin-stimulated epithelial cell supernatants promoted fibrosis in HESCs (P < 0.05).
    explanation: Transferable supernatant activity supports epithelial-stromal coupling; the responsible mediator is unresolved in the accessible abstract.
- hypothesis_group_id: endmt_source
  hypothesis_label: Endothelial marker transitions may contribute to fibrosis
  status: EMERGING
  description: Rat CD31/alpha-SMA co-localization motivates an endothelial-source hypothesis. It does not quantify lineage conversion or establish that human myofibroblasts arise from endothelium.
  evidence:
  - reference: PMID:34996477
    reference_title: 'EndMT: New findings on the origin of myofibroblasts in endometrial fibrosis of intrauterine adhesions.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Immunofluorescence co-localization of CD31 and a-SMA showed that 14 days after moulding, double positive cells for CD31 and a-SMA could be clearly observed in the endometrium.
    explanation: CD31/alpha-SMA co-localization in the rat injury model; no endothelial lineage tracing quantifies conversion into fibroblasts.
discussions:
- discussion_id: gap_regenerative_capacity
  kind: KNOWLEDGE_GAP
  prompt: Which injury and niche features determine regeneration versus persistent scarring?
  rationale: Residual epithelial populations, injury depth, hormonal state, inflammatory context and niche interactions may all matter. Existing evidence does not identify one necessary switch or prove that complete progenitor depletion is required. The contribution of epithelial/stromal plasticity is species- and injury-dependent.
  attaches_to:
  - pathophysiology#Endometrial Basal Layer Injury
  - pathophysiology#Excessive Endometrial Matrix Deposition
  evidence:
  - reference: PMID:37843929
    reference_title: Mechanisms of Regeneration and Fibrosis in the Endometrium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In the endometrium, the diversion of healing towards a fibrotic outcome is often attributed to the obliteration of the stem cell reservoir during injury. However, this model is complicated by the observation that diverse cell populations may contribute to re-epithelialization of the endometrium
    explanation: Review explicitly challenges a simple complete-progenitor-loss account.
  proposed_experiments:
  - experiment_id: exp_matched_injury_niche
    name: Matched longitudinal injury and repair profiling
    description: Compare defined injury depths and hormonal states with serial tissue histology, epithelial coverage and validated lineage tracing in an appropriate model. Match human observational samples by cycle, treatment and sampling location rather than infer temporality from one biopsy.
- discussion_id: gap_cellular_origins
  kind: KNOWLEDGE_GAP
  prompt: Which cells contribute to the fibrogenic effector pool in human adhesion disease?
  rationale: Partial EMT markers, CD31/alpha-SMA co-localization and transcriptomic intermediate states do not by themselves trace cellular origin. The rat experiment uses scraping plus LPS and has no endothelial lineage tracing. Lack of an EndMT conclusion in the human atlas is not a negative test of the hypothesis; resident stromal fibroblasts cannot be excluded.
  attaches_to:
  - pathophysiology#Epithelial Mesenchymal Marker Shift
  - pathophysiology#Endothelial Mesenchymal Marker Coexpression
  - pathophysiology#Stromal Fibrogenic Activation
  evidence:
  - reference: PMID:34996477
    reference_title: 'EndMT: New findings on the origin of myofibroblasts in endometrial fibrosis of intrauterine adhesions.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Immunofluorescence co-localization of CD31 and a-SMA showed that 14 days after moulding, double positive cells for CD31 and a-SMA could be clearly observed in the endometrium.
    explanation: CD31/alpha-SMA co-localization in the rat injury model; no endothelial lineage tracing quantifies conversion into fibroblasts.
  - reference: PMID:37302615
    reference_title: Ferroptosis contributes to endometrial fibrosis in intrauterine adhesions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Cell co-culture experiments showed that erastin-stimulated epithelial cell supernatants promoted fibrosis in HESCs (P < 0.05).
    explanation: Transferable supernatant activity supports epithelial-stromal coupling; the responsible mediator is unresolved in the accessible abstract.
  proposed_experiments:
  - experiment_id: exp_lineage_resolved_fibrosis
    name: Lineage-resolved fibrosis with matched human spatial validation
    description: Use inducible epithelial, endothelial and stromal lineage tracing plus selective perturbations in a defined injury model; quantify lineage-labelled matrix-producing cells. Spatial human RNA/protein coexpression can validate states but must not be treated as equivalent to prospective lineage tracing.
- discussion_id: gap_human_niche_and_organoid_scope
  kind: KNOWLEDGE_GAP
  prompt: How much of the human atlas signature reflects disease, hormonal preparation or cell recovery?
  rationale: The human atlas included nine women with moderate or severe AS, five moderate and four severe, aged 34–42. AS biopsies were HRT-synchronized and obtained at least 1 cm from visible adhesions, while controls had natural cycles. Ten historical secretory controls and a twelve-sample WOI comparator overlap; they are not 22 independent controls. Recovered cell proportions, CellChat communication and RNAscope localization do not directly measure tissue-volume fractions, cell-death rates, cytokine secretion or angiogenesis. Organoids use three overlapping AS donors and three controls; P2 enrichment and XAV939 may mask differences. The paper provides no before/after cell-transplant efficacy comparison.
  attaches_to:
  - pathophysiology#Reduced Endometrial Epithelial Abundance
  - pathophysiology#Reduced WNT Communication Signature
  - pathophysiology#Reduced NOTCH Communication Signature
  evidence:
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A potential confounding element in this work may arise due to the comparison of AS patients undergoing hormonal replacement therapy (HRT) cycles with control patients undergoing natural cycles
    explanation: Authors acknowledge differential hormonal exposure.
  - reference: PMID:37735465
    reference_title: Decoding the endometrial niche of Asherman's Syndrome at single-cell resolution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The WOI control group comprised single-cell data from six single-cell transcriptomes obtained during the WOI from the GSE111976 dataset and six endometrial samples collected during the WOI from healthy donors.
    explanation: Overlapping comparator datasets; not independent summed cohorts.
- discussion_id: gap_clinical_translation_and_adjuncts
  kind: KNOWLEDGE_GAP
  prompt: Which postoperative adjuncts improve live birth, beyond reducing visible adhesions?
  rationale: Cavity scores, recurrence, menstrual recovery, pregnancy and live birth are distinct endpoints. Some barriers reduce short-term reformation, while comparative fertility benefit remains uncertain. The newer estrogen trial in selected ovulatory women with an IUD found no significant added benefit, without proving equivalence for every regimen. A 2026 hydrogel trial improves a short-term anatomical endpoint in the adhesiolysis subgroup; this does not establish long-term fertility or molecular regeneration. Animal drug timing and species-specific exposure preclude routine T3, rapamycin or ferrostatin treatment claims.
  attaches_to:
  - pathophysiology#Intrauterine Adhesion Formation
  - pathophysiology#Reduced Receptive Endometrial Surface
  evidence:
  - reference: PMID:28603474
    reference_title: 'AAGL practice report: practice guidelines on intrauterine adhesions developed in collaboration with the European Society of Gynaecological Endoscopy (ESGE).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Semi-solid barriers such as hyaluronic acid and auto-cross-linked hyaluronic acid gel reduce adhesion reformation. At this time, their effect on post-treatment pregnancy rates is unknown. Grade A
    explanation: The 2017 recommendation concerns adhesion reformation rather than established live-birth benefit.
  - reference: PMID:37396823
    reference_title: 'Hormonal support in women with Asherman syndrome does not lead to better outcomes: A randomized trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of the women in usual care, 89.8% got pregnant within 3 years, and 67.8% got a living child; this was 83.6% and 60.0%, respectively, in the no-estrogen group (p = 0.33 and p = 0.39, respectively).
    explanation: Trial endpoints are nonsignificant, not proof of general equivalence.
  - reference: PMID:42492609
    reference_title: 'Safety and effectiveness of an in situ-forming hydrogel barrier in preventing intrauterine adhesions after adhesiogenic hysteroscopic procedures: a multicenter, randomized, controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'In the adhesiolysis subgroup (n = 102), more participants in the hydrogel barrier arm were adhesion-free compared with controls (60.3% vs. 32.3%; odds ratio [OR] 3.19, 95% confidence interval [CI]: 1.29-7.90)'
    explanation: Selected subgroup with anatomical outcome and uncertainty.
  proposed_experiments:
  - experiment_id: exp_adjunct_live_birth
    name: Controlled adjunct trial with reproductive follow-up
    description: Compare well-defined postoperative regimens with standardized baseline severity, second-look assessment and subsequent live-birth follow-up. Report infertility co-factors, repeat procedures, adverse effects and subgroup uncertainty; use anatomical outcomes as intermediate endpoints rather than validated fertility surrogates.

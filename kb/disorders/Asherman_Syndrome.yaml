name: Asherman_Syndrome
creation_date: '2026-08-22T06:00:00Z'
category: Acquired
synonyms:
- intrauterine adhesions
- intrauterine synechiae
- uterine synechiae
- Asherman's syndrome
- IUA
description: >-
  Asherman syndrome is an acquired fibrotic disease of the uterine cavity in
  which the basal (regenerative) layer of the endometrium is destroyed, most
  often by curettage of the pregnant or recently pregnant uterus, and the
  endometrium heals by scarring instead of regenerating. The scar tissue bridges
  the opposing walls of the cavity as intrauterine adhesions, partially or
  completely obliterating the cavity and the cervical canal. Clinically it
  presents with hypomenorrhea or amenorrhea, cyclic pelvic pain from outflow
  obstruction, infertility, and recurrent pregnancy loss.

  What makes the disease mechanistically interesting is that it is a
  regeneration failure in a tissue that is otherwise an exemplar of scarless
  repair: the endometrium is shed and rebuilt without scarring dozens of times
  across the reproductive lifespan, and after parturition sheds a substantial
  portion of the tissue, yet after certain iatrogenic insults the same tissue
  scars. The entry therefore models the disease as a switch between two repair
  programmes rather than as fibrosis added on top of normal healing, and it
  conforms to the `fibrotic_response` module along the conserved
  injury-inflammation-myofibroblast-ECM chain while keeping the
  endometrium-specific epithelial-loss arm — described at single-cell resolution
  in human Asherman endometrium — as its own node.

  Three amplifier mechanisms (defective autophagy, ferroptosis, and
  endothelial-to-mesenchymal transition) are curated as EMERGING hypotheses
  rather than asserted on the canonical chain, because each rests on patient
  tissue plus rodent or in vitro perturbation rather than on human
  interventional evidence.

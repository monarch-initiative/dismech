      reference_title: Defective autophagy contributes to endometrial epithelial-mesenchymal transition in intrauterine adhesions - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: CQ and T3 treatment significantly increased LC3B-II levels compared to T3 or CQ alone suggesting that T3 increased autophagic flux in EECs.
      explanation: Lysosomal-blockade turnover supports dynamic T3-associated flux in culture; other marker assays are not equivalent.

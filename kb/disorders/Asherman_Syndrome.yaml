- name: Non-Regenerative Fibrotic Repair and Excessive ECM Deposition
  biological_scale: TISSUE
  description: >-
    The switch point of the disease. Endometrium normally rebuilds after
    shedding without scarring — it is one of the few adult mammalian tissues
    that does so routinely, including after the substantial tissue loss of
    parturition. After certain assaults, that programme fails and fibrous
    connective tissue is laid down in place of endometrium. It is the
    substitution rather than the quantity of matrix that defines the disease:
    the cavity is lined by scar where it should be lined by regenerating mucosa.
  conforms_to: fibrotic_response#Excessive ECM Deposition

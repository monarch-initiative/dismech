    explanation: >-
      Bidirectional pharmacological manipulation in endometrial epithelial cells
      — the strongest causal evidence available for this arm.
  - reference: PMID:35196191
    reference_title: Defective autophagy contributes to endometrial epithelial-mesenchymal transition in intrauterine adhesions.
    supports: SUPPORT

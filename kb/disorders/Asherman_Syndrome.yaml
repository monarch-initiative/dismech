- name: Post-Injury Inflammatory Response
  biological_scale: TISSUE
  description: >-
    Inflammation is the first phase of repair and, in Asherman syndrome,
    persists as a feature of the diseased niche rather than resolving.
    Single-cell profiling of Asherman endometrium describes a niche whose
    cell-to-cell communication and expression profiles are simultaneously
    pro-fibrotic, pro-inflammatory and anti-angiogenic — the last of these
    matters because it works against the revascularization a regenerative repair
    would require.
  conforms_to: fibrotic_response#Inflammatory Recruitment and Amplification

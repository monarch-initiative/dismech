  - reference: PMID:21437822
    reference_title: "Asherman's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to abnormal menses, infertility and recurrent spontaneous
      abortion are common complaints.
    explanation: >-
      Second, independent source describing infertility as a common presenting

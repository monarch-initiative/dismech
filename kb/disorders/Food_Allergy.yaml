environmental:
- name: Early oral introduction of allergenic food
  exposure_term:
    preferred_term: early oral exposure to food allergen in infancy
    term:
      id: ECTO:0000726
      label: exposure to allergen
  effect: PROTECTS_AGAINST
  description: >-
    Introducing an allergenic food by mouth during infancy, rather than
    delaying it, engages oral tolerance and prevents allergy. In LEAP the
    protection persisted to age 12, and a pooled LEAP+EAT analysis showed a 75%
    reduction in peanut allergy; the benefit shrinks the later introduction is
    delayed, which is the opposite of the predisposing exposure on the skin arm
    below.
  influences_mechanisms:
  - target: Failure of Oral Tolerance Induction
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Early oral exposure drives the peripheral-tolerance programme for the
      food protein, so this node's failure is averted rather than triggered.
    evidence:
    - reference: PMID:38804779
      reference_title: Follow-up to Adolescence after Early Peanut Introduction for Allergy Prevention.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "peanut allergy remained significantly more prevalent in participants in the original peanut avoidance group than in the original peanut consumption group"
      explanation: >-
        LEAP follow-up to age 12: oral peanut from infancy roughly a third of
        the allergy rate of avoidance, supporting oral exposure acting on the
        tolerance node.
  evidence:
  - reference: PMID:36435990
    reference_title: "Early introduction of peanut reduces peanut allergy across risk groups in pooled and causal inference analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An intention-to-treat (ITT) analysis of pooled data showed a 75% reduction in PA (p < .0001) among children randomized to consume peanut from early infancy."
    explanation: Pooled LEAP+EAT randomised data quantifying the protective effect of early oral introduction.
  - reference: PMID:36521802
    reference_title: Defining the window of opportunity and target populations to prevent peanut allergy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The preventive benefit of early introduction of peanut products into the diet decreases as age at introduction increases."
    explanation: Establishes the age-dependent window over which the protective effect operates.
- name: Cutaneous allergen exposure through an impaired skin barrier
  exposure_term:
    preferred_term: cutaneous exposure to food allergen through inflamed or barrier-impaired skin
    term:
      id: ECTO:0000726
      label: exposure to allergen
  effect: PREDISPOSES
  description: >-
    The dual-allergen-exposure hypothesis holds that encountering a food
    allergen across inflamed or barrier-impaired skin (as in atopic dermatitis)
    primes sensitisation, while the same allergen taken orally promotes
    tolerance. The outcome is context-dependent: healthy skin promotes
    tolerance, and only about a third of children with atopic dermatitis go on
    to a food allergy, so this is a predisposing route rather than a sufficient
    cause.
  influences_mechanisms:
  - target: Type 2 Immune Reprogramming
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cutaneous exposure on inflamed skin routes the allergen-specific response
      toward type 2 priming instead of tolerance, predisposing to the
      reprogramming node.
    evidence:
    - reference: PMID:38740132
      reference_title: The riddle of response to cutaneous allergen exposure in patients with atopic dermatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The dual allergen exposure hypothesis posits that sensitization to food allergens may occur with cutaneous exposure on inflamed skin, eg, atopic dermatitis, but early oral consumption generally leads to tolerance."
      explanation: States the cutaneous-sensitisation versus oral-tolerance contrast this link encodes.
  evidence:
  - reference: PMID:41967460
    reference_title: Food allergy prevention by early introduction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The dual-allergen exposure hypothesis suggests that impaired skin barrier exposure leads to sensitization, whereas early oral intake induces tolerance."
    explanation: Review statement of the dual-allergen-exposure hypothesis grounding this exposure.
diagnosis:
- name: Skin prick testing
  description: >-
    A skin prick test detects IgE sensitisation to a food. It is sensitive but
    not specific: a positive result identifies sensitisation, which is common
    and frequently clinically irrelevant, so it supports rather than makes the
    diagnosis.
  diagnosis_term:
    preferred_term: skin prick test
    term:
      id: NCIT:C85396
      label: Skin Prick Test
  evidence:
  - reference: PMID:42358594
    reference_title: "Innovative diagnostic techniques and their clinical implications in food allergy: current clinical practice and future perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, SPT and sIgE are highly sensitive but lack specificity, frequently identifying clinically irrelevant sensitization"
    explanation: Review characterising the sensitivity-without-specificity limitation of skin prick testing.
- name: Serum allergen-specific IgE measurement
  description: >-
    Measurement of serum IgE specific to a food allergen. Like the skin prick
    test it reports sensitisation, not clinical allergy, and shares the same
    specificity limitation.
  diagnosis_term:
    preferred_term: serum allergen-specific IgE measurement
    term:
      id: NCIT:C81970
      label: Immunoglobulin E Measurement
  evidence:
  - reference: PMID:42358594
    reference_title: "Innovative diagnostic techniques and their clinical implications in food allergy: current clinical practice and future perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current diagnostic approaches rely on clinical history, skin prick tests (SPT), measurement of serum allergen-specific IgE (sIgE), and oral food challenges (OFC)."
    explanation: Names serum allergen-specific IgE among the standard diagnostic approaches.
- name: Oral food challenge
  description: >-
    Supervised graded ingestion of the suspected food, the diagnostic gold
    standard. It is resource-demanding and carries a real risk of a systemic
    reaction, which is why it is reserved for cases the sensitisation tests
    leave unresolved.
  diagnosis_term:
    preferred_term: oral food challenge
  notes: >-
    No NCIT term is bound. OLS NCIT searches for "Oral Food Challenge" and
    "food challenge" returned no clinical-intervention term for the procedure,
    so the identity is carried in preferred_term rather than a manufactured
    binding.
  evidence:
  - reference: PMID:42358594
    reference_title: "Innovative diagnostic techniques and their clinical implications in food allergy: current clinical practice and future perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "OFC remains the diagnostic gold standard despite being resource-demanding and carrying a substantial risk of systemic reactions"
    explanation: Establishes the oral food challenge as the diagnostic gold standard and its risk.
- name: Serum tryptase measurement
  description: >-
    Serum tryptase rises after mast-cell degranulation and is the laboratory
    marker used to confirm an anaphylactic event and to flag an underlying mast
    cell disorder. It reads out the degranulation node rather than diagnosing
    the sensitisation.
  diagnosis_term:
    preferred_term: serum tryptase measurement
    term:
      id: NCIT:C92292
      label: Tryptase Measurement
  evidence:
  - reference: PMID:38108678
    reference_title: "Anaphylaxis: A 2023 practice parameter update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Measurement of serum tryptase is important for diagnosis of anaphylaxis and to identify underlying mast cell disorders."
    explanation: Practice-parameter statement that serum tryptase supports the diagnosis of anaphylaxis.
treatments:
- name: Culprit Allergen Avoidance
  description: >-
    Strict dietary exclusion of the identified allergen. This remains the
    cornerstone of management and the only intervention that prevents reactions
    rather than treating them.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: allergen elimination diet
    term:
      id: NCIT:C219792
      label: Allergen Elimination Diet
  target_mechanisms:
  - target: Dietary Protein Allergen Exposure
    description: >-
      Avoidance acts at the exposure node, removing the antigen that would
      otherwise reach armed effector cells.
  evidence:
  - reference: PMID:38349368
    reference_title: Management of Food Allergies and Food-Related Anaphylaxis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cornerstone of IgE-food allergy management is avoidance of the culprit food allergen."
    explanation: States allergen avoidance as the cornerstone of management.
- name: Epinephrine
  description: >-
    Prompt intramuscular epinephrine, usually by self-injectable autoinjector,
    is the first-line treatment for food-related anaphylaxis. It does not act on
    the allergic mechanism upstream of degranulation; it opposes the systemic
    consequences of mediator release through alpha-1-mediated vasoconstriction
    and beta-2-mediated bronchodilation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epinephrine
      term:
        id: CHEBI:33568
        label: adrenaline
  target_mechanisms:
  - target: Hypotension
    description: >-
      Alpha-1 adrenergic vasoconstriction reverses the vasodilatation and
      capillary leak produced by systemic mediator release.
  - target: Wheezing
    description: Beta-2 adrenergic bronchodilation opposes mediator-driven bronchospasm.
  evidence:
  - reference: PMID:38349368
    reference_title: Management of Food Allergies and Food-Related Anaphylaxis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Self-injectable epinephrine is the first-line treatment for food-related anaphylaxis."
    explanation: Establishes epinephrine as first-line treatment for food-related anaphylaxis.
- name: Peanut Oral Immunotherapy (AR101)
  description: >-
    Escalating-dose oral immunotherapy with a characterised peanut protein
    product, FDA-approved for peanut allergy. It raises the dose tolerated at
    challenge and reduces symptom severity on exposure, but it is an adjunct to
    avoidance and epinephrine rather than a replacement: it desensitises rather
    than curing, and patients continue to carry epinephrine.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: oral immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  notes: >-
    No therapeutic_agent is bound. The characterised drug product is defatted
    peanut flour (AR101 / Palforzia); OLS NCIT searches for "Peanut Allergen
    Powder", "AR101", "Palforzia" and "defatted peanut flour" returned no
    pharmacologic-substance term, and NCIT:C189453 Arachis hypogaea Antigen
    sits under Allergen/Antigen rather than NCIT:C1909 Pharmacologic Substance,
    so it is outside the ChemicalEntityTerm enum and cannot occupy that slot.
  target_mechanisms:
  - target: Multivalent FcepsilonRI Crosslinking
    description: >-
      Desensitisation raises the allergen dose required to produce a reaction,
      acting on the threshold at which effector crosslinking becomes clinically
      significant.
  evidence:
  - reference: PMID:30449234
    reference_title: AR101 Oral Immunotherapy for Peanut Allergy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AR101 resulted in higher doses of peanut protein that could be ingested without dose-limiting symptoms and in lower symptom severity during peanut exposure at the exit food challenge than placebo."
    explanation: >-
      Phase 3 randomised trial result establishing the desensitising effect and
      its limits.
- name: Omalizumab
  description: >-
    Omalizumab is an anti-IgE monoclonal antibody, FDA-approved for reducing
    allergic reactions to foods in patients with one or more food allergies. It
    sequesters free IgE so that less is available to arm FcepsilonRI on mast
    cells and basophils, raising the reaction threshold across multiple foods at
    once. Like oral immunotherapy it raises the threshold rather than curing,
    and patients continue to avoid the culprit foods and carry epinephrine.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omalizumab
      term:
        id: NCIT:C29299
        label: Omalizumab
  target_mechanisms:
  - target: IgE Class Switching and FcepsilonRI Arming
    description: >-
      By binding free IgE, omalizumab lowers the pool available to arm
      FcepsilonRI, acting on the arming step upstream of crosslinking.
  evidence:
  - reference: PMID:38407394
    reference_title: Omalizumab for the Treatment of Multiple Food Allergies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 79 of the 118 participants (67%) receiving omalizumab met the primary end-point criteria, as compared with 4 of the 59 participants (7%) receiving placebo (P<0.001)."
    explanation: >-
      OUtMATCH phase 3 randomised result: omalizumab monotherapy raised the
      peanut reaction threshold far more than placebo, the trial behind the FDA
      approval.

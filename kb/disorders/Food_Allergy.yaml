name: Food Allergy
creation_date: '2026-10-23T00:00:00Z'
category: Complex
parents:
- Allergic Disease
- Immune-Mediated Disease
description: >-
  Food allergy is an adverse immune response to dietary antigens that is
  reproducible on re-exposure and distinct from food intolerance. The dominant
  form is IgE-mediated (type I) hypersensitivity to food proteins, in which
  failure of the default oral tolerance response to an ingested protein permits
  type 2 immune priming, allergen-specific IgE production, and arming of tissue
  mast cells and circulating basophils through the high-affinity IgE receptor
  FcepsilonRI. On re-exposure, multivalent allergen crosslinks receptor-bound
  IgE, aggregating FcepsilonRI and triggering degranulation with release of
  preformed and newly synthesised mediators that produce urticaria, angioedema,
  vomiting, bronchospasm, and in severe cases anaphylaxis. The characterised
  allergens of this form of disease are proteins, and their biochemical
  properties -- notably oligomeric assembly, which sets the number and spacing
  of IgE epitopes presented on one particle -- contribute to both sensitisation
  and effector potency. Management rests on avoidance of the culprit allergen
  and prompt epinephrine for systemic reactions.
synonyms:
- allergic disease from food material
- allergy of food material
- food material allergic disease
- IgE-mediated food allergy
- food hypersensitivity
disease_term:
  preferred_term: food allergy
  term:
    id: MONDO:0700226
    label: food allergy
notes: >-
  This entry is scoped to IgE-mediated allergy to food *proteins*. Alpha-gal
  syndrome is deliberately excluded and left for a separate entry: its
  sensitising epitope is a carbohydrate (galactose-alpha-1,3-galactose) rather
  than a protein, IgE is raised by tick bite rather than by ingestion, and the
  reaction is delayed rather than immediate. Writing a universal claim that all
  food allergens are proteins would be false for that entity, so the scope is
  stated here instead.

  The disease_term MONDO:0700226 is broader than the curated scope. Food
  allergy also covers non-IgE-mediated forms (food protein-induced
  enterocolitis syndrome, food protein-induced allergic proctocolitis) and the
  mixed form eosinophilic esophagitis. Those lack the IgE and mast-cell
  crosslinking steps modelled here and are curated as their own entries, so
  this entry anchors to the general term without modelling them.

pathophysiology:
- name: Dietary Protein Allergen Exposure
  biological_scale: ORGANISM
  description: >-
    Ingestion of an intact or partially digested food protein presents that
    protein to the gut mucosal immune system. A small number of foods account
    for the great majority of IgE-mediated disease, which is one reason allergen
    identity rather than diet composition in general is the exposure that
    matters.
  downstream:
  - target: Oligomeric Allergen Epitope Display
    description: >-
      The ingested protein reaches the mucosa as an assembled particle, so its
      native quaternary structure determines how many IgE epitopes are presented
      together.
  evidence:
  - reference: PMID:38349368
    reference_title: Management of Food Allergies and Food-Related Anaphylaxis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the US, 9 foods account for more than 90% of IgE-mediated food allergies-crustacean shellfish, dairy, peanut, tree nuts, fin fish, egg, wheat, soy, and sesame."
    explanation: Establishes that a small set of food proteins dominates IgE-mediated food allergy.
- name: Oligomeric Allergen Epitope Display
  biological_scale: MOLECULAR
  description: >-
    Many major food allergens are not monomers. Native Ara h 1, the peanut 7S
    vicilin, assembles into higher-order homo-oligomers (nonamer or decamer),
    and a truncated 54 kDa isoform lacking the N-terminal domain is instead
    exclusively trimeric -- which localises the higher-order oligomerisation
    interface to that N-terminal domain. The cow's milk whey lipocalin
    beta-lactoglobulin (Bos d 5) likewise associates into dimers in solution.
    Because oligomerisation multiplies the copies of an epitope carried on one
    particle, this quaternary structure sets the valency available for
    downstream FcepsilonRI crosslinking, and the oligomerisation interface is
    therefore a structural determinant of effector potency rather than an
    incidental biophysical property. The epitopes must also be *accessible*: in
    beta-lactoglobulin, occupancy of the lipocalin ligand pocket is predicted to
    mask major IgE and T-cell epitopes, so the same protein displays different
    epitope surfaces in its ligand-free and ligand-loaded states.
  molecular_functions: []
  biological_processes:
  - preferred_term: allergen homo-oligomerisation
    term:
      id: GO:0051260
      label: protein homooligomerization
  downstream:
  - target: Failure of Oral Tolerance Induction
    description: >-
      Ligand-free beta-lactoglobulin presents unmasked IgE and T-cell epitopes
      and behaves as an allergen, whereas the ligand-loaded form supports a
      tolerogenic outcome.
  - target: Multivalent FcepsilonRI Crosslinking
    description: >-
      An oligomeric allergen presents two or more spatially arranged IgE
      epitopes on one particle, which is the minimum requirement for
      productive receptor crosslinking.
  evidence:
  - reference: PMID:33439436
    reference_title: "Purification and molecular characterization of a truncated-type Ara h 1, a major peanut allergen: oligomer structure, antigenicity, and glycoform."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "We found that 63 kDa Ara h 1 occurs as higher order homo-oligomeric conformations such as decamer or nonamer, while 54 kDa Ara h 1 occurs exclusively as a homotrimer, indicating that the N-terminal domain of the 63 kDa molecule may be involved in higher order oligomerization."
    explanation: >-
      Establishes both the oligomeric state of a major peanut allergen and the
      location of the interface driving higher-order assembly, by contrasting
      the full-length protein with an N-terminally truncated isoform.
  - reference: PMID:30923869
    reference_title: "β-Lactoglobulin associative interactions: a small-angle scattering study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "it was shown that β-lg forms dimeric structures in 50 mM HEPES buffer under various conditions of the medium"
    explanation: >-
      Small-angle scattering evidence that beta-lactoglobulin self-associates
      into dimers, giving a second, non-legume example of an oligomeric food
      allergen.
  - reference: PMID:32485264
    reference_title: "Cow's milk protein β-lactoglobulin confers resilience against allergy by targeting complexed iron into immune cells."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Modeling predicted masking of major IgE and T-cell epitopes of BLG by ligand binding."
    explanation: >-
      Docking and modelling result predicting that ligand occupancy of the
      beta-lactoglobulin pocket occludes its major IgE and T-cell epitopes, so
      epitope accessibility is state-dependent. Graded COMPUTATIONAL and
      INDIRECT because the quoted claim is a prediction; the experimental
      confirmation is cited separately on the tolerance node.
- name: Failure of Oral Tolerance Induction
  biological_scale: CELLULAR
  description: >-
    The default response to a dietary protein is peripheral tolerance, in which
    a specialised RORgt- and PRDM16-dependent lineage of intestinal
    antigen-presenting cells drives antigen-specific peripherally induced
    regulatory T cells. Food allergy begins when this programme is not engaged
    for a given protein and the response is instead primed toward type 2
    immunity. The beta-lactoglobulin ligand-state experiments show that the same
    protein can take either route: loaded holo-beta-lactoglobulin prevented
    sensitisation while sustaining regulatory T cells, whereas the ligand-free
    apo form acted as an allergen -- a demonstration that tolerance versus
    sensitisation can be decided by the allergen's own loading state rather than
    by its sequence.
  cell_types:
  - preferred_term: tolerogenic intestinal antigen-presenting cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  - preferred_term: peripherally induced regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: oral tolerance induction to dietary protein
    modifier: DECREASED
    term:
      id: GO:0002507
      label: tolerance induction
  downstream:
  - target: Type 2 Immune Reprogramming
    description: >-
      With the tolerogenic programme not engaged, the allergen-specific response
      is primed toward type 2 immunity instead.
  evidence:
  - reference: PMID:41328802
    reference_title: Specialized Dendritic Cells Mediating Peripheral Tolerance to Intestinal Antigens.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent studies have revealed that intestinal antigen-specific pTreg cell differentiation is induced by a distinct lineage of antigen-presenting cells (APCs) requiring expression of the transcription factors RORγt and PRDM16."
    explanation: >-
      Identifies the antigen-presenting cell lineage and transcription factors
      required for peripheral tolerance to dietary antigens, which is the
      programme whose failure this node describes. Graded OTHER with
      REVIEW_SYNTHESIS because the quoted sentence is a review's synthesis of
      work it did not perform.
  - reference: PMID:32485264
    reference_title: "Cow's milk protein β-lactoglobulin confers resilience against allergy by targeting complexed iron into immune cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "In mice, only treatments with holoBLG prevented allergic sensitization and anaphylaxis, while sustaining regulatory T cells."
    explanation: >-
      In vivo demonstration that the ligand-loaded state of beta-lactoglobulin
      prevents sensitisation and maintains regulatory T cells, supporting the
      tolerance arm of this node.
  - reference: PMID:32485264
    reference_title: "Cow's milk protein β-lactoglobulin confers resilience against allergy by targeting complexed iron into immune cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our data provide a mechanistic explanation why the same proteins can act either as tolerogens or as allergens."
    explanation: >-
      The authors' own statement of the general principle this node encodes:
      tolerance versus sensitisation is not fixed by the protein's identity
      alone.
- name: Type 2 Immune Reprogramming
  biological_scale: CELLULAR
  description: >-
    The allergen-specific CD4 T cell response is redirected toward a T-helper 2
    programme, with group 2 innate lymphoid cells contributing innate type 2
    cytokine production. IL-4 and IL-13 from this compartment are the signals
    that license the B cell switch to IgE, making this the step at which a
    tolerogenic response is converted into a sensitising one.
  cell_types:
  - preferred_term: allergen-specific T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  - preferred_term: group 2 innate lymphoid cell
    term:
      id: CL:0001069
      label: group 2 innate lymphoid cell
  biological_processes:
  - preferred_term: type 2 immune response to dietary allergen
    modifier: INCREASED
    term:
      id: GO:0042092
      label: type 2 immune response
  - preferred_term: T-helper 2 cell differentiation
    modifier: INCREASED
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
  downstream:
  - target: IgE Class Switching and FcepsilonRI Arming
    description: >-
      Type 2 cytokines, principally IL-4 and IL-13, drive the immunoglobulin
      heavy-chain switch to IgE in allergen-specific B cells.
- name: IgE Class Switching and FcepsilonRI Arming
  biological_scale: MOLECULAR
  description: >-
    Allergen-specific B cells switch to the IgE isotype and differentiate into
    IgE-secreting plasma cells. Secreted IgE binds the high-affinity receptor
    FcepsilonRI on tissue mast cells and circulating basophils, arming them for
    an allergen-specific response. Sensitisation is clinically silent at this
    point; the disease becomes manifest only on re-exposure, which is why
    anaphylaxis is not expected on a genuinely first exposure.
  cell_types:
  - preferred_term: IgE-secreting plasma cell
    term:
      id: CL:0000947
      label: IgE plasma cell
  biological_processes:
  - preferred_term: isotype switching to IgE
    modifier: INCREASED
    term:
      id: GO:0048289
      label: isotype switching to IgE isotypes
  downstream:
  - target: Multivalent FcepsilonRI Crosslinking
    description: >-
      Receptor-bound allergen-specific IgE is the substrate that an incoming
      multivalent allergen crosslinks.
  evidence:
  - reference: PMID:41715900
    reference_title: Mechanisms of IgE-mediated food allergy and the role of allergen-specific B cells.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CD4+ cells, especially Tfh, play a fundamental role in the sequential class switching of memory B cells in germinal centers to convert them into IgE‐producing cells."
    explanation: >-
      Supports the dependence of the IgE class switch on CD4 T cell help,
      linking the type 2 node upstream to IgE production at this node. Graded
      OTHER with REVIEW_SYNTHESIS because the quoted sentence is a review's
      synthesis rather than its own experimental result.
  - reference: PMID:41715900
    reference_title: Mechanisms of IgE-mediated food allergy and the role of allergen-specific B cells.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Chronic allergen exposure promotes the accumulation of long‐lived IgE plasma cells in the bone marrow, thereby sustaining enduring serological memory and contributing to the persistence of allergic disease"
    explanation: >-
      Accounts for why sensitisation persists once established, which is the
      reason avoidance rather than clearance of IgE is the mainstay of
      management.
- name: Multivalent FcepsilonRI Crosslinking
  biological_scale: MOLECULAR
  description: >-
    An allergen bearing two or more IgE epitopes bridges adjacent IgE-FcepsilonRI
    complexes, and the resulting receptor aggregate initiates signalling. Valency
    and epitope spacing are not merely permissive: tetravalent antigen produces
    larger, more complex aggregates and stronger responses than bivalent antigen,
    can signal at low IgE occupancy, and the geometry of the aggregate determines
    signalling efficiency. This is the step at which the oligomeric state of the
    allergen is converted into a quantitative difference in effector output.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: basophil
    term:
      id: CL:0000767
      label: basophil
  biological_processes:
  - preferred_term: Fc-epsilon receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038095
      label: Fc-epsilon receptor signaling pathway
  downstream:
  - target: Mast Cell and Basophil Degranulation
    description: >-
      Aggregated FcepsilonRI signals through Lyn and Syk to calcium mobilisation
      and granule exocytosis, with aggregate geometry setting the efficiency of
      that coupling.
  evidence:
  - reference: PMID:42589421
    reference_title: IgE Occupancy and Antigen Valency Cooperate to Control FcεRI Aggregation Geometry and Signaling Efficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Thus, allergen valency and epitope spatial arrangement dictate FcεRI aggregate organization and subsequent effector cell activation."
    explanation: >-
      Primary conclusion that allergen valency and epitope arrangement control
      receptor aggregate organisation and effector activation. Graded INDIRECT
      because the valency series was built from a grass-pollen (Phl p 1) epitope
      grafted onto a myoglobin scaffold rather than from a food allergen, so the
      principle transfers by inference.
  - reference: PMID:42589421
    reference_title: IgE Occupancy and Antigen Valency Cooperate to Control FcεRI Aggregation Geometry and Signaling Efficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "It has been well established that at least two IgE epitopes are required on an allergen to induce effector cell degranulation, and that increases in valency trigger even stronger responses"
    explanation: >-
      States the established minimum-valency requirement that makes allergen
      oligomerisation mechanistically load-bearing. Marked BACKGROUND because the
      sentence sits in this paper's introduction and restates work it cites
      rather than its own result.
- name: Mast Cell and Basophil Degranulation
  biological_scale: CELLULAR
  description: >-
    FcepsilonRI signalling triggers calcium influx and exocytosis of preformed
    granule contents, principally histamine and tryptase, together with newly
    generated lipid mediators. This is the effector event that produces the
    clinical reaction, and it is the step whose systemic consequences epinephrine
    is given to reverse. Serum tryptase released here is also the diagnostic
    marker of an anaphylactic event.
  cell_types:
  - preferred_term: mucosal mast cell
    term:
      id: CL:0000485
      label: mucosal type mast cell
  - preferred_term: basophil
    term:
      id: CL:0000767
      label: basophil
  biological_processes:
  - preferred_term: mast cell degranulation
    modifier: INCREASED
    term:
      id: GO:0043303
      label: mast cell degranulation
  - preferred_term: IgE-mediated histamine secretion
    modifier: INCREASED
    term:
      id: GO:0097279
      label: histamine secretion mediated by IgE immunoglobulin
  downstream:
  - target: Urticaria
    description: Histamine-driven dermal vasodilatation and wheal formation.
  - target: Angioedema
    description: Mediator-driven deep dermal and submucosal extravasation.
  - target: Vomiting
    description: Gastrointestinal mediator release on mucosal allergen contact.
  - target: Wheezing
    description: Mediator-driven bronchial smooth muscle constriction.
  - target: Hypotension
    description: >-
      Systemic mediator release causes vasodilatation and capillary leak,
      the circulatory failure of anaphylaxis.
  - target: Food-induced anaphylaxis
    description: >-
      Simultaneous multi-system mediator effects constitute the anaphylactic
      syndrome.
  evidence:
  - reference: PMID:42589421
    reference_title: IgE Occupancy and Antigen Valency Cooperate to Control FcεRI Aggregation Geometry and Signaling Efficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Tetravalent MB4N evoked stronger degranulation and Ca2+ response than bivalent antigens MB1N1C and MB2N."
    explanation: >-
      Measures degranulation and calcium response as a function of antigen
      valency, linking allergen multivalency quantitatively to this node's
      output. INDIRECT because the antigen series is a scaffold construct rather
      than a food allergen.
  - reference: PMID:32485264
    reference_title: "Cow's milk protein β-lactoglobulin confers resilience against allergy by targeting complexed iron into immune cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In line with this modeling, IgE binding in children allergic to milk was reduced toward holoBLG, which also impaired degranulation of mast cells."
    explanation: >-
      Shows with sera from milk-allergic children that reducing accessible IgE
      epitopes on beta-lactoglobulin reduces IgE binding and impairs mast cell
      degranulation, connecting epitope display to this effector node in human
      material.
phenotypes:
- name: Food-induced anaphylaxis
  category: Systemic
  description: >-
    Acute multi-system reaction after ingestion of the culprit food, which may
    include airway compromise and circulatory collapse and is the cause of the
    rare fatalities in this disease.
  phenotype_term:
    preferred_term: Food-induced anaphylaxis
    term:
      id: HP:0500095
      label: Food-induced anaphylaxis
    temporality: ACUTE
  evidence:
  - reference: PMID:38349368
    reference_title: Management of Food Allergies and Food-Related Anaphylaxis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgE-mediated food allergies may cause anaphylaxis and death."
    explanation: Establishes anaphylaxis and death as outcomes of IgE-mediated food allergy.
- name: Urticaria
  category: Dermatologic
  description: Pruritic wheals following allergen ingestion.
  phenotype_term:
    preferred_term: Urticaria
    term:
      id: HP:0001025
      label: Urticaria
    temporality: ACUTE

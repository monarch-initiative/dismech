- name: Infantile Mitochondrial Myopathy
  description: 'In the symptomatic phase, bioenergetic failure in skeletal muscle produces a profound infantile myopathy with hypotonia, feeding difficulties, and lactic acidosis presenting within the first months of life, frequently requiring respiratory support. Muscle histopathology shows ragged-red and COX-negative fibres with increased lipid and/or glycogen. Clinical involvement is largely confined to skeletal muscle, although basal ganglia lesions have been reported in a subset.

    '

    description: Impaired mitochondrial translation reduces synthesis of mtDNA-encoded respiratory chain subunits, producing a Complex IV-predominant respiratory chain deficiency.
- name: Respiratory Chain (Complex IV) Deficiency in Skeletal Muscle
  description: 'The mitochondrial translation defect lowers production of mtDNA-encoded cytochrome c oxidase subunits, producing a respiratory chain deficiency that affects predominantly Complex IV and variably Complexes I and III in skeletal muscle and patient-derived cybrids. The deficiency is tissue- and differentiation-dependent: it is seen in mature muscle and cybrids but not in naive myoblasts, indicating that nuclear-encoded factors can compensate.

    '

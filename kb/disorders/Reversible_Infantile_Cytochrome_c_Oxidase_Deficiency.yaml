    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homoplasmic maternally inherited, m.14674T>C or m. 14674T>G mt-tRNA(Glu) mutations have recently been identified in reversible infantile cytochrome c oxidase deficiency (or 'benign COX deficiency').
    explanation: 'States both claims this block makes for the causal MT-TE variants: that they are maternally inherited, and that they are homoplasmic rather than heteroplasmic.'

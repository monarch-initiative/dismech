prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. Two independent counts a year apart agree: the 2025 Turkish report put the
    cumulative total at ten patients, and the 2026 Saudi report independently states that
    only ten cases had been published before its own. No population-based estimate exists
    and none is asserted here, so the published case count is the meaningful figure and no
    numeric rate is given. Ancestry is scattered rather than clustered - non-Finnish
    European, Syrian, Indian, Turkish, Ashkenazi Jewish and Saudi patients have been
    reported - although two of the alleles in the Muir series are enriched in the
    Ashkenazi Jewish population.
  evidence:
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identified a novel truncating variant in the NUP188 gene, bringing the total number of patients with Sandestig-Stefanova syndrome up to ten."
    explanation: Gives the cumulative published patient count on which the ultra-rare class asserted here rests.
  - reference: PMID:40859750
    reference_title: A Novel Homozygous Splice Variant in the NUP188 Gene Causing Sandestig-Stefanova Syndrome in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only 10 cases have been reported in the literature."
    explanation: An independent count published a year later, corroborating the order of magnitude.
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the NUP188 pathogenic variants are enriched in the Ashkenazi Jewish population in gnomAD"
    explanation: Supports the founder-allele observation recorded in the notes above.
progression:
- phase: Prenatal
  notes: >-
    Abnormalities are detectable before birth. Ventriculomegaly is prenatal in onset, and
    second-trimester ultrasound has shown growth restriction together with the cardiac and
    renal malformations. Affected pregnancies deliver small for gestational age.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Key clinical features include congenital cataracts, hypotonia, prenatal-onset ventriculomegaly, white-matter abnormalities, hypoplastic corpus callosum, congenital heart defects, and central hypoventilation."
    explanation: States that the ventriculomegaly is prenatal in onset.
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal ultrasound at 23 weeks of gestation revealed intrauterine growth restriction, tetralogy of Fallot (ToF), mild ventriculomegaly, a right pelvic kidney, hyperechogenic bowel (grade III), and an echogenic intracardiac focus in the left ventricle."
    explanation: Documents what second-trimester ultrasound showed in a molecularly confirmed case.
- phase: Neonatal
  notes: >-
    Infants are born small for gestational age and present at once with hypotonia,
    respiratory distress and the dysmorphic gestalt. Congenital cataract and the cardiac
    lesion are usually identified in this window.
  evidence:
  - reference: PMID:32021605
    reference_title: "NUP188 Biallelic Loss of Function May Underlie a New Syndrome: Nucleoporin 188 Insufficiency Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were both born small for gestational age and died shortly after birth at the age of 67 and 140 days, respectively, as a result of central respiratory failure."
    explanation: Establishes small-for-gestational-age birth and the neonatal-to-early-infantile course.
- phase: Progressive infantile encephalopathy
  notes: >-
    Development does not progress. Microcephaly is progressive, seizures appear, cerebral
    atrophy develops, and oral feeding is lost so that tube feeding becomes necessary.
    Patients do not achieve sitting or walking.
  evidence:
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generalized hypotonia, progressive microcephaly, seizures, cerebral atrophy, thin corpus callosum, and central hypoventilation are the most important CNS findings."
    explanation: Names the progressive central nervous system course of the disorder.
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic functions are progressive neurodegenerative and patients cannot gain functions such as sitting and walking."
    explanation: States that motor milestones are never acquired.
- phase: Death from central respiratory failure
  notes: >-
    Every published patient has died of respiratory failure. Reported ages at death run
    from one month to two years and seven months, with most deaths in the first year. The
    respiratory failure is central rather than pulmonary: no congenital lung or tracheal
    disease has been found in these patients.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals died as a result of respiratory failure, and five of them died within the first year of life."
    explanation: Establishes the uniform cause of death and the age distribution in the largest series.
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients die in the early period due to respiratory failure secondary to CNS anomalies. No signs of congenital pulmonary or tracheal disease were detected in the identified patients."
    explanation: States that the terminal respiratory failure is of central rather than pulmonary origin.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Uniformly fatal in infancy or early childhood, with no disease-modifying therapy. Every
    published patient has died of central respiratory failure; developmental progress does
    not occur, and management is entirely supportive - ventilatory support, tube feeding,
    anticonvulsants, cataract surgery, shunting - directed at individual manifestations
    rather than at the disease.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals died as a result of respiratory failure, and five of them died within the first year of life."
    explanation: Establishes the mortality that drives the HIGH burden assignment.
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic functions are progressive neurodegenerative and patients cannot gain functions such as sitting and walking."
    explanation: Establishes the functional impact component of the burden assessment.
mechanistic_hypotheses:
- hypothesis_group_id: nuclear_import_deficiency_model
  hypothesis_label: Reduced Nucleocytoplasmic Protein Import Model
  status: CANONICAL
  description: >-
    The mainstream account: NUP188 is a scaffold subunit of the NUP93 subcomplex that builds
    the nuclear pore complex inner ring, and its loss degrades nucleocytoplasmic transport,
    starving developing tissues of the nuclear delivery of regulatory proteins. This is the
    only arm with a direct measurement in patient material - nuclear protein import was
    reduced in fibroblasts from affected individuals - and the authors of that measurement
    state it as a possible rather than an established mechanism.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nuclear import of proteins was decreased in affected individuals' fibroblasts, supporting a possible disease mechanism."
    explanation: The direct patient-cell measurement on which this model rests, stated by its authors with the hedge they used.
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "NUP188 is part of the NUP93 subcomplex, the second major structural unit of the NPC, which controls the passage of membrane or transmembrane proteins through NPC"
    explanation: States the structural position of NUP188 in the pore that makes a transport deficit the expected consequence of losing it.
- hypothesis_group_id: ciliary_nup188_model
  hypothesis_label: Ciliary and Moonlighting-Function Model
  status: EMERGING
  description: >-
    An alternative or additional route in which the disease-relevant lesion is not at the
    nuclear pore at all. NUP188 localises to the cilium base, and morpholino depletion in
    Xenopus abolishes cilia while leaving nuclear pore function largely intact - so a
    ciliary deficit can be produced by loss of NUP188 without a transport deficit. The
    clinical features that motivate this arm are the congenital heart disease, the
    hydrocephalus, and the heterotaxy-like findings reported in some patients. It is
    EMERGING rather than CANONICAL because no patient cell or tissue has been assayed for
    ciliation: the supporting work is amphibian and cell-line depletion, and a NUP188
    duplication rather than the biallelic loss-of-function alleles that cause this disease.
  evidence:
  - reference: PMID:27593162
    reference_title: Congenital Heart Disease Genetics Uncovers Context-Dependent Organization and Function of Nucleoporins at Cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that knockdown of Nup188 or its binding partner Nup93 leads to a loss of cilia during embryonic development while leaving NPC function largely intact."
    explanation: Demonstrates that losing Nup188 can produce a ciliary phenotype without a nuclear-transport phenotype, which is what makes this a distinct model rather than a downstream consequence of the canonical one.
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Cilia dysfunction contributes to various ciliopathies including hydrocephalus, polycystic kidney disease, retinal dystrophy, and congenital heart disease."
    explanation: States the clinical link this model proposes between a ciliary lesion and the hydrocephalus and heart disease seen in these patients.
pathophysiology:
- name: Biallelic NUP188 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic truncating variants in NUP188 - homozygous nonsense in consanguineous
    kindreds, compound heterozygous elsewhere. Every reported disease allele is predicted to
    truncate: nonsense, frameshift, and a canonical splice-acceptor variant. No missense
    allele has been shown to cause the syndrome, so this is a loss-of-function mechanism
    rather than a dominant-negative or gain-of-function one.
  genes:
  - preferred_term: NUP188
    term:
      id: hgnc:17859
      label: NUP188
  genetic_context:
    description: >-
      Biallelic germline truncating NUP188 variants. A premature termination codon early in
      the 44-exon transcript is expected to trigger nonsense-mediated decay, and a
      splice-acceptor allele produced no detectable RT-PCR amplification in the proband.
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:32021605
    reference_title: "NUP188 Biallelic Loss of Function May Underlie a New Syndrome: Nucleoporin 188 Insufficiency Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we report 2 unrelated patients with 2 different homozygous nonsense gene variants of NUP188, p.Tyr96* and p.Gln113*, respectively."
    explanation: The first report of biallelic NUP188 nonsense variants in this phenotype.
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present six affected individuals with bi-allelic truncating variants in NUP188 and strikingly similar phenotypes and clinical courses, representing a recognizable genetic syndrome; the individuals are from four unrelated families."
    explanation: The independent series establishing biallelic truncating NUP188 variants as the cause of a recognizable syndrome.
  downstream:
  - target: Absent or Truncated NUP188 Protein
    causal_link_type: DIRECT
    description: >-
      Premature termination codons either trigger nonsense-mediated decay of the transcript
      or yield a truncated product, so the cell has no functional NUP188.
    evidence:
    - reference: PMID:39911172
      reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant introduces a premature termination codon in exon 3 of 44 of NUP188, likely resulting in nonsense-mediated decay of the mRNA product."
      explanation: States the expected consequence of an early premature termination codon in this gene.
- name: Absent or Truncated NUP188 Protein
  biological_scale: MOLECULAR
  description: >-
    Protein-level consequence of the truncating alleles, established directly rather than
    inferred: immunoblot and immunofluorescence of fibroblasts from two of the reported
    individuals showed either complete loss of NUP188 or a non-functional stump. This is
    the node from which the two competing mechanistic models diverge - one through the
    nuclear pore, one through the cilium base.
  genes:
  - preferred_term: NUP188
    term:
      id: hgnc:17859
      label: NUP188
  cell_types:
  - preferred_term: patient-derived skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Immunoblot and immunofluorescence analyses of fibroblasts from individuals carrying p.Ile302Valfs*7 and p.Tyr1048Ter variants showed that these variants resulted in either complete loss of NUP188 or a non-functional stump protein product."
    explanation: >-
      Reports the protein-level result obtained in patient fibroblasts. The quote is this
      case report restating the finding of the earlier Muir series rather than its own
      experiment, hence BACKGROUND; the evidence it describes is in vitro work on human
      patient cells.
  - reference: PMID:40859750
    reference_title: A Novel Homozygous Splice Variant in the NUP188 Gene Causing Sandestig-Stefanova Syndrome in a Saudi Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-PCR analysis showed no detectable amplification in the proband, while parental samples displayed two bands, indicating carrier status."
    explanation: Independent transcript-level demonstration that a disease allele abolishes the normal NUP188 message.
  downstream:
  - target: Nuclear Pore Complex Inner-Ring Scaffold Defect
    causal_link_type: DIRECT
    hypothesis_groups:
    - nuclear_import_deficiency_model
    description: >-
      Losing NUP188 removes a scaffold subunit of the NUP93 subcomplex that builds the
      inner ring of the pore.
    evidence:
    - reference: PMID:36158057
      reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "The NUP188 gene encodes a protein involved in the NPC and controlling the passage of membrane or transmembrane proteins as part of the hNup93 subcomplex"
      explanation: States the subcomplex membership that makes this edge a direct structural consequence.
  - target: Loss of Cilia and Ciliary-Base NUP188 Function
    causal_link_type: DIRECT
    hypothesis_groups:
    - ciliary_nup188_model
    description: >-
      Under the ciliary model the same protein loss acts at the cilium base instead. This
      edge is supported by amphibian and cell-line depletion rather than by patient tissue,
      and it is asserted as a model arm, not as an established step in this disease.
    evidence:
    - reference: PMID:27593162
      reference_title: Congenital Heart Disease Genetics Uncovers Context-Dependent Organization and Function of Nucleoporins at Cilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the following, we demonstrate that depletion of Nup188 and its binding partner Nup93 leads to the loss of cilia in multiple cell types including mammalian cell lines and the LRO of Xenopus."
      explanation: Demonstrates that depleting Nup188 costs the cell its cilia, in Xenopus and in mammalian cells.
- name: Nuclear Pore Complex Inner-Ring Scaffold Defect
  biological_scale: MOLECULAR
  description: >-
    The nuclear pore complex is built from roughly thirty nucleoporins; the NUP93
    subcomplex to which NUP188 belongs forms the inner ring of its scaffold. Complete loss
    of pore function is incompatible with cell viability, so a viable disease allele
    produces a partial structural defect rather than an absent pore.
  genes:
  - preferred_term: NUP188
    term:
      id: hgnc:17859
      label: NUP188
  cellular_components:
  - preferred_term: nuclear pore inner ring
    term:
      id: GO:0044611
      label: nuclear pore inner ring
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  evidence:
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "NUP188 is part of the NUP93 subcomplex, the second major structural unit of the NPC, which controls the passage of membrane or transmembrane proteins through NPC"
    explanation: Locates NUP188 within the pore's inner-ring scaffold.
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Nucleoporins (NUPs) are an essential component of the nuclear-pore complex, which regulates nucleocytoplasmic transport of macromolecules."
    explanation: States the function of the structure this node describes as defective.
  downstream:
  - target: Reduced Nucleocytoplasmic Protein Import
    causal_link_type: DIRECT
    hypothesis_groups:
    - nuclear_import_deficiency_model
    description: >-
      A defective inner-ring scaffold degrades the pore's ability to move cargo into the
      nucleus.
    evidence:
    - reference: PMID:32275884
      reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Nuclear import of proteins was decreased in affected individuals' fibroblasts, supporting a possible disease mechanism."
      explanation: Measures the transport deficit this edge asserts, in cells from affected individuals.
- name: Reduced Nucleocytoplasmic Protein Import
  biological_scale: CELLULAR

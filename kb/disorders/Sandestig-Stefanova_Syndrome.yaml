    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - nuclear_import_deficiency_model
    description: >-
      Loss of NUP188 disrupts dendritic development. The connection to the transport deficit
      is inferential: the dendrite result comes from Drosophila knockout, not from a
      transport-rescue experiment.
    evidence:
    - reference: PMID:32275884
      reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Removal of NUP188 also resulted in aberrant dendrite tiling, suggesting a potential role of NUP188 in dendritic development."
      explanation: The observation behind the dendritic node, reported with the authors' own hedge.
  - target: Deficient Cerebral White Matter Development and Myelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

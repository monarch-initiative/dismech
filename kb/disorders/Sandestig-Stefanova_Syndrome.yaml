inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic NUP188 variants. Consanguinity is common among reported families, sibship
    recurrence has been documented, and parents are heterozygous carriers without the
    phenotype. Heterozygous carriers of the truncating alleles are unaffected, including for
    the cardiac phenotype: the parents and carrier sibling of one proband with tetralogy of
    Fallot had no detectable cardiac abnormality.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sandestig-Stefanova syndrome is an autosomal recessive developmental syndrome characterized by microcephaly, trigonocephaly, congenital cataracts, microphthalmia, facial findings, camptodactyly, periventricular white matter loss, thin corpus callosum, delayed myelination, and poor prognosis."
    explanation: States the mode of inheritance.
  - reference: PMID:39911172
    reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial segregation analysis using Sanger sequencing revealed that both the healthy brother and the parents carried this variant in a heterozygous state"
    explanation: Documents heterozygous carriage in unaffected parents and a healthy sibling, which is what recessive segregation looks like.
genetic:
- name: NUP188
  gene_term:
    preferred_term: NUP188
    term:
      id: hgnc:17859
      label: NUP188
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    NUP188 is the only gene implicated in this syndrome; no second locus has been reported.
    Every disease allele published to date is truncating - nonsense, frameshift, or a
    canonical splice-acceptor change - and no missense allele has been shown to cause the
    recessive syndrome. Heterozygous NUP188 variants have separately been reported in
    cardiovascular cohorts and in an unrelated developmental presentation, but those
    associations were not established; that is a different genetic claim from the biallelic
    loss-of-function syndrome curated here.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:39911172
      reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bi-allelic loss-of-function variants of NUP188 are associated with Sandestig-Stefanova syndrome, which is characterized by pre- and postnatal microcephaly, trigonocephaly, congenital cataracts, periventricular white matter loss, thin corpus callosum, delayed myelination, microphthalmia, camptodactyly, congenital heart disease, and central respiratory failure."
      explanation: States that the disease alleles are biallelic and loss-of-function.
  variants:
  - name: Homozygous c.287dupA p.(Tyr96Ter) and homozygous c.337C>T p.(Gln113Ter)
    description: >-
      The two alleles of the index patients: different homozygous nonsense variants in two
      unrelated girls whose phenotypes were nonetheless strikingly alike, which is what made
      the syndrome recognizable.
    evidence:
    - reference: PMID:32021605
      reference_title: "NUP188 Biallelic Loss of Function May Underlie a New Syndrome: Nucleoporin 188 Insufficiency Syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For the first time, we report 2 unrelated patients with 2 different homozygous nonsense gene variants of NUP188, p.Tyr96* and p.Gln113*, respectively."
      explanation: Names the two index alleles.
  - name: Compound heterozygous c.904_907delATTT p.(Ile302Valfs*7) and c.3144C>G p.(Tyr1048Ter)
    description: >-
      The Ashkenazi Jewish founder pair, shared by three individuals from two families. Both
      alleles are enriched in gnomAD's Ashkenazi Jewish population, and a targeted screen of
      3,225 healthy Ashkenazi Jewish individuals confirmed the enrichment.
    evidence:
    - reference: PMID:39911172
      reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Three individuals from two different families were of Ashkenazi Jewish descent, and all three individuals shared the same two variants in compound heterozygous state, c.904_907delATTT; p.(Ile302Valfs*7) and c.3144C>G; p.(Tyr1048Ter), in NUP188."
      explanation: Names the two founder alleles and the families carrying them, as itemised by the later report's review of the literature.
    - reference: PMID:32275884
      reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two of the NUP188 pathogenic variants are enriched in the Ashkenazi Jewish population in gnomAD, a finding we confirmed with a separate targeted population screen of an international sampling of 3,225 healthy Ashkenazi Jewish individuals."
      explanation: Establishes the population enrichment of these two alleles and the screen that confirmed it.
  - name: Homozygous c.1087C>T p.(Gln363Ter)
    description: >-
      The allele of the first reported male patient, from a consanguineous Turkish family;
      novel at the time of report, absent from gnomAD, ClinVar and dbSNP, and classified
      pathogenic on PVS1, PM2, PP3 and PP4.
    evidence:
    - reference: PMID:36158057
      reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our patient, a homozygous c.1087C>T (p.Gln363Ter) variant was detected in exon 11 of the NUP188 (NM_015354.3) gene."
      explanation: Names the allele and its exon.
  - name: Homozygous c.124C>T p.(Arg42Ter)
    description: >-
      An early nonsense allele in exon 3 of 44, expected to trigger nonsense-mediated decay,
      in a consanguineous Turkish family with a second similarly affected child.
    evidence:
    - reference: PMID:39911172
      reference_title: A Novel Truncating Variant in Sandestig-Stefanova Syndrome with Hydrocephalus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequence analysis in the index case revealed a novel homozygous variant NM_015354.2: c.124C>T/p.(Arg42Ter) in the NUP188 gene."
      explanation: Names the allele and how it was found.
  - name: Homozygous c.1962-2A>C splice acceptor variant
    description: >-
      A canonical splice-acceptor allele in a Saudi patient. RT-PCR gave no detectable
      product in the proband while both parents showed two bands, which is direct transcript
      evidence that the allele abolishes the normal message.
    evidence:
    - reference: PMID:40859750
      reference_title: A Novel Homozygous Splice Variant in the NUP188 Gene Causing Sandestig-Stefanova Syndrome in a Saudi Patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RT-PCR analysis showed no detectable amplification in the proband, while parental samples displayed two bands, indicating carrier status."
      explanation: Gives the transcript-level consequence of this splice allele and the parental carrier status.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, our results implicate bi-allelic loss-of-function NUP188 variants in a recessive syndrome characterized by a distinct neurologic, ophthalmologic, and facial phenotype."
    explanation: The gene-disease claim in the authors' own summary.
  - reference: PMID:32021605
    reference_title: "NUP188 Biallelic Loss of Function May Underlie a New Syndrome: Nucleoporin 188 Insufficiency Syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings strongly suggest a correlation between the homozygous nonsense gene variants of NUP188 and a severe phenotype of a new developmental syndrome with poor prognosis resulting from nucleoporin 188 homolog protein insufficiency."
    explanation: The independent gene-disease claim from the first report.
animal_models:
- name: NUP188 CRISPR knockout Drosophila
  species: Drosophila melanogaster
  genotype: CRISPR-mediated NUP188 knockout
  publication: PMID:32275884
  description: >-
    A fly knockout generated alongside the human genetics, used to ask whether removing
    NUP188 produces a neurological phenotype at all. It does - motor deficits and seizure
    susceptibility - and it also revealed aberrant dendrite tiling, which is the origin of
    the dendritic-development hypothesis for this syndrome.
  modeled_mechanisms:
  - target: Impaired Neuronal Dendrite Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Dendrite tiling is disrupted by NUP188 removal, which is the observation the node
      records.
    limitations: >-
      Drosophila dendritic arborisation neurons are not a model of human cortical or
      brainstem circuitry, and no dendritic abnormality has been demonstrated in tissue from
      an affected individual.
    evidence:
    - reference: PMID:32275884
      reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Removal of NUP188 also resulted in aberrant dendrite tiling, suggesting a potential role of NUP188 in dendritic development."
      explanation: The dendritic result that grounds this link.
  - target: Progressive Encephalopathy with Central Respiratory Control Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Motor deficits and seizure susceptibility reproduce part of the human neurological
      picture, and the authors describe the recapitulation as partial.
    limitations: >-
      The fly has no counterpart of the brainstem respiratory control whose failure kills
      these infants, and no counterpart of the progressive microcephaly, white-matter loss,
      or corpus callosum hypoplasia. The model speaks to neuronal excitability and motor
      output, not to the fatal element of the syndrome.
    evidence:
    - reference: PMID:32275884
      reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CRISPR-mediated knockout of NUP188 in Drosophila revealed motor deficits and seizure susceptibility, partially recapitulating the neurological phenotype seen in affected individuals."
      explanation: States both the recapitulation and its partiality, in the authors' own words.
- name: Xenopus Nup188 morpholino knockdown
  species: Xenopus
  genotype: Nup188 morpholino knockdown
  publication: PMID:27593162
  description: >-
    Morpholino depletion of Nup188 in Xenopus, used to test whether a nucleoporin can cause
    congenital heart disease through cilia rather than through nuclear transport. Cilia are
    lost at the left-right organizer and in mammalian cell lines while nuclear pore function
    stays largely intact - which is what makes the ciliary model a distinct proposal rather
    than a downstream consequence of a transport deficit.
  modeled_mechanisms:
  - target: Loss of Cilia and Ciliary-Base NUP188 Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model is the source of this node: it shows that depleting Nup188 costs cells their
      cilia.
    limitations: >-
      Morpholino knockdown is a partial, transient depletion rather than the biallelic
      germline truncation that causes the human syndrome, and the human genetic observation
      that motivated the work was a NUP188 duplication in a heterotaxy patient, not a
      loss-of-function allele. No patient with this syndrome has had ciliation assayed.
    evidence:
    - reference: PMID:27593162
      reference_title: Congenital Heart Disease Genetics Uncovers Context-Dependent Organization and Function of Nucleoporins at Cilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that knockdown of Nup188 or its binding partner Nup93 leads to a loss of cilia during embryonic development while leaving NPC function largely intact."
      explanation: The primary result grounding this link.

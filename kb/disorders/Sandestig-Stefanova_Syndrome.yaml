name: Sandestig-Stefanova Syndrome
category: Mendelian
creation_date: '2026-09-18T00:00:00Z'
synonyms:
- SANDSTEF
- Nucleoporin 188 insufficiency syndrome
- NUP188-related syndrome
- Bi-allelic NUP188 loss-of-function syndrome
description: >-
  Sandestig-Stefanova syndrome is an autosomal recessive, prenatal-onset multisystem
  developmental disorder caused by biallelic loss-of-function variants in NUP188, which
  encodes a scaffold component of the nuclear pore complex inner ring. The recognizable
  picture is pre- and postnatal microcephaly with trigonocephaly, congenital bilateral
  cataract and microphthalmia, congenital heart disease, camptodactyly and rocker-bottom
  feet, and a distinctive facial gestalt, on a background of prenatal-onset
  ventriculomegaly, loss of periventricular white matter, a thin corpus callosum and
  delayed myelination. Infants are hypotonic from birth, do not acquire motor milestones,
  develop central hypoventilation, and die of central respiratory failure, almost always
  within the first year. The condition was delineated independently and near-simultaneously
  by Sandestig et al. (two unrelated girls with homozygous nonsense variants) and by Muir
  et al. (six individuals from four families with biallelic truncating variants); the two
  descriptions are of the same entity, and the name honours the first report. Roughly ten
  patients had been published as of 2025-2026. The best-supported cellular lesion is
  reduced nuclear protein import, measured directly in patient fibroblasts, but NUP188 also
  acts at the cilium base and at spindle poles, and how much of the phenotype those
  non-transport roles account for is unsettled.

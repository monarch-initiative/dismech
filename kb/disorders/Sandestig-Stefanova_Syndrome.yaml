    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nuclear import of proteins was decreased in affected individuals' fibroblasts, supporting a possible disease mechanism."
    explanation: The primary measurement of the deficit this node names.
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Functional analysis showed that disruption of NUP188 was associated with low active protein transport to the nucleus."
    explanation: A later report restating the same in vitro functional result.
  downstream:

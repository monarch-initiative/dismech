notes: >-
  Entry-type decision. Curated as a standalone DISEASE. MONDO:0032926 has one causal gene
  (RO:0004003 HGNC:17859, NUP188), no descendants, and a single is_a parent (hereditary
  disease), so there is nothing here to lump or split.

  One entity, two independent descriptions. Sandestig et al. (PMID:32021605, two unrelated
  girls) and Muir et al. (PMID:32275884, six individuals from four families) published
  within months of each other; the phenotypes and the allele class are the same, and every
  subsequent report treats them as one condition and counts patients cumulatively across
  both series. That is why the ten-patient census in PMID:39911172 and PMID:40859750 spans
  both. The "NUP188-related disorder" of the Muir title - the neurologic, ocular and
  cardiac syndrome - is therefore SANDSTEF, not a separate entity. PMID:36158057 states
  this directly: Muir et al. "also defined the same syndrome".

  Not the nucleoporin fetal akinesia disorder. Biallelic nucleoporin variants do cause a
  lethal fetal akinesia deformation sequence, but that is NUP88 (PMID:30543681), a
  different gene. A PubMed search for NUP188 combined with akinesia or arthrogryposis
  returns nothing. The camptodactyly and rocker-bottom feet of this syndrome are distal
  contractures, not the generalised arthrogryposis of a fetal akinesia sequence, and no
  report describes reduced fetal movement.

  GeneReviews. No GeneReviews chapter exists for this condition or for NUP188. This was
  checked offline against the committed Bookshelf index (cache/bookshelf/genereviews.csv
  and statpearls.csv), which carries every PubMed-indexed chapter of both collections; a
  case-insensitive search for "NUP188" and "sandestig" matches nothing in either file. That
  is an expected absence for a disorder with roughly ten published patients, not a curation
  gap.

  Orphanet. MONDO records no Orphanet cross-reference for MONDO:0032926 (its xrefs are
  DOID:0081272, MEDGEN:1718072, OMIM:618804 and UMLS:C5394118), so no ORPHA record was
  cited.

  Module conformance. No conforms_to was declared, and three candidates were considered and
  rejected on specific grounds rather than for lack of a search.
  cataract_lens_opacification requires the conforming node to carry the crystallin
  solubility, aggregation and light-scatter chain; nothing has been measured in lens tissue
  from a patient with this syndrome, so declaring it would assert a mechanism no source
  supports. cns_myelin_failure is built on an oligodendrocyte-lineage or myelin-membrane
  insult with differentiation arrest and death; the delayed myelination here is documented
  radiologically only, and whether the primary failure is oligodendroglial or axonal is
  unknown. ciliopathy_dysfunction is the closest fit and is the one to revisit - but its
  entry node is basal body and transition zone dysfunction, and the ciliary evidence for
  NUP188 is Xenopus morpholino knockdown plus a duplication allele in an unrelated
  heterotaxy patient, not this disease's biallelic truncating alleles. That case is
  recorded as the EMERGING ciliary_nup188_model hypothesis group instead, which is what the
  hypothesis machinery is for. If ciliation is ever assayed in patient cells, the
  conformance should be reconsidered.

  Unconnected phenotypes. Seven phenotypes are deliberately left with no incoming causal
  edge: ambiguous genitalia, hypospadias, cryptorchidism, combined immunodeficiency,
  congenital hypothyroidism, hepatomegaly and ectopic kidney. Each was reported in exactly
  one patient and flagged by its own authors as a first-time or unconfirmed association -
  the hepatomegaly and ectopic kidney explicitly so ("further reports are required to
  confirm these associations within the disease spectrum"). No route from the NUP188 lesion
  to any of them has been proposed in the literature, and inventing a node to hold them
  would assert a mechanism nobody has claimed. Bifid uvula is the one exception and is
  wired, to the craniofacial node, because midline palatal fusion failure is already within
  that node's scope via the cleft palate this syndrome causes.

  Phenotype frequency bands. With about ten published patients the HPO frequency bands carry
  very little information: a finding in one patient is 10 percent, which is OCCASIONAL
  (5-29%) rather than VERY_RARE (<5%), so every single-case finding here is banded
  OCCASIONAL and its own description says how many patients it was seen in. Read the
  description, not the band.

  Biotinidase deficiency was reported in the same single patient as the hypothyroidism and
  immunodeficiency. It is not curated as a phenotype here: it was a newborn-screening
  result in a consanguineous Turkish family, biotinidase deficiency is itself a recessive
  condition in its own right, and the report does not establish it as anything other than a
  coincidental second diagnosis.

  Death in infancy is not curated as a phenotype. HPO places `Death in infancy`
  (HP:0001522) under clinical course rather than under phenotypic abnormality, so it falls
  outside the schema's PhenotypeTerm enum and binding it there fails validation. The
  mortality is carried by the "Death from central respiratory failure" progression phase and
  by the Respiratory failure phenotype instead.

  Two editorials on NUP188 by M. Poot (PMID:32256295, PMID:36158058) are indexed in PubMed
  but their records carry no retrievable body, so nothing from them could be quoted and
  they are not cited.

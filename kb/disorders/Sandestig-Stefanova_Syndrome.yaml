      snippet: "the patients presented with strikingly comparable phenotypes including pre- and postnatal microcephaly, trigonocephaly, congenital bilateral cataract, microphthalmia, cleft lip and palate or high-arched palate, camptodactyly, rocker-bottom feet, heart anomalies, specific brain changes (such as loss of periventricular white matter), thin corpus callosum, and delayed myelinization."
      explanation: Establishes congenital bilateral cataract and microphthalmia as part of the syndrome caused by the NUP188 lesion.
  - target: Disrupted Cardiac Morphogenesis

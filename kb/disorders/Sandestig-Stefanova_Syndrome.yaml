discussions:
- discussion_id: transport_versus_ciliary_mechanism
  prompt: >-
    Is Sandestig-Stefanova syndrome a nucleocytoplasmic transport disorder, a ciliopathy, or
    both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Nucleocytoplasmic Protein Import
  - pathophysiology#Loss of Cilia and Ciliary-Base NUP188 Function
  rationale: >-
    The only measurement in patient material is reduced nuclear protein import in
    fibroblasts, and its authors called it a possible mechanism rather than an established
    one. Meanwhile the clinical picture contains features a transport deficit does not
    obviously explain - structurally heterogeneous congenital heart disease, hydrocephalus,
    and heterotaxy-like findings in some patients - and there is direct evidence that
    depleting Nup188 abolishes cilia while the nuclear pore keeps working. That experiment
    is the crux: it means a ciliary phenotype is not a downstream consequence of a transport
    phenotype, so the two are genuinely competing accounts and not two descriptions of one
    lesion. No patient with this syndrome has had ciliation assayed, and no rescue
    experiment has been reported, so the question is open.
  evidence:
  - reference: PMID:27593162
    reference_title: Congenital Heart Disease Genetics Uncovers Context-Dependent Organization and Function of Nucleoporins at Cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that knockdown of Nup188 or its binding partner Nup93 leads to a loss of cilia during embryonic development while leaving NPC function largely intact."
    explanation: Establishes that the two candidate lesions are dissociable, which is what makes this a real question.
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nuclear import of proteins was decreased in affected individuals' fibroblasts, supporting a possible disease mechanism."
    explanation: The hedged patient-cell measurement that is the sole direct support for the transport account.
- discussion_id: drosophila_model_translational_validity
  prompt: >-
    Does the Drosophila NUP188 knockout tell us anything about the brainstem respiratory
    failure that kills these infants?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Encephalopathy with Central Respiratory Control Failure
  - animal_models#Drosophila melanogaster
  rationale: >-
    The fly knockout is the only in vivo model of NUP188 loss with a neurological readout,
    and its authors describe the recapitulation as partial. What it reproduces is motor
    deficit and seizure susceptibility. What kills affected infants is failure of central
    respiratory drive, and the fly has no brainstem respiratory control to fail. It also has
    no counterpart of the progressive microcephaly, periventricular white-matter loss, or
    corpus callosum hypoplasia that dominate the human imaging. So the model supports the
    claim that NUP188 is required for normal neuronal function, and supports no claim about
    the specific lesion that is lethal. A vertebrate model with a brainstem, or human neural
    tissue, would be needed to close this.
  evidence:
  - reference: PMID:32275884
    reference_title: "Bi-allelic Loss-of-Function Variants in NUP188 Cause a Recognizable Syndrome Characterized by Neurologic, Ocular, and Cardiac Abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR-mediated knockout of NUP188 in Drosophila revealed motor deficits and seizure susceptibility, partially recapitulating the neurological phenotype seen in affected individuals."
    explanation: The authors' own statement that the recapitulation is partial, which is the mismatch this discussion records.
  - reference: PMID:36158057
    reference_title: A Boy with Sandestig-Stefanova Syndrome and Genital Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients die in the early period due to respiratory failure secondary to CNS anomalies. No signs of congenital pulmonary or tracheal disease were detected in the identified patients."
    explanation: Establishes that the lethal lesion is central respiratory control, the element the fly model cannot address.

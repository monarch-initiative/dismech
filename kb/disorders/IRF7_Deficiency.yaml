name: IRF7 Deficiency
creation_date: "2026-11-03T15:15:00Z"
category: Mendelian
synonyms:
- immunodeficiency 39
- IMD39
- immunodeficiency type 39
- predisposition to severe viral infection due to IRF7 deficiency
- IRF7 primary immunodeficiency disease
- primary immunodeficiency disease caused by mutation in IRF7
- autosomal recessive IRF7 deficiency
description: >-
  IRF7 deficiency is an autosomal recessive inborn error of intrinsic and innate
  immunity caused by biallelic loss-of-function variants in IRF7, the
  transcription factor that amplifies virus-induced type I and type III
  interferon production. Plasmacytoid dendritic cells, the main interferon-alpha
  producers, express IRF7 constitutively. Without functional IRF7, patient
  leukocytes, plasmacytoid dendritic cells, and fibroblasts make little or no
  type I and III interferon in response to virus, except IFN-beta, which IRF3
  can still induce.

  The clinical picture is narrow and predominantly pulmonary. Affected
  individuals are otherwise healthy, with intact adaptive immunity and
  serological evidence of many uneventful viral infections, but are predisposed
  to critical respiratory viral disease: often a single episode, though some
  patients experience several consecutive ones, and one vaccinated adult also
  developed breakthrough tick-borne viral encephalitis without respiratory
  involvement. Presentations include life-threatening influenza pneumonia with
  acute respiratory distress syndrome in the index child, and critical COVID-19
  pneumonia, respiratory syncytial virus, or adenovirus disease in later
  patients. Seven patients from six families are described in the largest
  series, with onset from 6 months to 50 years; one died of COVID-19 pneumonia.
  Residual IFN-beta and compensatory adaptive immunity are thought to explain
  the narrow susceptibility. There is no IRF7-specific therapy; management
  consists of acute supportive care and prophylactic annual influenza and
  COVID-19 vaccination after diagnosis.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Biallelic IRF7 variants are identified by whole-exome, whole-genome, or
    inborn-errors-of-immunity panel sequencing; functional confirmation
    demonstrates absent type I and III interferon (other than residual IFN-beta)
    induction in stimulated patient plasmacytoid dendritic cells, PBMCs, or
    fibroblasts.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing

pathophysiology:
- name: IRF7 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic null or functionally loss-of-function IRF7 alleles abolish the
    transcription factor's ability to transactivate type I and III interferon
    promoters. In the index patient, the Q421X nonsense allele truncates the
    C-terminal regulatory phosphorylation domain and the F410V missense allele
    prevents virus-induced nuclear accumulation.
  genes:
  - preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report compound heterozygous null mutations in IRF7, which encodes the transcription factor interferon regulatory factor 7, in an otherwise healthy child who suffered life-threatening influenza during primary infection."
    explanation: Establishes biallelic null IRF7 alleles as the primary genetic lesion.
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Each mutation was loss-of-function in reporter assays driven by IFNB, IFNA4, or IFNA6 promoters"
    explanation: Demonstrates loss of IRF7 transcriptional activation on interferon promoters in vitro.
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two mutant IRF7 alleles led to loss of function by different mechanisms: F410V did not accumulate in the nucleus despite phosphorylation, whereas Q421X resided in the nucleus without phosphorylation."
    explanation: Demonstrates the distinct molecular defects of the index compound heterozygous F410V and Q421X alleles.
  downstream:
  - target: Failure of Type I and III Interferon Amplification
    causal_link_type: DIRECT
    description: IRF7 is the transcription factor that amplifies type I and III interferon gene induction.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that IRF7-dependent amplification of type I and III IFNs is required for protection against primary infection by influenza virus in humans."
      explanation: Places IRF7 loss directly upstream of failed interferon amplification.
- name: Failure of Type I and III Interferon Amplification
  conforms_to: "innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling"
  biological_scale: CELLULAR
  description: >-
    Patient plasmacytoid dendritic cells, leukocytes, and fibroblasts produce
    very little or no type I and III interferon in response to influenza virus
    or SARS-CoV-2. IFN-beta is the exception: it can still be induced through
    IRF3, and this residual IFN-beta alongside adaptive immunity is a proposed
    reason viral susceptibility is relatively narrow and predominantly
    pulmonary. Plasmacytoid dendritic cells constitutively express IRF7 and are
    the main type I interferon producers, so losing IRF7 disables their primary
    antiviral effector function.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: type I interferon production

name: IRF7 Deficiency
creation_date: "2026-11-03T15:15:00Z"
category: Mendelian
synonyms:
- immunodeficiency 39
- IMD39
- immunodeficiency type 39
- predisposition to severe viral infection due to IRF7 deficiency
- IRF7 primary immunodeficiency disease
- primary immunodeficiency disease caused by mutation in IRF7
- autosomal recessive IRF7 deficiency
description: >-
  IRF7 deficiency is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function variants in IRF7, the transcription factor that
  amplifies virus-induced type I and type III interferon production.
  Plasmacytoid dendritic cells, the main interferon-alpha producers, express it
  constitutively. Without IRF7, patient leukocytes, plasmacytoid dendritic cells
  and fibroblasts make little or no type I and III interferon in response to
  virus, except IFN-beta, which IRF3 can still induce.

  The clinical picture is narrow. Affected people are otherwise healthy, with
  normal adaptive immunity and serological evidence of many uneventful viral
  infections, but are prone to critical respiratory viral disease: often a
  single episode, though some patients have had several consecutive ones.
  Presentations include life-threatening influenza pneumonia with acute
  respiratory distress syndrome in the index child, and critical COVID-19
  pneumonia, RSV or adenovirus disease in later patients. Seven patients from six families are
  described in the largest series, with onset from 6 months to 50 years; one
  died of COVID-19 pneumonia. Residual IFN-beta and compensatory adaptive
  immunity are thought to explain the narrow susceptibility. There is no
  specific treatment; management is supportive care of the acute episode and
  annual influenza and COVID-19 vaccination after diagnosis.

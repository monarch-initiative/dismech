animal_models:
- name: Irf7 knockout mouse
  species: Mouse
  genotype: Irf7-/-
  description: >-
    Irf7-null mice establish IRF7 as the master regulator of type I interferon:
    virus-induced IFN-alpha/beta is severely impaired and the mice are more
    vulnerable to viral infection, with markedly reduced serum interferon.
  modeled_mechanisms:
  - target: Failure of Type I and III Interferon Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Irf7-null cells fail to induce IFN-alpha/beta, mirroring the core cellular defect in human patients.
    limitations: >-
      The mouse is a complete constitutive knockout with broad systemic viral
      vulnerability, whereas the human disease exhibits a narrower
      respiratory-viral susceptibility; the model recapitulates the interferon
      amplification lesion rather than the restricted clinical phenotype.
    evidence:
    - reference: PMID:15800576
      reference_title: "IRF-7 is the master regulator of type-I interferon-dependent immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Viral induction of MyD88-independent IFN-alpha/beta genes is severely impaired in Irf7-/- fibroblasts."
      explanation: Irf7-null fibroblasts fail to induce interferon, mirroring the core human cellular lesion.
  evidence:
  - reference: PMID:15800576
    reference_title: "IRF-7 is the master regulator of type-I interferon-dependent immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistently, Irf7-/- mice are more vulnerable than Myd88-/- mice to viral infection, and this correlates with a marked decrease in serum IFN levels, indicating the importance of the IRF-7-dependent induction of systemic IFN responses for innate antiviral immunity."
    explanation: Irf7-null mice are more vulnerable to viral infection with reduced systemic interferon.
notes: >-
  No GeneReviews or StatPearls chapter covers IRF7 deficiency (MONDO:0014597),
  and ClinGen has no gene-disease validity record for IRF7, so no
  gene_disease_validity assertion is recorded.

  The autosomal dominant IRF7 deficiency reported alongside the recessive form
  in the COVID-19 cohort (PMID:32972995) is not modelled as a separate entry
  here; MONDO:0014597 denotes autosomal recessive immunodeficiency 39, and the
  dominant form has no distinct MONDO term.

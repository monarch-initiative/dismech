treatments:
- name: Viral vaccination
  description: >-
    Annual influenza vaccination and COVID-19 vaccination are implemented after
    molecular diagnosis to reduce the risk of severe respiratory viral episodes;
    tested patients mounted antibody responses to SARS-CoV-2 mRNA vaccination,
    though one vaccinated adult developed breakthrough tick-borne viral
    encephalitis after TBE vaccination. Unlike patients with complete IFNAR1,
    IFNAR2, or STAT2 defects, IRF7-deficient patients tolerate live attenuated
    vaccines such as MMR.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Uncontrolled Viral Replication in Respiratory Cells
    treatment_effect: INHIBITS
    description: >-
      Prophylactic influenza and COVID-19 vaccination induces adaptive antibody
      immunity to help protect against uncontrolled respiratory viral
      replication despite impaired IRF7-dependent interferon amplification.
    evidence:
    - reference: PMID:35670811
      reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prophylactic measures, such as annual influenza vaccination (P1 since 2014; P5, P6, and P7 since 2021) and COVID-19 vaccination (P1, P2, P3, P5, P6, and P7 in 2021), were implemented after molecular diagnosis."
      explanation: >-
        Documents post-diagnosis prophylactic influenza and COVID-19
        vaccination across the cohort.
    - reference: PMID:35670811
      reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Vaccination against common viral pathogens, including SARS-CoV-2, appears to be an effective intervention that can protect these patients from infectious disease."
      explanation: >-
        Supports vaccination against respiratory viral pathogens as a protective
        intervention in IRF7 deficiency.
  evidence:

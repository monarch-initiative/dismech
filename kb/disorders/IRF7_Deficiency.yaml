      reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PCR for the TBE virus was negative on CSF, but serological tests were positive on both CSF and serum, with high titers of neutralizing antibodies in the serum, suggesting a breakthrough infection despite three doses of vaccine."

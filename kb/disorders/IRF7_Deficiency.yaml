      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, the patient's dermal fibroblasts and induced pluripotent stem cell (iPSC)-derived pulmonary epithelial cells produced reduced amounts of type I IFN and displayed increased influenza virus replication."
      explanation: Reduced interferon in patient-derived cells leads directly to increased influenza replication.
  - target: Tick-borne viral encephalitis
    description: Impaired IRF7-dependent interferon amplification was also associated with a breakthrough tick-borne encephalitis virus CNS infection in one vaccinated patient.
    evidence:

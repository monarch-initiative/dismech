phenotypes:
- category: Immunological
  name: Severe viral infection
  diagnostic: true
  description: >-
    Predominantly critical pulmonary viral disease in an otherwise healthy
    person: often one episode, though some patients have experienced several
    consecutive episodes with different respiratory viruses (SARS-CoV-2,
    influenza A virus, respiratory syncytial virus, and adenovirus), and one
    vaccinated adult experienced breakthrough tick-borne viral encephalitis
    without respiratory involvement. Patients are not broadly infection-prone:
    serology shows many uneventful past viral infections, and live attenuated
    MMR vaccination is tolerated.
  phenotype_term:
    preferred_term: Severe viral infection
    term:
      id: HP:0031691
      label: Severe viral infection
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The respiratory viruses implicated included SARS-CoV-2, influenza virus, respiratory syncytial virus, and adenovirus."
    explanation: Range of respiratory viruses causing severe disease in the seven patients.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient P7 first presented with RSV at 6 mo of age and has since been treated for severe, consecutive IAV and adenovirus infections"
    explanation: Documents recurrent consecutive severe respiratory viral episodes in patient P7.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IRF7-deficient individuals are prone to viral infections of the respiratory tract but are otherwise healthy, potentially due to residual IFN-β and compensatory adaptive immunity."
    explanation: Susceptibility is predominantly to respiratory viral infection, with patients controlling most other common viruses.
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inborn errors of TLR3- and IRF7-dependent type I IFN immunity can underlie life-threatening COVID-19 pneumonia in patients with no prior severe infection."
    explanation: IRF7 deficiency among the inborn errors underlying life-threatening COVID-19 pneumonia.

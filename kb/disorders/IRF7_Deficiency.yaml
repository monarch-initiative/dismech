      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The missense F410V substitution is predicted to be damaging and absent in public databases."
      explanation: In silico deleteriousness prediction and absence from population databases for F410V.
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The two mutant IRF7 alleles led to loss of function by different mechanisms: F410V did not accumulate in the nucleus despite phosphorylation, whereas Q421X resided in the nucleus without phosphorylation."
      explanation: Experimental assay showing F410V fails to accumulate in the nucleus despite phosphorylation.

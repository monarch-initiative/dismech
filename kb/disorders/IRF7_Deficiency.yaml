inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss-of-function IRF7 variants, homozygous or compound
    heterozygous; heterozygous parents are healthy carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five were homozygous and two were compound heterozygous for IRF7 variants."
    explanation: All seven patients in the largest series carry biallelic IRF7 variants.
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report compound heterozygous null mutations in IRF7, which encodes the transcription factor interferon regulatory factor 7, in an otherwise healthy child who suffered life-threatening influenza during primary infection."
    explanation: The index patient is compound heterozygous for null IRF7 alleles.
pathophysiology:
- name: IRF7 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic null or hypomorphic IRF7 alleles remove the transcription factor's
    ability to activate interferon genes. In the index patient, the Q421X
    nonsense allele truncates the C-terminal regulatory region and the F410V
    missense allele is predicted damaging.
  genes:
  - preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report compound heterozygous null mutations in IRF7, which encodes the transcription factor interferon regulatory factor 7, in an otherwise healthy child who suffered life-threatening influenza during primary infection."
    explanation: Establishes null IRF7 alleles as the lesion.
  downstream:
  - target: Failure of Type I and III Interferon Amplification
    causal_link_type: DIRECT
    description: IRF7 is the transcription factor that amplifies type I and III interferon induction.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that IRF7-dependent amplification of type I and III IFNs is required for protection against primary infection by influenza virus in humans."
      explanation: Places IRF7 loss directly upstream of failed interferon amplification.
- name: Failure of Type I and III Interferon Amplification
  conforms_to: "innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling"
  biological_scale: CELLULAR
  description: >-
    Patient plasmacytoid dendritic cells, leukocytes and fibroblasts produce
    very little or no type I and III interferon in response to influenza virus
    or SARS-CoV-2. IFN-beta is the exception: it can still be induced through
    IRF3, and this residual IFN-beta is the proposed reason the susceptibility
    is narrow. Plasmacytoid dendritic cells constitutively express IRF7 and are
    the main type I interferon producers, so losing it disables their main
    function.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: type I interferon production
    modifier: DECREASED
    term:
      id: GO:0032606
      label: type I interferon production
  - preferred_term: type III interferon production
    modifier: DECREASED
    term:
      id: GO:0034343
      label: type III interferon production
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In response to influenza virus, the patient's leukocytes and plasmacytoid dendritic cells produced very little type I and III interferons (IFNs)."
    explanation: Patient cells fail to make type I and III interferons on virus challenge.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' fibroblasts and plasmacytoid dendritic cells produced no detectable type I and III IFNs, except IFN-β."
    explanation: Confirms the interferon defect across patients and records the residual IFN-beta.
  - reference: PMID:15800576
    reference_title: "IRF-7 is the master regulator of type-I interferon-dependent immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, robust induction of IFN production by activation of the TLR9 subfamily in plasmacytoid dendritic cells is entirely dependent on IRF-7, and this MyD88-IRF-7 pathway governs the induction of CD8+ T-cell responses."
    explanation: Mouse evidence that plasmacytoid dendritic cell interferon production depends on IRF7.
  downstream:
  - target: Uncontrolled Viral Replication in Respiratory Cells
    description: Without the interferon-induced antiviral state, infected cells support more virus replication.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, the patient's dermal fibroblasts and induced pluripotent stem cell (iPSC)-derived pulmonary epithelial cells produced reduced amounts of type I IFN and displayed increased influenza virus replication."
      explanation: Reduced interferon in patient-derived cells goes with increased influenza replication.
- name: Uncontrolled Viral Replication in Respiratory Cells
  biological_scale: CELLULAR
  description: >-
    Patient-derived pulmonary epithelial cells and fibroblasts make less type I
    interferon and allow more influenza virus replication; cells with defects in
    this TLR3- and IRF7-dependent circuit are also vulnerable to SARS-CoV-2.
  biological_processes:
  - preferred_term: defense response to virus
    modifier: DECREASED
    term:
      id: GO:0051607
      label: defense response to virus
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the patient's dermal fibroblasts and induced pluripotent stem cell (iPSC)-derived pulmonary epithelial cells produced reduced amounts of type I IFN and displayed increased influenza virus replication."
    explanation: Increased influenza replication in patient-derived pulmonary epithelial cells.
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that human fibroblasts with mutations affecting this circuit are vulnerable to SARS-CoV-2."
    explanation: Cells with TLR3/IRF7-circuit defects, including IRF7, are vulnerable to SARS-CoV-2.
  downstream:
  - target: Severe viral infection
  - target: Pneumonia
  - target: Acute respiratory distress syndrome
  - target: Respiratory failure
phenotypes:
- category: Immunological
  name: Severe viral infection
  description: >-
    Critical pulmonary viral disease in an otherwise healthy person: often one
    episode, but some patients have had several consecutive episodes with
    different viruses. Implicated viruses are SARS-CoV-2, influenza virus,
    respiratory syncytial virus and adenovirus; one patient also had tick-borne
    encephalitis virus susceptibility. Patients are not broadly infection-prone:
    serology shows many uneventful past infections, and live MMR vaccine was
    tolerated.
  phenotype_term:
    preferred_term: Severe respiratory viral infection
    term:
      id: HP:0031691
      label: Severe viral infection
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The respiratory viruses implicated included SARS-CoV-2, influenza virus, respiratory syncytial virus, and adenovirus."
    explanation: Range of viruses causing severe disease in the seven patients.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient P7 first presented with RSV at 6 mo of age and has since been treated for severe, consecutive IAV and adenovirus infections"
    explanation: One patient had several consecutive severe respiratory viral episodes, not a single one.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IRF7-deficient individuals are prone to viral infections of the respiratory tract but are otherwise healthy, potentially due to residual IFN-β and compensatory adaptive immunity."
    explanation: Susceptibility is restricted to respiratory viral infection.
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inborn errors of TLR3- and IRF7-dependent type I IFN immunity can underlie life-threatening COVID-19 pneumonia in patients with no prior severe infection."
    explanation: IRF7 deficiency among the inborn errors underlying life-threatening COVID-19 pneumonia.
- category: Clinical
  name: Pneumonia
  description: Viral pneumonia, from influenza A or SARS-CoV-2 among others, is the usual severe presentation.
  phenotype_term:
    preferred_term: Viral pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive IRF7 deficiency was previously reported in three patients with single critical influenza or COVID-19 pneumonia episodes."
    explanation: Critical influenza or COVID-19 pneumonia in the first three patients.
- category: Clinical
  name: Acute respiratory distress syndrome
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suffered life-threatening ARDS during infection with laboratory-confirmed pandemic H1N1 (pH1N1) 2009 influenza A virus (IAV) in January 2011"
    explanation: ARDS during primary pandemic influenza in the index child.
- category: Clinical
  name: Respiratory failure
  description: Severe episodes have required intensive care and mechanical ventilation; one patient died.
  phenotype_term:
    preferred_term: Respiratory failure requiring mechanical ventilation
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was admitted to the intensive care unit (ICU), intubated, placed on assisted ventilation, and treated with hydroxychloroquine and amoxicillin/clavulanic acid for 4 d."
    explanation: Respiratory failure requiring ventilation in one patient.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was admitted to the ICU, where he was placed on mechanical ventilation."

genetic:
- name: IRF7
  gene_term:
    preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Biallelic loss-of-function variants. Functionally deleterious alleles
    include F410V, Q421X, D117N, M371V and P364AfsX38; R37H and T254A tested
    neutral.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: p.Phe410Val (F410V)
    description: Missense allele in the index patient; compound heterozygous with Q421X.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The missense F410V substitution is predicted to be damaging and absent in public databases."
      explanation: Records the F410V allele in the index patient.
  - name: p.Gln421Ter (Q421X)
    description: Nonsense allele truncating the C-terminal regulatory domain; compound heterozygous with F410V.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The truncated Q421X product lacks the C-terminal serine residues and was not phosphorylated"
      explanation: The Q421X allele truncates the C-terminal regulatory region and cannot be phosphorylated.
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They also show that severe influenza may result from single-gene inborn errors of immunity."
    explanation: Establishes IRF7 as a monogenic cause of severe viral disease.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Biallelic IRF7 variants are found by exome or inborn-errors-of-immunity
    panel sequencing; functional assays show absent type I and III interferon
    induction in patient plasmacytoid dendritic cells or fibroblasts.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five were homozygous and two were compound heterozygous for IRF7 variants."
    explanation: Diagnosis rests on finding biallelic IRF7 variants.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' fibroblasts and plasmacytoid dendritic cells produced no detectable type I and III IFNs, except IFN-β."
    explanation: >-
      Functional confirmation that patient fibroblasts and plasmacytoid
      dendritic cells fail to produce type I and III interferon.
treatments:
- name: Viral vaccination
  description: >-
    After diagnosis, annual influenza and COVID-19 vaccination is used to reduce
    the risk of the severe respiratory viral episodes the disease predisposes
    to. Unlike complete type I interferon receptor defects, IRF7-deficient
    patients tolerate live attenuated vaccines such as MMR.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylactic measures, such as annual influenza vaccination (P1 since 2014; P5, P6, and P7 since 2021) and COVID-19 vaccination (P1, P2, P3, P5, P6, and P7 in 2021), were implemented after molecular diagnosis."
    explanation: Vaccination is the prophylactic measure used after diagnosis.
- name: Supportive care
  description: >-
    Acute episodes are managed supportively, with intensive care, oxygen and
    mechanical ventilation for respiratory failure. There is no IRF7-specific
    therapy; neuraminidase inhibitors and COVID-19 antivirals are given on
    general grounds without IRF7-specific evidence.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was admitted to the ICU, where he was placed on mechanical ventilation."
    explanation: Intensive care with mechanical ventilation was used for the respiratory failure.
animal_models:
- name: Irf7 knockout mouse
  species: Mouse
  genotype: Irf7-/-
  description: >-
    Irf7-null mice establish IRF7 as the master regulator of type I interferon:
    virus-induced IFN-alpha/beta is severely impaired and the mice are more
    vulnerable to viral infection, with markedly reduced serum interferon.
  modeled_mechanisms:
  - target: Failure of Type I and III Interferon Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Irf7-null cells fail to induce IFN-alpha/beta, as patient cells do.
    limitations: >-
      The mouse is a complete constitutive knockout and the human disease is a
      narrow respiratory-viral susceptibility; the model speaks to the
      interferon lesion, not the restricted clinical phenotype.
    evidence:
    - reference: PMID:15800576
      reference_title: "IRF-7 is the master regulator of type-I interferon-dependent immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Viral induction of MyD88-independent IFN-alpha/beta genes is severely impaired in Irf7-/- fibroblasts."
      explanation: Irf7-null fibroblasts fail to induce interferon, the core lesion of the human disease.
  evidence:
  - reference: PMID:15800576
    reference_title: "IRF-7 is the master regulator of type-I interferon-dependent immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistently, Irf7-/- mice are more vulnerable than Myd88-/- mice to viral infection, and this correlates with a marked decrease in serum IFN levels, indicating the importance of the IRF-7-dependent induction of systemic IFN responses for innate antiviral immunity."
    explanation: Irf7-null mice are more vulnerable to viral infection with reduced systemic interferon.
notes: >-
  No GeneReviews chapter covers IRF7 deficiency. ClinGen has no gene-disease
  validity record for IRF7, so no gene_disease_validity assertion is recorded.

  The autosomal dominant IRF7 deficiency reported alongside the recessive form
  in the COVID-19 cohort (PMID:32972995) is not modelled as a separate entry
  here; MONDO:0014597 is the recessive disease named in the claim, and the
  dominant form has no distinct MONDO term.

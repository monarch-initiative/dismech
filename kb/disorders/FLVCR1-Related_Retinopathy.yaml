genetic:
- name: FLVCR1
  gene_term:
    preferred_term: FLVCR1
    term:
      id: hgnc:24682
      label: FLVCR1
  relationship_type: CAUSATIVE
  notes: >
    FLVCR1 (feline leukemia virus subgroup C receptor 1) encodes a
    12-transmembrane-domain heme exporter of the major facilitator
    superfamily. Biallelic loss-of-function variants cause FLVCR1-related
    retinopathy with or without ataxia. Because Flvcr1-null mice die in
    mid-gestation, the authors of the 2018 case report infer that all
    reported human disease-causing variants are likely to permit translation
    of some functional FLVCR1 protein.
  evidence:
  - reference: PMID:21070897
    reference_title: "Mutations in FLVCR1 cause posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a single-nucleotide coding variant in the feline leukemia virus subgroup C cellular receptor 1 (FLVCR1), a gene encoding a heme-transporter protein"
    explanation: >-
      Original gene-identification study establishing FLVCR1 as the
      heme-transporter gene mutated in PCARP.
treatments:
- name: Low Vision Rehabilitation
  description: Supportive low-vision aids and rehabilitation for the retinopathy.
  treatment_term:
    preferred_term: low vision rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No disease-modifying treatment is established. Yusuf et al. (2018)
    propose FLVCR1 as a gene-therapy target -- the gene is small enough
    (2.6 kb) for AAV packaging -- and describe the interval before ataxia
    onset in the third decade as a therapeutic window for CNS-directed gene
    therapy. As of that report no FLVCR1-directed gene therapy had entered
    human trials; the entry does not cite a later source, so the current
    trial status is not established here.
  evidence:
  - reference: PMID:29192808
    reference_title: "A splice-site variant in FLVCR1 produces retinitis pigmentosa without posterior column ataxia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms of ataxia begin in the third decade in PCARP: this represents a therapeutic window to treat the CNS with gene therapy before the onset of posterior column degeneration."
    explanation: >-
      Source for the proposed therapeutic window described in the notes.
      The claim is the authors' proposal, not a demonstrated treatment
      effect, and the entry's own treatment is supportive care only.
- name: Mobility and Ataxia Rehabilitation
  description: >

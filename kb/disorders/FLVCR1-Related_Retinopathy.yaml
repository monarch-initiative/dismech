name: FLVCR1-Related Retinopathy with or without Ataxia
creation_date: "2026-07-10T14:30:00Z"
category: Mendelian
description: >
  FLVCR1-related retinopathy with or without ataxia -- classically known as
  posterior column ataxia with retinitis pigmentosa (PCARP) -- is a rare
  autosomal recessive disorder caused by biallelic variants in FLVCR1, which
  encodes a 12-transmembrane-domain major facilitator superfamily protein
  that exports cytoplasmic heme. Loss-of-function FLVCR1 variants cause the
  mutant protein to misfold, remain trapped intracellularly (rather than
  trafficking to the plasma membrane), and undergo rapid lysosomal
  degradation, abolishing heme-export activity. Because free heme is toxic
  to cells, its intracellular accumulation drives selective degeneration of
  the neurons with the highest FLVCR1 expression: retinal photoreceptors
  (always affected) and, in most patients, the proprioceptive neurons of the
  spinal cord posterior columns (affected in classic PCARP but spared in a
  minority of patients whose variants retain partial function). This
  tissue-expression-gradient model links the disease's characteristic dual
  sensory phenotype -- progressive vision loss and sensory ataxia -- to a
  single underlying heme-transport defect.
disease_term:
  preferred_term: FLVCR1-related retinopathy with or without ataxia
  term:
    id: MONDO:0100449
    label: FLVCR1-related retinopathy with or without ataxia
synonyms:
- Posterior column ataxia with retinitis pigmentosa
- PCARP
- AXPC1
- Retinopathy-sensory neuropathy syndrome
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
- Hereditary Ataxia
has_subtypes:
- name: PCARP
  display_name: Posterior Column Ataxia with Retinitis Pigmentosa
  subtype_term:
    preferred_term: posterior column ataxia-retinitis pigmentosa syndrome
    term:
      id: MONDO:0012177
      label: posterior column ataxia-retinitis pigmentosa syndrome
  description: >-
    The classic and most common presentation, combining retinitis
    pigmentosa with progressive sensory (posterior column) ataxia. Caused
    by FLVCR1 variants, typically missense substitutions in transmembrane
    domains, that abolish heme-export function in all FLVCR1-expressing
    tissues.
- name: Isolated Retinopathy
  display_name: FLVCR1-Related Retinopathy without Ataxia
  description: >-
    A minority presentation in which biallelic FLVCR1 splice-site variants
    permit translation of some residual functional protein, sufficient to
    spare the lower-FLVCR1-expressing posterior columns and cerebellum,
    while retinitis pigmentosa still develops because the retina expresses
    FLVCR1 most highly of all tissues.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    FLVCR1-related retinopathy with or without ataxia requires biallelic
    pathogenic FLVCR1 variants; heterozygous carriers (including unaffected
    parents and siblings) are asymptomatic.
  evidence:
  - reference: PMID:21070897
    reference_title: "Mutations in FLVCR1 cause posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysfunction of two specific sensory modalities, vision and proprioception, characterizes the phenotype of the rare, autosomal-recessive disorder posterior column ataxia and retinitis pigmentosa (PCARP)."
    explanation: >-
      Establishes PCARP as an autosomal-recessive disorder defined by
      combined visual and proprioceptive sensory dysfunction.
pathophysiology:
- name: FLVCR1 Loss-of-Function and Heme Export Failure
  description: >
    Biallelic pathogenic FLVCR1 variants (missense substitutions within
    transmembrane domains, or splice-site changes) cause the mutant heme
    exporter to fail to fold properly in the endoplasmic reticulum. Rather
    than trafficking to the plasma membrane, mutant FLVCR1 accumulates in
    intracellular structures including lysosomes and is rapidly degraded
    (half-life 2-4 hours, versus >16 hours for wild-type protein),
    abolishing its heme-export activity.
  biological_processes:
  - preferred_term: Heme export
    term:
      id: GO:0097037
      label: heme export
    modifier: DECREASED
  evidence:
  - reference: PMID:22483575
    reference_title: "Mutations of FLVCR1 in posterior column ataxia and retinitis pigmentosa result in the loss of heme export activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FLVCR1 mutants did not localize to the plasma membrane and were observed in intracellular structures, including lysosomes. We hypothesize that the loss of function of FLVCR1 mutants is caused by their mislocation. We examined the half-life of FLVCR1 in cells, which was >16h for wild-type FLVCR1 compared with 2-4h for the mutants."
    explanation: >-
      Functional expression studies of four PCARP-associated FLVCR1
      mutants directly demonstrate loss of plasma-membrane localization and
      accelerated protein turnover as the mechanism of heme-export failure.
  downstream:
  - target: Intracellular Heme Accumulation and Toxicity
    description: >-
      Loss of FLVCR1-mediated heme export prevents cytoplasmic heme from
      being exported out of the cell.
- name: Intracellular Heme Accumulation and Toxicity
  description: >
    Free heme is toxic to cells. In cells expressing loss-of-function
    FLVCR1, the heme that would normally be exported instead accumulates
    intracellularly, producing cellular toxicity. Complete loss of FLVCR1
    function is embryonically lethal, underscoring the toxicity of
    unexported heme.
  biological_processes:
  - preferred_term: Heme metabolic process
    term:
      id: GO:0042168
      label: heme metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22483575
    reference_title: "Mutations of FLVCR1 in posterior column ataxia and retinitis pigmentosa result in the loss of heme export activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, accumulation of heme in FLVCR1-mutant cells could cause cellular toxicity."
    explanation: >-
      Directly links loss of FLVCR1 heme-export function to intracellular
      heme accumulation and cellular toxicity.
  - reference: PMID:29192808
    reference_title: "A splice-site variant in FLVCR1 produces retinitis pigmentosa without posterior column ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Free heme is toxic to cells; Flvcr1-/- mice die in mid-gestation."
    explanation: >-
      Complete Flvcr1 knockout is embryonically lethal in mice, confirming
      that unexported free heme is cytotoxic.
  downstream:
  - target: Tissue-Selective Vulnerability from the FLVCR1 Expression Gradient
    description: >-
      Heme toxicity is only pathogenic in cells that both rely on FLVCR1
      export and cannot compensate through alternative heme-handling
      pathways; the severity of this toxicity across tissues tracks FLVCR1
      expression level.
- name: Tissue-Selective Vulnerability from the FLVCR1 Expression Gradient
  description: >
    FLVCR1 is expressed widely but at markedly different levels across
    tissues, being most abundant in the retina, followed by the posterior
    columns of the spinal cord, the cerebellum, and other CNS regions. This
    expression gradient explains the disease's characteristic dual sensory
    phenotype: the retina, with the highest FLVCR1 expression, is
    vulnerable to even partial loss of heme-export function and is affected
    in essentially all patients, while the posterior columns require more
    severe loss of function to cross the pathogenic threshold and are
    therefore only affected in a subset of patients.
  evidence:
  - reference: PMID:21070897
    reference_title: "Mutations in FLVCR1 cause posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Flvcr1 mRNA levels were most abundant in the retina, followed by the posterior column of the spinal cord and other brain regions."
    explanation: >-
      Quantitative RT-PCR in wild-type mouse tissue establishes the
      retina-greater-than-posterior-column-greater-than-other-CNS FLVCR1
      expression gradient underlying tissue-selective vulnerability.
  - reference: PMID:29192808
    reference_title: "A splice-site variant in FLVCR1 produces retinitis pigmentosa without posterior column ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLVCR1 is expressed widely, although most prominently in retina followed by posterior columns of the spinal cord, cerebellum and other central nervous system tissues."
    explanation: >-
      Confirms the same tissue-expression gradient in the context of human
      disease, directly linking it to the selective retinal and posterior
      column pathology.
  downstream:
  - target: Rod Photoreceptor Apoptosis
    description: >-
      The retina's high FLVCR1 expression makes photoreceptors vulnerable
      to heme toxicity from even partial loss-of-function variants,
      explaining why retinopathy occurs in essentially all patients.
  - target: Posterior Column Sensory Neuron Degeneration
    description: >-
      The posterior columns' lower FLVCR1 expression requires more severe
      loss-of-function variants to cross the pathogenic heme-toxicity
      threshold, explaining why ataxia is absent in some patients.
- name: Rod Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >
    Heme toxicity in the highly FLVCR1-expressing retina drives selective
    degeneration of photoreceptors, producing the progressive pigmentary
    retinopathy characteristic of the disease.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:21070897
    reference_title: "Mutations in FLVCR1 cause posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that aberrant FLVCR1 causes a selective degeneration of a subpopulation of neurons in the retina and the posterior columns of the spinal cord via dysregulation of heme or iron homeostasis."
    explanation: >-
      Directly attributes retinal (and posterior column) neuronal
      degeneration to FLVCR1-dependent heme/iron dysregulation.
- name: Posterior Column Sensory Neuron Degeneration
  description: >
    In patients whose FLVCR1 variants sufficiently impair heme export in
    lower-expressing tissues, heme toxicity also drives degeneration of the
    proprioceptive sensory neurons and axons of the spinal cord posterior
    columns, producing progressive sensory ataxia. Spinal cord MRI shows a
    hyperintense signal in the posterior columns of affected individuals.
  cell_types:
  - preferred_term: Posterior column sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:9409377
    reference_title: "An autosomal recessive disorder with posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inversion recovery MRIs of the spinal cord in affected individuals demonstrate a hyperintense signal in the posterior columns."
    explanation: >-
      Direct imaging evidence of posterior column pathology in affected
      individuals from the original clinical description of the disorder.
- name: Genotype-Dependent Residual FLVCR1 Function Determines Ataxia Penetrance
  description: >
    Splice-site FLVCR1 variants (e.g., c.1092+5G>A) can permit low-level
    production of correctly spliced, functional transcript despite
    triggering predominant exon skipping and a frameshift/premature stop
    codon on the majority of transcripts. This residual functional protein
    can be sufficient to protect the lower-FLVCR1-expressing posterior
    columns and cerebellum from heme toxicity, while remaining insufficient
    to protect the higher-expressing retina -- explaining why some
    patients with biallelic FLVCR1 variants develop retinopathy without
    ever developing posterior column ataxia.
  evidence:
  - reference: PMID:29192808
    reference_title: "A splice-site variant in FLVCR1 produces retinitis pigmentosa without posterior column ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splice-site FLVCR1 variants may result in the translation of some fully functional FLVCR1 protein product which is sufficient for tissues in which FLVCR1 is expressed at a lower level (posterior columns and cerebellum), but which is insufficient to protect against the toxic effects of excess intracellular heme in tissues which express FLVCR1 highly (retina)."
    explanation: >-
      States the genotype-phenotype hypothesis directly: partial residual
      FLVCR1 function from splice-site variants can selectively spare
      lower-expression tissues while retinal disease still develops.
  downstream:
  - target: Posterior Column Sensory Neuron Degeneration
    description: >-
      In the Isolated Retinopathy subtype, sufficient residual FLVCR1
      function in the posterior columns mitigates (rather than drives)
      this node -- the mechanistic basis for absence of ataxia despite
      biallelic FLVCR1 variants.

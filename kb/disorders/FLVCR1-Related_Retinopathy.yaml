genetic:
- name: FLVCR1
  gene_term:
    preferred_term: FLVCR1
    term:
      id: hgnc:24682
      label: FLVCR1
  relationship_type: CAUSATIVE
  notes: >
    FLVCR1 (feline leukemia virus subgroup C receptor 1) encodes a
    12-transmembrane-domain heme exporter of the major facilitator
    superfamily. Biallelic loss-of-function variants cause FLVCR1-related
    retinopathy with or without ataxia; complete loss of function is
    embryonically lethal, so all reported disease-causing variants retain
    some residual function.
  evidence:
  - reference: PMID:21070897
    reference_title: "Mutations in FLVCR1 cause posterior column ataxia and retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a single-nucleotide coding variant in the feline leukemia virus subgroup C cellular receptor 1 (FLVCR1), a gene encoding a heme-transporter protein"
    explanation: >-
      Original gene-identification study establishing FLVCR1 as the
      heme-transporter gene mutated in PCARP.
treatments:
- name: Low Vision Rehabilitation
  description: Supportive low-vision aids and rehabilitation for the retinopathy.
  treatment_term:
    preferred_term: low vision rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No disease-modifying treatment is currently available. Investigational
    interest exists in AAV-mediated FLVCR1 gene augmentation and in a
    potential therapeutic window for CNS-directed gene therapy before the
    onset of posterior column degeneration (typically third decade), but
    no such therapy has reached human trials.
- name: Mobility and Ataxia Rehabilitation
  description: >
    Physical and occupational therapy for gait training and mobility aids
    to manage progressive sensory ataxia in patients with the PCARP
    subtype.
  treatment_term:

name: McLeod Neuroacanthocytosis Syndrome
creation_date: "2026-08-20T18:10:00Z"
category: Mendelian
synonyms:
- McLeod syndrome
- MLS
- McLeod phenotype
- XK-related neurodegenerative disease
- Kell/McLeod syndrome
description: >-
  McLeod neuroacanthocytosis syndrome is an X-linked multisystem disorder caused by loss of
  XK, a red-cell and neuronal membrane protein that is disulphide-bonded to the Kell
  glycoprotein and that functions as a calcium-activated phospholipid scramblase in
  partnership with VPS13A. Loss of XK produces a single molecular lesion with four largely
  separate clinical consequences: a Huntington-like neurodegeneration centred on the caudate
  nucleus; red-cell acanthocytosis with compensated hemolysis and the McLeod blood group
  phenotype; a chronic axonal motor neuropathy presenting as myopathy; and a
  cardiomyopathy that is a leading cause of death. The blood group phenotype is not an
  incidental marker - it makes transfusion itself hazardous, which is the single most
  actionable fact about the disease.
disease_term:
  preferred_term: McLeod neuroacanthocytosis syndrome
  term:
    id: MONDO:0018945
    label: XK-related neurodegenerative disease
parents:
- Neurological Disease

    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During follow-up, seven patients developed chorea, six had psychiatric
      disorders, five had cognitive decline and three had generalized seizures"
    explanation: >-
      7/10 is 70 percent, in the FREQUENT band (30-79 percent), counted directly in a
      followed cohort.


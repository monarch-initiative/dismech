inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Affected males carry a hemizygous intragenic XK variant (about 90%) or a hemizygous Xp21.1 deletion
    involving XK (about 10%). Heterozygous females are mosaic for the Kell and Kx antigens
    because of X inactivation, and while they usually escape the neurological disease, some
    develop chorea or late-onset cognitive decline - so carrier status is not reliably
    silent.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "either a hemizygous XK pathogenic variant (90% of affected males) or a
      hemizygous deletion of Xp21.1 involving XK (10% of affected males) identified on
      molecular genetic testing"
    explanation: >-
      Establishes the X-linked architecture and the split between intragenic variants and
      whole-locus deletions, which matters because the deletion class can extend into neighbouring
      genes.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Females heterozygous for XK pathogenic variants have mosaicism for the Kell
      and Kx blood group antigens. Although they usually lack CNS and neuromuscular
      manifestations, some heterozygous females may develop clinical manifestations
      including chorea or late-onset cognitive decline"
    explanation: >-
      Records that heterozygous females are not uniformly unaffected, which is what makes
      carrier identification clinically relevant rather than purely reproductive.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the mother of an affected male is heterozygous, the chance of transmitting
      the XK pathogenic variant in each pregnancy is 50%"
    explanation: >-
      The per-pregnancy transmission risk, from the GeneReviews GENETIC COUNSELING section.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected males pass the XK pathogenic variant to all of their daughters and
      none of their sons"
    explanation: >-
      The transmission pattern from affected males, which is what determines who in a
      pedigree needs the transfusion-compatibility information this disease turns on.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carrier testing for at-risk females, prenatal testing for a pregnancy at
      increased risk, and preimplantation genetic testing are possible"
    explanation: >-
      The reproductive testing options available once the familial variant is known.

pathophysiology:

- name: XK Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. XK encodes a 50.9 kDa protein that crosses the membrane ten times
    and was originally identified by positional cloning from a 50 kb deletion in McLeod
    patients. Point variants at conserved splice donor and acceptor sites in unrelated
    patients gave the first direct evidence that XK is the responsible gene.
  genes:
  - preferred_term: XK
    term:
      id: hgnc:12811
      label: XK
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  evidence:
  - reference: PMID:8004674
    reference_title: "Isolation of the gene for McLeod syndrome that encodes a novel membrane transport protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nucleotide sequence analysis of XK from two unrelated McLeod patients has
      identified point mutations at conserved splice donor and acceptor sites. These
      findings provide direct evidence that XK is responsible for McLeod syndrome"
    explanation: >-
      The founding gene-disease assertion, from the positional cloning study.
  - reference: PMID:8004674
    reference_title: "Isolation of the gene for McLeod syndrome that encodes a novel membrane transport protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XK encodes a novel protein with structural characteristics of prokaryotic and
      eukaryotic membrane transport proteins"
    explanation: >-
      The original structural assignment. Note this reads XK as a transporter; the
      scramblase function below was established much later and supersedes it.
  downstream:
  - target: Loss of the Kell-XK Membrane Complex
    causal_link_type: DIRECT
    description: >-
      XK is covalently bonded to Kell, so losing XK destabilizes the partner.
  - target: Loss of XK-VPS13A Phospholipid Scrambling at Membrane Contact Sites
    causal_link_type: DIRECT
    description: >-
      The molecular function whose loss is proposed to drive the neurodegeneration.
  - target: Chronic Axonal Motor Neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neuromuscular arm. XK is expressed in peripheral nerve as well as in brain and red
      cell, but no source available to this entry connects its loss to axonal degeneration
      through an identified route, so the intermediates are unknown rather than merely
      unstated.
  - target: Cardiomyopathy and Arrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cardiac arm, drawn from the initiating lesion rather than from the
      neurodegeneration. Nothing derives the cardiomyopathy from the brain disease, and the
      surveillance recommendation treats it as independent by applying to patients with no
      known cardiac involvement. How XK loss injures myocardium is not established.

- name: Loss of the Kell-XK Membrane Complex
  biological_scale: MOLECULAR
  description: >-
    XK and the Kell glycoprotein are joined by a single disulphide bond, Kell Cys72-XK
    Cys347. The two proteins are encoded on different chromosomes - KEL at 7q33, XK at Xp21
    - yet depend on each other in the membrane, which is why an X-linked defect produces an
    abnormality in a chromosome 7 blood group system. Losing XK abolishes the Kx antigen and
    markedly weakens Kell antigen expression: the McLeod blood group phenotype.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:10895256
    reference_title: "Kell, Kx and the McLeod syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A single disulphide bond, Kell Cys 72-XK Cys 347, links Kell to XK"
    explanation: >-
      The covalent link that makes the two proteins interdependent in the membrane.
  - reference: PMID:18167163
    reference_title: "Transfusion support for a patient with McLeod phenotype without chronic granulomatous disease and with antibodies to Kx and Km."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The McLeod phenotype is characterized by weakened expression of antigens in
      the Kell blood group system, absence of Km and Kx antigens, and acanthocytosis"
    explanation: >-
      Defines the serological phenotype that follows from losing the complex.
  downstream:
  - target: Red Cell Membrane Instability and Acanthocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acanthocytes are the morphological consequence, but how loss of the complex distorts
      the membrane skeleton is not established by any source available to this entry.
  - target: Kx and Km Alloimmunization Risk
    causal_link_type: DIRECT
    description: >-
      Antigens the patient has never expressed are seen as foreign when transfused.

- name: Loss of XK-VPS13A Phospholipid Scrambling at Membrane Contact Sites
  biological_scale: MOLECULAR
  description: >-
    The mechanistically informative finding, and the one that reframes the disease. XK forms
    a complex with VPS13A - the lipid transfer protein mutated in chorea-acanthocytosis -
    and when overexpressed relocalizes VPS13A from lipid droplets to subdomains of the
    endoplasmic reticulum. Introducing chorea-acanthocytosis disease variants into VPS13A
    prevents that relocalization. Two clinically near-identical neuroacanthocytosis
    syndromes, one X-linked and one autosomal recessive, therefore converge on dysregulation
    of a single complex.
  molecular_functions:
  - preferred_term: phospholipid scramblase activity
    term:
      id: GO:0017128
      label: phospholipid scramblase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: plasma membrane phospholipid scrambling
    term:
      id: GO:0017121
      label: plasma membrane phospholipid scrambling
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum-plasma membrane contact site
    term:
      id: GO:0140268
      label: endoplasmic reticulum-plasma membrane contact site
  evidence:
  - reference: PMID:32845802
    reference_title: "XK is a partner for VPS13A: a molecular link between Chorea-Acanthocytosis and McLeod Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it forms a complex with VPS13A in human cells and, when overexpressed,
      relocalizes VPS13A from lipid droplets to subdomains of the endoplasmic reticulum"
    explanation: >-
      Establishes the physical partnership and the functional readout used to test it.
  - reference: PMID:32845802
    reference_title: "XK is a partner for VPS13A: a molecular link between Chorea-Acanthocytosis and McLeod Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that dysregulation of a VPS13A-XK complex is the common
      basis for ChAc and McLeod Syndrome"
    explanation: >-
      The unifying claim. Quoted with the authors' own "suggest", because this is a
      cell-biological inference rather than a demonstration in patient neural tissue.
  downstream:
  - target: Striatal Neuronal Loss and Gliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why a lipid-scrambling defect should selectively destroy caudate neurons is not
      established. No source available to this entry connects the scramblase function to
      the regional pattern of degeneration.
  notes: >-
    The scramblase assignment postdates and supersedes the founding paper's reading of XK as
    a membrane transport protein. Both are curated - the earlier one on the XK Loss of
    Function node - because the transporter description is still what many secondary
    sources repeat, and a curator meeting it should be able to see when and by what it was
    replaced.

- name: Red Cell Membrane Instability and Acanthocytosis
  biological_scale: CELLULAR
  description: >-
    Spiculated red cells with irregular thorn-like projections. Acanthocytosis is the
    finding the disease is named for and is present in essentially all affected males, but
    it is neither specific to McLeod syndrome nor proportional to neurological severity.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hematologic manifestations are red blood cell acanthocytosis and
      compensated hemolysis"
    explanation: >-
      Names both haematological consequences and, in "compensated", records that the
      hemolysis does not usually produce clinical anemia.
  downstream:
  - target: Compensated Hemolysis
    causal_link_type: DIRECT
    description: >-
      Abnormally shaped cells are cleared faster.

- name: Compensated Hemolysis
  biological_scale: ORGANISM
  description: >-
    Shortened red cell survival matched by increased production, so haemoglobin is usually
    normal and the hemolysis is detectable biochemically rather than clinically. This node
    is separated from the acanthocytosis above because the compensation is the point: the
    haematological arm of the disease is largely silent in the patient while being
    diagnostically loud on the blood film.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "red blood cell acanthocytosis and compensated hemolysis"
    explanation: >-
      The compensated character of the hemolysis, stated by the source.

- name: Kx and Km Alloimmunization Risk
  biological_scale: ORGANISM
  description: >-
    Because affected males never express Kx or Km, transfused red cells carrying those
    antigens are immunologically foreign. The resulting alloantibodies cause severe
    transfusion reactions, and this is the mechanism behind the disease's one absolute
    contraindication. The antibody repertoire also differs by genotype: patients whose
    deletion extends into CYBB, producing chronic granulomatous disease alongside McLeod
    syndrome, are generally held to be able to make both anti-Km and anti-Kx, whereas
    non-CGD McLeod patients were believed to make only anti-Km - a belief the cited case
    report was written to challenge.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alloantibodies in the Kell and Kx blood group system can cause strong
      reactions to transfusions of incompatible blood and severe anemia in affected male
      newborns of Kell-negative mothers"
    explanation: >-
      Establishes both the transfusion hazard and the separate neonatal alloimmune risk.
  - reference: PMID:18167163
    reference_title: "Transfusion support for a patient with McLeod phenotype without chronic granulomatous disease and with antibodies to Kx and Km."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is generally believed that patients with non-CGD McLeod may develop
      anti-Km but not anti-Kx, but that those with CGD McLeod can develop both anti-Km and
      anti-Kx"
    explanation: >-
      Curated PARTIAL deliberately. This quote states the prevailing belief, and the paper's
      title reports a non-CGD McLeod patient with antibodies to both Kx and Km - that is, a
      counterexample. The rule is recorded here as a belief rather than as fact.

- name: Striatal Neuronal Loss and Gliosis
  biological_scale: TISSUE
  description: >-
    The neurodegenerative core, and it has a consistent spatial gradient. In the largest
    autopsy series assembled, histology showed neuronal loss and gliosis in the basal
    ganglia of every patient, with severity decreasing from the caudate nucleus through the
    putamen to the pallidum. The same gradient appears macroscopically as basal ganglia
    atrophy. Functional imaging detects the process before the movement disorder appears:
    striatal FDG uptake was reduced in a 28-year-old with no movement disorder at all.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: caudate nucleus
    term:
      id: UBERON:0001873
      label: caudate nucleus
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:40898647
    reference_title: "Neuropathological Characterisation of McLeod Syndrome With a Proposed New Grading System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology revealed neuronal loss and accompanying gliosis in the basal ganglia
      of all patients"
    explanation: >-
      The core neuropathological finding, in the largest series examined.
  - reference: PMID:40898647
    reference_title: "Neuropathological Characterisation of McLeod Syndrome With a Proposed New Grading System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a decreasing gradient of severity from the caudate nucleus to the putamen
      and the pallidum, mirroring the macroscopic findings"
    explanation: >-
      The spatial gradient, which is what makes the pathology recognizable rather than
      merely present.
  - reference: PMID:11254778
    reference_title: "Reduction of striatal glucose metabolism in McLeod choreoacanthocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positron emission tomography disclosed a reduction of the striatal FDG uptake
      in both patients, with accentuation in patient 1. Frontal lobe metabolism was not
      affected"
    explanation: >-
      Shows the deficit is striatum-selective rather than global, and the second patient in
      this pair was presymptomatic.
  downstream:
  - target: Chorea and Huntington-Like Neurodegenerative Syndrome
    causal_link_type: DIRECT
    description: >-
      Caudate-predominant striatal loss is the anatomical substrate for the chorea.

- name: Chronic Axonal Motor Neuropathy
  biological_scale: TISSUE
  description: >-
    The arm of the disease that was misnamed for decades. McLeod syndrome was originally
    described as a benign myopathy, but systematic study of ten patients including the
    original index patient found that the muscle weakness and atrophy are predominantly
    neurogenic rather than myopathic. Myopathic changes were present in a minority; every
    patient had neurogenic changes. This is why the entry curates a neuropathy node rather
    than a myopathy node, with the elevated creatine kinase as its biochemical readout.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clear but unspecific myopathic changes were found in only four patients. All
      patients, however, had neurogenic changes of variable degree"
    explanation: >-
      The histological basis for reading the muscle involvement as neurogenic.
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem motor and sensory nerve examinations support the view that muscle
      atrophy and weakness are predominantly due to an axonal motor neuropathy rather than
      to a primary myopathy"
    explanation: >-
      The authors' explicit reassignment of the mechanism from myopathy to axonal
      neuropathy.

- name: Chorea and Huntington-Like Neurodegenerative Syndrome
  biological_scale: ORGANISM
  description: >-
    Adult-onset chorea with cognitive decline and psychiatric disturbance, clinically close
    enough to Huntington disease that McLeod syndrome belongs in its differential. Onset of
    multisystem manifestations is around the fourth decade. The presenting feature is
    frequently psychiatric or epileptic rather than choreiform, so the movement disorder is
    not reliably the first thing seen.
  evidence:
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings confirm that MLS is not a benign condition but rather a
      progressive multisystem disorder sharing many features with Huntington's disease"
    explanation: >-
      States both the progressive multisystem character and the Huntington resemblance.
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients manifested with psychiatric features comprising
      schizophrenia-like psychosis and personality disorder, two presented with generalized
      seizures and one with chorea"
    explanation: >-
      Records that psychiatric and epileptic presentations outnumbered choreiform
      presentation in this series.

- name: Cardiomyopathy and Arrhythmia
  biological_scale: ORGANISM
  description: >-
    Dilated cardiomyopathy with atrial fibrillation and tachyarrhythmia, and a leading cause
    of death. It is curated as a parallel consequence of XK loss rather than downstream of
    the neurodegeneration, because no source available to this entry derives the cardiac
    disease from the neurological one - and the surveillance recommendation treats it as
    independent, applying to patients with no known cardiac involvement.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac manifestations include dilated cardiomyopathy, atrial fibrillation,
      and tachyarrhythmia"
    explanation: >-
      Names the cardiac phenotype.
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients died because of MLS-related complications including sudden
      cardiac death, chronic heart failure and pneumonia between 55 and 69 years"
    explanation: >-
      Establishes cardiac disease as a cause of death rather than an incidental finding.

mechanistic_hypotheses:
- hypothesis_group_id: vps13a_xk_scramblase_complex_model
  status: CANONICAL
  description: >-
    Loss of XK disables a VPS13A-XK lipid handling complex at membrane contact sites, and it
    is that shared complex failure - not anything specific to the Kell blood group system -
    that produces the neurodegeneration. The model's strength is that it explains why an
    X-linked and an autosomal recessive disease look alike; its weakness is that it does not
    yet explain the caudate selectivity, and the evidence is from overexpression in cultured
    human cells rather than from patient neural tissue.
  evidence:
  - reference: PMID:32845802
    reference_title: "XK is a partner for VPS13A: a molecular link between Chorea-Acanthocytosis and McLeod Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ChAc phenotypes resemble those of McLeod Syndrome, caused by mutations in the
      XK gene, suggesting that XK could be a partner protein for VPS13A"
    explanation: >-
      The reasoning that motivated the experiment, and the clinical convergence the model
      is built to explain.

phenotypes:

- category: Hematologic
  name: Acanthocytosis
  description: >-
    Spiculated red cells on the peripheral film, the finding the syndrome family is named
    for.
  phenotype_term:
    preferred_term: Acanthocytosis
    term:
      id: HP:0001927
      label: Acanthocytosis
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hematologic manifestations are red blood cell acanthocytosis and
      compensated hemolysis"
    explanation: >-
      Names acanthocytosis as a defining haematological manifestation. GeneReviews does not
      give a percentage, so no frequency band is asserted here.

- category: Neurological
  name: Chorea
  description: >-
    Choreiform movements developing in adulthood. Seven of ten patients in the
    longest-followed series developed chorea over a mean 15-year follow-up, though only one
    presented with it.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Chorea
    term:
      id: HP:0002072
      label: Chorea
  evidence:

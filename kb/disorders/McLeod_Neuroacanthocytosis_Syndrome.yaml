- category: Musculoskeletal
  name: Elevated Serum Creatine Kinase
  description: >-
    Raised creatine kinase, in the reported series between 300 and 3000 U/L. It is often the
    first objective abnormality and precedes clinical weakness.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  evidence:
  - reference: PMID:18055495
    reference_title: "McLeod myopathy revisited: more neurogenic and less benign."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight patients including the initial index patient showed elevated skeletal
      muscle creatine kinase levels ranging from 300 to 3000 U/L, and had developed muscle
      weakness and atrophy"
    explanation: >-
      8/10 is 80 percent, at the lower boundary of VERY_FREQUENT (80-99 percent), with the
      measured range stated.

- category: Musculoskeletal
  name: Muscle Weakness
  description: >-
    Weakness emerging over years and neurogenic in origin. Disabling leg weakness occurred in

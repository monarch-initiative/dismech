    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had developed muscle weakness and atrophy. Two patients had disabling leg
      weakness"
    explanation: >-
      Same 8/10 denominator as the creatine kinase item, with the severe subset counted
      separately.

- category: Musculoskeletal
  name: Skeletal Muscle Atrophy
  description: >-

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 200 cases have been reported worldwide. The autopsy series cited here, at six
    patients with macroscopic data, is described by its authors as the largest cohort
    examined to date, which is itself an indication of how few cases exist.
  evidence:
  - reference: PMID:40898647
    reference_title: "Neuropathological Characterisation of McLeod Syndrome With a Proposed New Grading System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of the largest MLS cohort to date has enabled the recognition of
      consistent morphological patterns that form the basis for a reproducible
      neuropathological grading system in this extremely rare disease"
    explanation: >-
      The source's own characterization of the disease as extremely rare, and an indication
      of the scale of the largest available series.

genetic:
- name: XK
  gene_term:
    preferred_term: XK
    term:
      id: hgnc:12811
      label: XK
  relationship_type: CAUSATIVE
  association: >-
    Hemizygous XK loss-of-function variants cause McLeod neuroacanthocytosis syndrome in
    males. About 90 percent are intragenic variants and about 10 percent are Xp21.1 deletions
    involving XK. The deletion class matters clinically beyond XK itself: XK sits adjacent
    to CYBB, so a large deletion can remove both and produce chronic granulomatous disease
    together with McLeod syndrome, and deletions extending further can reach DMD.
  evidence:
  - reference: PMID:8004674
    reference_title: "Isolation of the gene for McLeod syndrome that encodes a novel membrane transport protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 50 kb deletion was detected by screening DNA from patients with radiolabeled
      whole cosmids, and two transcription units were identified within this deletion. The
      mRNA expression pattern of one of them, designated as XK, correlates closely to the
      McLeod phenotype"
    explanation: >-
      The positional cloning that identified XK, and the deletion that led to it.
  - reference: PMID:22111908
    reference_title: "Chronic granulomatous disease, the McLeod phenotype and the contiguous gene deletion syndrome-a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When larger X-chromosomal deletions occur, including the XK gene deletion, a
      so-called \"Contiguous Gene Deletion Syndrome\" may result. The contiguous gene
      deletion syndrome is known to associate the Kell phenotype/McLeod syndrome with
      diseases such as X-linked chronic granulomatous disease, Duchenne muscular dystrophy,
      and X-linked retinitis pigmentosa"
    explanation: >-
      States the contiguous gene deletion mechanism and names all three neighbouring
      disorders a large Xp21 deletion can bring with it.
  notes: >-
    Xp21 gene order places XK next to CYBB, and a deletion large enough to remove both
    produces a patient with chronic granulomatous disease who is also McLeod-positive. This
    is not merely a curiosity: the CGD-McLeod patient needs granulocyte transfusions for
    infection while being at risk of Kx alloimmunization from them, so the two diagnoses
    interact in management. The KB entry Chronic_Granulomatous_Disease already records the
    McLeod association from the other direction.

diagnosis:
- name: Peripheral Blood Film and Kell/Kx Phenotyping
  description: >-
    The film shows acanthocytes and serology shows the McLeod blood group phenotype - absent
    Kx and Km, weakened Kell antigens. The serology is what distinguishes McLeod syndrome
    from the other neuroacanthocytosis syndromes at the bedside, and it should be obtained
    before any transfusion rather than after.
  diagnosis_term:
    preferred_term: Blood Typing Test
    term:
      id: NCIT:C210738
      label: Blood Typing Test
  evidence:
  - reference: PMID:18167163
    reference_title: "Transfusion support for a patient with McLeod phenotype without chronic granulomatous disease and with antibodies to Kx and Km."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "weakened expression of antigens in the Kell blood group system, absence of Km
      and Kx antigens, and acanthocytosis"
    explanation: >-
      The serological and morphological findings that define the phenotype.

- name: Molecular Genetic Testing
  description: >-
    Sequencing of XK, with deletion or copy number analysis when sequencing is negative,
    since about one in ten affected males has an Xp21.1 deletion rather than an intragenic variant.
    Testing should extend to defining whether a deletion involves CYBB.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MLS is established in a male proband with: suggestive
      clinical, laboratory, and neuroimaging studies; a family history consistent with
      X-linked inheritance; and either a hemizygous XK pathogenic variant"
    explanation: >-
      Establishes molecular confirmation as the diagnostic endpoint.

treatments:
- name: Symptomatic Treatment of Chorea
  description: >-
    Dopamine antagonists and the dopamine depletor tetrabenazine are used to reduce chorea.
    Nothing modifies the underlying disease. Note the interaction with the muscle
    involvement: neuroleptic use is one of the two circumstances under which GeneReviews
    advises monitoring creatine kinase for rhabdomyolysis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tetrabenazine
      term:
        id: CHEBI:9467
        label: tetrabenazine
    - preferred_term: clozapine
      term:
        id: CHEBI:3766
        label: clozapine
    - preferred_term: quetiapine
      term:
        id: CHEBI:8707
        label: quetiapine
  target_mechanisms:
  - target: Chorea and Huntington-Like Neurodegenerative Syndrome
    treatment_effect: INHIBITS
    description: >-
      Dopamine antagonism and depletion suppress the choreiform output of striatal
      degeneration. This is symptomatic action on the endpoint node, not on the
      neurodegeneration that produces it - nothing here slows the disease.
    evidence:
    - reference: PMID:20301528
      reference_title: "McLeod Neuroacanthocytosis Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the dopamine depletory (tetrabenazine) to ameliorate chorea"
      explanation: >-
        States the target symptom the agents act on.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "use of dopamine antagonists (e.g., tiapride, clozapine, quetiapine) and the
      dopamine depletory (tetrabenazine) to ameliorate chorea"
    explanation: >-
      Names the agents. Tiapride is named by the source but not bound as a therapeutic_agent
      because CHEBI carries it only as the hydrochloride salt, which is a different entity
      from the drug the source names.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monitor serum CK concentrations for evidence of rhabdomyolysis if excessive
      movement disorders are present or if neuroleptic medications are being used"
    explanation: >-
      The monitoring requirement that attaches to this treatment, which is why the two are
      curated together rather than in separate entries.

- name: Transfusion Restricted to Kx-Negative Blood
  description: >-
    The single most actionable management point in the disease, and it is a restriction
    rather than a therapy. Patients must not receive Kx-positive blood; Kx-negative,
    autologous, or banked homologous blood should be used instead. Because compatible blood
    is very hard to source, GeneReviews recommends identifying at-risk relatives early
    enough to allow prophylactic cryopreservation - the intervention has to be planned years
    before it is needed.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Blood Transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Kx and Km Alloimmunization Risk
    treatment_effect: INHIBITS
    description: >-
      Withholding Kx-positive blood removes the antigen exposure that drives
      alloimmunization. Uniquely among the entries here, this acts on the mechanism itself
      rather than on a downstream symptom - which is what makes a restriction the most
      effective intervention in the disease.
    evidence:
    - reference: PMID:20301528
      reference_title: "McLeod Neuroacanthocytosis Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Kx-negative blood or, if possible, banked autologous or homologous blood
        should be used"
      explanation: >-
        The action that prevents the exposure.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Blood transfusions with Kx antigens in males
      with MLS. Kx-negative blood or, if possible, banked autologous or homologous blood
      should be used"
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid entry, quoted directly. This is a
      contraindication, and the treatment entry exists to carry it.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "possible prophylactic cryopreservation of autologous or homologous blood for
      use in future transfusions"
    explanation: >-
      The forward-planning step that makes the restriction survivable in practice.

- name: Cardiac Surveillance and Device Therapy
  description: >-
    Because cardiac disease is a leading cause of death and can be present without symptoms,
    surveillance is recommended for patients with no known cardiac involvement, not only for
    those already affected. Prophylactic pacemaker or implantable cardioverter-defibrillator
    placement is to be considered.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Cardiomyopathy and Arrhythmia
    treatment_effect: INHIBITS
    description: >-
      Device therapy addresses the arrhythmic consequence of the cardiomyopathy rather than
      the myocardial disease. Surveillance is directed at the same node and is what
      identifies who needs the device.
    evidence:
    - reference: PMID:20301528
      reference_title: "McLeod Neuroacanthocytosis Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "consideration of placement of prophylactic cardiac pacemaker / implantable
        cardioverter-defibrillator"
      explanation: >-
        The intervention aimed at the cardiac node.
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consideration of placement of prophylactic cardiac pacemaker / implantable
      cardioverter-defibrillator"
    explanation: >-
      The device recommendation.
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for those without known cardiac involvement, Holter EKG, echocardiography, and
      cardiac biomarkers (e.g., troponin T/I, pro BNP) every two years"
    explanation: >-
      Establishes surveillance of the apparently unaffected, with the stated interval.

- name: Genetic Counseling and Testing of At-Risk Relatives
  description: >-
    X-linked counseling, but with an unusual urgency: identifying at-risk relatives is
    recommended not only for reproductive decisions but so that transfusion-compatibility
    information exists before it is needed and so that cardiac events can be pre-empted.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301528
    reference_title: "McLeod Neuroacanthocytosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of apparently asymptomatic
      male and female at-risk relatives of any age in order to identify as early as possible
      those who would benefit from (1) detailed blood compatibility information to prevent
      transfusion of Kx+ homologous blood products"
    explanation: >-
      States the non-reproductive rationale for cascade testing, which is what distinguishes
      counseling here from the generic case.

differential_diagnoses:
- name: Chorea-acanthocytosis (VPS13A disease)
  description: >-
    The closest mimic and, as it turns out, a mechanistic relative rather than a
    coincidence. VPS13A disease produces acanthocytosis, chorea, psychiatric features and
    raised creatine kinase, and the two proteins form a complex, so the clinical similarity
    has a molecular basis.
  distinguishing_features:
  - >-
    Inheritance: McLeod syndrome is X-linked and affects males; chorea-acanthocytosis is
    autosomal recessive and affects both sexes.
  - >-
    Blood group serology: the McLeod phenotype - absent Kx and Km with weakened Kell
    antigens - is present only in McLeod syndrome and is what settles the distinction.
  - >-
    Cardiac involvement is prominent in McLeod syndrome and is not a defining feature of
    chorea-acanthocytosis.
  evidence:
  - reference: PMID:32845802
    reference_title: "XK is a partner for VPS13A: a molecular link between Chorea-Acanthocytosis and McLeod Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ChAc phenotypes resemble those of McLeod Syndrome, caused by mutations in the
      XK gene"
    explanation: >-
      States the phenotypic resemblance that makes this the primary differential.

- name: Huntington disease
  description: >-
    Adult-onset chorea with cognitive decline, psychiatric disturbance and caudate atrophy -
    the clinical and radiological picture McLeod syndrome reproduces closely enough that the
    autopsy series cited here draws the analogy explicitly and models its proposed
    neuropathological grading system on the Huntington one.
  distinguishing_features:
  - >-
    Acanthocytosis and the McLeod blood group phenotype are absent in Huntington disease.
  - >-
    Elevated creatine kinase is characteristic of McLeod syndrome and not of Huntington
    disease.
  - >-
    Huntington disease is autosomal dominant with a CAG repeat expansion in HTT; McLeod
    syndrome is X-linked.
  evidence:
  - reference: PMID:40898647
    reference_title: "Neuropathological Characterisation of McLeod Syndrome With a Proposed New Grading System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analogous to Huntington's disease (HD), MLS displays cognitive and behavioural
      symptoms besides the progressive movement disorder"
    explanation: >-
      The stated clinical analogy, from the neuropathology series that also borrows the
      Huntington grading framework.

- name: Chronic granulomatous disease with contiguous Xp21 deletion
  description: >-
    Not a mimic but a co-occurrence, and it runs in the other direction: a boy presenting
    with CGD may also be McLeod-positive because one deletion removed both CYBB and XK. That
    matters because CGD management involves granulocyte transfusion, which is exactly what a
    McLeod patient cannot safely receive.
  distinguishing_features:
  - >-
    Presentation is usually with recurrent bacterial and fungal infection in childhood
    rather than with a movement disorder, since the CGD manifests decades before the
    neurodegeneration.
  - >-
    Deletion analysis rather than XK sequencing is what detects it.
  evidence:
  - reference: PMID:3334897
    reference_title: "Gene deletion in a patient with chronic granulomatous disease and McLeod syndrome: fine mapping of the Xk gene locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that the X-CGD and McLeod loci are physically close in
      the p21 region of the X chromosome proximal to the Duchenne muscular dystrophy locus"
    explanation: >-
      The mapping result establishing physical proximity of the two loci, which is what
      makes a single deletion able to remove both.

discussions:

- discussion_id: gap_why_the_caudate
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of XK-VPS13A Phospholipid Scrambling at Membrane Contact Sites
  - pathophysiology#Striatal Neuronal Loss and Gliosis
  prompt: >-
    XK is expressed well beyond the striatum and its lipid-scrambling function is not
    region-specific. Why does its loss destroy the caudate nucleus in particular?
  rationale: >-
    This is the entry's central unexplained step and the edge is marked
    INDIRECT_UNKNOWN_INTERMEDIATES for exactly that reason. The neuropathology is
    unambiguous about the gradient - caudate worst, then putamen, then pallidum, in every
    patient examined - and the imaging shows the striatal deficit before symptoms appear.
    But nothing in the available evidence connects a plasma membrane phospholipid scrambling
    defect to that anatomy. The same problem exists for chorea-acanthocytosis and for
    Huntington disease, so an answer would likely generalize: striatal medium spiny neurons
    are selectively vulnerable across mechanistically unrelated diseases, and whatever makes
    them so may matter more here than the specific lesion.
  proposed_experiments:
  - experiment_id: exp_regional_lipid_asymmetry_in_xk_loss
    name: Regional phospholipid asymmetry and VPS13A localization across brain regions
    description: >-
      Measure plasma membrane phosphatidylserine exposure and VPS13A subcellular
      distribution in striatal versus cortical and cerebellar neurons from XK-null human
      iPSC-derived cultures and from an XK-null mouse, at several ages. If the scrambling
      defect is uniform across regions while degeneration is not, the selectivity lies in
      the neurons rather than in the lesion, and the search should move to what distinguishes
      medium spiny neurons.

- discussion_id: controversy_anti_kx_in_non_cgd_mcleod
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Kx and Km Alloimmunization Risk
  prompt: >-
    Can McLeod patients without chronic granulomatous disease form anti-Kx, or only anti-Km?
  rationale: >-
    The prevailing rule holds that only CGD-McLeod patients - those whose deletion removes
    CYBB as well as XK - form anti-Kx, while non-CGD McLeod patients form anti-Km alone. The
    case report cited on that node was written to report the exception: a patient with the
    McLeod phenotype, without CGD, and with antibodies to both Kx and Km. The entry curates
    the general rule as a stated belief rather than as fact for that reason. The distinction
    is not academic. If the rule holds, non-CGD patients have a wider pool of compatible
    donors than CGD patients; if exceptions are common, every McLeod patient needs the
    stricter standard, and the cryopreservation recommendation becomes more urgent rather
    than less. A single counterexample does not settle the frequency, which is what a
    transfusion service would need.
  proposed_experiments:
  - experiment_id: exp_alloantibody_survey_by_deletion_extent
    name: Alloantibody specificity surveyed against deletion genotype
    description: >-
      Across a multi-centre McLeod cohort, pair each patient's antibody specificities with
      the precise extent of their XK lesion (intragenic variant, XK-only deletion, XK plus CYBB)
      and their transfusion history. This would establish whether anti-Kx formation tracks
      with CYBB involvement or simply with exposure, which is what determines the
      compatibility standard each genotype needs.

- discussion_id: mismatch_scramblase_evidence_is_overexpression_in_cell_lines
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of XK-VPS13A Phospholipid Scrambling at Membrane Contact Sites
  prompt: >-
    Does a VPS13A relocalization assay driven by XK overexpression in cultured cells report
    what XK does at physiological abundance in a human neuron?
  rationale: >-
    The XK-VPS13A partnership is the entry's mechanistic centrepiece, and it rests on
    overexpression. The functional readout - XK relocalizing VPS13A from lipid droplets to
    ER subdomains - was observed "when overexpressed", and the disease-variant control shows
    that chorea-acanthocytosis mutations block it. That is a strong argument for the
    interaction being real and disease-relevant. It is a much weaker argument about what
    happens when XK is simply absent at normal expression levels, in a post-mitotic neuron,
    over decades. Overexpression can force interactions that are minor or absent
    physiologically, and relocalization away from lipid droplets is not obviously the same
    event as the loss-of-function state in patients. No source available to this entry
    reports VPS13A localization or lipid asymmetry in McLeod patient neural tissue.
  proposed_experiments:
  - experiment_id: exp_vps13a_localization_in_patient_neurons
    name: VPS13A localization at endogenous XK levels in patient-derived neurons
    description: >-
      Compare VPS13A subcellular distribution and ER-plasma membrane contact site
      architecture in neurons differentiated from McLeod patient iPSCs against isogenic
      XK-corrected controls, without overexpressing either protein. Reproducing the
      relocalization defect at endogenous abundance would move the model from plausible to
      demonstrated; failing to reproduce it would mean the complex is real but the
      overexpression readout is not the disease mechanism.

notes: >-
  Scope. This entry curates McLeod neuroacanthocytosis syndrome as the multisystem disease
  of XK loss. It does not curate the McLeod blood group phenotype as a standalone
  serological entity, and it does not curate chronic granulomatous disease, which has its
  own KB entry recording the McLeod association from the CGD side.
  MONDO label. MONDO:0018945 is labelled "XK-related neurodegenerative disease". The entry
  binds that canonical label while using "McLeod neuroacanthocytosis syndrome" as the
  preferred_term, since that is the clinical name in every source cited here. The MONDO
  label is also arguably narrower than the disease: calling it neurodegenerative omits the
  haematological, muscular and cardiac arms that this entry curates.
  Deep research provenance. The report was generated with the claude_code provider and
  carried needs_review true: 18 of 18 references resolved with confabulation_rate 0.0, but
  one quote was unsupported (PMID:8004674) and one reference was flagged off topic
  (PMC:PMC8500837). Neither affected this entry - the PMC reference is not cited, and every
  snippet attributed to PMID:8004674 here was taken directly from the cached abstract rather
  than from the report.
  Two phenotypes suggested in review are deliberately not curated. Ventricular tachycardia
  and hepatosplenomegaly are both reported in the wider literature, but neither appears in
  any reference cited by this entry in a quotable form - GeneReviews names "tachyarrhythmia"
  generically, which the atrial fibrillation entry already carries. Adding either would mean
  citing a source for a claim it does not make. A curator with a source for them should add
  them.
  NEC preflight returned WARN rather than PASS, and the warning is benign. XK is mentioned
  52 times against VPS13A at 18, and the OMIM identifier in the report matches the MONDO
  xref exactly (300842). VPS13A appears because chorea-acanthocytosis is this disease's
  principal differential and because XK and VPS13A are genuine molecular partners - the
  rival-gene heuristic cannot distinguish a second disease entity from a binding partner.
  CYBB, the third-ranked gene, appears for the same structural reason: it is the contiguous
  deletion neighbour.

discussions:
- discussion_id: ga1-compartment-source-partition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which liver-derived molecular species influences the brain, and how do hepatic and intracerebral source fractions change with genotype and catabolic state?
  rationale: Liver-directed rescue and local astrocyte production are both supported, while BBB experiments show limited free-acid transport. Global AASS perturbation and IV-versus-ICV precursor delivery alone do not partition source. Tissue-specific perturbation, matched precursor enrichment, time courses and measurements in liver, plasma, CSF and brain are needed; human CSF is not interchangeable with intracellular striatal pools.
  evidence:
  - reference: PMID:37075130
    reference_title: Rescue of glutaric aciduria type I in mice by liver-directed therapies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In a series of experiments using knockout mice of the lysine catabolic pathway and liver cell transplantation, we uncovered that toxic GA-1 catabolites in the brain originated from the liver.
    explanation: Liver perturbation and transplantation support a hepatic contribution in mice. The experiment does not quantify its fraction in humans or identify the circulating species.
  - reference: PMID:25968119
    reference_title: Striatal neuronal death mediated by astrocytes from the Gcdh-/- mouse model of glutaric acidemia type I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Upon Lys treatment, Gcdh-/- astrocytes synthetized and released GA and 3-hydroxyglutaric acid (3HGA).
    explanation: Direct production by isolated mouse astrocytes establishes a local capacity; it does not measure the fraction of human brain metabolites produced locally.
  - reference: PMID:16573641
    reference_title: Intracerebral accumulation of glutaric and 3-hydroxyglutaric acids secondary to limited flux across the blood-brain barrier constitute a biochemical risk factor for neurodegeneration in glutaryl-CoA dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These results suggest limited flux of GA and 3-OH-GA across the BBB
    explanation: Experiments support restricted cerebral exchange, not an absolutely impermeable barrier.
  - reference: PMID:20302929
    reference_title: 'Glutaric aciduria type I and methylmalonic aciduria: simulation of cerebral import and export of accumulating neurotoxic dicarboxylic acids in in vitro models of the blood-brain barrier and the choroid plexus.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: low but specific efflux transport for GA, 3-OH-GA, and MMA across pBCEC
    explanation: Transport assays demonstrate a limited specific efflux pathway.
- discussion_id: ga1-cellular-neurotoxicity-context
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Which astrocytic, energy, excitotoxic and inflammatory effects determine human striatal injury under clinically relevant exposure?
  rationale: Astrocyte-mediated toxicity is experimentally supported, but direct excitotoxicity differs across neuronal culture systems. The GCDH-knockout iPSC line is an enabling resource rather than an executed compartmental disease study. Human cell differentiation, nutrient-state controls and metabolite-specific dose-response experiments could distinguish mechanisms.
  evidence:
  - reference: PMID:25968119
    reference_title: Striatal neuronal death mediated by astrocytes from the Gcdh-/- mouse model of glutaric acidemia type I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Antioxidants abrogated the neuronal death induced by astrocytes exposed to Lys or GA.
    explanation: Antioxidant rescue supports oxidative stress-dependent non-cell-autonomous toxicity in this culture system.
  - reference: PMID:12149496
    reference_title: Ca(2+) and Na(+) dependence of 3-hydroxyglutarate-induced excitotoxicity in primary neuronal cultures from chick embryo telencephalons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NMDA receptor activation and subsequent disturbance of Ca(2+) homeostasis contribute to 3-OH-GA-induced cell damage.
    explanation: Receptor expression and chick-neuron experiments support a possible direct 3-OH-GA excitotoxic mechanism.
  - reference: PMID:15262270
    reference_title: 3-Hydroxyglutaric acid fails to affect the viability of primary neuronal rat cells.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: 3OHG is not excitotoxic in this model of neuronal rat cell cultures despite the presence of functional NMDA receptors.
    explanation: Negative rat-neuron findings limit generalization across culture models and argue against a universal direct-toxin mechanism.

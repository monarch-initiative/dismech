diagnosis:
- name: Newborn screening
  description: Tandem mass spectrometry measures C5DC. Low-excreter false negatives occur; normal screening does not exclude GA1 in a symptomatic child. Digital-tier classifiers remain dependent on the population and validation set.
  evidence:
  - reference: PMID:29665094
    reference_title: 'Newborn screening: A disease-changing intervention for glutaric aciduria type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, cumulative sensitivity of NBS is 95.6%, but it is lower (84%) for patients with low excreter phenotype.
    explanation: Prospective German screening follow-up quantifies the low-excreter limitation.
  - reference: PMID:39728403
    reference_title: "Digital-Tier Strategy Improves Newborn Screening for Glutaric Aciduria Type 1."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the proposed digital-tier strategy based on logistic regression analysis, ridge regression, and support vector machine reduced the false-positive rate by over 90% compared to regular NBS while identifying all confirmed individuals with GA1 correctly.
    explanation: Machine learning approaches can dramatically improve NBS specificity for GA1.
- name: Biochemical and molecular confirmation
  description: Quantitative organic acids and acylcarnitines support suspicion; biallelic pathogenic GCDH variants establish the diagnosis. When molecular testing is uncertain, GCDH activity in fibroblasts or leukocytes can resolve it. Metabolic treatment begins promptly when GA1 is suspected while confirmation proceeds.
  evidence:
  - reference: PMID:31536184
    reference_title: Glutaric Acidemia Type 1.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: identification of biallelic pathogenic variants in GCDH
    explanation: GeneReviews specifies molecular confirmation.
  - reference: PMID:31536184
    reference_title: Glutaric Acidemia Type 1.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: detection of significantly reduced activity of the enzyme glutaryl-CoA dehydrogenase (GCDH) in cultured fibroblasts or leukocytes.
    explanation: Enzyme assay is useful when molecular results are uncertain.
has_subtypes:
- name: High excreter biochemical phenotype
  description: Very low GCDH activity is associated with high GA excretion. Extrastriatal and cognitive abnormalities are enriched in this group; clinical severity is not determined by excretion alone.

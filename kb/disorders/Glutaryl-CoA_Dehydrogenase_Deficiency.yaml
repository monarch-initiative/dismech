  description: Acute or insidious bilateral striatal injury causes persistent motor dysfunction. Acute episodes cluster in infancy and early childhood, generally before age three and occasionally up to six years, during infection, fever, fasting or surgery. Injury is not inevitable after newborn screening and adherent preventive treatment.

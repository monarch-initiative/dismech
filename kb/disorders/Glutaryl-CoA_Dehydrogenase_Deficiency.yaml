- name: GCDH enzymatic deficiency
  description: >-
    Biallelic pathogenic GCDH variants reduce mitochondrial oxidative decarboxylation of glutaryl-CoA
    to crotonyl-CoA, impairing the shared lysine, hydroxylysine and tryptophan degradation
    pathway. Glutaryl-CoA and organic-acid derivatives accumulate. Glutarylcarnitine is a
    carnitine conjugate and diagnostic readout, not an established neurotoxin.

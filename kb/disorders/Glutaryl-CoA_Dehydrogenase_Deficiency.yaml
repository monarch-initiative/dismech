  evidence:
  - reference: PMID:20732827
    reference_title: "Glutaric aciduria type 1 in South Africa-high incidence of glutaryl-CoA dehydrogenase deficiency in black South Africans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for the A293T mutation was found 1 in 36 (95% CI; 1/54 - 1/24) unrelated black South African newborns (n=750) giving a predicted prevalence rate for GA 1 of 1 in 5184 (95% CI; 1/11664 - 1/2304) in this population."
    explanation: Newborn carrier screening and founder-mutation analysis provide a quantitative prevalence estimate for this high-risk population.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_ga1_metabolic_model
  hypothesis_label: Canonical GCDH Deficiency-Toxic Metabolite Model
  status: CANONICAL
  description: >-
    Biallelic GCDH loss of function causes accumulation of glutaryl-CoA and organic-acid derivatives
    that contribute to cerebral metabolic injury. Glutarylcarnitine reflects the metabolic
    block and carnitine conjugation; it is not an established neurotoxin.
  notes: >-
    The core enzyme-deficiency model is compatible with both local cerebral production and
    a hepatic contribution. Low-excreter peripheral biomarkers do not exclude brain risk.
    Treatment outcome depends strongly on early diagnosis and adherence, so residual injury
    after screening does not itself prove a missing hepatic mechanism. Astrocytic, bioenergetic,
    excitotoxic and vascular mechanisms have differing experimental support.
  evidence:
  - &id001
    reference: PMID:17879145
    reference_title: Biochemistry and bioenergetics of glutaryl-CoA dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: catalyses the oxidative decarboxylation of glutaryl-CoA to crotonyl-CoA and CO2.
    explanation: Defines the actual GCDH substrate and reaction; free glutaric acid is not the substrate.
  - &id002
    reference: PMID:36221165
    reference_title: 'Recommendations for diagnosing and managing individuals with glutaric aciduria type 1: Third revision.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: resulting in deficiency of mitochondrial glutaryl-CoA dehydrogenase (GCDH) and, consequently, accumulation of glutaric acid, 3-hydroxyglutaric acid, glutaconic acid and glutarylcarnitine
    explanation: The guideline summarizes the inherited metabolic block and its biochemical consequences.
  - &id008
    reference: PMID:25968119
    reference_title: Striatal neuronal death mediated by astrocytes from the Gcdh-/- mouse model of glutaric acidemia type I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Antioxidants abrogated the neuronal death induced by astrocytes exposed to Lys or GA.
    explanation: Antioxidant rescue supports oxidative stress-dependent non-cell-autonomous toxicity in this culture system.
  - reference: PMID:29665094
    reference_title: 'Newborn screening: A disease-changing intervention for glutaric aciduria type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Presymptomatic start of treatment according to current guideline recommendations clearly improves the neurologic outcome (MD: 7% of patients)'
    explanation: The outcome of guideline-adherent treatment qualifies unstratified failure-rate claims.
- hypothesis_group_id: intracerebral_catabolite_origin_model
  hypothesis_label: Intracerebral Catabolite Origin Model
  status: ALTERNATIVE
  description: >-
    Local cerebral synthesis and limited efflux contribute to brain metabolite accumulation.
    Evidence supports this component without establishing an exclusively intracerebral source
    or excluding hepatic effects.
  evidence:
  - &id003
    reference: PMID:25968119
    reference_title: Striatal neuronal death mediated by astrocytes from the Gcdh-/- mouse model of glutaric acidemia type I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Upon Lys treatment, Gcdh-/- astrocytes synthetized and released GA and 3-hydroxyglutaric acid (3HGA).
    explanation: Direct production by isolated mouse astrocytes establishes a local capacity; it does not measure the fraction of human brain metabolites produced locally.
  - &id005
    reference: PMID:16573641
    reference_title: Intracerebral accumulation of glutaric and 3-hydroxyglutaric acids secondary to limited flux across the blood-brain barrier constitute a biochemical risk factor for neurodegeneration in glutaryl-CoA dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These results suggest limited flux of GA and 3-OH-GA across the BBB
    explanation: Experiments support restricted cerebral exchange, not an absolutely impermeable barrier.
  - &id006
    reference: PMID:20302929
    reference_title: 'Glutaric aciduria type I and methylmalonic aciduria: simulation of cerebral import and export of accumulating neurotoxic dicarboxylic acids in in vitro models of the blood-brain barrier and the choroid plexus.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: low but specific efflux transport for GA, 3-OH-GA, and MMA across pBCEC
    explanation: Transport assays demonstrate a limited specific efflux pathway.
  notes: OpenScientist review retained local production but rejected absolute barrier impermeability and quantitative tissue-localization from global AASS perturbations. See the report assessment for source and analysis limitations.
- hypothesis_group_id: hepatic_catabolite_origin_model
  hypothesis_label: Hepatic Catabolite Origin and Transport Model
  status: EMERGING
  description: >-
    Liver-directed mouse interventions support a therapeutically important hepatic contribution
    to cerebral GA1 metabolite burden. The transported species, relative contribution and
    human translation remain unresolved.
  evidence: &id004
  - &id017
    reference: PMID:37075130
    reference_title: Rescue of glutaric aciduria type I in mice by liver-directed therapies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In a series of experiments using knockout mice of the lysine catabolic pathway and liver cell transplantation, we uncovered that toxic GA-1 catabolites in the brain originated from the liver.
    explanation: Liver perturbation and transplantation support a hepatic contribution in mice. The experiment does not quantify its fraction in humans or identify the circulating species.
  notes: OpenScientist assessment rejects quantitative predominance, direct enzymatic clearance of free GA by GCDH, and the inference that vascular barrier injury proves increased catabolite influx. Complementary local cerebral synthesis remains supported.

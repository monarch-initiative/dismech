treatments:
- name: Lysine-restricted diet
  description: 'A specialist-supervised low-lysine diet supplies an appropriate amount of natural protein and may use lysine-free, tryptophan-reduced amino-acid formula. Lysine is essential: a completely lysine-free diet is not intended. Adequate energy and nutrition prevent catabolism and growth failure; dietary intensity can be relaxed after age six under specialist guidance.'

  evidence:
  - reference: PMID:21628695
    reference_title: Cellular mechanisms of neurovascular damage and repair after stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ischemic strokes, severe blood flow deficits in the core rapidly
      decrease ATP levels and energy stores.
    explanation: >-
      This supports energy failure as an early consequence of ischemic core
      hypoperfusion.
  - reference: PMID:20670828
    reference_title: "The science of stroke: mechanisms in search of treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ischemic penumbra then denotes an “at risk” region that is
      functionally impaired, but potentially salvageable.
    explanation: >-
      This supports the penumbra as an at-risk but potentially salvageable
      tissue compartment.
  downstream:
  - target: Post-Ischemic Mitochondrial Dysfunction
    description: >-
      Energy failure and the return of oxygen at reperfusion load neuronal
      mitochondria with calcium and reactive oxygen species.
    evidence:
    - reference: PMID:25383517
      reference_title: "Ischaemic accumulation of succinate controls reperfusion injury through mitochondrial ROS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "selective accumulation of the citric acid cycle intermediate succinate is a universal metabolic signature of ischaemia in a range of tissues and is responsible for mitochondrial ROS production during reperfusion"
      explanation: >-
        In vivo metabolomics links the ischemic phase, through succinate
        accumulation, to the mitochondrial ROS produced on reperfusion.
  - target: Excitotoxic and oxidative neuronal injury
    description: >-
      Energy failure disrupts ionic gradients and glutamate handling,
      triggering calcium overload, oxidative injury, and cell death.
  - target: Neurovascular inflammation and barrier disruption
    description: >-
      Ischemic injury activates vascular, glial, and immune responses in the
      neurovascular unit.
  - target: Post-Ischemic Autophagic-Lysosomal Dysfunction
    description: >-
      Energy failure activates macroautophagy within hours of occlusion, with
      autophagosome numbers and autophagy-marker levels in the ischemic
      penumbra rising over the following days.
    evidence:
    - reference: PMID:33974897
      reference_title: "Dynamic changes in Beclin-1, LC3B and p62 at various time points in mice with temporary middle cerebral artery occlusion and reperfusion (tMCAO)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Beclin-1, LC3B, ROS, 4-HNE, 8-OHDG, GFAP, TNF-α and IL-6 levels increased (P < 0.01), while p62 and IL-10 levels decreased (P < 0.01) after tMCAO compared to those in the sham group."
      explanation: >-
        Directly ties post-occlusion energy/oxidative stress to the induction
        of autophagy markers (Beclin-1 up, p62 down) in this same tMCAO model.
  - target: Astrocyte and Cerebral Endothelial Cell Senescence
    description: >-
      Astrocytes and cerebral endothelial cells within the ischemic territory
      undergo acute cellular senescence following arterial occlusion.
    evidence:
    - reference: PMID:37324944
      reference_title: "Ability of Local Clearance of Senescent Cells in Ipsilateral Hemisphere to Mitigate Acute Ischemic Brain Injury in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "acute senescence is triggered by middle cerebral artery occlusion (MCAO) surgery, particularly in astrocytes and cerebral endothelial cells (CECs)"
      explanation: >-
        Establishes this specific edge: MCAO-induced ischemia triggers acute
        senescence in astrocytes and cerebral endothelial cells.

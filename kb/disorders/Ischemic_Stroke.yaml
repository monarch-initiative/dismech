- accession: geo:GSE307081
  title: Ischemic stroke accelerates atherosclerosis progression via FTO-mediated epigenetic modification
  description: Residual risk of stroke recurrence persists despite the administration of the prevention measures. The recurrent risk is particularly high in patients with atherosclerosis. However, the underlying mechanisms leading to atherosclerosis progression and recurrent stroke have not been fully understood. We found that stroke accelerated atherosclerosis progression.FTO overexpression suppressed atheroprogression after stroke via inhibiting autophagy-dependent ferroptosis.

- name: Post-Ischemic Mitochondrial Dysfunction
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  biological_scale: CELLULAR
  description: >-
    After arterial occlusion and reperfusion, neuronal mitochondria generate
    reactive oxygen species and open the permeability transition pore, which
    couples the energy failure of the penumbra to neuronal death. In rodent
    focal ischemia, mitochondria in the ischemic focus lose respiratory
    capacity, and succinate that accumulates during ischemia is re-oxidized on
    reperfusion, driving the reactive oxygen species burst by reverse electron
    transport at complex I. This is an acute injury process, not the age-related decline the conformed module
    describes; the shared element is the bioenergetic-failure and oxidative-stress
    state. Mechanistic support is almost entirely from rodents, and the one
    randomized human test of targeting the pore (cyclosporine) missed its
    primary endpoint, so the causal weight of this node in human stroke is
    unsettled.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Oxidative Phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: Reactive Oxygen Species Metabolism
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  locations:
  - preferred_term: Cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: Striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:8571432
    reference_title: Mitochondrial generation of reactive oxygen species after brain ischemia in the rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      reactive oxygen species generated by mitochondrial electron transport
      escape cellular antioxidant defenses and promote highly damaging hydroxyl
      radical activity after transient brain ischemia in the rat
    explanation: >-
      Rat global ischemia/reperfusion data showing mitochondrial ROS generation;
      not human evidence.
  - reference: PMID:16103352
    reference_title: Cyclophilin D is a component of mitochondrial permeability transition and mediates neuronal cell death after focal cerebral ischemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CypD-deficient mice displayed a dramatic reduction in brain infarct size
      after acute middle cerebral artery occlusion and reperfusion
    explanation: >-
      Mouse knockout evidence that the mitochondrial permeability transition
      pore contributes to infarct size after focal ischemia.
  - reference: PMID:21130757
    reference_title: The value of serial plasma nuclear and mitochondrial DNA levels in patients with acute ischemic stroke.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levels of plasma nuclear and mitochondrial DNA in patients with acute
      ischemic stroke were significantly higher than those in the controls
    explanation: >-
      Human biomarker association consistent with release of mitochondrial
      material after cerebral infarction; it does not show that mitochondrial
      dysfunction causes the injury.
  - reference: PMID:25948727
    reference_title: Cyclosporine in acute ischemic stroke.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Cyclosporine was generally not effective in reducing infarct size.
    explanation: >-
      The randomized trial of the pore-targeting drug missed its primary
      infarct-volume endpoint, so targeting this node did not show benefit
      overall.
  - reference: PMID:25948727
    reference_title: Cyclosporine in acute ischemic stroke.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a smaller infarct size was observed in patients with proximal cerebral
      artery occlusion and efficient recanalization
    explanation: >-
      Subgroup-only result in the same trial; a therapeutic response cited as
      weak support for the targeted mechanism, not a mechanism demonstration.
  - reference: PMID:10461911
    reference_title: "Mitochondrial respiratory function and cell death in focal cerebral ischemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During ischemia, substantial reductions developed in both ADP-stimulated and uncoupled respiration in tissue from the focus of the affected area in the striatum and cortex."
    explanation: >-
      Mitochondria isolated from rat brain during middle cerebral artery
      occlusion lose respiratory capacity in the ischemic focus. Unlike the
      global-ischemia study above, this is a focal stroke model.
  - reference: PMID:10461911
    reference_title: "Mitochondrial respiratory function and cell death in focal cerebral ischemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impairment of the functional capacity of mitochondria from all three regions was seen in the first 3 h of reperfusion following 3 h of ischemia"
    explanation: >-
      After longer ischemia, the respiratory deficit persists into
      reperfusion in the focus and the perifocal tissue.
  - reference: PMID:25383517
    reference_title: "Ischaemic accumulation of succinate controls reperfusion injury through mitochondrial ROS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "After reperfusion, the accumulated succinate is rapidly re-oxidized by succinate dehydrogenase, driving extensive ROS generation by reverse electron transport at mitochondrial complex I."
    explanation: >-
      Identifies the source of the reperfusion ROS burst in vivo, supporting
      the oxidative stress arm of the node.
  downstream:
  - target: Excitotoxic and oxidative neuronal injury
    description: >-
      Mitochondrial ROS generation and permeability transition contribute to
      the oxidative and apoptotic-like neuronal death modeled in that node.
      Persistent mitochondrial failure is not required for infarction after
      shorter ischemia.
    evidence:
    - reference: PMID:25383517
      reference_title: "Ischaemic accumulation of succinate controls reperfusion injury through mitochondrial ROS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Decreasing ischaemic succinate accumulation by pharmacological inhibition is sufficient to ameliorate in vivo ischaemia-reperfusion injury in murine models of heart attack and stroke."
      explanation: >-
        Blocking the succinate-driven mitochondrial ROS source reduces injury
        in a mouse stroke model.
    - reference: PMID:10461911
      reference_title: "Mitochondrial respiratory function and cell death in focal cerebral ischemia."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, mitochondrial impairment during the first 3 h of reperfusion was apparently not essential for tissue infarction to develop."
      explanation: >-
        After 2 h of rat focal ischemia, respiration recovered on reperfusion
        yet the tissue still infarcted, so persistent mitochondrial failure is
        not required for infarction in that setting.
  - target: Microglial NLRP3 Inflammasome Activation in the Ischemic Penumbra
    description: >-
      Mitochondrial dysfunction after ischemia-reperfusion activates the NLRP3
      inflammasome in microglia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30153825
      reference_title: "Mitochondrial dysfunction induces NLRP3 inflammasome activation during cerebral ischemia/reperfusion injury."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mitochondrial dysfunction played an important role in activating NLRP3 inflammasomes in microglia after OGD/R"
      explanation: >-
        In a co-culture system under oxygen-glucose deprivation and
        reoxygenation, microglial NLRP3 activation depended on mitochondrial
        dysfunction.
    - reference: PMID:30153825
      reference_title: "Mitochondrial dysfunction induces NLRP3 inflammasome activation during cerebral ischemia/reperfusion injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mitochondrial protector could inhibit the activation of NLRP3 inflammasomes in cerebral I/R rats"
      explanation: >-
        Protecting mitochondria suppressed NLRP3 activation in rats after
        transient middle cerebral artery occlusion.

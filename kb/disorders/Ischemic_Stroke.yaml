- name: Post-Ischemic Autophagic-Lysosomal Dysfunction
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  biological_scale: CELLULAR
  description: >-
    Macroautophagy is activated within the ischemic penumbra after arterial
    occlusion, with autophagosome numbers and autophagy-marker (Beclin-1,
    LC3B) levels rising early and then declining over the following days as
    autophagic flux weakens. In parallel, the lysosomal protease cathepsin D
    (CTSD) is progressively lost, and this lysosomal dysfunction, rather than
    autophagy induction itself, is the step this node conforms to: loss of
    CTSD is sufficient to cause lysosomal dysfunction and aggravates neuronal
    death under oxygen-glucose deprivation, while restoring CTSD activity
    protects neurons.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Macroautophagy
    modifier: ABNORMAL
    term:
      id: GO:0016236
      label: macroautophagy
  genes:
  - preferred_term: CTSD
    term:
      id: hgnc:2529
      label: CTSD
  - preferred_term: BECN1
    term:
      id: hgnc:1034
      label: BECN1
  downstream:
  - target: Excitotoxic and oxidative neuronal injury
    description: >-
      Loss of cathepsin D-dependent lysosomal function aggravates, and its
      restoration protects against, oxygen-glucose deprivation-induced
      neuronal cell death, adding a lysosomal-clearance-failure route to
      excitotoxic and oxidative neuronal injury.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32450052
      reference_title: "Restoration of CTSD (cathepsin D) and lysosomal function in stroke is neuroprotective."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CTSD knockdown further aggravates lysosomal dysfunction and cell death in OGD-exposed neurons."
      explanation: >-
        Direct loss-of-function evidence that impaired lysosomal
        (autophagic-clearance) function worsens ischemic neuronal death. This
        specific result is from oxygen-glucose-deprived primary cortical
        neuron culture (the paper's in vitro arm), distinct from the
        MCAO-mouse evidence cited at the node level.
    - reference: PMID:32450052
      reference_title: "Restoration of CTSD (cathepsin D) and lysosomal function in stroke is neuroprotective."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Restoration of CTSD protein levels via lentiviral transduction increases CTSD activity in neurons and, thus, renders resistance to OGD-mediated defects in lysosomal function and cell death."
      explanation: >-
        Complementary gain-of-function evidence that restoring the
        autophagic-lysosomal clearance step is directly protective, supporting
        a causal (not merely correlative) role for this node. Also from the
        oxygen-glucose-deprivation cell-culture arm of this study.
  evidence:
  - reference: PMID:33974897
    reference_title: "Dynamic changes in Beclin-1, LC3B and p62 at various time points in mice with temporary middle cerebral artery occlusion and reperfusion (tMCAO)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "autophagy was activated within 7 d of tMCAO induction, and it strengthened at 1 d and then weakened steadily from 3 to 7 d"
    explanation: >-
      Primary rodent time-course evidence for early activation and subsequent
      decline of autophagic flux after ischemic stroke.
  - reference: PMID:32450052
    reference_title: "Restoration of CTSD (cathepsin D) and lysosomal function in stroke is neuroprotective."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results show a time-dependent decrease in CTSD protein levels and activity in the mouse brain after stroke and neurons following OGD, with concurrent defects in lysosomal function."
    explanation: >-
      Primary MCAO and oxygen-glucose-deprivation evidence for progressive
      loss of lysosomal (autophagic-clearance) function after ischemia,
      distinct from the review (PMID:42419491) that first proposed this axis
      as a hypothesis.
- name: Astrocyte and Cerebral Endothelial Cell Senescence
  conforms_to: "cellular_senescence#Senescent Cell Accumulation"
  biological_scale: CELLULAR
  description: >-
    Middle cerebral artery occlusion triggers acute cellular senescence in
    astrocytes and cerebral endothelial cells within the ischemic
    hemisphere, marked by p16INK4a upregulation and a senescence-associated
    secretory phenotype (SASP) of MMP-3, IL-1alpha, and IL-6. Senolytic
    clearance of these senescent cells, whether systemic (ABT-263) or local
    (targeted lenti-INK-ATTAC), reduces SASP factor levels and improves
    neurological and locomotor outcomes after occlusion. A
    senescence-associated blood gene-expression signature is independently
    associated with worse 90-day functional outcome in acute ischemic stroke
    patients.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  downstream:
  - target: Neurovascular inflammation and barrier disruption
    description: >-
      The senescence-associated secretory phenotype (MMP-3, IL-1alpha, IL-6)
      released by senescent astrocytes and endothelial cells adds to
      neurovascular inflammatory signaling and blood-brain barrier injury
      within the ischemic hemisphere.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - senescence-associated secretory phenotype
    evidence:
    - reference: PMID:37324944
      reference_title: "Ability of Local Clearance of Senescent Cells in Ipsilateral Hemisphere to Mitigate Acute Ischemic Brain Injury in Mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The upregulation of p16INK4a and senescence-associated secretory phenotype (SASP) factors including matrix metalloproteinase-3, interleukin-1 alpha and -6 were observed in oxygen-glucose deprivation-treated astrocytes and CECs."
      explanation: >-
        Identifies the specific SASP factors (a matrix protease and two
        proinflammatory cytokines) released by senescent astrocytes/CECs that
        would be expected to feed forward into neurovascular inflammation and
        barrier disruption. This measurement is from oxygen-glucose-deprived
        cell culture, distinct from the MCAO-mouse in vivo evidence cited
        elsewhere on this node.
  evidence:
  - reference: PMID:37324944
    reference_title: "Ability of Local Clearance of Senescent Cells in Ipsilateral Hemisphere to Mitigate Acute Ischemic Brain Injury in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The treatment of ABT-263 reduced senescence of astrocytes and CECs in MCAO mice."
    explanation: >-
      Pharmacologic senolysis directly reducing astrocyte/endothelial
      senescence markers in the same MCAO model, supporting a causal
      (druggable) role rather than a bystander correlation.
  - reference: PMID:37324944
    reference_title: "Ability of Local Clearance of Senescent Cells in Ipsilateral Hemisphere to Mitigate Acute Ischemic Brain Injury in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "localized removal of senescent cells in the injured brain through the stereotaxical injection of lenti-INK-ATTAC viruses generates neuroprotective effects, protecting against acute ischemic brain injury in mice"
    explanation: >-
      Independent genetic (non-pharmacologic) senescent-cell clearance
      approach converging on the same neuroprotective outcome.
  - reference: PMID:42479998
    reference_title: "Senescence Gene Expression Profiles and 90-Day Outcome in Stroke Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with poor outcome (mRS > 2) had enriched senescence gene expression compared with those with good outcome (mRS ≤ 2)"
    explanation: >-
      Independent human clinical evidence linking a senescence-associated
      gene-expression signature to worse functional outcome after acute
      ischemic stroke, complementing the rodent mechanistic data above.
- name: Microglial NLRP3 Inflammasome Activation in the Ischemic Penumbra
  conforms_to: "nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation"
  biological_scale: MOLECULAR
  description: >-
    The NLRP3 inflammasome is dramatically activated in the peri-infarct
    (penumbral) area after cerebral ischemia/reperfusion, and genetic
    suppression of its upstream regulator TRIM62 ameliorates NLRP3 activation,
    reduces neuroinflammation and apoptosis, and attenuates infarct outcomes.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    modifier: INCREASED
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
  genes:
  - preferred_term: TRIM62
    term:
      id: hgnc:25574
      label: TRIM62
  downstream:
  - target: Excitotoxic and oxidative neuronal injury
    description: >-
      NLRP3-driven neuroinflammatory signaling in the peri-infarct area adds a
      further, innate-immune route to neuronal injury and apoptosis in the
      ischemic territory.
    evidence:
    - reference: PMID:32703402
      reference_title: "TRIM62 knockout protects against cerebral ischemic injury in mice by suppressing NLRP3-regulated neuroinflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The TRIM62 knockout (KO) mice exhibited alleviated apoptosis and neuroinflammation in the ischemic brain, eventually attenuating the stroke outcomes."
      explanation: >-
        Suppressing NLRP3-regulated neuroinflammation (via TRIM62 knockout)
        directly reduces neuronal apoptosis and improves stroke outcome,
        supporting a causal contribution to neuronal injury.
  evidence:
  - reference: PMID:32703402
    reference_title: "TRIM62 knockout protects against cerebral ischemic injury in mice by suppressing NLRP3-regulated neuroinflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "significantly elevated expression of TRIM62 was detected in peri-infarct area of wild type (WT) mice"
    explanation: >-
      Localizes the TRIM62-NLRP3 signaling axis specifically to the
      peri-infarct (penumbral) region.
  - reference: PMID:32703402
    reference_title: "TRIM62 knockout protects against cerebral ischemic injury in mice by suppressing NLRP3-regulated neuroinflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "nucleotide-binding oligomerization domain-like receptor family pyrin domain-containing 3 (NLRP3) inflammasome was dramatically activated in cerebral ischemia/reperfusion (I/R) conditions, while being ameliorated in TRIM62-KO mice"
    explanation: >-
      Direct primary evidence of NLRP3 inflammasome activation in
      ischemia/reperfusion, distinct from the review (PMID:42419491) that
      first proposed this axis as a hypothesis.
phenotypes:

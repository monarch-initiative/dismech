- accession: ega:EGAS00001000936
  title: Ischemic stroke in a Swedish case-control study.
  description: Background. Genetic risk scores (GRS), summing up the total effect of several single nucleotide polymorphisms (SNPs) in genes associated with either coronary risk or cardiovascular risk factors, have been tested for association with ischemic stroke with conflicting results. Recently an association was found between a GRS, based on 29 SNPs discovered by genome-wide association studies (GWAS) and hypertension. The aim of our study was to investigate the possible association of the same GRS with ischemic stroke on top of other “traditional risk factors”, also testing its potential improvement in indices of discrimination and reclassification, in a Swedish case-control study.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606

  notes: Identified by GEO DataSets index search for Ischemic Stroke (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE308369
  title: Ischemic stroke accelerates atherosclerosis progression via FTO-mediated epigenetic modification [RNA-Seq]
  description: Residual risk of stroke recurrence persists despite the administration of the prevention measures. The recurrent risk is particularly high in patients with atherosclerosis. However, the underlying mechanisms leading to atherosclerosis progression and recurrent stroke have not been fully understood. We found that stroke accelerated atherosclerosis progression.

name: Ischemic Stroke
creation_date: "2026-05-06T03:10:37Z"
description: >-
  Ischemic stroke is an acute symptomatic central nervous system infarction
  caused by interruption of cerebral blood flow, usually from thrombosis,
  embolism, or proximal large-vessel occlusion, leading to ischemic tissue
  injury and focal neurological deficits.
category: Complex
disease_term:
  preferred_term: Ischemic stroke
  term:
    id: MONDO:1060198
    label: ischemic stroke
parents:
- Cerebrovascular disorder
- stroke disorder
synonyms:
- Cerebral infarction
- Ischaemic stroke
- Acute ischemic stroke
prevalence:
- population: Global, all ages
  notes: >-
    GBD 2021 estimated about 69.9 million prevalent ischemic stroke cases
    globally, with an age-standardized prevalence rate of 819.5 per 100,000.
  evidence:
  - reference: PMID:39157811
    reference_title: "Global, regional, and national burden of ischemic stroke, 1990-2021: an analysis of data from the global burden of disease study 2021."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Data for this study was obtained from the 2021 Global Burden of Diseases, Injuries, and Risk
      Factors Study (GBD). To quantify temporal patterns and assess trends in age-standardized rates
      of ischemic stroke prevalence (ASPR), incidence (ASIR), mortality (ASDR), and DALYs, estimated
      annual percentage changes (EAPCs) were computed over the study period. The analyses were
      disaggregated by gender, 20 age categories, 21 GBD regions, 204 nations/territories, and 5 SDI
      quintiles. ... In 2021, the global burden of ischemic stroke remained substantial, with a
      total of 69,944,884.8 cases with an ASPR of 819.5 cases per 100,000 individuals (95% UI:
      760.3-878.7).
    explanation: >-
      The GBD 2021 analysis estimates approximately 69.9 million prevalent ischemic-stroke cases
      worldwide and an age-standardized prevalence rate of 819.5 per 100,000. It analyzes 20 age
      groups and 204 countries/territories.
pathophysiology:
- name: Chronic Low-Grade Systemic Inflammation
  conforms_to: "inflammaging#Chronic Low-Grade Sterile Inflammation"
  biological_scale: ORGANISM
  description: >-
    Persistently raised circulating inflammatory markers, chiefly interleukin-6
    and C-reactive protein, mark a higher risk of a first ischemic stroke and of
    recurrence after one. Genetic evidence that lower IL-6 signaling lowers the
    risk of large-artery and small-vessel stroke, but not cardioembolic stroke,
    suggests the IL-6 axis is causal rather than only a marker. In aged mice,
    age-related changes in blood-cell production generate atypical neutrophils
    that worsen the inflammatory response to stroke, and related neutrophil
    subsets track with worse reperfusion in elderly patients. Most of the human
    evidence concerns inflammation in general rather than inflammation driven by
    ageing, so this node is a disease-specific use of the inflammaging module.
    Anti-inflammatory treatment has not yet been shown to prevent stroke: low-dose
    colchicine did not reduce early recurrence in a large trial.
  biological_processes:
  - preferred_term: Inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: Cytokine production
    modifier: INCREASED
    term:
      id: GO:0001816
      label: cytokine production
  downstream:
  - target: Cerebral arterial occlusion
    description: >-
      Chronic IL-6-driven inflammation is associated with large-artery and
      small-vessel ischemic stroke, plausibly through atherosclerosis and
      small-vessel disease. The causal link rests on genetic evidence, and
      anti-inflammatory treatment has not yet been shown to prevent recurrence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32397738
      reference_title: "Interleukin-6 Signaling Effects on Ischemic Stroke and Other Cardiovascular Outcomes: A Mendelian Randomization Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two-sample inverse-variance weighted MR analyses showed genetically downregulated IL-6 signaling to be associated with lower risks of ischemic stroke"
      explanation: >-
        Mendelian randomization using IL6R-region variants in MEGASTROKE
        (34,217 cases) links lower lifelong IL-6 signaling to lower ischemic
        stroke risk, supporting a causal role for the IL-6 axis.
    - reference: PMID:32397738
      reference_title: "Interleukin-6 Signaling Effects on Ischemic Stroke and Other Cardiovascular Outcomes: A Mendelian Randomization Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We further found associations with lower risks of large artery and small vessel stroke, but not cardioembolic stroke"
      explanation: >-
        Restricts the genetic association to the large-artery and small-vessel
        subtypes, consistent with an atherosclerotic route rather than a
        cardioembolic one.
    - reference: PMID:38925803
      reference_title: "Colchicine in patients with acute ischaemic stroke or transient ischaemic attack (CHANCE-3): multicentre, double blind, randomised, placebo controlled trial."
      supports: REFUTE
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stroke occurred within 90 days in 264 patients (6.3%) in the colchicine group and 270 patients (6.5%) in the placebo group"
      explanation: >-
        In 8,343 patients with minor-to-moderate non-cardioembolic stroke or TIA
        and high-sensitivity CRP of at least 2 mg/L, low-dose colchicine did not
        reduce new stroke within 90 days. The drug response bears on the
        mechanism only indirectly, and colchicine does not target IL-6 directly.
  - target: Neurovascular inflammation and barrier disruption
    description: >-
      In ageing, the bone-marrow response to stroke produces atypical,
      pro-oxidant and procoagulant neutrophils that plug the ischemic
      microcirculation and worsen injury.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37188941
      reference_title: "Age-induced alterations of granulopoiesis generate atypical neutrophils that aggravate stroke pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "aged mice had increased neutrophil clogging of the ischemic brain microcirculation, leading to worse no-reflow and outcomes"
      explanation: >-
        Compared with young mice, aged mice show more neutrophil plugging of
        the ischemic microcirculation after experimental stroke.
    - reference: PMID:37188941
      reference_title: "Age-induced alterations of granulopoiesis generate atypical neutrophils that aggravate stroke pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hematopoietic stem cell rejuvenation reverted aging-associated neutropoiesis and improved stroke outcome"
      explanation: >-
        Reversing the age-related change in neutrophil production improved
        outcome, supporting a causal role for the aged immune state.
    - reference: PMID:37188941
      reference_title: "Age-induced alterations of granulopoiesis generate atypical neutrophils that aggravate stroke pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In elderly patients with ischemic stroke, single-cell proteome profile of blood leukocytes identified CD62Llo neutrophil subsets associated with worse reperfusion and outcome"
      explanation: >-
        The neutrophil subsets identified in aged mice are associated with worse
        reperfusion and outcome in elderly stroke patients.
  evidence:
  - reference: PMID:20031199
    reference_title: "C-reactive protein concentration and risk of coronary heart disease, stroke, and mortality: an individual participant meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRP concentration has continuous associations with the risk of coronary heart disease, ischaemic stroke, vascular mortality, and death from several cancers and lung disease that are each of broadly similar size."
    explanation: >-
      Pooled prospective data link higher CRP to ischemic stroke risk. The
      association is shared with non-vascular deaths and depends considerably
      on conventional risk factors, so on its own it does not show that
      inflammation causes stroke.
  - reference: PMID:37026458
    reference_title: "C-Reactive Protein, Interleukin-6, and Vascular Recurrence After Stroke: An Individual Participant Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood markers of inflammation were independently associated with vascular recurrence after stroke"
    explanation: >-
      In pooled individual-patient data, baseline IL-6 and high-sensitivity
      CRP predicted recurrent vascular events and recurrent stroke after
      adjustment for vascular risk factors and treatment.
- name: Cerebral arterial occlusion
  description: >-
    In situ thrombosis, artery-to-artery embolism, cardioembolism, or proximal
    large-vessel occlusion interrupts cerebral blood flow and initiates the
    ischemic cascade.

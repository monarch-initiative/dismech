- accession: dbgap:phs000102
  title: Ischemic Stroke Genetics Study (ISGS)
  description: The third leading cause of death in the United States, stroke is an acute neurological event leading to death of neural tissues. Although the majority of strokes are ischemic strokes, meaning there is oxygen deprivation to the brain, almost 20% of strokes are hemorrhagic, resulting from bleeding into the brain. Stroke is a complex disorder and likely multigenic in nature, resulting from a combination of genetic and environmental factors.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Ischemic Stroke"). Retrieved 2026-08-02.

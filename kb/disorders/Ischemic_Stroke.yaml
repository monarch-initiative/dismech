    explanation: The clinical practice guideline supports co-treatment with intravenous alteplase (t-PA) alongside endovascular thrombectomy in acute large-vessel-occlusion ischemic stroke.
- name: Endovascular thrombectomy
  description: >-
    Endovascular clot retrieval improves disability outcomes in selected
    patients with acute ischemic stroke caused by proximal anterior-circulation
    large-vessel occlusion.

- accession: ega:EGAS00001005182
  title: Pediatric Papillary Thyroid Carcinoma RNA-Seq
  description: Papillary thyroid carcinoma (PTC) is the most common malignancy amongst adolescent and young adult women. Clinical and genomic features of PTC in children differ from those in adults. Historically, a substantial proportion (~50%) of pediatric PTC (PPTC) lack any of the common driver mutations typical of adult PTC. Thus, molecular diagnostics developed for adults may not be valid in children. We applied novel bioinformatic pipelines to RNASeq analysis of pediatric thyroid tumors to identify known and novel fusion oncogenes as drivers of tumorigenesis and to define gene expression patterns among tumors.

prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: COMMON
  notes: >-
    Papillary thyroid carcinoma is the most common thyroid malignancy, constituting
    more than 70% of all thyroid cancers. Global incidence has been rising substantially
    over recent decades, driven in part by increased use of thyroid ultrasound and
    detection of small, clinically occult tumors. Incidence varies markedly by region,
    with higher rates in countries with widespread thyroid imaging programs (e.g., the
    United States, South Korea) and lower rates in lower-resource settings. Note: this
    entry shares MONDO:0005075 with the BRAF_Mutant_Thyroid_Cancer and
    RET_Fusion_Thyroid_Cancer molecular-subtype sibling entries; these subtypes
    collectively represent a large proportion of the overall PTC incidence.
  evidence:
  - reference: PMID:21221869
    reference_title: "Papillary thyroid carcinoma variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Papillary thyroid carcinomas are the most common thyroid cancers and constitute more than 70% of thyroid malignancies."
    explanation: Establishes PTC as the dominant thyroid cancer histotype comprising over 70% of all thyroid malignancies.
  - reference: PMID:26462967
    reference_title: "2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "differentiated thyroid cancer is becoming increasingly prevalent"
    explanation: ATA 2015 guidelines acknowledge the rising incidence of differentiated thyroid cancer (predominantly PTC).

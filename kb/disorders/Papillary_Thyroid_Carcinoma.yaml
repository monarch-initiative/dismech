      evaluate the effect of cabozantinib compared with placebo on progression
      free survival (PFS) and objective response rate (ORR) in subjects with
      Radioiodine-Refractory Differentiated Thyroid Cancer (DTC) who have
      progressed after prior vascular endothelial growth factor receptor
      (VEGFR)-Targeted therapy
    explanation: The registered trial objective matches the second-line indication curated in the Cabozantinib treatment entry.
  notes: >-
    ClinicalTrials.gov API status checked 2026-08-16 reported

  title: The genomic landscape of metastatic papillary thyroid carcinoma and novel biomarkers for predicting distant metastasis
  description: Papillary thyroid carcinoma (PTC) is the most common malignancy of the thyroid gland with arelatively high cure rate. Distant metastasis (DM) of PTC is uncommon, but when it occurs, itsignificantly decreases the survival of PTC patients. However, the molecular mechanisms of DMin PTCs have not been systematically studied. We performed whole exome sequencing andGeneseeqPrime (425 genes) panel sequencing of the primary tumor, plasma and matched whiteblood cell samples from 20 PTCs with DM and 46 PTCs without DM. We identified somaticmutations, gene fusions and copy number alterations and analyzed their relationships with DM ofPTCs.

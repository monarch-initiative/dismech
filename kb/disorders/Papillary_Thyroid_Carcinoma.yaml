name: Papillary Thyroid Carcinoma
creation_date: '2026-04-12T05:10:03Z'
description: >-
  Papillary thyroid carcinoma is the most common differentiated thyroid cancer
  arising from thyroid follicular cells. It comprises the majority of thyroid
  malignancies and includes classical, follicular-patterned, and more aggressive
  variants such as tall cell carcinoma. Papillary thyroid carcinoma is typically
  driven by MAPK-pathway activating alterations including BRAF V600E, RET/PTC
  rearrangements, and RAS-family mutations, while additional events such as TERT
  promoter mutation and aberrant PI3K-PTEN-AKT signaling are associated with
  aggressive progression and radioactive iodine-refractory disease. Most cases
  have excellent disease-specific survival, but regional nodal metastasis and
  recurrence remain clinically important.
categories:
- Endocrine Cancer
- Differentiated Thyroid Cancer
parents:
- thyroid carcinoma
has_subtypes:
- name: Classical Papillary Thyroid Carcinoma
  description: >-
    Conventional papillary thyroid carcinoma with papillary architecture and the
    characteristic nuclear features used for diagnosis.
- name: Follicular Variant Papillary Thyroid Carcinoma
  description: >-
    Papillary thyroid carcinoma with predominantly follicular architecture and
    papillary-type nuclear features. Often aligns with a more RAS-like molecular
    profile than classical PTC.
- name: Tall Cell Variant Papillary Thyroid Carcinoma
  description: >-
    Aggressive histologic variant enriched for BRAF V600E, extrathyroidal
    extension, and recurrence risk.
pathophysiology:
- name: Driver Alterations in Thyroid Follicular Cells
  description: >-
    Early oncogenic alterations in papillary thyroid carcinoma commonly include
    BRAF V600E, RET/PTC rearrangements, and RAS-family mutations. These driver
    events arise in thyroid follicular cells and establish the genotype-phenotype
    patterns that distinguish conventional papillary tumors from more
    follicular-patterned neoplasms.
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  locations:
  - preferred_term: thyroid gland
    term:
      id: UBERON:0002046
      label: thyroid gland
  evidence:
  - reference: PMID:39502057
    reference_title: "[Correlations of Ultrasound Features With Gene Mutations and Pathologic Subtypes in Papillary Thyroid Carcinoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common gene mutations in PTC include BRAF V600E,RET/PTC rearrangement,and RAS mutations."
    explanation: Supports the major early driver classes emphasized in papillary thyroid carcinoma.
  - reference: PMID:41175860
    reference_title: "Somatic genetic alterations in the development and progression in thyroid tumors of follicular cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most tumors of follicular cell origin, the primary molecular events are RAS or RAS-like (follicular-patterned tumors) and BRAF p.V600E or BRAF V600E-like (conventional papillary carcinomas) alterations."
    explanation: Anchors the characterization of these driver events as the primary (early) molecular alterations in follicular-cell-derived thyroid tumors.
  downstream:
  - target: MAPK Pathway Hyperactivation
    description: Driver mutations and fusions converge on persistent mitogenic signaling
- name: MAPK Pathway Hyperactivation
  description: >-
    Driver alterations converge on chronic MAPK signaling, which promotes thyroid
    follicular cell proliferation and malignant transformation. BRAF-like tumors
    especially depend on this pathway and often show loss of thyroid
    differentiation programs relevant to iodine handling.
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  evidence:
  - reference: PMID:41175860
    reference_title: "Somatic genetic alterations in the development and progression in thyroid tumors of follicular cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most tumors of follicular cell origin, the primary molecular events are RAS or RAS-like (follicular-patterned tumors) and BRAF p.V600E or BRAF V600E-like (conventional papillary carcinomas) alterations."
    explanation: Supports the dominant BRAF-like and RAS-like molecular programs that organize papillary thyroid carcinoma biology.
  - reference: PMID:41368991
    reference_title: "BRAF V600E in thyroid cancer: navigating prognostic uncertainty and therapeutic opportunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRAF V600E, the most common oncogenic driver in papillary thyroid carcinoma, activates the MAPK pathway and suppresses genes involved in iodine metabolism and differentiation."
    explanation: Supports the role of BRAF-driven MAPK activation and reduced differentiation in a major papillary thyroid carcinoma subset.
  downstream:
  - target: Aggressive Progression and Reduced Differentiation
    description: Additional oncogenic hits superimposed on driver signaling promote dedifferentiation and treatment resistance
- name: Aggressive Progression and Reduced Differentiation
  description: >-
    A subset of papillary thyroid carcinomas acquires additional alterations such
    as TERT promoter mutation, TP53 disruption, and aberrant PI3K-PTEN-AKT
    signaling. These changes are associated with progression toward more
    aggressive, less-differentiated, and radioiodine-refractory disease.
  biological_processes:
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - preferred_term: cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030154
      label: cell differentiation
  evidence:
  - reference: PMID:41175860
    reference_title: "Somatic genetic alterations in the development and progression in thyroid tumors of follicular cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progression of thyroid tumors to advanced and less-differentiated carcinomas requires additional oncogenic alterations, including TP53 and TERT promoter mutation, and aberrant PI3K-PTEN-AKT signaling."
    explanation: Supports the progression model linking additional alterations to aggressive and less-differentiated thyroid carcinoma states.
histopathology:
- name: Papillary Thyroid Carcinoma
  finding_term:
    preferred_term: Thyroid Gland Papillary Carcinoma
    term:
      id: NCIT:C4035
      label: Thyroid Gland Papillary Carcinoma
  frequency: VERY_FREQUENT
  description: >-
    Papillary thyroid carcinoma is the dominant malignant thyroid histology and
    includes classical, follicular variant, tall cell, and other less common
    morphologic forms.
  evidence:
  - reference: PMID:21221869
    reference_title: "Papillary thyroid carcinoma variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Papillary thyroid carcinomas are the most common thyroid cancers and constitute more than 70% of thyroid malignancies."
    explanation: Supports papillary thyroid carcinoma as the predominant malignant thyroid histology.
- name: Papillary-Type Nuclear Features
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    The hallmark diagnostic nuclear features of papillary thyroid carcinoma include
    nuclear enlargement with optically clear (ground-glass) chromatin ("Orphan-Annie
    eye" nuclei), longitudinal nuclear grooves, and intranuclear cytoplasmic
    pseudoinclusions. These papillary-type nuclear changes are required criteria for
    histological and cytological diagnosis, distinguishing PTC from benign follicular
    lesions. Their frequency correlates with BRAF V600E mutation in classical and
    tall-cell subtypes.
  evidence:
  - reference: PMID:26271724
    reference_title: "BRAF V600E and risk stratification of thyroid microcarcinoma: a multicenter pathological and clinical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nuclear grooves, optically clear nuclei, tall cells within the tumor"
    explanation: Multicenter pathological analysis of papillary thyroid microcarcinomas identifies nuclear grooves and optically clear nuclei as characteristic microscopic features correlated with BRAF V600E.
- name: Psammoma Bodies
  finding_term:
    preferred_term: psammoma body formation
    term:
      id: NCIT:C27709
      label: Psammoma Body Formation
  description: >-
    Psammoma bodies are concentrically laminated calcified structures that form
    by dystrophic calcification of infarcted papillae or necrotic neoplastic cells.
    They are a diagnostically useful but non-universal finding in papillary thyroid
    carcinoma. Although their sensitivity is low (they are absent in a substantial
    minority of PTCs), their presence is highly specific for malignancy and for PTC
    in particular, especially when encountered in cervical lymph node tissue.
    Identification of psammoma bodies alone in a cervical lymph node is considered
    evidence of metastatic PTC even when viable tumor cells are absent.
  notes: >-
    Psammoma bodies are sufficiently specific for PTC that their incidental
    finding in cervical lymph nodes warrants a diligent search for a primary
    papillary thyroid carcinoma. They are absent or sparse in follicular and
    anaplastic thyroid carcinoma.
  evidence:
  - reference: PMID:37181946
    reference_title: "The Accurate Interpretation and Clinical Significance of Morphological Features of Fine Needle Aspiration Cells in Papillary Thyroid Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the sensitivity of psammoma bodies (PBs) was low, the specificity was 100%."
    explanation: Retrospective study of 337 PTC patients confirms psammoma bodies as perfectly specific for PTC on FNA cytology despite lower sensitivity, supporting their role as a high-value diagnostically specific feature.
phenotypes:
- category: Endocrine
  name: Thyroid Nodule
  diagnostic: true
  description: >-
    Most patients present with a thyroid nodule detected clinically or on
    imaging.
  phenotype_term:
    preferred_term: Thyroid nodule
    term:
      id: HP:0025388
      label: Thyroid nodule
  evidence:
  - reference: PMID:24276450
    reference_title: "The accuracy of thyroid nodule ultrasound to predict thyroid cancer: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common type of cancer was papillary thyroid cancer (84%)."
    explanation: In a meta-analysis of 18,288 thyroid nodules, papillary thyroid carcinoma was the predominant malignancy identified, consistent with the thyroid nodule being the characteristic presentation of papillary thyroid carcinoma.
- category: Systemic
  name: Cervical Lymphadenopathy
  description: >-
    Regional cervical lymph node involvement is common and may be present at
    diagnosis, particularly in younger patients and in tumors with higher-risk
    molecular or histologic features.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:29329789
    reference_title: "Lateral lymph node metastasis in papillary thyroid carcinoma: A systematic review and meta-analysis for prevalence, risk factors, and location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymph node metastasis (LNM) is frequent in papillary thyroid carcinoma (PTC) and is associated with a poor prognosis."
    explanation: Systematic review and meta-analysis supports regional lymph node metastasis as a frequent feature of papillary thyroid carcinoma.
biochemical:
- name: Thyroglobulin
  notes: >-
    Thyroglobulin remains a practical diagnostic and surveillance biomarker in
    differentiated thyroid cancer. Immunohistochemical staining is especially
    helpful in confirming papillary thyroid carcinoma at metastatic sites, and
    serum thyroglobulin is widely used for postoperative monitoring of disease
    recurrence after thyroidectomy.
  evidence:
  - reference: PMID:21221869
    reference_title: "Papillary thyroid carcinoma variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical staining with TTF-1 and thyroglobulin is very useful in confirming the diagnosis of papillary thyroid carcinoma especially in metastatic sites."
    explanation: Supports the diagnostic utility of thyroglobulin immunostaining in papillary thyroid carcinoma at metastatic sites.
  - reference: PMID:26462967
    reference_title: "2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surveillance for recurrent disease using imaging and serum thyroglobulin"
    explanation: ATA guidelines confirm serum thyroglobulin as a standard postoperative surveillance marker for differentiated thyroid cancer including PTC.
- name: Molecular Driver Testing
  notes: >-
    Molecular testing for BRAF V600E, RET/PTC rearrangements, and RAS-family
    mutations can refine prognostic assessment, clarify subtype biology, and
    guide targeted therapy discussions in advanced disease.
  evidence:
  - reference: PMID:39502057
    reference_title: "[Correlations of Ultrasound Features With Gene Mutations and Pathologic Subtypes in Papillary Thyroid Carcinoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis of papillary thyroid carcinoma (PTC) is highly dependent on gene mutations and pathologic features."
    explanation: Supports routine clinical relevance of molecular and pathologic stratification in papillary thyroid carcinoma.
genetic:
- name: BRAF
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  association: Somatic Activating Mutations
  notes: >-
    BRAF V600E is the most common single driver alteration in conventional
    papillary thyroid carcinoma. It activates MAPK signaling and is associated
    with higher risk of nodal metastasis and recurrence in aggregate analyses.
    However, a large meta-analysis of 20,570 patients found no significant
    association with distant metastases (OR=0.75) or disease-specific mortality
    (OR=0.97), limiting its role as an independent prognostic marker for survival.
  evidence:
  - reference: PMID:41368991
    reference_title: "BRAF V600E in thyroid cancer: navigating prognostic uncertainty and therapeutic opportunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRAF V600E, the most common oncogenic driver in papillary thyroid carcinoma, activates the MAPK pathway and suppresses genes involved in iodine metabolism and differentiation."
    explanation: Supports BRAF V600E as the dominant papillary thyroid carcinoma driver and a mechanism for MAPK activation.
  - reference: PMID:41419184
    reference_title: "Prognostic Value of BRAF V600E Mutation in Papillary Thyroid Carcinoma: A Meta-Analysis of Nodal Involvement, Distant Metastases, Recurrence, and Mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, these findings confirm that BRAF V600E mutation is associated with an increased risk of nodal metastasis and recurrence in papillary thyroid carcinoma."
    explanation: Supports the clinical association between BRAF V600E and adverse recurrence-related features.
  - reference: PMID:41419184
    reference_title: "Prognostic Value of BRAF V600E Mutation in Papillary Thyroid Carcinoma: A Meta-Analysis of Nodal Involvement, Distant Metastases, Recurrence, and Mortality."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, its lack of impact on distant metastases and disease-specific mortality limits its role as an independent prognostic marker in clinical decision-making."
    explanation: The same meta-analysis found no significant association with distant metastases or disease-specific mortality, qualifying BRAF V600E as an incomplete independent prognostic marker.
- name: RET
  gene_term:
    preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  association: Somatic Gene Fusions
  notes: >-
    RET/PTC rearrangements define an important papillary thyroid carcinoma subset,
    especially in radiation-associated disease, and converge on the same
    mitogenic pathways as other canonical drivers.
  evidence:
  - reference: PMID:39502057
    reference_title: "[Correlations of Ultrasound Features With Gene Mutations and Pathologic Subtypes in Papillary Thyroid Carcinoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common gene mutations in PTC include BRAF V600E,RET/PTC rearrangement,and RAS mutations."
    explanation: Supports RET/PTC rearrangements as one of the major recurrent driver classes in papillary thyroid carcinoma.
- name: RAS family genes
  association: Somatic Activating Mutations
  notes: >-
    RAS-family mutations are common in more follicular-patterned papillary thyroid
    carcinoma and related differentiated thyroid neoplasms, reflecting a RAS-like
    signaling program distinct from classical BRAF-like tumors.
  evidence:
  - reference: PMID:39502057
    reference_title: "[Correlations of Ultrasound Features With Gene Mutations and Pathologic Subtypes in Papillary Thyroid Carcinoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common gene mutations in PTC include BRAF V600E,RET/PTC rearrangement,and RAS mutations."
    explanation: Supports RAS-family alterations as recurrent papillary thyroid carcinoma drivers.
  - reference: PMID:41175860
    reference_title: "Somatic genetic alterations in the development and progression in thyroid tumors of follicular cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most tumors of follicular cell origin, the primary molecular events are RAS or RAS-like (follicular-patterned tumors) and BRAF p.V600E or BRAF V600E-like (conventional papillary carcinomas) alterations."
    explanation: Supports the distinction between RAS-like follicular-patterned tumors and BRAF-like conventional papillary carcinomas.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  association: Somatic Promoter Mutations
  notes: >-
    TERT promoter mutations are progression-associated events linked to aggressive,
    less-differentiated, and radioiodine-refractory thyroid carcinoma states.
  evidence:
  - reference: PMID:41175860
    reference_title: "Somatic genetic alterations in the development and progression in thyroid tumors of follicular cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progression of thyroid tumors to advanced and less-differentiated carcinomas requires additional oncogenic alterations, including TP53 and TERT promoter mutation, and aberrant PI3K-PTEN-AKT signaling."
    explanation: Supports TERT promoter mutation as a late progression event in aggressive thyroid carcinoma biology.
environmental:
- name: Ionizing Radiation Exposure
  exposure_term:
    preferred_term: exposure to ionizing radiation
    term:
      id: ECTO:7000047
      label: exposure to ionizing radiation
  influences_mechanisms:
  - target: Driver Alterations in Thyroid Follicular Cells
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Radiation reaching the thyroid causes double-strand breaks whose
      mis-joining produces the rearrangement-type drivers characteristic of
      radiation-associated disease, so the exposure reaches this node through
      a known repair-error step.
    evidence:
    - reference: PMID:21221869
      reference_title: "Papillary thyroid carcinoma variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common etiologic factor is radiation"
      explanation: >-
        Identifies radiation as the most common etiologic factor for this
        cancer, the exposure that generates its driver alterations.
  notes: >-
    Ionizing radiation is the strongest established environmental risk factor for
    papillary thyroid carcinoma, especially after childhood or adolescent exposure.
  evidence:
  - reference: PMID:21221869
    reference_title: "Papillary thyroid carcinoma variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common etiologic factor is radiation"
    explanation: Supports radiation exposure as the leading established environmental risk factor for papillary thyroid carcinoma.
treatments:
- name: Thyroidectomy
  description: >-
    Surgical resection is the mainstay of treatment for localized papillary
    thyroid carcinoma.
  treatment_term:
    preferred_term: Thyroidectomy
    term:
      id: NCIT:C51648
      label: Thyroidectomy
- name: Radioiodine Therapy
  description: >-
    Radioactive iodine is used selectively after surgery for intermediate-risk,
    high-risk, or metastatic differentiated thyroid cancer.
  treatment_term:
    preferred_term: Radioactive Iodine Therapy
    term:
      id: NCIT:C157968
      label: Radioactive Iodine Therapy
- name: Mutation-Directed Targeted Therapy
  description: >-
    Advanced papillary thyroid carcinoma with actionable driver alterations may
    be treated with genotype-matched targeted therapy, including RET inhibitors
    for RET fusion-positive disease and BRAF-directed regimens in BRAF V600E-
    driven refractory tumors.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
- name: Lenvatinib or Sorafenib
  description: >-
    Multi-kinase inhibitors are standard systemic options for progressive
    radioiodine-refractory differentiated thyroid cancer when surgery and
    radioiodine are no longer sufficient.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: lenvatinib
      term:
        id: CHEBI:85994
        label: lenvatinib
    - preferred_term: sorafenib
      term:
        id: CHEBI:50924
        label: sorafenib
- name: Cabozantinib
  description: >-
    Cabozantinib is a multi-kinase inhibitor (VEGFR2, MET, AXL, RET) used in the
    second-line setting for radioiodine-refractory differentiated thyroid cancer
    that has progressed during or after lenvatinib or sorafenib. This
    VEGFR-TKI-refractory population previously had no standard of care; the
    randomised placebo-controlled COSMIC-311 trial met its progression-free
    survival endpoint at interim analysis, at the cost of substantially more
    grade 3-4 toxicity (palmar-plantar erythrodysaesthesia, hypertension,
    fatigue).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: cabozantinib
      term:
        id: CHEBI:72317
        label: cabozantinib
  evidence:
  - reference: PMID:34237250
    reference_title: "Cabozantinib for radioiodine-refractory differentiated thyroid cancer (COSMIC-311): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients must have received previous lenvatinib or sorafenib and progressed during or after treatment with up to two VEGFR tyrosine kinase inhibitors."
    explanation: Defines the second-line, VEGFR-TKI-refractory population in which cabozantinib was evaluated, downstream of the lenvatinib/sorafenib option already curated here.
  - reference: PMID:34237250
    reference_title: "Cabozantinib for radioiodine-refractory differentiated thyroid cancer (COSMIC-311): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cabozantinib showed significant improvement in progression-free survival over placebo: median not reached ... versus 1·9 months (1·8-3·6); hazard ratio 0·22 (96% CI 0·13-0·36; p<0·0001)"
    explanation: Reports the randomised progression-free survival benefit that supports cabozantinib as an active option after VEGFR-TKI failure.
  - reference: PMID:34237250
    reference_title: "Cabozantinib for radioiodine-refractory differentiated thyroid cancer (COSMIC-311): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 3 or 4 adverse events occurred in 71 (57%) of 125 patients receiving cabozantinib and 16 (26%) of 62 receiving placebo"
    explanation: Quantifies the grade 3-4 toxicity burden stated in the description, so the efficacy claim is not curated without its safety cost.
  - reference: PPR:PPR1274359
    reference_title: "Efficacy, Safety, and Certainty of Evidence for Systemic Antineoplastic Therapies in Treatment-resistant Adult Malignancies: A Systematic Review, Exploratory Meta-analysis, and Grade Assessment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cabozantinib contributed high-certainty evidence for progression-free survival in radioiodine-refractory differentiated thyroid cancer after previous VEGFR-targeted therapy"
    explanation: >-
      GRADE certainty rating from a 2026 systematic review of treatment-resistant
      malignancies, corroborating (not solely supporting) the COSMIC-311 result
      above. Non-peer-reviewed preprint; cited only alongside the peer-reviewed
      trial report.

- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirteen patients from eight families across seven centres as of the 2021
    cohort, which was assembled specifically to pool the world literature. No
    population prevalence estimate exists.
  evidence:
  - reference: PMID:33929673
    reference_title: "Genomic Spectrum and Phenotypic Heterogeneity of Human IL-21 Receptor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study, we have collected clinical histories of 13 patients with IL-21R
      deficiency from eight families across seven centers worldwide, including five
      novel patients identified by exome or NGS panel sequencing.
    explanation: >-
      Gives the assembled worldwide patient count, the only occurrence figure
      available for this disorder.
genetic:
- name: IL21R
  notes: >
    IL21R (16p12.1) encodes the alpha chain of the IL-21 receptor, which pairs with
    the common gamma chain to signal through JAK1/JAK3 to STAT1, STAT3 and STAT5.
    Reported disease alleles include missense (p.Arg201Leu), in-frame deletion
    (p.C81_H82del) and frameshift (p.Ser45fs) changes; eight unique mutations were
    catalogued across the thirteen-patient cohort. The p.Arg201Leu allele is the
    mechanistically informative one because it is expressed but mistrafficked,
    showing the lesion is receptor function rather than transcript absence.
  gene_term:
    preferred_term: IL21R
    term:
      id: hgnc:6006
      label: IL21R
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23440042
    reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome and candidate gene sequencing, we identified two distinct
      homozygous loss-of-function mutations in the interleukin-21 receptor gene
      (IL21R; c.G602T, p.Arg201Leu and c.240_245delCTGCCA, p.C81_H82del).
    explanation: >-
      The founding gene-discovery result identifying biallelic IL21R loss of
      function as the cause.
  - reference: PMID:33929673
    reference_title: "Genomic Spectrum and Phenotypic Heterogeneity of Human IL-21 Receptor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight unique mutations in IL21R were identified in these patients, including
      two novel mutations.
    explanation: Establishes the size of the reported allelic spectrum.
  - reference: PMID:33966600
    reference_title: "Combined immunodeficiency with marginal zone lymphoma due to a novel homozygous mutation in IL-21R gene and successful treatment with hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted next-generation sequencing Ion AmpliSeq™ primary immunodeficiency
      panel revealed a novel homozygous IL21R c.132delC (p.Ser45fs) mutation.
    explanation: Adds a frameshift allele to the documented spectrum.
pathophysiology:
- name: Aberrant IL-21 Receptor Trafficking and Loss of Ligand Binding
  biological_scale: MOLECULAR
  description: >
    The characterised missense allele does not abolish the protein; it misroutes
    it. IL-21R fails to traffic correctly to the plasma membrane and cannot bind
    IL-21. This distinction matters because it makes the disease a receptor
    functional failure rather than a null, and it is why the receptor may be
    detectable by flow cytometry in a patient who nonetheless has no IL-21
    signalling.
  gene:
    preferred_term: IL21R
    term:
      id: hgnc:6006
      label: IL21R
  biological_processes:
  - preferred_term: protein transport
    modifier: DECREASED
    term:
      id: GO:0015031
      label: protein transport
  evidence:
  - reference: PMID:23440042
    reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The IL-21R(Arg201Leu) mutation causes aberrant trafficking of the IL-21R to
      the plasma membrane, abrogates IL-21 ligand binding, and leads to defective
      phosphorylation of signal transducer and activator of transcription 1 (STAT1),
      STAT3, and STAT5.
    explanation: >-
      Establishes the trafficking defect, the loss of ligand binding and the
      downstream STAT failure in one measured result.
  downstream:
  - target: Failure of IL-21/STAT Signal Transduction
    causal_link_type: DIRECT

- name: Sclerosing Cholangitis and Progressive Liver Disease
  biological_scale: ORGANISM
  description: >
    Chronic biliary inflammation progresses to sclerosing cholangitis, fibrosis and
    end-stage liver disease. This is the damage that determines outcome, and
    critically it is not reversed by correcting the immune defect, which is why the
    timing of transplant dominates prognosis.
  evidence:
  - reference: PMID:33929673
    reference_title: "Genomic Spectrum and Phenotypic Heterogeneity of Human IL-21 Receptor Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival following HSCT (6 patients, mean follow-up 1.8 year) was 33.3%,
      with pre-existing organ damage constituting a negative prognostic factor.
    explanation: >-
      Establishes established organ damage as the negative prognostic factor after
      transplant, which is what makes this node outcome-determining.

- name: Failure of IL-21/STAT Signal Transduction
  biological_scale: MOLECULAR
  description: >
    Without ligand binding there is no JAK-mediated phosphorylation of STAT1, STAT3
    or STAT5 downstream of IL-21. Because IL-21R partners the common gamma chain,
    the defect is restricted to the IL-21 arm rather than affecting every
    gamma-chain cytokine, which is what separates this disease from X-linked SCID.

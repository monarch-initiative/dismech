environmental:
- name: Chronic Cryptosporidium infection
  description: >
    Cryptosporidium is the environmental partner without which this disease's
    defining complication does not occur. In an immunocompetent host it causes
    self-limited diarrhoea; in IL-21R deficiency it persists in the biliary
    epithelium and drives the cholangiopathy. Modelling it as an environmental
    entry linked into the pathograph, rather than as prose, is what makes the
    two-factor structure of the disease queryable.
  exposure_term:
    preferred_term: exposure to Cryptosporidium
  review_notes: >-
    Left with a free-text preferred_term and no term binding. The ECTO cache was
    searched for an exposure term naming Cryptosporidium or a protozoan pathogen and
    none exists; the closest available term is ECTO:7000119 "exposure to contaminated
    water". That was not used because none of the cited sources establishes a
    waterborne route in these patients, and binding it would assert a transmission
    route the evidence does not support. Recorded here so the gap is visible rather
    than silently unbound.
  influences_mechanisms:
  - target: Failure to Clear Cryptosporidium from Biliary Epithelium
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      The exposure supplies the organism whose persistence the immune lesion permits.
      The host defect determines whether infection is cleared; the exposure
      determines whether there is anything to clear.
    evidence:
    - reference: PMID:33966600
      reference_title: "Combined immunodeficiency with marginal zone lymphoma due to a novel homozygous mutation in IL-21R gene and successful treatment with hematopoietic stem cell transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CMV DNA and stool Cryptosporidium parvum were positive.
      explanation: >-
        Documents laboratory-confirmed Cryptosporidium parvum in an IL21R-deficient
        patient, establishing the organism's presence rather than inferring it.
  evidence:
  - reference: PMID:23440042
    reference_title: "Loss-of-function mutations in the IL-21 receptor gene cause a primary immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report on two unrelated kindreds, with two patients each, who
      had cryptosporidial infections associated with chronic cholangitis and liver
      disease.
    explanation: >-
      Establishes cryptosporidial infection as a feature of the disease in the
      founding kindreds.

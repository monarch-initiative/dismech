    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our study shows that IL2RG deficiency can be associated with differential
      signaling defects.
    explanation: >-
      States the mechanism by which an IL2RG lesion can mimic isolated IL-21R
      deficiency.

discussions:
- discussion_id: il21r_biliary_tropism_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does an immune defect that impairs B, T and NK function across the board
    produce organ damage concentrated in the biliary tree?
  attaches_to:
  - pathophysiology#Failure to Clear Cryptosporidium from Biliary Epithelium
  rationale: >
    The immunological lesion is broad, but the organ damage is not. Nothing cited
    here explains why the biliary epithelium in particular becomes the site of
    persistent cryptosporidial infection rather than the intestinal epithelium the
    organism first colonises. Candidate explanations include a specific dependence of
    biliary mucosal defence on IL-21-driven responses, or simply that biliary
    infection is the one that produces irreversible damage and therefore gets
    reported. No cited study distinguishes them, and no biliary-specific
    immunological measurement in these patients was found.
- discussion_id: il21r_transplant_timing_vs_efficacy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the poor post-transplant survival a property of the transplant or of when it
    was performed?
  attaches_to:
  - treatments#Allogeneic hematopoietic stem cell transplantation
  rationale: >
    Reported survival after transplant is 33.3% in six patients. The comparator is
    harder to state than it looks: the source disagrees with itself about the
    untransplanted group, its abstract giving 57.1% mortality in seven patients and its
    full text 42.8% (3/7). An earlier version of this entry asserted 42.9% survival,
    which was arithmetic on the abstract figure and not a quantity either sentence
    states; it has been removed rather than picked between. On the abstract figure the
    untransplanted group did worse than the transplanted one, on the full-text figure
    better, and neither reading is an endorsement of the procedure. What does bear on the question is
    PMID:30850087, a cohort of primary immunodeficiencies with sclerosing cholangitis in
    which the survivors were those with less severe cholangiopathy at transplant. That
    is cross-disease evidence rather than IL-21R evidence, and it supports the timing
    reading without settling it for this disorder. The cohort authors attribute the difference to pre-existing organ
    damage in the transplanted group rather than to the procedure, which is
    biologically plausible and matches the fact that transplant cannot reverse
    established cholangiopathy. But with six and seven patients and no matching for
    disease stage, the comparison cannot separate the two explanations, and this entry
    does not treat transplant efficacy as established.
notes: >
  On naming. The MONDO term is the clinical description
  (cryptosporidiosis-chronic cholangitis-liver disease syndrome), but the disorder
  is universally called IL-21R deficiency or immunodeficiency 56 in the immunology
  literature. The entry is filed under the gene-based name, matching the convention
  of existing entries such as GATA2_Deficiency, with the MONDO label carried as
  disease_term.preferred_term and both forms in synonyms.

  On the two-factor structure. The environmental entry is not decoration. Neither
  the IL21R genotype nor Cryptosporidium exposure produces the defining
  complication alone, so the exposure is linked into the pathograph with
  environmental_effect: TRIGGERS rather than described in prose. The exposure term
  is deliberately left unbound: ECTO has no term naming Cryptosporidium or a
  protozoan pathogen, and the nearest available term asserts a waterborne route that
  none of the cited sources establishes in these patients. The search is recorded in
  the entry's review_notes.

  On the transplant evidence. This is the weakest evidence in the entry and is
  labelled as such. Six transplanted patients with 33.3% survival is not a
  demonstration of benefit against any reading of the untransplanted group, and the
  source states two different figures for that group in its abstract and its full text.
  Both are quoted on the transplant treatment rather than reconciled here. The
  authors' interpretation, that organ damage rather than the procedure explains it,
  is recorded and a discussion entry states plainly that the comparison cannot
  separate the two.

  On what is deliberately absent. No datasets: the cohort paper itself states that
  mechanistic data come from targeted immunophenotyping and STAT-phosphorylation
  flow assays rather than from omics, and no disease-specific dataset was found. No
  animal models: Il21r knockout mice exist and are widely used in immunology, but
  none of the sources cited here presents one as a model of this human disease, and
  the cryptosporidial cholangiopathy that defines the disorder is not a reported
  feature of the mouse.

  On GeneReviews. A PubMed search of the GeneReviews book collection returns no chapter
  for IL21R, the IL-21 receptor, or immunodeficiency 56. Recorded here because the
  review of this entry could not run that query, so the absence reads as a completed
  search rather than an unchecked one.

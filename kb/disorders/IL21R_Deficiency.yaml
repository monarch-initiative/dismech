diagnosis:
- name: IL21R sequencing
  description: >
    Molecular diagnosis by exome or a primary immunodeficiency panel. Because the
    characterised missense allele is expressed but mistrafficked, receptor detection
    by flow cytometry does not exclude the diagnosis, and a functional STAT
    phosphorylation assay is the confirmatory test.
  evidence:
  - reference: PMID:33966600
    reference_title: "Combined immunodeficiency with marginal zone lymphoma due to a novel homozygous mutation in IL-21R gene and successful treatment with hematopoietic stem cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted next-generation sequencing Ion AmpliSeq™ primary immunodeficiency panel
      revealed a novel homozygous IL21R c.132delC (p.Ser45fs) mutation.
    explanation: Documents panel sequencing as the route to diagnosis in practice.
differential_diagnoses:
- name: IL2RG deficiency with preserved IL-2/IL-7 signalling
  description: >
    The differential that matters most, because it can present identically. Two
    brothers with an IL2RG frameshift rescued by alternative splicing had chronic
    cryptosporidiosis and cholangitis with selectively impaired IL-4 and IL-21
    signalling. Since IL-21R signals through the common gamma chain, a gamma chain
    lesion that spares IL-2 and IL-7 phenocopies IL-21R deficiency, and only
    sequencing separates them.
  evidence:
  - reference: PMID:30903457
    reference_title: "Alternative Splicing Rescues Loss of Common Gamma Chain Function and Results in IL-21R-like Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report two brothers suffering from chronic cryptosporidiosis, severe
      diarrhea, and cholangitis.
    explanation: >-

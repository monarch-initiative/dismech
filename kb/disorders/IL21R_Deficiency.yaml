name: IL21R Deficiency
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >
  IL-21 receptor deficiency (immunodeficiency 56) is an autosomal recessive
  combined immunodeficiency caused by biallelic loss-of-function variants in
  IL21R. The MONDO term names it after its most characteristic presentation,
  cryptosporidiosis with chronic cholangitis and liver disease, and that naming is
  a fair summary of what makes the disease distinctive: the immunological lesion
  is broad, but the organ damage is concentrated in the biliary tree.

  IL-21 signals through IL-21R paired with the common gamma chain, and its loss
  removes a signal that several lymphocyte lineages depend on at once, so B-cell
  class switching, T follicular helper output and NK cytotoxicity all fail
  together. The reported receptor mechanism is not a simple absence of protein but
  aberrant trafficking to the plasma membrane with loss of ligand binding, and the
  downstream failure is measured directly as defective STAT1, STAT3 and STAT5
  phosphorylation.

  What makes the entry mechanistically interesting is that the defining
  complication requires an environmental partner. The immunodeficiency does not
  produce sclerosing cholangitis by itself; it fails to clear Cryptosporidium from
  the biliary epithelium, and the resulting persistent infection drives the
  cholangiopathy. That two-factor structure is modelled explicitly with an
  environmental entry linked into the pathograph rather than left as prose, and it
  is why the therapeutic window matters so much: transplant corrects the immune
  lesion but not established biliary damage.
synonyms:
- IL21R immunodeficiency
- IL-21R deficiency
- immunodeficiency 56
- IMD56
- interleukin 21 receptor deficiency
- cryptosporidiosis-chronic cholangitis-liver disease syndrome

progression:
- phase: Enteral phase
  description: >-
    The first week after ingestion, when larvae invade the intestine and mature
    into adults, producing gastrointestinal symptoms.
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infection of humans occurs with the ingestion of Trichinella larvae that are encysted in muscle tissue of domestic or wild animal meat."
    explanation: The ingested larvae begin the enteral phase.
- phase: Parenteral (muscle) phase
  description: >-
    Weeks 2-6, when newborn larvae disseminate and encyst in striated muscle,
    producing the eosinophilic systemic response and myositis; early diagnosis
    is difficult because pathognomonic signs are lacking.
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Early clinical diagnosis of trichinellosis is rather difficult because pathognomonic signs or symptoms are lacking."
    explanation: Characterises the diagnostic difficulty of the systemic phase.
prevalence:
- population: WHO European Region (outbreak reports, 1986-2009)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.8
  rate_low: 1.1
  rate_high: 8.5
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Regional incidence ranged 1.1-8.5 per 100,000 during outbreak years; the
    WHO European Region accounted for 87% of the 65,818 cases reported worldwide
    in 1986-2009.
  evidence:
  - reference: PMID:22172230
    reference_title: "Worldwide occurrence and impact of human trichinellosis, 1986-2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence in the region ranged from 1.1 to 8.5 cases per 100,000 population."
    explanation: Reported regional incidence range for the WHO European Region.
- population: Global burden (Disability-Adjusted Life Years)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Global burden estimated at 76 DALYs per billion persons per year (95% CrI
    38-129), low relative to other foodborne parasitic diseases.
  evidence:
  - reference: PMID:24953055
    reference_title: "The low global burden of trichinellosis: evidence and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The global number of Disability-Adjusted Life Years due to trichinellosis was estimated to be 76 per billion persons per year (95% credible interval: 38-129)."
    explanation: Quantifies the global disease burden in DALYs.
treatments:
- name: Anthelmintic therapy
  description: >-
    Benzimidazole anthelmintics (albendazole or mebendazole) kill intestinal
    adults and are most effective given early in the enteral phase; once larvae
    are established in muscle they are harder to eradicate. Corticosteroids are
    added for severe systemic or allergic manifestations.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: mebendazole
      term:
        id: CHEBI:6704
        label: mebendazole
    - preferred_term: glucocorticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:12150691
    reference_title: Opinion on the diagnosis and treatment of human trichinellosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The medical treatment includes anthelmintics (mebendazole or albendazole) and glucocorticosteroids."
    explanation: ICT opinion naming the anthelmintics and glucocorticosteroids used to treat human trichinellosis.
diagnosis:
- name: Serology, eosinophilia and muscle biopsy
  description: >-
    Diagnosis rests on epidemiological exposure, blood eosinophilia and raised
    muscle enzymes, Trichinella-specific serology, and, where needed, detection
    of encapsulated larvae in a muscle biopsy; no single sign is pathognomonic.
  diagnosis_term:
    preferred_term: serologic testing and muscle biopsy
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "nonspecific laboratory parameters such as eosinophilia, muscle enzymes, and serology"
    explanation: Names the laboratory parameters used in diagnosis.

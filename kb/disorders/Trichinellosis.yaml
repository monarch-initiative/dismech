name: Trichinellosis
creation_date: "2026-11-25T00:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: trichinellosis
  term:
    id: MONDO:0019444
    label: trichinellosis
synonyms:
- trichinosis
- trichiniasis
- Trichinella infection
description: >-
  A foodborne zoonosis acquired by eating raw or undercooked meat containing
  encysted first-stage (L1) larvae of the nematode genus Trichinella, of which
  Trichinella spiralis in the domestic pig is the principal human pathogen. The
  disease runs in two phases: an enteral phase, in which gastric digestion frees
  the larvae and they invade the small-intestinal epithelium and mature into
  adults (diarrhoea), and a parenteral phase, in which adult females release
  newborn larvae that disseminate through the tissues and provoke a systemic
  type 2, eosinophil-rich allergic response (eosinophilia, facial/periorbital
  oedema, fever, headache) before entering striated muscle. There each larva
  forces its host myocyte to dedifferentiate and build a collagen-walled "nurse
  cell", producing myalgia and raised muscle enzymes. Most disease is
  self-limited; severe infection can cause eosinophilic myocarditis and central
  nervous system involvement, and deaths occur about 4-6 weeks after infection.
notes: >-
  The genus Trichinella comprises thirteen taxa (encapsulated and
  non-encapsulated clades); Trichinella spiralis is bound as the principal human
  agent, with T. britovi, T. nativa, T. pseudospiralis and others causing a
  clinically similar illness from different reservoirs. Severe-disease features
  (eosinophilic myocarditis in weeks 3-4, and CNS involvement) are recognised in
  the literature but are recorded here in prose rather than as cited phenotypes,
  pending exact-quote sources. The systemic-response node is intended to conform
  to the helminth_larval_migration_type2_response module (its central Type 2
  Immune Response node); that conforms_to link is added in a follow-up once the
  module is on main, because the anchor is gated by a hard foreign-key test.
review_notes: >-
  Deliberately lumped. The Trichinella species (T. spiralis, T. britovi, T.
  nativa, T. pseudospiralis, T. murrelli, T. nelsoni, T. papuae and others) are
  kept together as one trichinellosis entry rather than split per species: they
  produce a clinically indistinguishable two-phase illness (enteral invasion
  then muscle encapsulation) that is diagnosed and treated as a unit, and the
  literature searched (PMID:19136437, PMID:22172230, PMID:41615911) describes
  them under the single clinical entity, differing mainly in reservoir, cold
  resistance and whether the nurse cell is encapsulated, not in the mechanism or
  management. T. spiralis is bound as the principal agent.
infectious_agent:
- name: Trichinella spiralis
  description: >-
    Trichinella spiralis, the principal cause of human trichinellosis worldwide,
    an encapsulated-clade nematode whose domestic-pig cycle is the dominant
    source of human infection.
  infectious_agent_term:
    preferred_term: Trichinella spiralis
    term:
      id: NCBITaxon:6334
      label: Trichinella spiralis
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most important source of human infection worldwide is the domestic pig, but, e.g., in Europe, meats of horses and wild boars have played a significant role during outbreaks within the past 3 decades."
    explanation: Identifies the domestic-pig Trichinella cycle as the principal human source.
transmission:
- name: Foodborne transmission (ingestion of larvae in meat)
  description: >-
    Humans are infected by eating raw or undercooked meat (pork, wild boar,
    horse or game) that contains encysted infective L1 Trichinella larvae.
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infection of humans occurs with the ingestion of Trichinella larvae that are encysted in muscle tissue of domestic or wild animal meat."
    explanation: Establishes foodborne transmission via encysted larvae in meat.
agent_life_cycle:
  description: >-
    Trichinella completes its whole cycle within a single host: adult worms in
    the gut produce newborn larvae that encyst in that same host's striated
    muscle, and transmission occurs when a carnivore or omnivore eats infected
    muscle. Domestic pigs are the main source for humans, with a sylvatic cycle
    in wild carnivores; humans are dead-end hosts.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: dead-end host
  - preferred_term: pig
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
    role: principal domestic reservoir and source of human infection
pathophysiology:
- name: Enteral Larval Invasion
  biological_scale: TISSUE
  description: >-
    Gastric acid and pepsin free the ingested L1 larvae from the meat; the
    larvae invade the columnar epithelium of the small intestine and moult into
    adults, producing mucosal inflammation and the enteral-phase diarrhoea.
  biological_processes:
  - preferred_term: larval entry into intestinal epithelium
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  downstream:
  - target: Diarrhea
    description: Mucosal invasion produces the enteral-phase diarrhoea.
  - target: Systemic Larval Migration and Type 2 Eosinophilic Response
    description: Adults release newborn larvae that disseminate systemically.
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infection of humans occurs with the ingestion of Trichinella larvae that are encysted in muscle tissue of domestic or wild animal meat."
    explanation: The ingested encysted larvae initiate the enteral phase.
- name: Systemic Larval Migration and Type 2 Eosinophilic Response
  biological_scale: ORGANISM
  description: >-
    Adult females release newborn larvae that disseminate through the tissues,
    provoking a systemic type 2, eosinophil-rich allergic response. The
    resulting eosinophilia, facial/periorbital oedema, fever and headache are
    the hallmark parenteral-phase features; eosinophilia is one of the
    (nonspecific) laboratory signs of the disease.
  biological_processes:
  - preferred_term: type 2 immune response
    modifier: INCREASED
    term:
      id: GO:0042092
      label: type 2 immune response
  - preferred_term: eosinophil activation
    modifier: INCREASED
    term:
      id: GO:0043307
      label: eosinophil activation
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  downstream:
  - target: Eosinophilia
    description: The type 2 response drives blood and tissue eosinophilia.
  - target: Facial edema
    description: The systemic allergic response produces facial/periorbital oedema.
  - target: Fever
    description: The systemic inflammatory response produces fever.
  - target: Headache
    description: Headache is a major parenteral-phase symptom.
  - target: Muscle Invasion and Nurse Cell Formation
    description: Migrating newborn larvae enter striated muscle.
  evidence:
  - reference: PMID:19136437
    reference_title: "Epidemiology, diagnosis, treatment, and control of trichinellosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "nonspecific laboratory parameters such as eosinophilia, muscle enzymes, and serology"
    explanation: Eosinophilia is a characteristic laboratory sign of the systemic response.
  - reference: PMID:22172230
    reference_title: "Worldwide occurrence and impact of human trichinellosis, 1986-2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major clinical effects, according to 5,377 well-described cases, were myalgia, diarrhea, fever, facial edema, and headaches."
    explanation: Facial oedema, fever and headache are among the major clinical effects.
- name: Muscle Invasion and Nurse Cell Formation
  biological_scale: CELLULAR
  description: >-
    Newborn larvae that enter striated muscle force the infected myocyte to
    dedifferentiate, re-enter and then arrest the cell cycle, while satellite
    cells are activated; a collagen-walled "nurse cell" capsule forms around the
    larva. The myositis of this phase produces myalgia and raised muscle enzymes.
  biological_processes:
  - preferred_term: negative regulation of cell cycle
    modifier: INCREASED
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
  - preferred_term: skeletal muscle satellite cell differentiation
    modifier: INCREASED
    term:
      id: GO:0014816
      label: skeletal muscle satellite cell differentiation
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  - preferred_term: skeletal muscle satellite cell
    term:
      id: CL:0000594
      label: skeletal muscle satellite cell
  downstream:
  - target: Myalgia
    description: The muscle-phase myositis produces myalgia.
  - target: Elevated muscle enzymes
    description: Muscle-cell injury raises circulating muscle enzymes.
  evidence:
  - reference: PMID:18710582
    reference_title: "Trichinella spiralis: nurse cell formation with emphasis on analogy to muscle cell repair."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The process of nurse cell formation is complex and includes infected muscle cell response (de-differentiation, cell cycle re-entry and arrest) and satellite cell responses (activation, proliferation and differentiation)."
    explanation: Describes the nurse-cell transformation of infected muscle driving the muscle phase.

name: Congenital Adrenal Hyperplasia
creation_date: "2026-05-07T12:55:39Z"
category: Mendelian
synonyms:
- CAH
- adrenal hyperplasia, congenital
- adrenogenital syndrome
description: >-
  Congenital adrenal hyperplasia is a genetically heterogeneous group of
  autosomal recessive disorders of adrenal steroidogenesis in which an enzyme
  block impairs cortisol synthesis, releasing ACTH from negative feedback and
  driving adrenocortical hyperplasia with accumulation of steroid precursors
  proximal to the block. 21-hydroxylase deficiency (CYP21A2) accounts for
  95-99% of cases and shunts precursors into androgen synthesis, causing
  prenatal virilization of 46,XX infants and, in severe classic disease,
  aldosterone deficiency with neonatal salt-wasting crisis. Rarer enzyme
  defects (CYP11B1, CYP17A1, HSD3B2, STAR) produce distinct steroid patterns,
  including mineralocorticoid-precursor-driven hypertension.
notes: >-
  The curated scope emphasizes 21-hydroxylase deficiency, the overwhelmingly
  predominant form, while preserving subtype framing for the major rarer CAH
  enzyme defects.

  GeneReviews baseline: the 21-hydroxylase chapter (PMID:20301350) is the
  chapter for the dominant form and is cited on the salt-wasting and
  simple-virilizing subtype rows. There is no GeneReviews chapter for
  congenital adrenal hyperplasia as a whole; the offline Bookshelf index this
  repository commits returns only the 21-hydroxylase chapter for this entry's
  name, so the rarer enzyme defects are curated from the review literature.

- name: POR Electron-Transfer Failure to Microsomal P450 Enzymes
  description: >-
    POR pathogenic variants reduce the NADPH-dependent electron donor that every
    endoplasmic-reticulum cytochrome P450 requires for catalysis. This is the
    only lesion in this entry that reaches more than one enzymatic node: the
    same defect partially disables CYP17A1 and CYP21A2 together, which is why
    POR deficiency presents as a combined rather than a single-step block, and
    why it also affects aromatase and hepatic drug-metabolising P450s that lie
    outside adrenal steroidogenesis altogether.
  genes:
  - preferred_term: POR
    term:
      id: hgnc:9208
      label: POR

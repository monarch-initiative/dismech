genetic:
- name: CYP21A2 pathogenic variants
  gene_term:
    preferred_term: CYP21A2
    term:
      id: hgnc:2600
      label: CYP21A2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Classic 21-OHD
  features: >-
    CYP21A2 variants cause 21-hydroxylase deficiency, producing the dominant
    CAH subtype and a phenotype spectrum from classic salt-wasting disease to
    nonclassic hyperandrogenism.
  notes: >-
    The lesion type here is unlike the rest of this entry's genes. CYP21A2 sits
    in the RCCX copy-number-variable module of the MHC class III region beside
    an inactive, highly homologous pseudogene, CYP21A1P. Most disease alleles
    are therefore not independent new mutations but transfers of the
    pseudogene's own deleterious variants into the functional gene: the cited
    review attributes over 95% of deleterious 21OHD alleles to intergenic
    recombination, of which microconversions from the pseudogene are 70% to 75%
    and non-uniform meiotic crossing-over - which produces CYP21A1P/CYP21A2
    chimeric genes and a 30-kb deletion - is 20% to 25%. Only 5% to 10% of small
    pathogenic variants arise outside these recombination events.

    Two practical consequences follow and are the reason this is recorded rather
    than left implicit. First, a small recurrent set of pathogenic variants is
    seen in every population, because they are the pseudogene's variants rather
    than population-specific founder alleles. Second, the homology defeats
    ordinary sequencing: the review states that next-generation sequencing is
    not yet recommended for CYP21A2 genotyping because it can call pseudogene
    variants as gene variants, and that MLPA plus selective long-range
    amplification is the recommended approach.
  evidence:
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      21OHD is due to an insufficiency of 21-hydroxylase enzyme, which is
      encoded by the CYP21A2 gene and involved in cortisol and aldosterone
      production.
    explanation: Directly links CYP21A2 to 21-hydroxylase deficiency.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 95% of deleterious variants leading to 21OHD are attributable to intergenic recombination events where microconversions, consisting in the transfer to CYP21A2 of deleterious variants usually present in the CYP21A1P pseudogene, represent 70% to 75%"
    explanation: >-
      The quantitative basis for this record's claim that the CYP21A2 lesion is
      predominantly gene conversion from the CYP21A1P pseudogene rather than
      independent mutation.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A consequence of this phenomenon is that a small group of pathogenic variants with recognized phenotypic effects is detected in all populations"
    explanation: Supports the first practical consequence recorded in this record's notes.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 5% to 10% of small pathogenic variants affecting the CYP21A2 gene are not the result of genetic conversions"
    explanation: >-
      Substantiates the residual fraction of CYP21A2 alleles that arise outside
      the gene-conversion and crossing-over mechanisms.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonuniform meiotic crossing-over event is responsible for 20% to 25% of the remaining intergenic recombinations."
    explanation: >-
      Substantiates the crossing-over share, and with the microconversion figure
      above accounts for the recombination total this record states.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 30-kb deletion within RCCX region, encompassing the 3\u2032 end of CYP21A1P, all the C4B gene, and the 5\u2032 end of the CYP21A2 gene, leaves the TNXB gene intact"
    explanation: Substantiates the chimeric-gene and 30-kb deletion product of the crossing-over mechanism.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "next-generation sequencing (NGS) is not yet recommended for CYP21A2 genotyping"
    explanation: >-
      Supports the second practical consequence: the gene-pseudogene homology
      makes routine short-read sequencing unsafe for this locus.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NGS, in the current state of the art, can identify pathogenic variants of the pseudogene and contribute to an inadequate molecular diagnosis"
    explanation: States the specific failure mode - pseudogene variants miscalled as gene variants.
  - reference: PMID:39911519
    reference_title: "Genetics in Congenital Adrenal Hyperplasia Due to 21-Hydroxylase Deficiency and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MLPA is recommended as the first step in 21OHD molecular diagnosis to determine the exact copy number of genes and pseudogenes within the RCCX region"
    explanation: Substantiates the recommended genotyping approach named in this record's notes.

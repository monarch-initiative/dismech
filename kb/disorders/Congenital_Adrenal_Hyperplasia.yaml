- name: POR-D
  display_name: P450 oxidoreductase deficiency
  description: >-
    CAH caused by POR deficiency. Mechanistically it is the odd one out of this
    family: POR is not a steroidogenic enzyme but the NADPH-dependent electron
    donor that every endoplasmic-reticulum cytochrome P450 requires, so a single
    lesion partially disables CYP17A1 and CYP21A2 together and produces a
    combined rather than a single-step block. The same dependency explains the
    features no other CAH subtype has: impaired aromatase (CYP19A1) activity can
    virilize the mother during pregnancy, skeletal malformation overlapping
    Antley-Bixler syndrome occurs, and hepatic drug metabolism is affected.
  subtype_term:
    preferred_term: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
    term:
      id: MONDO:0013310
      label: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
  genes:
  - preferred_term: POR
    term:
      id: hgnc:9208
      label: POR
  evidence:
  - reference: PMID:33415088
    reference_title: Congenital Adrenal Hyperplasias Presenting in the Newborn and Young Infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Less frequent types of CAH are 11\u03b2-hydroxylase deficiency (CYP11B1-D, up to 8% cases), 17\u03b1-hydroxylase/17\u201320 lyase deficiency (CYP17A1-D), 3\u03b2-hydroxysteroid dehydrogenase deficiency (HDS3B2-D), P450 oxidoreductase deficiency (POR-D), P450 cytochrome side-chain cleavage deficiency (CYP11A1-D), and StAR deficiency (StAR-D)."
    explanation: >-
      Names POR deficiency in this review's enumeration of the less frequent
      types of congenital adrenal hyperplasia. The source's typo in the 3-beta
      symbol (HDS3B2-D) is preserved because the snippet must be exact.
  - reference: PMID:33415088
    reference_title: Congenital Adrenal Hyperplasias Presenting in the Newborn and Young Infant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal virilization during pregnancy, due to a defect in aromatase (CYP19A1) activity, is described in 21% of mothers"
    explanation: >-
      Supports the maternal-virilization feature this row gives as one of the
      consequences of POR's role as a shared P450 electron donor.

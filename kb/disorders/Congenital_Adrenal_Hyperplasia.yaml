- name: HSD3B2 pathogenic variants
  gene_term:
    preferred_term: HSD3B2
    term:
      id: hgnc:5218
      label: HSD3B2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: 3B-HSD
  features: >-
    HSD3B2 variants cause 3 beta-hydroxysteroid dehydrogenase deficiency CAH.
  notes: >-
    HSD3B2 is the adrenal and gonadal isozyme of 3-beta-hydroxysteroid
    dehydrogenase; the placental isozyme HSD3B1 is a separate gene and is not
    implicated in CAH. Because the enzyme acts at the delta-5 to delta-4
    conversion shared by all three steroid classes, the block is earlier in the
    pathway than the 21- and 11-beta-hydroxylase blocks and impairs gonadal as
    well as adrenal steroidogenesis.

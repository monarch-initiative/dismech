- name: STAR pathogenic variants
  gene_term:
    preferred_term: STAR
    term:
      id: hgnc:11359
      label: STAR
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Lipoid CAH
  features: >-
    STAR variants cause lipoid congenital adrenal hyperplasia by impairing
    cholesterol delivery for steroidogenesis.
  notes: >-
    STAR is the one gene in this entry that encodes neither an enzyme nor an
    enzyme's electron donor: the steroidogenic acute regulatory protein delivers
    cholesterol to the inner mitochondrial membrane, so its loss starves the
    first committed step rather than blocking a later one. That places the
    defect above every enzymatic block modelled here and explains the
    near-complete loss of adrenal and gonadal steroid output and the cholesterol
    ester accumulation that gives the lipoid form its name. A minority of
    clinically lipoid CAH is due to CYP11A1 rather than STAR; MONDO has no
    congenital-adrenal-hyperplasia child term for the CYP11A1 form (its only
    CYP11A1 CAH classes are non-human-animal ones), so no subtype row is
    recorded for it here.
  evidence:
  - reference: PMID:39713884
    reference_title: Rare Types of Congenital Adrenal Hyperplasias Other Than 21-hydroxylase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical form usually occurs with loss-of-function in the StAR gene"
    explanation: Establishes loss of STAR function as the cause of classic lipoid congenital adrenal hyperplasia.
  - reference: PMID:39713884
    reference_title: Rare Types of Congenital Adrenal Hyperplasias Other Than 21-hydroxylase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with LCAH, which develops due to steroidogenic acute regulatory protein deficiency, typically present with salt wasting in the first year of life. It is characterized by complete or near-complete deficiency of adrenal and gonadal steroid hormones and progressive accumulation of cholesterol esters in the adrenal gland."
    explanation: >-
      Supports both the near-complete steroid-output failure and the cholesterol
      ester accumulation this record attributes to loss of cholesterol delivery.
  - reference: PMID:39713884
    reference_title: Rare Types of Congenital Adrenal Hyperplasias Other Than 21-hydroxylase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hovever in most patients with LCAH, the defect is found in StAR not the CYP11A1 gene for P450scc"
    explanation: >-
      Supports this record's statement that STAR accounts for most, but not all,
      of clinically lipoid CAH. The source's typographic error in the first word
      is preserved as the snippet must be an exact quotation.

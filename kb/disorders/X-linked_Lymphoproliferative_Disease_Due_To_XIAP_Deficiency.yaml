    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, neither lymphoproliferative disease nor common variable
      immunodeficiency has been reported in males with XLP2.
    explanation: >-
      The GeneReviews chapter states directly that lymphoproliferative disease
      has not been reported in XLP2.
  - reference: PMID:20489057
    reference_title: >-
      XIAP deficiency: a unique primary immunodeficiency best classified as
      X-linked familial hemophagocytic lymphohistiocytosis and not as X-linked
      lymphoproliferative disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XIAP deficiency was originally observed to be associated with a high
      incidence of hemophagocytic lymphohistiocytosis (HLH) and a lack of
      lymphoma, suggesting that classification of XIAP deficiency as a cause of
      XLP may not be entirely accurate.
    explanation: >-
      States the lack of lymphoma as the basis for reclassifying the disease
      away from XLP.
biochemical:
- name: Serum interleukin-18
  presence: INCREASED
  context: >-
    Serum IL-18 in XIAP deficiency reaches concentrations an order of magnitude
    above those seen in SAP deficiency, perforin deficiency (FHL2) or
    EBV-associated HLH, spikes with every HLH episode, and remains elevated in
    clinical remission after other pro-inflammatory cytokines have normalised.
    That persistence makes it a candidate disease-activity marker rather than a
    simple acute-phase reactant. Reported in a 10-patient cohort; it has not
    been prospectively validated as a diagnostic or monitoring test.
  readouts:
  - target: Inflammasome Dysregulation and Sustained IL-18 Excess
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Serum IL-18 tracks the hyperinflammatory node, rising with each HLH
      episode and remaining above normal between episodes.
    evidence:
    - reference: PMID:24084330
      reference_title: >-
        Sustained elevation of serum interleukin-18 and its association with
        hemophagocytic lymphohistiocytosis in XIAP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Longitudinal examination of two patients demonstrated marked
        exacerbation of IL-18 levels during every occasion of HLH.
      explanation: >-
        Longitudinal within-patient data show IL-18 tracking disease activity.
  evidence:
  - reference: PMID:24084330
    reference_title: >-
      Sustained elevation of serum interleukin-18 and its association with
      hemophagocytic lymphohistiocytosis in XIAP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The concentration of interleukin (IL)-18 was strikingly elevated in the
      patients presented with HLH, and remained high after the recovery from
      HLH although levels of other pro-inflammatory cytokines approached the
      normal range.
    explanation: >-
      Establishes both the magnitude of the IL-18 elevation and its persistence
      outside acute episodes.
genetic:
- name: XIAP
  gene_term:
    preferred_term: XIAP
    term:
      id: hgnc:592
      label: XIAP
  association: CAUSATIVE
  notes: >-
    XLP2 is caused by hemizygous germline loss-of-function variants in XIAP,
    also known as BIRC4 (OMIM 300079; the XLP2 phenotype is OMIM 300635). Most
    reported alleles are nonsense, frameshift or splice variants that abolish or
    severely reduce XIAP protein, which is why flow cytometry for intracellular
    XIAP is a useful but imperfect screen. A minority are missense alleles
    concentrated in the BIR2 and RING domains. Neither genotype nor residual
    protein expression predicts the clinical phenotype, so molecular testing is
    required for diagnosis.
  evidence:
  - reference: PMID:17080092
    reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identify mutations in the gene that encodes the X-linked
      inhibitor-of-apoptosis XIAP (also termed BIRC4) in patients with XLP from
      three families without mutations in SAP. These mutations lead to defective
      expression of XIAP.
    explanation: >-
      Establishes XIAP/BIRC4 as the causative gene, identified in XLP families
      without SAP mutations.
  - reference: PMID:23973892
    reference_title: >-
      X-linked inhibitor of apoptosis (XIAP) deficiency: the spectrum of
      presenting manifestations beyond hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, neither genotype nor protein expression nor results from cell
      death studies were clearly associated with the clinical phenotype. Only
      mutation analysis can reliably identify affected patients.
    explanation: >-
      Documents the absence of genotype-phenotype correlation and the need for
      molecular testing rather than functional screening.
  - reference: PMID:22228567
    reference_title: Clinical and genetic characteristics of XIAP deficiency in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven out of eight patients showed decreased XIAP protein expression."
    explanation: >-
      Quantifies the sensitivity limitation of XIAP protein screening: one of
      eight tested patients had normal expression.
  - reference: PMID:23818254
    reference_title: >-
      Disease-causing mutations in the XIAP BIR2 domain impair NOD2-dependent
      immune signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we identify the XIAP baculovirus IAP repeat (BIR)2 domain as a
      hotspot for missense mutations in XLP2.
    explanation: >-
      Locates the missense allele hotspot to the BIR2 domain, complementing the
      predominantly truncating spectrum.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists for XLP2. The disease is
    described only through case series: 33 XLP1 versus 30 XLP2 patients in the
    largest comparative cohort, 25 patients in the German-led series of
    presenting manifestations, 19 transplanted patients in the international HSCT
    survey, 10 in the Cincinnati series and nine in the Japanese series, with
    substantial overlap between them. Orphanet has no cached record for this
    concept in this repository's structured reference cache, so no Orphanet
    prevalence class is quoted here.
  evidence:
  - reference: PMID:25666262
    reference_title: XIAP deficiency syndrome in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-linked inhibitor of apoptosis (XIAP) deficiency, also known as the
      X-linked lymphoproliferative syndrome type 2 (XLP-2), is a rare primary
      immunodeficiency.
    explanation: >-
      A dedicated review characterises the disease as rare, supporting a
      qualitative rather than numeric prevalence class.
  - reference: PMID:21119115
    reference_title: >-
      Clinical similarities and differences of patients with X-linked
      lymphoproliferative syndrome type 1 (XLP-1/SAP deficiency) versus type 2
      (XLP-2/XIAP deficiency).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, a comparison of the clinical phenotypes associated with XLP-1 and
      XLP-2 was performed in cohorts of 33 and 30 patients, respectively.
    explanation: >-
      The largest published XLP2 cohort assembled internationally numbered 30
      patients, supporting a cases-in-literature measure.
treatments:
- name: Allogeneic hematopoietic stem cell transplantation with reduced-intensity conditioning
  description: >-
    Allogeneic HSCT is the only therapy that removes the underlying defect,
    replacing the XIAP-deficient haematopoietic compartment and, in reported
    cases, fully restoring intestinal homeostasis. Conditioning intensity is the
    critical variable and XIAP deficiency is an explicit exception to standard
    practice: in the international survey, only one of seven patients given
    busulfan-containing myeloablative conditioning survived, with deaths from
    transplant-related toxicity including venoocclusive disease and pulmonary
    haemorrhage, plausibly because losing XIAP's antiapoptotic function
    sensitises tissues to conditioning injury. Reduced-intensity conditioning
    gave 55% survival overall and 86% among those in HLH remission at
    transplant. Myeloablative regimens should not be used; reduced-intensity
    regimens should be used with caution and, where possible, only after HLH
    remission is achieved.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: XIAP Loss of Function
    treatment_effect: RESTORES
    description: >-
      Donor haematopoiesis supplies XIAP-competent lymphocytes and monocytes,
      restoring both the caspase-inhibitory and the NOD2-scaffolding functions in
      the haematopoietic compartment.
    evidence:
    - reference: PMID:24942515
      reference_title: >-
        Characterization of Crohn disease in X-linked inhibitor of
        apoptosis-deficient male patients and female symptomatic carriers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 2 patients hematopoietic stem cell transplantation fully restored intestinal homeostasis."
      explanation: >-
        Demonstrates that replacing the XIAP-deficient haematopoietic
        compartment corrects the downstream intestinal disease.
  evidence:
  - reference: PMID:23131490
    reference_title: >-
      Allogeneic hematopoietic cell transplantation for XIAP deficiency: an
      international survey reveals poor outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival was poor in the MAC group, with only 1 patient surviving (14%).
      Most deaths were from transplantation-related toxicities, including
      venoocclusive disease and pulmonary hemorrhage.
    explanation: >-
      Quantifies the excess toxicity of myeloablative conditioning that makes
      XIAP deficiency an exception to standard transplant practice.
  - reference: PMID:23131490
    reference_title: >-
      Allogeneic hematopoietic cell transplantation for XIAP deficiency: an
      international survey reveals poor outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that MAC regimens should not be used for patients with XIAP
      deficiency. It is possible that the loss of XIAP and its antiapoptotic
      functions contributes to the high incidence of toxicities observed with
      MAC regimens.
    explanation: >-
      States the recommendation against myeloablative conditioning and its
      mechanistic rationale in XIAP biology.
  - reference: PMID:23131490
    reference_title: >-
      Allogeneic hematopoietic cell transplantation for XIAP deficiency: an
      international survey reveals poor outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RIC regimens should be pursued with caution and, if possible, efforts
      should be made to ensure HLH remission before HCT in these patients.
    explanation: >-
      States the recommendation for reduced-intensity conditioning and for
      achieving HLH remission before transplant.
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For individuals with XLP2, many manifestations of disease can be improved
      with HSCT; however, there are more complications in these individuals.
    explanation: >-
      GeneReviews confirms both the benefit and the excess complication rate of
      HSCT specifically in XLP2.
- name: HLH-directed immunochemotherapy
  description: >-
    Acute hyperinflammatory episodes are treated with the standard HLH approach:
    etoposide and corticosteroids, with rituximab considered where EBV drives the
    episode, plus cyclosporine in many reported cases. This suppresses the
    episode and is used as a bridge to transplant; it does not correct the
    underlying defect, and recurrence after treatment is characteristic of this
    disease.
  treatment_term:
    preferred_term: HLH-directed pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Hemophagocytic Lymphohistiocytosis Susceptibility
    treatment_effect: INHIBITS
    description: >-
      Etoposide and corticosteroids suppress the activated T cells and
      macrophages driving the episode; rituximab depletes the EBV-infected B
      cells that trigger it. The underlying XIAP defect is untouched, so the
      predisposition persists.
    evidence:
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
        (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
        steroids and consideration of rituximab), lymphoma, colitis, aplastic
        anemia, and vasculitis.
      explanation: >-
        GeneReviews specifies etoposide, steroids and rituximab as the supportive
        treatment of HLH in XLP.
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
      (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
      steroids and consideration of rituximab), lymphoma, colitis, aplastic
      anemia, and vasculitis.
    explanation: >-
      Identifies the standard HLH-directed supportive regimen used in XLP,
      including XLP2.
  - reference: PMID:23131490
    reference_title: >-
      Allogeneic hematopoietic cell transplantation for XIAP deficiency: an
      international survey reveals poor outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preparative regimen and HLH activity affected outcomes, and of RIC
      patients reported to be in remission from HLH, survival is 86% (P = .03).
    explanation: >-
      Achieving HLH remission before transplant materially improves survival,
      which is the main reason HLH-directed therapy is given as a bridge.
- name: Management of XIAP-associated inflammatory bowel disease
  description: >-
    The Crohn-like IBD of XIAP deficiency is treated along conventional
    inflammatory-bowel-disease lines, but it is characteristically severe and
    difficult to treat, and standard therapy is often inadequate - which is why
    XIAP deficiency should be considered in refractory paediatric-onset Crohn
    disease and why transplant is escalated to when medical management fails.
    Colitis and cholangitis warrant active surveillance in XLP2.
  treatment_term:
    preferred_term: pharmacotherapy for inflammatory bowel disease
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Crohn-like Intestinal Inflammation
    treatment_effect: MODULATES
    description: >-
      Conventional IBD therapy suppresses the mucosal inflammatory response
      without correcting the underlying NOD2 signaling defect, which is the
      likely reason for its limited efficacy here.
    evidence:
    - reference: PMID:24942515
      reference_title: >-
        Characterization of Crohn disease in X-linked inhibitor of
        apoptosis-deficient male patients and female symptomatic carriers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The age at onset was variable (from 3 months to 41 years), and IBD was
        severe and difficult to treat.
      explanation: >-
        Documents the limited response of XIAP-associated IBD to available
        therapy.
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monitor for signs and symptoms of colitis and cholangitis in those with
      XLP2
    explanation: >-
      GeneReviews makes colitis and cholangitis surveillance an XLP2-specific
      management recommendation.
  - reference: PMID:24942515
    reference_title: >-
      Characterization of Crohn disease in X-linked inhibitor of
      apoptosis-deficient male patients and female symptomatic carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2 patients hematopoietic stem cell transplantation fully restored intestinal homeostasis."
    explanation: >-
      Establishes transplant as the escalation when medical management of the
      intestinal disease fails.
- name: Immunoglobulin replacement therapy
  description: >-
    Immunoglobulin substitution (IVIG or subcutaneous IgG) is given to the
    subset of patients with hypogammaglobulinemia. In XLP2 the humoral defect is
    typically transient, so the requirement is often temporary, unlike in XLP1.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Hypogammaglobulinemia
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
      (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
      steroids and consideration of rituximab), lymphoma, colitis, aplastic
      anemia, and vasculitis.
    explanation: >-
      Identifies IVIG or IgG as the standard treatment for the
      hypogammaglobulinemia component.
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transient hypogammaglobulinemia has been rarely observed in those with XLP2."
    explanation: >-
      Supports the transient and less universal nature of the humoral defect in
      XLP2, which qualifies the indication.

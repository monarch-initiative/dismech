name: X-linked Lymphoproliferative Disease Due To XIAP Deficiency
creation_date: '2026-09-01T00:00:00Z'
category: Genetic
synonyms:
- XLP2
- XIAP deficiency
- X-linked lymphoproliferative syndrome type 2
- XIAP-related lymphoproliferative disease, X-linked
- BIRC4 deficiency
description: >-
  X-linked lymphoproliferative disease type 2 (XLP2) is caused by hemizygous
  loss-of-function variants in XIAP (also called BIRC4), which encodes the
  X-linked inhibitor of apoptosis protein. Despite sharing the XLP name and the
  susceptibility to Epstein-Barr virus with SAP/SH2D1A deficiency (XLP1), XIAP
  deficiency is a clinically distinct disease. Its core triad is recurrent
  hemophagocytic lymphohistiocytosis (HLH) - often EBV-triggered but frequently
  occurring without any demonstrable EBV infection - recurrent splenomegaly
  with cytopenias and fever, and a severe, treatment-refractory Crohn-like
  inflammatory bowel disease. The single most useful discriminator from XLP1 is
  a negative one: lymphoma, which affects roughly a third of XLP1 patients, has
  not been reported in males with XLP2, and common variable immunodeficiency has
  likewise not been described in them. XIAP has two largely separable functions
  that map onto the two clinical arms of the disease. Through its BIR domains it
  inhibits apoptotic caspases, so its loss makes lymphocytes hypersensitive to
  CD95-, TRAIL-R- and TCR-driven activation-induced cell death and depletes
  invariant NKT cells, degrading control of EBV and predisposing to HLH.
  Through its RING domain it is the essential ubiquitin ligase that
  ubiquitylates RIPK2 and recruits LUBAC to NOD2, so its loss cripples
  NOD2/NOD1-dependent NF-kappaB signaling in monocytes and intestinal
  epithelium and produces the Crohn-like colitis. A third strand, inflammasome
  dysregulation with strikingly and persistently elevated serum IL-18,
  accompanies and probably amplifies the hyperinflammatory episodes.

classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      XIAP deficiency is an inborn error of immunity in the IUIS immune
      dysregulation group, with hemophagocytic lymphohistiocytosis and
      hyperinflammation as its defining clinical problem.
    evidence:
    - reference: PMID:25666262
      reference_title: XIAP deficiency syndrome in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The X-linked inhibitor of apoptosis (XIAP) deficiency, also known as the
        X-linked lymphoproliferative syndrome type 2 (XLP-2), is a rare primary
        immunodeficiency.
      explanation: >-
        Establishes XIAP deficiency as a primary immunodeficiency, placing it in
        Harrison's immunology/rheumatology Part.
  - classification_value: GASTROINTESTINAL
    notes: >-
      A severe, treatment-refractory Crohn-like inflammatory bowel disease is one
      of the three defining manifestations of XIAP deficiency and is frequently
      the presenting or only problem, so the disease also belongs to the
      gastrointestinal Part.
    evidence:
    - reference: PMID:24942515
      reference_title: >-
        Characterization of Crohn disease in X-linked inhibitor of
        apoptosis-deficient male patients and female symptomatic carriers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IBD in patients with XIAP deficiency is similar to Crohn disease and is
        associated with defective NOD2 function in monocytes.
      explanation: >-
        Characterises the intestinal disease of XIAP deficiency as a
        Crohn-disease-like inflammatory bowel disease, a gastrointestinal
        disorder.
    - reference: PMID:23973892
      reference_title: >-
        X-linked inhibitor of apoptosis (XIAP) deficiency: the spectrum of
        presenting manifestations beyond hemophagocytic lymphohistiocytosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These included Crohn-like bowel disease (n=6), severe infectious
        mononucleosis (n=4), isolated splenomegaly (n=3), uveitis (n=1),
        periodic fever (n=1), fistulating skin abscesses (n=1) and severe
        Giardia enteritis (n=1).
      explanation: >-
        Crohn-like bowel disease was the single commonest non-HLH presenting
        manifestation in this cohort, supporting a gastrointestinal
        classification alongside the immunologic one.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      XLP2 is a monogenic X-linked disorder diagnosed by demonstrating a
      hemizygous germline XIAP variant.
    evidence:
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The diagnosis of XLP1 or XLP2 can be established in a male proband who
        has a hemizygous germline pathogenic variant in SH2D1A (XLP1) or XIAP
        (XLP2) identified on molecular genetic testing.
      explanation: >-
        GeneReviews establishes XLP2 as a Mendelian, hemizygous germline
        disorder, supporting the genetics Part.
  iuis_category:
    classification_value: immune dysregulation
    notes: >-
      IUIS 2022 phenotypic classification, Table 4 "Diseases of immune
      dysregulation", section 7 "Susceptibility to EBV and Lymphoproliferative
      Conditions" (PMID:35748970).
    evidence:
    - reference: PMID:35748970
      reference_title: >-
        Human Inborn Errors of Immunity: 2022 Update on the Classification from
        the International Union of Immunological Societies Expert Committee.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "XIAP deficiency (XLP2) XIAP XL 300079"
      explanation: >-
        The IUIS 2022 Table 4 row for XIAP deficiency (XLP2) places the disease
        in the diseases-of-immune-dysregulation category, with X-linked
        inheritance and OMIM 300079.
    - reference: PMID:35748970
      reference_title: >-
        Human Inborn Errors of Immunity: 2022 Update on the Classification from
        the International Union of Immunological Societies Expert Committee.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "7. Susceptibility to EBV and Lymphoproliferative Conditions"
      explanation: >-
        Names the subsection of the IUIS immune-dysregulation table under which
        the XIAP deficiency row sits.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    XLP2 is inherited in an X-linked manner and is caused by hemizygous germline
    loss-of-function variants in XIAP. Heterozygous female carriers are usually
    asymptomatic, but carriers with skewed X-chromosome inactivation favouring
    the mutant allele can develop HLH and inflammatory bowel disease.
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XLP is inherited in an X-linked manner."
    explanation: States the X-linked mode of inheritance for XLP, including XLP2.
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are, however, increasing numbers of reports of affected females with
      unfavorable (skewed) X-chromosome inactivation favoring the X chromosome
      with the pathogenic variant who develop HLH, inflammatory bowel disease,
      and erythema nodosum.
    explanation: >-
      Documents symptomatic heterozygous females with skewed X-inactivation, the
      qualification to the X-linked recessive pattern.
  - reference: PMID:24942515
    reference_title: >-
      Characterization of Crohn disease in X-linked inhibitor of
      apoptosis-deficient male patients and female symptomatic carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, we report that it is not restricted to male patients because
      we identified 2 symptomatic female heterozygous carriers of XIAP
      mutations.
    explanation: >-
      Independent documentation that heterozygous female carriers can be
      symptomatic, qualifying the recessive X-linked pattern.
pathophysiology:
- name: XIAP Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Hemizygous germline XIAP/BIRC4 variants - most often nonsense, frameshift or
    splice alleles that abolish protein expression, and a smaller set of
    missense alleles clustered in the BIR2 and RING domains - eliminate or
    cripple XIAP protein. XIAP has two separable activities that both fail: its
    N-terminal BIR domains inhibit the apoptotic caspases, and its C-terminal
    RING domain provides the ubiquitin ligase activity required for NOD1/NOD2
    signaling. Loss of the first drives the lymphocyte-apoptosis arm of the
    disease; loss of the second drives the intestinal-inflammation arm.
  genetic_context:
    gene:
      preferred_term: XIAP
      term:
        id: hgnc:592
        label: XIAP
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: caspase inhibitor activity
    term:
      id: GO:0043027
      label: cysteine-type endopeptidase inhibitor activity involved in apoptotic process
    modifier: DECREASED
  biological_processes:
  - preferred_term: XIAP-mediated ubiquitylation of RIPK2
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:17080092
    reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identify mutations in the gene that encodes the X-linked
      inhibitor-of-apoptosis XIAP (also termed BIRC4) in patients with XLP from
      three families without mutations in SAP. These mutations lead to defective
      expression of XIAP.
    explanation: >-
      The founding report establishes loss of XIAP protein expression from
      XIAP/BIRC4 mutations as the molecular lesion of this disease.
  - reference: PMID:23818254
    reference_title: >-
      Disease-causing mutations in the XIAP BIR2 domain impair NOD2-dependent
      immune signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      X-linked Inhibitor of Apoptosis (XIAP) is an essential ubiquitin ligase
      for pro-inflammatory signalling downstream of the nucleotide-binding
      oligomerization domain containing (NOD)-1 and -2 pattern recognition
      receptors.
    explanation: >-
      Identifies the second, ubiquitin-ligase function of XIAP that is lost in
      this disease, distinct from its caspase-inhibitory role.
  - reference: PMID:23818254
    reference_title: >-
      Disease-causing mutations in the XIAP BIR2 domain impair NOD2-dependent
      immune signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we identify the XIAP baculovirus IAP repeat (BIR)2 domain as a
      hotspot for missense mutations in XLP2.
    explanation: >-
      Locates the recurrent missense alleles to the BIR2 domain, complementing
      the predominantly truncating allele spectrum.
  downstream:
  - target: Enhanced Activation-Induced Lymphocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Without XIAP to restrain the apoptotic caspases, lymphocytes from patients
      die more readily in response to death-receptor and antigen-receptor
      stimulation.
    evidence:
    - reference: PMID:17080092
      reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We show that apoptosis of lymphocytes from XIAP-deficient patients is
        enhanced in response to various stimuli including the T-cell antigen
        receptor (TCR)-CD3 complex, the death receptor CD95 (also termed Fas or
        Apo-1) and the TNF-associated apoptosis-inducing ligand receptor
        (TRAIL-R).
      explanation: >-
        Directly links loss of XIAP to enhanced lymphocyte apoptosis in patient
        cells.
  - target: Defective NOD2 Signaling in Monocytes and Intestinal Epithelium
    causal_link_type: DIRECT
    description: >-
      The RING-domain ubiquitin ligase activity of XIAP is required to
      ubiquitylate RIPK2 and recruit LUBAC to NOD2; XLP2 alleles abolish this
      step.
    evidence:
    - reference: PMID:22607974
      reference_title: >-
        The ubiquitin ligase XIAP recruits LUBAC for NOD2 signaling in
        inflammation and innate immunity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Remarkably, XLP-2-derived XIAP variants have impaired ubiquitin ligase
        activity, fail to ubiquitylate RIPK2, and cannot facilitate NOD2
        signaling.
      explanation: >-
        Shows that the patient-derived XIAP variants themselves are the cause of
        the NOD2 signaling failure.
  - target: Inflammasome Dysregulation and Sustained IL-18 Excess
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      XIAP-deficient patients show a strikingly and persistently elevated serum
      IL-18 that is not seen in other forms of HLH. The intermediate steps are
      not established; NOD2-dependent caspase-1 activation is the leading
      candidate, and patient monocytes stimulated in vitro did not
      oversecrete IL-18, so the cellular source remains open.
    evidence:
    - reference: PMID:24084330
      reference_title: >-
        Sustained elevation of serum interleukin-18 and its association with
        hemophagocytic lymphohistiocytosis in XIAP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The concentration of interleukin (IL)-18 was strikingly elevated in the
        patients presented with HLH, and remained high after the recovery from
        HLH although levels of other pro-inflammatory cytokines approached the
        normal range.
      explanation: >-
        Documents an IL-18 abnormality specific to XIAP deficiency that persists
        outside acute episodes, consistent with a constitutive consequence of
        XIAP loss.
- name: Enhanced Activation-Induced Lymphocyte Apoptosis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    XIAP-deficient T cells are hypersensitive to CD95 (Fas), TRAIL-R and
    TCR-CD3-driven apoptosis, i.e. to activation-induced cell death. Activated
    effector lymphocytes are therefore deleted prematurely during an immune
    response, and the cells that would normally clear an infected target are
    lost at the moment they are needed. This is the arm of XIAP biology that the
    IUIS classification records as the functional defect of the disease.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: lymphocyte apoptotic process
    term:
      id: GO:0070227
      label: lymphocyte apoptotic process
    modifier: INCREASED
  - preferred_term: T cell homeostasis
    term:
      id: GO:0043029
      label: T cell homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:35748970
    reference_title: >-
      Human Inborn Errors of Immunity: 2022 Update on the Classification from
      the International Union of Immunological Societies Expert Committee.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Increased T cells susceptibility to apoptosis to CD95 and enhanced
      activation-induced cell death (AICD)
    explanation: >-
      The IUIS classification records enhanced CD95-driven apoptosis and
      activation-induced cell death as the functional defect of XIAP deficiency.
  - reference: PMID:17080092
    reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that XIAP is a potent regulator of lymphocyte homeostasis in vivo
    explanation: >-
      Frames the apoptosis defect as a failure of lymphocyte homeostasis rather
      than an isolated in-vitro observation.
  downstream:
  - target: Invariant NKT Cell Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Invariant NKT cells depend on XIAP for survival and/or differentiation and
      are reduced or absent in patients. Whether this reflects the same
      apoptotic hypersensitivity or a separate developmental requirement is not
      resolved.
    evidence:
    - reference: PMID:17080092
      reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also found that XIAP-deficient patients, like SAP-deficient patients,
        have low numbers of natural killer T-lymphocytes (NKT cells), indicating
        that XIAP is required for the survival and/or differentiation of NKT
        cells.
      explanation: >-
        Establishes the iNKT deficit and attributes it to a XIAP requirement for
        NKT survival or differentiation.
  - target: Hypogammaglobulinemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Premature deletion of activated lymphocytes is the most plausible route to
      the transient hypogammaglobulinemia seen in about a third of patients, but
      no source traces the humoral defect to a specific step, and its transience
      argues against a fixed developmental block. The edge is recorded as
      indirect with unknown intermediates rather than asserting a mechanism the
      literature does not supply.
    evidence:
    - reference: PMID:21119115
      reference_title: >-
        Clinical similarities and differences of patients with X-linked
        lymphoproliferative syndrome type 1 (XLP-1/SAP deficiency) versus type 2
        (XLP-2/XIAP deficiency).
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "HLH (XLP-1, 55%; XLP-2, 76%) and hypogammaglobulinemia (XLP-1, 67%; XLP-2, 33%) occurred in both groups."
      explanation: >-
        Establishes that hypogammaglobulinemia occurs in XLP2 and at roughly half
        the XLP1 rate; the cohort reports the association, not the mechanistic
        path from lymphocyte apoptosis to it, which is why this edge is typed
        indirect with unknown intermediates.
  - target: Hemophagocytic Lymphohistiocytosis Susceptibility
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Premature deletion of activated effector lymphocytes leaves the antigen -
      classically EBV-infected B cells - uncleared, so the immune response is
      sustained rather than terminated, and the macrophage-activating cytokine
      loop that defines HLH is allowed to run.
    evidence:
    - reference: PMID:20489057
      reference_title: >-
        XIAP deficiency: a unique primary immunodeficiency best classified as
        X-linked familial hemophagocytic lymphohistiocytosis and not as X-linked
        lymphoproliferative disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lymphocyte defects thought to contribute to HLH development in
        SLAM-Associated Protein deficiency were not observed in XIAP deficiency.
      explanation: >-
        Establishes that the route to HLH in XIAP deficiency is not the
        SAP-deficiency route, supporting a distinct, apoptosis-driven mechanism
        with intermediates that are only partly mapped.
    - reference: PMID:24084330
      reference_title: >-
        Sustained elevation of serum interleukin-18 and its association with
        hemophagocytic lymphohistiocytosis in XIAP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In XIAP deficiency, hemophagocytic lymphohistiocytosis (HLH) occurs more
        frequently and recurrence is common. However, the underlying mechanisms
        remain mostly unknown.
      explanation: >-
        Confirms the strong HLH predisposition while stating explicitly that the
        intervening mechanism is incompletely known.
- name: Invariant NKT Cell Depletion
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Invariant natural killer T cells are reduced in XIAP-deficient patients, as
    they are in SAP deficiency. Because iNKT cells are thought to have a key role
    in the immune response to EBV, this is one of the few features XLP1 and XLP2
    genuinely share, and it plausibly contributes to the failure to contain
    primary EBV infection. The node is graded provisional because the finding is
    not uniform: the founding Nature report and an independent Japanese cohort
    both found iNKT cells significantly reduced, but the IUIS classification
    records the count as low or normal, so a normal iNKT compartment does not
    exclude the diagnosis and iNKT depletion cannot be the whole explanation for
    HLH susceptibility.
  cell_types:
  - preferred_term: invariant natural killer T cell
    term:
      id: CL:0000814
      label: mature NK T cell
  evidence:
  - reference: PMID:22228567
    reference_title: Clinical and genetic characteristics of XIAP deficiency in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      iNKT cells from patients with XIAP deficiency were significantly decreased
      as compared with age-matched healthy controls.
    explanation: >-
      Quantitative confirmation of the iNKT deficit in an independent
      nine-patient cohort.
  - reference: PMID:35748970
    reference_title: >-
      Human Inborn Errors of Immunity: 2022 Update on the Classification from
      the International Union of Immunological Societies Expert Committee.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Normal or Increased activated T cells; low/normal iNK T cells
    explanation: >-
      The IUIS classification records the iNKT count in XIAP deficiency as low
      or normal. It supports iNKT depletion as a recognised feature while
      explicitly noting it is not universal, which is why this node is graded
      provisional.
  downstream:
  - target: Hemophagocytic Lymphohistiocytosis Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of iNKT cells degrades the early cellular response to EBV, the
      commonest HLH trigger in this disease.
    evidence:
    - reference: PMID:17080092
      reference_title: XIAP deficiency in humans causes an X-linked lymphoproliferative syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The observation that XIAP-deficiency and SAP-deficiency are both
        associated with a defect in NKT cells strengthens the hypothesis that
        NKT cells have a key role in the immune response to EBV.
      explanation: >-
        Connects the iNKT deficit to impaired anti-EBV immunity, the pathway to
        EBV-triggered HLH.
- name: Defective NOD2 Signaling in Monocytes and Intestinal Epithelium
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    XIAP is the essential ubiquitin ligase of the NOD2 pathway: on sensing the
    bacterial peptidoglycan fragment muramyl dipeptide, NOD2 recruits RIPK2,
    XIAP ubiquitylates RIPK2, and those chains recruit LUBAC to enable full
    NF-kappaB activation. XLP2 alleles in either the RING or the BIR2 domain
    abolish RIPK2 binding or ubiquitylation, so patient monocytes mount
    defective NOD2-driven cytokine and chemokine responses and patient
    fibroblasts show a parallel NOD1 defect. NOD2 is the strongest known genetic
    risk factor for Crohn disease and is central to antibacterial defence at
    mucosal surfaces, including in Paneth cells, which places this defect
    directly on the path to the intestinal disease.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: paneth cell
    term:
      id: CL:0000510
      label: paneth cell
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: NOD2 signaling pathway
    term:
      id: GO:0070431
      label: nucleotide-binding oligomerization domain containing 2 signaling pathway
    modifier: DECREASED
  - preferred_term: response to muramyl dipeptide
    term:
      id: GO:0032495
      label: response to muramyl dipeptide
    modifier: DECREASED
  - preferred_term: NOD2-driven NF-kappaB activation
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: DECREASED
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:22607974
    reference_title: >-
      The ubiquitin ligase XIAP recruits LUBAC for NOD2 signaling in
      inflammation and innate immunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that XIAP ubiquitylates RIPK2 and recruits the linear ubiquitin
      chain assembly complex (LUBAC) to NOD2.
    explanation: >-
      Defines the molecular step XIAP performs in NOD2 signaling and that is
      therefore missing in XLP2.
  - reference: PMID:22607974
    reference_title: >-
      The ubiquitin ligase XIAP recruits LUBAC for NOD2 signaling in
      inflammation and innate immunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that XIAP and LUBAC constitute essential ubiquitin ligases in
      NOD2-mediated inflammatory signaling and propose that deregulation of NOD2
      signaling contributes to XLP-2 pathogenesis.
    explanation: >-
      States the authors' conclusion that deregulated NOD2 signaling contributes
      to XLP2 pathogenesis.
  - reference: PMID:23818254
    reference_title: >-
      Disease-causing mutations in the XIAP BIR2 domain impair NOD2-dependent
      immune signalling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that XLP2-BIR2 mutations severely impair NOD1/2-dependent
      immune signalling in primary cells from XLP2 patients and in reconstituted
      XIAP-deficient cell lines.
    explanation: >-
      Demonstrates the NOD1/NOD2 signaling defect in cells taken from patients,
      not only in engineered lines.
  - reference: PMID:24942515
    reference_title: >-
      Characterization of Crohn disease in X-linked inhibitor of
      apoptosis-deficient male patients and female symptomatic carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monocytes of patients had impaired NOD2-mediated IL-8 and monocyte
      chemoattractant protein 1 (MCP-1) production, as well as IL-10, in
      response to NOD2 and Toll-like receptor 2/4 costimulation.
    explanation: >-
      Documents the functional consequence in patient monocytes: failure to
      produce NOD2-driven chemokines and IL-10.
  - reference: PMID:24942515
    reference_title: >-
      Characterization of Crohn disease in X-linked inhibitor of
      apoptosis-deficient male patients and female symptomatic carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nucleotide binding and oligomerization domain containing 1
      (NOD1)-mediated IL-6 and IL-8 production was defective in fibroblasts from
      XIAP-deficient patients.
    explanation: >-
      Extends the signaling defect to NOD1 in a non-haematopoietic patient cell
      type.
  downstream:
  - target: Crohn-like Intestinal Inflammation
    causal_link_type: DIRECT
    description: >-
      Impaired NOD2-dependent antibacterial and cytokine responses at the
      intestinal mucosa produce a Crohn-disease-like inflammatory bowel disease.
    evidence:
    - reference: PMID:24942515
      reference_title: >-
        Characterization of Crohn disease in X-linked inhibitor of

    explanation: Functional assays confirm that the identified TMLHE variants are loss-of-function.
  downstream:
  - target: Block at the First Step of Carnitine Biosynthesis
    description: >-
      Loss of TMLD activity blocks the committed first hydroxylation step of the
      carnitine biosynthetic pathway.
- name: Block at the First Step of Carnitine Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    The enzymatic block produces the diagnostic biochemical signature of the
    disorder: the substrate 6-N-trimethyllysine accumulates while the immediate
    product 3-hydroxy-6-N-trimethyllysine and the downstream intermediate
    gamma-butyrobetaine fall, measurable as a markedly reduced BB/TML ratio in plasma
    and urine.
  biological_processes:
  - preferred_term: carnitine biosynthetic process
    term:
      id: GO:0045329
      label: carnitine biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: N-6-Trimethyllysine
    term:
      id: CHEBI:165870
      label: N-6-Trimethyllysine
    modifier: INCREASED
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion of exon 2 of TMLHE causes enzyme deficiency, resulting in increased substrate concentration (6-N-trimethyllysine) and decreased product levels (3-hydroxy-6-N-trimethyllysine and γ-butyrobetaine) in plasma and urine."
    explanation: Defines the substrate-accumulation/product-depletion signature of the biosynthetic block.
  downstream:
  - target: Reduced Endogenous Carnitine Supply
    description: >-
      Loss of flux through the biosynthetic pathway removes the endogenous
      contribution to whole-body and tissue carnitine pools.
- name: Reduced Endogenous Carnitine Supply
  biological_scale: ORGANISM
  description: >-
    Endogenous synthesis is only one of two carnitine sources; most body carnitine
    derives from the diet, so plasma free carnitine in TMLHE-deficient males is
    frequently normal or only mildly reduced and the biochemical diagnosis rests on
    the TML/BB profile rather than on carnitine itself. The endogenous deficit is
    therefore proposed to matter chiefly where dietary supply or transport is
    limiting — most notably across the blood-brain barrier — and is unmasked
    clinically only in a small minority of deficient individuals. In at least one
    reported child, TMLHE deficiency co-occurred with frank carnitine deficiency.
  chemical_entities:
  - preferred_term: carnitine
    term:
      id: CHEBI:17126
      label: carnitine
    modifier: DECREASED
  evidence:
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was identified to have a mutation in the TMLHE gene, which encodes the first enzyme in the carnitine biosynthesis pathway, and concurrent carnitine deficiency"
    explanation: Documents concurrent carnitine deficiency in a TMLHE-deficient child.
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although 1 in 350 males (estimated ~460,000 males in USA) have TMLHE deficiency, only about 3% of these males develop autism, with most of the remainder becoming healthy adults"
    explanation: >-
      Establishes that the endogenous-synthesis deficit is compensated in the great
      majority of deficient males.
  downstream:
  - target: Impaired Long-Chain Fatty Acid Oxidation in Neural Progenitors
    description: >-
      Reduced carnitine availability limits carnitine-dependent mitochondrial import
      of long-chain fatty acids in neural progenitors.
  - target: Low-Penetrance Neurodevelopmental Susceptibility
    description: >-
      A brain-selective carnitine deficit is hypothesized to raise neurodevelopmental
      risk directly; this edge belongs to the brain-carnitine-deficiency model rather
      than to established causal knowledge.
    hypothesis_groups:
    - brain_carnitine_deficiency_autism
- name: Impaired Long-Chain Fatty Acid Oxidation in Neural Progenitors
  biological_scale: CELLULAR
  description: >-
    Carnitine is required for the carnitine-shuttle import of long-chain fatty acids
    into mitochondria. Neural-stem-cell-autonomous reduction of TMLHE activity — like
    reduction of CPT1A or of lipid-droplet fatty acid mobilization — lowers flux
    through long-chain fatty acid beta-oxidation in the embryonic neocortex,
    positioning TMLHE within a broader class of fatty-acid-oxidation inborn errors
    associated with neurodevelopmental disorders.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  - preferred_term: long-chain fatty acid metabolic process
    term:
      id: GO:0001676
      label: long-chain fatty acid metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:26832401
    reference_title: "Inborn Errors of Long-Chain Fatty Acid β-Oxidation Link Neural Stem Cell Self-Renewal to Autism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "neural stem cell (NSC)-autonomous insufficiencies in the activity of TMLHE (an autism risk factor that supports long-chain FAO by catalyzing carnitine biosynthesis), of CPT1A (an enzyme required for long-chain FAO transport into mitochondria), or of fatty acid mobilization from lipid droplets reduced NSC pools in the mouse embryonic neocortex"
    explanation: >-
      Shows in the mouse embryonic neocortex that TMLHE insufficiency acts through
      long-chain fatty acid oxidation to deplete the neural stem cell pool.
  downstream:
  - target: Shift from Neural Stem Cell Self-Renewal to Differentiating Division
    description: >-
      Reduced fatty-acid-oxidation flux changes the division mode of neural stem
      cells.
- name: Shift from Neural Stem Cell Self-Renewal to Differentiating Division
  biological_scale: CELLULAR
  description: >-
    Lineage tracing in the mouse embryonic neocortex showed that reduced
    fatty-acid-oxidation flux drives neural stem cells toward symmetric
    differentiating divisions at the expense of self-renewing division modes,
    depleting the progenitor pool and altering the
    neural-stem-cell-to-intermediate-progenitor transition. This is the proposed
    cellular mechanism connecting
    fatty-acid-oxidation inborn errors to neurodevelopmental outcome.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26832401
    reference_title: "Inborn Errors of Long-Chain Fatty Acid β-Oxidation Link Neural Stem Cell Self-Renewal to Autism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lineage tracing experiments demonstrated that reduced flux through the FAO pathway potentiated NSC symmetric differentiating divisions at the expense of self-renewing stem cell division modes."
    explanation: Identifies the division-mode shift as the cellular consequence of reduced FAO flux.
  downstream:
  - target: Low-Penetrance Neurodevelopmental Susceptibility
    description: >-
      Progenitor-pool depletion during corticogenesis is the proposed developmental
      substrate for the increased neurodevelopmental risk.
- name: Low-Penetrance Neurodevelopmental Susceptibility
  biological_scale: ORGANISM
  description: >-
    The clinical output of TMLHE deficiency is an increase in neurodevelopmental risk
    rather than a deterministic phenotype. Meta-analysis across simplex and multiplex
    autism cohorts supported TMLHE deficiency as an autism risk factor with an
    estimated penetrance of only 2-4%; most hemizygous males are healthy, and TMLHE
    deficiency accounts for well under 1% of autism in males. The unidentified
    modifiers (genetic background, dietary carnitine intake, carnitine transport
    across the blood-brain barrier, environmental exposures) that determine which
    deficient males become affected are the central open question of this entry.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that TMLHE deficiency is a risk factor for autism (metaanalysis Z-score = 2.90 and P = 0.0037), although with low penetrance (2-4%)"
    explanation: Establishes the risk-factor relationship and quantifies the low penetrance.
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "furthermore, less than 1% of autistic males have TMLHE deficiency"
    explanation: Bounds the attributable fraction of autism in males explained by TMLHE deficiency.

name: TMLHE Deficiency
creation_date: "2026-07-26T00:00:00Z"
description: >-
  TMLHE deficiency (epsilon-trimethyllysine hydroxylase deficiency) is an X-linked
  inborn error of carnitine biosynthesis caused by loss-of-function variants —
  most commonly a recurrent deletion of exon 2 — in TMLHE, which encodes
  6-N-trimethyllysine dioxygenase (TMLD), the first enzyme of the
  four-step endogenous carnitine biosynthesis pathway. Enzyme deficiency produces a
  characteristic biochemical signature: accumulation of the substrate
  6-N-trimethyllysine (TML) with reduced levels of the downstream products
  3-hydroxy-6-N-trimethyllysine and gamma-butyrobetaine (BB), giving a markedly
  decreased BB/TML ratio in plasma and urine.

  TMLHE deficiency is unusual among inborn errors of metabolism in two respects.
  First, it is common — roughly 1 in 366 control males — because most body carnitine
  is obtained from the diet rather than synthesized de novo, so hemizygous loss of
  the biosynthetic pathway is largely compensated and the great majority of affected
  males are healthy. Second, its disease status is therefore a low-penetrance risk
  relationship rather than a deterministic Mendelian one: TMLHE deficiency is
  enriched in probands from male-male multiplex autism families (an estimated 2-4%
  penetrance for autism), and individual case reports document autism with
  intellectual disability and regressive episodes in deficient males, but most
  deficient males never develop a neurodevelopmental phenotype. MONDO reflects this
  by classifying the entity in its `predisposition` / `omim_susceptibility` subsets
  under "autism, susceptibility to" rather than as a fully penetrant metabolic
  disease.

  The proposed mechanism links the biosynthetic block to neurodevelopment through
  long-chain fatty acid oxidation: carnitine is required to shuttle long-chain fatty
  acids into mitochondria, and neural-stem-cell-autonomous reduction of TMLHE
  activity in the mouse embryonic neocortex shifts progenitors from self-renewing to
  symmetric differentiating divisions, depleting the neural stem cell pool. Whether
  this translates to human disease remains open: a constitutive Tmlhe knockout mouse
  with >90% carnitine reduction showed no ASD-like behavioral or motor phenotype,
  which is curated here as an explicit human/model mismatch.

  This entry is curated as a distinct disorder — rather than folded into the
  carnitine-transport (SLC22A5) or carnitine-cycle (CPT1A/CPT2/SLC25A20) entries —
  because the lesion is in carnitine *biosynthesis* rather than uptake or
  mitochondrial transport, and because the clinical consequence is a low-penetrance
  neurodevelopmental risk rather than the fasting-intolerance/cardiomyopathy
  phenotype of those disorders.
synonyms:
- Epsilon-trimethyllysine hydroxylase deficiency
- TMLHED
- 6-N-trimethyllysine dioxygenase deficiency
- TMLD deficiency
- Autism, susceptibility to, X-linked 6
- AUTSX6

  description: >-
    Loss-of-function variants in TMLHE — most commonly a recurrent deletion of exon
    2, but also nonsense and missense substitutions — abolish or reduce the activity
    of 6-N-trimethyllysine dioxygenase (TMLD), the enzyme that catalyzes the first
    step of carnitine biosynthesis.

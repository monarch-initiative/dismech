    term:
      id: HP:0002376
      label: Developmental regression
  target_mechanisms:
  - target: Reduced Endogenous Carnitine Supply
    treatment_effect: BYPASSES
    description: >-
      Exogenous carnitine restores the pool that the blocked biosynthetic pathway
      fails to supply, without correcting the enzymatic lesion.
  evidence:
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following carnitine supplementation, the patient's regression ended, and the boy started gaining developmental milestones."
    explanation: Single-case evidence that carnitine supplementation halted regression.
  - reference: PMID:25943046
    reference_title: "Improvement of regressive autism symptoms in a child with TMLHE deficiency following carnitine supplementation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Further work to better define the role of disorders of carnitine biosynthesis in autism spectrum disorder is warranted."
    explanation: >-
      The authors themselves qualify the single-case result, supporting the cautious
      framing of this treatment.
diagnosis:
- name: Biochemical and molecular diagnosis
  description: >-
    Diagnosis rests on the plasma/urine carnitine-biosynthesis intermediate profile —
    elevated trimethyllysine with reduced gamma-butyrobetaine, giving a low BB/TML
    ratio — confirmed by identification of a TMLHE loss-of-function allele on
    sequencing or exon-level copy-number analysis. Plasma free carnitine may be
    normal and is not a reliable screening analyte for this disorder.
  evidence:
  - reference: PMID:39845198
    reference_title: "X-Linked Autism Type 9 Caused by a Hemizygote Pathogenic Variant in the TMLHE Gene: Etiological Diagnosis in an Adult Male with Moderate Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With WES, a novel variant in the TMHLE gene was identified and using NGMS, increased concentration of trimethyllysine and decreased concentration of γ-butyrobetaine were found"
    explanation: Illustrates the combined molecular plus metabolomic diagnostic route.
differential_diagnoses:
- name: Primary Carnitine Deficiency
  disease_term:
    preferred_term: systemic primary carnitine deficiency disease
    term:
      id: MONDO:0008919
      label: systemic primary carnitine deficiency disease
  description: >-
    SLC22A5/OCTN2 carnitine transport defect. Shares reduced carnitine availability
    but is distinguished by markedly low plasma free carnitine (the first-tier
    newborn-screening analyte), a normal TML/BB profile, and a systemic phenotype of
    hypoketotic hypoglycaemia, cardiomyopathy, and myopathy that TMLHE deficiency does
    not produce.
  distinguishing_features:
  - >-
    Markedly low plasma free carnitine, rather than a discriminating low BB/TML
    ratio, favors primary carnitine deficiency.
  - >-
    Systemic hypoketotic hypoglycemia, cardiomyopathy, and myopathy favor SLC22A5
    deficiency.
- name: Carnitine Palmitoyltransferase II Deficiency
  disease_term:
    preferred_term: carnitine palmitoyltransferase II deficiency
    term:
      id: MONDO:0015515
      label: carnitine palmitoyltransferase II deficiency
  description: >-
    Carnitine-cycle defect blocking mitochondrial import of long-chain acyl groups.
    Presents with rhabdomyolysis or infantile hepatocardiomuscular disease and an
    abnormal long-chain acylcarnitine profile, none of which is a feature of TMLHE
    deficiency.
  distinguishing_features:
  - >-
    Rhabdomyolysis or infantile hepatocardiomuscular disease favors CPT II
    deficiency.
  - >-
    A long-chain acylcarnitine abnormality distinguishes CPT II deficiency from
    the TML/BB biosynthesis profile.
- name: Autism Spectrum Disorder
  disease_term:
    preferred_term: autism spectrum disorder
    term:
      id: MONDO:0005258
      label: autism spectrum disorder
  description: >-
    Idiopathic/nonsyndromic ASD. Because TMLHE deficiency has 2-4% penetrance and
    explains under 1% of autism in males, the biochemical profile — not the ASD
    diagnosis — is what establishes the metabolic diagnosis in an autistic male.
  distinguishing_features:
  - >-
    The elevated TML and reduced gamma-butyrobetaine/BB-to-TML profile establishes
    TMLHE deficiency; autism alone does not.
discussions:
- discussion_id: tmlhe_mouse_ko_no_asd_phenotype
  prompt: >-
    Does the Tmlhe knockout mouse, which shows >90% carnitine reduction without any
    ASD-like behavioral, cognitive, or motor phenotype, refute the neural-stem-cell
    mechanism proposed for human TMLHE deficiency, or does it reflect a genuine
    species difference in the dependence of brain development on endogenous carnitine
    synthesis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Long-Chain Fatty Acid Oxidation in Neural Progenitors
  - pathophysiology#Shift from Neural Stem Cell Self-Renewal to Differentiating Division
  - pathophysiology#Low-Penetrance Neurodevelopmental Susceptibility
  rationale: >-
    The mechanistic chain in this entry rests substantially on mouse embryonic
    neocortex data showing that neural-stem-cell-autonomous TMLHE insufficiency
    depletes the progenitor pool. A constitutive Tmlhe knockout mouse with extremely
    low carnitine and gamma-butyrobetaine nevertheless showed no social, cognitive,
    repetitive-behavior, or motor abnormality, and normal life expectancy — and did
    not phenocopy primary carnitine deficiency either. The two mouse results are not
    formally contradictory (acute NSC-autonomous knockdown during corticogenesis
    versus a constitutive germline knockout with lifelong compensation), but the
    mismatch is material: it is part of why the human association is best read as a
    low-penetrance risk relationship, and it means model-organism evidence cannot by
    itself carry the human neurodevelopmental claim. This is a translational-validity
    question (evidence exists in the model; its bearing on human disease is
    uncertain), not an absence of evidence.
  proposed_experiments:
  - experiment_id: exp_tmlhe_conditional_progenitor_knockout
    name: Developmentally timed conditional Tmlhe inactivation in neural progenitors
    description: >-
      Conditionally inactivate Tmlhe restricted to neural progenitors during
      corticogenesis, with progenitor-pool size, division-mode lineage tracing, and
      cortical layering readouts, to test whether the constitutive knockout's
      normality reflects developmental compensation rather than absence of a
      progenitor requirement.
  - experiment_id: exp_tmlhe_brain_carnitine_measurement
    name: Direct brain (not plasma) carnitine measurement in TMLHE deficiency
    description: >-
      Measure carnitine and gamma-butyrobetaine directly in brain tissue of Tmlhe
      knockout mice and, where obtainable, in human TMLHE-deficient CSF or tissue, to
      test the brain-selective-deficit premise that the whole mechanistic model
      depends on.
  - experiment_id: exp_tmlhe_human_ipsc_cortical_organoid
    name: Human TMLHE-null iPSC cortical organoid self-renewal assay
    description: >-
      Generate isogenic human iPSC cortical organoids carrying TMLHE loss-of-function
      alleles and assay neural stem cell self-renewal versus symmetric differentiating
      division, to test whether the mouse NSC phenotype is reproduced in a human
      system.
  evidence:
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "we did not observe any significant social, cognitive, or repetitive-behavior changes associated with ASD in the knockout mice; muscle strength and coordination were also not affected"
    explanation: >-
      The constitutive Tmlhe knockout fails to reproduce an ASD-like phenotype,
      refuting a simple deterministic carnitine-deficiency-to-autism model.
  - reference: PMID:37553674
    reference_title: "Knockout of Tmlhe in mice is not associated with autism spectrum disorder phenotypes or motor dysfunction despite low carnitine levels."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "inactivation of TMLD does not induce a phenotype similar to previously described primary carnitine deficiency"
    explanation: >-
      Shows that in mice a >90% carnitine reduction is tolerated, distinguishing the
      biosynthetic block from carnitine-transport disease.
  - reference: PMID:34728372
    reference_title: "Low cardiac content of long-chain acylcarnitines in TMLHE knockout mice prevents ischaemia-reperfusion-induced mitochondrial and cardiac damage."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "TMLHE gene deletion in male mice lowered acylcarnitine concentrations in blood and cardiac tissues by up to 85% and decreased fatty acid oxidation by 30% but did not affect muscle and heart function in mice."
    explanation: >-
      An independent knockout cohort confirms substantial biochemical effect with
      preserved organ function, reinforcing that the biochemical deficit is not
      straightforwardly pathogenic.
  - reference: PMID:26832401
    reference_title: "Inborn Errors of Long-Chain Fatty Acid β-Oxidation Link Neural Stem Cell Self-Renewal to Autism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggest NSC self renewal as a cellular mechanism underlying the association between IEMs and autism"
    explanation: The countervailing mouse evidence that motivates the mechanism this discussion questions.
- discussion_id: tmlhe_penetrance_modifiers
  prompt: >-
    What determines which 2-4% of TMLHE-deficient males develop autism, when roughly 1
    in 366 control males carry the same enzyme deficiency and remain healthy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Low-Penetrance Neurodevelopmental Susceptibility
  rationale: >-
    The penetrance gap is the defining unresolved feature of this entry and the reason
    it is curated as a susceptibility relationship rather than a Mendelian disease.
    Candidate modifiers proposed in the literature — dietary carnitine intake in
    infancy, X-linked carnitine transport across the blood-brain barrier, minor
    illness, microbiome, and drug exposures — are hypotheses, not established
    modifiers, and no modifier has been demonstrated to stratify affected from
    unaffected deficient males. Without this, TMLHE genotype has essentially no
    predictive value for an individual.
  proposed_experiments:
  - experiment_id: exp_tmlhe_prospective_deficient_male_cohort
    name: Prospective outcome cohort of screening-identified TMLHE-deficient males
    description: >-
      Follow an unselected cohort of TMLHE-deficient males identified by population
      screening, recording dietary carnitine intake, intercurrent illness, and
      neurodevelopmental outcome, to identify factors that stratify the 2-4% who
      become affected from the majority who do not.
  - experiment_id: exp_tmlhe_sibling_carnitine_prevention_trial
    name: Carnitine supplementation trial in infant siblings of TMLHE-deficient probands
    description: >-
      Randomized carnitine supplementation in unaffected infant siblings of
      TMLHE-deficient autism probands — the trial design explicitly proposed by the
      brain-carnitine-deficiency hypothesis — to test whether the neurodevelopmental
      risk is modifiable.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although with low penetrance (2-4%)"
    explanation: Quantifies the penetrance gap that this knowledge gap concerns.
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A mixed, common gene variant-environment hypothesis is proposed with diet, minor illnesses, microbiome, and drugs as possible risk modifiers."
    explanation: Enumerates the candidate (unvalidated) modifiers.
notes: >-
  Nosological note. MONDO:0010469 carries the `predisposition` and
  `omim_susceptibility` subsets and is classified under MONDO:0020836 ("autism,
  susceptibility to"), i.e. MONDO models this entity primarily as an autism
  susceptibility locus. dismech curates it as a disorder entry because the enzyme
  deficiency itself is a fully penetrant, biochemically defined inborn error of
  carnitine biosynthesis with a specific diagnostic metabolite profile; the
  low-penetrance part is the neurodevelopmental consequence, which is modeled
  explicitly as a susceptibility edge plus a knowledge-gap discussion rather than as
  an asserted disease phenotype. This entry is therefore a relevant worked example
  for the general question of how dismech entries relate to MONDO disease versus
  susceptibility terms.

  Naming note. Sources disagree on the OMIM series label attached to OMIM 300872:
  MONDO lists the synonym "autism, susceptibility to, X-linked 6" and PMID:39845198
  refers in its abstract to "X-linked recessive autism, type 6 (OMIM#300872)" while
  its own title says "X-Linked Autism Type 9". The unambiguous identifiers are
  OMIM:300872 / MONDO:0010469 / the TMLHE gene; the numbered autism-series label
  should not be relied on.

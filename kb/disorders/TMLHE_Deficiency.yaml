mechanistic_hypotheses:
- hypothesis_group_id: brain_carnitine_deficiency_autism
  hypothesis_label: >-
    Deficient endogenous carnitine biosynthesis produces a brain-selective carnitine
    deficit that raises autism risk in males
  status: EMERGING
  description: >-
    Because most body carnitine is dietary and plasma carnitine is often normal in
    TMLHE-deficient males, the proposed route from the biosynthetic block to
    neurodevelopmental risk is a brain-selective carnitine deficit: endogenous
    synthesis is argued to matter disproportionately in the central nervous system,
    where dietary carnitine must cross the blood-brain barrier. The hypothesis
    further invokes a male bias from X-linked carnitine-transport genes and posits
    modifiable environmental co-factors (infant diet, minor illness, microbiome,
    drugs) that would explain the low penetrance. It is explicitly framed by its
    proponents as a hypothesis to be tested, and the supporting human data are
    association-level rather than mechanistic. Causal edges belonging to this model
    opt in via hypothesis_groups: [brain_carnitine_deficiency_autism].
  evidence:
  - reference: PMID:28703319
    reference_title: "Brain carnitine deficiency causes nonsyndromic autism with an extreme male bias: A hypothesis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "We hypothesize that nonsyndromic or \"essential\" autism involves extreme male bias in infants who are genetically normal, but they develop deficiency of carnitine and perhaps other nutrients in the brain causing autism"
    explanation: >-
      States the hypothesis; tagged PARTIAL/OTHER because the source is an explicitly
      hypothesis-generating essay, not primary data.

genetic:
- name: TMLHE loss-of-function variant
  gene_term:
    preferred_term: TMLHE
    term:
      id: hgnc:18308
      label: TMLHE
  association: Low-penetrance risk factor for autism; deterministic for the biochemical enzyme deficiency
  relationship_type: RISK_FACTOR
  notes: >-
    Two distinct claims should be kept apart. (1) A hemizygous TMLHE
    loss-of-function allele deterministically produces the biochemical phenotype
    (raised trimethyllysine, low gamma-butyrobetaine, low BB/TML ratio) — this is
    established and functionally validated. (2) The same allele confers only a small
    increase in autism risk (estimated 2-4% penetrance), which is why MONDO places
    MONDO:0010469 in its `predisposition` / `omim_susceptibility` subsets under
    "autism, susceptibility to". The recurrent exon 2 deletion is the most common
    allele; nonsense and missense loss-of-function substitutions are also reported.
  evidence:
  - reference: PMID:22566635
    reference_title: "A common X-linked inborn error of carnitine biosynthesis may be a risk factor for nondysmorphic autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion of exon 2 of TMLHE causes enzyme deficiency"
    explanation: The recurrent exon 2 deletion causes the enzyme deficiency.
  - reference: PMID:23092983
    reference_title: "Analysis of the chromosome X exome in patients with autism spectrum disorders identified novel candidate genes, including TMLHE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By screening the TMLHE coding sequence in 501 male patients with ASD, we identified two additional missense substitutions not found in controls and not reported in databases."
    explanation: Documents the allelic spectrum beyond the recurrent exon 2 deletion.
treatments:
- name: Levocarnitine supplementation
  description: >-
    Oral carnitine (levocarnitine) supplementation bypasses the biosynthetic block by
    supplying carnitine exogenously. Evidence in TMLHE deficiency is limited to a
    single reported child in whom regression stopped and developmental gains resumed
    after supplementation was started; there is no controlled trial, and the natural
    history of the great majority of untreated deficient males is benign. Treat as a
    reasonable, low-risk intervention in the specific setting of documented carnitine
    deficiency with regression, not as an established therapy for TMLHE deficiency in
    general.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: levocarnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  target_phenotypes:

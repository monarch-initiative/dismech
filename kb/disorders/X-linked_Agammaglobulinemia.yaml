genetic:
- name: BTK
  gene_term:
    preferred_term: BTK
    term:
      id: hgnc:1133
      label: BTK
  association: Causative
  evidence:
  - reference: PMID:8380905
    reference_title: "The gene involved in X-linked agammaglobulinaemia is a member of the src family of protein-tyrosine kinases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel gene has been isolated which maps to the XLA locus, is expressed
      in B cells, and shows mutations in families with the disorder.
    explanation: >-
      The gene-identification study mapped BTK to the XLA locus and found
      disease-segregating mutations in affected families.
  - reference: PMID:8425221
    reference_title: "Deficient expression of a B cell cytoplasmic tyrosine kinase in human X-linked agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPK is likely the XLA gene and functions in pathways critical to B cell
      expansion.
    explanation: >-
      The companion study independently identified BTK (BPK) as the XLA gene.
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked agammaglobulinemia (XLA) is a primary immunodeficiency caused by
      mutations in the gene for Bruton tyrosine kinase (BTK) that result in the
      deficient development of B lymphocytes and hypogammaglobulinemia.
    explanation: >-
      The US registry confirms BTK mutations as the cause of XLA.
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of correlation between phenotype and genotype in this condition
      makes management and predicting outcomes quite difficult.
    explanation: >-
      Supports the genotype-phenotype claim recorded in notes: overall clinical
      severity in XLA cannot be predicted from the specific BTK genotype.
  - reference: PMID:30240888
    reference_title: "Comparison of Common Monogenic Defects in a Large Predominantly Antibody Deficiency Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a genotype-phenotype correlation among patients with BTK mutations
      regarding clinical manifestation of meningitis and chronic diarrhea.
    explanation: >-
      A 550-patient predominantly-antibody-deficiency cohort reports a
      manifestation-specific exception (meningitis, chronic diarrhea) to the
      general absence of BTK genotype-phenotype correlation.
  notes: >-
    Genotype-phenotype correlation in XLA is weak: review evidence states that
    overall phenotype severity does not track the specific BTK genotype, which
    complicates management and outcome prediction, although one large cohort
    reported a genotype-phenotype correlation restricted to the specific
    manifestations of meningitis and chronic diarrhea. Some BTK alleles are
    hypomorphic and permit residual, leaky B-cell output with a milder, later
    presentation that can delay or evade diagnosis.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Lifelong intravenous (IVIG) or subcutaneous (SCIG) immunoglobulin
    replacement is the cornerstone of XLA management, replacing the missing
    antibody and reducing the frequency and severity of infections. Per
    GeneReviews it is given by weekly subcutaneous injection or intravenous
    infusion every two to four weeks, and it prevents the severe enteroviral
    complications (dermatomyositis, chronic meningoencephalitis) of untreated
    disease.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Panhypogammaglobulinemia from Absent Plasma Cells
    treatment_effect: BYPASSES
    description: >-
      Passive polyclonal IgG substitutes for the antibody the absent plasma-cell
      compartment cannot make; it bypasses rather than corrects the upstream
      B-cell developmental block.
  evidence:
  - reference: PMID:37454339
    reference_title: "An International Survey of Allogeneic Hematopoietic Cell Transplantation for X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XLA patients require lifelong immunoglobulin replacement therapy (IgRT).
    explanation: >-
      Confirms lifelong immunoglobulin replacement therapy as the standard of
      care for XLA.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mainstay of treatment is gammaglobulin substitution therapy
    explanation: >-
      The XLA GeneReviews states that gammaglobulin substitution therapy is the
      mainstay of treatment.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (by weekly subcutaneous injection or intravenous infusion
      every two to four weeks) to prevent bacterial infections
    explanation: >-
      GeneReviews specifies the dosing routes and intervals and the preventive
      goal of gammaglobulin substitution described here.
- name: Antibiotic Therapy and Prophylaxis
  description: >-
    Therapeutic and prophylactic antibiotics are used to treat and prevent the
    recurrent bacterial sinopulmonary infections that characterize XLA;
    generous antibiotic use reduces the incidence of chronic sinusitis and
    chronic lung disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generous use of antibiotics can decrease the incidence of chronic sinusitis
      and lung disease.
    explanation: >-
      GeneReviews supports generous therapeutic antibiotic use to prevent
      chronic sinus and lung disease in XLA.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic antibiotics can be considered
      to prevent infections.
    explanation: >-
      GeneReviews supports the prophylactic-antibiotic arm of this treatment.
- name: Avoidance of Live Attenuated Vaccines (Agents to Avoid)
  description: >-
    Live viral vaccines — above all oral poliovirus vaccine — are
    contraindicated because the replicating vaccine strain cannot be
    neutralised in the absence of antibody. Inactivated poliovirus vaccine
    should be substituted, for affected individuals and for their family
    contacts; non-live vaccines are otherwise recommended to prevent
    infection.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Preventive Intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Live viral
      vaccines, particularly oral polio vaccine.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid recommendation for XLA.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inactivated polio vaccine (as opposed to live oral polio vaccine) should be
      given to affected individuals and their family contacts.
    explanation: >-
      Specifies substituting inactivated for oral poliovirus vaccine, including
      for household contacts.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vaccines, apart from live vaccines, are recommended to prevent infection.
    explanation: >-
      GeneReviews recommends non-live vaccines while excluding live vaccines.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    Allogeneic hematopoietic cell transplantation is a potentially curative
    option reserved for selected XLA patients with severe complications such as
    recurrent or life-threatening infection or malignancy. In the international
    survey of 22 transplanted XLA patients, 2-year overall survival was 86% and
    event-free survival 77%, and immunoglobulin replacement could be
    discontinued in 89% at one year; the authors advise performing HCT, when
    indicated, before organ damage develops.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Arrest of B-Cell Development at the Pre-B Stage
    treatment_effect: INHIBITS
    description: >-
      Donor haematopoiesis supplies BTK-competent B-cell progenitors that can
      traverse the pre-B checkpoint, replacing the arrested host B lineage.
  evidence:
  - reference: PMID:37454339
    reference_title: "An International Survey of Allogeneic Hematopoietic Cell Transplantation for X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only few XLA patients are indicated for allogeneic hematopoietic cell
      transplantation (HCT) because of severe complications.
    explanation: >-
      Allogeneic HCT is reserved for selected XLA patients with severe
      complications.
  - reference: PMID:37454339
    reference_title: "An International Survey of Allogeneic Hematopoietic Cell Transplantation for X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all patients, 2-year overall survival (OS) and event-free survival (EFS) were
      86% and 77%, respectively.
    explanation: >-
      Quantifies the transplant outcome (2-year OS 86%, EFS 77%) across the 22
      surveyed XLA transplants.
  - reference: PMID:37454339
    reference_title: "An International Survey of Allogeneic Hematopoietic Cell Transplantation for X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the 1-year discontinuation rate of IgRT was 89%
    explanation: >-
      Demonstrates that successful HCT allows most patients to stop
      immunoglobulin replacement within a year.
  - reference: PMID:37454339
    reference_title: "An International Survey of Allogeneic Hematopoietic Cell Transplantation for X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is ideal to
      perform HCT in XLA patients for whom transplantation is indicated before they
      develop organ damage.
    explanation: >-
      Supports the timing recommendation carried in the description.
diagnosis:
- name: Quantitative serum immunoglobulins and B-cell flow cytometry
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    The characteristic laboratory findings are profound
    panhypogammaglobulinemia (IgG, IgA and IgM all severely reduced) with a
    severe deficit of circulating CD19+ B cells against normal T-cell numbers.
    These findings raise the diagnosis, which is then established molecularly.
  markers: Serum IgG, IgA and IgM; CD19+ B cell percentage
  results: Profound panhypogammaglobulinemia with near-absent circulating B cells
  evidence:
  - reference: PMID:8425221
    reference_title: "Deficient expression of a B cell cytoplasmic tyrosine kinase in human X-linked agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an inherited immunodeficiency characterized by a severe deficit of B and
      plasma cells and profound hypogammaglobulinemia
    explanation: >-
      States the defining laboratory pattern this work-up demonstrates.
- name: Molecular genetic testing for a BTK pathogenic variant
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Identification of a hemizygous BTK pathogenic variant in a male proband
    with compatible clinical and laboratory findings establishes the
    diagnosis; a heterozygous BTK pathogenic variant can establish it in the
    extremely rare symptomatic female. Testing at-risk male relatives as soon
    after birth as possible allows immunoglobulin replacement to begin before
    infection and live vaccines to be avoided.
  results: Hemizygous BTK pathogenic variant identified
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of XLA is established in a male proband with
      characteristic clinical and laboratory findings and a hemizygous BTK pathogenic
      variant identified by molecular genetic testing.
    explanation: >-
      The GeneReviews diagnostic criterion for XLA.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic testing of at-risk male relatives as soon after birth as
      possible ensures that gammaglobulin substitution therapy is initiated as soon as
      possible in affected individuals and administration of live viral vaccines can
      be avoided.
    explanation: >-
      Supports newborn testing of at-risk male relatives as part of the
      diagnostic pathway.
- name: Clinical recognition and diagnostic delay
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Diagnosis is usually prompted by recurrent infection. In the US registry,
    a positive family history lowered the mean age at diagnosis from 5.37 to
    2.59 years, yet only about a third of boys with a family history known at
    birth were diagnosed before symptoms — a persistent missed opportunity for
    pre-symptomatic diagnosis. Emerging screening measurements (KREC levels,
    serum BCMA) may allow earlier identification.
  evidence:
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the average age of diagnosis was younger in patients with a positive family
      history (mean, 2.59 yr) than in patients with a negative family history (mean,
      5.37 yr)
    explanation: >-
      Registry quantification of the effect of family history on age at
      diagnosis.
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only 34.5% of patients with a positive family history at the time
      of their birth were diagnosed before clinical symptoms developed
    explanation: >-
      Quantifies the missed opportunity for pre-symptomatic diagnosis from
      family history alone.
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of
      XLA is often delayed, and can be missed if patient has a mild phenotype.
    explanation: >-
      Review confirmation that XLA diagnosis is often delayed, particularly
      with mild phenotypes.
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some diagnostic innovations, such as KREC level measurements and
      serum BCMA measurements, may aid in facilitating an earlier identification of
      agammaglobulinemia leading to prompt treatment.
    explanation: >-
      Supports the KREC/BCMA screening claim in the description.
progression:
- phase: Onset in infancy after maternal IgG wanes
  age_range: First two years of life
  notes: >-
    Recurrent bacterial infection begins in affected males in the first two
    years of life, once transplacental maternal IgG has been catabolised.
    About 60% of individuals are recognised only when a severe,
    life-threatening infection occurs.
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked agammaglobulinemia (XLA) is characterized by
      recurrent bacterial infections in affected males in the first two years of life.
    explanation: >-
      GeneReviews places disease onset in the first two years of life.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 60% of individuals with XLA are recognized as
      having immunodeficiency when they develop a severe, life-threatening infection
    explanation: >-
      Quantifies how often recognition awaits a severe infection.
- phase: Long-term course on immunoglobulin replacement
  notes: >-
    On adequate immunoglobulin replacement, severe enteroviral complications
    are largely prevented and prognosis has improved markedly over recent
    decades with earlier diagnosis, gammaglobulin preparations achieving
    normal serum IgG concentrations, and liberal antibiotic use. S pneumoniae
    and H influenzae may nonetheless continue to cause sinusitis and otitis
    after treatment is established.
  evidence:
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis for
      individuals with XLA has improved markedly in the last 25 years as a result of
      earlier diagnosis, the development of preparations of gammaglobulin that allow
      normal concentrations of serum immunoglobulin G to be achieved, and more liberal
      use of antibiotics.
    explanation: >-
      GeneReviews statement of the markedly improved modern prognosis and its
      drivers.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S pneumoniae and H influenzae are the most common organisms found prior to
      diagnosis and may continue to cause sinusitis and otitis after diagnosis and the
      initiation of gammaglobulin substitution therapy.
    explanation: >-
      Documents the residual sinopulmonary infection burden on treatment.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong immunoglobulin replacement with ongoing infection surveillance is
    required, and the disorder retained measurable mortality in the modern US
    registry era: 6.9% of registered patients had died at entry, and 3.75% of
    prospectively followed living patients died during roughly four years of
    follow-up, with disseminated enterovirus infection and pulmonary
    insufficiency the leading causes of death. Prognosis is nonetheless much
    better than historically, given earlier diagnosis and adequate
    immunoglobulin dosing.
  evidence:
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen of 201 (6.9%)
      patients were dead at the time they were entered in the Registry.
    explanation: >-
      Registry mortality at enrolment.
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Causes of death included disseminated enterovirus infection (n = 6),
      pulmonary insufficiency (n = 5), adenovirus infection (n = 1), sepsis (n = 1)
    explanation: >-
      Enumerates the leading registry causes of death, dominated by
      disseminated enterovirus infection and pulmonary insufficiency.
  - reference: PMID:20301626
    reference_title: "X-Linked Agammaglobulinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis for
      individuals with XLA has improved markedly in the last 25 years
    explanation: >-
      Balances the burden assessment: mortality and morbidity have fallen
      substantially in the modern treatment era.
differential_diagnoses:
- name: Autosomal agammaglobulinemia
  description: >-
    The autosomal recessive and dominant forms of congenital
    agammaglobulinemia (IGHM, IGLL1, CD79A, CD79B, BLNK and other loci)
    reproduce the same pre-B developmental block, absent B cells and
    panhypogammaglobulinemia without involving BTK; they account for the
    roughly 15% of congenital agammaglobulinemia that is not XLA. Curated
    separately in dismech as Autosomal_Agammaglobulinemia.
  disease_term:
    preferred_term: autosomal agammaglobulinemia
    term:
      id: MONDO:0011096
      label: autosomal agammaglobulinemia
  distinguishing_features:
  - Affects females as well as males; consanguinity is common in the recessive forms
  - No BTK pathogenic variant; biallelic (or de novo dominant) variants in pre-BCR or B-lymphopoiesis genes instead
  - Earlier onset and typically more severe clinical features than XLA
  evidence:
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the most common cause of congenital
      agammaglobulinemia is X-linked agammaglobulinemia (XLA), accounting for
      approximately 85% of cases, other genetic forms of agammaglobulinemia have been
      identified.
    explanation: >-
      Quantifies the XLA share of congenital agammaglobulinemia and names the
      autosomal forms as the alternative diagnoses.
  - reference: PMID:34241796
    reference_title: "Agammaglobulinemia: from X-linked to Autosomal Forms of Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, while less common, autosomal recessive forms of
      agammaglobulinemia present at younger ages and with typically more severe
      clinical features resulting in an earlier diagnosis.
    explanation: >-
      The clinical discriminator: the autosomal recessive forms present
      earlier and more severely than XLA.
- name: Common variable immunodeficiency
  description: >-
    The commonest symptomatic antibody deficiency. Shares
    hypogammaglobulinemia and recurrent sinopulmonary infection, but B cells
    are made and circulate — the lesion is in terminal differentiation rather
    than early B-cell development. Curated separately in dismech as
    Common_Variable_Immunodeficiency.
  disease_term:
    preferred_term: common variable immunodeficiency
    term:
      id: MONDO:0015517
      label: common variable immunodeficiency
  distinguishing_features:
  - CD19+ B cells are present, usually in normal numbers; XLA has under 1-2%
  - Onset typically in the second to fourth decade rather than infancy
  - Affects both sexes; no BTK variant, and BTK protein expression is normal
  - Prominent autoimmunity, lymphoproliferation and granulomatous disease, which XLA lacks
- name: Transient hypogammaglobulinemia of infancy
  description: >-
    A self-limited exaggeration of the physiological IgG nadir after maternal
    IgG is catabolised. It is the benign mimic to exclude in an infant with
    low immunoglobulins.
  disease_term:
    preferred_term: transient hypogammaglobulinemia of infancy
    term:
      id: MONDO:0015698
      label: transient hypogammaglobulinemia of infancy
  distinguishing_features:
  - B cells are present in normal numbers
  - IgG is low but detectable and vaccine responses are usually intact
  - Immunoglobulin levels normalise spontaneously, typically by 2-4 years of age

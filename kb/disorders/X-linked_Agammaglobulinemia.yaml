prevalence:
- population: United States (all live births, 1988-1997)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.26
  notes: >-
    The US XLA registry estimated a birth rate of 1/379,000 for 1988-1997,
    i.e. 0.26 per 100,000 live births. Note this denominator is ALL live
    births; because XLA manifests in hemizygous males, the male-specific birth
    prevalence is roughly twice this (on the order of 1/190,000 males). As a
    voluntary physician-reported registry it is a minimum estimate.
  evidence:
  - reference: PMID:16862044
    reference_title: "X-linked agammaglobulinemia: report on a United States registry of 201 patients."
    supports: SUPPORT

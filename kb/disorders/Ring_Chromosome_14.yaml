prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported as case series rather than population estimates. The largest
    published cohort combined literature review with 27 patients of the authors'
    own; a separate series characterised the epilepsy in 22 patients. No
    population prevalence has been established.
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ring 14 syndrome is a rare condition, whose precise clinical and
      genetic characterization is still limited. This review summarizes
      literature data and it describes our own experience with 27 patients with
      ring 14 syndrome.
    explanation: >-
      Establishes the scale at which this syndrome is reported and states
      explicitly that its characterisation remains limited.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Two things drive the burden and they are different in kind. The epilepsy is
    near-universal, begins in the first months of life and resists drugs in about
    half of patients, and its severity tracks cognitive outcome. But the fact that
    changes management most is that infection, not seizures, is the leading cause
    of death in adulthood. The guideline is explicit that infection is among the
    worst prognostic factors and that prevention should be pursued actively rather
    than reactively, through hygiene, parental training for early recognition,
    extended vaccination and early hospitalisation. An entry that modelled only
    the epilepsy would misrepresent what actually kills these patients.
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and the main cause of death in adulthood, all measures preventing
      infections must be undertaken
    explanation: >-
      States that infection is the leading cause of adult death in this syndrome
      and that prevention is therefore a standing management obligation.
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The degree of severity of the epileptic phenotype negatively influences
      child cognitive development.
    explanation: >-
      Establishes that epilepsy severity drives the cognitive component of the
      burden.

diagnosis:
- name: Conventional Karyotype
  description: >-
    Karyotyping is the test that makes this diagnosis, and the point is not
    incidental. A complete ring that has lost only telomeric material is
    balanced in copy number, so chromosomal microarray returns a normal result
    while the karyotype shows the ring. A child with early drug-resistant
    epilepsy, intellectual disability and a normal microarray therefore still
    warrants a karyotype.
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:25901181
    reference_title: Dysregulation of FOXG1 by ring chromosome 14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array CGH analysis did not show any genomic imbalance but conventional
      karyotyping and FISH analysis revealed the presence of an interstitial
      14q12q24.3 deletion and an extra ring chromosome derived from the deleted
      material.
    explanation: >-
      A worked case in which array analysis was normal and only karyotype and
      FISH revealed the ring, which is the diagnostic argument this entry makes.
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conventional cytogenetics is the primary tool to identify a ring
      chromosome. Children with a terminal deletion of chromosome 14q ascertained
      by molecular karyotyping (CGH/SNP array) should be tested secondarily by
      conventional cytogenetics for the presence of a ring chromosome.
    explanation: >-
      The consensus guideline states the diagnostic order directly: karyotype is
      primary, and an array-detected terminal 14q deletion should trigger a
      karyotype to look for a ring.
- name: Chromosomal Microarray for Deletion Sizing
  description: >-
    Array analysis does not make the diagnosis but sizes the terminal 14q
    deletion where one is present, which is what assigns the behavioural and
    immunological features to 14q32. Reported deletions run from 0.3 to 5 Mb, and
    a normal array does not exclude the syndrome.
  diagnosis_term:
    preferred_term: Comparative Genomic Hybridization
    term:
      id: NCIT:C18084
      label: Comparative Genomic Hybridization
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our own sample of patients the ring was complete, with no apparent loss
      of chromosome material, in 6/27 cases, while it showed a small terminal
      deletion, varying in size from 0.3 to 5 Mb, in the other 21.
    explanation: >-
      Gives the deletion size range array analysis resolves, and the proportion
      of patients in whom there is no deletion for it to find.
- name: Electroencephalography
  description: >-
    The electroencephalographic picture evolves in a stereotyped way and is
    characteristic enough to support the diagnosis: slow background with
    pseudoperiodic bursts of generalised slow waves early, then focal
    frontotemporal or temporoposterior slow waves with interposed multifocal
    spikes, and rhythmic fast recruiting posterior spikes that generalise.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EEG abnormalities consisted of slow background activity with pseudoperiodic
      bursts of generalized slow waves in the early stage, focal frontotemporal
      or temporoposterior slow waves with multifocal spikes interposed, and
      unusual rhythmic fast recruiting posterior spikes followed by secondary
      generalization.
    explanation: >-
      Describes the electroencephalographic evolution used diagnostically.
- name: Ophthalmological Surveillance
  description: >-
    Regular eye examination is recommended for all patients, because the retinal
    findings are common, are not detectable without looking, and range from
    asymptomatic macular change to retinitis pigmentosa.
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with evaluation of the fundus oculi: Grade B
    explanation: >-
      The consensus guideline makes periodic fundus examination a graded
      recommendation, which is stronger and more specific than the single-case
      support previously cited here.
  - reference: PMID:31755799
    reference_title: Multimodal imaging of ring 14 syndrome associated maculopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data support regular eye examination for all patients with ring
      chromosome 14 syndrome.
    explanation: >-
      Independent support for universal ophthalmic surveillance, from the
      multimodal imaging case.
treatments:
- name: Antiseizure Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Seizure control is the main therapeutic problem and it is largely unsolved:
    the epilepsy of this syndrome is characterised as drug-resistant in the
    series that define it. No agent or regimen has been shown to work
    preferentially here, so treatment follows general drug-resistant focal
    epilepsy practice rather than anything syndrome-specific.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of epilepsy in patients with r(14) syndrome is virtually
      100%, characterized by early onset, polymorphic seizures, and drug-resistant
      seizures.
    explanation: >-
      Establishes that the epilepsy is drug-resistant. Graded PARTIAL because it
      characterises the therapeutic problem rather than supporting any particular
      treatment; no trial evidence exists in this syndrome.
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy should be treated from the onset with anticonvulsive therapy.
    explanation: >-
      The consensus guideline recommends anticonvulsive therapy from seizure
      onset, which is the treatment this entry records.
  notes: >-
    Curated to record that the treatment exists and does not work well, which is
    a substantive clinical fact about this syndrome. No specific agent is named
    because no source recommends one for ring 14 specifically.
- name: Nutritional Support
  therapeutic_modality: BEHAVIORAL
  description: >-
    The consensus guideline recommends nutritional assessment for every patient,
    with nutritional support for malnourishment escalating to gastrostomy feeding
    in selected cases. This is one of the few management recommendations in this
    syndrome that is both specific and universal.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutritional assessment is recommended for all patients and nutritional
      support for malnourishment can include gastrostomy feeding in selected
      cases.
    explanation: >-
      States the nutritional recommendation and the escalation to gastrostomy
      that this treatment records.
  notes: >-
    therapeutic_modality is BEHAVIORAL because the recommendation is an
    assessment-and-support pathway rather than a named agent. Note the CLAUDE.md
    caution that NCIT:C15433 Nutritional Support often names a specific compound;
    here it genuinely is dietary and escalation-of-feeding-route management, which
    is what the guideline describes.
- name: Ketogenic Diet or Vagus Nerve Stimulation for Drug-Resistant Seizures
  therapeutic_modality: BEHAVIORAL
  description: >-
    About half of patients are drug-resistant, and for them the guideline raises
    ketogenic diet and vagus nerve stimulation as options to consider. Neither is
    presented as established in this syndrome; they are the standard escalation
    for drug-resistant childhood epilepsy and are named as worth considering.
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Ketogenic diet or Vagal Nerve Stimulation may be taken in consideration
      for the therapeutic strategy
    explanation: >-
      Names both options for the drug-resistant half of patients. Graded PARTIAL
      because the guideline offers them for consideration rather than
      recommending them, and no outcome data exist in this syndrome.
  notes: >-
    Vagus nerve stimulation is described in the same recommendation but is not
    separately bound: NCIT's only reachable stimulation term is Transcutaneous
    Auricular Vagus Nerve Stimulation, which is a different, non-implanted
    modality, and binding it would misstate the intervention. The diet carries
    the binding and the notes carry the device option.
- name: Early Physical Therapy
  therapeutic_modality: BEHAVIORAL
  description: >-
    Started early and explicitly preventive rather than restorative: the target is
    the musculoskeletal consequences of hypotonia, scoliosis in particular, before
    they become fixed.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Start physical therapy early to reduce hypotonic complications (such as
      scoliosis) due to the reduced muscle tone: Grade B
    explanation: >-
      A Grade B recommendation naming both the intervention and the complication
      it is meant to prevent.
- name: Speech Therapy for Dysphagia
  therapeutic_modality: BEHAVIORAL
  description: >-
    Referral for dysphagia carries the guideline's highest grade. It matters
    doubly here, because aspiration feeds the respiratory infections that are the
    leading cause of adult death, so this is airway protection as much as feeding
    support.
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with dysphagia should be referred to a speech therapist: Grade A
    explanation: >-
      Grade A recommendation for speech-therapy referral in dysphagia.
- name: Vaccination Against Encapsulated Organisms
  therapeutic_modality: VACCINE
  description: >-
    Extended inactivated-vaccine coverage is part of the infection-prevention
    strategy that follows from infection being the leading cause of adult death.
    The guideline names the specific vaccines rather than leaving it general.
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recommended (inactivated) vaccines include anti-haemophilus,
      anti-pneumococcal, anti-meningococcal and flu vaccine: Grade C
    explanation: >-
      Names the specific inactivated vaccines recommended in this syndrome.
- name: Vitamin D Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Given at twice the recommended daily allowance, roughly 800 to 1000 IU daily,
    as part of nutritional management. The dose is above ordinary supplementation
    and is specified by the guideline rather than left to general practice.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: vitamin D
      term:
        id: CHEBI:28940
        label: calciol
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vitamin D daily supplementation must be given at twice the of recommended
      daily allowance
    explanation: >-
      Specifies the supplementation dose. The quoted sentence carries a
      typographical error in the source and is reproduced verbatim, as a snippet
      belongs to the paper.
  notes: >-
    therapeutic_agent is bound to CHEBI:28940 calciol, which is vitamin D3
    (cholecalciferol). The guideline says vitamin D without specifying the
    vitamer; calciol is the form ordinarily meant by daily supplementation dosing
    in IU, but the binding is one step more specific than the source and is
    flagged here rather than left implicit.

- name: Respiratory Function Monitoring and Advance Care Planning
  therapeutic_modality: BEHAVIORAL
  description: >-
    Prompt assessment of any respiratory symptom, with formal screening of
    respiratory function, carries the guideline's highest grade. So does
    discussing signs of respiratory failure with parents in advance. That second
    half is unusual for a management recommendation and follows from the same
    fact the clinical burden records: respiratory infection is what kills these
    patients in adulthood, so the conversation is meant to happen before the
    crisis rather than during it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Signs of respiratory failure should be discussed with the parents to allow
      advanced planning: Grade A
    explanation: >-
      Grade A recommendation covering both respiratory monitoring and advance
      planning for respiratory failure.
- name: Antibiotic Prophylaxis, Respiratory Physiotherapy and Immunological Evaluation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    For recurrent pulmonary infection the guideline recommends three things
    together at Grade A: antibiotic prophylaxis, respiratory physiotherapy, and
    an immunological evaluation. The last is the one most easily skipped and the
    most informative here, because the 14q32 deletion is proposed to remove the
    immunoglobulin heavy-chain locus, so measuring immune function in a patient
    with recurrent infection is both management and the missing evidence for that
    mechanism.
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:28399932
    reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first report of an ad hoc task force.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case of recurrent pulmonary infections, consider respiratory
      physiotherapy antibiotic prophylaxis; an immunological evaluation is also
      strongly recommended: Grade A
    explanation: >-
      Grade A recommendation naming all three interventions this treatment
      records.
  notes: >-
    Three interventions are curated as one treatment because the guideline
    recommends them as a single conditional response to recurrent pulmonary
    infection rather than as independent options. treatment_term is bound to the
    antibiotic-prophylaxis component, which is the only one with a reachable NCIT
    clinical-action term; the physiotherapy and immunological-evaluation
    components are carried in the description.

environmental:
- name: Febrile illness as a seizure trigger
  description: >-
    Seizures in this syndrome may be precipitated by fever. This matters
    practically because infection is both frequent here and the leading cause of
    adult death, so a febrile illness threatens the patient twice over: directly,
    and by provoking seizures in an epilepsy that is already drug-resistant.
  influences_mechanisms:
  - target: Cortical Hyperexcitability
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Fever lowers the threshold of an already seizure-prone cortex rather than
      creating the susceptibility, so it is modelled as exacerbating the
      hyperexcitability node rather than triggering it.
    evidence:
    - reference: PMID:23159383
      reference_title: Epilepsy in ring 14 chromosome syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seizures might be induced by fever.
      explanation: >-
        Reports fever as a seizure precipitant in this syndrome. Graded PARTIAL
        because the source states it without quantifying how often it occurs.
  evidence:
  - reference: PMID:23159383
    reference_title: Epilepsy in ring 14 chromosome syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy onset in r(14) syndrome takes place during the first year of life;
      seizures are generalized or focal and less frequently myoclonic. Seizures
      might be induced by fever.
    explanation: >-
      Places fever-induced seizures within the described seizure repertoire of
      the syndrome. Graded PARTIAL because it is a two-case report with a
      literature review rather than a systematic study of triggers.
  review_notes: >-
    exposure_term is deliberately unbound. ECTO was searched for fever,
    hyperthermia and heat exposure and returns nothing appropriate: its heat
    terms are environmental heat sources such as self-heating coal-mine waste,
    not a raised body temperature arising from the patient's own illness. Fever
    is a physiological state rather than an external exposure, so no term beats a
    bad one here. HP:0001945 Fever exists but is a phenotype term and is not
    valid in this slot.

clinical_trials:
- name: NCT06813469
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    MD-RING, a genomic study that directly tests the position-effect hypothesis
    this entry models. It sets out to examine whether position effects and
    topologically associating domain alterations are the pathomechanism of the
    syndrome, which is precisely the question the position_effect hypothesis
    group and the epilepsy knowledge gap record as open.
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: clinicaltrials:NCT06813469
    reference_title: Multi-Dimensional Genomic Dissection of Ring Chromosome 14 Syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MD-RING will explore the hypothesis that position effects and TAD
      alterations act as an unprecedented pathomechanism in r(14)S.
    explanation: >-
      The registered aim is an explicit test of the position-effect mechanism
      curated here as an EMERGING hypothesis, so this study is the live route to
      resolving that gap.
  notes: >-
    phase is NOT_APPLICABLE because this is an observational genomic study rather
    than an interventional trial with an FDA phase.

discussions:
- discussion_id: r14_epilepsy_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a chromosome 14 ring that preserves the proximal 14q interval
    produce near-universal, drug-resistant epilepsy?
  attaches_to:
  - pathophysiology#Cortical Hyperexcitability
  - mechanistic_hypotheses#position_effect
  - mechanistic_hypotheses#dynamic_mosaicism
  rationale: >-
    This is the central unanswered question of the syndrome and the reason the
    convergence node is graded HYPOTHETICAL. The epilepsy maps by comparison with
    linear deletions to proximal 14q11.2-q12, which is intact in every ring
    patient, so the deletion cannot be the cause. Position effect and dynamic
    mosaicism are both plausible and both have direct supporting observations,
    but neither has been connected to cortical excitability in any system. No
    causal gene, ion channel, synaptic abnormality or network mechanism has been
    identified. Distinguishing the two hypotheses would need expression
    measurement of proximal 14q genes in neural tissue or neurons derived from
    ring 14 patients, alongside quantification of ring loss in the same cells.
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we could deduce that retinal abnormalities and epilepsy map within the
      proximal 14q11.2- q12 region
    explanation: >-
      Localises the epilepsy to the interval that is preserved in all ring
      patients, which is what makes the mechanism a gap rather than a deletion.
- discussion_id: r14_foxg1_untested_in_classical_ring
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is FOXG1 expression actually altered in classical ring chromosome 14, or is
    the FOXG1 link confined to the single atypical case that raised it?
  attaches_to:
  - mechanistic_hypotheses#position_effect
  rationale: >-
    FOXG1 is an attractive candidate because it sits at 14q12 inside the
    implicated interval, and because FOXG1 syndrome shares features with ring 14.
    But the case that raised it carried a ring formed from an interstitial
    excision, not the usual telomere-fusion ring, and its breakpoint fell 225 kb
    downstream of FOXG1 within the regulatory landscape. FOXG1 expression was not
    measured in that patient and has not been measured in any classical ring 14
    patient. The hypothesis is positional and currently untested where it
    matters.
  proposed_experiments:
  - experiment_id: r14_foxg1_expression_in_patient_neurons
    name: FOXG1 expression in ring 14 patient-derived neurons
    description: >-
      Measure FOXG1 and other proximal 14q transcript levels in neurons derived
      from classical ring 14 patients, including patients whose ring carries no
      deletion, against matched controls.
    would_support:
    - mechanistic_hypotheses#position_effect
    supporting_outcome:
    - >-
      FOXG1 or other proximal 14q genes are downregulated in ring 14 neurons at
      normal copy number, connecting the position-effect model to the tissue
      where the epilepsy arises.
    refuting_outcome:
    - >-
      Proximal 14q expression is unchanged in ring 14 neurons, indicating that
      position effect on this interval is not the route to the epilepsy and
      redirecting attention to mosaicism or to another mechanism entirely.
  evidence:
  - reference: PMID:25901181
    reference_title: Dysregulation of FOXG1 by ring chromosome 14.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient represents the first case of a r(14) arising from an
      interstitial excision where the phenotype is compatible with dysregulation
      of FOXG1.
    explanation: >-
      The source itself frames this as a first case of an atypical ring
      configuration, which is the limitation this gap records.
- discussion_id: r14_mosaicism_not_correlated_with_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the degree of ring instability correlate with phenotype severity or
    progression in ring chromosome 14?
  attaches_to:
  - mechanistic_hypotheses#dynamic_mosaicism
  - pathophysiology#Ring Mitotic Instability and Dynamic Mosaicism
  rationale: >-
    Dynamic mosaicism is invoked to explain both why the phenotype exceeds the
    deletion and why it progresses, and the underlying instability is genuinely
    documented: one patient showed micronuclei, aneuploidy and anaphase lags. But
    instability has been measured in one patient and severity has never been
    scored against it. Without that correlation the hypothesis explains
    everything and predicts nothing. A cohort measuring ring-loss rate in
    accessible cells against epilepsy severity and cognitive trajectory would
    test it.
  evidence:
  - reference: PMID:39020403
    reference_title: "Chromosomal instability in a patient with ring chromosome 14 syndrome: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic instability was evidenced by the presence of micronuclei and
      aneuploidies involving the ring and other chromosomes.
    explanation: >-
      Documents instability in a single patient, which is the entire direct
      evidence base for the mosaicism hypothesis in this syndrome.
- discussion_id: r14_igg_glycosylation_trans_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a chromosome 14 ring produce a selective IgG galactosylation and
    sialylation defect, when no relevant glycosyltransferase gene lies on
    chromosome 14?
  attaches_to:
  - pathophysiology#Aberrant IgG N-Glycosylation
  - pathophysiology#Terminal 14q32 Haploinsufficiency
  rationale: >-
    This is the sharpest mechanistic question on the branch the entry itself
    identifies as most consequential, since infection is the leading cause of
    adult death here. The glycosylation abnormality is measured and selective: it
    affects IgG and not total serum glycoproteins, and it occurs at normal IgG
    concentration. But the enzymes whose products are altered are not encoded on
    chromosome 14, so the effect cannot be a straightforward consequence of the
    deleted interval and must act in trans by a route nobody has identified.

    It also reframes the 14q32 branch. The guideline's positional argument
    predicts a quantitative immunoglobulin deficit from loss of the heavy-chain
    locus; what has actually been measured is normal IgG with altered glycans.
    Those are different lesions, and the entry now carries both rather than
    letting the positional argument stand unopposed. Whether they are alternative
    explanations or two consequences of one lesion is unresolved.
  evidence:
  - reference: PMID:42352229
    reference_title: IgG Glycosylation Analysis in Patients with Ring14 Syndrome Unveils Novel Pathomechanisms and New Therapy Perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no genes encoding galactosyltransferases or sialyltransferases are located
      on chromosome 14
    explanation: >-
      States the fact that makes this a trans mechanism and therefore an open
      question rather than a dosage consequence.
  notes: >-
    The same report describes one patient treated with intravenous immunoglobulin
    who showed clinical improvement. That observation is deliberately not curated
    as a treatment. The paper itself states that it remains a theoretical
    assumption and should not be interpreted as evidence of therapeutic efficacy,
    and curating an n-of-1 uncontrolled observation as treatment evidence would
    misrepresent the source.

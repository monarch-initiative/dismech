name: Ring Chromosome 14 Syndrome
creation_date: "2026-08-29T00:00:00Z"
category: Genetic
synonyms:
- r(14) syndrome
- ring 14 syndrome
- ring chromosome 14
- chromosome 14 ring
description: >-
  Ring chromosome 14 syndrome is a rare chromosomal disorder in which the two
  ends of chromosome 14 fuse into a circle. It is dominated by an epilepsy that
  begins in the first years of life, is polymorphic and drug-resistant, and
  occurs in essentially every patient. Alongside it sit intellectual disability,
  microcephaly, short stature, a distinctive facial appearance, scoliosis, and a
  characteristic retinal pigmentary abnormality.

  The mechanistically interesting part is that the deletion does not explain the
  syndrome. Ring formation usually removes a small terminal segment of 14q, and
  in a minority of patients it removes nothing at all. Mapping the features
  against linear 14q deletions puts the epilepsy and the retinal abnormality in
  proximal 14q11.2-q12 — a region that is intact in every ring patient. So the
  two defining features of the syndrome arise from a region that has not been
  deleted, and the deletion that is present sits somewhere else, at 14q32, where
  it plausibly accounts for the behavioural phenotype and the susceptibility to
  infection by ordinary haploinsufficiency.

  Two candidate explanations carry the unexplained part, and this entry models
  both rather than choosing. The first is position effect: circularisation
  changes the chromatin architecture of the chromosome, and heterochromatin
  spreading from the adjacent short arm may silence proximal 14q genes that are
  physically present in normal copy number. A patient whose complete ring lost
  only its telomeres nonetheless showed two of eight chromosome-14 genes
  downregulated, which is the cleanest demonstration that copy number and
  expression come apart here. FOXG1, at 14q12, is the specific candidate this
  points at. The second is dynamic mosaicism: rings are mitotically unstable, and
  a patient studied for instability showed anaphase lags, aneuploidy and the ring
  excluded from the nucleus as a micronucleus, so the effective genotype differs
  from cell to cell and worsens over time.

  These are not competing accounts of one thing so much as two consequences of
  the same lesion, and the syndrome may need both. Neither has been shown to
  cause the epilepsy.

notes: >-
  Scope note on the mechanism graph. This entry carries two parallel mechanism
  branches out of a single chromosomal lesion, and neither is established. The
  14q32 terminal deletion branch is ordinary haploinsufficiency and is
  well-supported for the behavioural and immunological features. The proximal
  14q11.2-q12 branch, which carries the epilepsy and the retinal phenotype, has
  no deletion behind it at all: that region is preserved in every ring patient.
  Position effect and dynamic mosaicism are both curated as mechanistic
  hypotheses with EMERGING status rather than asserted, and the causal edges
  into the epilepsy node are typed INDIRECT_UNKNOWN_INTERMEDIATES because the
  route from either to cortical hyperexcitability is exactly what is missing.

  No genetic section. There is no causal gene. FOXG1 is a specific candidate
  raised by one patient whose ring breakpoint fell within the FOXG1 regulatory
  landscape, but it is a positional hypothesis about a gene that is neither
  deleted nor mutated, so typing it CAUSATIVE in a genetic block would
  misrepresent the evidence. It is curated inside the position-effect hypothesis
  where the reasoning can be stated.

  A named 14q32.33 candidate was deliberately not asserted. The deep-research
  report identifies the immunoglobulin heavy-chain (IGH) locus at 14q32.33 as the
  gene whose hemizygosity would explain the susceptibility to infection, and
  PACS2 as an epilepsy candidate in the same band. Both are mechanistically
  attractive and IGH in particular would upgrade this entry's 14q32 node from
  unnamed dosage loss to a specific lesion. Neither is curated, because no source
  in the reference cache makes that claim about ring 14 patients, and naming a
  gene on positional plausibility is the failure mode this entry is otherwise
  built to avoid. It is recorded here as a lead worth chasing rather than dropped.

  Phenotype sourcing. Frequencies come from the HPO disease annotation for
  ORPHA:1440, which carries Orphanet's own curated frequency classes (Very
  frequent, Frequent, Occasional). These map onto FrequencyEnum directly and are
  used as such. Phenotypes carrying that provenance have it recorded in notes
  rather than a manufactured quote, because HPOA is a derived annotation and not
  a quotable source. Phenotypes that are additionally supported by a cited series
  carry an evidence item as well. The Orphanet bulk XML was not downloaded to
  build an ORPHA reference-cache entry, because doing so would have added
  manifest churn unrelated to this curation.
pathophysiology:
- name: Ring Chromosome 14 Formation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Breakage in both arms of chromosome 14 followed by fusion of the ends
    produces a circular chromosome. In the reported series the ring was complete,
    with no apparent loss of material, in 6 of 27 patients, and carried a small
    terminal deletion of 0.3 to 5 Mb in the remaining 21. Rings with a deletion
    were paternal in origin in about three quarters of cases, and uniparental
    disomy for chromosome 14 was excluded throughout, so the phenotype is not an
    imprinting disorder.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our own sample of patients the ring was complete, with no apparent loss
      of chromosome material, in 6/27 cases, while it showed a small terminal
      deletion, varying in size from 0.3 to 5 Mb, in the other 21.
    explanation: >-
      Establishes that a substantial minority of ring patients lose no material
      at all, which is what forces a non-deletional mechanism for the shared
      phenotype.
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deleted rings were 75% paternal and 25% maternal in origin. UPD (14) was
      excluded in all cases.
    explanation: >-
      Excludes uniparental disomy, ruling out the imprinting mechanism that
      chromosome 14 would otherwise raise.
  downstream:
  - target: Terminal 14q32 Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Where ring formation removes terminal 14q material, the deleted segment is
      present in single copy.
    evidence:
    - reference: PMID:22564756
      reference_title: The ring 14 syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        it showed a small terminal deletion, varying in size from 0.3 to 5 Mb, in
        the other 21
      explanation: >-
        Documents that ring formation produces a terminal 14q deletion in the
        majority of patients, which is the edge asserted here.
  - target: Position-Effect Dysregulation of Proximal 14q
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - position_effect
    description: >-
      Circularisation alters the chromatin context of the chromosome; the steps
      from that to altered expression of specific proximal genes are not
      established.
    evidence:
    - reference: PMID:26315457
      reference_title: Position effect modifying gene expression in a patient with ring chromosome 14.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        phenotypic alterations can also be found in the presence of complete ring
        chromosomes, in which the breakage and rejoining in terminal regions of
        both chromosome arms result in no gene loss
      explanation: >-
        Supports an edge from ring formation to phenotype that does not run
        through gene loss. Graded PARTIAL because it establishes that such a
        route exists without identifying its steps.
  - target: Ring Mitotic Instability and Dynamic Mosaicism
    causal_link_type: DIRECT
    hypothesis_groups:
    - dynamic_mosaicism
    description: >-
      A circular chromosome is mechanically unstable in mitosis, which is a
      direct consequence of its topology.
    evidence:
    - reference: PMID:39020403
      reference_title: "Chromosomal instability in a patient with ring chromosome 14 syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we were able to verify an instability of the r(14) chromosome, mainly
        involving anaphasic lags and its exclusion from the nucleus in the form of
        a micronucleus
      explanation: >-
        Demonstrates that the ring configuration itself produces mitotic
        instability in a ring 14 patient.
- name: Terminal 14q32 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Where the ring carries a terminal deletion, the lost segment lies at 14q32.
    Comparison with linear 14q deletions assigns the behavioural phenotype and
    the susceptibility to infection to this region, with simple haploinsufficiency
    as the mechanism. This branch behaves like an ordinary contiguous gene
    deletion syndrome and is the part of the phenotype that copy number does
    explain.

    PROVISIONAL because the assignment is by phenotype mapping against linear
    deletion cases, not by demonstrating reduced expression or function of a
    named gene in ring patients.
  biological_processes:
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Behavior disorders and susceptibility to infections can be assigned to the
      14q32 region, haploinsufficiency being the most likely underlying
      mechanism.
    explanation: >-
      Assigns the behavioural and immunological features to 14q32 loss by
      haploinsufficiency, the claim this node makes.
  downstream:
  - target: Behavioural Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced dosage of 14q32 genes is the proposed basis of the behavioural
      phenotype; no gene or pathway has been named.
    evidence:
    - reference: PMID:22564756
      reference_title: The ring 14 syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Behavior disorders and susceptibility to infections can be assigned to the
        14q32 region, haploinsufficiency being the most likely underlying
        mechanism.
      explanation: >-
        Assigns the behavioural phenotype to 14q32 loss. Graded PARTIAL because
        the assignment is by comparison with linear deletions and names no gene.
- name: Position-Effect Dysregulation of Proximal 14q
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The features that define the syndrome map to proximal 14q11.2-q12, which is
    preserved in every ring patient, so they cannot be explained by loss of
    material. The proposal is that circularisation changes the chromatin
    architecture of the chromosome and that heterochromatin spreading from the
    adjacent short arm silences genes in the proximal interval despite their
    being present in two copies.

    The supporting observation is a patient whose ring lost nothing but the
    telomeres, in whom two of eight chromosome-14 genes assayed were nonetheless
    downregulated relative to matched controls. FOXG1 at 14q12 is the specific
    candidate: in a patient with a ring derived from an interstitial excision,
    the breakpoint fell 225 kb downstream of FOXG1 inside its known regulatory
    landscape, and the phenotype overlapped FOXG1 syndrome.

    HYPOTHETICAL, and deliberately so. Two patients is the entire direct
    evidence base, neither study measured FOXG1 expression in classical ring 14,
    and no experiment has connected altered expression of any proximal 14q gene
    to the epilepsy.
  biological_processes:
  - preferred_term: heterochromatin formation
    term:
      id: GO:0031507
      label: heterochromatin formation
    modifier: INCREASED
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because this region is preserved in all patients with ring 14, we speculate
      that genes residing in the proximal 14q interval are disregulated through
      heterochromatinization spreading from the adjacent short arm of the
      chromosome.
    explanation: >-
      States the position-effect proposal and, importantly, states it as
      speculation, which is why this node is graded HYPOTHETICAL.
  - reference: PMID:26315457
    reference_title: Position effect modifying gene expression in a patient with ring chromosome 14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of them were found to be downregulated in the patient compared to the
      controls, indicating that his phenotype might be related to alterations in
      the expression of genes located in the abnormal chromosome, even when the
      copy number is normal.
    explanation: >-
      Demonstrates altered expression at normal copy number in a ring that lost
      only telomeres, which is the direct evidence that position effect operates
      here.
  - reference: PMID:25901181
    reference_title: Dysregulation of FOXG1 by ring chromosome 14.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the proximal breakpoint was 225 kb downstream of the forkhead box G1 gene
      (FOXG1), within the known regulatory landscape of FOXG1
    explanation: >-
      Names FOXG1 as the positional candidate. Graded PARTIAL because this
      patient carried an interstitial excision rather than the classical ring,
      and FOXG1 expression was not measured.
  downstream:
  - target: Cortical Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - position_effect
    description: >-
      The proposed route from silencing of proximal 14q genes to a seizure-prone
      cortex. No intermediate step has been identified.
    evidence:
    - reference: PMID:22564756
      reference_title: The ring 14 syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we could deduce that retinal abnormalities and epilepsy map within the
        proximal 14q11.2- q12 region
      explanation: >-
        Localises the epilepsy to the interval this branch acts on. Graded
        PARTIAL because localisation is not mechanism: nothing shows that
        silencing these genes causes seizures.
  - target: Retinal Pigmentary Abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - position_effect
    description: >-
      The retinal phenotype maps to the same preserved proximal interval as the
      epilepsy and is proposed to arise the same way.
    evidence:
    - reference: PMID:22564756
      reference_title: The ring 14 syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we could deduce that retinal abnormalities and epilepsy map within the
        proximal 14q11.2- q12 region
      explanation: >-
        Places the retinal phenotype in the preserved proximal interval alongside
        the epilepsy. Graded PARTIAL for the same reason: this is mapping, not
        mechanism.
- name: Ring Mitotic Instability and Dynamic Mosaicism
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A ring chromosome segregates poorly. Sister chromatid exchange within the
    ring generates interlocked and multimeric forms that lag at anaphase, and the
    ring can be lost outright or sequestered into a micronucleus. The consequence
    is that the effective genotype varies between cells and drifts with age,
    which is the standard explanation for why ring phenotypes exceed what their
    deletion predicts.

    Direct evidence in ring 14 comes from a single patient studied for
    instability, in whom micronuclei, aneuploidy involving both the ring and
    other chromosomes, and anaphase lags were all documented.

    PROVISIONAL: instability itself is demonstrated, but no study has linked the
    degree of mosaicism to the severity of the epilepsy, which is what the
    mechanism would need to explain.
  cellular_components:
  - preferred_term: micronucleus
    term:
      id: GO:0031040
      label: micronucleus
  biological_processes:
  - preferred_term: chromosome segregation
    term:
      id: GO:0007059
      label: chromosome segregation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39020403
    reference_title: "Chromosomal instability in a patient with ring chromosome 14 syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic instability was evidenced by the presence of micronuclei and
      aneuploidies involving the ring and other chromosomes.
    explanation: >-
      Documents the cytogenetic instability this node asserts, in a ring 14
      patient.
  - reference: PMID:39020403
    reference_title: "Chromosomal instability in a patient with ring chromosome 14 syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we were able to verify an instability of the r(14) chromosome, mainly
      involving anaphasic lags and its exclusion from the nucleus in the form of
      a micronucleus
    explanation: >-
      Specifies the mitotic mechanism, anaphase lag and micronucleus formation,
      by which the ring is lost from daughter cells.
  downstream:
  - target: Cortical Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dynamic_mosaicism
    description: >-
      Cell-to-cell variation in effective genotype is proposed to produce a
      functionally heterogeneous cortex. Untested against seizure severity.
    evidence:
    - reference: PMID:25901181
      reference_title: Dysregulation of FOXG1 by ring chromosome 14.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        dysregulation of FOXG1 may contribute to the classical r(14)-syndrome,
        likely mediated by dynamic mosaicism
      explanation: >-
        Proposes mosaicism as the mediator between the ring and the phenotype.
        Graded PARTIAL: it is an interpretation offered by the authors, not a
        measured relationship.
- name: Cortical Hyperexcitability
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The convergence node for the epilepsy, and an acknowledged gap. Epilepsy
    occurs in essentially all patients, begins early, is polymorphic and
    drug-resistant, and carries a characteristic electroencephalographic
    evolution: slow background with pseudoperiodic bursts of generalised slow
    waves early, then focal frontotemporal or temporoposterior slow waves with
    interposed multifocal spikes, and unusual rhythmic fast recruiting posterior
    spikes that generalise.

    What is not known is how the chromosomal lesion produces this. No causal
    gene, no ion channel, no synaptic or network abnormality has been identified
    in ring 14. The node is curated because the clinical and
    electroencephalographic phenotype is well characterised and highly
    stereotyped, not because its molecular basis is understood, and both incoming
    edges are typed as indirect with unknown intermediates for that reason.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of epilepsy in patients with r(14) syndrome is virtually
      100%, characterized by early onset, polymorphic seizures, and drug-resistant
      seizures.
    explanation: >-
      Establishes the near-complete penetrance and drug resistance that make this
      the defining feature of the syndrome.
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EEG abnormalities consisted of slow background activity with pseudoperiodic
      bursts of generalized slow waves in the early stage, focal frontotemporal
      or temporoposterior slow waves with multifocal spikes interposed, and
      unusual rhythmic fast recruiting posterior spikes followed by secondary
      generalization.
    explanation: >-
      Characterises the electroencephalographic signature of the cortical
      abnormality modeled by this node.
  downstream:
  - target: Cognitive Decline with Epilepsy Severity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severity of the epileptic phenotype tracks the degree of cognitive
      impairment.
    evidence:
    - reference: PMID:24116895
      reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The degree of severity of the epileptic phenotype negatively influences
        child cognitive development.
      explanation: >-
        Reports the association. Graded PARTIAL because a cross-sectional series
        cannot establish that the seizures drive the cognitive outcome.
- name: Retinal Pigmentary Abnormality
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Abnormal retinal pigmentation is the characteristic ocular finding, and like
    the epilepsy it maps to the preserved proximal 14q interval rather than to
    the deletion. Reported findings run from pigmentary change through frank
    retinitis pigmentosa to macular abnormality; multimodal imaging in one
    patient showed punctiform yellowish macular lesions that were hyperautofluorescent
    with localised irregularity of the retinal pigment epithelium, with visual
    acuity preserved.
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we could deduce that retinal abnormalities and epilepsy map within the
      proximal 14q11.2- q12 region
    explanation: >-
      Places the retinal phenotype in the same preserved interval as the
      epilepsy, which is the basis for routing both through the position-effect
      branch.
  - reference: PMID:31755799
    reference_title: Multimodal imaging of ring 14 syndrome associated maculopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SD-OCT showed normal characteristics at both eyes with the exception of
      localized irregularity of the RPE in an area associated with a macular
      yellow dots.
    explanation: >-
      Characterises the retinal pigment epithelial change underlying the macular
      finding.
- name: Behavioural Dysregulation
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Hyperactive and aggressive behaviour is reported in a subset of patients and
    is assigned to 14q32 haploinsufficiency rather than to the proximal interval,
    which makes it the one part of the phenotype with a conventional dosage
    explanation.
  evidence:
  - reference: PMID:22564756
    reference_title: The ring 14 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Virtually all patients are intellectually delayed, with aggressive and
      hyperactive behavior in some.
    explanation: >-
      Documents the behavioural phenotype and its partial penetrance.
- name: Cognitive Decline with Epilepsy Severity
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Intellectual disability is near-universal, and the severity of the epilepsy
    tracks the degree of cognitive impairment. Whether the seizures drive the
    cognitive outcome or both reflect the same underlying cortical abnormality is
    not resolved by the available data, which are cross-sectional.
  evidence:
  - reference: PMID:24116895
    reference_title: "Epilepsy in ring 14 syndrome: a clinical and EEG study of 22 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The degree of severity of the epileptic phenotype negatively influences
      child cognitive development.
    explanation: >-
      Reports the association between epilepsy severity and cognitive outcome.
      Graded PARTIAL because the study design does not establish the direction of
      causation.
mechanistic_hypotheses:
- hypothesis_group_id: position_effect
  hypothesis_label: Position effect silences preserved proximal 14q genes
  status: EMERGING
  description: >-
    Circularisation changes the chromatin architecture of chromosome 14, and
    heterochromatin spreading from the short arm silences genes in the proximal
    14q11.2-q12 interval that remain present in normal copy number. This is the
    only account on offer for why the epilepsy and the retinal phenotype map to a
    region that is never deleted. FOXG1 at 14q12 is the named candidate.

    The evidence is two patients: one whose telomere-only ring showed two of
    eight chromosome-14 genes downregulated at normal copy number, and one whose
    breakpoint fell within the FOXG1 regulatory landscape with a
    FOXG1-syndrome-like phenotype. Neither demonstrates silencing of a proximal
    gene in a classical ring 14 patient, and neither connects expression to
    seizures.
  evidence:
  - reference: PMID:26315457
    reference_title: Position effect modifying gene expression in a patient with ring chromosome 14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotypic alterations found in the presence of complete ring
      chromosomes may be related to changes in the chromatin architecture,
      bringing about a change of expression by position effect
    explanation: >-
      States the position-effect model and the chromatin-architecture mechanism
      behind it.
- hypothesis_group_id: dynamic_mosaicism
  hypothesis_label: Mitotic ring instability produces a mosaic effective genotype
  status: EMERGING
  description: >-
    The ring is unstable in mitosis, so cells lose it or carry rearranged forms
    of it at varying rates. The resulting mosaicism, which increases with age,
    would make the functional genotype of any tissue a mixture and could explain
    why the phenotype exceeds the deletion and why it progresses.

    Instability itself is documented in a ring 14 patient. What is missing is any
    link between the degree of mosaicism and the severity of the phenotype, in
    this or any other ring 14 patient.
  evidence:
  - reference: PMID:25901181
    reference_title: Dysregulation of FOXG1 by ring chromosome 14.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dysregulation of FOXG1 may contribute to the classical r(14)-syndrome,
      likely mediated by dynamic mosaicism
    explanation: >-
      Proposes dynamic mosaicism as the mediator. Graded PARTIAL because it is
      offered as an interpretation of a single atypical case, not a
      demonstration.

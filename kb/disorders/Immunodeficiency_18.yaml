    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  target_mechanisms:
  - target: Loss of T-Cell Help to B Cells
    treatment_effect: BYPASSES
    description: >-
      Replacement antibody substitutes for the switched, specific immunoglobulin

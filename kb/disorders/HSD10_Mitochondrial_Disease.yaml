  age_range: 6-18 months
  notes: >
    In the classical infantile form, affected boys have normal or near-normal
    development for the first 6-18 months of life before onset of progressive
    neurodegeneration, retinopathy, and cardiomyopathy, often leading to death
    at age 2-4 years.
  evidence:
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Usually from age 6-18 months affected boys show a progressive neurodegenerative disease course in conjunction with retinopathy and cardiomyopathy leading to death at age 2-4 years or later."
    explanation: >
      Defines the 6-18 month onset of progressive neurodegeneration and early
      childhood mortality in the classical infantile form.
- phase: Onset
  subtype: Neonatal
  age_range: Neonatal period
  notes: >
    The severe neonatal form presents in the neonatal period with lactic
    acidosis, minimal neurological development, severe progressive
    cardiomyopathy, and early death.
  evidence:
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A more severe presentation in the neonatal period with little neurological development, severe progressive cardiomyopathy, and early death, is denoted neonatal form."
    explanation: >
      Defines the neonatal onset and fulminant course of the neonatal form.

treatments:
- name: Supportive care
  description: >
    There is no effective disease-modifying treatment for HSD10 disease; management is
    supportive, including seizure control, cardiac monitoring, and developmental
    support. Mitochondrial-toxic drugs such as valproate are generally avoided where
    possible given the underlying mitochondrial energy defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  - preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no effective treatment."
    explanation: >
      Confirms the absence of effective disease-modifying therapy, leaving supportive
      care as the management approach.
- name: Isoleucine-restricted diet
  description: >
    Dietary isoleucine restriction was considered based on the original framing
    as an inborn error of isoleucine metabolism, but clinical and mechanistic
    evidence shows there is no effective treatment and that the disease is
    driven by non-enzymatic mitochondrial dysfunction rather than toxic
    isoleucine metabolites, so alternative therapeutic approaches are required.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_phenotypes:
  - preferred_term: Organic aciduria
    term:
      id: HP:0001992
      label: Organic aciduria
  evidence:
  - reference: PMID:20077426
    reference_title: "A non-enzymatic function of 17beta-hydroxysteroid dehydrogenase type 10 is required for mitochondrial integrity and cell survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore alternative therapeutic approaches to an isoleucine-restricted diet are required."
    explanation: >-
      Mechanistic evidence that the disease is unrelated to toxic isoleucine-pathway
      metabolites implies isoleucine restriction is not an effective therapy.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no effective treatment."
    explanation: >-
      Clinical review of human HSD10 disease confirms that no effective
      treatment, including dietary restriction, has been established.

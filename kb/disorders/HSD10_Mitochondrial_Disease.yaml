diagnosis:
- name: Urinary organic acid analysis
  description: >
    Gas chromatography-mass spectrometry of urine detects the characteristic
    isoleucine catabolic metabolites 2-methyl-3-hydroxybutyrate and
    tiglylglycine, providing the primary biochemical clue to HSD10 disease.
  diagnosis_term:
    preferred_term: Urine Chemistry Measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  results: Elevated urinary 2-methyl-3-hydroxybutyrate and tiglylglycine.
  evidence:
  - reference: PMID:22132097
    reference_title: "A novel mutation in the HSD17B10 gene of a 10-year-old boy with refractory epilepsy, choreoathetosis and learning disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "his urine organic acid profile, showing elevated levels of 2-methyl-3-hydroxybutyrate and tiglylglycine, is characteristic of HSD10 deficiency"
    explanation: >
      Directly names elevated urinary 2-methyl-3-hydroxybutyrate and
      tiglylglycine on urine organic acid profiling as characteristic of HSD10
      deficiency.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on typical abnormalities in urinary organic acid analysis and molecular studies."
    explanation: >
      Establishes urinary organic acid analysis as a primary pillar of
      diagnosis.
- name: HSD17B10 molecular genetic testing
  description: >
    Sequence analysis of the X-linked HSD17B10 gene confirms the diagnosis by
    identifying a hemizygous (or heterozygous in females) pathogenic variant,
    most commonly the recurrent de novo p.R130C mutation in the classical
    infantile form.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Hemizygous or heterozygous pathogenic variant in HSD17B10.
  evidence:
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on typical abnormalities in urinary organic acid analysis and molecular studies."
    explanation: >
      Confirms that molecular genetic testing of HSD17B10 is required to
      establish the diagnosis.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same de novo mutation p.R130C was found in over half of patient families; it is associated with the infantile disease form."
    explanation: >
      Documents the recurrent de novo p.R130C variant in HSD17B10 found in over
      half of families with the classical infantile form.
- name: Respiratory chain enzyme and mitochondrial transcript analysis
  description: >
    Biochemical and blue-native PAGE evaluation of affected muscle, heart, or
    liver tissue demonstrates combined deficiency of mitochondrial respiratory
    chain complexes I, III, IV, and V with accumulation of unprocessed
    mitochondrial pre-tRNAs and mRNA transcripts.
  diagnosis_term:
    preferred_term: Protein or Enzyme Type Measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  results: Reduced activities and assembly of respiratory chain complexes I, III, IV, and V and elevated unprocessed mitochondrial pre-tRNAs and mRNA transcripts.
  evidence:
  - reference: PMID:25575635
    reference_title: "Mitochondrial energy failure in HSD10 disease is due to defective mtDNA transcript processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain enzyme analysis and BN-PAGE showed reduced activities and assembly of complexes I, III, IV, and V."
    explanation: >
      Demonstrates respiratory chain enzyme and complex assembly defects in
      patient tissue.
  - reference: PMID:25575635
    reference_title: "Mitochondrial energy failure in HSD10 disease is due to defective mtDNA transcript processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate elevated amounts of unprocessed pre-tRNAs and mRNA transcripts encoding mitochondrial subunits indicating deficient RNase P activity."
    explanation: >
      Demonstrates accumulation of unprocessed mitochondrial pre-tRNAs and mRNA
      transcripts in patient tissue.

differential_diagnoses:
- name: Beta-ketothiolase deficiency
  description: >
    Mitochondrial beta-ketothiolase (ACAT1) deficiency is the immediately
    downstream enzymatic step in isoleucine degradation; whereas HSD10
    deficiency shows reduced HSD10 (MHBD) enzyme activity with normal
    beta-ketothiolase activity and an X-linked neurodegenerative course with
    impaired mitochondrial RNase P function, beta-ketothiolase deficiency has
    deficient beta-ketothiolase activity.
  disease_term:
    preferred_term: beta-ketothiolase deficiency
    term:
      id: MONDO:0008760
      label: beta-ketothiolase deficiency
  distinguishing_features:
  - Reduced HSD10 (MHBD) enzyme activity with normal beta-ketothiolase activity in HSD10 disease
  - X-linked inheritance and progressive neurodegenerative course with retinopathy and cardiomyopathy in HSD10 disease
  - Pathogenic variants in HSD17B10 impairing both MHBD and mitochondrial RNase P activities
  evidence:
  - reference: PMID:22132097
    reference_title: "A novel mutation in the HSD17B10 gene of a 10-year-old boy with refractory epilepsy, choreoathetosis and learning disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His HSD10 activity was much lower than the normal control level, with normal β-ketothiolase activity."
    explanation: >
      Directly demonstrates that enzymatic measurement distinguishes HSD10
      deficiency (low HSD10 activity with normal beta-ketothiolase activity)
      from beta-ketothiolase deficiency.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This protein catalyzes the 2-methyl-3-hydroxybutyryl-CoA dehydrogenation (MHBD) reaction in isoleucine metabolism and is an essential component of mitochondrial RNase P required for the processing of mtDNA transcripts."
    explanation: >
      Dual role in isoleucine catabolism (MHBD step) and mitochondrial RNase P
      distinguishes HSD10 disease from pure isoleucine catabolic defects such
      as beta-ketothiolase deficiency.
- name: Leigh syndrome
  description: >
    Primary mitochondrial encephalomyopathies such as Leigh syndrome share
    infantile developmental regression, lactic acidosis, seizures, hypotonia,
    and respiratory chain complex deficiencies, but lack the diagnostic urinary
    2-methyl-3-hydroxybutyrate and tiglylglycine organic aciduria of HSD10
    disease.
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  distinguishing_features:
  - Elevated urinary 2-methyl-3-hydroxybutyrate and tiglylglycine on organic acid analysis
  - Hemizygous pathogenic variants in X-linked HSD17B10
  evidence:
  - reference: PMID:22132097
    reference_title: "A novel mutation in the HSD17B10 gene of a 10-year-old boy with refractory epilepsy, choreoathetosis and learning disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "his urine organic acid profile, showing elevated levels of 2-methyl-3-hydroxybutyrate and tiglylglycine, is characteristic of HSD10 deficiency"
    explanation: >
      Directly confirms elevated urinary 2-methyl-3-hydroxybutyrate and
      tiglylglycine as the characteristic organic acid profile distinguishing
      HSD10 deficiency from other mitochondrial encephalomyopathies.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on typical abnormalities in urinary organic acid analysis and molecular studies."
    explanation: >
      Urinary organic acid abnormalities and HSD17B10 sequencing distinguish
      HSD10 disease from other mitochondrial encephalomyopathies.


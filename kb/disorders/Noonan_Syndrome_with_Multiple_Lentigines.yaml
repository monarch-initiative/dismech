name: Noonan Syndrome with Multiple Lentigines
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Noonan syndrome with multiple lentigines (NSML), historically known as LEOPARD
  syndrome, is a rare autosomal dominant RASopathy of the RAS-MAPK signaling
  pathway. The LEOPARD acronym summarizes its cardinal features: multiple
  Lentigines, Electrocardiographic conduction abnormalities, Ocular
  hypertelorism, Pulmonary stenosis, Abnormalities of the genitalia, Retardation
  of growth, and sensorineural Deafness. Most cases are caused by specific
  missense variants in PTPN11 (LEOPARD syndrome 1), with a minority in RAF1
  (LEOPARD syndrome 2) or BRAF (LEOPARD syndrome 3), and rare variants in MAP2K1.
  Unlike the gain-of-function PTPN11 alleles of Noonan syndrome, the recurrent
  NSML PTPN11 alleles produce a catalytically-impaired (dominant-negative) SHP2
  phosphatase. In the heart this paradoxically drives Akt/mTOR hyperactivation
  (with agonist-evoked ERK/MAPK signaling instead abrogated) that produces
  hypertrophic cardiomyopathy, the feature that most distinguishes NSML from
  classic Noonan syndrome; ERK-pathway gain of function is the mechanism of the
  RAF1 (LPRD2) and BRAF (LPRD3) arms.
category: Genetic
parents:
- RASopathy

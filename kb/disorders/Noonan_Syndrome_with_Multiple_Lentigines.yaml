treatments:
- name: Hypertrophic cardiomyopathy management and cardiac surveillance
  description: >-
    Standard treatment of hypertrophic cardiomyopathy and structural heart
    defects, with echocardiographic surveillance (annual until age three years,
    then at ages five and ten years, or as clinically indicated) and monitoring
    for conduction abnormalities and arrhythmia.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301557
    reference_title: "Noonan Syndrome with Multiple Lentigines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard treatment of hypertrophic cardiomyopathy, structural heart defects, eye anomalies / eye movement abnormalities, seizures, cryptorchidism, and developmental issues"
    explanation: GeneReviews describes standard management of the cardiac and other manifestations of NSML.
- name: Growth hormone therapy (with caution in HCM)
  description: >-
    Growth hormone treatment may be considered for short stature, but data in
    NSML are lacking and it must be used with great caution (if at all) in
    individuals with hypertrophic cardiomyopathy to avoid exacerbating the
    cardiac condition.

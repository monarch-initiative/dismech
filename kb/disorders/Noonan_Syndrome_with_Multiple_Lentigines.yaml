diagnosis:
- name: Clinical diagnostic criteria
  description: >-
    Clinical diagnosis can be established in a proband with multiple lentigines
    plus two other cardinal features (cardiac abnormalities; poor linear growth /
    short stature; pectus deformity; and dysmorphic facial features including
    widely spaced eyes and ptosis), or, in the absence of lentigines, three of
    the other cardinal manifestations plus an affected first-degree relative.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:20301557
    reference_title: "Noonan Syndrome with Multiple Lentigines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be established in a proband with multiple lentigines plus two other cardinal features"
    explanation: GeneReviews states the clinical diagnostic criteria for NSML.
- name: Molecular genetic testing
  description: >-
    Molecular diagnosis is established by identifying a heterozygous pathogenic
    variant in one of the four NSML genes via a multigene RASopathy panel.
  diagnosis_term:

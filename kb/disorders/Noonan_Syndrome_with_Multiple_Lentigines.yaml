- name: Melanocytic Lentiginosis
  biological_scale: TISSUE
  description: >-
    Progressive accumulation of flat, pigmented macules (lentigines) reflects
    dysregulated melanocyte proliferation/pigmentation, presumed downstream of
    RAS-MAPK dysregulation in the melanocytic lineage. Lentigines typically
    appear at age four to five years and increase to the thousands by puberty.
  cell_types:

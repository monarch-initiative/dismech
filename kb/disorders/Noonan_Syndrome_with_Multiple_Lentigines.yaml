pathophysiology:
- name: Catalytically-Impaired SHP2 Phosphatase (Dominant-Negative)
  biological_scale: MOLECULAR
  description: >-
    The recurrent NSML PTPN11 missense variants map to the catalytic PTP domain
    and reduce SHP2 phosphatase activity, in contrast to the activating
    (gain-of-function) SHP2 alleles that cause Noonan syndrome. These
    catalytically-defective alleles act as dominant-negative mutations, so the
    molecular pathogenesis of LEOPARD syndrome and Noonan syndrome is distinct
    even though both are RASopathies.
  molecular_functions:
  - preferred_term: protein tyrosine phosphatase activity
    term:
      id: GO:0004725
      label: protein tyrosine phosphatase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16377799
    reference_title: "PTPN11 (Shp2) mutations in LEOPARD syndrome have dominant negative, not activating, effects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LS mutants are catalytically defective and act as dominant negative mutations that interfere with growth factor/Erk-mitogen-activated protein kinase-mediated signaling"
    explanation: >-
      Enzymologic and structural studies show NSML SHP2 mutants are
      catalytically defective dominant-negatives, opposite to the
      gain-of-function alleles of Noonan syndrome.
  - reference: PMID:16377799
    reference_title: "PTPN11 (Shp2) mutations in LEOPARD syndrome have dominant negative, not activating, effects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results establish that the pathogenesis of LS and NS is distinct"
    explanation: Establishes the mechanistic bifurcation between NSML and Noonan syndrome.
  downstream:
  - target: Dysregulated RAS-MAPK / ERK Signaling
    description: Catalytically-defective, dominant-negative SHP2 perturbs growth-factor-driven ERK-MAPK signaling.
  - target: mTOR Pathway Hyperactivation in Cardiomyocytes
    description: >-
      In cardiac tissue the mutant SHP2 shows enhanced binding to IRS1 and drives
      increased Akt/mTOR activity, a route parallel to (not downstream of) the
      abrogated cardiac ERK arm.
- name: RAF1/BRAF Kinase Gain-of-Function
  biological_scale: MOLECULAR
  description: >-
    In the RAF1 (LPRD2) and BRAF (LPRD3) arms, the pathogenic variants are
    activating kinase mutations, in contrast to the catalytically-impaired SHP2
    of the PTPN11 arm. This provides the RAF1/BRAF entry point into the shared
    RAS-MAPK/ERK mechanism, and the RAF1 HCM-hotspot alleles account for the
    strong hypertrophic cardiomyopathy association of that arm.
  molecular_functions:
  - preferred_term: protein kinase activity
    term:
      id: GO:0004672
      label: protein kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:17603483
    reference_title: "Gain-of-function RAF1 mutations cause Noonan and LEOPARD syndromes with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ectopically expressed RAF1 mutants from the two HCM hotspots had increased kinase activity and enhanced ERK"
    explanation: >-
      RAF1 HCM-hotspot mutants show increased kinase activity and enhanced ERK
      activation, the gain-of-function entry point for the RAF1/BRAF arms.
  downstream:
  - target: Dysregulated RAS-MAPK / ERK Signaling
    description: Activating RAF1/BRAF kinase mutations feed enhanced ERK-pathway output.
- name: Dysregulated RAS-MAPK / ERK Signaling
  biological_scale: CELLULAR
  description: >-
    NSML-causing variants across PTPN11, RAF1, and BRAF converge on abnormal
    RAS-MAPK (ERK1/2) pathway output, the unifying mechanism of the RASopathies.
    In PTPN11-NSML, the catalytically-dead but still-scaffolding SHP2 produces
    context-dependent, tissue-specific dysregulation rather than uniform loss of
    signaling.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16377799
    reference_title: "PTPN11 (Shp2) mutations in LEOPARD syndrome have dominant negative, not activating, effects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "interfere with growth factor/Erk-mitogen-activated protein kinase-mediated signaling"
    explanation: >-
      NSML SHP2 mutants interfere with growth-factor-evoked ERK-MAPK signaling;
      the direction is tissue-dependent (e.g., ERK/MAPK is abrogated in the
      NSML heart, whereas the RAF1/BRAF arms produce ERK gain of function).
  downstream:
  - target: Melanocytic Lentiginosis
    description: Dysregulated RAS-MAPK signaling in the melanocytic lineage is the presumed basis of lentiginosis.
- name: mTOR Pathway Hyperactivation in Cardiomyocytes
  biological_scale: CELLULAR
  description: >-
    In knock-in mouse models of the common Y279C NSML PTPN11 allele, cardiac
    tissue shows enhanced binding of SHP2 to IRS1, decreased SHP2 catalytic
    activity, and increased Akt and mTOR activity; enhanced mTOR activity is
    critical for the resulting hypertrophic cardiomyopathy and can be reversed by
    the mTOR inhibitor rapamycin.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:21339643
    reference_title: "Rapamycin reverses hypertrophic cardiomyopathy in a mouse model of LEOPARD syndrome-associated PTPN11 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "enhanced binding of Shp2 to Irs1, decreased Shp2 catalytic activity, and abrogated agonist-evoked Erk/Mapk signaling. LS/+ mice also exhibited increased basal and agonist-induced Akt and mTor activity"
    explanation: >-
      In LS/+ hearts, SHP2-IRS1 binding is enhanced and ERK/MAPK signaling is
      abrogated, while Akt and mTOR activity are increased — establishing the
      Akt/mTOR (not ERK) route to NSML cardiac hypertrophy.
  - reference: PMID:21339643
    reference_title: "Rapamycin reverses hypertrophic cardiomyopathy in a mouse model of LEOPARD syndrome-associated PTPN11 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cardiac defects in LS/+ mice were completely reversed by treatment with rapamycin, an inhibitor of mTOR"
    explanation: >-
      Identifies mTOR hyperactivation as the critical driver of NSML hypertrophic
      cardiomyopathy in a mouse model, reversible by mTOR inhibition.
  downstream:
  - target: Hypertrophic Cardiomyocyte Remodeling
    description: Sustained Akt/mTOR signaling drives the cardiomyocyte hypertrophic growth program.
- name: Hypertrophic Cardiomyocyte Remodeling
  biological_scale: TISSUE
  description: >-
    Aberrant developmental SHP2 signaling and downstream Akt/mTOR activity in
    cardiomyocytes and endocardium drives concentric hypertrophic cardiomyopathy,
    the hallmark that most distinguishes NSML from classic Noonan syndrome.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  evidence:
  - reference: PMID:21339643

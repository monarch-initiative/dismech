    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ptpn11(Y279C/+) (LS/+) mice recapitulated the human disorder, with short stature, craniofacial dysmorphia, and morphologic, histologic, echocardiographic, and molecular evidence of hypertrophic cardiomyopathy (HCM)"
    explanation: A knock-in mouse of the common NSML allele recapitulates hypertrophic cardiomyopathy.
  - reference: PMID:27348588

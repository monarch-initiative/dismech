    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis can be established in a proband with suggestive findings and a heterozygous pathogenic variant in one of four genes (BRAF, MAP2K1, PTPN11, and RAF1)"
    explanation: GeneReviews describes the molecular (four-gene panel) diagnostic strategy for NSML.

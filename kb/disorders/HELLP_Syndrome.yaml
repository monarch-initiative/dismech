    term:
      id: GO:0097284
      label: hepatocyte apoptotic process
    modifier: INCREASED
  - preferred_term: extrinsic apoptotic signaling pathway via death domain receptors
    term:
      id: GO:0008625
      label: extrinsic apoptotic signaling pathway via death domain receptors
    modifier: INCREASED
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental Fas Ligand damages hepatocytes, resulting in periportal necrosis."
    explanation: Supports the death-receptor route to periportal hepatocyte necrosis represented by this node.
  - reference: PMID:11924711
    reference_title: "Maternal death in pregnancy from HELLP syndrome. A report of three medico-legal autopsy cases with special reference to distinctive histopathological alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found an almost identical histopathological pattern in the liver (periportal coagulation necrosis"
    explanation: Autopsy evidence that periportal coagulation necrosis is the reproducible hepatic lesion of fatal HELLP.
  downstream:
  - target: Disseminated Intravascular Coagulation and Multiorgan Failure
    description: >
      Progressive hepatic failure contributes to the multiorgan decompensation of severe
      HELLP.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - shared_placental_antiangiogenic
    evidence:

clinical_burden:
  burden_level: HIGH
  rationale: >
    HELLP is a life-threatening obstetric emergency. It carries substantial maternal
    and perinatal morbidity and mortality, frequently forces iatrogenic preterm
    delivery, and in a French nationwide cohort conferred a stronger one-year risk of
    major adverse cardiovascular events, stroke, thromboembolism, and renal failure
    than isolated preeclampsia.
  evidence:
  - reference: PMID:15121574
    reference_title: "Diagnosis, controversies, and management of the syndrome of hemolysis, elevated liver enzymes, and low platelet count."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of this syndrome is associated with increased risk of adverse outcome for both mother and fetus."
    explanation: States the adverse maternal and fetal outcome risk that motivates the HIGH burden level.
  - reference: PMID:42502666
    reference_title: "Divergent Risk Factors and Outcomes in Hemolysis, Elevated Liver Enzymes, and Low Platelets Syndrome and Isolated Preeclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PE-HELLP was a significantly stronger risk of major adverse cardiovascular events (MACEs), stroke, thromboembolism, and RF than iPE."
    explanation: Quantitative population-scale evidence that HELLP carries excess short-term risk beyond isolated preeclampsia.
prevalence:
- population: Pregnancies, general obstetric population
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 500.0
  rate_high: 900.0
  notes: >-
    0.5-0.9% of all pregnancies, i.e. 500-900 per 100,000 pregnancies. Modeled as a
    period prevalence over the pregnancy episode rather than a population point
    prevalence, following the convention used on the Preeclampsia entry.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HELLP syndrome is a serious complication in pregnancy characterized by haemolysis, elevated liver enzymes and low platelet count occurring in 0.5 to 0.9% of all pregnancies and in 10-20% of cases with severe preeclampsia."
    explanation: Gives the 0.5-0.9% per-pregnancy occurrence figure asserted in this record.
- population: Pregnancies, general obstetric population (lower published estimate)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 200.0
  rate_high: 800.0
  notes: >-
    A second review reports a lower and wider band (0.2-0.8% of pregnancies). Both
    estimates are recorded rather than averaged, because the published range reflects
    genuinely different diagnostic thresholds (Tennessee vs Mississippi criteria,
    complete vs partial HELLP) rather than sampling noise.
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HELLP occurs in 0.2-0.8% of pregnancies and in 70-80% of cases it coexists with preeclampsia (PE)."
    explanation: Provides the alternative 0.2-0.8% occurrence estimate and the proportion coexisting with preeclampsia.
- population: Worldwide (pooled meta-analysis of nine studies, 133,611 participants)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 390.0
  rate_low: 160.0
  rate_high: 720.0
  notes: >-
    Pooled random-effects estimate of 0.39% (95% CI 0.16-0.72%), i.e. 390 per 100,000
    pregnancies. Recorded alongside, not instead of, the two review figures above: the
    meta-analysis is the most systematic estimate but rests on only nine studies, a
    limitation its own authors state explicitly, and it sits below both narrative-review
    bands. The point estimate and the whole confidence interval are nevertheless above
    1 in 1,000, so the class matches the two sibling records.
  evidence:
  - reference: PMID:41293035
    reference_title: "Global prevalence of preeclampsia, eclampsia, and HELLP syndrome: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the estimate for HELLP syndrome is 0.39% (95% CI: 0.16%-0.72%), which must be interpreted with considerable caution as it is derived from a limited pool of only nine studies"
    explanation: >
      Gives the pooled prevalence point estimate and interval, together with the authors'
      own caveat about the small study pool, which is why this record is added rather
      than allowed to supersede the review estimates.
  - reference: PMID:41293035
    reference_title: "Global prevalence of preeclampsia, eclampsia, and HELLP syndrome: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked regional disparities were identified, with higher prevalences in low-income countries."
    explanation: Documents that the pooled figure conceals substantial regional variation.
progression:
- phase: Antepartum onset
  age_range: Usually 27-37 weeks of gestation
  notes: >
    About 70% of cases present before delivery, with a peak between the 27th and 37th
    gestational weeks; onset is usually rapid and the syndrome characteristically
    exacerbates overnight.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 70% of the cases develop before delivery, the majority between the 27th and 37th gestational weeks; the remainder within 48 hours after delivery."
    explanation: Establishes the antepartum timing and its peak gestational window.
- phase: Postpartum onset
  age_range: Within 48 hours of delivery
  notes: >
    The remaining ~30% of cases declare themselves postpartum, typically within 48
    hours, most often in women who already had hypertension and proteinuria before
    delivery. Maternal surveillance is therefore continued for at least 48 hours after
    delivery.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 70% of the cases develop before delivery, the majority between the 27th and 37th gestational weeks; the remainder within 48 hours after delivery."
    explanation: The complement of the antepartum fraction defines the postpartum-onset window.
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Close surveillance of the mother should be continued for at least 48 hours after delivery."
    explanation: Supports the 48-hour postpartum surveillance window implied by this phase.
- phase: Subsequent pregnancies
  age_range: Later pregnancies after an index HELLP pregnancy
  notes: >
    After an index HELLP pregnancy the risk of obstetric complications in later
    pregnancies is high, but the risk of recurrent HELLP specifically is low (3-6%
    across two cohorts). This asymmetry is mechanistically informative: the shared
    placental susceptibility recurs far more readily than the full microangiopathic
    escalation.
  evidence:
  - reference: PMID:7847520
    reference_title: "Pregnancies complicated by HELLP syndrome (hemolysis, elevated liver enzymes, and low platelets): subsequent pregnancy outcome and long-term prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complications included preeclampsia (19%), preterm delivery (21%), intrauterine growth restriction (12%), abruptio placentae (2%), perinatal death (4%), and HELLP syndrome (3%)."
    explanation: Quantifies subsequent-pregnancy complication rates and the 3% HELLP recurrence rate in normotensive women.
  - reference: PMID:12824985
    reference_title: "Subsequent pregnancy outcome in women with a history of HELLP syndrome at < or = 28 weeks of gestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent hemolysis, elevated liver enzymes, and low platelet count syndrome developed in 4 of these pregnancies (6%)"
    explanation: Confirms a low (6%) HELLP recurrence rate even in the severe early-onset subgroup.
mechanistic_hypotheses:
- hypothesis_group_id: shared_placental_antiangiogenic
  hypothesis_label: Shared Placental Anti-Angiogenic Model with HELLP-Specific Amplification
  status: CANONICAL
  description: >
    HELLP shares its initiating placental lesion with preeclampsia: immune maladaptation
    at the maternal-fetal interface, defective trophoblast invasion, placental ischemia,
    and release of anti-angiogenic factors that injure the maternal endothelium. What is
    HELLP-specific under this model is not a different trigger but a quantitatively
    stronger downstream inflammatory and prothrombotic response, with soluble endoglin
    and Fas ligand rather than sFlt-1 carrying the differential signal, converting
    endothelial dysfunction into frank thrombotic microangiopathy.
  notes: >
    This entry deliberately does not duplicate the full preeclampsia pathograph; the
    shared trigger is represented by a single node and the mechanistic detail of
    trophoblast invasion failure and sFlt-1/VEGF signaling lives on the Preeclampsia
    entry. The evidence below supports amplification, not a distinct upstream cause.
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These factors trigger the vascular endothelium, resulting in an enhanced inflammatory response which is stronger in HELLP."
    explanation: States the core claim of this hypothesis - the same anti-angiogenic factors, a stronger downstream response in HELLP.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal blood levels of anti-angiogenic sFlt1 are similar, but endoglin and Fas Ligand levels are possibly higher in HELLP than in PE."
    explanation: >
      Supports the claim that the differential signal is carried by endoglin and Fas
      ligand rather than sFlt-1, but is marked PARTIAL because the review itself hedges
      ("possibly higher"), and this entry should not report that hedge as settled.
- hypothesis_group_id: complement_two_hit
  hypothesis_label: Alternative-Complement-Pathway Two-Hit Model
  status: EMERGING
  description: >
    On this model HELLP behaves like an aHUS-type complement-mediated thrombotic
    microangiopathy: a germline defect in alternative-pathway complement regulation
    provides the first hit, and pregnancy provides the second, permitting unrestrained
    terminal complement activation, C5b-9 deposition, and endothelial injury. Its
    strongest support is the enrichment of rare germline alternative-pathway variants
    and positive modified Ham testing in affected women, plus reported clinical response
    to C5 blockade.
  notes: >
    Recorded as EMERGING, not CANONICAL. The genetic evidence is a single case-control
    study (n small, 46% vs 8%), the mHam is a functional surrogate rather than a direct
    measure of in vivo complement-mediated injury, and the eculizumab evidence is case
    reports and small series - there is no randomized trial. The complement arm should
    not be curated as an established causal chain, and this is the reason the C5-blockade
    treatment on this entry is marked as investigational.
  evidence:
  - reference: PMID:29563339
    reference_title: "Germline mutations in the alternative pathway of complement predispose to HELLP syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly more participants with rare germline mutations in APC genes were present in the HELLP cohort compared with controls (46% versus 8%, P = 0.01)."
    explanation: The primary genetic observation on which the two-hit model rests.
  - reference: PMID:29563339
    reference_title: "Germline mutations in the alternative pathway of complement predispose to HELLP syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hypothesize that HELLP syndrome follows a 2-hit disease model similar to atypical hemolytic uremic syndrome (aHUS), requiring both genetic susceptibility and an environmental risk factor."
    explanation: States the two-hit framing directly, and its own wording ("We hypothesize") supports the EMERGING status assigned here.
- hypothesis_group_id: fetal_fao_defect_maternal_liver
  hypothesis_label: Fetal Fatty-Acid-Oxidation-Defect Model (subset of cases)
  status: ALTERNATIVE
  description: >
    In a distinct subset of pregnancies, maternal HELLP or acute fatty liver of pregnancy
    occurs in a heterozygous carrier mother gestating a fetus with a long-chain
    3-hydroxyacyl-CoA dehydrogenase (LCHAD) or mitochondrial trifunctional protein
    deficiency. The proposed mechanism is that 3-hydroxy long-chain acyl intermediates
    accumulating in the deficient fetoplacental unit are exported into the maternal
    circulation and are hepatotoxic to a mother whose own beta-oxidation capacity is
    reduced by heterozygosity and by the metabolic demands of late pregnancy.
  notes: >
    Applies only to a small subset and is genotype-dependent - the association tracked
    the common HADHA Glu474Gln (E474Q) allele and was absent in children with complete
    trifunctional protein deficiency. The metabolite-export mechanism itself is inferred,
    not directly demonstrated in the cited study, which establishes the genetic
    association. The corresponding fatty-acid-oxidation disorder entries
    (Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency,
    Mitochondrial_Trifunctional_Protein_Deficiency,
    Carnitine_Palmitoyltransferase_1A_Deficiency) already record this relationship from
    the fetal side and were deliberately not modified by this entry.
  evidence:
  - reference: PMID:10352164
    reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While carrying fetuses with the Glu474Gln mutation, 79 percent of the heterozygous mothers had fatty liver of pregnancy or the HELLP syndrome."
    explanation: The quantitative genotype-association result that grounds this alternative model.
  - reference: PMID:10352164
    reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Five other children, who presented with neonatal dilated cardiomyopathy or progressive neuromyopathy, had complete deficiency of the trifunctional protein (loss of activity of all three enzymes). None had the Glu474Gln mutation, and none of their mothers had liver disease during pregnancy."
    explanation: >
      Bounds the model: the maternal association is allele-specific and did not extend to
      complete trifunctional protein deficiency, so this is a subset mechanism rather
      than a general one.
pathophysiology:
- name: Placental Ischemia and Anti-Angiogenic Factor Release
  description: >
    The initiating lesion is shared with preeclampsia: immune maladaptation toward the
    invading trophoblast, defective spiral-artery remodeling, and placental malperfusion,
    followed by release of anti-angiogenic factors (sFlt-1, soluble endoglin) together
    with placental necrotic debris and cell-free DNA into the maternal circulation. This
    node is deliberately compressed - the trophoblast-invasion and sFlt-1/VEGF detail is
    curated on the Preeclampsia entry and is not re-derived here. What matters for HELLP
    is that the placental output includes an inflammatory as well as an anti-angiogenic
    component.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  biological_processes:
  - preferred_term: angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DECREASED
  - preferred_term: vascular endothelial growth factor receptor signaling pathway
    term:
      id: GO:0048010
      label: vascular endothelial growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunological maladaptation is the most probable trigger of the insult to the invading trophoblast."
    explanation: Establishes the shared upstream trophoblast insult as the probable trigger in HELLP.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-angiogenic factors released into maternal blood induce the maternal syndromes."
    explanation: Links the placental lesion to release of anti-angiogenic factors as the effector output of this node.
  - reference: PMID:31877439
    reference_title: "The role of hepatic sinusoidal obstruction in the pathogenesis of the hepatic involvement in HELLP syndrome: Exploring the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The placenta releases, besides anti-angiogenetic factors, also necrotic debris and cell-free DNA, a mixture that not only induces systemic endothelial dysfunction as in preeclampsia, but also a systemic inflammatory response."
    explanation: Supports the HELLP-specific addition to this node - a co-released inflammatory component beyond the anti-angiogenic factors.
  downstream:
  - target: Maternal Endothelial Injury and Systemic Inflammatory Amplification
    description: >
      Circulating anti-angiogenic factors plus placental debris injure and activate the
      maternal endothelium and provoke a systemic inflammatory response.
    causal_link_type: DIRECT
    hypothesis_groups:
    - shared_placental_antiangiogenic
    evidence:
    - reference: PMID:31877439
      reference_title: "The role of hepatic sinusoidal obstruction in the pathogenesis of the hepatic involvement in HELLP syndrome: Exploring the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The dysfunctional placenta in women developing HELLP initiates a cascade of events that eventually results in liver dysfunction."
      explanation: Asserts the causal direction from placental dysfunction to the downstream maternal cascade.
- name: Alternative Complement Pathway Dysregulation
  description: >
    In a substantial subset of women, rare germline variants in alternative-pathway
    complement genes reduce complement regulation, and pregnancy acts as the second hit
    permitting unrestrained terminal-pathway activation. Placental C5b-9 deposition is
    increased, and C5b-9 in turn stimulates trophoblast sFlt-1 secretion, so this arm
    both parallels and feeds back onto the anti-angiogenic node above. This node is
    modeled as a parallel, hypothesis-scoped trigger rather than part of the canonical
    chain.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    term:
      id: GO:0006957
      label: "complement activation, alternative pathway"
    modifier: INCREASED
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29563339
    reference_title: "Germline mutations in the alternative pathway of complement predispose to HELLP syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HELLP syndrome is characterized by both activation of the APC and frequent germline mutations in APC genes."
    explanation: Directly supports both components of this node - functional alternative-pathway activation and germline predisposing variants.
  - reference: PMID:32986992
    reference_title: "Complement activation and regulation in preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In women who develop preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome, there is a shift toward increased complement activation and decreased complement regulation."
    explanation: Independent review support for loss of complement regulation as a feature of HELLP.
  downstream:
  - target: Placental Ischemia and Anti-Angiogenic Factor Release
    description: >
      Placental C5b-9 deposition stimulates trophoblasts to secrete sFlt-1, feeding the
      anti-angiogenic node; complement dysregulation is therefore upstream of, not merely
      parallel to, the anti-angiogenic output.
    causal_link_type: DIRECT
    hypothesis_groups:
    - complement_two_hit
    evidence:
    - reference: PMID:32986992
      reference_title: "Complement activation and regulation in preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "C5b-9 deposition stimulates trophoblasts to secrete soluble fms-like tyrosine kinase-1, which sequesters vascular endothelial growth factor and placental growth factor."
      explanation: Mechanistic link from terminal complement deposition to sFlt-1 release and VEGF/PlGF sequestration.
  - target: Maternal Endothelial Injury and Systemic Inflammatory Amplification
    description: >
      Unrestrained terminal complement activation injures the maternal endothelium
      directly, in the manner of aHUS.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - complement_two_hit
    evidence:
    - reference: PMID:29563339
      reference_title: "Germline mutations in the alternative pathway of complement predispose to HELLP syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Similar to aHUS, treatment via complement inhibition to mitigate maternal and fetal morbidity and mortality may be possible."
      explanation: >
        The authors' framing of HELLP as an aHUS-like complement-mediated microangiopathy
        implies complement-driven endothelial injury; the hedged wording is why this edge
        is scoped to the EMERGING complement hypothesis group.
- name: Fetal Long-Chain Fatty-Acid Oxidation Defect
  description: >
    In a small, genotype-defined subset, the fetus is homozygous or compound
    heterozygous for a long-chain 3-hydroxyacyl-CoA dehydrogenase (LCHAD) deficiency
    allele, classically HADHA Glu474Gln, while the mother is an obligate heterozygote.
    Accumulating 3-hydroxy long-chain acyl intermediates in the fetoplacental unit are
    proposed to reach the maternal circulation and injure a maternal liver whose own
    beta-oxidation reserve is reduced. The genetic association is well established; the
    metabolite-transfer step is inferred rather than directly measured.
  role: trigger
  genes:
  - preferred_term: HADHA
    term:
      id: hgnc:4801
      label: HADHA
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:10352164
    reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute fatty liver of pregnancy and the HELLP syndrome (hemolysis, elevated liver-enzyme levels, and a low platelet count) are serious hepatic disorders that may occur during pregnancy in women whose fetuses are later found to have a deficiency of long-chain 3-hydroxyacyl-coenzyme A (CoA) dehydrogenase."
    explanation: Establishes the fetal-genotype-to-maternal-liver-disease association that defines this node.
  downstream:
  - target: Periportal Hepatocyte Necrosis and Hepatic Injury
    description: >
      In this subset the maternal hepatic injury tracks the fetal LCHAD genotype rather
      than following from the microangiopathic chain. The edge is scoped to the
      alternative hypothesis group and the intervening metabolite transfer is not
      directly evidenced.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetal_fao_defect_maternal_liver
    evidence:
    - reference: PMID:10352164
      reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While carrying fetuses with the Glu474Gln mutation, 79 percent of the heterozygous mothers had fatty liver of pregnancy or the HELLP syndrome."
      explanation: Quantifies the fetal-genotype-conditioned maternal hepatic disease risk that this edge asserts.
- name: Maternal Endothelial Injury and Systemic Inflammatory Amplification
  description: >
    Circulating placental factors activate and injure the maternal vascular endothelium
    and provoke a systemic inflammatory response with activated leukocytes, inflammatory
    cytokines, and active von Willebrand factor. In HELLP this inflammatory amplification
    is stronger than in preeclampsia, and it is the step at which the shared preeclamptic
    endothelial dysfunction is converted into an overtly prothrombotic microvascular
    state.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    term:
      id: GO:0042118
      label: endothelial cell activation
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These factors trigger the vascular endothelium, resulting in an enhanced inflammatory response which is stronger in HELLP."
    explanation: Directly supports endothelial triggering plus the HELLP-specific amplification asserted by this node.
  - reference: PMID:31877439
    reference_title: "The role of hepatic sinusoidal obstruction in the pathogenesis of the hepatic involvement in HELLP syndrome: Exploring the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter aggravates the endothelio-toxic effects in the systemic cardiovascular bed, amplifying the already increased pro-thrombotic conditions."
    explanation: Supports the conversion of endothelial injury into a systemic prothrombotic state, the defining output of this node.
  downstream:
  - target: Platelet Activation and Consumptive Thrombocytopenia
    description: >
      Endothelial injury with released active von Willebrand factor drives platelet
      adhesion, activation, and aggregation in the microvasculature.
    causal_link_type: DIRECT
    hypothesis_groups:
    - shared_placental_antiangiogenic
    - complement_two_hit
    evidence:
    - reference: PMID:23107053
      reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."

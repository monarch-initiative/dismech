- name: Microangiopathic Erythrocyte Fragmentation and Destruction
  description: >
    Erythrocytes are mechanically fragmented as they are forced across partly occluded
    microvessels, producing schistocytes on the peripheral smear, intravascular hemolysis
    with raised LDH and indirect bilirubin, and consumed haptoglobin. This is the "H" of
    HELLP and is the extrinsic, mechanical arm of the conserved hemolytic-anemia
    destruction pathway - the erythrocyte itself is normal, the insult is the vessel.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The angiopathy results in consumption of circulating platelets, causes hemolysis in affected microvessels and reduces portal blood flow in the liver."
    explanation: >
      Establishes that erythrocyte destruction in HELLP occurs within the affected
      microvessels, i.e. is mechanical and microangiopathic, which is the specialization
      this node makes on the generic hemolytic-anemia destruction node.
  - reference: PMID:15121574
    reference_title: "Diagnosis, controversies, and management of the syndrome of hemolysis, elevated liver enzymes, and low platelet count."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of HELLP syndrome requires the presence of hemolysis based on examination of the peripheral smear, elevated indirect bilirubin levels, or low serum haptoglobin levels"
    explanation: Supports the laboratory signature of intravascular erythrocyte destruction named in this node.
- name: Hepatic Sinusoidal Microthrombosis and Fibrin Deposition
  description: >
    The uniquely low shear of the hepatic sinusoids makes them the preferential site for
    microthrombus formation and fibrin deposition, producing a sinusoidal obstruction
    physiologically analogous to sinusoidal obstruction syndrome, with reduced portal
    inflow and sinusoidal ischemia. This is the hepatic, site-selective step that
    converts a systemic microangiopathy into the liver-dominant clinical picture of
    HELLP.
  role: effector
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"

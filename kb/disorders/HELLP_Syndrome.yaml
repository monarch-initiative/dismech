name: HELLP Syndrome
creation_date: "2026-08-18T00:00:00Z"
category: Complex
synonyms:
- Hemolysis, elevated liver enzymes, and low platelet count syndrome
- HELLP
- Hemolysis-elevated liver enzymes-low platelet count syndrome
description: >
  HELLP syndrome is a severe, pregnancy-specific thrombotic microangiopathy defined by
  the laboratory triad of hemolysis, elevated liver enzymes, and a low platelet count.
  It complicates roughly 0.2-1% of pregnancies and coexists with preeclampsia in the
  large majority of cases, arising most often between 27 and 37 weeks of gestation or
  within 48 hours postpartum. HELLP shares its proximal placental pathology with
  preeclampsia - defective trophoblast invasion and spiral artery remodeling, placental
  ischemia, and release of anti-angiogenic factors (sFlt-1, soluble endoglin) that
  injure the maternal endothelium - and this entry deliberately does not re-derive that
  shared upstream chain, which is curated on the Preeclampsia entry. What distinguishes
  HELLP is the downstream microangiopathic arm: a stronger systemic inflammatory and
  prothrombotic response produces platelet-fibrin microthrombi, mechanical erythrocyte
  fragmentation, consumptive thrombocytopenia, and - in the uniquely low-shear hepatic
  sinusoids - sinusoidal obstruction with periportal hepatocyte necrosis. A subset of
  cases carries germline alternative-complement-pathway variants, and a small subset is
  associated with a fetal long-chain fatty-acid oxidation defect. The only definitive
  treatment is delivery of the fetus and placenta.

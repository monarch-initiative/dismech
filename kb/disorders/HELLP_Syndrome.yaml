histopathology:
- name: Periportal hepatic coagulation necrosis
  finding_term:
    preferred_term: Periportal hepatic coagulative necrosis
    term:
      id: NCIT:C39608
      label: Coagulative Necrosis
  description: >
    Coagulative necrosis in a periportal distribution, with intrahepatic hemorrhages
    demarcated by an extended fibrin network, focal sinusoidal leukostasis, and Kupffer
    cell swelling. Notably there is no inflammatory infiltrate in the liver plates and no
    fatty change - the latter is the key histological discriminator from acute fatty
    liver of pregnancy.
  diagnostic: true
  evidence:
  - reference: PMID:11924711
    reference_title: "Maternal death in pregnancy from HELLP syndrome. A report of three medico-legal autopsy cases with special reference to distinctive histopathological alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found an almost identical histopathological pattern in the liver (periportal coagulation necrosis, hepatic haemorrhages sharply demarcated by an extended fibrin network from the surrounding unaffected liver parenchyma, focal leukostasis in liver sinusoids and swelling of Kupffer's cells, absence of inflammatory cellular infiltrates in liver plates, lack of fatty transformation of hepatocytes)"
    explanation: >
      Full description of the reproducible hepatic lesion across three fatal cases,
      including the absence of fatty change that separates HELLP from acute fatty liver
      of pregnancy.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental Fas Ligand damages hepatocytes, resulting in periportal necrosis."
    explanation: Independent statement that periportal necrosis is the characteristic hepatic lesion of HELLP.
- name: Glomerular endothelial swelling with bloodless glomeruli
  description: >
    The renal lesion in fatal HELLP: bloodless glomeruli with swollen, vacuolated
    intracapillary cells, cigar-shaped capillary loops, enlarged tufts herniating into the
    proximal convoluted tubule, and mesangial cell swelling. This is a renal thrombotic
    microangiopathy pattern rather than an inflammatory glomerulonephritis.
  notes: >
    Deliberately left without a `finding_term`. The composite lesion quoted here has no
    adequate counterpart in the available pathology vocabularies - the nearest candidates
    name either a generic thrombotic microangiopathy or a single component (endothelial
    swelling) and would drop the bloodless-glomerulus and capillary-loop-herniation
    features that make the description diagnostic. No term beats a bad one; this absence
    is a curation decision, not an oversight.
  evidence:
  - reference: PMID:11924711
    reference_title: "Maternal death in pregnancy from HELLP syndrome. A report of three medico-legal autopsy cases with special reference to distinctive histopathological alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "kidneys (bloodless glomeruli with swollen and vacuolated intracapillary cells, cigar-shaped capillary loops, enlarged glomerular tufts with herniation of capillary loops into the proximal convoluted tubules, swelling of mesangial cells)"
    explanation: Describes the reproducible renal histopathology observed in fatal HELLP.
biochemical:
- name: Serum lactate dehydrogenase
  notes: >
    Elevated above 600 U/L in both the Tennessee and Mississippi criteria. LDH is
    released by both lysed erythrocytes and necrotic hepatocytes, so it indexes two of
    the three components of the triad at once and is not specific to either.
  presence: INCREASED
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Tennessee Classification System diagnostic criteria for HELLP are haemolysis with increased LDH (> 600 U/L), AST (>or= 70 U/L), and platelets < 100 x 10(9)/L."
    explanation: Gives the diagnostic LDH threshold used in this record.
- name: Serum aspartate aminotransferase
  notes: AST at or above 70 IU/L in both classification systems.
  presence: INCREASED
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Tennessee Classification System diagnostic criteria for HELLP are haemolysis with increased LDH (> 600 U/L), AST (>or= 70 U/L), and platelets < 100 x 10(9)/L."
    explanation: Gives the diagnostic AST threshold used in this record.
- name: Platelet count
  notes: >
    Below 100 x 10^9/L for diagnosis; the nadir at any point in the illness grades
    Mississippi class (class 1 at or below 50, class 2 between 50 and 100, class 3 between
    100 and 150).
  presence: DECREASED
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Mississippi Triple-class HELLP System further classifies the disorder by the nadir platelet counts."
    explanation: Supports the use of platelet nadir as the severity axis described here.
- name: Serum haptoglobin
  notes: Consumed by free hemoglobin; a low level documents intravascular hemolysis.
  presence: DECREASED
  evidence:
  - reference: PMID:15121574
    reference_title: "Diagnosis, controversies, and management of the syndrome of hemolysis, elevated liver enzymes, and low platelet count."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "or low serum haptoglobin levels in association with significant elevation in liver enzymes"
    explanation: Names low haptoglobin as an accepted marker of the required hemolysis.
- name: Soluble endoglin
  notes: >
    An anti-angiogenic placental factor. Circulating levels are raised in HELLP and
    perform comparably to the sFlt-1/PlGF ratio for detection, and one review suggests
    endoglin - unlike sFlt-1 - may run higher in HELLP than in preeclampsia. That
    HELLP-versus-preeclampsia differential is reported with hedging and is treated here
    as suggestive rather than established.
  presence: INCREASED
  evidence:
  - reference: PMID:35475405
    reference_title: "Soluble endoglin versus sFlt-1/PlGF ratio: detection of preeclampsia, HELLP syndrome, and FGR in a high-risk cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Higher levels were observed in HELLP syndrome and EOPE cases."
    explanation: Direct observation of raised sFlt-1/PlGF and soluble endoglin in HELLP cases.
  - reference: PMID:35475405
    reference_title: "Soluble endoglin versus sFlt-1/PlGF ratio: detection of preeclampsia, HELLP syndrome, and FGR in a high-risk cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "0.895 (95%-Cl 0.83-0.96) and 0.878 (95%-Cl 0.81-0.95) in HELLP syndrome"
    explanation: Quantifies detection performance of the sFlt-1/PlGF ratio and soluble endoglin for HELLP.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal blood levels of anti-angiogenic sFlt1 are similar, but endoglin and Fas Ligand levels are possibly higher in HELLP than in PE."
    explanation: >
      Supports the HELLP-versus-preeclampsia differential for endoglin, but is marked
      PARTIAL because the source itself hedges with "possibly".
genetic:
- name: Alternative complement pathway genes
  notes: >
    Rare germline variants in alternative-pathway complement genes are enriched in women
    with HELLP relative to healthy pregnant controls (46% vs 8%), consistent with a
    susceptibility rather than a Mendelian causal role. HELLP is not a monogenic disorder;
    no single genetic cause has been identified.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:29563339
    reference_title: "Germline mutations in the alternative pathway of complement predispose to HELLP syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly more participants with rare germline mutations in APC genes were present in the HELLP cohort compared with controls (46% versus 8%, P = 0.01)."
    explanation: The case-control enrichment that grounds a SUSCEPTIBILITY rather than causal classification.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No single world-wide genetic cause for excessive risk of HELLP or PE has been identified."
    explanation: Explicitly rules out a monogenic architecture, supporting the polygenic/susceptibility framing.
- name: HADHA (fetal genotype)
  gene_term:
    preferred_term: HADHA
    term:
      id: hgnc:4801
      label: HADHA
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:10352164
    reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While carrying fetuses with the Glu474Gln mutation, 79 percent of the heterozygous mothers had fatty liver of pregnancy or the HELLP syndrome."
    explanation: The fetal-genotype-conditioned maternal risk that defines this entry.
  notes: >
    A distinctive genetic association in which the relevant genotype is the FETUS's, not
    the mother's: maternal HELLP or acute fatty liver of pregnancy is strongly associated
    with gestating a fetus homozygous or compound heterozygous for the HADHA Glu474Gln
    LCHAD-deficiency allele, the mother being an obligate heterozygote. Recorded here as
    a modifier of maternal risk rather than as a cause of HELLP in general.

    Curated only as a cross-reference from the maternal side. The corresponding fetal
    disorders are curated separately in
    Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency,
    Mitochondrial_Trifunctional_Protein_Deficiency, and
    Carnitine_Palmitoyltransferase_1A_Deficiency, none of which were modified by this
    entry.
definitions:
- name: Tennessee Classification System for HELLP syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    Sibai's strict laboratory criteria for "true" or "complete" HELLP syndrome. All three
    components must be present; cases meeting only one or two are termed partial or
    incomplete HELLP (and, where hemolysis is absent, ELLP).
  scope: >
    Diagnostic case definition for complete HELLP syndrome; the more widely used of the
    two systems for establishing whether a case is HELLP at all.
  criteria_sets:
  - name: Tennessee complete-HELLP criteria
    description: >
      All three laboratory criteria required for complete HELLP syndrome.
    inclusion_criteria:
    - preferred_term: Hemolysis
      description: >
        Intravascular hemolysis, evidenced by an abnormal peripheral blood smear, raised
        serum bilirubin (>= 20.5 micromol/L or >= 1.2 mg/100 mL), and LDH > 600 U/L.
    - preferred_term: Elevated liver enzymes
      description: AST >= 70 IU/L.
    - preferred_term: Low platelet count
      description: Platelets <= 100 x 10^9/L.
    evidence:
    - reference: PMID:19245695
      reference_title: "The HELLP syndrome: clinical issues and management. A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the Tennessee Classification System diagnostic criteria for HELLP are haemolysis with increased LDH (> 600 U/L), AST (>or= 70 U/L), and platelets < 100 x 10(9)/L."
      explanation: Source for all three thresholds transcribed into this criteria set.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Tennessee Classification System diagnostic criteria for HELLP are haemolysis with increased LDH (> 600 U/L), AST (>or= 70 U/L), and platelets < 100 x 10(9)/L."
    explanation: States the three Tennessee thresholds transcribed into this criteria set.
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravascular haemolysis is diagnosed by abnormal peripheral blood smear, increased serum bilirubin"
    explanation: Specifies how the hemolysis component of the Tennessee criteria is established.
  notes: >
    The published Tennessee platelet criterion is written as "< 100" in the review's prose
    and "<= 100" in its Table 1; the criteria set records the table form. This is a real
    inconsistency in the source, not a transcription error.
- name: Mississippi Triple-Class HELLP System
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    Martin's severity grading, which stratifies HELLP by the platelet nadir reached at any
    point in the illness rather than by presenting values. Class 1 and 2 additionally
    require LDH > 600 U/L and AST or ALT >= 70 IU/L; class 3 relaxes the transaminase
    threshold to >= 40 IU/L and is regarded as a clinically significant transition phase
    capable of progressing. Unlike the Tennessee system this is a severity axis, not an
    inclusion test - the two answer different questions and should not be conflated.
  scope: >
    Severity classification of established HELLP syndrome, used to guide the intensity of
    surveillance and intervention.
  criteria_sets:
  - name: Mississippi class 1 (severe)
    description: Platelet nadir <= 50 x 10^9/L, with AST or ALT >= 70 IU/L and LDH >= 600 IU/L.
    evidence:
    - reference: PMID:19245695
      reference_title: "The HELLP syndrome: clinical issues and management. A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The Mississippi Triple-class HELLP System further classifies the disorder by the nadir platelet counts."
      explanation: Source for grading Mississippi class on the platelet nadir.
  - name: Mississippi class 2 (moderate)
    description: Platelet nadir > 50 and <= 100 x 10^9/L, with AST or ALT >= 70 IU/L and LDH >= 600 IU/L.
    evidence:
    - reference: PMID:19245695
      reference_title: "The HELLP syndrome: clinical issues and management. A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Class 1 and class 2 are associated with haemolysis (LDH > 600 U/L) and elevated AST ( ≥ 70 U/L) concentration"
      explanation: >-
        Source for the shared class 1 and class 2 haemolysis and transaminase
        requirements; the class boundary itself is the platelet nadir.
  - name: Mississippi class 3 (mild / transition phase)
    description: >
      Platelet nadir > 100 and <= 150 x 10^9/L, with LDH > 600 U/L and AST >= 40 IU/L.
      Considered a transition stage capable of progression rather than a benign category.
    evidence:
    - reference: PMID:19245695
      reference_title: "The HELLP syndrome: clinical issues and management. A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "class 3 requires only LDH > 600 U/L and AST ≥ 40 U/L in addition to the specific PLT count"
      explanation: Source for the relaxed class-3 transaminase threshold recorded here.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Mississippi Triple-class HELLP System further classifies the disorder by the nadir platelet counts."
    explanation: Establishes that the Mississippi system grades severity on the platelet nadir.
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "class 3 requires only LDH > 600 U/L and AST ≥ 40 U/L in addition to the specific PLT count"
    explanation: Supports the relaxed class-3 transaminase threshold recorded in this criteria set.
  notes: >
    Because the two systems use different platelet thresholds and different transaminase
    cut-offs, published HELLP series are not directly comparable unless the classification
    used is stated - a point the source review makes explicitly about the difficulty of
    comparing the literature.
treatments:
- name: Delivery of the fetus and placenta
  description: >
    The only definitive treatment. Removing the placenta removes the source of the
    anti-angiogenic and inflammatory drive, and the syndrome resolves. Delivery is
    indicated once the 34th gestational week is reached, or at any gestation if maternal
    or fetal condition deteriorates; before 34 weeks a short expectant interval may be
    taken to complete fetal lung maturation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Induction of Labor
    term:
      id: NCIT:C92814
      label: Induction of Labor
  target_mechanisms:
  - target: Placental Ischemia and Anti-Angiogenic Factor Release
    treatment_effect: INHIBITS
    description: >
      Delivery of the placenta physically removes the organ generating the
      anti-angiogenic and inflammatory output that drives the entire cascade.
    evidence:
    - reference: PMID:19245695
      reference_title: "The HELLP syndrome: clinical issues and management. A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Delivery is indicated if the HELLP syndrome occurs after the 34th gestational week or the foetal and/or maternal conditions deteriorate."
      explanation: Establishes delivery as the intervention of record and states its timing indication.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaginal delivery is preferable. If the cervix is unfavourable, it is reasonable to induce cervical ripening and then labour."
    explanation: Supports induction of labour with vaginal delivery as the preferred route.
- name: Cesarean delivery
  description: >
    Used when vaginal delivery is not feasible or maternal or fetal deterioration demands
    immediate delivery. Recorded separately from induction because the two are different
    procedures with different risk profiles in a thrombocytopenic patient.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cesarean Section
    term:
      id: NCIT:C46088
      label: Cesarean Section
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaginal delivery is preferable. If the cervix is unfavourable, it is reasonable to induce cervical ripening and then labour."
    explanation: >
      Supports cesarean as the non-preferred alternative route. Marked PARTIAL because the
      quoted guidance states the preference for vaginal delivery rather than the
      indications for cesarean.
- name: Antenatal corticosteroid therapy
  description: >
    Betamethasone or dexamethasone, given between 24 and 34 weeks primarily for fetal lung
    maturation. Its value for the maternal syndrome is a genuine controversy and this
    entry does not resolve it: a Cochrane review of 11 trials found improved platelet
    counts (dexamethasone more than betamethasone) but no clear effect on maternal death,
    severe maternal morbidity, or perinatal death, and concluded there is insufficient
    evidence for routine use.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: betamethasone
      term:
        id: CHEBI:3077
        label: betamethasone
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:20824872
    reference_title: "Corticosteroids for HELLP (hemolysis, elevated liver enzymes, low platelets) syndrome in pregnancy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The only clear effect of treatment on individual outcomes was improved platelet count (standardized mean difference (SMD) 0.67, 95% CI 0.24 to 1.10)."
    explanation: >
      Quantifies the one demonstrated maternal effect - a platelet-count improvement -
      and, by naming it as the only clear effect, is PARTIAL support for corticosteroids
      as a treatment of the maternal syndrome.
  - reference: PMID:20824872
    reference_title: "Corticosteroids for HELLP (hemolysis, elevated liver enzymes, low platelets) syndrome in pregnancy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There is to date insufficient evidence of benefits in terms of substantive clinical outcomes to support the routine use of steroids for the management of HELLP."
    explanation: >
      Refutes routine corticosteroid use for the maternal syndrome. Retained deliberately
      alongside the supporting item so the entry records the controversy rather than
      picking a side.
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard corticosteroid treatment is, however, of uncertain clinical value in the maternal HELLP syndrome."
    explanation: Independent review agreement that the maternal benefit is uncertain, while fetal lung maturation remains the accepted indication.
  notes: >
    The fetal-lung-maturation indication (a single course between 24 and 34 weeks) is not
    in dispute; what the Cochrane review questions is corticosteroid treatment of the
    maternal syndrome itself. High-dose and repeated courses should be avoided.
- name: Magnesium sulfate seizure prophylaxis
  description: >
    Given to prevent eclamptic seizures, which complicate 4-9% of HELLP pregnancies.
    Prophylaxis is standard in HELLP even when hypertension is mild or absent, because
    seizure risk does not track blood pressure in this syndrome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  target_phenotypes:
  - preferred_term: Eclamptic seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:42502666
    reference_title: "Divergent Risk Factors and Outcomes in Hemolysis, Elevated Liver Enzymes, and Low Platelets Syndrome and Isolated Preeclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among women who had PE-HELLP, 10.5% had gestational diabetes, 45.1% had an early PE, 6.5% had an eclampsia"
    explanation: >
      Quantifies the eclampsia risk that seizure prophylaxis addresses: 6.5% of women with
      PE-HELLP had an eclampsia in a nationwide cohort.
  notes: >
    The magnitude of magnesium sulfate's benefit is established in severe preeclampsia
    broadly rather than in HELLP-specific randomized trials; no HELLP-restricted trial
    evidence is cited here, and none should be implied.
- name: Antihypertensive therapy
  description: >
    Blood pressure control targeting below 155/105 mmHg, to reduce the risk of maternal
    stroke and abruption while the definitive intervention is arranged.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antihypertensive Therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
  target_phenotypes:
  - preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood pressure should be kept below 155/105 mmHg."
    explanation: States the blood-pressure target this treatment implements.
- name: Platelet transfusion
  description: >
    Reserved for active bleeding or the most severe (Mississippi class 1) disease around
    delivery. Because the thrombocytopenia is consumptive, transfusion corrects the count
    only transiently and is not used to normalize a number.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Platelet Transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a recent study of women with class 1 HELLP syndrome adding of platelet transfusion to standard CS administration did not increase the recovery rate"
    explanation: >
      The review discusses platelet transfusion specifically in the context of class 1
      HELLP, supporting the restricted indication recorded here.
- name: Terminal complement (C5) blockade with eculizumab
  description: >
    INVESTIGATIONAL. A monoclonal antibody against complement C5, used off-label in
    reported cases of severe early preeclampsia/HELLP on the rationale that HELLP is an
    aHUS-like complement-mediated microangiopathy. In one reported case at 26 weeks it
    produced marked clinical improvement, normalized laboratory parameters, and prolonged
    pregnancy by 17 days. There is no randomized trial evidence, and this entry records
    it as an open question rather than as standard care.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
  target_mechanisms:
  - target: Alternative Complement Pathway Dysregulation
    treatment_effect: INHIBITS
    description: >
      Blockade of C5 prevents formation of the terminal C5b-9 complex, the effector of the
      complement arm modeled by this node.
    evidence:
    - reference: PMID:32986992
      reference_title: "Complement activation and regulation in preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that the inhibition of the terminal complement pathway, possibly through C5 blockade, may be an effective strategy to treat preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome, but this strategy warrants further evaluation in clinical trials."
      explanation: >
        Supports the mechanistic rationale for C5 blockade while explicitly stating that
        clinical-trial evaluation is still required, which is why this link is PARTIAL.
  evidence:
  - reference: PMID:23228435
    reference_title: "Eculizumab for the treatment of preeclampsia/HELLP syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient presenting with severe preeclampsia/HELLP syndrome at 26 weeks gestation that was treated with Eculizumab, a targeted inhibitor of complement protein C5, which resulted in marked clinical improvement and complete normalization of lab parameters."
    explanation: >
      A single-patient report of clinical and laboratory response. Marked PARTIAL because
      an uncontrolled n-of-1 observation in a self-limiting-on-delivery condition cannot
      establish efficacy.
  notes: >
    Deliberately not curated as an established treatment. See the KNOWLEDGE_GAP discussion
    on the complement arm.
differential_diagnoses:
- name: Acute fatty liver of pregnancy
  description: >
    The closest mimic. Clinical and biochemical features overlap substantially, and AFLP
    shares the fetal fatty-acid-oxidation-defect association. The histological
    discriminator is decisive when tissue is available: HELLP shows periportal coagulation
    necrosis with no fatty transformation of hepatocytes, whereas AFLP is defined by
    microvesicular steatosis.
  distinguishing_features:
  - AFLP typically shows hypoglycemia, marked coagulopathy, and hyperammonemia out of proportion to the transaminase rise.
  - Hypertension and proteinuria are usually absent in AFLP but usually present in HELLP.
  - Liver histology shows fatty transformation in AFLP and its explicit absence in HELLP.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical signs of AFLP vary and there is significant overlap in clinical and biochemical features"
    explanation: Establishes the substantial clinical and biochemical overlap that makes AFLP the principal differential.
  - reference: PMID:11924711
    reference_title: "Maternal death in pregnancy from HELLP syndrome. A report of three medico-legal autopsy cases with special reference to distinctive histopathological alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lack of fatty transformation of hepatocytes"
    explanation: The histological feature that separates HELLP from acute fatty liver of pregnancy.
- name: Thrombotic thrombocytopenic purpura
  description: >
    Shares microangiopathic hemolysis and thrombocytopenia. TTP is driven by ADAMTS13
    deficiency and VWF-platelet aggregation, a mechanistically distinct microangiopathy
    that does not resolve with delivery and requires plasma exchange.
  distinguishing_features:
  - Prominent neurologic involvement and severe ADAMTS13 deficiency favor TTP.
  - Failure to improve after delivery argues strongly against HELLP.
  disease_term:
    preferred_term: thrombotic thrombocytopenic purpura
    term:
      id: MONDO:0018896
      label: thrombotic thrombocytopenic purpura
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haemolytic uremic syndrome (HUS), thrombotic thrombocytopenic purpura (TTP)"
    explanation: Names TTP among the serious conditions that mimic HELLP and require different therapy.
- name: Hemolytic uremic syndrome
  description: >
    Also a thrombotic microangiopathy; pregnancy-associated atypical HUS is
    complement-mediated and may be genuinely difficult to separate from HELLP, especially
    since a complement arm is proposed for HELLP itself. Persistent renal failure and
    failure to improve after delivery point to aHUS.
  distinguishing_features:
  - Predominant and persistent renal failure with dialysis requirement favors aHUS.
  - Persistence or worsening beyond the first postpartum days favors aHUS over HELLP.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haemolytic uremic syndrome (HUS), thrombotic thrombocytopenic purpura (TTP)"
    explanation: Names HUS among the serious mimics of HELLP requiring a different therapeutic approach.
- name: Immune thrombocytopenic purpura
  description: >
    A common cause of thrombocytopenia in pregnancy. ITP produces isolated
    thrombocytopenia without hemolysis or transaminase elevation.
  distinguishing_features:
  - Isolated thrombocytopenia with normal LDH, transaminases, and smear.
  evidence:
  - reference: PMID:19245695
    reference_title: "The HELLP syndrome: clinical issues and management. A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other less common, but serious conditions that may mimic HELLP, include ITP"
    explanation: Names ITP among the conditions that may be mistaken for HELLP.
- name: Systemic lupus erythematosus and antiphospholipid syndrome
  description: >
    Both can produce a pregnancy microangiopathy resembling HELLP, and both are
    independently associated with HELLP - chronic inflammatory disease and lupus were more
    strongly associated with HELLP than with isolated preeclampsia in a nationwide cohort.
    The distinction is therefore often one of co-existence rather than exclusion.
  distinguishing_features:
  - Antiphospholipid antibodies, prior thrombosis, or established lupus point to a coexisting or alternative diagnosis.
  - Neurologic involvement, dialysis requirement, or absent DIC raise concern for an APS-associated microangiopathy.
  evidence:
  - reference: PMID:42502666
    reference_title: "Divergent Risk Factors and Outcomes in Hemolysis, Elevated Liver Enzymes, and Low Platelets Syndrome and Isolated Preeclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic inflammatory diseases and lupus were more associated with PE-HELLP than iPE."
    explanation: Population-scale evidence that lupus and chronic inflammatory disease are differentially associated with HELLP.
discussions:
- discussion_id: hellp_complement_causal_role
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Is alternative-complement-pathway dysregulation a causal driver of HELLP syndrome in
    the subset of women who carry germline variants, or a bystander marker of the severe
    endothelial injury that HELLP shares with other thrombotic microangiopathies?
  attaches_to:
  - pathophysiology#Alternative Complement Pathway Dysregulation
  rationale: >
    The evidence is suggestive but does not settle direction. Germline
    alternative-pathway variants are enriched in HELLP cohorts and modified Ham testing is
    frequently positive, but the study is a single case-control series, complement
    activation is expected downstream of any severe endothelial injury, and the therapeutic
    evidence for C5 blockade is uncontrolled case reports in a condition that resolves on
    delivery. Resolving this determines whether eculizumab belongs on this entry as a
    treatment or only as a hypothesis.
  proposed_experiments:
  - experiment_id: hellp_c5_blockade_rct
    name: Randomized trial of C5 blockade in early-onset HELLP
    description: >
      A randomized trial of eculizumab or ravulizumab versus expectant management plus
      standard care in HELLP remote from term, with pregnancy prolongation and maternal
      organ-injury markers as endpoints, stratified by germline alternative-pathway
      genotype and baseline mHam status.
  - experiment_id: hellp_apc_variant_replication
    name: Replication of the germline variant enrichment in an independent cohort
    description: >
      Independent case-control sequencing of alternative-pathway complement genes in HELLP
      versus normotensive pregnancy and versus severe preeclampsia without HELLP, to test
      whether the enrichment is specific to HELLP or general to severe hypertensive
      disease of pregnancy.
  evidence:
  - reference: PMID:32986992
    reference_title: "Complement activation and regulation in preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that the inhibition of the terminal complement pathway, possibly through C5 blockade, may be an effective strategy to treat preeclampsia and hemolysis, elevated liver enzymes, and low platelet count syndrome, but this strategy warrants further evaluation in clinical trials."
    explanation: The source's own statement that trial evaluation is still required, which is the gap this discussion records.
- discussion_id: hellp_distinct_entity_or_pe_variant
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Is HELLP a severe variant within the preeclampsia spectrum, or a distinct disease
    entity that merely co-occurs with preeclampsia?
  attaches_to:
  - pathophysiology#Maternal Endothelial Injury and Systemic Inflammatory Amplification
  rationale: >
    This is not a naming argument - it determines whether HELLP-specific mechanism nodes
    are warranted at all. Arguments for a variant: 70-80% of cases coexist with
    preeclampsia, the placental trigger appears shared, and ICD-10 codes HELLP as a
    subcode of preeclampsia (O14.2), which makes "HELLP without PE" unascertainable in
    administrative data. Arguments for a distinct entity: risk-factor profiles diverge
    (diabetes, chronic hypertension, and obesity track isolated preeclampsia while chronic
    inflammatory disease and lupus track HELLP), outcome dynamics diverge, and the
    liver-dominant thrombotic microangiopathy has no counterpart in uncomplicated
    preeclampsia. This entry takes the operational position of curating HELLP separately
    while modeling the shared upstream in a single compressed node.
  evidence:
  - reference: PMID:42502666
    reference_title: "Divergent Risk Factors and Outcomes in Hemolysis, Elevated Liver Enzymes, and Low Platelets Syndrome and Isolated Preeclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "iPE and PE with HELLP differ regarding their risk factors and types and dynamics of their major complications."
    explanation: Population-scale evidence for divergence, the strongest current argument for treating HELLP as more than a severity label.
  - reference: PMID:42502666
    reference_title: "Divergent Risk Factors and Outcomes in Hemolysis, Elevated Liver Enzymes, and Low Platelets Syndrome and Isolated Preeclampsia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, whether it represents a distinct condition or a severe variant within the PE spectrum has been debated."
    explanation: The source explicitly frames this as an unresolved debate rather than a settled question.
  - reference: PMID:23107053
    reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "HELLP occurs in 0.2-0.8% of pregnancies and in 70-80% of cases it coexists with preeclampsia (PE)."
    explanation: >
      The high but incomplete coexistence rate is evidence on both sides: it supports the
      shared-spectrum view while leaving 20-30% of cases without preeclampsia.
- discussion_id: hellp_fao_metabolite_transfer
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Are 3-hydroxy long-chain acyl metabolites actually transferred from an LCHAD-deficient
    fetoplacental unit into the maternal circulation at hepatotoxic concentrations, or is
    the maternal liver injury explained by some other consequence of the fetal genotype?
  attaches_to:
  - pathophysiology#Fetal Long-Chain Fatty-Acid Oxidation Defect
  rationale: >
    The genetic association is strong and allele-specific, but the mechanistic step
    routinely quoted for it - placental export of toxic 3-hydroxy intermediates into a
    heterozygous mother with reduced beta-oxidation reserve - is an inference. The cited
    study establishes genotype-phenotype correlation, not metabolite transfer. The
    causal edge from this node is therefore typed
    INDIRECT_UNKNOWN_INTERMEDIATES.
  proposed_experiments:
  - experiment_id: hellp_maternal_acylcarnitine_profiling
    name: Maternal acylcarnitine profiling stratified by fetal genotype
    description: >
      Serial maternal plasma long-chain 3-hydroxyacylcarnitine measurement across the third
      trimester in pregnancies stratified by fetal HADHA/HADHB genotype, testing whether
      maternal metabolite concentrations rise before and track with maternal hepatic
      injury.
  evidence:
  - reference: PMID:10352164
    reference_title: "A fetal fatty-acid oxidation disorder as a cause of liver disease in pregnant women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with acute liver disease during pregnancy may have a Glu474Gln mutation in long-chain hydroxyacyl-CoA dehydrogenase."
    explanation: >
      The study's own conclusion is stated as a genetic association; it does not assert
      metabolite transfer, which is the gap recorded here.
datasets:

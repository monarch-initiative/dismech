    with HELLP. Carries no evidence block, per the dataset-curation convention: the
    accession is verified to exist and be relevant, which is not the same as having an
    exact quotable finding about HELLP.
clinical_trials:
- name: NCT04103489
  phase: PHASE_I
  status: COMPLETED
  description: >
    Phase 1 study of eculizumab in early preterm HELLP syndrome (23-30 weeks estimated
    gestational age), testing whether terminal complement blockade halts or reverses
    disease progression. This is the registered trial behind the complement arm curated
    on this entry; its phase-1 design and small enrolment are why C5 blockade is recorded
    here as investigational rather than as an established treatment.
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  - preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: clinicaltrials:NCT04103489
    reference_title: "Eculizumab in HELLP Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This drug blocks a part of the immune system called complement. By blocking this part of the immune system, eculizumab may stop or reverse the progression of the HELLP syndrome disease."
    explanation: States the trial's complement-blockade rationale, which is the therapeutic hypothesis recorded in the complement discussion on this entry.
- name: NCT01138839
  phase: PHASE_III
  status: UNKNOWN
  description: >
    Multicentric, double-blind, placebo-controlled randomized trial of dexamethasone in
    Mississippi class 1 (HELLP I) syndrome. Registered to address exactly the
    maternal-benefit question the Cochrane review left open; its status is recorded as
    UNKNOWN because the registry record has not been updated.
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: clinicaltrials:NCT01138839
    reference_title: "Dexamethasone Efficacy in HELLP I Syndrome, a Multicentric, Double-blind, Placebo-controlled, Randomized Clinical Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to determine the efficacy of dexamethasone for treatment of HELLP I (hemolysis, elevated liver enzymes and low platelet count) syndrome."
    explanation: Confirms that the maternal efficacy of dexamethasone in severe HELLP is a registered, prospectively posed trial question rather than settled.
notes: >
  Scope and boundary decisions for this entry.

  (1) Relationship to Preeclampsia. HELLP is curated as its own Disease entry keyed on
  MONDO:0008585 while also appearing as a `has_subtypes` entry on kb/disorders/Preeclampsia.yaml.
  That file was deliberately NOT modified. The shared placental upstream is represented
  here by a single compressed trigger node rather than duplicated in full; the trophoblast
  invasion, spiral artery remodeling, and sFlt-1/VEGF detail lives on the Preeclampsia
  entry. The `hellp_distinct_entity_or_pe_variant` discussion records why this boundary is
  contestable.

  (2) Module conformance is deliberately node-qualified and partial. Two conformance
  assertions are made. `Microangiopathic Erythrocyte Fragmentation and Destruction`
  conforms to hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction,
  substituting a mechanical/extrinsic insult for that module's intrinsic-lesion arm; the
  module explicitly admits "mechanical (microangiopathic)" insults, so this is within
  scope. `Hepatic Sinusoidal Microthrombosis and Fibrin Deposition` conforms to
  thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation and `Platelet Activation
  and Consumptive Thrombocytopenia` to thrombogenesis#Platelet Adhesion, Activation, and
  Aggregation. The thrombogenesis module places VWF-platelet microangiopathy such as TTP
  out of scope "unless a distinct conventional thrombin/fibrin thrombosis branch is
  explicitly evidenced" - that condition is met here by two independent sources reporting
  fibrin deposition and microthrombus formation in the hepatic sinusoids, including
  autopsy-confirmed intrahepatic fibrin networks. No conformance is asserted to the
  module's Virchow-triad, occlusion/ischemia, or embolization nodes.

  (3) Fetal fatty-acid-oxidation entries were not modified. The LCHAD/MTP/CPT1A
  association is cited from the maternal side only; kb/disorders/Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency.yaml,
  kb/disorders/Mitochondrial_Trifunctional_Protein_Deficiency.yaml, and
  kb/disorders/Carnitine_Palmitoyltransferase_1A_Deficiency.yaml already record it from
  the fetal side and were left untouched.

  (4) MONDO records "PEE1" and "PREECLAMPSIA/eclampsia 1" as RELATED synonyms of
  MONDO:0008585. These are OMIM susceptibility-locus labels, not names for HELLP, and were
  not used as search terms during curation - a deliberate named-entity-confusion
  precaution given that HELLP sits in a numbered/eponym-adjacent naming neighbourhood.

  (5) Low-dose aspirin prophylaxis is deliberately not curated as a HELLP treatment.
  Guideline-based low-dose aspirin started early in pregnancy is offered to women at
  elevated preeclampsia risk and may reduce some HELLP events as a consequence, but there
  is no evidence that it prevents HELLP specifically; the deep-research report says so
  explicitly. Recording it here would import a preeclampsia-level preventive as though it
  were HELLP-directed, which is exactly the boundary drawn in item (1). It belongs on
  kb/disorders/Preeclampsia.yaml, which was not modified for this entry.

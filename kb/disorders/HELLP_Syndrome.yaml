  downstream:
  - target: Periportal Hepatocyte Necrosis and Hepatic Injury
    description: >
      Sinusoidal obstruction produces ischemic damage and progressive demise of
      hepatocytes.
    causal_link_type: DIRECT
    hypothesis_groups:
    - shared_placental_antiangiogenic

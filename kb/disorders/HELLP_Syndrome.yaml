      reference_title: "Pathogenesis of the syndrome of hemolysis, elevated liver enzymes, and low platelet count (HELLP): a review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In about one half of women with HELLP, activation of coagulation factors and platelets precipitates disseminated intravascular coagulation, which in a minority becomes uncompensated and contributes to life-threatening multiorgan failure."
      explanation: >
        Supports the endpoint of multiorgan failure, but is marked PARTIAL because the

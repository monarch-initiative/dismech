- name: Platelet Activation and Consumptive Thrombocytopenia
  description: >
    Platelets adhere to and are activated on the injured endothelium and are consumed
    into microvascular platelet-fibrin thrombi. The thrombocytopenia of HELLP is
    therefore consumptive rather than a production failure - which is why platelet nadir
    is used as the severity axis of the Mississippi classification, and why platelet
    transfusion is reserved for bleeding or the most severe class rather than used to
    correct the count.
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "thrombogenesis#Platelet Adhesion, Activation, and Aggregation"

treatments:
- name: Oral retinoids
  description: >-
    Systemic retinoids are the only reported symptomatic therapy with an observed effect. The index case improved on
    etretinate, and a keratoderma review recommends acitretin for both the ichthyosis and the keratoderma. Evidence is
    limited to case experience.

- name: ER Stress-Driven Cutaneous Autoinflammation
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Proposed: chronic keratinocyte ER stress triggers innate-immune or type 1 interferon activation, which would
    make KLICK an autoinflammatory keratinization disease and explain the mild upper dermal infiltrate seen on
    biopsy. No inflammatory pathway has been measured in KLICK patients, and the PRAAS2 discovery paper describes
    KLICK as non-inflammatory. The observed infiltrate itself is recorded under histopathology.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  evidence:
  - reference: PMID:32425927
    reference_title: "KLICK Syndrome Linked to a POMP Mutation Has Features Suggestive of an Autoinflammatory Keratinization Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As we have cited that prolonged ER stress is known to induce inflammation in numerous chronic inflammatory skin diseases (23), the inflammation seen in KLICK syndrome could be considered to result from continuous abnormal ER stress in keratinocytes."
    explanation: Hypothesis that keratinocyte ER stress drives the dermal inflammation.
    directness: INDIRECT
  - reference: PMID:32425927
    reference_title: "KLICK Syndrome Linked to a POMP Mutation Has Features Suggestive of an Autoinflammatory Keratinization Disease."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although there are no reports of hyperactivation of innate immunity or of the induction of a type 1 interferon response in KLICK patients, the chronic ER stress present in the epidermis of KLICK patients may eventually trigger autoinflammation (16)."
    explanation: The same review states that innate-immune or interferon activation has not been shown in patients.
  - reference: PMID:29805043
    reference_title: "Heterozygous Truncating Variants in POMP Escape Nonsense-Mediated Decay and Cause a Unique Immune Dysregulatory Syndrome."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "AR deletions in the 5′ UTR of an alternative POMP transcript give rise to a longer-lived transcript that leads to a keratinization disorder of the skin ... with no inflammatory component."
    explanation: The PRAAS2 gene-discovery paper characterizes KLICK as non-inflammatory.

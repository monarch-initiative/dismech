histopathology:
- name: Mild upper dermal inflammatory infiltrate
  description: >-
    Mild, sparse nonspecific or lymphohistiocytic inflammatory infiltrates in the upper dermis of lesional skin.
    Whether they reflect autoinflammation is unresolved; see the ER stress-driven autoinflammation hypothesis.
  notes: No specific finding term is assigned for this infiltrate.
  evidence:
  - reference: PMID:32425927
    reference_title: "KLICK Syndrome Linked to a POMP Mutation Has Features Suggestive of an Autoinflammatory Keratinization Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, mild, spare nonspecific/lymphohistiocytic infiltrates of inflammatory cells are seen in the upper dermis"
    explanation: Review summary of the biopsy findings in reported patients.
genetic:
- name: POMP
  gene_term:
    preferred_term: POMP
    term:
      id: hgnc:20330
      label: POMP
  relationship_type: CAUSATIVE
  notes: >-
    All genetically studied patients carry the same homozygous 5' UTR deletion. Heterozygous truncating POMP variants
    cause PRAAS2, a separate immune-dysregulatory disorder, and are not KLICK alleles.
  variants:
  - name: c.-95delC
    description: >-
      Single-nucleotide deletion at c.-95 in the 5' UTR present in the long-UTR POMP transcript variants; homozygous
      in every reported KLICK patient.
    variant_type: deletion
    evidence:
    - reference: PMID:20226437
      reference_title: "A single-nucleotide deletion in the POMP 5' UTR causes a transcriptional switch and altered epidermal proteasome distribution in KLICK genodermatosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis of the ten annotated genes in the candidate region revealed homozygosity for a single-nucleotide deletion at position c.-95 in the proteasome maturation protein (POMP) gene, in all probands."
      explanation: The variant was homozygous in all eight probands of the discovery study.
    - reference: PMID:32425927
      reference_title: "KLICK Syndrome Linked to a POMP Mutation Has Features Suggestive of an Autoinflammatory Keratinization Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "There are 14 patients with KLICK syndrome described in the literature, and they all carry the same nucleotide deletion."
      explanation: All reported patients share this one allele.
  evidence:
  - reference: PMID:20226437
    reference_title: "A single-nucleotide deletion in the POMP 5' UTR causes a transcriptional switch and altered epidermal proteasome distribution in KLICK genodermatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using high-density genome-wide SNP analysis, we identified a 1.5 Mb homozygous candidate region on chromosome 13q."
    explanation: Homozygosity mapping localized the gene before POMP sequencing.

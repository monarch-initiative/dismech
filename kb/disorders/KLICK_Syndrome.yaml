name: KLICK Syndrome
creation_date: "2026-10-09T12:00:00Z"
description: >-
  KLICK syndrome (keratosis linearis with ichthyosis congenita and sclerosing keratoderma) is a rare autosomal
  recessive keratinization disorder. It combines congenital ichthyosiform scaling, sclerosing palmoplantar keratoderma
  with constricting digital bands, and keratotic papules arranged in linear, cord-like bands in the flexures,
  especially the arm folds and wrists. Every genetically studied patient has been homozygous for the same single
  nucleotide deletion in the 5' untranslated region of POMP, which encodes the proteasome maturation chaperone. The
  deletion shifts POMP transcription toward long 5' UTR isoforms and reduces effective POMP in differentiating
  keratinocytes, producing proteasome insufficiency, endoplasmic reticulum stress and defective profilaggrin processing
  in the upper epidermis. Disease is confined to the skin; whether mild dermal inflammation reflects an
  autoinflammatory component is debated.
category: Mendelian
disease_term:
  preferred_term: KLICK syndrome
  term:
    id: MONDO:0011169
    label: keratosis linearis-ichthyosis congenita-sclerosing keratoderma syndrome
synonyms:
- keratosis linearis with ichthyosis congenita and sclerosing keratoderma
- keratosis linearis-ichthyosis congenita-sclerosing keratoderma syndrome
parents:
- Hereditary Palmoplantar Keratoderma
- Inherited Ichthyosis
notes: >-
  No GeneReviews chapter covers KLICK syndrome. Heterozygous truncating POMP variants in the penultimate exon cause
  a different disorder, proteasome-associated autoinflammatory syndrome 2 (PRAAS2), with immunodeficiency,
  neutrophilic dermatosis and autoimmunity; those features are not part of KLICK and the two are not lumped. The
  digital constriction bands (pseudoainhum) are left without an HPO binding: HP:0010491 Digital constriction ring is
  a subclass of HP:0009775 Amniotic constriction ring and would assert an amniotic origin. Several KLICK case
  reports (PMID:27503413, PMID:29315485, PMID:21571163, PMID:21275938) have no PubMed abstract and could not be
  quoted, so clinical claims rest on the abstracts and full texts that are available. One of them
  (PMID:21571163) reports aggressive cutaneous squamous cell carcinoma in a KLICK patient; a single case does not
  establish an increased cancer risk.

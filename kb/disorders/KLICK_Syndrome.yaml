discussions:
- discussion_id: gap_klick_autoinflammation
  prompt: >-
    Does chronic keratinocyte ER stress in KLICK drive innate-immune or type 1 interferon activation, or is the mild
    dermal infiltrate a nonspecific consequence of hyperkeratosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ER Stress-Driven Cutaneous Autoinflammation
  rationale: >-
    One review proposes KLICK as an autoinflammatory keratinization disease, while the PRAAS2 gene-discovery paper
    describes KLICK as non-inflammatory. No inflammatory pathway has been measured in KLICK patient skin, and the
    answer determines whether anti-inflammatory therapy is a rational option.

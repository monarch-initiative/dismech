transmission:
- name: Urine-contaminated environmental exposure
  description: >-
    Humans acquire Weil's disease after pathogenic Leptospira from animal urine
    reach abraded skin or mucous membranes through direct animal contact,
    contaminated soil, contaminated freshwater, or floodwater.
  evidence:
  - reference: PMID:42156054
    reference_title: "[Leptospirosis (Weil's Disease)]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human infections are primarily acquired through direct or indirect contact
      with water or soil contaminated with the urine of infected animals.
    explanation: >-
      Supports urine-contaminated water and soil as the major route by which
      humans acquire pathogenic Leptospira.
pathophysiology:
- name: Environmental Leptospira Acquisition
  role: trigger
  description: >-
    Pathogenic Leptospira enter the human host through mucosa or abraded skin
    after animal-contact or urine-contaminated environmental exposure.
  biological_scale: ORGANISM
  downstream:
  - target: Hematogenous Leptospiral Dissemination
    causal_link_type: DIRECT
    description: >-
      Spirochetes that cross the barrier rapidly seed the bloodstream and
      visceral organs.
  evidence:
  - reference: PMID:42156054
    reference_title: "[Leptospirosis (Weil's Disease)]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human infections are primarily acquired through direct or indirect contact
      with water or soil contaminated with the urine of infected animals.
    explanation: >-
      Supports contaminated environmental exposure as the initiating event for
      human Leptospira infection.
- name: Hematogenous Leptospiral Dissemination
  description: >-
    Invasive Leptospira disseminate through blood and seed the liver, lungs,
    and kidneys early in systemic infection.
  biological_scale: ORGANISM
  downstream:
  - target: Endothelial Immune Vascular Leak
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Organ dissemination brings leptospires into proximity with vascular
      endothelium and activates pathogenic host inflammatory responses.
  - target: High Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic leptospiremic infection manifests as an acute high-fever illness.
  - target: Proximal Tubule Transporter Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Kidney seeding produces a proximal-tubule-centered lesion that disrupts
      sodium and water transport.
  - target: Hepatocyte Dissociation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Liver seeding produces a hepatocellular lesion that disrupts tissue
      architecture and bile handling.
  evidence:
  - reference: PMID:22273178
    reference_title: Establishment of a leptospirosis model in guinea pigs using an epicutaneous inoculations route.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the guinea pigs with abraded skin inoculations, leptospires were
      detected in blood as early as 2 h post infection (p.i.) and then
      disseminated to the liver, lungs and kidneys of almost all animals within
      96 h p.i..
    explanation: >-
      The epicutaneous guinea-pig model supports rapid bloodstream and visceral
      dissemination after skin-barrier entry by pathogenic L. interrogans.
- name: Hepatocyte Dissociation
  description: >-
    Severe L. interrogans infection can dissociate hepatocytes and disrupt liver
    parenchymal architecture, a hepatic branch that contributes to the icteric
    component of Weil's disease.
  biological_scale: CELLULAR
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Icteric Multiorgan Injury
    causal_link_type: DIRECT
    description: >-
      Hepatic parenchymal disruption contributes to the jaundice branch of
      severe icteric leptospirosis.
  evidence:
  - reference: PMID:41110285
    reference_title: Leptospira interrogans serovar Copenhageni infection and exudative glomerulonephritis in rehabilitated gray seals (Halichoerus grypus) and harbor seals (Phoca vitulina) in Ireland.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Common histological findings were acute renal tubular necrosis, exudative
      glomerulonephritis (GN), hepatocyte dissociation and pulmonary hemorrhage.
    explanation: >-
      Natural pinniped L. interrogans serovar Copenhageni disease reproduces
      jaundice and identifies hepatocyte dissociation as a hepatic lesion;
      this indirectly supports the hepatocyte-dissociation branch of the human
      severe-leptospirosis pathograph.
- name: Endothelial Immune Vascular Leak
  description: >-
    Leptospira-associated capillary injury is amplified by cytokine release,
    adhesion-molecule upregulation, and complement activation, disrupting
    endothelial integrity and promoting vascular leakage.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: complement activation
    modifier: INCREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Pulmonary Hemorrhage
    causal_link_type: DIRECT
    description: >-
      Loss of pulmonary endothelial integrity contributes to
      leptospirosis-associated pulmonary hemorrhagic syndrome.
  - target: Icteric Multiorgan Injury
    causal_link_type: DIRECT
    description: >-
      Systemic vascular leakage contributes to the hemorrhagic and pulmonary
      branch of severe icteric leptospirosis.
  evidence:
  - reference: PMID:41637348
    reference_title: >-
      Leptospirosis-associated pulmonary hemorrhagic syndrome: immune
      mechanisms, clinical manifestations, and experimental models.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the host immune response, via the cytokine release, high expression of
      adhesion molecules, and activation of the Complement System, may further
      disrupt endothelial integrity, promoting vascular leakage
    explanation: >-
      Supports immune-amplified endothelial injury and vascular leak as a
      mechanism in severe pulmonary hemorrhagic leptospirosis.
- name: Proximal Tubule Transporter Loss
  description: >-
    Severe leptospirosis injures proximal convoluted tubule cells and reduces
    apical and basolateral sodium/water transporter expression, producing a
    nonoliguric acute kidney injury with electrolyte wasting.
  biological_scale: CELLULAR
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  cell_types:
  - preferred_term: kidney proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
  downstream:
  - target: Acute Kidney Injury
    causal_link_type: DIRECT
    description: >-
      Proximal tubular injury and transporter loss manifest clinically as
      leptospiral acute kidney injury.
  - target: Icteric Multiorgan Injury
    causal_link_type: DIRECT
    description: >-
      Kidney injury joins hepatic and pulmonary involvement in the multi-organ
      syndrome of Weil's disease.
  evidence:
  - reference: PMID:20217429
    reference_title: >-
      Acute kidney injury in human leptospirosis: an immunohistochemical study
      with pathophysiological correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A decrease in NHE 3, aquaporin 1, and alpha-Na(+)K(+)ATPase expression
      occurred in proximal convoluted tubule cells.
    explanation: >-
      Human autopsy immunohistochemistry localizes the leptospiral renal lesion
      to proximal tubule transporter loss.
- name: Icteric Multiorgan Injury
  description: >-
    Severe leptospiral vascular and parenchymal injury converges on kidney,
    liver, and lung, producing the jaundice, acute kidney injury, pulmonary
    hemorrhage, and multi-organ dysfunction that define Weil's disease.
  biological_scale: TISSUE
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Jaundice
    causal_link_type: DIRECT
    description: Hepatic involvement manifests as severe icteric leptospirosis.
  - target: Acute Kidney Injury
    causal_link_type: DIRECT
    description: Renal involvement manifests as acute kidney injury.
  - target: Pulmonary Hemorrhage
    causal_link_type: DIRECT
    description: Pulmonary vascular injury manifests as pulmonary hemorrhage.
  - target: Myocarditis
    causal_link_type: DIRECT
    description: Cardiac involvement in severe leptospirosis manifests as myocarditis.
  evidence:
  - reference: PMID:42156054
    reference_title: "[Leptospirosis (Weil's Disease)]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disease ranges from a mild, self-limiting illness known as Akiyami to
      severe Weil's disease, which presents with high fever; jaundice;
      hemorrhagic tendencies involving the skin, nasal cavity, and lungs; and
      acute renal failure.
    explanation: >-
      Supports jaundice, hemorrhage, and acute renal failure as the severe
      clinical manifestations defining Weil's disease.
  - reference: PMID:41507816
    reference_title: "Severe leptospirosis in the intensive care unit: single centre prospective cohort study from Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, 99.1% (n = 115) developed acute kidney injury, 62.1% (n = 72)
      developed pulmonary haemorrhage, and 75.9% (n = 88) developed myocarditis.
    explanation: >-
      Quantifies kidney, pulmonary, and cardiac complications in a prospective
      severe leptospirosis ICU cohort.
progression:
- phase: Leptospiremic febrile phase
  notes: >-
    Weil's disease begins on the leptospirosis spectrum as an acute febrile
    illness before the transient recovery and later immune/organ-injury phase
    that produce severe jaundice, renal failure, and hemorrhage.
  evidence:
  - reference: PMID:40861768
    reference_title: >-
      A Challenging Case of Weil's Syndrome in New York City: A Short Review of
      the Renal Pathophysiology and Diagnosis of Leptospirosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients may exhibit a biphasic course, initially experiencing mild
      illness followed by a brief recovery and then progressing to more severe
      symptoms such as jaundice, meningitis, renal failure, or pulmonary
      hemorrhage.
    explanation: >-
      Describes the early mild illness that can precede the severe icteric phase.
- phase: Brief recovery or defervescence
  notes: >-
    Some patients have a short interval of improvement between early systemic
    symptoms and the subsequent organ-dysfunction phase.
  evidence:
  - reference: PMID:40861768
    reference_title: >-
      A Challenging Case of Weil's Syndrome in New York City: A Short Review of
      the Renal Pathophysiology and Diagnosis of Leptospirosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients may exhibit a biphasic course, initially experiencing mild
      illness followed by a brief recovery and then progressing to more severe
      symptoms such as jaundice, meningitis, renal failure, or pulmonary
      hemorrhage.
    explanation: Supports a transient recovery between the early and severe phases.
- phase: Severe icteric immune phase
  notes: >-
    Progression to Weil's disease is marked by jaundice, renal failure, and
    hemorrhagic pulmonary involvement rather than the self-limited mild course.
  evidence:
  - reference: PMID:40861768
    reference_title: >-
      A Challenging Case of Weil's Syndrome in New York City: A Short Review of
      the Renal Pathophysiology and Diagnosis of Leptospirosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients may exhibit a biphasic course, initially experiencing mild
      illness followed by a brief recovery and then progressing to more severe
      symptoms such as jaundice, meningitis, renal failure, or pulmonary
      hemorrhage.
    explanation: >-
      Supports the severe phase with icterus, renal failure, and pulmonary
      hemorrhage as outcomes after the early leptospiremic illness.

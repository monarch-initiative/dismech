treatments:
- name: Severity-stratified antibacterial therapy
  description: >-
    Doxycycline is used for mild-to-moderate leptospirosis, while severe
    leptospirosis, including Weil's disease, is treated with penicillin-class or
    third-generation cephalosporin antibacterial therapy; randomized-trial
    evidence for mortality reduction remains very uncertain.
  therapeutic_modality: SMALL_MOLECULE

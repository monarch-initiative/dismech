name: Weil's Disease
creation_date: "2026-09-30T01:01:36Z"
description: >-
  Weil's disease is the severe icteric form of zoonotic human leptospirosis,
  most often caused by pathogenic Leptospira interrogans serogroup
  Icterohaemorrhagiae after exposure to infected animal urine or
  urine-contaminated water and soil, in which hematogenous dissemination and
  vascular, proximal-tubular, hepatic, pulmonary, and cardiac injury produce
  high fever, jaundice, acute kidney injury, hemorrhage, myocarditis, and
  potentially fatal multi-organ dysfunction.
category: Infectious Disease
disease_term:
  preferred_term: Weil's disease
  term:
    id: MONDO:0043004
    label: Weil's disease
parents:
- Leptospirosis
synonyms:
- Weil disease
- Weil syndrome
- Severe icteric leptospirosis
- Icterohemorrhagic leptospirosis
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 24 reported
  PMIDs resolved and all 26 quoted snippets validated, but the report marked
  PMID:42801462 off-topic for human Weil's disease and its HPO term table
  mislabelled severity/timing text as labels for otherwise valid HPO CURIEs;
  the off-topic bovine-genital-leptospirosis reference and mislabelled generated
  term rows were not curated. preflight-dr skipped automated gene identity
  checks because MONDO:0043004 records no causal gene; manual review confirmed
  that the report covered the intended severe icteric leptospirosis entity.
review_notes: >-
  Deliberately lumped. Weil's disease is curated as the severe icteric clinical
  syndrome caused by pathogenic Leptospira rather than as separate
  serovar-specific entries; L. interrogans serogroup Icterohaemorrhagiae is the
  classic human lineage, but the conserved urine-borne zoonotic acquisition and
  multiorgan vascular, renal, hepatic, pulmonary, and cardiac pathograph are
  shared across pathogenic Leptospira that produce severe human leptospirosis.
  This entry is promoted from the parent Leptospirosis entry rather than left
  only as a severity subtype because it differs from broad mild leptospirosis on
  two evidenced axes: its organ-system axis is a hepatorenal-pulmonary-cardiac
  syndrome supported by PMID:42156054 and quantified in a severe ICU cohort by
  PMID:41507816, and its first-line-therapy axis includes penicillin-class or
  third-generation-cephalosporin severe-disease regimens rather than only
  doxycycline for mild-to-moderate disease, supported by PMID:42156054 and the
  ceftriaxone trial synthesis in PMID:38483092.

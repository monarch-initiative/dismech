diagnosis:
- name: Ehrlichiosis Laboratory Confirmation
  description: >-
    Suspected ehrlichiosis should be treated empirically while etiologic
    confirmation is pursued by methods such as whole-blood PCR, peripheral
    blood-smear morula examination, culture, or paired serology.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:17582569
    reference_title: "Ehrlichioses in humans: epidemiology, clinical presentation, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once an ehrlichiosis is suspected on historical and clinical grounds,
      doxycycline treatment should be initiated concurrently with attempts at
      etiologic confirmation using laboratory methods such as blood smear
      examination, polymerase chain reaction, culture, and serologic tests.
    explanation: >-
      Review synthesis supports PCR, smear, culture, or serology for laboratory
      confirmation while empirically treating suspected ehrlichiosis.
  - reference: PMID:39983688
    reference_title: "Contribution of Limited Molecular Testing to Low Ehrlichiosis Diagnosis in High Incidence Area, North Carolina, USA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indirect immunofluorescence antibody assays have been the primary method
      for laboratory diagnosis of ehrlichiosis. Detection of Ehrlichia spp. DNA
      by using PCR is now widely available through commercial laboratories.
    explanation: >-
      A high-incidence North Carolina health-system study contrasts IFA
      serology with available Ehrlichia species PCR testing.
treatments:
- name: Doxycycline
  description: >-

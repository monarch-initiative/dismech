agent_life_cycle:
  description: >-
    Human ehrlichiosis agents circulate through tick-borne enzootic cycles:
    E. chaffeensis and E. ewingii are associated with Amblyomma americanum,
    while E. muris subsp. eauclairensis is transmitted by Ixodes scapularis and
    has been detected in white-footed mice.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: white-tailed deer
    role: principal E. chaffeensis vertebrate reservoir
    term:
      id: NCBITaxon:9874
      label: Odocoileus virginianus
  - preferred_term: white-footed mouse
    role: detected E. muris subsp. eauclairensis vertebrate host
    term:
      id: NCBITaxon:10041
      label: Peromyscus leucopus
  - preferred_term: lone star tick
    role: Amblyomma-associated vector
    term:
      id: NCBITaxon:6943
      label: Amblyomma americanum
  - preferred_term: blacklegged tick
    role: E. muris subsp. eauclairensis vector
    term:
      id: NCBITaxon:6945
      label: Ixodes scapularis
  vectors:
  - Amblyomma americanum ticks
  - Ixodes scapularis ticks
  evidence:
  - reference: PMID:35763959
    reference_title: "Genetic characterization of a novel Ehrlichia chaffeensis genotype from an Amblyomma tenellum tick from South Texas, USA."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ehrlichia chaffeensis is maintained in a zoonotic cycle involving
      white-tailed deer (Odocoileus virginianus) as the main vertebrate
      reservoir and lone star ticks (Amblyomma americanum) as its principal
      vector.
    explanation: >-
      Supports the major E. chaffeensis lifecycle connecting white-tailed deer
      reservoirs, lone-star-tick vectors, and incidental human infection.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      cases also were reported from 10 other states within the distribution of
      the principal vector, the lone star tick, A. americanum
    explanation: >-
      CDC recommendations identify Amblyomma americanum as the principal vector
      associated with E. ewingii ehrlichiosis in the United States.
  - reference: PMID:28699575
    reference_title: "Proposal to reclassify Ehrlichia muris as Ehrlichia muris subsp. muris subsp. nov. and description of Ehrlichia muris subsp. eauclairensis subsp. nov., a newly recognized tick-borne pathogen of humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      DNA from this bacterium was also detected in Ixodes scapularis and
      Peromyscus leucopus collected in Minnesota and Wisconsin.
    explanation: >-
      Places E. muris subsp. eauclairensis in blacklegged ticks and
      white-footed mice in the upper Midwest.
classifications:

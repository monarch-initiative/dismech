name: Ehrlichiosis
creation_date: "2026-09-30T01:15:21Z"
description: >-
  Ehrlichiosis is an acute tick-borne zoonotic bacterial infection caused by
  obligately intracellular Ehrlichia species. Tick-delivered organisms infect
  leukocytes, replicate inside cytoplasmic morulae, and produce a febrile
  cytopenic illness that can progress to systemic inflammatory complications.
category: Infectious Disease
disease_term:
  preferred_term: ehrlichiosis
  term:
    id: MONDO:0016003
    label: ehrlichiosis
parents:
- Bacterial Infection
- Vector-borne disease
has_subtypes:
- name: Human monocytic ehrlichiosis
  classification: etiologic_species_and_cell_tropism
  curated_in: Human_Monocytic_Ehrlichiosis
  subtype_term:
    preferred_term: human monocytic ehrlichiosis
    term:
      id: MONDO:0000225
      label: human monocytic ehrlichiosis
  description: >-
    The E. chaffeensis-driven monocyte-tropic subtype is curated in full in
    Human_Monocytic_Ehrlichiosis.
  evidence:
  - reference: PMID:35763959
    reference_title: "Genetic characterization of a novel Ehrlichia chaffeensis genotype from an Amblyomma tenellum tick from South Texas, USA."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ehrlichia chaffeensis is the causative agent of human monocytotropic
      ehrlichiosis (HME), a disease that ranges in severity from mild to fatal
      infection.
    explanation: >-
      Grounds the pointer subtype as E. chaffeensis human monocytic
      ehrlichiosis.
- name: Ehrlichia ewingii ehrlichiosis
  classification: etiologic_species_and_cell_tropism
  description: >-
    E. ewingii produces a granulocyte-tropic ehrlichiosis whose clinical
    syndrome resembles E. chaffeensis ehrlichiosis but has rarer rash and
    gastrointestinal symptoms.
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical manifestations of E. ewingii ehrlichiosis are similar to E.
      chaffeensis ehrlichiosis and include fever, headache, malaise, and
      myalgia. Gastrointestinal symptoms have been described less commonly in
      E. ewingii  ehrlichiosis, and rash is rare.
    explanation: >-
      CDC recommendations distinguish E. ewingii ehrlichiosis from HME by
      clinical pattern.
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      E. ewingii has a predilection for granulocytes, and morulae might be
      observed in granulocytes during examination of a blood smear, bone marrow,
      or CSF
    explanation: >-
      Granulocyte tropism differentiates E. ewingii ehrlichiosis from the
      monocyte-tropic HME subtype.
- name: Ehrlichia muris eauclairensis ehrlichiosis
  classification: etiologic_species_and_geography
  description: >-
    E. muris subsp. eauclairensis, formerly the Ehrlichia muris-like agent, is
    an Ixodes scapularis-transmitted ehrlichiosis recognized from the upper
    midwestern United States.
  evidence:
  - reference: PMID:28699575
    reference_title: "Proposal to reclassify Ehrlichia muris as Ehrlichia muris subsp. muris subsp. nov. and description of Ehrlichia muris subsp. eauclairensis subsp. nov., a newly recognized tick-borne pathogen of humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We conclude that EMLA WisconsinT represents a novel subspecies of E. muris
      and propose naming it E. muris subspecies eauclairensis based on the
      geographic origin of the original isolate.
    explanation: >-
      Establishes the current E. muris subsp. eauclairensis name for the human
      agent formerly called EMLA.
  - reference: PMID:28699575
    reference_title: "Proposal to reclassify Ehrlichia muris as Ehrlichia muris subsp. muris subsp. nov. and description of Ehrlichia muris subsp. eauclairensis subsp. nov., a newly recognized tick-borne pathogen of humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      E. muris subsp. eauclairensis is passaged transstadially in and
      transmitted by I. scapularis ticks
    explanation: >-
      The blacklegged-tick vector distinguishes this upper-midwestern subtype
      from the Amblyomma-associated HME and E. ewingii strata.
synonyms:
- Human ehrlichiosis
- Ehrlichial infection
notes: >-
  This parent covers tick-borne human infections caused by Ehrlichia species. It
  excludes Anaplasma phagocytophilum disease and other viral or rickettsial
  tick-borne diseases whose agents occupy separate genera and pathophysiologic
  entries.
review_notes: >-
  Deliberately lumped. The parent Ehrlichiosis entry keeps shared tick-borne
  inoculation, intracellular leukocyte morula replication, empiric doxycycline
  treatment, and the fever-cytopenia-transaminitis syndrome together while
  leaving E. chaffeensis effector biology to Human_Monocytic_Ehrlichiosis and
  recording separate rows for E. ewingii and E. muris subsp. eauclairensis
  strata that differ by leukocyte tropism, vector, or geography.

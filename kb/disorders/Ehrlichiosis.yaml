transmission:
- name: Tick-borne Ehrlichia transmission
  description: >-
    Ehrlichia reach incidental human hosts after infected ticks inoculate the
    bacteria during blood feeding.
  evidence:
  - reference: PMID:15618141
    reference_title: An immunoreactive 38-kilodalton protein of Ehrlichia canis shares structural homology and iron-binding capacity with the ferric ion-binding protein family.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ehrlichiae are tick-transmitted, gram-negative, obligately intracellular
      bacteria that live and replicate in cytoplasmic vacuoles
    explanation: >-
      The paper summarizes tick transmission as a genus-level property of the
      Ehrlichia agents curated in this parent entry.
pathophysiology:
- name: Tick-Borne Ehrlichia Acquisition
  role: trigger
  description: >-
    An infected tick inoculates Ehrlichia into the human host during feeding.
  biological_scale: ORGANISM
  downstream:
  - target: Leukocyte Ehrlichia Entry
    causal_link_type: DIRECT
    description: >-
      Tick-delivered organisms encounter susceptible leukocytes and begin the
      intracellular phase of infection.
  evidence:
  - reference: PMID:15618141
    reference_title: An immunoreactive 38-kilodalton protein of Ehrlichia canis shares structural homology and iron-binding capacity with the ferric ion-binding protein family.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ehrlichiae are tick-transmitted, gram-negative, obligately intracellular
      bacteria that live and replicate in cytoplasmic vacuoles
    explanation: >-
      Supports the tick-borne initiating exposure and the obligate
      intracellular phase that follows successful inoculation.
- name: Leukocyte Ehrlichia Entry
  description: >-
    Ehrlichia enter susceptible leukocytes and establish cytoplasmic vacuoles
    that mature into morulae; E. chaffeensis morulae are found in monocytes and
    E. ewingii morulae in granulocytes.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Vacuolar Ehrlichia Replication
    causal_link_type: DIRECT
    description: >-
      Bacteria that remain inside host-cell vacuoles convert that compartment
      into a replicative morula.
  evidence:
  - reference: PMID:14976527
    reference_title: Characteristic peripheral blood findings in human ehrlichiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Morulae were present in monocytes in E. chaffeensis-infected cases and
      granulocytes in the E. ewingii-infected case.
    explanation: >-
      Human blood-smear evidence places human ehrlichiosis agents inside
      lineage-specific leukocyte morulae.
- name: Vacuolar Ehrlichia Replication
  description: >-
    Intracellular Ehrlichia multiply in host-cell vacuoles as morulae, expanding
    the leukocyte infection that drives acute ehrlichiosis.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: symbiont-containing vacuole
    term:
      id: GO:0020003
      label: symbiont-containing vacuole
  downstream:
  - target: Febrile Cytopenic Ehrlichiosis Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Vacuolar replication expands the intracellular bacterial population
      enough to produce systemic fever, cytopenias, and hepatic inflammation.
  evidence:
  - reference: PMID:15618141
    reference_title: An immunoreactive 38-kilodalton protein of Ehrlichia canis shares structural homology and iron-binding capacity with the ferric ion-binding protein family.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fbp was observed primarily in the cytoplasm of the reticulate forms of E.
      canis and Ehrlichia chaffeensis but was notably found on extracellular
      morula fibers in morulae containing dense-cored organisms.
    explanation: >-
      Directly observes the Ehrlichia iron-binding protein in developmental
      forms within morulae, supporting the vacuolar replicative node.
- name: Febrile Cytopenic Ehrlichiosis Syndrome
  description: >-
    Intracellular Ehrlichia expansion and the host inflammatory response produce
    the characteristic febrile systemic illness with leukopenia,
    thrombocytopenia, and elevated serum aminotransferases, and severe cases can
    progress to organ-specific complications.
  biological_scale: ORGANISM
  downstream:
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The acute systemic Ehrlichia syndrome manifests as fever.
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      The acute systemic Ehrlichia syndrome includes platelet depletion.
  - target: Leukopenia
    causal_link_type: DIRECT
    description: >-
      The acute systemic Ehrlichia syndrome includes leukocyte depletion.
  - target: Elevated hepatic transaminases
    causal_link_type: DIRECT
    description: >-
      The acute systemic Ehrlichia syndrome includes liver inflammation with
      elevated circulating aminotransferases.
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Headache is part of the acute febrile symptom complex.
  - target: Myalgia
    causal_link_type: DIRECT
    description: >-
      Myalgia is part of the acute febrile symptom complex.
  - target: Skin rash
    causal_link_type: DIRECT
    description: >-
      Rash can accompany acute ehrlichiosis.
  - target: Lymphopenia
    causal_link_type: DIRECT
    description: >-
      The acute systemic Ehrlichia syndrome can deplete lymphocytes.
  - target: Hyponatremia
    causal_link_type: DIRECT
    description: >-
      Hyponatremia is a laboratory abnormality seen during acute illness.
  - target: Anemia
    causal_link_type: DIRECT
    description: >-
      Anemia can accompany acute illness.
  - target: Acute Respiratory Distress Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe ehrlichiosis can progress to inflammatory lung injury.
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe ehrlichiosis can trigger secondary hemophagocytic
      lymphohistiocytosis.
  - target: Meningoencephalitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe or disseminated infection can involve the central nervous system.
  evidence:
  - reference: PMID:7619983
    reference_title: "Ehrlichial diseases of humans: emerging tick-borne infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both infections cause undifferentiated fever with leukopenia,
      thrombocytopenia, and elevations in serum aminotransferase levels.
    explanation: >-
      Review synthesis across human monocytic and granulocytic ehrlichioses
      supports the defining fever-cytopenia-transaminitis syndrome.
  - reference: PMID:39790701
    reference_title: "Hemophagocytic Lymphohistiocytosis Due to Ehrlichiosis: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the cases of 2 patients diagnosed with secondary HLH as per
      the 2004 HLH criteria, with the trigger secondary to ehrlichiosis.
    explanation: >-
      Human cases document secondary HLH as a severe inflammatory complication
      of ehrlichiosis.
progression:
- phase: Tick-borne intracellular Ehrlichia infection
  notes: >-
    Infected ticks inoculate obligately intracellular Ehrlichia, which enter
    leukocytes and replicate in cytoplasmic vacuoles.
  evidence:
  - reference: PMID:15618141
    reference_title: An immunoreactive 38-kilodalton protein of Ehrlichia canis shares structural homology and iron-binding capacity with the ferric ion-binding protein family.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ehrlichiae are tick-transmitted, gram-negative, obligately intracellular
      bacteria that live and replicate in cytoplasmic vacuoles
    explanation: >-
      Supports the early tick-borne intracellular infection phase shared by
      human ehrlichiosis agents.
- phase: Febrile cytopenic illness
  notes: >-
    Expanded intracellular infection produces an acute undifferentiated
    systemic illness with fever, leukopenia, thrombocytopenia, and elevated
    serum aminotransferases.
  evidence:
  - reference: PMID:7619983
    reference_title: "Ehrlichial diseases of humans: emerging tick-borne infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both infections cause undifferentiated fever with leukopenia,
      thrombocytopenia, and elevations in serum aminotransferase levels.
    explanation: >-
      Describes the acute febrile cytopenic phase shared by the ehrlichial
      infections covered by this parent entry.
- phase: Severe systemic ehrlichiosis
  notes: >-
    A minority of infections progress to severe systemic disease with
    complications such as acute respiratory distress syndrome, central nervous
    system involvement, or secondary hemophagocytic lymphohistiocytosis.
  evidence:
  - reference: PMID:39093857
    reference_title: "Human monocytotropic ehrlichiosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of complications is higher in immunocompromized compared to
      immunocompetent cases, with ARDS (34% vs 19.8%), acute renal failure (34%
      vs 15.8%), multi organ failure (26% vs 14.9%), and secondary
      hemophagocytic lymphohistiocytosis (26% vs 14.9%) being the most frequent
      reported.
    explanation: >-
      A systematic review of HME cases documents ARDS and secondary HLH among
      recurrent severe ehrlichiosis complications.

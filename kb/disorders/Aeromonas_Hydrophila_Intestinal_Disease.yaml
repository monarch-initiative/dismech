name: Aeromonas Hydrophila Intestinal Disease
creation_date: "2026-09-30T06:33:29Z"
description: >-
  Aeromonas hydrophila intestinal disease is an acquired bacterial
  gastroenteritis caused by waterborne or foodborne Aeromonas hydrophila.
  It can present as watery, cholera-like diarrhea with dehydration or as a
  dysentery-like bloody diarrhea when pore-forming toxins drive epithelial
  injury and inflammatory signaling.
category: Infectious Disease
disease_term:
  preferred_term: Aeromonas hydrophila intestinal disease
  term:
    id: MONDO:0024459
    label: Aeromonas hydrophila intestinal disease
parents:
- Aeromonas Hydrophila Infectious Disease
synonyms:
- Aeromonas hydrophila gastroenteritis
- Aeromonas-associated gastroenteritis
- Aeromonas enteritis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Aeromonas hydrophila
  description: >-
    Aeromonas hydrophila is one of the Aeromonas species recovered from
    patients with acute Aeromonas gastroenteritis.
  infectious_agent_term:
    preferred_term: Aeromonas hydrophila
    term:
      id: NCBITaxon:644
      label: Aeromonas hydrophila
  evidence:
  - reference: PMID:29205196
    reference_title: >-
      Speciation, clinical profile & antibiotic resistance in Aeromonas species
      isolated from cholera-like illnesses in a tertiary care hospital in north
      India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of the 35 strains for which biochemical speciation was done, the most
      common species was found to be A. caviae (34%), followed by Aeromonas
      veronii biovar veronii (29%), Aeromonas veronii biovar sobria (26%) and
      Aeromonas hydrophila (9%).
    explanation: >-
      Identifies A. hydrophila among species isolated from patients with
      suspected acute Aeromonas gastroenteritis resembling cholera.
transmission:
- name: Foodborne and waterborne ingestion
  description: >-
    Humans acquire enteric Aeromonas after ingesting contaminated water or
    contaminated foods, including fish and chicken reservoirs that can carry
    toxin-producing Aeromonas strains.
  evidence:
  - reference: PMID:27051177
    reference_title: >-
      Incidence of Aeromonas spp. infection in fish and chicken meat and its
      related public health hazards: A review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fish and chicken play an important role in the transmission of this
      pathogen to humans.
    explanation: >-
      Supports fish and chicken as foodborne reservoirs in Aeromonas exposure.
pathophysiology:
- name: Contaminated Food and Water Ingestion
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infection starts when viable A. hydrophila or a closely related Aeromonas
    strain is swallowed in contaminated water or food and reaches the intestinal
    lumen.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  downstream:
  - target: Mucus Adhesion and Intestinal Colonization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Luminal delivery positions motile Aeromonas to interact with the
      intestinal mucus layer.
  evidence:
  - reference: PMID:27051177
    reference_title: >-
      Incidence of Aeromonas spp. infection in fish and chicken meat and its
      related public health hazards: A review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In humans, they are associated with intestinal and extra-intestinal
      infections.
    explanation: >-
      Places Aeromonas among bacteria causing intestinal human infection after
      environmental or foodborne exposure.
- name: Mucus Adhesion and Intestinal Colonization
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Aeromonas adhesion to intestinal mucus glycoproteins promotes colonization;
    a carp intestinal-mucus assay showed that A. hydrophila strains bind mucus
    carbohydrate side chains and that stronger mucus adhesion tracks with
    greater in vitro cytotoxicity.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  downstream:
  - target: Act and Aerolysin Pore-Toxin Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Colonization brings bacterial enterotoxins to the mucosal surface, where
      Act and aerolysin-family toxins can damage host-cell membranes.
  evidence:
  - reference: PMID:18924378
    reference_title: Influence of carp intestinal mucus molecular size and glycosylation on bacterial adhesion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results suggest that bacteria interact with carbohydrate side chains
      of mucus glycoproteins
    explanation: >-
      The fish mucus model supports glycoprotein-mediated intestinal adhesion,
      interpreted as an indirect model for the human mucosal colonization step.
- name: Act and Aerolysin Pore-Toxin Activation
  biological_scale: MOLECULAR
  description: >-
    Aeromonas cytotoxic enterotoxin Act and aerolysin-family toxins are secreted
    as inactive precursors whose activation, oligomerization, and membrane
    insertion generate beta-barrel pores in host-cell membranes.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  downstream:
  - target: cAMP and Eicosanoid Secretory Signaling
    causal_link_type: DIRECT
    description: >-
      Pore-forming Act signaling increases cAMP and COX-2/PGE2-linked
      eicosanoid production, which favor secretory fluid loss.
  - target: MAPK-Caspase Inflammatory Epithelial Injury
    causal_link_type: DIRECT
    description: >-
      Act activates stress MAPK cascades and caspase-dependent apoptosis in
      macrophages and intestinal epithelial cells.
  evidence:
  - reference: PMID:9398250
    reference_title: >-
      Conformational changes in aerolysin during the transition from the
      water-soluble protoxin to the membrane channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Proteolytic activation, oligomerization, and membrane insertion are three
      steps that precede channel formation by the bacterial toxin aerolysin.
    explanation: >-
      Defines the ordered molecular activation steps of the Aeromonas
      pore-forming toxin aerolysin.
  - reference: PMID:9317040
    reference_title: >-
      Hyperproduction, purification, and mechanism of action of the cytotoxic
      enterotoxin produced by Aeromonas hydrophila.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the mechanism of action of the toxin involved the formation of pores in
      erythrocyte membranes
    explanation: >-
      Shows that purified A. hydrophila Act acts through membrane pore
      formation.
- name: cAMP and Eicosanoid Secretory Signaling
  biological_scale: CELLULAR
  description: >-
    Act stimulates macrophage cytokine signaling, nitric-oxide-synthase
    transcription, COX-2/PGE2 eicosanoid metabolism, and cAMP production,
    signaling changes that help explain the fluid secretory branch of
    Aeromonas diarrhea.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  - preferred_term: monoatomic ion transport
    term:
      id: GO:0006811
      label: monoatomic ion transport
    modifier: DYSREGULATED
  downstream:
  - target: Watery Diarrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Secretory signaling increases intestinal fluid and electrolyte movement,
      producing watery cholera-like diarrhea.
  - target: Dehydration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Profuse secretory fluid loss can progress to severe dehydration.
  evidence:
  - reference: PMID:10768977
    reference_title: >-
      The cytotoxic enterotoxin of Aeromonas hydrophila induces
      proinflammatory cytokine production and activates arachidonic acid
      metabolism in macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Act stimulated the production of tumor necrosis factor alpha and
      upregulated the expression of genes encoding interleukin-1beta
    explanation: >-
      Shows that A. hydrophila Act induces inflammatory cytokine production.
  - reference: PMID:10768977
    reference_title: >-
      The cytotoxic enterotoxin of Aeromonas hydrophila induces
      proinflammatory cytokine production and activates arachidonic acid
      metabolism in macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Act also activated transcription of the gene encoding inducible nitric oxide synthase.
    explanation: >-
      Supports Act-induced activation of additional inflammatory mediator
      pathways in macrophages.
- name: MAPK-Caspase Inflammatory Epithelial Injury
  biological_scale: CELLULAR
  description: >-
    Act activates p38, JNK, and ERK MAPK signaling in macrophages and human
    intestinal epithelial cells and triggers caspase-3, caspase-8, and
    caspase-9 activation, linking pore-toxin exposure to epithelial apoptosis,
    mucosal injury, and bloody diarrhea.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Bloody Diarrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      MAPK activation and apoptosis promote inflammatory mucosal damage that
      can manifest as dysentery-like bloody diarrhea.
  - target: Abdominal Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inflammatory mucosal injury contributes to the abdominal pain reported in
      Aeromonas-associated gastroenteritis.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proinflammatory cytokine signaling accompanying mucosal injury can drive
      the fever reported in Aeromonas-associated gastroenteritis.
  - target: Sepsis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mucosal barrier breakdown can permit bacteraemic dissemination from the
      gut, progressing in a minority of hosts to sepsis.
  evidence:
  - reference: PMID:15215244
    reference_title: >-
      Aeromonas hydrophila cytotoxic enterotoxin activates mitogen-activated
      protein kinases and induces apoptosis in murine macrophages and human
      intestinal epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Act activated stress-associated p38, c-Jun NH(2)-terminal kinase (JNK),
      and extracellular signal-regulated kinase 1/2 (ERK1/2) in these cells.
    explanation: >-
      Demonstrates activation of the p38, JNK, and ERK MAPK arms in macrophages
      and human intestinal epithelial cells treated with Act.
  - reference: PMID:15215244
    reference_title: >-
      Aeromonas hydrophila cytotoxic enterotoxin activates mitogen-activated
      protein kinases and induces apoptosis in murine macrophages and human
      intestinal epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Act evoked cell membrane blebbing, caspase 3-cleavage, and activation of
      caspases 8 and 9 in these cells.
    explanation: >-
      Supports a caspase-mediated apoptotic branch downstream of Act exposure.
- name: Species Attribution and Commensal Ambiguity
  role: modifier
  biological_scale: ORGANISM
  description: >-
    Human Aeromonas gastroenteritis surveys recover several Aeromonas species,
    and stools from symptomatic and asymptomatic people can have similar
    Aeromonas positivity rates, so species-resolved testing and the exclusion
    of other pathogens are important for attributing an individual diarrheal
    episode to A. hydrophila.
  downstream:
  - target: Mucus Adhesion and Intestinal Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Species identity and strain virulence modify whether a colonizing
      Aeromonas behaves as an enteric pathogen rather than an incidental
      commensal of the intestinal mucosa.
  evidence:
  - reference: PMID:39388901
    reference_title: >-
      Epidemiology and clinical characteristics of Aeromonas-associated
      gastroenteritis in Northern Israel: Insights and implications for public
      health.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The role of Aeromonas spp. in gastroenteritis is controversial due to
      varied clinical presentations and variable prevalence in asymptomatic.
    explanation: >-
      Grounds the caveat that stool detection alone does not prove Aeromonas is
      the cause of every diarrheal episode.
  - reference: PMID:38783344
    reference_title: >-
      Phenotypic and genotypic analysis of antimicrobial resistance and
      population structure of gastroenteritis-related Aeromonas isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The species that were identified included A. caviae (n = 58), A.
      dhakensis (n = 3), A. media (n = 2), A. veronii (n = 2) and A. hydrophila
      (n = 2).
    explanation: >-
      Shows that modern Aeromonas gastroenteritis isolate collections are
      species-heterogeneous and need isolate-level identification.

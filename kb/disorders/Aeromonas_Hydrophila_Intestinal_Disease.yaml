- name: Sepsis
  category: Systemic
  frequency: RARE
  description: >-
    Enteric Aeromonas infection occasionally progresses to bacteraemia and
    sepsis, concentrated in immunocompromised and elderly hosts, and this
    invasive course accounts for most of the disease's mortality.
  phenotype_term:
    preferred_term: Sepsis

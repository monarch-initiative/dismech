  rate_low: 4240.0
  rate_high: 4810.0
  notes: >-
    Aeromonas detected as the sole stool pathogen in symptomatic patients at a
    rate similar to its carriage in asymptomatic people, underlining the
    commensal-versus-pathogen ambiguity.
  evidence:
  - reference: PMID:39388901
    reference_title: >-
      Epidemiology and clinical characteristics of Aeromonas-associated
      gastroenteritis in Northern Israel: Insights and implications for public
      health.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      4.24%-4.81% of AAG patients had Aeromonas spp. in stools as a sole
      pathogen in 2020-2022, compared to 4.9% of asymptomatic.
    explanation: >-
      Gives the symptomatic sole-pathogen detection rate and its near-identity
      to asymptomatic carriage.
progression:
- phase: Incubation and onset
  notes: >-
    Enteric symptoms typically begin within hours to a few days of ingesting
    contaminated water or food.
- phase: Acute self-limited gastroenteritis
  duration: up to one to two weeks
  notes: >-
    In immunocompetent hosts the diarrhoeal illness is usually self-limited,
    resolving over days to about two weeks, though some cases are prolonged.
  evidence:
  - reference: PMID:37217902
    reference_title: >-
      An estimation of global Aeromonas infection prevalence in children with
      diarrhoea: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      diarrhoea is either self-limited, tolerable to one week, or elongated up
      to two weeks, or become chronic with more than one month period
    explanation: >-
      Describes the self-limited-to-prolonged course of the diarrhoeal phase.
- phase: Severe secretory dehydration
  notes: >-
    A minority of patients progress to profuse cholera-like watery stools with
    severe dehydration.
  evidence:
  - reference: PMID:29205196
    reference_title: >-
      Speciation, clinical profile & antibiotic resistance in Aeromonas species
      isolated from cholera-like illnesses in a tertiary care hospital in north
      India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      13 (26%) had typical features of cholera with rice water stools and
      severe dehydration.
    explanation: >-
      Quantifies the cholera-like severe-dehydration presentation within an
      Aeromonas gastroenteritis series.
- phase: Invasive systemic disease
  notes: >-
    Rarely, infection progresses to bacteraemia and sepsis, mainly in
    immunocompromised or elderly hosts, carrying high mortality.
review_notes: >-
  Duplicate preflight found no exact MONDO:0024459 or label match in the local
  worktree or origin/main knowledgebase/research surfaces; an ignored-inclusive
  full-repo scan only found MONDO:0024459 in generated dashboard priority
  artifacts. GitHub all-state PR/issue exact searches repeatedly failed with
  api.github.com connection errors, and the current open-PR title list had no
  Aeromonas hydrophila entry. Falcon deep research was unavailable and fell
  back to OpenScientist; 46/46 report references resolved, only 18/46 were
  topically relevant, and preflight-dr skipped the gene-identity check because
  MONDO records no causal host gene for this acquired infection. This first
  pass intentionally excludes aquaculture-only vaccine, probiotic, and
  phytobiotic prevention details and records fish-gut mucus adhesion only as an
  indirect model of enteric colonization.

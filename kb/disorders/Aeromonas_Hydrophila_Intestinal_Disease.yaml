diagnosis:
- name: Stool Aeromonas Detection and Species Identification
  description: >-
    Diagnosis is based on detecting Aeromonas in stool followed by
    species-resolved identification and susceptibility testing when isolates are
    recovered.
  evidence:
  - reference: PMID:38783344
    reference_title: >-
      Phenotypic and genotypic analysis of antimicrobial resistance and
      population structure of gastroenteritis-related Aeromonas isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Cultivation of Aeromonas was attempted from stool samples that tested positive by PCR.
    explanation: >-
      Supports stool PCR followed by attempted culture as a clinical workflow
      for Aeromonas-associated gastroenteritis isolates.
treatments:
- name: Susceptibility-Guided Antibiotic Therapy
  description: >-
    Most enteric disease is managed supportively, but severe or invasive
    Aeromonas gastroenteritis can require antimicrobial therapy guided by
    isolate susceptibility, because most isolates are resistant to amoxicillin
    and empiric aminopenicillins are unreliable.
  notes: >-
    Fluoroquinolone and multidrug resistance are regionally substantial in
    Aeromonas gastroenteritis isolates, so the listed agents reflect
    susceptibility-guided choices rather than an empiric recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  target_mechanisms:
  - target: Act and Aerolysin Pore-Toxin Activation
    treatment_effect: INHIBITS
    description: >-
      Effective antibiotics kill or suppress Aeromonas growth and thereby stop
      continued enterotoxin production.
  evidence:
  - reference: PMID:29205196
    reference_title: >-
      Speciation, clinical profile & antibiotic resistance in Aeromonas species
      isolated from cholera-like illnesses in a tertiary care hospital in north
      India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All tested isolates were uniformly susceptible to cefepime, amikacin,
      azithromycin and meropenem
    explanation: >-
      Shows that the Aeromonas acute-gastroenteritis isolate set retained
      uniform susceptibility to selected later-line agents, supporting
      susceptibility-guided selection of these drugs.
  - reference: PMID:29205196
    reference_title: >-
      Speciation, clinical profile & antibiotic resistance in Aeromonas species
      isolated from cholera-like illnesses in a tertiary care hospital in north
      India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It was found that 14 per cent of our isolates, none of which were
      Aeromonas trota, were susceptible to amoxicillin.
    explanation: >-
      Documents low amoxicillin susceptibility (86% non-susceptible), supporting
      avoidance of empiric aminopenicillins.
  - reference: PMID:29205196
    reference_title: >-
      Speciation, clinical profile & antibiotic resistance in Aeromonas species
      isolated from cholera-like illnesses in a tertiary care hospital in north
      India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: It was found that 24 (48%) isolates were multidrug resistant.
    explanation: >-
      Records substantial multidrug resistance in this isolate set, supporting a
      susceptibility-guided rather than empiric approach.
  - reference: PMID:38783344
    reference_title: >-
      Phenotypic and genotypic analysis of antimicrobial resistance and
      population structure of gastroenteritis-related Aeromonas isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      Isolates were almost uniformly susceptible to amikacin, gentamicin,
      aztreonam, cefepime, ceftazidime, ciprofloxacin and meropenem.
    explanation: >-
      A gastroenteritis-related Aeromonas survey supports these agents for
      susceptibility-guided treatment while remaining indirect for exact
      A. hydrophila enteritis because the survey contained multiple Aeromonas
      species.
- name: Fluid and Electrolyte Rehydration
  description: >-
    Supportive fluid and electrolyte replacement, by the oral or intravenous
    route, is the cornerstone of management: most immunocompetent cases are
    self-limited and need no antibiotics, and the main hazard of the
    cholera-like secretory presentation is dehydration, which rehydration
    corrects.
  treatment_term:
    preferred_term: fluid and electrolyte rehydration
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Dehydration
    treatment_effect: RESTORES
    description: >-
      Replacing lost fluid and electrolytes corrects the dehydration produced by
      secretory fluid loss.
prevalence:

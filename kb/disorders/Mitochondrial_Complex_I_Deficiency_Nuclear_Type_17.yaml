    Bound to a coarse term because the source is coarse: it reports white matter abnormalities
    in 15 percent without naming a tract, a distribution, or a signal characteristic, and the
    one patient described in detail has an unclassified alteration of the white matter with
    pseudo-cystic appearance. Binding a specific leukoencephalopathy term would manufacture a

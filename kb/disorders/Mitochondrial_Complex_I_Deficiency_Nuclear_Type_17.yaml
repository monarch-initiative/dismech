- name: Bilateral Striatal Neurodegeneration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Symmetrical destruction of the striatum, putamen first. In the deeply phenotyped kindred
    the lesions were cytotoxic, involved proliferation of the lenticulo-striate arteries, and
    spread from putamen to caudate before cavitating with volume loss. Across the published
    literature the putamen was involved in every case in which the basal ganglia were described,
    and the caudate in fewer than half. This tissue selectivity - rather than the enzyme
    deficiency, which is present in fibroblasts and muscle too - is what makes the disease a
    neurological one.

    The cell type bound below is inferred rather than sourced. No NDUFAF6 study names a cell
    type: the imaging and the one published description of the lesion are at tissue level, and
    no neuropathology has been reported for any patient. Medium spiny neurons are the principal
    projection neuron of the striatum and so are the cell the lesion is presumed to destroy, but
    which striatal populations are lost, and in what order, is unknown in this disease.
  cell_types:
  - preferred_term: striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  - preferred_term: putamen
    term:
      id: UBERON:0001874
      label: putamen
  downstream:
  - target: Bilateral Striatal Necrosis on MRI
    causal_link_type: DIRECT
    description: >-
      The imaging finding is the radiological appearance of this tissue lesion, not a separate
      event: the MRI shows the cytotoxic damage, its spread from putamen to caudate, and its
      progression to cavitation and volume loss.
    evidence:

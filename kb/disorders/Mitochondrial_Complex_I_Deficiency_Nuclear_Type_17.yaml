discussions:
- discussion_id: mc1dn17_mortality_discrepancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "progression#Infantile and early childhood onset with subsequent variable course"
  - "prevalence#Worldwide"
  prompt: >-
    Why do the two 2026 sources for MC1DN17 report mortality of 4 percent and 37 percent, is
    age at onset the variable behind the gap, and which figure should a family be given at
    diagnosis?
  proposed_experiments:
  - experiment_id: mc1dn17_onset_stratified_survival
    name: Age-at-onset stratified survival across the pooled NDUFAF6 cohorts
    description: >-
      Pool the individual-level records already published across the 2026 cohort, the 2026
      review and the Japanese registry series, and fit survival and motor-milestone retention
      against age at onset rather than against source. The pooled n is small - on the order of
      50 - but every constituent series reports onset age per patient, so the analysis needs no
      new ascertainment.
    would_support:
    - "progression#Infantile and early childhood onset with subsequent variable course"
    supporting_outcome:
    - >-
      Survival tracking age at onset, with the two cohorts' mortality figures converging once
      stratified, would establish onset age as the prognostic variable and make the 4 versus 37
      percent gap a composition effect rather than a contradiction.
    refuting_outcome:
    - >-
      Mortality differing by source after stratification would leave ascertainment as the
      explanation and confirm that the published-literature figure understates mortality.
  rationale: >-
    Two systematic accounts of this disease were published within weeks of each other and they
    do not agree about the thing families most want to know. The review of 24 published cases
    reports that all but one patient were alive at the time of publication, a mortality of 1 in
    24, and concludes that NDUFAF6 patients have a better prognosis than other nuclear-gene
    Leigh syndrome. The 27-patient cohort reports 12 deaths, 37 percent, with 10 of them before
    12 years.

    Ascertainment is the obvious explanation and the direction is predictable once stated.
    Published single-case reports and small series are written about living patients under
    follow-up, so a review of the published literature under-counts deaths systematically. A
    previously unreported multi-centre cohort assembled from diagnostic services captures
    completed courses. Neither is a population sample.

    But ascertainment is not the whole answer, and the evidence that complicates it is the
    reason this is recorded as open rather than explained. A Japanese national study surveyed
    166 Leigh syndrome patients through a patient registry rather than through the literature -
    which is exactly the design the ascertainment argument calls for - and found that NDUFAF6
    patients had better outcomes than those with variants in other nuclear genes. Its NDUFAF6
    subgroup is small, eight individuals, of whom five retained head control and three had died
    or lost it. So the favourable-prognosis claim survives in a registry-ascertained series, and
    cannot simply be dismissed as a publication artefact of the case-report literature.

    That leaves a sharper question than the one the discrepancy first suggests. The same study
    reports that within NDUFAF6 specifically, later onset went with better outcome - so the
    prognostic variable may be age at onset rather than genotype, and a cohort's mortality would
    then track how much infantile-onset disease it happened to capture. That would explain both
    2026 figures without either being wrong. Testing it needs age-at-onset stratified survival
    across the pooled cohorts, which no published analysis has done.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but one patient were alive at the time of publication; the exception died at 34 months
      (18).
    explanation: The low-mortality figure, from the review of published cases.
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients died and for 10 of them this occurred before 12 years.
    explanation: The high-mortality figure, from the previously unreported cohort.
  - reference: PMID:31967322
    reference_title: "Mortality of Japanese patients with Leigh syndrome: Effects of age at onset and genetic diagnosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with mutations in NDUFAF6, SURF1, and ECHS1 had better outcomes than those with
      mutations in other nDNA encoded genes.
    explanation: >-
      Graded REFUTE against the ascertainment explanation specifically, not against the
      discrepancy. This series was ascertained through a national patient registry rather than
      through the published literature, so it is not subject to the publication bias the
      rationale invokes, and it still finds NDUFAF6 outcomes better than other nuclear
      genotypes.
  - reference: PMID:31967322
    reference_title: "Mortality of Japanese patients with Leigh syndrome: Effects of age at onset and genetic diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant difference in onset age between NDUFAF6 deficient patients who
      maintained head control (N = 5) and patients either deceased or who had lost head control
      (N = 3; P = .004).
    explanation: >-
      The size of the NDUFAF6 subgroup, and the age-at-onset effect within it that makes onset
      age a candidate confounder behind the two cohorts' differing mortality.
  - reference: PMID:31967322
    reference_title: "Mortality of Japanese patients with Leigh syndrome: Effects of age at onset and genetic diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also made inquiry via the Japan Mitochondrial Disease Research Organization Data Bank
      (J‐MO Bank), a Japanese patient registry for mitochondrial disorders
    explanation: >-
      The ascertainment route, which is what makes this series a test of the publication-bias
      explanation rather than another instance of it.
- discussion_id: mc1dn17_renal_phenotype_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#NDUFAF6"
  prompt: >-
    What determines whether a person with biallelic NDUFAF6 variants develops the Leigh syndrome
    phenotype curated here, the Acadian renal Fanconi phenotype, or both?
  rationale: >-
    NDUFAF6 causes two clinically separate diseases. MC1DN17 is Leigh syndrome with striatal
    necrosis. The Acadian variant of Fanconi syndrome is a renal and pulmonary disease -
    proximal tubular dysfunction from birth, progressive chronic kidney disease, pulmonary
    interstitial fibrosis - in a Nova Scotia founder population homozygous for a deep intronic
    allele, and dismech curates it separately as FRTS5 within Fanconi Renotubular Syndrome.

    The boundary is not clean, which is what makes this a gap rather than a settled split. One
    patient in the largest MC1DN17 cohort developed renal Fanconi syndrome and carried that same
    Acadian deep intronic allele, on a Leigh syndrome background. His affected brother died
    before it could be known whether he would have done the same. The cohort authors raise, and
    explicitly decline to settle, the possibility that a more deleterious allele in trans
    modulates renal penetrance. The ClinGen panel notes from the other direction that its members
    know of unpublished compound heterozygotes for the Acadian allele who had a multi-organ
    disorder rather than the Acadian renal phenotype.

    So the two entities may be separated by allele combination, by founder-population modifiers,
    or by neither. Until that is settled the split between this entry and FRTS5 is a curation
    decision that follows the clinical literature, not a demonstrated biological boundary.
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, P1 developed renal Fanconi syndrome and carried the same deep intronic
      NDUFAF6 variant described in a homozygous state in the Acadian population and associated
      with the same clinical condition.
    explanation: >-
      The single patient in whom the two phenotypes and the two allele classes meet, which is
      what makes the boundary uncertain.
  - reference: CGGV:assertion_a9f5bc35-3a3e-481c-86f4-8dd909642f7e-2024-06-20T160000.000Z
    reference_title: NDUFAF6 / mitochondrial disease (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of note, while not yet reported in the medical literature, members of this Expert Panel
      knew of additional cases who were compound heterozygous for this variant in addition to a
      different variant who did not have the Acadian variant of Fanconi syndrome phenotype but
      rather a multiorgan system disorder.
    explanation: >-
      The panel's unpublished observation pointing the same way from the other phenotype, which
      is why the allele-combination hypothesis is worth testing.
notes: >-
  Scope decision: curated as a DISEASE, standalone. dismech curates the MC1DN series as per-gene
  entries - twenty-one numbered types are already standalone files in kb/disorders/ - and
  MC1DN17 is the NDUFAF6 member of that series. It is a MONDO leaf: MONDO:0032622 has one
  parent, MONDO:0100223 (mitochondrial complex I deficiency, nuclear type), which is an ontology
  grouping of the numbered series rather than a dismech entry, and no descendants. It is not a
  subtype of any curated entry.

  On the relationship to Fanconi Renotubular Syndrome, which is the one place this entry could
  have been wrong. NDUFAF6 is already in the KB, as the gene of the FRTS5 subtype of
  Fanconi_Renotubular_Syndrome - the Acadian variant, a renal and pulmonary disease caused by a
  deep intronic founder allele. That is a different disease from this one and it stays where it
  is; this entry does not curate it, does not claim its phenotypes, and does not treat
  MONDO:0032622 as covering it. The two are kept apart because the clinical literature keeps
  them apart, but the boundary is not demonstrated, and the mc1dn17_renal_phenotype_boundary
  discussion records exactly how it is blurred rather than asserting a split the evidence does
  not support.

  On ClinGen, and why two assertions are cited rather than one. The Mitochondrial Disease Gene
  Curation Expert Panel curated NDUFAF6 against Leigh syndrome in 2020 (SOP7, Definitive) and
  then, jointly with the Tubulopathy panel, against primary mitochondrial disease in 2024
  (SOP10, Definitive), the second explicitly lumping both phenotypes into one entity. Both are
  cited as gene-disease validity evidence, which they are at any granularity. Neither MONDO
  target is adopted as this entry's disease term, and that disagreement in granularity is
  recorded rather than resolved.

  On GeneReviews. There is no GeneReviews chapter for MC1DN17 or for NDUFAF6.
  PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview") is the applicable
  overview chapter and is tagged in the top-level references block. It is deliberately not cited
  as evidence anywhere: the cached PubMed record contains only the chapter's statement of
  purpose, with no clinical content and no mention of NDUFAF6, so quoting it would produce a
  snippet that supports nothing.

  On Orphanet. MONDO:0032622 carries no ORPHA cross-reference - its database cross-references
  are DOID:0112078, GARD:0018372, MEDGEN:1648418, OMIM:618239 and UMLS:C4748786 - so there is no
  ORPHA record for this entity to cite.

  On the module. No complex I-specific mechanism module or grouping exists, so this entry
  conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, which is what
  the other MC1DN entries do. Should a complex I module be created, the Isolated Complex I
  Deficiency node is the one to repoint at it.

  On the frequency bands, and why two sources give different numbers. Every band in this entry
  rests on one or both of the two 2026 systematic sources, and they disagree in a consistent
  direction: the review of published cases gives higher rates for the neurological features and
  a much lower mortality than the previously unreported 27-patient cohort. Both effects have the
  same cause - published cases are ascertained through the neurological presentation and written
  about living patients - so the review over-counts the defining features and under-counts
  death. Where the two disagree, the band follows the 27-patient cohort, whose denominator is
  the less selected of the two, and the individual notes give both figures and say which came
  from where. That is why Developmental Regression and Bilateral Striatal Necrosis are FREQUENT
  here although the review reports each as universal: 74 and 67 percent fall in the 30-79 band,
  and those bands should be read as the conservative end of a range whose upper end is 100
  percent. The mortality disagreement is not resolved this way - a registry-ascertained Japanese
  series complicates the ascertainment explanation - and is recorded as a knowledge gap instead.

  A second class of band has no numerator at all. Ataxia, Exercise Intolerance and Muscle
  Weakness rest on a single clause of the ClinGen expert-panel narrative, which lists features
  without counts, and none of the primary reports cached here mentions them. Their bands state
  that a formal expert panel considers the feature characteristic, not a measured rate. They are
  kept because the panel reviewed full texts this entry's sources do not reproduce, and dropping
  a feature a panel lists would be the worse error.

  What is deliberately not curated, and why. There is no biochemical block with reference
  ranges: lactate is curated as phenotypes because that is how the sources report it, and no
  reference interval has been published for this disease. There is no histopathology block: no
  post-mortem neuropathology has been reported for any NDUFAF6 patient, which is also why this
  entry's cell-type binding is marked as inferred. There is no animal_models block - a
  Drosophila C8orf38 homologue, Sicily, is characterised in the literature and is cited by the
  ClinGen panel as model-organism support, but no NDUFAF6 mouse exists, and the fly work is
  named here rather than curated as a model. There are no datasets and no clinical trials; the
  2026 review states that no disease-modifying treatment exists, and the cofactor supplements it
  mentions are discussed for mitochondrial disease generally rather than for this gene.

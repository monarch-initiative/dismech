name: Mitochondrial Complex I Deficiency, Nuclear Type 17
creation_date: "2026-09-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 17
  term:
    id: MONDO:0032622
    label: mitochondrial complex I deficiency, nuclear type 17
description: >-
  Mitochondrial complex I deficiency nuclear type 17 (MC1DN17) is the isolated complex I
  deficiency caused by biallelic variants in NDUFAF6, the gene described in 2008 as the
  uncharacterised open reading frame C8orf38. NDUFAF6 is not a subunit of the enzyme; it is
  an assembly factor acting at the earliest stages of complex I biogenesis.

  The molecular lesion has been defined from two directions that converge. The older account,
  from patient fibroblasts, is that loss of the factor blocks production of the
  mitochondrially encoded ND1 subunit, so early and mid-stage assembly intermediates still
  form but late-stage assembly fails. The newer account, from a deep mutational scan of
  thousands of NDUFAF6 variants coupled to cross-linking mass spectrometry, is more specific:
  NDUFAF6 facilitates incorporation of the core Q-module subunit NDUFS8 into the complex, and
  overexpressing NDUFS8 rectifies NDUFAF6 deficiency. The largest patient cohort reads the
  same way from the gel: on inactivation of NDUFAF6 the Q-module subunit NDUFS3 falls
  dramatically, the N-module subunit NDUFS1 intermediately, and the P-module subunit NDUFB11
  least of all.

  Clinically this is, in nearly every reported patient, Leigh syndrome with a particular
  shape. Onset is in infancy or early childhood with psychomotor regression; the movement
  disorder is dystonia; and the neuroimaging hallmark is bilateral striatal necrosis, the
  putamen being involved in every published case in which the basal ganglia were described.
  Blood lactate is raised. What distinguishes MC1DN17 from Leigh syndrome of most other
  causes is not the presentation but the course: complex I activity is reduced without being
  abolished, residual assembled enzyme is demonstrable in every patient studied, and motor
  function is preserved for longer than in several other genetic subtypes. Survival into
  adulthood is documented.

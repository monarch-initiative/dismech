    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients (21/21) exhibited basal ganglia neuronal degeneration on MRI, and the imaging
      findings met the criteria for “bilateral striatal necrosis” (BSN) (30).
    explanation: The count and the explicit statement that formal BSN criteria were met.
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.

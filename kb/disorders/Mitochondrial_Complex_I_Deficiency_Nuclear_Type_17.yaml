      id: HP:0001276
      label: Hypertonia
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation showed wide phenotypic variability, from mild to severe
      psychomotor regression (74%) most commonly before the age of 5 years, hypotonia (22%),
      movement disorders (30%), and hypertonia (15%).
    explanation: The rate in the largest reported cohort.
- name: Dysphagia
  category: Digestive
  description: >-
    Swallowing difficulty, reported in both Chinese patients and named among the additional
    features that often accompany the Leigh syndrome presentation of this gene.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  notes: >-
    No rate is published. The band reflects that it is named as an additional feature rather
    than a defining one, not a measured proportion.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features often include dystonia, dysphagia, and intermittent metabolic crises
      triggered by concurrent infections.
    explanation: The feature named among those that commonly accompany the core presentation.
- name: Seizure
  category: Neurologic
  description: Epileptic seizures, an uncommon feature in this disease relative to Leigh syndrome generally.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Epileptic seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    Two of 27 patients in the largest cohort, which is 7 percent and so OCCASIONAL. Worth
    recording precisely because it is low: epilepsy is common in Leigh syndrome generally, and
    the cohort authors single this out as observed "only in two patients". Seizures do appear in
    the ClinGen feature list and among the cohort's onset symptoms, so the feature is real; it is
    its rarity relative to other Leigh genotypes that is the finding.
  evidence:
  - reference: PMID:41924699

- name: Loss of NDUFAF6 Assembly Factor Protein
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFAF6 acts at the initial stages of complex I assembly. It is a mitochondria-targeted
    333-amino-acid peripheral membrane protein of the squalene and phytoene synthase family,
    an assignment that is itself informative: sequence and structure suggest it retains some
    enzymatic activity, but one that has diverged considerably from the canonical members of
    that family, so what it actually catalyses here is not established. Not every metazoan has
    an ortholog, which means complex I biogenesis does not require it in all organisms. Losing
    it removes a component from the step at which the nuclear-encoded matrix arm and the
    mtDNA-encoded membrane arm are first brought together.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  downstream:
  - target: Failure of NDUFS8 Incorporation into the Complex I Q Module
    causal_link_type: DIRECT
    description: >-
      The specific biochemical job the factor does, established by deep mutational scanning of
      thousands of NDUFAF6 variants together with cross-linking mass spectrometry.
    evidence:
    - reference: PMID:38720117
      reference_title: Systematic analysis of NDUFAF6 in complex I assembly and mitochondrial disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Guided by these data, biochemical analyses and cross-linking mass spectrometry, we
        discovered that the CIAF NDUFAF6 facilitates incorporation of NDUFS8 into CI and reveal
        that NDUFS8 overexpression rectifies NDUFAF6 deficiency.
      explanation: >-
        The step from absent factor to the specific subunit that fails to be incorporated, with
        the rescue experiment that makes it causal rather than correlative.
  - target: Impaired ND1 Synthesis and Stalled Late-Stage Complex I Assembly
    causal_link_type: DIRECT
    description: >-
      The older and independently derived account of the same block, from patient fibroblasts
      and complementation: without the factor, the mtDNA-encoded ND1 subunit is not made or not
      stabilised, and assembly halts at a defined convergence point.
    evidence:
    - reference: PMID:22019594
      reference_title: Mutations in the gene encoding C8orf38 block complex I assembly by inhibiting production of the mitochondria-encoded subunit ND1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We conclude that C8orf38 is a crucial factor required for the translation and/or
        integration of ND1 into an early-stage assembly intermediate and that mutation of
        C8orf38 disrupts the initial stages of complex I biogenesis.
      explanation: >-
        The authors' own conclusion on what losing the factor does to ND1 and to the initial
        stages of assembly.
  evidence:
  - reference: PMID:28476317
    reference_title: "Evolution, structure and membrane association of NDUFAF6, an assembly factor for NADH:ubiquinone oxidoreductase (Complex I)."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Human NDUFAF6 is a mitochondria-targeted 333-amino acid protein belonging to the family
      of squalene and phytoene synthases.
    explanation: >-
      The protein family, size and subcellular targeting, from the sequence and structural
      analysis that characterised NDUFAF6.
- name: Failure of NDUFS8 Incorporation into the Complex I Q Module
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFS8 is a core subunit of the Q module. Without NDUFAF6 it is not incorporated, and the
    module does not mature. The consequence is visible on patient gels as a module-graded loss
    of subunits: Q-module NDUFS3 falls dramatically, N-module NDUFS1 intermediately, and
    P-module NDUFB11 least. That gradient is itself informative, because it is the known
    turnover order of complex I modules when assembly fails rather than a random loss.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      Too little mature holoenzyme is produced. The cohort data make the key quantitative point
      that the loss is partial in every patient studied.
    evidence:
    - reference: PMID:41924699
      reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Blue native gel electrophoresis demonstrated isolated reductions in CI steady-state
        levels and enzymatic activity across all patients, without complete loss, indicating
        residual functional CI.
      explanation: >-
        The step from failed assembly to reduced holoenzyme, measured across the whole cohort,
        and the residual-activity qualification that the rest of this entry turns on.
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, upon inactivation of NDUFAF6, we found a dramatic reduction of NDUFS3
      belonging to the Q module, an intermediate reduction of NDUFS1 belonging to the N module
      and an even milder decrease of NDUFB11 belonging to the P module.
    explanation: >-
      The module-graded subunit loss in patient material, which is the gel-level signature of a
      Q-module assembly block.
- name: Impaired ND1 Synthesis and Stalled Late-Stage Complex I Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    In fibroblasts from a patient with a C8orf38 mutation, steady-state complex I was almost
    undetectable and biogenesis of the mtDNA-encoded ND1 subunit was defective. Early- and
    mid-stage intermediates still formed; it was late-stage assembly that failed, identifying a
    convergence point in the pathway. Complementation with wild-type C8orf38 restored both ND1
    and complex I.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      The assembly block is what produces the enzyme deficiency, shown by the complementation
      that restores both together.
    evidence:
    - reference: PMID:22019594
      reference_title: Mutations in the gene encoding C8orf38 block complex I assembly by inhibiting production of the mitochondria-encoded subunit ND1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Complementation with wild-type C8orf38 restored the levels of both ND1 and complex I,
        confirming the C8orf38 mutation as the cause of the complex I defect in the patient.
      explanation: >-
        The rescue that localises the enzyme deficiency to this gene and to this assembly step.
  evidence:
  - reference: PMID:22019594
    reference_title: Mutations in the gene encoding C8orf38 block complex I assembly by inhibiting production of the mitochondria-encoded subunit ND1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the absence of ND1 in patient cells, early- and mid-stage intermediate complexes were
      still formed; however, assembly of late-stage intermediates was impaired, indicating a
      convergence point in the assembly process.
    explanation: >-
      Which stage of assembly stalls, which is what distinguishes this node from a general
      statement that assembly is reduced.
- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Too little functioning NADH:ubiquinone oxidoreductase, with the other respiratory chain
    complexes spared. The deficiency is partial rather than complete and the residual activity
    has been quantified: across the reviewed cases, residual respiratory chain complex activity
    was 40 to 86 percent of control in cultured fibroblasts and 28 to 80 percent in muscle.
    That residual enzyme is the most likely explanation for the comparatively preserved motor
    function this disease shows against other Leigh syndrome genotypes, and it is also why a
    near-normal fibroblast assay does not exclude the diagnosis.
  biological_processes:
  - preferred_term: "mitochondrial electron transport, NADH to ubiquinone"
    modifier: DECREASED
    term:
      id: GO:0006120
      label: "mitochondrial electron transport, NADH to ubiquinone"
  downstream:
  - target: Respirasome Depletion
    causal_link_type: DIRECT
    description: >-
      Less monomeric complex I means less of it available to enter respiratory supercomplexes,
      with a matching accumulation of the complex III homodimer that would otherwise be bound
      into them.
    evidence:
    - reference: PMID:41924699
      reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CI deficiency also led to significant respirasome (CI/III2/IV) depletion and
        accumulation of homodimeric complex III, consistent with previously characterized CI
        assembly defects.
      explanation: >-
        The step from holoenzyme deficiency to supercomplex loss, with the complex III
        accumulation that shows it is a redistribution rather than a second primary defect.
  - target: Impaired Mitochondrial ATP Production and Increased Reactive Oxygen Species
    causal_link_type: DIRECT
    description: >-
      The bioenergetic consequence, measured in patient-derived immortalized B lymphocytes.
    evidence:
    - reference: PMID:39720739
      reference_title: Biallelic variants in the NDUFAF6 cause mitochondrial respiratory complex assembly defects associated with Leigh syndrome in probands.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The deficiency of mature super complex of complex I was confirmed in patient-derived
        immortalized B lymphocytes. Meanwhile, cellular ATP production was decreased, and
        mitochondrial ROS was increased.
      explanation: >-
        The step from assembly deficiency to the two downstream bioenergetic readouts, measured
        in the same patient cells.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Residual respiratory-chain complex (RCC) activity was reduced both in cultured
      fibroblasts (n = 9; range 40–86%) and in muscle (n = 6; range 28–80%).
    explanation: >-
      The quantified residual activity in both tissues sampled, which is the numeric basis for
      calling this deficiency partial.
  - reference: PMID:18614015
    reference_title: A mitochondrial protein compendium elucidates complex I disease biology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We validate a subset of these predictions using RNAi, including C8orf38, which we further
      show harbors an inherited mutation in a lethal, infantile CI deficiency.
    explanation: >-
      The founding observation linking this gene to inherited complex I deficiency, from the
      integrative-genomics screen that identified it.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two damaged NDUFAF6 alleles. NDUFAF6 is nuclear-encoded and
    autosomal at 8q22.1, so this is a nuclear recessive mitochondrial disease: sibling
    recurrence risk is one in four and there is no maternal transmission, which is what
    separates counselling here from the mitochondrial-genome causes of complex I deficiency.
    Segregation has been demonstrated directly, in a kindred of three affected siblings
    compound heterozygous for a frameshift and a missense allele, and about half of the
    families in the largest cohort are consanguineous. The one-in-four figure follows from the
    mode of inheritance, which the ClinGen expert panel records as autosomal recessive; it is
    not an observed recurrence rate in these families.
  evidence:
  - reference: CGGV:assertion_f7b6ace1-5b89-41c7-83a6-d6f37826d8c5-2020-11-23T194212.660Z
    reference_title: NDUFAF6 / Leigh syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NDUFAF6 | HGNC:28625 | Leigh syndrome | MONDO:0009723 | AR | Definitive | SOP7 | Mitochondrial Diseases Gene Curation Expert Panel | 2020-11-23T19:42:12.660Z"
    explanation: >-
      The ClinGen Mitochondrial Disease Gene Curation Expert Panel records the mode of
      inheritance as autosomal recessive alongside a Definitive validity classification.
  - reference: PMID:30642748
    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF6 cause isolated bilateral striatal necrosis and progressive dystonia in childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a frameshift novel change (c.554_558delTTCTT; p.Tyr187AsnfsTer65) and a
      pathogenic missense change (c.371T>C; p.Ile124Thr) in the NDUFAF6 gene, which segregated
      with an autosomal recessive inheritance within the family.
    explanation: >-
      Direct demonstration of recessive segregation in a kindred, rather than inference from
      the mode of inheritance alone.
pathophysiology:
- name: Biallelic NDUFAF6 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two damaged copies of NDUFAF6 (formerly C8orf38), which encodes a mitochondrial complex I
    assembly factor. The reported spectrum spans several mutation classes. Across the 24
    patients tallied in the 2026 review, eighteen distinct variants have been reported - ten
    missense, one nonsense, two splice-site, four frameshift and two small in-frame
    duplications - and roughly half of those patients carry a single recurrent missense allele,
    c.371T>C p.Ile124Thr. The largest single cohort adds nineteen further distinct variants
    from eighteen families. Only the canonical transcript NM_152416.4 encodes the
    mitochondrially targeted protein, which is why a deep intronic variant altering isoform
    choice can be pathogenic without changing any coding sequence.
  genes:
  - preferred_term: NDUFAF6
    term:
      id: hgnc:28625
      label: NDUFAF6
  genetic_context:
    genes:
    - preferred_term: NDUFAF6
      term:
        id: hgnc:28625
        label: NDUFAF6
    allele_type: missense, nonsense, frameshift, splice-site and small in-frame duplication variants
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of NDUFAF6 Assembly Factor Protein
    causal_link_type: DIRECT
    description: >-
      The alleles reduce or abolish the assembly factor itself. In the three-sibling kindred
      the protein was undetectable; across the largest cohort the functional studies show a
      deleterious effect on NDUFAF6 protein expression.
    evidence:
    - reference: PMID:30642748
      reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF6 cause isolated bilateral striatal necrosis and progressive dystonia in childhood.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient mutations were associated with the absence of the NDUFAF6 protein and reduced
        activity and assembly of mature complex I in fibroblasts.
      explanation: >-
        The step from allele to missing assembly factor, measured as protein absence in the
        patients' own cells rather than inferred from the enzyme deficiency.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 18 different variants were identified, including 10 missense variants,1

  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral striatal necrosis lesions were the most characteristic features on cranial MRI
      (67%) although white matter abnormalities were also noted (15%), occasionally accompanied
      by cystic formations, suggestive of early neurodevelopmental anomalies.
    explanation: The rate and the qualitative description, which is as specific as the source gets.
environmental:
- name: Intercurrent infection
  description: >-
    Concurrent infection is the named precipitant of the metabolic crises that punctuate this
    disease's course, and avoiding metabolic stressors of this kind is an explicit management
    aim. The mechanism is not measured in any NDUFAF6 study; the general account is that the
    increased energy demand of febrile illness is not met by a cell already running on reduced
    complex I, so the exposure is recorded as exacerbating the existing bioenergetic deficit
    rather than as initiating anything.
  exposure_term:
    preferred_term: intercurrent infection
    term:
      id: ECTO:3000000
      label: exposure to organism
  influences_mechanisms:
  - target: Impaired Mitochondrial ATP Production and Increased Reactive Oxygen Species
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Infection precipitates decompensation in a patient whose baseline ATP production is
      already reduced. The intermediates are unknown: no NDUFAF6 study measures bioenergetic
      state during an infective episode, so the link rests on the reported clinical association
      between infection and crisis plus the management advice that follows from it.
    evidence:
    - reference: PMID:41982415
      reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additional features often include dystonia, dysphagia, and intermittent metabolic crises
        triggered by concurrent infections.
      explanation: >-
        The clinical association between infection and crisis. It is INDIRECT because the source
        reports the trigger, not the bioenergetic measurement this edge's target names.
  - target: Metabolic Crisis Triggered by Intercurrent Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The source states the precipitating relationship directly: the crises are triggered by
      concurrent infections. Unlike the bioenergetic edge above, no inference step is involved -
      this is the association the literature reports, at the level at which it reports it.
    evidence:
    - reference: PMID:41982415
      reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        intermittent metabolic crises triggered by concurrent infections
      explanation: >-
        The precipitating relationship, stated by the source in the same words this edge asserts.
  notes: >-
    Bound to ECTO:3000000 exposure to organism, which is the nearest true ancestor rather than a
    match. ECTO has no class for infection or infectious agent as such: searching ECTO via OLS
    for "infection" returns only ECTO:2000053 exposure to Human Papillomavirus Infection and
    ECTO:3000104 exposure to Infectious bronchitis virus, "exposure to infectious agent",
    "biotic" and "febrile" return no ECTO term at all, and "virus" returns ECTO:3000001 exposure
    to virus whose parent is ECTO:3000000. ECTO:3000001 was rejected because the source says
    "concurrent infections" without naming a class of pathogen, and childhood infections are
    frequently bacterial, so binding the viral child would narrow the claim past its source. The
    specificity is carried in preferred_term instead.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management remains primarily supportive and symptomatic, encompassing seizure control,
      management of dystonia, nutritional support, avoidance of metabolic stressors (e.g.,
      infections), and individualized rehabilitation
    explanation: >-
      That infection is treated as a modifiable metabolic stressor in this disease, which is what
      makes the exposure worth recording rather than incidental.
genetic:
- name: NDUFAF6
  gene_term:
    preferred_term: NDUFAF6
    term:
      id: hgnc:28625
      label: NDUFAF6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFAF6 (HGNC:28625, "NADH:ubiquinone oxidoreductase complex assembly factor 6") is at
    8q22.1. Its previous symbol is C8orf38, the name under which the gene was described in 2008
    and the name used in the older assembly literature; the HGNC record also lists the aliases
    lncREST and MGC40214.

    The ClinGen Mitochondrial Disease Gene Curation Expert Panel has curated this gene twice,
    and the pair is worth reading together. In April 2020 (SOP7) it classified NDUFAF6 against
    Leigh syndrome (MONDO:0009723) as Definitive. In June 2024 (SOP10), jointly with the
    Tubulopathy Expert Panel, it re-curated the gene against primary mitochondrial disease
    (MONDO:0044970), explicitly lumping the NDUFAF6 phenotype - including the Acadian renal
    presentation - into one entity under the ClinGen Lumping and Splitting Framework. dismech
    splits the same biology per gene and per phenotype, so neither ClinGen target is this
    entry's disease term. Both assertions are cited as gene-disease validity evidence, which
    they are at any granularity; nothing here depends on adopting either MONDO identifier.
  evidence:
  - reference: CGGV:assertion_f7b6ace1-5b89-41c7-83a6-d6f37826d8c5-2020-11-23T194212.660Z
    reference_title: NDUFAF6 / Leigh syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NDUFAF6 | HGNC:28625 | Leigh syndrome | MONDO:0009723 | AR | Definitive | SOP7 | Mitochondrial Diseases Gene Curation Expert Panel | 2020-11-23T19:42:12.660Z"
    explanation: >-
      The expert-panel validity classification against Leigh syndrome, which is the strongest
      available statement that this gene causes this disease.
  - reference: CGGV:assertion_f7b6ace1-5b89-41c7-83a6-d6f37826d8c5-2020-11-23T194212.660Z
    reference_title: NDUFAF6 / Leigh syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This curation included eight unique variants identified in seven cases from seven
      publications (PMIDs: 18614015, 30642748, 29531337, 27623250, 28639102, 31967322,
      32020600). Segregation data includes 3 affected individuals from one kindred (PMID:
      30642748).
    explanation: >-
      The case and segregation evidence the panel scored, which is what makes the Definitive
      call auditable.
  - reference: PMID:27623250
    reference_title: Exome sequencing coupled with mRNA analysis identifies NDUFAF6 as a Leigh gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation assay underlined a recovery of complex I activity after transduction of
      the wild-type gene.
    explanation: >-
      The rescue in the patient's own cells, which is what makes this a mechanism rather than a
      statistical association.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists and no population-based denominator has been published for
    this gene. The literature gives two overlapping tallies from 2026: a systematic review
    counting 24 MC1DN17 cases reported through December 2025, and a single cohort of 27
    patients from 18 previously unreported families, whose authors put the total ever reported
    at fewer than 50. The review and the cohort do not overlap, so the two together are a floor
    of roughly 50 rather than either figure alone.
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, fewer than 50 patients with NDUFAF6-related mitochondrial disease have been
      reported, displaying a broad phenotypic spectrum ranging from early-onset
      neurodevelopmental regression to milder, more chronic presentations.
    explanation: The only stated total for the disease as a whole in the literature.
progression:
- phase: Infantile and early childhood onset with subsequent variable course
  notes: >-
    Onset is in infancy or early childhood, with regression of acquired milestones. The course
    that follows is strikingly variable and is not predicted by genotype. Some patients die
    within the first year; others survive into adulthood with a relatively stable course, and
    about 22 percent of the largest cohort passed 18 years. The variability occurs within
    families as well as between them: in one family two siblings with the same genotype both
    had early metabolic decompensation, from which one recovered completely and the other did
    not.
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While some patients (P2, P10, P11, P17, P19, P22) died within the first year of life,
      others (P1, P7, P8, P9, P13, P14) survived into later years, with some reaching adulthood
      and remaining clinically stable.
    explanation: Both poles of the course, with the individual patients at each.
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, no clear genotype–phenotype correlation has been observed. Even carriers of
      different types of variants may present consistent clinical manifestations.
    explanation: >-
      That the variability is not explained by genotype, which is the reason prognosis cannot
      currently be given from the sequencing result.
diagnosis:
- name: Exome or mitochondrial gene panel sequencing
  description: >-
    Every reported patient was diagnosed by sequencing. NDUFAF6 belongs on a nuclear-gene Leigh
    syndrome spectrum panel and on a childhood-onset basal ganglia neurodegeneration panel. One
    diagnostic caution is specific to this gene and is worth knowing before a panel is called
    negative: the pathogenic allele may be non-coding. The Acadian allele is deep intronic, and
    in one Leigh syndrome patient the second allele was never found on exome, the diagnosis
    resting instead on mono-allelic expression demonstrated by mRNA analysis.
  evidence:
  - reference: PMID:27623250
    reference_title: Exome sequencing coupled with mRNA analysis identifies NDUFAF6 as a Leigh gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This paper confirms NDUFAF6 as a genuine morbid gene and proposes the coupling of exome
      sequencing with mRNA analysis as a method useful for enhancing the exome sequencing
      detection rate when the simple application of classical inheritance models fails.
    explanation: >-
      The authors' own statement of the diagnostic limitation and the RNA-based remedy, which is
      the caution recorded here.
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, two unrelated Chinese patients were diagnosed with MC1DN17 after
      whole-exome sequencing (WES) revealed two NDUFAF6 gene variants.
    explanation: The diagnostic route in the two most recently reported patients.
- name: Brain MRI with magnetic resonance spectroscopy
  description: >-
    Symmetrical basal ganglia lesions meeting bilateral striatal necrosis criteria, with the
    putamen involved first. A lactate peak on spectroscopy accompanied the imaging in every case
    for which spectroscopy was reported, and the combination of BSN with brainstem involvement
    and an MRS lactate peak is what points to a mitochondrial cause rather than one of the other
    causes of striatal necrosis.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to other etiologies, LS-associated BSN is often accompanied by brainstem
      involvement and an MRS lactate peak, which are highly suggestive findings (30). Among the
      available clinical data from these patients, all four cases exhibited a characteristic MRS
      lactate peak.
    explanation: >-
      The imaging triad that distinguishes this from other causes of striatal necrosis, and the
      count of patients in whom the spectroscopy finding was present.
- name: Complex I enzymology and blue-native gel analysis of assembly
  description: >-
    Spectrophotometric respiratory chain enzyme assay in fibroblasts or muscle, with blue-native
    PAGE to show the assembly defect directly. The caution this disease carries is that residual
    activity is substantial - up to 86 percent of control in fibroblasts and 80 percent in
    muscle in the reviewed series - so a mildly abnormal or near-normal assay does not exclude
    the diagnosis when the genotype or the imaging points to it. The limiting case is published:
    of two adults with mild splice-variant Leigh syndrome, one had only slightly reduced complex
    I activity and the other had frankly normal activity, so the enzyme assay was uninformative
    in the patient it would have had to identify.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Residual respiratory-chain complex (RCC) activity was reduced both in cultured fibroblasts
      (n = 9; range 40–86%) and in muscle (n = 6; range 28–80%).
    explanation: >-
      The upper end of the residual-activity range in both tissues, which is the basis of the
      caution stated here.
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blue native gel electrophoresis demonstrated isolated reductions in CI steady-state levels
      and enzymatic activity across all patients, without complete loss, indicating residual
      functional CI.
    explanation: The native-gel result across the whole cohort and the residual-activity finding.
  - reference: PMID:33097395
    reference_title: Biallelic variants in two complex I genes cause abnormal splicing defects in probands with mild Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial assays revealed slightly reduced complex I activity in one proband and
      normal complex I activity in the other.
    explanation: >-
      The published case in which the enzyme assay was normal despite molecularly confirmed
      disease, which is the strongest form of the caution this entry records.
experimental_models:
- name: NDUFAF6 deep mutational scan in knockout cells
  experimental_model_type: CELL_LINE
  description: >-
    A systematic functional assay of thousands of NDUFAF6 variants on a knockout background,
    coupled to biochemical analysis and cross-linking mass spectrometry. It is the experiment
    that defined what the protein does, and it doubles as a clinical variant-interpretation
    resource: it provided experimental support of pathogenicity for seven novel variants and
    functional evidence for over 5,000 more.
  modeled_mechanisms:
  - target: Failure of NDUFS8 Incorporation into the Complex I Q Module
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The scan plus cross-linking mass spectrometry is what localised NDUFAF6's function to
      NDUFS8 incorporation, and the NDUFS8-overexpression rescue is what made that causal.
    limitations: >-
      A cell line is not a striatal neuron. The assay ranks alleles on complex I competence and
      says nothing about why the basal ganglia are the tissue that fails, nor about the
      residual-activity threshold a neuron tolerates. Its clinical value is variant
      interpretation, not prognosis.
    evidence:
    - reference: PMID:38720117
      reference_title: Systematic analysis of NDUFAF6 in complex I assembly and mitochondrial disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To address these challenges, we devised a deep mutational scanning approach to
        systematically assess the function of thousands of NDUFAF6 genetic variants.
      explanation: The design of the assay this model entry describes.
    - reference: PMID:38720117
      reference_title: Systematic analysis of NDUFAF6 in complex I assembly and mitochondrial disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our data further provide experimental support of pathogenicity for seven novel NDUFAF6
        variants associated with human pathology and introduce functional evidence for over
        5,000 additional variants.
      explanation: The scale of the variant coverage and its stated clinical application.
- name: NDUFAF6 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from patients, complemented with the wild-type gene. This is the experiment that
    made NDUFAF6 a disease gene and it has been repeated independently across the reports: in the
    2011 C8orf38 characterisation, in the 2016 Leigh gene identification, and in the 2019
    three-sibling kindred.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Supplying the wild-type gene to the patient's own cells is what localises the enzyme
      deficiency to NDUFAF6 rather than to a coincidental variant, and it was the basis on which
      several of the reported alleles were called pathogenic.
    limitations: >-
      Fibroblasts are not neurons, and the affected structures - striatum, brainstem - have
      never been studied directly in this disease. The rescue establishes causality and says
      nothing about tissue selectivity. The fibroblast assay also under-reads the defect: the
      reviewed series found residual activity up to 86 percent of control in fibroblasts.
    evidence:
    - reference: PMID:22019594
      reference_title: Mutations in the gene encoding C8orf38 block complex I assembly by inhibiting production of the mitochondria-encoded subunit ND1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Complementation with wild-type C8orf38 restored the levels of both ND1 and complex I,
        confirming the C8orf38 mutation as the cause of the complex I defect in the patient.
      explanation: The rescue and what it restored, in the founding functional characterisation.
    - reference: PMID:30642748
      reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF6 cause isolated bilateral striatal necrosis and progressive dystonia in childhood.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By functional complementation assay, the mutant phenotype was rescued by the canonical
        version of the NDUFAF6.
      explanation: >-
        The independent repeat of the rescue, and the point that it is the canonical
        mitochondrially targeted isoform that rescues.
treatments:
- name: Supportive and symptomatic care
  therapeutic_modality: OTHER
  description: >-
    There is no disease-modifying treatment. Management is supportive: the 2026 review states
    this explicitly after surveying every reported case. The one published account of active
    management in a single patient describes physical therapy and a nutrient cocktail, under
    which the physical impairment nonetheless gradually worsened - which is recorded here
    because it is the only reported outcome of treatment in this disease, not because it
    recommends the approach.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are currently no disease-modifying treatments available; only supportive care can be
      provided.
    explanation: >-
      The explicit statement that no disease-modifying option exists, from the most recent
      systematic review of the disease.
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management remains primarily supportive and symptomatic, encompassing seizure control,
      management of dystonia, nutritional support, avoidance of metabolic stressors (e.g.,
      infections), and individualized rehabilitation
    explanation: >-
      The components the review names, which is what "supportive care" consists of in this
      disease rather than a generic label.
  - reference: PMID:35664867
    reference_title: "NDUFAF6-Related Leigh Syndrome Caused by Rare Pathogenic Variants: A Case Report and the Focused Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband underwent physical therapy and nutrient cocktail therapy, but his physical
      impairment gradually worsened.
    explanation: >-
      The only reported treatment course and its outcome in a single patient, including that the
      impairment progressed under it.
- name: Avoidance of metabolic stressors
  therapeutic_modality: BEHAVIORAL
  description: >-
    Avoiding the precipitants of metabolic decompensation, infection foremost among them, with
    prompt treatment of intercurrent illness. This is the one management measure in this disease
    that acts on the mechanism rather than on a symptom, since it targets the acute demand that
    a complex I-deficient cell cannot meet. No trial supports it in NDUFAF6 disease; it is
    recommended practice, and is recorded as such.
  treatment_term:
    preferred_term: avoidance of metabolic stressors
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management remains primarily supportive and symptomatic, encompassing seizure control,
      management of dystonia, nutritional support, avoidance of metabolic stressors (e.g.,
      infections), and individualized rehabilitation
    explanation: >-
      The recommendation and the example of a stressor it names, from the systematic review of
      every reported case.
- name: Dystonia management and rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Symptomatic management of the movement disorder together with individualized
    rehabilitation, nutritional support and seizure control. The single published account of
    active management in this disease describes physical therapy and a nutrient cocktail under
    which the impairment nonetheless progressed, so the aim is function and comfort rather than
    alteration of the course.
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management remains primarily supportive and symptomatic, encompassing seizure control,
      management of dystonia, nutritional support, avoidance of metabolic stressors (e.g.,
      infections), and individualized rehabilitation
    explanation: The management components named for this disease.
  - reference: PMID:35664867

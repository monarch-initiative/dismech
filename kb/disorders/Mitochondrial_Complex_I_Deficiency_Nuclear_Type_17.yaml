    snippet: >-
      Epilepsy was observed only in two patients (#7: P11; #17: P26), whereas optic nerve
      atrophy in three (#15: P23; #16: P24, P25).
    explanation: The count of affected patients out of the 27-patient cohort.
- name: Cerebral White Matter Abnormality
  category: Neurologic
  description: >-
    White matter change on MRI, the alternative imaging pattern to striatal necrosis in a
    minority of patients, sometimes with a pseudo-cystic appearance and corpus callosum
    involvement.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: White matter abnormality with pseudo-cystic appearance
    term:
      id: HP:0002500
      label: Abnormal cerebral white matter morphology
    coarse_binding_basis: SOURCE_UNSPECIFIED

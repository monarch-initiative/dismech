phenotypes:
- name: Decreased Activity of Mitochondrial Complex I
  category: Metabolic
  description: >-
    The defining biochemical finding, measured in cultured fibroblasts and in skeletal muscle.
    The deficiency is isolated: the other respiratory chain complexes are not reported as
    reduced, and it is partial in every patient in whom it has been quantified.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex I
    term:
      id: HP:0011923
      label: Decreased activity of mitochondrial complex I
  notes: >-
    OBLIGATE because it is the entity's defining criterion, which also means the band carries
    no information about penetrance. Not wired into the pathograph: it restates the Isolated
    Complex I Deficiency pathophysiology node, and an edge between a node and its own
    restatement is the self-referential collapse check-entity-refs exists to catch. It is
    recorded as a phenotype so the claim carries its HP binding.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Residual respiratory-chain complex (RCC) activity was reduced both in cultured
      fibroblasts (n = 9; range 40–86%) and in muscle (n = 6; range 28–80%).
    explanation: The measurement in both sampled tissues, with the residual activity quantified.
- name: Developmental Regression
  category: Neurologic
  description: >-
    Loss of previously acquired motor milestones and of language, the presenting feature in
    nearly every reported patient and the one that defines the onset of the disease. Onset is
    in infancy or early childhood, most commonly before the age of five.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Psychomotor regression
    term:
      id: HP:0002376
      label: Developmental regression
  notes: >-
    The two largest sources disagree, and the disagreement is informative rather than a defect
    in either. The 24-case review describes regression as universal, which would be OBLIGATE or
    VERY_FREQUENT; the 27-patient cohort reports psychomotor regression in 74 percent, which is
    FREQUENT. The band follows the cohort, because the review counts published cases and those
    are ascertained through the neurological presentation, so its denominator is enriched for
    exactly this feature. Read FREQUENT as the conservative end of a range whose upper end is
    100 percent, not as a settled rate.
  evidence:
  - reference: PMID:41982415
    reference_title: Clinical and genetic analysis of Chinese patients with Leigh syndrome caused by biallelic loss-of-function variants of the NDUFAF6 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals exhibited pronounced neurodevelopmental regression during infancy or early
      childhood (7 months to 6 years), characterized by the loss of previously acquired motor
      milestones, dystonia, and significant delay or loss of language.
    explanation: >-
      The feature, its age window, and what is lost, across every case reported to that point.
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation showed wide phenotypic variability, from mild to severe
      psychomotor regression (74%) most commonly before the age of 5 years, hypotonia (22%),
      movement disorders (30%), and hypertonia (15%).
    explanation: >-
      The rate in the largest single cohort, which is the lower of the two published readings.
- name: Dystonia
  category: Neurologic
  description: >-
    The characteristic movement disorder. It typically begins as gait dystonia and progresses
    to generalised dystonia, often with dysarthria and eventual loss of ambulation. Onset is
    early - median around three years in the largest cohort, around five in the published
    literature.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Generalized dystonia
    term:
      id: HP:0001332
      label: Dystonia
  notes: >-
    FREQUENT rather than VERY_FREQUENT. The published-case rate of 71 percent and the cohort's
    41 percent are both within the FREQUENT band's 30 to 79 percent range, so unusually for
    this entry the two sources agree on the band. The gap between them is the same
    ascertainment effect as for Developmental Regression: the published cases include the
    series titled for dystonia.
  sequelae:
  - target: Dysarthria
    description: >-
      Severe dysarthria accompanies the movement disorder in the families in which it was
      described. The causal direction here is the curator's inference, not the source's claim:
      the source says "often accompanied by", which is co-occurrence. Dystonic dysarthria from
      orofacial and laryngeal involvement is the clinically expected reading in a generalised
      dystonia, but these patients also have the language loss of the developmental regression,
      and no source separates the two contributions.
    evidence:
    - reference: PMID:41924699
      reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        movement disorders such as dystonia, bradykinesia, and spastic–dystonic tetraparesis
        were present, often accompanied by severe dysarthria and eventual loss of ambulation,
        frequently leading to wheelchair dependence
      explanation: >-
        The source pairs the dysarthria with the movement disorder in the same clause, which is
        what this edge asserts.
  - target: Loss of Ambulation
    description: >-
      The motor endpoint of the progressive movement disorder, reaching wheelchair dependence.
    evidence:
    - reference: PMID:41924699
      reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        movement disorders such as dystonia, bradykinesia, and spastic–dystonic tetraparesis
        were present, often accompanied by severe dysarthria and eventual loss of ambulation,
        frequently leading to wheelchair dependence
      explanation: >-
        The source states loss of ambulation as the eventual outcome of the movement disorder,
        which is the causal direction this edge records.
  evidence:
  - reference: PMID:41924699
    reference_title: Neurological manifestations and genotype-phenotype correlations in NDUFAF6-associated mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized dystonia was reported in 71% of published cases, with onset typically
      occurring between 4 and 11 years of age (median: 5.4 years). In our cohort, generalized
      dystonia was present in 41% of cases, with a similarly early onset consistent with the
      literature (range: 14 months to 10 years; median: 3 years).
    explanation: >-
      Both rates and both onset distributions, from the source that reports them side by side.
  - reference: PMID:30642748
    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF6 cause isolated bilateral striatal necrosis and progressive dystonia in childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three siblings developed gait dystonia in infancy followed by rapid progression to
      generalised dystonia and psychomotor regression.
    explanation: The progression from focal gait dystonia to the generalised form, in one kindred.
- name: Bilateral Striatal Necrosis on MRI
  category: Neurologic
  description: >-
    The neuroimaging hallmark: symmetrical basal ganglia lesions meeting published criteria for
    bilateral striatal necrosis. It is the finding that identifies the disease radiologically
    and it is present in every published case in which basal ganglia imaging was reported.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Bilateral striatal necrosis
    term:
      id: HP:0012128
      label: Basal ganglia necrosis
  notes: >-
    Same split as Developmental Regression and resolved the same way: 21 of 21 in the reviewed
    published cases against 67 percent of the 27-patient cohort, and the band follows the
    cohort. The cohort figure is the proportion in whom this was the characteristic MRI feature,
    with white matter change the finding in the others, so the two are measuring slightly
    different things as well as different populations. Bound to HP:0012128 Basal ganglia
    necrosis, which is HPO's nearest term - there is no HPO term for bilateral striatal necrosis
    specifically, and the striatal restriction is carried in preferred_term rather than
    manufactured as an ontology match.
  evidence:

- name: Quinidine
  description: >-
    Quinidine is used as antiarrhythmic pharmacotherapy to suppress recurrent
    short-coupled ventricular fibrillation and electrical storms in familial
    and idiopathic ventricular fibrillation, typically as an adjunct to ICD
    therapy (used in 25 carriers in the Dutch DPP6 cohort, predominantly for
    recurrent VF). By blocking the transient outward potassium current (Ito),
    quinidine directly counteracts the Purkinje Ito gain of function in DPP6
    carriers.

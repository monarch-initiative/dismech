treatments:
- name: Implantable cardioverter-defibrillator placement
  description: >-
    Implantable cardioverter-defibrillator (ICD) implantation is the mainstay
    of secondary prevention after aborted cardiac arrest and age- and
    sex-stratified primary prevention in presymptomatic DPP6 risk-haplotype
    carriers (typically offered from ages 16-17 in males and 25-27 in females).
    In long-term Dutch DPP6 cohort follow-up (137 implanted carriers), 10 of
    109 primary-prevention recipients received 34 appropriate shocks with zero
    deaths during follow-up.

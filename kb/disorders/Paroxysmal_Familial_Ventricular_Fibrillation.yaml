notes: >-
  Curated as the gene-axis lumped root for paroxysmal familial ventricular
  fibrillation (MONDO:0100234) with two MONDO-defined subtypes: type 1
  (MONDO:0011376, SCN5A-associated) and type 2 (MONDO:0013063, chromosome 7q36
  DPP6 risk haplotype). No ClinGen gene-disease validity assertion exists for
  MONDO:0100234 or its subtypes. Allelic SCN5A cardiac disorders with distinct
  electrocardiographic or conduction phenotypes (Brugada syndrome, long QT
  syndrome type 3, familial atrial fibrillation, and progressive cardiac
  conduction disease) are curated separately. In DPP6 risk-haplotype carriers,
  class I/III sodium-channel-blocking agents such as ajmaline (used in Brugada
  provocation testing) or amiodarone can paradoxically precipitate short-coupled
  VF storms by reducing inward sodium current against unopposed Purkinje Ito
  (PMID:37498467).

name: Paroxysmal Familial Ventricular Fibrillation
creation_date: '2026-06-14T00:00:00Z'
updated_date: '2026-11-12T19:00:00Z'
description: >-
  Paroxysmal familial ventricular fibrillation is an autosomal dominant primary
  electrical disease (cardiac channelopathy) in which spontaneous ventricular
  fibrillation arises in a structurally normal heart, without the resting
  electrocardiographic features of long QT, short QT, or Brugada syndrome. It
  constitutes the familial, Mendelian subset of idiopathic ventricular
  fibrillation (IVF), in which malignant short-coupled premature ventricular
  complexes, polymorphic ventricular tachyarrhythmias, syncope, and aborted or
  fatal sudden cardiac death occur at a young age despite a normal baseline
  electrocardiogram and structurally normal myocardium. Two gene-defined loci
  are recognized: an SCN5A-associated form (type 1) altering cardiac NaV1.5
  sodium-channel gating and current, and a DPP6-associated form (type 2) caused
  by a chromosome 7q36 risk haplotype that drives marked myocardial
  overexpression of DPP6, selectively augmenting the Purkinje-fiber transient
  outward potassium current (Ito) and accelerating Purkinje repolarization.
synonyms:
- PFVF
- Familial idiopathic ventricular fibrillation
- Paroxysmal familial ventricular fibrillation
- idiopathic ventricular fibrillation, non Brugada type
- paroxysmal ventricular fibrillation
- ventricular fibrillation, paroxysmal familial

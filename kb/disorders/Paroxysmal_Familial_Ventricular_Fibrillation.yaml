    Steep local dispersion of repolarization between Purkinje fibers and
    adjacent working ventricular myocardium creates a concealed
    early-repolarization substrate. Short-coupled premature ventricular
    complexes arising predominantly from the lower right ventricular Purkinje
    network act as triggers that initiate rapid polymorphic ventricular
    tachyarrhythmia and reentry, characteristically at rest and modulated by
    labile autonomic tone.

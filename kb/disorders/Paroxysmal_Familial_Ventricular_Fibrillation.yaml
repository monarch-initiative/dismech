  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  description: >-
    Paroxysmal familial ventricular fibrillation originates in an inherited
    cardiac ion-channel defect in a structurally normal heart. In the type 1
    form, SCN5A variants perturb the pore-forming cardiac sodium channel
    (NaV1.5) and inward sodium current; in the type 2 form, a chromosome 7q36
    risk haplotype drives a ~20-fold myocardial increase in DPP6, an accessory
    regulatory subunit of the Kv4.3 transient outward potassium channel. Both
    converge on an inherited primary electrical lesion rather than a structural
    cardiomyopathy.

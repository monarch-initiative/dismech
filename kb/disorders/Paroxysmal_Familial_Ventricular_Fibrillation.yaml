- name: Accelerated Purkinje Repolarization and Altered Excitability
  biological_scale: CELLULAR
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: amplifier
  description: >-
    The molecular lesion translates into altered cellular electrophysiology. In
    the DPP6 (type 2) form, DPP6 overexpression selectively augments
    Purkinje-fiber Kv4.3/NCS-1 transient outward current (where KChIP2 is
    weakly expressed) without altering bulk ventricular muscle Ito, deepening
    phase 1 and markedly accelerating Purkinje action-potential repolarization
    while leaving the resting surface ECG normal; in the SCN5A (type 1) form,
    altered sodium-channel gating changes cellular excitability and recovery.

name: Neurodevelopmental Disorder With Intention Tremor, Pyramidal Signs, Dyspraxia, And Ocular Anomalies
creation_date: '2026-10-14T00:00:00Z'
category: Mendelian
description: >-
  Neurodevelopmental disorder with intention tremor, pyramidal signs, dyspraxia,
  and ocular anomalies (MONDO:0859274) is an autosomal recessive syndromic
  neurodevelopmental disorder delineated in five adult male individuals from
  three unrelated Finnish families homozygous for the hypomorphic founder
  missense variant c.551T>C p.(Val184Ala) in SMG9. SMG9 encodes a regulatory
  subunit of the SMG1-SMG8-SMG9 kinase complex that phosphorylates UPF1 during
  nonsense-mediated mRNA decay (NMD). Whereas biallelic loss-of-function
  variants in SMG9 cause severe, often lethal heart and brain malformation
  syndrome (HBMS; MONDO:0014833), homozygosity for p.(Val184Ala) preserves
  SMG9 transcript stability and canonical premature termination codon-triggered
  NMD while perturbing the SMG9 nucleotide-binding G-domain and altering
  endogenous NMD-regulated transcript expression, including upregulation of
  SMOX, OSBP2, GPX3, RAP1GAP, HEY1, and MAP1B and downregulation of ZNF155 and
  TUBB2A. Affected individuals have normal life expectancy, independent
  ambulation, mild-to-moderate intellectual disability, markedly delayed speech
  and language development, oral motor dyspraxia, intention tremor,
  dysdiadochokinesis, childhood ataxia and frequent falls, lower-limb muscular
  hypertonia with ankle clonus and brisk patellar reflexes, strabismus
  (exotropia and vertical strabismus), interictal epileptiform EEG discharges
  without clinical epilepsy, pes planovalgus, recurrent childhood otitis media,
  mild facial dysmorphism, and low-penetrance congenital heart defects.
synonyms:
- neurodevelopmental disorder with intention tremor, pyramidal signs, dyspraxia, and ocular anomalies
- SMG9 p.(Val184Ala)-related neurodevelopmental disorder
- mild SMG9-related syndromic intellectual disability

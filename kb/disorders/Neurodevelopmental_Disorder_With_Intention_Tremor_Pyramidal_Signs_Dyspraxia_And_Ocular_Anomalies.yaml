differential_diagnoses:
- name: Heart and Brain Malformation Syndrome (Classic Biallelic Loss-of-Function SMG9 Syndrome)
  disease_term:
    preferred_term: heart and brain malformation syndrome
    term:
      id: MONDO:0014833
      label: heart and brain malformation syndrome
  description: >-
    Heart and brain malformation syndrome (HBMS; OMIM:616920, MONDO:0014833) is
    the severe allelic SMG9 disorder caused by homozygous loss-of-function
    variants or compound heterozygous variants. Classic HBMS is characterized by
    congenital heart defects (such as ventricular septal defect), major
    structural brain abnormalities, severe intellectual disability, inability to
    walk, growth restriction, microcephaly, ocular malformations, and high
    infant/childhood mortality.
  distinguishing_features:
  - "Homozygosity for the hypomorphic missense allele SMG9 c.551T>C p.(Val184Ala) versus biallelic loss-of-function SMG9 variants in classic HBMS."
  - "Normal survival into adulthood (all 5 reported patients aged 24-56 years), independent ambulation, and spoken language in MONDO:0859274, whereas patients with homozygous loss-of-function mutations show severe intellectual disability (4/4) and inability to walk (3/3)."
  - "Low penetrance of congenital heart defects (1/5, 20%) and brain MRI malformations (1/5, 20% mild ventriculomegaly/white matter paucity) and normal growth (4/5) in MONDO:0859274 versus ventricular septal defect (6/6), brain abnormalities (5/5), microcephaly (5/5), and growth restriction (3/3) in homozygous loss-of-function SMG9 patients."
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The milder phenotype in patients with homozygous damaging SMG9 c.551T > C missense variant, compared to the phenotypes in the previously reported patients with biallelic loss-of-function variants, suggests that SMG9 c.551T > C could be a hypomorphic allele resulting in milder developmental outcome."
    explanation: >-
      Directly contrasts the milder clinical phenotype of homozygous SMG9
      c.551T>C p.(Val184Ala) with biallelic loss-of-function SMG9 variants.
  - reference: PMID:27018474
    reference_title: "Mutations in SMG9, Encoding an Essential Component of Nonsense-Mediated Decay Machinery, Cause a Multiple Congenital Anomaly Syndrome in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we report two consanguineous families in which a similar pattern of congenital anomalies was found to be most likely caused by homozygous loss-of-function mutations in SMG9, encoding an essential component of the SURF complex that generates phospho-UPF1, the single most important step in NMD."
    explanation: >-
      Defines the severe biallelic loss-of-function SMG9 multiple congenital
      anomaly syndrome (HBMS).
  - reference: PMID:35321723
    reference_title: "Identification of a novel compound heterozygous SMG9 variants in a Chinese family with heart and brain malformation syndrome using whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 6 patients with homozygous missense variants, some milder phenotypes were observed, including independent walking (5/6), normal speech (5/6), mild to moderate intellectual disability (5/6), and normal growth (6/6). We also noticed that only one of these patients had a brain malformation, and two had congenital heart disease. While in patients with homozygous loss-of-function mutations, severe intellectual disability (4/4), inability to walk (3/3), ventricular septal defect (6/6), growth Restriction (3/3), microcephaly (5/5), and brain abnormalities (5/5) were observed."
    explanation: >-
      Summarizes the genotype-phenotype correlation across published SMG9
      patients, contrasting severe homozygous loss-of-function HBMS with the
      milder homozygous missense cohort.
- name: Alzahrani-Kuwahara Syndrome (SMG8-Related Syndromic Neurodevelopmental Disorder)
  disease_term:
    preferred_term: Alzahrani-Kuwahara syndrome
    term:
      id: MONDO:0859136
      label: Alzahrani-Kuwahara syndrome
  description: >-
    Alzahrani-Kuwahara syndrome (MONDO:0859136; OMIM:619268) is caused by
    biallelic deleterious variants in SMG8, which encodes the direct binding
    partner of SMG9 within the SMG1-SMG8-SMG9 complex. It presents with severe
    global developmental delay, microcephaly, facial dysmorphism, and variable
    congenital heart and eye malformations.
  distinguishing_features:
  - "Biallelic pathogenic variants in SMG8 rather than SMG9 on molecular genetic testing."
  - "Severe global developmental delay and microcephaly are characteristic of SMG8-related Alzahrani-Kuwahara syndrome, whereas SMG9 p.(Val184Ala) patients have normal head circumference, mild-to-moderate intellectual disability, and a characteristic motor syndrome of intention tremor, oral motor dyspraxia, and lower-limb pyramidal signs."
  evidence:
  - reference: PMID:33242396
    reference_title: "Recessive, Deleterious Variants in SMG8 Expand the Role of Nonsense-Mediated Decay in Developmental Disorders in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe four consanguineous families with four different likely deleterious homozygous variants in SMG8, encoding a binding partner of SMG9. The observed phenotype greatly resembles that linked to SMG9 and comprises severe global developmental delay, microcephaly, facial dysmorphism, and variable congenital heart and eye malformations."
    explanation: >-
      Defines SMG8-related developmental disorder (Alzahrani-Kuwahara syndrome)
      as the direct subunit-partner disorder in the SMG1-SMG8-SMG9 complex.
animal_models:
- name: smg9oi7/oi7 CRISPR frameshift mutant zebrafish
  species: Zebrafish
  genotype: smg9oi7/oi7 (homozygous CRISPR frameshift mutant)
  genes:
  - preferred_term: SMG9
    term:
      id: hgnc:25763
      label: SMG9
  description: >-
    CRISPR/Cas9-generated zebrafish line (smg9oi7/oi7) that displays congenital
    brain abnormalities, reduced telencephalon size, reduced cardiac
    contraction, premature aging phenotypes, increased smox and gpx3 mRNA
    levels, accumulation of reactive oxygen species and acrolein, increased
    damaged mitochondria with swelling and vacuolization in the brain, and
    significantly fewer proliferating radial glial progenitor cells in the
    dorsal telencephalon. Pharmacological inhibition of Smox with MDL72527 or
    antioxidant treatment with N-acetyl-L-cysteine (NAC) significantly restores
    brain size and tends to restore radial glial cell proliferation.
  modeled_mechanisms:
  - target: Brain Reactive Oxygen Species and Acrolein Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly models the upregulation of smox and gpx3 first observed in
      homozygous SMG9 p.(Val184Ala) human patients, and demonstrates downstream
      accumulation of ROS and acrolein and mitochondrial swelling and
      vacuolization in the brain.
    limitations: >-
      The smg9oi7/oi7 allele is a loss-of-function frameshift that produces
      congenital brain size reduction and cardiac contraction defects, whereas
      the human MONDO:0859274 allele p.(Val184Ala) is a hypomorphic missense
      substitution compatible with adult survival.
    readouts:
    - name: Brain acrolein, ROS, and damaged mitochondria in smg9oi7/oi7 zebrafish
      target: Brain Reactive Oxygen Species and Acrolein Accumulation
      description: >-
        Measurement of smox and gpx3 mRNA levels, ROS and acrolein accumulation,
        and transmission electron microscopy of swollen and vacuolized neural
        mitochondria in smg9oi7/oi7 zebrafish brains.
      direction: INCREASED
      interpretation: >-
        Significant elevation of Smox, ROS, acrolein, and damaged neural
        mitochondria establishes SMOX-driven oxidative and aldehyde toxicity as
        a key cellular lesion of SMG9 deficiency.
      evidence:
      - reference: PMID:38806677
        reference_title: "Effect of nonsense-mediated mRNA decay factor SMG9 deficiency on premature aging in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The number of damaged mitochondria, characterized by swelling and vacuolization, was significantly increased in the brains of smg9oi7/oi7 zebrafish (Fig. 7i, j). These results suggest that high Smox activity in smg9oi7/oi7 zebrafish increased ROS and acrolein production, resulting in mitochondrial damage."
        explanation: >-
          Documents increased damaged mitochondria and Smox-driven ROS and
          acrolein production in smg9oi7/oi7 zebrafish brains.
    evidence:
    - reference: PMID:38806677
      reference_title: "Effect of nonsense-mediated mRNA decay factor SMG9 deficiency on premature aging in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We examined glutathione peroxidase 3 (gpx3), spermine oxidase (smox), oxysterol-binding protein 2 (osbp2), and zinc finger protein 155 (znf155) transcripts, which are upregulated in patients with the SMG9 homozygous missense mutation (Val184Ala mutation)11. Smox and gpx3 mRNA levels were increased in smg9oi7/oi7 zebrafish (Fig. 6a and Supplementary Fig. 12)."
      explanation: >-
        Demonstrates that smg9oi7/oi7 zebrafish recapitulate the smox and gpx3
        upregulation observed in human Val184Ala patients.
  - target: Impaired Radial Glial Progenitor Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates significantly fewer proliferating S100B+ PCNA+ radial glial
      progenitor cells in the dorsal telencephalon and reduced telencephalon
      size, rescued by MDL72527 or NAC treatment.
    limitations: >-
      Zebrafish larval assays cannot directly model higher-order human
      cognitive, expressive speech, oromotor praxis, or corticospinal tract
      pyramidal signs.
    evidence:
    - reference: PMID:38806677
      reference_title: "Effect of nonsense-mediated mRNA decay factor SMG9 deficiency on premature aging in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MDL72527 treatment significantly restored the brain size (Fig. 8a, b). The proliferation of radial glial cells tended to be restored by MDL-72527 treatment in smg9oi7/oi7 brains (Fig. 8c, d). Similarly, the ROS inhibitor N-acetyl-L-cysteine (NAC) significantly restored brain size (Fig. 8e, f)."
      explanation: >-
        Shows that brain size reduction and radial glial progenitor depletion in
        smg9oi7/oi7 zebrafish are restored by inhibiting Smox or scavenging ROS.
  evidence:
  - reference: PMID:38806677
    reference_title: "Effect of nonsense-mediated mRNA decay factor SMG9 deficiency on premature aging in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "smg9oi7/oi7 zebrafish display congenital brain abnormalities and reduced cardiac contraction. Additionally, smg9oi7/oi7 zebrafish exhibit a premature aging phenotype. Analysis of NMD target mRNAs shows a trend toward increased mRNA levels in smg9oi7/oi7 zebrafish. Spermidine oxidase (Smox) is increased in smg9oi7/oi7 zebrafish, resulting in the accumulation of byproducts, reactive oxygen species, and acrolein."

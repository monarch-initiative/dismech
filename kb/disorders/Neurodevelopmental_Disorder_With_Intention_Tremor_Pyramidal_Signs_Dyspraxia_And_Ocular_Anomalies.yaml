progression:
- phase: Infantile and early childhood onset with normal adult survival
  age_range: infancy to adulthood (first words at 2-3.5 years; intelligible speech at 6-8 years; evaluated at 24-56 years)
  notes: >-
    Developmental delay becomes apparent in infancy and early childhood, with
    mild motor delay, childhood hypotonia in a subset (2/5), markedly delayed
    expressive language (first words at 2-3.5 years, intelligible speech at 6-8
    years), childhood ataxia (4/5), and a universal tendency to fall during
    childhood (5/5). Unlike biallelic null SMG9 variants, survival into
    adulthood is normal (reported patients aged 24-56 years in good general
    health), with persistence of mild-to-moderate intellectual disability,
    intention tremor, slow diadochokinesis, and lower-limb pyramidal signs.
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were male, aged 24–56 years, and had either mild or moderate ID (N = 5/5, 100%). Motor development was typically mildly delayed and two patients were reported to have had muscular hypotonia during childhood (N = 2/5, 40%). Language development was markedly delayed in all patients (N = 5/5, 100%). First words were delayed in all patients until 2 to 3.5 years, and expressive language increased slowly. The intelligible speech was typically acquired by the age of 6–8 years."
    explanation: >-
      Documents the early developmental trajectory of motor and speech
      acquisition and adult age range in affected individuals.
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the patients were adults with good general health, providing evidence that the homozygous SMG9 c.551T > C variant was not significantly associated with reduced life expectancy."
    explanation: >-
      Establishes that affected individuals survive into adulthood in good
      general health without reduced life expectancy.
pathophysiology:
- name: SMG9 G-Domain Missense Structural Alteration
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The homozygous c.551T>C p.(Val184Ala) variant lies in exon 5 of SMG9 within
    the central nucleotide-binding G-domain of the SMG9 protein. Whole-blood RNA
    sequencing demonstrates that c.551T>C does not alter SMG9 mRNA expression or
    splicing. Homology modeling using SWISS-MODEL predicts that substituting
    Val184 with Ala results in non-conservation of the coordinated magnesium ion
    and a structural defect in the G-domain ATP/GTP-binding pocket that faces
    the active kinase site of SMG1. The node is marked provisional because the
    G-domain conformational change is based on in silico structural modeling.

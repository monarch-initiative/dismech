- discussion_id: smg9_val184ala_missing_homozygotes_and_incomplete_ascertainment
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why are fewer homozygous SMG9 c.551T>C p.(Val184Ala) individuals identified
    in Finland (5 patients) than the ~14 homozygotes predicted by the Finnish
    minor allele frequency (0.001598)?
  attaches_to:
  - pathophysiology#Aberrant Neurocognitive, Cerebellar, and Corticospinal Circuit Maturation
  - pathophysiology#Aberrant Cardiac Morphogenesis
  rationale: >-
    Given the Finnish MAF of 0.001598 in a population of 5.5 million,
    Hardy-Weinberg equilibrium predicts approximately 14 homozygous individuals
    in Finland, yet only five adult male patients from three families were
    identified and no homozygotes appear in gnomAD. This deficit could reflect
    either prenatal/perinatal loss in a subset of homozygotes who develop severe
    congenital heart defects (consistent with complex TGA/VSD/ASD/PDA in 1/5
    surviving patients) or underascertainment of mildly affected adults without
    major congenital anomalies.
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the allele frequency is 34 times higher in the Finns (0.001598) than in non-Finnish Europeans (0.00004644), and there are no homozygous individuals in the gnomAD. The expected number of SMG9 c.551T > C homozygous patients in Finland is (0.001598)2*5.5 million is approximately 14 individuals."
    explanation: >-
      Documents that approximately 14 homozygous individuals are expected in
      Finland based on the Finnish MAF of 0.001598, compared with the 5
      identified patients.
notes: >-
  Scope and allelic boundary: MONDO:0859274 represents the milder, adult-viable
  autosomal recessive neurodevelopmental disorder caused by homozygosity for the
  Finnish founder missense variant SMG9 c.551T>C p.(Val184Ala), delineated by
  Rahikkala et al. 2022 (PMID:35087184). Severe biallelic loss-of-function SMG9
  variants cause classic Heart and Brain Malformation Syndrome (HBMS;
  OMIM:616920, MONDO:0014833), which is curated in differential_diagnoses to
  maintain a clean clinical and mechanistic boundary between hypomorphic
  G-domain missense perturbation and null SMG9 deficiency.

  Preclinical rescue note: In the smg9oi7/oi7 zebrafish model (Lai et al. 2024,
  PMID:38806677), the SMOX inhibitor MDL72527 and the antioxidant
  N-acetyl-L-cysteine (NAC) restored brain size and radial glial progenitor
  proliferation and reduced brain ROS, acrolein, and mitochondrial damage.
  Because these compounds have only been tested in zebrafish larvae and not in
  human patients, they are recorded in pathophysiology, mechanistic_hypotheses,
  animal_models, and discussions rather than in the clinical treatments section.

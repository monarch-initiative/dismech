experimental_models:
- name: Patient Peripheral Blood Leukocyte RNA-seq and Allele-Specific NMD Assay
  description: >-
    Whole-blood RNA-seq performed on adult patients homozygous for SMG9 c.551T>C
    p.(Val184Ala) and healthy family controls to quantify SMG9 expression and
    splicing, measure canonical PTC-induced NMD efficiency via allele-specific
    expression, and identify 112 differentially expressed endogenous genes.
  experimental_model_type: OTHER
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    Primary peripheral blood leukocytes collected from homozygous SMG9 c.551T>C
    p.(Val184Ala) patients and healthy family controls.
  culture_system: >-
    Ex vivo peripheral blood leukocyte RNA extraction and sequencing without in
    vitro cell culture expansion.
  conditions:
  - Homozygous SMG9 c.551T>C p.(Val184Ala) patient blood RNA
  - Healthy control blood RNA
  publication: PMID:35087184
  modeled_mechanisms:
  - target: Selective Dysregulation of Endogenous NMD-Sensitive and uORF-Containing Transcripts
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Directly measures endogenous transcript abundance and canonical
      PTC-triggered NMD efficiency in primary cells from affected individuals.
    limitations: >-
      Performed on peripheral blood leukocytes rather than developing human
      neural progenitor cells or central nervous system neurons, so
      brain-specific isoforms and neural circuit dynamics are inferred rather
      than directly assayed.
    readouts:
    - name: Upregulation of endogenous transcripts (SMOX, OSBP2, GPX3) and intact PTC-induced NMD
      target: Selective Dysregulation of Endogenous NMD-Sensitive and uORF-Containing Transcripts
      description: >-
        Differential gene expression analysis (FDR padj < 0.05) and
        allele-specific expression analysis comparing homozygous p.(Val184Ala)
        patients against healthy controls.
      direction: INCREASED
      interpretation: >-
        97 of 112 DEGs were upregulated (~6.5-fold excess over 15 downregulated
        genes), including SMOX (logFC 2.1), OSBP2 (logFC 2.2), and GPX3 (logFC
        2.4), while likely NMD-targeted variants had a significantly higher
        proportion of reference reads (p = 3.1e-3), indicating intact canonical
        PTC-induced NMD.
      evidence:
      - reference: PMID:35087184
        reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The overall pattern observed was an increased expression of genes in the patient group compared to the control group, including ~ 6.5 times more upregulated (97) than downregulated (15) genes (p-value = 7.12e−16) (Supplementary Table 7), suggesting that dysfunctional SMG9 either affects NMD-regulated gene expression outside of the known canonical mechanisms or through a non-NMD regulatory mechanism."
        explanation: >-
          Reports the ~6.5-fold excess of upregulated endogenous transcripts in
          patient blood RNA-seq.
    evidence:
    - reference: PMID:35087184
      reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RNA sequencing revealed that the SMG9 c.551T > C variant did not affect the splicing or expression level of SMG9 gene products, and allele-specific expression analysis did not provide evidence that the nonsense mRNA-induced NMD was affected."
      explanation: >-
        Describes the patient RNA-seq findings on SMG9 expression, splicing, and
        allele-specific expression.
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA sequencing revealed that the SMG9 c.551T > C variant did not affect the splicing or expression level of SMG9 gene products, and allele-specific expression analysis did not provide evidence that the nonsense mRNA-induced NMD was affected."
    explanation: >-
      Attests to the patient RNA-seq experimental assay and its primary
      findings.

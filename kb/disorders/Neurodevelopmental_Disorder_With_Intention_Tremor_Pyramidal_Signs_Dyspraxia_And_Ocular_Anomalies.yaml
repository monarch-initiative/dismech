  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In the predicted model of mutated SMG9 p.184Ala structure, the magnesium ion is not conserved and there is a structural defect in the G-domain, which is the ATP binding site. This structural change could affect the binding of UPF1 to SMG1-SMG8-SMG9 protein complex, altering the kinase activity of SMG1."
    explanation: >-
      In silico structural modeling demonstrates that p.(Val184Ala) disrupts
      magnesium ion conservation and the G-domain nucleotide-binding site.
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA sequencing revealed that the SMG9 c.551T > C variant did not affect the splicing or expression level of SMG9 gene products, and allele-specific expression analysis did not provide evidence that the nonsense mRNA-induced NMD was affected."
    explanation: >-
      Whole-blood RNA-seq confirms that the c.551T>C variant does not alter
      SMG9 mRNA expression or splicing.
  downstream:

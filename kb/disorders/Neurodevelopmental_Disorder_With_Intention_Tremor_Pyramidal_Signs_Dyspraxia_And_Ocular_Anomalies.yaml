- name: Perturbed SMG1-SMG8-SMG9 Kinase Complex Regulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    SMG9 is a core regulatory subunit of the heterotrimeric SMG1-SMG8-SMG9
    phosphatidylinositol-3-kinase-related protein kinase (PIKK) complex that
    phosphorylates the RNA helicase UPF1 during mRNA surveillance. The
    p.(Val184Ala) G-domain defect is predicted to impair the recruitment or
    positioning of UPF1 on the SMG1-SMG8-SMG9 complex and modulate SMG1 serine/
    threonine kinase activity without abolishing complex assembly. This node is
    marked provisional because direct biochemical assays of SMG1 kinase activity
    and UPF1 phosphorylation have not yet been performed on mutant p.(Val184Ala)
    patient cells.

- name: Increased SMOX-Mediated Polyamine Catabolism
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Spermine oxidase (SMOX) is a highly inducible enzyme that catabolizes the
    polyamine spermine to spermidine. SMOX is the most statistically
    significantly upregulated transcript in whole blood from homozygous SMG9
    p.(Val184Ala) patients (logFC = 2.1, FDR padj = 6.1E-10), and its
    ortholog smox is similarly elevated in Smg9-deficient zebrafish brains.
    This node is marked provisional because human evidence is derived from
    peripheral blood transcriptomics while enzymatic activity in brain tissue
    was characterized in the zebrafish model.

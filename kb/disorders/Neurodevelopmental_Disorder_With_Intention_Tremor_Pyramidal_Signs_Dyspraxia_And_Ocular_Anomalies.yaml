- name: Selective Dysregulation of Endogenous NMD-Sensitive and uORF-Containing Transcripts
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Alongside quality control of premature termination codon (PTC)-bearing
    transcripts, the NMD machinery regulates normal endogenous physiological
    mRNAs (including transcripts with upstream open reading frames [uORFs] or
    long 3'UTRs). In whole-blood RNA-seq from homozygous p.(Val184Ala) patients,
    allele-specific expression analysis showed a functioning PTC-induced NMD
    mechanism, whereas differential gene expression analysis revealed 112
    statistically significantly dysregulated genes with ~6.5 times more
    upregulated (97) than downregulated (15) genes. Prominent dysregulated genes
    include upregulated SMOX (logFC 2.1), OSBP2 (logFC 2.2), GPX3 (logFC 2.4),
    RAP1GAP (logFC 4.0), MAP1B (logFC 2.9), and HEY1 (logFC 2.0), as well as
    downregulated ZNF155 (logFC -2.3) and TUBB2A (logFC -2.9).

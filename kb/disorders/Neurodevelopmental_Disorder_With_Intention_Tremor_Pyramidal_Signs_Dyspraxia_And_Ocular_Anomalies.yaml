      PP1, PP3) of SMG9 c.551T>C.
diagnosis:
- name: Whole Exome Sequencing and Sanger Segregation Analysis
  presence: PRESENT
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Identification of biallelic hypomorphic pathogenic variants in SMG9,
    specifically homozygosity for NM_019108.4:c.551T>C p.(Val184Ala), confirmed
    by Sanger sequencing and recessive segregation analysis in families.
  description: >-
    Because the clinical presentation consists of mild-to-moderate intellectual
    disability, delayed speech, oral motor dyspraxia, intention tremor,
    lower-limb pyramidal signs, and strabismus without the pathognomonic lethal
    heart-brain malformation triad of null SMG9 disease, molecular diagnosis
    relies on exome sequencing followed by Sanger confirmation.
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."

  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:35087184
      reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report five patients from three unrelated families with intellectual disability (ID) and a novel pathogenic SMG9 c.551 T > C p.(Val184Ala) homozygous missense variant, identified using exome sequencing. Sanger sequencing confirmed recessive segregation in each family."
      explanation: >-
        Confirms autosomal recessive segregation of the homozygous SMG9
        c.551T>C p.(Val184Ala) variant in all three families.
  features: >-
    Homozygosity for the Finnish founder missense variant NM_019108.4:c.551T>C
    p.(Val184Ala) in SMG9 (GRCh38 g.19:43747479A>G, rs749498958) causes this
    milder, adult-viable neurodevelopmental disorder, whereas biallelic
    loss-of-function variants in SMG9 cause severe Heart and Brain Malformation
    Syndrome (HBMS; MONDO:0014833). All five patients shared an ancestral
    haplotype with a median shared segment length of 1.7 Mb.
  association: Causative Gene
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five Finnish patients were found to carry a homozygous SMG9 gene variant: c.551T > C p.(Val184Ala) (NM_019108.4, GRCh38 g.19:43747479 A > G, rs749498958). The variant was identified by WES and confirmed by Sanger sequencing."
    explanation: >-
      Demonstrates homozygosity for SMG9 c.551T>C p.(Val184Ala) across all five
      patients from three Finnish families.
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SMG9 gene variant c.551T > C lies on a shared ancestral haplotype with a median length of 1.7 Mb for shared haplotype segments further suggesting SMG9 c.551T > C to be a Finnish founder variant."
    explanation: >-
      Confirms that the c.551T>C variant lies on a shared 1.7 Mb Finnish
      founder haplotype.
variants:
- name: NM_019108.4:c.551T>C (p.Val184Ala)
  description: >-
    Finnish founder missense variant in SMG9 (rs749498958, GRCh38
    g.19:43747479A>G; CADD score 24.1; Finnish gnomAD MAF 0.001598 with 0
    homozygotes; OR = 8.08 in Finnish ID patients vs general population).
    Substitutes a conserved valine with alanine within the central
    nucleotide-binding G-domain of SMG9, causing predicted loss of Mg2+
    conservation and structural perturbation of the ATP-binding site while
    preserving SMG9 transcript levels and canonical PTC-induced NMD.
  gene:
    preferred_term: SMG9
    term:
      id: hgnc:25763
      label: SMG9
  type: missense_variant
  identifiers:
  - dbSNP:rs749498958
  synonyms:
  - NM_019108.4:c.551T>C
  - p.(Val184Ala)
  clinical_significance: LIKELY_PATHOGENIC
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five Finnish patients were found to carry a homozygous SMG9 gene variant: c.551T > C p.(Val184Ala) (NM_019108.4, GRCh38 g.19:43747479 A > G, rs749498958). The variant was identified by WES and confirmed by Sanger sequencing."
    explanation: >-
      Identifies NM_019108.4:c.551T>C p.(Val184Ala) as the causal homozygous
      variant in all five patients.
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT

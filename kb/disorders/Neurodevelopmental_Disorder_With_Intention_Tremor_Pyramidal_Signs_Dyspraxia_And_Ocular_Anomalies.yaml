      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The SMG9 c.551T > C variant is located in exon 5 of the SMG9 gene and in the nucleotide-binding G-fold domain of the SMG9 protein, where it faces the active kinase site of SMG1"
      explanation: >-
        Demonstrates that the p.(Val184Ala) residue in the SMG9 G-fold domain
        directly faces the active kinase site of SMG1.
    - reference: PMID:35087184

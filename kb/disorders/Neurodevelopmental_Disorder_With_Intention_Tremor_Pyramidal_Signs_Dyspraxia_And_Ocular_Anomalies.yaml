mechanistic_hypotheses:
- hypothesis_group_id: smox_oxidative_stress_drives_human_neurodevelopmental_phenotype
  hypothesis_label: SMOX-mediated polyamine catabolism and acrolein/ROS neurotoxicity drive the human SMG9 p.(Val184Ala) neurological phenotype
  status: EMERGING
  description: >-
    Rahikkala et al. (2022) found that homozygous SMG9 p.(Val184Ala) patients
    maintain canonical PTC-induced NMD in blood leukocytes yet show a ~6.5-fold
    excess of upregulated endogenous transcripts, prominently including SMOX,
    OSBP2, and antioxidant defense gene GPX3. Lai et al. (2024) subsequently
    tested whether SMOX upregulation is causally responsible for SMG9-deficiency
    developmental defects using smg9oi7/oi7 zebrafish, demonstrating that excess
    Smox elevates brain ROS and acrolein, damages neural mitochondria, and
    reduces proliferating radial glial progenitor cells, and that SMOX
    inhibition (MDL72527) or antioxidant therapy (NAC) restores brain size and
    radial glial proliferation. Whether SMOX-driven acrolein and ROS
    accumulation occurs to the same extent in developing human neural
    progenitors carrying the hypomorphic p.(Val184Ala) variant remains to be
    tested directly in human neuronal models.
  evidence:
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most significant upregulated genes were spermine oxidase (SMOX) (logFC = 2.1, FDR padj = 6.1E−10), oxysterol binding protein 2 (OSBP2) (logFC = 2.2, FDR padj = 3.3E−08), and glutathione peroxidase 3 (GPX3) (logFC = 2.4, FDR padj = 2.7E 05) (Fig. 3D and Table 2)."
    explanation: >-
      Establishes SMOX and GPX3 among the top upregulated genes in human
      patients homozygous for SMG9 p.(Val184Ala).
  - reference: PMID:38806677
    reference_title: "Effect of nonsense-mediated mRNA decay factor SMG9 deficiency on premature aging in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spermidine oxidase (Smox) is increased in smg9oi7/oi7 zebrafish, resulting in the accumulation of byproducts, reactive oxygen species, and acrolein."
    explanation: >-
      Validates the causal chain from SMG9 deficiency to Smox upregulation and
      ROS/acrolein accumulation in zebrafish.

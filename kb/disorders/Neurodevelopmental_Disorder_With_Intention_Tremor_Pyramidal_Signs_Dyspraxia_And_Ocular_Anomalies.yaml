    explanation: >-
      Establishes that canonical PTC-induced NMD remains functional in
      peripheral blood of homozygous p.(Val184Ala) patients.
  - reference: PMID:35087184
    reference_title: "A novel variant in SMG9 causes intellectual disability, confirming a role for nonsense-mediated decay components in neurocognitive development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most significant upregulated genes were spermine oxidase (SMOX) (logFC = 2.1, FDR padj = 6.1E−10), oxysterol binding protein 2 (OSBP2) (logFC = 2.2, FDR padj = 3.3E−08), and glutathione peroxidase 3 (GPX3) (logFC = 2.4, FDR padj = 2.7E 05) (Fig. 3D and Table 2). The most significant downregulated gene, with an FDR padj of 6.1E–10 and a logFC of −2.3, was zinc finger protein 155 (ZNF155) (Fig. 3D and Table 2)."
    explanation: >-
      Identifies SMOX, OSBP2, and GPX3 as the most significantly upregulated

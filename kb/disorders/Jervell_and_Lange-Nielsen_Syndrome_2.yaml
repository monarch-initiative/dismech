  prevalence_class: ULTRA_RARE
  notes: >-
    No direct birth-prevalence estimate for JLNS2 specifically has been
    published; JLNS overall (both genes) is estimated at roughly 1 in 200,000
    to 1 in 1,000,000, and approximately 90% of genotyped JLNS cases are
    attributable to KCNQ1 rather than KCNE1, making JLNS2 a small minority of
    an already rare disease.

environmental:
- name: Exertion, Emotional Stress, or Sudden Fright
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The classic presentation of JLNS is a deaf child who experiences syncopal episodes during periods of stress, exercise, or fright."
    explanation: >-
      Establishes that exertion is a recognized exposure in JLNS rather
      than an inferred one. The mechanism link below carries its own
      evidence for the separate claim that this exposure acts on the
      arrhythmogenic substrate node.
  influences_mechanisms:
  - target: Arrhythmogenic Substrate and Ventricular Tachyarrhythmia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exertion, emotional stress, and sudden fright are the classic
      adrenergic triggers for syncopal arrhythmic events in JLNS; the same
      triggers motivate the anti-adrenergic rationale of beta-blocker
      therapy and the exercise/trigger-avoidance counseling in
      treatments.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The classic presentation of JLNS is a deaf child who experiences syncopal episodes during periods of stress, exercise, or fright."
      explanation: >-
        GeneReviews documents exertion, emotional stress, and sudden fright
        as the classic triggers of syncopal arrhythmic events in JLNS.
  notes: >-
    Modeled here specifically for exertion/exercise, the concept with an
    available ECTO exposure term (ECTO:6000031, exposure to strenuous
    exercise); emotional stress and sudden fright are named in the same
    GeneReviews sentence but have no comparably specific ECTO exposure term
    and are recorded only in this node's free-text description.
- name: General Anesthesia and Perioperative Exposure
  exposure_term:
    preferred_term: exposure to anesthetics
    term:
      id: ECTO:2000059
      label: exposure to anesthetics
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Special precautions during anesthesia are necessary because of the increased risk for cardiac arrhythmia."
    explanation: >-
      GeneReviews names anesthesia as a circumstance carrying increased arrhythmia
      risk in JLNS, establishing it as a recognized exposure rather than an
      inferred one. The mechanism link below carries separate evidence for the
      claim that this exposure acts on the arrhythmogenic substrate node.
  influences_mechanisms:
  - target: Arrhythmogenic Substrate and Ventricular Tachyarrhythmia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Anesthesia is an identified precipitant of ventricular arrhythmia in JLNS,
      acting on the same repolarization-reserve-depleted substrate as the adrenergic
      triggers. This is the exposure behind the perioperative caution already
      recorded on the cochlear implantation treatment, where arrhythmic events
      during implant surgery have been documented.
    evidence:
    - reference: PMID:42389506
      reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "activities such as exercise, including swimming, emotional states, auditory stimuli, anesthesia, and feverish conditions have been identified as potential triggers of cardiac arrhythmia in children with JLNS"
      explanation: >-
        Lists anesthesia explicitly among the identified triggers of cardiac
        arrhythmia in children with JLNS, which is the causal claim this edge makes.
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Special precautions during anesthesia are necessary because of the increased risk for cardiac arrhythmia."
      explanation: >-
        GeneReviews attributes the need for anesthetic precautions specifically to
        increased arrhythmia risk, tying the exposure to the arrhythmogenic node.
  notes: >-
    The same source lists fever, hypokalemia and swimming as further precipitants,
    and reports that some JLNS cases are first detected when an intercurrent fever,
    diarrhea or hypokalemia prompts an ECG. Those are recorded here rather than as
    separate environmental entries because no ECTO exposure term was found for
    febrile illness or for hypokalemia. Auditory stimuli are also listed as a
    generic long-QT trigger in that sentence but are deliberately not modeled for
    JLNS2: these patients have congenital profound deafness, so a startle-by-sound
    trigger cannot be assumed to transfer to them, and no JLNS-specific report of
    it was identified.

    Both sources are syndrome-level: GeneReviews and the review both describe JLNS
    as a whole, and neither stratifies the anesthetic hazard by causal gene.
treatments:
- name: Beta-Blocker Therapy
  description: >-
    First-line anti-adrenergic pharmacotherapy for JLNS, though reported to be
    only partially effective; arrhythmia persists in a substantial proportion
    of patients despite beta-blocker treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Ventricular Tachyarrhythmia
    treatment_effect: INHIBITS
    description: >-
      Anti-adrenergic therapy reduces the likelihood that exertion- or
      emotion-related sympathetic triggers will precipitate malignant
      ventricular arrhythmia.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "beta-adrenergic blockers for long QT interval (Note: Beta-blocker treatment is only partially effective.)"
      explanation: >-
        GeneReviews recommends beta-blockers as first-line therapy while
        explicitly noting only partial effectiveness in JLNS.
  evidence:
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The efficacy of beta‐blockers and left cardiac sympathetic denervation is limited in patients with JLNS, as arrhythmia persists in 51%–85% of cases despite beta‐blocker treatment"
    explanation: >-
      Quantifies the limited efficacy of beta-blocker therapy in JLNS,
      motivating escalation to device therapy in many patients.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Beta-blocker dose should be regularly assessed for efficacy and adverse effects, with evaluation every three to six months during rapid growth phases"
    explanation: >-
      GeneReviews surveillance guidance: beta-blocker dosing requires
      periodic reassessment, especially during rapid childhood growth
      phases, because weight-based dosing can fall out of therapeutic range.
  notes: >-
    GeneReviews recommends reassessing beta-blocker dose for efficacy and
    adverse effects every three to six months during rapid growth phases.
- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Device therapy for patients with a history of cardiac arrest, malignant
    events despite beta-blocker therapy, or otherwise judged high risk.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "implantable cardioverter defibrillators (ICDs) for those with a history of cardiac arrest and/or failure to respond to other treatments"
    explanation: >-
      GeneReviews recommends ICD placement for high-risk or treatment-refractory
      JLNS patients.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "periodic evaluations of ICDs for inappropriate shocks and pocket or lead complications"
    explanation: >-
      GeneReviews surveillance guidance: implanted devices require periodic
      evaluation for inappropriate shocks and pocket/lead complications.
  - reference: PMID:16911578
    reference_title: "Clinical course and risk stratification of patients affected with the Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among JLNS patients treated with beta-blockers, the cumulative probability of LQTS-related death was 35%; defibrillator therapy was associated with a 0% mortality rate during a mean (+/-SD) follow-up period of 4.9 +/- 3.4 years."
    explanation: >-
      Quantifies the outcome difference between beta-blocker therapy alone and
      defibrillator therapy in this non-randomised JLNS registry cohort. The
      authors' own conclusion is correspondingly hedged - defibrillator therapy
      "appears to improve outcome", with longer follow-up needed.
  notes: >-
    GeneReviews recommends periodic ICD evaluation for inappropriate shocks
    and pocket or lead complications.

    The device-versus-beta-blocker outcome figures come from a JLNS registry
    cohort that was defined phenotypically rather than genotypically, so they are
    syndrome-level and carry no KCNE1-specific efficacy claim.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical anti-adrenergic escalation considered when arrhythmia persists
    despite beta-blocker therapy or when device therapy is unsuitable; a
    review of JLNS management describes beta-blocker and left cardiac
    sympathetic denervation efficacy as both limited, since arrhythmia
    persists in 51-85% of cases despite beta-blocker treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C51931
      label: Ganglionectomy
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Ventricular Tachyarrhythmia
    treatment_effect: INHIBITS
    description: >-
      Left cardiac sympathetic denervation reduces arrhythmia-provoking
      sympathetic input when pharmacologic anti-adrenergic therapy (beta
      blockade) is insufficient.
    evidence:
    - reference: PMID:42389506
      reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The efficacy of beta‐blockers and left cardiac sympathetic denervation is limited in patients with JLNS, as arrhythmia persists in 51%–85% of cases despite beta‐blocker treatment"
      explanation: >-
        States that left cardiac sympathetic denervation is used alongside
        beta-blockade in JLNS management, though the same review notes both
        interventions have limited efficacy against persistent arrhythmia.
  evidence:
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "left cervical sympathectomy is planned if malignant ventricular arrhythmias recur"
    explanation: >-
      Documents left cardiac sympathetic denervation (cervical sympathectomy)
      as the planned escalation step in JLNS patients with recurrent
      malignant ventricular arrhythmia.
  notes: >-
    Efficacy data are JLNS-wide (both JLNS1 and JLNS2) rather than
    KCNE1-genotype-specific; no genotype-stratified LCSD outcome data for
    JLNS2 alone were identified.

    NCIT has no sympathectomy or denervation term: searches for sympathectomy,
    sympathetic denervation, cardiac sympathetic and denervation all return
    nothing. NCIT:C51931 (Ganglionectomy, "the surgical removal of a ganglion",
    reachable from NCIT:C25218 via NCIT:C15329) is bound instead of the generic
    Surgical Procedure because that is the procedure LCSD is - removal of the
    lower left stellate ganglion together with the upper thoracic ganglia. The
    laterality and the cardiac indication are carried by preferred_term, which
    the ontology term cannot express.
- name: Catheter Ablation of Triggering Ectopy
  description: >-
    Radiofrequency catheter ablation of the premature ventricular contraction
    that triggers arrhythmia storm has been reported as an effective
    alternative or adjunct to device therapy in an individual genotype-confirmed
    KCNE1 (JLNS2) patient who could not undergo ICD implantation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac radiofrequency ablation
    term:
      id: NCIT:C170884
      label: Cardiac Radiofrequency Ablation
  evidence:
  - reference: PMID:33040543
    reference_title: "Treatment on arrhythmia electric storm in a Jervell and Lange-Nielsen syndrome patient by ablation of the triggering premature ventricular contraction: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ablation was successfully performed to eliminate the triggering PVC... During the 12-month follow-up, no syncope or fatal arrhythmia was found in this patient."
    explanation: >-
      Direct clinical case report of successful radiofrequency ablation
      controlling fatal arrhythmia in a genotype-confirmed KCNE1 patient.
  notes: >-
    Reported in a single genotype-confirmed KCNE1 patient who could not
    undergo ICD implantation for economic reasons; not established as a
    JLNS2-specific standard of care.
- name: Cochlear Implantation
  description: >-
    Surgical cochlear implantation to treat the congenital profound
    sensorineural hearing loss of JLNS.
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cochlear implantation to treat hearing loss"
    explanation: >-
      GeneReviews lists cochlear implantation as standard management of
      hearing loss in JLNS.
  - reference: PMID:31846911
    reference_title: "Cochlear Implantation in Congenital Long-QT Syndrome: A Comprehensive Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fatal Arrhythmias were encountered intra-operatively in five patients which was treated with cardiac pacing."
    explanation: >-
      Documents fatal intraoperative arrhythmia during cochlear implantation in a
      long-QT cohort, establishing the perioperative hazard as observed rather than
      theoretical.
  - reference: PMID:31846911
    reference_title: "Cochlear Implantation in Congenital Long-QT Syndrome: A Comprehensive Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preoperative prophylactic Beta blockers, avoiding sympathetic stimulation and drugs prolonging QT interval with rational use of Magnesium Sulphate and standby of defibrillator were the standard precautions practised."
    explanation: >-
      Sets out the specific perioperative precaution protocol used in that cohort,
      which is the actionable content of this caution.
  notes: >-
    Perioperative arrhythmia is the specific hazard of this operation in this
    population, which is why two of the three evidence items on this treatment are
    about the precautions rather than about the hearing outcome. The implantation series
    cited is a congenital long-QT-with-hearing-loss cohort that was not genotyped,
    so it is JLNS-spectrum rather than KCNE1-specific; it is used here for the
    procedural precaution, not for any JLNS2 outcome claim. A JLNS review makes the
    same point (PMID:42389506).
- name: Avoidance of QT-Prolonging Drugs and Arrhythmia Triggers
  description: >-
    Avoidance of drugs that further prolong the QT interval and of activities
    or circumstances known to precipitate syncopal events, plus special
    anesthetic precautions given the increased risk of arrhythmia during
    anesthesia.
  therapeutic_modality: BEHAVIORAL
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: risk factor avoidance counseling
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Drugs that cause further prolongation of the QT interval; activities known to precipitate syncopal events in persons with long QT syndrome."
    explanation: >-
      GeneReviews specifies the agents and circumstances to avoid in JLNS
      management.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Training for family members in cardiopulmonary resuscitation; use of an ID bracelet explaining the diagnosis; notifying local emergency medical services of high-risk persons with JLNS."
    explanation: >-
      GeneReviews recommends family CPR training and emergency-preparedness
      measures as part of routine JLNS risk-factor avoidance and emergency
      planning.
  notes: >-
    GeneReviews also recommends ensuring availability of automated external
    defibrillators where appropriate, family training in cardiopulmonary
    resuscitation, use of a medical-alert ID bracelet, and notifying local
    emergency medical services of high-risk individuals.
- name: Genetic Counseling
  description: >-
    Autosomal recessive genetic counseling for families, including the 25%
    per-pregnancy recurrence risk for carrier couples, evaluation of at-risk
    relatives by newborn hearing screening and ECG, and consideration of
    whether a mother carrying an affected fetus herself has long QT syndrome.
  therapeutic_modality: OTHER
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual usually has a 25% chance of being affected with JLNS, a 50% chance of being a carrier of a JLNS-causing pathogenic variant and potentially at risk for LQTS, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews specifies the recurrence-risk figures used in genetic
      counseling for JLNS families.
- name: Iron Repletion for Iron-Deficiency Anemia
  description: >-
    Standard iron-deficiency treatment for the iron-deficient, hypochromic anemia
    that is a frequent non-cardioauditory feature of JLNS. GeneReviews specifies
    standard rather than JLNS-specific management, so no disease-specific dosing or
    target is asserted here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: iron repletion pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:18248
        label: iron atom
  target_phenotypes:
  - preferred_term: Iron deficiency anemia
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "standard treatment for those with iron-deficiency anemia"
    explanation: >-
      GeneReviews includes standard iron-deficiency anemia treatment in the
      management of JLNS.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Iron-deficient anemia and elevated levels of gastrin are also frequent features of JLNS."
    explanation: >-
      Establishes the iron-deficient anemia that this treatment addresses as a
      frequent feature of the syndrome rather than an incidental comorbidity.
  notes: >-
    The agent is bound to the element rather than to a salt: GeneReviews specifies
    only "standard treatment", so naming ferrous sulfate or any other preparation
    would assert more than the source does. NCIT has no generic iron pharmacologic
    substance under NCIT:C1909, and NCIT:C210688 (Iron Supplement) is outside the
    ChemicalEntityTerm hierarchy, so CHEBI:18248 is the most specific term that is
    both accurate and bindable here.

    No target_mechanisms link is declared: iron repletion treats a downstream
    hematologic consequence and does not act on any mechanism node in this entry's
    pathograph, whose two branches are cardiac and cochlear. Management guidance is
    syndrome-level and not stratified by causal gene.
- name: Atrial Pacing with Beta-Blockade
  description: >-
    Atrial pacing combined with escalated beta-blocker dosing, reported in young
    high-risk JLNS children as an alternative to early ICD implantation, which is
    technically difficult at that age. In a Norwegian series of genetically
    confirmed JLNS patients, six children with atrial leads had no arrhythmic
    events over a mean 6.9 years, while the one patient given a ventricular lead
    died during follow-up. The authors propose it as a bridge to a two-chamber ICD
    where left cardiac sympathetic denervation is unavailable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac pacemaker implantation
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cardiac pacemaker
        term:
          id: NCIT:C94198
          label: Cardiac Pacemaker
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Ventricular Tachyarrhythmia
    treatment_effect: INHIBITS
    description: >-
      Atrial pacing added to escalated beta-blockade was followed by freedom from
      arrhythmic events in the reported series, which is the observed effect on this
      node. The usual electrophysiologic rationale - that raising the paced rate
      shortens the QT interval and removes the bradycardia-dependent pauses on which
      torsade de pointes initiates - is standard long-QT reasoning and is not tested
      or stated by the cited study, so it is named here as rationale rather than as
      a demonstrated mechanism.
    evidence:
    - reference: PMID:27451284
      reference_title: "The Jervell and Lange-Nielsen syndrome; atrial pacing combined with \u00df-blocker therapy, a favorable approach in young high-risk patients with long QT syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "No arrhythmic events occurred in 6 very young JLNS patients who received atrial pacing in combination with increased doses of beta-blockers during 7-year follow-up."
      explanation: >-
        Reports the absence of arrhythmic events under atrial pacing plus escalated
        beta-blockade, the outcome this mechanism link claims.
  evidence:
  - reference: PMID:27451284
    reference_title: "The Jervell and Lange-Nielsen syndrome; atrial pacing combined with \u00df-blocker therapy, a favorable approach in young high-risk patients with long QT syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 6 patients with atrial leads survived without events at a mean follow-up of 6.9 years after pacemaker implantation."
    explanation: >-
      The event-free follow-up of the atrially paced patients, and by contrast the
      death of the single ventricular-lead patient, which is why the lead position
      is named in the description rather than left implicit.
  - reference: PMID:27451284
    reference_title: "The Jervell and Lange-Nielsen syndrome; atrial pacing combined with \u00df-blocker therapy, a favorable approach in young high-risk patients with long QT syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this treatment strategy may prevent life-threatening arrhythmias in this high-risk patient group and may act as a bridge to insertion of a 2-chamber ICD when left cardiac sympathetic denervation is not available."
    explanation: >-
      The authors' own framing of the strategy as a bridge to a two-chamber ICD,
      which is how it is positioned relative to the ICD treatment in this entry.
  notes: >-
    Nine patients, all Norwegian, and the authors present it as provisional
    ("if confirmed in additional patients"), so this is curated as a reported
    strategy rather than as standard care. The cohort is described as genetically
    confirmed JLNS but the causal gene is not broken out in the abstract, and
    Norwegian JLNS is predominantly KCNQ1, so no KCNE1-specific efficacy is claimed.
    The treatment term is the clinical action (NCIT:C80434, the sibling of the
    NCIT:C80435 used for ICD placement in this entry); the device itself is
    attached as a qualifier, per the device-versus-clinical-action convention.
    therapeutic_modality is DEVICE to match the ICD treatment, which is this
    treatment's nearest analogue in the file, even though the mechanical
    treatment_term-to-modality table would suggest SURGERY for a C15329-family
    procedure term.
animal_models:
- name: Kcne1 knockout mouse
  species: Mouse
  genotype: Kcne1-/-
  publication: PMID:33514733
  modeled_mechanisms:
  - target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Kcne1-/- mice lack Kcne1 expression in strial marginal cells and
      vestibular dark cells, the same cell types that express the KCNQ1/KCNE1
      complex in humans, and show abnormal endolymphatic-space development.
    limitations: >-
      Mouse cochlear structure, developmental timing, and the extent of
      vestibular involvement are not identical to human JLNS2; no
      genotype-confirmed human vestibular data exist for direct comparison
      (see the HUMAN_MODEL_MISMATCH discussion on this node).
    evidence:
    - reference: PMID:33514733
      reference_title: "Gene therapy via canalostomy approach preserves auditory and vestibular functions in a mouse model of Jervell and Lange-Nielsen syndrome type 2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both Kcne1−/− and Kcnq1−/− mice exhibit an abnormal development of the endolymphatic space, severe degeneration of the hair cells (HCs), and spiral ganglion neurons (SGNs)"
      explanation: >-
        Supports treating the Kcne1-/- mouse as informative for the
        strial-marginal-cell potassium-secretion node: it reproduces the
        expected downstream endolymphatic and hair-cell consequences of losing
        the same channel complex.
    readouts:
    - name: Reissner's membrane and vestibular wall collapse
      target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
      direction: RESTORED
      interpretation: >-
        Early AAV1-CB7-Kcne1 gene therapy via the posterior semicircular canal
        prevented collapse of Reissner's membrane and the vestibular wall and
        preserved normal semicircular canal size, demonstrating the causal role
        of Kcne1 loss in this structural degeneration.
      evidence:
      - reference: PMID:33514733
        reference_title: "Gene therapy via canalostomy approach preserves auditory and vestibular functions in a mouse model of Jervell and Lange-Nielsen syndrome type 2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Results showed early treatment prevented collapse of the Reissner's membrane and vestibular wall, retained the normal size of the semicircular canals, and prevented the degeneration of inner ear cells."
        explanation: >-
          Rescue experiment demonstrating that structural cochlear/vestibular
          degeneration in Kcne1-/- mice is caused by loss of Kcne1 function.
    - name: Auditory brainstem response threshold
      target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
      direction: RESTORED
      interpretation: >-
        High-dosage gene therapy preserved auditory function in 16 of 20
        treated Kcne1-/- mice for at least five months, supporting a causal
        link between restored strial Kcne1 expression and preserved hearing.
      evidence:
      - reference: PMID:33514733
        reference_title: "Gene therapy via canalostomy approach preserves auditory and vestibular functions in a mouse model of Jervell and Lange-Nielsen syndrome type 2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In a dose-dependent manner, the treatment preserved auditory (16 out of 20 mice) and vestibular (20/20) functions in mice treated with the high-dosage for at least five months."
        explanation: >-
          Dose-dependent, quantitative auditory and vestibular functional
          rescue data from the Kcne1-/- mouse gene-therapy study.
  evidence:
  - reference: PMID:33514733
    reference_title: "Gene therapy via canalostomy approach preserves auditory and vestibular functions in a mouse model of Jervell and Lange-Nielsen syndrome type 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in voltage-gated potassium channel KCNE1 cause Jervell and Lange-Nielsen syndrome type 2 (JLNS2), resulting in congenital deafness and vestibular dysfunction. We conducted gene therapy by injecting viral vectors using the canalostomy approach in Kcne1-/- mice to treat both the hearing and vestibular symptoms."
    explanation: >-
      Establishes the Kcne1-/- mouse as a genetically precise model of the
      human KCNE1 loss-of-function lesion underlying JLNS2.
experimental_models:
- name: CHO-K1 heterologous KCNQ1/KCNE1 expression with automated voltage clamp
  description: >-
    Chinese hamster ovary (CHO-K1) cells stably expressing human KCNE1, into which
    KCNE1 variants are coexpressed with KCNQ1 and the resulting IKs current is
    measured by high-throughput automated patch-clamp recording. Variants were
    studied in the homozygous state, which is the configuration that corresponds to
    biallelic JLNS2 genotypes, and a subset additionally in the heterozygous state
    corresponding to the dominant LQT5 configuration. This is the assay that
    supplies the loss-of-function mechanism and the carrier-frequency estimate
    curated elsewhere in this entry.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Chinese hamster
    term:
      id: NCBITaxon:10029
      label: Cricetulus griseus
  cell_source: >-
    CHO-K1 cell line stably expressing human KCNE1, with KCNQ1 and variant KCNE1
    introduced by transfection.
  culture_system: >-
    Heterologous expression in a non-excitable mammalian cell line with
    high-throughput automated patch-clamp electrophysiology.
  conditions:
  - 95 KCNE1 variants expressed in the homozygous state
  - a subset of variants additionally coexpressed with wild-type KCNE1 (heterozygous state)
  publication: PMID:41200805
  modeled_mechanisms:
  - target: Biallelic KCNE1 Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Expressing a KCNE1 variant in the homozygous state alongside KCNQ1 reproduces
      the molecular configuration of a JLNS2 genotype and measures the resulting IKs
      current directly, which is the node's claim.
    limitations: >-
      A non-excitable rodent cell line supplies neither the native cardiomyocyte
      action potential nor the stria vascularis epithelium, so the assay reports
      channel function in isolation and cannot show either downstream consequence.
      Channel subunit stoichiometry and trafficking in a heterologous system need
      not match the native tissue.
    readouts:
    - name: IKs peak current density and activation voltage-dependence
      target: Biallelic KCNE1 Loss of Function
      direction: DECREASED
      interpretation: >-
        Reduced peak IKs current density in the homozygous configuration is the
        direct measurement of the loss of function this node asserts.
      evidence:
      - reference: PMID:41200805
        reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "When examined in the homozygous state, 68 KCNE1 variants exhibited significant differences in at least 1 functional property compared with wild-type KCNE1"
        explanation: >-
          Reports the number of KCNE1 variants with significantly altered function when
          expressed in the homozygous state, the measurement this readout records.
    evidence:
    - reference: PMID:41200805
      reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We determined the functional properties of 95 KCNE1 variants coexpressed with KCNQ1 in heterologous cells using high-throughput voltage-clamp recording."
      explanation: >-
        States the model system and assay, establishing that this heterologous
        expression platform is what was used to determine KCNE1 variant function and
        is therefore informative for the biallelic-loss node.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The cardiomyocyte action potential and the stria vascularis epithelium are
        outside the model boundary. The assay measures the channel current only, so
        every downstream node in both branches of this entry's pathograph is
        inferred rather than observed here.
      evidence:
      - reference: PMID:41200805
        reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The most widely used approach for determining the functional consequences of an ion channel variant involves heterologous expression of a recombinant channel coupled with voltage-clamp electrophysiological recording."
        explanation: >-
          Describes the assay as heterologous expression of a recombinant channel,
          which is what places the cardiomyocyte and the stria vascularis outside
          the model boundary.
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        The host cell is Chinese hamster rather than human, but the expressed
        channel subunits are both human and the readout is the current those human
        subunits carry, so the host species does not bear on this link's claim.
      evidence:
      - reference: PMID:41200805
        reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Chinese hamster ovary (CHO) subclone K1 (CHO-K1) cells (catalog #CCL-61, American Type Culture Collection, Manassas, VA), or CHO-K1 cells constitutively expressing human KCNE1 (designated CHO-KCNE1 cells)"
        explanation: >-
          Names the Chinese hamster host cell line, the species divergence recorded
          here, and shows the expressed KCNE1 subunit is the human one.
  evidence:
  - reference: PMID:41200805
    reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We determined the functional properties of 95 KCNE1 variants coexpressed with KCNQ1 in heterologous cells using high-throughput voltage-clamp recording."
    explanation: >-
      Describes the model system whose results are curated in this entry's genetic
      and prevalence sections.
  notes: >-
    This is the only KCNE1-specific experimental platform curated here. No
    JLNS2-specific iPSC-derived cardiomyocyte or inner-ear hair cell model was
    identified: the published JLNS iPSC work engineers KCNQ1 variants (JLNS1), and
    a review of JLNS experimental models states that JLNS-specific iPSC-derived
    inner hair cell models are lacking. Importing those KCNQ1 models here would
    breach this entry's KCNE1 scope, so the gap is recorded rather than filled.
diagnosis:
- name: Combined Clinical and Molecular Diagnostic Criteria
  description: >-
    JLNS2 is diagnosed by the combination of the characteristic phenotype
    (congenital sensorineural deafness plus a prolonged QT interval) and
    confirmatory molecular testing showing biallelic pathogenic KCNE1
    variants.
  results: >-
    A child presenting with congenital sensorineural deafness and a
    prolonged QT interval, in whom molecular testing identifies biallelic
    pathogenic KCNE1 (or KCNQ1) variants, meets the diagnostic criteria for
    JLNS.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of JLNS is established in a child with congenital sensorineural deafness, long QT interval, and presence of biallelic pathogenic variants in either KCNQ1 or KCNE1."
    explanation: >-
      GeneReviews states the combined clinical-plus-molecular diagnostic
      criteria for JLNS, of which the KCNE1 arm defines JLNS2.
- name: Molecular Genetic Testing
  description: >-
    Molecular confirmation of biallelic KCNE1 pathogenic variants is
    required to distinguish JLNS2 from JLNS1 (biallelic KCNQ1) and from
    heterozygous KCNE1-related dominant LQT5, which lacks congenital
    deafness.
  results: >-
    Detection of two pathogenic KCNE1 alleles (homozygous or compound
    heterozygous) in trans confirms JLNS2 and distinguishes it from the
    allelic dominant LQT5 phenotype, in which only one KCNE1 allele is
    affected.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:30461122
    reference_title: "Mutational and phenotypic spectra of KCNE1 deficiency in Jervell and Lange-Nielsen Syndrome and Romano-Ward Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygotes for loss-of-function variants of KCNE1 may have normal QT intervals while biallelic null alleles are associated with JLNS2"
    explanation: >-
      Establishes that molecular zygosity (biallelic versus heterozygous) is
      the diagnostic feature that separates JLNS2 from the milder dominant
      KCNE1 phenotype.
- name: Resting Electrocardiography with QTc Assessment
  description: >-
    Baseline 12-lead ECG measurement of the corrected QT interval is the core
    diagnostic procedure for identifying the QT-prolongation component of
    JLNS2.
  results: >-
    A markedly prolonged QTc, usually >500 msec in JLNS, supports the
    cardiac component of the diagnosis.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  notes: >-
    NCIT does not provide an ECG-specific diagnostic term here, so the
    preferred term is narrowed in the name and description.
  evidence:
  - reference: DOI:10.3390/children11050582
    reference_title: "Congenital Long QT Syndrome in Children and Adolescents: A General Overview"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by a prolongation of QTc interval on ECG"
    explanation: >-
      A 2024 congenital LQTS review states that ECG-measured QTc
      prolongation is the defining diagnostic feature of the QT-prolongation
      component shared by all congenital LQTS subtypes, including JLNS.
clinical_trials:
- name: NCT06534671
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    A single-participant Vanderbilt University Medical Center trial testing
    the acute effect of a single intravenous dose of diltiazem, a calcium
    channel blocker, on the QT interval in a genetically confirmed JLNS
    patient. The trial's public summary does not specify whether the
    participant carried KCNQ1 or KCNE1 variants, so it is recorded here as
    JLNS-wide (not confirmed JLNS2-specific) evidence.
  target_phenotypes:
  - preferred_term: Prolonged QT interval
    term:
      id: HP:0001657
      label: Prolonged QT interval
  evidence:
  - reference: clinicaltrials:NCT06534671
    reference_title: "Diltiazem in Jervell and Lange-Nielsen Syndrome"
    supports: SUPPORT
    snippet: "This study will test the effect of diltiazem, a calcium channel blocking drug, on the QT interval in patients with Jervell and Lange-Nielsen syndrome. This will be a single IV dose and acute effects (within minutes) will be observed."
    explanation: >-
      ClinicalTrials.gov summary of the only identified JLNS-specific
      interventional trial testing a candidate acute QT-shortening agent.
  notes: >-
    Completed October 2024 with a single enrolled participant; no
    peer-reviewed efficacy results have been identified. Experimental, not a
    standard-of-care treatment; not added to the treatments section pending
    published results.

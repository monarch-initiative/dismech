inheritance:
- name: Autosomal Recessive
  description: >-
    JLNS2 is inherited in an autosomal recessive manner. Affected individuals
    are homozygous or compound heterozygous for KCNE1 loss-of-function
    variants; parents are typically heterozygous carriers who are usually
    clinically unaffected or show only mild, incompletely penetrant QT
    prolongation (the allelic dominant LQT5 phenotype). At conception, each
    sib of an affected individual has a 25% chance of being affected, a 50%
    chance of being an asymptomatic or mildly affected carrier, and a 25%
    chance of being unaffected and non-carrier.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

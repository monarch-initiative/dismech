      homozygous state.
  downstream:
  - target: Loss of IKs Current in Cardiac Myocytes
    description: >-
      IKs generated by the KCNQ1/KCNE1 complex is a major repolarizing current
      in cardiac myocytes; loss of KCNE1 function reduces this current in the
      heart.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42389506
      reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The ion channel subunits encoded by KCNQ1 and KCNE1 generate slow delayed rectifier potassium currents (IKs), which are essential for endolymph production in the inner ear and cardiomyocyte action potential (AP)"
      explanation: >-
        States both the cardiac and cochlear roles of the KCNQ1/KCNE1 IKs
        complex, the basis of this branch of the fork.
  - target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
    description: >-
      The same KCNQ1/KCNE1 IKs channel complex is expressed on the apical
      membrane of marginal cells of the stria vascularis, where it drives
      potassium secretion into the endolymph; loss of KCNE1 function reduces
      this current in the inner ear.
    causal_link_type: DIRECT
    evidence:

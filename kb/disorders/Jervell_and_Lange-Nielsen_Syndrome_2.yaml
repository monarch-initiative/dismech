mechanistic_hypotheses:
- hypothesis_group_id: variant_specific_dominant_negative_vs_haploinsufficiency
  hypothesis_label: Variant-specific dominant-negative versus simple loss-of-function/haploinsufficiency KCNE1 mechanism
  status: EMERGING
  description: >-
    KCNE1 loss-of-function variants appear to split mechanistically by
    variant. A large 2025 functional screen found no apparent dominant-negative
    effect on wild-type IKs current among the KCNE1 variants it tested when
    coexpressed with wild-type KCNE1, consistent with a simple recessive
    loss-of-function/haploinsufficiency mechanism requiring biallelic loss for
    JLNS2. However, an independent study of KCNE1 nonsense and missense
    alleles reports that coassembly of certain other mutant KCNE1 monomers
    with wild-type KCNQ1 subunits produces dominant Romano-Ward syndrome via a
    dominant-negative mechanism. Whether these are truly non-overlapping
    variant classes, or whether the discrepancy partly reflects differences in
    the specific variants and assay conditions tested, is not yet resolved.
  evidence:
  - reference: PMID:41200805
    reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed no apparent dominant-negative effects when variant and wild-type KCNE1 were coexpressed."
    explanation: >-
      Direct functional data supporting a simple loss-of-function/
      haploinsufficiency mechanism for the specific KCNE1 variant panel tested.
  - reference: PMID:30461122
    reference_title: "Mutational and phenotypic spectra of KCNE1 deficiency in Jervell and Lange-Nielsen Syndrome and Romano-Ward Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coassembly of certain mutant KCNE1 monomers with wild-type KCNQ1 subunits results in RWS by a dominant negative mechanism."
    explanation: >-
      Independent evidence that at least some KCNE1 missense variants act
      dominantly through a dominant-negative mechanism, the counterpoint this
      hypothesis has to reconcile with the functional screen's negative
      finding.
discussions:
- discussion_id: jlns2_no_kcne1_specific_human_cellular_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of IKs Current in Cardiac Myocytes
  - pathophysiology#Endocochlear Potential Collapse and Hair Cell Degeneration
  prompt: >-
    Does a patient-derived or genome-edited human cellular model carrying biallelic
    KCNE1 variants exist for either the cardiac or the cochlear branch of JLNS2?
  rationale: >-
    The flagship human cellular model of JLNS is a hiPSC-derived cardiomyocyte
    series that reproduces the severe features of the disease, but its two variants
    are both in KCNQ1, so it models JLNS1. On the cochlear side a review of JLNS
    experimental models states that JLNS-specific iPSC-derived inner hair cell
    models are lacking altogether. The consequence is that every human cellular
    claim about JLNS2 in this entry is either heterologous (the CHO-K1 voltage-clamp
    platform under experimental_models, which measures channel current but contains
    neither a cardiomyocyte action potential nor a stria vascularis) or is
    transferred from KCNQ1 disease. This matters more than the usual model gap
    because the two genotypes are not clinically interchangeable: the JLNS2 cardiac
    course appears milder, so a KCNQ1 model may overstate the severity of the
    cardiac branch it is being read across to.
  evidence:
  - reference: PMID:25453094
    reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used complementary approaches, reprogramming patient cells and genetic engineering, to generate human induced pluripotent stem cell (hiPSC) models of JLNS, covering splice site (c.478-2A>T) and missense (c.1781G>A) mutations, the two major classes of JLNS-causing defects in KCNQ1."
    explanation: >-
      Establishes that both variants in the landmark JLNS hiPSC model are KCNQ1,
      so the platform models JLNS1 and not the KCNE1 disease curated here.
  - reference: PMID:25453094
    reference_title: "Recessive cardiac phenotypes in induced pluripotent stem cell models of Jervell and Lange-Nielsen syndrome: disease mechanisms and pharmacological rescue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Electrophysiological comparison of hiPSC-derived cardiomyocytes (CMs) from homozygous JLNS, heterozygous, and wild-type lines recapitulated the typical and severe features of JLNS"
    explanation: >-
      Shows the platform does successfully recapitulate JLNS features, which is why
      its restriction to KCNQ1 is a gap worth recording rather than a dead end.
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although JLNS‐specific iPS‐IHC models are lacking, existing protocols enable the replication of JLNS genotypes and mechanotransduction studies."
    explanation: >-
      A review of JLNS experimental models stating that JLNS-specific iPSC-derived
      inner hair cell models do not exist. This is the closest published statement
      to the cochlear half of this gap; note it concerns hair cells, whereas the
      initiating JLNS2 cochlear lesion is in the stria vascularis marginal cell, for
      which the review describes no model either.
  proposed_experiments:
  - experiment_id: exp_jlns2_kcne1_ipsc_cardiomyocyte_and_strial_models
    name: KCNE1-biallelic hiPSC cardiomyocyte and stria vascularis marginal-cell models
    description: >-
      Reprogram cells from a genotype-confirmed JLNS2 patient, or introduce a
      reported biallelic KCNE1 null allele into a control hiPSC line by genome
      editing, then run two arms. Cardiac arm: differentiate to cardiomyocytes and
      compare IKs density, action potential duration and adrenergic response against
      the existing KCNQ1 JLNS1 lines in parallel, so the KCNE1-versus-KCNQ1 severity
      difference seen clinically is tested rather than inferred. Cochlear arm:
      differentiate to stria vascularis marginal cells, or an equivalent cochlear
      potassium-secreting epithelium, and measure apical potassium secretion and
      transepithelial potential. The cochlear arm deliberately targets the strial
      epithelium rather than the inner hair cell, because the primary JLNS2 cochlear
      lesion is a marginal-cell ionic defect and hair cell degeneration is downstream
      of endocochlear potential collapse, so a hair-cell model would not test the
      initiating step. Published differentiation protocols exist for inner hair cells
      but not for this cell type, which is itself part of the gap.
    would_support:
    - pathophysiology#Loss of IKs Current in Cardiac Myocytes
    - pathophysiology#Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
    supporting_outcome:
    - >-
        KCNE1-biallelic cardiomyocytes show reduced IKs and prolonged action potential
        duration relative to isogenic controls, with a smaller effect size than the
        KCNQ1 lines, matching the milder clinical course reported for JLNS2.
    - >-
        KCNE1-biallelic strial marginal cells show reduced apical potassium secretion
        and a reduced transepithelial potential relative to isogenic controls.
    would_refute:
    - pathophysiology#Loss of IKs Current in Cardiac Myocytes
    - pathophysiology#Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
    refuting_outcome:
    - >-
        KCNE1-biallelic cardiomyocytes show IKs density and action potential duration
        indistinguishable from isogenic controls, which would place the cardiac branch
        of this entry's mechanism in question for this genotype.
    - >-
        KCNE1-biallelic strial marginal cells secrete potassium and sustain a
        transepithelial potential indistinguishable from isogenic controls, which
        would place the cochlear branch in question for this genotype.
- discussion_id: jlns2_vestibular_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells"
  prompt: >-
    Do genotype-confirmed human JLNS2 (biallelic KCNE1) patients have
    clinically significant vestibular dysfunction, as Kcne1-/- mice do?
  rationale: >-
    Kcne1-/- mice show clear structural and functional vestibular involvement:
    KCNQ1/KCNE1 channels are expressed in vestibular dark cells as well as
    strial marginal cells, and untreated Kcne1-/- mice show abnormal
    endolymphatic-space development, vestibular hair cell degeneration, and
    impaired vestibular behavior that gene therapy can rescue (PMID:33514733).
    However, the only quantitative human vestibular study of JLNS
    (PMID:25471708) genotyped its cohort and found all 14 tested cases carried
    double KCNQ1 (JLNS1) mutations, not KCNE1. Whether the mouse vestibular
    phenotype translates to genotype-confirmed human JLNS2 patients is
    therefore untested, and this entry deliberately does not curate vestibular
    dysfunction as an established JLNS2 phenotype.
  evidence:

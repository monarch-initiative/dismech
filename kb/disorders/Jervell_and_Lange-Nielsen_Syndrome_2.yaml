      snippet: "In the inner ear, KCNQ1/KCNE1 potassium channels are expressed exclusively in the apical membrane of marginal cells (MCs) in the stria vascularis (SV) and in vestibular dark cells"
      explanation: >-
        Establishes the specific inner-ear cellular localization of the
        KCNQ1/KCNE1 channel complex whose loss initiates the cochlear branch
        of the phenotype.

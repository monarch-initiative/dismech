name: Jervell and Lange-Nielsen Syndrome 2
creation_date: "2026-08-17T00:00:00Z"
description: >-
  Jervell and Lange-Nielsen syndrome 2 (JLNS2) is an ultra-rare autosomal
  recessive cardioauditory channelopathy caused by biallelic loss-of-function
  variants in KCNE1, which encodes MinK, the single-transmembrane-domain beta
  subunit that assembles with the KCNQ1 alpha subunit to form the slow
  delayed-rectifier potassium (IKs) channel. JLNS2 is the allelic recessive
  counterpart of KCNE1-related autosomal dominant long QT syndrome (LQT5):
  a single heterozygous KCNE1 variant produces, at best, a low-penetrance
  dominant QT-prolongation phenotype, while biallelic loss essentially
  abolishes IKs current and produces the severe recessive JLNS phenotype. The
  IKs channel is expressed in both cardiac myocytes, where it contributes to
  repolarization of the ventricular action potential, and in the marginal
  cells of the stria vascularis of the inner ear, where it drives potassium
  secretion into the endolymph that generates and maintains the endocochlear
  potential required for hair-cell mechanotransduction. Biallelic KCNE1 loss
  therefore produces a two-organ phenotype: congenital profound bilateral
  sensorineural deafness from collapse of the endocochlear potential, together
  with marked QT-interval prolongation and a risk of torsade de pointes,
  ventricular fibrillation, syncope, and sudden cardiac death from loss of
  ventricular repolarization reserve. JLNS2 is distinguished from the more
  common JLNS1 (biallelic KCNQ1 variants) only by the causal gene, and the two
  are clinically similar at the bedside, but JLNS2 is markedly rarer -
  approximately 90% of JLNS cases are attributable to KCNQ1 and only about 10%
  to KCNE1 - and the limited comparative data available suggest a milder
  arrhythmic course than JLNS1. This entry is careful not to import JLNS1
  (KCNQ1) case series, severity estimates, or vestibular-dysfunction findings,
  which are curated separately.
category: Mendelian
disease_term:
  preferred_term: Jervell and Lange-Nielsen syndrome 2
  term:
    id: MONDO:0012871
    label: Jervell and Lange-Nielsen syndrome 2
synonyms:
- JLNS2
- Jervell and Lange-Nielsen syndrome type 2
- Jervell and Lange-Nielsen syndrome caused by mutation in KCNE1
- KCNE1 Jervell and Lange-Nielsen syndrome
parents:
- Jervell and Lange-Nielsen Syndrome
- Cardiac Arrhythmia
- Channelopathy
- Sensorineural Hearing Loss
notes: >-
  IDENTITY / NEC NOTE. MONDO:0012871 (OMIM:612347) is explicitly defined as
  "Any Jervell and Lange-Nielsen syndrome in which the cause of the disease is
  a mutation in the KCNE1 gene" and asserts RO:0004003 to HGNC:6240 (KCNE1);
  it is_a both MONDO:0002441 (Jervell and Lange-Nielsen syndrome) and
  MONDO:0013372 (long QT syndrome 5). This entry is curated strictly against
  the KCNE1 identity. The allelic, more common recessive form caused by
  biallelic KCNQ1 variants (JLNS1, MONDO:0024540) is curated separately and no
  JLNS1-specific case data, prevalence figures, or phenotype findings
  (including the KCNQ1-genotyped vestibular-dysfunction series of Winbo et al.,
  PMID:25471708, whose 14/14 genotyped subjects all carried double KCNQ1
  mutations) are imported here.

  RARITY. JLNS2 is markedly rarer than JLNS1: approximately 90% of JLNS cases
  are attributable to KCNQ1 variants and only about 10% to KCNE1 (PMID:42389506).
  A 2025 functional-profiling study of 95 KCNE1 variants estimated a JLNS2
  population carrier frequency of 1 in 1034 using Hardy-Weinberg principles
  applied to gnomAD allele counts of dysfunctional variants (PMID:41200805).
  The largest genotype-confirmed JLNS2 cohort assembled to date is 19 patients,
  drawn from an international multicenter LQT5 study (PMID:31941373). Case
  counts and severity figures in this entry are held to that scale rather than
  to JLNS1's more extensively reported literature.

  ALLELIC SPECTRUM. KCNE1 produces a genotype-phenotype spectrum rather than a
  strict dominant/recessive dichotomy: heterozygous carriers of KCNE1
  loss-of-function variants are usually clinically silent or show only a low
  ECG penetrance (dominant LQT5), while biallelic null alleles are required for
  the fully penetrant recessive JLNS2 phenotype (PMID:30461122, PMID:41200805).
  ClinGen's gene curation working group considers the evidence for autosomal
  dominant KCNE1-LQT5 causality disputed even though KCNE1 is an accepted
  cause of recessive JLNS2 (PMID:41200805). Long_QT_Syndrome.yaml curates the
  dominant LQT5 (Type 5) subtype of that spectrum; this entry curates the
  distinct, more severe biallelic phenotype.

  HUMAN/MOUSE VESTIBULAR MISMATCH. Kcne1-/- mice show clear structural and
  functional vestibular involvement (endolymphatic-space abnormality,
  vestibular dark cell and hair cell degeneration, impaired vestibular
  function rescued by gene therapy; PMID:33514733). No genotype-confirmed
  human vestibular data specific to KCNE1/JLNS2 patients have been identified;
  the only quantitative human vestibular study of JLNS (PMID:25471708) enrolled
  exclusively double-KCNQ1 (JLNS1) cases. This is recorded as a
  HUMAN_MODEL_MISMATCH discussion rather than as an established human
  phenotype.

  MODULE CONFORMANCE SCOPE. The cardiac branch declares conforms_to against
  cardiac_ion_channel_repolarization. The cochlear branch declares conforms_to
  against sensorineural_hair_cell_loss starting at "Cochlear Ionic Homeostasis
  Disruption and Oxidative Stress" (whose own description explicitly names
  potassium-recycling/endocochlear-potential failure as a covered mechanism),
  rather than at the module's "Cochlear Sensory Epithelium Insult" entry node,
  because the primary JLNS2 lesion is a stria vascularis marginal-cell ionic
  defect rather than a primary hair-cell stereociliary/mechanotransduction
  defect.

  DATASETS. A GEO search over this disorder returned no candidate accessions, which
  is the expected result for a disease whose largest genotyped cohort is 19
  patients. The datasets section is left empty rather than populated with KCNE1
  gene-only or JLNS1 hits, which is the Named Entity Confusion failure mode that
  dataset search invites.

  SYNDROME-LEVEL VERSUS GENOTYPE-LEVEL DATA. Several sections added in the 2026-09
  augmentation pass (progression, the bradycardia, T-wave alternans and gross motor
  developmental delay phenotypes, the biochemical markers, and the anesthesia
  exposure) rest on sources reporting JLNS as a whole rather than KCNE1-genotyped
  series, because no KCNE1-stratified data for those features exist. Each such
  record says so in its own notes. The one genotype-specific natural-history record
  is the KCNE1 phase of progression, drawn from the 19-patient JLNS2 cohort.

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      The cardiac axis of JLNS2 is a primary inherited arrhythmia syndrome -
      marked QTc prolongation with torsade de pointes and sudden-death risk -
      which is the subject of Harrison's cardiovascular Part.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Prolongation of the QTc interval is associated with tachyarrhythmias, including ventricular tachycardia, episodes of torsade de pointes ventricular tachycardia, and ventricular fibrillation, which may culminate in syncope or sudden death."
      explanation: >-
        GeneReviews characterises the cardiac component of JLNS as a ventricular
        tachyarrhythmia syndrome, which is where Harrison's places the inherited
        arrhythmia syndromes.
  - classification_value: DISORDER_OF_EAR
    notes: >-
      Congenital profound bilateral sensorineural hearing loss is one of the two
      defining features of JLNS, not an incidental association, so the ear Part
      is assigned alongside the cardiovascular one rather than instead of it.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Jervell and Lange-Nielsen syndrome (JLNS) is characterized by congenital profound bilateral sensorineural hearing loss and long QTc, usually >500 msec."
      explanation: >-
        GeneReviews defines JLNS by congenital profound bilateral sensorineural
        hearing loss together with QTc prolongation, establishing the ear as a
        primary rather than secondary organ of involvement.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      JLNS2 is a Mendelian disorder requiring biallelic KCNE1 variants, so the
      Mendelian-genetics Part applies in addition to the two organ-system Parts.
    evidence:
    - reference: PMID:20301579
      reference_title: "Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "JLNS is inherited in an autosomal recessive manner."
      explanation: >-
        GeneReviews states the autosomal recessive Mendelian inheritance that
        places JLNS in Harrison's genetics Part.
  channelopathy_category:
    classification_value: cardiac channelopathy
    notes: >-
      ChannelopathyOrganSystemEnum is single-valued, and JLNS2 is a channelopathy
      in two organ systems: the same IKs channel carries ventricular repolarizing
      current in cardiac myocytes and drives potassium secretion by the epithelial
      marginal cells of the stria vascularis. "cardiac channelopathy" is assigned
      because that is how the disease is classified clinically and how its dominant
      allelic form (LQT5) is grouped, but the cochlear lesion is an epithelial
      transport defect and would take "epithelial channelopathy" if the slot were
      multivalued. Recorded here rather than resolved by picking a second value.
    evidence:
    - reference: PMID:42389506
      reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "KCNQ1 encodes the alpha subunit Kv7.1 of the ion channels accountable for slow delayed rectifier potassium currents (IKs), whereas KCNE1 encodes the beta subunit mink, which modulates the function of IKs."
      explanation: >-
        Identifies KCNE1 as the beta subunit of the IKs potassium channel, so JLNS2
        is an ion-channel disorder; paired with the QT prolongation that defines the
        syndrome, this supports the cardiac channelopathy grouping.
    - reference: PMID:42389506
      reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Jervell and Lange-Nielsen syndrome (JLNS) is defined by electrocardiographic QT prolongation and sensorineural hearing loss, caused by homozygous or compound heterozygous variants in KCNQ1 and/or KCNE1."
      explanation: >-
        States that JLNS is defined by electrocardiographic QT prolongation and is
        caused by KCNQ1 and/or KCNE1 variants, the cardiac-rhythm half of the
        channelopathy assignment.
inheritance:
- name: Autosomal Recessive
  description: >-
    JLNS2 is inherited in an autosomal recessive manner. Affected individuals
    are homozygous or compound heterozygous for KCNE1 loss-of-function
    variants; parents are typically heterozygous carriers who are usually
    clinically unaffected or show only mild, incompletely penetrant QT
    prolongation (the allelic dominant LQT5 phenotype). At conception, each
    sib of an affected individual has a 25% chance of being affected, a 50%
    chance of being an asymptomatic or mildly affected carrier, and a 25%
    chance of being unaffected and non-carrier.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "JLNS is inherited in an autosomal recessive manner. Parents of a child with JLNS are usually heterozygotes; rarely, only one parent is heterozygous"
    explanation: >-
      GeneReviews establishes the autosomal recessive inheritance pattern and
      typical carrier status of parents.
  - reference: PMID:30461122
    reference_title: "Mutational and phenotypic spectra of KCNE1 deficiency in Jervell and Lange-Nielsen Syndrome and Romano-Ward Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygotes for loss-of-function variants of KCNE1 may have normal QT intervals while biallelic null alleles are associated with JLNS2"
    explanation: >-
      Documents that biallelic KCNE1 loss of function, not heterozygosity, is
      required for the fully penetrant JLNS2 phenotype.
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual usually has a 25% chance of being affected with JLNS, a 50% chance of being a carrier of a JLNS-causing pathogenic variant and potentially at risk for LQTS, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews states the exact per-pregnancy recurrence-risk figures
      (25% affected, 50% carrier, 25% unaffected non-carrier) summarized in
      this node's description.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No direct birth-prevalence estimate for JLNS2 specifically has been
    published; JLNS overall (both genes) is estimated at roughly 1 in 200,000
    to 1 in 1,000,000, and approximately 90% of genotyped JLNS cases are
    attributable to KCNQ1 rather than KCNE1, making JLNS2 a small minority of
    an already rare disease.
  evidence:
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately 90% of cases of JLNS are associated with KCNQ1 variants, and the remaining cases are attributable to KCNE1 variants"
    explanation: >-
      Establishes that KCNE1 (JLNS2) accounts for only a minority of genotyped
      JLNS cases, the basis for treating JLNS2 as markedly rarer than JLNS1.
- population: Worldwide (carrier frequency, functional-variant estimate)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: NOT_YET_DOCUMENTED
  rate_per_100000: 96.7
  notes: >-
    Estimated by applying Hardy-Weinberg principles to gnomAD allele counts of
    KCNE1 variants shown experimentally to reduce IKs current density below 50%
    of wild type; 1 in 1034 converts to approximately 96.7 per 100,000. This is
    a carrier-frequency estimate, not a measured disease birth prevalence.
  evidence:
  - reference: PMID:41200805
    reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The population carrier frequency of JLN2 was calculated as 1 in 1034."
    explanation: >-
      Direct quantitative carrier-frequency estimate for JLNS2 derived from
      high-throughput functional profiling of KCNE1 variants combined with
      population allele-frequency data.
progression:
- phase: Fetal and neonatal recognition
  age_range: Fetal life through the neonatal period
  notes: >-
    The two organ systems declare themselves by different routes and at different
    clinics: prolonged QT intervals and T-wave alternans bring the child to
    cardiology, with bradycardia detectable earlier still from fetal life, while a
    failed newborn hearing screen brings the child to otorhinolaryngology. Both are
    reported for JLNS as a whole rather than stratified by causal gene, so this
    phase describes JLNS2 by inheritance from the syndrome-level natural history
    and not from KCNE1-genotyped series.
  evidence:
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Children diagnosed with JLNS typically exhibit bradycardia beginning in the fetal stage"
    explanation: >-
      Documents bradycardia detectable from fetal life as the earliest cardiac
      manifestation, establishing the fetal/neonatal boundary of this phase.
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with JLNS are referred to the otorhinolaryngology department owing to failed newborn hearing tests"
    explanation: >-
      Documents the failed newborn hearing test as the other route by which JLNS is
      first recognized in the neonatal period.
- phase: Childhood arrhythmic onset
  age_range: Birth to 18 years, with half of first cardiac events before age 3
  notes: >-
    Cardiac events cluster in early childhood and are largely complete by
    adulthood. Both figures below are syndrome-level (KCNQ1 and KCNE1 combined);
    no age-at-first-event distribution restricted to genotyped KCNE1 patients has
    been published, and the JLNS2-specific event rate is recorded separately in
    the KCNE1 genotype phase below.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fifty percent of individuals with JLNS had cardiac events before age three years."
    explanation: >-
      GeneReviews gives the proportion of JLNS patients with cardiac events before
      age three, fixing the early-childhood peak of this phase.
  - reference: PMID:42389506
    reference_title: "Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Half of the children with JLNS exhibit arrhythmia by 3 years of age, and 90% of patients display symptoms before they reach the age of 18"
    explanation: >-
      Independently reports the same 3-year figure and extends it, giving the
      proportion symptomatic by age 18 that closes this phase.
- phase: Untreated natural history
  age_range: Childhood through mid-adolescence
  notes: >-
    The untreated mortality figure is what motivates presymptomatic beta-blockade
    and device therapy in the treatments section. It predates modern management
    and is syndrome-level; it should not be read as the expected outcome of a
    treated JLNS2 patient, and the milder KCNE1 event rate below suggests it
    overstates the untreated risk for this genotype specifically.

    The registry cohort added alongside it (44 JLNS patients from the US portion of
    the International LQTS Registry) is phenotypically rather than genotypically
    defined, so it too cannot be attributed to KCNE1; it is included because it is
    the largest prospective natural-history series for the syndrome and because its
    treated event rate is the counterpoint to the untreated figure. In that
    cohort the mean age at cardiac event was 5.0 years and mean QTc was 548 ms;
    those two figures are recorded here rather than quoted because the source
    sentence carries them inside bracketed standard-deviation spans, which the
    reference validator strips before matching.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than half of untreated children with JLNS die before age 15 years."
    explanation: >-
      GeneReviews gives the untreated case-fatality figure that defines this phase
      and the urgency of early treatment.
  - reference: PMID:16911578
    reference_title: "Clinical course and risk stratification of patients affected with the Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative rates of cardiac events from birth through age 40 among JLNS and RWS patients were 93%"
    explanation: >-
      A prospective JLNS registry cohort quantifying the cumulative cardiac event
      rate from birth to age 40, and contrasting it with the dominant form, which
      puts a number on the event burden this phase describes.
  - reference: PMID:16911578
    reference_title: "Clinical course and risk stratification of patients affected with the Jervell and Lange-Nielsen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with JLNS experience a high rate of cardiac and fatal events from early childhood despite medical therapy."
    explanation: >-
      States that the high event rate persists despite medical therapy, which is the
      distinction between this phase and the untreated figure above it.
- phase: KCNE1 (JLNS2) genotype-specific course
  notes: >-
    This is the only phase in this section derived from genotype-confirmed KCNE1
    patients rather than from JLNS-wide data. It rests on 19 patients, the largest
    JLNS2 series assembled to date, so the apparent mildness is a small-sample
    observation and the confidence interval reported in that study is wide.

    age_range is deliberately absent, unlike the other three phases. The source
    reports no age distribution for its 19 JLNS2 patients - no age at enrollment,
    at first event, or at follow-up - so any range here would be carried over from
    the syndrome-level phases above, which is exactly the genotype conflation this
    phase exists to avoid.
  evidence:
  - reference: PMID:31941373
    reference_title: "An International Multicenter Evaluation of Type 5 Long QT Syndrome: A Low Penetrant Primary Arrhythmic Condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Event incidence did not differ significantly for Type 2 Jervell and Lange-Nielsen syndrome patients relative to the overall heterozygous cohort (10.5%"
    explanation: >-
      Gives the definite-arrhythmic-event rate in genotype-confirmed JLNS2 patients,
      the only such rate published for this genotype.
  - reference: PMID:31941373
    reference_title: "An International Multicenter Evaluation of Type 5 Long QT Syndrome: A Low Penetrant Primary Arrhythmic Condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aligning with the mild phenotype observed for Type 2 Jervell and Lange-Nielsen syndrome patients."
    explanation: >-
      The authors' own characterization of the JLNS2 course as mild, which is the
      clinical conclusion this phase records.
genetic:
- name: KCNE1
  notes: >-
    KCNE1 (21q22.11) encodes MinK, a 129-amino-acid single-transmembrane-domain
    protein that is the regulatory beta subunit of the IKs channel; it must
    coassemble with the KCNQ1 (Kv7.1) alpha subunit to generate the slow
    delayed-rectifier potassium current. A 2025 high-throughput voltage-clamp
    screen of 95 KCNE1 variants found that about half exhibited peak current
    densities significantly different from wild type when studied in the
    homozygous state, with most dysfunctional variants showing loss-of-function
    properties and no apparent dominant-negative effect on the specific
    variant panel tested when variant and wild-type KCNE1 were coexpressed.
    This is not a categorical claim that KCNE1 variants are never
    dominant-negative: a separate study of KCNE1 nonsense alleles reports that
    coassembly of certain other mutant KCNE1 monomers with wild-type KCNQ1
    subunits does produce dominant Romano-Ward syndrome via a dominant-negative
    mechanism. The two observations are reconciled, not contradictory, by
    variant-specific mechanism: most loss-of-function KCNE1 alleles behave as
    simple recessive nulls requiring biallelic loss for JLNS2, while a smaller
    set of missense alleles instead act dominantly through interference with
    wild-type KCNQ1/KCNE1 complexes.
  gene_term:
    preferred_term: KCNE1
    term:
      id: hgnc:6240
      label: KCNE1
  relationship_type: CAUSATIVE
  case_fractions:
  - population: Egyptian JLNS cohort (52 sequenced patients, 47 families, 76.2% consanguineous)
    case_fraction_percent: 2.0
    cohort_size: 52
    notes: >-
      One of 52 sequenced JLNS patients carried a homozygous KCNE1 variant; the
      other 51 carried KCNQ1. The authors note this 98%/2% split is close to the
      95%/5% split reported by Schwartz et al. (2006). Preprint, not yet
      peer-reviewed at the time of curation.
    evidence:
    - reference: PPR:PPR1109906
      reference_title: "The mutational spectrum of Jervell and Lange-Nielsen syndrome: insights from highly consanguineous families"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All of the sequenced patients (n=52) harbored homozygous variants in KCNQ1 (n=51) or KCNE1 (n=1)."
      explanation: >-
        Gives the gene-level breakdown of a genotyped JLNS cohort: 51 of 52 sequenced
        patients carried KCNQ1 and one carried KCNE1, the case fraction recorded here.
    - reference: PPR:PPR1109906
      reference_title: "The mutational spectrum of Jervell and Lange-Nielsen syndrome: insights from highly consanguineous families"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "proportion of patients in the Egypt JLNS cohort, who harbored variants in KCNQ1 (98%) or KCNE1 (2%)"
      explanation: >-
        The authors' own statement of the KCNQ1/KCNE1 proportions in their cohort and
        its agreement with the earlier Schwartz series.
  - population: Iranian JLNS families (14 patients and their families, KCNQ1/KCNE1 Sanger screen)
    case_fraction_percent: 0.0
    cohort_size: 14
    notes: >-
      A negative result, recorded because it bears on how rare KCNE1 is as a cause
      of JLNS. No pathogenic KCNE1 variant was found in this cohort; the only KCNE1
      finding was the common c.112G>A polymorphism, which is not a JLNS2 allele.
      The screen was Sanger sequencing of the two genes only, so it would not
      detect a copy-number variant, and the cohort is small enough that zero is
      compatible with the low single-digit percentages seen elsewhere. The report
      also never states how many of the 14 investigated patients were solved, so
      the denominator is patients screened rather than cases explained: this is a
      screening-negative result and is not directly comparable with the Egyptian
      case fraction above it.
    evidence:
    - reference: PMID:30942114
      reference_title: "Mutation Screening of KCNQ1 and KCNE1 Genes in Iranian Patients With Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified two frameshift mutations in the KCNQ1 gene, including a novel mutation, c.1356 1356delG, and a known mutation, c.1534_1534delG."
      explanation: >-
        The only causal variants the study identified in this JLNS cohort were in
        KCNQ1. That no pathogenic KCNE1 variant is reported is the basis of the zero
        recorded here, which is an argument from the study's silence on KCNE1 rather
        than an explicit negative statement, and is why the notes above qualify it.
    - reference: PMID:30942114
      reference_title: "Mutation Screening of KCNQ1 and KCNE1 Genes in Iranian Patients With Jervell and Lange-Nielsen Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There may be less frequency of mutations in the KCNQ1 and of KCNE1 genes in Iranian JLNS patients compared with other populations."
      explanation: >-
        The authors' own conclusion that KCNQ1 and KCNE1 mutation frequency was lower
        in this population than in others, the caveat this record is filed under.
  evidence:
  - reference: PMID:20301579
    reference_title: "Jervell and Lange-Nielsen Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of JLNS is established in a child with congenital sensorineural deafness, long QT interval, and presence of biallelic pathogenic variants in either KCNQ1 or KCNE1."
    explanation: >-
      GeneReviews establishes KCNE1 as one of the two genes in which biallelic
      pathogenic variants cause JLNS.
  - reference: PMID:41200805
    reference_title: "Functional Profiling of KCNE1 Variants Informs Population Carrier Frequency of Jervell and Lange-Nielsen Syndrome Type 2."

name: Jervell and Lange-Nielsen Syndrome 2
creation_date: "2026-08-17T00:00:00Z"
description: >-
  Jervell and Lange-Nielsen syndrome 2 (JLNS2) is an ultra-rare autosomal
  recessive cardioauditory channelopathy caused by biallelic loss-of-function
  variants in KCNE1, which encodes MinK, the single-transmembrane-domain beta
  subunit that assembles with the KCNQ1 alpha subunit to form the slow
  delayed-rectifier potassium (IKs) channel. JLNS2 is the allelic recessive
  counterpart of KCNE1-related autosomal dominant long QT syndrome (LQT5):
  a single heterozygous KCNE1 variant produces, at best, a low-penetrance
  dominant QT-prolongation phenotype, while biallelic loss essentially
  abolishes IKs current and produces the severe recessive JLNS phenotype. The
  IKs channel is expressed in both cardiac myocytes, where it contributes to
  repolarization of the ventricular action potential, and in the marginal
  cells of the stria vascularis of the inner ear, where it drives potassium
  secretion into the endolymph that generates and maintains the endocochlear
  potential required for hair-cell mechanotransduction. Biallelic KCNE1 loss
  therefore produces a two-organ phenotype: congenital profound bilateral
  sensorineural deafness from collapse of the endocochlear potential, together
  with marked QT-interval prolongation and a risk of torsade de pointes,
  ventricular fibrillation, syncope, and sudden cardiac death from loss of
  ventricular repolarization reserve. JLNS2 is distinguished from the more
  common JLNS1 (biallelic KCNQ1 variants) only by the causal gene, and the two
  are clinically similar at the bedside, but JLNS2 is markedly rarer -
  approximately 90% of JLNS cases are attributable to KCNQ1 and only about 10%
  to KCNE1 - and the limited comparative data available suggest a milder
  arrhythmic course than JLNS1. This entry is careful not to import JLNS1
  (KCNQ1) case series, severity estimates, or vestibular-dysfunction findings,
  which are curated separately.

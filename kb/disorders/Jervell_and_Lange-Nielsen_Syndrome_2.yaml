genetic:
- name: KCNE1
  notes: >-
    KCNE1 (21q22.11) encodes MinK, a 129-amino-acid single-transmembrane-domain
    protein that is the regulatory beta subunit of the IKs channel; it must
    coassemble with the KCNQ1 (Kv7.1) alpha subunit to generate the slow
    delayed-rectifier potassium current. A 2025 high-throughput voltage-clamp
    screen of 95 KCNE1 variants found that about half exhibited peak current
    densities significantly different from wild type when studied in the
    homozygous state, with most dysfunctional variants showing loss-of-function
    properties and no apparent dominant-negative effect on the specific
    variant panel tested when variant and wild-type KCNE1 were coexpressed.
    This is not a categorical claim that KCNE1 variants are never
    dominant-negative: a separate study of KCNE1 nonsense alleles reports that
    coassembly of certain other mutant KCNE1 monomers with wild-type KCNQ1
    subunits does produce dominant Romano-Ward syndrome via a dominant-negative
    mechanism. The two observations are reconciled, not contradictory, by
    variant-specific mechanism: most loss-of-function KCNE1 alleles behave as
    simple recessive nulls requiring biallelic loss for JLNS2, while a smaller
    set of missense alleles instead act dominantly through interference with
    wild-type KCNQ1/KCNE1 complexes.
  gene_term:
    preferred_term: KCNE1
    term:
      id: hgnc:6240
      label: KCNE1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:20301579

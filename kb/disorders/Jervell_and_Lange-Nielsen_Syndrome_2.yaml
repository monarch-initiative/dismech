- name: Congenital Profound Bilateral Sensorineural Hearing Loss
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  role: effector
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the cochlear branch of JLNS2: congenital,
    profound, bilateral sensorineural hearing loss present from birth. Unlike
    several other conformers of this module (e.g., noise- or age-related
    hearing loss), the JLNS deficit is typically already maximal at birth
    rather than accruing progressively over time; conformance here reflects
    the shared irreversible, non-regenerating hair-cell-loss endpoint rather
    than a claim of ongoing postnatal worsening.

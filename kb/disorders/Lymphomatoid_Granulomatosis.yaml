histopathology:
- name: Angiocentric and angiodestructive polymorphous infiltrate
  description: >-
    A polymorphous lymphoid infiltrate centred on and invading vessels, rich in
    reactive T cells, containing large atypical EBV-positive B cells, with
    coagulative necrosis. This combination is the diagnostic finding and is what
    separates the disease from other EBV-positive B-cell lymphoproliferations.
  diagnostic: true
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, the lesions showed angiocentricity, were rich in T cells, had large atypical B cells, and were positive for EBV."
    explanation: >-
      States the four features that together define the diagnostic histology.
- name: Grade assignment by EBER-positive B-cell density
  description: >-
    Grade is assigned from the number and density of EBER-positive atypical B
    cells and the extent of coagulative necrosis, predominantly on the diagnostic
    lung biopsy. In the reference series grades were distributed 30% grade 1, 22%
    grade 2 and 48% grade 3. Grading is acknowledged to be inconsistent and
    poorly reproducible between observers, which matters because it selects the
    treatment arm.
  diagnostic: true
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grading was performed predominantly on the lung biopsy at diagnosis; they were distributed as follows: LYG grade 1 (30%), grade 2 (22%), and grade 3 (48%)."
    explanation: >-
      Gives the grade distribution and confirms the lung biopsy as the grading
      substrate.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in practice, the grading can be inconsistent and poorly reproducible among observers."
    explanation: >-
      Records the reproducibility limitation of the grading system that drives
      therapy.
diagnosis:
- name: Tissue biopsy with EBER in situ hybridization
  description: >-
    Definitive diagnosis needs tissue, usually a lung biopsy, showing the
    angiocentric polymorphous infiltrate with EBER-positive atypical B cells.
    Immunohistochemistry for CD20, CD3, CD4, CD8 and LMP1 and immunoglobulin gene
    rearrangement studies support the diagnosis and set the grade.
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LYG is a distinct entity that can usually be differentiated from other EBV-associated B-cell lymphoproliferative disorders on the basis of the combination of clinical presentation, histology, and EBV studies."
    explanation: >-
      States that the diagnosis rests on the combination of clinical picture,
      histology and EBV studies.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grading of these lesions is important because it dictates the treatment choice."
    explanation: >-
      Explains why grading, and therefore adequate tissue, is a diagnostic
      requirement rather than an academic exercise.
- name: Recognition of diagnostic delay
  description: >-
    The combination of rarity and a nonspecific presentation - cough,
    breathlessness, fever, pulmonary nodules - routinely delays diagnosis, and
    the differential includes both infection and vasculitis.
  evidence:
  - reference: PMID:23006954
    reference_title: "Lymphomatoid granulomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The rareness of LYG in conjunction with its nonspecific presentation contributes to delays in diagnosis in many situations."
    explanation: >-
      Documents diagnostic delay as a recognised feature of the disease.
differential_diagnoses:
- name: Other EBV-positive B-cell lymphoproliferative disorders
  description: >-
    EBV-positive diffuse large B-cell lymphoma and the post-transplant
    lymphoproliferative disorders share EBV positivity and large atypical B
    cells. The separating features are the angiocentric architecture, the
    obligatory pulmonary involvement, and the absence of nodal and bone marrow
    disease.
  distinguishing_features:
  - Angiocentric and angiodestructive architecture with a reactive T-cell-rich background
  - Lung involvement in essentially every patient
  - Nodal or bone marrow involvement argues for an alternative diagnosis
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinically, LYG universally involves the lungs with other common extranodal sites, including skin, central nervous system, liver, and kidneys. Nodal and/or bone marrow involvement is extremely rare and, if present, suggests an alternative diagnosis."
    explanation: >-
      Gives the distribution rule used to separate this disease from other
      EBV-positive B-cell lymphoproliferations.
- name: T-cell and NK-cell lymphomas of the angiocentric group
  description: >-
    Extranodal NK/T-cell lymphoma of nasal type and peripheral T-cell lymphoma
    were historically pooled with this disease under the label angiocentric
    immunoproliferative lesion, and misclassification confounded the older
    literature. On expert re-review of cases referred as possible lymphomatoid
    granulomatosis, a fifth turned out to be something else.
  distinguishing_features:
  - The neoplastic population is B-cell, not T-cell or NK-cell
  - Expert re-review reclassified 14 of 69 referred cases, including NK/T-cell lymphoma, peripheral T-cell lymphoma and classical Hodgkin lymphoma
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnoses on review were: NK/T cell lymphoma, nasal type (1 case), peripheral T-cell lymphoma, not otherwise specified (1 case), classical Hodgkin's lymphoma (4 cases), and EBV positive polymorphic or monomorphic B-cell lymphoma, lacking features of LYG (8 cases)."
    explanation: >-
      Enumerates what referred cases actually turned out to be, which is the
      practical content of this differential.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Earlier studies were likely confounded by the inclusion of T and NK cell lymphomas (formerly included in the diagnosis of angiocentric immunoproliferative lesion) with cases of LYG"
    explanation: >-
      Records the historical conflation that makes this differential important
      when reading older literature.
treatments:
- name: Interferon Alfa-2b
  description: >-
    Dose-escalated subcutaneous interferon alfa-2b, from 7.5 million
    international units three times weekly and continued for up to a year past
    best response, for low-grade disease. The rationale is explicitly
    mechanistic: low-grade disease is treated as immune-dependent, so the
    intervention augments the host response to EBV rather than killing the clone.
    In the phase 2 trial it produced complete responses in 61% of evaluable
    patients and was substantially better tolerated than chemotherapy.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon alfa-2b
      term:
        id: NCIT:C1953
        label: Recombinant Interferon Alfa-2b
  target_mechanisms:
  - target: Defective EBV Immunosurveillance
    description: >-
      Augments the host immune response to EBV, which is the defect this node
      records.
  evidence:
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After initial treatment with interferon alfa-2b, the overall response was 64% (28 of 44 evaluable patients) with 61% (27 of 44) having a complete response"
    explanation: >-
      Gives the response rates from the pivotal prospective trial.
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon alfa-2b is efficacious for treating low-grade lymphomatoid granulomatosis and hence reducing progression to high-grade disease, whereas patients with high-grade lymphomatoid granulomatosis showed expected responses to chemotherapy."
    explanation: >-
      The trial's own conclusion, including the claim that treating low-grade
      disease reduces progression to high grade.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Methods of augmenting the immune response to EBV in low-grade LYG include treatment with interferon-α2b, whereas high-grade disease requires immunochemotherapy."
    explanation: >-
      States the mechanistic rationale that makes this an immune-directed rather
      than cytotoxic treatment.
- name: DA-EPOCH-R
  description: >-
    Six three-weekly cycles of dose-adjusted etoposide, prednisone, vincristine,
    cyclophosphamide, doxorubicin and rituximab for high-grade disease, which is
    treated as immune-independent. Complete responses were seen in 47% of
    evaluable patients. Toxicity is the trade-off: serious adverse events
    occurred in 64% of chemotherapy-treated patients against 25% of those on
    interferon alfa-2b.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  regimen_term:
    preferred_term: dose-adjusted EPOCH-R regimen
    term:
      id: NCIT:C140097
      label: Dose-adjusted EPOCH-R Regimen
  target_mechanisms:
  - target: Clonal Selection and High-Grade Transformation
    description: >-
      Cytotoxic and anti-CD20 therapy directed at the transformed clone that
      defines high-grade disease.
  evidence:
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After initial treatment with DA-EPOCH-R, the overall response was 76% (13 of 17 evaluable patients) with 47% (eight of 17) having a complete response"
    explanation: >-
      Gives the response rates for the high-grade arm of the trial.
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serious adverse events occurred in 13 (25%) of 51 patients receiving treatment with interferon alfa-2b and 21 (64%) of 33 patients receiving DA-EPOCH-R, with five treatment-related deaths: one thromboembolic, one infection, and one haemophagocytic syndrome with interferon alfa-2b, and one infection and one haemophagocytic syndrome with DA-EPOCH-R."
    explanation: >-
      Quantifies the toxicity difference between the two arms, including
      treatment-related deaths in both.
- name: Crossover Between Treatment Arms
  description: >-
    Patients with residual or progressive disease after initial therapy cross
    over to the other arm. This is not a salvage improvisation but a designed
    consequence of the model: the underlying EBV surveillance defect persists
    through chemotherapy, so high-grade disease can recur as low-grade disease
    and be treated with interferon, and low-grade disease can transform under
    immune modulation and need chemotherapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with residual or progressive disease after initial therapy crossed over to alternative therapy."
    explanation: >-
      Documents crossover as part of the prospective trial design.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Given the underlying defective immune surveillance of EBV, patients with high-grade disease may have a recurrence in the form of low-grade disease after immunochemotherapy, and those with low-grade disease may progress to high-grade disease after immune modulation, which can be effectively managed with crossover treatment."
    explanation: >-
      Gives the mechanistic reason crossover is expected rather than
      exceptional.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Considered for primary refractory disease or multiple relapses. Its efficacy
    in this disease is explicitly described as not well established, so it is
    recorded here as an option rather than a standard.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "In patients with primary refractory disease or in those with multiple relapses, hematopoietic stem cell transplantation may be considered, but its efficacy is not well established."
    explanation: >-
      Supports transplantation as a considered option while explicitly declining
      to claim established efficacy.
clinical_trials:
- name: NCT00001379
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Treatment and Natural History Study of Lymphomatoid Granulomatosis. The
    single-centre trial that established grade-stratified therapy: interferon
    alfa-2b for grade 1 and 2 disease, DA-EPOCH-R for grade 3, with crossover for
    residual or progressive disease. Its results are the evidence base for the
    treatments recorded in this entry.
  target_phenotypes:
  - preferred_term: Pulmonary nodule
    term:
      id: HP:0033608
      label: Pulmonary nodule
  evidence:
  - reference: clinicaltrials:NCT00001379
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If patients have grade 3 disease, they will usually receive etoposide, prednisone, vincristine, cyclophosphamide, and doxorubicin (EPOCH)-rituximab (EPOCH-R) chemotherapy (each letter representing a drug). If patients have grade 1 or 2 disease, they will usually receive alpha interferon."
    explanation: >-
      The trial record states the grade-stratified allocation this entry's
      treatment section is built on.
discussions:
- discussion_id: lyg_immune_defect_unidentified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the specific immune defect that permits lymphomatoid granulomatosis
    in patients with no recognised primary immunodeficiency?
  attaches_to:
  - pathophysiology#Defective EBV Immunosurveillance
  rationale: >-
    The upstream node of this entry is a defect that has been measured only as an
    aggregate: reduced circulating T cells, falling more on the CD8 compartment,
    in patients who have no diagnosed immunodeficiency syndrome. It is inferred
    to be pre-existing and is described by its own authors as hypothesised. No
    causal gene, no functional assay and no biomarker identifies it in an
    individual patient, so the entry has a trigger node it cannot yet
    characterise molecularly.
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these results suggest that the immunologic deficits are likely preexistent and that a quantitative and/or qualitative defect in mainly CD8+cytotoxic T cells may be a prerequisite for disease."
    explanation: >-
      The hedged language is the point: this is the strongest available
      characterisation of the defect.
- discussion_id: lyg_grading_reproducibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How should treatment be allocated when the grading that selects the treatment
    arm is not reproducible between observers?
  attaches_to:
  - histopathology#Grade assignment by EBER-positive B-cell density
  - treatments#
  rationale: >-
    Grade decides whether a patient receives interferon alfa-2b or
    chemoimmunotherapy, and the toxicity difference between those arms is large -
    serious adverse events in 25% against 64%. The pathologists who defined the
    grading system record in the same paper that it is inconsistent and poorly
    reproducible between observers, with grade 1 the hardest because the
    EBV-positive cells can be sparse or absent. No reproducibility study,
    quantitative EBER threshold or adjunct molecular assay has been published to
    close the gap.
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in practice, the grading can be inconsistent and poorly reproducible among observers."
    explanation: >-
      States the reproducibility problem directly.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The greatest difficulty for the diagnosis of LYG has been with grade 1 lesions because of the possible absence or paucity of EBV-positive atypical B cells."
    explanation: >-
      Identifies grade 1 as the specific point of failure, which is also the
      grade that selects the low-toxicity arm.
- discussion_id: lyg_no_model_system
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do humanized-mouse models of EBV lymphoproliferation actually model
    lymphomatoid granulomatosis, or only the generic EBV-plus-immunosuppression
    axis?
  attaches_to:
  - pathophysiology#Ineffective Angiocentric Reactive T-cell Response
  rationale: >-
    No animal or in vitro model of this disease exists. Humanized mice
    reconstituted with human haematopoietic cells develop EBV-associated B-cell
    lymphoproliferation, and immunosuppression increases its frequency, so they
    model the upstream axis. They do not reproduce what actually defines the
    disease - the angiocentric and angiodestructive architecture, the
    lung-skin-CNS distribution, or the CD4-predominant reactive microenvironment.
    The entry therefore records no animal_models, and the tissue-level node has
    no experimental system behind it. This is flagged as a model mismatch rather
    than a plain knowledge gap because evidence exists in a model system whose
    fidelity to the human tissue phenotype is the open question.
notes: >-
  Entity identity was checked manually because `just preflight-dr` returned SKIP:
  MONDO records no causal gene for MONDO:0019466, so its gene-identity check
  cannot discriminate. The MONDO term's own Orphanet-sourced definition matches
  the research report on every point checked - EBV-driven, fourth to sixth
  decade, lung, skin, central nervous system and kidney, with lymph nodes and
  spleen only very rarely involved.

  Grades 1, 2 and 3 are curated as `has_subtypes` rather than as `stages`
  because MONDO models them as three distinct disease children
  (MONDO:0859747/8/9) and because they select different treatment arms rather
  than marking sequential points in one course. Grade is not fixed for a
  patient, though: it moves in both directions under treatment, which the
  `progression` section records.

  No `genetic` section is curated. Germline immunodeficiency genes - DOCK8, WAS,
  SH2D1A - are reported as predisposing conditions in case reports, but they
  cause their own syndromes, of which this disease is one manifestation among
  several; folding them in here would misrepresent them as causal genes for a
  disease that has none. No recurrent chromosomal abnormality has been
  identified either.

  Historical caution when reading pre-2001 literature: T-cell and NK-cell
  lymphomas were pooled with this disease under the label "angiocentric
  immunoproliferative lesion", and the confounding is explicitly noted by the
  reference pathology series.

  name: Bilateral Pulmonary Nodules
  description: >-
    Bilateral pulmonary nodules or masses, often peribronchovascular and
    lower-lobe predominant and sometimes cavitating. Lung involvement is
    essentially universal, and its absence should prompt reconsideration of the
    diagnosis.
  phenotype_term:
    preferred_term: Pulmonary nodule
    term:
      id: HP:0033608
      label: Pulmonary nodule
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, all patients had lung involvement (100%), with the next most common site being the central nervous system (38%). No patient had nodal or bone marrow disease."
    explanation: >-
      Gives the 100% lung involvement figure in the largest pathology series.
  - reference: PMID:23006954
    reference_title: "Lymphomatoid granulomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is usually a progressive disorder that virtually always involves the lung and characteristically presents as bilateral pulmonary nodules."
    explanation: >-
      Confirms bilateral nodules as the characteristic pulmonary presentation.
- category: Nervous System
  name: Central Nervous System Involvement
  description: >-
    Parenchymal brain lesions, cranial neuropathies, seizures and focal deficits.
    The central nervous system is the second most common site after the lung and
    is an adverse prognostic feature.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: FREQUENT
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, all patients had lung involvement (100%), with the next most common site being the central nervous system (38%). No patient had nodal or bone marrow disease."
    explanation: >-
      Gives the 38% frequency of central nervous system involvement supporting
      the FREQUENT band.
- category: Integument
  name: Cutaneous Nodules and Plaques
  description: >-
    Dermal papules and subcutaneous nodules, plaques or a patchy erythematous
    rash, present in roughly a sixth of biopsied sites. Cutaneous lesions show a
    dense lymphohistiocytic infiltrate with nonnecrotizing granulomatous
    inflammation and only sparse EBV-positive cells, so skin lesions alone cannot
    establish the diagnosis.
  phenotype_term:
    preferred_term: Skin nodule
    term:
      id: HP:0200036
      label: Skin nodule
  frequency: OCCASIONAL
  diagnostic: false
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed 122 biopsies; the most common site was lung (73%), followed by skin/subcutaneous tissue (17%); other sites included kidney, nasal cavity, gastrointestinal tract, conjunctiva, liver, and adrenal gland."
    explanation: >-
      Gives skin and subcutaneous tissue as the second most frequently biopsied
      site.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For this reason, skin lesions alone are inadequate to establish a definitive diagnosis of LYG."
    explanation: >-
      Supports marking the cutaneous phenotype as non-diagnostic on its own.
- category: Respiratory

name: Lymphomatoid Granulomatosis
creation_date: "2026-08-29T16:00:00Z"
category: Cancer
categories:
- Hematologic Malignancy
- B-cell Neoplasm
- EBV-Associated Lymphoproliferative Disorder
synonyms:
- LYG
- angiocentric immunoproliferative lesion
- Liebow granulomatosis
description: >-
  Lymphomatoid granulomatosis is a rare Epstein-Barr virus-driven B-cell
  lymphoproliferative disease in which EBV-positive atypical B cells accumulate
  in extranodal tissue - always the lung, often skin, central nervous system,
  liver and kidney - inside a dense, angiocentric and angiodestructive reactive
  T-cell infiltrate. Nodal and bone marrow involvement is so rare that finding
  it argues for a different diagnosis. The disease is understood as a failure of
  EBV immunosurveillance rather than as a conventional oncogenic-driver
  malignancy: no recurrent chromosomal lesion has been identified, patients have
  measurably depressed circulating T cells with the deficit falling mainly on
  the CD8-positive compartment, and the vascular damage and necrosis that give
  the disease its name are attributed to the host response to EBV rather than to
  the neoplastic cells. Histologic grade, defined by the number and density of
  EBV-positive atypical B cells, tracks clonality and is the axis on which
  treatment turns: low-grade disease is treated as immune-dependent with
  interferon alfa-2b, high-grade disease as immune-independent with
  chemoimmunotherapy.

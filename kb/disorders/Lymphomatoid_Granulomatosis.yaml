infectious_agent:
- name: Epstein-Barr virus
  description: >-
    EBV is present in the atypical B cells in essentially every case and is
    treated as the transforming agent rather than a bystander. Patients have
    serologic evidence of past exposure but not of acute infection, and the
    measured viral load is low - the abnormality is control of a common latent
    infection, not an unusual exposure.
  infectious_agent_term:
    preferred_term: Epstein-Barr virus
    term:
      id: NCBITaxon:10376
      label: human gammaherpesvirus 4
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had past EBV exposure by serology but with a low median EBV viral load."
    explanation: >-
      Shows that the relevant abnormality is EBV control rather than an acute or
      high-burden infection.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lymphomatoid granulomatosis (LYG) is a rare Epstein-Barr virus (EBV)-driven B-cell lymphoproliferative disease (LPD). This disease is hypothesized to result from defective immune surveillance of EBV, with most patients showing evidence of immune dysfunction, despite no known primary immunodeficiency."
    explanation: >-
      States both the causal role of EBV and the immune-surveillance model this
      entry is built around.
has_subtypes:
- name: Grade 1
  display_name: Grade 1 (low grade)
  description: >-
    Polymorphous infiltrate with rare atypical medium-to-large lymphoid cells and
    a paucity of EBV-positive cells, fewer than five per high-power field.
    Necrosis is focal or absent and the infiltrate is usually polyclonal - only
    about 8% of grade 1 lesions carry a clonal immunoglobulin rearrangement. This
    is the grade treated as immune-dependent, and the grade hardest to diagnose
    because the EBV-positive cells can be sparse or absent.
  subtype_term:
    preferred_term: grade I lymphomatoid granulomatosis
    term:
      id: MONDO:0859747
      label: grade I lymphomatoid granulomatosis
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin gene rearrangement studies were performed, and a higher percentage of clonal rearrangements were seen in LYG grade 2 (50%) and grade 3 (69%) as compared with grade 1 (8%)."
    explanation: >-
      Gives the grade 1 clonality figure that distinguishes it from the higher
      grades.
- name: Grade 2
  display_name: Grade 2 (low grade)
  description: >-
    More numerous large atypical cells, sometimes reminiscent of
    Hodgkin/Reed-Sternberg cells, with near-universal EBER positivity at five to
    twenty cells per high-power field and more necrosis than grade 1. Half of
    grade 2 lesions are clonal. Grouped with grade 1 as low-grade,
    immune-dependent disease for treatment purposes.
  subtype_term:
    preferred_term: grade II lymphomatoid granulomatosis
    term:
      id: MONDO:0859748
      label: grade II lymphomatoid granulomatosis
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In accordance with the World Health Organization classification, grade 1 lesions were associated with rare atypical medium-to-large lymphoid cells, whereas a greater number of large atypical cells, occasionally reminiscent of Hodgkin/Reed-Sternberg cells, were frequently seen in grade 2 and 3 lesions."
    explanation: >-
      Describes the cytologic difference between grade 1 and the higher grades.
- name: Grade 3
  display_name: Grade 3 (high grade)
  description: >-
    Sheets of large atypical EBV-positive B cells, more than fifty and often more
    than a hundred per high-power field, with extensive coagulative necrosis.
    About 69% are clonal. This grade behaves as, and is treated as, an aggressive
    EBV-positive large B-cell lymphoma - immune-independent disease.
  subtype_term:
    preferred_term: grade III lymphomatoid granulomatosis
    term:
      id: MONDO:0859749
      label: grade III lymphomatoid granulomatosis
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, near universal expression of EBER was seen in grade 2 (5-20 and occasionally up to 50 cells per high-power field) and grade 3 (>50 and often >100 cells per high power field) lesions"
    explanation: >-
      Gives the EBER density thresholds that define grade 2 and grade 3.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No incidence or prevalence estimate has been published. Cohort size is the
    only available proxy: the largest single-institution pathology series covers
    55 patients referred to one national centre over 15 years, and the pivotal
    prospective trial accrued 67 patients over 28 years.
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed the biopsies of 55 patients with LYG who were referred for a prospective trial at the National Cancer Institute (1995 to 2010) and evaluated the histologic, immunohistochemical, in situ hybridization, and molecular findings of these biopsies in conjunction with clinical information."
    explanation: >-
      Establishes the scale of the largest available series, which is the only
      quantitative handle on how rare the disease is.
progression:
- phase: Untreated or steroid-treated natural history
  notes: >-
    Historically poor. Before grade-stratified therapy, patients treated with
    steroids and/or chemotherapy had a median survival of about 14 months, and
    median overall survival across the disease was under two years.
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In regards to treatment, historical outcomes of patients treated with steroids and/or chemotherapy have been poor (median survivals of 14 months)"
    explanation: >-
      Gives the historical median survival figure for the pre-stratification era.
  - reference: PMID:37011643
    reference_title: "Interferon alfa-2b in patients with low-grade lymphomatoid granulomatosis and chemotherapy with DA-EPOCH-R in patients with high-grade lymphomatoid granulomatosis: an open-label, single-centre, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphomatoid granulomatosis is a rare Epstein-Barr virus-associated B-cell lymphoproliferative disorder with a median overall survival of less than 2 years."
    explanation: >-
      The trial's own statement of the survival baseline it set out to improve.
- phase: Grade transformation in both directions
  notes: >-
    Grade is not a fixed property of a patient. Low-grade disease can progress to
    high-grade disease after immune modulation, and high-grade disease can recur
    as low-grade disease after immunochemotherapy. Both directions are managed by
    crossing over to the other arm of therapy, which is a direct clinical
    consequence of the shared underlying defect in EBV surveillance.
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Given the underlying defective immune surveillance of EBV, patients with high-grade disease may have a recurrence in the form of low-grade disease after immunochemotherapy, and those with low-grade disease may progress to high-grade disease after immune modulation, which can be effectively managed with crossover treatment."
    explanation: >-
      States the bidirectional grade shift and its mechanistic explanation.
- phase: Progression to overt EBV-positive lymphoma or organ failure
  notes: >-
    Without recognition and grade-appropriate treatment the disease can progress
    to pulmonary failure, central nervous system disease, or frank EBV-positive
    lymphoma.
  evidence:
  - reference: PMID:23006954
    reference_title: "Lymphomatoid granulomatosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lymphomatoid granulomatosis can lead to progressive pulmonary failure, central nervous system disease, or progression to overt EBV-positive lymphoma without appropriate recognition and management."
    explanation: >-
      Names the three endpoints of untreated progression.
pathophysiology:
- name: Defective EBV Immunosurveillance
  biological_scale: ORGANISM
  conforms_to: "viral_oncogenesis#Persistent Oncogenic Virus Infection"
  description: >-
    Latent EBV, carried by most of the adult population, escapes control in a
    host whose cell-mediated surveillance of EBV-infected B cells is
    quantitatively or qualitatively impaired. Every patient treated at the
    reporting national centre had moderately to severely reduced circulating
    CD3-positive T cells with the deficit falling more heavily on the
    CD8-positive compartment, and none had a recognised primary immunodeficiency
    - so the defect is inferred to be pre-existing and subtle rather than
    syndromic. Recognised syndromic and iatrogenic causes of the same defect
    exist and predispose to the disease.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: viral latency
    modifier: INCREASED
    term:
      id: GO:0019042
      label: viral latency
  - preferred_term: T cell mediated immunity
    modifier: DECREASED
    term:
      id: GO:0002456
      label: T cell mediated immunity
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these results suggest that the immunologic deficits are likely preexistent and that a quantitative and/or qualitative defect in mainly CD8+cytotoxic T cells may be a prerequisite for disease."
    explanation: >-
      States the CD8-centred surveillance defect and its position upstream of
      disease.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More recently, it has been hypothesized that patients with LYG have defective immune surveillance of EBV-infected B cells particularly by the CD8-positive T cells"
    explanation: >-
      Independent statement of the same model from the pathology series.
  downstream:
  - target: Outgrowth of EBV-Positive Atypical B Cells
    description: >-
      Loss of cytotoxic control permits EBV-infected B cells to expand rather
      than be cleared.
- name: Outgrowth of EBV-Positive Atypical B Cells
  biological_scale: CELLULAR
  description: >-
    EBV-infected B cells expressing latent viral proteins proliferate and
    accumulate in extranodal tissue. Their number and density per high-power
    field is precisely what histologic grade measures, so this node is the one
    the grading system quantifies. Nodal and bone marrow compartments are spared,
    which is one of the features that separates the disease from other
    EBV-positive B-cell lymphoproliferations.
  cell_types:
  - preferred_term: EBV-positive atypical B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathologically, LYG is graded by the number and density of EBV+ atypical B cells, and other characteristic findings include an angioinvasive/angiodestructive reactive T-cell infiltrate and various degrees of necrosis."
    explanation: >-
      Identifies the EBV-positive atypical B-cell population as the graded
      quantity.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinically, LYG universally involves the lungs with other common extranodal sites, including skin, central nervous system, liver, and kidneys. Nodal and/or bone marrow involvement is extremely rare and, if present, suggests an alternative diagnosis."
    explanation: >-
      Establishes the extranodal distribution and the diagnostic weight of nodal
      sparing.
  downstream:
  - target: Ineffective Angiocentric Reactive T-cell Response
    description: >-
      The expanding EBV-positive population recruits a large but ineffective
      reactive T-cell infiltrate.
  - target: Clonal Selection and High-Grade Transformation
    description: >-
      Continued proliferation under persistent immune failure selects for
      transformed clones.
- name: Ineffective Angiocentric Reactive T-cell Response
  biological_scale: TISSUE
  description: >-
    A dense reactive T-cell infiltrate, CD4-predominant rather than CD8, gathers
    around and invades vessel walls without clearing the EBV-positive B cells.
    The interferon-inducible chemokines CXCL9 and CXCL10 localise to reactive
    cells in viable tissue at the edge of necrotic areas rather than to the
    malignant cells, which is the basis for attributing the vascular damage to
    the host response rather than to the tumour. The vascular injury is
    angiocentric and angiodestructive but is not a primary vasculitis - the
    vessel wall is damaged by lymphocytic invasion, not by an immune-mediated
    attack on the wall itself.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: chemokine-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0070098
      label: chemokine-mediated signaling pathway
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  evidence:
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CXCL9 and CXCL10 localize to the reactive cells in the viable tissue surrounding areas of necrosis, suggesting that cells in the tumor microenvironment and not the malignant cells themselves are the principal source of chemokines, resulting in vascular damage and necrosis."
    explanation: >-
      Locates the chemokine source in the reactive microenvironment, which is
      what makes this node distinct from the B-cell node upstream of it.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thus, the host immune response to EBV is a principal cause of the vasculitic changes that are such a typical feature of the disease."
    explanation: >-
      States directly that the host response, not the neoplastic clone, drives
      the vascular pathology.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of the angiocentric lymphocytes are CD3+T cells, with CD4+cells representing the predominant subtype in most cases."
    explanation: >-
      Establishes the CD4-predominant composition of the angiocentric infiltrate.
  downstream:
  - target: Coagulative Necrosis and Multi-organ Tissue Destruction
    description: >-
      Vascular invasion and destruction produce ischaemic coagulative necrosis in
      the involved tissue.
- name: Coagulative Necrosis and Multi-organ Tissue Destruction
  biological_scale: TISSUE
  description: >-
    Coagulative necrosis follows the vascular damage and is present at every
    grade, focal in grade 1 and often extensive in grades 2 and 3. In the lung
    this produces the bilateral nodules, sometimes cavitating, that define the
    radiologic picture; in skin, central nervous system, liver and kidney it
    produces the corresponding extranodal lesions.
  biological_processes:
  - preferred_term: cell death
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Necrosis was seen in all grades, with a greater degree in high-grade lesions."
    explanation: >-
      Establishes necrosis as a feature of every grade with a grade-dependent
      extent.
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed 122 biopsies; the most common site was lung (73%), followed by skin/subcutaneous tissue (17%); other sites included kidney, nasal cavity, gastrointestinal tract, conjunctiva, liver, and adrenal gland."
    explanation: >-
      Documents the organ distribution of biopsy-proven tissue destruction.
  downstream:
  - target: phenotypes#Bilateral Pulmonary Nodules
    description: >-
      Necrotic angiocentric lesions in the lung are what imaging shows as
      bilateral nodules.
- name: Clonal Selection and High-Grade Transformation
  biological_scale: CELLULAR
  description: >-
    With continued proliferation under a persistent surveillance defect, the
    EBV-infected B-cell population shifts from polyclonal to monoclonal.
    Immunoglobulin gene rearrangement is clonal in 8% of grade 1, 50% of grade 2
    and 69% of grade 3 lesions - a monotonic gradient that is the molecular
    reading of the grading system. At grade 3 the lesion is no longer separable
    from an EBV-positive large B-cell lymphoma, which is why the treatment
    strategy switches from restoring immunity to killing the clone. No recurrent
    chromosomal abnormality has been found, so this transformation is not
    anchored to a known cytogenetic driver.
  cell_types:
  - preferred_term: EBV-positive atypical B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:25321327
    reference_title: "Lymphomatoid granulomatosis--a single institute experience: pathologic findings and clinical correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin gene rearrangement studies were performed, and a higher percentage of clonal rearrangements were seen in LYG grade 2 (50%) and grade 3 (69%) as compared with grade 1 (8%)."
    explanation: >-
      Provides the grade-clonality gradient that this node describes.
  - reference: PMID:32107539
    reference_title: "Pathobiology and treatment of lymphomatoid granulomatosis, a rare EBV-driven disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This shift in clonality from polyclonal to monoclonal disease seen with increased histologic grade most likely represents the selective transformation of EBV-infected B-cell clones"
    explanation: >-
      States the clonal-selection interpretation of that gradient, hedged by its
      authors as the likely explanation, which is why this node is provisional.

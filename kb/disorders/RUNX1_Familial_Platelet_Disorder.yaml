progression:
- phase: Constitutional platelet disorder onset
  age_range: Infancy to childhood
  notes: >-
    Mild to moderate thrombocytopenia and qualitative platelet dysfunction are
    lifelong constitutional features, though transmitting carriers with mild
    manifestations may remain unrecognized until adulthood.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most individuals diagnosed with RUNX1-FPDMM inherited the causative
      pathogenic variant from a parent who may or may not have recognized
      manifestations of the disorder.
    explanation: >-
      Demonstrates lifelong germline transmission with variable clinical
      recognition of baseline platelet manifestations.
- phase: Hematologic malignancy transformation
  age_range: Infancy to >70 years (median ~29-30 years)
  notes: >-
    Lifetime hematologic malignancy risk is 35% to 50%, with childhood-onset
    hematologic malignancy reported in approximately half of families with an
    affected malignancy case.
  evidence:
  - reference: PMID:41924923
    reference_title: "Preemptive hematopoietic stem cell transplantation in RUNX1 familial platelet disorder: a shared decision-making framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age of HM onset in RUNX1-FPD varies, ranging from months to 70 years
      or more. A review of RUNX1-FPD families reported that childhood-onset HM
      is observed in approximately 50% of families with an HM diagnosis.
    explanation: >-
      Defines the broad age-at-transformation window from infancy to older
      adulthood and the frequency of childhood-onset malignancy across families.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FPDMM segregates as an autosomal dominant trait caused by heterozygous
    germline RUNX1 variants, which include whole-gene and intragenic
    deletions, frameshift and nonsense alleles acting by haploinsufficiency,
    and RUNT-domain missense alleles that can act in a dominant-negative
    fashion.
  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deleterious germ line RUNX1 variants cause the autosomal dominant familial
      platelet disorder with associated myeloid malignancy (FPDMM),
      characterized by thrombocytopenia, platelet dysfunction, and a
      predisposition to hematologic malignancies (HMs).
    explanation: >-
      States the heterozygous germline cause and the two defining components of
      the phenotype.
pathophysiology:
- name: RUNX1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Germline deletions, frameshift and nonsense RUNX1 alleles halve the
    dosage of the core binding factor alpha subunit that, with CBFB, drives
    the definitive haematopoietic transcriptional programme.

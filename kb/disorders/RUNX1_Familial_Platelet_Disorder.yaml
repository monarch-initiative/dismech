name: RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancy
creation_date: "2026-08-31T00:00:00Z"
description: >-
  RUNX1 familial platelet disorder with associated myeloid malignancy (FPDMM)
  is an autosomal dominant disorder caused by heterozygous germline variants
  in the RUNX1 transcription factor. It presents with lifelong mild to
  moderate thrombocytopenia and a qualitative platelet aggregation defect,
  often mild enough to escape attention for years, together with a lifetime
  risk of myelodysplastic syndrome and acute myeloid leukaemia on the order
  of 40 percent. The germline variant alone produces the platelet phenotype;
  malignant transformation requires acquisition of somatic second hits, most
  characteristically a second RUNX1 allele, ASXL1, or monosomy 7.
category: Mendelian
parents:
- hereditary disease
synonyms:
- familial platelet disorder with predisposition to acute myelogenous leukemia
- FPD/AML
- FPDMM
- familial platelet disorder with associated myeloid malignancy
- RUNX1 familial platelet disorder
disease_term:
  preferred_term: RUNX1 familial platelet disorder with associated myeloid malignancy
  term:
    id: MONDO:0100083
    label: hereditary thrombocytopenia and hematological cancer predisposition syndrome associated with RUNX1
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FPDMM segregates as an autosomal dominant trait caused by heterozygous
    germline RUNX1 variants, which include whole-gene and intragenic
    deletions, frameshift and nonsense alleles acting by haploinsufficiency,
    and RUNT-domain missense alleles that can act in a dominant-negative
    fashion.
  evidence:
  - reference: PMID:36322931
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germ line loss-of-function heterozygous mutations in the RUNX1 gene cause
      familial platelet disorder with associated myeloid malignancies (FPDMM)
      characterized by thrombocytopenia and a life-long risk of hematological
      malignancies.
    explanation: >-
      States the heterozygous germline cause and the two defining components of
      the phenotype.
pathophysiology:
- name: RUNX1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Germline deletions, frameshift and nonsense RUNX1 alleles halve the
    dosage of the core binding factor alpha subunit that, with CBFB, drives
    the definitive haematopoietic transcriptional programme.
  genes:
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  evidence:
  - reference: PMID:36322931
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germ line loss-of-function heterozygous mutations in the RUNX1 gene cause
      familial platelet disorder with associated myeloid malignancies (FPDMM)
      characterized by thrombocytopenia and a life-long risk of hematological
      malignancies.
    explanation: >-
      Identifies loss-of-function heterozygous RUNX1 alleles as the causal lesion.
- name: RUNT Domain Dominant-Negative Activity
  biological_scale: MOLECULAR
  description: >-
    Missense alleles within the RUNT DNA-binding domain retain the ability to
    assemble with CBFB but cannot bind DNA productively, so they sequester
    the partner subunit and suppress the residual wild-type allele beyond
    simple loss of dosage.
  evidence:
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RUNX1 was shown to bind to the NF-E2 promoter in primary megakaryocytes,
      and wild-type RUNX1, but not FPD/AML mutants, was able to activate NF-E2
      expression.
    explanation: >-
      Shows FPD/AML mutant RUNX1 fails to transactivate a target promoter that
      wild-type RUNX1 activates, the functional signature of a dominant-negative
      allele.
  genes:
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
- name: Impaired Megakaryocyte Maturation
  biological_scale: CELLULAR
  description: >-
    Reduced RUNX1 activity blocks megakaryocytic differentiation downstream
    of the megakaryocyte-erythroid progenitor, yielding small, hypolobated
    megakaryocytes and reduced proplatelet formation.
  evidence:
  - reference: PMID:36322931
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bone marrows developed megakaryocytic dysplasia similar to human FPDMM,
      and CD34+ HSPCs showed impaired in vitro megakaryocytic differentiation,
      with a striking defect in polyploidization.
    explanation: >-
      A rhesus macaque RUNX1-edited model reproduces the megakaryocytic
      maturation and polyploidization defect seen in patients.
- name: Platelet Dense Granule and Aggregation Defect
  biological_scale: CELLULAR
  description: >-
    RUNX1 target genes required for dense granule biogenesis and for
    agonist-induced signalling are underexpressed, producing a qualitative
    platelet defect with impaired aggregation and secretion that is
    disproportionate to the platelet count.
  evidence:
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, whereas the number of dense granules was markedly reduced,
      α-granule content was heterogeneous.
    explanation: >-
      Documents selective dense granule reduction with relatively preserved
      alpha-granule content in an FPD/AML pedigree.
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The FPD/AML platelet function defect represents a complex trait, and RUNX1
      orchestrates platelet function by regulating diverse aspects of this
      process.
    explanation: >-
      Frames the platelet functional defect as multifactorial and directly
      RUNX1-driven.
- name: Thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    The combined maturation block and platelet functional defect produce a
    lifelong mild to moderate thrombocytopenia with a bleeding tendency
    typically milder than the count alone would predict.
- name: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
  biological_scale: CELLULAR
  description: >-
    RUNX1-haploinsufficient stem cells acquire a competitive advantage and
    expand clonally, accumulating somatic lesions in the second RUNX1 allele,
    in ASXL1, and in other myeloid drivers, and acquiring monosomy 7.
  evidence:
  - reference: PMID:36322931
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In both animals, RUNX1-edited cells expanded over time compared with
      AAVS1-edited cells.
    explanation: >-
      In vivo evidence that reduced RUNX1 dosage alone confers a clonal
      competitive advantage, before any cooperating somatic lesion.
- name: Myeloid Transformation
  biological_scale: CELLULAR
  description: >-
    Clones bearing second hits progress to myelodysplastic syndrome and acute
    myeloid leukaemia, the defining malignant outcome of the disorder and the
    reason surveillance is offered from childhood.
  evidence:
  - reference: PMID:41924923
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: >-
      Quantifies the lifetime malignancy risk that defines the disorder.
phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Lifelong mild to moderate thrombocytopenia, typically in the range of 50
    to 150 x 10^9/L, present from childhood and stable rather than
    progressive in the absence of transformation.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
    temporality: CHRONIC
  evidence:
  - reference: PMID:36322931
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germ line loss-of-function heterozygous mutations in the RUNX1 gene cause
      familial platelet disorder with associated myeloid malignancies (FPDMM)
      characterized by thrombocytopenia and a life-long risk of hematological
      malignancies.
    explanation: Names thrombocytopenia as a defining feature of the disorder.
- category: Hematologic
  name: Impaired Platelet Aggregation
  description: >-
    Platelets show reduced aggregation to collagen, ADP and epinephrine, a
    qualitative defect that contributes to bleeding out of proportion to the
    platelet count.
  phenotype_term:
    preferred_term: Impaired platelet aggregation
    term:
      id: HP:0003540
      label: Impaired platelet aggregation
  evidence:
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A severe decrease in platelet aggregation, defective αIIb β3 integrin
      activation and combined αδ storage pool deficiency were found.
    explanation: >-
      Lumiaggregometry in an FPD/AML pedigree documenting the aggregation defect.
- category: Hematologic
  name: Platelet Dense Granule Deficiency
  description: >-
    Reduced dense granule number and impaired granule secretion reflect loss
    of RUNX1-dependent transcription of granule biogenesis genes.
  phenotype_term:
    preferred_term: Reduced platelet dense granules
    term:
      id: HP:0033535
      label: Reduced platelet dense granules
  evidence:
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, whereas the number of dense granules was markedly reduced,
      α-granule content was heterogeneous.
    explanation: >-
      Establishes dense granule reduction as the consistent granule abnormality,
      in contrast to the heterogeneous alpha-granule content.
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A severe decrease in platelet aggregation, defective αIIb β3 integrin
      activation and combined αδ storage pool deficiency were found.
    explanation: >-
      Records the combined dense and alpha granule storage pool deficiency in the
      same FPD/AML pedigree.
- category: Hematologic
  name: Bruising Tendency
  description: >-
    Easy bruising is a common presenting feature and is often the only
    manifestation before malignancy develops.
  phenotype_term:
    preferred_term: Bruising susceptibility
    term:
      id: HP:0000978
      label: Bruising susceptibility
- category: Hematologic
  name: Epistaxis
  description: >-
    Mucocutaneous bleeding, particularly epistaxis, reflects the combined
    quantitative and qualitative platelet defect.
  phenotype_term:
    preferred_term: Epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
- category: Neoplastic
  name: Myelodysplastic Syndrome
  description: >-
    Myelodysplastic syndrome develops in a substantial minority of carriers,
    with a median age at onset in the third to fourth decade but well
    described in childhood.
  phenotype_term:
    preferred_term: Myelodysplasia
    term:
      id: HP:0002863
      label: Myelodysplasia
  evidence:
  - reference: PMID:41924923
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: Gives the lifetime hematologic malignancy risk.
- category: Neoplastic
  name: Acute Myeloid Leukemia
  description: >-
    Acute myeloid leukaemia is the defining malignant outcome and the reason
    marrow surveillance is offered to carriers from childhood.
  phenotype_term:
    preferred_term: Acute myeloid leukemia
    term:
      id: HP:0004808
      label: Acute myeloid leukemia
  evidence:
  - reference: PMID:41924923
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: Gives the lifetime hematologic malignancy risk.
- category: Neoplastic
  name: T-Cell Acute Lymphoblastic Leukemia
  description: >-
    A minority of carriers develop T-cell acute lymphoblastic leukaemia
    rather than a myeloid malignancy, so the predisposition is not strictly
    myeloid-restricted.
  phenotype_term:
    preferred_term: T-cell acute lymphoblastic leukemia
    term:
      id: HP:0006727
      label: T-cell acute lymphoblastic leukemias
genetic:
- name: RUNX1
  notes: >-
    Heterozygous germline RUNX1 variants cause the disorder. Whole-gene and
    intragenic deletions and truncating alleles act by haploinsufficiency;
    RUNT-domain missense alleles retain CBFB binding but cannot transactivate
    target promoters and behave as dominant negatives. Somatic second hits in
    TET2, DNMT3A, ASXL1, or the second RUNX1 allele, often via acquired
    uniparental disomy of chromosome 21, accompany malignant progression.
  gene_term:
    preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24606315
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RUNX1 was shown to bind to the NF-E2 promoter in primary megakaryocytes,
      and wild-type RUNX1, but not FPD/AML mutants, was able to activate NF-E2
      expression.
    explanation: >-
      Functional evidence separating wild-type from FPD/AML mutant RUNX1 activity
      at a megakaryocytic target promoter.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Because the germline RUNX1 lesion persists in every surviving stem cell,
    chemotherapy cannot eradicate the predisposition and allogeneic HSCT is the
    only curative option. Whether to transplant preemptively, before overt
    malignancy, remains unsettled and is approached through shared
    decision-making that weighs clonal evolution, family history and bleeding
    burden against transplant risk.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    description: >-
      Replacing the haploinsufficient stem cell compartment with donor cells
      removes the substrate on which second hits accumulate.
  evidence:
  - reference: PMID:41924923
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: >-
      States transplant as the only curative modality for the predisposition.
  - reference: PMID:41924923
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is not yet a consensus on the use of preemptive HSCT for
      RUNX1-FPD.
    explanation: >-
      Records that preemptive transplant timing is genuinely unsettled rather
      than a settled standard of care.
- name: Gene Correction of Hematopoietic Stem Cells
  description: >-
    Autologous gene correction is under consideration but faces a specific
    mechanistic obstacle: corrected stem cells show no competitive advantage
    over RUNX1-heterozygous cells, so a corrected fraction may not outcompete
    the pre-existing mutant clone.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:36322931
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, the lack of a competitive advantage for wildtype or
      control-edited HSPCs over RUNX1 heterozygous-mutated HSPCs long term in our
      preclinical model suggests that gene correction approaches for FPDMM will
      be challenging, particularly to reverse myelodysplastic syndrome/ acute
      myeloid leukemia predisposition and thrombopoietic defects.
    explanation: >-
      A primate competitive repopulation model argues against gene correction
      being sufficient, so this is cited as evidence against the approach rather
      than for it.

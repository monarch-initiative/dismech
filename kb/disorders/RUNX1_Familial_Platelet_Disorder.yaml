- name: Immune and Inflammatory Dysregulation
  biological_scale: ORGANISM
  description: >-
    Germline RUNX1 deficiency causes broad immune and inflammatory dysregulation
    manifesting with high prevalence of atopic disease (allergic rhinitis,
    asthma, eczema) and psoriasiform skin inflammation.
  evidence:
  - reference: PMID:41924923
    reference_title: "Preemptive hematopoietic stem cell transplantation in RUNX1 familial platelet disorder: a shared decision-making framework."
    supports: SUPPORT

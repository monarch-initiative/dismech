    reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Missense variants are mostly confined to the RUNT homology domain and
      frequently affect DNA-binding residues, in some cases displaying loss of
      DNA-binding activity while retaining core binding factor subunit β
      binding, suggesting potential for dominant-negative activity.
    explanation: >-
      Explains the molecular mechanism whereby RUNT-domain missense alleles lose
      DNA binding while retaining CBFB heterodimerization.

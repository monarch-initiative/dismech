  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy of 77 patients had thrombocytopenia, 18 of 18 had abnormal platelet
      aggregometry, 16 of 35 had decreased platelet dense granules, and 28 of 55
      had abnormal bleeding scores.
    explanation: >-
      Frequencies from the 111-patient prospective cohort, showing thrombocytopenia
      in the large majority alongside universally abnormal aggregometry.
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RUNX1-FPDMM is characterized by thrombocytopenia with normal platelet size;
      bleeding is often greater than expected due to qualitative platelet
      dysfunction.
    explanation: >-
      GeneReviews states the normal platelet size and the disproportion between
      bleeding and platelet count that distinguishes this disorder.
  downstream:
  - target: Bruising Tendency
    causal_link_type: DIRECT
    description: >-
      Impaired primary platelet plug formation causes easy cutaneous bruising.
  - target: Epistaxis
    causal_link_type: DIRECT
    description: >-

genetic:
- name: RUNX1
  notes: >-
    Heterozygous germline RUNX1 variants cause the disorder. Whole-gene and
    intragenic deletions and truncating alleles act by haploinsufficiency;
    RUNT-domain missense alleles retain CBFB binding but cannot transactivate
    target promoters and behave as dominant negatives. Somatic second hits in
    TET2, DNMT3A, ASXL1, or the second RUNX1 allele, often via acquired
    uniparental disomy of chromosome 21, accompany malignant progression.
  gene_term:
    preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24606315
    reference_title: "Mechanisms underlying platelet function defect in a pedigree with familial platelet disorder with a predisposition to acute myelogenous leukemia: potential role for candidate RUNX1 targets."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RUNX1 was shown to bind to the NF-E2 promoter in primary megakaryocytes,
      and wild-type RUNX1, but not FPD/AML mutants, was able to activate NF-E2
      expression.
    explanation: >-
      Functional evidence separating wild-type from FPD/AML mutant RUNX1 activity
      at a megakaryocytic target promoter.
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 111 patients, 19 were diagnosed with HMs, including myelodysplastic
      syndrome, acute myeloid leukemia, chronic myelomonocytic leukemia, acute
      lymphoblastic leukemia, and smoldering myeloma.
    explanation: >-
      Cross-sectional malignancy count in the prospective cohort. Note this is a
      point-in-time proportion, not the 35-50 percent lifetime risk, which is a
      different measure.
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most individuals diagnosed with RUNX1-FPDMM inherited the causative
      pathogenic variant from a parent who may or may not have recognized
      manifestations of the disorder.
    explanation: >-
      Records incomplete penetrance of even the platelet phenotype: transmitting
      parents may be clinically unrecognised.
diagnosis:
- name: Germline RUNX1 molecular genetic testing on cultured skin fibroblasts
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline confirmation should be performed on a non-haematopoietic tissue,
    typically cultured skin fibroblasts, rather than on blood or marrow. Acquired
    uniparental disomy of chromosome 21 in the haematopoietic compartment can
    cause preferential loss of the variant-bearing chromosome and a false
    negative result on blood-derived DNA. The converse error also occurs: a
    somatic RUNX1 variant in a sporadic myeloid malignancy can be misread as
    germline.
  results: >-
    A heterozygous germline pathogenic RUNX1 variant confirmed in a
    non-haematopoietic tissue establishes the diagnosis.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the RUNX1 pathogenic variant identified in the proband is not detected in
      parental DNA, the recurrence risk to sibs is slightly greater than that of
      the general population because of the possibility either of a false negative
      result in a parent (due to preferential loss of the chromosome with the
      RUNX1 pathogenic variant), or of parental germline mosaicism.
    explanation: >-
      GeneReviews states the preferential-chromosome-loss mechanism that produces
      false negative germline results, the reason a non-haematopoietic tissue is
      required.
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of RUNX1-FPDMM is established in a proband with suggestive
      findings and a heterozygous germline pathogenic variant in RUNX1 identified
      by molecular genetic testing.
    explanation: Defines the molecular diagnostic criterion.
- name: Complete Blood Count and Peripheral Blood Smear
  diagnosis_term:
    preferred_term: platelet count
    term:
      id: NCIT:C51951
      label: Platelet Count
  description: >-
    Baseline and serial complete blood counts with peripheral smear evaluate
    constitutional platelet count and platelet morphology; platelets are
    characteristically normal in size despite mild-to-moderate thrombocytopenia,
    and serial counts every 3 to 4 months screen for evolving cytopenias or
    leukemic blasts.
  results: >-
    Mild to moderate thrombocytopenia (typically 50 to 150 x 10^9/L, though
    occasionally normal) with normal mean platelet volume.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RUNX1-FPDMM is characterized by thrombocytopenia with normal platelet size;
      bleeding is often greater than expected due to qualitative platelet
      dysfunction.
    explanation: >-
      Establishes thrombocytopenia with normal platelet size as the baseline
      blood-count finding.
- name: Platelet Aggregometry and Dense Granule Assessment
  diagnosis_term:
    preferred_term: platelet aggregation measurement
    term:
      id: NCIT:C103427
      label: Platelet Aggregation Measurement
  description: >-
    Light-transmission or lumiaggregometry and platelet electron microscopy
    demonstrate an aspirin-like qualitative platelet defect with impaired
    agonist-induced aggregation and reduced dense granule numbers, which can be
    present even in carriers with near-normal platelet counts.
  results: >-
    Abnormal platelet aggregation responses (universal among tested carriers in
    the prospective NIH cohort) and decreased platelet dense granules.
  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy of 77 patients had thrombocytopenia, 18 of 18 had abnormal platelet
      aggregometry, 16 of 35 had decreased platelet dense granules, and 28 of 55
      had abnormal bleeding scores.
    explanation: >-
      Demonstrates high diagnostic sensitivity of platelet aggregometry alongside
      dense granule assessment in confirmed carriers.
- name: Bone Marrow Aspiration, Biopsy, and Somatic Myeloid Panel
  diagnosis_term:
    preferred_term: bone marrow aspiration and biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  description: >-
    Bone marrow examination with morphology, cytogenetics, and somatic myeloid
    next-generation sequencing evaluates baseline dysmegakaryopoiesis (small
    hypolobated megakaryocytes) and detects clonal hematopoiesis or progression
    to myelodysplastic syndrome or acute leukemia.
  results: >-
    Baseline megakaryocytic hypolobation without excess blasts in the
    preleukemic phase; clonal somatic second hits, cytogenetic abnormalities, or
    myeloid/lymphoid blasts upon transformation.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complete blood count with differential every three to four months; bone
      marrow examination if constitutional symptoms and/or abnormalities on
      complete blood count are identified; skin exam as needed.
    explanation: >-
      Defines the clinical indication for bone marrow examination in RUNX1-FPDMM
      evaluation and surveillance.
differential_diagnoses:
- name: ETV6-related thrombocytopenia 5
  disease_term:
    preferred_term: thrombocytopenia 5
    term:
      id: MONDO:0014536
      label: thrombocytopenia 5
  description: >-
    Autosomal dominant hereditary thrombocytopenia with hematologic malignancy
    predisposition caused by germline pathogenic variants in ETV6 that closely
    phenocopies RUNX1-FPDMM in baseline platelet counts.
  distinguishing_features:
  - Germline pathogenic variant in ETV6 rather than RUNX1
  - Predominant predisposition to B-cell acute lymphoblastic leukemia (especially childhood hyperdiploid B-ALL) rather than MDS/AML, with ~30% overall malignancy penetrance
  - Absence of the characteristic RUNX1-associated eczema/psoriasis and dense-granule-predominant storage pool profile
  evidence:
  - reference: PMID:36626254
    reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ETV6 most frequently gives rise to ALL, commonly B-ALL, with biphenotypic
      leukemia, chronic myelomonocytic leukemia, myeloma, and MDS/AML are
      sometimes observed.
    explanation: >-
      Distinguishes ETV6-related thrombocytopenia 5 from RUNX1-FPDMM by its
      predominant B-ALL malignancy spectrum and ETV6 genotype.
- name: ANKRD26-related thrombocytopenia 2
  disease_term:
    preferred_term: thrombocytopenia 2
    term:
      id: MONDO:0008555
      label: thrombocytopenia 2
  description: >-
    Autosomal dominant nonsyndromic thrombocytopenia with myeloid malignancy
    predisposition caused by germline 5' UTR variants in ANKRD26 that prevent
    RUNX1/FLI1-mediated transcriptional repression during megakaryopoiesis.
  distinguishing_features:
  - Causative variants typically cluster in the 5' untranslated region of ANKRD26 (c.-116 to c.-134) rather than in RUNX1
  - Substantially lower lifetime hematologic malignancy risk (~8% vs 35-50% in RUNX1-FPDMM)
  - Occasional accompanying erythrocytosis or leukocytosis and generally milder qualitative platelet aggregation defect
  evidence:
  - reference: PMID:36626254
    reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most ANKRD26 pathogenic variants are located within the 5′ UTR of ANKRD26
      in a highly conserved region (c.-116 to c.-134).
    explanation: >-
      Identifies the characteristic 5' UTR ANKRD26 variant locus that separates
      THC2 from RUNX1-FPDMM on multigene testing.
  - reference: PMID:36626254
    reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is an estimated 8% lifetime risk of progression to MDS, AML, or
      chronic myeloid leukemia.
    explanation: >-
      Highlights the lower ~8% lifetime myeloid malignancy risk in ANKRD26-THC2
      compared with RUNX1-FPDMM.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Because the germline RUNX1 lesion persists in every surviving stem cell,
    chemotherapy cannot eradicate the predisposition and allogeneic HSCT is the
    only curative option. Whether to transplant preemptively, before overt
    malignancy, remains unsettled and is approached through shared
    decision-making that weighs clonal evolution, family history and bleeding
    burden against transplant risk.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    description: >-
      Replacing the haploinsufficient stem cell compartment with donor cells
      removes the substrate on which second hits accumulate.
  evidence:
  - reference: PMID:41924923
    reference_title: "Preemptive hematopoietic stem cell transplantation in RUNX1 familial platelet disorder: a shared decision-making framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: >-
      States transplant as the only curative modality for the predisposition.
  - reference: PMID:41924923
    reference_title: "Preemptive hematopoietic stem cell transplantation in RUNX1 familial platelet disorder: a shared decision-making framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is not yet a consensus on the use of preemptive HSCT for
      RUNX1-FPD.
    explanation: >-
      Records that preemptive transplant timing is genuinely unsettled rather
      than a settled standard of care.
- name: Desmopressin and Antifibrinolytic Support for Bleeding
  description: >-
    Haemostatic cover for surgery, injury, dental procedures, and mucosal
    bleeding uses clotting promoters including desmopressin, epsilon-aminocaproic
    acid, and tranexamic acid to stabilize clot formation despite qualitative
    platelet dysfunction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
    - preferred_term: epsilon-aminocaproic acid
      term:
        id: CHEBI:16586
        label: 6-aminohexanoic acid
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Primary Hemostatic Defect
    description: >-
      Desmopressin and antifibrinolytics promote primary hemostasis and inhibit
      fibrinolysis, compensating for impaired platelet secretion and aggregation.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Use of clotting promotors (e.g., desmopressin, epsilon aminocaproic acid,
      tranexamic acid) in instances of surgeries, injuries, or dental treatments;
      platelet transfusions may be used for severe bleeding or procedures with a
      high bleeding risk.
    explanation: GeneReviews management recommendation for haemostatic cover.
- name: Platelet Transfusion for Severe Bleeding or High-Risk Procedures
  description: >-
    Platelet transfusions are reserved for severe acute bleeding or invasive
    procedures carrying a high bleeding risk when antifibrinolytic and
    desmopressin support is insufficient, minimizing alloimmunization prior to
    potential hematopoietic stem cell transplantation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Primary Hemostatic Defect
    description: >-
      Provides functional donor platelets with intact dense granules and
      aggregation capacity during major hemostatic challenges.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Use of clotting promotors (e.g., desmopressin, epsilon aminocaproic acid,
      tranexamic acid) in instances of surgeries, injuries, or dental treatments;
      platelet transfusions may be used for severe bleeding or procedures with a
      high bleeding risk.
    explanation: >-
      Supports reserving platelet transfusion for severe bleeding or high-risk
      procedures.
- name: Topical Corticosteroid and Emollient Therapy for Eczema
  description: >-
    Topical corticosteroids and emollients are used as needed to manage
    RUNX1-FPDMM-associated eczematoid dermatitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: topical corticosteroid therapy
    term:
      id: NCIT:C122078
      label: Topical Corticosteroid Therapy
  target_mechanisms:
  - target: Immune and Inflammatory Dysregulation
    description: >-
      Suppresses cutaneous inflammation in RUNX1-associated eczematoid
      dermatitis.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Emollients and topical steroids as needed for eczema; consider providing a
      medical letter for the school explaining easy bruising; consider use of a
      medical alert bracelet.
    explanation: >-
      GeneReviews management recommendation for skin manifestations in
      RUNX1-FPDMM.
- name: Malignancy Surveillance
  description: >-
    Carriers are followed with clinical examination every six to twelve months
    and a complete blood count with differential every three to four months,
    with marrow examination triggered by constitutional symptoms or count
    abnormalities. Medications that impair platelet function, high-trauma
    activities, unnecessary radiation and smoking are avoided.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    description: >-
      Serial counts and marrow assessment aim to detect clonal progression
      before overt malignancy, when transplant outcomes are better.
  evidence:
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complete blood count with differential every three to four months; bone
      marrow examination if constitutional symptoms and/or abnormalities on
      complete blood count are identified; skin exam as needed.
    explanation: The GeneReviews surveillance schedule.
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Medications that affect platelet function (e.g., NSAIDs and antiplatelet
      agents), activities with a high risk of trauma (e.g., high-risk contact
      sports), unnecessary radiation, and smoking.
    explanation: The agents and circumstances GeneReviews advises avoiding.
- name: Gene Correction of Hematopoietic Stem Cells
  description: >-
    Autologous gene correction is under consideration but faces a specific
    mechanistic obstacle: corrected stem cells show no competitive advantage
    over RUNX1-heterozygous cells, so a corrected fraction may not outcompete
    the pre-existing mutant clone.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: RUNX1 Haploinsufficiency
    description: >-
      Aims to restore wild-type RUNX1 gene dosage in autologous hematopoietic
      stem and progenitor cells, though corrected cells lack an in vivo fitness
      advantage over RUNX1-mutant clones.
  evidence:
  - reference: PMID:36322931
    reference_title: "A RUNX1-FPDMM rhesus macaque model reproduces the human phenotype and predicts challenges to curative gene therapies."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, the lack of a competitive advantage for wildtype or
      control-edited HSPCs over RUNX1 heterozygous-mutated HSPCs long term in our
      preclinical model suggests that gene correction approaches for FPDMM will
      be challenging, particularly to reverse myelodysplastic syndrome/ acute
      myeloid leukemia predisposition and thrombopoietic defects.
    explanation: >-
      A primate competitive repopulation model argues against gene correction
      being sufficient, so this is cited as evidence against the approach rather
      than for it.
animal_models:
- name: RUNX1-edited rhesus macaque competitive repopulation model
  species: Rhesus macaque
  genotype: CRISPR/Cas9 NHEJ-edited RUNX1 versus AAVS1 safe-harbour control, autologous transplant
  publication: PMID:36322931
  description: >-
    Autologous transplant of mixed RUNX1-edited and control-edited HSPCs,
    tracking mutant allele frequency over time. Built specifically to compare
    the fitness of corrected against RUNX1-heterozygous cells in vivo.
  modeled_mechanisms:
  - target: Impaired Megakaryocyte Maturation
    relationship: RECAPITULATES
    model_scale: CELLULAR
    fidelity: MODERATE
    description: >-
      Reproduces the megakaryocytic dysplasia and polyploidization defect seen in
      human FPDMM marrow.
    limitations: >-
      Uses somatic gene editing of transplanted HSPCs rather than a constitutional

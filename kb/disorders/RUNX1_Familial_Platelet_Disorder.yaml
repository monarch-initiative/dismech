    - reference: PMID:36626254
      reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In contrast, tumors from germ line RUNX1 carriers with a lymphoid
        phenotype have different somatic cooperating and phenotype-driving
        variants
      explanation: >-
        Links somatic cooperating second hits in germline RUNX1 carriers to
        T-cell ALL transformation.

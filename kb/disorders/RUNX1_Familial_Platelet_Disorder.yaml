notes: >-
  Curated against MONDO:0100083, the RUNX1-specific term, rather than the
  gene-agnostic parent MONDO:0011071. That parent has exactly two descendants:
  this entity and MONDO:0014536 (thrombocytopenia 5, which is ETV6-related).
  ANKRD26-related thrombocytopenia 2 is MONDO:0008555 and sits elsewhere in
  MONDO, so it is not covered by that parent. Because ETV6-THC5 is not yet
  curated, a grouping under MONDO:0011071 would have one real member and one
  placeholder, so that stub is deliberately left in the curation queue. The
  broader germline myeloid malignancy predisposition grouping spanning RUNX1,
  GATA2, ETV6, ANKRD26, CEBPA and DDX41 is the more useful union and is worth
  building once more members exist.

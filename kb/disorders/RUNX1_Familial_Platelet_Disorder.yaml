    explanation: >-
      Identifies loss-of-function heterozygous RUNX1 alleles as the causal lesion.
  - reference: PMID:36626254
    reference_title: "Hereditary platelet disorders associated with germ line variants in RUNX1, ETV6, and ANKRD26."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RUNX1 mediates its transcriptional effects through heterodimerization with
      the core binding factor subunit β, which interacts with the DNA-binding
      RUNT homology domain.
    explanation: >-
      Grounds RUNX1 molecular activity in sequence-specific DNA binding and
      heterodimerization with core binding factor beta.
  downstream:
  - target: Impaired Megakaryocyte Maturation
    causal_link_type: DIRECT
    description: >-
      Reduced RUNX1:CBFB transcriptional output fails to drive the
      megakaryocytic maturation programme, so progenitors arrest before
      polyploidization.
  - target: Platelet Dense Granule and Aggregation Defect
    causal_link_type: DIRECT
    description: >-
      RUNX1 directly transactivates genes required for dense granule
      biogenesis and agonist responsiveness; halved dosage underexpresses
      them.
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    causal_link_type: DIRECT
    description: >-
      Chronically reduced RUNX1 dosage gives the stem cell pool a
      competitive advantage, allowing clonal drift before any cooperating
      lesion is acquired.
  - target: Immune and Inflammatory Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Constitutional RUNX1 deficiency perturbs immune lineage transcriptional
      regulation, predisposing carriers to atopic and inflammatory skin disease.
- name: RUNT Domain Dominant-Negative Activity
  biological_scale: MOLECULAR
  description: >-
    Missense alleles within the RUNT DNA-binding domain retain the ability to
    assemble with CBFB but cannot bind DNA productively, so they sequester
    the partner subunit and suppress the residual wild-type allele beyond
    simple loss of dosage.

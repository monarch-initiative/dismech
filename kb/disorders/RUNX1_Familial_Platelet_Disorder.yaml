name: RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancy
creation_date: "2026-08-31T00:00:00Z"
description: >-
  RUNX1 familial platelet disorder with associated myeloid malignancy (FPDMM)
  is an autosomal dominant disorder caused by heterozygous germline variants
  in the RUNX1 transcription factor. It presents with lifelong mild to
  moderate thrombocytopenia and a qualitative platelet aggregation defect,
  often mild enough to escape attention for years, together with a lifetime
  risk of myelodysplastic syndrome and acute myeloid leukaemia on the order
  of 40 percent. The germline variant alone produces the platelet phenotype;
  malignant transformation requires acquisition of somatic second hits, most
  characteristically a second RUNX1 allele, ASXL1, or monosomy 7.
category: Mendelian
parents:
- hereditary disease
synonyms:
- familial platelet disorder with predisposition to acute myelogenous leukemia
- FPD/AML
- FPDMM
- familial platelet disorder with associated myeloid malignancy
- RUNX1 familial platelet disorder
disease_term:
  preferred_term: RUNX1 familial platelet disorder with associated myeloid malignancy
  term:
    id: MONDO:0100083
    label: hereditary thrombocytopenia and hematological cancer predisposition syndrome associated with RUNX1
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FPDMM segregates as an autosomal dominant trait caused by heterozygous
    germline RUNX1 variants, which include whole-gene and intragenic
    deletions, frameshift and nonsense alleles acting by haploinsufficiency,
    and RUNT-domain missense alleles that can act in a dominant-negative
    fashion.
  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deleterious germ line RUNX1 variants cause the autosomal dominant familial
      platelet disorder with associated myeloid malignancy (FPDMM),
      characterized by thrombocytopenia, platelet dysfunction, and a
      predisposition to hematologic malignancies (HMs).
    explanation: >-
      States the heterozygous germline cause and the two defining components of
      the phenotype.
pathophysiology:
- name: RUNX1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Germline deletions, frameshift and nonsense RUNX1 alleles halve the
    dosage of the core binding factor alpha subunit that, with CBFB, drives
    the definitive haematopoietic transcriptional programme.
  genes:
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deleterious germ line RUNX1 variants cause the autosomal dominant familial
      platelet disorder with associated myeloid malignancy (FPDMM),
      characterized by thrombocytopenia, platelet dysfunction, and a
      predisposition to hematologic malignancies (HMs).
    explanation: >-
      Identifies loss-of-function heterozygous RUNX1 alleles as the causal lesion.
  downstream:
  - target: Impaired Megakaryocyte Maturation
    description: >-
      Reduced RUNX1:CBFB transcriptional output fails to drive the
      megakaryocytic maturation programme, so progenitors arrest before
      polyploidization.
  - target: Platelet Dense Granule and Aggregation Defect
    description: >-
      RUNX1 directly transactivates genes required for dense granule
      biogenesis and agonist responsiveness; halved dosage underexpresses
      them.
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    description: >-
      Chronically reduced RUNX1 dosage gives the stem cell pool a
      competitive advantage, allowing clonal drift before any cooperating
      lesion is acquired.
- name: RUNT Domain Dominant-Negative Activity
  biological_scale: MOLECULAR
  description: >-
    Missense alleles within the RUNT DNA-binding domain retain the ability to
    assemble with CBFB but cannot bind DNA productively, so they sequester
    the partner subunit and suppress the residual wild-type allele beyond
    simple loss of dosage.
  evidence:
  - reference: PMID:24606315
    reference_title: "Mechanisms underlying platelet function defect in a pedigree with familial platelet disorder with a predisposition to acute myelogenous leukemia: potential role for candidate RUNX1 targets."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RUNX1 was shown to bind to the NF-E2 promoter in primary megakaryocytes,
      and wild-type RUNX1, but not FPD/AML mutants, was able to activate NF-E2
      expression.
    explanation: >-
      Shows FPD/AML mutant RUNX1 fails to transactivate a target promoter that
      wild-type RUNX1 activates, the functional signature of a dominant-negative
      allele.
  genes:
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  downstream:
  - target: Impaired Megakaryocyte Maturation
    description: >-
      Mutant RUNT-domain protein sequesters CBFB and suppresses the residual
      wild-type allele, converging on the same maturation block as
      haploinsufficiency but from a lower effective activity.
  - target: Platelet Dense Granule and Aggregation Defect
    description: >-
      Dominant-negative suppression of RUNX1 target promoters underexpresses
      the same granule and signalling genes.
  - target: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
    description: >-
      Dominant-negative alleles depress RUNX1 activity below the
      haploinsufficient level, and are associated with earlier and more
      frequent malignant progression.
- name: Impaired Megakaryocyte Maturation
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  description: >-
    Reduced RUNX1 activity blocks megakaryocytic differentiation downstream
    of the megakaryocyte-erythroid progenitor, yielding small, hypolobated
    megakaryocytes and reduced proplatelet formation.
  evidence:
  - reference: PMID:36322931
    reference_title: "A RUNX1-FPDMM rhesus macaque model reproduces the human phenotype and predicts challenges to curative gene therapies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bone marrows developed megakaryocytic dysplasia similar to human FPDMM,
      and CD34+ HSPCs showed impaired in vitro megakaryocytic differentiation,
      with a striking defect in polyploidization.
    explanation: >-
      A rhesus macaque RUNX1-edited model reproduces the megakaryocytic
      maturation and polyploidization defect seen in patients.
  downstream:
  - target: Thrombocytopenia
    description: >-
      Arrested, hypolobated megakaryocytes produce fewer proplatelets, lowering
      the circulating platelet count.
- name: Platelet Dense Granule and Aggregation Defect
  biological_scale: CELLULAR
  description: >-
    RUNX1 target genes required for dense granule biogenesis and for
    agonist-induced signalling are underexpressed, producing a qualitative
    platelet defect with impaired aggregation and secretion that is
    disproportionate to the platelet count.
  evidence:
  - reference: PMID:24606315
    reference_title: "Mechanisms underlying platelet function defect in a pedigree with familial platelet disorder with a predisposition to acute myelogenous leukemia: potential role for candidate RUNX1 targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, whereas the number of dense granules was markedly reduced,
      α-granule content was heterogeneous.
    explanation: >-
      Documents selective dense granule reduction with relatively preserved
      alpha-granule content in an FPD/AML pedigree.
  - reference: PMID:24606315
    reference_title: "Mechanisms underlying platelet function defect in a pedigree with familial platelet disorder with a predisposition to acute myelogenous leukemia: potential role for candidate RUNX1 targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The FPD/AML platelet function defect represents a complex trait, and RUNX1
      orchestrates platelet function by regulating diverse aspects of this
      process.
    explanation: >-
      Frames the platelet functional defect as multifactorial and directly
      RUNX1-driven.
  downstream:
  - target: Thrombocytopenia
    description: >-
      The qualitative secretion and aggregation defect compounds the reduced
      platelet count, so bleeding exceeds what the count alone predicts.
- name: Thrombocytopenia
  biological_scale: ORGANISM
  description: >-
    The combined maturation block and platelet functional defect produce a
    lifelong mild to moderate thrombocytopenia with a bleeding tendency
    typically milder than the count alone would predict.
  evidence:
  - reference: PMID:37738626
    reference_title: "Natural history study of patients with familial platelet disorder with associated myeloid malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy of 77 patients had thrombocytopenia, 18 of 18 had abnormal platelet
      aggregometry, 16 of 35 had decreased platelet dense granules, and 28 of 55
      had abnormal bleeding scores.
    explanation: >-
      Frequencies from the 111-patient prospective cohort, showing thrombocytopenia
      in the large majority alongside universally abnormal aggregometry.
  - reference: PMID:33661592
    reference_title: "RUNX1 Familial Platelet Disorder with Associated Myeloid Malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RUNX1-FPDMM is characterized by thrombocytopenia with normal platelet size;
      bleeding is often greater than expected due to qualitative platelet
      dysfunction.
    explanation: >-
      GeneReviews states the normal platelet size and the disproportion between
      bleeding and platelet count that distinguishes this disorder.
- name: Clonal Hematopoiesis and Somatic Second-Hit Acquisition
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  description: >-
    RUNX1-haploinsufficient stem cells acquire a competitive advantage and
    expand clonally, accumulating somatic lesions in the second RUNX1 allele,
    in ASXL1, and in other myeloid drivers, and acquiring monosomy 7.
  evidence:
  - reference: PMID:36322931
    reference_title: "A RUNX1-FPDMM rhesus macaque model reproduces the human phenotype and predicts challenges to curative gene therapies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In both animals, RUNX1-edited cells expanded over time compared with
      AAVS1-edited cells.
    explanation: >-
      In vivo evidence that reduced RUNX1 dosage alone confers a clonal
      competitive advantage, before any cooperating somatic lesion.
  downstream:
  - target: Myeloid Transformation
    description: >-
      Clones carrying cooperating somatic lesions outgrow the residual
      compartment and progress to myelodysplastic syndrome and acute myeloid
      leukaemia.
- name: Myeloid Transformation
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: myeloid cell differentiation
    term:
      id: GO:0030099
      label: myeloid cell differentiation
    modifier: ABNORMAL
  description: >-
    Clones bearing second hits progress to myelodysplastic syndrome and acute
    myeloid leukaemia, the defining malignant outcome of the disorder and the
    reason surveillance is offered from childhood.
  evidence:
  - reference: PMID:41924923
    reference_title: "Preemptive hematopoietic stem cell transplantation in RUNX1 familial platelet disorder: a shared decision-making framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to
      50% lifetime risk of hematologic malignancy (HM), and like all germline HM
      predisposition syndromes, can only be cured with allogeneic hematopoietic
      stem cell transplantation (HSCT).
    explanation: >-
      Quantifies the lifetime malignancy risk that defines the disorder.

      RUNX1-FPD is also associated with a high burden of atopic disease (e.g.,
      allergic rhinitis, eczema, and asthma) and a variety of inflammatory
      symptoms suggestive of broader immune dysregulation.
    explanation: >-
      Connects atopic and cutaneous manifestations in RUNX1-FPD to broader

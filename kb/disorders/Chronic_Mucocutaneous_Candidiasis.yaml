    snippet: "We performed genetic studies in 36 members of a large, consanguineous five-generation family, in which 4 members had recurrent fungal infections and an additional 3 members died during adolescence, 2 after invasive infection of the brain with candida species."
    explanation: >-
      Documents the defining CARD9 feature that separates it from the other CMC
      etiologies: fatal invasive cerebral candidiasis, not mucocutaneous
      disease alone.
- name: APECED
  display_name: APECED/APS-1 (AIRE) - acquired anti-IL-17 autoantibody phenocopy
  subtype_term:
    preferred_term: autoimmune polyendocrine syndrome type 1
    term:
      id: MONDO:0009411
      label: autoimmune polyendocrine syndrome type 1
  description: >-
    In AIRE-deficient APECED/APS-1, CMC is typically the first manifestation,
    and it is caused not by a germline lesion in the IL-17 circuit but by
    high-titre neutralizing autoantibodies against IL-17A, IL-17F and IL-22 -
    an acquired phenocopy of the genetic IL-17 defects. The autoantibodies
    precede the CMC in all informative cases, and the same autoantibodies
    explain CMC in the rare thymoma patients who develop it. Only the CMC arm
    of APS-1 is modelled here; the loss of AIRE-dependent thymic tolerance and
    the hypoparathyroidism / adrenal insufficiency / broader autoimmune
    spectrum are curated in
    kb/disorders/Autoimmune_Polyendocrine_Syndrome_Type_1.yaml and are
    deliberately not duplicated.

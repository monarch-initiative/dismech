    explanation: >-
      Establishes anti-IL-17-cytokine autoantibodies as the mechanism of CMC in
      APS-1, i.e. an acquired phenocopy of the genetic IL-17 defects.
pathophysiology:
- name: Commensal Candida albicans Colonization of Barrier Surfaces
  biological_scale: TISSUE
  role: trigger
  description: >-
    Candida albicans is a commensal of the oral cavity, gastrointestinal tract
    and genital mucosa in healthy people. CMC is therefore not an exposure
    problem: the organism is already present, and disease reflects failure of
    the host to hold a resident commensal in check at the barrier. This is why
    the phenotype is chronic and relapsing rather than episodic, and why
    eradication is rarely achievable.
  locations:
  - preferred_term: mouth mucosa
    term:
      id: UBERON:0003729
      label: mouth mucosa
  - preferred_term: esophagus mucosa
    term:
      id: UBERON:0002469
      label: esophagus mucosa
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: nail
    term:
      id: UBERON:0001705
      label: nail
  evidence:
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic mucocutaneous candidiasis (CMC) is characterized by persistent or recurrent disease of the nails, skin, oral, or genital mucosae caused by Candida albicans"
    explanation: Defines the barrier sites at which the commensal becomes pathogenic.
  downstream:
  - target: Persistent Mucocutaneous Candida albicans Infection

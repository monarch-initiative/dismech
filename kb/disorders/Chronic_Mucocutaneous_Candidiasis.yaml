name: Chronic Mucocutaneous Candidiasis
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- CMC
- CMCD
- Chronic mucocutaneous candidosis
- Familial candidiasis
- CANDF
- Familial chronic mucocutaneous candidiasis
description: >-
  Chronic mucocutaneous candidiasis (CMC) is persistent or recurrent infection
  of the skin, nails, and oral, oesophageal and genital mucosae by Candida
  species, principally Candida albicans, in patients who are otherwise not
  broadly susceptible to infection. It is not one gene's disease but a
  convergent phenotype: every established genetic etiology lies somewhere on a
  single circuit - the IL-17 axis. Lesions have been found in the cytokine
  itself (IL17F), its receptor chains (IL17RA, IL17RC), the receptor-proximal
  adaptor (ACT1/TRAF3IP2), the Th17 master transcription factor (RORC), the
  upstream signalling that licenses Th17 development (STAT1 gain-of-function,
  the commonest cause; STAT3 loss-of-function in hyper-IgE syndrome; DOCK8),
  myeloid beta-glucan sensing that instructs Th17 differentiation (the
  dectin-1 receptor CLEC7A and its adaptor CARD9),
  and - as an acquired phenocopy - neutralizing autoantibodies against IL-17A,
  IL-17F and IL-22 in APECED/APS-1. Because these independent lesions all
  produce the same narrow infectious phenotype and little else, CMC is the
  human experiment that established IL-17 immunity as the mucosal antifungal
  pathway. Two etiologies break the mucocutaneous-only rule and must be kept
  distinct: CARD9 deficiency, which additionally permits invasive and central
  nervous system fungal disease, and STAT1 gain-of-function, whose enhanced
  STAT1 signalling causes a much wider syndrome of bacterial and viral
  infection, autoimmunity, cerebral aneurysm and carcinoma. Long-standing oral
  and oesophageal candidiasis carries a real risk of oesophageal stricture and
  of squamous cell carcinoma of the mouth and oesophagus.

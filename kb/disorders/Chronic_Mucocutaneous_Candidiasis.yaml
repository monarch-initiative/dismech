- name: CLEC7A
  gene_term:
    preferred_term: CLEC7A
    term:
      id: hgnc:14558
      label: CLEC7A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Typed SUSCEPTIBILITY rather than CAUSATIVE: the association rests on a
    single kindred, the Y238X allele is a relatively common polymorphism, and
    the reported phenotype (recurrent vulvovaginal candidiasis, onychomycosis)
    is at the mild end of the CMC spectrum, so the evidence supports a
    predisposing rather than a fully penetrant Mendelian role. Dectin-1
    (CLEC7A) is the beta-glucan receptor upstream of CARD9; the Y238X
    early-stop allele impairs beta-glucan binding and IL-17, TNF and IL-6
    induction.
    Notably, and unlike CARD9 deficiency, phagocytosis and fungal killing are
    preserved, so dectin-1 deficiency causes mucosal but NOT invasive disease -
    a natural dissection that localizes CARD9's invasive-disease risk to
    myeloid effector function downstream of the receptor. No separate subtype
    is modelled because the phenotype is confined to the mucosal arm already
    captured by the shared IL-17 nodes, and the association rests on a single
    kindred.
  evidence:
  - reference: PMID:19864674
    reference_title: "Human dectin-1 deficiency and mucocutaneous fungal infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family in which four women who were affected by either recurrent vulvovaginal candidiasis or onychomycosis had the early-stop-codon mutation Tyr238X in the beta-glucan receptor dectin-1."
    explanation: >-
      Establishes the CLEC7A Y238X allele as a cause of mucocutaneous Candida
      disease.
  - reference: PMID:19864674
    reference_title: "Human dectin-1 deficiency and mucocutaneous fungal infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, fungal phagocytosis and fungal killing were normal in the patients, explaining why dectin-1 deficiency was not associated with invasive fungal infections and highlighting the specific role of dectin-1 in human mucosal antifungal defense."
    explanation: >-
      The key contrast with CARD9 deficiency: preserved myeloid killing means
      dectin-1 deficiency stops at the mucosa, supporting the entry's
      separation of the mucocutaneous and invasive arms.
biochemical:
- name: Circulating IL-17A-producing T cell count
  presence: DECREASED
  notes: >-
    The core functional biomarker of the CMC pathway. Reduced in most CMC
    patients across etiologies, but not all: 82% of tested STAT1 GOF patients
    in the largest cohort had a low IL-17A-producing T-cell count, so a normal
    result does not exclude the diagnosis. Low Th17 counts are also documented
    in CARD9 deficiency and are absent by definition in RORC deficiency and
    AD-HIES.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  evidence:
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Circulating interleukin-17A-producing T-cell count was low for most (82%) but not all of the patients tested."
    explanation: >-
      Quantifies both the sensitivity and the imperfection of the Th17 count as
      a CMC biomarker.
- name: Neutralizing anti-IL-17A, anti-IL-17F and anti-IL-22 autoantibodies
  presence: INCREASED
  specificity: >-
    Highly specific for the APECED/APS-1 (and thymoma) route to CMC: absent in
    healthy controls, in patients with other autoimmune disorders, and in STAT1
    gain-of-function CMC.
  notes: >-
    Diagnostic of the APECED/APS-1 (and thymoma) route to CMC and absent in the
    germline IL-17-circuit etiologies. Prevalence in APECED is 41% for
    anti-IL-17A, 75% for anti-IL-17F and 91% for anti-IL-22, concentrated in
    patients with CMC. A positive result reclassifies the case from a germline
    IL-17-pathway disorder to an acquired phenocopy.
  evidence:
  - reference: PMID:20123959
    reference_title: "Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our multicenter survey revealed neutralizing autoantibodies against IL-17A (41%), IL-17F (75%), and/ or IL-22 (91%) in >150 APECED patients, especially those with CMC."
    explanation: Quantifies autoantibody prevalence in APECED and its association with CMC.
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients displays autoantibodies against IL-17A, IL-17F, and IL-22."
    explanation: >-
      Confirms the autoantibodies are absent in STAT1 GOF CMC, making them a
      discriminating test between the genetic and acquired routes.
- name: Interferon-induced STAT1 phosphorylation
  presence: INCREASED
  subtype: STAT1 GOF
  notes: >-
    Flow-cytometric measurement of STAT1 phosphorylation in peripheral blood
    mononuclear cells after IFN-alpha, IFN-gamma or IL-27 stimulation, with
    prolonged or exaggerated phosphorylation indicating a gain-of-function
    allele. Recommended as a rapid functional adjunct alongside - not instead
    of - STAT1 sequencing.
  evidence:
  - reference: PMID:26604104
    reference_title: "The Extended Clinical Phenotype of 26 Patients with Chronic Mucocutaneous Candidiasis due to Gain-of-Function Mutations in STAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of IFN- or IL-induced STAT1 phosphorylation in PBMC provides a fast and reliable diagnostic tool and should be carried out in addition to genetic testing."
    explanation: Establishes phospho-STAT1 flow cytometry as a functional diagnostic adjunct.
treatments:
- name: Systemic azole antifungal therapy
  description: >-
    Fluconazole is the mainstay for extensive oral, oesophageal, nail or
    recurrent disease, with topical agents for limited mucosal or cutaneous
    involvement. Treatment controls rather than cures: in a STAT1 GOF cohort
    azoles achieved complete response in 38% and partial remission in 62% of
    treated oral disease, 58% required continuing prophylaxis, and in the
    larger international cohort CMC persisted in 39% of patients on prolonged
    antifungal therapy. Chronic azole exposure selects resistant Candida, which
    is the principal long-term limitation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antifungal Therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: fluconazole
      term:
        id: NCIT:C500
        label: Fluconazole
  target_mechanisms:
  - target: Persistent Mucocutaneous Candida albicans Infection
    treatment_effect: INHIBITS
    description: >-
      Suppresses the fungal burden without correcting the underlying immune
      defect, which is why relapse after withdrawal is the rule.
  evidence:
  - reference: PMID:26604104
    reference_title: "The Extended Clinical Phenotype of 26 Patients with Chronic Mucocutaneous Candidiasis due to Gain-of-Function Mutations in STAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antifungal treatment with e.g., azoles led to a partial remission in 62 % (10/16) of patients, 38 % (6/16) had a complete response."
    explanation: Quantifies azole response rates in STAT1 GOF CMC.
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMC persisted in 39% of the 202 patients receiving prolonged antifungal treatment."
    explanation: Documents the limits of antifungal-only management.
- name: JAK inhibition (ruxolitinib, baricitinib)
  description: >-
    The mechanism-directed therapy for STAT1 gain-of-function CMC and the
    clinical vindication of the inversion model: because the IL-17 deficit is a
    downstream consequence of excessive JAK-STAT1 signalling, pharmacologically
    reducing that signal should restore Th17 immunity - and it does.
    Ruxolitinib suppressed IFN-induced STAT1/3/5 phosphorylation and raised
    Th17-related gene expression ex vivo alongside major clinical improvement.
    In the largest series, JAK inhibitors produced partial or complete
    remission in 87% of 45 STAT1 GOF patients. Important caveats: this is
    off-label, adverse events (infection, weight gain) occurred in 38% of
    patients, the effect is not sustained after withdrawal so long-term
    administration is required, and it does not apply to the IL-17 receptor,
    adaptor, ligand or autoantibody etiologies.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: NCIT:C77888
        label: Ruxolitinib
    - preferred_term: baricitinib
      term:
        id: NCIT:C127012
        label: Baricitinib
  target_mechanisms:
  - target: STAT1 Hyperactivation from Impaired Nuclear Dephosphorylation
    treatment_effect: INHIBITS
    description: >-
      JAK1/2 inhibition acts at the molecular lesion itself, reducing
      phosphorylation of the hyperactive STAT1 and thereby relieving the
      downstream suppression of IL-17-producing T-cell development. This edge
      is the therapeutic expression of the stat1_gof_inversion hypothesis.
  evidence:
  - reference: PMID:29934865
    reference_title: "Utility of Ruxolitinib in a Child with Chronic Mucocutaneous Candidiasis Caused by a Novel STAT1 Gain-of-Function Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JAK1/2 inhibition with ruxolitinib represents a viable option for treatment of refractory CMC, if HSCT is not considered. However, long-term administration is necessary, as the effect is not sustained after treatment discontinuation."
    explanation: >-
      Establishes ruxolitinib as effective in refractory CMC and records the
      need for continuous therapy.
  - reference: PMID:37935260
    reference_title: "JAK inhibitor treatment for inborn errors of JAK/STAT signaling: An ESID/EBMT-IEWP retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, treatment resulted in improvement (partial or complete remission) of clinical symptoms in 87% of STAT1-GOF and in 90% of STAT3-GOF patients."
    explanation: >-
      Multicentre response rate for JAK inhibition in 45 STAT1 gain-of-function
      patients.
  - reference: PMID:36050429
    reference_title: "Three Adult Cases of STAT1 Gain-of-Function with Chronic Mucocutaneous Candidiasis Treated with JAK Inhibitors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, JAK inhibitors improved clinical symptoms of CMC, but caused side effects in two patients."
    explanation: >-
      Documents both benefit and the adverse-event burden in three adults;
      PARTIAL because two of three patients had treatment-limiting toxicity.
- name: Haematopoietic stem cell transplantation
  description: >-
    Potentially curative for severe, refractory STAT1 gain-of-function disease,
    but with substantial risk that restricts it to life-threatening immune
    dysregulation after multidisciplinary assessment. In an international
    series of 15 transplanted patients, primary engraftment was 74% but
    overall survival only 40%, with 50% secondary graft failure. Outcomes
    appear better when JAK inhibition is used as a bridge to transplant.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: STAT1 Hyperactivation from Impaired Nuclear Dephosphorylation
    treatment_effect: RESTORES
    description: >-
      Replaces the mutant haematopoietic compartment, so donor-derived
      lymphocytes carry wild-type STAT1 and Th17 development is restored.
  evidence:
  - reference: PMID:28601685
    reference_title: "Hematopoietic stem cell transplantation in patients with gain-of-function signal transducer and activator of transcription 1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that HSCT for patients with GOF-STAT1 mutations is curative but has significant risk of secondary graft failure and death."
    explanation: Establishes both curative potential and the substantial transplant risk.
  - reference: PMID:28601685
    reference_title: "Hematopoietic stem cell transplantation in patients with gain-of-function signal transducer and activator of transcription 1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary donor engraftment in this cohort of 15 patients with GOF-STAT1 mutations was 74%, and overall survival was only 40%."
    explanation: Quantifies engraftment and survival outcomes.
- name: Endoscopic dilatation of oesophageal stricture
  description: >-
    Mechanical relief of the fibrotic oesophageal narrowing that follows
    repeated candidal ulceration and repair, restoring swallowing in patients
    with obstructive dysphagia. It treats the structural consequence of the
    disease and does nothing to the underlying immune defect or the fungal
    burden, so it is palliative and often needs repeating. The surveillance
    endoscopy that detects early oesophageal neoplasia in the same patients is
    a diagnostic action and is modelled under diagnosis, not here.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Esophageal Dilation
    term:
      id: NCIT:C70908
      label: Esophageal Dilation
  target_mechanisms:
  - target: Chronic Candida-Associated Epithelial Injury and Squamous Dysplasia
    treatment_effect: MODULATES
    description: >-
      Relieves the fibrotic stricture produced by chronic epithelial injury
      without preventing the injury itself.
  notes: >-
    Evidence is marked PARTIAL: the cited series documents the severe
    obstructive oesophageal disease in CMC that creates the indication, but
    does not itself report dilatation outcomes. Endoscopic dilatation for
    benign oesophageal stricture is standard gastroenterological practice
    rather than a CMC-specific intervention, so no CMC-specific efficacy
    citation is available.
  evidence:
  - reference: PMID:28815025
    reference_title: "Oesophageal candidiasis and squamous cell cancer in patients with gain-of-function STAT1 gene mutation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients usually present with CMCD in childhood, have severe oral and oesophageal candidiasis accompanied by severe difficulty swallowing, chest pain, heartburn, and are at risk of developing oral and/or oesophageal SCC."
    explanation: >-
      Documents the severe obstructive oesophageal disease that creates the
      indication for dilatation; the abstract does not report dilatation
      outcomes, hence PARTIAL.
clinical_trials:
- name: NCT02629419
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Open-label dose-titration trial of oral encochleated amphotericin B
    (CAMB/MAT2203) in mucocutaneous candidiasis refractory or intolerant to
    standard non-intravenous therapy. Directly addresses the azole-resistance
    limitation that dominates long-term CMC management.
  target_phenotypes:
  - preferred_term: Chronic mucocutaneous candidiasis
    term:
      id: HP:0002728
      label: Chronic mucocutaneous candidiasis
  evidence:
  - reference: clinicaltrials:NCT02629419
    reference_title: "A Phase 2a Efficacy, Safety, Tolerability, and PK Study of Encochleated Amphotericin B (CAMB/MAT2203) in Patients With Mucocutaneous Candidiasis Who Are Refractory or Intolerant to Standard Non-Intravenous Therapies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is an open-label, dose-titration trial to study the efficacy, safety, and pharmacokinetics of oral cochleate amphotericin B (CAMB) in the treatment of mucocutaneous candidiasis infections in patients who are refractory or intolerant to standard non intravenous therapies."
    explanation: >-
      An interventional trial of an oral non-azole antifungal specifically in
      treatment-refractory mucocutaneous candidiasis.
- name: NCT01386437
  status: RECRUITING
  description: >-
    NIH long-term natural-history and pathogenesis study of human fungal
    infections, enrolling patients with unusual, persistent or severe fungal
    infection and the immune defects that permit them, plus relatives and
    healthy volunteers. The principal natural-history resource for CMC and its
    genetic etiologies.
  target_phenotypes:
  - preferred_term: Chronic mucocutaneous candidiasis
    term:
      id: HP:0002728
      label: Chronic mucocutaneous candidiasis
  evidence:
  - reference: clinicaltrials:NCT01386437
    reference_title: "The Natural History and Pathogenesis of Human Fungal Infections"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Researchers want to collect blood and tissue samples from people who have unusual, persistent or severe fungal infections or immune problems that increase the risk of these infections."
    explanation: >-
      Defines the enrolled population as patients with persistent or severe
      fungal infection driven by underlying immune defects, i.e. the CMC
      population and its genetic causes.
differential_diagnoses:
- name: HIV infection / AIDS
  disease_term:
    preferred_term: AIDS
    term:
      id: MONDO:0012268
      label: AIDS
  description: >-
    The commonest acquired cause of persistent oropharyngeal and oesophageal
    candidiasis, and the single most important diagnosis to exclude before
    invoking an inborn error. CD4 depletion removes the Th17 compartment among
    much else, so the mucosal phenotype can be indistinguishable at
    presentation.
  distinguishing_features:
  - Positive HIV serology or nucleic acid testing with CD4 lymphopenia
  - Adult or adolescent onset rather than infancy, with no childhood history of
    thrush, nail or genital candidiasis
  - Accompanied by the wider spectrum of opportunistic infection (Pneumocystis,
    CMV, cryptococcosis) that pure IL-17-circuit CMC never produces
  - No family history; HIV testing is a mandatory part of the CMC work-up
  evidence:
  - reference: PMID:28815025
    reference_title: "Oesophageal candidiasis and squamous cell cancer in patients with gain-of-function STAT1 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary immune deficiencies are most often due to human immunodeficiency virus (HIV) infection, antibiotic use and immunosuppressive treatment (steroids, chemotherapy)."
    explanation: Names HIV as the leading secondary cause of chronic candidiasis.
- name: Severe combined immunodeficiency and other combined immunodeficiencies
  disease_term:
    preferred_term: severe combined immunodeficiency
    term:
      id: MONDO:0015974
      label: severe combined immunodeficiency
  description: >-
    CMC is one of many infections in patients with broad and profound T-cell
    deficiency. Because thrush is often the first visible sign in infancy, SCID
    can be mistaken for isolated CMC at the earliest presentation.
  distinguishing_features:
  - Failure to thrive, chronic diarrhoea and a broad infectious spectrum
    (Pneumocystis, disseminated viral infection, BCG disease) rather than
    Candida alone
  - Profound T-cell lymphopenia and abnormal lymphocyte subsets; abnormal
    newborn TREC screening
  - In CMC proper, T, B and NK cell numbers are normal, so quantifying them is
    the standard first-line discriminator
  evidence:
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMC is one of a multitude of infectious diseases observed in patients with broad and profound T cell deficiencies."
    explanation: >-
      States the distinction between CMC as one of many infections in combined
      immunodeficiency versus CMC as an isolated phenotype.
- name: Drug-associated oesophageal or oropharyngeal candidiasis
  disease_term:
    preferred_term: esophageal candidiasis
    term:
      id: MONDO:0001648
      label: esophageal candidiasis
  description: >-
    Iatrogenic candidiasis from inhaled or systemic corticosteroids,
    broad-spectrum antibiotics, chemotherapy or other immunosuppression - by
    far the commonest explanation for oesophageal or oropharyngeal candidiasis
    in general practice, and a reversible one.
  distinguishing_features:
  - Clear temporal relationship to the drug exposure, with resolution on
    withdrawal, dose reduction, or spacer and mouth-rinse technique correction
  - Absent childhood history of thrush, nail or genital candidiasis; no family
    history
  - Normal Th17 counts and no STAT1 phosphorylation abnormality
  evidence:
  - reference: PMID:28815025
    reference_title: "Oesophageal candidiasis and squamous cell cancer in patients with gain-of-function STAT1 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oesophageal candidiasis is a common, usually self-limiting opportunistic infection, but long-term infection with Candida is known to predispose to oral and oesophageal squamous cell cancer (SCC)."
    explanation: >-
      Distinguishes ordinary self-limiting oesophageal candidiasis from the
      persistent form that defines CMC and carries carcinoma risk.
- name: Autoimmune polyendocrine syndrome type 1 (APECED/APS-1)
  disease_term:
    preferred_term: autoimmune polyendocrine syndrome type 1
    term:
      id: MONDO:0009411
      label: autoimmune polyendocrine syndrome type 1
  description: >-
    The most consequential overlap. CMC is typically the FIRST manifestation of
    APS-1, appearing years before the endocrine features, so an apparently
    isolated CMC in a child may be a pre-endocrine APS-1. This is a temporal
    trap, not merely a phenotypic one: withholding the diagnosis risks a fatal
    unrecognized adrenal crisis. APS-1 is simultaneously an APECED subtype of
    CMC (modelled in has_subtypes) and a differential diagnosis for apparently
    isolated CMC - both framings are correct and both are recorded here
    deliberately.
  distinguishing_features:
  - Neutralizing anti-IL-17A/IL-17F/IL-22 autoantibodies are present in APS-1
    and absent in STAT1 GOF CMC, making autoantibody testing the decisive
    discriminator
  - Hypoparathyroidism, primary adrenal insufficiency and ectodermal dystrophy
  - Biallelic AIRE variants
  - Because the autoantibodies precede the CMC, a negative endocrine screen at
    presentation does not exclude APS-1 and surveillance is required
  notes: >-
    Full curation of APS-1 (AIRE, thymic tolerance failure, endocrine
    autoimmunity) is in
    kb/disorders/Autoimmune_Polyendocrine_Syndrome_Type_1.yaml and is
    intentionally not duplicated in this entry.
  evidence:
  - reference: PMID:20123959
    reference_title: "Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In autoimmune polyendocrinopathy candidiasis ectodermal dystrophy (APECED, or autoimmune polyendocrine syndrome 1), CMC is often the first sign, but the underlying immunodeficiency is a long-standing puzzle."
    explanation: >-
      Establishes CMC as frequently the presenting feature of APS-1, which is
      why apparently isolated CMC must trigger APS-1 consideration.
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients displays autoantibodies against IL-17A, IL-17F, and IL-22."
    explanation: >-
      Confirms the autoantibody test discriminates APS-1 CMC from STAT1 GOF
      CMC.
- name: Autosomal dominant hyper-IgE syndrome (Job syndrome)
  disease_term:
    preferred_term: hyper-IgE recurrent infection syndrome 1, autosomal dominant
    term:
      id: MONDO:0007818
      label: hyper-IgE recurrent infection syndrome 1, autosomal dominant
  description: >-
    Shares the IL-17 deficit and therefore the CMC, but is a multisystem
    syndrome rather than a selective antifungal defect.
  distinguishing_features:
  - Markedly elevated serum IgE with eosinophilia
  - Recurrent cold staphylococcal skin abscesses and pneumonia with
    pneumatocele formation
  - Eczematoid dermatitis
  - Retained primary dentition, characteristic facies, scoliosis,
    minimal-trauma fracture and joint hyperextensibility
  - A dominant-negative STAT3 variant; none of these features accompany pure
    IL-17-circuit CMC
  evidence:
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with the autosomal dominant (AD) hyper IgE syndrome, caused by dominant-negative mutations of STAT3, are susceptible principally to CMC and staphylococcal diseases of the lungs and skin"
    explanation: >-
      Contrasts the AD-HIES infectious spectrum (CMC plus pulmonary and
      cutaneous staphylococcal disease) with isolated CMC.
- name: CARD9 deficiency
  disease_term:
    preferred_term: predisposition to invasive fungal disease due to CARD9 deficiency
    term:
      id: MONDO:0008905
      label: predisposition to invasive fungal disease due to CARD9 deficiency
  description: >-
    Listed as a differential as well as a subtype because the therapeutic
    consequences differ sharply. A patient labelled with mucocutaneous-only CMC
    who in fact has CARD9 deficiency is at risk of invasive and central nervous
    system fungal disease that intermittent mucosal antifungal therapy will not
    prevent.
  distinguishing_features:
  - Deep dermatophytosis, subcutaneous phaeohyphomycosis, and invasive or
    central nervous system fungal infection, none of which occur in
    IL-17-circuit CMC
  - Consanguinity with autosomal recessive segregation
  - Biallelic CARD9 null variants; any deep or CNS fungal disease in a CMC
    patient should prompt CARD9 sequencing
  evidence:
  - reference: PMID:19864672
    reference_title: "A homozygous CARD9 mutation in a family with susceptibility to fungal infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 members died during adolescence, 2 after invasive infection of the brain with candida species"
    explanation: >-
      The CARD9-specific invasive/CNS phenotype that distinguishes it from
      mucocutaneous-only CMC.
- name: RORC deficiency and Mendelian susceptibility to mycobacterial disease
  disease_term:
    preferred_term: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to complete RORgamma receptor deficiency
    term:
      id: MONDO:0014710
      label: autosomal recessive mendelian susceptibility to mycobacterial diseases due to complete RORgamma receptor deficiency
  description: >-
    Sits at the CMC/MSMD boundary. Patients present with both candidiasis and
    mycobacterial disease, and the mycobacterial susceptibility arises through
    a mechanism (defective Mycobacterium-specific IFN-gamma production) that is
    separate from, not a consequence of, the IL-17 defect.
  distinguishing_features:
  - Disseminated BCG or Mycobacterium tuberculosis disease alongside the
    candidiasis
  - Absent palpable axillary and cervical lymph nodes and small thymus
  - Absence of MAIT and type 1 NKT cells
  - Biallelic RORC loss-of-function; pure IL-17-circuit CMC carries no
    mycobacterial risk
  evidence:
  - reference: PMID:26160376
    reference_title: "IMMUNODEFICIENCIES. Impairment of immunity to Candida and Mycobacterium in humans with bi-allelic RORC mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied seven patients from three unrelated consanguineous families with this unusual combination of infectious diseases but with no known genetic disorder."
    explanation: >-
      Establishes the dual candidiasis/mycobacterial phenotype that
      distinguishes RORC deficiency from isolated CMC.
- name: Diabetes mellitus
  disease_term:
    preferred_term: diabetes mellitus
    term:
      id: MONDO:0005015
      label: diabetes mellitus
  description: >-
    Poorly controlled diabetes is a common metabolic permissive state for
    recurrent oral, cutaneous and genital candidiasis, and is also part of the
    STAT1 GOF and APS-1 autoimmune spectra - so it can be either the
    explanation for the candidiasis or a clue to the underlying inborn error.
  distinguishing_features:
  - Hyperglycaemia and raised HbA1c, with resolution of candidiasis on
    glycaemic control
  - Adult onset without childhood thrush, nail or oesophageal disease
  - Conversely, type 1 diabetes arising in a child who already has CMC should
    raise suspicion of STAT1 GOF (4% of the international cohort) or APS-1
    rather than being accepted as the cause
  evidence:
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many patients had autoimmune manifestations (37%), including hypothyroidism (22%), type 1 diabetes (4%), blood cytopenia (4%), and systemic lupus erythematosus (2%)."
    explanation: >-
      Documents type 1 diabetes within the STAT1 GOF spectrum, so diabetes in a
      CMC patient may be consequence rather than cause.
- name: DOCK8 deficiency
  disease_term:
    preferred_term: combined immunodeficiency due to DOCK8 deficiency
    term:
      id: MONDO:0009478
      label: combined immunodeficiency due to DOCK8 deficiency
  description: >-
    A combined immunodeficiency with reduced Th17 numbers, in which CMC occurs
    as one feature alongside a much broader infectious and atopic spectrum.
    Unlike the selective IL-17-circuit disorders, CMC here is a downstream
    symptom of broad T-cell dysfunction rather than the organizing lesion, so
    it is modelled as a differential diagnosis rather than a subtype of this
    entry.
  distinguishing_features:
  - Recurrent, severe herpes simplex virus, herpes zoster, molluscum
    contagiosum and human papillomavirus infections not seen in isolated
    IL-17-circuit CMC
  - Recurrent otitis media, sinusitis and pneumonia, plus atopy (eczema, food
    allergy, asthma) and eosinophilia
  - Biallelic DOCK8 loss of function on sequencing; combined T- and B-cell
    dysfunction on immune workup rather than the normal lymphocyte subsets
    seen in isolated CMC
  evidence:
  - reference: PMID:19776401
    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive DOCK8 deficiency is associated with a novel variant of combined immunodeficiency."
    explanation: >-
      The defining report establishing biallelic DOCK8 loss as a combined
      immunodeficiency, the syndrome within which CMC occurs as one component.
  - reference: PMID:19776401
    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had recurrent otitis media, sinusitis, and pneumonias; recurrent Staphylococcus aureus skin infections with otitis externa; recurrent, severe herpes simplex virus or herpes zoster infections; extensive and persistent infections with molluscum contagiosum; and human papillomavirus infections."
    explanation: >-
      Documents the broad, predominantly viral and staphylococcal infectious
      spectrum that distinguishes DOCK8 combined immunodeficiency from
      IL-17-circuit CMC. PARTIAL because the cited series characterises the
      syndrome rather than quantifying its Candida component.
- name: Secondary (acquired) chronic mucocutaneous candidiasis, general
  description: >-
    An umbrella differential covering acquired, non-germline permissive
    states for persistent mucocutaneous candidiasis - most often HIV
    infection, systemic or inhaled corticosteroids and other
    immunosuppression, broad-spectrum antibiotic use, poorly controlled
    diabetes mellitus, or thymoma with anti-cytokine autoantibodies - that
    must be excluded before an inborn error of the IL-17 circuit is
    diagnosed. The three most clinically important individual causes (HIV/
    AIDS, drug-associated candidiasis, diabetes mellitus) are curated as
    their own differential-diagnosis entries above with cause-specific
    distinguishing features; this entry records the shared acquired-cause
    framing rather than duplicating that detail.
  distinguishing_features:
  - No family history and no childhood-onset thrush, nail or genital
    candidiasis preceding the acquired insult
  - Clear temporal relationship to the immunosuppressive drug, HIV
    seroconversion, uncontrolled hyperglycaemia, or thymoma diagnosis
  - Same downstream complications (oesophageal stricture, squamous cell
    carcinoma risk) as the germline forms, but resolving or attenuating once
    the acquired cause is treated or removed
  evidence:
  - reference: PMID:28815025
    reference_title: "Oesophageal candidiasis and squamous cell cancer in patients with gain-of-function STAT1 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary immune deficiencies are most often due to human immunodeficiency virus (HIV) infection, antibiotic use and immunosuppressive treatment (steroids, chemotherapy)."
    explanation: Enumerates the acquired permissive states that produce secondary CMC.
diagnosis:
- name: Culture-confirmed persistent or recurrent mucocutaneous candidiasis
  description: >-
    Microscopy and culture (or molecular identification) of Candida from the
    affected site, with species identification and antifungal susceptibility
    testing - the latter essential after prolonged azole exposure. Endoscopy
    with brushings or biopsy is indicated for dysphagia or suspected
    oesophageal disease, which doubles as neoplasia surveillance.
  evidence:
  - reference: PMID:28815025
    reference_title: "Oesophageal candidiasis and squamous cell cancer in patients with gain-of-function STAT1 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend regular endoscopic surveillance to detect early oesophageal neoplasia in patients with CMCD as well as urgent endoscopy in symptomatic patients."
    explanation: Supports endoscopic evaluation as part of the CMC diagnostic workup.
- name: Phospho-STAT1 flow cytometry plus STAT1 sequencing
  description: >-
    Measurement of IFN-alpha-, IFN-gamma- or IL-27-induced STAT1
    phosphorylation in PBMC identifies gain-of-function alleles rapidly and is
    recommended in addition to, not instead of, sequencing. Given that STAT1
    accounts for the majority of genetically solved CMC, STAT1 is the first
    gene to test; a negative panel should be followed by exome or genome
    sequencing across the wider CMC gene set.
  presence: PRESENT
  notes: Applies to the STAT1 GOF subtype.
  evidence:
  - reference: PMID:26604104
    reference_title: "The Extended Clinical Phenotype of 26 Patients with Chronic Mucocutaneous Candidiasis due to Gain-of-Function Mutations in STAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT1 mutations are frequently observed in patients suffering from CMC. Thus, sequence analysis of STAT1 in CMC patients is advised."
    explanation: Establishes STAT1 sequencing as the first-line genetic test in CMC.
- name: Anti-IL-17A/IL-17F/IL-22 autoantibody assay
  description: >-
    Discriminates the APECED/APS-1 (and thymoma) acquired phenocopy from the
    germline IL-17-circuit disorders. Positive in the great majority of APECED
    patients with CMC, negative in STAT1 gain-of-function.
  presence: PRESENT
  notes: Applies to the APECED subtype.
  evidence:
  - reference: PMID:20123958
    reference_title: "Autoantibodies against IL-17A, IL-17F, and IL-22 in patients with chronic mucocutaneous candidiasis and autoimmune polyendocrine syndrome type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 37 healthy controls and none of the 103 patients with other autoimmune disorders tested had such auto-Abs."
    explanation: >-
      Establishes the specificity of the autoantibody assay for APS-1 among
      controls and other autoimmune disease.
progression:
- phase: Early childhood onset with lifelong relapsing course
  age_range: Median onset 1 year (range 0-24 years) in STAT1 gain-of-function
  notes: >-
    CMC typically begins in infancy or early childhood, most often as
    persistent oral thrush, and spreads over time to nails, skin, oesophagus
    and genital mucosa. In STAT1 gain-of-function the median age at onset is
    one year. The course is chronic and relapsing rather than staged:
    treatment induces remission but relapse after withdrawal is the norm (87%
    for oesophageal disease). The complications that determine prognosis -
    oesophageal stricture, squamous cell carcinoma, and, in STAT1 GOF,
    invasive infection, cerebral aneurysm and cancer - accumulate with disease
    duration, which is the argument for early diagnosis and sustained
    suppression rather than intermittent treatment of flares.
  evidence:
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of the 274 patients was 22 years (range, 1-71 years); 98% of them had CMC, with a median age at onset of 1 year (range, 0-24 years)."
    explanation: Establishes early-childhood onset and lifelong persistence.
  - reference: PMID:26604104
    reference_title: "The Extended Clinical Phenotype of 26 Patients with Chronic Mucocutaneous Candidiasis due to Gain-of-Function Mutations in STAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but relapses were frequent after treatment was stopped (87 %, 13/15)."
    explanation: Documents the relapsing course after treatment withdrawal.
infectious_agent:
- name: Candida albicans
  description: >-
    The predominant causative organism. A commensal of the oral,
    gastrointestinal and genital mucosa in healthy people, it becomes
    pathogenic in CMC only because IL-17-dependent barrier immunity fails.
    Other Candida species occur, and prolonged azole exposure selects for less
    susceptible ones.
  infectious_agent_term:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  evidence:
  - reference: PMID:25918342
    reference_title: "Inherited IL-17RC deficiency in patients with chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic mucocutaneous candidiasis (CMC) is characterized by recurrent or persistent infections of the skin, nail, oral, and genital mucosae with Candida species, mainly C. albicans."
    explanation: Identifies C. albicans as the predominant causative species.
discussions:
- discussion_id: cmc_th17_count_not_diagnostic
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do 18% of STAT1 gain-of-function patients have a normal circulating
    IL-17A-producing T-cell count despite manifesting CMC?
  attaches_to:
  - pathophysiology#Deficient IL-17A, IL-17F and IL-22 Production
  rationale: >-
    The pathograph treats deficient IL-17A/F/IL-22 production as the
    convergence node for the STAT1, RORC, STAT3 and CARD9 routes, yet the
    largest STAT1 GOF cohort found low circulating IL-17A-producing T cells in
    only 82% of patients tested. Either the peripheral blood Th17 count is an
    insensitive proxy for tissue-level IL-17 availability at the barrier, or a
    subset of STAT1 GOF patients develop CMC through a mechanism that does not
    require quantitative Th17 depletion (for example impaired IL-17 functional
    output from a numerically normal compartment, or a direct effect of
    excessive interferon signalling on the epithelium). Resolving this matters
    clinically because a normal Th17 count is currently, and incorrectly,
    treated by some as evidence against the diagnosis.
  proposed_experiments:
  - experiment_id: exp_cmc_barrier_il17_vs_blood_th17
    name: Barrier-site IL-17 quantification stratified by blood Th17 count
    description: >-
      Quantify IL-17A, IL-17F and IL-22 protein and transcript at the oral
      mucosal barrier (rather than in blood) in STAT1 GOF patients stratified
      by circulating Th17 count, to test whether tissue IL-17 availability is
      uniformly low even when blood Th17 numbers are normal.
  - experiment_id: exp_cmc_per_cell_candida_il17_output
    name: Per-cell Candida-specific IL-17 functional output
    description: >-
      Compare Candida-specific IL-17 secretion per Th17 cell in STAT1 GOF
      patients with normal versus low Th17 numbers, to test whether a
      functional rather than numerical deficit explains the discordant subset.
  evidence:
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Circulating interleukin-17A-producing T-cell count was low for most (82%) but not all of the patients tested."
    explanation: >-
      Documents the discordance between the mechanistic model and the
      peripheral biomarker.
- discussion_id: cmc_stat1_gof_aneurysm_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does STAT1 gain-of-function cause cerebral aneurysm?
  attaches_to:
  - pathophysiology#Broad STAT1-Driven Immune Dysregulation
  rationale: >-
    Cerebral aneurysms occur in 6% of STAT1 GOF patients and are among the
    three strongest predictors of poor outcome, yet the causal edge from STAT1
    hyperactivation to arterial wall failure is modelled as
    INDIRECT_UNKNOWN_INTERMEDIATES because no mechanism is established.
    Candidate explanations include chronic interferon-driven vasculitis, a
    direct effect of STAT1 signalling on vascular smooth muscle or endothelium,
    and secondary damage from recurrent infection. Distinguishing these
    determines whether JAK inhibition would be expected to modify aneurysm
    risk, which is currently unknown and clinically important given that
    patients may take JAK inhibitors for decades.
  proposed_experiments:
  - experiment_id: exp_cmc_stat1_aneurysm_imaging_by_jaki_exposure
    name: Cerebral vascular imaging stratified by JAK-inhibitor exposure
    description: >-
      Cross-sectional cerebral vascular imaging in a STAT1 GOF cohort
      stratified by cumulative JAK-inhibitor exposure, to test whether
      reducing STAT1 signalling modifies aneurysm prevalence.
  - experiment_id: exp_cmc_stat1_aneurysm_wall_histopathology
    name: Aneurysm wall histopathology and interferon signature
    description: >-
      Histopathological characterization of aneurysm wall tissue from STAT1 GOF
      patients for interferon-signature gene expression and inflammatory
      infiltrate, to distinguish interferon-driven vasculitis from a
      non-inflammatory vascular effect.
  evidence:
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT1 GOF mutations underlie AD CMC, as well as an unexpectedly wide range of other clinical features, including not only a variety of infectious and autoimmune diseases, but also cerebral aneurysms and carcinomas that confer a poor prognosis."
    explanation: >-
      Establishes the association without offering a mechanism, which is the
      gap recorded here.
notes: >-
  Modelling decisions worth recording. (1) No conforms_to mechanism-module
  reference is asserted. The kb/modules/ set was reviewed and none applies: the
  antimicrobial drug-mechanism modules are bacterial (cell wall, ribosome,
  topoisomerase, RNA polymerase, folate) and there is no antifungal
  counterpart; granuloma_formation covers a different fungal host response; and
  the IL-17-axis convergence modelled here is currently unique to this entry. If
  a second IL-17-axis disorder is curated, factoring an
  il17_mucosal_barrier_immunity module would be worthwhile. (2) APS-1 appears
  both as a subtype (the anti-IL-17 autoantibody route to CMC) and as a
  differential diagnosis (because CMC usually precedes the endocrine features by
  years); this duplication is deliberate and both framings are clinically
  correct. (3) Invasive/CNS fungal disease is a separate pathophysiology node
  with its own downstream phenotypes rather than a severity qualifier on the
  mucocutaneous node, so that CARD9's distinct mechanism and risk are not
  flattened into the IL-17 story. (4) No GeneReviews chapter exists for chronic
  mucocutaneous candidiasis as a phenotype; PubMed title searches for
  candidiasis plus GeneReviews returned no CMC chapter, so the GeneReviews
  baseline step is not applicable to this entry. (5) The CARD9 and RORC subtypes
  carry no subtype_term because their MONDO classes (MONDO:0008905,
  MONDO:0014710) descend from MONDO:0020573 inherited disease susceptibility,
  which is a source_node of the DiseaseTerm dynamic enum but not of
  DiseaseOrSubtypeTerm. Both IDs are therefore bound on the corresponding
  differential_diagnoses entries instead. This asymmetry looks like a schema
  gap worth raising upstream rather than a curation choice. (6) On the scope of
  has_subtypes (updated per #7644): only STAT1 GOF, IL17RA, IL17RC, IL17F and
  ACT1 are true MONDO is_a children of MONDO:0015279. RORC and CARD9
  deficiency are separate MONDO entities under MONDO:0020573 inherited
  disease susceptibility but are kept as dual subtype/differential entries
  (per note 5's own asymmetry and the CARD9-specific invasive-disease risk),
  matching APS-1/APECED's existing deliberate dual listing (note 2). AD-HIES,
  DOCK8 deficiency and Secondary CMC have been demoted out of has_subtypes
  entirely: AD-HIES and DOCK8 deficiency are separate MONDO entities with
  their own dismech entries (`kb/disorders/Autosomal_Dominant_Hyper-IgE_Syndrome.yaml`,
  no standalone DOCK8 entry yet) and are now differential_diagnoses only;
  Secondary CMC is an acquired, non-Mendelian state and is now a general
  differential_diagnoses entry alongside its three already-curated specific
  instances (HIV/AIDS, drug-associated, diabetes mellitus). The remaining
  IL-17-circuit-proper members (CMC itself, APS-1, AD-HIES) that have their
  own Disease entry are collected in the new
  `kb/groupings/IL17_Immunity_Defects.yaml` union grouping; IL17RA, IL17RC,
  IL17F, ACT1/TRAF3IP2, STAT1 GOF, RORC and CARD9 deficiency remain
  represented only through this entry's has_subtypes until they get their own
  standalone entries, since GroupingMember has no subtype-reference slot
  (flagged as a follow-up schema gap in the grouping's own notes).

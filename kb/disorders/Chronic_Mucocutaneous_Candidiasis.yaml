  evidence:
  - reference: PMID:26160376
    reference_title: "IMMUNODEFICIENCIES. Impairment of immunity to Candida and Mycobacterium in humans with bi-allelic RORC mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of functional RORγ and RORγT isoforms resulted in the absence of IL-17A/F-producing T cells in these individuals, probably accounting for their chronic candidiasis."
    explanation: >-
      Establishes RORC deficiency as a transcription-factor-level cause of CMC
      via loss of IL-17A/F-producing T cells.
- name: CARD9 deficiency
  display_name: CARD9 deficiency (invasive and CNS fungal disease)
  description: >-
    Autosomal recessive deficiency of CARD9, the cytosolic adaptor that
    transduces C-type lectin receptor (Dectin-1) signals in myeloid cells.
    CARD9-deficient patients do have low Th17 counts and CMC, but the defect
    is upstream of, and broader than, the IL-17 circuit itself: it also
    cripples myeloid antifungal effector function. This subtype is therefore
    NOT mucocutaneous-only - it uniquely and characteristically permits
    invasive and central nervous system fungal disease (including fatal
    Candida infection of the brain) and deep dermatophytosis. The distinction
    is clinically decisive: a CMC patient with CNS or deep-tissue fungal
    disease should be worked up for CARD9, and management cannot be limited to
    topical or intermittent mucosal antifungal therapy. No subtype_term is
    bound: the matching MONDO class (MONDO:0008905, predisposition to invasive
    fungal disease due to CARD9 deficiency) sits under MONDO:0020573 inherited
    disease susceptibility, outside the source_nodes of the
    DiseaseOrSubtypeTerm dynamic enum; it is used as the disease_term of the
    corresponding differential diagnosis below.
  genes:

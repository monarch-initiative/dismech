    explanation: Defines the partial, dominant-negative nature of the IL17F lesion.
- name: ACT1 deficiency
  display_name: ACT1/TRAF3IP2 deficiency (CANDF8)
  subtype_term:
    preferred_term: candidiasis, familial, 8
    term:
      id: MONDO:0014230
      label: candidiasis, familial, 8
  description: >-
    Autosomal recessive deficiency of the adaptor ACT1 (TRAF3IP2), which is
    recruited to the IL-17 receptor chains via its SEFIR domain. The T536I
    substitution abolishes that homotypic interaction, so IL-17A and IL-17F
    fail to activate NF-kB/MAPK and induce IL-6 and CXCL1 in fibroblasts - the
    receptor is intact but the signal is not transduced. The common D10N ACT1
    polymorphism, by contrast, is hypomorphic rather than null, which is why it
    does not cause CMC despite its population frequency.
  genes:
  - preferred_term: TRAF3IP2
    term:
      id: hgnc:1343

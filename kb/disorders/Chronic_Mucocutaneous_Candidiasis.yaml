- name: CARD9-Dependent Myeloid Antifungal Signalling Failure
  biological_scale: CELLULAR
  role: trigger
  description: >-
    CARD9 is the cytosolic adaptor that transduces C-type lectin receptor
    (Dectin-1) recognition of fungal cell-wall beta-glucan in myeloid cells.
    Its loss has two separable consequences and this dual role is what makes
    CARD9 deficiency clinically distinct within CMC. First, CARD9-dependent
    myeloid cytokine output is required to drive Th17 differentiation, so
    CARD9-deficient patients have low Th17 counts and develop CMC by the
    shared IL-17 route. Second - and unlike every other CMC etiology - CARD9
    loss also cripples myeloid antifungal effector function itself, permitting
    fungal invasion beyond the barrier. The two arms are modelled as separate
    downstream edges precisely so that invasive/CNS disease is not flattened
    into the mucocutaneous phenotype.

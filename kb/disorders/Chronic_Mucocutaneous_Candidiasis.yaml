- category: Infectious
  name: Esophageal candidiasis
  description: >-
    Oesophageal involvement was documented in 65% (15 of 23) of a STAT1 GOF
    cohort. It responds to treatment in most patients but relapses in 87%
    after treatment stops, and is the substrate for both stricture and
    squamous carcinoma.
  phenotype_term:
    preferred_term: Esophageal candidiasis
    temporality: RECURRENT
  frequency: FREQUENT
  notes: >-
    Deliberately left without an HPO binding. HPO has no term for oesophageal
    candidiasis: the available options are HP:0009098 (Chronic oral
    candidiasis, wrong site), HP:0005411 (Chronic intestinal candidiasis, wrong
    site) and HP:0002728 (Chronic mucocutaneous candidiasis, which is the
    disease-level term already used for this entry). Per the project convention
    of preferring no binding over a misleading one, the descriptor carries a
    preferred_term only. This is the same family of gap as issue #7328 (no
    course-neutral Oral candidiasis term) and is a candidate HPO new-term
    request. MONDO:0001648 (esophageal candidiasis) exists, so the gap is
    HPO-specific.

- name: Invasive and Central Nervous System Fungal Disease
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Deliberately modelled as a separate outcome node so that it is never
    conflated with the mucocutaneous phenotype. In the classical CMC
    etiologies (IL17RA, IL17RC, IL17F, ACT1, and the APECED autoantibody
    phenocopy) fungal disease stops at the barrier. Two etiologies breach it.
    CARD9 deficiency does so characteristically and by a distinct mechanism -
    failed myeloid antifungal effector function rather than failed IL-17
    signalling - producing deep dermatophytosis and invasive, sometimes fatal,
    central nervous system candidiasis. STAT1 gain-of-function does so at
    lower frequency (invasive fungal infection in 10% of a 274-patient
    cohort), as one component of its broader immune dysregulation. Invasive
    infection of any kind was among the strongest predictors of poor outcome.
  subtypes:
  - CARD9 deficiency
  - STAT1 GOF
  evidence:
  - reference: PMID:19864672
    reference_title: "A homozygous CARD9 mutation in a family with susceptibility to fungal infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 members died during adolescence, 2 after invasive infection of the brain with candida species"
    explanation: >-
      Documents fatal CNS candidiasis as the distinguishing CARD9 feature,
      absent from the IL-17-circuit etiologies.
  - reference: PMID:27114460
    reference_title: "Heterozygous STAT1 gain-of-function mutations underlie an unexpectedly broad clinical phenotype."
    supports: SUPPORT

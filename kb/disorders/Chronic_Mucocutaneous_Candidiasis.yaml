- name: Suppression of Th17 Cell Development
  biological_scale: CELLULAR
  role: mediator
  description: >-
    The cellular consequence of STAT1 hyperactivation, and the step that makes
    the inversion intelligible. IFN-alpha/beta, IFN-gamma and IL-27 are
    physiological inhibitors of IL-17-producing T-cell development and act
    through STAT1, so amplifying STAT1 amplifies the brake. In parallel, IL-6
    and IL-21 are physiological inducers of Th17 cells that act through STAT3
    but also engage STAT1, so a STAT1-biased response at those shared
    receptors diverts the inducing signal. A gain of function in the
    interferon arm therefore produces a loss of function in the Th17 arm.

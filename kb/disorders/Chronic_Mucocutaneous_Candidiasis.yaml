    explanation: Defines the molecular lesion in autosomal recessive IL-17RA deficiency.
- name: IL17RC deficiency
  display_name: IL-17RC deficiency (CANDF9)
  subtype_term:
    preferred_term: candidiasis, familial, 9
    term:
      id: MONDO:0014642

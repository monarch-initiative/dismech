- name: Chronic Candida-Associated Epithelial Injury and Squamous Dysplasia
  biological_scale: TISSUE
  role: consequence
  description: >-
    The complication that overturned the historical view of CMC as a benign
    nuisance disease. Decades of unresolved Candida infection of the oral and
    oesophageal squamous epithelium produce chronic inflammation, hyperplasia
    and scarring, culminating in fibrotic oesophageal stricture and in
    squamous cell carcinoma of the mouth and oesophagus. In STAT1 GOF, cancers
    occurred in 6% of a 274-patient cohort and were among the strongest
    predictors of poor outcome; a single reported CMC kindred lost two members
    to oesophageal squamous cell cancer. This is the mechanistic rationale for
    endoscopic surveillance in long-standing disease.

      explanation: >-
        Identifies the nosology this assignment is made against. Marked PARTIAL
        because the cached abstract establishes the existence and authority of
        the IUIS 2022 classification but does not itself contain the
        table-level placement of CMC; the Table 6 assignment is taken from the
        classification tables in the full report and is recorded in the notes
        above rather than asserted from this snippet.
inheritance:
- name: Autosomal dominant
  description: >-
    Applies to STAT1 gain-of-function CMC (the commonest genetic cause, often
    de novo) and to dominant-negative IL17F deficiency.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, using whole-exome sequencing, we identified heterozygous germline mutations in STAT1 in 47 patients from 20 kindreds with AD CMCD."
    explanation: >-
      Heterozygous germline STAT1 mutations segregating in 20 kindreds
      establish autosomal dominant inheritance for the commonest CMC etiology.
- name: Autosomal recessive
  description: >-
    Applies to IL17RA, IL17RC and ACT1/TRAF3IP2 deficiency, to CARD9 and RORC
    deficiency, and to AIRE-deficient APECED/APS-1.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25918342
    reference_title: "Inherited IL-17RC deficiency in patients with chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-recessive (AR) IL-17RA and ACT1 deficiencies and autosomal-dominant IL-17F deficiency, each reported in a single kindred, underlie CMC in otherwise healthy patients."
    explanation: >-
      Establishes autosomal recessive inheritance for the IL-17 receptor and
      adaptor deficiencies.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  notes: >-
    Isolated CMC disease (CMCD) is cited as occurring in about 1 in 100,000.
    This is an order-of-magnitude estimate used in a population-genetic
    argument rather than a registry-derived rate; CMC spans several distinct
    monogenic disorders, so no reliable pooled incidence exists.
  evidence:
  - reference: PMID:24120361
    reference_title: "An ACT1 mutation selectively abolishes interleukin-17 responses in humans with chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the high frequency of homozygotes would not be consistent with the rarity of CMCD (about 1/100,000)"
    explanation: >-
      Provides the commonly cited order-of-magnitude population frequency for
      isolated CMC disease.
mechanistic_hypotheses:
- hypothesis_group_id: il17_axis_convergence
  hypothesis_label: >-
    Convergence of independent genetic lesions on the IL-17 axis is the
    inferential basis for IL-17 as the mucosal antifungal pathway
  status: CANONICAL
  description: >-
    The intellectual core of this entry. CMC is not merely explained by IL-17
    deficiency; historically the inference ran the other way. Between 2010 and
    2015, six mechanistically independent human lesions - neutralizing
    anti-IL-17A/IL-17F/IL-22 autoantibodies (APECED), IL-17RA deficiency,
    IL-17F dominant-negative deficiency, ACT1/TRAF3IP2 deficiency, IL-17RC
    deficiency and RORC deficiency - were each shown to produce the same narrow
    phenotype: mucocutaneous candidiasis, with little or no other infectious
    susceptibility. Because these lesions sit at different points on one
    circuit (cytokine, receptor, adaptor, transcription factor,
    autoantibody-mediated neutralization) yet converge on one clinical picture,
    they constitute a natural knock-out series establishing that human
    IL-17A/IL-17F immunity is both necessary for mucocutaneous defence against
    Candida albicans and largely redundant for defence against other pathogens.
    The authors of these papers describe them explicitly as experiments of
    nature. Causal edges belonging to this argument carry this hypothesis
    group.
  evidence:
  - reference: PMID:21350122
    reference_title: "Chronic mucocutaneous candidiasis in humans with inborn errors of interleukin-17 immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These experiments of nature indicate that human IL-17A and IL-17F are essential for mucocutaneous immunity against C. albicans, but otherwise largely redundant."
    explanation: >-
      The founding statement of the inference: two independent inborn errors of
      IL-17 immunity establish IL-17A/F as essential and specific for
      mucocutaneous anti-Candida defence.
  - reference: PMID:25918342
    reference_title: "Inherited IL-17RC deficiency in patients with chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These experiments of nature indicate that human IL-17RC is essential for mucocutaneous immunity to C. albicans but is otherwise largely redundant."
    explanation: >-
      A fourth, independent lesion on the same circuit reproduces the identical
      narrow phenotype, strengthening the convergence argument.
  - reference: PMID:20123959
    reference_title: "Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that IL-22 and IL-17F are key natural defenders against CMC and that the immunodeficiency underlying CMC in both patient groups has an autoimmune basis."
    explanation: >-
      The acquired autoantibody phenocopy independently implicates the same
      cytokines, showing the convergence is on the pathway and not on any one
      gene.
- hypothesis_group_id: stat1_gof_inversion
  hypothesis_label: >-
    A gain of STAT1 function produces a loss of Th17 immunity (signalling
    cross-inhibition, not STAT1 haploinsufficiency)
  status: CANONICAL
  description: >-
    STAT1 gain-of-function CMC is mechanistically counter-intuitive and is
    frequently mis-stated as a STAT1 deficiency. The alleles are genuinely
    hypermorphic: coiled-coil-domain substitutions impair nuclear
    dephosphorylation of activated STAT1, so STAT1-dependent transcription is
    increased. The loss of IL-17 immunity is a downstream consequence of that
    gain, by two convergent routes. First, IFN-alpha/beta, IFN-gamma and IL-27
    are physiological inhibitors of IL-17-producing T-cell development and act
    through STAT1; amplifying their signal amplifies the brake. Second, IL-6
    and IL-21 are physiological inducers of Th17 cells that act through STAT3
    but also activate STAT1; shifting the STAT1/STAT3 balance toward STAT1 at
    the shared receptors diverts the inducing signal. The prediction that
    follows - that pharmacologically dialling the signal back down should
    restore IL-17 immunity - is borne out clinically by JAK inhibition, making
    this the rare inborn error where the mechanism directly names its own
    treatment.
  applies_to_subtypes:
  - STAT1 GOF
  evidence:
  - reference: PMID:21727188
    reference_title: "Gain-of-function human STAT1 mutations impair IL-17 immunity and underlie chronic mucocutaneous candidiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stronger cellular responses to the STAT1-dependent IL-17 inhibitors IFN-α/β, IFN-γ, and IL-27, and stronger STAT1 activation in response to the STAT3-dependent IL-17 inducers IL-6 and IL-21, hinder the development of T cells producing IL-17A, IL-17F, and IL-22."
    explanation: >-
      States the inversion mechanism directly: enhanced STAT1 signalling both
      amplifies IL-17-inhibitory cytokines and diverts IL-17-inducing ones.
  - reference: PMID:29934865
    reference_title: "Utility of Ruxolitinib in a Child with Chronic Mucocutaneous Candidiasis Caused by a Novel STAT1 Gain-of-Function Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major clinical improvement was achieved after 8 weeks of ruxolitinib treatment, while sustained suppression of IFNγ- and IFNα-induced phosphorylation of STAT1, STAT3, and STAT5, as well as increased STAT3-inducible and Th17-related gene expression, was demonstrated ex vivo."
    explanation: >-
      Therapeutic confirmation of the inversion model: reducing STAT1
      phosphorylation raises Th17-related gene expression and resolves CMC.
has_subtypes:
- name: STAT1 GOF
  display_name: STAT1 gain-of-function CMC (CANDF7 / IMD31C)
  subtype_term:
    preferred_term: immunodeficiency 31C, chronic mucocutaneous candidiasis, autosomal dominant
    term:
      id: MONDO:0013599
      label: autoimmune enteropathy and endocrinopathy - susceptibility to chronic infections syndrome
  description: >-
    The commonest genetic cause of CMC. Heterozygous, usually
    coiled-coil-domain STAT1 substitutions that impair nuclear
    dephosphorylation of activated STAT1 and thereby increase STAT1-dependent
    responses; the resulting suppression of IL-17-producing T-cell development
    causes CMC. Unlike the direct IL-17-circuit defects, STAT1 GOF is not
    confined to Candida: it carries substantial bacterial, viral and
    mycobacterial infection risk, autoimmunity (especially hypothyroidism),
    cerebral aneurysm and carcinoma. It is the only CMC subtype with a
    mechanism-directed therapy (JAK inhibition).
  genes:

      snippet: "Recent progress in the methods of genetic diagnosis of inborn errors of immunity has contributed to a better understanding of the pathogenesis of chronic mucocutaneous candidiasis (CMC) and potential therapeutic options."
      explanation: >-
        The clinical presentation and management of CMC is that of a chronic
        fungal infection, supporting a secondary infectious-disease placement.
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS 2022 phenotypic classification Table 6 (defects in intrinsic and
      innate immunity), which explicitly enumerates chronic mucocutaneous
      candidiasis alongside MSMD and HSE susceptibility. Note that the
      APECED/APS-1 route to CMC sits in IUIS Table 4 (immune dysregulation) on
      that disease entry, and thymoma-associated anti-IL-17 autoantibody CMC is
      a Table 10 phenocopy; this entry's single IUIS assignment describes the
      germline IL-17-circuit disorders that define CMC proper.
    evidence:

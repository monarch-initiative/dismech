    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain-of-function STAT1 alleles therefore cause AD CMCD by impairing IL-17 immunity."
    explanation: Establishes STAT1 gain-of-function as a cause of autosomal dominant CMC.

  subtype_term:
    preferred_term: candidiasis, familial, 6
    term:
      id: MONDO:0013503
      label: candidiasis, familial, 6
  description: >-
    Autosomal dominant CMC from a hypomorphic, dominant-negative IL17F allele
    (S65L). Mutant IL-17F is produced and dimerizes normally but cannot bind
    IL-17RA, so both mutant homodimers and IL-17A/IL-17F heterodimers are
    inactive - the partial nature of the defect explains the incomplete
    clinical penetrance observed in the index kindred.

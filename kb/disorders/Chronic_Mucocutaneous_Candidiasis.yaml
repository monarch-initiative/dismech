  description: >-
    Autosomal recessive, complete IL-17 receptor A deficiency. IL-17RA is the
    shared chain of the receptors for IL-17A and IL-17F homodimers and
    IL-17A/F heterodimers, so its loss abolishes all three responses in
    fibroblasts and leukocytes. The phenotype is isolated CMC with, at most,
    milder cutaneous Staphylococcus aureus disease.

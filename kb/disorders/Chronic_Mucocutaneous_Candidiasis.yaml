    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation, located in the SEFIR, impaired the homotypic interaction of ACT1 with the IL-17 receptors abolishing the response to IL-17A and IL-17F in fibroblasts and to IL-17E in leukocytes."
    explanation: Defines the adaptor-level lesion in ACT1/TRAF3IP2 deficiency.
- name: RORC deficiency
  display_name: RORgamma/RORgammaT deficiency
  description: >-
    Bi-allelic RORC loss of function removes the master transcription factor
    for IL-17A/F-producing lymphocytes, so IL-17A/F-producing T cells are
    absent and CMC results. Unlike the receptor and adaptor defects, RORC
    deficiency is not confined to Candida: the same patients have severe
    mycobacterial disease, unexpectedly through a separate defect in
    Mycobacterium-specific IFN-gamma production by gamma-delta and CCR6+CXCR3+
    T cells. This subtype therefore sits at the boundary of CMC and MSMD.
    No subtype_term is bound: the matching MONDO class (MONDO:0014710,
    autosomal recessive Mendelian susceptibility to mycobacterial diseases due
    to complete RORgamma receptor deficiency) sits under MONDO:0020573
    inherited disease susceptibility, which is outside the source_nodes of the
    DiseaseOrSubtypeTerm dynamic enum. It is used as the disease_term of the
    corresponding differential diagnosis below, where the DiseaseTerm enum does
    admit that branch.
  genes:

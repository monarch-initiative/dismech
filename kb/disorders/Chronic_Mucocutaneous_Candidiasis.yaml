- name: Neutralizing Anti-IL-17A, Anti-IL-17F and Anti-IL-22 Autoantibodies
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The acquired phenocopy. In AIRE-deficient APECED/APS-1, failure of thymic
    negative selection generates high-titre neutralizing autoantibodies against
    IL-17A, IL-17F and IL-22. Th17 cells and IL-17 receptors are structurally
    intact; the cytokines are simply removed from circulation before they can
    signal. The entry point into the shared pathway is therefore one step
    downstream of the genetic etiologies - at the receptor rather than at
    cytokine production. The autoantibodies precede CMC onset in all
    informative cases, establishing direction of causation, and the same
    autoantibodies explain CMC in rare thymoma patients. Only this arm of
    APS-1 is modelled here; AIRE-dependent tolerance failure and the endocrine
    autoimmunity are curated in the APS-1 entry.

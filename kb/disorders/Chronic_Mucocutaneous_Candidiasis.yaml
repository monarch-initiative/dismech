- name: Broad STAT1-Driven Immune Dysregulation
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The non-Candida arm of STAT1 gain-of-function, kept as a separate node
    because it is subtype-specific and must not be attributed to CMC as a
    class. The same enhanced STAT1-dependent responsiveness that suppresses
    Th17 development also produces bacterial infection (74%, mostly
    Staphylococcus aureus), viral infection (38%, mostly Herpesviridae),
    mycobacterial disease, autoimmunity (37%, dominated by hypothyroidism at
    22%), cerebral aneurysms (6%) and carcinoma (6%). Invasive infection,
    cerebral aneurysm and cancer were the strongest predictors of poor outcome
    in the largest cohort. Patients with pure CMC disease from IL-17-circuit
    lesions do not develop this spectrum.

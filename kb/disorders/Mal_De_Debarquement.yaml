name: Mal De Debarquement
creation_date: "2026-08-29T00:00:00Z"
category: Neurological Disorder
description: >-
  Mal de débarquement syndrome (MdDS) is a chronic central vestibular disorder
  in which a persistent illusion of self-motion - described as rocking, bobbing
  or swaying - outlasts the passive motion that provoked it, classically a sea
  voyage but also air, road or rail travel. It is a disorder of the perception
  of motion rather than of the vestibular end organ: inner-ear function,
  audiometry and structural brain imaging are characteristically normal, and
  the diagnosis is made on the clinical pattern rather than on any test.

  The defining and diagnostically decisive feature is paradoxical: symptoms
  temporarily *remit* on re-exposure to passive motion, so patients feel better
  while driving and worse when the car stops. That single observation separates
  MdDS from persistent postural-perceptual dizziness, in which motion and
  visual complexity make things worse, and it is also the clue to the
  mechanism - the brain state is not a deficit but a maladaptive adaptation
  that the triggering stimulus transiently satisfies.

  The leading mechanistic account, developed from roll-while-rotating
  conditioning in monkeys and reproduced in humans in NASA rotating-room
  experiments, is that prolonged passive oscillatory motion maladapts the
  vestibulo-ocular reflex through velocity storage, the central integrator that
  extends the vestibular response beyond the cupula's own time constant.
  Formalized as a three-dimensional dynamical system, the lesion is
  cross-axis coupling - off-diagonal terms misaligning the yaw eigenvector from
  the head-vertical and gravity axes - which is experienced as a continuous
  pull or rocking. Downstream, functional imaging finds a limbic focus of
  entorhinal and amygdala hypermetabolism with increased coupling to posterior
  visual-vestibular areas and reduced frontal connectivity, and resting EEG
  frames the disorder as entrainment to oscillating motion rather than a focal
  lesion. The therapy that follows from this account - rolling the head while
  viewing a full-field rotating stimulus, to readapt the reflex in the opposite
  direction - is unusual in that it is simultaneously the treatment and the
  clearest test of the mechanism.

  MdDS falls disproportionately on women in the fourth to sixth decades, often
  around the perimenopausal transition, and carries high migraine comorbidity.
  Population prevalence is not known.
disease_term:
  preferred_term: mal de débarquement syndrome
  term:
    id: MONDO:0016217
    label: mal de Debarquement
synonyms:
- MdDS
- mal de débarquement syndrome
- disembarkment syndrome
- sickness of disembarkment
- landsickness
notes: >-
  Ontology note. The central mechanism of this entry is maladaptation of the
  vestibulo-ocular reflex, and no adequate GO term for that process exists: GO
  has no vestibulo-ocular reflex class, and GO:0060013 - which the deep-research
  report offered under that name - is `righting reflex`, a different process.
  The mechanism nodes therefore carry no GO binding rather than a
  near-miss one, and name the process in prose instead. See the wider term note
  in the PR.

  Scope note. The three temporal designations in the Bárány criteria - `in
  evolution`, `transient` and `persistent` - are observation-window
  qualifiers on one disease, not distinct entities, so they are curated as
  `progression` phases rather than as `has_subtypes`. The genuine subtype axis
  is motion-triggered versus non-motion-triggered onset, and that one is
  contested; see the discussion attached to the trigger node.
definitions:
- name: Bárány Society diagnostic criteria for MdDS
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The International Classification of Vestibular Disorders case definition.
    Criteria A-D must all be met and E excludes better explanations: (A)
    non-spinning vertigo of oscillatory character, continuous or most of the
    day; (B) onset within 48 hours of the end of passive motion exposure; (C)
    temporary reduction of symptoms on re-exposure to passive motion; (D)
    duration beyond 48 hours; (E) not better accounted for by another disorder.
    Criterion C is the discriminating one - it is what separates MdDS from the
    disorders it most resembles.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "1] Non-spinning vertigo characterized by an oscillatory perception ('rocking,' 'bobbing,' or 'swaying') present continuously or for most of the day; 2] Onset occurs within 48 hours after the end of exposure to passive motion, 3] Symptoms temporarily reduce with exposure to passive motion (e.g. driving), and 4] Symptoms persist for >48 hours."
    explanation: States the four positive diagnostic criteria verbatim.
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "there are demographic and prognostic differences between the common short-term unsteadiness that happens immediately after landing and the syndrome that can last well beyond 48 hours"
    explanation: >-
      Justifies the 48-hour threshold: brief post-disembarkation unsteadiness is
      near-universal and non-pathological, so the criterion is what makes MdDS a
      disorder rather than a normal after-effect.
pathophysiology:
- name: Prolonged Passive Oscillatory Motion Exposure
  biological_scale: ORGANISM
  description: >-
    The initiating exposure: hours of passive, periodic, oscillatory motion -
    a ship, aircraft, car or train, but also a swaying building, a waterbed or
    moving exercise equipment. What matters mechanistically is the oscillatory
    or periodic character of the stimulus coupled with a minimum duration on
    the order of hours, not the mode of transport. A concurrent physical or
    psychological stressor during the exposure is commonly reported, and
    perimenstrual or perimenopausal hormonal state at the time of exposure has
    been proposed as a risk factor. Notably the triggering journey is not
    otherwise remarkable - it need not involve seasickness or illness.
  downstream:
  - target: Velocity Storage Cross-Axis Maladaptation
    description: >-
      Sustained periodic vestibular input during head movement conditions the
      central velocity-storage integrator into a maladapted configuration.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "The key features of the triggers are an oscillatory or periodic stimulus coupled with some minimal duration of exposure, generally on the order of hours."
    explanation: Identifies the mechanically relevant properties of the trigger.
- name: Velocity Storage Cross-Axis Maladaptation
  biological_scale: ORGANISM
  description: >-
    The core lesion. Velocity storage is the central vestibular integrator that
    prolongs the response to rotation well beyond the cupula's own time
    constant; roll-while-rotating conditioning maladapts the vestibulo-ocular
    reflex through it. The dependence on velocity storage is not assumed - in
    the monkey experiments the maladaptation appeared only in animals with long
    VOR time constants and not when the time constant approached the cupula's,
    which is what implicates the central integrator rather than the periphery.
    Modelled as a three-by-three dynamical system, normal upright orientation
    gives a diagonal system matrix whose yaw eigenvector aligns with gravity;
    in MdDS off-diagonal terms appear, representing cross-axis coupling and a
    misalignment between the yaw eigenvector and the head vertical, which is
    experienced as a directional pull. No GO term is bound here because none
    describes the vestibulo-ocular reflex.
  downstream:
  - target: Persistent Oscillatory Self-Motion Perception
    description: >-
      The maladapted reflex is read centrally as continuing self-motion after
      the physical motion has stopped.
  - target: Limbic-Vestibular Network Reorganization
    description: >-
      Sustained abnormal motion signalling entrains a distributed cortical and
      limbic network.
  evidence:
  - reference: PMID:25076935
    reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "This only occurred in monkeys with long VOR time constants, and was not present when the VOR time constant was close to that of the cupula"
    explanation: >-
      The observation that localizes the lesion to central velocity storage
      rather than the periphery. Graded INDIRECT because it is conditioning in
      monkeys, from which the human mechanism is inferred.
  - reference: PMID:41122084
    reference_title: Potential lesson from a model-based exploration on treatment effect heterogeneity of mal de débarquement syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "A pull sensation of MdDS has been expressed with a system matrix with off-diagonal elements representing cross-axis coupling and interpreted as a misalignment between the yaw eigenvector and the head vertical."
    explanation: >-
      Formalizes the lesion as cross-axis coupling in the velocity-storage
      matrix. INDIRECT because it is a mathematical model of the mechanism, not
      a measurement of it.
- name: Persistent Oscillatory Self-Motion Perception
  biological_scale: ORGANISM
  description: >-
    The cardinal symptom and the state that defines the disease: a continuous
    non-spinning perception of rocking, bobbing or swaying, present most or all
    of the day, persisting for months or years after a motion exposure of
    hours. Its signature behaviour is that it is transiently nulled by
    re-exposure to passive motion and rebounds when that motion stops - the
    percept behaves as though the brain has adopted a model of the world in
    which the motion is still happening.
  downstream:
  - target: Functional Impairment and Secondary Affective Burden
    description: >-
      A continuous unrelenting motion illusion drives fatigue, impaired
      concentration and secondary anxiety and depression.
  evidence:
  - reference: PMID:33746890
    reference_title: Neuroimaging Markers of Mal de Débarquement Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Symptoms are described as a “rocking,” “bobbing,” or “swaying” perception that is nulled by exposure to passive motion such as driving/riding in a car or returning to the triggering stimulus."
    explanation: States the percept and its defining nulling behaviour.
  - reference: PMID:25076935
    reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical findings included body oscillation at 0.2 Hz, oscillating vertical nystagmus when the head was rolled from side-to-side in darkness, and unilateral rotation during the Fukuda stepping test."
    explanation: >-
      The objective correlates of the subjective percept, and the only described
      examination sign of the disorder.
- name: Limbic-Vestibular Network Reorganization
  biological_scale: TISSUE
  description: >-
    Downstream of the maladapted reflex, functional imaging shows a limbic focus
    of hypermetabolism in the left entorhinal cortex and amygdala, increased
    functional connectivity from that focus to posterior visual and vestibular
    processing areas including motion-sensitive MT/V5, and reduced connectivity
    to frontal and temporal cortices. Resting-state EEG frames the same state as
    entrainment to oscillating motion, with treatment response tracking
    inter-regional alpha-band phase coherence. This is a network-level
    dysrhythmia rather than a focal lesion, which is consistent with structural
    imaging being normal.
  evidence:
  - reference: PMID:23209584
    reference_title: Metabolic and functional connectivity changes in mal de debarquement syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MdDS subjects showed increased metabolism in the left entorhinal cortex and amygdala (z>3.3)."
    explanation: The primary FDG-PET finding, in 20 patients against 20 matched controls.
  - reference: PMID:33746890
    reference_title: Neuroimaging Markers of Mal de Débarquement Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "these structures are hypermetabolic in MdDS and exhibit increased functional connectivity to posterior sensory processing areas and reduced connectivity to the frontal and temporal cortices"
    explanation: Synthesis of the connectivity pattern across imaging studies.
  - reference: PMID:30099627
    reference_title: Electrophysiological Signatures of Intrinsic Functional Connectivity Related to rTMS Treatment for Mal de Debarquement Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a motion perceptual disorder induced by entrainment to oscillating motion"
    explanation: Frames the disorder electrophysiologically as motion entrainment.
- name: Functional Impairment and Secondary Affective Burden
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Beyond the motion illusion itself, patients develop
    spatial disorientation, visual motion intolerance, chronic fatigue,
    impaired cognition, insomnia, and exacerbation of headache, anxiety and
    depression. Whether the affective symptoms are secondary to a relentless
    perceptual disturbance or share the limbic substrate is not resolved; the
    imaging studies covaried for mood and anxiety precisely because of that
    ambiguity.
  evidence:
  - reference: PMID:32364688
    reference_title: "[Mal de débarquement syndrome – “sickness of disembarkment”]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic fatigue, anxiety, and depression are frequently associated with primary symptoms."
    explanation: Documents the secondary symptom burden accompanying the core percept.

environmental:
- name: Prolonged exposure to passive oscillatory motion (sea, air, road or rail travel)
  exposure_term:
    preferred_term: exposure to passive oscillatory motion during travel
    term:
      id: ECTO:6000033
      label: exposure to travel
  notes: >-
    ECTO:6000033 `exposure to travel` is the closest available term and is
    deliberately imperfect: the mechanically relevant property is passive
    oscillatory motion of some hours' duration, not travel as such, and the
    same trigger is reported from swaying buildings, waterbeds and moving
    exercise equipment, which are not travel at all. Bound rather than left
    free-text because the overwhelming majority of triggers are journeys, with
    the mismatch recorded here rather than hidden.
  influences_mechanisms:
  - target: Velocity Storage Cross-Axis Maladaptation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure is the conditioning stimulus itself: periodic vestibular
      input sustained across head movements is what maladapts the reflex.
    evidence:
    - reference: PMID:32986636
      reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: "Onset occurs within 48 hours after the end of exposure to passive motion"
      explanation: >-
        The tight temporal coupling between exposure and onset is what makes
        this a trigger rather than an association.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Typical triggers include transportation vessels such as boats, airplanes, automobiles, and trains but can also include swaying buildings, waterbeds, exercise equipment and other platforms that passively move the individual"
    explanation: Enumerates the reported trigger exposures, including the non-travel ones.
progression:
- phase: MdDS in evolution
  notes: >-
    Symptoms ongoing but the observation period is under one month, so the
    course cannot yet be assigned. A staging designation, not a distinct
    disease.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "MdDS in evolution: symptoms are ongoing but the observation period has been less than 1 month"
    explanation: Defines the provisional staging category.
- phase: Transient MdDS
  notes: >-
    Symptoms resolve at or before one month. Diagnosable only in retrospect,
    since it is defined by remission having occurred.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Transient MdDS: symptoms resolve at or before 1 month and the observation period extends at least to the resolution point"
    explanation: Defines the remitting course.
- phase: Persistent MdDS
  notes: >-
    Symptoms beyond one month. This is the clinically burdensome form; reported
    cohorts have median durations of many months to years.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Persistent MdDS: symptoms last for more than 1 month"
    explanation: Defines the persistent course.
  - reference: PMID:23209584
    reference_title: Metabolic and functional connectivity changes in mal de debarquement syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty subjects with MdDS lasting a median duration of 17.5 months"
    explanation: Illustrates the typical duration in a persistent-MdDS research cohort.
diagnosis:
- name: Clinical diagnosis with normal vestibular and structural testing
  description: >-
    There is no confirmatory test. Vestibular function testing, audiometry and
    structural brain imaging are characteristically normal, and their normality
    is part of the diagnostic picture rather than a failure to find the lesion -
    the disorder is one of central motion perception, not of the end organ. The
    imaging abnormalities that do exist are group-level research findings, not
    clinical assays.
  evidence:
  - reference: PMID:32364688
    reference_title: "[Mal de débarquement syndrome – “sickness of disembarkment”]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found normal inner-ear function, non-related abnormalities and normal brain imaging"
    explanation: Documents the expected normal work-up in a clinical case series.
differential_diagnoses:
- name: Persistent postural-perceptual dizziness (PPPD)
  description: >-
    The closest mimic and the most important distinction. Both are chronic
    functional vestibular disorders, but the response to motion is opposite:
    MdDS symptoms transiently improve on re-exposure to passive motion, whereas
    PPPD is aggravated by motion and by complex visual environments. The
    non-motion-triggered presentation of oscillatory vertigo is where the two
    genuinely blur.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Features that distinguish MdDS from vestibular migraine, motion sickness, and persistent postural perceptual dizziness (PPPD) are reviewed."
    explanation: Establishes PPPD as a formally addressed differential in the consensus criteria.
- name: Vestibular migraine
  description: >-
    Shares the female predominance and a high rate of migraine history, and
    overlaps enough that some MdDS patients respond to migraine prophylaxis.
    Distinguished by the episodic character of vestibular migraine against the
    continuous percept of MdDS, and by the absence of the passive-motion
    trigger and nulling response.
- name: Motion sickness and visually induced motion sickness
  description: >-
    Occur during rather than after motion exposure and resolve on its cessation,
    the reverse of the MdDS temporal pattern.
treatments:
- name: Vestibulo-Ocular Reflex Readaptation (Optokinetic Roll Protocol)
  description: >-
    The one disease-specific therapy, and the clearest test of the mechanism:
    the patient rolls the head side to side while viewing a rotating full-field
    visual stimulus, driving reflex adaptation in the direction opposite to the
    maladapted components. In the original series 17 of 24 patients had complete
    or substantial recovery sustained about a year, six relapsed after initial
    benefit and one did not respond. Its rationale is not empirical - it was
    predicted from the velocity-storage account and then tested, so its success
    is itself evidence for the mechanism.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Velocity Storage Cross-Axis Maladaptation
    description: >-
      Acts directly on the proposed lesion by readapting the reflex, rather than
      on symptoms downstream of it.
  evidence:
  - reference: PMID:25076935
    reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen of the 24 subjects had a complete or substantial recovery on average for approximately 1 year."
    explanation: The primary efficacy result, in an uncontrolled series of 24 patients.
  - reference: PMID:25076935
    reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the adaptive processes associated with roll-while-rotating are responsible for pr"
    explanation: >-
      The authors' inference from treatment response back to mechanism. Graded
      INDIRECT because it reasons from a therapeutic result to the mechanism
      that therapy targets.
- name: Repetitive Transcranial Magnetic Stimulation over Left DLPFC
  description: >-
    10 Hz rTMS over the left dorsolateral prefrontal cortex, targeting the
    cortico-limbic node implicated by imaging rather than the vestibular lesion.
    A small double-blind sham-controlled crossover trial in eight women reported
    improvement in dizziness and in mood and anxiety persisting beyond the
    treatment period. Evidence is limited and the effect sizes modest; a
    scoping review of TMS across chronic vestibular disorders found
    statistically but not clinically significant improvement in most studies.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Transcranial Magnetic Stimulation
    term:
      id: NCIT:C116655
      label: Transcranial Magnetic Stimulation
  target_mechanisms:
  - target: Limbic-Vestibular Network Reorganization
    description: >-
      Targets the prefrontal node of the reorganized network rather than the
      upstream velocity-storage lesion.
  evidence:
  - reference: PMID:27176615
    reference_title: Double-Blind Sham-Controlled Crossover Trial of Repetitive Transcranial Magnetic Stimulation for Mal de Debarquement Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study provides evidence that the dizziness, mood and anxiety symptoms of MdDS can be improved with 10 Hz rTMS over left DLPFC beyond the treatment period in selected individuals"
    explanation: >-
      The controlled trial result. Note the authors' own qualifier, "in selected
      individuals" - this is eight patients, not a general indication.
- name: Intermittent Theta Burst Stimulation as an Adjunct to VOR Rehabilitation
  description: >-
    Tested as a way to augment the readaptation protocol. It did not work: in a
    randomised sham-controlled trial of 20 patients both arms improved and there
    was no between-group difference, so the benefit was attributable to the
    rehabilitation and not to the stimulation. Recorded because a negative
    controlled result is more informative here than the positive uncontrolled
    ones, and because it bounds what neuromodulation adds.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Transcranial Magnetic Stimulation
    term:
      id: NCIT:C116655
      label: Transcranial Magnetic Stimulation
  evidence:
  - reference: PMID:38345630
    reference_title: "Assessing the synergistic effectiveness of intermittent theta burst stimulation and the vestibular ocular reflex rehabilitation protocol in the treatment of Mal de Debarquement Syndrome: a randomised controlled trial."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant improvements in subjective and objective outcomes were reported across both treatment groups over time, but no between-group differences were observed."
    explanation: >-
      Refutes an additive benefit of iTBS over VOR rehabilitation alone. The
      shared improvement in both arms simultaneously supports the rehabilitation
      protocol.
- name: Vestibular Migraine Prophylaxis
  description: >-
    Given the high migraine comorbidity, an institutional vestibular-migraine
    protocol - lifestyle modification plus verapamil, nortriptyline,
    topiramate or a combination - benefited 11 of 15 patients in one series.
    Symptomatic rather than mechanism-directed, and it presupposes the migraine
    phenotype. There is no drug approved specifically for MdDS.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:27730651
    reference_title: Management of mal de debarquement syndrome as vestibular migraines.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven patients (73%) responded well to management with a vestibular migraine protocol, which included lifestyle changes, as well as pharmacotherapy with verapamil, nortriptyline, topiramate, or a combination thereof"
    explanation: The response rate to migraine prophylaxis in a 15-patient series.
animal_models:
- name: Roll-while-rotating conditioned rhesus monkey
  species: Monkey
  genotype: Wild type
  description: >-
    Not a genetic model but a conditioning paradigm, and the experiment that
    generated the whole mechanistic account. Monkeys rolled side to side while
    rotating in darkness for several hours developed vertical and horizontal
    nystagmus in addition to ocular torsion, with the vertical component
    oscillating in phase with head roll - the same maladapted reflex signature
    later found in patients. Crucially the effect appeared only in animals with
    long VOR time constants, which is what implicates central velocity storage.
  publication: PMID:25076935
  modeled_mechanisms:
  - target: Velocity Storage Cross-Axis Maladaptation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the proposed lesion by applying the proposed cause, and the
      equivalent conditioning was subsequently produced in humans in rotating-room
      experiments, which bridges the species gap.
    limitations: >-
      The model reproduces the reflex maladaptation, not the disease: conditioned
      monkeys are not reported to develop a persistent self-motion percept, and
      the perceptual and limbic components of MdDS have no counterpart here.
      What it models is the initiating vestibular lesion alone.
    readouts:
    - name: Oscillating vertical nystagmus on head roll
      target: Velocity Storage Cross-Axis Maladaptation
      direction: INCREASED
      interpretation: >-
        The oculomotor read-out of reflex maladaptation, and the same sign found
        on examination in patients.
      evidence:
      - reference: PMID:25076935
        reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "The vertical nystagmus oscillated as they rolled from side-to-side, with upward slow phases when the animals were on one side and downward slow phases on the other side."
        explanation: Reports the conditioned nystagmus measurement behind this readout.
    evidence:
    - reference: PMID:25076935
      reference_title: Readaptation of the vestibulo-ocular reflex relieves the mal de debarquement syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The alteration in the eye movements indicated that the vestibulo-ocular reflex (VOR) had been maladapted."
      explanation: >-
        Supports treating the conditioned monkey as informative for the human
        lesion. INDIRECT because the human mechanism is inferred from it.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population-based prevalence or incidence figure exists. All available
    numbers come from specialty-clinic case series, not registries or
    population data, so no rate is recorded here rather than promoting a clinic
    figure to a population estimate. Brief post-disembarkation unsteadiness
    under 48 hours is by contrast near-universal and is explicitly not this
    disorder.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Short duration symptoms lasting less than 48 hours are extremely common even among healthy young individuals"
    explanation: >-
      Establishes that the common transient phenomenon is not the disorder,
      which is why casual prevalence figures are misleading here.
discussions:
- discussion_id: mdds_non_motion_triggered_variant
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Prolonged Passive Oscillatory Motion Exposure
  - differential_diagnoses#Persistent postural-perceptual dizziness (PPPD)
  prompt: >-
    Is motion-moderated oscillatory vertigo without a motion trigger the same
    disease as motion-triggered MdDS, a variant of PPPD, or a third entity?
  rationale: >-
    The consensus criteria require onset within 48 hours of passive motion, yet
    the same committee records an otherwise indistinguishable presentation
    arising with no motion trigger - typically after another vestibular
    disorder, a medical illness, psychological stress or metabolic disturbance -
    and states that its terminology has varied because it has features of both
    MdDS and PPPD. This is not a naming quibble: the entire mechanistic account
    in this entry begins with an oscillatory conditioning stimulus, so a
    presentation without one either reaches the same velocity-storage state by
    another route or is a different disease wearing the same symptoms. The
    entry curates the motion-triggered form, which is what the criteria define,
    and does not silently extend its mechanism to the non-triggered
    presentation. Resolving this needs the phenomenological and mechanistic
    comparison the committee itself calls for.
  evidence:
  - reference: PMID:32986636
    reference_title: "Mal de débarquement syndrome diagnostic criteria: Consensus document of the Classification Committee of the Bárány Society."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Terminology for this non-motion triggered presentation has been varied as it has features of both MdDS and PPPD. Further research is needed into its phenomenological"
    explanation: >-
      The consensus committee's own statement that the boundary is unresolved
      and needs further research.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clinical_injury
- name: Neuronal loss and cortical thinning
  description: >-
    Aspartoacylase-deficient mice show cortical and cerebellar neuron depletion and cortical thinning
    that can be prevented by lowering NAA synthesis. These are model-specific findings; they do not establish
    that neuronal loss is the dominant cause of each human neurological manifestation.

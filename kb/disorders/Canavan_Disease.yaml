diagnosis:
- name: Urinary N-acetylaspartic acid testing
  description: >-
    Urine NAA by gas chromatography-mass spectrometry establishes biochemical diagnosis in a compatible
    clinical presentation. Elevation is usually much greater in typical than atypical disease. Normal
    peripheral measurements do not exclude all cases; brain MRS can clarify a strongly suggestive presentation.
  results: Elevated urinary NAA supports Canavan disease.
  evidence:
  - reference: PMID:20301412
    reference_title: Canavan Disease.
    supports: SUPPORT

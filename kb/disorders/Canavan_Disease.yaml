- name: ASPA molecular genetic testing
  description: >-
    Biallelic pathogenic or likely pathogenic ASPA variants confirm a molecular diagnosis in a compatible
    presentation. A VUS alone or paired with a pathogenic allele is not diagnostic. Sequence analysis
    may require deletion/duplication testing and targeted investigation of deep intronic structural variants,
    including the SVA_E insertion, when only one or no allele is found despite biochemical disease.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:

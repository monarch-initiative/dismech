variants:
- name: Deep intronic ASPA SVA_E insertion
  gene:
    preferred_term: ASPA
    term:
      id: hgnc:756
      label: ASPA
  variant_type: insertion
  genomic_contexts:
  - intron
  clinical_significance: PATHOGENIC
  description: >-
    Approximately 2.6-kb SVA_E insertion in intron 4 of 5 of ASPA transcript NM_000049.4. In the 2025
    series it was homozygous or in trans with another pathogenic allele. Long-read sequencing resolved
    the insertion; fibroblast RNA-seq supported a new splice acceptor, inclusion of SVA sequence, and
    transcript degradation. Population databases suggest a common pathogenic allele across ancestries,
    but this is not a disease-incidence estimate.
  evidence:
  - reference: PMID:40995055
    reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified an ∼2,600-bp SVA_E retrotransposon intronic insertion in ASPA in all 8 individuals.
    explanation: >-
      Eight affected individuals from seven families with previously incomplete molecular diagnoses carried
      the insertion.
  - reference: PMID:40995055
    reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the SVA_E insertion creates a novel splice acceptor site within intron 4 of ASPA
    explanation: Fibroblast RNA-seq from an affected individual and a parental carrier demonstrates altered splicing.
  - reference: PMID:40995055
    reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The transcript incorporating the SVA_E was only observed in CHX-treated samples, indicating that the products from this allele are targeted for degradation.
    explanation: Cycloheximide-unmasked transcript supports degradation of the aberrant RNA in fibroblasts.
mechanistic_hypotheses:
- hypothesis_group_id: naa_injury
  hypothesis_label: NAA accumulation and cellular injury
  status: EMERGING
  description: >-
    Aspa/Nat8l genetic perturbations support a causal role for excess NAA in mouse leukodystrophy and
    neuronal loss. Osmotic disequilibrium is proposed, but substrate reduction does not identify a single
    downstream injury mechanism or prove every human causal step.
  evidence:
  - reference: PMID:25712859
    reference_title: Ablating N-acetylaspartate prevents leukodystrophy in a Canavan disease model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Aspanur7/nur7 mice were entirely protected against development of leukodystrophy when their capacity to synthesize NAA was ablated by constitutive deletion of Nat8l
    explanation: Genetic substrate-reduction experiment supports a causal role for excess NAA in the mouse model.
  - reference: PMID:34011350
    reference_title: 'The natural history of Canavan disease: 23 new cases and comparison with patients from literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: high levels of NAA, as found in CD, are thought to cause a toxic imbalance of brain water homeostasis
    explanation: The clinical report discusses a proposed, incompletely resolved connection to neurological disease.
    quote_role: BACKGROUND
- hypothesis_group_id: acetate_contribution
  hypothesis_label: Acetate-dependent metabolism contributes to myelin pathology
  status: EMERGING
  description: >-
    Reduced acetate and lipid synthesis are observed in ASPA deficiency. Their contribution to injury
    remains debated: Nat8l deletion preserves or rescues myelination without restoring NAA-derived acetate.
  evidence:
  - reference: PMID:15784740
    reference_title: Defective N-acetylaspartate catabolism reduces brain acetate levels and myelin lipid synthesis in Canavan's disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: myelin lipid synthesis is significantly compromised in CD
    explanation: Mouse and human white-matter lipid data support impaired myelin lipid synthesis.
  - reference: PMID:26511242
    reference_title: N-Acetylaspartate Synthase Deficiency Corrects the Myelin Phenotype in a Canavan Disease Mouse Model But Does Not Affect Survival Time.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: acetate derived from NAA is not essential for myelin lipid synthesis
    explanation: Normal myelin composition in double-mutant mice argues against obligatory NAA-derived acetate supply.
- hypothesis_group_id: clinical_injury
  hypothesis_label: Brain injury contributes to clinical neurological impairment
  status: EMERGING
  description: >-
    White-matter and neuronal abnormalities plausibly contribute to the neurological phenotype, but cohort
    associations do not resolve the pathway for each manifestation. Edges in this group are explanatory
    hypotheses rather than experimentally established direct steps.
  evidence:
  - reference: PMID:34011350
    reference_title: 'The natural history of Canavan disease: 23 new cases and comparison with patients from literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: visual impairment is more commonly caused by white matter disease affecting the visual pathways.
    explanation: >-
      The natural-history authors link visual impairment to white-matter disease of visual pathways. This
      supports one clinical consequence; the broader group remains an explanatory hypothesis, not proof
      of each clinical edge.
experimental_models:
- name: HEK293 ASPA variant functional assay
  experimental_model_type: CELL_LINE
  description: >-
    Transient expression of ASPA-GFP variants in HEK293 cells measured catalytic activity by LC-MS/MS
    and protein expression by Western blot. This distinguishes activity from abundance, but is not a patient
    oligodendrocyte model.
  modeled_mechanisms:
  - target: Aspartoacylase enzyme deficiency
    relationship: MEASURES
    evidence:
    - reference: PMID:28101991
      reference_title: Clinically Distinct Phenotypes of Canavan Disease Correlate with Residual Aspartoacylase Enzyme Activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The majority of the studied variants presented with enzyme activities lower than 1% of the WT.
      explanation: Direct heterologous-cell activity measurements.
  evidence:
  - reference: PMID:28101991
    reference_title: Clinically Distinct Phenotypes of Canavan Disease Correlate with Residual Aspartoacylase Enzyme Activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All variants presented detectable expression of ASPA with no major differences concerning level of expression when compared to the WT
    explanation: Low activity need not imply low measured protein abundance in this assay.
- name: SVA_E carrier and patient fibroblast RNA sequencing
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    RNA sequencing with and without cycloheximide in fibroblasts from a carrier parent and an affected
    individual linked the intronic insertion to aberrant RNA and transcript loss. This does not measure
    enzyme activity in brain or establish an all-tissue expression pattern.
  modeled_mechanisms:
  - target: Aberrant ASPA splicing
    relationship: MEASURES
    evidence:

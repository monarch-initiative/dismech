      the insertion.
- name: Brain MRI with proton MR spectroscopy
  description: >-
    Typical disease shows diffuse symmetric leukodystrophy; imaging in early infancy may appear normal.
    Atypical disease may lack generalized white-matter changes and resemble a mitochondrial disorder with
    bilateral deep gray matter involvement. MRS NAA, urine biochemistry, and genetics help distinguish
    Canavan disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Brain CT or MRI performed in early infancy may be interpreted as normal
    explanation: Timing affects sensitivity of structural imaging.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/

    supports: SUPPORT
    evidence_source: OTHER
    snippet: Atypical Canavan disease may be misdiagnosed as a mitochondrial disorder given the overlapping neuroimaging features of bilateral deep gray matter involvement
    explanation: Important differential-diagnosis pitfall.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    Expert-based multidisciplinary supportive care addresses seizures, spasticity, nutrition and swallowing
    safety, mobility and contractures, communication and learning, respiratory health, and family support.
    GeneReviews reports no published disease-specific practice guideline; these recommendations reflect
    specialist experience. Nutrition, mobility and neurological review are typically repeated every three
    to six months, with respiratory and aspiration concerns assessed at each visit.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:

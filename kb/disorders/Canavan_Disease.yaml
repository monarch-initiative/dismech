      consequence; the precise intervening pathway is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clinical_injury
  - target: Nystagmus
    description: >-
      Early abnormal eye movements, including nystagmus, occur in Canavan disease. This is a proposed
      clinical consequence; the precise intervening pathway is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clinical_injury
- name: Feeding and aspiration vulnerability
  description: >-
    Severe Canavan neurologic impairment commonly affects feeding, nutrition, and oral intake safety.
    Feeding therapy is recommended to maintain weight gain and reduce aspiration risk, and natural history
    scoring treats aspiration, inadequate weight gain, or tube feeding as feeding-severity markers.
  evidence:
  - reference: PMID:20301412
    reference_title: Canavan Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: feeding therapy (to assure adequate nutrition and weight gain, minimize risk of
    explanation: GeneReviews supports feeding and aspiration-risk management as part of Canavan care.
  - reference: PMID:34011350
    reference_title: 'The natural history of Canavan disease: 23 new cases and comparison with patients from literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Feeding: Score 1 if oral feeding is possible but aspiration occurs and/or weight gain is insufficient'

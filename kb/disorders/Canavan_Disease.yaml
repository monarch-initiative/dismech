pathophysiology:
- name: Deep intronic ASPA SVA_E insertion
  description: >-
    Approximately 2.6-kb SVA_E insertion in intron 4 of 5 of ASPA transcript NM_000049.4. In the 2025
    series it was homozygous or in trans with another pathogenic allele. Long-read sequencing resolved
    the insertion; fibroblast RNA-seq supported a new splice acceptor, inclusion of SVA sequence, and
    transcript degradation. Population databases suggest a common pathogenic allele across ancestries,
    but this is not a disease-incidence estimate.
  genes:
  - preferred_term: ASPA
    term:
      id: hgnc:756
      label: ASPA
  genetic_context:
    gene:
      preferred_term: ASPA
      term:
        id: hgnc:756
        label: ASPA
    variant_type: insertion
    genomic_contexts:
    - intron
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:40995055
    reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified an ∼2,600-bp SVA_E retrotransposon intronic insertion in ASPA in all 8 individuals.
    explanation: >-
      Eight affected individuals from seven families with previously incomplete molecular diagnoses carried
      the insertion.
  downstream:
  - target: Aberrant ASPA splicing
    description: The inserted SVA sequence creates a novel splice acceptor.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40995055

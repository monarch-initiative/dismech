      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the SVA_E insertion creates a novel splice acceptor site within intron 4 of ASPA
      explanation: Fibroblast RNA-seq from an affected individual and a parental carrier demonstrates altered splicing.
- name: Aberrant ASPA splicing
  description: >-

- name: Visual pathway and ocular involvement
  description: >-
    Cerebral visual impairment is often attributed to white-matter visual pathway involvement. Optic atrophy
    can occur but is not required for impaired tracking or blindness; retinal findings remain separate
    clinical observations with uncertain causal placement.
  evidence:
  - reference: PMID:34011350
    reference_title: 'The natural history of Canavan disease: 23 new cases and comparison with patients from literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: visual impairment is more commonly caused by white matter disease affecting the visual pathways.
    explanation: Natural history authors connect visual impairment in Canavan disease to white-matter visual pathway disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Early in life there is a decreased ability to fix and follow, most commonly due to cerebral visual impairment
    explanation: Supports cerebral visual impairment rather than assuming optic atrophy.
  downstream:
  - target: Visual impairment
    description: White-matter involvement of visual pathways produces impaired visual function.
    causal_link_type: DIRECT
  - target: Blindness
    description: >-
      Severe visual pathway and ocular involvement can manifest as blindness. This is a proposed clinical
      consequence; the precise intervening pathway is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clinical_injury
  - target: Abnormality of visual evoked potentials
    description: >-

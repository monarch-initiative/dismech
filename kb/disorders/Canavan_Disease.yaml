progression:
- phase: Typical infantile Canavan disease
  age_range: Infancy
  notes: >-
    Typical disease presents after early normal appearance, with hypotonia, head lag, macrocephaly, neurodevelopmental
    impairment by three to five months, followed by neurodegeneration, developmental regression, increasing
    feeding problems, seizures, and reduced survival. GeneReviews estimates that typical disease accounts
    for 85%-90% of affected individuals. Axial hypotonia and limb hypertonia can coexist; tone does not
    necessarily change in a strictly sequential fashion.
  evidence:
  - reference: PMID:20301412
    reference_title: Canavan Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: neurodevelopmental impairment evident by ages three to five months
    explanation: GeneReviews describes the typical early-infantile onset window.
  - reference: PMID:34011350
    reference_title: 'The natural history of Canavan disease: 23 new cases and comparison with patients from literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Onset of symptoms was between 0 and 6 months.
    explanation: Natural history cohort supports early infantile symptom onset.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phenotypic spectrum ranges from the more severe typical Canavan disease (85%-90% of individuals) to the less severe atypical Canavan disease (10%-15%).
    explanation: Clinical spectrum proportions are expert synthesis, not a population prevalence estimate.
- phase: Atypical milder Canavan disease
  age_range: Infancy to childhood or adolescence
  notes: >-
    Atypical disease represents approximately 10%-15% of affected individuals, with variable onset from
    infancy to childhood or adolescence, milder developmental delay, sometimes normal head size, ataxia,
    and possible later regression. Some individuals walk and attend school; survival into adulthood occurs
    and lifespan is incompletely described.
  evidence:
  - reference: PMID:20301412
    reference_title: Canavan Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: atypical Canavan disease is more variable
    explanation: GeneReviews describes atypical Canavan disease as a variable milder spectrum.
  - reference: PMID:28101991
    reference_title: Clinically Distinct Phenotypes of Canavan Disease Correlate with Residual Aspartoacylase Enzyme Activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutations found in the mild patients corresponded to the variants with the highest residual enzyme activities
    explanation: Residual ASPA activity supports the milder phenotypic spectrum.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The life span is not well-described; however, individuals with atypical Canavan disease may survive to adulthood.
    explanation: Avoids extrapolating the severe infantile prognosis to all atypical individuals.
- phase: Longitudinal survival in historical clinical cohorts
  notes: >-
    Kaplan-Meier analysis pooling 23 study patients with 59 literature patients estimated 73% survival
    to age ten years. This is an ascertainment-dependent cohort estimate, not a prediction for an individual
    or a result of current gene therapy.
  evidence:

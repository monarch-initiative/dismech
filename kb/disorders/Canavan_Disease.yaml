notes: >-
  NAA-associated injury and acetate-dependent metabolic hypotheses remain incompletely resolved. Clinical
  findings span typical and atypical disease, and source-specific Orphanet frequency bands sometimes conflict
  with longitudinal cohort evidence. Gene replacement and NAT8L suppression remain investigational; biochemical
  target engagement is not equivalent to established functional or survival benefit.

- name: NAT8L/NAA-lowering strategy
  description: >-
    Partial inhibition of NAT8L-mediated NAA synthesis is a preclinical substrate-reduction approach.
    Genetic deletion and neonatal AAV-shRNA experiments rescued aspects of Aspa-deficient mouse pathology.
    Complete NAA ablation rescued myelin pathology but did not prolong survival in one double-mutant model,
    whereas partial reduction improved survival; these results caution against assuming maximal suppression
    is optimal. Human clinical benefit is unestablished.
  target_mechanisms:
  - target: NAA accumulation in CNS and body fluids
    treatment_effect: INHIBITS
    description: Reducing neuronal NAA synthesis lowers substrate accumulation upstream of spongiform leukodystrophy.
    evidence:
    - reference: PMID:29456021
      reference_title: Brain Nat8l Knockdown Suppresses Spongiform Leukodystrophy in an Aspartoacylase-Deficient Canavan Disease Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: suppresses development of spongiform leukodystrophy
      explanation: AAV-shRNA Nat8l knockdown lowered brain NAA and suppressed leukodystrophy in mice.
  evidence:
  - reference: PMID:28077719
    reference_title: Suppressing N-Acetyl-l-Aspartate Synthesis Prevents Loss of Neurons in a Murine Model of Canavan Leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: prevents neuron loss and cerebral cortical atrophy
    explanation: Model study supports NAA synthesis suppression as a neuroprotective strategy.
  - reference: PMID:26511242
    reference_title: N-Acetylaspartate Synthase Deficiency Corrects the Myelin Phenotype in a Canavan Disease Mouse Model But Does Not Affect Survival Time.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: although pathology was fully reversed, the survival time of the mice was not prolonged.
    explanation: Complete Nat8l deletion did not confer a survival advantage in this model.

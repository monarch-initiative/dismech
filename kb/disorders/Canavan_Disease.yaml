animal_models:
- name: Aspa nur7 mice with Nat8l gene-dose reduction
  species: Mus musculus
  genotype: Aspa nur7/nur7 with Nat8l +/+, +/-, or -/-
  description: >-
    Aspa-deficient mice with partial or complete Nat8l loss separate substrate accumulation from acetate
    deprivation. Complete loss rescued myelin pathology but not survival in the Maier study; partial loss
    improved survival. Outcomes depend on genotype, background, and endpoint and do not establish human
    treatment efficacy.
  modeled_mechanisms:
  - target: Spongiform white-matter vacuolation
    relationship: RESCUES
    evidence:
    - reference: PMID:26511242
      reference_title: N-Acetylaspartate Synthase Deficiency Corrects the Myelin Phenotype in a Canavan Disease Mouse Model But Does Not Affect Survival Time.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: full reversal of spongy myelin and axonal degeneration
      explanation: Complete Nat8l deletion rescued tissue pathology.
  - target: NAA accumulation in CNS and body fluids
    relationship: PERTURBS
    evidence:
    - reference: PMID:26511242
      reference_title: N-Acetylaspartate Synthase Deficiency Corrects the Myelin Phenotype in a Canavan Disease Mouse Model But Does Not Affect Survival Time.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These mice have no detectable NAA.
      explanation: Double-mutant substrate ablation.
  evidence:
  - reference: PMID:26511242
    reference_title: N-Acetylaspartate Synthase Deficiency Corrects the Myelin Phenotype in a Canavan Disease Mouse Model But Does Not Affect Survival Time.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: although pathology was fully reversed, the survival time of the mice was not prolonged.
    explanation: Important endpoint dissociation.
  - reference: PMID:25712859
    reference_title: Ablating N-acetylaspartate prevents leukodystrophy in a Canavan disease model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: permits normal CNS myelination and prevents leukodystrophy in a murine Canavan disease model.
    explanation: Independent genetic experiment supports the tissue rescue.
- name: TALEN-generated Aspa knockout rat
  species: Rattus norvegicus
  genotype: Aspa knockout
  description: >-
    The engineered rat showed CNS vacuolation, hypomyelination, swollen axons and astrocyte activation,
    particularly in brainstem and motor pathways. No overt neurological signs or quantitative neuron loss
    were found in the studied animals. CNS NAA was not measured in this study; histological similarity
    does not establish a full clinical phenocopy.
  modeled_mechanisms:
  - target: Spongiform white-matter vacuolation
    relationship: PARTIALLY_RECAPITULATES
    evidence:
    - reference: PMID:38538326
      reference_title: Myelin lesion in the aspartoacylase (Aspa) knockout rat, an animal model for Canavan disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: vacuolation with swollen axons, hypomyelination, and activated swollen astrocytes were observed mainly in the brainstem reticular formation
      explanation: Rat histopathology reproduces selected white-matter lesions.
  - target: Neuronal loss and cortical thinning
    relationship: FAILS_TO_RECAPITULATE
    limitations: Morphometry found no obvious neuron-number change in the sampled regions; this does not exclude subtle functional deficits.
    evidence:
    - reference: PMID:38538326
      reference_title: Myelin lesion in the aspartoacylase (Aspa) knockout rat, an animal model for Canavan disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Morphometrical analysis revealed no obvious change in the number of neurons.
      explanation: Neuronal-number findings differ from the mouse neuronal-loss model.
  evidence:
  - reference: PMID:38538326
    reference_title: Myelin lesion in the aspartoacylase (Aspa) knockout rat, an animal model for Canavan disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: vacuolation with swollen axons, hypomyelination, and activated swollen astrocytes were observed mainly in the brainstem reticular formation
    explanation: Rat histopathology reproduces selected white-matter lesions.
  - reference: PMID:38538326
    reference_title: Myelin lesion in the aspartoacylase (Aspa) knockout rat, an animal model for Canavan disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Morphometrical analysis revealed no obvious change in the number of neurons.
    explanation: Neuronal-number findings differ from the mouse neuronal-loss model.
  - reference: PMID:38538326
    reference_title: Myelin lesion in the aspartoacylase (Aspa) knockout rat, an animal model for Canavan disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: None of the Aspa-knockout rats showed any neurological signs.
    explanation: Major clinical limitation of this model.
has_subtypes:
- name: Typical infantile Canavan disease
  description: >-
    The more severe infantile presentation, accounting for approximately 85%-90% in GeneReviews. Early
    developmental impairment, hypotonia and macrocephaly precede progressive disability.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phenotypic spectrum ranges from the more severe typical Canavan disease (85%-90% of individuals) to the less severe atypical Canavan disease (10%-15%).
    explanation: Clinical spectrum proportions are expert synthesis, not a population prevalence estimate.
- name: Atypical Canavan disease
  description: >-
    The less severe and variable presentation, approximately 10%-15% in GeneReviews, with later or milder
    manifestations, sometimes preserved walking and speech, and possible later regression.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phenotypic spectrum ranges from the more severe typical Canavan disease (85%-90% of individuals) to the less severe atypical Canavan disease (10%-15%).
    explanation: Clinical spectrum proportions are expert synthesis, not a population prevalence estimate.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1234/
    reference_title: Canavan Disease - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The life span is not well-described; however, individuals with atypical Canavan disease may survive to adulthood.
    explanation: Avoids extrapolating the severe infantile prognosis to all atypical individuals.

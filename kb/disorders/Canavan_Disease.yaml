      explanation: Fibroblast RNA-seq from an affected individual and a parental carrier demonstrates altered splicing.
  - target: Degradation of aberrant ASPA transcripts
    relationship: MEASURES
    evidence:
    - reference: PMID:40995055
      reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The transcript incorporating the SVA_E was only observed in CHX-treated samples, indicating that the products from this allele are targeted for degradation.
      explanation: Cycloheximide-unmasked transcript supports degradation of the aberrant RNA in fibroblasts.
  evidence:
  - reference: PMID:40995055
    reference_title: 'Deep Intronic SVA_E Insertion Identified as the Most Common Pathogenic Variant Associated With Canavan Disease: A Diagnostic Blind Spot.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the SVA_E insertion creates a novel splice acceptor site within intron 4 of ASPA

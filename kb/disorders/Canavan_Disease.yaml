name: Canavan disease
category: Mendelian
creation_date: '2026-05-03T17:22:49Z'
synonyms:
- ACY2 deficiency
- Aminoacylase 2 deficiency
- Aspartoacylase deficiency
- Spongy degeneration of the brain
description: >-
  Canavan disease is an autosomal recessive leukodystrophy caused by biallelic pathogenic ASPA variants
  and deficient aspartoacylase activity. Impaired N-acetyl-L-aspartate (NAA) hydrolysis causes substrate
  accumulation and spongiform white-matter disease. The spectrum includes typical infantile disease with
  profound developmental impairment, macrocephaly, early hypotonia, later spasticity, visual and feeding
  problems, and increasingly prevalent seizures, and less common atypical disease with milder or later
  manifestations. The contribution of NAA toxicity, altered water homeostasis, and deficient acetate-dependent
  metabolism remains incompletely resolved.

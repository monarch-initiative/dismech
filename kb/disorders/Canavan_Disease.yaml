- name: Oligodendrocyte maturation and myelination defect
  conforms_to: cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death
  description: >-
    ASPA-deficient mice show altered oligodendrocyte maturation, reduced myelin proteins, noncompact myelin,
    increased histone acetylation, and oligodendrocyte apoptosis during early postnatal development. These
    model findings establish cellular abnormalities but do not establish that histone acetylation or acetate
    shortage alone causes the human disease. In a separate nur7 study, oxidative stress preceded oligodendrocyte
    loss; ASPA overexpression partially rescued ATP under glucose deprivation in primary mouse oligodendrocytes,
    supporting a possible energetic contribution.

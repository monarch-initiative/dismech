    supports: SUPPORT
    evidence_source: OTHER
    snippet: the following recommendations are based on the authors' personal experience managing individuals with this disorder.
    explanation: Distinguishes expert management from a formal practice guideline.
- name: ASPA gene replacement therapy
  description: >-
    ASPA gene replacement remains investigational. A 2023 expanded-access AAV9 case and a 2025 open-label
    rAAV-Olig001-ASPA trial support biological activity. The latter interim report included eight children
    with typical disease and found lower CSF NAA, increased myelin volume, and improved MSEL developmental
    scores against natural-history data. Gross-motor GMFM-88 slopes were not statistically significant.
    All participants had adverse events; seven had serious events, none attributed to the vector product,
    although procedure-related seizures and CSF leakage occurred. Small size, open-label design, historical
    comparisons, missing follow-up, and exclusion of atypical cases limit efficacy and durability conclusions.
    The AAV9 case corresponds to single-patient expanded access NCT05317780, listed by the registry as
    no longer available on 2026-10-04.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Aspartoacylase enzyme deficiency
    treatment_effect: RESTORES
    description: AAV-ASPA strategies provide a functional ASPA transgene to restore enzyme activity.
    evidence:

biochemical:
- name: Serum formate
  presence: INCREASED
  loinc_term:
    id: LOINC:2292-1
    label: Formate [Mass/volume] in Serum or Plasma
  notes: >-
    Elevated serum formate is the proximate toxin and correlates with acidosis
    and outcome better than the methanol level. LOINC:2292-1 is the
    method-less, specimen-generic code (Serum or Plasma).
  evidence:
  - reference: PMID:11172179
    reference_title: "Fomepizole for the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma formic acid concentrations were detectable in eight patients, and these concentrations were closely correlated with the initial arterial pH values (r=0.92, P<0.001)."
    explanation: Supports serum formate correlating closely with the acidosis (arterial pH).
- name: Anion gap
  presence: INCREASED
  loinc_term:
    id: LOINC:33037-3
    label: Anion gap in Serum or Plasma by calculation
  notes: >-
    A high anion gap reflects accumulation of formate and lactate. No
    method-less anion gap code was found: every result carries a "by
    calculation" or "by Calculated.NIons" qualifier, because the gap is
    inherently a derived value rather than a directly measured analyte.
    LOINC:33037-3 is the generic Serum or Plasma calculation variant, chosen
    over the 3-ion/4-ion formula-specific codes.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of metabolic acidosis associated with an increased anion gap and increased osmol gap are important laboratory findings."
    explanation: Supports the increased anion gap as an important laboratory finding.
- name: Osmolar gap
  presence: INCREASED
  loinc_term:
    id: LOINC:33264-3
    label: Osmol gap of Serum or Plasma
  notes: >-
    An elevated osmolar gap is an early clue while methanol is unmetabolized; it
    falls as methanol is converted to formate and the anion gap rises.
    LOINC:33264-3 is the method-less, Serum-or-Plasma code.
  evidence:
  - reference: PMID:27180631
    reference_title: "Approach to the Treatment of Methanol Intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "increases in serum osmolal and anion gaps can be clues to its presence."
    explanation: Supports the osmolal and anion gaps as diagnostic clues.
- name: Serum bicarbonate
  presence: DECREASED
  loinc_term:
    id: LOINC:1963-8
    label: Bicarbonate [Moles/volume] in Serum or Plasma
  notes: >-
    Serum bicarbonate falls with the metabolic acidosis. LOINC:1963-8 is the
    method-less, Serum-or-Plasma code matching this marker's own name
    exactly. Many clinical chemistry panels instead report this analyte as
    "Carbon dioxide, total" (LOINC:2028-9), since total CO2 approximates
    bicarbonate concentration at physiological pH; that code is not bound
    here as a second loinc_term because the slot is single-valued, but is
    recorded for a reader comparing a result reported under either name.
  evidence:
  - reference: PMID:38627622
    reference_title: "Clinical presentation and management of methanol poisoning outbreaks in Riyadh, Saudi Arabia: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCO3 concentration had a mean of 15 mmol/l in the mild group, 9 mmol/l in
      the moderate group, and 14 mmol/l in the severe group.
    explanation: >-
      Outbreak laboratory data document depressed bicarbonate concentrations
      across mild, moderate, and severe methanol poisoning groups.
genetic:
- name: ALDH2
  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  relationship_type: SUSCEPTIBILITY
  association: Genetic susceptibility modifier of methanol poisoning outcome
  notes: >-
    Mitochondrial aldehyde dehydrogenase 2 (ALDH2) oxidizes formaldehyde toward
    formate; the reduced-activity ALDH2 minor (C, ALDH2*2-associated) allele is
    over-represented among methanol-poisoned patients and is a candidate modifier
    of susceptibility and outcome, whereas ADH1B variation was not associated.
  evidence:
  - reference: PMID:29968299
    reference_title: "Aldehyde dehydrogenase 2 polymorphism affects the outcome of methanol poisoning in exposed humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minor C allele carriers of the ALDH2 were significantly more common among methanol-poisoned persons (46%) than among patients with alcoholic liver cirrhosis or healthy controls (31% in both groups, P < 0.05 and 0.025, respectively)"
    explanation: Supports the ALDH2 minor allele as a susceptibility modifier over-represented in methanol-poisoned patients.

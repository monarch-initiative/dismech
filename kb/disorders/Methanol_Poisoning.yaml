name: Methanol Poisoning
creation_date: "2026-07-10T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Toxic Alcohol Poisoning
- Environmental Health Disorder
synonyms:
- methyl alcohol poisoning
- wood alcohol poisoning
- methanol toxicity
description: >-
  Methanol poisoning is a toxic condition caused by ingestion, inhalation, or
  dermal absorption of methanol (methyl alcohol, wood alcohol), most often from
  drinking methanol-adulterated or illicitly distilled alcoholic beverages, or
  from windshield washer fluid, antifreeze, and industrial solvents. Methanol
  itself causes only mild inebriation, but hepatic alcohol dehydrogenase oxidizes
  it to formaldehyde and then to formic acid (formate), the toxic metabolite
  responsible for the disease. Formate inhibits mitochondrial cytochrome c
  oxidase, producing histotoxic hypoxia and a severe high-anion-gap metabolic
  acidosis, and is directly toxic to the optic nerve and retina and to the basal
  ganglia. After a characteristic latent period of hours, patients develop visual
  disturbances that can progress to permanent blindness, metabolic acidosis,
  putaminal necrosis with parkinsonism, coma, and death. Treatment blocks
  metabolism with the alcohol dehydrogenase inhibitor fomepizole (or ethanol),
  enhances formate clearance with folinic acid, corrects the acidosis, and
  removes methanol and formate with hemodialysis.

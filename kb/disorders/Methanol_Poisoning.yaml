      explanation: Links progressive optic and retinal toxicity to complete blindness.
  - target: Optic atrophy
    causal_link_type: DIRECT
    description: Axonal degeneration of retinal ganglion cells and the optic nerve resolves into chronic optic atrophy.
    evidence:
    - reference: PMID:21192754
      reference_title: "Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Formic acid is implicated in the optic nerve damage associated with methanol."
      explanation: Links formate-mediated optic nerve damage to optic atrophy.
  evidence:
  - reference: PMID:21192754
    reference_title: "Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Formic acid is implicated in the optic nerve damage associated with methanol."
    explanation: Supports formate as the cause of optic nerve damage in methanol poisoning.
- name: Basal ganglia injury
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Selective Deep Grey Matter and Myocardial Necrosis"
  biological_scale: TISSUE
  description: >-
    Formate toxicity and energy failure produce bilateral putaminal necrosis, at

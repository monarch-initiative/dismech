  - reference: PMID:27180631
    reference_title: "Approach to the Treatment of Methanol Intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "increases in serum osmolal and anion gaps can be clues to its presence."
    explanation: Supports the osmolal and anion gaps as diagnostic clues.
- name: Serum bicarbonate
  presence: DECREASED
  notes: >-

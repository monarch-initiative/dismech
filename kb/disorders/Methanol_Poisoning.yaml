genetic:
- name: ALDH2
  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  relationship_type: SUSCEPTIBILITY
  association: Genetic susceptibility modifier of methanol poisoning outcome
  notes: >-
    Mitochondrial aldehyde dehydrogenase 2 (ALDH2) oxidizes formaldehyde toward
    formate; the reduced-activity ALDH2 minor (C, ALDH2*2-associated) allele is
    over-represented among methanol-poisoned patients and is a candidate modifier
    of susceptibility and outcome, whereas ADH1B variation was not associated.
  evidence:
  - reference: PMID:29968299
    reference_title: "Aldehyde dehydrogenase 2 polymorphism affects the outcome of methanol poisoning in exposed humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minor C allele carriers of the ALDH2 were significantly more common among methanol-poisoned persons (46%) than among patients with alcoholic liver cirrhosis or healthy controls (31% in both groups, P < 0.05 and 0.025, respectively)"
    explanation: Supports the ALDH2 minor allele as a susceptibility modifier over-represented in methanol-poisoned patients.

    reference_title: "Importance of Susceptibility-weighted-imaging in Methanol Toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Susceptibility-weighted-imaging (SWI) showed marked bilateral basal ganglia and brainstem haemorrhage."
    explanation: >-
      Demonstrates brain MRI with SWI detecting bilateral basal ganglia and
      brainstem hemorrhage in acute methanol toxicity.
- name: Ophthalmologic Examination
  description: >-
    Dilated funduscopy and visual function assessment detect acute optic disc
    hyperemia or edema, visual field loss, and chronic optic nerve atrophy.
  diagnosis_term:
    preferred_term: Ophthalmoscopy and visual assessment
    term:
      id: NCIT:C120698
      label: Ophthalmoscopy
  evidence:
  - reference: PMID:38627622
    reference_title: "Clinical presentation and management of methanol poisoning outbreaks in Riyadh, Saudi Arabia: a retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vision impairment was the most common sequalae of methanol poisoning (7 out of 12 patients who were assessed by ophthalmologist, 58%)."
    explanation: >-
      Documents specialist ophthalmologic assessment identifying visual
      impairment in the majority of evaluated outbreak survivors.
discussions:
- discussion_id: gap_methanol_folate_efficacy
  prompt: >-
    How much clinical benefit does folate/folinic-acid therapy add for enhancing
    formate clearance in human methanol poisoning?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Folinic acid
  - pathophysiology#Formate accumulation
  rationale: >-
    The rationale for folinic acid is mechanistically sound (folate-dependent
    10-formyltetrahydrofolate dehydrogenase is the only human pathway that clears
    formate), and it is recommended adjunctively, but the human clinical evidence
    that it improves outcomes is largely experimental and observational rather
    than from controlled trials.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Experimental data suggests that administration of folic acid may be of benefit by hastening the metabolism of formic acid to carbon dioxide."
    explanation: Indicates the folate-benefit evidence is experimental, motivating the open question about clinical efficacy.

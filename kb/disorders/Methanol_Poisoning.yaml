treatments:
- name: Fomepizole
  description: >-
    Fomepizole (4-methylpyrazole) is a competitive inhibitor of alcohol
    dehydrogenase that blocks conversion of methanol to formate, halting toxin
    production; it is the preferred antidote.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fomepizole
      term:
        id: CHEBI:5141
        label: fomepizole
  target_mechanisms:
  - target: Alcohol dehydrogenase oxidation to formaldehyde
    treatment_effect: INHIBITS
    description: Fomepizole competitively inhibits alcohol dehydrogenase, blocking formate production.
  evidence:
  - reference: PMID:11172179
    reference_title: "Fomepizole for the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In response to fomepizole, plasma formic acid concentrations fell and metabolic abnormalities resolved in all patients."
    explanation: Trial evidence that fomepizole lowers formate and resolves the metabolic abnormalities.
- name: Ethanol
  description: >-
    Ethanol competes with methanol for alcohol dehydrogenase and can be used to
    block methanol metabolism when fomepizole is unavailable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethanol
      term:
        id: CHEBI:16236
        label: ethanol
  target_mechanisms:
  - target: Alcohol dehydrogenase oxidation to formaldehyde
    treatment_effect: INHIBITS
    description: Ethanol competitively occupies alcohol dehydrogenase, slowing methanol oxidation.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "administration of enteral or parenteral ethanol to competitively inhibit the metabolic breakdown of methanol to formic acid."
    explanation: Supports ethanol competitively inhibiting methanol metabolism to formic acid.
- name: Folinic acid
  description: >-
    Folinic acid (or folic acid) accelerates the folate-dependent oxidation of
    formate to carbon dioxide by 10-formyltetrahydrofolate dehydrogenase
    (ALDH1L1/FDH), enhancing clearance of the toxic metabolite.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:63606
        label: (6S)-5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Formate accumulation
    treatment_effect: INHIBITS
    description: Folinic acid enhances folate-dependent formate metabolism to carbon dioxide.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "administration of folic acid may be of benefit by hastening the metabolism of formic acid to carbon dioxide."
    explanation: Supports folate-based therapy hastening formate metabolism to carbon dioxide.
- name: Hemodialysis
  description: >-
    Hemodialysis removes methanol and formate and corrects the metabolic
    acidosis, and is used in severe poisoning with acidosis, visual symptoms, or
    high methanol concentrations.
  treatment_term:
    preferred_term: hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Formate accumulation
    treatment_effect: INHIBITS
    description: Dialysis directly removes formate and methanol from the blood.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hemodialysis accelerates the elimination of both methanol and formic acid and also assists in correction of the metabolic acidosis."
    explanation: Supports hemodialysis removing methanol and formate and correcting acidosis.
- name: Sodium bicarbonate
  description: >-
    Intravenous sodium bicarbonate corrects the metabolic acidosis and, by
    raising pH, shifts formate toward its ionized form that penetrates tissues
    less readily.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  target_mechanisms:
  - target: High anion gap metabolic acidosis
    treatment_effect: INHIBITS
    description: Bicarbonate buffers the metabolic acidosis and reduces membrane-permeant formic acid.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "correction of the metabolic acidosis with sodium bicarbonate"
    explanation: Supports sodium bicarbonate correcting the metabolic acidosis.
discussions:
- discussion_id: gap_methanol_folate_efficacy
  prompt: >-
    How much clinical benefit does folate/folinic-acid therapy add for enhancing
    formate clearance in human methanol poisoning?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Folinic acid
  - pathophysiology#Formate accumulation
  rationale: >-
    The rationale for folinic acid is mechanistically sound (folate-dependent
    10-formyltetrahydrofolate dehydrogenase is the only human pathway that clears
    formate), and it is recommended adjunctively, but the human clinical evidence
    that it improves outcomes is largely experimental and observational rather
    than from controlled trials.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Experimental data suggests that administration of folic acid may be of benefit by hastening the metabolism of formic acid to carbon dioxide."
    explanation: Indicates the folate-benefit evidence is experimental, motivating the open question about clinical efficacy.

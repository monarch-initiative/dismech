      reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "visualfunction becomes impaired, ranging from blurred vision and altered visual fields to complete blindness."
      explanation: Links formate ocular injury directly to blurred vision and visual field impairment.
  - target: Blindness
    causal_link_type: DIRECT
    description: Unchecked formate toxicity in the retina and optic nerve progresses to irreversible blindness.
    evidence:
    - reference: PMID:12216995
      reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
      supports: SUPPORT

biochemical:
- name: Serum formate
  presence: INCREASED
  notes: >-
    Elevated serum formate is the proximate toxin and correlates with acidosis
    and outcome better than the methanol level.
  evidence:
  - reference: PMID:11172179
    reference_title: "Fomepizole for the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma formic acid concentrations were detectable in eight patients, and these concentrations were closely correlated with the initial arterial pH values (r=0.92, P<0.001)."
    explanation: Supports serum formate correlating closely with the acidosis (arterial pH).
- name: Anion gap
  presence: INCREASED
  notes: >-
    A high anion gap reflects accumulation of formate and lactate.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of metabolic acidosis associated with an increased anion gap and increased osmol gap are important laboratory findings."
    explanation: Supports the increased anion gap as an important laboratory finding.
- name: Osmolar gap
  presence: INCREASED
  notes: >-
    An elevated osmolar gap is an early clue while methanol is unmetabolized; it
    falls as methanol is converted to formate and the anion gap rises.

definitions:
- name: Clinical case definition for methanol poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Methanol poisoning is a toxic syndrome in which methanol is metabolized to
    formic acid, producing a high-anion-gap metabolic acidosis and ocular and
    basal-ganglia injury in a compatible exposure context.
  scope: Disease-level clinical framing across the latent period and toxic phase
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While methanol itself may be harmless, it is converted in vivo to the highly toxic formic acid."
    explanation: Supports the core framing that toxicity arises from metabolic conversion of methanol to formic acid.
parents:
- toxic alcohol poisoning
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Methanol poisoning is uncommon and typically occurs in outbreaks from
    methanol-adulterated or illicitly distilled beverages, alongside sporadic
    accidental and intentional exposures.
  evidence:
  - reference: PMID:1469176
    reference_title: "Methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Methanol ingestion is an uncommon form of poisoning that can cause severe metabolic disturbances, blindness, permanent neurologic dysfunction and death."
    explanation: Supports the rarity and severity of methanol poisoning.
pathophysiology:
- name: Methanol ingestion and absorption
  description: >-
    Methanol is rapidly absorbed from the gastrointestinal tract, with peak
    concentrations within 30-60 minutes, and distributed in body water. Methanol
    itself is only mildly intoxicating; toxicity requires its metabolism to
    formic acid.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Alcohol dehydrogenase oxidation to formaldehyde
    description: Absorbed methanol is oxidized by hepatic alcohol dehydrogenase.
  - target: Central nervous system depression
    description: Methanol itself produces mild central nervous system depression before metabolism.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The absorption of methanol following oral administration is rapid and peak methanol concentrations occur within 30-60minutes."
    explanation: Supports rapid gastrointestinal absorption of ingested methanol.
- name: Alcohol dehydrogenase oxidation to formaldehyde
  description: >-
    Hepatic alcohol dehydrogenase (ADH) oxidizes methanol to formaldehyde. This
    is the rate-limiting step and the target of antidotal therapy with fomepizole
    and ethanol.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: methanol oxidation
    modifier: INCREASED
    term:
      id: GO:0015946
      label: methanol oxidation
  downstream:
  - target: Aldehyde dehydrogenase oxidation to formate
    description: Formaldehyde is rapidly oxidized to formate.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Methanol is oxidized by alcohol dehydrogenase to formaldehyde."
    explanation: Directly supports alcohol dehydrogenase oxidation of methanol to formaldehyde.
- name: Aldehyde dehydrogenase oxidation to formate
  description: >-
    Formaldehyde is very rapidly oxidized by aldehyde/formaldehyde dehydrogenase
    to formic acid (formate); because this step is fast, formaldehyde does not
    accumulate.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: formaldehyde metabolic process
    modifier: INCREASED
    term:
      id: GO:0046292
      label: formaldehyde metabolic process
  downstream:
  - target: Formate accumulation
    description: Formate is produced faster than it is eliminated and accumulates.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The oxidation of formaldehyde to formic acid is facilitated by formaldehyde dehydrogenase."
    explanation: Supports oxidation of formaldehyde to formic acid.
- name: Formate accumulation
  description: >-
    Formate is eliminated slowly because its folate-dependent conversion to
    carbon dioxide by 10-formyltetrahydrofolate dehydrogenase (ALDH1L1/FDH) is
    rate-limited and saturable in humans, so it accumulates and is the proximate
    toxin responsible for the metabolic, ocular, and neurological injury. This
    slow, folate-dependent clearance is the rationale for folinic-acid rescue.
  biological_processes:
  - preferred_term: formate metabolic process
    modifier: INCREASED
    term:
      id: GO:0015942
      label: formate metabolic process
  downstream:
  - target: Cytochrome c oxidase inhibition by formate
    description: Accumulated formate inhibits mitochondrial cytochrome c oxidase.
  - target: High anion gap metabolic acidosis
    description: Accumulated formate is a major unmeasured anion contributing to the acidosis.
  - target: Retinal and optic nerve toxicity
    description: Formate is directly toxic to the retina and optic nerve.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In cases of methanol poisoning, formic acid accumulates and there is a direct correlation between the formic acid concentration and increased morbidity and mortality."
    explanation: Supports formate accumulation and its correlation with morbidity and mortality.
- name: Cytochrome c oxidase inhibition by formate
  description: >-
    Formate binds and inhibits mitochondrial cytochrome c oxidase (Complex IV),
    impairing oxidative phosphorylation and producing histotoxic (cellular)
    hypoxia independent of oxygen delivery, and is the prime cause of the ocular
    toxicity.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
  downstream:
  - target: Cellular energy failure
    description: Impaired oxidative phosphorylation forces anaerobic metabolism and lactate production.
  - target: Oxidative stress and apoptosis
    description: Mitochondrial dysfunction from Complex IV inhibition generates reactive oxygen species and drives apoptotic cell death.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Formic acid has also been shown to inhibit cytochrome oxidase and is the prime cause of ocular toxicity, though acidosis can increase toxicity further by enabling greater diffusion of formic acid into cells."
    explanation: Supports formate inhibition of cytochrome oxidase and the acidosis-driven feed-forward diffusion of formic acid.
- name: Oxidative stress and apoptosis
  description: >-
    Beyond direct Complex IV inhibition, formate toxicity intensifies oxidative
    stress and lipid peroxidation with formation of cytotoxic compounds and
    apoptotic cell death, amplifying tissue injury in the optic nerve, retina,
    and basal ganglia.
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Retinal and optic nerve toxicity
    description: Oxidative stress and lipid peroxidation amplify the optic nerve and retinal injury.
  - target: Basal ganglia injury
    description: Oxidative injury contributes to basal-ganglia neuronal death.
  evidence:
  - reference: PMID:34988610
    reference_title: "Methanol-induced optic neuropathy: a still-present problem."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "damage to the eye tissues by oxidative stress causing the intensification of the oxidative peroxidation process with the formation of cytotoxic compounds"
    explanation: Supports oxidative stress and lipid peroxidation forming cytotoxic compounds as an injury mechanism beyond direct cytochrome oxidase inhibition.
- name: Cellular energy failure
  description: >-
    Inhibition of oxidative phosphorylation depletes cellular ATP and shifts
    metabolism toward anaerobic glycolysis, generating lactate that adds to the
    acidosis and injuring metabolically demanding tissues such as the basal
    ganglia.
  biological_processes:
  - preferred_term: cellular response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  downstream:
  - target: High anion gap metabolic acidosis
    description: Lactate accumulation from anaerobic metabolism contributes to the high anion gap acidosis.
  - target: Basal ganglia injury
    description: Energy failure in the metabolically demanding basal ganglia produces putaminal necrosis.
  evidence:
  - reference: PMID:27180631
    reference_title: "Approach to the Treatment of Methanol Intoxication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its adverse effects are due primarily to the impact of its major metabolite formic acid and lactic acid resulting from cellular hypoxia."
    explanation: Supports cellular hypoxia producing lactic acid as a driver of adverse effects.
- name: High anion gap metabolic acidosis
  description: >-
    Accumulated formate and lactate produce a severe high-anion-gap metabolic
    acidosis; the low pH increases the proportion of undissociated formic acid,
    which crosses membranes more readily and worsens cellular toxicity in a
    feed-forward loop.
  downstream:
  - target: Central nervous system depression
    description: Severe acidosis and systemic toxicity depress the central nervous system.
  evidence:
  - reference: PMID:12216995
    reference_title: "American Academy of Clinical Toxicology practice guidelines on the treatment of methanol poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The acidosis observed in methanol poisoning appears to be caused directly or indirectly by formic acid production."
    explanation: Supports the high-anion-gap acidosis being driven by formic acid.
- name: Retinal and optic nerve toxicity
  description: >-
    Formate inhibits mitochondrial respiration in retinal ganglion cells and the
    optic nerve head, producing optic disc edema, optic neuropathy, and visual
    loss that can become permanent blindness.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:21192754
    reference_title: "Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Formic acid is implicated in the optic nerve damage associated with methanol."
    explanation: Supports formate as the cause of optic nerve damage in methanol poisoning.
- name: Basal ganglia injury
  description: >-
    Formate toxicity and energy failure produce bilateral putaminal necrosis, at
    times hemorrhagic, the substrate for delayed parkinsonism and dystonia in
    survivors.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cellular response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0071456
      label: cellular response to hypoxia
  evidence:
  - reference: PMID:36377024
    reference_title: "Importance of Susceptibility-weighted-imaging in Methanol Toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haemorrhagic necrosis of bilateral basal ganglia, particularly of the putamen, is one of the distinctive features of this entity."
    explanation: Supports bilateral putaminal hemorrhagic necrosis as the characteristic basal-ganglia lesion.
- name: Central nervous system depression
  description: >-
    Methanol itself and the ensuing acidosis and histotoxic hypoxia depress the
    central nervous system, producing inebriation, confusion, decreased
    consciousness, coma, and, in severe poisoning, seizures.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:21192754
    reference_title: "Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients frequently develop an early neurological syndrome consisting of inebriation, ataxia, and if severe, seizures and coma."
    explanation: Supports central nervous system depression progressing to seizures and coma.

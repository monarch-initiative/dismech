name: Immunodeficiency 74, COVID-19-Related, X-Linked
creation_date: "2026-10-01T20:11:01Z"
category: Mendelian
disease_term:
  preferred_term: X-linked recessive TLR7 deficiency
  term:
    id: MONDO:0026767
    label: immunodeficiency 74, COVID-19-related, X-linked
synonyms:
- immunodeficiency 74, COVID19-related, X-linked, X-linked recessive
- IMD74
- TLR7 deficiency
- X-linked recessive TLR7 deficiency
- XR TLR7 deficiency
description: >-
  Immunodeficiency 74 is X-linked recessive TLR7 deficiency: an inborn error of
  innate immunity in which hemizygous loss-of-function or hypomorphic variants of
  the X-chromosomal gene TLR7 abolish endosomal sensing of viral single-stranded
  RNA, and whose only consistently reported clinical consequence is
  severe-to-critical COVID-19 pneumonia in males. TLR7 is the single-stranded-RNA
  receptor whose ligation in plasmacytoid dendritic cells (pDCs) drives the
  largest burst of type I interferon any human leukocyte produces. In TLR7-deficient
  men that burst does not happen: patient pDCs exposed to SARS-CoV-2, or to
  TLR7-specific agonists, fail to induce type I interferon genes and fail to mature,
  while their response to a TLR9 agonist is intact, which localises the defect to
  the receptor rather than to the cell.

  The disease is unusual among inborn errors of immunity in how narrow it is. TLR7
  is not expressed in lung or pulmonary epithelial cells, so the lesion does not
  impair the TLR3-dependent epithelial arm of interferon immunity that other
  interferon-pathway defects hit; and the patients, who were ascertained through
  critical COVID-19, had not previously been hospitalised for any severe viral
  illness, influenza pneumonia included. It is also an inborn error that is defined
  by an exposure: the genotype is clinically silent until SARS-CoV-2 arrives, so
  COVID-19 segregates in these families as an X-linked recessive trait conditioned
  on infection. Penetrance for severe or critical disease is high but incomplete,
  and appears lower in young children, for whom the circulating pDC compartment is
  larger.

  It is quantitatively important rather than merely instructive. In the COVID Human
  Genetic Effort cohort, biochemically deleterious TLR7 variants accounted for about
  1.8% of unrelated male patients with critical COVID-19 pneumonia below 60 years of
  age, and were absent from asymptomatically or mildly infected men. Independent
  Italian and Spanish/Italian series found deleterious variants in 2.1% and 2.4% of
  comparable severe cases. Because the cumulative frequency of deleterious TLR7
  alleles in men in the general population is below 6.5 per 10,000, a deleterious
  hemizygous variant found in a previously healthy young man with critical COVID-19
  is a diagnosis rather than an incidental finding, and it makes his male relatives
  testable before they are infected.

      into a defective humoral response in humans. Recorded here rather than omitted
      because it is the reason the node's confidence is PROVISIONAL.
- name: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
  description: >-
    With the interferon brake absent in the first days of infection, viral replication
    is not contained. This step is inferred in humans from the interferon defect and
    the clinical outcome rather than measured directly in patients' airways; the viral
    load measurement comes from TLR7-deficient mice, in which lung virus titres rise
    together with loss of lung type I and type III interferon and interferon-stimulated
    gene expression. The type III interferon loss is recorded on this node because the
    murine lung is where it was measured; no type III measurement exists in
    TLR7-deficient patients.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  - preferred_term: type III interferon production
    term:
      id: GO:0034343
      label: type III interferon production
    modifier: DECREASED
  downstream:
  - target: Severe viral infection
    causal_link_type: DIRECT
    description: >-
      The disease-defining susceptibility, expressed clinically as severe infection
      with one specific virus rather than broad viral susceptibility. The edge is drawn
      from the failure of viral containment rather than from the pneumonia node, which
      is one expression of that severe infection rather than its cause.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, X-linked recessive TLR7 deficiency is a highly penetrant genetic etiology of critical COVID-19 pneumonia, in about 1.8% of male patients below the age of 60 years."
      explanation: The headline causal claim linking this genotype to severe viral disease.
  - target: Hypoxemic COVID-19 Pneumonia
    causal_link_type: DIRECT
    description: >-
      Uncontrolled replication in the lower respiratory tract is what produces the
      pneumonia the patients present with. The clinical arm of this edge is the
      ascertainment itself: deleterious TLR7 alleles were enriched among men with
      critical COVID-19 pneumonia and absent from asymptomatically or mildly infected
      men of comparable age.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "None of the 331 asymptomatically or mildly infected male individuals aged 1.3 to 102 years (mean: 38.7 years) tested carry such TLR7 variants"
      explanation: >-
        The case-control contrast underlying the edge: the genotype is found in the
        severe arm and not in the mild arm of the same infection.
  - target: Lung Neutrophil Accumulation and Immunopathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A higher and more prolonged viral burden drives the inflammatory infiltrate that
      damages the lung. Demonstrated in TLR7-deficient mice, where the increased virus
      load is accompanied by neutrophil accumulation and worse lung pathology; the
      intermediate chemotactic steps are known but were not measured in patients.
    evidence:
    - reference: PMID:40162785
      reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "A detailed evaluation of MA-CoV-2-infected lungs revealed increased neutrophil accumulation and lung pathology in TLR7-/- mice."
      explanation: >-
        The histological consequence of the uncontained infection, in the mouse model
        of this lesion. INDIRECT because the inference to human disease crosses species.
  evidence:
  - reference: PMID:40162785
    reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that TLR7 deficiency significantly increased lung virus loads and morbidity/mortality, which correlated with reduced levels of type I IFNs (Ifna/b), type III IFNs (Ifnl), and IFN-stimulated genes (ISGs) in the lungs."
    explanation: >-
      The direct measurement of the viral-control failure that human studies infer, in
      a TLR7-null animal challenged with a mouse-adapted SARS-CoV-2.
  - reference: PMID:39289468
    reference_title: Deficiency of Tlr7 and Irf7 in mice increases the severity of COVID-19 through the reduced interferon production.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The deficiency of Tlr7 and Irf7 globally and/or in immune cells in mice increases the severity of COVID-19 via impaired IFN activation in both immune and/or non-immune cells, leading to increased lung viral loads."
    explanation: >-
      Independent mouse replication linking the interferon defect to viral load and to
      severity, with bone-marrow chimeras locating the requirement in immune cells.
- name: Lung Neutrophil Accumulation and Immunopathology
  description: >-
    Neutrophil infiltration and inflammatory lung pathology in a lung in which the
    virus was never brought under control. The histology is murine: increased
    neutrophil accumulation and lung pathology in TLR7-null mice, with viral antigen
    in macrophages, pneumocytes and bronchial epithelial cells. No histological series
    from TLR7-deficient human lungs exists, so nothing more specific about the human
    lesion is asserted here. The sequence matters for how the disease is
    read: the inflammation here is downstream of a failed antiviral response, not of an
    excessive innate response, so TLR7-deficient patients are not interferonopathy
    patients and the mechanistic argument for immunosuppression as the primary
    intervention is weaker than in unselected severe COVID-19.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: pulmonary alveolar type 2 cell
    term:

    patients go - from that virus alone. None of the index patients had previously been
    hospitalised for a severe viral illness including influenza pneumonia, despite
    serological evidence of prior infection with diverse viruses, so the ontology term
    is bound for the SARS-CoV-2 susceptibility the entry is about rather than to assert
    a broad antiviral defect.
  phenotype_term:

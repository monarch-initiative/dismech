  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, by disrupting pDC-dependent type I IFN production, XR TLR7 deficiency accounts for at least 1% of cases of life-threatening COVID-19 pneumonia in men under 60."
    explanation: The authors' own summary of the diagnostic yield in this clinical group.

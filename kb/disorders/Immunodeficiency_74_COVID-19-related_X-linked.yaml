    modifier: DECREASED
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: DECREASED
  downstream:
  - target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
    causal_link_type: DIRECT
    description: >-
      Type I interferon is what restricts SARS-CoV-2 in the respiratory tract in the
      first days of infection. Without the pDC-derived burst the virus is not
      contained early, and the pDC compartment cannot be substituted for, because TLR7
      is not expressed by lung or pulmonary epithelial cells and so the epithelial
      TLR3 arm of interferon immunity does not cover this lesion.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Human TLR7 and pDCs are essential for protective type I IFN immunity against SARS-CoV-2 in the respiratory tract."
      explanation: >-
        The conclusion of the discovery study, stating the non-redundancy of this
        pathway for control of the virus at the site of disease.
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study indicates that pulmonary epithelial cells are not sufficient for host defense against SARS-CoV-2, as these cells do not express TLR7."
      explanation: >-
        Why no compensating source exists at the affected site, which is the reason a
        blood-cell defect produces a lung disease.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Induction of the 17 type I IFN genes in pDCs from TLR7-deficient patients was 10 to 100 times weaker than that in pDCs from healthy individuals"
    explanation: >-
      The quantitative core of this node, measured in patient pDCs infected with
      SARS-CoV-2 itself rather than with a synthetic agonist.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed that pDCs produced 100-1,000 times more type I IFN per cell than other leukocyte subsets upon TLR7 stimulation"
    explanation: >-
      Establishes why the pDC is the cell that matters here, and why loss of its
      response is not covered by the other TLR7-expressing subsets.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deep immunophenotyping by CyTOF in seven patients with TLR7 deficiency revealed no major abnormalities in 18 peripheral blood leukocyte subsets, including pDCs, mDCs, monocytes, and B cells"
    explanation: >-
      Supports the claim that this is a functional rather than a numerical defect, and
      is the reason a blood count does not screen for the condition.
- name: Impaired Type II Interferon Induction
  description: >-
    TLR7 stimulation of patient cells also fails to raise IFN-gamma. This arm is
    affected across the allelic spectrum rather than only in null alleles: a
    transcriptomic study of stimulated patient PBMCs found the failure of IFN-gamma
    upregulation even in cells carrying hypofunctional and hypomorphic variants that
    retain measurable NF-kappaB activity. It is recorded as a separate node because it
    is a distinct measured output of the same signalling block, and because it is what
    distinguishes TLR7 deficiency from a pure type I interferonopathy.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: type II interferon production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: DECREASED
  evidence:
  - reference: PMID:34952932
    reference_title: Rare variants in Toll-like receptor 7 results in functional impairment and downregulation of cytokine-mediated signaling in COVID-19 patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Of note, a failure in IFNγ upregulation following stimulation was also observed in cells harboring the hypofunctional and hypomorphic variants."
    explanation: >-
      The claim that this node makes beyond the type I arm: the type II defect extends
      to alleles that are not outright null.
  - reference: PMID:34367187
    reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional testing of this variant revealed decreased type I and II interferon responses in peripheral mononuclear blood cells upon stimulation with the TLR7 agonist imiquimod, confirming a loss-of-function effect."
    explanation: >-
      Independent replication in a separate kindred that both interferon arms are
      affected by a TLR7 missense allele.
- name: Defective B Cell and Myeloid TLR7 Responsiveness
  description: >-
    B cells and myeloid subsets (classical, intermediate and non-classical monocytes,
    myeloid dendritic cells) express TLR7 and are unresponsive to TLR7 ligands in
    these patients. What this costs clinically is not settled. In mice, B-cell-intrinsic
    Tlr7 signalling is required for germinal-centre-dependent class-switched
    neutralising antibody against SARS-CoV-2; in TLR7-deficient humans given a
    SARS-CoV-2 mRNA vaccine, the memory B cell and neutralising IgG response is
    essentially normal. The node is therefore recorded with the cellular defect
    established and the humoral consequence held open; see the HUMAN_MODEL_MISMATCH
    discussion.
  biological_scale: CELLULAR

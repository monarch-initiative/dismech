- population: Males in the general population (gnomAD v2.1), deleterious TLR7 alleles
  measure_type: CARRIER_FREQUENCY
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 65.0
  rate_denominator: POPULATION
  notes: >-
    Cumulative minor allele frequency of the 24 biochemically deleterious TLR7 alleles
    in men, 6.5 per 10,000, equivalent to 65 per 100,000. Because TLR7 is X-linked and
    these are hemizygous states in males, the allele frequency is also the frequency of
    affected genotypes in men. The strictly loss-of-function subset (excluding
    hypomorphs) is about 2.2 per 10,000.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative allele frequency for deleterious TLR7 variants in the male general population is < 6.5x10-4"
    explanation: The source of the 65 per 100,000 figure normalized in this record.
- population: Children under 16 hospitalized for COVID-19 pneumonia, international cohort
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 6250.0
  notes: >-
    Seven of 112 children (6.25%) hospitalized for COVID-19 pneumonia had X-linked
    recessive TLR7 deficiency, which made it the single commonest inborn error of type
    I interferon immunity in that paediatric series. Reported here because it is a
    different clinical group from the adult cohorts above, not because the disorder is
    commoner in children overall.
  evidence:
  - reference: PMID:35708626
    reference_title: Recessive inborn errors of type I IFN immunity in children with COVID-19 pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an international cohort of 112 children (<16 yr old) hospitalized for COVID-19 pneumonia, we report 12 children (10.7%) aged 1.5-13 yr with critical (7 children), severe (3), and moderate (2) pneumonia and 4 of the 15 known clinically recessive and biochemically complete inborn errors of type I IFN immunity: X-linked recessive TLR7 deficiency (7 children) and autosomal recessive IFNAR1 (1), STAT2 (1), or TYK2 (3) deficiencies"
    explanation: >-
      Gives both the denominator (112 children) and the count of TLR7-deficient
      children (7) from which the 6.25% in this record is taken.
diagnosis:
- name: TLR7 sequencing in a young man with unexplained severe COVID-19
  description: >-
    The diagnostic entry point. Because the genotype is clinically silent before
    infection, the disorder is found by sequencing TLR7 in a male patient whose severe
    COVID-19 is not explained by age or comorbidity, and the finding is then confirmed
    functionally.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34367187
    reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study supports a rationale for the genetic screening for TLR7 variants in young men with severe COVID-19 in the absence of other relevant risk factors."
    explanation: The stated indication for testing, from the prospective screening study.
- name: Functional confirmation of a candidate TLR7 allele
  description: >-
    A rare TLR7 variant is not a diagnosis on its own: five of twenty alleles found in
    critical cases were neutral in a signalling assay, and four of eight previously
    published variants were likewise neutral. Confirmation is a signalling readout - an
    NF-kappaB reporter assay on the transfected allele, or loss of the TLR7-agonist
    response in the patient's own cells, with rescue by wild-type TLR7.
  diagnosis_term:
    preferred_term: luciferase reporter signalling assay on the transfected TLR7 allele
  evidence:
  - reference: PMID:40423910
    reference_title: "From Rare to Common: Genetic Insights into TLR7 Variants in a Multicentric Spanish Study on COVID-19 Severity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The luciferase assay proves to be a reliable tool for evaluating TLR7 signaling, effectively distinguishing between neutral, LOF, and gain-of-function (GOF) variants."
    explanation: >-
      Names the assay and states what it discriminates, which is the step that converts
      a rare variant into a diagnosis.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, these findings suggest that 16 of the 21 patients in our cohort (Table 1), as well as only 6 of the previously reported 12 patients carry deleterious TLR7 variants."
    explanation: >-
      Quantifies how much reclassification functional testing produces, including the
      halving of previously published diagnoses - the reason this step is listed
      separately.
  notes: >-
    No NCIT clinical-action term was bound for this assay. Searched the committed NCIT
    label cache with
    grep -i -E ",(Luciferase|Reporter Gene|Reporter Assay|Signal Transduction Assay)," cache/ncit/terms.csv,
    which returned nothing, and the OLS NCIT search for "Luciferase Reporter Assay",
    which returns substance and gene-product terms rather than a clinical intervention
    reachable from NCIT:C25218. The preferred_term is left free-text rather than bound
    to a broader procedure term that would lose the specificity.
treatments:
- name: SARS-CoV-2 mRNA vaccination
  description: >-
    The one intervention with both a mechanistic rationale and direct supporting data
    in this disorder. Because TLR7 deficiency is clinically silent until infection,
    prophylaxis is what changes the outcome, and it was applied this way in practice:
    hemizygous relatives identified by family screening were fast-tracked for early
    vaccination. The rationale is not obvious a priori - TLR7 senses single-stranded RNA
    and an mRNA vaccine delivers it - so the key observation is that the humoral
    response to mRNA vaccination in TLR7-deficient patients is essentially normal in
    amplitude, duration and neutralising capacity, which the authors read as showing
    that induction of type I interferon is not required for an efficient humoral
    response to an mRNA vaccine. Whether the nucleoside-modified mRNA is sensed by
    endosomal TLRs at all is left open in their discussion, which notes that modified
    mRNA may still be partially recognised by those receptors, so the normal response
    is not explained here by assuming the vaccine bypasses TLR7.
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: mRNA COVID-19 vaccine
      term:
        id: NCIT:C181140
        label: mRNA COVID-19 Vaccine
  therapeutic_modality: VACCINE
  target_mechanisms:
  - target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
    description: >-
      Vaccination does not repair the TLR7 lesion. It supplies adaptive immunity that
      acts in place of the missing innate interferon brake, so that the virus is met by
      pre-existing neutralising antibody rather than by an interferon response that
      cannot be mounted.
    evidence:
    - reference: PMID:36342455
      reference_title: Human type I IFN deficiency does not impair B cell response to SARS-CoV-2 mRNA vaccination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The amplitude and duration of, and viral neutralization by, RBD-specific IgG serological response were also largely unaffected by TLR7, IRF7, or IFNAR1 deficiencies up to 7 mo after vaccination in all patients."
      explanation: >-
        Establishes that the protective arm vaccination relies on is intact in
        TLR7-deficient patients, which is what makes this a usable intervention rather
        than a hopeful one.
  evidence:
  - reference: PMID:34367187
    reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the TLR7 variant carriership, these individuals were fast-tracked for early vaccination."
    explanation: >-
      Documents the intervention being applied on the basis of the genetic diagnosis in
      identified hemizygous relatives.
  - reference: PMID:36342455
    reference_title: Human type I IFN deficiency does not impair B cell response to SARS-CoV-2 mRNA vaccination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that induction of type I IFN is not required for efficient generation of a humoral response against SARS-CoV-2 by mRNA vaccines."
    explanation: >-
      The general form of the finding: the vaccine's mechanism does not run through the
      pathway that is broken in these patients.
- name: Genetic counseling and pre-symptomatic testing of male relatives
  description: >-
    The diagnosis in a proband makes the family actionable, which is unusual for a
    disease defined by an exposure. Mothers are typically heterozygous carriers and
    hemizygous male relatives can be identified before they are infected, which is what
    allows prophylaxis to be offered to the people who need it. Family screening in the
    discovery cohort identified 16 heterozygous women and seven hemizygous men beyond
    the index cases.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:34367187
    reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diagnosis of TLR7 deficiency could not only inform on treatment options for the patient, but also enables pre-symptomatic testing of at-risk male relatives with the possibility of instituting early preventive and therapeutic interventions."
    explanation: States the purpose of cascade testing in this disorder.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of the TLR7 locus in the relatives of these patients identified the deleterious alleles in 16 heterozygous women from eleven families and seven hemizygous men from seven families"
    explanation: >-
      The yield of cascade testing in the reported families, which is the quantitative
      case for doing it.
- name: Early exogenous interferon therapy
  description: >-
    Mechanistically the obvious replacement: the lesion is a failure to produce type I
    interferon in a cell type whose receptor pathway is intact, so exogenous interferon
    bypasses the defect. It is a rational option rather than a demonstrated one - no
    trial or case series in TLR7-deficient patients supports it, and the argument is
    carried over from inborn errors of interferon signalling in general. Recorded here
    because the reasoning is explicit in the clinical literature on this disorder, and
    flagged as unproven because it is.

    The nearest randomised evidence comes from genotype-unselected COVID-19 trials of
    pegylated interferon lambda, a type III interferon, and its lesson is about timing
    rather than about this genotype. A single early subcutaneous dose in outpatients
    within seven days of symptom onset halved hospitalisation or emergency attendance,
    while two doses given to patients already admitted to hospital produced no benefit.
    If that time dependence carries over, it is awkward for this disorder specifically:
    TLR7-deficient patients are found because they are already critically ill, which is
    the window in which interferon did not work.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon beta
      term:
        id: NCIT:C495
        label: Recombinant Interferon Beta
    - preferred_term: pegylated interferon lambda-1a
      term:
        id: NCIT:C166435
        label: Peginterferon Lambda-1A
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
    description: >-
      Supplies the cytokine the patient's pDCs cannot make. The target is the production
      node rather than any downstream node because the receptor and JAK-STAT machinery
      are not affected by this lesion, so delivered interferon should still be sensed.
    evidence:
    - reference: PMID:34367187
      reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although no data is yet available to support specific management of TLR7 deficiency or the at-risk hemizygous carriers, early hospitalization and IFN-based therapies in inborn errors of IFN signaling form rational treatment options"
      explanation: >-
        The source states the rationale and, in the same sentence, that no supporting
        data exist - which is why this is graded INDIRECT and the treatment described as
        unproven.
  evidence:
  - reference: PMID:34367187
    reference_title: Genetic Screening for TLR7 Variants in Young and Previously Healthy Men With Severe COVID-19.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strong host genetic factors that confer an increased risk to develop severe COVID-19 might serve as genomic biomarkers, along with other factors, that could be used for early diagnosis and preventative measures, and could allow the identification of possible molecular targets for treatment."
    explanation: >-
      The general argument for genotype-directed therapy in this setting. Graded
      INDIRECT because it states a programme rather than a result in treated patients.
  - reference: PMID:36780676
    reference_title: Early Treatment with Pegylated Interferon Lambda for Covid-19.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 25 of 931 patients (2.7%) in the interferon group had a primary-outcome event, as compared with 57 of 1018 (5.6%) in the placebo group, a difference of 51% (relative risk, 0.49; 95% Bayesian credible interval, 0.30 to 0.76; posterior probability of superiority to placebo, >99.9%)."
    explanation: >-
      The only randomised result showing that giving exogenous interferon early changes
      COVID-19 outcome. INDIRECT and double-qualified: the trial enrolled
      genotype-unselected outpatients, so it does not test this disorder, and the
      interferon was type III rather than type I.
  - reference: PMID:36780676
    reference_title: Early Treatment with Pegylated Interferon Lambda for Covid-19.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with a high viral load at baseline, those who received pegylated interferon lambda had lower viral loads by day 7 than those who received placebo."
    explanation: >-
      Shows the intervention acting on viral load, which is the step this treatment's
      target_mechanisms link asserts it acts on. Still INDIRECT for the reasons above.
  - reference: PMID:40818744
    reference_title: "Peginterferon λ for the treatment of patients admitted to hospital with COVID-19: a phase 2, placebo-controlled randomized trial."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this phase II, prematurely stopped randomized placebo-controlled trial of peginterferon λ for individuals hospitalized with COVID-19 infection, no apparent benefit was identified."
    explanation: >-
      Refutes the late-administration form of this strategy, which is the form a
      TLR7-deficient patient diagnosed during critical illness would receive. Recorded
      as REFUTE rather than omitted because it is the main argument against the
      treatment as actually deliverable in this disorder. The trial stopped early and
      enrolled 97 participants, so it is underpowered as well as genotype-unselected.
  notes: >-
    No interferon product is established for this indication, and neither bound agent has
    been reported in a TLR7-deficient patient. NCIT:C495 Recombinant Interferon Beta is
    bound because interferon-beta is the type I subtype the cited TLR7-specific rationale
    appeals to; NCIT:C166435 Peginterferon Lambda-1A is bound because it is the agent in
    the two randomised trials cited above. Binding both, rather than one, is deliberate:
    the mechanistic argument in this disorder is for type I replacement while the trial
    evidence is for a type III agent, and collapsing that onto a single agent would hide
    the gap.
environmental:
- name: SARS-CoV-2 infection
  description: >-
    Not a modifier of this disease but a constituent of it. The genotype produces no
    phenotype in its absence: the patients were previously well, had no history of
    severe viral illness, and in the index families COVID-19 segregated as an X-linked
    recessive trait conditioned on exposure to the virus. This is why the MONDO concept
    names the infection, and why the hemizygous relatives identified by screening were
    asymptomatic rather than undiagnosed.
  exposure_term:
    preferred_term: exposure to severe acute respiratory syndrome coronavirus 2
  influences_mechanisms:
  - target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The virus is the ligand the receptor cannot sense and the pathogen the interferon
      response cannot contain, so the exposure initiates the mechanism rather than
      aggravating a process already under way.
    evidence:
    - reference: PMID:33650967
      reference_title: "Association of Toll-like receptor 7 variants with life-threatening COVID-19 disease in males: findings from a nested case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recently, loss-of-function variants in TLR7 were identified in two families in which COVID-19 segregates like an X-linked recessive disorder environmentally conditioned by SARS-CoV-2."
      explanation: >-
        States the gene-environment structure this link encodes: a Mendelian trait whose
        expression is conditional on the viral exposure.
  review_notes: >-
    ECTO was searched for an exposure class covering SARS-CoV-2 or coronavirus
    infection. The committed cache/ecto/terms.csv was searched with
    grep -i -E "sars|corona|covid|virus" cache/ecto/terms.csv, which returns no row
    matching sars, corona or covid and exactly two virus rows, ECTO:3000001 "exposure
    to virus" and ECTO:2000053 "exposure to Human Papillomavirus Infection"; the OLS
    ECTO search for "SARS-CoV-2" and for "coronavirus" returns no exposure class for
    either, while the OLS search for "virus" returns ECTO:3000001 with virus-specific
    descendants for other pathogens (Zika, yellow fever, hepatitis B and C, HIV-1) but
    none for a coronavirus. ECTO:3000001 was considered and rejected on positive
    grounds rather than on
    absence: binding "exposure to virus" to the one exposure that defines this disease
    would assert a generic viral exposure where the entry's whole content is that
    susceptibility is virus-specific and demonstrably does not extend to other viruses.
    The preferred_term is left free-text.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypes of five hemizygous relatives of index cases infected with SARS-CoV-2 include asymptomatic or mild infection (n=2, 5 and 38 years), or moderate (n=1, 5 years), severe (n=1, 27 years), or critical (n=1, 29 years) pneumonia."
    explanation: >-
      The exposure-conditioned phenotype distribution among carriers, which is what
      establishes infection as the trigger and shows the penetrance is incomplete.
animal_models:
- name: Tlr7-null mouse challenged with mouse-adapted SARS-CoV-2
  species: Mouse
  genotype: Tlr7 knockout (TLR7-/-)
  publication: PMID:40162785
  description: >-
    The model that supplies what human studies cannot: direct measurement of lung viral
    load, lung interferon output and lung histology under a controlled challenge.
    TLR7-null mice infected with mouse-adapted SARS-CoV-2 have higher lung virus titres,
    lower type I and III interferon and interferon-stimulated gene expression, more
    neutrophil infiltration, worse lung pathology and higher mortality than controls.
  modeled_mechanisms:
  - target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the failure of viral control in the lung that the human disease infers
      from its interferon defect and clinical outcome.
    limitations: >-
      The challenge is a mouse-adapted virus, not the human pathogen, and the mouse
      lesion is a whole-animal knockout rather than one of the graded human alleles.
      More importantly the cellular geography differs: human TLR7 deficiency acts
      through pDC-derived interferon with no epithelial contribution, since human lung
      epithelium does not express TLR7, whereas the mouse study reports reduced
      interferon-stimulated gene expression in the lung and viral antigen in bronchial
      epithelial cells.
    readouts:
    - name: Lung virus load
      target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
      direction: INCREASED
      interpretation: >-
        The quantitative correlate of failed viral containment, which is the step the
        human pathograph asserts without measuring.
      evidence:
      - reference: PMID:40162785
        reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We showed that TLR7 deficiency significantly increased lung virus loads and morbidity/mortality"
        explanation: Reports the measurement and its direction.
  - target: Lung Neutrophil Accumulation and Immunopathology
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the inflammatory lung lesion, and establishes its position downstream
      of the viral-control failure rather than as an independent process.
    limitations: >-
      Mouse neutrophil biology and the mouse-adapted virus both differ from the human
      disease, and no histological series from TLR7-deficient human lungs exists to
      compare against.
    readouts:
    - name: Lung neutrophil accumulation and histopathology
      target: Lung Neutrophil Accumulation and Immunopathology
      direction: INCREASED
      interpretation: The structural correlate of the immunopathology node in this model.
      evidence:
      - reference: PMID:40162785
        reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A detailed evaluation of MA-CoV-2-infected lungs revealed increased neutrophil accumulation and lung pathology in TLR7-/- mice."
        explanation: Reports the histological measurement behind this readout.
  evidence:
  - reference: PMID:40162785
    reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, given the similar disease outcomes in control, TLR7-/-, and IFNAR-deficient MA-CoV-2-infected mice and coronavirus disease 2019 (COVID-19) patients, we propose that MA-CoV-2-infected mice constitute an excellent model for studying COVID-19."
    explanation: >-
      The authors' own claim for the model's relevance. Cited as the basis for treating
      it as informative, not as independent validation of that claim.
- name: Tlr7-null mouse with immune-cell-restricted deficiency (bone marrow chimera)
  species: Mouse
  genotype: Tlr7 knockout and Irf7 knockout, including bone marrow transplant chimeras
  publication: PMID:39289468
  description: >-
    Addresses which compartment the requirement sits in. Global and
    immune-cell-restricted Tlr7 or Irf7 deficiency both worsen murine COVID-19 through
    impaired interferon activation and higher lung viral load, and both also reduce
    anti-SARS-CoV-2 antibody production, delaying viral clearance.
  modeled_mechanisms:
  - target: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the interferon-production failure and, through the chimeras, locates it
      in the immune compartment - the compartment the human disease implicates.
    limitations: >-
      The model does not isolate pDCs, which is the specific cell the human disorder
      turns on; it reports the immune compartment as a whole and additionally implicates
      non-immune cells, which the human lesion cannot involve because human lung
      epithelium does not express TLR7. The study also pairs Tlr7 with Irf7, a gene
      acting downstream of several sensors, so not every reported effect is attributable
      to TLR7.
    readouts:
    - name: Circulating interferon alpha and gamma
      target: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
      direction: DECREASED
      interpretation: >-
        Systemic consequence of the production defect, measured in the circulation
        rather than in sorted cells.
      evidence:
      - reference: PMID:39289468
        reference_title: Deficiency of Tlr7 and Irf7 in mice increases the severity of COVID-19 through the reduced interferon production.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These effects are associated with reduced IFN alpha and gamma levels in the circulation."
        explanation: Reports the measured direction of both interferon arms in the model.
  evidence:
  - reference: PMID:39289468
    reference_title: Deficiency of Tlr7 and Irf7 in mice increases the severity of COVID-19 through the reduced interferon production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that at the early phase of infection, SARS-CoV-2 causes the upregulation of Tlr7, Irf7, and IFN pathways in the lungs of the infected mice."
    explanation: >-
      Establishes that the pathway is engaged early in infection in this model, which is
      the premise for using its knockout as a model of the human timing.
discussions:
- discussion_id: tlr7_b_cell_antibody_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does B-cell-intrinsic TLR7 signalling contribute to the antibody response against
    SARS-CoV-2 in humans, as it does in mice, or is the human humoral response
    TLR7-independent?
  attaches_to:
  - pathophysiology#Defective B Cell and Myeloid TLR7 Responsiveness
  rationale: >-
    The two species give opposite answers, and both results are direct. In mice,
    Tlr7 deficiency abolishes germinal-centre-dependent class-switched IgG2b/IgG2c and
    neutralising antibody to SARS-CoV-2, and a B-cell-intrinsic requirement is
    demonstrated; a second murine study independently reports substantially reduced
    anti-SARS-CoV-2 antibody with delayed viral clearance. In TLR7-deficient humans
    given an mRNA vaccine, the RBD-specific memory B cell response is quantitatively
    and qualitatively similar to healthy donors and neutralising IgG is largely
    unaffected for seven months. The mismatch is mechanistically meaningful rather
    than a technical discrepancy: the human data are from a nucleoside-modified mRNA
    vaccine designed not to engage innate RNA sensors, whereas the murine data use
    inactivated virus and a pathogen-like particle carrying bacterial single-stranded
    RNA as a deliberate TLR7 ligand. So the comparison may be between two different
    antigens rather than between two species. It matters clinically: if the human B
    cell compartment does need TLR7 for a response to the virus itself, the normal
    mRNA-vaccine response does not license the conclusion that convalescent immunity
    in these patients is intact, and the entry's main intervention rests on that
    conclusion.
  proposed_experiments:
  - experiment_id: tlr7_natural_infection_antibody_response
    name: Natural-infection antibody response in TLR7-deficient patients versus relatives
    description: >-
      Measure RBD-specific class-switched IgG, memory B cell frequency and serum
      neutralising titre after natural SARS-CoV-2 infection (not vaccination) in
      TLR7-deficient patients, their non-carrier relatives and heterozygous mothers.
      Natural infection presents unmodified viral single-stranded RNA, which is the
      ligand the modified mRNA vaccine was engineered to avoid, so this is the
      comparison that separates a species difference from an antigen difference.
    would_support:
    - pathophysiology#Defective B Cell and Myeloid TLR7 Responsiveness
    supporting_outcome:
    - >-
      Reduced class-switched RBD-specific IgG and neutralising titre in TLR7-deficient
      patients relative to infected non-carrier relatives, with preserved responses to
      mRNA vaccination in the same individuals.
    would_refute:
    - pathophysiology#Defective B Cell and Myeloid TLR7 Responsiveness
    refuting_outcome:
    - >-
      Class-switched RBD-specific IgG, memory B cell frequency and neutralising titre
      after natural infection indistinguishable from infected non-carrier relatives,
      which would confine the B cell defect to the in vitro stimulation phenotype.
  evidence:
  - reference: PMID:37438976
    reference_title: B cell-intrinsic TLR7 signaling is required for neutralizing antibody responses to SARS-CoV-2 and pathogen-like COVID-19 vaccines.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Upon repeated immunization with inactivated SARS-CoV2 or PLA COVID-19 vaccine, we show that Tlr7-deficiency abolished the germinal center (GC)-dependent production of RBD-specific class-switched IgG2b and IgG2c, and neutralizing antibodies to SARS-CoV2."
    explanation: The murine side of the mismatch, including the B-cell-intrinsic requirement.
  - reference: PMID:39289468
    reference_title: Deficiency of Tlr7 and Irf7 in mice increases the severity of COVID-19 through the reduced interferon production.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite higher amounts of lung viral antigen, Tlr7 or Irf7 deficiency resulted in substantially reduced production of antibodies against SARS-CoV-2, thereby delaying the viral clearance."
    explanation: >-
      Independent murine replication of the antibody defect, with the additional
      observation that it delays viral clearance.
  - reference: PMID:36342455
    reference_title: Human type I IFN deficiency does not impair B cell response to SARS-CoV-2 mRNA vaccination.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Sustained germinal center responses led to accumulation of somatic hypermutations in immunoglobulin heavy chain genes."
    explanation: >-
      The human side: the germinal-centre step that fails in Tlr7-null mice proceeds in
      TLR7-deficient patients.
- discussion_id: tlr7_propofol_sedation_interaction
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Does propofol sedation further suppress TLR7 signalling in a patient whose residual
    TLR7 function is already reduced, and should sedation choice differ in a
    TLR7-hypomorphic patient being ventilated for COVID-19?
  attaches_to:
  - pathophysiology#Abolished MyD88-Dependent Signal Transduction
  - treatments#Early exogenous interferon therapy
  rationale: >-
    Propofol binds TLR7 directly and hinders its association with MyD88, attenuating
    interferon induction in dendritic cells and in lung tissue. The pharmacological
    target is precisely this entry's signalling node, and the clinical setting in which
    these patients are identified is one in which propofol is routinely given: they are
    diagnosed while intubated for critical COVID-19 pneumonia. For an outright
    loss-of-function allele the question does not arise, since there is no signal left
    to inhibit. It arises for the hypomorphic and hypofunctional alleles, which retain
    measurable activity and account for several of the reported patients, and for
    heterozygous female carriers. This is recorded as an interpretation rather than as a
    treatment caution because the evidence is biochemical and murine: no study has
    measured interferon output in a TLR7-hypomorphic patient under propofol, and no
    clinical comparison against another sedative exists.
  evidence:
  - reference: PMID:35899460
    reference_title: Propofol directly binds to and inhibits TLR7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that propofol directly bound to and hindered its association of TLR7 with MyD88."
    explanation: >-
      The molecular interaction, at exactly the receptor-to-adaptor step this entry's
      pathophysiology node describes.
  - reference: PMID:35899460
    reference_title: Propofol directly binds to and inhibits TLR7.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "R837 increased IFN-β expression in the lungs, and propofol attenuated IFN-β expression in an in vivo model of R837 intranasal instillation."
    explanation: >-
      Shows the interaction reducing interferon output in lung tissue in vivo, which is
      the organ and the output that matter here. INDIRECT because it is a murine
      agonist-challenge model, not a patient.
- discussion_id: tlr7_neurological_sequelae
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does TLR7 deficiency contribute to neurological deterioration after COVID-19, or is
    the single reported case a coincidence of two findings in one patient?
  attaches_to:
  - phenotypes#Severe viral infection
  rationale: >-
    One pediatric patient with post-COVID-19 neurological deterioration was found to
    carry a novel hemizygous frameshift TLR7 allele, and the reporting authors suggest
    TLR7 loss of function may contribute to neurological complications. That is a single
    case, the authors themselves hedge it, and no neurological phenotype appears in any
    of the cohort studies - so no neurological phenotype is curated in this entry. The
    gap is recorded rather than resolved because the cohorts were assembled on
    respiratory severity and would not have detected a neurological outcome had one
    existed. A second patient in whom TLR7 deficiency coexisted with
    ataxia-telangiectasia shows the shape of the confound: that patient's neurological
    signs were attributable to a homozygous ATM variant, with TLR7 accounting only for
    the COVID-19 severity.
  evidence:
  - reference: PMID:38093758
    reference_title: "Novel TLR7 hemizygous variant in post-COVID-19 neurological deterioration: a case report with literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, our preliminary findings also suggest TLR7 loss of function may contribute to neurological complications post-COVID-19, especially in young previously healthy patients."
    explanation: >-
      The hypothesis, in the authors' own hedged terms, and the whole of the evidence
      for it.
  - reference: PMID:34686943
    reference_title: X-Linked TLR7 Deficiency Underlies Critical COVID-19 Pneumonia in a Male Patient with Ataxia-Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a unique IEI patient with combined ATM and TLR7 deficiencies. The two genetic defects underlie A-T and critical COVID-19 in this patient, respectively."
    explanation: >-
      The worked example of attributing neurological disease to the other gene and
      COVID-19 severity to TLR7 - the confound this gap is about.
notes: >-
  Scope. This entry curates the Mendelian disorder: hemizygous deleterious TLR7 alleles
  causing severe or critical COVID-19 in males. The large common-variant literature on
  TLR7 polymorphisms (rs179008, rs179009, rs3853839) and COVID-19 severity is a
  susceptibility question at the same locus, not this disease, and is recorded only as a
  caveat on the genetic record. The MONDO concept itself is the Mendelian one, carrying
  OMIM 301051 as an exact match.

  Why the phenotype list is short and respiratory. The cohorts that define this disorder
  were assembled on COVID-19 severity, so the phenotype spectrum is what those cohorts
  measured. No immunological laboratory phenotype is curated even though the interferon
  defects are well documented, because what is measured in the patients is a stimulated
  response in isolated cells rather than a circulating analyte concentration. HPO's
  nearest terms (HP:0011116 Abnormal circulating interferon concentration, read from
  the OLS HP search, and HP:0034513 Increased circulating Interferon-alpha
  concentration, read from cache/hp/terms.csv) describe a circulating concentration, so
  binding either to an ex vivo stimulation assay would misdescribe the measurement.
  Those findings are carried as pathophysiology nodes with their own evidence instead,
  and no biochemical block is curated for the same reason.

  Phenotype frequencies are deliberately absent. Every cohort here was ascertained on
  COVID-19 severity, so the proportion of patients with pneumonia or hypoxaemia is a
  property of the selection rather than of the genotype, and the only honest frequency
  figures are the diagnostic yields recorded under prevalence.
review_notes: >-
  Deep research. One openscientist deep-research report was commissioned for this entry
  (`just research-disorder openscientist Immunodeficiency_74_COVID-19-related_X-linked`),
  and is committed alongside it. The report's disease identity was checked by hand against
  the MONDO record: it names TLR7, Xp22.2 and OMIM 301051, which is the OMIM number
  MONDO:0026767 carries as an exact match, so there is no named-entity confusion. That
  identity check was done by hand because `just preflight-dr` needs the local MONDO
  build, which was not available.

  Four of the report's leads were followed up, independently verified against the fetched
  abstracts, and are curated: the 21-cohort exome-wide burden estimate (PMID:36327219),
  the escape of TLR7 from X-inactivation as the reason heterozygous women are buffered
  (PMID:38481993), the two randomised peginterferon-lambda trials that between them show
  interferon benefit is confined to an early window (PMID:36780676, PMID:40818744), and
  the direct inhibition of TLR7-MyD88 association by propofol (PMID:35899460). None of
  these came out of the cohort literature this entry was otherwise built from.

  Two leads were read and not used. PMID:41961811, offered in support of pDC interferon
  output as a functional biomarker and of visceral adiposity as a non-genetic modifier, is
  a real paper on that subject but concerns neither this genotype nor this disease, so
  citing it here would import an association from a different population. The report's
  bidirectional framing of TLR7 - that enhanced rather than absent TLR7-driven interferon
  production underlies pandemic chilblains (PMID:40227192) - checks out against that
  paper's own title and abstract, but it is a different disease and belongs in its own
  entry rather than as background in this one.

  No CURIE in this entry comes from the report. The bindings were resolved against the
  OLS REST search (HP, GO, CL, NCIT) and the committed cache CSVs (HGNC, NCIT, CL, GO).

  Module conformance. Two nodes conform to `innate_antiviral_interferon_response`:
  the sensing failure to its PAMP-sensing node, and the pDC interferon node to its
  `Type I and III Interferon Induction and JAK-STAT Signaling` node. The second is a
  partial fit and the node's description says how: the module node bundles induction
  with JAK-STAT signalling, and this lesion loses only induction. No other module node
  matches - the ISG-antiviral-state and viral-antagonism nodes describe steps that are
  intact here, and the restriction-of-replication node is the module's protective
  output rather than this entry's failure of it.

  Standard severe-COVID care is out of scope. Early direct-acting antivirals and the
  late-phase immunomodulators (dexamethasone, IL-6 blockade, JAK inhibitors) are given
  to these patients as they are to any critical COVID-19 patient, and no study reports
  either in a TLR7-deficient cohort, so they would be genotype-unselected standard care
  recorded as though it were disease-specific. The one genotype-unselected intervention
  that is curated, exogenous interferon, is there because the mechanistic argument for
  it is specific to this lesion and is made explicitly in this disorder's own
  literature.

  Not curated, and why. The discovery cohort's 16 TLR7-deficient patients were all
  tested for neutralising autoantibodies against type I interferon and all negative.
  That is a property of how the cohort was selected - patients with such autoantibodies
  were excluded before the TLR7 analysis - rather than a feature of the disease, so it
  is not curated as one.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None had previously been hospitalized for a severe viral illness, including influenza pneumonia. This cohort of patients thus suggests that TLR7 deficiency does not underlie severe disease caused by common viral infections other than SARS-CoV-2, or if so, with lower penetrance."
    explanation: >-

genetic:
- name: TLR7
  gene_term:
    preferred_term: TLR7
    term:
      id: hgnc:15631
      label: TLR7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    Deleterious hemizygous alleles in about 1.8% of male patients under 60 with
    critical COVID-19 pneumonia; cumulative allele frequency below 6.5 per 10,000 men
    in the general population.
  notes: >-
    TLR7 is the single causal gene; the disorder is genetically homogeneous by
    construction, having been found by an X-chromosome-wide enrichment test in which
    TLR7 was the only gene to survive correction for multiple testing. Alleles are
    private or very rare and span frameshift, nonsense and missense classes, and are
    graded functionally rather than by prediction: in the discovery cohort 12 of 20
    were loss-of-function and three hypomorphic, with five neutral alleles excluded
    from the diagnosis. A separate Spanish series found that common TLR7 variants
    (rs179008, rs179009, rs3853839) also associate with severe pneumonia, which is a
    susceptibility rather than a Mendelian claim and is not what this entry curates.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TLR7 was the highest ranked of these genes (uncorrected P-value = 3.5×10−5) and the only gene that remained significant after correction for multiple testing"
    explanation: >-
      The unbiased genome-level result that identifies TLR7 as the locus, rather than a
      candidate-gene assertion.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each of these 24 deleterious variants had an individual MAF < 1.3x10-4 in men and their cumulative MAF in men was 6.5 x10-4"
    explanation: >-
      The population allele frequency that makes a deleterious hemizygous variant in a
      young man with critical COVID-19 interpretable as causal.
  - reference: PMID:40423910
    reference_title: "From Rare to Common: Genetic Insights into TLR7 Variants in a Multicentric Spanish Study on COVID-19 Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The functional impact of rare TLR7 variants was assessed using a luciferase reporter assay and revealed that N215S is a loss-of-function (LOF) variant, while D332G exhibits an hypomorphic behavior."
    explanation: >-
      Independent functional grading of further alleles, and the reason the
      loss-of-function/hypomorphic distinction is recorded as part of the genetic claim
      rather than assumed from the variant class.
  - reference: PMID:40423910
    reference_title: "From Rare to Common: Genetic Insights into TLR7 Variants in a Multicentric Spanish Study on COVID-19 Severity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the common variants Q11L (rs179008), c.4-151A>G (rs179009) and c.*881C>G (rs3853839) were associated with severe pneumonia, while c.4-151A>G (rs179009) was specifically linked to Intensive Care Unit (ICU) admission."
    explanation: >-
      The common-variant association named in this record's notes and explicitly
      excluded from the Mendelian claim; INDIRECT because an association at a common
      allele does not establish the monogenic disorder.
  - reference: PMID:37020259
    reference_title: Rare predicted loss-of-function variants of type I IFN immunity genes are associated with life-threatening COVID-19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare variants of TLR3- and TLR7-dependent type I IFN immunity genes can underlie life-threatening COVID-19, particularly with recessive inheritance, in patients under 60 years old."
    explanation: >-
      A genome-wide rare-variant burden analysis in 3,269 patients independently
      recovering TLR7 as the leading recessive signal.
  - reference: PMID:36327219
    reference_title: "Exome-wide association study to identify rare variants influencing COVID-19 outcomes: Results from the Host Genetics Initiative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an analysis of 5,085 severe disease cases and 571,737 controls, we observed that carrying a rare deleterious variant in the SARS-CoV-2 sensor toll-like receptor TLR7 (on chromosome X) was associated with a 5.3-fold increase in severe disease (95% CI: 2.75-10.05, p = 5.41x10-7)."
    explanation: >-
      The population-scale effect size, from a 21-cohort exome-wide burden meta-analysis
      across 12 countries. It is a different estimand from the diagnostic yields under
      prevalence: an odds ratio over all rare deleterious carriers, not the proportion
      of severe cases a functionally confirmed diagnosis explains.

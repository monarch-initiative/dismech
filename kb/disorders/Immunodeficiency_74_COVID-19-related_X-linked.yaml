classifications:
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970). TLR7
      deficiency is listed in that update's Table 6 of defects in intrinsic and
      innate immunity, in the group of innate defects conferring predisposition to
      viral infection, with mode of inheritance XL and OMIM 301051 - the same OMIM
      number MONDO:0026767 carries as an exact match. The update's text calls
      X-linked TLR7 deficiency a novel IEI predisposing to severe COVID-19.
inheritance:
- name: X-linked recessive
  description: >-
    TLR7 is on Xp22.2, so a single deleterious allele is sufficient in males and the
    disease presents in hemizygous men and boys. In the reported kindreds the allele
    is almost always maternally inherited from an unaffected heterozygous carrier
    mother; only one of ten tested index alleles was de novo. Female heterozygotes
    were not reported as having critical disease in the discovery cohorts, although a
    later large case-control study detected a TLR7 association signal in a female-only
    subgroup, which that study reads as evidence for a mechanism beyond simple
    X-linked recessive inheritance in males.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TLR7 deficiency TLR7 XL 301051"
    explanation: >-
      The IUIS classification table row for this disorder, recording X-linked
      inheritance and the OMIM number (301051) that MONDO:0026767 maps to.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the ten DNA samples available from the patients' mothers, only one of the TLR7 variants (L372M) was de novo in the index case."
    explanation: >-
      Establishes maternal transmission as the rule rather than the exception, which
      is what makes carrier testing of mothers and pre-symptomatic testing of male
      relatives worthwhile.
  - reference: PMID:38944683
    reference_title: Stratified analyses refine association between TLR7 rare variants and severe COVID-19.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Association signals for the X-chromosomal gene TLR7 were also detected in the female-only subgroup, suggesting the existence of additional mechanisms beyond X-linked recessive inheritance in males."
    explanation: >-
      The caveat recorded in the description of this inheritance block: a female-only
      signal is not accounted for by hemizygosity, so the X-linked recessive label
      describes the male presentation rather than the whole genetic architecture.
  - reference: PMID:36327219
    reference_title: "Exome-wide association study to identify rare variants influencing COVID-19 outcomes: Results from the Host Genetics Initiative."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This association was consistent across sexes."
    explanation: >-
      The same point from the burden side: the rare-variant association with severe
      disease was not male-restricted, although clinically ascertained cases are. Graded
      INDIRECT because a sex-consistent burden statistic does not by itself establish
      the inheritance model.
  - reference: PMID:38481993
    reference_title: Gonadal androgens are associated with decreased type I interferon production by plasmacytoid dendritic cells and increased IgG titres to BNT162b2 following co-vaccination with live attenuated influenza vaccine in adolescents.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Mechanistically, women produce greater quantities of IFN-I since the upstream receptor, Toll-like receptor 7 (TLR7), is encoded by the X chromosome and escapes X chromosome inactivation in up to 30% of female immune cells"
    explanation: >-
      The gene-dosage reason a heterozygous woman is better buffered than a hemizygous
      man, which is the mechanism behind the male predominance. Graded with
      quote_role BACKGROUND because the citing study is an adolescent vaccination study
      and this sentence restates established pDC biology from prior work rather than
      reporting its own result; IN_VITRO because the underlying observation is in
      isolated human immune cells.
pathophysiology:
- name: TLR7 Loss of Function
  description: >-
    Hemizygous TLR7 variants that abolish or substantially reduce receptor function.
    The reported spectrum is broad in kind and consistent in consequence: frameshift
    and nonsense alleles that remove the protein (p.Asn158Thrfs*11, p.Leu227fs) or
    truncate it (p.Lys684*, p.Phe670Leufs*8), the four-nucleotide deletion
    p.Gln710Argfs*18 of the original Dutch kindred, and missense alleles expressed at
    normal levels that are nonetheless dead in a signalling assay (p.Val795Phe,
    p.His781Leu, p.Leu988Ser, p.Asn215Ser). Grading is biochemical, not predictive: of
    20 alleles found in one cohort of critical cases, 12 were loss-of-function, three
    hypomorphic and five neutral in an NF-kappaB reporter assay, so the functional
    test is what distinguishes a causal allele from a rare one.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TLR7
    term:
      id: hgnc:15631
      label: TLR7
  downstream:
  - target: Failure of Endosomal Single-Stranded RNA Sensing
    causal_link_type: DIRECT
    description: >-
      TLR7 is the receptor, so an allele that removes the protein or kills its
      signalling output removes the sensing step itself. The lesion is cell-intrinsic
      and reversible: re-expression of wild-type TLR7 in the patients' own cells
      restores the response, which is what establishes the variant as causal rather
      than correlated.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Hemizygosity for LOF TLR7 alleles thus abolished responses to TLR7 stimulation in EBV-B cells, a phenotype that was rescued by WT TLR7 expression."
      explanation: >-
        Loss of the allele abolishes the response and restoring the allele restores it,
        in the same patient cells - the direct form of this edge.
  evidence:
  - reference: PMID:32706371
    reference_title: Presence of Genetic Variants Among Young Men With Severe COVID-19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid clinical whole-exome sequencing of the patients and segregation in available family members identified loss-of-function variants of the X-chromosomal TLR7."
    explanation: >-
      Identifies loss-of-function TLR7 alleles as the molecular lesion, from the study
      that first found the locus. The two specific genotypes named in this node's
      description (p.Gln710Argfs*18 and p.Val795Phe) are in the same abstract paragraph
      but are not quoted here, because the square brackets the source puts around the
      protein changes are stripped by the validator before matching.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Twelve of the 20 alleles were loss-of-function (LOF) (including L988S in two patients, and M854I;L988S in another), three (p.L372M, p.I657T and p.P715S) were hypomorphic (activity < 25%), and the remaining five were neutral"
    explanation: >-
      The allelic grading this node rests on, and the reason a rare TLR7 variant is
      not by itself a diagnosis.
- name: Failure of Endosomal Single-Stranded RNA Sensing
  conforms_to: "innate_antiviral_interferon_response#Viral PAMP Sensing by Pattern-Recognition Receptors"
  description: >-
    TLR7 sits in the endosomal compartment and binds single-stranded RNA, including
    the SARS-CoV-2 genome delivered there by endocytosed virions. Without a functional
    receptor the ligand is not detected. The defect is specific to this receptor and
    not to endosomal sensing in general: the same patient pDCs respond normally to a
    TLR9 agonist, and no enrichment of deleterious variants was found at the adjacent
    X-linked gene TLR8.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: endosome
    term:
      id: GO:0005768
      label: endosome
  molecular_functions:
  - preferred_term: single-stranded RNA binding
    term:
      id: GO:0003727
      label: single-stranded RNA binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: detection of virus
    term:
      id: GO:0009597
      label: detection of virus
    modifier: DECREASED
  - preferred_term: toll-like receptor 7 signaling pathway
    term:
      id: GO:0034154
      label: toll-like receptor 7 signaling pathway
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Abolished MyD88-Dependent Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Ligand binding is what recruits the MyD88 adaptor to the receptor's cytoplasmic
      TIR domain, so a receptor that does not engage its ligand never assembles the
      signalling complex. In silico modelling of the deleterious alleles reports the
      same thing from the protein side, with impaired binding of both viral RNA and
      MYD88.
    evidence:
    - reference: PMID:37567916
      reference_title: The role of TLR7 agonists in modulating COVID-19 severity in subjects with loss-of-function TLR7 variants.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "To conclude, TLR7 LOF mutations increase the risk of critical COVID-19 due to loss of viral RNA sensing ability and disrupted MyD88 signaling."
      explanation: >-
        Couples loss of RNA sensing to loss of MyD88 signalling. Graded COMPUTATIONAL
        and INDIRECT because the finding is a docking and binding-energy analysis of
        the variant proteins rather than a measurement in patient cells.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "pDCs from P8 and P14 did not produce type I IFNs (or IL-6) upon stimulation with a TLR7 agonist, whereas they responded to a TLR9 agonist"
    explanation: >-
      The receptor-specific nature of the sensing failure: TLR7 agonist dead, TLR9
      agonist intact, in the same cells.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed no significant enrichment for coding non-synonymous variants of the X-linked gene TLR8"
    explanation: >-
      The negative control on the same chromosome, supporting the claim that the lesion
      is confined to TLR7 rather than to endosomal nucleic-acid sensing broadly.
- name: Abolished MyD88-Dependent Signal Transduction
  description: >-
    All TLR7 signalling runs through MyD88, and from there through IRAK4 to NF-kappaB
    and to the IRF7-dependent interferon arm. In TLR7-deficient cells this cascade is
    not engaged by TLR7 ligands. The reporter assay that grades the alleles reads
    NF-kappaB transcriptional activity, so the node is also the measurement the
    variant classification is built on; functionally, patient B cell lines fail to
    make TNF in response to TLR7 or TLR7/8 agonists.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: MyD88-dependent toll-like receptor signaling pathway
    term:
      id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    modifier: DECREASED
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: DECREASED
  downstream:
  - target: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
    causal_link_type: DIRECT
    description: >-
      In pDCs the MyD88 complex is coupled to constitutively high IRF7, which is why
      TLR7 ligation in these cells produces type I interferon rather than only
      inflammatory cytokines. With the adaptor step never reached, interferon induction
      does not occur.
    evidence:
    - reference: PMID:32706371
      reference_title: Presence of Genetic Variants Among Young Men With Severe COVID-19.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In primary peripheral blood mononuclear cells from the patients, downstream type I interferon (IFN) signaling was transcriptionally downregulated, as measured by significantly decreased mRNA expression of IRF7, IFNB1, and ISG15 on stimulation with the TLR7 agonist imiquimod as compared with family members and controls."
      explanation: >-
        Names the transcriptional step between the receptor and the interferon output,
        measured in the patients' own cells after TLR7 stimulation.
  - target: Impaired Type II Interferon Induction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same stimulation that fails to induce type I interferon also fails to induce
      IFN-gamma, so the signalling block costs both interferon arms rather than only
      the type I response. The link is indirect: IFN-gamma in a stimulated mixed
      leukocyte population is produced by T and NK cells responding to accessory
      cytokines from the TLR7-bearing cells, not by MyD88 signalling in the
      IFN-gamma-producing cell itself, so the intermediate step is known but was not
      measured separately in these patients.
    evidence:
    - reference: PMID:32706371
      reference_title: Presence of Genetic Variants Among Young Men With Severe COVID-19.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The production of IFN-γ, a type II IFN, was decreased in patients in response to stimulation with imiquimod."
      explanation: Direct measurement of the type II interferon arm in patient cells.
  - target: Defective B Cell and Myeloid TLR7 Responsiveness
    causal_link_type: DIRECT
    description: >-
      TLR7 is expressed by B cells and by myeloid subsets as well as pDCs, and the
      adaptor block is the same in all of them, so the cellular phenotype extends
      beyond the interferon-producing compartment.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also show that blood B cell lines and myeloid cell subsets from the patients do not respond to TLR7 stimulation, a phenotype rescued by wild-type TLR7"
      explanation: >-
        States the extension of the signalling defect to B cells and myeloid subsets,
        with the wild-type rescue that makes it attributable to TLR7.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In response to agonists of TLR7 (imiquimod) or TLR7 plus TLR8 (R848), the EBV-B cell lines carrying these two mutations failed to produce TNF"
    explanation: >-
      The functional readout of the abolished cascade in patient-derived cells, using
      an NF-kappaB-dependent output.
  - reference: PMID:34952932
    reference_title: Rare variants in Toll-like receptor 7 results in functional impairment and downregulation of cytokine-mediated signaling in COVID-19 patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our investigation revealed a profound impairment of the TLR7 pathway in patients carrying loss-of-function variants."
    explanation: >-
      Independent transcriptome-wide confirmation that the pathway, not merely one
      readout, is impaired in carriers of loss-of-function alleles.
- name: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
  conforms_to: "innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling"
  description: >-
    The central node. pDCs are the body's dominant source of type I interferon on
    nucleic-acid sensing, producing 100 to 1,000 times more per cell than any other
    leukocyte subset after TLR7 stimulation, and they are the cell type in which TLR7
    deficiency matters. Patient pDCs infected with SARS-CoV-2 induce the type I
    interferon gene module 10 to 100 times more weakly than control pDCs and fail to
    mature into the PD-L1-high S1 subset that produces most of the IFN-alpha. The
    defect is partial rather than absolute, which the discovery study attributes to
    TLR7-independent sensors, TLR9 among them. pDC numbers themselves are normal:
    deep immunophenotyping found no abnormality in the leukocyte subsets, so this is a
    functional and not a numerical defect. The module node this conforms to bundles
    interferon induction with downstream JAK-STAT signalling, and only the induction
    half is lost here: the interferon receptor and its JAK-STAT machinery are intact
    in TLR7 deficiency, which is what makes exogenous interferon a rational
    replacement rather than a futile one.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:

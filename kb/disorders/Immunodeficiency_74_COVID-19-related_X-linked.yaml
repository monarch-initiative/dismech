      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Acute respiratory distress syndrome
    causal_link_type: DIRECT
    description: >-
      Alveolar injury with inflammatory infiltrate is the lesion underlying the
      hypoxaemic respiratory failure that defines critical disease in these patients.
    evidence:
    - reference: PMID:40162785
      reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "we conclusively demonstrated that despite TLR7-induced robust lung inflammation, TLR7-induced IFN/ISG responses suppress lung virus replication and pathology and provide protection against SARS-CoV-2-induced fatal pneumonia"
      explanation: >-
        States the direction of the relationship this edge asserts - that losing TLR7
        worsens lung pathology and mortality despite TLR7 itself being inflammatory.
  evidence:
  - reference: PMID:40162785
    reference_title: Toll-like receptor 7 (TLR7)-mediated antiviral response protects mice from lethal SARS-CoV-2 infection.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, immunohistochemical assessment of the lungs revealed increased numbers of SARS-CoV-2 antigen-positive macrophages, pneumocytes, and bronchial epithelial cells in TLR7-/- and IFNAR-deficient mice compared to control mice."
    explanation: >-
      The cell types carrying viral antigen in the affected lung, which is why this
      node binds alveolar macrophage and type 2 pneumocyte alongside the neutrophil it
      is named for.
- name: Hypoxemic COVID-19 Pneumonia
  description: >-
    The clinical endpoint: pneumonia requiring oxygen, progressing in most reported
    patients to high-flow oxygen or mechanical ventilation. Across the discovery
    cohort the patients were aged 7 to 71 years with a mean of 34.4 years, markedly
    younger than the cohort they were drawn from, and two of sixteen died. Severity is
    graded rather than binary - the same allele produced critical pneumonia in one
    hemizygous relative, severe pneumonia in another, and asymptomatic infection in a
    third - which is the incomplete penetrance this entry records as a hypothesis
    rather than a settled quantity.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      Pneumonia is the organ manifestation in every reported symptomatic case; the
      cohorts were assembled on it.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report very rare, biochemically deleterious X-linked TLR7 variants in 16 unrelated male individuals aged 7 to 71 years (mean: 36.7 years) from a cohort of 1,202 male patients aged 0.5 to 99 years (mean: 52.9 years) with unexplained critical COVID-19 pneumonia."
      explanation: Identifies critical COVID-19 pneumonia as the presenting illness.
  - target: Hypoxemia
    causal_link_type: DIRECT
    description: >-
      The pneumonia is hypoxaemic by definition of the cohorts: severe disease was
      defined by a low-flow oxygen requirement and critical disease by high-flow oxygen
      or ventilation.
    evidence:
    - reference: PMID:34413140
      reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study included 1,202 male patients with life-threatening COVID-19 pneumonia, defined as patients with pneumonia who developed critical disease, whether pulmonary with high-flow oxygen (> 6L/min) or mechanical ventilation (CPAP, BIPAP, intubation), septic shock, or any other type of organ damage requiring ICU admission."
      explanation: >-
        The oxygen-requirement definition that makes hypoxaemia constitutive of the
        phenotype rather than an occasional complication.
  - target: Respiratory failure requiring assisted ventilation
    causal_link_type: DIRECT
    description: >-
      Progression to mechanical ventilation was the presentation in the index kindreds
      and is the usual course of the critical form.
    evidence:
    - reference: PMID:32706371
      reference_title: Presence of Genetic Variants Among Young Men With Severe COVID-19.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They were previously well before developing respiratory insufficiency due to severe COVID-19, requiring mechanical ventilation in the ICU."
      explanation: >-
        The ventilation requirement in the four index patients, all previously healthy
        young men.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were aged 7 to 71 years and their mean age was lower than that of the total cohort (mean age of 34.4 years, versus 52.9 years for the total cohort, in which age ranged from 0.5 to 99 years). TLR7-deficient patients accounted for about 1.8% of the patients below the age of 60 years (15 patients) and 1.3% of the entire cohort (16 patients). Two patients died and 14 survived"
    explanation: >-
      The age distribution and outcome of the defined cohort, and the source of the
      age figures in this node's description.
mechanistic_hypotheses:
- hypothesis_group_id: age_dependent_penetrance_pdc
  hypothesis_label: Declining plasmacytoid dendritic cell numbers explain why penetrance rises with age
  status: EMERGING
  description: >-
    Penetrance of TLR7 deficiency for severe or critical COVID-19 is high but
    incomplete, and the exceptions are mostly young. Among the hemizygous relatives
    identified by family screening, the three with asymptomatic, mild or moderate
    infection were aged 5, 5 and 38 years, while those with severe or critical
    pneumonia were older on average (mean 32.4 years against 16), though that group
    spans 7 to 71 years and includes children. The discovery study proposes that because blood pDC counts
    fall with age, a young TLR7-deficient boy still has enough pDC-independent or
    residual TLR9-driven interferon capacity to contain the virus, while the same
    genotype in an adult does not. A second, non-exclusive proposal from the same study
    is that genetic or epigenetic variation in TLR9 responses modifies the phenotype,
    since patient pDCs respond normally to TLR9 agonists. Which is right determines
    whether a hemizygous child identified by family screening should be counselled as
    being at risk now or as becoming at risk later.
  evidence:
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 23 male patients carrying deleterious alleles of TLR7 infected with SARS-CoV-2, the 20 patients who developed severe (n=3) or critical (n=17) COVID-19 were aged 7-71 years (mean: 32.4 years) whereas the three patients who developed asymptomatic, mild, or moderate infection were younger: 5, 5, and 38 years (mean: 16 years)."
    explanation: The age contrast between penetrant and non-penetrant carriers that the hypothesis is built on.
  - reference: PMID:34413140
    reference_title: "X-linked recessive TLR7 deficiency in ~1% of men under 60 years old with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Blood pDC counts decrease with age (36–38), and this may contribute to the apparent increase in penetrance with age."
    explanation: >-
      The proposed mechanism, stated by the authors as a possibility rather than a
      finding - which is why this is recorded as EMERGING. Graded OTHER with a
      REVIEW_SYNTHESIS quote role because the sentence cites prior pDC-ageing work
      rather than reporting a measurement made in this study.
  - reference: PMID:35708626
    reference_title: Recessive inborn errors of type I IFN immunity in children with COVID-19 pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The penetrance of AR IFNAR1 and IRF7 deficiencies for critical COVID-19 appears to be complete, whereas that of XR TLR7 deficiency is high, but incomplete, especially in young patients"
    explanation: >-
      Independent statement of the age-skewed incomplete penetrance, contrasted against
      interferon-pathway defects whose penetrance is complete.

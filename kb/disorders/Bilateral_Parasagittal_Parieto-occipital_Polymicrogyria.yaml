pathophysiology:
- name: FIG4 Loss of Function
  description: >-
    Biallelic pathogenic variants in FIG4 impair the polyphosphoinositide
    5-phosphatase it encodes. FIG4 is a catalytic subunit of the PI(3,5)P2
    biosynthetic complex (with the kinase PIKFYVE and the scaffold VAC14). Loss
    of FIG4 removes both its catalytic activity and a non-catalytic,
    complex-stabilizing role, and because FIG4 is also required for normal
    PIKFYVE activity, its loss reduces rather than raises PI(3,5)P2. A
    catalytically inactive FIG4 transgene still prevents the early
    vacuolization and neurodegeneration, indicating that much of the early
    defect reflects loss of the structural role rather than catalysis.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    term:
      id: GO:0043813
      label: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endolysosome
    term:
      id: GO:0036019
      label: endolysosome
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: PI(3,5)P2 Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27292112
      reference_title: "Biallelic Mutations of VAC14 in Pediatric-Onset Neurological Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "A spontaneous null allele of Fig4 resulted in reduced abundance of PI(3,5)P2 and extensive neurodegeneration in the CNS and peripheral nervous system (PNS), which was rescued by a neuron-specific transgene."
      explanation: >-
        This is the sentence that links FIG4 loss directly to reduced PI(3,5)P2
        abundance (plus the resulting neurodegeneration).
  evidence:
  - reference: PMID:24598713
    reference_title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
    explanation: >-
      Identifies a biallelic FIG4 missense variant as the cause of the disorder.
  - reference: PMID:26604144
    reference_title: "Rescue of neurodegeneration in the Fig4 null mouse by a catalytically inactive FIG4 transgene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The lipid phosphatase FIG4 is a subunit of the protein complex that regulates biosynthesis of the signaling lipid PI(3,5)P2."
    explanation: >-
      States the molecular identity and complex membership of FIG4.
  - reference: PMID:26604144
    reference_title: "Rescue of neurodegeneration in the Fig4 null mouse by a catalytically inactive FIG4 transgene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the catalytically inactive FIG4 protein provides significant function, possibly by stabilization of the PI(3,5)P2 biosynthetic complex and/or localization of the complex to endolysosomal vesicles"
    explanation: >-
      A catalytically dead FIG4 transgene rescues the early phenotype, showing
      FIG4 has a non-catalytic complex-stabilizing role; it is the loss of the
      whole protein, not catalysis alone, that lowers PI(3,5)P2.

- name: PI(3,5)P2 Deficiency

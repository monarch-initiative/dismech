genetic:
- name: FIG4
  gene_term:
    preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic FIG4 variants cause the disorder. The originally reported family
    carried a homozygous missense variant, p.Asp783Val. No ClinGen gene-disease
    validity assertion is recorded for this specific entity; the gene-disease
    relationship rests on the segregating homozygous variant plus functional
    rescue data.
  variants:
  - name: p.Asp783Val
    description: >-
      Homozygous missense variant identified by exome sequencing in a
      consanguineous family and shown to be functionally deficient in a vacuole
      rescue assay.
    evidence:
    - reference: PMID:24598713
      reference_title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
      explanation: >-
        Reports the causal homozygous FIG4 missense variant.
  evidence:
  - reference: PMID:24598713
    reference_title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
    explanation: >-
      Establishes FIG4 as the causative gene.

notes: >-
  Terminology: the MONDO/OMIM concept (MONDO:0012986; OMIM 612691) is named
  "bilateral parasagittal parieto-occipital polymicrogyria", but the only
  clinical source, Baulac et al. 2014 (PMID:24598713), describes the family's
  malformation as temporo-occipital polymicrogyria. The entry's prose follows
  the source (temporo-occipital) while the disease_term carries the canonical
  MONDO label; the two wordings describe the same posterior cortical
  malformation. FIG4 is pleiotropic: biallelic variants also cause
  Charcot-Marie-Tooth disease type 4J and Yunis-Varon syndrome, and heterozygous
  variants are associated with ALS11. This entry is scoped to the polymicrogyria
  (cortical malformation with seizures) phenotype only, kept distinct from those
  entities per the granularity rules. The disorder was defined in a single
  consanguineous family, so the phenotype spectrum is based on limited cases.
  Management is symptomatic (e.g. seizure control); no disease-specific therapy
  is established, and none is cited here.

references:
- reference: PMID:24598713
  title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."

name: Bilateral Parasagittal Parieto-occipital Polymicrogyria
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
description: >-
  Bilateral parasagittal parieto-occipital polymicrogyria (also reported as
  bilateral temporo-occipital polymicrogyria with epilepsy and psychiatric
  manifestations) is an autosomal recessive malformation of cortical
  development caused by biallelic pathogenic variants in FIG4, which encodes a
  polyphosphoinositide 5-phosphatase subunit of the PI(3,5)P2 biosynthetic
  complex. Loss of FIG4 function reduces endolysosomal PI(3,5)P2 levels, leads
  to accumulation of enlarged endolysosomal vacuoles, and disrupts cerebral
  cortical development, manifesting clinically with posterior polymicrogyria,
  seizures, and psychiatric manifestations. Hippocampal and cerebellar
  developmental impairment has been shown only in Fig4-null mice.
synonyms:
- bilateral temporo-occipital polymicrogyria
- FIG4-related polymicrogyria with seizures
- polymicrogyria with seizures

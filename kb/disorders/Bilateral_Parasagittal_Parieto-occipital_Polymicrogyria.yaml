name: Bilateral Parasagittal Parieto-occipital Polymicrogyria
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
synonyms:
- bilateral temporo-occipital polymicrogyria
- FIG4-related polymicrogyria with seizures
- polymicrogyria with seizures
disease_term:
  preferred_term: bilateral parasagittal parieto-occipital polymicrogyria
  term:
    id: MONDO:0012986
    label: bilateral parasagittal parieto-occipital polymicrogyria
parents:
- Polymicrogyria

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The disorder was identified in a consanguineous family in which affected
    individuals were homozygous for a FIG4 missense variant, consistent with
    autosomal recessive inheritance.
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consanguineous Moroccan family with temporo-occipital polymicrogyria, psychiatric manifestations, and epilepsy"
    explanation: >-
      A homozygous variant segregating in a consanguineous family establishes
      autosomal recessive inheritance.

pathophysiology:
- name: FIG4 Loss of Function
  description: >-
    Biallelic pathogenic variants in FIG4 impair the function of the
    polyphosphoinositide 5-phosphatase it encodes. FIG4 is a catalytic subunit
    of the PI(3,5)P2 biosynthetic complex (with the kinase PIKFYVE and the
    scaffold VAC14); within this complex FIG4 is also required for normal
    PIKFYVE activity, so FIG4 loss reduces, rather than raises, PI(3,5)P2.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    term:
      id: GO:0043813
      label: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
  downstream:
  - target: PI(3,5)P2 Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26604144
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the phosphatase activity of FIG4 has an essential role in vivo"
      explanation: >-
        A phosphatase-dead Fig4 transgene fails to prevent the late neurological
        phenotype, demonstrating that loss of FIG4 catalytic activity is the
        driving molecular defect.
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
    explanation: >-
      Identifies a biallelic FIG4 missense variant as the cause of the disorder.
  - reference: PMID:26604144
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The lipid phosphatase FIG4 is a subunit of the protein complex that regulates biosynthesis of the signaling lipid PI(3,5)P2."
    explanation: >-
      States the molecular identity and complex membership of FIG4.

- name: PI(3,5)P2 Deficiency
  description: >-
    Loss of FIG4 function reduces the abundance of phosphatidylinositol
    3,5-bisphosphate, a low-abundance signaling lipid on the cytoplasmic surface
    of endolysosomal membranes to which neurons are especially sensitive.
  biological_scale: MOLECULAR
  downstream:
  - target: Endolysosomal Vacuolization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27292112
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Deficiency of PI(3,5)P2 results in enlarged endolysosomal vacuoles"
      explanation: >-
        Directly links the lipid deficiency to the endolysosomal vacuolization
        phenotype.
  evidence:
  - reference: PMID:27292112
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "A spontaneous null allele of Fig4 resulted in reduced abundance of PI(3,5)P2 and extensive neurodegeneration in the CNS and peripheral nervous system (PNS), which was rescued by a neuron-specific transgene."
    explanation: >-
      Establishes that FIG4 loss lowers PI(3,5)P2 abundance and causes CNS/PNS
      pathology in the mouse null allele.

- name: Endolysosomal Vacuolization
  description: >-
    PI(3,5)P2 deficiency causes accumulation of enlarged endolysosomal vacuoles,
    the cellular hallmark of this complex's dysfunction, demonstrated in patient
    and Fig4-deficient fibroblasts by a rescue assay.
  biological_scale: CELLULAR
  downstream:
  - target: Impaired Cerebral Cortical Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24598713
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Histologic examination of Fig4-null mouse brain revealed neurodevelopmental impairment in the hippocampus, cortex, and cerebellum as well as impaired cerebellar gyration/foliation reminiscent of human cortical malformations."
      explanation: >-
        The Fig4-null mouse links the cellular defect to abnormal cortical and
        cerebellar development that resembles the human cortical malformation.
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathogenicity of the variant was supported by impaired rescue of the enlarged vacuoles in transfected fibroblasts from Fig4-deficient mice."
    explanation: >-
      A rescue assay in Fig4-deficient fibroblasts shows the patient variant
      fails to resolve the enlarged vacuoles.

- name: Impaired Cerebral Cortical Development
  description: >-
    Disrupted endolysosomal homeostasis during corticogenesis produces an
    abnormal, excessively folded cortex (polymicrogyria) with a bilateral
    parasagittal parieto-occipital predominance.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  downstream:
  - target: Polymicrogyria
    causal_link_type: DIRECT

phenotypes:
- name: Polymicrogyria
  category: Imaging
  description: >-
    Bilateral parasagittal parieto-occipital polymicrogyria, the defining
    cortical malformation of the disorder.
  phenotype_term:
    preferred_term: Polymicrogyria
    term:
      id: HP:0002126
      label: Polymicrogyria
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study extends the spectrum of phenotypes associated with FIG4 mutations to include cortical malformation associated with seizures and psychiatric manifestations"
    explanation: >-
      Reports cortical malformation (polymicrogyria) as a FIG4-associated
      phenotype.

- name: Epilepsy
  category: Neurologic
  description: >-
    Seizures accompany the cortical malformation.
  phenotype_term:
    preferred_term: Seizures
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cortical malformation associated with seizures and psychiatric manifestations"
    explanation: >-
      Seizures are part of the FIG4 cortical-malformation phenotype.

- name: Psychiatric manifestations
  category: Neurologic
  description: >-
    Affected individuals have psychiatric manifestations; the source does not
    specify a single psychiatric diagnosis.
  phenotype_term:
    preferred_term: Psychiatric manifestations
    term:
      id: HP:0000708
      label: Atypical behavior
    coarse_binding_basis: SOURCE_UNSPECIFIED
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "temporo-occipital polymicrogyria, psychiatric manifestations, and epilepsy"
    explanation: >-
      Psychiatric manifestations are reported as part of the clinical picture.

genetic:
- name: FIG4
  gene_term:
    preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic FIG4 variants cause the disorder. The originally reported family
    carried a homozygous missense variant, p.Asp783Val. No ClinGen gene-disease
    validity assertion is recorded for this specific entity; the gene-disease
    relationship rests on the segregating homozygous variant plus functional
    rescue data.
  variants:
  - name: p.Asp783Val
    description: >-
      Homozygous missense variant identified by exome sequencing in a
      consanguineous family and shown to be functionally deficient in a vacuole
      rescue assay.
    evidence:
    - reference: PMID:24598713
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
      explanation: >-
        Reports the causal homozygous FIG4 missense variant.
  evidence:
  - reference: PMID:24598713
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene FIG4 was identified."
    explanation: >-
      Establishes FIG4 as the causative gene.

notes: >-
  FIG4 is pleiotropic: biallelic variants also cause Charcot-Marie-Tooth disease
  type 4J and Yunis-Varon syndrome, and heterozygous variants are associated
  with ALS11. This entry is scoped to the bilateral parasagittal
  parieto-occipital polymicrogyria (cortical malformation with seizures)
  phenotype only (MONDO:0012986), and is kept distinct from the other
  FIG4-related entities per the granularity rules. The disorder was defined in a
  single consanguineous family (PMID:24598713), so the phenotype spectrum is
  based on limited cases.

references:
- reference: PMID:24598713
  title: "Role of the phosphoinositide phosphatase FIG4 gene in familial epilepsy with polymicrogyria."

- name: Endolysosomal Vacuolization
  description: >-
    PI(3,5)P2 deficiency causes accumulation of enlarged endolysosomal vacuoles,
    the cellular hallmark of this complex's dysfunction. For this disorder it
    was shown by a rescue assay in transfected fibroblasts from Fig4-deficient
    mice, in which the patient variant failed to clear the vacuoles; patient
    cells were not examined.

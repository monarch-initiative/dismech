    evidence_source: IN_VITRO
    snippet: >-
      sensitized patients' peripheral blood mononuclear cells to RIPK1
      activation, apoptosis and necroptosis induced by TNF
    explanation: >-
      Documents the hypersensitivity of patient cells to TNF-induced apoptosis

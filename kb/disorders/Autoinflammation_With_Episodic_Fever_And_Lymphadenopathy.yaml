treatments:
- name: Tocilizumab (anti-IL-6 receptor)
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    The IL-6 receptor antagonist tocilizumab markedly reduces the severity and
    frequency of symptoms in most CRIA patients, unlike IL-1 and TNF
    antagonists.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Overproduction of Inflammatory Cytokines
    description: >-
      Blocking the IL-6 receptor interrupts the dominant effector cytokine of
      the RIPK1-driven inflammatory output.
    evidence:
    - reference: PMID:31827281
      reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        treatment with the IL-6 receptor antagonist tocilizumab markedly, and in
        some cases dramatically, reduced the severity and frequency of the
        symptoms
      explanation: >-
        Tocilizumab's efficacy implicates IL-6 as a dominant effector and shows
        the mechanism is drug-reversible at the cytokine-receptor level.
  evidence:
  - reference: PMID:31827281
    reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment with the IL-6 receptor antagonist tocilizumab markedly, and in
      some cases dramatically, reduced the severity and frequency of the
      symptoms of P1, P2, P3, P6 and P7
    explanation: >-
      Documents tocilizumab efficacy across most treated patients.
- name: TNF Inhibitor Therapy (ineffective)
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    TNF antagonists (etanercept) and the IL-1 receptor antagonist anakinra did
    not suppress inflammation in the original CRIA patients, which distinguishes
    the disease from many other autoinflammatory syndromes despite its
    TNF-signaling origin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
  evidence:
  - reference: PMID:31827281
    reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the IL-1 receptor antagonist, anakinra, and the TNF antagonist,
      etanercept, did not suppress inflammation in P1, P2, P4 or P7
    explanation: >-
      Documents the lack of response to TNF (and IL-1) blockade, refuting these
      as effective therapy.
animal_models:
- name: Ripk1 D325A knock-in mouse
  species: Mouse
  genotype: Ripk1 D325A (cleavage-resistant; mouse equivalent of human D324)
  publication: PMID:31827281
  modeled_mechanisms:
  - target: Hypersensitivity to TNF-Induced Apoptosis and Necroptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cells from the cleavage-resistant knock-in are hypersensitive to
      RIPK3-dependent TNF-induced apoptosis and necroptosis, and heterozygotes
      are hyper-responsive to inflammatory stimuli in vivo.
    limitations: >-
      Homozygous D325A mice die during embryogenesis (rescued by combined loss
      of Casp8 and Ripk3), so the viable disease-modelling genotype is the
      heterozygote; the embryonic phenotype has no human counterpart.
    evidence:
    - reference: PMID:31827281
      reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous Ripk1D325A/+ mice were viable and grossly normal, but were
        hyper-responsive to inflammatory stimuli in vivo.
      explanation: >-
        The heterozygous knock-in recapitulates the inflammatory
        hyper-responsiveness of the human disease.
notes: >-
  CRIA syndrome is the dominant, cleavage-resistant (gain-of-activation) RIPK1
  disease and must not be confused with autosomal recessive RIPK1 deficiency
  (immunodeficiency 57, OMIM 618108), which is the biallelic loss-of-function
  disorder with a different phenotype. The entry is deliberately not conformed
  to the Interleukin-6 Hypercytokinemia module: although IL-6 is the effective
  drug target, the rate-limiting mechanism here is cell-death hypersensitivity
  and RIPK1-driven cytokine output rather than ligand-driven gp130-JAK-STAT3
  signaling as the central step, and IL-6 is one of several cytokines
  (TNF, IL-1beta) induced. No cell-death autoinflammation module currently
  exists as a conformance target.

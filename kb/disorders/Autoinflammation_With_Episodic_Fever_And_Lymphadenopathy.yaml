name: Autoinflammation With Episodic Fever and Lymphadenopathy
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
description: >-
  Autoinflammation with episodic fever and lymphadenopathy, better known as
  cleavage-resistant RIPK1-induced autoinflammatory (CRIA) syndrome, is a
  dominantly inherited systemic autoinflammatory disease caused by germline
  heterozygous missense variants at the caspase-8 cleavage site of RIPK1
  (residue D324; e.g. D324N, D324H, D324Y, D324V). RIPK1 is a central regulator
  of TNF-receptor signaling that sits at the branch point between survival
  (NF-kappaB), apoptosis, and necroptosis. Caspase-8 normally cleaves RIPK1 at
  D324 to restrain its pro-death and pro-inflammatory activity; the variants
  make RIPK1 non-cleavable, leaving it hyperactivatable. Patient cells become
  hypersensitive to TNF-induced apoptosis and necroptosis and overproduce
  inflammatory cytokines and chemokines, producing lifelong episodic high
  fevers and prominent lymphadenopathy with hepatosplenomegaly, oral ulcers,
  arthralgia, and abdominal symptoms. The disease responds to IL-6 receptor
  blockade (tocilizumab) but characteristically not to TNF inhibitors.
synonyms:
- CRIA syndrome
- cleavage-resistant RIPK1-induced autoinflammatory syndrome
- AIEFL
- RIPK1-associated autoinflammatory disease, D324 variants

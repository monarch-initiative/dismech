    reference_title: "A dominant autoinflammatory disease caused by non-cleavable variants of RIPK1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      induction of pro-inflammatory cytokines such as IL-6 and TNF
    explanation: >-
      Documents induction of IL-6 and TNF as the inflammatory cytokines produced
      by the mutant.
  downstream:
  - target: Systemic Autoinflammation
    causal_link_type: DIRECT
- name: Systemic Autoinflammation
  biological_scale: ORGANISM
  description: >-
    Excessive cell death and cytokine overproduction produce a lifelong,
    IL-6-dominant systemic inflammatory state manifesting as episodic high
    fevers with prominent lymphadenopathy and other inflammatory features.
  evidence:
  - reference: PMID:31827281
    reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Members of three families presented with a previously undescribed
      autoinflammatory disorder characterised by fevers and pronounced
      lymphadenopathy beginning in early childhood and continuing throughout
      adulthood
    explanation: >-
      Describes the systemic autoinflammatory phenotype that the mechanism
      produces.

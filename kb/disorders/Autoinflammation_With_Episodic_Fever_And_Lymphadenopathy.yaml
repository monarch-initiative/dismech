- name: Overproduction of Inflammatory Cytokines
  biological_scale: CELLULAR
  description: >-
    Non-cleavable RIPK1 drives overproduction of inflammatory cytokines and
    chemokines, including IL-6 and TNF. IL-6 is the mediator whose blockade is
    clinically effective, whereas TNF blockade is not, implicating IL-6 as a
    dominant effector of the systemic inflammation.
  cell_types:

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    CRIA syndrome is inherited in an autosomal dominant manner; heterozygous
    D324 variants segregate with disease across generations, with variable
    frequency, duration, and age of onset of fever episodes even within a
    family.
  evidence:
  - reference: PMID:31827280
    reference_title: "A dominant autoinflammatory disease caused by non-cleavable variants of RIPK1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify two families with variants in RIPK1 (D324V and D324H)
      that lead to distinct symptoms of recurrent fevers and lymphadenopathy in
      an autosomal-dominant manner.
    explanation: >-
      Establishes autosomal dominant inheritance of the D324 RIPK1 variants with
      recurrent fever and lymphadenopathy.
pathophysiology:
- name: Caspase-8 Cleavage-Resistant RIPK1 Variant
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous missense variants at RIPK1 residue D324 (D324N, D324H,
    D324Y, D324V; also neighbouring L321 and D324 substitutions) prevent
    caspase-8 from cleaving RIPK1 at this site, which separates the kinase
    domain from the intermediate and death domains.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: SNV
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  evidence:
  - reference: PMID:31827281
    reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the heterozygous missense mutations D324N, D324H and D324Y prevent caspase
      cleavage of RIPK1 in humans and result in an early-onset periodic fever
      syndrome and severe intermittent lymphadenopathy
    explanation: >-
      Identifies the D324 variants as the causal lesion that prevents caspase
      cleavage of RIPK1.
  downstream:
  - target: Increased RIPK1 Activation
    causal_link_type: DIRECT
    description: >-
      Loss of the caspase-8 cleavage event removes a brake on RIPK1, leaving it
      hyperactivatable.
    evidence:
    - reference: PMID:31827280
      reference_title: "A dominant autoinflammatory disease caused by non-cleavable variants of RIPK1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Impaired cleavage of RIPK1 D324 variants by caspase-8 sensitized
        patients' peripheral blood mononuclear cells to RIPK1 activation
      explanation: >-
        Directly links impaired cleavage to increased RIPK1 activation in
        patient cells.
- name: Increased RIPK1 Activation
  biological_scale: MOLECULAR
  description: >-
    The non-cleavable RIPK1 is hyperactivatable. Its kinase activity drives both
    programmed cell death and inflammatory signaling downstream of the TNF
    receptor, which the cleavage event normally restrains throughout life.
  genes:
  - preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  molecular_functions:
  - preferred_term: RIPK1 protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:31827281
    reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      caspase cleavage of RIPK1 not only inhibits necroptosis but also maintains
      inflammatory homeostasis throughout life
    explanation: >-
      Establishes that the cleavage event restrains RIPK1-driven inflammation,
      so its loss raises RIPK1 activity.
  downstream:
  - target: Hypersensitivity to TNF-Induced Apoptosis and Necroptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31827281
      reference_title: "Mutations that prevent caspase cleavage of RIPK1 cause autoinflammatory disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Ripk1D325A/D325A and Ripk1D325A/+ cells were hypersensitive to
        RIPK3-dependent TNF-induced apoptosis and necroptosis
      explanation: >-
        Links increased RIPK1 activation to hypersensitivity to TNF-induced
        apoptosis and necroptosis.
  - target: Overproduction of Inflammatory Cytokines
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31827280
      reference_title: "A dominant autoinflammatory disease caused by non-cleavable variants of RIPK1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patients showed strong RIPK1-dependent activation of inflammatory
        signalling pathways and overproduction of inflammatory cytokines and
        chemokines compared with unaffected controls.
      explanation: >-
        Links increased RIPK1 activation to overproduction of inflammatory
        cytokines in patients.
- name: Hypersensitivity to TNF-Induced Apoptosis and Necroptosis
  biological_scale: CELLULAR
  description: >-
    Patient-derived mononuclear cells and mutant-expressing cells die
    excessively by RIPK3-dependent apoptosis and necroptosis when exposed to
    TNF. The resulting programmed cell death releases intracellular contents and
    amplifies inflammation.

      explanation: The same variants that bind chromatin more strongly increase repression of SATB1 reporter targets.
- name: Increased SATB1-Mediated Transcriptional Repression
  biological_scale: MOLECULAR
  description: >-
    The CUT-domain missense variants increase transcriptional repression of
    SATB1-responsive regulatory elements in reporter assays. Which endogenous
    neuronal or dental target genes are over-repressed in patients is not
    known, so the steps between this molecular state and the clinical features
    are not established.

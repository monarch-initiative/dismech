animal_models:
- name: Satb1 knockout mouse (enamel)
  species: Mouse
  genotype: Satb1-/- (homozygous null)
  publication: PMID:31830989
  description: >-
    Constitutive Satb1-null mice have deformed secretory ameloblasts lacking
    Tomes' processes and a thin layer of hypomineralized, non-prismatic enamel.
  modeled_mechanisms:
  - target: Defective Ameloblast Polarity and Enamel Matrix Secretion
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: Complete loss of Satb1 disrupts secretory ameloblast polarity and amelogenin secretion.
    limitations: >-
      Homozygous null allele, whereas the human disease is caused by
      heterozygous CUT-domain missense variants that increase chromatin
      binding; the mouse tests whether SATB1 is needed for enamel formation,
      not what a hyperbinding variant does to ameloblasts.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The disease lesion, a heterozygous CUT-domain missense variant that
        increases SATB1 chromatin binding, is not encoded; the mouse carries a
        homozygous null allele, the opposite direction of effect, so it shows
        that SATB1 is required in ameloblasts but not what a hyperbinding
        variant does there.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse incisors erupt continuously and their ameloblasts are studied in
        a renewing tissue, unlike human teeth whose enamel forms once.
    evidence:
    - reference: PMID:31830989
      reference_title: SATB1 establishes ameloblast cell polarity and regulates directional amelogenin secretion for enamel formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data show that SATB1 is essential for establishing secretory ameloblast cell polarity and for EMP secretion."
      explanation: The knockout establishes the ameloblast polarity and secretion defect this node describes.
discussions:
- discussion_id: satb1_missense_dental_mechanism
  prompt: >-
    Do SATB1 CUT-domain missense variants cause dental anomalies through the
    same ameloblast polarity and enamel-secretion defect seen in Satb1-null
    mice, given that the human variants increase rather than remove SATB1
    chromatin binding?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Ameloblast Polarity and Enamel Matrix Secretion
  - animal_models#Mouse
  rationale: >-
    The only cellular evidence for a dental mechanism is from a homozygous
    null mouse, while the human disease is caused by heterozygous variants that
    bind chromatin more strongly. Over-repression and absence of SATB1 could
    converge on the same ameloblast targets or act through different ones; no
    knock-in model or patient tooth histology has tested this.
- discussion_id: satb1_missense_neural_targets
  prompt: >-
    Which endogenous SATB1 target genes are over-repressed by CUT-domain
    missense variants in developing neurons, and which of them account for the
    epileptic encephalopathy and intellectual disability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased SATB1-Mediated Transcriptional Repression
  rationale: >-
    Increased repression has been shown only on reporter constructs in a
    non-neural cell line, so every edge from the molecular state to the
    neurological phenotypes is recorded with unknown intermediates. No
    heterozygous knock-in animal model or patient-derived neuronal model of a
    CUT-domain missense variant has been reported.
notes: >-
  Scope: MONDO:0030990 corresponds to OMIM 619229 (den Hoed-de Boer-Voisin
  syndrome), the CUT1/CUT2 missense SATB1 disorder. The truncating and deletion
  SATB1 disorder (OMIM 619228, MONDO:0030988, DEFDA) has its own curation stub
  and is recorded here as a differential diagnosis, not as a subtype. Orphanet
  ORPHA:684232 covers both disorders in one record. No GeneReviews chapter
  exists for SATB1 disease. No disease-specific or variant-class-specific
  treatment data were found: the published antiseizure treatment case reports
  (valproate, oxcarbazepine) concern truncating variants, a sulthiame series
  does not state the SATB1 variant class, and the 2025 rat Satb1 truncation
  model (PMID:40571781) and its clonazepam rescue model a truncating allele,
  so none of these is recorded for this entry. The discovery study
  (PMID:33513338) is available here only as its abstract, so per-feature
  frequencies in missense cases are not recorded.

name: Den Hoed-de Boer-Voisin Syndrome
category: Mendelian
creation_date: "2026-10-27T14:59:10Z"
synonyms:
- Kohlschutter-Tonz syndrome-like
- KTZSL
- DHDBV
- SATB1-related neurodevelopmental disorder, CUT-domain missense type
description: >-
  Den Hoed-de Boer-Voisin syndrome (MONDO "Kohlschutter-Tonz syndrome-like",
  OMIM 619229) is an autosomal dominant, usually de novo neurodevelopmental
  disorder caused by heterozygous missense variants in the CUT1 and CUT2
  DNA-binding domains of SATB1, a nuclear chromatin organizer and
  transcriptional regulator. Affected individuals have global developmental
  delay, moderate to severe intellectual disability, speech delay, autistic
  features, dysmorphic facial features, dental anomalies, and early-onset,
  often pharmacoresistant epileptic encephalopathy with hypsarrhythmia, with
  brain atrophy, ventricular enlargement and incomplete myelination on MRI. In
  cell-based assays the disease missense variants bind chromatin more strongly
  and repress SATB1 target reporters more than wild-type protein. The name
  "Kohlschutter-Tonz syndrome-like" reflects clinical resemblance to the
  autosomal recessive ROGDI- and SLC13A5-related Kohlschutter-Tonz syndrome
  (epilepsy, developmental delay and enamel defects); the genes, inheritance
  and mechanism differ. SATB1 haploinsufficiency and truncating variants cause
  a separate, milder allelic disorder (developmental delay with dysmorphic
  facies and dental anomalies, DEFDA).

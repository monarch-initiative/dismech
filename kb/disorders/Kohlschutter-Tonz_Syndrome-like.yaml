- name: Defective Ameloblast Polarity and Enamel Matrix Secretion
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In Satb1-null mice, secretory ameloblasts lose Tomes' processes, apical
    actin organization and inter-ameloblast adhesion, retain amelogenin
    intracellularly, and deposit a thin layer of hypomineralized,
    non-prismatic enamel. SATB1-dependent Eps8 expression is implicated in
    forming the apical secretory protrusion. Whether the same cellular defect
    underlies the dental anomalies of patients with CUT-domain missense
    variants is untested.
  cell_types:
  - preferred_term: secretory-stage ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: establishment of epithelial cell apical/basal polarity
    term:
      id: GO:0045198
      label: establishment of epithelial cell apical/basal polarity
    modifier: DECREASED
  - preferred_term: enamel matrix protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  - preferred_term: amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:31830989
    reference_title: SATB1 establishes ameloblast cell polarity and regulates directional amelogenin secretion for enamel formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our data show that SATB1 is essential for establishing secretory ameloblast cell polarity and for EMP secretion."
    explanation: >-
      Knockout-mouse evidence that SATB1 is required for ameloblast polarity
      and enamel matrix protein secretion; indirect for this disease because
      the mouse allele is a null, not a CUT-domain missense variant.
  downstream:
  - target: Abnormality of the dentition
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31830989
      reference_title: SATB1 establishes ameloblast cell polarity and regulates directional amelogenin secretion for enamel formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In line with the deformed apical architecture, amelogenin transport to the apical secretory front and secretion into enamel space were impeded in Satb1-/- SABs resulting in a massive cytoplasmic accumulation of amelogenins and a thin layer of hypomineralized enamel."
      explanation: In the null mouse, defective ameloblast secretion produces thin, hypomineralized enamel.

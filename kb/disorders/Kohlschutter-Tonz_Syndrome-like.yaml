pathophysiology:
- name: SATB1 CUT-Domain Missense Hyperbinding to Chromatin
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants clustered in the CUT1 and CUT2 DNA-binding
    domains of SATB1 make the protein bind chromatin more strongly than
    wild-type SATB1 in cell-based assays. Because the variant protein is
    present and more active rather than absent, this is an altered/increased
    function mechanism, unlike the haploinsufficiency that underlies the milder
    allelic DEFDA.
  role: trigger
  genes:
  - preferred_term: SATB1
    term:
      id: hgnc:10541
      label: SATB1
  genetic_context:
    gene:
      preferred_term: SATB1
      term:
        id: hgnc:10541
        label: SATB1
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      CUT1/CUT2 missense variants with stronger chromatin binding and increased
      transcriptional repression in functional assays; described as
      gain-of-function in later literature. Most are de novo, although
      inherited cases occur.
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: INCREASED
  evidence:
  - reference: PMID:33513338
    reference_title: Mutation-specific pathophysiological mechanisms define different neurodevelopmental disorders associated with SATB1 dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Missense variants in the CUT1 and CUT2 DNA-binding domains result in stronger chromatin binding, increased transcriptional repression, and a severe phenotype."
    explanation: The discovery study's functional assays show stronger chromatin binding for CUT1/CUT2 missense variants.
  - reference: PMID:38790177
    reference_title: "Non-Specific Epileptic Activity, EEG, and Brain Imaging in Loss of Function Variants in SATB1: A New Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro functional studies have demonstrated that missense variants can cause stronger chromatin binding and increase transcriptional repression, while LoF/PTVs are mislocalized in the cell nucleus and may have variable effects on SATB1 transcriptional activity"
    explanation: Review restating the in vitro finding that distinguishes missense from truncating variants.
  - reference: PMID:42195022
    reference_title: Identification and Functional Characterization of a Novel De Novo SATB1 Frameshift Variant in a Patient with Epilepsy-Dominant Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the clinical phenotypes of patients harboring these truncating variants are notably milder than those with gain-of-function (GoF) missense mutations of SATB1"
    explanation: Characterizes the disease missense variants as gain-of-function, in contrast to milder truncating variants.

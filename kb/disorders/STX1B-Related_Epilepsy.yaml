- name: Impaired SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    Syntaxin-1B is one of the three core neuronal SNAREs whose calcium-triggered
    zippering fuses the synaptic vesicle with the presynaptic membrane. Impaired
    syntaxin-1B function degrades SNARE-complex assembly and disturbs
    neurotransmitter release, implicating the presynaptic release machinery in the
    disorder. This is the module's key conformance target — the fusion-machinery
    arm.

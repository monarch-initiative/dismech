  description: >-
    STX1B variants cosegregate as an autosomal dominant trait in large pedigrees;
    de novo variants (including a microdeletion) also occur.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing in independent large pedigrees identified
      cosegregating STX1B mutations predicted to cause an early truncation or an
      in-frame insertion or deletion.
    explanation: >-
      Establishes the autosomal dominant, cosegregating inheritance of STX1B
      variants.
pathophysiology:
- name: Syntaxin-1B t-SNARE Deficiency
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    STX1B encodes syntaxin-1B, a plasma-membrane t-SNARE of the presynaptic release
    machinery. Truncating, in-frame indel, missense, and whole-gene-deletion
    variants reduce or impair syntaxin-1B function. Syntaxin-1B is chaperoned by
    Munc18-1 and partners with SNAP-25 and VAMP2 in the SNARE complex, so its
    deficiency degrades the fusion machinery.

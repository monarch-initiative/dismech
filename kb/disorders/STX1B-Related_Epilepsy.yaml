discussions:
- discussion_id: gap_stx1b_temperature_sensitivity_mechanism
  prompt: >-
    What is the molecular basis by which syntaxin-1B deficiency renders synaptic
    vesicle fusion temperature-sensitive, so that seizures cluster with fever
    rather than occurring uniformly across the physiological temperature range?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  - pathophysiology#Temperature-Sensitive Cortical Hyperexcitability
  rationale: >-
    The defining clinical feature of STX1B-related epilepsy is fever-triggered
    seizures, and the zebrafish stx1b-knockdown model reproduces a highly
    temperature-sensitive epileptiform phenotype. Yet the biophysical mechanism
    linking reduced syntaxin-1B dosage to temperature-dependent release failure
    is unresolved: whether a partially depleted SNARE machine has reduced thermal
    reserve, whether syntaxin-1B/Munc18-1 chaperoning is temperature-labile, or
    whether excitatory and inhibitory terminals fail asymmetrically as
    temperature rises. Distinguishing these is prerequisite to explaining the
    fever specificity and to rational antipyretic-independent therapy.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Video and local field potential analyses of zebrafish larvae with antisense
      knockdown of stx1b showed seizure-like behavior and epileptiform discharges
      that were highly sensitive to increased temperature.
    explanation: >-
      Establishes the temperature-sensitive phenotype whose molecular mechanism
      remains unexplained.
  proposed_experiments:
  - experiment_id: exp_stx1b_temperature_release_titration
    name: Temperature-dependent release titration in syntaxin-1B-reduced neurons
    description: >-
      In human iPSC-derived neurons with graded syntaxin-1B reduction (allelic
      series spanning haploinsufficiency to near-complete loss), measure
      evoked and spontaneous excitatory and inhibitory release across a
      controlled temperature ramp, correlating release probability and
      SNARE-complex assembly with temperature to test whether reduced dosage
      narrows the thermal operating range.
    experiment_type:
      preferred_term: temperature-dependent synaptic release titration
    perturbations:
    - name: Graded syntaxin-1B reduction
      target: pathophysiology#Syntaxin-1B t-SNARE Deficiency
      genes:
      - preferred_term: STX1B
        term:
          id: hgnc:18539
          label: STX1B
      description: >-
        Titrate syntaxin-1B levels across an allelic series in an isogenic
        human neuronal background.
    readouts:
    - name: Temperature-resolved synaptic release and fusion
      target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: calcium-dependent activation of synaptic vesicle fusion
        term:
          id: GO:0099502
          label: calcium-dependent activation of synaptic vesicle fusion
        modifier: DECREASED
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology
      - preferred_term: live-cell imaging assay
      direction: NEGATIVE
    controls:
    - name: Wild-type syntaxin-1B neurons
      description: Isogenic neurons with unperturbed syntaxin-1B across the same temperature ramp.
    decision_criterion: >-
      A dosage-dependent narrowing of the thermal operating range for evoked
      release, emerging selectively at febrile temperatures, would support
      reduced thermal reserve of the depleted SNARE machine as the mechanism.
    would_support:
    - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
    - pathophysiology#Temperature-Sensitive Cortical Hyperexcitability

- discussion_id: gap_stx1b_genotype_severity_determinants
  prompt: >-
    What determines an individual's position on the STX1B severity spectrum
    (simple febrile seizures, to GEFS+, to developmental and epileptic
    encephalopathy) - is it primarily loss-of-function dosage versus
    missense/dominant-negative effect, or do modifiers dominate?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Syntaxin-1B t-SNARE Deficiency
  rationale: >-
    STX1B variants span early-truncating and whole-gene-deletion (clear
    haploinsufficiency) through in-frame indel and missense changes that could
    act as reduced-function or dominant-negative alleles incorporated into the
    SNARE complex. The reported phenotype ranges from benign febrile seizures to
    severe encephalopathy, but whether variant class predicts severity - or
    whether genetic background and other GEFS+ modifiers dominate - is
    unresolved. This directly affects prognostic counseling and whether a
    variant should be curated as a distinct severity subtype.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three additional nonsense or missense mutations and a de novo microdeletion
      encompassing STX1B were then identified in 449 familial or sporadic cases.
    explanation: >-
      Documents the heterogeneous variant spectrum (truncating, missense,
      whole-gene deletion) whose relation to severity is the open question.
  proposed_experiments:
  - experiment_id: exp_stx1b_variant_class_functional_severity
    name: Variant-class functional stratification against clinical severity
    description: >-
      Introduce a panel of reported STX1B variants (truncating, whole-gene
      loss, in-frame indel, missense) into an isogenic neuronal background and
      quantify release deficit and dominant-negative incorporation into the
      SNARE complex, then test whether the functional severity ranking
      correlates with the documented clinical severity of carriers.
    experiment_type:
      preferred_term: variant functional stratification experiment
    perturbations:
    - name: STX1B allelic panel knock-in
      target: pathophysiology#Syntaxin-1B t-SNARE Deficiency
      genes:
      - preferred_term: STX1B
        term:
          id: hgnc:18539
          label: STX1B
      description: >-
        Knock in individual STX1B variant classes into a shared human neuronal
        background for standardized functional comparison.
    readouts:
    - name: Release deficit and SNARE-complex incorporation
      target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology
      - preferred_term: co-immunoprecipitation assay
      direction: NEGATIVE
    controls:
    - name: Wild-type STX1B knock-in
      description: Isogenic neurons carrying wild-type STX1B.
    - name: Benign population variant
      description: A population variant incompatible with disease causality.
    decision_criterion: >-
      If functional severity rank (dominant-negative missense worst,
      haploinsufficiency intermediate) tracks clinical severity, variant class
      is a primary determinant; a weak correlation implicates modifiers.
    would_support:
    - pathophysiology#Syntaxin-1B t-SNARE Deficiency

- discussion_id: gap_stx1b_stx1a_redundancy_therapeutic_lever
  prompt: >-
    Does the closely related paralog syntaxin-1A partially compensate for
    syntaxin-1B loss, and could its regional/developmental expression explain
    phenotype variability and offer a therapeutic lever (upregulating STX1A to
    rescue release)?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  rationale: >-
    Syntaxin-1A and syntaxin-1B are highly homologous plasma-membrane t-SNAREs
    that can both support calcium-triggered fusion, so residual release in
    STX1B-deficient neurons may depend on syntaxin-1A availability. If
    compensation is incomplete and varies with the regional and developmental
    expression ratio of the two paralogs, that could contribute to the
    fever-dependence and phenotypic variability - and raising syntaxin-1A
    expression or function becomes a candidate disease-modifying strategy. This
    is an emerging, largely untested hypothesis for STX1B disease rather than an
    established mechanism.
  evidence:

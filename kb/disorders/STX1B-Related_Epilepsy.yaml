name: STX1B-Related Epilepsy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  An epilepsy spectrum caused by variants in STX1B, which encodes syntaxin-1B, a
  core plasma-membrane (t-)SNARE of the presynaptic release machinery. With its
  partners SNAP-25 and synaptobrevin-2/VAMP2, syntaxin-1B forms the neuronal SNARE
  complex that drives calcium-triggered synaptic vesicle fusion; it is also
  chaperoned by Munc18-1 (STXBP1). Truncating, in-frame indel, missense, and
  whole-gene-deletion variants impair the release machinery, producing
  fever-associated epilepsy syndromes ranging from simple febrile seizures to
  generalized epilepsy with febrile seizures plus (GEFS+), and in some individuals
  a more severe developmental and epileptic encephalopathy. It is one of the
  SNAREopathies and completes the three core neuronal SNAREs among the synaptic
  vesicle cycle disorders (the plasma-membrane t-SNARE, alongside SNAP-25 and the
  v-SNARE VAMP2).
category: Mendelian

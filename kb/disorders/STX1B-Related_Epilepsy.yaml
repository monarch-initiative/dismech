- name: Temperature-Sensitive Cortical Hyperexcitability
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Impaired presynaptic release disturbs cortical excitatory/inhibitory balance,
    producing neuronal hyperexcitability with a characteristic temperature
    sensitivity: in a zebrafish stx1b-knockdown model, seizure-like behavior and
    epileptiform discharges are highly sensitive to increased temperature,
    mirroring the fever-triggered seizures in patients.
  role: effector

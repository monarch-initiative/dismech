differential_diagnoses:
- name: Other GEFS+ genes (SCN1A, SCN1B, GABRG2)
  description: >-
    Generalized epilepsy with febrile seizures plus is genetically heterogeneous;
    SCN1A, SCN1B, and GABRG2 are the classic GEFS+ genes and are distinguished from
    STX1B by molecular testing.
  distinguishing_features:
  - A pathogenic STX1B variant favors this disorder.
  - A variant in SCN1A, SCN1B, or GABRG2 favors that GEFS+ subtype.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent mutations in three main genes (SCN1A, SCN1B and GABRG2) have been
      identified that cause febrile seizures with or without epilepsy.
    explanation: >-
      Names the classic GEFS+ genes that constitute the molecular differential
      diagnosis.
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Other SNARE-machinery and synaptic vesicle cycle disorders (SNAP25, VAMP2,
    STXBP1) overlap through early-onset epilepsy and developmental impairment and
    are distinguished by molecular testing.
  distinguishing_features:
  - A pathogenic STX1B variant favors this disorder.
  - A variant in another SNARE/vesicle-cycle gene favors the corresponding SNAREopathy.
animal_models:
- species: Zebrafish (Danio rerio)
  genotype: stx1b antisense knockdown (morphant)
  description: >-
    Zebrafish larvae with antisense knockdown of stx1b show seizure-like behavior
    and epileptiform discharges that are highly sensitive to increased temperature;
    wild-type human syntaxin-1B, but not a mutated protein, rescues the phenotype,
    demonstrating the loss-of-function, temperature-sensitive mechanism.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Wild-type human syntaxin-1B but not a mutated protein rescued the effects of
      stx1b knockdown in zebrafish.
    explanation: >-
      Rescue by wild-type but not mutant syntaxin-1B confirms the loss-of-function
      disease mechanism.
progression:
- phase: Childhood
  notes: >-
    Presentation is typically with febrile seizures in early childhood, which may be
    followed by afebrile seizures (GEFS+); a subset progress to a more severe
    developmental and epileptic encephalopathy.
  evidence:
  - reference: PMID:25362483
    reference_title: "Mutations in STX1B, encoding a presynaptic protein, cause fever-associated epilepsy syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile seizures affect 2-4% of all children and have a strong genetic
      component.
    explanation: >-
      Contextualizes the childhood febrile-seizure presentation.

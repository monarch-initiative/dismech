inheritance:
- name: X-linked recessive
  description: >-
    Hemizygous males carry the full syndrome. Heterozygous females show
    Blaschko-linear pigmentation without systemic disease, which is why some
    authors describe the pattern as X-linked dominant with variable
    expressivity; the systemic phenotype, and the naming in OMIM and most
    reports, follow a recessive pattern. Skewed X-inactivation has been shown
    in a carrier mother's lymphocytes.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:23613254
    reference_title: "X-linked reticulate pigmentary disorder with systemic manifestations: a new family and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is an extremely rare genodermatosis with recessive X-linked inheritance but unknown molecular basis"
    explanation: >-
      A family report and literature review stating X-linked recessive
      inheritance.
  - reference: PMID:23613254
    reference_title: "X-linked reticulate pigmentary disorder with systemic manifestations: a new family and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the carrier females, manifestations are apparently limited to the skin with patchy linear hyperpigmentation following the lines of Blaschko that are similar to stage III incontinentia pigmenti."
    explanation: >-
      Heterozygous females are limited to cutaneous signs, the sex-dependent
      expression expected for an X-linked recessive disorder.
  - reference: PMID:18404279
    reference_title: "Refined mapping of X-linked reticulate pigmentary disorder and sequencing of candidate genes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is X-linked dominant with variable expressivity, with males much more severely affected than females."
    explanation: >-
      The linkage study that narrowed the locus modelled the disorder as
      X-linked dominant, since carrier females show a cutaneous phenotype.
      This is a disagreement about labelling rather than about the pedigrees
      themselves, but it contradicts the recessive label as written.
  - reference: PMID:15844784
    reference_title: "X-linked reticulate pigmentary layer. Report of a new patient and demonstration of a skewed X-inactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skewed X-inactivation patterns were detected in the mother's lymphocytes."
    explanation: >-
      Skewed X-inactivation in a carrier mother fits the limited female
      phenotype.
pathophysiology:
- name: POLA1 Intronic Splice Variant and Reduced POLA1 Expression
  biological_scale: MOLECULAR
  description: >-
    A recurrent deep intronic POLA1 variant (c.1375-354A>G on NM_016937;
    c.1393-354A>G on NM_001330360.2) causes aberrant splicing and reduces
    POLA1 transcript and protein. The same variant is found in every
    genetically confirmed case. Because complete POLA1 loss appears to be
    lethal in males, the variant is best read as hypomorphic.
  genetic_context:
    gene:
      preferred_term: POLA1
      term:
        id: hgnc:9173
        label: POLA1
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: DNA polymerase-alpha catalytic activity
    term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    modifier: DECREASED
  genes:
  - preferred_term: POLA1
    term:
      id: hgnc:9173
      label: POLA1
  evidence:
  - reference: PMID:27019227
    reference_title: "DNA polymerase-α regulates the activation of type I interferons through cytosolic RNA:DNA synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered that XLPDR is caused by an intronic mutation that disrupts the expression of POLA1, which encodes the catalytic subunit of DNA polymerase-α."
    explanation: >-
      The gene-discovery study identifies the causal intronic POLA1 variant
      and its effect on expression.
  - reference: PMID:32989594
    reference_title: "JAK Inhibition in a Patient with X-Linked Reticulate Pigmentary Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "An intronic POLA1 mutation (c.1375-354A>G), causing altered POLA1 gene splicing, leads to reduced transcript and protein levels."
    explanation: >-
      Names the variant and summarises the splicing and expression
      consequence. From the introduction of a case letter, restating the
      2016 discovery work.
  - reference: PMID:33392852
    reference_title: "Immune Dysfunction in Mendelian Disorders of POLA1 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date, all XLPDR cases are caused by the same recurrent intronic mutation, which results in gene missplicing."
    explanation: >-
      A review by the discovering group states that the variant is shared by
      all known cases and acts through missplicing.
  - reference: PMID:36182037
    reference_title: "A Xp22.11-p21.3 microdeletion in a three-generation family supports male lethality of POLA1 nullisomy resulting in reduced fertility of female carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support the hypothesis of very early embryonic lethality in males with POLA1 nullisomy"
    explanation: >-
      A family carrying a POLA1-spanning deletion supports male lethality of
      complete POLA1 loss, which is why the XLPDR variant must be partial.
  downstream:
  - target: Impaired Cytosolic RNA:DNA Hybrid Synthesis
    description: >-
      Reduced POLA1 lowers synthesis of cytosolic RNA:DNA hybrids.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27019227

      id: hgnc:9173
      label: POLA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The disease has so far shown no allelic heterogeneity. Other hypomorphic
    POLA1 variants cause a different disorder, van Esch-O'Driscoll syndrome,
    and POLA1 is also reported as an X-linked dyskeratosis congenita gene. No
    ClinGen gene-disease validity record for POLA1 and this disease is cached
    in the repository, so no validity tier is recorded. In one patient the
    variant arose de novo.

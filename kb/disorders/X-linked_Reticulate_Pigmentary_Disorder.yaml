- name: Impaired Cytosolic RNA:DNA Hybrid Synthesis
  biological_scale: MOLECULAR
  description: >-
    Besides priming DNA replication, POLA1 synthesises RNA:DNA hybrids in the
    cytosol, and these hybrids modulate the interferon response. With less
    POLA1 their synthesis falls, removing a brake on type I interferon
    induction. The nucleic-acid sensor that responds is not curated here; see
    the knowledge gap below.
  molecular_functions:
  - preferred_term: DNA polymerase-alpha catalytic activity
    term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    modifier: DECREASED
  genes:
  - preferred_term: POLA1
    term:
      id: hgnc:9173
      label: POLA1
  evidence:
  - reference: PMID:27019227
    reference_title: "DNA polymerase-α regulates the activation of type I interferons through cytosolic RNA:DNA synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This enzyme is necessary for the synthesis of RNA:DNA primers during DNA replication and, strikingly, we found that POLA1 is also required for the synthesis of cytosolic RNA:DNA, which directly modulates interferon activation."
    explanation: >-
      Places the cytosolic RNA:DNA product of POLA1 directly upstream of
      interferon activation.
  downstream:
  - target: Constitutive Type I Interferon Activation
    description: >-
      Loss of cytosolic RNA:DNA removes a restraint on the type I interferon
      response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27019227

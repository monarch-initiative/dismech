  description: >-
    Skin biopsies from both sexes show degenerating or necrotic keratinocytes
    and pigment dropping into the dermis, where it is taken up by
    melanophages. How POLA1 deficiency injures the epidermis, and whether
    interferon signalling is involved, has not been shown.

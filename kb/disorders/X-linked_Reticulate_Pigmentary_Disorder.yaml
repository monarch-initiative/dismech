      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Unexpectedly, POLA1 deficiency resulted in increased production of type I interferons."
      explanation: >-
        POLA1 deficiency raises type I interferon production, the
        consequence of losing the modulating RNA:DNA species.

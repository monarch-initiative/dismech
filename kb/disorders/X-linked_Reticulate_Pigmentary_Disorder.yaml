discussions:
- discussion_id: xlpdr_pigmentary_ectodermal_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Basal Keratinocyte Injury
  - phenotypes#Hypohidrosis
  - phenotypes#Frontal upsweep of hair
  prompt: >-
    How does partial POLA1 deficiency cause the reticulate pigmentation,
    keratinocyte injury, hypohidrosis and characteristic hair and facies of
    XLPDR, and is type I interferon signalling involved?
  rationale: >-
    The interferon and NK-cell arms explain the inflammatory and infectious
    features, but no cited study links either to the skin and ectodermal
    phenotype. A 2022 case report says the mechanisms for pigmentation remain
    elusive and suggests dermal melanophages and amyloid-like material may be
    responsible. So the keratinocyte injury node in this entry has no
    upstream edge, and hypohidrosis and the facial features are not wired to
    any mechanism.
- discussion_id: xlpdr_nucleic_acid_sensor
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Cytosolic RNA:DNA Hybrid Synthesis
  - pathophysiology#Constitutive Type I Interferon Activation
  prompt: >-
    Which cytosolic nucleic-acid sensor detects the change caused by reduced
    POLA1-derived RNA:DNA and drives type I interferon in XLPDR?
  rationale: >-
    The 2016 discovery work shows that POLA1 is needed for cytosolic RNA:DNA
    synthesis and that this RNA:DNA modulates interferon activation. The
    abstracts cited here do not name the sensor, so whether the pathway runs
    through cGAS-STING or another sensor is not curated. The edge from
    reduced RNA:DNA to interferon activation stands without a named
    intermediate.
- discussion_id: xlpdr_nk_defect_constancy
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Impaired NK Cell Maturation and Cytotoxicity
  prompt: >-
    Is the NK-cell defect a constant feature of XLPDR, and is it enough to
    explain the recurrent infections?
  rationale: >-
    The founding NK study and a Swiss case found low, immature and poorly
    cytotoxic NK cells, but a genetically confirmed patient had normal NK
    cytotoxicity and degranulation, and his authors conclude the defect may
    not be constant. The review from the discovering group says NK
    dysfunction "may explain" the infections, but this has not been tested
    directly.

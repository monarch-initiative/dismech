treatments:
- name: Tofacitinib
  description: >-
    Oral JAK1/3 inhibitor, chosen because type I interferon receptors signal
    through JAK-STAT. In one boy with interferon-driven colitis it was given
    as monotherapy (10 mg daily for 14 days, then 5 mg daily). Abdominal pain
    and faecal calprotectin fell, blood ISG expression tended to fall, and no
    bacterial or opportunistic infections occurred in the first 8 months.
    This is a single uncontrolled case.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofacitinib
      term:
        id: CHEBI:71200
        label: tofacitinib
  target_mechanisms:
  - target: Constitutive Type I Interferon Activation
    description: >-
      JAK inhibition blocks signalling downstream of the type I interferon
      receptor.
    evidence:
    - reference: PMID:32989594
      reference_title: "JAK Inhibition in a Patient with X-Linked Reticulate Pigmentary Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There was a tendency of reduced ISG in peripheral blood when re-assessed after 8 weeks and 8 months of JAK inhibition"
      explanation: >-
        The interferon signature tended to fall on treatment. The authors
        call it a tendency; this is one patient.
  evidence:
  - reference: PMID:32989594
    reference_title: "JAK Inhibition in a Patient with X-Linked Reticulate Pigmentary Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

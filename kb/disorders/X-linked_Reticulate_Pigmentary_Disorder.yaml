name: X-linked Reticulate Pigmentary Disorder
creation_date: "2026-09-30T00:00:00Z"
category: Mendelian
description: >-
  X-linked reticulate pigmentary disorder (XLPDR, OMIM 301220) is a very rare
  genodermatosis and primary immunodeficiency with autoinflammatory features.
  Hemizygous males develop diffuse reticulate hyperpigmentation with mottled
  hypopigmentation, hypohidrosis, dry skin, a characteristic facies with an
  upswept frontal hairline and flared eyebrows, and a systemic disease of
  infancy onward: colitis and chronic diarrhoea with failure to thrive,
  recurrent pneumonia progressing to bronchiectasis, corneal disease with
  photophobia, and urethral stricture. Heterozygous females usually show only
  linear hyperpigmentation along the lines of Blaschko, resembling stage III
  incontinentia pigmenti, without systemic involvement.

  Every genetically confirmed case carries the same recurrent intronic variant
  in POLA1, the catalytic subunit of DNA polymerase-alpha, which causes
  missplicing and reduced POLA1 expression. Complete POLA1 loss is thought to
  be lethal in males, so the variant acts as a hypomorph. Reduced POLA1
  impairs the synthesis of cytosolic RNA:DNA hybrids that restrain the type I
  interferon response, so patients carry a constitutive interferon signature
  and sterile multiorgan inflammation; this places XLPDR among the type I
  interferonopathies, although, unlike most of them, it is not accompanied by
  autoantibodies. A separate arm of the mechanism depletes MCM4 and impairs
  NK-cell maturation and cytotoxicity, which is the proposed explanation for
  the recurrent infections. The cause of the pigmentary and ectodermal
  features is not established. Treatment is supportive; a single patient with
  interferon-driven colitis responded to the JAK inhibitor tofacitinib.

  description: MCT can provide alternate fuel when triheptanoin is unavailable. GeneReviews suggests 10%-30% of calories. C8 can bypass the shuttle; C10 and longer fatty acyl moieties in commercial formulations remain shuttle-dependent, so some centers prefer C8 oil. Formulation and dose require metabolic-dietitian supervision.

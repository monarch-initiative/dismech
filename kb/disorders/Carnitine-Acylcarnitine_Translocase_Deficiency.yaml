histopathology:
- name: Hepatic microvesicular steatosis
  finding_term:
    preferred_term: Microvesicular Steatosis
    term:
      id: NCIT:C82982
      label: Microvesicular Steatosis
  description: Hepatic microvesicular steatosis was present together with macrovesicular steatosis in a reported autopsy. The index liver lacked inflammation or fibrosis. The morphology is not disease-specific.
  evidence:
  - reference: PMID:38628283
    reference_title: 'Carnitine-acylcarnitine translocase deficiency: a case report with autopsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The steatosis was both macrovesicular (~100% hepatocytes) and microvesicular, with the microvesicular fat being obscured by the macrovesicular fat.
    explanation: Documents both hepatic patterns in the index autopsy.
  - reference: PMID:38628283
    reference_title: 'Carnitine-acylcarnitine translocase deficiency: a case report with autopsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No inflammation, portal or perisinusoidal fibrosis, or cholangiopathy was seen.
    explanation: Distinguishes the index liver from fibrosis reported in a sibling without genetic confirmation.
  notes: The 2024 index autopsy had one likely pathogenic SLC25A20 variant and one variant of uncertain significance. The clinical/pathological diagnosis supports a reported association; it does not establish pathogenicity of the VUS or chemically identify the lipid droplets.
- name: Extrahepatic microvesicular lipid accumulation
  finding_term:
    preferred_term: Extrahepatic microvesicular steatosis
  description: Oil-red-O-positive microvesicular fat was reported in cardiac myocytes, proximal renal tubules, occasional skeletal myocytes and pancreatic exocrine acini.
  notes: NCIT:C82982 is defined as a hepatic finding and is therefore not assigned to the extrahepatic sites. The index case carried one likely pathogenic allele and one VUS; histology does not resolve the VUS.
  evidence:
  - reference: PMID:38628283
    reference_title: 'Carnitine-acylcarnitine translocase deficiency: a case report with autopsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Similar microvesicular steatosis was also noted in the cardiac myocytes (Figures 2A and 2B), proximal convoluted tubules of the kidneys (Figures 2C and 2D), occasional skeletal muscle cells (Figure 2E), and pancreatic exocrine acini (Figure 2F), confirmed by oil red O stain performed on the cryosections of these tissues.
    explanation: Directly describes the extrahepatic distribution.
genetic:
- name: SLC25A20
  gene_term:
    preferred_term: SLC25A20
    term:
      id: hgnc:1421
      label: SLC25A20
  features: Biallelic loss-of-function alleles include missense, nonsense, splice-site variants, small insertions/deletions and exon or whole-gene deletions. Genotype influences clinical severity, but residual activity and individual variants do not perfectly predict outcome.
  inheritance:
  - name: Autosomal recessive
    description: Autosomal recessive. When both parents are heterozygous, each pregnancy has a 25% chance of an affected child, 50% of an unaffected carrier and 25% of a child inheriting neither familial allele. Heterozygous carriers are asymptomatic.
    evidence:
    - reference: PMID:35862567
      reference_title: Carnitine-Acylcarnitine Translocase Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CACT deficiency is inherited in an autosomal recessive manner.
      explanation: GeneReviews directly states autosomal recessive inheritance.
      quote_role: REVIEW_SYNTHESIS
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: If both parents are known to be heterozygous for an SLC25A20 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of inheriting neither of the familial SLC25A20 pathogenic variants and therefore being unaffected.
      explanation: Provides the conditional recurrence probabilities and distinguishes carriers from those inheriting neither allele.
  variants:
  - name: c.199-10T>G splice variant in SLC25A20
    description: Recurrent c.199-10T>G splice variant associated with severe neonatal disease, especially in individuals of East or Southeast Asian descent.
    gene:
      preferred_term: SLC25A20
      term:
        id: hgnc:1421
        label: SLC25A20
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Homozygosity for this pathogenic splice site variant is associated with the severe neonatal-onset form
      explanation: The sentence concerns c.199-10T>G in the genotype-phenotype section.
  - name: p.Gly20Asp (c.59G>A) variant
    description: Novel variant identified in a Spanish patient with severe neonatal-onset disease and fatal outcome during intercurrent infection in the first year.
    gene:
      preferred_term: SLC25A20
      term:
        id: hgnc:1421
        label: SLC25A20
    evidence:
    - reference: PMID:25614308
      reference_title: 'Carnitine-acylcarnitine translocase deficiency: experience with four cases in Spain and review of the literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Two cases with neonatal onset, carrying in homozygosity the novel variant sequences p.Gly20Asp (c.59G>A) and p.Arg179Gly (c.536A>G), died during an intercurrent infectious process in the first year of life
      explanation: Spanish case series reporting novel pathogenic variants with clinical outcomes.
      quote_role: PRIMARY_RESULT
  - name: Asp231His and Ala281Val pathogenic mutations
    description: Molecular dynamics models suggest that Asp231His perturbs matrix salt-bridge interactions and that Ala281Val may disturb helix packing. These are structural predictions, not direct measurements of mutant transport in patients.
    gene:
      preferred_term: SLC25A20
      term:
        id: hgnc:1421
        label: SLC25A20
    evidence:
    - reference: PMID:36835358
      reference_title: In Silico Analysis of the Structural Dynamics and Substrate Recognition Determinants of the Human Mitochondrial Carnitine/Acylcarnitine SLC25A20 Transporter.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      snippet: the data suggest that the pathogenic mutation Asp231His perturbs the matrix salt bridge Asp231-Lys35 and/or the Asp231-Arg178 interactions, which are involved in the stability of the c- and m-state.
      explanation: Reports an explicitly computational interpretation of Asp231His.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Seven attenuated patients of Pakistani heritage, six of these homozygous c.82G>T, had later onset manifestations and long-term survival without chronic hyperammonemia.

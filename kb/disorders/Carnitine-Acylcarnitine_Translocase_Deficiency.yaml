  description: Monitor growth and development at each visit; individualize glucose, ammonia, CK and liver testing to metabolic stability and age. GeneReviews recommends annual or clinically indicated echocardiography, ECG/Holter as indicated, renal assessment when indicated, and annual nutritional and vitamin assessment after age one year.

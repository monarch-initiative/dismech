name: Carnitine-acylcarnitine Translocase Deficiency
category: Mendelian
creation_date: '2026-02-23T00:00:00Z'
synonyms:
- CACT deficiency
- CACTD
- SLC25A20 deficiency
- Carnitine-acylcarnitine carrier deficiency
description: Carnitine-acylcarnitine translocase (CACT) deficiency is an autosomal recessive SLC25A20 disorder of mitochondrial long-chain fatty acid transport. Impaired inner-membrane acylcarnitine exchange restricts fatty acid oxidation and energy supply during fasting or catabolic stress. Severe neonatal disease features hypoketotic hypoglycemia, hyperammonemia, arrhythmias, cardiomyopathy, hepatic dysfunction and muscle injury. Later-onset presentations can be milder, but severe decompensation remains possible. Energy deficiency is established; the contribution of long-chain acylcarnitine toxicity to individual organ manifestations remains incompletely defined.
disease_term:
  preferred_term: carnitine-acylcarnitine translocase deficiency
  term:
    id: MONDO:0008918
    label: carnitine-acylcarnitine translocase deficiency
parents:
- Fatty Acid Oxidation Disorder
- Inborn Error of Metabolism
prevalence:
- population: Newborns in the Hong Kong expanded metabolic screening pilot
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.28
  notes: One CACT case among 30,448 screened newborns (approximately 3.28 per 100,000). This single-case pilot estimate is imprecise and is not a population-wide prevalence or evidence of ancestry-specific enrichment.
  evidence:
  - reference: PMID:28862145
    reference_title: 'Expanded newborn metabolic screening programme in Hong Kong: a three-year journey.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Six neonates were confirmed to have inborn errors of metabolism, including two cases of medium-chain acyl-coenzyme A dehydrogenase deficiency, one case of carnitine-acylcarnitine translocase deficiency, and three milder conditions.
    explanation: Documents the single CACT diagnosis; the separate denominator quote supports the derived screening estimate.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28862145
    reference_title: 'Expanded newborn metabolic screening programme in Hong Kong: a three-year journey.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: During the study period, 30 448 newborns referred from 13 private and public units were screened.
    explanation: Provides the screened denominator for the single CACT diagnosis.
progression:
- phase: Severe neonatal presentation
  notes: Symptoms commonly emerge around age two days, before screening results. Cardiac arrest and recurrent hyperammonemia contribute to mortality and neurodevelopmental injury, but long-term survival is possible. In a retrospective 23-case cohort, nine of 16 classical patients survived longer term; this is an ascertained cohort, not a prospective survival estimate.
  evidence:
  - &id004
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The clinical features of severe CACT deficiency generally present around age two days, prior to receipt of the newborn screening result.
    explanation: Defines typical timing and the limitation of newborn screening.
  - reference: PMID:33634872
    reference_title: 'New insights into carnitine-acylcarnitine translocase deficiency from 23 cases: Management challenges and potential therapeutic approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Nine classical patients survived longer-term-most with feeding difficulties and cognitive delay.
    explanation: Describes survival and morbidity in the classical subgroup of a retrospective cohort.
- phase: Milder neonatal or later-onset presentation
  notes: Later onset may occur after one month or after one year. These clinical presentations share the same transport defect and do not define distinct mechanistic diseases. Residual enzyme activity can inform assessment but cannot determine prognosis alone; severe presentations occur despite measurable residual activity.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: A small group of affected individuals experience symptoms after age one month; a fraction of these manifest symptoms after age one year
    explanation: Describes the later-onset spectrum.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: However, enzyme activity should not entirely guide the prognosis, as there are individuals with enzyme activity in the 1%-10% range who had clinical features consistent with the severe neonatal form
    explanation: Limits prognostic interpretation of residual enzyme activity.
pathophysiology:
- name: SLC25A20 transporter molecular function deficiency
  description: Loss of CACT transport activity limits acylcarnitine/carnitine exchange across the mitochondrial inner membrane.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Carnitine acylcarnitine translocase (CACT) transfers acylcarnitines formed by the action of carnitine palmitoyl-transferase I (CPT1) in the outer mitochondrial membrane into the mitochondrial matrix in exchange for free carnitine.
    explanation: Defines the transporter activity lost in SLC25A20 deficiency.

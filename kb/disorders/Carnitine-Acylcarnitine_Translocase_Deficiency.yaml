    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis before the occurrence of clinical symptoms by tandem MS-MS and very early therapeutic intervention together with good dietary compliance could lead to a better prognosis
    explanation: Supports importance of early dietary intervention for improved outcomes.
    quote_role: PRIMARY_RESULT
- name: Triheptanoin therapy
  description: Triheptanoin supplies heptanoate-derived acetyl-CoA and propionyl-CoA for energy and anaplerosis. GeneReviews recommends it as part of specialist dietary management. CACT-specific evidence consists mainly of uncontrolled cases with concurrent intensive care; improvement in cardiac function does not establish a comparative treatment effect or cure.

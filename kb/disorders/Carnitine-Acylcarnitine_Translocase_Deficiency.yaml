computational_models:
- name: Human SLC25A20 conformational models and molecular dynamics
  model_type: MOLECULAR_DOCKING
  description: AlphaFold2/ColabFold models of cytoplasmic-open and matrix-open human SLC25A20, molecular dynamics and substrate docking explore conformational asymmetry and binding determinants. Structural analysis suggests explanations for Asp231His and Ala281Val. The reported simulations do not directly quantify patient-mutant transport or clinical phenotype.
  publication: PMID:36835358
  model_software: AlphaFold 2.2.0; ColabFold AlphaFold2_advanced; AMBER22; CPPTRAJ
  modeled_mechanisms:
  - target: SLC25A20 transporter molecular function deficiency
    relationship: MEASURES
    description: Molecular structural proxies inform the normal transport architecture and interpretations of pathogenic substitutions.
    model_scale: MOLECULAR
    fidelity: LOW
    limitations: Simulations and docking of modeled conformations do not directly measure deficient substrate transport. Clinical effects of mutations are inferred from their positions and interactions.
    divergences:
    - divergence_type: PROXY_QUANTITY
      description: Salt-bridge persistence, helix packing and docked substrate contacts are structural proxies for transport activity.
    - divergence_type: CAUSE_UNREPRESENTED
      description: The disease variants are interpreted from carrier structures; the reported simulations are not direct functional tests of variant-specific transport deficiency.
    - divergence_type: BOUNDARY_OMISSION
      description: Cellular energy metabolism, tissue injury and clinical outcomes lie outside the isolated transporter model.
    evidence: &id006
    - reference: PMID:36835358
      reference_title: In Silico Analysis of the Structural Dynamics and Substrate Recognition Determinants of the Human Mitochondrial Carnitine/Acylcarnitine SLC25A20 Transporter.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      snippet: The generation of the structural models of the two SLC25A20 conformational states, coupled to extended MD simulations, allowed for insight into the molecular determinants of the protein dynamics of this transporter.
      explanation: Defines the structural modeling and dynamics scope.
    - reference: PMID:36835358
      reference_title: In Silico Analysis of the Structural Dynamics and Substrate Recognition Determinants of the Human Mitochondrial Carnitine/Acylcarnitine SLC25A20 Transporter.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      snippet: the data suggest that the pathogenic mutation Asp231His perturbs the matrix salt bridge Asp231-Lys35 and/or the Asp231-Arg178 interactions, which are involved in the stability of the c- and m-state.
      explanation: A computational interpretation of a disease allele, not a mutant functional experiment.
  evidence: *id006
  findings:
  - statement: Predicted Asp231His effects involve matrix salt-bridge interactions; Ala281Val may perturb H5/H6 packing. Experimental mutant-transport confirmation is not supplied by this modeling study.

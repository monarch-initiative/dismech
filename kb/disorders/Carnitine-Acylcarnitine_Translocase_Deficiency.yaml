      quote_role: PRIMARY_RESULT
      snippet: We describe the autopsy pathology of a child with CACT deficiency dominantly in the form of microvesicular steatosis of the hepatocytes, renal proximal tubular epithelia, cardiac myocytes, and rhabdomyocytes.
      explanation: Documents cellular lipid storage in one autopsy; it does not identify the stored lipid chemically or demonstrate acylcarnitine toxicity.
  - target: Proposed impairment of N-acetylglutamate-dependent ureagenesis
    description: Reduced acetyl-CoA supply is proposed to limit NAG production and urea-cycle activation.

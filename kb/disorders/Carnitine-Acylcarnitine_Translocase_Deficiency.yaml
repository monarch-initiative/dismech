notes: Severe neonatal and later-onset presentations form a spectrum of the same SLC25A20 transport defect. Clinical severity is not determined by residual enzyme activity alone. An overlapping CPT II biochemical profile requires molecular or functional resolution. Outcome estimates from small historical series should not be treated as current population-wide prognosis.
diagnosis:
- name: Newborn screening and urgent metabolic evaluation
  description: Tandem mass spectrometry detects characteristic acylcarnitine abnormalities; ratio indices can aid discrimination. CACT can present before screening results or with normal long-chain analytes, so symptomatic infants need urgent glucose, ammonia, CK, liver and cardiac assessment without waiting for screening.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:37305732
    reference_title: Increased acylcarnitine ratio indices in newborn screening for carnitine-acylcarnitine translocase deficiency shows increased sensitivity and reduced false-positivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Newborn screening via tandem mass spectrometry (MS/MS) technology enables early diagnosis.
    explanation: Confirms the role of MS/MS-based newborn screening for early CACT deficiency diagnosis.
    quote_role: BACKGROUND
  - reference: PMID:37305732
    reference_title: Increased acylcarnitine ratio indices in newborn screening for carnitine-acylcarnitine translocase deficiency shows increased sensitivity and reduced false-positivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ratios of the primary markers (C16 + C18:1)/C2, C16/C2, C16:1/C3, and C16:1-OH/C3 can facilitate the diagnosis of CACT deficiency, thereby increasing sensitivity and reducing false-positivity.
    explanation: Demonstrates improved newborn screening performance with ratio-based markers.
    quote_role: PRIMARY_RESULT
  - *id004
- name: SLC25A20 molecular confirmation and functional testing
  description: Biallelic pathogenic or likely pathogenic SLC25A20 variants establish the diagnosis. If one or no allele is found, add deletion/duplication analysis. Cultured fibroblast CACT activity can resolve selected cases. Two VUS, or one pathogenic allele plus a VUS, do not establish or exclude the diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The diagnosis of CACT deficiency is established in a proband by identification of biallelic pathogenic (or likely pathogenic) variants in SLC25A20 by molecular genetic testing
    explanation: Defines molecular confirmation.
  - *id005
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: identification of biallelic SLC25A20 variants of uncertain significance (or identification of one known SLC25A20 pathogenic variant and one SLC25A20 variant of uncertain significance) does not establish or rule out the diagnosis; in this case enzymatic testing may be required.
    explanation: Specifies which uncertain genotypes require further interpretation or functional assessment.
- name: Distinguishing CACT from CPT II deficiency
  description: The characteristic long-chain acylcarnitine pattern is indistinguishable from CPT II deficiency. Resolve the differential with gene testing or appropriate functional assays; a biochemical pattern alone does not establish SLC25A20 deficiency.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: This profile is indistinguishable from CPT II deficiency, and thus follow-up testing is required to establish the diagnosis
    explanation: Requires confirmatory testing after an overlapping acylcarnitine profile.
- name: Testing relatives at risk
  description: Test at-risk siblings of any age. Newborn siblings need familial variant testing or an acylcarnitine profile in parallel with routine screening; confirm parental segregation for recurrence counseling.
  evidence:
  - reference: PMID:35862567
    reference_title: Carnitine-Acylcarnitine Translocase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Testing of all at-risk sibs of any age is warranted to allow for early diagnosis and treatment of CACT deficiency.
    explanation: Recommends proactive evaluation of siblings.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK582032/pdf/Bookshelf_NBK582032.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In parallel with newborn screening either test for the familial SLC25A20 pathogenic variants or measure acylcarnitine profile.
    explanation: Avoids reliance on routine newborn screening alone in an at-risk family.

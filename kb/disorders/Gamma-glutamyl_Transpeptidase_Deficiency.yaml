      evidence:
      - reference: PMID:23615310
        reference_title: "Phenotypic characterization of Ggt1(dwg/dwg) mice,a mouse model for hereditary γ-glutamyltransferase deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Growth retardation, degeneration of lens fibers, and an increased number of osteoclasts in the Ggt1(dwg/dwg) mice were reversed by administration of N-acetyl-L-cysteine, a precursor of GSH synthesis."
        explanation: Reports NAC rescue of the mouse phenotype.
    evidence:
    - reference: PMID:23615310
      reference_title: "Phenotypic characterization of Ggt1(dwg/dwg) mice,a mouse model for hereditary γ-glutamyltransferase deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Plasma and kidney GSH levels were markedly increased, while eye and liver GSH levels were markedly decreased, in the Ggt1(dwg/dwg) mice."
      explanation: Shows the extracellular-excess, tissue-deficit pattern in this model.
discussions:
- discussion_id: ggt_deficiency_neurological_attribution
  prompt: >-
    Is intellectual disability or other neurological involvement part of
    gamma-glutamyl transpeptidase deficiency, or an artefact of how the few
    known patients were found?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neurodevelopmental and behavioural involvement of uncertain attribution
  rationale: >-
    The disorder is detected only by measuring glutathione, which routine
    metabolic screening does not do, and the reported patients were largely
    identified during investigation of intellectual disability or behavioural
    problems. Five of seven reported patients had central nervous system
    involvement, but the patients ascertained through a neurological problem
    cannot show whether the deficiency causes it. The genetically confirmed
    siblings are only mildly affected, the 2007 review states that whether the
    symptoms are part of the disease remains to be established, and no
    mechanism linking extracellular glutathione catabolism to brain function in
    patients has been shown. Genotype-first ascertainment (homozygous GGT1
    loss-of-function in population or newborn sequencing cohorts, or urinary
    glutathione in an unselected population) would answer it.
  proposed_experiments:
  - experiment_id: exp_ggt1_genotype_first
    name: Genotype-first phenotyping of biallelic GGT1 loss-of-function carriers
    description: >-
      Identify individuals with biallelic GGT1 loss-of-function variants or
      deletions in large sequencing cohorts without selecting on neurological
      status, confirm glutathionuria biochemically, and compare their
      neurodevelopmental outcomes with matched controls.
    would_support:
    - pathophysiology#Neurodevelopmental and behavioural involvement of uncertain attribution
- discussion_id: ggt_deficiency_mouse_human_mismatch
  prompt: >-
    Why do GGT1-deficient mice develop tissue glutathione depletion, growth
    failure, cataracts and infertility, while patients reportedly have normal
    cellular glutathione and none of those features?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Systemic cysteine and glutathione salvage failure
  rationale: >-
    The mouse models establish that urinary glutathione loss can deplete tissue
    glutathione and that cysteine prodrugs rescue the result, but the human
    disorder shows the biochemical signature without that phenotype. The
    salvage-failure node is therefore supported in mice and contradicted for
    humans. Whether the difference reflects cysteine supply, compensation by
    other GGT family members, or incomplete clinical assessment of the few
    patients is unknown.
  proposed_experiments:
  - experiment_id: exp_ggt1_human_tissue_glutathione
    name: Tissue and plasma cysteine and glutathione measurement in GGT1-deficient patients
    description: >-
      Measure plasma cysteine, leukocyte and fibroblast glutathione, and
      whole-body cysteine balance in molecularly confirmed patients, to test
      whether the mouse salvage-failure mechanism operates in humans.
    would_support:
    - pathophysiology#Systemic cysteine and glutathione salvage failure
references:
- reference: PMID:17397529
  title: "Inborn errors in the metabolism of glutathione."

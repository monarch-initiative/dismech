      explanation: Quantifies residual activity in the model.
  - target: Systemic cysteine and glutathione salvage failure
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: Shows raised plasma and kidney glutathione with depleted eye and liver glutathione, reversible with N-acetylcysteine.
    limitations: >
      As for the enu1 model, tissue glutathione depletion and its downstream

diagnosis:
- name: Biochemical diagnosis of GGT deficiency
  description: >
    Diagnosis rests on two findings: low GGT activity in nucleated cells
    (leukocytes or cultured skin fibroblasts; erythrocytes cannot be used
    because they lack the enzyme normally), and high plasma and urinary
    glutathione. Glutathione is not detected by routine amino-acid screening
    and must be measured specifically. GGT1 testing can confirm the diagnosis,
    but only one causal variant has been published.
  evidence:
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Low activity of γ-glutamyl transpeptidase in nucleated cells such as leukocytes or cultured skin fibroblasts."
    explanation: First diagnostic criterion listed by the review.
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "High levels of glutathione in plasma and urine (up to 1 g/day in urine; controls < 10 mg)."
    explanation: Second diagnostic criterion, with the magnitude of urinary glutathione against controls.
inheritance:
- name: Autosomal recessive
  description: >
    Affected siblings in the molecularly confirmed family are homozygous for
    the GGT1 deletion, with heterozygous parents and an unaffected sibling;
    earlier, carrier parents were inferred from low fibroblast enzyme activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29483667
    reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genetic characterization of the patients' parents and a healthy sibling has provided direct genetic evidence regarding the autosomal recessive nature of this disease"
    explanation: Segregation of the deletion in the family establishes autosomal recessive inheritance.
  - reference: PMID:6118466
    reference_title: "Glutathionuria: gamma-glutamyl transpeptidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An autosomal recessive mode of inheritance is suggested."
    explanation: Early biochemical family study proposing autosomal recessive inheritance.
genetic:
- name: GGT1
  gene_term:
    preferred_term: GGT1
    term:
      id: hgnc:4250
      label: GGT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Only one family with a molecular diagnosis has been published. Before it, a
    2008 review of the GGT gene family noted that no GGT1 mutation had been
    found in any patient; the earlier patients were diagnosed biochemically and
    have not been genotyped in the literature. No external gene-disease
    validity classification has been copied here.
  variants:
  - name: Homozygous 16.9 kb intragenic GGT1 deletion
    description: >
      A 16.9 kb homozygous deletion within GGT1 with a 13 bp insertion at the
      deletion junction, found by whole-genome sequencing in two affected
      siblings.
    evidence:
    - reference: PMID:29483667
      reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Close analysis revealed the presence of a 13 bp insertion at the deletion junction."
      explanation: Characterises the deletion junction.
  evidence:
  - reference: PMID:29483667
    reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a genetic variant as the cause of glutathionuria."
    explanation: First and only published genetic cause of the disorder.
  - reference: PMID:18357469
    reference_title: "The human gamma-glutamyltransferase gene family."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "GGT deficiency in man is rare and for the few patients reported to date, mutations in GGT1 have not been described."
    explanation: >-
      Records that the earlier, biochemically diagnosed patients had no
      molecular diagnosis, which is why gene-level evidence rests on one family.
animal_models:
- name: Ggt1 enu1 glutathionuric mouse
  species: Mouse
  genotype: Ggt1(enu1/enu1)
  publication: PMID:9139708
  description: >
    ENU-induced GGT-deficient mouse found by screening for aminoacidurias. Its
    phenotype (growth failure, lethargy, cataracts, infertility, shortened
    life span) is far more severe than anything reported in patients.
  modeled_mechanisms:
  - target: Glutathione accumulation in plasma and urine
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Reproduces the glutathionemia and glutathionuria that define the human disorder.
    evidence:
    - reference: PMID:9139708
      reference_title: "Mice with genetic gamma-glutamyl transpeptidase deficiency exhibit glutathionuria, severe growth failure, reduced life spans, and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Total glutathione concentration was increased in both blood and urine but decreased in liver homogenates from affected mice."
      explanation: Blood and urine glutathione excess mirrors the human biochemistry.
  - target: Systemic cysteine and glutathione salvage failure
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: >
      Shows tissue glutathione depletion from chronic urinary loss, and its
      reversal by a cysteine prodrug.
    limitations: >
      Human patients are reported to have normal cellular glutathione and none
      has the mouse growth failure, cataracts or infertility, so the mouse
      tissue-depletion mechanism may not operate, or not to the same degree, in
      humans.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >
        The mouse loses enough cysteine through glutathionuria to deplete liver
        and lens glutathione, whereas cellular glutathione is reported normal in
        patients; differences in dietary cysteine supply or in compensating GGT
        family members between species are possible explanations that have not
        been tested.
    readouts:
    - name: Growth and behaviour after cysteine-prodrug supplementation
      target: Systemic cysteine and glutathione salvage failure
      direction: RESTORED
      interpretation: Rescue by a cysteine prodrug supports cysteine/glutathione deprivation as the cause of the mouse phenotype.
      evidence:
      - reference: PMID:12757858
        reference_title: "L-2-oxothiazolidine-4-carboxylate supplementation in murine gamma-GT deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The growth, physical appearance, and behavior of gamma-GT-deficient mice were substantially improved following OTZ supplementation."
        explanation: Reports phenotypic rescue by OTZ.
    evidence:
    - reference: PMID:12757858
      reference_title: "L-2-oxothiazolidine-4-carboxylate supplementation in murine gamma-GT deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Total liver glutathione (GSH) content is significantly reduced in gamma-GT-deficient mice due to chronic excessive GSH loss."
      explanation: Supports the model as informative for the salvage-failure node in mice.
  evidence:
  - reference: PMID:9139708
    reference_title: "Mice with genetic gamma-glutamyl transpeptidase deficiency exhibit glutathionuria, severe growth failure, reduced life spans, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Glutathionuric mice exhibited lethargy, severe growth failure, shortened life spans and infertility."
    explanation: Mouse phenotype, which exceeds anything reported in humans.
- name: Ggt1 dwg mouse
  species: Mouse
  genotype: Ggt1(dwg/dwg)
  publication: PMID:23615310
  description: >
    Spontaneous Ggt1 mutant (13 nt exon 7 deletion) with dwarfism, cataract and
    coat colour change but normal survival; residual GGT1 activity about 4% of

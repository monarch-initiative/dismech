name: Gamma-glutamyl Transpeptidase Deficiency
category: Mendelian
creation_date: '2026-10-15T00:00:00Z'
synonyms:
- Glutathionuria
- Glutathioninuria
- GGT deficiency
- GGT1 deficiency
- Gamma-glutamyltransferase deficiency
- Inborn error of glutathione hydrolase activity
description: >
  Gamma-glutamyl transpeptidase (GGT) deficiency, or glutathionuria, is an
  ultra-rare autosomal recessive inborn error of the gamma-glutamyl cycle in
  which the extracellular, membrane-anchored enzyme that begins glutathione
  breakdown is missing. GGT1 hydrolyses or transfers the gamma-glutamyl moiety
  of glutathione and its S-conjugates at the outer face of the plasma membrane,
  most abundantly on the brush border of the renal proximal tubule. Without it,
  glutathione filtered at the glomerulus and exported by tissues cannot be
  broken down, so it accumulates in plasma and is excreted in urine in gram
  quantities, together with gamma-glutamylcysteine and cysteine. The same block
  prevents conversion of leukotriene C4 to leukotriene D4. Diagnosis is
  biochemical (glutathionuria with very low serum or leukocyte GGT activity);
  a causal GGT1 variant has been identified in only one family, a homozygous
  16.9 kb intragenic deletion. The clinical picture is uncertain. Most of the
  handful of reported patients were identified because of intellectual
  disability, developmental delay or behavioural problems, so the reported
  neurological involvement is subject to strong ascertainment bias, and expert
  review states that whether it belongs to the disease remains to be
  established. Glutathione-deficient mouse models are far more severe than any
  reported patient, and human cellular glutathione is reported to be normal.
disease_term:
  preferred_term: gamma-glutamyl transpeptidase deficiency
  term:
    id: MONDO:0009285
    label: gamma-glutamyl transpeptidase deficiency
parents:
- Inherited Glutathione Metabolism Disease
- Inborn Error of Metabolism
notes: >
  The patient count is small and partly overlapping across sources: a 2007
  review counts seven patients in five families, and the 2018 report of the
  first molecularly confirmed family counts six previously reported patients
  before adding its two siblings. Most published patients were diagnosed
  biochemically before any gene was linked to the disorder, so it is not known
  whether all of them carry GGT1 variants; the human genome contains several
  related GGT genes. No specific treatment has been recommended.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Fewer than ten patients reported. Both counting sources note the disorder
    is probably underdiagnosed because glutathione is not measured in routine
    metabolic screening, so the case count is a floor rather than an estimate
    of occurrence.
  evidence:
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gamma-glutamyl transpeptidase deficiency is a very rare disease, which has been reported in seven patients in five families worldwide"
    explanation: Review count of reported patients and families.
  - reference: PMID:29483667
    reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "with only six patients reported in the literature, although this condition has probably been underdiagnosed due the difficulty to routinely analyze glutathione in clinical samples"
    explanation: >-
      Gives the prior case count and states that the disorder is probably
      underdiagnosed, which is why no prevalence figure is asserted.
pathophysiology:
- name: Loss of GGT1 glutathione hydrolase activity
  biological_scale: MOLECULAR
  description: >
    GGT1 is an extracellular, plasma-membrane-anchored enzyme that hydrolyses
    or transfers the gamma-glutamyl moiety of glutathione and other
    gamma-glutamyl compounds; it catalyses the first step of glutathione
    degradation. In the one molecularly characterised family a homozygous
    16.9 kb intragenic GGT1 deletion abolishes it. Activity in affected
    individuals is very low or below detection in serum, but is not completely
    absent in all patients studied, consistent with contributions from other
    members of the GGT gene family.
  genes:
  - preferred_term: GGT1
    term:
      id: hgnc:4250
      label: GGT1
  molecular_functions:
  - preferred_term: glutathione hydrolase activity
    term:
      id: GO:0036374
      label: glutathione gamma-glutamate hydrolase
    modifier: DECREASED
  - preferred_term: leukotriene C4 hydrolase activity
    term:
      id: GO:0002951
      label: leukotriene-C(4) hydrolase activity
    modifier: DECREASED
  genetic_context:
    description: >
      Homozygous 16.9 kb intragenic deletion of GGT1 with a 13 bp insertion at
      the junction, in the only family with a molecular diagnosis.
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:18357469
    reference_title: "The human gamma-glutamyltransferase gene family."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The well-characterized GGT1 is an extracellular enzyme that is anchored to the plasma membrane of cells. There, it hydrolyzes and transfers gamma-glutamyl moieties from glutathione and other gamma-glutamyl compounds to acceptors."
    explanation: Defines the location and catalytic activity of GGT1.
  - reference: PMID:29483667
    reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-genome sequencing revealed the presence of a 16.9 kb homozygous deletion in GGT1, one of the genes encoding enzymes with γ-glutamyl transpeptidase activity in the human genome."
    explanation: Identifies the causal GGT1 lesion in affected siblings.
  - reference: PMID:6114489
    reference_title: "Formation of gamma-glutamycyst(e)ine in vivo is catalyzed by gamma-glutamyl transpeptidase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gamma-glutamyl transpeptidase activity is not completely absent in a patient found to have a deficiency of this enzyme"
    explanation: Documents residual activity in a deficient patient, supporting the description of very low rather than uniformly absent activity.
  downstream:
  - target: Reduced serum gamma-glutamyltransferase
    causal_link_type: DIRECT
    description: Serum GGT activity is the circulating readout of the absent enzyme.
  - target: Impaired extracellular glutathione catabolism
    causal_link_type: DIRECT
    description: >
      GGT1 catalyses the first and committing step of extracellular glutathione
      breakdown, so its loss halts glutathione degradation at the cell surface.
    evidence:
    - reference: PMID:17397529
      reference_title: "Inborn errors in the metabolism of glutathione."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Gamma-glutamyl transpeptidase catalyses the first step in the degradation of glutathione"
      explanation: Places the enzyme at the first step of glutathione degradation.
  - target: Defective conversion of leukotriene C4 to leukotriene D4
    causal_link_type: DIRECT
    description: >
      Leukotriene C4 is a glutathione S-conjugate whose gamma-glutamyl residue
      is removed by GGT to form leukotriene D4.
    evidence:
    - reference: PMID:14754911
      reference_title: "Synthesis and metabolism of leukotrienes in gamma-glutamyl transpeptidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "LTC(4), the primary cysteinyl LT, is cleaved by gamma-glutamyl transpeptidase (GGT), resulting in LTD(4)."
      explanation: States the GGT-dependent step in cysteinyl leukotriene metabolism.
- name: Impaired extracellular glutathione catabolism
  biological_scale: CELLULAR
  description: >
    Glutathione is exported from cells and filtered at the glomerulus, and is
    normally degraded at the luminal brush border of the renal proximal tubule,
    where GGT is concentrated. Without GGT, filtered and circulating glutathione
    cannot be broken down for recovery of its constituent amino acids. Older
    work proposed that the gamma-glutamyl cycle mediates amino-acid transport,
    but GGT-deficient patients have normal plasma amino acids and renal
    amino-acid reabsorption, and the extracellular hydrolysis of glutathione is
    now regarded as the enzyme's physiological role.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:
  - preferred_term: proximal tubule
    term:
      id: UBERON:0004134
      label: proximal tubule
  biological_processes:
  - preferred_term: glutathione catabolic process
    term:
      id: GO:0006751
      label: glutathione catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:42531
    reference_title: "Characterization and physiological function of rat renal gamma-glutamyltranspeptidase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Within the kidney, the enzyme is primarily associated with the luminal surface of the brush border membrane of the proximal straight tubule."
    explanation: Localises renal GGT to the proximal tubule brush border in the rat.
  - reference: PMID:42531
    reference_title: "Characterization and physiological function of rat renal gamma-glutamyltranspeptidase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It now appears that the activities attributed to the gamma-glutamyl cycle do not participate in amino acid transport, but instead constitute three separate metabolic pathways; the intracellular synthesis of glutathione, the intracellular degradation of gamma-glutamyl peptides and the extracellular hydrolysis of glutathione."
    explanation: Synthesises the evidence that GGT's role is extracellular glutathione hydrolysis rather than amino-acid transport.
  - reference: PMID:6118466
    reference_title: "Glutathionuria: gamma-glutamyl transpeptidase deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "As in the only other case described in detail, plasma levels and renal reabsorption of the amino acids were normal."
    explanation: >-
      Two deficient patients had normal plasma amino acids and renal
      amino-acid reabsorption despite absent GGT. That is consistent with the
      enzyme's physiological role being extracellular glutathione hydrolysis
      rather than amino-acid transport, which is the role this node describes;
      the support is by inference, hence INDIRECT.
  downstream:
  - target: Glutathione accumulation in plasma and urine
    causal_link_type: DIRECT
    description: >
      Undegraded glutathione accumulates in plasma and is lost in the urine,
      largely from the kidney.
    evidence:
    - reference: PMID:42531
      reference_title: "Characterization and physiological function of rat renal gamma-glutamyltranspeptidase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The glutathionemia and glutathionuria observed in a patient who lacks detectable gamma-glutamyltranspeptidase activity and in mice following specific inhibition of transpeptidase, support the hypothesis that the enzyme plays a major role in glutathione catabolism."
      explanation: Links absent GGT activity in a patient to glutathionemia and glutathionuria via loss of glutathione catabolism.
    - reference: PMID:34150
      reference_title: "Translocation of intracellular glutathione to membrane-bound gamma-glutamyl transpeptidase as a discrete step in the gamma-glutamyl cycle: glutathionuria after inhibition of transpeptidase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The evidence suggests that a substantial fraction of the urinary glutathione arises from the kidney."
      explanation: Pharmacological GGT inhibition in mice shows the urinary glutathione is largely renal in origin.
  - target: Systemic cysteine and glutathione salvage failure
    causal_link_type: DIRECT
    description: >
      Glutathione lost intact in the urine is not degraded and its cysteine is
      not recovered. In mice this chronic loss depletes tissue glutathione.
    evidence:
    - reference: PMID:12757858
      reference_title: "L-2-oxothiazolidine-4-carboxylate supplementation in murine gamma-GT deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Total liver glutathione (GSH) content is significantly reduced in gamma-GT-deficient mice due to chronic excessive GSH loss."
      explanation: Attributes tissue glutathione depletion in GGT-deficient mice to chronic glutathione loss.
  - target: Neurodevelopmental and behavioural involvement of uncertain attribution
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Proposed, not established. Intellectual disability, developmental delay
      or behavioural problems are reported in most known patients, but these
      patients were largely found by metabolic screening of people who already
      had neurological problems, and no mechanism connecting extracellular
      glutathione catabolism to brain function in this disorder has been shown.
      The edge is kept so the reported phenotypes are attached to the graph,
      with its uncertainty stated here and in the knowledge-gap discussion.
    evidence:
    - reference: PMID:29483667
      reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report two siblings with mild psychomotor developmental delay and mild neurological symptoms, who presented a markedly increased excretion of glutathione in urine and a very low γ-glutamyl transpeptidase activity in serum."
      explanation: >-
        Co-occurrence of mild neurological findings with the biochemical defect
        in the only genetically confirmed family. It supports association, not
        the causal step, hence INDIRECT.
- name: Glutathione accumulation in plasma and urine
  biological_scale: ORGANISM
  description: >
    The defining and constant biochemical abnormality. Urinary glutathione
    reaches up to 1 g per day against under 10 mg in controls, plasma
    glutathione is raised, and urine and plasma also contain excess
    gamma-glutamylcysteine, cysteine and cysteinylglycine.
  chemical_entities:
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    modifier: INCREASED
  - preferred_term: L-gamma-glutamyl-L-cysteine
    term:
      id: CHEBI:17515
      label: L-gamma-glutamyl-L-cysteine
    modifier: INCREASED
  evidence:
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "All patients have had glutathionuria (up to 1 g/day"
    explanation: Glutathionuria is universal among reported patients and quantified.
  - reference: PMID:15702405
    reference_title: "Two Japanese brothers with hereditary gamma-glutamyl transpeptidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analyses of sulphydryl compounds in the plasma (and serum for certain test items) and urine indicated high concentrations of glutathione, gamma-glutamylcysteine, cysteine and cysteinylglycine."
    explanation: Documents the full set of accumulating thiol compounds in plasma and urine.
  - reference: PMID:6106190
    reference_title: "Excretion of cysteine and gamma-glutamylcysteine moieties in human and experimental animal gamma-glutamyl transpeptidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a patient with severe gamma-glutamyl transpeptidase deficiency excrete much larger than normal amounts of glutathione, gamma-glutamylcysteine, and cysteine in their urine"
    explanation: Urinary excretion of glutathione, gamma-glutamylcysteine and cysteine in a deficient patient.
  downstream:
  - target: Glutathionuria
    causal_link_type: DIRECT
  - target: Glutathionemia
    causal_link_type: DIRECT
- name: Systemic cysteine and glutathione salvage failure
  biological_scale: ORGANISM
  description: >
    In GGT-deficient mice, chronic urinary loss of glutathione deprives tissues
    of the cysteine normally recovered from extracellular glutathione, and
    liver and lens glutathione fall; cysteine-prodrug supplementation reverses
    the mouse phenotype. This node is supported in mice only. In patients,
    cellular glutathione is reported to be normal, and no human counterpart of
    the mouse growth failure, cataract or infertility has been reported, so the
    node is recorded with contradicting human evidence rather than as an
    established human mechanism.
  chemical_entities:
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    modifier: DECREASED
  evidence:
  - reference: PMID:9139708
    reference_title: "Mice with genetic gamma-glutamyl transpeptidase deficiency exhibit glutathionuria, severe growth failure, reduced life spans, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Total glutathione concentration was increased in both blood and urine but decreased in liver homogenates from affected mice."
    explanation: Shows the combination of extracellular glutathione excess and tissue depletion in a GGT-deficient mouse.
  - reference: PMID:12757858
    reference_title: "L-2-oxothiazolidine-4-carboxylate supplementation in murine gamma-GT deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tissue GSH deficiency is the proximate cause of the phenotypic abnormalities associated with murine gamma-GT deficiency."
    explanation: Identifies tissue glutathione deficiency as the cause of the mouse phenotype.
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cellular levels of glu-\ntathione are normal."
    explanation: >-
      For human patients the review states cellular glutathione is normal,
      which contradicts transferring the mouse tissue-depletion mechanism to
      the human disease. The snippet reproduces the line-break hyphenation of
      the cached PDF-derived text.
- name: Defective conversion of leukotriene C4 to leukotriene D4
  biological_scale: MOLECULAR
  description: >
    Patients cannot form leukotriene D4 or E4 from leukotriene C4: urinary
    leukotriene C4 is markedly raised and leukotriene E4 is undetectable, and
    stimulated monocytes make no leukotriene D4. Whether this has any clinical
    consequence is unknown; no phenotype has been attributed to it.
  biological_processes:
  - preferred_term: leukotriene D4 biosynthetic process
    term:
      id: GO:1901750
      label: leukotriene D4 biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: leukotriene C4
    term:
      id: CHEBI:16978
      label: leukotriene C4
    modifier: INCREASED
  - preferred_term: leukotriene D4
    term:
      id: CHEBI:28666
      label: leukotriene D4
    modifier: DECREASED
  evidence:
  - reference: PMID:14754911
    reference_title: "Synthesis and metabolism of leukotrienes in gamma-glutamyl transpeptidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data demonstrate a complete deficiency of LTD(4) biosynthesis in patients with a genetic deficiency of GGT."
    explanation: Shows complete loss of leukotriene D4 synthesis in three patients.
  - reference: PMID:18357469
    reference_title: "The human gamma-glutamyltransferase gene family."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These patients do secrete glutathione in urine and fail to metabolize LTC4."
    explanation: Summarises the dual glutathione and leukotriene C4 defect in patients.
- name: Neurodevelopmental and behavioural involvement of uncertain attribution
  biological_scale: ORGANISM
  description: >
    Five of the seven patients counted in a 2007 review had central nervous
    system involvement (intellectual disability, developmental delay,
    behavioural problems), and the two genetically confirmed siblings have
    mild psychomotor delay and mild neurological symptoms. This figure is
    strongly shaped by ascertainment: the disorder is found by measuring
    glutathione, which is not part of routine screening, and the early
    patients were found during metabolic investigation of intellectual
    disability. No genotype-first or otherwise unselected series exists, so
    there is no way yet to tell how often a deficient individual is
    neurologically normal. The review authors state that whether the neurological symptoms
    are part of the disease remains to be established.
  evidence:
  - reference: PMID:17397529
    reference_title: "Inborn errors in the metabolism of glutathione."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Whether these symptoms are part of the clinical picture remains to be established."
    explanation: >-
      The review's statement, immediately after counting CNS involvement in
      five of seven reported patients, that attributing those symptoms to the
      disorder is unresolved.
  - reference: PMID:29483667
    reference_title: "γ-glutamyl transpeptidase deficiency caused by a large homozygous intragenic deletion in GGT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two siblings with mild psychomotor developmental delay and mild neurological symptoms, who presented a markedly increased excretion of glutathione in urine and a very low γ-glutamyl transpeptidase activity in serum."
    explanation: Neurological findings in the genetically confirmed siblings are mild.
  downstream:
  - target: Intellectual disability
    causal_link_type: UNKNOWN
  - target: Global developmental delay
    causal_link_type: UNKNOWN
  - target: Atypical behavior
    causal_link_type: UNKNOWN

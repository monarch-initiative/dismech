    snippet: >-
      DICER1 syndrome is an autosomal-dominant, pleiotropic tumor-predisposition
      disorder caused by pathogenic germline variants in DICER1.
    explanation: >-
      States the inheritance pattern and pleiotropy of the syndrome.
  - reference: PMID:30715996
    reference_title: Neoplasm Risk Among Individuals With a Pathogenic Germline Variant in DICER1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After age 10 years, female risk was elevated compared with male risk.
    explanation: >-
      Supports the sex-dependence of penetrance asserted here, measured in
      non-proband carriers to reduce ascertainment bias.
pathophysiology:
- name: Germline DICER1 First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous germline DICER1 variant is present constitutionally; in the
    original multiplex pleuropulmonary blastoma families ten of eleven alleles
    truncated the protein proximal to its two carboxy-terminal RNase III domains
    and were therefore loss-of-function. Heterozygosity is well tolerated:
    the majority of obligate carriers are phenotypically normal and mice
    haploinsufficient for Dicer1 show no overt abnormality, so one functional
    allele suffices for normal development and is insufficient for tumor
    formation.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: DICER1
    modifier: DECREASED
    term:
      id: hgnc:17098
      label: DICER1
  genetic_context:
    gene:
      preferred_term: DICER1
      term:
        id: hgnc:17098
        label: DICER1
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    - NONSENSE_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous DICER1 variant, predominantly truncating
      proximal to the RNase III domains.
  evidence:
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that 11 multiplex PPB families harbor heterozygous germline
      mutations in DICER1, a gene encoding an endoribonuclease critical to the
      generation of small noncoding regulatory RNAs.
    explanation: >-
      Identifies the germline first hit and the gene's function in the families
      that defined the syndrome.
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Apart from PPB-associated tumors in a subset of family members, the
      majority of obligate carriers with DICER1 mutations are phenotypically
      normal indicating that loss of one DICER1 allele is compatible with normal
      development and insufficient for tumor formation.
    explanation: >-
      Directly supports the claim that the heterozygous constitutional state is
      a susceptibility rather than a disease, which is what makes this a
      first-hit node.
  downstream:
  - target: Compartment-Restricted Loss of DICER1 Expression
    description: >-
      Tumor development requires a further, tissue-restricted event that removes
      DICER1 function from a specific cellular compartment.

- name: Compartment-Restricted Loss of DICER1 Expression
  description: >-
    In pleuropulmonary blastoma, DICER1 protein is undetectable in the epithelial
    component of the tumor but retained in the malignant mesenchyme — the
    opposite of what a conventional second-hit model would predict, since it is
    the mesenchyme that transforms. This node deliberately does NOT declare
    conformance to the biallelic-loss node of the germline two-hit module: the
    somatic event characteristic of DICER1 tumors is a missense change in the
    RNase IIIb domain that alters strand-selective processing rather than
    abolishing the enzyme, and the compartment in which expression is lost is not
    the compartment that becomes malignant.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: pre-miRNA processing
    term:
      id: GO:0031054
      label: pre-miRNA processing
    modifier: DECREASED
  evidence:
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expression of DICER1 protein was undetectable in the epithelial component
      of PPB tumors but was retained in the malignant mesenchyme (sarcoma).
    explanation: >-
      The immunohistochemical observation that establishes the compartment
      restriction and is the reason this entry withholds conformance to the
      classical biallelic node.
  downstream:
  - target: Non-Cell-Autonomous Mesenchymal Transformation
    description: >-
      Loss of DICER1 in the epithelium is proposed to derange diffusible signals
      that govern growth of the adjacent mesenchyme.

- name: Non-Cell-Autonomous Mesenchymal Transformation
  description: >-
    The proposed mechanism linking epithelial DICER1 loss to mesenchymal
    malignancy: without normal microRNA processing, the developing lung
    epithelium mis-regulates diffusible factors that control proliferation of the
    mesenchymal cells in the cyst wall, which then expand and acquire further
    genetic changes. This is explicitly a hypothesis in the source and is curated
    as such rather than as established mechanism; the cystic-to-sarcomatous
    natural history of pleuropulmonary blastoma is itself the observation that
    suggests a multi-step pathogenesis.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that loss of DICER1 in the epithelium of the developing
      lung alters the regulation of diffusible factors that promote mesenchymal
      proliferation.
    explanation: >-
      The authors' own statement of the non-cell-autonomous hypothesis. The
      hedged wording is preserved here: this is a proposal, not a demonstrated
      mechanism.
  downstream:
  - target: Pleiotropic Childhood-Onset Neoplasm Spectrum
    description: >-
      The equivalent process in other developing organs produces the syndrome's
      characteristic multi-organ tumor spectrum.

- name: Pleiotropic Childhood-Onset Neoplasm Spectrum
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: a wide but characteristic set of neoplasms whose timing
    follows the development of the affected organ — pleuropulmonary blastoma and
    cystic nephroma in early childhood, ovarian Sertoli-Leydig cell tumor and
    thyroid disease later. Quantified in systematically ascertained non-proband
    carriers, cumulative neoplasm incidence is 5.3% by age 10 and 19.3% by age
    50, with significant excess of gynaecological and thyroid cancers relative to
    population rates.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30715996
    reference_title: Neoplasm Risk Among Individuals With a Pathogenic Germline Variant in DICER1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By age 50 years, 19.3% (95% CI, 8.4% to 29.0%) of nonprobands had
      developed a neoplasm (females, 26.5%; males, 10.2%).
    explanation: >-
      Quantifies cumulative neoplasm incidence in carriers ascertained so as to
      minimise bias, which is the risk figure this consequence node asserts.
  - reference: PMID:30715996
    reference_title: Neoplasm Risk Among Individuals With a Pathogenic Germline Variant in DICER1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standardized cancer incidence ratio analysis of 102 nonproband DICER1
      carriers, which represented 3,344 person-years of observation, showed
      significant cancer excesses overall, particularly of gynecologic and
      thyroid cancers.
    explanation: >-
      Establishes the excess malignancy risk and identifies the organ systems
      that dominate it.

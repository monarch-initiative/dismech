name: DICER1 Tumor Predisposition Syndrome
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Pediatric Cancer
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: DICER1-related tumor predisposition
  term:
    id: MONDO:0100216
    label: DICER1-related tumor predisposition
synonyms:
- DICER1 syndrome
- pleuropulmonary blastoma familial tumor predisposition syndrome
- DICER1-related tumor predisposition syndrome
description: >-
  DICER1 tumor predisposition syndrome is an autosomal dominant, pleiotropic
  tumor-predisposition disorder caused by germline pathogenic variants in DICER1,
  which encodes the RNase III endonuclease that generates mature microRNAs. Its
  tumor spectrum is unusually wide and developmentally timed — pleuropulmonary
  blastoma in infancy and early childhood, cystic nephroma, ovarian
  Sertoli-Leydig cell tumor, multinodular goitre and differentiated thyroid
  carcinoma, nasal chondromesenchymal hamartoma, embryonal rhabdomyosarcoma and
  pineoblastoma — and the unifying lesion is not a growth-control pathway but the
  microRNA machinery itself.
  Two features set this syndrome apart from the classical two-hit tumor
  suppressor syndromes and both matter for curation. First, the somatic second
  event is not loss of function: germline alleles are typically truncating,
  while tumors characteristically acquire a missense change at a metal-binding
  residue of the RNase IIIb domain, selectively abolishing 5p-strand cleavage
  while leaving 3p-strand processing intact. The second hit therefore alters what
  the enzyme makes rather than abolishing the enzyme, which is why this entry
  does not conform to the biallelic-loss node of the two-hit module. Second, in
  pleuropulmonary blastoma the cell that loses DICER1 expression is the cyst
  epithelium while the cell that becomes malignant is the underlying mesenchyme,
  suggesting a non-cell-autonomous initiation in which loss of DICER1 in one
  compartment deranges diffusible signals that govern growth in another.
  Penetrance is only moderate: in systematically ascertained non-proband
  carriers, 5.3% had developed a neoplasm by age 10 and 19.3% by age 50, so most
  carriers of a DICER1 variant never develop a tumor.

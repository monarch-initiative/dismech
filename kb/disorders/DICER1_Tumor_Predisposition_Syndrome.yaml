genetic:
- name: DICER1
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  relationship_type: CAUSATIVE
  notes: >-
    DICER1 at 14q32 encodes an RNase III endonuclease that generates mature
    microRNAs. Germline truncating variants cause the syndrome; tumors
    characteristically acquire a somatic RNase IIIb missense change rather than a
    second loss-of-function allele.
  evidence:
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 encodes a ~218 kDa RNase III endonuclease that is a key component
      of a highly conserved cellular pathway responsible for generation of small
      RNAs (miRNAs and siRNAs).
    explanation: >-
      Identifies the gene product and its molecular function.
discussions:
- discussion_id: gap_dicer1_non_classical_second_hit
  prompt: >-
    Does DICER1-driven tumorigenesis require a classical second hit at the
    DICER1 locus, and in which cellular compartment must that event occur?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Compartment-Restricted Loss of DICER1 Expression
  - pathophysiology#Non-Cell-Autonomous Mesenchymal Transformation
  rationale: >-
    DICER1 does not fit the Knudson template cleanly, and pretending it does
    would be a curation error rather than a simplification. The germline allele
    is loss-of-function but the characteristic somatic event alters
    strand-selective processing rather than abolishing the enzyme, so the tumor
    cell is not DICER1-null. In pleuropulmonary blastoma the compartment lacking
    DICER1 protein is the epithelium while the malignant compartment is the
    mesenchyme, and the original report states plainly that the genetic basis of
    the altered epithelial expression was unknown and that whether DICER1
    haploinsufficiency in the mesenchyme contributes remains open. This entry
    therefore conforms to the first-hit and tumor-spectrum nodes of the germline
    two-hit module but deliberately not to its biallelic-loss node.
  proposed_experiments:
  - experiment_id: compartment_resolved_dicer1_genotyping_in_ppb
    name: Compartment-resolved DICER1 genotyping and microRNA profiling in pleuropulmonary blastoma
    description: >-
      Separately genotype and microRNA-profile the epithelial and mesenchymal
      compartments of the same pleuropulmonary blastoma specimens, to establish
      which compartment carries which DICER1 allele, whether 5p-strand depletion
      is confined to one of them, and whether the diffusible-factor hypothesis
      predicts the observed mesenchymal transcriptome.

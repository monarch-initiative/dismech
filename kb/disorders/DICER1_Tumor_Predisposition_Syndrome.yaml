  description: >-
    DICER1 syndrome is transmitted as an autosomal dominant predisposition with
    incomplete, age- and sex-dependent penetrance. Most obligate carriers are
    phenotypically normal, and after age 10 the risk in female carriers exceeds
    that in males, driven largely by gynaecological and thyroid neoplasms.
  evidence:

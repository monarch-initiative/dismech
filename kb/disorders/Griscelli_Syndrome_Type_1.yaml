      syndrome.
- name: Chediak-Higashi syndrome
  description: >-
    LYST-related Chediak-Higashi syndrome shares silvery hair and can have
    neurological disease, but it has giant granules in leukocytes and small,
    regularly distributed pigment granules in the hair shaft, plus
    immunodeficiency and bleeding.
  distinguishing_features:
  - Giant cytoplasmic granules on the blood film.
  - Small regular hair-shaft pigment granules rather than large irregular clumps.

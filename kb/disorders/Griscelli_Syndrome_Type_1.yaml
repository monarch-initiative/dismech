      label: microfilament motor activity
    modifier: DECREASED
  downstream:
  - target: Failed Recruitment of Myosin Va to Melanosomes
    causal_link_type: DIRECT
    description: >-
      Without the exon-F isoform there is no motor for melanophilin to recruit
      to the RAB27A-bearing melanosome.
    evidence:
    - reference: PMID:11887186
      reference_title: "Identification of an organelle receptor for myosin-Va."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Melanophilin creates this link by binding to Rab27a in a GTP-dependent fashion through its amino terminus, and to myosin-Va through its carboxy terminus.
      explanation: >-
        Myosin Va is the cargo-binding partner melanophilin recruits; without
        it the receptor complex has no motor.
  - target: Loss of Myosin Va in Central Neurons
    causal_link_type: DIRECT
    description: >-
      Truncating alleles also remove the neuronal myosin Va that the
      exon-F-restricted deletion spares; this is the neurological branch.
    evidence:

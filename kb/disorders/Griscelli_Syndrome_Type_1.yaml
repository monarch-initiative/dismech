- name: Loss of Parallel Fiber-Purkinje Cell Long-Term Depression
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Long-term depression at parallel fiber-Purkinje cell synapses, the form of
    plasticity that underlies cerebellar motor learning, is abolished in young
    myosin Va mutant mice and rats, and cerebellum-dependent motor learning
    is severely impaired. In the hypomorphic dilute-neurological mouse both
    recover in adulthood as some myosin Va and spine smooth ER return.

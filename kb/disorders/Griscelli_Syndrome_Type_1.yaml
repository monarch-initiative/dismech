      all patients with RAB27A mutations, but none with the MYO5A mutation, developed HS
    explanation: >-
      The haemophagocytic syndrome separates the RAB27A form from the MYO5A
      form.
- name: Griscelli syndrome type 3
  description: >-
    MLPH-related Griscelli syndrome has the same hair and skin phenotype with
    no neurological or immunological disease. The MYO5A exon-F deletion
    produces the same pigment-only picture and is the main genetic mimic.
  distinguishing_features:
  - No neurological impairment in GS3.
  - Biallelic MLPH variants, or a MYO5A exon-F deletion, rather than truncating MYO5A variants.
  disease_term:
    preferred_term: Griscelli syndrome type 3
    term:
      id: MONDO:0012220
      label: Griscelli syndrome type 3
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GS type 1 have primary central nervous system dysfunction, type 2 patients commonly develop hemophagocytic lymphohistiocytosis, and type 3 patients have only partial albinism.
    explanation: >-
      Contrasts the primary neurological disease of GS1 with the
      pigment-only GS3.
- name: Elejalde syndrome
  description: >-
    Neuroectodermal melanolysosomal disease: silvery-leaden hair, bronzing of
    sun-exposed skin and severe neurological disease without immune
    impairment. Its clinical picture overlaps GS1 almost entirely and whether
    it is a separate disease is unresolved (see discussions); it has its own
    MONDO term and has not been given a molecular basis distinct from MYO5A.
  distinguishing_features:
  - Bronze skin after sun exposure is emphasized in Elejalde reports.
  - Abnormal inclusion bodies in fibroblasts and abnormal melanosomes are described in some Elejalde patients.
  disease_term:
    preferred_term: Elejalde syndrome
    term:
      id: MONDO:0009742
      label: neuroectodermal melanolysosomal disease

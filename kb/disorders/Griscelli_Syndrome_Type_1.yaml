genetic:
- name: MYO5A
  notes: >-
    MYO5A (15q21.2) encodes the myosin Va heavy chain: an N-terminal motor
    head, a lever arm, a coiled-coil dimerization region and a C-terminal
    globular tail that binds cargo. Exon F, an alternatively spliced tail exon
    used in melanocytes, is required for binding melanophilin and hence the
    melanosome. Reported neurological GS1 alleles are truncating and remove
    every isoform; a deletion restricted to exon F removes only the
    melanocyte isoform and gives a pigment-only phenotype.
  gene_term:
    preferred_term: MYO5A
    term:
      id: hgnc:7602
      label: MYO5A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_792cf7b2-5ca7-4d85-95a5-a43eaa52b180-2021-07-27T144901.941Z
    evidence:
    - reference: CGGV:assertion_792cf7b2-5ca7-4d85-95a5-a43eaa52b180-2021-07-27T144901.941Z
      reference_title: "MYO5A / Griscelli syndrome type 1 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MYO5A | HGNC:7602 | Griscelli syndrome type 1 | MONDO:0008962 | AR | Definitive | SOP8 | Syndromic Disorders Gene Curation Expert Panel | 2021-07-27T14:49:01.941Z"
      explanation: >-
        ClinGen gene-disease validity row for this entry's MONDO term.
  variants:
  - name: MYO5A c.1633_1634delAA (p.Asn545Glnfs*10)
    description: >-
      Homozygous frameshift in two siblings from a consanguineous Iranian
      family, co-segregating with disease and classified pathogenic under
      ACMG criteria. The patients had a severe phenotype with distal joint
      hyperlaxity, not previously reported in GS1.
    evidence:
    - reference: PMID:36651988
      reference_title: "Griscelli syndrome type 1: a novel pathogenic variant, and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing (WES) revealed a novel homozygous truncating variant c.1633_1634delAA (p.Asn545Glnfs*10) in the MYO5A gene
      explanation: >-
        Identifies the variant and its homozygous state.
  - name: MYO5A c.3508C>T
    description: >-
      Homozygous variant in an Afghan girl from a consanguineous family with
      hypotonia and developmental delay but no visibly silvery hair. The
      protein consequence is not stated in the abstract and is not recorded
      here.
    evidence:
    - reference: PMID:42376587
      reference_title: "A Novel MYO5A Mutation (c.3508C>T) in a 27-Month-Old Girl With Hypotonia and Developmental Delay: Expanding the Phenotypic Spectrum of Griscelli Syndrome Type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole exome sequencing revealed a novel homozygous MYO5A variant (c.3508C >T), confirming GS1.
      explanation: >-
        Identifies the variant and its homozygous state.
  - name: MYO5A exon F deletion
    description: >-
      Homozygous deletion of the tissue-restricted exon F. It removes the
      melanocyte isoform needed for melanophilin binding and leaves the
      neuronal isoforms, giving pigmentary dilution without neurological
      disease. Its discoverers classed it as a restricted form of GS1, and
      the GS3 entry records the same genotype as a phenocopy.
    evidence:
    - reference: PMID:12897212
      reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also show that an identical phenotype can result from the deletion of the MYO5A F-exon, an exon with a tissue-restricted expression pattern.
      explanation: >-
        Reports the exon-F deletion and its pigment-only phenotype.
  evidence:
  - reference: PMID:9207796
    reference_title: "Griscelli disease maps to chromosome 15q21 and is associated with mutations in the myosin-Va gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that the Griscelli disease locus co-localizes on chromosome 15q21 with the myosin-Va gene, MYO5a, and that mutations of this gene occur in two patients with the disease.
    explanation: >-
      The founding report of MYO5A mutations in Griscelli disease.
  - reference: PMID:10704277
    reference_title: "Two genes are responsible for Griscelli syndrome at the same 15q21 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a second MyoVa mutation in a new patient, confirming this first finding.
    explanation: >-
      Replicates MYO5A mutation in an independent patient, while showing
      that other Griscelli patients map to a second gene at the same locus.
  - reference: PMID:12148598
    reference_title: "Griscelli disease: genotype-phenotype correlation in an array of clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, two patients who primarily presented with a neurological impairment in the absence of infection susceptibility or HS were found to have homozygous MYO5A mutations.
    explanation: >-
      Links homozygous MYO5A mutation to the neurological, non-immune form.
discussions:
- discussion_id: controversy_gs1_elejalde_nosology
  prompt: >-
    Are Griscelli syndrome type 1 and Elejalde syndrome (neuroectodermal
    melanolysosomal disease) one MYO5A disease, two allelic disorders, or - as
    one group argued - is "GS1" a mislabel for Elejalde syndrome, with true
    Griscelli syndrome always caused by RAB27A?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#Griscelli Syndrome Type 1
  - pathophysiology#Primary Neurological Impairment
  - differential_diagnoses#Elejalde syndrome
  rationale: >-
    Three published positions are in play. Anikster and colleagues, finding a
    RAB27A deletion in a kindred with variable neurological disease, proposed
    that every true Griscelli patient has a RAB27A defect with neurological
    involvement secondary to the immune disorder, and that the two original
    MYO5A patients, who had neurological disease without immune defects, may
    instead have had Elejalde syndrome. Duran-McKinster and colleagues, from
    seven Elejalde patients without immune impairment, judged Elejalde and
    Griscelli syndrome probably allelic but separate. Cagdas and colleagues,
    reporting long-term follow-up of GS1 and GS3, count Elejalde-labelled
    patients among the roughly 20 GS1 cases. The weight of later evidence favours a single MYO5A
    spectrum: genotype tracks phenotype across unrelated series (RAB27A with
    haemophagocytic syndrome, MYO5A with primary neurological disease), MYO5A
    T cells have normal cytotoxicity, and the features offered to separate
    Elejalde syndrome - bronzing of sun-exposed skin, fibroblast inclusions,
    abnormal melanosomes - are morphological and inconsistently reported. What
    is missing is the decisive datum: molecular testing of patients diagnosed
    clinically as Elejalde syndrome. Several later mechanistic papers state
    flatly that MYO5A mutations cause both GS1 and Elejalde syndrome, but
    they report no new patient genotypes and so restate the assumption
    rather than test it. MONDO keeps the two as separate terms, so
    this entry binds GS1 alone and lists Elejalde syndrome as a differential
    rather than a synonym; that choice should be revisited, possibly toward a
    merge, if Elejalde-labelled patients prove to carry biallelic MYO5A
    variants.
  evidence:
  - reference: PMID:12058346
    reference_title: "Evidence that Griscelli syndrome with neurological involvement is caused by mutations in RAB27A, not MYO5A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two patients described elsewhere who have MYO5A mutations and neurological complications but no immunologic defects may not have GS but instead may have Elejalde syndrome, a condition characterized by mild hypopigmentation and severe, primary neurological abnormalities.
    explanation: >-
      The position that MYO5A patients have Elejalde syndrome rather than
      Griscelli syndrome.
  - reference: PMID:10052404
    reference_title: "Elejalde syndrome--a melanolysosomal neurocutaneous syndrome: clinical and morphological findings in 7 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although Elejalde syndrome and Griscelli syndrome are similar, the possibility that they are 2 different diseases, although probably allelic related, is suggested.
    explanation: >-
      The position that the two are distinct but probably allelic.
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 2 patients with type 3 and about 20 GS type 1 patients, including the patients described as Elejalde syndrome, have been reported.
    explanation: >-
      The position that Elejalde-labelled patients belong within GS1.
  - reference: PMID:12148598
    reference_title: "Griscelli disease: genotype-phenotype correlation in an array of clinical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Griscelli disease presents with a heterogeneous clinical picture that seems to reflect the involved gene defect.
    explanation: >-
      Genotype tracks phenotype across a series of 13 patients, the argument
      for a gene-defined MYO5A disease.
  - reference: PMID:21508232
    reference_title: "A role for myosin Va in cerebellar plasticity and motor learning: a possible mechanism underlying neurological disorder in myosin Va disease."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Mutations of the myosin Va gene cause the neurological diseases Griscelli syndrome type 1 and Elejalde syndrome in humans
    explanation: >-
      An example of the later literature treating Elejalde syndrome as a
      MYO5A disease without new patient genotypes.
  proposed_experiments:
  - experiment_id: exp_gs1_elejalde_myo5a_sequencing
    name: MYO5A, RAB27A and MLPH sequencing of clinically diagnosed Elejalde syndrome
    description: >-
      Sequence MYO5A (including exon F and copy-number analysis), RAB27A and
      MLPH in patients and families published or diagnosed as Elejalde
      syndrome, and compare their skin bronzing, fibroblast ultrastructure
      and neurological course with molecularly confirmed GS1.
    would_support:
    - pathophysiology#Primary Neurological Impairment
    supporting_outcome:
    - >-
      Biallelic truncating MYO5A variants in Elejalde-labelled patients, with
      no feature that separates them from GS1, supporting one disease.
    refuting_outcome:
    - >-
      Elejalde-labelled patients without MYO5A, RAB27A or MLPH variants, or
      with a distinct gene, supporting a separate entity.
- discussion_id: mismatch_gs1_rodent_cerebellar_mechanism
  prompt: >-
    Does the rodent Purkinje-spine mechanism - absent smooth ER, reduced
    IP3-mediated calcium release and lost long-term depression - explain the
    human GS1 neurological disease, which presents as global hypotonia,
    developmental delay, intellectual disability and seizures rather than
    primarily as cerebellar ataxia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Transport of Smooth ER into Purkinje Cell Dendritic Spines
  - pathophysiology#Reduced IP3-Mediated Calcium Release in Purkinje Cell Spines
  - pathophysiology#Loss of Parallel Fiber-Purkinje Cell Long-Term Depression
  - pathophysiology#Primary Neurological Impairment
  rationale: >-
    Every step of the neurological branch below the gene is rodent evidence:
    dilute-lethal and dilute-neurological mice, dop rats, and cultured mouse
    Purkinje neurons. The chain is internally strong - myosin Va carries
    almost all smooth ER into spines, null spines lack the store, LTD fails
    for want of IP3-mediated calcium, and LTD returns when myosin Va does in
    the hypomorphic mouse. What it explains is a cerebellar phenotype. The
    human disease is broader and does not recover: survivors remain severely
    impaired into adulthood, whereas the dilute-neurological mouse regains
    LTD and motor learning. Even in that mouse, motor incoordination
    outlasts the spine defect, which its authors read as evidence that the
    spine function is not sufficient for coordination; and the rat authors
    offer the spine defect only as a possible explanation of ataxia and
    convulsions. Seizures in particular have no mechanism here: a cerebellar
    plasticity defect is not an obvious epileptogenic lesion, and myosin Va
    has other neuronal cargoes. No human brain tissue, cerebellar imaging
    series or patient-derived neuron has been studied, so the edges from the
    cerebellar nodes to Primary Neurological Impairment are marked as having
    unknown intermediates.
  evidence:
  - reference: PMID:21508232
    reference_title: "A role for myosin Va in cerebellar plasticity and motor learning: a possible mechanism underlying neurological disorder in myosin Va disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, d-n mice had defects of motor coordination from young to adult ages, suggesting that the role of myosin Va in PC spines is not sufficient for motor coordination.
    explanation: >-
      The spine mechanism does not account for the whole motor phenotype
      even in the mouse.
  - reference: PMID:21508232
    reference_title: "A role for myosin Va in cerebellar plasticity and motor learning: a possible mechanism underlying neurological disorder in myosin Va disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice manifest an ataxic gait and clonic seizures during postnatal development, but the neurological disorders are ameliorated in adulthood.
    explanation: >-
      The model recovers, unlike patients.
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our previous patient with GS type I is alive at age 21 without any other problems except severe mental and motor retardation
    explanation: >-
      The human course is persistent severe impairment, not recovery.
  - reference: PMID:17185506
    reference_title: "Myosin Va mutation in rats is an animal model for the human hereditary neurological disease, Griscelli syndrome type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings may account for the ataxic movements and clonic convulsions displayed by dop rats.
    explanation: >-
      The model authors state the link to the organism phenotype as a
      possibility.
  proposed_experiments:
  - experiment_id: exp_gs1_ipsc_purkinje_spine_er
    name: Spine ER and calcium imaging in GS1 patient-derived Purkinje neurons
    description: >-
      Differentiate Purkinje neurons from GS1 patient and isogenic corrected
      iPSCs and measure smooth ER entry into spines, IP3-evoked spine calcium
      release and dendritic transport of other myosin Va cargoes.
    would_support:
    - pathophysiology#Failed Transport of Smooth ER into Purkinje Cell Dendritic Spines
    - pathophysiology#Reduced IP3-Mediated Calcium Release in Purkinje Cell Spines
    supporting_outcome:
    - >-
      Patient neurons lack spine smooth ER and IP3-evoked calcium release,
      rescued by correction.
    refuting_outcome:
    - >-
      Patient neurons insert ER into spines normally, pointing to a
      different neuronal cargo in the human disease.
  - experiment_id: exp_gs1_neuroimaging_eeg_series
    name: Pooled neuroimaging and EEG review of molecularly confirmed GS1
    description: >-
      Collect brain MRI and EEG from all molecularly confirmed GS1 patients
      to ask whether the disease is cerebellar-predominant or diffuse, and
      where seizures arise.
    would_support:
    - pathophysiology#Loss of Parallel Fiber-Purkinje Cell Long-Term Depression
    supporting_outcome:
    - >-
      Cerebellar-predominant abnormalities, consistent with the rodent
      mechanism.
    refuting_outcome:
    - >-
      Diffuse cortical involvement with cortical seizure onset, implying
      mechanisms outside the cerebellum.
- discussion_id: interpretation_gs1_exon_f_branch_point
  prompt: >-
    How should the MYO5A exon-F deletion, which gives pigmentary dilution
    without neurological disease, be classified, and does it establish exon
    F usage as the point where the pigmentary and neurological arms of this
    pathograph divide?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#MYO5A Biallelic Loss of Function
  - pathophysiology#Failed Recruitment of Myosin Va to Melanosomes
  - pathophysiology#Loss of Myosin Va in Central Neurons
  - genetic#MYO5A
  rationale: >-
    Myosin Va reaches the melanosome only through melanophilin, and that
    interaction absolutely requires exon F, an alternatively spliced exon of
    the myosin Va tail used in melanocytes. A homozygous deletion of exon F
    reproduces the pigment-only phenotype of melanophilin deficiency, while
    truncating alleles that remove the whole protein add the neurological
    disease. Taken together these make exon-F usage the molecular branch
    point of the disease, and they are the strongest human evidence that the
    neurological arm reflects loss of neuronal myosin Va and not some
    consequence of the pigment defect. The classification of the exon-F
    deletion is unsettled in a way that matters for curation: its
    discoverers named it a restricted form of GS1, a later report described
    a GS3-like phenotype with the same deletion, and some aggregators map
    the genotype to GS3. This entry records it as a MYO5A variant within GS1
    and annotates that it gives the GS3 phenotype; the GS3 entry records the
    same genotype as a disputed phenocopy. The two records are consistent -
    gene-defined here, phenotype-defined there - but a reader looking up
    "GS1" by phenotype would not expect a patient with normal neurology.
    ClinGen's Definitive GS1 curation counts the PMID:12897212 intragenic
    deletion among its six scored variants, which supports keeping it under
    GS1.
  evidence:
  - reference: PMID:11887186
    reference_title: "Identification of an organelle receptor for myosin-Va."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      this latter interaction, similar to the ability of myosin-Va to colocalize with melanosomes and influence their distribution in vivo, is absolutely dependent on the presence of exon-F
    explanation: >-
      Exon F is what makes myosin Va a melanosome motor.
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also show that an identical phenotype can result from the deletion of the MYO5A F-exon, an exon with a tissue-restricted expression pattern.
    explanation: >-
      The exon-F deletion gives the pigment-only phenotype; the paper's
      title classes it as GS1.
  - reference: PMID:7774591
    reference_title: "Retroviral sequences located within an intron of the dilute gene alter dilute expression in a tissue-specific manner."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that Emv-3 sequences are located within an intron of the dilute gene in a region of the C-terminal tail that is differentially spliced
    explanation: >-
      The pigment-only dilute-viral mouse allele sits in the alternatively
      spliced tail region, the same logic as the human exon-F deletion.
  proposed_experiments:
  - experiment_id: exp_gs1_isoform_expression_mapping
    name: Exon-F isoform mapping in human melanocytes and neurons
    description: >-
      Quantify MYO5A exon-F inclusion by long-read RNA sequencing in human
      melanocytes, keratinocytes, cortical and cerebellar neurons, and in
      cells from exon-F deletion carriers, to confirm that neuronal myosin
      Va is exon-F-negative and preserved in those carriers.
    would_support:
    - pathophysiology#Loss of Myosin Va in Central Neurons
    supporting_outcome:
    - >-
      Neuronal MYO5A transcripts lack exon F and are intact in exon-F
      deletion carriers.
    refuting_outcome:
    - >-
      Substantial exon-F inclusion in neurons, which would require another
      explanation for the normal neurology of exon-F deletion carriers.
- discussion_id: gap_gs1_immune_sparing
  prompt: >-
    Why does loss of myosin Va spare cytotoxic granule exocytosis when its
    melanosome partner RAB27A is essential for it, and what does that imply
    for the work-up of a child with silvery hair?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MYO5A Biallelic Loss of Function
  - differential_diagnoses#Griscelli syndrome type 2
  rationale: >-
    RAB27A sits on both the melanosome and the cytotoxic granule, and its
    loss removes both functions; myosin Va sits in the melanosome complex,
    yet T cells from MYO5A patients degranulate and kill normally and no
    MYO5A patient has developed haemophagocytic syndrome. Mouse work
    explains part of this: neither melanophilin nor myosin Va is detectable
    in cytotoxic T lymphocytes, so RAB27A works with a different class of
    effector there, and losing myosin Va removes nothing from that cell.
    The open question is the identity of the effector and motor that RAB27A
    uses at the lytic synapse, which the sources cited here do not settle. The clinical
    consequence is large: GS1 needs no transplant, whereas GS2 needs one
    urgently, and in an infant with silvery hair and neurological signs
    the neurological picture alone does not settle the type, because GS2
    also causes neurological disease through brain infiltration. The
    cytotoxic-lymphocyte data rest on few patients, and formal degranulation
    testing across the confirmed GS1 series has not been reported.
  evidence:
  - reference: PMID:10835631
    reference_title: "Mutations in RAB27A cause Griscelli syndrome associated with haemophagocytic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RAB27A-deficient T cells exhibited reduced cytotoxicity and cytolytic granule exocytosis, whereas MYO5A-defective T cells did not.
    explanation: >-
      Patient T-cell assays show the immune arm is RAB27A-specific.
  - reference: PMID:12897212
    reference_title: "Griscelli syndrome restricted to hypopigmentation results from a melanophilin defect (GS3) or a MYO5A F-exon deletion (GS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This spectrum of GS conditions pinpoints the distinct molecular pathways used by melanocytes, neurons, and immune cells in secretory granule exocytosis, which in part remain to be unraveled.
    explanation: >-
      States that the cell-type-specific pathways remain partly unknown.
  - reference: PMID:11886590
    reference_title: "The leaden gene product is required with Rab27a to recruit myosin Va to melanosomes in melanocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that neither the leaden gene product (melanophilin) nor myosin Va was detectable in cytotoxic T lymphocytes
    explanation: >-
      Myosin Va is not part of the cytotoxic lymphocyte machinery, which
      explains why its loss spares cytotoxicity.
  - reference: PMID:11886590
    reference_title: "The leaden gene product is required with Rab27a to recruit myosin Va to melanosomes in melanocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that Rab27a interacts with different classes of effector proteins in melanocytes and cytotoxic T lymphocytes.
    explanation: >-
      Frames the remaining gap: which effector RAB27A uses in lymphocytes.
  proposed_experiments:
  - experiment_id: exp_gs1_degranulation_series
    name: Standardized lymphocyte degranulation testing across confirmed GS1
    description: >-
      Measure NK-cell and cytotoxic T-cell degranulation (CD107a surface
      expression) and cytotoxicity in every available molecularly confirmed
      GS1 patient and compare with GS2 and healthy controls.
    would_support:
    - differential_diagnoses#Griscelli syndrome type 2
    supporting_outcome:
    - >-
      Normal degranulation in all GS1 patients, confirming that the immune
      arm is absent and that functional testing discriminates GS1 from GS2.
    refuting_outcome:
    - >-
      Reduced degranulation in some GS1 patients, which would reopen
      immune surveillance for the MYO5A form.
- discussion_id: hypothesis_gs1_neuronal_endosome_mitochondria
  prompt: >-
    Do defects in endosomal transport (through a MYO5A-ANKFY1-RAB5 link) and
    in mitochondrial morphology, reported in the NAP Myo5a mouse, contribute
    to the GS1 neurological disease alongside the Purkinje-spine defect?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Myosin Va in Central Neurons
  - pathophysiology#Primary Neurological Impairment
  rationale: >-
    A spontaneous exon-14 splice variant that abolishes MYO5A protein (the
    NAP mouse) gives rapidly progressive ataxia from postnatal day 11 and
    death before weaning. Cerebellar proteomics pointed to early-endosome
    and short-range organelle transport proteins, MYO5A co-precipitated with
    the RAB5A effector ANKFY1, the external granule layer was expanded, and
    neurons had elongated mitochondria. These observations widen the
    neuronal arm beyond the spine smooth ER and could bear on the cerebral
    features - intellectual disability and seizures - that the cerebellar
    mechanism does not explain. They come from a single recent study in one
    allele and have not been reproduced or tested in human cells, so they
    are recorded here and not as pathograph nodes.
  evidence:
  - reference: PMID:40022605
    reference_title: "A novel, rapidly progressive ataxia due to a spontaneous Myo5a mutation in mice impairs transport proteins and alters mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using cerebellar lysates and primary neurons, we provide evidence for an interaction between MYO5A and ANKFY1, a known effector for the endosomal protein, RAB5A.
    explanation: >-
      Proposes an endosomal cargo link for neuronal myosin Va.
  - reference: PMID:40022605
    reference_title: "A novel, rapidly progressive ataxia due to a spontaneous Myo5a mutation in mice impairs transport proteins and alters mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also found neurons from NAP mice had elongated mitochondria, linking MYO5A to mitochondrial homeostasis.
    explanation: >-
      Reports the mitochondrial phenotype.
  proposed_experiments:
  - experiment_id: exp_gs1_endosome_mitochondria_human_neurons
    name: Endosome and mitochondrial phenotyping in MYO5A-null human neurons
    description: >-
      Image RAB5-positive endosome trafficking and mitochondrial length in
      MYO5A-null and corrected human iPSC-derived cortical and cerebellar
      neurons.
    would_support:
    - pathophysiology#Loss of Myosin Va in Central Neurons
    supporting_outcome:
    - >-
      Abnormal endosome motility and elongated mitochondria in MYO5A-null
      human neurons, rescued by correction.
    refuting_outcome:
    - >-
      Normal endosomes and mitochondria in human MYO5A-null neurons.
- discussion_id: interpretation_gs1_diagnosis_without_silvery_hair
  prompt: >-
    Can GS1 be set aside on clinical grounds when silvery hair is absent, and
    is the disease under-ascertained among infants with unexplained
    hypotonia and developmental delay?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - phenotypes#Silver-gray hair
  - phenotypes#Large pigment clumps in the hair shaft
  - diagnosis#Light microscopy of the hair shaft
  - diagnosis#MYO5A molecular testing
  rationale: >-
    The classical route to a Griscelli diagnosis runs through the hair:
    silvery hair prompts microscopy, which shows the clumped pigment. A
    2026 GS1 patient presented with hypotonia and developmental delay and no
    silvery hair, was diagnosed by exome sequencing, and only then was found
    to have the hair-shaft abnormality. Because the case count is small and
    almost all from consanguineous families investigated for pigmentation,
    patients with subtle pigmentary dilution are likely to be missed or to
    be found only by exome sequencing for a neurodevelopmental disorder. Two
    practical consequences follow: hair microscopy is worth doing in a
    hypotonic, delayed infant from a consanguineous family even when the hair
    looks normal, and the literature-derived phenotype frequencies here are
    biased toward patients with obvious pigmentation.
  evidence:
  - reference: PMID:42376587
    reference_title: "A Novel MYO5A Mutation (c.3508C>T) in a 27-Month-Old Girl With Hypotonia and Developmental Delay: Expanding the Phenotypic Spectrum of Griscelli Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the absence of the characteristic silvery hair, microscopic hair examination of the patient showed melanin distribution abnormalities.
    explanation: >-
      A confirmed patient without visible silvery hair but with the
      microscopic hair defect.
  - reference: PMID:42376587
    reference_title: "A Novel MYO5A Mutation (c.3508C>T) in a 27-Month-Old Girl With Hypotonia and Developmental Delay: Expanding the Phenotypic Spectrum of Griscelli Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case highlights the phenotypical variability in GS1 and emphasizes on the importance of considering genetic testing even in atypical presentations.
    explanation: >-
      The reporting authors draw the ascertainment lesson.

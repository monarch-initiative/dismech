name: Griscelli Syndrome Type 1
creation_date: "2026-11-12T00:00:00Z"
description: >-
  Griscelli syndrome type 1 (GS1) is an ultra-rare autosomal recessive disorder
  caused by biallelic loss-of-function variants in MYO5A, which encodes myosin
  Va, an actin-based motor that carries organelles as cargo. Myosin Va does two
  unrelated jobs, and the disease is the sum of losing both. In melanocytes, its
  exon-F-containing isoform is recruited to the melanosome by RAB27A and
  melanophilin and holds mature melanosomes in the peripheral actin network for
  transfer to keratinocytes and hair; without it pigment is made but clusters
  around the nucleus, giving the silvery-gray hair, large hair-shaft melanin
  clumps and light skin shared with the other Griscelli types. In neurons, where
  myosin Va is abundant, the motor transports smooth endoplasmic reticulum into
  the dendritic spines of cerebellar Purkinje cells, among other cargo; rodent
  nulls lose that spine calcium store and cerebellar long-term depression and
  develop ataxia and seizures. Patients have a primary neurological disease of
  infancy - hypotonia, severe developmental delay, seizures and intellectual
  disability - with no immune defect and no haemophagocytic
  lymphohistiocytosis, which separates GS1 from RAB27A-related GS2. Whether GS1
  and Elejalde syndrome (neuroectodermal melanolysosomal disease) are one
  disease is an unresolved nosological question.
category: Mendelian

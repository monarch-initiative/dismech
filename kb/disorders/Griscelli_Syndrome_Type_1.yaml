- name: Loss of Myosin Va in Central Neurons
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Myosin Va is abundant in neurons of the central nervous system, which use
    isoforms without the melanocyte exon F. A truncating allele removes this
    neuronal motor as well; a deletion confined to exon F does not, and gives
    pigmentary dilution with no neurological disease. That contrast, rather
    than any human neuropathology, is the main human evidence that the
    neurological arm is a direct consequence of losing neuronal myosin Va
    and not of the melanosome defect.
  cell_types:
  - preferred_term: CNS neuron
    term:
      id: CL:0000117
      label: CNS neuron (sensu Vertebrata)
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  downstream:
  - target: Failed Transport of Smooth ER into Purkinje Cell Dendritic Spines
    causal_link_type: DIRECT
    description: >-
      Myosin Va is the motor that pulls smooth endoplasmic reticulum into
      Purkinje cell spines.
    evidence:
    - reference: PMID:21151132
      reference_title: "Myosin-Va transports the endoplasmic reticulum into the dendritic spines of Purkinje neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, myosin-Va is responsible for almost all of the spine ER insertion events.
      explanation: >-
        Without myosin Va, spine ER insertion largely fails.
  - target: Abnormal Photoreceptor Synaptic Transmission
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A retinal neuronal effector: photoreceptor synapses are abnormal in
      neurologically affected myosin Va mutant mice.
    evidence:

- name: Failed Transport of Smooth ER into Purkinje Cell Dendritic Spines
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In cerebellar Purkinje cells myosin Va acts as a point-to-point
    transporter that pulls tubules of smooth endoplasmic reticulum, carrying
    IP3 receptors, into dendritic spines. In myosin Va-null mice and rats the
    spines of Purkinje cells contain no smooth ER and no IP3 receptors. The
    evidence is entirely from rodents and cultured rodent neurons.

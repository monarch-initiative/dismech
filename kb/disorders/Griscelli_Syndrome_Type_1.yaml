    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main clinical features include silver-leaden hair, bronze skin after sun exposure, and neurologic involvement (seizures, severe hypotonia, and mental retardation).
    explanation: >-
      The defining Elejalde features, which coincide with GS1 except for

diagnosis:
- name: Light microscopy of the hair shaft
  diagnosis_term:
    preferred_term: microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  description: >-
    Light microscopy of plucked hair shows large, irregularly distributed
    melanin clumps along the shaft. It establishes a Griscelli syndrome, can
    be positive when the hair does not look silvery, and separates the
    Griscelli forms from Chediak-Higashi syndrome, but it does not assign the
    type.
  results: >-
    Large melanin clumps irregularly distributed along the hair shaft.
  evidence:
  - reference: PMID:42376587
    reference_title: "A Novel MYO5A Mutation (c.3508C>T) in a 27-Month-Old Girl With Hypotonia and Developmental Delay: Expanding the Phenotypic Spectrum of Griscelli Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the absence of the characteristic silvery hair, microscopic hair examination of the patient showed melanin distribution abnormalities.
    explanation: >-
      Hair microscopy detected the Griscelli hair-shaft defect in a GS1
      patient whose hair looked normal.
- name: MYO5A molecular testing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Exome sequencing, or a panel covering MYO5A, RAB27A, MLPH and LYST,
    assigns the Griscelli type. Typing is the decision point of the work-up:
    a RAB27A result commits the patient to haemophagocytic surveillance and
    transplantation, whereas a MYO5A result does not.
  results: >-
    Biallelic pathogenic MYO5A variants confirm Griscelli syndrome type 1.
  evidence:
  - reference: PMID:36651988
    reference_title: "Griscelli syndrome type 1: a novel pathogenic variant, and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) revealed a novel homozygous truncating variant c.1633_1634delAA (p.Asn545Glnfs*10) in the MYO5A gene
    explanation: >-
      Exome sequencing made the molecular diagnosis in a GS1 family.
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since prognosis, treatment options, and genetic counseling markedly differ among different types, molecular characterization has utmost importance in GS.
    explanation: >-
      Molecular typing decides management in Griscelli syndrome.
- name: Lymphocyte cytotoxicity and degranulation testing
  description: >-
    NK-cell and cytotoxic T-cell degranulation or cytotoxicity testing
    separates GS1 from GS2 before molecular results are available; it is
    normal in GS1 and reduced in GS2.
  results: >-
    Normal lymphocyte cytotoxicity and granule exocytosis in GS1.
  evidence:
  - reference: PMID:10835631
    reference_title: "Mutations in RAB27A cause Griscelli syndrome associated with haemophagocytic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RAB27A-deficient T cells exhibited reduced cytotoxicity and cytolytic granule exocytosis, whereas MYO5A-defective T cells did not.
    explanation: >-
      Patient T-cell assays discriminate the MYO5A from the RAB27A form.
differential_diagnoses:
- name: Griscelli syndrome type 2
  description: >-
    RAB27A-related Griscelli syndrome shares the pigmentary phenotype but has
    a cytotoxic-lymphocyte defect that leads to haemophagocytic
    lymphohistiocytosis, and its neurological disease is secondary to brain
    infiltration. It needs haematopoietic stem cell transplantation; GS1 does
    not.
  distinguishing_features:
  - Haemophagocytic lymphohistiocytosis and impaired lymphocyte cytotoxicity in GS2; absent in GS1.
  - Biallelic RAB27A rather than MYO5A variants.
  disease_term:
    preferred_term: Griscelli syndrome type 2
    term:
      id: MONDO:0011872
      label: Griscelli syndrome type 2

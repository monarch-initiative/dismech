prevalence:
- population: Worldwide, published case reports
  measure_type: CASES_IN_LITERATURE
  notes: >-
    About 20 GS1 patients had been reported by 2012, a count that already
    includes patients published as Elejalde syndrome, and only nine pathogenic
    MYO5A variants had been confirmed by 2023. Reports cluster in consanguineous
    families from Turkey, Iran and Afghanistan. No population-based prevalence
    or incidence estimate exists.
  evidence:
  - reference: PMID:22711375
    reference_title: "Griscelli syndrome types 1 and 3: analysis of four new cases and long-term evaluation of previously diagnosed patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 2 patients with type 3 and about 20 GS type 1 patients, including the patients described as Elejalde syndrome, have been reported.
    explanation: >-
      Gives the literature case count for GS1 and shows that it pools the
      Elejalde reports, which matters for the nosology discussion below.
  - reference: PMID:36651988
    reference_title: "Griscelli syndrome type 1: a novel pathogenic variant, and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only nine pathogenic variants in the MYO5A gene have been confirmed in association with the GS1.
    explanation: >-
      The confirmed allele count is the only other occurrence measure
      available for the disease.
pathophysiology:
- name: MYO5A Biallelic Loss of Function
  conforms_to: "lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis or Trafficking Component"
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic germline MYO5A variants remove functional myosin Va, the
    actin-based motor of the RAB27A-melanophilin-myosin Va melanosome complex.
    The variants reported in neurological GS1 are truncating (nonsense and
    frameshift), so every isoform of the protein is lost. That is the
    point at which the disease branches: the same null allele removes the
    exon-F-containing isoform melanocytes use and the isoform neurons use,
    which is why GS1, unlike GS3, carries a neurological disease.
  genes:
  - preferred_term: MYO5A
    term:
      id: hgnc:7602
      label: MYO5A

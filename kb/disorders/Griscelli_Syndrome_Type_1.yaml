      explanation: >-
        Links loss of myosin Va to the photoreceptor synapse defect.
  - target: Primary Neurological Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cerebral share of the neurological disease - intellectual
      disability and seizures - has no characterized cellular mechanism; this
      edge records it directly from the neuronal motor loss rather than
      routing it through the cerebellar nodes.
    evidence:
    - reference: PMID:33981514
      reference_title: "Refractory Seizure in a Patient With Griscelli Syndrome: A Unique Case With One Mutation and a Novel Deletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seizure in GS1 seems to be related directly to the MYO5A mutation.
      explanation: >-
        Attributes the neurological disease directly to the MYO5A defect,
        without a named intermediate.
  - target: Deficient Climbing Fiber Innervation of Purkinje Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A parallel neuronal effector: without myosin Va, climbing fibers fail to
      extend fully along Purkinje cell dendrites. The transported cargo
      responsible has not been identified.

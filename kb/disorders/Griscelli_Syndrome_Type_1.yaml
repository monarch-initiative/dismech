      reference_title: "Identification of a novel myosin-Va mutation in an ataxic mutant rat, dilute-opisthotonus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The MyoVA protein expression was severely impaired in the dop/dop brain.
      explanation: >-
        A Myo5a lesion that removes the protein removes it from brain.
    - reference: PMID:40022605
      reference_title: "A novel, rapidly progressive ataxia due to a spontaneous Myo5a mutation in mice impairs transport proteins and alters mitochondria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        excises exon 14 and ablates MYO5A protein expression
      explanation: >-
        A truncating splice allele ablates MYO5A protein in a mouse with
        neurological disease.
  evidence:
  - reference: PMID:9207796
    reference_title: "Griscelli disease maps to chromosome 15q21 and is associated with mutations in the myosin-Va gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that the Griscelli disease locus co-localizes on chromosome 15q21 with the myosin-Va gene, MYO5a, and that mutations of this gene occur in two patients with the disease.
    explanation: >-
      The founding report linking MYO5A mutation to Griscelli disease.
  - reference: PMID:36651988
    reference_title: "Griscelli syndrome type 1: a novel pathogenic variant, and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only nine pathogenic variants in the MYO5A gene have been confirmed in association with the GS1. All of the reported pathogenic variants are truncating.
    explanation: >-
      The confirmed GS1 alleles are all truncating, consistent with loss of
      the whole protein rather than of one isoform.
- name: Failed Recruitment of Myosin Va to Melanosomes
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    On the melanosome, GTP-bound RAB27A recruits melanophilin, which in turn
    recruits myosin Va through the alternatively spliced exon F of the
    myosin Va tail. With myosin Va absent, the receptor complex has no motor
    to recruit, so the melanosome has no link to the actin cytoskeleton. This node is the motor-side
    counterpart of the RAB27A (GS2) and melanophilin (GS3) lesions in the
    same complex.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  cellular_components:
  - preferred_term: melanosome
    term:
      id: GO:0042470
      label: melanosome
  downstream:
  - target: Failed Peripheral Capture of Melanosomes in Melanocytes
    causal_link_type: DIRECT
    description: >-
      A melanosome with no actin motor attached cannot be held in the
      peripheral actin network.
    evidence:
    - reference: PMID:11887186
      reference_title: "Identification of an organelle receptor for myosin-Va."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        this latter interaction, similar to the ability of myosin-Va to colocalize with melanosomes and influence their distribution in vivo, is absolutely dependent on the presence of exon-F
      explanation: >-
        Ties the melanophilin-myosin Va interaction to the motor's ability to
        influence melanosome distribution, the capture step downstream.
  evidence:
  - reference: PMID:11887186
    reference_title: "Identification of an organelle receptor for myosin-Va."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Rab27a binds to the melanosome first and then recruits melanophilin, which in turn recruits myosin-Va.
    explanation: >-
      Establishes the order of assembly of the melanosome receptor for myosin
      Va, placing myosin Va as the last member recruited.
  - reference: PMID:12062444
    reference_title: "Melanophilin directly links Rab27a and myosin Va through its distinct coiled-coil regions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we show that Rab27a, melanophilin, and myosin Va form a ternary complex in the human melanocyte cell line HMV-II.
    explanation: >-
      Shows the tripartite complex in human melanocytes, the complex whose
      motor subunit is lost in GS1.
- name: Failed Peripheral Capture of Melanosomes in Melanocytes
  conforms_to: "lysosome_related_organelle_biogenesis#Interrupted Melanosome Maturation or Peripheral Positioning"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Melanosomes still travel to the cell periphery and back on microtubules,
    but without myosin Va they are not captured by the cortical actin network
    at the dendrites, so they return to the cell centre and accumulate around
    the nucleus. Pigment synthesis and melanosome maturation are normal; the
    defect is positioning. In patient skin this shows as melanocytes packed
    with melanosomes.

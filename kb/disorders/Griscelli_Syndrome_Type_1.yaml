      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The SER acts as an intracellular Ca(2+) store and IP3-mediated Ca(2+) signaling in dendritic spines plays a critical role in synaptic regulation.
      explanation: >-
        States why missing spine smooth ER removes IP3-mediated calcium

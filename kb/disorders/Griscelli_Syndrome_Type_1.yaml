notes: >-
  Scope: this entry curates the MYO5A disease, MONDO:0008962. Its siblings
  Griscelli_Syndrome_Type_2 (RAB27A) and Griscelli_Syndrome_Type_3 (MLPH)
  lose the other two members of the same melanosome complex. GS1 is the only
  one of the three whose extracutaneous disease is neurological, because
  myosin Va, unlike melanophilin, is also a neuronal motor, and, unlike
  RAB27A, is not needed for cytotoxic granule release.

  Elejalde syndrome has its own MONDO term (MONDO:0009742, neuroectodermal
  melanolysosomal disease) and is kept as a differential diagnosis, not a
  synonym, pending molecular data on Elejalde-labelled patients; the
  nosology is set out in the CONTROVERSY discussion. Phenotypes reported only
  under the Elejalde label (developmental regression, early death) are not
  curated as GS1 phenotypes.

  The pigmentary arm conforms to `lysosome_related_organelle_biogenesis` at
  the trigger, the melanosome-positioning node and the delivery node, as the
  GS2 and GS3 entries do: the melanosome is built and pigmented but not
  captured and delivered. The neurological arm (spine smooth ER, IP3
  calcium release, long-term depression, climbing fiber innervation) is not
  a lysosome-related organelle process and conforms to no module node. All of
  its nodes below the gene rest on rodent and cultured-neuron evidence; the
  edges into Primary Neurological Impairment are marked as having unknown
  intermediates for that reason.

  Phenotype frequencies are qualitative bands from case reports and small
  series; no abstract tabulates frequencies across the roughly 20 reported
  patients. Distal joint hyperlaxity, described in one family, is recorded
  on its variant rather than as a disease phenotype.

  No GeneReviews or StatPearls chapter covers Griscelli syndrome type 1 or
  MYO5A (committed Bookshelf index); the phenotype baseline comes from the
  primary reports cited.

    snippet: In both patients, plasma and urinary concentrations of uric acid were low but xanthine
      and hypoxanthine concentrations were markedly elevated.
    explanation: Documents the low plasma and urinary urate in both reported patients.
  - reference: PMID:23024809
    reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase nonsense
      mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: XDH mutations in man cause xanthinuria with undetectable plasma uric acid levels and

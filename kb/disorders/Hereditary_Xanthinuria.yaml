    label: hereditary xanthinuria
notes: 'Allopurinol is not a treatment for this disease and is not listed as one. It inhibits the
  enzyme that is already missing, and its historical use as a diagnostic loading test to separate
  type I from type II should not be confused with therapy. Urinary alkalinisation is also not listed
  as a treatment: it is standard for uric acid stones, but xanthine solubility is close to pH-independent
  and the benefit here is disputed. The 2010 case report quoted in this entry does recommend alkalinisation,
  and that recommendation is not carried into the treatments section for that reason. Type II patients
  additionally lack aldehyde oxidase, which handles several drugs, so medication review is warranted;
  the strength of evidence differs by drug and no specific avoidance list is curated here.'
review_notes: The tubular-injury limb of the final node rests mainly on the Xdh-nonsense RENF mouse
  (PMID:23024809). Both items from it are tagged MODEL_ORGANISM and the node description says the
  human histology is inferred. just discover-datasets returned no GEO candidates, which is the expected result for a disorder this rare, so the entry carries no datasets block. Theobromine metabolites
  inhibit xanthine crystallisation in synthetic urine (PMID:30157195) and were left out of treatments
  because the evidence is in-vitro only and the authors ask for trials.

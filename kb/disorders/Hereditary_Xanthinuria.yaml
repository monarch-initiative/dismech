    snippet: Less frequent manifestations are myopathy, arthropathy and duodenal ulcers.
    explanation: Names arthropathy among the infrequent manifestations of this disease.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: The sources describe the disease as rare and concentrated in the Mediterranean and Middle
    East without giving a rate, so the qualitative band is used and no numeric estimate is asserted.
    The largest published series is 20 affected individuals from 13 kindred.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classical xanthinuria is a rare autosomal recessive metabolic disorder caused by variants
      in the XDH (type I) or MOCOS (type II) genes.
    explanation: The source characterises the disease as rare without naming a measure or a rate,
      which is what the qualitative band records.
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classical xanthinuria occurs worldwide, yet more than two-thirds of cases are reported
      from the Mediterranean and Middle Eastern countries.
    explanation: Supports the worldwide population and records the geographic concentration behind
      the founder effects in the genetic section.
histopathology:
- name: End-stage pyelonephritis
  description: The renal parenchyma of a nephrectomy specimen from a child with xanthine calculi and
    a non-functioning kidney. This is the human counterpart of the tubulointerstitial injury that
    the entry otherwise carries on mouse histology, and it is the endpoint rather than the early
    lesion. No finding_term is bound, because NCIT:C34965 Pyelonephritis and HP:0012330 Pyelonephritis
    both exist but neither is reachable from the roots of the HistopathologyFindingTerm enum, which
    is restricted to morphology and cell-structure terms, so no accurate binding is available.
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nephrectomy was performed, and histology revealed end-stage pyelonephritis.
    explanation: Reports the histological finding in a resected kidney from a patient with this disease.
genetic:
- name: XDH
  gene_term:
    preferred_term: XDH
    term:
      id: hgnc:12805
      label: XDH
  subtype: Type I
  relationship_type: CAUSATIVE
  notes: Biallelic XDH variants cause type I. The reported alleles are frameshift, nonsense
    and missense, and the functional consequence has been shown directly for several of them. A
    c.2164A>T nonsense allele recurs in Arab and Turkmen families as a founder variant.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classical xanthinuria is a rare autosomal recessive metabolic disorder caused by variants
      in the XDH (type I) or MOCOS (type II) genes.
    explanation: Assigns type I to XDH.
  variants:
  - name: XDH c.449G>T p.(Cys150Phe)
    description: Missense variant in the Fe/S-I cluster-binding site. Expression studies show it impairs
      XDH biogenesis, so the protein is not built rather than built and inactive.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34356852
      reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from
        Germany: Molecular, Biochemical and Population Genetics Aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Among the 10 distinct variants identified, six were novel: c.449G>T (p.(Cys150Phe)),
        c.1434G>A (p.(Trp478*)), c.1871C>G (p.(Ser624*)) and c.913del (p.(Leu305fs*1)) in the XDH gene
        and c.1046C>T (p.(Thr349Ileu)) and c.1771C>T (p.(Pro591Ser)) in the MOCOS gene.'
      explanation: Reports the variant and its gene among those identified in the cohort.
  - name: XDH c.2473C>T p.(Arg825*)
    description: Nonsense variant in exon 23, found by homozygosity testing in one family and previously
      reported in a Czech patient, which the authors read as a possibly old allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34356852
      reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from
        Germany: Molecular, Biochemical and Population Genetics Aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: SSCP screening followed by sequencing revealed a c.2473C>T (p.(Arg825*)) variant in
        exon 23 of the XDH gene that was previously reported in a Czech patient
      explanation: Reports the allele, its exon, and its prior independent observation.
  - name: XDH c.2164A>T p.(Lys825*)
    description: Nonsense allele carried in compound heterozygosity in one family and shared as a
      founder variant across Arab and Turkmen families.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34356852
      reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from
        Germany: Molecular, Biochemical and Population Genetics Aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The index case (V-15) and her two affected sibs were compound heterozygotes for c.1871C>G
        and a c.2164A>T (p.(Lys825*)) variant
      explanation: Records the allele and the compound-heterozygous genotype it was found in.
- name: MOCOS
  gene_term:
    preferred_term: MOCOS
    term:
      id: hgnc:18234
      label: MOCOS
  subtype: Type II
  relationship_type: CAUSATIVE
  notes: Biallelic MOCOS variants cause type II. Because the sulfurase activates the molybdenum
    cofactor for both xanthine oxidoreductase and aldehyde oxidase, the loss is of two enzymes rather
    than one. c.1046C>T is a Yemenite-Jewish founder variant.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For the MOCOS c.1046C>T variant found in the Yemenite-Jewish families F1, F3 and F8,
      a founder effect was demonstrated by haplotype analyses
    explanation: Establishes MOCOS as the type II gene in these families and the founder status of
      the recurring allele.
  variants:
  - name: MOCOS c.1046C>T p.(Thr349Ileu)
    description: Missense variant in the NifS-like domain. Expression studies show it destabilises
      the protein and reduces cysteine desulfurase activity. Yemenite-Jewish founder allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34356852
      reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from
        Germany: Molecular, Biochemical and Population Genetics Aspects.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Heterologous protein expression studies revealed that the p.Cys150Phe variant within
        the Fe/S-I cluster-binding site impairs XDH biogenesis, the p.Thr349Ileu variant in the NifS-like
        domain of MOCOS affects protein stability and cysteine desulfurase activity, while the p.Pro591Ser
        and a previously described p.Arg776Cys variant in the C-terminal domain affect Molybdenum cofactor
        binding.
      explanation: Reports the functional consequence of this variant in a heterologous expression
        system.
  - name: MOCOS c.1771C>T p.(Pro591Ser)
    description: Missense variant in the C-terminal domain that impairs molybdenum cofactor binding.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34356852
      reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from
        Germany: Molecular, Biochemical and Population Genetics Aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Among the 10 distinct variants identified, six were novel: c.449G>T (p.(Cys150Phe)),
        c.1434G>A (p.(Trp478*)), c.1871C>G (p.(Ser624*)) and c.913del (p.(Leu305fs*1)) in the XDH gene
        and c.1046C>T (p.(Thr349Ileu)) and c.1771C>T (p.(Pro591Ser)) in the MOCOS gene.'
      explanation: Reports the variant and its gene among those identified in the cohort.
treatments:
- name: High Fluid Intake
  therapeutic_modality: BEHAVIORAL
  description: Dilution of the urine, and the mainstay. Since xanthine solubility hardly changes with
    pH, lowering the concentration is the intervention with a mechanism behind it.
  treatment_term:
    preferred_term: Fluid Therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Urinary Xanthine Supersaturation
    treatment_effect: INHIBITS
    description: More water in the urine lowers xanthine concentration and moves it back below saturation.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Xanthine urolithiasis is usually a benign condition, easy to prevent or cure by appropriate
        alkalinization, forced hydration and restriction of dietary purines.
      explanation: Names forced hydration among the measures that prevent or cure the stone disease.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Management includes high fluid intake and avoidance of purine and fructose-rich foods
    explanation: Names high fluid intake first among the management measures for this disease.
- name: Dietary Purine Restriction
  therapeutic_modality: BEHAVIORAL
  description: Reducing purine intake reduces the xanthine that has to be excreted.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Hypouricemia with Xanthine and Hypoxanthine Accumulation
    treatment_effect: MODULATES
    description: Less dietary purine means less substrate arriving at a blocked pathway.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Xanthine urolithiasis is usually a benign condition, easy to prevent or cure by appropriate
        alkalinization, forced hydration and restriction of dietary purines.
      explanation: Names dietary purine restriction among the measures that prevent the stone disease.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Management includes high fluid intake and avoidance of purine and fructose-rich foods
    explanation: Names avoidance of purine-rich food among the management measures for this disease.
- name: Surgical Stone Removal
  therapeutic_modality: SURGERY
  description: Operative removal of an obstructing calculus. The cited case report describes pyelolithotomy
    for a pelvic stone, and nephrectomy for the kidney already destroyed by one. NCIT has no term
    for pyelolithotomy or for nephrolithotomy, so the binding is the generic surgical action and
    the specific operation is carried in preferred_term. Modern series use ureteroscopy, laser lithotripsy
    and percutaneous nephrolithotomy; those are not curated here because no source cached for this
    entry describes them in xanthinuria.
  treatment_term:
    preferred_term: pyelolithotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Obstructive and Crystal-Induced Kidney Injury
    treatment_effect: INHIBITS
    description: Removing the calculus relieves the obstruction that drives the injury, without touching
      the metabolic block that produced it.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The first patient was an 8-year-old boy who presented with repeated episodes of hematuria
        evaluated with excretory urography, which demonstrated radio-lucent pelvic stone in the right
        kidney, causing hydronephrosis.
      explanation: Documents the obstructing stone and the hydronephrosis that the operation relieved.
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He had pyelolithotomy, and the extracted stone consisted of pure xanthine.
    explanation: Reports the operation performed and confirms the stone it removed was xanthine.
diagnosis:
- name: Plasma and Urinary Purine Profile
  description: Measurement of urate, xanthine and hypoxanthine in plasma and urine. A urate close
    to zero with raised xanthine is the pattern that makes the diagnosis, and it is usually reached
    from an incidental low urate rather than from a stone.
  diagnosis_term:
    preferred_term: purine profile in plasma and urine
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both patients, plasma and urinary concentrations of uric acid were low but xanthine
      and hypoxanthine concentrations were markedly elevated.
    explanation: States the biochemical pattern in plasma and urine on which the diagnosis rests.
- name: Molecular Confirmation of XDH or MOCOS Variants
  description: Sequencing to identify biallelic variants and to assign type I or type II, which the
    biochemical profile alone does not separate.
  diagnosis_term:
    preferred_term: molecular genetic testing of XDH and MOCOS
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Among the 10 distinct variants identified, six were novel: c.449G>T (p.(Cys150Phe)),
      c.1434G>A (p.(Trp478*)), c.1871C>G (p.(Ser624*)) and c.913del (p.(Leu305fs*1)) in the XDH gene
      and c.1046C>T (p.(Thr349Ileu)) and c.1771C>T (p.(Pro591Ser)) in the MOCOS gene.'
    explanation: Demonstrates variant identification in both genes as the route to a molecular diagnosis.
animal_models:
- name: RENF mouse (Xdh nonsense mutation)
  species: Mouse
  genotype: Xdh nonsense mutation at codon 26, homozygous (ENU-induced, designated RENF)
  publication: PMID:23024809
  description: An ENU mutagenesis screen for hereditary renal failure that recovered an Xdh nonsense
    allele. The authors present it as a model for xanthinuria in man.
  modeled_mechanisms:
  - target: Obstructive and Crystal-Induced Kidney Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the tubulointerstitial injury and the loss of renal function, and it carries
      the human biochemistry, since the mice have plasma uric acid below the limit of detection.
    limitations: The severity and timing do not match the human disease. RENF mice are in renal failure
      by four weeks with small, irregular kidneys, whereas human hereditary xanthinuria is usually
      benign and most affected people never reach renal failure at all. The cited abstract does not
      report xanthine calculi in these mice, so the stone-formation step that produces the human injury
      is not demonstrated in the model, and the mouse Xdh loss also removes renal COX-2 expression,
      which has no established counterpart in the human disease. This link is therefore evidence that
      losing XDH damages the kidney, not that it damages it by the route curated here.
    readouts:
    - name: Renal histology
      target: Obstructive and Crystal-Induced Kidney Injury
      direction: ALTERED
      interpretation: Structural correlate of the tubulointerstitial limb of this node.
      evidence:
      - reference: PMID:23024809
        reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase
          nonsense mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Histological analysis of RENF kidney sections revealed abnormal arrangement of glomeruli,
          intratubular casts, cellular infiltration in the interstitial space, and interstitial fibrosis.
        explanation: Reports the histological measurement behind this readout.
    - name: Tubular apoptosis by TUNEL
      target: Obstructive and Crystal-Induced Kidney Injury
      direction: INCREASED
      interpretation: Locates the cell death in the tubules rather than the glomeruli.
      evidence:
      - reference: PMID:23024809
        reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase
          nonsense mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: TUNEL analysis of RENF kidney sections showed extensive apoptosis predominantly affecting
          the tubules.
        explanation: Reports the apoptosis measurement and its tubular localisation.
    evidence:
    - reference: PMID:23024809
      reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase
        nonsense mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Thus, we have established a mouse model for autosomal recessive early-onset renal failure
        due to a nonsense mutation in Xdh that is a model for xanthinuria in man.
      explanation: The authors' own claim that this model is informative for human xanthinuria, which
        is what licenses linking it to this node.
    - reference: PMID:23024809
      reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase
        nonsense mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: XDH mutations in man cause xanthinuria with undetectable plasma uric acid levels and
        three RENF mice had plasma uric acid levels below the limit of detection.
      explanation: Shows the model carries the defining human biochemistry, undetectable plasma urate,
        which is part of why it is treated as informative here. This sentence previously sat on the
        Hypouricemia phenotype graded HUMAN_CLINICAL; its human clause is background the paper restates
        rather than data it reports, so it belongs on the model, not on a human phenotype.
  evidence:
  - reference: PMID:23024809
    reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase nonsense
      mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: DNA sequencing of the xanthine dehydrogenase (Xdh) gene revealed a nonsense mutation
      at codon 26 that co-segregated with affected RENF mice.
    explanation: Establishes the genotype recorded for this model.
clinical_trials:
- name: NCT06092346
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: NIH/NHGRI prospective natural-history study of pyrimidine and purine metabolism disorders.
    The registry's own condition list names XDH / Xanthinuria Type 1 among the enrolling diagnoses,
    so this is an open observational study a patient with type I could enter. It is not xanthinuria-specific
    and not interventional, and that condition list is registry metadata that does not appear in the
    cached summary quoted below.
  evidence:
  - reference: clinicaltrials:NCT06092346
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Three types of participants are needed: people aged 1 month and older with DPPMs; their
      family members who do not have DPPMs; and healthy volunteers.'
    explanation: Establishes the enrolling population as people with purine and pyrimidine metabolism
      disorders, the class this disease belongs to. A registration record, not study evidence, hence
      OTHER.

disease_term:
  preferred_term: hereditary xanthinuria
  term:
    id: MONDO:0018106
    label: hereditary xanthinuria
notes: 'Allopurinol is not a treatment for this disease and is not listed as one. It inhibits the
  enzyme that is already missing, and its historical use as a diagnostic loading test to separate
  type I from type II should not be confused with therapy. Urinary alkalinisation is also not listed
  as a treatment: it is standard for uric acid stones, but xanthine solubility is close to pH-independent
  and the benefit here is disputed. The 2010 case report quoted in this entry does recommend alkalinisation,
  and that recommendation is not carried into the treatments section for that reason. Type II patients
  additionally lack aldehyde oxidase, which handles several drugs, so medication review is warranted;
  the strength of evidence differs by drug and no specific avoidance list is curated here.'
review_notes: 'The tubular-injury limb of the final node rests mainly on the Xdh-nonsense RENF mouse
  (PMID:23024809), now curated as an animal_models entry with a modeled_mechanisms link rather than
  only as evidence. All three items from that paper are graded MODEL_ORGANISM. The third was previously
  HUMAN_CLINICAL on the Hypouricemia phenotype; its quoted sentence names a human fact and a mouse
  result in one breath, and splitting it would produce two items quoting the same sentence with different
  evidence_source values, which check-snippet-grading gates, so the item is graded by the study rather
  than split. Human histology is now carried directly (PMID:20228523 nephrectomy specimen) instead
  of being inferred from the mouse alone. Three bindings are deliberate compromises, recorded here
  so they are not silently normalised later. Crystalluria uses the generic HP:0020074 because HPO
  has crystalluria terms for orotic acid, leucine, calcium oxalate and calcium phosphate but none
  for xanthine. Renal colic uses HP:0030157 Flank pain because HPO has no renal colic term. The end-stage
  pyelonephritis histopathology finding carries no finding_term at all, because NCIT:C34965 and HP:0012330
  both exist but neither is reachable from the HistopathologyFindingTerm enum roots. Two frequency
  bands were removed rather than re-justified. Myalgia previously carried VERY_RARE anchored to the
  cohort''s 7-of-20 figure, which counts symptoms of any kind and never mentions muscle; the replacement
  quote calls myopathy a less frequent manifestation without quantifying it, which supports no band.
  Arthropathy is added on the same clause and likewise carries none. Nephrolithiasis gained FREQUENT
  from a stone-specific figure of about 40% that was already in the cached source, and its binding
  moved from HP:0000787 to the more specific HP:0000804 Xanthine nephrolithiasis. Two errors found
  while curating are worth recording. The XDH allele c.2164A>T is written by the cited paper as
  p.(Lys825*), and this entry copies that, because a snippet never corrects the source it quotes.
  It is worth knowing that the annotation looks internally inconsistent: c.2164 falls in codon 722,
  not 825, and the deep-research report calls the same allele p.Lys722Ter. The paper separately
  reports a genuine p.(Arg825*) at c.2473C>T, which is a different allele and is curated separately
  here, so the two should not be merged on the shared residue number. Nothing in this entry asserts
  which protein-level annotation is correct. Separately, the MOCOS gene_term in the new genetic
  section was first written as hgnc:29506, which is SRCIN1; MOCOS is hgnc:18234, as the
  pathophysiology node already had it. just discover-datasets returned no GEO candidates, which is the expected result
  for a disorder this rare, so the entry carries no datasets block. Theobromine metabolites inhibit
  xanthine crystallisation in synthetic urine (PMID:30157195) and were left out of treatments because
  the evidence is in-vitro only and the authors ask for trials. Ureteroscopy, laser lithotripsy and
  percutaneous nephrolithotomy are not curated as treatments because no source cached for this entry
  describes them in xanthinuria; the surgical treatment records the pyelolithotomy that a cached case
  report does describe.'

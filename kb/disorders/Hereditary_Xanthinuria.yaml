name: Hereditary Xanthinuria
creation_date: '2026-09-05T17:15:00Z'
description: 'An autosomal recessive block at the last two steps of purine degradation. Xanthine oxidoreductase
  converts hypoxanthine to xanthine and xanthine to uric acid, and when it fails the patient has almost
  no uric acid and a great deal of xanthine. The paradox is that a disease of purine excess presents
  as hypouricemia. Xanthine is the least soluble purine, so it crystallises in the urine and forms
  radiolucent stones. Two forms exist: type I from biallelic XDH variants, and type II from biallelic
  MOCOS variants, which also costs the patient aldehyde oxidase because the sulfurase that activates
  the molybdenum cofactor serves both enzymes. Roughly a third of affected people are symptomatic.
  The rest are found by an incidental urate of nearly zero.'
categories:
- Inborn Error of Purine Metabolism
- Molybdenum Cofactor-Dependent Enzyme Deficiency
- Hereditary Urolithiasis
parents:
- inborn error of purine metabolism
- autosomal recessive disease
synonyms:
- classical xanthinuria
- xanthine oxidase deficiency
- xanthine dehydrogenase deficiency
- hereditary xanthinuria type I
- hereditary xanthinuria type II
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic variants in XDH (type I) or in MOCOS (type II). Heterozygotes are unaffected.
  evidence:
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classical xanthinuria is a rare autosomal recessive metabolic disorder caused by variants
      in the XDH (type I) or MOCOS (type II) genes.
    explanation: States the inheritance pattern and both causal genes.
has_subtypes:
- name: Type I
  display_name: Type I (XDH deficiency)
  subtype_term:
    preferred_term: xanthinuria type I
    term:
      id: MONDO:0010209
      label: xanthinuria type I
  description: Isolated loss of xanthine oxidoreductase from biallelic XDH variants. Aldehyde oxidase
    is intact. OMIM 278300.
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I xanthinuria involves XOR deficiency due to genetic defect of XOR, whereas type
      II xanthinuria involves dual deficiency of XOR and aldehyde oxidase (AO, a molybdoflavo enzyme
      similar to XOR) due to genetic defect in the molybdenum cofactor sulfurase.
    explanation: Distinguishes the two types by which enzymes are lost.
- name: Type II
  display_name: Type II (MOCOS deficiency)
  subtype_term:
    preferred_term: xanthinuria type II
    term:
      id: MONDO:0011346
      label: xanthinuria type II
  description: Combined loss of xanthine oxidoreductase and aldehyde oxidase, because the molybdenum
    cofactor sulfurase that both enzymes depend on is defective. The renal disease is the same. What
    differs is drug handling, since aldehyde oxidase metabolises several xenobiotics. OMIM 603592.
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I xanthinuria involves XOR deficiency due to genetic defect of XOR, whereas type
      II xanthinuria involves dual deficiency of XOR and aldehyde oxidase (AO, a molybdoflavo enzyme
      similar to XOR) due to genetic defect in the molybdenum cofactor sulfurase.
    explanation: States the dual enzyme deficiency and its cause in this subtype.
pathophysiology:
- name: Biallelic Loss of Xanthine Oxidoreductase Function
  biological_scale: MOLECULAR
  subtypes:
  - Type I
  description: 'Frameshift, nonsense and missense variants in XDH abolish the enzyme. The functional
    work is unusually direct: p.Cys150Phe sits in the Fe/S-I cluster-binding site and stops the protein
    being built at all. The homodimer needs a molybdenum centre, an FAD and two iron-sulfur clusters,
    and a lesion in any of them ends catalysis.'
  genes:
  - preferred_term: XDH
    term:
      id: hgnc:12805
      label: XDH
  molecular_functions:
  - preferred_term: xanthine dehydrogenase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004854
      label: xanthine dehydrogenase activity
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I xanthinuria involves XOR deficiency due to genetic defect of XOR, whereas type
      II xanthinuria involves dual deficiency of XOR and aldehyde oxidase (AO, a molybdoflavo enzyme
      similar to XOR) due to genetic defect in the molybdenum cofactor sulfurase.
    explanation: Defines type I as XOR deficiency from a genetic defect in the enzyme itself.
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Heterologous protein expression studies revealed that the p.Cys150Phe variant within
      the Fe/S-I cluster-binding site impairs XDH biogenesis, the p.Thr349Ileu variant in the NifS-like
      domain of MOCOS affects protein stability and cysteine desulfurase activity, while the p.Pro591Ser
      and a previously described p.Arg776Cys variant in the C-terminal domain affect Molybdenum cofactor
      binding.
    explanation: Functional expression data for the specific variants, including the Fe/S-cluster
      variant that prevents the protein being made.
  downstream:
  - target: Failure of Hypoxanthine and Xanthine Oxidation
    causal_link_type: DIRECT
    description: No enzyme, no reaction. The block is at the catalytic step itself.
    evidence:
    - reference: PMID:23203137
      reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
        hereditary xanthinuria in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Xanthine oxidoreductase (XOR) catalyzes the conversion of hypoxanthine to xanthine
        and xanthine to uric acid with concomitant reduction of either NAD+ or O(2).
      explanation: Names the two reactions the lost enzyme catalyses, which is what the downstream
        node loses.
- name: Molybdenum Cofactor Sulfuration Failure
  biological_scale: MOLECULAR
  subtypes:
  - Type II
  description: 'MOCOS inserts the terminal sulfur into the molybdenum cofactor. Without that sulfido
    group neither xanthine oxidoreductase nor aldehyde oxidase works, so a single gene takes out two
    enzymes. Expression studies place the variants in two functional classes: p.Thr349Ile destabilises
    the protein and its cysteine desulfurase activity, while p.Pro591Ser and p.Arg776Cys spoil cofactor
    binding.'
  genes:
  - preferred_term: MOCOS
    term:
      id: hgnc:18234
      label: MOCOS
  molecular_functions:
  - preferred_term: molybdenum cofactor sulfurtransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008265
      label: molybdenum cofactor sulfurtransferase activity
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type I xanthinuria involves XOR deficiency due to genetic defect of XOR, whereas type
      II xanthinuria involves dual deficiency of XOR and aldehyde oxidase (AO, a molybdoflavo enzyme
      similar to XOR) due to genetic defect in the molybdenum cofactor sulfurase.
    explanation: States that type II is a dual deficiency caused by a defect in the sulfurase, which
      is what this node describes.
  - reference: PMID:34356852
    reference_title: 'Classical Xanthinuria in Nine Israeli Families and Two Isolated Cases from Germany:
      Molecular, Biochemical and Population Genetics Aspects.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Heterologous protein expression studies revealed that the p.Cys150Phe variant within
      the Fe/S-I cluster-binding site impairs XDH biogenesis, the p.Thr349Ileu variant in the NifS-like
      domain of MOCOS affects protein stability and cysteine desulfurase activity, while the p.Pro591Ser
      and a previously described p.Arg776Cys variant in the C-terminal domain affect Molybdenum cofactor
      binding.
    explanation: Gives the functional classes of the MOCOS variants named here.
  downstream:
  - target: Failure of Hypoxanthine and Xanthine Oxidation
    causal_link_type: DIRECT
    description: An unsulfurated cofactor leaves the oxidoreductase catalytically dead even though
      the XDH gene is intact.
    evidence:
    - reference: PMID:23203137
      reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
        hereditary xanthinuria in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Type I xanthinuria involves XOR deficiency due to genetic defect of XOR, whereas type
        II xanthinuria involves dual deficiency of XOR and aldehyde oxidase (AO, a molybdoflavo enzyme
        similar to XOR) due to genetic defect in the molybdenum cofactor sulfurase.
      explanation: States that the sulfurase defect produces the XOR deficiency, which is this edge.
- name: Failure of Hypoxanthine and Xanthine Oxidation
  biological_scale: MOLECULAR
  description: The two terminal hydroxylations of purine catabolism stop. Uric acid is no longer made,
    and xanthine and hypoxanthine accumulate. Hypoxanthine is largely salvaged back to IMP. Xanthine
    has no salvage route of consequence, so it goes to the urine.
  biological_processes:
  - preferred_term: purine nucleobase catabolic process
    modifier: DECREASED
    term:
      id: GO:0006145
      label: purine nucleobase catabolic process
  - preferred_term: urate biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0034418
      label: urate biosynthetic process
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Xanthine oxidoreductase (XOR) catalyzes the conversion of hypoxanthine to xanthine and
      xanthine to uric acid with concomitant reduction of either NAD+ or O(2).
    explanation: Names both reactions that fail at this node.
  downstream:
  - target: Hypouricemia with Xanthine and Hypoxanthine Accumulation
    causal_link_type: DIRECT
    description: The substrate accumulates and the product disappears, which is the biochemical signature
      of the disease.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In both patients, plasma and urinary concentrations of uric acid were low but xanthine
        and hypoxanthine concentrations were markedly elevated.
      explanation: 'Measures both halves of the step in two patients: urate low, xanthine and hypoxanthine
        high.'
- name: Hypouricemia with Xanthine and Hypoxanthine Accumulation
  biological_scale: ORGANISM
  description: Serum and urinary urate fall to near zero and urinary xanthine and hypoxanthine rise.
    This is the finding that makes the diagnosis, and it is also how most asymptomatic patients are
    discovered, because a urate below the limit of detection is hard to ignore on a routine panel.
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both patients, plasma and urinary concentrations of uric acid were low but xanthine
      and hypoxanthine concentrations were markedly elevated.
    explanation: Documents the biochemical pattern in patients.
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Human diseases associated with genetically determined dysfunction of XOR are termed xanthinuria,
      because of the excretion of xanthine in urine.
    explanation: States that the urinary xanthine excretion is what the disease is named for.
  downstream:
  - target: Urinary Xanthine Supersaturation
    causal_link_type: DIRECT
    description: The excreted xanthine load is what drives the urine past the solubility of xanthine.
    evidence:
    - reference: PMID:23203137
      reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
        hereditary xanthinuria in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Human diseases associated with genetically determined dysfunction of XOR are termed
        xanthinuria, because of the excretion of xanthine in urine.
      explanation: Establishes the urinary xanthine excretion that this edge carries into the urine.
- name: Urinary Xanthine Supersaturation
  biological_scale: ORGANISM
  conforms_to: nephrolithiasis_crystal_nucleation#Urinary Supersaturation
  description: Xanthine is the least soluble of the purines, and unlike uric acid its solubility barely
    moves with urine pH. That is the reason alkalinisation, which works for uric acid stones, is not
    established here. Dilution is what is left.
  evidence:
  - reference: PMID:23203137
    reference_title: Mutations associated with functional disorder of xanthine oxidoreductase and
      hereditary xanthinuria in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Human diseases associated with genetically determined dysfunction of XOR are termed xanthinuria,
      because of the excretion of xanthine in urine.
    explanation: Establishes the high urinary xanthine that produces the supersaturated state this
      node names.
  downstream:
  - target: Xanthine Crystal and Stone Formation
    causal_link_type: DIRECT
    description: Supersaturation is the thermodynamic driving force for crystallisation.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: He had pyelolithotomy, and the extracted stone consisted of pure xanthine.
      explanation: The stone recovered from a patient was pure xanthine, which is the crystallisation
        product this edge asserts the supersaturated urine yields.
- name: Xanthine Crystal and Stone Formation
  biological_scale: TISSUE
  conforms_to: nephrolithiasis_crystal_nucleation#Crystal Nucleation and Growth
  description: 'Crystalluria and radiolucent calculi of pure xanthine. Radiolucent matters clinically:
    plain films miss them, so an unexplained stone in a child with a very low urate is the pattern
    that should prompt the diagnosis.'
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The calculi consisted of pure xanthine.
    explanation: Establishes the composition of the calculi this node names, in the second reported
      patient.
  downstream:
  - target: Obstructive and Crystal-Induced Kidney Injury
    causal_link_type: DIRECT
    description: Stones obstruct, and obstruction plus crystal contact injures the tubule.
    evidence:
    - reference: PMID:20228523
      reference_title: Xanthine urolithiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: However asymptomatic, and therefore undiagnosed, stones may invade the kidney and urinary
        tract, resulting in destruction of parenchyma, nephrectomy and renal failure.
      explanation: States the progression from silent stone to parenchymal destruction, nephrectomy
        and renal failure.
- name: Obstructive and Crystal-Induced Kidney Injury
  biological_scale: ORGANISM
  conforms_to: nephrolithiasis_crystal_nucleation#Crystal-Induced Tubular Injury and Inflammation
  description: 'Hydronephrosis, hematuria, renal colic, infection, and in the worst cases a destroyed
    kidney. The mouse carrying an Xdh nonsense mutation shows what the human histology is inferred
    to be: intratubular casts, interstitial cellular infiltration, fibrosis, and tubular apoptosis.
    That model is the strongest evidence for the tubular injury limb, and it is a mouse.'
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:20228523
    reference_title: Xanthine urolithiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However asymptomatic, and therefore undiagnosed, stones may invade the kidney and urinary
      tract, resulting in destruction of parenchyma, nephrectomy and renal failure.
    explanation: The human clinical statement of this outcome.
  - reference: PMID:23024809
    reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase nonsense
      mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Histological analysis of RENF kidney sections revealed abnormal arrangement of glomeruli,
      intratubular casts, cellular infiltration in the interstitial space, and interstitial fibrosis.
    explanation: Histology of the tubular and interstitial injury in the Xdh-nonsense mouse.
  - reference: PMID:23024809
    reference_title: A mouse model of early-onset renal failure due to a xanthine dehydrogenase nonsense
      mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: TUNEL analysis of RENF kidney sections showed extensive apoptosis predominantly affecting
      the tubules.
    explanation: Locates the apoptosis in the tubules in the same mouse model. Model-organism evidence,
      and the human tubular pathology is inferred from it.

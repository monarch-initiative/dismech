clinical_trials:
- name: NCT05120830
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    First-in-human phase 1/2 study of NTLA-2002, a CRISPR/Cas9 in vivo gene
    editing therapy targeting KLKB1 - the prekallikrein gene. Mechanistically it
    is the most radical entry in this entry's therapeutic landscape: rather than
    inhibiting plasma kallikrein repeatedly, it aims to knock down its precursor
    permanently in a single dose, converting lifelong prophylaxis into a
    one-time intervention on the same pathograph node the antibody and
    small-molecule inhibitors act on.
  evidence:
  - reference: clinicaltrials:NCT05120830
    reference_title: "Phase 1/2 Study to Evaluate Safety, Tolerability, Pharmacokinetics, and Pharmacodynamics of NTLA-2002 in Adults With Hereditary Angioedema (HAE)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study will be conducted to evaluate the safety, tolerability,
      activity, pharmacokinetics, and pharmacodynamics of NTLA-2002 in adults
      with Hereditary Angioedema (HAE).
    explanation: Confirms the design and population of the first-in-human NTLA-2002 study.
  notes: >-
    Status ACTIVE_NOT_RECRUITING per the ClinicalTrials.gov record. Curated as
    investigational context, not as evidence that gene editing is an available
    treatment; no NTLA-2002 treatment entry is curated for that reason.
- name: NCT06634420
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    HAELO, the phase 3 randomized placebo-controlled trial of NTLA-2002. Its
    existence is the substantive fact - a CRISPR therapy for this disease has
    reached phase 3, which is what would move single-dose KLKB1 knockdown from
    concept to option.
  evidence:
  - reference: clinicaltrials:NCT06634420
    reference_title: "HAELO: A Phase 3, Multinational, Randomized, Double-Blind, Placebo-Controlled Study to Evaluate the Efficacy and Safety of NTLA-2002 in Participants With Hereditary Angioedema (HAE)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This Phase 3 study aims to evaluate the efficacy and safety of NTLA-2002
      compared to placebo in participants with HAE.
    explanation: Confirms the phase 3 placebo-controlled design.
- name: NCT05121376
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Phase 1/2 open-label dose-escalation study of BMN 331, an AAV5 vector
    delivering wild-type human SERPING1 under a liver-selective promoter. This
    is the mechanistic complement of the editing approach: rather than removing
    the substrate downstream, it restores the deficient inhibitor itself, acting
    on the SERPING1 deficiency node at the head of the pathograph. It is
    restricted to C1-INH deficiency, so it does not apply to the normal-C1-INH
    subtypes this entry also models.
  evidence:
  - reference: clinicaltrials:NCT05121376
    reference_title: "A Phase 1/2 Open-Label, Dose-Escalation Study to Determine the Safety Tolerability & Efficacy of BMN 331 an AAV Vector-Mediated Gene Transfer of Human SERPING1 Gene in Subjects With HAE Due to Human C1-INH Deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study drug BMN 331is identified as AAV5 hSERPING1, an adeno-associated
      virus (AAV5)-based gene therapy vector that expresses wild-type human C1
      Esterase Inhibitor (hC1-INH), under the control of a liver-selective
      promoter
    explanation: >-
      States the vector and transgene, which is what places this trial on the
      SERPING1 deficiency node rather than on the kallikrein node.
discussions:
- discussion_id: gap_hae_contact_activation_trigger
  prompt: What actually initiates contact-system activation at the start of an HAE attack, and is an activating surface required at all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The pathograph downstream of contact activation is well established, but the
    initiating event is not. C1-INH deficiency is constant while attacks are
    episodic and localized, so something must license activation at a particular
    time and site. Classical models invoke an anionic activating surface for
    factor XII autoactivation, but it is questionable whether a surface is
    responsible in HAE, and the recognized clinical triggers (trauma,
    procedures, estrogens, stress) have no established molecular mapping onto
    the cascade. This gap is why attack prediction remains impossible and why
    prophylaxis must be continuous rather than targeted.
  attaches_to:
  - pathophysiology#Unrestrained factor XII activation
  - pathophysiology#SERPING1 C1 inhibitor deficiency or dysfunction
  proposed_experiments:
  - experiment_id: hae_attack_onset_biomarker_timecourse
    name: Peri-attack contact-system biomarker time course
    description: >-
      Serially sample patients through spontaneous and procedure-provoked attacks
      and quantify cleaved high-molecular-weight kininogen, FXIIa-inhibitor and
      kallikrein-inhibitor complexes, and candidate surface activators, to
      establish which species moves first relative to symptom onset.
    decision_criterion: >-
      A reproducible ordering of biomarker changes preceding symptom onset that
      distinguishes surface-dependent from surface-independent initiation.
    would_support:
    - pathophysiology#Unrestrained factor XII activation
  evidence:
  - reference: PMID:27459852
    reference_title: "HAE Pathophysiology and Underlying Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Important areas that remain poorly understood include the factors that lead
      to very low plasma functional C1 inhibitor levels, the triggers of contact
      system activation in hereditary angioedema, and the role of the bradykinin
      B1 receptor.
    explanation: Names the triggers of contact-system activation as an explicitly unresolved area.
  - reference: PMID:29920929
    reference_title: "Hereditary angioedema: the plasma contact system out of control."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, it is questionable whether a surface is responsible for
      contact system activation in HAE.
    explanation: States the open question of whether an activating surface is required in HAE.
- discussion_id: gap_hae_bradykinin_b1_receptor_role
  prompt: Does the bradykinin B1 receptor contribute materially to HAE swelling alongside the B2 receptor?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Icatibant establishes the B2 receptor as an operative and druggable target,
    but B2 blockade does not abolish all attacks and the B1 receptor is
    inducible under inflammatory conditions and mediates vascular
    hyperpermeability in other settings. If B1 signalling contributes, it would
    predict a therapeutic ceiling for B2-selective antagonism and identify a
    complementary target. The question is currently unresolved rather than
    negative.
  attaches_to:
  - pathophysiology#Excess bradykinin signaling
  - pathophysiology#Endothelial adherens junction destabilization
  proposed_experiments:
  - experiment_id: hae_b1_receptor_endothelial_contribution
    name: B1 versus B2 receptor contribution in patient-derived endothelium
    description: >-
      Expose endothelial monolayers to patient plasma or bradykinin with
      selective B1 and B2 antagonists, alone and combined, and measure barrier
      resistance and junctional protein localization to quantify any residual
      B1-dependent permeability.
    decision_criterion: >-
      A reproducible B1-antagonist-sensitive component of permeability that
      persists under full B2 blockade.
    would_support:
    - pathophysiology#Excess bradykinin signaling
  evidence:
  - reference: PMID:27459852
    reference_title: "HAE Pathophysiology and Underlying Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Important areas that remain poorly understood include the factors that lead
      to very low plasma functional C1 inhibitor levels, the triggers of contact
      system activation in hereditary angioedema, and the role of the bradykinin
      B1 receptor.
    explanation: Explicitly names the role of the bradykinin B1 receptor as poorly understood.
- discussion_id: gap_hae_phenotypic_variability_modifiers
  prompt: Which modifiers explain the extreme variability in attack frequency, severity, and site among people carrying the same SERPING1 variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Attack burden ranges from essentially asymptomatic carriage to frequent
    life-threatening laryngeal attacks within the same family and the same
    variant, and C1-INH level does not predict it. No validated genetic,
    hormonal, or endothelial modifier explains this, which prevents
    risk-stratified prophylaxis and means treatment intensity is chosen on
    observed burden rather than predicted risk.
  attaches_to:
  - pathophysiology#Endothelial adherens junction destabilization
  - pathophysiology#Vascular permeability and recurrent edema attacks
  proposed_experiments:
  - experiment_id: hae_modifier_cohort_genotype_endothelial_phenotype
    name: Genotype-matched discordant-severity modifier study
    description: >-
      Recruit pairs of relatives sharing a SERPING1 variant but discordant for
      attack burden and compare modifier-gene genotypes, sex-hormone status, and
      endothelial barrier responsiveness to bradykinin in patient-derived cells.
    decision_criterion: >-
      A modifier that segregates with attack burden independently of the primary
      variant and reproduces in an independent cohort.
    would_support:
    - pathophysiology#Vascular permeability and recurrent edema attacks
  evidence:
  - reference: PMID:27459852
    reference_title: "HAE Pathophysiology and Underlying Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The phenotypic variability of hereditary angioedema has been extensively
      documented but never understood.
    explanation: States directly that HAE phenotypic variability remains unexplained.
- discussion_id: gap_hae_normal_c1inh_definition_and_yield
  prompt: How should normal-C1-INH HAE be defined and diagnosed when most suspected cases have no identifiable pathogenic variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Normal-C1-INH HAE has no confirmatory biochemical test, so diagnosis rests on
    clinical pattern plus a variant in one of a small gene set. Comprehensive
    sequencing resolves only a small minority of suspected cases, and broad
    testing generates variants of uncertain significance and risks
    overdiagnosis. Consequently management recommendations for this branch are
    largely expert opinion, and it is not established that every normal-C1-INH
    subtype is bradykinin-mediated at all.
  attaches_to:
  - pathophysiology#Normal C1-INH contact-system gene dysregulation
  - pathophysiology#Plasmin-mediated contact-system amplification
  proposed_experiments:
  - experiment_id: hae_nc1inh_functional_contact_assay_validation
    name: Prospective validation of a functional contact-activation assay
    description: >-
      Apply candidate functional readouts (cleaved kininogen, kallikrein
      activity, plasma-induced endothelial permeability) to prospectively
      enrolled suspected normal-C1-INH patients, gene-positive controls, and
      mimic conditions, and test whether any readout separates them
      independently of genotype.
    decision_criterion: >-
      An assay with reproducible sensitivity and specificity against an
      independently adjudicated clinical diagnosis.
    would_support:
    - pathophysiology#Normal C1-INH contact-system gene dysregulation
  evidence:
  - reference: PMID:38555427
    reference_title: "Hereditary or acquired? Comprehensive genetic testing assists in stratifying angioedema patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite extensive genetic analyses, the diagnostic yield for nC1-INH HAE
      remains low in our study, the pathogenic variant for nC1-INH HAE was
      identified in only 1 patient (n = 21).
    explanation: Quantifies the low molecular diagnostic yield that defines this gap.
  - reference: PMID:38555427
    reference_title: "Hereditary or acquired? Comprehensive genetic testing assists in stratifying angioedema patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigation into candidate genes yielded no pathogenic variants,
      prompting a re-evaluation of patients' diagnoses.
    explanation: Shows that negative testing led to diagnostic re-evaluation, supporting the overdiagnosis concern.

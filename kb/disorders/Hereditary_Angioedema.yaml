inheritance:
- name: Autosomal dominant inheritance
  description: >-
    HAE is usually autosomal dominant across SERPING1-related and normal-C1-INH
    subtypes.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

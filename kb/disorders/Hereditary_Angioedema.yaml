datasets:
- accession: ega:EGAS00001006547
  title: A catalog of the genetic causes of Hereditary Angioedema in the Canary Islands (Spain)
  description: Hereditary angioedema (HAE) is a rare disease where known causes involve C1 inhibitor dysfunction or dysregulation of the kinin cascade. The updated HAE management guidelines recommend performing genetic tests to reach a precise diagnosis. Unfortunately, genetic tests are still uncommon in the diagnosis routine. Here, we characterized for the first time the genetic causes of HAE in affected families from the Canary Islands (Spain). Whole-exome sequencing data was obtained from 41 affected patients and unaffected relatives from 29 unrelated families identified in the archipelago.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hereditary Angioedema"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

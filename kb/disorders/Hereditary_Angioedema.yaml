    systematic-review conclusion stated as approximately 1-2 individuals per
    100,000. Reported national estimates vary widely because of ascertainment
    differences and probable underdiagnosis.
  evidence:
  - reference: PMID:39827848
    reference_title: "Worldwide Prevalence of Hereditary Angioedema: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled prevalence of HAE was 1.22 cases per 100,000 people
    explanation: Meta-analysis provides the normalized worldwide pooled point-prevalence estimate.
  - reference: PMID:39827848
    reference_title: "Worldwide Prevalence of Hereditary Angioedema: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HAE is a rare condition which affects 1-2 individuals per 100,000 people worldwide."
    explanation: The systematic review conclusion supports the 1-2 per 100,000 range recorded here.

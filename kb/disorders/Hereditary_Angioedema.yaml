      reference_title: "Randomized Trial of the Efficacy and Safety of Berotralstat (BCX7353) as an Oral Prophylactic Therapy for Hereditary Angioedema: Results of APeX-2 Through 48 Weeks (Part 2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Berotralstat (BCX7353) is a recently approved, oral, once-daily kallikrein
        inhibitor for hereditary angioedema (HAE) prophylaxis.
      explanation: >-
        Names the drug's molecular target directly, which is exactly what this
        edge asserts: berotralstat acts on the plasma kallikrein node by
        inhibiting kallikrein itself.
  evidence:
  - reference: PMID:33866032
    reference_title: "Randomized Trial of the Efficacy and Safety of Berotralstat (BCX7353) as an Oral Prophylactic Therapy for Hereditary Angioedema: Results of APeX-2 Through 48 Weeks (Part 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Berotralstat (BCX7353) is a recently approved, oral, once-daily kallikrein
      inhibitor for hereditary angioedema (HAE) prophylaxis.
    explanation: APeX-2 evidence supports oral berotralstat prophylaxis.
- name: Attenuated androgen (danazol) long-term prophylaxis
  description: >-
    Danazol is the historical mainstay of long-term prophylaxis and remains in
    guideline algorithms as a second-line option where modern targeted agents are
    unavailable or unaffordable - which is most of the world. It works
    indirectly, raising hepatic C1-INH and C4 production rather than blocking the
    contact cascade, and it is the only prophylactic option in this entry that
    acts by increasing the deficient protein rather than inhibiting a downstream
    enzyme. Its displacement by kallikrein-targeted agents is driven by
    tolerability - androgenic effects, dyslipidaemia, hepatic adenoma and
    virilisation risk - rather than by lack of efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: danazol
      term:
        id: CHEBI:4315
        label: danazol
  target_mechanisms:
  - target: SERPING1 C1 inhibitor deficiency or dysfunction
    treatment_effect: MODULATES
    description: >-
      Attenuated androgens are thought to raise circulating C1-INH rather than
      inhibiting a downstream enzyme, which is why they are placed on the
      deficiency node itself. The hedge is deliberate: the prophylactic benefit
      is well attested, but the mechanism by which attenuated androgens produce
      it is not fully settled.
  evidence:
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Effective treatments included C1 inhibitor concentrate for angioedema
      attacks (6 women) and, for prophylaxis, progesterone (8 women), danazol (2
      women), and tranexamic acid (1 woman).
    explanation: >-
      Documents danazol as effective prophylaxis in hereditary angioedema.
      PARTIAL, and the limits matter: this is an FXII-HAE (normal C1-INH) cohort
      and only two women received danazol, so it is not the randomized evidence
      that underpins the modern agents in this entry.
  - reference: PMID:20818888
    reference_title: "Icatibant, a new bradykinin-receptor antagonist, in hereditary angioedema."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Attenuated androgens can reduce the number and severity of attacks when
      used prophylactically but have important adverse effects and are
      ineffective during acute attacks.
    explanation: >-
      Prophylaxis-specific support for the attenuated-androgen class, and the
      stronger of the two items attached here: it states the prophylactic
      benefit and both of the limitations that put danazol behind the targeted
      agents. Tagged OTHER because the sentence is background framing in the
      introduction to an icatibant trial report, summarizing prior evidence
      rather than reporting that trial's own data.
  notes: >-
    The two evidence items differ in what each can carry, and neither is the
    randomized trial evidence that underpins the modern targeted agents in this
    entry. PMID:20818888 is prophylaxis-specific but class-level, covering
    attenuated androgens rather than danazol by name. PMID:19477491 names danazol
    but comes from normal-C1-INH (FXII) disease, whereas danazol's proposed
    mechanism of raising hepatic C1-INH is most relevant to C1-INH deficiency.
    The edge to the deficiency node is therefore evidenced for its effect and
    hedged on its mechanism.
- name: Tranexamic acid long-term prophylaxis
  description: >-
    An antifibrinolytic used for long-term prophylaxis, chiefly where attenuated
    androgens are contraindicated - notably in children and in pregnancy. It is
    the treatment that gives the plasmin amplification arm of this pathograph its
    therapeutic rationale: by inhibiting plasmin, it blocks the plasmin-mediated
    feedback that amplifies contact-system activation, rather than acting on
    kallikrein or bradykinin directly. Efficacy is modest compared with the
    targeted agents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Plasmin-mediated contact-system amplification
    treatment_effect: INHIBITS
    description: >-
      Antifibrinolytic blockade of plasmin interrupts the plasmin-driven
      amplification loop that feeds contact-system activation - the mechanism
      this node describes and the reason tranexamic acid is used at all.
  evidence:
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Effective treatments included C1 inhibitor concentrate for angioedema
      attacks (6 women) and, for prophylaxis, progesterone (8 women), danazol (2
      women), and tranexamic acid (1 woman).
    explanation: >-
      Documents tranexamic acid as effective prophylaxis in hereditary
      angioedema. PARTIAL and thinly so: a single patient in an FXII-HAE cohort.
      It is curated because the drug closes a treatment join point on the
      plasmin node that would otherwise have no intervention attached, not
      because this observation is strong.
  notes: >-
    The attached cohort evidence is thin, but thinness is not the substantive
    limitation here — uncertainty is. PMID:20818888 records that tranexamic acid
    "reportedly improves symptoms during acute attacks, although its efficacy
    has not been proved in controlled studies". That statement is about acute
    treatment rather than the long-term prophylaxis this entry curates, so it is
    cited here as prose rather than attached as an evidence item, which would
    hang acute-attack data on a prophylaxis claim. Its mechanistic placement on
    the plasmin node is the more important claim here and follows from the drug
    class rather than from the cited cohort.
- name: Garadacimab
  description: >-
    Garadacimab (CSL312) is a fully human monoclonal antibody that inhibits
    activated factor XII (FXIIa), given once monthly by subcutaneous injection for
    long-term prophylaxis of HAE attacks. Mechanistically it is distinctive in
    acting at the apex of the contact cascade rather than at plasma kallikrein or
    the bradykinin receptor. In the pivotal VANGUARD phase 3 trial in type I and
    type II HAE it lowered the monthly attack rate significantly versus placebo,
    a mean difference of -87%.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:

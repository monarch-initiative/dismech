    reference_title: "Hereditary Angioedema: Diagnosis, Clinical Implications, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary angioedema (HAE) is an autosomal dominant disorder caused by a
      mutation in the C1 esterase inhibitor gene.
    explanation: The clinical review supports autosomal dominant inheritance for classic HAE.
prevalence:
- population: Hereditary angioedema patients, by type
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Type distribution within diagnosed HAE, curated as the subtype case-fraction
    breakdown rather than a population rate: type I about 85% of cases, type II
    about 15%, and normal-C1-INH (historically type III) about 5-10%. Those
    figures do not sum to 100 because the normal-C1-INH estimate is drawn from a
    differently ascertained denominator and is the least secure of the three -
    it depends on diagnostic access, since normal-C1-INH disease cannot be found
    by C1-INH assay and requires genetic testing that most centres do not
    perform. The overall HAE prevalence figures are recorded in the records
    below.
  evidence:
  - reference: PMID:39456231
    reference_title: "Unveiling the Complexities of Hereditary Angioedema."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type I HAE, which accounts for 85% of cases, is characterized by a
      deficiency of the C1 esterase inhibitor (C1-INH) gene. Type II HAE, making
      up 15% of cases, involves a dysfunctional C1-INH.
    explanation: >-
      Supplies the type I and type II case fractions. evidence_source is OTHER
      because this is a narrative review stating established proportions rather
      than reporting a cohort.
  - reference: PMID:39456231
    reference_title: "Unveiling the Complexities of Hereditary Angioedema."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Type III HAE, which represents about 5% to 10% of cases, is often
      estrogen-dependent and although several mutations have been identified, it
      typically involves normal C1-INH activity.
    explanation: >-
      Supplies the normal-C1-INH fraction. PARTIAL because the estimate is a
      range, is ascertainment-dependent in a way the other two are not, and uses
      the superseded "type III" label for what this entry curates as the
      normal-C1-INH subtype group.
- population: Worldwide
  measure_type: POINT_PREVALENCE

      label: fibrinolysis
  evidence:
  - reference: PMID:36609679
    reference_title: "Hereditary Angioedema: Diagnosis, Clinical Implications, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type I and II HAE result from a mutation in the SERPING1 gene, which
      encodes C1-INH.
    explanation: Review evidence supports SERPING1 as the classic HAE causal gene.
  - reference: PMID:36609679
    reference_title: "Hereditary Angioedema: Diagnosis, Clinical Implications, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1-INH is important in the coagulation complement, contact systems, and fibrinolysis."
    explanation: Review evidence supports the regulated pathways affected by C1-INH deficiency.
  downstream:
  - target: Unrestrained factor XII activation
    description: >-
      C1-INH is the principal plasma inhibitor of the contact-system enzymes, so
      its loss or dysfunction removes the brake on factor XII activation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29920929
      reference_title: "Hereditary angioedema: the plasma contact system out of control."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        C1-INH is the key plasma inhibitor of the contact system enzymes, and its
        deficiency causes hereditary angioedema (HAE).
      explanation: >-
        Identifies C1-INH as the key inhibitor of the contact-system enzymes,
        supporting a direct link from C1-INH loss to unrestrained contact
        activation.
  - target: Excess bradykinin signaling
    description: Loss or dysfunction of C1-INH permits contact-system activation and excess bradykinin signaling.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Unrestrained factor XII activation
    - Plasma kallikrein activation
    - High-molecular-weight kininogen cleavage and bradykinin liberation
    evidence:
    - reference: PMID:36609679
      reference_title: "Hereditary Angioedema: Diagnosis, Clinical Implications, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory testing shows abnormal levels of C1-INH and high levels of bradykinin."
      explanation: Clinical laboratory evidence links C1-INH abnormality with elevated bradykinin.
    - reference: PMID:30656274
      reference_title: "Hereditary angioedema: Linking complement regulation to the coagulation system."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        There is a central role for bradykinin that is released upon activation
        of the kallikrein-kinin system that is insufficiently controlled by
        adequate levels of C1 inhibitor.
      explanation: >-
        States the intermediate steps between inadequate C1-INH and bradykinin
        release that this edge summarizes.
  - target: C1-INH intracellular retention and endoplasmic reticulum stress
    description: >-
      Some SERPING1 missense variants are secretion-defective and accumulate
      intracellularly rather than simply lowering synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39272138
      reference_title: "Uncovering a novel SERPING1 pathogenic variant: insights into the aggregation of C1-INH in hereditary angioedema."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        this variant leads to an increase in the accumulation of C1-INH within
        the endoplasmic reticulum (ER), resulting in the upregulation of GRP75
        protein expression.
      explanation: >-
        Cellular study of a SERPING1 variant showing intracellular C1-INH
        accumulation, supporting a retention arm downstream of the variant.
  - target: Decreased circulating C1-esterase inhibitor concentration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36609679
      reference_title: "Hereditary Angioedema: Diagnosis, Clinical Implications, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Type I is characterized by a deficiency in C1-INH."
      explanation: Supports the direct link from SERPING1 variants to reduced circulating C1-INH in type 1 disease.
  - target: Decreased circulating complement C4 concentration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - unopposed C1 esterase activity consuming C4
    evidence:
    - reference: ORPHA:528623

environmental:
- name: Estrogen exposure
  description: >-
    Estrogen-containing oral contraceptives, pregnancy, and hormone replacement
    therapy precipitate or worsen attacks. The effect is strongest in
    F12-related normal-C1-INH disease, where symptom onset frequently coincides
    with starting an oral contraceptive, but estrogen also modulates
    C1-INH-deficiency disease. Progestin-only contraception is generally
    preferred.
  effect: Precipitates and exacerbates angioedema attacks; a major modifier of disease expression in F12-related HAE
  chemicals:
  - estrogen
  - combined oral contraceptive
  notes: >-
    This is a modifier of an inherited disease, not a cause of it. Avoidance is a
    tertiary-prevention measure rather than a treatment.
  evidence:
  - reference: PMID:33109323
    reference_title: Triggers and short-term prophylaxis in patients with hereditary angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main triggers are estrogens, Angiotensin Converting Enzyme Inhibitors
      (ACI) inhibitors, trauma, dental work, stress, surgery, manipulation of the
      upper airway, and medical procedures.
    explanation: Lists estrogens first among the main attack triggers in HAE.
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms started mainly after intake of oral contraceptives (17
      women) or pregnancy (3 women).
    explanation: >-
      In an F12-HAE cohort, disease onset was most often triggered by oral
      contraceptives or pregnancy.
  - reference: ORPHA:528647
    reference_title: "Hereditary angioedema with normal C1Inh (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Estrogen-containing oral contraceptives and pregnancy are precipitating
      factors, especially in patients with a factor XII mutation.
    explanation: Orphanet records estrogen exposure and pregnancy as precipitating factors.
- name: Angiotensin-converting enzyme inhibitor exposure
  description: >-
    ACE (kininase II) is a principal enzyme degrading bradykinin, so ACE
    inhibitors raise bradykinin availability and can precipitate or worsen
    attacks. ACE inhibitors are therefore avoided in HAE. Angiotensin receptor
    blockers have also been implicated in individual cases.
  effect: Precipitates and exacerbates attacks by reducing bradykinin catabolism; contraindicated in HAE
  chemicals:
  - angiotensin-converting enzyme inhibitor
  notes: >-
    Clinically important as a drug to avoid. Recorded here as an exogenous
    exposure; the shared bradykinin mechanism also underlies the separate entity
    of ACE-inhibitor-induced angioedema.
  evidence:
  - reference: PMID:33109323
    reference_title: Triggers and short-term prophylaxis in patients with hereditary angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main triggers are estrogens, Angiotensin Converting Enzyme Inhibitors
      (ACI) inhibitors, trauma, dental work, stress, surgery, manipulation of the
      upper airway, and medical procedures.
    explanation: Identifies ACE inhibitors among the main attack triggers.
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exacerbation of the symptoms occurred after oral contraceptive use (8
      women), pregnancy (7 women), hormone replacement therapy (3 women), intake
      of angiotensin-converting enzyme inhibitors (2 women), and an angiotensin 1
      receptor blocker (1 woman).
    explanation: >-
      Documents symptom exacerbation after ACE inhibitor and angiotensin receptor
      blocker exposure in F12-HAE patients.
- name: Mechanical trauma and medical or dental procedures
  description: >-
    Local mechanical trauma, dental work, surgery, and instrumentation of the
    upper airway are the most predictable and actionable precipitants of attacks.
    Because upper-airway manipulation can provoke potentially fatal laryngeal
    edema, procedural short-term prophylaxis with intravenous C1 inhibitor is
    standard practice.
  effect: Provokes localized attacks; airway manipulation carries risk of life-threatening laryngeal edema
  notes: >-
    The actionable consequence is short-term prophylaxis before the procedure,
    with rescue therapy and airway capability still available.
  evidence:
  - reference: PMID:33109323
    reference_title: Triggers and short-term prophylaxis in patients with hereditary angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is consensus that, whenever the upper airway is manipulated, STP is
      essential.
    explanation: >-
      Establishes upper-airway manipulation as a procedural trigger requiring
      short-term prophylaxis.
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some factors that triggered angioedema attacks were trauma, physical
      pressure, and emotional stress.
    explanation: Documents trauma and physical pressure as attack triggers.
- name: Emotional stress
  description: >-
    Psychological and emotional stress is a commonly reported attack precipitant.
    It is not reliably avoidable, so it informs counselling and treatment
    readiness rather than restriction of normal activity.
  effect: Precipitates attacks in a subset of patients
  evidence:
  - reference: PMID:33109323
    reference_title: Triggers and short-term prophylaxis in patients with hereditary angioedema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main triggers are estrogens, Angiotensin Converting Enzyme Inhibitors
      (ACI) inhibitors, trauma, dental work, stress, surgery, manipulation of the
      upper airway, and medical procedures.
    explanation: Lists stress among the main attack triggers.
  - reference: PMID:19477491
    reference_title: "Hereditary angioedema caused by missense mutations in the factor XII gene: clinical features, trigger factors, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some factors that triggered angioedema attacks were trauma, physical
      pressure, and emotional stress.
    explanation: Documents emotional stress as an attack trigger.

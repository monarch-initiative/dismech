- name: Plasma kallikrein activation
  biological_scale: MOLECULAR
  description: >-
    Active plasma kallikrein is the central effector protease of the HAE cascade.
    It cleaves high-molecular-weight kininogen to liberate bradykinin and also
    reciprocally activates more factor XII, creating a self-amplifying loop that
    explains the explosive, self-sustaining character of attacks. Plasma
    kallikrein is the most heavily drugged node in HAE: ecallantide, lanadelumab,
    berotralstat, and sebetralstat inhibit the active enzyme, while donidalorsen
    lowers the prekallikrein zymogen pool.

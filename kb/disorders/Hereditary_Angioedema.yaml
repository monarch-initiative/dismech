name: Hereditary Angioedema
creation_date: "2026-05-09T10:09:02Z"
category: Mendelian
description: >-
  Hereditary angioedema is an autosomal dominant bradykinin-mediated angioedema
  spectrum with recurrent non-urticarial subcutaneous, gastrointestinal, and
  upper-airway edema attacks. Classic type 1 and type 2 disease result from
  quantitative or qualitative C1 inhibitor defects caused by SERPING1 variants;
  normal-C1-INH forms are genetically heterogeneous and include F12-, PLG-,
  KNG1-, ANGPT1-, HS3ST6-, and MYOF-associated disease.
disease_term:
  preferred_term: hereditary angioedema
  term:
    id: MONDO:0019623
    label: hereditary angioedema
synonyms:
- HAE
- hereditary angioneurotic edema
- familial angioneurotic edema
- hereditary bradykinin-induced angioedema
parents:
- Angioedema
- Hereditary Skin Disorder
notes: >-
  MONDO maps the broad disease concept to Orphanet ORPHA:91378, but ORPHA:91378
  is an Orphanet clinical-group record and is not emitted by the current
  structured Orphanet cache builder, which caches leaf disorders and subtypes.
  This entry therefore cites the generated Orphanet caches for the two principal
  disease records, ORPHA:528623 and ORPHA:528647, plus the generated subtype
  records. ORPHA:528647 currently emits obsolete MONDO:0033947 as its
  cross-reference; this entry uses the active replacement MONDO:0100567 for the
  normal-C1-INH subtype.

  No GeneReviews chapter exists for hereditary angioedema (searched by disease
  name, by SERPING1, and by "C1 inhibitor deficiency"; all returned no
  GeneReviews record), so the usual GeneReviews phenotype baseline is
  unavailable. The WAO/EAACI international guideline (PMID:35006617) and the
  normal-C1-INH international consensus paper (PMID:40053270) serve as the
  expert-consensus substitutes.

  The pathograph deliberately models the contact (kallikrein-kinin) cascade as
  discrete nodes -- factor XII activation, plasma kallikrein activation,
  high-molecular-weight kininogen cleavage, bradykinin B2 receptor signalling,
  and endothelial adherens junction destabilization -- rather than collapsing
  them into a single "excess bradykinin" step, so that each approved drug class
  attaches to the node it actually acts on (garadacimab at FXIIa; ecallantide,
  lanadelumab, berotralstat, sebetralstat, and donidalorsen at plasma
  kallikrein; icatibant at the B2 receptor) and so that the normal-C1-INH
  subtype genes can enter the graph at their distinct points.

  No `conforms_to` link to the `antisense_oligonucleotide_therapy` module is
  asserted. That module names KLKB1/donidalorsen as an instance of its
  "Pathogenic mRNA Accumulation" node, but prekallikrein transcript abundance is
  not itself abnormal in HAE -- it is a normal protein exploited as a drug
  target -- so a conformance claim would misstate the disease mechanism. The ASO
  paradigm is captured instead by `aso_details` on the donidalorsen treatment.

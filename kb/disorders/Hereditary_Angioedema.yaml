    treatment_effect: INHIBITS
    description: >-
      Garadacimab binds and inhibits activated factor XII, blocking the apex
      protease of the contact system and preventing downstream kallikrein
      activation and bradykinin generation.
    evidence:
    - reference: PMID:36868261
      reference_title: "Efficacy and safety of garadacimab, a factor XIIa inhibitor for hereditary angioedema prevention (VANGUARD): a global, multicentre, randomised, double-blind, placebo-controlled, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Garadacimab (CSL312), a novel, fully-human monoclonal antibody that
        inhibits activated factor XII (FXIIa), is being studied for the prevention
        of hereditary angioedema attacks.
      explanation: States that garadacimab inhibits activated factor XII, the mechanism of this treatment edge.
  evidence:
  - reference: PMID:36868261
    reference_title: "Efficacy and safety of garadacimab, a factor XIIa inhibitor for hereditary angioedema prevention (VANGUARD): a global, multicentre, randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT

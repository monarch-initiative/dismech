name: GUCA1A-Related Retinopathy
creation_date: "2026-08-25T10:00:00Z"
category: Mendelian
description: >-
  GUCA1A-related retinopathy is an autosomal dominant inherited retinal disease
  caused by heterozygous missense variants in GUCA1A, encoding guanylate
  cyclase-activating protein 1 (GCAP1), the principal calcium sensor that
  regulates retinal guanylate cyclase (RetGC1/RetGC2) activity during
  phototransduction recovery. Under normal dark-adapted conditions, high
  intracellular Ca2+ loads the EF-hand domains of GCAP1, switching it into a
  conformation that inhibits RetGC; as light exposure lowers Ca2+, GCAP1
  switches to an activating conformation that accelerates cGMP resynthesis.
  Pathogenic GUCA1A variants cluster in the EF-hand calcium-binding loops and
  lock GCAP1 into a constitutively activating conformation regardless of
  ambient Ca2+, producing chronically elevated cGMP, sustained opening of
  cyclic nucleotide-gated (CNG) channels, and toxic Ca2+ accumulation in
  photoreceptor outer segments. The founding and most recurrent variant is
  p.Tyr99Cys (Y99C), first described in 1998; the disease is genetically and
  clinically continuous with a spectrum from isolated cone dystrophy (COD3)
  to cone-rod dystrophy (CORD14), with cone photoreceptors affected earliest
  and most severely because GCAP1/RetGC-mediated recovery kinetics are more
  critical to cone light-response timing than to rods.
disease_term:
  preferred_term: GUCA1A-related retinopathy
  term:
    id: MONDO:0700376
    label: GUCA1A-related retinopathy
synonyms:
- Cone dystrophy 3
- COD3
- Cone-rod dystrophy 14
- CORD14
- GUCA1A-related cone dystrophy
- GUCA1A-related cone-rod dystrophy
- GCAP1-related retinopathy
parents:
- Inherited Retinal Dystrophy
- Cone-Rod Dystrophy
mappings:
  mondo_mappings:

      Cone-rod dystrophy 14 (CORD14) is the child term for GUCA1A-related
      presentations with secondary rod involvement.
notes: >-
  Modeled as a single umbrella entity rather than forced has_subtypes: the
  largest reported cohort (Allon et al. 2025, PMID:39969478, 19 patients/14
  families) found the same variant class producing both cone-restricted and
  cone-rod/macular phenotypes, and genotype-phenotype correlation is by
  individual variant (e.g. p.Glu111Ala versus p.Leu84Phe) rather than by a
  clean COD-versus-CORD split. MONDO:0011193 (COD3) and MONDO:0800326 (CORD14)
  are the two child terms under MONDO:0700376 and are captured via
  mondo_mappings narrowMatch. GUCA1A is also one of several genes (with
  PRPH2, GUCY2D, CDHR1, ABCA4, TTLL5) that can produce a central areolar
  choroidal dystrophy (CACD)-spectrum maculopathy at the severe end of its
  phenotypic range; that distinct, etiologically heterogeneous clinical entity
  is separately curated at kb/disorders/Central_Areolar_Choroidal_Dystrophy.yaml
  and is not duplicated here.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous gain-of-function missense variants in GUCA1A cause autosomal
    dominant GUCA1A-related retinopathy. Each child of an affected parent has
    a 50% chance of inheriting the pathogenic variant.
  evidence:
  - reference: PMID:9425234
    reference_title: "A mutation in guanylate cyclase activator 1A (GUCA1A) in an autosomal dominant cone dystrophy pedigree mapping to a new locus on chromosome 6p21.1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a mutation (Y99C) in guanylate cyclase activator 1A (GUCA1A), the gene for guanylate cyclase activating protein (GCAP1), in a family with autosomal dominant cone dystrophy."
    explanation: >-
      Payne et al. establish the founding GUCA1A Y99C mutation as the cause of
      autosomal dominant cone dystrophy in the original discovery pedigree.

prevalence:
- population: United States
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.4
  notes: >-
    Derived from a US series of 1000 consecutive inherited retinal disease
    cases carrying 7 GUCA1A cases, from which the authors extrapolated a
    US-wide prevalence of 1 in 247,143. That is 0.4 per 100,000, or about 4
    per million, which is the BAND_1_9_PER_1000000 class. The estimate is an
    extrapolation from a single referral cohort, not a population survey.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A US-based study of 1000 consecutive IRD cases found 7 cases with GUCA1A variants; the authors estimated a US-wide prevalence of 1 in 247,143 people."
    explanation: >-
      States both the observed case count and the extrapolated population
      prevalence figure this record converts.
- population: Inherited retinal disease clinic cohorts (US, UK, Spain, Germany, Japan, China)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Across six published IRD cohorts, GUCA1A accounted for roughly 0.1% to
    0.7% of patients or families. The denominator here is an inherited
    retinal disease clinic population, not a general population, so no
    magnitude band applies and the record is deliberately left unbanded. The
    authors note the spread also reflects differing genetic testing
    strategies and whether the denominator counts all IRD patients or only
    those with a positive molecular diagnosis.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the prevalence in IRD cohorts appears to range from roughly 0.1% to 0.7%."
    explanation: >-
      Gives the cross-cohort range of the GUCA1A share of inherited retinal
      disease diagnoses.

pathophysiology:
- name: GCAP1 Loss of Calcium-Dependent Inhibitory Control
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Dominant missense variants in GUCA1A cluster in the EF-hand calcium-binding
    loops of GCAP1 (e.g. EF3 for the founding p.Tyr99Cys variant, EF4 for
    p.Asp144Gly), impairing the protein's ability to sense rising dark-adapted
    Ca2+ and switch into its RetGC-inhibiting conformation. The founding
    p.Tyr99Cys variant does not decrease GCAP1's ability to activate RetGC, but
    the resulting RetGC-GCAP1 complex remains active even at Ca2+
    concentrations above 1 microM, well into the physiological dark-adapted
    range, rather than being suppressed as normal GCAP1 would suppress it.
    Other variants (p.Asn104His, p.Leu176Phe, p.Asp144Gly) act through related
    biophysical mechanisms: impaired Ca2+ sensitivity, altered Mg2+/Ca2+
    exchange kinetics, or increased binding affinity for RetGC, all converging
    on loss of the normal Ca2+-dependent brake on cyclase activation.
  gene:
    preferred_term: GUCA1A
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:4678
      label: GUCA1A
  genetic_context:
    gene:
      preferred_term: GUCA1A
      term:
        id: hgnc:4678
        label: GUCA1A
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Monoallelic missense variants that leave GCAP1's capacity to activate
      RetGC intact and remove its Ca2+-dependent off-switch, so the variant
      acts by adding constitutive activation rather than by abolishing
      function.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: detection of calcium ion
    modifier: DECREASED
    term:
      id: GO:0005513
      label: detection of calcium ion
  evidence:
  - reference: PMID:9651312
    reference_title: "Constitutive activation of photoreceptor guanylate cyclase by Y99C mutant of GCAP-1. Possible role in causing human autosomal dominant cone degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Y99C mutation does not decrease the ability of GCAP-1 to activate RetGC. However, RetGC stimulated by the Y99C GCAP-1 remains active even at Ca2+ concentration above 1 microM. Hence, the cyclase becomes constitutively active within the whole physiologically relevant range of free Ca2+ concentrations."
    explanation: >-
      Dizhoor et al. biochemically demonstrate that the Y99C GCAP1 mutant fails
      to lose its RetGC-activating conformation at high (dark-adapted) Ca2+,
      the direct molecular basis of loss of calcium-dependent inhibitory
      control.
  - reference: PMID:28025326
    reference_title: "Dysfunction of cGMP signalling in photoreceptors by a macular dystrophy-related mutation in the calcium sensor GCAP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant was less sensitive to changes in free Ca2+, resulting in a constitutively active form under physiological Ca2+-concentration, showed significantly higher activation rates than the wildtype (90-fold versus 20-fold) and interacted with an higher apparent affinity with its target guanylate cyclase."
    explanation: >-
      Vocke et al. show the L176F GCAP1 variant is biochemically less
      Ca2+-sensitive and binds RetGC with higher affinity, reproducing the
      same loss-of-calcium-control mechanism in a second, independently
      identified variant.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These result in persistent stimulation of RetGC, excess cGMP levels in the dark and photoreceptor apoptosis secondary to Ca2+ dysregulation."
    explanation: >-
      Gill et al. summarize the shared consequence of the GUCA1A
      gain-of-function alleles, tying the EF-hand lesion to persistent RetGC
      stimulation. Classified OTHER because this is a narrative review
      synthesizing published cohorts rather than reporting primary
      observations.
  downstream:
  - target: RetGC Constitutive Hyperactivity
    description: >-
      A GCAP1 that can no longer be switched off by rising dark-adapted Ca2+
      continues to drive RetGC catalytic activity regardless of the
      photoreceptor's light-adaptation state.

- name: RetGC Constitutive Hyperactivity
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: MOLECULAR
  description: >-
    Constitutively activating mutant GCAP1 continues to stimulate retinal
    guanylate cyclase (RetGC1 and, for some variants, also RetGC2) even at
    Ca2+ concentrations characteristic of the dark-adapted state, when wild-type
    GCAP1 would normally suppress the enzyme. This produces chronically
    elevated cGMP synthesis that is no longer coupled to the light-dependent
    Ca2+ signal, independent of the ambient light state.
  gene:
    preferred_term: GUCA1A
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:4678
      label: GUCA1A
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: cGMP biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006182
      label: cGMP biosynthetic process
  evidence:
  - reference: PMID:34639157
    reference_title: "A Novel GUCA1A Variant Associated with Cone Dystrophy Alters cGMP Signaling in Photoreceptors by Strongly Interacting with and Hyperactivating Retinal Guanylate Cyclase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The altered interaction with GC would cause hyper-activity of the enzyme at both low and high Ca2+ levels, which would ultimately lead to toxic accumulation of cGMP and Ca2+ in the photoreceptor outer segment, thus triggering cell death."
    explanation: >-
      Biasi et al. directly link the N104H GCAP1 variant's hyperactivation of
      guanylate cyclase to downstream toxic cGMP/Ca2+ accumulation, connecting
      the enzymatic hyperactivity node to the downstream calcium overload node.
  - reference: PMID:15240799
    reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Y99C GCAP1 shifted the Ca2+ sensitivity of the guanylyl cyclase in photoreceptors, keeping it partially active at 250 nM free Ca2+, the normal resting Ca2+ concentration in darkness."
    explanation: >-
      Olshevskaya et al. show in vivo that the Y99C transgene leaves the
      cyclase active at the resting dark Ca2+ concentration, confirming in a
      whole retina the set-point failure demonstrated biochemically.
  downstream:
  - target: Sustained CNG Channel Opening and Outer-Segment Calcium Overload
    description: >-
      Chronically elevated cGMP keeps cyclic nucleotide-gated (CNG) channels
      open independent of the light state, producing sustained Ca2+/Na+
      influx into the photoreceptor outer segment.
  - target: Impaired Cone Light-Response Generation and Delayed Recovery
    description: >-
      A cyclase that is no longer gated by the light-driven fall in Ca2+
      cannot shape the cone photoresponse, degrading the amplitude and the
      timing of the cone-driven light response.
  - target: Abnormal Photoreceptor-to-ON-Bipolar Synaptic Transmission
    description: >-
      In a minority of patients the dysregulated GCAP1-cyclase complex
      propagates past the outer segment to the photoreceptor synaptic
      terminal.

- name: Sustained CNG Channel Opening and Outer-Segment Calcium Overload
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  biological_scale: CELLULAR
  description: >-
    Chronically elevated cGMP holds cyclic nucleotide-gated channels open
    independent of the light state, so Ca2+ and Na+ enter the outer segment
    continuously and free Ca2+ rises above its normal dark level. This is the
    branch point at which a phototransduction set-point lesion becomes a
    degenerative rather than a stationary disease.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: calcium ion transmembrane import into cytosol
    modifier: INCREASED
    term:
      id: GO:0097553
      label: calcium ion transmembrane import into cytosol
  evidence:
  - reference: PMID:15240799
    reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The enhanced activity of the cyclase in the dark increased cyclic nucleotide-gated channel activity and elevated the rod outer segment Ca2+ concentration in darkness"
    explanation: >-
      Olshevskaya et al. measured the outer-segment Ca2+ rise directly in the
      Y99C transgenic retina, establishing that the channel opening and the
      calcium overload are real consequences of the cyclase lesion and not
      only an inference from biochemistry.
  - reference: PMID:34639157
    reference_title: "A Novel GUCA1A Variant Associated with Cone Dystrophy Alters cGMP Signaling in Photoreceptors by Strongly Interacting with and Hyperactivating Retinal Guanylate Cyclase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The altered interaction with GC would cause hyper-activity of the enzyme at both low and high Ca2+ levels, which would ultimately lead to toxic accumulation of cGMP and Ca2+ in the photoreceptor outer segment, thus triggering cell death."
    explanation: >-
      Biasi et al. name toxic cGMP and Ca2+ accumulation in the outer segment
      as the step between cyclase hyperactivity and photoreceptor death.
  downstream:
  - target: Cone Photoreceptor Degeneration
    description: >-
      Sustained calcium and cGMP elevation in the outer segment triggers
      photoreceptor cell death.
  - target: Variable Rod Photoreceptor Involvement
    description: >-
      GCAP1 is expressed in rods as well as cones, so the same set-point
      lesion can reach the rod population, later and in a minority of
      patients.
  notes: >-
    The module node this conforms to instructs a conforming disorder to
    declare conformance to photoreceptor_degeneration as well. That module is
    not wired here on purpose: its chain is rod-first and cell-autonomous in
    rods, with cone loss modeled as a non-cell-autonomous consequence of rod
    elimination. GUCA1A disease runs the other way, with cones affected
    earliest and most severely because GCAP1 expression is higher in cones,
    so a conformance claim against those rod-first nodes would assert a
    sequence this disease does not follow.

- name: Impaired Cone Light-Response Generation and Delayed Recovery
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  biological_scale: CELLULAR
  description: >-
    Loss of the Ca2+-gated cyclase brake degrades the cone light response
    itself, separately from the degenerative arm. Cone-driven full-field ERG
    amplitudes are reduced in most affected patients, and in the most severely
    affected the 30-Hz flicker response is also delayed, which is the timing
    signature of a recovery defect rather than a pure amplitude loss.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: regulation of opsin-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0022400
      label: regulation of opsin-mediated signaling pathway
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 13 subjects had subnormal LA 30-Hz or LA 3 (single-flash) ERGs"
    explanation: >-
      Allon et al. quantify reduced cone-driven light-adapted ERG responses in
      the majority of tested patients, the functional readout of failed cone
      light-response generation.
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there was an additional LA 30-Hz ERG delay in the 5 with the smallest LA responses"
    explanation: >-
      The flicker peak-time delay in the most severely affected patients is
      the timing abnormality that distinguishes a recovery defect from a
      simple loss of responding cones.
  downstream:
  - target: Abnormal electroretinogram
    description: >-
      Reduced and delayed cone-driven responses are what the clinical
      full-field and pattern ERG records.
  notes: >-
    Scoped to cones on purpose. The Y99C transgenic mouse showed little change
    in the rod photoresponse despite a measurable rise in dark outer-segment
    Ca2+ (PMID:15240799), so a general claim of failed photoreceptor
    light-response generation across both photoreceptor classes is not
    supported. Human rod-driven dark-adapted ERGs were normal in all but one
    tested patient in the Allon cohort, and that exception was attributed to
    incomplete mydriasis.

- name: Abnormal Photoreceptor-to-ON-Bipolar Synaptic Transmission
  biological_scale: CELLULAR
  description: >-
    In some patients the dysregulated GCAP1-cyclase complex disturbs signaling
    at the photoreceptor synaptic terminal rather than only in the outer
    segment, producing an attenuated b-wave and an electronegative ERG
    waveform that indicate an ON-pathway transmission defect.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: synaptic transmission, glutamatergic
    modifier: DECREASED
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
  evidence:
  - reference: PMID:33919796
    reference_title: "Impaired Ca(2+) Sensitivity of a Novel GCAP1 Variant Causes Cone Dystrophy and Leads to Abnormal Synaptic Transmission Between Photoreceptors and Bipolar Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the abnormal electroretinogram recorded in this patient also suggested that the dysregulation of the GCAP1-cyclase complex further propagates to the synaptic terminal, thereby altering the ON-pathway related to the b-wave generation"
    explanation: >-
      Marino et al. report ERG evidence in a patient carrying a double GCAP1
      substitution (N104K/G105R) that dysregulated GCAP1-RetGC signaling also
      disturbs synaptic transmission to ON-bipolar cells.
  - reference: PMID:33919796
    reference_title: "Impaired Ca(2+) Sensitivity of a Novel GCAP1 Variant Causes Cone Dystrophy and Leads to Abnormal Synaptic Transmission Between Photoreceptors and Bipolar Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe alterations of the electroretinogram were observed under both scotopic and photopic conditions, with a negative pattern and abnormally attenuated b-wave component."
    explanation: >-
      The negative ERG waveform with attenuated b-wave is the specific
      electrophysiological signature of inner-retinal transmission failure
      rather than outer-segment loss alone.
  downstream:
  - target: Abnormal electroretinogram
    description: >-
      The ON-pathway transmission defect appears clinically as a negative ERG
      waveform with an attenuated b-wave.
  notes: >-
    Kept as its own node rather than folded into the degeneration chain
    because the evidence for it is a single reported patient with a double
    p.Asn104Lys/p.Gly105Arg substitution, and a negative or electronegative
    waveform was seen in only a minority of the Allon cohort. It is a
    variant-associated branch of the disease, not a step every patient passes
    through.

- name: Cone Photoreceptor Degeneration
  biological_scale: CELLULAR
  description: >-
    Persistent calcium and cGMP elevation triggers photoreceptor cell death.
    Cones bear the earliest and most severe toxicity because GCAP1 expression
    is higher in cones and cone recovery kinetics depend on it more heavily,
    with later, more variable rod and macular RPE involvement depending on the
    specific variant.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  evidence:
  - reference: PMID:15240799
    reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the photoreceptors in these mice degenerated, and the rate of the cell loss increased with the level of the transgene expression, unlike in transgenic mice that overexpressed normal GCAP1."
    explanation: >-
      Dose-dependent photoreceptor loss with the mutant but not the wild-type
      transgene establishes that degeneration follows from the variant rather
      than from GCAP1 overexpression as such.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The relative preservation of rod responses in most GUCA1A-associated progressive retinal dystrophies is attributed to greater GCAP1 expression in cones."
    explanation: >-
      Gill et al. give the reason cones are affected first, which is the
      claim this node makes about the cell-type selectivity of the
      degeneration. Classified OTHER because this is a narrative review.
  downstream:
  - target: Progressive visual loss
    description: >-
      Loss of central cones is what patients experience as progressive decline
      in central visual acuity.
  - target: Color vision defect
    description: >-
      Cone loss removes the substrate for color discrimination, which is why
      dyschromatopsia is the commonest presenting symptom.
  - target: Macular atrophy
    description: >-
      Degeneration of the central cone population appears structurally as
      ellipsoid-zone disruption and then macular atrophy on OCT.
  - target: Photophobia
    description: >-
      A degenerating and dysfunctional cone population underlies the light
      sensitivity reported by most affected patients.
  - target: Central scotoma
    description: >-
      Loss of the central cone population produces the central and
      paracentral field defects found on perimetry.
  - target: Reduced visual acuity
    description: >-
      Loss of the central cone population is what the measured logMAR acuity
      records at any one visit.

- name: Variable Rod Photoreceptor Involvement
  biological_scale: CELLULAR
  description: >-
    GCAP1 is expressed in rods as well as cones, so the rod population is not
    immune to the same cGMP and calcium set-point lesion. Rod involvement is
    the exception rather than the rule: dark-adapted rod-specific ERGs were
    normal in almost every tested patient, and peripheral pigmentary change
    appeared in 2 of 19. Where it occurs it marks the cone-rod end of the
    phenotypic range, not a conversion to a rod-first disease.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the latter patient, the nature and progression of symptoms were still more in keeping with a cone-rod, rather than a rod-cone, dystrophy, and other family members did not show the pigmentary changes."
    explanation: >-
      Even in the patient with peripheral pigmentary change, the course stayed
      cone-rod. This is the evidence for scoping this node as variable
      involvement rather than as a rod-degeneration arm.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The relative preservation of rod responses in most GUCA1A-associated progressive retinal dystrophies is attributed to greater GCAP1 expression in cones."
    explanation: >-
      Gives the reason rods are relatively spared, which is the same claim
      this node makes from the other side: rods carry the lesion but at lower
      GCAP1 dose. Classified OTHER because this is a narrative review.
  downstream:
  - target: Peripheral pigmentary retinopathy
    description: >-
      Rod and outer-retinal involvement at the periphery appears on
      ultra-widefield imaging as pigment spicules.
  - target: Nyctalopia
    description: >-
      Rod dysfunction, where it occurs, is what a patient reports as night
      blindness.

phenotypes:
- category: Ophthalmological
  name: Progressive visual loss
  frequency: VERY_FREQUENT
  description: >-
    Progressive decline in central visual acuity is the dominant presenting
    and progressive feature of GUCA1A-related retinopathy, correlating with
    patient age across longitudinal follow-up. Central vision deficits were
    reported by 17 of 19 patients (89.5%) in the largest cohort.
  phenotype_term:
    preferred_term: Progressive visual loss
    term:
      id: HP:0000529
      label: Progressive visual loss
    clinical_course: PROGRESSIVE
    onset:
      onset_category: YOUNG_ADULT
      mean_age_years: 23.0
      min_age_years: 5.0
      max_age_years: 74.0
      notes: >-
        Mean age at symptom onset 23 years (SD 17), range 5 to 74, across the
        19-patient Allon cohort. The category is set on the mean; the range
        spans childhood to old age, and this wide spread is itself a
        characteristic of the disease rather than a measurement artifact.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most had progressive visual loss and electrophysiologic evidence of cone dystrophy."
    explanation: >-
      Allon et al. report progressive visual loss as the predominant clinical
      course in the largest reported GUCA1A cohort (19 patients, 14 families).
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) age of onset of symptoms was 23 (17) years (range, 5–74 years)."
    explanation: >-
      Source for the onset descriptor: mean age of symptom onset and its full
      reported range in the same cohort.

- category: Ophthalmological
  name: Reduced visual acuity
  frequency: VERY_FREQUENT
  description: >-
    Visual acuity at presentation is variable but declines with age and can
    range from near-normal to no light perception in advanced disease;
    logMAR acuity correlates with patient age across longitudinal follow-up.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  phenotype_contexts:
  - sex: MALE
    notes: >-
      In a mixed-effects model across 144 visits, male sex was associated with
      worse visual acuity independent of age. The cohort was 68.4% male and
      the authors treat the association as provisional.
    evidence:
    - reference: PMID:39969478
      reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "male sex was associated with worse acuity (P = 0.023)"
      explanation: >-
        Reports sex as a modifier of acuity severity within the GUCA1A cohort.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acuities ranged from 0.00 logMAR to no light perception."
    explanation: >-
      Allon et al. document the full range of visual acuity severity observed
      across the GUCA1A cohort, from near-normal to no light perception.

- category: Ophthalmological
  name: Color vision defect
  frequency: VERY_FREQUENT
  description: >-
    Dyschromatopsia is the characteristic early feature of GUCA1A-related
    retinopathy, reflecting the cone-predominant nature of the underlying
    photoreceptor dysfunction. It affected 16 of 19 patients (84.2%) over
    follow-up and was the presenting complaint in 13 (68.4%).
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, across the entire duration of follow-up, 17 patients (89.5%) reported central vision deficits, 16 patients (84.2%) described color vision deficits, 15 (78.9%) reported some degree of photophobia"
    explanation: >-
      84.2% of the cohort described color vision deficits, which places the
      frequency in the VERY_FREQUENT band (80-99%).
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen patients (68.4%) described poor color discrimination as their initial symptom"
    explanation: >-
      Color vision impairment is also the commonest presenting symptom, which
      is why it is treated as the early feature of the disease.

- category: Ophthalmological
  name: Photophobia
  frequency: FREQUENT
  description: >-
    Light sensitivity is a typical symptom of GUCA1A-related cone and cone-rod
    dystrophy, reported by 15 of 19 patients (78.9%) in the largest cohort.
  phenotype_term:
    preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, across the entire duration of follow-up, 17 patients (89.5%) reported central vision deficits, 16 patients (84.2%) described color vision deficits, 15 (78.9%) reported some degree of photophobia"
    explanation: >-
      78.9% of the GUCA1A cohort reported photophobia, which sets the
      FREQUENT band (30-79%) just below the VERY_FREQUENT threshold.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These disorders typically present with progressive loss of central vision, colour vision disturbance and photophobia."
    explanation: >-
      Supporting class-level characterization of photophobia as a typical
      presenting feature of progressive cone and cone-rod dystrophies, of
      which GUCA1A is one of the four commonest causes. Classified OTHER
      because this is a narrative review, and it is a second item behind the
      GUCA1A-specific figure rather than the source of the frequency band.

- category: Electrophysiological
  name: Abnormal electroretinogram
  frequency: VERY_FREQUENT
  description: >-
    Electrophysiology in GUCA1A-related retinopathy is consistent with cone
    dystrophy in most patients, with a subset showing a macular dystrophy
    pattern; occasional patients show additional abnormalities in the
    ON-pathway b-wave component suggesting a synaptic transmission component.
  phenotype_term:
    preferred_term: Abnormal electroretinogram
    term:
      id: HP:0000512
      label: Abnormal electroretinogram
  reports_on:
  - target: RetGC Constitutive Hyperactivity
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Full-field and pattern ERG capture the functional consequence of
      dysregulated cGMP/Ca2+ signaling in cone (and later rod) photoreceptors.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiology (n = 13) was consistent with cone dystrophy (n = 11) or macular dystrophy (n = 2)."
    explanation: >-
      Allon et al. report electrophysiological findings consistent with cone
      dystrophy in the large majority of tested patients in the GUCA1A cohort.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ERG studies characteristically show reduced cone single-flash and flicker amplitudes with a normal implicit time"
    explanation: >-
      Describes the characteristic GUCA1A ERG signature. Classified OTHER
      because this is a narrative review. Note that the Allon cohort did find
      a flicker peak-time delay in its five most severely affected patients,
      so the normal implicit time described here holds for milder disease and
      is not universal.

- category: Ophthalmological
  name: Macular atrophy
  frequency: VERY_FREQUENT
  description: >-
    Maculopathy was present on OCT in every patient in the largest cohort.
    Imaging shows progressive irregularity of the central ellipsoid zone,
    then partial disruption, then complete loss of the layer, which is the
    structural correlate of central cone photoreceptor degeneration.
  phenotype_term:
    preferred_term: Macular atrophy
    term:
      id: HP:0007401
      label: Macular atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maculopathy was evident in all individuals on OCT imaging."
    explanation: >-
      Structural macular involvement was universal (19/19) on OCT, which sets
      the VERY_FREQUENT band. The macular-dystrophy ERG pattern seen in 2 of
      13 tested patients is a separate, rarer electrophysiological finding
      and is recorded on the electroretinogram phenotype, not here.
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optical coherence tomography showed irregularity and then loss of the central ellipsoid zone."
    explanation: >-
      Documents the progressive structural sequence on OCT underlying the
      atrophy.

- category: Ophthalmological
  name: Central scotoma
  frequency: OCCASIONAL
  description: >-
    Perimetry, performed in a minority of patients, showed central and
    paracentral field defects matching the central cone loss seen on imaging.
  phenotype_term:
    preferred_term: Central scotoma
    term:
      id: HP:0000603
      label: Central scotoma
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual field tests, where performed (four patients), demonstrated central and paracentral scotomas."
    explanation: >-
      Central and paracentral scotomas were found in all four patients who
      underwent perimetry. The frequency band is set on the 4 of 19 who were
      tested rather than on the 4 of 4 who were positive, because the cohort
      denominator is what the band describes and the untested patients are
      unknown rather than negative.

- category: Ophthalmological
  name: Peripheral pigmentary retinopathy
  frequency: OCCASIONAL
  description: >-
    Peripheral pigment spicules were seen in 2 of 19 patients, one carrying
    p.Tyr99Cys and one p.Glu111Ala. Even in those patients the symptom course
    remained cone-rod rather than rod-cone, so the finding marks the severe
    end of the GUCA1A range and not a separate retinitis pigmentosa phenotype.
  phenotype_term:
    preferred_term: Spicular pigmentation of the retina
    term:
      id: HP:0007737
      label: Spicular pigmentation of the retina
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral involvement with pigment spicules was noted in two individuals"
    explanation: >-
      2 of 19 patients (10.5%) had peripheral pigmentary change, which places
      the frequency in the OCCASIONAL band (5-29%).

- category: Ophthalmological
  name: Nyctalopia
  frequency: OCCASIONAL
  description: >-
    Night blindness is uncommon in GUCA1A-related retinopathy and was reported
    by a single patient in the largest cohort, consistent with the relative
    preservation of rod function in this disease.
  phenotype_term:
    preferred_term: Nyctalopia
    term:
      id: HP:0000662
      label: Nyctalopia
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1 patient (IX-l) noted nyctalopia (5.3%)"
    explanation: >-
      One of 19 patients (5.3%) reported nyctalopia, which falls in the
      OCCASIONAL band (5-29%) at its lower edge. The band rests on a single
      patient in a 19-patient series and should be revisited against a larger
      cohort.

genetic:
- name: GUCA1A pathogenic variants
  gene_term:
    preferred_term: GUCA1A
    term:
      id: hgnc:4678
      label: GUCA1A
  association: Causative
  features: >-
    Heterozygous missense variants in GUCA1A, encoding guanylate cyclase
    activating protein 1 (GCAP1), cause autosomal dominant GUCA1A-related
    retinopathy. The founding and most recurrent variant is p.Tyr99Cys
    (Y99C), found in 10 of 14 families in the largest reported cohort; other
    reported pathogenic variants include p.Leu84Phe, p.Ile107Thr,
    p.Glu111Ala, p.Leu176Phe, p.Asp144Gly, and p.Asn104His, most clustering
    in or near the EF-hand calcium-binding loops of GCAP1. Emerging
    genotype-phenotype correlations include p.Glu111Ala associated with
    worse visual acuity than the common p.Tyr99Cys variant, p.Leu84Phe
    associated with younger age and earlier-onset visual loss, and
    p.Ile107Thr associated with later presentation and milder acuity
    reduction.
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:9425234
      reference_title: "A mutation in guanylate cyclase activator 1A (GUCA1A) in an autosomal dominant cone dystrophy pedigree mapping to a new locus on chromosome 6p21.1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a mutation (Y99C) in guanylate cyclase activator 1A (GUCA1A), the gene for guanylate cyclase activating protein (GCAP1), in a family with autosomal dominant cone dystrophy."
      explanation: >-
        The founding GUCA1A discovery pedigree establishes autosomal dominant
        inheritance of GUCA1A-related cone dystrophy.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen patients (14 families), with five different variants, were included: p.(Tyr99Cys) in 10 families and p.(Leu84Phe), p.(Ile107Thr), p.(Glu111Ala), and p.(leu176Phe) in 1 family each."
    explanation: >-
      Allon et al. document the variant spectrum and relative frequency of
      p.Tyr99Cys versus other GUCA1A variants in the largest reported cohort.
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with the common p.(Tyr99Cys) variant, patients with p.(Glu111Ala) (n = 2) had worse vision; those with p.(Leu84Phe) (n = 3) were younger with earlier-onset visual loss. Patients with p.(Ile107Thr) (n = 2) showed later presentation, with milder acuity reduction."
    explanation: >-
      Allon et al. report preliminary genotype-phenotype correlations among
      the reported GUCA1A variants.
  - reference: PMID:15953638
    reference_title: "Mutation in the gene GUCA1A, encoding guanylate cyclase-activating protein 1, causes cone, cone-rod, and macular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of this mutation also causing both cone-rod dystrophy and isolated macular dysfunction."
    explanation: >-
      Michaelides et al. found the single p.Tyr99Cys allele producing cone
      dystrophy, cone-rod dystrophy, and isolated macular dysfunction within
      one family. This is the direct evidence for modeling the disease as one
      umbrella entity rather than partitioning it into COD and CORD subtypes.
  - reference: PMID:15953638
    reference_title: "Mutation in the gene GUCA1A, encoding guanylate cyclase-activating protein 1, causes cone, cone-rod, and macular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic variation described here exemplifies the intrafamilial heterogeneity of retinal dysfunction that can be observed in persons harboring the same mutation and chromosomal segment."
    explanation: >-
      States that the variability is intrafamilial, so it cannot be explained
      by genetic background differences between families and is not a
      genotype-driven split.

progression:
- phase: Symptomatic onset
  age_range: Second to third decade, with a reported range from age 5 to 74
  notes: >-
    Onset is typically in the second or third decade, most often as impaired
    color discrimination or loss of central vision. The mean age at symptom
    onset across the largest cohort was 23 years, but the range was wide and
    a minority present in childhood or after the sixth decade.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) age of onset of symptoms was 23 (17) years (range, 5–74 years)."
    explanation: >-
      Gives the mean and range of symptom onset in the 19-patient cohort.
  - reference: PMID:30679166
    reference_title: "Progressive cone and cone-rod dystrophies: clinical features, molecular genetics and prospects for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptomatic onset usually occurs between the second and third decade with reduced central vision, photophobia and generalised dyschromatopsia."
    explanation: >-
      Independent characterization of the typical decade of onset and its
      presenting symptoms. Classified OTHER because this is a narrative
      review.
- phase: Gradual acuity decline
  age_range: Across adult follow-up
  notes: >-
    Visual acuity worsens with age at roughly 0.20 logMAR per decade, fitted
    across 144 patient visits in a mixed-effects model. The decline is
    gradual and highly symmetric between eyes, and vision may remain
    relatively preserved beyond the seventh decade in some patients.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it corresponded roughly to a worsening of approximately 0.20 logMAR per decade"
    explanation: >-
      Quantifies the rate of visual acuity decline in the largest cohort.
- phase: Structural macular progression
  age_range: Tracks acuity rather than age alone
  notes: >-
    OCT changes begin as mild ellipsoid-zone irregularity, advance to partial
    disruption of the layer as acuity falls toward 0.3 logMAR, and reach more
    complete loss of the photoreceptor layer years later once acuity falls
    below 0.7 logMAR, with outer nuclear layer and RPE involvement following.
    The staging tracks visual acuity more closely than chronological age: the
    cohort mean age was similar at the partial-disruption and complete-loss
    stages, and the reported age ranges for the two overlap.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the mild EZ irregularity typically observed in the early stages of the disease, partial EZ disruption was also observed as the disease progressed and visual acuity levels reached approximately 0.3 logMAR. More complete loss of the photoreceptor layer was subsequently noted years later when visual acuity fell below 0.7 logMAR."
    explanation: >-
      Ties the two structural stages to the acuity levels at which they
      appear, which is how the cohort stages structural progression.
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The changes observed on OCT scans begin with mild EZ irregularity, progressing to atrophy affecting outer retinal layers, including the outer nuclear layer, and RPE irregularity."
    explanation: >-
      States the sequence of retinal layers involved as the maculopathy
      advances.

diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted Sanger sequencing, gene-panel sequencing, or exome/genome
    sequencing establishes the diagnosis. Variants are classified by ACMG
    criteria and annotated against the MANE select GUCA1A transcript
    NM_001384910.1. Molecular confirmation matters because the clinical
    picture overlaps other dominant cone and cone-rod dystrophies, and
    because a peripheral pigmentary phenotype should prompt consideration of
    alternative genetic causes.
  results: >-
    Confirms a heterozygous pathogenic or likely pathogenic GUCA1A missense
    variant, most often p.Tyr99Cys, and enables cascade testing of relatives.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variant classification ascribing likely pathogenicity was performed in accordance with American College of Medical Genetics and Genomics (ACMG) guidelines."
    explanation: >-
      Documents the variant-classification standard applied in the reference
      cohort.
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants were annotated in relation to the most biologically relevant MANE select GUCA1A transcript NM_001384910.1."
    explanation: >-
      Names the reference transcript against which GUCA1A variants should be
      reported.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: Optical Coherence Tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    Spectral-domain OCT, fundus autofluorescence, and ultra-widefield
    pseudocolor fundus photography together stage the maculopathy. Fundus
    autofluorescence is the most sensitive of the three for early macular
    involvement, and ultra-widefield imaging is what detects the uncommon
    peripheral pigmentary change.
  results: >-
    OCT shows ellipsoid-zone irregularity progressing to partial then
    complete loss, with an optical gap between the neurosensory retina and
    the RPE at early stages; autofluorescence shows macular involvement that
    may precede any visible fundus change.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fundus autofluorescence demonstrated high sensitivity in detecting maculopathy and in some cases was able to identify macular involvement before findings were apparent on clinical examination or color or pseudocolor fundus images, although the OCT was usually abnormal."
    explanation: >-
      Establishes the relative sensitivity of autofluorescence and OCT for
      early macular involvement in this disease.
- name: Visual electrophysiology
  diagnosis_term:
    preferred_term: Retinal Examination
    term:
      id: NCIT:C101217
      label: Retinal Examination
  description: >-
    ISCEV-standard full-field and pattern electroretinography separate
    generalized cone-system dysfunction from macular-only disease and
    quantify severity. Pattern ERG P50 measures macular function; full-field
    light-adapted responses measure generalized cone function; dark-adapted
    responses test the rod system, which is usually spared.
  results: >-
    Most patients show a cone dystrophy pattern with reduced light-adapted
    responses; a minority show a macular dystrophy pattern with normal
    full-field ERGs. A negative waveform with attenuated b-wave points to the
    ON-pathway transmission variant of the disease.
  evidence:
  - reference: PMID:39969478
    reference_title: "Clinical, Genetic, Imaging and Electrophysiological Findings in a Cohort of Patients With GUCA1A-Associated Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ERG findings were consistent with cone dystrophy in 11 subjects and with macular dystrophy in 2 cases"
    explanation: >-
      Shows how the ERG separates the generalized cone-dystrophy pattern from
      the macular-restricted pattern in this cohort.

animal_models:
- name: Y99C GCAP1 transgenic mouse
  species: Mouse
  genotype: Transgenic expression of GCAP1 carrying the Tyr99Cys substitution
  publication: PMID:15240799
  description: >-
    Transgenic mice expressing the human disease allele Y99C GCAP1, generated
    in several lines with differing transgene expression levels. The model
    reproduces the molecular lesion, the dark-state calcium elevation, and
    dose-dependent photoreceptor degeneration.
  evidence:
  - reference: PMID:15240799
    reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we created transgenic mice that express GCAP1 with a Tyr99Cys substitution (Y99C GCAP1) found in human patients with a late-onset retinal dystrophy"
    explanation: >-
      Establishes that this model expresses the human founding disease allele,
      which is what makes it informative for this disease.
  modeled_mechanisms:
  - target: Sustained CNG Channel Opening and Outer-Segment Calcium Overload
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Direct in vivo measurement of elevated outer-segment free Ca2+ in
      darkness, with increased CNG channel activity, in an animal carrying the
      human founding variant.
    limitations: >-
      Measurements were made in rod outer segments, whereas human disease is
      cone-predominant, and the transgene is overexpressed rather than
      expressed from the endogenous locus. Severity tracks transgene dose, so
      the rate of degeneration in any one line is not a model of the human
      rate.
    readouts:
    - name: Rod outer segment free calcium concentration in darkness
      target: Sustained CNG Channel Opening and Outer-Segment Calcium Overload
      description: >-
        Free Ca2+ in dark-adapted rod outer segments, measured with fluo-5F
        and laser spot microscopy.
      direction: INCREASED
      interpretation: >-
        Confirms that the cyclase lesion raises outer-segment calcium in the
        intact retina, the step this node asserts.
      evidence:
      - reference: PMID:15240799
        reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The enhanced activity of the cyclase in the dark increased cyclic nucleotide-gated channel activity and elevated the rod outer segment Ca2+ concentration in darkness"
        explanation: >-
          Reports the calcium measurement behind this readout.
    evidence:
    - reference: PMID:15240799
      reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we created transgenic mice that express GCAP1 with a Tyr99Cys substitution (Y99C GCAP1) found in human patients with a late-onset retinal dystrophy"
      explanation: >-
        Establishes that the model carries the human founding disease allele,
        which is what makes it informative for this node.
  - target: Cone Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Photoreceptors degenerate in these mice at a rate scaling with transgene
      expression, and do not degenerate in mice overexpressing wild-type
      GCAP1, isolating the variant as the cause.
    limitations: >-
      The mouse retina is rod-dominant, so the reported degeneration is
      predominantly of rods, whereas human GUCA1A disease is cone-first and
      cone-predominant. The model therefore supports the causal step from
      calcium overload to photoreceptor death without reproducing the
      cell-type selectivity that defines the human phenotype.
    readouts:
    - name: Photoreceptor cell loss
      target: Cone Photoreceptor Degeneration
      description: >-
        Retinal photoreceptor counts across transgenic lines of differing
        expression level, compared with wild-type GCAP1 overexpressors.
      direction: INCREASED
      interpretation: >-
        Dose-dependent loss with the mutant transgene only, which separates
        the effect of the variant from the effect of overexpression.
      evidence:
      - reference: PMID:15240799
        reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, the photoreceptors in these mice degenerated, and the rate of the cell loss increased with the level of the transgene expression, unlike in transgenic mice that overexpressed normal GCAP1."
        explanation: >-
          Reports the cell-loss measurement and the wild-type control behind
          this readout.
    evidence:
    - reference: PMID:15240799
      reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results provide the first direct evidence that a mutation linked to congenital blindness increases Ca2+ in the outer segment, which may trigger the apoptotic process."
      explanation: >-
        States the authors' own claim that the model links the calcium rise to
        photoreceptor death, which is the claim this link makes.
  - target: Impaired Cone Light-Response Generation and Delayed Recovery
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Despite a measurable rise in dark outer-segment Ca2+, the rod
      photoresponse in these mice was largely unchanged, so the model does not
      reproduce the light-response failure seen on human cone-driven ERG.
    limitations: >-
      The negative result is a rod measurement in a rod-dominant retina, and
      cone light responses were not the readout, so it is evidence that the
      rod arm is spared rather than evidence against the human cone finding.
      This is why the corresponding human node is scoped to cones.
    readouts:
    - name: Rod photoresponse amplitude and kinetics
      target: Impaired Cone Light-Response Generation and Delayed Recovery
      description: >-
        Single-cell rod photoresponses recorded from Y99C transgenic retinas.
      direction: UNCHANGED
      interpretation: >-
        Dynamic Ca2+-dependent regulation of cGMP synthesis was preserved in
        rods despite the raised dark calcium.
      evidence:
      - reference: PMID:15240799
        reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Surprisingly, there was little change in the rod photoresponse, indicating that dynamic Ca2+-dependent regulation of cGMP synthesis was preserved."
        explanation: >-
          Reports the negative photoresponse result behind this readout.
    evidence:
    - reference: PMID:15240799
      reference_title: "The Y99C mutation in guanylyl cyclase-activating protein 1 increases intracellular Ca2+ and causes photoreceptor degeneration in transgenic mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, there was little change in the rod photoresponse, indicating that dynamic Ca2+-dependent regulation of cGMP synthesis was preserved."
      explanation: >-
        The authors report the preserved rod photoresponse as a surprising
        negative finding, which is the substance of this failure-to-recapitulate
        claim.
- name: GCAP1 RNAi knockdown rescue models
  species: Mouse
  genotype: Transgenic bovine GCAP1(Y99C) and mouse GCAP1(L151F), treated with scAAV2/8 shRNA against GCAP1
  publication: PMID:24778606
  description: >-
    Two dominant GCAP1 retinal degeneration mouse lines used as a therapeutic
    test bed: an allele-specific Y99C line with a rapid phenotype and a
    non-allele-specific L151F line with a slow cone-rod dystrophy that the
    authors present as the closer match to human GCAP1 disease. Subretinal
    scAAV2/8 delivering GCAP1 shRNA was used to knock the transgene down.
  evidence:
  - reference: PMID:24778606
    reference_title: "RNA interference gene therapy in dominant retinitis pigmentosa and cone-rod dystrophy mouse models caused by GCAP1 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The late onset GCAP1(L151F)-CORD mimics the dystrophy observed in human GCAP1-CORD patients."
    explanation: >-
      The authors state which of the two lines they regard as matching human
      GCAP1 cone-rod dystrophy, which is the basis for treating these models
      as informative for this disease.
  modeled_mechanisms:
  - target: Cone Photoreceptor Degeneration
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Knocking down mutant GCAP1 enhanced photoreceptor survival, delayed
      degeneration onset, and improved visual function in both lines, which is
      the interventional counterpart of the claim that GCAP1 gain of function
      drives the degeneration.
    limitations: >-
      Both lines are transgenic overexpressors rather than knock-ins, one
      expresses a bovine transgene, and the rescue is preclinical with no
      human trial. Photoreceptor survival in a rod-dominant mouse retina is
      not a direct measure of the cone survival that matters clinically.
    readouts:
    - name: Photoreceptor survival after GCAP1 knockdown
      target: Cone Photoreceptor Degeneration
      description: >-
        Photoreceptor survival, degeneration onset, and visual function after
        subretinal scAAV2/8 shRNA delivery, compared with untreated eyes.
      direction: RESTORED
      interpretation: >-
        Removing the mutant gene product slows the degeneration, supporting
        the causal direction of this node.
      evidence:
      - reference: PMID:24778606
        reference_title: "RNA interference gene therapy in dominant retinitis pigmentosa and cone-rod dystrophy mouse models caused by GCAP1 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "RNAi-mediated gene silencing enhanced photoreceptor survival, delayed onset of degeneration and improved visual function"
        explanation: >-
          Reports the survival and function measurements behind this readout.
    evidence:
    - reference: PMID:24778606
      reference_title: "RNA interference gene therapy in dominant retinitis pigmentosa and cone-rod dystrophy mouse models caused by GCAP1 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The allele-specific model expresses transgenic bovine GCAP1(Y99C) establishing a rapid RP-like phenotype, whereas the nonallele-specific model expresses mouse GCAP1(L151F) producing a slowly progressing cone-rod dystrophy (CORD)."
      explanation: >-
        Describes what the two models are and which one the authors regard as
        matching the human cone-rod dystrophy, which is what makes them
        informative for this node.

- name: GUCA1A p.Arg120Leu zebrafish overexpression model
  species: Zebrafish
  genotype: Transient overexpression of human GUCA1A mRNA carrying p.Arg120Leu
  publication: PMID:28125083
  description: >-
    Zebrafish embryos injected with mutant human GUCA1A mRNA, with wild-type
    mRNA injected alone and co-injected as controls. Used to separate a toxic
    gain-of-function mechanism from a dominant-negative one.
  evidence:
  - reference: PMID:28125083
    reference_title: "GUCA1A mutation causes maculopathy in a five-generation family with a wide spectrum of severity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To test the hypothesis that p.R120L causes disease through a gain-of-function mechanism, we overexpressed WT (hereafter termed GUCA1AWT) or mutated human GUCA1A mRNA (GUCA1Ap.R120L) in zebrafish to characterize their relevant pathology."
    explanation: >-
      States the design of the model and the question it was built to answer.
  modeled_mechanisms:
  - target: Cone Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Mutant-injected larvae lost cone inner-segment and outer-segment
      staining and cone cell-body signal, and co-injected wild-type mRNA did
      not rescue the loss, which is the behavior expected of a toxic
      gain-of-function allele rather than a haploinsufficiency.
    limitations: >-
      This is transient mRNA overexpression in a larval fish, not expression
      of a heterozygous allele from the endogenous locus, so the dosage is not
      physiological and the timescale is developmental rather than the adult
      degeneration seen in patients. Rod markers were lost as well as cone
      markers, which does not match the cone-predominant human phenotype.
      p.Arg120Leu is not among the alleles in the largest human cohort.
    readouts:
    - name: Cone inner segment and outer segment staining
      target: Cone Photoreceptor Degeneration
      description: >-
        Peanut agglutinin lectin staining of cone inner and outer segments in
        retinal sections at 4 days postfertilization.
      direction: DECREASED
      interpretation: >-
        Loss of cone segment structure in mutant-injected larvae.
      evidence:
      - reference: PMID:28125083
        reference_title: "GUCA1A mutation causes maculopathy in a five-generation family with a wide spectrum of severity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the cone inner segment/OS, indicated by peanut agglutinin lectin staining, were significantly reduced or even vanished in larvae injected with GUCA1Ap.R120L"
        explanation: >-
          Reports the cone staining measurement behind this readout.
    evidence:
    - reference: PMID:28125083
      reference_title: "GUCA1A mutation causes maculopathy in a five-generation family with a wide spectrum of severity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, our findings revealed that photoreceptors are impaired by GUCA1A p.R120L in a toxic gain-of-function way."
      explanation: >-
        The authors' own conclusion that the allele acts by toxic gain of
        function, which is what makes this model informative for a
        gain-of-function degeneration node.
  notes: >-
    The same study reached the opposite conclusion for a different allele: in
    the identical assay p.Asp100Glu was rescued by co-injected wild-type
    mRNA, which the authors read as dominant-negative rather than toxic gain
    of function. Not every pathogenic GUCA1A allele is assumed here to act by
    the constitutive-activation mechanism the pathograph models, and
    p.Asp100Glu is deliberately not listed among the variants in the genetic
    section.

treatments:
- name: Supportive care and low vision rehabilitation
  therapeutic_modality: OTHER
  description: >-
    No approved disease-modifying treatment exists for GUCA1A-related
    retinopathy. Standard of care encompasses low vision aids, tinted
    lenses or filters for photophobia, orientation and mobility support as
    needed, and regular monitoring of visual function and retinal structure
    to track progression.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling clarifies the 50% recurrence risk to offspring of an
    affected individual under autosomal dominant inheritance, supports
    cascade testing of at-risk relatives, and informs family planning and
    eligibility for future clinical trials as they become available.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling


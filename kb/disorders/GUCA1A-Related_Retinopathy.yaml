      id: MONDO:0011193
      label: cone dystrophy 3
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Cone dystrophy 3 (COD3) is the historical cone-restricted presentation of
      GUCA1A-related retinopathy and a child term of MONDO:0700376.
  - term:
      id: MONDO:0800326
      label: cone-rod dystrophy 14
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO

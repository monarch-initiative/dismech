  - preferred_term: SIN3A
    term:
      id: hgnc:19353
      label: SIN3A
  description: >-
    Intragenic SIN3A variants, mostly truncating (nonsense, frameshift and
    splice) and predicted to cause loss of function, with a few missense
    variants in the PAH1 domain and one in-frame multi-exon duplication. This
    is the majority form; in the largest cohort 24 of 28 variants were
    truncating.
  evidence:
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 27 novel variants and one previously reported variant. 24 were truncating variants; three were missense variants and one large in-frame gain including exons 10-12."
    explanation: Variant spectrum of the intragenic form in a 28-patient cohort.
- name: SIN3A-spanning deletion
  display_name: SIN3A-related intellectual disability syndrome due to a 15q24 deletion including SIN3A
  genes:
  - preferred_term: SIN3A
    term:
      id: hgnc:19353
      label: SIN3A
  description: >-
    Heterozygous 15q24.1-q24.2 microdeletions that remove the whole SIN3A gene,
    reported as Witteveen-Kolk syndrome when the deletion is small (a 550 kb
    deletion in one man with Kallmann syndrome; a 1.6 Mb deletion in a child
    with the classic phenotype). MONDO has no term for this form below
    MONDO:0044699. Larger recurrent LCR-mediated 15q24 deletions with a more
    severe contiguous-gene phenotype are curated in
    Chromosome_15q24_Deletion_Syndrome; the size boundary between the two
    concepts is not sharp and some reports call large deletions WITKOS.
  evidence:
  - reference: PMID:27399968
    reference_title: "Haploinsufficiency of MeCP2-interacting transcriptional co-repressor SIN3A causes mild intellectual disability by affecting the development of cortical integrity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This phenotype is highly related to that of individuals with atypical 15q24 microdeletions, linking SIN3A to this microdeletion syndrome."
    explanation: The founding report linked the SIN3A point-mutation phenotype to atypical 15q24 deletions.
  - reference: PMID:36758531
    reference_title: "SIN3A Defects Associated with Syndromic Congenital Hypogonadotropic Hypogonadism: An Overlap with Witteveen-Kolk Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 550 kb deletion at 15q24.1, including the whole SIN3A gene, was identified in S1"
    explanation: A small deletion removing SIN3A in a patient with a Witteveen-Kolk overlap phenotype.
  - reference: PMID:38841330
    reference_title: "A Witteveen-Kolk Syndrome Patient with Reflux Disease and a de novo Deletion of the SIN3A Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affymetrix CytoScan 750K microarray showed a de novo 1.6-Mb deletion at 15q24.1q24.2, including the whole SIN3A gene."
    explanation: A de novo SIN3A-spanning deletion in a child with classic WITKOS features.
  - reference: PMID:32783353
    reference_title: "Behavior and cognitive functioning in Witteveen-Kolk syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "and six with chromosomal microdeletions encompassing SIN3A"
    explanation: By 2020, six of 16 reported WITKOS patients carried microdeletions encompassing SIN3A.

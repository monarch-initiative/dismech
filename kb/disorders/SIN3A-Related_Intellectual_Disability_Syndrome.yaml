  - target: Hypogonadotropic hypogonadism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed to SIN3A rather than to neighbouring 15q24 genes because
      intragenic SIN3A variants cause it; the effect on the GnRH axis is not
      characterised.
  - target: Broad forehead
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

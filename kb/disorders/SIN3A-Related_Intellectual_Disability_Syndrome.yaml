name: SIN3A-Related Intellectual Disability Syndrome
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  SIN3A-related intellectual disability syndrome (Witteveen-Kolk syndrome) is an
  autosomal dominant neurodevelopmental disorder caused by heterozygous
  loss-of-function of SIN3A, the scaffold subunit of the SIN3-HDAC
  transcriptional corepressor complex. Most cases carry de novo truncating
  intragenic variants; missense variants in the PAH1 partner-binding domain and
  small 15q24 deletions that remove SIN3A also occur. Affected individuals
  usually have global developmental delay with mild intellectual disability or
  low-normal intelligence, speech and motor delay, a recognisable facial
  gestalt (broad tall forehead, downslanting palpebral fissures, small mouth,
  thin upper lip, pointed chin), microcephaly, short stature, feeding
  difficulties and hypotonia, with autism, attention deficit and psychiatric
  problems in a minority. Seizures, palatal defects, hearing loss, subtle brain
  anomalies (ventriculomegaly, corpus callosum hypoplasia) and syndromic
  hypogonadotropic hypogonadism are reported. A predominantly hypomethylated
  DNA methylation episignature in blood supports the diagnosis.
synonyms:
- Witteveen-Kolk syndrome
- WITKOS
- SIN3A-related disorder
notes: >-
  MONDO records no synonyms on MONDO:0044699 (an Orphanet-derived concept,
  ORPHA:500163). The names Witteveen-Kolk syndrome and WITKOS are carried here
  because the clinical literature cited below uses them for SIN3A
  haploinsufficiency (PMID:33437032, PMID:36399132, PMID:32783353). In MONDO
  those two strings and the OMIM:613406 cross-reference sit instead on
  MONDO:0013256 chromosome 15q24 deletion syndrome, which is not classified
  under MONDO:0044699; dismech curates that contiguous-gene deletion
  separately (Chromosome_15q24_Deletion_Syndrome), where SIN3A is one
  candidate gene among several. This entry covers SIN3A haploinsufficiency
  from intragenic variants and from deletions reported as SIN3A-spanning
  Witteveen-Kolk syndrome. No GeneReviews chapter names this disorder or SIN3A
  (PubMed search genereviews[book] for "Witteveen-Kolk"[TI] and SIN3A[TIAB]
  returned no chapter).

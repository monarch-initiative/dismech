diagnosis:
- name: Exome or genome sequencing
  description: >-
    The facial gestalt is recognisable mainly in retrospect, so most diagnoses
    are made by exome or genome sequencing or intellectual disability gene
    panels; chromosomal microarray detects SIN3A-spanning deletions.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it is likely that diagnostic evaluation and identification of SIN3A variants in suspected individuals will be performed using large ID panels or WES/WGS."
    explanation: Authors' expectation of the diagnostic route.
- name: DNA methylation episignature analysis
  description: >-
    A SIN3A-specific blood episignature can classify variants of uncertain
    significance and resolve unexplained cases.
  diagnosis_term:
    preferred_term: genome-wide DNA methylation analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:36399132
    reference_title: "DNA methylation episignature for Witteveen-Kolk syndrome due to SIN3A haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This episignature has the potential to aid identification and diagnosis of individuals with WITKOS."
    explanation: Diagnostic utility of the episignature.
treatments:
- name: Multidisciplinary developmental and supportive care
  description: >-
    No disease-specific therapy exists. Management is supportive, with
    developmental, neurological and paediatric follow-up, and brain imaging
    offered when neurological symptoms are present rather than routinely.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Involvement of a multidisciplinary team including a geneticist, paediatrician and neurologist should be considered in managing these patients."
    explanation: Author recommendation from a case series, not a guideline.
- name: Neuropsychologically informed psychological treatment
  description: >-
    A single case report describes twelve sessions of psychological treatment
    tailored to the patient's neurocognitive profile (aimed at reducing
    cognitive overload, anxiety and fatigue), with improved functioning at
    three months but poor maintenance of emotion-regulation gains.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychotherapy
    term:
      id: NCIT:C15308
      label: Psychotherapy
  target_mechanisms:
  - target: Psychiatric and behavioural problems
  evidence:
  - reference: PMID:41245232
    reference_title: "Personalized Treatment in Rare Genetic Syndromes: A Case-Report in Witteveen-Kolk Syndrome (SIN3A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation during treatment and at 3-month follow-up showed a positive increase in functioning and acceptance as well as the acceptance of successive follow-up treatment."
    explanation: Single-patient outcome of tailored psychological treatment.
- name: Sex hormone replacement for hypogonadotropic hypogonadism

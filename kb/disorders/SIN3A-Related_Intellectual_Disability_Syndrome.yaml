    snippet: "Patients with disease causing variants in SIN3A usually have mild global developmental delay/ID, with some even having tested IQs in the normal range with variable penetrance."
    explanation: Variable expressivity and penetrance.
pathophysiology:
- name: SIN3A Haploinsufficiency
  description: >-
    Heterozygous truncating variants and whole-gene deletions reduce the dose
    of SIN3A. Truncating variants are distributed across the gene and no
    genotype-phenotype correlation or missense hotspot has been found, which
    supports haploinsufficiency as the principal mechanism.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SIN3A
    term:
      id: hgnc:19353
      label: SIN3A
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: DECREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  evidence:
  - reference: PMID:27399968
    reference_title: "Haploinsufficiency of MeCP2-interacting transcriptional co-repressor SIN3A causes mild intellectual disability by affecting the development of cortical integrity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, our data establish that haploinsufficiency of SIN3A is associated with mild syndromic intellectual disability"
    explanation: Founding report establishing SIN3A haploinsufficiency as the disease mechanism.
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, majority of patients in published literature and this cohort appear to have truncating variants reinforcing haploinsufficiency as likely mechanism of pathogenicity"
    explanation: Predominance of truncating variants supports haploinsufficiency.
  downstream:
  - target: Reduced SIN3A-HDAC Corepressor Activity
    causal_link_type: DIRECT
    description: >-
      Halving SIN3A dose is expected to reduce the amount of assembled
      SIN3A-HDAC corepressor; this has not been measured directly in patient
      cells.
- name: SIN3A PAH1 Domain Partner-Binding Defect
  description: >-
    The few disease-associated missense variants include A126V and K155E in the
    PAH1 domain, the amphipathic-helix hub that binds transcription factors and
    SIN3A-associated proteins. Recombinant PAH1 carrying either variant binds
    SAP25 and TET1 less tightly (K155E more than 15-fold weaker for TET1), so
    these alleles impair specific partner recruitment rather than abolishing the
    protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SIN3A
    term:
      id: hgnc:19353
      label: SIN3A
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: DECREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  evidence:
  - reference: PMID:41759735
    reference_title: "Stability and interaction defects in the Sin3A-PAH1 αα-hub domain associated with loss-of-function variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variants of Sin3A-PAH1 exhibit lower affinities for both SAP25 and Tet1, with a >15-fold reduction in the affinity of PAH1-K155E for Tet1."
    explanation: Biophysical measurement of reduced partner binding by two patient missense variants.
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Both altered residues by c.377C>T, p.(Ala126Val) and c.463A>G, p.(Lys155Glu) were predicted to be part of the SAP25 SID-binding surface."
    explanation: Structural modelling placed both missense residues on the SAP25 binding surface.
  downstream:
  - target: Reduced SIN3A-HDAC Corepressor Activity
    causal_link_type: DIRECT
    description: >-
      Weaker binding of PAH1 partners is expected to reduce recruitment of the
      corepressor to its target genes; this has not been shown in patient cells.
    evidence:
    - reference: PMID:41759735
      reference_title: "Stability and interaction defects in the Sin3A-PAH1 αα-hub domain associated with loss-of-function variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings show how disease-associated Sin3A-PAH1 variants can affect global domain stability and flexibility as well as interactions with specific partner proteins"
      explanation: The variants act by impairing partner interactions of the scaffold.
- name: Reduced SIN3A-HDAC Corepressor Activity
  description: >-
    SIN3A is the scaffold of a corepressor complex containing HDAC1 and HDAC2
    that is recruited by sequence-specific repressors and by the methyl-CpG
    binding protein MeCP2, linking DNA methylation to histone deacetylation and
    transcriptional repression. Reduced SIN3A function is expected to weaken
    repression at its target genes. Mouse embryos lacking Sin3a entirely die
    around implantation, so the patient state is a partial loss of an
    essential regulator.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: DECREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
  protein_complexes:
  - preferred_term: SIN3-HDAC corepressor complex
    term:
      id: GO:0070822
      label: Sin3-type complex
  evidence:
  - reference: PMID:9150135
    reference_title: "Histone deacetylases and SAP18, a novel polypeptide, are components of a human Sin3 complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have found that the mammalian transcriptional repressor Sin3 (mSin3) exists in a complex with histone deacetylases HDAC1 and HDAC2."
    explanation: Defines the SIN3-HDAC corepressor complex.
  - reference: PMID:9620804
    reference_title: "Transcriptional repression by the methyl-CpG-binding protein MeCP2 involves a histone deacetylase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that a region of MeCP2 that localizes with the TRD associates with a corepressor complex containing the transcriptional repressor mSin3A and histone deacetylases."
    explanation: MeCP2 recruits the SIN3A-HDAC complex, the interaction named in the founding SIN3A disease report.
  - reference: PMID:30279502
    reference_title: "Sin3A recruits Tet1 to the PAH1 domain via a highly conserved Sin3-Interaction Domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The Sin3A protein sits at the centre of the complex, mediating multiple simultaneous protein-protein interactions via its four paired-amphipathic helix (PAH) domains (PAH1-4)."
    explanation: SIN3A is the scaffold that docks partners through its PAH domains.
  - reference: PMID:32391601
    reference_title: "The neuronal transcription factor Myt1L interacts via a conserved motif with the PAH1 domain of Sin3 to recruit the Sin3L/Rpd3L histone deacetylase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that Myt1L, through a highly conserved segment shared with its paralogs, interacts directly and specifically with the Sin3 PAH1 domain, binding principally to the canonical hydrophobic cleft found in paired amphipathic helix domain (PAH) domains."
    explanation: >-
      A neuronal-identity transcription factor recruits the complex through
      PAH1, one plausible link between SIN3A dose and neuronal development;
      not tested in a SIN3A-deficient system.
  - reference: PMID:22206758
    reference_title: "Sin3a is essential for the genome integrity and viability of pluripotent cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Previous studies have identified Sin3a as essential for embryonic development around the time of implantation"
    explanation: Complete loss of Sin3a is embryonic lethal in mice, so patients carry a partial loss of an essential gene.
  downstream:
  - target: Impaired Cortical Neurogenesis and Neuronal Identity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown by Sin3a knockdown in the developing mouse cortex; which SIN3A
      target genes mediate the effect is not known.
    evidence:
    - reference: PMID:27399968
      reference_title: "Haploinsufficiency of MeCP2-interacting transcriptional co-repressor SIN3A causes mild intellectual disability by affecting the development of cortical integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in vivo functional knockdown of Sin3a led to reduced cortical neurogenesis, altered neuronal identity and aberrant corticocortical projections in the developing mouse brain"
      explanation: Reducing Sin3a in the embryonic mouse cortex impairs neurogenesis and neuronal identity.
  - target: Blood DNA Hypomethylation Episignature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The episignature is a genome-wide readout of SIN3A haploinsufficiency in
      blood; how reduced corepressor activity produces the methylation changes
      is not established.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The genetic link is established; the mechanism of growth restriction is unknown.
  - target: Feeding difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

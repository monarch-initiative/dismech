- name: Impaired Cortical Neurogenesis and Neuronal Identity
  description: >-
    In utero knockdown of Sin3a in the embryonic mouse cortex reduced the
    production of cortical neurons from progenitors and altered the identity
    of the neurons produced. This is the cellular step proposed to underlie the
    cognitive phenotype, and reduced neurogenesis is a plausible basis of the
    microcephaly, although that link has not been tested directly.

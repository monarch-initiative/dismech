    snippet: "Witteveen-Kolk syndrome (WITKOS) is a rare, autosomal dominant neurodevelopmental disorder caused by heterozygous loss-of-function alterations in the SIN3A gene."
    explanation: States autosomal dominant inheritance through heterozygous loss of function.

animal_models:
- name: Sin3a in utero knockdown in embryonic mouse cortex
  species: Mouse
  genotype: Sin3a knockdown in developing cortex (in vivo functional knockdown)
  publication: PMID:27399968
  modeled_mechanisms:
  - target: Impaired Cortical Neurogenesis and Neuronal Identity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Focal knockdown of Sin3a in the developing cortex reduces neurogenesis and alters neuronal identity.
    limitations: >-
      Knockdown is focal and of uncertain depth rather than a constitutional
      heterozygous loss, and it reports cortical development only, not
      behaviour or the non-neural features.
    evidence:
    - reference: PMID:27399968
      reference_title: "Haploinsufficiency of MeCP2-interacting transcriptional co-repressor SIN3A causes mild intellectual disability by affecting the development of cortical integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in vivo functional knockdown of Sin3a led to reduced cortical neurogenesis, altered neuronal identity and aberrant corticocortical projections in the developing mouse brain"
      explanation: Knockdown reproduces the cellular cortical defect.
  - target: Disrupted Cortical Integrity and Connectivity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Knockdown produces aberrant corticocortical projections.
    limitations: >-
      Patient MRI shows corpus callosum and ventricular changes; whether the
      projection defect in mice corresponds to these findings is not shown.
    evidence:
    - reference: PMID:27399968
      reference_title: "Haploinsufficiency of MeCP2-interacting transcriptional co-repressor SIN3A causes mild intellectual disability by affecting the development of cortical integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in vivo functional knockdown of Sin3a led to reduced cortical neurogenesis, altered neuronal identity and aberrant corticocortical projections in the developing mouse brain"
      explanation: Knockdown produces aberrant cortical projections.

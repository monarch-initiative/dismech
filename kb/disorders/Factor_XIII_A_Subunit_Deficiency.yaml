name: Factor XIII A Subunit Deficiency
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
parents:
- Bleeding Disorder
- Coagulation Disorder
- Rare Bleeding Disorder
disease_term:
  preferred_term: Factor XIII A subunit deficiency
  term:
    id: MONDO:0013187
    label: factor XIII, A subunit, deficiency of
synonyms:
- congenital factor XIII A subunit deficiency
- hereditary factor XIII A subunit deficiency
- hereditary factor XIII type II deficiency
- FXIII-A deficiency
- fibrin stabilizing factor deficiency
description: >-
  Severe congenital deficiency of the catalytic A subunit of coagulation factor
  XIII, caused by biallelic pathogenic variants in F13A1. Factor XIII is the
  terminal enzyme of coagulation: thrombin and calcium convert the plasma
  FXIII-A2B2 heterotetramer into the active transglutaminase FXIIIa, which
  forms epsilon-(gamma-glutamyl)lysine isopeptide bonds between fibrin
  gamma-chains and then between alpha-chains, covalently ligates
  alpha-2-antiplasmin into the clot, and cross-links fibrin to fibronectin and
  other matrix proteins. Because every one of those reactions happens after
  fibrin has already polymerised, nothing upstream of cross-linking is affected:
  primary haemostasis, the prothrombin time, the activated partial
  thromboplastin time, the thrombin time and the fibrinogen concentration are
  all normal. The defect is one of clot stabilisation, and it has two
  mechanistically distinguishable arms - a mechanically weak clot, and a clot
  that is lysed prematurely - which together produce the characteristic pattern
  of bleeding delayed after apparently adequate initial haemostasis.

  The clinical signature is paediatric. Delayed bleeding from the umbilical
  stump days to weeks after cord separation is the classic presenting sign, and
  spontaneous or minor-trauma intracranial haemorrhage - overwhelmingly
  intraparenchymal, frequently the event that brings the child to attention, and
  followed by permanent neurological sequelae in 21 of the 38 patients in the
  published series that describes the pattern - is the most serious complication
  and a principal cause of death and lasting disability. That risk, and the fact
  that it is preventable, is the entire reason lifelong primary prophylaxis
  exists in this disease. Delayed soft-tissue bleeding, poor wound healing with dehiscence
  (a transglutaminase function beyond haemostasis) and first-trimester pregnancy
  loss in affected women complete the picture.

  Because the routine coagulation screen is normal, the disease is found only by
  a specific quantitative FXIII activity assay; the historical urea or
  monochloroacetic acid clot solubility test detects only the most severe cases
  and a normal result does not exclude the diagnosis. Diagnostic delay is
  therefore the rule rather than the exception.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.05
  rate_denominator: POPULATION
  notes: >-
    Approximately 1 in 2,000,000, i.e. 0.05 cases per 100,000. Published
    estimates for severe congenital FXIII deficiency span roughly 1 in 2 million
    to 1 in 5 million; this record normalizes the most commonly cited figure and
    the range is recorded in the other prevalence records below. The estimate is
    for congenital FXIII deficiency as a whole, of which A-subunit deficiency is
    about 95%.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital FXIII deficiency is a rare inherited bleeding disorder that typically follows autosomal recessive inheritance, with an estimated global prevalence of approximately one in two million individuals"
    explanation: >-
      States the worldwide prevalence estimate that this record normalizes to
      0.05 per 100,000.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the estimated incidence of severe FXIII-A deficiency is one per 2 million, a high prevalence ranging from 0.8 to 3.5% has been observed for heterozygous FXIII-A deficiency."
    explanation: >-
      Gives the same figure specifically for severe FXIII-A deficiency, which is
      the disease modelled by this entry, and separates it from the much commoner
      heterozygous state.
- population: Worldwide (lower published estimate)
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.025
  rate_low: 0.02
  rate_high: 0.033
  rate_denominator: POPULATION
  notes: >-
    Other reviews place severe inherited FXIII deficiency at 1 in 3-5 million
    (0.02-0.033 per 100,000) or 1 in 4 million (0.025 per 100,000). The spread
    between these and the 1-in-2-million figure reflects ascertainment rather
    than disagreement about biology: the disorder is systematically
    underdiagnosed because the routine coagulation screen is normal.
  evidence:

differential_diagnoses:
- name: Factor XIII B subunit deficiency
  description: >-
    A different locus, not a subtype of this entry. F13B encodes the carrier
    subunit; its loss lowers the circulating heterotetramer concentration by
    removing stabilisation and transport rather than abolishing catalysis, and
    the phenotype is correspondingly milder - severe F13B deficiency may be
    managed on demand rather than with mandatory primary prophylaxis. It
    accounts for the small minority of congenital factor XIII deficiency. The
    distinction is therapeutically load-bearing, not taxonomic bookkeeping:
    recombinant FXIII-A2 is effective in A-subunit disease and is not indicated
    in B-subunit disease. MONDO:0013190 covers it; dismech has no entry for it
    at the time of writing.
  evidence:
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor XIII-A (FXIII-A) deficiency is an ultra-rare bleeding disorder characterized by high rates of morbidity and mortality, primarily resulting from intracranial hemorrhage, umbilical cord bleeding, and miscarriage, whereas patients with severe FXIII-B deficiency present with a milder phenotype."
    explanation: >-
      States the severity difference that is the clinical basis for keeping the
      two loci as separate entries.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, patients with severe FXIII-B deficiency may only require on-demand therapy, while heterozygotes are generally asymptomatic."
    explanation: >-
      Supports the different management default, which is part of why this is a
      separate disease rather than a subtype.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because recombinant FXIII-A2 (catridecacog) replaces only the FXIII-A subunit, it is appropriate for F13A1 deficiency (i.e., the majority of cases) but not for isolated F13B deficiency, a distinction that has direct therapeutic implications."
    explanation: >-
      The therapeutic consequence of the boundary, and the reason it must not be
      collapsed.
- name: Acquired factor XIII deficiency
  description: >-
    A different disease, not a late-onset form of this one. It arises either
    immunologically, from autoantibodies (commonly IgG4) against FXIII-A or less
    often FXIII-B, or non-immunologically from consumption, dilution or reduced
    synthesis in major surgery, trauma, sepsis, liver disease and disseminated
    intravascular coagulation. It presents in adults with abrupt severe
    bleeding, there is no pathogenic variant, and the definitive treatment of
    the immune form is inhibitor eradication with immunosuppression rather than
    lifelong replacement. A 1:1 mixing study that fails to correct separates it
    from congenital deficiency at the bench. MONDO:0021133 covers it.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immune-mediated deficiency develops when autoantibodies—commonly IgG4 subclass—target FXIII-A or, less frequently, FXIII-B subunits."
    explanation: >-
      Establishes the autoantibody mechanism that distinguishes the acquired
      immune form.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike congenital disease, inhibitor eradication generally allows return to normal hemostasis without ongoing replacement therapy, though relapse can occur and warrants surveillance."
    explanation: >-
      States the management difference that follows from the different
      mechanism, supporting separation rather than lumping.
  - reference: PMID:24503678
    reference_title: Coagulation factor XIII deficiency. Diagnosis, prevalence and management of inherited and acquired forms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The acquired form of FXIII deficiency is usually caused by generation of autoantibodies or hyperconsumption in other disease states such as disseminated intravascular coagulation."
    explanation: >-
      Independent statement of the two acquired mechanisms named here.
- name: Congenital afibrinogenemia and hypofibrinogenemia
  description: >-
    The other inherited disorder that classically causes delayed umbilical stump
    bleeding, so it is the main alternative when that sign presents. It is
    separable on the routine screen, which is grossly abnormal in
    afibrinogenaemia and normal here, and on the fibrinogen concentration.
    Fibrinogen abnormalities also confound the clot solubility test - low or
    dysfunctional fibrinogen produces false positives - which is one more reason
    not to rely on that test.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypofibrinogenemia and dysfibrinogenemia can cause false positives, whereas increased fibrinogen may reduce sensitivity and contribute to false negative results."
    explanation: >-
      Supports the confounding of the solubility test by fibrinogen
      abnormalities, which is why this differential matters at the bench.
- name: Hemophilia A and hemophilia B
  description: >-
    Distinguished by the activated partial thromboplastin time, which is
    prolonged in the haemophilias and normal here, and clinically by the joint
    pattern: recurrent haemarthrosis is the hallmark of haemophilia and is
    relatively uncommon in factor XIII deficiency.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Joint hemorrhage is relatively uncommon, distinguishing FXIII deficiency from hemophilia."
    explanation: >-
      The clinical discriminator quoted directly.
discussions:
- discussion_id: gap_fxiii_a_prophylaxis_trough_target
  kind: KNOWLEDGE_GAP
  prompt: >-
    What trough factor XIII activity should prophylaxis target, and does a
    higher target reduce intracranial haemorrhage or improve pregnancy outcome?
  rationale: >-
    Every activity threshold in this entry - the 5-20% prophylaxis trough, the
    10-15% spontaneous-bleeding threshold, the 30% perioperative target, the
    trimester-specific obstetric targets - comes from product labelling,
    narrative review and observational series, not from a trial that compared
    targets against outcomes. The review that is this entry's principal source
    says so explicitly and names the comparison that is missing. This matters
    more here than it would for most thresholds, because the outcome being
    prevented is permanent neurological injury in a young child, and because the
    interval between doses is long enough that the trough is the operative
    quantity.
  attaches_to:
  - "biochemical#Plasma factor XIII activity"
  - "treatments#Plasma-Derived Factor XIII Concentrate Prophylaxis"
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite these advancements, sustained progress in FXIII deficiency will require studies that link target activity thresholds to outcomes in the settings where decisions are most time sensitive."
    explanation: >-
      The source's own statement that the threshold-to-outcome link is
      unestablished, which is the gap recorded here.
  - reference: PMID:31414482
    reference_title: "Congenital factor XIII deficiency: comprehensive overview of the FranceCoag cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients exhibiting FXIII levels <10 iu/dl, prophylaxis could be discussed at diagnosis and at pregnancy. Further controlled prospective studies are needed."
    explanation: >-
      A national cohort reaching the same conclusion - that the prophylaxis
      decision rests on uncontrolled data.
- discussion_id: gap_fxiii_a_activity_severity_modifiers
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does residual factor XIII activity predict clinical severity only
    moderately well, and what modifies the bleeding phenotype at a given
    activity level?
  rationale: >-
    Genotype does not predict phenotype in this disease at all, and activity
    predicts it only moderately to strongly. Both facts are reported rather than
    explained. Candidate modifiers are visible in the mechanism this entry
    models - the relative contribution of the mechanical and fibrinolytic arms
    could differ between patients, and the platelet FXIII-A pool is a
    compartment that plasma activity assays do not report - but nothing in the
    literature reviewed here tests that. The practical consequence is that a
    measured activity cannot be used on its own to decide who needs prophylaxis.
  attaches_to:
  - "genetic#F13A1"
  - "biochemical#Plasma factor XIII activity"
  evidence:
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no correlation between genotype and phenotype and a moderate to strong correlation between factor activity and clinical severity in FXIII-A deficiency, making it difficult to predict bleeding patterns based on genotype and FXIII activity levels."
    explanation: >-
      States both halves of the gap - no genotype-phenotype correlation, and an
      imperfect activity-severity correlation.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This platelet FXIII-A supports platelet activation dynamics (e.g., spreading/adhesion); loss or genetic deletion of platelet FXIII-A impairs clot retraction and reduces thrombus stability, underscoring distinct roles for cellular (platelet) versus plasma FXIII."
    explanation: >-
      Establishes that a cellular FXIII-A compartment with its own functions
      exists, which is the candidate modifier the rationale names.
- discussion_id: gap_fxiii_a_diagnosis_before_first_ich
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can diagnosis be made before the first intracranial haemorrhage in children
    without a known family history?
  rationale: >-
    The preventable outcome is frequently the presenting one. In a South Indian
    paediatric cohort the median age at symptom onset was 6 months and the
    median age at diagnosis 1 year, and intracranial bleeding was the first
    presentation in a significant number of children; in the FranceCoag cohort
    7 of 15 patients who had an intracranial haemorrhage were already diagnosed
    but untreated. Those are two different failures - one of diagnosis, one of
    treatment - and both are addressable. No newborn screening exists, and the
    only test that would find the disease is one that most laboratories cannot
    run.
  attaches_to:
  - "definitions#Laboratory diagnosis of factor XIII A subunit deficiency"
  - "phenotypes#Intracranial hemorrhage"
  evidence:
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of symptom onset was 6 mo, and the median age of diagnosis was 1 y, demonstrating a delay in diagnosis."
    explanation: >-
      Quantifies the diagnostic delay in a real paediatric cohort.
  - reference: PMID:31414482
    reference_title: "Congenital factor XIII deficiency: comprehensive overview of the FranceCoag cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of the 15 patients who experienced ICH were diagnosed but untreated, including 3 with secondary neurological sequelae."
    explanation: >-
      Separates the treatment failure from the diagnostic failure, which is the
      distinction this gap turns on.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic delays are common given the paradox of normal screening assays and the limited sensitivity of historical clot solubility tests, underscoring the need for validated quantitative FXIII activity methods and inhibitor evaluation when appropriate."
    explanation: >-
      Names the two reasons for delay - a normal screen and an insensitive
      historical test - that this gap asks how to overcome.
references:
- reference: PMID:41583548
  title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
- reference: PMID:39613144
  title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
notes: >-
  Lump/split decision: DISEASE. This is a single locus, a single protein
  function, and a single conserved pathograph running from biallelic F13A1 loss
  of function to delayed bleeding through three substrate-specific branches
  (fibrin chains, alpha-2-antiplasmin, and the extracellular matrix), so it
  meets the criterion for its own `kb/disorders/` entry rather than a grouping,
  a subtype, or an out-of-scope term. Three boundary calls were made
  explicitly.

  F13B (B subunit) deficiency is a separate disease and is NOT a subtype here.
  It is a different gene on a different chromosome (HGNC:3534, resolved from the
  HGNC REST API during curation, against HGNC:3531 for F13A1); the mechanism is
  loss of stabilisation and carriage rather than loss of catalysis; the
  phenotype is milder, with on-demand therapy rather than mandatory primary
  prophylaxis; and - decisively - recombinant FXIII-A2 works in A-subunit
  disease and is not indicated in B-subunit disease, so collapsing the two would
  make this entry's treatment section wrong for half its members. MONDO agrees,
  carrying MONDO:0013190 for the B-subunit disorder and MONDO:0018029
  (congenital factor XIII deficiency) as the parent that unites them. dismech
  has no F13B entry at the time of writing, and no grouping for congenital
  factor XIII deficiency; if both are curated, MONDO:0018029 is the natural
  grouping anchor. The B-subunit concept appears here only as a differential
  diagnosis, plus one biochemical record noting that FXIII-B antigen is also low
  in A-subunit disease, which is a diagnostic trap rather than an overlap in
  mechanism.

  Severity tiers were curated as a quantitative activity axis, not as
  `has_subtypes`. The literature reports severity by residual FXIII activity -
  severe at or below about 1-3%, increased spontaneous bleeding risk below about
  10-15%, haemostatic targets of 20-30% and above - and these are thresholds on
  one continuous measurement, not discontinuities between entities. Two things
  settled the call. First, genotype does not predict phenotype at all in this
  disease, so there is no genetic partition for subtypes to track. Second, the
  same numbers are used in two different roles - to describe severity and to set
  treatment targets - which is the signature of a decision threshold rather than
  of a disease boundary. They are therefore curated as `interpretation_bands` on
  the plasma FXIII activity record, where the boundaries can be half-open and
  the treatment targets can sit on the same scale as the severity tiers.

  Note that this reasoning does not apply to the FXIII type I / type II
  nomenclature that appears among MONDO's synonyms for this term ("hereditary
  factor XIII type II deficiency"). That older classification is a subunit
  distinction, not a severity one, and the synonym is retained in `synonyms:`
  because MONDO carries it; no attempt is made here to assert the historical
  mapping, because no source reviewed during this curation stated it.

  Acquired (autoantibody-mediated or consumptive) factor XIII deficiency is a
  different disease, curated as a differential diagnosis. It has no germline
  lesion, presents in adults, and is treated by eradicating the inhibitor rather
  than by lifelong replacement. MONDO:0021133 covers it. It is not folded in.

  Module conformance. No `conforms_to` is declared, after checking the
  candidates. `primary_hemostatic_plug_failure` scopes itself to loss of a
  platelet primary-hemostatic component and explicitly excludes
  coagulation-factor deficiencies; it is doubly inapplicable here, since
  preserved primary haemostasis is the defining feature of this disease.
  `thrombogenesis` models pathological intravascular thrombus formation, the
  mechanistic inverse. `fibrotic_response` concerns mesenchymal activation and
  matrix deposition in chronic injury, not acute provisional-matrix
  cross-linking. A shared module for the inherited coagulation-factor
  deficiencies would be a reasonable future addition - the same conclusion
  `Congenital_Prothrombin_Deficiency` reached - and does not exist yet. A
  clot-stabilisation-failure module covering this disease, alpha-2-antiplasmin
  deficiency and PAI-1 deficiency would be an even better fit and is a narrower,
  more defensible candidate.

  Ontology bindings deliberately left loose, with reasons. (1) There is no CL or
  GO term for the FXIII-A2B2 heterotetramer, so the molecular claim is carried
  by GO:0003810 (protein-glutamine gamma-glutamyltransferase activity) with a
  LOSS_OF_FUNCTION modifier rather than by a complex term. (2) The `biochemical`
  records bind NCIT measurement terms because NCIT has no
  FXIII-A-subunit-specific antigen term and no term for the clot solubility
  test; the subunit and method specificity is carried by the record name and by
  the LOINC code on the reference range. (3) `Cryoprecipitate or Plasma
  Bridging` binds the generic NCIT Blood Transfusion action term because NCIT
  has no cryoprecipitate transfusion action; NCIT:C180873 Cryoprecipitated
  Plasma is a blood-product term outside the Clinical Intervention or Procedure
  branch and so cannot fill a `treatment_term`. (4) LOINC codes were taken from
  the NLM Clinical Table Search Service rather than from an OAK adapter, because
  LOINC is not configured in `conf/oak_config.yaml` and is therefore not covered
  by `just validate-terms`; each code's long common name is recorded verbatim as
  the label. (5) The `Intact Thrombin Generation and Fibrin Polymerisation
  Upstream of Cross-Linking` node binds GO:0072378 with no `modifier`, because
  the claim is that the process is unchanged and ModifierEnum has no value for
  normal; the same gap means the `Routine coagulation screen` biochemical
  readout carries no `direction`.

  Three independent mouse lines are curated, not one, because they carry
  different claims. The exon-7 deletion line (PMID:12529747) establishes the
  molecular lesion and the clot-stability defect and is fertile. A separately
  derived FXIIIA-knockout line (PMID:12933578) is the only animal support for the
  pregnancy-loss phenotype: homozygous dams conceive and then die of gestational
  haemorrhage with placental necrosis by day 10, independent of fetal genotype.
  A third report (PMID:16113836) supplies the wound-healing arm with a rescue
  arm, and is recorded with its genotype left as the authors stated it -
  "FXIII-deficient", subunit unspecified - rather than upgraded to FXIII-A-null
  on the grounds that only A-subunit lines existed at the time, which would be an
  inference presented as a fact. Keeping them separate is what makes "this line is
  fertile" and "this line miscarries" both true without contradiction.

  The canine record (PMID:42184124) is the only one in which both arms of the
  mechanism were measured in the same individual: one set of viscoelastic
  tracings showing reduced maximum clot firmness and a markedly abnormal
  45-minute lysis index together, both correcting on replacement. It is also the
  only non-human support for the preserved-upstream-cascade node, since the dog's
  PT, aPTT, thrombin time, fibrinogen and individual factor assays were all
  within reference limits at 5% FXIII activity. It is curated as the second
  reported canine case and the first genetic characterisation in a companion
  animal, which is what the report claims - not as the first canine description,
  which it is not. A caveat is recorded on the fibrinolytic link: the two arms
  are distinguishable in those tracings but were not independently manipulated,
  and the dog received tranexamic acid alongside the blood products, so the
  correction is not attributable to FXIII repletion alone. The ferret experiments
  cited on the node itself remain the evidence that the two arms are separable in
  principle.

  Causal-edge citation policy, since the pathograph is deliberately uneven about
  it. Some causal edges here carry their own evidence and some do not, and that
  is a decision rather than an omission: an edge is cited only where a source
  states that specific causal step, because CLAUDE.md is explicit that two
  well-evidenced nodes do not establish that one causes the other. Where no
  source states the step, the edge carries a `description` saying what the step
  is and no evidence. That is the case for the four edges from the
  delayed-bleeding node to subcutaneous haemorrhage, intramuscular haematoma,
  epistaxis and menorrhagia, and for the edge from accelerated fibrinolysis to
  delayed bleeding. For those four in particular the available sources say that
  patients with this disease bleed at those sites, which is the node-level claim
  already carried on each phenotype record, not a statement that the bleed
  follows from the delayed-bleeding state; reusing those citations on the edges
  would have been reaching for a node's evidence to cover an edge. No edge was
  softened away from `DIRECT`, because the anatomical-site edges are about as
  direct as a causal claim gets here - the same failure reaching a different
  tissue.

  Deep-research leads taken and not taken. The committed report's causal chain
  independently reproduces this entry's three-branch structure, and three of its
  leads were chased to primary sources and curated: the wound-healing and
  uterine-haemorrhage mouse lines and the canine F13A1 case above. The canine
  report was flagged in the report as retrieved-but-unverified, and was fetched
  and read in full before anything was curated from it. Two were not. Its placental mechanism
  detail - fibrin-fibronectin cross-linking forming the cytotrophoblastic shell
  and Nitabuch's layer around gestational weeks 6-8 - is cited to a
  publisher-page link with no PMID, and the weaker but sourced version of the
  same claim is already carried here from PMID:41583548, so the specific
  developmental window is left uncurated rather than cited to an unverified
  record. Its Swiss Arg77Cys founder-variant claim the report itself flags as a
  search-engine-summarised lead, and it is not curated. The report's own
  validation sections record one unsupported quote (a Reactome pathway *title*
  quoted as if it were a finding, against PMID:11816711) and one apparent
  mislabelling of MONDO:0013187; the latter is a parsing artifact of the report's
  own gap list, in which it notes a discrepancy between MONDO:0013187 and
  MONDO:0018029. That discrepancy is not an error - the two are the A-subunit
  disease and its parent grouping respectively, which is the distinction this
  entry is drawn on, and both labels were read directly from `ols:mondo`.

  Deliberately not curated. Perioperative and obstetric activity targets are
  summarised in the activity interpretation bands but not curated as separate
  treatment records, because the sources describe them as pragmatic,
  observational and expert-opinion-based rather than as protocols. Neuraxial
  anaesthesia thresholds, direct oral anticoagulant co-administration, and
  fibrinogen concentrate as an incidental FXIII source are all described in the
  principal source on case-based evidence only and were left out rather than
  curated at a confidence the sources do not support. Tranexamic acid is not
  curated as a treatment: it is plausible on this entry's own mechanism (the
  fibrinolytic arm) and is used in other rare bleeding disorders, but no source
  reviewed during this curation recommended it for factor XIII deficiency
  specifically, and inventing the indication from the mechanism would be exactly
  the inference this knowledge base is supposed to avoid. No `datasets:` block
  is present: `just discover-datasets Factor_XIII_A_Subunit_Deficiency` returned
  exactly two candidates, both classified GENE_ONLY - geo:GSE166381 and
  geo:GSE166378, mouse embryonic-stem-cell genome-architecture-mapping datasets
  that surface only because F13A1 appears in them. Neither is about this disease
  in any organism, so both were rejected at relevance triage rather than curated;
  this is the Named Entity Confusion case CLAUDE.md describes, reached through
  dataset search. No `environmental:` block is present either: this is a
  Mendelian disorder with no exposure that initiates or exacerbates the
  mechanism. No GeneReviews chapter exists for factor XIII
  deficiency - PubMed returned no hits for the disease name with GeneReviews on
  two separate searches - so the mandatory GeneReviews phenotype baseline does
  not apply and the phenotype set is built from the reviews and cohorts cited
  above.

  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Joint hemorrhage is relatively uncommon, distinguishing FXIII deficiency from hemophilia."
    explanation: >-
      Source of both the OCCASIONAL band and the contrast with haemophilia.
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical symptomatology ranged from mucosal bleeds to intracranial bleeds and hemarthrosis, with many children having a history of prolonged umbilical bleeding in their neonatal period."
    explanation: >-
      Documents haemarthrosis in an actual paediatric cohort, which is why the
      phenotype is curated despite being uncommon.
definitions:
- name: Laboratory diagnosis of factor XIII A subunit deficiency
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The diagnostic problem in this disease is entirely a problem of test
    selection, and it is the clinical core of the entry. Suspicion comes from
    the bleeding history - delayed or disproportionate bleeding - because every
    routine test is normal. The prothrombin time, activated partial
    thromboplastin time, thrombin time and fibrinogen concentration interrogate
    thrombin generation and fibrin polymerisation, both of which are intact;
    they cannot detect a cross-linking defect and a normal set does not lower
    the probability of the diagnosis. Confirmation requires a quantitative
    FXIII activity assay, first-line, usually an ammonia-release method.
    FXIII-A and FXIII-B antigen assays then separate the A-subunit disease
    modelled here from B-subunit disease, and sequencing of F13A1 and F13B
    confirms it and determines which replacement product is appropriate. Two
    pre-analytical requirements matter: the plasma must be platelet-poor,
    because platelet FXIII-A contaminates the antigen measurement, and the
    sample must be timed relative to any replacement, because the 7-14 day
    half-life of FXIII can mask the deficiency after a dose.
  scope: >-
    Laboratory confirmation of severe congenital A-subunit deficiency. It
    excludes the acquired autoantibody-mediated form, which needs a mixing study
    and inhibitor titration in addition, and it excludes isolated F13B
    deficiency, which this laboratory sequence is designed to separate out
    rather than to include.
  attaches_to:
  - "pathophysiology#Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking"
  - "pathophysiology#Absent Plasma Factor XIII Transglutaminase Activity"
  inclusion_criteria:
  - preferred_term: Bleeding that is delayed or out of proportion to the clinical context
  - preferred_term: Markedly reduced quantitative FXIII activity, usually below 5-10% of normal
  - preferred_term: Reduced FXIII-A antigen, with FXIII-B antigen secondarily low or normal
  - preferred_term: Biallelic pathogenic F13A1 variants on sequencing
  exclusion_criteria:
  - preferred_term: Correction of low FXIII activity in a 1:1 mix with pooled normal plasma, indicating an inhibitor rather than congenital deficiency
  - preferred_term: Absent or markedly reduced FXIII-B antigen with a pathogenic F13B genotype, indicating B-subunit deficiency
  - preferred_term: Reliance on a normal urea or monochloroacetic acid clot solubility test to exclude the diagnosis
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding that is delayed or out of proportion to the clinical context with normal PT, aPTT, thrombin time, and fibrinogen should evoke suspicion for FXIII deficiency"
    explanation: >-
      States the entry criterion - the bleeding pattern against a normal
      screen - that this definition is built on.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative FXIII activity measurement is the recommended first-line diagnostic modality"
    explanation: >-
      Establishes the quantitative activity assay as the first-line confirmatory
      test required by this definition.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In F13A1-related quantitative defects, both activity and FXIII-A antigen are reduced, and FXIII-B antigen may be secondarily decreased because heterotetramer formation is impaired."
    explanation: >-
      Source of the antigen pattern used here to assign a patient to A-subunit
      rather than B-subunit disease.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "timing relative to replacement therapy must be documented because the extended half-life of FXIII (7-14 days) can mask baseline deficiency if samples are drawn post-dose"
    explanation: >-
      Source of the pre-analytical timing requirement stated in this definition.
  - reference: PMID:27077776
    reference_title: Diagnosis of factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All routine coagulation tests are normal in FXIII deficiency (FXIIID), which complicates the diagnosis of this disorder."
    explanation: >-
      Independent statement that the entire routine screen is normal, which is
      the premise of this definition.
  - reference: PMID:29027765
    reference_title: "Factor XIII deficiency diagnosis: Challenges and tools."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of FXIIID is challenging due to normal standard coagulation assays requiring specific FXIII assays for diagnosis, which is especially difficult in developing countries."
    explanation: >-
      Supports the requirement for a FXIII-specific assay and records the access
      problem that makes this definition hard to apply in practice.
  notes: >-
    No LOINC-coded computable phenotype algorithm is asserted. The LOINC codes
    for the relevant assays are recorded on the `biochemical` records below,
    where the reference intervals live; this definition is a clinical-laboratory
    diagnostic sequence, not a validated EHR case-finding query, so
    `validation_status` is deliberately absent rather than guessed at.
- name: Insensitivity of the clot solubility screen
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Recorded as a definition rather than a note because it is a statement about
    what a test does and does not establish, and getting it wrong is the
    commonest route to a missed diagnosis. The urea (5 M) or monochloroacetic
    acid (1%) clot solubility test is still the first and often only screen
    available in many laboratories. A positive result does indicate severe
    deficiency, at activity levels of roughly 1-5% depending on method. A
    negative result establishes nothing: sensitivity is poor, raised fibrinogen
    reduces it further, and hypofibrinogenaemia and dysfibrinogenaemia generate
    false positives. Contemporary guidance restricts the test to crude
    adjunctive use in low-resource settings and is explicit that a normal result
    must not delay quantitative activity testing.
  attaches_to:
  - "biochemical#Fibrin clot solubility in urea or monochloroacetic acid"
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A positive result strongly suggests severe deficiency at very low activity levels (~1 to 5% depending on method); however, sensitivity is poor."
    explanation: >-
      Source of the asymmetry between a positive and a negative result, and of
      the activity range at which the test turns positive.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contemporary guidelines therefore discourage reliance on clot solubility assays except as crude adjuncts in low-resource settings; a normal solubility test does not exclude clinically relevant FXIII deficiency and should not delay quantitative FXIII activity testing."
    explanation: >-
      The guidance statement this definition records, including the explicit
      instruction that a normal result does not exclude the diagnosis.
  - reference: PMID:29027765
    reference_title: "Factor XIII deficiency diagnosis: Challenges and tools."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clot solubility tests are not standardized, have a low sensitivity, and are therefore not recommended as routine screening test; however, they are the first screening test in almost all coagulation laboratories in developing countries."
    explanation: >-
      Supports both the low sensitivity and the fact that this is nevertheless
      the test most patients actually get.
  - reference: PMID:27077776
    reference_title: Diagnosis of factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clot solubility assay is the most widely used method for detection of FXIIID but it is not standardized."
    explanation: >-
      Independent confirmation that the most widely used test is unstandardised.
biochemical:
- name: Plasma factor XIII activity
  presence: DECREASED
  frequency: VERY_FREQUENT
  biomarker_term:
    preferred_term: factor XIII activity
    term:
      id: NCIT:C174313
      label: Factor XIII Activity Measurement
  notes: >-
    The diagnostic test. Measured by a quantitative functional assay - most
    commonly ammonia release, in which thrombin and calcium activate FXIII and
    the liberated ammonia is quantified through a glutamate
    dehydrogenase-coupled NADH oxidation - and reported as a percentage of
    normal. Isopeptidase and amine-incorporation assays are alternatives.
    Severe disease is usually below 5-10% and often at or below 1-3%. The
    interpretation bands below are the activity thresholds used clinically to
    set prophylaxis troughs and perioperative targets; they are not a laboratory
    normal interval and they are drawn from narrative review rather than
    prospective validation, which the review itself says is the outstanding
    evidence gap. The biomarker is bound to the NCIT term for the measurement
    because NCIT's clinical-measurement branch is where this concept sits; the
    analyte-level LOINC codes are on the reference ranges.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative FXIII activity measurement is the recommended first-line diagnostic modality; while many clinical laboratories still lack the ability to perform such assays, in those that do, at the time of writing, ammonia-release assays predominate."
    explanation: >-
      Establishes the assay as first-line and names the predominant method
      described here.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype varies with residual FXIII activity and is often severe when activity is significantly reduced (≤1-3%)."
    explanation: >-
      Source of the activity level at which severe disease is described, and of
      the activity-severity relationship this marker reports.
  readouts:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The assay measures the transglutaminase activity that the pathophysiology
      node says is absent, which is why it is the one test that detects this
      disease.
  reference_ranges:
  - loinc_term:
      id: LOINC:27815-0
      label: Coagulation factor XIII activity actual/normal in Platelet poor plasma by Chromogenic method
    unit: '%'
    population: Patients with congenital factor XIII deficiency
    notes: >-
      No normal interval is asserted. The bands below are clinical decision
      thresholds expressed as percent of normal FXIII activity, taken from a
      narrative review; the same review states that linking target activity
      thresholds to outcomes is an open research question. The LOINC code is the
      platelet-poor-plasma percent-of-normal activity measurement, which is the
      quantity these bands are expressed in.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although the risk of spontaneous bleeding in congenital deficiency increases below ~10-15% activity, peri-operative and critical care literature suggests aiming for ≥30% (and sometimes higher) to ensure hemostasis."
      explanation: >-
        Source of the spontaneous-bleeding threshold and the perioperative
        target that define the bands below.
    interpretation_bands:
    - name: Severe deficiency
      upper_bound: 3.0
      unit: '%'
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
      interpretation: >-
        Activity at or below about 1-3% of normal; the phenotype is usually
        severe, with spontaneous bleeding and intracranial risk. This is where
        essentially all genetically confirmed A-subunit null patients sit.
    - name: Spontaneous bleeding risk range
      lower_bound: 3.0
      upper_bound: 15.0
      unit: '%'
      abnormal_flag: LOW
      severity: MODERATE
      interpretation: >-
        Below roughly 10-15% of normal the risk of spontaneous bleeding is
        increased. Prophylaxis troughs are conventionally titrated into the
        lower part of this range (about 5-20%).
    - name: Haemostatic for minor procedures
      lower_bound: 15.0
      upper_bound: 30.0
      unit: '%'
      abnormal_flag: LOW
      severity: MILD
      interpretation: >-
        Above the spontaneous-bleeding threshold but below the target generally
        recommended for surgery.
    - name: Perioperative target
      lower_bound: 30.0
      unit: '%'
      abnormal_flag: NORMAL
      interpretation: >-
        At least 30% activity, and higher for major operations, is the level
        generally aimed for to secure surgical haemostasis. Flagged NORMAL
        because it is the intended therapeutic state, not because 30% is a
        normal endogenous value.
- name: Plasma factor XIII-A subunit antigen
  presence: DECREASED
  biomarker_term:
    preferred_term: factor XIII antigen
    term:
      id: NCIT:C112277
      label: Factor XIII Measurement
  notes: >-
    Immunoreactive FXIII-A concentration, reduced in parallel with activity in
    the quantitative A-subunit defects that make up most of this disease. This
    is the measurement that assigns a patient to A-subunit rather than B-subunit
    deficiency. Two caveats: it is less sensitive than the activity assay for
    qualitative (dysfunctional) variants, and platelet contamination of the
    plasma artefactually raises it, because platelets carry their own FXIII-A
    pool - hence the platelet-poor-plasma requirement. NCIT has no separate
    A-subunit antigen term, so the generic Factor XIII Measurement term is bound
    and the subunit specificity is carried in the record name and the LOINC
    code.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In F13A1-related quantitative defects, both activity and FXIII-A antigen are reduced, and FXIII-B antigen may be secondarily decreased because heterotetramer formation is impaired."
    explanation: >-
      States the antigen pattern in A-subunit disease, which is what this record
      asserts.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets contain abundant FXIII-A, predominantly as an A2 dimer without FXIII-B subunits; upon platelet activation, a fraction becomes exposed on the platelet surface and functionally engages within forming thrombi."
    explanation: >-
      Explains the platelet FXIII-A pool that is the source of the
      contamination artefact noted here.
  reference_ranges:
  - loinc_term:
      id: LOINC:3238-3
      label: Coagulation factor XIII Ag [Units/volume] in Platelet poor plasma by Immunoassay
    unit: IU/dL
    population: Patients with congenital factor XIII deficiency
    notes: >-
      No interval is asserted. The LOINC code is recorded so the analyte is
      machine-identifiable; no reference interval was curated because none was
      found in a citable source during this curation, and the clinically
      actionable thresholds in this disease are activity-based rather than
      antigen-based.
- name: Plasma factor XIII-B subunit antigen
  presence: DECREASED
  biomarker_term:
    preferred_term: factor XIII antigen
    term:
      id: NCIT:C112277
      label: Factor XIII Measurement
  notes: >-
    A secondary, not a primary, abnormality in this disease, and worth curating
    because it is a trap: FXIII-B antigen is also low in A-subunit deficiency,
    so a low FXIII-B does not mean F13B disease. The mechanism is clearance, not
    synthesis - the B subunit is made by hepatocytes independently of the A
    subunit, and in FXIII-A deficiency free FXIII-B2 is cleared from the
    circulation faster because there is no A2 to complex with it. Infusing
    recombinant FXIII-A2 raises FXIII-B2 back up, in humans and in mice. The
    discriminator between A- and B-subunit disease is therefore the combination
    of both antigens plus the genotype, not FXIII-B alone.
  evidence:
  - reference: PMID:37883802
    reference_title: Reciprocal stabilization of coagulation factor XIII-A and -B subunits is a determinant of plasma FXIII concentration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data show FXIII-A2 prevents FXIII-B2 loss from circulation and establish the mechanism underlying FXIII-B2 behavior in FXIII-A deficiency and during rFXIII-A2 therapy."
    explanation: >-
      Establishes the clearance mechanism behind the secondary FXIII-B
      reduction, which is the claim this record makes. Graded MODEL_ORGANISM
      because the mechanism was established in the mouse arm of the study.
  - reference: PMID:37883802
    reference_title: Reciprocal stabilization of coagulation factor XIII-A and -B subunits is a determinant of plasma FXIII concentration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma FXIII is composed of A and B subunit dimers synthesized in cells of hematopoietic origin and hepatocytes, respectively."
    explanation: >-
      Source of the statement that the B subunit is made by hepatocytes
      independently of the A subunit, which is why its reduction here is
      secondary.
  cell_types:
  - preferred_term: hepatocyte (source of the FXIII-B subunit)
    term:
      id: CL:0000182
      label: hepatocyte
- name: Fibrin clot solubility in urea or monochloroacetic acid
  presence: ABNORMAL
  biomarker_term:
    preferred_term: fibrin clot solubility
    term:
      id: NCIT:C112277
      label: Factor XIII Measurement
  notes: >-
    The historical qualitative screen, retained here because it is still what
    most patients in low-resource settings are offered, and because its
    asymmetry is a curated clinical fact: a dissolved clot indicates severe
    deficiency, an intact clot excludes nothing. See the `definitions` record
    "Insensitivity of the clot solubility screen" for the full statement. NCIT
    has no term for the solubility test itself, so the generic Factor XIII
    Measurement term is bound and the LOINC code carries the method.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A positive result strongly suggests severe deficiency at very low activity levels (~1 to 5% depending on method); however, sensitivity is poor."
    explanation: >-
      Source of the asymmetric interpretation recorded for this test.
  reference_ranges:
  - loinc_term:
      id: LOINC:3241-7
      label: Coagulation factor XIII coagulum dissolution at 24 hours [Presence] in Platelet poor plasma by Coagulation assay
    population: Patients with suspected factor XIII deficiency
    notes: >-
      A presence/absence observation, so no numeric interval applies. The LOINC
      code is recorded to identify the test; no bounds are given because the
      result is qualitative.
- name: Routine coagulation screen
  presence: NORMAL
  frequency: VERY_FREQUENT
  biomarker_term:
    preferred_term: prothrombin time
    term:
      id: NCIT:C62656
      label: Prothrombin Time
  notes: >-
    Curated as a positive finding, not an omission. The prothrombin time,
    activated partial thromboplastin time, thrombin time and fibrinogen
    concentration are all normal in this disease, and recording that here is
    what makes the negative result machine-queryable rather than a sentence in
    prose. A normal screen in a patient with delayed bleeding should raise, not
    lower, suspicion of factor XIII deficiency. The biomarker term binds the
    prothrombin time as the index test of the screen; the other three are named
    in the quoted evidence but have no single term that covers the set. The
    readout below carries no `direction` because BiomarkerReadoutDirectionEnum
    has no value for an unchanged result.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "assess thrombin generation and fibrin formation rather than crosslink maturation, FXIII deficiency presents with normal tests of coagulation despite clinically meaningful impairment of clot stability."
    explanation: >-
      States that the screening tests are normal and gives the mechanistic
      reason, which is what this record captures.
  - reference: PMID:27077776
    reference_title: Diagnosis of factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All routine coagulation tests are normal in FXIII deficiency (FXIIID), which complicates the diagnosis of this disorder."
    explanation: >-
      Independent confirmation that the whole routine panel is normal.
  readouts:
  - target: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The normal screen is the direct laboratory readout of the preserved
      upstream cascade; it reports a node that is intact, which is why it
      reports nothing about the disease.
genetic:
- name: F13A1
  gene_term:
    preferred_term: F13A1
    term:
      id: hgnc:3531
      label: F13A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    F13A1 (coagulation factor XIII A chain) on chromosome 6p24-p25 encodes the
    731-residue catalytic transglutaminase subunit of factor XIII. Biallelic
    loss-of-function variants cause this disease and account for about 95% of
    congenital factor XIII deficiency. The variant spectrum is broad - roughly
    200 variants reported across F13A1 and F13B, predominantly missense, with
    large deletions rarest - and there are no mutational hotspots, so molecular
    confirmation needs full-gene sequencing or a panel that includes the whole
    gene. Founder variants dominate locally: Trp187Arg is the most common
    variant in Iran. Genotype does not predict phenotype; residual activity does
    so moderately well. The HGNC CURIE was resolved from the HGNC REST API
    during curation (symbol F13A1 -> HGNC:3531, "coagulation factor XIII A
    chain"), and the F13B symbol was resolved separately (HGNC:3534) to confirm
    the two are distinct loci.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The F13A1 gene (chromosome 6p24–p25; 15 exons) encodes a 731-amino-acid catalytic subunit that contains the transglutaminase core"
    explanation: >-
      Source of the gene's location, exon count and protein length.
  - reference: PMID:24503678
    reference_title: Coagulation factor XIII deficiency. Diagnosis, prevalence and management of inherited and acquired forms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diverse spectrum of mutations have been reported in the F13A1 and F13B genes which cause inherited severe FXIII deficiency."
    explanation: >-
      Attributes inherited severe FXIII deficiency to variants in these two
      genes.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no correlation between genotype and phenotype and a moderate to strong correlation between factor activity and clinical severity in FXIII-A deficiency, making it difficult to predict bleeding patterns based on genotype and FXIII activity levels."
    explanation: >-
      Source of the genotype-phenotype statement, and the reason this entry puts
      severity on an activity axis rather than in genotype-defined subtypes.
  - reference: PMID:25615432
    reference_title: "Factor XIII deficiency in Iran: a comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are several disease causing mutations in Iranian patients with FXIIID, with Trp187Arg being the most common mutation in FXIIID in Iran."
    explanation: >-
      Source of the founder variant named here.
treatments:
- name: Recombinant Factor XIII-A2 Prophylaxis (Catridecacog)
  description: >-
    Monthly intravenous recombinant FXIII A-subunit dimer, given as primary
    prophylaxis. This is the one treatment that is specific to this entry rather
    than to factor XIII deficiency in general: because it replaces only the A
    subunit, it works in F13A1 deficiency and does not work in isolated F13B
    deficiency. In the mentor-2 extension trial 60 patients with severe
    (<0.05 IU/mL) A-subunit deficiency received 35 IU/kg every 28 days for at
    least 52 weeks, with a mean annualized bleeding rate of 0.043 per
    patient-year, no neutralizing antibodies, and enough haemostatic coverage
    for twelve minor surgeries without supplementary FXIII. The 28-day interval
    is possible because FXIII has a terminal half-life of about 13.7 days - an
    order of magnitude longer than the upstream factors.
  therapeutic_modality: PROTEIN_REPLACEMENT
  dosing_interval: every 28 days
  dosing_interval_days: 28
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: catridecacog (recombinant factor XIII A-subunit)
      term:
        id: NCIT:C174766
        label: Catridecacog
  target_mechanisms:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    treatment_effect: RESTORES
    description: >-
      Infused recombinant A-subunit dimer associates with the patient's own
      circulating B subunits, restoring activatable plasma transglutaminase. It
      does not correct the F13A1 lesion, so activity decays with the protein's
      half-life and the dose has to be repeated.
    evidence:
    - reference: PMID:29448295
      reference_title: "Recombinant FXIII (rFXIII-A2) Prophylaxis Prevents Bleeding and Allows for Surgery in Patients with Congenital FXIII A-Subunit Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recombinant factor XIII-A2 (rFXIII-A2) was developed for prophylaxis and treatment of bleeds in patients with congenital FXIII A-subunit deficiency."
      explanation: >-
        Names the mechanism and the indication - replacement of the missing A
        subunit in A-subunit deficiency - which is the edge asserted here.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because recombinant FXIII-A2 (catridecacog) replaces only the FXIII-A subunit, it is appropriate for F13A1 deficiency (i.e., the majority of cases) but not for isolated F13B deficiency, a distinction that has direct therapeutic implications."
    explanation: >-
      The A-subunit specificity that makes this treatment entry-specific rather
      than generic to factor XIII deficiency.
  - reference: PMID:29448295
    reference_title: "Recombinant FXIII (rFXIII-A2) Prophylaxis Prevents Bleeding and Allows for Surgery in Patients with Congenital FXIII A-Subunit Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients received 35 IU/kg rFXIII-A2 (exact dosing) every 28 ± 2 days for ≥52 weeks."
    explanation: >-
      Source of the dose and of the 28-day interval recorded in
      `dosing_interval_days`.
  - reference: PMID:29448295
    reference_title: "Recombinant FXIII (rFXIII-A2) Prophylaxis Prevents Bleeding and Allows for Surgery in Patients with Congenital FXIII A-Subunit Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean annualized bleeding rate (ABR) was 0.043/patient-year."
    explanation: >-
      The efficacy figure quoted in this treatment's description.
  - reference: PMID:29448295
    reference_title: "Recombinant FXIII (rFXIII-A2) Prophylaxis Prevents Bleeding and Allows for Surgery in Patients with Congenital FXIII A-Subunit Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Geometric terminal half-life was 13.7 days."
    explanation: >-
      Source of the half-life that makes a monthly dosing interval feasible.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary prophylaxis is mandatory for all patients with severe FXIII-A deficiency, while those with heterozygous deficiency are generally asymptomatic and may require on-demand therapy during hemostatic challenges, most commonly in women."
    explanation: >-
      States that primary prophylaxis - rather than on-demand treatment - is the
      standard of care in the severe disease this entry models.
- name: Plasma-Derived Factor XIII Concentrate Prophylaxis
  description: >-
    Pathogen-inactivated plasma-derived FXIII concentrate (Corifact,
    Fibrogammin) given monthly as primary prophylaxis, and at 20-40 IU/kg on
    demand or perioperatively. It remains first-line for routine prophylaxis
    across age groups, and unlike recombinant FXIII-A2 it covers both A- and
    B-subunit disease, because it supplies the intact A2B2 heterotetramer.
    Labelled dosing starts at 40 IU/kg every 28 days, titrated in 5 IU/kg steps
    to a trough of roughly 5-20%; children often clear it faster and need closer
    titration. An Iranian series of 38 patients who had already had an
    intracranial haemorrhage started all but one of them on 10 IU/kg every 4-6
    weeks and reported a good response with no recurrence, again with one
    exception. That is the clearest available evidence that prophylaxis prevents
    the outcome that matters most, and it is uncontrolled.
  therapeutic_modality: PROTEIN_REPLACEMENT
  dosing_interval: every 28 days
  dosing_interval_days: 28
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human plasma-derived factor XIII concentrate
      term:
        id: NCIT:C200601
        label: Human Factor XIII Concentrate
  target_mechanisms:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    treatment_effect: RESTORES
    description: >-
      Supplies the complete FXIII-A2B2 heterotetramer, restoring activatable
      plasma transglutaminase irrespective of which subunit the patient lacks.
  - target: Intracranial hemorrhage
    treatment_effect: INHIBITS
    description: >-
      The clinical endpoint prophylaxis exists for - preventing intracranial
      haemorrhage. Scheduled replacement prevents spontaneous and intracranial
      bleeding; the Iranian series recorded no recurrence of intracranial
      haemorrhage on 10 IU/kg every 4-6 weeks other than in a single patient.
    evidence:
    - reference: PMID:24149912
      reference_title: Intracranial hemorrhage pattern in the patients with factor XIII deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It seems that long-term prophylactic treatment with a dose of 10 IU/kg Fibrogammin could be effective in the prevention of CNS bleeding in the patients with F XIII deficiency."
      explanation: >-
        States the authors' conclusion that prophylaxis with this product
        prevents central nervous system bleeding, which is this edge.
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prophylaxis with FXIII-containing blood products or FXIII concentrates prevents spontaneous and intracranial hemorrhage in congenital disease, and activity-guided replacement may be clinically important in perioperative and obstetric care; nuances surrounding scenarios in which certain replacement products are effective must be considered."
      explanation: >-
        Independent statement that prophylaxis prevents intracranial
        haemorrhage.
  - target: Recurrent pregnancy loss
    treatment_effect: INHIBITS
    description: >-
      Prophylaxis through pregnancy changes the outcome dramatically: every
      unprophylaxed pregnancy in the FranceCoag cohort miscarried, against 3 of
      16 with prophylaxis.
    evidence:
    - reference: PMID:31414482
      reference_title: "Congenital factor XIII deficiency: comprehensive overview of the FranceCoag cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All pregnancies without prophylaxis (26/26) led to miscarriages versus 3/16 with prophylaxis."
      explanation: >-
        Directly contrasts pregnancy outcome with and without prophylaxis, which
        is the effect this edge records.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma-derived FXIII concentrates (pdFXIII; e.g., Corifact/Fibrogammin) remain first-line for routine prophylaxis across age groups and for peri-operative support (Table 3)."
    explanation: >-
      Establishes plasma-derived concentrate as first-line for prophylaxis and
      perioperative cover.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Product labeling supports an initial dose of 40 IU/kg intravenously every 28 days with subsequent titration (typically in 5 IU/kg increments) to maintain a trough activity of ~5–20%"
    explanation: >-
      Source of the labelled dose, the titration increment, the trough target
      and the 28-day interval recorded here.
  - reference: PMID:24149912
    reference_title: Intracranial hemorrhage pattern in the patients with factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylaxis was started with a dose of 10 IU/kg Fibrogammin every 4-6 weeks for all the patients, except for one."
    explanation: >-
      Source of the Iranian series' dosing schedule quoted in this description.
- name: Cryoprecipitate or Plasma Bridging
  description: >-
    Cryoprecipitate or plasma (fresh frozen plasma, or plasma frozen within 24
    hours of phlebotomy) raises FXIII activity where concentrate is unavailable
    or cannot be obtained quickly. It is explicitly second-line: FXIII content
    varies widely between units and products, plasma carries a volume load, and
    pathogen reduction is often absent. In practice it is nevertheless the
    treatment many patients actually receive - fourteen of the twenty children
    in the South Indian paediatric cohort were on cryoprecipitate prophylaxis,
    and four children had breakthrough bleeds when the schedule slipped,
    including one intracranial bleed during a pandemic supply interruption. That is the
    clearest illustration of why a bridging product is not an equivalent.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: transfusion of a factor XIII-containing blood component
    term:
      id: NCIT:C15192
      label: Blood Transfusion
    therapeutic_agent:
    - preferred_term: cryoprecipitated plasma
  notes: >-
    Two bindings are deliberately imprecise and the reasons are recorded rather
    than papered over. NCIT has no cryoprecipitate-transfusion clinical-action
    term, so the action is bound to the general Blood Transfusion term;
    NCIT:C180873 Cryoprecipitated Plasma exists but is a blood-product term that
    is not reachable from the Clinical Intervention or Procedure root and so
    cannot occupy the `treatment_term` slot, and it was not verified to be a
    valid ChemicalEntityTerm either, so `therapeutic_agent` carries the free-text
    name only. Fresh frozen plasma has its own action term (NCIT:C116475) but is
    curated here together with cryoprecipitate because the cited sources treat
    them as one second-line bridging option with the same rationale and the same
    caveats.
  target_mechanisms:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    treatment_effect: RESTORES
    description: >-
      Donor-derived FXIII in cryoprecipitate or plasma restores some activatable
      transglutaminase, but the delivered dose is unpredictable because the
      FXIII content of each unit varies.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can serve as temporary bridges to raise FXIII activity, but they are second-line because of FXIII content variability, larger volumes (plasma), and lack of pathogen reduction in many settings."
    explanation: >-
      States the second-line status of cryoprecipitate and plasma bridging and
      all three reasons for it. The quote starts mid-sentence because the
      preceding clause carries a bracketed span the reference validator strips
      before matching; the indication itself is supported by the two following
      items.
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four children had breakthrough bleeds due to irregular prophylaxis, including one intracranial bleed due to a delay in cryoprecipitate prophylaxis during the covid pandemic."
    explanation: >-
      Documents the breakthrough bleeding that followed interruption of
      cryoprecipitate prophylaxis in a real paediatric cohort.
  - reference: PMID:25615432
    reference_title: "Factor XIII deficiency in Iran: a comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Traditionally, the management of FXIIID in Iran was only based on administration of fresh frozen plasma or cryoprecipitate, until 2009 when FXIII concentrate became available for patient management."
    explanation: >-
      Records the historical and resource-dependent use of plasma and
      cryoprecipitate before concentrate became available.
- name: Genetic Counseling and Family Testing
  description: >-
    Molecular confirmation of the F13A1 genotype supports carrier testing,
    reproductive planning, prenatal or early neonatal diagnosis, and peripartum
    management - and it selects the replacement product, because recombinant
    FXIII-A2 is appropriate only once the defect is known to be in F13A1. In
    affected families newborns warrant prompt assessment so prophylaxis can
    start before the first intracranial bleed, which in a substantial minority
    of children is the presenting event.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular confirmation refines genetic counseling, reproductive planning (carrier testing, prenatal/early neonatal diagnosis, peripartum management), and therapeutic product selection."
    explanation: >-
      Enumerates the uses of molecular confirmation that this treatment record
      describes, including product selection.
animal_models:
- name: FXIII-A null mouse (F13a1 exon 7 targeted deletion)
  species: Mouse
  genotype: F13a1 targeted deletion of inferred exon 7, homozygous null
  publication: PMID:12529747
  description: >-
    The canonical genetic model. Homologous recombination deleted the inferred
    exon 7 of the mouse FXIII-A gene. Heterozygotes retain about 50% plasma
    transglutaminase activity and homozygotes none, and plasma fibrin
    gamma-dimerization is undetectable in homozygotes - the molecular signature
    of absent activatable FXIII. Homozygotes bleed spontaneously (haemothorax,
    haemoperitoneum, subcutaneous haemorrhage) with reduced survival, have
    markedly delayed tail-tip bleeding arrest, and show impaired clot
    stabilisation on thromboelastography. Both the bleeding time and the
    thromboelastography abnormality are corrected by human plasma FXIII, which
    makes this a model of the therapeutic response as well as of the lesion.
  modeled_mechanisms:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      A null allele at the orthologous locus producing the same molecular
      state - no activatable plasma transglutaminase and no fibrin
      gamma-dimerization.
    limitations: >-
      The lesion is an engineered exon deletion, whereas most human alleles are
      missense; that difference does not matter for a complete-null phenotype
      but means the model says nothing about the residual-activity range where
      human severity is actually decided.
    readouts:
    - name: Plasma FXIII transglutaminase activity
      target: Absent Plasma Factor XIII Transglutaminase Activity
      direction: ABOLISHED
      interpretation: >-
        Activity is abolished in homozygotes and roughly halved in
        heterozygotes, establishing the gene-dose relationship.
      evidence:
      - reference: PMID:12529747
        reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "FXIII transglutaminase activity in plasma was reduced to about 50% in mice heterozygous for the mutant allele, and was abolished in homozygous null mice."
        explanation: >-
          Reports the measurement and both genotype levels.
    - name: Plasma fibrin gamma-chain dimerization
      target: Absent Plasma Factor XIII Transglutaminase Activity
      direction: ABOLISHED
      interpretation: >-
        The reaction product of FXIIIa on fibrin is undetectable, confirming
        functional absence of the enzyme rather than merely reduced antigen.
      evidence:
      - reference: PMID:12529747
        reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Plasma fibrin gamma-dimerization was also indetectable in the homozygous deficient animals, confirming the absence of activatable FXIII."
        explanation: >-
          Reports the direct measurement of the cross-linking product.
    evidence:
    - reference: PMID:12529747
      reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mutant mice thus reiterate some key features of the human genetic disorder: they will be valuable in assessing the role of FXIII in other associated pathologies and the development of new therapies."
      explanation: >-
        The authors' own statement of how far the model reproduces the human
        disorder, which is the claim this link makes.
  - target: Mechanically Unstable Fibrin Clot
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Thromboelastography shows impaired clot stabilisation, corrected
      dose-dependently by human FXIII.
    readouts:
    - name: Thromboelastographic clot stability
      target: Mechanically Unstable Fibrin Clot
      direction: DECREASED
      interpretation: >-
        The mechanical deficit is measured directly, and its reversal on
        replacement shows the instability is attributable to the missing protein
        rather than to a secondary effect of the knockout.
      evidence:
      - reference: PMID:12529747
        reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Thrombelastography (TEG) experiments demonstrated impaired clot stabilization in FXIII-A mutant mice, replacement with human FXIII led to dose-dependent TEG normalization."
        explanation: >-
          Reports the measurement and the dose-dependent correction.
    - name: Tail-tip bleeding time
      target: Mechanically Unstable Fibrin Clot
      direction: INCREASED
      interpretation: >-
        Prolonged and restored to normal by human plasma FXIII, establishing an
        in vivo haemostatic correlate of the clot-stability defect.
      evidence:
      - reference: PMID:12529747
        reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Arrest of tail-tip bleeding in FXIII-A deficient mice was markedly and significantly delayed; replacement of mutant mice with human plasma FXIII (Fibrogammin P) restored bleeding time to within the normal range."
        explanation: >-
          Reports the prolongation and its correction by replacement.
  - target: Recurrent pregnancy loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Homozygous null mice are fertile but reproduce poorly, which is a
      quantitative reproductive deficit rather than the near-complete
      first-trimester loss seen in unprophylaxed human pregnancies.
    limitations: >-
      Human disease shows essentially universal miscarriage without prophylaxis;
      this line's homozygotes remain fertile, so it understates the phenotype.
      That is a property of this colony rather than of the mouse: the
      independently derived FXIIIA-KO line below does reproduce gestational
      haemorrhage and pregnancy loss. Murine placentation also differs from
      human, so neither line can be used to test the cytotrophoblast-invasion
      mechanism proposed for humans.
    evidence:
    - reference: PMID:12529747
      reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice were fertile, although reproduction was impaired."
      explanation: >-
        The observation on which the PARTIALLY_RECAPITULATES grading and the
        stated limitation both rest.
- name: FXIIIA-knockout mouse (uterine haemorrhage and miscarriage line)
  species: Mouse
  genotype: F13a1 (FXIIIA) knockout, homozygous
  publication: PMID:12933578
  description: >-
    An independently derived FXIII-A knockout line, analysed specifically for
    reproductive failure. Homozygous females conceive, but most die of excessive
    vaginal bleeding during gestation; histology shows massive placental
    haemorrhage and subsequent necrosis in the uterus by gestational day 10,
    irrespective of fetal genotype - so the lesion is maternal. The authors call
    the result reminiscent of spontaneous miscarriage in pregnant humans with
    FXIII deficiency and conclude that maternal FXIII is required for uterine
    haemostasis and maintenance of the placenta. This line is why the human
    pregnancy-loss phenotype has animal support at all; the exon-7 deletion line
    above remains fertile.
  modeled_mechanisms:
  - target: Recurrent pregnancy loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Gestational placental haemorrhage and pregnancy loss in homozygous
      FXIII-A-null dams, attributed by the authors to maternal FXIII.
    limitations: >-
      Two divergences from the human phenotype. The mice largely die of maternal
      haemorrhage, which is not the usual human outcome - unprophylaxed women
      miscarry and survive. And the murine loss is dated to gestational day 10
      with placental haemorrhage and necrosis, whereas the human mechanism is
      placed in the first trimester and attributed partly to failure of
      FXIII-dependent matrix cross-linking during cytotrophoblast invasion, which
      murine placentation cannot test. Fidelity is therefore MODERATE rather than
      HIGH despite the phenotype matching.
    readouts:
    - name: Maternal survival through gestation
      target: Recurrent pregnancy loss
      direction: DECREASED
      interpretation: >-
        Most homozygous dams died during gestation from vaginal bleeding, which
        is the organism-level readout of the reproductive failure.
      evidence:
      - reference: PMID:12933578
        reference_title: Factor XIII A subunit-deficient mice developed severe uterine bleeding events and subsequent spontaneous miscarriages.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although homozygous FXIIIA female KO mice were capable of becoming pregnant, most of them died due to excessive vaginal bleeding during gestation."
        explanation: >-
          Reports conception followed by fatal gestational haemorrhage, the
          measurement behind this readout.
    - name: Placental haemorrhage and necrosis on histology
      target: Recurrent pregnancy loss
      direction: INCREASED
      interpretation: >-
        Dates the lesion to gestational day 10 and localises it to the placenta,
        and shows it is independent of fetal genotype - so the defect is in the
        mother.
      evidence:
      - reference: PMID:12933578
        reference_title: Factor XIII A subunit-deficient mice developed severe uterine bleeding events and subsequent spontaneous miscarriages.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A series of histologic examinations of the pregnant animals suggested that massive placental hemorrhage and subsequent necrosis developed in the uteri of the FXIIIA KO mice on day 10 of gestation."
        explanation: >-
          Reports the histological measurement, its timing and its location.
    evidence:
    - reference: PMID:12933578
      reference_title: Factor XIII A subunit-deficient mice developed severe uterine bleeding events and subsequent spontaneous miscarriages.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results are reminiscent of spontaneous miscarriage in pregnant humans with FXIII deficiency and indicate that maternal FXIII plays a critical role in uterine hemostasis and maintenance of the placenta during gestation."
      explanation: >-
        The authors' own statement of the model's relevance to human pregnancy
        loss, which is what this link claims.
- name: FXIII-deficient mouse excisional wound-healing cohort
  species: Mouse
  genotype: FXIII-deficient (targeted subunit not stated in the cited report)
  publication: PMID:16113836
  description: >-
    The animal evidence for the non-haemostatic arm of this disease. Excisional
    wounds left unsutured and undressed closed more slowly in FXIII-deficient
    mice than in controls - 15%, 27% and 27% less closure at days 4, 8 and 11 -
    and were only 73.23% closed at day 11 against 100% in controls. Histology at
    day 11 showed delayed re-epithelialisation and a necrotised fissure. The
    informative arm is the third group: FXIII concentrate raised day-11 closure
    to 90.06% and normalised the histology, which is what makes this a model of
    the FXIII-dependent step rather than of an incidental strain difference.
  notes: >-
    The cited report calls its animals "FXIII-deficient mice" and does not state
    which subunit was targeted, so the genotype is recorded as reported rather
    than as FXIII-A-null. At the time of publication the described knockout
    lines were A-subunit lines, which makes an A-subunit genotype likely, but
    that is an inference and is not asserted here. Treat the link below as
    evidence about FXIII rather than specifically about FXIII-A.
  modeled_mechanisms:
  - target: Poor wound healing
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Quantified delay in excisional wound closure with delayed
      re-epithelialisation on histology, corrected by FXIII concentrate.
    limitations: >-
      Two limitations. The report does not say which FXIII subunit was targeted,
      so the model speaks to FXIII deficiency rather than specifically to
      A-subunit deficiency. And a murine excisional wound left unsutured and
      undressed is not the clinical scenario the human phenotype describes, which
      is dehiscence of a surgical wound; the shared claim is that FXIII is
      required for timely closure, not that the wound types correspond.
    readouts:
    - name: Percentage excisional wound closure at days 4, 8 and 11
      target: Poor wound healing
      direction: DECREASED
      interpretation: >-
        A graded, time-resolved deficit rather than a single endpoint, which is
        what makes the delay rather than the failure of healing the claim.
      evidence:
      - reference: PMID:16113836
        reference_title: Impaired wound healing in factor XIII deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "FXIII-deficient mice exhibited impaired wound healing as has been demonstrated by 15%, 27% and 27% decrease in percentage of wound closure on day 4, 8 and 11, respectively."
        explanation: >-
          Reports the measurement and the three timepoints quoted in this
          model's description.
    - name: Day-11 wound closure with and without FXIII replacement
      target: Poor wound healing
      direction: RESTORED
      interpretation: >-
        The rescue arm. Replacement moves day-11 closure from 73.23% back toward
        the control value, which attributes the deficit to the missing protein.
      evidence:
      - reference: PMID:16113836
        reference_title: Impaired wound healing in factor XIII deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "On day 11 complete healing was observed in control (100% closure), 73.23% in FXIII-deficient and 90.06% in FXIII deficient/FXIII-treated groups (p = 0.007 by ANOVA and p = 0.001 by t-test between control and FXIII-deficient groups)."
        explanation: >-
          Gives all three group values and the statistics, which is the rescue
          this readout records.
    - name: Re-epithelialisation on day-11 histology
      target: Poor wound healing
      direction: DECREASED
      interpretation: >-
        Ties the macroscopic closure deficit to the cellular process the human
        mechanism names - re-epithelialisation over a provisional matrix.
      evidence:
      - reference: PMID:16113836
        reference_title: Impaired wound healing in factor XIII deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological analysis of the lesions performed at day 11 disclosed delayed reepithelization and necrotized fissure in FXIII-deficient mice and normal healing in FXIII-deficient/FXIII-treated mice."
        explanation: >-
          Reports the histological finding and its correction by replacement.
    evidence:
    - reference: PMID:16113836
      reference_title: Impaired wound healing in factor XIII deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The findings of this study confirm that in FXIII-deficient mice wound healing is delayed and the cellular and tissue defects can be corrected by treatment with FXIII, providing evidence for the essential role of FXIII in wound repair and remodeling."
      explanation: >-
        The authors' own summary of what the model establishes, which is the
        claim this link makes.
- name: Black and Tan Coonhound with a homozygous F13A1 frameshift
  species: Dog
  genotype: "F13A1 c.1234_1239delinsTCAA (exon 11), homozygous; predicted frameshift from residue 412 with a premature stop codon"
  publication: PMID:42184124
  description: >-
    Naturally occurring disease rather than an engineered model, and the only
    record in this entry in which both arms of the mechanism were measured in the
    same individual. A 4-month-old dog presented with spontaneous
    hemoperitoneum and bleeding that persisted after surgery; whole-genome
    sequencing against 3,023 other dogs found a private homozygous
    deletion-insertion in exon 11 of F13A1 predicting a frameshift and premature
    stop, with a predicted loss of 43% of the protein and probable
    nonsense-mediated decay. Plasma FXIII activity was 5%. The diagnostic picture
    is the human one reproduced in another species: PT, aPTT, thrombin time,
    fibrinogen and every individual factor assay within reference limits, and a
    clot that dissolved completely in 5 M urea. Viscoelastic testing showed both
    reduced maximum clot firmness and a markedly abnormal 45-minute lysis index
    at the same time, and both normalised as plasma and cryoprecipitate were
    given - which is the closest thing in this entry to a direct demonstration
    that the mechanical and fibrinolytic arms are separable states of one clot.
    Canine F13A1 encodes a 733-residue protein 88% identical to the human one.
  notes: >-
    This is the second reported clinical case of FXIII deficiency in dogs and the
    first genetic characterisation of the disorder in a companion animal; it is
    not the first canine description, and is not curated as such. Graded
    MODEL_ORGANISM throughout, per CLAUDE.md: a veterinary observation in a
    non-human mammal is animal evidence however carefully the individual was
    worked up.
  modeled_mechanisms:
  - target: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The normal-screening-test finding, reproduced in a second species and in an
      animal whose causal variant is known. This is the only non-human support in
      the entry for the node that carries the diagnostic trap.
    limitations: >-
      A single animal, so the observation is that the screen can be normal in
      F13A1-null disease, not an estimate of how often it is.
    readouts:
    - name: Routine coagulation screen and individual factor assays
      target: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
      direction: UNCHANGED
      interpretation: >-
        PT, aPTT, thrombin time, fibrinogen and the individual procoagulant
        factor assays all sat within reference limits in an animal with 5% FXIII
        activity and overt bleeding - the upstream cascade reporting itself
        intact, which is what this node claims.
      evidence:
      - reference: PMID:42184124
        reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Results of coagulation screening tests, fibrinogen, platelet flow cytometry assessment of CD61 (GPIIIa) expression and poststimulation annexin V binding, and individual factor assays were within reference intervals, with the exception of Factor X:C and VWF:Ag (Table 2)."
        explanation: >-
          Reports the measurements behind this readout. The two flagged
          exceptions are a mildly low factor X the authors judged clinically
          irrelevant and a high von Willebrand antigen, neither of which is a
          cross-linking measure.
    evidence:
    - reference: PMID:42184124
      reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike other procoagulant factors, FXIII is not required for the transformation of plasma fibrinogen into the polymerized fibrin fibrils that form a fibrin clot."
      explanation: >-
        The authors state the mechanistic reason the screen is uninformative,
        which is the node this link is attached to.
  - target: Mechanically Unstable Fibrin Clot
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reduced maximum clot firmness on viscoelastic testing and complete
      dissolution of the clot in urea, both correcting as FXIII-containing blood
      products were given.
    limitations: >-
      Viscoelastic maximum clot firmness is also driven by fibrinogen and
      platelets, and this dog was transiently thrombocytopenic earlier in its
      course, so the baseline tracing is not a pure read on cross-linking. The
      fibrinogen concentration was normal and the platelet count had recovered
      by the time of the tracings, which is why the finding is still attributed
      to FXIII.
    readouts:
    - name: Clot solubility in 5 M urea
      target: Mechanically Unstable Fibrin Clot
      direction: DECREASED
      interpretation: >-
        Complete lysis within 15 minutes, reproducible on a second sample three
        weeks later. The assay is the historical human screen, so this is the
        same measurement failing the same way in a dog.
      evidence:
      - reference: PMID:42184124
        reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Results of FXIII deficiency screening tests revealed abnormally rapid clot dissolution, with complete clot lysis within 15 min of incubation in a 5 M urea solution."
        explanation: >-
          Reports the measurement, the timing and the urea concentration.
    - name: Maximum clot firmness on viscoelastic testing
      target: Mechanically Unstable Fibrin Clot
      direction: RESTORED
      interpretation: >-
        Low at baseline and normalising with plasma and cryoprecipitate, which is
        the rescue that attributes the mechanical deficit to the missing protein.
      evidence:
      - reference: PMID:42184124
        reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Preoperatively the tracing appeared hypocoagulable based on low maximum clot firmness (MCF) and hyperfibrinolytic based on residual clot firmness at 30- and 45-min post-MCF (LI30 and LI45), becoming normal with the administration of plasma products (Table 1)."
        explanation: >-
          Reports both the baseline abnormality and its correction on
          replacement.
    evidence:
    - reference: PMID:42184124
      reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A functional FXIII deficiency was identified, and a private, homozygous variant (c.1234_1239delinsTCAA) was found in exon 11 of F13A1 that predicts a frameshift and premature stop codon."
      explanation: >-
        Establishes that the clot-stability defect in this animal sits on a
        homozygous F13A1 lesion, which is what makes it a model of this disease
        rather than of acquired FXIII deficiency.
  - target: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Hyperfibrinolysis measured in the same tracings as the firmness deficit,
      and corrected alongside it. The entry models these as two arms of one
      lesion, and this is the record in which both were observed together.
    limitations: >-
      The lysis indices and the firmness measure come from the same viscoelastic
      tracings, so the two arms are distinguishable here but not independently
      manipulated - unlike the ferret embolism experiments cited on the node
      itself, where one cross-linking reaction was blocked and the other left
      intact. The dog also received tranexamic acid alongside blood products, so
      the correction is not attributable to FXIII repletion alone.
    readouts:
    - name: Viscoelastic lysis index at 45 minutes
      target: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
      direction: RESTORED
      interpretation: >-
        Markedly abnormal at baseline and normal after replacement, which is the
        fibrinolytic arm behaving as this entry's model predicts.
      evidence:
      - reference: PMID:42184124
        reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Preoperatively the tracing appeared hypocoagulable based on low maximum clot firmness (MCF) and hyperfibrinolytic based on residual clot firmness at 30- and 45-min post-MCF (LI30 and LI45), becoming normal with the administration of plasma products (Table 1)."
        explanation: >-
          The same sentence reports the hyperfibrinolysis and its correction; it
          is quoted on both links because it is the single measurement that
          establishes the two arms coexisting.
    evidence:
    - reference: PMID:42184124
      reference_title: Identification of an F13A1 frameshift variant associated with factor XIII deficiency in a Coonhound dog with severe coagulopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The findings of unstable clot formation and premature clot lysis in a viscoelastic assay combined with complete clot dissolution in urea indicated that FXIII deficiency should be considered high on the differential list as the underlying cause of abnormal bleeding for this dog."
      explanation: >-
        The authors name unstable clot formation and premature lysis as
        co-occurring findings, which is the two-arm structure this entry models.
clinical_trials:
- name: NCT00713648
  phase: PHASE_III
  status: COMPLETED
  description: >-
    The open-label, single-arm, multiple-dosing phase 3 trial of monthly
    recombinant factor XIII (catridecacog) for prevention of bleeding in
    inherited factor XIII deficiency. PMID:29448295 describes NCT00978380 as an
    extension to a pivotal trial it calls mentor-1; this registration is very
    probably that trial, but the cached registry record does not carry the
    mentor-1 name, so the identification is not asserted here.
  target_phenotypes:
  - preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: clinicaltrials:NCT00713648
    reference_title: "A Multi-Centre, Open-Label, Single-Arm and Multiple Dosing Trial on Efficacy and Safety of Monthly Replacement Therapy With Recombinant Factor XIII (rFXIII) in Subjects With Congenital Factor XIII Deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The aim of this trial is to evaluate catridecacog (recombinant factor XIII (rFXIII)) treatment in patients with inherited FXIII deficiency."
    explanation: >-
      The registry record establishing the trial's agent, population and
      objective.
- name: NCT00978380
  phase: PHASE_III
  status: COMPLETED
  description: >-
    mentor-2, the multiple-dosing extension assessing long-term safety and
    efficacy of 35 IU/kg recombinant factor XIII-A2 every 28 days in patients
    with severe congenital A-subunit deficiency. It is the source of the

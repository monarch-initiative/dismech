- name: Recurrent pregnancy loss
  category: Reproductive
  frequency: VERY_FREQUENT
  description: >-
    Recurrent first-trimester pregnancy loss in affected women, and one of the
    most prophylaxis-responsive outcomes in this disease: in the FranceCoag
    cohort every one of 26 pregnancies without prophylaxis miscarried, against 3
    of 16 with prophylaxis. A systematic review of the published literature
    found 124 of 136 unprophylaxed pregnancies (91%) ended in miscarriage. The
    mechanism is not purely haemostatic - FXIII-dependent matrix stabilisation
    is required for cytotrophoblast invasion and implantation.
  phenotype_term:
    preferred_term: Recurrent first-trimester pregnancy loss
  evidence:
  - reference: PMID:31414482
    reference_title: "Congenital factor XIII deficiency: comprehensive overview of the FranceCoag cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All pregnancies without prophylaxis (26/26) led to miscarriages versus 3/16 with prophylaxis."
    explanation: >-
      The cohort figure behind both the frequency band and the
      prophylaxis-responsiveness claim.
  - reference: PMID:23992439
    reference_title: "Congenital factor XIII deficiency in women: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 136 pregnancies without prophylactic therapy, 124 (91%) resulted in a miscarriage and 12(9%) progressed to viability stage."
    explanation: >-
      Independent, larger denominator for the same claim, supporting the
      VERY_FREQUENT band.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with childbearing potential with severe FXIII deficiency face reproductive challenges, including frequent first trimester pregnancy loss without prophylaxis; the biology represents both impaired hemostasis at the maternal-fetal interface and defective FXIII-dependent stabilization of the extracellular matrix required for successful cytotrophoblast invasion and placental implantation."
    explanation: >-
      Supports the first-trimester timing and the dual haemostatic and matrix
      mechanism stated here.
  notes: >-
    Left ontology-unbound, following the precedent in `Asherman_Syndrome` and
    `Thrombophilia`. HP:0200067 (Recurrent spontaneous abortion) exists and means
    exactly this, but HPO files it under Past medical history / Pregnancy history
    rather than under HP:0000118 phenotypic abnormality, so it is outside the
    `PhenotypeTerm` dynamic enum and binding it fails `just validate-terms`.
    HP:0005268 (Miscarriage) is no better: its ancestors are Clinical modifier /
    Prenatal death / Mortality-Aging. Searched `l^Spontaneous abortion`,
    `l^Miscarriage`, `l^Recurrent miscarriage`, `l^Abortion`, `l^Pregnancy loss`
    and `l^Fetal death` against `ols:hp`; HPO has no phenotypic-abnormality term
    for recurrent pregnancy loss.
- name: Poor wound healing
  category: Dermatologic
  frequency: FREQUENT
  description: >-
    Impaired wound repair with dehiscence, and abnormal scarring including
    keloids in some patients. This is the phenotype that shows FXIII is not only
    a coagulation factor: the defect persists even when bleeding has been
    controlled, because the provisional fibrin-matrix scaffold that fibroblasts
    and keratinocytes depend on is never properly cross-linked.
  phenotype_term:
    preferred_term: Impaired wound healing with dehiscence
    term:
      id: HP:0001058
      label: Poor wound healing
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of these matrix-stabilizing functions compromises the provisional wound matrix, delays granulation tissue formation, and increases susceptibility to wound dehiscence even when primary hemostasis appears adequate."
    explanation: >-
      States the phenotype and the mechanism, including the point that it is
      independent of haemostatic adequacy.
  - reference: PMID:16113836
    reference_title: Impaired wound healing in factor XIII deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scoring system representing maturation rate of the wounds showed that the scores for the control, FXIII-deficient and FXIII deficient/FXIII treated groups were 94.9 +/- 4.7, 61.5 +/- 14.5 and 94.5 +/- 6.4, respectively (p < 0.001 by ANOVA)."
    explanation: >-
      Animal evidence, graded accordingly, and cited alongside rather than
      instead of the human item above: a wound-maturation score that falls in
      FXIII-deficient mice and returns to the control value when FXIII is
      replaced. It is the rescue arm that makes this informative for the human
      phenotype, because it attributes the delay to the missing protein rather
      than to the strain. The corresponding readouts on the model record itself
      quote the closure percentages; this item quotes the maturation score, which
      is a separate measurement.

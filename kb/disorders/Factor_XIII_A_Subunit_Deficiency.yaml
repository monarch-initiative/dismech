    explanation: >-
      The registry record establishing the trial's design and objective.
  - reference: PMID:29448295
    reference_title: "Recombinant FXIII (rFXIII-A2) Prophylaxis Prevents Bleeding and Allows for Surgery in Patients with Congenital FXIII A-Subunit Deficiency."
    supports: SUPPORT

  category: Reproductive
  frequency: FREQUENT
  description: >-
    Heavy menstrual bleeding in affected women. In a systematic review of 121
    women with congenital FXIII deficiency, menorrhagia (26%) was the second
    most commonly reported bleeding symptom after umbilical bleeding; ovulation
    bleeding was reported in 8%.

    snippet: "mentor™2 (NCT00978380), a multinational, open-label, single-arm, multiple-dosing extension to the pivotal mentor™1 trial, assessed long-term safety and efficacy of rFXIII-A2 prophylaxis in eligible patients"
    explanation: >-

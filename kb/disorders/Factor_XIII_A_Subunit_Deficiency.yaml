    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital Factor 13 Deficiency (FXIIID) is a rare bleeding disorder (RBD) of autosomal recessive inheritance, with an incidence of 1 in 3-5 million."
    explanation: >-
      Source of the 1-in-3-to-5-million bound recorded in this record's range.
  - reference: PMID:24503678
    reference_title: Coagulation factor XIII deficiency. Diagnosis, prevalence and management of inherited and acquired forms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inherited severe FXIII deficiency, which is a rare coagulation disorder with a prevalence of 1 in 4 million has been the prime focus of clinical and genetic investigations owing to the severity of the bleeding phenotype associated with it."
    explanation: >-
      Source of the 1-in-4-million figure this record's point estimate uses.
- population: Iran
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Markedly commoner where consanguineous marriage is frequent. Iran has the
    highest reported national burden, estimated at roughly twelve times the
    worldwide frequency and concentrated in Sistan and Baluchestan Province. No
    normalized rate is recorded because the cited source reports a fold
    difference and an absolute patient count rather than a population rate, and
    the measure type behind that count is not stated.
  evidence:
  - reference: PMID:25615432
    reference_title: "Factor XIII deficiency in Iran: a comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An approximately 12-fold higher prevalence of FXIIID is estimated in Iran in comparison with overall worldwide frequency."
    explanation: >-
      Quantifies the founder and consanguinity enrichment described in this
      record.
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consanguinity was present in 15 (75%) with 4 children having affected siblings."
    explanation: >-
      A South Indian paediatric series documenting the same consanguinity effect
      outside Iran, supporting the general claim rather than the Iranian figure.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Severe disease requires two F13A1 pathogenic alleles - homozygous or
    compound heterozygous. Single heterozygotes carry roughly half-normal FXIII
    activity and are generally asymptomatic, which is why the carrier state is
    two to three orders of magnitude commoner than the disease. The carrier
    state is not, however, entirely silent: a subset of heterozygotes,
    particularly women, bleed at haemostatic challenges and have pregnancy
    complications, and those individuals are managed on demand rather than with
    prophylaxis. This entry models the severe biallelic disease.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital FXIII deficiency is a rare inherited bleeding disorder that typically follows autosomal recessive inheritance, with an estimated global prevalence of approximately one in two million individuals"
    explanation: >-
      States the recessive inheritance pattern of the congenital disorder.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary prophylaxis is mandatory for all patients with severe FXIII-A deficiency, while those with heterozygous deficiency are generally asymptomatic and may require on-demand therapy during hemostatic challenges, most commonly in women."
    explanation: >-
      Supports both the generally asymptomatic heterozygote state and the
      challenge-dependent exception described here.
  - reference: PMID:12529747
    reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FXIII transglutaminase activity in plasma was reduced to about 50% in mice heterozygous for the mutant allele, and was abolished in homozygous null mice."
    explanation: >-
      Demonstrates the gene-dose relationship - half-normal activity in
      heterozygotes, none in homozygotes - that the recessive pattern rests on.
pathophysiology:
- name: Biallelic F13A1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous pathogenic variants in F13A1 (chromosome
    6p24-p25, 15 exons, encoding the 731-residue catalytic A subunit) are the
    initiating lesion. Roughly 200 variants are described across F13A1 and F13B,
    most of them missense, with large deletions the rarest class; there are no
    mutational hotspots, so confirmation relies on sequencing the whole gene or
    a panel that includes it. Founder alleles dominate in some populations -
    Trp187Arg is the commonest Iranian variant. A-subunit defects account for
    about 95% of congenital FXIII deficiency and produce the more severe
    phenotype, because what is lost is catalytic activity rather than carriage.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    description: >-
      Germline biallelic loss of function. Compound heterozygosity is equally
      common in non-consanguineous families; HOMOZYGOUS is recorded because that
      is the configuration in the consanguineous populations where most
      described patients live, and the functional consequence is the same.
  molecular_functions:
  - preferred_term: factor XIII-A transglutaminase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003810
      label: protein-glutamine gamma-glutamyltransferase activity
  cell_types:
  - preferred_term: resident macrophage (source of plasma FXIII-A)
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: platelet (cellular FXIII-A pool)
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The F13A1 gene (chromosome 6p24–p25; 15 exons) encodes a 731-amino-acid catalytic subunit that contains the transglutaminase core"
    explanation: >-
      Source of the gene's location, exon count and product length as stated in
      this node.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficiency of the FXIII-A subunit is responsible for the majority (~95%) of cases of congenital FXIII deficiency, and typically produces more severe clinical phenotypes due to loss of catalytic activity, whereas FXIII-B subunit defects mainly lower circulating heterotetramer levels by impairing stabilization and carriage."
    explanation: >-
      Gives the 95% share and the mechanistic reason A-subunit disease is more
      severe than B-subunit disease, which is the boundary this entry is drawn
      on.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 200 Mutations have been observed in F13A and F13B genes, with most being missense mutations, while large deletions are the rarest."
    explanation: >-
      Source of the variant count and the missense-dominant spectrum described
      here.
  - reference: PMID:27077776
    reference_title: Diagnosis of factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are no mutational hotspots in FXIII-A and FXIII-B genes with a few recurrent mutations in some populations; therefore, full sequencing of FXIII genes has remained a main molecular approach for confirmation of FXIIID."
    explanation: >-
      Supports the absence of hotspots and the consequent need for full
      sequencing stated in this node.
  - reference: PMID:28596376
    reference_title: "Cre/lox Studies Identify Resident Macrophages as the Major Source of Circulating Coagulation Factor XIII-A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This work suggests that resident macrophages maintain plasma FXIII-A and exclude the platelet lineage as a major contributor."
    explanation: >-
      Identifies the cell that supplies plasma FXIII-A, which is why the
      macrophage is bound on this node rather than the hepatocyte that makes the
      B subunit.
  downstream:
  - target: Absent Plasma Factor XIII Transglutaminase Activity
    causal_link_type: DIRECT
    description: >-
      Loss of both functional A-subunit alleles removes the catalytic half of
      the FXIII-A2B2 heterotetramer, so no activatable transglutaminase reaches
      the circulation.
    evidence:
    - reference: PMID:12529747
      reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Plasma fibrin gamma-dimerization was also indetectable in the homozygous deficient animals, confirming the absence of activatable FXIII."
      explanation: >-
        Targeted disruption of the FXIII-A locus abolishes activatable plasma
        FXIII, which is exactly the edge asserted here.
- name: Absent Plasma Factor XIII Transglutaminase Activity
  biological_scale: MOLECULAR
  description: >-
    Thrombin normally cleaves the activation peptide from each A subunit and
    millimolar calcium then releases the B-subunit dimer, exposing a Cys-His-Asp
    catalytic triad that transfers acyl groups between glutamine donors and
    lysine acceptors to form epsilon-(gamma-glutamyl)lysine isopeptide bonds.
    With no functional A subunit there is no triad and no cross-linking
    chemistry, whatever thrombin does. The consequence branches three ways,
    according to which substrate is no longer cross-linked: fibrin itself,
    alpha-2-antiplasmin, or the extracellular matrix proteins that tie the clot
    to the wound bed.
  molecular_functions:
  - preferred_term: plasma factor XIIIa transglutaminase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003810
      label: protein-glutamine gamma-glutamyltransferase activity
  biological_processes:
  - preferred_term: isopeptide cross-linking of clot proteins
    modifier: DECREASED
    term:
      id: GO:0018149
      label: peptide cross-linking
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FXIIIa performs acyl-transfer between γ-carboxamide groups of glutamine donors and ε-amino groups of lysine acceptors to form ε-(γ-glutamyl)-lysine isopeptide bonds."
    explanation: >-
      States the catalytic chemistry that is absent in this node.
  - reference: PMID:22197181
    reference_title: "Factor XIII, clot structure, thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a zymogen, which becomes transformed into an active transglutaminase (FXIIIa) in the final phase of coagulation cascade by thrombin and Ca(2+)."
    explanation: >-
      Establishes that the activity modelled here is a thrombin- and
      calcium-dependent terminal step of the cascade.
  downstream:
  - target: Failure of Fibrin Gamma- and Alpha-Chain Cross-Linking
    causal_link_type: DIRECT
    description: >-
      Fibrin chains are the best-characterised FXIIIa substrate; with no enzyme,
      gamma-gamma dimerization and alpha-chain multimerization do not occur.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The best characterized substrates are fibrin chains (γ–γ dimerization and α-chain multimerization), which impart tensile strength and viscoelastic stability to the clot."
      explanation: >-
        Names fibrin chains as the substrate whose cross-linking this edge
        removes.
  - target: Failure of Alpha-2-Antiplasmin Ligation to Fibrin
    causal_link_type: DIRECT
    description: >-
      The same enzyme covalently ligates alpha-2-antiplasmin to the fibrin
      alpha-chain, so its absence removes the clot's built-in antifibrinolytic
      shield. This is a separate substrate and a separate consequence from
      fibrin-fibrin cross-linking, not a restatement of it.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FXIIIa also crosslinks antifibrinolytic proteins to fibrin; for α2-antiplasmin, the predominant linkage involves Gln14 of α2-antiplasmin and Lys303 on the fibrin Aα chain, a reaction critical for lysis resistance."
      explanation: >-
        Identifies the specific residues ligated and states that the reaction is
        what confers lysis resistance, which is the edge asserted here.
  - target: Failure of Fibrin Cross-Linking to Extracellular Matrix Proteins
    causal_link_type: DIRECT
    description: >-
      FXIIIa also links fibrin(ogen) to fibronectin and vitronectin, integrating
      the clot with the surrounding matrix. Losing this is what takes the
      disease beyond haemostasis into tissue repair.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Beyond fibrin and α2-antiplasmin, FXIIIa covalently links fibrin(ogen) to multiple extracellular and plasma proteins (most notably fibronectin and vitronectin), thereby strengthening clot-matrix integration, supporting cell adhesion and angiogenesis, and facilitating wound repair."
      explanation: >-
        States the matrix cross-linking reaction whose loss this edge describes.
- name: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
  biological_scale: MOLECULAR
  description: >-
    This node has no upstream cause in this disease, and that is the point:
    every step of haemostasis before cross-linking is normal. Platelet plug
    formation, the intrinsic and extrinsic pathways, thrombin generation, and
    the conversion of fibrinogen to a polymerised fibrin mesh are all
    unaffected, because FXIII acts only on an already-formed clot. Two things
    follow. Clinically, a visually adequate clot does form, and bleeding is
    therefore delayed rather than immediate. Diagnostically, the prothrombin
    time, activated partial thromboplastin time, thrombin time and fibrinogen
    concentration - which interrogate exactly the steps that are intact - are
    all normal, which is why this disease is missed. No modifier is set on the
    bound process term because the claim is that it is unchanged, and
    ModifierEnum has no value for normal.
  biological_processes:
  - preferred_term: thrombin generation and fibrin polymerisation (unaffected)
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "assess thrombin generation and fibrin formation rather than crosslink maturation, FXIII deficiency presents with normal tests of coagulation despite clinically meaningful impairment of clot stability."
    explanation: >-
      States directly that thrombin generation and fibrin formation are intact
      and that this is why the screening tests are normal.
  - reference: PMID:27077776
    reference_title: Diagnosis of factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All routine coagulation tests are normal in FXIII deficiency (FXIIID), which complicates the diagnosis of this disorder."
    explanation: >-
      Independent confirmation that the whole routine screen is normal, from a
      review devoted to the diagnostic problem.
  downstream:
  - target: Mechanically Unstable Fibrin Clot
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A clot is present to be unstable only because polymerisation is intact.
      The relationship is permissive rather than causal of the defect - it
      supplies the substrate on which the missing cross-linking would have
      acted - so it is recorded as indirect with the intermediate steps
      (fibrinogen cleavage, fibrin polymerisation) known. The result is an
      apparently adequate clot that fails later under mechanical or fibrinolytic
      stress.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients may form visually intact clots that fail under physiologic stress or fibrinolytic challenge, yielding delayed hemorrhage and soft tissue and intracranial bleeding."
      explanation: >-
        States that a visually intact clot forms and then fails, which is the
        conjunction of intact polymerisation and absent cross-linking this edge
        records.
- name: Failure of Fibrin Gamma- and Alpha-Chain Cross-Linking
  biological_scale: MOLECULAR
  description: >-
    Without FXIIIa, fibrin gamma-chains are not dimerised and alpha-chains are
    not multimerised into high-molecular-weight polymers. Gamma-chain
    dimerization is the reaction whose product is absent in plasma from FXIII-A
    null animals, and alpha-chain cross-linking is the one that governs whether
    a contracting clot retains red cells. The cross-links are what give fibrin
    tensile strength and viscoelastic stability, so the polymer that forms is
    mechanically inferior rather than absent.
  biological_processes:
  - preferred_term: fibrin gamma- and alpha-chain isopeptide cross-linking
    modifier: DECREASED
    term:
      id: GO:0018149
      label: peptide cross-linking
  evidence:
  - reference: PMID:22197181
    reference_title: "Factor XIII, clot structure, thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FXIII is essential for hemostasis, its deficiency results in severe bleeding diathesis. FXIIIa mechanically stabilizes fibrin by cross-linking its α-, and γ-chains."
    explanation: >-
      States the reaction lost in this node and attributes the mechanical
      stabilisation of fibrin to it.
  - reference: PMID:26324704
    reference_title: "Factor XIIIa-dependent retention of red blood cells in clots is mediated by fibrin α-chain crosslinking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data indicate FXIIIa-dependent retention of RBCs in clots is mediated by fibrin α-chain crosslinking."
    explanation: >-
      Separates the two cross-linking reactions experimentally and shows that
      alpha-chain cross-linking in particular determines clot composition, which
      is why this node names both chains rather than only the gamma-chain.
  downstream:
  - target: Mechanically Unstable Fibrin Clot
    causal_link_type: DIRECT
    description: >-
      The isopeptide bonds between fibrin chains are what confer tensile
      strength and viscoelastic stability; their absence is the direct cause of
      a clot that deforms and disintegrates under load.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The best characterized substrates are fibrin chains (γ–γ dimerization and α-chain multimerization), which impart tensile strength and viscoelastic stability to the clot."
      explanation: >-
        Attributes tensile strength and viscoelastic stability specifically to
        fibrin-chain cross-linking, which is the causal claim of this edge.
- name: Failure of Alpha-2-Antiplasmin Ligation to Fibrin
  biological_scale: MOLECULAR
  description: >-
    FXIIIa normally ligates alpha-2-antiplasmin (alpha-2-plasmin inhibitor) to
    the fibrin Aalpha chain, embedding a plasmin inhibitor inside the clot. In
    its absence the clot carries no covalently bound antifibrinolytic, so
    plasmin generated at its surface is not restrained locally. This is a loss
    of negative regulation of fibrinolysis, not an increase in plasminogen
    activation.
  biological_processes:
  - preferred_term: alpha-2-antiplasmin-dependent protection of fibrin from lysis
    modifier: DECREASED
    term:
      id: GO:0051918
      label: negative regulation of fibrinolysis
  evidence:
  - reference: PMID:22197181
    reference_title: "Factor XIII, clot structure, thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It also protects newly formed fibrin from fibrinolysis, primarily by cross-linking α(2)-plasmin inhibitor to fibrin."
    explanation: >-
      Names alpha-2-plasmin inhibitor cross-linking as the principal
      antifibrinolytic action of FXIIIa, which is what this node removes.
  - reference: PMID:9892598
    reference_title: The contribution of activated factor XIII to fibrinolytic resistance in experimental pulmonary embolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Among groups receiving TPA, selective inhibition of factor XIII-mediated alpha2-antiplasmin-fibrin cross-linking enhanced lysis (group 3 versus 5; P<0.0005)."
    explanation: >-
      Selectively blocking this one reaction, leaving fibrin-fibrin
      cross-linking intact, increases lysis - which isolates the
      alpha-2-antiplasmin arm as an independent contributor.
  downstream:
  - target: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
    causal_link_type: DIRECT
    description: >-
      With no clot-bound plasmin inhibitor, the fibrin mesh is lysed faster than
      the wound can be repaired.
    evidence:
    - reference: PMID:9892598
      reference_title: The contribution of activated factor XIII to fibrinolytic resistance in experimental pulmonary embolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Factor XIIIa-mediated fibrin-fibrin and alpha2-antiplasmin-fibrin cross-linking both caused experimental pulmonary emboli to resist endogenous and TPA-induced fibrinolysis."
      explanation: >-
        Establishes experimentally that loss of these cross-links converts a
        lysis-resistant clot into a lysis-susceptible one.
- name: Failure of Fibrin Cross-Linking to Extracellular Matrix Proteins
  biological_scale: TISSUE
  description: >-
    FXIIIa cross-links fibrin(ogen) to fibronectin, vitronectin and other matrix
    proteins, turning the clot into a provisional scaffold that fibroblasts
    migrate through, keratinocytes re-epithelialise over, and new vessels grow
    into. Losing this is a tissue-repair defect rather than a bleeding defect:
    the provisional matrix is compromised, granulation is delayed, and wounds
    dehisce even when haemostasis looked adequate. The same matrix-stabilising
    requirement applies at the maternal-fetal interface, where cytotrophoblast
    invasion and placentation depend on it.
  biological_processes:
  - preferred_term: FXIIIa-dependent provisional matrix formation in wound repair
    modifier: DECREASED
    term:
      id: GO:0042060
      label: wound healing
  cell_types:
  - preferred_term: fibroblast migrating through the provisional wound matrix
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The impaired wound healing observed in FXIII deficiency reflects multiple mechanisms beyond hemostasis, whereby FXIIIa-mediated crosslinking of fibrin to extracellular matrix proteins creates a stable scaffold essential for fibroblast migration, keratinocyte re-epithelialization, and angiogenesis during tissue repair."
    explanation: >-
      States the matrix-scaffold mechanism and the three cellular processes that
      depend on it, which is the content of this node.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These matrix-level actions help explain soft tissue bleeding, poor wound healing, and umbilical stump bleeding observed in severe congenital FXIII deficiency."
    explanation: >-
      Attributes the wound-healing and soft-tissue phenotypes specifically to
      the matrix-level reactions rather than to clot instability alone.
  downstream:
  - target: Poor wound healing
    causal_link_type: DIRECT
    description: >-
      A compromised provisional matrix delays granulation tissue formation and
      predisposes to dehiscence independently of whether bleeding was
      controlled.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss of these matrix-stabilizing functions compromises the provisional wound matrix, delays granulation tissue formation, and increases susceptibility to wound dehiscence even when primary hemostasis appears adequate."
      explanation: >-
        States the causal step from lost matrix cross-linking to impaired wound
        repair, and explicitly separates it from haemostatic adequacy.
  - target: Recurrent pregnancy loss
    causal_link_type: DIRECT
    description: >-
      The same FXIII-dependent matrix stabilisation is required for
      cytotrophoblast invasion and placental implantation, so first-trimester
      loss has a matrix component in addition to a haemostatic one.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals with childbearing potential with severe FXIII deficiency face reproductive challenges, including frequent first trimester pregnancy loss without prophylaxis; the biology represents both impaired hemostasis at the maternal-fetal interface and defective FXIII-dependent stabilization of the extracellular matrix required for successful cytotrophoblast invasion and placental implantation."
      explanation: >-
        Names both contributing mechanisms and attaches the matrix one to
        cytotrophoblast invasion and implantation, which is this edge.
- name: Mechanically Unstable Fibrin Clot
  biological_scale: TISSUE
  description: >-
    A clot that is present, visually adequate and mechanically inferior. Without
    fibrin-chain cross-links it has reduced tensile strength and viscoelastic
    stability, loses red cells during contraction, and fails under physiological
    load. Thromboelastography in FXIII-A null mice shows the defect directly and
    shows that it is corrected dose-dependently by replacing the missing
    protein. Note that standard viscoelastic testing in humans is insensitive to
    isolated FXIII deficiency, so the node is better supported by the animal and
    biochemical data than by bedside viscoelastometry.
  biological_processes:
  - preferred_term: fibrin clot mechanical stabilisation
    modifier: DECREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  evidence:
  - reference: PMID:12529747
    reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thrombelastography (TEG) experiments demonstrated impaired clot stabilization in FXIII-A mutant mice, replacement with human FXIII led to dose-dependent TEG normalization."
    explanation: >-
      Measures the mechanical instability of the clot in an A-subunit null
      animal and shows it is reversed by FXIII replacement.
  - reference: PMID:26324704
    reference_title: "Factor XIIIa-dependent retention of red blood cells in clots is mediated by fibrin α-chain crosslinking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Real-time microscopy revealed extensive RBC loss from clots formed in the absence of FXIIIa activity, and RBCs exhibited transient deformation as they exited the clots."
    explanation: >-
      Direct microscopic observation of a clot losing its cellular content when
      FXIIIa activity is absent, which is the mechanical failure this node
      describes. The quote is trimmed of the paper's bracketed abbreviation
      span, which the reference validator strips before matching.
  downstream:
  - target: Delayed Bleeding After Apparently Adequate Initial Hemostasis
    causal_link_type: DIRECT
    description: >-
      Initial haemostasis succeeds; the clot then gives way, so the bleeding
      appears hours to days after the injury rather than at the time of it.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients may form visually intact clots that fail under physiologic stress or fibrinolytic challenge, yielding delayed hemorrhage and soft tissue and intracranial bleeding."
      explanation: >-
        States the step from clot failure under stress to delayed haemorrhage,
        which is this edge.
- name: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
  biological_scale: TISSUE
  description: >-
    The second arm of the defect, and mechanistically separate from mechanical
    weakness: the clot is actively digested sooner because it lacks the
    covalently bound alpha-2-antiplasmin that would have restrained plasmin
    locally. In a ferret embolism model, blocking FXIIIa activity alone raised
    endogenous lysis from about 14% to about 43% - comparable to giving tissue
    plasminogen activator - which is the scale of protection the cross-links
    normally provide.
  biological_processes:
  - preferred_term: plasmin-mediated dissolution of the haemostatic clot
    modifier: INCREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  evidence:
  - reference: PMID:9892598
    reference_title: The contribution of activated factor XIII to fibrinolytic resistance in experimental pulmonary embolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of factor XIIIa activity increased endogenous lysis markedly (group 1 versus 2; P<0.0001), to a level comparable to that achieved with TPA (group 2 versus 3; P<0.05)."
    explanation: >-
      Quantifies the accelerated lysis that follows loss of FXIIIa activity,
      which is the claim of this node.
  downstream:
  - target: Delayed Bleeding After Apparently Adequate Initial Hemostasis
    causal_link_type: DIRECT
    description: >-
      Premature lysis reopens a wound that had stopped bleeding, producing the
      same delayed pattern by a different route from mechanical failure.
- name: Delayed Bleeding After Apparently Adequate Initial Hemostasis
  biological_scale: ORGANISM
  description: >-
    The clinical convergence point of both arms. Bleeding is characteristically
    delayed and out of proportion to the injury, because the failure is of clot
    persistence rather than of clot formation. The pattern is what generates
    every phenotype in this entry - umbilical stump bleeding days to weeks after
    cord separation, post-circumcision bleeding, deep soft-tissue haematoma, and
    spontaneous intracranial haemorrhage. It is also why the bleeding history
    rather than the coagulation screen is the diagnostic trigger.
  biological_processes:
  - preferred_term: haemostasis
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding that is delayed or out of proportion to the clinical context with normal PT, aPTT, thrombin time, and fibrinogen should evoke suspicion for FXIII deficiency"
    explanation: >-
      Defines the delayed, disproportionate bleeding pattern with a normal
      screen that this node names.
  - reference: PMID:22197181
    reference_title: "Factor XIII, clot structure, thrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FXIII is essential for hemostasis, its deficiency results in severe bleeding diathesis."
    explanation: >-
      Establishes that FXIII deficiency produces a bleeding diathesis, the
      organism-level state this node records.
  downstream:
  - target: Abnormal umbilical stump bleeding
    causal_link_type: DIRECT
    description: >-
      The separating cord is a wound whose clot must persist for days; it is the
      first place a stabilisation defect shows.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A characteristic neonatal presentation is delayed umbilical stump bleeding, which occurs days to weeks after cord separation in approximately 70-80% of symptomatic cases and serves as an important sentinel feature."
      explanation: >-
        States both the delayed timing and the frequency, tying the phenotype to
        the delayed-bleeding mechanism.
  - target: Intracranial hemorrhage
    causal_link_type: DIRECT
    description: >-
      The most consequential destination of the same mechanism; spontaneous or
      after minor trauma, and typically in early childhood.
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most serious complication is life-threatening intracranial hemorrhage—either spontaneous or following minor trauma—which occurs in up to 30% of untreated patients, often during early childhood."
      explanation: >-
        Gives the frequency and the trigger pattern of the intracranial
        haemorrhage this edge produces.
  - target: Subcutaneous hemorrhage
    causal_link_type: DIRECT
    description: >-
      Soft-tissue bleeding into the subcutis, where a clot that forms and then
      gives way produces a haematoma rather than immediate external bleeding.
      Left uncited: the sources reviewed establish that patients with this
      disease bleed here, which is a node-level claim already carried on the
      phenotype record, not a statement that this step follows from the
      delayed-bleeding state.
  - target: Intramuscular hematoma
    causal_link_type: DIRECT
    description: >-
      The same step reaching a deeper compartment, where the volume of
      accumulated blood is larger because muscle offers less tamponade. Left
      uncited for the same reason as the subcutaneous edge.
  - target: Epistaxis
    causal_link_type: DIRECT
    description: >-
      The mucosal instance of the same step: nasal mucosa bleeds readily, stops,
      and then rebleeds because the clot is not stabilised. Left uncited for the
      same reason.
  - target: Menorrhagia
    causal_link_type: DIRECT
    description: >-
      Endometrial bleeding at menstruation, where haemostasis depends on clot
      persistence over days rather than on a single plug. Left uncited for the
      same reason.
  - target: Joint hemorrhage
    causal_link_type: DIRECT
    description: >-
      Haemarthrosis is an uncommon but real destination of the same mechanism,
      which is why it is connected here rather than left as an unlinked
      phenotype.
    evidence:
    - reference: PMID:37314674
      reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical symptomatology ranged from mucosal bleeds to intracranial bleeds and hemarthrosis, with many children having a history of prolonged umbilical bleeding in their neonatal period."
      explanation: >-
        Documents haemarthrosis within the bleeding spectrum of a real
        paediatric cohort with this disease.
  - target: Prolonged bleeding following circumcision
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41583548
      reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In male infants, post-circumcision bleeding is a recognized early presentation that may provide the first diagnostic clue."
      explanation: >-
        Names post-circumcision bleeding as an early consequence of the bleeding
        tendency this node describes.
phenotypes:
- name: Abnormal umbilical stump bleeding
  category: Hematologic
  frequency: VERY_FREQUENT
  description: >-
    The classic presenting sign and the single most useful clue in the newborn:
    bleeding from the umbilical stump appearing days to weeks after cord
    separation rather than at the time of it, reported in roughly 70-80% of
    symptomatic cases. The delay is mechanistically informative - an immediate
    cord bleed points elsewhere; a late one points here (or to afibrinogenaemia).
  phenotype_term:
    preferred_term: Delayed umbilical stump bleeding
    term:
      id: HP:0011884
      label: Abnormal umbilical stump bleeding
    temporality: PROLONGED
    onset:
      onset_category: NEONATAL
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A characteristic neonatal presentation is delayed umbilical stump bleeding, which occurs days to weeks after cord separation in approximately 70-80% of symptomatic cases and serves as an important sentinel feature."
    explanation: >-
      Source of both the delayed timing and the 70-80% frequency supporting the
      VERY_FREQUENT band.
  - reference: PMID:25615432
    reference_title: "Factor XIII deficiency in Iran: a comprehensive review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among Iranian patients, umbilical cord bleeding, hematoma, and prolonged wound bleeding are the most frequent clinical manifestations."
    explanation: >-
      Confirms umbilical cord bleeding as the most frequent manifestation in the
      largest national patient population described.
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical symptomatology ranged from mucosal bleeds to intracranial bleeds and hemarthrosis, with many children having a history of prolonged umbilical bleeding in their neonatal period."
    explanation: >-
      An independent paediatric series reporting prolonged umbilical bleeding in
      the neonatal period in many of its children.
- name: Intracranial hemorrhage
  category: Neurologic
  frequency: FREQUENT
  description: >-
    The most serious complication of this disease, a principal contributor to
    its mortality and lasting disability, and the clinical fact that justifies
    lifelong prophylaxis in a disorder whose day-to-day bleeding is often
    unimpressive. It occurs spontaneously or after minor trauma in up
    to 30% of untreated patients, usually in early childhood, and in a
    significant fraction of children it is the presenting event - before anyone
    knows the diagnosis. In a 38-patient Iranian series the bleed was
    intraparenchymal in 92% and left neurological sequelae in 55%: locomotor
    disability, psychological and mental impairment, speech and visual loss.
    FREQUENT rather than VERY_FREQUENT because the cited figure is an upper
    bound in untreated patients.
  phenotype_term:
    preferred_term: Spontaneous intracranial hemorrhage
    term:
      id: HP:0002170
      label: Intracranial hemorrhage
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most serious complication is life-threatening intracranial hemorrhage—either spontaneous or following minor trauma—which occurs in up to 30% of untreated patients, often during early childhood."
    explanation: >-
      Source of the frequency, the trigger pattern and the childhood onset
      recorded here.
  - reference: PMID:24149912
    reference_title: Intracranial hemorrhage pattern in the patients with factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The site of ICH was intraparenchymal in 35 patients (92.1 %), subdural in 2 patients (5.2 %), and epidural hemorrhage in 1 patient (2.6 %)."
    explanation: >-
      Source of the predominantly intraparenchymal distribution described in
      this phenotype.
  - reference: PMID:24149912
    reference_title: Intracranial hemorrhage pattern in the patients with factor XIII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides, neurologic complications occurred in 21 patients (55.2 %), including locomotor disability in 8, psychological impairment in 7, mental disorders in 5, speech impairment in 4, and visual impairment in 2."
    explanation: >-
      Quantifies the permanent neurological sequelae, which is the reason this
      phenotype and not the bleeding frequency drives management.
  - reference: PMID:37314674
    reference_title: Clinical Profile of Congenital Factor XIII Deficiency in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a propensity for intracranial bleeding with a significant number having this at first presentation."
    explanation: >-
      Supports the statement that intracranial haemorrhage is frequently the
      presenting event in children, before diagnosis.
- name: Subcutaneous hemorrhage
  category: Dermatologic
  frequency: FREQUENT
  description: >-
    Delayed subcutaneous bleeding and bruising, part of the soft-tissue bleeding
    pattern that follows the neonatal period.
  phenotype_term:
    preferred_term: Subcutaneous hematoma
    term:
      id: HP:0001933
      label: Subcutaneous hemorrhage
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beyond the neonatal period, patients with congenital FXIII deficiency commonly experience recurrent mucocutaneous hemorrhage (epistaxis, menorrhagia, oral bleeding), soft-tissue bleeding (e.g., subcutaneous and intramuscular hematomas), and impaired wound repair with dehiscence; abnormal scar formation, including keloids, has been reported in some cases."
    explanation: >-
      Names subcutaneous haematoma among the commonly experienced soft-tissue
      bleeds, supporting both the phenotype and the FREQUENT band.
  - reference: PMID:12529747
    reference_title: "Targeted inactivation of the mouse locus encoding coagulation factor XIII-A: hemostatic abnormalities in mutant mice and characterization of the coagulation deficit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bleeding episodes, hematothorax, hematoperitoneum and subcutaneous hemorrhage in mutant mice were associated with reduced survival."
    explanation: >-
      The A-subunit null mouse reproduces subcutaneous haemorrhage, supporting
      the phenotype as a direct consequence of the same lesion.

name: Myoclonic Epilepsy in Infancy
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A rare epilepsy of the first three years of life in which an otherwise normal
  baby begins to have brief myoclonic jerks: a sudden nod of the head, a shrug,
  the arms flinging upward and outward, over in a second or less. Development up
  to that point has been normal, the head is a normal size, the examination is
  normal, and the only abnormality is a burst of generalized spike-wave on the
  electroencephalogram locked to each jerk. The seizures usually respond to
  valproate and usually stop, which is why the syndrome carried the word
  "benign" for forty years. That word has since been removed, and for a reason
  that is the whole interest of the entry: seizure freedom and good outcome turn
  out not to be the same thing here. About a third of children followed long
  enough have cognitive difficulty, in a syndrome named for not causing any. A
  subset of infants have jerks provoked reliably by a sudden touch or noise
  rather than occurring spontaneously, and whether those children have the same
  disease is still argued.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - MEI
  - benign myoclonic epilepsy of infancy
  - benign myoclonic epilepsy in infancy
  - BMEI
  - myoclonic epilepsy of infancy
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        An ILAE-recognized self-limited epilepsy syndrome with onset in infancy,
        diagnosed and managed neurologically.

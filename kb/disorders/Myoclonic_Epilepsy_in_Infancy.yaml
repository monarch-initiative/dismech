      term:
        id: HP:0002123
        label: Generalized myoclonic seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy, classified among the generalised
          idiopathic epilepsies, is characterised by the occurrence of myoclonic
          seizures in the first three years of life in otherwise normal infants.
        explanation: >-
          The myoclonic seizure is the characterising feature of the syndrome,
          which supports a very frequent band by definition of the diagnosis.
  - category: Neurological
    name: Reflex Myoclonic Seizures
    description: >-
      In a subset, jerks elicited reliably by sudden unexpected tactile or
      acoustic stimulation rather than occurring spontaneously.
    phenotype_term:

        explanation: >-
          One third of children with long-term follow-up is 33 percent, which
          falls in the FREQUENT band rather than OCCASIONAL. The band and the
          term are both taken directly from this sentence: it says cognitive
          problems, and it says one-third.
prevalence:
  - population: Infants with epilepsy
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      Just over 100 cases had been reported in the four decades between the first
      syndromic description in 1981 and this review, of which 23 were the
      disputed reflex subset. No population-based rate exists. The measure_type is
      CASES_IN_LITERATURE because a cumulative published case count is what the
      literature offers, and the prevalence_class is the qualitative ULTRA_RARE
      tier because a case count cannot be converted into a rate.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy is a rare syndrome with just over
          100 cases reported since the first syndromic description by Dravet and
          Bureau
        explanation: >-
          Gives the cumulative published case count and dates it from the original
          syndromic description.
progression:
  - phase: Onset of myoclonic seizures in an otherwise normal infant
    age_range: First three years of life
    notes: >-
      Onset in a child whose development, head size and examination have been
      normal. The myoclonic seizure is the only seizure type, and its appearance
      in an otherwise well infant is the presentation.
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy, classified among the generalised
          idiopathic epilepsies, is characterised by the occurrence of myoclonic
          seizures in the first three years of life in otherwise normal infants.
        explanation: >-
          Gives both the age window and the normal premorbid state that define
          this phase.
  - phase: Evolution to another epilepsy in a minority
    age_range: Later childhood, years after remission
    notes: >-
      A minority of children go on to develop a different epilepsy after this one
      has remitted, usually another idiopathic generalized epilepsy. This
      complicates the self-limited framing: what remits may be the infantile
      expression of a generalized epilepsy tendency rather than the tendency
      itself. A polygraphically documented case followed the syndrome into
      childhood absence epilepsy at six years and eight months, which the authors
      read as evidence of a shared neurobiological and genetic link between
      age-related epileptic phenotypes.
    evidence:
      - reference: PMID:21752671
        reference_title: >-
          Benign myoclonic epilepsy in infancy followed by childhood absence
          epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Recently, it has been shown that a few patients with BMEI later had
          other epilepsy types mainly IGE but never childhood absence epilepsy
          (CAE).
        explanation: >-
          Establishes that evolution to another epilepsy happens in a minority
          and that it is usually another idiopathic generalized epilepsy. Note
          that the same sentence asserts absence epilepsy had never been seen,
          which is precisely what the case reported in this paper overturned.
      - reference: PMID:21752671
        reference_title: >-
          Benign myoclonic epilepsy in infancy followed by childhood absence
          epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This finding suggests a common neurobiological and genetic link between
          different age-related epileptic phenotypes.
        explanation: >-
          The authors' mechanistic reading of the evolution, which is what makes
          this a pathophysiologically interesting phase rather than an incidental
          outcome statistic.
  - phase: Seizure remission, with development still to be watched
    age_range: Childhood, after several years of follow-up
    notes: >-
      Seizures remit and long-term seizure freedom is the expected outcome, but
      the developmental trajectory is not settled at the same time. The literature
      is explicit that follow-up should continue for years after diagnosis rather
      than ending when the seizures stop, which is an unusual recommendation for a
      self-limited epilepsy and follows directly from the cognitive findings.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Clinicians should distinguish the syndrome of reflex myoclonic epilepsy
          in infancy from benign myoclonic epilepsy of infancy and all patients
          should continue developmental follow up for several years after
          diagnosis.
        explanation: >-
          States the recommendation for prolonged developmental follow-up, which
          is what this phase is about.
treatments:
  - name: Sodium Valproate
    description: >-
      The most effective medication for the myoclonic seizures of this syndrome,
      and the drug against which the good seizure prognosis is reported. Its
      effect on the developmental outcome is unknown, and given that valproate
      has its own neurodevelopmental considerations in young children, that gap
      is not merely academic.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
    target_mechanisms:
      - target: Generalized Epileptiform Discharge Time-Locked to the Jerk
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Prognosis in respect of long term seizure freedom is good with sodium
          valproate being the most effective medication.
        explanation: >-
          Names sodium valproate as the most effective medication and ties it to
          the favourable seizure prognosis.
  - name: Prolonged Developmental Follow-Up
    description: >-
      Not a treatment of the seizures but of the actual morbidity of the
      syndrome. Because a third of children have cognitive difficulty that is not
      apparent when the seizures stop, structured developmental surveillance for
      years after diagnosis is what converts an early diagnosis into a useful
      one. Recording it as a treatment rather than as advice is deliberate: it is
      the intervention that acts on the outcome this syndrome actually threatens.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Persisting Cognitive and Behavioural Difficulty in a Minority
        treatment_effect: MODULATES
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Clinicians should distinguish the syndrome of reflex myoclonic epilepsy
          in infancy from benign myoclonic epilepsy of infancy and all patients
          should continue developmental follow up for several years after
          diagnosis.
        explanation: >-
          A direct recommendation for prolonged developmental follow-up in all
          patients, which is what this record asserts.
diagnosis:
  - name: Video-Electroencephalography with Myoclonus Time-Locking
    description: >-
      The diagnostic investigation. What is sought is not merely an abnormal
      recording but the demonstration that the jerk and the discharge are the
      same event, which is what separates this syndrome from the non-epileptic
      myoclonias of infancy. Where a reflex presentation is suspected, the
      recording includes controlled tactile and acoustic stimulation.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We reviewed all published articles and case reports on RMEI in order to
          clarify clinical and electroencephalographic findings, with particular
          attention to outcome and treatment.
        explanation: >-
          Establishes that electroencephalographic findings are central to
          delineating the syndrome.
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This rare clinical entity is often under-described and under-diagnosed,
          and for this reason should be brought to the attention of paediatricians
          in order to avoid extensive investigations and reassure parents of the
          lack of long-term complications.
        explanation: >-
          States the practical purpose of making the diagnosis: recognizing the
          reflex entity avoids an unnecessary investigative cascade.
differential_diagnoses:
  - name: Dravet Syndrome
    disease_term:
      preferred_term: Dravet syndrome
      term:
        id: MONDO:0100135
        label: Dravet syndrome
    description: >-
      The differential that matters most, because both begin in infancy with
      seizures in a previously normal child and both involve myoclonus, but the
      trajectories diverge completely. Getting this wrong in either direction has
      consequences: sodium channel blockers worsen Dravet, and a family told
      their child has a self-limited epilepsy when they do not has been badly
      misinformed.
    distinguishing_features:
      - Onset in Dravet is typically with prolonged, often hemiclonic, fever-provoked seizures rather than with brief myoclonic jerks.
      - Multiple seizure types appear over time in Dravet; the myoclonic seizure is the only type in this syndrome.
      - Development arrests or regresses in the second year in Dravet rather than remaining normal.
      - SCN1A mutation is found in the majority of Dravet and is not a feature of this syndrome.
    evidence:
      - reference: PMID:35503712
        reference_title: >-
          ILAE classification and definition of epilepsy syndromes with onset in
          neonates and infants: Position statement by the ILAE Task Force on
          Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Syndromes are separated into self-limited syndromes, where there is
          likely to be spontaneous remission and developmental and epileptic
          encephalopathies, diseases where there is developmental impairment
          related to both the underlying etiology independent of epileptiform
          activity and the epileptic encephalopathy.
        explanation: >-
          Establishes the categorical separation these two syndromes fall on
          either side of, which is the axis the differential turns on.
  - name: Infantile Epileptic Spasms Syndrome
    disease_term:
      preferred_term: infantile spasms
      term:
        id: MONDO:0018097
        label: infantile spasms
    description: >-
      The other clustering infantile seizure that gets confused with myoclonic
      jerks. Spasms are slower and more sustained than a myoclonic jerk, come in
      long runs particularly on waking, and carry a developmental prognosis that
      is the opposite of this syndrome's.
    distinguishing_features:
      - The spasm is a sustained tonic contraction over one to two seconds rather than a sub-second jerk.
      - Spasms cluster in long series, characteristically on waking.
      - Hypsarrhythmia on the interictal recording rather than a normal background with brief generalized bursts.
      - Developmental arrest or regression accompanies the seizures.
    evidence:
      - reference: PMID:35503712
        reference_title: >-
          ILAE classification and definition of epilepsy syndromes with onset in
          neonates and infants: Position statement by the ILAE Task Force on
          Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Syndromes are separated into self-limited syndromes, where there is
          likely to be spontaneous remission and developmental and epileptic
          encephalopathies, diseases where there is developmental impairment
          related to both the underlying etiology independent of epileptiform
          activity and the epileptic encephalopathy.
        explanation: >-
          Places the two syndromes in the two different categories of the
          infantile classification, which is the substance of this differential.
  - name: Epilepsy with Myoclonic-Atonic Seizures
    disease_term:
      preferred_term: epilepsy with myoclonic atonic seizures
      term:
        id: MONDO:0014633
        label: epilepsy with myoclonic atonic seizures
    description: >-
      Doose syndrome, which also features myoclonus in a previously normal child
      but begins later and adds the atonic component that gives it its drop
      attacks and its worse prognosis.
    distinguishing_features:
      - Onset is typically after the third year rather than within it.
      - The defining seizure is myoclonic-atonic, with a loss of tone producing a fall, rather than a pure jerk.
      - Multiple seizure types including absences and generalized tonic-clonic seizures.
      - Outcome is variable and includes drug-resistant epilepsy with cognitive impairment.
    evidence:
      - reference: PMID:35503712
        reference_title: >-
          ILAE classification and definition of epilepsy syndromes with onset in
          neonates and infants: Position statement by the ILAE Task Force on
          Nosology and Definitions.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Syndromes are separated into self-limited syndromes, where there is
          likely to be spontaneous remission and developmental and epileptic
          encephalopathies, diseases where there is developmental impairment
          related to both the underlying etiology independent of epileptiform
          activity and the epileptic encephalopathy.
        explanation: >-
          Gives the categorical axis on which these two syndromes are separated.
          Marked PARTIAL because the abstract states the framework rather than
          assigning Doose syndrome to a category, and the distinguishing_features
          above carry the specific separation.
  - name: Benign Non-Epileptic Myoclonus of Infancy
    description: >-
      Shuddering attacks, benign myoclonus of early infancy, and the other
      non-epileptic paroxysmal movements of the first year, which can look
      identical to a myoclonic seizure at the bedside and in a parent's video.
      The separation is made on the recording, not on the appearance. No MONDO
      disease_term is bound because this names a family of non-epileptic
      paroxysmal events rather than a single entity.
    distinguishing_features:
      - No electroencephalographic correlate; the jerk is not time-locked to any discharge.
      - Events occur during wakefulness and characteristically stop in sleep.
      - No progression to other seizure types and no need for antiseizure medication.
      - Resolution is usually within the first two years without treatment.
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This rare clinical entity is often under-described and under-diagnosed,
          and for this reason should be brought to the attention of paediatricians
          in order to avoid extensive investigations and reassure parents of the
          lack of long-term complications.
        explanation: >-
          Supports that recognition of the entity is a diagnostic problem in
          infancy and that misrecognition leads to unnecessary investigation.
          Marked PARTIAL because the source addresses under-diagnosis of the
          epilepsy rather than enumerating the non-epileptic mimics.
discussions:
  - discussion_id: mei_benign_label_and_cognitive_outcome
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      If about a third of children have lasting cognitive difficulty, what
      produces it, and is it the seizures, the substrate that generated them, or
      the treatment used to stop them?
    attaches_to:
      - "pathophysiology#Persisting Cognitive and Behavioural Difficulty in a Minority"
    rationale: >-
      For forty years this syndrome was called benign, and the seizure data
      support that: they respond to valproate and they stop. The developmental
      data do not. Roughly a third of children with long-term follow-up have
      cognitive problems, in children whose development was normal before onset
      and whose seizures remitted. The 2022 ILAE nosology removed benign from the
      syndrome names generally, and here the removal has content rather than
      being a matter of tone. What is not settled is the mechanism. Three
      explanations are available and they are not mutually exclusive. The
      seizures or the interictal discharges may themselves interfere with
      development during a sensitive window, in which case earlier and more
      complete seizure control should improve outcome. The cognitive difficulty
      may be a second expression of whatever substrate produces the seizures, in
      which case controlling seizures will not change it and the outcome is set
      before treatment begins. Or the treatment may contribute, which is not an
      idle worry given that the most effective drug in this syndrome is valproate
      and that valproate has recognized neurodevelopmental considerations in very
      young children. These make sharply different predictions and none has been
      tested against the others, largely because the syndrome is rare enough that
      the whole literature is a hundred-odd cases.
    proposed_experiments:
      - experiment_id: mei_seizure_burden_versus_outcome
        name: Seizure and discharge burden against developmental outcome
        description: >-
          A prospective multicentre cohort with quantified seizure counts and
          interictal discharge burden from serial recordings during the active
          phase, and standardized developmental assessment at school age, testing
          whether burden during infancy predicts outcome once age at onset and
          treatment are accounted for.
        decision_criterion: >-
          A dose-response relationship between seizure or discharge burden and
          later cognitive score would support the seizures interfering with
          development. Absence of any relationship would point to a shared
          substrate or to treatment.
      - experiment_id: mei_valproate_versus_alternative_outcome
        name: Developmental outcome by treatment received
        description: >-
          Comparison of developmental outcome between children treated with
          valproate and those treated with an alternative agent or untreated,
          drawn from a multicentre registry, with adjustment for seizure burden
          and age at onset. Randomization is not realistic at this syndrome's
          case numbers, so this is explicitly an observational design with the
          confounding-by-indication limitation stated.
        decision_criterion: >-
          Worse outcome in valproate-treated children after adjustment for
          seizure burden would raise treatment contribution as a real
          possibility. Equivalent outcomes across treatments would largely
          exclude it.
      - experiment_id: mei_premorbid_and_familial_markers
        name: Premorbid and familial markers of the cognitive subgroup
        description: >-
          Testing whether the third of children with cognitive difficulty are
          identifiable before or at onset by family history, subtle premorbid
          developmental measures, or genetic findings, rather than only in
          retrospect.
        decision_criterion: >-
          Identification of a premorbid or familial marker would support the
          shared-substrate explanation and would make the subgroup prospectively
          identifiable. No such marker would leave the seizure and treatment
          explanations in play.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, the cognitive outcome is much less certain with cognitive
          problems present in one-third of children who have long term follow up.
        explanation: >-
          The finding the controversy is about, and the contrast with the
          favourable seizure prognosis reported in the preceding sentence of the
          same abstract.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Prognosis in respect of long term seizure freedom is good with sodium
          valproate being the most effective medication.
        explanation: >-
          Establishes both halves of the tension: the seizures do well, and the
          drug they do well on is the one whose developmental profile the third
          explanation implicates.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The term benign may be appropriately used to describe the myoclonic
          seizures but must be used cautiously when counselling families about
          cognitive outcome.
        explanation: >-
          The authors' own resolution, which separates the two prognoses rather
          than reconciling them, and which the 2022 renaming subsequently
          endorsed.
  - discussion_id: mei_reflex_variant_separate_syndrome
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is reflex myoclonic epilepsy in infancy a variant of this syndrome or a
      separate entity, and does the uniformly normal cognitive outcome of the
      reflex group settle it?
    attaches_to:
      - "pathophysiology#Reflex Sensitivity to Tactile and Acoustic Stimuli in a Subset"
    rationale: >-
      Twenty-three of the just-over-hundred reported cases had seizures elicited
      by sudden touch or noise rather than occurring spontaneously, and their
      inclusion in the syndrome is described in the literature as debatable in
      those words. Two things pull in opposite directions. Against separation:
      the seizure type is the same myoclonic jerk, the age window is the same,
      the electroencephalographic picture is described as the same, and dividing
      a hundred-case literature into two fifty-case literatures makes both harder
      to study. For separation: the cognitive outcome differs, and it differs in
      exactly the place where this syndrome's real morbidity lives. Every
      reported reflex case has been developmentally normal, against a third of
      the syndrome as a whole having cognitive difficulty. If that difference is
      real rather than an artefact of small numbers and shorter follow-up, the
      reflex group is not a variant but a genuinely better-prognosis entity, and
      one review explicitly recommends that clinicians distinguish them. The
      curation consequence is concrete: this entry currently models the reflex
      presentation as a node within the syndrome, and if the separation is
      confirmed it should become its own entry.
    proposed_experiments:
      - experiment_id: mei_reflex_matched_followup
        name: Matched-duration follow-up of reflex and spontaneous groups
        description: >-
          Pooled reanalysis of reported cases with developmental outcome censored
          at equal follow-up duration in both groups, testing whether the reflex
          group's uniformly normal outcome survives matching, or whether it
          reflects shorter follow-up in a group that presents more benignly and
          is discharged earlier.
        decision_criterion: >-
          A persisting outcome difference at matched follow-up supports genuine
          separation. Convergence of outcomes once follow-up is equalized would
          indicate the difference was an ascertainment artefact.
      - experiment_id: mei_reflex_electrophysiological_signature
        name: Electrophysiological comparison of reflex and spontaneous jerks
        description: >-
          Direct comparison of discharge morphology, the latency from stimulus to
          jerk in the reflex group, and any somatosensory or auditory evoked
          response abnormality, against age-matched children with the spontaneous
          form.
        decision_criterion: >-
          A reproducible electrophysiological difference, particularly an evoked
          response abnormality present only in the reflex group, would support
          two mechanisms. Indistinguishable physiology would support one syndrome
          with a triggered presentation.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This includes 23 infants with reflex myoclonic epilepsy whose inclusion
          in the wider syndrome remains debatable.
        explanation: >-
          States the dispute directly, and gives the size of the disputed group
          against the whole reported literature.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The cognitive outcome in reflex myoclonic epilepsy of infancy is normal
          in all reported cases.
        explanation: >-
          The main empirical argument for separation, and the reason the question
          is not merely nosological.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Clinicians should distinguish the syndrome of reflex myoclonic epilepsy
          in infancy from benign myoclonic epilepsy of infancy and all patients
          should continue developmental follow up for several years after
          diagnosis.
        explanation: >-
          An explicit recommendation to distinguish the two, which is the
          strongest statement in the cited literature in favour of separation.
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          RMEI appears to be a benign variant of idiopathic myoclonic epilepsy in
          infancy with specific features that occur in neurologically and
          developmentally normal children.
        explanation: >-
          The opposing position, from a review devoted to the reflex entity: it
          calls RMEI a variant rather than a separate syndrome, while still
          crediting it with specific features. Marked PARTIAL because it supports
          the variant reading rather than the separation this discussion is
          weighing.
  - discussion_id: mei_genetic_basis_unknown
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      What are the genetic mechanisms underlying myoclonic epilepsy in infancy,
      and is the syndrome's clinical heterogeneity the surface of genuine genetic
      heterogeneity?
    attaches_to:
      - "pathophysiology#Age-Restricted Generalized Cortical Hyperexcitability of Infancy"
    rationale: >-
      This entry carries no genetic section and the omission is deliberate. The
      literature reads the syndrome as genetic on the strength of its clinical
      shape rather than on mapping evidence, and it goes a step further, taking
      the heterogeneity of the presentation as a hint that several different
      genetic mechanisms converge on the same picture. That is a testable claim
      and nobody has tested it. The obstacle is arithmetic: just over a hundred
      cases in four decades means no single centre has a cohort, and the reflex
      dispute would split even that. The consequence for this knowledge base is
      that borrowing candidate genes from adjacent infantile myoclonic epilepsies
      would be inventing content, and the gap is recorded here instead. It also
      connects to the other two discussions: if the cognitive subgroup and the
      reflex subgroup have distinct genetic bases, both of those disputes resolve
      at once.
    proposed_experiments:
      - experiment_id: mei_multicentre_sequencing
        name: Multicentre sequencing cohort with phenotype stratification
        description: >-
          Trio exome or genome sequencing of an internationally aggregated cohort
          recruited on current ILAE criteria, stratified at entry by reflex versus
          spontaneous presentation and followed for developmental outcome, so
          that any genetic findings can be tested against both open sub-questions
          rather than only against the diagnosis.
        decision_criterion: >-
          Recurrent variants in one or more genes would establish a genetic
          basis; finding different genes segregating with the reflex and
          spontaneous groups, or with the cognitive outcome, would resolve those
          disputes directly. A null result at adequate power would support
          polygenic susceptibility.
      - experiment_id: mei_family_aggregation_study
        name: Family aggregation and febrile seizure history
        description: >-
          Systematic ascertainment of family history of epilepsy and febrile
          seizures in a multicentre cohort against matched controls, to quantify
          familial aggregation before any molecular work, which is feasible at
          this syndrome's numbers where sequencing cohorts are not.
        decision_criterion: >-
          Significant familial aggregation would justify the sequencing
          investment and would constrain the plausible architecture. Aggregation
          no greater than background would weaken the genetic presumption the
          field currently holds.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The clinical heterogeneity within this syndrome suggests that there may
          be a variety of genetic mechanisms that underlie the presentation.
        explanation: >-
          The hypothesis this gap is about, stated as a suggestion drawn from
          clinical observation rather than from any molecular finding.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy is a rare syndrome with just over
          100 cases reported since the first syndromic description by Dravet and
          Bureau
        explanation: >-
          Quantifies the obstacle: a four-decade literature of about a hundred
          cases is why no adequately powered genetic study exists, which is the
          reason the proposed experiments are multicentre and aggregated.

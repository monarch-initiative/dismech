notes: >-
  Naming, and why it changed. The syndrome was described by Dravet and Bureau in
  1981 as "the benign myoclonic epilepsy of infancy" and carried that name for
  four decades. The 2022 ILAE nosology renamed it myoclonic epilepsy in infancy,
  dropping "benign" as part of a general removal of that word from the epilepsy
  syndromes. In most cases the removal was a matter of principle, since the word
  reassures families about a disease that is still an epilepsy. Here it is
  substantive: the seizures really do remit, but a substantial minority of
  children have lasting cognitive difficulty, so the old name was making a claim
  the data do not support. That tension is curated as a discussion rather than
  settled in prose.

  Scope. This entry models the syndrome as a whole and treats reflex myoclonic
  epilepsy in infancy as a subset within it, because that is how the primary
  literature is organized, while recording explicitly that this inclusion is
  disputed. If the reflex variant is later separated as its own entity it should
  get its own entry rather than a subtype block here, and the discussion says so.

  What is deliberately absent. There is no genetic section. Family history of
  epilepsy or febrile seizures is common and the literature reads the clinical
  heterogeneity as pointing toward several underlying genetic mechanisms, but no
  gene has been established for this syndrome, and no candidate is named in the
  sources cited here. Importing genes from adjacent infantile myoclonic
  epilepsies would fabricate content; the absence is recorded as a knowledge gap
  instead.

  Sourcing note. Drafted from the primary literature, then cross-checked against
  a deep-research report generated with the falcon provider (Edison Scientific),
  committed as research/Myoclonic_Epilepsy_in_Infancy-deep-research-falcon.md.
  It contributed no snippets; every quotation here is verified against its own
  fetched cache. It converged on the substance of this entry and added four
  things worth recording.

  Two are naming traps that a future curator should not walk into. First, Dravet
  syndrome was historically called severe myoclonic epilepsy in infancy, so the
  two syndromes have almost the same old name and opposite prognoses; that is why
  Dravet is carried here as the leading differential. Second, familial infantile
  myoclonic epilepsy is a separately indexed genetic entity associated with genes
  including TBC1D24, SCN8A, CPLX1 and KIF5A, and it is not this syndrome. The
  report is explicit that gene-associated cases described as myoclonic epilepsy
  of infancy should be read as possible phenocopies rather than as evidence that
  this syndrome is monogenic, and that SCN1A, SLC2A1 and YWHAG should not be
  asserted as established causes. That is the same conclusion the genetic
  knowledge gap below reaches independently, and it is the reason no genetic
  section exists here.

  Third, the report notes that Open Targets holds this entity as MONDO:0100566
  with no established disease-target association, which is consistent with the
  absence of a molecular handle.

  Fourth, the report described roughly a tenth of children later developing
  another epilepsy, most commonly juvenile myoclonic epilepsy. That gap has since
  been closed with a citable source: PMID:21752671 states that a few patients
  later had other epilepsy types, mainly idiopathic generalized epilepsies, and
  reports the first case that went on to childhood absence epilepsy. It is now
  curated as a progression phase and in the evolution discussion. The specific
  one-in-ten figure and the juvenile-myoclonic-epilepsy attribution are still not
  asserted here, because that source does not give them.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance, at the hyperexcitability and
  recurrent-seizure nodes. The module makes no claim about the age restriction or
  about the myoclonic semiology, which are this entry's specific contributions.
inheritance:
  - name: Presumed genetic and heterogeneous, no established locus
    description: >-
      No mode of inheritance is established and no locus is known. The literature
      infers a genetic contribution from the clinical picture rather than from
      mapping: the syndrome is clinically heterogeneous enough that reviewers
      have suggested several distinct genetic mechanisms may produce the same
      presentation. No inheritance_term is bound, because binding one would
      assert a mode of transmission that has not been demonstrated.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The clinical heterogeneity within this syndrome suggests that there may
          be a variety of genetic mechanisms that underlie the presentation.
        explanation: >-
          States the inference exactly as the field makes it, from clinical
          heterogeneity to presumed genetic heterogeneity, without naming a gene
          or a mode of inheritance.
pathophysiology:
  - name: Age-Restricted Generalized Cortical Hyperexcitability of Infancy
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The substrate is a transient, presumed genetic tendency of the infant brain
      to generate generalized epileptic discharge, appearing in the first three
      years of life and generally disappearing after it. Nothing is known about
      it at the molecular level, and this entry does not pretend otherwise: the
      node carries cellular annotation and no gene. What justifies calling it
      generalized rather than focal is that the discharge is generalized on the
      recording and the jerk it produces is bilateral. What justifies calling it
      age-restricted is that both the onset and the remission are tied to a
      developmental window rather than to any event.
    cell_types:
      - preferred_term: cortical neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: neuronal action potential
        term:
          id: GO:0019228
          label: neuronal action potential
        modifier: INCREASED
    downstream:
      - target: Generalized Epileptiform Discharge Time-Locked to the Jerk
      - target: Reflex Sensitivity to Tactile and Acoustic Stimuli in a Subset
      - target: Age-Dependent Remission of the Seizure Disorder
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy, classified among the generalised
          idiopathic epilepsies, is characterised by the occurrence of myoclonic
          seizures in the first three years of life in otherwise normal infants.
        explanation: >-
          Establishes the three components this node asserts: a generalized
          rather than focal mechanism, a restricted age window, and an otherwise
          normal infant, which is what makes the substrate a functional
          excitability state rather than a lesion.
  - name: Generalized Epileptiform Discharge Time-Locked to the Jerk
    biological_scale: TISSUE
    description: >-
      The electrographic event: a brief burst of generalized spike-wave or
      polyspike-wave, coinciding with the myoclonic jerk closely enough that the
      two can be shown to be one event on combined recording. This time-locking
      is what makes the jerk a seizure rather than a movement disorder, and it is
      the single most useful discriminator from the non-epileptic myoclonias of
      infancy that otherwise look identical at the cotside.
    cell_types:
      - preferred_term: cortical neuron
        term:
          id: CL:0000540
          label: neuron
    downstream:
      - target: Brief Generalized Myoclonic Seizures
    evidence:
      - reference: PMID:21752671
        reference_title: >-
          Benign myoclonic epilepsy in infancy followed by childhood absence
          epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The ictal video-EEG and polygraphic recording revealed generalized
          discharge of spike-wave (SW) lasting 1-2s associated with isolated
          bilateral synchronous jerk involving mainly the upper limbs controlled
          by valproic acid (VPA).
        explanation: >-
          Direct polygraphic evidence for every element of this node: the
          discharge is generalized spike-wave, it is brief, and it is recorded in
          association with the bilateral jerk rather than merely alongside it,
          which is what time-locking means here.
  - name: Reflex Sensitivity to Tactile and Acoustic Stimuli in a Subset
    biological_scale: ORGANISM
    description: >-
      In a subset of infants the jerks are not spontaneous but are elicited
      reliably by a sudden unexpected touch or noise. Whether these children have
      a variant of the same syndrome or a separate one is genuinely disputed, and
      this node exists to make the disputed branch explicit in the graph rather
      than leaving it in prose. What can be said from the evidence is that the
      reflex group is developmentally normal in every reported case, which is a
      real difference from the syndrome as a whole and is the strongest argument
      for separating them.
    downstream:
      - target: Brief Generalized Myoclonic Seizures
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Some authors have described cases of myoclonic seizures as a reflex
          response to sudden unexpected tactile or acoustic stimuli and this
          clinical entity has been proposed as a separate nosographic syndrome,
          referred to as "reflex myoclonic epilepsy in infancy" (RMEI).
        explanation: >-
          Names the trigger modalities and records that the entity has been
          proposed as separate, which is precisely the disputed status this node
          encodes.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The cognitive outcome in reflex myoclonic epilepsy of infancy is normal
          in all reported cases.
        explanation: >-
          The outcome difference that distinguishes the reflex subset from the
          syndrome as a whole, and the main empirical argument for treating it as
          a separate entity.
  - name: Brief Generalized Myoclonic Seizures
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The clinical seizure: a sudden brief bilateral jerk, usually of the head
      and upper limbs, lasting a second or less, often in clusters. Consciousness
      is not obviously impaired, which is one reason the events are frequently
      dismissed at first as startles or colic. In this syndrome the myoclonic
      seizure is the only seizure type; the appearance of other seizure types is
      a reason to doubt the diagnosis.
    downstream:
      - target: Age-Dependent Remission of the Seizure Disorder
      - target: Persisting Cognitive and Behavioural Difficulty in a Minority
    evidence:
      - reference: PMID:23770486
        reference_title: "Reflex myoclonic epilepsy in infancy: a critical review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Benign myoclonic epilepsy in infancy, classified among the generalised
          idiopathic epilepsies, is characterised by the occurrence of myoclonic
          seizures in the first three years of life in otherwise normal infants.
        explanation: >-
          Establishes the myoclonic seizure as the characteristic and defining
          seizure type of the syndrome.
  - name: Age-Dependent Remission of the Seizure Disorder
    biological_scale: ORGANISM
    description: >-
      The seizures stop. Long-term seizure freedom is the expected outcome and is
      the property that places the syndrome among the self-limited rather than
      the encephalopathic infantile epilepsies. Valproate is the most effective
      treatment, which is a statement about seizure control rather than about
      whether treatment alters the natural history, a question the literature
      does not answer.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Prognosis in respect of long term seizure freedom is good with sodium
          valproate being the most effective medication.
        explanation: >-
          States both the favourable seizure outcome and the drug it is achieved
          with, in one sentence.
      - reference: PMID:35503712
        reference_title: >-
          ILAE classification and definition of epilepsy syndromes with onset in
          neonates and infants: Position statement by the ILAE Task Force on
          Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Syndromes are separated into self-limited syndromes, where there is
          likely to be spontaneous remission and developmental and epileptic
          encephalopathies, diseases where there is developmental impairment
          related to both the underlying etiology independent of epileptiform
          activity and the epileptic encephalopathy.
        explanation: >-
          Defines the self-limited category this syndrome belongs to, and by
          contrast the encephalopathy category it does not, which is the
          classificatory meaning of this node.
  - name: Persisting Cognitive and Behavioural Difficulty in a Minority
    biological_scale: ORGANISM
    description: >-
      The reason the syndrome is no longer called benign. Roughly a third of
      children with long-term follow-up have cognitive problems, despite seizures
      that remitted and an infancy that looked normal before onset. Whether this
      reflects the seizures, the underlying substrate that produced them, or the
      medication used to stop them is not established, and the entry does not
      choose. The practical consequence is stated plainly in the source: the word
      benign may be applied to the seizures but must be used cautiously when
      counselling a family about their child's development.
    evidence:
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, the cognitive outcome is much less certain with cognitive
          problems present in one-third of children who have long term follow up.
        explanation: >-
          The quantitative basis for this node: one third of children with long
          follow-up, in a syndrome whose name asserted the opposite.
      - reference: PMID:16904290
        reference_title: >-
          Developmental outcome in benign myoclonic epilepsy in infancy and
          reflex myoclonic epilepsy in infancy: a literature review and six new
          cases.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The term benign may be appropriately used to describe the myoclonic
          seizures but must be used cautiously when counselling families about
          cognitive outcome.
        explanation: >-
          The authors' own separation of the seizure prognosis from the
          developmental prognosis, which is the distinction this node exists to
          make.

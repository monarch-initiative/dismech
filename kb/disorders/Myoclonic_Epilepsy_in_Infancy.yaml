  - category: Neurological
    name: EEG with Generalized Epileptiform Discharges
    description: >-
      Generalized spike-wave or polyspike-wave bursts, time-locked to the
      myoclonic jerk, against an otherwise normal background.
    phenotype_term:
      preferred_term: EEG with generalized epileptiform discharges
      term:
        id: HP:0011198
        label: EEG with generalized epileptiform discharges
    evidence:
      - reference: PMID:21752671
        reference_title: >-
          Benign myoclonic epilepsy in infancy followed by childhood absence
          epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The ictal video-EEG and polygraphic recording revealed generalized
          discharge of spike-wave (SW) lasting 1-2s associated with isolated
          bilateral synchronous jerk involving mainly the upper limbs controlled
          by valproic acid (VPA).
        explanation: >-
          States the discharge morphology and its association with the jerk. No
          frequency band is assigned, because this is a single polygraphically
          documented case and no cited source quantifies how often the finding is
          present across the syndrome.
  - category: Neurological
    name: Cognitive Impairment
    description: >-
      Cognitive difficulty in a substantial minority of children followed long
      term, despite remission of the seizures. The source says cognitive
      problems, a category that spans learning difficulty and attention problems
      as well as intellectual disability, so the term is deliberately the
      unqualified one: assigning a severity grade would assert something the
      literature does not.
    phenotype_term:

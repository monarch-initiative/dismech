name: Hydatidiform Mole
creation_date: "2026-06-17T00:00:00Z"
description: >-
  Hydatidiform mole is the benign, premalignant end of the gestational
  trophoblastic disease spectrum: an abnormal pregnancy characterized by
  hydropic swelling of the chorionic villi and proliferation of villous
  trophoblast. It arises from aberrant fertilization that produces an
  imbalance of parental genomes. Complete hydatidiform mole is typically
  diploid and androgenetic (entirely paternal genome, most often from
  duplication of a single sperm in an ovum lacking maternal chromosomes),
  with no fetal tissue and diffuse villous hydrops; partial hydatidiform
  mole is typically triploid and diandric (two paternal genome
  complements plus one maternal), with focal villous hydrops and a
  non-viable fetus. The androgenetic/diandric excess of paternally
  expressed genes and loss of maternally imprinted CDKN1C/p57 drive
  trophoblastic hyperplasia. Rare recurrent forms are maternal-effect
  diseases, in which the causative genotype is the mother's rather than the
  conceptus's, and they divide into two mechanisms. Biallelic variants in the
  oocyte subcortical maternal complex genes NLRP7 and KHDC3L leave maternally
  methylated regions unmethylated, so a diploid biparental conceptus behaves
  epigenetically as an androgenetic one; PADI6 is a further component of the
  same complex implicated in recurrent mole, without a reported methylation
  measurement. Biallelic variants in the meiotic double-strand-break genes
  MEI1, TOP6BL and REC114 instead leave the oocyte without maternal
  chromosomes, so the conceptus really is androgenetic - a route demonstrated
  for Mei1 in mice, where the whole first-division spindle is extruded into
  the polar body. Hydatidiform mole presents with first-trimester
  bleeding and markedly elevated hCG, is treated by uterine
  evacuation, and confers a risk of progression to gestational
  trophoblastic neoplasia, requiring serial hCG surveillance.
categories:
- Pregnancy Disorder
- Gestational Trophoblastic Disease

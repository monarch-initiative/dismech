pathophysiology:
- name: Aberrant Fertilization and Parental Genome Imbalance
  description: >-
    Hydatidiform mole originates from abnormal fertilization producing an
    excess of paternal relative to maternal genome. Complete moles are
    usually diploid androgenetic, arising when an ovum that has lost or
    inactivated its nucleus is fertilized and the paternal genome is
    duplicated (or by dispermy); partial moles are usually triploid diandric,
    arising when a normal ovum is fertilized by two sperm. This parental
    genome imbalance is the initiating event of molar pregnancy.

    Most cases are sporadic, but there is an inherited route to the same state.
    Biallelic maternal variants in the meiotic double-strand-break genes MEI1,
    TOP6BL and REC114 were identified together in women with recurrent
    androgenetic complete moles. The mechanism was demonstrated in Mei1-null
    mice: the oocyte extrudes its whole first-division spindle, carrying every
    maternal chromosome, into the first polar body, and the resulting cytoplast
    can still be fertilized, so the conceptus is androgenetic. The causative
    genotype is the mother's, so these women have recurrent androgenetic moles
    rather than one sporadic event.

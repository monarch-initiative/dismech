notes: >-
  Recurrent-mole series. MONDO:0006248 has exactly four numbered
  recurrent-mole children, and each names one gene in its OWL axioms: HYDM1
  NLRP7, HYDM2 KHDC3L, HYDM3 MEI1, HYDM4 TOP6BL. All four now have a
  has_subtypes row, and HYDM1 and HYDM2 are also listed as children of the
  Familial Biparental Mole row, which is the grouping the two subcortical
  maternal complex genes share. Two further causal genes have no numbered
  class and so no row: REC114, reported by the same study as MEI1 and TOP6BL,
  and PADI6. Searched `runoak -i ols:mondo search` for "REC114" (nothing) and
  "PADI6" (only MONDO:1010200 oocyte/zygote/embryo maturation arrest 16) on
  2026-09-26.

  The maternal-effect point is the reason this entry does not read as ordinary
  Mendelian inheritance. In all six recurrent-mole genes the biallelic variants
  belong to the mother, and the affected conceptus need carry none of them, so
  an affected woman's recurrence risk is set by her own genotype and oocyte
  donation is the reproductive option that changes it. The `inheritance` blocks
  record autosomal recessive transmission of the maternal genotype, which is
  what HP:0000007 describes. HPO has no mode-of-inheritance term for a
  maternal-effect disease: HP:0000005 has 40 descendants and none of them names
  one, the nearest being HP:0034344 female-limited expression, which is about
  sex-limited expression rather than about the mother's genotype acting on the
  conceptus; `runoak -i ols:hp search "maternal effect"` returns nothing.
  Enumerated through OLS on 2026-09-26. The distinction is therefore carried in
  prose here and in each gene's own notes.

  The two routes are not variants of one mechanism and are wired to different
  pathophysiology nodes. NLRP7, KHDC3L and PADI6 sit on the imprinting node,
  because their moles are diploid biparental and the lesion is absent
  methylation at maternal DMRs. MEI1, TOP6BL and REC114 sit on the
  aberrant-fertilization node, because their moles are genuinely androgenetic:
  the oocyte loses its chromosomes before fertilization. The primary report
  states that distinction explicitly. The three meiotic genes are also not
  equally well supported - the authors themselves write that their data
  establish MEI1 "and possibly the two other genes", which is quoted on the
  REC114 record.

  Classification note. `icdo_morphology` is deliberately left empty. An earlier
  draft of this entry assigned `Trophoblastic Tumor` on the strength of the
  ICD-O morphology codes moles do carry -- 9100/0 for hydatidiform mole NOS and
  9103/0 for the partial mole. That was wrong, and by the same rule the rest of
  the enum follows: NCIT:C3110 (Hydatidiform Mole) does not descend from
  NCIT:C3422 (Trophoblastic Tumor) at all. Its parents are Gestational
  Trophoblastic Disorder and Placenta Disorder, NCIT asserts no
  Neoplastic_Status for it, and both NCIT:C4871 (Complete Hydatidiform Mole)
  and NCIT:C4293 (Partial Hydatidiform Mole) sit explicitly under Placental
  Non-Neoplastic Disorder. WHO agrees: gestational trophoblastic *neoplasia* is
  reserved for invasive mole, choriocarcinoma, PSTT and ETT, and a non-invasive
  mole is gestational trophoblastic disease but not GTN. Since
  `ICDOMorphologyEnum` applies only to neoplastic diseases, the honest action is
  to omit the slot rather than assert a neoplasm this entry is not. The molar
  pregnancies that do progress are covered by the `Gestational_Trophoblastic_Neoplasm`
  entry, which carries `Trophoblastic Tumor` correctly.

treatments:
- name: Valproate
  description: >-
    Valproic acid is highly effective across all three JME seizure types and is
    traditionally first-line; however, its teratogenicity means it is generally
    avoided in women of childbearing potential.
  treatment_term:
    preferred_term: Pharmacotherapy

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:35503716
      reference_title: "ILAE definition of the Idiopathic Generalized Epilepsy Syndromes: Position statement by the ILAE Task Force on Nosology and Definitions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The goal of this paper is to delineate the four syndromes comprising the IGEs, namely childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic seizures alone."
      explanation: >-
        The ILAE Task Force on Nosology and Definitions places juvenile myoclonic
        epilepsy among the four idiopathic generalized epilepsy syndromes, an
        epilepsy nosology whose clinical home is the neurologic Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:35503716
      reference_title: "ILAE definition of the Idiopathic Generalized Epilepsy Syndromes: Position statement by the ILAE Task Force on Nosology and Definitions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 2017, the International League Against Epilepsy (ILAE) Classification of Epilepsies described the \"genetic generalized epilepsies\" (GGEs), which contained the \"idiopathic generalized epilepsies\" (IGEs)."
      explanation: >-
        The ILAE classification nests the IGE syndromes, JME among them, inside
        the genetic generalized epilepsies, supporting a secondary genetic-basis
        Part alongside the primary neurologic placement.
    notes: >-
      Secondary Part only. JME susceptibility is complex/polygenic rather than
      Mendelian, so this tags the genetic axis of the syndrome, not a
      single-gene etiology.
pathophysiology:
- name: Genetic Susceptibility to JME
  description: >-
    JME has a strong, usually complex (polygenic) genetic basis. Susceptibility
    variants affect GABA-A receptor subunits (GABRA1, GABRD), the EFHC1
    (myoclonin) gene, and calcium-channel subunits (CACNB4), shifting the
    excitation-inhibition balance of cortical and thalamocortical circuits. This
    node captures the single concept of the predisposing genetic variation.
  role: trigger
  gene:
    preferred_term: GABRA1
    term:
      id: hgnc:4075
      label: GABRA1
  downstream:
  - target: Impaired GABAergic Cortical Inhibition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      GABA-A receptor subunit variants reduce inhibitory GABAergic signaling.
  - target: EFHC1-Related Neuronal Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      EFHC1 variants perturb neuronal excitability and cortical development.
- name: Impaired GABAergic Cortical Inhibition
  description: >-
    Reduced GABA-A receptor-mediated inhibition (e.g., from GABRA1 or GABRD
    variants) lowers the inhibitory restraint on cortical neurons. This node
    captures the single concept of the inhibitory deficit and conforms to the
    shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:11992121
    reference_title: "Mutation of GABRA1 in an autosomal dominant form of juvenile myoclonic epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GABA(A) receptors that contain the mutant subunit show a lesser amplitude of GABA-activated currents in vitro, indicating that seizures may result from loss of function of this inhibitory ligand-gated channel"
    explanation: >-
      A JME-associated GABRA1 mutation reduces GABA-activated currents,
      evidencing loss of GABAergic inhibition as a mechanism.
  downstream:
  - target: Cortical and Thalamocortical Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Reduced inhibition disinhibits cortical and thalamocortical networks.
- name: EFHC1-Related Neuronal Dysregulation
  description: >-
    EFHC1 (myoclonin1) influences neuronal calcium currents, division, and
    migration; JME-associated variants perturb cortical neuronal excitability
    and development. This node captures the single concept of the EFHC1 arm.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15258581
    reference_title: "Mutations in EFHC1 cause juvenile myoclonic epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patch-clamp analysis, EFHC1 specifically increased R-type Ca(2+) currents that were reversed by the mutations associated with JME"
    explanation: >-
      EFHC1 modulates R-type calcium currents, and JME mutations reverse this
      effect, linking EFHC1 to neuronal excitability regulation.
  downstream:
  - target: Cortical and Thalamocortical Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      EFHC1-related dysregulation contributes to cortical hyperexcitability.
- name: Cortical and Thalamocortical Hyperexcitability
  description: >-
    The motor cortex and the reciprocal thalamocortical network become
    hyperexcitable and prone to hypersynchronous discharge, with particular
    involvement of frontal/motor systems. This node captures the single concept
    of network hyperexcitability and conforms to the shared epilepsy final
    common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Generalized Polyspike-Wave Discharges
    causal_link_type: DIRECT
    description: >-
      Cortical/thalamocortical hypersynchrony produces generalized polyspike-wave
      discharges.
- name: Generalized Polyspike-Wave Discharges
  description: >-
    The hypersynchronous activity manifests on EEG as generalized, bilaterally
    synchronous polyspike-and-wave discharges (typically 4-6 Hz), often with
    photosensitivity. This node captures the single concept of the generalized
    epileptiform discharge.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Myoclonic and Generalized Seizures
    causal_link_type: DIRECT
    description: >-
      Generalized polyspike-wave discharges produce the clinical seizures.
- name: Myoclonic and Generalized Seizures
  description: >-
    The clinical seizures are early-morning myoclonic jerks (especially of the
    upper limbs, shortly after awakening), generalized tonic-clonic seizures,
    and typical absence seizures in a subset. Seizures are provoked by sleep
    deprivation, alcohol, and fatigue. This node captures the single concept of
    the seizure endpoint and conforms to the shared epilepsy final common
    pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron

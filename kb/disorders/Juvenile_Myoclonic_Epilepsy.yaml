genetic:
- name: EFHC1
  gene_term:
    preferred_term: EFHC1
    term:
      id: hgnc:16406
      label: EFHC1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    EFHC1 (myoclonin1) was the first gene specifically associated with JME;
    variants perturb neuronal calcium currents and cortical development. A
    guideline-based reanalysis affirmed several EFHC1 variants as pathogenic or
    likely pathogenic.
  evidence:
  - reference: PMID:15258581
    reference_title: "Mutations in EFHC1 cause juvenile myoclonic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analyses identified five missense mutations in EFHC1 that cosegregated with epilepsy or EEG polyspike wave in affected members of six unrelated families with JME and did not occur in 382 control individuals"
    explanation: >-
      Original report identifying cosegregating EFHC1 missense mutations across
      six JME families.
  - reference: PMID:27467453
    reference_title: "EFHC1 variants in juvenile myoclonic epilepsy: reanalysis according to NHGRI and ACMG guidelines for assigning disease causality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine variants were classified as \"pathogenic,\" 14 as \"likely pathogenic,\""
    explanation: >-
      A guideline-based (ACMG) reanalysis of EFHC1 epilepsy variants affirmed a
      substantial number as pathogenic or likely pathogenic.

name: Juvenile Myoclonic Epilepsy
creation_date: "2026-07-18T00:00:00Z"
category: Complex
description: >-
  Juvenile myoclonic epilepsy (JME) is the most common genetic (idiopathic)
  generalized epilepsy syndrome, typically beginning in adolescence. It is
  defined by early-morning myoclonic jerks of the upper limbs, generalized
  tonic-clonic seizures, and, in about a third of patients, typical absence
  seizures. Seizures are provoked by sleep deprivation, alcohol, and fatigue,
  and photosensitivity is common. The syndrome arises from a genetically
  influenced shift toward cortical (particularly motor-system) and
  thalamocortical hyperexcitability - reduced GABAergic inhibition together with
  susceptibility variants in genes such as GABRA1, EFHC1, CACNB4, and GABRD -
  producing generalized polyspike-and-wave discharges. Cognition is usually
  preserved and seizures generally respond well to medication, but the tendency
  to seizures is typically lifelong.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- JME
- Janz syndrome
- Impulsive petit mal

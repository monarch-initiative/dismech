discussions:
- discussion_id: jme-valproate-vs-alternatives-women
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Myoclonic and Generalized Seizures"
  prompt: >-
    Valproate is the most effective drug across all three JME seizure types but
    is teratogenic and generally contraindicated in women of childbearing
    potential. How well do the main alternatives (levetiracetam, lamotrigine)
    control myoclonic seizures specifically, and can a first-line
    non-valproate strategy achieve comparable seizure freedom without the
    teratogenic risk?
  rationale: >-
    JME predominantly affects adolescents and young adults, so the
    valproate-teratogenicity trade-off is a routine, high-stakes clinical
    decision. Levetiracetam is favored for women but head-to-head evidence on
    myoclonic-seizure control versus valproate is limited, and lamotrigine can
    aggravate myoclonus in some patients.
  evidence:
  - reference: PMID:35974938
    reference_title: "Efficacy of levetiracetam, lamotrigine and sodium valproate on seizure attacks and EEG disorders in patients with juvenile myoclonic epilepsy: A double blind randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levetiracetam and sodium valproate have similar efficacy"
    explanation: >-
      A randomized trial found levetiracetam and valproate similarly effective,
      supporting levetiracetam as a viable valproate-sparing option while
      leaving myoclonus-specific and long-term comparisons open.
  proposed_experiments:
  - experiment_id: jme-nonvalproate-trial
    name: Non-valproate first-line strategy trial
    description: >-
      Randomized comparison of levetiracetam (and/or lamotrigine) versus
      valproate as first-line therapy in newly diagnosed JME, stratified by sex,
      with seizure-freedom and myoclonus-specific outcomes and long-term
      follow-up.
    readouts:
    - name: Seizure freedom and myoclonus control by drug and sex
      target: "pathophysiology#Myoclonic and Generalized Seizures"
    decision_criterion: >-
      Comparable seizure freedom without teratogenic risk would support a
      non-valproate first-line strategy.
    would_support:
    - "pathophysiology#Myoclonic and Generalized Seizures"
- discussion_id: jme-lifelong-vs-remission-withdrawal
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Myoclonic and Generalized Seizures"
  prompt: >-
    JME has traditionally been considered a lifelong disorder requiring
    indefinite treatment, yet a subset of patients achieves durable seizure
    remission. Can clinical, EEG, or genetic markers reliably identify the
    patients in whom antiseizure medication can be safely withdrawn?
  rationale: >-
    The lifelong-treatment assumption is increasingly questioned, and
    unnecessary lifelong medication carries real costs. Predicting safe
    withdrawal would change counseling and management, but robust predictors
    have not been established.
  proposed_experiments:
  - experiment_id: jme-withdrawal-cohort
    name: Prospective drug-withdrawal cohort
    description: >-
      Follow long-term seizure-free JME patients through a structured
      medication-withdrawal protocol, correlating relapse with clinical
      subtype, EEG normalization, and genetic background.
    readouts:
    - name: Relapse rate versus candidate predictors
      target: "pathophysiology#Myoclonic and Generalized Seizures"
    would_support:
    - "pathophysiology#Genetic Susceptibility to JME"
- discussion_id: jme-efhc1-mechanism-fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#EFHC1-Related Neuronal Dysregulation"
  prompt: >-
    EFHC1 (myoclonin1) is a non-ion-channel protein linked to JME via effects on
    R-type calcium currents, neuronal migration, and cortical "microdysgenesis,"
    but reports disagree on whether it is expressed in neurons or predominantly
    in motile ciliated cells, and mouse knockouts only partially recapitulate
    the human phenotype. How does EFHC1 dysfunction actually produce the human
    myoclonic phenotype, and how faithful are the current cellular and animal
    models?
  rationale: >-
    The cell type in which EFHC1 acts (neuron versus ciliated cell) and the
    fidelity of Efhc1-deficient mouse models to human JME are unresolved, so the
    mechanistic link between EFHC1 variants and the human phenotype - and the
    translational value of the models - remains uncertain even though variant
    pathogenicity is supported.
  proposed_experiments:
  - experiment_id: jme-efhc1-celltype-mapping
    name: EFHC1 cell-type and model-fidelity study
    description: >-
      Resolve EFHC1 expression and function across neuronal and ciliated cell
      types in human tissue and iPSC-derived neurons, and benchmark
      Efhc1-deficient animal models against the human electroclinical
      phenotype.
    readouts:
    - name: EFHC1 cell-type expression and functional consequence
      target: "pathophysiology#EFHC1-Related Neuronal Dysregulation"
    would_support:
    - "pathophysiology#EFHC1-Related Neuronal Dysregulation"

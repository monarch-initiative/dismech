    reference_title: "Comparative effectiveness of antiepileptic drugs in juvenile myoclonic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The response rate to valproate was highest among the five AEDs (42.7%)"
    explanation: >-
      In a comparative-effectiveness study valproate had the highest response
      rate among antiseizure drugs in JME.
- name: Levetiracetam
  description: >-
    Levetiracetam is effective against myoclonic and generalized seizures and is
    a preferred first-line option, particularly in women of childbearing
    potential.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

discussions:
- discussion_id: rms_renal_insr_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Renal Insulin Receptor Dysfunction
  prompt: >-
    Does the renal phenotype of kidney-specific Insr-knockout mice faithfully
    model the human renal consequences of INSR loss in Rabson-Mendenhall syndrome?
  rationale: >-
    Genetically modified mice with kidney-specific Insr deletion show elevated
    blood pressure and progressive diabetic nephropathy, whereas patients with
    biallelic INSR mutations are normotensive with stable glomerular function and
    only moderate proteinuria, their renal phenotype dominated instead by
    hypercalciuria and nephrocalcinosis. This suggests species-specific
    differences in renal INSR function and cautions against extrapolating the
    mouse renal phenotype to human disease.
  evidence:
  - reference: PMID:25358339
    reference_title: "Insulin Receptor and the Kidney: Nephrocalcinosis in Patients with Recessive INSR Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normotension and stable glomerular function with only moderate proteinuria is in contrast to genetically modified mice who have elevated BP and progressive diabetic nephropathy."
    explanation: Directly contrasts the human renal phenotype with the murine model.
- discussion_id: rms_absent_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#
  prompt: >-
    Why is there no genotype-phenotype correlation across the INSR-severity
    spectrum, and what determines an individual's position between Donohue,
    Rabson-Mendenhall, and type A insulin resistance?
  rationale: >-
    The pooled 42-patient analysis found no statistically significant differences
    in clinical or laboratory features between patients with different mutation
    types or numbers, and no genotype-phenotype correlation is established. The
    modifiers that set disease severity for a given INSR lesion are unknown.
  evidence:
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No statistical differences were found in clinical features and laboratory parameters between patients with different mutations."
    explanation: Documents the absence of a genotype-phenotype correlation.
notes: >-
  LUMP/SPLIT: Rabson-Mendenhall syndrome is kept as a separate entry from the
  other members of the INSR allelic series. It is the intermediate-severity form
  of INSR-related severe insulin resistance (INSR-SIRS), a continuum running from
  the neonatally lethal Donohue syndrome (leprechaunism; near-complete loss of
  receptor function) through Rabson-Mendenhall to the milder type A insulin
  resistance (PMID:29369573, PMID:29695048). Although the three share the same
  causal gene and are described by GeneReviews as one phenotypic continuum, they
  are curated separately here because they differ in onset, severity, survival,
  and (for type A) typical inheritance and are represented by distinct MONDO
  concepts. Keep-separate is the expected call. This entry is also deliberately
  distinct from the acquired, autoantibody-mediated type B insulin resistance
  syndrome (kb/disorders/Type_B_Insulin_Resistance_Syndrome.yaml), which shares
  the extreme-insulin-resistance clinical picture but has no INSR genetic lesion.
  CURATION SCOPE: Pineal hyperplasia is named in the OMIM title of RMS (262190)
  and reported in case series, but none of the abstracts fetched into the local
  reference cache carried a directly quotable statement of it, so it is described
  here without a separately evidenced phenotype rather than being asserted on a
  weaker citation. Emerging GLP-1/GIP-agonist (tirzepatide) case reports were
  identified in deep research but were not indexed in PubMed at curation time and
  could not be snippet-verified, so they are noted here rather than curated as a
  treatment.
review_notes: >-
  Created de novo from a claude_code deep-research report treated as leads. Two
  ontology bindings suggested by the report were hallucinated or Named-Entity
  confusions and were corrected during curation: HP:0000707 (suggested for
  "dentition") is actually "Abnormality of the nervous system" (used HP:0000164);
  NCIT:C77082 (suggested for metreleptin) is Tolvaptan and NCIT:C1966 (suggested
  for mecasermin) is Imaging Agent (used CHEBI:752900 metreleptin and
  CHEBI:749581 mecasermin). HP:0000857, initially considered for diabetes, is
  "Neonatal insulin-dependent diabetes mellitus"; HP:0000831
  (insulin-resistant diabetes mellitus) was used instead. All evidence snippets
  are exact substrings of PubMed abstracts/full text cached via just
  fetch-reference.

name: Rabson-Mendenhall Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Endocrine
parents:
- Endocrine Disorder
- Genetic Disorder
disease_term:
  preferred_term: Rabson-Mendenhall Syndrome
  term:
    id: MONDO:0009874
    label: Rabson-Mendenhall syndrome
description: >-
  A rare autosomal recessive disorder of extreme insulin resistance caused by
  biallelic (homozygous or compound heterozygous) loss-of-function variants in
  the insulin receptor gene (INSR). Defective insulin-receptor tyrosine-kinase
  signalling in target tissues blunts insulin action, producing severe insulin
  resistance with compensatory hyperinsulinaemia; the earliest biochemical
  hallmark is markedly elevated fasting insulin. Clinically it is defined by
  acanthosis nigricans, hypertrichosis/hirsutism, coarse facial features, dental
  and nail abnormalities, paucity of subcutaneous fat, growth retardation, and,
  in females, ovarian hyperandrogenism with enlarged/polycystic ovaries and
  clitoromegaly. The glycaemic course evolves from fasting hypoglycaemia with
  postprandial hyperglycaemia in infancy toward beta-cell decompensation, overt
  insulin-resistant diabetes mellitus, and recurrent diabetic ketoacidosis with
  microvascular complications in the second decade; complications of longstanding
  hyperglycaemia are the leading cause of death. Nephrocalcinosis is an almost
  invariable, apparently tissue-autonomous renal consequence of INSR loss.
  Rabson-Mendenhall syndrome occupies the intermediate position on the
  INSR-related severe insulin resistance spectrum (INSR-SIRS), between the
  neonatally lethal Donohue syndrome (leprechaunism) and the milder type A
  insulin resistance. It is distinct from the acquired, autoantibody-mediated
  type B insulin resistance syndrome.
pathophysiology:
- name: Biallelic INSR Loss-of-Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic variants in the insulin receptor gene (INSR, 19p13.2)
    reduce the number and/or function of cell-surface insulin receptors, most
    commonly through missense substitutions that impair receptor processing,
    insulin-binding affinity, or tyrosine-kinase activity. This is the initiating
    molecular lesion of the syndrome.
  genetic_context:
    gene:
      preferred_term: INSR
      term:
        id: hgnc:6091
        label: INSR
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: insulin receptor tyrosine kinase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  downstream:
  - target: Impaired Insulin Receptor Signaling
    causal_link_type: DIRECT
    description: Reduced receptor number/affinity impairs signalling in insulin target cells.
    evidence:
    - reference: PMID:38957655
      reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the mutation of INSR led to the insulin resistance of the target cell."
      explanation: Directly links INSR mutation to insulin resistance of the target cell.
  - target: Renal Insulin Receptor Dysfunction
    causal_link_type: DIRECT
    description: >-
      The insulin receptor is expressed in the kidney; biallelic INSR loss produces
      a renal phenotype (hypercalciuria, nephrocalcinosis) independent of the diabetic state.
    evidence:
    - reference: PMID:25358339
      reference_title: "Insulin Receptor and the Kidney: Nephrocalcinosis in Patients with Recessive INSR Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "INSR dysfunction is associated with hypercalciuria and nephrocalcinosis."
      explanation: Establishes a direct renal consequence of INSR dysfunction.
  evidence:
  - reference: PMID:40499531
    reference_title: "Genealogical Rabson-Mendenhall syndrome caused by INSR gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel mutation c.3670G>A in exon 21, inherited from the father, is likely to impair insulin receptor function by disrupting tyrosine kinase activity"
    explanation: A worked variant example impairing insulin-receptor tyrosine-kinase function.
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation also caused a reduction in the affinity of the receptor to insulin"
    explanation: Describes reduced receptor-insulin affinity as a consequence of INSR mutation.
- name: Impaired Insulin Receptor Signaling
  role: CENTRAL_EFFECTOR
  biological_scale: CELLULAR
  description: >-
    Loss of functional insulin receptor blunts the downstream insulin receptor
    signalling pathway, principally the PI3K-AKT metabolic arm, in liver,
    skeletal muscle, and adipose tissue, so target tissues fail to mount a
    normal glucose-lowering response to insulin.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: Skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: Insulin receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0008286
      label: insulin receptor signaling pathway
  - preferred_term: PI3K-AKT signal transduction
    modifier: DECREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  downstream:
  - target: Severe Insulin Resistance
    causal_link_type: DIRECT
    description: Blunted receptor signalling produces the defining extreme insulin-resistant state.
  evidence:
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Insulin resistance is defined as the inability of target tissues to mount a normal coordinated glucose-lowering response at a normal plasma insulin level"
    explanation: Defines the impaired target-tissue insulin response that this node represents.
- name: Severe Insulin Resistance
  role: CENTRAL_EFFECTOR
  biological_scale: ORGANISM
  description: >-
    Extreme, generalized insulin resistance is the cardinal systemic
    consequence, driving compensatory hyperinsulinaemia and the early paradoxical
    glycaemic pattern.
  downstream:
  - target: Compensatory Hyperinsulinemia
    causal_link_type: DIRECT
    description: Target tissues require supraphysiologic insulin, driving compensatory hypersecretion.
    evidence:
    - reference: PMID:38957655
      reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To overcome the suboptimal action in insulin-targeting tissues, organisms have to produce a large amount of insulin; thereby hyperinsulinemia develops."
      explanation: Directly links insulin resistance to compensatory hyperinsulinaemia.
  - target: Paradoxical Glycemic Regulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Residual insulin action plus massive hyperinsulinaemia yields fluctuating glucose.
  evidence:
  - reference: PMID:41606799
    reference_title: "Clinical spectrum of extreme insulin resistance syndromes treated with rhIGF-1: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Donohue syndrome (DS) and Rabson-Mendenhall syndrome (RMS) are extreme forms of insulin resistance (IR) caused by biallelic mutations in the insulin receptor gene."
    explanation: Establishes extreme insulin resistance as the defining state of the syndrome.
- name: Paradoxical Glycemic Regulation
  role: CONSEQUENCE
  biological_scale: ORGANISM
  description: >-
    In infancy and early childhood, severely elevated insulin acting on residual
    receptor and cross-reactive pathways produces fasting hypoglycaemia with
    postprandial hyperglycaemia; with disease progression insulin levels decline
    and sustained hyperglycaemia supervenes.
  downstream:
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: Fasting hypoglycaemia from severely increased insulin levels early in life.
  - target: Hyperglycemia
    causal_link_type: DIRECT
    description: Postprandial hyperglycaemia from failure of insulin-stimulated glucose disposal.
  evidence:
  - reference: PMID:29695048
    reference_title: "Mecasermin in Insulin Receptor-Related Severe Insulin Resistance Syndromes: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, patients with RMS also show fasting hypoglycemia due to severely increased insulin levels, but with progression of the disease, insulin levels decline"
    explanation: Documents the early paradoxical hypoglycaemia and its later decline.
  - reference: PMID:40241988
    reference_title: "Case Report: The long-term effects of the empagliflozin therapy on glycemia and renal function in a patient with Rabson-Mendenhall syndrome caused by two heterozygous variants in INSR gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At an early stage, fasting hypoglycemia with postprandial hyperglycemia and significant hyperinsulinemia with subsequent development of insulin-resistant diabetes is observed."
    explanation: Directly describes the paradoxical fasting-hypoglycaemia/postprandial-hyperglycaemia pattern.
- name: Compensatory Hyperinsulinemia
  role: CENTRAL_EFFECTOR
  biological_scale: ORGANISM
  description: >-
    Pancreatic beta-cell hypersecretion produces the extreme hyperinsulinaemia
    that is the earliest biochemical hallmark of the syndrome (median fasting
    insulin ~300 uIU/mL, versus a normal range of 5-20 uIU/mL). Chronic
    hyperinsulinaemia cross-activates IGF-1 receptors in skin and ovary and
    ultimately exhausts beta-cell reserve.
  cell_types:
  - preferred_term: Pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  downstream:
  - target: Cutaneous IGF-1 Receptor Cross-activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: High insulin stimulates keratinocyte IGF receptors.
  - target: Ovarian Androgen Excess
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Hyperinsulinaemia drives ovarian hyperandrogenism in females.
  - target: Pancreatic Beta-Cell Decompensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic hyperstimulation leads to eventual secretory failure.
  - target: Growth Hormone Resistance and Growth Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: High insulin may interact with IGF-I receptors and feedback-reduce GH secretion.
  - target: Hyperinsulinemia
    causal_link_type: DIRECT
    description: The measured laboratory hyperinsulinaemia.
  evidence:
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperinsulinemia is typically observed early in the lives of RMS patients"
    explanation: Establishes early compensatory hyperinsulinaemia in RMS.
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean fasting insulin was 349.96 μIU/mL, and the average fasting C-peptide was 6.00 ng/mL."
    explanation: Quantifies the extreme fasting hyperinsulinaemia and C-peptide in the pooled cohort.
- name: Cutaneous IGF-1 Receptor Cross-activation
  role: CONSEQUENCE
  biological_scale: CELLULAR
  description: >-
    Chronic supraphysiologic insulin cross-activates IGF-1 receptors on
    keratinocytes and dermal fibroblasts, promoting epidermal proliferation that
    manifests as acanthosis nigricans and contributes to soft-tissue overgrowth.
  cell_types:
  - preferred_term: Keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Acanthosis nigricans
    causal_link_type: DIRECT
    description: Keratinocyte hyperproliferation produces acanthosis nigricans.
  evidence:
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High levels of insulin stimulate IGF receptors, thereby promoting the proliferation of keratinocytes."
    explanation: States the IGF-receptor cross-activation mechanism driving keratinocyte proliferation.
- name: Ovarian Androgen Excess
  role: CONSEQUENCE
  biological_scale: CELLULAR
  description: >-
    In females, extreme hyperinsulinaemia acting on ovarian theca cells drives
    androgen biosynthesis, producing hyperandrogenism, enlarged/polycystic
    ovaries, and clitoromegaly.
  cell_types:
  - preferred_term: Ovarian theca cell
    term:
      id: CL:0000503
      label: theca cell
  biological_processes:
  - preferred_term: Androgen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  downstream:
  - target: Hyperandrogenism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Ovarian androgen excess produces clinical hyperandrogenism.
  - target: Enlarged external genitalia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Androgen excess contributes to clitoromegaly/enlarged external genitalia.
  evidence:
  - reference: PMID:40241988
    reference_title: "Case Report: The long-term effects of the empagliflozin therapy on glycemia and renal function in a patient with Rabson-Mendenhall syndrome caused by two heterozygous variants in INSR gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Girls are diagnosed with hyperandrogenism, ovarian enlargement and clitoral hypertrophy."
    explanation: Documents the ovarian hyperandrogenism phenotype; the theca-cell mechanism is inferred.
- name: Pancreatic Beta-Cell Decompensation
  role: CONSEQUENCE
  biological_scale: CELLULAR
  description: >-
    Sustained compensatory hypersecretion eventually exhausts beta-cell reserve,
    so hyperinsulinaemic hypoglycaemia gives way to sustained hyperglycaemia and
    overt insulin-resistant diabetes mellitus.
  cell_types:
  - preferred_term: Pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  downstream:
  - target: Insulin-resistant diabetes mellitus
    causal_link_type: DIRECT
    description: Beta-cell failure precipitates overt insulin-resistant diabetes.
  evidence:
  - reference: PMID:25358339
    reference_title: "Insulin Receptor and the Kidney: Nephrocalcinosis in Patients with Recessive INSR Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe insulin resistance leads to hyperinsulinism with pancreatic β-cell decompensation, diabetes, hyperglycemia and ultimately ketoacidosis"
    explanation: Directly links beta-cell decompensation to diabetes and ketoacidosis.
- name: Renal Insulin Receptor Dysfunction
  role: CONSEQUENCE
  biological_scale: TISSUE
  description: >-
    The insulin receptor is expressed throughout the nephron. Biallelic INSR loss
    produces hypercalciuria and nephrocalcinosis that appear tissue-autonomous
    (present with normotension and stable glomerular function), rather than being
    a secondary complication of hyperglycaemia.
  downstream:
  - target: Nephrocalcinosis
    causal_link_type: DIRECT
    description: Hypercalciuria from renal INSR dysfunction produces nephrocalcinosis.
  evidence:
  - reference: PMID:25358339
    reference_title: "Insulin Receptor and the Kidney: Nephrocalcinosis in Patients with Recessive INSR Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-four-hour urinary calcium data were available from 10 patients and revealed hypercalciuria in all"
    explanation: Documents universal hypercalciuria underlying the nephrocalcinosis.
  - reference: PMID:41606799
    reference_title: "Clinical spectrum of extreme insulin resistance syndromes treated with rhIGF-1: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal tubular dysfunction with nephrocalcinosis is almost invariably present"
    explanation: Independent series confirming near-invariable renal tubular dysfunction with nephrocalcinosis.
- name: Growth Hormone Resistance and Growth Failure
  role: CONSEQUENCE
  biological_scale: ORGANISM
  description: >-
    Affected individuals show a growth-hormone-resistant state (elevated basal GH
    with low-normal IGF-1) and severe growth retardation that is not corrected by
    exogenous growth hormone or standard-dose IGF-1.
  downstream:
  - target: Growth delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: GH resistance contributes to growth retardation/short stature.
  evidence:
  - reference: PMID:34718628
    reference_title: "Long-Term Effects of Metreleptin in Rabson-Mendenhall Syndrome on Glycemia, Growth, and Kidney Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rabson-Mendenhall syndrome (RMS) is caused by biallelic pathogenic variants in the insulin receptor gene (INSR) leading to insulin-resistant diabetes, microvascular complications, and growth hormone resistance with short stature."
    explanation: Names growth hormone resistance with short stature as a defining feature.
  - reference: PMID:23367497
    reference_title: "Syndrome of extreme insulin resistance (Rabson-Mendenhall phenotype) with atrial septal defect: clinical presentation and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggestive of GH resistance"
    explanation: A case with elevated basal GH and normal IGF-1 interpreted as GH resistance.
phenotypes:
- name: Acanthosis nigricans
  description: >-
    Velvety hyperpigmented skin thickening at the neck, axillae, and groin; the
    most frequent dermatologic sign, present in about 69% of pooled cases.
  phenotype_term:
    preferred_term: Acanthosis nigricans
    term:
      id: HP:0000956
      label: Acanthosis nigricans
  frequency: "29/42 (69%)"
  evidence:
  - reference: PMID:38957655
    reference_title: "Rabson-Mendenhall Syndrome: Analysis of the Clinical Characteristics and Gene Mutations in 42 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acanthosis was present in 29 cases (29/42, 69.05%); growth retardation in 25 cases (25/42, 59.52%); dental anomalies including absence of teeth, crowding, and malocclusion in 23 cases (23/42, 54.76%); and hirsutism in 17 cases (17/42, 40.48%)."
    explanation: Reports acanthosis nigricans in 29/42 pooled patients.
- name: Growth delay
  description: >-
    Prenatal and postnatal growth failure with short stature, present in about
    60% of pooled cases and often refractory to growth hormone.
  phenotype_term:
    preferred_term: Growth retardation

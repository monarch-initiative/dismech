discussions:
- discussion_id: nkap_missense_r_loop_genome_instability
  kind: KNOWLEDGE_GAP
  prompt: >-
    NKAP depletion causes R-loop accumulation, DNA damage and replication stress
    in cell lines through loss of the NKAP-HDAC3 complex. Do the hemizygous
    C-terminal missense alleles, which retain protein but lose HDAC3 binding,
    produce the same R-loop phenotype in patient cells?
  rationale: >-
    The patient transcriptome signature (downregulated long, exon-rich genes)
    is also what transcription-coupled R-loop stress would be expected to
    produce, and mutant embryonic fibroblasts proliferate poorly and senesce.
    Resolving this would decide whether the disorder is one of transcriptional
    corepression, of splicing, or of genome maintenance.
  attaches_to:
  - pathophysiology#Loss of NKAP-HDAC3 Corepressor Complex Function
  - pathophysiology#Reduced Cellular Proliferation and Senescence
  evidence:
  - reference: PMID:37322264
    reference_title: "NKAP acts with HDAC3 to prevent R-loop associated genome instability."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In addition, NKAP prevents R-loop formation by maintaining RNA polymerase II pausing."
    explanation: The depletion result that raises the question; it was obtained without patient alleles.
- discussion_id: nkap_animal_alleles_vs_human_missense
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Both animal models carry alleles that truncate or disrupt Nkap (a C-terminal
    truncation in zebrafish; an N-terminal in-frame deletion in the mouse),
    whereas the human disease is caused by C-terminal missense variants that
    leave protein level unchanged. Do the model phenotypes reflect loss of the C-terminal
    interactions, or a null state the human alleles do not reach?
  rationale: >-
    Complete NKAP loss is lethal in mouse haematopoiesis and T cell development,
    which affected humans do not show, so the human alleles are at most
    hypomorphic for those functions. A knock-in of a patient allele would
    separate the two.
  attaches_to:
  - animal_models#nkap C-terminal truncation zebrafish
  - animal_models#Nkap mutant mouse (hemizygous males)
  evidence:
  - reference: PMID:20610818
    reference_title: "Adult hematopoietic stem cells require NKAP for maintenance and survival."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These data establish NKAP as one of a very small number of transcriptional regulators that is absolutely required for adult HSC maintenance and survival."
    explanation: Complete loss is lethal to haematopoiesis in mice, which affected humans do not show, so the human alleles cannot be nulls for this function.

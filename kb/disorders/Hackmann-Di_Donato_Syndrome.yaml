- name: Skewed X-Inactivation in Heterozygous Females
  biological_scale: ORGANISM
  description: >-
    Heterozygous female mice preferentially inactivate the X bearing the mutant
    Nkap allele, and in a double-mutant model this silences a wild-type F8 allele
    in cis, reducing factor VIII. In humans, a disruptive NKAP variant has unmasked
    haemophilia A in a carrier by the same route. This explains the unaffected
    carrier state and predicts that NKAP variants can manifest in females only
    through what the skewing silences on the other X.
  evidence:
  - reference: PMID:41828556
    reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, these females exhibited significantly reduced F8 mRNA levels and FVIII (factor VIII) antigen levels, as demonstrated by quantitative RT-PCR and ELISA, respectively."
    explanation: Shows the functional consequence of the skewing on a gene carried in cis with the mutant NKAP allele.
  - reference: PMID:41828556
    reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "We have previously reported that a disruptive NKAP mutation resulted in extremely skewed X chromosome inactivation (XCI), leading to phenotypic manifestation of hemophilia A (HA) in a HA carrier."
    explanation: The human carrier observation that the model was built to explain.

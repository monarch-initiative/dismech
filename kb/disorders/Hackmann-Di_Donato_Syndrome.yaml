- name: Reduced Cellular Proliferation and Senescence
  biological_scale: CELLULAR
  description: >-
    Embryonic fibroblasts hemizygous for a deleterious Nkap allele show markedly
    reduced proliferation and increased senescence. In heterozygous females this
    confers a growth disadvantage on cells whose active X carries the mutant
    allele, producing the extreme X-inactivation skewing seen in carriers.
    Whether the human missense alleles reproduce this is untested; complete NKAP
    loss causes R-loop accumulation and genome instability in cell lines.

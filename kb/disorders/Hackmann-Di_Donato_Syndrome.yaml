genetic:
- name: NKAP
  gene_term:
    preferred_term: NKAP
    term:
      id: hgnc:29873
      label: NKAP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NKAP (Xq24) encodes NF-kappa-B activating protein, a 415-residue nuclear
    speckle protein with an N-terminal RS domain and a C-terminal DUF926 domain.
    All established disease variants are hemizygous missense changes in exons 8
    and 9, within the C-terminal region that binds HDAC3 and the post-catalytic
    spliceosome. The gene-disease relationship rests on a cohort of ten males
    from eight families with clustered missense variants and a shared
    transcriptome signature, plus later independent cases, fetuses with the
    recurrent p.Arg330Cys allele, and a mouse model.
  evidence:
  - reference: PMID:31587868
    reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a disorder of transcriptional regulation due to missense mutations in the X chromosome gene, NKAP."
    explanation: Original gene-disease report.
  - reference: PMID:42481913
    reference_title: "Resolution of the Diagnostic Odyssey in a Familial Form of Hackmann-Di Donato Syndrome With Structural Brain Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 12 individuals harboring pathogenic NKAP variants have been reported in the literature."
    explanation: Sizes the reported cohort as of 2026.
  variants:
  - name: p.Arg330Cys
    description: >-
      NM_024528.4:c.988C>T, p.Arg330Cys. Reported in the original cohort and in two
      fetuses with congenital heart defects; in transfected HEK293T cells it lowers
      NKAP transcript but not protein, alters intranuclear distribution and reduces
      HDAC3 binding. Proposed for reclassification as likely pathogenic. All four
      individuals with a p.Arg330 variant reported to 2024 had a cardiac defect.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An NKAP mutation (NM_024528.4: c.988C>T, p.Arg330Cys) was identified in two foetuses presenting with CHD."
      explanation: Identifies the allele in two fetuses.
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings also provide evidence of NKAP p.R330C pathogenicity and demonstrate the potential mechanism by which p.R330C dysregulates cardiac developmental gene transcription by altering Nkap intra-nuclear distribution and obstructing the interaction between Nkap and Hdac3, thereby leading to CHD."
      explanation: Functional evidence behind the likely-pathogenic call.
  - name: p.Arg204Ser
    description: >-
      ENST00000371410.5:c.612A>C, p.Arg204Ser in exon 4, outside the exon 8-9
      cluster, found by whole-genome sequencing in a 12-year-old with the full
      Marfanoid-intellectual disability picture. Classified as a variant of
      uncertain significance; its pathogenicity requires further analysis.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:41917976
      reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pathogenicity of the nucleotide variant of exon 4 of NKAP requires further analysis."
      explanation: The authors' own classification of the variant.
diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis rests on identifying a hemizygous NKAP missense variant, in
    practice by trio exome or whole-genome sequencing, in a male with intellectual
    disability and a Marfanoid habitus. The clinical picture overlaps the
    broadly defined Lujan-Fryns phenotype, and an NKAP variant was found in one
    of 28 males with that tentative diagnosis.
  diagnosis_term:
    preferred_term: trio exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:42481913
    reference_title: "Resolution of the Diagnostic Odyssey in a Familial Form of Hackmann-Di Donato Syndrome With Structural Brain Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present a further familial case of Hackmann-Di Donato syndrome involving an inherited pathogenic NKAP variant, identified through trio exome sequencing."
    explanation: Trio exome sequencing as the diagnostic route.
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, the case illustrates the need to test male patients with a Marfanoid phenotype and intellectual disability for mutations in NKAP."
    explanation: States the clinical indication for NKAP testing.
  - reference: PMID:26358559
    reference_title: "Tentative clinical diagnosis of Lujan-Fryns syndrome--A conglomeration of different genetic entities?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-exome sequencing of four individuals revealed private or non-recurrent mutations in NKAP and LAS1L in one patient each."
    explanation: Places NKAP in the differential of the Lujan-Fryns phenotype before the syndrome was delineated.
treatments:
- name: Genetic counselling
  description: >-
    X-linked recessive counselling for the family, including carrier testing of
    the mother and at-risk female relatives; familial transmission is documented.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42481913
    reference_title: "Resolution of the Diagnostic Odyssey in a Familial Form of Hackmann-Di Donato Syndrome With Structural Brain Abnormalities."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these cases, evidence of familial transmission has been documented in five individuals from three unrelated families."
    explanation: Documented inherited cases are the basis for counselling and carrier testing.
- name: Multidisciplinary supportive care
  description: >-
    No disease-specific therapy exists. Management is supportive and follows the
    case-level surveillance plan given to one reported proband: regular
    cardiology follow-up with annual echocardiography for mitral valve prolapse
    and aortic root diameter, orthopaedic care with physical therapy for
    scoliosis, joint hypermobility and recurrent dislocation, neurological
    follow-up with EEG where epilepsy is present (the proband's absence
    epilepsy was treated with ethosuximide), ophthalmological examination, and
    neuropsychological assessment with ongoing educational support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular cardiology follow-up with annual echocardiograms to monitor the mitral valve prolapse and aortic root diameter."
    explanation: Cardiac surveillance element of the single-proband plan.
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Orthopedic care for scoliosis, joint hypermobility, and habitual dislocation, including physical therapy."
    explanation: Orthopaedic element of the single-proband plan.
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Continued neurology management with routine electroencephalography (EEG) monitoring to manage his absence epilepsy."
    explanation: Neurological element of the single-proband plan.
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropsychological assessment and ongoing educational support owing to his borderline intellectual functioning."
    explanation: Developmental element of the single-proband plan.
  notes: >-
    No management study or guideline exists for this syndrome; the only
    published management is the surveillance plan recorded for one proband,
    quoted above.
- name: Ethosuximide for absence epilepsy
  description: >-
    In the one proband with absence epilepsy, seizures were treated with
    valproic acid and ethosuximide from age 5, valproate was withdrawn at 6, and
    remission has been maintained on ethosuximide since age 11. Single-case
    management of a feature not confirmed as part of the syndrome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethosuximide
      term:
        id: CHEBI:4887
        label: ethosuximide
  target_phenotypes:
  - preferred_term: Absence seizures
    term:
      id: HP:0002121
      label: Generalized non-motor (absence) seizure
  evidence:
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remission has been maintained since the age of 11 years, and the patient is currently receiving 1000 mg/day of ethosuximide."
    explanation: Single-case treatment and outcome.
animal_models:
- name: nkap C-terminal truncation zebrafish
  species: Zebrafish
  genotype: nkap mutant with C-terminally truncated NKAP
  publication: PMID:31587868
  description: Zebrafish carrying a C-terminally truncated nkap allele show severe developmental defects.
  evidence:
  - reference: PMID:31587868
    reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with a role for the C-terminal region of NKAP in embryogenesis, nkap mutant zebrafish with a C-terminally truncated NKAP demonstrate severe developmental defects."
    explanation: Establishes the model and its developmental phenotype.
  modeled_mechanisms:
  - target: NKAP C-terminal Missense Variant
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: Removes the C-terminal region in which the human missense variants cluster and produces developmental defects; it perturbs the region rather than reproducing a missense lesion.
    limitations: >-
      The allele is a truncation removing the C-terminal region, not a missense
      change within it, so it may behave as a null where the human alleles retain
      protein; the developmental phenotype is not resolved into the human
      neurodevelopmental or skeletal features.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent with a role for the C-terminal region of NKAP in embryogenesis, nkap mutant zebrafish with a C-terminally truncated NKAP demonstrate severe developmental defects."
      explanation: The authors use the model to support the C-terminal region's developmental role, which is the node it is linked to.
- name: Nkap mutant mouse (hemizygous males)
  species: Mouse
  genotype: Nkap c.5_127del (p.Ala2_Gly43del), in-frame 123 bp deletion in exon 1 (N-terminal RS domain), hemizygous males
  publication: PMID:41828556
  description: >-
    CRISPR/Cas9-generated in-frame deletion in the N-terminal RS domain, not the
    C-terminal region mutated in humans. Hemizygous males show altered gait on
    CatWalk analysis, read by the authors as consistent with the hypotonia of
    affected humans, but normal weight and size and normal bone length and
    structure on X-ray, so the Marfanoid skeletal phenotype is not reproduced.
    Embryonic fibroblasts from mutant embryos proliferate poorly and senesce,
    and heterozygous females show skewed X-inactivation against the mutant
    allele.
  evidence:
  - reference: PMID:41828556
    reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gait analysis studies conducted in male mice hemizygous for mutant NKAP by the CatWalk XT system revealed significant alterations in gait parameters, consistent with hypotonia reported in human mutant NKAP patients."
    explanation: Establishes the model and its motor phenotype.
  modeled_mechanisms:
  - target: Impaired Neurodevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Gait alteration is the only neurological readout and is interpreted as a hypotonia correlate.
    limitations: >-
      Gait parameters are an indirect proxy for hypotonia; cognition was not
      assessed, and the engineered allele is described as deleterious rather
      than matching a patient missense variant.
    evidence:
    - reference: PMID:41828556
      reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Gait analysis studies conducted in male mice hemizygous for mutant NKAP by the CatWalk XT system revealed significant alterations in gait parameters, consistent with hypotonia reported in human mutant NKAP patients."
      explanation: The authors read the gait change as a hypotonia correlate; that it reflects a neurodevelopmental defect is their inference and ours.
    readouts:
    - name: CatWalk XT gait parameters
      target: Impaired Neurodevelopment
      direction: ALTERED
      interpretation: Motor correlate of the hypotonia seen in affected males.
      evidence:
      - reference: PMID:41828556
        reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gait analysis studies conducted in male mice hemizygous for mutant NKAP by the CatWalk XT system revealed significant alterations in gait parameters, consistent with hypotonia reported in human mutant NKAP patients."
        explanation: Reports the gait measurement.
  - target: Reduced Cellular Proliferation and Senescence
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Embryonic fibroblasts from this model are the source of the proliferation and senescence observation.
    limitations: >-
      The allele is an N-terminal in-frame deletion, so the result shows what a
      deleterious Nkap allele does to mouse cells, not what the human C-terminal
      missense alleles do; fidelity to the human disease is unknown.
    evidence:
    - reference: PMID:41828556
      reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Murine embryonic fibroblasts (MEFs) derived from a hemizygous mutant NKAP embryo exhibited markedly reduced proliferation rate and increased senescence compared to WT NKAP MEFs"
      explanation: The measurement made in cells derived from this model.
  - target: Skewed X-Inactivation in Heterozygous Females
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Heterozygous females reproduce the skewed X-inactivation documented in a human NKAP carrier.
    evidence:
    - reference: PMID:41828556
      reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "XCI pattern analysis using methylation-sensitive restriction enzymes demonstrated that mutant NKAP/HA females exhibited significant XCI skewing of the X chromosome bearing the mutant NKAP copy."
      explanation: The skewing is measured directly in the model.

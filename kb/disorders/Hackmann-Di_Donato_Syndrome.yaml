name: Hackmann-Di Donato Syndrome
creation_date: "2026-10-15T18:30:00Z"
category: Mendelian
description: >-
  Hackmann-Di Donato syndrome (MRXSHD) is an X-linked syndromic intellectual
  developmental disorder caused by hemizygous missense variants in NKAP, which
  encodes NF-kappa-B activating protein, a ubiquitously expressed nucleoplasmic
  transcriptional regulator that acts in an HDAC3-containing corepressor complex
  and associates with the post-catalytic spliceosome. The reported variants
  cluster in the C-terminal region that mediates those interactions. Affected
  males show a highly conserved picture of developmental delay and intellectual
  disability, hypotonia, a Marfanoid habitus with tall stature, arachnodactyly
  and joint hypermobility, scoliosis, joint contractures, behavioural
  abnormalities, a recognisable facial gestalt (long face, high palate, large
  protruding ears, epicanthus, short philtrum) and, in a majority, congenital
  cardiovascular anomalies. Fewer than twenty affected individuals have been
  reported, including two fetuses ascertained through severe congenital heart
  defects. Patient-derived cells carry a transcriptome signature of downregulated
  long, exon-rich genes, which is the mechanistic basis currently proposed.
synonyms:
- intellectual developmental disorder, X-linked, syndromic, Hackmann-Di Donato type
- Hackman-Di Donato syndrome
- NKAP-related syndrome
- NKAP-related syndromic intellectual disability
- MRXSHD
disease_term:
  preferred_term: Hackmann-Di Donato syndrome
  term:
    id: MONDO:0026733
    label: intellectual developmental disorder, X-linked, syndromic, Hackmann-Di Donato type
parents:
- X-linked syndromic intellectual disability
notes: >-
  No GeneReviews or StatPearls chapter exists for this disorder (Bookshelf index
  snapshot 2026-09-10). ClinGen has not published a gene-disease validity
  classification for NKAP (gene_validity export pinned 2026-10-04 in
  data/clingen/MANIFEST.yaml), so gene_disease_validity is absent. The
  phenotype frequencies in this entry are those of the ten affected males of
  the original cohort (Fiordaliso et al. 2019), as tabulated against a later
  proband by Semyachkina et al. 2026, whose comparison table is quoted as the
  evidence for each count. The condition sits in the differential of
  Lujan-Fryns syndrome: an NKAP variant was found by X-exome sequencing in one
  of 28 males carrying a tentative clinical diagnosis of Lujan-Fryns syndrome
  before the syndrome was delineated.
inheritance:
- name: X-linked recessive
  description: >-
    Hemizygous males are affected. Familial transmission from unaffected or
    much less severely affected heterozygous mothers has been documented in
    several families; the remaining cases in the original cohort were apparently
    de novo, and one pair of affected brothers born to an unaffected mother
    indicates maternal germline mosaicism, so an apparently de novo case still
    carries a recurrence risk. In a mouse
    model, females heterozygous for a deleterious Nkap allele show extreme
    skewing of X-chromosome inactivation against the mutant-bearing X, which
    offers a mechanism for the unaffected carrier state; the same phenomenon has
    unmasked haemophilia A in a human carrier of a disruptive NKAP variant.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:42481913
    reference_title: "Resolution of the Diagnostic Odyssey in a Familial Form of Hackmann-Di Donato Syndrome With Structural Brain Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these cases, evidence of familial transmission has been documented in five individuals from three unrelated families."
    explanation: Documents inherited (maternal) transmission consistent with X-linked recessive inheritance.
  - reference: PMID:41828556
    reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "XCI pattern analysis using methylation-sensitive restriction enzymes demonstrated that mutant NKAP/HA females exhibited significant XCI skewing of the X chromosome bearing the mutant NKAP copy."
    explanation: Shows in mice that the mutant-NKAP X is preferentially inactivated in heterozygous females, explaining why carrier females are unaffected.
  - reference: PMID:41828556
    reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "We have previously reported that a disruptive NKAP mutation resulted in extremely skewed X chromosome inactivation (XCI), leading to phenotypic manifestation of hemophilia A (HA) in a HA carrier."
    explanation: The human observation of NKAP-driven X-inactivation skewing in a heterozygous female, restated in this paper's introduction.
pathophysiology:
- name: NKAP C-terminal Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Hemizygous missense variants in NKAP, clustered in exons 8 and 9 encoding the
    conserved C-terminal (DUF926) region through which NKAP binds HDAC3 and
    post-catalytic spliceosomal proteins. Reported alleles include p.Arg330Cys,
    p.Arg330His, p.Arg333Gln, p.Ile337Thr and p.Arg361Gln. One proband carried an
    exon 4 variant (p.Arg204Ser) of uncertain significance, which, if confirmed,
    would widen the mutational spectrum beyond the C-terminal cluster.
  genes:
  - preferred_term: NKAP
    term:
      id: hgnc:29873
      label: NKAP
  molecular_functions:
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  - preferred_term: histone deacetylase binding
    term:
      id: GO:0042826
      label: histone deacetylase binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    description: >-
      Hemizygous missense alleles in males. The functional category is not
      established: transfected p.Arg330Cys lowers NKAP transcript but not protein
      and disturbs HDAC3 binding and intranuclear distribution, consistent with a
      partial loss of corepressor function rather than a null.
  evidence:
  - reference: PMID:31587868
    reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations are clustered in the C-terminal region of NKAP where NKAP interacts with HDAC3 and post-catalytic spliceosomal complex proteins."
    explanation: Establishes the C-terminal clustering of the causal missense variants and the interaction surfaces they fall on.
  - reference: PMID:41917976
    reference_title: "Marfanoid phenotype with intellectual disability associated with NKAP mutation: a case report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "All previously reported patients had mutations located in exons 8 and 9 of NKAP."
    explanation: Localises the established variant cluster to exons 8 and 9.
  downstream:
  - target: Loss of NKAP-HDAC3 Corepressor Complex Function
    causal_link_type: DIRECT
    description: The recurrent p.Arg330Cys allele disturbs NKAP binding to HDAC3 and its intranuclear distribution.
    evidence:
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Additionally, our research determined that NKAP p.R330C affected Nkap protein intra-nuclear distribution, and binding with Hdac3."
      explanation: Directly links a patient allele to loss of the HDAC3 interaction in transfected cells.
  - target: Perturbed Spliceosomal Exon-Ligation Association
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The variant cluster lies in the region that contacts the post-catalytic
      spliceosome; a functional consequence for splicing is inferred, not yet shown.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations are clustered in the C-terminal region of NKAP where NKAP interacts with HDAC3 and post-catalytic spliceosomal complex proteins."
      explanation: The spliceosome-contacting region is the one mutated; the step from location to functional perturbation is an inference.
  - target: Reduced Cellular Proliferation and Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown only for a mouse allele that is an in-frame 123 bp deletion in exon
      1 (N-terminal RS domain), not a C-terminal missense change; whether the
      human alleles produce the same cellular defect is untested.
    evidence:
    - reference: PMID:41828556
      reference_title: "Deleterious NKAP Mutations Are Associated with Musculoskeletal Abnormalities in Hemizygous Males and Skewed X Chromosome Inactivation in Heterozygous Females."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Murine embryonic fibroblasts (MEFs) derived from a hemizygous mutant NKAP embryo exhibited markedly reduced proliferation rate and increased senescence compared to WT NKAP MEFs"
      explanation: A deleterious Nkap allele produces the defect in primary mouse cells; the inference to the human C-terminal missense alleles is the step not yet made.
- name: Loss of NKAP-HDAC3 Corepressor Complex Function
  biological_scale: MOLECULAR
  description: >-
    NKAP is a transcriptional repressor that associates with histone deacetylase 3
    and with the Notch corepressor complex, and it must bind HDAC3 to act in T
    cell maturation and haematopoietic stem cell survival. Mutant NKAP loses
    HDAC3 binding and mislocalises within the nucleus, so corepressor activity at
    NKAP target genes, including Notch targets, is expected to fall.
  molecular_functions:
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  - preferred_term: histone deacetylase binding
    term:
      id: GO:0042826
      label: histone deacetylase binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: negative regulation of Notch signaling pathway
    term:
      id: GO:0045746
      label: negative regulation of Notch signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:19409814
    reference_title: "NKAP is a transcriptional repressor of notch signaling and is required for T cell development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "NKAP associated with the histone deacetylase HDAC3 and was shown to be part of a DNA-binding complex, as demonstrated by chromatin immunoprecipitation. NKAP also associated with the Notch corepressor complex."
    explanation: Defines the HDAC3 and Notch-corepressor interactions of wild-type NKAP that the C-terminal variants disturb; the disease relevance is inferred.
  - reference: PMID:38647244
    reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent mechanistic exploration revealed a marked downregulation of NKAP transcription within HEK293T cells transfected with NKAP p.R330C. However, no significant change was observed at the protein level."
    explanation: Shows the recurrent allele does not abolish the protein, supporting a qualitative loss of complex function rather than absence.
  downstream:
  - target: Dysregulated Cardiac Morphogenesis Gene Expression
    causal_link_type: DIRECT
    description: >-
      The authors attribute the cardiac gene dysregulation produced by p.Arg330Cys
      to the allele's altered intranuclear distribution and obstructed HDAC3
      binding.
    evidence:
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings also provide evidence of NKAP p.R330C pathogenicity and demonstrate the potential mechanism by which p.R330C dysregulates cardiac developmental gene transcription by altering Nkap intra-nuclear distribution and obstructing the interaction between Nkap and Hdac3, thereby leading to CHD."
      explanation: States the causal route from lost HDAC3 interaction to cardiac gene dysregulation.
  - target: Transcriptional Dysregulation of Long Exon-rich Genes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of corepressor function is the proposed route to the patient transcriptome signature.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "NKAP is a ubiquitously expressed nucleoplasmic protein that is currently known as a transcriptional regulatory molecule via its interaction with HDAC3 and spliceosomal proteins."
      explanation: Frames NKAP's transcriptional role as HDAC3-dependent, which is the basis for reading the signature as a corepressor defect.
- name: Perturbed Spliceosomal Exon-Ligation Association
  biological_scale: MOLECULAR
  description: >-
    NKAP is a nuclear speckle protein that, with CACTIN and SDE2, stabilises the
    catalytic conformation of the human post-catalytic spliceosome during exon
    ligation. The disease variants fall in the region that mediates this
    association, so a splicing contribution to the transcriptome signature is
    plausible but has not been demonstrated in patient cells.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:30705154
    reference_title: "A human postcatalytic spliceosome structure reveals essential roles of metazoan factors for exon ligation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "CACTIN, SDE2, and NKAP-factors implicated in alternative splicing-further stabilize the catalytic conformation of the spliceosome during exon ligation."
    explanation: Structural evidence for NKAP's role in exon ligation in the wild-type spliceosome; the effect of the disease alleles is inferred.
  downstream:
  - target: Transcriptional Dysregulation of Long Exon-rich Genes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A defect in exon ligation would be expected to bear hardest on long genes
      with many exons, which is the class the patient signature downregulates.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In affected cases, transcriptome analysis revealed the presence of a unique transcriptome signature, which is characterized by the downregulation of long genes with higher exon numbers."
      explanation: The exon-number dependence of the signature is the observation that makes a splicing contribution plausible; it does not prove it.
- name: Transcriptional Dysregulation of Long Exon-rich Genes
  biological_scale: CELLULAR
  description: >-
    Transcriptome analysis of cells from affected individuals shows a distinctive
    signature in which long genes with higher exon numbers are downregulated.
    This is the defining cellular phenotype of the disorder and the reason it is
    described as a disorder of transcriptional regulation.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31587868
    reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In affected cases, transcriptome analysis revealed the presence of a unique transcriptome signature, which is characterized by the downregulation of long genes with higher exon numbers."
    explanation: Direct report of the transcriptome signature in affected individuals.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Perturbation of the NKAP C-terminal region produces developmental defects
      in humans and zebrafish; which dysregulated transcripts drive the
      neurodevelopmental phenotype is not known.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations indicate the critical role of NKAP in transcriptional regulation and demonstrate that perturbations of the C-terminal region lead to developmental defects in both humans and zebrafish."
      explanation: Connects the transcriptional defect to developmental consequences without resolving the intermediates.
  - target: Abnormal Skeletal and Connective Tissue Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The Marfanoid skeletal picture is attributed to the same transcriptional
      defect; no connective-tissue target gene has been identified.
    evidence:
    - reference: PMID:31587868
      reference_title: "Missense Mutations in NKAP Cause a Disorder of Transcriptional Regulation Characterized by Marfanoid Habitus and Cognitive Impairment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations indicate the critical role of NKAP in transcriptional regulation and demonstrate that perturbations of the C-terminal region lead to developmental defects in both humans and zebrafish."
      explanation: The skeletal features are part of the developmental defects the paper attributes to the transcriptional disorder.
- name: Dysregulated Cardiac Morphogenesis Gene Expression
  biological_scale: CELLULAR
  description: >-
    NKAP p.Arg330Cys dysregulates transcription of cardiac morphogenesis genes
    including DHRS3, DNAH11 and JAG1, which the authors attribute to lost HDAC3
    binding and mislocalisation of the mutant protein, offering a route to the
    congenital heart defects seen in a majority of affected males and in both
    reported fetuses. DHRS3 moved in the opposite direction in patient
    lymphoblastoid cells, so the direction of individual gene changes is not
    settled.
  biological_processes:
  - preferred_term: heart morphogenesis
    term:
      id: GO:0003007
      label: heart morphogenesis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38647244
    reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the mutation led to a dysregulation in the transcription of genes associated with cardiac morphogenesis, such as DHRS3, DNAH11 and JAG1."
    explanation: Reports the cardiac developmental gene dysregulation produced by the patient allele.
  downstream:
  - target: Congenital heart defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed explanation for the fetal and postnatal cardiac malformations.
    evidence:
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "An NKAP mutation (NM_024528.4: c.988C>T, p.Arg330Cys) was identified in two foetuses presenting with CHD."
      explanation: The same allele studied in vitro was found in fetuses with congenital heart disease; causation of the malformation by the transcriptional change is inferred.
  - target: Ventricular septal defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The authors' proposed route from p.Arg330Cys to the septal and outflow malformations seen in the fetuses.
    evidence:
    - reference: PMID:38647244
      reference_title: "From phenotype to mechanism: Prenatal spectrum of NKAP mutation-related disorder and its pathogenesis inducing congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "R330C-induced CHD: the mutation alters Nkap protein intra-nuclear distribution and inhibits its binding to Hdac3 protein, thereby disrupting the transcription of cardiac development-related genes and ultimately leading to CHD, manifested as ventricular septal defect, overriding aorta and pulmonary stenosis (Figure 4C)."
      explanation: The authors' model statement; the last step to the malformation is inferred from the in vitro result.
- name: Impaired Neurodevelopment
  biological_scale: TISSUE
  description: >-
    NKAP is highly expressed in neural progenitor cells and migrating neuroblasts
    of the mammalian subventricular zone and in mature neurons of several regions,
    and the syndrome is grouped with the nuclear speckleopathies, in which
    developmental disability is the shared feature. The neuroanatomical basis of
    the intellectual disability is largely unexamined; white matter lesions were
    found in one familial case.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24583034
    reference_title: "The Notch co-repressor protein NKAP is highly expressed in adult mouse subventricular zone neural progenitor cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "NKAP is highly expressed in Mash1(+) transit amplifying cells and PSA-NCAM(+) migrating neuroblasts throughout the subventricular zone (SVZ) and the rostral migratory stream (RMS), as well as in the hippocampus."
    explanation: Expression in neurogenic progenitors makes neurodevelopment a plausible site of action; it does not itself show a defect.
  - reference: PMID:36929417
    reference_title: "Nuclear speckleopathies: developmental disorders caused by variants in genes encoding nuclear speckle proteins."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, developmental disabilities are commonly seen in individuals with nuclear speckleopathies, suggesting the particular importance of nuclear speckles in ensuring normal neurocognitive development."
    explanation: Places NKAP-related syndrome among the nuclear speckleopathies whose shared feature is developmental disability.
  downstream:

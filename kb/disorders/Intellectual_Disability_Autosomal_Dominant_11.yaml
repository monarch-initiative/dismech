name: Intellectual Disability, Autosomal Dominant 11
creation_date: "2026-09-28T17:30:00Z"
category: Mendelian
synonyms:
- MRD11
- mental retardation, autosomal dominant 11
- autosomal dominant intellectual disability 11
- autosomal dominant mental retardation 11
- mental retardation, autosomal dominant type 11
- autosomal dominant non-syndromic intellectual disability 11
- EPB41L1 autosomal dominant non-syndromic intellectual disability
- autosomal dominant non-syndromic intellectual disability caused by mutation in EPB41L1
description: >-
  Intellectual disability, autosomal dominant 11 (MRD11) is a provisional
  gene-disease association resting on a single patient: a boy with severe
  nonsyndromic intellectual disability who carries a de novo heterozygous
  missense variant, p.Pro854Ser, in EPB41L1. EPB41L1 encodes protein 4.1N, a
  neuron-enriched FERM-domain adaptor that links membrane receptors to the
  spectrin-actin cytoskeleton and binds the AMPA receptor subunit GluA1
  (GluR1) through its C-terminal domain. In cultured cells the variant halves
  4.1N binding to GluA1 and lowers surface GluA1 in neurons, and acute 4.1N
  knockdown in mouse hippocampus impairs the maintenance of long-term
  potentiation without changing basal transmission. The rodent evidence is not
  consistent, however: 3-week-old mice with 4.1N reduced to about a fifth of
  normal (and no 4.1G) have normal glutamatergic transmission and long-term
  potentiation, and in rat dentate gyrus granule neurons the C-terminal domain
  carrying the patient's variant was dispensable for 4.1N's synaptic role,
  whereas the FERM domain was needed for synaptic AMPA receptors. No second
  patient has been published, so both the gene-disease link and the mechanism
  remain unconfirmed.

discussions:
- discussion_id: mrd11_single_patient
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#EPB41L1
  prompt: >-
    Do de novo EPB41L1 variants cause intellectual disability, or was the
    single reported variant incidental?
  rationale: >-
    The association rests on one de novo missense variant found in a
    candidate-gene screen of 95 patients, supported by cell-culture assays.
    A targeted screen of 50 further patients found no second de novo EPB41L1
    variant, and no replication has been published in PubMed since 2011. Additional
    patients with de novo EPB41L1 variants from large exome cohorts, ideally
    with a shared phenotype, would confirm or refute the association.
- discussion_id: mrd11_rodent_synapse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Glutamatergic Synapse Function and Plasticity
  prompt: >-
    Why do rodent studies disagree on whether 4.1N is needed for glutamatergic
    synapse function, and does the patient's C-terminal variant act through
    the same route?
  rationale: >-
    Acute 4.1N knockdown in 6-week-old mice impairs the maintenance of
    long-term potentiation, yet 3-week-old mice with 4.1N at 22% of normal
    have normal transmission and long-term potentiation; the authors of the
    knockdown study attribute the difference to age and to developmental
    compensation that acute knockdown avoids. The CA1 null results may also
    reflect very low 4.1N expression in CA1 pyramidal neurons. In rat dentate gyrus
    granule neurons, 4.1N knockdown reduces synapses, but the C-terminal
    domain is dispensable and the FERM domain is needed for synaptic AMPA
    receptors. If the C-terminal domain is
    dispensable for the synaptic role, a C-terminal missense variant may act
    through another 4.1N partner or not be pathogenic. A knock-in model of
    the patient variant, examined in dentate gyrus as well as CA1, would
    resolve this.
notes: >-
  The gene-disease association is weak. The phenotype rests on one published
  patient (PMID:21376300). As of September 2026, GenCC submitters classify the
  EPB41L1 relationship as Limited (ClinGen gene page, HGNC:3378), and the
  Genomics England PanelApp intellectual disability panel lists the phenotype
  as "?Mental retardation, autosomal dominant 11 614257", using OMIM's
  question-mark notation for a provisional gene-phenotype relationship.

  Hypotonia, absence of seizures and a normal brain MRI are reported for the
  patient in OMIM 602879 but are not stated in the text of the primary paper,
  so they are not curated here. A second de novo missense variant
  (p.Glu619Asp) is reported in a pediatric nephrology case report that is not
  indexed in PubMed; it is unverified and not included.

  No GeneReviews chapter covers MRD11. No disease-specific treatment exists.

differential_diagnoses:
- name: 20q11.2 microdeletion syndrome
  description: >-
    Proximal 20q11.2 deletions that include EPB41L1 cause a contiguous-gene
    syndrome with developmental delay, growth retardation, feeding
    difficulties and facial dysmorphism. EPB41L1 lay in the originally
    proposed critical region, but a 2024 refinement named GDF5 as the primary
    candidate gene, so the deletion syndrome does not establish EPB41L1
    dosage sensitivity. Chromosomal microarray distinguishes it.
  evidence:
  - reference: PMID:38511524
    reference_title: "Clinical and molecular cytogenetic studies of five new patients with 20q11q12 deletion and review of the literature: Proposition of two critical regions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 1.62 Mb minimal critical region at 20q11.2, encompassing three genes GDF5, EPB41L1, and SAMHD1, is proposed to be responsible for this syndrome."
    explanation: >-
      EPB41L1 lies in the originally proposed critical region.
  - reference: PMID:38511524
    reference_title: "Clinical and molecular cytogenetic studies of five new patients with 20q11q12 deletion and review of the literature: Proposition of two critical regions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose GDF5 to be the primary candidate gene generating the phenotype of patients with 20q11.2 deletions."
    explanation: >-
      The refined analysis points to GDF5 rather than EPB41L1.
- name: Other de novo glutamatergic synaptic gene disorders
  description: >-

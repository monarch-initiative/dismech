- name: Impaired Glutamatergic Synapse Function and Plasticity
  biological_scale: CELLULAR
  description: >-
    Impaired maintenance of long-term potentiation at excitatory synapses, the
    proposed basis for the cognitive phenotype; basal transmission is normal
    when 4.1N is knocked down in CA1. Separately, 4.1N knockdown reduces
    synapse number and function in dentate gyrus granule neurons, where the
    C-terminal domain is dispensable and the FERM domain is needed for
    synaptic AMPA receptors. A mouse lacking 4.1G with 4.1N at 22% of normal
    has normal basal transmission and long-term potentiation at 3 weeks.

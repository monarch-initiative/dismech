name: Helicobacter Pylori Infectious Disease
creation_date: "2026-09-30T08:09:19Z"
description: >-
  Helicobacter pylori infectious disease is a chronic acquired bacterial
  infection of the human gastric mucosa caused by the urease-producing
  Gram-negative species Helicobacter pylori. It is usually acquired in
  childhood, persists lifelong if untreated, causes chronic active gastritis,
  and can progress through topography-dependent branches to peptic ulcer
  disease, gastric atrophy and intestinal metaplasia, gastric adenocarcinoma,
  or gastric MALT lymphoma.
category: Infectious Disease
disease_term:
  preferred_term: Helicobacter pylori infectious disease
  term:
    id: MONDO:0006781
    label: Helicobacter pylori infectious disease
parents:
- bacterial infectious disease
synonyms:
- Helicobacter pylori infection
- H. pylori infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:15345211
      reference_title: Treatment of Helicobacter pylori in Pediatrics.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Helicobacter pylori (H. pylori) is among the most common bacterial
        infections in humans.
      explanation: >-
        Identifies H. pylori infection as a common human bacterial infectious
        disease.
infectious_agent:
- name: Helicobacter pylori
  description: >-
    Helicobacter pylori is the spiral, urease-producing gastric species that
    defines Helicobacter pylori infectious disease in MONDO.
  infectious_agent_term:
    preferred_term: Helicobacter pylori
    term:
      id: NCBITaxon:210
      label: Helicobacter pylori
  evidence:
  - reference: PMID:9889978
    reference_title: The physiology and metabolism of the human gastric pathogen Helicobacter pylori.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Helicobacter pylori is a spiral Gram-negative microaerophilic bacterium
      that causes one of the most common infections in humans
    explanation: >-
      Identifies H. pylori as a spiral Gram-negative human gastric pathogen.

transmission:
- name: Childhood human-to-human gastric infection
  description: >-
    Infection is usually acquired in childhood, especially under low
    socioeconomic, crowded, or family-infected conditions, through oral-oral,
    gastric-oral, or fecal-oral exposure.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the vast majority of individuals, infection is acquired during
      childhood with those of low socioeconomic means and having infected family
      members being at highest risk for early childhood acquisition.
    explanation: >-
      Supports childhood household acquisition as the dominant epidemiologic
      route.
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Definitive routes of transmission of the infection are unclear, with
      evidence suggesting oral-oral, gastric-oral, and fecal-oral routes.
    explanation: >-
      Lists the likely person-to-person transmission modes.

environmental:
- name: Low-socioeconomic childhood household exposure
  description: >-
    Poor childhood sanitation, household crowding, and residence with infected
    family members predispose to H. pylori acquisition.
  influences_mechanisms:
  - target: Childhood Human-to-Human Exposure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Crowded or low-sanitation households increase oral, gastric, and fecal
      contact with infected family members.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Risk factors such as minimal education and low socio-economic status
      during childhood affect the prevalence.
    explanation: >-
      Supports childhood socioeconomic conditions as acquisition determinants.

pathophysiology:
- name: Childhood Human-to-Human Exposure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Oral, gastric, or fecal exposure introduces H. pylori into a susceptible
    child's stomach, where surviving bacteria can enter the gastric mucus layer.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: UreI and Urease Acid Survival
    causal_link_type: DIRECT
    description: >-
      Ingested bacteria face gastric acid and must buffer their periplasm to
      reach the mucosal niche.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If untreated, H pylori infection is lifelong.
    explanation: >-
      Establishes childhood-acquired H. pylori as a persistent chronic
      infection.
- name: UreI and Urease Acid Survival
  biological_scale: MOLECULAR
  description: >-
    Acidic periplasmic pH opens the UreI urea channel, letting gastric urea
    reach nickel-dependent cytoplasmic urease; ammonia production then buffers
    the periplasm and permits survival at the acidic gastric surface.
  downstream:
  - target: Gastric Mucus Colonization
    causal_link_type: DIRECT
    description: >-
      Acid survival gives motile bacteria time to penetrate mucus and colonize
      epithelial-surface niches.
  evidence:
  - reference: PMID:12471160
    reference_title: The gastric biology of Helicobacter pylori.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Gastric juice urea is able to rapidly access intrabacterial urease when
      the periplasmic pH falls below approximately 6.2 owing to pH-gating of a
      urea channel, UreI.
    explanation: >-
      Explains how UreI couples low pH to urea influx for urease-mediated acid
      survival.
- name: Gastric Mucus Colonization
  biological_scale: TISSUE
  description: >-
    H. pylori establishes a chronic mucus-layer reservoir overlying gastric
    epithelial cells; motility, urease, and adhesins help the organism resist
    gastric acid, avoid mucus flow, and persist at the epithelial surface.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Chronic Gastric Mucosal Inflammation
    causal_link_type: DIRECT
    description: >-
      Persistent colonization of the mucosal surface induces chronic gastric
      inflammatory infiltration.
  - target: CagA E-cadherin Binding and Beta-Catenin Release
    causal_link_type: DIRECT
    description: >-
      Colonizing cagA-positive strains deliver the CagA effector into the
      underlying gastric epithelial cells.
  - target: Phosphorylated CagA SHP-2 Activation
    causal_link_type: DIRECT
    description: >-
      Colonizing cagA-positive strains deliver the CagA effector into the
      underlying gastric epithelial cells, where it is tyrosine-phosphorylated.
  evidence:
  - reference: PMID:24914320
    reference_title: Factors that mediate colonization of the human stomach by Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Colonization of gastric mucus is likely to be key to the establishment of
      chronic infection.
    explanation: >-
      Positions gastric mucus colonization as the key step in chronic H. pylori
      infection.
- name: Chronic Gastric Mucosal Inflammation
  biological_scale: TISSUE
  description: >-
    Colonization produces chronic active inflammation in the gastric mucosa;
    the distribution of gastritis across antrum and body then determines
    whether acid output is increased, decreased, or unchanged.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Chronic active gastritis
    causal_link_type: DIRECT
    description: >-
      The mucosal inflammatory infiltrate is the histologic lesion recognised
      clinically as chronic active gastritis.
  - target: Antral Gastrin-Driven Acid Hypersecretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Antral-predominant, body-sparing gastritis increases gastrin release and
      acid secretion.
    evidence:
    - reference: PMID:9494857
      reference_title: >-
        Alterations in gastric physiology in Helicobacter pylori infection:
        causes of different diseases or all epiphenomena?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        When there is antral predominant, body-sparing gastritis, there is
        increased gastrin release and this is accompanied by increased acid
        secretion.
      explanation: >-
        Links the antral topography of H. pylori gastritis to gastrin-driven
        acid hypersecretion.
  - target: Corpus Gastritis-Induced Hypochlorhydria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Significant gastric body gastritis reduces acid secretion.
    evidence:
    - reference: PMID:9494857
      reference_title: >-
        Alterations in gastric physiology in Helicobacter pylori infection:
        causes of different diseases or all epiphenomena?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        When there is a significant body gastritis, acid secretion is reduced
        and subjects may be completely achlorhydric.
      explanation: >-
        Links body-predominant H. pylori gastritis to reduced acid output.
  - target: Gastric Mucosal Atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Long-standing inflammation leads to loss of gastric glands.
  - target: Gastric MALT lymphoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic infection-driven gastric lymphoid infiltration is the setting in
      which gastric MALT lymphoma arises.
  evidence:
  - reference: PMID:9889978
    reference_title: The physiology and metabolism of the human gastric pathogen Helicobacter pylori.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is recognized as the major aetiological factor in chronic active type B
      gastritis, and gastric and duodenal ulceration and as a risk factor for
      gastric cancer.
    explanation: >-
      Ties H. pylori infection to chronic active gastritis, ulceration, and
      gastric-cancer risk.
- name: Antral Gastrin-Driven Acid Hypersecretion
  biological_scale: ORGANISM
  description: >-
    When gastritis is antral-predominant and spares the gastric body, increased
    gastrin release increases gastric acid secretion and the acid load
    delivered to the duodenum.
  locations:
  - preferred_term: pyloric antrum
    term:
      id: UBERON:0001165
      label: pyloric antrum
  downstream:
  - target: Duodenal Ulceration
    causal_link_type: DIRECT
    description: >-
      The increased duodenal acid load produces duodenal ulcer disease.
    evidence:
    - reference: PMID:9494857
      reference_title: >-
        Alterations in gastric physiology in Helicobacter pylori infection:
        causes of different diseases or all epiphenomena?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Subjects in whom the infection produces acid hypersecretion develop
        duodenal ulcer disease due to the increased duodenal acid load.
      explanation: >-
        States that acid hypersecretion causes duodenal ulcer through the
        duodenal acid load.
  evidence:
  - reference: PMID:9494857
    reference_title: >-
      Alterations in gastric physiology in Helicobacter pylori infection:
      causes of different diseases or all epiphenomena?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When there is antral predominant, body-sparing gastritis, there is
      increased gastrin release and this is accompanied by increased acid
      secretion.
    explanation: >-
      Supports the existence of an acid-hypersecretory state in antral
      H. pylori gastritis.
- name: Duodenal Ulceration
  biological_scale: TISSUE
  description: >-
    Acid-peptic injury of the duodenal mucosa produces duodenal ulcer, the
    acid-hypersecretory branch of H. pylori disease.
  locations:
  - preferred_term: duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  downstream:
  - target: Peptic ulcer
    causal_link_type: DIRECT
    description: >-
      Duodenal ulceration is a form of peptic ulcer disease.
  - target: Epigastric pain
    causal_link_type: DIRECT
    description: >-
      Abdominal pain in H. pylori infection is linked to the presence of ulcer
      disease rather than to gastritis alone.
  evidence:
  - reference: PMID:9494857
    reference_title: >-
      Alterations in gastric physiology in Helicobacter pylori infection:
      causes of different diseases or all epiphenomena?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subjects in whom the infection produces acid hypersecretion develop
      duodenal ulcer disease due to the increased duodenal acid load.
    explanation: >-
      Supports duodenal ulcer as an outcome of H. pylori infection.
- name: Corpus Gastritis-Induced Hypochlorhydria
  biological_scale: ORGANISM
  description: >-
    Body-predominant gastritis or pangastritis reduces acid secretion and raises
    intragastric pH, which raises intragastric nitrite, lowers gastric juice
    ascorbic acid, and allows colonization by nitrosating bacteria.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Stomach cancer
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Marked hypochlorhydria is associated with increased gastric-cancer risk.
    evidence:
    - reference: PMID:9494857
      reference_title: >-
        Alterations in gastric physiology in Helicobacter pylori infection:
        causes of different diseases or all epiphenomena?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In subjects in whom the infection induces marked hypochlorhydria, there is
        an increased risk of gastric cancer.
      explanation: >-
        Supports the low-acid gastric-cancer branch of H. pylori disease.
  evidence:
  - reference: PMID:9494857
    reference_title: >-
      Alterations in gastric physiology in Helicobacter pylori infection:
      causes of different diseases or all epiphenomena?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The hypochlorhydria probably plays an important role in the carcinogenic
      process as high intragastric pH markedly raises intragastric nitrite
      levels, profoundly lowers gastric juice ascorbic acid and allows
      colonization by nitrosating bacteria.
    explanation: >-
      Describes the intragastric chemistry of H. pylori-induced hypochlorhydria.
- name: Gastric Mucosal Atrophy
  biological_scale: TISSUE
  description: >-
    Chronic H. pylori inflammation causes loss of gastric glands, the first
    premalignant rung of the atrophy-metaplasia-dysplasia cascade.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Gastric Intestinal Metaplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Atrophic mucosa is replaced by intestinal-type epithelium.
  evidence:
  - reference: PMID:38143438
    reference_title: >-
      A comparative systematic review and meta-analysis on the diagnostic
      accuracy of non-invasive tests for Helicobacter pylori detection in
      elderly patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      This Gram-negative, type I carcinogen microorganism induces chronic
      gastric mucosal inflammation, resulting in atrophic and metaplastic
      alterations.
    explanation: >-
      States that H. pylori inflammation results in atrophic and metaplastic
      gastric mucosa.
- name: CagA E-cadherin Binding and Beta-Catenin Release
  biological_scale: MOLECULAR
  description: >-
    Translocated CagA binds E-cadherin independently of its tyrosine
    phosphorylation, impairing the E-cadherin/beta-catenin complex so that
    beta-catenin accumulates in the cytoplasm and nucleus.
  downstream:
  - target: Gastric Intestinal Metaplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deregulated beta-catenin transactivates CDX1 and induces the intestinal
      goblet-cell mucin MUC2 in gastric epithelial cells.
    evidence:
    - reference: PMID:17237808
      reference_title: >-
        Helicobacter pylori CagA interacts with E-cadherin and deregulates the
        beta-catenin signal that promotes intestinal transdifferentiation in
        gastric epithelial cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        These results indicate that perturbation of the E-cadherin/beta-catenin
        complex by H. pylori CagA plays an important role in the development of
        intestinal metaplasia
      explanation: >-
        Cell-culture data link CagA-driven beta-catenin deregulation to
        intestinal transdifferentiation.
  evidence:
  - reference: PMID:17237808
    reference_title: >-
      Helicobacter pylori CagA interacts with E-cadherin and deregulates the
      beta-catenin signal that promotes intestinal transdifferentiation in
      gastric epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The CagA/E-cadherin interaction impairs the complex formation between
      E-cadherin and beta-catenin, causing cytoplasmic and nuclear accumulation
      of beta-catenin.
    explanation: >-
      Shows a cell-autonomous CagA mechanism that releases beta-catenin from
      E-cadherin.
- name: Phosphorylated CagA SHP-2 Activation
  biological_scale: MOLECULAR
  description: >-
    Translocated CagA is tyrosine-phosphorylated by Src family kinases and then
    binds and activates the SHP-2 phosphatase, inducing morphological
    transformation of gastric epithelial cells. This is the
    phosphorylation-dependent arm of CagA signaling, distinct from the
    phosphorylation-independent E-cadherin arm.
  evidence:
  - reference: PMID:17237808
    reference_title: >-
      Helicobacter pylori CagA interacts with E-cadherin and deregulates the
      beta-catenin signal that promotes intestinal transdifferentiation in
      gastric epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Tyrosine-phosphorylated CagA specifically binds to and activates SHP-2
      phosphatase, thereby inducing cell-morphological transformation.
    explanation: >-
      Background statement of the phosphorylation-dependent CagA/SHP-2 arm,
      established in earlier cell-culture work.
- name: Gastric Intestinal Metaplasia
  biological_scale: TISSUE
  description: >-
    Gastric mucosa transdifferentiates to an intestinal phenotype, a
    precancerous lesion from which intestinal-type gastric adenocarcinoma
    arises.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Stomach cancer
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intestinal metaplasia is a premalignant stage of the
      atrophy-metaplasia-dysplasia cascade to intestinal-type gastric
      adenocarcinoma.
  evidence:
  - reference: PMID:17237808
    reference_title: >-
      Helicobacter pylori CagA interacts with E-cadherin and deregulates the
      beta-catenin signal that promotes intestinal transdifferentiation in
      gastric epithelial cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Intestinal metaplasia is a precancerous lesion of the stomach
      characterized by transdifferentiation of the gastric mucosa to an
      intestinal phenotype.
    explanation: >-
      Defines intestinal metaplasia as a precancerous gastric lesion.
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      rarely, gastric atrophy with/without intestinal metaplasia (ie, both
      precursor lesions for gastric cancer)
    explanation: >-
      Places atrophy and intestinal metaplasia in infected children as
      precursor lesions for gastric cancer.

phenotypes:
- name: Chronic active gastritis
  phenotype_term:
    preferred_term: Gastritis
    term:
      id: HP:0005263
      label: Gastritis
  frequency: OBLIGATE
  description: >-
    Gastritis is the near-universal tissue response to persistent H. pylori
    colonization, even when infection is clinically silent.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Children infected with H. pylori develop histologic chronic active
      gastritis despite the fact that they are generally asymptomatic.
    explanation: >-
      Documents chronic active gastritis as the histologic consequence of
      pediatric H. pylori infection.
- name: Peptic ulcer
  phenotype_term:
    preferred_term: Peptic ulcer
    term:
      id: HP:0004398
      label: Peptic ulcer
  description: >-
    Gastric or duodenal ulceration is a minority outcome of the chronic gastric
    infection.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Helicobacter pylori infection causes gastritis and peptic ulcers and is
      associated with the development of gastric cancer.
    explanation: >-
      Lists peptic ulcer disease among H. pylori-associated gastric diseases.
- name: Epigastric pain
  phenotype_term:
    preferred_term: Epigastric pain
    term:
      id: HP:0410019
      label: Epigastric pain
  description: >-
    Symptomatic H. pylori infection can present with dyspeptic epigastric pain.
    In children, a link between H. pylori gastritis and abdominal pain has been
    established only when gastric or duodenal ulcer disease is present.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      there is no evidence demonstrating a link between H. pylori-associated
      gastritis and abdominal pain, except in rare cases in which gastric or
      duodenal ulcer disease is present.
    explanation: >-
      Ties pain in H. pylori infection to ulcer disease rather than to
      gastritis. The source speaks of abdominal pain in children, the broader
      category containing epigastric pain, so the support is indirect.
- name: Stomach cancer
  phenotype_term:
    preferred_term: Stomach cancer
    term:
      id: HP:0012126
      label: Stomach cancer
  description: >-
    Gastric adenocarcinoma is a long-term malignant outcome of chronic H. pylori
    infection and is detailed in the gastric-cancer-specific entries.
  evidence:
  - reference: PMID:35364066
    reference_title: >-
      Effect of Helicobacter pylori Eradication on Gastric Cancer Prevention:
      Updated Report From a Randomized Controlled Trial With 26.5 Years of
      Follow-up.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Participants receiving H pylori treatment had a lower incidence of gastric
      cancer compared with their placebo counterparts (hazard ratio [HR], 0.57;
      95% CI, 0.33-0.98).
    explanation: >-
      The randomized eradication effect supports H. pylori infection as an
      upstream cause of later gastric cancer.
- name: Gastric MALT lymphoma
  phenotype_term:
    preferred_term: Gastric MALT lymphoma
    term:
      id: HP:0045038
      label: Gastric lymphoma
  description: >-
    Extranodal marginal-zone (MALT) lymphoma of the stomach is a neoplastic
    outcome of chronic H. pylori infection and is detailed in the MALT
    lymphoma entry.
  notes: >-
    HPO has no MALT-lymphoma-specific term: OLS searches of the hp ontology for
    "MALT lymphoma", "mucosa-associated lymphoid tissue lymphoma" and
    "extranodal marginal zone" returned no hits, and "gastric lymphoma"
    returned HP:0045038 Gastric lymphoma, which is bound here as the closest
    accurate parent.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      children infected with H pylori may have gastritis, ulcers,
      mucosal-associated lymphoid type lymphoma
    explanation: >-
      Lists mucosa-associated lymphoid tissue lymphoma among the outcomes of
      H. pylori infection.


name: Helicobacter Pylori Infectious Disease
creation_date: "2026-09-30T08:09:19Z"
description: >-
  Helicobacter pylori infectious disease is a chronic acquired bacterial
  infection of the human gastric mucosa caused by the urease-producing
  Gram-negative species Helicobacter pylori. It is usually acquired in
  childhood, persists lifelong if untreated, causes chronic active gastritis,
  and can progress through topography-dependent branches to peptic ulcer
  disease, gastric atrophy and intestinal metaplasia, gastric adenocarcinoma,
  or gastric MALT lymphoma.
category: Infectious Disease
disease_term:
  preferred_term: Helicobacter pylori infectious disease
  term:
    id: MONDO:0006781
    label: Helicobacter pylori infectious disease
parents:
- bacterial infectious disease
synonyms:
- Helicobacter pylori infection
- H. pylori infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:

        label: bismuth subcitrate potassium
  target_mechanisms:
  - target: Gastric Mucus Colonization
    treatment_effect: INHIBITS
    description: >-
      Tailored rescue therapy targets bacteria that survived first-line
      antibiotic selection.
  evidence:
  - reference: PMID:29600697
    reference_title: >-
      Pharmacological considerations and step-by-step proposal for the treatment
      of Helicobacter pylori infection in the year 2018.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Options after initial eradication failure include tailored therapy
      (choosing antibiotic combinations based on antibiotic susceptibility
      testing), empiric bismuth-containing quadruple therapy or triple
      levofloxacin-based therapy.
    explanation: >-
      Supports susceptibility-guided or alternative empiric rescue regimens
      after failed H. pylori eradication.
  - reference: PMID:41966313
    reference_title: >-
      Mutation-driven mechanisms underlying antibiotic resistance of
      Helicobacter pylori in Asia: A systematic review and meta-analysis
      (2000-2024).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clarithromycin resistance in H. pylori is mainly driven by A2142G/A2143G
      mutations (19-34%), while metronidazole resistance exceeds 84% in East
      Asia via rdxA mutations.
    explanation: >-
      Documents mutation-mediated antibiotic resistance as a mechanism that
      rescue or tailored therapy must account for.

review_notes: >-
  Duplicate preflight found no Helicobacter Pylori Infectious Disease entry by
  MONDO:0006781 or exact label in an ignored-inclusive local search under
  kb/disorders, stubs, research, and history/disorders, and no exact label or
  MONDO:0006781 entry on origin/main; broad H. pylori searches found many
  downstream gastric cancer and lymphoma mentions plus
  Gastric_Cancer_H_pylori_Associated, but not the organism-defined infection
  itself. Exact GitHub issue/PR searches for the label returned no matches, and
  the MONDO:0006781 PR search only found an unrelated lexical hit. Deep research
  requested falcon but fell back to OpenScientist, producing
  research/Helicobacter_Pylori_Infectious_Disease-deep-research-openscientist.md
  with 43/43 references resolved and 37/43 judged on-topic. The report passed
  manual identity review after preflight-dr returned SKIP for this non-Mendelian
  MONDO term. The report's HP:0031273 chronic gastritis, HP:0011834 symptom, and
  HP:0025439 dyspepsia bindings were wrong and rebound to HP:0005263 Gastritis
  or HP:0410019 Epigastric pain as appropriate; its MALT lymphoma binding
  HP:0012190 is T-cell lymphoma, so that phenotype is bound to HP:0045038
  Gastric lymphoma instead.
  Neoplasm-specific mechanisms were deliberately kept shallow because gastric
  adenocarcinoma, H. pylori-associated gastric cancer, and MALT lymphoma are
  curated as separate entries.

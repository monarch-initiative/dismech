      reference_title: Treatment of Helicobacter pylori in Pediatrics.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Helicobacter pylori (H. pylori) is among the most common bacterial
        infections in humans.
      explanation: >-
        Identifies H. pylori infection as a common human bacterial infectious
        disease.
infectious_agent:

    reference_title: >-
      Trends in Helicobacter pylori prevalence, force of infection, and
      attributable disease burden in China: a systematic review and Bayesian
      modelling study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, population prevalence declined only modestly, from 43.1% (95%
      credible interval 39.1-47.4) in 1990 to 36.3% (33.2-39.6) in 2023.
    explanation: >-
      Reports the modelled 2023 population prevalence of H. pylori in China.

progression:
- phase: Childhood acquisition
  notes: >-
    Infection is usually acquired in childhood and, if untreated, persists for
    life.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the vast majority of individuals, infection is acquired during
      childhood with those of low socioeconomic means and having infected family
      members being at highest risk for early childhood acquisition.
    explanation: >-
      Places acquisition of the infection in childhood.
- phase: Clinically silent chronic active gastritis
  notes: >-
    Colonized individuals develop histologic chronic active gastritis, usually
    without symptoms.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Children infected with H. pylori develop histologic chronic active
      gastritis despite the fact that they are generally asymptomatic.
    explanation: >-
      Describes the asymptomatic chronic gastritis phase of infection.
- phase: Late clinical disease
  notes: >-
    Clinical disease (peptic ulcer, MALT lymphoma, or the atrophy and
    intestinal metaplasia that precede gastric cancer) typically appears
    decades after acquisition.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although clinical disease typically occurs decades after initial
      infection acquisition
    explanation: >-
      Places clinical disease decades after childhood acquisition.

diagnosis:
- name: Urea breath, stool antigen, serology, and endoscopic testing
  description: >-
    Urea breath testing, monoclonal stool antigen testing, serology, and
    endoscopic biopsy-based assays are used to detect H. pylori, with urea
    breath and stool antigen tests identifying active infection more directly
    than serology.
  evidence:
  - reference: PMID:38143438
    reference_title: >-
      A comparative systematic review and meta-analysis on the diagnostic
      accuracy of non-invasive tests for Helicobacter pylori detection in
      elderly patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pooled sensitivity and specificity for HpSA were 72.5 and 94.7%, for
      Serology 83.7 and 73.3%, and for UBT 96.4 and 88.3%, respectively.
    explanation: >-
      Quantifies noninvasive stool-antigen, serology, and urea-breath diagnostic
      performance in a systematic review and meta-analysis.

treatments:
- name: Acid suppression plus multidrug eradication therapy
  description: >-
    H. pylori is eradicated with a proton pump inhibitor or the
    potassium-competitive acid blocker vonoprazan plus two or three
    antibiotics. An empiric clarithromycin-based regimen (with amoxicillin or
    metronidazole) is used where
    clarithromycin resistance is low; bismuth-containing quadruple therapy
    (bismuth, metronidazole, and tetracycline) is first choice where
    resistance is high or after prior clarithromycin exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:

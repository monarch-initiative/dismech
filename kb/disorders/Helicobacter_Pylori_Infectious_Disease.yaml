    reference_title: The physiology and metabolism of the human gastric pathogen Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Helicobacter pylori is a spiral Gram-negative microaerophilic bacterium
      that causes one of the most common infections in humans
    explanation: >-
      Identifies H. pylori as a spiral Gram-negative human gastric pathogen.

transmission:
- name: Childhood human-to-human gastric infection
  description: >-
    Infection is usually acquired in childhood, especially under low
    socioeconomic, crowded, or family-infected conditions, through oral-oral,
    gastric-oral, or fecal-oral exposure.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the vast majority of individuals, infection is acquired during
      childhood with those of low socioeconomic means and having infected family
      members being at highest risk for early childhood acquisition.
    explanation: >-
      Supports childhood household acquisition as the dominant epidemiologic
      route.
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Definitive routes of transmission of the infection are unclear, with
      evidence suggesting oral-oral, gastric-oral, and fecal-oral routes.
    explanation: >-
      Lists the likely person-to-person transmission modes.

environmental:
- name: Low-socioeconomic childhood household exposure
  description: >-
    Poor childhood sanitation, household crowding, and residence with infected
    family members predispose to H. pylori acquisition.
  influences_mechanisms:
  - target: Childhood Human-to-Human Exposure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Crowded or low-sanitation households increase oral, gastric, and fecal
      contact with infected family members.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Risk factors such as minimal education and low socio-economic status
      during childhood affect the prevalence.
    explanation: >-
      Supports childhood socioeconomic conditions as acquisition determinants.

pathophysiology:
- name: Childhood Human-to-Human Exposure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Oral, gastric, or fecal exposure introduces H. pylori into a susceptible
    child's stomach, where surviving bacteria can enter the gastric mucus layer.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: UreI and Urease Acid Survival
    causal_link_type: DIRECT
    description: >-
      Ingested bacteria face gastric acid and must buffer their periplasm to
      reach the mucosal niche.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If untreated, H pylori infection is lifelong.
    explanation: >-
      Establishes childhood-acquired H. pylori as a persistent chronic
      infection.
- name: UreI and Urease Acid Survival
  biological_scale: MOLECULAR
  description: >-
    Acidic periplasmic pH opens the UreI urea channel, letting gastric urea
    reach nickel-dependent cytoplasmic urease; ammonia production then buffers
    the periplasm and permits survival at the acidic gastric surface.
  downstream:
  - target: Gastric Mucus Colonization
    causal_link_type: DIRECT
    description: >-
      Acid survival gives motile bacteria time to penetrate mucus and colonize
      epithelial-surface niches.
  evidence:
  - reference: PMID:12471160
    reference_title: The gastric biology of Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Gastric juice urea is able to rapidly access intrabacterial urease when
      the periplasmic pH falls below approximately 6.2 owing to pH-gating of a
      urea channel, UreI.
    explanation: >-
      Explains how UreI couples low pH to urea influx for urease-mediated acid
      survival.
- name: Gastric Mucus Colonization
  biological_scale: TISSUE
  description: >-
    H. pylori establishes a chronic mucus-layer reservoir overlying gastric
    epithelial cells; motility, urease, and adhesins help the organism resist
    gastric acid, avoid mucus flow, and persist at the epithelial surface.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Chronic Active Gastritis
    causal_link_type: DIRECT
    description: >-
      Persistent colonization of the mucosal surface induces chronic gastric
      inflammatory infiltration.
  evidence:
  - reference: PMID:24914320
    reference_title: Factors that mediate colonization of the human stomach by Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Colonization of gastric mucus is likely to be key to the establishment of
      chronic infection.
    explanation: >-
      Positions gastric mucus colonization as the key step in chronic H. pylori
      infection.
- name: Chronic Active Gastritis
  biological_scale: TISSUE
  description: >-
    Colonization produces active inflammation in the gastric mucosa; the
    distribution of gastritis across antrum and body then determines whether
    acid output is increased, decreased, or unchanged.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Antral Acid Hypersecretion and Duodenal Ulceration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Antral-predominant, body-sparing gastritis increases gastrin release and
      acid secretion, raising the duodenal acid load.
  - target: CagA-Driven Epithelial Metaplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Corpus gastritis, virulent cagA-positive strains, and host inflammatory
      susceptibility promote atrophy and epithelial premalignant change.
  evidence:
  - reference: PMID:9889978
    reference_title: The physiology and metabolism of the human gastric pathogen Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is recognized as the major aetiological factor in chronic active type B
      gastritis, and gastric and duodenal ulceration and as a risk factor for
      gastric cancer.
    explanation: >-
      Ties H. pylori infection to chronic active gastritis, ulceration, and
      gastric-cancer risk.
- name: Antral Acid Hypersecretion and Duodenal Ulceration
  biological_scale: TISSUE
  description: >-
    When gastritis is antral-predominant and spares the gastric body, increased
    gastrin release increases acid secretion and duodenal acid load, producing
    peptic ulcer disease.
  locations:
  - preferred_term: pyloric antrum
    term:
      id: UBERON:0001165
      label: pyloric antrum
  - preferred_term: duodenum
    term:
      id: UBERON:0002114
      label: duodenum
  evidence:
  - reference: PMID:9494857
    reference_title: >-
      Alterations in gastric physiology in Helicobacter pylori infection: causes
      of different diseases or all epiphenomena?
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subjects in whom the infection produces acid hypersecretion develop
      duodenal ulcer disease due to the increased duodenal acid load.
    explanation: >-
      Supports an acid-hypersecretory ulcer branch of H. pylori disease.
- name: CagA-Driven Epithelial Metaplasia
  biological_scale: CELLULAR
  description: >-
    The H. pylori CagA effector enters gastric epithelial cells, interacts with
    E-cadherin, releases beta-catenin signaling, and transactivates intestinal
    differentiation programs that contribute to intestinal metaplasia in the
    gastric mucosa.
  downstream:
  - target: Gastric Atrophy and Stomach Cancer Risk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intestinal metaplasia is a premalignant stage of the
      atrophy-metaplasia-dysplasia cascade to intestinal-type gastric
      adenocarcinoma.
  evidence:
  - reference: PMID:17237808
    reference_title: >-
      Helicobacter pylori CagA interacts with E-cadherin and deregulates the
      beta-catenin signal that promotes intestinal transdifferentiation in
      gastric epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The CagA/E-cadherin interaction impairs the complex formation between
      E-cadherin and beta-catenin, causing cytoplasmic and nuclear accumulation
      of beta-catenin.
    explanation: >-
      Shows a cell-autonomous CagA mechanism for epithelial signaling disruption
      that can lead to intestinal metaplasia.
- name: Gastric Atrophy and Stomach Cancer Risk
  biological_scale: TISSUE
  description: >-
    Body-predominant or pangastritis reduces acid secretion, raises
    intragastric pH, and promotes atrophic and metaplastic mucosal states with
    increased stomach-cancer risk.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  evidence:
  - reference: PMID:9494857
    reference_title: >-
      Alterations in gastric physiology in Helicobacter pylori infection: causes
      of different diseases or all epiphenomena?
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In subjects in whom the infection induces marked hypochlorhydria, there is
      an increased risk of gastric cancer.
    explanation: >-
      Supports the low-acid gastric-cancer branch of H. pylori pathophysiology.

phenotypes:
- name: Chronic active gastritis
  phenotype_term:
    preferred_term: Gastritis
    term:
      id: HP:0005263
      label: Gastritis
  frequency: OBLIGATE
  description: >-
    Gastritis is the near-universal tissue response to persistent H. pylori
    colonization, even when infection is clinically silent.
  evidence:
  - reference: PMID:15345211
    reference_title: Treatment of Helicobacter pylori in Pediatrics.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Children infected with H. pylori develop histologic chronic active
      gastritis despite the fact that they are generally asymptomatic.
    explanation: >-
      Documents chronic active gastritis as the histologic consequence of
      pediatric H. pylori infection.
- name: Peptic ulcer
  phenotype_term:
    preferred_term: Peptic ulcer
    term:
      id: HP:0004398
      label: Peptic ulcer
  description: >-
    Gastric or duodenal ulceration is a minority outcome of the chronic gastric
    infection.
  evidence:
  - reference: PMID:15758899
    reference_title: "Helicobacter pylori infection: detection, investigation, and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Helicobacter pylori infection causes gastritis and peptic ulcers and is
      associated with the development of gastric cancer.
    explanation: >-
      Lists peptic ulcer disease among H. pylori-associated gastric diseases.
- name: Epigastric pain
  phenotype_term:
    preferred_term: Epigastric pain
    term:
      id: HP:0410019
      label: Epigastric pain
  description: >-
    Symptomatic H. pylori infection can present with dyspeptic epigastric pain,
    especially when ulceration is present.
- name: Stomach cancer
  phenotype_term:
    preferred_term: Stomach cancer
    term:
      id: HP:0012126
      label: Stomach cancer
  description: >-
    Gastric adenocarcinoma is a long-term malignant outcome of chronic H. pylori
    infection and is detailed in the gastric-cancer-specific entries.
  evidence:
  - reference: PMID:35364066
    reference_title: >-
      Effect of Helicobacter pylori Eradication on Gastric Cancer Prevention:
      Updated Report From a Randomized Controlled Trial With 26.5 Years of
      Follow-up.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Participants receiving H pylori treatment had a lower incidence of gastric
      cancer compared with their placebo counterparts (hazard ratio [HR], 0.57;
      95% CI, 0.33-0.98).
    explanation: >-
      The randomized eradication effect supports H. pylori infection as an
      upstream cause of later gastric cancer.

diagnosis:
- name: Urea breath, stool antigen, serology, and endoscopic testing
  description: >-
    Urea breath testing, monoclonal stool antigen testing, serology, and
    endoscopic biopsy-based assays are used to detect H. pylori, with urea
    breath and stool antigen tests identifying active infection more directly
    than serology.
  evidence:
  - reference: PMID:38143438
    reference_title: >-
      A comparative systematic review and meta-analysis on the diagnostic
      accuracy of non-invasive tests for Helicobacter pylori detection in
      elderly patients.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pooled sensitivity and specificity for HpSA were 72.5 and 94.7%, for
      Serology 83.7 and 73.3%, and for UBT 96.4 and 88.3%, respectively.
    explanation: >-
      Quantifies noninvasive stool-antigen, serology, and urea-breath diagnostic
      performance in a systematic review and meta-analysis.

treatments:
- name: Acid suppression plus multidrug eradication therapy
  description: >-
    H. pylori is eradicated with a proton pump inhibitor or
    potassium-competitive acid blocker plus antibiotic combinations, chosen according to
    local clarithromycin resistance, prior macrolide exposure, and susceptibility
    data when available.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Gastric Mucus Colonization
    treatment_effect: INHIBITS
    description: >-
      Eradication regimens kill colonizing bacteria, removing the reservoir that
      maintains chronic gastritis.
  - target: Chronic Active Gastritis
    treatment_effect: INHIBITS
    description: >-
      Removing H. pylori resolves the infectious trigger for chronic active
      gastritis and lowers ulcer recurrence and gastric-cancer risk.
  evidence:
  - reference: PMID:29600697
    reference_title: >-
      Pharmacological considerations and step-by-step proposal for the treatment
      of Helicobacter pylori infection in the year 2018.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Over the past 30 years, multidrug regimens consisting of a proton pump
      inhibitor (PPI) and two or three antibiotics have been used in treating
      Helicobacter pylori (H. pylori) infection.
    explanation: >-
      Supports multidrug antibiotic plus acid-suppression therapy as the core
      treatment approach.
  - reference: PMID:26808355
    reference_title: Role of Bismuth in the Eradication of Helicobacter pylori.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Greater than 90% eradication success can be obtained by
      bismuth-containing quadruple therapy.
    explanation: >-
      Supports bismuth-containing quadruple therapy as a highly effective
      eradication option.
- name: Susceptibility-guided rescue eradication
  description: >-
    Persistent H. pylori after empiric therapy is treated with a regimen that
    avoids reused clarithromycin and can be tailored to antibiotic
    susceptibility or common 23S rRNA, rdxA, pbp1A, and gyrA/B resistance
    mutations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Gastric Mucus Colonization
    treatment_effect: INHIBITS
    description: >-
      Tailored rescue therapy targets bacteria that survived first-line
      antibiotic selection.
  evidence:
  - reference: PMID:29600697
    reference_title: >-
      Pharmacological considerations and step-by-step proposal for the treatment
      of Helicobacter pylori infection in the year 2018.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Options after initial eradication failure include tailored therapy
      (choosing antibiotic combinations based on antibiotic susceptibility
      testing), empiric bismuth-containing quadruple therapy or triple
      levofloxacin-based therapy.
    explanation: >-
      Supports susceptibility-guided or alternative empiric rescue regimens
      after failed H. pylori eradication.
  - reference: PMID:41966313
    reference_title: >-
      Mutation-driven mechanisms underlying antibiotic resistance of
      Helicobacter pylori in Asia: A systematic review and meta-analysis
      (2000-2024).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clarithromycin resistance in H. pylori is mainly driven by A2142G/A2143G
      mutations (19-34%), while metronidazole resistance exceeds 84% in East
      Asia via rdxA mutations.
    explanation: >-
      Documents mutation-mediated antibiotic resistance as a mechanism that
      rescue or tailored therapy must account for.

review_notes: >-
  Duplicate preflight found no Helicobacter Pylori Infectious Disease entry by
  MONDO:0006781 or exact label in an ignored-inclusive local search under
  kb/disorders, stubs, research, and history/disorders, and no exact label or
  MONDO:0006781 entry on origin/main; broad H. pylori searches found many
  downstream gastric cancer and lymphoma mentions plus
  Gastric_Cancer_H_pylori_Associated, but not the organism-defined infection
  itself. Exact GitHub issue/PR searches for the label returned no matches, and
  the MONDO:0006781 PR search only found an unrelated lexical hit. Deep research
  requested falcon but fell back to OpenScientist, producing
  research/Helicobacter_Pylori_Infectious_Disease-deep-research-openscientist.md
  with 43/43 references resolved and 37/43 judged on-topic. The report passed
  manual identity review after preflight-dr returned SKIP for this non-Mendelian
  MONDO term. The report's HP:0031273 chronic gastritis, HP:0011834 symptom, and
  HP:0025439 dyspepsia bindings were wrong and rebound to HP:0005263 Gastritis
  or HP:0410019 Epigastric pain as appropriate; its MALT lymphoma HPO row was
  omitted because HP:0012190 is T-cell lymphoma in the local cache.
  Neoplasm-specific mechanisms were deliberately kept shallow because gastric
  adenocarcinoma, H. pylori-associated gastric cancer, and MALT lymphoma are
  curated as separate entries.

        id: CHEBI:27902
        label: tetracycline
    - preferred_term: bismuth subcitrate potassium
      term:
        id: CHEBI:749392
        label: bismuth subcitrate potassium
  target_mechanisms:
  - target: Gastric Mucus Colonization
    treatment_effect: INHIBITS
    description: >-
      Eradication regimens kill colonizing bacteria, removing the reservoir that
      maintains chronic gastritis.
  - target: Chronic Gastric Mucosal Inflammation
    treatment_effect: INHIBITS
    description: >-
      Removing H. pylori resolves the infectious trigger for chronic active
      gastritis and lowers ulcer recurrence and gastric-cancer risk.
  evidence:
  - reference: PMID:29600697
    reference_title: >-
      Pharmacological considerations and step-by-step proposal for the treatment
      of Helicobacter pylori infection in the year 2018.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Over the past 30 years, multidrug regimens consisting of a proton pump
      inhibitor (PPI) and two or three antibiotics have been used in treating
      Helicobacter pylori (H. pylori) infection.
    explanation: >-
      Supports multidrug antibiotic plus acid-suppression therapy as the core
      treatment approach.
  - reference: PMID:26808355
    reference_title: Role of Bismuth in the Eradication of Helicobacter pylori.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Greater than 90% eradication success can be obtained by
      bismuth-containing quadruple therapy.
    explanation: >-
      Supports bismuth-containing quadruple therapy as a highly effective
      eradication option.
- name: Susceptibility-guided rescue eradication
  description: >-
    Persistent H. pylori after empiric therapy is treated with a regimen that
    avoids reused clarithromycin and can be tailored to antibiotic
    susceptibility or common 23S rRNA, rdxA, pbp1A, and gyrA/B resistance
    mutations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:

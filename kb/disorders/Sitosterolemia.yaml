name: Sitosterolemia
category: Mendelian
creation_date: "2026-07-29T19:20:00Z"
synonyms:
- Phytosterolemia
- Beta-sitosterolemia
- Shellfish sterolemia
description: >-
  Sitosterolemia (phytosterolemia) is an autosomal recessive sterol-storage
  disorder caused by biallelic loss-of-function variants in ABCG5 or ABCG8,
  which encode the two halves of the G5G8 sterol-efflux transporter expressed
  on the apical membrane of hepatocytes and enterocytes. Loss of G5G8 removes
  the pump that normally excretes cholesterol and dietary plant/shellfish
  sterols (xenosterols) back into the intestinal lumen and into bile, so
  absorption of both cholesterol and plant sterols becomes unselective and
  unrestricted. The resulting accumulation of sitosterol and campesterol in
  plasma and tissues produces tendinous and cutaneous xanthomas, premature
  atherosclerosis, arthralgia, and a distinctive hematologic syndrome of
  stomatocytic hemolytic anemia and macrothrombocytopenia. It is frequently
  misdiagnosed as familial hypercholesterolemia or immune thrombocytopenia and,
  unlike familial hypercholesterolemia, responds poorly to statins but
  dramatically to dietary sterol restriction and the cholesterol-absorption
  inhibitor ezetimibe.

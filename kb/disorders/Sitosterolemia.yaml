- name: Sterol Intercalation into Blood Cell Membranes
  biological_scale: CELLULAR
  description: >-
    Free plant sterols intercalate into the plasma membranes of erythrocytes,
    platelets, and megakaryocytes, altering membrane sterol composition and
    biophysics. This membrane remodeling is the proximate cause of the two
    distinctive hematologic manifestations of sitosterolemia and is reversible
    when plant-sterol levels are lowered.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:23926302
    reference_title: "Platelet hyperreactivity explains the bleeding abnormality and macrothrombocytopenia in a murine model of sitosterolemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intercalation of plant sterols into the plasma membrane therefore results in dysregulation of multiple platelet activation pathways, leading to macrothrombocytopenia and bleeding."
    explanation: Establishes membrane intercalation of plant sterols as the mechanism disrupting blood-cell function.
  downstream:
  - target: Megakaryocyte Demarcation Membrane System Defect
    description: Sterol-enriched membranes disrupt the megakaryocyte demarcation membrane system and platelet formation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18156627
      reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "defective megakaryocyte development with deterioration of the demarcation membrane system was evident."
      explanation: Links membrane sterol accumulation to defective megakaryocyte development.
  - target: Stomatocytic Hemolysis
    description: Erythrocyte membrane sterol enrichment produces stomatocyte morphology and premature hemolysis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16029460
      reference_title: "Stomatocytic haemolysis and macrothrombocytopenia (Mediterranean stomatocytosis/macrothrombocytopenia) is the haematological presentation of phytosterolaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mediterranean stomatocytosis or Mediterranean macrothrombocytopenia is a poorly understood haematological condition that combines stomatocytic haemolysis with the presence of very large platelets."
      explanation: Ties the hematologic syndrome (stomatocytic hemolysis plus giant platelets) to phytosterol excess.
- name: Megakaryocyte Demarcation Membrane System Defect
  biological_scale: CELLULAR
  description: >-
    Plant-sterol enrichment of the megakaryocyte membrane causes defective
    megakaryocyte development with deterioration of the demarcation membrane
    system (the internal membrane reservoir from which platelets are formed) —
    not a reduction in megakaryocyte numbers or progenitors. Critically,
    bone-marrow-transplant crossover experiments show the phenotype tracks the
    recipient: irradiated wild-type mice given Abcg5-null marrow have normal
    platelets, whereas Abcg5-null mice given wild-type marrow remain affected.
    The defect is therefore extrinsic — driven by the host plasma plant-sterol
    environment rather than being cell-intrinsic to the hematopoietic
    compartment — which is why it reverses when plant sterols are lowered.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:18156627
    reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "defective megakaryocyte development with deterioration of the demarcation membrane system was evident."
    explanation: Establishes the megakaryocyte demarcation-membrane-system defect (not reduced megakaryocyte numbers) as the lesion.
  - reference: PMID:18156627
    reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lethally irradiated wild-type mice transplanted with bone marrow from Abcg5(-/-) mice displayed normal platelets, whereas Abcg5(-/-) mice transplanted with wild-type bone marrow still showed macrothrombocytopenia."
    explanation: The crossover result shows the phenotype tracks the recipient's plasma-sterol environment (extrinsic defect), not the donor marrow (not cell-intrinsic).
  downstream:
  - target: Macrothrombocytopenia
    description: The demarcation-membrane-system defect yields enlarged, reduced-count platelets.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18156627
      reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Macrothrombocytopenia was not due to decreased numbers of megakaryocytes or their progenitors, but defective megakaryocyte development with deterioration of the demarcation membrane system was evident."
      explanation: Attributes the macrothrombocytopenia specifically to the megakaryocyte demarcation-membrane-system defect rather than reduced megakaryocyte numbers.
- name: Macrothrombocytopenia
  biological_scale: ORGANISM
  description: >-
    The megakaryocyte demarcation-membrane-system defect yields a reduced count
    of enlarged (giant) platelets — macrothrombocytopenia. In humans this is the
    platelet component of the "Mediterranean stomatocytosis/macrothrombocytopenia"
    presentation, and plasma soluble GPIba (a marker of the accompanying platelet
    passivation) correlates with plasma sitosterol. Because the driver is the
    plasma plant-sterol burden, the abnormality reverses when plant sterols are
    lowered. (The parallel sterol-induced platelet hyperreactivity/passivation
    that explains the bleeding tendency is elaborated in the associated
    model-mismatch discussion.)
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:18156627
    reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "accumulation of plant sterols is responsible for development of macrothrombocytopenia in sitosterolemia"
    explanation: Establishes plant-sterol accumulation as the cause of macrothrombocytopenia.
  - reference: PMID:16029460
    reference_title: "Stomatocytic haemolysis and macrothrombocytopenia (Mediterranean stomatocytosis/macrothrombocytopenia) is the haematological presentation of phytosterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mediterranean stomatocytosis/macrothrombocytopenia is caused by an excess of phytosterols in the blood"
    explanation: Confirms in humans that the macrothrombocytopenia is caused by excess phytosterols.
  - reference: PMID:23926302
    reference_title: "Platelet hyperreactivity explains the bleeding abnormality and macrothrombocytopenia in a murine model of sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma levels of soluble GPIbα were strongly correlated with plasma sitosterol levels in samples from human sitosterolemic patients"
    explanation: Human correlation between plasma soluble GPIba and plasma sitosterol, bridging the mouse mechanism to human platelet passivation.
- name: Stomatocytic Hemolysis
  biological_scale: CELLULAR
  description: >-
    Enrichment of the erythrocyte membrane with plant sterols alters red-cell
    shape (stomatocytosis) and reduces cell survival, producing a hemolytic
    anemia frequently accompanied by splenomegaly. The stomatocytic hemolysis
    combined with macrothrombocytopenia constitutes the characteristic
    "Mediterranean stomatocytosis/macrothrombocytopenia" hematologic
    presentation of the disease.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hematologic manifestations include hemolytic anemia with stomatocytosis, macrothrombocytopenia, splenomegaly, and abnormal bleeding."
    explanation: Documents hemolytic anemia with stomatocytosis as a hematologic manifestation.
- name: Xanthoma Formation
  biological_scale: TISSUE
  description: >-
    Sterol deposition in tendons and skin produces tendinous and cutaneous
    xanthomas, the classic clinical sign that historically prompted sterol
    testing. In children xanthomas can appear even when cholesterol is normal
    (normolipemic xanthomas), a presentation that should trigger a plant-sterol
    assay.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:29984642
    reference_title: "Sitosterolemia: Diagnosis, Metabolic and Hematological Abnormalities, Cardiovascular Disease and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main clinical features are tendinous and cutaneous xanthomas, arthritis or arthralgia, premature cardiovascular disease and atherosclerosis."
    explanation: Identifies tendinous and cutaneous xanthomas as a main clinical feature.
- name: Accelerated Atherosclerosis
  biological_scale: TISSUE
  description: >-
    Chronic accumulation of plant sterols and cholesterol drives accelerated
    atherosclerosis, which can present as premature coronary artery disease,
    aortic disease, and, in severe childhood-onset cases, premature cardiac
    death. The phenotype ranges from near-asymptomatic to severe, and the
    accelerated atherosclerosis is the principal cause of morbidity and
    mortality.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "increased plant sterol levels, xanthomas, and accelerated atherosclerosis"
    explanation: Names accelerated atherosclerosis as a defining consequence of plant-sterol accumulation.

biochemical:
- name: Plasma sitosterol and campesterol
  presence: Elevated
  context: >-
    Markedly elevated plasma plant sterols (sitosterol and campesterol) are the
    defining biochemical abnormality of the disease and the pharmacodynamic
    readout used to monitor response to sterol-lowering therapy. Plant sterols
    are measured by gas chromatography (with mass spectrometry), which
    distinguishes them from cholesterol.
  readouts:
  - target: Plasma and Tissue Plant Sterol Accumulation
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-037
    - FDA-SE-pediatric-noncancer-026
    interpretation: >-
      Higher plasma sitosterol and campesterol indicate greater plant-sterol
      accumulation; decreases after cholesterol-absorption inhibition indicate a
      reduced plant-sterol burden. The FDA lists plasma sitosterol and
      campesterol as a validated surrogate endpoint for homozygous
      sitosterolemia.
    evidence:
    - reference: PMID:14769702
      reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ezetimibe produced significant and progressive reductions in plasma plant sterol concentrations in patients with sitosterolemia, consistent with the hypothesis that ezetimibe inhibits the intestinal absorption of plant sterols as well as cholesterol, leading to reductions in plasma concentrations."
      explanation: Supports plasma plant sterols as a treatment-responsive pharmacodynamic readout.
  evidence:
  - reference: PMID:14769702
    reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sitosterol concentrations decreased by 21% (P<0.001) in patients treated with ezetimibe compared with a nonsignificant 4% rise in those on placebo (between-group P<0.001)."
    explanation: Measures plasma sitosterol (and campesterol) as treatment-responsive markers.
diagnosis:
- name: Plasma Phytosterol (Plant Sterol) Assay
  description: >-
    Diagnosis rests on demonstrating grossly elevated plasma plant sterols
    (sitosterol, campesterol) by gas chromatography/mass spectrometry, which
    separates plant sterols from cholesterol. A plant-sterol assay should be
    performed in patients with normolipemic xanthomas, hypercholesterolemia
    responding unexpectedly well to diet or cholesterol-absorption inhibitors or
    poorly to statins, or unexplained hemolytic anemia with macrothrombocytopenia.
  diagnosis_term:
    preferred_term: clinical chemistry assessment
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plant sterol assay should be performed in patients with normocholesterolemic xanthomas, hypercholesterolemia with unexpectedly good response to dietary modifications or to cholesterol absorption inhibitors, or hypercholesterolemia with poor response to statins, or those with unexplained hemolytic anemia and macrothrombocytopenia."
    explanation: States the clinical indications for the diagnostic plant-sterol assay.
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of sitosterolemia is established in a proband with greatly increased plant sterol concentrations in plasma and/or by identification of biallelic pathogenic (or likely pathogenic) variants in ABCG5 and/or ABCG8."
    explanation: GeneReviews states the diagnostic criteria (elevated plasma plant sterols and/or biallelic ABCG5/ABCG8 variants).
- name: ABCG5/ABCG8 Molecular Genetic Testing
  description: >-
    Biallelic pathogenic variants in ABCG5 or ABCG8 confirm the diagnosis.
    Targeted or high-throughput sequencing of the two genes is increasingly used
    as a first-line diagnostic approach.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29984642
    reference_title: "Sitosterolemia: Diagnosis, Metabolic and Hematological Abnormalities, Cardiovascular Disease and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recent advances in high-throughput sequencing, especially in the use of targeted sequencing of pre-specified genes, have begun to be incorporated in the first-line approach in the field of genetic disorders."
    explanation: Supports targeted/high-throughput sequencing of the causal genes as a first-line diagnostic route.
treatments:
- name: Ezetimibe
  description: >-
    Ezetimibe, a cholesterol-absorption inhibitor (NPC1L1 antagonist), lowers
    intestinal absorption of both cholesterol and plant sterols, producing
    significant and progressive reductions in plasma plant sterols. In animal
    models and patients it also reverses the macrothrombocytopenia, tying the
    hematologic disease to the plant-sterol burden. It is a mainstay of therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Plasma and Tissue Plant Sterol Accumulation
    treatment_effect: INHIBITS
    description: >-
      By blocking intestinal sterol absorption, ezetimibe lowers the plasma and
      tissue plant-sterol accumulation that this node represents, which in turn
      relieves the downstream hematologic and vascular disease.
  evidence:
  - reference: PMID:14769702
    reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: Ezetimibe produced significant and progressive reductions in plasma plant sterol concentrations in patients with sitosterolemia, consistent with the hypothesis that ezetimibe inhibits the intestinal absorption of plant sterols as well as cholesterol, leading to reductions in plasma concentrations."
    explanation: Randomized trial establishing ezetimibe as a plant-sterol-lowering therapy.
  - reference: PMID:18156627
    reference_title: "Plant sterols cause macrothrombocytopenia in a mouse model of sitosterolemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with the sterol absorption inhibitor ezetimibe rapidly reversed macrothrombocytopenia in Abcg5(-/-) mice concomitant with a strong decrease in plasma plant sterols."
    explanation: Shows ezetimibe reverses the hematologic phenotype in a mouse model by lowering plant sterols.
- name: Dietary Sterol Restriction
  description: >-
    Dietary restriction of both cholesterol and plant sterols is a first-line
    intervention. Foods rich in plant sterols (vegetable oils, wheat germ, nuts,
    seeds, avocado, margarine, chocolate) and shellfish sterols are limited.
    Importantly, plant-stanol-fortified margarines and products marketed to lower
    cholesterol in the general population are contraindicated in sitosterolemia,
    because affected patients cannot excrete the stanols and their accumulation
    is exacerbated — an "agents to avoid" caveat unique to this disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Intestinal Xenosterol Hyperabsorption
    treatment_effect: INHIBITS
    description: >-
      Lowering dietary plant-sterol intake reduces the substrate available for
      the unrestricted intestinal absorption that drives the disease.
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mainstay of therapy includes dietary restriction of both cholesterol and plant sterols and the sterol absorption inhibitor, ezetimibe."
    explanation: Dietary restriction of cholesterol and plant sterols is a mainstay of therapy.
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Margarines and other products containing stanols (e.g., campestanol and sitostanol) that are recommended for use by persons with hypercholesterolemia are contraindicated as they can exacerbate plant stanol accumulation."
    explanation: GeneReviews flags plant-stanol products as contraindicated ("agents to avoid") because they exacerbate stanol accumulation.
- name: Partial Ileal Bypass Surgery
  description: >-
    Partial ileal bypass surgery, which interrupts enterohepatic sterol
    recycling, may be considered as a last resort in patients who respond poorly
    to maximal dietary and pharmacologic therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Partial ileal bypass surgery may be considered as a last resort for those with poor response to maximal therapies."
    explanation: GeneReviews lists partial ileal bypass surgery as a last-resort treatment.
- name: Bile Acid Sequestrant
  description: >-
    Bile acid sequestrants (e.g., cholestyramine, colestimide, colesevelam)
    interrupt enterohepatic sterol recycling and, together with a low-cholesterol
    diet, dramatically lower the hypercholesterolemia seen in sitosterolemia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bile acid sequestrant
      term:
        id: NCIT:C98148
        label: Bile Acid Sequestrant
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypercholesterolemia in patients with sitosterolemia is dramatically responsive to low cholesterol diet and bile acid sequestrants."
    explanation: Bile acid sequestrants (with diet) dramatically lower the hypercholesterolemia.
- name: Statin Therapy (Ineffective)
  description: >-
    HMG-CoA reductase inhibitors (statins), the standard therapy for familial
    hypercholesterolemia, are largely ineffective in sitosterolemia because the
    disease is driven by sterol hyperabsorption rather than endogenous synthesis.
    The lack of statin response is a key discriminator from homozygous familial
    hypercholesterolemia and should prompt a plant-sterol assay.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:16029460
    reference_title: "Stomatocytic haemolysis and macrothrombocytopenia (Mediterranean stomatocytosis/macrothrombocytopenia) is the haematological presentation of phytosterolaemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "phytosterolaemia, which does not respond to standard statin treatment"
    explanation: Statins do not work in sitosterolemia; this negative response is a diagnostic discriminator from familial hypercholesterolemia.
- name: Disease Surveillance and Monitoring
  description: >-
    Recommended surveillance begins at diagnosis on an annual basis: plasma
    plant sterols and cholesterol, xanthoma burden, CBC and platelet count, and
    liver transaminases; long-standing untreated patients also undergo
    noninvasive imaging to exclude coronary and carotid plaque.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: clinical chemistry assessment
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  evidence:
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Begin monitoring at the time of diagnosis on an annual basis: plasma concentrations of plant sterols (primarily beta-sitosterol and campesterol) and cholesterol; the size, number, and distribution of xanthomas; and CBC and platelet count, and liver transaminases (for elevation)."
    explanation: GeneReviews specifies the annual surveillance schedule (plant sterols, xanthomas, CBC/platelets, liver transaminases).
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In persons with long-standing untreated sitosterolemia, noninvasive imaging is used to exclude coronary and carotid plaque as well as valvular atherosclerotic manifestations."
    explanation: GeneReviews specifies noninvasive vascular imaging surveillance in long-standing untreated disease, matching the imaging clause in the description.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Sitosterolemia is of unknown, likely markedly under-estimated prevalence:
    it is widely under-recognized because patients are misclassified as
    familial hypercholesterolemia or immune thrombocytopenia. Population
    allele-frequency analyses suggest true prevalence is much higher than the
    ~100 molecularly confirmed cases historically reported, but published point
    estimates are inconsistent across sources and are therefore not asserted here.
  evidence:
  - reference: PMID:29984642
    reference_title: "Sitosterolemia: Diagnosis, Metabolic and Hematological Abnormalities, Cardiovascular Disease and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sitosterolemia is a recessive inherited metabolic disorder of unknown prevalence, characterized by increased levels of plasma plant sterols."
    explanation: States that the prevalence of sitosterolemia is unknown.

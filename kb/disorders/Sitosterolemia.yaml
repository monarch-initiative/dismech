  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ABCG8
    term:
      id: hgnc:13887
      label: ABCG8
  notes: >-
    Biallelic loss-of-function variants in ABCG8 (sterolin-2) cause
    sitosterolemia. Reported variants include nonsense, missense, and
    frameshift changes; a recurrent nonsense allele, W361X, has been observed in
    multiple unrelated pedigrees. ABCG8 variants are reported more often in
    individuals of Northern European ancestry, and founder alleles with elevated
    carrier frequencies occur in several isolated populations.

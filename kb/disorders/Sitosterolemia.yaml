inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Sitosterolemia is recessively inherited; affected individuals carry biallelic
    (homozygous or compound heterozygous) loss-of-function variants in either
    ABCG5 or ABCG8. The two genes lie head-to-head at 2p21 and their products
    form an obligate heterodimer, so a defect in either gene produces the same
    disease.
  evidence:
  - reference: PMID:14769702
    reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sitosterolemia is a recessively inherited disorder that results from mutations in either ABCG5 or G8 proteins, with hyperabsorption of dietary sterols and decreased hepatic excretion of plant sterols and cholesterol."
    explanation: States the autosomal recessive inheritance and the ABCG5/ABCG8 causal basis.
  - reference: PMID:23556150
    reference_title: "Sitosterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sitosterolemia is inherited in an autosomal recessive manner."
    explanation: GeneReviews confirms autosomal recessive inheritance.

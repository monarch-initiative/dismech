discussions:
- discussion_id: gap_sitosterolemia_phenotypic_heterogeneity
  prompt: >-
    Why is sitosterolemia so phenotypically heterogeneous — ranging from almost
    asymptomatic individuals to children with severe hypercholesterolemia,
    accelerated atherosclerosis, and premature cardiac death — and what
    genotype/modifier factors (specific ABCG5 vs ABCG8 variants, residual
    transporter activity, diet, other lipid genes) determine severity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Plasma and Tissue Plant Sterol Accumulation
  - pathophysiology#Accelerated Atherosclerosis
  rationale: >-
    Plasma plant-sterol levels do not fully predict clinical severity, and the
    functional impact of most ABCG5/ABCG8 variants on transporter
    structure-function is unknown, so the determinants of the extreme phenotypic
    range are unresolved. Clarifying them would improve risk stratification and
    the timing/intensity of sterol-lowering therapy.
  evidence:
  - reference: PMID:27104173
    reference_title: "Sitosterolemia: a review and update of pathophysiology, clinical spectrum, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with sitosterolemia show extreme phenotypic heterogeneity, ranging from almost asymptomatic individuals to those with severe hypercholesterolemia leading to accelerated atherosclerosis and premature cardiac death."
    explanation: Documents the extreme phenotypic heterogeneity that defines the gap.
  - reference: PMID:33807969
    reference_title: "Sitosterolemia: Twenty Years of Discovery of the Function of ABCG5ABCG8."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The impact of these variants on G5G8 structure and activity are largely unknown."
    explanation: The unknown functional impact of most variants underlies the unexplained severity range.
- discussion_id: interp_sitosterolemia_misdiagnosis_FH_ITP
  prompt: >-
    Sitosterolemia is repeatedly misdiagnosed as familial hypercholesterolemia
    (especially in children) or as immune thrombocytopenia. What discriminating
    features should trigger a plant-sterol assay, and how does the statin
    non-response distinguish it?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Plasma and Tissue Plant Sterol Accumulation
  - phenotypes#Thrombocytopenia
  rationale: >-
    Because sitosterolemia shares hypercholesterolemia and xanthomas with
    familial hypercholesterolemia and shares low platelet counts with immune
    thrombocytopenia, it is frequently misclassified — and mistreated. A key
    discriminator is that, unlike familial hypercholesterolemia, sitosterolemia
    responds poorly to statins but dramatically to diet and ezetimibe;
    normolipemic xanthomas, giant platelets/stomatocytes on smear, and a
    treatment response mismatch should prompt a plant-sterol assay. Capturing
    this pitfall is important for a knowledge base intended to support diagnosis.
  evidence:
  - reference: PMID:29984642
    reference_title: "Sitosterolemia: Diagnosis, Metabolic and Hematological Abnormalities, Cardiovascular Disease and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "making it possible for sitosterolemia to be misdiagnosed as homozygous FH, especially in pediatric patients."
    explanation: Documents misdiagnosis as homozygous familial hypercholesterolemia, especially in children.
  - reference: PMID:16029460
    reference_title: "Stomatocytic haemolysis and macrothrombocytopenia (Mediterranean stomatocytosis/macrothrombocytopenia) is the haematological presentation of phytosterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phytosterolaemia, which does not respond to standard statin treatment, can be diagnosed via the distinctive haematology described here, even when the cholesterol is normal"
    explanation: The statin non-response and distinctive hematology are the discriminating features that should prompt testing.
- discussion_id: model_mismatch_sitosterolemia_platelet_passivation
  prompt: >-
    Is the detailed platelet-passivation mechanism worked out in
    Abcg5/Abcg8-deficient mice (constitutive fibrinogen binding to activated integrin
    alphaIIbbeta3, integrin internalization, microparticle generation, filamin
    relocalization, and GPIba shedding) the operative mechanism of
    macrothrombocytopenia and bleeding in human sitosterolemia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Sterol Intercalation into Blood Cell Membranes
  - pathophysiology#Megakaryocyte Demarcation Membrane System Defect
  - pathophysiology#Macrothrombocytopenia
  rationale: >-
    The step-by-step molecular mechanism linking membrane sterol intercalation
    to platelet dysfunction is established in mouse models; direct human
    confirmation is limited. The strongest human bridge is a correlation between
    plasma soluble GPIba and plasma sitosterol in patient samples, which is
    suggestive but not a demonstration that the full murine mechanism operates
    in human platelets. Whether the murine platelet-passivation cascade is the
    human mechanism is the open question.
  proposed_experiments:
  - experiment_id: exp_sitosterolemia_human_platelet_passivation
    name: Human platelet-passivation mechanism verification
    description: >-
      Measure integrin alphaIIbbeta3 activation state, GPIba surface
      density/shedding, and platelet-derived microparticles in platelets from
      human sitosterolemia patients before and after ezetimibe-induced
      plant-sterol lowering, to test whether the murine platelet-passivation
      cascade operates in human platelets and reverses with treatment.
  - experiment_id: exp_sitosterolemia_membrane_sterol_correlation
    name: Platelet-membrane sterol versus phenotype correlation
    description: >-
      Correlate platelet-membrane free-sterol content with platelet size,
      hyperreactivity, and bleeding phenotype across a human patient cohort to
      establish the human dose-response between membrane sterol loading and
      platelet dysfunction.
  evidence:
  - reference: PMID:23926302
    reference_title: "Platelet hyperreactivity explains the bleeding abnormality and macrothrombocytopenia in a murine model of sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma levels of soluble GPIbα were strongly correlated with plasma sitosterol levels in samples from human sitosterolemic patients, implicating a similar mechanism of sterol-induced platelet passivation in the human disease."
    explanation: >-
      The mechanism is defined in mice; the only direct human evidence is a
      correlation between soluble GPIba and sitosterol, so the translational
      validity of the full mechanism is the mismatch.

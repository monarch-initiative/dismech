pathophysiology:
- name: G5G8 Sterol-Efflux Transporter Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in ABCG5 or ABCG8 abolish the G5G8
    heterodimer, a pair of ATP-binding-cassette half-transporters that assemble
    and traffic to the apical (canalicular/brush-border) membrane of hepatocytes
    and enterocytes, where they pump cholesterol and plant/shellfish sterols out
    of the cell into bile and into the intestinal lumen. Because either subunit
    is required for a functional pump, a defect in either gene inactivates
    sterol efflux.

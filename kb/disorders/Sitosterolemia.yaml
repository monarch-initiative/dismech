- name: Intestinal Xenosterol Hyperabsorption
  biological_scale: CELLULAR
  description: >-
    Without enterocyte G5G8 to pump absorbed sterols back into the lumen, the
    intestine absorbs both cholesterol and plant/shellfish sterols in an
    unselective, unrestricted manner. Normally the body excludes ~95% of dietary
    plant sterols; in sitosterolemia their fractional absorption rises markedly.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  evidence:
  - reference: PMID:16029460
    reference_title: "Stomatocytic haemolysis and macrothrombocytopenia (Mediterranean stomatocytosis/macrothrombocytopenia) is the haematological presentation of phytosterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absorption of both cholesterol and plant-derived cholesterol-like molecules at the gut is unselective and unrestricted."
    explanation: Describes the unselective, unrestricted intestinal sterol absorption central to the disease.
  downstream:
  - target: Plasma and Tissue Plant Sterol Accumulation
    description: Hyperabsorbed xenosterols enter the circulation and accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14769702
      reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "hyperabsorption of dietary sterols and decreased hepatic excretion of plant sterols and cholesterol."
      explanation: Hyperabsorption of dietary sterols is the mechanism producing the plasma/tissue sterol burden.
- name: Reduced Biliary Sterol Excretion
  biological_scale: CELLULAR
  description: >-
    Loss of hepatocyte canalicular G5G8 reduces secretion of cholesterol and
    plant sterols into bile, removing the principal route by which the liver
    would otherwise dispose of the excess absorbed xenosterols. Impaired biliary
    efflux compounds the intestinal hyperabsorption to drive net sterol
    retention.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:14769702
    reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hyperabsorption of dietary sterols and decreased hepatic excretion of plant sterols and cholesterol."
    explanation: Documents decreased hepatic (biliary) excretion of plant sterols and cholesterol.
  downstream:
  - target: Plasma and Tissue Plant Sterol Accumulation
    description: Reduced biliary disposal leaves absorbed sterols to accumulate in plasma and tissues.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14769702
      reference_title: "Ezetimibe effectively reduces plasma plant sterols in patients with sitosterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "hyperabsorption of dietary sterols and decreased hepatic excretion of plant sterols and cholesterol."
      explanation: Decreased hepatic (biliary) excretion is the second mechanism driving net sterol accumulation.
- name: Plasma and Tissue Plant Sterol Accumulation
  biological_scale: ORGANISM
  description: >-
    The combination of intestinal hyperabsorption and reduced biliary excretion
    produces markedly elevated plasma and tissue levels of plant sterols —
    especially sitosterol, campesterol, and stigmasterol (and their
    metabolites). This sustained xenosterol accumulation is the central
    biochemical state of the disease and the hub from which the vascular,
    cutaneous, and hematologic manifestations branch.

    closest available descriptor, Generalized tonic seizure, is bound here. The
    cited sources are explicit that these attacks are NOT epileptic; the binding
    should not be read as asserting epilepsy, and the disorder's most common
    misdiagnosis is precisely that error.
- name: Constipation
  category: Clinical
  description: >-
    Constipation arising as a learned avoidance of defecation, the most reliable
    trigger of a rectal attack. It is a behavioural consequence of the pain
    rather than a primary gastrointestinal phenotype, and stool softeners are
    recommended for exactly this reason.
  phenotype_term:
    preferred_term: Constipation
    term:

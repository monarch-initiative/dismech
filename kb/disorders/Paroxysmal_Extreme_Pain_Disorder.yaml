  - reference: PMID:20301342
    reference_title: "SCN9A Neuropathic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use of stool softeners and passing stool slowly to reduce the likelihood of
      triggering an attack.
    explanation: >-
      The recommended management confirms that defecation triggers attacks and
      that stool consistency is a modifiable factor, which is the basis for
      avoidance-driven constipation.

genetic:
- name: SCN9A
  gene_term:
    preferred_term: SCN9A
    term:
      id: hgnc:10597
      label: SCN9A
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous gain-of-function missense variants in SCN9A that impair fast
    inactivation of Nav1.7 cause PEPD. The allelic series is distinct from, and
    biophysically opposite in mechanism to, the SCN9A variants causing inherited
    erythromelalgia, which shift activation to more negative potentials.
  evidence:
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genome-wide linkage search followed by mutational analysis of the
      candidate gene SCN9A, which encodes hNa(v)1.7, identified eight missense
      mutations in 11 families and 2 sporadic cases.
    explanation: >-
      Establishes SCN9A as the causative gene through linkage plus mutational
      analysis across a 13-kindred cohort.
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PEPD and PE are allelic variants with distinct underlying biophysical
      mechanisms and represent a separate class of peripheral neuronal sodium
      channelopathy.
    explanation: >-
      Documents the allelic relationship with primary erythermalgia and the
      distinct biophysical basis that separates the two disorders.

diagnosis:
- name: Molecular genetic testing of SCN9A
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic SCN9A
    variant in a proband with the characteristic phenotype. Because the neonatal
    presentation is autonomic rather than painful, testing is often not
    considered until the pain paroxysms declare themselves years later.
  evidence:
  - reference: PMID:20301342
    reference_title: "SCN9A Neuropathic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCN9A-NPS is established in a proband with a heterozygous
      pathogenic variant in SCN9A identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the molecular diagnostic criterion for the SCN9A
      neuropathic pain syndromes, of which PEPD is one.

treatments:
- name: Carbamazepine
  description: >-
    Carbamazepine selectively blocks the persistent sodium current produced by
    the inactivation-impaired PEPD channels and is effective in almost all
    patients who try it, although the response is usually incomplete. The
    selectivity is mechanistic rather than empirical: the same drug does not
    correct the hyperpolarized activation threshold of erythromelalgia variants
    and is not effective in that allelic disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_mechanisms:
  - target: Persistent Non-Inactivating Nav1.7 Sodium Current
    treatment_effect: INHIBITS
    description: >-
      Selective block of the non-inactivating component of the mutant Nav1.7
      current.
    evidence:
    - reference: PMID:17145499
      reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Carbamazepine, a drug that is effective in PEPD, but not PE, showed
        selective block of persistent current associated with PEPD mutants, but
        did not affect the negative activation threshold of a PE mutant.
      explanation: >-
        Demonstrates the drug acting on precisely the biophysical defect this
        node encodes, and not on the allelic erythromelalgia defect.
  evidence:
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carbamazepine is effective in almost all who try it, but the response is
      often incomplete.
    explanation: >-
      Reports the clinical efficacy and its limits in the defining international
      series.
- name: Trigger avoidance and stool softeners
  description: >-
    Non-pharmacological management aimed at the identified triggers: stool
    softeners and slow passage of stool to reduce rectal attacks, and avoidance
    of cold wind and other provoking stimuli.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301342
    reference_title: "SCN9A Neuropathic Pain Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use of stool softeners and passing stool slowly to reduce the likelihood of
      triggering an attack.
    explanation: >-
      GeneReviews recommends this trigger-avoidance strategy for PEPD
      specifically.

differential_diagnoses:
- name: Primary Erythermalgia
  description: >-
    The allelic SCN9A disorder caused by variants that shift Nav1.7 activation to
    more negative potentials. Distinguished from PEPD by distal-extremity rather
    than rectal/ocular/submandibular territory, heat provocation and cooling
    relief rather than defecation and cold wind, and by its lack of response to
    carbamazepine.
  evidence:
  - reference: PMID:18945915
    reference_title: "NaV1.7 gain-of-function mutations as a continuum: A1632E displays physiological changes associated with erythromelalgia and paroxysmal extreme pain disorder mutations and produces symptoms of both disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Na(V)1.7 mutations that enhance activation produce inherited
      erythromelalgia (IEM), characterized by burning pain in the extremities
    explanation: >-
      States the biophysical and clinical basis on which the two allelic
      disorders are separated.
- name: Epilepsy
  description: >-
    The most common misdiagnosis. The tonic non-epileptic attacks and syncopal
    episodes of infantile PEPD are frequently interpreted as seizures; in infancy
    hyperekplexia and reflex anoxic seizures are the other common
    misattributions.
  evidence:
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is most likely to be misdiagnosed as epilepsy and, particularly in
      infancy, as hyperekplexia and reflex anoxic seizures.
    explanation: >-
      Names the differential diagnoses directly in the defining clinical series.

mechanistic_hypotheses:
- hypothesis_group_id: pepd_iem_continuum
  hypothesis_label: PEPD and inherited erythromelalgia as a biophysical continuum
  status: EMERGING
  description: >-
    The two syndromes are conventionally treated as non-overlapping, defined by
    impaired inactivation (PEPD) versus enhanced activation (IEM). A variant has
    been reported that produces both defects in the same channel and a mixed
    clinical phenotype, arguing that PEPD and IEM are ends of a physiological
    continuum rather than discrete entities. If correct, the clinical separation
    is a consequence of which biophysical parameter a given variant perturbs most
    strongly, not of two distinct disease mechanisms — and mixed phenotypes should
    be curated as such rather than forced into one syndrome.
  evidence:
  - reference: PMID:18945915
    reference_title: "NaV1.7 gain-of-function mutations as a continuum: A1632E displays physiological changes associated with erythromelalgia and paroxysmal extreme pain disorder mutations and produces symptoms of both disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These observations indicate that IEM and PEPD mutants are part of a
      physiological continuum that can produce a continuum of clinical
      phenotypes.
    explanation: >-
      States the continuum hypothesis and the single-variant evidence on which it
      rests.

notes: >-
  Frequency bands on the autonomic phenotypes are taken from the 77-patient,
  15-family international series (PMID:17679678), which reports flushing in all
  affected individuals and harlequin colour change and tonic attacks in most.
  Attack-territory phenotypes are not given a frequency band because the series
  reports the territories qualitatively ("often in the rectal, ocular, or jaw
  areas") without per-site counts.

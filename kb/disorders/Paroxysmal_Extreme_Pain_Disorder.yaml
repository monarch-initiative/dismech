name: Paroxysmal Extreme Pain Disorder
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Paroxysmal extreme pain disorder (PEPD), formerly called familial rectal pain
  syndrome, is an autosomal dominant sodium channelopathy caused by
  gain-of-function missense variants in SCN9A that impair fast inactivation of
  the nociceptor sodium channel Nav1.7, leaving a persistent (non-inactivating)
  sodium current. It presents in the neonatal period or infancy with autonomic
  manifestations — skin flushing, harlequin (patchy or asymmetric) colour change,
  tonic non-epileptic attacks, and syncope with bradycardia that can progress to
  asystole — and evolves into lifelong paroxysms of excruciating deep burning
  pain in rectal, ocular, and submandibular territory, triggered by defecation,
  cold wind, eating, and emotion. Carbamazepine is effective in almost all
  patients although the response is usually incomplete. PEPD is the
  impaired-inactivation member of the SCN9A neuropathic pain syndromes: it is
  allelic with, but biophysically and clinically distinct from, inherited
  erythromelalgia (hyperpolarized activation, distal-extremity, heat-triggered,
  carbamazepine-unresponsive) and SCN9A small-fibre neuropathy. Its early
  presentation is most often misdiagnosed as epilepsy, hyperekplexia, or reflex
  anoxic seizures.
category: Mendelian
parents:
- Channelopathy
- Peripheral Neuropathy
- hereditary disease

inheritance:
- name: Autosomal dominant
  description: >-
    PEPD segregates as an autosomal dominant trait; affected individuals are
    heterozygous for a gain-of-function SCN9A missense variant, and the
    international series ascertained 77 affected individuals across 15 families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To describe the clinical phenotype of paroxysmal extreme pain disorder
      (previously called familial rectal pain syndrome), an autosomal dominant
      condition recently shown to be a sodium channelopathy involving SCN9A.
    explanation: >-
      States the inheritance mode and the causative gene for the disorder in the
      defining international clinical series.
pathophysiology:
- name: SCN9A Missense Variant Impairing Nav1.7 Fast Inactivation
  description: >-
    A heterozygous missense variant in SCN9A alters residues governing fast
    inactivation of Nav1.7. Eight such variants were identified across 11
    families and two sporadic cases in the founding genetic study. The lesion is
    mechanistically specific: it is not a generic gain of function but a
    selective failure of the channel to close after opening, which is what
    separates PEPD from the allelic erythromelalgia variants that instead shift
    the activation threshold.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "nociceptor_sodium_channel_excitability#Nociceptor Voltage-Gated Sodium Channel Variant"
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genome-wide linkage search followed by mutational analysis of the
      candidate gene SCN9A, which encodes hNa(v)1.7, identified eight missense
      mutations in 11 families and 2 sporadic cases.
    explanation: >-
      Establishes SCN9A missense variation as the causal lesion and quantifies
      the allelic series in the defining cohort.
  downstream:
  - target: Persistent Non-Inactivating Nav1.7 Sodium Current
    description: >-
      The variant channel fails to inactivate fully, so a fraction of the sodium
      current persists after depolarization.

- name: Persistent Non-Inactivating Nav1.7 Sodium Current
  description: >-
    Patch-clamp analysis of PEPD mutant channels shows reduced fast inactivation
    and a resulting persistent inward sodium current. Because this current flows
    during and after depolarization rather than lowering the threshold for
    depolarization, it produces sustained rather than merely facilitated firing —
    the biophysical signature that distinguishes PEPD from inherited
    erythromelalgia and that predicts its selective carbamazepine response.
  role: amplifier
  biological_scale: MOLECULAR
  conforms_to: "nociceptor_sodium_channel_excitability#Enhanced or Persistent Nociceptor Sodium Current"
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:17145499
    reference_title: "SCN9A mutations in paroxysmal extreme pain disorder: allelic variants underlie distinct channel defects and phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis in vitro of three of these mutant Na(v)1.7 channels
      revealed a reduction in fast inactivation, leading to persistent sodium
      current.
    explanation: >-
      Direct electrophysiological demonstration of the persistent-current
      mechanism in PEPD mutant channels.
  - reference: PMID:18945915
    reference_title: "NaV1.7 gain-of-function mutations as a continuum: A1632E displays physiological changes associated with erythromelalgia and paroxysmal extreme pain disorder mutations and produces symptoms of both disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Na(V)1.7 mutations that impair inactivation produce a different,
      nonoverlapping syndrome, paroxysmal extreme pain disorder (PEPD),
      characterized by rectal, periocular, and perimandibular pain.
    explanation: >-
      Confirms impaired inactivation as the PEPD-specific mechanism and ties it
      to the syndrome's characteristic pain territory.
  downstream:
  - target: Nociceptor and Autonomic Neuron Hyperexcitability
    description: >-
      Persistent sodium current lowers the threshold for repetitive firing in
      Nav1.7-expressing sensory and sympathetic neurons.

- name: Nociceptor and Autonomic Neuron Hyperexcitability
  description: >-
    Nav1.7 is expressed in sympathetic and trigeminal ganglion neurons as well as
    in dorsal root ganglion nociceptors, and PEPD variants render both classes
    hyperexcitable. This dual distribution is what makes PEPD an autonomic as
    well as a pain disorder, and explains why the autonomic manifestations —
    flushing, harlequin colour change, bradycardic syncope — dominate the
    neonatal presentation before the pain paroxysms declare themselves.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "nociceptor_sodium_channel_excitability#Nociceptor Action Potential Threshold and Firing"
  cell_types:
  - preferred_term: nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  - preferred_term: autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  biological_processes:
  - preferred_term: action potential
    term:
      id: GO:0001508
      label: action potential
    modifier: INCREASED
  evidence:
  - reference: PMID:18945915
    reference_title: "NaV1.7 gain-of-function mutations as a continuum: A1632E displays physiological changes associated with erythromelalgia and paroxysmal extreme pain disorder mutations and produces symptoms of both disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using current clamp, we show that A1632E renders dorsal root ganglion (DRG)
      and trigeminal ganglion neurons hyperexcitable.
    explanation: >-
      Demonstrates that a variant carrying the PEPD impaired-inactivation defect
      makes both DRG and trigeminal neurons hyperexcitable, matching the
      disorder's sensory territory.
  - reference: PMID:14985375
    reference_title: "Mutations in SCN9A, encoding a sodium channel alpha subunit, in patients with primary erythermalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCN9A, encoding a voltage-gated sodium channel alpha subunit predominantly
      expressed in sensory and sympathetic neurones, may play an important role
      in nociception and vasomotor regulation.
    explanation: >-
      Establishes the sensory-plus-sympathetic expression pattern that accounts
      for the combined pain and autonomic output of this node.
  downstream:
  - target: Trigger-Evoked Pain Paroxysms
    description: >-
      Hyperexcitable nociceptors fire in prolonged bursts when their territory is
      stimulated.
  - target: Paroxysmal Sympathetic Dysregulation
    description: >-
      Hyperexcitable sympathetic neurons produce episodic vasomotor and
      cardiovagal instability.

- name: Trigger-Evoked Pain Paroxysms
  description: >-
    Attacks of excruciating deep burning pain, initially and most characteristically
    rectal, and later also ocular, submandibular or diffuse. The triggers are
    stimuli that mechanically or thermally activate the affected territory —
    defecation, cold wind, eating, and emotion — consistent with a lowered firing
    threshold rather than with spontaneous discharge alone.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sensory perception of pain
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: INCREASED
  evidence:
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Later, the disorder is characterized by attacks of excruciating deep
      burning pain often in the rectal, ocular, or jaw areas, but also diffuse.
      Attacks are triggered by factors such as defecation, cold wind, eating, and
      emotion.
    explanation: >-
      Documents the pain phenotype and its trigger profile in the defining
      77-patient international series.

- name: Paroxysmal Sympathetic Dysregulation
  description: >-
    Episodic autonomic instability that dominates the neonatal and infantile
    phase: skin flushing in all affected individuals, harlequin (patchy or
    asymmetric) colour change and tonic non-epileptic attacks in most, and
    dramatic syncopes with bradycardia that sometimes reach asystole. It is this
    presentation, not the pain, that most often leads to an initial misdiagnosis
    of epilepsy, hyperekplexia, or reflex anoxic seizures.
  role: effector
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  evidence:
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autonomic manifestations predominate initially, with skin flushing in all
      and harlequin color change and tonic attacks in most. Dramatic syncopes
      with bradycardia and sometimes asystole are common.
    explanation: >-
      Establishes the autonomic arm as the presenting phenotype and records the
      frequency bands used for the individual phenotype entries.
  - reference: PMID:17679678
    reference_title: "Paroxysmal extreme pain disorder (previously familial rectal pain syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is most likely to be misdiagnosed as epilepsy and, particularly in
      infancy, as hyperekplexia and reflex anoxic seizures.
    explanation: >-
      Documents the diagnostic confusion that follows from the autonomic and
      tonic-attack presentation.


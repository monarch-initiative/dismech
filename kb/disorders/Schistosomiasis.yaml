datasets:
- accession: geo:GSE313156
  title: Temporal modulation of gene expression in a controlled Schistosoma mansoni human infection model
  description: Background Schistosomiasis is caused by parasitic blood flukes of the genus Schistosoma. Despite ongoing mass drug administration efforts, the disease remains a major public health burden in endemic regions. A better understanding of early host responses to schistosomiasis is critical for developing effective vaccines and therapeutics. Methods We conducted a longitudinal transcriptomic study of peripheral blood samples from 30 Schistosoma-naïve volunteers participating in two controlled human infection trials with male-or female-only S. mansoni cercariae. Blood was collected at six time points over 20 weeks post-infection.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 144
  publication: PMID:41476985
  notes: Identified by GEO DataSets index search for Schistosomiasis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE289753
  title: A Novel Combination Therapy with Uridine and Praziquantel effectively Alleviates Schistosomiasis-induced Hepatic Fibrosis through Promoting Adipogenic Differentiation
  description: Schistosomiasis-induced hepatic fibrosis, a consequence of egg-induced granulomatous lesions, remains untreated by current drugs. Therefore, the development of novel antifibrosis drugs is of paramount importance. Our previous study indicated that aberrant uridine concentrations play a pivotal role in schistosomiasis-induced hepatic fibrosis. This study aimed to explore the inhibitory role of uridine in schistosomiasis-induced liver fibrosis and the regulatory mechanism of uridine on hepatic stellate cell (HSC) activation. The results indicated that uridine could inhibit schistosomiasis-induced liver fibrosis in vivo and TGF-β-induced HSC activation in vitro.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 9
  notes: Identified by GEO DataSets index search for Schistosomiasis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE298216
  title: Verification of gene expression profiles in the liver tissues of mice after schistosomiasis infection
  description: In order to further improve our method for measuring gene expression after different days of schistosomiasis infection, we adopted whole-genome microarray expression analysis as the sequencing platform to identify those genes with potential for distinguishing different infection times (applicable for the corresponding exposure range of medical decisions in cases of schistosomiasis infection after different days). We infected 15-day, 24-day and 45-day healthy mice with schistosomiasis and determined a consensus characteristic of successful schistosomiasis infection, which could distinguish infection days and control samples.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: MICROARRAY
  sample_count: 7
  notes: Identified by GEO DataSets index search for Schistosomiasis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

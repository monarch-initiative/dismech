discussions:
- discussion_id: gap_cyclospora_infectious_dose
  prompt: >-
    What is the infectious dose of Cyclospora cayetanensis in humans, and which
    host and oocyst-viability factors determine whether ingestion of sporulated
    oocysts establishes infection? A CDC human challenge pilot study failed to
    infect any of seven healthy volunteers despite inocula of up to ~49,000
    oocysts, leaving the minimal infectious dose, the role of host
    susceptibility, and the required post-sporulation oocyst maturation/viability
    unresolved.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ingestion of sporulated Cyclospora oocysts
  rationale: >-
    Because oocysts must sporulate in the environment for days to weeks before
    becoming infective, oocyst age and viability at the time of ingestion may be
    critical determinants of infectivity. The negative human challenge result
    suggests either a high infectious dose, unrecognized host-susceptibility
    requirements, or loss of oocyst viability in the prepared inoculum. This gap
    limits mechanistic modeling of transmission and controlled experimental
    reproduction of disease.
  proposed_experiments:
  - experiment_id: exp_cyclospora_dose_response_challenge
    name: Controlled human infection dose-response study with viability-verified oocysts
    description: >-
      A controlled human infection model using freshly sporulated,
      viability-verified C. cayetanensis oocysts across graded doses to define
      the minimal infectious dose and characterize host-susceptibility factors,
      contingent on establishing reliable in vitro sporulation and viability
      assays.
    experiment_type:
      preferred_term: controlled human infection model
  evidence:
  - reference: PMID:15200870
    reference_title: "Human challenge pilot study with Cyclospora cayetanensis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The volunteers did not experience symptoms of gastroenteritis, and no oocysts were detected in any stool samples during the 16 weeks volunteers were monitored."
    explanation: Documents the failed human challenge that leaves the infectious dose and host-susceptibility determinants unresolved.

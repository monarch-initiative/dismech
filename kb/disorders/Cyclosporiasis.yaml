    complication reported in immunocompromised (AIDS) hosts, in whom Cyclospora
    can infect the gallbladder epithelium.
  phenotype_term:
    preferred_term: Acalculous cholecystitis
    term:
      id: HP:0001082
      label: Cholecystitis
  evidence:
  - reference: PMID:11702292
    reference_title: "Histologic proof of acalculous cholecystitis due to Cyclospora cayetanensis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of acalculous cholecystitis in a person with acquired immunodeficiency syndrome who required cholecystectomy and demonstrated C. cayetanensis in the gallbladder epithelium."
    explanation: Documents histologically proven biliary (acalculous cholecystitis) involvement in an immunocompromised host.
diagnosis:
- name: Modified acid-fast staining of stool oocysts
  description: >-
    Cyclospora oocysts (8-9 microns in diameter) are detected in stool by
    modified acid-fast staining, in which they stain variably red; they are
    larger than Cryptosporidium oocysts, aiding differentiation.
  diagnosis_term:
    preferred_term: microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:1928575
    reference_title: "An alga-like organism associated with an outbreak of prolonged diarrhea among foreigners in Nepal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The organism is 8.0-9.0 microns in diameter, floats in Sheather's solution, and stains red with the modified acid-fast stain."
    explanation: Supports modified acid-fast microscopy and oocyst size as the classic diagnostic approach.
- name: Multiplex PCR stool gastrointestinal panel
  description: >-
    Syndromic multiplex-PCR gastrointestinal panels now detect C. cayetanensis
    DNA in stool alongside other enteric protozoa, offering high sensitivity and
    rapid detection compared with microscopy.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:32326453
    reference_title: "Evaluation of the Allplex Gastrointestinal Panel-Parasite Assay for Protozoa Detection in Stool Samples: A Retrospective and Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recently marketed assay AllplexTM Gastrointestinal Panel-Parasite Assay (GIPPA) (Seegene, Seoul, Korea) is able to detect most protozoa pathogens, i.e., Giardia duodenalis, Cryptosporidium spp., Entamoeba histolytica, Dientamoeba fragilis, Blastocystis hominis, and Cyclospora cayetanensis."
    explanation: Documents a multiplex PCR stool panel that specifically detects C. cayetanensis.
  - reference: PMID:32326453
    reference_title: "Evaluation of the Allplex Gastrointestinal Panel-Parasite Assay for Protozoa Detection in Stool Samples: A Retrospective and Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensitivity reached 100% for C. cayetanensis (4/4), Cryptosporidium spp. (26/26), and B. hominis (26/26) positive samples."
    explanation: Supports high multiplex-PCR sensitivity for C. cayetanensis versus microscopy.
differential_diagnoses:
- name: Cryptosporidiosis
  description: >-
    Another coccidian diarrheal infection with overlapping watery diarrhea and
    similar acid-fast staining; Cyclospora oocysts are larger and could be
    misdiagnosed as Cryptosporidium.
  disease_term:
    preferred_term: cryptosporidiosis
    term:
      id: MONDO:0015474
      label: cryptosporidiosis
  distinguishing_features:
  - Cyclospora oocysts are 8-9 microns, roughly twice the diameter of Cryptosporidium oocysts.
  - Both stain with modified acid-fast; Cyclospora oocysts autofluoresce under UV microscopy.
  evidence:
  - reference: PMID:1928575
    reference_title: "An alga-like organism associated with an outbreak of prolonged diarrhea among foreigners in Nepal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the agent was closely associated with a prolonged, self-limited diarrheal illness, it could easily have been misdiagnosed as Cryptosporidium."
    explanation: Supports cryptosporidiosis as a key differential owing to overlapping presentation.
- name: Isosporiasis
  description: >-
    Cystoisospora (Isospora) belli is a related coccidian that also causes
    chronic diarrhea in immunocompromised hosts and responds to the same
    trimethoprim-sulfamethoxazole therapy.
  disease_term:
    preferred_term: isosporiasis
    term:
      id: MONDO:0018769
      label: isosporiasis
  distinguishing_features:

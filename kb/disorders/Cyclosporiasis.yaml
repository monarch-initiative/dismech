name: Cyclosporiasis
creation_date: '2026-07-09T00:00:00Z'
category: Infectious Disease
description: >-
  Cyclosporiasis is an intestinal infection caused by the coccidian protozoan
  parasite Cyclospora cayetanensis, acquired through ingestion of sporulated
  oocysts on contaminated fresh produce or in water, and characterized by
  prolonged, often relapsing watery diarrhea, profound fatigue, anorexia, and
  weight loss.
disease_term:
  preferred_term: cyclosporiasis
  term:
    id: MONDO:0005725
    label: cyclosporiasis
parents:
- parasitic intestinal disorder
- coccidiosis
synonyms:
- Cyclospora infection
- Cyclospora cayetanensis infection
- cyclosporosis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:20065331
      reference_title: "Update on Cyclospora cayetanensis, a food-borne and waterborne parasite."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The coccidian parasite Cyclospora cayetanensis is recognized as an emerging pathogen that causes protracted diarrhea in humans."
      explanation: Supports classification as a protozoan (coccidian) enteric infectious disease.
has_subtypes:
- name: Immunocompetent
  display_name: Immunocompetent self-limited cyclosporiasis
  classification: clinical_course
  description: >-
    In immunocompetent hosts the illness is a prolonged but ultimately
    self-limited diarrheal disease, though the course is protracted and often
    relapsing when untreated.
  evidence:
  - reference: PMID:1928575
    reference_title: "An alga-like organism associated with an outbreak of prolonged diarrhea among foreigners in Nepal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An unidentified organism was found in the stools of 55 immunocompetent patients who presented to the CIWEC Clinic in Kathmandu, Nepal"
    explanation: Documents the prolonged, self-limited diarrheal illness in immunocompetent hosts.
- name: Immunocompromised
  display_name: Cyclosporiasis in immunocompromised hosts
  classification: clinical_course
  description: >-
    In HIV-infected and other immunocompromised patients, Cyclospora
    frequently causes chronic diarrhea and may require prolonged therapy and
    secondary prophylaxis.
  evidence:
  - reference: PMID:10836915
    reference_title: "Trimethoprim-sulfamethoxazole compared with ciprofloxacin for treatment and prophylaxis of Isospora belli and Cyclospora cayetanensis infection in HIV-infected patients. A randomized, controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In developing countries, Isospora belli and Cyclospora cayetanensis frequently cause chronic diarrhea in HIV-infected patients."
    explanation: Supports a distinct chronic-diarrhea phenotype in immunocompromised (HIV) hosts.
infectious_agent:
- name: Cyclospora cayetanensis
  infectious_agent_term:
    preferred_term: Cyclospora cayetanensis
    term:
      id: NCBITaxon:88456
      label: Cyclospora cayetanensis
  description: >-
    Obligate intracellular apicomplexan coccidian parasite; the species of the
    genus Cyclospora established as a human enteric pathogen. Oocysts are shed
    unsporulated in feces and require days to weeks in the environment to
    sporulate and become infective, which precludes direct person-to-person
    transmission.
  evidence:
  - reference: PMID:20065331
    reference_title: "Update on Cyclospora cayetanensis, a food-borne and waterborne parasite."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The coccidian parasite Cyclospora cayetanensis is recognized as an emerging pathogen that causes protracted diarrhea in humans."
    explanation: Identifies C. cayetanensis as the coccidian etiologic agent of protracted diarrheal disease.
  - reference: PMID:11049789
    reference_title: "Cyclospora cayetanensis: a review, focusing on the outbreaks of cyclosporiasis in the 1990s."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the surprises has been the fact that a parasite that likely requires days to weeks outside the host to become infectious has repeatedly caused foodborne outbreaks, including large multistate outbreaks in the United States and Canada."
    explanation: Supports the environmental sporulation requirement that precludes direct person-to-person spread.
transmission:
- name: Foodborne transmission via contaminated fresh produce
  description: >-
    Ingestion of sporulated oocysts on contaminated fresh produce is the
    dominant recognized route in documented outbreaks, notably large multistate
    outbreaks in the United States and Canada.
  evidence:
  - reference: PMID:11049789
    reference_title: "Cyclospora cayetanensis: a review, focusing on the outbreaks of cyclosporiasis in the 1990s."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the surprises has been the fact that a parasite that likely requires days to weeks outside the host to become infectious has repeatedly caused foodborne outbreaks, including large multistate outbreaks in the United States and Canada."
    explanation: Supports foodborne outbreak transmission as a principal recognized route.
  - reference: PMID:9605784
    reference_title: "A foodborne outbreak of Cyclospora cayetanensis at a wedding: clinical features and risk factors for illness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "containing raspberries, strawberries, blackberries, and blueberries."
    explanation: Implicates fresh berries as the specific produce vehicle in a foodborne outbreak.
- name: Waterborne and fecal-oral transmission
  description: >-
    Ingestion of water or food contaminated with sporulated oocysts via the
    oro-fecal route, particularly in endemic tropical and subtropical regions.
  evidence:
  - reference: PMID:11049789
    reference_title: "Cyclospora cayetanensis: a review, focusing on the outbreaks of cyclosporiasis in the 1990s."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the foodborne and waterborne outbreaks of cyclosporiasis that were documented from 1990 through 1999"
    explanation: Supports both foodborne and waterborne routes documented in outbreak surveillance.
epidemiology:
- name: Traveler's diarrhea and endemic exposure
  description: >-
    Cyclospora is an established cause of traveler's diarrhea and is
    distributed worldwide, causing infection in healthy adults and children as
    well as in returning travelers.
  factors:
  - international travel to endemic regions
  - consumption of contaminated produce or water
  evidence:
  - reference: PMID:20065331
    reference_title: "Update on Cyclospora cayetanensis, a food-borne and waterborne parasite."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since then, Cyclospora has been considered a cause of traveler's diarrhea."
    explanation: Supports Cyclospora as a recognized cause of traveler's diarrhea.
  - reference: PMID:9772334
    reference_title: "Cyclosporiasis in a traveler returning from South America."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In recent years, several studies have shown that Cyclospora is not a rare opportunistic pathogen but rather is the cause of common, worldwide intestinal infections in healthy adults and children."
    explanation: Supports worldwide distribution and infection of immunocompetent adults and children.
- name: Proportion of traveler's diarrhea attributable to Cyclospora
  description: >-
    In a traveler cohort, Cyclospora accounted for a small but distinct
    fraction of traveler's diarrhea cases.
  factors:
  - returning travelers with diarrhea
  unit: percent of traveler's diarrhea cases
  evidence:
  - reference: PMID:8588145
    reference_title: "Cyclospora in patients with traveller's diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLB was found in 2.8% of all cases of traveller's diarrhea in our series."
    explanation: Quantifies the fraction of traveler's diarrhea attributable to Cyclospora in this cohort.
progression:
- phase: Incubation
  incubation_days: '7'
  notes: >-
    The median incubation period is approximately one week, as characterized in
    point-source foodborne outbreaks.
  evidence:
  - reference: PMID:9605784
    reference_title: "A foodborne outbreak of Cyclospora cayetanensis at a wedding: clinical features and risk factors for illness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epidemic curve was consistent with a point source outbreak with a median incubation period of 7 days."
    explanation: Supports a median incubation period of about one week.
- phase: Prolonged untreated illness
  notes: >-
    Untreated illness is protracted, with average symptom duration exceeding
    three weeks and no self-treatment shown to shorten it.
  evidence:
  - reference: PMID:7885125
    reference_title: "Placebo-controlled trial of co-trimoxazole for Cyclospora infections among travellers and foreign residents in Nepal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average duration of symptoms is more than three weeks, and no specific treatment has been shown to shorten the illness."
    explanation: Supports the characteristically protracted untreated course.
- phase: Relapsing course
  notes: >-
    The diarrheal illness is characteristically relapsing/remitting before
    resolution or treatment.
  evidence:
  - reference: PMID:9772334
    reference_title: "Cyclosporiasis in a traveler returning from South America."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The parasite is associated with prolonged self-limiting and relapsing watery diarrhea, anorexia, fatigue, and sometimes myalgia."
    explanation: Supports the relapsing nature of the diarrheal course.
- phase: Chronic infection in immunocompromised hosts
  notes: >-
    In HIV-infected patients, Cyclospora frequently produces chronic diarrhea
    that may require prolonged therapy and secondary prophylaxis.
  evidence:
  - reference: PMID:10836915
    reference_title: "Trimethoprim-sulfamethoxazole compared with ciprofloxacin for treatment and prophylaxis of Isospora belli and Cyclospora cayetanensis infection in HIV-infected patients. A randomized, controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In developing countries, Isospora belli and Cyclospora cayetanensis frequently cause chronic diarrhea in HIV-infected patients."
    explanation: Supports chronic progression in immunocompromised hosts.
pathophysiology:
- name: Ingestion of sporulated Cyclospora oocysts
  description: >-
    Infection begins with ingestion of environmentally sporulated oocysts;
    freshly passed oocysts are not infective, so transmission requires an
    environmental maturation interval of days to weeks.
  downstream:
  - target: Excystation and invasion of small-intestinal enterocytes
    description: Ingested sporulated oocysts release sporozoites that invade small-bowel epithelial cells.
    evidence:
    - reference: PMID:9395371
      reference_title: "Pathologic and clinical findings in patients with cyclosporiasis and a description of intracellular parasite life-cycle stages."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The intracellular life-cycle stages of these parasites in the enterocytes of patients will also be described."
      explanation: Supports establishment of intracellular infection within enterocytes after ingestion.
  evidence:
  - reference: PMID:11049789
    reference_title: "Cyclospora cayetanensis: a review, focusing on the outbreaks of cyclosporiasis in the 1990s."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the surprises has been the fact that a parasite that likely requires days to weeks outside the host to become infectious has repeatedly caused foodborne outbreaks, including large multistate outbreaks in the United States and Canada."
    explanation: Supports the environmental sporulation requirement as the initiating epidemiologic step.
- name: Excystation and invasion of small-intestinal enterocytes
  description: >-
    Sporozoites excyst in the small intestine and invade enterocytes, where the
    parasite completes asexual and sexual developmental stages within
    parasitophorous vacuoles at the luminal end of the epithelial cells.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: jejunum
    term:
      id: UBERON:0002115
      label: jejunum
  biological_processes:
  - preferred_term: entry into host enterocyte
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Villous atrophy and mucosal inflammation
    description: Intraepithelial parasitism drives small-bowel architectural injury.
    evidence:
    - reference: PMID:9395371
      reference_title: "Pathologic and clinical findings in patients with cyclosporiasis and a description of intracellular parasite life-cycle stages."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Jejunal biopsies showed an altered mucosal architecture with shortening and widening of the intestinal villi due to diffuse edema and infiltration by a mixed inflammatory cell infiltrate."
      explanation: Links intraepithelial infection to villous shortening and inflammatory injury.
  evidence:
  - reference: PMID:9395371
    reference_title: "Pathologic and clinical findings in patients with cyclosporiasis and a description of intracellular parasite life-cycle stages."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type I and II meronts, with 8-12 and 4 fully differentiated merozoites, respectively, were found at the luminal end of epithelial cells."
    explanation: Documents intracellular meront (asexual) developmental stages within enterocytes.
- name: Villous atrophy and mucosal inflammation
  description: >-
    Small-bowel biopsies show villous shortening and widening with diffuse
    edema and a mixed inflammatory cell infiltrate, reflecting mucosal injury
    from intracellular infection.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Malabsorption and diarrhea
    description: Loss of absorptive villous surface and mucosal injury impair absorption and drive watery diarrhea.
    evidence:
    - reference: PMID:9395371
      reference_title: "Pathologic and clinical findings in patients with cyclosporiasis and a description of intracellular parasite life-cycle stages."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients presented with gastrointestinal symptoms, including diarrhea, flatulence, weight loss, abdominal discomfort, and nausea."
      explanation: Links the mucosal injury to the malabsorptive/diarrheal clinical presentation.
  evidence:
  - reference: PMID:9395371
    reference_title: "Pathologic and clinical findings in patients with cyclosporiasis and a description of intracellular parasite life-cycle stages."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Jejunal biopsies showed an altered mucosal architecture with shortening and widening of the intestinal villi due to diffuse edema and infiltration by a mixed inflammatory cell infiltrate."
    explanation: Supports villous atrophy and inflammatory infiltrate as the core mucosal lesion.
- name: Malabsorption and diarrhea
  description: >-
    Reduced absorptive surface area and epithelial dysfunction produce
    malabsorption and prolonged, often relapsing watery diarrhea, with
    associated anorexia, fatigue, and weight loss.
  downstream:
  - target: Diarrhea
    description: Net fluid and nutrient malabsorption manifests as prolonged watery diarrhea.
    evidence:
    - reference: PMID:1928575
      reference_title: "An alga-like organism associated with an outbreak of prolonged diarrhea among foreigners in Nepal."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The illness was characterized by prolonged watery diarrhea, anorexia, fatigue, and weight loss."
      explanation: Links the malabsorptive process to the hallmark prolonged watery diarrhea and constitutional symptoms.
  evidence:
  - reference: PMID:1928575
    reference_title: "An alga-like organism associated with an outbreak of prolonged diarrhea among foreigners in Nepal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The illness was characterized by prolonged watery diarrhea, anorexia, fatigue, and weight loss."
    explanation: Supports the malabsorptive/diarrheal syndrome with constitutional features.

    reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TYRP1-expression was observed in one out of five stained PVR membranes and colocalized with α-SMA pointing toward a possible epithelial-to-mesenchymal transdifferentiation of RPE cells to myofibroblasts in this patient"
    explanation: >-
      Immunofluorescence of excised human PVR tissue directly shows
      colocalization of RPE/melanocytic marker TYRP1 with myofibroblast marker
      alpha-SMA, alongside CD44+ EMT clusters on imaging mass cytometry.
  - reference: PMID:12101449
    reference_title: Novel growth factors involved in the pathogenesis of proliferative vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TGF-beta is activated, upregulating expression of CTGF. Under the
      influence of TGF-beta and CTGF, RPE become myofibroblastic and
      fibrosis ensues.
    explanation: >-
      Identifies TGF-beta/CTGF signaling as the proximate driver of RPE
      myofibroblastic transdifferentiation.
  - reference: PMID:26562474
    reference_title: Mechanisms of epithelial-mesenchymal transition in proliferative vitreoretinopathy.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      RPE cells undergo a process named epithelial-mesenchymal transition
      (EMT), by which differentiated epithelial cells go through a
      phenotypic conversion that gives rise to the matrix-producing
      fibroblasts and myofibroblasts
    explanation: >-
      Review synthesis describing RPE-to-myofibroblast EMT conversion as the
      central cellular effector step of PVR pathogenesis.
  downstream:
  - target: Contractile Fibrocellular Membrane Formation
    causal_link_type: DIRECT
    description: >-
      Alpha-SMA-positive myofibroblasts generated via RPE EMT and myeloid
      transdifferentiation express vimentin and type I/III collagens to build
      contractile fibrotic membranes.
    evidence:
    - reference: PMID:35579905
      reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "nearly all α-SMA positive cells expressed vimentin (96.3% ±1.1%) and collagen 1 (96.6% ±1.1%), highlighting the role of myofibroblasts in the production of extracellular matrix proteins in PVR"
      explanation: >-
        Single-cell imaging mass cytometry directly links alpha-SMA+
        myofibroblasts to collagen I and vimentin production in human PVR
        membranes.

- name: Contractile Fibrocellular Membrane Formation
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Alpha-SMA-positive myofibroblasts, dispersed RPE cells, and reactive
    retinal glial cells (notably Mueller cells) proliferate and deposit dense
    extracellular matrix enriched in fibronectin (FN1), types I and III
    collagen (COL1A1, COL1A2, COL3A1), SPARC, and metalloproteinase inhibitors
    (TIMP1, TIMP3), forming contractile preretinal and subretinal
    fibrocellular membranes. Vitreous TGF-beta2 levels rise monotonically with
    clinical fibrosis severity.
  role: effector
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798

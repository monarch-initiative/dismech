- name: Dilated fundus examination with Retina Society grading
  presence: Post-test confirmation
  description: >-
    Dilated indirect ophthalmoscopy and ultra-widefield fundus examination
    staged by the 1991 Retina Society classification (Grades A, B, and C
    anterior/posterior by contraction type and clock-hour extent) is the
    standard clinical diagnostic method.
  diagnosis_term:
    preferred_term: retinal examination
    term:
      id: NCIT:C101217
      label: Retinal Examination
  results: "PVR grade A (vitreous haze/pigment clumps), B (retinal wrinkling/vessel tortuosity), or C (anterior/posterior full-thickness folds or preretinal/subretinal membranes staged by clock hours)."
  evidence:
  - reference: PMID:1867299
    reference_title: An updated classification of retinal detachment with proliferative vitreoretinopathy.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Posterior and anterior location of the proliferations have been
      emphasized.
    explanation: Describes the 1991 Retina Society clinical staging system used for diagnosis and grading.

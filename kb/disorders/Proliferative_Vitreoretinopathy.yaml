    reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the former, FN1 (Fibronectin 1), COL1A1 (alpha-1 type I Collagen), COL1A2 (alpha-2 type I Collagen), SPARC (Osteonectin), and COL3A1 (alpha-1 type III Collagen) were the five highest expressed DEG in PVR"
    explanation: >-
      Bulk RNA sequencing of surgical human PVR membranes demonstrates marked
      upregulation of fibronectin, collagens I and III, and SPARC.
  - reference: PMID:2708527
    reference_title: Correlation of fibrosis and transforming growth factor-beta type 2 levels in the eye.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vitreous aspirates from eyes with intraocular fibrosis associated with
      PVR have more than three times the amount of TGF-beta
    explanation: >-
      Demonstrates that vitreous TGF-beta (predominantly TGF-beta2) levels
      correlate with the degree of intraocular fibrotic membrane formation.
  downstream:
  - target: Epiretinal and subretinal membranes
    causal_link_type: DIRECT
    description: >-
      ECM deposition and cellular proliferation on the inner and outer retinal
      surfaces manifest clinically and on OCT as preretinal and subretinal
      membranes.
    evidence:
    - reference: PMID:40311677
      reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On SS-OCT, they had a thick hyperreflective membrane emanating from the retinal pigment epithelium and extending along the outer retinal surface"
      explanation: >-
        SS-OCT directly visualizes the hyperreflective fibrocellular membranes
        along the retinal surface in Grade C PVR.
  - target: Tractional Retinal Redetachment
    causal_link_type: DIRECT
    description: >-
      Alpha-SMA-mediated myofibroblast contraction within epiretinal and
      subretinal membranes generates tangential and anteroposterior traction
      on the retina.
    evidence:
    - reference: PMID:2708527
      reference_title: Correlation of fibrosis and transforming growth factor-beta type 2 levels in the eye.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "The fibrosis results in the development of contractile forces on the retina causing retinal folding and traction retinal detachments."
      explanation: >-
        Links intraocular fibrotic membrane formation directly to contractile
        traction on the retina.

- name: Tractional Retinal Redetachment
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  description: >-
    Contraction of preretinal, intraretinal, and subretinal fibrocellular
    membranes distorts retinal lamellar architecture, producing outer retinal
    corrugations, fixed retinal folds, retinal foreshortening, and tractional
    (re)detachment. Severity is staged clinically by the 1991 Retina Society
    classification (Grades A-C, subdivided into posterior and anterior
    contraction types by clock-hour extent).
  role: consequence
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:1867299
    reference_title: An updated classification of retinal detachment with proliferative vitreoretinopathy.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      A more detailed description of posterior and anterior contractions
      has been made possible by adding contraction types such as focal,
      diffuse, subretinal, circumferential contraction, and anterior
      displacement.
    explanation: >-
      Consensus classification defining the posterior and anterior membrane
      contraction patterns that drive tractional PVR redetachment.
  - reference: PMID:40311677
    reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant preretinal membranes with loss of differentiation of the inner and outer retinal lamellae and distortion of underlying ORCs were observed."
    explanation: >-
      Demonstrates architectural distortion of retinal lamellae and outer
      retinal corrugations in human Grade C PVR.
  downstream:
  - target: Retinal folds
    causal_link_type: DIRECT
    description: >-
      Tangential preretinal and subretinal membrane contraction wrinkles and
      buckles the retina into high-amplitude corrugations and fixed folds.
    evidence:
    - reference: PMID:40311677
      reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On SS-OCT, they had a thick hyperreflective membrane emanating from the retinal pigment epithelium and extending along the outer retinal surface, causing tractional folds of the outer retina in 47% (8/17) of cases"
      explanation: >-
        Demonstrates membrane traction directly producing outer retinal folds
        on swept-source OCT.
  - target: Tractional retinal detachment
    causal_link_type: DIRECT
    description: >-
      Sustained membrane contraction elevates the neurosensory retina off the
      RPE or causes recurrent postoperative redetachment.
    evidence:
    - reference: PMID:39572739
      reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Retinal re-detachment due to PVR recurrence occurred in 15 (25%) eyes"
      explanation: >-
        Quantifies clinical tractional redetachment driven by recurrent Grade C
        PVR after vitreoretinal surgery.

phenotypes:
- category: Ophthalmologic
  name: Vitreous haze
  description: >-
    Vitreous haze, pigment clumps, and pigment clusters on the inferior retina
    (Grade A) are the earliest clinical signs of PVR, reflecting dispersed RPE
    cells, proteinaceous exudate, and inflammatory cells in the vitreous cavity.
  phenotype_term:
    preferred_term: Vitreous haze
    term:
      id: HP:0030652
      label: Vitreous haze
  evidence:
  - reference: PMID:27429798
    reference_title: "Classifications for Proliferative Vitreoretinopathy (PVR): An Analysis of Their Use in Publications over the Last 15 Years."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "| A | Vitreous haze, pigment clumps, and pigment clusters on inferior retina |"
    explanation: >-
      Documents the updated 1991 Retina Society classification criteria for
      Grade A PVR: vitreous haze, pigment clumps, and pigment clusters on the
      inferior retina.
  - reference: PMID:40311677
    reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with no signs of PVR or PVR A (49/100) were more likely to have a preserved bacillary layer on SS-OCT with low-amplitude outer retinal corrugations (ORCs) compared with the PVR B/C group."
    explanation: >-
      Documents early PVR Grade A cases within a prospective 100-patient
      rhegmatogenous retinal detachment cohort staged by the 1991 Retina
      Society classification.
- category: Ophthalmologic
  name: Retinal folds
  diagnostic: true
  description: >-
    Inner retinal wrinkling with high-amplitude outer retinal corrugations
    (Grade B, 24% of primary RRD cases in OCT staging) and full-thickness
    fixed or tractional outer retinal folds (Grade C) reflect progressive
    membrane contraction.
  phenotype_term:
    preferred_term: Retinal fold
    term:
      id: HP:0008052
      label: Retinal fold
  evidence:
  - reference: PMID:40311677
    reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proliferative vitreoretinopathy B (retinal wrinkling/vessel tortuosity) was present in 24% (24/100) of cases, all of which had high-amplitude ORCs."
    explanation: >-
      Documents Grade B retinal wrinkling and outer retinal corrugations in
      24% of patients.
  - reference: PMID:40311677
    reference_title: "Assessment of Proliferative Vitreoretinopathy in Rhegmatogenous Retinal Detachment with OCT: Revisiting the 1991 Retina Society Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On SS-OCT, they had a thick hyperreflective membrane emanating from the retinal pigment epithelium and extending along the outer retinal surface, causing tractional folds of the outer retina in 47% (8/17) of cases"
    explanation: >-
      Documents tractional outer retinal folds in 47% (8/17) of subretinal
      Grade C PVR eyes on swept-source OCT.

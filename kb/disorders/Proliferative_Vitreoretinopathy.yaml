- name: Swept-source OCT microstructural assessment
  presence: Post-test confirmation
  description: >-
    Swept-source optical coherence tomography characterizes retinal
    microstructural correlates of PVR (high-amplitude outer retinal
    corrugations, hyperreflective preretinal and subretinal membranes,
    bacillary layer changes, and lamellar dedifferentiation) and distinguishes
    subretinal-membrane from intraretinal-fold subtypes of Grade C disease.
  diagnosis_term:

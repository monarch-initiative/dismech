      label: cell migration
    modifier: INCREASED
  evidence:
  - reference: PMID:12101449
    reference_title: Novel growth factors involved in the pathogenesis of proliferative vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      injury of the retina induces an inflammatory response that upregulates
      HGF expression inducing the formation of multilayered groups of
      migratory retinal pigment epithelial cells (RPE)
    explanation: >-
      Establishes the model of retinal injury triggering RPE cell dispersion
      and migration as the initiating step of PVR pathogenesis.
  - reference: PMID:26562474
    reference_title: Mechanisms of epithelial-mesenchymal transition in proliferative vitreoretinopathy.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      retinal pigment epithelial (RPE) cells are indicated to play the
      primary role in the pathogenesis of PVR
    explanation: >-
      Review synthesis confirming RPE cells as the primary epithelial driver
      dispersed from the injured retina in PVR.
  downstream:
  - target: Intraocular Cytokine and Macrophage Amplification
    causal_link_type: DIRECT
    description: >-
      Retinal injury and blood-retinal barrier breakdown trigger macrophage
      infiltration and accumulation of pro-inflammatory and pro-fibrotic
      mediators in the vitreous cavity.
    evidence:
    - reference: PMID:12101449
      reference_title: Novel growth factors involved in the pathogenesis of proliferative vitreoretinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "injury of the retina induces an inflammatory response that upregulates HGF expression inducing the formation of multilayered groups of migratory retinal pigment epithelial cells (RPE)"
      explanation: Links retinal injury directly to intraocular inflammatory and growth-factor induction.
  - target: RPE Epithelial-Mesenchymal Transition
    causal_link_type: DIRECT
    description: >-
      Dispersed migratory RPE cells enter the growth-factor-rich vitreous
      microenvironment and lose epithelial phenotype to undergo EMT.
    evidence:
    - reference: PMID:12101449
      reference_title: Novel growth factors involved in the pathogenesis of proliferative vitreoretinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These RPE, present in a provisional extracellular matrix, come in contact with vitreous containing TGF-beta. The TGF-beta is activated, upregulating expression of CTGF. Under the influence of TGF-beta and CTGF, RPE become myofibroblastic and fibrosis ensues."
      explanation: Connects vitreous exposure of dispersed RPE cells to TGF-beta/CTGF-driven myofibroblastic transition.
  - target: Vitreous haze
    causal_link_type: DIRECT
    description: >-
      Blood-ocular barrier breakdown and dispersion of pigmented RPE cells into
      the vitreous cavity produce Grade A vitreous haze and pigment clumps on
      the inferior retina.
    evidence:
    - reference: PMID:39572739
      reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "Following the occurrence of RRD, the PVR cascade begins with the breakdown of the blood-ocular barrier, followed by the migration of RPE and glial cells into the vitreous cavity and onto the retinal surface."
      explanation: >-
        Describes blood-ocular barrier breakdown and RPE/glial cell dispersion
        into the vitreous cavity at the onset of the PVR cascade.
    - reference: PMID:27429798
      reference_title: "Classifications for Proliferative Vitreoretinopathy (PVR): An Analysis of Their Use in Publications over the Last 15 Years."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "| A | Vitreous haze, pigment clumps, and pigment clusters on inferior retina |"
      explanation: >-
        Documents the 1991 Retina Society classification definition of minimal
        (Grade A) PVR as vitreous haze, pigment clumps, and inferior retinal
        pigment clusters.

- name: Intraocular Cytokine and Macrophage Amplification
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  description: >-
    Breakdown of the blood-retinal barrier and retinal tissue injury recruit
    IBA1- and CD206-positive macrophages and elevate vitreous protein,
    cytokines, and stromal growth factors including IL-6, IL-1beta, bFGF, HGF,
    CTGF, and predominantly intraocular TGF-beta2. Elevated vitreous IL-6 and
    total protein independently predict postoperative PVR development, and
    infiltrated myeloid cells both amplify pro-fibrotic signaling and
    contribute directly to the alpha-SMA-positive myofibroblast pool.
  role: amplifier
  locations:
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina

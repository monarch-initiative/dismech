    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  results: "Outer retinal corrugations, hyperreflective preretinal/subretinal membranes, tractional folds of the outer retina, and loss of retinal lamellar differentiation."
  evidence:

  notes: Identified by GEO DataSets index search for Proliferative Vitreoretinopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE164208
  title: Expression profile of peripheral immune cells-derived coding and long non-coding RNAs in patients with proliferative vitreoretinopathy
  description: 'Peripheral immune response has been revealed to play a critical role in proliferative vitreoretinopathy (PVR). However, the reliable immune-related factors that are acting as prognostic indicators or therapeutic targets for PVR remain to explore further. Methods: In the current study, we applied whole-transcriptome sequencing to profile peripheral blood mononuclear cells (PBMCs) from PVR patients and also analyzed lncRNA-mRNA interactions in peripheral immune cells to explore the pathways that might mediate immunopathology and resultant retinal damage in PVR.'
  organism:

name: Proliferative Vitreoretinopathy
creation_date: "2026-07-16T00:00:00Z"
updated_date: "2026-11-12T19:00:00Z"
description: >-
  Proliferative vitreoretinopathy (PVR) is an abnormal fibrotic wound-healing
  response that complicates rhegmatogenous retinal detachment, ocular trauma,
  or retinal detachment surgery. Breakdown of the retinal pigment epithelium
  (RPE) and blood-retinal barrier disperses RPE cells into the vitreous cavity
  alongside infiltrating macrophages and retinal glial cells. Under intraocular
  cytokine and growth-factor signaling (notably TGF-beta2, CTGF, HGF, and
  IL-6), RPE cells undergo epithelial-mesenchymal transition and, together with
  myeloid and Mueller glial populations, generate alpha-SMA-positive
  myofibroblasts that deposit fibronectin- and collagen-rich fibrocellular
  membranes on the preretinal and subretinal surfaces. Membrane contraction
  produces fixed retinal folds and tractional (re)detachment, making PVR the
  leading cause of anatomic failure after retinal reattachment surgery.
category: Acquired
disease_term:
  preferred_term: proliferative vitreoretinopathy
  term:
    id: MONDO:0700115
    label: proliferative vitreoretinopathy
synonyms:

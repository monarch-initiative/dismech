      Ultra-widefield fundus imaging was staged per the Retina Society 1991
      PVR Classification and correlated with retinal microstructural
      changes assessed with SS-OCT.
    explanation: Demonstrates OCT as a quantitative microstructural diagnostic modality alongside clinical staging.

treatments:
- name: Pars Plana Vitrectomy with Membrane Peeling and Tamponade
  description: >-
    Surgical removal of the vitreous, peeling/dissection of contractile
    epiretinal and subretinal membranes (with relaxing retinotomy/retinectomy
    when intraretinal foreshortening is present and optional internal limiting
    membrane peeling to reduce macular pucker), and endotamponade with
    silicone oil or long-acting gas is the standard and only proven primary
    management for established PVR, achieving anatomical retinal reattachment
    in roughly 75-84% of Grade C eyes at 6 months.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Vitrectomy
    term:
      id: NCIT:C50837
      label: Vitrectomy
  target_mechanisms:
  - target: Contractile Fibrocellular Membrane Formation
    treatment_effect: INHIBITS
    description: >-
      Surgical peeling of epiretinal, subretinal, and internal limiting
      membranes physically removes contractile fibrocellular tissue and
      scaffolds for recurrent macular pucker.
    evidence:
    - reference: PMID:39572739
      reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All epiretinal membranes were peeled off the retinal surface using forceps. The subretinal membranes were removed via access retinotomy."
      explanation: >-
        Documents surgical removal of epiretinal and subretinal PVR membranes
        during standard three-port pars plana vitrectomy.
    - reference: PMID:39572739
      reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Internal limiting membrane (ILM) peeling showed a statistically significant preventive effect on the rate of macular pucker formation in eyes with reattached retinas at 6 months in both groups (P = 0.025)."
      explanation: >-
        Demonstrates that surgical ILM peeling reduces recurrent macular
        epiretinal membrane formation.
  - target: Tractional Retinal Redetachment
    treatment_effect: RESTORES
    description: >-
      Relief of membrane traction combined with silicone oil endotamponade
      reattaches the neurosensory retina.
    evidence:
    - reference: PMID:15582080
      reference_title: A randomized controlled trial of combined 5-fluorouracil and low-molecular-weight heparin in management of established proliferative vitreoretinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, at 6 months 84% of patients had full retinal reattachment and 94% had stable posterior retinal reattachment."
      explanation: >-
        Demonstrates high anatomical reattachment rates following vitreoretinal
        surgery and silicone oil tamponade in Grade C PVR.
  evidence:
  - reference: PMID:15582080
    reference_title: A randomized controlled trial of combined 5-fluorouracil and low-molecular-weight heparin in management of established proliferative vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, at 6 months 84% of patients had full retinal reattachment and 94% had stable posterior retinal reattachment."
    explanation: Multicenter surgical RCT demonstrating 84% complete retinal reattachment at 6 months with vitrectomy and silicone oil exchange.
  - reference: PMID:39572739
    reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinal reattachment was achieved in 45 eyes (75.0%) at 6 months after surgery."
    explanation: Contemporary multicenter RCT confirming 75% 6-month complete retinal reattachment with vitrectomy and silicone oil tamponade in Grade C PVR.
  - reference: PMID:30585928
    reference_title: "Proliferative Vitreoretinopathy: A Review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      At this time, surgery is the only management option for PVR as there
      is no proven pharmacologic agent for the treatment or prevention of
      PVR.
    explanation: Review synthesis confirming vitrectomy-based surgery as the sole established management for PVR.
- name: Adjuvant Intravitreal 5-Fluorouracil and Low-Molecular-Weight Heparin
  description: >-
    Combined perioperative 5-fluorouracil (5-FU) and low-molecular-weight
    heparin (LMWH) has been evaluated as an antiproliferative and
    anticoagulant/fibrin-binding adjuvant to vitrectomy surgery. Clinical
    trial results are negative in established disease and conflicting in
    prophylaxis: an early single-center trial (174 eyes) found reduced
    postoperative PVR (12.6% vs 26.4%), whereas a multicenter RCT in
    established Grade C PVR (157 eyes) and the larger 13-center PRIVENT
    prevention trial (325 eyes) showed no benefit over placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 5-fluorouracil
      term:
        id: CHEBI:46345
        label: 5-fluorouracil
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  target_mechanisms:
  - target: Contractile Fibrocellular Membrane Formation
    treatment_effect: INHIBITS
    description: >-
      Intended to inhibit cellular proliferation (5-FU) and fibrin/growth-factor
      scaffold formation (LMWH), though large multicenter trials failed to
      confirm clinical reduction in PVR membrane formation.
    evidence:
    - reference: PMID:11425671
      reference_title: "Adjuvant 5-fluorouracil and heparin prevents proliferative vitreoretinopathy : Results from a randomized, double-blind, controlled clinical trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 26.4% (23/87) of the placebo group and in 12.6% (11/87) of the 5-FU and LMWH group, postoperative PVR developed."
      explanation: Single-center trial reporting lower postoperative PVR membrane incidence with 5-FU/LMWH.
    - reference: PMID:35680097
      reference_title: "Intravitreal 5-Fluorouracil and Heparin to Prevent Proliferative Vitreoretinopathy: Results from a Randomized Clinical Trial."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Rate of PVR did not differ between adjuvant therapy with 5-FU and LMWH and placebo treatment in eyes with RRD."
      explanation: Larger 325-patient multicenter PRIVENT RCT showing no reduction in Grade CP PVR formation.
  evidence:
  - reference: PMID:11425671
    reference_title: "Adjuvant 5-fluorouracil and heparin prevents proliferative vitreoretinopathy : Results from a randomized, double-blind, controlled clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of postoperative PVR was significantly lower (P = 0.02)
      in the 5-FU and LMWH therapy compared with the placebo group.
    explanation: >-
      Early single-center trial supporting prophylactic 5-FU/LMWH in
      high-risk eyes undergoing primary vitrectomy.
  - reference: PMID:15582080
    reference_title: A randomized controlled trial of combined 5-fluorouracil and low-molecular-weight heparin in management of established proliferative vitreoretinopathy.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no significant difference in success in the primary outcome
      measure (56%, treatment group; 51%, placebo group; P = 0.59)
    explanation: >-
      Multicenter trial in established Grade C PVR found no significant
      benefit of adjuvant 5-FU/LMWH on surgical success.
  - reference: PMID:35680097
    reference_title: "Intravitreal 5-Fluorouracil and Heparin to Prevent Proliferative Vitreoretinopathy: Results from a Randomized Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rate of PVR did not differ between adjuvant therapy with 5-FU and LMWH
      and placebo treatment in eyes with RRD.
    explanation: >-
      Larger, more recent multicenter (PRIVENT) trial found no preventive
      benefit of adjuvant 5-FU/LMWH, contradicting the earlier single-center
      prevention trial.
- name: Adjuvant Intraocular Methotrexate
  description: >-
    Repeated intravitreal or intra-silicone oil injections of methotrexate are
    used investigatively as an anti-inflammatory and antiproliferative adjunct
    to vitrectomy for Grade C PVR. In a 74-eye multicenter randomized
    controlled trial of three 250-microgram intra-silicone oil injections
    (end of surgery and weeks 3 and 6), methotrexate did not improve overall
    6-month retinal reattachment (73.3% vs 76.7%), but significantly reduced
    limited PVR membrane re-proliferation without redetachment (4.5% vs 39.1%,
    P = 0.01).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Contractile Fibrocellular Membrane Formation
    treatment_effect: INHIBITS
    description: >-
      Repeated intraocular methotrexate suppresses postoperative membrane
      re-proliferation in reattached eyes without altering overall
      redetachment rates.
    evidence:
    - reference: PMID:39572739
      reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Limited PVR recurrence was observed in one eye (4.5%) in the MTX group versus nine eyes (39.1%) in the control group at 6 months (P = 0.01)."
      explanation: >-
        Multicenter RCT demonstrating reduced limited membrane re-proliferation
        at 6 months in eyes with reattached retinas.
  evidence:
  - reference: PMID:39572739
    reference_title: "Effects of repeated intra-silicone oil injections of methotrexate on proliferative vitreoretinopathy grade C: a multicenter randomized controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinal reattachment was achieved in 22 eyes (73.3%) in the MTX group and 23 eyes (76.7%) in the control group (difference: -3.4%, 95% CI: -25.2-18.5%)."
    explanation: >-
      Primary endpoint of the multicenter RCT showed no improvement in overall
      6-month retinal reattachment rate with repeated intra-silicone oil
      methotrexate.
datasets:
- accession: geo:GSE179603
  title: Transcriptional Characterisation of Proliferative Vitreoretinopathy
  description: 'Purpose: The development of vitreoretinal scars remains an unsolved challenge in clinical practice and often leads to repeated revision surgery and blindness due to lack of efficient therapy. The aim of this study was to characterize the cellular and molecular environment in vitreoretinal scar tissue from patients with proliferative vitreoretinopathy (PVR) in comparison to membranes of the vitreoretinal junction, in order to subsequently identify potential drug treatment options using bioinformatics techniques.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 27

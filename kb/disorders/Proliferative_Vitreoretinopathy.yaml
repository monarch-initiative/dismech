prevalence:
- population: Eyes undergoing surgery for retinal detachment
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    Postoperative cumulative incidence across the surgical follow-up window
    (5% to 10%, classically ~1 in 10 operated eyes) among eyes undergoing
    rhegmatogenous retinal detachment repair rather than a general-population
    point prevalence; rate_per_100000 is omitted because the denominator is an
    operated surgical cohort rather than an unselected population. Higher rates
    occur in eyes with trauma, giant retinal tears, or preoperative aqueous
    flare.
  evidence:
  - reference: PMID:2708527
    reference_title: Correlation of fibrosis and transforming growth factor-beta type 2 levels in the eye.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 1 out of every 10 eyes undergoing surgery for retinal
      detachment develops excessive intraocular fibrosis that can lead to
      traction retinal detachment and ultimate blindness.
    explanation: Classic 1-in-10 (10%) estimate of PVR incidence following retinal detachment surgery.
  - reference: PMID:35579905
    reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of PVR after surgical repair of RD is estimated to be 5% to 10%"
    explanation: Contemporary surgical incidence range of 5% to 10% after retinal detachment repair.


    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:10067974
    reference_title: "Expression of vitreous cytokines in proliferative vitreoretinopathy: a prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean levels of TGF-beta2, bFGF, IL-6, and protein in the vitreous were significantly higher (P < 0.05) in patients who had postoperative PVR compared with those who did not."
    explanation: >-
      Prospective vitreous cohort study demonstrating elevated TGF-beta2,
      bFGF, IL-6, and total protein in eyes developing PVR.
  - reference: PMID:10067974
    reference_title: "Expression of vitreous cytokines in proliferative vitreoretinopathy: a prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate logistic regression analysis showed IL-6 and protein to
      be significant (P < 0.05), independent, predictive risk factors for
      the development of PVR.
    explanation: >-
      Establishes vitreous IL-6 and protein elevation as independent clinical
      predictors of PVR formation.
  - reference: PMID:12101449
    reference_title: Novel growth factors involved in the pathogenesis of proliferative vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each of the five PVR membranes, stromal cells were immunohistochemically positive for both HGF and CTGF."
    explanation: >-
      Immunohistochemistry on five surgical human PVR membranes demonstrates
      expression of pro-migratory and pro-fibrotic growth factors HGF and CTGF
      in stromal membrane cells.
  - reference: PMID:35579905
    reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In line with the sequencing results, we found a strong immunoreactivity for IBA1 and CD206 in PVR membranes when compared to ILM suggesting a role of IBA1/CD206-positive macrophages in the pathogenesis of PVR"
    explanation: >-
      Demonstrates enrichment of IBA1+/CD206+ macrophages in surgical human
      epiretinal PVR membranes.
  downstream:
  - target: RPE Epithelial-Mesenchymal Transition
    causal_link_type: DIRECT
    description: >-
      Elevated intraocular TGF-beta2 and pro-fibrotic cytokines, alongside
      infiltrating myeloid cells, drive myofibroblastic transdifferentiation
      of RPE and stromal/myeloid precursors.
    evidence:
    - reference: PMID:2708527
      reference_title: Correlation of fibrosis and transforming growth factor-beta type 2 levels in the eye.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "vitreous aspirates from eyes with intraocular fibrosis associated with PVR have more than three times the amount of TGF-beta"
      explanation: >-
        Demonstrates more than three-fold elevation of intraocular TGF-beta
        (predominantly TGF-beta2) bathing fibrotic PVR tissue.
    - reference: PMID:35579905
      reference_title: Single-Cell Protein and Transcriptional Characterization of Epiretinal Membranes From Patients With Proliferative Vitreoretinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly, all five PVR membranes revealed cells that co-expressed IBA1 and α-SMA, suggesting a transdifferentiation of myeloid cells to myofibroblasts as a common pathophysiological feature during PVR formation"
      explanation: >-
        Shows that infiltrated IBA1+ myeloid cells also co-express alpha-SMA
        and contribute to the myofibroblast population in human PVR membranes.

- name: RPE Epithelial-Mesenchymal Transition
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    Dispersed RPE cells lose epithelial cell-cell junctions and undergo
    epithelial-mesenchymal transition (EMT) into matrix-producing, contractile
    alpha-SMA-positive myofibroblast-like cells under activated vitreous
    TGF-beta and CTGF signaling, complemented by myeloid-to-myofibroblast
    transdifferentiation within developing PVR membranes.
  role: central_effector
  locations:

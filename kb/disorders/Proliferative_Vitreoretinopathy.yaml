- accession: geo:GSE282859
  title: 'Absent in melanoma 2: a potent suppressor of retinal pigment epithelial-mesenchymal transition and experimental proliferative vitreoretinopathy'
  description: Epithelial-to-mesenchymal transition (EMT) is a critical and complex process involved in normal embryonic development, tissue regeneration, and tumor progression. It also contributes to retinal diseases, such as age-related macular degeneration (AMD) and proliferative vitreoretinopathy (PVR). Although absent in melanoma 2 (AIM2) has been linked to inflammatory disorders, autoimmune diseases, and cancers, its role in the EMT of the retinal pigment epithelium (RPE-EMT) and retinal diseases remains unclear. The present study demonstrated that AIM2 functions as a potent suppressor of RPE cell proliferation and EMT to maintain retinal homeostasis.

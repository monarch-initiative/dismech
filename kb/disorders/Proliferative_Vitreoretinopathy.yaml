pathophysiology:
- name: Retinal Break and RPE Cell Dispersion into Vitreous
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >-
    A full-thickness retinal break, detachment, or surgical/traumatic injury
    breaches the neurosensory retina, blood-retinal barrier, and retinal
    pigment epithelial monolayer. RPE cells lose contact with Bruch's membrane
    and disperse into the vitreous cavity and subretinal space, where local
    injury triggers a dysregulated wound-healing response with HGF-associated
    migration of RPE cell clusters.
  role: trigger
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  - preferred_term: vitreous body
    term:

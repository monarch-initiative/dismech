    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:17377520
    reference_title: Mutation in the PYK2-binding domain of PITPNM3 causes autosomal dominant cone dystrophy (CORD5) in two Swedish families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study, the mutation causing CORD5 is located in the C-terminal region interacting with a member of nonreceptor protein tyrosine kinases, PYK2.
    explanation: >-
      Places the disease variant in the PYK2-interacting region of PITPNM3.
  - reference: PMID:17377520
    reference_title: Mutation in the PYK2-binding domain of PITPNM3 causes autosomal dominant cone dystrophy (CORD5) in two Swedish families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PITPNM3, known as a human homologue of the Drosophila retinal degeneration B (rdgB), lacks the N-terminal PIT domain needed for transport of phospholipids
    explanation: >-

genetic:
- name: PITPNM3
  association: Causal heterozygous missense variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PITPNM3
    term:
      id: hgnc:21043
      label: PITPNM3
  notes: >-
    The causal claim rests mainly on p.Gln626His segregating in two Swedish
    families after the locus was narrowed to 14.3 cM at 17p13, plus one
    British family with macular dystrophy carrying the same allele. Other
    retinal dystrophy genes (GUCY2D, AIPL1) lie in the same 17p13 interval.
    A screen of 163 cone and cone-rod dystrophy patients from Denmark,
    Germany, the UK and the USA found only a few further candidate variants
    (p.Gln342Pro in one German patient with cone dystrophy and two intronic
    changes), none with segregation or functional data. No ClinGen
    gene-disease validity record for PITPNM3 was found in the local ClinGen
    cache, so no validity tier is recorded. ClinVar classifies
    p.Gln626His (VariationID 1994) as "Conflicting classifications of
    pathogenicity"; this was read from the NCBI E-utilities esummary for that
    record on 2026-10-20 and is not a cached reference.
  evidence:
  - reference: PMID:17377520
    reference_title: Mutation in the PYK2-binding domain of PITPNM3 causes autosomal dominant cone dystrophy (CORD5) in two Swedish families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we refine the CORD5 locus previously mapped to 17p13 from 27 to 14.3 cM and identified a missense mutation, Q626H in the phosphatidylinositol transfer (PIT) membrane-associated protein (PITPNM3) (MIM 608921) in two Swedish families.
    explanation: >-
      Linkage refinement and identification of the causal variant.
  - reference: PMID:20590364
    reference_title: PITPNM3 is an uncommon cause of cone and cone-rod dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, mutations in PITPNM3 do not appear to be a major cause of cone or cone-rod dystrophy.
    explanation: >-
      PITPNM3 variants are rare among cone and cone-rod dystrophy patients
      outside the original families.
  variants:
  - name: p.Gln626His
    description: >-
      c.1878G>C, p.Gln626His, in the C-terminal PYK2-interacting region. Found
      heterozygous in the two Swedish CORD5 families and in one British family
      with macular dystrophy, and absent from 1,201 matched control
      chromosomes in the follow-up screen.
    evidence:
    - reference: PMID:22405330
      reference_title: Ocular phenotype of CORD5, an autosomal dominant retinal dystrophy associated with PITPNM3 p.Q626H mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        To describe in detail the phenotype of CORD5 in two families segregating a mutation c.1878G>C (p.Q626H) in the PITPNM3 gene.
      explanation: >-
        Names the variant and its segregation in the two families.

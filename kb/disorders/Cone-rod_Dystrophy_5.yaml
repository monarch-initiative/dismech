  - target: Cone Photoreceptor Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The steps between the variant and loss of cone function are unknown.
      The authors of the defining report propose a role for PITPNM3 in
      phototransduction by analogy with rdgB.
    evidence:
    - reference: PMID:17377520
      reference_title: Mutation in the PYK2-binding domain of PITPNM3 causes autosomal dominant cone dystrophy (CORD5) in two Swedish families.

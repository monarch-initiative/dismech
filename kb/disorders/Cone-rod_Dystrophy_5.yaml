pathophysiology:
- name: PITPNM3 PYK2-Binding Region Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous c.1878G>C (p.Gln626His) in PITPNM3. PITPNM3 lacks the
    N-terminal phosphatidylinositol transfer domain of rdgB, and the variant
    sits in the C-terminal region that interacts with PYK2. Whether the
    variant weakens PYK2 binding, or acts by haploinsufficiency or a
    dominant-negative effect, has not been tested, so no functional impact
    category or activity modifier is recorded.
  genes:
  - preferred_term: PITPNM3
    term:
      id: hgnc:21043
      label: PITPNM3
  molecular_functions:
  - preferred_term: PYK2 (protein tyrosine kinase) binding
    term:
      id: GO:1990782
      label: protein tyrosine kinase binding
  genetic_context:

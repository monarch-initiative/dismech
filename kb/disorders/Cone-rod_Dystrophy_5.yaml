name: Cone-rod dystrophy 5
creation_date: "2026-10-20T20:00:00Z"
category: Mendelian
synonyms:
- CORD5
- PITPNM3 cone-rod dystrophy
- cone-rod dystrophy caused by mutation in PITPNM3
- cone-rod dystrophy type 5
description: >-
  Cone-rod dystrophy 5 is an autosomal dominant retinal dystrophy mapped to
  chromosome 17p13 and attributed to the heterozygous missense variant
  p.Gln626His in PITPNM3, a membrane-associated homologue of the Drosophila
  retinal degeneration B (rdgB) protein. The variant lies in the C-terminal
  region that binds the non-receptor tyrosine kinase PYK2. The disease was
  defined in two large Swedish families. Despite its name, the phenotype in
  those families is a cone dystrophy: visual acuity is subnormal from
  childhood, the macula thins and the fovea flattens, and cone function is
  lost progressively, reaching legal blindness in early adulthood, while rod
  function and the retinal pigment epithelium appear spared. Outside Sweden
  the same variant was found in one British family with macular dystrophy,
  and a screen of 163 patients with cone or cone-rod dystrophy found PITPNM3
  to be an uncommon cause. How the variant damages cones, and whether it acts
  by loss of function or dominantly, is unknown. A mouse knock-in of a
  different PITPNM3 missense allele gives a mild cone ERG deficit without
  structural degeneration. There is no disease-specific treatment.

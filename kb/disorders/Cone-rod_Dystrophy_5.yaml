animal_models:
- name: Pitpnm3 V367M knock-in mouse
  species: Mouse
  genotype: Pitpnm3 p.Val367Met knock-in, heterozygous and homozygous
  publication: PMID:41148841
  description: >-
    Knock-in mice carrying a PITPNM3 missense allele, followed to 52 weeks.
    Both heterozygotes and homozygotes show a reduced cone ERG response,
    milder than in patients. Outcome on histology depends on genotype:
    heterozygotes, the genotype that matches CORD5, keep normal retinal
    architecture at one year, whereas homozygotes develop photoreceptor
    degeneration with outer nuclear layer disorganization, and a subset of
    them develop retinal detachment. The authors report contamination of the
    line with rd1 retinal degeneration mutations, which confounds attributing
    the homozygous degeneration to PITPNM3.
  modeled_mechanisms:
  - target: Cone Photoreceptor Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reduced cone ERG response in both heterozygous and homozygous mice,
      milder than in patients.
    limitations: >-
      The allele is p.Val367Met, not the p.Gln626His variant that defines
      CORD5, and the paper's citation for a human CORD5 patient with
      p.Val367Met is unresolved in its text. The deficit is milder than in
      patients, and the line carries rd1 contamination.
    evidence:
    - reference: PMID:41148841
      reference_title: "Generating a Preclinical Model for PITPNM3 and Evaluating Genotype-Phenotype Concordance: Insights from a Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Full-field electroretinogram analysis revealed a reduced cone response although the severity was not as pronounced as observed in humans with PITPNM3-related conditions.
      explanation: >-
        A mild cone functional deficit in the knock-in mice.
  - target: Macular Cone Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Structural degeneration appears only in homozygotes, as widespread
      photoreceptor loss with outer nuclear layer disorganization and, in
      some animals, retinal detachment. Heterozygotes, the genotype that
      matches the human disease, keep normal retinal architecture at one
      year.
    limitations: >-
      The degeneration is in the homozygous genotype, which does not
      correspond to the heterozygous human disease, and it is panretinal
      photoreceptor loss and detachment, not a macular cone lesion; mice
      have no macula. The line carries rd1 contamination, which confounds
      attributing the homozygous degeneration to PITPNM3. The allele is
      p.Val367Met, not p.Gln626His.
    evidence:
    - reference: PMID:41148841
      reference_title: "Generating a Preclinical Model for PITPNM3 and Evaluating Genotype-Phenotype Concordance: Insights from a Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous mutants maintained intact architecture, while homozygous PITPNM3 mutants developed retinal detachment and extensive photoreceptor cell loss after one year.
      explanation: >-
        States the genotype split: structural degeneration in homozygotes
        only.
    - reference: PMID:41148841
      reference_title: "Generating a Preclinical Model for PITPNM3 and Evaluating Genotype-Phenotype Concordance: Insights from a Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, RD1 retinal degeneration mutations in the mouse line are a confounding factor as contamination renders it difficult to isolate the study results to the effects of PITPNM3 mutation.
      explanation: >-
        The authors' own caveat on attributing the degeneration to PITPNM3.
discussions:
- discussion_id: cord5_mechanism_of_pitpnm3_variant
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does heterozygous PITPNM3 p.Gln626His damage cone photoreceptors,
    and does it act by loss of function or dominantly?
  attaches_to:
  - pathophysiology#PITPNM3 PYK2-Binding Region Missense Variant
  - pathophysiology#Cone Photoreceptor Dysfunction
  rationale: >-
    The variant sits in the PYK2-interacting C-terminal region, and PITPNM3
    lacks the phospholipid transfer domain through which rdgB acts in flies,
    so the fly mechanism does not carry over directly. No study has measured
    PYK2 binding, protein stability or localization of the p.Gln626His
    protein, and the only animal model carries a different allele. Binding
    assays of the variant protein and a p.Gln626His knock-in would
    distinguish loss of function from a dominant-negative or gain-of-function
    effect.
  proposed_experiments:
  - experiment_id: cord5_q626h_pyk2_binding
    name: PYK2 binding of PITPNM3 p.Gln626His
    description: >-
      Compare binding of wild-type and p.Gln626His PITPNM3 C-terminal regions
      to the PYK2 N-terminal domain, with protein stability and subcellular
      localization of the full-length variant in a photoreceptor-derived cell
      line.
    decision_criterion: >-
      Reduced PYK2 binding or reduced stability of the variant protein would
      support a loss-of-interaction mechanism; normal binding and stability
      would point elsewhere.
    would_support:
    - pathophysiology#PITPNM3 PYK2-Binding Region Missense Variant
  - experiment_id: cord5_q626h_knock_in
    name: Heterozygous Pitpnm3 p.Gln626His knock-in mouse
    description: >-
      Generate a knock-in of the CORD5 allele on an rd1-free background and
      follow heterozygotes with photopic and scotopic ERG and retinal
      histology beyond one year.
    decision_criterion: >-
      A cone-selective ERG decline in heterozygotes, with rods spared, would
      support the allele as sufficient for cone dysfunction.
    would_support:
    - pathophysiology#Cone Photoreceptor Dysfunction
  evidence:
  - reference: PMID:41148841
    reference_title: "Generating a Preclinical Model for PITPNM3 and Evaluating Genotype-Phenotype Concordance: Insights from a Mouse Model."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      PITPNM3 has been identified as a crucial gene associated with various phenotypes of retinal disease in humans; however, detailed mechanisms through which PITPNM3 mutations result in these conditions are not fully understood.
    explanation: >-
      States that the disease mechanism is not established.
datasets: []
notes: >-
  The human evidence is two Swedish families (35 heterozygous carriers) and
  one British family with the same allele; no prevalence figure exists.
  The defining paper and the phenotype paper describe a cone dystrophy with
  rods spared, so the phenotype list records no rod or night-vision
  findings. A heterozygous PITPNM3 p.Ile860Thr variant has been reported in
  one 85-year-old man with presumed non-paraneoplastic autoimmune
  retinopathy (PMID:29176531); that is a different presentation and is not
  counted here. Cone-rod dystrophy 10 (SEMA4A) is a different disease.

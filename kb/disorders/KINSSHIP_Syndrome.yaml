name: KINSSHIP Syndrome
synonyms:
- Mesomelic dysplasia with digital anomalies and intellectual disability, AFF3-related
- AFF3-related KINSSHIP syndrome
- mesomelic dysplasia-digital anomalies-intellectual disability syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  KINSSHIP syndrome is an autosomal dominant multisystem disorder caused by de
  novo missense variants in — or de novo deletions of — the nine-amino-acid
  degron of AFF3, the motif through which the protein is handed to a ubiquitin
  ligase for destruction. Removing the degron stabilizes AFF3 rather than
  abolishing it, so the disorder is a gain of protein dosage in a transcription
  elongation factor, not a haploinsufficiency. The acronym enumerates the
  recognizable pattern: horseshoe KIdney, Nievergelt/Savarirayan-type mesomelic
  dySplasia, Seizures, Hypertrichosis, Intellectual disability, and Pulmonary
  involvement. It sits in the mesomelic dysplasia group of the skeletal nosology
  on the strength of the limb phenotype, but is a developmental-disorder
  syndrome in which the skeletal finding is one component among several.
disease_term:
  preferred_term: KINSSHIP syndrome
  term:
    id: MONDO:0851095
    label: KINSSHIP syndrome
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
- Syndromic intellectual disability
notes: >-
  Naming. The ISDS 2023 table lists this entity as "Mesomelic dysplasia with
  digital anomalies and intellectual disability (KINSSHIP syndrome),
  AFF3-related" and adds an explicit warning in its own comment column that
  despite the acronym's reference to Nievergelt and Savarirayan, the condition
  is quite different from both of those mesomelic dysplasias. The acronym names
  a radiographic resemblance, not a nosologic relationship, and the two named
  types remain separate rows in the same group.

  Dosage direction. This entry treats KINSSHIP as an AFF3 gain-of-dosage
  disorder. That reading rests on the degron mechanism plus two model results
  pointing in the same direction, and is stated as such rather than as settled;
  the ``aff3_dosage_direction`` discussion records what would resolve it.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A de novo Mendelian multisystem developmental disorder; tagged on the
      genetics axis.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0160, listed as "Mesomelic dysplasia with digital anomalies and
      intellectual disability (KINSSHIP syndrome), AFF3-related" (MIM 619297,
      AD). The row is new in the 2023 revision — the 2019 revision predates the
      2021 delineation of the syndrome, so there is no 2019 provenance to
      record. The row's own comment states that despite the acronym the
      condition is quite different from both the Nievergelt and Savarirayan
      mesomelic dysplasias, which occupy rows NOS 15-0120 and NOS 15-0150 of the
      same group.

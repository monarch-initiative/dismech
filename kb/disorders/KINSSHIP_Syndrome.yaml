genetic:
- name: AFF3
  gene_term:
    preferred_term: AFF3
    term:
      id: hgnc:6473
      label: AFF3
  relationship_type: CAUSATIVE
  notes: >-
    AF4/FMR2 family member 3, an ALF-family component of the transcriptional
    super elongation complex. The pathogenic alleles are confined to a
    nine-residue degron — an unusually tight variant-location constraint, which
    is diagnostically useful: a missense variant elsewhere in AFF3 should not be
    called causal for KINSSHIP on the strength of the gene alone. Note also that
    a GCC repeat expansion in AFF3 has been separately associated with disease;
    that is a different allele class and is not curated here.
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe an autosomal dominant disorder associated with de novo
      missense variants in the degron of AFF3, a nine amino acid sequence
      important for its binding to ubiquitin ligase, or with de novo deletions
      of this region.
    explanation: >-
      Establishes AFF3 as causative and localizes the pathogenic alleles to the
      degron.
animal_models:
- name: Aff3 degron knockin mouse
  species: Mouse
  genotype: Aff3 degron microdeletion knockin; Aff3 recurrent degron missense knockin
  publication: PMID:33961779
  description: >-
    Two allele-matched knockin lines, one modelling a patient microdeletion and
    one the most common patient missense variant. They separate cleanly: the
    microdeletion line shows the limb phenotype, the missense line dies early.
  modeled_mechanisms:
  - target: Multisystem Developmental Patterning Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The microdeletion knockin reproduces the lower mesomelic limb deformity
      seen in affected individuals.
    limitations: >-
      Only the lower-limb component is reported as recapitulated, and the
      missense knockin's early lethality means the allele closest to the common
      human variant cannot be phenotyped for the multisystem pattern at all —
      the more severe model is the less informative one.
    readouts:
    - name: Lower limb mesomelic deformity
      target: Multisystem Developmental Patterning Failure
      direction: ALTERED
      interpretation: >-
        The limb deformity is the measured point of correspondence between mouse
        and human.
      evidence:
      - reference: PMID:33961779
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          knockin animals modeling one of the microdeletions and the most common
          of the missense variants identified in affected individuals presented
          with lower mesomelic limb deformities like KINSSHIP-affected
          individuals and early lethality, respectively
        explanation: >-
          Reports the limb phenotype in the microdeletion knockin and the early
          lethality of the missense knockin.
    evidence:
    - reference: PMID:33961779
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        knockin animals modeling one of the microdeletions and the most common
        of the missense variants identified in affected individuals presented
        with lower mesomelic limb deformities like KINSSHIP-affected
        individuals and early lethality, respectively
      explanation: >-
        Allele-matched knockins are the strongest available argument that the
        degron alleles cause the human phenotype.
- name: AFF3-overexpressing zebrafish
  species: Zebrafish
  genotype: AFF3 mRNA overexpression
  publication: PMID:33961779
  description: >-
    A dosage experiment rather than an allele model: human AFF3 overexpressed in
    zebrafish produces body axis anomalies, testing whether more AFF3 is
    pathogenic at all.
  modeled_mechanisms:
  - target: Degron Disruption Stabilizing AFF3
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Supports the inference that the disease arises from increased AFF3 amount
      rather than from loss of it.
    limitations: >-
      Overexpression is not the same perturbation as impaired degradation, the
      readout is a body-axis anomaly rather than any KINSSHIP feature, and the
      paper's own wording ("providing some support") is deliberately weak.
    evidence:
    - reference: PMID:33961779
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overexpression of AFF3 in zebrafish resulted in body axis anomalies,
        providing some support for the pathological effect of increased amount
        of AFF3.
      explanation: >-
        The source states both the result and its limited evidential weight;
        this link records it at that strength.
diagnosis:
- name: Recognition of the KINSSHIP Pattern
  description: >-
    Suspected from the co-occurrence of mesomelic limb shortening with horseshoe
    kidney and a developmental/epilepsy phenotype — a combination that no other
    mesomelic dysplasia produces. Renal imaging is therefore the cheap
    discriminator: a horseshoe kidney alongside mesomelia effectively excludes
    the SHOX and HOXD mesomelic dysplasias.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      present with a recognizable pattern of anomalies, which we named KINSSHIP
      syndrome
    explanation: >-
      Supports the claim that the combination is clinically recognizable as a
      pattern.
- name: Molecular Confirmation of a Degron Variant
  description: >-
    Confirmed by a de novo missense variant within, or a deletion spanning, the
    AFF3 degron. Because the causal alleles occupy nine codons, variant
    interpretation should weight location heavily; exome or genome sequencing
    with copy-number analysis is needed, since the deletion class will be missed
    by sequence calling alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      de novo missense variants in the degron of AFF3, a nine amino acid
      sequence important for its binding to ubiquitin ligase, or with de novo
      deletions of this region
    explanation: >-
      Names both allele classes that establish the diagnosis, including the
      deletion class that sequence-only analysis would miss.
differential_diagnoses:
- name: CHOPS syndrome
  description: >-
    Caused by variants in the paralog AFF4, also a super elongation complex
    component. The overlap with KINSSHIP is explicitly partial, which is itself
    evidence that the ALF paralogs are not functionally redundant.
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      partially overlapping the AFF4-associated CHOPS syndrome
    explanation: >-
      States the relationship between the two paralog syndromes.
- name: Mesomelic dysplasia, Nievergelt type
  description: >-
    Named in the KINSSHIP acronym for radiographic resemblance, but a separate
    row of the same nosology group and, per the nosology's own comment, quite a
    different condition. Nievergelt type has no renal or neurodevelopmental
    component.
- name: Mesomelic dysplasia, Savarirayan type
  description: >-
    The other type named in the acronym; an ID4-related 6p22.3 microdeletion
    disorder, again a separate row of group 15 and without the KINSSHIP
    multisystem pattern.
discussions:
- discussion_id: aff3_dosage_direction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is KINSSHIP syndrome caused by increased AFF3 protein dosage, and if so is
    the excess protein acting through the super elongation complex or through
    some degradation-independent function?
  attaches_to:
  - pathophysiology#Degron Disruption Stabilizing AFF3
  rationale: >-
    The degron mechanism predicts stabilization, and zebrafish overexpression
    produces a phenotype, but the delineating paper describes that as "some
    support" rather than proof, and no measurement of AFF3 protein level in
    patient cells is reported. The distinction is actionable: if the disease is
    a dosage excess of an otherwise normal protein, lowering AFF3 is a coherent
    therapeutic hypothesis, whereas if the stabilized protein has acquired a
    neomorphic activity it is not.
- discussion_id: kinsship_missense_knockin_lethality
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why is the mouse knockin of the most common human KINSSHIP missense variant
    lethal when the human variant is compatible with survival into childhood and
    beyond?
  attaches_to:
  - animal_models#Aff3 degron knockin mouse
  rationale: >-
    Allele-matched knockins are the strongest model design available, and here
    the closest-matched allele produces early lethality rather than the human
    syndrome, while the less-matched microdeletion allele produces the limb
    phenotype. Something — species difference in AFF3 dosage tolerance, paralog
    compensation, or genetic background — separates the mouse from the human
    response to the same substitution. Until that is understood, the mouse
    cannot be used to test interventions against the multisystem phenotype,
    which is the use a model of this disease would most be wanted for.

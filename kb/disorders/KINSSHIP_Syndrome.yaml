    snippet: >-
      The sixteen affected individuals we identified, along with two previously
      reported individuals, present with a recognizable pattern of anomalies
    explanation: >-
      Gives the cohort size on which the entity was delineated, the basis for
      the rarity band recorded here.
inheritance:
- name: Autosomal dominant, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: "all reported cases"
  description: >-
    Every reported causal allele is de novo — either a missense substitution
    within the degron or a deletion removing it. The recurrence risk for parents
    of an affected child is therefore low, subject to the usual caveat of
    parental gonadal mosaicism.
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe an autosomal dominant disorder associated with de novo
      missense variants in the degron of AFF3, a nine amino acid sequence
      important for its binding to ubiquitin ligase, or with de novo deletions
      of this region.
    explanation: >-
      States the inheritance mode and both classes of de novo allele.
pathophysiology:
- name: Degron Disruption Stabilizing AFF3
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: AFF3
      term:
        id: hgnc:6473
        label: AFF3
    allele_type: degron missense substitution or degron-spanning microdeletion
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
  description: >-
    A degron is a short sequence that marks a protein for destruction. AFF3's is
    nine amino acids long and binds a ubiquitin ligase. Missense variants within
    it, and microdeletions removing it, both prevent that hand-off. The
    consequence is not loss of AFF3 but persistence of it: the variant classes
    converge on the same endpoint precisely because the motif's only job is to
    be recognized, so disrupting it by substitution or by excision is
    equivalent.
  molecular_functions:
  - preferred_term: AFF3 degron binding to ubiquitin ligase
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
  biological_processes:
  - preferred_term: Ubiquitin-dependent degradation of AFF3
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      de novo missense variants in the degron of AFF3, a nine amino acid
      sequence important for its binding to ubiquitin ligase, or with de novo
      deletions of this region
    explanation: >-
      Identifies the motif, its function, and the two allele classes that
      disrupt it — the whole content of this node.
  downstream:
  - target: Dysregulated Super Elongation Complex Activity
    causal_link_type: DIRECT
    description: >-
      An undegraded AFF3 persists in the complex it is a component of.
- name: Dysregulated Super Elongation Complex Activity
  biological_scale: CELLULAR
  description: >-
    AFF3 is one of four ALF paralogs (AFF1-AFF4) in the transcriptional super
    elongation complex, which releases paused RNA polymerase II at genes
    governing neurogenesis and development. Excess AFF3 therefore acts on
    transcriptional output rather than on any single structural protein, which
    is why the phenotype is multisystem. The paralogs are not interchangeable:
    AFF4 variants cause CHOPS syndrome, which overlaps KINSSHIP only partially,
    and the published transcriptome work argues each ALF factor contributes
    something distinct.
  biological_processes:
  - preferred_term: transcription elongation by RNA polymerase II
    modifier: DYSREGULATED
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ALF transcription factor paralogs, AFF1, AFF2, AFF3, and AFF4, are
      components of the transcriptional super elongation complex that regulates
      expression of genes involved in neurogenesis and development.
    explanation: >-
      Establishes the complex AFF3 belongs to and the class of genes it
      regulates.
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only partial phenotypic overlap of AFF3- and AFF4-associated syndromes
      and the previously published transcriptome analyses of ALF transcription
      factors suggest that these factors are not redundant and each contributes
      uniquely to proper development.
    explanation: >-
      Supports the non-redundancy claim that makes a paralog-specific phenotype
      expected rather than surprising.
  downstream:
  - target: Multisystem Developmental Patterning Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate targets through which altered elongation produces each
      organ phenotype are not identified.
- name: Multisystem Developmental Patterning Failure
  biological_scale: ORGANISM
  description: >-
    The convergent endpoint: mesomelic limb deformity, horseshoe kidney, brain
    malformation and seizures, hypertrichosis, and pulmonary involvement. The
    Aff3 knockout mouse develops skeletal anomalies, kidney defects, brain
    malformations, and neurological anomalies — the same organ set — which is
    the strongest available argument that these are one pleiotropy rather than
    coincidence.
  evidence:
  - reference: PMID:33961779
    reference_title: "Variants in the degron of AFF3 are associated with intellectual disability, mesomelic dysplasia, horseshoe kidney, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whereas homozygous Aff3 knockout mice display skeletal anomalies, kidney
      defects, brain malformations, and neurological anomalies, knockin animals
      modeling one of the microdeletions and the most common of the missense
      variants identified in affected individuals presented with lower mesomelic
      limb deformities like KINSSHIP-affected individuals and early lethality,
      respectively.
    explanation: >-
      Reports both the knockout organ set and the allele-specific knockin
      phenotypes, which together support treating the human features as one
      pleiotropic consequence.

genetic:
- name: DMD
  gene_term:
    preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
  notes: >-
    The same gene as Duchenne muscular dystrophy. What assigns a patient to Becker rather
    than Duchenne is the effect of the lesion on the reading frame, not its position. In
    the largest Becker cohort 86% carried in-frame deletions or duplications, 10%
    out-of-frame mutations and 4% nonsense mutations.
  evidence:
  - reference: PMID:2491009
    reference_title: "The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 60% of both Duchenne muscular dystrophy (DMD) and Becker muscular dystrophy (BMD)
      is due to deletions of the dystrophin gene.
    explanation: >-
      Both diseases arise from deletions in the same gene at a similar rate, which is why the
      frame, not the locus, is the discriminator.

inheritance:
- name: X-linked recessive
  description: >-
    Affected individuals are essentially all male. Female carriers are not
    phenotypically silent for cardiac purposes: the French guidelines address cardiac
    management for carriers as a distinct recommendation.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:37422773
    reference_title: "Diagnosis and management of Becker muscular dystrophy: the French guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is linked to a genetic mutation on the X chromosome.
    explanation: X-linkage.
  - reference: PMID:37422773
    reference_title: "Diagnosis and management of Becker muscular dystrophy: the French guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also provide guidance on cardiac management for female carriers.
    explanation: >-
      Carriers require cardiac management, which is why this entry declines to describe them
      as unaffected.


    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to evaluate the safety and efficacy of oral weekly glucocorticoid steroids
      in patients with Becker Muscular Dystrophy (BMD), an inherited disorder in which patients experience
      weakness of the legs and pelvis, and Limb Girdle Muscular Dystrophy (LGMD), an inherited disorder
      in which patients experience progressive muscular weakness predominately in their hip and shoulders.
      The primary objective is safety which we the investigators will measure using laboratory testing
      and forced vital capacity (FVC), a breathing test that measures the strength of your lungs. The
      secondary objective is efficacy which will be measured by a change in MRI muscle mass, improved
      muscle performance, and quality of life.

- name: Sildenafil Trial with No Demonstrated Clinical Benefit
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Sildenafil
      term:
        id: NCIT:C61940
        label: Sildenafil
  description: >-
    A randomized placebo-controlled crossover trial with two four-week treatment periods found no effect
    on blood flow, maximal work capacity, or cardiac function. Sixteen participants completed skeletal-muscle
    evaluations and thirteen completed cardiac MRI. These findings do not support sildenafil as an established
    Becker disease-modifying treatment.
  evidence:
  - reference: PMID:25042931
    reference_title: Effect of sildenafil on skeletal and cardiac muscle in Becker muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen patients completed all skeletal muscle evaluations, and 13 completed the cardiac MRI investigations.
      Sildenafil had no effect on any of the outcome parameters.
    explanation: >-
      The four-week crossover study found no improvement in the measured muscular or cardiac outcomes.
discussions:
- discussion_id: interpretation_becker_is_the_target_state_of_dmd_exon_skipping
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should Becker muscular dystrophy be curated as the therapeutic target state of exon-skipping antisense
    therapy in Duchenne muscular dystrophy, and does that make it a conformer of the antisense-oligonucleotide
    module?
  attaches_to:
  - pathophysiology#Reduced or Abnormal Partly Functional Dystrophin
  rationale: >-
    Some Duchenne exon-skipping therapies restore an open reading frame and aim to produce partly functional,
    Becker-like dystrophin. Becker natural history and genotype-specific models can inform expectations,
    but an induced protein is not guaranteed to reproduce a particular Becker clinical trajectory. This
    untreated disease entry does not assert an antisense intervention in its causal path.
  evidence:
  - reference: PMID:16770791
    reference_title: 'Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Becker patients, in-frame mutations allow the synthesis of internally deleted, but largely functional
      dystrophins.
    explanation: >-
      The protein state that exon skipping in Duchenne is designed to produce, stated here as the natural
      state in Becker.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301298
    reference_title: Dystrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin restoration therapies have been developed by using synthetic antisense oligonucleotides
      to restore the reading frame by exon skipping for individuals with specific pathogenic variants
      in DMD.
    explanation: >-
      The source describes the reading-frame-restoration strategy in Duchenne; it does not establish treatment
      of Becker patients or guarantee a specific clinical outcome.

    quote_role: REVIEW_SYNTHESIS
- discussion_id: interpretation_reading_frame_rule_is_statistical
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should exceptions to the reading-frame rule be curated, given that a substantial minority of clinically
    definite Becker patients carry out-of-frame mutations?
  attaches_to:
  - pathophysiology#DMD Pathogenic Variant
  rationale: >-
    Reading-frame concordance is a statistical association: the 1989 deletion series reported 92%, and
    the Leiden database reported 91%. The Italian Becker cohort separately contained out-of-frame and
    nonsense variants among clinically characterized patients. These percentages have different denominators
    and cannot be pooled. Alternative splicing, translational re-initiation, and distal truncation can
    help explain exceptions, but the rescue mechanism must be demonstrated for the specific variant. Phenotype,
    dystrophin protein, and molecular findings should be interpreted together. Mild or asymptomatic in-frame
    deletion carriers may also be underascertained.
  evidence:
  - reference: PMID:2491009
    reference_title: 'The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between phenotype and type of deletion mutation is in agreement with the "reading
      frame" theory in 92% of cases and is of diagnostic and prognostic significance.
    explanation: >-
      The deletion series supports a useful but incomplete association between reading frame and phenotype.
  - reference: PMID:16770791
    reference_title: 'Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      over 4700 mutations have been reported in the Leiden DMD mutation database, of which 91% are in
      agreement with this rule.
    explanation: >-
      The larger mutation database reports a similar but distinct concordance estimate with a different
      denominator.
  - reference: PMID:2491009
    reference_title: 'The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution and frequency of deletions spanning the entire locus suggests that many "in-frame"
      deletions of the dystrophin gene are not detected because the individuals bearing them are either
      asymptomatic or exhibit non-DMD/non-BMD clinical features.
    explanation: >-
      The ascertainment argument, made by the authors themselves, which bears on how the 92% should be
      read.

- discussion_id: gap_vascular_rescue_and_long_term_becker_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does sustained correction of exercise vascular dysregulation improve strength or slow progression
    in defined Becker genotypes?
  attaches_to:
  - pathophysiology#Impaired Exercise-Induced Vasomodulation
  rationale: >-
    Acute tadalafil and nitrate studies support an NO-dependent vascular mechanism, but they do not establish
    clinically meaningful disease modification. A four-week sildenafil trial was negative. Differences
    in intervention, duration, target abundance, and endpoints limit direct comparisons.
  evidence:
  - reference: PMID:23197572
    reference_title: Tadalafil alleviates muscle ischemia in patients with Becker muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study does not address whether restoring sympatholysis with PDE5A inhibition can slow
      disease progression and improve muscle strength.
    explanation: >-
      The investigators explicitly distinguish vascular rescue from clinical efficacy.
  - reference: PMID:25042931
    reference_title: Effect of sildenafil on skeletal and cardiac muscle in Becker muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen patients completed all skeletal muscle evaluations, and 13 completed the cardiac MRI investigations.
      Sildenafil had no effect on any of the outcome parameters.
    explanation: >-
      The four-week crossover study found no improvement in the measured muscular or cardiac outcomes.

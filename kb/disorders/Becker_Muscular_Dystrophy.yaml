differential_diagnoses:
- name: Limb-Girdle Muscular Dystrophy
  description: >-
    Proximal weakness, raised CK, calf enlargement, and cardiopulmonary disease can overlap Becker muscular
    dystrophy.
  distinguishing_features:
  - >-
    Many subtypes have autosomal inheritance and affect both sexes; the clinical pattern and causal gene
    distinguish them from DMD-related disease.
  - >-
    The French guideline highlights FKRP-related disease and sarcoglycanopathies; protein studies may
    show reduced alpha-dystroglycan or sarcoglycans. These findings require integrated molecular interpretation.
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main differential diagnosi s included limb girdle muscular dystrophy (LGMD), facio- scapulo-humeral
      muscular dystrophy type 1 (FSHD 1), inflammatory myopathies and spinal muscular atrophy (SMA) are
      summarized in Table 1
    explanation: >-
      Table 1, inspected in the full PDF, compares FKRP-related disease and sarcoglycanopathies with Becker
      disease; the cached narrative identifies the differential group.

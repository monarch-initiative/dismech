animal_models:
- name: bmx exon 45-47 deletion mouse
  species: Mouse
  genotype: Dmd exon 45-47 deletion
  background: C57/BL6J
  publication: PMID:36628607
  description: >-
    CRISPR-generated in-frame deletion of murine Dmd exons 45-47. The model has reduced dystrophin protein
    despite preserved transcript abundance, contraction-related muscle injury, inflammation, fibrosis,
    and age-dependent cardiac dysfunction.
  evidence:
  - reference: PMID:36628607
    reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, bmx mice show deficits in muscle and cardiac function, reduced dystrophin protein
      in skeletal and cardiac muscle, and histopathology consistent with moderate dystrophy.
    explanation: >-
      The exon 45-47 mouse model reproduces dystrophin reduction and both skeletal and cardiac dysfunction.
  modeled_mechanisms:
  - target: Reduced or Abnormal Partly Functional Dystrophin
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reproduces the protein deficit with preserved transcript abundance.
    limitations: >-
      Represents one deletion; it does not capture the full spectrum of Becker molecular outcomes.
    evidence:
    - reference: PMID:36628607
      reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, bmx mice show deficits in muscle and cardiac function, reduced dystrophin protein
        in skeletal and cardiac muscle, and histopathology consistent with moderate dystrophy.
      explanation: >-
        The exon 45-47 mouse model reproduces dystrophin reduction and both skeletal and cardiac dysfunction.
  - target: Contraction-Induced Skeletal Muscle Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Eccentric contraction experiments show greater force loss than wild type.
    limitations: >-
      Individual functional endpoints are not uniformly intermediate between wild type and dystrophin-null
      mice.
    evidence:
    - reference: PMID:36628607
      reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ten eccentric contractions of WT EDL muscle resulted in a 15.53% drop in ex vivo peak force. In
        contrast, this protocol reduced peak force by 20.16% in bmx EDL muscles (P = 0.0239 bmx vs. WT)
        and 20.86% in mdx EDL (Figure 2D).
      explanation: >-
        The genotype-defined model has greater contraction-induced force loss than wild type; it does
        not establish a uniform degree of protection relative to dystrophin-null muscle.
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Aged mice develop reduced ejection fraction and fractional shortening.
    limitations: >-
      Mouse age and timing of cardiomyopathy cannot be mapped directly to human prognosis.
    evidence:
    - reference: PMID:36628607
      reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, bmx mice show deficits in muscle and cardiac function, reduced dystrophin protein
        in skeletal and cardiac muscle, and histopathology consistent with moderate dystrophy.
      explanation: >-
        The exon 45-47 mouse model reproduces dystrophin reduction and both skeletal and cardiac dysfunction.
- name: R-BMDdel45-47 rat
  species: Rat
  genotype: Dmd exon 45-47 deletion
  background: Sprague Dawley
  publication: PMID:39358550
  description: >-
    Genome-edited rats show reduced dystrophin, relatively mild skeletal muscle dysfunction, and progressive
    cardiac fibrosis and systolic dysfunction. Intercalated-disc proteins are mislocalized. Resting ventilatory
    function remains preserved at 12 months despite diaphragmatic histological changes.
  evidence:
  - reference: PMID:39358550
    reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most notably, BMD rats developed a progressive cardiomyopathy with reduced ejection fraction and
      pronounced fibrosis, closely mimicking the major cardiac involvement diagnosed in BMD patients carrying
      a 45–47 deletion.
    explanation: >-
      The rat model captures progressive cardiac disease for this deletion, while its skeletal phenotype
      is milder.
  modeled_mechanisms:
  - target: Cardiac Intercalated Disc Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces structural and protein-localization abnormalities at intercalated discs.
    limitations: >-
      The study does not selectively rescue TMEM65 or connexin-43 localization to test mediation of cardiac
      disease.
    evidence:
    - reference: PMID:39358550
      reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the histological level, TMEM65 notably displayed a larger distribution and mislocalization
        from the ICD in both BMD and DMD ventricles
      explanation: >-
        Immunostaining shows mislocalization in the rat model; reduced Tmem65 RNA did not correspond to
        reduced TMEM65 protein abundance in Becker rat hearts.
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Develops ventricular dilation, reduced ejection fraction, and cardiac fibrosis.
    limitations: >-
      The model carries one deletion and exhibits considerable variation between animals.
    evidence:
    - reference: PMID:39358550
      reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-

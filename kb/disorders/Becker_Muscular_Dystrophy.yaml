genetic:
- name: DMD
  gene_term:
    preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
  notes: >-
    DMD pathogenic variants cause a spectrum of dystrophinopathies. Becker classification integrates the
    clinical course and residual dystrophin with the molecular result. In-frame changes predominate, but
    out-of-frame and nonsense variants are established exceptions; reading frame alone is insufficient
    for diagnosis or individual prognosis.
  evidence:
  - reference: PMID:2491009
    reference_title: 'The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 60% of both Duchenne muscular dystrophy (DMD) and Becker muscular dystrophy (BMD) is due to
      deletions of the dystrophin gene.
    explanation: >-
      The historical deletion study establishes the shared DMD locus; it does not establish an absolute
      reading-frame discriminator.

inheritance:
- name: X-linked recessive
  description: >-
    Inheritance is X-linked. A heterozygous mother has a 50% chance of transmitting the variant in each
    pregnancy; an affected father transmits it to all daughters and no sons. Heterozygous females may
    have cardiac disease, muscle symptoms, or rarely a more severe dystrophinopathy phenotype. A negative
    family history does not exclude the disorder.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If the mother of the proband has a DMD pathogenic variant, the chance of the mother transmitting
      it in each pregnancy is 50%. If the father of the proband has a DMD pathogenic variant, he will
      transmit it to all his daughters and none of his sons.
    explanation: >-
      GeneReviews states parental transmission probabilities explicitly.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heterozygous females are typically asymptomatic or may exhibit weakness, fatigue, and cardiac involvement.
    explanation: >-
      The female phenotype extends beyond isolated cardiac risk and is variably expressed.
prevalence:
- population: Male births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.6
  notes: >-
    Approximately 1 in 18,000 male births, converted to 5.6 per 100,000 male births. The denominator is
    male births specifically, not the general population, so this figure must not be compared directly
    with a whole-population prevalence.
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Becker muscular dystrophy (BMD) is one of the most frequent among neuromuscular diseases, affecting
      approximately 1 in 18,000 male births.
    explanation: The source figure and its male-birth denominator.

    quote_role: REVIEW_SYNTHESIS
diagnosis:
- name: DMD Genetic Testing with Reading-Frame Interpretation
  description: >-
    Identify a pathogenic DMD variant using deletion/duplication analysis and sequencing, interpreted
    with the clinical phenotype and, when needed, dystrophin protein studies. Reading-frame prediction
    helps interpretation but does not by itself classify Becker versus Duchenne muscular dystrophy. The
    historical 92% concordance estimate applies to the analyzed deletion series. In unresolved cases,
    muscle RNA/cDNA analysis can identify splice abnormalities missed by standard DNA testing. Some urine-derived
    RNA approaches remain research investigations. Comprehensive assays capable of detecting sequence
    and copy-number variants are an alternative to sequential testing.
  evidence:
  - reference: PMID:2491009
    reference_title: 'The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between phenotype and type of deletion mutation is in agreement with the "reading
      frame" theory in 92% of cases and is of diagnostic and prognostic significance.
    explanation: >-
      The accuracy of the rule and the authors' own statement that it is diagnostically and prognostically
      useful.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of a hemizygous or heterozygous DMD variant of uncertain significance does not establish
      or rule out the diagnosis.
    explanation: >-
      A VUS alone is insufficient for molecular confirmation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Analysis to detect copy number variants (CNVs), i.e., deletions or duplications of DMD
    explanation: >-
      The stepwise algorithm begins with deletion/duplication analysis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If no CNV is detected, sequence analysis of DMD to detect small intragenic deletions/insertions
      and missense, nonsense, and splice site variants
    explanation: >-
      Sequencing addresses classes of pathogenic variation missed by copy-number testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Level 3. If no DMD sequence variants are detected: (a) muscle biopsy for histology; (b) if histologic
      findings are consistent with a dystrophinopathy, immunohistochemistry is recommended; (c) if immunohistochemistry
      confirms a dystrophinopathy, then RNA/cDNA analysis on muscle or RNA analysis of muscle tissue,
      myogenic cells from urine-derived stem cells, or extracellular mRNA in urine is recommended to confirm
      the diagnosis.
    explanation: >-
      The diagnostic algorithm adds histology, dystrophin immunohistochemistry, and RNA/cDNA analysis
      for unresolved cases.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some of these tests (e.g., immunohistochemistry and RNA sequencing on muscle tissue) are available
      on a clinical basis, whereas to date others (e.g., RNA analysis of stem cells or extracellular RNA
      analysis from urine) may be available on a research basis only.
    explanation: >-
      Clinical availability differs between muscle-based RNA testing and emerging urine-derived approaches.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recently, assays designed to detect both CNVs and sequence variants (Levels 1 and 2 in Option 1)
      have become available. These assays use next-generation sequencing (NGS)-based assays of the entire
      DMD gene that include full sequence analysis as well as deep intronic variant detection with CNVs
      and single-nucleotide variant (SNV) calling [Zhao et al 2024].
    explanation: >-
      Comprehensive DMD assays may detect copy-number, sequence, and deep intronic variants together.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Cardiac Surveillance Independent of Skeletal Muscle Severity
  description: >-
    Evaluate cardiac involvement from diagnosis even when skeletal muscle weakness is mild. ECG and echocardiography
    establish baseline cardiac status; MRI can identify myocardial fibrosis before echocardiography becomes
    abnormal.
  evidence:
  - reference: PMID:20301298
    reference_title: Dystrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite the milder skeletal muscle involvement, heart failure from DCM is a common cause of morbidity
      and the most common cause of death in BMD.
    explanation: >-
      The cardiac burden of Becker muscular dystrophy can be substantial despite relatively mild skeletal
      muscle disease.

    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cardiac MRI should also be discussed at diagnosis since it prov ides a more accurate estimation of cardiac function than echocardiography and can identify myocardial fibrosis, ma inly in the inferolateral wall, which can be present in patient s with a normal echocardiogram."  # codespell:ignore
    explanation: >-
      MRI can detect myocardial fibrosis despite a normal echocardiogram.
- name: Muscle Biopsy and Dystrophin Protein Assessment
  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle biopsy, immunohistochemistry, and dystrophin immunoblotting can clarify unresolved or atypical
    cases. Normal immunostaining does not exclude Becker muscular dystrophy; immunoblotting with antibodies
    against different protein regions can assess abundance and size. Biopsy is not routinely required
    when molecular and clinical findings already establish the diagnosis.
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dystrophin immunochemistry usually shows decreased or no findings with some or all of the dedicated
      antibodies, but may also show normal findings. The decrease can be present in all the fibers or
      manifest in a fragmented manner.
    explanation: >-
      The guideline warns that immunostaining can appear normal and explains why immunoblotting with multiple
      antibodies is informative.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis should be completed by western blotting of dystrophin
    explanation: >-
      The guideline recommends immunoblotting to complete dystrophin protein assessment.
treatments:
- name: ACE Inhibition for Established Cardiomyopathy
  description: >-
    ACE inhibitors are first-line medication for established Becker cardiomyopathy in the 2023 French
    guideline. That guideline recommends specialist discussion of cardioprotective treatment when LVEF
    is below 50% or MRI shows myocardial fibrosis. It does not recommend prophylactic ACE inhibition for
    every Becker patient with normal cardiac findings; evidence from Duchenne muscular dystrophy does
    not establish that indication in Becker muscular dystrophy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_mechanisms:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    treatment_effect: INHIBITS
    description: >-
      Treats ventricular dysfunction and adverse remodeling associated with cardiomyopathy.
    evidence:
    - reference: PMID:20301298
      reference_title: Dystrophinopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ACE inhibitors are used with or without beta blockers for cardiomyopathy in both DMD and BMD phenotypes.
      explanation: The indication for established cardiomyopathy in both phenotypes.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thus, there is no indication to use ACE inhibitors for systematic treatment of BMD patients regardless
      of cardiac phenotype, such as in Duchenne MD.
    explanation: >-
      The French guideline does not support universal ACE-inhibitor prophylaxis irrespective of the Becker
      cardiac phenotype.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with LVEF < 50% and/or evidence of myocardial fibrosis on MRI should be referre d to a
      specialized cardiologist in a tertiary center to discuss the  initiation of cardioprotective
    explanation: >-
      Reduced LVEF or myocardial fibrosis prompts specialist assessment of cardioprotective treatment
      in this guideline.

    quote_role: REVIEW_SYNTHESIS
- name: Corticosteroid Therapy
  description: >-
    Corticosteroids are used in selected patients with Becker muscular dystrophy, but efficacy is less
    established than in Duchenne muscular dystrophy. Benefits, adverse effects, and treatment duration
    require individual assessment; Duchenne trial results do not establish Becker efficacy. A 24-week
    open-label weekly-prednisone pilot enrolled 19 participants with limb-girdle muscular dystrophy and
    only one with Becker muscular dystrophy; pooled biomarker and functional changes do not establish
    Becker-specific benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:20301298
    reference_title: Dystrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Corticosteroid therapy improves muscle strength and function for individuals with DMD between ages
      five and 15 years; the same treatment is used in BMD, although the efficacy is less clear.
    explanation: >-
      GeneReviews explicitly qualifies the uncertain Becker efficacy while describing clinical use.

    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35124660
    reference_title: An Open Label Exploratory Clinical Trial Evaluating Safety and Tolerability of Once-Weekly Prednisone in Becker and Limb-Girdle Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Out of the 20 participants, seven were female, nineteen had LGMD and one had BMD
    explanation: >-
      The mixed pilot cohort contained only one Becker participant, precluding a Becker-specific efficacy
      estimate.
- name: Cardiac Transplantation
  description: >-
    Cardiac transplantation may be considered for terminal heart failure in selected patients with limited
    skeletal muscle disability and without severe respiratory failure. Selection requires multidisciplinary
    assessment. The French guideline generally does not recommend transplantation after loss of ambulation
    or with significant respiratory failure; ventricular assist devices can be discussed individually
    in expert centers.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    treatment_effect: BYPASSES
    description: >-
      Replaces the failing heart while leaving the underlying DMD variant and extracardiac manifestations
      unchanged.
    evidence:
    - reference: PMID:20301298
      reference_title: Dystrophinopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        cardiac transplantation is offered to persons with severe dilated cardiomyopathy and BMD with
        limited or no clinical evidence of skeletal muscle disease.
      explanation: The indication and its selection criterion.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with terminal heart failure who have lost ambulation or have significant respiratory
      failure, cardi ac transplantati on is generally not indicated
    explanation: >-
      The guideline identifies motor and respiratory impairment as constraints on transplant selection.

    quote_role: REVIEW_SYNTHESIS
- name: Cardiac Surveillance
  description: >-
    Cardiac surveillance starts at diagnosis and continues regardless of skeletal muscle severity. Assessment
    includes ECG and echocardiography, with cardiac MRI to assess fibrosis and function when appropriate
    and Holter monitoring for cardiac dysfunction or conduction abnormalities. The 2026 GeneReviews chapter
    lists annual cardiac assessment for affected males and assessment before major surgery, with closer
    monitoring for fibrosis or dysfunction; its schedule partly draws on Duchenne care guidance. The 2023
    French Becker guideline proposes assessment every two years with a normal echocardiogram and at least
    annually with LVEF below 50%. The interval should be individualized by cardiology. GeneReviews recommends
    ECG and cardiac imaging every three to five years for heterozygous females without cardiac manifestations,
    beginning in the second to third decade, and specialist-directed follow-up when abnormalities are
    present.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiac monitoring must systematically include ECG and echocardiogram. The other examinations must
      be discussed with the patient on the basis of the patients’ symptoms and ECG and echocardiogram
      findings. The frequency of these assessments depends on the initial findings. The minimum interval
      for a classic form of B MD with a normal echocardiogram is two years.
    explanation: >-
      The Becker guideline specifies ECG and echocardiography and a two-year interval when the echocardiogram
      is normal.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For patie nts with LVEF < 50%, monitoring should be performed at least once a year.
    explanation: >-
      Ventricular dysfunction calls for more frequent assessment.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      DMD/BMD By cardiologist incl EKG & echocardiogram or cardiac MRI • Annually & before major surgery
      • More frequently in those age >10 yrs & those w/myocardial fibrosis or ventricular dysfunction
    explanation: >-
      GeneReviews Table 8 recommends annual and preoperative cardiac assessment; its footnote identifies
      Duchenne care guidelines as a basis for the intensified schedule.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In those without cardiac manifestations, cardiac evaluation with an EKG and cardiac imaging every
      three to five years beginning in the second to third decade of life is recommended.
    explanation: >-
      The updated chapter recommends recurring surveillance for heterozygous females with normal initial
      cardiac findings.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cardiac MRI should also be discussed at diagnosis since it prov ides a more accurate estimation of cardiac function than echocardiography and can identify myocardial fibrosis, ma inly in the inferolateral wall, which can be present in patient s with a normal echocardiogram."  # codespell:ignore
    explanation: >-
      MRI can detect myocardial fibrosis despite a normal echocardiogram.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases showing abnormal cardiac systolic function (left ventricular ejection fraction below 50%)
      or significant conduction defects on the ECG, a 24-h Holter ECG sho uld also be performed to search
      for ventricular or supraventricular arrhythmias
    explanation: >-
      Abnormal ventricular function or significant conduction defects warrant ambulatory rhythm assessment.
- name: Perioperative Assessment and Anaesthetic Precautions
  description: >-
    Preoperative planning should assess cardiac and respiratory involvement and muscle weakness. Avoid
    succinylcholine because of hyperkalaemia and rhabdomyolysis risk. Volatile anaesthetics also require
    specialist risk assessment because of anaesthesia-induced rhabdomyolysis in dystrophinopathies. The
    ENMC consensus distinguishes this complication from malignant hyperthermia and reports no association
    of dystrophinopathies with malignant hyperthermia susceptibility.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35971866
    reference_title: European Neuromuscular Centre consensus statement on anaesthesia in patients with neuromuscular disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AIR seems to be a specific complication of general anaesthesia in dystrophinopathies, especially
      at paediatric age. AIR can cause life‐threatening hyperkalaemia, and the risk of occurrence is possibly
      linked to the use of succinylcholine and/or volatile anaesthetics
    explanation: >-
      The muscular-dystrophy recommendations identify anaesthesia-induced rhabdomyolysis and hyperkalaemia
      as the relevant dystrophinopathy hazards.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35971866
    reference_title: European Neuromuscular Centre consensus statement on anaesthesia in patients with neuromuscular disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is no association with MH
    explanation: >-
      In Table 4, this statement follows the dystrophinopathy AIR recommendation and distinguishes it
      from malignant hyperthermia; it does not remove the need for anaesthetic precautions.
    quote_role: REVIEW_SYNTHESIS
- name: Investigational Givinostat
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A 12-month placebo-controlled trial in 51 adults with Becker muscular dystrophy failed its primary
    total-fibrosis endpoint and showed no significant functional benefit. Secondary thigh and quadriceps
    MRI fat-fraction findings suggested a possible signal, but baseline imbalance and the small sample
    limit interpretation. This is investigational Becker evidence and does not establish an effective
    disease-modifying treatment.
  evidence:
  - reference: PMID:36793492
    reference_title: 'Givinostat for Becker muscular dystrophy: A randomized, placebo-controlled, double-blind study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study failed to achieve the primary endpoint. However, there was a potential signal from the
      MRI assessments suggesting givinostat could prevent (or slow down) BMD disease progression.
    explanation: >-
      The trial conclusion distinguishes the negative primary outcome from the exploratory interpretation
      of secondary MRI findings.
  - reference: PMID:36793492
    reference_title: 'Givinostat for Becker muscular dystrophy: A randomized, placebo-controlled, double-blind study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events, most mild or moderate, were reported by 88.2% and 52.9% patients receiving givinostat
      and placebo.
    explanation: >-
      Adverse events were more frequent with givinostat; the paper details platelet and triglyceride abnormalities.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Givinostat
      term:
        id: NCIT:C71716
        label: Givinostat
- name: Investigational Sevasemten
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Sevasemten inhibits fast skeletal muscle myosin ATPase to reduce injurious contraction. A short phase
    1 Becker cohort comprised five treated patients and two placebo recipients; muscle-injury biomarkers
    decreased but the study was too small and short to establish clinical efficacy. In a later uncontrolled
    12-person study, biomarkers remained reduced and functional measures were stable over two years. These
    observations support investigation, not a proven treatment effect. The completed CANYON/GRAND CANYON
    registry had no posted results at the September 2026 review.
  evidence:
  - reference: PMID:40452637
    reference_title: A Phase 1, Double-Blind, Placebo-Controlled Trial of Sevasemten (EDG-5506), a Selective Modulator of Fast Skeletal Muscle Contraction, in Healthy Volunteers and Adults With Becker Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Part C, 7 men with BMD were randomized to sevasemten (N = 5) or placebo (N = 2)
    explanation: >-
      Defines the very small Becker randomized cohort within a larger study dominated by healthy volunteers.
  - reference: PMID:42308588
    reference_title: 'Effects of sevasemten (EDG-5506) on safety, biomarkers, and functional measures in adults with Becker muscular dystrophy: results of a phase 1b, open-label study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As this was an open-label trial with no placebo control, caution is required in interpretation.
      Additional limitations of this study include the small sample size and the lack of diversity in
      enrolled participants (100% White).
    explanation: >-
      The 24-month study cannot distinguish treatment benefit from natural-history variability or other
      uncontrolled influences.
  - reference: PMID:42308588
    reference_title: 'Effects of sevasemten (EDG-5506) on safety, biomarkers, and functional measures in adults with Becker muscular dystrophy: results of a phase 1b, open-label study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with sevasemten was associated with reductions in circulating biomarkers of muscle injury
      that were evident within 4 weeks and sustained for up to 24 months. Physical function, as assessed
      by North Star Ambulatory Assessment (NSAA), was stable over 24 months.
    explanation: >-
      Records the observed biomarker and functional trajectories without treating them as randomized efficacy
      evidence.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Sevasemten
      term:
        id: NCIT:C199222
        label: Sevasemten
- name: Investigational Vamorolone
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Vamorolone improved selected strength and histological measures and increased dystrophin protein in
    bmx mice. This preclinical study did not establish human efficacy or long-term cardiac benefit. The
    subsequently completed Becker phase II pilot has registry results posted in September 2026; its 24-week
    functional data are descriptive and do not establish a clinically meaningful benefit. The trial must
    be distinguished from Duchenne treatment evidence.
  evidence:
  - reference: PMID:37534133
    reference_title: Vamorolone improves Becker muscular dystrophy and increases dystrophin protein in bmx model mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dystrophin increases of 49% (p < 0.0001) were found in the gastrocnemius and 55% (p = 0.0173) in
      the heart with vamorolone treatment
    explanation: >-
      The mouse experiment shows an increase relative to vehicle-treated bmx animals, not normalization
      to healthy dystrophin levels or proof of human efficacy.
  - reference: PMID:37534133
    reference_title: Vamorolone improves Becker muscular dystrophy and increases dystrophin protein in bmx model mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      to fully demonstrate causation, further studies are needed to expand upon these and previous studies.
    explanation: >-
      The authors limit the proposed microRNA mechanism: reduced microRNAs and increased dystrophin correlate,
      but direct causal mediation was not demonstrated.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Vamorolone
      term:
        id: NCIT:C152825
        label: Vamorolone
- name: Physical Therapy and Adapted Exercise
  description: >-
    Individualized physical therapy uses gentle progressive aerobic activity, stretching, low-resistance
    exercise, balance work, and fall prevention to maintain function and joint mobility. Exercise intensity
    should account for muscle weakness, fatigue, pain, and cardiac or respiratory involvement; avoid excessive
    contraction and eccentric loading of weak muscles.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This physical activity must be gentle and progressive and must take into account the specificities
      of BMD when choosing the exercises to offer
    explanation: >-
      The guideline recommends gradual activity adapted to Becker muscular dystrophy.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Maintenance of segmenta l and spinal muscular and joint flexibility for analgesic pu rposes by passive
      mobilizations and stretching, prepar ation and recovery for exercise and proprioceptive stimulation:
      stretching, posture, etc.
    explanation: >-
      Stretching and passive mobilization address flexibility and discomfort.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most affected muscl es (those with a muscle testing MRC rating < 4) require more precautions,
      specifically by limiting intense contract ions and eccentric stresses and promoting aerobic metabolism.
    explanation: >-
      Weak muscles require limits on intense contraction and eccentric loading.
- name: Orthoses and Mobility Support
  description: >-
    Selected posture or walking orthoses can address deformity and support function. Wheelchairs or scooters
    become appropriate when walking-related falls and fractures outweigh functional benefit. Occupational
    and rehabilitation teams can adapt transfers, self-care, communication, and home, school, or workplace
    access.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Posture orthoses may be used in some patients. In the lower limbs, nocturnal posture orthoses can
      be proposed to address certain deformities (e.g., anti-flexum knee or antiequine orthosis).
    explanation: >-
      Night-time postural orthoses are options for selected deformities.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Manual wheelchair; electric scooter and/or electric wh eelchair are necessary when the risks linked
      to walking (falls, fractures) become greater than the functional benefits.
    explanation: >-
      The mobility decision balances walking benefit against injury risk.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Specific devices facilitating meals, washing, toileting, leisur e, transfers, and environmental
      control can be implemented.
    explanation: >-
      Assistive devices support daily activities and environmental access.
- name: Orthopedic Surgery for Function-Limiting Deformity
  description: >-
    Selected tendon or foot procedures may help walking and posture. Spinal fusion is reserved for severe
    forms. Rarely, macroglossia with ventilatory or swallowing consequences warrants surgery; operative
    planning requires cardiac, respiratory, and anesthetic assessment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some surgeries (e.g., Achilles tendon tenotomy, gastrocnemius aponeurotomy, tendon transfers, osteotomies
      or foot arthrodesis) are useful, and their u ses must be linked to functions such as walking and
      posture s tability. Vertebral arthrodesis is limited to the most severe forms close to DMD
    explanation: >-
      The guideline links surgery to functional impairment and limits spinal fusion to severe disease.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In rare cases, macroglossia surgery may be required because of functional consequences (ventilation,
      swallowing, etc.).
    explanation: >-
      Functionally significant macroglossia is a rare surgical indication.
- name: Neuropsychological and Mental Health Care
  description: >-
    Assess cognitive, educational, behavioral, and emotional needs from diagnosis and when school or employment
    difficulties emerge. Use findings to tailor family, school, and workplace support. The French guideline
    recommends reassessment every two to three years in children, mental-health screening at neuromuscular
    visits, and formal annual psychological evaluation. Medication decisions should account for cardiac
    status, interactions, and adverse effects.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cognitive or psychiatric assessment has to be consider ed at diagnosis, and especially in the event
      of integration or access to employment issues.
    explanation: >-
      Assessment is considered from diagnosis and when participation difficulties arise.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For children, assessments should be performed every 2 –3 years to monitor a child’s developmental
      progress and response to interventions.
    explanation: >-
      Repeated childhood assessment guides developmental support.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Formal annual evaluation by the mental health clinician is advised to assess the psychological wellbeing
      of the individual, parents, and siblings.
    explanation: >-
      The guideline includes recurring psychological evaluation for patients and families.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Depending on the patient’s age and disease status, it may be necessary to pay special att ention
      to their cardiac status, potential medication inte ractions, and side effects when combined with
      existing medications (e.g., weight gain).
    explanation: >-
      Psychotropic treatment requires attention to comorbidity and concomitant medication.
- name: Respiratory Surveillance
  description: >-
    Regular evaluation includes symptoms of nocturnal hypoventilation, orthopnea, cough effectiveness,
    pulmonary function, and sleep investigations when indicated. The French Becker guideline recommends
    pulmonary function testing every two years if normal and annual specialist follow-up if abnormal.
    The 2026 GeneReviews dystrophinopathy schedule recommends annual respiratory evaluation and every
    six months after loss of ambulation, citing Duchenne care guidance. The treating team should individualize
    frequency to findings and progression.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A respiratory functional exploration should be performed every 2 years, with no pulmonologist advice
      required at this stage if the findings are normal.
    explanation: >-
      The French guideline gives a two-year interval when respiratory testing is normal.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases with an abnormal fVC, the frequency of monitoring should be ann ual. A subsequent pulmonologist
      assessment, performed a t least annually, will indicate the need for blood gas analysis or nightly
      examinations.
    explanation: >-
      Abnormal FVC warrants annual or more frequent specialist assessment.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Respiratory By pulmonologist for assessment of respiratory function Annually; then every 6 mos after
      loss of ambulation
    explanation: >-
      GeneReviews Table 8 gives a more frequent dystrophinopathy schedule; footnote 1 identifies its Duchenne
      guideline basis.
- name: Noninvasive Ventilation for Hypoventilation
  description: >-
    Nocturnal noninvasive ventilation is offered when diaphragmatic weakness produces hypoventilation,
    with specialist titration and follow-up. Respiratory support depends on functional assessment and
    symptoms rather than skeletal muscle disability alone.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Non-Invasive Mechanical Ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases showing actual diaphragmatic involvemen t with hypoventilation, nocturn al noninvasive
      ventilation will be offered by the pulmonologist with a specific followup.
    explanation: >-
      The guideline links nocturnal noninvasive ventilation to documented hypoventilation.
- name: Cough Assistance
  description: >-
    Weak or ineffective cough warrants respiratory physiotherapy and individually selected manual or mechanical
    cough-assistance techniques, with pulmonology follow-up.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In cases showing a cough d eficiency, cough aid techniques will be offered by the pulmonologist or physiotherapist. A pulmonologist follow-up is then necessary."  # codespell:ignore
    explanation: >-
      The guideline recommends cough assistance when a cough deficit is present.
- name: Swallowing and Nutritional Support
  description: >-
    Assess chewing, swallowing safety, weight trajectory, and nutritional intake. Adapt food texture and
    head position for impaired pharyngeal propulsion, provide feeding aids and speech-language input as
    needed, and consider oral nutritional supplements when intake is inadequate. Changes in mobility require
    reassessment of energy needs.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If the disorders are secondary to poor pharyngeal propulsion, the textures (mixed, adequately “slippery”)
      of the food and the po sition of the head during meals should be adapted.
    explanation: >-
      Food texture and head position are adapted to swallowing mechanics.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral nutritional supplements may be offered when increase in caloric intake becomes necessary.
    explanation: >-
      Supplementation is considered when increased caloric intake is needed.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the most severe patien ts there is a risk of secondary undernutrition. It is then necessary to
      identify all the aggravating factors: involvement of the upper limbs (speci al cutlery, raised meal
      plan …), macroglossia or involvement of chewing muscles (hygiene care o ral, speech therapy, adaptation
      of the texture of food, surgery), digestive damage (constipation, …), spinal defo rmities sources
      of compression, mask ventilation that causes or worsens aerogastria.
    explanation: >-
      Nutritional assessment includes feeding mechanics, gastrointestinal problems, deformity, and ventilation-related
      factors.
- name: Gastrostomy for Inadequate or Unsafe Oral Intake
  description: >-
    Gastrostomy is reserved for the uncommon situation in which oral feeding cannot provide safe nutritional
    intake. Assess respiratory function and ventilatory requirements before placement and use a team experienced
    with neuromuscular disability.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Situations necessitating artificial feeding are rare in patients with BMD. If oral feeding cannot ensure safe nutritive intake, a gastrostomy can be set up as the last resort. However, bef ore creating a gastrostomy, the patient’s respiratory function a nd, in particular, the need for noninvasive ventilation shoul d be evaluated. The gastrostomy should be placed by a team accustomed to the care of disabled patients."  # codespell:ignore
    explanation: >-
      The guideline describes the indication and preprocedural respiratory assessment.
- name: Gastrointestinal Symptom Management
  description: >-
    Gastroenterology assessment addresses constipation, reflux, and gastric motility problems. Management
    is individualized and can include diet, bowel regimens, and medication; severe feeding or motility
    problems may require enteral support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A gastroenterologist should be consulted for manageme nt of constipation, gastroesophageal reflux,
      and gastrointestinal motility concerns, and when gastrostomy tube placement is needed.
    explanation: >-
      The guideline identifies gastrointestinal problems requiring specialist management.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Constipation can be addressed through various measures, including adopting a fiber-rich diet, implementing
      toilet training techniques, engaging in physiotherapy, considering laxatives like polyethylene glycol,
      milk of magnesia, or lactulose may be necessary.
    explanation: >-
      Constipation care combines nonpharmacologic measures and laxatives when needed.
- name: Urological Assessment and Care
  description: >-
    Lower urinary tract symptoms warrant comprehensive urological evaluation, potentially including urodynamic
    assessment, and ongoing treatment and follow-up tailored to the cause.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases where lower ur inary tract symptoms are present, it is advisable to undergo a comprehensive
      urological evaluation, which may include urodynamic examinations, and to receive thorough follow-up
      care.
    explanation: >-
      The recommendation is symptom-driven rather than routine invasive testing for all patients.
- name: Bone Health and Pain Management
  description: >-
    Assess bone health and calcium and vitamin D needs, particularly with reduced mobility. Pain management
    includes positioning, appropriate bedding, mobilization, and individualized analgesia. Medication
    choice should account for constipation, respiratory or cardiac impairment, and drug interactions.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prevention of osteopenia with calcium and vitamin D supplementation must be estimated and promptly
      proposed in the event of reduced mobil ity.
    explanation: >-
      Reduced mobility prompts assessment of calcium and vitamin D supplementation.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Analgesic pharmacologica l treatment (anti -inflammatory, muscle relaxants) must tak e into account
      the side effects (especially cardiac and respira tory effects) and possible drug interactions.
    explanation: >-
      Analgesia must account for cardiorespiratory effects and interactions.
- name: Respiratory Vaccination
  description: >-
    The French guideline recommends pneumococcal and COVID-19 vaccination and annual influenza vaccination,
    following applicable immunization schedules.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Immunization with pneumococcal and COVID-19 vaccines and annual immunization with the influenza
      vaccine according to the vaccination schedule are strongly recommended, as for any disease with
      comorbidities [103].
    explanation: >-
      Vaccination is part of preventive care for patients with neuromuscular comorbidity.
- name: Genetic Counseling and Family Evaluation
  description: >-
    Offer counseling about X-linked transmission, variable manifestations in heterozygous females, and
    residual recurrence risk from parental germline mosaicism. Evaluate at-risk male and female relatives,
    using the familial variant when known. Discuss reproductive options before pregnancy; prenatal testing
    is possible after variant identification, and preimplantation testing may require additional phasing.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The optimal time for determination of genetic risk and discussion of the availability of prenatal/
      preimplantation genetic testing is before pregnancy.
    explanation: >-
      Counseling and reproductive planning are ideally offered before pregnancy.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Female relatives. It is appropriate to evaluate at-risk female family members (i.e., first-degree
      relatives of a proband with a DMD pathogenic variant) to identify as early as possible those who
      would benefit from cardiac and skeletal muscle evaluation and surveillance.
    explanation: >-
      Identifying heterozygous relatives enables cardiac and skeletal surveillance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the DMD pathogenic variant has been identified in an affected family member, prenatal testing
      is possible.
    explanation: >-
      Prenatal testing depends on identifying the familial pathogenic variant.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases of de nov o mutations, one of the parents may carry a germinal mosaic ism (presence of
      populations of gametes w ith and without t he pathogenic variation), which is associated with a
      risk of r ecurrence in the offspring.
    explanation: >-
      Parental germline mosaicism leaves a recurrence risk after an apparently de novo occurrence.
- name: Pregnancy Planning for Heterozygous Females
  description: >-
    Assess cardiac status before conception or when pregnancy is recognized, including in asymptomatic
    heterozygous females. Symptomatic females also require skeletal muscle assessment. Those with dilated
    cardiomyopathy need coordinated care from a cardiac specialist and high-risk obstetrics, including
    review of cardiac medications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptomatic heterozygous women should undergo an evaluation for DMD-related cardiomyopathy and skeletal
      muscle involvement ideally prior to conceiving a pregnancy or as soon as the pregnancy is recognized.
    explanation: >-
      Preconception or early-pregnancy evaluation includes cardiac and skeletal manifestations in symptomatic
      females.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Asymptomatic women who are heterozygous for a DMD pathogenic variant should consider undergoing
      a cardiac evaluation prior to conception or when a pregnancy is recognized. It is recommended that
      women with evidence of dilated cardiomyopathy should be treated and/or monitored by a cardiac specialist
      with experience in the treatment of heart failure and/or neuromuscular disorders and a high-risk
      obstetrician
    explanation: >-
      Cardiac evaluation also applies to asymptomatic heterozygotes, and cardiomyopathy requires coordinated
      specialist care.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiac medications need to be reviewed and potentially adjusted in women who are planning on becoming
      pregnant.
    explanation: >-
      Medication review is part of pregnancy planning.
- name: Advanced Heart Failure Medication and Device Care
  description: >-
    Overt heart failure or ventricular systolic dysfunction requires specialist treatment using heart-failure
    guidance. The French Becker guideline includes ACE inhibitors or angiotensin-receptor antagonists,
    beta blockers, mineralocorticoid-receptor antagonists, and selected resynchronization or defibrillator
    therapy. Ventricular assist devices may be considered as a bridge to transplantation or destination
    therapy; candidacy depends on motor, respiratory, and overall clinical status.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with overt h eart f ailure or left ventricular (LV) systolic dysfunction, the therapeutic
      strategy should follow the recommendations for th e treatment of heart failure in the general population,
      based on (1) ACE inhibitors (or angiotensin II antagonists), b eta blockers, mineralocorticoid receptor
      antagonists, and other specific drugs
    explanation: >-
      The guideline recommends general heart-failure pharmacotherapy for overt heart failure or ventricular
      systolic dysfunction.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In ambulant patients with terminal heart failure and absence of severe respiratory f ailure, cardiac
      transplantation and an LV assist device (as a brid ge to transplant or destination therapy) should
      be consid ered.
    explanation: >-
      Selected patients can be considered for transplantation or ventricular assistance.
  - reference: PMID:37422773
    reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

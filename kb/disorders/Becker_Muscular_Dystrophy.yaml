name: Becker Muscular Dystrophy
creation_date: "2026-08-23T22:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Becker muscular dystrophy
  term:
    id: MONDO:0010311
    label: Becker muscular dystrophy
description: >-
  The milder allelic dystrophinopathy. Becker and Duchenne muscular dystrophy are lesions
  of the same gene, and what separates them is not where the mutation falls but whether it
  preserves the translational reading frame. An in-frame deletion removes internal codons
  and yields a shorter dystrophin that still has its N-terminal actin-binding and
  C-terminal complex-binding ends; an out-of-frame deletion shifts the frame, truncates
  the protein, and leaves nothing that can anchor the sarcolemma.

  Curating Becker separately from Duchenne is not a taxonomic nicety. The two entries
  differ in the molecular lesion class, in the protein outcome, in natural history, and -
  most consequentially for dismech - in the direction of therapy. Exon-skipping antisense
  therapy in Duchenne is an attempt to restore the reading frame, which is to say an
  attempt to convert a Duchenne lesion into a Becker one. Becker is the target state of a
  Duchenne treatment, and an entry that folded it into Duchenne would have no way to say so.

  The clinical picture matches the molecular one. Most patients walk into middle age or
  beyond; in the largest series the median age at loss of ambulation was estimated at 69
  years and over half of diagnoses were prompted by an incidental raised creatine kinase
  rather than by weakness. Cardiac involvement is the disproportionate complication -
  around 30% have left ventricular impairment, against 2.7% with respiratory involvement -
  so the organ that limits prognosis is not the one the patient complains about.
parents:
- Dystrophinopathy
- Muscular Dystrophy

pathophysiology:

- name: In-Frame DMD Lesion
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The defining lesion class. In the largest Becker cohort assembled, 86% of patients
    carried in-frame deletions or duplications of DMD. Deletions clustering around exons
    45-55 dominate, and the specific deletion carries prognostic information: within the
    same in-frame class, del45-49 is associated with earlier loss of ambulation than
    del45-47, while del45-55, del48 and del48-49 are associated with later loss of
    ambulation. So "in-frame" sets the disease and the particular exons set the severity.
  molecular_functions:
  - preferred_term: dystrophin actin filament binding
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: DECREASED
  evidence:
  - reference: PMID:3384440
    reference_title: "An explanation for the phenotypic differences between patients bearing partial deletions of the DMD locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions identified in three BMD patients are shown to maintain the translational ORF
      for amino acids and predict a shorter, lower molecular weight protein.
    explanation: >-
      The original statement of the reading-frame model, on the Becker side of the comparison.
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten per cent of patients carried out-of-frame mutations, 4% nonsense mutations and 86%
      in-frame deletions/duplications.
    explanation: >-
      The mutational composition of a 943-patient Becker cohort. It gives both the dominant
      in-frame class and the size of the exception to the rule.
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients carrying del45-49 compared with del45-47 were associated with an earlier loss
      of ambulation (P = 1 × 10-4), whereas patients with del45-55 (P = 0.005), del48 (P =
      0.02) and del48-49 (P = 0.02) were correlated with a later loss of ambulation compared
      with del45-47.
    explanation: >-
      Within-class genotype-phenotype resolution: which exons are removed changes the
      trajectory even when the frame is preserved throughout.
  downstream:
  - target: Internally Deleted but Semifunctional Dystrophin
    causal_link_type: DIRECT
    description: >-
      Preserving the frame preserves both termini and removes only internal sequence.

- name: Internally Deleted but Semifunctional Dystrophin
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting state of the whole entry, and the single node on which the
    Becker/Duchenne distinction rests. A shorter, lower-molecular-weight dystrophin is
    produced and it is semifunctional - not normal, not absent.

    This is why the disease is a spectrum rather than a category. Duchenne has essentially
    no functional protein and a stereotyped course; Becker has a variable amount of
    partly working protein, and the residual function tracks which internal domains the
    deletion removed. The entry therefore does not curate a single severity, and the
    natural-history data below are reported as distributions rather than as a description
    of a typical patient.
  cellular_components:
  - preferred_term: dystrophin-glycoprotein complex at the sarcolemma
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
    modifier: DECREASED
  evidence:
  - reference: PMID:2491009
    reference_title: "The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For cases with a deletion mutation, the "reading frame" hypothesis predicts that BMD
      patients produce a semifunctional, internally deleted dystrophin protein, whereas DMD
      patients produce a severely truncated protein that would be unstable.
    explanation: >-
      The contrast at protein level between the two diseases, which is what this node models.
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Becker patients, in-frame mutations allow the synthesis of internally deleted, but
      largely functional dystrophins.
    explanation: >-
      Restatement of the same protein-level claim by a group curating the mutation database.
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Becker muscular dystrophy (BMD) is an X-linked neuromuscular disease attributable to
      mutations in DMD, leading to a deficient and less functional dystrophin, mainly in
      skeletal and cardiac muscle.
    explanation: >-
      States both the protein state and the two tissues it matters in, which is where this
      node branches.
  downstream:
  - target: Attenuated Sarcolemmal Fragility in Skeletal Muscle
    causal_link_type: DIRECT
    description: >-
      Residual dystrophin partly maintains the mechanical link across the membrane.
  - target: Dystrophin-Deficient Cardiomyocyte Injury
    causal_link_type: DIRECT
    description: >-
      The same protein deficit in cardiac muscle, where residual function buys much less.

- name: Attenuated Sarcolemmal Fragility in Skeletal Muscle
  role: effector
  biological_scale: CELLULAR
  description: >-
    Dystrophin mechanically couples the actin cytoskeleton to the extracellular matrix
    through the sarcolemma; without it, contraction tears the membrane. A semifunctional
    internally deleted dystrophin still performs some of that coupling, so injury per
    contraction is reduced rather than abolished, and muscle is lost slowly instead of
    rapidly.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gene codes for dystrophin, a protein important for maintaining the stability of
      muscle-fiber membranes.
    explanation: >-
      Dystrophin's function at the muscle-fibre membrane, which is what a semifunctional
      protein partly preserves.
  downstream:
  - target: Slowly Progressive Proximal Myopathy
    causal_link_type: DIRECT
    description: Cumulative fibre loss over decades rather than years.

- name: Slowly Progressive Proximal Myopathy
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The skeletal-muscle endpoint, and it is strikingly indolent. In a 943-patient cohort
    followed at 17 centres, only 13.5% had lost ambulation by last assessment, with a
    Kaplan-Meier median age at loss of ambulation estimated at 69 years. Diagnosis is
    frequently incidental: 55% were prompted by a chance finding of raised creatine kinase,
    at a median age of 7.5 years - decades before weakness would have brought them in.

    Respiratory involvement is uncommon and mild, but not absent, and its rate changes with
    ambulatory status: forced vital capacity falls about 1% of predicted per year overall,
    and significantly faster after loss of ambulation. That is the argument for following
    respiratory function in the non-ambulant subgroup specifically rather than in everyone
    equally.
  evidence:
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the last assessment, 13.5% of patients had lost the ability to walk at a median age
      estimated by Kaplan-Meier analysis of 69 years.
    explanation: The ambulation endpoint, from the largest cohort available.
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 55% of patients, the diagnosis was prompted by the incidental finding of
      hyperCKaemia.
    explanation: >-
      How the disease actually comes to attention, which is not by the presenting complaint
      the name suggests.
  - reference: PMID:33454189
    reference_title: "Respiratory decline in adult patients with Becker muscular dystrophy: A longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analysed 190 pulmonary function measurements with a median interval of one year
      (1-17y) and measured a 1.00% decline of Forced Vital Capacity percent predicted
      (FVC%pred) per year (p = 0.004).
    explanation: The quantified rate of respiratory decline.
  - reference: PMID:33454189
    reference_title: "Respiratory decline in adult patients with Becker muscular dystrophy: A longitudinal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, this decline is significantly more rapid and clinically relevant after loss of
      ambulation, which warrants a more vigilant follow-up of respiratory function in this
      subgroup.
    explanation: >-
      The interaction with ambulatory status and the surveillance recommendation that follows
      from it.

- name: Dystrophin-Deficient Cardiomyocyte Injury
  role: effector
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The same protein deficit reaches cardiac muscle, and this is where the residual
    function of an internally deleted dystrophin buys least. The organ that limits
    prognosis in Becker is not the one that limits function.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Becker muscular dystrophy (BMD) is an X-linked neuromuscular disease attributable to
      mutations in DMD, leading to a deficient and less functional dystrophin, mainly in
      skeletal and cardiac muscle.
    explanation: >-
      Names cardiac muscle as one of the two tissues carrying the dystrophin deficit, which
      is the insult this node models.
  downstream:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Through the ventricular remodelling programme modelled in
      `cardiomyopathy_maladaptive_remodeling`, whose intervening nodes this entry does not
      itself evidence in Becker muscular dystrophy.

- name: Left Ventricular Impairment and Dilated Cardiomyopathy
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    Around 30% of patients have left ventricular impairment, an order of magnitude more
    than the 2.7% with respiratory involvement. It is also under genotypic control within
    the in-frame class: del45-55 and del48 are associated with significantly lower odds of
    a pathological left ventricular ejection fraction than del45-47.

    The clinically important consequence is that cardiac surveillance in Becker cannot be
    triggered by skeletal-muscle severity. A patient walking normally at fifty can have a
    failing ventricle, and the deletion that predicts a good ambulatory course is not
    always the one that predicts a good cardiac course.

    It is also what kills. Heart failure from dilated cardiomyopathy is the most common cause
    of death in Becker muscular dystrophy, with a mean age of death in the mid-forties -
    against a median age at loss of ambulation estimated at sixty-nine. Those two numbers
    together are the whole prognostic shape of this disease: most patients are still walking
    when the heart fails, so an entry that read only the skeletal-muscle data would describe
    an indolent condition and be wrong about its outcome.
  evidence:
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty per cent of patients exhibited left ventricular impairment and 2.7% respiratory
      involvement.
    explanation: >-
      The two organ-involvement rates side by side, which is what makes the cardiac arm the
      dominant one.
  - reference: PMID:39499670
    reference_title: "Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both del45-55 (P = 0.002) and del48 (P = 0.003) were significantly associated with
      decreased odds of developing a pathological left ventricular ejection fraction compared
      with del45-47.
    explanation: Genotypic modulation of the cardiac endpoint within the in-frame class.
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite the milder
      skeletal muscle involvement, heart failure from DCM is a common cause of
      morbidity and the most common cause of death in BMD. Mean age of death is in the
      mid-40s.
    explanation: >-
      The mortality claim this node turns on, from the GeneReviews chapter: cardiac, not
      skeletal, and in the mid-forties.



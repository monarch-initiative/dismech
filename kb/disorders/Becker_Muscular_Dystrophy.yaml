diagnosis:
- name: DMD Genetic Testing with Reading-Frame Interpretation
  description: >-
    Deletion/duplication analysis followed by sequencing. The interpretive step that
    assigns Becker rather than Duchenne is whether the lesion preserves the reading frame -
    but it predicts the phenotype in about 91-92% of cases, not all, so a frame prediction
    that conflicts with the clinical course should be treated as one of the known
    exceptions rather than as a reason to doubt the diagnosis.
  evidence:
  - reference: PMID:2491009
    reference_title: "The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between phenotype and type of deletion mutation is in agreement with
      the "reading frame" theory in 92% of cases and is of diagnostic and prognostic
      significance.
    explanation: >-
      The accuracy of the rule and the authors' own statement that it is diagnostically and
      prognostically useful.

- name: Cardiac Surveillance Independent of Skeletal Muscle Severity
  description: >-
    Left ventricular impairment affects about ten times as many patients as respiratory
    involvement, and its genotypic predictors are not the same as those for ambulation, so
    a patient with mild weakness cannot be assumed to have a healthy heart.
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite the milder
      skeletal muscle involvement, heart failure from DCM is a common cause of
      morbidity and the most common cause of death in BMD.
    explanation: >-
      The direct statement of why cardiac surveillance cannot be triggered by skeletal-muscle
      severity: the mildness of the muscle disease is precisely what does not protect the heart.

treatments:
- name: ACE Inhibition for Established Cardiomyopathy
  description: >-
    Angiotensin-converting enzyme inhibitors, with or without beta blockers, are the
    first-line treatment for the dilated cardiomyopathy - which matters because the
    cardiomyopathy is what kills in this disease.

    The Becker-specific point is where the indication stops. In Duchenne, prophylactic ACE
    inhibition is given regardless of ejection fraction; in Becker it is not, because no trial
    has tested it in patients with a normal LVEF. The French guidelines say plainly that there
    is no indication to treat every Becker patient regardless of cardiac phenotype the way one
    would in Duchenne. Treatment is instead triggered by LVEF below 50% or myocardial fibrosis
    on MRI, and considered case by case in that group.

    Reading this as "ACE inhibitors are used in BMD" and stopping there would import a Duchenne
    practice into a disease where it has never been tested.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    treatment_effect: INHIBITS
    description: >-
      Standard heart-failure pharmacotherapy acting on the ventricular remodelling programme
      rather than on the dystrophin deficit.
    evidence:
    - reference: PMID:20301298
      reference_title: "Dystrophinopathies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ACE inhibitors are used with or without
        beta blockers for cardiomyopathy in both DMD and BMD phenotypes.
      explanation: The indication for established cardiomyopathy in both phenotypes.
  evidence:
  - reference: PMID:37422773
    reference_title: "Diagnosis and management of Becker muscular dystrophy: the French guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, there is no indication to use ACE inhibitors for
      systematic treatment of BMD patients regardless of cardiac phenotype, such as in Duchenne
      MD.
    explanation: >-
      The boundary of the indication, and the explicit contrast with Duchenne practice. This is
      the most Becker-specific therapeutic statement in the reference set.
  - reference: PMID:37422773
    reference_title: "Diagnosis and management of Becker muscular dystrophy: the French guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with LVEF < 50% and/or evidence of myocardial fibrosis on MRI should be referre d
      to a specialized cardiologist in a tertiary center to discuss the  initiation of cardioprotective
    explanation: >-
      The trigger threshold that replaces universal prophylaxis. Quoted verbatim including the
      word-splitting artefacts of the cached PDF text extraction.

- name: Corticosteroid Therapy
  description: >-
    Used in Becker by extension from Duchenne, where it improves muscle strength and function
    between ages five and fifteen. GeneReviews states the efficacy is less clear in Becker.
    Curated with that hedge rather than as an established treatment, because the evidence for
    it is an inference from a different phenotype of the same gene.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Corticosteroid therapy improves muscle strength and function for individuals with DMD between ages five and 15 years;
      the same treatment is used in BMD, although the efficacy is less clear.
    explanation: >-
      Curated as PARTIAL because the source's own qualifier - "although the efficacy is less
      clear" - is the operative part of the sentence for this entry.

- name: Cardiac Transplantation
  description: >-
    Offered for severe dilated cardiomyopathy, and Becker is the dystrophinopathy in which it
    is realistic: the selection criterion is limited or absent skeletal muscle disease, which
    is exactly the Becker end of the spectrum. The French guidelines add the boundary - in
    patients who have lost ambulation or have significant respiratory failure, transplantation
    is generally not indicated and a left ventricular assist device is discussed instead.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    treatment_effect: BYPASSES
    description: >-
      Replaces the failing organ rather than acting on the dystrophin deficit, which persists
      in every other muscle.
    evidence:
    - reference: PMID:20301298
      reference_title: "Dystrophinopathies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        cardiac
        transplantation is offered to persons with severe dilated cardiomyopathy and BMD
        with limited or no clinical evidence of skeletal muscle disease.
      explanation: The indication and its selection criterion.
  evidence:
  - reference: PMID:37422773
    reference_title: "Diagnosis and management of Becker muscular dystrophy: the French guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with terminal heart failure who have lost
      ambulation or have significant respiratory failure, cardi ac transplantati on is generally not
      indicated
    explanation: >-
      Where the indication stops. Quoted verbatim including the cached text's word-splitting.

- name: Cardiac Surveillance
  description: >-
    Annual or biannual cardiology evaluation from diagnosis, in a disease where the heart is
    the leading cause of death and where skeletal-muscle severity does not predict cardiac
    involvement. Heterozygous females need it too: they are at increased risk of dilated
    cardiomyopathy and should have a cardiac evaluation at least once after the teenage years.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For males
      with DMD or BMD: annual or biannual evaluation by a cardiologist beginning at
      the time of diagnosis
    explanation: The surveillance schedule.
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For heterozygous females: cardiac evaluation at least once after
      the teenage years.
    explanation: >-
      Carrier surveillance, which is why this entry's inheritance section declines to describe
      heterozygous females as unaffected.

- name: Anaesthetic Avoidance
  description: >-
    A safety item rather than a therapy, and the one most likely to matter acutely.
    Succinylcholine and inhalational anaesthetics are to be avoided because of susceptibility
    to malignant hyperthermia or malignant-hyperthermia-like reactions, and botulinum toxin
    injections are also listed as an agent to avoid. In a disease where most patients are
    ambulant and may present for unrelated surgery, this is the item an anaesthetist needs and
    a mild phenotype makes easy to miss.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Botulinum toxin injections;
      succinylcholine and inhalational anesthetics because of susceptibility to
      malignant hyperthermia or malignant hyperthermia-like reactions.
    explanation: The agents to avoid and the reason.

discussions:
- discussion_id: interpretation_becker_is_the_target_state_of_dmd_exon_skipping
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should Becker muscular dystrophy be curated as the therapeutic target state of
    exon-skipping antisense therapy in Duchenne muscular dystrophy, and does that make it a
    conformer of the antisense-oligonucleotide module?
  attaches_to:
  - pathophysiology#Internally Deleted but Semifunctional Dystrophin
  rationale: >-
    The reading-frame rule is what makes exon-skipping therapy in Duchenne conceivable at
    all. Skipping an exon adjacent to an out-of-frame deletion restores the frame, and the
    protein it produces is an internally deleted, semifunctional dystrophin - which is to
    say the Becker protein. The therapeutic aim in Duchenne is to convert a Duchenne lesion
    into a Becker one.

    This entry therefore does *not* declare conformance to `antisense_oligonucleotide_therapy`.
    That module's nodes are intervention-conditioned: they model an RNA vulnerability, an
    ASO acting on it, and a restored transcript. Becker muscular dystrophy has no such
    intervention - the in-frame transcript is what the patient is born with. Conforming
    would assert an ASO in the causal path of an untreated disease.

    The relationship is real and worth recording, but it runs the other way: this entry
    describes the state that `antisense_oligonucleotide_therapy#Restored Productive
    Transcript and Protein Expression` aims at in Duchenne. Curated as an interpretation so
    a reader of either entry can find the other.
  evidence:
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Becker patients, in-frame mutations allow the synthesis of internally deleted, but
      largely functional dystrophins.
    explanation: >-
      The protein state that exon skipping in Duchenne is designed to produce, stated here as
      the natural state in Becker.
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin restoration therapies have been developed by using synthetic
      antisense oligonucleotides to restore the reading frame by exon skipping for
      individuals with specific pathogenic variants in DMD.
    explanation: >-
      States the therapeutic aim in the reading-frame terms this discussion turns on: exon
      skipping exists to restore the frame, which is what defines Becker.

- discussion_id: interpretation_reading_frame_rule_is_statistical
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should exceptions to the reading-frame rule be curated, given that a substantial
    minority of clinically definite Becker patients carry out-of-frame mutations?
  attaches_to:
  - pathophysiology#In-Frame DMD Lesion
  rationale: >-
    The rule is a strong statistical generalisation, not a law, and three independent
    numbers agree on roughly the same figure: 92% concordance across 258 deletions in 1989,
    91% across more than 4700 database entries in 2006, and 10% out-of-frame plus 4%
    nonsense mutations in a 943-patient Becker cohort in 2025. About one Becker patient in
    seven has a lesion the rule says should have produced Duchenne.

    Recognised escape routes exist - alternative splicing that removes the frameshift,
    ribosomal reinitiation, revertant fibres - but none is evidenced in the references read
    for this entry, so the pathograph models only the in-frame route and this discussion
    carries the exception explicitly rather than the trigger node implying a rule without
    exceptions.

    There is a selection point in the 1989 data worth preserving: the authors note that
    many in-frame deletions are probably never ascertained, because the people carrying them
    are asymptomatic or have something that looks like neither disease. The observed
    genotype-phenotype correlation is therefore measured on an ascertained population, and
    the mild tail of Becker is systematically under-counted.
  evidence:
  - reference: PMID:2491009
    reference_title: "The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between phenotype and type of deletion mutation is in agreement with
      the "reading frame" theory in 92% of cases and is of diagnostic and prognostic
      significance.
    explanation: >-
      92%, not 100%. Curated as PARTIAL because the same sentence both supports the rule and
      bounds it.
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      over 4700 mutations have been reported in the Leiden DMD mutation database, of
      which 91% are in agreement with this rule.
    explanation: The same figure at far larger scale, seventeen years later.
  - reference: PMID:2491009
    reference_title: "The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution and frequency of deletions spanning the entire locus suggests that
      many "in-frame" deletions of the dystrophin gene are not detected because the
      individuals bearing them are either asymptomatic or exhibit non-DMD/non-BMD clinical
      features.
    explanation: >-
      The ascertainment argument, made by the authors themselves, which bears on how the 92%
      should be read.

notes: >-
  Curated from a Perplexity sonar-deep-research report
  (research/Becker_Muscular_Dystrophy-deep-research-perplexity.md).

  `just preflight-dr` returned **SKIP** for MONDO:0010311, because MONDO records no
  `RO:0004003` causal gene for this term and the automated gene-identity check cannot
  discriminate without one. The manual preflight was therefore run as the skill directs.
  The report's OMIM identifiers are 300376 and 310200; 300376 is the MONDO xref for Becker
  muscular dystrophy and 310200 is Duchenne, which a Becker report is expected to discuss.
  DMD dominates the report's gene mentions at 109; the `ACE` hits are angiotensin-converting
  enzyme inhibitors, not a gene. The specific named-entity trap for this disease is *Becker
  myotonia congenita*, an unrelated CLCN1 chloride channelopathy that shares the eponym;
  the report contains zero mentions of CLCN1, myotonia congenita or Thomsen disease, so it
  is not confused with it.

  Its citations file carried three PubMed links; the other three references here were found
  by PubMed query and every abstract was read before use.

  The first version of this entry curated no treatments, and justified that with a grep result
  that was false. The claim was that grepping all six cached references for ACE inhibitors,
  beta-blockers, corticosteroids, ventilation, transplantation and dosing "returns nothing at
  all". It returns 34 hits in PMID:37422773 alone - a reference this entry already cited,
  cached as full text, with an entire Heart treatment section.

  The cause is worth recording because the method looked careful and was not. The grep required
  fifty characters of context on either side of the search term. `grep` is line-oriented, and
  the cached text is a line-wrapped PDF extraction, so terms sitting near a line boundary could
  never satisfy the context requirement. A pattern designed to show the surrounding sentence
  silently converted every near-boundary hit into a non-hit, and the empty result was read as
  evidence of absence. The correct order is a bare term grep first, then context on the lines
  that matched.

  Treatments are now curated from that section and from the GeneReviews chapter. The
  Becker-specific fact is a negative one: unlike in Duchenne, there is no indication for
  prophylactic ACE inhibition regardless of cardiac phenotype, because no trial has tested it
  in Becker patients with a normal LVEF. Treatment is triggered by LVEF below 50% or myocardial
  fibrosis on MRI.

  Mining the GeneReviews chapter (PMID:20301298) also corrected the entry's prognostic shape.
  The first version emphasised the indolent skeletal course - a median age at loss of ambulation
  of sixty-nine - and never said what patients die of. Heart failure from dilated cardiomyopathy
  is the most common cause of death in Becker muscular dystrophy, with a mean age of death in
  the mid-forties. Most patients are still walking when the heart fails.

  This entry deliberately does not conform to `antisense_oligonucleotide_therapy`, although
  it is closely related to it; the reasoning is in the
  `interpretation_becker_is_the_target_state_of_dmd_exon_skipping` discussion.

  Conformance to `cardiomyopathy_maladaptive_remodeling` is claimed at the insult and
  outcome nodes only. The module's intervening neurohormonal-activation, remodelling and
  contractile-dysfunction nodes are not claimed, because none of the references read for
  this entry evidences those steps *in Becker muscular dystrophy* specifically.


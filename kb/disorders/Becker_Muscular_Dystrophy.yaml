name: Becker Muscular Dystrophy
creation_date: '2026-08-23T22:30:00Z'
category: Mendelian
disease_term:
  preferred_term: Becker muscular dystrophy
  term:
    id: MONDO:0010311
    label: Becker muscular dystrophy
description: >-
  Becker muscular dystrophy is an X-linked dystrophinopathy caused by pathogenic DMD variants that permit
  production of partly functional dystrophin. Protein quantity, structure, and clinical severity vary.
  In-frame variants predominate, but the reading-frame rule is predictive rather than diagnostic: out-of-frame,
  nonsense, splice, and other variants can also produce a Becker phenotype. Progressive proximal weakness,
  calf hypertrophy, exercise-related symptoms, or incidental hyperCKaemia may lead to diagnosis. Cardiomyopathy
  can be severe despite relatively mild skeletal muscle involvement. Age at loss of ambulation and respiratory
  impairment vary substantially between patients and genotypes.
parents:
- Dystrophinopathy
- Muscular Dystrophy
pathophysiology:
- name: DMD Pathogenic Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants in DMD alter dystrophin quantity or function. In-frame deletions and duplications
    are common, but neither reading frame nor variant position alone establishes the Becker phenotype.
    The Italian cohort included 779 in-frame, 89 out-of-frame, and 35 nonsense variants among 903 genetically
    characterized patients. Particular exon deletions correlate with clinical outcomes at the group level;
    substantial variation remains within genotypes and families.
  evidence:
  - reference: PMID:3384440
    reference_title: An explanation for the phenotypic differences between patients bearing partial deletions of the DMD locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions identified in three BMD patients are shown to maintain the translational ORF for amino
      acids and predict a shorter, lower molecular weight protein.
    explanation: >-
      The original statement of the reading-frame model, on the Becker side of the comparison.
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten per cent of patients carried out-of-frame mutations, 4% nonsense mutations and 86% in-frame
      deletions/duplications.
    explanation: >-
      The mutational composition of a 943-patient Becker cohort. It gives both the dominant in-frame class
      and the size of the exception to the rule.
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients carrying del45-49 compared with del45-47 were associated with an earlier loss of ambulation
      (P = 1 × 10-4), whereas patients with del45-55 (P = 0.005), del48 (P = 0.02) and del48-49 (P = 0.02)
      were correlated with a later loss of ambulation compared with del45-47.
    explanation: >-
      Within-class genotype-phenotype resolution: which exons are removed changes the trajectory even
      when the frame is preserved throughout.
  downstream:
  - target: Reduced or Abnormal Partly Functional Dystrophin
    causal_link_type: DIRECT
    description: >-
      DMD variants can produce reduced amounts of dystrophin, an abnormal protein, or both, while retaining
      sufficient function for a Becker clinical phenotype. The protein outcome cannot be inferred solely
      from reading-frame preservation.

    evidence:
    - reference: PMID:39499670
      reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Becker muscular dystrophy (BMD) is an X-linked neuromuscular disease attributable to mutations
        in DMD, leading to a deficient and less functional dystrophin, mainly in skeletal and cardiac
        muscle.
      explanation: >-
        The cohort report connects DMD mutations to the partly functional dystrophin state in skeletal
        and cardiac muscle.
      quote_role: BACKGROUND
- name: Reduced or Abnormal Partly Functional Dystrophin
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Residual dystrophin distinguishes the Becker phenotype from severe dystrophin deficiency, but its
    abundance and function vary. Internally deleted dystrophin is a common outcome, not the only one.
    In bmx mice with deletion of Dmd exons 45-47, skeletal and cardiac dystrophin protein is reduced despite
    preserved transcript abundance. Sarcolemmal nNOS localization is lost and alpha-sarcoglycan localization
    is reduced in this model; these allele-specific observations should not be assumed for every Becker
    variant.
  cellular_components:
  - preferred_term: dystrophin-glycoprotein complex at the sarcolemma
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
  evidence:
  - reference: PMID:2491009
    reference_title: 'The molecular basis for Duchenne versus Becker muscular dystrophy: correlation of severity with type of deletion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For cases with a deletion mutation, the "reading frame" hypothesis predicts that BMD patients produce
      a semifunctional, internally deleted dystrophin protein, whereas DMD patients produce a severely
      truncated protein that would be unstable.
    explanation: >-
      The contrast at protein level between the two diseases, which is what this node models.
  - reference: PMID:16770791
    reference_title: 'Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Becker patients, in-frame mutations allow the synthesis of internally deleted, but largely functional
      dystrophins.
    explanation: >-
      Restatement of the same protein-level claim by a group curating the mutation database.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Becker muscular dystrophy (BMD) is an X-linked neuromuscular disease attributable to mutations in
      DMD, leading to a deficient and less functional dystrophin, mainly in skeletal and cardiac muscle.
    explanation: >-
      States both the protein state and the two tissues it matters in, which is where this node branches.
    quote_role: BACKGROUND
  - reference: PMID:36628607
    reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly we see reduced dystrophin protein, but not mRNA, in bmx skeletal and cardiac muscle.
    explanation: >-
      The exon 45-47 mouse model demonstrates a protein deficit without a corresponding transcript deficit.
  - reference: PMID:36628607
    reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      bmx muscles showed complete loss of nNOS localization at the sarcolemma as did dystrophin‐null mdx52
      muscles (Figure 6C).
    explanation: >-
      Loss of membrane nNOS is demonstrated for the exon 45-47 model, rather than asserted across all
      Becker genotypes.
  downstream:
  - target: Contraction-Induced Skeletal Muscle Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Partly functional dystrophin provides incomplete protection against contraction-induced skeletal
      muscle injury. The exon 45-47 bmx model retains susceptibility to eccentric contractions.
    evidence:
    - reference: PMID:36628607
      reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ten eccentric contractions of WT EDL muscle resulted in a 15.53% drop in ex vivo peak force. In
        contrast, this protocol reduced peak force by 20.16% in bmx EDL muscles (P = 0.0239 bmx vs. WT)
        and 20.86% in mdx EDL (Figure 2D).
      explanation: >-
        The genotype-defined model has greater contraction-induced force loss than wild type; it does
        not establish a uniform degree of protection relative to dystrophin-null muscle.
  - target: Dystrophin-Deficient Cardiomyocyte Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The dystrophin deficit also affects cardiomyocytes and can cause cardiac dysfunction despite relatively
      preserved skeletal muscle function.

    evidence:
    - reference: PMID:36628607
      reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, bmx mice show deficits in muscle and cardiac function, reduced dystrophin protein
        in skeletal and cardiac muscle, and histopathology consistent with moderate dystrophy.
      explanation: >-
        The bmx model connects the Dmd lesion and reduced cardiac dystrophin with cardiac dysfunction;
        detailed cellular intermediates are not resolved by this summary.
  - target: Loss of Sarcolemmal nNOS Localization
    causal_link_type: DIRECT
    description: >-
      Some DMD variants disrupt dystrophin-dependent membrane localization of nNOS. Human biopsy evidence
      shows this for several exon-deletion groups, while other Becker variants retain sarcolemmal nNOS.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4666991/
      reference_title: Sodium nitrate alleviates functional muscle ischaemia in patients with Becker muscular dystrophy - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sarcolemmal staining for nNOS was absent in seven BMD patients (including all five patients with
        deletion of exons 45–47 or 45–48, and both patients with deletion of exons 3–7) but present in
        the other six patients.
      explanation: >-
        Human biopsies show genotype-associated variation in nNOS localization; membrane loss is not universal
        in Becker muscular dystrophy.
- name: Contraction-Induced Skeletal Muscle Injury
  role: effector
  biological_scale: CELLULAR
  description: >-
    Dystrophin supports muscle membrane stability. In Becker muscular dystrophy, residual protein does
    not fully prevent contraction-related injury. Exon 45-47 bmx mouse muscle shows increased force loss
    after eccentric contractions, raised serum creatine kinase, necrotic and inflammatory foci, regeneration,
    and fibrosis. The severity of individual measurements need not lie uniformly between wild type and
    dystrophin-null muscle.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:16770791
    reference_title: 'Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gene codes for dystrophin, a protein important for maintaining the stability of muscle-fiber
      membranes.
    explanation: >-
      Dystrophin's function at the muscle-fibre membrane, which is what a semifunctional protein partly
      preserves.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36628607
    reference_title: The X-linked Becker muscular dystrophy (bmx) mouse models Becker muscular dystrophy via deletion of murine dystrophin exons 45-47.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ten eccentric contractions of WT EDL muscle resulted in a 15.53% drop in ex vivo peak force. In
      contrast, this protocol reduced peak force by 20.16% in bmx EDL muscles (P = 0.0239 bmx vs. WT)
      and 20.86% in mdx EDL (Figure 2D).
    explanation: >-
      The genotype-defined model has greater contraction-induced force loss than wild type; it does not
      establish a uniform degree of protection relative to dystrophin-null muscle.
  downstream:
  - target: Slowly Progressive Proximal Myopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recurrent injury, degeneration, and fibrofatty replacement contribute to progressive loss of skeletal
      muscle function; the pace varies across patients.

    evidence:
    - reference: PMID:36793492
      reference_title: 'Givinostat for Becker muscular dystrophy: A randomized, placebo-controlled, double-blind study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the early stages BMD involves active myonecrosis and regeneration; later in the disease course
        chronic myopathic changes are more likely, including increased skeletal muscle fiber size variability,
        fibrosis, and fat replacement of muscle tissue
      explanation: >-
        The trial introduction summarizes the pathological sequence underlying progressive myopathy; it
        is a literature synthesis, not a longitudinal histology result of this trial.
      quote_role: BACKGROUND
  - target: Elevated Creatine Kinase
    causal_link_type: DIRECT
    description: >-
      Muscle damage releases creatine kinase into the circulation; CK is a damage marker rather than a
      direct measure of remaining strength.
    evidence:
    - reference: PMID:20301298
      reference_title: Dystrophinopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mild end of the spectrum includes the phenotypes of asymptomatic increase in serum concentration
        of creatine phosphokinase (CK) and muscle cramps with myoglobinuria.
      explanation: >-
        GeneReviews identifies elevated CK as part of the mild dystrophinopathy spectrum; Becker is the
        mild skeletal-muscle presentation in that spectrum.
      quote_role: REVIEW_SYNTHESIS
- name: Slowly Progressive Proximal Myopathy
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Proximal weakness and mobility loss progress at variable rates. In the retrospective Italian cohort,
    111 of 822 patients with available ambulation information had lost walking ability at assessment.
    The Kaplan-Meier median age at loss of ambulation was 69 years, whereas the observed mean age among
    those who had already lost ambulation was 35.3 years. These are different statistics; neither describes
    an inevitable course for an individual. Respiratory decline can become clinically important, especially
    after loss of ambulation, and warrants surveillance.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/7876416
    reference_title: https://oup.silverchair-cdn.com/article-minimal/7876416
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Information about LoA was known for 822 (87.2%) patients; of these, 111 (13.5%) patients had lost
      the ability to walk at the time of data collection, with a mean age at LoA of 35.3 (±15.0) years
    explanation: >-
      The full cohort report supplies the assessed denominator and observed event age, avoiding interpretation
      of a cross-sectional fraction as lifetime risk.
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 55% of patients, the diagnosis was prompted by the incidental finding of hyperCKaemia.
    explanation: >-
      Incidental hyperCKaemia prompted many diagnoses in this Italian cohort; local testing practices
      affect the proportion.
  - reference: PMID:33454189
    reference_title: 'Respiratory decline in adult patients with Becker muscular dystrophy: A longitudinal study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analysed 190 pulmonary function measurements with a median interval of one year (1-17y) and measured
      a 1.00% decline of Forced Vital Capacity percent predicted (FVC%pred) per year (p = 0.004).
    explanation: The quantified rate of respiratory decline.
  - reference: PMID:33454189
    reference_title: 'Respiratory decline in adult patients with Becker muscular dystrophy: A longitudinal study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, this decline is significantly more rapid and clinically relevant after loss of ambulation,
      which warrants a more vigilant follow-up of respiratory function in this subgroup.
    explanation: >-
      The interaction with ambulatory status and the surveillance recommendation that follows from it.

  downstream:
  - target: Progressive Proximal Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Proximal weakness is the principal clinical manifestation of the skeletal myopathy.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1119/pdf/Bookshelf_NBK1119.pdf
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        More moderate skeletal muscle manifestations (e.g., BMD) may be characterized by onset in adolescence
        to adulthood of progressive symmetric muscle weakness (proximal > distal) often with calf hypertrophy;
        weakness of quadriceps femoris (sometimes the only sign); activity-induced cramping (present in
        some individuals); preservation of neck flexor muscle strength;
      explanation: >-
        GeneReviews describes the proximal distribution, progression, and activity-related symptoms of
        Becker myopathy.
      quote_role: REVIEW_SYNTHESIS
  - target: Waddling gait
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pelvic-girdle involvement alters gait as weakness progresses.
    evidence:
    - reference: PMID:37422773
      reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This is followed by weakness in standing up or a waddling gait.
      explanation: >-
        The Becker clinical sequence links progressive lower-limb impairment with the gait abnormality.
      quote_role: REVIEW_SYNTHESIS
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Axial muscle weakness can contribute to scoliosis.
    evidence:
    - reference: PMID:37422773
      reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Axial weakness: scoliosis, abdominal weakness with difficulties in getting up from the lying position
      explanation: >-
        The guideline lists scoliosis as a manifestation associated with axial weakness.
      quote_role: REVIEW_SYNTHESIS
  - target: Reduced Forced Vital Capacity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Extension of muscle weakness to respiratory muscles can reduce ventilatory capacity.
    evidence:
    - reference: PMID:37422773
      reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        BMD patients may experience progressive deterioration in their respiratory function related to
        a decrease in the strength of respiratory muscles
      explanation: >-
        The respiratory section explicitly links functional deterioration to respiratory muscle weakness.
      quote_role: REVIEW_SYNTHESIS
- name: Dystrophin-Deficient Cardiomyocyte Injury
  role: effector
  biological_scale: CELLULAR
  conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
  description: >-
    Abnormal or reduced dystrophin affects cardiac as well as skeletal muscle. Cardiac disease can progress
    independently of skeletal muscle severity. The bmx mouse demonstrates reduced cardiac dystrophin and
    impaired ventricular function; human surveillance must therefore consider the heart even when skeletal
    weakness is mild.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Becker muscular dystrophy (BMD) is an X-linked neuromuscular disease attributable to mutations in
      DMD, leading to a deficient and less functional dystrophin, mainly in skeletal and cardiac muscle.
    explanation: >-
      Names cardiac muscle as one of the two tissues carrying the dystrophin deficit, which is the insult
      this node models.
    quote_role: BACKGROUND
  downstream:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiac dystrophin dysfunction can lead to progressive ventricular impairment. The exon 45-47 rat
      model supports progression to cardiomyopathy, while the intervening cellular sequence is not fully
      established for human Becker disease.

    evidence:
    - reference: PMID:39358550
      reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        BMD rats exhibit moderate damage to locomotor and diaphragmatic muscles but suffer from a progressive
        cardiomyopathy.
      explanation: >-
        The Dmd exon-deletion model develops progressive cardiomyopathy, without identifying all intervening
        injury and remodeling steps.
  - target: Cardiac Intercalated Disc Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The exon 45-47 rat model shows altered intercalated-disc architecture and protein localization.
      The contribution of dystrophin quantity versus its altered structure is unresolved.
    evidence:
    - reference: PMID:39358550
      reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the histological level, TMEM65 notably displayed a larger distribution and mislocalization
        from the ICD in both BMD and DMD ventricles
      explanation: >-
        Immunostaining shows mislocalization in the rat model; reduced Tmem65 RNA did not correspond to
        reduced TMEM65 protein abundance in Becker rat hearts.
- name: Left Ventricular Impairment and Dilated Cardiomyopathy
  role: outcome
  biological_scale: ORGANISM
  conforms_to: cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure
  description: >-
    Left ventricular systolic dysfunction and dilated cardiomyopathy are important complications, and
    heart failure is a major cause of mortality. In the Italian cohort, 187 of 621 assessed patients had
    LVEF below 55%, which measures systolic impairment rather than the prevalence of dilated cardiomyopathy.
    Certain deletions were associated with lower odds of impaired LVEF, but genotype does not determine
    an individual outcome.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/7876416
    reference_title: https://oup.silverchair-cdn.com/article-minimal/7876416
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hundred and eighty-seven (30.1%) patients showed LVEF% of &lt;55%
    explanation: >-
      The full text defines the cardiac outcome as reduced ejection fraction and supplies its numerator;
      621 patients had an LVEF measurement.
  - reference: PMID:39499670
    reference_title: 'Natural history of Becker muscular dystrophy: DMD gene mutations predict clinical severity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both del45-55 (P = 0.002) and del48 (P = 0.003) were significantly associated with decreased odds
      of developing a pathological left ventricular ejection fraction compared with del45-47.
    explanation: Genotypic modulation of the cardiac endpoint within the in-frame class.
  - reference: PMID:20301298
    reference_title: Dystrophinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite the milder skeletal muscle involvement, heart failure from DCM is a common cause of morbidity
      and the most common cause of death in BMD. Mean age of death is in the mid-40s.
    explanation: >-
      The older GeneReviews abstract identifies heart failure as a major source of morbidity and mortality.
      Its summary age at death is not compared numerically with ambulation estimates from another cohort.

    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Left Ventricular Impairment
    causal_link_type: DIRECT
    description: >-
      Reduced LVEF is the clinical readout of ventricular systolic dysfunction.
    evidence:
    - reference: url:https://oup.silverchair-cdn.com/article-minimal/7876416
      reference_title: https://oup.silverchair-cdn.com/article-minimal/7876416
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One hundred and eighty-seven (30.1%) patients showed LVEF% of &lt;55%
      explanation: >-
        The full text defines the cardiac outcome as reduced ejection fraction and supplies its numerator;
        621 patients had an LVEF measurement.
  - target: Dilated Cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Becker ventricular disease can progress to dilated cardiomyopathy and heart failure.
    evidence:
    - reference: PMID:20301298
      reference_title: Dystrophinopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Despite the milder skeletal muscle involvement, heart failure from DCM is a common cause of morbidity
        and the most common cause of death in BMD.
      explanation: >-
        GeneReviews identifies DCM-related heart failure as a major Becker outcome.
      quote_role: REVIEW_SYNTHESIS
- name: Cardiac Intercalated Disc Disorganization
  role: effector
  biological_scale: CELLULAR
  description: >-
    In exon 45-47 Becker rats, TMEM65 and connexin-43 are mislocalized and intercalated discs have widened,
    irregular folds and abnormal contacts with nearby sarcomeres. These findings suggest impaired cardiomyocyte
    coupling, but no targeted rescue experiment establishes their mediation of ventricular dysfunction.
    This is model-derived evidence, not a demonstrated universal human cellular lesion.
  evidence:
  - reference: PMID:39358550
    reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At the histological level, TMEM65 notably displayed a larger distribution and mislocalization from
      the ICD in both BMD and DMD ventricles
    explanation: >-
      Immunostaining shows mislocalization in the rat model; reduced Tmem65 RNA did not correspond to
      reduced TMEM65 protein abundance in Becker rat hearts.
  - reference: PMID:39358550
    reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that Cx43 was more internalized in both BMD and DMD, with a lower co-localization with
      N-cadherin (NCAD), an intercalated disc marker
    explanation: >-
      Connexin-43 localization changes accompany intercalated-disc disorganization in dystrophic rat hearts.
  downstream:
  - target: Left Ventricular Impairment and Dilated Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered mechanical and electrical coupling is a proposed contributor to cardiac dysfunction in the
      rat model. Co-occurrence and structural data support the hypothesis, while causal mediation remains
      untested.
    evidence:
    - reference: PMID:39358550
      reference_title: Progressive cardiomyopathy with intercalated disc disorganization in a rat model of Becker dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that disruption in the localization of TMEM65 and Cx43 could play a role in altering
        electrical synchronization during myocardial depolarization or repolarization, due to partly inefficient
        intercellular communications.
      explanation: >-
        The authors explicitly frame this mechanism as a proposal; the edge retains that uncertainty.
- name: Loss of Sarcolemmal nNOS Localization
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Dystrophin serves as a scaffold for sarcolemmal nNOS. Some Becker variants reduce or abolish membrane
    nNOS localization; other variants retain it. In a biopsy-linked human series, nNOS staining was absent
    in seven patients and present in six. Total nNOS abundance and residual localization also vary, including
    between relatives with the same splice variant.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4666991/
    reference_title: Sodium nitrate alleviates functional muscle ischaemia in patients with Becker muscular dystrophy - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sarcolemmal staining for nNOS was absent in seven BMD patients (including all five patients with
      deletion of exons 45–47 or 45–48, and both patients with deletion of exons 3–7) but present in the
      other six patients.
    explanation: >-
      Human biopsies show genotype-associated variation in nNOS localization; membrane loss is not universal
      in Becker muscular dystrophy.
  downstream:
  - target: Impaired Exercise-Induced Vasomodulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of membrane-associated nNOS weakens local nitric-oxide-dependent attenuation of sympathetic
      vasoconstriction during exercise. Acute rescue with interventions that augment NO-cGMP signaling
      supports this pathway, without proving an effect on long-term muscle decline.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4666991/
      reference_title: Sodium nitrate alleviates functional muscle ischaemia in patients with Becker muscular dystrophy - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

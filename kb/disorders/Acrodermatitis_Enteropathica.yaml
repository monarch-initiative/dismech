- name: SLC39A4 (ZIP4) Loss of Function
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Disease-associated SLC39A4 alleles reduce ZIP4-mediated zinc uptake through variant-specific defects in transporter
    availability or activity. Human extracellular-domain variants lost activity in a 2021 HEK293T assay, whereas
    mouse P200L retained near-normal short-interval transport in a different assay; these results do not establish
    a single catalytic defect for every allele.
  molecular_functions:
  - preferred_term: zinc ion transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0005385
      label: zinc ion transmembrane transporter activity
  evidence:
  - reference: PMID:14709598
    reference_title: Acrodermatitis enteropathica mutations affect transport activity, localization and zinc-responsive trafficking of the mouse ZIP4 zinc transporter.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: All mutations decreased 65Zn uptake activity of mZip4, thereby providing a causal link to AE.
    explanation: Six human-disease-associated substitutions were introduced into mouse ZIP4 and tested in cultured cells.
  - reference: PMID:33837739
    reference_title: Zinc transporter mutations linked to acrodermatitis enteropathica disrupt function and cause mistrafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: the variants exhibited completely abolished zinc transport activity in a cell-based transport assay.
    explanation: Seven human extracellular-domain variants in HEK293T cells.
  - reference: PMID:31979155
    reference_title: Elucidating the H(+) Coupled Zn(2+) Transport Mechanism of ZIP4; Implications in Acrodermatitis Enteropathica.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: in our shorter 2 min experiment, Zn2+ transport rates were no different from those of the wild type protein, indicating that catalytic Zn2+ transport was not impaired by this mutation.
    explanation: Mouse P200L retained short-interval catalytic activity. This limits a universal catalytic-loss claim without refuting clinical association or longer-term trafficking defects.
  downstream:
  - target: Impaired Intestinal Zinc Absorption
    causal_link_type: DIRECT
  gene:
    preferred_term: SLC39A4
    term:
      id: hgnc:17129
      label: SLC39A4

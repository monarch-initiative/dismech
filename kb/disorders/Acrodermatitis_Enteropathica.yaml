inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Usually caused by pathogenic variants affecting both SLC39A4 alleles, including compound heterozygosity. Molecularly
    unresolved clinical AE should prompt evaluation for missed alleles and acquired or metabolic phenocopies; the
    cited mouse haploinsufficiency experiments do not establish dominant human inheritance.
  evidence:
  - reference: PMID:21165302
    reference_title: Congenital zinc deficiency from mutations of the SLC39A4 gene as the genetic background of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Family study revealed that each of the mutations had been inherited from his parents, compatible with the autosomal recessive inheritance pattern of the disease.
    explanation: Parental segregation supports recessive inheritance in a molecularly characterized family.

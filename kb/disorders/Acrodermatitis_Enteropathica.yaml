diagnosis:
- name: Zinc, alkaline phosphatase, and SLC39A4 sequencing
  description: >-
    Diagnosis rests on a low plasma or serum zinc (interpreted with care, as
    infection and low albumin lower it), a supportive low alkaline phosphatase,
    and biallelic pathogenic SLC39A4 variants on sequencing with
    deletion/duplication analysis. A prompt response to zinc supports the
    diagnosis but does not distinguish inherited from acquired deficiency. The
    main differential is acquired zinc deficiency, especially transient neonatal
    zinc deficiency from low breast-milk zinc caused by maternal SLC30A2 (ZnT2)
    variants.
  evidence:
  - reference: PMID:40584104
    reference_title: "Acrodermatitis enteropathica in the pediatric population: a literature review of real-world studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "mutations in the SLC39A4 gene were confirmed in 32 of these individuals"
    explanation: SLC39A4 sequencing confirms the diagnosis in genetically characterized cases.
histopathology:
- name: Epidermal necrolysis
  description: >-
    Skin biopsy is nonspecific but supportive, typically showing necrolysis of
    the upper epidermis; it is not required for diagnosis.
  evidence:

      snippet: These studies strongly suggest that wasting and lethality in acrodermatitis enteropathica patients reflects the loss-of-function of the intestine zinc transporter ZIP4, which leads to abnormal Paneth cell gene expression, disruption of the intestinal stem cell niche, and diminished function of the intestinal mucosa.

name: Acrodermatitis Enteropathica
creation_date: '2026-10-04T00:00:00Z'
category: Mendelian
synonyms:
- AE
- AEZ
- acrodermatitis enteropathica, zinc deficiency type
- inherited zinc deficiency
- congenital zinc malabsorption
- Danbolt-Closs syndrome
description: >-
  Acrodermatitis enteropathica is an autosomal recessive disorder of intestinal zinc absorption caused by biallelic
  pathogenic SLC39A4 variants affecting the ZIP4 transporter. Reduced zinc uptake produces systemic deficiency and
  can cause periorificial and acral dermatitis, alopecia, diarrhea, and growth impairment. The full triad is not
  obligatory. Clinical onset is often in infancy, including after weaning, and sustained oral zinc replacement is
  the central treatment. Variant studies distinguish impaired ZIP4 trafficking, processing, and transport; intestinal
  knockout models implicate Paneth-cell and epithelial dysfunction, with species and assay limits.
notes: >-
  This entry covers inherited SLC39A4-related zinc malabsorption. Acquired zinc deficiency, maternal SLC30A2-related
  low milk zinc, and acrodermatitis dysmetabolica are differential diagnoses, not molecular subtypes of this entry.
  PMID:40584104 combines inherited, acquired, and metabolic presentations; its pooled clinical frequencies must
  not be interpreted as frequencies in SLC39A4 disease. Its separately reported SLC39A4 treatment subgroup is used
  where available. Mouse and heterologous-cell findings are identified by experimental context.

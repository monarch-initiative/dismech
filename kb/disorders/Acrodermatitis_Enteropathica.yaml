    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "zinc deficiency was observed in 75.9% of the patients."
    explanation: Confirms systemic zinc deficiency as the dominant biochemical finding across pooled AE cases.
  - reference: PMID:22737083
    reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Elemental analyses of small intestine, liver, and pancreas from Zip4-intestine knockout mice revealed that total zinc was dramatically and rapidly decreased in these organs"
    explanation: Intestinal ZIP4 loss rapidly depletes tissue zinc, the model correlate of systemic zinc deficiency.

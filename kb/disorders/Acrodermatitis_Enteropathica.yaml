name: Acrodermatitis Enteropathica
creation_date: "2026-10-04T00:00:00Z"
category: Mendelian
synonyms:
- AE
- AEZ
- acrodermatitis enteropathica, zinc deficiency type
- inherited zinc deficiency
- congenital zinc malabsorption
- Danbolt-Closs syndrome
description: >-
  Acrodermatitis enteropathica is an autosomal recessive inborn error of zinc
  absorption caused by biallelic loss-of-function variants in SLC39A4, which
  encodes the apical enterocyte zinc importer ZIP4. Failure to take up dietary
  zinc at the intestinal brush border produces systemic zinc deficiency, which
  impairs the many zinc-dependent metalloenzymes and zinc-finger transcription
  factors on which rapidly renewing epithelia and immune cells depend. The
  result is the classic triad of periorificial and acral dermatitis, alopecia,
  and diarrhea, together with growth retardation, recurrent infection, and a low
  serum alkaline phosphatase. Onset is typically in infancy, often at weaning
  from breast milk, and the disease is progressive and once frequently fatal;
  lifelong oral zinc supplementation produces rapid and durable remission.
notes: >-
  The pooled phenotype, laboratory, and treatment frequencies cited from
  PMID:40584104 come from a 231-patient pediatric review that mixed inherited
  (SLC39A4 confirmed in 32), acquired, and metabolic-disorder AE, so those
  percentages describe AE broadly and are not specific to the inherited
  SLC39A4 disease this entry is scoped to.

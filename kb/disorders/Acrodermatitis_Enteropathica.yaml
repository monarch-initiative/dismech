- name: ZIP4 Endoplasmic Reticulum Retention
  biological_scale: CELLULAR
  description: Seven disease-associated human ZIP4 extracellular-domain variants were largely retained in the endoplasmic reticulum in transfected HEK293T cells. Parallel studies of purified bat ZIP4 domains suggest destabilization or structural defects as a possible upstream explanation. Immature glycosylation marks mistrafficking; it is not by itself the demonstrated cause of transport loss.
  evidence:
  - reference: PMID:33837739
    reference_title: Zinc transporter mutations linked to acrodermatitis enteropathica disrupt function and cause mistrafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: they failed to traffic to the cell surface and were largely retained in the ER with immature glycosylation.
    explanation: Human ZIP4 variant proteins expressed in HEK293T cells show ER retention.
  downstream:
  - target: Reduced ZIP4 Cell-Surface Abundance
    causal_link_type: DIRECT
    description: Intracellular retention limits availability of the transporter at the cell surface.

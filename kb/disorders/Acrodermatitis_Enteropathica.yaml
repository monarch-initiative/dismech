- name: Impaired ZIP4 Ectodomain Processing
  biological_scale: MOLECULAR
  description: Mouse ZIP4 substitutions corresponding to human AE variants impair the zinc-deficiency-associated cleavage of the extracellular domain in transfected cells. Mouse Q313H and C319Y (human Q303H and C309Y) strongly impaired processing while substantial surface protein remained. This is an experimental regulatory mechanism, not a demonstrated universal defect in patient intestine.
  evidence:
  - reference: PMID:18936158
    reference_title: Novel proteolytic processing of the ectodomain of the zinc transporter ZIP4 (SLC39A4) during zinc deficiency is inhibited by acrodermatitis enteropathica mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: two (C319Y and Q313H) profoundly diminished the accumulation of processed ZIP4
    explanation: Mouse-residue numbering in Hepa-cell assays; processing is distinct from total abundance or transport.
  - reference: PMID:18936158
    reference_title: Novel proteolytic processing of the ectodomain of the zinc transporter ZIP4 (SLC39A4) during zinc deficiency is inhibited by acrodermatitis enteropathica mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: these AE mutations prevent the proper processing of ZIP4 but do not significantly diminish its accumulation at the cell surface in these transfected cells.
    explanation: The cleavage defect was not simply absence of surface protein in this experimental context.
  downstream:
  - target: SLC39A4 (ZIP4) Loss of Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Processing may regulate zinc uptake, but the relative transport efficiency of processed and unprocessed ZIP4 was not resolved.

  description: In the conditional intestinal Zip4 knockout, combined dietary clioquinol and zinc rescued many animals even when supplementation began after severe depletion, whereas either treatment alone was ineffective under those delayed-treatment conditions. This is preclinical rescue evidence, not an established human regimen.
  therapeutic_modality: SMALL_MOLECULE

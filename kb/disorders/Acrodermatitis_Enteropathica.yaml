    explanation: Explicit limitation of phenotype recapitulation.
  - reference: PMID:24015258
    reference_title: Clioquinol synergistically augments rescue by zinc supplementation in a mouse model of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: the rate of cell division in the crypts of the small intestine more than doubled by d13 in mice provided the CQ/Zn diet. The rate of cell division was restored to control levels
    explanation: Functional epithelial readout after experimental rescue.
  notes: The 2012 paper proposes species differences in embryonic nutrient uptake as an explanation for global mouse knockout lethality. It also reports both hypomorphic and complete loss-of-function human alleles; residual function must not be assumed for all patients. Hepatic metal concentrations and AMPK/TORC1 signaling change with time and should not be treated as established human biomarkers.
datasets:
experimental_models:
- name: Human ZIP4 variant expression in HEK293T cells
  experimental_model_type: CELL_LINE
  cell_source: IMMORTALIZED
  publication: PMID:33837739
  description: Transient human ZIP4 expression tests seven AE-associated extracellular-domain variants. Surface antibody labeling, calreticulin colocalization, glycosidase digestion, and zinc uptake distinguish trafficking from activity.
  modeled_mechanisms:
  - target: ZIP4 Endoplasmic Reticulum Retention
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Human variants are retained intracellularly.
    limitations: Heterologous kidney-derived cells with overexpression; not patient intestinal epithelium.
  evidence:
  - reference: PMID:33837739
    reference_title: Zinc transporter mutations linked to acrodermatitis enteropathica disrupt function and cause mistrafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: they failed to traffic to the cell surface and were largely retained in the ER with immature glycosylation.
    explanation: Human ZIP4 variant proteins expressed in HEK293T cells show ER retention.
- name: Mouse ZIP4 variant transport and processing systems
  experimental_model_type: CELL_LINE
  cell_source: IMMORTALIZED
  publication: PMID:31979155
  description: Mouse ZIP4 in HEK293T cells supports short-interval zinc/proton imaging; complementary Hepa, MDCK and CaCo2 experiments examine ectodomain processing. Transporter ortholog, residue numbering, cell line, assay duration, and zinc conditions influence the observed phenotype.
  modeled_mechanisms:
  - target: SLC39A4 (ZIP4) Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Variant-specific uptake defects are measurable, with mouse P200L as a context-dependent counterexample.
    limitations: Mouse protein in heterologous cells is not interchangeable with human ZIP4 in patient enterocytes.
  evidence:
  - reference: PMID:14709598
    reference_title: Acrodermatitis enteropathica mutations affect transport activity, localization and zinc-responsive trafficking of the mouse ZIP4 zinc transporter.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: All mutations decreased 65Zn uptake activity of mZip4, thereby providing a causal link to AE.
    explanation: Six human-disease-associated substitutions were introduced into mouse ZIP4 and tested in cultured cells.
  - reference: PMID:31979155
    reference_title: Elucidating the H(+) Coupled Zn(2+) Transport Mechanism of ZIP4; Implications in Acrodermatitis Enteropathica.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: in our shorter 2 min experiment, Zn2+ transport rates were no different from those of the wild type protein, indicating that catalytic Zn2+ transport was not impaired by this mutation.
    explanation: Mouse P200L retained short-interval catalytic activity. This limits a universal catalytic-loss claim without refuting clinical association or longer-term trafficking defects.
  - reference: PMID:18936158
    reference_title: Novel proteolytic processing of the ectodomain of the zinc transporter ZIP4 (SLC39A4) during zinc deficiency is inhibited by acrodermatitis enteropathica mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: two (C319Y and Q313H) profoundly diminished the accumulation of processed ZIP4
    explanation: Mouse-residue numbering in Hepa-cell assays; processing is distinct from total abundance or transport.

diagnosis:
- name: Zinc, alkaline phosphatase, and SLC39A4 sequencing
  description: >-
    Assess the clinical pattern, plasma or serum zinc, and supportive alkaline phosphatase, then evaluate SLC39A4
    coding exons and splice boundaries with parental segregation when variants are identified. A response to zinc
    demonstrates zinc responsiveness but does not distinguish inherited from acquired deficiency. Persistent dependence
    on zinc and relapse after withdrawal can prompt molecular investigation. An unresolved result may require evaluation
    for structural or regulatory alleles rather than assuming a coding-only assay excludes the disease.
  evidence:
  - reference: PMID:21165302
    reference_title: Congenital zinc deficiency from mutations of the SLC39A4 gene as the genetic background of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Since most SLC39A4 mutations are private and occur in different types and over the entire gene, direct sequencing of all coding exons and flanking intronic sequences is the molecular diagnostic approach of choice in AE.
    explanation: The paper describes broad coding/splice-boundary sequencing; upstream or structural lesions require additional consideration.
  - reference: PMID:21165302
    reference_title: Congenital zinc deficiency from mutations of the SLC39A4 gene as the genetic background of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: His skin lesions relapsed and became aggravated within one month after cessation of the zinc.
    explanation: Recurrence led to genetic investigation in this patient; deliberate treatment withdrawal is not presented as a recommended diagnostic test.
  - reference: PMID:20883266
    reference_title: 'Acrodermatitis enteropathica: a review of 29 Tunisian cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was not a significant relation between zincemia and clinical features.
    explanation: Blood zinc did not track clinical features in the Tunisian cohort.
- name: Distinguish acquired and metabolic phenocopies
  description: Low breast-milk zinc associated with maternal SLC30A2 variants, dietary or gastrointestinal zinc deficiency, and acrodermatitis dysmetabolica can resemble inherited AE. Metabolic presentations may respond to correction of the underlying nutrient imbalance rather than zinc alone.
  evidence:
  - reference: PMID:40584104
    reference_title: 'Acrodermatitis enteropathica in the pediatric population: a literature review of real-world studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: low zinc levels in breast milk are particularly common, which may be partly attributed to mutations in the ZNT2 gene
    explanation: The review distinguishes lactogenic deficiency from intestinal SLC39A4 deficiency.
  - reference: PMID:40584104
    reference_title: 'Acrodermatitis enteropathica in the pediatric population: a literature review of real-world studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: most patients with AE and metabolic disorders recovered by solely addressing their metabolic imbalances
    explanation: Metabolic phenocopies are important differentials, not SLC39A4 subtypes.

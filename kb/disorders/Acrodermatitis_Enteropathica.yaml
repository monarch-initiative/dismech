- name: SLC39A4 Missense Variants
  biological_scale: MOLECULAR
  description: Biallelic disease-associated missense variants alter ZIP4 coding sequence. Different alleles affect folding, surface localization, processing, or transport; a result for one construct must not be generalized to every variant.
  evidence:
  - reference: PMID:12032886
    reference_title: A novel member of a zinc transporter family is defective in acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Distinct homozygous missense mutations were discovered in four kindreds
    explanation: The discovery cohort identified missense changes; the paper separately cautions that P84L was also found in controls and was not established as causal.
  downstream:

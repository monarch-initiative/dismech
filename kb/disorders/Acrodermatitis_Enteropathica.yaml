    quote_role: PRIMARY_RESULT
    snippet: His plasma zinc level was 18.8 µg/dL (normal 66-110 µg/dL).
    explanation: Low plasma zinc in a child with two segregating SLC39A4 variants.
  - reference: PMID:22737083
    reference_title: 'A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT

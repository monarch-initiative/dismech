- name: Systemic Zinc Deficiency
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    Reduced intestinal zinc absorption depletes tissue zinc and commonly lowers plasma zinc. Blood concentrations
    are an imperfect indicator of tissue status and do not determine phenotype severity.

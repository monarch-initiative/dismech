treatments:
- name: Zinc Supplementation
  description: >-
    Lifelong oral elemental zinc (given as the sulfate, gluconate, or acetate
    salt) corrects the deficiency and reverses the clinical features, with
    1-3 mg/kg/day the most commonly used effective dose. Excess zinc can cause
    copper deficiency, so copper is monitored.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zinc sulfate
      term:
        id: CHEBI:35176
        label: zinc sulfate
  evidence:
  - reference: PMID:40584104
    reference_title: "Acrodermatitis enteropathica in the pediatric population: a literature review of real-world studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Among the 174 AE patients who received zinc supplementation at various dosages, 159 (91.4%) demonstrated therapeutic efficacy, with 1-3 mg/kg/day as the most commonly used effective dosage."
    explanation: Quantifies the high therapeutic response to zinc supplementation and the usual effective dose.
animal_models:
- name: Intestine-specific Zip4 knockout mouse
  species: Mouse
  genotype: villin-ErtCre; Slc39a4 (Zip4) floxed, tamoxifen-induced enterocyte knockout
  publication: PMID:22737083
  description: >-
    A tamoxifen-inducible, enterocyte-specific Slc39a4 (Zip4) knockout that
    reproduces the zinc-malabsorption phenotype of AE.
  modeled_mechanisms:
  - target: Systemic Zinc Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Intestinal ZIP4 loss rapidly depletes tissue zinc and causes wasting and
      death unless excess dietary zinc is supplied.
    limitations: >-
      The global Zip4 knockout is embryonic lethal, unlike human AE where
      residual function is retained, and the intestine-specific model is an
      acute, complete-loss model that does not reproduce the skin phenotype.
    readouts:
    - name: Total tissue zinc
      target: Systemic Zinc Deficiency
      direction: DECREASED
      interpretation: Elemental analysis shows rapid zinc depletion in intestine, liver, and pancreas.
      evidence:
      - reference: PMID:22737083
        reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Elemental analyses of small intestine, liver, and pancreas from Zip4-intestine knockout mice revealed that total zinc was dramatically and rapidly decreased in these organs"
        explanation: Measures the tissue zinc depletion that defines the model.
    evidence:
    - reference: PMID:22737083
      reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We created a tamoxifen-inducible, enterocyte-specific knockout of this gene in mice which mimics this human disorder."
      explanation: Establishes the model as informative for the zinc-deficiency mechanism of AE.
  - target: Intestinal Epithelial Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The knockout reprograms Paneth cells and disrupts the intestinal stem
      cell niche and mucosal integrity.
    limitations: >-
      An acute, complete-loss intestinal model rather than the chronic
      partial-loss state of most human patients.
    readouts:
    - name: Paneth cell reprogramming
      target: Intestinal Epithelial Dysfunction
      direction: ALTERED
      interpretation: Loss of Paneth cell labile zinc with downstream stem-niche disruption.
      evidence:
      - reference: PMID:22737083
        reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "An initial effect of the knockout was the reprogramming of Paneth cells, which contribute to the intestinal stem cell niche in the crypts."
        explanation: Measures the Paneth cell and stem-niche disruption in the model.
    evidence:
    - reference: PMID:22737083
      reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "These studies strongly suggest that wasting and lethality in acrodermatitis enteropathica patients reflects the loss-of-function of the intestine zinc transporter ZIP4, which leads to abnormal Paneth cell gene expression, disruption of the intestinal stem cell niche, and diminished function of the intestinal mucosa."
      explanation: Links intestinal ZIP4 loss to Paneth cell and stem-niche dysfunction as the basis of the phenotype.

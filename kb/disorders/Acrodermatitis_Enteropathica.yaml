    reference_title: "Acrodermatitis enteropathica in the pediatric population: a literature review of real-world studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Staphylococcus aureus was the most common pathogen, identified in 18 patients (51.4%), followed by Candida albicans in 8 patients (22.9%)."
    explanation: S. aureus and Candida are the organisms most often cultured from the swab-positive AE skin lesions, indicating secondary cutaneous superinfection.

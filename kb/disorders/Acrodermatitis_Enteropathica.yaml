- name: Impaired Zinc-Dependent Enzyme and Zinc-Finger Function
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Zinc is a catalytic or structural cofactor for hundreds of metalloenzymes
    and zinc-finger transcription factors. Its depletion impairs rapidly
    renewing epithelia (skin, hair follicle) and immune cells most acutely,
    producing the cutaneous and immune features of the disease.
  evidence:
  - reference: PMID:12032886
    reference_title: "A novel member of a zinc transporter family is defective in acrodermatitis enteropathica."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "Zinc is an essential and versatile element, utilized by proteins as diverse as metalloenzymes and transcription factors."
    explanation: Zinc is a cofactor for metalloenzymes and zinc-finger transcription factors, whose function fails as zinc is depleted.
  downstream:
  - target: Periorificial and Acral Dermatitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Alopecia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cutaneous Bacterial and Fungal Superinfection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Intestinal Epithelial Dysfunction
  role: effector
  biological_scale: TISSUE
  description: >-
    Zinc depletion reprograms Paneth cells and disrupts the intestinal stem cell
    niche, degrading the integrity of the absorptive epithelium; in the mouse
    model this drives the wasting phenotype and is the correlate of the diarrhea
    and malabsorption seen in patients.
  cell_types:
  - preferred_term: Paneth cell
    term:
      id: CL:0000510
      label: paneth cell
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:22737083
    reference_title: "A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "An initial effect of the knockout was the reprogramming of Paneth cells, which contribute to the intestinal stem cell niche in the crypts."
    explanation: Intestinal ZIP4 loss reprograms Paneth cells and disrupts the stem cell niche.
  downstream:
  - target: Diarrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Cutaneous Bacterial and Fungal Superinfection
  role: consequence
  biological_scale: TISSUE
  description: >-
    The eroded, barrier-disrupted skin lesions are secondarily infected by
    bacteria and fungi, most often Staphylococcus aureus and Candida.
  evidence:

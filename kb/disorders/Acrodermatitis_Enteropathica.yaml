treatments:
- name: Zinc Supplementation
  description: >-
    Sustained oral zinc replacement is the central treatment. The 2025 literature review separately reports improvement
    in 29 of 30 supplemented patients with SLC39A4 mutations, including one nonresponder who died. Among those treated,
    12 received 1-3 mg/kg/day and six received more than 3 mg/kg/day; the remaining doses were not weight-adjusted
    or not recorded. These heterogeneous case reports do not establish an optimal dose. Zinc and copper monitoring
    accompany long-term replacement.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral zinc replacement

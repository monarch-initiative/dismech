    reference_title: Clioquinol synergistically augments rescue by zinc supplementation in a mouse model of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: By 8 days after initiation of the knockout neither dietary CQ nor zinc supplementation in the drinking water was found to be effective at improving this phenotype. In contrast, dietary CQ in conjunction with zinc supplementation was highly effective.
    explanation: Delayed-treatment comparison in intestinal knockout mice.
  - reference: PMID:24015258
    reference_title: Clioquinol synergistically augments rescue by zinc supplementation in a mouse model of acrodermatitis enteropathica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Dietary CQ with zinc supplementation rapidly restored intestine stem cell division and differentiation of secretory and the absorptive cells.
    explanation: Experimental epithelial rescue.
  notes: The report describes incomplete rescue and apparent blindness in some nonthriving treated knockout mice. Historical use of related hydroxyquinolines and neurotoxicity concerns do not establish present clinical safety; the authors could not separate every contribution of severe zinc deficiency and drug exposure.

  notes: The intervention is therapeutic mineral replacement for inherited malabsorption, bound to Pharmacotherapy with specific zinc agents. A nutritional-supplement product term would not describe the clinical action. The mechanism permitting high-dose uptake without ZIP4 is incompletely defined.

  - reference: PMID:22737083
    reference_title: 'A mouse model of acrodermatitis enteropathica: loss of intestine zinc transporter ZIP4 (Slc39a4) disrupts the stem cell niche and intestine integrity.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Labile zinc in Paneth cells was lost, followed by diminished Sox9 (sex determining region Y-box 9) and lysozyme expression, and accumulation of mucin, which is normally found in goblet cells.
    explanation: Mouse intestinal knockout findings; not a molecular assay of patient Paneth cells.
  downstream:

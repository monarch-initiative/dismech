    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: ZP1 staining was lost by day 2 after initiation of the knockout and remained undetectable in the Paneth cells on day 4.
    explanation: The zinc-sensitive fluorescent signal was lost before later Paneth-cell morphological changes.
  downstream:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous nonsense mutation (NM_006651:c.G322T:p.E108X) in the CPLX1
      gene in two female siblings, BAB6167 and BAB6168, who presented with malignant migrating
      epilepsy and cortical atrophy.
    explanation: The 2015 sibling pair had homozygous p.Glu108Ter, migrating epilepsy and cortical atrophy.
pathophysiology:
- name: Complexin-1 Loss of Function
  description: >-
    C-terminal truncating CPLX1 variants are predicted to impair complexin-1 function. Complete
    protein absence, nonsense-mediated decay and the effects of the reported missense alleles
    have not been demonstrated in patient material. Complexin binds SNAREs, while C-terminal
    membrane interactions are supported by nonhuman recombinant and worm studies. Loss of
    SNARE binding itself is not established for the patient C-terminal alleles.

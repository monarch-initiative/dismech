- discussion_id: gap_cplx1_mouse_model_fidelity_to_human_encephalopathy
  prompt: >-
    How faithfully does the Cplx1-knockout mouse — dominated by ataxia and a
    movement phenotype with variable seizures — model the human CPLX1 epileptic
    encephalopathy, versus mainly recapitulating the motor arm of the disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Hyperexcitability and Seizures
  rationale: >-
    The principal in vivo evidence for CPLX1 loss is the Cplx1-knockout mouse,
    whose most striking, earliest phenotype is ataxia (a cerebellar/motor
    feature) rather than the severe cortical epileptic encephalopathy that
    defines the human disorder. This is a translational-fidelity mismatch: the
    model clearly demonstrates that complexin-1 loss is neurologically
    catastrophic, but whether it reproduces the human seizure/cortical
    phenotype — as opposed to a predominantly movement phenotype — is the open
    question, so its evidence weight for the seizure node should be qualified.
  evidence:
  - reference: PMID:28422131
    reference_title: "Variants in CPLX1 in two families with autosomal-recessive severe infantile myoclonic epilepsy and ID."

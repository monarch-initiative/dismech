    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We knocked down complexin expression in cultured cortical neurons using an shRNA that
      targets both complexin-1 and -2, the only complexin isoforms significantly expressed
      in these neurons
    explanation: This is dual complexin-1/2 knockdown in mouse neuronal culture, not a patient-variant experiment.
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The complexin knock-down increased 3-4 fold the frequency of spontaneous miniature excitatory
      postsynaptic currents (mEPSCs), without altering the mEPSC amplitude
    explanation: Spontaneous release increased in the dual-knockdown cortical culture.
  biological_processes:

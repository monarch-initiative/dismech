name: CPLX1-Related Developmental and Epileptic Encephalopathy
creation_date: '2026-07-06T00:00:00Z'
description: >-
  An autosomal recessive developmental and epileptic encephalopathy associated with biallelic
  CPLX1 variants. Complexin-1 regulates presynaptic SNARE-mediated neurotransmitter release.
  Founding reports described C-terminal truncating variants in two sibling pairs and p.Leu128Met
  in a third family; the missense allele remains disputed. Clinical findings include severe
  developmental impairment, hypotonia and drug-resistant myoclonic epilepsy, with overt seizure
  onset ranging from early infancy to two years in the 2017 series. Structural brain findings
  are variable. Experimental complexin depletion impairs evoked release, but spontaneous and
  asynchronous release effects depend on the model; the intervening human circuit mechanism
  remains unresolved.
category: Mendelian
parents:

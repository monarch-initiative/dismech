  - reference: DOI:10.1007/s13577-023-01016-z
    reference_title: >-
      Generation of iPSC lines (KAIMRCi003A, KAIMRCi003B) from a Saudi patient with Dravet
      syndrome carrying homozygous mutation in the CPLX1 gene and heterozygous mutation in
      SCN9A
    supports: SUPPORT
    evidence_source: IN_VITRO

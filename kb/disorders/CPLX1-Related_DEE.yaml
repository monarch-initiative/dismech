- name: Dysregulated SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    Complexin-1 is a key regulator of the SNARE fusion machine: it clamps the
    assembled SNARE complex to prevent premature vesicle fusion and, together with
    synaptotagmin-1, synchronizes calcium-triggered release. Loss of complexin-1
    dysregulates calcium-triggered SNARE-mediated fusion, degrading the temporal
    control of neurotransmitter release. This is the module's key conformance
    target — the fusion-machinery arm, here at the level of the SNARE-complex
    regulator rather than a SNARE subunit.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

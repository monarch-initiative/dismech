      snippet: >-
        WES detected the homozygous nonsense variant chr4:g.786591G>T (GRCh38/hg38); NM_006651.2:c.315C>A;
        NP_006642.1:p.(Cys105Ter) in Exon 4 of CPLX1 in the affected sisters. The unaffected
        parents were found to be heterozygous for this variant.
      explanation: >-

differential_diagnoses:
- name: Other causes of epilepsy of infancy with migrating focal seizures
  description: >-
    Migrating seizures of infancy are genetically heterogeneous (e.g. KCNT1,
    SCN2A); CPLX1 disease is distinguished by biallelic loss-of-function variants
    and the recessive inheritance.
  distinguishing_features:
  - Biallelic CPLX1 loss-of-function variants favor this disorder.
  - A variant in another migrating-seizure gene (e.g. KCNT1) favors that diagnosis.
  evidence:
  - reference: PMID:35715422
    reference_title: "Analysis of clinical phenotypic and genotypic spectra in 36 children patients with Epilepsy of Infancy with Migrating Focal Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      17/36 cases had causative variants across 11 genes, including 6 novel EIMFS
      genes: PCDH19, ALDH7A1, DOCK6, PRRT2, ALG1 and ATP7A.
    explanation: >-
      Documents the genetic heterogeneity of migrating focal seizures of infancy,
      which is why molecular testing is required to separate these causes from
      CPLX1 disease.
- name: Other synaptic vesicle cycle disorders
  description: >-
    Other synaptic vesicle cycle / SNAREopathy disorders (STXBP1, SNAP25, STX1B,
    VAMP2, SYT1) overlap through early-onset epilepsy and developmental impairment
    and are distinguished by molecular testing.
  distinguishing_features:
  - Biallelic CPLX1 loss-of-function variants favor this disorder.
  - A variant in another vesicle-cycle gene favors the corresponding disorder.
  evidence:
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human pathogenic mutations have now been reported for all eight core
      components, but patients are diagnosed with very different
      neurodevelopmental syndromes.
    explanation: >-
      Mutations across the fusion machinery produce overlapping but distinct
      neurodevelopmental syndromes, which is the basis for keeping these
      disorders on the differential and resolving them by gene.

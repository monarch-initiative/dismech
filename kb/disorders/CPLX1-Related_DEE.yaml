differential_diagnoses:
- name: Other causes of epilepsy of infancy with migrating focal seizures
  description: >-
    Migrating seizures of infancy are genetically heterogeneous (e.g. KCNT1, SCN2A); CPLX1
    disease is distinguished by biallelic pathogenic CPLX1 variants and the recessive inheritance.
  distinguishing_features:
  - Biallelic pathogenic CPLX1 variants favor this disorder.
  - A variant in another migrating-seizure gene (e.g. KCNT1) favors that diagnosis.
  evidence:
  - reference: PMID:35715422
    reference_title: >-
      Analysis of clinical phenotypic and genotypic spectra in 36 children patients with Epilepsy
      of Infancy with Migrating Focal Seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      17/36 cases had causative variants across 11 genes, including 6 novel EIMFS genes: PCDH19,
      ALDH7A1, DOCK6, PRRT2, ALG1 and ATP7A.
    explanation: >-
      Documents the genetic heterogeneity of migrating focal seizures of infancy, which is
      why molecular testing is required to separate these causes from CPLX1 disease.
- name: Other synaptic vesicle cycle disorders
  description: >-
    Other synaptic vesicle cycle / SNAREopathy disorders (STXBP1, SNAP25, STX1B, VAMP2, SYT1)
    overlap through early-onset epilepsy and developmental impairment and are distinguished
    by molecular testing.
  distinguishing_features:
  - Biallelic pathogenic CPLX1 variants favor this disorder.
  - A variant in another vesicle-cycle gene favors the corresponding disorder.
  evidence:
  - reference: PMID:32559416
    reference_title: 'SNAREopathies: Diversity in Mechanisms and Symptoms.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human pathogenic mutations have now been reported for all eight core components, but
      patients are diagnosed with very different neurodevelopmental syndromes.
    explanation: >-
      Establishes that every core component of the fusion machine carries pathogenic human
      variants presenting as distinct neurodevelopmental syndromes, which is why these disorders
      sit on the differential for each other and are separated by molecular testing.
animal_models:
- name: 'Cplx1 knockout mouse: brain anatomy'
  species: Mouse (Mus musculus)
  genotype: Homozygous Cplx1 knockout
  description: >-
    Cplx1 knockout mice show early ataxia, selective thalamic and cerebellar volume loss, molecular-layer
    atrophy and loss of granule cells in selected cerebellar lobules. The structural phenotype was nonprogressive
    across the sampled ages. Neuronal loss was not detected in the molecular layer. These anatomical findings
    are not uniform human disease features.
  modeled_mechanisms:
  - target: Complexin-1 Loss of Function
    relationship: PERTURBS
    description: Genetic deletion permits assessment of the neurological consequences of complexin-1 loss.
    fidelity: UNKNOWN
    limitations: >-
      Whole-gene mouse knockout differs from human C-terminal and missense alleles; anatomy
      does not establish the human seizure mechanism.
    evidence:
    - reference: PMID:22393426
      reference_title: Tensor-based morphometry and stereology reveal brain pathology in the complexin1 knockout mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, stereology was used to show that there was loss of cerebellar granule cells
        in Cplx1(-/-) mice when compared to Cplx1(+/+) animals.
      explanation: >-
        The primary study reports granule-cell loss; its negative neuronal-loss result is
        restricted to the molecular layer.

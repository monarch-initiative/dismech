- name: 'Cplx1 knockout mouse: calyx of Held'
  species: Mouse (Mus musculus)
  genotype: Homozygous Cplx1 knockout
  description: >-
    Acute brainstem slices reveal developmentally worsening loss of evoked and resting spontaneous
    transmission, but excessive poststimulus asynchronous release. Calcium influx, readily
    releasable pool size and quantal size were preserved. Elevated extracellular calcium rescued
    aspects of evoked release experimentally but is not a tested human therapy.
  modeled_mechanisms:
  - target: Reduced Evoked Synaptic Vesicle Release
    relationship: MEASURES
    description: Evoked EPSCs are reduced after maturation.
    fidelity: UNKNOWN
    limitations: Patient-variant neuronal physiology has not been established.
    evidence:
    - reference: PMID:26019341
      reference_title: >-
        Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
        at the mouse calyx of held synapse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx
        of Held synapse, and discovered a developmentally exacerbating phenotype of reduced
        spontaneous and evoked transmission but excessive asynchronous release after stimulation,
        compatible with combined facilitating and clamping functions of Cplx1.
      explanation: >-
        Single-Cplx1 knockout reduces evoked transmission at the mouse calyx of Held. This is a native
        synapse model, not a measurement in affected children.
  - target: Excessive Poststimulus Asynchronous Release
    relationship: MEASURES
    description: Delayed asynchronous release is increased after stimulation.
    fidelity: UNKNOWN
    limitations: Patient-variant neuronal physiology has not been established.
    evidence:
    - reference: PMID:26019341
      reference_title: >-
        Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
        at the mouse calyx of held synapse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx
        of Held synapse, and discovered a developmentally exacerbating phenotype of reduced
        spontaneous and evoked transmission but excessive asynchronous release after stimulation,
        compatible with combined facilitating and clamping functions of Cplx1.
      explanation: >-
        Single-Cplx1 knockout increases asynchronous transmitter release after stimulation at the mouse
        calyx of Held, while reducing resting spontaneous and evoked transmission.
  - target: Mistimed Postsynaptic Firing in the Calyx Model
    relationship: MEASURES
    description: Asynchronous release triggers aberrant postsynaptic action potentials.
    fidelity: UNKNOWN
    limitations: Patient-variant neuronal physiology has not been established.
    evidence:
    - reference: PMID:26019341
      reference_title: >-
        Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
        at the mouse calyx of held synapse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found further that the excessive asynchronous release in Cplx1-deficient calyces
        triggered aberrant action potentials in their target neurons, and slowed-down the
        recovery of EPSCs after depleting stimuli.
      explanation: >-
        Excess delayed release causes mistimed postsynaptic firing in this model; a human
        cortical mechanism is not established.

discussions:
- discussion_id: gap_cplx1_clamp_versus_facilitator_dominant_lesion
  prompt: >-
    Complexin-1 both clamps spontaneous vesicle fusion and facilitates fast
    calcium-evoked release; which arm of this dual function, when lost in CPLX1
    disease, dominates the pathogenic synaptic defect — disinhibited spontaneous
    release, failed evoked release, or both?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated SNARE-Mediated Vesicle Fusion
  rationale: >-
    Complexin's dual clamp/facilitator function means CPLX1 loss can degrade
    synaptic transmission by two mechanistically opposite routes: unclamping
    spontaneous (calcium-independent) fusion, and abolishing the synchronized
    calcium-triggered evoked release. These have different predicted circuit
    consequences (tonic noise versus loss of phasic drive), so which
    predominates in human CPLX1-null neurons is unresolved and bears directly on
    how the "dysregulated fusion" node should be interpreted and, ultimately, on
    rational therapy.
  evidence:
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      complexin simultaneously suppressed spontaneous fusion and activated fast
      calcium ion-evoked fusion
    explanation: >-
      Establishes complexin's dual clamp (suppresses spontaneous) and
      facilitator (activates evoked) function, the two arms whose relative
      contribution to CPLX1 disease is the open question.
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuronal SNAREs and their key regulators together drive synaptic vesicle
      exocytosis and synaptic transmission as a single integrated membrane
      fusion machine.
    explanation: >-
      Frames complexin-1 as a key SNARE regulator within the fusion machine,
      whose specific loss-of-function mode is unresolved.
  proposed_experiments:
  - experiment_id: exp_cplx1_spontaneous_versus_evoked_release_dissection
    name: CPLX1-null human neuron spontaneous-versus-evoked release dissection
    description: >-
      In CPLX1-null human iPSC-derived neurons, quantify spontaneous
      (miniature) release frequency and fast calcium-evoked release amplitude,
      then rescue with wild-type complexin-1 versus separation-of-function
      mutants that selectively restore clamping or facilitation, to attribute
      the pathogenic defect to a specific arm.
    experiment_type:
      preferred_term: electrophysiological release-mode dissection experiment
    perturbations:
    - name: CPLX1 knockout and separation-of-function rescue
      target: pathophysiology#Dysregulated SNARE-Mediated Vesicle Fusion
      genes:
      - preferred_term: CPLX1
        term:
          id: hgnc:2309
          label: CPLX1
      description: >-
        Compare CPLX1-null neurons rescued with wild-type complexin-1 versus
        clamp-selective or facilitation-selective complexin-1 variants.
    readouts:
    - name: Spontaneous and evoked release readouts
      target: pathophysiology#Dysregulated SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DYSREGULATED
      - preferred_term: calcium-dependent activation of synaptic vesicle fusion
        term:
          id: GO:0099502
          label: calcium-dependent activation of synaptic vesicle fusion
        modifier: DYSREGULATED
      assays:
      - preferred_term: patch-clamp electrophysiology
      direction: POSITIVE
    controls:
    - name: Wild-type complexin-1 rescue
      description: CPLX1-null neurons rescued with wild-type human complexin-1.
    - name: Isogenic wild-type neurons
      description: Isogenic CPLX1-intact neurons from the same iPSC background.
    decision_criterion: >-
      The clamp arm dominates if the pathogenic defect is a selective rise in
      spontaneous release rescued only by clamp-competent complexin-1; the
      facilitator arm dominates if the defect is a selective loss of evoked
      release rescued only by facilitation-competent complexin-1.
    would_support:
    - pathophysiology#Dysregulated SNARE-Mediated Vesicle Fusion
- discussion_id: gap_cplx1_phenotype_boundary_dee_versus_neurodegeneration
  prompt: >-
    Is biallelic CPLX1 loss best defined as a developmental and epileptic
    encephalopathy, as a progressive neurodegenerative/movement disorder, or as
    a single spectrum encompassing both — and what determines which phenotype
    predominates in a given patient?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Complexin-1 Loss of Function
  - pathophysiology#Cortical Hyperexcitability and Seizures
  rationale: >-
    Reported CPLX1-null individuals show a complex and variable phenotype
    spanning severe infantile epileptic encephalopathy, developmental
    impairment, structural brain changes, and (in the mouse) prominent
    ataxia/movement features. Whether the human disorder is fundamentally an
    epileptic encephalopathy, a neurodegenerative/movement disorder, or a
    unified spectrum is a genuine phenotype-definition (lump/split) gap that is
    currently unresolvable from the small published cohort and affects how this
    entry's boundaries and downstream nodes should be drawn.
  evidence:
  - reference: PMID:28422131
    reference_title: "Variants in CPLX1 in two families with autosomal-recessive severe infantile myoclonic epilepsy and ID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss of complexin 1 function may lead to a complex but variable clinical
      phenotype
    explanation: >-
      The reporting authors explicitly flag phenotypic variability, motivating
      the phenotype-definition gap.
  - reference: PMID:28422131
    reference_title: "Variants in CPLX1 in two families with autosomal-recessive severe infantile myoclonic epilepsy and ID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All displayed marked developmental delay and migrating myoclonic epilepsy,
      and one showed a cerebellar cleft in addition.
    explanation: >-
      Documents the mixed epileptic, developmental, and structural/cerebellar
      features underlying the lump/split question.
  proposed_experiments:
  - experiment_id: exp_cplx1_natural_history_genotype_phenotype_cohort
    name: CPLX1 natural-history and genotype-phenotype cohort
    description: >-
      Assemble an international cohort of biallelic CPLX1 cases with
      standardized longitudinal phenotyping (seizure semiology and course,
      motor/movement features, developmental trajectory, and serial
      neuroimaging) to test whether epileptic and neurodegenerative/movement
      features co-segregate or define distinct subgroups, and whether variant
      class predicts phenotype.
    experiment_type:
      preferred_term: natural-history cohort study
    readouts:
    - name: Longitudinal phenotype and course readouts
      target: pathophysiology#Cortical Hyperexcitability and Seizures
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL

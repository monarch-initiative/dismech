notes: >-
  The 2015 and 2017 reports together describe five individuals from three families; this is
  a historical series count, not a population prevalence estimate. Additional iPSC lines were
  reported from one patient carrying homozygous CPLX1 p.Glu2Lys together with a heterozygous
  SCN9A deletion, without establishing the separate causal contributions. Findings confined
  to the p.Leu128Met patient require caution because of conflicting variant interpretations
  and substantial prematurity.

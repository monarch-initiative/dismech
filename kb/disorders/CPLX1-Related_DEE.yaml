discussions:
- discussion_id: gap_cplx1_clamp_versus_facilitator_dominant_lesion
  prompt: >-
    Complexin-1 both clamps spontaneous vesicle fusion and facilitates fast calcium-evoked
    release; which arm of this dual function, when lost in CPLX1 disease, dominates the pathogenic
    synaptic defect — disinhibited spontaneous release, failed evoked release, or both?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Evoked Synaptic Vesicle Release
  rationale: >-
    Evoked-release impairment is shared across dual-knockdown cortical cultures and single-knockout
    calyces, whereas resting spontaneous release changes in opposite directions. Poststimulus
    asynchronous release is a separate defect. The dominant lesion in patient-variant human
    neurons and its contribution to epilepsy remain unresolved. Available p.Glu2Lys iPSCs
    also carry an SCN9A deletion and have not yet supplied neuronal functional data.
  evidence:
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the complexin knock-down decreased 3-4 fold the amplitude of excitatory
      postsynaptic currents (EPSCs) evoked by isolated action potentials
    explanation: Evoked release was reduced in the dual-knockdown cortical culture.
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The complexin knock-down increased 3-4 fold the frequency of spontaneous miniature excitatory
      postsynaptic currents (mEPSCs), without altering the mEPSC amplitude
    explanation: Spontaneous release increased in the dual-knockdown cortical culture.
  - reference: PMID:26019341
    reference_title: >-
      Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
      at the mouse calyx of held synapse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx of
      Held synapse, and discovered a developmentally exacerbating phenotype of reduced spontaneous
      and evoked transmission but excessive asynchronous release after stimulation, compatible

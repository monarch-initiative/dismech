- name: Reduced Evoked Synaptic Vesicle Release
  description: >-
    Evoked synaptic release is reduced after dual complexin-1/2 knockdown in cultured cortical
    neurons and after single Cplx1 knockout at mature mouse calyces of Held. The calyx study
    found preserved calcium influx, readily releasable pool size and quantal size; increased
    EGTA sensitivity supports looser calcium-channel/vesicle coupling as a contributing inference.
    These are experimental findings, not measurements in affected children.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the complexin knock-down decreased 3-4 fold the amplitude of excitatory
      postsynaptic currents (EPSCs) evoked by isolated action potentials
    explanation: Evoked release was reduced in the dual-knockdown cortical culture.
  - reference: PMID:26019341
    reference_title: >-
      Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
      at the mouse calyx of held synapse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx of
      Held synapse, and discovered a developmentally exacerbating phenotype of reduced spontaneous
      and evoked transmission but excessive asynchronous release after stimulation, compatible
      with combined facilitating and clamping functions of Cplx1.
    explanation: >-
      Single-Cplx1 knockout reduces evoked transmission at the mouse calyx of Held. This is a native synapse
      model, not a measurement in affected children.
  biological_processes:
  - preferred_term: calcium-dependent activation of synaptic vesicle fusion
    term:
      id: GO:0099502
      label: calcium-dependent activation of synaptic vesicle fusion
    modifier: DECREASED
  - preferred_term: synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  role: central_effector
  conforms_to: synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
- name: Increased Spontaneous Release in Dual-Knockdown Cortical Neurons
  description: >-
    Spontaneous miniature EPSC frequency increases in cultured mouse cortical neurons depleted
    of both complexin-1 and complexin-2, with unchanged miniature amplitude. This direction
    is specific to this preparation: resting spontaneous transmission decreases in single-Cplx1-knockout
    calyces of Held.
  cell_types:

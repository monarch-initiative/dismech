- name: Epileptiform Brain Activity
  description: >-
    Generalized epileptiform EEG activity was documented in the 2017 cases. In patient 3,
    persistent abnormal EEG activity preceded overt clinical seizures. These observations
    establish abnormal brain activity without identifying a specific excitatory/inhibitory
    imbalance.

  - reference: PMID:25229806
    reference_title: Membrane curvature sensing by the C-terminal domain of complexin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that complexin's CTD is highly sensitive to membrane curvature, which it
      senses via tandem motifs, a C-terminal motif containing a mix of bulky hydrophobic and
      positively charged residues, and an adjacent amphipathic region that can bind membranes
      in either a disordered or a helical conformation.
    explanation: >-
      Recombinant complexin/liposome experiments support a membrane-binding role for the C
      terminus, not direct functional validation of the human alleles.
  - reference: PMID:19164751
    reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both changes were rescued by wild-type but not by 4M-mutant complexin, confirming the
      specificity of the shRNA and the importance of SNARE binding.
    explanation: Wild-type rat complexin-1 rescued both release defects; the engineered SNARE-binding-deficient mutant failed.

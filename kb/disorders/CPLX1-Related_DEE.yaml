- discussion_id: gap_cplx1_mouse_model_fidelity_to_human_encephalopathy
  prompt: >-
    How faithfully does the Cplx1-knockout mouse — dominated by ataxia and a movement phenotype
    with variable seizures — model the human CPLX1 epileptic encephalopathy, versus mainly
    recapitulating the motor arm of the disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Epileptiform Brain Activity
  rationale: >-
    Cplx1 knockout produces prominent mouse motor and cerebellar abnormalities, and native
    calyx experiments demonstrate disrupted release timing. Correspondence to the human cortical
    seizure mechanism remains unknown. Neither whole-gene knockout nor dual-isoform knockdown
    directly models the function of the reported human C-terminal or missense alleles.
  evidence:
  - reference: PMID:22393426
    reference_title: Tensor-based morphometry and stereology reveal brain pathology in the complexin1 knockout mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, stereology was used to show that there was loss of cerebellar granule cells
      in Cplx1(-/-) mice when compared to Cplx1(+/+) animals.
    explanation: >-
      The primary study reports granule-cell loss; its negative neuronal-loss result is restricted
      to the molecular layer.
  - reference: PMID:26019341
    reference_title: >-
      Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
      at the mouse calyx of held synapse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx of
      Held synapse, and discovered a developmentally exacerbating phenotype of reduced spontaneous
      and evoked transmission but excessive asynchronous release after stimulation, compatible
      with combined facilitating and clamping functions of Cplx1.
    explanation: >-
      Single-gene knockout at a native auditory brainstem synapse reduces resting spontaneous
      release, unlike dual-knockdown cortical cultures.
  proposed_experiments:
  - experiment_id: exp_cplx1_cross_species_network_excitability_comparison
    name: CPLX1 cross-species network-excitability comparison
    description: >-
      Directly compare cortical network excitability and seizure-like activity between Cplx1-knockout
      mouse cortical preparations and human CPLX1-null iPSC-derived cortical neurons/organoids,
      to test whether the human cortical hyperexcitability phenotype is reproduced by the
      mouse or is human-specific.
    experiment_type:
      preferred_term: cross-species network-excitability comparison
    perturbations:
    - name: CPLX1 loss of function across species
      target: pathophysiology#Epileptiform Brain Activity
      genes:
      - preferred_term: CPLX1
        term:
          id: hgnc:2309
          label: CPLX1
      description: Cplx1-knockout mouse cortex versus isogenic human CPLX1-null cortical neurons/organoids.
    readouts:
    - name: Network hyperexcitability readouts
      target: pathophysiology#Epileptiform Brain Activity
      biological_processes:
      - preferred_term: trans-synaptic signaling
        term:
          id: GO:0099537
          label: trans-synaptic signaling
        modifier: DYSREGULATED
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
      assays:
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Isogenic wild-type human neurons
      description: CPLX1-intact human neurons from the same iPSC background.
    - name: Wild-type mouse cortex
      description: Cplx1 wild-type littermate cortical preparations.
    decision_criterion: >-
      The mouse is a faithful model of the human seizure phenotype if Cplx1-null mouse cortex
      shows network hyperexcitability matching human CPLX1-null cortical neurons; a human-specific
      cortical phenotype is supported if hyperexcitability appears in human but not mouse
      preparations.
    would_support:
    - pathophysiology#Epileptiform Brain Activity

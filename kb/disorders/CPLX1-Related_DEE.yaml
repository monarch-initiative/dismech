      label: synaptic vesicle exocytosis
    modifier: INCREASED
- name: Excessive Poststimulus Asynchronous Release
  description: >-
    Single-Cplx1-knockout calyces of Held exhibit excessive delayed asynchronous transmitter
    release following stimulation. This is distinct from resting spontaneous release, which
    is reduced in the same preparation. The proposed instability of newly recruited vesicles
    is a mechanistic interpretation.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26019341
    reference_title: >-
      Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
      at the mouse calyx of held synapse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We therefore studied consequences of genetic ablation of Cplx1 in the mouse calyx of
      Held synapse, and discovered a developmentally exacerbating phenotype of reduced spontaneous
      and evoked transmission but excessive asynchronous release after stimulation, compatible
      with combined facilitating and clamping functions of Cplx1.
    explanation: >-
      Single-Cplx1 knockout increases asynchronous transmitter release after stimulation at the mouse
      calyx of Held, while reducing resting spontaneous and evoked transmission.
  - reference: PMID:26019341
    reference_title: >-
      Complexin stabilizes newly primed synaptic vesicles and prevents their premature fusion
      at the mouse calyx of held synapse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found further that the excessive asynchronous release in Cplx1-deficient calyces
      triggered aberrant action potentials in their target neurons, and slowed-down the recovery
      of EPSCs after depleting stimuli.
    explanation: >-
      Excess delayed release causes mistimed postsynaptic firing in this model; a human cortical
      mechanism is not established.
  biological_processes:

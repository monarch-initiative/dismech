    Dysregulated, poorly synchronized neurotransmitter release disturbs cortical
    excitatory/inhibitory balance, producing neuronal hyperexcitability and a severe
    infantile epilepsy (migrating myoclonic seizures), together with impaired
    activity-dependent neurodevelopment.
  role: effector

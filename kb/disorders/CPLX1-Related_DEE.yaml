- name: KAIMRCi003A and KAIMRCi003B patient iPSCs
  experimental_model_type: OTHER
  cell_source: Patient peripheral blood erythroid progenitors reprogrammed to iPSCs
  description: >-
    Two integration-free iPSC clones were generated from one seven-year-old patient labelled
    with Dravet syndrome, developmental delay, infantile seizures and choreoathetotic movements.
    Both carry homozygous CPLX1 p.Glu2Lys and a heterozygous SCN9A in-frame deletion. Identity,
    normal female karyotype, pluripotency and trilineage differentiation were characterized.
    Disease-relevant neuronal physiology, isogenic correction and functional rescue were proposed
    future work, not reported results.
  evidence:
  - reference: DOI:10.1007/s13577-023-01016-z
    reference_title: >-
      Generation of iPSC lines (KAIMRCi003A, KAIMRCi003B) from a Saudi patient with Dravet
      syndrome carrying homozygous mutation in the CPLX1 gene and heterozygous mutation in
      SCN9A
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we established two DRVT-iPSC lines harboring a homozygous mutation in the CPLX1
      gene and heterozygous mutation in SCN9A gene.
    explanation: Two iPSC clones were derived from one donor carrying both variants; this is a resource-generation result.
  - reference: DOI:10.1007/s13577-023-01016-z
    reference_title: >-
      Generation of iPSC lines (KAIMRCi003A, KAIMRCi003B) from a Saudi patient with Dravet
      syndrome carrying homozygous mutation in the CPLX1 gene and heterozygous mutation in
      SCN9A
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analysis unraveled homozygous variant c.4G > A p.(Glu2Lys) in the CPLX1 gene.
      This variant leads to an amino acid exchange in exon 1 (NM_006651.4).
    explanation: >-
      The donor carried homozygous p.Glu2Lys as well as a heterozygous SCN9A deletion; this
      establishes the genotype, not single-gene causation.
  notes: >-
    An undifferentiated patient-derived resource, not yet a validated neuronal disease model.
    The co-occurring SCN9A variant prevents assigning cellular findings to CPLX1 without further
    experiments.

    evidence_source: MODEL_ORGANISM
    snippet: >-
      homozygous Cplx1 knockout mice have the earliest known onset of ataxia
      seen in a mouse model.
    explanation: >-
      Shows the mouse phenotype is dominated by early ataxia, not the cortical
      epilepsy that defines the human disorder — the basis of the mismatch.

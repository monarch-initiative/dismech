- name: Recombinant complexin membrane-binding assays
  experimental_model_type: OTHER
  description: >-
    NMR and circular-dichroism experiments with recombinant worm complexin and liposomes establish
    curvature-sensitive C-terminal binding and helix formation. Mouse complexin showed related
    curvature sensitivity. Engineered worm substitutions and deletions inform membrane interactions,
    but none is a direct assay of the human disease alleles.
  modeled_mechanisms:
  - target: Complexin-1 Loss of Function
    relationship: MEASURES
    description: Defines C-terminal membrane interactions that motivate the predicted consequences of human truncation.
    fidelity: LOW
    limitations: Recombinant nonhuman proteins and engineered substitutions; human variant function was not measured.
    evidence:
    - reference: PMID:25229806
      reference_title: Membrane curvature sensing by the C-terminal domain of complexin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that complexin's CTD is highly sensitive to membrane curvature, which
        it senses via tandem motifs, a C-terminal motif containing a mix of bulky hydrophobic
        and positively charged residues, and an adjacent amphipathic region that can bind
        membranes in either a disordered or a helical conformation.
      explanation: >-
        Recombinant complexin/liposome experiments support a membrane-binding role for the
        C terminus, not direct functional validation of the human alleles.
  evidence:

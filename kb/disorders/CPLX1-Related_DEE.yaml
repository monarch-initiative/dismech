name: CPLX1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  An autosomal-recessive developmental and epileptic encephalopathy caused by
  biallelic loss-of-function variants in CPLX1, which encodes complexin-1, a
  cytosolic regulator of the neuronal SNARE complex. Complexin-1 both clamps the
  assembled SNARE complex to prevent premature fusion and cooperates with the
  calcium sensor synaptotagmin-1 to synchronize calcium-triggered synaptic vesicle
  fusion; loss of complexin-1 dysregulates neurotransmitter release. Affected
  individuals present with marked developmental delay, intellectual disability, and
  a severe infantile epilepsy (migrating myoclonic seizures). It is one of the
  synaptic vesicle cycle disorders and completes the fusion-machinery arm of the
  module, representing the SNARE-complex regulator/fusion clamp alongside the SNARE
  subunits (SNAP25, STX1B, VAMP2) and the calcium sensor (SYT1).
category: Mendelian

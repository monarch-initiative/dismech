      regulation, and homozygous Cplx1 knockout mice have the earliest known onset
      of ataxia seen in a mouse model.
    explanation: >-
      Identifies complexin-1 as a synaptic regulator whose loss causes neurological
      disease, the trigger of this node.
  - reference: PMID:28422131

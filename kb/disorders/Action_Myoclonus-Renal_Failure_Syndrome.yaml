name: Action Myoclonus-Renal Failure Syndrome
creation_date: "2026-09-16T20:45:00Z"
description: >
  Action myoclonus-renal failure syndrome (AMRF) is an autosomal recessive
  lysosomal disorder caused by biallelic loss-of-function variants in SCARB2,
  which encodes the lysosomal integral membrane protein type 2 (LIMP-2). LIMP-2
  is the mannose-6-phosphate-independent sorting receptor that carries
  beta-glucocerebrosidase (GCase) from the endoplasmic reticulum to the
  lysosome. When LIMP-2 is absent or retained in the ER, GCase never reaches the
  lysosome and is degraded, so the disease is a trafficking failure of a
  lysosomal enzyme rather than a defect in the enzyme itself. The clinical
  picture combines a progressive myoclonic epilepsy - adolescent or young-adult
  onset action myoclonus of cortical origin, ataxia, and seizures, characteristically
  without early dementia - with steroid-resistant nephrotic syndrome progressing
  to focal segmental glomerulosclerosis and end-stage kidney disease. The two
  organ manifestations progress independently, and some individuals with
  biallelic SCARB2 variants develop progressive myoclonus epilepsy with no renal
  involvement at all; that form sits at one end of the same spectrum rather than
  being a separate disease. Disease progresses relentlessly to death within
  roughly 7 to 15 years of onset.

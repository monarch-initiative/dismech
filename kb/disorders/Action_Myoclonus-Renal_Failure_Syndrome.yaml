    snippet: >-
      Renal biopsies showed collapsing glomerulopathy, a severe variant of focal
      glomerulosclerosis.
    explanation: >-
      Histological confirmation across the 15-patient series, and identifies the
      lesion specifically as the collapsing variant.
- category: Renal
  name: End-stage kidney disease
  description: >-
    Progression to end-stage kidney disease requiring renal replacement therapy.
    Dialysis or transplantation prolongs survival but does not alter the
    neurological course.
  phenotype_term:
    preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of ESKD is supportive; while renal replacement therapy can
      prolong survival, it does not improve neurologic features.
    explanation: >-
      Establishes both that ESKD occurs and that treating it does not change the
      neurological trajectory.
- category: Neurological
  name: Peripheral neuropathy
  description: >-
    A sensorimotor peripheral neuropathy, axonal with demyelinating features on
    nerve conduction studies. It is variable within a single family carrying one
    variant, so its absence does not argue against the diagnosis; its presence in a
    patient who also has renal and central nervous system involvement is the
    combination that should prompt SCARB2 testing.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:35346091
    reference_title: "Genotype-Phenotype correlations of SCARB2 associated clinical presentation: a case report and in-depth literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrafamilial clinical heterogeneity with common features including
      dysarthria, tremor and proteinuria, and distinct features such as peripheral
      neuropathy (PNP), myoclonus and seizures between the affected cases, was
      observed in the family.
    explanation: >-
      Documents peripheral neuropathy in patients, and specifically as a feature
      that varies between siblings carrying the same variant, which is the
      variability this phenotype's description asserts.
  - reference: PMID:35346091
    reference_title: "Genotype-Phenotype correlations of SCARB2 associated clinical presentation: a case report and in-depth literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The EMG revealed a mild axonal type of sensorimotor neuropathy.
    explanation: >-
      The electrophysiological characterization in the index case: axonal and
      sensorimotor rather than purely sensory.
  - reference: PMID:37529812
    reference_title: "Action Myoclonus-Renal Failure Syndrome: A Case Report with Bioinformatic Annotations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In line with standardized protocols, EMG findings consistent with AMRF present
      a polyneuropathy characterized by axonal degeneration and demyelinating
      features.
    explanation: >-
      An independent report giving the same axonal-plus-demyelinating picture and
      treating EMG as a diagnostic contributor, which is why this phenotype is
      described here as part of the workup rather than an incidental finding.
histopathology:
- name: C1q accumulation in glomerular capillary loops and mesangium
  description: >-
    Strong C1q deposition in capillary loops and mesangium on renal biopsy, reported
    alongside the nephrotic syndrome. This is what gives the renal lesion its
    alternative name in the literature, where SCARB2 disease is sometimes reported
    as progressive myoclonus epilepsy with C1q nephropathy. It sits beside rather
    than instead of the collapsing focal segmental glomerulosclerosis curated under
    phenotypes, and the entry does not assert that either is the invariable renal
    histology. The two are not confined to separate families: one patient (II.13 of
    the Turkish p.N45MfsX88 family) has C1q, C3 and IgM deposition and FSGS in the
    same biopsy. That biopsy is reported as FSGS without the collapsing qualifier,
    so what co-occurs there is C1q deposition with FSGS, not specifically with the
    collapsing variant.
  finding_term:
    preferred_term: C1q deposition in glomerular capillary loops and mesangium
  evidence:
  - reference: PMID:18424452
    reference_title: "A nonsense mutation in the LIMP-2 gene associated with progressive myoclonic epilepsy and nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical features of two siblings from a consanguineous marriage were
      progressive myoclonic epilepsy without intellectual impairment and a nephrotic
      syndrome with a strong accumulation of C1q in capillary loops and mesangium of
      kidney.
    explanation: >-
      Reports the C1q distribution directly, in two molecularly confirmed siblings,
      and ties it to the nephrotic syndrome rather than to an incidental finding.
  - reference: PMID:35346091
    reference_title: "Genotype-Phenotype correlations of SCARB2 associated clinical presentation: a case report and in-depth literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent a renal biopsy, and it showed FSGS. Immunofluorescence microscopy
      showed deposition of one positive C1q, C3, and IgM in capillary loops.
    explanation: >-
      A second, independent family with the C1q finding, and the only report here in
      which C1q deposition and FSGS are seen in one biopsy rather than in separate
      patients. The FSGS is not qualified as collapsing in this report.
- name: Extraneuronal pigment accumulation on brain autopsy
  description: >-
    Pigment accumulating outside neurons, found at autopsy in two patients of the
    defining series. It is recorded here because it is the only post-mortem
    neuropathology reported for this disease, and because its extraneuronal location
    is the observation itself: the storage in AMRF is not the intraneuronal
    inclusion picture of the other progressive myoclonic epilepsies.
  finding_term:
    preferred_term: extraneuronal pigment accumulation
  evidence:
  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain autopsy in two patients revealed extraneuronal pigment accumulation.
    explanation: >-
      The finding and its denominator, from the largest published series.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disease was first described in
    four French Canadian patients in three families in 1986, and extended to 15
    individuals from nine families across five countries in 2004 - which also
    dispelled the belief that it was confined to French Canadian ancestry. By 2014
    a total of 14 disease-causing SCARB2 variants had been described. Reported case
    numbers remain in the low dozens.
  evidence:
  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now describe 15 individuals with AMRF from five countries, including a
      follow-up of the four French Canadian patients, allowing a more complete
      characterization of this disease.
    explanation: >-
      The largest published series, and the source of the case count and geographic
      spread stated in the notes.
  - reference: PMID:24389070
    reference_title: "Lysosomal integral membrane protein-2: a new player in lysosome-related pathology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A total of 14 disease-causing SCARB2 mutations have been identified to
      date.
    explanation: >-
      Gives the order of magnitude of reported allelic and case diversity, the
      basis for the ULTRA_RARE band in the absence of a prevalence figure.
genetic:
- name: SCARB2
  gene_term:
    preferred_term: SCARB2
    term:
      id: hgnc:1665
      label: SCARB2
  presence: Positive
  association: Biallelic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    SCARB2 encodes LIMP-2. Reported AMRF alleles include nonsense (W178X, Q288X),
    frameshift (W146SfsX16), splice-site and a single missense (H363N) variant.
    The missense allele is mechanistically distinctive: rather than weakening
    binding it increases GCase binding to LIMP-2, so the defect there is failure
    of release rather than failure of capture.

    Genotype-phenotype: the one correlation that survives statistical testing across
    the reported cases is positional rather than mechanistic. Variant *type* does not
    predict the clinical course, but a C-terminal variant location is significantly
    associated with age at onset. That is the only established modifier for this
    disease, and it means the allele's position in the protein carries prognostic
    information that its class does not.
  evidence:
  - reference: PMID:19933215
    reference_title: "Disease-causing mutations within the lysosomal integral membrane protein type 2 (LIMP-2) reveal the nature of binding to its ligand beta-glucocerebrosidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To date, six AMRF-causing mutations have been described, including splice
      site, missense and nonsense mutations.
    explanation: >-
      Documents the allelic spectrum stated in the notes.
  - reference: PMID:19933215
    reference_title: "Disease-causing mutations within the lysosomal integral membrane protein type 2 (LIMP-2) reveal the nature of binding to its ligand beta-glucocerebrosidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to the reduced binding properties of the nonsense mutations,
      the only missense mutation (H363N) found in AMRF leads to increased binding
      of beta-GC to LIMP-2
    explanation: >-
      Supports the specific claim that H363N increases rather than abolishes
      binding, making it a release defect.
  - reference: PMID:35346091
    reference_title: "Genotype-Phenotype correlations of SCARB2 associated clinical presentation: a case report and in-depth literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In-depth literature review enabled the detailed investigation of the reported
      variants associated with AMRF and suggested that while the type of the variant
      did not have a major impact on the course of the clinical characteristics,
      only the C terminal localization of the pathogenic variant significantly
      affected the clinical presentation, particularly the age at onset (AO) of the
      disease.
    explanation: >-
      The genotype-phenotype claim in the notes, including its negative half: variant
      type does not predict the course, position does. quote_role is
      REVIEW_SYNTHESIS because this is the paper's synthesis across previously
      reported cases rather than a result from its own index family.
diagnosis:
- name: Molecular Genetic Diagnosis of SCARB2-AMRF
  description: >-
    The diagnosis is established by identifying biallelic loss-of-function SCARB2
    variants in a proband with suggestive findings. Because progressive myoclonic
    epilepsy is genetically heterogeneous, a PME gene panel or exome/genome
    sequencing is the appropriate first-tier test. A leukocyte beta-glucocerebrosidase
    assay must not be used to exclude the diagnosis: leukocyte activity can be
    normal in a patient whose fibroblasts are severely deficient, because blood
    cells retain a LIMP-2-independent delivery route. SCARB2 testing is warranted in
    adolescent- or young-adult-onset PME of unknown cause even with no renal
    involvement.
  notes: >-
    Differential diagnosis: the other progressive myoclonic epilepsies - EPM1
    (Unverricht-Lundborg, CSTB), Lafora disease (EPM2A/NHLRC1), the neuronal ceroid
    lipofuscinoses, MERRF, sialidosis type 1, and DRPLA. The relative preservation
    of cognition and the pronounced photosensitivity are the clinical
    discriminators; coexisting proteinuria is close to decisive when present.
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of SCARB2-AMRF is established in a proband with suggestive
      findings and biallelic loss-of-function pathogenic variants in SCARB2
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews statement of how the diagnosis is established.
  - reference: PMID:33343627
    reference_title: "Case Report: Distinctive EEG Patterns in SCARB-2 Related Progressive Myoclonus Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, this report emphasizes the presence of two EEG patterns,
      fixation-off phenomenon, and bursts of parasagittal spikes exclusively seen
      during REM sleep that appear to be characteristic of this condition.
    explanation: >-
      Adds the two EEG patterns the authors propose as characteristic. Quoted with
      their own hedge ("appear to be") intact: this is a single case report, so it
      is a lead for the workup rather than a validated discriminator.
  - reference: PMID:22050460
    reference_title: "Clinical and neurophysiologic features of progressive myoclonus epilepsy without renal failure caused by SCARB2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with PME of unknown origin of adolescent or young adult onset,
      with these neurophysiologic features, should be tested for SCARB2
      mutations, even in the absence of renal impairment.
    explanation: >-
      Supports the testing recommendation for renal-negative PME stated in the
      description.
  - reference: PMID:35346091
    reference_title: "Genotype-Phenotype correlations of SCARB2 associated clinical presentation: a case report and in-depth literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long latency reflexes and giant somatosensory evoked potentials (SEP) were
      recorded.
    explanation: >-
      Giant SEPs are the classic marker of cortical myoclonus, recorded here in a
      confirmed SCARB2 homozygote. The same paper's Table 1 records two affected
      brothers of the same family as having normal SEP, so a normal study does not
      argue against the diagnosis: the finding supports it when present and is
      uninformative when absent.
treatments:
- name: Substrate Reduction Therapy (Miglustat)
  description: >-
    The only treatment in this entry that targets the mechanism rather than the
    symptoms. Miglustat inhibits glucosylceramide synthase, so it reduces
    production of the substrate that the mistrafficked glucocerebrosidase cannot
    degrade - the same logic used in Gaucher disease, reached here from the
    opposite direction. One patient treated for three years after several years of
    steady worsening had progression of myoclonus halt, dysphagia resolve, some
    skills reacquired and seizures remain controlled. A second, earlier report
    describes significant improvement in one of two affected sisters given
    substrate reduction therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: miglustat
      term:
        id: CHEBI:50381
        label: miglustat
  target_mechanisms:
  - target: Neuronal Lysosomal Storage and Intracellular Inclusions
    description: >-
      Reduces glucosylceramide synthesis upstream, lowering the substrate load that
      cannot be cleared, rather than restoring enzyme delivery.
  target_phenotypes:
  - preferred_term: Action myoclonus
    term:
      id: HP:0034360
      label: Action myoclonus
  evidence:
  - reference: PMID:34337151
    reference_title: "Miglustat Therapy for SCARB2-Associated Action Myoclonus-Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Progression of myoclonus halted, dysphagia resolved, some skills were
      reacquired, and seizures remained well controlled.
    explanation: >-
      The observed outcomes in the single treated patient over three years.
  - reference: PMID:21782476
    reference_title: "Progressive myoclonus epilepsy with nephropathy C1q due to SCARB2/LIMP-2 deficiency: clinical report of two siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      When substrate-reduction therapy, to correct the possible glucocerebroside
      storage in the cells with glucocerebrosidase deficiency, was administered to
      one of the siblings, a significant improvement was observed.
    explanation: >-
      An independent single-patient report of benefit. Graded INDIRECT because the
      report names substrate reduction therapy generically rather than the agent,
      so it supports the strategy rather than this specific drug.
  notes: >-
    The evidence base is two single patients in uncontrolled reports, and the
    authors of the three-year report state the conclusion with matching hedging
    ("could be ameliorated, at least partly"). This is not established therapy. Note
    also that miglustat was used because it has modest CNS penetration: eliglustat,
    the more potent inhibitor, does not cross the blood-brain barrier, and
    compassionate-use access to the CNS-penetrant venglustat was declined. The drug
    choice is therefore a constraint of availability, not an optimum.
- name: Anti-Myoclonic and Anti-Seizure Pharmacotherapy
  description: >-
    Symptomatic pharmacotherapy to reduce myoclonus and seizures. There is no
    disease-modifying therapy. Several widely used anti-seizure drugs are actively
    harmful here and are listed under agents to avoid.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Action myoclonus
    term:
      id: HP:0034360
      label: Action myoclonus
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      pharmacotherapy to reduce myoclonus; anti-seizure medication (ASM) and
      vagus nerve stimulation to reduce seizures
    explanation: >-
      GeneReviews management recommendation for the neurological manifestations.
  notes: >-
    Agents to avoid, per GeneReviews: phenytoin (may aggravate neurological
    manifestations or accelerate cerebellar degeneration), the sodium channel
    blockers carbamazepine and oxcarbazepine, the GABAergic drugs tiagabine and
    vigabatrin, and gabapentin and pregabalin (may aggravate myoclonus and
    myoclonic seizures).
- name: Vagus Nerve Stimulation
  description: >-
    Neurostimulation offered for seizure reduction when pharmacotherapy is
    insufficient.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: vagus nerve stimulator implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  notes: >-
    The device itself is deliberately left unbound. CLAUDE.md's device-qualifier
    pattern wants an NCIT device term in a `qualifiers` value, but a search of
    NCIT via OLS returns only NCIT:C203750 (Transcutaneous Auricular Vagus Nerve
    Stimulation), which is a different, non-implanted intervention. Rather than
    bind a term that names something else, the device concept is carried in
    `preferred_term`. This matches how every other KB entry curates VNS
    (Dravet_syndrome, Epilepsy, Lennox-Gastaut_Syndrome all bind the surgical
    action alone).
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      anti-seizure medication (ASM) and vagus nerve stimulation to reduce
      seizures
    explanation: >-
      GeneReviews lists vagus nerve stimulation among the recommended
      seizure-directed interventions.
- name: Renin-Angiotensin-Aldosterone Inhibition and Immunosuppression for Proteinuria
  description: >-
    Nephrology-directed treatment aimed at remission of proteinuria, typically
    combining renin-angiotensin-aldosterone system inhibition with
    immunosuppressive medication. The nephrotic syndrome is steroid resistant, so
    this is proteinuria control rather than a cure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Steroid-resistant nephrotic syndrome
    term:
      id: HP:0012588
      label: Steroid-resistant nephrotic syndrome
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment for renal involvement, under the care of a nephrologist, is
      typically focused on remission of proteinuria and often includes a
      combination of renin-angiotensin-aldosterone inhibition and
      immunosuppressive medications.
    explanation: >-
      GeneReviews statement of the renal treatment approach.
- name: Dialysis and Renal Transplantation
  description: >-
    Renal replacement therapy is effective for the renal arm and is what made the
    syndrome visible at all: before dialysis and transplantation existed, the
    course was rapidly fatal and the neurological phenotype was never reached. It
    does not touch the neurological disease, which continues to progress even with
    normalized renal function.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: renal replacement therapy
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_phenotypes:
  - preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dialysis and renal transplantation are effective for the renal but not the
      neurological features, which continue to progress even in the presence of
      normalized renal function
    explanation: >-
      States both the efficacy for the renal arm and the explicit failure to affect
      the neurological one.
  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The syndrome was not recognized prior to the advent of dialysis and renal
      transplantation because of its rapidly fatal course if renal failure is
      untreated.
    explanation: >-
      Supports the historical claim in the description. Quoted from the paper's
      opening framing rather than from its results, hence quote_role BACKGROUND.
- name: Rehabilitation and Supportive Care
  description: >-
    Physical and occupational therapy to maintain mobility and activities of daily
    living, adaptive mobility devices, speech-language therapy for alternative
    communication, and educational support where cognitive decline appears.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      physical and occupational therapy to help maintain mobility and optimize
      activities of daily living; adaptive devices to help maintain/improve
      independence in mobility
    explanation: >-
      GeneReviews supportive-care recommendation for the neurological
      manifestations.
animal_models:
- name: Limp2 knockout mouse
  species: Mouse
  genotype: Scarb2 (Limp2) homozygous null
  publication: PMID:12620969
  description: >-
    The Limp2-null mouse predates the discovery of AMRF's cause and was
    characterized in its own right in 2003; it was reanalysed in 2008 once SCARB2
    was identified as the AMRF gene. Read on its own terms it is a poor model of
    the human disease: its reported phenotype is ureteropelvic junction obstruction
    with hydronephrosis, hearing loss from loss of spiral ganglia and hair cells,
    and a peripheral demyelinating neuropathy - none of which is the human
    syndrome. The neuronal storage component and the glomerular change were found
    on reanalysis, and the glomerular change is subtle. The mouse's own authors
    proposed it as a lead for human disorders of the stria vascularis or peripheral
    demyelination, not for a progressive myoclonic epilepsy with glomerulosclerosis.
  modeled_mechanisms:
  - target: Neuronal Lysosomal Storage and Intracellular Inclusions
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Intracellular inclusions in cerebral and cerebellar cortex, the same regions
      affected in human AMRF.
    evidence:
    - reference: PMID:18308289
      reference_title: "Array-based gene discovery with three unrelated subjects shows SCARB2/LIMP-2 deficiency causes myoclonus epilepsy and glomerulosclerosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Reanalysis of an existing Limp2 knockout mouse showed intracellular
        inclusions in cerebral and cerebellar cortex
      explanation: >-
        Reports the neuronal storage phenotype in the null mouse.
  - target: Podocyte Injury and Glomerular Collapse
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Glomerular change is present but subtle, well short of the focal segmental
      glomerulosclerosis with collapse and end-stage kidney disease seen in
      patients.
    limitations: >-
      The mouse does not develop the nephrotic syndrome or progressive renal
      failure that define the renal half of the human syndrome, so it cannot be
      used to study that arm's progression or to test renal endpoints.
    evidence:
    - reference: PMID:18308289
      reference_title: "Array-based gene discovery with three unrelated subjects shows SCARB2/LIMP-2 deficiency causes myoclonus epilepsy and glomerulosclerosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the kidneys showed subtle glomerular changes
      explanation: >-
        Reports the attenuated renal phenotype, the basis for
        PARTIALLY_RECAPITULATES and LOW fidelity.
  - target: Cortical Hyperexcitability and Cerebellar Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The null mouse's characterized phenotype is renal-outflow, cochlear and
      peripheral-nerve disease. No progressive myoclonus, seizure phenotype or
      cerebellar syndrome is reported in it.
    limitations: >-
      The organism-level phenotype is in different organs from the human disease
      and the mouse's own describing authors pointed it at a different set of human
      disorders. It therefore cannot be used to test a myoclonus or seizure
      endpoint, which is the arm that matters most clinically and the one substrate
      reduction therapy is aimed at.
    evidence:
    - reference: PMID:12620969
      reference_title: "LIMP-2/LGP85 deficiency causes ureteric pelvic junction obstruction, deafness and peripheral neuropathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The phenotype of LIMP-2-deficient mice stimulates the search for mutations
        in human disorders associated with degeneration of the stria vascularis
        and/or demyelinization of peripheral nerves.
      explanation: >-
        The mouse's own authors direct it at a different class of human disease,
        which is the clearest statement that its phenotype is not the AMRF one.
    - reference: PMID:12620969
      reference_title: "LIMP-2/LGP85 deficiency causes ureteric pelvic junction obstruction, deafness and peripheral neuropathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        LIMP-2-deficient mice are also characterized by a peripheral demyelinating
        neuropathy.
      explanation: >-
        One of the three organ phenotypes that the mouse has and the human disease
        does not.
  - target: Reduced Lysosomal Glucocerebrosidase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Tissue GCase deficiency with the same tissue-specific sparing of leukocytes
      seen in patients.
    limitations: >-
      What the mouse measures is enzyme activity, by activity assay and
      activity-based probe, in whole-tissue preparations and in isolated
      leukocytes. The node it is linked to claims something one step up: that
      lysosomal GCase delivery is LIMP-2-dependent in particular cell types. A
      whole-tissue activity assay cannot attribute the residual activity it finds
      to any one cell type within that tissue, so the leukocyte-versus-tissue
      contrast is the only cell-resolved comparison this model supplies. The finer
      claim in the node, that fibroblasts and neuronal cells are entirely
      LIMP-2-dependent while blood cells are not, rests on the human fibroblast
      and leukocyte data cited on that node rather than on this mouse.
    evidence:
    - reference: PMID:40639771
      reference_title: "LIMP-2 deficiency-associated glycolipid abnormalities in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Noteworthy, in LIMP-2-deficient mice, residual GCase is remarkably high
        in leukocytes.
      explanation: >-
        The mouse reproduces the leukocyte-sparing pattern that is the diagnostic
        trap in patients.
discussions:
- discussion_id: renal_arm_mechanism_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Podocyte Injury and Glomerular Collapse
  prompt: >-
    How does loss of LIMP-2-dependent beta-glucocerebrosidase delivery cause
    podocyte injury and focal segmental glomerulosclerosis?
  rationale: >-
    The neurological arm of AMRF has a traceable chain from sorting failure to
    neuronal storage to cortical hyperexcitability. The renal arm does not. The
    causal gene and the renal lesion are both established, but no published step
    connects reduced glucocerebrosidase delivery to podocyte injury, and the two
    organ manifestations progress independently and can be dissociated entirely -
    some individuals with biallelic SCARB2 variants never develop renal disease.
    That dissociation is itself evidence that the renal lesion may depend on a
    LIMP-2 function other than GCase transport, which would make the upstream edge
    in this entry wrong rather than merely incomplete.
- discussion_id: limp2_null_mouse_renal_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  prompt: >-
    Is the Limp2-null mouse a valid model of AMRF at all, given that its own
    characterized phenotype is in three organs the human disease does not affect?
  rationale: >-
    Read forwards rather than backwards, the mouse is a poor match. Its described
    phenotype is ureteropelvic junction obstruction with hydronephrosis, hearing
    loss and peripheral demyelinating neuropathy; its authors pointed it at human
    stria vascularis and demyelination disorders. The AMRF-relevant findings -
    cortical and cerebellar storage inclusions, subtle glomerular change - emerged
    only on reanalysis after SCARB2 was implicated, and the glomerular change never
    reaches the collapsing glomerulopathy or end-stage kidney disease that define
    the human renal arm. Evidence in the model exists and its translational validity
    is the open question, which is why this is a HUMAN_MODEL_MISMATCH rather than a
    plain knowledge gap. The practical consequence is concrete: substrate reduction
    therapy is the one mechanism-directed treatment in this entry and rests on two
    single patients, and there is no animal model in which a myoclonus endpoint
    could be used to test it.
notes: >-
  Not curated: the gut-dysbiosis and FXR/vitamin E findings in Scarb2-deficient
  mice (PMID:38635907), which the deep-research report surfaced as a therapeutic
  lead. They are a mouse result with no human counterpart in AMRF, and adding a
  dysbiosis arm to this pathograph on that basis would assert more than the
  evidence carries.

  Scope: this entry covers SCARB2-related disease as a single continuum, following
  GeneReviews, which treats progressive myoclonus epilepsy without renal
  involvement as one end of the SCARB2-AMRF spectrum rather than a separate
  disease. That is why the renal phenotypes carry no frequency annotation - renal
  involvement is variable by definition here, and no published series gives a
  reliable proportion.

  Not curated: the separate role of SCARB2/LIMP-2 as the cellular receptor for
  enterovirus 71, and its presence in the cardiac intercalated disk. Both are real
  LIMP-2 biology and are described in PMID:24389070, but neither is part of this
  disease's pathophysiology. PMID:17485520 is the primary source for the cardiac
  intercalated-disc role and remains cached and uncited for the same reason: it is
  the better source for a topic this entry deliberately excludes, so it is kept
  rather than pruned in case that exclusion is ever revisited.

  PMID:33772352 is a single further case report of a novel splice-site variant. Its
  content is covered by the allelic spectrum already curated in the genetic notes,
  so it is cached and uncited rather than cited for a claim it would only
  duplicate.

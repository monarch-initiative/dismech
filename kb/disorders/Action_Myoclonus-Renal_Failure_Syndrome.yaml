phenotypes:
- category: Neurological
  name: Tremor
  description: >-
    Tremor is typically the first neurological sign, appearing at 17 to 26 years
    (mean 19.8), about two years before the action myoclonus it precedes. It is
    seen in the fingers or hands and is worsened by fine motor activity such as
    handwriting.
  phenotype_term:
    preferred_term: Tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tremor (onset 17-26 years, mean 19.8 years, median 19 years) and
      progressively disabling action myoclonus (onset 14-29 years, mean 21.7 years,
      median 21 years), with infrequent generalized seizures (onset 20-28 years,
      mean 22.7 years, median 22 years) and cerebellar features are characteristic.
    explanation: >-
      Gives the onset ages for tremor, myoclonus and seizures in the 15-patient
      series, the source of the sequence described here.
- category: Neurological
  name: Action myoclonus
  description: >-
    Progressive action- and stimulus-sensitive myoclonus of cortical origin, the
    defining and most disabling neurological feature. It worsens relentlessly and
    is the usual cause of loss of independent function.
  phenotype_term:
    preferred_term: Action myoclonus
    term:
      id: HP:0034360
      label: Action myoclonus
    clinical_course: PROGRESSIVE
  evidence:

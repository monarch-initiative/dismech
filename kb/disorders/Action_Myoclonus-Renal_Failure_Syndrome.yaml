pathophysiology:
- name: LIMP-2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SCARB2 variants - nonsense, frameshift, splice-site and rarely
    missense - abolish functional LIMP-2. Nonsense and frameshift alleles leave
    no immunodetectable protein; the alleles that do produce protein are retained
    in the endoplasmic reticulum rather than reaching the lysosomal membrane. The
    consequence is the same in either case: no functional sorting receptor at the
    site where cargo must be handed over.
  genetic_context:
    gene:
      preferred_term: SCARB2
      term:
        id: hgnc:1665
        label: SCARB2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: lysosomal membrane
    term:
      id: GO:0005765
      label: lysosomal membrane
  downstream:
  - target: Failure of Beta-Glucocerebrosidase Lysosomal Targeting
    causal_link_type: DIRECT
    description: >-
      Without LIMP-2 at the ER-to-lysosome interface its cargo cannot be routed.
  evidence:
  - reference: PMID:18308289
    reference_title: "Array-based gene discovery with three unrelated subjects shows SCARB2/LIMP-2 deficiency causes myoclonus epilepsy and glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in SCARB2/Limp2 were found in all three families used for mapping
      and subsequently confirmed in two other unrelated AMRF families. The
      mutations were associated with lack of SCARB2 protein.
    explanation: >-
      Establishes that the causal SCARB2 variants in AMRF abolish the protein.
  - reference: PMID:19933215
    reference_title: "Disease-causing mutations within the lysosomal integral membrane protein type 2 (LIMP-2) reveal the nature of binding to its ligand beta-glucocerebrosidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All mutations investigated in this study lead to a retention of LIMP-2 in
      the endoplasmic reticulum (ER) but affect the binding to beta-GC differentially.
    explanation: >-
      Shows the second route to the same loss: AMRF alleles that are expressed do
      not leave the ER.
- name: Failure of Beta-Glucocerebrosidase Lysosomal Targeting
  biological_scale: MOLECULAR
  description: >-
    LIMP-2 binds beta-glucocerebrosidase in the ER through a conserved coiled-coil
    domain and releases it in the acidified late endosome/lysosome, a handover
    gated by a critical histidine that acts as a pH sensor. This route is
    mannose-6-phosphate independent, which is why AMRF spares the many lysosomal
    hydrolases that use the M6P receptor. With LIMP-2 absent, GCase is stranded in
    the ER, remains endoglycosidase-H sensitive, and is degraded.
  biological_processes:
  - preferred_term: LIMP-2-mediated sorting of beta-glucocerebrosidase
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0006622
      label: protein targeting to lysosome
  downstream:
  - target: Reduced Lysosomal Glucocerebrosidase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18424452
    reference_title: "A nonsense mutation in the LIMP-2 gene associated with progressive myoclonic epilepsy and nephrotic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Besides lacking immunodetectable LIMP-2, patient fibroblasts also had
      decreased amounts of beta-glucocerebrosidase, which was mainly located in
      the endoplasmic reticulum, as assessed by its sensitivity to Endo H.
    explanation: >-
      Direct patient-cell demonstration that GCase is stranded in the ER when
      LIMP-2 is absent.
  - reference: PMID:22537104
    reference_title: "A critical histidine residue within LIMP-2 mediates pH sensitive binding to its ligand beta-glucocerebrosidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We now demonstrate that the lumenal acidification mediated by the vacuolar
      (H(+) )-ATPase triggers the dissociation of LIMP-2 and GC in late
      endosomal/lysosomal compartments.
    explanation: >-
      Defines the normal delivery step whose loss this node describes: pH-gated
      release of GCase from LIMP-2 at the lysosome.
- name: Reduced Lysosomal Glucocerebrosidase Activity
  biological_scale: CELLULAR
  description: >-
    Lysosomal GCase activity falls in the cell types that depend on LIMP-2 for
    its delivery. The dependence is tissue-specific, and this is the reason AMRF
    is not Gaucher disease: in fibroblasts and neuronal cells GCase targeting is
    entirely LIMP-2 dependent, while in blood cells a LIMP-2-independent route
    preserves substantial activity. Leukocyte GCase can therefore be normal in a
    patient whose fibroblasts are severely deficient, which is a diagnostic trap
    as well as a mechanistic fact.
  biological_processes:
  - preferred_term: glucosylceramide catabolism in the lysosome
    modifier: DECREASED
    term:
      id: GO:0006680
      label: glucosylceramide catabolic process
  molecular_functions:
  - preferred_term: glucocerebrosidase activity
    modifier: DECREASED
    term:
      id: GO:0004348
      label: glucosylceramidase activity
  downstream:
  - target: Neuronal Lysosomal Storage and Intracellular Inclusions
    causal_link_type: DIRECT
  - target: Podocyte Injury and Glomerular Collapse
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:18424452
    reference_title: "A nonsense mutation in the LIMP-2 gene associated with progressive myoclonic epilepsy and nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The biochemical analysis of one of the patients revealed a normal
      beta-glucocerebrosidase activity in leukocytes, but a severe enzymatic
      deficiency in cultured skin fibroblasts.
    explanation: >-
      Documents the tissue-restricted enzyme deficiency this node asserts,
      including the normal leukocyte result.
  - reference: PMID:26018676
    reference_title: "Role of LIMP-2 in the intracellular trafficking of beta-glucosidase in different human cellular models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts and neuronlike cells, GCase targeting to the lysosomes is
      completely dependent on LIMP-2, whereas in blood cells, GCase is partially
      targeted to lysosomes by a LIMP-2-independent mechanism.
    explanation: >-
      Establishes the cell-type dependence that explains why the deficiency is
      partial and why AMRF diverges clinically from Gaucher disease.
- name: Neuronal Lysosomal Storage and Intracellular Inclusions
  biological_scale: CELLULAR
  description: >-
    Storage material accumulates in cerebral and cerebellar cortical neurons.
    Notably the stored species is not bulk glucosylceramide: in the LIMP-2-deficient
    mouse, glucosylceramide is not markedly raised, while its downstream
    deacylated and sterol-conjugated metabolites glucosylsphingosine and
    glucosylated cholesterol are. That distinction is the current best explanation
    for why LIMP-2 deficiency produces a neuronal storage encephalopathy with
    glomerulosclerosis rather than the visceral, macrophage-centred picture of
    Gaucher disease.
  cell_types:
  - preferred_term: cortical and cerebellar neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Cortical Hyperexcitability and Cerebellar Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18308289
    reference_title: "Array-based gene discovery with three unrelated subjects shows SCARB2/LIMP-2 deficiency causes myoclonus epilepsy and glomerulosclerosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reanalysis of an existing Limp2 knockout mouse showed intracellular
      inclusions in cerebral and cerebellar cortex, and the kidneys showed subtle
      glomerular changes.
    explanation: >-
      Shows neuronal storage inclusions in the cortical regions this node names,
      in the LIMP-2-null mouse.
  - reference: PMID:40639771
    reference_title: "LIMP-2 deficiency-associated glycolipid abnormalities in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GCase deficiency in tissues does not correlate with increases in GlcCer,
      but rather with increases in glucosylsphingosine (GlcSph) and glucosylated
      cholesterol (GlcChol), both glucosylated metabolites derived from GlcCer.
    explanation: >-
      Identifies which glycolipid species actually accumulate, supporting the
      claim that the stored material is not bulk glucosylceramide.
- name: Cortical Hyperexcitability and Cerebellar Degeneration
  biological_scale: TISSUE
  description: >-
    Sensorimotor cortex becomes hyperexcitable and cerebellar output degenerates.
    The myoclonus of AMRF is cortical in origin, not subcortical: EEG-EMG
    coherence and phase analysis in SCARB2 patients show significant coupling with
    a direct corticospinal transfer, and the rhythmic 12-20 Hz jerking can be
    mistaken clinically for a postural tremor. Marked photosensitivity accompanies
    it. Cognition is characteristically spared relative to the other progressive
    myoclonic epilepsies.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the central manifestations because it shares their upstream
      storage lesion, but the route from lysosomal storage to peripheral nerve is
      not established in AMRF and the neuropathy is variable within a single
      family, so the edge is drawn with unknown intermediates.
  - target: Action myoclonus
    causal_link_type: DIRECT
  - target: Progressive cerebellar ataxia
    causal_link_type: DIRECT
  - target: Generalized tonic-clonic seizures
    causal_link_type: DIRECT
  - target: Photosensitivity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22050460
    reference_title: "Clinical and neurophysiologic features of progressive myoclonus epilepsy without renal failure caused by SCARB2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cortical origin of rhythmic myoclonus was demonstrated mainly by
      coherence and phase analysis of EEG-EMG signals indicating a significant
      EEG-EMG coupling and a direct corticospinal transfer.
    explanation: >-
      Direct human neurophysiological demonstration that the myoclonus arises in
      cortex and is transmitted corticospinally.
- name: Podocyte Injury and Glomerular Collapse
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    In the kidney the same enzyme-delivery failure produces podocyte injury,
    proteinuria, and focal segmental glomerulosclerosis, frequently with
    glomerular collapse. The renal arm runs on its own clock: renal involvement
    can precede neurological onset by decades, or be absent altogether in
    individuals whose biallelic SCARB2 variants produce progressive myoclonus
    epilepsy alone. The molecular step between reduced GCase delivery and podocyte
    injury is not established, which is why this edge is marked INDIRECT upstream.
  cell_types:
  - preferred_term: glomerular podocyte
    term:
      id: CL:0000653
      label: podocyte
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  downstream:
  - target: Focal segmental glomerulosclerosis
    causal_link_type: DIRECT
  - target: Steroid-resistant nephrotic syndrome
    causal_link_type: DIRECT
  - target: End-stage kidney disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:18308289
    reference_title: "Array-based gene discovery with three unrelated subjects shows SCARB2/LIMP-2 deficiency causes myoclonus epilepsy and glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Action myoclonus-renal failure syndrome (AMRF) is an autosomal-recessive
      disorder with the remarkable combination of focal glomerulosclerosis,
      frequently with glomerular collapse, and progressive myoclonus epilepsy
      associated with storage material in the brain.
    explanation: >-
      States the renal lesion - focal glomerulosclerosis with glomerular collapse
      - that this node describes.
  - reference: PMID:26677510
    reference_title: "SCARB2-Related Action Myoclonus - Renal Failure Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The neurologic and renal manifestations progress independently.
    explanation: >-
      Supports treating the renal arm as a parallel consequence rather than a

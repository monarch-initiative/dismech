  - reference: PMID:15364701
    reference_title: "Action myoclonus-renal failure syndrome: characterization of a unique cerebro-renal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The independent progression of neurological and renal disorders in AMRF

      vs 35%) and were less likely to undergo mandibular distraction (9.7% vs
      28.2%).
    explanation: A 103-infant TCS NICU cohort quantifies major neonatal airway and feeding interventions; the selected NICU denominator is not a population frequency.
  - reference: PMID:37646339
    reference_title: Severity of Mandibular Dysmorphology in Treacher Collins Syndrome for Stratification of Perioperative Airway Risk.

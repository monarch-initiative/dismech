    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study found a positive correlation between severity of
      maxillomandibular dysmorphology and perioperative airway difficulty in TCS
      patients.
    explanation: The 222-procedure cohort supports severity-stratified perioperative airway planning across the lifespan.
  - reference: PMID:38801252
    reference_title: "Optimal Diagnostic and Treatment Practices for Facial Dysostosis Syndromes: A Clinical Consensus Statement Among European Experts."
    supports: SUPPORT
    evidence_source: OTHER

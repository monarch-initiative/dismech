review_notes: >-
  Identity and lump/split boundary: this entry represents the MONDO:0002457
  Treacher Collins syndrome umbrella and retains the four MONDO-backed subtypes
  TCS1-TCS4. The causal gene set is TCOF1, POLR1B, POLR1C, and POLR1D;
  heterozygous POLR1D causes dominant TCS2 and rare biallelic POLR1D variants
  cause recessive TCS. POLR1A-related acrofacial dysostosis (Cincinnati type) is
  a close ribosomopathy differential, not a TCS subtype or fifth TCS gene.

  The mechanism graph is atomized into ribosome-biogenesis failure, a
  TCOF1-specific oxidative DNA-damage-response arm, p53-dependent apoptosis,
  cranial neural crest deficiency, and serial arch-derivative maldevelopment.
  The trigger, intermediate, and tissue-consequence nodes conform to the three
  corresponding nodes of the pharyngeal-arch serial-homology module. All four
  causal genes are wired at the proximal node; the neural crest migration GO
  term is confined to the cell-population node rather than the skeletal output.

  The 2024 GeneReviews chapter was mined across clinical characteristics,
  diagnosis/testing, management/surveillance, and genetic counseling. No formal
  clinical diagnostic criteria or evidence-graded TCS clinical practice
  guideline has been published; however, the 2024 ERN CRANIO Delphi clinical
  consensus statement (PMID:38801252; 92 experts and three patient
  representatives) now provides multidisciplinary diagnostic and treatment
  consensus and is incorporated throughout this entry.

  Current-literature review through 2026-08-17 incorporated the 1,114-person
  matched EHR study (PMID:37415506), the 222-procedure perioperative-airway
  cohort (PMID:37646339), the 103-infant NICU cohort (PMID:40280475), the
  50-person periorbital cohort (PMID:38857421), 2026 hearing-rehabilitation data
  (PMID:41949491), and emerging long-read, prenatal-genomic, and facial-image
  diagnostic studies (PMID:41017149, PMID:41857598, PMID:41817050). Selection,
  coding, sample-size, and ancestry-generalizability limits are recorded rather
  than converting those estimates into population penetrance or standard-of-care
  diagnostic claims. No disease-modifying human intervention or TCS-specific
  therapeutic trial was identified; prenatal p53 inhibition and antioxidant
  rescue remain animal experiments with a structured translation mismatch.

  Dataset discovery was triaged rather than copied wholesale. GSE10167 is a
  direct Tcof1+/- embryo dataset. GSE89420 is a mechanistically relevant
  TCOF1/DDX21 HeLa perturbation dataset and is explicitly not disease-derived
  cranial neural crest data. Both accessions were verified through the
  repository workflow; gene-only cancer hits and generic neural crest datasets
  were excluded. Published birth-frequency estimates differ (1:50,000 versus
  1:80,000), and reported genotype-phenotype correlations remain inconsistent,
  so neither is presented with false precision.

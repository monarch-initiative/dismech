    snippet: Tcof1 haploinsufficiency results in oxidative stress-induced DNA damage and neuroepithelial cell death.
    explanation: The Tcof1 mouse model identifies oxidative DNA damage as a parallel Treacle-dependent mechanism.
  downstream:

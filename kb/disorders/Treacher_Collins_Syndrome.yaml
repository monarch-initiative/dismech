    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We assessed the potential of the derived NC population to model the
      neurocristopathy, Treacher Collins Syndrome (TCS), using small interfering
      RNA (siRNA) knockdown of TCOF1 and by creating different TCOF1+/- HPSC
      lines through CRISPR/Cas9 technology.
    explanation: The primary study describes both perturbation strategies used to construct the human model.

      Cleft lip/palate Limb deformities Postaxial abnormalities (e.g., small or
      absent 5th digit incl 5th metacarpal, ulnar hypoplasia, absent 5th toe)
    explanation: The GeneReviews differential table explicitly associates the postaxial limb pattern with DHODH-related Miller syndrome, bound here to the exact MONDO postaxial acrofacial dysostosis concept.
- name: Mandibulofacial Dysostosis with Microcephaly
  disease_term:
    preferred_term: Mandibulofacial dysostosis with microcephaly
    term:
      id: MONDO:0012516
      label: mandibulofacial dysostosis-microcephaly syndrome
  description: EFTUD2-related disease shares mandibulofacial dysostosis, microtia, preauricular tags, cleft palate, and airway involvement.
  distinguishing_features:
  - Congenital or progressive microcephaly and intellectual disability are typical, whereas intellect is usually normal in TCS.
  - Facial asymmetry, esophageal atresia/tracheoesophageal fistula, and thumb abnormalities further favor EFTUD2-related disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1532/pdf/Bookshelf_NBK1532.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK1532/pdf/Bookshelf_NBK1532.pdf

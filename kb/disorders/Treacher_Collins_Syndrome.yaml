animal_models:
- species: Mus musculus
  genotype: Tcof1 haploinsufficient (Tcof1+/-)
  genes:
  - preferred_term: TCOF1
    term:
      id: hgnc:11654
      label: TCOF1
  associated_phenotypes:
  - Deficient generation and proliferation of migrating cranial neural crest cells
  - Bilateral craniofacial skeletal hypoplasia with perinatal respiratory compromise on susceptible backgrounds
  description: >-
    Germline Tcof1 haploinsufficiency is the foundational TCS model. It reproduces
    deficient mature-ribosome production, p53-dependent neuroepithelial/neural
    crest apoptosis, neural crest deficiency, and craniofacial hypoplasia.
    Phenotypic severity depends strongly on strain background, and rescue by p53
    inhibition or maternal antioxidants is prenatal animal-model evidence rather
    than an established human intervention.
  evidence:
  - reference: PMID:16938878
    reference_title: Tcof1/Treacle is required for neural crest cell formation and proliferation deficiencies that cause craniofacial abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: To investigate the developmental basis of TCS we generated a mouse model through germ-line mutation of Tcof1.
    explanation: The primary study defines the germline Tcof1 model and its developmental purpose.
  - reference: PMID:18246078
    reference_title: Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      inhibition of p53 prevents cyclin G1-driven apoptotic elimination of
      neural crest cells while rescuing the craniofacial abnormalities associated
      with mutations in Tcof1 and extending life span.
    explanation: The rescue experiment validates the p53-dependent component of the mouse model.
  - reference: PMID:26792133
    reference_title: Prevention of Treacher Collins syndrome craniofacial anomalies in mouse models via maternal antioxidant supplementation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      maternal treatment with antioxidants minimizes cell death in the
      neuroepithelium and substantially ameliorates or prevents the pathogenesis
      of craniofacial anomalies in Tcof1(+/-) mice.
    explanation: A distinct prenatal rescue supports the oxidative-stress arm in this genotype.
- species: Danio rerio
  genotype: polr1c-deficient TCS3 morpholino model
  genes:
  - preferred_term: POLR1C
    term:
      id: hgnc:20194
      label: POLR1C
  associated_phenotypes:
  - Abnormal migrated cranial neural crest distribution in the pharyngeal arches
  - Ethmoid plate craniofacial cartilage deformity
  description: >-
    Transient polr1c deficiency models TCS3 with excess facial-region reactive
    oxygen species, p53-dependent apoptosis, altered neural crest distribution,
    and craniofacial cartilage deformity. Morpholino transience and zebrafish
    anatomy limit direct fidelity to biallelic human POLR1C disease.
  evidence:
  - reference: PMID:38556235
    reference_title: p53 inhibitor or antioxidants reduce the severity of ethmoid plate deformities in zebrafish Type 3 Treacher Collins syndrome model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the restoration of polr1c expression in early embryogenesis effectively
      rescues the observed craniofacial phenotype in polr1c-deficient zebrafish.
    explanation: Genetic rescue supports specificity of the polr1c-deficient phenotype.

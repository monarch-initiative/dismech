    explanation: The GeneReviews differential table explicitly links asymmetry, epibulbar dermoid, and vertebral anomalies to hemifacial microsomia.
- name: POLR1A-Related Acrofacial Dysostosis, Cincinnati Type
  disease_term:
    preferred_term: acrofacial dysostosis Cincinnati type
    term:
      id: MONDO:0014651
      label: acrofacial dysostosis Cincinnati type
  description: >-
    This RNA-polymerase-I-related disorder shares mandibulofacial dysostosis,

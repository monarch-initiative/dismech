pathophysiology:
- name: Impaired Ribosome Biogenesis in Neural Crest Cells
  conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation
  biological_scale: MOLECULAR
  description: >-
    Dominant TCOF1, POLR1B, or POLR1D loss of function and biallelic
    POLR1C/POLR1D loss of function collectively disrupt one or more RNA
    polymerase I-associated steps in rRNA transcription, rRNA processing, and
    production of mature ribosomes. Cranial neural crest and neuroepithelial
    cells are selectively vulnerable to this nucleolar stress during early
    craniofacial development.
  genes:

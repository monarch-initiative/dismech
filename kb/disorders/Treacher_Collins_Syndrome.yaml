    conductive or mixed loss from outer- or middle-ear malformation. Noninvasive
    versus implanted systems are individualized to anatomy, age, hearing loss,
    expected benefit, and patient preferences, and bone-conduction rehabilitation
    is preferred over reconstructive canal or middle-ear surgery when those
    surgical outcomes are expected to be poor.

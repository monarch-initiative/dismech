genetic:
- name: TCOF1
  relationship_type: CAUSATIVE
  presence: Present
  subtype: TCS1
  gene_term:
    preferred_term: TCOF1
    term:
      id: hgnc:11654
      label: TCOF1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:20301704
      reference_title: Treacher Collins Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Autosomal dominant inheritance accounts for most of TCS, most commonly heterozygous pathogenic variants in TCOF1
      explanation: Confirms AD inheritance for TCOF1.
  notes: >-
    Encodes Treacle, a nucleolar phosphoprotein. More than 200 pathogenic
    variants have been reported, with truncating variants prominent. TCOF1 is
    the major TCS gene, but a fixed >90% attribution is not used here because
    ascertainment and panel composition differ across cohorts.
  evidence:
  - reference: PMID:34573374
    reference_title: 'Treacher Collins Syndrome: Genetics, Clinical Features and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the TCOF1 gene contains 27 exons which encodes the Treacle protein. In TCOF1, over 200 pathogenic variants have been identified, of which most are deletions leading to a frame-shift, that result in the formation of a termination codon.
    explanation: Details the molecular genetics of TCOF1 mutations in TCS.
  - reference: PMID:33804586
    reference_title: 'The Role of TCOF1 Gene in Health and Disease: Beyond Treacher Collins Syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: One of the crucial proteins involved in most of the key nucleolar functions is treacle phosphoprotein encoded by the TCOF1 gene.
    explanation: Identifies Treacle as a key nucleolar protein central to ribosome biogenesis.
  - reference: PMID:39920764
    reference_title: "Deciphering TCOF1 mutations in Chinese Treacher Collins syndrome patients: insights into pathogenesis and transcriptional disruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 11 mutations predominantly localized to the central repeat
      domain (CRD) and the C-terminal domain (CTD, including the nuclear
      localization sequence) of TCOF1.
    explanation: A 2025 Chinese cohort expands the observed TCOF1 variant spectrum without supplying a universal gene-attribution percentage.
  - reference: PMID:39920764
    reference_title: "Deciphering TCOF1 mutations in Chinese Treacher Collins syndrome patients: insights into pathogenesis and transcriptional disruption."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoprecipitation assays revealed that this pathogenic mutation
      attenuates the interaction between TCOF1 and transcription-related
      proteins, such as Pol II. Furthermore, cellular luciferase assays
      demonstrated that the mutation compromises the nuclear localization
      capability of TCOF1.
    explanation: Variant-expression assays support disrupted protein interactions and localization for the tested frameshift allele.

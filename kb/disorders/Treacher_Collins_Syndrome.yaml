  evidence:
  - reference: PMID:18246078
    reference_title: Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      inhibition of p53 prevents cyclin G1-driven apoptotic elimination of
      neural crest cells while rescuing the craniofacial abnormalities associated
      with mutations in Tcof1 and extending life span.
    explanation: Rescue by p53 inhibition establishes the p53-apoptosis effector in Tcof1-deficient embryos.
  - reference: PMID:38556235
    reference_title: p53 inhibitor or antioxidants reduce the severity of ethmoid plate deformities in zebrafish Type 3 Treacher Collins syndrome model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The pathogenesis of TCS-3 linked to polr1c involves the activation of
      apoptosis-dependent p53 pathways within neural crest cells (NCCs).
    explanation: A POLR1C-deficient zebrafish model extends the p53-apoptosis mechanism beyond TCOF1.
  downstream:
  - target: Cranial Neural Crest Cell Deficiency
    causal_link_type: DIRECT
    description: Excess apoptosis reduces the generation and survival of migrating cranial neural crest cells.
    evidence:
    - reference: PMID:18246078
      reference_title: Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        inhibition of p53 prevents cyclin G1-driven apoptotic elimination of
        neural crest cells while rescuing the craniofacial abnormalities associated
        with mutations in Tcof1 and extending life span.
      explanation: Prevention of apoptotic neural crest elimination rescues the modeled phenotype.
- name: Cranial Neural Crest Cell Deficiency
  conforms_to: pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis
  biological_scale: CELLULAR
  description: >-
    Reduced formation, proliferation, survival, and migration leave too few
    cranial neural crest cells to populate the first and second pharyngeal
    arches. Human TCOF1-haploinsufficient neural crest cells independently show
    a migration defect, so this node is a population-level developmental state
    rather than apoptosis itself.

name: Treacher Collins Syndrome
creation_date: '2026-05-28T12:00:00Z'
synonyms:
- Mandibulofacial dysostosis without limb anomalies
- Franceschetti-Klein syndrome
- TCS
description: >-
  Treacher Collins syndrome (TCS) is a genetically heterogeneous congenital
  craniofacial disorder characterized by bilateral and symmetric hypoplasia of
  the zygomatic bones, maxilla, and mandible, with malar flattening,
  micrognathia, downslanted palpebral fissures, lower-eyelid abnormalities,
  external and middle ear anomalies, and conductive hearing loss. Most TCS is
  autosomal dominant, while biallelic POLR1C or, rarely, POLR1D variants cause
  autosomal recessive disease. Pathogenic variants in TCOF1, POLR1B, POLR1C,
  or POLR1D disturb nucleolar function and ribosome biogenesis, activating
  p53-dependent apoptosis and depleting cranial neural crest cells during
  embryogenesis. Published prevalence estimates range from approximately 1 in
  50,000 to 1 in 80,000, and intellect is typically normal.
category: Mendelian
parents:
- Mandibulofacial dysostosis
disease_term:
  preferred_term: Treacher Collins syndrome
  term:
    id: MONDO:0002457
    label: Treacher-Collins syndrome
has_subtypes:
- name: TCS1
  display_name: Treacher Collins Syndrome 1 (TCOF1)
  description: >-
    The most common subtype, caused by heterozygous pathogenic variants in
    TCOF1 encoding Treacle, a nucleolar phosphoprotein required for ribosomal
    DNA transcription and ribosome biogenesis.
  subtype_term:
    preferred_term: Treacher Collins syndrome 1
    term:
      id: MONDO:0007944
      label: Treacher Collins syndrome 1
  evidence:

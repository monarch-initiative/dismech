  evidence:
  - reference: PMID:16938878
    reference_title: Tcof1/Treacle is required for neural crest cell formation and proliferation deficiencies that cause craniofacial abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Tcof1/Treacle regulates proliferation by controlling the production of mature ribosomes.
    explanation: The Tcof1 mouse model directly links Treacle dosage to mature-ribosome production.
  - reference: PMID:29364875
    reference_title: Tissue-selective effects of nucleolar stress and rDNA damage in developmental disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      genetic perturbations associated with Treacher Collins syndrome, a
      craniofacial disorder caused by heterozygous mutations in components of
      the Pol I transcriptional machinery or its cofactor TCOF1 (ref. 1), lead
      to relocalization of DDX21 from the nucleolus to the nucleoplasm, its loss
      from the chromatin targets, as well as inhibition of rRNA processing and
      downregulation of ribosomal protein gene transcription.
    explanation: Human-cell perturbations show the shared nucleolar and rRNA-processing defect.
  - reference: PMID:24690222
    reference_title: "Treacher Collins Syndrome: the genetics of a craniofacial disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The association of the TCOF1 gene product, Treacle, and gene products of
      POLR1C and POLR1D with ribosome biosynthesis suggests that a loss of
      function mutation in these genes disrupts ribosome biosynthesis in
      constituent neural crest cells and neuroepithelium leading to apoptosis.
    explanation: This review supplies cross-gene context; the primary-model evidence above supports the mechanistic nodes.
  - reference: PMID:31649276
    reference_title: POLR1B and neural crest cell anomalies in Treacher Collins syndrome type 4.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of polr1b in zebrafish induced an abnormal craniofacial
      phenotype mimicking TCS that was associated with altered ribosomal gene
      expression, massive p53-associated cellular apoptosis in the
      neuroepithelium, and reduced number of NCC derivatives.
    explanation: The primary TCS4 study supplies gene-local support that POLR1B perturbation disrupts ribosomal expression and the shared neural-crest mechanism.
  - reference: PMID:27448281
    reference_title: The Roles of RNA Polymerase I and III Subunits Polr1c and Polr1d in Craniofacial Development and in Zebrafish Models of Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistically, we discovered that polr1c and polr1d loss-of-function
      results in deficient ribosome biogenesis, Tp53-dependent neuroepithelial
      cell death and a deficiency of migrating neural crest cells, which are
      the primary progenitors of the craniofacial skeleton.
    explanation: Stable polr1c and polr1d mutant zebrafish provide gene-local primary evidence for the shared ribosome-biogenesis defect.
  downstream:
  - target: p53-Dependent Neuroepithelial Apoptosis
    causal_link_type: DIRECT
    description: Nucleolar stress stabilizes p53 and activates apoptosis in neuroepithelial and neural crest progenitor cells.
    evidence:
    - reference: PMID:18246078
      reference_title: Prevention of the neurocristopathy Treacher Collins syndrome through inhibition of p53 function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Haploinsufficiency of Tcof1 perturbs mature ribosome biogenesis,
        resulting in stabilization of p53 and the cyclin G1-mediated cell-cycle
        arrest that underpins the specificity of neuroepithelial apoptosis and
        neural crest cell hypoplasia characteristic of TCS.
      explanation: The mouse model directly connects impaired ribosome biogenesis to p53 stabilization and apoptosis.
- name: TCOF1-Associated Oxidative DNA Damage
  biological_scale: CELLULAR
  description: >-
    In TCOF1-associated TCS, reduced Treacle-dependent DNA-damage response and
    repair increase oxidative DNA damage in the embryonic neuroepithelium. This
    is a TCOF1-specific parallel input to cell death and should not be assumed
    for every POLR1B/POLR1C/POLR1D genotype.
  genes:
  - preferred_term: TCOF1

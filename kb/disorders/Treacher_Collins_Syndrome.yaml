inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Most TCS follows autosomal dominant inheritance with marked variable
    expressivity. About 55%-61% of autosomal dominant cases are de novo, and
    each child of an affected individual has a 50% chance of inheriting the
    pathogenic variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Autosomal dominant inheritance accounts for most of TCS, most commonly heterozygous pathogenic variants in TCOF1 and less commonly heterozygous pathogenic variants in POLR1B or POLR1D.
    explanation: GeneReviews confirms autosomal dominant inheritance as the predominant pattern for TCS.
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: About 55%-61% of individuals with autosomal dominant TCS have the disorder as the result of a de novo pathogenic variant.
    explanation: High de novo rate explains sporadic cases.
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Each child of an individual with autosomal dominant TCS has a 50% chance of inheriting the pathogenic variant.
    explanation: GeneReviews provides the recurrence risk for offspring in autosomal dominant TCS.
- name: Autosomal recessive inheritance
  description: >-
    A minority of TCS is caused by biallelic pathogenic variants in POLR1C or
    POLR1D. When both parents are heterozygous, each pregnancy has a 25% chance
    of an affected child, a 50% chance of a carrier, and a 25% chance of a child
    who is unaffected and not a carrier.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Autosomal recessive inheritance (biallelic pathogenic variants in POLR1C or POLR1D) accounts for a minority of TCS.
    explanation: GeneReviews documents the autosomal recessive minority of TCS.
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      each sib of an individual with autosomal recessive TCS has at conception
      a 25% chance of being affected, a 50% chance of being an asymptomatic
      carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews provides the sibling recurrence risks for autosomal recessive TCS.

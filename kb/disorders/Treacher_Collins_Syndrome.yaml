- name: p53-Dependent Neuroepithelial Apoptosis
  biological_scale: CELLULAR
  description: >-
    Ribosomal/nucleolar stress, and in TCOF1 deficiency oxidative DNA damage,
    stabilize p53 and drive excessive apoptosis during the developmental window
    that generates cranial neural crest cells. Genetic or pharmacologic p53
    inhibition rescues craniofacial development in animal models without
    restoring ribosome biogenesis, supporting apoptosis as a downstream
    effector rather than p53 inhibition as an established human treatment.
  cell_types:
  - preferred_term: Neuroepithelial cell
    term:
      id: CL:0000710
      label: neurecto-epithelial cell

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We also report for the first time an impairment of migration in TCOF1+/- NC and mesenchymal stem cells.
      explanation: The modeled mechanism is directly measured in the engineered human cells.
  findings:
  - statement: TCOF1+/- human neural crest cells recapitulate the abnormal cell-death phenotype of the murine TCS model and add a migration deficit.
    supporting_text: >-
      The NC cells derived from TCOF1+/- HPSC recapitulate the phenotype of the
      reported TCS murine model. We also report for the first time an impairment
      of migration in TCOF1+/- NC and mesenchymal stem cells.
    evidence:
    - reference: PMID:30375284
      reference_title: A Novel Human Pluripotent Stem Cell-Derived Neural Crest Model of Treacher Collins Syndrome Shows Defects in Cell Death and Migration.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The NC cells derived from TCOF1+/- HPSC recapitulate the phenotype of
        the reported TCS murine model. We also report for the first time an
        impairment of migration in TCOF1+/- NC and mesenchymal stem cells.
      explanation: The finding is stated directly in the model paper.
  evidence:
  - reference: PMID:30375284

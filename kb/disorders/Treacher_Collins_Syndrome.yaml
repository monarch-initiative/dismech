treatments:
- name: Craniofacial Reconstruction
  description: >-
    Zygomatic, orbital, and mandibular reconstruction is planned by a
    multidisciplinary team and individualized to anatomy, function, severity,
    and likely reoperation burden. When breathing is not a concern, final
    orthognathic surgery is preferably deferred until skeletal maturity;
    earlier functional intervention may be required for airway, feeding,
    eyelid-closure, speech, or hearing problems.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: craniofacial surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: 'Craniofacial reconstruction is often necessary: zygomatic and orbital reconstruction at about age five to seven years, and bilateral microtia and/or narrow ear canal reconstruction after age six years.'
    explanation: GeneReviews supplies commonly used age windows, which are contextualized rather than treated as universal by the newer consensus.
  - reference: PMID:38801252
    reference_title: "Optimal Diagnostic and Treatment Practices for Facial Dysostosis Syndromes: A Clinical Consensus Statement Among European Experts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The optimal timing and sequence of craniofacial reconstruction procedures
      should be individualized based on the severity of the craniofacial
      anomalies and functional problems, including mouth opening, speech,
      feeding, (sleep related) breathing, closure of the eyelids, and hearing.
    explanation: European expert consensus makes severity and function, rather than age alone, the basis for sequencing reconstruction.
  - reference: PMID:38801252
    reference_title: "Optimal Diagnostic and Treatment Practices for Facial Dysostosis Syndromes: A Clinical Consensus Statement Among European Experts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, in cases where breathing issues is not of concern, it is
      preferred to carry out (final) orthognathic surgery once the patient
      reaches skeletal maturity to avoid unnecessary reoperation.
    explanation: The consensus corrects the older unqualified pre-age-16 framing for final orthognathic surgery.

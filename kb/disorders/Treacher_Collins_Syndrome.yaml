  cell_source: CRISPR/Cas9-engineered TCOF1+/- human pluripotent stem cell lines and separate siRNA TCOF1-knockdown cultures
  culture_system: Chemically defined neural crest differentiation followed by serial-passage purification and migration assays
  publication: PMID:30375284
  description: >-
    This human developmental cell model complements the mouse studies by
    reproducing neural crest phenotypes in TCOF1-haploinsufficient cells. It
    captures cell-autonomous migration and survival behavior but not pharyngeal
    arch anatomy, tissue interactions, or the full craniofacial phenotype.
  modeled_mechanisms:

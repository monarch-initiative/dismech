    explanation: The consensus establishes initial cardiac and vertebral screening beyond craniofacial surveillance.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Genetic counseling addresses dominant and recessive inheritance, de novo
    variation, recurrence risk including parental somatic or germline mosaicism,
    and prenatal or preimplantation testing. A molecular diagnosis can establish
    fetal status but cannot reliably predict individual severity.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the TCS-related pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: GeneReviews describes genetic testing and counseling options.
  - reference: PMID:41857598
    reference_title: "Integrating imaging and genomics in prenatal Treacher Collins syndrome: evidence for practice and policy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prenatal diagnosis of TCS relies on ultrasound detection of craniofacial
      anomalies and gene testing, but severity prediction remains challenging
      due to mosaicism and variable expressivity. Low-level parental mosaicism
      materially affects recurrence-risk counselling and should be actively
      considered when a foetal variant appears de novo.
    explanation: The 2026 systematic review and two-family report supports the mosaicism and severity-prediction caveats in counseling.
diagnosis:
- name: Clinical diagnosis
  description: >-
    No consensus clinical diagnostic criteria have been published. A clinical
    diagnosis can be made from the characteristic bilaterally symmetric facial
    and mandibular abnormalities, downslanted palpebral fissures, zygomatic and
    mandibular hypoplasia, and conductive hearing loss. Limb anomalies,
    microcephaly, or intellectual disability are unusual and should trigger a
    broader differential diagnosis.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: A compatible symmetric craniofacial and conductive-hearing-loss pattern supports TCS but does not determine the causal gene.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1532/
    reference_title: Treacher Collins Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: No consensus clinical diagnostic criteria for Treacher Collins syndrome (TCS) have been published.
    explanation: The current GeneReviews chapter explicitly limits the status of formal clinical criteria.
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Treacher Collins syndrome (TCS) is characterized by lower eyelid abnormalities, malar hypoplasia, downslanted palpebral fissures, and micro- or retrognathia due to symmetric hypoplasia of the zygomatic bones, maxilla, and mandible.
    explanation: GeneReviews describes the characteristic clinical pattern; it does not label it a consensus criterion set.
- name: Molecular genetic testing
  description: >-
    Use a craniofacial-disorder multigene panel with sequencing and
    deletion/duplication analysis, or exome/genome testing when the phenotype is
    atypical or panel testing is nondiagnostic. The molecular diagnosis is
    established by a heterozygous pathogenic variant in TCOF1, POLR1B, or
    POLR1D; biallelic pathogenic variants in POLR1C; or, rarely, biallelic
    pathogenic variants in POLR1D. A 5q deletion including TCOF1 is another
    uncommon mechanism. In unresolved cases with strong clinical suspicion,
    selected structural-variant, RNA, or long-read genomic analyses can reveal
    cryptic variants missed by routine short-read testing, but these remain
    complementary rather than first-line tests.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Identification of a genotype matching one of the established dominant or recessive TCS mechanisms establishes the molecular diagnosis.
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of TCS is established in a proband with characteristic clinical features and/or a heterozygous pathogenic variant in TCOF1, POLR1D, or POLR1B, biallelic pathogenic variants in POLR1C, or, rarely, biallelic pathogenic variants in POLR1D identified by molecular genetic testing.
    explanation: GeneReviews specifies the molecular diagnostic criteria for TCS.
  - reference: PMID:25790162
    reference_title: "Treacher Collins syndrome: a clinical and molecular study based on a large series of patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the atypical negative patients (with intellectual disability and/or
      microcephaly), we identified four patients carrying a mutation in EFTUD2
      and two patients with 5q32 deletion encompassing TCOF1 and CAMK2A in
      particular.
    explanation: The 146-person clinical/molecular series documents 5q32 deletions encompassing TCOF1 while also showing why additional features broaden the differential.
  - reference: PMID:38801252
    reference_title: "Optimal Diagnostic and Treatment Practices for Facial Dysostosis Syndromes: A Clinical Consensus Statement Among European Experts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overall, targeted genetic analyses are preferred in patients with a
      phenotype strongly suggesting a specific FDS, and broader genetic analyses
      (eg, whole exome or genome sequencing) in those with atypical phenotypes
      (113) and in those left without genetic confirmation with older genetic
      analyses.
    explanation: The European consensus supplies a complete, phenotype-stratified testing recommendation.
  - reference: PMID:41017149
    reference_title: Long-read DNA and RNA sequencing reveal an intronic retrotransposon insertion in TCOF1 causing Treacher Collins syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-read genome sequencing (lrGS) resolved a deep intronic 3.5 kb
      SINE-VNTR-Alu (SVA) retrotransposon insertion in intron 17 of TCOF1.
      Long-read RNA sequencing (lrRNA-seq) demonstrated that the insertion was
      partially exonized inducing isoform switch to the shorter non-canonical
      TCOF1 isoform c.
    explanation: This two-sibling study shows the selective diagnostic value of long-read DNA/RNA methods after conventional testing is unrevealing.
- name: Craniofacial and Temporal-Bone CT
  description: >-
    Craniofacial CT defines zygomatic and mandibular anatomy for surgical
    planning. In infants with conductive hearing loss, axial and coronal CT can
    assess the external canal, middle-ear ossicles and cavity, inner ear, head,
    and neck anatomy.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: Typical findings include zygomatic-arch hypoplasia or aplasia, mandibular retrognathia, canal atresia/stenosis, and middle-ear malformation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1532/pdf/Bookshelf_NBK1532.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK1532/pdf/Bookshelf_NBK1532.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In those w/conductive hearing loss identified at age <6 mos:
      craniofacial CT scan (axial & coronal slices) to assess anatomy of head &
      neck, external auditory canal, middle ear, & inner ear
    explanation: GeneReviews Table 4 provides the complete age, indication, acquisition planes, and anatomic scope of the recommended CT evaluation.
  - reference: PMID:34573374
    reference_title: 'Treacher Collins Syndrome: Genetics, Clinical Features and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of significant importance is (computed tomography) CT scanning, used to
      document the anatomy of the head in order to prepare a plan for surgery,
      to recognize defects of hearing organs as well as to document progress in
      different stages of treatment
    explanation: This clinical review supports the craniofacial surgical-planning role and hearing-organ assessment.

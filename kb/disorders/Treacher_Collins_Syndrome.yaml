      (Guion-Almeida type) AD Mandibulofacial dysostosis Microtia Preauricular
      skin tags Microcephaly is present in most affected persons. Intellectual
      disability Asymmetry of facial features
    explanation: The GeneReviews differential table explicitly links microcephaly, intellectual disability, and asymmetry to EFTUD2-related mandibulofacial dysostosis.
- name: Craniofacial Microsomia
  disease_term:
    preferred_term: Craniofacial microsomia
    term:
      id: MONDO:0015397
      label: craniofacial microsomia
  description: Craniofacial microsomia can share mandibular/maxillary hypoplasia, microtia, ear-canal atresia, preauricular tags, and clefting.
  distinguishing_features:
  - Craniofacial microsomia is usually unilateral or bilaterally asymmetric rather than the characteristic bilateral symmetry of TCS.
  - Epibulbar dermoids and vertebral anomalies, including Klippel-Feil anomaly, favor the craniofacial microsomia/Goldenhar spectrum.
  evidence:

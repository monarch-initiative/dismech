differential_diagnoses:
- name: RAP1B-related Kabuki-like syndrome
  description: >-
    A separate RAP1B phenotype, reported in 2015 in a patient with Kabuki-like
    dysmorphology, where complementation studies indicated loss of function and
    a MEK/ERK pathway defect. Same gene, opposite mechanistic direction and a
    different phenotype; it should not be merged with this entity.
- name: Kabuki syndrome
  description: >-
    The dysmorphism in RAP1B-related syndromic thrombocytopenia has been called
    Kabuki-like, and the earliest RAP1B patient was ascertained in a Kabuki
    cohort. Kabuki syndrome is caused by KMT2D or KDM6A variants and does not
    have constitutional thrombocytopenia as a defining feature.
- name: ACTB-related syndromic thrombocytopenia
  description: >-
    Heterozygous variants in the 3'-coding region of ACTB produce mild
    developmental disability, microcephaly and thrombocytopenia - a three-way
    overlap with this entity across its neurodevelopmental, head-size and
    platelet features. The mechanism is different: beta-cytoplasmic actin
    filament perturbation recruiting thrombocytopenia-associated actin-binding
    proteins, rather than integrin inside-out signalling. Distinguished on the
    malformation pattern and on gene.
  evidence:
  - reference: PMID:30315159
    reference_title: "Variants in exons 5 and 6 of ACTB cause syndromic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with clinical features distinct from BWCFF, including mild developmental disability, microcephaly, and thrombocytopenia with platelet anisotropy."
    explanation: >-
      Names the three overlapping features, which is what makes this entity a
      differential rather than a distant relative.
- name: Other syndromic constitutional thrombocytopenias
  description: >-
    More than forty genes now cause syndromic thrombocytopenia, several of them
    in the actin-cytoskeleton and Rho-GTPase network, including MYH9, WAS and
    DIAPH1. RAP1B is distinguished by its position at the integrin inside-out
    switch and by the congenital malformation pattern.
discussions:
- discussion_id: thc11_gof_causes_a_deficit
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disrupted Megakaryocyte Proplatelet Formation
  prompt: >-
    How does a gain-of-function variant in an integrin-activating switch produce
    a low platelet count rather than a hyperactive one?
  rationale: >-
    The direction of effect is experimentally established: G12V, G12E and G60R
    all increase RAP1B activation, talin recruitment and integrin activation.
    The phenotype is nonetheless a deficit. The explanation this entry curates
    is that RAP1 signalling is separately required for megakaryocyte proplatelet
    formation, so a constitutively active switch disrupts production. That
    account comes from mouse megakaryocyte knockouts. Human marrow from a variant
    carrier does show an abnormal megakaryocyte compartment - maturation defects
    and hypolobed forms - but proplatelet formation itself has not been measured
    in a human megakaryocyte carrying a hotspot variant. An alternative the
    literature has not excluded is peripheral consumption or clearance of
    constitutively activated platelets, which would predict a different marrow
    picture.
- discussion_id: thc11_mouse_lesion_is_not_the_human_lesion
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disrupted Megakaryocyte Proplatelet Formation
  prompt: >-
    Can a Rap1a/Rap1b double knockout tell us what a monoallelic RAP1B
    gain-of-function variant does to human megakaryocytes?
  rationale: >-
    The mouse evidence for this node is a megakaryocyte-specific deletion of
    both Rap1 isoforms. That lesion is null rather than activating, homozygous
    rather than monoallelic, and covers both isoforms because they are redundant
    in mouse. The same paper reports that deleting Rap1b alone leaves the
    platelet count normal, so the model cannot be read as a Rap1b-dose model of
    the human disease. What it does establish is that the RAP1 pathway is
    required for proplatelet formation, which is the premise the node needs; it
    does not establish that the human variants act through that step.

    The human megakaryocyte compartment is not unobserved, and an earlier
    version of this rationale implied it was. Marrow biopsy and smear in a
    RAP1B-variant patient show maturation defects, granular hypoplasia and rare
    hypolobed megakaryocytes, and those findings are now curated on the node.
    What remains unobserved is narrower: proplatelet formation itself has never
    been measured in a human megakaryocyte carrying a hotspot variant, so
    whether the human lesion sits in proplatelet extension or in maturation
    upstream of it is open. Hypolobation is a maturation phenotype and mildly
    favours the second reading, which is not what this node asserts.
  proposed_experiments:
  - experiment_id: thc11_patient_megakaryocyte_proplatelet
    name: Proplatelet formation in patient-derived megakaryocytes
    description: >-
      Differentiate megakaryocytes from induced pluripotent stem cells carrying
      a patient G12 or G60 hotspot variant and from isogenic corrected controls,
      and measure proplatelet extension and platelet release alongside RAP1B
      activation state and integrin activation.
    would_support:
    - pathophysiology#Disrupted Megakaryocyte Proplatelet Formation
    supporting_outcome:
    - >-
      Variant megakaryocytes extend fewer proplatelets and release fewer
      platelets than isogenic controls, which would move this node from a
      mouse-pathway inference to a demonstrated human mechanism.
    would_refute:
    - pathophysiology#Disrupted Megakaryocyte Proplatelet Formation
    refuting_outcome:
    - >-
      Variant megakaryocytes produce platelets normally, which would redirect
      the search to peripheral consumption or clearance of constitutively
      activated platelets.
- discussion_id: thc11_immunodeficiency_ascertainment
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Combined Immunodeficiency
  prompt: >-
    Is combined immunodeficiency part of the germline THC11 phenotype, or
    specific to the somatic-mosaic patient?
  rationale: >-
    Only the somatic-mosaic patient had overt combined immunodeficiency; the
    germline patients had mild lymphopenia and neutropenia without clinical
    immunodeficiency. The authors state directly that neither the immune nor the
    platelet function of those patients had been investigated, so the contrast
    may be ascertainment rather than biology. The mosaic patient's variant
    allele frequency fell over time in the peripheral immune compartment while
    remaining stable in bone marrow, which is a further reason not to generalise
    from that case. Immune-function testing of the germline patients would
    settle it.
notes: >-
  The entire published series is five or six individuals. No prevalence record
  is curated and no phenotype carries an HPO frequency band, because a
  proportion of five is not a penetrance. Where a feature is known to be
  non-universal it is said so in the phenotype description, and the
  per-patient counts from the three-patient comparison table are quoted on the
  phenotypes drawn from it.

  Two REFUTE items appear and neither is a curation error, but they refute
  different kinds of thing. On the proplatelet-formation node, PMID:30131434's
  finding that Rap1b-null mice have a normal platelet count is curated as
  REFUTE: it does not contradict the human disease, whose lesion is activating,
  but it does contradict reading that mouse as a model of this node, which is
  what the attached HUMAN_MODEL_MISMATCH discussion turns on. On the romiplostim
  treatment the REFUTE is against the intervention's efficacy rather than
  against a mechanism - the drug was given and the count did not move. That is
  an unusual grading and a deliberate one: a documented non-response is
  evidence, and leaving it in a description would lose the fact that a
  TPO-receptor agonist has been tried here and failed, which is itself
  mechanistically informative.

  Microcephaly was curated as a REFUTE in an earlier version of this entry,
  against the third patient's normal head circumference. That was wrong and it
  is now SUPPORT: the source scores postnatal microcephaly 2/3 and records the
  third patient's as resolved with no measurement available from the affected
  period, which is not a documented normal. This paragraph went on describing
  the old state for a round after the change - the hazard CLAUDE.md names,
  where prose about the entry rots when the entry moves under it.

  The molecular function on the first node is GTPase activity DECREASED while
  the genetic context is GAIN_OF_FUNCTION, and the two are consistent rather
  than contradictory: losing the hydrolysis step is what leaves the switch
  constitutively on. `GO:0007264` (small GTPase-mediated signal transduction)
  was tried first for that slot and is not in the MolecularFunctionTerm enum,
  correctly — it is a biological process. GTPase activity is also the more
  precise claim, and it is the one PMID:37850357 states in those words.

  `variant_origin: GERMLINE` describes the germline series, which is the entity
  MONDO:0958000 names. The somatic-mosaic patient in PMID:39225097 supplies the
  functional characterisation of the variants and the immunodeficiency and
  transplant observations; the mosaicism is stated in the inheritance and
  discussion text rather than folded into that slot.

  `directness: INDIRECT` on the founding report's gain-of-function sentence
  records that PMID:32627184 proposed the direction from variant position and
  said so — "We hypothesize... possibly through a gain of function mechanism".
  The experimental demonstration is PMID:39225097. Reading the two as
  equivalent support would overstate what the 2020 paper established.

  RAP1B has a second disease association this entry deliberately does not
  absorb: PMID:26280580 reported a germline RAP1B variant in a Kabuki-like
  patient and concluded loss of function with a MEK/ERK defect. Same gene,
  opposite direction, different phenotype. It is carried as a differential
  diagnosis.

  The deep-research report committed alongside cites OMIM 179530 where
  MONDO:0958000 xrefs 620654, which `just preflight-dr` flags as a WARN. 179530
  is the RAP1B gene MIM and 620654 the phenotype MIM, so this is a
  gene-versus-phenotype confusion rather than a wrong disease; identity was
  checked manually against the primary reports before curating. The same
  preflight reports a "rival gene HP" at 16 mentions, which is the HPO CURIE
  prefix being counted as the haptoglobin gene symbol, not a second disease
  entity.

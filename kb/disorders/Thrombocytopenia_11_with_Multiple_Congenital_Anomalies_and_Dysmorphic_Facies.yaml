name: Thrombocytopenia 11 with Multiple Congenital Anomalies and Dysmorphic Facies
creation_date: "2026-09-15T13:18:10Z"
category: Mendelian
description: >-
  THC11 is an ultrarare syndromic thrombocytopenia caused by monoallelic de novo
  gain-of-function variants in RAP1B, the small GTPase that acts as the final
  common switch for integrin inside-out activation. The recurrent variants sit
  at two hotspots — G12 in the P-loop and G60 — that disrupt the GTPase cycle
  and hold RAP1B in its GTP-bound state. Affected individuals have
  thrombocytopenia together with neurodevelopmental delay, growth delay, facial
  dysmorphism and congenital malformations of heart, kidney, brain and skeleton;
  mild lymphopenia and neutropenia are usual, and one patient had frank combined
  immunodeficiency.

  The mechanism has a genuine paradox in it, and this entry keeps the paradox
  visible rather than smoothing it. The variants increase RAP1B activation,
  talin recruitment and integrin activation, yet the platelet phenotype is a
  deficit. The resolution the literature offers is that RAP1 signalling is
  required for megakaryocyte proplatelet formation as well as for platelet
  integrin activation, so a constitutively active switch disturbs production
  rather than merely amplifying function. That second half rests on a mouse
  megakaryocyte double knockout for the proplatelet step itself. Human marrow
  from a variant carrier does show an abnormal megakaryocyte compartment -
  maturation defects, granular hypoplasia and rare hypolobed forms - so the
  human arm is not unobserved; what has never been measured in a human
  megakaryocyte carrying a hotspot variant is proplatelet formation. Those are
  maturation findings, which if anything point upstream of the step this
  resolution names.

  RAP1B carries a second, separate disease association: a 2015 report described
  a germline RAP1B variant in a Kabuki-like presentation and concluded loss of
  function. That is a different phenotype reached by the opposite mechanism,
  and the two should not be merged.

inheritance:
- name: Autosomal Dominant
  description: >-
    All reported germline cases are heterozygous and de novo. One further case
    carried the variant as a post-zygotic somatic mosaic rather than in the
    germline, which this entry records separately because it changes what the
    inheritance statement means for that patient.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:37850357
    reference_title: "Adding to the evidence of gene-disease association of RAP1B and syndromic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data supports the causal role of monoallelic RAP1B variants that disrupt RAP1B GTPase activity in syndromic congenital thrombocytopenia."
    explanation: >-
      States the monoallelic requirement, in the report that added the fourth
      and fifth individuals to the series.
pathophysiology:
- name: RAP1B Hotspot Variant Disrupts the GTPase Cycle
  biological_scale: MOLECULAR
  description: >-
    RAP1B is a RAS-superfamily small GTPase that cycles between GDP- and
    GTP-bound states. The recurrent disease variants cluster at two positions
    controlling that cycle: G12 in the P-loop, the residue the conformational
    switch depends on, and G60. Substitutions there disrupt GTPase activity, so
    hydrolysis fails and the protein persists in its active GTP-bound form.
    The molecular function is therefore recorded as DECREASED while the variant
    is a gain of function at the level of signalling output — the two are
    consistent, because losing the off-switch is what makes the switch
    constitutive.
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: RAP1B
      term:
        id: hgnc:9857
        label: RAP1B
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:39225097
    reference_title: "Somatic RAP1B gain-of-function variant underlies isolated thrombocytopenia and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that G12E and the previously described G12V and G60R were gain-of-function variants that increased RAP1B activation, talin recruitment, and integrin activation"
    explanation: >-
      Functional characterisation of all three recurrent variants together,
      establishing the direction of effect experimentally rather than by
      inference from variant position.
  - reference: PMID:39225097
    reference_title: "Somatic RAP1B gain-of-function variant underlies isolated thrombocytopenia and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The residue G12 in the P-loop is required for the RAP1B-GTPase conformational switch."
    explanation: >-
      Explains why G12 is a hotspot: it is the residue the conformational switch
      depends on.
  - reference: PMID:37850357
    reference_title: "Adding to the evidence of gene-disease association of RAP1B and syndromic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monoallelic RAP1B variants that disrupt RAP1B GTPase activity"
    explanation: >-
      States the effect on GTPase activity specifically, which is the molecular
      function this node records as decreased.
  downstream:
  - target: Constitutive Integrin Inside-Out Activation
    description: >-
      Persistently GTP-bound RAP1B recruits talin to the integrin beta tail,
      which is the committed step of inside-out activation.
  - target: Disrupted Megakaryocyte Proplatelet Formation
    description: >-
      RAP1 signalling is also required for proplatelet formation, so a
      constitutively active switch disturbs platelet production rather than only
      platelet function. This edge is the entry's proposed resolution of the
      gain-of-function-causes-a-deficit paradox and rests on mouse megakaryocyte
      data; see the attached discussion.
- name: Constitutive Integrin Inside-Out Activation
  biological_scale: CELLULAR
  description: >-
    Talin recruitment to the integrin cytoplasmic tail converts integrins to
    their high-affinity conformation. In the disease variants this step is
    driven constitutively rather than on demand, and the downstream effects are
    not confined to platelets: T cell proliferation and migration are altered by
    the same mechanism, which is why the haematological phenotype extends to
    lymphocytes.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: integrin activation
    term:
      id: GO:0033622
      label: integrin activation
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:39225097
    reference_title: "Somatic RAP1B gain-of-function variant underlies isolated thrombocytopenia and immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "thereby modifying late responses such as platelet activation, T cell proliferation, and migration"
    explanation: >-
      Names the cellular consequences measured downstream of the integrin
      change, in both the platelet and the lymphoid compartment.
  downstream:
  - target: Combined Immunodeficiency
    description: >-
      Altered T cell proliferation and migration is the route from the integrin
      defect to the immune phenotype.
  - target: Disproportionate Bleeding Tendency
    description: >-
      Constitutively activated integrin gives platelets that are abnormal in
      function as well as few, which is the reading the source's own observation
      supports: bleeding was worse than the platelet count alone predicted. This
      is an inference from the disproportion rather than a measured platelet
      function defect, and is curated as such.
- name: Disrupted Megakaryocyte Proplatelet Formation
  biological_scale: CELLULAR
  description: >-
    Megakaryocytes extend proplatelets to release platelets, and that process
    depends on RAP1 signalling. Megakaryocyte-specific deletion of both mouse
    Rap1 isoforms produces marked macrothrombocytopenia through impaired
    proplatelet formation, establishing production rather than survival as the
    RAP1-dependent step. Deleting Rap1b alone does not reduce the platelet
    count, so the mouse shows the pathway matters without modelling the human
    monoallelic gain-of-function lesion.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  evidence:
  - reference: PMID:30131434
    reference_title: "Functional redundancy between RAP1 isoforms in murine platelet production and function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, Rap1a/b-mKO mice displayed a marked macrothrombocytopenia due to impaired proplatelet formation by megakaryocytes."
    explanation: >-
      Establishes that RAP1 signalling is required for proplatelet formation and
      that its disturbance produces thrombocytopenia, which is the mechanism
      this node asserts. The lesion is a double knockout in mouse, not the human
      variant; see the attached discussion.
  - reference: PMID:30131434
    reference_title: "Functional redundancy between RAP1 isoforms in murine platelet production and function."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking the predominant isoform, RAP1B, display a partial platelet integrin activation defect and have a normal platelet count"
    explanation: >-
      Deleting Rap1b alone leaves the mouse platelet count normal, so the double
      knockout above cannot be read as a Rap1b-dose model of this disease.
      Curated as REFUTE against that reading of the model rather than against
      the node itself, whose human lesion is activating rather than null.
  - reference: PMID:39225097
    reference_title: "Somatic RAP1B gain-of-function variant underlies isolated thrombocytopenia and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BM biopsy at the age of 3 months (M3) showed megakaryocyte maturation defects and granular hypoplasia, while BM immune phenotype and karyotype were normal."
    explanation: >-
      Human marrow megakaryocyte pathology in a RAP1B-variant patient. Does not
      itself demonstrate a proplatelet-formation defect - a maturation
      abnormality on biopsy is a different observation - but it establishes that
      the human megakaryocyte compartment is abnormal, which the node previously
      rested on mouse data alone.
  - reference: PMID:39225097
    reference_title: "Somatic RAP1B gain-of-function variant underlies isolated thrombocytopenia and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BM smear at M18 showed decreased cellularity for age and only rare, abnormal, hypolobed megakaryocytes (Figure 1A)."
    explanation: >-
      The morphological detail: megakaryocytes are few, abnormal and hypolobed.
      Hypolobation is a maturation phenotype, so this constrains what the human
      lesion looks like without identifying the step.
  downstream:
  - target: Thrombocytopenia
    description: >-
      Impaired proplatelet formation reduces the circulating platelet count.

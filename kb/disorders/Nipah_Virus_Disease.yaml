name: Nipah Virus Disease
creation_date: '2026-07-24T23:11:02Z'
updated_date: '2026-07-24T23:11:02Z'
category: Infectious Disease
description: >-
  Nipah virus disease is a zoonotic infection caused by Nipah virus, a
  henipavirus in the family Paramyxoviridae, whose natural reservoir is
  fruit bats of the genus Pteropus. Human infection follows exposure to
  infected bats, intermediate hosts such as pigs, or food contaminated
  with bat secretions (notably raw date palm sap), and produces a severe
  febrile illness that can progress to encephalitis, respiratory distress,
  and death with high case-fatality.
disease_term:
  term:
    id: MONDO:0020499
    label: Nipah virus disease
  preferred_term: Nipah Virus Disease
parents:
- Viral Encephalitis
- Zoonosis
infectious_agent:
- name: Nipah virus
  infectious_agent_term:
    preferred_term: Nipah virus
    term:
      id: NCBITaxon:121791
      label: Nipah henipavirus
  description: >-
    Nipah virus is an enveloped, negative-sense single-stranded RNA virus
    of the genus Henipavirus (family Paramyxoviridae) that uses ephrin-B2
    and ephrin-B3 as cellular entry receptors.
agent_life_cycle:
  description: >-
    Nipah virus is maintained in nature in Pteropus fruit bat reservoirs and
    spills over to humans directly or via intermediate mammalian hosts.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental host
  - preferred_term: Pteropus fruit bat
    term:
      id: NCBITaxon:9402
      label: Pteropus
    role: natural reservoir
transmission:
- name: Foodborne transmission via contaminated date palm sap
  description: >-
    Consumption of raw date palm sap contaminated by fruit bat saliva or
    urine is a major route of human infection in Bangladesh and India.
- name: Intermediate host (pig) transmission
  description: >-
    Close contact with infected pigs drove the initial Malaysian outbreak,
    with pigs acting as an amplifying intermediate host.
- name: Human-to-human transmission
  description: >-
    Person-to-person spread occurs through close contact with respiratory
    secretions and body fluids, especially in healthcare and caregiving
    settings.
pathophysiology:
- name: Endothelial tropism and systemic vasculitis
  description: >-
    Nipah virus infects endothelial cells and smooth muscle of small blood
    vessels through ephrin-B2/ephrin-B3 receptors, producing a systemic
    vasculitis with thrombosis, fibrinoid necrosis, and syncytial giant
    cells.
- name: Central nervous system invasion
  description: >-
    The virus crosses into the central nervous system and infects neurons,
    causing an acute encephalitis with vasculitis-induced microinfarcts.
- name: Syncytium formation
  description: >-
    Fusion of infected cells mediated by the viral fusion (F) and
    glycoprotein (G) proteins produces multinucleated syncytia in
    endothelium and parenchyma.

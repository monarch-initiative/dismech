name: Nipah Virus Disease
creation_date: '2026-07-24T23:11:02Z'
category: Infectious Disease
description: >-
  Nipah virus disease is a zoonotic infection caused by Nipah virus, a
  henipavirus in the family Paramyxoviridae, whose natural reservoir is
  fruit bats of the genus Pteropus. Human infection follows exposure to
  infected bats, intermediate hosts such as pigs, or food contaminated
  with bat secretions (notably raw date palm sap), and produces a severe
  febrile illness that can progress to encephalitis, respiratory distress,
  and death with high case-fatality.
disease_term:
  term:
    id: MONDO:0020499
    label: Nipah virus disease
  preferred_term: Nipah Virus Disease
parents:
- Viral Encephalitis
- Zoonosis
infectious_agent:
- name: Nipah virus
  infectious_agent_term:
    preferred_term: Nipah virus
    term:
      id: NCBITaxon:3052225
      label: Henipavirus nipahense
  description: >-
    Nipah virus is an enveloped, negative-sense single-stranded RNA virus
    of the genus Henipavirus (family Paramyxoviridae) whose natural reservoir
    is Pteropus fruit bats.
  evidence:
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nipah virus (NiV) is an emerging zoonotic paramyxovirus to which is attributed numerous high mortality outbreaks in South and South-East Asia"
    explanation: The review identifies NiV as a zoonotic paramyxovirus responsible for high-mortality outbreaks.
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The natural reservoir of NiV is the Pteropus bat species, which covers a wide geographical distribution extending over Asia, Oceania, and Africa."
    explanation: The review names Pteropus fruit bats as the natural reservoir of Nipah virus.
agent_life_cycle:
  description: >-
    Nipah virus is maintained in nature in Pteropus fruit bat reservoirs and
    spills over to humans directly or via intermediate mammalian hosts.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental host
  - preferred_term: Pteropus fruit bat
    term:
      id: NCBITaxon:9401
      label: Pteropus
    role: natural reservoir
transmission:
- name: Foodborne transmission via contaminated date palm sap
  description: >-
    Consumption of raw date palm sap contaminated by fruit bat saliva or
    urine is a major route of human infection in Bangladesh.
  evidence:
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in Bangladesh, the viral transmission occurs directly from bat to human mainly by ingestion of contaminated fresh date palm sap."
    explanation: The review attributes Bangladeshi human infection primarily to ingestion of contaminated date palm sap.
  - reference: PMID:39119137
    reference_title: "A systematic review on Nipah virus: global molecular epidemiology and medical countermeasures development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Transmission routes vary by country, primarily through pigs in Malaysia, consumption of date palm juice in Bangladesh, and human-to-human in India."
    explanation: The systematic review lists date palm juice consumption in Bangladesh as a primary transmission route.
- name: Intermediate host (pig) transmission
  description: >-
    Close contact with infected pigs drove the initial Malaysian outbreak,
    with pigs acting as an amplifying intermediate host.
  evidence:
  - reference: PMID:10781618
    reference_title: "Clinical features of Nipah virus encephalitis among pig farmers in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ninety-three percent had had direct contact with pigs, usually in the two weeks before the onset of illness, suggesting that there was direct viral transmission from pigs to humans and a short incubation period."
    explanation: In the Malaysian outbreak 93% of patients had direct pig contact, indicating pig-to-human transmission.
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Occasionally, human outbreaks have required the presence of an intermediate amplification mammal host between bat and humans."
    explanation: The review notes that an intermediate amplifying mammalian host can bridge bat-to-human transmission.
- name: Human-to-human transmission
  description: >-
    Person-to-person spread occurs through close contact with respiratory
    secretions and body fluids, especially in healthcare and caregiving
    settings.
  evidence:
  - reference: PMID:39292378
    reference_title: "Recent Advances of Nipah Virus Disease: Pathobiology to Treatment and Vaccine Advancement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It can spread between humans through contact with body fluids."
    explanation: The review states that Nipah virus can spread between humans via body-fluid contact.
  - reference: PMID:39119137
    reference_title: "A systematic review on Nipah virus: global molecular epidemiology and medical countermeasures development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Transmission routes vary by country, primarily through pigs in Malaysia, consumption of date palm juice in Bangladesh, and human-to-human in India."
    explanation: The systematic review documents human-to-human transmission in India.
pathophysiology:
- name: Ephrin-B2/B3 receptor-mediated cell entry
  biological_scale: MOLECULAR
  description: >-
    The Nipah virus attachment glycoprotein engages the host ephrin-B2 and
    ephrin-B3 receptors to mediate entry into host cells. Because ephrin-B2 is
    evolutionarily conserved and widely expressed on vascular endothelium, and
    ephrin-B3 on neurons, the tissue distribution of these receptors is what
    determines the endothelial and neuronal tropism that drives the rest of the
    disease, and also underlies the virus's broad host-species range.
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Endothelial tropism and systemic vasculitis
    description: >-
      Ephrin-B2 is widely expressed on vascular endothelium, so receptor-mediated
      entry establishes the endothelial infection underlying systemic vasculitis.
  - target: Central nervous system invasion
    description: >-
      Ephrin-B3 expression on neurons provides the receptor basis for direct
      neuronal infection of the central nervous system.
  evidence:
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The virus enters the host cells through Ephrin B2/B3 receptors"
    explanation: States the receptor pair mediating Nipah virus entry into host cells.
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "inherent ability to use the evolutionarily conserved and widely expressed cellular receptor Ephrin B2 for entry"
    explanation: Establishes that ephrin-B2 is conserved and widely expressed, which is what makes receptor distribution determine tropism.
- name: Endothelial tropism and systemic vasculitis
  biological_scale: TISSUE
  description: >-
    Nipah virus infects vascular endothelial and smooth muscle cells,
    producing a systemic vasculitis with thrombosis and parenchymal necrosis,
    especially in the central nervous system.
  downstream:
  - target: Syncytium formation
    description: >-
      Infection of vascular endothelium is the setting in which syncytial giant
      cells arise; autopsy describes endothelial damage, necrosis and syncytial
      giant cell formation together in affected vessels.
  - target: Central nervous system invasion
    description: >-
      Vasculitis with thrombosis and parenchymal necrosis is most marked in the
      central nervous system, accompanying direct neuronal infection.
  - target: Pulmonary involvement and respiratory tract infection
    description: >-
      The same vascular changes involve the lungs, contributing to the pulmonary
      arm of clade I disease.
  evidence:
  - reference: PMID:12466131
    reference_title: "Nipah virus infection: pathology and pathogenesis of an emerging paramyxoviral zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main histopathological findings included a systemic vasculitis with extensive thrombosis and parenchymal necrosis, particularly in the central nervous system."
    explanation: Autopsy findings from human cases show systemic vasculitis with thrombosis and necrosis.
  - reference: PMID:12466131
    reference_title: "Nipah virus infection: pathology and pathogenesis of an emerging paramyxoviral zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IHC analysis showed widespread presence of Nipah virus antigens in endothelial and smooth muscle cells of blood vessels."
    explanation: Immunohistochemistry localizes Nipah antigen to vascular endothelial and smooth muscle cells.
- name: Central nervous system invasion
  biological_scale: TISSUE
  description: >-
    The virus infects neurons of the central nervous system, producing an
    acute encephalitis alongside vasculitis-associated injury.
  downstream:
  - target: Encephalitis
    description: >-
      Direct neuronal infection with accompanying vasculitis produces the acute
      encephalitis that defines symptomatic human Nipah virus disease.
  - target: Reduced consciousness
    description: >-
      Encephalitic involvement of the brain stem underlies the reduced level of
      consciousness documented in 55% of the Malaysian case series.
  - target: Seizure
    description: >-
      Cortical involvement in acute Nipah encephalitis manifests clinically as
      convulsions.
  - target: Myoclonus
    description: >-
      Brain-stem and upper cervical cord involvement produces the distinctive
      segmental myoclonus of Nipah encephalitis.
  - target: Areflexia
    description: >-
      Brain-stem and upper cervical cord involvement produces areflexia.
  - target: Hypotonia
    description: >-
      Brain-stem and upper cervical cord involvement produces hypotonia.
  evidence:
  - reference: PMID:12466131
    reference_title: "Nipah virus infection: pathology and pathogenesis of an emerging paramyxoviral zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abundant viral antigens were also seen in various parenchymal cells, particularly in neurons."
    explanation: Viral antigen is abundant in neurons, evidencing direct CNS neuronal infection.
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human infection manifests as a rapidly progressive encephalitis accounting for extremely high mortality rates."
    explanation: The review characterizes human Nipah infection as a rapidly progressive encephalitis.
- name: Syncytium formation
  biological_scale: CELLULAR
  description: >-
    Nipah virus induces fusion of infected cells into multinucleated
    syncytial giant cells, prominent in affected blood vessels.
  evidence:
  - reference: PMID:12466131
    reference_title: "Nipah virus infection: pathology and pathogenesis of an emerging paramyxoviral zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endothelial cell damage, necrosis, and syncytial giant cell formation were seen in affected vessels."
    explanation: Syncytial giant cells are observed in affected vessels of human autopsy tissue.
- name: Pulmonary involvement and respiratory tract infection
  biological_scale: TISSUE
  description: >-
    Beyond the encephalitic arm, Nipah virus produces severe pulmonary
    involvement with respiratory tract infection and vascular injury of the
    lungs. This arm is clade-dependent and is the principal feature
    distinguishing the Bangladesh/India clade I outbreaks, in which severe
    respiratory disease accompanies encephalitis and facilitates
    person-to-person transmission, from the Malaysian clade II outbreak, which
    produced a largely pure encephalitic syndrome.
  downstream:
  - target: Respiratory distress
    description: >-
      Pulmonary infection and vascular injury of the lung manifest clinically as
      respiratory difficulty and, at the severe end, acute respiratory distress
      syndrome.
  - target: Acute respiratory distress syndrome
    description: >-
      Severe pulmonary involvement progresses to the clinical and radiographic
      picture of acute respiratory distress syndrome.
  - target: Cough
    description: >-
      Respiratory tract infection manifests as cough, among the most common
      presenting symptoms in the Bangladesh outbreaks.
  evidence:
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nipah virus infection produced rapidly progressive severe illness affecting the central nervous and respiratory systems."
    explanation: Establishes the respiratory system, alongside the CNS, as a primary target of the infection.
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including a severe respiratory component, appear distinct from clinical characteristics reported during earlier outbreaks in other countries."
    explanation: Identifies the severe respiratory component as what distinguishes Bangladesh disease from the earlier Malaysian outbreak.
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "whereas many patients infected with NiV clade I had added severe pulmonary involvement"
    explanation: Attributes severe pulmonary involvement specifically to clade I infection.
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NiV clade II isolated cases led to a pure encephalitic syndrome (neurological symptoms without respiratory manifestations)"
    explanation: The contrasting clade II picture, without respiratory manifestations, establishes that the pulmonary arm is clade-dependent.
  - reference: PMID:37896758
    reference_title: "Animal Models for Henipavirus Research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Outbreaks of HeV and NiV have led to severe respiratory disease and encephalitis in humans and animals characterized by a high mortality rate."
    explanation: Corroborates severe respiratory disease as a core outcome of henipavirus outbreaks alongside encephalitis.

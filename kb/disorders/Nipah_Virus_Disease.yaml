- name: Relapsing and late-onset encephalitis
  category: Neurologic
  frequency: VERY_RARE
  description: >-
    A distinctive feature of Nipah virus disease: encephalitis recurring after
    recovery from, or after an initially mild, acute illness, and late-onset
    encephalitis appearing months to years later. Kerala investigators attribute
    it to reactivation of infection rather than a post-infectious immunological
    demyelinating process, and report it as non-contagious.
  phenotype_term:
    preferred_term: Relapsing and late-onset Nipah encephalitis
    term:
      id: HP:0002383
      label: Infectious encephalitis
    temporality: RECURRENT
  evidence:
  - reference: PMID:10781618
    reference_title: "Clinical features of Nipah virus encephalitis among pig farmers in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic relapse occurred after initially mild disease in three patients."
    explanation: |
      Pattern B quantitative support: 3 of the 94 patients in the Malaysian
      series = 3.2%, which falls in the VERY_RARE band (<5%).
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is also important to monitor Nipah survivors continuously because of the rare possibility of relapse and late-onset NiV encephalitis"
    explanation: |
      Independently corroborates the band: author wording "rare" maps to
      VERY_RARE under the Pattern C qualitative mapping in

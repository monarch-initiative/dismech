    snippet: "Late-onset reactivation encephalitis in Nipah appears to be non-contagious, but it is a concern because of the potential social stigma and significant morbidity/mortality risk associated with it."
    explanation: Characterizes the late-onset form as reactivation, non-contagious, and carrying significant morbidity and mortality risk.

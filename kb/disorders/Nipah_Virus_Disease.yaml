progression:
- phase: Incubation
  incubation_days: '6-11'
  notes: >-
    Median incubation period of 9 days among Bangladesh patients with
    well-defined exposure to another infected patient.
  evidence:
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the median incubation period was 9 days (range, 6-11 days)"
    explanation: Directly reports the median and range of the incubation period in the Bangladesh cohort.
- phase: Acute illness
  duration_days: '2-36'
  notes: >-
    Rapidly progressive illness affecting the central nervous and respiratory
    systems; among Bangladesh patients who died, death occurred a median of
    6 days after onset.
  evidence:
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among those who died, death occurred a median of 6 days (range, 2-36 days) after the onset of illness."
    explanation: Reports the interval from symptom onset to death, defining the duration of the acute fatal course.
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nipah virus infection produced rapidly progressive severe illness affecting the central nervous and respiratory systems."
    explanation: Characterizes the acute phase as rapidly progressive and multisystem.
- phase: Outcome
  notes: >-
    Case fatality is high and differs between outbreak settings: 73% in the
    Bangladesh outbreaks versus 32% in the Malaysian outbreak. Among Malaysian
    survivors, just over half recovered fully and 15% had persistent
    neurologic deficits.
  evidence:
  - reference: PMID:18444812
    reference_title: "Clinical presentation of nipah virus infection in Bangladesh."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 92 patients with Nipah virus infection, 67 (73%) of whom died."
    explanation: Reports a 73% case-fatality proportion across the four Bangladesh outbreaks.
  - reference: PMID:10781618
    reference_title: "Clinical features of Nipah virus encephalitis among pig farmers in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients (32 percent) died after rapid deterioration in their condition."
    explanation: Reports a 32% case-fatality proportion in the Malaysian outbreak, lower than the Bangladesh figure.
  - reference: PMID:10781618
    reference_title: "Clinical features of Nipah virus encephalitis among pig farmers in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty patients (53 percent) recovered fully, and 14 (15 percent) had persistent neurologic deficits."
    explanation: Quantifies full recovery and persistent neurologic sequelae among Malaysian survivors.
treatments:
- name: Supportive and intensive care
  description: >-
    Management is primarily supportive, including intensive care, management
    of encephalitis, and respiratory support; there is no licensed antiviral
    therapy or vaccine for human use.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38399954
    reference_title: "Nipah Virus: A Multidimensional Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "no therapeutic agents or vaccines have been approved for human use."
    explanation: No approved therapeutics or vaccines exist, so care remains supportive.
  - reference: PMID:39292378
    reference_title: "Recent Advances of Nipah Virus Disease: Pathobiology to Treatment and Vaccine Advancement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, no approved vaccines or treatments have been available."
    explanation: The review confirms the absence of approved vaccines or treatments, leaving supportive care as standard.
  - reference: PMID:38185127
    reference_title: "Nipah virus disease: what can we do to improve patient care?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although candidate vaccines for Nipah virus disease exist, developing new therapeutics has been underinvested."
    explanation: Explains why supportive care remains the mainstay - therapeutic development has been underinvested despite candidate vaccines existing.
  - reference: PMID:38185127
    reference_title: "Nipah virus disease: what can we do to improve patient care?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the disease it causes still carries high mortality, unchanged since the first reported outbreaks"
    explanation: Records that mortality has not improved since the first outbreaks, underscoring the limits of currently available supportive management.
  - reference: PMID:39119137
    reference_title: "A systematic review on Nipah virus: global molecular epidemiology and medical countermeasures development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "only two vaccines have progressed to clinical trials"
    explanation: Systematic-review anchor for the state of countermeasure development, contextualizing the clinical_trials section.
- name: m102.4 monoclonal antibody
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    m102.4 is a cross-reactive neutralizing human monoclonal antibody that
    targets the henipavirus attachment G glycoprotein and blocks its engagement
    of the host ephrin receptors, preventing viral entry. It is recommended as
    the specific management option to prevent severe disease in high-risk
    individuals, but global availability is limited, the disease progresses too
    rapidly for it to be given in many cases, and its activity may be restricted
    to the clade against which it was raised. No phase II/III efficacy trial has
    yet been reported.
  target_mechanisms:
  - target: Ephrin-B2/B3 receptor-mediated cell entry
    treatment_effect: INHIBITS
    description: >-
      m102.4 binds the viral attachment G glycoprotein and blocks its engagement
      of the host ephrin receptors, so it acts directly on the receptor-mediated
      entry step rather than on a downstream consequence.
    evidence:
    - reference: PMID:24130486
      reference_title: "Crystal structure of the Hendra virus attachment G glycoprotein bound to a potent cross-reactive neutralizing human monoclonal antibody."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "One cross-reactive and receptor-blocking hmAb (m102.4) was recently demonstrated to be an effective post-exposure therapy in two animal models of NiV and HeV infection"
      explanation: Describes m102.4 explicitly as receptor-blocking, which is what licenses the INHIBITS edge onto the receptor-mediated entry node.
    - reference: PMID:19888339
      reference_title: "A neutralizing human monoclonal antibody protects against lethal disease in a new ferret model of acute nipah virus infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a cross-reactive neutralizing human monoclonal antibody, m102.4, targeting the henipavirus G glycoprotein was evaluated in vivo as a potential therapeutic agent"
      explanation: Identifies the henipavirus G attachment glycoprotein as the molecular target of m102.4.
  treatment_term:
    preferred_term: antiviral agent therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: m102.4
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  evidence:
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "monoclonal antibodies (mAb) targeting the virus are recommended as the specific management option to prevent severe disease manifestations in high-risk individuals"
    explanation: Establishes m102.4 as the recommended specific management option for high-risk individuals.
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "the limited global availability of mAb and the rapid progression of the disease have interfered with its use in outbreaks"
    explanation: |
      Qualifies the recommendation: availability and disease tempo have limited
      actual use in outbreaks, so this is recorded as PARTIAL support rather than
      demonstrated clinical efficacy.
  - reference: PMID:19888339
    reference_title: "A neutralizing human monoclonal antibody protects against lethal disease in a new ferret model of acute nipah virus infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All ferrets that received m102.4 ten hours following a high dose oral-nasal Nipah virus challenge were protected from disease while all controls died."
    explanation: |
      Post-exposure protection in the ferret model. MODEL_ORGANISM - this is the
      strongest efficacy evidence available for m102.4 and it is preclinical, not
      a human outcome.
- name: Remdesivir
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Remdesivir is a nucleotide analogue prodrug used on compassionate grounds in
    the 2023 Kerala outbreak for early administration before the onset of
    encephalitis, and as post-exposure prophylaxis in the highest-risk contacts.
    Efficacy in humans is unproven; supporting efficacy data are in vitro and in
    African green monkey challenge studies.
  treatment_term:
    preferred_term: antiviral agent therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: remdesivir
      term:
        id: CHEBI:145994
        label: remdesivir
  evidence:
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "During the 2023 outbreak, remdesivir was recommended on compassionate grounds for early use before the onset of encephalitis"
    explanation: |
      Documents compassionate-use recommendation and the timing rationale. PARTIAL
      because compassionate use in an uncontrolled outbreak does not establish
      clinical efficacy.
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In-vitro studies, as well as clade 1 challenge studies in African green monkeys, have shown that remdesivir is effective for the treatment as well as prophylaxis against Nipah virus disease"
    explanation: |
      Preclinical efficacy for both treatment and prophylaxis. Classified
      MODEL_ORGANISM because the efficacy claim rests on nonhuman primate
      challenge studies, not human outcomes.
- name: Ribavirin
  description: >-
    Ribavirin has been used empirically during outbreaks with uncertain
    clinical benefit against Nipah virus.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral agent therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  evidence:
  - reference: PMID:39633840
    reference_title: "Risk Evaluation and Mitigation Strategies for Potential Outbreaks of Nipah Virus Infection: Evidenced by the Recent Incidences in Southeast Asian Countries."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Synthetic medicines, like Ribavirin, and favipiravir showed promising results in NiV-infected patients."
    explanation: Ribavirin has shown promising but non-definitive results in Nipah-infected patients.
diagnosis:
- name: Nucleic acid testing for Nipah virus RNA
  description: >-
    Diagnosis rests on molecular detection of Nipah virus RNA. In the Kerala
    protocol, epidemiologically unlinked encephalitis cases are first screened
    with a PCR-based panel; throat swab, blood, urine and CSF are then screened
    for NiV RNA at a BSL 2/3 facility or by a point-of-care nucleic acid test
    (Truenat), with confirmation at a BSL 4 facility.
  diagnosis_term:
    preferred_term: nucleic acid amplification test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  results: Detection of Nipah virus RNA in throat swab, blood, urine, or CSF.
  evidence:
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the samples (throat swab, blood, urine and CSF) will be screened for NiV RNA at a biosafety level (BSL) 2/3 facility or a point of care nucleic acid test (Truenat)"
    explanation: Specifies the sample types and the nucleic acid testing pathway used for diagnosis.
- name: Serological testing
  description: >-
    Serology is not used to diagnose acute symptomatic infection because of its
    low sensitivity in the early phase of illness; its role is confined to
    serosurveys.
  diagnosis_term:
    preferred_term: serologic test
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  results: Not recommended for acute diagnosis; used for serosurveillance.
  evidence:
  - reference: PMID:39700307
    reference_title: "Pandemic potential of the Nipah virus and public health strategies adopted during outbreaks: Lessons from Kerala, India."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We do not use serological tests to diagnose Nipah in an active symptomatic suspect because of its low sensitivity in early phase of the infection, but they are used for serosurvey"
    explanation: States that serology is unsuitable for acute diagnosis owing to low early-phase sensitivity, and is reserved for serosurvey.
animal_models:
- name: Nonhuman primate henipavirus challenge model
  species: African green monkey
  publication: PMID:37896758
  description: >-
    Nonhuman primates most closely reproduce human henipavirus disease and are
    the model in which remdesivir treatment and prophylaxis efficacy against
    clade I Nipah virus was demonstrated.
  modeled_mechanisms:
  - target: Pulmonary involvement and respiratory tract infection
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Nonhuman primate challenge reproduces the combined severe respiratory and
      encephalitic disease seen in human outbreaks.
    limitations: >-
      Challenge is by controlled experimental inoculation at a defined dose and
      route, unlike natural human exposure to bat secretions, contaminated date
      palm sap, or an infected patient.
    evidence:
    - reference: PMID:37896758
      reference_title: "Animal Models for Henipavirus Research."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Among these, NHPs have demonstrated the closest resemblance to human HNV disease, although other animal models replicate some key disease features."
      explanation: Establishes nonhuman primates as the animal model most faithful to human henipavirus disease.
  - target: Central nervous system invasion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Henipavirus challenge in animal models reproduces the encephalitic arm of
      human disease, not only the respiratory arm.
    limitations: >-
      Encephalitis is scored over the short experimental course, so the model
      does not capture the relapsing and late-onset human encephalitis that
      appears months to years after acute illness.
    evidence:
    - reference: PMID:37896758
      reference_title: "Animal Models for Henipavirus Research."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Outbreaks of HeV and NiV have led to severe respiratory disease and encephalitis in humans and animals characterized by a high mortality rate."
      explanation: Establishes that encephalitis, alongside respiratory disease, occurs in animals as well as humans and so is within the models' scope.
  evidence:
  - reference: PMID:37896758
    reference_title: "Animal Models for Henipavirus Research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Outbreaks of HeV and NiV have led to severe respiratory disease and encephalitis in humans and animals characterized by a high mortality rate."
    explanation: The disease features the model is required to reproduce - severe respiratory disease plus encephalitis with high mortality.
  - reference: PMID:37896758
    reference_title: "Animal Models for Henipavirus Research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "no approved medical countermeasures for human use currently exist against HeV or NiV"
    explanation: Motivates continued reliance on animal models, since no approved human countermeasures exist.
clinical_trials:
- name: NCT04199169
  phase: PHASE_I
  status: COMPLETED
  description: >-
    First-in-human Phase 1 trial of the HeV-sG-V (HenipaVax) Hendra virus
    soluble glycoprotein subunit vaccine in healthy adults, testing three
    ascending dose levels and different dosing regimens. Enrolment 192.
  evidence:
  - reference: clinicaltrials:NCT04199169
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A first-in-human, phase 1 trial is to be conducted in a healthy adult population in the US to assess the safety and immunogenicity of three ascending Nipah vaccine (HeV-sG-V; Hendra virus soluble glycoprotein vaccine) dosages."
    explanation: Registry record establishing the trial's phase, population, and the HeV-sG-V vaccine under test.
- name: NCT05178901
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Phase 1 dose-response and booster trial of PHV02, a recombinant vesicular
    stomatitis virus-vectored Nipah vaccine candidate, in healthy adults.
    Enrolment 60.
  evidence:
  - reference: clinicaltrials:NCT05178901
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A Phase 1 Study to Evaluate the Safety and Immunogenicity of rVSV-Nipah Virus Vaccine Candidate PHV02 in Healthy Adult Subjects"
    explanation: Registry summary establishing PHV02 as an rVSV-vectored Nipah vaccine candidate in Phase 1.
- name: NCT06221813
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Phase 1b prime-boost trial of three dose levels of PHV02
    (rVSV-dG-EBOV GP-NiVG) given as a two-dose regimen one month apart in
    healthy adults, with Nipah-specific IgG ELISA and neutralizing antibody
    readouts. Enrolment 120.
  evidence:
  - reference: clinicaltrials:NCT06221813
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goal of this clinical trial is to test the safety and immunogenicity of PHV02 live, attenuated recombinant vesicular stomatitis virus vaccine expressing the Nipah Virus glycoprotein in healthy adult subjects."
    explanation: Registry record establishing the prime-boost design and the vaccine construct under test.
- name: NCT05398796
  phase: PHASE_I
  status: COMPLETED
  description: >-
    VRC 322/DMID 21-0016, a Phase 1 dose-escalation, open-label trial of the
    mRNA-1215 Nipah virus mRNA vaccine in healthy adults aged 18-60, given as
    two doses one month apart. Enrolment 40.
  evidence:
  - reference: clinicaltrials:NCT05398796
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To test the safety of an experimental vaccine (mRNA-1215) for NiV."
    explanation: Registry record establishing the trial objective and the mRNA-1215 vaccine candidate.
  - reference: clinicaltrials:NCT05398796
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are no drugs or vaccines to treat or prevent NiV infection."
    explanation: The registry record states the unmet need motivating the trial, consistent with this entry's treatments section.
- name: NCT01811784
  status: UNKNOWN
  description: >-
    Community intervention trial in Bangladesh evaluating behaviour-change
    interventions to reduce Nipah spillover through raw date palm sap - the
    prevention counterpart to the vaccine trials, targeting the transmission
    route rather than the host response.
  notes: >-
    ClinicalTrials.gov records this study as Phase 1/Phase 2, which has no
    single corresponding value in ClinicalTrialPhaseEnum; `phase` is therefore
    omitted rather than misrepresented. Registry status is Unknown.
  evidence:
  - reference: clinicaltrials:NCT01811784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to design, implement and evaluate behavior change interventions to prevent human consumption of NiV contaminated sap through reducing raw sap consumption from unprotected trees in a district of the NiV affected regions in Bangladesh."
    explanation: Registry record establishing the prevention objective and the date palm sap transmission route targeted.

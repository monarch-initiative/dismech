treatments:
- name: Supportive and intensive care
  description: >-
    Management is primarily supportive, including intensive care, management
    of encephalitis, and respiratory support; there is no licensed antiviral
    therapy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C133397
      label: Best Supportive Care
- name: Ribavirin
  description: >-
    Ribavirin has been used empirically during outbreaks, but its clinical
    benefit against Nipah virus remains unproven.
  treatment_term:
    preferred_term: Ribavirin
    term:

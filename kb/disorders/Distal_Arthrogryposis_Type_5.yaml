pathophysiology:
- name: PIEZO2 Gain-of-Function and Mechanotransduction Defect
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous dominant PIEZO2 variants alter the kinetics of the
    mechanically activated channel rather than abolishing it. E2727del and
    I802F make PIEZO2-dependent currents recover faster from inactivation, and
    E2727del also slows inactivation, so the channel passes more current for a
    given mechanical stimulus. Mutant channels are not constitutively open and
    are not toxic to cells. Most other DA5 variants have not been tested
    electrophysiologically. The node name is shared with the Gordon syndrome
    and Marden-Walker syndrome entries because the lesion is the same.
  genes:
  - preferred_term: PIEZO2
    term:
      id: hgnc:26270
      label: PIEZO2
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline variants, inherited or de novo, most often
      c.8181_8183delAGA (p.Glu2727del).

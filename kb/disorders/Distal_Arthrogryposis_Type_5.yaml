  association: Causative (heterozygous, dominant, gain of function)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PIEZO2 encodes a large mechanically activated non-selective cation channel.
    In the 2014 molecular series PIEZO2 variants were found in 24 of 29 DA5
    families, so a minority of clinically diagnosed families had no detectable
    PIEZO2 variant. The same gene causes Gordon syndrome and a subset of
    Marden-Walker syndrome by heterozygous gain of function, and a recessive
    loss-of-function arthrogryposis with impaired proprioception and touch. No
    ClinGen gene-disease validity record for PIEZO2 and DA5 is cached in this
    repository.
  evidence:
  - reference: PMID:24726473
    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using molecular inversion probes for targeted sequencing to screen PIEZO2, we found mutations in 24/29 (82%) DA5-affected families and one of two MWS-affected families."
    explanation: Diagnostic yield of PIEZO2 sequencing in clinically defined DA5 families.
  - reference: PMID:23487782
    reference_title: "Gain-of-function mutations in the mechanically activated ion channel PIEZO2 cause a subtype of Distal Arthrogryposis."

    snippet: "Out of these, MWS has a recognizable phenotype that can be discerned easily, but the distinction between GS and DA5 is less evident."
    explanation: Gordon syndrome and DA5 are hard to separate clinically.
- name: Marden-Walker syndrome
  description: >-

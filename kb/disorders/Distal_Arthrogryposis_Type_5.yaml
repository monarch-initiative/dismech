name: Distal Arthrogryposis Type 5
creation_date: "2026-10-27T12:16:53Z"
category: Mendelian
description: >-
  Distal arthrogryposis type 5 (DA5) is a rare autosomal dominant congenital
  contracture syndrome defined by contractures of the hands and feet together
  with limited eye movements (ophthalmoplegia), usually with ptosis. Short
  stature, deep-set eyes, a triangular face, firm muscles, pectus excavatum and
  stiffness of small and large joints are common, abnormal electroretinograms
  and other ocular findings are recorded, and restrictive chest disease can
  lead to alveolar hypoventilation, pulmonary hypertension and, rarely, fatal
  respiratory insufficiency. Intelligence is normal. DA5 is caused by
  heterozygous germline variants in PIEZO2, the mechanically activated cation
  channel of proprioceptive and touch sensory neurons; the variants
  characterized electrophysiologically slow channel inactivation or speed its
  recovery, so the channel passes more current for a given stimulus. In mice,
  the recurrent DA5 allele p.Glu2727del acting only in proprioceptive sensory
  neurons is sufficient to shorten tendons and cause limb contractures. How
  PIEZO2 gain of function produces the ocular and respiratory features is not
  known. DA5 is allelic with Gordon syndrome (distal arthrogryposis type 3) and
  Marden-Walker syndrome, which may be variable expressions of one condition.

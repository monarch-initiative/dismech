inheritance:
- name: Autosomal dominant inheritance with variable expressivity
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    DA5 segregates as an autosomal dominant trait in families of up to four
    generations, and de novo variants occur in simplex patients. Severity
    varies between affected relatives carrying the same variant: in one
    three-generation family with p.Glu2727del, mobility, joint restriction and
    later complications differed between members. Orphanet also lists
    autosomal recessive inheritance. Reports proposing recessive inheritance
    of distal arthrogryposis type IIB predate PIEZO2 testing, and the
    recessive PIEZO2 disorder is a different, loss-of-function condition.
  evidence:
  - reference: PMID:35906671
    reference_title: "Distal Arthrogryposis type 5 in an Italian family due to an autosomal dominant gain-of-function mutation of the PIEZO2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gain-of-function heterozygous mutation c.8181_8183delAGA (p.Glu2727del) of PIEZO2 was identified in the proband, and the same mutation was also found in the mother, confirming the autosomal dominant inheritance of the condition."
    explanation: Mother-to-son transmission of the recurrent PIEZO2 variant in a four-generation family.
  - reference: PMID:17345626
    reference_title: "Pulmonary disease is a component of distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The family has four affected members in three generations with an apparent autosomal dominant pattern of inheritance."
    explanation: Three-generation autosomal dominant pedigree.
  - reference: PMID:35698866
    reference_title: "PIEZO2-related distal arthrogryposis type 5: Longitudinal follow-up of a three-generation family broadens phenotypic spectrum, complications, and health surveillance recommendations for this patient group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All family members presented at birth with distal arthrogryposis and ophthalmoplegia but have varied in their subsequent clinical course with differences in mobility and joint restriction."
    explanation: Variable expressivity among relatives sharing p.Glu2727del.
  - reference: PMID:36317804
    reference_title: "Lethal respiratory course and additional features expand the phenotypic spectrum of PIEZO2-related distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a boy with a recurrent de novo heterozygous PIEZO2 variant in exon 20"
    explanation: De novo occurrence in a simplex patient.

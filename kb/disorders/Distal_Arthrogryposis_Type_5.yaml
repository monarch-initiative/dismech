    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two distinct PIEZO2 mutations in patients with a subtype of Distal Arthrogryposis Type 5 characterized by generalized autosomal dominant contractures with limited eye movements, restrictive lung disease, and variable absence of cruciate knee ligaments."
    explanation: Gene-discovery report identifying PIEZO2 variants in DA5 patients.
  - reference: ORPHA:1154

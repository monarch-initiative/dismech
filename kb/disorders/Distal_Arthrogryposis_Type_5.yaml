- name: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    PIEZO2 is the principal mechanotransduction channel of proprioceptive
    sensory neurons, which innervate muscle spindles and tendon organs. In mice
    carrying the equivalent of the DA5 allele E2727del, expressing it only in
    these neurons is sufficient to reproduce the limb contractures, whereas
    expressing it only in limb mesenchyme (muscle, cartilage and tendon) is
    not. The effect requires the allele to be active before the third
    postnatal week, and botulinum toxin, but not motor-endplate blockade with
    alpha-bungarotoxin, prevents it. The authors interpret this as an efferent
    action of the afferent nerve endings, likely through increased
    exocytosis, rather than increased reflex motor drive; stretch-evoked muscle
    spindle afferent firing was not increased ex vivo. PROVISIONAL because the
    evidence is from mice and the secreted signal is unidentified.
  cell_types:
  - preferred_term: proprioceptive sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  locations:
  - preferred_term: muscle spindle
    term:
      id: UBERON:0003718
      label: muscle spindle
  biological_processes:
  - preferred_term: detection of mechanical stimulus
    term:
      id: GO:0050982
      label: detection of mechanical stimulus
    modifier: INCREASED
  evidence:
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that expression of a gain-of-function PIEZO2 mutation in proprioceptive sensory neurons that mainly innervate muscle spindles and tendons is sufficient to induce DA5-like phenotypes in mice."
    explanation: Cell-type-restricted expression locates the pathogenic action in proprioceptive sensory neurons.
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that overactive PIEZO2 in sensory neurons, but not in mesenchyme, is sufficient to induce DA5-like phenotypes in vivo."
    explanation: Expression in limb mesenchyme did not reproduce the phenotype.

animal_models:
- name: Gain-of-function Piezo2 E2799del knock-in mouse
  species: Mouse
  genotype: Piezo2 E2799del (equivalent of human PIEZO2 E2727del), Cre-dependent knock-in, heterozygous
  publication: PMID:36634173
  description: >-
    Mouse carrying the mouse equivalent of the recurrent DA5 variant
    E2727del, expressed constitutively or restricted by Cre driver to
    proprioceptive neurons (Pvalb), all sensory neurons (Advillin, inducible)
    or limb mesenchyme (Prrx1). Constitutive and proprioceptor-restricted mice
    develop hindlimb contractures and shortened tendons; mesenchyme-restricted
    mice do not, and induction after the third postnatal week does not cause
    joint defects. Botulinum toxin injected into the hindlimb at postnatal days
    7 to 10, or a maternal diet enriched in eicosapentaenoic acid, which
    shortens PIEZO2 inactivation, reduced the defects.
  modeled_mechanisms:
  - target: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows that gain-of-function PIEZO2 acting in proprioceptive sensory
      neurons, not in limb mesenchyme, is sufficient for the contractures.
    limitations: >-
      The sensitive window was postnatal in the mouse, whereas human
      contractures are present at birth.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The critical window identified is postnatal days 7 to 21 in mice;
        whether it maps onto fetal development in humans, where contractures
        are congenital, is not tested.
    evidence:
    - reference: PMID:36634173
      reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that overactive PIEZO2 in sensory neurons, but not in mesenchyme, is sufficient to induce DA5-like phenotypes in vivo."
      explanation: Cell-type-restricted expression places the mechanism in sensory neurons.
  - target: Tendon Shortening and Disrupted Musculoskeletal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces tendon shortening in the hindlimb.
    limitations: >-
      Mouse hindlimb only. Tendon length has not been measured in people with
      DA5 in the cited sources.
    readouts:
    - name: Hindlimb tendon length
      target: Tendon Shortening and Disrupted Musculoskeletal Development
      direction: DECREASED
      interpretation: Tendons shorter than in wild-type littermates.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed that the average length of tendons was significantly reduced in GOFconst. mice compared to wild type"
        explanation: The tendon-length measurement behind this readout.
  - target: Congenital Distal Joint Contractures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces distal hindlimb contractures and reduced limb function, and
      shows that early intervention reduces them.
    limitations: >-
      Contractures arise postnatally in the mouse. Ocular motility,
      ptosis, stature and respiratory function are not among the reported
      readouts, so the model covers only the limb component of DA5.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The ophthalmoplegia, ptosis and restrictive chest disease that define
        DA5 against other distal arthrogryposes are not assessed in the model,
        so its fidelity covers the limb contractures and not the syndrome.
    readouts:
    - name: Hindlimb phalange-metacarpal joint angle
      target: Congenital Distal Joint Contractures
      direction: DECREASED
      interpretation: Smaller joint angles indicate contracture.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "phalange-metacarpal angles in hindlimbs of GOFconst. mice were significantly decreased compared to wild type mice"
        explanation: The joint-angle measurement behind this readout.
    - name: Joint and tendon defects after intramuscular botulinum toxin
      target: Congenital Distal Joint Contractures
      direction: RESTORED
      interpretation: >-
        A single injection at postnatal days 7 to 10 rescued joint and tendon
        defects in the injected limb.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Meanwhile, it rescued joint and tendon defects in the hindlimb that received the treatment in GOF Piezo2 mice compared to hindlimb injected with vehicle control"
        explanation: Botulinum toxin rescue of the contracture readout.
    - name: Joint malformation after maternal dietary eicosapentaenoic acid
      target: Congenital Distal Joint Contractures
      direction: RESTORED
      interpretation: Partial prevention of joint malformations.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Finally, we observed that dietary EPA partially prevented joint malformations"
        explanation: Dietary EPA partial rescue of the contracture readout.
- name: pezo-1(R2405P) C. elegans
  species: Caenorhabditis elegans
  genotype: pezo-1(R2405P), CRISPR knock-in orthologous to human PIEZO2 p.Arg2718Pro
  publication: PMID:38349741
  description: >-
    Worm carrying the equivalent of the DA5 variant p.Arg2718Pro in the sole
    PIEZO ortholog. The allele is gain-of-function in electrophysiology and
    causes reproductive defects (low brood size and ovulation rate, crushed
    oocytes) that a suppressor allele of gex-3, the ortholog of the WAVE
    complex subunit NCKAP1, partially alleviates. The model has no limbs or
    joints and is used to study channel function and genetic modifiers.
  modeled_mechanisms:
  - target: PIEZO2 Gain-of-Function and Mechanotransduction Defect
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the gain of channel function of a DA5 allele in an
      orthologous channel in vivo.
    limitations: >-
      Nematode ortholog in spermathecal tissue; no limb, tendon, ocular or
      respiratory phenotype, and the actin-network modifier has not been
      tested in mammals.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        pezo-1 is the single C. elegans PIEZO ortholog, so the channel
        measured is not PIEZO2 itself and the tissue read out is the
        spermatheca rather than a sensory neuron.
    evidence:
    - reference: PMID:38349741

discussions:
- discussion_id: da5_ocular_respiratory_mechanism_gap
  prompt: >-
    How does PIEZO2 gain of function cause the ophthalmoplegia, ptosis and
    restrictive chest disease that distinguish DA5 from other distal
    arthrogryposes, and does it act through sensory neurons, muscle or the
    chest wall?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Restrictive Chest Disease
  - phenotypes#Ophthalmoplegia
  - phenotypes#Ptosis
  rationale: >-
    The only mechanistic model, the E2799del knock-in mouse, explains the limb
    contractures through proprioceptive sensory neurons and tendon
    shortening, but ocular motility, eyelid position and respiratory function
    are not among its reported readouts. Clinical reports infer involvement of
    skeletal or respiratory muscles, and muscle fibrosis has been proposed for
    the ophthalmoparesis, without tissue evidence. The edges from the PIEZO2
    node to these features are therefore recorded with unknown intermediates.
  evidence:
  - reference: PMID:17345626
    reference_title: "Pulmonary disease is a component of distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Restrictive chest disease is a component of DA5. This implies involvement of the skeletal, and/or respiratory muscles."
    explanation: The respiratory mechanism is inferred, not demonstrated.
  - reference: PMID:15389706
    reference_title: "Distal arthrogryposis 5: a dominant syndrome of peripheral contractures and ophthalmoplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is possible that this syndrome may be due to a muscle abnormality."
    explanation: A muscle origin was proposed as a possibility only.
- discussion_id: da5_critical_window_translation
  prompt: >-
    Is there a human developmental window corresponding to the postnatal
    mouse window in which reducing PIEZO2 activity prevents contractures, given
    that human contractures are present at birth?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Excessive Mechanotransduction in Proprioceptive Sensory Neurons
  - animal_models#Gain-of-function Piezo2 E2799del knock-in mouse
  rationale: >-
    In mice, inducing the allele after the third postnatal week caused no
    joint defects, and botulinum toxin and dietary EPA worked when given
    during that window. Human DA5 contractures are already present on
    second-trimester ultrasound, so whether any equivalent window exists after
    birth, and whether the mouse rescues bear on treatment, is untested.
  evidence:
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, induction of GOF PIEZO2 expression in sensory neurons after P21 or during adulthood (> 1month old) did not cause joint defects in mice"
    explanation: Defines the mouse window as early postnatal.
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also present proof-of-concept that Botox injection or dietary treatment can counteract the effect of overactive PIEZO2 function to evade DA-like phenotypes in mice when applied during a developmental critical period."
    explanation: The rescues are shown in mice and only within the window.
notes: >-
  Scope. This entry covers PIEZO2-related distal arthrogryposis type 5
  (MONDO:0007158, OMIM:108145, ORPHA:1154). Gordon syndrome (MONDO:0007252)
  and Marden-Walker syndrome (MONDO:0009564) are allelic PIEZO2 disorders with
  their own entries; MONDO keeps the three as separate concepts. Distal
  arthrogryposis type 5D (MONDO:0014028) is a recessive ECEL1 disorder despite
  its name and is not covered here; literature searches for "DA5" return both,
  and a 2024 review that tabulates DA5D cases with PIEZO2 and ECEL1 variants
  together (PMID:39062310) is not cited. A 2026 report of recurrent
  pneumothorax in a PIEZO2-positive patient (PMID:41699910) describes a
  Marden-Walker phenotype and is not used here.

  Older clinically defined families. The ophthalmic, retinal and respiratory
  features were first delineated in families reported before PIEZO2 testing
  (PMID:15103714, PMID:15389706, PMID:17345626); their genotype is not stated
  in the cited abstracts. Older reports proposed autosomal recessive
  inheritance of distal arthrogryposis type IIB (for example PMID:10466425,
  titled "probable autosomal recessive inheritance", which has no abstract);
  Orphanet lists both dominant and recessive inheritance without saying which
  reports it relies on.

  Phenotype frequencies. Frequencies are Orphanet grades or percentages a
  2022 case report quotes from an earlier review; cohorts are small. Where the
  two disagree (pectus excavatum, very frequent in Orphanet against 33% in the
  review) the Orphanet grade is used and the discrepancy noted. Orphanet also
  grades inguinal hernia, macrotia, visual impairment, optic atrophy,
  deviation of finger and chin dimple as frequent or very frequent; these are
  not curated because no cited primary report describes them.

  GeneReviews. No GeneReviews chapter is specific to DA5.

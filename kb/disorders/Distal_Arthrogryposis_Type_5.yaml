differential_diagnoses:
- name: Gordon syndrome
  description: >-
    Allelic PIEZO2 disorder (distal arthrogryposis type 3) distinguished by
    cleft palate and bifid uvula, whereas ophthalmologic, muscle and
    respiratory problems are mainly seen in DA5. The distinction between the
    two is less clear than that of Marden-Walker syndrome.

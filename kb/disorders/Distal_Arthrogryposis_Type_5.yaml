    evidence_source: MODEL_ORGANISM
    snippet: "Together, our pharmacological experiments suggest that GOF PIEZO2 causes musculoskeletal abnormalities via ectopic efferent activity in afferent peripheral mechanosensory neuronal endings, likely involving increased levels of exocytosis."

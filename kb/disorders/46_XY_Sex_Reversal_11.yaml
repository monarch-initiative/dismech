- name: Reduced DHX37 Abundance
  description: >-
    Arg308Gln and Arg671Thr constructs produce less DHX37 protein than wild type in HEK293T cells.
    Ser408Leu overexpression in a human Sertoli cell line reduces both transcript and protein abundance.
    Localization remains similar to wild type. These are construct-specific observations; protein
    stability, helicase activity and patient gonadal abundance were not directly measured.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38769888
    reference_title: Identification and functional analysis of a rare variant of gene DHX37 in a patient with 46,XY disorders of sex development.
    supports: SUPPORT

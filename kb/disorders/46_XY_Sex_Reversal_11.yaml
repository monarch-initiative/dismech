    explanation: >-
      Human cultured-cell experiments establish the normal ribosome-assembly role. The disease connection
      remains indirect because DSD alleles and affected gonads were not assayed.
  - reference: PMID:31188444
    reference_title: The DEAH-box RNA helicase Dhr1 contains a remarkable carboxyl terminal domain essential for small ribosomal subunit biogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Finally, we have functionally characterized three mutations identified in an animal model or

definitions:
- name: 46,XY sex reversal 11 case definition
  definition_type: CASE_DEFINITION
  description: >-
    The modeled disease requires a nonmosaic 46,XY karyotype, a nonsyndromic
    difference of testicular development spanning gonadal dysgenesis to
    testicular regression, and a DHX37 missense variant — in practice one in or
    adjacent to the conserved motifs of the RecA1 or RecA2 helicase domains.
    The variant is heterozygous in the great majority of reported cases, but
    homozygous carriers with the DSD phenotype are documented (a boy with
    testicular regression homozygous for p.T477H), so zygosity is not treated as
    an exclusion criterion.
  scope: >-
    This entry models the DHX37-anchored, gene-defined entity. It deliberately
    spans both the gonadal-dysgenesis and the testicular-regression poles,
    because the same variant — including the recurrent p.Arg308Gln — produces
    both within and across families, and the two are curated in the literature as
    one continuum of testis determination and maintenance failure. Etiologically
    distinct causes of the same clinical pictures are out of scope and curated
    elsewhere: SRY, NR5A1, DMRT1, MAP3K1, DHH and SOX9-regulatory gonadal
    dysgenesis, 45,X/46,XY mixed gonadal dysgenesis, androgen insensitivity, and
    androgen-synthesis defects. Non-genetic bilateral testicular regression —
    which is the majority of clinical vanishing-testis presentations and is
    attributed to perinatal vascular accident — is also out of scope. The
    allelic biallelic/compound-heterozygous DHX37 syndrome NEDBAVC
    (neurodevelopmental disorder with brain anomalies and with or without
    vertebral or cardiac anomalies) is a separate disease, not a subtype here.
  evidence:
  - reference: PMID:34293745
    reference_title: "Expanding DSD Phenotypes Associated with Variants in the DEAH-Box RNA Helicase DHX37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in the RNA-helicase DHX37 are associated with either
      46,XY gonadal dysgenesis or 46,XY testicular regression syndrome (TRS).
      DHX37 is required for ribosome biogenesis, and this subgroup of XY DSD is a
      new human ribosomopathy.
    explanation: >-
      States the gene-anchored scope of this entry and the two clinical poles it
      spans.
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      compound heterozygous as well as de novo heterozygous missense variants in
      DHX37 are also associated with a complex congenital developmental syndrome
      (NEDBAVC, neurodevelopmental disorder with brain anomalies and with or
      without vertebral or cardiac anomalies; OMIM 618731)
    explanation: >-
      Establishes NEDBAVC as a distinct allelic DHX37 disorder, supporting its
      exclusion from this entry's scope.
inheritance:
- name: Autosomal dominant, sex-limited, with incomplete penetrance
  inheritance_term:
    preferred_term: sex-limited autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous DHX37 missense variants segregate as an autosomal dominant
    trait, but expression is restricted to 46,XY individuals: 46,XX carriers have
    normal gonadal development and fertility, so transmission is typically
    maternal and the pedigree can look non-penetrant across generations of
    carrier women. Penetrance in 46,XY carriers is itself incomplete — unaffected
    or minimally affected heterozygous fathers and mothers are documented, and
    one family carried a father with unilateral testicular regression and typical
    male genitalia who was fertile. A substantial minority of cases are de novo.
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gonadal development and fertility of female (46,XX) carriers with DHX37
      gene mutations are not affected; however, incomplete penetrance may be
      observed in males (46,XY).
    explanation: >-
      Directly states both the sex-limited expression and the incomplete
      penetrance in 46,XY carriers.
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both variants identified in the probands were also present in their
      unaffected mother.
    explanation: >-
      Documents unaffected carrier mothers, the transmission pattern expected of
      a sex-limited dominant trait.
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enrichment of rare/novel DHX37 missense variants in 46,XY DSD is highly
      significant compared with controls
    explanation: >-
      Case-control enrichment establishing the variants as disease-associated
      rather than incidental rare variation.
pathophysiology:
- name: DHX37 RecA-Domain Missense Variant
  description: >-
    Heterozygous missense substitutions cluster in or immediately adjacent to the
    conserved motifs of the two RecA-like helicase domains (RecA1 and RecA2) of
    DHX37. Only missense alleles have been reported in the DSD phenotype — no
    truncating or whole-gene-deletion alleles — which argues that the mechanism
    is not simple haploinsufficiency but a gain-of-function or dominant-negative
    effect on the helicase. Two substitutions recur: p.Arg308Gln and p.Arg674Trp.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DEAH-box RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: DHX37
      term:
        id: hgnc:17210
        label: DHX37
    allele_type: MISSENSE
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Impaired Small Ribosomal Subunit Biogenesis
    causal_link_type: DIRECT
    description: >-
      The affected residues lie in the catalytic core of a helicase whose
      essential cellular job is small-subunit ribosome assembly.
    evidence:
    - reference: PMID:31337883
      reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirteen children carried heterozygous missense pathogenic variants
        involving the RNA helicase DHX37, which is essential for ribosome
        biogenesis.
      explanation: >-
        Ties the disease-causing missense variants to the ribosome-biogenesis
        function of the affected protein, which is the next node in the chain.
  evidence:
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve variants are clustered in two highly conserved functional domains
      and were specifically associated with gonadal dysgenesis and TRS.
    explanation: >-
      Establishes the domain clustering of the causal variants and their
      restriction to the two phenotypes this entry models.
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty patients were reported to have DHX37-related 46,XY DSD, with p.R308Q,
      p.R674W variants being the two most common mutation hotspots, accounting
      for 36.67% and 11.67% of cases respectively.
    explanation: >-
      Quantifies the two recurrent substitutions named in this node.
- name: Impaired Small Ribosomal Subunit Biogenesis
  description: >-
    DHX37 is a nucleolar factor required for pre-rRNA processing and assembly of
    the 40S small ribosomal subunit. Variant helicase function is predicted to
    degrade this step, placing the disorder among the candidate human
    ribosomopathies. This node is inferential rather than directly measured in
    patient gonad: no study has yet quantified pre-rRNA processing or 40S output
    in tissue from an affected individual.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: 40S small ribosomal subunit assembly
    term:
      id: GO:0042274
      label: ribosomal small subunit biogenesis
    modifier: DECREASED
  - preferred_term: pre-18S rRNA maturation
    term:
      id: GO:0030490
      label: maturation of SSU-rRNA
    modifier: DECREASED
  downstream:
  - target: Nucleolar Stress Response
    causal_link_type: DIRECT
    description: >-
      Defective ribosome assembly is the canonical trigger of the nucleolar
      stress response.
  evidence:
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DHX37 is required for ribosome biogenesis in eukaryotes, and how these
      variants cause DSD is unclear.
    explanation: >-
      Supports the ribosome-biogenesis role while stating plainly that the link
      to the disease phenotype is not established — the reason this node carries
      mechanism_confidence HYPOTHETICAL.
  - reference: PMID:31188444
    reference_title: "The DEAH-box RNA helicase Dhr1 contains a remarkable carboxyl terminal domain essential for small ribosomal subunit biogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      the DEAH-box Dhr1 is essential to displace the box C/D snoRNA U3 from the
      pre-rRNAs where it is bound in order to prevent premature formation of the
      central pseudoknot
    explanation: >-
      Defines the specific molecular step DHX37 performs, characterized in the
      yeast orthologue Dhr1. INDIRECT because it is yeast biochemistry
      extrapolated to the human protein, not a measurement in human gonad.
  notes: >-
    The one published functional assay of human DHX37 mutations on ribosome
    biogenesis (PMID:31188444) tested the NEDBAVC neurodevelopmental alleles,
    not the DSD-associated RecA-domain missense alleles. No DSD allele has been
    shown to impair ribosome biogenesis, which is why this node is inferential.
- name: Nucleolar Stress Response
  description: >-
    Disrupted ribosome assembly perturbs nucleolar architecture and releases the
    nucleolar surveillance program. The supporting data come from mouse: RNAi
    knockdown in the TM4 Sertoli cell line shows that Dhx37 maintains nucleolar
    integrity and PI3K-AKT signaling and restrains p53, and conditional knockout
    testis shows the corresponding tissue-level consequence. No equivalent
    measurement exists in human gonad, which is why this node is PROVISIONAL.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: PI3K-AKT signaling in gonadal supporting cells
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: DECREASED
  downstream:
  - target: Dysregulated WNT Beta-Catenin Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Proposed nucleolar-stress-to-WNT arm of the model; asserted as a hypothesis
      rather than a measured result in gonadal tissue.
    evidence:
    - reference: PMID:37717579
      reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        which suggests that nucleolar stress from DHX37 variants leads to a
        rapid, transient increase in WNT signaling and subsequent β-catenin
        stabilization
      explanation: >-
        States the proposed causal step. The source presents it as the leading
        theory, not as a demonstrated finding, so the edge is INDIRECT.
  - target: p53-Dependent Gonadal Somatic Cell Apoptosis
    causal_link_type: DIRECT
    description: >-
      Loss of Dhx37 de-represses p53 and drives apoptosis in testicular
      supporting cells.
    evidence:
    - reference: PMID:41535247
      reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RIP-seq and RNAi-RNA-seq reveal that Dhx37 safeguards nucleolar integrity
        and PI3K-AKT signaling, suppresses p53-driven apoptosis, and its loss
        triggers pro-apoptotic splicing.
      explanation: >-
        Links loss of Dhx37 function to nucleolar integrity failure and
        p53-driven apoptosis, which is this edge. Graded IN_VITRO because these
        are RIP-seq and RNAi experiments in the TM4 mouse Sertoli cell line, not
        measurements made in an animal.
  evidence:
  - reference: PMID:41535247
    reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence staining revealed disruptions in both Sertoli and germ
      cell compartments, characterized by reduced cell proliferation and elevated
      apoptosis.
    explanation: >-
      Documents the cellular consequence in Sertoli and germ cell compartments
      that this node describes.
- name: Dysregulated WNT Beta-Catenin Signaling
  description: >-
    Testis determination requires the SOX9/FGF9 program to outcompete the
    WNT4/RSPO1/beta-catenin ovarian program. Stabilized beta-catenin in XY
    supporting-cell precursors tips this balance away from testis fate. This is
    the proposed route from a housekeeping ribosome defect to an organ-specific,
    sex-limited outcome, and it remains a model rather than a demonstrated
    finding in patient or mouse gonad.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: canonical WNT/beta-catenin signaling in the XY gonad
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: INCREASED
  downstream:
  - target: Failure of Testis Determination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37717579
      reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        This disruption may interfere with testis determination and result in
        46,XY gonadal dysgenesis (CGD/PGD).
      explanation: >-
        States this edge — WNT/beta-catenin disruption interfering with testis
        determination — as the proposed mechanism, hedged as "may".
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      ribosome synthesis, cell cycle regulation, and the NF-κB and Wnt pathways
      may be affected
    explanation: >-
      A review naming Wnt among the candidate affected pathways. The hedged
      wording is why this node is marked HYPOTHETICAL.
- name: p53-Dependent Gonadal Somatic Cell Apoptosis
  description: >-
    Nucleolar stress releases p53 from MDM2-mediated restraint, and apoptosis of
    the gonadal somatic compartment follows. This is the proposed route to the
    regression pole of the spectrum: a gonad that has already formed is
    subsequently lost, rather than never being built. It rests on mouse and
    cell-line data plus a proposed model; no human gonadal measurement supports
    it, hence PROVISIONAL.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  biological_processes:
  - preferred_term: p53-mediated intrinsic apoptosis of gonadal somatic cells
    term:
      id: GO:0072332
      label: intrinsic apoptotic signaling pathway by p53 class mediator
    modifier: INCREASED
  downstream:
  - target: Fetal Testicular Regression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37717579
      reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        causing an absence of gonadal tissue and thus lead to TRS.
      explanation: >-
        The clause of the nucleolar-stress model that states this edge: a
        p53-dependent pro-apoptotic response causing loss of gonadal tissue and
        thus the testicular-regression phenotype.
  evidence:
  - reference: PMID:41535247
    reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Dhx37-/- mice, we observed pronounced defects, including diminished
      testicular volume, lower testosterone levels, and marked vacuolization of
      the seminiferous tubules.
    explanation: >-
      Shows that loss of Dhx37 in vivo produces testicular tissue loss and
      reduced androgen output, the organ-level readout of this apoptotic node.
- name: Failure of Testis Determination
  description: >-
    The bipotential gonad does not commit to, or does not complete, the testis
    pathway. Histology in this pole shows dysgenetic or undifferentiated gonadal
    tissue rather than an organized testis, and Müllerian derivatives persist
    because fetal Sertoli-cell anti-Müllerian hormone output was never adequate.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: male sex determination
    term:
      id: GO:0030238
      label: male sex determination
    modifier: DECREASED
  - preferred_term: male gonad development
    term:
      id: GO:0008584
      label: male gonad development
    modifier: DECREASED
  downstream:
  - target: Deficient Fetal Testicular Hormone Output
    causal_link_type: DIRECT
  - target: Gonadal dysgenesis
    causal_link_type: DIRECT
  - target: Germ cell neoplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Retained dysgenetic gonadal tissue carrying Y-chromosome material is the
      substrate for gonadoblastoma and its invasive successors. This edge exists
      only at the determination-failure pole: where the gonad regressed there is
      no tissue left to transform.
    evidence:
    - reference: PMID:27862157
      reference_title: "Gonadal tumour risk in 292 phenotypic female patients with disorders of sex development containing Y chromosome or Y-derived sequence."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The overall GCTs risk was 15·41% and 46, XY pure gonadal dysgenesis (46,
        XY PGD) carried the highest risk up to 23·33%
      explanation: >-
        Establishes the dysgenetic-gonad-to-germ-cell-tumour link. INDIRECT
        because the cohort was not DHX37-genotyped, so the edge is inferred from
        46,XY gonadal dysgenesis generally.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis of two participants with DHX37 variants suggested
      early disruption of gonadal development due to the presence of Müllerian
      remnants in both and undifferentiated gonadal tissue in one.
    explanation: >-
      Direct histological evidence that DHX37-related disease involves early
      failure of testis determination, not only late regression.
  - reference: PMID:38142677
    reference_title: "DHX37 and the Implications in Disorders of Sex Development: An Update Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      current research strongly suggests that DHX37 is involved in the male sex
      development pathway, particularly in testis determination and maintenance
    explanation: >-
      Supports both this node (determination) and the regression node
      (maintenance) as the two arms of DHX37 gonadal function.
- name: Fetal Testicular Regression
  description: >-
    A testis forms and functions normally through the window of Müllerian
    regression (weeks 8-10) and external masculinization (weeks 10-16), then
    involutes. The timing is what makes this pole clinically distinct: because
    fetal hormone output was adequate during masculinization, external genitalia
    are male and Müllerian derivatives are absent, yet no testis is present
    afterward. Surgical exploration finds a blind-ending spermatic cord with at
    most a fibrotic nodule.
  biological_scale: TISSUE
  downstream:
  - target: Absent Functional Testicular Tissue
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The testicular regression syndrome (TRS) is a form of differences of sex
      development (DSD) in which the testes differentiate and function during
      early embryonic development, but subsequently regress.
    explanation: >-
      Defines the form-then-regress sequence that distinguishes this node from
      failure of determination.
  - reference: PMID:31287541
    reference_title: "Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants were specifically associated with ETRS (7/14 index cases;
      50%).
    explanation: >-
      Establishes that DHX37 variants are specifically enriched at the
      embryonic-testicular-regression pole of the spectrum.
- name: Deficient Fetal Testicular Hormone Output
  description: >-
    Inadequate fetal Sertoli-cell anti-Müllerian hormone and Leydig-cell
    testosterone during the critical windows. The degree and timing of the
    deficit set the external genital phenotype, which in DHX37 carriers ranges
    from female-type through ambiguous to male-type.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  downstream:
  - target: Undervirilized external genitalia
    causal_link_type: DIRECT
  - target: Female external genitalia in individual with 46,XY karyotype
    causal_link_type: DIRECT
  - target: Micropenis
    causal_link_type: DIRECT
  - target: Cryptorchidism
    causal_link_type: DIRECT
  - target: Hypospadias
    causal_link_type: DIRECT
  - target: Presence of uterus in 46,XY individual
    causal_link_type: DIRECT
  - target: Absent Functional Testicular Tissue
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The external genitalia of patients with the DHX37 variants varied from
      female-type to male-type without micropenis.
    explanation: >-
      Documents the range of external genital outcomes that follow from variable
      fetal androgen exposure.
- name: Absent Functional Testicular Tissue
  description: >-
    Postnatally there is no gonad capable of steroid or peptide hormone output.
    Gonadotropin feedback is unopposed, producing hypergonadotropic
    hypogonadism with undetectable anti-Müllerian hormone and inhibin B, low
    baseline testosterone, and no testosterone rise after hCG stimulation.
    Puberty does not occur spontaneously.
  biological_scale: ORGANISM
  downstream:
  - target: Hypergonadotropic hypogonadism
    causal_link_type: DIRECT
  - target: Delayed puberty
    causal_link_type: DIRECT
  - target: Primary amenorrhea
    causal_link_type: DIRECT
  - target: Absent testis
    causal_link_type: DIRECT
  - target: Decreased circulating antimullerian hormone
    causal_link_type: DIRECT
  - target: Decreased serum testosterone concentration
    causal_link_type: DIRECT
  - target: Infertility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endocrinological tests indicated hypergonadotropic hypogonadism with
      remarkably elevated gonadotropins
    explanation: >-
      Documents the unopposed gonadotropin drive that follows loss of gonadal
      hormone output.
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The administration of hCG (1,500 IU/day, intramuscular injection for 3
      days) slightly increased testosterone levels (0.16–0.73 nmol/L), suggesting
      that the gonads had poor testicular function.
    explanation: >-
      Shows the absent-to-minimal testosterone response to hCG stimulation that
      demonstrates there is no functional testicular tissue.
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-Müllerian hormone and inhibin B levels were also below the normal

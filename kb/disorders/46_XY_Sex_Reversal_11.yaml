animal_models:
- name: Sertoli-cell conditional Dhx37 knockout mouse
  species: Mouse
  genotype: Dhx37 flox/flox; Amh-Cre (Sertoli-cell conditional knockout)
  publication: PMID:41535247
  description: >-
    Sertoli-cell conditional deletion with Amh-Cre beginning at embryonic day 12.5, after mouse male-sex
    determination. Adult P60/approximately eight-week readouts include smaller testes, reduced sperm
    and testosterone, infertility, seminiferous-tubule abnormalities, nucleolar fragmentation, altered
    junction proteins and increased apoptosis. Cell-culture RIP-seq and RNAi experiments from the
    same paper are recorded separately. No human-allele knock-in, fetal sex-reversal experiment or
    demonstration of absent testes was performed. Secondary Leydig-cell hormone changes in a Sertoli-targeted
    model do not establish Leydig-autonomous DHX37 deficiency.
  modeled_mechanisms:
  - target: Nucleolar Structural Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates this experimental consequence of conditional Dhx37 loss in the testicular supporting-cell
      compartment.
    limitations: >-
      Electron microscopy and fibrillarin staining measure architecture; they do not directly quantify
      pre-rRNA processing or 40S output.
    readouts:
    - name: Sertoli-cell nucleolar architecture
      target: Nucleolar Structural Disruption
      direction: ALTERED
      interpretation: >-
        Measured experimental phenotype; extrapolation to human SRXY11 is limited by allele, timing
        and species.

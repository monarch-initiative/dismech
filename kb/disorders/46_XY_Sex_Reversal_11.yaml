genetic:
- name: DHX37
  gene_term:
    preferred_term: DHX37
    term:
      id: hgnc:17210
      label: DHX37
  presence: "Missense variant, heterozygous in the great majority of cases"
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    Roughly 10-15% of nonsyndromic 46,XY complete gonadal dysgenesis and about
    20% of TRS. Detection rates across DSD cohorts span 0.77-45.45% depending on
    ascertainment, and DHX37 is the commonest single gene only in series
    enriched for testicular regression — in one Japanese TRS/PGD cohort selected
    for absent Müllerian derivatives it accounted for 40%. In unselected 46,XY
    gonadal dysgenesis, NR5A1 and SRY remain competing diagnostic yields.
  inheritance:
  - name: Sex-limited autosomal dominant, incomplete penetrance in 46,XY
    inheritance_term:
      preferred_term: sex-limited autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  notes: >-
    DHX37 encodes a nucleolar DEAH-box RNA helicase essential for small
    ribosomal subunit biogenesis. Disease-associated alleles are exclusively
    missense and cluster in or beside the conserved motifs of the RecA1 and
    RecA2 domains. Because no truncating or deletion alleles have been reported
    in this phenotype, a gain-of-function or dominant-negative mechanism is
    favoured over haploinsufficiency, though this has not been demonstrated
    experimentally. A minority of cases carry a second variant in another DSD
    gene, most often NR5A1, and are reported as digenic; those double
    heterozygotes are curated in the 46,XY partial gonadal dysgenesis entry
    rather than here.
  case_fractions:
  - population: Japanese TRS/PGD cohort without Müllerian derivatives
    case_fraction_percent: 40.0
    cohort_size: 10
    notes: Most commonly identified single gene in this cohort of 10 families.
    evidence:
    - reference: PMID:38359811
      reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eighty percent of Japanese patients with TRS/PGD had monogenic disorders
        including DHX37 variant being the most commonly identified (40%).
      explanation: >-
        Reports the DHX37 share of this cohort.
  - population: Brazilian 46,XY DSD referral cohort, embryonic testicular regression subgroup
    notes: >-
      The source reports the variants as "specifically associated with ETRS
      (7/14 index cases; 50%)". No numeric case fraction is recorded here
      because the denominator is ambiguous from the abstract: the cohort has 13
      ETRS index cases (5 familial plus 8 sporadic) and 11 DHX37-positive index
      cases (5 familial plus 6 sporadic), so 14 matches neither, and the
      sentence could equally mean 7 of 14 DHX37-positive index cases had ETRS —
      the inverse ratio. Resolve against the full text before recording a
      number.
    evidence:
    - reference: PMID:31287541
      reference_title: "Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variants were specifically associated with ETRS (7/14 index cases;
        50%).
      explanation: >-
        Reports the DHX37 share of the ETRS subgroup.
  - population: Belgian bilateral testicular regression cohort
    case_fraction_percent: 8.6
    cohort_size: 35
    notes: >-
      Three of 35 participants, and the only pathogenic findings in the cohort.
      A lower yield than referral DSD series, consistent with most clinical
      bilateral testicular regression being non-genetic.
    evidence:
    - reference: PMID:39659563
      reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heterozygous (likely) pathogenic missense variants in DHX37
        (p.Arg334Trp and p.Arg308Gln) were found in three participants.
      explanation: >-
        Reports the DHX37 findings in this population-based cohort.
  evidence:
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen children carried heterozygous missense pathogenic variants
      involving the RNA helicase DHX37, which is essential for ribosome
      biogenesis.
    explanation: >-
      The foundational cohort establishing DHX37 as causative in this phenotype.
  - reference: PMID:40916030
    reference_title: "DHX37 variants in patients with 46,XY disorders or differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two pathogenic DEAH-box helicase 37 (DHX37) variants in
      three patients. We also identified a patient with a likely pathogenic
      variant in SOX9 and a rare likely benign variant in DHX37.
    explanation: >-
      A caution for variant interpretation: not every rare DHX37 variant found

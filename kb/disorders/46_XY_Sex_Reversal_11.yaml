definitions:
- name: 46,XY sex reversal 11 case definition
  definition_type: CASE_DEFINITION
  description: >-
    A 46,XY individual with a difference of testicular development and a pathogenic or likely pathogenic
    DHX37 variant consistent with the phenotype and inheritance. Most established alleles are heterozygous
    missense changes in conserved helicase domains. A rare variant or an in silico damaging prediction
    alone does not establish the diagnosis. A homozygous missense case has also been reported, so
    heterozygosity is not an absolute requirement.
  scope: >-
    This gene-defined entry spans gonadal dysgenesis and testicular regression because recurrent
    alleles produce both presentations within and across families. Other genetic and non-genetic
    causes of those clinical phenotypes require separate diagnosis. The allelic DHX37 neurodevelopmental
    disorder NEDBAVC is distinct and can involve biallelic or de novo heterozygous variants.
  evidence:
  - reference: PMID:34293745
    reference_title: "Expanding DSD Phenotypes Associated with Variants in the DEAH-Box RNA Helicase DHX37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in the RNA-helicase DHX37 are associated with either
      46,XY gonadal dysgenesis or 46,XY testicular regression syndrome (TRS).
      DHX37 is required for ribosome biogenesis, and this subgroup of XY DSD is a
      new human ribosomopathy.
    explanation: >-
      States the gene-anchored scope of this entry and the two clinical poles it
      spans.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      compound heterozygous as well as de novo heterozygous missense variants in
      DHX37 are also associated with a complex congenital developmental syndrome
      (NEDBAVC, neurodevelopmental disorder with brain anomalies and with or
      without vertebral or cardiac anomalies; OMIM 618731)
    explanation: >-
      Establishes NEDBAVC as a distinct allelic DHX37 disorder, supporting its
      exclusion from this entry's scope.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Autosomal dominant, sex-limited, with incomplete penetrance
  inheritance_term:
    preferred_term: sex-limited autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Specific heterozygous DHX37 variants show sex-limited autosomal dominant inheritance with variable
    expression and incomplete penetrance in 46,XY carriers. Unaffected 46,XX carriers, unaffected
    or mildly affected fertile fathers, and de novo variants are reported. Maternal transmission
    predominates in some family series, whereas five of six parentally tested cases in the 2019 discovery
    cohort were de novo; these ascertained series do not establish a population penetrance or de
    novo fraction.
  evidence:
  - reference: url:https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf
    reference_title: https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the presence of the p.Arg308Gln variant in the asymptomatic father
    explanation: >-
      The familial cohort documents an unaffected father transmitting the recurrent allele; the surrounding
      segregation analysis also records maternal and de novo inheritance.
  - reference: PMID:31337883
    reference_title: Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Where tested, all pathogenic variants are de novo with one exception, which was inherited from
      the phenotypically normal mother.
    explanation: >-
      The discovery cohort had parental data for six of thirteen children; this is a cohort-specific
      observation, not a general de novo frequency.
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The gonadal development and fertility of female (46,XX) carriers with DHX37
      gene mutations are not affected; however, incomplete penetrance may be
      observed in males (46,XY).
    explanation: >-
      Directly states both the sex-limited expression and the incomplete
      penetrance in 46,XY carriers.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: DHX37 Missense Variation
  description: >-
    Specific germline missense variants in DHX37 cause the testicular-development spectrum. Many
    cluster in the RecA-like helicase domains. Their shared biochemical effect is unresolved: domain
    location and enrichment establish a genetic association without proving decreased ATPase activity,
    dominant-negative action, gain of function or haploinsufficiency. Reports of variants of uncertain
    significance require separate interpretation.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: DHX37
      term:
        id: hgnc:17210
        label: DHX37
    allele_type: MISSENSE
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Reduced DHX37 Abundance
    causal_link_type: DIRECT
    description: >-
      Selected variant constructs have reduced protein abundance in cultured cells; this has not
      been established for every disease allele.
    evidence:
    - reference: PMID:38769888
      reference_title: Identification and functional analysis of a rare variant of gene DHX37 in a patient with 46,XY disorders of sex development.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        compared with the cells transfected with pcDNA3.1‐WT, those with pcDNA3.1‐Arg308Gln and pcDNA3.1‐Arg671Thr
        displayed a lower level of DHX37
      explanation: >-
        Western blots in transfected HEK293T cells show reduced protein abundance for these constructs;
        enzymatic activity and patient gonadal abundance were not measured. The paper inconsistently
        labels Arg671Thr pathogenic in prose and VUS in Table 1.
    - reference: PMID:37065748
      reference_title: A novel DEAH-box helicase 37 mutation associated with differences of sex development.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        compared with the cells transfected with pcDNA3.1-WT, those with pcDNA3.1-S408L displayed
        decreased DHX37 expression both at the mRNA and protein levels.
      explanation: >-
        The human Sertoli cell-line overexpression experiment supports a variant-specific abundance
        effect, not general loss of helicase function.
  - target: Impaired Small Ribosomal Subunit Biogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A proposed consequence of altered DHX37 function; direct DSD-allele ribosome-output measurements
      remain unavailable.
    evidence:
    - reference: PMID:30582406
      reference_title: The human RNA helicase DHX37 is required for release of the U3 snoRNP from pre-ribosomal particles.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Using an in vivo crosslinking approach, we show that DHX37 binds directly to the U3 small
        nucleolar RNA (snoRNA) and demonstrate that the catalytic activity of the helicase is required
        for dissociation of the U3 snoRNA from pre-ribosomal complexes.
      explanation: >-
        Human cultured-cell experiments establish the normal ribosome-assembly role. The disease
        connection remains indirect because DSD alleles and affected gonads were not assayed.
    - reference: PMID:31188444
      reference_title: The DEAH-box RNA helicase Dhr1 contains a remarkable carboxyl terminal domain essential for small ribosomal subunit biogenesis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Finally, we have functionally characterized three mutations identified in an animal model
        or in human patients suffering from neurological disease and showed that one (L639P) impairs
        ribosome biogenesis severely
      explanation: >-
        Yeast Dhr1 ortholog substitutions modeled neurological alleles and a zebrafish allele, not
        human DSD variants. These results cannot establish ribosome failure in SRXY11.
  - target: Altered Beta-Catenin Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Variant-specific cell-culture evidence informs this candidate branch.
    evidence:
    - reference: PMID:37065748
      reference_title: A novel DEAH-box helicase 37 mutation associated with differences of sex development.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        transfection with wt-DHX37 led to a significant decrease of the β-catenin protein, which
        was rescued by the mutant DHX37.
      explanation: >-
        In an overexpression assay, Ser408Leu fails to reproduce the wild-type reduction in beta-catenin
        abundance. This is not direct evidence of canonical WNT activation or ovarian fate in an
        embryonic gonad.
  - target: Impaired Testicular Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Human genetic and histological evidence establishes the disease association while the molecular
      intermediates remain unresolved.
    evidence:
    - reference: PMID:39659563
      reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Histological analysis of two participants with DHX37 variants suggested
        early disruption of gonadal development due to the presence of Müllerian
        remnants in both and undifferentiated gonadal tissue in one.
      explanation: >-
        Human gonadal histology supports impaired differentiation. Müllerian remnants in this cohort
        were fallopian tubes, not proof of a retained uterus in every carrier.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Testicular Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The human phenotype includes prenatal or postnatal regression; the mechanism of tissue loss
      is unresolved.
    evidence:
    - reference: PMID:40916030
      reference_title: DHX37 variants in patients with 46,XY disorders or differences of sex development.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        However, patient 1 exhibited progressive postnatal gonadal disappearance.
      explanation: >-
        A patient with pathogenic Arg334Trp had palpable inguinal testes in early childhood followed
        by their disappearance, demonstrating that regression is not confined to fetal life.
    - reference: PMID:38359811
      reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The testicular regression syndrome (TRS) is a form of differences of sex
        development (DSD) in which the testes differentiate and function during
        early embryonic development, but subsequently regress.
      explanation: >-
        Defines the form-then-regress sequence that distinguishes this node from
        failure of determination.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Altered RNA Splicing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockdown data motivate a candidate role for altered RNA processing; equivalent changes have
      not been demonstrated for the established human DSD alleles.
    evidence:
    - reference: PMID:41535247
      reference_title: Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Dhx37 KD triggered 949 significant AS events
      explanation: >-
        RNA-seq after Dhx37 knockdown in mouse TM4 cells identifies alternative-splicing changes;
        their contribution to human variant-associated gonadal disease remains untested.
    - reference: PMID:41535247
      reference_title: Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Sashimi plots corroborated Dhx37-dependent alterations in exon usage and intron retention
      explanation: >-
        The primary analysis documents altered exon use and intron retention, not merely pathway
        enrichment.
  evidence:
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

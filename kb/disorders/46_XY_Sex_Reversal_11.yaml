    label: 46,XY sex reversal 11
synonyms:
- SRXY11
- DHX37-related 46,XY disorder of sex development
- embryonic testicular regression syndrome
- testicular regression syndrome
- vanishing testis syndrome
- XY gonadal agenesis syndrome

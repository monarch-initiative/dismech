    notes: Nine of 81 gonadal-dysgenesis cases; complete and partial disease are not separated in this fraction.
    evidence:
    - reference: PMID:31337883
      reference_title: Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Pathogenic variants were specifically identified in children with 46,XY gonadal dysgenesis

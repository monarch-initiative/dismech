diagnosis:
- name: Karyotype
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  description: >-
    Confirms a nonmosaic 46,XY karyotype, the entry criterion that separates
    this disorder from 45,X/46,XY mixed gonadal dysgenesis.
- name: Gonadal function testing
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Basal FSH, LH and testosterone with anti-Müllerian hormone and inhibin B,
    followed by an hCG stimulation test. Undetectable AMH and inhibin B with
    elevated gonadotropins and no testosterone response establishes the absence
    of functional testicular tissue and distinguishes anorchia from bilateral
    undescended but present testes.
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The administration of hCG (1,500 IU/day, intramuscular injection for 3
      days) slightly increased testosterone levels (0.16–0.73 nmol/L), suggesting
      that the gonads had poor testicular function.
    explanation: >-
      Illustrates the hCG stimulation test used to establish absent testicular
      function.
- name: Pelvic and inguinal imaging
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  description: >-
    Pelvic and inguinal ultrasound, with MRI where ultrasound is inconclusive,
    to establish whether Müllerian structures and any gonadal tissue are
    present. This is what separates the two poles non-invasively and directs
    whether surgical exploration is needed: a uterus indicates early
    determination failure, its absence with impalpable gonads indicates
    regression.
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No obvious gonadal structure was identified on abdominal-pelvic and
      inguinal US. Pelvic US demonstrated no evidence of uterine structures.
    explanation: >-
      Shows the imaging findings used to characterize gonadal and Müllerian
      status in a DHX37 carrier.
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted DHX37 sequencing, a DSD gene panel, or exome sequencing. Because
    the external genital phenotype in DHX37 carriers spans female-type to
    male-type, phenotype alone cannot select who to test, and genetic testing
    rather than clinical assessment is what identifies this entity.
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic test is helpful in detecting DHX37-related TRS/PGD because of the
      phenotypic diversity of the external genitalia in this disorder.
    explanation: >-
      States that molecular testing rather than phenotype is what identifies
      DHX37-related disease.
  - reference: PMID:41466375
    reference_title: "A Comprehensive Analysis of Variations in Sex Characteristics Across OMIM."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Genome-wide sequencing should be prioritized in VSC/DSD diagnostics,
      consistent with current best practices, to improve diagnostic yield
    explanation: >-
      Supports genome-wide rather than targeted sequencing as the diagnostic
      route. INDIRECT because it is a cross-OMIM recommendation for DSD
      generally, not a DHX37-specific finding.
- name: Surgical exploration with gonadal biopsy
  diagnosis_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Laparoscopy or inguinal exploration determines whether gonadal tissue is
    present and, with histology, whether it is dysgenetic, undifferentiated, or
    a fibrotic regression remnant. This is the step that distinguishes the two
    poles of the spectrum, and it is where the evidence that DHX37 disease is
    developmental rather than purely regressive was obtained.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis of two participants with DHX37 variants suggested
      early disruption of gonadal development due to the presence of Müllerian
      remnants in both and undifferentiated gonadal tissue in one.
    explanation: >-
      Shows what gonadal histology contributes to classifying DHX37-related
      disease.
treatments:
- name: Testosterone Replacement Therapy
  description: >-
    Incremental testosterone induces and sustains puberty in individuals raised
    male and must be continued lifelong to prevent the skeletal and
    cardiovascular consequences of hypogonadism. Statural growth and pubertal
    development are adequate even when replacement starts in late adolescence,
    which usefully leaves time to explore gender identity before committing.
    Penile growth is the exception: it remains suboptimal in many, and
    especially so in DHX37 carriers, where restriction persists into adulthood.
    Earlier infantile testosterone to mimic mini-puberty has been proposed to
    improve this, but was less effective in DHX37 carriers than in others.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_phenotypes:
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  - preferred_term: Absent spontaneous puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  target_mechanisms:
  - target: Absent Functional Testicular Tissue
    description: >-
      Replaces the androgen output the absent gonad cannot provide. It is purely
      substitutive — it does nothing to the ribosome-biogenesis lesion or to the
      gonad itself.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statural growth and pubertal development are adequate with incremental
      doses of testosterone replacement therapy (TRT); however, penile growth is
      often suboptimal
    explanation: >-
      Reports both the benefit and the specific limitation of testosterone
      replacement in this population.
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with a heterozygous DHX37 variant have a more severe phenotype
      with severely restricted penile growth until adulthood.
    explanation: >-
      Documents that the penile-growth limitation is worse specifically in
      DHX37 carriers, which is what makes this caveat entry-relevant.
- name: Estrogen Replacement Therapy
  description: >-
    For individuals raised female — the presentation at the complete-dysgenesis
    pole, who typically come to attention in adolescence with absent secondary
    sexual characteristics and primary amenorrhea — puberty is induced and
    maintained with estrogen, with progestin added once a uterus is present.
    Replacement is lifelong and is what prevents the skeletal and cardiovascular
    consequences of untreated hypogonadism. Sex of rearing varies in this
    disorder, so the hormone-replacement pathway is not decided by the diagnosis;
    this record and the testosterone record are the two arms of the same
    decision, and neither is the default.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Estrogen Replacement Therapy
    term:
      id: NCIT:C15231
      label: Estrogen Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
  target_phenotypes:
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  - preferred_term: Absent spontaneous puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  target_mechanisms:
  - target: Absent Functional Testicular Tissue
    description: >-
      Substitutive sex-steroid replacement for absent gonadal output; it does
      nothing to the underlying lesion.
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatments are primarily surgical intervention and hormone replacement
      therapy administered at appropriate times; however, the long-term prognosis
      remains unknown.
    explanation: >-
      Establishes hormone replacement as a treatment arm of this disorder.
      INDIRECT because the source does not separate the estrogen and testosterone
      pathways; no DHX37-specific estrogen-replacement study exists, and the
      regimen is the standard one for 46,XY complete gonadal dysgenesis.
  notes: >-
    No DHX37-specific evidence for estrogen replacement has been published. This
    record reflects standard management of hypergonadotropic hypogonadism in
    46,XY complete gonadal dysgenesis, and is included because the entry curates
    the female-phenotype pole as a first-class presentation. Its absence would
    have implied that male rearing is assumed.
- name: Gonadal Surgery
  description: >-
    Surgical management covers two distinct situations. Where dysgenetic gonadal
    tissue carrying Y-chromosome material is present, gonadectomy addresses
    germ-cell tumour risk. Where the finding is a regression remnant or nubbin,
    excision is offered on a contested rationale — the malignant potential of
    such remnants is extrapolated from cryptorchidism and viable germ cells are
    found in only a minority — and practice varies. Testicular prostheses are
    commonly requested and are part of the same operative discussion.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gonadectomy (bilateral orchiectomy)
    term:
      id: NCIT:C15288
      label: Orchiectomy
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatments are primarily surgical intervention and hormone replacement
      therapy administered at appropriate times; however, the long-term prognosis
      remains unknown.
    explanation: >-
      Establishes surgery and hormone replacement as the two treatment arms, and
      records that long-term outcome data are lacking.
  - reference: PMID:27862157
    reference_title: "Gonadal tumour risk in 292 phenotypic female patients with disorders of sex development containing Y chromosome or Y-derived sequence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCTs occurred during adolescence in 46, XY PGD
    explanation: >-
      The adolescent timing of tumour onset in 46,XY gonadal dysgenesis, which
      is what makes gonadectomy timing a decision rather than an emergency.
  target_phenotypes:
  - preferred_term: Germ cell neoplasia
    term:
      id: HP:0100728
      label: Germ cell neoplasia
  notes: >-
    Tumour-risk figures specific to DHX37-related gonads have not been published;
    risk estimates are extrapolated from 46,XY gonadal dysgenesis generally.
    Do not quote a DHX37-specific gonadoblastoma risk.
- name: Genetic Counseling
  description: >-
    Counseling must convey a transmission pattern that is easy to misread.
    46,XX heterozygous carriers have normal gonadal development and fertility,
    so the variant travels silently through female relatives and the family
    history usually looks negative; penetrance in 46,XY carriers is itself
    incomplete, with unaffected and minimally affected male carriers documented.
    Recurrence counseling must also distinguish this from the allelic
    biallelic DHX37 neurodevelopmental syndrome NEDBAVC, which carries entirely
    different risks.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gonadal development and fertility of female (46,XX) carriers with DHX37
      gene mutations are not affected; however, incomplete penetrance may be
      observed in males (46,XY).
    explanation: >-
      The transmission facts that counseling must convey.
- name: Multidisciplinary DSD Supportive Care
  description: >-
    Psychological support and specialist DSD multidisciplinary care around sex
    assignment, disclosure, and gender identity. Gender identity outcomes in
    DHX37 carriers are heterogeneous — in one small series of three, one
    developed a male, one a female, and one a non-binary identity — against a
    cohort in which every non-DHX37 participant identified as male.
    Quality-of-care data from the same series found that around half of
    end-pubertal
    participants felt inadequately informed about the goals, risks and side
    effects of testosterone therapy.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care

        5. In three unrelated participants, heterozygous (likely) pathogenic variants were identified
        in DHX37.
      explanation: >-
        The full Results establish the analyzable denominator and three positive participants.
  - population: Previously unexplained 46,XY gonadal dysgenesis in the discovery cohort

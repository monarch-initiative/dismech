    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two pathogenic DEAH-box helicase 37 (DHX37) variants in
      three patients. We also identified a patient with a likely pathogenic
      variant in SOX9 and a rare likely benign variant in DHX37.
    explanation: >-
      A caution for variant interpretation: not every rare DHX37 variant found
      in a 46,XY DSD patient is causal — one in this cohort was likely benign
      and sat alongside a likely pathogenic SOX9 variant that better explained
      the phenotype.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:31287541
    reference_title: "Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of rare, predicted-to-be-deleterious DHX37 variants in this
      cohort (14%) is significantly higher than that observed in the Genome
      Aggregation Database (0.4%; P < 0.001).
    explanation: >-
      Case-versus-population-control enrichment against gnomAD — a roughly
      thirty-five-fold excess of rare deleterious DHX37 variants in 46,XY DSD.
      This is the population-genetic argument that the gene is causal rather
      than incidentally variable, independent of the separate enrichment test in
      PMID:31337883.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

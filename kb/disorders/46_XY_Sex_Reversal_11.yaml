- name: Multidisciplinary DSD Supportive Care
  description: >-
    Provide ongoing endocrine, urologic/gynecologic, genetics and psychological care, with age-appropriate
    explanation and active participation in decisions. Sex of rearing does not determine later identity
    or treatment preferences. Three DHX37 carriers in one selected cohort reported male, female and
    non-binary identities; these observations are not predictive probabilities. Discuss sex-steroid
    effects, fertility implications, body image and transition to adult care. Nonessential irreversible
    genital procedures should be considered in a process that enables the affected individual to
    participate.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three participants with a DHX37 variant developed a male, female, and
      non-binary gender identity, respectively; all other participants identified
      as males.
    explanation: >-
      Documents the heterogeneous gender-identity outcomes in DHX37 carriers
      relative to the rest of the cohort.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sufficient and understandable information regarding the effects and side
      effects of TRT is required throughout the management of these patients
    explanation: >-
      The authors' explicit care recommendation arising from their
      quality-of-care findings.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Many surgeries are not medically necessary and thus consideration should be given to delaying
      surgery in order to allow the affected individual to participate in the decision-making process.
    explanation: >-
      The overview supports participation in decisions about nonessential irreversible procedures.
- name: Fertility counseling
  description: >-
    Assess reproductive potential according to residual gonadal tissue and function, without assuming
    infertility in every variant carrier. Azoospermia is documented in a pathogenic-variant carrier.
    For individuals with a uterus, pregnancy through oocyte donation is a broader DSD care option
    rather than a demonstrated DHX37-specific treatment outcome.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Fertility and Reproductive Counseling
    term:
      id: NCIT:C171451
      label: Fertility and Reproductive Counseling

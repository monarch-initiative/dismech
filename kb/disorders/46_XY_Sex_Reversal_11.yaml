- name: Human DHX37 depletion and catalytic-mutant complementation
  experimental_model_type: CELL_LINE
  description: >-
    HeLa RNAi and HEK293 complementation with RNAi-resistant wild-type or engineered T282A DHX37
    define pre-rRNA processing and small-subunit assembly functions. Wild-type transgene rescues
    processing defects. Purified recombinant-protein experiments independently show RNA-dependent
    ATPase activity and stimulation by directly interacting UTP14A. The catalytic mutant retains
    the protein-presence function that prevents aberrant pre-rRNA turnover, separating that function
    from ATPase-dependent maturation.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:30582406
  modeled_mechanisms:
  - target: Impaired Small Ribosomal Subunit Biogenesis
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Depletion and catalytic perturbation impair small-subunit maturation; complementation with
      wild-type DHX37 reverses the processing defect.
    limitations: >-
      HeLa and HEK293 cells are not fetal gonadal or patient-derived cells. T282A is engineered,
      not an SRXY11 allele. The study does not test human sex determination, p53 necessity or MDM2
      binding. The exact stage of human U3 release remains unresolved, and UTP14A-depletion effects
      on U3 retention may be secondary to an earlier processing block.
    readouts:
    - name: 40S ribosomal subunit abundance
      target: Impaired Small Ribosomal Subunit Biogenesis
      direction: DECREASED
      interpretation: >-
        40S and 18S output decline while 60S and 28S production are spared after DHX37 depletion.
      evidence:
      - reference: PMID:30582406
        reference_title: The human RNA helicase DHX37 is required for release of the U3 snoRNP from pre-ribosomal particles.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          depletion of DHX37 does not affect production of 60S subunits but leads to a significant
          decrease in the abundance of 40S particles as well as a decrease in the amount of 80S monosomes
        explanation: >-
          Sucrose-gradient analysis of DHX37-depleted human cultured cells directly measures reduced
          small-subunit abundance; the experiments do not test a human DSD allele.
    - name: 21S-to-18SE pre-rRNA processing
      target: Impaired Small Ribosomal Subunit Biogenesis
      direction: DECREASED
      interpretation: >-
        21S accumulates and 18SE falls after depletion or catalytic T282A complementation. Wild-type
        transgene rescues the processing defect.
      evidence:
      - reference: PMID:30582406
        reference_title: The human RNA helicase DHX37 is required for release of the U3 snoRNP from pre-ribosomal particles.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          depletion of DHX37 caused accumulation of the 21S pre-rRNA and a concomitant decrease in

differential_diagnoses:
- name: Non-genetic bilateral testicular regression (perinatal vascular accident)
  description: >-
    Bilateral testicular regression may have a non-genetic or unresolved cause. Gestational complications
    and discordant monozygotic twins support environmental contributions in some cases. Typical external
    virilization and less marked microphallus can be clues, but a negative DHX37 test does not prove
    a vascular cause or exclude another genetic etiology.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An environmental origin in some participants is supported by the high
      incidence of gestational complications (38.2%) and by the three
      monozygotic twin pregnancies discordant for the BTR phenotype.
    explanation: >-
      The selected Belgian series supports environmental contributions in some participants; three
      of 34 analyzable participants carried a DHX37 variant.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: 46,XY gonadal dysgenesis due to other genes
  description: >-
    Variants involving SRY, NR5A1, DMRT1, MAP3K1, DHH, SOX9 and other genes can produce overlapping
    gonadal phenotypes. Molecular diagnosis can alter associated-risk assessment, for example renal
    and Wilms tumor risk in WT1-related disease. Adrenal insufficiency is rare in NR5A1-related DSD
    and is not assumed for every carrier.
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously described pathogenic variants or novel nonsense variants (SRY,
      NR5A1, and DMRT1) were observed in four out of 10 families.
    explanation: >-
      Shows the alternative monogenic causes found in the same clinical
      population.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: 46,XY sex reversal 5 (CBX2-related)
  disease_term:
    preferred_term: 46,XY sex reversal 5
    term:
      id: MONDO:0013120
      label: 46,XY sex reversal 5
  description: >-
    CBX2-related DSD can overlap the genital and gonadal spectrum. The reported CBX2.1 patient had
    histologically normal ovaries, whereas two CBX2.2 cases had dysgenetic testes or no gonadal tissue.
    The distinction is molecular; Müllerian retention and absent gonadal tissue are not unique to
    either gene.
  distinguishing_features:
  - Pathogenic CBX2 variation rather than DHX37 variation
  - The CBX2.1 index case had histologically normal ovarian tissue; this has not been established in the cited DHX37 cohorts
  - CBX2.2-associated dysgenetic or absent gonadal tissue can overlap SRXY11
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A girl with a prenatal 46,XY karyotype was born with a completely normal
      female phenotype, including uterus and histologically normal ovaries.
    explanation: >-
      Documents normal ovarian histology in the CBX2.1 index case without claiming a universal exclusion
      rule for DHX37.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A gonadectomy was performed, which revealed no gonadal tissue on histology
      evaluation and furthermore, a hypoplastic uterus was found.
    explanation: >-
      The CBX2.2 gonadal finding, quoted to show that this arm falls inside the
      SRXY11 gonadal range rather than contrasting with it.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Bilateral cryptorchidism with viable testes
  description: >-
    Nonpalpable but retained testes can resemble anorchia at examination. Hormonal testing, imaging
    and selected exploration assess tissue location and function; present dysgenetic testes may also
    have low hormone output.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has a similar presentation as the more common undescended testicles,
      which can pose difficulties for physicians in diagnosing the condition.
    explanation: >-
      States that undescended testes are the clinically confusable alternative.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: DHX37-related neurodevelopmental disorder (NEDBAVC)
  description: >-
    A distinct allelic disorder with brain and neurodevelopmental abnormalities and possible cardiac
    or vertebral anomalies. Biallelic and de novo heterozygous DHX37 variants have been reported.
    The presence of a DHX37 variant in a syndromic individual requires interpretation of allele,
    inheritance and possible alternative diagnoses rather than automatic assignment to SRXY11.
  evidence:
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      compound heterozygous as well as de novo heterozygous missense variants in
      DHX37 are also associated with a complex congenital developmental syndrome
      (NEDBAVC, neurodevelopmental disorder with brain anomalies and with or
      without vertebral or cardiac anomalies; OMIM 618731)
    explanation: >-
      Establishes the allelic neurodevelopmental disorder as a separate entity.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34293745
    reference_title: "Expanding DSD Phenotypes Associated with Variants in the DEAH-Box RNA Helicase DHX37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A paternally inherited p.R487H variant, previously associated with a
      recessive congenital developmental syndrome, was carried by a boy with a
      syndromic form of 46,XY DSD. His phenotype may be explained in part by a
      novel homozygous loss-of-function variant in the NGLY1 gene, which causes
      a congenital disorder of deglycosylation.
    explanation: >-
      The boundary case between this entry and NEDBAVC, and a phenocopy caution
      in one. A DHX37 allele previously tied to the recessive neurodevelopmental
      syndrome turned up in a boy with syndromic 46,XY DSD, but a second,
      homozygous loss-of-function variant in an unrelated gene may explain his
      phenotype in part. Finding a DHX37 variant in a syndromic patient is
      therefore not sufficient to call this disease: it may be a NEDBAVC allele,
      or the phenotype may be driven by something else entirely.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
discussions:
- discussion_id: dhx37_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does disruption of DHX37, a housekeeping nucleolar helicase needed for
    ribosome biogenesis in every cell, produce a phenotype restricted to the
    gonad and expressed only in 46,XY individuals?
  attaches_to:
  - pathophysiology#Impaired Small Ribosomal Subunit Biogenesis
  - pathophysiology#Nucleolar Structural Disruption
  rationale: >-
    DHX37 has broad cellular roles, while specific variants are associated with testicular-development
    disease. The clinical genetic evidence is stronger than the proposed universal ribosome-stress
    mechanism. Selected variants alter protein abundance or beta-catenin in overexpression systems,
    whereas Ser408Leu does not increase p53 or apoptosis relative to wild type. The Glu257Lys VUS
    was functionally negative in the reported assays and co-occurred with a likely pathogenic NR5A1
    variant; that case does not demonstrate an undetectable disease mechanism. Patient gonadal pre-rRNA/40S
    measurements and allele-matched developmental models remain gaps.
  evidence:
  - reference: PMID:38142677
    reference_title: "DHX37 and the Implications in Disorders of Sex Development: An Update Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The trick question regarding DHX37 is how a helicase involved in basic cell
      function could have a specific role in testis development.
    explanation: >-
      States this knowledge gap as the field's central open question.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37065748
    reference_title: A novel DEAH-box helicase 37 mutation associated with differences of sex development.
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      there is no difference in p53 expression among cells transfected with empty expressing vector,
      wt-DHX37, or mutant DHX37.
    explanation: >-
      The Ser408Leu assay does not support a universal variant-induced increase in p53. It does not
      refute the distinct conditional-null mouse result.
  - reference: PMID:42057034
    reference_title: Comprehensively identifying and validating the implications of NR5A1 and DHX37 variants for 46,XY disorders of sex development diagnosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The other c.769G > A variant of DHX37 had no significant effect on the expression level and
      cellular localization of DHX37, and the downstream signaling pathway of DHX37.
    explanation: >-
      The tested Glu257Lys VUS showed no change in protein abundance/localization or beta-catenin/p53
      readouts. This does not establish pathogenicity or test every possible function.
- discussion_id: dhx37_expression_compartment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How do developmental stage and assay influence the observed testicular distribution of DHX37?
  attaches_to:
  - genetic#DHX37
  - animal_models#Sertoli-cell conditional Dhx37 knockout mouse
  rationale: >-
    The apparent disagreement is partly resolved by the full texts. McElreavey and colleagues report
    fetal somatic-cell localization and explicitly report adult spermatogonial expression. The da
    Silva series includes late fetal, neonatal and adult specimens and observes germ-cell/Leydig
    staining with rare weak Sertoli staining. These stage- and assay-dependent observations do not
    establish a mutually exclusive somatic-versus-germ-cell mechanism. Expression outside the gonad
    also precludes interpreting fetal somatic localization as whole-body gonad specificity.
  evidence:
  - reference: PMID:31337883
    reference_title: Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although expression was not observed in germ cells in fetal gonads, in adult human testes the
      protein is mainly localized in spermatogonia
    explanation: >-
      Immunolocalization in normal fetal versus adult human testis demonstrates a developmental-stage
      difference; this is not a measurement in affected patient gonads.
  - reference: PMID:31287541
    reference_title: Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Immunohistochemistry analysis in human testis showed that DHX37 is mainly expressed in germ
      cells at different stages of testis maturation, in Leydig cells, and rarely in Sertoli cells.
    explanation: >-
      The study examined later fetal, neonatal and adult specimens; its compartment findings are
      interpreted alongside early fetal localization rather than as a direct contradiction.
- discussion_id: dhx37_regression_versus_dysgenesis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How do dysgenesis and subsequent tissue regression overlap across DHX37-related disease?
  attaches_to:
  - pathophysiology#Testicular Regression
  - pathophysiology#Impaired Testicular Development
  rationale: >-
    Cohort definitions differ. The Belgian histology supports early dysgenesis with Müllerian remnants,
    while other series enroll individuals without Müllerian derivatives. Neither observation excludes
    a shared developmental-and-maintenance spectrum. A pathogenic-variant carrier with loss of palpable
    testes during childhood provides direct longitudinal evidence for postnatal regression. Hormone
    action, anatomy and histology need to be interpreted together rather than assigning a universal
    gestational timing from a diagnostic label.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis confirmed DHX37 as a gonadal development, rather than
      a BTR-related, gene.
    explanation: >-
      The histology-based argument that DHX37 disease is developmental rather
      than regressive.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHX37 variant is one of the common genetic causes in Japanese patients with
      TRS/PGD without Müllerian derivatives.
    explanation: >-
      An ascertainment-defined series without Müllerian derivatives demonstrates another part of
      the clinical spectrum, not a refutation of the Belgian histology.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:40916030
    reference_title: DHX37 variants in patients with 46,XY disorders or differences of sex development.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, patient 1 exhibited progressive postnatal gonadal disappearance.
    explanation: >-
      A patient with pathogenic Arg334Trp had palpable inguinal testes in early childhood followed
      by their disappearance, demonstrating that regression is not confined to fetal life.
- discussion_id: dhx37_allele_mechanism_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which consequences of a Sertoli-cell conditional null model also occur with heterozygous human
    DHX37 missense variants?
  attaches_to:
  - animal_models#Sertoli-cell conditional Dhx37 knockout mouse
  - pathophysiology#DHX37 Missense Variation
  rationale: >-
    Amh-Cre deletion begins after initial sex determination and adult knockout findings test maintenance
    of a formed testis. The model does not establish early human sex reversal, a shared missense
    mechanism or p53 necessity. Variant-specific abundance and signaling assays also differ from
    null perturbations. A heterozygous allele-matched developmental model with appropriate dosage
    controls would help test which pathways mediate the human phenotype.
  proposed_experiments:
  - experiment_id: dhx37_r308q_knockin_mouse
    name: Knock-in of a recurrent human DHX37 missense allele in mouse
    description: >-
      Generate a mouse carrying the orthologue of p.Arg308Gln or p.Arg674Trp in
      the heterozygous state and assess fetal gonadal development, Müllerian
      regression, external genital masculinization, and postnatal gonadal
      presence, alongside nucleolar integrity and p53 activation in gonadal
      supporting cells.
    would_support:
    - pathophysiology#DHX37 Missense Variation
    - pathophysiology#Nucleolar Structural Disruption
    supporting_outcome:
    - >-
      A heterozygous allele reproduces a gonadal phenotype together with the proposed cellular change;
      comparison with heterozygous null animals and pathway rescue helps distinguish dosage effects
      from other mechanisms.
    refuting_outcome:
    - >-
      Absence of the proposed molecular change or failure of pathway rescue would weaken that particular
      mechanism. A phenotypically normal mouse would limit this model without excluding human pathogenicity
      or proving a species-specific mechanism.
  evidence:
  - reference: PMID:41535247
    reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Dhx37-/- mice, we observed pronounced defects, including diminished
      testicular volume, lower testosterone levels, and marked vacuolization of
      the seminiferous tubules.
    explanation: >-
      The knockout phenotype is a hypoplastic but formed testis with
      spermatogenic failure, not the failed determination or fetal gonadal loss
      seen in humans — which is the mismatch this discussion records.
    quote_role: PRIMARY_RESULT
- discussion_id: dhx37_long_term_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the long-term outcomes of DHX37-related 46,XY DSD — germ-cell
    tumour risk in retained dysgenetic tissue, bone and cardiovascular health on
    lifelong replacement, and gender-identity trajectories?
  attaches_to:
  - pathophysiology#Reduced Functional Testicular Tissue
  rationale: >-
    Published case-level follow-up now documents hormone replacement, postnatal regression, azoospermia
    and a germ-cell-neoplasia-in-situ observation. These findings do not supply a genotype-specific
    tumor-risk estimate or robust comparative treatment outcomes. General DSD guidance informs care,
    with clear separation from DHX37-specific observations. The three gender-identity observations
    in the Belgian series should not be used as predictive proportions.
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The treatments are primarily surgical intervention and hormone replacement
      therapy administered at appropriate times; however, the long-term prognosis
      remains unknown.
    explanation: >-
      A review identifies limited long-term outcome knowledge; this does not mean that no case-level
      follow-up exists.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- discussion_id: dhx37_uncertain_mild_phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do the uncertain variants reported with mild gynecomastia or another established DSD genotype contribute to disease?
  attaches_to:
  - genetic#DHX37
  rationale: >-
    Five of six variants in the 2026 series were VUS. Its gynecomastia observations include a patient
    who did not meet DSD criteria, and the Gly478Arg case repeats a previously published individual.
    The 2023 double-variant series includes NR5A1 loss-of-function alleles with DHX37 Leu467Val (VUS)
    or Val999Met (likely benign), so co-occurrence does not establish digenic causation. These observations
    are retained as interpretation gaps instead of established phenotype frequencies.
  evidence:
  - reference: PMID:42510869
    reference_title: 'Novel and Known DHX37 Variants in 46,XY DSD: Expanding the Genotypic and Phenotypic Spectrum.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      According to ACMG/AMP guidelines, p.Arg334Trp was classified as pathogenic, and the remaining
      five as variants of uncertain significance.
    explanation: >-
      The classifications limit what can be attributed to the gene from this six-case series.
  - reference: url:https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    reference_title: https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      no in vitro studies have been performed to determine its pathogenicity and possible correlation
      with DSD.
    explanation: >-
      The full discussion cautions about Val999Met; no measured synergistic effect with NR5A1 was
      demonstrated.
notes: >-
  This gene-defined entry spans the DHX37 gonadal-dysgenesis/regression spectrum, while the partial- and
  complete-gonadal-dysgenesis entries organize overlapping clinical phenotypes across genes. MONDO:8000015
  is retained as the established SRXY11 binding despite its placement under complete gonadal dysgenesis;
  that ontology placement should not erase documented partial or regression presentations. General testicular-regression
  synonyms are not treated as exact synonyms of the DHX37 entity. Population prevalence is unknown; selected-cohort
  yields are recorded separately. The full GeneReviews family overview informs care, while disease-specific
  primary cohorts and experimental papers define the limits of genotype and mechanism claims. Ontology
  review: HP:0031103 currently has the canonical label "Decreased circulating antimullerian hormone circulation"
  in live HPO; the clearer source-facing preferred term is retained. HPO search for "Absent puberty" found
  no exact term; sex-steroid treatment targets are instead bound to Hypogonadism, avoiding an absent-versus-delayed
  puberty equivalence.

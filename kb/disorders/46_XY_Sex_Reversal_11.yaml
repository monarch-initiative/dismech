  frequency: FREQUENT
  description: >-
    Microphallus at birth is markedly more common in DHX37 carriers than in
    other individuals with bilateral testicular regression, and penile growth
    remains severely restricted into adulthood despite testosterone therapy —
    the clearest phenotypic discriminator identified between genetic and
    non-genetic testicular regression.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three participants with a DHX37 variant had a microphallus at birth
      (leading to female sex assignment in one), while only six of the remaining
      31 participants without a DHX37 variant (19.4%) had a microphallus at birth
    explanation: >-
      Quantifies microphallus in DHX37 carriers against the non-DHX37 comparator
      within the same cohort.
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT

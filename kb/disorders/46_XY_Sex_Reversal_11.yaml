    Transient wild-type or Ser408Leu DHX37 overexpression in a human Sertoli cell line, compared
    with empty vector. Variant RNA and protein are lower than wild type; localization is similar.
    Beta-catenin abundance is higher than with wild-type overexpression, p53 is unchanged, and variant-associated
    apoptosis is lower than with wild type.

phenotypes:
- category: Reproductive
  name: Gonadal dysgenesis
  phenotype_term:
    preferred_term: Dysgenetic or undifferentiated gonadal tissue
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  frequency: FREQUENT
  description: >-
    At the determination pole of the spectrum the gonad is dysgenetic or
    undifferentiated rather than an organized testis. Centralized histological
    review of DHX37 carriers within a bilateral-testicular-regression cohort
    found undifferentiated gonadal tissue and retained Müllerian remnants,
    evidence that DHX37 disease involves early developmental failure rather than
    pure late regression.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis confirmed DHX37 as a gonadal development, rather than
      a BTR-related, gene.
    explanation: >-
      The authors' histology-based conclusion that DHX37 carriers have a gonadal
      developmental defect.
- category: Reproductive
  name: Absent testis
  phenotype_term:
    preferred_term: Bilateral anorchia (vanishing testis)
    term:
      id: HP:0010469
      label: Absent testis
  frequency: FREQUENT
  description: >-
    At the regression pole, no testis is present at exploration; a blind-ending
    spermatic cord with at most a fibrotic nodule is found. Histology of such a
    remnant in a DHX37 carrier showed hypoplastic spermatic cord with dystrophic
    calcification and only sparse immature seminiferous tubules.
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histologic examination revealed hypoplastic spermatic cord, focal
      dystrophic calcification, with sparse immature seminiferous tubules and
      Leydig cell groups in the stoma, confirming the diagnosis of TRS.
    explanation: >-
      Gonadal histology in a DHX37 carrier confirming the testicular-regression
      phenotype.
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, a series of recurrent missense variants in the RNA-helicase DHX37
      have been reported associated with either 46,XY gonadal dysgenesis, 46,XY
      testicular regression syndrome (TRS), or anorchia.
    explanation: >-
      Names anorchia as one of the reported DHX37 phenotypes.
- category: Reproductive
  name: Undervirilized external genitalia
  phenotype_term:

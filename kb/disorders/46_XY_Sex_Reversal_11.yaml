      id: NCIT:C16768
      label: Karyotyping
  description: >-
    Chromosome analysis establishes a 46,XY complement and evaluates a possible sex-chromosome mosaic
    differential. The sensitivity for low-level or tissue-limited mosaicism depends on the specimen,
    cell count and method. Cytogenetic or genomic follow-up is guided by the presentation.
  evidence:
  - reference: PMID:37717579
    reference_title: Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Case 2 (13.5-year-old girl) had a 46,XY karyotype with female external genitalia and was diagnosed
      as GD.
    explanation: >-
      The case evaluation documents karyotyping in a patient with a DHX37 VUS; the test establishes
      chromosome complement rather than variant pathogenicity.
- name: Gonadal function testing
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Interpret FSH, LH, testosterone, AMH and inhibin B against age-appropriate ranges and the clinical
    examination. Selected hCG testing can characterize Leydig-cell function but is not required in every
    case. Low markers or a blunted response indicate impaired function without necessarily proving absent
    tissue; hormonal testing cannot distinguish one from two functioning gonads. NCIT search for "hormone
    stimulation test" found no fitting specific term; this entry also includes basal hormone assays, so
    the broader diagnostic-procedure binding is retained.
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The administration of hCG (1,500 IU/day, intramuscular injection for 3
      days) slightly increased testosterone levels (0.16–0.73 nmol/L), suggesting
      that the gonads had poor testicular function.
    explanation: >-
      The response in this VUS carrier indicates poor residual testicular function, not complete
      absence of tissue.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      this test is not always necessary, particularly if there is other evidence that a gonad is
      nonfunctional.
    explanation: >-
      GeneReviews qualifies use of hCG stimulation within the broader evaluation.
- name: Pelvic and inguinal imaging
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  description: >-
    Pelvic and inguinal ultrasound assesses Müllerian structures and gonadal position, with MRI or
    selected exploration when anatomy remains unclear. Small dysgenetic gonads may not be visualized.
    Absence of a uterus does not by itself distinguish regression from partial dysgenesis.
  evidence:
  - reference: PMID:37717579
    reference_title: "Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No obvious gonadal structure was identified on abdominal-pelvic and
      inguinal US. Pelvic US demonstrated no evidence of uterine structures.
    explanation: >-
      Shows the imaging findings used to characterize gonadal and Müllerian
      status in a DHX37 carrier.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    A DSD gene panel including DHX37, or exome/genome analysis with appropriate variant interpretation,
    can establish the gene-defined diagnosis. Clinical findings guide interpretation and the differential.
    A VUS or a likely benign DHX37 allele alongside a pathogenic variant in another gene does not
    confirm SRXY11. Segregation studies and later reanalysis can clarify uncertain findings.
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic test is helpful in detecting DHX37-related TRS/PGD because of the
      phenotypic diversity of the external genitalia in this disorder.
    explanation: >-
      States that molecular testing rather than phenotype is what identifies
      DHX37-related disease.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:41466375
    reference_title: "A Comprehensive Analysis of Variations in Sex Characteristics Across OMIM."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Genome-wide sequencing should be prioritized in VSC/DSD diagnostics,
      consistent with current best practices, to improve diagnostic yield
    explanation: >-
      Supports genome-wide rather than targeted sequencing as the diagnostic
      route. INDIRECT because it is a cross-OMIM recommendation for DSD
      generally, not a DHX37-specific finding.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40916030
    reference_title: DHX37 variants in patients with 46,XY disorders or differences of sex development.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the SOX9 p.(Arg437Cys) and DHX37 p.(Pro428Leu) variants were assessed as likely pathogenic
      and likely benign, respectively
    explanation: >-
      Demonstrates why identifying a rare DHX37 allele is not sufficient to establish causation.
- name: Selected surgical exploration and gonadal histology
  diagnosis_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Exploration and histology may define tissue that remains anatomically or functionally uncertain and
    inform management of a retained dysgenetic gonad. They are individualized procedures rather than mandatory
    tests in every carrier. Biopsy has sampling limitations and may compromise future gonadal function.
    NCIT "testicular biopsy" resolves to C51894 (Biopsy of Testis), but this combined assessment includes
    exploration and sampling of potentially nontesticular dysgenetic tissue; the broader procedure binding
    preserves that scope.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis of two participants with DHX37 variants suggested
      early disruption of gonadal development due to the presence of Müllerian
      remnants in both and undifferentiated gonadal tissue in one.
    explanation: >-
      Shows what gonadal histology contributes to classifying DHX37-related
      disease.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Results may be inaccurate because of biopsy sampling error; gonadal biopsy may harm the future
      growth and development of the gonad.
    explanation: >-
      The overview explicitly qualifies diagnostic biopsy.
treatments:
- name: Testosterone Replacement Therapy
  description: >-
    For individuals seeking androgen-mediated puberty, incremental testosterone replacement can induce
    and sustain pubertal development when endogenous production is inadequate. Dose and timing follow
    growth, hormone results, clinical response and individual goals. Penile response varies; the
    Belgian series documents limited growth in two DHX37 carriers at Tanner G3 and does not establish
    universal adult failure. Short courses in infancy for micropenis are a separate individualized
    decision. Adequate sex-steroid replacement supports adolescent bone accrual. Follow pubertal
    progression, growth, skeletal maturation, hormone results and adverse effects during induction;
    the Endo-ERN guideline describes clinical review every three to six months.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_phenotypes:
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  - preferred_term: Hypogonadism
    term:
      id: HP:0000135
      label: Hypogonadism
  target_mechanisms:
  - target: Reduced Functional Testicular Tissue
    description: >-
      Replaces deficient sex-steroid output according to the individual’s pubertal and longer-term
      goals; it does not restore gonadal tissue.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statural growth and pubertal development are adequate with incremental
      doses of testosterone replacement therapy (TRT); however, penile growth is
      often suboptimal
    explanation: >-
      Summarizes the entire bilateral-regression cohort, most of whom did not have a DHX37 variant.
      Genotype-specific numbers and maturational stages require separate interpretation.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Testosterone therapy is typically required to initiate and sustain puberty.
    explanation: >-
      Family-level care guidance applies to those with deficient androgen production and corresponding
      pubertal goals.
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We found no studies on treatment to induce or sustain puberty in male patients with partial
      gonadal dysgenesis.
    explanation: >-
      The guideline’s systematic review found no male-PGD induction studies; treatment recommendations
      therefore draw on broader hypogonadism evidence and expert practice.
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Regular clinical follow-up is generally performed every 3–6 months to assess the effectiveness
      of testosterone therapy by assessing pubertal and skeletal maturation and height velocity.
    explanation: >-
      Broader hypogonadism guidance, not a DHX37-specific trial or fixed regimen.
- name: Estrogen Replacement Therapy
  description: >-
    For individuals seeking estrogen-mediated puberty, gradual estrogen replacement induces breast
    development and supports bone accrual when gonadal steroid production is inadequate. If a uterus
    is present, progesterone is added after puberty has progressed. Treatment follows the individual’s
    goals and anatomy. Direct DHX37 observations include estradiol induction at age 11.3 years in
    an Arg308Gln carrier and estrogen at age 12 years 2 months in an Arg674Trp carrier; these are
    case-level observations rather than comparative trials. The broader Endo-ERN guideline favors
    17β-estradiol and gradual dose escalation with clinical monitoring; much of its evidence derives
    from other forms of gonadal insufficiency.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Estrogen Replacement Therapy
    term:
      id: NCIT:C15231
      label: Estrogen Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
  target_phenotypes:
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  - preferred_term: Hypogonadism
    term:
      id: HP:0000135
      label: Hypogonadism
  target_mechanisms:
  - target: Reduced Functional Testicular Tissue
    description: >-
      Replaces deficient sex-steroid output according to the individual’s pubertal and longer-term
      goals; it does not restore gonadal tissue.
  evidence:
  - reference: PMID:39659563
    reference_title: 'Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the age of 11.3 years, puberty induction was started with incremental estradiol doses.
    explanation: >-
      The sentence describes DHX37-positive participant 2, who carried maternally inherited Arg308Gln.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If the affected individual has a uterus, progesterone will be added once puberty has progressed
      in order to promote menstrual cycles.
    explanation: >-
      The full overview supplies the anatomy- and puberty-dependent progestogen guidance.
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We recommend to use 17β-oestradiol for puberty induction or to sustain puberty in girls
    explanation: >-
      Endo-ERN recommends physiologic estradiol for those pursuing estrogen-mediated puberty. Much
      of the supporting evidence comes from Turner syndrome rather than DHX37-related disease.
- name: Gonadal Surgery
  description: >-
    Decisions depend on gonadal function, histology, location and tumor concern. Removal of nonfunctioning
    dysgenetic gonads may be appropriate; potentially functioning retained gonads may instead be
    positioned for examination and monitored after individualized counseling. Surveillance has limitations
    and no validated DHX37-specific protocol. Management of a fibrotic regression remnant is a separate
    question from a retained dysgenetic testis. Prostheses are optional and discussed according to
    the individual’s preferences.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gonadectomy (bilateral orchiectomy)
    term:
      id: NCIT:C15288
      label: Orchiectomy
  evidence:
  - reference: PMID:39659563
    reference_title: 'Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      we would propose planning resection of gonadal remnants only in cases where gonadal dysgenesis
      is suspected, due to the risk for gonadal germ cell cancer.
    explanation: >-
      The cohort authors distinguish suspected dysgenesis from a typically virilized regression presentation.
      This is a clinical recommendation, not a trial result.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Depending on the specific diagnosis, potentially functional gonads may be retained with appropriate
      surveillance for tumor development.
    explanation: >-
      The overview supports individualized preservation of potentially functioning gonads.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1547/
    reference_title: Nonsyndromic Disorders of Testicular Development Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are no current guidelines on surveillance; one option would be yearly ultrasound of the
      gonad.
    explanation: >-
      The chapter presents ultrasound as an option without an established surveillance guideline;
      this must not be represented as a validated DHX37 screening protocol.
  target_phenotypes:
  - preferred_term: Germ cell neoplasia
    term:
      id: HP:0100728
      label: Germ cell neoplasia
  notes: >-
    Tumour-risk figures specific to DHX37-related gonads have not been published;
    risk estimates are extrapolated from 46,XY gonadal dysgenesis generally.
    Do not quote a DHX37-specific gonadoblastoma risk.
- name: Genetic Counseling
  description: >-
    Explain sex-limited expression, variable severity, incomplete penetrance in 46,XY carriers and
    the distinction between an established variant and a VUS. A heterozygous parent has a 50% chance
    of transmitting the allele in each pregnancy, which is not a 50% chance of an affected child.
    Parental testing informs recurrence counseling; negative blood testing cannot exclude germline
    mosaicism. Once a familial pathogenic variant is established, testing of relatives and reproductive
    testing options can be discussed. NEDBAVC is a distinct allelic disorder with variant-dependent
    inheritance.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf
    reference_title: https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf

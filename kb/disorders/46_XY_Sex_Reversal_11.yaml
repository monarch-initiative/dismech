- name: Nucleolar Structural Disruption
  description: >-
    Sertoli-cell Dhx37 knockout mice show fragmented, smaller nucleoli by electron microscopy and
    reduced fibrillarin staining in adult testes. This supports nucleolar disruption following substantial
    experimental loss of Dhx37. The corresponding change in heterozygous human DSD remains provisional.
  biological_scale: CELLULAR

animal_models:
- name: Sertoli-cell conditional Dhx37 knockout mouse
  species: Mouse
  genotype: Cell-specific Dhx37 knockout (Dhx37-/-)
  publication: PMID:41535247
  description: >-
    Conditional knockout mice combined with RIP-seq, RNAi-RNA-seq and snRNA-seq,
    used to establish what Dhx37 does in testicular supporting cells. The model
    supplies the only direct in vivo evidence for the nucleolar-stress-to-p53
    arm of the proposed mechanism.
  modeled_mechanisms:
  - target: Nucleolar Stress Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of Dhx37 disrupts nucleolar architecture in Sertoli cells and
      de-represses p53, the step this node asserts.
    limitations: >-
      The model is a loss-of-function knockout, whereas every human
      disease-associated DHX37 allele is missense and is suspected to act by
      gain of function or dominant negative effect. A knockout therefore tests
      what the protein does, not what the patient alleles do.
    readouts:
    - name: Nucleolar integrity and p53-driven apoptosis in Sertoli cells
      target: Nucleolar Stress Response
      direction: ALTERED
      interpretation: >-
        Molecular correlate of the nucleolar stress node in this model.
      evidence:
      - reference: PMID:41535247
        reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we identified Dhx37 as a pivotal determinant of nucleolar architecture
          in murine testicular Sertoli cells
        explanation: >-
          Reports the nucleolar-architecture measurement grounding this readout.
    evidence:
    - reference: PMID:41535247
      reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cell-specific Dhx37 knockout mice (Dhx37-/-) were subsequently generated
        to investigate the function of Dhx37 in testicular development.
      explanation: >-
        Establishes the in vivo model itself, which is what makes it informative
        for this node. The cell-line RIP-seq arm of the same paper is cited on
        the pathophysiology node and graded IN_VITRO.
  - target: Failure of Testis Determination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout does not reproduce the human fetal phenotype of failed testis
      determination or fetal testicular regression.
    limitations: >-
      Reported defects are a smaller testis with vacuolated seminiferous tubules
      and impaired spermatogenesis — a postnatal spermatogenic failure in an
      animal that still forms a testis. The human disease is a failure of fetal
      testis determination or its loss before birth, with undervirilized or
      female external genitalia. No sex reversal, no anorchia, and no
      undervirilization are reported in the model, so the defining human
      phenotype is absent.
    evidence:
    - reference: PMID:41535247
      reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the Dhx37-/- mice, we observed pronounced defects, including
        diminished testicular volume, lower testosterone levels, and marked
        vacuolization of the seminiferous tubules.
      explanation: >-
        The reported phenotype is a hypoplastic but present testis with
        spermatogenic failure. That a testis forms at all is what shows the
        model does not reproduce failed testis determination.
differential_diagnoses:
- name: Non-genetic bilateral testicular regression (perinatal vascular accident)
  description: >-
    The large majority of clinical vanishing-testis presentations. Historically
    attributed to a vascular accident on the basis of remnants containing
    fibrovascular tissue with dystrophic calcification and haemosiderin but no
    viable testicular tissue. Supporting evidence includes a high rate of
    gestational complications and monozygotic twin pairs discordant for the
    phenotype. Distinguished from SRXY11 by a negative DHX37 result, and
    clinically by the much lower rate of microphallus at birth.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An environmental origin in some participants is supported by the high
      incidence of gestational complications (38.2%) and by the three
      monozygotic twin pregnancies discordant for the BTR phenotype.
    explanation: >-
      Evidence for a non-genetic cause of bilateral testicular regression in a
      cohort where only 3 of 35 carried a DHX37 variant.
- name: 46,XY gonadal dysgenesis due to other genes
  description: >-
    SRY, NR5A1, DMRT1, MAP3K1, DHH, SOX9-regulatory and other loci produce
    clinically indistinguishable gonadal dysgenesis. Only sequencing separates
    them, and several carry different extragonadal risks — NR5A1 adrenal
    involvement, WT1 renal and Wilms tumour risk — that change surveillance.
  evidence:
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously described pathogenic variants or novel nonsense variants (SRY,
      NR5A1, and DMRT1) were observed in four out of 10 families.
    explanation: >-
      Shows the alternative monogenic causes found in the same clinical
      population.
- name: Bilateral cryptorchidism with viable testes
  description: >-
    The everyday differential in infancy: impalpable gonads that are present but
    undescended. Anti-Müllerian hormone and inhibin B with an hCG stimulation
    test separate the two, since a present testis retains hormone output.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has a similar presentation as the more common undescended testicles,
      which can pose difficulties for physicians in diagnosing the condition.
    explanation: >-
      States that undescended testes are the clinically confusable alternative.
- name: NEDBAVC (biallelic DHX37 neurodevelopmental disorder)
  description: >-
    The allelic disorder at the same locus. Compound heterozygous or de novo
    heterozygous DHX37 variants cause a syndromic neurodevelopmental disorder
    with microcephaly, developmental delay, seizures, dysmorphism and kidney and
    cardiac anomalies. It shares a gene with SRXY11 but not a phenotype, and
    matters when a DHX37 variant is returned in a syndromic patient.
  evidence:
  - reference: PMID:35835064
    reference_title: "DHX37 and 46,XY DSD: A New Ribosomopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      compound heterozygous as well as de novo heterozygous missense variants in
      DHX37 are also associated with a complex congenital developmental syndrome
      (NEDBAVC, neurodevelopmental disorder with brain anomalies and with or
      without vertebral or cardiac anomalies; OMIM 618731)
    explanation: >-
      Establishes the allelic neurodevelopmental disorder as a separate entity.
discussions:
- discussion_id: dhx37_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does disruption of DHX37, a housekeeping nucleolar helicase needed for
    ribosome biogenesis in every cell, produce a phenotype restricted to the
    gonad and expressed only in 46,XY individuals?
  attaches_to:
  - pathophysiology#Impaired Small Ribosomal Subunit Biogenesis
  - pathophysiology#Nucleolar Stress Response
  rationale: >-
    This is the central unsolved problem of the disease and the reason the
    middle of this entry's causal chain is marked HYPOTHETICAL. Every ribosomopathy
    poses the same puzzle and none has solved it. Candidate explanations include a
    gonad-specific threshold of ribosome demand during the narrow window of testis
    determination, specialized ribosomes translating a sex-determination-specific
    transcript subset, and gonadal supporting cells being unusually sensitive to
    p53. No study has yet measured pre-rRNA processing or 40S output in gonadal
    tissue from an affected individual, so even the first step of the chain is
    inferred from the protein's known function rather than observed in the
    relevant tissue.
  evidence:
  - reference: PMID:38142677
    reference_title: "DHX37 and the Implications in Disorders of Sex Development: An Update Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The trick question regarding DHX37 is how a helicase involved in basic cell
      function could have a specific role in testis development.
    explanation: >-
      States this knowledge gap as the field's central open question.
  - reference: PMID:34293745
    reference_title: "Expanding DSD Phenotypes Associated with Variants in the DEAH-Box RNA Helicase DHX37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to all other known ribosomopathies, the mechanism of pathogenesis
      is unknown.
    explanation: >-
      Confirms the gap is unresolved and shared across the ribosomopathies.
  - reference: PMID:42057034
    reference_title: "Comprehensively identifying and validating the implications of NR5A1 and DHX37 variants for 46,XY disorders of sex development diagnosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The other c.769G > A variant of DHX37 had no significant effect on the
      expression level and cellular localization of DHX37, and the downstream
      signaling pathway of DHX37.
    explanation: >-
      A negative functional result that sharpens this gap: a DHX37 variant
      predicted deleterious in silico showed no measurable effect on DHX37
      expression, localization, or downstream signaling when actually assayed.
      Whatever the disease mechanism is, the available functional readouts are
      not yet detecting it.
  - reference: PMID:42057034
    reference_title: "Comprehensively identifying and validating the implications of NR5A1 and DHX37 variants for 46,XY disorders of sex development diagnosis."
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: >-
      Moreover, the in silico and structural analysis identified the c.769G > A
      variant of DHX37 as a deleterious variant that may affect DHX37 function.
    explanation: >-
      Cuts the other way on the same allele: prediction called it deleterious
      while the assay found no effect. The disagreement between predicted and
      measured consequence is part of why the mechanism remains open, and why
      this entry does not treat in-silico deleteriousness as establishing
      loss of helicase function.
- discussion_id: dhx37_expression_compartment
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Which testicular cell compartment expresses DHX37 during development —
    somatic supporting cells, or germ cells and Leydig cells?
  attaches_to:
  - pathophysiology#Nucleolar Stress Response
  - pathophysiology#p53-Dependent Gonadal Somatic Cell Apoptosis
  - genetic#DHX37
  rationale: >-
    The two foundational 2019-2020 studies report different distributions from
    immunolocalization in human testis. McElreavey and colleagues found DHX37
    specifically in somatic cells of the developing testis, which is what the
    somatic-cell mechanism modeled in this entry requires. da Silva and colleagues
    found it mainly in germ cells across stages of maturation and in Leydig
    cells, and only rarely in Sertoli cells. The difference is not cosmetic: a
    germ-cell-dominant expression pattern would make the somatic
    nucleolar-stress model implausible, because in humans a testis forms without
    germ cells. The two studies examined testis at different developmental stages,
    which may reconcile them, but no study has directly compared them. This entry
    provisionally follows the somatic-cell model, consistent with the mouse
    Sertoli-cell knockout data; that choice should be revisited if the
    germ-cell pattern is confirmed in fetal tissue.
  evidence:
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with a role in early testis development, DHX37 is expressed
      specifically in somatic cells of the developing human and mouse testis.
    explanation: >-
      One side of the disagreement: somatic-cell-restricted expression.
  - reference: PMID:31287541
    reference_title: "Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry analysis in human testis showed that DHX37 is mainly
      expressed in germ cells at different stages of testis maturation, in Leydig
      cells, and rarely in Sertoli cells.
    explanation: >-
      The opposing finding: germ-cell and Leydig-cell dominant expression with
      Sertoli cells rarely stained, which contradicts the somatic-cell claim
      this entry's mechanism assumes.
- discussion_id: dhx37_regression_versus_dysgenesis
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is DHX37-related disease genuinely a regression of a formed testis, or is it
    early dysgenesis that has been clinically mislabelled as regression?
  attaches_to:
  - pathophysiology#Fetal Testicular Regression
  - pathophysiology#Failure of Testis Determination
  - phenotypes#Presence of uterus in 46,XY individual
  rationale: >-
    Centralized histological review in the Belgian cohort found Müllerian
    remnants in both DHX37 carriers examined and undifferentiated gonadal tissue
    in one, and the authors concluded that DHX37 is a gonadal-development gene
    rather than a testicular-regression gene — retained Müllerian structures mean
    fetal Sertoli-cell AMH output was never adequate, which is dysgenesis, not
    regression. Against that, a Japanese cohort explicitly selected for completed
    Müllerian regression — the physiological signature of a testis that did
    function during the 8-10 week window — found DHX37 to be the commonest cause
    within it, which is difficult to reconcile with universal early dysgenesis.
    The distinction matters for this entry because it decides whether the
    p53-apoptosis arm of the modeled chain describes real patients or is
    redundant with the determination-failure arm. Both arms are retained pending
    a larger histological series, and both are labelled as proposed rather than
    established.
  evidence:
  - reference: PMID:39659563
    reference_title: "Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological analysis confirmed DHX37 as a gonadal development, rather than
      a BTR-related, gene.
    explanation: >-
      The histology-based argument that DHX37 disease is developmental rather
      than regressive.
  - reference: PMID:38359811
    reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHX37 variant is one of the common genetic causes in Japanese patients with
      TRS/PGD without Müllerian derivatives.
    explanation: >-
      DHX37 is common in a cohort defined by completed Müllerian regression,
      which argues against the claim that DHX37 disease is uniformly early
      dysgenesis with retained Müllerian structures.
- discussion_id: dhx37_allele_mechanism_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Dhx37 loss-of-function knockout mouse model the human disease, when
    every human disease allele is missense and is suspected to act by gain of
    function or dominant negative effect?
  attaches_to:
  - animal_models#Sertoli-cell conditional Dhx37 knockout mouse
  - pathophysiology#DHX37 RecA-Domain Missense Variant
  rationale: >-
    Only missense alleles have ever been reported in DHX37-related 46,XY DSD —
    no truncating variants, no whole-gene deletions — which is the standard
    argument that the mechanism is not haploinsufficiency. The available mouse
    model is a conditional knockout, so it tests the consequences of losing the
    protein rather than the consequences of the patient alleles, and its
    phenotype is correspondingly different: a smaller testis with vacuolated
    tubules and impaired spermatogenesis in an animal that nonetheless forms a
    testis, versus failed testis determination or fetal gonadal loss in humans.
    The knockout is therefore good evidence for what DHX37 does in the nucleolus
    and poor evidence for how the human alleles cause disease. The one published
    functional assay of human DHX37 mutations on ribosome biogenesis tested the
    NEDBAVC neurodevelopmental alleles, not the DSD-associated RecA-domain
    alleles, so no DSD allele has been shown to impair ribosome biogenesis at
    all. A knock-in of a recurrent human allele such as p.Arg308Gln is the
    experiment that would settle it.
  proposed_experiments:
  - experiment_id: dhx37_r308q_knockin_mouse
    name: Knock-in of a recurrent human DHX37 missense allele in mouse
    description: >-
      Generate a mouse carrying the orthologue of p.Arg308Gln or p.Arg674Trp in
      the heterozygous state and assess fetal gonadal development, Müllerian
      regression, external genital masculinization, and postnatal gonadal
      presence, alongside nucleolar integrity and p53 activation in gonadal
      supporting cells.
    would_support:
    - pathophysiology#DHX37 RecA-Domain Missense Variant
    - pathophysiology#Nucleolar Stress Response
    supporting_outcome:
    - >-
        A heterozygous knock-in reproduces failed testis determination or fetal
        testicular loss with nucleolar disruption and p53 activation in gonadal
        somatic cells, while heterozygous null animals do not — establishing a
        non-loss-of-function mechanism for the human alleles.
    refuting_outcome:
    - >-
        A heterozygous knock-in is phenotypically normal, or is indistinguishable
        from a heterozygous null, indicating that the mouse cannot model this
        disease and that the human phenotype depends on species-specific gonadal
        biology.
  evidence:
  - reference: PMID:41535247
    reference_title: "Multi-omics analysis the effects of Dhx37 deficiency on testis development and nucleolar homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Dhx37-/- mice, we observed pronounced defects, including diminished
      testicular volume, lower testosterone levels, and marked vacuolization of
      the seminiferous tubules.
    explanation: >-
      The knockout phenotype is a hypoplastic but formed testis with
      spermatogenic failure, not the failed determination or fetal gonadal loss
      seen in humans — which is the mismatch this discussion records.
- discussion_id: dhx37_long_term_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the long-term outcomes of DHX37-related 46,XY DSD — germ-cell
    tumour risk in retained dysgenetic tissue, bone and cardiovascular health on
    lifelong replacement, and gender-identity trajectories?
  attaches_to:
  - treatments#
  - pathophysiology#Absent Functional Testicular Tissue
  rationale: >-
    Management decisions that are made in infancy — gonadectomy or surveillance,
    sex of rearing, timing of hormone replacement — currently rest on evidence
    borrowed from other causes of 46,XY gonadal dysgenesis, because no
    DHX37-specific outcome data exist. The only gender-identity data are three
    individuals in one cohort, who between them developed male, female and
    non-binary identities, against a comparison group in which every participant
    identified as male. That is a striking signal on a sample far too small to
    counsel from. No DHX37-specific germ-cell tumour risk has been published, so
    this entry deliberately quotes none.
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatments are primarily surgical intervention and hormone replacement
      therapy administered at appropriate times; however, the long-term prognosis
      remains unknown.
    explanation: >-
      Explicitly states that long-term prognosis in this disorder is unknown.
notes: >-
  Scope and lump/split rationale. This entry is anchored on DHX37 (MONDO:8000015,
  OMIM 273250) and deliberately spans both the gonadal-dysgenesis and
  testicular-regression poles, because the recurrent alleles — p.Arg308Gln above
  all — produce both within and across families, so splitting by clinical pole
  would split a single genotype. It sits alongside, and overlaps in clinical
  presentation with, three existing entries: 46,XY partial gonadal dysgenesis
  (MONDO:0016674), which carries a DHX37-related subtype covering the partial
  presentations specifically; 46,XY complete gonadal dysgenesis (MONDO:0010765),
  which is this term's MONDO parent and which already carries a
  DHX37-related complete gonadal dysgenesis subtype and a DHX37 pathophysiology
  node, while deliberately declining to bind MONDO:8000015 as a structured
  mapping (its notes record it as a phenotype-series cross-reference the local
  disease-term enum rejected); and 45,X/46,XY mixed gonadal dysgenesis, which is
  a sex-chromosome DSD and unrelated. DHX37 content therefore now exists in
  three files. That is intended rather than accidental, but it is the
  gene-specific-forms pattern that warrants a human curator's sign-off: the two
  sibling entries are organized by clinical severity across many genes and carry
  DHX37 only as the slice that falls in their severity band, whereas this entry
  is organized by gene across the full severity range. A reviewer who disagrees
  should say so before merge.

  MONDO scope mismatch. MONDO places MONDO:8000015 as a subClassOf
  MONDO:0010765 (46,XY complete gonadal dysgenesis), so the bound disease_term
  is narrower than this entry's actual scope, which spans partial dysgenesis and
  testicular regression as well. No mappings.mondo_mappings block is asserted
  for the partial pole; a skos:narrowMatch to MONDO:0016674 would make that
  claim auditable and is a reasonable follow-up. The overlap
  with the partial-dysgenesis entry is real and intended: that entry is organized
  by clinical severity across many genes, this one by gene across the full
  severity range, and the DHX37 subtype there is the intersection.

  What this entry does not claim. The middle of the causal chain — nucleolar
  stress to WNT/beta-catenin to failed testis determination, and the parallel p53
  apoptosis arm — is the field's leading model, not a demonstrated result, and
  the corresponding nodes carry mechanism_confidence HYPOTHETICAL and INDIRECT
  edge evidence. No study has measured ribosome biogenesis in gonadal tissue from
  an affected individual. No DHX37-specific germ-cell tumour risk figure has been
  published and none is quoted here.

  Deep research. Curation drew on an openscientist deep-research report
  (research/46_XY_Sex_Reversal_11-deep-research-openscientist.md), produced via
  the recorded-fallback path after the requested falcon provider returned a 403
  authentication failure; the report's frontmatter carries fell_back,
  requested_provider and provider_attempts. Its reference validation was clean
  (18/18 resolved, 18/18 quotes valid) with one reference flagged off topic,
  PMID:32057790, a Turner-syndrome 45,X/46,XY mosaicism seminoma case report,
  which is genuinely about a different entity and is not cited here. Its term
  validation flagged HP:0000783 as unresolved; that CURIE is not bound anywhere
  in this entry. The four terms it reported as mislabelled were artefacts of the
  report putting frequency descriptors in the label column, not wrong bindings —
  every term used here was independently verified against the ontology.

  Reference caches committed but not cited. The deep-research run's own
  validator resolves every citation the report makes, so this PR carries
  reference caches beyond the ones the entry cites. Three were reviewed and
  deliberately not used: PMID:37497464 is a Swyer syndrome case report with no
  DHX37 genotype, so it describes the clinical picture but not this disease
  entity; PMID:42151440 measures DHX37 expression in breast and ovarian cancer,
  a different biological question; and PMID:39829003, an Iranian DSD cohort, and
  PMID:42365275, a 46,XY DSD exome series, cover the general DSD diagnostic
  landscape rather than adding a DHX37-specific claim this entry does not
  already make from a better source. They are left cached rather than deleted
  because the report cites them and reference caches are committed for
  deterministic validation.

  GeneReviews. PubMed was searched for a GeneReviews chapter on testicular
  regression syndrome, DHX37, and 46,XY sex reversal; none exists. The overview
  chapter for this disease family, PMID:20301714, is tagged in references but
  not quoted: its PubMed abstract is the five-point "the purpose of this
  overview is to" boilerplate with no Clinical Characteristics, Management, or
  Genetic Counseling content to mine.

  Prevalence is not curated. SRXY11 has no published population prevalence
  estimate; what the literature reports is diagnostic yield within ascertained
  46,XY DSD, TRS and gonadal-dysgenesis cohorts, which is a different measure and
  is recorded as genetic.case_fractions rather than being misrepresented as
  disease occurrence. Those fractions vary widely by ascertainment — 40-50% in
  referral series enriched for regression phenotypes against 8.6% in the
  population-based Belgian cohort — and that spread is itself informative rather
  than contradictory.

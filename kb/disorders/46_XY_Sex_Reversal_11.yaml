name: 46,XY Sex Reversal 11
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  46,XY sex reversal 11 (SRXY11) is a nonsyndromic, autosomal dominant and
  sex-limited difference of sex development caused by heterozygous missense
  variants in DHX37, a nucleolar DEAH-box RNA helicase required for small
  ribosomal subunit biogenesis. Affected 46,XY individuals present across a
  continuum whose two poles are gonadal dysgenesis — failure to build a testis,
  giving female or ambiguous external genitalia and variably retained Müllerian
  derivatives — and testicular regression syndrome (TRS, also called embryonic
  testicular regression syndrome, vanishing testis syndrome, or congenital
  bilateral anorchia), in which a testis forms and functions through the
  masculinization window, so Müllerian ducts regress and the external genitalia
  are male, and only later is the gonad lost. Because DHX37 is a housekeeping
  ribosome-biogenesis factor, how its disruption produces an organ-restricted,
  sex-limited phenotype is unresolved; the disease is regarded as a candidate
  ribosomopathy, with a nucleolar-stress model invoking WNT/beta-catenin
  dysregulation and p53-dependent apoptosis of gonadal somatic cells as the
  leading but unproven explanation. Two recurrent variants, p.Arg308Gln and
  p.Arg674Trp, account for roughly half of reported cases, and the disorder is a
  common monogenic cause within TRS and 46,XY gonadal dysgenesis cohorts.
disease_term:
  preferred_term: 46,XY sex reversal 11
  term:

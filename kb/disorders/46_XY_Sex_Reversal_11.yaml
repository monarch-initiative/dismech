review_notes: >-
  All originally cited references and the matching deep-research report were assessed; actual cached
  full bodies, tables and methods were used where available. PMID40026690 is a literature review
  whose pooled 60-case counts include uncertain variants and an infertility-associated frameshift.
  PMID39659563 has 35 recruited but 34 genetically analyzable participants; its two testosterone-treated
  DHX37 carriers were described at Tanner G3, so the broad adult-outcome wording is not treated as
  a genotype-specific adult endpoint. The da Silva primary manuscript reports 7/14 ETRS index cases
  despite an apparent 13-index accounting in its methods; no derived numeric subgroup fraction is
  asserted. PMID34293745’s abstract writes p.T477H, whereas subsequent c.1430C>T summaries identify
  p.Thr477Met; the inconsistent named-variant record is withheld pending primary nomenclature resolution,
  while the reported homozygous case remains acknowledged. PMID38769888 calls Arg671Thr pathogenic
  in prose but VUS in Table 1; protein-expression results are retained without resolving that discrepancy.
  PMID37065748 Table 1 says no Müllerian structures for the younger sibling, while its histology
  and narrative describe fallopian-like structures; histology is kept distinct from imaging and no
  frequency is inferred. PMID42510869 repeats the Gly478Arg case from PMID37717579 and does not establish
  its VUS-only gynecomastia presentations as causal SRXY11. PMID32057790 concerns Turner mosaicism,
  PMID37497464 lacks a DHX37 genotype, and PMID42151440 concerns tumor expression; they do not establish
  this disease’s mechanism or tumor risk. The Iranian and later general DSD exome abstracts add diagnostic
  context without new genotype-specific claims. The newly identified RNA-processing preprint was
  only abstract-accessible after a full-PDF rate-limit failure and is not used to assert an established
  causal pathway. Two additional research-only sources were assessed: the full familial Swyer report
  PMID38337479 and mosaicism cohort abstract PMID31883875. Neither establishes DHX37-specific tumor
  risk, so their tumor proportions were not transferred to this gene-defined entry.
histopathology:
- name: Fibrotic gonadal remnant with undifferentiated sex cords
  description: >-
    A DHX37 Arg308Gln-positive participant had a largely fibrotic gonadal remnant containing a small
    area of undifferentiated sex cords in gonadal stroma, without germ cells. This documents residual
    dysgenetic tissue rather than complete absence of all gonadal material.
  evidence:
  - reference: PMID:39659563
    reference_title: 'Etiology, histology, and long-term outcome of bilateral testicular regression: a large Belgian series.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      a small area of undifferentiated gonadal tissue, containing sex cords in a background of gonadal
      stroma, an absence of germ cells, and fat infiltration
    explanation: >-
      Histological description of participant 2’s left gonadal remnant.
- name: Residual immature seminiferous tubules and Leydig-cell groups
  description: >-
    The Gly478Arg VUS carrier had sparse immature seminiferous tubules and Leydig-cell groups in
    a hypoplastic spermatic-cord specimen with dystrophic calcification. The observation supports
    residual tissue within the reported regression phenotype, but does not independently establish
    variant pathogenicity.
  evidence:
  - reference: PMID:37717579
    reference_title: Two Novel Heterozygous Variants in RecA2 Domain of DHX37 Cause 46,XY Gonadal Dysgenesis and Testicular Regression Syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The histologic examination revealed hypoplastic spermatic cord, focal dystrophic calcification,
      with sparse immature seminiferous tubules and Leydig cell groups in the stoma, confirming the
      diagnosis of TRS.
    explanation: >-
      Primary case histology; the paper classifies Gly478Arg as VUS.
- name: Germ cell neoplasia in situ in dysgenetic testis
  description: >-
    The original familial cohort documents GCNIS in an Arg674Trp-positive member’s left dysgenetic
    testis. The isolated observation supports tumor surveillance/management considerations without
    quantifying genotype-specific risk.
  evidence:
  - reference: url:https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf
    reference_title: https://www.pure.ed.ac.uk/ws/portalfiles/portal/104502301/final_manuscript_DHX37_2506_submitted.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Left dysgenetic

      testis with GCNIS*
    explanation: >-
      Table 1, family member F4:II-4; the table footnote expands GCNIS as germ cell neoplasia in
      situ.
progression:
- phase: Variable prenatal testicular differentiation
  age_range: Fetal development
  notes: >-
    Early differentiation and hormone production vary, producing a spectrum of genital anatomy and
    Müllerian retention. Diagnostic labels do not establish an exact gestational time of tissue loss
    in every patient.
  evidence:
  - reference: PMID:31337883
    reference_title: Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The genital phenotype may range predominantly from male to female, including marked sex ambiguity
      depending on the duration of normal testicular function prior to the loss of testicular tissue.
    explanation: >-
      The clinical interpretation relates anatomy to timing of fetal function rather than directly
      measuring fetal hormone production.
- phase: Possible postnatal regression
  age_range: Childhood
  notes: >-
    In a pathogenic Arg334Trp carrier, inguinal gonads were palpable at about two years but not at
    six years two months; later imaging showed rudimentary tissue. This supports longitudinal assessment
    rather than assuming all regression is prenatal.
  evidence:
  - reference: PMID:40916030
    reference_title: DHX37 variants in patients with 46,XY disorders or differences of sex development.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The inguinal gonads, which were palpable at 2 years of age, were not palpable at 6 years and
      2 months of age, with only rudimentary gonads detected via echography.
    explanation: >-
      Direct longitudinal observation in patient 1.
- phase: Variable pubertal function and adult reproductive impairment
  age_range: Adolescence and adulthood
  notes: >-
    Puberty may require induction, or may start spontaneously and subsequently stall. A pathogenic
    Arg308Gln carrier entered puberty at twelve, began testosterone at seventeen and had azoospermia
    at twenty-one. These outcomes are variable and should not be assigned as universal carrier features.
  evidence:
  - reference: url:https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    reference_title: https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient developed normal

      puberty at 12 years old but presented with low testosterone levels at 17 years old.
    explanation: >-
      Primary Arg308Gln case follow-up.
  - reference: url:https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    reference_title: https://mdpi-res.com/d_attachment/life/life-13-01093/article_deploy/life-13-01093.pdf?version=1682573867
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      has high levels of FSH (34.5 IU/L) and LH (12 IU/L) and presented with azoospermia.
    explanation: >-
      Direct semen finding in the pathogenic Arg308Gln patient; the other azoospermic case in the
      paper carried a likely benign DHX37 allele and is not pooled here.

name: 46,XY Sex Reversal 11
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  46,XY sex reversal 11 (SRXY11) is a DHX37-related difference of testicular development. Specific
  heterozygous missense variants cause a spectrum of complete or partial gonadal dysgenesis and testicular
  regression, with variable external genital anatomy, Müllerian derivatives and residual gonadal
  function. Transmission is usually sex-limited autosomal dominant with incomplete penetrance in
  46,XY carriers; de novo variants also occur. Regression may follow impaired fetal development,
  and postnatal loss of palpable testes has been documented. DHX37 participates in ribosome biogenesis,
  but a shared molecular mechanism linking the human variants to gonadal disease remains unresolved.
  Variant-specific protein-abundance and beta-catenin findings in cultured cells and nucleolar disruption
  after Sertoli-cell Dhx37 deletion in mice inform candidate mechanisms without establishing a universal
  ribosomopathy or p53-dependent fetal regression pathway.

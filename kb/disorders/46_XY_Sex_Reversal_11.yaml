genetic:
- name: DHX37
  gene_term:
    preferred_term: DHX37
    term:
      id: hgnc:17210
      label: DHX37
  presence: "Missense variant, heterozygous in the great majority of cases"
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    Diagnostic yields vary with ascertainment. The discovery cohort found variants in 9/81 unexplained
    gonadal-dysgenesis cases and 4/16 testicular-regression cases. A Japanese series selected for
    TRS/PGD without Müllerian derivatives found DHX37 variants in four of ten families. The Belgian
    series identified three carriers among 34 successfully analyzed participants. These are selected
    cohort fractions, not disease prevalence or penetrance.
  inheritance:
  - name: Sex-limited autosomal dominant, incomplete penetrance in 46,XY
    inheritance_term:
      preferred_term: sex-limited autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  notes: >-
    Established congenital DSD-associated variants are predominantly missense alleles affecting conserved
    helicase regions. The molecular mechanism is unresolved; variant class alone does not establish
    gain of function, dominant-negative action or haploinsufficiency. Co-occurring variants in NR5A1
    or SOX9 do not establish digenic inheritance, particularly when the DHX37 allele is uncertain
    or likely benign. A frameshift described in an infertility context should not be generalized
    to the congenital SRXY11 phenotype.
  case_fractions:
  - population: Japanese TRS/PGD cohort without Müllerian derivatives
    case_fraction_percent: 40.0
    cohort_size: 10
    notes: >-
      Four of ten families among eleven selected Japanese individuals with TRS/PGD and no Müllerian
      derivatives. The denominator is families, not unrelated unselected DSD patients.
    evidence:
    - reference: PMID:38359811
      reference_title: "DHX37 Variant Is One of the Common Genetic Causes in Japanese Patients with Testicular Regression Syndrome/Partial Gonadal Dysgenesis without Müllerian Derivatives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eighty percent of Japanese patients with TRS/PGD had monogenic disorders
        including DHX37 variant being the most commonly identified (40%).
      explanation: >-
        Reports the DHX37 share of this cohort.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - population: Brazilian 46,XY DSD referral cohort, embryonic testicular regression subgroup
    notes: >-
      The primary abstract and author manuscript report 7/14 ETRS index cases (50%). The methods
      describe ten affected members of five ETRS families plus eight sporadic cases, yielding thirteen
      apparent index families; that accounting does not reconcile cleanly with fourteen. Preserve
      the authors’ numerator/denominator in prose and omit a machine-readable fraction pending clarification.
      The separate overall yield is 11/78 index cases.
    evidence:
    - reference: PMID:31287541
      reference_title: "Genetic Evidence of the Association of DEAH-Box Helicase 37 Defects With 46,XY Gonadal Dysgenesis Spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variants were specifically associated with ETRS (7/14 index cases;
        50%).
      explanation: >-
        Reports the DHX37 share of the ETRS subgroup.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - population: Belgian bilateral testicular regression cohort
    case_fraction_percent: 8.8
    cohort_size: 34
    notes: >-
      Three carriers among 34 participants with analyzable DNA; one of the 35 recruited participants
      was excluded for suboptimal DNA quality. This was a retrospective multicenter clinical series,
      not population screening.
    evidence:
    - reference: PMID:39659563

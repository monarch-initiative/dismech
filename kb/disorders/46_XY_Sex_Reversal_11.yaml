    range that also includes female-type and typical male genitalia; that full
    range is described on the Deficient Fetal Testicular Hormone Output node
    rather than being asserted here.
  evidence:
  - reference: PMID:42510869
    reference_title: "Novel and Known DHX37 Variants in 46,XY DSD: Expanding the Genotypic and Phenotypic Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

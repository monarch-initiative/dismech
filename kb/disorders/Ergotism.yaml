pathophysiology:
- name: Ergot Alkaloid Agonism at Serotonin and Adrenergic Receptors
  biological_scale: MOLECULAR
  description: >-
    Ergot alkaloids are tetracyclic ergoline derivatives structurally similar to
    serotonin, dopamine and noradrenaline, and act as partial agonists at
    5-HT and alpha-adrenergic receptors on vascular smooth muscle.

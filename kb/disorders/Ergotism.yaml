clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Outcome ranges from subclinical vasospasm through fully reversible
    ischaemia to amputation, stroke and death, and which end a patient reaches
    is set by how quickly the exposure is recognised and stopped rather than by
    the illness itself. One hospital series of seven severe cases needed no
    amputations; a poison-centre series of twelve required two partial foot
    amputations and had two deaths. Subclinical ergotism is reported at 15%
    prevalence among users against a severe incidence below 0.5 per 100,000 per
    year, so the same exposure spans three orders of magnitude of harm.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is concluded that incidence of severe ergotism is less than 0.5/100,000/year in Geneva. This contrasts with the high prevalence (15%) of subclinical ergotism reported by others."
    explanation: >-
      The two figures this level rests on - severe disease is rare, subclinical
      vasospasm is not - which is the spread `VARIABLE` records.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients required partial foot amputations due to gangrene. Two patients, including a 15-month-old boy with an unsupervised ingestion, died."
    explanation: The severe end of the same range, in a twelve-case poison-centre series.
pathophysiology:
- name: Ergot Alkaloid Entry into the Circulation
  biological_scale: ORGANISM
  description: >-
    The exposure event, reached by two routes that differ in everything except
    what arrives in the blood. Contaminated grain delivers a mixture of the
    alkaloids a particular Claviceps strain happens to make; a prescription
    delivers one purified alkaloid at a known dose. The alkaloid composition of
    the mixture is not constant, which matters because it is what decided
    whether a historical epidemic was gangrenous or convulsive.
  notes: >-
    Carries no ontology-bound process descriptor: the node denotes an exposure
    event rather than a host biological process. The exposures are grounded in
    the `environmental:` block, which splits them by route.
  downstream:
  - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
    causal_link_type: DIRECT
    description: >-
      Circulating alkaloid reaches vascular receptors, which it fits because
      the ergoline ring resembles the endogenous monoamines.
    evidence:
    - reference: PMID:30662776
      reference_title: "Drug-Drug Interaction of Ergotamine with a Combination of Darunavir, Abacavir, and Lamivudine Causing a Fatal Vasospastic Ischemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Ergotamine mimics the neurotransmitters norepinephrine, serotonin, and dopamine and can result in smaller and bigger vessels vasospasm and vasoconstriction"
      explanation: States the structural mimicry and the vascular consequence, which is this edge.
  chemical_entities:
  - preferred_term: ergot alkaloid
    term:
      id: CHEBI:23943
      label: ergot alkaloid
  evidence:
  - reference: PMID:22903169
    reference_title: "Human and cattle ergotism since 1900: symptoms, outbreaks, and regulations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ergotism in humans and cattle are caused by several species of Claviceps that infect rye and other cereal grains."
    explanation: Establishes the producing organisms and the grains they infect.
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ergots produced by different strains of Claviceps purpurea, and those growing in different soils, may have different ergot alkaloid compositions."
    explanation: >-
      Source of the claim that the delivered mixture is not constant, which is
      what makes the two clinical forms a property of the ergot rather than of
      the dose.
- name: CYP3A4 Inhibition Raising Systemic Ergotamine Concentration
  biological_scale: MOLECULAR
  description: >-
    The step that makes ergotism a live problem in countries with clean grain.
    Ergotamine is destroyed on first pass through the liver by CYP3A4, leaving
    under 5% oral bioavailability - which is why an ordinary migraine dose is
    tolerated at all. A strong CYP3A4 inhibitor removes that first-pass barrier,
    and the same tablet delivers a toxic plasma concentration. The inhibitors
    implicated are the HIV protease inhibitors, the pharmacokinetic booster
    cobicistat, and the macrolide antibiotics.
  notes: >-
    Modelled as a mechanism node rather than as a `genetic:` CYP3A4 entry. The
    claim here is pharmacological inhibition of the enzyme by a co-administered
    drug, which is an exposure, not a host genotype. Inherited CYP3A4 variation
    might plausibly do something similar, but no ergotism-specific
    pharmacogenomic study was found, so it is not curated.
  downstream:
  - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
    causal_link_type: DIRECT
    description: >-
      The raised plasma concentration is what drives receptor occupancy high
      enough to be toxic. This branch converges on the same receptor node as
      the dietary route rather than acting through a separate mechanism.
    evidence:
    - reference: PMID:24531557
      reference_title: "Ergotism in Thailand caused by increased access to antiretroviral drugs: a global warning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Concurrent intake of ergotamine and strong CYP3A4 inhibitors, such as the HIV protease inhibitors (PIs), can lead to clinical ergotism."
      explanation: States the inhibition-to-ergotism link directly.
  evidence:
  - reference: PMID:24531557
    reference_title: "Ergotism in Thailand caused by increased access to antiretroviral drugs: a global warning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ergotamine, typically used to treat migraine, has less than 5% bioavailability due to extensive first-pass metabolism by cytochrome P450 3A4 (CYP3A4)."
    explanation: >-
      The quantitative basis of this node - the first-pass barrier that an
      inhibitor removes.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine cases (75%) were precipitated by drug-drug interactions with CYP3A4 inhibitors."
    explanation: >-
      Quantifies how much of modern severe ergotism runs through this node -
      three quarters of a consecutive poison-centre series.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "most cases of severe ergotism were associated with interaction with CYP3A4 inhibitors, which increase ergotamine bioavailability"
    explanation: States the bioavailability mechanism this node asserts.
- name: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
  biological_scale: MOLECULAR
  description: >-
    The pharmacological lesion. Ergot alkaloids bind serotonin and
    alpha-adrenergic receptors on vascular smooth muscle, acting as agonists
    and partial agonists rather than as the antagonists a drug designed for
    this target would be. Molecular docking puts ergocristinine at the 5-HT2A
    and alpha-2A adrenergic binding sites with hydrogen bonding to the site
    residues, and the pharmacological counterpart is that a non-competitive
    alpha-adrenergic antagonist attenuates the contraction the alkaloid
    produces.
  downstream:
  - target: Sustained Vascular Smooth Muscle Contraction
    causal_link_type: DIRECT
    description: >-
      Receptor occupancy on smooth muscle is what produces the contraction,
      which is why blocking the receptor blunts it.
    evidence:
    - reference: PMID:35775420
      reference_title: Sustained vascular contractile response induced by an R- and S-epimer of the ergot alkaloid ergocristine and attenuation by a noncompetitive antagonist.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Phenoxybenzamine caused a decrease in the contractile response induced by ergocristine and ergocristinine from 105 to 180 min, compared to the control"
      explanation: >-
        A pharmacological test of this edge - blocking alpha-adrenergic
        receptors with a non-competitive antagonist reduced the contraction the
        alkaloid had produced.
  - target: Central Serotonergic Overstimulation
    causal_link_type: DIRECT
    description: >-
      The same agonism at serotonin receptors in the central nervous system is
      a parallel branch, not a consequence of the vascular one.
    evidence:
    - reference: PMID:12849122
      reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The ergot alkaloids are serotonin agonists. Dihydroergotamine binds to serotonin receptors in the dorsal horn of the spinal cord, which is the site of neuropathological changes in convulsive ergotism."
      explanation: >-
        States the central serotonergic agonism and localises it to the tissue
        where the neuropathology of the convulsive form is found.
  molecular_functions:
  - preferred_term: agonism of ergot alkaloids at G protein-coupled serotonin receptors
    term:
      id: GO:0004993
      label: G protein-coupled serotonin receptor activity
  biological_processes:
  - preferred_term: serotonin receptor signaling driven by ergot alkaloid agonism
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007210
      label: serotonin receptor signaling pathway
  - preferred_term: adrenergic receptor signaling driven by ergot alkaloid agonism
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0071875
      label: adrenergic receptor signaling pathway
  notes: >-
    Both receptor-signalling descriptors take `GAIN_OF_FUNCTION` rather than
    `INCREASED` deliberately, under the rule in CLAUDE.md that distinguishes the
    two. The claim is qualitative, not quantitative: an exogenous agonist is
    driving these pathways outside host regulatory control, in the same way
    HTLV-1 Tax drives NF-kB in `Adult_T_Cell_Leukemia_Lymphoma`, rather than a
    normally regulated pathway running above its usual level. That trade gives
    up the PATO grounding `INCREASED` would carry, which is why it is recorded
    here.
  chemical_entities:
  - preferred_term: ergotamine
    term:
      id: CHEBI:64318
      label: ergotamine
  evidence:
  - reference: PMID:37213815
    reference_title: Investigation of the relationship between ergocristinine and vascular receptors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The binding energy (kcal/mol) of ergocristinine was - 9.7 or - 11.0 to the serotonin (5-HT) 2 A receptor and - 8.7 or - 11.4 to the alpha 2 A adrenergic receptor, depending on the software used."
    explanation: >-
      Docking affinities at both receptor families this node names. In silico,
      so it establishes the binding is plausible rather than measured.
  - reference: PMID:37213815
    reference_title: Investigation of the relationship between ergocristinine and vascular receptors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A hydrogen bond was formed between ergocristinine and amino acid residues of the 5-HT 2 A and alpha 2 A adrenergic receptor binding sites"
    explanation: The modelled interaction with the binding-site residues of both receptors.
  - reference: PMID:32629472
    reference_title: Assessment of the vasoactive effects of the (S)-epimers of ergot alkaloids in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "These effects are mainly related to the vasoconstrictive effects of ergot alkaloids, through structural similarity to biological amines binding to their receptor"
    explanation: States the structural-similarity mechanism this node rests on.
- name: Sustained Vascular Smooth Muscle Contraction
  biological_scale: CELLULAR
  description: >-
    What separates ergot vasoconstriction from ordinary vasoconstriction is how
    long it lasts. In an arterial tissue bath a single dose of ergocristine
    produced contraction sustained across a three-hour incubation, and the
    response persists well beyond the point at which the alkaloid would have
    been cleared. That persistence is why the clinical syndrome is a spasm that
    resists reversal rather than a transient squeeze, and why case reports
    describe failure of first-line vasodilators.
  downstream:
  - target: Arterial Vasospasm with Distal Hypoperfusion
    causal_link_type: DIRECT
    description: >-
      Contraction of the smooth muscle in the arterial wall is what narrows the
      lumen and cuts flow.
    evidence:
    - reference: PMID:32629472
      reference_title: Assessment of the vasoactive effects of the (S)-epimers of ergot alkaloids in vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "binding to their receptor, on multiple arterial and venous vascular beds impacting the blood supply to multiple organs"
      explanation: >-
        States that the vascular effect reduces blood supply across many organs,
        which is what this edge asserts.
  biological_processes:
  - preferred_term: sustained smooth muscle contraction driven by ergot alkaloid agonism
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0006939
      label: smooth muscle contraction
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:35775420
    reference_title: Sustained vascular contractile response induced by an R- and S-epimer of the ergot alkaloid ergocristine and attenuation by a noncompetitive antagonist.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both epimers produced a sustained contractile response over the 180-min incubation period in the control groups."
    explanation: The measured persistence this node is about, over a three-hour incubation.
  - reference: PMID:35775420
    reference_title: Sustained vascular contractile response induced by an R- and S-epimer of the ergot alkaloid ergocristine and attenuation by a noncompetitive antagonist.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The vascular contractile responses are often sustained for an extended period after exposure."
    explanation: States the general property rather than the single experiment.
  - reference: PMID:32629472
    reference_title: Assessment of the vasoactive effects of the (S)-epimers of ergot alkaloids in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "all tested (S)-epimers were found vasoactive and produced a concentration-dependent arterial contractile response similar to what has been reported for the (R)-epimers"
    explanation: >-
      Establishes the contractile response is concentration-dependent, and that
      the epimers long assumed inert also produce it - which bears on what a
      food-safety limit has to measure.
- name: Central Serotonergic Overstimulation
  biological_scale: CELLULAR
  description: >-
    The parallel branch, and the one that produces the convulsive form.
    Dihydroergotamine binds serotonin receptors in the dorsal horn of the
    spinal cord, which is where the neuropathological changes of convulsive
    ergotism are found. The clinical picture - twitching, spasm, altered mental
    state, hallucination, sweating and fever over weeks - is the picture of
    serotonergic overstimulation, and dihydroergotamine given to people can
    produce serotonin syndrome outright.
  downstream:
  - target: Convulsive and Neuropsychiatric Syndrome
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12849122
      reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The clinical features of convulsive ergotism--muscle twitching and spasms, changes in mental state, hallucinations, sweating, and fever lasting for several weeks--suggest serotonergic overstimulation of the CNS (ie, the serotonin syndrome)."
      explanation: States the inference from the clinical picture to this mechanism, which is this edge.
  biological_processes:
  - preferred_term: central serotonin receptor signaling driven by ergot alkaloid agonism
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007210
      label: serotonin receptor signaling pathway
  cell_types:
  - preferred_term: dorsal horn neuron
    term:
      id: CL:0000540
      label: neuron
  notes: >-
    The `dorsal horn neuron` cell type is bound to the broad `CL:0000540`
    neuron on purpose. CL does carry a narrower term - OLS `q=spinal cord
    dorsal horn interneuron, ontology=cl` returns `CL:0011000` dorsal horn
    interneuron - but the cited source says only "serotonin receptors in the
    dorsal horn of the spinal cord", and the dorsal horn contains projection
    neurons as well as interneurons. Binding `CL:0011000` would assert an
    interneuron the source does not name, which is the manufactured narrower
    match the term contract forbids. `q=dorsal horn neuron, ontology=cl`
    returns only dorsal root ganglion substance P neurons, which sit in the
    ganglion rather than the horn.
  evidence:
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dihydroergotamine binds to serotonin receptors in the dorsal horn of the spinal cord, which is the site of neuropathological changes in convulsive ergotism."
    explanation: >-
      Locates the binding in the tissue where the lesion is, which is what makes
      this a mechanism rather than an analogy.
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dihydroergotamine given to human beings can cause the serotonin syndrome."
    explanation: >-
      The human pharmacological evidence that an ergot alkaloid alone suffices
      to produce the syndrome this node describes.
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "An alkaloid, present in high concentrations in ergots from east of the Rhine, may have caused convulsive ergotism at a circulating concentration insufficient to produce peripheral ischaemia."
    explanation: >-
      The proposed reason the two forms separated geographically - a
      composition difference, at a dose below the vascular threshold. Stated by
      the author as a hypothesis, and curated as one.
- name: Arterial Vasospasm with Distal Hypoperfusion
  biological_scale: TISSUE
  description: >-
    The lesion as it appears on imaging: diffuse narrowing of arteries without
    atherosclerotic plaque or thrombus, with the distal extremities worst
    affected because prolonged spasm has the greatest effect where the arterial
    supply is least redundant. Angiography in a bilateral limb-ischaemia case
    showed diffuse spasm of the whole lower-limb arterial tree. Vasospasm also
    reaches the coronary, cerebral, renal and ocular circulations, which is
    where the severe non-limb outcomes come from.
  downstream:
  - target: Distal Tissue Ischemia and Dry Gangrene
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1908611
      reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients presented with acute severe ischemia of the lower limb requiring iv infusion of vasodilator drugs."
      explanation: The vasospasm-to-ischaemia step, in a seven-patient hospital series.
  - target: Vasospasm
    causal_link_type: DIRECT
  - target: Coronary artery spasm
    causal_link_type: DIRECT
    description: >-
      Coronary involvement, reported after obstetric ergometrine given for
      postpartum haemorrhage.
  - target: Intermittent claudication
    causal_link_type: DIRECT
  - target: Cerebral ischaemia
    causal_link_type: DIRECT
    description: >-
      Cerebral involvement. The same diffuse spasm reaches the cerebral
      circulation, producing cortical infarction with subcortical sparing - the
      imaging signature of a reversible vasoconstriction syndrome rather than
      of embolism or atherosclerosis.
    evidence:
    - reference: PMID:40046976
      reference_title: "Joining forces: a complex cardio-obstetrics case report of severe ergometrine-induced vasospasm."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brain magnetic resonance imaging (MRI) revealed extensive cerebral and cerebellar infarction with subcortical sparring."
      explanation: >-
        The cerebral lesion this edge asserts, in a patient whose disease is
        attributed to ergometrine-induced vasospasm.
  locations:
  - preferred_term: artery
    term:
      id: UBERON:0001637
      label: artery
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:33546816
    reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiography confirmed diffuse arterial vasospasm of the lower limb arteries."
    explanation: The imaging appearance this node describes, in a documented case.
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Historical aspects of ergotism are discussed together with reference to the relative vulnerability of different segments of the arterial circulation."
    explanation: >-
      Supports that vulnerability differs by arterial segment, which is why the
      distal extremities dominate. The abstract states the review covers this
      rather than giving the ranking, so the ranking itself is not asserted here.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients (83%) had signs of peripheral vascular insufficiency."
    explanation: How consistently this node appears in a consecutive severe-ergotism series.
- name: Distal Tissue Ischemia and Dry Gangrene
  biological_scale: TISSUE
  description: >-
    Where the spasm is not relieved, the tissue it supplies dies. The sequence
    runs burning paresthesia, then coldness and pallor, then absent pulses, then
    dry gangrene - the lesion that gave the medieval disease its name. It is
    reversible up to a point: recognised early the vascular changes resolve

    snippet: "Ingestion of infected rye grains containing ergot alkaloids-usually in the form of contaminated rye bread-causes poisoning, also known as ergotism."
    explanation: Names the specific vehicle of the historical epidemics.
- name: Therapeutic ergot alkaloid administration
  description: >-
    Ergotamine and dihydroergotamine for migraine, and ergometrine or
    methylergometrine for postpartum haemorrhage, are still in use. At
    therapeutic dose they are usually tolerated; the exposure becomes toxic
    through overdose, prolonged use, or - much the commonest route in modern
    series - a CYP3A4 interaction.
  exposure_term:
    preferred_term: therapeutic exposure to ergot alkaloid vasoconstrictors
    term:
      id: ECTO:9001855
      label: exposure to vasoconstrictor agent
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: MULTIPLE
    exposure_duration:
    - classification_value: INTERMITTENT
    - classification_value: CHRONIC
  influences_mechanisms:
  - target: Ergot Alkaloid Entry into the Circulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A prescription delivers one purified alkaloid, in place of the mixture a
      contaminated harvest delivers.
    evidence:
    - reference: PMID:24978905
      reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All cases involved ergotamine 1 mg/caffeine 100 mg combination tablets."
      explanation: >-
        Identifies the therapeutic preparation behind every case in a
        twelve-case series, which is this exposure.
  notes: >-
    Bound to `ECTO:9001855` exposure to vasoconstrictor agent rather than to the
    broader `ECTO:0000509` exposure to drug. `runoak -i sqlite:obo:ecto search
    'l~ergotamine'` returns nothing, so no agent-specific class exists;
    `search 'l~vasoconstrict'` returns `ECTO:9001855`, and `info ECTO:9001855
    -O obo` shows it is `is_a ECTO:0000509` exposure to drug and involves
    `CHEBI:50514` vasoconstrictor agent. That is exact for what these drugs are
    and for the property that makes them toxic here, so it is preferred to the
    parent. `exposure_route` is `MULTIPLE` because the implicated preparations
    are oral (ergotamine tablets), intramuscular (ergometrine) and intravenous
    (dihydroergotamine) across the cited cases.

    `exposure_duration` is `INTERMITTENT` and `CHRONIC` rather than `ACUTE`.
    Migraine dosing is by definition recurrent discrete exposures separated by
    exposure-free intervals, which is what `INTERMITTENT` means, and the cases
    in this entry ran for years - the fatal darunavir case records the patient
    "self-medicating for years", and `PMID:1908611` finds a subclinical phase
    preceding severe disease by weeks, which no 1-14 day window contains. An
    acute single overdose is a real presentation too, but it is the exception
    in the cited series rather than the shape of this exposure.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ergot's derivatives are widely used to treat and prevent migraine and, associated with heparin, for the prevention of deep vein thrombosis."
    explanation: Establishes the therapeutic uses that constitute this exposure.
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ergotamine tartrate was the responsible drug in four patients and dihydroergotamine(DHE)-heparin in three patients."
    explanation: Names the specific agents responsible in a consecutive series.
- name: Co-administration of a strong CYP3A4 inhibitor
  description: >-
    Not a source of ergot alkaloid, but the exposure that converts a
    therapeutic dose of one into a toxic dose. The implicated inhibitors are the
    HIV protease inhibitors, the booster cobicistat, and the macrolide
    antibiotics. This is now the dominant precipitant of severe ergotism in the
    published record, and the combination is regarded as contraindicated.
  exposure_term:
    preferred_term: co-exposure to a strong CYP3A4 inhibitor
    term:
      id: ECTO:0000509
      label: exposure to drug
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: ACUTE
    - classification_value: CHRONIC
  influences_mechanisms:
  - target: CYP3A4 Inhibition Raising Systemic Ergotamine Concentration
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      `EXACERBATES` rather than `TRIGGERS`: this exposure causes no disease by
      itself and acts only on the toxicity of a separate one.
    evidence:
    - reference: PMID:24531557
      reference_title: "Ergotism in Thailand caused by increased access to antiretroviral drugs: a global warning."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Concurrent intake of ergotamine and strong CYP3A4 inhibitors, such as the HIV protease inhibitors (PIs), can lead to clinical ergotism."
      explanation: States the co-exposure requirement and its consequence.
  notes: >-
    Bound to the broad `ECTO:0000509` exposure to drug on purpose. The exposure
    is defined by an enzyme-inhibition property shared across three unrelated
    drug classes rather than by any one agent, and there is no ECTO class for
    that property: `runoak -i sqlite:obo:ecto search 'l~cytochrome'` and
    `search 'l~CYP'` both return nothing, and `search 'l~protease inhibitor'`
    returns no exposure class either. The specific classes are named in
    `description` instead.

    `exposure_duration` carries both `ACUTE` and `CHRONIC` because the
    implicated drug classes sit at opposite ends of it: a macrolide course is a
    few days, while the HIV protease inhibitors and cobicistat behind most of
    the modern cases are taken indefinitely. The interaction needs only that
    the two exposures overlap, so neither value alone describes it.
  evidence:
  - reference: PMID:24531557
    reference_title: "Ergotism in Thailand caused by increased access to antiretroviral drugs: a global warning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 13 cases of clinical ergotism in HIV-infected patients has been published since 1997"
    explanation: >-
      The accumulated published burden of this specific co-exposure at the time
      of that review.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Critical ergotism continues to occur in Thailand, most commonly associated with the drug-drug interactions."
    explanation: Establishes this as the dominant modern precipitant in that setting.
diagnosis:
- name: Exposure history with non-atherosclerotic distal ischaemia
  notes: >-
    Left without a `diagnosis_term`. `diagnosis_term` is a `TreatmentDescriptor`
    whose term must be reachable from `NCIT:C25218` Clinical Intervention or
    Procedure, and history-taking is not in that branch: `NCIT:C146918` Medical
    History Taking exists and is the obvious candidate, but binding it fails
    dynamic-enum validation with "Value 'NCIT:C146918' not in dynamic enum
    'TreatmentActionTerm'". The OLS search behind that attempt, `q=medical
    history taking, ontology=ncit`, returns `NCIT:C146918` Medical History
    Taking, `NCIT:C83067` Medical History Occurrence, `NCIT:C85522` Medical
    History Yes No Indicator and `NCIT:C85833` Work-Up Examination; the first
    three are data-collection concepts rather than procedures and the fourth is
    broader than this entry. No binding is better than a wrong one.
  description: >-
    There is no confirmatory assay in routine use. The diagnosis is made by
    finding arterial insufficiency without atherosclerosis, thrombus or
    vasculitis, and then finding the exposure - which in the iatrogenic form
    means asking specifically about migraine self-medication and about any
    recently started drug. That question is the one that gets missed: in the
    fatal darunavir case the ergotamine use surfaced only after the ischaemia
    had spread and the family were interviewed.
  evidence:
  - reference: PMID:30662776
    reference_title: "Drug-Drug Interaction of Ergotamine with a Combination of Darunavir, Abacavir, and Lamivudine Causing a Fatal Vasospastic Ischemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians were not aware that patient was self-medicating for years with medication containing ergotamine and caffeine for migraines."
    explanation: >-
      The specific history failure this entry warns about, in the case where it
      proved fatal.
  - reference: PMID:30662776
    reference_title: "Drug-Drug Interaction of Ergotamine with a Combination of Darunavir, Abacavir, and Lamivudine Causing a Fatal Vasospastic Ischemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This diagnosis was established after evaluating the evolving 'and spreading' ischemia and CT scans and thoroughly interviewing patient's family."
    explanation: How the diagnosis was eventually reached in that case.
  - reference: PMID:30662776
    reference_title: "Drug-Drug Interaction of Ergotamine with a Combination of Darunavir, Abacavir, and Lamivudine Causing a Fatal Vasospastic Ischemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "in absence of any thrombophilic pathology or arteritides, thorough interview and physical examination are important to find clues to this rare disorder"
    explanation: States the diagnostic reasoning this entry describes - exclusion, then history.
- name: Vascular imaging showing diffuse spasm without occlusive lesion
  diagnosis_term:
    preferred_term: arteriography of the affected limb
    term:
      id: NCIT:C16308
      label: Arteriography
  description: >-
    Angiography or CT angiography shows smooth diffuse narrowing rather than
    plaque or clot. Duplex ultrasonography has been proposed for diagnosis and
    for following the response to treatment, which matters because the spasm
    resolves and a non-invasive test can show it doing so.
  evidence:
  - reference: PMID:33546816
    reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiography confirmed diffuse arterial vasospasm of the lower limb arteries."
    explanation: The angiographic finding this entry records.
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A case of ergotism is presented to illustrate the role of duplex ultrasonography in the diagnosis and management of this nonatherosclerotic cause of peripheral arterial disease."
    explanation: >-
      Establishes duplex ultrasound for both diagnosis and management, and names
      the non-atherosclerotic framing this section uses.
- name: Factitious hypotension from severe vasospasm
  diagnosis_term:
    preferred_term: non-invasive blood pressure measurement
    term:
      id: NCIT:C167233
      label: Blood Pressure Measurement
  description: >-
    A trap specific to this disease. Vasospasm severe enough to abolish the
    peripheral signal makes non-invasive blood pressure read as low or
    unmeasurable, so the patient appears shocked. Treating that apparent
    hypotension with a vasoconstrictor would be the wrong move; giving an
    intravenous vasodilator instead makes the recorded pressure rise
    paradoxically, which is both the clue and the treatment.
  evidence:
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of these patients initially had factitiously low or unmeasurable blood pressure using non-invasive technique and had paradoxical increase following intravenous vasodilator administration."
    explanation: >-
      The finding and its paradoxical response, in five of twelve patients -
      which is what makes it a usable sign rather than a curiosity.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factitious low blood pressure in these cases was likely caused by severe vasospasm."
    explanation: The authors' mechanistic reading, which is why it belongs to this disease specifically.
differential_diagnoses:
- name: Atherosclerotic and embolic limb ischaemia
  description: >-
    Acute limb ischaemia is far more often atherosclerotic, embolic or
    thrombotic than vasospastic, and the ergot history is not volunteered. This
    is the differential that delays the diagnosis.
  distinguishing_features:
  - >-
    Imaging shows smooth diffuse arterial narrowing rather than a focal
    occlusive lesion, plaque or thrombus.
  - >-
    The narrowing is reversible: vasodilator therapy and withdrawal of the drug
    restore flow, which no atherosclerotic lesion does.
  evidence:
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this nonatherosclerotic cause of peripheral arterial disease"
    explanation: Places ergotism explicitly outside the atherosclerotic category.
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case emphasizes the potential for complete reversibility of the vascular changes if recognized early."
    explanation: Supports reversibility as the discriminating feature listed here.
- name: Systemic vasculitis
  description: >-
    Ergotism can present as apparent vasculitis, with distal ischaemia and no
    obvious occlusive cause, and has been reported under exactly that framing.
  distinguishing_features:
  - >-
    Absence of thrombophilic or arteritic pathology on workup, with a history of
    ergot exposure.
  notes: >-
    Kept short and cited to one source. PMID:28661928, titled "Ergotism
    Masquerading Systemic Vasculitis", is the paper this differential is named
    after and is deliberately not cited: its cached record has no abstract at
    all, so there is no sentence to quote, and quoting the title would assert a
    finding from a string that only states a topic. The differential is
    supported instead by the exclusion reasoning below, which a cited abstract
    does state.
  evidence:
  - reference: PMID:30662776
    reference_title: "Drug-Drug Interaction of Ergotamine with a Combination of Darunavir, Abacavir, and Lamivudine Causing a Fatal Vasospastic Ischemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "in absence of any thrombophilic pathology or arteritides"
    explanation: Supports the distinguishing feature listed here.
treatments:
- name: Withdrawal of the ergot alkaloid
  description: >-
    The first and most important intervention, and in mild cases the only one
    needed. Because the toxicity is receptor occupancy by a clearable drug
    rather than structural damage, stopping the exposure allows the spasm to
    resolve - provided it is stopped before the tissue dies. A historical review
    of the disease found no convincing evidence that anything other than
    discontinuation helps, which is a strong claim about the rest of this
    section and is recorded as such.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: withdrawal of the causative ergot alkaloid
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Ergot Alkaloid Entry into the Circulation
    treatment_effect: INHIBITS
    description: >-
      Stopping the drug removes the exposure itself, which is upstream of every
      other node in the entry.
    evidence:
    - reference: PMID:1908611
      reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subclinical ergotism most probably precedes for weeks the onset of severe vasospasm, which calls for close monitoring of patients taking ergot's derivatives."
      explanation: >-
        Supports acting on the exposure as the intervention point, and that
        there is a monitoring window before severe disease. Indirect: it argues
        for monitoring rather than measuring the effect of withdrawal.
  evidence:
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case emphasizes the potential for complete reversibility of the vascular changes if recognized early."
    explanation: >-
      The reversibility that makes withdrawal sufficient when it happens in
      time.
- name: Intravenous vasodilator therapy
  description: >-
    For established severe vasospasm. Sodium nitroprusside relieved the spasm in
    five of six patients in one series, within hours to days, and no amputation
    was needed in that series despite severe and prolonged spasm. Nitrates and
    calcium channel blockers are also used, though a bilateral-ischaemia case
    records isosorbide dinitrate and amlodipine failing outright before more
    aggressive measures worked.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium nitroprusside
      term:
        id: CHEBI:29321
        label: sodium nitroprusside
  target_mechanisms:
  - target: Sustained Vascular Smooth Muscle Contraction
    treatment_effect: INHIBITS
    description: >-
      Vasodilators oppose the contraction directly rather than removing the
      alkaloid, which is why they work while the drug is still present.
    evidence:
    - reference: PMID:1908611
      reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Intravenous administration of sodium nitroprusside (n = 6) relieved vasospasm in all but one of the patients within hours to days"
      explanation: Measures the effect on the vasospasm this edge targets.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No amputation was required in this series in spite of severe and prolonged vasospasms."
    explanation: The outcome achieved in a series managed this way.
  - reference: PMID:33546816
    reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A first-line therapy with isosorbide dinitrate and amlodipine was ineffective, with rapid clinical worsening."
    explanation: >-
      A case where first-line vasodilators failed and the patient deteriorated,
      which is why this treatment is not recorded as reliably sufficient.
- name: Endovascular revascularisation
  description: >-
    Reserved for spasm that does not yield to drugs. In one case, intra-arterial
    and intravenous vasodilators combined with multisite transluminal balloon
    angioplasty and bilateral four-compartment fasciotomy restored flow along
    the whole lower-limb arterial tree and saved both legs, without the spasm
    recurring.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: multisite transluminal balloon angioplasty
    term:
      id: NCIT:C93007
      label: Balloon Angioplasty
  target_mechanisms:
  - target: Arterial Vasospasm with Distal Hypoperfusion
    treatment_effect: INHIBITS
    description: Mechanical dilatation of the spastic segment restores the lumen.
    evidence:
    - reference: PMID:33546816
      reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All along the lower limb arterial tree, transluminal balloon angioplasty restored the blood flow, without vasospasm recurrence."
      explanation: The measured effect on the vasospasm node, including its durability.
  evidence:
  - reference: PMID:33546816
    reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combination of intra-arterial injections and intra-venous infusions of vasodilators, transluminal balloon angioplasty and bilateral 4-Compartment fasciotomies permitted rapid improvement and finally resulted in both lower limbs rescue."
    explanation: The full combination used and the limb-salvage outcome.
  - reference: PMID:33546816
    reference_title: "Ergotism with acute limb ischemia, provoked by HIV protease inhibitors interaction with ergotamine, rescued by multisite transluminal balloon angioplasty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In case of ergotism with acute lower limbs ischemia, combining medical vasodilator therapy with interventional procedure can restore the arterial blood flow, thus allowing to save lower limbs."
    explanation: The authors' own recommendation for where this sits in management.
- name: Corticosteroid rescue therapy
  description: >-
    A second-line option for spasm that does not yield to a vasodilator. In one
    case, pulses that had been lost despite sodium nitroprusside and heparin
    became palpable two hours after a single 1 mg/kg intravenous dose of
    methylprednisolone sodium succinate, with angiographic improvement at twelve
    hours. The authors state plainly that the mechanism is unknown, which is why
    this is recorded as an observation about an intractable case rather than as
    a mechanism-directed treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone sodium succinate
      term:
        id: CHEBI:6890
        label: Methylprednisolone sodium succinate
  notes: >-
    No `target_mechanisms`. An edge would have to name the node the steroid
    acts on, and the cited source explicitly declines to: "The mechanism by
    which corticosteroids dilate arteries is not clear." Leaving the treatment
    unlinked records what is known; guessing at the receptor node would not.

    Heparin was co-administered in this case and is named in the same sentence
    as the nitroprusside, but no outcome is attributed to it and the recovery
    followed the steroid. It is therefore not curated as a separate treatment
    here - a treatment whose only support is that it was given alongside
    something else is not a treatment claim.
  evidence:
  - reference: PMID:18763151
    reference_title: Reversal of ergotamine-induced vasospasm following methylprednisolone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ischemia in an extremity secondary to ergotamine-induced vasospasm unresponsive to sodium nitroprusside may be treated successfully with methylprednisolone."
    explanation: >-
      The authors' conclusion, and the specific niche this treatment occupies -
      after a vasodilator has failed.
  - reference: PMID:18763151
    reference_title: Reversal of ergotamine-induced vasospasm following methylprednisolone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pulses were palpable 2 h after the methylprednisolone dose."
    explanation: The measured response, and how fast it came.
  - reference: PMID:18763151
    reference_title: Reversal of ergotamine-induced vasospasm following methylprednisolone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although vasodilator agents are first-line therapy in the treatment of ergotism, corticosteroids may be considered as an alternative therapy, especially for intractable cases."
    explanation: >-
      Places this treatment second-line, which is how the entry orders it, and
      is the authors' framing rather than their result.
- name: Amputation of non-viable tissue
  description: >-
    The salvage procedure once gangrene is established. Two of twelve patients
    in a modern poison-centre series required partial foot amputation. It is
    included because the entry would otherwise imply that every case either
    resolves or kills, when the commonest bad outcome is neither.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: partial foot amputation for established gangrene
    term:
      id: NCIT:C15179
      label: Amputation
  notes: >-
    No `target_mechanisms`, and none of the `TreatmentEffectEnum` values fits.
    Amputation does not inhibit, activate, modulate, bypass or restore any node
    in this entry; it removes the tissue that the last node in the chain has
    already killed. The absence is the accurate record.
  evidence:
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients required partial foot amputations due to gangrene."
    explanation: >-
      Establishes that amputation was required, in what proportion, and for
      what lesion.
- name: Sympathectomy
  description: >-
    Attempted historically and recorded as unhelpful. Two patients in a
    seven-patient series underwent it without improvement in their clinical
    course, which is worth keeping because it is a negative result that a
    plausible mechanism would have predicted to work.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: sympathectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  notes: >-
    Bound to the generic `NCIT:C15329` because NCIT has no sympathectomy term.
    OLS `q=sympathectomy` returns `SNOMED:57071006`, `mesh:D013562`,
    `OMIT:0014426` and four further SNOMED children, and no NCIT identifier at
    all; `q=sympathectomy, ontology=ncit`, `q=sympathetic denervation,
    ontology=ncit` and `q=lumbar sympathectomy, ontology=ncit` each return
    nothing. `NCIT:C21110` Sympathetic Block exists but names an anaesthetic or
    chemical block rather than the surgical division performed in the cited
    series, so it is not a substitute. The specificity is carried in
    `preferred_term`.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A sympathectomy was performed in two patients which did not improve the clinical course."
    explanation: >-
      The negative result. Curated as `REFUTE` against this treatment rather
      than omitted, since a reader would otherwise reasonably expect
      sympathetic interruption to help a vasospastic disease.
progression:
- phase: Subclinical vasospasm
  duration: weeks
  notes: >-
    Reported to precede severe disease by weeks in patients taking ergot
    derivatives, and reported at far higher prevalence than severe ergotism.
    This phase is the reason monitoring is recommended, and the reason the
    burden level for this entry is `VARIABLE` rather than a single tier.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subclinical ergotism most probably precedes for weeks the onset of severe vasospasm, which calls for close monitoring of patients taking ergot's derivatives."
    explanation: States both the existence of this phase and its duration.
- phase: Acute vasospastic or convulsive illness
  duration: days to weeks
  notes: >-
    The clinical syndrome. In the gangrenous form it runs over days, from
    paresthesia through pulse loss toward gangrene; in the convulsive form the
    features are described as lasting several weeks.
  evidence:
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "sweating, and fever lasting for several weeks"
    explanation: The duration of the convulsive form.
- phase: Resolution or fixed ischaemic injury
  duration: days
  notes: >-
    Monophasic and bimodal in outcome. The vasospasm either resolves, completely
    in cases caught early, or the tissue it starved has already died and the
    loss is permanent.
  evidence:
  - reference: PMID:28031641
    reference_title: "Ergotism: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case emphasizes the potential for complete reversibility of the vascular changes if recognized early."
    explanation: The resolution arm and the condition on reaching it.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients required partial foot amputations due to gangrene."
    explanation: The other arm, in the same disease.
prevalence:
- population: Geneva, severe iatrogenic ergotism
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.5
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Reported as an upper bound - less than 0.5 per 100,000 per year - so
    `rate_per_100000` records the bound rather than a point estimate. The band
    is the Orphanet tier that bound falls in. This covers severe disease only;
    the same paper cites a 15% prevalence of subclinical ergotism among users,
    which is a different measure on a different denominator and is recorded in
    `progression` rather than forced into this record.
  evidence:
  - reference: PMID:1908611
    reference_title: "Severe iatrogenic ergotism: incidence and clinical importance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is concluded that incidence of severe ergotism is less than 0.5/100,000/year in Geneva."
    explanation: The rate and population this record reports.
- population: Ramathibodi Poison Center, Bangkok, 2006-2013
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Twelve cases over seven and a half years at one referral poison centre. A
    case count, not a rate: the denominator is the centre's referral catchment
    rather than a population, so no incidence can be derived from it.
  evidence:
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve cases of ergotism were identified."
    explanation: The case count this record reports.
  - reference: PMID:24978905
    reference_title: Ergotism and factitious hypotension associated with interaction of ergotamine with CYP3A4 inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "data obtained retrospectively from all patients with ergotism referred to Ramathibodi Poison Center in Bangkok, Thailand from January 2006 to August 2013"
    explanation: The catchment and window that makes this a count rather than a rate.
animal_models:
- name: Sheep single-dose oral ergot sclerotia exposure
  species: Sheep
  description: >-
    Twelve adult ewes, six dosed once orally with ground ergot sclerotia at 600
    ug/kg bodyweight total ergot and six given water, euthanised twelve hours
    later, with the pedal artery of the left hind limb mounted in an isolated
    tissue bath and its contractile response to phenylephrine compared between
    groups. This is the closest thing to a controlled experiment on the human
    disease that exists: the exposure is the same sclerotial alkaloid mixture,
    the route is oral, and the readout is the vascular smooth muscle response
    this entry's chain runs through. It models the vascular arm only - sheep
    ergotism is a gangrenous disease, and nothing here addresses the convulsive
    branch.
  publication: PMID:33924041
  evidence:
  - reference: PMID:33924041
    reference_title: Vasoactive Effects of Acute Ergot Exposure in Sheep.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Each ewe within the treatment group received a single oral treatment of ground ergot sclerotia at a dose of 600 µg/kg BW (total ergot) while each ewe in the control group received water."
    explanation: >-
      The design that makes this a controlled model rather than an observation:
      a dosed group, a water control, and a defined alkaloid load.
  modeled_mechanisms:
  - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Exposure to the sclerotial alkaloid mixture left the pedal artery more
      sensitive to an alpha-1 agonist, and an alpha-1 antagonist was a more
      potent blocker in exposed animals than in controls - which is the
      adrenergic half of this node measured directly rather than inferred.
    limitations: >-
      Only the alpha-1 adrenergic arm is interrogated. The 5-HT receptor
      contribution that this node also asserts is not measured here, and the
      authors reach it only through the general statement they cite from
      elsewhere. Twelve animals, one dose, one timepoint.
    readouts:
    - name: Pedal artery contractile sensitivity to phenylephrine
      target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
      description: >-
        EC50 for phenylephrine-induced contraction of the isolated dorsal
        metatarsal III artery, exposed group against water control.
      direction: INCREASED
      interpretation: >-
        Increased sensitivity to an alpha-1 agonist after ergot exposure is the
        measurable signature of ergoline action at the adrenergic receptor.
      evidence:
      - reference: PMID:33924041
        reference_title: Vasoactive Effects of Acute Ergot Exposure in Sheep.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Acute exposure to ergot alkaloids resulted in a 38% increase in vascular sensitivity to PE compared to control"
        explanation: The measurement itself, with its effect size and comparator.
    evidence:
    - reference: PMID:33924041
      reference_title: Vasoactive Effects of Acute Ergot Exposure in Sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study may indicate that the dry gangrene seen in sheep, and likely other species, might be related to the activation of α1-adrenergic receptor."
      explanation: >-
        The authors' own reading of what their model is informative for - the
        receptor node, and through it the gangrene.
  - target: Sustained Vascular Smooth Muscle Contraction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The isolated-vessel preparation reads out contraction of vascular smooth
      muscle, which is this node, in tissue taken from an animal exposed by the
      same route as a human eating contaminated grain.
    limitations: >-
      Twelve hours after a single dose. Human ergotism is usually the product
      of sustained exposure, and the entry's own progression section describes
      a subclinical phase running for weeks, which a single-dose model cannot
      reach.
    evidence:
    - reference: PMID:33924041
      reference_title: Vasoactive Effects of Acute Ergot Exposure in Sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to chronic exposure, acute exposure to ergot alkaloids results in increased vascular sensitivity to PE."
      explanation: >-
        States that the acute model reproduces what chronic exposure does,
        which is the claim that makes it informative for this node.
- name: Cattle fescue toxicosis (endophyte-infected tall fescue grazing)
  species: Cattle
  description: >-
    Cattle grazing endophyte-infected tall fescue ingest ergopeptine alkaloids
    and develop a vasoconstrictive syndrome; cattle are also susceptible to
    gangrenous ergotism from Claviceps-contaminated feed. This is a naturally
    occurring disease in an outbred population on an unrestricted diet, which
    is its value and its limitation at once: the exposure is real but
    uncontrolled, the principal alkaloid in fescue is ergovaline rather than
    the Claviceps mixture humans encounter, and the studied endpoints are herd
    performance and cytokine profiles rather than the vascular lesion.
  notes: >-
    Included because it is the model the literature on this disease actually
    uses, not because it is a close match. The report that informed this entry
    described fescue toxicosis as closely recapitulating the human gangrenous
    phenotype and cited a veterinary manual and a farming magazine for it; the
    peer-reviewed source cited here supports chronic ergot-alkaloid exposure
    and a tolerance split, and a separate review supports cattle susceptibility
    to gangrenous ergotism. Neither establishes the recapitulation claim, so
    the link below is `PARTIALLY_RECAPITULATES` rather than `RECAPITULATES`.
  publication: PMID:33327425
  evidence:
  - reference: PMID:33327425
    reference_title: Evaluation of Resistance to Fescue Toxicosis in Purebred Angus Cattle Utilizing Animal Performance and Cytokine Response.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fescue toxicosis is a multifaceted syndrome common in cattle grazing endophyte-infected tall fescue"
    explanation: Establishes the exposure and the syndrome this model rests on.
  - reference: PMID:22903169
    reference_title: "Human and cattle ergotism since 1900: symptoms, outbreaks, and regulations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cattle are particularly susceptible to both gangrenous and hyperthermic ergotism (also called summer syndrome)."
    explanation: >-
      The gangrenous form in cattle, which is what makes the species relevant
      to the human gangrenous disease at all.
  modeled_mechanisms:
  - target: Distal Tissue Ischemia and Dry Gangrene
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Cattle exposed to ergot alkaloids develop gangrenous ergotism, so the
      species reaches the same endpoint node as the human disease by the same
      dietary route.
    limitations: >-
      The alkaloid is different - ergovaline from an endophyte in fescue rather
      than the Claviceps sclerotial mixture - and the cited cattle study
      measured herd performance and cytokines, not the ischaemic lesion. The
      gangrene claim rests on statements about the species rather than on a
      measurement in these animals, and those statements qualify it heavily:
      gangrenous ergotism in cattle is described as rare, requiring acute
      exposure to very high alkaloid concentrations together with cold
      temperatures, while what chronic fescue grazing usually produces is
      reduced productivity and reduced blood flow to the extremities. So the
      species reaches this node, but not by the route or at the frequency the
      human gangrenous disease does.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The cited study's measured quantities are animal performance
        parameters and circulating cytokines. This node's quantity is tissue
        perfusion and necrosis in the distal extremity. Performance decline
        under chronic ergot exposure is a downstream systemic consequence, not
        the lesion.
      evidence:
      - reference: PMID:33327425
        reference_title: Evaluation of Resistance to Fescue Toxicosis in Purebred Angus Cattle Utilizing Animal Performance and Cytokine Response.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "could accurately distinguish between tolerant and susceptible animals based on the performance parameters in cattle chronically exposed to ergot alkaloids"
        explanation: >-
          Names what this study measured - performance parameters - which is
          the quantity standing in for the lesion.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The exposure differs in kind, not only in species. These cattle grazed
        infected pasture continuously for thirteen weeks; the human iatrogenic
        form is a discrete oral dose taken at a migraine attack, and the human
        dietary form is contaminated flour eaten as meals. The shared feature
        is the receptor pharmacology, not the dose, the schedule, or the
        alkaloid.
      evidence:
      - reference: PMID:33327425
        reference_title: Evaluation of Resistance to Fescue Toxicosis in Purebred Angus Cattle Utilizing Animal Performance and Cytokine Response.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Angus cows grazed endophyte-infected tall fescue at two locations for 13 weeks starting in mid-April 2016."
        explanation: The exposure schedule this divergence contrasts with the human one.
    evidence:
    - reference: PMID:22903169
      reference_title: "Human and cattle ergotism since 1900: symptoms, outbreaks, and regulations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cattle are particularly susceptible to both gangrenous and hyperthermic ergotism (also called summer syndrome)."
      explanation: The basis for linking this species to the gangrene node.
    - reference: PMID:33327425
      reference_title: Evaluation of Resistance to Fescue Toxicosis in Purebred Angus Cattle Utilizing Animal Performance and Cytokine Response.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "the symptoms of this multifaceted disease range from acute outbreaks of gangrenous ergotism to more subtle and chronic decreases in livestock productivity"
      explanation: >-
        Places gangrenous ergotism at one end of the cattle syndrome's range,
        which is what makes the species informative for this node.
    - reference: PMID:33327425
      reference_title: Evaluation of Resistance to Fescue Toxicosis in Purebred Angus Cattle Utilizing Animal Performance and Cytokine Response.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "While the gangrenous ergotism is rare and most likely due to acute exposure to very high concentrations of ergot alkaloids, combined with cold temperatures"
      explanation: >-
        Cuts against treating this as a faithful model of the human gangrenous
        disease: in cattle the lesion is rare and needs an acute high dose plus
        cold, where the human dietary and iatrogenic forms need neither. Kept
        as a `REFUTE` on the link rather than buried in prose, because it is
        the strongest argument against the link it sits on.
experimental_models:
- name: Bovine lateral saphenous vein myography
  experimental_model_type: OTHER
  description: >-
    Isolated lateral saphenous vein rings from cattle mounted for myography.
    This is the standard ex vivo preparation in the ergot-alkaloid vascular
    literature, and the study cited here uses it to establish which serotonin
    receptor subtypes the vessel carries and what each does - the receptor
    repertoire that the ergoline agonism node acts on.
  organism:
    preferred_term: cattle
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  publication: PMID:38946059
  notes: >-
    Cited for the vessel's receptor pharmacology, not for ergot action. The
    study's agonists are serotonin itself and subtype-selective 5-HT agonists;
    no ergot alkaloid was applied. The deep-research report listed this
    preparation among ergot-alkaloid model systems, which overstates what this
    particular paper shows, and the `divergences` block below records that
    rather than repeating it.
  evidence:
  - reference: PMID:38946059
    reference_title: Serotonin receptor-mediated vasorelaxation occurs primarily through 5-HT(4) activation in bovine lateral saphenous vein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "isolated lateral saphenous veins from cattle were assessed for vasoactivity using myography in response to increasing concentrations of 5-HT or selective 5-HT receptor agonists"
    explanation: The preparation and what was applied to it.
  modeled_mechanisms:
  - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Establishes which 5-HT receptor subtypes are present and functional in a
      peripheral vein, and that most of the relaxing response runs through
      5-HT4 - the pharmacological background against which an ergoline's mixed
      agonism at this node has to be read.
    limitations: >-
      No ergot alkaloid was applied in this study, so it cannot show ergoline
      action at these receptors; it characterises the receptors. It also reads
      out vasorelaxation, the opposite direction from the contraction this
      entry's chain runs through, and it is a vein rather than the peripheral
      artery where the human lesion forms.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is the vasoactive response to serotonin and to
        subtype-selective 5-HT agonists. This node's quantity is receptor
        occupancy and activation by an ergot alkaloid. A shared receptor is
        not a shared ligand, and ergolines are partial agonists at several
        subtypes at once.
      evidence:
      - reference: PMID:38946059
        reference_title: Serotonin receptor-mediated vasorelaxation occurs primarily through 5-HT(4) activation in bovine lateral saphenous vein.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "isolated lateral saphenous veins from cattle were assessed for vasoactivity using myography in response to increasing concentrations of 5-HT or selective 5-HT receptor agonists"
        explanation: >-
          Names the ligands actually applied, which is what makes this a proxy
          for ergoline action rather than a measurement of it.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The alpha-adrenergic half of this node is outside the preparation as
        used here - only serotonergic agonists were applied. Phenylephrine
        appears solely as the pre-contraction the relaxation is measured
        against, not as an object of study.
      evidence:
      - reference: PMID:38946059
        reference_title: Serotonin receptor-mediated vasorelaxation occurs primarily through 5-HT(4) activation in bovine lateral saphenous vein.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Vasoactive response data were normalized as a percentage of the maximum contractile response induced by the phenylephrine pre-contraction."
        explanation: >-
          Shows the alpha-1 agonist used only to set the baseline, with every
          test agonist serotonergic.
    evidence:
    - reference: PMID:38946059
      reference_title: Serotonin receptor-mediated vasorelaxation occurs primarily through 5-HT(4) activation in bovine lateral saphenous vein.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Approximately 94% of the vasorelaxation occurring in response to 5-HT could be accounted for through 5-HT4, providing strong evidence that 5-HT-mediated vasorelaxation occurs through 5-HT4 activation in bovine peripheral vasculature."
      explanation: >-
        The receptor-subtype result this preparation contributes, which is what
        it is cited for.
- name: Clavine-type ergot alkaloid cytotoxicity in HepG2 and PANC-1 cells
  experimental_model_type: CELL_LINE
  description: >-
    Two human carcinoma cell lines exposed to clavine-type ergot alkaloids -
    pyroclavine, agroclavine and festuclavine - with apoptosis read out by
    annexin V / propidium iodide double staining on flow cytometry. Agroclavine
    is named a causative agent of ergotism and is monitored by EFSA, and the
    same study found clavine-type alkaloids alongside the peptide-type ones in
    most of the Japanese sclerotia it analysed, so this is a real constituent
    of the exposure rather than a laboratory curiosity.
  cell_source: immortalized human carcinoma cell lines
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:36635416
  notes: >-
    Included as the only structured record in this entry of a mechanism that is
    not vasoconstriction. Every other node here runs through receptor agonism
    and ischaemia; direct cytotoxicity would be a parallel route to tissue
    injury. The cell lines are hepatoma and pancreatic carcinoma, neither of
    which is a tissue this disease damages, so the link below is `MEASURES` at
    `LOW` fidelity and no pathophysiology node asserts direct cytotoxicity in
    the human disease. The open question is recorded as a `KNOWLEDGE_GAP`
    discussion rather than as a mechanism.
  evidence:
  - reference: PMID:36635416
    reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We performed annexin V and PI double-staining followed by flow cytometric analysis to detect apoptosis in HepG2 and PANC-1 cells after exposure to Clavine-type EAs."
    explanation: The preparation, the exposure and the assay.
  modeled_mechanisms:
  - target: Distal Tissue Ischemia and Dry Gangrene
    relationship: MEASURES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows that a constituent of the ingested exposure kills cells outright at
      the concentrations tested, which is a candidate contributor to the tissue
      loss this node records and is independent of perfusion.
    limitations: >-
      Nothing here is vascular, distal or ischaemic. The cells are HepG2
      hepatoma and PANC-1 pancreatic carcinoma lines under a direct alkaloid
      application; the human lesion is necrosis of a distal extremity starved
      of blood. No concentration reached in a poisoned patient is established
      as comparable, and the authors themselves state the cytotoxic mechanism
      is unelucidated. This link records that the observation exists, not that
      it operates in the disease.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is annexin V / PI-defined apoptosis in a
        carcinoma cell line under direct application. This node's quantity is
        necrosis of distal tissue following sustained arterial spasm. Cell
        death is common to both, but its cause is the thing in dispute.
      evidence:
      - reference: PMID:36635416
        reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We performed annexin V and PI double-staining followed by flow cytometric analysis to detect apoptosis in HepG2 and PANC-1 cells after exposure to Clavine-type EAs."
        explanation: The assay and cell types that constitute the proxy quantity.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model observes single cells in culture; the node it is linked to is
        a tissue-level lesion. Apoptosis in a dish does not aggregate to
        necrosis of a limb segment without an account of how many cells, in
        which tissue, at what exposure - none of which this model supplies. The
        one-step gap from `CELLULAR` to `TISSUE` is why this link is `MEASURES`
        rather than `PARTIALLY_RECAPITULATES`.
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        The circulation is not in the model at all. Absorption, first-pass
        metabolism, plasma protein binding and delivery to the distal limb are
        all outside its boundary, so the model cannot say whether the tested
        concentrations are ever reached in the tissue that dies.
      evidence:
      - reference: PMID:36635416
        reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Clavine-type EAs reduced cell viability and induced apoptosis in both cell lines."
        explanation: >-
          The whole of what the model reports: a direct application to cells in
          culture, with no absorption or delivery step anywhere in it.
    evidence:
    - reference: PMID:36635416
      reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Clavine-type EAs reduced cell viability and induced apoptosis in both cell lines."
      explanation: The result this link records.
discussions:
- discussion_id: direct_clavine_cytotoxicity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does direct cytotoxicity of the clavine-type ergot alkaloids contribute to
    the tissue loss in ergotism, alongside ischaemia from vasospasm?
  attaches_to:
  - pathophysiology#Distal Tissue Ischemia and Dry Gangrene
  - experimental_models#Clavine-type ergot alkaloid cytotoxicity in HepG2 and PANC-1 cells
  rationale: >-
    Every pathophysiology node in this entry reaches tissue injury the same
    way: receptor agonism, sustained contraction, vasospasm, starvation of the
    distal tissue. That account is well supported and it may not be the whole
    account. Clavine-type ergot alkaloids reduce cell viability and induce
    apoptosis in human cell lines outright, with no vessel involved, and
    agroclavine - one of the clavines tested - is named a causative agent of
    ergotism and is monitored in food by EFSA. The same survey found clavine
    and peptide alkaloids together in most of the sclerotia it analysed, so a
    person eating contaminated grain is exposed to both.

    What is missing is any bridge from the dish to the limb. The cells are
    HepG2 hepatoma and PANC-1 pancreatic carcinoma, neither of which is a
    tissue this disease damages; the alkaloid is applied directly at
    concentrations nobody has related to a plasma level in a poisoned patient;
    and the authors state that the cytotoxic mechanism itself is unelucidated.
    So this cannot currently be modelled as a mechanism. It is recorded here
    because the alternative - saying nothing - would leave the entry asserting
    that ischaemia is the only route to the lesion, which the evidence does not
    establish either.

    Two things would settle it: a cytotoxicity measurement in vascular
    endothelium, smooth muscle or skin rather than carcinoma lines, and a
    pharmacokinetic comparison between the concentrations that kill cells and
    the concentrations reached in the distal circulation during poisoning. Note
    also that the iatrogenic form of this disease involves no clavines at all -
    ergotamine and ergometrine are peptide-type - so if direct cytotoxicity
    does contribute, it would differentiate the dietary form from the drug
    form rather than apply to both.
  evidence:
  - reference: PMID:36635416
    reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clavine-type EAs are known to cause cytotoxicity, but the mechanism has not been elucidated."
    explanation: >-
      States the gap directly: the cytotoxicity is established and its
      mechanism is not.
  - reference: PMID:36635416
    reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clavine-type EAs reduced cell viability and induced apoptosis in both cell lines."
    explanation: The observation that raises the question.
  - reference: PMID:36635416
    reference_title: "Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction of apoptosis by Clavine-type compounds."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These results suggest that Clavine-type EAs are a family of compounds requiring attention in food safety and livestock production in Japan."
    explanation: >-
      The authors' own framing of why this matters, which is a food-safety
      argument rather than a claim about human pathophysiology.
- discussion_id: convulsive_form_as_serotonin_syndrome
  kind: KNOWLEDGE_GAP
  prompt: >-
    Was convulsive ergotism epidemic serotonin syndrome, and does that identity
    hold well enough to model the two as the same mechanism?
  attaches_to:
  - pathophysiology#Central Serotonergic Overstimulation
  - pathophysiology#Convulsive and Neuropsychiatric Syndrome
  rationale: >-
    The argument is good and it is still an argument. Ergot alkaloids are
    serotonin agonists; dihydroergotamine binds serotonin receptors in the
    dorsal horn, which is where the neuropathology of convulsive ergotism was
    found; dihydroergotamine can cause serotonin syndrome in people; and the
    clinical picture - twitching, spasm, altered mental state, sweating, fever -
    is the picture of serotonergic excess. That is a chain of circumstantial
    fits, not a demonstration, and the epidemics it explains ended before
    anyone could measure anything in a patient.

    The geographical split is the part that most needs explaining and is least
    settled. Convulsive outbreaks east of the Rhine and gangrenous ones west of
    it is a striking pattern, and the proposed explanation - an alkaloid
    abundant in eastern ergot acting on the CNS at a concentration too low to
    close down peripheral arteries - is offered by the author as a possibility,
    with the alkaloid unnamed. Confirming it would need compositional analysis
    of historical ergot from both regions against a modern receptor panel.
  notes: >-
    Recorded as a gap rather than curated as fact. The entry models the central
    serotonergic branch, which is well supported, without asserting the
    identification with serotonin syndrome, which is not.
  evidence:
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The serotonin syndrome may, therefore, have been a public-health problem long before it was recognised as a complication of modern psychopharmacology."
    explanation: >-
      The claim at its strongest, in the author's own words, and hedged by the
      author with "may".
  - reference: PMID:12849122
    reference_title: "Convulsive ergotism: epidemics of the serotonin syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "An alkaloid, present in high concentrations in ergots from east of the Rhine, may have caused convulsive ergotism at a circulating concentration insufficient to produce peripheral ischaemia."
    explanation: >-
      The proposed explanation of the geographical split, stated as a
      possibility and with the alkaloid unidentified.
- discussion_id: s_epimer_bioactivity_and_food_limits
  kind: KNOWLEDGE_GAP
  prompt: >-
    If the (S)-epimers of ergot alkaloids are vasoactive after all, do the
    regulatory limits that measure only (R)-epimers understate dietary
    exposure?
  attaches_to:
  - pathophysiology#Sustained Vascular Smooth Muscle Contraction
  - environmental#Ingestion of cereal grain contaminated with Claviceps sclerotia
  rationale: >-
    Ergot alkaloids exist as (R)- and (S)-epimers, and only the (R) forms are
    monitored in diets in North America, on the understanding that the (S)
    forms are biologically inactive. Tissue-bath work contradicts that: all four
    (S)-epimers tested produced concentration-dependent arterial contraction
    comparable to the (R) forms, and one of them, ergotaminine, contracted more
    strongly than two of the (R)-side comparators at the highest concentration
    used. A second study found the (S)-epimer producing a sustained contraction
    too, though weaker than the (R) form, and a docking study puts it at the
    5-HT2A and alpha-2A sites.

    What this does not establish is how much it matters in a diet. The
    experiments are bovine arterial tissue at defined molar concentrations, not
    dietary exposure; the two epimers interconvert in a way that depends on
    temperature, pH and solvent, so the ratio in a food is not fixed; and no
    study has yet asked whether including the (S) forms would change where a
    regulatory limit should sit. The authors go as far as saying the (S) forms
    should be monitored, which is a recommendation rather than a quantified
    risk.

name: Ergotism
creation_date: "2026-09-18T03:30:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Mycotoxicosis
- Adverse Drug Reaction
parents:
- mycotoxicosis
synonyms:
- ergot poisoning
- ergot alkaloid toxicity
- ergotoxicosis
- St Anthony's Fire
- Saint Anthony's Fire
- ignis sacer
- holy fire
description: >-
  Ergotism is intoxication by ergot alkaloids - ergoline compounds produced by
  fungi of the genus Claviceps, classically Claviceps purpurea, which replaces
  the grain of rye and other cereals with a dark sclerotium. The ergoline ring
  is close enough in shape to serotonin, noradrenaline and dopamine that the
  alkaloids act as agonists and partial agonists at 5-HT and alpha-adrenergic
  receptors. On vascular smooth muscle this produces arterial contraction that
  is unusually prolonged, outlasting the exposure by hours, and the resulting
  vasospasm starves distal tissue of blood.

  Two clinical forms have been recognised since the medieval epidemics and are
  still the standard division. Gangrenous ergotism is the vasospastic one:
  burning pain and paresthesia in the extremities, then coldness, pallor and
  loss of pulses, then dry gangrene that historically cost people their feet.
  Convulsive ergotism is neuropsychiatric - muscle twitching and spasm, altered
  mental state, hallucinations, sweating and fever persisting for weeks - and
  has been argued to be epidemic serotonin syndrome, recognised centuries
  before the modern syndrome was named. A gastrointestinal form is also
  described. Which form predominated in a given epidemic tracked the alkaloid
  composition of the local ergot rather than the dose, with convulsive
  outbreaks east of the Rhine and gangrenous ones west of it.

  The disease did not end with clean grain. Its dominant modern form is
  iatrogenic: ergotamine and dihydroergotamine are still prescribed for
  migraine and ergometrine for postpartum haemorrhage, and ergotamine has less
  than 5% oral bioavailability because CYP3A4 destroys it on first pass. Add a
  strong CYP3A4 inhibitor - an HIV protease inhibitor, cobicistat, a macrolide
  - and that barrier disappears, turning a therapeutic dose into a toxic one.
  Case series of severe ergotism are now dominated by exactly this interaction,
  and it has killed. Recognised early the vasospasm is reversible on stopping
  the drug; recognised late the ischaemia is not.
notes: >-
  Curated from a `claude_code` deep-research report
  (`research/Ergotism-deep-research-claude_code.md`). The report predates the
  in-line validation blocks, so `just validate-research-reference` and
  `just validate-research-terms` were run over it afterwards: 23/23 references
  resolved with none unresolved, and 18/20 CURIEs resolved.

  That report's term suggestions were unusually bad, and none of them was used.
  It offered `HP:0034976` for "Peripheral gangrene" - that CURIE is *Absent
  pituitary stalk* - and `HP:0031650` for "Vasospasm", which is *Abnormal
  atrioventricular valve physiology*. Both were caught independently: by a fresh
  OLS lookup while writing the binding, and by the retro-fitted term-validation
  section, which flags the same two. It also proposed the obsolete `CHEBI:4880`
  for ergotamine. Every CURIE here was re-derived rather than copied, which is
  the repository's rule and on this report was load-bearing rather than
  ceremonial.

  The report also cited heavily to Wikipedia, Britannica, National Geographic
  and StatPearls. None of that is cited here; where those passages named a real
  finding, a peer-reviewed source making the same claim was found and cited
  instead, and where none was found the claim was dropped.

  This is an acquired toxicosis, so there is no GeneReviews chapter and no
  OMIM entry; `just check-genereviews --online` returns `NO_CHAPTER` for both
  Bookshelf collections. The `genetic:` section is deliberately absent. The
  report proposed a CYP3A4 pharmacogenomic `MODIFIER` entry, and that is not
  curated here: the interaction that matters is pharmacological inhibition by a
  co-administered drug, which is an exposure and is modelled as one, while the
  report itself records that no ergotism-specific pharmacogenomic study was
  found and that host-variant susceptibility is inferred rather than
  established. Inferring a gene entry from that would be curating the report's
  speculation.

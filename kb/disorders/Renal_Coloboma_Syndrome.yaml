animal_models:
- name: Pax2 null mouse (homozygous)
  species: Mouse
  genotype: Pax2 homozygous null
  description: >-
    The germline knockout is anephric and shows the ocular counterpart of the
    human lesion, which is what established PAX2 as required for both organ
    programmes. Homozygous loss is more severe than any human genotype, so the
    model demonstrates the requirement rather than reproducing the disease.
  publication: PMID:8575306

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous inherited or de novo PAX2 LOF variants were detected in 7 of
      301 patients (2.3%), all presenting with bilateral (cystic) kidney
      hypoplasia/dysplasia/hypodysplasia (KHD).
    explanation: >-
      Every variant carrier in this cohort had bilateral cystic kidney
      hypoplasia/dysplasia.

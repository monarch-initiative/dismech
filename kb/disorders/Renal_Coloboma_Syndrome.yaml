name: Renal Coloboma Syndrome
creation_date: "2026-09-09T13:23:08Z"
category: Mendelian
synonyms:
- papillorenal syndrome
- renal-coloboma syndrome
- coloboma of optic nerve with renal disease
- optic coloboma, vesicoureteral reflux and renal anomalies
description: >-
  Renal coloboma syndrome is an autosomal dominant developmental disorder caused
  by heterozygous loss-of-function variants in PAX2, the paired-box
  transcription factor that patterns the intermediate mesoderm, the nephric duct
  and ureteric bud, the optic stalk, and the otic vesicle. One working allele is
  not enough for any of those tissues, so the same lesion produces a small
  malformed kidney and a malformed optic nerve head in the same person.

  In the kidney, reduced PAX2 dosage lifts the brake on programmed cell death in
  the arborizing ureteric bud and weakens the RET-GDNF signalling that drives its
  outgrowth. Fewer branch tips means fewer nephrons: kidneys are hypodysplastic
  and, histologically, contain fewer than the normal number of glomeruli, each
  enlarged — the pattern called oligomeganephronia. The surviving nephrons
  hyperfiltrate, glomeruli hypertrophy, and podocytes are progressively injured,
  so hypertension, proteinuria and a slow decline to end-stage kidney disease
  follow a congenital nephron deficit rather than any acquired renal insult.

  In the eye the defect is usually not a classical chorioretinal coloboma at all.
  PAX2 is required for closure of the optic fissure and for optic-stalk
  differentiation, and what patients typically have is a wide, excavated,
  dysplastic optic disc with the retinal vessels emerging from its periphery — a
  morning-glory-like optic nerve head. Iris coloboma is not part of the spectrum,
  which is a useful negative when the differential includes CHARGE syndrome and
  the uveal coloboma disorders. High-frequency sensorineural hearing loss, soft
  skin and ligamentous laxity complete the picture in a minority.

  Expressivity is extreme and largely unexplained: within one family the same
  variant can produce lethal fetal renal hypodysplasia, childhood renal failure,
  and a normal renal ultrasound with only a subtle disc anomaly. No
  genotype-phenotype correlation has emerged from the largest mutation series.
  About two thirds of probands have a negative family history, and germline
  mosaicism in a clinically unaffected parent has been documented, so an
  apparently sporadic case still carries recurrence risk.

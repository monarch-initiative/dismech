mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014451
      label: focal segmental glomerulosclerosis 7
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      MONDO:0014451 (OMIM:616002) is the PAX2-related adult-onset focal segmental
      glomerulosclerosis entity, defined in MONDO as any focal segmental
      glomerulosclerosis in which the cause of the disease is a mutation in the
      PAX2 gene. It sits under focal segmental glomerulosclerosis
      (MONDO:0005363), not under renal coloboma syndrome, so it is a sibling
      allelic entity rather than a subtype of this entry. relatedMatch rather
      than narrowMatch for that reason: this entry is scoped to the syndromic
      renal-plus-ocular form, and the isolated glomerular form has no eye
      findings by definition. See notes for the scoping decision.

- name: Otic Vesicle Patterning Failure
  description: >-
    The third organ arm. PAX2 is expressed in the otic primordium, and reduced
    dosage disturbs patterning of the auditory portion of the inner ear. In the
    mouse null the cochlea and spiral ganglion are absent outright; in human
    carriers the corresponding lesion is subtle and presents as high-frequency
    sensorineural loss rather than deafness, so the human severity is not
    established at the same resolution.

treatments:
- name: Antihypertensive and Antiproteinuric Therapy
  description: >-
    Ongoing pharmacological control of blood pressure, with antiproteinuric
    measures, to slow loss of an already reduced nephron mass. There is no
    PAX2-specific pharmacotherapy; management follows general chronic kidney
    disease practice, and the 2025 CAKUT cohort specifically recommends
    antiproteinuric measures in PAX2 variant carriers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antihypertensive agent
      term:
        id: NCIT:C270
        label: Antihypertensive Agent
  target_mechanisms:
  - target: Glomerular Hyperfiltration and Progressive Nephron Loss
    description: >-
      Lowering glomerular pressure and proteinuria is aimed at the
      hyperfiltration injury rather than at the malformation, which is fixed.
  evidence:
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ongoing treatment of hypertension and/or vesicoureteral reflux
    explanation: >-
      GeneReviews management section names ongoing hypertension treatment; it
      does not name a drug class, so the agent binding is left at the class
      level.
  - reference: PMID:41278353
    reference_title: Presentation of Patients With Congenital Anomalies of the Kidney and Urinary Tract and PAX2 Loss-of-Function Variants and Implications for Clinical Management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with CAKUT and PAX2 LOF variants, close monitoring and
      antiproteinuric measures should be considered, and PAX2 variant testing is
      recommended in living related donors.
    explanation: >-
      A recommendation specific to PAX2 carriers; it is the authors' conclusion
      from an observational cohort, not a trial result.

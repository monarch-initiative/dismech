      characterized by renal hypodysplasia and abnormalities of the optic nerve
    explanation: >-
      Names renal hypodysplasia as one of the two defining features of the
      syndrome.
  sequelae:
  - target: Chronic kidney disease
    description: >-
      The reduced nephron mass is what makes the malformation progressive.
- name: Cystic renal dysplasia

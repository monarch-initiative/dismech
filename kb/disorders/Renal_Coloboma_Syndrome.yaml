inheritance:
- name: Autosomal dominant inheritance
  description: >-
    A single heterozygous PAX2 loss-of-function allele is sufficient. Roughly two
    thirds of probands have no affected relative; in most of those the variant is
    de novo, but germline mosaicism in a mutation-negative, clinically unaffected
    parent has been documented in both maternal and paternal transmissions, so an
    apparently sporadic case is not a zero-recurrence-risk case. Penetrance for
    renal involvement is high but expressivity is extreme within a single family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PAX2-related disorder is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 65% of probands with a documented PAX2 pathogenic variant
      have a negative family history.
    explanation: >-
      Quantifies how often the disorder presents as an apparently isolated case,
      which is what makes de novo occurrence and parental mosaicism the
      counselling issues they are.
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both maternal and paternal germline mosaicism, with unaffected parents
      having more than one affected child with a pathogenic variant, have been
      reported.
    explanation: >-
      Establishes that a negative parental test does not reduce recurrence risk
      to the population baseline.
  - reference: PMID:11093271
    reference_title: "PAX2 mutations in renal-coloboma syndrome: mutational hotspot and germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each of the sibs carried a 619insG mutation, whilst unaffected parents did
      not, suggesting the presence of germline mosaicism.
    explanation: >-
      The primary observation behind the germline-mosaicism counselling point:
      three affected siblings, neither parent carrying the variant in blood.
pathophysiology:
- name: PAX2 Haploinsufficiency
  description: >-
    A heterozygous PAX2 variant — most often a frameshift or nonsense allele in
    the paired domain, occasionally a missense or in-frame indel in the same
    region — leaves one functional copy of a dose-sensitive transcription factor.
    PAX2 is expressed in the nephric duct and ureteric bud, the metanephric
    mesenchyme, the optic sulcus and optic stalk, and the otic vesicle, so a
    single molecular lesion reaches every affected organ. The dominant mechanism
    is loss of transcriptional output from one allele rather than interference by
    the mutant protein; a dominant-negative contribution has been proposed for
    some alleles but is not established for the syndromic phenotype.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: PAX2 sequence-specific transcriptional activation
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  downstream:
  - target: Reduced RET-GDNF Signaling in the Ureteric Bud
    causal_link_type: DIRECT
    description: >-
      PAX2 binds the c-RET promoter and sustains both the receptor and its ligand
      in the nephric lineage, so halving PAX2 lowers pathway output.
    evidence:
    - reference: PMID:17047028
      reference_title: Regulation of c-Ret in the developing kidney is responsive to Pax2 gene dosage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, the expression of Gdnf is reduced 2-3-fold, whereas c-Ret
        expression is reduced 9-47-fold in Pax2 heterozygous embryonic kidneys as
        detected by real-time quantitative RT (QRT)-PCR.
      explanation: >-
        Measures the transcriptional consequence of halved Pax2 dosage on the
        RET-GDNF pathway, which is exactly the step this edge asserts.
  - target: Increased Ureteric Bud Cell Apoptosis
    causal_link_type: DIRECT
    description: >-
      One of PAX2's roles in the collecting-duct lineage is to suppress
      programmed cell death; reduced dosage removes that suppression.
    evidence:
    - reference: PMID:16735463
      reference_title: Neuronal apoptosis inhibitory protein is expressed in developing kidney and is regulated by PAX2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Naip mRNA is significantly reduced (50%) in heterozygous Pax2 mutant
        mice.
      explanation: >-
        Identifies a transcriptional target — an endogenous caspase inhibitor —
        whose loss connects reduced PAX2 dosage to the apoptosis node.
  - target: Failure of Optic Fissure Closure
    causal_link_type: DIRECT
    description: >-
      PAX2 expression is concentrated at the closing edges of the optic fissure,
      and its loss prevents closure.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, Pax2 mutants show extension of the pigmented retina into the
        optic stalks and failure of the optic fissure to close resulting in
        coloboma.
      explanation: >-
        States the causal link between loss of Pax2 and failed optic fissure
        closure in the mouse.
  - target: Impaired Cochlear and Otic Vesicle Development
    causal_link_type: DIRECT
    description: >-
      PAX2 is expressed in the primordium of the auditory apparatus; the human
      counterpart of this edge is the high-frequency hearing loss seen in a
      minority of patients.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the inner ear, Pax2 mutants show agenesis of the cochlea and the
        spiral ganglion, i.e., the parts of the organ responsible for auditory
        function and in whose primordium Pax2 is expressed.
      explanation: >-
        Connects loss of Pax2 to failure of the specific inner-ear structures
        that carry auditory function.
  - target: Podocyte Vulnerability to Injury
    causal_link_type: DIRECT
    description: >-
      Distinct from the developmental arm: some PAX2 missense alleles leave
      adult podocytes structurally normal but less able to survive an
      environmental insult.
    evidence:
    - reference: PMID:34944624
      reference_title: Unravelling the Role of PAX2 Mutation in Human Focal Segmental Glomerulosclerosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, when exposed to an environmental trigger, patient podocytes were
        less viable and more susceptible to cell injury. Fixing the mutation
        improved their phenotype and functionality.
      explanation: >-
        Shows the PAX2 variant itself conferring podocyte vulnerability, with
        gene correction as the control that makes the link causal.
  evidence:
  - reference: PMID:7795640
    reference_title: "Mutation of the PAX2 gene in a family with optic nerve colobomas, renal anomalies and vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a single nucleotide deletion in exon five, causing a frame-shift
      of the PAX2 coding region in the octapeptide domain.
    explanation: >-
      The founding observation that a heterozygous truncating PAX2 allele causes
      the syndrome.
  - reference: PMID:7795640
    reference_title: "Mutation of the PAX2 gene in a family with optic nerve colobomas, renal anomalies and vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PAX2 gene is expressed in primitive cells of the kidney, ureter, eye,
      ear and central nervous system.
    explanation: >-
      The expression pattern that makes one molecular lesion produce renal,
      ocular and auditory disease together.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While haploinsufficiency remains the most plausible mechanism by which PAX2
      mutations cause renal coloboma syndrome, the possibility that other
      mechanisms may contribute cannot be excluded.
    explanation: >-
      The largest mutation series' own assessment of the mechanism, including the
      caveat this node's description repeats.
- name: Reduced RET-GDNF Signaling in the Ureteric Bud
  description: >-
    PAX2 protein binds the c-RET promoter and both PAX2 and PAX8 can drive
    transcription from it. In Pax2 heterozygous embryonic kidney, Gdnf falls a
    few fold and c-Ret falls by an order of magnitude or more, so a 50% reduction
    in the transcription factor is amplified into a much larger reduction in
    the pathway that drives ureteric bud outgrowth and branching.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: ureteric bud cell
    term:
      id: CL:4030066
      label: ureteric bud cell
  biological_processes:
  - preferred_term: ureteric bud development
    modifier: DECREASED
    term:
      id: GO:0001657
      label: ureteric bud development
  downstream:
  - target: Reduced Ureteric Bud Branching Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17047028
      reference_title: Regulation of c-Ret in the developing kidney is responsive to Pax2 gene dosage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Compound heterozygous null mice (Pax2+/-: Ret+/-) display an increased
        incidence of unilateral and bilateral renal agenesis, and smaller kidneys
        with fewer nephrons.
      explanation: >-
        Genetic interaction: adding a Ret null allele to a Pax2 heterozygote
        worsens the branching-dependent phenotype, which is what places RET
        downstream of PAX2 on this path.
  evidence:
  - reference: PMID:17047028
    reference_title: Regulation of c-Ret in the developing kidney is responsive to Pax2 gene dosage.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vitro, Pax2 protein is capable of physically interacting with a c-RET
      promoter, and both Pax2 and Pax8 can activate the expression of a reporter
      gene driven by the c-RET promoter.
    explanation: >-
      Establishes the direct transcriptional relationship rather than mere
      co-expression.
- name: Increased Ureteric Bud Cell Apoptosis
  description: >-
    Loss of PAX2's anti-apoptotic output raises programmed cell death in the
    arborizing ureteric bud. In Pax2(1Neu) heterozygous fetal kidney the
    collecting-duct apoptotic rate is several-fold higher than in wild-type
    littermates. The mechanism is at least partly transcriptional: PAX2 binds the
    promoter of the neuronal apoptosis inhibitory protein gene and Naip mRNA is
    halved in the heterozygote.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ureteric bud cell
    term:
      id: CL:4030066
      label: ureteric bud cell
  biological_processes:
  - preferred_term: PAX2-dependent suppression of ureteric bud cell death
    modifier: DECREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  downstream:
  - target: Reduced Ureteric Bud Branching Morphogenesis
    causal_link_type: DIRECT
    description: >-
      The strongest evidence for this edge is interventional in both directions:
      driving apoptosis in the ureteric bud alone reproduces the branching
      deficit, and inhibiting caspases in the mutant partially restores it.
    evidence:
    - reference: PMID:14569086
      reference_title: Ureteric bud apoptosis and renal hypoplasia in transgenic PAX2-Bax fetal mice mimics the renal-coloboma syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The data indicate that loss of Pax2 anti-apoptotic activity is sufficient
        to account for the reduced UB branching observed in RCS and suggest that
        elevated UB apoptosis may be a key process responsible for renal
        hypoplasia.
      explanation: >-
        Sufficiency arm: targeting a pro-apoptotic gene to the ureteric bud
        reproduces the branching deficit without touching Pax2 itself.
    - reference: PMID:14747376
      reference_title: "Rescue of defective branching nephrogenesis in renal-coloboma syndrome by the caspase inhibitor, Z-VAD-fmk."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, exposure to the caspase inhibitor, Z-VAD-fmk (25 micro M),
        significantly increased terminal branch number in mutant explants (23%).
      explanation: >-
        Necessity arm: blocking the apoptosis restores branching in the mutant,
        so the cell death is on the causal path rather than beside it.
  evidence:
  - reference: PMID:10587573
    reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings support the notion that heterozygous mutations of PAX2 are
      associated with increased apoptosis and reduced branching of the ureteric
      bud, due to reduced PAX2 dosage during a critical window in kidney
      development.
    explanation: >-
      The original report of increased apoptosis in the heterozygous mutant, the
      genotype that corresponds to the human disease.
  - reference: PMID:14747376
    reference_title: "Rescue of defective branching nephrogenesis in renal-coloboma syndrome by the caspase inhibitor, Z-VAD-fmk."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      E17.5 kidneys from Pax2(1Neu) mutant mice had smaller (-25%) longitudinal
      cross-sectional area and 3.5-fold increase in collecting duct cell
      apoptosis versus wild-type littermates
    explanation: >-
      Quantifies the apoptotic excess in the collecting-duct lineage of the
      heterozygote.
  - reference: PMID:16735463
    reference_title: Neuronal apoptosis inhibitory protein is expressed in developing kidney and is regulated by PAX2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that PAX2 directly binds to a specific recognition motif in
      the human neuronal apoptosis inhibitory protein (NAIP) gene promoter.
    explanation: >-
      Gives the molecular route from the transcription factor to the survival
      machinery; a promoter-binding and reporter study, hence IN_VITRO.
- name: Reduced Ureteric Bud Branching Morphogenesis
  description: >-
    Fewer rounds of terminal branching in the arborizing collecting system. Every
    branch tip induces a nephron from the surrounding cap mesenchyme, so the
    branching deficit is the step that fixes the final nephron count. PAX2
    governs the whole sequence from nephric duct descent through sustained
    arborization, which is why its dosage sets kidney size rather than merely
    perturbing it.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ureteric bud cell
    term:
      id: CL:4030066
      label: ureteric bud cell
  biological_processes:
  - preferred_term: branching morphogenesis of the ureteric bud
    modifier: DECREASED
    term:
      id: GO:0001658
      label: branching involved in ureteric bud morphogenesis
  downstream:
  - target: Reduced Nephron Endowment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16672320
      reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study shows that the increased apoptosis and reduced ureteric bud
        branching of heterozygous Pax2 mutant mice is associated with 40%
        decrease in nephron number at birth.
      explanation: >-
        Directly ties the branching deficit in the Pax2 heterozygote to the
        nephron count at birth.
  - target: Vesicoureteral reflux
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vesicoureteral reflux is a recurrent finding in PAX2 carriers and is
      presumed to follow from abnormal ureteric bud outgrowth from the nephric
      duct, which sets the position of the ureteric orifice on the trigone. That
      inference is not experimentally demonstrated in this disorder, so the edge
      is deliberately typed as indirect with unknown intermediates and carries no
      evidence of its own; see the knowledge gap discussion attached to it.
  evidence:
  - reference: PMID:16273412
    reference_title: "Renal hypoplasia: lessons from Pax2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It organizes caudal descent of the nephric duct, emergence of the ureteric
      bud, branching morphogenesis, and sustained arborization of the collecting
      system.
    explanation: >-
      Places branching morphogenesis among the PAX2-dependent steps, which is
      what this node claims is reduced.
  - reference: PMID:16273412
    reference_title: "Renal hypoplasia: lessons from Pax2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interference with the later stages affects the extent of branching
      morphogenesis (e.g. heterozygous Pax2 mutations).
    explanation: >-
      Assigns the heterozygous human genotype specifically to the branching stage
      rather than to the earlier all-or-nothing stages.
- name: Reduced Nephron Endowment
  description: >-
    The number of nephrons a kidney will ever have is fixed before birth, when
    nephrogenesis stops. A branching deficit therefore converts into a permanent
    congenital nephron deficit rather than a recoverable one. In the Pax2
    heterozygous mouse the deficit is about 40% at birth, and restoring
    anti-apoptotic signalling in the ureteric bud lineage alone brings it back to
    90% of wild type — so the endowment is set by ureteric bud survival.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: nephron development
    modifier: DECREASED
    term:
      id: GO:0072006
      label: nephron development
  downstream:
  - target: Renal Hypodysplasia with Oligomeganephronia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10587573
      reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At E15, heterozygous mutant kidneys were approximately 60% of the size of
        wild-type littermates, and the number of nephrons was strikingly reduced.
      explanation: >-
        Couples the reduced nephron number to the reduced kidney size in the same
        animals, which is the step this edge asserts.
  - target: Glomerular Hyperfiltration and Glomerular Hypertrophy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16672320
      reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This leads to postnatal glomerular hypertrophy and long-term renal
        insufficiency in the absence of glomerulosclerosis.
      explanation: >-
        States that the nephron deficit itself, not any sclerotic lesion, drives
        the postnatal glomerular hypertrophy — which is why this edge exists
        separately from the sclerosis arm.
  evidence:
  - reference: PMID:16672320
    reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The transgene suppressed programmed cell death in the ureteric bud lineage,
      increased nephron number to 90% of that of wild-type littermates at birth,
      and normalized renal function at 1 yr.
    explanation: >-
      The rescue result that makes ureteric bud survival the determinant of
      nephron endowment in this disorder.
- name: Renal Hypodysplasia with Oligomeganephronia
  description: >-
    Small, abnormally formed kidneys with reduced cortical thickness. The
    characteristic histology is oligomeganephronia — fewer than the normal number
    of glomeruli, each enlarged — and this is the finding that identified PAX2 in
    children investigated for apparently isolated oligomeganephronia. Frank
    dysplasia, renal cysts, and multicystic dysplastic kidney occur in a minority
    and sit at the more severe end of the same developmental defect.
  biological_scale: TISSUE
  downstream:
  - target: Renal hypodysplasia
    causal_link_type: DIRECT
  - target: Multicystic kidney dysplasia
    causal_link_type: DIRECT
  - target: Oligomeganephronia
    causal_link_type: DIRECT
  - target: Glomerulomegaly
    causal_link_type: DIRECT
  - target: Renal cyst
    causal_link_type: DIRECT
    description: >-
      Cysts in this disorder arise within dysplastic renal tissue rather than as
      a separate cystic kidney disease, so they are drawn from the dysplasia
      node.
  - target: Oligohydramnios
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe bilateral hypodysplasia reduces fetal urine output, and amniotic
      fluid volume is fetal urine from the second trimester onward. The
      intermediate step, fetal oliguria, is not modelled as its own node.
  - target: Progressive Chronic Kidney Disease
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21654726
      reference_title: Renal coloboma syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Consequences of the renal hypodysplasia include hypertension, proteinuria
        and renal insufficiency that frequently progresses to end-stage kidney
        disease.
      explanation: >-
        States the hypodysplasia-to-renal-failure sequence that this edge draws.
  evidence:
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histologically, kidneys exhibit fewer than the normal number of glomeruli
      and these glomeruli are enlarged, a finding called oligomeganephronia.
    explanation: >-
      Defines the histological lesion this node names.
  - reference: PMID:11168927
    reference_title: PAX2 mutations in oligomeganephronia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous PAX2 mutations were found in three patients. A limited optic
      nerve coloboma was secondarily detected in two cases and a very mild optic
      disk dysplasia in one patient. None of these patients had visual
      impairment.
    explanation: >-
      Human evidence that oligomeganephronia is a PAX2 phenotype, and the
      clearest demonstration that the ocular component can be subclinical.
- name: Glomerular Hyperfiltration and Glomerular Hypertrophy
  description: >-
    Each surviving glomerulus takes a larger share of the filtration load, so
    single-nephron filtration rate and glomerular size rise. This is an adaptive
    response that becomes the mechanism of progression: it is present from
    infancy, precedes any sclerotic lesion, and is the reason a congenital
    nephron deficit produces a slowly declining glomerular filtration rate over
    decades rather than a fixed, stable impairment.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: single-nephron glomerular filtration
    modifier: INCREASED
    term:
      id: GO:0003094
      label: glomerular filtration
  downstream:
  - target: Podocyte Injury and Segmental Glomerulosclerosis
    causal_link_type: DIRECT
  - target: Progressive Chronic Kidney Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16672320
    reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This leads to postnatal glomerular hypertrophy and long-term renal
      insufficiency in the absence of glomerulosclerosis.
    explanation: >-
      Reports the hypertrophy and the eventual renal insufficiency in the
      heterozygous mutant, and notes that they occur without sclerosis in this
      model.
  - reference: PMID:16273412
    reference_title: "Renal hypoplasia: lessons from Pax2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Modest changes in this program could account for subtle nephron deficits in
      "normal" humans and increased risk of hypertension or susceptibility to
      acquired renal disease later in life.
    explanation: >-
      Frames reduced nephron endowment as a graded determinant of later renal
      risk, which is the premise of the hyperfiltration arm.
- name: Podocyte Vulnerability to Injury
  description: >-
    A second, non-developmental consequence of a mutant PAX2 allele. Podocytes
    differentiated from patient induced pluripotent stem cells carrying a PAX2
    missense variant look and behave normally at baseline but survive an
    environmental insult less well, and correcting the variant restores them.
    This is the arm that explains adult-onset focal segmental glomerulosclerosis
    in PAX2 carriers who have little or no congenital renal malformation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  downstream:
  - target: Podocyte Injury and Segmental Glomerulosclerosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34944624
    reference_title: Unravelling the Role of PAX2 Mutation in Human Focal Segmental Glomerulosclerosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data strongly support the hypothesis that the PAX2 mutation has a
      dual effect, first in renal organogenesis, which could account for a
      suboptimal nephron number at birth, and second in adult podocytes, which
      are more susceptible to cell death caused by environmental triggers.
    explanation: >-
      States the two-arm model this node represents, and is the reason the entry
      separates a developmental path from a podocyte path.
- name: Podocyte Injury and Segmental Glomerulosclerosis
  description: >-
    Podocytes under mechanical load from hyperfiltration, and intrinsically less
    resilient where the PAX2 allele impairs their stress response, undergo
    cytoskeletal disorganisation, effacement and detachment. Segments of glomeruli
    scar, producing focal segmental glomerulosclerosis with proteinuria. In
    families where this is the whole disease, the pattern is autosomal dominant
    adult-onset FSGS without eye findings.
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  cell_types:

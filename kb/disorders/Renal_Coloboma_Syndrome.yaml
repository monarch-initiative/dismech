genetic:
- name: PAX2
  gene_term:
    preferred_term: PAX2
    term:
      id: hgnc:8616
      label: PAX2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PAX2 sits at 10q24.3 and encodes a paired-box transcription factor with a
    paired domain (exons 2-4), an octapeptide motif (exon 5), a partial
    homeodomain (exon 7) and a serine/threonine-rich transactivation domain
    (exons 8-10). It is the only gene in which pathogenic variants are known to
    cause this syndrome.

    Most pathogenic alleles truncate the protein — frameshift, nonsense, splice
    site or genomic deletion — and the majority lie in the paired domain. The
    recurring c.76dup allele (legacy name 619insG) is the single most common
    variant and has arisen independently in many families rather than descending
    from a founder; it is also the allele carried by the Pax2(1Neu) mouse, which
    is why that model corresponds unusually closely to the human disease. No
    genotype-phenotype correlation emerged from the largest series: individuals
    with normal ophthalmological examinations were found with deletions, missense,
    nonsense and in-frame duplication alleles alike.
  variants:
  - name: c.76dup (p.Val26Glyfs*28), legacy name 619insG
    description: >-
      The recurrent frameshift hotspot in exon 2, within the paired domain. It
      arises repeatedly rather than being inherited from a common ancestor, and
      the identical 1-bp insertion defines the Pax2(1Neu) mouse.
    evidence:
    - reference: PMID:22213154
      reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The well-described recurring c.76dup mutation was identified in a total of
        26 independent families.
      explanation: >-
        Establishes the recurrence of this allele across unrelated families.
    - reference: PMID:9106533
      reference_title: Further delineation of renal-coloboma syndrome in patients with extreme variability of phenotype and identical PAX2 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results suggest that a sequence of seven Gs in PAX2 exon 2 may be
        particularly prone to mutation.
      explanation: >-
        Gives the sequence context that explains why this position is a mutational
        hotspot rather than a founder allele.
  - name: Exon 8 frameshift removing the transactivation domain
    description: >-
      A frameshift in exon 8 truncates the protein within the transactivation
      domain, leaving the DNA-binding regions intact. The family carrying it
      spanned three generations with bilateral optic nerve colobomas in four
      members and isolated early-onset renal failure in a fifth.
    evidence:
    - reference: PMID:17269592
      reference_title: "Renal-coloboma syndrome: a single nucleotide deletion in the PAX2 gene at Exon 8 is associated with a highly variable phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All five subjects carried a novel PAX2 mutation consisting in a frameshift
        mutation located in Exon 8 (G91 I del), which causes premature termination
        of translation and loss of the PAX2 transactivation domain.
      explanation: >-
        Describes the allele and the domain it removes.
  evidence:
  - reference: PMID:7795640
    reference_title: "Mutation of the PAX2 gene in a family with optic nerve colobomas, renal anomalies and vesicoureteral reflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that PAX2 is required for normal kidney and eye
      development.
    explanation: >-
      The founding gene-disease assertion.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of mutations in this gene are expected to result in significant
      truncation of the PAX2 protein through a shift in the reading frame (n =
      16), disruption of a conserved splice site (n = 6), genomic deletion or
      disruption (n = 3), or through the introduction of a premature stop codon (n
      = 11).
    explanation: >-
      Describes the allelic spectrum, which is what makes haploinsufficiency the
      default mechanism.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In terms of the type of mutation, no clear genotype/phenotype correlation
      emerged from this study.
    explanation: >-
      The negative result behind this entry's refusal to offer variant-based
      prognosis.
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant mutations in PAX2 can be identified in nearly half of all
      patients with clinical findings suggestive of RCS
    explanation: >-
      The diagnostic yield of PAX2 testing in clinically diagnosed patients, which
      bounds how far this gene explains the syndrome.
- name: SIX1
  notes: >-
    Not a cause of this syndrome. A SIX1 sequence variant was found in two
    siblings whose renal coloboma syndrome was caused by a PAX2 mutation, and the
    authors raised oligogenic inheritance as a possible explanation for the
    variable expressivity. This is a single observation and no modifier allele has
    been confirmed since.
  gene_term:
    preferred_term: SIX1
    term:
      id: hgnc:10887
      label: SIX1
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:16971658
    reference_title: "Prevalence of mutations in renal developmental genes in children with renal hypodysplasia: results of the ESCAPE study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is interesting that a SIX1 sequence variant was identified in two
      siblings with renal-coloboma syndrome as a result of a PAX2 mutation,
      suggesting an oligogenic inheritance.
    explanation: >-
      The single observation on which this speculative modifier row rests; the
      description says so explicitly.
prevalence:
- population: Worldwide, published mutation-positive literature and three diagnostic laboratories
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate is recorded here. The locus-specific
    database assembled from the published literature plus three diagnostic
    laboratories in the United States, France and New Zealand held 173
    mutation-positive individuals from 86 families in 2012. Ascertainment is
    skewed: one contributing laboratory is a renal disease laboratory, so renal
    findings are over-represented relative to ocular ones, and ophthalmological
    examination was never performed in 21% of the individuals counted.
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of published cases and the collective diagnostic experience of three
      laboratories in the United States, France, and New Zealand identified 55
      unique mutations in 173 individuals from 86 families.
    explanation: >-
      Gives the size of the pooled mutation-positive cohort, which is the only
      quantitative statement of how uncommon this disorder is.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It should be noted that one of the labs in the consortium is a renal disease
      laboratory, which may have skewed these findings.
    explanation: >-
      The authors' own statement of the ascertainment bias recorded in the notes.
- population: Children with renal hypodysplasia and chronic renal insufficiency (ESCAPE cohort, 99 unrelated patients)
  measure_type: UNKNOWN
  notes: >-
    Not a population prevalence but a diagnostic yield: in an unselected cohort of
    children with renal hypodysplasia and chronic renal insufficiency, PAX2
    mutations were found in six of 99 families, with TCF2 (HNF1B) accounting for a
    similar share. Recorded here because it is the number that decides whether to
    test PAX2 in a child with hypodysplasia and no eye findings.
  evidence:
  - reference: PMID:16971658
    reference_title: "Prevalence of mutations in renal developmental genes in children with renal hypodysplasia: results of the ESCAPE study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, 15% of patients with RHD show mutations in TCF2 or PAX2,
      whereas abnormalities in EYA1, SALL1, and SIX1 are less frequent.
    explanation: >-
      Gives the combined yield of the two dominant hypodysplasia genes in an
      unselected paediatric cohort.
progression:
- phase: Prenatal and neonatal presentation
  notes: >-
    Severe cases present in utero with renal hypoplasia, cystic dysplasia,
    multicystic dysplastic kidneys or oligohydramnios, and prenatal renal failure
    has been confirmed in mutation-positive fetuses. Parents with mild renal
    disease have had pregnancies with severe fetal disease, which is the sharpest
    statement of intrafamilial variability in this disorder.
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In several instances, parents with mild renal disease had pregnancies with
      severe renal disease presenting in utero.
    explanation: >-
      Records the intrafamilial severity discordance that makes prognosis from a
      parent's phenotype unreliable.
- phase: Childhood detection
  notes: >-
    Most affected children come to attention through imaging performed for another
    reason, or through examination prompted by a relative's diagnosis. Because the
    ocular lesion is frequently asymptomatic, a normal-seeming child with a
    PAX2-positive parent still needs a dilated fundus examination and a renal
    ultrasound.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If no PAX2 pathogenic variant has been found, perform dilated ophthalmologic
      examination, renal ultrasound examination, tests of renal function, uric
      acid levels, and urinalysis; measure blood pressure.
    explanation: >-
      Sets out what evaluating a clinically well at-risk relative involves, which
      is why detection is so often incidental.
- phase: Progressive decline to kidney failure
  notes: >-
    Renal function declines over years to decades. The average age at stage 5
    chronic kidney disease among individuals for whom it was recorded was 19.5
    years, with a range from birth to 79 years. The ocular lesion, by contrast, is
    a completed developmental malformation and does not progress; what can change
    is its complications, principally retinal detachment.
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 53 individuals where the age at diagnosis of CKD Stage 5 was reported,
      the average age was 19.5 years. The range of onset for CKD Stage 5 was
      birth to 79 years.
    explanation: >-
      The only published summary of when kidney failure occurs, and of how wide
      that window is.
- phase: Adult-onset glomerular presentation
  notes: >-
    A separate trajectory, in which the first sign is proteinuria in the third or
    fourth decade with focal segmental glomerulosclerosis on biopsy and no
    congenital malformation. These families are ascertained through nephrology
    rather than genetics and are usually not recognised as PAX2-related until
    sequencing.
  evidence:
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, exome sequencing in members of an index family with dominant FSGS
      revealed a nonconservative, disease-segregating variant in the PAX2
      transcription factor gene.
    explanation: >-
      The report that identified this trajectory, in a family ascertained for FSGS
      rather than for a syndrome.
diagnosis:
- name: Molecular genetic testing of PAX2
  description: >-
    The confirmatory test. A heterozygous pathogenic PAX2 variant in a proband
    with characteristic renal and/or eye findings establishes the diagnosis.
    Sequencing detects the point mutations and small indels that make up almost
    all reported alleles; genomic deletions and rearrangements exist but are
    uncommon, so a copy-number method is a second-line addition rather than a
    substitute. Roughly half of clinically diagnosed patients have no detectable
    coding variant, so a negative result does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: PAX2 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of PAX2-related disorder is established in a proband with the
      characteristic renal and/or eye findings by the identification of a
      heterozygous pathogenic variant in PAX2 by molecular genetic testing.
    explanation: >-
      The GeneReviews statement of the confirmatory test and the clinical context
      it is applied in.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis for exonic copy number variation by MLPA has indicated that
      large-scale duplications or deletions are not a common finding
    explanation: >-
      Supports treating copy-number analysis as second-line rather than as part of
      first-line testing.
- name: Dilated fundus examination
  description: >-
    Ophthalmoscopy through a dilated pupil is what finds the disc lesion, and it
    finds it in people who have no visual symptoms at all — including children
    investigated for apparently isolated oligomeganephronia. A child or adult with
    unexplained renal hypodysplasia should have one before PAX2 is ruled out on
    clinical grounds.
  diagnosis_term:
    preferred_term: dilated fundus examination
    term:
      id: NCIT:C120698
      label: Ophthalmoscopy
  evidence:
  - reference: PMID:11168927
    reference_title: PAX2 mutations in oligomeganephronia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous PAX2 mutations were found in three patients. A limited optic
      nerve coloboma was secondarily detected in two cases and a very mild optic
      disk dysplasia in one patient. None of these patients had visual
      impairment.
    explanation: >-
      Shows the ocular finding being detected only on directed examination in
      patients with no visual complaint, which is the argument for doing it.
  - reference: PMID:11730657
    reference_title: "Renal-coloboma syndrome: report of a novel PAX2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 9-year-old patient with a history of renal transplantation for congenital
      renal hypoplasia was found to have bilateral optic nerve coloboma during
      ophthalmic examination for cytomegalovirus retinitis.
    explanation: >-
      An incidental discovery years after transplantation, illustrating how easily
      the ocular component is missed when nobody looks for it.
- name: Renal ultrasonography and renal function assessment
  description: >-
    Ultrasound demonstrates the small, abnormally formed kidneys and any cystic or
    dysplastic change; serum creatinine, urinalysis, uric acid and blood pressure
    complete the renal assessment. This is also the evaluation recommended for an
    at-risk relative when no familial variant has been identified.
  diagnosis_term:
    preferred_term: renal ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If no PAX2 pathogenic variant has been found, perform dilated ophthalmologic
      examination, renal ultrasound examination, tests of renal function, uric
      acid levels, and urinalysis; measure blood pressure.
    explanation: >-
      Lists the components of the renal and ocular evaluation recommended by
      GeneReviews.
- name: Kidney biopsy
  description: >-
    Not needed to diagnose the syndrome, and normal practice is to avoid it when
    imaging already shows hypodysplasia. It has a role where the presentation is
    glomerular — proteinuria or steroid-resistant nephrotic syndrome — because
    focal segmental glomerulosclerosis on biopsy is what prompts PAX2 sequencing
    in a patient with structurally unremarkable kidneys.
  diagnosis_term:
    preferred_term: Kidney Biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  evidence:
  - reference: PMID:39235128
    reference_title: "Frameshift Mutation in PAX2 Related to Focal Segmental Glomerular Sclerosis: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the clinical manifestations and renal pathological characteristics
      of the patient, as well as familial whole exome sequencing, the diagnosis of
      FSGS related to PAX2 mutation was confirmed.
    explanation: >-
      Shows renal pathology combined with sequencing establishing the diagnosis in
      the glomerular presentation.
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing in probands of a familial FSGS cohort revealed seven rare and
      private heterozygous single nucleotide substitutions (4% of individuals).
    explanation: >-
      Gives the yield of PAX2 sequencing in biopsy-proven familial FSGS, the
      setting where a biopsy leads to the genetic diagnosis.
- name: Testing of at-risk relatives
  description: >-
    Once a familial variant is known, targeted testing identifies carriers who may
    be entirely asymptomatic and yet need renal surveillance. Where no variant has
    been found, relatives are evaluated clinically instead.
  diagnosis_term:
    preferred_term: targeted variant testing of at-risk relatives
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evaluation of relatives at risk: Offer molecular genetic testing if a PAX2
      pathogenic variant has been identified in an affected family member.
    explanation: >-
      The GeneReviews recommendation for cascade testing.
treatments:
- name: Antihypertensive and Antiproteinuric Therapy
  description: >-
    Blood pressure control is the mainstay of slowing the decline in renal
    function, alongside reduction of proteinuria. GeneReviews specifies ongoing
    treatment of hypertension without naming a drug class; renin-angiotensin
    system blockade is the class normally used for proteinuric chronic kidney
    disease, but no trial evidence specific to PAX2-related disease exists, so the
    agent bindings below record the antihypertensive classes rather than a
    disease-specific recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antihypertensive pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antihypertensive agent
      term:
        id: NCIT:C270
        label: Antihypertensive Agent
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Glomerular Hyperfiltration and Glomerular Hypertrophy
    description: >-
      Lowering systemic and intraglomerular pressure reduces the filtration load
      carried by each remaining nephron. It does not restore nephron number, so
      this is a brake on the progression mechanism rather than a correction of the
      lesion.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: Ongoing treatment of hypertension and/or
      vesicoureteral reflux; renal replacement therapy (dialysis and/or renal
      transplantation) for end-stage renal disease; low vision aids for
      significant visual impairment.
    explanation: >-
      The GeneReviews management statement, which names treatment of hypertension
      without specifying an agent.
  - reference: PMID:39235128
    reference_title: "Frameshift Mutation in PAX2 Related to Focal Segmental Glomerular Sclerosis: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment such as lowering urinary protein and blood pressure was given, and
      the patient was followed up and observed.
    explanation: >-
      A single case report of the management actually used in PAX2-related
      glomerular disease; it establishes the practice, not its efficacy.
- name: Management of Vesicoureteral Reflux
  description: >-
    Named by GeneReviews as one of the two manifestations requiring ongoing
    treatment. The chapter does not specify the modality, and practice in this
    disorder follows general paediatric urology rather than anything
    PAX2-specific, so no more specific intervention term is bound here.
  treatment_term:
    preferred_term: treatment of vesicoureteral reflux
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Vesicoureteral reflux
    description: >-
      Aimed at the reflux itself, and through it at the risk of superimposed
      pyelonephritic scarring in a kidney that already has too few nephrons.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: Ongoing treatment of hypertension and/or
      vesicoureteral reflux; renal replacement therapy (dialysis and/or renal
      transplantation) for end-stage renal disease; low vision aids for
      significant visual impairment.
    explanation: >-
      Names ongoing treatment of vesicoureteral reflux as part of management.
- name: Renal Replacement Therapy
  description: >-
    Dialysis for stage 5 chronic kidney disease, by haemodialysis or peritoneal
    dialysis. Reaching this point is common enough in this disorder that it is
    part of the standard management statement rather than an exceptional outcome.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: dialysis
    term:
      id: NCIT:C15221
      label: Dialysis
  target_mechanisms:
  - target: Progressive Chronic Kidney Disease
    description: >-
      Substitutes for excretory function once the nephron deficit has exhausted
      the kidney's reserve; it addresses the endpoint, not any step above it.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: Ongoing treatment of hypertension and/or
      vesicoureteral reflux; renal replacement therapy (dialysis and/or renal
      transplantation) for end-stage renal disease; low vision aids for
      significant visual impairment.
    explanation: >-
      Names renal replacement therapy for end-stage renal disease.
- name: Kidney Transplantation
  description: >-
    The definitive treatment for kidney failure in this disorder. Because the
    disease is autosomal dominant with variable expressivity and incomplete
    ophthalmological ascertainment, a related donor needs genetic and renal
    evaluation before being accepted — a clinically well sibling can carry the
    variant.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Progressive Chronic Kidney Disease
    description: >-
      Replaces the failed organ. The donated kidney has a normal nephron
      endowment, so the mechanism that drove the recipient's decline is not
      reproduced in the graft.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      End-stage renal disease requiring renal transplant is not uncommon.
    explanation: >-
      Records transplantation as a routine part of the disorder's course.
  - reference: PMID:11730657
    reference_title: "Renal-coloboma syndrome: report of a novel PAX2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 9-year-old patient with a history of renal transplantation for congenital
      renal hypoplasia was found to have bilateral optic nerve coloboma during
      ophthalmic examination for cytomegalovirus retinitis.
    explanation: >-
      A worked instance of transplantation for the congenital renal disease of
      this syndrome.
- name: Low Vision Aids
  description: >-
    For the minority whose optic nerve malformation significantly impairs vision.
    The lesion is a completed malformation, so this is rehabilitation of a fixed
    deficit rather than treatment of an active process.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: low vision aids
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Visual impairment
    description: >-
      Addresses the functional consequence of the malformed optic nerve head; it
      does not act on the malformation.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: Ongoing treatment of hypertension and/or
      vesicoureteral reflux; renal replacement therapy (dialysis and/or renal
      transplantation) for end-stage renal disease; low vision aids for
      significant visual impairment.
    explanation: >-
      Names low vision aids for significant visual impairment.
- name: Protective Eyewear
  description: >-
    A specific preventive recommendation in this disorder, aimed at retinal
    detachment in an eye whose disc and peripapillary retina are malformed. No
    NCIT clinical-action term corresponds to it, so the term binding is omitted
    rather than approximated.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: use of protective eyewear
  target_mechanisms:
  - target: Retinal detachment
    description: >-
      Prevention of ocular trauma in an eye already predisposed to detachment by
      its malformation.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prevention of secondary complications: Use of protective eyewear to prevent
      retinal detachment.
    explanation: >-
      The GeneReviews prevention recommendation, quoted for the specific
      complication it targets.
- name: Multidisciplinary Surveillance
  description: >-
    Nephrology follow-up of renal function and blood pressure, ophthalmology
    follow-up of vision, and periodic audiometry. Surveillance matters more here
    than in most malformation syndromes because the renal lesion is silent until
    it is not, and because the eye finding is often asymptomatic in a person who
    nonetheless needs renal monitoring.
  treatment_term:
    preferred_term: multidisciplinary surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Chronic Kidney Disease
    description: >-
      Detects declining function and rising blood pressure early enough for the
      antihypertensive arm to act on them.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance: Follow up by a nephrologist to monitor renal function and
      blood pressure and an ophthalmologist to monitor vision, with periodic
      audiometric evaluations.
    explanation: >-
      The GeneReviews surveillance schedule, covering all three organ systems this
      entry models.
- name: Genetic Counseling
  description: >-
    Counselling has to cover three things that are specific to this disorder: the
    50% transmission risk, the fact that a mild parental phenotype does not
    predict a mild fetal one, and the residual recurrence risk from parental
    germline mosaicism even when both parents test negative. Prenatal and
    preimplantation testing are available once the familial variant is known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prenatal testing and preimplantation genetic testing are possible if the
      pathogenic PAX2 pathogenic variant has been identified in the family.
    explanation: >-
      States the reproductive options that counselling exists to discuss.
  - reference: PMID:11093271
    reference_title: "PAX2 mutations in renal-coloboma syndrome: mutational hotspot and germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the presence of PAX2 germline mosaicism highlights the difficulties
      associated with genetic counselling for PAX2 mutations.
    explanation: >-
      The primary source for the counselling difficulty this entry flags.
animal_models:
- name: Pax2(1Neu) heterozygous mouse
  species: Mouse
  genotype: Pax2(1Neu)/+ (1-bp insertion in Pax2, orthologous to human c.76dup)
  publication: PMID:8943028
  description: >-
    The closest available model of the human disease, and unusually so: the mouse
    allele is the same 1-bp insertion as the recurrent human c.76dup hotspot, and
    the heterozygote is the genotype patients have. Heterozygotes have small
    kidneys with markedly reduced nephron number, increased ureteric bud
    apoptosis, and optic nerve and retinal defects.
  modeled_mechanisms:
  - target: Reduced Nephron Endowment
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces the congenital nephron deficit in the same genotype and at the
      same allele as the human disease.
    readouts:
    - name: Nephron number at birth
      target: Reduced Nephron Endowment
      direction: DECREASED
      interpretation: >-
        Direct count of the endowment this node claims is reduced.
      evidence:
      - reference: PMID:16672320
        reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          This study shows that the increased apoptosis and reduced ureteric bud
          branching of heterozygous Pax2 mutant mice is associated with 40%
          decrease in nephron number at birth.
        explanation: >-
          Quantifies the nephron deficit in the heterozygous mutant.
    evidence:
    - reference: PMID:10587573
      reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At E15, heterozygous mutant kidneys were approximately 60% of the size of
        wild-type littermates, and the number of nephrons was strikingly reduced.
      explanation: >-
        Establishes that the heterozygote reproduces the reduced nephron number
        this link is cited for.
  - target: Increased Ureteric Bud Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The apoptotic excess in the collecting-duct lineage is measurable in the
      heterozygote and is the mechanistic step this model contributed.
    readouts:
    - name: Collecting duct cell apoptotic rate at E17.5
      target: Increased Ureteric Bud Cell Apoptosis
      direction: INCREASED
      interpretation: >-
        A 3.5-fold excess over wild-type littermates.
      evidence:
      - reference: PMID:14747376
        reference_title: "Rescue of defective branching nephrogenesis in renal-coloboma syndrome by the caspase inhibitor, Z-VAD-fmk."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          E17.5 kidneys from Pax2(1Neu) mutant mice had smaller (-25%)
          longitudinal cross-sectional area and 3.5-fold increase in collecting
          duct cell apoptosis versus wild-type littermates
        explanation: >-
          The measurement behind this readout, in the mutant against littermate
          controls.
  evidence:
  - reference: PMID:8943028
    reference_title: "The mouse Pax2(1Neu) mutation is identical to a human PAX2 mutation in a family with renal-coloboma syndrome and results in developmental defects of the brain, ear, eye, and kidney."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous mutant mice exhibit defects in the kidney, the optic nerve, and
      retinal layer of the eye, and in homozygous mutant embryos, development of
      the optic nerve, metanephric kidney, and ventral regions of the inner ear is
      severely affected.
    explanation: >-
      Establishes that the heterozygote, not only the null, reproduces the
      renal-plus-ocular combination.
  - reference: PMID:8943028
    reference_title: "The mouse Pax2(1Neu) mutation is identical to a human PAX2 mutation in a family with renal-coloboma syndrome and results in developmental defects of the brain, ear, eye, and kidney."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We describe a new mouse frameshift mutation (Pax2(1Neu)) with a 1-bp
      insertion in the Pax2 gene. This mutation is identical to a previously
      described mutation in a human family with renal-coloboma syndrome
    explanation: >-
      Establishes the allelic identity with the human hotspot, which is why this
      model's fidelity is rated high.
- name: Pax2 null mouse
  species: Mouse
  genotype: Pax2 homozygous null
  publication: PMID:8951055
  description: >-
    The complete-loss model. Homozygous nulls lack kidneys, ureters and genital
    tracts, fail to close the optic fissure, and have cochlear and spiral ganglion
    agenesis. It is the source of the developmental evidence for the ocular and
    auditory arms of this entry, but it is not the human genotype: patients are
    heterozygous, and the null phenotype is not survivable.
  modeled_mechanisms:
  - target: Failure of Optic Fissure Closure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Demonstrates that Pax2 is required for optic fissure closure, which is the
      developmental event this node names.
    limitations: >-
      The demonstration is in the homozygous null. Human disease is heterozygous
      and produces a dysplastic disc rather than the failure of closure seen in
      the null, so the model establishes the requirement for the gene rather than
      the severity or form of the human lesion.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, Pax2 mutants show extension of the pigmented retina into the
        optic stalks and failure of the optic fissure to close resulting in
        coloboma.
      explanation: >-
        The observation this link is cited for.
  - target: Impaired Cochlear and Otic Vesicle Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Cochlear and spiral ganglion agenesis in the null establishes the
      requirement for Pax2 in the auditory apparatus.
    limitations: >-
      Agenesis of the cochlea is categorically more severe than the mild
      high-frequency sensorineural hearing loss reported in about 7% of human
      heterozygotes. The model shows that the gene is needed; it does not model
      the human deficit, and no heterozygous auditory phenotype has been reported
      that would.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the inner ear, Pax2 mutants show agenesis of the cochlea and the spiral
        ganglion, i.e., the parts of the organ responsible for auditory function
        and in whose primordium Pax2 is expressed.
      explanation: >-
        The observation this link is cited for, and the reason its fidelity to the
        human phenotype is rated low.
  evidence:
  - reference: PMID:8575306
    reference_title: Pax-2 controls multiple steps of urogenital development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report here that Pax-2 homozygous mutant newborn mice lack kidneys,
      ureters and genital tracts.
    explanation: >-
      Establishes the completeness of the null phenotype, which is what separates
      this model from the heterozygote that matches the human disease.
  - reference: PMID:8575306
    reference_title: Pax-2 controls multiple steps of urogenital development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mesenchyme of the nephrogenic cord fails to undergo epithelial
      transformation and is not able to form tubules in the mesonephros.
    explanation: >-
      Locates the earliest Pax2-dependent step, upstream of the branching defect
      that the heterozygote shows.
- name: PAX2 promoter-Bax transgenic mouse
  species: Mouse
  genotype: Transgenic Baxalpha driven by human PAX2 regulatory elements
  publication: PMID:14569086
  description: >-
    Not a Pax2 mutant at all: a pro-apoptotic gene is driven into the ureteric
    bud, eye and mid/hindbrain by PAX2 regulatory elements. It exists to ask
    whether apoptosis alone is enough to produce the renal phenotype, and the
    answer is that it is.
  modeled_mechanisms:
  - target: Increased Ureteric Bud Cell Apoptosis
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Imposes the apoptotic excess directly rather than reproducing it through
      Pax2 dosage, which is what makes it a sufficiency test for this node.
    limitations: >-
      The transgene drives Bax expression well above any level a Pax2
      heterozygote would produce, so the model demonstrates sufficiency of the
      mechanism without saying anything about its magnitude in patients.
    readouts:
    - name: Kidney size and terminal ureteric bud branching at E15.5
      target: Increased Ureteric Bud Cell Apoptosis
      direction: DECREASED
      interpretation: >-
        Kidneys 55% smaller with 70% of normal branching, reproducing the renal
        phenotype from apoptosis alone.
      evidence:
      - reference: PMID:14569086
        reference_title: Ureteric bud apoptosis and renal hypoplasia in transgenic PAX2-Bax fetal mice mimics the renal-coloboma syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The kidneys of E15.5 PAX2Promoter-Baxalpha fetal mice were 55% smaller
          than those of wild-type fetal mice, and they contained 70% of the normal
          level of UB branching.
        explanation: >-
          The measurements behind this readout.
    evidence:
    - reference: PMID:14569086
      reference_title: Ureteric bud apoptosis and renal hypoplasia in transgenic PAX2-Bax fetal mice mimics the renal-coloboma syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At E15.5 PAX2Promoter-Baxalpha fetal mice exhibited renal hypoplasia,
        elevated UB apoptosis, and retinal defects, mimicking the phenotype
        observed in RCS.
      explanation: >-
        States that imposing ureteric bud apoptosis alone reproduces the
        disorder's renal phenotype.
- name: Pax2(1Neu) mouse with PAX2 promoter-driven BCL2 transgene
  species: Mouse
  genotype: Pax2(1Neu)/+ carrying a BCL2 transgene under PAX2 regulatory control
  publication: PMID:16672320
  description: >-
    The rescue arm of the apoptosis hypothesis. Restoring an anti-apoptotic factor
    in the ureteric bud lineage of the Pax2 heterozygote returns nephron number to
    near normal and normalises adult renal function, without correcting Pax2
    itself.
  modeled_mechanisms:
  - target: Reduced Nephron Endowment
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Rescues the nephron deficit by acting on ureteric bud survival alone, which
      is what identifies apoptosis as the operative step between the PAX2 lesion
      and the endowment.
    limitations: >-
      The rescue is genetic and prenatal — a transgene expressed throughout
      nephrogenesis — so it is a mechanistic demonstration and not a therapeutic
      model. Nephrogenesis is complete at birth in humans, so no equivalent
      postnatal intervention is possible.
    evidence:
    - reference: PMID:16672320
      reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The transgene suppressed programmed cell death in the ureteric bud
        lineage, increased nephron number to 90% of that of wild-type littermates
        at birth, and normalized renal function at 1 yr.
      explanation: >-
        The rescue result this link records.
  evidence:
  - reference: PMID:16672320
    reference_title: Suppression of ureteric bud apoptosis rescues nephron endowment and adult renal function in Pax2 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These observations lend strong support to the hypothesis that factors that
      control ureteric bud apoptosis are powerful determinants of congenital
      nephron endowment.
    explanation: >-
      The authors' own statement of what the rescue establishes.
- name: Pax2 and Ret compound heterozygous mouse
  species: Mouse
  genotype: Pax2 null heterozygous, Ret null heterozygous
  publication: PMID:17047028
  description: >-
    A genetic-interaction model rather than a disease model. Combining single null
    alleles of Pax2 and Ret worsens the renal phenotype beyond either alone, which
    places RET on the pathway between PAX2 dosage and ureteric bud outgrowth.
  modeled_mechanisms:
  - target: Reduced RET-GDNF Signaling in the Ureteric Bud
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Quantifies the pathway reduction in the Pax2 heterozygote and shows that
      further reducing RET dosage aggravates the phenotype.
    limitations: >-
      The compound genotype does not occur in patients; it is an epistasis test.
      The single-heterozygote expression measurements are the part of this model
      that corresponds to human disease.
    readouts:
    - name: Gdnf and c-Ret transcript levels in Pax2 heterozygous embryonic kidney
      target: Reduced RET-GDNF Signaling in the Ureteric Bud
      direction: DECREASED
      interpretation: >-
        A 2-3-fold reduction in Gdnf and a 9-47-fold reduction in c-Ret, so the
        50% reduction in transcription factor dosage is amplified downstream.
      evidence:
      - reference: PMID:17047028
        reference_title: Regulation of c-Ret in the developing kidney is responsive to Pax2 gene dosage.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, the expression of Gdnf is reduced 2-3-fold, whereas c-Ret
          expression is reduced 9-47-fold in Pax2 heterozygous embryonic kidneys
          as detected by real-time quantitative RT (QRT)-PCR.
        explanation: >-
          The measurements behind this readout.
  evidence:
  - reference: PMID:17047028
    reference_title: Regulation of c-Ret in the developing kidney is responsive to Pax2 gene dosage.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The effects of reduced Pax2 gene dosage are thus amplified resulting in a
      haploinsufficient phenotype.
    explanation: >-
      States the amplification mechanism that makes a 50% loss of a transcription
      factor produce a disease phenotype.
- name: Krd (kidney and retinal defects) mouse
  species: Mouse
  genotype: Del(19)TgN8052Mm heterozygous, a transgene-induced chromosome 19 deletion including Pax2
  publication: PMID:7835879
  description: >-
    The earliest mouse model of the renal-plus-retinal combination, and the one
    that pointed at Pax2 before human mutations were found. It is a contiguous
    gene deletion, not a Pax2 point mutation.
  modeled_mechanisms:
  - target: Renal Hypodysplasia with Oligomeganephronia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces the combination of hypoplastic and cystic kidneys with retinal
      cell loss, which is the phenotypic pairing that made Pax2 a candidate.
    limitations: >-
      The lesion is an approximately 7-cM deletion spanning many genes besides
      Pax2, so none of the phenotype is attributable to Pax2 dosage on the
      strength of this model alone. Viability also depends strongly on genetic
      background, which further limits comparison with a human point mutation.
    evidence:
    - reference: PMID:7835879
      reference_title: "Kidney and retinal defects (Krd), a transgene-induced mutation with a deletion of mouse chromosome 19 that includes the Pax2 locus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Krd/+ mice have a high incidence of kidney defects including aplastic,
        hypoplastic, and cystic kidneys.
      explanation: >-
        The renal phenotype this link is cited for.
  evidence:
  - reference: PMID:7835879
    reference_title: "Kidney and retinal defects (Krd), a transgene-induced mutation with a deletion of mouse chromosome 19 that includes the Pax2 locus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additional genetic and molecular data are consistent with an approximately
      7-cM deletion that includes the loci stearoyl CoA desaturase (Scd1), pale
      ear (ep), D19Mit17, D19Mit24, D19Mit27, D19Mit11, and Pax2.
    explanation: >-
      Establishes the multi-gene extent of the deletion, which is the reason this
      model's fidelity is rated low.
experimental_models:
- name: Patient-derived iPSC podocytes and ureteric-bud-like tubules (PAX2 missense variant)
  description: >-
    Induced pluripotent stem cells from a patient who developed focal segmental
    glomerulosclerosis in adulthood, differentiated into podocytes and into
    branching ureteric-bud-like tubules, with CRISPR/Cas9 correction of the
    variant as the isogenic control. It is the only model in this entry that
    addresses the adult glomerular arm, and its two readouts separate the
    developmental and the adult effects of the same allele.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  publication: PMID:34944624
  modeled_mechanisms:
  - target: Podocyte Vulnerability to Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Patient podocytes are normal at baseline and less viable under an
      environmental trigger, and correcting the variant restores them — which is
      exactly the claim this node makes.
    limitations: >-
      The trigger is an imposed in vitro stress rather than the haemodynamic load
      a hyperfiltering glomerulus applies, and the model is a single patient's
      private missense allele, so generalisation to truncating alleles is not
      established.
    readouts:
    - name: Podocyte viability under environmental stress
      target: Podocyte Vulnerability to Injury
      direction: DECREASED
      interpretation: >-
        Reduced viability in patient podocytes, restored by gene correction.
      evidence:
      - reference: PMID:34944624
        reference_title: Unravelling the Role of PAX2 Mutation in Human Focal Segmental Glomerulosclerosis.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, when exposed to an environmental trigger, patient podocytes
          were less viable and more susceptible to cell injury. Fixing the
          mutation improved their phenotype and functionality.
        explanation: >-
          The measurement and its isogenic control.
  - target: Reduced Ureteric Bud Branching Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Patient-derived ureteric-bud-like tubules branch defectively, and gene
      correction fully rescues them — a human-cell counterpart of the mouse
      branching phenotype.
    limitations: >-
      Branching in a dish is a surrogate for arborization in a developing kidney:
      there is no metanephric mesenchyme reciprocally inducing the bud, no nephron
      induction to count, and no way to read out final endowment. The rescue
      establishes that the allele causes the defect, not the magnitude it would
      have in vivo.
    evidence:
    - reference: PMID:34944624
      reference_title: Unravelling the Role of PAX2 Mutation in Human Focal Segmental Glomerulosclerosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using a branching morphogenesis assay, we documented developmental defects
        in patient-derived ureteric bud-like tubules that were totally rescued by
        fixing the mutation.
      explanation: >-
        The branching result and its isogenic rescue.
  evidence:
  - reference: PMID:34944624
    reference_title: Unravelling the Role of PAX2 Mutation in Human Focal Segmental Glomerulosclerosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By generating adult podocytes using patient-specific induced pluripotent
      stem cells (iPSC), we developed an in vitro model to dissect the role of
      this mutation in the onset of FSGS.
    explanation: >-
      Describes the model system and what it was built to test.
differential_diagnoses:
- name: PAX2-related isolated renal hypodysplasia and focal segmental glomerulosclerosis
  description: >-
    The same gene, and in many cases the same kind of allele, without the ocular
    component. GeneReviews covers both under the title PAX2-related disorder; this
    entry is scoped to the syndromic renal-plus-ocular form, and the isolated
    renal form is carried here rather than folded in. Two settings account for
    most of it: apparently nonsyndromic renal hypodysplasia, and autosomal
    dominant isolated focal segmental glomerulosclerosis with an OMIM entity of
    its own (616002, MONDO:0014451, mapped in this entry's mappings block).
  distinguishing_features:
  - >-
      A normal dilated fundus examination in a PAX2 carrier. The distinction is
      ascertainment-sensitive and often collapses on examination: of 13
      mutation-positive individuals identified through a primary diagnosis of renal
      hypoplasia, ten turned out to have optic nerve abnormalities when an
      ophthalmologist looked.
  evidence:
  - reference: PMID:20301624
    reference_title: "PAX2-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among individuals with apparently nonsyndromic renal hypodysplasia and in
      families with autosomal dominant isolated focal segmental
      glomerulosclerosis, pathogenic variants in PAX2 have been identified in
      approximately 8% and 4%, respectively.
    explanation: >-
      Establishes the isolated renal presentations as a real and quantified part
      of the PAX2 spectrum, which is what makes the scoping decision a decision.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 13 mutation-positive individuals, further ophthalmological evaluation
      revealed optic nerve abnormalities in 10 individuals, while three
      mutation-positive individuals reportedly had a normal ophthalmological exam.
    explanation: >-
      Shows how often an apparently isolated renal presentation becomes syndromic
      once the eye is examined, and that a genuinely eye-negative minority remains.
- name: CHARGE syndrome
  description: >-
    The classical coloboma-plus-renal-anomaly differential, caused by CHD7. Both
    can present with an eye coloboma and a renal anomaly, and both can include
    hearing loss.
  distinguishing_features:
  - >-
      CHARGE colobomas are typically uveal and involve the iris, which
      PAX2-related disorder does not; CHARGE adds choanal atresia, characteristic
      external ear anomalies, cranial nerve dysfunction and heart defects, none of
      which belong to this syndrome.
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iris colobomas do not appear to be part of the spectrum of eye malformations
      seen in renal coloboma syndrome.
    explanation: >-
      The negative finding that does most of the discriminating work at the slit
      lamp, from the largest mutation-positive series.
- name: Branchio-oto-renal spectrum disorder
  description: >-
    EYA1- and SIX1-related disease, which shares renal hypodysplasia and hearing
    loss with this syndrome and was screened alongside PAX2 in the same paediatric
    hypodysplasia cohort.
  distinguishing_features:
  - >-
      Branchial cleft anomalies, preauricular pits and external ear malformations,
      with conductive or mixed rather than isolated high-frequency sensorineural
      hearing loss, and no optic nerve dysplasia.
  evidence:
  - reference: PMID:16971658
    reference_title: "Prevalence of mutations in renal developmental genes in children with renal hypodysplasia: results of the ESCAPE study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene mutations that have dominant inheritance and cause RHD, urinary tract
      anomalies, and defined extrarenal symptoms have been identified in TCF2
      (renal cysts and diabetes syndrome), PAX2 (renal-coloboma syndrome), EYA1
      and SIX1 (branchio-oto-renal syndrome), and SALL1 (Townes-Brocks syndrome).
    explanation: >-
      Places these disorders in the same diagnostic frame, which is why they are
      tested together.
- name: HNF1B-related disease and 17q12 deletion syndrome
  description: >-
    TCF2/HNF1B disease is the other dominant cause of paediatric renal
    hypodysplasia, and in the ESCAPE cohort it was found at a similar rate to
    PAX2. It is the differential a nephrologist actually faces in a child with
    small kidneys.
  distinguishing_features:
  - >-
      Renal cysts predominate over hypoplasia, and the extrarenal features are
      maturity-onset diabetes of the young, hypomagnesaemia, abnormal liver function
      and genital tract malformation rather than any ocular finding.
  evidence:
  - reference: PMID:16971658
    reference_title: "Prevalence of mutations in renal developmental genes in children with renal hypodysplasia: results of the ESCAPE study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of a total of 27 patients with renal cysts, six (22%) carried a mutation in
      TCF2.
    explanation: >-
      Shows the cyst-weighted phenotype that separates HNF1B disease from the
      hypoplasia-weighted PAX2 phenotype in the same cohort.
- name: Non-syndromic congenital anomalies of the kidney and urinary tract
  description: >-
    CAKUT of any cause is far commoner than this syndrome and accounts for a large
    share of paediatric chronic kidney disease. More than 50 genes have been
    implicated and monogenic variants explain only a minority of cases, so a child
    with renal hypodysplasia is much more likely to have CAKUT of undetermined
    cause than PAX2-related disease.
  distinguishing_features:
  - >-
      The optic nerve. A dilated fundus examination is the cheapest way to move a
      child from the undifferentiated CAKUT population into this diagnosis.
  evidence:
  - reference: DOI:10.3389/fmed.2024.1384676
    reference_title: Congenital anomalies of the kidney and urinary tract
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CAKUT affects over 1% of live births and accounts for 40-50% of cases of
      chronic kidney failure in children.
    explanation: >-
      Gives the background frequency of the population this syndrome has to be
      distinguished from.
discussions:
- discussion_id: pax2_vesicoureteral_reflux_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does PAX2 haploinsufficiency cause vesicoureteral reflux, as
    opposed to renal hypodysplasia?
  attaches_to:
  - phenotypes#Vesicoureteral reflux
  - pathophysiology#Reduced Ureteric Bud Branching Morphogenesis
  rationale: >-
    Reflux was in the founding family's description and is in 14% of
    mutation-positive individuals, but the entry cannot source a mechanism for it.
    The usual account — that the position at which the ureteric bud arises from
    the nephric duct sets the position and length of the intravesical ureteric
    tunnel, and that an abnormally sited bud therefore produces an incompetent
    ureterovesical junction — is a general model of reflux, not a finding in PAX2
    disease. None of the Pax2 mouse work cited here reports ureteric orifice
    position or reflux. The edge from the branching node to this phenotype is
    consequently typed as indirect with unknown intermediates and carries no
    evidence, which is the honest state of the question rather than an omission.
  proposed_experiments:
  - experiment_id: ub_origin_and_uvj_anatomy_in_pax2_1neu_heterozygotes
    name: Ureteric bud origin position and ureterovesical junction anatomy in Pax2(1Neu) heterozygotes
    description: >-
      Map the site of ureteric bud outgrowth from the nephric duct in
      Pax2(1Neu)/+ embryos against wild-type littermates, and measure intravesical
      ureteric tunnel length and reflux on cystography in the postnatal animal.
    would_support:
    - pathophysiology#Reduced Ureteric Bud Branching Morphogenesis
    supporting_outcome:
    - >-
        A shifted or duplicated bud origin in heterozygotes with a correspondingly
        short intravesical tunnel and demonstrable reflux would establish the
        mechanism this edge currently asserts without evidence.
    refuting_outcome:
    - >-
        Normal bud origin and normal ureterovesical anatomy with reflux still
        present, or absent reflux in an animal with the full renal phenotype, would
        mean the reflux arises somewhere other than the budding step.
- discussion_id: pax2_null_mouse_ocular_auditory_extrapolation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the ocular and auditory mechanisms of this syndrome be read off the
    homozygous Pax2 null mouse, when patients are heterozygous and their
    corresponding phenotypes are milder by an order of magnitude?
  attaches_to:
  - pathophysiology#Impaired Cochlear and Otic Vesicle Development
  - pathophysiology#Failure of Optic Fissure Closure
  - animal_models#Pax2 null mouse
  rationale: >-
    The renal arm of this entry rests on the heterozygote, which is the human
    genotype: Pax2(1Neu)/+ mice have reduced nephron number, and the
    apoptosis-and-rescue experiments are all done in that background. The ocular
    and auditory arms do not have that footing. The evidence that Pax2 is required
    for optic fissure closure and for cochlear development comes from homozygous
    nulls, which lack kidneys entirely and do not survive — and whose cochlear
    phenotype is agenesis, against about 7% of human heterozygotes having mild
    high-frequency hearing loss. The gap is not one of degree but of kind:
    agenesis of a structure and a mild audiometric threshold shift in that
    structure are different phenotypes, and nothing published bridges them. The
    same caution applies to the optic fissure, where the human lesion is a
    dysplastic disc rather than an unclosed fissure. These nodes are therefore
    best read as saying that Pax2 is required here, not as saying that this is
    what happens in patients.
  proposed_experiments:
  - experiment_id: auditory_and_optic_disc_phenotyping_of_pax2_1neu_heterozygotes
    name: Auditory and optic nerve head phenotyping of Pax2(1Neu) heterozygotes
    description: >-
      Auditory brainstem response and distortion-product otoacoustic emission
      testing across frequency in Pax2(1Neu)/+ mice against littermate controls,
      with cochlear histology; and optic nerve head morphometry with retinal
      vessel mapping in the same animals.
    would_support:
    - pathophysiology#Impaired Cochlear and Otic Vesicle Development
    supporting_outcome:
    - >-
        A high-frequency-weighted threshold shift with structurally present but
        abnormal cochlear architecture in the heterozygote would give the auditory
        node a genotype-matched basis and would match the human phenotype in kind as
        well as in mechanism.
    refuting_outcome:
    - >-
        Normal hearing and normal cochlear histology in heterozygotes would leave
        the human hearing loss unexplained by Pax2 dosage in the cochlea and would
        send the question to another PAX2-expressing structure along the auditory
        pathway.
- discussion_id: pax2_expressivity_without_genotype_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a PAX2 carrier has lethal fetal renal disease, an
    incidental disc anomaly, or nothing detectable, given that variant type and
    position do not predict it?
  attaches_to:
  - genetic#PAX2
  - pathophysiology#PAX2 Haploinsufficiency
  rationale: >-
    This is the central unsolved problem of the disorder and it is a practical
    one: it is what a family wants to know and what counselling cannot tell them.
    The largest series found no correlation with mutation type or with domain, and
    reported the same variant producing childhood renal failure, mild
    insufficiency, normal renal function and lethal fetal hypodysplasia within one
    family — so the variation is not merely between families and cannot be genetic
    in the simple sense. The candidates are modifier alleles, stochastic variation
    in the branching process itself, and prenatal environmental influence on
    nephron endowment. The single published lead is a SIX1 variant in two affected
    siblings, recorded in the genetic section as speculative. Nothing has
    confirmed a modifier since.
  proposed_experiments:
  - experiment_id: modifier_mapping_in_pax2_c76dup_carriers
    name: Within-family nephron endowment and modifier mapping in PAX2 c.76dup carriers
    description: >-
      Assemble carriers of the single recurrent c.76dup allele across the many
      independent families that carry it, phenotype them uniformly with renal
      imaging, measured glomerular filtration rate and dilated fundus examination,
      and test for association with common and rare variation genome-wide.
    would_support:
    - genetic#PAX2
    supporting_outcome:
    - >-
        Reproducible association of severity with variation at a second locus in
        carriers of one identical allele would convert the oligogenic hypothesis
        from a single observation into a mechanism, and would make prognosis
        possible.
    refuting_outcome:
    - >-
        No association despite adequate power, with severity discordant between
        monozygotic twins or between siblings sharing the same modifier genotypes,
        would point at stochastic variation in branching morphogenesis rather than
        at genetic modification.
notes: >-
  Scope. This entry is the syndromic renal-plus-ocular disease: PAX2
  haploinsufficiency producing renal hypodysplasia together with a malformed optic
  nerve head. GeneReviews has retitled its chapter PAX2-Related Disorder and its
  concept is broader than that, covering apparently nonsyndromic renal
  hypodysplasia and autosomal dominant isolated focal segmental glomerulosclerosis
  (OMIM 616002, MONDO:0014451) in which there are no eye findings at all. Those
  are represented here as a differential diagnosis and as a mappings entry rather
  than folded in. The mapping predicate is skos:relatedMatch, not narrowMatch:
  MONDO places MONDO:0014451 under focal segmental glomerulosclerosis
  (MONDO:0005363), not under renal coloboma syndrome, so it is an allelic sibling
  entity rather than a subtype of this one. The boundary is genuinely soft — ten
  of thirteen people ascertained through isolated renal hypoplasia turned out to
  have optic nerve abnormalities when an ophthalmologist looked — and the
  differential-diagnosis entry says so rather than pretending the split is clean.
  PAX2-related disorder is therefore listed under parents rather than among
  synonyms: MONDO does not carry it as a synonym of MONDO:0007352, and treating
  the broader concept as a synonym here would undo the scoping decision.

  Lump/split. Curated as a single leaf disease (entry_type DISEASE in the stub
  queue). The eye and kidney arms are one pathomechanism at one locus, not two
  diseases, and there are no subtypes to split out: the largest mutation series
  found no genotype-phenotype correlation by variant type or by domain, and the
  same allele produces the full range of severity within a single family. The
  adult-onset glomerular presentation is modelled as a second trajectory in
  progression and a second arm of the pathograph, not as a subtype.

  Corrections to the deep-research report. The Perplexity report for this disease
  resolved all ten of its extracted references but was flagged needs_review, and
  its term validation was worse than its reference validation. Every identifier was
  looked up independently rather than copied across: fifteen of the CURIEs the
  report mentions survived that lookup and are used here, and the ones below did
  not. Four GO identifiers named entirely different
  processes: GO:0072203 (offered as nephron development) is cell proliferation
  involved in metanephros development, GO:0072193 (ureteric bud development) is
  ureter smooth muscle cell differentiation, GO:0003095 (glomerular filtration) is
  pressure natriuresis, and GO:0035989 (podocyte differentiation) is tendon
  development. Two NCIT identifiers were similarly wrong: NCIT:C15273 (offered as
  Hemodialysis) is Longitudinal Study and NCIT:C15274 (Peritoneal Dialysis) is
  Lung Transplantation. HP:0000120, offered twice for chronic kidney disease, does
  not exist. HP:0005692 (joint hyperflexibility) is obsolete, replaced by
  HP:0001382, which is what this entry binds. The correct terms for the four GO
  cases are GO:0072006, GO:0001657, GO:0003094 and, for podocyte biology, no GO
  differentiation term was needed at all.

  Report content that was not used. The report's citation list is mostly Orphanet,
  MedlinePlus, NORD, GTR and MeSH web pages, which cannot be cited as evidence, so
  the primary literature behind them was located independently; the report named
  five PubMed records, and this entry cites 28 distinct references. Its
  Orphanet-derived prevalence figure of less than 1 per 1,000,000 is not recorded
  here because the Orphanet structured-source cache is not built in this working
  tree and the figure could not be quoted from a citable record; the prevalence
  section instead records the mutation-positive literature count, which the
  largest series does support. The report's phenotype frequency table is
  Orphanet's qualitative bands, which disagree with the counted frequencies in the
  173-patient locus-specific database on several items — it calls multicystic
  kidney dysplasia, myopia and visual impairment very frequent, where the counted
  series puts multicystic dysplastic kidneys at 6%. The counted series was
  preferred throughout, and myopia, strabismus and nystagmus were dropped for lack
  of a quantitative or quotable source. The report's assertion that compound
  PAX2/PAX8 mutation causes renal agenesis in humans was not curated: no cached
  record states it. Its claim of CNS anomalies including corpus callosum agenesis
  was also dropped — the largest series reports one case each of Chiari type 1
  malformation, delayed myelination, enlarged extra-axial space and enlarged
  cisterna magna, and no corpus callosum finding.

  Evidence sourcing. Several frequency and cohort figures are quoted from the full
  text of PMID:22213154 rather than from its abstract, because the counts that
  matter (65% hypodysplasia, 14% reflux, 84 optic nerve colobomas, the 19.5-year
  mean age at kidney failure) appear only there; that record is cached as
  full_text_xml, so the quotes are verifiable offline. The GeneReviews chapter
  PMID:20301624 is the phenotype baseline and is mined across all four of its
  sections — clinical characteristics, diagnosis and testing, management, and
  genetic counselling.

  Related entries. PAX2 already appears as a syndromic CAKUT gene row in
  Renal_Agenesis, which names this syndrome; the mechanism there is failed
  ureteric bud outgrowth and metanephric induction, which is the severe end of the
  same process this entry models as reduced branching.
  Familial_Vesicoureteral_Reflux, EYA1-Related_Branchiootorenal_Spectrum,
  Chromosome_17q12_Deletion_Syndrome and
  Uveal_Coloboma-Cleft_Lip_and_Palate-Intellectual_Disability_Syndrome cover
  neighbouring territory and are not duplicated here.

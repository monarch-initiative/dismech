- name: Impaired Cochlear and Otic Vesicle Development
  description: >-
    PAX2 is expressed in the otic vesicle, and in the mouse its loss causes
    agenesis of the cochlea and spiral ganglion. In heterozygous humans the
    consequence is far milder — high-frequency sensorineural hearing loss in about
    7% of mutation-positive individuals, often audiometric rather than
    symptomatic. The mouse evidence for this node comes from the homozygous null,
    so the mechanism is inferred for the human heterozygote rather than
    demonstrated in it; see the model-mismatch discussion.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cochlea development
    modifier: ABNORMAL
    term:
      id: GO:0090102
      label: cochlea development
  downstream:
  - target: High-frequency sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:8951055
    reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the inner ear, Pax2 mutants show agenesis of the cochlea and the spiral
      ganglion, i.e., the parts of the organ responsible for auditory function
      and in whose primordium Pax2 is expressed.
    explanation: >-
      The developmental requirement for Pax2 in the auditory apparatus, from the
      null mouse.
  - reference: PMID:10466411
    reference_title: "Renal-coloboma syndrome: a multi-system developmental disorder caused by PAX2 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although renal-coloboma syndrome involves both ocular and renal anomalies,
      some patients are affected with vesico-ureteral reflux (VUR), high
      frequency hearing loss, central nervous system (CNS) anomalies, and/or
      genital anomalies, consistent with the expression of PAX2 in these tissues
      during development.
    explanation: >-
      The human counterpart: hearing loss in patients, attributed to the same
      expression pattern.

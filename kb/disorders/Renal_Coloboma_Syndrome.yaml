      tube.
    explanation: >-
      Assigns optic fissure closure to Pax2 as a developmental function, which is
      what this node claims fails.
- name: Optic Nerve Head Malformation
  description: >-
    The ocular lesion of this syndrome is a malformed optic nerve head rather
    than a classical chorioretinal coloboma: a wide, often excavated dysplastic
    disc from whose periphery the retinal vessels emerge, described in the
    literature as optic nerve coloboma, optic disc dysplasia or morning glory
    anomaly depending on the observer. Associated findings include retinal
    coloboma, scleral staphyloma, optic nerve cyst and pigmentary macular
    dysplasia. Iris coloboma is not part of the spectrum.
  biological_scale: TISSUE
  biological_processes:

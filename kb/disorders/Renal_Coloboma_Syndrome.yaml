  description: >-
    Fewer glomeruli than normal, each enlarged. The histological signature of a
    reduced nephron endowment with compensatory hypertrophy, and the tissue-level
    expression of the developmental arm of the disorder.
  notes: >-
    Left unbound. HistopathologyFindingTerm is reachable only from the NCIT
    Histopathology Result branch, and neither NCIT:C123202 (Oligomeganephronia)
    nor any glomerular-sclerosis term sits under it - checked with
    `runoak -i ols:ncit ancestors -p i` against all thirteen source nodes. HPO
    has no oligomeganephronia term at all.
  evidence:
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, kidneys exhibit fewer than the normal number of glomeruli
      and these glomeruli are enlarged, a finding called oligomeganephronia.
    explanation: >-
      States the finding and names it.
- name: Focal segmental glomerulosclerosis on biopsy
  description: >-
    Segmental sclerosis of some glomeruli on kidney biopsy, seen both in
    carriers with structurally normal kidneys and in those with hypodysplasia.
  notes: >-
    Left unbound for the same reason as the oligomeganephronia finding above:
    NCIT:C37308 is not reachable from any HistopathologyFindingTerm source node.
    The phenotype-level claim is bound to HP:0000097 under `phenotypes`.
  evidence:
  - reference: PMID:31538321
    reference_title: A novel truncating PAX2 mutation in a boy with renal coloboma syndrome with focal segmental glomerulosclerosis causing rapid progression to end-stage kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abdominal ultrasound showed no renal and urinary tract malformations and
      kidney biopsy showed FSGS.
    explanation: >-
      A biopsy-proven FSGS lesion in a PAX2 carrier whose imaging showed no
      malformation, which is the podocyte arm presenting alone.
genetic:
- name: PAX2
  presence: Positive
  relationship_type: CAUSATIVE
  association: Renal coloboma syndrome / PAX2-related disorder
  gene_term:
    preferred_term: PAX2
    term:
      id: hgnc:8616
      label: PAX2
  notes: >-
    PAX2 (10q24.31) encodes a paired-box transcription factor expressed in the
    nephric duct, ureteric bud, metanephric mesenchyme, optic stalk, otic
    vesicle and CNS during development. Pathogenic alleles are overwhelmingly
    predicted loss of function and cluster in the paired domain encoded by exons
    2-4; the recurrent c.76dupG (p.Val26Glyfs*28) is the single commonest
    allele, arising in a seven-guanine homopolymer tract that appears
    mutationally unstable, which is why unrelated families share it rather than
    descending from a founder. Whole-gene deletions account for roughly 3% of cases; exon-level
    rearrangements appear not to contribute further.
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the paired-box gene, PAX2, have been identified in
      approximately half of individuals with classic findings of renal
      hypoplasia/dysplasia and abnormalities of the optic nerve.
    explanation: >-
      Establishes PAX2 as the causal gene and gives the diagnostic yield in
      clinically classic cases.
  - reference: PMID:11730657
    reference_title: "Renal-coloboma syndrome: report of a novel PAX2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causal relationship between PAX2 gene mutations and renal-coloboma
      syndrome is further supported by this novel mutation.
    explanation: >-
      An independent de novo case supporting causality rather than linkage
      alone.
  - reference: PMID:23756089
    reference_title: Detection of PAX2 deletions and duplications using multiplex ligation-dependent probe amplification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large genomic deletions of PAX2 have been identified in 3/90 known RCS
      families, accounting for approximately (3%) of RCS cases.
    explanation: >-
      Quantifies the copy-number contribution referenced in the notes.
  - reference: PMID:23756089
    reference_title: Detection of PAX2 deletions and duplications using multiplex ligation-dependent probe amplification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 46 PAX2 mutation-negative samples tested, none demonstrated
      deletions or duplications in the PAX2 gene.
    explanation: >-
      A negative result: exon-level rearrangements do not explain the
      mutation-negative half of clinically diagnosed cases.
  - reference: PMID:21326282
    reference_title: "Clinical utility gene card for: renal coloboma (Papillorenal) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common recurrent mutations are frameshift mutations within a
      homoguanine stretch (7Gs) in exon 2
    explanation: >-
      Identifies the recurrent allele class and the sequence context that makes
      it recurrent, which is the basis for the c.76dupG hotspot claim in the
      notes.
  - reference: PMID:9106533
    reference_title: Further delineation of renal-coloboma syndrome in patients with extreme variability of phenotype and identical PAX2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that a sequence of seven Gs in PAX2 exon 2 may be
      particularly prone to mutation.
    explanation: >-
      The original proposal that the exon 2 homoguanine tract is a mutational
      hotspot, which is why one allele recurs across unrelated families.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Autosomal dominant. Expressivity is highly variable, including between
    monozygotic twins and between family members carrying the same allele: a
    parent may carry the variant and have only albuminuria or FSGS while the
    child has bilateral cystic hypodysplasia. About 65% of probands have a
    negative family history, explained by de novo variants, unrecognised mild
    disease in a parent, or parental germline mosaicism - both maternal and
    paternal germline mosaicism have been documented.
  evidence:
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 65% of probands with a documented PAX2 pathogenic variant
      have a negative family history.
    explanation: >-
      Quantifies the proportion of apparently sporadic presentations.
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both maternal and paternal germline mosaicism, with unaffected parents
      having more than one affected child with a pathogenic variant, have been
      reported.
    explanation: >-
      Documents germline mosaicism, which changes the recurrence risk quoted to
      apparently unaffected parents.
  - reference: PMID:41278353
    reference_title: Presentation of Patients With Congenital Anomalies of the Kidney and Urinary Tract and PAX2 Loss-of-Function Variants and Implications for Clinical Management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full penetrance for a kidney phenotype, but variable expressivity was
      observed in our 10 carriers of a PAX2 LOF variant, including parents who
      were not necessarily affected by CAKUT but by albuminuria or FSGS.
    explanation: >-
      Supports full penetrance for some kidney phenotype alongside markedly
      variable expressivity within families.
  - reference: PMID:22660956
    reference_title: Discordant phenotype in monozygotic twins with renal coloboma syndrome and a PAX2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case study involves two monozygotic twin sisters with RCS showing
      highly discordant phenotypes.
    explanation: >-
      Reports the discordant monozygotic twin pair itself, which is the
      observation this claim rests on.
  - reference: PMID:22660956
    reference_title: Discordant phenotype in monozygotic twins with renal coloboma syndrome and a PAX2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both patients, a novel de novo mutation of PAX2 was detected, which
      leads to the substitution of a highly conserved cysteine (p.C52Y).
    explanation: >-
      Establishes that both twins carry the same PAX2 allele, which is what
      makes the discordance evidence about expressivity rather than about which
      variant was inherited.
  - reference: PMID:9106533
    reference_title: Further delineation of renal-coloboma syndrome in patients with extreme variability of phenotype and identical PAX2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unexpectedly, extreme variability in clinical presentation was observed
      between a mother, her son, and an unrelated patient, all of whom had the
      same PAX2 mutation as previously described in two siblings with
      renal-coloboma syndrome.
    explanation: >-
      Variability across carriers of one identical allele, within and between
      families, which is what rules out the allele as the determinant of
      severity.
mechanistic_hypotheses:
- hypothesis_group_id: podocyte_fitness_pathway
  hypothesis_label: PAX2 nephropathy as a second, postnatal podocyte disease
  status: EMERGING
  description: >-
    The conventional model treats PAX2 kidney disease as purely developmental:
    fewer nephrons, then hyperfiltration, then chronic kidney disease. An
    emerging model adds a second arm in which PAX2 variants reduce the
    resilience of mature podocytes and parietal epithelial cells, producing
    albuminuria out of proportion to the structural lesion and, in some
    families, FSGS with no malformation at all. The clinical observation that
    motivates it is the excess albuminuria in PAX2 carriers relative to
    stage-matched CAKUT controls; the experimental support is patient-derived
    iPSC podocytes whose vulnerability to injury is corrected by repairing the
    variant. It matters therapeutically because the developmental arm is fixed
    at birth while podocyte injury might be modifiable.
  evidence:
  - reference: PMID:41278347
    reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PAX2 nephropathy may be an exception, because podocyte injury might be
      partially modifiable, raising the prospect of prolonging nephron survival
      in patients with milder dysplasia.
    explanation: >-
      States the therapeutic consequence that makes the two-pathway model worth
      distinguishing; phrased by the authors as a prospect, not a result.
differential_diagnoses:
- name: PRR12-related neuroocular syndrome
  description: >-
    Also combines eye malformation with renal anomalies, but the ocular lesion
    is globe-size and anterior-segment rather than optic-nerve, iris coloboma
    occurs, renal involvement affects a minority and is structural rather than
    progressive, and developmental delay is common.
  distinguishing_features:
  - Iris coloboma has never been reported in PAX2-related disorder, so its presence argues against this diagnosis.
  - Renal involvement in PAX2-related disorder is near-obligate and progressive, rather than structural and static.
  evidence:
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iris colobomas have not been reported in any individual with PAX2–related
      disorder.
    explanation: >-
      Supplies the near-absolute discriminator against colobomatous syndromes
      that involve the iris.
- name: Isolated congenital anomalies of the kidney and urinary tract
  description: >-
    CAKUT without ocular findings. PAX2 loss-of-function variants are found in
    a small but non-trivial fraction of such patients, so absence of an eye
    finding does not exclude PAX2.
  distinguishing_features:
  - Cystic kidney hypodysplasia combined with albuminuria disproportionate to the CKD stage should prompt PAX2 testing even without ocular findings.
  evidence:
  - reference: PMID:41278347
    reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinically, the combination of cystic dysplasia and albuminuria
      disproportionate to chronic kidney disease stage should prompt
      consideration of PAX2 testing.
    explanation: >-
      Gives the testing trigger that separates PAX2 nephropathy from
      undifferentiated CAKUT.
- name: HNF1B-related renal disease
  description: >-
    The other common monogenic cause of cystic kidney dysplasia. It diverges
    downstream: HNF1B tends to a tubulointerstitial phenotype, often without
    significant proteinuria.
  distinguishing_features:
  - Significant albuminuria and FSGS point to PAX2 rather than HNF1B.
  evidence:
  - reference: PMID:41278347
    reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, HNF1B pathogenic variants may cause a tubulointerstitial
      phenotype referred to as autosomal dominant tubulointerstitial kidney
      disease, often without relevant proteinuria.
    explanation: >-
      States the downstream divergence that distinguishes the two cystic
      dysplasia genes clinically.
diagnosis:
- name: PAX2 molecular genetic testing
  presence: Positive
  description: >-
    The diagnosis is established by finding a heterozygous pathogenic PAX2
    variant in a proband with characteristic renal and/or eye findings.
    Sequencing of the coding exons is the primary test; copy-number analysis
    adds the roughly 3% of cases caused by whole-gene deletion.
  evidence:
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PAX2-related disorder is established in a proband with
      the characteristic renal and/or eye findings by the identification of a
      heterozygous pathogenic variant in PAX2 by molecular genetic testing.
    explanation: >-
      States the diagnostic standard.
  - reference: PMID:20301624
    reference_title: PAX2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among individuals with apparently nonsyndromic renal hypodysplasia and in
      families with autosomal dominant isolated focal segmental
      glomerulosclerosis, pathogenic variants in PAX2 have been identified in
      approximately 8% and 4%, respectively.
    explanation: >-
      Gives the diagnostic yield in the two non-syndromic presentations where
      PAX2 testing is worth doing.
  - reference: PMID:37123577
    reference_title: Renal Coloboma Syndrome-An Autosomal Dominant Genetic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been estimated that approximately 10% of children with hypoplastic
      kidneys may have renal coloboma syndrome.
    explanation: >-
      A pre-test probability for the commonest presenting finding; the review
      reports it as an estimate rather than a measured yield.
  - reference: PMID:35087773
    reference_title: "PAX2 Mutation-Related Renal Hypodysplasia: Review of the Literature and Three Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Japanese study, 38 of 457 patients (6.5%) with congenital anomalies
      of kidney and urinary tract (CAKUT) possessed the PAX2 mutation
    explanation: >-
      A second ascertainment denominator, from an unselected CAKUT cohort in a
      different population.

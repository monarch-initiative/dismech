    reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During gestation, the paired box-containing gene Pax2 is expressed in the
      mid-hindbrain area, developing eye and inner ear.
    explanation: >-
      Establishes inner-ear expression, which is the precondition for a dosage
      effect at this site.
  - reference: PMID:10466411
    reference_title: "Renal-coloboma syndrome: a multi-system developmental disorder caused by PAX2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients are affected with vesico-ureteral reflux (VUR), high

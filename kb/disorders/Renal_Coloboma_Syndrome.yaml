experimental_models:
- name: Patient-derived iPSC podocytes carrying PAX2 p.G189R
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells from a member of a family with adult-onset
    autosomal dominant FSGS carrying the PAX2 p.G189R octapeptide-domain
    variant, differentiated into podocytes. CRISPR-Cas9 correction of the point
    mutation provides an isogenic control, making this the cleanest available
    test of whether the variant itself causes the podocyte defect.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  publication: PMID:30998089
  modeled_mechanisms:
  - target: Reduced Podocyte Fitness
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Podocyte motility was altered in patient-derived cells and restored by
      correcting the variant, isolating PAX2 as the cause of the podocyte
      phenotype.
    limitations: >-
      The readout is motility in culture, not albuminuria or glomerular
      sclerosis, and the model carries a single missense allele from one family
      rather than the loss-of-function alleles typical of the syndromic
      presentation.
    readouts:
    - name: Podocyte motility
      target: Reduced Podocyte Fitness
      direction: RESTORED
      interpretation: >-
        Correction of the variant restores the cellular behaviour that the
        variant altered.
      evidence:
      - reference: PMID:30998089
        reference_title: CRISPR-Cas9-Mediated Correction of the G189R-PAX2 Mutation in Induced Pluripotent Stem Cells from a Patient with Focal Segmental Glomerulosclerosis.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Editing the PAX2 p.G189R mutation restored podocyte motility, which
          was altered in podocytes derived from patient iPSCs.
        explanation: >-
          Reports the measurement and its direction in the isogenic comparison.
    evidence:
    - reference: PMID:30998089
      reference_title: CRISPR-Cas9-Mediated Correction of the G189R-PAX2 Mutation in Induced Pluripotent Stem Cells from a Patient with Focal Segmental Glomerulosclerosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we efficiently corrected this point mutation in patient-derived
        induced pluripotent stem cells (iPSCs) by means of CRISPR-Cas9-based
        homology-directed repair.
      explanation: >-
        Establishes the isogenic-correction design that makes this model
        informative for the podocyte node.

  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Progressive Chronic Kidney Disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, mutations in PAX2 may contribute to adult-onset FSGS in the absence
      of overt extrarenal manifestations.
    explanation: >-
      Establishes the glomerular arm as a genuine PAX2 phenotype rather than a
      nonspecific consequence of chronic kidney disease.
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As predicted by in silico structural modeling analyses, in vitro functional
      studies documented that several of the FSGS-associated PAX2 mutations
      perturb protein function by affecting proper binding to DNA and
      transactivation activity or by altering the interaction of PAX2 with
      repressor proteins, resulting in enhanced repressor activity.
    explanation: >-
      Gives the molecular defect behind the FSGS-associated alleles; a separate
      claim from the clinical association above, so it is a separate item with
      its own evidence_source.
  - reference: PMID:31001663
    reference_title: Dominant PAX2 mutations may cause steroid-resistant nephrotic syndrome and FSGS in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate high frequency of PAX2 mutations in familial form
      of SRNS (5.2%) and further expand the phenotypic spectrum of PAX2
      heterozygous mutations to include autosomal dominant childhood-onset FSGS.
    explanation: >-
      Extends the glomerular arm into childhood, so it is not exclusively a
      late-onset phenomenon.
- name: Progressive Chronic Kidney Disease
  description: >-
    The clinical end of the renal path: a slow decline in glomerular filtration
    rate with hypertension and proteinuria, reaching stage 5 chronic kidney
    disease at a mean in the third decade but anywhere from birth to the eighth
    decade. The rate is not predictable from the variant, and severity differs
    markedly between carriers of the same allele in the same family.
  biological_scale: ORGANISM
  downstream:
  - target: Renal insufficiency
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
  - target: Hypertension

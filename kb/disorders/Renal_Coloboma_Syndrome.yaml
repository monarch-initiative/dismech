prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population-based prevalence or incidence estimate exists. The largest
    published census is the PAX2 locus-specific database, which by 2011 held
    173 mutation-positive individuals from 86 families worldwide, and 272
    individuals from 136 families by 2022. A separate denominator is available
    for ascertainment through paediatric CAKUT: PAX2 loss-of-function variants
    were found in 7 of 301 unselected paediatric CAKUT patients (2.3%).
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of published cases and the collective diagnostic experience of
      three laboratories in the United States, France, and New Zealand
      identified 55 unique mutations in 173 individuals from 86 families.
    explanation: >-
      Gives the published case census behind the CASES_IN_LITERATURE measure;
      it counts reported individuals, not a population rate.
  - reference: PMID:41278353
    reference_title: Presentation of Patients With Congenital Anomalies of the Kidney and Urinary Tract and PAX2 Loss-of-Function Variants and Implications for Clinical Management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous inherited or de novo PAX2 LOF variants were detected in 7 of
      301 patients (2.3%), all presenting with bilateral (cystic) kidney
      hypoplasia/dysplasia/hypodysplasia (KHD).
    explanation: >-
      Supplies the diagnostic yield of PAX2 testing within a paediatric CAKUT
      cohort, which is the closest thing to a denominator in the literature.
  - reference: PMID:35087773
    reference_title: "PAX2 Mutation-Related Renal Hypodysplasia: Review of the Literature and Three Case Reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of publication, only 272 affected individuals from 136
      different families are documented in the updated database of PAX2
      mutations
    explanation: >-
      Updates the locus-specific-database census a decade after Bower et al.,
      still a count of reported individuals rather than a population rate.
progression:
- phase: Progression to kidney failure
  notes: >-
    Kidney function declines over childhood and young adulthood. In a Korean
    cohort of 27 PAX2 variant carriers, kidney failure developed in 52% at a
    median age of 14.5 years; the accompanying literature review of 328 cases
    found faster progression in carriers of predicted loss-of-function
    variants.
  evidence:
  - reference: PMID:39994403
    reference_title: Genotype of PAX2-related disorders correlates with kidney and ocular manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kidney failure developed in 52% of Korean patients at a median age of
      14.5 years, with no difference in kidney survival between variant types.
    explanation: >-
      Quantifies the rate and timing of progression to kidney failure in a
      genetically confirmed cohort.
  - reference: PMID:39994403
    reference_title: Genotype of PAX2-related disorders correlates with kidney and ocular manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the literature review indicated faster progression to kidney failure in
      patients with pLoF variants (11.0 vs. 24.0 years; pLoF, n = 138 vs.
      non-pLoF, n = 71; P = 0.002)
    explanation: >-
      Supports variant-type dependence of the progression rate across the
      pooled published cases.
  - reference: PMID:31538321
    reference_title: A novel truncating PAX2 mutation in a boy with renal coloboma syndrome with focal segmental glomerulosclerosis causing rapid progression to end-stage kidney disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In previous reports describing PAX2 mutations with FSGS, affected
      individuals with missense PAX2 mutations developed ESKD in adulthood,
      whereas one case with truncating PAX2 mutations developed ESKD in
      childhood similar to the current case.
    explanation: >-
      Supports the same genotype-timing gradient within the FSGS arm
      specifically; the observation is a single case set against a literature
      review, not a cohort comparison.
pathophysiology:
- name: PAX2 Haploinsufficiency
  description: >-
    A heterozygous loss-of-function variant in PAX2 - most often a frameshift,
    nonsense or canonical splice-site change, with the recurrent c.76dupG
    (p.Val26Glyfs*28) in exon 2 the commonest single allele - halves the dose of
    a paired-box transcription factor that is required in the nephric duct,
    ureteric bud, metanephric mesenchyme, optic stalk and otic vesicle. The
    resulting phenotypes are dosage effects in tissues where PAX2 is
    transcriptionally rate-limiting, which is why one gene produces an apparently
    unrelated kidney-plus-eye combination. Mechanistically PAX2 does not act
    alone: it recruits a PTIP-MLL H3K4 methyltransferase complex to its target
    loci, so halving PAX2 halves the delivery of an activating chromatin mark to
    the developmental programmes it licenses.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: PAX2 paired-domain DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: PAX2
      term:
        id: hgnc:8616
        label: PAX2
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Most pathogenic alleles are predicted loss of function. A dominant-negative
      contribution has been proposed for the recurrent c.76dupG allele, whose
      transcript escapes nonsense-mediated decay, and for some FSGS-associated
      missense alleles that enhance PAX2 repressor activity.
  evidence:
  - reference: PMID:7795640
    reference_title: Mutation of the PAX2 gene in a family with optic nerve colobomas, renal anomalies and vesicoureteral reflux.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have conducted a mutational analysis of PAX2 in a family with optic
      nerve colobomas, renal hypoplasia, mild proteinuria and vesicoureteral
      reflux. We report a single nucleotide deletion in exon five, causing a
      frame-shift of the PAX2 coding region in the octapeptide domain.
    explanation: >-
      The founding report linking a truncating PAX2 allele to the combined
      ocular and renal phenotype in a segregating family.
  - reference: PMID:10466411
    reference_title: "Renal-coloboma syndrome: a multi-system developmental disorder caused by PAX2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Optic nerve coloboma combined with renal disease, also called
      renal-coloboma syndrome ( # 120330 in McKusick's Mendelian Inheritance in
      Man Online, OMIM), a relatively recently characterized syndrome, results
      from autosomal dominant mutations in the PAX2 gene.
    explanation: >-
      States the causal relationship and the dominant mode, anchoring PAX2
      variation as the initiating lesion of the entry.
  - reference: PMID:41278353
    reference_title: Presentation of Patients With Congenital Anomalies of the Kidney and Urinary Tract and PAX2 Loss-of-Function Variants and Implications for Clinical Management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe kidney anomalies, that is, cystic KHD or agenesis, were
      significantly more frequent in patients carrying the
      NM_000278.5(PAX2):c.76dupG variant in exon 2 with a possible
      dominant-negative effect than in patients with nonsense or frameshift
      variants in exon 3 to 7.
    explanation: >-
      Supports the note that the recurrent c.76dupG allele may act beyond simple
      haploinsufficiency; the dominant-negative mechanism is proposed, not shown.
  - reference: PMID:37628926
    reference_title: PAX2 Gene Mutation in Pediatric Renal Disorders-A Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PAX2 gene is involved in the definitive kidney formation, which is
      present in the caudal intermediate mesoderm and is also expressed in the
      ureteric bud (UB) and the metanephric mesenchyme (MM)
    explanation: >-
      Places PAX2 expression in the three compartments whose development fails
      here; a narrative review's synthesis rather than a primary observation.
  - reference: PMID:37628926
    reference_title: PAX2 Gene Mutation in Pediatric Renal Disorders-A Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this process, PAX2 recruits a histone H3K4 methyltransferase PAX
      interacting protein 1-mixed-lineage leukemia (PTIP-MLL) complex as a
      response to inductive signals
    explanation: >-
      Supports the chromatin-level account of how PAX2 acts on its targets, and
      so why dosage matters; a narrative review's synthesis rather than a
      primary observation.
  downstream:
  - target: Increased Ureteric Bud Apoptosis and Reduced Branching
    causal_link_type: DIRECT
    description: >-
      Reduced PAX2 dosage removes a survival signal in the developing ureteric
      bud epithelium.
    evidence:
    - reference: PMID:10587573
      reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings support the notion that heterozygous mutations of PAX2
        are associated with increased apoptosis and reduced branching of the
        ureteric bud, due to reduced PAX2 dosage during a critical window in
        kidney development.
      explanation: >-
        States the causal step from reduced PAX2 dosage to ureteric-bud
        apoptosis and reduced branching, which is exactly this edge.
  - target: Failure of Optic Fissure Closure
    causal_link_type: DIRECT
    description: >-
      PAX2 is expressed at the apposing edges of the optic fissure, and its loss
      prevents fissure closure.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, Pax2 mutants show extension of the pigmented retina into
        the optic stalks and failure of the optic fissure to close resulting in
        coloboma.
      explanation: >-
        Links loss of Pax2 directly to failed optic-fissure closure and the
        resulting coloboma in the mouse null.
  - target: Otic Vesicle Patterning Failure
    causal_link_type: DIRECT
    description: >-
      PAX2 is expressed in the otic primordium, and its loss prevents formation of
      the auditory parts of the inner ear.
    evidence:
    - reference: PMID:8951055
      reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the inner ear, Pax2 mutants show agenesis of the cochlea and the
        spiral ganglion, i.e., the parts of the organ responsible for auditory
        function and in whose primordium Pax2 is expressed.
      explanation: >-
        Ties loss of Pax2 to failure of the specific inner-ear structures whose
        maldevelopment this node describes.
  - target: Reduced Podocyte Fitness
    causal_link_type: DIRECT
    description: >-
      A second, postnatal arm in which PAX2 variants compromise the resilience of
      podocytes and parietal epithelial cells in nephrons that formed normally.
    evidence:
    - reference: PMID:41278347
      reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        By contrast, PAX2 loss-of-function variants are frequently associated
        with podocyte damage, albuminuria, and FSGS
      explanation: >-
        Attributes podocyte damage to PAX2 loss of function as a mechanism
        distinct from the developmental arm; the source is an invited commentary
        synthesising clinical and experimental work rather than primary data.
- name: Increased Ureteric Bud Apoptosis and Reduced Branching
  description: >-
    One of the normal functions of PAX2 in kidney development is suppression of
    apoptosis in the ureteric bud epithelium. At half dosage, apoptotic cell
    death rises during fetal kidney development and the ureteric bud undergoes
    fewer branching generations, so fewer nephron-inducing tips are ever
    generated.
  role: mechanism
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ureteric bud cell
    term:
      id: CL:4030066
      label: ureteric bud cell
  biological_processes:
  - preferred_term: branching involved in ureteric bud morphogenesis
    term:
      id: GO:0001658
      label: branching involved in ureteric bud morphogenesis
    modifier: DECREASED
  - preferred_term: apoptotic process in the developing ureteric bud
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: ureteric bud
    term:
      id: UBERON:0000084
      label: ureteric bud
  evidence:
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is evidence that one important role of PAX2 during renal development
      may be suppression of apoptosis in the developing ureteric bud.
    explanation: >-
      Names apoptosis suppression in the ureteric bud as the relevant normal
      PAX2 function, which is the function lost at this node.
  - reference: PMID:10587573
    reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous 1Neu mice showed increased apoptotic cell death during fetal
      kidney development
    explanation: >-
      Measures the apoptotic increase in a heterozygous model carrying the mouse
      equivalent of the commonest human allele.
  downstream:
  - target: Reduced Nephron Endowment and Renal Hypodysplasia
    causal_link_type: DIRECT
    description: >-
      Fewer ureteric-bud tips induce fewer nephrons, and the kidney that results
      is small and maldeveloped.
    evidence:
    - reference: PMID:10587573
      reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At E15, heterozygous mutant kidneys were approximately 60% of the size
        of wild-type littermates, and the number of nephrons was strikingly
        reduced.
      explanation: >-
        Measures both the size reduction and the nephron-number reduction that
        this edge asserts, in the same heterozygous fetal kidneys.
- name: Reduced Nephron Endowment and Renal Hypodysplasia
  description: >-
    The kidney is built with fewer nephrons than normal and with disordered
    architecture - small kidneys with poor corticomedullary differentiation,
    cortical cysts and, at the severe end, multicystic dysplasia or agenesis.
    The same disturbance of nephric-duct and ureteric-bud development produces
    the ureterovesical junction defects underlying vesicoureteral reflux.
  role: mechanism
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: nephron development
    term:
      id: GO:0072006
      label: nephron development
    modifier: DECREASED
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:10587573
    reference_title: "Primary renal hypoplasia in humans and mice with PAX2 mutations: evidence of increased apoptosis in fetal kidneys of Pax2(1Neu) +/- mutant mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a total of 29 patients, renal hypoplasia was the most common congenital
      renal abnormality.
    explanation: >-
      Establishes renal hypoplasia as the dominant human structural lesion; the
      quoted sentence reports the patient series, not the mouse work in the same
      paper.
  - reference: PMID:41278353
    reference_title: Presentation of Patients With Congenital Anomalies of the Kidney and Urinary Tract and PAX2 Loss-of-Function Variants and Implications for Clinical Management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 104 pediatric carriers of a PAX2 LOF variant with CAKUT, hallmark
      kidney manifestations were (cystic) KHD (97% vs. 59% in patients with
      CAKUT and wildtype PAX2, P < 0.0001)
    explanation: >-
      Shows kidney hypoplasia/dysplasia is the hallmark structural lesion of
      PAX2 loss of function, against a CAKUT comparison group.
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, kidneys exhibit fewer than the normal number of glomeruli
      and these glomeruli are enlarged, a finding called oligomeganephronia.
    explanation: >-
      The histological statement of this node: a reduced nephron count with
      compensatory glomerular enlargement.
  downstream:
  - target: Glomerular Hyperfiltration and Progressive Nephron Loss
    causal_link_type: DIRECT
    description: >-
      A reduced nephron endowment forces the surviving nephrons to hyperfilter.
    evidence:
    - reference: PMID:41278347
      reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        a developmental pathway, in which impaired kidney morphogenesis,
        particularly defective nephron formation, results in CAKUT and reduced
        nephron endowment, predisposing to hyperfiltration and progressive
        chronic kidney disease
      explanation: >-
        States the step from reduced nephron endowment to hyperfiltration and
        progressive CKD, which is this edge.
  - target: Renal hypoplasia
    causal_link_type: DIRECT
  - target: Cystic renal dysplasia
    causal_link_type: DIRECT
  - target: Multicystic kidney dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported at the severe end of the structural spectrum; the route from
      PAX2 loss to a multicystic dysplastic kidney is not established, and early
      ureteric obstruction has been proposed as an intermediate.
    evidence:
    - reference: PMID:16049068
      reference_title: Multicystic dysplastic kidney and variable phenotype in a family with a novel deletion mutation of PAX2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The finding of multicystic dysplastic kidney in renal coloboma syndrome
        could suggest that PAX2 may play a role in early ureteric obstruction
        and subsequent renal maldevelopment.
      explanation: >-
        Reports the association and offers the proposed intermediate, phrased by
        the authors as a suggestion, which is why the link is typed as indirect.
  - target: Vesicoureteral reflux
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reflux accompanies the renal malformation in PAX2 families; the specific
      ureterovesical-junction lesion has not been resolved.
    evidence:
    - reference: PMID:16049068
      reference_title: Multicystic dysplastic kidney and variable phenotype in a family with a novel deletion mutation of PAX2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Typical findings in these patients include renal hypoplasia, renal
        insufficiency, vesicoureteric reflux, and optic disc coloboma.
      explanation: >-
        Places vesicoureteric reflux among the typical findings alongside the
        renal structural lesion.
- name: Glomerular Hyperfiltration and Progressive Nephron Loss
  description: >-
    With too few nephrons for body size, single-nephron filtration rises, the
    remaining glomeruli hypertrophy, and the resulting haemodynamic stress
    drives proteinuria, hypertension and a steady loss of the nephrons that are
    left. This is the route by which a congenital, non-progressive malformation
    becomes progressive chronic kidney disease.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: glomerular filtration
    term:
      id: GO:0003094
      label: glomerular filtration
    modifier: INCREASED
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:39994403
    reference_title: Genotype of PAX2-related disorders correlates with kidney and ocular manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During kidney development, PAX2 suppresses apoptosis in the developing
      ureteric bud; therefore, PAX2 pathogenic variants increase apoptosis
      during the development of the kidneys and urinary tract, which may
      underlie the decreased nephron number, hypertrophy of the remaining
      nephrons, and RHD
    explanation: >-
      Connects the reduced nephron number to compensatory hypertrophy of the
      remaining nephrons, the haemodynamic state this node describes.
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequences of the renal hypodysplasia include hypertension, proteinuria
      and renal insufficiency that frequently progresses to end-stage kidney
      disease.
    explanation: >-
      Names the three downstream outcomes this node feeds and attributes them to
      the hypodysplasia rather than to a separate lesion.
  downstream:
  - target: Chronic kidney disease
    causal_link_type: DIRECT
  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Hypertension
    causal_link_type: DIRECT
- name: Reduced Podocyte Fitness
  description: >-
    A second mechanistic arm, distinct from the developmental one. PAX2 is
    normally silenced in the mature podocyte, and variant carriers whose
    nephrons formed normally still show podocytes that are unusually vulnerable
    to injury, together with disturbed nuclear maintenance in parietal
    epithelial cells and reduced regenerative capacity under stress. This arm
    explains the albuminuria that is disproportionate to the CKD stage, and the
    families in whom adult-onset FSGS is the whole phenotype.
  role: mechanism
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  - preferred_term: parietal epithelial cell
    term:
      id: CL:1000452
      label: parietal epithelial cell
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:41278347
    reference_title: "PAX2-Associated Kidney Dysplasia and Podocyte Injury: 2 Faces of a Monogenic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cunanan et al.5 recently showed in a murine model that Pax2 variants
      impair nuclear maintenance in parietal epithelial cells and disrupt
      podocyte homeostasis, thus reducing regenerative capacity under stress.
    explanation: >-
      Describes the parietal-epithelial and podocyte defect this node asserts;
      the quote is a commentary's report of a murine result, not the primary
      paper.
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

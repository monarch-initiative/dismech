name: Renal Coloboma Syndrome
creation_date: "2026-09-09T00:00:00Z"
category: Genetic
disease_term:
  preferred_term: PAX2-related disorder
  term:
    id: MONDO:0007352
    label: renal coloboma syndrome
description: >-
  An autosomal dominant developmental disorder caused by heterozygous
  loss-of-function variants in PAX2, in which one transcription-factor dosage
  defect disrupts two separate organogenesis programmes: ureteric-bud outgrowth
  and branching in the developing kidney, and closure of the optic fissure at
  the optic stalk. The result is renal hypodysplasia with a reduced nephron
  endowment, vesicoureteral reflux and progressive chronic kidney disease
  alongside optic nerve coloboma or dysplasia. GeneReviews now titles the entry
  PAX2-related disorder, because molecular testing has widened the phenotype
  beyond the classic renal-plus-optic-nerve pairing to include isolated CAKUT
  and adult-onset focal segmental glomerulosclerosis (FSGS type 7); renal
  coloboma syndrome and papillorenal syndrome are the older names for the
  syndromic core.
synonyms:
- PAX2-related disorder
- papillorenal syndrome
- renal-coloboma syndrome
- coloboma of optic nerve with renal disease
- optic coloboma, vesicoureteral reflux and renal anomalies
notes: >-
  Naming: this entry keeps the MONDO binding and file slug assigned by the
  curation queue (MONDO:0007352, renal coloboma syndrome) while using the
  current GeneReviews term, PAX2-related disorder, as the preferred display
  term. Whether the optic nerve lesion is a true coloboma or a dysplasia has
  been argued since the 1990s and is the reason both "renal coloboma" and
  "papillorenal" names persist; Bower et al. record the dispute explicitly.
  Related entries: Renal_Agenesis carries PAX2 as a syndromic CAKUT gene row
  and Familial_Vesicoureteral_Reflux names PAX2 among syndromic VUR genes.
  Both are cross-references, not subtype relationships - this is a leaf disease
  entry with a single causal gene.
  Four phenotypes are deliberately left off the pathograph because no source
  here supports a mechanism for them: microcornea, soft skin, joint
  hypermobility, and hyperuricemia's own upstream cause. They are reported
  associations of PAX2-related disorder, not steps anyone has traced, and an
  unconnected node is the honest representation of that.
  Scoped out deliberately: CNS/corpus callosum anomalies, genital anomalies and
  cataract are listed in the deep-research report but are not curated here. The
  report itself qualifies them as occurring "in some families" and as "less
  common findings", and gives no frequency, cohort or denominator that could be
  quoted, so there is nothing to attach an evidence snippet to. Two of the three
  CURIEs the report offers for them are also wrong in the way described below:
  HP:0002190, offered for corpus callosum anomalies, is Choroid plexus cyst, and
  HP:0000083, offered for genital anomalies, is Renal insufficiency. Only
  HP:0000518 (Cataract) is named correctly. Adding these would need a primary
  source with a frequency, not the report.
  Provenance caveat on the deep-research input: the Perplexity report's citations
  all resolved (22/22), but its term validation was unreliable - 29 of the 56
  CURIE labels it offered named a different term than the report claimed, among
  them HP:0000588/HP:0000589 inverted, UBERON:0001626 offered as "optic nerve"
  when UBERON calls it left coronary artery, and HGNC:8619 offered as PAX2 when
  that identifier is PAX5. Every ontology binding in this entry was therefore
  re-derived with OAK against the configured adapters and none was lifted from
  the report. The report also cites "PMID:8787321" for a 2022 Frontiers in
  Pediatrics review; that is a PMC identifier written as a PMID, and PMID:8787321
  is an unrelated 1995 French paper on inguinal hernia repair. The intended
  article is PMID:35087773, which this entry cites instead.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results identify Pax2 as a major regulator of patterning during
      organogenesis of the eye and inner ear and indicate its function in
      morphogenetic events required for closure of the optic fissure and neural
      tube.
    explanation: >-
      Assigns Pax2 the morphogenetic role in optic-fissure closure that this
      node loses.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the optic cup and stalk, PAX2 expression is most evident at the closing
      edges of the optic fissure.
    explanation: >-
      Places PAX2 expression precisely at the fissure margins, which is why a
      dosage defect acts on this step.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT

  evidence:
  - reference: PMID:21654726
    reference_title: Renal coloboma syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Consequences of the renal hypodysplasia include hypertension, proteinuria
      and renal insufficiency that frequently progresses to end-stage kidney
      disease.
    explanation: >-
      Names the clinical components of this node and their common endpoint.
  - reference: PMID:22213154
    reference_title: Update of PAX2 mutations in renal coloboma syndrome and establishment of a locus-specific database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 53 individuals where the age at diagnosis of CKD Stage 5 was reported,
      the average age was 19.5 years. The range of onset for CKD Stage 5 was
      birth to 79 years.
    explanation: >-
      Gives the age at kidney failure and, more importantly, its enormous range
      across mutation-positive individuals.
- name: Failure of Optic Fissure Closure
  description: >-
    PAX2 expression concentrates at the closing edges of the optic fissure and
    falls as closure proceeds. Without enough of it the fissure does not close and
    pigmented retina extends abnormally into the optic stalk. This is a discrete
    embryonic event, which is why the resulting ocular anomaly is structural and
    non-progressive.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: closure of optic fissure
    modifier: ABNORMAL
    term:
      id: GO:0061386
      label: closure of optic fissure
  downstream:
  - target: Optic Nerve Head Malformation
    causal_link_type: DIRECT
  - target: Retinal coloboma
    causal_link_type: DIRECT
    evidence:

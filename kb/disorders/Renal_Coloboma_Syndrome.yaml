  - reference: PMID:8951055
    reference_title: Pax2 contributes to inner ear patterning and optic nerve trajectory.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results identify Pax2 as a major regulator of patterning during

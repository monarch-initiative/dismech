- name: Failure of Optic Fissure Closure
  description: >-
    In the developing eye PAX2 expression is concentrated at the apposing edges
    of the optic fissure and falls as the fissure closes. Where PAX2 dosage is
    insufficient, the fissure margins fail to appose and fuse and the basement
    membrane between them is not dissolved, leaving a ventral gap at the optic
    stalk.
  role: mechanism
  biological_scale: TISSUE
  conforms_to: "ocular_morphogenesis_failure#Failure of Optic Fissure Closure"
  biological_processes:

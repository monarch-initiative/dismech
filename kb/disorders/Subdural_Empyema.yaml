      explanation: >-
        Defines subdural empyema as an intracranial infection.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:38425583
      reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Subdural empyema (SDE) is a rare acute neurological condition
        accounting for 20% of localized intracranial infections, mostly
        occurring as a life-threatening complication of sinusitis, otitis,
        mastoiditis, trauma, or surgical interventions
      explanation: >-
        Defines subdural empyema as an acute neurologic condition that occurs
        after sinonasal, otogenic, traumatic, or surgical seeding.
prevalence:
- population: Published localized intracranial infection series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    This proportion describes the clinical mix among localized intracranial
    infections, not population prevalence. The same review reports that SDE is
    more common in the second decade of life and has a male-to-female ratio of
    about 3:1.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subdural empyema (SDE) is a rare acute neurological condition accounting
      for 20% of localized intracranial infections
    explanation: >-
      Places subdural empyema within the localized-intracranial-infection case
      mix reviewed by the source.
transmission:
- name: Parameningeal contiguous spread
  description: >-
    Bacteria from paranasal sinuses, the middle ear, or mastoid air cells extend
    directly or through venous channels into the intracranial subdural space.
  evidence:
  - reference: PMID:23136260
    reference_title: "Subdural empyema in bacterial meningitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Predisposing conditions were present in 26 patients (93%), and consisted
      of otitis or sinusitis in 21 patients (75%). In all these patients the
      otitis or sinusitis spread to the subdural space.
    explanation: >-
      Documents otitis or sinusitis spreading into the subdural space in a
      prospective meningitis-associated subdural-empyema cohort.
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SDE secondary to sinus pathology can present as an insidious process, with
      the frontal sinus most frequently implicated, whether by direct extension
      or retrograde thrombophlebitis via the valveless diploe veins
    explanation: >-
      Supports both direct extension and retrograde venous thrombophlebitis as
      parameningeal spread routes from frontal sinusitis.
- name: Post-traumatic or postoperative inoculation
  description: >-
    Cranial trauma or neurosurgical procedures can create a second, exogenous
    route that seeds the subdural compartment.
  evidence:
  - reference: PMID:7742444
    reference_title: "Subdural empyema: analysis of 32 cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients were separated into three groups based on the etiology of
      their disease: sinusitis, trauma and/or neurosurgery, and other
      miscellaneous causes.
    explanation: >-
      The case series treated trauma or neurosurgery as one etiologic stratum of
      subdural empyema.
pathophysiology:
- name: Parameningeal or Postprocedural Bacterial Seeding
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Bacteria reach the intracranial subdural compartment from an adjacent
    sinonasal or otogenic infection, cranial trauma, or a neurosurgical
    procedure.
  downstream:
  - target: Subdural Purulent Collection
    causal_link_type: DIRECT
    description: >-
      Introduced organisms proliferate within the potential space between dura
      and arachnoid and establish a pyogenic exudate.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infections of the middle ear and paranasal sinuses are the most common
      predisposing factors that can lead to bacterial proliferation in the
      subdural space, usually by direct extension in young patients.
    explanation: >-
      Supports local head-and-neck bacterial extension as the upstream seeding
      route for the subdural collection.
  - reference: PMID:7742444
    reference_title: "Subdural empyema: analysis of 32 cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients were separated into three groups based on the etiology of
      their disease: sinusitis, trauma and/or neurosurgery, and other
      miscellaneous causes.
    explanation: >-
      Supports trauma and neurosurgery as additional etiologic routes.
- name: Subdural Purulent Collection
  biological_scale: TISSUE
  description: >-
    Neutrophil-rich pus accumulates between dura and arachnoid as a loculated
    collection that can extend over the brain convexity or falx.
  downstream:
  - target: Subdural Mass Effect with Cerebral Edema and Ischemia
    causal_link_type: DIRECT
    description: >-
      The expanding empyema compresses the brain and can be accompanied by
      cerebral edema and ischemia.
  - target: Cerebritis and Meningeal Irritation
    causal_link_type: DIRECT
    description: >-
      The purulent collection irritates adjacent meninges and cortex.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Pyogenic intracranial infection produces systemic fever.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It represents a loculated pyogenic infection, usually unilateral, located
      between the dura mater and the arachnoid that can potentially spread over
      the convexity of the brain and the midline to the contralateral hemisphere
    explanation: >-
      Defines the anatomic compartment and purulent, loculated nature of the
      empyema.
- name: Subdural Mass Effect with Cerebral Edema and Ischemia
  biological_scale: TISSUE
  description: >-
    The subdural collection compresses the brain, with surrounding edema and
    ischemia sometimes making the mass effect disproportionate to the volume of
    pus.
  downstream:
  - target: Increased Intracranial Pressure
    causal_link_type: DIRECT
    description: >-
      The subdural collection and surrounding edema raise intracranial pressure.
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Meningeal irritation and pressure from the empyema produce headache.
  - target: Vomiting
    causal_link_type: DIRECT
    description: >-
      Intracranial hypertension can present with vomiting.
  - target: Reduced Consciousness
    causal_link_type: DIRECT
    description: >-
      Mass effect and edema can reduce arousal.
  - target: Hemiparesis
    causal_link_type: DIRECT
    description: >-
      A convexity or parafalcine empyema can compress adjacent cortex,
      producing contralateral focal weakness.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SDE exerts a mass effect that can be disproportionate to its volume due to
      accompanying cerebral edema and ischemia
    explanation: >-
      Links the subdural collection to mass effect with accompanying edema and
      ischemia.
- name: Cerebritis and Meningeal Irritation
  biological_scale: TISSUE
  description: >-
    The subdural infection irritates the meninges and adjacent cortex, producing
    headache and cortical neurologic complications.
  downstream:
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Meningeal irritation and pressure from the empyema produce headache.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Cortical inflammation and irritation trigger focal or generalized
      seizures.
  - target: Reduced Consciousness
    causal_link_type: DIRECT
    description: >-
      Cerebritis and meningeal irritation can alter mental status.
  - target: Hemiparesis
    causal_link_type: DIRECT
    description: >-
      Adjacent cortical inflammation can produce contralateral focal deficits.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The symptoms are reflective of increased intracranial pressure, meningeal
      irritation, and cerebritis, with the most common being fever, headache,
      vomiting, altered mental status, and focal neurological deficits
    explanation: >-
      Links the dominant symptom cluster to increased intracranial pressure,
      meningeal irritation, and cerebritis.
  - reference: PMID:23136260
    reference_title: "Subdural empyema in bacterial meningitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical course was frequently complicated with seizures (50%), focal
      neurologic abnormalities (54%), and hearing impairment (39%), causing an
      unfavorable outcome in 19 episodes (68%).
    explanation: >-
      Directly supports seizures as frequent neurologic complications of
      bacterial-meningitis-associated subdural empyema.

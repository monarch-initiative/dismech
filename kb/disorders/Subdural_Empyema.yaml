      seeding route.
- phase: Rapid neurologic deterioration
  notes: >-
    The subdural collection can progress quickly through raised intracranial
    pressure, cerebritis, seizures, focal abnormalities, and depressed
    consciousness.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SDE is a challenging clinical diagnosis because of its non-specific
      presentation and rapid progression.
    explanation: >-
      Directly supports rapid progression as a clinical feature of subdural
      empyema.
  - reference: PMID:23136260
    reference_title: "Subdural empyema in bacterial meningitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical course was frequently complicated with seizures (50%), focal
      neurologic abnormalities (54%), and hearing impairment (39%), causing an
      unfavorable outcome in 19 episodes (68%).
    explanation: >-
      Documents frequent neurologic complications and unfavorable outcomes in
      bacterial-meningitis-associated cases.
- phase: Residual neurologic morbidity
  notes: >-
    Neurologic deficits can remain at hospital discharge despite treatment.
  evidence:
  - reference: PMID:7742444
    reference_title: "Subdural empyema: analysis of 32 cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall mortality rate was 9%; however, 55% of patients had

diagnosis:
- name: Contrast-enhanced MRI
  description: >-
    Contrast-enhanced MRI is the preferred cross-sectional imaging test for
    detecting the subdural collection and adjacent complications.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cross-sectional imaging is mandatory for the diagnosis, preferably
      contrast-enhanced magnetic resonance imaging.
    explanation: >-
      Supports MRI, preferably with contrast, as the diagnostic imaging
      approach.
treatments:
- name: Broad-Spectrum Intravenous Antibiotics
  description: >-
    Empiric intravenous therapy pairs a third-generation cephalosporin with
    anaerobic and staphylococcal coverage, then narrows to culture results for a
    prolonged course.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Subdural Purulent Collection
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy clears susceptible organisms in the subdural
      collection and adjacent source focus.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of SDE includes broad-spectrum antibiotics, for example,
      third-generation cephalosporin, along with metronidazole and vancomycin to
      provide appropriate coverage against pathogens that commonly colonize the
      upper respiratory tract ... Appropriate antibiotic therapy should be tailored
      to positive culture results and continued for up to six weeks
    explanation: >-
      Supports broad-spectrum empiric cephalosporin, anti-anaerobe, and
      anti-staphylococcal therapy with later culture-based narrowing.
- name: Neurosurgical Drainage
  description: >-
    Surgical evacuation drains the intracranial pus collection, lowers mass
    effect, and provides material for culture.
  treatment_term:
    preferred_term: neurosurgical drainage
    term:
      id: NCIT:C50434
      label: Drainage
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Subdural Purulent Collection
    treatment_effect: INHIBITS
    description: >-
      Evacuation removes the loculated pus collection that compresses and
      inflames adjacent cortex.
  evidence:
  - reference: PMID:38425583
    reference_title: "Subdural Empyema as a Complication of Sinusitis: A Diagnosis to Keep in Mind."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the case of intracranial abscesses, emergent surgical drainage is
      needed to lower intracranial pressure, allowing for the collection of
      intraoperative cultures
    explanation: >-
      Supports surgical source control for the intracranial pus collection.
progression:
- phase: Contiguous or postprocedural seeding
  notes: >-
    Subdural empyema begins when sinonasal or otogenic bacteria spread into the
    subdural compartment, or when organisms are introduced after cranial trauma
    or neurosurgery.
  evidence:

discussions:
- discussion_id: myl2_srx_stabilization_vs_myosin_inhibitors
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Cardiac myosin inhibitors treat hypertrophic cardiomyopathy by increasing
    occupancy of the myosin super-relaxed state. R58Q already stabilises that
    state. Is this drug class the right one for R58Q carriers, and does the
    answer differ by MYL2 allele?
  attaches_to:
  - pathophysiology#Stabilization of the Myosin Super-Relaxed State
  - treatments#Cardiac Myosin Inhibition (Mavacamten)
  rationale: >-
    The two facts are individually well supported and point in opposite
    directions. R58Q was shown to promote the myosin OFF state and stabilise SRX
    in reconstituted porcine fibres and in transgenic mouse papillary muscle, and
    the experimental intervention that improved the R58Q phenotype in that same
    work was a Ser15 phosphomimetic, which shifts myosin the other way, toward
    the disordered-relaxed state. Mavacamten shifts it toward SRX. If the R58Q
    lesion is an excess of SRX, the drug class licensed for this disease pushes
    in the direction of the lesion rather than against it.

    Three things stop this being an argument against prescribing. Obstruction is
    a haemodynamic problem and a gradient can fall for reasons unrelated to
    whether the drug corrects the primary lesion. The SRX findings are ex vivo
    and in mouse tissue, not in an R58Q patient's myocardium. And no
    genotype-stratified data exist either way: EXPLORER-HCM and VALOR-HCM
    enrolled by phenotype and reported no MYL2 subgroup, so there is no reported
    failure of mavacamten in an RLC carrier to point at. What is recorded here is
    a mechanistic reason to expect the answer might be allele-dependent, and an
    experiment worth doing, not a treatment recommendation.

    The corollary is that MYL2 is not mechanistically uniform. Sibling entries in
    this series carry the opposite lesion — the MYL3 A57G work describes
    inhibition of the super-relaxed state — so "sarcomeric HCM is
    hypercontractile" does not license assuming the direction of the SRX shift
    for a given light chain allele.
  evidence:
  - reference: PMID:30430732
    reference_title: "Phosphomimetic-mediated in vitro rescue of hypertrophic cardiomyopathy linked to R58Q mutation in myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R58Q promotes the OFF state of myosin, both in reconstituted porcine fibers
      and in Tg mouse papillary muscles, thereby stabilizing the super-relaxed
      state (SRX) of myosin, characterized by a very low ATP turnover rate
    explanation: >-
      Establishes the direction of the R58Q effect on the equilibrium the drug
      class targets, which is what raises the question.
- discussion_id: myl2_dominant_mechanism_is_not_haploinsufficiency
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    If one working copy of MYL2 is sufficient — as the unaffected obligate
    carriers in the recessive pedigrees show — what is the dominant missense
    mechanism, and does it differ between alleles?
  attaches_to:
  - pathophysiology#MYL2 Variant in Ventricular Regulatory Myosin Light Chain
  - variants#MYL2 c.403-1G>C — recessive cryptic-splice allele
  - genetic#MYL2
  rationale: >-
    The recessive pedigrees settle a question the dominant literature cannot: the
    parents of children with biallelic loss-of-function MYL2 disease are obligate
    heterozygotes for a null-like allele, and they had no cardiomyopathy. So
    losing half the normal gene product does not cause hypertrophic
    cardiomyopathy, and the dominant missense alleles cannot be acting by simple
    haploinsufficiency. The mutant light chain has to be incorporated into the
    sarcomere and do something there.

    That much is settled. What is not is what the mutant chain does, and whether
    it is the same thing for every allele. This entry curates the functional
    signature that has been worked out for R58Q — the phosphorylation deficit,
    the SRX shift, the reduced force with raised ATPase, the calcium
    sensitisation — but the same-cohort comparison that made R58Q malignant made
    E22K benign, and the transgenic comparisons that isolate the phosphorylation
    deficit to R58Q show that N47K, an allele at a neighbouring residue, does not
    share it. Assigning the R58Q mechanism to MYL2 as a gene would overstate what
    has been shown.

    The sharpest illustration is that the alleles do not even agree on the sign of
    the force change. R58Q lowers maximal isometric force; A13T raises it, and
    does so while incorporated into only about 10% of myofilaments — which is what
    led that study to a poison-peptide mechanism, the general shape of dominant
    action this discussion is asking about. A model in which a small amount of
    mutant light chain disproportionately disrupts the sarcomere accommodates both
    directions of force change and is consistent with the unaffected obligate
    carriers, since it requires the mutant protein to be present rather than the
    normal protein to be absent.
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in MYL2 are known to cause dominant
      hypertrophic cardiomyopathy; however, none of the parents showed signs of
      cardiomyopathy.
    explanation: >-
      The unaffected obligate carriers are the observation that excludes
      haploinsufficiency as the dominant mechanism.
  - reference: PMID:19150977
    reference_title: "Diastolic dysfunction in familial hypertrophic cardiomyopathy transgenic model mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the R58Q mutation and not the N47K led to reduced RLC phosphorylation in Tg
      ventricles
    explanation: >-
      Shows one of the entry's mechanistic nodes is allele-specific rather than a
      property of MYL2 disease generally.
  - reference: PMID:22091967
    reference_title: "Myosin regulatory light chain mutation found in hypertrophic cardiomyopathy patients increases isometric force production in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The significant functional changes observed, despite a low level of A13T
      mutant incorporation into myofilaments, suggest a 'poison-peptide'
      mechanism of disease.
    explanation: >-
      Names the dominant mechanism this discussion is weighing, and gives the
      observation behind it — disproportionate functional effect from a small
      mutant fraction, which is the signature of a poison peptide rather than of
      a dose deficit.
  - reference: PMID:22091967
    reference_title: "Myosin regulatory light chain mutation found in hypertrophic cardiomyopathy patients increases isometric force production in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional studies revealed an abnormal A13T mutation-induced increase in
      isometric force production
    explanation: >-
      The opposite sign of force change from R58Q, in the same protein and the
      same laboratory's transgenic system, which is the evidence that the
      functional signature is allelic rather than gene-level.
- discussion_id: myl2_no_genotype_stratified_outcome_or_omics_data
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the penetrance, natural history, and sudden-death risk of
    MYL2-related hypertrophic cardiomyopathy, and is there any MYL2-stratified
    molecular dataset?
  attaches_to:
  - phenotypes#Sudden Cardiac Death
  - prevalence#Worldwide (MYL2 share of HCM)
  - treatments#Cardiac Myosin Inhibition (Mavacamten)
  rationale: >-
    Every quantitative clinical statement in this entry is either a single-family
    figure or a disease-class figure borrowed from unstratified hypertrophic
    cardiomyopathy cohorts. Sudden death in R58Q is documented as an association
    across two pedigrees with no denominator behind it; the only screened case
    fraction available is for the light chain genes as a class in a 186-patient
    cohort from 2002; and the guideline and trial evidence supporting the
    treatments block enrolled by phenotype with no MYL2 subgroup reported.

    The gap extends to molecular data. A GEO search for MYL2-specific
    cardiomyopathy datasets returns nothing: the accessions that surface for MYL2
    are studies in which it appears as a cardiomyocyte marker gene, and the
    accessions that surface for hypertrophic cardiomyopathy are unstratified or
    concern other genes. That is why this entry carries no datasets block. Adding
    a generic hypertrophic cardiomyopathy dataset here would be the named-entity
    substitution the repository's dataset guidance warns about — relaxing the
    entry name to its parent disease — and the absence is the accurate record.

    What would close it: a MYL2-stratified outcome cohort with a denominator, an
    allele-resolved penetrance estimate for R58Q comparable to the E22K founder
    work, and an isogenic-pair transcriptomic or proteomic profile of an
    MYL2-mutant human cardiomyocyte model.
  evidence:
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      myosin light chain mutations are a very rare cause of HCM responsible for
      about 1% of cases
    explanation: >-
      The rarity that explains why no MYL2-powered outcome cohort exists, and the
      only screened denominator this entry has.
- discussion_id: myl2_penetrance_is_conditional_on_a_second_driver
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Is conditional penetrance — a MYL2 allele that needs a second hypertrophy
    driver to become clinical disease — a property of the E22K founder allele, or
    the general model for low-penetrance sarcomeric variants?
  attaches_to:
  - environmental#Hypertension as a penetrance-determining co-factor
  - variants#MYL2 c.64G>A p.(Glu22Lys) — Dutch founder allele
  - progression#Penetrance conditional on an additional hypertrophy driver
  rationale: >-
    The founder cohort is unusually clean evidence for a model that is usually
    only asserted. Thirty-eight carriers of one allele on one haplotype: the
    allele alone was largely benign, and with hypertension, obesity, or a second
    sarcomeric variant, 89% of carriers had hypertrophic cardiomyopathy. The
    authors drew two conclusions that both follow from it — screen carriers for
    treatable hypertrophy drivers, and stop excluding hypertensive patients from
    genetic studies on the grounds that their hypertrophy is already explained.

    Whether the model generalises is open, and the founder design cuts both ways:
    one haplotype in one population controls for genetic background beautifully
    and also means the result could be specific to that background. The
    disease-class penetrance literature is consistent with conditional penetrance
    without demonstrating it — incidentally identified population carriers of
    sarcomeric variants have much lower penetrance than clinically ascertained
    ones, which is what a model requiring a second driver predicts, but is also
    what ascertainment bias alone predicts.
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The co-presence of additional risk factors for hypertrophy such as
      hypertension, obesity, or other sarcomeric gene mutation increased disease
      penetrance substantially and caused HCM in 89% of MYL2 mutation carriers
    explanation: >-
      The quantified conditional-penetrance result this hypothesis is built on.
references:
- reference: PMID:20301725
  title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  CMH10 is the MYL2 (ventricular regulatory myosin light chain) member of the
  sarcomeric HCM series and one of the eight ClinGen-definitive HCM genes. It
  conforms to the shared cardiomyopathy_maladaptive_remodeling module. Two
  inheritance modes are curated: the common autosomal dominant missense form
  (R58Q archetype) and a severe autosomal recessive infantile cardioskeletal form
  from biallelic loss of function. Because MYL2 is expressed in slow-twitch
  skeletal muscle as well as ventricle, a cardioskeletal component can accompany
  the cardiomyopathy, and this entry models that as a parallel target of the same
  allele rather than as a consequence of the cardiac disease.

  Allele, not gene, is the unit of mechanism here. The functional chain curated in
  pathophysiology — reduced RLC Ser15 phosphorylation, stabilisation of the
  myosin super-relaxed state, reduced force with raised ATPase, myofilament
  calcium sensitisation, calcium-handling remodelling — is established for R58Q
  and should not be read as a description of MYL2 disease generally. The same
  screening study that made R58Q malignant made E22K benign at comparable septal
  thickness, and the transgenic series that isolates the phosphorylation deficit
  to R58Q shows N47K does not share it. The alleles do not even agree on the sign
  of the force change — R58Q lowers maximal isometric force, A13T raises it. The
  `variants` block, not the gene record, is where the entity's clinical and
  functional heterogeneity lives.

  The cardioskeletal claim needs care, and this entry deliberately does not
  overstate it. MYL2 is expressed in ventricle and slow-twitch skeletal muscle
  simultaneously, and human pedigrees report both tissues affected — but the one
  model that measures the skeletal deficit does so in a *cardiac-restricted*
  transgenic, where the mutant light chain is absent from soleus. That model
  therefore cannot show the allele acting locally in skeletal muscle, and its
  authors present the soleus finding as a surprise for exactly that reason. The
  edge is curated as causal_link_type UNKNOWN with the model's own result
  recorded as a REFUTE item against the local-action reading.

  The edges from the terminal mechanism nodes to their phenotypes are
  deliberately uncited. They are manifestation links — the tissue-remodelling
  node surfacing as observable disarray, the clinical-endpoint node surfacing as
  diastolic dysfunction — and the evidence for each claim lives on the phenotype
  record it points at. Citing the phenotype's source again on the edge would be
  reaching for a node's citation to paper over an edge, which is the thing the
  curation guidance warns against; an uncited edge is the honest form here. This
  costs compliance score, since that metric counts evidence presence per edge
  and cannot distinguish a manifestation link from an unsupported causal claim.

  Two curation decisions worth knowing about. Mavacamten's therapeutic_agent is
  deliberately unbound, following Hypertrophic_Cardiomyopathy_8 — see the note on
  that treatment. And there is no `datasets` block: a GEO search returns no
  MYL2-specific cardiomyopathy dataset (MYL2 surfaces as a cardiomyocyte marker
  gene, and the HCM datasets are unstratified or about other genes), so adding
  one would substitute the parent disease for this entity. The absence is
  recorded in `discussions` instead.

  Deep research. A falcon (Edison) run was performed for this entry
  (research/Hypertrophic_Cardiomyopathy_10-deep-research-falcon.md). Its
  reference validation resolved 11/11 extractable citations with no
  confabulations and none scored off topic, though only 6 of the 11 were
  affirmatively scored on topic, so that screen is not a clean bill of health;
  its term validation resolved 39/39 CURIEs but named several wrongly, and one
  suggestion was rejected on that basis — the report offered HP:0001698 for left
  ventricular outflow tract obstruction, which is Pericardial effusion; this
  entry uses HP:0032092. HP:0005117 (offered for diastolic dysfunction, actually
  Elevated diastolic blood pressure) and HP:0030680 (offered for left atrial
  enlargement, actually Abnormal cardiovascular system morphology) were likewise
  not used. The report's D166H family findings (atrial fibrillation, restrictive
  filling, LOD score) are not curated: the paper is a research letter whose
  PubMed record carries no abstract, so those numbers cannot be quoted as a
  verified snippet from the cache.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  (PMID:20301725), tagged accordingly in `references`. Its indexed PubMed record
  is content_type abstract_only and carries only the chapter's purpose
  statement, not the Clinical Characteristics, Management, or Genetic Counseling
  sections, so section-by-section GeneReviews mining is not possible from the
  cache and no snippet is quoted from it. The clinical-characteristics baseline
  for this entry is therefore built from the primary MYL2 cohort and pedigree
  literature cited throughout, principally PMID:26497160, PMID:12404107,
  PMID:23365102, PMID:8673105 and PMID:30796699.

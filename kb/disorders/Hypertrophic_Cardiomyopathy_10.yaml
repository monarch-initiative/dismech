name: Hypertrophic Cardiomyopathy 10
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMH10
- MYL2 hypertrophic cardiomyopathy
- ventricular regulatory myosin light chain hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 10
- hypertrophic cardiomyopathy caused by mutation in MYL2
description: >-
  Hypertrophic cardiomyopathy 10 (CMH10) is the MYL2-related form of familial
  hypertrophic cardiomyopathy. MYL2 encodes the ventricular/slow-twitch regulatory
  myosin light chain (RLC), which binds the neck (lever-arm) region of the
  beta-cardiac myosin heavy chain and tunes the force and calcium sensitivity of
  contraction. It is one of the eight genes with definitive ClinGen gene-disease
  validity for HCM. Heterozygous missense RLC variants (the archetype being R58Q)
  produce dominant HCM through a gain of myofilament calcium sensitivity together
  with impaired force transmission by the lever arm; because MYL2 is expressed in
  both heart ventricle and slow-twitch skeletal muscle, the same lesion can produce
  a cardioskeletal phenotype. A distinct severe autosomal recessive form, caused by
  biallelic loss-of-function (e.g. the IVS6-1 cryptic-splice allele), presents as
  fatal infantile cardiomyopathy with slow-skeletal fiber hypotrophy.
category: Genetic
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
disease_term:
  preferred_term: hypertrophic cardiomyopathy 10
  term:
    id: MONDO:0012112
    label: hypertrophic cardiomyopathy 10
parents:
- Hypertrophic Cardiomyopathy
- Genetic Disorder
# Rule for the `subtype:` discriminator on phenotypes and progression phases in
# this entry: tag a record when the evidence behind it comes from a genotyped
# individual or pedigree belonging to one arm, and leave it untagged when it is a
# manifestation of the disease generally. So the allele-anchored records are
# tagged — obstruction (D166A), atrial fibrillation (I158L), septal hypertrophy,
# non-septal distribution and sudden death, all from heterozygous missense
# carriers, hence `AD missense`; type I fibre disease from the biallelic
# pedigrees, hence `AR biallelic LOF` — while shared endpoints such as
# hypertrophic cardiomyopathy itself, diastolic dysfunction, heart failure and
# myofiber disarray are left unassigned because both arms reach them.
has_subtypes:
- name: AD missense
  display_name: Autosomal dominant missense CMH10
  description: >-
    The common form: a single heterozygous MYL2 missense allele acting on the
    regulatory light chain, with incomplete age-related penetrance and
    allele-dependent severity spanning benign late-onset disease (E22K) to early
    onset with premature sudden death (R58Q). This is the arm that the entry's
    pathophysiology chain, treatments and clinical trials describe.
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in MYL2 are known to cause dominant
      hypertrophic cardiomyopathy; however, none of the parents showed signs of
      cardiomyopathy.
    explanation: >-
      Names the dominant missense arm and, in the same sentence, separates it
      from the recessive arm by noting that heterozygous carriers of a
      loss-of-function allele are unaffected.
- name: AR biallelic LOF
  display_name: Autosomal recessive biallelic loss-of-function light chain myopathy
  description: >-
    A distinct severe entity rather than an early presentation of the dominant
    form: biallelic loss-of-function MYL2 alleles affecting the last exon,
    disrupting the second EF-hand domain, presenting as a fatal infantile
    cardioskeletal myopathy with type I fibre hypotrophy. The obligate
    heterozygous parents are unaffected, so this arm and the dominant one differ
    in mechanism and not only in dose. Its discoverers proposed the name "light
    chain myopathy". It is curated as a subtype rather than a separate entry
    because it is the same gene and the same MONDO concept, but note the original
    pedigrees reported dilated rather than hypertrophic cardiomyopathy; if a
    distinct MONDO term is minted for light chain myopathy, this should be
    revisited as a split.
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mutations in the last exon of MYL2 are responsible for a novel
      autosomal recessive lethal myosinopathy
    explanation: >-
      Establishes this arm as its own recessive entity rather than a severe
      expression of the dominant disease.
inheritance:
- name: Autosomal dominant (heterozygous missense)
  description: >-
    The classic CMH10 presentation is autosomal dominant, caused by a single
    heterozygous MYL2 missense allele acting on the regulatory light chain, with
    incomplete, age-related penetrance typical of sarcomeric HCM.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: CGGV:assertion_7b25ff6c-3ede-46a3-a637-3eab7aa18569-2026-01-13T170000.000Z
    reference_title: "MYL2 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYL2 | HGNC:7583 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: >-
      ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel
      classifies the MYL2-HCM relationship as Definitive with autosomal dominant
      inheritance.
- name: Autosomal recessive (biallelic loss of function)
  description: >-
    A separate, severe autosomal recessive form results from biallelic
    loss-of-function MYL2 alleles (e.g. the IVS6-1 cryptic-splice variant),
    presenting as fatal infantile cardiomyopathy with slow-skeletal muscle fiber
    hypotrophy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27378946
    reference_title: "Molecular and Functional Effects of a Splice Site Mutation in the MYL2 Gene Associated with Cardioskeletal Myopathy and Early Cardiac Death in Infants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      severely compromising the ability of myosin to develop contractile force and
      maintain normal systolic and diastolic cardiac function
    explanation: >-
      Characterises the biallelic IVS6-1 loss-of-function mechanism producing the
      severe infantile cardioskeletal form.
prevalence:
- population: Worldwide (MYL2 share of HCM)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    MYL2 is a definitive but numerically minor HCM gene; no population-based rate
    for the MYL2-specific entity is documented.
progression:
- phase: Infantile onset (biallelic loss-of-function genotype)
  subtype: AR biallelic LOF
  age_range: Onset and death in infancy
  notes: >-
    The recessive form is a distinct clinical entity from dominant CMH10 and
    should not be described as an early presentation of it.
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cardioskeletal myopathy with onset and death in infancy, morphological
      features of muscle type I hypotrophy with myofibrillar disorganization and
      dilated cardiomyopathy was previously reported in three Dutch families.
    explanation: >-
      Defines the presentation window and outcome of the biallelic infantile
      form in the pedigrees that led to its genetic solution.
- phase: Adult onset (heterozygous missense genotype), allele-dependent
  subtype: AD missense
  age_range: Childhood to late adulthood, allele-dependent
  notes: >-
    Age at clinical manifestation tracks the allele rather than the gene: the two
    MYL2 variants characterised side by side in one screening study differed in
    onset and in prognosis, which is why this entry curates onset per variant
    rather than as a single disease-level figure.
  evidence:
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation Glu22Lys was associated with moderate septal hypertrophy, a
      late onset of clinical manifestation, and benign disease course and
      prognosis.
    explanation: >-
      Documents the late-onset, benign pole of the allelic range in a genotyped
      MYL2 family.
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation Arg58Gln showed also moderate septal hypertrophy, but, in
      contrast, it was associated with an early onset of clinical manifestation
      and premature sudden cardiac death.
    explanation: >-
      Documents the early-onset, malignant pole of the same allelic range, in
      the same cohort and with the same ascertainment.
- phase: Penetrance conditional on an additional hypertrophy driver
  subtype: AD missense
  notes: >-
    Recorded as a progression phase because in the E22K founder cohort the
    transition from genotype-positive to clinically affected was gated by the
    arrival of a second hypertrophy-promoting factor rather than by age alone.
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MYL2 mutation c.64G > A on its own is incapable of triggering clinical
      HCM in most carriers.
    explanation: >-
      States that for this founder allele the genotype alone does not carry the
      carrier into clinical disease.
pathophysiology:
- name: MYL2 Variant in Ventricular Regulatory Myosin Light Chain
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMH10 is a variant in MYL2, encoding the ventricular
    regulatory myosin light chain (RLC) that binds the lever-arm region of
    beta-cardiac myosin. In the common dominant form the variant is a missense
    change (archetype R58Q) incorporated into the sarcomere; in the rare severe
    recessive form biallelic loss-of-function abolishes normal RLC. Either way the
    lesion perturbs how the myosin lever arm transmits force and how the myofilament
    responds to calcium.
  genes:
  - preferred_term: MYL2
    term:
      id: hgnc:7583
      label: MYL2
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Sarcomere Organization
    term:
      id: GO:0045214
      label: sarcomere organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Myosin thick filament
    term:
      id: GO:0032982
      label: myosin filament
  evidence:
  - reference: PMID:30365366
    reference_title: "Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic mice with a mutation in the myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MYL2 mutated models of hypertrophic cardiomyopathy may be useful research
      tools to study the molecular, structural, and energetic mechanisms of
      cardioskeletal myopathy associated with myosin RLC
    explanation: >-
      Establishes MYL2/regulatory-light-chain variants as a cause of hypertrophic
      cardiomyopathy with an associated cardioskeletal component, in a transgenic
      model of the R58Q allele.
  downstream:
  - target: Impaired Lever-Arm Function and Myofilament Calcium Sensitization
    causal_link_type: DIRECT
    description: >-
      The abnormal regulatory light chain disturbs lever-arm force transmission and
      shifts myofilament calcium sensitivity.
    evidence:
    - reference: PMID:8673105
      reference_title: "Mutations in either the essential or regulatory light chains of myosin are associated with a rare myopathy in human heart and skeletal muscle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The light chains stabilize the long alpha helical neck of the myosin head.
      explanation: >-
        Names the structural role through which a regulatory light chain variant
        reaches the lever arm, which is what makes this edge direct rather than
        an association between two separately evidenced nodes.
  - target: Reduced RLC Ser15 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      The R58Q allele specifically lowers the phosphorylation of the regulatory
      light chain in vivo. This is a distinct consequence of the variant, not a
      downstream effect of the force deficit, and it is allele-selective.
    evidence:
    - reference: PMID:19150977
      reference_title: "Diastolic dysfunction in familial hypertrophic cardiomyopathy transgenic model mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the R58Q mutation and not the N47K led to reduced RLC phosphorylation in
        Tg ventricles
      explanation: >-
        Attributes the phosphorylation deficit to the R58Q variant itself, and
        shows it does not follow from carrying any HCM-associated RLC variant,
        since the N47K allele in the same experiment did not produce it.
  - target: Slow-Twitch Skeletal Muscle Contractile Deficit
    causal_link_type: UNKNOWN
    description: >-
      MYL2 is expressed in slow-twitch skeletal muscle as well as ventricle, and
      cardiac and skeletal involvement co-occur in human light chain disease. The
      link type is UNKNOWN rather than DIRECT because the intermediate steps are
      genuinely undetermined: the only model that measures the skeletal deficit
      produces it from a cardiac-restricted transgene, so a systemic route cannot
      be excluded and local action has not been demonstrated.
    evidence:
    - reference: PMID:8673105
      reference_title: "Mutations in either the essential or regulatory light chains of myosin are associated with a rare myopathy in human heart and skeletal muscle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        each of which are associated with a rare variant of cardiac hypertrophy
        as well as abnormal skeletal muscle
      explanation: >-
        The original description reports cardiac and skeletal abnormality
        together in the same patients. Marked INDIRECT because co-occurrence in a
        pedigree does not distinguish a shared direct target from a systemic
        consequence of the cardiac disease.
      directness: INDIRECT
- name: Impaired Lever-Arm Function and Myofilament Calcium Sensitization
  biological_scale: MOLECULAR
  role: effector
  description: >-
    The regulatory light chain stabilizes the myosin lever arm and modulates the
    calcium responsiveness of contraction. MYL2 disease variants reduce maximal
    contractile force while increasing myofilament calcium sensitivity — the two
    functional signatures repeatedly observed for HCM-associated MYL2 mutations.
    In transgenic RLC-mutant hearts and slow-twitch muscle, contractile force is
    lower than wild type, consistent with defective force transmission by the
    mutant lever arm.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
    modifier: ABNORMAL
  - preferred_term: Regulation of Cardiac Muscle Contraction by Calcium
    term:
      id: GO:0010882
      label: regulation of cardiac muscle contraction by calcium ion signaling
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27378946
    reference_title: "Molecular and Functional Effects of a Splice Site Mutation in the MYL2 Gene Associated with Cardioskeletal Myopathy and Early Cardiac Death in Infants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a significant decrease in maximal contractile force and a significantly
      increased Ca(2+) sensitivity, both hallmarks of hypertrophic
      cardiomyopathy-associated mutations in MYL2
    explanation: >-
      States the two canonical functional consequences of HCM MYL2 mutations —
      reduced maximal force and increased myofilament calcium sensitivity.
  - reference: PMID:30365366
    reference_title: "Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic mice with a mutation in the myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Skinned SOL muscles and ventricular PMs of R58Q animals exhibited lower contractile force"
    explanation: >-
      Confirms reduced contractile force in ventricular papillary muscle of an
      R58Q RLC transgenic model, the in vivo correlate of the force deficit.
  downstream:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    causal_link_type: DIRECT
    description: >-
      Chronic sarcomeric dysfunction drives maladaptive structural remodeling.
    evidence:
    - reference: PMID:18929571
      reference_title: "Regulatory light chain mutations associated with cardiomyopathy affect myosin mechanics and kinetics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that both R58Q and N47K show reductions in force compared to the
        wild type that could result in compensatory hypertrophy.
      explanation: >-
        Makes the causal step explicitly: the measured force deficit is what the
        authors propose the hypertrophy compensates for. The claim is the
        authors' proposed mechanism rather than a demonstrated sequence, so this
        edge rests on an inference they state rather than on an experiment that
        followed force loss through to hypertrophy.
      directness: INDIRECT
  - target: Calcium Handling Remodeling and Electrical Instability
    causal_link_type: DIRECT
    description: >-
      Beyond the myofilament's own calcium responsiveness, MYL2-mutant
      cardiomyocytes remodel their calcium handling machinery, including a large
      reduction in L-type calcium current.
    evidence:
    - reference: PMID:30796699
      reference_title: "Induced Pluripotent Stem Cell-Derived Cardiomyocytes from a Patient with MYL2-R58Q-Mediated Apical Hypertrophic Cardiomyopathy Show Hypertrophy, Myofibrillar Disarray, and Calcium Perturbations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the L-type Ca2+ channel (LTCC) (ICa,L) density at 0 mV was reduced
        significantly by 45.3%
      explanation: >-
        Shows a change in the calcium handling apparatus itself in patient-derived
        MYL2-R58Q cardiomyocytes, which is a separate lesion from the myofilament
        calcium sensitisation modelled at the upstream node.
- name: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Sustained sarcomeric dysfunction produces the structural remodeling that
    defines HCM — cardiomyocyte hypertrophy, myofiber disarray, and interstitial
    fibrosis. RLC-mutant HCM classically involves mid-ventricular and papillary
    muscle hypertrophy, but the disarray-and-fibrosis substrate is shared with the
    other sarcomeric forms.

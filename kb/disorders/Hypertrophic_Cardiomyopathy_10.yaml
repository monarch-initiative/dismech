- name: Sudden Cardiac Death
  category: Cardiovascular
  description: >-
    Premature sudden death is the outcome that separates the malignant from the
    benign MYL2 alleles. It was the distinguishing feature of R58Q in the family
    screening study that also identified the benign E22K allele, and a
    four-generation pedigree carrying R58Q recorded three deceased members who
    died suddenly. No denominator exists — there is no MYL2-stratified outcome

histopathology:
- name: Myofibrillar Disarray
  description: >-
    The tissue-level record of disarray in this entity, kept distinct from the
    Myofiber Disarray phenotype, which carries the cardiac finding as an
    observable clinical feature. What this record adds is that disarray in MYL2
    disease is not confined to myocardium: in the biallelic infantile form the
    corresponding skeletal-muscle finding is myofibrillar disorganization
    alongside hypotrophic type I fibres, the histological counterpart of this
    entry's cardioskeletal claim.

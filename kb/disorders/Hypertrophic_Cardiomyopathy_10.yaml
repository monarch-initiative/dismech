  description: >-
    The remodelled, stiff, fibrotic ventricle produces the clinical endpoints of
    CMH10: diastolic dysfunction, heart failure, and a risk of malignant
    ventricular arrhythmia and sudden death. As with sarcomeric HCM generally,
    a positive family history of HCM and of sudden cardiac death is common. The
    severe recessive infantile form fails systolically and diastolically together
    and is fatal in infancy.

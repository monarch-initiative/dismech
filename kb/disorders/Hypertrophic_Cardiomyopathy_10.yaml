- name: Diastolic Dysfunction, Heart Failure and Arrhythmic Risk
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The remodelled, stiff, fibrotic ventricle produces the clinical endpoints of

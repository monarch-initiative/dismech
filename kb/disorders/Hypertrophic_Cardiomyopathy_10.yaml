      light chain disease, which is the anatomical basis of the mid-cavity
      pattern. Marked INDIRECT because the sentence gives the proposed mechanism
      at that site rather than reporting the hypertrophy distribution itself.
    directness: INDIRECT
  notes: >-
    The binding is HP:0031992 Apical hypertrophic cardiomyopathy, which is
    narrower than this phenotype as described — HPO has no term for a
    mid-ventricular or mid-cavity distribution, and HP:0031992 is the only
    non-septal distribution term available. The apical half of the claim rests on

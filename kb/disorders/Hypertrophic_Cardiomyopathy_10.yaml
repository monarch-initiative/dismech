- name: Reduced RLC Ser15 Phosphorylation
  biological_scale: MOLECULAR
  role: effector
  description: >-
    The regulatory light chain carries a conserved Ser15 phosphorylation site
    through which cardiac myosin light-chain kinase tunes force production. The
    R58Q allele lowers RLC phosphorylation in vivo, and this is allele-selective
    rather than a general property of HCM-associated RLC variants — the N47K
    allele, studied in the same transgenic series, did not reduce it. The deficit
    is mechanistically load-bearing rather than incidental: substituting an
    aspartate at the phosphorylation site to mimic the phosphorylated state
    restores force in R58Q-reconstituted fibres.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: RLC Ser15 phosphorylation
    term:
      id: GO:0018105
      label: peptidyl-serine phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:19150977
    reference_title: "Diastolic dysfunction in familial hypertrophic cardiomyopathy transgenic model mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the R58Q mutation and not the N47K led to reduced RLC phosphorylation in Tg
      ventricles
    explanation: >-
      Establishes the phosphorylation deficit in vivo and shows it is specific to
      the malignant allele.
  - reference: PMID:30430732
    reference_title: "Phosphomimetic-mediated in vitro rescue of hypertrophic cardiomyopathy linked to R58Q mutation in myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A low level of maximal isometric force observed for R58Q- versus
      WT-reconstituted fibers was restored by S15D-R58Q.
    explanation: >-
      Rescue by a phosphomimetic at Ser15 is what makes the phosphorylation
      deficit causal for the force deficit rather than a co-occurring finding.
    directness: INDIRECT
  downstream:
  - target: Stabilization of the Myosin Super-Relaxed State
    causal_link_type: DIRECT
    description: >-
      Phosphorylation of the regulatory light chain shifts the thick filament
      away from the ordered, ATP-conserving OFF state; losing that phosphate
      shifts it back.
    evidence:
    - reference: PMID:30430732
      reference_title: "Phosphomimetic-mediated in vitro rescue of hypertrophic cardiomyopathy linked to R58Q mutation in myosin regulatory light chain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        R58Q promotes the OFF state of myosin, both in reconstituted porcine
        fibers and in Tg mouse papillary muscles, thereby stabilizing the
        super-relaxed state (SRX) of myosin, characterized by a very low ATP
        turnover rate
      explanation: >-
        Reports the OFF-state shift in the same experimental system in which the
        Ser15 phosphomimetic reverses it, which is what connects the two nodes.
- name: Stabilization of the Myosin Super-Relaxed State
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Striated-muscle myosin partitions between an active force-producing state, a
    disordered-relaxed state whose heads can reach actin, and a super-relaxed
    (SRX) state with an ordered arrangement along the thick filament and a very
    low ATP turnover rate. R58Q shifts the equilibrium toward SRX in both
    reconstituted fibres and transgenic papillary muscle, leaving fewer heads
    recruitable. This direction matters clinically: the licensed cardiac myosin
    inhibitors for hypertrophic cardiomyopathy act by *increasing* SRX occupancy,
    so an allele that already stabilises SRX is not obviously the one that class
    was designed for. That reservation is a mechanistic inference, not a reported
    treatment failure, and is recorded as an open question rather than as
    guidance.

    The ATP-turnover annotation on this node refers to the low turnover rate that
    defines the super-relaxed state itself. It is not in conflict with the raised
    actin-activated fibre ATPase reported for R58Q elsewhere in this entry: those
    are different measurements — the turnover of heads parked in the OFF state,
    and the enzymatic rate of the heads that are cycling.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: Myosin ATP turnover
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Myosin thick filament
    term:
      id: GO:0032982
      label: myosin filament
  evidence:
  - reference: PMID:30430732
    reference_title: "Phosphomimetic-mediated in vitro rescue of hypertrophic cardiomyopathy linked to R58Q mutation in myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R58Q promotes the OFF state of myosin, both in reconstituted porcine fibers
      and in Tg mouse papillary muscles, thereby stabilizing the super-relaxed
      state (SRX) of myosin, characterized by a very low ATP turnover rate
    explanation: >-
      Direct statement of the state shift this node represents, measured in two
      independent preparations.
  downstream:
  - target: Impaired Lever-Arm Function and Myofilament Calcium Sensitization
    causal_link_type: DIRECT
    description: >-
      Fewer recruitable heads is one of the routes by which the allele lowers
      maximal force, so this node feeds the force deficit rather than bypassing
      it.
- name: Slow-Twitch Skeletal Muscle Contractile Deficit
  biological_scale: TISSUE
  role: consequence
  description: >-
    MYL2 encodes the regulatory light chain of heart ventricle and slow-twitch
    skeletal muscle simultaneously, and human pedigrees of light chain disease
    report cardiac hypertrophy together with abnormal skeletal muscle. Whether
    the skeletal deficit is a parallel local action of the allele or a systemic
    consequence of the cardiac disease is not settled, and the leading model
    argues against the simple parallel reading: in R58Q transgenic mice the
    soleus shows the same contractile deficit as ventricular papillary muscle
    and the fast-twitch extensor digitorum longus does not, but the transgene is
    cardiac-restricted, so the mutant light chain is not present in soleus at
    all. The authors present this as their surprising result rather than as
    evidence of local action. The human expression fact makes skeletal muscle a
    candidate direct target; the mouse experiment does not test it.
  cell_types:
  - preferred_term: Slow-twitch (type I) skeletal muscle fiber
    term:
      id: CL:0002211
      label: type I muscle cell
  biological_processes:
  - preferred_term: Slow-twitch skeletal muscle fiber contraction
    term:
      id: GO:0031444
      label: slow-twitch skeletal muscle fiber contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:30365366
    reference_title: "Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic mice with a mutation in the myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Skinned SOL muscles and ventricular PMs of R58Q animals exhibited lower contractile force"
    explanation: >-
      Measures the deficit in soleus and in ventricular papillary muscle of the
      same animals, which is the observation this node records. It establishes
      that the deficit exists in slow-twitch muscle; because the transgene is
      cardiac-restricted it does not establish that the allele acts locally
      there.
  - reference: PMID:30365366
    reference_title: "Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic mice with a mutation in the myosin regulatory light chain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Myosin light chain 2 ( MYL2) gene encodes the myosin regulatory light chain
      (RLC) simultaneously in heart ventricles and in slow-twitch skeletal
      muscle.
    explanation: >-
      States the shared expression that makes slow-twitch skeletal muscle a
      candidate direct target of a MYL2 allele, which is the human-side basis of
      this node.
  - reference: PMID:30365366
    reference_title: "Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic mice with a mutation in the myosin regulatory light chain."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      even though R58Q expression was restricted to the heart of mice, functional
      similarities were clearly observed between the hearts and slow-twitch
      skeletal muscle
    explanation: >-
      Refutes the reading that this model demonstrates the allele acting locally
      in skeletal muscle. The transgene is cardiac-restricted, so the soleus
      deficit it produces must arrive by a systemic route, and the authors flag
      the result as surprising for exactly that reason.
  - reference: PMID:30706179
    reference_title: "Hereditary heart disease: pathophysiology, clinical presentation, and animal models of HCM, RCM, and DCM associated with mutations in cardiac myosin light chains."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      R58Q-mutant mice showed functional similarities between the cardiac
      papillary muscles and slow-twitch soleus skeletal muscle
    explanation: >-
      A review restating the cardiac/slow-skeletal parallel, cited for the
      generalisation rather than for the primary measurement. Evidence source is
      OTHER because this is a narrative review.
  downstream:
  - target: Cardioskeletal Myopathy with Type I Fibre Disease
    causal_link_type: DIRECT
    description: >-
      The clinical skeletal-muscle phenotype this contractile deficit
      corresponds to.
- name: Calcium Handling Remodeling and Electrical Instability
  biological_scale: CELLULAR
  role: effector
  description: >-
    Patient-derived MYL2-R58Q cardiomyocytes remodel the calcium handling
    apparatus itself, with reduced L-type calcium current density, smaller and
    slower-decaying calcium transients, and a tenfold excess of irregular
    beating. This is a distinct lesion from the myofilament calcium
    sensitisation upstream: that one changes how the sarcomere responds to a
    given calcium signal, this one changes the signal.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of cardiac muscle cell membrane potential
    term:
      id: GO:0086036
      label: regulation of cardiac muscle cell membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30796699
    reference_title: "Induced Pluripotent Stem Cell-Derived Cardiomyocytes from a Patient with MYL2-R58Q-Mediated Apical Hypertrophic Cardiomyopathy Show Hypertrophy, Myofibrillar Disarray, and Calcium Perturbations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The percentage of myofibrillar disarray and cells with irregular beating in
      MYL2-R58Q iPSC-CMs was significantly higher than that in control cells.
    explanation: >-
      Reports the electrical instability of this node in human cells carrying the
      patient's own MYL2 allele.
  downstream:
  - target: Diastolic Dysfunction, Heart Failure and Arrhythmic Risk
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cellular electrical instability is a plausible contributor to the arrhythmic
      risk of this disease, but the step from an iPSC-cardiomyocyte beating
      irregularly to a clinical ventricular arrhythmia is not established, which
      is why the link type is indirect with unknown intermediates.
phenotypes:
- name: Hypertrophic Cardiomyopathy
  category: Cardiovascular
  description: >-
    Unexplained left ventricular hypertrophy is the defining feature; RLC-mutant
    disease classically involves mid-ventricular and papillary muscle hypertrophy.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  frequency: OBLIGATE
  notes: >-
    OBLIGATE is frequency among affected individuals and is tautological for an
    entity defined as a form of hypertrophic cardiomyopathy. It is not a
    penetrance claim about carriers, which is the opposite of obligate — see the
    progression entry on conditional penetrance and the E22K variant record.
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertrophic cardiomyopathy (HCM) is a genetic disorder that is characterized by left ventricular hypertrophy unexplained by secondary causes and a nondilated left ventricle with preserved or increased ejection fraction."
    explanation: >-
      States the defining clinical feature of the disease this MYL2 form manifests.
- name: Left Ventricular Diastolic Dysfunction
  category: Cardiovascular
  description: >-

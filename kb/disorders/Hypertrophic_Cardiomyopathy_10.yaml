    preferred_term: myofibrillar disarray
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cardioskeletal myopathy with onset and death in infancy, morphological
      features of muscle type I hypotrophy with myofibrillar disorganization and
      dilated cardiomyopathy was previously reported in three Dutch families.
    explanation: >-
      Records the skeletal muscle counterpart of the same lesion in the biallelic
      form.
  notes: >-
    The finding_term is bound only to the generic NCIT Morphologic Finding
    parent, for the reason recorded in Hypertrophic_Cardiomyopathy_4: NCIT has no
    myofibre-disarray term, and HP:0031318 Myofiber disarray, which this entry
    does use as a phenotype term, is not reachable from the
    HistopathologyFindingTerm enum roots.
- name: Cardiomyocyte Hypertrophy
  description: >-
    Cell-level hypertrophy, measurable in patient-derived cardiomyocytes without
    any haemodynamic load — MYL2-R58Q cells were about 30% larger than controls by
    day 60 of differentiation. That the enlargement appears in isolated cells is
    what places it upstream of chamber remodelling rather than as a consequence of
    it.
  finding_term:
    preferred_term: cardiomyocyte hypertrophy

diagnosis:
- name: Genetic Testing Establishing the MYL2 Genotype and Its Allele
  description: >-
    Molecular testing is what distinguishes CMH10 from any other cause of
    unexplained left ventricular hypertrophy, and in this gene the allele matters
    as much as the gene: the two variants characterised side by side in a
    systematic light chain screen differed in onset age and in sudden-death risk
    while looking the same on echocardiography. Zygosity must also be established,
    because the biallelic loss-of-function genotype is a different disease with a
    different prognosis and different reproductive counselling.
  evidence:
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation Arg58Gln showed also moderate septal hypertrophy, but, in
      contrast, it was associated with an early onset of clinical manifestation
      and premature sudden cardiac death.
    explanation: >-
      Shows that septal thickness did not separate the malignant from the benign
      allele, which is the argument for identifying the variant rather than
      stopping at the imaging phenotype.
- name: Screening MYL2 Carriers for Hypertension and Other Hypertrophy Drivers
  description: >-
    A management step specific to this gene rather than inherited from HCM
    generally. Because the founder allele largely fails to produce disease on its
    own and hypertension was the commonest co-factor in carriers who became
    affected, detecting and treating an additional hypertrophy driver early is a
    modifiable determinant of whether a carrier converts.
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."

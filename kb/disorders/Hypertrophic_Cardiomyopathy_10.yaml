notes: >-
  CMH10 is the MYL2 (ventricular regulatory myosin light chain) member of the
  sarcomeric HCM series and one of the eight ClinGen-definitive HCM genes, added to
  complete the definitive-gene set. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module. Two inheritance modes are curated:
  the common autosomal dominant missense form (R58Q archetype) and a severe
  autosomal recessive infantile cardioskeletal form from biallelic loss of
  function (IVS6-1). Because MYL2 is expressed in slow-twitch skeletal muscle as
  well as ventricle, a cardioskeletal component can accompany the cardiomyopathy.

    Both the dominant heterozygous missense arm and the recessive biallelic
    loss-of-function arm are curated on this one gene record, because the
    gene-disease relationship is single and it is the allele class and dose
    that differ.
# clinical_significance values in this block are curator classifications drawn
# from the cited segregation and functional evidence, not ClinVar submissions or
# ClinGen VCEP assertions, none of which are cited here. PATHOGENIC on the E22K
# founder allele is a statement about causality, not about expressivity: the same
# cited study reports that the allele alone is benign in manifestation and
# low-penetrance, which this entry records in the variant description, in
# progression, and in the conditional-penetrance discussion.
variants:
- name: MYL2 c.64G>A p.(Glu22Lys) — Dutch founder allele
  gene:
    preferred_term: MYL2
    term:
      id: hgnc:7583
      label: MYL2
  description: >-
    A founder allele shared on a common haplotype by 38 members of 14 families.
    It is the clearest case in this gene of a variant that is not sufficient on
    its own: carriers of E22K alone were largely well, and disease emerged when a
    second hypertrophy-promoting factor — hypertension, obesity, or a second
    sarcomeric variant — was present. Its clinical course when it does manifest
    is late-onset and benign, which is the opposite pole from R58Q.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analysed 14 HCM families of whom 38 family members share the MYL2 c.64G >
      A
    explanation: >-
      Establishes the size of the cohort in which this allele's behaviour was
      characterised. The quote stops before the HGVS protein annotation because
      the reference validator strips bracketed spans that are not uppercase
      abbreviations or percentages; the founder haplotype the same sentence
      reports is stated in this variant's description.
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation alone showed benign disease manifestation with low penetrance.
    explanation: >-
      States the low penetrance of the isolated allele, which is the property that
      makes this variant the entry's worked example of conditional penetrance.
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation Glu22Lys was associated with moderate septal hypertrophy, a
      late onset of clinical manifestation, and benign disease course and
      prognosis.
    explanation: >-
      Independent characterisation of the same allele in a different cohort,
      agreeing on the benign course.
- name: MYL2 p.(Arg58Gln) — malignant missense allele
  gene:
    preferred_term: MYL2
    term:
      id: hgnc:7583
      label: MYL2
  description: >-
    The archetypal MYL2 allele and the one behind almost all of the functional
    work in this entry. Unlike E22K it is malignant: early onset, premature
    sudden death, and co-segregation across a four-generation pedigree. Its
    functional signature is unusually well resolved — reduced RLC Ser15
    phosphorylation, stabilisation of the super-relaxed myosin state, lower
    maximal force with higher ATPase, increased calcium sensitivity with reduced
    cooperativity, and slower cross-bridge kinetics — and a Ser15 phosphomimetic
    reverses several of these in vitro. The two unaffected juvenile carriers in
    the four-generation pedigree are the age-related penetrance recorded in this
    entry's inheritance block seen within one family, not evidence against the
    allele.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation Arg58Gln showed also moderate septal hypertrophy, but, in
      contrast, it was associated with an early onset of clinical manifestation
      and premature sudden cardiac death.
    explanation: >-
      Contrasts R58Q with E22K in one cohort, which is what establishes that the
      severity difference is allelic and not cohort or ascertainment effect.
  - reference: PMID:31104103
    reference_title: "The co-segregation of the MYL2 R58Q mutation in Chinese hypertrophic cardiomyopathy family and its pathological effect on cardiomyopathy disarray."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      R58Q existed in all six members with HCM and two healthy juveniles who had
      not yet developed HCM yet, and presumably in three deceased members who
      suffered from sudden death
    explanation: >-
      Segregation in a four-generation family, addressing the paper's own concern
      that earlier R58Q reports rested on pedigrees of two or three members.
- name: MYL2 p.(Ala13Thr) — mid-ventricular obstruction allele
  gene:
    preferred_term: MYL2
    term:
      id: hgnc:7583
      label: MYL2
  description: >-
    The allele that anchors the mid-ventricular distribution of this entity, and
    the one that shows the functional signature is allelic rather than
    gene-level: where R58Q lowers maximal isometric force, A13T raises it. In a
    transgenic model it produced enlarged interventricular septa and fibrotic
    lesions, a lower acto-myosin ATPase Vmax, and reduced binding affinity of the
    mutant light chain for myosin, from roughly a tenth of myofilaments carrying
    the mutant — the disproportion that led its authors to a poison-peptide
    mechanism.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:22091967
    reference_title: "Myosin regulatory light chain mutation found in hypertrophic cardiomyopathy patients increases isometric force production in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      associated with a rare FHC variant defined by mid-ventricular obstruction
      and septal hypertrophy
    explanation: >-
      Gives the clinical phenotype attached to this allele. Graded
      MODEL_ORGANISM/INDIRECT because the sentence is this mouse study's
      background framing rather than a human result it reports.
  - reference: PMID:22091967
    reference_title: "Myosin regulatory light chain mutation found in hypertrophic cardiomyopathy patients increases isometric force production in transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional studies revealed an abnormal A13T mutation-induced increase in
      isometric force production
    explanation: >-
      The force change, in the direction opposite to R58Q's, measured in a
      transgenic model of this allele.
- name: MYL2 c.403-1G>C — recessive cryptic-splice allele
  gene:
    preferred_term: MYL2
    term:
      id: hgnc:7583
      label: MYL2
  description: >-
    A homozygous last-acceptor-splice-site allele found in Dutch patients with
    infantile cardioskeletal myopathy, with compound-heterozygous alleles
    affecting the same exon in an Italian patient. It replaces the C-terminal
    tail and disrupts the second EF-hand domain. It belongs to a different disease
    mechanism from the dominant missense alleles above, and the pedigrees say so
    directly: the obligate heterozygous parents had no cardiomyopathy.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MYL2 mutation results in use of a cryptic splice site upstream of the
      last exon causing a frameshift
    explanation: >-
      Describes the molecular consequence of the splice allele.
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a consequence of these mutations, the second EF-hand domain is disrupted.
    explanation: >-
      Names the structural domain lost, which is what distinguishes this allele
      class from the lever-arm missense alleles.
  - reference: PMID:23365102
    reference_title: "Recessive MYL2 mutations cause infantile type I muscle fibre disease and cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in MYL2 are known to cause dominant
      hypertrophic cardiomyopathy; however, none of the parents showed signs of
      cardiomyopathy.
    explanation: >-
      The obligate carriers being unaffected is the evidence that the dominant
      missense mechanism is not simple haploinsufficiency — one working copy of
      MYL2 is enough.
environmental:
- name: Hypertension as a penetrance-determining co-factor
  description: >-
    In the MYL2 E22K founder cohort, hypertension was the single most common
    additional hypertrophy driver among carriers who went on to develop clinical
    disease. This is not the usual "environmental risk factor" relationship, in
    which an exposure raises risk at the margin: here the genotype on its own
    largely failed to produce disease, and the co-factor supplied the rest. The
    authors' practical conclusion follows from that — screen carriers for
    hypertension early and treat it, and do not exclude hypertensive individuals
    from genetic studies of hypertrophic cardiomyopathy on the grounds that their
    hypertrophy is explained.
  effect: Converts a low-penetrance MYL2 genotype into clinical hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prominent risk factor was hypertension, observed in 71% of mutation
      carriers with HCM and an additional risk factor.
    explanation: >-
      Identifies hypertension as the dominant co-factor among affected carriers.
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MYL2 mutation c.64G > A on its own is incapable of triggering clinical
      HCM in most carriers.
    explanation: >-
      States the dependence explicitly, which is what makes this a co-factor
      rather than an additive risk.
  influences_mechanisms:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Pressure loading acts on the same remodelling node the sarcomeric lesion
      drives, which is why the two combine to produce hypertrophy that neither
      reliably produces alone.
    evidence:
    - reference: PMID:26497160
      reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The co-presence of additional risk factors for hypertrophy such as
        hypertension, obesity, or other sarcomeric gene mutation increased disease
        penetrance substantially and caused HCM in 89% of MYL2 mutation carriers
      explanation: >-
        Quantifies the joint effect on the hypertrophic outcome this node
        represents.
  notes: >-
    Left without an exposure_term. ECTO's only hypertension-related term is
    ECTO:2000001 exposure to medication for hypertension, which names the
    treatment rather than the condition and would assert something this entry
    does not claim.
- name: Obesity as a penetrance-determining co-factor
  description: >-
    Obesity appears alongside hypertension and a second sarcomeric variant in the
    set of additional hypertrophy drivers that carried E22K carriers into clinical
    disease. It is grouped with them in the founder study rather than measured
    separately, so its individual contribution is not quantified — only its
    membership in the co-factor set is.
  effect: Contributes to the additional hypertrophy burden that unmasks a low-penetrance MYL2 genotype
  evidence:
  - reference: PMID:26497160
    reference_title: "Hypertrophic remodelling in cardiac regulatory myosin light chain (MYL2) founder mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The co-presence of additional risk factors for hypertrophy such as
      hypertension, obesity, or other sarcomeric gene mutation increased disease
      penetrance substantially and caused HCM in 89% of MYL2 mutation carriers
    explanation: >-
      Names obesity among the co-factors and gives the joint penetrance figure.
      Marked INDIRECT because obesity's own effect is not reported apart from the
      grouped co-factor analysis.
    directness: INDIRECT
  influences_mechanisms:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Obesity adds haemodynamic load and metabolic drive to the same hypertrophic
      remodelling node, though the study reports it only within the grouped
      co-factor analysis.
  notes: >-
    Left without an exposure_term; ECTO has no obesity exposure term, and obesity
    is a body-mass state rather than an exposure.
treatments:
- name: Implantable Cardioverter-Defibrillator
  description: >-
    An implantable cardioverter-defibrillator provides primary or secondary
    prevention of sudden cardiac death in patients at high arrhythmic risk. The
    indication in this entry rests on the sudden-death association of the
    malignant MYL2 alleles; there is no MYL2-stratified risk model, so device
    decisions follow the general hypertrophic cardiomyopathy risk assessment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:30775854
    reference_title: "Genetic basis and outcome in a nationwide study of Finnish patients with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients with a pathogenic or likely pathogenic mutation underwent an
      implantable cardioverter defibrillator implantation more often than patients
      without a pathogenic or likely pathogenic mutation
    explanation: >-
      Documents that carrying a sarcomeric pathogenic variant, the class this
      entity belongs to, is what drives device implantation in practice in an
      unselected national cohort.
    directness: INDIRECT
- name: Heart Failure and HCM Pharmacotherapy
  description: >-
    Medical management of hypertrophy, outflow obstruction, and heart failure
    symptoms follows standard HCM and heart-failure therapy. No MYL2-specific
    agent or genotype-directed regimen exists, and the guideline recommendations
    this entry inherits were not stratified by genotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: non-dihydropyridine calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
    - preferred_term: disopyramide
      term:
        id: CHEBI:4657
        label: disopyramide
  evidence:
  - reference: PMID:38718139
    reference_title: "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of
      Hypertrophic Cardiomyopathy" provides recommendations to guide clinicians in
      the management of patients with hypertrophic cardiomyopathy.
    explanation: >-
      Identifies the guidance that governs pharmacological management of this
      entity. Evidence source is OTHER because a guideline is expert consensus
      over an evidence base rather than a study reporting its own data.
- name: Beta Blockade
  description: >-
    Beta blockers are the first-line drug for symptomatic obstructive disease,
    reducing heart rate and contractility and lengthening diastolic filling.
    Non-dihydropyridine calcium channel blockers (verapamil, diltiazem) are the
    second-line alternative when beta blockade is ineffective or contraindicated,
    and disopyramide is added for refractory obstruction, though its side effects
    mean many centres use it as a bridge to septal reduction rather than as
    durable therapy. None of this is MYL2-specific; it is the disease-class
    therapy a symptomatic carrier receives.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  evidence:
  - reference: PMID:40427081
    reference_title: "Integrative Approaches in the Management of Hypertrophic Cardiomyopathy: A Comprehensive Review of Current Therapeutic Modalities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Beta-blockers, including atenolol and nadolol, are considered the
      first-line treatment due to their ability to reduce heart rate and
      myocardial contractility and enhance diastolic filling.
    explanation: >-
      States the first-line status and the mechanism by which it works. Evidence
      source is OTHER because this is a narrative review.
  - reference: PMID:40993768
    reference_title: "Current and emerging medical and surgical therapy in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Conventional pharmacological therapies such as β-blockers and
      nondihydropyridine calcium channel blockers are effective first-line
      treatments for obstructive HCM, and established invasive septal reduction
      therapies, such as surgical myectomy and alcohol septal ablation, provide
      effective relief of obstruction in refractory patients.
    explanation: >-
      Independent review agreeing on first-line status and placing septal
      reduction after it in the sequence. Evidence source is OTHER because this
      is a narrative review.
  notes: >-
    Not MYL2-stratified. No genotype-directed dosing or agent selection exists
    for this entity.
- name: Septal Reduction Therapy
  description: >-
    Surgical myectomy or alcohol septal ablation relieves the outflow gradient in
    obstruction refractory to medical therapy. It is the procedure VALOR-HCM,
    curated in this entry's clinical trials, was designed to avert, so modelling
    the trial without modelling the procedure would leave the decision it
    addresses unrepresented. Note it targets anatomy rather than the sarcomeric
    lesion, so it acts on the obstruction phenotype while leaving every
    sarcomeric node upstream of it untouched.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: septal reduction therapy
    term:
      id: NCIT:C51591
      label: Myectomy
  target_mechanisms:
  - target: Left Ventricular Outflow Tract Obstruction
    description: >-
      The procedure removes the septal muscle that narrows the outflow tract, so
      it acts on the obstruction phenotype directly while leaving the sarcomeric
      lesion upstream of it untouched.
  evidence:
  - reference: PMID:40993768
    reference_title: "Current and emerging medical and surgical therapy in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Invasive septal reduction therapies (surgical myectomy or alcohol septal
      ablation [ASA]) can effectively relieve LVOT gradients in obstructive HCM,
      but these are targeted to anatomy rather than the genetic cause.
    explanation: >-
      States both what the procedure achieves and the limitation that bounds it:
      it relieves the gradient without acting on the genetic cause upstream.
      Evidence source is OTHER because this is a narrative review.
  - reference: PMID:40993768
    reference_title: "Current and emerging medical and surgical therapy in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Guidelines recommend optimization of medical treatment in obstructive HCM
      patients before proceeding to more invasive options such as septal
      reduction therapy (SRT)
    explanation: >-
      Places the procedure after medical therapy in the treatment sequence.
  notes: >-
    Not MYL2-stratified. The binding is NCIT:C51591 Myectomy, which names the
    surgical arm only; alcohol septal ablation is the catheter alternative and
    has no reachable clinical-action term, so it is carried in preferred_term and
    description rather than bound.
- name: Cardiac Myosin Inhibition (Mavacamten)
  description: >-
    Mavacamten reduces post-exercise outflow gradient and improves exercise
    capacity and symptoms in symptomatic obstructive hypertrophic cardiomyopathy,
    and is the first disease-directed drug class for the condition. It is listed
    here as the class a symptomatic obstructive MYL2 patient would be considered
    for, not as a MYL2-validated therapy — the pivotal trials enrolled by
    phenotype and reported no genotype subgroup. There is also a specific
    mechanistic reservation for the R58Q allele, recorded in the discussions
    block: myosin inhibitors work by increasing occupancy of the super-relaxed
    state, and R58Q already stabilises it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  target_mechanisms:
  - target: Stabilization of the Myosin Super-Relaxed State
    description: >-
      The drug class acts on the same super-relaxed/disordered-relaxed
      equilibrium this node represents. The edge records that the target is
      shared; it does not assert that shifting it further toward SRX benefits a
      carrier whose allele already shifts it that way.
  - target: Left Ventricular Outflow Tract Obstruction
    description: >-
      The measured clinical effect, as distinct from the molecular target above:
      the pivotal trial's primary haemodynamic result is a reduction in
      post-exercise outflow gradient. Recorded as a separate edge because the
      gradient can fall whether or not the drug corrects the primary lesion in a
      given allele, which is the open question this entry records for R58Q.
    evidence:
    - reference: PMID:32871100
      reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients on mavacamten had greater reductions than those on placebo in
        post-exercise LVOT gradient
      explanation: >-
        A randomised measurement of the drug acting on this node specifically,
        which is a different claim from the molecular-target edge above and is
        why this edge carries its own citation rather than borrowing one. Marked
        INDIRECT for this entity because the trial enrolled by phenotype and
        reported no MYL2 subgroup.
      directness: INDIRECT
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients on mavacamten had greater reductions than those on placebo in
      post-exercise LVOT gradient
    explanation: >-
      The pivotal randomised result establishing the class effect. Marked INDIRECT
      for this entry because the trial enrolled by phenotype and no MYL2 subgroup
      was reported, so the benefit is inherited from the disease class rather than
      demonstrated in this entity.
    directness: INDIRECT
  notes: >-
    Not MYL2-stratified. Recorded as disease-class therapy, not as evidence of
    benefit in MYL2 carriers.

    Mavacamten is deliberately left without an ontology term, for the reason
    already recorded in Hypertrophic_Cardiomyopathy_8: NCIT:C174901 Mavacamten
    exists but sits under Inotropic Support rather than Pharmacologic Substance,
    so it is not reachable from the ChemicalEntityTerm enum roots and fails term
    validation, and CHEBI has no mavacamten term. Do not substitute another NCIT
    code to fill the slot: NCIT:C158384 was tried during this curation and is
    SIGLEC15 Gene.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      associated with a rare FHC variant defined by mid-ventricular obstruction
      and septal hypertrophy
    explanation: >-
      States the mid-ventricular distribution for a named MYL2 allele. The
      evidence source is MODEL_ORGANISM because that is what this publication
      presents — it is a transgenic-mouse study — and the quoted clause is its
      background framing of the human entity it was built to model rather than a
      result it reports, hence INDIRECT. No primary human report of the A13T
      clinical phenotype could be located to cite in its place.
  - reference: PMID:8673105
    reference_title: "Mutations in either the essential or regulatory light chains of myosin are associated with a rare myopathy in human heart and skeletal muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

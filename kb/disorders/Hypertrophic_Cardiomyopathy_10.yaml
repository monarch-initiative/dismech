    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      severely compromising the ability of myosin to develop contractile force and
      maintain normal systolic and diastolic cardiac function
    explanation: >-
      Links the MYL2 lesion to impaired systolic and diastolic cardiac function.
      Marked INDIRECT because the quote is a statement about myosin's contractile
      capacity in a reconstituted system, and the clinical echocardiographic
      phenotype follows from it by inference rather than being reported.
    directness: INDIRECT
- name: Congestive Heart Failure

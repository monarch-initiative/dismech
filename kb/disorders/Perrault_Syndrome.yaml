        mutation in LARS2 (verified with OAK).
  genes:
  - preferred_term: LARS2
    term:
      id: hgnc:17095
      label: LARS2
  evidence:
  - reference: PMID:23541342
    reference_title: "Mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase, lead to premature ovarian failure and hearing loss in Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families affected by POF accompanied by hearing loss (together,
      these symptoms compose Perrault syndrome), exome sequencing revealed
      mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase
    explanation: Establishes LARS2 as a Perrault syndrome gene.
- name: PRLTS5
  display_name: Perrault syndrome 5 (TWNK)
  description: >-
    Perrault syndrome caused by biallelic TWNK (formerly C10orf2) variants. TWNK
    encodes Twinkle, the mitochondrial DNA primase-helicase. Essentially all
    reported individuals have neurological involvement, making this subtype
    prototypically type II, and auditory neuropathy rather than pure cochlear
    loss has been documented. IMPORTANT NOSOLOGICAL NOTE — TWNK is pleiotropic:
    dominant missense variants cause progressive external ophthalmoplegia type
    3, and a different set of recessive variants causes mitochondrial DNA
    depletion syndrome 7. Only the biallelic Perrault presentation belongs to
    this entry.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0014504
        label: Perrault syndrome 5
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO defines Perrault syndrome 5 as Perrault syndrome caused by
        mutation in TWNK (verified with OAK).
  genes:
  - preferred_term: TWNK
    term:
      id: hgnc:1160
      label: TWNK
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study identifies Twinkle mutations as a cause of Perrault syndrome
      accompanied by neurologic features and expands the phenotypic spectrum of
      recessive disease caused by mutations in Twinkle.
    explanation: Establishes recessive TWNK variants as a Perrault syndrome cause.
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twinkle is known also to harbor multiple mutations, nearly all missenses,
      leading to dominant progressive external ophthalmoplegia type 3 and to
      recessive mitochondrial DNA depletion syndrome 7, also known as
      infantile-onset spinocerebellar ataxia.
    explanation: >-
      Documents the allelic disorders that must NOT be conflated with the
      recessive Perrault presentation, in particular dominant PEO type 3.
- name: PRLTS6
  display_name: Perrault syndrome 6 (ERAL1)
  description: >-
    Perrault syndrome caused by biallelic ERAL1 variants. ERAL1 encodes a
    GTPase chaperone that binds mitochondrial 12S rRNA and is required for
    assembly of the small mitoribosomal subunit; patient fibroblasts show
    reduced assembled small subunit, reduced 12S rRNA and impaired mitochondrial
    respiration.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0033047
        label: Perrault syndrome 6
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO

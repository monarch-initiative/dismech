      id: hgnc:3424
      label: ERAL1
  evidence:
  - reference: PMID:28449065
    reference_title: "A homozygous missense mutation in ERAL1, encoding a mitochondrial rRNA chaperone, causes Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We excluded mutations in the known PS genes, but identified a single
      homozygous mutation in the ERAL1 gene (c.707A > T; p.Asn236Ile).
    explanation: Establishes ERAL1 as a Perrault syndrome gene.
- name: PRLTS7
  display_name: Perrault syndrome 7 (DAP3)
  description: >-
    Perrault syndrome caused by biallelic DAP3 variants. DAP3 encodes
    mitoribosomal small subunit protein 29 (MRPS29). Presentations span a
    Perrault-syndrome spectrum through to a severe childhood-onset
    neurometabolic phenotype with combined complex I and IV deficiency; this is
    the most recently designated numbered subtype.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0976232
        label: Perrault syndrome 7
      mapping_predicate: skos:exactMatch

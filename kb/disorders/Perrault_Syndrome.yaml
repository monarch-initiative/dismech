- name: Sex-Limited Expression of the Gonadal Phenotype
  biological_scale: ORGANISM
  role: modifier
  description: >-
    The defining and most distinctive feature of the disorder. The same
    biallelic genotype produces hearing loss in both sexes but a clinically
    manifest gonadal phenotype essentially only in 46,XX individuals. The
    mechanistic basis is the asymmetry of mammalian gametogenesis: the female
    germ cell pool is established prenatally, is finite and is not renewed, so a
    chronic bioenergetic deficit in a non-renewable oocyte population produces
    irreversible follicular exhaustion and hypergonadotropic hypogonadism at or
    shortly after puberty. Male germ cells, by contrast, are continuously
    regenerated from spermatogonial stem cells, so 46,XY individuals with the
    same genotype usually have normal gonadal function and normal fertility,
    though azoospermia and undervirilisation are occasionally described and
    CLPP-null mice have a clear meiotic arrest phenotype. This asymmetry is not
    a difference in inheritance — transmission is ordinary autosomal recessive —
    but it has a major ascertainment consequence: affected males and prepubertal
    girls present with what looks like isolated nonsyndromic deafness, so
    Perrault syndrome is systematically under-recognised in males and diagnosed
    late in girls.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  - preferred_term: spermatocyte
    term:
      id: CL:0000017
      label: spermatocyte

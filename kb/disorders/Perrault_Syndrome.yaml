- name: CLPP
  gene_term:
    preferred_term: CLPP
    term:
      id: hgnc:2084
      label: CLPP
  relationship_type: CAUSATIVE
  subtype: PRLTS3
  notes: >-
    Proteolytic subunit of the mitochondrial CLPXP protease and effector of the
    mitochondrial unfolded protein response. Perrault-associated substitutions
    cluster in a short region of the protein and are predicted to distort the
    proteolytic barrel chamber. GeneReviews places CLPP second by case share
    (about 18 per cent of solved cases).
  evidence:
  - reference: PMID:23541340
    reference_title: "Perrault syndrome is caused by recessive mutations in CLPP, encoding a mitochondrial ATP-dependent chambered protease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each family, affected individuals were homozygous for a different
      pathogenic CLPP allele: c.433A>C (p.Thr145Pro), c.440G>C (p.Cys147Ser), or
      an experimentally demonstrated splice-donor-site mutation, c.270+4A>G.
    explanation: Establishes CLPP causality with three independent homozygous alleles.
- name: HARS2
  gene_term:
    preferred_term: HARS2
    term:
      id: hgnc:4817
      label: HARS2
  relationship_type: CAUSATIVE
  subtype: PRLTS2
  notes: >-
    Mitochondrial histidyl-tRNA synthetase. Genotypes typically combine a
    hypomorphic missense allele with a second hypomorphic or loss-of-function
    allele; biallelic loss of function has not been observed and is presumed
    lethal. A recurrent p.Arg480His allele has been reported in multiple
    unrelated families. GeneReviews places HARS2 third by case share (about 14
    per cent of solved cases).
  evidence:
  - reference: PMID:21464306
    reference_title: "Mutations in mitochondrial histidyl tRNA synthetase HARS2 cause ovarian dysgenesis and sensorineural hearing loss of Perrault syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Aminoacylation activity of HARS2 p.V368L and HARS2 p.L200V was reduced and
      the deletion mutant was not stably expressed in mammalian mitochondria.
    explanation: >-
      Functional evidence that the pathogenic alleles reduce mitochondrial tRNA
      charging.
- name: HSD17B4
  gene_term:
    preferred_term: HSD17B4
    term:
      id: hgnc:5213
      label: HSD17B4
  relationship_type: CAUSATIVE
  subtype: PRLTS1
  notes: >-
    Peroxisomal D-bifunctional protein of fatty acid beta-oxidation, and the
    first Perrault syndrome gene identified. Allelic with D-bifunctional protein
    deficiency, a severe and usually fatal infantile peroxisomal disorder
    curated as a separate dismech entry; the Perrault presentation corresponds
    to hypomorphic genotypes with residual enzyme activity. Neurological
    features are characteristic of the reported HSD17B4 Perrault cases.
  evidence:
  - reference: PMID:20673864
    reference_title: "Mutations in the DBP-deficiency protein HSD17B4 cause ovarian dysgenesis, hearing loss, and ataxia of Perrault Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that Perrault syndrome and DBP deficiency overlap
      clinically; that Perrault syndrome is genetically heterogeneous; that DBP
      deficiency may be underdiagnosed; and that whole-exome sequencing can
      reveal critical genes in small, nonconsanguineous families.
    explanation: >-
      Establishes HSD17B4 causality and the allelic relationship with
      D-bifunctional protein deficiency.
- name: TWNK
  gene_term:
    preferred_term: TWNK
    term:
      id: hgnc:1160
      label: TWNK
  relationship_type: CAUSATIVE
  subtype: PRLTS5
  notes: >-
    Twinkle mitochondrial DNA primase-helicase (formerly C10orf2). Biallelic
    variants cause Perrault syndrome, essentially always with neurological
    features. PLEIOTROPY WARNING — dominant missense variants in TWNK cause
    progressive external ophthalmoplegia type 3 (PEOA3, MONDO:0012241), and a
    distinct set of recessive variants causes mitochondrial DNA depletion
    syndrome 7 (infantile-onset spinocerebellar ataxia). Literature about the
    dominant PEO phenotype must not be imported into this recessive entry.
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family 1, affected individuals were compound heterozygous for
      chromosome 10 open reading frame 2 (C10orf2) p.Arg391His and p.Asn585Ser.
    explanation: >-
      Documents biallelic (compound heterozygous) TWNK genotypes in Perrault
      syndrome, establishing the recessive mode for this phenotype.
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic heterogeneity of conditions caused by Twinkle mutations and
      the genetic heterogeneity of Perrault syndrome call for genomic definition
      of these disorders.
    explanation: >-
      Supports the need to keep the TWNK-associated phenotypes nosologically
      distinct rather than merged.
- name: PRORP
  gene_term:
    preferred_term: PRORP
    term:
      id: hgnc:19958
      label: PRORP
  relationship_type: CAUSATIVE
  notes: >-
    Metallonuclease subunit of mitochondrial RNase P (formerly KIAA0391),
    responsible for 5' end processing of mitochondrial precursor tRNAs. Not
    assigned a numbered PRLTS designation in MONDO or OMIM; presentations are
    multisystem and often include developmental delay and white-matter change.
  evidence:
  - reference: PMID:34715011
    reference_title: "Bi-allelic variants in the mitochondrial RNase P subunit PRORP cause mitochondrial tRNA processing defects and pleiotropic multisystem presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four unrelated families with multisystem disease associated with
      bi-allelic variants in PRORP, the metallonuclease subunit of mt-RNase P.
    explanation: Establishes PRORP causality in four independent families.
- name: GGPS1
  gene_term:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  relationship_type: CAUSATIVE
  notes: >-
    Geranylgeranyl diphosphate synthase of the mevalonate/isoprenoid pathway.
    Biallelic variants cause a muscular dystrophy / hearing loss / ovarian
    insufficiency syndrome that overlaps Perrault syndrome; the mechanism is
    loss of protein prenylation rather than of mitochondrial gene expression.
    No numbered PRLTS designation.
  evidence:
  - reference: PMID:32403198
    reference_title: "GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 11 patients in 6 families carrying 5 different biallelic
      pathogenic variants in specific domains of GGPS1 were identified.
    explanation: Establishes GGPS1 causality across six families.
- name: ERAL1
  gene_term:
    preferred_term: ERAL1
    term:
      id: hgnc:3424
      label: ERAL1
  relationship_type: CAUSATIVE
  subtype: PRLTS6
  notes: >-
    GTPase chaperone that binds mitochondrial 12S rRNA and is required for
    assembly of the small mitoribosomal subunit. An uncommon cause, at about 2
    per cent of solved cases in the GeneReviews gene table.
  evidence:
  - reference: PMID:28449065
    reference_title: "A homozygous missense mutation in ERAL1, encoding a mitochondrial rRNA chaperone, causes Perrault syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, levels of the 12S rRNA were reduced in the patients, and were
      rescued by lentiviral expression of wild type ERAL1.
    explanation: >-
      Rescue experiment confirming that the ERAL1 variant causes the molecular
      phenotype.
- name: RMND1
  gene_term:
    preferred_term: RMND1
    term:
      id: hgnc:21176
      label: RMND1
  relationship_type: CAUSATIVE
  notes: >-
    Mitochondrial inner-membrane factor that tethers mitoribosomes near sites of
    transcript maturation, supporting translation of mtDNA-encoded polypeptides.
    Allelic with combined oxidative phosphorylation deficiency 11; the Perrault
    presentation is the mild end of that spectrum and is distinguished by
    chronic kidney disease with little or no neurological involvement. No
    numbered PRLTS designation.
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study presents the mildest, so far reported, RMND1-related phenotype
      and delivers the first independent confirmation that RMND1 is causally
      involved in the development of Perrault syndrome with renal involvement.
    explanation: >-
      Provides the independent confirmation establishing RMND1 as a Perrault
      syndrome gene.
- name: DAP3
  gene_term:
    preferred_term: DAP3
    term:
      id: hgnc:2673
      label: DAP3
  relationship_type: CAUSATIVE
  subtype: PRLTS7
  notes: >-
    Encodes mitoribosomal small subunit protein 29 (MRPS29). Biallelic variants
    reduce small subunit assembly and cause combined complex I and IV
    deficiency, with presentations spanning Perrault syndrome to a severe
    neurometabolic phenotype.
  evidence:
  - reference: PMID:39371131
    reference_title: "Biallelic variants in DAP3 result in reduced assembly of the mitoribosomal small subunit with altered intrinsic and extrinsic apoptosis and a Perrault syndrome-spectrum phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lentiviral transduction of fibroblasts from affected individuals with
      wild-type DAP3 cDNA increased DAP3 mRNA expression, and partially rescued
      protein levels of MRPS7, MRPS9 and complex I and IV subunits,
      demonstrating the pathogenicity of the DAP3 variants.
    explanation: Rescue experiment demonstrating DAP3 variant pathogenicity.
- name: MRPS7
  gene_term:
    preferred_term: MRPS7
    term:
      id: hgnc:14499
      label: MRPS7
  relationship_type: CAUSATIVE
  notes: >-
    Mitoribosomal small subunit protein. Reported in two independent families
    with syndromic premature ovarian insufficiency and sensorineural hearing
    loss; no numbered PRLTS designation.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This second independent report validates that variants in MRPS7 are a
      cause of syndromic POI/Perrault syndrome.
    explanation: >-
      Provides the second independent report establishing MRPS7 as a Perrault
      syndrome gene.
- name: TFAM
  gene_term:
    preferred_term: TFAM
    term:
      id: hgnc:11741
      label: TFAM
  relationship_type: UNKNOWN
  notes: >-
    Mitochondrial transcription factor A, required for mtDNA transcription,
    replication and nucleoid packaging. Deliberately curated at a LOWER evidence
    tier than the other genes in this section. Tucker et al. 2020 name TFAM
    among "candidate genes" in patients who remained unsolved after the
    confirmed diagnoses, whereas the same paper states positively that PEX6
    variants "can present clinically as Perrault syndrome" with supporting
    serum biochemistry. TFAM is therefore mechanistically plausible - it sits in
    the same mtDNA-maintenance arm as TWNK - and is listed among Perrault genes
    by review articles, but it has not been established with the segregation and
    functional evidence available for the numbered subtypes, and it carries no
    PRLTS designation. relationship_type is UNKNOWN rather than CAUSATIVE to
    record that distinction rather than flatten it. MRPL49 and MRPL50, which
    appear in the same review gene list, are omitted for the same reason and
    with less supporting evidence still.
  evidence:
  - reference: PMID:32399598
    reference_title: "Genomic sequencing highlights the diverse molecular causes of Perrault syndrome: a peroxisomal disorder (PEX6), metabolic disorders (CLPP, GGPS1), and mtDNA maintenance/translation disorders (LARS2, TFAM)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The remaining patients had variants in candidate genes such as TFAM,
      involved in mtDNA transcription, replication, and packaging, and GGPS1
      involved in mevalonate/coenzyme Q10 biosynthesis and whose enzymatic
      product is required for mouse folliculogenesis.
    explanation: >-
      The source explicitly frames TFAM as a candidate gene rather than an
      established cause, which is why this entry is marked PARTIAL and the
      relationship_type is UNKNOWN.
- name: PEX6
  gene_term:
    preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  relationship_type: CAUSATIVE
  notes: >-
    Peroxisome biogenesis factor. Allelic with Zellweger-spectrum peroxisome
    biogenesis disorder, curated separately; hypomorphic genotypes can present
    clinically as Perrault syndrome with demonstrable peroxisomal dysfunction.
    A rare cause, at about 1 per cent of solved cases. No numbered PRLTS
    designation.
  evidence:
  - reference: PMID:32399598
    reference_title: "Genomic sequencing highlights the diverse molecular causes of Perrault syndrome: a peroxisomal disorder (PEX6), metabolic disorders (CLPP, GGPS1), and mtDNA maintenance/translation disorders (LARS2, TFAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, we show that pathogenic variants in PEX6 can present
      clinically as Perrault syndrome.
    explanation: Establishes PEX6 as a molecular cause of the Perrault phenotype.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No reliable population-based prevalence, incidence or carrier frequency has
    been established. Perrault syndrome is consistently described as rare, with
    published cases numbering in the low hundreds and drawn from selectively
    ascertained deafness and premature-ovarian-insufficiency clinics.
    Under-ascertainment in 46,XY individuals, who lack the gonadal phenotype,
    means any published figure is a lower bound.
  evidence:
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cohort demonstrates a distribution of 56.1% homozygous and 43.9%
      compound heterozygous variants, reflecting diverse ancestral backgrounds
      and potential selective pressures against deleterious alleles.
    explanation: >-
      The largest synthesis available reports only aggregate genotype
      proportions across a literature cohort, with no population denominator,
      supporting the assessment that prevalence is unquantified and the disorder
      ultra-rare.

diagnosis:
- name: Pure-Tone Audiometry with Auditory Brainstem Response
  description: >-
    Comprehensive audiological assessment including pure-tone audiometry,
    tympanometry, otoacoustic emissions, acoustic reflexes and auditory
    brainstem responses. Brainstem-response testing is essential because a
    subset of individuals, particularly those with TWNK variants, have an
    auditory-neuropathy pattern that pure-tone audiometry alone will
    underestimate. Serial testing is required because hearing loss is often
    progressive and can be late-onset.
  evidence:
  - reference: PMID:39340975
    reference_title: "Detailed characterization of auditory neuropathy in perrault syndrome with TWNK variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases highlight the importance of detailed hearing tests, including
      auditory brainstem response and genetic tests in patients with Perrault
      syndrome, even in cases of mild hearing loss, for accurate diagnosis and
      appropriate management.
    explanation: >-
      Directly recommends auditory brainstem response testing in suspected
      Perrault syndrome.
- name: Comprehensive Genomic Sequencing
  description: >-
    Because the disorder is caused by at least fifteen genes and known genes
    explain only about half of clinically diagnosed individuals, a comprehensive
    hearing-loss / premature-ovarian-insufficiency / mitochondrial gene panel or
    exome/genome sequencing with copy-number analysis is the appropriate
    first-line molecular test. Karyotype and FMR1 premutation testing remain
    part of the wider evaluation of premature ovarian insufficiency to exclude
    the principal non-Perrault causes.
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants of these eight genes only account for approximately half of the
      individuals with clinical features of Perrault syndrome where the
      molecular genetic base remains under investigation.
    explanation: >-
      Establishes the incomplete diagnostic yield that motivates broad genomic
      rather than targeted testing.

treatments:
- name: Hearing Aids and Auditory Rehabilitation
  description: >-
    Amplification for aidable hearing loss with speech and language therapy and
    educational support, fitted early to protect language and cognitive
    development. Frequently escalated to cochlear implantation as hearing loss
    progresses. Ototoxic medication, in particular aminoglycosides where an
    alternative exists, and loud-noise exposure should be avoided in individuals
    with an already vulnerable cochlea.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Sensorineural Hearing Loss
    treatment_effect: BYPASSES
    description: >-
      Amplification compensates for the reduced cochlear output without
      correcting the underlying hair cell injury.
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She received hearing aids at the age of six; the degree of HL progressed
      gradually and was accompanied by tinnitus and vertigo from the age of 31.
    explanation: >-
      Documents hearing aid use, and its eventual insufficiency, in a
      genetically confirmed individual.
- name: Cochlear Implantation
  description: >-
    Surgical implantation of a cochlear implant for severe-to-profound
    sensorineural hearing loss not adequately served by amplification. Outcomes
    reported in genetically confirmed Perrault syndrome have been good,
    including in adults implanted after decades of progressive loss.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cochlear Hair Cell Mitochondrial Injury and Loss
    treatment_effect: BYPASSES
    description: >-
      Direct electrical stimulation of the cochlear nerve bypasses the lost or
      dysfunctional hair cells entirely.
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cochlear implantation was performed for the right ear at the age of 34 and
      for the left ear at the age of 36 with a good outcome.
    explanation: >-
      Documents successful cochlear implantation in genetically confirmed
      Perrault syndrome.
- name: Oestrogen and Progestogen Replacement Therapy
  description: >-
    Hormone replacement in 46,XX individuals, using incremental oestrogen to
    induce puberty when required, followed by cyclic oestrogen with a
    progestogen if the uterus is present. Replacement is continued to the usual
    age of menopause to limit the bone, cardiovascular and urogenital
    consequences of prolonged hypo-oestrogenism. This treats the downstream
    hormone deficiency; it does not restore ovarian reserve.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: oestradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
    - preferred_term: dydrogesterone
      term:
        id: CHEBI:31527
        label: dydrogesterone
  target_mechanisms:
  - target: Hypergonadotropic Ovarian Failure
    treatment_effect: BYPASSES
    description: >-
      Exogenous oestrogen and progestogen replace the missing ovarian steroid
      output, correcting the downstream hypo-oestrogenic state without
      restoring follicular function.
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both receive oestradiol and dydrogesterone supplementation to reduce the
      complications of POI.
    explanation: >-
      Documents combined oestrogen and progestogen replacement given
      specifically to reduce the complications of premature ovarian
      insufficiency.
- name: Assisted Reproduction with Donor Oocytes
  description: >-
    Donor-oocyte in vitro fertilisation is the most reliable fertility option
    once the follicle pool is exhausted. Oocyte or embryo cryopreservation may
    be considered while residual ovarian reserve remains, which requires
    diagnosis and counselling before reserve is lost — an argument for
    prepubertal surveillance of girls with unexplained bilateral sensorineural
    hearing loss.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Assisted Reproductive Technology
    term:
      id: NCIT:C93282
      label: Assisted Reproductive Technology
  target_mechanisms:
  - target: Female Infertility
    treatment_effect: BYPASSES
    description: >-
      Donor oocytes bypass the depleted follicle pool without restoring ovarian
      function.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      POI is a common cause of infertility, characterised by elevated
      follicle-stimulating hormone and amenorrhea in women under the age of 40.
    explanation: >-
      Establishes the infertility that assisted reproduction addresses; the
      specific donor-oocyte recommendation derives from clinical management
      guidance rather than this report, so support is marked PARTIAL.
- name: Genetic Counselling
  description: >-
    Counselling for the 25 per cent sibling recurrence risk of an autosomal
    recessive disorder, with cascade testing of at-risk relatives. Counselling
    must address the sex-limited expression explicitly: a 46,XY sibling
    inheriting both alleles is at risk of hearing loss but generally not of
    gonadal disease, and a 46,XX sibling should be offered pubertal and
    ovarian-reserve surveillance before reproductive decisions are needed.
    Preimplantation or prenatal testing is available once familial variants are
    known.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is inherited as an autosomal recessive disorder
      characterized by bilateral mild to severe childhood sensorineural hearing
      loss with variable age of onset in both sexes and ovarian dysfunction in
      females who have a 46, XX karyotype.
    explanation: >-
      Establishes the recessive inheritance and sex-limited expression that
      determine the content of counselling.

differential_diagnoses:
- name: 46,XX gonadal dysgenesis
  disease_term:
    preferred_term: 46,XX gonadal dysgenesis
    term:
      id: MONDO:0009299
      label: 46 XX gonadal dysgenesis
  description: >-
    The closest ovarian-side boundary and the most important one to draw
    correctly. Both present with hypergonadotropic ovarian failure in a 46,XX
    individual, and the dismech entry for 46,XX gonadal dysgenesis already lists
    Perrault syndrome as a differential; the two entries are deliberately kept
    separate rather than merged.
  distinguishing_features:
  - Sensorineural hearing loss is required for Perrault syndrome and is absent in isolated 46,XX gonadal dysgenesis.
  - 46,XX gonadal dysgenesis is confined to the gonad; Perrault syndrome is a multisystem mitochondrial disorder that may add ataxia, neuropathy, renal or muscular disease.
  - The numbered ovarian-dysgenesis gene series is distinct from the Perrault gene set, and NR5A1-related disease belongs with neither.
  - Male relatives are unaffected in 46,XX gonadal dysgenesis but have hearing loss in Perrault syndrome, so a deaf brother is a strong pointer to Perrault syndrome.
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is inherited as an autosomal recessive disorder
      characterized by bilateral mild to severe childhood sensorineural hearing
      loss with variable age of onset in both sexes and ovarian dysfunction in
      females who have a 46, XX karyotype.
    explanation: >-
      The obligatory bilateral hearing loss in both sexes is the discriminating
      feature against isolated 46,XX gonadal dysgenesis.
- name: Turner syndrome
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  description: >-
    The commonest cause of hypergonadotropic ovarian failure and a genuine
    mimic, because a majority of adults with Turner syndrome also develop
    progressive high-tone sensorineural hearing loss, reproducing both cardinal
    Perrault features in one individual.
  distinguishing_features:
  - Karyotype is 45,X or a structural X abnormality, not 46,XX; karyotype or chromosomal microarray settles the distinction.
  - Short stature, lymphoedema, webbed neck, coarctation and bicuspid aortic valve are Turner features not seen in Perrault syndrome.
  - Turner syndrome is a chromosomal disorder and is generally sporadic; Perrault syndrome is autosomal recessive with a 25 per cent sibling recurrence risk.
  - Male relatives cannot be affected in Turner syndrome, whereas Perrault syndrome affects 46,XY relatives with hearing loss.
  evidence:
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is a genetically and clinically diverse autosomal
      recessive disorder characterized by sensorineural hearing loss in both
      sexes and primary ovarian insufficiency in females.
    explanation: >-
      Establishes the autosomal recessive, both-sexes character that separates
      Perrault syndrome from a sex-chromosome aneuploidy.
- name: FMR1 premutation-associated primary ovarian insufficiency
  disease_term:
    preferred_term: premature ovarian failure 1
    term:
      id: MONDO:0010706
      label: premature ovarian failure 1
  description: >-
    The commonest single-gene cause of premature ovarian insufficiency and a
    mandatory exclusion in any woman presenting with it, including one being
    evaluated for Perrault syndrome.
  distinguishing_features:
  - Caused by an FMR1 CGG repeat premutation, detected by targeted repeat sizing rather than sequencing, so a negative gene panel does not exclude it.
  - X-linked transmission with premutation carriers in the maternal line, not autosomal recessive.
  - Sensorineural hearing loss is not a feature; associated findings are fragile X-associated tremor/ataxia syndrome in older carriers and fragile X syndrome in expanded offspring.
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss and impaired fertility are common human disorders each with
      multiple genetic causes.
    explanation: >-
      Frames the central diagnostic problem — each cardinal feature is
      independently common — which is why the principal isolated causes of
      premature ovarian insufficiency such as the FMR1 premutation must be
      excluded before invoking a single recessive syndrome.
- name: Autoimmune polyendocrine syndrome type 1
  disease_term:
    preferred_term: autoimmune polyendocrine syndrome type 1
    term:
      id: MONDO:0009411
      label: autoimmune polyendocrine syndrome type 1
  description: >-
    The principal autoimmune cause of premature ovarian insufficiency, caused by
    biallelic AIRE variants. Like Perrault syndrome it is recessive and
    multisystem, so it is not excluded by inheritance pattern alone.
  distinguishing_features:
  - Chronic mucocutaneous candidiasis and hypoparathyroidism with adrenal insufficiency form the defining triad; none occurs in Perrault syndrome.
  - Ovarian failure is autoimmune, with detectable steroid-cell and 21-hydroxylase autoantibodies, rather than a primary germ-cell energetic defect.
  - Sensorineural hearing loss is not a feature.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a patient with POI, sensorineural hearing loss and
      Hashimoto's disease. The co-occurrence of POI with sensorineural hearing
      loss indicates Perrault syndrome.
    explanation: >-
      Illustrates the diagnostic trap directly: coexisting autoimmune
      endocrinopathy can suggest an autoimmune cause, yet the hearing-loss plus
      ovarian-insufficiency combination still indicated Perrault syndrome on
      molecular testing.
- name: Usher syndrome
  disease_term:
    preferred_term: Usher syndrome
    term:
      id: MONDO:0019501
      label: Usher syndrome
  description: >-
    The commonest syndromic form of recessive sensorineural hearing loss and
    therefore a routine alternative when a deaf proband is investigated,
    particularly before any ovarian phenotype has declared itself.
  distinguishing_features:
  - Progressive retinitis pigmentosa with night blindness and visual field loss is the defining second feature; retinal disease is not part of Perrault syndrome.
  - Vestibular areflexia is characteristic of Usher type 1 and is not a Perrault feature.
  - Gonadal function is normal in Usher syndrome, so ovarian assessment discriminates once a 46,XX proband reaches puberty.
  evidence:
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the families reported here a diagnosis of SNHL revealed variants in a
      Perrault syndrome related gene, which would not have been suspected based
      on clinical presentation alone.
    explanation: >-
      Shows that Perrault genotypes are found among probands ascertained purely
      as hearing loss, the population in which syndromic deafness alternatives
      such as Usher syndrome are the working differential.
- name: D-bifunctional protein deficiency
  disease_term:
    preferred_term: d-bifunctional protein deficiency
    term:
      id: MONDO:0009855
      label: d-bifunctional protein deficiency
  description: >-
    An allelic disorder rather than an unrelated mimic: severe biallelic
    HSD17B4 variants cause D-bifunctional protein deficiency while hypomorphic
    variants in the same gene cause Perrault syndrome. Curated as a separate
    dismech entry; the relationship is one of allelic severity, not of
    coincidental resemblance.
  distinguishing_features:
  - Neonatal hypotonia, intractable seizures and failure to thrive with death usually within the first two years, versus a chronic disorder compatible with normal lifespan.
  - Elevated very-long-chain fatty acids are consistently abnormal in D-bifunctional protein deficiency and may be normal or only mildly abnormal in HSD17B4 Perrault syndrome.
  - No female with D-bifunctional protein deficiency has survived past puberty, so the ovarian phenotype cannot be assessed in that disorder.
  evidence:
  - reference: PMID:20673864
    reference_title: "Mutations in the DBP-deficiency protein HSD17B4 cause ovarian dysgenesis, hearing loss, and ataxia of Perrault Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in HSD17B4 are known to cause DBP deficiency, an
      autosomal-recessive disorder of peroxisomal fatty acid beta-oxidation that
      is generally fatal within the first two years of life. No females with DBP
      deficiency surviving past puberty have been reported, and ovarian
      dysgenesis has not previously been associated with this illness.
    explanation: >-
      Documents both the allelic relationship and the clinical features that
      separate the two HSD17B4 phenotypes.
- name: Autosomal dominant progressive external ophthalmoplegia type 3
  disease_term:
    preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 3
    term:
      id: MONDO:0012241
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 3
  description: >-
    The TWNK allelic boundary, and the most important nosological trap in this
    entry. The same gene that causes Perrault syndrome 5 when biallelic
    hypomorphic variants are present also causes autosomal DOMINANT progressive
    external ophthalmoplegia type 3, and, with a different set of recessive
    variants, mitochondrial DNA depletion syndrome 7. These are separate
    disorders and their literature must not be imported into the Perrault entry.
  distinguishing_features:
  - Inheritance is autosomal DOMINANT with a single heterozygous missense variant; Perrault syndrome 5 requires two variants in trans.
  - Ptosis and progressive ophthalmoparesis are the presenting features; ophthalmoplegia is not a cardinal Perrault feature.
  - Ovarian insufficiency in a 46,XX individual, the defining sex-limited Perrault feature, is not part of the PEOA3 phenotype.
  - The third TWNK phenotype, mitochondrial DNA depletion syndrome 7, presents as infantile-onset spinocerebellar ataxia with epilepsy rather than as hearing loss with ovarian insufficiency.
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twinkle is known also to harbor multiple mutations, nearly all missenses,
      leading to dominant progressive external ophthalmoplegia type 3 and to
      recessive mitochondrial DNA depletion syndrome 7, also known as
      infantile-onset spinocerebellar ataxia.
    explanation: >-
      Explicitly separates the dominant PEO and mtDNA-depletion phenotypes from
      the recessive Perrault presentation of the same gene.


name: Perrault Syndrome
creation_date: "2026-08-01T05:20:00Z"
category: Mendelian
disease_term:
  preferred_term: Perrault syndrome
  term:
    id: MONDO:0017312
    label: Perrault syndrome
synonyms:
- Perrault syndrome
- XX gonodal dysgenesis-deafness syndrome
- gonadal dysgenesis, XX type, with deafness
- ovarian dysgenesis-sensorineural deafness syndrome
- PRLTS
classifications:
  mechanistic_category:
  - classification_value: mitochondrial disease
description: >-
  Perrault syndrome is a rare, genetically heterogeneous autosomal recessive
  disorder defined by the co-occurrence of bilateral sensorineural hearing loss,
  which affects individuals of both sexes, with ovarian dysfunction that is
  expressed only in individuals who have a 46,XX karyotype. The gonadal
  phenotype ranges from complete ovarian dysgenesis with streak gonads and
  primary amenorrhoea to premature ovarian insufficiency presenting as secondary
  amenorrhoea after apparently normal puberty; in every case it is
  hypergonadotropic. Individuals with a 46,XY karyotype who carry the same
  biallelic genotype have hearing loss with generally preserved gonadal
  function, so the syndromic diagnosis is systematically missed in males and in
  prepubertal girls, who may instead be labelled as having nonsyndromic
  deafness. The disorder is caused by biallelic variants in nuclear genes of
  mitochondrial gene expression and proteostasis — mitochondrial aminoacyl-tRNA
  synthetases (HARS2, LARS2), mitoribosome assembly and components (ERAL1, DAP3,
  MRPS7), mitochondrial tRNA processing (PRORP), mtDNA maintenance (TWNK, TFAM),
  mitochondrial translation support (RMND1) and matrix proteolysis (CLPP) — plus
  two metabolic exceptions, peroxisomal beta-oxidation (HSD17B4, PEX6) and
  isoprenoid biosynthesis (GGPS1). A neurological form, historically termed type
  II, adds progressive ataxia, peripheral neuropathy, developmental delay and
  intellectual disability to the cardinal features present in the isolated type
  I form. Known genes account for only about half of clinically diagnosed
  individuals.
notes: >-
  Nosological scope. This entry models the recessive Perrault phenotype only.
  TWNK (formerly C10orf2) is pleiotropic: dominant missense variants in the same
  gene cause autosomal dominant progressive external ophthalmoplegia type 3
  (PEOA3), and a distinct set of recessive variants causes mitochondrial DNA
  depletion syndrome 7 (infantile-onset spinocerebellar ataxia). Neither of
  those phenotypes is imported here; only the biallelic Perrault presentation is
  curated, and the distinction is documented in the PRLTS5 subtype, the TWNK
  genetic entry and an explicit differential. Similarly, HSD17B4 and PEX6 are
  allelic with severe D-bifunctional protein deficiency and Zellweger-spectrum
  peroxisome biogenesis disorder respectively; those entries are curated
  separately (D-Bifunctional_Protein_Deficiency, Peroxisome_Biogenesis_Disorder)
  and are handled here as differentials and allelic notes rather than
  duplicated. The boundary with 46_XX_Gonadal_Dysgenesis is reciprocal: that
  entry lists Perrault syndrome as a differential and explicitly declines to
  import hearing phenotypes, and this entry correspondingly lists 46,XX gonadal
  dysgenesis as a differential rather than re-curating the numbered ODG series.

  Independently verified gene-to-subtype mapping (OAK against MONDO, August
  2026): PRLTS1 = HSD17B4 (MONDO:0009300, OMIM 233400); PRLTS2 = HARS2
  (MONDO:0013972, OMIM 614926); PRLTS3 = CLPP (MONDO:0013588, OMIM 614129);
  PRLTS4 = LARS2 (MONDO:0014126, OMIM 615300); PRLTS5 = TWNK (MONDO:0014504,
  OMIM 616138); PRLTS6 = ERAL1 (MONDO:0033047, OMIM 617565); PRLTS7 = DAP3
  (MONDO:0976232, OMIM 621101). Note in particular that CLPP is PRLTS3 and LARS2
  is PRLTS4, not the reverse. PRORP, RMND1, GGPS1, MRPS7, PEX6, TFAM, MRPL49 and
  MRPL50 are established or supported Perrault genes that carry no numbered
  PRLTS designation and are therefore modelled as genetic entries without a
  subtype link.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  penetrance: UNKNOWN
  description: >-
    All established Perrault syndrome genes act recessively; affected
    individuals carry two pathogenic alleles, most often as compound
    heterozygotes or, in consanguineous families, as homozygotes. Biallelic
    complete loss of function has not been observed for the mitochondrial
    translation genes, consistent with those genes being essential, so genotypes
    combine hypomorphic alleles with each other or with a null allele.
    Expressivity is markedly variable between and within families: hearing-loss
    severity, age of onset, degree of ovarian failure and the presence of
    neurological features differ even among siblings sharing a genotype. Sex
    modifies expression but not transmission: hearing loss occurs in both sexes,
    whereas the ovarian phenotype is confined to 46,XX individuals.
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is inherited as an autosomal recessive disorder
      characterized by bilateral mild to severe childhood sensorineural hearing
      loss with variable age of onset in both sexes and ovarian dysfunction in
      females who have a 46, XX karyotype.
    explanation: >-
      States the autosomal recessive mode of inheritance and the sex-limited
      expression of the ovarian component in one sentence.
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This lack of biallelic loss-of-function variants likely indicates that
      HARS2, along with the other Perrault syndrome associated genes, is
      essential and that complete loss-of-function would result in lethality.
    explanation: >-
      Supports the constraint that surviving genotypes retain partial function,
      explaining why hypomorphic alleles dominate the mutational spectrum.

has_subtypes:
- name: PRLTS1
  display_name: Perrault syndrome 1 (HSD17B4)
  description: >-
    Perrault syndrome caused by biallelic HSD17B4 variants. HSD17B4 encodes
    17-beta-hydroxysteroid dehydrogenase type 4, also called D-bifunctional
    protein, a peroxisomal enzyme of fatty acid beta-oxidation. This was the
    first Perrault syndrome gene identified and is the principal peroxisomal
    exception among predominantly mitochondrial causes. Hypomorphic alleles give
    the Perrault phenotype whereas severe alleles give D-bifunctional protein
    deficiency, an allelic disorder curated separately; neurological features are
    characteristic of the HSD17B4 Perrault presentations reported to date.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0009300
        label: Perrault syndrome 1
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO defines Perrault syndrome 1 as Perrault syndrome caused by
        mutation in HSD17B4 (verified with OAK).
  genes:
  - preferred_term: HSD17B4
    term:
      id: hgnc:5213
      label: HSD17B4
  evidence:
  - reference: PMID:20673864
    reference_title: "Mutations in the DBP-deficiency protein HSD17B4 cause ovarian dysgenesis, hearing loss, and ataxia of Perrault Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of genomic DNA from one of these sisters revealed
      exactly one gene with two rare functional variants: HSD17B4, which encodes
      17beta-hydroxysteroid dehydrogenase type 4 (HSD17B4), also known as
      D-bifunctional protein (DBP).
    explanation: Identifies HSD17B4 as the first Perrault syndrome gene.
- name: PRLTS2
  display_name: Perrault syndrome 2 (HARS2)
  description: >-
    Perrault syndrome caused by biallelic HARS2 variants. HARS2 encodes
    mitochondrial histidyl-tRNA synthetase, which charges mitochondrial
    tRNA-His. Hearing loss is often prelingual and progressive and can be the
    only manifestation in affected males and prepubertal girls, so HARS2
    genotypes are a recognised cause of apparently nonsyndromic deafness.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0013972
        label: Perrault syndrome 2
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO defines Perrault syndrome 2 as Perrault syndrome caused by
        mutation in HARS2 (verified with OAK).
  genes:
  - preferred_term: HARS2
    term:
      id: hgnc:4817
      label: HARS2
  evidence:
  - reference: PMID:21464306
    reference_title: "Mutations in mitochondrial histidyl tRNA synthetase HARS2 cause ovarian dysgenesis and sensorineural hearing loss of Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a nonconsanguineous family with five affected siblings, linkage
      analysis and genomic sequencing revealed the genetic basis of Perrault
      syndrome to be compound heterozygosity for mutations in the mitochondrial
      histidyl tRNA synthetase HARS2 at two highly conserved amino acids, L200V
      and V368L.
    explanation: Establishes HARS2 as a Perrault syndrome gene.
- name: PRLTS3
  display_name: Perrault syndrome 3 (CLPP)
  description: >-
    Perrault syndrome caused by biallelic CLPP variants. CLPP encodes the
    proteolytic subunit of the mitochondrial ATP-dependent CLPXP chambered
    protease, part of the mitochondrial unfolded protein response. Growth
    restriction, epilepsy and other neurological features are frequently
    reported, and CLPP is the gene for which male reproductive involvement is
    best supported by model-organism data.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0013588
        label: Perrault syndrome 3
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO defines Perrault syndrome 3 as Perrault syndrome caused by
        mutation in CLPP (verified with OAK).
  genes:
  - preferred_term: CLPP
    term:
      id: hgnc:2084
      label: CLPP
  evidence:
  - reference: PMID:23541340
    reference_title: "Perrault syndrome is caused by recessive mutations in CLPP, encoding a mitochondrial ATP-dependent chambered protease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By a combination of linkage analysis, homozygosity mapping, and exome
      sequencing in three families, we identified mutations in CLPP as the
      likely cause of this phenotype.
    explanation: Establishes CLPP as a Perrault syndrome gene.
- name: PRLTS4
  display_name: Perrault syndrome 4 (LARS2)
  description: >-
    Perrault syndrome caused by biallelic LARS2 variants. LARS2 encodes
    mitochondrial leucyl-tRNA synthetase. LARS2 is the single most frequent
    cause in molecularly solved cohorts and has the broadest allelic spectrum,
    extending from isolated hearing loss with ovarian insufficiency to
    leukodystrophy and lethal infantile multisystem disease.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0014126
        label: Perrault syndrome 4
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO

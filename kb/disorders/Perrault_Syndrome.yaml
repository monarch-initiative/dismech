  evidence:
  - reference: PMID:39371131
    reference_title: "Biallelic variants in DAP3 result in reduced assembly of the mitoribosomal small subunit with altered intrinsic and extrinsic apoptosis and a Perrault syndrome-spectrum phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe five unrelated individuals with biallelic variants in
      the DAP3 nuclear gene encoding mitoribosomal small subunit 29 (MRPS29)
    explanation: Establishes DAP3 as a Perrault syndrome gene.
- name: Type I
  display_name: Type I (isolated Perrault syndrome)
  description: >-
    The isolated clinical form: sensorineural hearing loss plus ovarian
    dysfunction in 46,XX individuals, without significant neurological disease.
    This is a descriptive clinical split, not a molecular one — the same gene can
    give type I in one individual and type II in another, and the boundary is
    increasingly blurred by multisystem presentations.
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the initial clinical description of Perrault syndrome 70 years ago,
      the phenotype of some subjects may additionally involve developmental
      delay, intellectual deficit and other neurological disabilities, which can
      vary in severity in part dependent upon the genetic variants and the gene
      involved.
    explanation: >-
      Establishes that neurological involvement is present in only a subset,
      which is the basis for separating the isolated form from the neurological
      form.
- name: Type II
  display_name: Type II (Perrault syndrome with neurological features)
  description: >-
    The neurological clinical form: the cardinal hearing and ovarian features
    plus progressive cerebellar ataxia, peripheral axonal neuropathy,
    hyporeflexia, abnormal eye movements, developmental delay, intellectual
    disability and, in some individuals, cerebral white-matter abnormality or
    leukodystrophy. TWNK and HSD17B4 genotypes are almost always type II;
    severe LARS2 alleles can add leukodystrophy.
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the genetic cause in 2 families of progressive ataxia, axonal
      neuropathy, hyporeflexia, and abnormal eye movements, accompanied by
      progressive hearing loss and ovarian dysgenesis, with a clinical diagnosis
      of Perrault syndrome.
    explanation: >-
      Enumerates the neurological features that define the type II clinical
      form alongside the cardinal features.

pathophysiology:
- name: Biallelic Loss of Mitochondrial Gene-Expression and Proteostasis Factors
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is inheritance of two hypomorphic alleles, or one
    hypomorphic plus one null allele, in a nuclear gene whose product supports
    mitochondrial gene expression or protein quality control. Because these
    genes are essential, complete biallelic loss of function has not been
    observed in surviving individuals; residual activity determines whether the
    phenotype is organ-selective Perrault syndrome or a severe infantile
    multisystem mitochondrial disease. Fifteen genes have now been implicated,
    converging on a small number of mitochondrial processes plus two metabolic
    exceptions.
  genes:
  - preferred_term: LARS2
    term:
      id: hgnc:17095
      label: LARS2
  - preferred_term: HARS2
    term:
      id: hgnc:4817
      label: HARS2
  - preferred_term: CLPP
    term:
      id: hgnc:2084
      label: CLPP
  - preferred_term: TWNK
    term:
      id: hgnc:1160
      label: TWNK
  - preferred_term: HSD17B4
    term:
      id: hgnc:5213
      label: HSD17B4
  - preferred_term: ERAL1
    term:
      id: hgnc:3424
      label: ERAL1
  - preferred_term: DAP3
    term:
      id: hgnc:2673
      label: DAP3
  - preferred_term: PRORP
    term:
      id: hgnc:19958
      label: PRORP
  - preferred_term: RMND1
    term:
      id: hgnc:21176
      label: RMND1
  - preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  - preferred_term: MRPS7
    term:
      id: hgnc:14499
      label: MRPS7
  - preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  evidence:
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      highlighting mutations in fifteen principal genes: HSD17B4, HARS2, CLPP,
      LARS2, TWNK, ERAL1, RMND1, DAP3, PRORP, MRPL50, MRPL49, MRPS7, PEX6,
      GGPS1, and TFAM. Each of these genes plays a critical role either in
      mitochondrial function or peroxisomal processes, central to cellular
      energy metabolism and biosynthesis pathways.
    explanation: >-
      Enumerates the causal gene set and states that all converge on
      mitochondrial or peroxisomal function.
  downstream:
  - target: Impaired Mitochondrial Translation and RNA Maturation
    description: >-
      Loss of aminoacyl-tRNA synthetase, mitoribosome-assembly, tRNA-processing
      or translation-support function directly reduces mitochondrial protein
      synthesis.
    causal_link_type: DIRECT
  - target: Mitochondrial Matrix Proteostasis Failure
    description: >-
      Loss of the CLPP proteolytic subunit removes the degradative arm of
      mitochondrial protein quality control.
    causal_link_type: DIRECT
  - target: Mitochondrial DNA Maintenance Failure
    description: >-
      Loss of Twinkle helicase or TFAM function impairs replication and
      packaging of the mitochondrial genome.
    causal_link_type: DIRECT
  - target: Peroxisomal Fatty Acid Beta-Oxidation Failure
    description: >-
      HSD17B4 and PEX6 lesions act through peroxisomal fatty acid beta-oxidation
      rather than through mitochondrial gene expression.
    causal_link_type: DIRECT
  - target: Isoprenoid Synthesis and Protein Prenylation Failure
    description: >-
      GGPS1 lesions act through the mevalonate/isoprenoid pathway and loss of
      protein prenylation, a mechanism distinct from both mitochondrial gene
      expression and peroxisomal beta-oxidation.
    causal_link_type: DIRECT

- name: Impaired Mitochondrial Translation and RNA Maturation
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    The dominant mechanistic axis. Mitochondrial aminoacyl-tRNA synthetases
    HARS2 and LARS2 charge mitochondrial tRNA-His and tRNA-Leu; PRORP is the
    metallonuclease subunit of mitochondrial RNase P and performs 5' end
    processing of precursor tRNAs; ERAL1, DAP3/MRPS29 and MRPS7 build the small
    mitoribosomal subunit; RMND1 tethers mitoribosomes near sites of transcript
    maturation. Reduced activity in any of these steps lowers the rate or
    fidelity of synthesis of the thirteen mtDNA-encoded oxidative
    phosphorylation subunits.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  - preferred_term: tRNA aminoacylation for mitochondrial protein translation
    term:
      id: GO:0070127
      label: tRNA aminoacylation for mitochondrial protein translation
    modifier: DECREASED
  - preferred_term: mitochondrial tRNA processing
    term:
      id: GO:0090646
      label: mitochondrial tRNA processing
    modifier: DECREASED
  - preferred_term: mitochondrial small ribosomal subunit assembly
    term:
      id: GO:0180026
      label: mitochondrial small ribosomal subunit assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:23541342
    reference_title: "Mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase, lead to premature ovarian failure and hearing loss in Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After HARS2, LARS2 is the second gene encoding mitochondrial tRNA
      synthetase to be found to harbor mutations leading to Perrault syndrome,
      further supporting a critical role for mitochondria in the maintenance of
      ovarian function and hearing.
    explanation: >-
      Establishes mitochondrial tRNA charging, and therefore mitochondrial
      translation, as the shared mechanism of the two synthetase subtypes.
  - reference: PMID:34715011
    reference_title: "Bi-allelic variants in the mitochondrial RNase P subunit PRORP cause mitochondrial tRNA processing defects and pleiotropic multisystem presentations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from affected individuals in two families demonstrated
      decreased steady state levels of PRORP, an accumulation of unprocessed
      mitochondrial transcripts, and decreased steady state levels of
      mitochondrial-encoded proteins, which were rescued by introduction of the
      wild-type PRORP cDNA.
    explanation: >-
      Direct patient-cell evidence that a Perrault gene defect blocks
      mitochondrial RNA maturation and lowers mitochondrial protein output, with
      rescue confirming causality.
  - reference: PMID:28449065
    reference_title: "A homozygous missense mutation in ERAL1, encoding a mitochondrial rRNA chaperone, causes Perrault syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complexome profiling of the cells showed an overall decrease in the levels
      of assembled small ribosomal subunit, indicating that the ERAL1 variant
      affects mitochondrial ribosome assembly.
    explanation: >-
      Patient-fibroblast evidence for the mitoribosome-assembly arm of the same
      translational axis.
  downstream:
  - target: Combined Oxidative Phosphorylation Deficiency and Bioenergetic Stress
    description: >-
      Reduced synthesis of mtDNA-encoded subunits limits assembly of respiratory
      chain complexes I, III, IV and V.
    causal_link_type: DIRECT

- name: Mitochondrial Matrix Proteostasis Failure
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    CLPP encodes the peptidase subunit of the CLPXP complex, the principal
    ATP-dependent protease of the mitochondrial matrix and an effector arm of
    the mitochondrial unfolded protein response. Perrault-associated
    substitutions cluster in a short region and are predicted to distort the
    barrel chamber that captures unfolded substrates. Loss of proteolysis allows
    damaged and unassembled matrix proteins to accumulate, and in Clpp-null mice
    the other Perrault proteins ERAL1, Twinkle and HARS2 themselves accumulate,
    indicating that the proteostatic and translational arms of the disease are
    mechanistically coupled rather than independent.
  biological_processes:
  - preferred_term: mitochondrial unfolded protein response
    term:
      id: GO:0034514
      label: mitochondrial unfolded protein response
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:

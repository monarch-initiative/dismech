      but the sensorineural hearing loss, increased gonadotropin levels, and
      amenorrhea occurred frequently.
    explanation: >-
      Confirms elevated gonadotropins and amenorrhoea as the recurrent endocrine
      outcome.
  downstream:
  - target: Premature Ovarian Insufficiency
    description: >-
      Loss of ovarian function before age 40 is the clinical definition of this
      outcome.
    causal_link_type: DIRECT
  - target: Hypergonadotropic Hypogonadism
    description: >-
      Loss of ovarian steroid and inhibin feedback raises pituitary
      gonadotropins.
    causal_link_type: DIRECT
  - target: Primary Amenorrhea
    description: >-
      When ovarian function was never established, menarche does not occur.
    causal_link_type: DIRECT
  - target: Secondary Amenorrhea
    description: >-
      When a reduced follicle pool is exhausted after menarche, menses cease.
    causal_link_type: DIRECT
  - target: Female Infertility
    description: >-
      Follicular depletion removes the oocytes required for conception.
    causal_link_type: DIRECT
  - target: Elevated Serum Follicle-Stimulating Hormone
    description: >-
      Release of the pituitary from ovarian negative feedback raises circulating
      FSH, the biochemical marker of the outcome.
    causal_link_type: DIRECT
  - target: Osteoporosis
    description: >-
      Prolonged oestrogen deficiency accelerates bone resorption and lowers bone
      mineral density, a preventable complication of untreated ovarian failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic hypo-oestrogenism releasing the brake on osteoclastic bone resorption

phenotypes:
- category: Auditory
  name: Bilateral Sensorineural Hearing Impairment
  description: >-
    Bilateral sensorineural hearing loss present in affected individuals of both
    sexes and required for the diagnosis. Severity ranges from profound with
    prelingual onset to moderate with early-childhood onset; middle-ear function
    is normal. Audiograms characteristically show steeply sloping high-frequency
    threshold elevation.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is a genetically and clinically diverse autosomal
      recessive disorder characterized by sensorineural hearing loss in both
      sexes and primary ovarian insufficiency in females.
    explanation: >-
      Sensorineural hearing loss is definitional and therefore present in
      essentially all affected individuals, supporting VERY_FREQUENT.
  phenotype_contexts:
  - sex: MALE
    notes: >-
      Hearing loss is fully expressed in 46,XY individuals, who typically have
      no gonadal phenotype and may therefore be classified as having
      nonsyndromic deafness.
    evidence:
    - reference: PMID:34338890
      reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Perrault syndrome is inherited as an autosomal recessive disorder
        characterized by bilateral mild to severe childhood sensorineural
        hearing loss with variable age of onset in both sexes and ovarian
        dysfunction in females who have a 46, XX karyotype.
      explanation: Confirms hearing loss occurs in both sexes.
- category: Auditory
  name: Progressive Hearing Loss
  description: >-
    Hearing thresholds frequently deteriorate over time, so a mild or moderate
    initial loss can progress to severe or profound impairment and require
    escalation from hearing aids to cochlear implantation. Serial audiometry is
    therefore recommended after diagnosis.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the variant HARS2 c.1439G>A p.(Arg480His) in three
      unrelated families with prelingual onset, bilateral symmetric progressive
      SNHL.
    explanation: Documents progressive bilateral sensorineural hearing loss.
- category: Auditory
  name: Auditory Neuropathy Pattern
  description: >-
    A retrocochlear or synaptic pattern in which otoacoustic emissions are
    preserved but auditory brainstem responses are absent, indicating a lesion
    at the inner hair cell synapse or cochlear nerve rather than at the outer
    hair cell. Documented in TWNK-related disease and detectable only if
    brainstem-response testing is performed, so it can be missed when hearing
    loss appears mild on pure-tone audiometry.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  subtype: PRLTS5
  evidence:
  - reference: PMID:39340975
    reference_title: "Detailed characterization of auditory neuropathy in perrault syndrome with TWNK variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximum speech intelligibility score was 95 % with normal otoacoustic
      emission. However, no auditory brainstem responses were observed, leading
      to the diagnosis of auditory neuropathy.
    explanation: >-
      Documents the preserved-OAE, absent-ABR auditory neuropathy pattern in
      TWNK-related Perrault syndrome.
- category: Endocrine
  name: Premature Ovarian Insufficiency
  description: >-
    Loss of ovarian function before age 40 in individuals with a 46,XX
    karyotype, presenting as primary amenorrhoea with absent spontaneous puberty
    at the severe end or as secondary amenorrhoea after normal menarche at the
    milder end. This phenotype is sex-limited: 46,XY individuals with the same
    biallelic genotype generally have normal gonadal function.
  phenotype_term:
    preferred_term: Premature ovarian insufficiency
    term:
      id: HP:0008209
      label: Premature ovarian insufficiency
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is a genetically and clinically diverse autosomal
      recessive disorder characterized by sensorineural hearing loss in both
      sexes and primary ovarian insufficiency in females.
    explanation: >-
      Primary ovarian insufficiency is definitional in 46,XX individuals,
      supporting VERY_FREQUENT within that stratum.
  phenotype_contexts:
  - sex: FEMALE
    frequency: VERY_FREQUENT
    notes: >-
      Restricted to individuals with a 46,XX karyotype; essentially universal in
      postpubertal 46,XX individuals with a Perrault genotype.
    evidence:
    - reference: PMID:34338890
      reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Perrault syndrome is inherited as an autosomal recessive disorder
        characterized by bilateral mild to severe childhood sensorineural
        hearing loss with variable age of onset in both sexes and ovarian
        dysfunction in females who have a 46, XX karyotype.
      explanation: >-
        Restricts the ovarian phenotype to the 46,XX karyotype stratum.
  - sex: MALE
    notes: >-
      Not expressed. 46,XY individuals with the same genotype have hearing loss
      with generally preserved gonadal function, which is why they present as
      apparently nonsyndromic deafness.
    evidence:
    - reference: PMID:31827252
      reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All affected individuals are either male or prepubertal and as such
        would not present with POI, a cardinal feature of Perrault syndrome.
      explanation: >-
        Confirms that male carriers of a Perrault genotype do not manifest the
        ovarian phenotype.
- category: Endocrine
  name: Hypergonadotropic Hypogonadism
  description: >-
    Elevated FSH and LH with low oestradiol in 46,XX individuals, the endocrine
    signature that distinguishes the primary ovarian defect of Perrault syndrome
    from central (hypogonadotropic) causes of amenorrhoea.
  phenotype_term:
    preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  evidence:
  - reference: PMID:32767731
    reference_title: "Perrault syndrome: Clinical report and retrospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The literature review showed that the phenotype for PRLTS4 varies widely,
      but the sensorineural hearing loss, increased gonadotropin levels, and
      amenorrhea occurred frequently.
    explanation: Documents elevated gonadotropins accompanying amenorrhoea.
- category: Endocrine
  name: Primary Amenorrhea
  description: >-
    Absence of menarche with absent or incomplete spontaneous pubertal
    development, seen at the severe end of the ovarian spectrum where germ cell
    loss is near-complete and the gonads are streak or absent.
  phenotype_term:
    preferred_term: Primary amenorrhea
    term:
      id: HP:0000786
      label: Primary amenorrhea
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evaluation for primary amenorrhea and delayed pubertal development at the
      age of 18 revealed gonadal dysgenesis with a normal female karyotype
      46,XX.
    explanation: >-
      Documents primary amenorrhoea with gonadal dysgenesis and a normal 46,XX
      karyotype in a genetically confirmed individual.
- category: Endocrine
  name: Secondary Amenorrhea
  description: >-
    Cessation of menses after apparently normal menarche and pubertal
    development, the presentation at the milder end of the ovarian spectrum
    where a reduced but functional follicle pool is exhausted prematurely.
  phenotype_term:
    preferred_term: Secondary amenorrhea
    term:
      id: HP:0000869
      label: Secondary amenorrhea
  evidence:
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They have a similar phenotype of profound SNHL with onset before 3 years
      of age and secondary amenorrhea presenting at 25 and 26 years of age,
      respectively.
    explanation: >-
      Documents secondary amenorrhoea as the ovarian presentation in two
      HARS2-related individuals.
- category: Reproductive
  name: Ovarian Dysgenesis with Streak Gonads
  description: >-
    Dysplastic, streak or absent ovaries reflecting near-complete loss of germ
    and supporting cells during ovarian development, at the developmental end of
    the ovarian phenotypic spectrum.
  phenotype_term:
    preferred_term: Streak ovary
    term:
      id: HP:0010464
      label: Streak ovary
  evidence:
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian dysgenesis, with amenorrhea and streak gonads
    explanation: >-
      Records streak gonads with ovarian dysgenesis in a tabulated Perrault
      syndrome case.
- category: Reproductive
  name: Female Infertility
  description: >-
    Infertility in 46,XX individuals resulting from follicular depletion.
    Spontaneous conception is possible but unpredictable when residual ovarian
    reserve remains; oocyte or embryo cryopreservation is only feasible if
    performed before reserve is exhausted, and donor-oocyte IVF is the most
    reliable established option thereafter.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypergonadotropic hypogonadism and small ovaries and uterus were
      recognized. Infertility was diagnosed, and hormone replacement therapy was
      introduced at the age of 28.
    explanation: >-
      Documents infertility as a consequence of the ovarian phenotype in a
      genetically confirmed individual.
- category: Neurologic
  name: Cerebellar Ataxia
  description: >-
    Progressive gait and limb ataxia, a defining feature of the type II
    neurological form. Essentially universal in TWNK-related disease and
    reported in HSD17B4-, LARS2- and HARS2-related disease.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
    clinical_course: PROGRESSIVE
  subtype: Type II
  evidence:
  - reference: PMID:31827252
    reference_title: "A recurrent missense variant in HARS2 results in variable sensorineural hearing loss in three unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some cases of Perrault syndrome additional neurological features,
      including peripheral neuropathy, cerebellar ataxia, and intellectual
      disability have also been identified
    explanation: Documents cerebellar ataxia as a recognised feature.
- category: Neurologic
  name: Peripheral Axonal Neuropathy
  description: >-
    Length-dependent axonal sensorimotor neuropathy with distal weakness,
    sensory loss and hyporeflexia, contributing to gait impairment and falls in
    the type II form.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  subtype: Type II
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the genetic cause in 2 families of progressive ataxia, axonal
      neuropathy, hyporeflexia, and abnormal eye movements, accompanied by
      progressive hearing loss and ovarian dysgenesis, with a clinical diagnosis
      of Perrault syndrome.
    explanation: Documents axonal neuropathy in clinically diagnosed Perrault syndrome.
- category: Neurologic
  name: Hyporeflexia
  description: >-
    Reduced or absent deep tendon reflexes, a clinical sign of the peripheral
    axonal neuropathy of type II disease.
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
  subtype: Type II
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the genetic cause in 2 families of progressive ataxia, axonal
      neuropathy, hyporeflexia, and abnormal eye movements, accompanied by
      progressive hearing loss and ovarian dysgenesis, with a clinical diagnosis
      of Perrault syndrome.
    explanation: Documents hyporeflexia in the type II presentation.
- category: Neurologic
  name: Intellectual Disability
  description: >-
    Cognitive impairment reported in a minority of individuals, genotype
    dependent and part of the type II neurological spectrum.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  subtype: Type II
  evidence:
  - reference: PMID:34338890
    reference_title: "New insights into Perrault syndrome, a clinically and genetically heterogeneous disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype of some subjects may additionally involve developmental
      delay, intellectual deficit and other neurological disabilities, which can
      vary in severity in part dependent upon the genetic variants and the gene
      involved
    explanation: >-
      Documents intellectual deficit in a subset, with genotype-dependent
      severity.
- category: Neurologic
  name: Global Developmental Delay
  description: >-
    Delayed attainment of motor, language and cognitive milestones in
    early-onset type II disease, particularly in PRORP- and DAP3-related
    presentations.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  subtype: Type II
  evidence:
  - reference: PMID:34715011
    reference_title: "Bi-allelic variants in the mitochondrial RNase P subunit PRORP cause mitochondrial tRNA processing defects and pleiotropic multisystem presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals presented with variable phenotypes comprising
      sensorineural hearing loss, primary ovarian insufficiency, developmental
      delay, and brain white matter changes.
    explanation: Documents developmental delay in PRORP-related Perrault syndrome.
- category: Neurologic
  name: Cerebral White Matter Abnormality
  description: >-
    Abnormal cerebral white matter signal on MRI, ranging from limited
    white-matter change to frank leukodystrophy in severe LARS2- and
    PRORP-related disease.
  phenotype_term:
    preferred_term: Abnormal cerebral white matter morphology
    term:
      id: HP:0002500
      label: Abnormal cerebral white matter morphology
  subtype: Type II
  evidence:
  - reference: PMID:34715011
    reference_title: "Bi-allelic variants in the mitochondrial RNase P subunit PRORP cause mitochondrial tRNA processing defects and pleiotropic multisystem presentations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals presented with variable phenotypes comprising
      sensorineural hearing loss, primary ovarian insufficiency, developmental
      delay, and brain white matter changes.
    explanation: Documents brain white matter changes as part of the phenotype.
- category: Musculoskeletal
  name: Osteoporosis
  description: >-
    Reduced bone mineral density secondary to prolonged hypo-oestrogenism in
    46,XX individuals with untreated or late-treated ovarian insufficiency. It
    is a preventable complication rather than a primary manifestation, which is
    the rationale for oestrogen replacement continued to the usual age of
    menopause and for periodic bone-density surveillance.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin B12 deficiency anemia and osteoporosis were diagnosed at the age
      of 26.
    explanation: >-
      Documents early-onset osteoporosis in a genetically confirmed individual
      with Perrault syndrome and ovarian insufficiency.
- category: Neurologic
  name: Abnormal Eye Movements
  description: >-
    Abnormal eye movements reported together with ataxia, axonal neuropathy and
    hyporeflexia in the type II neurological form, reflecting cerebellar and
    brainstem oculomotor involvement. Note that this is distinct from the
    ophthalmoparesis of the allelic dominant TWNK disorder PEOA3, which is not
    part of Perrault syndrome.
  phenotype_term:
    preferred_term: Abnormality of eye movement
    term:
      id: HP:0000496
      label: Abnormality of eye movement
  subtype: Type II
  evidence:
  - reference: PMID:25355836
    reference_title: "Mutations in Twinkle primase-helicase cause Perrault syndrome with neurologic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the genetic cause in 2 families of progressive ataxia, axonal
      neuropathy, hyporeflexia, and abnormal eye movements, accompanied by
      progressive hearing loss and ovarian dysgenesis, with a clinical diagnosis
      of Perrault syndrome.
    explanation: >-
      Lists abnormal eye movements among the neurological features of
      clinically diagnosed Perrault syndrome.
- category: Renal
  name: Chronic Kidney Disease
  description: >-
    Chronic kidney disease reported specifically in RMND1-related Perrault
    syndrome, where it accompanies hearing loss and ovarian dysfunction and
    represents a milder, organ-shifted expression of the RMND1 spectrum than
    classic combined oxidative phosphorylation deficiency 11.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
  evidence:
  - reference: PMID:32911714
    reference_title: "Two Novel Pathogenic Variants Confirm RMND1 Causative Role in Perrault Syndrome with Renal Involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a thorough clinical investigation and applied a targeted
      multigene hearing loss panel to reveal the cause of hearing loss, ovarian
      dysfunction (two cardinal features of Perrault syndrome) and chronic
      kidney disease in two adult female siblings.
    explanation: >-
      Documents chronic kidney disease alongside the cardinal features in
      RMND1-related disease.
- category: Musculoskeletal
  name: Proximal Muscle Weakness
  description: >-
    Proximal weakness with dystrophic muscle histology, characteristic of
    GGPS1-related disease, which presents as a muscular dystrophy combined with
    congenital hearing loss and ovarian insufficiency.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:32403198
    reference_title: "GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to proximal weakness, all but one patient presented with
      congenital sensorineural hearing loss, and all postpubertal females had
      primary ovarian insufficiency.
    explanation: >-
      Documents proximal weakness together with the cardinal Perrault features
      in the GGPS1 cohort.
- category: Reproductive
  name: Male Infertility
  description: >-
    Male reproductive impairment, including azoospermia and undervirilisation,
    is occasionally reported and is under-ascertained because affected 46,XY
    individuals are rarely investigated for it. Model-organism data are
    strongest for CLPP, where null mice show meiotic arrest and azoospermia. In
    contrast to the female phenotype, most 46,XY individuals with a Perrault
    genotype are fertile.
  phenotype_term:
    preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  notes: >-
    Male infertility is a real but genotype-restricted and uncommon finding.
    A human CLPP case documents non-obstructive azoospermia, while CLPP-null
    mouse data provide mechanistic evidence for meiotic arrest. Do not
    generalise male infertility to Perrault syndrome as a whole.
  evidence:
  - reference: PMID:36611846
    reference_title: "CLPP Depletion Causes Diplotene Arrest; Underlying Testis Mitochondrial Dysfunction Occurs with Accumulation of Perrault Proteins ERAL1, PEO1, and HARS2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-obstructive azoospermia (NOS, the complete absence of sperm from the
      ejaculate, due to a failure in spermatogenesis, leading to complete
      infertility) was observed so far in one of the few male individuals with
      a biallelic missense mutation in the gene encoding the mitochondrial
      matrix peptidase CLPP
    explanation: >-
      Documents a human CLPP-associated case of non-obstructive azoospermia,
      establishing direct clinical support while preserving its rarity and
      genotype restriction.
  - reference: PMID:36611846
    reference_title: "CLPP Depletion Causes Diplotene Arrest; Underlying Testis Mitochondrial Dysfunction Occurs with Accumulation of Perrault Proteins ERAL1, PEO1, and HARS2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No meiotic M-phase cells were detected. Proteome profiles identified
      strong deficits of proteins involved in male meiotic prophase (HSPA2,
      SHCBP1L, DMRT7, and HSF5), versus an accumulation of AURKAIP1.
    explanation: >-
      Documents late meiotic arrest in CLPP-null mouse testis, providing
      mechanistic model evidence for the genotype-restricted male infertility
      phenotype.

biochemical:
- name: Elevated Serum Follicle-Stimulating Hormone
  biomarker_term:
    preferred_term: Elevated circulating follicle stimulating hormone level
    term:
      id: HP:0008232
      label: Elevated circulating follicle stimulating hormone level
  presence: INCREASED
  notes: >-
    Raised serum FSH in 46,XX individuals is the biochemical hallmark of the
    primary ovarian defect and is what makes the hypogonadism
    hypergonadotropic. Repeated measurement of FSH with oestradiol, supported by
    anti-Mullerian hormone and antral follicle count, is the standard means of
    establishing premature ovarian insufficiency.
  evidence:
  - reference: PMID:36421788
    reference_title: "Integral Role of the Mitochondrial Ribosome in Supporting Ovarian Function: MRPS7 Variants in Syndromic Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      POI is a common cause of infertility, characterised by elevated
      follicle-stimulating hormone and amenorrhea in women under the age of 40.
    explanation: >-
      Defines elevated FSH with amenorrhoea as the diagnostic biochemical
      criterion for the ovarian phenotype.

genetic:
- name: LARS2
  gene_term:
    preferred_term: LARS2
    term:
      id: hgnc:17095
      label: LARS2
  relationship_type: CAUSATIVE
  subtype: PRLTS4
  notes: >-
    Mitochondrial leucyl-tRNA synthetase. The most frequent single cause in
    molecularly solved Perrault cohorts. Pathogenic variants reduce
    aminoacylation efficiency; severity tracks residual activity, with the
    mildest alleles giving isolated hearing loss and ovarian insufficiency and
    the most severe giving leukodystrophy or lethal infantile multisystem
    disease.
  case_fractions:
  - population: Molecularly diagnosed Perrault syndrome (GeneReviews overview cohort)
    case_fraction_percent: 21.0
    notes: >-
      Highest single-gene share among molecularly solved individuals in the
      GeneReviews Perrault Syndrome Overview gene table (PMID:25254289, full
      chapter). The PubMed abstract for that chapter is a scope summary and does
      not carry the table, so this figure is recorded without a
      snippet-quotable source.
  evidence:
  - reference: PMID:23541342
    reference_title: "Mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase, lead to premature ovarian failure and hearing loss in Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families affected by POF accompanied by hearing loss (together,
      these symptoms compose Perrault syndrome), exome sequencing revealed
      mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase
    explanation: Establishes LARS2 causality.
  - reference: PMID:23541342
    reference_title: "Mutations in LARS2, encoding mitochondrial leucyl-tRNA synthetase, lead to premature ovarian failure and hearing loss in Perrault syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Yeast complementation indicated that LARS2 c.1077delT is nonfunctional and
      that LARS2 p.Thr522Asn is partially functional.
    explanation: >-
      Functional evidence that pathogenic alleles are hypomorphic or null,

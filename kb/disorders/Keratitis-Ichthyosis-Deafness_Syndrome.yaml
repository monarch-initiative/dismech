- name: Aberrant Heteromeric Interaction with Cx43 and Cx30
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Why some severe KID alleles cause disease despite forming non-functional
    homomeric hemichannels. In skin Cx26 is co-expressed with Cx43 and Cx30, and
    wild-type Cx26 and Cx43 are normally oligomerisation-incompatible. The
    syndromic N-terminal mutations change that compatibility: they oligomerise
    with Cx43 into heteromeric channels that show exacerbated hemichannel activity
    but non-functional gap-junction channels, giving a combined gain of leak and
    dominant-negative loss of coupling. This resolves the S17F paradox, whose
    homomeric hemichannels are silent yet whose disease is severe. Graded
    PROVISIONAL because the demonstrations are in HeLa cells and Xenopus oocytes
    at experimenter-set expression ratios, and one patient-keratinocyte study did
    not reproduce Cx26/Cx43 co-localisation.

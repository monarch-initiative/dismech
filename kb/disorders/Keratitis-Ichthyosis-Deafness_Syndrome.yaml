pathophysiology:
- name: Heterozygous Gain-of-Function GJB2 Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. A single GJB2 allele carries a missense change that
    substitutes a conserved residue in the cytoplasmic N-terminus or first
    extracellular loop of connexin 26 - the domains controlling channel gating
    and permeability. Unlike the recessive loss-of-function alleles at this locus,
    which give nonsyndromic deafness only, these alleles produce a channel that
    is still made and delivered but behaves aberrantly. p.D50N is by far the most
    common; p.S17F and p.G12R are recurrent; p.G45E and p.A88V cause a lethal
    neonatal form.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  genetic_context:
    genes:
    - preferred_term: GJB2
      term:
        id: hgnc:4284
        label: GJB2
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
    notes: >-
      Recorded as GAIN_OF_FUNCTION at the variant level: the mutant subunit adds a
      pathological activity (aberrant hemichannel opening) rather than merely
      failing, which is what distinguishes syndromic KID alleles from the recessive
      nonsyndromic null alleles at the same locus. Several alleles additionally
      exert a dominant-negative effect on co-expressed connexins (see downstream
      nodes), so a single category cannot capture every allele's full behaviour.
  evidence:
  - reference: PMID:11912510
    reference_title: Missense mutations in GJB2 encoding connexin-26 cause the ectodermal dysplasia keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each of 10 patients with KID, we identified a point mutation leading to
      substitution of conserved residues in the cytoplasmic amino terminus or first
      extracellular domain of Cx26.
    explanation: >-
      Localises the causal missense variants to the N-terminal and E1 gating
      domains of connexin 26.
  - reference: PMID:19939300
    reference_title: Connexin-26 mutations in deafness and skin disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Since nonsyndromic deafness is predominantly a loss-of-function disorder, it
      follows that the syndromic mutants must show an alteration, or gain, of
      function to cause skin disease.
    explanation: >-
      States the loss-of-function-versus-gain-of-function logic that classifies KID
      alleles as gain-of-function. INDIRECT because it is a review's inference from
      the genotype-phenotype pattern rather than a direct assay of one allele.
  downstream:
  - target: Hyperactive Connexin 26 Hemichannels
    causal_link_type: DIRECT
    description: >-
      The mutant subunit assembles into hemichannels whose gating is deranged.
- name: Hyperactive Connexin 26 Hemichannels
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Connexins oligomerise into hexameric hemichannels (connexons); in
    non-junctional membrane an undocked hemichannel connects the cytoplasm to the
    extracellular space. Syndromic Cx26 mutants form hemichannels that open when
    they should be closed. The two best-characterised aberrations are loss of the
    normal restraint by extracellular calcium (the channels stay open at
    physiological Ca2+, as for A40V and D50N) and, for some alleles, a channel
    that is itself directly permeable to calcium (G45E). The result is an
    inappropriate conductance across the plasma membrane that has been measured as
    increased whole-cell hemichannel current for D50N, D50A, A88V, G12R, G45E and
    A40V, and which accelerates cell death in low extracellular calcium.
  molecular_functions:
  - preferred_term: gap junction hemichannel activity
    term:
      id: GO:0055077
      label: gap junction hemi-channel activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:23797419
    reference_title: "The D50N mutation and syndromic deafness: altered Cx26 hemichannel properties caused by effects on the pore and intersubunit interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      D50N, the most frequent mutation associated with KID syndrome, produces
      multiple aberrant hemichannel properties, including loss of inhibition by
      extracellular Ca(2+), decreased unitary conductance, increased open
      hemichannel current rectification and voltage-shifted activation.
    explanation: >-
      Documents the aberrant hemichannel behaviour of the commonest KID allele,
      including loss of extracellular-calcium inhibition.
  - reference: PMID:23447037
    reference_title: The human Cx26-D50A and Cx26-A88V mutations causing keratitis-ichthyosis-deafness syndrome display increased hemichannel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      both Cx26-D50A and Cx26-A88V form active hemichannels that significantly
      increase membrane current flow compared with wild-type Cx26
    explanation: >-
      Directly measures increased hemichannel current for two KID alleles across
      three expression systems.
  - reference: PMID:23447037
    reference_title: The human Cx26-D50A and Cx26-A88V mutations causing keratitis-ichthyosis-deafness syndrome display increased hemichannel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      support the hypothesis that increased hemichannel activity is a common
      feature of human Cx26 mutations responsible for KID syndrome
    explanation: >-
      States that hyperactive hemichannels are a shared property across KID alleles.
  - reference: PMID:20584891
    reference_title: Differentially altered Ca2+ regulation and Ca2+ permeability in Cx26 hemichannels formed by the A40V and G45E mutations that cause keratitis ichthyosis deafness syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A40V produces leaky hemichannels, whereas G45E provides a route for excessive
      entry of Ca(2+).
    explanation: >-
      Distinguishes the two aberrant hemichannel mechanisms - loss of gating versus
      direct calcium permeability - among KID alleles.

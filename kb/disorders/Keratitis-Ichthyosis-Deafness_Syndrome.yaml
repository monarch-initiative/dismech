notes: >-
  Lump/split decision. ONE Disease entry for autosomal dominant, connexin-related
  KID (MONDO:0007850), the syndromic gain-of-function counterpart of the
  nonsyndromic GJB2 hearing loss already curated
  (Autosomal_Dominant_Nonsyndromic_Hearing_Loss_3A, and DFNB1). Rationale: the
  mechanism is genuinely different from the nonsyndromic forms at the same locus -
  gain-of-function aberrant hemichannels versus loss-of-function - which is the
  whole reason the skin and eye phenotypes appear, so it is not a severity variant
  of the nonsyndromic entries.

  Kept inside this entry rather than split out. The lethal neonatal form (p.G45E,
  p.A88V) and the HID (hystrix-like ichthyosis-deafness) variant are curated as
  has_subtypes, not separate entries: HID was shown to carry the same GJB2 mutation
  as KID (PMID:12072059) and is the same disease, and the lethal form is an allelic
  severity extreme. GJB6 (connexin 30) is a rare alternative cause and is curated
  as a second genetic entry, not a separate disease.

  Deliberately out of scope, mentioned but not curated here. Autosomal recessive KID
  (KIDAR, AP1B1, MONDO:0859278) is a vesicular-trafficking disorder with
  copper-metabolism features - a different mechanism and a separate MONDO concept.
  The Perplexity report spent more text on AP1B1 (56 mentions) than on GJB2 (40),
  and just preflight-dr WARNed on exactly this rival-gene mixing; the AP1B1 and
  VPS33B (ARKID) material was excluded, as was VPS33B-related ARKID itself.

  Module conformance. The cochlear arm conforms to
  sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death,
  entered through supporting-cell hemichannel hyperactivity rather than the
  module's generic insult. The skin arm deliberately does NOT conform to
  epidermal_cornification_failure: that module scopes itself to primary lesions of
  the terminal cornification machinery (TGM1/FLG/ALOX/ABCA12/STS/SPINK5), whereas
  here the barrier failure is a secondary consequence of connexin-driven
  keratinocyte dysregulation.

  Deep-research provenance and its limits. A Perplexity (sonar-deep-research) report
  was used as a lead source. Its citations were sound (11/11 verified, 8 on topic)
  but term_validation.needs_review was true with 18 mislabelled CURIEs, 3 invented
  HP terms (HP:0007393, HP:0001021, HP:0002727) and 1 obsolete UBERON term - so
  every ontology term in this entry was re-selected from scratch with OAK (ols:*)
  rather than copied from the report. Notably the report's HP:0012114 "Keratitis"
  is actually Endometrial carcinoma, HP:0007470 "Erythrokeratoderma" is
  Periarticular subcutaneous nodules, and UBERON:0001442 "cornea" is skeleton of
  manus; none were used. The terms bound instead are HP:0000491 (Keratitis),
  HP:0007431 (for the erythrokeratoderma presentation) and UBERON:0001772 (corneal
  epithelium). The report also gave GJB6 as HGNC:4289; the repository's HGNC cache
  resolves GJB6 to hgnc:4288, which is what is bound here.

  Evidence base. Human data are case series and case reports, with no cohort large
  enough for most frequencies, so most phenotypes carry no frequency value; SCC is
  OCCASIONAL (~15%, PMID:23384797) and the ~86% p.D50N case share is recorded as a
  genetic case_fraction rather than a phenotype frequency. Much of the mechanism
  rests on IN_VITRO work (Xenopus oocyte, HeLa and keratinocyte hemichannel
  electrophysiology) or MODEL_ORGANISM work (the G45E and S17F mice), graded
  accordingly; the two nodes with no human measurement - the cochlear
  supporting-cell node and the heteromeric Cx43 interaction - are PROVISIONAL, and
  the model-to-human gap is filed as a HUMAN_MODEL_MISMATCH discussion rather than
  papered over. ORPHA:477 could not be cited: `just fetch-reference ORPHA:477`
  reports no source for the reference type in this checkout, and the Orphadata XML
  it would be built from is not present.

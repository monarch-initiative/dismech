- name: Loss of Gap Junction Intercellular Communication
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Whether by failure of homomeric channels to couple or by a dominant-negative
    effect on Cx43/Cx30 partners, mutant Cx26 reduces functional gap-junction
    intercellular communication in the epithelia that normally depend on it. In
    the corneal epithelium the common D50N allele accumulates intracellularly and
    fails to form gap-junction plaques even when co-expressed with wild-type Cx26
    or Cx30, consistent with a dominant-negative effect on connexon assembly.

mechanistic_hypotheses:
- hypothesis_group_id: hyperactive_hemichannel
  hypothesis_label: Homomeric hyperactive-hemichannel gain of function
  status: CANONICAL
  description: >-
    The leading and most-tested account: syndromic Cx26 mutants form homomeric
    hemichannels that open aberrantly, losing extracellular-calcium restraint
    (D50N, A40V, D50A, A88V, G12R) or becoming directly calcium-permeable (G45E),
    loading cells with calcium, leaking ATP, and driving cell death - a "leaky
    membrane" common to most KID alleles.
- hypothesis_group_id: heteromeric_connexin_interaction
  hypothesis_label: Heteromeric Cx26/Cx43(Cx30) hyperactive hemichannel
  status: EMERGING
  description: >-
    The refinement needed to explain alleles (S17F) whose homomeric hemichannels
    are silent yet whose disease is severe: the mutant acquires the ability to
    oligomerise with the normally incompatible Cx43 (and with Cx30), forming
    hyperactive heteromeric hemichannels but non-functional heteromeric
    gap-junction channels. This unifies the gain-of-leak and loss-of-coupling
    arms and may be the general mechanism for N-terminal syndromic mutations.
discussions:
- discussion_id: kid_cochlear_hemichannel_to_deafness
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does supporting-cell hemichannel hyperactivity actually cause the human
    sensorineural deafness of KID, given that the direct demonstration is in a
    mouse cochlea and Cx26 is absent from hair cells?
  attaches_to:
  - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
  - pathophysiology#Sensorineural Hair Cell Dysfunction
  rationale: >-
    The cochlear mechanism rests on a Cx26-S17F knock-in mouse showing hyperactive
    supporting-cell hemichannels and stereocilia loss, plus a single human
    temporal bone (G45E) showing neuroepithelial dysplasia. No coupling or
    hemichannel measurement exists in a human KID cochlea, and the causal step
    from a supporting-cell leak to hair cell death is inferred rather than
    measured in human tissue. It is a mismatch, not an absence of evidence: the
    mouse result is clean but is one allele in one species.
  evidence:
  - reference: PMID:16885744
    reference_title: Cochleosaccular dysplasia associated with a connexin 26 mutation in keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GJB2 mutations can cause deafness in KID syndrome, and possibly in other GJB2
      mutant phenotypes, by disrupting cochlear differentiation.
    explanation: >-
      The only human cochlear observation available, and it is a single temporal
      bone framed as a hypothesis about cochlear differentiation - which is the
      scope of the human evidence this mismatch is about. INDIRECT because it
      supports the size of the gap rather than the mouse mechanism itself.
  proposed_experiments:
  - experiment_id: kid_cochlear_supporting_cell_readout
    name: Supporting-cell hemichannel activity and hair cell survival across KID alleles
    description: >-
      Measure supporting-cell hemichannel current and hair cell survival in
      cochlear explants carrying the common human KID alleles (D50N, S17F) at
      native connexin stoichiometry, and test whether a hemichannel blocker
      preserves hair cells.
    would_support:
    - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
    supporting_outcome:
    - >-
      Hyperactive supporting-cell hemichannels and hair cell loss are reproduced by
      the common human alleles and are prevented by hemichannel blockade.
    would_refute:
    - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
    refuting_outcome:
    - >-
      Supporting-cell hemichannel activity is normal for the common alleles, so the
      deafness requires a mechanism other than the supporting-cell leak.
- discussion_id: kid_homomeric_vs_heteromeric_mechanism
  kind: CONTROVERSY
  prompt: >-
    Is the pathogenic hemichannel in KID homomeric Cx26, or does it require
    heteromeric assembly with Cx43/Cx30?
  attaches_to:
  - pathophysiology#Hyperactive Connexin 26 Hemichannels
  - pathophysiology#Aberrant Heteromeric Interaction with Cx43 and Cx30
  rationale: >-
    Most alleles form hyperactive homomeric hemichannels, which is the canonical
    account, but S17F forms non-functional homomeric hemichannels yet causes
    severe disease, and only becomes hyperactive when co-expressed with Cx43 or
    Cx30. Whether the heteromeric route is a special case for a few alleles or the
    general mechanism for all N-terminal syndromic mutations is unresolved, and it
    matters for therapy: an allele-agnostic hemichannel blocker versus an
    allele-specific silencing approach make different bets on this question.
  evidence:
  - reference: PMID:25625422
    reference_title: "Keratitis-ichthyosis-deafness syndrome-associated Cx26 mutants produce nonfunctional gap junctions but hyperactive hemichannels when co-expressed with wild type Cx43."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      some syndromic mutations, like Cx26S17F, lead to non-functional HCs, but they
      still developed a severe KID syndrome phenotype
    explanation: >-
      States the observation that the homomeric hyperactive-hemichannel account
      cannot explain, which is what makes this an open controversy rather than a
      settled mechanism.
  - reference: PMID:23447037
    reference_title: The human Cx26-D50A and Cx26-A88V mutations causing keratitis-ichthyosis-deafness syndrome display increased hemichannel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results show that these two mutations exhibit a shared gain of
      functional activity and support the hypothesis that increased hemichannel
      activity is a common feature of human Cx26 mutations responsible for KID
      syndrome.
    explanation: >-
      The other side of the controversy: the homomeric account, argued from alleles
      that do form hyperactive homomeric hemichannels.
genetic:
- name: GJB2
  gene_term:
    preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    The major cause. Heterozygous missense variants clustered in the cytoplasmic
    N-terminus and first extracellular loop of connexin 26. p.D50N is by far the
    commonest (~86% of a European cohort); p.S17F is recurrent and associated with
    a more severe skin phenotype and tongue carcinoma; p.G12R and p.A40V occur;
    p.G45E and p.A88V cause a lethal neonatal form. The same gene carries the
    recessive nonsyndromic loss-of-function alleles (DFNB1) and the dominant
    nonsyndromic form (DFNA3A), which are separate KB entries - a heterozygous GJB2
    variant is assigned to this entry only with the syndromic skin/eye phenotype.
  case_fractions:
  - population: European KID cohort (largest reported series)
    case_fraction_percent: 86.0
    notes: p.D50N share of KID cases; recorded from the AS-siRNA study citing the
      largest European cohort.
    evidence:
    - reference: PMID:31705875
      reference_title: Allele-Specific Small Interfering RNA Corrects Aberrant Cellular Phenotype in Keratitis-Ichthyosis-Deafness Syndrome Keratinocytes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most cases of KID syndrome (86%) are caused by a heterozygous missense
        mutation (c.148G>A, p.D50N) in the GJB2 gene, encoding gap junction protein
        Cx26, which alters gating properties of Cx26 channels in a dominant manner.
      explanation: >-
        Quantifies the p.D50N share of KID cases at 86%.
  evidence:
  - reference: PMID:11912510
    reference_title: Missense mutations in GJB2 encoding connexin-26 cause the ectodermal dysplasia keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we provide compelling evidence that KID is caused by heterozygous missense
      mutations in the connexin-26 gene, GJB2
    explanation: >-
      Establishes GJB2 as the causative gene for KID.
  - reference: PMID:17381453
    reference_title: "Keratitis-ichthyosis-deafness syndrome: disease expression and spectrum of connexin 26 (GJB2) mutations in 14 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients (86%) were heterozygous for the p.Asp50Asn mutation and two
      patients (14%) were heterozygous for the p.Ser17Phe mutation.
    explanation: >-
      Documents the allele spectrum, with D50N dominant and S17F the next most
      common in a 14-patient cohort.
  - reference: PMID:28158657
    reference_title: Revertant mosaicism repairs skin lesions in a patient with keratitis-ichthyosis-deafness syndrome by second-site mutations in connexin 26.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      the second-site mutations independently inhibit Cx26-Asp50Asn expression in
      gap junction channels, reverting the dominant negative effect of the
      p.Asp50Asn mutation
    explanation: >-
      Revertant mosaicism restoring healthy skin by silencing the D50N allele
      confirms the allele's dominant pathogenic effect. INDIRECT: it supports
      pathogenicity via natural reversion rather than a primary functional assay.
- name: GJB6
  gene_term:
    preferred_term: GJB6
    term:
      id: hgnc:4288
      label: GJB6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A rare alternative cause. A heterozygous GJB6 (connexin 30) missense mutation
    was found in a KID-phenotype patient with congenital atrichia who had no
    pathogenic GJB2 change, establishing genetic heterogeneity. Cx30 co-assembles
    with Cx26 in the same epithelia, which is why its mutation can phenocopy Cx26
    disease.
  evidence:
  - reference: PMID:15140211
    reference_title: "Genetic heterogeneity of KID syndrome: identification of a Cx30 gene (GJB6) mutation in a patient with KID syndrome and congenital atrichia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      screening of GJB6 revealed a heterozygous missense mutation (V37E) predicted
      to alter sequence and charge of the first transmembrane helix of Cx30
    explanation: >-
      Identifies a GJB6 (Cx30) mutation as a rare cause of a KID phenotype.
has_subtypes:
- name: Lethal Neonatal KID
  display_name: Lethal neonatal (fatal) form of KID
  description: >-
    A severe form presenting in the first year of life with overwhelming skin
    infection and septicaemia, caused by specific GJB2 alleles - p.G45E (the
    prototype) and p.A88V. These alleles form the most hyperactive hemichannels.
    Recurrence in siblings of unaffected parents has been traced to germline
    mosaicism, enabling prenatal diagnosis.
  evidence:
  - reference: PMID:15633193
    reference_title: GJB2 mutations in keratitis-ichthyosis-deafness syndrome including its fatal form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo GJB2 mutation G45E in a patient displaying the fatal
      form of the disease.
    explanation: >-
      Ties the fatal neonatal form to the de novo G45E allele.
  - reference: PMID:18024254
    reference_title: A familial case of Keratitis-Ichthyosis-Deafness (KID) syndrome with the GJB2 mutation G45E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A rare form of the KID syndrome is a fatal course in the first year of life
      due to severe skin lesion infections and septicaemia.
    explanation: >-
      Describes the lethal neonatal course and its infectious cause.
- name: HID Variant
  display_name: Hystrix-like ichthyosis-deafness (HID)
  description: >-
    Historically separated from KID by spiny (hystrix-like) verrucous
    hyperkeratosis and electron-microscopic differences, HID was shown to carry
    the same connexin 26 mutation as KID and is now regarded as the same disease.
    Curated as a subtype label rather than a separate entry.
  evidence:
  - reference: PMID:12072059
    reference_title: HID and KID syndromes are associated with the same connexin 26 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that KID and HID syndromes are identical at the molecular level and
      confirm the clinical impression that these syndromes are one and the same.
    explanation: >-
      Establishes HID and KID as molecularly identical, justifying a subtype label
      rather than a separate entry.
diagnosis:
- name: Clinical Recognition of the Triad
  description: >-
    Diagnosis begins with the clinical triad of vascularizing keratitis,
    ichthyosiform/erythrokeratodermic skin, and congenital sensorineural hearing
    loss, supported by dermatologic, ophthalmologic and audiologic examination.
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:37755702
    reference_title: Ocular phenotype and therapeutic interventions in keratitis-ichthyosis-deafness (KID) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four individuals had the characteristic systemic features of
      keratitis-ichthyosis-deafness syndrome.
    explanation: >-
      Confirms recognition rests on the characteristic systemic triad.
- name: Molecular Genetic Testing of GJB2 and GJB6
  description: >-
    Sequencing of GJB2 (and GJB6 when GJB2 is negative) confirms the diagnosis and
    the specific allele, which informs prognosis (e.g. G45E lethal form, S17F
    severity) and genetic counselling.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11912510
    reference_title: Missense mutations in GJB2 encoding connexin-26 cause the ectodermal dysplasia keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each of 10 patients with KID, we identified a point mutation
    explanation: >-
      Establishes GJB2 sequencing as the confirmatory genetic test.
differential_diagnoses:
- name: Autosomal recessive KID (KIDAR, AP1B1)
  description: >-
    A distinct autosomal recessive disorder of vesicular trafficking (AP1B1,
    MONDO:0859278) that shares ichthyosis, keratitis and deafness but adds failure
    to thrive, developmental delay and copper-metabolism abnormalities. Not
    connexin-related; a separate entity.
  distinguishing_features:
  - Autosomal recessive inheritance with biallelic AP1B1 loss-of-function variants
  - Systemic features - failure to thrive, developmental delay, low copper and ceruloplasmin
  - No connexin defect
  evidence:
  - reference: PMID:11912510
    reference_title: Missense mutations in GJB2 encoding connexin-26 cause the ectodermal dysplasia keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dominant GJB2 mutations can disturb the gap junction system of one or several
      ectodermal epithelia
    explanation: >-
      Anchors the dominant connexin mechanism of this entry, which distinguishes it
      from the recessive AP1B1 trafficking disorder. INDIRECT: it establishes this
      entry's mechanism rather than describing KIDAR directly.
- name: Nonsyndromic GJB2 hearing loss (DFNB1 / DFNA3A)
  description: >-
    Loss-of-function GJB2 alleles at the same locus cause nonsyndromic
    sensorineural deafness with no skin or eye disease. The distinction is
    mechanistic: nonsyndromic disease is loss of function, KID is gain of function.
  distinguishing_features:
  - Absence of skin and corneal disease
  - Loss-of-function alleles rather than N-terminal or first-extracellular-loop gain-of-function missense
  evidence:
  - reference: PMID:22547955
    reference_title: GJB2 Gene Mutations in Syndromic Skin Diseases with Sensorineural Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonsyndromic deafness is caused prevalently by a loss-of-function, while
      literature evidences suggest for syndromic deafness a mechanism based on
      gain-of-function.
    explanation: >-
      States the loss-of-function versus gain-of-function distinction separating
      nonsyndromic GJB2 deafness from syndromic KID.
treatments:
- name: Systemic Retinoid Therapy (Acitretin)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral acitretin improves the hyperkeratotic/ichthyotic skin, with reports of
    rapid improvement within weeks; occasional reports describe visual improvement.
    It does not correct the underlying channel defect and carries ocular and
    skeletal toxicity risks that require caution, especially in children with the
    keratitis of KID.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_phenotypes:
  - preferred_term: Ichthyosiform erythrokeratoderma
    term:
      id: HP:0007431
      label: Congenital ichthyosiform erythroderma
  evidence:
  - reference: PMID:25546246
    reference_title: "Treatment of keratitis-ichthyosis- deafness (KID) syndrome in children: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had significant improvement of the hyperkeratosis on the scalp,
      trunk, and extremities within 4 weeks after initiating treatment.
    explanation: >-
      Documents acitretin's dermatologic benefit in a child with KID.
  - reference: PMID:25546246
    reference_title: "Treatment of keratitis-ichthyosis- deafness (KID) syndrome in children: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ocular and skeletal toxicity from prolonged exposure to systemic retinoids is
      a major concern especially in children.
    explanation: >-
      Records the retinoid toxicity caution relevant to the keratitis of KID.
- name: Antimicrobial Therapy for Cutaneous Infection
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Antifungal and antibiotic therapy to control the chronic mucocutaneous
    candidiasis and bacterial superinfection that drive morbidity and, in the
    neonatal form, mortality.
  treatment_term:
    preferred_term: antifungal and antibacterial pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antifungal agent
      term:
        id: NCIT:C514
        label: Antifungal Agent
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  target_phenotypes:
  - preferred_term: Chronic mucocutaneous candidiasis
    term:
      id: HP:0002728
      label: Chronic mucocutaneous candidiasis
  evidence:
  - reference: PMID:25546246
    reference_title: "Treatment of keratitis-ichthyosis- deafness (KID) syndrome in children: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments with antibiotics, antifungals, and systemic retinoids have been
      reported with variable response.
    explanation: >-
      Supports antimicrobial management of the infectious complications of KID.
- name: Ocular Surface Stem Cell Transplantation
  therapeutic_modality: SURGERY
  description: >-
    For limbal stem cell deficiency and corneal surface failure. Ocular surface
    stem cell transplantation (limbal allograft), often followed by keratoplasty,
    can stabilize the surface; living-related conjunctival limbal allograft may
    outperform keratolimbal allograft because it is HLA/ABO-matched. Outcomes remain
    challenging.
  treatment_term:
    preferred_term: ocular surface stem cell transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  target_phenotypes:
  - preferred_term: Limbal stem cell deficiency
    term:
      id: HP:0032107
      label: Limbal stem cell deficiency
  target_mechanisms:
  - target: Corneal Epithelial Gap Junction Dysfunction
    description: >-
      Replaces the failed limbal stem cell niche to restore a stable corneal
      epithelium.
    evidence:
    - reference: PMID:30371567
      reference_title: Ocular Surface Stem Cell Transplantation for Treatment of Keratitis-Ichthyosis-Deafness Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An lr-CLAL may offer further benefit over a KLAL in these eyes because it is
        HLA- and ABO-matched tissue
      explanation: >-
        Reports the surgical approach and the HLA/ABO-matching advantage in KID
        limbal deficiency.
  evidence:
  - reference: PMID:30371567
    reference_title: Ocular Surface Stem Cell Transplantation for Treatment of Keratitis-Ichthyosis-Deafness Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although OSST can stabilize the surface, long-term treatment of KID syndrome
      can be challenging.
    explanation: >-
      Records both the benefit and the limited durability of ocular surface stem
      cell transplantation in KID.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  description: >-
    For the profound sensorineural hearing loss. Because skin debris and chronic
    otitis can render hearing aids ineffective and visual loss can preclude sign
    language, cochlear implantation is often the definitive auditory intervention;
    it is safe and effective in most patients but carries a raised rate of
    postoperative wound/infection complications requiring close monitoring. The
    implant device term (NCIT:C157820) names equipment and is not a clinical-action
    term, so the surgical action is bound and the device carried as a qualifier.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:40889428
    reference_title: "Cochlear implantation in patients with keratitis-ichthyosis-deafness syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CI in patients with KID syndrome presents distinctive challenges but is a safe
      and effective treatment option.
    explanation: >-
      Systematic-review conclusion supporting cochlear implantation in KID.
  - reference: PMID:40889428
    reference_title: "Cochlear implantation in patients with keratitis-ichthyosis-deafness syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notable complications included postoperative infection (30.8 %, n = 4)
    explanation: >-
      Quantifies the raised postoperative infection risk specific to KID implantees.
  - reference: PMID:22340753
    reference_title: "Cochlear implantation in keratitis-ichthyosis-deafness syndrome: 10-year follow-up of two patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with KID syndrome appear to be good candidates for cochlear
      implantation but may face significant skin-related problems which could
      disrupt successful post-operative habilitation.
    explanation: >-
      Long-term follow-up showing both candidacy and the skin-related risk to
      implant outcomes.
- name: Experimental Hemichannel Blockade
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A mechanism-directed experimental strategy. Because most KID alleles confer
    aberrant hemichannel opening, blocking the hemichannel is a rational target;
    mefloquine, an FDA-approved antimalarial, inhibits mutant KID hemichannels in
    Xenopus oocytes and attenuates macroscopic currents in G45E keratinocytes.
    Engineered anti-Cx26 antibodies act similarly. Preclinical only.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mefloquine
      term:
        id: CHEBI:63609
        label: mefloquine
  target_mechanisms:
  - target: Hyperactive Connexin 26 Hemichannels
    description: >-
      Directly inhibits the aberrant hemichannel that is the proximate pathogenic
      lesion.
    evidence:
    - reference: PMID:25229253
      reference_title: Aberrant connexin26 hemichannels underlying keratitis-ichthyosis-deafness syndrome are potently inhibited by mefloquine.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        mefloquine (MFQ) inhibits several mutant hemichannel forms implicated in KID
        syndrome when expressed in Xenopus laevis oocytes
      explanation: >-
        Shows mefloquine inhibits KID mutant hemichannels, the target of this
        strategy.
  evidence:
  - reference: PMID:39269388
    reference_title: Connexin Hemichannel Inhibition and Human Genodermatoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Use of pharmacological blockers and engineered mAbs in mouse models of HED and
      KID confirm that hemichannel inhibition is a promising target for new
      therapeutic approaches to KID and HED.
    explanation: >-
      Summarises hemichannel inhibition as a validated preclinical therapeutic
      target for KID.
- name: Allele-Specific siRNA (Experimental)
  therapeutic_modality: SIRNA
  description: >-
    A precision strategy for the dominant D50N allele: a mutant-selective siRNA
    silences the D50N transcript without touching the wild-type allele, correcting
    both the impaired gap-junction coupling and the hyperactive hemichannel in
    patient keratinocytes. Proof of concept only, with topical delivery to skin
    still to be solved and no cochlear delivery.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Heterozygous Gain-of-Function GJB2 Missense Variant
    description: >-
      Selectively removes the mutant transcript, so the remaining wild-type allele's
      channels function normally.
    evidence:
    - reference: PMID:31705875
      reference_title: Allele-Specific Small Interfering RNA Corrects Aberrant Cellular Phenotype in Keratitis-Ichthyosis-Deafness Syndrome Keratinocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro treatment with allele-specific small interfering RNA led to robust
        inhibition of the mutant GJB2 allele without altering expression of the
        wild-type allele. This corrected both gap junction and hemichannel activity.
      explanation: >-
        Demonstrates allele-selective knockdown correcting both channel defects in
        patient cells.
  evidence:
  - reference: PMID:31705875
    reference_title: Allele-Specific Small Interfering RNA Corrects Aberrant Cellular Phenotype in Keratitis-Ichthyosis-Deafness Syndrome Keratinocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data provide an important proof-of-concept and model system for the
      potential use of allele-specific small interfering RNA in treating KID syndrome
      and other dominant genetic conditions.
    explanation: >-
      Frames the approach as preclinical proof of concept for KID.
animal_models:
- name: Cx26-G45E inducible transgenic mouse
  species: Mouse
  genotype: Inducible transgenic expressing human Cx26-G45E in keratinocytes
  publication: PMID:22031297
  description: >-
    The model of the lethal KID skin phenotype, created because the G45E allele
    forms constitutively active hemichannels. Induced expression in keratinocytes
    reproduces hyperkeratosis, scaling, hair loss and the hyperproliferative
    histopathology of human KID, with increased hemichannel currents in the
    transgenic keratinocytes.
  evidence:
  - reference: PMID:22031297
    reference_title: The Cx26-G45E mutation displays increased hemichannel activity in a mouse model of the lethal form of keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We created an animal model for KIDS by generating an inducible transgenic
      mouse expressing Cx26-G45E in keratinocytes.
    explanation: >-
      Establishes the existence and construction of this model of KID.
  - reference: PMID:22031297
    reference_title: The Cx26-G45E mutation displays increased hemichannel activity in a mouse model of the lethal form of keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cx26-G45E mice displayed reduced viability, hyperkeratosis, scaling, skin
      folds, and hair loss.
    explanation: >-
      Records the whole-animal phenotype, including the reduced viability that
      parallels the lethal human form this allele causes.
  modeled_mechanisms:
  - target: Disordered Keratinocyte Proliferation and Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the hyperproliferative, abnormally differentiated epidermis and the
      clinical scaling/hyperkeratosis.
    limitations: >-
      A transgene expressed from a non-native promoter does not reproduce the native
      one-mutant-allele stoichiometry, and G45E is a lethal-form allele rather than
      the common D50N.
    readouts:
    - name: Epidermal histopathology
      target: Disordered Keratinocyte Proliferation and Differentiation
      direction: ALTERED
      interpretation: >-
        Hyperplasia, acanthosis and papillomatosis correlating with human KID skin.
      evidence:
      - reference: PMID:22031297
        reference_title: The Cx26-G45E mutation displays increased hemichannel activity in a mouse model of the lethal form of keratitis-ichthyosis-deafness syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histopathology included hyperplasia, acanthosis, papillomatosis, increased
          cell size, and osteal plugging.
        explanation: >-
          The histological measurement behind this readout.
    evidence:
    - reference: PMID:22031297
      reference_title: The Cx26-G45E mutation displays increased hemichannel activity in a mouse model of the lethal form of keratitis-ichthyosis-deafness syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These abnormalities correlated with human KIDS pathology and were associated
        with increased hemichannel currents in transgenic keratinocytes.
      explanation: >-
        Supports treating this mouse as informative for the keratinocyte
        dysregulation node, with the hemichannel mechanism measured.
- name: Cx26-S17F knock-in mouse
  species: Mouse
  genotype: Constitutive Cx26-S17F knock-in
  publication: PMID:36699003
  description: >-
    The model that localizes the cochlear lesion. A constitutive S17F knock-in
    cochlea develops hyperactive hemichannels in the supporting cells of the organ
    of Corti (formed with Cx30) and loses hair cell stereocilia, demonstrating the
    supporting-cell hemichannel mechanism directly in cochlear tissue.
  evidence:
  - reference: PMID:36699003
    reference_title: Expression of KID syndromic mutation Cx26S17F produces hyperactive hemichannels in supporting cells of the organ of Corti.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this work, we evaluated the functional consequences of expressing a KID
      syndromic mutation, Cx26S17F, in the transgenic mouse cochlea and whether
      co-expression of Cx26S17F and Cx30 leads to the formation of hyperactive HCs.
    explanation: >-
      Establishes the model and the question it was built to answer - the cochlear
      consequences of a KID allele.
  modeled_mechanisms:
  - target: Cochlear Supporting Cell Hemichannel Hyperactivity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces hyperactive supporting-cell hemichannels and stereocilia loss in the
      organ of Corti.
    limitations: >-
      A single allele (S17F) in mouse; the hemichannel hyperactivity requires
      co-expression with Cx30, and the readout is at the cellular scale while the
      clinical endpoint this node feeds (hearing loss) is at the organism scale.
    readouts:
    - name: Supporting-cell hemichannel activity
      target: Cochlear Supporting Cell Hemichannel Hyperactivity
      direction: INCREASED
      interpretation: >-
        Hyperactive hemichannels with increased calcium influx and cellular damage in
        organ of Corti supporting cells.
      evidence:
      - reference: PMID:36699003
        reference_title: Expression of KID syndromic mutation Cx26S17F produces hyperactive hemichannels in supporting cells of the organ of Corti.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          cells co-expressing Cx26S17F and Cx30 present hyperactive HCs insensitive to
          HCs blockers, Ca2+ and La3+, resulting in more Ca2+ influx and cellular
          damage.
        explanation: >-
          The hemichannel measurement behind this readout.
    evidence:
    - reference: PMID:36699003
      reference_title: Expression of KID syndromic mutation Cx26S17F produces hyperactive hemichannels in supporting cells of the organ of Corti.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cochlear explants from a constitutive knock-in Cx26S17F mouse or conditional
        in vitro cochlear expression of Cx26S17F produces hyperactive HCs in
        supporting cells of the organ of Corti. These conditions also produce loss of
        hair cells stereocilia.
      explanation: >-
        Supports treating this mouse as informative for the cochlear supporting-cell
        hemichannel node.
experimental_models:
- name: D50N patient-derived immortalized keratinocytes (KID-KC)
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens

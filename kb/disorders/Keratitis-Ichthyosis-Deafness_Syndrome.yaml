name: Keratitis-Ichthyosis-Deafness Syndrome
creation_date: "2026-09-05T06:37:27Z"
category: Mendelian
description: >-
  Keratitis-ichthyosis-deafness (KID) syndrome is a rare autosomal dominant
  ectodermal dysplasia defined by the triad of vascularizing keratitis,
  erythrokeratodermic/ichthyosiform skin lesions, and congenital sensorineural
  hearing loss. It is caused by heterozygous missense variants in GJB2, encoding
  the gap-junction protein connexin 26 (Cx26); a small number of cases are caused
  by GJB6 (connexin 30). The single most common allele, p.D50N, accounts for the
  large majority of cases.

  The mechanism is the mirror image of the recessive GJB2 deafness at the same
  locus. DFNB1 is a loss-of-function, dosage disease: two null alleles leave too
  little Cx26 and cause nonsyndromic deafness with no skin phenotype. KID is a
  gain of function. A single missense allele - clustered in the cytoplasmic
  N-terminus and first extracellular loop, the domains that gate the channel -
  produces connexin hemichannels (undocked hexamers in non-junctional membrane)
  that open when they should be shut. The aberrant hemichannels lose their normal
  restraint by extracellular calcium and, for some alleles, become directly
  permeable to calcium, so keratinocytes are loaded with calcium and leak ATP.
  That is why a loss-of-function null causes only deafness while a single
  gain-of-function missense causes disease across every Cx26-expressing
  epithelium - epidermis, cornea, and the non-sensory cells of the cochlea.

  A complication of the simple "hyperactive homomeric hemichannel" account is that
  some severe KID alleles (S17F) form non-functional homomeric hemichannels in
  isolation, yet still cause florid disease. In skin, Cx26 is co-expressed with
  Cx43 and Cx30; the syndromic N-terminal mutations acquire the ability to
  oligomerise with the normally incompatible Cx43, producing hyperactive
  heteromeric hemichannels but non-functional heteromeric gap-junction channels.
  So the pathogenic hemichannel can be heteromeric rather than homomeric, and the
  disease combines a gain of hemichannel leak with a dominant loss of intercellular
  coupling.

  This entry is the autosomal dominant, connexin-related disease. Two separate
  autosomal recessive entities that carry "KID" in their names are deliberately
  out of scope (see notes): AP1B1-related KIDAR (a vesicular-trafficking disorder,
  MONDO:0859278) and VPS33B-related ARKID.

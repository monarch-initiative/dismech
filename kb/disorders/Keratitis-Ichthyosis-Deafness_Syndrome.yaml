- name: Keratinocyte Calcium Overload and ATP Release
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The functional consequence of a leaky hemichannel in the keratinocyte:
    inappropriate opening loads the cell with calcium and releases ATP into the
    extracellular space. ATP acts on epidermal P2 purinergic receptors that
    regulate keratinocyte differentiation and proliferation, and calcium overload
    plus sustained leak drives keratinocyte death. Peptidoglycan from
    Staphylococcus aureus triggers additional hemichannel-dependent ATP release
    selectively in KID-mutant keratinocytes, coupling the leak to the infection
    that characterises the disease.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

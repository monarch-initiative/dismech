inheritance:
- name: Autosomal dominant
  description: >-
    A single heterozygous GJB2 (or, rarely, GJB6) missense variant is sufficient.
    Most cases are sporadic de novo events - more than 90% of published cases -
    but vertical transmission through affected pedigrees is documented, and the
    recurrence of an identical allele in siblings of unaffected parents has been
    traced to germline (gonadal) mosaicism, which is important for genetic
    counselling of the lethal neonatal form.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:11912510
    reference_title: Missense mutations in GJB2 encoding connexin-26 cause the ectodermal dysplasia keratitis-ichthyosis-deafness syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of these mutations was detected in six unrelated sporadic case subjects
      and also segregated in one family with vertical transmission of KID. These
      results indicate the presence of a common, recurrent mutation and establish
      its autosomal dominant nature.
    explanation: >-
      Establishes the autosomal dominant nature of KID and that both sporadic and
      familial transmission occur at the same recurrent allele.
  - reference: PMID:29159249
    reference_title: Visual impairment reversal with oral acitretin therapy in keratitis-ichthyosis-deafness (KID) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more than 90% of cases are caused by sporadic mutations predominantly in gap
      junction protein β2 (GJB2) on chromosome 13q11-q12
    explanation: >-
      Quantifies the predominance of sporadic (de novo) mutations over familial
      transmission.
  - reference: PMID:20412116
    reference_title: "Germline mosaicism in keratitis-ichthyosis-deafness syndrome: pre-natal diagnosis in a familial lethal form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results establish the role of germline mosaicism in KID syndrome and
      warrant careful genetic counseling.
    explanation: >-
      Documents germline (gonadal) mosaicism as the explanation for sibling
      recurrence from clinically unaffected parents.

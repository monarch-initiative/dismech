- name: Disordered Keratinocyte Proliferation and Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of coupling and calcium/ATP dysregulation together derange the tightly
    ordered program by which basal keratinocytes proliferate and then differentiate
    toward the cornified layer. The epidermis becomes hyperproliferative with
    abnormal differentiation - the cellular substrate of the clinical
    hyperkeratosis.

definitions:
- name: Clinical boundary of self-limited familial neonatal epilepsy
  definition_type: CASE_DEFINITION
  description: >-
    Focal motor seizures begin after a seizure-free interval, typically at age
    two to eight days in an otherwise healthy term infant, and remit by six to
    12 months with generally normal development. Tonic limb stiffening,
    migration during an event, apnea, and cyanosis are characteristic
    semiologies. Acute symptomatic neonatal seizures and KCNQ2-DEE must be
    excluded before assigning the self-limited syndrome.
  scope: >-
    Applies to the neonatal-onset self-limited syndrome, whether familial or de
    novo. Infantile-onset self-limited epilepsy and neonatal-onset
    developmental and epileptic encephalopathy are separate disease
    boundaries.
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KCNQ2-SLFNE is characterized by seizures that start in otherwise healthy infants between two and eight days after term birth and spontaneously disappear between the first and the sixth to 12th month of life."
    explanation: GeneReviews supplies the characteristic onset, health status, and remission interval for the KCNQ2-related syndrome.
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Seizures are characterized by sudden onset with prominent motor involvement, often accompanied by apnea and cyanosis; video EEG identifies seizures as focal onset with tonic stiffening of limb(s) and some migration during each seizure's evolution."
    explanation: GeneReviews defines the characteristic focal motor and autonomic seizure semiology.
- name: Molecular confirmation of KCNQ2-related self-limited familial neonatal epilepsy
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    In a proband with the compatible self-limited neonatal phenotype, a
    heterozygous pathogenic KCNQ2 variant establishes a KCNQ2-related
    diagnosis. KCNQ3 is an independently established but less common cause;
    variant interpretation must incorporate phenotype and segregation rather
    than assume that every KCNQ2 or KCNQ3 variant predicts a benign course.
  scope: >-
    The quoted diagnostic statement is specific to KCNQ2-related disease.
    KCNQ3-related cases require the same phenotype-first distinction from other
    neonatal epilepsies.
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of a KCNQ2-related disorder is established in a proband with suggestive findings and a heterozygous pathogenic variant in KCNQ2 identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic requirement for KCNQ2-related disease.

- discussion_id: gap_bfns_mouse_model_self_limiting_fidelity
  prompt: >-
    Why do earlier homozygous Kcnq2/Kcnq3 knock-in models show seizures
    persisting into adulthood while a newer Kcnq2-SeLNE model shows timely
    excitability recovery, and which allele, dosage, and developmental context
    best models the self-limited human course?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
  - pathophysiology#Loss of M-Current Control of Neuronal Excitability
  - pathophysiology#Neonatal Neuronal Hyperexcitability
  rationale: >-
    Earlier knock-in mice carrying human BFNC variants reproduce reduced
    M-current and lower seizure thresholds, but homozygous animals have
    recurrent seizures into adulthood. A newer phenotypic Kcnq2-SeLNE model
    instead shows timely recovery of neuronal excitability. This discrepancy
    may reflect allele, zygosity, background, brain region, or outcome
    definition and prevents treating either mouse time course as a direct
    surrogate for human remission.
  evidence:
  - reference: PMID:18483067
    reference_title: "Mouse models of human KCNQ2 and KCNQ3 mutations for benign familial neonatal convulsions show seizures and neuronal plasticity without synaptic reorganization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both Kcnq2(A306T/A306T) and Kcnq3(G311V/G311V) homozygous mutant mice exhibited early onset spontaneous generalized tonic-clonic seizures concurrent with a significant reduction in amplitude and increased deactivation kinetics of the neuronal M-current."
    explanation: >-
      The mouse model recapitulates the M-current defect and produces seizures,
      but with a course that diverges from the human self-limiting phenotype,
      defining the model-mismatch question.
  - reference: PMID:41051877
    reference_title: Delayed excitability recovery and downregulation of neurodevelopmental pathways contribute to phenotypic differences in KCNQ2-related disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, whereas SeLNE mice showed timely recovery of excitability, DEE mice displayed delayed restoration of abnormal excitability in CA1 excitatory neurons."
    explanation: >-
      The newer paired model reproduces an age-limited recovery trajectory,
      creating a direct contrast with the persistent-seizure homozygous models.

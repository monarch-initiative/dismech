- phase: Spontaneous remission
  age_range: Within first year of life
  notes: >-
    Seizures characteristically remit during infancy or early childhood, hence
    the "self-limited" designation; long-term neurodevelopment is generally
    normal.
  evidence:
  - reference: ORPHA:1949
    reference_title: "Self-limited neonatal epilepsy (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "seizures onset typically in the first week of life, in otherwise healthy newborns, and usually resolving within the first year of life."
    explanation: Orphanet definition supports first-week onset and resolution within the first year.
  - reference: PMID:36939707
    reference_title: "ILAE Genetic Literacy Series: Self-limited familial epilepsy syndromes with onset in neonatal age and infancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Seizures tend to remit during infancy or early childhood and are therefore called "self-limited".'
    explanation: ILAE literacy review supports spontaneous remission in infancy/early childhood.
- phase: Later seizure susceptibility
  age_range: Later childhood through adulthood
  notes: >-
    The neonatal epilepsy is self-limited, but later seizures can occur.
    GeneReviews estimates that about 30% of individuals with KCNQ2-related
    self-limited familial neonatal epilepsy develop epileptic seizures later in
    life; this estimate should not be generalized automatically to KCNQ3.
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "About 30% of individuals with KCNQ2-SLFNE develop epileptic seizures later in life."
    explanation: GeneReviews directly quantifies later seizure risk in the KCNQ2-related subtype.
genetic:
- name: KCNQ2
  association: Causal heterozygous pathogenic variant
  gene_term:
    preferred_term: KCNQ2
    term:
      id: hgnc:6296
      label: KCNQ2
  notes: >-
    KCNQ2 encodes the Kv7.2 voltage-gated potassium channel subunit on
    chromosome 20q13. Haploinsufficiency and other comparatively mild
    loss-of-function alleles commonly produce the self-limited phenotype, but
    variant class alone is not deterministic. A 2026 cohort associated
    single-allele truncating/NMD lesions and C-terminal or other
    nontransmembrane variants with SeL(F)NE, whereas transmembrane missense
    variants, especially in S5-pore-S6, were enriched in KCNQ2-DEE.
  inheritance:
  - name: Autosomal dominant with incomplete penetrance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    description: >-
      KCNQ2-related benign familial neonatal seizures show autosomal dominant
      inheritance with incomplete penetrance.
    evidence:
    - reference: PMID:36939707
      reference_title: "ILAE Genetic Literacy Series: Self-limited familial epilepsy syndromes with onset in neonatal age and infancy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "incomplete penetrance and de novo inheritance occur"
      explanation: The ILAE Genetics Commission review documents incomplete penetrance across self-limited familial neonatal/infantile epilepsies.
  evidence:
  - reference: PMID:9425895
    reference_title: "A novel potassium channel gene, KCNQ2, is mutated in an inherited epilepsy of newborns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five other BFNC probands were shown to have KCNQ2 mutations, including two transmembrane missense mutations, two frameshifts and one splice-site mutation."
    explanation: Singh et al. 1998 established KCNQ2 as the major causal gene for benign familial neonatal convulsions.
  - reference: ORPHA:1949
    reference_title: "Self-limited neonatal epilepsy (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KCNQ2 | potassium voltage-gated channel subfamily Q member 2 | hgnc:6296 | Disease-causing germline mutation(s) in"
    explanation: Orphanet gene table confirms KCNQ2 as a disease-causing gene.
  - reference: PMID:41988220
    reference_title: "KCNQ2 Variants in Neonatal Epilepsy: Clinical Characteristics and Neurodevelopmental Outcomes in 30 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clear topology-phenotype patterns emerged: transmembrane missense variants-especially S5-pore-S6-were enriched in DEE, whereas C-terminal/nontransmembrane variants were associated with SeL(F)NE and benign outcomes."
    explanation: The cohort supports a topology-associated severity gradient while not making the association deterministic for an individual variant.
  - reference: PMID:41988220

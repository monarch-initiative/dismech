discussions:
- discussion_id: gap_bfns_variant_class_severity_determinants
  prompt: >-
    Which molecular properties of a KCNQ2 or KCNQ3 variant (mild
    haploinsufficiency versus dominant-negative strong loss-of-function versus
    gain-of-function) determine whether it produces self-limiting benign
    familial neonatal seizures rather than the severe KCNQ2 developmental and
    epileptic encephalopathy, and can M-current openers be matched to variant
    class?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#KCNQ2/KCNQ3 K+ Channel Loss-of-Function and M-Current Attenuation
  rationale: >-
    The same gene produces strikingly opposite-severity phenotypes. Benign
    familial neonatal seizures are generally attributed to mild loss-of-function
    or haploinsufficiency variants, whereas KCNQ2 developmental and epileptic
    encephalopathy is associated with more severe dominant-negative or
    gain-of-function variants. A firm variant-class-to-severity relationship has
    not been established, so genotype alone does not yet reliably predict a
    benign versus encephalopathic course. This gap has direct therapeutic
    stakes, because M-current opener drugs (retigabine/ezogabine) and
    sodium-channel blockers may behave differently across variant classes.
  evidence:
  - reference: PMID:22275249
    reference_title: "KCNQ2 encephalopathy: emerging phenotype of a neonatal epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few reports on patients with a KCNQ2 mutation with a more severe outcome exist, but a definite relationship has not been established."
    explanation: >-
      Weckhuysen et al. show that severe KCNQ2 outcomes were recognized before a
      definite genotype-severity relationship was established, framing the open
      question of what distinguishes benign from encephalopathic variants.
  proposed_experiments:
  - experiment_id: exp_bfns_variant_class_functional_panel
    name: KCNQ2/KCNQ3 variant-class functional and pharmacology panel
    description: >-
      Express matched benign-familial-neonatal-seizure and developmental and
      epileptic encephalopathy variants of KCNQ2 and KCNQ3 in a shared
      heterologous background, with and without co-expressed wild-type subunit,
      and measure M-current density, activation and deactivation kinetics,
      dominant-negative suppression, and pharmacological rescue by retigabine.
    experiment_type:
      preferred_term: heterologous channel electrophysiology and pharmacology experiment
    perturbations:
    - name: KCNQ2/KCNQ3 variant expression
      target: pathophysiology#KCNQ2/KCNQ3 K+ Channel Loss-of-Function and M-Current Attenuation
      genes:
      - preferred_term: KCNQ2
        term:
          id: hgnc:6296
          label: KCNQ2
      - preferred_term: KCNQ3
        term:
          id: hgnc:6297
          label: KCNQ3
      description: >-
        Introduce individual benign and encephalopathy-associated variants,
        alone and co-expressed with wild-type subunit, to quantify variant-class
        effects on channel function.
    readouts:
    - name: M-current density and pharmacological rescue
      target: pathophysiology#KCNQ2/KCNQ3 K+ Channel Loss-of-Function and M-Current Attenuation
      biological_processes:
      - preferred_term: membrane repolarization
        term:
          id: GO:0086009
          label: membrane repolarization
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology assay
      direction: POSITIVE
    controls:
    - name: Wild-type channel
      description: Wild-type KCNQ2/KCNQ3 heteromeric channels.
    - name: Benign versus encephalopathy variant comparison
      description: Matched benign and encephalopathy variants assayed in the same background.
    decision_criterion: >-
      A variant-class-to-severity model is supported if encephalopathy variants
      reproducibly cause stronger M-current suppression or dominant-negative
      behaviour than benign variants, and if retigabine rescue differs
      predictably by class.
    would_support:
    - pathophysiology#KCNQ2/KCNQ3 K+ Channel Loss-of-Function and M-Current Attenuation

- discussion_id: gap_bfns_self_limiting_developmental_basis
  prompt: >-
    What developmental changes drive the spontaneous remission of benign
    familial neonatal seizures within the first months of life, given that the
    mutant KCNQ2/KCNQ3 channel continues to be expressed throughout adulthood?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neonatal Neuronal Hyperexcitability
  rationale: >-
    Seizures remit despite lifelong expression of the causal variant, so
    remission cannot be explained by loss of the mutant channel. Candidate
    mechanisms include developmental maturation of compensatory potassium
    conductances, the KCC2-driven shift of GABA from depolarizing to
    hyperpolarizing signaling, and maturation of inhibitory circuits, but the
    dominant driver of remission is unresolved. Distinguishing these is
    important because it defines the developmental window in which the network
    is transiently vulnerable.
  evidence:
  - reference: PMID:18483067
    reference_title: "Mouse models of human KCNQ2 and KCNQ3 mutations for benign familial neonatal convulsions show seizures and neuronal plasticity without synaptic reorganization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "exhibits the remarkable feature of clinical remission within a few weeks of onset and a favourable prognosis, sparing cognitive abilities despite persistent expression of the mutant KCNQ2 or KCNQ3 potassium channels throughout adulthood."
    explanation: >-
      Singh et al. frame the paradox directly: remission occurs despite
      persistent expression of the mutant channel, motivating a developmental
      rather than channel-loss explanation.
  - reference: PMID:36939707
    reference_title: "ILAE Genetic Literacy Series: Self-limited familial epilepsy syndromes with onset in neonatal age and infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Seizures tend to remit during infancy or early childhood and are therefore called "self-limited".'
    explanation: >-
      The ILAE review documents the self-limited course whose developmental
      basis this gap seeks to explain.
  proposed_experiments:
  - experiment_id: exp_bfns_developmental_timecourse
    name: Developmental time-course of excitability and chloride homeostasis
    description: >-
      In patient-derived iPSC cortical neurons and in Kcnq2/Kcnq3 knock-in mice,
      map M-current density, KCC2 expression, GABA reversal potential, and
      network excitability across the equivalent postnatal maturation window to
      identify which change coincides with seizure remission.
    experiment_type:
      preferred_term: developmental time-course electrophysiology experiment
    readouts:
    - name: Maturation of excitability and inhibition
      target: pathophysiology#Neonatal Neuronal Hyperexcitability
      biological_processes:
      - preferred_term: membrane repolarization
        term:
          id: GO:0086009
          label: membrane repolarization
        modifier: DECREASED
      - preferred_term: trans-synaptic signaling
        term:
          id: GO:0099537
          label: trans-synaptic signaling
        modifier: DYSREGULATED
      assays:
      - preferred_term: patch-clamp electrophysiology assay
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Isogenic corrected neurons
      description: Neurons in which the KCNQ2/KCNQ3 variant is corrected.
    - name: Wild-type littermate mice
      description: Age-matched wild-type mice for the developmental time-course.
    decision_criterion: >-
      A developmental driver of remission is supported if a specific maturational
      change (compensatory K+ conductance, KCC2/chloride switch, or inhibitory
      maturation) reproducibly coincides with the normalization of network
      excitability despite continued mutant-channel expression.
    would_support:
    - pathophysiology#Neonatal Neuronal Hyperexcitability

- discussion_id: gap_bfns_mouse_model_self_limiting_fidelity
  prompt: >-
    Do Kcnq2/Kcnq3 knock-in mouse models, which reproduce the M-current
    reduction and lowered seizure threshold but instead show seizures persisting
    into adulthood, faithfully model the self-limiting human neonatal course?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#KCNQ2/KCNQ3 K+ Channel Loss-of-Function and M-Current Attenuation
  - pathophysiology#Neonatal Neuronal Hyperexcitability
  rationale: >-
    Knock-in mice carrying human benign-familial-neonatal-seizure variants
    reproduce the reduced M-current and lower seizure thresholds, validating the
    channel-level mechanism. However, homozygous mutant mice have recurrent
    seizures into adulthood rather than the transient, self-limiting course seen
    in human patients. The mouse therefore models the M-current defect well but
    the developmental remission poorly, so translational claims about the human
    self-limiting course should not rest on the mouse phenotype alone.
  evidence:
  - reference: PMID:18483067
    reference_title: "Mouse models of human KCNQ2 and KCNQ3 mutations for benign familial neonatal convulsions show seizures and neuronal plasticity without synaptic reorganization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both Kcnq2(A306T/A306T) and Kcnq3(G311V/G311V) homozygous mutant mice exhibited early onset spontaneous generalized tonic-clonic seizures concurrent with a significant reduction in amplitude and increased deactivation kinetics of the neuronal M-current."
    explanation: >-
      The mouse model recapitulates the M-current defect and produces seizures,
      but with a course that diverges from the human self-limiting phenotype,
      defining the model-mismatch question.
  proposed_experiments:
  - experiment_id: exp_bfns_human_ipsc_remission_readout
    name: Human iPSC cortical-organoid remission-window experiment
    description: >-
      Generate patient-derived and isogenic-corrected human cortical organoids
      carrying benign-familial-neonatal-seizure KCNQ2/KCNQ3 variants and track
      M-current, network excitability, and its maturational normalization over
      extended culture, comparing the trajectory against the persistent-seizure
      mouse phenotype.
    experiment_type:
      preferred_term: isogenic cortical organoid network-maturation experiment
    model_systems:

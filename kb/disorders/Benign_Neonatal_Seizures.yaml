inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Self-limited familial neonatal epilepsy segregates in an autosomal dominant
    manner in multigenerational families with heterozygous KCNQ2 or KCNQ3
    variants. Most KCNQ2-related self-limited cases inherit the variant from a
    parent; each child of a heterozygous affected individual has a 50% chance
    of inheriting it. Incomplete penetrance and de novo cases occur.
  evidence:
  - reference: ORPHA:1949
    reference_title: "Self-limited neonatal epilepsy (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant"
    explanation: Orphanet directly lists autosomal dominant inheritance for ORPHA:1949.
  - reference: PMID:9425895
    reference_title: "A novel potassium channel gene, KCNQ2, is mutated in an inherited epilepsy of newborns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One type is benign familial neonatal convulsions (BFNC), a dominantly inherited disorder of newborns."
    explanation: The original KCNQ2 discovery paper characterizes BFNC as a dominantly inherited disorder of newborns.
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of a heterozygous individual with KCNQ2-SLFNE has a 50% chance of inheriting the pathogenic variant."
    explanation: GeneReviews provides the recurrence risk for an affected heterozygous parent.

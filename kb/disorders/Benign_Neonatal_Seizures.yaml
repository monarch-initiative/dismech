discussions:
- discussion_id: gap_bfns_variant_class_severity_determinants
  prompt: >-
    Which molecular properties of a KCNQ2 or KCNQ3 variant (mild
    haploinsufficiency versus dominant-negative strong loss-of-function versus
    gain-of-function) determine whether it produces self-limiting benign
    familial neonatal seizures rather than the severe KCNQ2 developmental and
    epileptic encephalopathy, and can M-current openers be matched to variant
    class?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#KCNQ2 Pathogenic Variant
  - pathophysiology#KCNQ3 Pathogenic Variant
  - pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
  rationale: >-
    The same gene produces strikingly different severity. Recent cohorts
    associate single-allele truncating/NMD and nontransmembrane variants with
    SeL(F)NE, and transmembrane or pore-region missense variants with DEE, but
    the evidence is retrospective and not deterministic for an individual
    variant. Functional mechanism, allelic context, and KCNQ3-specific evidence
    remain incomplete. This gap has therapeutic stakes because M-current
    openers and sodium-channel blockers may behave differently across
    loss-of-function, dominant-negative, and gain-of-function variants.
  evidence:
  - reference: PMID:22275249
    reference_title: "KCNQ2 encephalopathy: emerging phenotype of a neonatal epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few reports on patients with a KCNQ2 mutation with a more severe outcome exist, but a definite relationship has not been established."
    explanation: >-
      Weckhuysen et al. show that severe KCNQ2 outcomes were recognized before a
      definite genotype-severity relationship was established, framing the open
      question of what distinguishes benign from encephalopathic variants.
  - reference: PMID:41988220
    reference_title: "KCNQ2 Variants in Neonatal Epilepsy: Clinical Characteristics and Neurodevelopmental Outcomes in 30 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clear topology-phenotype patterns emerged: transmembrane missense variants-especially S5-pore-S6-were enriched in DEE, whereas C-terminal/nontransmembrane variants were associated with SeL(F)NE and benign outcomes."
    explanation: >-
      This 30-patient cohort strengthens a topology-severity association but
      remains too small and observational to close the variant-level prediction
      question.
  proposed_experiments:

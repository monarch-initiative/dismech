diagnosis:
- name: KCNQ2/KCNQ3 molecular genetic testing
  description: >-
    Targeted KCNQ2/KCNQ3 sequencing or epilepsy gene-panel/whole-exome
    sequencing identifies pathogenic variants. Molecular results must be
    interpreted with the neonatal phenotype and EEG because KCNQ2 variants span
    self-limited epilepsy and KCNQ2-DEE.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Heterozygous pathogenic or likely pathogenic variants in KCNQ2 or KCNQ3 support the diagnosis.
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of a KCNQ2-related disorder is established in a proband with suggestive findings and a heterozygous pathogenic variant in KCNQ2 identified by molecular genetic testing."
    explanation: GeneReviews requires both compatible findings and a heterozygous pathogenic KCNQ2 variant.
  - reference: PMID:36939707
    reference_title: "ILAE Genetic Literacy Series: Self-limited familial epilepsy syndromes with onset in neonatal age and infancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we describe important clues in recognition of these syndromes, diagnostic steps including genetic testing, management, and genetic counseling."
    explanation: ILAE Genetics Commission supports genetic testing as part of the diagnostic workup.
- name: Amplitude-integrated EEG (aEEG)
  description: >-
    Amplitude-integrated EEG can capture a distinctive ictal pattern in
    some neonates with KCNQ2/3 variants, allowing early electroclinical
    recognition while molecular results are pending. The published evidence is
    from small retrospective case series across the KCNQ2/3 neonatal epilepsy
    spectrum, not a validated test specific to SeL(F)NE.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: A sudden rise in both aEEG margins followed by marked amplitude depression is a reported ictal pattern that may prompt KCNQ2/KCNQ3 testing and treatment consideration.
  evidence:
  - reference: PMID:28926830
    reference_title: A Distinctive Ictal Amplitude-Integrated Electroencephalography Pattern in Newborns with Neonatal Epilepsy Associated with KCNQ2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct aEEG seizure pattern, consisting of a sudden rise of the lower and upper margin of the aEEG, followed by a marked depression of the aEEG amplitude, was found in 8 of the 9 patients."
    explanation: Multicenter case series defines a distinctive aEEG pattern in KCNQ2-related neonatal epilepsy.
  - reference: PMID:37827512
    reference_title: "Distinctive Amplitude-Integrated EEG Ictal Pattern and Targeted Therapy with Carbamazepine in KCNQ2 and KCNQ3 Neonatal Epilepsy: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of the distinctive ictal aEEG pattern in the NICU allowed early and effective targeted therapy with CBZ in four neonates, well before genetic results became available."
    explanation: A subsequent case series confirms aEEG pattern recognition enables early targeted therapy.
- name: Neonatal EEG background and neurologic examination
  description: >-
    Conventional EEG background and neonatal neurologic examination help
    distinguish a likely self-limited course from KCNQ2-DEE. Burst suppression,
    profound discontinuity, markedly abnormal background, or abnormal tone are
    red flags for adverse developmental outcome rather than defining features
    of SeL(F)NE.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: A relatively preserved background and normal examination support the self-limited end; marked abnormalities require longitudinal developmental surveillance and reassessment for KCNQ2-DEE.
  evidence:
  - reference: PMID:41988220
    reference_title: "KCNQ2 Variants in Neonatal Epilepsy: Clinical Characteristics and Neurodevelopmental Outcomes in 30 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "burst-suppression/profound discontinuity consistently signaled adverse neurodevelopment."
    explanation: The 30-patient cohort links severely abnormal EEG background to adverse outcome.
  - reference: PMID:42081271
    reference_title: "KCNQ2 neonatal epilepsy: Impact of prompt diagnosis and treatment, and early predictors of outcome severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factors in the neonatal period associated with abnormal developmental outcome included neurological abnormalities (e.g., abnormal tone) and markedly abnormal neonatal EEG background"
    explanation: The multicenter cohort independently identifies examination and EEG-background red flags.
differential_diagnoses:
- name: KCNQ2 developmental and epileptic encephalopathy
  description: >-
    KCNQ2-DEE can begin in the same first postnatal week and share focal tonic
    seizures, but it represents the severe end of the KCNQ2 spectrum rather
    than the self-limited syndrome.
  disease_term:
    preferred_term: KCNQ2 developmental and epileptic encephalopathy
    term:
      id: MONDO:0013387
      label: developmental and epileptic encephalopathy, 7
  distinguishing_features:
  - Multiple daily or drug-resistant neonatal seizures
  - Burst-suppression, profound discontinuity, or multifocal epileptiform EEG background
  - Abnormal neurologic examination and moderate-to-profound developmental impairment
  - Transmembrane or pore-region missense variants are enriched but do not determine outcome alone
  evidence:
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At onset, EEG shows a burst-suppression pattern or multifocal epileptiform activity; early brain MRI can show basal ganglia hyperdensities and later MRIs may show white matter or general volume loss. Moderate-to-profound developmental impairment is present."
    explanation: GeneReviews defines EEG, imaging, and developmental features that distinguish KCNQ2-NEO-DEE from KCNQ2-SLFNE.
  - reference: PMID:41988220
    reference_title: "KCNQ2 Variants in Neonatal Epilepsy: Clinical Characteristics and Neurodevelopmental Outcomes in 30 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopment was normal in 63%; delays occurred only within the DEE cohort."
    explanation: This cohort supports developmental delay as a boundary with the DEE subgroup.
- name: Benign familial infantile epilepsy
  description: >-
    Self-limited familial infantile epilepsy also causes autosomal dominant
    focal seizures with favorable development but begins in infancy rather than
    the characteristic neonatal window.
  disease_term:
    preferred_term: benign familial infantile epilepsy
    term:
      id: MONDO:0017615
      label: benign familial infantile epilepsy
  distinguishing_features:
  - Onset after the neonatal period, usually in infancy
  evidence:
  - reference: PMID:40236662
    reference_title: "Oxcarbazepine may be an effective option for Chinese pediatric patients with self-limited focal epilepsy of neonatal/infantile onset: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "self-limited familial infantile epilepsy (SeLIE, 1 – 24 months)"
    explanation: The cohort review supplies the infantile age boundary used to distinguish SeLIE.
- name: Acute symptomatic neonatal seizures
  description: >-
    Hypoglycemia, hypocalcemia, intracranial infection, traumatic or structural
    brain injury, and other acute symptomatic etiologies can present with
    neonatal seizures and must be excluded before diagnosing a genetic
    self-limited epilepsy.
  distinguishing_features:
  - An identifiable metabolic, infectious, or acquired neurologic trigger
  - Seizure course follows the acute underlying condition rather than a familial self-limited epilepsy pattern
  evidence:
  - reference: PMID:40236662
    reference_title: "Oxcarbazepine may be an effective option for Chinese pediatric patients with self-limited focal epilepsy of neonatal/infantile onset: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children diagnosed with any of the following were excluded from the study: (1) pediatric malignancies, (2) hypoglycaemia, (3) intracranial infections, (4) traumatic brain injuries, (5) hypocalcemia, and (6) symptomatic epilepsy."
    explanation: The self-limited epilepsy cohort explicitly excluded common acute symptomatic and acquired causes.
treatments:
- name: Carbamazepine
  description: >-
    Carbamazepine, a sodium-channel-blocking antiseizure medication, is
    frequently reported to control KCNQ2/KCNQ3-related neonatal seizures.
    Support comes from small retrospective case series and a systematic review
    whose 29 included studies were all retrospective; it does not establish a
    randomized first-line superiority claim. Some infants with the
    self-limited phenotype also become seizure-free without treatment.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_phenotypes:
  - preferred_term: Neonatal seizure
    term:
      id: HP:0032807
      label: Neonatal seizure
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:37827512
    reference_title: "Distinctive Amplitude-Integrated EEG Ictal Pattern and Targeted Therapy with Carbamazepine in KCNQ2 and KCNQ3 Neonatal Epilepsy: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "prompted the use of CBZ that was effective in all."
    explanation: Carbamazepine was effective in all four neonates given the targeted therapy in this case series.
  - reference: PMID:28926830
    reference_title: A Distinctive Ictal Amplitude-Integrated Electroencephalography Pattern in Newborns with Neonatal Epilepsy Associated with KCNQ2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prompt recognition of this pattern led to early treatment with carbamazepine in the 2 most recent cases."
    explanation: Earlier KCNQ2 case series also supports carbamazepine as targeted therapy.
  - reference: PMID:36948217
    reference_title: "KCNQ2-Related Epilepsy: Genotype-Phenotype Relationship with Tailored Antiseizure Medication (ASM)-A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'CONCLUSION: Phenobarbital or carbamazepine appears to be the most effective antiseizure medication for children with a "benign" variant.'
    explanation: The systematic review supports carbamazepine as a commonly effective option while its retrospective evidence base limits causal ranking.
  - reference: PMID:20437616
    reference_title: "KCNQ2-Related Disorders."

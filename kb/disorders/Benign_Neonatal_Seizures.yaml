pathophysiology:
- name: KCNQ2 Pathogenic Variant
  description: >-
    A heterozygous pathogenic KCNQ2 variant is the more common initiating
    lesion in self-limited familial neonatal epilepsy. Mild loss-of-function
    or haploinsufficiency is typical of the self-limited end of the spectrum,
    although variant class alone does not determine clinical severity.
  role: trigger
  gene:
    preferred_term: KCNQ2
    term:
      id: hgnc:6296
      label: KCNQ2
  evidence:
  - reference: PMID:9425895
    reference_title: "A novel potassium channel gene, KCNQ2, is mutated in an inherited epilepsy of newborns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five other BFNC probands were shown to have KCNQ2 mutations, including two transmembrane missense mutations, two frameshifts and one splice-site mutation."
    explanation: The original discovery series identifies heterozygous KCNQ2 variants as initiating lesions in BFNC.
  downstream:
  - target: Kv7.2/Kv7.3 M-Channel Dysfunction
    causal_link_type: DIRECT
    description: Pathogenic KCNQ2 variants impair Kv7.2-containing neuronal M channels.
    evidence:
    - reference: PMID:18483067
      reference_title: "Mouse models of human KCNQ2 and KCNQ3 mutations for benign familial neonatal convulsions show seizures and neuronal plasticity without synaptic reorganization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both Kcnq2(A306T/A306T) and Kcnq3(G311V/G311V) homozygous mutant mice exhibited early onset spontaneous generalized tonic-clonic seizures concurrent with a significant reduction in amplitude and increased deactivation kinetics of the neuronal M-current."
      explanation: The Kcnq2 BFNC-allele knock-in directly links the pathogenic variant to reduced and kinetically altered M-current.
- name: KCNQ3 Pathogenic Variant
  description: >-
    A heterozygous pathogenic KCNQ3 variant is a less common alternative

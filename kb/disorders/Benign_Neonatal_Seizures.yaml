name: Benign Neonatal Seizures
creation_date: "2026-05-13T12:00:00Z"
category: Mendelian
description: >-
  Benign neonatal seizures, now termed self-limited (familial) neonatal
  epilepsy (SeL[F]NE), is an autosomal dominant focal epilepsy syndrome of the
  newborn. Seizures usually begin between two and eight days after term birth
  in an otherwise healthy infant and remit during the first six to 12 months.
  Heterozygous pathogenic variants in KCNQ2 are the most common molecular
  cause, with KCNQ3 variants accounting for a smaller subgroup. Kv7.2 and Kv7.3
  form neuronal M channels; reduced M-current weakens the subthreshold
  potassium conductance that restrains repetitive firing. Development is
  usually normal, but the label "self-limited" does not imply zero later risk:
  some individuals with KCNQ2-related disease have seizures later in life.
  Markedly abnormal neonatal EEG background, abnormal neurologic examination,
  persistent drug-resistant seizures, and developmental impairment instead
  raise concern for KCNQ2-related developmental and epileptic encephalopathy
  (KCNQ2-DEE), the severe end of the KCNQ2 spectrum.

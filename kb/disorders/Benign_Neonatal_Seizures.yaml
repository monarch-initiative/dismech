review_notes: >-
  The current ILAE term is self-limited (familial) neonatal epilepsy; BFNS and
  BFNC are retained as historical synonyms. The entry separates the mild
  syndrome from KCNQ2-DEE using course, development, neurologic examination,
  EEG background, and cautious variant-topology associations. Phenotype-table
  evidence on pathophysiology-to-phenotype edges anchors the observed
  manifestation, while M-current studies anchor the upstream mechanism.
  Carbamazepine and other sodium-channel-blocker evidence is retrospective and
  should not be read as randomized superiority or proven developmental benefit.
  NCT05157737 and the PMID:41988220 dataset span the broader KCNQ2 spectrum and
  require phenotype-stratified interpretation; trial status was unknown when
  checked on 2026-07-23. A D2P audit also surfaced low-frequency Orphanet
  annotations (gastroesophageal reflux, axial hypotonia, facial tics, simple
  febrile seizures, increased theta activity, and status epilepticus) plus
  OMIM-derived developmental findings. They were not promoted to canonical
  phenotypes here because primary-source context is absent or the finding may
  reflect the broader KCNQ2 spectrum rather than the self-limited boundary.

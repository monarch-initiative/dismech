name: REM Sleep Behavior Disorder
creation_date: "2026-08-24T00:00:00Z"
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
disease_term:
  preferred_term: REM sleep behavior disorder
  term:
    id: MONDO:0005937
    label: REM sleep behavior disorder
description: >-
  REM sleep behavior disorder is a parasomnia in which the skeletal muscle
  atonia that normally accompanies REM sleep fails, so that the motor programmes
  generated during dreaming are executed rather than suppressed. Patients punch,
  kick, shout, and leap from bed, frequently injuring themselves or a bed
  partner, and wake alert with matching dream recall. Diagnosis requires both
  the behavioural history and polysomnographic demonstration of REM sleep
  without atonia. What makes the disorder important beyond its immediate injury
  risk is what it signifies: in older adults the isolated (idiopathic) form is
  not idiopathic at all but the earliest clinically detectable stage of an
  alpha-synuclein neurodegenerative disease. Post-mortem series find Lewy body
  disease in the overwhelming majority, with alpha-synuclein deposited in
  precisely the brainstem structures that regulate REM atonia, and prospective
  follow-up shows conversion to Parkinson disease, dementia with Lewy bodies, or
  multiple system atrophy at about 6% per year, reaching roughly three-quarters
  by twelve years. That combination - a specific, polysomnographically
  verifiable marker with a decade-long lead time over an overt neurodegenerative
  syndrome - makes it the most powerful prodromal state available in
  neurodegeneration, and the population in which disease-modifying trials are
  most feasible.
notes: >-
  SCOPE. This entry covers REM sleep behavior disorder as an entity, spanning
  the isolated form and the symptomatic forms (antidepressant-associated,
  narcolepsy type 1-associated, and that occurring in established
  synucleinopathy). The isolated form's prodromal significance is curated as a
  consequence of the degenerative aetiology, not of the syndrome, so the
  antidepressant-associated presentation does not inherit it - see the module's
  open discussion on whether the two routes are genuinely separable.

  DIFFERENTIAL DISCIPLINE. Nocturnal motor behaviour is not this disorder. NREM
  parasomnias arise from incomplete arousal out of slow-wave sleep, typically in
  the first third of the night, with confusion and no dream recall; sleep-related
  hypermotor (nocturnal frontal lobe) epilepsy produces stereotyped, brief,
  clustered events. Both occur with an entirely intact REM-atonia circuit. This
  is why the polysomnographic criterion is not a formality: without it the
  entity dissolves into "things people do at night".
pathophysiology:
- name: Alpha-Synuclein Pathology in the Brainstem REM-Atonia Circuit
  description: >-
    The trigger in the common, age-related form. Alpha-synuclein aggregates and
    associated neuronal loss and gliosis involve the pontomedullary structures
    that generate REM atonia - the subcoeruleus nucleus (the human homologue of
    the rodent sublaterodorsal nucleus), the gigantocellular reticular nucleus,
    and the laterodorsal tegmentum - at a stage when nigrostriatal and cortical
    structures are still relatively spared. The anatomical specificity is the
    point: this is not incidental pathology in a diffusely affected brain but
    involvement of the exact circuit whose failure the syndrome expresses, which
    is what licenses reading the parasomnia as a topographically early stage of
    the disease rather than as an associated feature. Alternative triggers
    substitute at this node: a structural pontine lesion, the state instability
    of narcolepsy type 1, or serotonergic/noradrenergic antidepressant exposure.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "rem_sleep_atonia_control_failure#Lesion of the Pontine REM-Atonia Generator"
  cell_types:
  - preferred_term: neuron of the subcoeruleus and pontomedullary REM-atonia circuit
    term:
      id: CL:0000540
      label: neuron
    modifier: DECREASED
  locations:
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:39577924
    reference_title: "Post-mortem neuropathology of idiopathic rapid eye movement sleep behaviour disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all participants, α-synuclein was found in the structures that regulate
      REM sleep atonia (eg, subcoeruleus nucleus, gigantocellular reticular
      nucleus, laterodorsal tegmentum, and amygdala).
    explanation: >-
      Direct post-mortem demonstration, in every case examined, that the
      pathology sits in the specific atonia-regulating structures - the
      anatomical specificity this node asserts.
  - reference: PMID:39577924
    reference_title: "Post-mortem neuropathology of idiopathic rapid eye movement sleep behaviour disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-mortem neuropathological diagnoses were Lewy body disease in 19 (95%)
      and multiple system atrophy (MSA) in one (5%).
    explanation: >-
      Establishes that the underlying pathology is a synucleinopathy in
      essentially all cases coming to autopsy, which is the basis for curating
      the degenerative aetiology as the principal trigger.
  - reference: PMID:17412731
    reference_title: Pathophysiology of REM sleep behaviour disorder and relevance to neurodegenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging data from the few published human cases with RBD associated
      with structural lesions in the brainstem are presented, in which the dorsal
      midbrain and pons are implicated.
    explanation: >-
      The lesional substitution at this node - a discrete structural lesion at
      the same site reproduces the syndrome, which is what makes the location
      rather than the pathology the causal factor.
  downstream:
  - target: Loss of Descending Drive to Inhibitory Premotor Neurons
    description: >-
      Loss of the REM-on population removes the excitatory drive its descending
      axons carry to medullary and spinal inhibitory premotor neurons.
    causal_link_type: DIRECT

- name: Loss of Descending Drive to Inhibitory Premotor Neurons
  description: >-
    REM atonia is actively imposed rather than passively permitted: glutamatergic
    REM-on neurons excite glycinergic and GABAergic premotor neurons in the
    ventromedial medulla and spinal cord, which hyperpolarise skeletal motor
    neurons. Losing the descending drive releases motor neurons from an inhibition
    that should be present. The critical anatomical fact is that this descending
    pathway is separate from the ascending pathway generating the EEG features of
    REM sleep - so atonia can be lost while REM sleep itself proceeds entirely
    normally, which is exactly what polysomnography shows in these patients.
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "rem_sleep_atonia_control_failure#Loss of Descending Glutamatergic Drive to Inhibitory Premotor Neurons"
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: DECREASED
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  evidence:
  - reference: PMID:17884926
    reference_title: "The pontine REM switch: past and present."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the REM-on area are two populations of glutamatergic neurons, the first
      of which projects to the basal forebrain and regulates EEG components of
      REM sleep and the second of which projects to the ventromedial medulla and
      spinal cord and regulates atonia during REM sleep.
    explanation: >-
      Establishes the two-population anatomy on which this node and the
      dissociation below it depend.
  - reference: PMID:17884926
    reference_title: "The pontine REM switch: past and present."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings demonstrating independent pathways mediating atonia and the
      EEG components of REM provide a basis for their occasional dissociation in
      pathological states, e.g. REM sleep behaviour disorder.
    explanation: >-
      Names this disorder as the pathological instance of the dissociation,
      which is the mechanistic claim of the entry.
  downstream:
  - target: REM Sleep Without Atonia
    description: >-
      Without descending excitation of the inhibitory premotor pool, skeletal
      motor neurons are not hyperpolarised during REM sleep and muscle tone
      persists.
    causal_link_type: DIRECT

- name: REM Sleep Without Atonia
  description: >-
    The central, measurable abnormality: excess tonic or phasic electromyographic
    activity scored during REM sleep. It is graded rather than binary, and its
    magnitude carries prognostic weight - quantified atonia loss is among the
    significant predictors of phenoconversion. It is also separable from the
    clinical behaviours: population screening finds isolated REM sleep without
    atonia roughly nine times more often than full disorder, which suggests it is
    the earlier and more sensitive marker of the same process, though whether
    every case progresses is unknown.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "rem_sleep_atonia_control_failure#Failure of REM Sleep Skeletal Muscle Atonia"
  biological_processes:
  - preferred_term: REM sleep
    term:
      id: GO:0042747
      label: circadian sleep/wake cycle, REM sleep
    modifier: ABNORMAL
  - preferred_term: skeletal muscle contraction during REM sleep
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: INCREASED
  evidence:
  - reference: PMID:30166532
    reference_title: REM sleep behaviour disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A clinical history of dream enactment or complex motor behaviours together
      with the presence of muscle activity during REM sleep confirmed by video
      polysomnography are mandatory for a definite RBD diagnosis.
    explanation: >-
      Establishes the measurement standard for this node and that it is
      mandatory rather than supportive.
  - reference: PMID:37816644
    reference_title: "REM Sleep Behavior Disorder and Its Possible Prodromes in General Population: Prevalence, Polysomnography Findings, and Associated Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sex and DEB frequency-adjusted prevalence of RBD was 1.4% (95% CI
      1.0%-1.8%), isolated RWA was 12.5% (95% CI 11.3%-13.6%), and isolated DEB
      was 3.4% (95% CI 2.7%-4.1%).
    explanation: >-
      Quantifies the dissociation this node describes: isolated REM sleep
      without atonia is roughly nine times commoner in the population than the
      full disorder.
  downstream:
  - target: Dream Enactment Behaviour
    description: >-
      With motor neurons no longer inhibited, the motor programmes generated
      during REM dreaming are executed.
    causal_link_type: DIRECT

- name: Dream Enactment Behaviour
  description: >-
    Released motor output takes the form of behaviour matched to dream content -
    the observation that ties the syndrome to REM physiology rather than to a
    nonspecific motor release. Because dream content in this population is
    disproportionately confrontational, the behaviours are frequently violent,
    and injury to the patient or bed partner is the presenting problem. Unlike an
    NREM parasomnia the episodes are not preceded by confusional arousal, and the
    patient wakes alert with dream recall that matches the observed behaviour.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "rem_sleep_atonia_control_failure#Motor Enactment of Dream Content During REM Sleep"
  biological_processes:
  - preferred_term: muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: INCREASED
  evidence:
  - reference: PMID:17412731
    reference_title: Pathophysiology of REM sleep behaviour disorder and relevance to neurodegenerative disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      REM sleep behaviour disorder (RBD) is a parasomnia characterized by the
      loss of normal skeletal muscle atonia during REM sleep with prominent motor
      activity accompanying dreaming.
    explanation: >-
      Links the released motor activity specifically to dreaming, which is what
      distinguishes this node from a generic nocturnal motor phenomenon.
  downstream:
  - target: Sleep-Related Injury
    description: >-
      Violent enacted behaviour causes injury to the patient and bed partner.
    causal_link_type: DIRECT
  - target: Progression to Overt Synucleinopathy
    description: >-
      Where the trigger is degenerative, the same alpha-synuclein pathology
      spreads beyond the brainstem to nigral and cortical structures. This edge
      does not apply to the antidepressant-associated or purely lesional forms.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Sleep-Related Injury
  description: >-
    The immediate consequence, and the one management addresses: bruising,
    lacerations, fractures, subdural haematoma, and injury to the bed partner.
    Environmental safety measures - removing bedside weapons and hard objects,
    padding, sleeping separately in severe uncontrolled cases - are graded as a
    good-practice statement necessary for appropriate management, ahead of any
    drug recommendation, which is an unusual ordering and reflects that the
    modifiable risk here is mechanical rather than pharmacological.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is critically important to help patients maintain a safe sleeping
      environment to prevent potentially injurious nocturnal behaviors.
    explanation: >-
      The guideline's good-practice statement, which establishes injury
      prevention as the primary management objective at this node.

- name: Progression to Overt Synucleinopathy
  description: >-
    The second consequence, of a different kind and applying only to the
    degenerative route. The brainstem pathology spreads to involve nigral and
    limbic-cortical structures, and the patient converts to Parkinson disease,
    dementia with Lewy bodies, or multiple system atrophy. Conversion runs at
    about 6.3% per year, reaching 73.5% by twelve years - high, but neither
    immediate nor universal, and the distinction matters when counselling. The
    post-mortem series adds a topographic dimension worth preserving: those who
    remained free of another neurological disorder, or who developed Parkinson
    disease without dementia, had alpha-synuclein largely confined to brainstem
    and limbic system with few coexisting pathologies, whereas those who
    developed dementia had diffuse cortical involvement and frequent comorbid
    Alzheimer pathology - so the destination, not just the timing, tracks the
    extent of spread.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30789229
    reference_title: "Risk and predictors of dementia and parkinsonism in idiopathic REM sleep behaviour disorder: a multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall conversion rate from iRBD to an overt neurodegenerative
      syndrome was 6.3% per year, with 73.5% converting after 12-year follow-up.
    explanation: >-
      Quantifies the conversion risk in a 1280-patient multicentre cohort, which
      is what allows this node to state a rate rather than an association.
  - reference: PMID:39577924
    reference_title: "Post-mortem neuropathology of idiopathic rapid eye movement sleep behaviour disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In individuals with IRBD without any other neurological disorder and in
      those who developed Parkinson's disease without dementia, α-synuclein was
      found in the brainstem and limbic system and rarely in the cortex, whereas
      coexisting proteinopathies were few and showed mild pathological burden.
    explanation: >-
      Supports the topographic claim in the node description - that the clinical
      destination tracks the anatomical extent of spread, not merely its
      duration.
  - reference: PMID:39577924
    reference_title: "Post-mortem neuropathology of idiopathic rapid eye movement sleep behaviour disorder: a case series."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concomitant pathologies are frequent and their role remains to be
      clarified: some might have contributed to the development of dementia, but
      some might be age-related changes.
    explanation: >-
      Cited as PARTIAL because it withholds the causal reading of the comorbid
      pathologies rather than supporting it - the association with dementia is
      observed, its causal contribution explicitly not established.

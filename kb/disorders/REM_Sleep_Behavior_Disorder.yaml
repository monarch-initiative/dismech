discussions:
- discussion_id: gap_neuroprotection_trial_window
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can the decade-long prodromal window in this disorder be used to demonstrate
    neuroprotection, and what endpoint would show it?
  attaches_to:
  - pathophysiology#Progression to Overt Synucleinopathy
  rationale: >-
    This entry describes the most favourable setting neurodegeneration offers for
    a disease-modifying trial: an objectively verifiable marker, a defined
    at-risk population, a conversion rate high enough to power a trial (142-366
    patients per arm on published estimates), and roughly a decade of lead time
    before overt disease. Nothing has been shown to alter that trajectory, and
    the obstacle is partly an endpoint problem. Phenoconversion is a clinical
    diagnosis made years downstream and is a coarse, late outcome; the entry's
    own central node (quantified atonia loss) is closer to the pathology but its
    relationship to progression elsewhere in the brain is itself unresolved.
    Whether a shorter-term biological endpoint can substitute determines whether
    trials in this population are feasible at all.
  proposed_experiments:
  - experiment_id: exp_rbd_surrogate_endpoint_validation
    name: Validation of short-term progression markers against phenoconversion
    description: >-
      In an existing multicentre isolated-REM-sleep-behavior-disorder cohort with
      long follow-up, test candidate short-horizon markers - seed-amplification
      assay alpha-synuclein status, serial dopamine-transporter imaging,
      quantitative atonia loss, olfactory and autonomic measures - against
      observed phenoconversion, to establish whether any change over two to three
      years predicts the clinical endpoint well enough to serve as a trial
      outcome.
- discussion_id: gap_isolated_rwa_natural_history
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does isolated REM sleep without atonia, nine times commoner than the full
    disorder, carry the same prodromal meaning?
  attaches_to:
  - pathophysiology#REM Sleep Without Atonia
  rationale: >-
    Population screening finds isolated REM sleep without atonia in 12.5% of
    adults aged 50-80, against 1.4% with the full disorder. If that finding
    carried the same phenoconversion risk, it would imply a prodromal
    synucleinopathy population an order of magnitude larger than currently
    recognised - which is either a major public-health observation or evidence
    that the polysomnographic marker is far less specific than its use as a
    mandatory criterion assumes. The entry curates the two as separable for that
    reason, and the question is directly answerable by follow-up rather than
    requiring new methods.
  proposed_experiments:
  - experiment_id: exp_isolated_rwa_prospective_followup
    name: Prospective follow-up of population-ascertained isolated atonia loss
    description: >-
      Long-term prospective surveillance of population-screened individuals with
      isolated REM sleep without atonia, isolated dream enactment, and neither,
      with incident parkinsonism and dementia as outcomes, to establish whether
      the polysomnographic marker alone confers the risk attached to the full
      syndrome.

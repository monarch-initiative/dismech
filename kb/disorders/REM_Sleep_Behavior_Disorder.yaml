diagnosis:
- name: Video polysomnography with quantified REM atonia scoring
  description: >-
    The mandatory diagnostic test, and the only one that establishes the entity.
    Submental (with or without limb) electromyographic activity is scored during
    REM sleep, and simultaneous video captures the behaviours. "Any" EMG activity
    at a threshold around 22% performs best against clinical diagnosis in
    population screening. Screening questionnaires are not adequate substitutes:
    a positive RBD screening questionnaire had good specificity but a positive
    predictive value under 8% in the general population, meaning over twelve in
    thirteen screen-positive people do not have the disorder.
  evidence:
  - reference: PMID:37816644
    reference_title: "REM Sleep Behavior Disorder and Its Possible Prodromes in General Population: Prevalence, Polysomnography Findings, and Associated Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the RWA parameters, any EMG activity showed the best association with
      the RBD and its possible prodromes (area under the curve, 0.917).
    explanation: >-
      Identifies the best-performing polysomnographic parameter for this
      diagnosis.
  - reference: PMID:37816644
    reference_title: "REM Sleep Behavior Disorder and Its Possible Prodromes in General Population: Prevalence, Polysomnography Findings, and Associated Factors."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RBDSQ score of ≥5 had good specificity but poor positive predictive value
      (PPV) for RBD (specificity 84.1% and PPV 7.7%)
    explanation: >-
      Cited as REFUTE against the use of questionnaire screening as a
      substitute for polysomnography at population level, which is the practical
      point this diagnostic entry makes.
treatments:
- name: Sleep Environment Safety Measures
  description: >-
    Removal of bedside weapons and injury-capable objects, padding of sharp
    furniture and headboard, soft floor covering beside the bed, and separate
    sleeping arrangements in severe uncontrolled cases. Graded as a good-practice
    statement whose implementation is necessary for appropriate management -
    that is, ahead of any pharmacological recommendation in the guideline's own
    ordering. It addresses the injury consequence directly and has no mechanistic
    action, which is precisely why it is the most reliably effective
    intervention available.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Sleep-Related Injury
    treatment_effect: INHIBITS
    description: >-
      Removes the physical means of injury without altering the released motor
      behaviour, acting on the consequence rather than on any upstream node.
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The following good practice statement is based on expert consensus, and its
      implementation is necessary for the appropriate and effective management of
      patients with RBD
    explanation: >-
      Records both the recommendation and its evidence basis (expert consensus),
      and its placement ahead of the graded drug recommendations.
- name: Clonazepam
  description: >-
    Low-dose benzodiazepine that suppresses the enacted behaviours. It acts on
    the behavioural effector node and is not disease-modifying; the AASM
    recommendation is conditional. Sedation, falls and cognitive effects are
    material concerns in a population that is by definition in a
    neurodegenerative prodrome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
  target_mechanisms:
  - target: Dream Enactment Behaviour
    treatment_effect: INHIBITS
    description: >-
      Suppresses released motor behaviour without restoring REM atonia or
      altering the underlying pathology.
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AASM suggests that clinicians use clonazepam (vs no treatment) for the
      treatment of isolated RBD in adults. (CONDITIONAL).
    explanation: >-
      Cited as PARTIAL because the guideline's own strength assignment is
      conditional rather than strong.
- name: Immediate-Release Melatonin
  description: >-
    The alternative symptomatic agent, generally preferred where sedation, falls,
    or cognitive impairment make a benzodiazepine unattractive. Also a
    conditional recommendation, and also acting on the behavioural node rather
    than on the pathology.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: melatonin
      term:
        id: CHEBI:16796
        label: melatonin
  target_mechanisms:
  - target: Dream Enactment Behaviour
    treatment_effect: INHIBITS
    description: >-
      Reduces frequency and intensity of enacted behaviours; not shown to restore
      REM atonia or to alter progression.
  evidence:
  - reference: PMID:36515157
    reference_title: "Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AASM suggests that clinicians use immediate-release melatonin (vs no

animal_models:
- name: Dichromatic male squirrel monkey lacking L opsin
  species: Squirrel monkey (Saimiri sciureus)
  genotype: Hemizygous males carrying an M-class allele at the single X-linked opsin locus
  publication: PMID:19759534
  description: >-
    In squirrel monkeys a single polymorphic X-linked opsin locus makes all males
    dichromatic. Males lacking an L-opsin allele behave as protanopes; they were
    used to test L-opsin gene addition.
  modeled_mechanisms:
  - target: Absence of an Expressed L-Class Opsin Gene
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Naturally L-opsin-deficient dichromatic primate with S and M-class cones only.
    limitations: >-
      Dichromacy arises from allelic variation at a single X-linked locus, not from
      unequal recombination in a tandem L/M array, so the model does not reproduce
      the human mutational mechanism or hybrid-gene genotypes.
    evidence:
    - reference: PMID:10413401
      reference_title: "The evolution of trichromatic color vision by opsin gene duplication in New World and Old World primates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        most New World primates have only a single polymorphic X-linked opsin gene;
        all males are dichromats and trichromacy is achieved only in those females
        that possess a different form of this gene on each X chromosome.
      explanation: >-
        Explains why male New World monkeys such as the squirrel monkey are natural
        X-linked dichromats.
      quote_role: BACKGROUND
    - reference: PMID:21167193
      reference_title: "The genetics of normal and defective color vision."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The treated monkeys were protanopes and after treatment, a subset of the cones
        co-expressed L-pigment with the native M pigment.
      explanation: >-
        The model animals were protanopes.
      quote_role: REVIEW_SYNTHESIS
  - target: Loss of L-versus-M Cone Opponent Signal
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      L-opsin gene addition in adult animals produced trichromatic behaviour on a
      colour discrimination task.
    limitations: >-
      Only a fraction of M cones co-expressed the transgene; long-term safety and
      human translation are untested.
    evidence:
    - reference: PMID:19759534
      reference_title: "Gene therapy for red-green colour blindness in adult primates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        here we show that the addition of a third opsin in adult red-green
        colour-deficient primates was sufficient to produce trichromatic colour vision
        behaviour.
      explanation: >-
        Adding L opsin restored red-green discrimination capacity in the model.
      quote_role: PRIMARY_RESULT

name: Protan Color Vision Deficiency
creation_date: '2026-10-14T12:36:44Z'
category: Mendelian
parents:
- Color vision disorder
- Congenital stationary cone dysfunction
description: >-
  X-linked red-green color vision deficiency of the protan type, in which the
  long-wavelength-sensitive (L) cone contribution to vision is absent. It covers
  the dichromatic form, protanopia, and the anomalous trichromatic form,
  protanomaly. The X-chromosome opsin gene array at Xq28 normally carries one
  OPN1LW (L-opsin) gene followed by one or more OPN1MW (M-opsin) genes, and only
  the first two genes are expressed. Unequal homologous recombination between the
  highly similar genes in female meiosis produces arrays that lack OPN1LW or
  replace it with a 5'L-3'M hybrid gene whose product absorbs in the M range, so
  every expressed gene encodes an M-class pigment. Cones that would have been L
  cones contain M-class pigment instead. When the expressed pigments are
  spectrally identical the result is protanopia; when they differ by a few
  nanometres the result is protanomaly, whose severity scales with that spectral
  separation. Affected males have reduced red-green discrimination and reduced
  sensitivity to long-wavelength (red) light. No disease-modifying treatment
  exists; gene addition of L opsin restored trichromatic behaviour in adult
  dichromatic squirrel monkeys but has not been tested in humans.
disease_term:
  preferred_term: red color blindness
  term:
    id: MONDO:0010565
    label: red color blindness
synonyms:
- red color blindness
- protan defect
- protanopia
- colorblindness, protan
- colorblindness, partial, protan series
- partial achromatopsia, protan type
notes: >-
  Scope. The MONDO term (OMIM:303900, Orphanet:319691) is labelled red color
  blindness and its definition describes protanopia, but its OMIM source is the
  whole protan series, so this entry covers protanopia and protanomaly as
  subtypes. OLS searches of MONDO and ORDO for "protanopia" and "protanomaly"
  return no term for either form beyond MONDO:0010565 itself; HPO
  has phenotype terms for both (HP:0011522 Protanopia, HP:0200018 Protanomaly),
  which are bound on the phenotypes. Lump/split: protan and deutan defects share
  the array-rearrangement mechanism, but MONDO, OMIM and Orphanet keep them as
  separate diseases, the expressed pigment class differs (only M-class pigments
  in protans, only L-class in deutans), protans alone have reduced sensitivity to
  red light, and deutan defects are more than twice as common in the prevalence surveys cited below. The deutan defect
  (MONDO:0010564, OPN1MW side of the array) and the tritan defect (MONDO:0008610,
  OPN1SW) therefore have their own stubs and are not subtypes here. Blue cone
  monochromacy (loss of both L and M cone function) has its own entry. OPN1LW
  exon 3 haplotypes that cause exon skipping (LIAVA) and OPN1LW truncations remove
  L pigment completely and give protanopia, but together with early-onset high
  myopia and reduced cone density; these allelic disorders (X-linked cone
  dysfunction syndrome with myopia, MONDO:0010446, including Bornholm eye
  disease) are listed under differential diagnosis rather than curated here. No
  GeneReviews chapter exists for red-green colour vision defects (Bookshelf index
  and a live PubMed genereviews[book] search).
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    The L and M opsin genes lie on the X chromosome at Xq28, so the defect is
    expressed in hemizygous males. Heterozygous protan carriers tend to carry
    fewer L-opsin genes than non-carriers and can be identified molecularly.
  evidence:
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As predicted by inheritance patterns of red-green (Waaler, 1968) and
      blue-yellow (Kalmus, 1955) color vision deficiencies, the genes for human
      long-wavelength (L) and middle-wavelength (M) cone opsins were localized to
      the X-chromosome at Xq28
    explanation: >-
      Places the L and M opsin genes on the X chromosome, the basis of X-linked
      transmission of protan defects.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:22472762
    reference_title: "Worldwide prevalence of red-green color deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large random population surveys show that the prevalence of deficiency in
      European Caucasians is about 8% in men and about 0.4% in women
    explanation: >-
      The roughly twentyfold male excess of red-green deficiency is the pattern
      expected of an X-linked recessive trait.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:9893850
    reference_title: "Molecular genetic detection of female carriers of protan defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a molecular genetic method to identify protan carriers that
      involves characterizing the genes that occur in the most upstream position in
      each of the X-chromosome photopigment gene arrays.
    explanation: >-
      Heterozygous females carrying a protan array are a recognised carrier state,
      as expected for an X-linked recessive trait.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
has_subtypes:
- name: Protanopia
  display_name: Protanopia (protan dichromacy)
  description: >-
    Dichromatic form. The X-chromosome array has a single gene encoding an M-class
    pigment (OPN1LW deleted, or replaced by a 5'L-3'M hybrid encoding an M-class
    pigment), or several genes whose first two encode M-class pigments with
    identical spectra. No functional L-cone signal is present.
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  evidence:
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      X-chromosome opsin gene arrays underlying the dichromatic form, protanopia,
      either have a single opsin gene that encodes an M pigment, or have multiple
      genes in which the first two encode opsins that produce M pigments that are
      identical in spectra
    explanation: >-
      Defines the genotypes underlying protanopia.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:33544131
    reference_title: "Revealing How Color Vision Phenotype and Genotype Manifest in Individual Cone Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both protanopes (subjects S9 and S10) carried a single M gene and no L gene.
    explanation: >-
      Genotyped protanopes in a cone-resolved imaging study had a single M gene and
      no L gene.
    quote_role: PRIMARY_RESULT
- name: Protanomaly
  display_name: Protanomaly (protanomalous trichromacy)
  description: >-
    Anomalous trichromatic form. The array lacks a normal L gene and its first two
    genes encode two M-class pigments that differ slightly in spectral peak, for
    example a 5'L-3'M hybrid together with a normal M gene. The two M-class cone
    populations support a weak red-green signal. Because M-class pigments can be
    separated by only a few nanometres, protanomalous observers as a group
    discriminate colours somewhat worse than deuteranomalous observers.
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  evidence:
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The anomalous trichromatic form, protanomaly, is associated with opsin gene
      arrays in which the first two genes encode opsins that produce M pigments that
      differ in spectra.
    explanation: >-
      Defines the genotypes underlying protanomaly.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This can explain why, as a group, protanomalous observers have somewhat poorer
      color discrimination than deuteranomalous observers.
    explanation: >-
      Relates the narrow spectral separation available within the M class to the
      severity of protanomaly.
    quote_role: REVIEW_SYNTHESIS

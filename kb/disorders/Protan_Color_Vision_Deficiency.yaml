  - reference: PMID:35113505
    reference_title: "Limitation of standard pseudoisochromatic plates in identifying colour vision deficiencies when compared with genetic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital colour vision deficiencies are caused by inherited photopigment
      abnormalities (Nathans et al. 1986; Nathans et al. 1986) and impair the
      affected individual’s ability to discriminate colours.
    explanation: >-
      States the discrimination deficit caused by inherited photopigment
      abnormalities.
    quote_role: BACKGROUND
genetic:
- name: OPN1LW
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  inheritance:
  - name: X-linked recessive
  notes: >-
    The causal lesion is usually not a point mutation but an array rearrangement:
    loss of OPN1LW or its replacement by a 5'L-3'M hybrid gene, leaving only M-class
    genes in the expressed positions. Rare protan alleles include OPN1LW exon 3
    haplotypes that cause exon skipping (LIAVA) and truncating variants, which remove
    L pigment completely; these are usually accompanied by early-onset high myopia
    and are treated as allelic disorders. OPN1MW is retained and functional in
    protans.
  evidence:
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A male with a normal S-pigment and one X-chomosome pigment gene encoding an M
      pigment is an obligate protanope.
    explanation: >-
      Loss of all L-class genes from the X-linked array is sufficient for
      protanopia.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27622081
    reference_title: "Genetic Testing as a New Standard for Clinical Diagnosis of Color Vision Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Protan and deutan deficiencies were classified correctly in all subjects
      identified by MassArray as having red-green defects.
    explanation: >-
      Opsin-array genotype predicts protan type in a large cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37097228
    reference_title: "Unique Haplotypes in OPN1LW as a Common Cause of High Myopia With or Without Protanopia: A Potential Window Into Myopic Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 68 families, 42 affected male patients (31 families) with the first
      class of variants (LVAVA or LIVVA in OPN1LW) had eoHM alone, whereas 37 male
      patients with the latter 3 classes had eoHM with protanopia.
    explanation: >-
      Complete loss of L pigment from exon 3 haplotypes or truncations also
      produces protanopia, but together with early-onset high myopia; this allelic
      route is outside the scope of the uncomplicated protan defect.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Pseudoisochromatic plate screening
  description: >-
    Ishihara and Hardy-Rand-Rittler plates are the usual screening tests; HRR
    diagnostic plates classify protan versus deutan type and grade severity. Plates
    miss a substantial fraction of genetically defined colour-deficient males.
  diagnosis_term:
    preferred_term: colour vision testing
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: PMID:35113505
    reference_title: "Limitation of standard pseudoisochromatic plates in identifying colour vision deficiencies when compared with genetic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MassArray identified twice as many colour-deficient males as identified from
      PIC tests alone.
    explanation: >-
      Plate tests alone under-detect colour deficiency compared with genotyping.
    quote_role: PRIMARY_RESULT
- name: Anomaloscopy (Rayleigh match)
  description: >-
    The Nagel anomaloscope classifies X-linked red-green defects by the red-green
    mixture matched to a yellow primary, separating protanopia from protanomaly and
    protan from deutan defects.
  diagnosis_term:
    preferred_term: anomaloscopy
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: PMID:15290149
    reference_title: "The Nagel anomaloscope: its calibration and recommendations for diagnosis and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Nagel anomaloscope Model I is the definitive clinical instrument for
      classifying phenotypic variations in X-linked color-vision disorders.
    explanation: >-
      Anomaloscopy is the reference test for classifying protan type and form.
    quote_role: BACKGROUND
- name: Opsin gene array analysis
  description: >-
    Analysis of the OPN1LW/OPN1MW array (gene copy number, gene order and
    spectral-tuning sites) identifies the protan genotype, estimates severity and
    detects carrier females.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27622081
    reference_title: "Genetic Testing as a New Standard for Clinical Diagnosis of Color Vision Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MassArray assay provides genetic information that can be useful in the
      diagnosis of inherited color vision deficiency including presence versus
      absence, type, and severity
    explanation: >-
      Genotyping gives type and severity of the defect.
    quote_role: PRIMARY_RESULT
  - reference: PMID:9893850
    reference_title: "Molecular genetic detection of female carriers of protan defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a molecular genetic method to identify protan carriers that
      involves characterizing the genes that occur in the most upstream position in
      each of the X-chromosome photopigment gene arrays.
    explanation: >-
      Molecular analysis of the first array gene detects protan carriers.
    quote_role: PRIMARY_RESULT
differential_diagnoses:
- name: Deutan color vision deficiency

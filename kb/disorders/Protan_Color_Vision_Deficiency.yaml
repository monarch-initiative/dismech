  evidence:
  - reference: PMID:15518188
    reference_title: "Molecular genetics of color-vision deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blue-cone monochromacy is a rare disorder that involves absence of L- and
      M-cone function.
    explanation: >-
      Distinguishes the two-cone-class loss of BCM from the single-class loss in
      protans.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34440353
    reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Three other subjects received a clinical diagnosis of blue cone monochromacy
      (BCM160-23130, ZD314-18057, BCM51-12359), but all three have genotypes
      consistent with protanopia, not blue cone monochromacy, and color vision tests
      performed were not adequate to reliably detect BCM.
    explanation: >-
      Genotyping reclassified clinically diagnosed BCM cases as protanopia.
    quote_role: PRIMARY_RESULT
- name: X-linked cone dysfunction syndrome with myopia
  description: >-
    Allelic OPN1LW disorders (Bornholm eye disease and related exon 3 haplotype
    disease) combine protanopia or deuteranopia with high myopia and reduced cone
    function.
  disease_term:
    preferred_term: X-linked cone dysfunction syndrome with myopia
    term:
      id: MONDO:0010446
      label: X-linked cone dysfunction syndrome with myopia
  distinguishing_features:
  - Early-onset high myopia and reduced cone density or function.
  - OPN1LW exon 3 haplotypes (LIAVA, LVAVA, LIVVA) or truncating variants rather than a hybrid-gene array.
  evidence:
  - reference: PMID:34440353
    reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Males with an OPN1LWLIAVA gene and an OPN1MW gene that is transcribed and
      translated into functional photopigment will have protanopia because all L
      cones will be devoid of photopigment.
    explanation: >-
      The LIAVA route empties L cones of pigment rather than refilling them with
      M-class pigment.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37097228
    reference_title: "Unique Haplotypes in OPN1LW as a Common Cause of High Myopia With or Without Protanopia: A Potential Window Into Myopic Mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is different from the replacement of red with green owing to unequal
      re-arrangement causing red-green colorblindness alone.
    explanation: >-
      Separates the high-myopia OPN1LW disorders from ordinary protan defects.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23322568
    reference_title: "Variations in opsin coding sequences cause x-linked cone dysfunction syndrome with myopia and dichromacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All except one of the BED families possessed L opsin genes that contained a
      rare exon 3 haplotype. The exception was a family with the deleterious
      Cys203Arg substitution.
    explanation: >-
      Bornholm eye disease families carry rare exon 3 haplotypes or Cys203Arg in the
      L opsin gene rather than the hybrid-gene arrays of ordinary protan defects.
    quote_role: PRIMARY_RESULT
treatments:
- name: Colour-enhancing filter glasses
  description: >-
    Commercial notch-filter (EnChroma) and other colour-enhancing (VINO) spectacles
    alter the relative stimulation of the remaining cones. They do not restore the
    missing L cone class. A controlled study found no overall improvement on clinical
    colour tests with EnChroma lenses; another found a functionally meaningful change
    on the CAD test only with VINO glasses. Tinted ChromaGen lenses reduced plate-test
    errors without reducing severity, and no protanope passed any test with them.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: colour-enhancing spectacles
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Red-green dyschromatopsia
    term:
      id: HP:0000642
      label: Red-green dyschromatopsia
  evidence:
  - reference: PMID:36242261
    reference_title: "Do EnChroma glasses improve performance on clinical tests for red-green color deficiencies?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparing the performance of 86 well-categorized CVD observers and 24 controls
      on two clinical tests we report no overall improvement when EnChroma lenses were
      worn.
    explanation: >-
      Controlled study finding no overall benefit of EnChroma lenses on clinical
      colour tests in red-green deficient observers.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36242206
    reference_title: "Effects of color-enhancing glasses on color vision in congenital red-green color deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there was a statistically significant effect of both glasses, only
      that of VINO could be considered functionally meaningful.
    explanation: >-
      In red-green deficient individuals with characterised opsin arrays, only VINO
      glasses gave a functionally meaningful change in CAD thresholds.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36189411
    reference_title: "Color vision devices for color vision deficiency patients: A systematic review and meta-analysis."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      This review concludes that commercially available color vision devices, such as
      EnChroma Glasses, Chromagen filters, and EnChroma Cx-14 do not provide
      clinically significant evidence that subjective color perception has improved.
    explanation: >-
      Systematic review finding no clinically significant benefit of colour vision
      devices.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41806157
    reference_title: "Impact of ChromaGen lenses on colour vision test performance of individuals with congenital colour vision deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dichromatic individuals showed minimal improvement, with none of the
      participants with protanopia passing any of the tests using any ChromaGen lens.
    explanation: >-
      In a study including 5 protanopes and 18 protanomalous males, tinted ChromaGen
      lenses lowered plate-test error counts but no protanope passed any test.
    quote_role: PRIMARY_RESULT

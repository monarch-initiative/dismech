  - reference: PMID:19759534
    reference_title: "Gene therapy for red-green colour blindness in adult primates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with L but no M cones (termed deuteranopes) have a relatively
      enhanced sensitivity to red light but they are still as dichromatic as
      individuals with M but no L cones (protanopes), in that they are unable to
      distinguish particular “colours” from grey.
    explanation: >-
      Describes the colour-confusion deficit of human protanopes; the statement is

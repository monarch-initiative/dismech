pathophysiology:
- name: Unequal Recombination in the Xq28 L/M Opsin Gene Array
  description: >-
    The L and M pigments share 96% amino acid identity and their genes sit in a
    head-to-tail tandem array. Misalignment of the arrays in female meiosis followed
    by an intergenic or intragenic crossover (unequal homologous recombination, with
    gene conversion as a further route) yields arrays that have lost OPN1LW or carry
    a 5'L-3'M hybrid gene in its place. This germline rearrangement is the
    initiating lesion for most protan defects; rarer routes include inactivating
    OPN1LW exon 3 haplotypes and truncating variants.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  - preferred_term: OPN1MW
    term:
      id: hgnc:4206
      label: OPN1MW
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:3485310
    reference_title: "Molecular genetics of inherited variation in human color vision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypothesis that red-green "color blindness" is caused by alterations in
      the genes encoding red and green visual pigments has been tested and shown to
      be correct.
    explanation: >-
      Founding genotype study of red-green colour vision deficiency.
    quote_role: PRIMARY_RESULT
  - reference: PMID:3485310
    reference_title: "Molecular genetics of inherited variation in human color vision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observed genotypes appear to result from unequal recombination or gene
      conversion (or both).
    explanation: >-
      Identifies unequal recombination and gene conversion as the mutational
      mechanism in affected males.
    quote_role: PRIMARY_RESULT
  - reference: PMID:2937147
    reference_title: "Molecular genetics of human color vision: the genes encoding blue, green, and red pigments."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The red and green pigments show 96 percent mutual identity but only 43
      percent identity with the blue pigment.
    explanation: >-
      The near-identity of L and M opsin sequences is what predisposes the array to
      misalignment.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:15811001
    reference_title: "The molecular basis of variation in human color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The high homology between these genes has predisposed the locus to relatively
      common unequal recombination events that give rise to red/green hybrid genes
      and to deletion of the green-pigment genes. Such events constitute the most
      common cause of red-green color vision defects.
    explanation: >-
      Review synthesis that unequal recombination producing hybrid genes is the
      common cause of red-green defects.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inherited color vision deficiencies can be explained by gene rearrangements
      that arose through unequal homologous recombination in females during meiosis
    explanation: >-
      Places the recombination events in female meiosis.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the protan-causing array the one remaining opsin gene is a hybrid between
      the parental L and M genes.
    explanation: >-
      Describes the protan product of an intragenic crossover.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Absence of an Expressed L-Class Opsin Gene
    causal_link_type: DIRECT
    description: >-
      The rearranged array no longer has a gene encoding an L-class pigment in
      either of the two expressed positions.
    evidence:
    - reference: PMID:1411542
      reference_title: "Absorption spectra of the hybrid pigments responsible for anomalous color vision."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Unequal homologous recombination events between green and red cone pigment
        genes produce the red-green or green-red hybrid pigment genes found in many
        individuals with variant color vision.
      explanation: >-
        The recombination products are the hybrid pigment genes found in
        individuals with variant colour vision.
      quote_role: BACKGROUND
- name: Absence of an Expressed L-Class Opsin Gene
  description: >-
    Only the first two genes of the X-linked array are expressed in the retina. In
    protans neither expressed gene encodes an L-class pigment: the expressed genes
    are normal OPN1MW copies or 5'L-3'M hybrids. Spectral tuning is dominated by
    exon 5, which accounts for a shift of roughly 15 to 25 nm, so a hybrid carrying
    M-type exon 5 encodes an M-class pigment whatever its 5' exons.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: OPN1LW
    term:
      id: hgnc:9936
      label: OPN1LW
  molecular_functions:
  - preferred_term: long-wavelength G protein-coupled photoreceptor activity
    term:
      id: GO:0008020
      label: G protein-coupled photoreceptor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15518188
    reference_title: "Molecular genetics of color-vision deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Analysis of the gene order in arrays of normal and deutan subjects indicates
      that only the two most proximal genes of the array contribute to the
      color-vision phenotype.
    explanation: >-
      Only the two most upstream genes determine the phenotype.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21167193
    reference_title: "The genetics of normal and defective color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Protan defects are characterized by the absence of an L cone contribution to
      vision.
    explanation: >-
      Defines the protan defect as absence of L-cone contribution.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:1411542
    reference_title: "Absorption spectra of the hybrid pigments responsible for anomalous color vision."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Amino acids encoded by exons 2, 3, 4, and 5 produce spectral shifts at the
      wavelength of maximal absorbance of 0 to 4, 0 to 4, 3 to 4, and 15 to 21
      nanometers, respectively
    explanation: >-
      Expressed hybrid pigments show that exon 5 carries most of the L versus M
      spectral difference, explaining why 5'L-3'M hybrids encode M-class pigments.
    quote_role: PRIMARY_RESULT
  - reference: PMID:9822760
    reference_title: "Red, green, and red-green hybrid pigments in the human retina: correlations between deduced protein sequences and psychophysically measured spectral sensitivities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 54% of the single-gene protanopes (and approximately 19% of all
      protanopes) possess any one of several 5'red-3'green hybrid genes that encode
      anomalous pigments
    explanation: >-
      Genotyped protanopes frequently carry 5'L-3'M hybrid genes rather than a
      plain loss of OPN1LW.
    quote_role: PRIMARY_RESULT
  - reference: PMID:11772996
    reference_title: "The molecular basis of dichromatic color vision in males with multiple red and green visual pigment genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most genotypes (92%) included hybrid genes whose sequence and position and
      whose encoded pigment correlated exactly with the phenotype.
    explanation: >-
      In multigene dichromats (including 23 protanopes) the position and sequence of
      hybrid genes predicted the phenotype.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: L Cones Filled with M-Class Photopigment
    causal_link_type: DIRECT
    description: >-
      Cones that would express L opsin instead express the M-class pigment encoded
      by the remaining genes.
- name: L Cones Filled with M-Class Photopigment
  description: >-
    Protan retinas contain M-class and S cones but no functional L cones. Fundus
    reflectometry and electroretinography in X-linked dichromats fit a replacement
    model, in which the total number of cones is unchanged and the missing cone
    class is replaced by the remaining one. Cone-resolved optoretinography shows
    that the remaining M and S cones respond normally.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: L cone cell
    term:
      id: CL:0003048
      label: L cone cell
  - preferred_term: M cone cell
    term:
      id: CL:0003049
      label: M cone cell
  biological_processes:
  - preferred_term: detection of long-wavelength light in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:33544131
    reference_title: "Revealing How Color Vision Phenotype and Genotype Manifest in Individual Cone Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (3) protanopes are missing L cones but are normal otherwise
    explanation: >-
      Adaptive-optics optoretinography finds no functional L cones in protanopes and
      normal M and S cone responses.
    quote_role: PRIMARY_RESULT
  - reference: PMID:8730604
    reference_title: "Foveal cone mosaic and visual pigment density in dichromats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A replacement model, i.e. one where the total number of cones remains unchanged
      and all cones are filled with a single type of pigment, was found to fit our
      data best.
    explanation: >-
      Foveal reflectometry in protanopes and deuteranopes supports pigment
      replacement rather than cone loss.
    quote_role: PRIMARY_RESULT
  - reference: PMID:10102289
    reference_title: "Cone signal contributions to electroretinograms [correction of electrograms] in dichromats and trichromats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data strongly suggest that the missing cone type in dichromats is replaced
      by the remaining cone type.
    explanation: >-
      Cone-isolating ERG in X-linked dichromats supports replacement of the missing
      cone class.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Loss of L-versus-M Cone Opponent Signal
    causal_link_type: DIRECT
    description: >-
      Without a long-wavelength cone class there is no, or only a weak, difference
      signal for red-green opponent processing.
  - target: Reduced Long-Wavelength Luminous Sensitivity
    causal_link_type: DIRECT
    description: >-
      M-class pigment absorbs poorly at long wavelengths, so sensitivity to red
      light falls.
- name: Loss of L-versus-M Cone Opponent Signal
  description: >-
    Red-green colour discrimination depends on comparing signals from two cone
    classes in the middle-to-long wavelength range. When both expressed pigments are
    spectrally identical (protanopia) the comparison is impossible and vision is
    dichromatic; when they differ by a few nanometres (protanomaly) a weak signal
    remains. Severity is inversely related to the spectral separation between the
    two expressed pigments. Left unbound to GO: the nearest process term,
    GO:0007601 visual perception, is broader than red-green opponent comparison
    and an OLS label/synonym search of GO for "color vision", "colour vision",
    "color discrimination" and "color perception" returned no terms.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:15811001
    reference_title: "The molecular basis of variation in human color vision."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The severity of red-green color vision defects is inversely proportional to
      the difference between the wavelengths of maximal absorption of the
      photopigments encoded by the first two genes of the array.
    explanation: >-
      Links severity to the spectral separation of the two expressed pigments.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34440353
    reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Males have protanopia if the first and second genes specify M cone
      photopigments that are identical in their wavelengths of peak sensitivity or
      if they have a single gene array that encodes an M pigment
    explanation: >-
      Identical M-class pigments give dichromacy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34440353
    reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Males have protanomaly if the first and second genes encode M cone
      photopigments that differ in their wavelengths of peak sensitivity
    explanation: >-
      Two spectrally different M-class pigments give anomalous trichromacy.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Protanopia
    causal_link_type: DIRECT
    description: >-
      Spectrally identical expressed pigments leave no red-green opponent signal.
    evidence:
    - reference: PMID:34440353
      reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Males have protanopia if the first and second genes specify M cone
        photopigments that are identical in their wavelengths of peak sensitivity or
        if they have a single gene array that encodes an M pigment
      explanation: >-
        Genotype-to-phenotype rule for protanopia.
      quote_role: REVIEW_SYNTHESIS
  - target: Protanomaly
    causal_link_type: DIRECT
    description: >-
      Slightly different M-class pigments leave a reduced red-green signal.
    evidence:
    - reference: PMID:34440353
      reference_title: "Intermixing the OPN1LW and OPN1MW Genes Disrupts the Exonic Splicing Code Causing an Array of Vision Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Males have protanomaly if the first and second genes encode M cone
        photopigments that differ in their wavelengths of peak sensitivity
      explanation: >-
        Genotype-to-phenotype rule for protanomaly.
      quote_role: REVIEW_SYNTHESIS
  - target: Red-Green Dyschromatopsia
    causal_link_type: DIRECT
    description: >-
      Both forms share impaired discrimination of hues along the red-green axis.
- name: Reduced Long-Wavelength Luminous Sensitivity
  description: >-
    Because the remaining cones carry M-class pigment, protans are relatively
    insensitive to long-wavelength light; red lights look dim and are seen at a
    shorter range. In laboratory spectral sensitivity data every protan had lower
    red-light sensitivity than the least sensitive colour-normal observer, which
    bears on recognition of red signal lights and on occupational and driving
    standards.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12135418
    reference_title: "Protan colour vision deficiency and road accidents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A laboratory study of the spectral sensitivity of protan and colour normal
      subjects that largely removes these sources' variability shows that all protans
      have a sensitivity to red light that is less than that of the least sensitive
      colour normal.
    explanation: >-
      Re-analysis of spectral sensitivity data shows uniformly reduced red-light
      sensitivity in protans.
    quote_role: PRIMARY_RESULT
  - reference: PMID:12135418
    reference_title: "Protan colour vision deficiency and road accidents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Field trial data show that protans have a very reduced visual range for red
      signals compared to colour normal observers
    explanation: >-
      Field trials show a reduced range at which red signals are seen.
    quote_role: PRIMARY_RESULT
  - reference: PMID:14702998
    reference_title: "Traffic signal color recognition is a problem for both protan and deutan color-vision deficients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      response times of deuteranopes and protanopes were 53% and 35% longer than
      those of color normals
    explanation: >-
      Protanopes identified simulated red traffic lights more slowly than colour
      normals. The same study found deuteranopes slower still, so slowed signal
      recognition is not specific to the protan red-light deficit.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
phenotypes:

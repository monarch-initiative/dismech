treatments:
- name: Low-vision rehabilitation and hearing amplification
  description: >-
    No disease-modifying treatment exists. Management is supportive on both
    axes: low-vision support and monitoring for the retinal dystrophy, and
    amplification or other audiological management for the progressive hearing
    loss. Because either organ may present alone, the practical intervention
    with the clearest recommendation behind it is cross-referral - assessing the
    eyes of a patient who presents with hearing loss and vice versa.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Cone/cone-rod dystrophy
    term:
      id: HP:0000548
      label: Cone/cone-rod dystrophy
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also recommend ophthalmological evaluation and follow-up in patients with isolated SNHL, and conversely.
    explanation: >-
      The cross-referral recommendation that the supportive management rests on.
diagnosis:
- name: Retinal assessment with electroretinography and high-resolution imaging
  description: >-
    Full-field and macular electroretinography with optical coherence tomography
    and, where available, adaptive-optics imaging. Adaptive optics was needed to
    see the reduced foveal cone density in the Japanese family, and the authors
    recommended high-resolution imaging specifically because the
    ophthalmological phenotype can be so mild. Fundus appearance is unreliable:
    it was normal in all three CEP250 patients of one series.
  results: >-
    Cone-predominant electroretinographic abnormality, often with an absent
    macular response and only mild scotopic change; reduced foveal cone density
    on adaptive optics; outer retinal atrophy on optical coherence tomography.
  diagnosis_term:
    preferred_term: retinal examination
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: PMID:29718797
    reference_title: CEP250 mutations associated with mild cone-rod dystrophy and sensorineural hearing loss in a Japanese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because the ophthalmological phenotypes were very mild, high-resolution retinal imaging analysis, such as AO, will be helpful in diagnosing CEP250-associated disease.
    explanation: >-
      The authors' explicit recommendation for how to detect the retinal
      component.
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field electroretinography showed only mild alterations in the scotopic flash electroretinography (ERG), as the amplitudes of the b-wave were reduced in the right eye and absent in the left eye. Macular ERG showed an absence of response in both eyes, and Visual Evoked Potentials (VEP) were altered (Supplemental Fig. S1).
    explanation: >-
      Shows that the macular electroretinogram carried the abnormality while the
      full-field scotopic response was only mildly affected, which is why macular
      as well as full-field testing is specified here.
- name: Audiometry
  description: >-
    Pure-tone audiometry, which in this disorder is not a formality: the hearing
    loss may be the presenting or the only complaint, it is postlingual and
    progressive, and it may be slight enough that it is found only on formal
    testing. Vestibular assessment is normal, which is one of the findings that
    separates this disorder from Usher syndrome type 1.
  results: >-
    Postlingual, progressive, bilateral sensorineural hearing loss with normal
    vestibular function.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient RP1973 suffered from bilateral moderate-severe progressive hearing loss manifested at 13 years old (Fig. 3b) and late-onset progressive diminution of vision in both eyes with photophobia (first ophthalmologic examination at 44 years old).
    explanation: >-
      A patient in whom the audiometric abnormality preceded the ophthalmic one
      by three decades, which is why audiometry is curated as its own diagnostic
      step.
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic bi-allelic variants in CEP250 cause atypical autosomal recessive Usher syndrome, which is associated with SNHL and photoreceptors dysfunction without vestibular signs.
    explanation: >-
      Records the absence of vestibular signs that the assessment is looking
      for.
- name: CEP250 sequencing within an Usher-gene panel
  description: >-
    Molecular confirmation by targeted panel, exome or genome sequencing. CEP250
    entered Usher-syndrome diagnostic panels as an uncertainly associated gene
    and was consolidated as causative by panel screening, so the practical
    advice is to include atypical as well as classical Usher genes when either
    sensory system is affected.
  results: Biallelic truncating CEP250 variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, this approach proved reliable results for the molecular diagnosis of the disease and also allowed the consolidation of the CEP250 gene as disease causative for an Usher-like phenotype.
    explanation: >-
      Documents panel sequencing as the route by which CEP250 disease is
      identified.
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We strongly recommend genetic analysis of classical and atypical Usher related-genes, in patients with isolated retinal dystrophy or SNHL.
    explanation: >-
      The recommendation to include atypical Usher genes such as CEP250 in the
      panel.
differential_diagnoses:
- name: Usher syndrome
  description: >-
    The disorder this one is repeatedly compared with, and the reason the
    literature calls it atypical Usher syndrome. Usher syndrome is caused by
    disruption of the Usher protein interactome, which organises the stereocilia
    hair bundle and the photoreceptor periciliary region; C-Nap1 is not part of
    that network. Clinically, Usher types 1 and 2 have congenital hearing loss
    and rod-first retinitis pigmentosa, with vestibular areflexia in type 1.
  disease_term:
    preferred_term: Usher syndrome
    term:
      id: MONDO:0019501
      label: Usher syndrome
  distinguishing_features:
  - Postlingual progressive hearing loss rather than congenital deafness
  - Cone-predominant retinal dystrophy rather than rod-cone retinitis pigmentosa
  - Vestibular function spared
  - Centriolar cohesion protein rather than a component of the Usher interactome
  evidence:
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classically, Usher syndrome is characterized by the association of sensorineural hearing loss (SNHL), retinitis pigmentosa (RP) and possible vestibular dysfunction. Pathogenic bi-allelic variants in CEP250 cause atypical autosomal recessive Usher syndrome, which is associated with SNHL and photoreceptors dysfunction without vestibular signs.
    explanation: >-
      Contrasts the classical syndrome with the CEP250 phenotype, including the
      absence of vestibular signs.
  - reference: PMID:27588452
    reference_title: "Bi-allelic Truncating Mutations in CEP78, Encoding Centrosomal Protein 78, Cause Cone-Rod Degeneration with Sensorineural Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that truncating mutations in CEP78 result in a phenotype involving both the visual and auditory systems but different from typical Usher syndrome.
    explanation: >-
      The same conclusion drawn for the sibling centrosomal disorder, that the
      phenotype is distinct from typical Usher syndrome.
- name: Cone-rod dystrophy and hearing loss 1
  description: >-
    The CEP78-related disorder, and the closest relative of this one: the two
    proteins interact, both are centrosomal, and both give cone-rod degeneration
    with sensorineural hearing loss. Reported CEP78 retinal disease is
    phenotypically broader, with vascular attenuation, optic disc pallor,
    intraretinal pigment and macular change, where CEP250 retinal disease is
    typically mild.
  disease_term:
    preferred_term: cone-rod dystrophy and hearing loss 1
    term:
      id: MONDO:0020778
      label: cone-rod dystrophy and hearing loss 1
  distinguishing_features:
  - Biallelic CEP78 rather than CEP250 variants
  - Broader and generally more severe retinal phenotype
  evidence:
  - reference: PMID:34223797
    reference_title: Expanding the clinical phenotype in patients with disease causing variants associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CEP78-related disease included sensorineural hearing loss (SNHL) in 6/7 patients and demonstrated a broad phenotypic spectrum including: vascular attenuation, pallor of the optic disc, intraretinal pigment, retinal pigment epithelium mottling, areas of mid-peripheral hypo-autofluorescence, outer retinal atrophy, mild pigmentary changes in the macula, foveal hypo-autofluorescence, and granularity of the ellipsoid zone.
    explanation: >-
      The CEP78-specific findings from the same series, showing the broader
      retinal spectrum of the sibling disorder.
- name: Non-syndromic autosomal recessive hearing loss
  description: >-
    A CEP250 nonsense variant has been reported in a family with progressive
    moderate sensorineural hearing loss and no retinal degeneration, so
    non-syndromic deafness is a differential that resolves to the same gene.
    Whether those individuals will develop retinal disease later is not known,
    which is why ophthalmological follow-up is recommended.
  disease_term:
    preferred_term: nonsyndromic genetic hearing loss
    term:
      id: MONDO:0019497
      label: nonsyndromic genetic hearing loss
  distinguishing_features:
  - No retinal degeneration at the time of report
  - Same gene and same class of truncating allele
  evidence:
  - reference: PMID:37759551
    reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we identified a novel nonsense homozygous variant in CEP250 (c.3511C>T; p.Gln1171Ter) among the family members with progressive moderate sensorineural hearing loss in nonsyndromic autosomal recessive type but without retinal degeneration.
    explanation: >-
      Documents the non-syndromic hearing-loss presentation of the same gene.
animal_models:
- name: Cep250 knockout mouse (exon 6-7 deletion)
  species: Mouse
  genotype: Cep250 null, homozygous (knockout-first construct deleting exons 6 and 7, converted with Cre)
  publication: PMID:36857066
  description: >-
    The mouse made specifically to model the disorder, by the group that
    reported the original patients. It is the useful one, and the reason is a
    negative fact about the field: most Usher-syndrome mouse models have normal
    retinal function and structure, so a mouse that loses both vision and
    hearing is unusual. The catch is timing - the electroretinogram is normal at
    6 months and the deficits are documented at 20 months, which is near the end
    of a mouse lifespan.
  modeled_mechanisms:
  - target: Progressive Cone-Predominant Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Full-field electroretinography declines gradually with age and histology
      confirms late-onset retinal degeneration.
    limitations: >-
      The retinal decline is not cone-predominant in the way the human disease
      is: photopic and scotopic responses both fall. Onset is very late, so the
      model cannot address why patients present in childhood or early
      adulthood, and it gives no read on the mildness that characterises the
      human retinal phenotype.
    readouts:
    - name: Full-field electroretinogram amplitude
      target: Progressive Cone-Predominant Photoreceptor Degeneration
      direction: DECREASED
      interpretation: >-
        Functional confirmation of progressive photoreceptor loss in the model.
      evidence:
      - reference: PMID:36857066
        reference_title: Homozygous Knockout of Cep250 Leads to a Relatively Late-Onset Retinal Degeneration and Sensorineural Hearing Loss in Mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          At 6 months, the ffERG was normal, but it decreased gradually with age. For both photopic and scotopic ffERG responses, very low amplitudes were evident at 20 months. Histological analysis confirmed late-onset retinal degeneration.
        explanation: >-
          The electroretinographic and histological measurement of the retinal
          phenotype, including its timing.
    evidence:
    - reference: PMID:36857066
      reference_title: Homozygous Knockout of Cep250 Leads to a Relatively Late-Onset Retinal Degeneration and Sensorineural Hearing Loss in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although most USH animal models have normal retinal function and structure, the Cep250 KO mouse model shows both retinal degeneration and hearing loss with a relatively late age of onset.
      explanation: >-
        States what makes this model informative relative to the alternatives,
        and states the timing caveat in the same sentence.
  - target: Progressive Postlingual Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Auditory brainstem response thresholds rise significantly by 20 months,
      giving an adult-onset progressive hearing loss like the patients'.
    limitations: >-
      Hearing was tested only at 20 months, so the model establishes that the
      deficit exists but not its time course, and the human hearing loss is
      already present in childhood in several reported patients.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive Postlingual Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        A raised threshold is reduced hearing sensitivity, the model counterpart
        of the patients' sensorineural loss.
      evidence:
      - reference: PMID:36857066
        reference_title: Homozygous Knockout of Cep250 Leads to a Relatively Late-Onset Retinal Degeneration and Sensorineural Hearing Loss in Mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          ABR tests illustrated that hearing threshold significantly increased at the age of 20 months.
        explanation: >-
          The auditory measurement in the model.
    evidence:
    - reference: PMID:36857066
      reference_title: Homozygous Knockout of Cep250 Leads to a Relatively Late-Onset Retinal Degeneration and Sensorineural Hearing Loss in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hearing thresholds were detected using auditory brainstem response (ABR) at the age of 20 months.
      explanation: >-
        Establishes how and when hearing was assessed in this model.
- name: Cep250 p.R188* knock-in mouse
  species: Mouse
  genotype: Cep250 p.R188* knock-in, homozygous
  publication: PMID:30998843
  description: >-
    A knock-in carrying an actual patient allele - the same c.562C>T, p.R188*
    nonsense variant found both in the Japanese cone-rod-dystrophy family and in
    a consanguineous family with non-syndromic retinitis pigmentosa. Among the
    models curated here it is the one that tests a specific human variant rather
    than a null; the other three are knockouts.
  modeled_mechanisms:
  - target: Progressive Cone-Predominant Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous knock-in mice show significantly reduced retinal thickness and
      reduced electroretinographic responses.
    limitations: >-
      The retinal impairment is described as severe, whereas the human
      phenotype associated with this same allele is mild, so the model
      overstates severity. It was made to characterise a non-syndromic retinitis
      pigmentosa presentation and its hearing was not reported, so it says
      nothing about the auditory branch.
    readouts:
    - name: Retinal thickness and electroretinogram response
      target: Progressive Cone-Predominant Photoreceptor Degeneration
      direction: DECREASED
      interpretation: >-
        Structural and functional confirmation that a patient truncating allele
        is sufficient to cause photoreceptor disease.
      evidence:
      - reference: PMID:30998843
        reference_title: Functional characterization of CEP250 variant identified in nonsyndromic retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The homozygous knockin mice showed significantly reduced retinal thickness and ERG responses.
        explanation: >-
          The two retinal measurements made in this model.
    evidence:
    - reference: PMID:30998843
      reference_title: Functional characterization of CEP250 variant identified in nonsyndromic retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Remarkably, the disruption of Cep250 resulted in severe impairment of retinal function and significant retinal morphological alterations.
      explanation: >-
        Establishes that the model reproduces retinal disease, and in the
        authors' own word, severely.
- name: Cep250 knockout mouse (cochlear characterisation)
  species: Mouse
  genotype: Cep250 null, homozygous
  publication: PMID:37759551
  description: >-
    A Cep250-null line phenotyped for the ear rather than the eye, alongside a
    human family with non-syndromic hearing loss. It is the source of the
    hair-cell mechanism for the auditory branch of this disorder.
  modeled_mechanisms:
  - target: Cochlear Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cep250 is expressed in mouse inner and outer hair cells, and the null mice
      lose them, with progressive hearing loss on auditory brainstem response.
    limitations: >-
      Hair-cell degeneration has not been demonstrated in human cochlea, so the
      cellular mechanism of the human hearing loss rests on this model. The
      accompanying human family had no retinal disease, so the model as
      published addresses the auditory branch only.
    readouts:
    - name: Cochlear hair cell survival
      target: Cochlear Hair Cell Degeneration
      direction: DECREASED
      interpretation: >-
        The cellular lesion proposed to underlie the sensorineural hearing loss.
      evidence:
      - reference: PMID:37759551
        reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Knockout mice of Cep250 showed significant hair cell degeneration and progressive hearing loss in auditory brainstem response.
        explanation: >-
          The hair-cell measurement and the hearing deficit that accompanies it.
    evidence:
    - reference: PMID:37759551
      reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the murine adult cochlea, Cep250 was expressed in the inner and outer hair cells.
      explanation: >-
        Establishes that the cell type this model reads out is one that
        expresses the gene.
- name: Cep250 CRISPR knockout mouse (cochlear morphology line)
  species: Mouse
  genotype: Cep250 homozygous null, generated by CRISPR/Cas9
  publication: DOI:10.21203/rs.3.rs-4515679/v1
  description: >-
    A CRISPR-generated Cep250-null line phenotyped specifically for the inner
    ear, with auditory brainstem responses, a swimming test for vestibular
    function, and hair-cell counts by immunofluorescence. It is the model that
    speaks most directly to what separates this disorder from classical Usher
    syndrome, because it tests hearing and balance in the same animals. It is a
    Research Square preprint and has not been peer reviewed; that is recorded
    here rather than treated as equivalent to the published models.
  modeled_mechanisms:
  - target: Cochlear Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous nulls lose cochlear hair cells and lose hearing, with the
      deficit concentrated in the high frequencies, while vestibular function is
      spared and heterozygotes are unaffected.
    limitations: >-
      Preprint, not peer reviewed, so the measurements have not been through
      external scrutiny. The mouse is a complete null while patients carry
      truncating alleles in a large protein, and hearing was assessed only over
      P30 to P60, which does not test the progressive course seen in patients.
    readouts:
    - name: Cochlear hair cell number
      target: Cochlear Hair Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Independent confirmation, in a second knockout line, of the hair-cell
        lesion proposed to underlie the human hearing loss.
      evidence:
      - reference: DOI:10.21203/rs.3.rs-4515679/v1
        reference_title: "The cochlear morphology alteration and hearing loss in Cep250 knockout mice (Research Square preprint, not peer reviewed)"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Immunofluorescence staining reveals a significant reduction in the number of cochlear hair cells in Cep250−/− mice, confirming the association between Cep250 gene mutation and hearing function loss.
        explanation: >-
          The hair-cell count in this model.
    - name: Auditory brainstem response threshold by frequency
      target: Cochlear Hair Cell Degeneration
      direction: INCREASED
      interpretation: >-
        A raised threshold is reduced hearing sensitivity, so INCREASED here is
        a hearing deficit. The high-frequency predominance matches the sloping
        loss reported in patients.
      evidence:
      - reference: DOI:10.21203/rs.3.rs-4515679/v1
        reference_title: "The cochlear morphology alteration and hearing loss in Cep250 knockout mice (Research Square preprint, not peer reviewed)"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We demonstrate that Cep250−/− mice exhibit impaired hearing function, particularly in high-frequency ranges, whereas their vestibular function remains unaffected.
        explanation: >-
          The auditory measurement, and in the same sentence the preserved
          vestibular function that distinguishes this disorder from Usher type 1.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-4515679/v1
      reference_title: "The cochlear morphology alteration and hearing loss in Cep250 knockout mice (Research Square preprint, not peer reviewed)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous mice show no significant changes in hearing, indicating that a single allele mutation in Cep250 is insufficient to affect normal Cep250 expression levels.
      explanation: >-
        The heterozygote result, which matches the recessive inheritance in
        patients and shows the model is dose-appropriate for this disorder.
- name: Cep250 global knockout mouse (retinal transcriptome and metabolome line)
  species: Mouse
  genotype: Cep250 null, homozygous (global knockout)
  publication: PMID:37240188
  description: >-
    A global Cep250-null line phenotyped from P90 to P180 with optical coherence
    tomography, electroretinography, TUNEL, RNA sequencing and untargeted
    metabolomics. It is where the candidate downstream death pathways come from
    - cGMP-PKG and MAPK signalling from the transcriptomics, dysregulated
    arginine metabolism from the companion metabolomic study on a global
    knockout from the same centre.
  modeled_mechanisms:
  - target: Progressive Cone-Predominant Photoreceptor Degeneration
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reads out the transcriptional and metabolic consequences of Cep250 loss in
      the retina, implicating cGMP-PKG and MAPK signalling and arginine
      metabolism.
    limitations: >-
      Pathway enrichment from bulk retinal RNA sequencing at a single timepoint
      is hypothesis-generating; neither implicated pathway has been tested by
      intervention, and neither has been examined in human retina. The a-wave
      falls more than the b-wave here, a photoreceptor-level signature, but the
      model does not separate cones from rods the way the human phenotype does.
    readouts:
    - name: Retinal cGMP-PKG and MAPK pathway transcript enrichment
      target: Progressive Cone-Predominant Photoreceptor Degeneration
      direction: INCREASED
      interpretation: >-
        The candidate signalling route from ciliary defect to photoreceptor
        death.
      evidence:
      - reference: PMID:37240188
        reference_title: RNA-Seq Analysis Reveals an Essential Role of the cGMP-PKG-MAPK Pathways in Retinal Degeneration Caused by Cep250 Deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A KEGG enrichment analysis indicated that cGMP-PKG signalling pathways, MAPK signalling pathways, edn2-fgf2 axis pathways, and thyroid hormone synthesis were upregulated, whereas protein processing in the endoplasmic reticulum was downregulated in Cep250 KO eyes.
        explanation: >-
          The enrichment result behind the proposed pathway.
    - name: Outer nuclear layer and whole-retina thickness
      target: Progressive Cone-Predominant Photoreceptor Degeneration
      direction: DECREASED
      interpretation: >-
        Structural confirmation of photoreceptor loss in the line the
        transcriptomics was run on.
      evidence:
      - reference: PMID:37240188
        reference_title: RNA-Seq Analysis Reveals an Essential Role of the cGMP-PKG-MAPK Pathways in Retinal Degeneration Caused by Cep250 Deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Compared with WT mice, the thickness of the ONL, IS/OS, and whole retina of Cep250 mice was significantly reduced.
        explanation: >-
          The structural measurement in this model.
    evidence:
    - reference: PMID:37656476
      reference_title: Dysregulated Arginine Metabolism Is Linked to Retinal Degeneration in Cep250 Knockout Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We used Cep250 KO mice and untargeted metabolomics to uncover potential mechanisms underlying retinal degeneration.
      explanation: >-
        The companion metabolomic study on a global Cep250 knockout from the
        same centre, establishing what this model is used for.
discussions:
- discussion_id: gap_crdhl2_organ_selectivity_and_presentation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a ubiquitously expressed centriole-linker protein produce
    disease confined to photoreceptors and cochlear hair cells, and what decides
    whether a given patient presents through the eye, through the ear, or with
    only one of the two?
  attaches_to:
  - pathophysiology#Loss of C-Nap1 from the Centriole
  - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
  - genetic#CEP250
  rationale: >-
    C-Nap1 is a general centrosomal protein and centriole cohesion is a general
    cell-cycle process, yet the disease is restricted to two post-mitotic
    sensory cell types. The obvious hypothesis is the ciliary one - the mother
    centriole is the basal body of the photoreceptor connecting cilium and
    C-Nap1 is expressed there - but what C-Nap1 does at that structure has not
    been established, and it does not by itself explain the hair cell. The
    variability is at least as unexplained. Reported patients with the same
    class of truncating allele have had a cone-rod dystrophy with hearing loss,
    apparently isolated hearing loss with a normal retina, or apparently
    non-syndromic retinitis pigmentosa, and the largest series raised the
    possibility that loss- and gain-of-function effects coexist, which it noted
    would complicate gene therapy. Nothing currently predicts which
    presentation a genotype will produce.
  evidence:
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The coexistence of loss- and gain-of-function effects may exist, complicating the development of gene therapy.
    explanation: >-
      The authors' statement that the variant mechanism itself is unresolved,
      and its therapeutic consequence.
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients appear to present either isolated hearing loss or visual impairment, but further investigations are needed to confirm a possible non-syndromic presentation.
    explanation: >-
      Records the single-organ presentations that the gap asks about, with the
      authors' own caveat.
- discussion_id: gap_crdhl2_second_locus_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the retinal phenotype in the family that established CEP250 is
    attributable to CEP250, given that a second ciliary-gene nonsense allele
    segregated in the same pedigree?
  attaches_to:
  - genetic#CEP250
  - pathophysiology#Progressive Cone-Predominant Photoreceptor Degeneration
  rationale: >-
    The discovery family carried nonsense variants in two ciliary genes, CEP250
    and C2orf71. Individuals homozygous for both had early-onset severe
    retinitis pigmentosa; individuals homozygous for CEP250 with a single mutant
    C2orf71 allele had only mild retinal degeneration. The authors read this as
    an additive effect. That reading has since been supported indirectly, in
    that CEP250 families without a second locus also show mild retinal disease -
    but the contribution of a heterozygous C2orf71 allele to even the mild
    phenotype has not been separately assessed, and no series has been powered
    to test digenic contribution. The practical consequence is that severe
    early-onset retinal disease should not be quoted as part of the CEP250
    phenotype on the strength of that pedigree.
  evidence:
  - reference: PMID:24780881
    reference_title: A homozygous nonsense CEP250 mutation combined with a heterozygous nonsense C2orf71 mutation is associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe retinal involvement in the double homozygotes indicates an additive effect caused by nonsense mutations in genes encoding ciliary proteins.
    explanation: >-
      The authors' own attribution of the severe phenotype to two loci acting
      together.
  - reference: PMID:34223797
    reference_title: Expanding the clinical phenotype in patients with disease causing variants associated with atypical Usher syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients with CEP250 variants exhibited nonsense and frameshift variants suggesting that this phenotype of mild RP with progressive SNHL may be specific for biallelic CEP250 nonsense or frameshift variants that lead to defective proteins in the absence of pathogenic variants in other genes.
    explanation: >-
      A later series proposing exactly this reading - that mild retinal disease
      with progressive hearing loss is what CEP250 alone produces - stated as a
      suggestion rather than a demonstration, which is why the gap remains
      open.
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of the targeted panel and WES results showed no additional putative pathogenic mutations, except for one heterozygous missense variant in USH2A (rs773526991: c.4561C > T/p.Arg1521Cys), presenting an allele frequency of 0.00002 in ExAC and for which the in silico tools implied a deleterious effect.
    explanation: >-
      A second independent CEP250 patient carrying an unexplained monoallelic
      variant in another retinal gene, which broadens the gap beyond the
      C2orf71 finding in the discovery family.
clinical_trials: []
datasets: []
notes: >-
  Lump/split decision. Curated as a standalone Disease rather than as a subtype
  of Usher_Syndrome, on three grounds. MONDO places MONDO:0020780 under
  cone-rod dystrophy and hearing loss, not under Usher syndrome. The mechanism
  is not the Usher interactome: the Usher entry's pathograph is built on loss of
  an Usher protein complex component, and C-Nap1 is a centriole-linker protein,
  which is why the sibling CEP78 disorder was also described as different from
  typical Usher syndrome. And the clinical pattern differs on each of the three
  axes that define the Usher types - onset and character of the hearing loss,
  cone-first rather than rod-first retinal disease, and preserved vestibular
  function.

  Evidence-source convention: patient clinical and genetic findings are graded
  HUMAN_CLINICAL; mouse work MODEL_ORGANISM; the NIH3T3 localisation experiment
  IN_VITRO; background statements of established cell biology drawn from
  introductions rather than from the citing paper's own data are graded OTHER.

  One source here is a preprint. The cochlear-morphology mouse
  (DOI:10.21203/rs.3.rs-4515679/v1) is a Research Square deposit that has not
  been peer reviewed. It is cited because it is the only study that tests
  hearing and vestibular function in the same Cep250-null animals, which is the
  distinction that separates this disorder from Usher type 1, and its preprint
  status is stated in the reference title, in the model description and in that
  model's limitations. Note also that the reference validator's skip_prefixes
  list includes DOI, so its three snippets are not machine-verified; each was
  checked by hand against references_cache/DOI_10.21203_rs.3.rs-4515679_v1.md.

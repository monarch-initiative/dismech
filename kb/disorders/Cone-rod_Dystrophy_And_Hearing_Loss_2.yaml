name: Cone-rod dystrophy and hearing loss 2
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- CRDHL2
- CEP250-related retinal dystrophy and hearing loss
- atypical Usher syndrome, CEP250-related
description: >-
  Cone-rod dystrophy and hearing loss 2 is a rare autosomal recessive
  dual-sensory disorder caused by biallelic truncating variants in CEP250, which
  encodes C-Nap1. C-Nap1 sits at the proximal ends of the two parent centrioles
  and, with rootletin and NEK2, holds them together; in photoreceptors the
  mother centriole is the basal body of the connecting cilium, and C-Nap1 is
  expressed in that cilium and interacts with CEP78, the protein mutated in the
  sibling disorder cone-rod dystrophy and hearing loss 1.

  The disorder is repeatedly described in the literature as atypical Usher
  syndrome, and it is worth being precise about what that means. It is
  Usher-like in combining retinal degeneration with sensorineural hearing loss.
  It is not Usher syndrome in mechanism - C-Nap1 is not a component of the Usher
  protein interactome that organises the stereocilia hair bundle - and it
  differs clinically in ways that matter: the hearing loss is postlingual and
  progressive rather than congenital, vestibular function is spared, and the
  retinal disease is cone-predominant and often mild rather than the rod-first
  retinitis pigmentosa of classical Usher syndrome.

  The presentation is asymmetric between the two organs and between patients.
  Some individuals come to attention through vision, some through hearing, and
  in reported series a minority have appeared to have only one of the two.
  Because the ophthalmological changes can be very subtle, high-resolution
  retinal imaging has been recommended to detect them.

      Representative images of patients with CEP250 variants are shown in figure 2. Color fundus analysis revealed normal findings in all patients.
    explanation: >-
      Three CEP250 patients with normal colour fundus findings, which is why
      this phenotype is recorded as non-uniform rather than characteristic.

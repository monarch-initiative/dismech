genetic:
- name: CEP250
  association: Causal biallelic variant
  gene_term:
    preferred_term: CEP250
    term:
      id: hgnc:1859
      label: CEP250
  notes: >-
    Two cautions attach to the reported allelic spectrum. First, the original
    family that established the gene segregated a second ciliary-gene allele:
    the individuals homozygous for the CEP250 nonsense variant who also carried
    a single C2orf71 nonsense allele had mild retinal degeneration, while the
    double homozygotes had early-onset severe retinitis pigmentosa, which the
    authors read as an additive effect. Severe early retinal disease in that
    family therefore should not be attributed to CEP250 alone. Second, the
    same class of truncating allele has been reported with apparently isolated
    hearing loss and with non-syndromic retinitis pigmentosa, so a biallelic
    truncating genotype does not predict which organ presents.

    A second, independent CEP250-biallelic patient also carried a monoallelic
    rare variant in another Usher gene - a heterozygous USH2A missense change
    with no second USH2A hit found. Two of the small number of reported patients
    therefore carry an unexplained single allele in a second retinal gene, which
    is why the second-locus question is recorded as an open gap rather than
    treated as settled.
  evidence:
  - reference: PMID:24780881
    reference_title: A homozygous nonsense CEP250 mutation combined with a heterozygous nonsense C2orf71 mutation is associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who were double homozygotes had SNHL accompanied by early-onset and severe RP, while patients who were homozygous for the CEP250 mutation and carried a single mutant C2orf71 allele had SNHL with mild retinal degeneration.
    explanation: >-
      The genotype-by-genotype breakdown that separates the CEP250-attributable
      phenotype from the two-gene one.
  - reference: PMID:24780881
    reference_title: A homozygous nonsense CEP250 mutation combined with a heterozygous nonsense C2orf71 mutation is associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severe retinal involvement in the double homozygotes indicates an additive effect caused by nonsense mutations in genes encoding ciliary proteins.
    explanation: >-
      The authors' own interpretation of the second locus as additive.
  - reference: PMID:30998843
    reference_title: Functional characterization of CEP250 variant identified in nonsyndromic retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the identification of a mutation (c.562C>T, p.R188*) in the CEP250 in a consanguineous family with nonsyndromic RP.
    explanation: >-
      Documents an apparently non-syndromic retinal presentation of a CEP250
      truncating allele that is also seen in the syndromic disorder.

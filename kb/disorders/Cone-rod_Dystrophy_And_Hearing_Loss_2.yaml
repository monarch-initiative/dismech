    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we detected two novel nonsense mutations in CEP250 in a patient with a disease mimicking Usher syndrome that associates visual impairment due to cone-rod dystrophy and progressive hearing loss.
    explanation: >-
      Documents cone-rod dystrophy as the retinal phenotype in a
      CEP250-biallelic patient.
  - reference: PMID:29718797
    reference_title: CEP250 mutations associated with mild cone-rod dystrophy and sensorineural hearing loss in a Japanese family.
    supports: SUPPORT

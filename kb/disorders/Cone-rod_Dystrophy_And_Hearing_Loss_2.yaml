    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CEP250 variants, homozygous in consanguineous families and
    compound heterozygous elsewhere. Every reported patient in the largest
    series carried truncating alleles only.
  evidence:
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic bi-allelic variants in CEP250 cause atypical autosomal recessive Usher syndrome, which is associated with SNHL and photoreceptors dysfunction without vestibular signs.
    explanation: >-
      States the recessive biallelic mechanism and the defining sensory
      combination without vestibular involvement.
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients harbored isolated truncating variants.
    explanation: >-
      Records that the reported allelic spectrum in this series is truncating.
prevalence:

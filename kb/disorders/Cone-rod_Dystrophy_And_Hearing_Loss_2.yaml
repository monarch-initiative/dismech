  - reference: PMID:37759551
    reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we identified a novel nonsense homozygous variant in CEP250 (c.3511C>T; p.Gln1171Ter) among the family members with progressive moderate sensorineural hearing loss in nonsyndromic autosomal recessive type but without retinal degeneration.
    explanation: >-
      Documents progressive sensorineural hearing loss as the sole feature in

    explanation: >-
      The published case count, standing in for a population estimate that has
      never been made.
pathophysiology:
- name: Biallelic CEP250 Truncating Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and splice variants on both CEP250 alleles. The
    truncated products lose the C-terminal region of C-Nap1: the allele in the
    original family removes the NEK2-phosphorylation region, and a nonsense
    allele reported in a deafness family produces a protein that no longer
    reaches the centrosome at all.
  genes:
  - preferred_term: CEP250
    term:
      id: hgnc:1859
      label: CEP250
  evidence:
  - reference: PMID:24780881
    reference_title: A homozygous nonsense CEP250 mutation combined with a heterozygous nonsense C2orf71 mutation is associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CEP250 expression analysis of the mutant allele revealed the generation of a truncated protein lacking the NEK2-phosphorylation region.
    explanation: >-
      Characterises the molecular consequence of the founder allele.
  - reference: PMID:29718797
    reference_title: CEP250 mutations associated with mild cone-rod dystrophy and sensorineural hearing loss in a Japanese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES of the proband identified compound heterozygous variants c.361C>T, p.R121*, and c.562C>T, p.R188* in CEP250. The variants were found to co-segregate with the disease in five members of the family.
    explanation: >-
      Documents biallelic truncating variants segregating with the
      cone-rod-dystrophy-plus-hearing-loss phenotype.
  downstream:
  - target: Loss of C-Nap1 from the Centriole
    description: >-
      A truncated C-Nap1 does not occupy its normal position at the proximal
      centriole.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37759551
      reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The nonsense variant in CEP250 led to the early truncating protein of C-Nap1, which hindered centrosome localization; heterologous expression of CEP250 (c.3511C>T) in NIH3T3 cells within cilia expression condition revealed that the truncating C-Nap1 (p.Gln1171Ter) was not localized at the centrosome but was dispersed in the cytosol.
      explanation: >-
        Direct demonstration that a patient truncating allele mislocalises the
        protein away from the centrosome.
- name: Loss of C-Nap1 from the Centriole
  biological_scale: MOLECULAR
  description: >-
    C-Nap1 docks at the proximal ends of both parent centrioles and anchors the
    rootletin fibres that hold them together; NEK2 phosphorylation of C-Nap1 is
    what releases that linkage at mitosis. Losing the protein from the centriole
    therefore removes the anchor for centriole-centriole cohesion. Because the
    mother centriole is also the basal body from which a primary cilium is
    built, the same lesion is felt at the ciliary base.
  cellular_components:
  - preferred_term: centriole
    term:
      id: GO:0005814
      label: centriole
  biological_processes:
  - preferred_term: centriole-centriole cohesion
    modifier: DECREASED
    term:
      id: GO:0010457
      label: centriole-centriole cohesion
  evidence:
  - reference: PMID:37759551
    reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      C-Nap1 is expressed in photoreceptor cilia and interacts with other ciliary proteins, including Rootletin and NEK2 [9].
    explanation: >-
      Establishes the protein's ciliary localisation and its rootletin and NEK2
      partners, the components of the centriole linker.
  downstream:
  - target: Photoreceptor Connecting Cilium Dysfunction
    description: >-
      The photoreceptor connecting cilium is built on the mother centriole that
      C-Nap1 anchors, and C-Nap1 is itself expressed there.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29718797
      reference_title: CEP250 mutations associated with mild cone-rod dystrophy and sensorineural hearing loss in a Japanese family.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        C-Nap1 has been reported to be expressed in the photoreceptor cilia and is known to interact with other ciliary proteins.
      explanation: >-
        Places the protein in the photoreceptor cilium, the structure this edge
        runs to.
  - target: Cochlear Hair Cell Degeneration
    description: >-
      Cep250 is expressed in cochlear hair cells, which degenerate when it is
      lost. This is a parallel branch from the same molecular lesion, not a
      consequence of the retinal branch.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37759551
      reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the murine adult cochlea, Cep250 was expressed in the inner and outer hair cells. Knockout mice of Cep250 showed significant hair cell degeneration and progressive hearing loss in auditory brainstem response.
      explanation: >-
        Establishes hair-cell expression and hair-cell degeneration on loss of
        the gene.
- name: Photoreceptor Connecting Cilium Dysfunction
  biological_scale: CELLULAR
  description: >-
    The connecting cilium is the only conduit between the photoreceptor inner
    segment, where outer-segment proteins are made, and the outer segment, where
    they work. Disorders of the photoreceptor cilium are a recognised cause of
    retinal degeneration for this reason. What C-Nap1 contributes at that
    structure is not established in detail; that it is present there and
    interacts with ciliary partners including CEP78 is what links the gene to
    the retinal phenotype.
  cellular_components:
  - preferred_term: photoreceptor connecting cilium
    term:
      id: GO:0032391
      label: photoreceptor connecting cilium
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:37656476
    reference_title: Dysregulated Arginine Metabolism Is Linked to Retinal Degeneration in Cep250 Knockout Mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Degeneration of retinal photoreceptors is frequently observed in diverse ciliopathy disorders, and photoreceptor cilium gates the molecular trafficking between the inner and the outer segment (OS).
    explanation: >-
      States the general role of the photoreceptor cilium that makes this node
      the link between the centriolar lesion and photoreceptor loss.
  - reference: PMID:27588452
    reference_title: "Bi-allelic Truncating Mutations in CEP78, Encoding Centrosomal Protein 78, Cause Cone-Rod Degeneration with Sensorineural Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CEP78 was reported previously to interact with c-nap1, encoded by CEP250 that we reported earlier to cause atypical Usher syndrome.
    explanation: >-
      Establishes the CEP78-C-Nap1 interaction that ties this disorder to its
      sibling disorder at the same subcellular site.
  downstream:
  - target: Progressive Cone-Predominant Photoreceptor Degeneration
    description: >-
      Photoreceptors with a defective connecting cilium degenerate
      progressively.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37240188
      reference_title: RNA-Seq Analysis Reveals an Essential Role of the cGMP-PKG-MAPK Pathways in Retinal Degeneration Caused by Cep250 Deficiency.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cep250 KO mice experience a late-stage retinal degeneration that manifests as the atypical USH phenotype. The dysregulation of the cGMP-PKG-MAPK pathways may contribute to the pathogenesis of cilia-related retinal degeneration.
      explanation: >-
        The only mechanistic account of how the ciliary defect kills
        photoreceptors, and its authors state it as a possible contribution
        rather than a demonstrated pathway, which is why this edge is indirect
        with unknown intermediates.
- name: Progressive Cone-Predominant Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive photoreceptor dysfunction that in most reported patients affects
    cones earlier or more than rods, producing a cone-rod rather than a rod-cone
    pattern. Severity is variable and often mild: in the Japanese family the
    electrophysiological abnormality was slight and reduced foveal cone density
    was visible only on adaptive-optics imaging. Reduced retinal thickness and
    photoreceptor loss are reproduced in Cep250-null mice.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:29718797
    reference_title: CEP250 mutations associated with mild cone-rod dystrophy and sensorineural hearing loss in a Japanese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological analysis revealed a mild CRD in two family members. Adaptive optics (AO) imaging showed reduced cone density around the fovea.
    explanation: >-
      Documents the cone-predominant retinal phenotype and its mildness.
  - reference: PMID:39610034
    reference_title: The phenotypic spectrum of CEP250 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CEP250 pathogenic variants are associated with post-lingual SNHL, and most often progressive photoreceptor dysfunction.
    explanation: >-
      Records that the photoreceptor dysfunction is usually progressive.
  - reference: PMID:34223797
    reference_title: Expanding the clinical phenotype in patients with disease causing variants associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ffERG was obtained on one of the three patients (CEP250–1) which showed a mild cone dystrophy with normal rod function (table 1).
    explanation: >-
      A CEP250-labelled patient in whom the cone system was affected and rod
      function was normal, which is the cone-predominant pattern this node
      describes.
  - reference: PMID:34223797
    reference_title: Expanding the clinical phenotype in patients with disease causing variants associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OCT findings showed outer retinal atrophy in all three patients including thinning of the outer nuclear layer (ONL) (CEP250–1) and subtle disruption of the EZ and interdigitation zone (IZ) (CEP250–3).
    explanation: >-
      Structural confirmation of photoreceptor loss in all three CEP250 patients
      of that series, despite normal colour fundus findings.
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field electroretinography showed only mild alterations in the scotopic flash electroretinography (ERG), as the amplitudes of the b-wave were reduced in the right eye and absent in the left eye. Macular ERG showed an absence of response in both eyes, and Visual Evoked Potentials (VEP) were altered (Supplemental Fig. S1).
    explanation: >-
      In a CEP250-biallelic patient the macular response was absent while the
      rod-driven scotopic response was only mildly abnormal, which is the
      cone-predominant pattern this node asserts, measured in one patient.
- name: Cochlear Hair Cell Degeneration
  biological_scale: TISSUE
  description: >-
    Loss of cochlear inner and outer hair cells. This is the auditory branch of
    the same molecular lesion; it is demonstrated in Cep250-null mice, where
    hair-cell degeneration accompanies a rising auditory brainstem response
    threshold, and it is the proposed basis of the hearing loss in patients.
  cell_types:
  - preferred_term: cochlea auditory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  evidence:
  - reference: PMID:37759551
    reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, a nonsense variant in CEP250 results in a deficit of centrosome localization and hair cell degeneration in the cochlea, which is associated with the progression of hearing loss in humans and mice.
    explanation: >-
      States the hair-cell mechanism and its correspondence with the human
      hearing loss.
  downstream:
  - target: Progressive Postlingual Sensorineural Hearing Loss
    description: >-
      Hair-cell loss produces a sensorineural hearing loss that worsens with
      age, matching the postlingual progressive pattern seen in patients.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37759551
      reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic Autosomal Recessive Type of Progressive Hearing Loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockout mice of Cep250 showed significant hair cell degeneration and progressive hearing loss in auditory brainstem response.
      explanation: >-
        Pairs the hair-cell loss with the measured progressive hearing deficit
        in the model.
- name: Progressive Postlingual Sensorineural Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Sensorineural hearing loss that begins after speech acquisition and worsens.
    The distinction from classical Usher syndrome is not cosmetic: congenital
    profound deafness is the presenting feature of Usher type 1, whereas here
    the hearing loss may be slight enough to be found only on formal audiometry
    and may be the only complaint the patient has.
  evidence:
  - reference: PMID:34223797
    reference_title: Expanding the clinical phenotype in patients with disease causing variants associated with atypical Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense and frameshift variants in CEP250 showed mild retinal disease with progressive, non-congenital SNHL.
    explanation: >-
      The CEP250-specific finding from a series that also covered three other
      genes; it records both the mild retinal disease and the progressive
      non-congenital hearing loss.
  - reference: PMID:30459346
    reference_title: "High-throughput sequencing for the molecular diagnosis of Usher syndrome reveals 42 novel mutations and consolidates CEP250 as Usher-like disease causative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient RP1973 suffered from bilateral moderate-severe progressive hearing loss manifested at 13 years old (Fig. 3b) and late-onset progressive diminution of vision in both eyes with photophobia (first ophthalmologic examination at 44 years old).
    explanation: >-
      A single CEP250-biallelic patient in whom the hearing loss declared itself
      at 13 and the visual decline three decades later, which is the postlingual
      progressive pattern with hearing-first presentation.
phenotypes:

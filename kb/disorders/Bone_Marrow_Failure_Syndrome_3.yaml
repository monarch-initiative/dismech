    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the cytopenia and the growth failure, and localises the
      cytopenia to impaired differentiation rather than to peripheral loss.
    limitations: >-
      Zebrafish haematopoiesis is not human marrow, the model does not carry
      a patient allele, and the myelodysplastic features required a second
      engineered tp53 mutation rather than arising on their own.

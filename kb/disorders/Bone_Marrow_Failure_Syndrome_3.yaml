differential_diagnoses:
- name: Shwachman-Diamond syndrome
  description: >-
    The closest differential, and mechanistically the same kind of disease:
    SBDS, EFL1 and SRP54 all act on ribosome maturation, as DNAJC21 does.
    They are separated by gene and by the balance of features, with
    pancreatic insufficiency variable here and defining there, and
    developmental delay more consistent here.
- name: Dyskeratosis congenita
  description: >-
    The other overlap, through the combination of marrow failure with skin,
    nail and hair abnormalities. The phenotype-refinement series argues that
    DNAJC21 disease is neither of its two neighbours but a distinct syndrome
    with features specific to it.
  evidence:
  - reference: PMID:29700810
    reference_title: "Refining the phenotype associated with biallelic DNAJC21 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that DNAJC21-related diseases constitute a distinct IBMFS, with features overlapping Shwachman-Diamond syndrome and Dyskeratosis congenita, and additional characteristics that are specific to DNAJC21 mutations."
    explanation: The authors' own positioning of the disease against its two differentials.
discussions:
- kind: HUMAN_MODEL_MISMATCH
  discussion_id: bmfs3_nucleotide_rescue_in_patients
  prompt: >-
    Does the nucleotide-metabolic imbalance found in dnajc21 zebrafish operate
    in patients, and would nucleoside supplementation improve their
    neutropenia?
  rationale: >-
    This is the only reported intervention that corrects any DNAJC21
    phenotype, and it was found by metabolomics in a fish rather than
    predicted from the ribosome biology. That makes it worth asking about and
    also makes the translational gap wide: zebrafish haematopoiesis differs
    from human marrow, the mutant does not carry a patient allele, and no
    nucleotide measurements have been reported from a patient. Until someone
    measures nucleotide pools in patient cells there is no way to tell
    whether the finding is a property of this gene or of this model.
  attaches_to:
  - pathophysiology#Nucleotide Metabolic Imbalance
  - phenotypes#Neutropenia
  proposed_experiments:
  - experiment_id: bmfs3_patient_nucleotide_pools
    name: Nucleotide pool measurement in patient-derived cells
    description: >-
      Metabolomic measurement of nucleotide pools in lymphoblastoid or
      iPSC-derived haematopoietic cells from DNAJC21 patients, against
      controls, repeating in human cells the measurement that produced the
      finding in fish.
    readouts:
    - name: Nucleotide pool composition in patient cells
      target: pathophysiology#Nucleotide Metabolic Imbalance
      direction: ALTERED
      interpretation: >-
        An imbalance of the same direction in patient cells would carry the
        model finding into the human disease.
    would_support:
    - pathophysiology#Nucleotide Metabolic Imbalance
    supporting_outcome:
    - >-
      Patient-derived cells show the nucleotide imbalance seen in the
      zebrafish mutant.
    refuting_outcome:
    - >-
      Patient-derived cells have normal nucleotide pools, which would make
      the finding a property of the model rather than of the disease.

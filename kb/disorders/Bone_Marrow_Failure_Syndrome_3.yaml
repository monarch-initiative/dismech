- name: dnajc21 mutant zebrafish
  species: Zebrafish
  species_term:
    preferred_term: Zebrafish
    term:
      id: NCBITaxon:7955
      label: Danio rerio
  genotype: dnajc21 loss-of-function mutant, and dnajc21;tp53 double mutant
  publication: PMID:39138265
  description: >-
    The first in vivo model of Dnajc21 deficiency. It reproduces cytopenia,
    reduced growth and defective protein synthesis, and it was used to show
    that the cytopenia comes from impaired haematopoietic differentiation,
    DNA damage and reduced proliferation. Adding a biallelic tp53 mutation
    produces myelodysplastic-neoplasia-like features, and nucleoside
    supplementation restores neutrophil counts.
  genes:
  - preferred_term: dnajc21
    term:
      id: ZFIN:ZDB-GENE-030131-8928
      label: dnajc21

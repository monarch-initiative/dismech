pathophysiology:
- name: Biallelic DNAJC21 Loss-of-Function Variant
  description: >-
    Both DNAJC21 alleles carry a frameshift, nonsense or splice-site change,
    or a missense change that abolishes the protein's cofactor interactions.
    Either way the cell loses functional DNAJC21.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline and biallelic, homozygous or compound heterozygous.
  molecular_functions:
  - preferred_term: DNAJC21 association with precursor rRNA
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003723
      label: RNA binding
  genes:
  - preferred_term: DNAJC21
    term:
      id: hgnc:27030
      label: DNAJC21
  downstream:
  - target: Impaired 60S Ribosomal Subunit Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27346687
      reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that the encoded protein associates with rRNA and plays a highly conserved role in the maturation of the 60S ribosomal subunit."
      explanation: Establishes what the lost protein does, which is the step that fails.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "germline biallelic mutations in DNAJC21 (DNAJ homolog subfamily C member 21)"
    explanation: The initiating lesion.
- name: Impaired 60S Ribosomal Subunit Maturation
  description: >-
    Early nuclear rRNA biogenesis and late cytoplasmic 60S maturation are both
    corrupted. The measurable consequences in patient-derived cells are
    cytoplasmic accumulation of the 60S nuclear export factor PA2G4, which
    should have been recycled, aberrant ribosome profiles, reduced amounts of
    rRNA, and increased sensitivity to the transcriptional inhibitor
    actinomycin D. This is the step that makes the disease a ribosomopathy
    and places it with SBDS, EFL1 and SRP54.
  biological_scale: MOLECULAR
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  biological_processes:
  - preferred_term: ribosomal large subunit biogenesis
    modifier: DECREASED
    term:
      id: GO:0042273
      label: ribosomal large subunit biogenesis
  downstream:
  - target: Ribosomal Stress and Increased Cell Death
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27346687
      reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "DNAJC21 deficiency resulted in cytoplasmic accumulation of the 60S nuclear export factor PA2G4, aberrant ribosome profiles, and increased cell death."
      explanation: Links the maturation defect to cell death in the same sentence.
  - target: Nucleotide Metabolic Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in zebrafish by transcriptomic and metabolomic analysis, and
      described by its authors as a novel role rather than a worked-out
      pathway.
    evidence:
    - reference: PMID:39138265
      reference_title: "Loss of Dnajc21 leads to cytopenia and altered nucleotide metabolism in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Using transcriptomic and metabolomic analyses, we uncover a novel role for Dnajc21 in nucleotide metabolism."
      explanation: >-
        A newly described association in a model organism, with the
        intervening steps not established, which is why the edge is indirect.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lymphoblastoid cells obtained from an affected individual exhibit increased sensitivity to the transcriptional inhibitor actinomycin D and reduced amounts of rRNA."
    explanation: The measurable ribosome-biogenesis defect in patient-derived cells.
  - reference: PMID:30413969
    reference_title: "Shwachman-Diamond Syndrome: Molecular Mechanisms and Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SBDS, DNAJC21, EFL1 and SRP54 are involved in ribosome biogenesis"
    explanation: Places this gene with the other Shwachman-Diamond spectrum ribosome-biogenesis genes.
- name: Ribosomal Stress and Increased Cell Death
  description: >-
    Defective ribosome maturation produces ribosomal stress. In
    haematopoietic progenitors this means impaired differentiation,
    accumulation of DNA damage and reduced proliferation, which is what the
    zebrafish model measures directly. Whether the cell death here is
    TP53-dependent is not established for DNAJC21: in the model a tp53
    mutation had to be introduced deliberately to produce myelodysplastic
    features, which tests tp53's role in transformation rather than in the
    baseline cytopenia.
  biological_scale: CELLULAR
  node_class: CELL_DEATH
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  - target: Trilineage Bone Marrow Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39138265
      reference_title: "Loss of Dnajc21 leads to cytopenia and altered nucleotide metabolism in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that cytopenia results from impaired hematopoietic differentiation, accumulation of DNA damage, and reduced cell proliferation."
      explanation: The cellular route from the ribosomal defect to the cytopenia, measured in the model.
  - target: Myeloid Neoplasia Predisposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Selection pressure on a stressed marrow favours clones that escape the
      TP53 response, which is the proposed route to myelodysplasia and
      leukaemia. Shown in the zebrafish only by introducing a biallelic tp53
      mutation deliberately.
    evidence:
    - reference: PMID:39138265
      reference_title: "Loss of Dnajc21 leads to cytopenia and altered nucleotide metabolism in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The introduction of a biallelic tp53 mutation in the dnajc21 mutants leads to the development of myelodysplastic neoplasia-like features defined by abnormal erythroid morphology and expansion of hematopoietic progenitors."
      explanation: >-
        An engineered double mutant rather than an observed clonal evolution,
        so the step from this disease to neoplasia is inferential.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "aberrant ribosome profiles, and increased cell death"
    explanation: Increased cell death measured in DNAJC21-deficient cells.
- name: Nucleotide Metabolic Imbalance
  description: >-
    A role for Dnajc21 in nucleotide metabolism, uncovered in the zebrafish
    model by combined transcriptomics and metabolomics. Its interest is
    practical as well as mechanistic: supplying nucleosides from outside
    restored neutrophil counts in the model, which is the only intervention
    reported anywhere to correct a DNAJC21 phenotype. Whether this operates in
    patients is untested.
  biological_scale: CELLULAR
  node_class: METABOLIC_FLUX_BLOCK
  downstream:
  - target: Neutropenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The rescue experiment is what links this node to the neutrophil arm of
      the cytopenia, in zebrafish.
    evidence:
    - reference: PMID:39138265
      reference_title: "Loss of Dnajc21 leads to cytopenia and altered nucleotide metabolism in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Exogenous nucleoside supplementation restores neutrophil counts, revealing an association between nucleotide imbalance and neutrophil differentiation"
      explanation: >-
        The authors describe this as an association revealed by rescue, in a
        model organism, so the human edge is inferential.
  evidence:
  - reference: PMID:39138265
    reference_title: "Loss of Dnajc21 leads to cytopenia and altered nucleotide metabolism in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we uncover a novel role for Dnajc21 in nucleotide metabolism"
    explanation: The finding itself.
- name: Trilineage Bone Marrow Failure
  description: >-
    Global marrow failure affecting all three lineages, which is the feature
    that defines the syndrome and the reason the founding cohort was assembled
    from children who did not fit any existing bone marrow failure syndrome.
    The severity is variable: the first reported adult had isolated
    non-progressive thrombocytopenia.
  biological_scale: TISSUE
  node_class: HAEMATOLOGICAL_DEFICIT
  downstream:
  - target: Bone Marrow Failure
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Neutropenia
    causal_link_type: DIRECT
  - target: Recurrent Infections
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They present with global BMF, and one individual developed a hematological cancer (acute myeloid leukemia) in childhood."
    explanation: The global, trilineage character of the marrow failure in the founding cohort.
- name: Myeloid Neoplasia Predisposition
  description: >-
    A predisposition to myelodysplastic syndrome and acute myeloid leukaemia,
    shared with the other Shwachman-Diamond spectrum genes SBDS and SRP54. One
    child in the founding cohort developed acute myeloid leukaemia. This is
    the reason the disease is described as cancer-prone and the reason
    surveillance is recommended.
  biological_scale: TISSUE
  node_class: PROGRESSION_AND_TRANSFORMATION
  downstream:
  - target: Acute Myeloid Leukemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37226705
    reference_title: "Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SBDS, DNAJC21, and SRP54 variants have been associated with myeloid neoplasia"
    explanation: Places DNAJC21 among the spectrum genes carrying myeloid neoplasia risk.

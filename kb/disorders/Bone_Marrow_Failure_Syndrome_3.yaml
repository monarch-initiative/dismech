name: Bone Marrow Failure Syndrome 3
creation_date: "2026-11-13T09:00:00Z"
category: Mendelian
synonyms:
- BMFS3
- bone marrow failure syndrome type 3
- DNAJC21-related bone marrow failure syndrome
- bone marrow failure syndrome caused by mutation in DNAJC21
disease_term:
  preferred_term: bone marrow failure syndrome 3
  term:
    id: MONDO:0014887
    label: bone marrow failure syndrome 3
parents:
- Bone marrow failure syndrome
- Ribosomopathy
description: >-
  Bone marrow failure syndrome 3 (BMFS3, OMIM 617052) is an autosomal
  recessive inherited bone marrow failure syndrome caused by biallelic
  loss-of-function variants in DNAJC21. DNAJC21 encodes a DnaJ/Hsp40
  co-chaperone that associates with ribosomal RNA and works with HSPA8 and
  the cofactors PA2G4 and ZNF622 in early nuclear rRNA biogenesis and in the
  late cytoplasmic maturation of the 60S large ribosomal subunit. The disease
  is therefore a ribosomopathy, and it sits inside the Shwachman-Diamond
  spectrum alongside SBDS, EFL1 and SRP54, which converge on the same step of
  ribosome maturation. Loss of DNAJC21 leaves the 60S nuclear export factor
  PA2G4 stranded in the cytoplasm, distorts ribosome profiles, reduces rRNA
  and increases cell death, and the resulting ribosomal stress falls hardest
  on haematopoietic progenitors, producing trilineage marrow failure.
  Children present with bone marrow failure, growth retardation, failure to
  thrive, developmental delay, recurrent infection and skin, teeth or hair
  abnormalities, with retinal, pancreatic, hepatic and skeletal involvement
  in some. The phenotype overlaps Shwachman-Diamond syndrome and dyskeratosis
  congenita without being either. The spectrum extends further than the
  paediatric presentation suggests: the first adult reported was a 20-year-old
  with thrombocytopenia, dysmorphic features and ovarian agenesis. One child
  in the founding cohort developed acute myeloid leukaemia, and the
  predisposition to myeloid neoplasia is the reason surveillance matters.
  There is no gene-specific therapy.
notes: >-
  Name and identity. The MONDO label is a serial number that does not name
  the gene, which is the situation CLAUDE.md warns about for this class of
  disease name. This entry is the DNAJC21 disease: MONDO:0014887, OMIM
  617052. The synonyms carry the gene-named forms so the entry is findable
  either way. It is distinct from bone marrow failure syndromes 1, 2 and 4 to
  6, which have different genes and separate entries where curated.
  GeneReviews. There is no DNAJC21 or BMFS3 chapter. A PubMed search of the
  GeneReviews book for the gene symbol
  (`DNAJC21[TIAB] AND genereviews[book] NOT retired[TI]`, run 2026-11-13)
  returns exactly one record, PMID:20301722, which is the
  Shwachman-Diamond Syndrome chapter. That chapter is a gene-scoped
  candidate rather than a baseline for this disease: its cached abstract does
  not mention DNAJC21 anywhere, so there is nothing in it to cross-reference
  against or to quote for BMFS3. The phenotype baseline is taken from the
  phenotype-refinement series (PMID:29700810) and the founding cohort
  (PMID:27346687) instead. PMID:20301722 is tagged GeneReviews in references
  all the same, because the tag records what kind of source it is and it
  is genuinely a GeneReviews chapter for a gene of this disease's
  spectrum; no claim in this entry is cited to it.
  Term binding. The deep-research report's term-validation section set
  needs_review with sixteen mislabelled CURIEs. Twelve of them are an
  artefact of the report putting a frequency word where the label belongs
  ("Common", "Core", "Variable"), and those HP identifiers are correct. Four
  are not: NCIT:C15360, offered as Blood Transfusion, is Adjuvant
  Chemotherapy; NCIT:C1512, offered as Granulocyte Colony-Stimulating Factor,
  is Immunoconjugate; NCIT:C92216, offered as Enzyme Replacement Therapy, is
  Seminal Vesicle/Coagulating Gland; and NCIT:C15280, offered as Antibiotic
  Therapy, is Breast Conservation Treatment. None of the four is used. Every
  term below was looked up in OLS at the time of writing.
  Treatments are deliberately sparse. The supportive measures the report
  lists (transfusion, G-CSF, pancreatic enzyme replacement, infection
  prophylaxis, transplantation) are the standard management of inherited
  bone marrow failure in general rather than claims sourced to a BMFS3
  paper, and the cited literature for this disease is five case series with
  no treatment data. Recording them here with no citable source for this
  disease would assert more than the literature supports, so only the two
  measures a BMFS3 source actually describes are recorded.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic DNAJC21 loss-of-function variants, homozygous or compound
    heterozygous. The gene is not loss-of-function constrained in population
    data, which is what a two-hit recessive mechanism predicts.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through exome sequencing, we have now identified a subgroup of these individuals, defined by germline biallelic mutations in DNAJC21 (DNAJ homolog subfamily C member 21)."
    explanation: The founding study establishes the biallelic germline basis.
  - reference: PMID:37186482
    reference_title: "DNAJC21-related thrombocytopenia in a young adult female."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow failure type 3 (BMFS3) (MIM:617052) is a subtype of inherited bone marrow failure syndromes (IBMFS) caused by homozygous pathogenic variants in DNAJC21."
    explanation: Independent statement of the recessive basis, keyed to the OMIM number.
genetic:
- name: DNAJC21
  gene_term:
    preferred_term: DNAJC21
    term:
      id: hgnc:27030
      label: DNAJC21
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants (frameshift, nonsense or splice-site)
  notes: >-
    DNAJC21 encodes a DnaJ/Hsp40 protein with two N-terminal tetratricopeptide
    repeat domains and a C-terminal J domain. Reported disease alleles are
    frameshift, nonsense and splice-site changes. Characterised missense
    changes act by the same route, impairing the interactions with PA2G4,
    HSPA8 and ZNF622 that the protein needs in order to do its job in 60S
    maturation. relationship_type is CAUSATIVE because ClinGen rates the
    DNAJC21 to this disease relationship Definitive (autosomal recessive,
    Childhood, Adolescent and Young Adult Cancer Predisposition GCEP); that
    assertion is recorded under gene_disease_validity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ff6cd8ae-86bd-4dc5-a2ca-ddca284c826c-2025-03-11T160000.000Z
    evidence:
    - reference: CGGV:assertion_ff6cd8ae-86bd-4dc5-a2ca-ddca284c826c-2025-03-11T160000.000Z
      reference_title: "DNAJC21 / bone marrow failure syndrome 3 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DNAJC21 | HGNC:27030 | bone marrow failure syndrome 3 | MONDO:0014887 | AR | Definitive | SOP11 | Childhood, Adolescent and Young Adult Cancer Predisposition Gene Curation Expert Panel"
      explanation: >-
        The ClinGen validity row this tier is copied from. Its MONDO term is
        this entry's own disease_term and its mode of inheritance is the
        autosomal recessive one recorded here.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, these findings demonstrate that mutations in DNAJC21 cause a cancer-prone BMF syndrome due to corruption of early nuclear rRNA biogenesis and late cytoplasmic maturation of the 60S subunit."
    explanation: The founding study's conclusion, naming both the gene and the mechanism.
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Characterization of mutations revealed impairment in interactions with cofactors (PA2G4, HSPA8, and ZNF622) involved in 60S maturation."
    explanation: How the disease alleles act at the protein-interaction level.
  variants:
  - name: c.983+1G>A (NM_001012339.3)
    description: >-
      A homozygous canonical splice-donor change at the exon 7 boundary,
      reported in a girl investigated for cytopenia and dysmorphism whose
      diagnosis came from a reanalysis of existing exome data. RNA sequencing
      showed that the variant skips exon 7, deleting 88 nucleotides, so the
      mechanism is demonstrated at the transcript level rather than predicted
      from the position of the change.
    type: splice donor variant
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: DNAJC21
      term:
        id: hgnc:27030
        label: DNAJC21
    evidence:
    - reference: PMID:38408162
      reference_title: "A Rare Inherited Bone Marrow Failure Syndrome Disclosed by Reanalysis of the Exome Data of a Patient Evaluated for Cytopenia and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reanalysis of the ES data revealed a homozygous splice-site variant in the DNAJC21 (NM_001012339.3:c.983+1G>A), causing Shwachman-Diamond Syndrome (SDS)."
      explanation: >-
        The variant, its transcript reference and its zygosity, in the patient
        it was found in.
    - reference: PMID:38408162
      reference_title: "A Rare Inherited Bone Marrow Failure Syndrome Disclosed by Reanalysis of the Exome Data of a Patient Evaluated for Cytopenia and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It was shown by the RNA sequencing that exon 7 was skipped, causing an 88-nucleotide deletion."
      explanation: >-
        The measured consequence at the transcript level, which is what makes
        this a demonstrated rather than a predicted splice effect.

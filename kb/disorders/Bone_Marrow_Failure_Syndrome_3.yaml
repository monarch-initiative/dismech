- category: Clinical
  name: Ectodermal Abnormalities
  description: >-
    Abnormalities of skin, teeth or hair, present in every reported patient.
    It is this ectodermal component, together with the marrow failure, that
    produces the overlap with dyskeratosis congenita.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormality of the skin, teeth or hair
  notes: >-
    Deliberately unbound. The source states a disjunction, "skin, teeth or
    hair abnormalities", in every patient, and does not say which patient had
    which, so no one term is supported at this frequency. An earlier version
    bound HP:0000164 Abnormality of the dentition, which asserted that every
    patient has a dental abnormality; the sentence does not say that.
    Two candidates were searched in OLS and rejected on stated grounds.
    `l~ectodermal dysplasia` returns HP:0000968 Ectodermal dysplasia, which
    is a diagnostic concept these reports do not apply to their patients.
    `l~Abnormality of the integument` returns HP:0001574, which covers skin,
    hair and nails but not teeth, so it would miss the dental arm of the
    disjunction while still claiming universality. HPO has no term spanning
    integument and dentition together. The three components are named in the
    preferred_term and the description instead.
  evidence:
  - reference: PMID:29700810
    reference_title: "Refining the phenotype associated with biallelic DNAJC21 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients present features consistent with IBMFS: bone marrow failure, growth retardation, failure to thrive, developmental delay, recurrent infections, and skin, teeth or hair abnormalities."
    explanation: The ectodermal features among the universal core features.
- category: Laboratory
  name: Thrombocytopenia
  description: >-
    Low platelets as part of the marrow failure. In the first reported adult
    it was the presenting and essentially the only haematological finding,
    persistent and non-progressive, which is what led her reporters to
    suggest that DNAJC21 should be considered in adults with unexplained
    thrombocytopenia.
  frequency: FREQUENT
  notes: >-
    The band is a qualitative reading. The only cached source that isolates
    thrombocytopenia is the single adult case report, where it was the
    presenting finding; no cohort source reports a platelet-count rate for

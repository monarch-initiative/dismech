diagnosis:
- name: Exome Sequencing
  description: >-
    The disease was defined by exome sequencing of children with bone marrow
    failure who did not meet the criteria of any known syndrome, and exome
    sequencing remains the route to the diagnosis. The adult case report
    makes the point that it should be offered to adults as well, because a
    mild non-progressive cytopenia will not otherwise be investigated.
  evidence:
  - reference: PMID:27346687
    reference_title: "DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through exome sequencing, we have now identified a subgroup of these individuals, defined by germline biallelic mutations in DNAJC21"
    explanation: The method by which the disease was defined and is diagnosed.
  - reference: PMID:37186482
    reference_title: "DNAJC21-related thrombocytopenia in a young adult female."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we encourage revisiting undiagnosed patients to offer whole exome sequencing (WES) in adulthood."
    explanation: The recommendation to extend testing to adults.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Transplantation is the established treatment for marrow failure in the
    inherited bone marrow failure syndromes, and one DNAJC21 patient has been
    reported in a transplanted cohort: a child in a 32-patient series of
    acquired severe aplastic anaemia and non-Fanconi IBMFS given an
    HLA-matched related graft after low-dose cyclophosphamide, fludarabine and
    anti-thymocyte globulin. It is recorded for that one patient's inclusion
    and not for an outcome: the series reports 93% event-free and 95% overall
    survival at three years across all 32 children, which is a cohort figure
    and says nothing about the DNAJC21 patient individually. No DNAJC21-specific
    transplant outcome has been published.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Trilineage Bone Marrow Failure
    description: >-
      Replaces the failing haematopoiesis. It does not address the ribosome
      defect in any other tissue.
  evidence:
  - reference: PMID:37491781
    reference_title: "Human leucocyte antigen-matched related haematopoietic stem cell transplantation using low-dose cyclophosphamide, fludarabine and thymoglobulin in children with severe aplastic anaemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients had deleterious mutations (two ERCC6L2, two ANKRD26, two TINF2, one LZTFL1, one RTEL1 and one DNAJC21)."
    explanation: >-
      The one sentence in the cached literature that places a DNAJC21 patient
      in a transplanted cohort. Indirect because the cohort is mixed and the
      reported outcomes are not broken down by gene, so this establishes that
      such a patient was transplanted rather than how transplantation performs
      in this disease.
- name: Multisystem Surveillance
  description: >-
    The phenotype-refinement series provides a checklist for clinical
    evaluation at diagnosis and at regular follow-up, prompted by the aplastic
    anaemia, the possible increased leukaemia risk and the multisystem
    features. Surveillance rather than treatment is what the literature for
    this disease actually supports.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: structured multisystem surveillance at diagnosis and follow-up
    term:
      id: NCIT:C15419
      label: Disease Screening
  target_mechanisms:
  - target: Myeloid Neoplasia Predisposition
    description: Detects transformation rather than preventing it.
  evidence:
  - reference: PMID:29700810
    reference_title: "Refining the phenotype associated with biallelic DNAJC21 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the aplastic anemia, the possible increased risk for leukemia, and the multisystemic features, we provide a checklist for clinical evaluation at diagnosis and regular follow-up."
    explanation: The surveillance recommendation and the three reasons given for it.

pathophysiology:
- name: NFIX Haploinsufficiency
  description: >
    Malan syndrome results from haploinsufficiency of the NFIX transcription factor.
    NFIX variants causing Malan syndrome cluster in the N-terminal DNA-binding and
    dimerization domain (exons 2 and 3), or are whole-gene deletions. These
    variants are missense variants mostly in exon 2 or protein-truncating variants
    that trigger nonsense-mediated mRNA decay (NMD), resulting in loss of functional
    NFIX protein. This is distinct from Marshall-Smith syndrome, where NFIX variants
    cluster in exons 6-10 and escape NMD, producing a dominant-negative effect.
  gene:
    preferred_term: NFIX
    description: Nuclear factor I X transcription factor.
    modifier: DECREASED
    term:
      id: hgnc:7788
      label: NFIX

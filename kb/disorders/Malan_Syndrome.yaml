differential_diagnoses:
- name: Marshall-Smith syndrome
  description: >-
    Marshall-Smith syndrome is an allelic autosomal dominant NFIX disorder
    caused by protein-truncating variants in exons 6-10 that escape
    nonsense-mediated mRNA decay and exert a dominant-negative effect,
    resulting in failure to thrive, severe respiratory compromise, and marked
    accelerated osseous maturation rather than postnatal overgrowth.
  distinguishing_features:
  - NFIX protein-truncating variants cluster in exons 6 to 10 and escape nonsense-mediated decay in Marshall-Smith syndrome, whereas Malan syndrome variants are missense variants mostly in exon 2 or protein-truncating variants and whole-gene deletions that trigger NMD and cause NFIX haploinsufficiency.
  - Failure to thrive and more severe skeletal and respiratory manifestations distinguish Marshall-Smith syndrome from the overgrowth phenotype of Malan syndrome.
  disease_term:
    preferred_term: Marshall-Smith syndrome
    term:
      id: MONDO:0011244
      label: Marshall-Smith syndrome
  evidence:
  - reference: PMID:38168088
    reference_title: "Novel molecular mechanism in Malan syndrome uncovered through genome sequencing reanalysis, exon-level Array, and RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NFIX variants associated with Malan syndrome are missense variants mostly
      located in exon 2 encoding the N-terminal DNA binding and dimerization
      domain or are protein-truncating variants that trigger nonsense-mediated
      mRNA decay (NMD) resulting in NFIX haploinsufficiency. NFIX variants
      associated with Marshall-Smith syndrome are protein-truncating and are
      clustered between exons 6 and 10, including a recurrent Alu-mediated
      deletion of exons 6 and 7, which can escape NMD. The more severe phenotype
      of Marshall-Smith syndrome is likely due to a dominant-negative effect of
      these protein-truncating variants that escape NMD.
    explanation: >-
      Directly contrasts the exon clustering and NMD-escape dominant-negative
      mechanism of Marshall-Smith syndrome with the haploinsufficiency mechanism
      of Malan syndrome.
  - reference: PMID:28584646
    reference_title: "A novel mutation of NFIX causes Sotos-like syndrome (Malan syndrome) complicated with thoracic aortic aneurysm and dissection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since mutations in the NFIX gene are known to cause Marshall–Smith
      syndrome (MSS (OMIM #602535)), which is characterized by the triad of
      facial dysmorphism, failure to thrive, and accelerated osseous maturation,
      the clinical and genetic differences between these two NFIX-associated
      diseases have been actively explored.
    explanation: >-
      Documents the clinical triad of Marshall-Smith syndrome (including failure
      to thrive) that distinguishes it from Malan syndrome.
- name: Sotos syndrome
  description: >-
    Sotos syndrome (NSD1-related overgrowth) shares postnatal overgrowth,
    macrocephaly, advanced bone age, intellectual disability, and overlapping
    facial features (prominent forehead, high anterior hairline, downslanting
    palpebral fissures, and prominent chin) with Malan syndrome (historically
    termed Sotos syndrome 2).
  distinguishing_features:
  - Caused by pathogenic variants or 5q35 deletions involving NSD1 rather than NFIX on molecular genetic testing.
  disease_term:
    preferred_term: Sotos syndrome
    term:
      id: MONDO:0019349
      label: Sotos syndrome
  evidence:
  - reference: PMID:25118028
    reference_title: "Malan syndrome: Sotos-like overgrowth with de novo NFIX sequence variants and deletions in six new patients and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is overlap of the facial phenotype with NSD1-positive Sotos syndrome
      in some cases including a prominent forehead, high anterior hairline,
      downslanting palpebral fissures and prominent chin.
    explanation: >-
      Documents the facial and overgrowth overlap between Malan syndrome and
      NSD1-positive Sotos syndrome.
  - reference: PMID:29897170
    reference_title: "Further delineation of Malan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differentiation from Sotos and Weaver syndrome can be made by clinical
      evaluation only.
    explanation: >-
      Identifies Sotos syndrome and Weaver syndrome as the primary overgrowth
      differentials for Malan syndrome.
- name: Weaver syndrome
  description: >-
    Weaver syndrome is an autosomal dominant overgrowth and intellectual
    disability syndrome that overlaps clinically with Malan syndrome through
    prenatal and postnatal overgrowth, macrocephaly, and advanced bone age.
  distinguishing_features:
  - Distinguished by clinical facial gestalt and absence of pathogenic NFIX variants or 19p13.2 deletions on molecular testing.
  disease_term:
    preferred_term: Weaver syndrome
    term:
      id: MONDO:0010193
      label: Weaver syndrome
  evidence:
  - reference: PMID:29897170
    reference_title: "Further delineation of Malan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differentiation from Sotos and Weaver syndrome can be made by clinical
      evaluation only.
    explanation: >-
      Explicitly names Weaver syndrome alongside Sotos syndrome as a key
      clinical differential diagnosis for Malan syndrome.
  - reference: PMID:39083629
    reference_title: "NFIX-Related Malan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, MALNS appears to be in the same low risk group as Sotos
      syndrome and Weaver syndrome with respect to a low likelihood of
      developing cancer.
    explanation: >-
      GeneReviews compares Malan syndrome with Sotos syndrome and Weaver
      syndrome within the overgrowth syndrome group.

      with HA20 has a 50% chance of inheriting the TNFAIP3 pathogenic variant.'
    explanation: Gives the transmission risk and records that de novo cases occur, which matters
      because familial occurrence is one of the discriminators against Behcet disease and a de
      novo case will not show it.
diagnosis:
- name: Distinguishing A20 haploinsufficiency from Behcet disease
  presence: PRESENT
  description: >-
    The central diagnostic problem. Patients present with recurrent oral and
    genital ulcers and are diagnosed and treated as Behcet disease; roughly half
    of reported cases had reached that diagnosis. A comparison of 54 patients with
    this disease against 520 Japanese Behcet patients identified the
    discriminating features: early onset, familial occurrence and recurrent fever.
    None of those is a laboratory test, so recognition depends on taking a family
    history and noticing the fever pattern.
  evidence:
  - reference: PMID:31164164
    reference_title: "Haploinsufficiency of A20 caused by a novel nonsense variant or entire deletion of TNFAIP3\
      \ is clinically distinct from Behçet's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A comparison of clinical features between HA20 patients and cohorts of BD patients
      revealed several critical features specific to HA20. These were early-onset, familial
      occurrence, recurrent fever attacks, gastrointestinal involvement, and infrequent ocular
      involvement.'
    explanation: The full discriminator list from a direct cohort comparison. Note the last item
      is a negative - ocular involvement is infrequent here, whereas it is characteristic of
      Behcet disease, so its absence is part of what separates them.
  - reference: PMID:31164164
    reference_title: "Haploinsufficiency of A20 caused by a novel nonsense variant or entire deletion of TNFAIP3\
      \ is clinically distinct from Behçet's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Four HA20 patients in the two families presented with childhood-onset recurrent oral
      and genital ulcers and were initially diagnosed and treated as BD.'
    explanation: A concrete instance of the misdiagnosis this entry is warning about.
- name: Molecular genetic testing of TNFAIP3
  presence: PRESENT
  description: >-
    Diagnosis is molecular. Whole exome sequencing found the causal variants in
    the families described, and copy number analysis matters too, since whole-gene
    deletion is one of the mechanisms and would be missed by sequencing alone.
  evidence:
  - reference: PMID:31164164
    reference_title: "Haploinsufficiency of A20 caused by a novel nonsense variant or entire deletion of TNFAIP3\
      \ is clinically distinct from Behçet's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Probands of these families were analyzed by whole exome sequencing (WES) and subsequent
      Sanger sequencing.'
    explanation: States the testing approach used to make the diagnosis in these families.
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of HA20 is established in an individual by identification of either
      a heterozygous TNFAIP3 pathogenic variant (~95% of affected individuals) or a heterozygous
      deletion of 6q23 including TNFAIP3 (<5% of affected individuals) by molecular genetic
      testing.'
    explanation: Gives the two diagnostic routes with their relative yields. The under 5% deletion
      share is the practical reason sequence analysis alone is not sufficient - copy number must
      also be assessed.
treatments:
- name: Tumour Necrosis Factor Blockade
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    The most effective single class in the largest treatment series. In a Japanese
    national survey, molecular targeted drugs were given to 44.4% of patients and
    anti-TNF agents were effective in 59.5% of those treated. Note what that
    means: roughly forty per cent did not respond, so this is the best available
    option rather than a reliable one, and eleven patients failed to achieve
    control on their initial agent.
  treatment_term:
    preferred_term: biological therapy
    term:
      id: NCIT:C15187
      label: Biological Therapy
  target_mechanisms:
  - target: Systemic Autoinflammation
    treatment_effect: INHIBITS
    description: Neutralises TNF, one of the proinflammatory cytokines whose expression rises
      when NF-kappa-B is unrestrained.
    evidence:
    - reference: PMID:40574834
      reference_title: 'Clinical characteristics and treatment strategies for A20 haploinsufficiency in Japan:
        a national epidemiological survey.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Molecular target drugs (MTDs) were administered in 44.4% of patients, among which
        anti-tumor necrosis factor (TNF)-α agents showed efficacy in 59.5% of patients.'
      explanation: Gives both the proportion treated and the response rate, which together define
        how much of the disease this approach actually controls.
  evidence:
  - reference: PMID:40574834
    reference_title: 'Clinical characteristics and treatment strategies for A20 haploinsufficiency in Japan:
      a national epidemiological survey.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Seventy-two HA20 patients were identified in Japan. And, 54 patients from 37 unrelated
      families were analyzed in detail.'
    explanation: Establishes the size of the series behind the treatment figures, which is the
      largest available for this disease.
  - reference: PMID:40574834
    reference_title: 'Clinical characteristics and treatment strategies for A20 haploinsufficiency in Japan:
      a national epidemiological survey.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The severity of A20 haploinsufficiency (HA20) varies, with no established clinical
      guidelines for treatment.'
    explanation: Recorded against any reading of the efficacy figure as a standard of care. The
      same survey states there are no established treatment guidelines.
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Supportive treatment: TNF inhibitors, the most used medications, directly target
      abnormal NF-κB signaling.'
    explanation: Names TNF inhibitors as the most used agents and states the mechanistic rationale
      - they act on the pathway this disease de-represses.
- name: Interleukin-1 and JAK-Directed Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Second-line options for patients not controlled by TNF blockade, which is a
    substantial group given the roughly forty per cent non-response rate. Both are
    described as effective in many individuals, without a quantified response rate
    in these sources.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Systemic Autoinflammation
    treatment_effect: INHIBITS
    description: IL-1 blockade neutralises one cytokine output of the derepressed pathway; JAK
      inhibition acts downstream of the interferon and cytokine receptors engaged by it.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In addition, IL-1 targeted therapy and JAK inhibitors are effective in many
        individuals.'
      explanation: States effectiveness for both classes. Note "many individuals" is not a rate,
        so this supports availability of the option rather than a quantified expectation.
  evidence:
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In addition, IL-1 targeted therapy and JAK inhibitors are effective in many
      individuals.'
    explanation: Establishes these as recognised effective options alongside TNF blockade.
- name: Haematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Reserved for severe or refractory disease. It is the only listed option that
    addresses the mutant haematopoietic compartment itself rather than a cytokine
    downstream of it, and it is stated as something that may be considered rather
    than as established therapy.
  treatment_term:
    preferred_term: allogeneic stem cell transplantation
    term:
      id: NCIT:C201466
      label: Allogeneic Stem Cell Transplantation
  evidence:
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In some instances of severe or refractory disease, hematopoietic stem cell
      transplantation may be considered.'
    explanation: States the indication and, in its own hedged phrasing, the strength of the
      recommendation.

    id: MONDO:0100222
    label: A20 haploinsufficiency
notes: >-
  Why this entry is largely about a differential diagnosis. Roughly half of all
  reported cases had been diagnosed as Behcet disease before the genetic cause was
  found, and patients are treated as Behcet for years. The disease is separable,
  but only on features a clinician has to be looking for. A direct comparison of
  54 patients against 520 Behcet patients identified early onset, familial
  occurrence and recurrent fever as the discriminators. None of them is a
  laboratory finding. The diagnosis section is therefore written around that
  comparison rather than around a test.

  Loss of a brake, not gain of a signal. A20 terminates canonical NF-kappa-B
  signalling, so halving it removes negative regulation rather than adding drive.
  That is the most likely explanation for the phenotype's breadth: patients show
  autoinflammatory and autoimmune features together, across mucosa, skin, gut,
  joints, eye and liver, which is unusual for a monogenic disease and is what one
  would expect from de-restraining a pathway used by many stimuli rather than
  from a defect in one effector.

  Evidence for haploinsufficiency specifically, from two directions. The
  observational argument is that a nonsense variant and a 236 kb deletion removing
  the whole gene produce the same disease, and a deletion cannot act as a dominant
  negative. The experimental argument is stronger and comes from the original
  2016 description: truncated A20 proteins were tested for a dominant-negative
  effect in overexpression and did not show one. The disease is therefore about
  gene dosage, and both arguments are recorded rather than only the allele list.

  A correction to the draft. The first version of this entry did not cite the
  paper that described the disease. The 2016 report in six unrelated families is
  the source for the dominant-negative exclusion experiment, for the molecular
  detail that A20 acts through its deubiquitinase activity, and for the
  measurements in patient cells showing increased IkappaB-alpha degradation, p65
  nuclear translocation and cytokine output. All of that was reachable from the
  searches run, and its absence was a gap in my reading rather than in the
  literature. The deep-research job surfaced it.

  The inflammasome arm is graded HYPOTHETICAL and should stay that way until
  human evidence exists. A20 negatively regulates the NLRP3 inflammasome, and
  myeloid-specific A20 deletion in mice causes an erosive arthritis that persists
  without TNF receptor 1, which argues for a second pathway. But that is a
  complete knockout restricted to one lineage, not heterozygous loss in a whole
  organism, and the human arthritis in this disease is usually nonerosive. The
  mismatch is stated in the evidence explanation rather than left for a reader to
  notice.

  Frequency bands and how they were assigned. All five frequency values come from
  a single quoted sentence, reproduced in full under epidemiology so it can be
  checked directly. Where a reported percentage covers a category rather than the
  specific phenotype - skin involvement at 40% rather than pustular rash at 40% -
  the phenotype is banded one level lower and the reason is stated in its evidence
  explanation.

  On the treatment figure. Anti-TNF is the best available option and is not a
  reliable one. In the largest series, molecular targeted drugs were used in 44.4%
  of patients and anti-TNF was effective in 59.5% of those, so roughly forty per
  cent of treated patients did not respond and eleven failed their initial agent.
  The same survey states there are no established treatment guidelines, and that
  statement is carried as REFUTE evidence against reading the efficacy figure as a
  standard of care.

  A correction, review round 1. This section previously stated that IL-1, IL-6 and
  JAK-directed therapy and haematopoietic cell transplantation had no quotable
  outcome data in the cached references. That was false, and the contradicting
  sentences were in a file added by the same commit. The GeneReviews chapter
  states that IL-1 targeted therapy and JAK inhibitors are effective in many
  individuals and that transplantation may be considered in severe or refractory
  disease. Both are now modelled as treatments. The cause was that the chapter was
  mined only for its Clinical Characteristics section; its Diagnosis, Management
  and Genetic Counseling sections were not read, and they supplied the diagnostic
  yield split, the treatment options and the transmission risk that this entry now
  carries. Recorded rather than silently corrected, because prose describing what
  the repository contains is a factual claim and this one was wrong.

  Known extension points: uveitis and other ocular involvement; hepatic
  involvement including severe hepatitis progressing to cirrhosis; central nervous
  system vasculitis and the other neurologic manifestations; lymphoproliferation;
  the type I interferon signature described as a biomarker of disease activity;
  and the reported subset meeting criteria for systemic lupus erythematosus, which
  would make this a monogenic lupus as well as an autoinflammatory disease.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check. Three of the ten cached references are full
  text rather than abstracts, and content_type was checked before writing.

name: A20 Haploinsufficiency
creation_date: '2026-09-09T09:00:00Z'
description: >-
  An autosomal dominant autoinflammatory disease caused by loss-of-function
  variants in TNFAIP3, which encodes A20. A20 is a deubiquitinase that terminates
  canonical NF-kappa-B signalling, so losing one functional copy leaves the
  pathway insufficiently restrained and produces early-onset systemic
  inflammation. Most patients present with recurrent oral and genital ulceration
  and are diagnosed as Behcet disease, which is the central clinical problem: the
  two are separable, but only on features a clinician has to be looking for -
  early onset, familial occurrence and recurrent fever. The mechanism is a loss
  of negative regulation rather than a gain of signal, and the phenotype is
  correspondingly broad, spanning autoinflammatory and autoimmune features in the
  same patient.
categories:
- Autoinflammatory Disease
- Inborn Error of Immunity
- NF-kappa-B Regulatory Disorder
parents:
- autoinflammatory syndrome
synonyms:
- HA20
- haploinsufficiency of A20
- TNFAIP3 haploinsufficiency
epidemiology:
- name: Reported case count
  description: >-
    Newly described in 2016 and still uncommon in the literature. Sixty-one cases
    had been reported worldwide at the time of one 2021 review, of which 29 had
    ultimately been diagnosed as Behcet disease.
  evidence:
  - reference: PMID:34011076
    reference_title: 'Mutation analysis of the TNFAIP3 in A20 haploinsufficiency: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sixty-one cases of HA20 have been reported worldwide, among which 29 cases were
      diagnosed with Behcet disease ultimately.'
    explanation: Gives the reported total and, more usefully, the proportion that reached a Behcet
      diagnosis, which quantifies the misclassification problem.
- name: Manifestation frequencies
  description: >-
    In the largest synthesis, recurrent oral and genital ulcers occur in more than
    70%, recurrent fevers in about 50%, skin involvement and gastrointestinal
    disease in about 40% each, and arthralgia or arthritis in about 34%.
  evidence:
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The most common manifestations and their frequency include: (1) recurrent painful
      oral/genital ulcers, typically during disease flares (>70% of persons); (2) recurrent fevers
      (~50%), typically lasting for three to seven days that can rarely progress to a cytokine
      storm and/or hemophagocytic lymphohistiocytosis; (3) skin involvement (~40%), including
      pustular rashes, folliculitis, vasculitic purpura, urticaria, lupus-like macular rashes,
      and eczematoid dermatitis; (4) gastrointestinal disease (~40%), ranging from dull abdominal
      pain (due to serositis, ulcers, or bowel inflammation) to severe inflammation with risk
      of bowel perforation; and (5) arthralgia/arthritis (~34%), typically relapsing and/or
      remitting nonerosive inflammatory polyarthritis with synovitis, and rarely resembling
      rheumatoid arthritis or psoriatic-like erosions.'
    explanation: The source for every frequency band used in the phenotypes below, quoted in full
      so a reader can verify each band directly from this one sentence.
- name: Reclassification from Behcet subtype to inborn error of immunity
  description: >-
    Originally described as an autosomal dominant form of Behcet disease, the
    condition is now regarded as a complex inborn error of immunity with a broad
    immunologic and clinical spectrum. That shift matters for curation: it is not
    a Behcet subtype and should not be modelled as one.
  evidence:
  - reference: PMID:38451381
    reference_title: 'The Complexity of Being A20: From Biological Functions to Genetic Associations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Originally described as an autosomal dominant form of Behcet''s disease, HA20 is
      now considered a complex inborn error of immunity with a broad spectrum of immunologic and
      clinical phenotypes.'
    explanation: States the reclassification directly, which is the reason this entry is separate
      from the Behcet disease entry rather than a subtype of it.
pathophysiology:
- name: TNFAIP3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A heterozygous loss-of-function variant in TNFAIP3
    halves functional A20. Nonsense, missense and whole-gene deletion alleles have
    all been reported, including a 236 kb deletion at 6q23.3, which is consistent
    with true haploinsufficiency rather than a dominant negative effect.
  genes:
  - preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  evidence:
  - reference: PMID:31164164
    reference_title: "Haploinsufficiency of A20 caused by a novel nonsense variant or entire deletion of TNFAIP3\
      \ is clinically distinct from Behçet's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified c.1434C>A:p.(Cys478*) in one family and a 236 kb deletion at 6q23.3
      containing TNFAIP3 in another family.'
    explanation: A nonsense allele and a whole-gene deletion causing the same disease, which is
      the evidence that the mechanism is dosage rather than an altered protein.
  - reference: PMID:26642243
    reference_title: Loss-of-function mutations in TNFAIP3 leading to A20 haploinsufficiency cause an early-onset
      autoinflammatory disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Herein we describe a new disease caused by high-penetrance heterozygous germline
      mutations in TNFAIP3, which encodes the NF-κB regulatory protein A20, in six unrelated
      families with early-onset systemic inflammation.'
    explanation: The original description of the disease, in six unrelated families, establishing
      heterozygous germline TNFAIP3 mutation as the cause.
  - reference: PMID:26642243
    reference_title: Loss-of-function mutations in TNFAIP3 leading to A20 haploinsufficiency cause an early-onset
      autoinflammatory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Mutant, truncated A20 proteins are likely to act through haploinsufficiency because
      they do not exert a dominant-negative effect in overexpression experiments.'
    explanation: The experiment that establishes haploinsufficiency rather than dominant negative
      action, by testing for a dominant-negative effect and not finding one.
  downstream:
  - target: Failure of A20-Mediated Deubiquitination
    causal_link_type: DIRECT
    description: Reduced A20 protein means reduced deubiquitinase activity at the NF-kappa-B
      signalling nodes A20 normally acts on.
    evidence:
    - reference: PMID:24242761
      reference_title: A20-mediated negative regulation of canonical NF-κB signaling pathway.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: 'The NF-κB target genes, IκBα and A20, play critical roles in termination of the
        active canonical NF-κB pathway.'
      explanation: Establishes A20 as one of the two principal terminators of NF-kappa-B
        signalling, which is the function lost here.
- name: Failure of A20-Mediated Deubiquitination
  biological_scale: MOLECULAR
  description: >-
    A20 terminates NF-kappa-B signalling by editing ubiquitin chains on upstream
    components. Its loss removes a brake rather than adding an accelerator, which
    is why the resulting phenotype is broad and variable rather than stereotyped.
  biological_processes:
  - preferred_term: protein deubiquitination
    modifier: DECREASED
    term:
      id: GO:0016579
      label: protein deubiquitination
  - preferred_term: negative regulation of canonical NF-kappaB signal transduction
    modifier: DECREASED
    term:
      id: GO:0043124
      label: negative regulation of canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:24242761
    reference_title: A20-mediated negative regulation of canonical NF-κB signaling pathway.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Therefore, to keep the inflammatory response in check, elaborate negative regulatory
      mechanisms operate to terminate NF-κB activation at multiple levels by de novo synthesis
      of NF-κB inhibitory proteins, and orchestration of protein ubiquitination and
      deubiquitination.'
    explanation: Places deubiquitination among the mechanisms that terminate NF-kappa-B
      signalling, which is the arm lost in this disease.
  - reference: PMID:26642243
    reference_title: Loss-of-function mutations in TNFAIP3 leading to A20 haploinsufficiency cause an early-onset
      autoinflammatory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'A20 restricts NF-κB signals via its deubiquitinase activity.'
    explanation: Names the specific enzymatic activity through which A20 restrains the pathway.
  downstream:
  - target: Constitutive NF-kappa-B Pathway Activation
    causal_link_type: DIRECT
    description: Without adequate termination, canonical NF-kappa-B signalling persists.
    evidence:
    - reference: PMID:29916847
      reference_title: Haploinsufficiency of A20 and other paediatric inflammatory disorders with mucosal
        involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'A20 haploinsufficiency is a newly described autoinflammatory disease caused by
        loss-of-function mutations in TNFAIP3 that result in the activation of the nuclear factor
        (NF)-kB pathway.'
      explanation: States the causal chain from the loss-of-function mutation to NF-kappa-B
        activation.
- name: Constitutive NF-kappa-B Pathway Activation
  biological_scale: CELLULAR
  description: >-
    Persistent canonical NF-kappa-B signalling in immune cells, demonstrated
    functionally in patient-derived mononuclear cells and in cell lines expressing
    the mutant protein.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:34808442
    reference_title: A novel missense mutation in TNFAIP3 causes haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Functional studies were performed in A20(c.1804A > T, p.T602S) patient-derived
      peripheral blood mononuclear cells (PBMCs) and THP-1 cell lines by lentivirus mediating
      stable over-expression of A20 and A20(c.1804A > T, p.T602S) to analyze the activity of NF-κB
      signaling pathway.'
    explanation: Describes the functional demonstration in both patient cells and a cell line,
      which is how a missense allele is shown to be loss of function rather than benign.
  - reference: PMID:26642243
    reference_title: Loss-of-function mutations in TNFAIP3 leading to A20 haploinsufficiency cause an early-onset
      autoinflammatory disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Patient-derived cells show increased degradation of IκBα and nuclear translocation
      of the NF-κB p65 subunit together with increased expression of NF-κB-mediated proinflammatory
      cytokines.'
    explanation: Measures the pathway at three points in patient cells - inhibitor degradation,
      p65 nuclear translocation and cytokine output - rather than inferring activation from
      phenotype.
  downstream:
  - target: Systemic Autoinflammation
    causal_link_type: DIRECT
    description: Unterminated NF-kappa-B drives the proinflammatory transcriptional programme
      that produces the clinical disease.
    evidence:
    - reference: PMID:29916847
      reference_title: Haploinsufficiency of A20 and other paediatric inflammatory disorders with mucosal
        involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Patients may present with dominantly inherited, early-onset systemic inflammation
        and a Behçet-like disease, or a variety of autoinflammatory and autoimmune features.'
      explanation: Names the clinical consequence and, importantly, its breadth - autoinflammatory
        and autoimmune features together.
  - target: Inflammasome Derepression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A20 also restrains the NLRP3 inflammasome, a second arm shown in mouse myeloid
      cells. Whether it contributes in human A20 haploinsufficiency is not established in these
      sources.
    evidence:
    - reference: PMID:25043000
      reference_title: Negative regulation of the NLRP3 inflammasome by A20 protects against arthritis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Myeloid-cell-specific deletion of the rheumatoid arthritis susceptibility gene
        A20/Tnfaip3 in mice (A20(myel-KO) mice) triggers a spontaneous erosive polyarthritis that
        resembles rheumatoid arthritis in patients.'
      explanation: Establishes the mouse model on which the inflammasome arm rests. Note this is
        a myeloid-specific complete deletion, not haploinsufficiency, so it is a different genetic
        situation from the human disease.
- name: Inflammasome Derepression
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A second regulatory arm. A20 negatively regulates the NLRP3 inflammasome, and
    losing it in mouse myeloid cells produces an erosive arthritis that does not
    depend on TNF receptor 1. Graded HYPOTHETICAL for this disease because the
    evidence is a myeloid-specific complete knockout in mice rather than
    heterozygous loss in humans.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: negative regulation of NLRP3 inflammasome complex assembly
    modifier: DECREASED
    term:
      id: GO:1900226
      label: negative regulation of NLRP3 inflammasome complex assembly
  evidence:
  - reference: PMID:25043000
    reference_title: Negative regulation of the NLRP3 inflammasome by A20 protects against arthritis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Rheumatoid arthritis in A20(myel-KO) mice is not rescued by deletion of tumour necrosis
      factor receptor 1 (ref. 2).'
    explanation: The arthritis persists without TNF receptor 1, which is what argues for a second
      pathway rather than a purely TNF-driven one.
  downstream:
  - target: Systemic Autoinflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: If operative in humans, inflammasome derepression would add IL-1 driven
      inflammation to the NF-kappa-B arm.
    evidence:
    - reference: PMID:25043000
      reference_title: Negative regulation of the NLRP3 inflammasome by A20 protects against arthritis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Interleukin-1 is an important mediator of cartilage destruction in rheumatic diseases,
        but our understanding of the upstream mechanisms leading to production of interleukin-1β
        in rheumatoid arthritis is limited by the absence of suitable mouse models of the disease
        in which inflammasomes contribute to pathology.'
      explanation: States the IL-1 output of this arm and, in the same sentence, the modelling
        limitation that makes its human relevance uncertain.
- name: Systemic Autoinflammation
  biological_scale: ORGANISM
  description: >-
    The clinical disease, and unusually broad for a monogenic condition. Mucosal
    ulceration dominates, but the phenotype spans fever, skin, gut, joints, eye
    and liver, and includes autoimmune as well as autoinflammatory features in the
    same patient. That breadth follows from losing a general brake on NF-kappa-B
    rather than from a lesion in one effector pathway.
  evidence:
  - reference: PMID:39715316
    reference_title: Haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Haploinsufficiency of A20 (HA20), a complex immune dysregulation disease, is
      characterized by recurrent systemic immune dysfunction (i.e., inflammation and/or immune
      deficiency).'
    explanation: Characterises the disease as systemic immune dysregulation rather than a single
      inflammatory syndrome.
  downstream:
  - target: Oral Ulcer
    causal_link_type: DIRECT
    description: Recurrent painful oral ulceration during flares, the commonest manifestation.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'recurrent painful oral/genital ulcers, typically during disease flares (>70% of
        persons)'
      explanation: Gives the frequency and ties the ulceration to disease flares.
  - target: Genital Ulcers
    causal_link_type: DIRECT
    description: Recurrent genital ulceration, occurring with the oral ulcers and together forming
      the Behcet-like picture.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'recurrent painful oral/genital ulcers, typically during disease flares (>70% of
        persons)'
      explanation: Same source sentence; the two ulcer sites are reported together.
  - target: Recurrent Fever
    causal_link_type: DIRECT
    description: Fever attacks lasting three to seven days, and one of the features that separates
      this from Behcet disease.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'recurrent fevers (~50%), typically lasting for three to seven days that can rarely
        progress to a cytokine storm and/or hemophagocytic lymphohistiocytosis'
      explanation: Gives the frequency, the duration, and the rare severe extreme.
  - target: Pustular Rash
    causal_link_type: DIRECT
    description: Skin involvement, which is heterogeneous and includes pustular rash,
      folliculitis, vasculitic purpura and lupus-like macular rashes.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'skin involvement (~40%), including pustular rashes, folliculitis, vasculitic purpura,
        urticaria, lupus-like macular rashes, and eczematoid dermatitis'
      explanation: Gives the frequency of skin involvement and enumerates its forms.
  - target: Abdominal Pain
    causal_link_type: DIRECT
    description: Gastrointestinal disease ranging from dull pain to severe inflammation with risk
      of perforation.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'gastrointestinal disease (~40%), ranging from dull abdominal pain (due to serositis,
        ulcers, or bowel inflammation) to severe inflammation with risk of bowel perforation'
      explanation: Gives the frequency and the severity range, including the perforation risk.
  - target: Arthritis
    causal_link_type: DIRECT
    description: Relapsing and remitting nonerosive inflammatory polyarthritis with synovitis.
    evidence:
    - reference: PMID:39715316
      reference_title: Haploinsufficiency of A20.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'arthralgia/arthritis (~34%), typically relapsing and/or remitting nonerosive
        inflammatory polyarthritis with synovitis, and rarely resembling rheumatoid arthritis or
        psoriatic-like erosions'
      explanation: Gives the frequency and specifies that the arthritis is usually nonerosive.

genetic:
- name: TNFAIP3
  gene_term:
    preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Heterozygous Loss of Function
  notes: >-
    True haploinsufficiency. Nonsense variants, missense variants and whole-gene
    deletions all cause the disease, and a 236 kb deletion removing TNFAIP3
    entirely produces the same phenotype as a point mutation. That argues the
    mechanism is gene dosage rather than a dominant negative or gain-of-function
    protein. Missense alleles require functional demonstration before they can be
    called causal, which is what the NF-kappa-B reporter work in patient cells
    provides.
  evidence:
  - reference: PMID:31164164
    reference_title: "Haploinsufficiency of A20 caused by a novel nonsense variant or entire deletion of TNFAIP3\
      \ is clinically distinct from Behçet's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified c.1434C>A:p.(Cys478*) in one family and a 236 kb deletion at 6q23.3
      containing TNFAIP3 in another family.'
    explanation: Two very different alleles producing the same disease, which is the argument for
      a dosage mechanism.
  - reference: PMID:34808442
    reference_title: A novel missense mutation in TNFAIP3 causes haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Herein, we reported a novel TNFAIP3 (c.1804A > T, p.T602S) variation, which has not
      been reported before.'
    explanation: A missense allele reported in a patient. Regraded from IN_VITRO on review - this
      sentence reports a clinical finding, and the paper is indexed as a case report.
  - reference: PMID:34808442
    reference_title: A novel missense mutation in TNFAIP3 causes haploinsufficiency of A20.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Functional studies were performed in A20(c.1804A > T, p.T602S) patient-derived
      peripheral blood mononuclear cells (PBMCs) and THP-1 cell lines by lentivirus mediating
      stable over-expression of A20 and A20(c.1804A > T, p.T602S) to analyze the activity of NF-κB
      signaling pathway.'
    explanation: The genuinely in-vitro half of the same paper, split into its own item so the
      grading matches the sentence rather than the publication.

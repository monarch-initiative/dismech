- name: Genetic anticipation
  inheritance_term:
    preferred_term: Genetic anticipation
    term:
      id: HP:0003743
      label: Genetic anticipation
  description: >-
    Repeat length is inversely correlated with age at onset and positively
    with severity, and the repeat lengthens in transmission, so offspring are
    often affected earlier and more severely than the transmitting parent.
  evidence:
  - reference: PMID:39095619
    reference_title: "Repeat length in spinocerebellar ataxia type 4 (SCA4) predicts age at onset and disease severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeat size, determined by our protocol for (GGC)n RE analysis shows a strong inverse correlation between repeat length and age at onset and anticipation in subsequent generations."
    explanation: Repeat length predicts onset age, with anticipation.
  - reference: PMID:38035881
    reference_title: "Exonic trinucleotide repeat expansions in ZFHX3 cause spinocerebellar ataxia type 4: A poly-glycine disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anticipation was observed in all families and correlated with different repeat lengths determined through long-read sequencing in two family members."
    explanation: Anticipation in all five Swedish families.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence is published. Confirmed families are of Swedish
    descent (Sweden, Utah, Iowa, Germany, other US families) or carry the
    Swedish founder haplotype (Chile). Large cohorts elsewhere have found few
    or no carriers: 3 families in 1,539 screened US patients, none in 347
    German and none in a Japanese cohort.
  evidence:
  - reference: PMID:42236257
    reference_title: "Frequency of ZFHX3-Mediated Spinocerebellar Ataxia 4 in a US Undiagnosed Ataxia Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype analysis supports a common Swedish founder allele, consistent with previously reported SCA4 cases."
    explanation: All known cases trace to one founder allele.
  - reference: PMID:40459184
    reference_title: "Identification of GGC Repeat Expansions in ZFHX3 among Chilean Movement Disorder Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These represent the first SCA4 cases identified outside Northern Europe."
    explanation: Cases outside Northern Europe still carry the Swedish haplotype.
progression:
- phase: Disease onset
  age_range: 12 to 65 years
  notes: >-
    About 10% of patients have onset before age 25, with more severe and
    often different disease; later onset usually begins with gait imbalance.
  evidence:
  - reference: PMID:39666847
    reference_title: "Spinocerebellar Ataxia Type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the approximately 10% of individuals whose onset is before age 25 years disease manifestations are more severe and often different from those with later-onset disease."
    explanation: Onset range and the early-onset severe subgroup.
- phase: Advanced disease
  notes: >-
    Bulbar, sensory, motor neuron and autonomic features accumulate. Early-onset
    severe disease shortens life through weight loss, infections and cardiac
    arrhythmia; life expectancy is normal or near normal with later onset.
  evidence:
  - reference: PMID:39666847
    reference_title: "Spinocerebellar Ataxia Type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reduced life expectancy in individuals with earlier-onset severe SCA4 is associated with weight loss, infections, and cardiac arrhythmia."
    explanation: Causes of reduced survival in early-onset disease.

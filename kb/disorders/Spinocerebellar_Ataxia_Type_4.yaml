    vermis in one Swedish case and almost completely in the vermis of a Utah
    patient decades after onset, with Bergmann gliosis, narrowing of the
    molecular layer and loss in the fastigial nucleus. The dentate nucleus can
    be spared. MRI shows cerebellar atrophy that is often mild relative to the
    clinical deficit.

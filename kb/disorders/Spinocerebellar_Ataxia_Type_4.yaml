pathophysiology:
- name: ZFHX3 Exonic GGC Repeat Expansion
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous GGC repeat expansion in exon 10 of ZFHX3. Normal alleles
    carry about 21 units interrupted by GGT and AGT codons; expanded alleles
    (roughly 40 to 57 units in reported families) are pure GGC. The expansion
    is in frame and encodes an elongated polyglycine tract in the C-terminal
    part of a roughly 400 kDa homeodomain-zinc finger transcription factor. It
    is not detectable by short-read exome sequencing.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Germline and inherited from an affected parent; every reported allele
      descends from one Swedish founder. Whether the expanded protein acts
      through a toxic or a normal-function gain is unresolved, so no
      functional impact category is recorded.
  genes:
  - preferred_term: ZFHX3
    term:
      id: hgnc:777
      label: ZFHX3
  downstream:
  - target: Polyglycine-Expanded ZFHX3 Accumulation and Aggregation
    causal_link_type: DIRECT
    description: >-
      The expanded repeat is translated in frame, giving a ZFHX3 protein that
      carries a long polyglycine domain and accumulates in patient cells.
    evidence:
    - reference: PMID:38684900
      reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This antibody recognized a 400 kDa protein in fibroblast cells from 4 SCA4 individuals, but did not recognize a signal in control FBs"
      explanation: >-
        An antibody to expanded polyglycine detects full-length ZFHX3 only in
        patient fibroblasts, showing the repeat is translated as polyglycine.
  evidence:
  - reference: PMID:38684900

genetic:
- name: ZFHX3
  gene_term:
    preferred_term: ZFHX3
    term:
      id: hgnc:777
      label: ZFHX3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous pure GGC repeat expansion in exon 10 of ZFHX3. Loss-of-function
    ZFHX3 variants cause a different, neurodevelopmental disorder, and SCA4
    patients have no neurodevelopmental or dysmorphic features. Screening of
    large ataxia cohorts outside populations of Swedish descent has found few
    or no carriers.
  evidence:
  - reference: PMID:38035881
    reference_title: "Exonic trinucleotide repeat expansions in ZFHX3 cause spinocerebellar ataxia type 4: A poly-glycine disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that SCA4 is caused by repeat expansions in ZFHX3."
    explanation: Gene-disease conclusion from five Swedish families.
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to individuals harboring loss-of-function ZFHX3 mutations, SCA4 patients show no neurodevelopmental orb dysmorphology phenotypes."
    explanation: Distinguishes the expansion disease from ZFHX3 loss-of-function disorder.
  - reference: PMID:42236257
    reference_title: "Frequency of ZFHX3-Mediated Spinocerebellar Ataxia 4 in a US Undiagnosed Ataxia Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified pathogenic SCA4 expansions in three families with cerebellar ataxia and sensory/autonomic neuropathy."
    explanation: Three families among 687 undiagnosed US ataxia patients.
  - reference: PMID:40898875
    reference_title: "Repeat-associated ataxias in a German patient cohort analysed by targeted parallel long-read sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing of another 347 patients for ZFHX3 expansions linked to SCA4 did not identify any cases."
    explanation: No carriers in a German diagnostic ataxia cohort.
  notes: >-
    No ClinGen gene-disease validity record for ZFHX3 and SCA4 is cached in
    this repository, so gene_disease_validity is left empty.

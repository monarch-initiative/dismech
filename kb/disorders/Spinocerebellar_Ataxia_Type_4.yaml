- name: Impaired Autophagy with mTOR Activation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  description: >-
    Patient iPSCs show raised total and phosphorylated mTOR, p62 and LC3-II,
    and patient fibroblasts show raised mTOR, phosphorylated mTOR, p62 and
    wild-type ATXN2. The authors read this as reduced autophagic flux. All
    changes normalize after ZFHX3 knockdown. The data come from non-neuronal
    cells (patient iPSCs became apoptotic when induced to become neurons), and
    flux itself was not measured, so the relevance of this node to neuronal
    death is inferred.

name: Spinocerebellar Ataxia Type 4
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
synonyms:
- SCA4
- spinocerebellar ataxia 4
- spinocerebellar ataxia autosomal dominant with sensory axonal neuropathy
- spinocerebellar ataxia, autosomal dominant, with sensory axonal neuropathy
description: >-
  Spinocerebellar ataxia type 4 (SCA4) is an autosomal dominant
  neurodegenerative disease caused by a heterozygous, uninterrupted GGC repeat
  expansion in the last coding exon (exon 10) of ZFHX3, which encodes an
  expanded polyglycine tract near the C-terminus of the transcription factor
  ZFHX3 (ATBF1). The locus was mapped to 16q22.1 in a Utah kindred of Swedish
  ancestry in 1996, but the expansion sits in an extremely GC-rich region and
  was found only in 2023-2024 by long-read sequencing. All reported pathogenic
  alleles share one ancient Swedish founder haplotype. The disease combines
  cerebellar ataxia with an invariable sensory neuropathy, slow saccades,
  brainstem signs, upper and lower motor neuron involvement and autonomic
  failure, of which orthostatic hypotension is the most disabling. Onset ranges
  from adolescence to the seventh decade; longer repeats give earlier and more
  severe disease, and anticipation is common. Autopsies show Purkinje cell
  loss, widespread brainstem and spinal neuronal loss, and p62- and
  ubiquitin-positive neuronal inclusions in the central and enteric nervous
  systems. Patient cells have more ZFHX3 protein, polyglycine aggregates and
  abnormal mTOR and autophagy markers that normalize when ZFHX3 is knocked
  down. Treatment is supportive.

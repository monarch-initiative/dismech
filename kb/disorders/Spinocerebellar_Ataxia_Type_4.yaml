diagnosis:
- name: ZFHX3 GGC repeat sizing
  description: >-
    Diagnosis requires detecting a heterozygous GGC expansion in the last
    exon of ZFHX3. The GC-rich repeat is missed by short-read exome
    sequencing; long-read sequencing or an adapted PCR/capillary
    electrophoresis assay sizes it.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39666847
    reference_title: "Spinocerebellar Ataxia Type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of SCA4 is established in a proband with suggestive findings by the identification of a heterozygous abnormal trinucleotide GGC repeat expansion in the terminal exon of ZFHX3 by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coding GGC-repeat expansion in an extremely G+C-rich region was not detectable by short-read whole-exome sequencing, which demonstrates the power of LR-GS for variant discovery."
    explanation: Exome sequencing misses the expansion.
  - reference: PMID:39095619
    reference_title: "Repeat length in spinocerebellar ataxia type 4 (SCA4) predicts age at onset and disease severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our protocol enables cost-effective and robust screening for the causative SCA4 RE within ZFHX3."
    explanation: A PCR-based sizing assay for clinical screening.
experimental_models:
- name: SCA4 patient fibroblasts and iPSCs
  description: >-
    Dermal fibroblasts from four affected members of the Utah kindred and
    iPSCs derived from one of them. Patient iPSCs became apoptotic when
    induced to differentiate into neurons, so neuronal cells could not be
    studied. The system mixes primary fibroblasts with undifferentiated
    iPSCs. The polyglycine aggregates were seen only in the iPSCs, not the
    fibroblasts. Raised mTOR, phospho-mTOR and p62, and their normalization
    by ZFHX3 knockdown, were shown in both cell types; LC3-II was measured
    in iPSCs.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  conditions:
  - SCA4 patient fibroblasts
  - SCA4 patient iPSCs
  - ZFHX3 siRNA knockdown
  publication: PMID:38684900
  modeled_mechanisms:
  - target: Impaired Autophagy with mTOR Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Patient cells show raised mTOR and autophagy markers that normalize with
      ZFHX3 knockdown.
    limitations: >-
      Undifferentiated iPSCs and fibroblasts, not neurons; marker abundance
      rather than measured autophagic flux; cells from one kindred.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Steady-state p62, LC3-II and mTOR levels stand in for autophagic flux,
        which the node describes but which was not measured directly.
    readouts:
    - name: mTOR, phospho-mTOR, p62 and LC3-II abundance
      target: Impaired Autophagy with mTOR Activation
      direction: INCREASED
      evidence:
      - reference: PMID:38684900
        reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In triplicate experiments, we found that all 4 proteins had increased steady-state levels in SCA4 iPSCs consistent with abnormal autophagy"
        explanation: The measurement behind this readout.
      - reference: PMID:38684900
        reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "With the availability of a larger number of FB lines from different individuals, we characterized autophagy in this cell type. As in iPSCs, we detected an increase in mTOR, p-mTOR, and p62"
        explanation: >-
          The same mTOR, phospho-mTOR and p62 increase was measured in patient
          fibroblast lines from several individuals.
    evidence:
    - reference: PMID:38684900
      reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Reduction of ZFHX3 normalized all autophagic markers and reduced ATXN2 levels."
      explanation: Knockdown rescue ties the cell phenotype to mutant ZFHX3.
  - target: Polyglycine-Expanded ZFHX3 Accumulation and Aggregation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Patient iPSCs contain ubiquitinated polyglycine aggregates, but these
      are cytoplasmic, whereas the inclusions in patient brain are mainly
      intranuclear.
    limitations: >-
      Aggregates were cytoplasmic only and were not seen in fibroblasts; the
      cells are not neurons.
    evidence:
    - reference: PMID:38684900
      reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Their location was clearly cytoplasmic and no intranuclear aggregates were detected."
      explanation: Aggregate location differs from the intranuclear inclusions in brain.
differential_diagnoses:
- name: Spinocerebellar ataxia 27B
  description: >-
    Late-onset dominant ataxia from an intronic FGF14 GAA expansion, also
    missed by standard sequencing and also associated with chronic cough.
  distinguishing_features:
  - Prominent sensory neuropathy, slow saccades and autonomic failure point towards SCA4
  - Downbeat nystagmus and episodic features point towards SCA27B
  evidence:
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to what has been observed in individuals with SCA27b13,14, some individuals had chronic cough without obvious cause after intensive investigation."
    explanation: Shared chronic cough with SCA27B.
- name: Fragile X-associated tremor/ataxia syndrome and neuronal intranuclear inclusion disease
  description: >-
    Other polyglycine (CGG/GGC repeat) diseases with p62-positive intranuclear
    inclusions; their expansions are in untranslated regions, and they show
    white matter MRI changes that SCA4 lacks.
  distinguishing_features:
  - No middle cerebellar peduncle sign and no corticomedullary junction hyperintensities in SCA4
  evidence:
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA4 differs phenotypically from other polyG disorders in the absence of episodic phenomena, myopathy, and white matter changes"
    explanation: Distinguishes SCA4 from other polyglycine disorders.
- name: Spinocerebellar ataxia type 31
  description: >-
    Another dominant ataxia mapped to 16q22.1, inside the old SCA4 candidate
    interval, caused by a complex (TGGAA)n-containing repeat insertion. The
    German SCA4 kindred was shown not to carry an SCA31 mutation, so the two
    are not allelic.
  distinguishing_features:
  - (TGGAA)n-containing insertion at the SCA31 locus rather than a ZFHX3 GGC expansion
  evidence:
  - reference: PMID:21267591
    reference_title: "Two dominantly inherited ataxias linked to chromosome 16q22.1: SCA4 and SCA31 are not allelic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on a nested-PCR approach and direct sequencing, a disease causing mutation at the SCA31 locus could be excluded for the German SCA4 kindred."
    explanation: SCA31 is excluded in a SCA4 kindred despite the shared locus.
discussions:
- discussion_id: gap_sca4_polyglycine_toxicity_route
  prompt: >-
    Does SCA4 neurodegeneration come from toxic polyglycine aggregation,
    excess normal ZFHX3 activity, nuclear loss of function, or RNA toxicity,
    and does impaired autophagy occur in affected neurons?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Polyglycine-Expanded ZFHX3 Accumulation and Aggregation
  - pathophysiology#Impaired Autophagy with mTOR Activation
  rationale: >-
    The only mechanistic data come from patient fibroblasts and
    undifferentiated iPSCs, and the discovery paper states it cannot separate
    a gain of normal function from a toxic gain. Patient iPSCs could not be
    differentiated into neurons, and no animal model has been reported. The
    choice between lowering ZFHX3, enhancing autophagy or lowering ATXN2 as a
    therapy depends on the answer.
  proposed_experiments:
  - experiment_id: exp_sca4_neuronal_models
    name: Neuronal and in vivo models of polyglycine-expanded ZFHX3
    description: >-
      Express pure expanded versus interrupted normal-length ZFHX3 repeats in
      iPSC-derived sensory and cerebellar neurons (for example by inducible
      differentiation that bypasses the apoptosis seen in patient lines) and
      in a knock-in mouse; compare autophagic flux, nuclear versus cytoplasmic
      inclusions, ZFHX3 transcriptional targets and neuronal survival, with
      and without ZFHX3 or ATXN2 lowering.
  evidence:
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results are consistent with a gain-of-function of polyG-expanded ZFHX3, but at this point we cannot discriminate between a gain-of-normal as compared to a gain-of-toxic function."
    explanation: The authors state the open question directly.
notes: >-
  Promoted from the SCA4 subtype row of
  Autosomal_Dominant_Cerebellar_Ataxia_Type_I, which now points here. The
  intranuclear neuronal inclusions differ in reported location between the
  Utah (intranuclear, basis pontis) and one Swedish (intranuclear and
  intracytoplasmic) autopsy, while patient iPSC aggregates were cytoplasmic.
  The German 2006 autopsy (PMID:16362839) predates the gene discovery; its
  family was linkage-confirmed and German SCA4 families were later shown to
  carry the ZFHX3 expansion.

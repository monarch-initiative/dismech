prevalence:
- population: Italian children 36 months of age or younger in an acellular
    pertussis vaccine trial follow-up cohort
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 210.0
  rate_denominator: PERSON_YEARS
  notes: 2.1 laboratory-confirmed parapertussis cases per 1,000 person-years.
  evidence:
  - reference: PMID:9542925
    reference_title: >-
      Bordetella parapertussis infection in children: epidemiology, clinical
      symptoms, and molecular characteristics of isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An overall incidence of 2.1 cases of laboratory-confirmed parapertussis
      per 1,000 person-years was observed.
    explanation: >-
      Reports the laboratory-confirmed parapertussis incidence in the trial
      cohort.
diagnosis:
- name: IS1001 real-time PCR on nasopharyngeal specimens
  description: >-
    Species-specific real-time PCR can detect B. parapertussis on
    nasopharyngeal specimens by targeting IS1001 alongside B. pertussis targets
    such as IS481 and the pertussis-toxin promoter region.
  results: >-
    Amplification of the B. parapertussis IS1001 target with species
    discrimination from B. pertussis.
  evidence:
  - reference: PMID:20718721
    reference_title: >-
      Triplex real-time PCR assay for detection and differentiation of
      Bordetella pertussis and Bordetella parapertussis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three targets were used for amplification in a single tube: the insertion
      sequence IS481 and the pertussis toxin promoter region (ptxP) for
      B. pertussis, and the insertion sequence IS1001 for B. parapertussis.
    explanation: >-
      Establishes IS1001 as the B. parapertussis target in a
      species-discriminating triplex real-time PCR.
treatments:
- name: Macrolide antibiotic therapy
  description: >-
    Macrolide therapy for parapertussis can use agents active against B.
    parapertussis, with in-vitro susceptibility data identifying azithromycin as
    the most potent macrolide among tested clinical isolates.
  notes: >-
    The cited evidence is in-vitro macrolide susceptibility (MIC) data for
    B. parapertussis isolates, not a clinical-efficacy study; macrolide use
    follows general pertussis management.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
  evidence:
  - reference: PMID:11757403
    reference_title: >-
      [Susceptibility to macrolide antibiotics of Bordetella pertussis and
      Bordetella parapertussis strains isolated from whooping cough patients in
      1968 and in 1997-99].
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The most active antibiotic against all strains was azithromycin (MIC90 =
      0.06 mg/l).
    explanation: >-
      Identifies azithromycin as the most active tested macrolide against B.
      parapertussis and B. pertussis isolates in agar-dilution susceptibility
      assays.

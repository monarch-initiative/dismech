    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cough is accompanied by paroxysms in 76% of the cases and by
      posttussive vomiting in nearly 40%.
    explanation: >-
      Reports posttussive vomiting in nearly 40% of pediatric B. parapertussis
      cases.
- name: Apnea
  description: >-
    Coughing episodes in B. parapertussis infection can be accompanied by
    apnea.
  phenotype_term:
    preferred_term: Apnea
    term:
      id: HP:0002104
      label: Apnea
  evidence:
  - reference: PMID:9542925
    reference_title: >-
      Bordetella parapertussis infection in children: epidemiology, clinical
      symptoms, and molecular characteristics of isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also, the mean durations of apnea (3 days) and cyanosis (1 day) were
      shorter in children with B. parapertussis
    explanation: >-
      Records apnea as an observed and measured symptom in children with

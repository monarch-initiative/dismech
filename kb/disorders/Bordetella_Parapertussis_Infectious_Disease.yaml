name: Bordetella Parapertussis Infectious Disease
creation_date: "2026-09-30T00:00:00Z"
description: >-
  Bordetella parapertussis infectious disease, or parapertussis, is an
  acute whooping-cough-like respiratory infection caused by Bordetella
  parapertussis. The bacterium uses a BvgAS-regulated Bordetella virulence
  program to colonize ciliated respiratory mucosa, expresses an O-antigen
  lipopolysaccharide that promotes complement evasion, and is poorly
  prevented by current B. pertussis-directed pertussis vaccines.
category: Infectious Disease
disease_term:
  preferred_term: Bordetella parapertussis infectious disease
  term:
    id: MONDO:0001353
    label: Bordetella parapertussis infectious disease
parents:
- Bordetellosis
- Bacterial Respiratory Infection
synonyms:
- B. parapertussis infection
- Parapertussis
review_notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 33
  reported references resolved and no extracted reference was marked
  off-topic. Term validation flagged obsolete GO:0009405 and wrong
  HP:0002102/HP:0031251 leads; those were not used. preflight-dr skipped
  automated gene identity checks because MONDO:0001353 records no causal
  gene; manual review confirmed the report covered MONDO:0001353 and
  Bordetella parapertussis.
infectious_agent:
- name: Bordetella parapertussis
  infectious_agent_term:
    preferred_term: Bordetella parapertussis
    term:
      id: NCBITaxon:519
      label: Bordetella parapertussis
  description: >-
    Gram-negative Bordetella species that causes human parapertussis, a
    pertussis-like respiratory illness.
  evidence:
  - reference: PMID:9542925
    reference_title: >-
      Bordetella parapertussis infection in children: epidemiology, clinical
      symptoms, and molecular characteristics of isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study dealt with 76 B. parapertussis infections diagnosed from a
      population of 15,601 children participating in the follow-up of suspected
      cases of pertussis.
    explanation: >-
      Identifies B. parapertussis as the organism recovered from
      laboratory-confirmed pediatric parapertussis cases.
  - reference: PMID:11689354
    reference_title: Mechanisms of Bordetella pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bordetella are Gram negative bacteria that cause respiratory tract
      infections in humans and animals.
    explanation: >-
      Places B. parapertussis in the Gram-negative Bordetella respiratory
      pathogen group.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Household respiratory transmission
  description: >-
    Human B. parapertussis circulates by close respiratory spread in households,
    where infants with pertussis-like disease can share infection with older
    siblings, adolescents, and mothers.
  evidence:
  - reference: PMID:22313629
    reference_title: >-
      Prevalence of Bordetella pertussis and Bordetella parapertussis
      infections in Tunisian hospitalized infants: results of a 4-year
      prospective study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the household contacts enrolled in the study, mothers seemed to be
      the likely source of infection.
    explanation: >-
      Supports household acquisition of Bordetella pertussis/parapertussis
      infections in infants.
  - reference: PMID:39565788
    reference_title: >-
      High pertussis circulation among infants, children and adolescents in
      Abidjan, Côte d'Ivoire.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-seven contact cases were considered as possible contaminators,
      primarily mothers (26%).
    explanation: >-
      Household contact tracing implicated mothers as the most frequent
      possible contaminators for infant B. pertussis/B. parapertussis
      infections.
pathophysiology:
- name: BvgAS-Regulated Airway Colonization
  role: trigger
  description: >-
    B. parapertussis colonizes ciliated respiratory mucosa with a Bordetella
    virulence program in which BvgAS positively regulates adhesins and toxins
    shared across the classical Bordetella species.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ciliated epithelial cell
    term:
      id: CL:0000067
      label: ciliated epithelial cell
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  downstream:
  - target: Bordetella O-Antigen Complement Evasion
    causal_link_type: DIRECT
    description: >-
      The colonizing bacterium expresses O-antigen lipopolysaccharide that
      protects it from complement during respiratory infection.
  - target: Pertactin-Mediated Resistance to Neutrophil Clearance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The colonizing Bordetella virulence program includes pertactin, an
      autotransporter that supports resistance to neutrophil-mediated
      clearance in the classical Bordetella cluster.
  - target: Vaccine Escape and Acellular Vaccine Facilitation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      B. parapertussis lacks the antigenic profile targeted by current
      B. pertussis vaccines and can expand in acellular-vaccine-conditioned
      rodent hosts.
  evidence:
  - reference: PMID:11689354
    reference_title: Mechanisms of Bordetella pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Expression of nearly all of these virulence factors is positively
      regulated by the products of the bvgAS locus.
    explanation: >-
      Establishes BvgAS as the regulator of the shared Bordetella adhesin and
      toxin program used for respiratory colonization.
  - reference: PMID:11689354
    reference_title: Mechanisms of Bordetella pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bordetella colonize the ciliated respiratory mucosa, a surface designed to
      eliminate foreign particles, thereby making the adherence and persistence
      mechanisms of these bacteria crucial.
    explanation: >-
      Grounds Bordetella pathogenesis in colonization of ciliated respiratory
      mucosa.
- name: Bordetella O-Antigen Complement Evasion
  role: modifier
  description: >-
    B. parapertussis uses wbm-dependent O-antigen lipopolysaccharide to avoid
    complement activation and complement-mediated killing, supporting tracheal
    and lung colonization.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of complement activation
    modifier: INCREASED
    term:
      id: GO:0045916
      label: negative regulation of complement activation
  downstream:
  - target: Whooping Cough-Like Illness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Complement evasion promotes persistence of B. parapertussis in the airway
      and supports the organism's respiratory disease.
  evidence:
  - reference: PMID:12496152
    reference_title: Role of Bordetella O antigen in respiratory tract infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Complement was not activated or depleted by wild-type bordetellae
      expressing O antigen, but both Deltawbm mutants activated complement and
      were highly sensitive to complement-mediated killing in vitro.
    explanation: >-
      Shows that O-antigen expression suppresses complement activation and
      protects Bordetella from complement-mediated killing.
  - reference: PMID:12496152
    reference_title: Role of Bordetella O antigen in respiratory tract infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The B. parapertussis Deltawbm mutant was severely defective in
      colonization of the tracheas and lungs of mice
    explanation: >-
      Demonstrates that the O-antigen assembly locus supports B. parapertussis
      respiratory colonization in mice.
- name: Pertactin-Mediated Resistance to Neutrophil Clearance
  role: modifier
  description: >-
    The Bordetella pertactin autotransporter helps classical Bordetella
    organisms resist neutrophil-dependent clearance, a conserved virulence
    function inferred for B. parapertussis from B. bronchiseptica experiments.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil mediated immunity
    modifier: DECREASED
    term:
      id: GO:0002446
      label: neutrophil mediated immunity
  downstream:
  - target: Whooping Cough-Like Illness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Resistance to neutrophil-mediated clearance favors airway persistence and
      downstream pertussis-like illness.
  evidence:
  - reference: PMID:20421378
    reference_title: >-
      Pertactin is required for Bordetella species to resist
      neutrophil-mediated clearance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Pertactin (PRN) is an autotransporter protein produced by all members of
      the Bordetella bronchiseptica cluster, which includes B. pertussis, B.
      parapertussis, and B. bronchiseptica.
    explanation: >-
      Identifies pertactin as a protein produced by the classical Bordetella
      cluster that contains B. parapertussis.
  - reference: PMID:20421378
    reference_title: >-
      Pertactin is required for Bordetella species to resist
      neutrophil-mediated clearance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      These results suggest that PRN plays a critical role in allowing
      Bordetella to resist neutrophil-mediated clearance.
    explanation: >-
      B. bronchiseptica mutant data establish the neutrophil-clearance function
      of pertactin across the Bordetella bronchiseptica cluster.
- name: Vaccine Escape and Acellular Vaccine Facilitation
  role: modifier
  description: >-
    Pertussis vaccination shows no significant clinical cross-protection
    against B. parapertussis, and acellular B. pertussis vaccination facilitated
    higher B. parapertussis lung burdens in a rodent coinfection model.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: response to host immune response
    term:
      id: GO:0052572
      label: response to host immune response
  downstream:
  - target: Whooping Cough-Like Illness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure of vaccine cross-protection leaves vaccinated hosts susceptible to
      B. parapertussis infection, and rodent data suggest acellular vaccination
      can further blunt the innate clearance response.
  evidence:
  - reference: PMID:38543887
    reference_title: >-
      Pertussis Vaccines Scarcely Provide Protection against Bordetella
      parapertussis Infection in Children-A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The meta-analysis, involving 46,533 participants, revealed no significant
      protective effect of pertussis vaccination against B. parapertussis
      infection (risk ratio: 1.10, 95% confidence interval: 0.83 to 1.44).
    explanation: >-
      A human meta-analysis supports the lack of measurable cross-protection
      against B. parapertussis.
  - reference: PMID:20200027
    reference_title: >-
      Acellular pertussis vaccination facilitates Bordetella parapertussis
      infection in a rodent model of bordetellosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that aP vaccination helped clear B. pertussis but resulted in an
      approximately 40-fold increase in B. parapertussis lung colony-forming
      units (CFUs).
    explanation: >-
      Demonstrates B. parapertussis expansion after acellular pertussis
      vaccination in a rodent respiratory coinfection model.
- name: Pertussis-Toxin-Mediated Coinfection Facilitation
  role: modifier
  description: >-
    This model-defined modifier captures mixed respiratory infection in which
    B. pertussis pertussis toxin enhances B. parapertussis infection; it is not
    required in every human B. parapertussis case.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: response to host immune response
    term:
      id: GO:0052572
      label: response to host immune response
  downstream:
  - target: Whooping Cough-Like Illness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Pertussis-toxin-mediated inhibition of innate immunity can create a
      permissive airway environment for B. parapertussis in coinfection.
  evidence:
  - reference: PMID:21707780
    reference_title: >-
      Enhancement of Bordetella parapertussis infection by Bordetella pertussis
      in mixed infection of the respiratory tract.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mixed infection with a PT-deficient B. pertussis strain did not enhance
      B. parapertussis infection.
    explanation: >-
      Shows that the B. pertussis-dependent increase in B. parapertussis burden
      requires pertussis toxin in the mouse mixed-infection model.
  - reference: PMID:21707780
    reference_title: >-
      Enhancement of Bordetella parapertussis infection by Bordetella pertussis
      in mixed infection of the respiratory tract.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that B. pertussis, through the action of PT, can enhance a
      B. parapertussis infection, possibly by an inhibitory effect on innate
      immunity.
    explanation: >-
      Interprets mixed-infection enhancement as pertussis-toxin-mediated innate
      immune inhibition.
- name: Whooping Cough-Like Illness
  role: consequence
  description: >-
    Airway colonization and evasion of complement and neutrophil clearance
    produce parapertussis, a whooping-cough-like illness that is usually milder
    than classic B. pertussis disease but can still require hospitalization or
    critical care.
  biological_scale: ORGANISM
  downstream:
  - target: Whooping cough
    causal_link_type: DIRECT
    description: >-
      Parapertussis presents clinically as a whooping-cough-like illness.
  - target: Paroxysmal cough
    causal_link_type: DIRECT
    description: >-
      Airway disease produces the paroxysmal coughing spasms characteristic of
      the illness.
  - target: Post-tussive vomiting
    causal_link_type: DIRECT
    description: >-
      Coughing paroxysms are frequently followed by post-tussive vomiting.
  - target: Apnea
    causal_link_type: DIRECT
    description: >-
      Coughing episodes can be accompanied by apnea, particularly in infants.
  - target: Cyanosis
    causal_link_type: DIRECT
    description: >-
      Coughing episodes can be accompanied by cyanosis.
  evidence:
  - reference: PMID:9542925
    reference_title: >-
      Bordetella parapertussis infection in children: epidemiology, clinical
      symptoms, and molecular characteristics of isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children affected by B. parapertussis infections showed a less severe
      clinical picture both in the duration of symptoms and in the percentage of
      patients affected, even when compared with vaccinated children with
      pertussis.
    explanation: >-
      Shows that B. parapertussis produced symptomatic pertussis-like illness
      in children while remaining clinically milder than B. pertussis.
  - reference: PMID:41314606
    reference_title: >-
      Clinical characteristics and outcomes of Bordetella parapertussis
      compared with Bordetella pertussis: a retrospective observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe outcomes, including hospitalization, were not uncommon after
      B. parapertussis infection.
    explanation: >-
      Establishes that microbiologically confirmed B. parapertussis infection
      can produce severe clinical outcomes.
phenotypes:
- name: Whooping cough
  description: >-
    Parapertussis presents as a pertussis-like whooping-cough illness.
  phenotype_term:
    preferred_term: Whooping cough
    term:
      id: HP:0031247
      label: Whooping cough
  evidence:
  - reference: PMID:39565788
    reference_title: >-
      High pertussis circulation among infants, children and adolescents in
      Abidjan, Côte d'Ivoire.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whooping cough due to Bordetella pertussis (BP) and/or B. parapertussis
      (BPP) is a highly contagious infection sometimes fatal for infants.
    explanation: >-
      Names B. parapertussis as a cause of whooping cough.
- name: Paroxysmal cough
  description: >-
    Parapertussis cough occurs in paroxysms (coughing spasms) in the majority
    of cases.
  phenotype_term:
    preferred_term: Paroxysmal cough
    term:
      id: HP:0033362
      label: Recurrent coughing spasms
  evidence:
  - reference: PMID:9542925
    reference_title: >-
      Bordetella parapertussis infection in children: epidemiology, clinical
      symptoms, and molecular characteristics of isolates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cough is accompanied by paroxysms in 76% of the cases and by
      posttussive vomiting in nearly 40%.
    explanation: >-
      Reports paroxysmal cough in 76% of pediatric B. parapertussis cases.
- name: Post-tussive vomiting
  description: >-
    Coughing paroxysms are frequently followed by vomiting.
  phenotype_term:

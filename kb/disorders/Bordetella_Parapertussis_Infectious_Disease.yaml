    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also, the mean durations of apnea (3 days) and cyanosis (1 day) were
      shorter in children with B. parapertussis
    explanation: >-
      Records cyanosis as an observed and measured symptom in children with

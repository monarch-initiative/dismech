        id: CHEBI:17015
        label: riboflavin
  evidence:
  - reference: PMID:31065540
    reference_title: "Congenital lactic acidosis, cerebral cysts and pulmonary hypertension in an infant with FOXRED1 related complex 1 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with biotin 20 mg (q12 hrs), levocarnitine 100 mg (q12 hrs), thiamine 200 mg (q12 hrs), riboflavin 100 mg (q6 hrs), coenzyme Q10 90 mg (q6 hrs), and alpha lipoic acid 25 mg (q12 hrs) did not improve blood lactic acid levels."
    explanation: >-
      A negative result: the vitamin and cofactor cocktail, riboflavin included, failed to
      lower lactate in the one FOXRED1 patient in whom it is reported. Graded REFUTE against
      the claim that this is an effective intervention. It is a single patient and a
      combination regimen, so it does not exclude a riboflavin effect in another patient or
      on another endpoint.

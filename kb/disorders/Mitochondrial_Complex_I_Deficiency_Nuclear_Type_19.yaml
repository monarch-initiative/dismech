inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic FOXRED1 variants. Both homozygous (the original consanguineous Iranian-Jewish
    pedigree) and compound heterozygous genotypes are reported; compound heterozygosity is
    the more common architecture in the later series, typically pairing the recurrent
    c.1054C>T (p.R352W) allele with a family-specific second variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20858599
    reference_title: "FOXRED1, encoding an FAD-dependent oxidoreductase complex-I-specific molecular chaperone, is mutated in infantile-onset mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A combined homozygosity mapping and bioinformatics approach in a consanguineous Iranian-Jewish pedigree led to the identification of a homozygous mutation in FOXRED1 in a child who presented with infantile-onset encephalomyopathy.
    explanation: Establishes recessive inheritance through homozygosity mapping in a consanguineous pedigree.
  - reference: PMID:33613441
    reference_title: "Clinical and Genetic Characteristics of Mitochondrial Encephalopathy Due to FOXRED1 Mutations: Two Chinese Case Reports and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing revealed compound heterozygous variants in both patients"
    explanation: Documents the compound heterozygous architecture that predominates in later-reported patients.
genetic:
- name: FOXRED1
  gene_term:
    preferred_term: FOXRED1
    term:
      id: hgnc:26927
      label: FOXRED1
  relationship_type: CAUSATIVE
  notes: >-
    Encodes an FAD-dependent oxidoreductase domain-containing protein that functions as a
    complex-I-specific assembly chaperone rather than as a structural subunit. The recurrent
    c.1054C>T (p.R352W) allele was identified in the original report and recurs in unrelated
    later families; c.612_615dupAGTG (p.A206SfsX15) is the second recurrent allele.
  evidence:
  - reference: PMID:20818383
    reference_title: "High-throughput, pooled sequencing identifies mutations in NUBPL and FOXRED1 in human complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including cDNA complementation to show that mutations in NUBPL and FOXRED1 can cause complex I deficiency"
    explanation: Independent confirmation, by cDNA complementation in patient cells, that FOXRED1 mutations cause complex I deficiency.
  - reference: PMID:33613441
    reference_title: "Clinical and Genetic Characteristics of Mitochondrial Encephalopathy Due to FOXRED1 Mutations: Two Chinese Case Reports and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven pathogenic variants in FOXRED1 have been reported, comprising six missense variants, two non-sense variants, two frameshift variants, and one splice variant"
    explanation: Establishes the size and composition of the allelic spectrum.
pathophysiology:
- name: FOXRED1 Assembly Chaperone Loss of Function
  description: >-
    Biallelic FOXRED1 variants reduce or abolish the function of an FAD-dependent
    oxidoreductase that acts specifically as a complex I assembly chaperone. The protein has
    no counterpart role in the other respiratory chain complexes, which is why the
    biochemical defect is isolated to complex I.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: complex I assembly chaperone activity
    term:
      id: GO:0044183
      label: protein folding chaperone
    modifier: DECREASED
  downstream:
  - target: Arrest and Breakdown of the Late Complex I Assembly Intermediate
    causal_link_type: DIRECT
    description: Loss of the chaperone removes the activity needed to complete the final maturation step.
    evidence:
    - reference: PMID:25678554
      reference_title: Characterization of mitochondrial FOXRED1 in the assembly of respiratory chain complex I.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we demonstrate that FOXRED1 is involved in mid-late stages of complex I assembly."
      explanation: Places the chaperone's action at the assembly step whose failure is the next node.
  evidence:
  - reference: PMID:20858599
    reference_title: "FOXRED1, encoding an FAD-dependent oxidoreductase complex-I-specific molecular chaperone, is mutated in infantile-onset mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This FAD-dependent oxidoreductase, which has never previously been associated with human disease, is now shown to be a complex I-specific molecular chaperone."
    explanation: Establishes FOXRED1's identity as a complex-I-specific chaperone, which is what this node claims is lost.
  - reference: PMID:25678554
    reference_title: Characterization of mitochondrial FOXRED1 in the assembly of respiratory chain complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutations in FOXRED1 leading to partial loss of function cause defects in complex I biogenesis"
    explanation: Supports grading the variant consequence as partial rather than complete loss of function.
- name: Arrest and Breakdown of the Late Complex I Assembly Intermediate
  description: >-
    Without FOXRED1 the mitochondrially encoded subunits are still translated and are still
    incorporated into a late-stage assembly intermediate of roughly 815 kDa. That
    intermediate then fails to mature into the holoenzyme and instead breaks down into a
    smaller complex of roughly 475 kDa. The same smaller species is detectable in patient
    cells, so the cellular model and the patient material agree on where the pathway stops.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25678554
      reference_title: Characterization of mitochondrial FOXRED1 in the assembly of respiratory chain complex I.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cells lacking FOXRED1 had ∼10% complex I levels, reduced complex I activity, and were unable to grow on galactose media."
      explanation: >-
        Quantifies the consequence of the assembly arrest: gene-edited FOXRED1-null cells
        retain about a tenth of normal complex I and cannot respire on galactose, which is
        the functional endpoint of this edge.
  evidence:
  - reference: PMID:25678554
    reference_title: Characterization of mitochondrial FOXRED1 in the assembly of respiratory chain complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the absence of FOXRED1, mtDNA-encoded complex I subunits are still translated and transiently assembled into a late stage ∼815 kDa intermediate; but instead of transitioning further to the mature complex I, the intermediate breaks down to an ∼475 kDa complex."
    explanation: >-
      The whole of this node in one sentence: translation and early incorporation are intact,
      the late intermediate forms, and it is the final maturation step that fails, after which
      what was built comes apart.
  - reference: PMID:41412221
    reference_title: Biallelic FOXRED1 mutations cause infantile mitochondrial encephalopathy with complex I disassembly and basal ganglia degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FOXRED1 mutations resulted in 50% reduction in complex I activity, dissasembly of complex I, mitochondrial depolarization, oxidative stress, and NAD+/NADH imbalance."
    explanation: >-
      Confirms disassembly in patient-derived cells. Quoted including the source's misspelling
      of "disassembly", since a snippet reproduces its source rather than correcting it.
- name: Isolated Complex I Deficiency
  description: >-
    Steady-state levels and catalytic activity of complex I fall while the other respiratory
    chain complexes are spared. Residual activity is partial rather than absent in patient
    cells carrying the recurrent hypomorphic alleles, and complete absence of assembled
    complex I on native gels has been reported in at least one more severely affected infant.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
  downstream:
  - target: Impaired Oxidative Phosphorylation and NAD Redox Imbalance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20858599
    reference_title: "FOXRED1, encoding an FAD-dependent oxidoreductase complex-I-specific molecular chaperone, is mutated in infantile-onset mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Silencing of FOXRED1 in human fibroblasts resulted in reduced complex I steady-state levels and activity, while lentiviral-mediated FOXRED1 transgene expression rescued complex I deficiency in the patient fibroblasts."
    explanation: >-
      Loss of function and rescue in the same system, which is the strongest available
      demonstration that the complex I deficiency is caused by the FOXRED1 defect rather
      than merely correlated with it.
  - reference: PMID:31065540
    reference_title: "Congenital lactic acidosis, cerebral cysts and pulmonary hypertension in an infant with FOXRED1 related complex 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficiency of complex I was demonstrated by the absence of complex I on Blue Native Gel Electrophoresis and by a significantly reduced complex I enzyme activity in the patient's fibroblasts."
    explanation: Direct biochemical confirmation in patient fibroblasts, at the severe end of the residual-activity range.
  - reference: PMID:41412221
    reference_title: Biallelic FOXRED1 mutations cause infantile mitochondrial encephalopathy with complex I disassembly and basal ganglia degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FOXRED1 mutations resulted in 50% reduction in complex I activity"
    explanation: Quantifies residual activity in patient peripheral blood mononuclear cells at the milder end of the range.
- name: Impaired Oxidative Phosphorylation and NAD Redox Imbalance
  description: >-
    With complex I unable to oxidise NADH at normal rates, electron entry into the
    respiratory chain is restricted. The measured consequences in patient cells are
    mitochondrial depolarization, raised reactive oxygen species and a disturbed NAD+/NADH
    ratio. The redox arm matters clinically as well as mechanistically, because it is the
    step niacin supplementation is aimed at.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
  downstream:
  - target: Lactate Accumulation
    causal_link_type: DIRECT
    description: A blocked NADH-oxidising step forces cytosolic reduction of pyruvate to lactate.
  - target: Neuronal Energy Failure and Grey Matter Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41412221
    reference_title: Biallelic FOXRED1 mutations cause infantile mitochondrial encephalopathy with complex I disassembly and basal ganglia degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mitochondrial depolarization, oxidative stress, and NAD+/NADH imbalance"
    explanation: Names the three measured cellular consequences that constitute this node.
- name: Lactate Accumulation
  description: >-
    Systemic and central nervous system lactate rise. Presentation ranges from
    hyperlactatemia noted on routine testing to congenital lactic acidosis severe enough to
    dominate the neonatal course.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:41412221
    reference_title: Biallelic FOXRED1 mutations cause infantile mitochondrial encephalopathy with complex I disassembly and basal ganglia degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients exhibited early-onset refractory seizures, basal ganglia lesions, hyperlacticemia, and developmental regression."
    explanation: Documents hyperlactatemia as part of the core presentation.
- name: Neuronal Energy Failure and Grey Matter Degeneration
  description: >-
    Neurons, with high and inflexible ATP demand, are the tissue in which the
    oxidative-phosphorylation deficit becomes structural damage. The reported imaging
    correlates span basal ganglia lesions, diffuse cerebral atrophy and polycystic
    encephalomalacia, and in one infant prenatal-onset periventricular cysts. The range
    across patients is wide and is recorded as such.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33613441
    reference_title: "Clinical and Genetic Characteristics of Mitochondrial Encephalopathy Due to FOXRED1 Mutations: Two Chinese Case Reports and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neuroimaging results ranged from normal to severe cerebral atrophy and polycystic encephalomalacia in early infancy."
    explanation: States the structural brain consequence and its range across reported patients.
  - reference: PMID:41412221
    reference_title: Biallelic FOXRED1 mutations cause infantile mitochondrial encephalopathy with complex I disassembly and basal ganglia degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients exhibited early-onset refractory seizures, basal ganglia lesions, hyperlacticemia, and developmental regression."
    explanation: Records basal ganglia involvement, the lesion distribution shared with Leigh syndrome spectrum disorders.

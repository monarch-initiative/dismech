- name: Dichloroacetate for Acute Lactic Acidosis
  description: >-
    Used in one reported infant, where blood lactate fell from 18.3 to 3.3 mmol/L after four
    doses and stayed in range for five weeks after discontinuation. A subsequent letter
    objected that dichloroacetate is neurotoxic in mitochondrial disease patients and
    questioned the rationale, so this is recorded as a reported intervention with a
    documented safety objection rather than as a recommendation.
  therapeutic_modality: SMALL_MOLECULE

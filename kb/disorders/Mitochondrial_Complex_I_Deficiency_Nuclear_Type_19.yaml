    explanation: >-
      Records the published safety objection to using dichloroacetate in this disorder.
      Graded REFUTE against the claim that this is an appropriate intervention, not against
      the observed lactate response. Marked REVIEW_SYNTHESIS because the letter restates
      toxicity findings from elsewhere rather than reporting its own.
- name: Mitochondrial Vitamin and Cofactor Cocktail
  description: >-
    Biotin, levocarnitine, thiamine, riboflavin, coenzyme Q10 and alpha-lipoic acid were
    given together to the infant with congenital lactic acidosis and did not lower blood
    lactate. Riboflavin is the component with the most FOXRED1-specific rationale, since
    FOXRED1 is itself an FAD-dependent flavoprotein and riboflavin is the FAD precursor, but
    that rationale was not borne out in the one patient in whom it was tried. Recorded here
    because a negative result in the only reported attempt is more informative than the
    untested mechanistic argument, and because the cocktail design means the failure cannot
    be attributed to riboflavin alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin

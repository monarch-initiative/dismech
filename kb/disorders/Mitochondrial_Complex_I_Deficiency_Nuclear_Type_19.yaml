name: Mitochondrial Complex I Deficiency Nuclear Type 19
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- MC1DN19
- FOXRED1 deficiency
- FOXRED1-related complex I deficiency
- FOXRED1-related mitochondrial encephalopathy
description: >-
  MC1DN19 is an autosomal recessive mitochondrial disorder caused by biallelic variants in
  FOXRED1, which encodes an FAD-dependent oxidoreductase that acts as a complex-I-specific
  molecular chaperone. FOXRED1 is not a structural subunit of complex I, so the lesion is a
  failure of assembly rather than a missing catalytic part.

  **The assembly failure has a specific and unusual shape.** In cells lacking FOXRED1 the
  mitochondrially encoded subunits are still translated and are still incorporated into a
  late-stage intermediate of roughly 815 kDa. What fails is the last step: instead of
  maturing into the holoenzyme, that intermediate falls apart into a smaller complex of
  roughly 475 kDa. So the defect is neither a failure to start building nor a failure to
  make subunits; it is a failure to finish, followed by disassembly of what was built. That
  distinction is what makes the residual-activity picture across patients so variable,
  because the amount of complex I that survives depends on how much of the intermediate
  escapes breakdown.

  **The most common allele produces partial, not complete, loss of function.** c.1054C>T
  (p.R352W) recurs across unrelated pedigrees and is the allele from the original 2010
  report. Overexpressing FOXRED1 carrying patient mutations rescues assembly in cells, which
  is the direct experimental argument that these alleles are hypomorphic rather than null.

  **The clinical spectrum is broad for a disorder with fewer than a dozen published
  patients**, running from infantile-onset encephalomyopathy and Leigh syndrome to epileptic
  encephalopathy with severe psychomotor retardation. Neuroimaging is correspondingly
  variable, from normal to severe cerebral atrophy and polycystic encephalomalacia in early
  infancy, and basal ganglia lesions are reported. This entry keeps that heterogeneity
  visible rather than flattening it into a single presentation.

  One reported association is curated here as contested rather than settled: severe
  pulmonary hypertension was attributed to the mitochondrial defect in a 2019 case report,
  and a subsequent letter argued the shunt lesions present in the same infant are a
  sufficient alternative explanation. See `discussions`.

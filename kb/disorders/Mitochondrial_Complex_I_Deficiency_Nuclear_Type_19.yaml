discussions:
- discussion_id: foxred1_pulmonary_hypertension_attribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the severe pulmonary hypertension reported in FOXRED1 deficiency caused by the
    mitochondrial defect, or by the intracardiac shunts present in the same infant?
  attaches_to:
  - phenotypes#Pulmonary arterial hypertension
  rationale: >-
    The only reported case attributed the pulmonary hypertension to the complex I defect. A
    published letter objected that echocardiography on the second day of life showed a patent
    ductus arteriosus and a patent foramen ovale, which could raise pulmonary artery pressure
    and later reverse the shunt direction, and noted that the follow-up echocardiogram
    reported the ductus but not the foramen ovale. With one patient and a confounded cardiac
    anatomy, neither attribution is established. The distinction matters because a
    mitochondrial cause would make pulmonary hypertension a surveillance target in this
    disorder and a shunt cause would not.
  notes: >-
    Resolving this needs pulmonary vascular assessment in further FOXRED1 patients without
    intracardiac shunts. No such series exists at the time of curation.
notes: >-
  Curated from the primary FOXRED1 literature together with an OpenScientist deep-research
  report. Three things a reader should know about how this entry was built.

  First, three evidence items are graded REFUTE. Two quote a published letter to the editor.
  They do not dispute the observations in the case report they answer; they dispute a causal
  attribution (pulmonary hypertension) and the appropriateness of an intervention
  (dichloroacetate). The third records that a vitamin and cofactor cocktail including
  riboflavin failed to lower lactate in the one FOXRED1 patient in whom it was tried.
  Riboflavin has the most FOXRED1-specific rationale of any candidate therapy, since FOXRED1
  is itself an FAD-dependent flavoprotein and riboflavin is the FAD precursor; the negative
  result is curated in preference to that untested rationale, with the caveat that a
  combination regimen cannot attribute the failure to riboflavin alone. All three are
  recorded so the entry does not present contested or unsupported claims as settled.

  On evidence-source grading: measurements made on patient-derived peripheral blood
  mononuclear cells (complex I activity, membrane potential, ROS, NAD+/NADH ratio) are
  graded IN_VITRO rather than HUMAN_CLINICAL. They are cell-based assays on human material,
  and the clinical observations from the same paper keep HUMAN_CLINICAL. The niacin evidence
  is split along the same line, because the source sentence carries an in vitro result and a
  clinical result in one breath.

  Hypotonia is curated with class-level rather than gene-level support, marked INDIRECT and
  BACKGROUND. The FOXRED1-specific reports do record it, but only inside per-patient
  comparison tables, whose cells arrive in the reference cache as run-together text that
  cannot be quoted as a sentence.

  Second, one snippet quotes the source's misspelling of "disassembly" rather than
  correcting it, which is the rule a snippet follows: it reproduces its source.

  Third, on the GeneReviews baseline: no FOXRED1-specific or MC1DN19-specific GeneReviews
  chapter exists. The nuclear gene-encoded Leigh syndrome spectrum overview (PMID:26425749)
  covers adjacent ground, but its cached record contains only the chapter's statement of
  purpose and no clinical characteristics, so it cannot serve as a phenotype baseline here
  and is deliberately not cited. The phenotype frequencies in this entry come from the 2021
  nine-patient literature review instead.

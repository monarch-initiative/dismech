discussions:
- discussion_id: controversy_spd_loss_of_function_vs_mutant_chain
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Failed Trimerization and ER Retention of Mutant Procollagen
  prompt: >-
    Do C-propeptide variants cause spondyloperipheral dysplasia by loss of
    function, or through a mutant chain that is synthesized and retained in the
    ER?
  rationale: >-
    The ClinGen curation states that the mechanism of pathogenicity is loss of
    function. The primary molecular report argues that the 3' location of the
    truncating variants lets the transcript escape nonsense-mediated decay, so a
    mutant chain is made and accumulates in the ER, and the Torrance-type cohort
    paper describes the C-propeptide subfamily as producing an altered chain
    rather than a null allele. No cited study measures mutant transcript or
    protein in patient cells, so neither position has been tested directly in
    spondyloperipheral dysplasia.
  evidence:
  - reference: CGGV:assertion_d4da6e1f-5aad-4541-a3ae-76ed4782a023-2023-09-28T040000.000Z
    reference_title: "COL2A1 / spondyloperipheral dysplasia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is known to be loss of function."
    explanation: ClinGen's stated mechanism.
  - reference: PMID:15643621
    reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that PLSD-T is caused by mutations in the C-propeptide domain of
      COL2A1, which lead to biosynthesis of an altered collagen chain (as opposed
      to a null allele).
    explanation: >-
      The opposing position, stated for Torrance type and extended in the same
      abstract to spondyloperipheral dysplasia as one subfamily.
- discussion_id: gap_spd_brachydactyly_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Premature Growth Plate Fusion in Short Tubular Bones
  prompt: >-
    Why do C-propeptide variants, unlike other COL2A1 variants, produce
    brachydactyly type E?
  rationale: >-
    The only proposed explanation is that the altered C-propeptide
    (chondrocalcin) promotes early calcification and fusion of the short tubular
    bone growth plates. It was put forward to explain the clinical pattern and
    has not been tested; its proponents say the mechanism remains to be explored.
  evidence:
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism leading to precocious fusion of phalangeal epiphyses remains
      to be explored.
    explanation: States that the mechanism is untested.

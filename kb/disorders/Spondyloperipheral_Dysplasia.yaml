genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  association: Heterozygous C-propeptide variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Every molecularly confirmed allele lies in the C-propeptide coding region.
    Most are nonsense or frameshift variants close to the 3' end of the gene; a
    missense change (Y1391C) and an in-frame deletion (p.Phe1486del) have also
    been reported in individuals with this phenotype, and both alleles also occur
    in platyspondylic skeletal dysplasia, Torrance type.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d4da6e1f-5aad-4541-a3ae-76ed4782a023-2023-09-28T040000.000Z
    evidence:
    - reference: CGGV:assertion_d4da6e1f-5aad-4541-a3ae-76ed4782a023-2023-09-28T040000.000Z
      reference_title: "COL2A1 / spondyloperipheral dysplasia (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "COL2A1 | HGNC:2200 | spondyloperipheral dysplasia | MONDO:0010078 | AD | Definitive"
      explanation: >-
        ClinGen Skeletal Disorders GCEP classification, made for this entry's own
        MONDO term after ClinGen split the COL2A1 disorders into separate
        curations.
  evidence:
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The consistency of clinical, radiographic, and molecular findings in these
      three unrelated individuals confirms SPD as a distinct nosologic entity.
    explanation: Three unrelated individuals with C-propeptide variants.
  - reference: PMID:23545312
    reference_title: "Identification of one novel mutation in the C-propeptide of COL2A1 in a Chinese family with spondyloperipheral dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified a novel truncating mutation (p.Lys1444AsnfsX27) in the
      C-propeptide of type II collagen in an affected Chinese individual with
      SPD.
    explanation: A further unrelated truncating allele.
  variants:
  - name: 5-bp duplication in exon 51 (frameshift)
    description: >-
      The first allele reported, in a sporadic patient; ClinGen notes that this
      proband could not be scored because of accession errors.
    evidence:
    - reference: PMID:8723097
      reference_title: "A specific collagen type II gene (COL2A1) mutation presenting as spondyloperipheral dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A frameshift as consequence of a 5 bp duplication in exon 51 leads to a stop codon."
      explanation: Describes the allele.
  - name: c.4339A>T (p.Lys1447Ter)
    description: Exon 54 nonsense variant in an affected mother and son.
    evidence:
    - reference: PMID:21356074
      reference_title: "Prenatal manifestation and management of a mother and child affected by spondyloperipheral dysplasia with a C-propeptide mutation in COL2A1: case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In patients 1 and 2 we identified a heterozygous nonsense mutation
        (c.4339 A > T) in exon 54, which resulted in a premature stop codon at
        amino acid 1447 (K1447X).
      explanation: Describes the allele in both affected family members.
  - name: p.Lys1444AsnfsX27
    description: Frameshift in the C-propeptide in a Chinese patient.
    evidence:
    - reference: PMID:23545312
      reference_title: "Identification of one novel mutation in the C-propeptide of COL2A1 in a Chinese family with spondyloperipheral dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified a novel truncating mutation (p.Lys1444AsnfsX27) in the
        C-propeptide of type II collagen
      explanation: Describes the allele.
  - name: p.Tyr1391Cys
    description: >-
      C-propeptide missense variant, previously reported in Torrance-type
      platyspondylic dysplasia, found in a patient first reported as Czech
      dysplasia and reassigned to spondyloperipheral dysplasia.
    evidence:
    - reference: PMID:17726487
      reference_title: "Czech dysplasia metatarsal type: another type II collagen disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our observation of the same Y1391C mutation in an additional unrelated
        patient with SPD further supports the evidence that PLSD-T and SPD

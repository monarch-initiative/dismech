pathophysiology:
- name: COL2A1 C-Propeptide Truncating Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous nonsense or frameshift variant in the exons encoding the
    C-propeptide of the pro-alpha1(II) chain, near the 3' end of COL2A1. The
    first reported allele was a 5-bp duplication in exon 51; later alleles
    include a nonsense change in the last exon. Two non-truncating C-propeptide
    alleles (a missense change and an in-frame deletion) have also been found in
    individuals with this phenotype.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: ABNORMAL
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:8723097
    reference_title: "A specific collagen type II gene (COL2A1) mutation presenting as spondyloperipheral dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation is the first to be located at the C-terminal outside the
      helical domain of COL2A1. A frameshift as consequence of a 5 bp
      duplication in exon 51 leads to a stop codon.
    explanation: First molecularly characterized case; a C-terminal frameshift.
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both individuals, heterozygosity for novel, distinct mutations in the
      C-propeptide coding region of COL2A1 were found.
    explanation: Two further unrelated individuals with heterozygous C-propeptide variants.
  downstream:
  - target: Failed Trimerization and ER Retention of Mutant Procollagen
    description: >-
      Because the premature stop lies close to the 3' end of the mRNA, the
      transcript is thought to escape nonsense-mediated decay and to be
      translated into a truncated chain that lacks residues needed for
      trimerization.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15316962
      reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although all three mutations (the one previously reported and the two
        novel ones) predict premature termination, their location close to the
        3'-end of the mRNA probably protects them from nonsense-mediated decay and
        allows for synthesis of mutant procollagen chains.
      explanation: >-
        Links the variant position to synthesis of a mutant chain rather than a
        null allele. The authors state this as probable; no transcript or protein
        measurement is reported in the abstract.
- name: Failed Trimerization and ER Retention of Mutant Procollagen
  biological_scale: CELLULAR
  description: >-
    The truncated pro-alpha1(II) chain lacks cysteine residues and other
    C-propeptide sequences required for chain association, so it cannot take part
    in procollagen triple-helix formation and accumulates in the endoplasmic
    reticulum of chondrocytes. Electron microscopy findings were described as
    consistent with this. The mechanism is disputed: the ClinGen curation records
    loss of function as the mechanism (see the discussion attached to this node).
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: protein trimerization
    term:
      id: GO:0070206
      label: protein trimerization
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, loss of crucial cysteine residues or other sequences essential for
      trimerization prevents these chains from associating and participating in
      procollagen helix formation, and thus leads to accumulation in the
      ER-consistent with EM findings.
    explanation: >-
      States the trimerization failure and ER accumulation, with electron
      microscopy as the supporting observation.
  downstream:
  - target: Abnormal Type II Collagen Fibrils and Cartilage Matrix
    description: >-
      Fewer normal type II collagen molecules reach the matrix, and retained
      mutant chains may be toxic to the chondrocyte.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15643621
      reference_title: "Dominant negative mutations in the C-propeptide of COL2A1 cause platyspondylic lethal skeletal dysplasia, torrance type, and define a novel subfamily within the type 2 collagenopathies."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The specific phenotype of C-propeptide mutations could result from a
        combination of diminished collagen fibril formation, toxic effects through
        the accumulation of unfolded collagen chains inside the chondrocytes, and
        alteration of a putative signaling function of the carboxy-propeptide of
        type 2 collagen.
      explanation: >-
        A proposed model for the whole spondyloperipheral/Torrance subfamily,
        written in a paper whose cohort is Torrance-type cases; it is stated as a
        possibility, not a measurement in spondyloperipheral dysplasia tissue.
- name: Abnormal Type II Collagen Fibrils and Cartilage Matrix
  biological_scale: TISSUE
  description: >-
    Cartilage from the first molecularly confirmed patient showed altered
    chondrocyte morphology, abnormal type II collagen fibril structure and
    altered matrix composition.

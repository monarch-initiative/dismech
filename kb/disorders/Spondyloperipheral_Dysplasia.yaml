  downstream:
  - target: Defective Endochondral Ossification of Spine and Long Bones
    description: >-
      The cartilage template of the vertebral bodies, epiphyses and long bones is
      structurally abnormal, the general route to skeletal disease in the type II
      collagenopathies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Premature Growth Plate Fusion in Short Tubular Bones
    description: >-
      Hypothesized: the altered C-propeptide (chondrocalcin) promotes precocious
      calcification of metacarpal and phalangeal growth plates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15316962
      reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        To explain the additional finding of brachydactyly that is not an usual
        feature of the type II collagenopathies, it was postulated that the nature
        of the mutation induced precocious calcification and premature fusion of
        metacarpal and phalangeal growth plates.
      explanation: >-
        Records the hypothesis linking the C-propeptide defect to early growth
        plate fusion; it is a postulate, not an observation.
- name: Defective Endochondral Ossification of Spine and Long Bones
  biological_scale: TISSUE
  description: >-
    Abnormal ossification of the vertebral bodies, pelvis, epiphyses and tubular
    bones. In infancy this shows as ovoid or pear-shaped vertebral bodies, delayed
    ossification of the pubic bones and knee epiphyses, and short broad tubular
    bones with splayed metaphyses; by adulthood the vertebrae are flat.
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21356074
    reference_title: "Prenatal manifestation and management of a mother and child affected by spondyloperipheral dysplasia with a C-propeptide mutation in COL2A1: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is retarded ossification of the skeleton with absence of the
      ossification centres of pubic bones and distal femoral and proximal tibial
      epiphyses.
    explanation: >-
      Radiographic description of delayed ossification in an infant carrying a
      C-propeptide nonsense variant.
  downstream:
  - target: Platyspondyly
  - target: Ovoid vertebral bodies
  - target: Abnormality of the vertebral endplates
  - target: Delayed pubic bone ossification
  - target: Metaphyseal widening
  - target: Disproportionate short stature
  - target: Hip dysplasia
  - target: Flattened femoral head
  - target: Hypoplasia of the ulna
- name: Premature Growth Plate Fusion in Short Tubular Bones
  biological_scale: TISSUE
  description: >-
    Proposed cause of the brachydactyly type E-like changes that appear during
    childhood: early calcification and fusion of the growth plates of the
    metacarpals, metatarsals and phalanges. The C-propeptide of type II collagen
    had earlier been found to promote calcification. No study has tested this in
    patient tissue or a model, and the authors who proposed it say the mechanism
    remains to be explored.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The C-propeptide of collagen II had previously been found to promote
      calcification ("chondrocalcin").
    explanation: The prior finding on which the hypothesis rests.
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism leading to precocious fusion of phalangeal epiphyses remains
      to be explored.
    explanation: The authors' own statement that the mechanism is untested.
  downstream:
  - target: Type E brachydactyly
  - target: Short metatarsal
  - target: Short metacarpal

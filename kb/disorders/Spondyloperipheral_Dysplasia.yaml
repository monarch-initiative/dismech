name: Spondyloperipheral Dysplasia
creation_date: "2026-11-06T12:00:00Z"
category: Mendelian
description: >-
  Spondyloperipheral dysplasia (OMIM 271700) is a rare autosomal dominant type II
  collagenopathy caused by heterozygous COL2A1 variants that, in every
  molecularly confirmed family, lie in the C-propeptide coding region near the 3'
  end of the gene, most often as nonsense or frameshift changes. It combines the
  axial and epiphyseal features of a type II collagen disorder (platyspondyly
  with vertebral end-plate irregularity, hip dysplasia, disproportionate short
  stature) with brachydactyly type E-like shortening of the metacarpals and
  metatarsals, which typically emerges during childhood in a patient who looked
  like a typical type II collagenopathy in infancy. Short ulnae, clubfeet,
  midface hypoplasia, myopia, hearing loss and, in one report, intellectual
  disability have been described, with wide variability between and within
  families. Spondyloperipheral dysplasia forms a phenotypic continuum with the
  usually lethal platyspondylic skeletal dysplasia, Torrance type, which is also
  caused by C-propeptide variants. The literature is a handful of molecularly
  confirmed families, so frequencies are not well established.
disease_term:
  preferred_term: spondyloperipheral dysplasia
  term:
    id: MONDO:0010078
    label: spondyloperipheral dysplasia
parents:
- type 2 collagenopathy
- COL2A1-related spondyloepiphyseal dysplasia
synonyms:
- spondyloperipheral dysplasia with short ulna
- spondyloperipheral dysplasia-short ulna syndrome
- SPD
notes: >-
  Evidence base. The molecular literature is six case reports or small families
  (PMID:8723097, PMID:15316962, PMID:17726487, PMID:21356074, PMID:22495950,
  PMID:23545312), plus two patients counted inside a 93-patient COL2A1 cohort
  (PMID:25604898) whose individual features are not reported in its abstract.
  Phenotype frequencies are taken only from the Orphanet annotation table, and
  only where that table does not contradict the case literature. Orphanet grades
  platyspondyly as occasional although the primary reports name it as a defining
  feature (PMID:8588574, PMID:15316962), so no frequency is recorded for
  platyspondyly. The Orphanet table also lists cleft palate, cataract and retinal
  detachment, which none of the cached spondyloperipheral dysplasia case reports
  describe; they are not curated here.


  GeneReviews has no chapter for this disease. The Type II Collagen Disorders
  Overview (PMID:31021589) is an Overview-format chapter whose cached abstract is
  a statement of purpose, so it is tagged but is not the phenotype baseline. The
  phenotype baseline is the Orphanet definition (ORPHA:1856) together with the
  case reports.


  The ocular and hearing phenotypes are left without an incoming causal edge.
  Type II collagen is a structural component of the vitreous and of otic capsule
  cartilage, but no cited source examines either tissue in a person with a
  C-propeptide variant, so an edge from the cartilage-matrix node would be an
  extrapolation from other COL2A1 disorders.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous COL2A1 variants cause the disease; transmission from an affected
    mother to her affected son with the same heterozygous variant has been
    documented, and sporadic cases occur.
  evidence:
  - reference: PMID:23545312
    reference_title: "Identification of one novel mutation in the C-propeptide of COL2A1 in a Chinese family with spondyloperipheral dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondyloperipheral dysplasia (SPD; OMIM 271700) is an autosomal dominant
      connective tissue disorder
    explanation: States autosomal dominant inheritance for the disease.
  - reference: PMID:21356074
    reference_title: "Prenatal manifestation and management of a mother and child affected by spondyloperipheral dysplasia with a C-propeptide mutation in COL2A1: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of both mother and child revealed a hitherto undescribed
      heterozygous nonsense mutation in the C-propeptide coding region of COL2A1
    explanation: >-
      Documents vertical transmission of one heterozygous variant from an affected
      mother to her affected child.
- name: Somatic mosaicism in a mildly affected parent
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    One mother with a mild spondyloperipheral dysplasia phenotype was somatic
    mosaic for a C-propeptide in-frame deletion that, in her non-mosaic fetus,
    produced lethal platyspondylic skeletal dysplasia, Torrance type. This is a
    single observation, not a recognized mosaic arm of the disease.
  evidence:
  - reference: PMID:22495950
    reference_title: "Spondyloperipheral dysplasia as the mosaic form of platyspondylic lethal skeletal dyplasia torrance type in mother and fetus with the same COL2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype in the mother was compatible with mild spondyloperipheral
      dysplasia (SPPD). Molecular studies documented somatic mosaicism for the
      same mutation in the mother.
    explanation: >-
      Reports somatic mosaicism for the causal variant in an individual with a
      mild spondyloperipheral dysplasia phenotype.

- phase: Infancy
  notes: >-
    In infancy the presentation is that of a type II collagenopathy (short
    stature, platyspondyly or ovoid vertebrae, delayed epiphyseal and pubic
    ossification) without brachydactyly, so the specific diagnosis is usually not
    yet possible.
  evidence:
  - reference: PMID:15316962
    reference_title: "Spondyloperipheral dysplasia is caused by truncating mutations in the C-propeptide of COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have ascertained two further individuals with clinical and radiological
      findings of a type II collagenopathy in infancy who developed brachydactyly
      type E like changes of fingers and toes in childhood.
    explanation: Describes the infant presentation preceding brachydactyly.
- phase: Childhood
  notes: Brachydactyly type E-like changes of the fingers and toes appear.

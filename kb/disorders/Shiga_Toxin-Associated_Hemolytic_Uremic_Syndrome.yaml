name: Shiga Toxin-Associated Hemolytic Uremic Syndrome
creation_date: "2026-10-28T12:00:00Z"
category: Infectious Disease
parents:
- Thrombotic Microangiopathy
- Post-Infectious Disorder
- Renal Disease
disease_term:
  preferred_term: Shiga toxin-associated hemolytic uremic syndrome
  term:
    id: MONDO:0019536
    label: Shiga toxin-associated hemolytic uremic syndrome
synonyms:
- STEC-HUS
- typical hemolytic uremic syndrome
- diarrhea-associated hemolytic uremic syndrome
- D+ hemolytic uremic syndrome
description: >-
  Shiga toxin-associated hemolytic uremic syndrome (STEC-HUS) is a thrombotic
  microangiopathy defined by the triad of microangiopathic hemolytic anemia,
  thrombocytopenia and acute kidney injury, arising typically about a week after
  an episode of diarrhea - often bloody - caused by Shiga toxin-producing
  Escherichia coli (classically serotype O157:H7, with non-O157 serogroups such
  as O26, O80, O104 and O111 also responsible) or by Shigella dysenteriae
  type 1. It is the leading cause of acute kidney injury in young children. The
  disease is acquired and toxin-mediated rather than inherited: the pathogenic
  determinant is the bacterial Shiga toxin, whose B pentamer binds host
  globotriaosylceramide (Gb3) and whose A subunit depurinates 28S rRNA and halts
  protein synthesis in Gb3-rich cells, chiefly the renal glomerular
  microvascular endothelium and podocytes. Toxin-injured endothelium loses its
  thromboresistance, activates the alternative complement pathway locally, and
  secretes ultra-large von Willebrand factor multimers, producing the
  platelet-fibrin thrombi that occlude glomerular capillaries and shear
  erythrocytes. Treatment is supportive; antibiotics given during the colitis
  prodrome are associated with increased progression to HUS. Most children
  recover kidney function, but a substantial minority carry renal sequelae years
  later. STEC-HUS must be distinguished from complement-mediated atypical HUS
  and from thrombotic thrombocytopenic purpura, which are managed differently.
infectious_agent:
- name: Shiga toxin-producing Escherichia coli
  infectious_agent_term:
    preferred_term: Shiga toxin-producing Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  description: >-
    Shiga toxin-producing (equivalently verotoxigenic) Escherichia coli are
    Gram-negative Enterobacteriaceae that acquire the stx1 and/or stx2 genes on
    lambdoid prophages. Enterohaemorrhagic E. coli are the subset that also
    carry the locus of enterocyte effacement and form attaching-and-effacing
    lesions on the intestinal mucosa. O157:H7 is the serotype most often
    responsible worldwide, but the agent is defined by toxin genotype rather
    than serogroup: the 2011 German outbreak strain was an enteroaggregative
    O104:H4 that had acquired stx2 by horizontal transfer.
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Stx-producing E. coli O157:H7 has become recognized as the leading cause of HUS worldwide."
    explanation: Identifies the organism, and O157:H7 as its predominant serotype, as the agent of this disease.
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "had acquired the stx2 gene and the ability to produce extended-spectrum beta-lactamase via horizontal gene transfer"
    explanation: >-
      Records that the 2011 outbreak strain gained stx2 by horizontal transfer,
      which is why the agent is defined by toxin genotype rather than by
      serogroup. The quoted sentence says only "the outbreak strain"; the review
      identifies it as O104:H4 two sentences earlier.
  has_subtypes:
  - name: Escherichia coli O157:H7
    classification: serotype
    description: >-
      The sorbitol-non-fermenting serotype historically responsible for most
      STEC-HUS in North America and the United Kingdom, and the serogroup for
      which age-specific progression rates are best quantified.
    subtype_term:
      preferred_term: Escherichia coli O157:H7
      term:
        id: NCBITaxon:83334
        label: Escherichia coli O157:H7
    evidence:
    - reference: PMID:32323005
      reference_title: "Hemolytic uremic syndrome caused by Shiga toxin-producing Escherichia coli in children: incidence, risk factors, and clinical outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven different serogroups were detected, O157 being the most common"
      explanation: A nationwide paediatric series establishes O157 as the commonest serogroup among STEC-HUS isolates.
- name: Shigella dysenteriae type 1
  infectious_agent_term:
    preferred_term: Shigella dysenteriae serotype 1
    term:
      id: NCBITaxon:622
      label: Shigella dysenteriae
  description: >-
    Shigella dysenteriae serotype 1 carries chromosomally encoded Shiga toxin
    and is the original source of the toxin's name. It causes the same
    toxin-mediated syndrome, classically in settings of epidemic bacillary
    dysentery, and is the reason MONDO scopes this concept to Shiga toxin
    rather than to E. coli alone. The CURIE is the species, which is broader
    than the agent - only serotype 1 produces the toxin - so the serotype is
    carried in preferred_term rather than asserted through the binding.
  evidence:
  - reference: PMID:25530917
    reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Stx is found in Shigella dysenteriae 1 and in some serogroups of Escherichia coli"
    explanation: Establishes S. dysenteriae 1 alongside STEC as a source of the toxin that defines this entity.
transmission:
- name: Foodborne transmission from ruminant-derived food and produce
  description: >-
    Cattle and other ruminants carry STEC asymptomatically, so the dominant
    route is ingestion of contaminated food of bovine origin - undercooked
    ground beef, unpasteurised milk - or produce and water contaminated from
    that reservoir. The infectious dose is very low.
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The principal route of infection is consumption of contaminated food and drinking water, although infection may also occur via direct contact with animals, person-to-person contact, and environmental exposure."
    explanation: Names food and water as the principal vehicle, with animal contact and person-to-person spread as secondary routes.
- name: Direct contact with animals and person-to-person spread
  description: >-
    Direct contact with carrier ruminants - farm and petting-zoo exposure - and
    faecal-oral person-to-person spread in households and childcare settings
    also transmit STEC, which is why case exclusion from food handling and
    childcare is part of outbreak control.
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "infection may also occur via direct contact with animals, person-to-person contact, and environmental exposure"
    explanation: Records animal contact and person-to-person spread as transmission routes for the agent.
agent_life_cycle:
  description: >-
    STEC has no non-enteric life-cycle phase and no arthropod vector. Ruminants,
    principally cattle, are the natural reservoir and carry the organism in the
    gut without disease; humans are an incidental host in whom the toxin
    produces systemic disease. There is no human-to-ruminant cycle, so humans
    are epidemiologically a dead-end host.
  hosts:
  - preferred_term: Homo sapiens
    role: Incidental host in which Shiga toxin causes thrombotic microangiopathy
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Bos taurus
    role: Principal asymptomatic reservoir host carrying STEC in the gut
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  life_cycle_stages:
  - name: Carriage in the ruminant reservoir
    description: >-
      Cattle and other ruminants harbour STEC in the intestine, shedding it into
      the environment and the food chain.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "infection may also occur via direct contact with animals"
      explanation: >-
        Supports animals as a source of human infection. That the carriage is
        asymptomatic comes from the deep-research report rather than from this
        quote, and is stated in the stage description without its own citation.
  - name: Human colonic colonisation and toxin production
    description: >-
      Ingested STEC colonises the colon, forms attaching-and-effacing lesions
      and releases Shiga toxin into the gut lumen, from which it reaches the
      circulation.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "STEC release Stx in the gastrointestinal tract, after which the toxin translocates across the intestinal epithelium into the systemic circulation."
      explanation: Describes the enteric production and systemic translocation that make up the human phase.
pathophysiology:
- name: Colonic Colonisation and Attaching-and-Effacing Lesion Formation
  description: >
    Ingested STEC colonises the colon. Enterohaemorrhagic strains carry the locus
    of enterocyte effacement, whose intimin adhesin and type III secretion system
    produce attaching-and-effacing lesions that bring the organism into intimate
    contact with the epithelium. This is the site at which toxin is delivered to
    the host, and the lesion underlies the haemorrhagic colitis of the prodrome.
  biological_scale: TISSUE
  downstream:
  - target: Bloody diarrhea
    causal_link_type: DIRECT
    description: >-
      Invasion of the colonic mucosa at the attaching-and-effacing lesion
      produces the haemorrhagic colitis that presents as bloody diarrhoea.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "STEC causes a spectrum of diseases, from uncomplicated infection to hemorrhagic colitis and HUS."
      explanation: Places haemorrhagic colitis in the disease spectrum produced by colonic STEC infection.
  - target: Shiga Toxin Translocation Across the Intestinal Epithelium
    causal_link_type: DIRECT
    description: >-
      Colonic colonisation is what places toxin-producing bacteria at the
      epithelial surface, so that released toxin has access to the barrier it
      must cross.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "STEC release Stx in the gastrointestinal tract, after which the toxin translocates across the intestinal epithelium into the systemic circulation."
      explanation: States the sequence from enteric toxin release to translocation across the epithelium.
  cell_types:
  - preferred_term: colon epithelial cell
    term:
      id: CL:0011108
      label: colon epithelial cell
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Enterohemorrhagic E. coli (EHEC) are a sub-group of STEC that have the ability to form attaching and effacing lesions (A/E lesions) that facilitate intimate adhesion to the intestinal mucosa."
    explanation: Defines the attaching-and-effacing lesion and its role in intimate mucosal adhesion.
- name: Shiga Toxin Translocation Across the Intestinal Epithelium
  description: >
    Toxin released in the gut lumen crosses the intestinal epithelium into the
    systemic circulation. Toxin acting on the epithelium itself also triggers a
    ribotoxic stress response there, inducing chemokines and apoptosis. The
    identity of the systemic carrier of the toxin in blood remains unsettled, so
    the delivery step is the least well established link in this chain.
  biological_scale: TISSUE
  downstream:
  - target: Shiga Toxin Binding to Globotriaosylceramide on Gb3-Rich Cells
    causal_link_type: DIRECT
    description: >-
      Translocation into the circulation is what gives the toxin access to the
      glomerular endothelium and podocytes that carry its receptor.
    evidence:
    - reference: PMID:25530917
      reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The function of the B pentamer is to bind to the cellular receptor, globotriaosylceramide, Gb3, found primarily on endothelial cells."
      explanation: Establishes that circulating toxin acts by binding Gb3 on endothelium, the step this edge leads into.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: apoptotic process in intestinal epithelium
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:12595468
    reference_title: Shiga toxin 1 triggers a ribotoxic stress response leading to p38 and JNK activation and induction of apoptosis in intestinal epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Shiga toxins (Stxs) may access the host systemic circulation by absorption across the intestinal epithelium."
    explanation: States the translocation route this node represents, in the paper that characterised the epithelial response to the toxin.
- name: Shiga Toxin Binding to Globotriaosylceramide on Gb3-Rich Cells
  description: >
    The toxin is an AB5 holotoxin: a pentamer of B subunits binds the neutral
    glycosphingolipid globotriaosylceramide (Gb3/CD77) on the target cell
    surface. Gb3 density differs markedly between vascular beds, and endothelial
    sensitivity to the toxin tracks that density, which is what targets the
    toxin to the glomerular endothelium and sets the organ tropism of the
    disease. The podocyte is bound here on the strength of PMID:37863058, whose
    human biopsy arm and title put the podocyte among the toxin's targets. Do
    not read it off that paper's mouse alone: Gb3 was engineered into podocytes
    there, so the model shows what podocyte-restricted receptor does, not that
    human podocytes carry it.
  biological_scale: MOLECULAR
  downstream:
  - target: Retrograde Trafficking to the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Receptor binding is the committed step for internalisation: the bound
      holotoxin is endocytosed and routed retrogradely to reach the cytosol.
    evidence:
    - reference: PMID:25530917
      reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The Stxs traffic in a retrograde manner within the cell, such that the A subunit of the toxin reaches the cytosol only after the toxin moves from the endosome to the Golgi and then to the endoplasmic reticulum."
      explanation: States that the bound toxin reaches the cytosol by retrograde trafficking, which is the step this edge leads into.
  cell_types:
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: receptor-mediated endocytosis of Shiga toxin
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:25530917
    reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Stxs consist of two major subunits, an A subunit that joins noncovalently to a pentamer of five identical B subunits."
    explanation: Establishes the AB5 architecture whose B pentamer performs the receptor binding this node represents.
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The presence of Gb3 targets Stx to the glomerular endothelium, where it causes major vascular injury. Endothelial cells from different vascular beds display varying degrees of sensitivity to Stx due, in large part, to the level of Gb3 expression."
    explanation: Ties receptor density to glomerular tropism and to the differing sensitivity of vascular beds.
- name: Retrograde Trafficking to the Endoplasmic Reticulum
  description: >
    The internalised holotoxin travels from endosome to Golgi to endoplasmic
    reticulum; the A subunit is then cleaved and reduced, and the A1 fragment
    enters the cytosol. Curated separately from the enzymatic lesion because
    transport and catalysis are distinct molecular events: a catalytically dead
    toxin still traffics, which is what makes the mutant experiment downstream
    informative.
  biological_scale: MOLECULAR
  downstream:
  - target: 28S rRNA Depurination and Translational Arrest
    causal_link_type: DIRECT
    description: >-
      Reaching the cytosol is the precondition for the enzymatic lesion: the A1
      fragment can only act on the ribosome once retrograde transport has
      delivered it there.
    evidence:
    - reference: PMID:25530917
      reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the A subunit of the toxin reaches the cytosol only after the toxin moves from the endosome to the Golgi and then to the endoplasmic reticulum"
      explanation: States that cytosolic access depends on completing the retrograde route, which is the dependency this edge asserts.
  biological_processes:
  - preferred_term: retrograde transport, endosome to Golgi
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
  cell_types:
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  evidence:
  - reference: PMID:25530917
    reference_title: "Shiga Toxin (Stx) Classification, Structure, and Function."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Stxs traffic in a retrograde manner within the cell, such that the A subunit of the toxin reaches the cytosol only after the toxin moves from the endosome to the Golgi and then to the endoplasmic reticulum."
    explanation: Gives the retrograde route from endosome through Golgi to endoplasmic reticulum that this node represents.
- name: 28S rRNA Depurination and Translational Arrest
  description: >
    In the cytosol the A1 fragment acts as an RNA N-glycosidase, removing a
    single adenine from the conserved sarcin-ricin loop of 28S rRNA in the 60S
    subunit and halting translation. This is the toxin's defining enzymatic
    lesion, and its enzymatic activity is required for the downstream stress
    signalling.
  biological_scale: MOLECULAR
  downstream:
  - target: Ribotoxic Stress Response and Target Cell Apoptosis
    causal_link_type: DIRECT
    description: >-
      Ribosomal damage is what activates the stress-activated kinases: a
      catalytically dead toxin mutant activates neither p38 nor JNK, which is
      what makes this edge causal rather than merely coincident.
    evidence:
    - reference: PMID:12595468
      reference_title: Shiga toxin 1 triggers a ribotoxic stress response leading to p38 and JNK activation and induction of apoptosis in intestinal epithelial cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Stx1 enzymatic activity was required for kinase activation; a catalytically defective mutant toxin did not activate either."
      explanation: A catalytically defective toxin fails to activate the kinases, establishing the ribosomal lesion as the cause of the stress response.
  - target: Endothelial Activation and Loss of Thromboresistance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Toxin reaching the endothelial cytosol also reprograms endothelial gene
      expression, through NF-kappaB. The link is indirect because the activation
      phenotype arises at sublethal toxin doses, where it is not accounted for by
      translational arrest alone.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Among the newer concepts are Stx-mediated gene regulation in the absence of protein synthesis inhibition"
      explanation: Records endothelial gene regulation occurring without protein-synthesis inhibition, which is why this edge is marked indirect.
  biological_processes:
  - preferred_term: inhibition of translation by 28S rRNA depurination
    term:
      id: GO:0017148
      label: negative regulation of translation
    modifier: INCREASED
  molecular_functions:
  - preferred_term: Shiga toxin A1 fragment rRNA N-glycosidase activity
    term:
      id: GO:0030598
      label: rRNA N-glycosylase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:12595468
    reference_title: Shiga toxin 1 triggers a ribotoxic stress response leading to p38 and JNK activation and induction of apoptosis in intestinal epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The A subunit inactivates ribosomes by cleaving a specific adenine from the 28S rRNA."
    explanation: States the single-adenine depurination of 28S rRNA that is the enzymatic lesion of this node.
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "the Stx A subunit specifically removes an adenine residue within the highly conserved alpha-sarcin/ricin loop on eukaryotic 28S rRNA"
    explanation: Independently records the site of depurination within the conserved rRNA loop.
- name: Ribotoxic Stress Response and Target Cell Apoptosis
  description: >
    Damage to the ribosome activates the stress-activated protein kinases p38 and
    JNK, inducing primary response genes, C-X-C chemokines including
    interleukin-8, and caspase-dependent apoptosis. This is the arm by which
    toxin kills target cells and recruits inflammation, as distinct from the
    sublethal gene-reprogramming arm that makes endothelium thrombogenic.
  biological_scale: CELLULAR
  downstream:
  - target: Glomerular Thrombotic Microangiopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Apoptotic loss and inflammatory activation of glomerular cells contribute
      to the microangiopathic lesion. The link is indirect: the cited experiments
      establish the apoptotic response in epithelial and endothelial cells, not
      that apoptosis alone produces the glomerular lesion.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  evidence:
  - reference: PMID:12595468
    reference_title: Shiga toxin 1 triggers a ribotoxic stress response leading to p38 and JNK activation and induction of apoptosis in intestinal epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stx1 treatment of HCT-8 cells resulted in cell death that was associated with caspase 3 cleavage and internucleosomal DNA fragmentation; this cytotoxicity also required Stx1 enzymatic activity."
    explanation: Documents caspase-dependent apoptosis downstream of the ribosomal lesion, dependent on toxin enzymatic activity.
- name: Endothelial Activation and Loss of Thromboresistance
  description: >
    At sublethal doses the toxin reprograms endothelial gene expression rather
    than killing the cell. NF-kappaB activation induces adhesion molecules and
    chemokines, leukocytes adhere, and the cell loses its normal thromboresistant
    phenotype and becomes thrombogenic - the event generally taken to trigger the
    microangiopathy.
  biological_scale: CELLULAR
  downstream:
  - target: Alternative Complement Pathway Activation on Injured Endothelium
    causal_link_type: DIRECT
    description: >-
      Complement activation in response to the toxin acts at the activated
      endothelial surface, favouring platelet thrombus formation there.
    evidence:
    - reference: PMID:20424866
      reference_title: "Shiga toxin-associated hemolytic uremic syndrome: pathophysiology of endothelial dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Evidence is emerging that complement activation in response to Stxs favors platelet thrombus formation on endothelial cells"
      explanation: Places toxin-induced complement activation at the endothelial surface, upstream of platelet thrombus formation.
  - target: Ultra-Large von Willebrand Factor Secretion and Platelet Capture
    causal_link_type: DIRECT
    description: >-
      The same activated endothelium rapidly secretes ultra-large von Willebrand
      factor multimers onto its surface, to which platelets adhere.
    evidence:
    - reference: PMID:16131569
      reference_title: Hemolytic uremic syndrome-associated Shiga toxins promote endothelial-cell secretion and impair ADAMTS13 cleavage of unusually large von Willebrand factor multimers.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Stx-1 or Stx-2 (1-10 nM) stimulated the rapid secretion of unusually large (UL) VWF multimeric strings from human umbilical vein endothelial cells (HUVECs) or human glomerular microvascular endothelial cells (GMVECs)."
      explanation: Shows toxin-stimulated endothelial cells secreting ultra-large VWF multimers, the step this edge leads into.
  cell_types:
  - preferred_term: glomerular endothelial cell
    term:
      id: CL:0002188
      label: glomerular endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:20424866
    reference_title: "Shiga toxin-associated hemolytic uremic syndrome: pathophysiology of endothelial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Activated endothelial cells in response to Stxs lose the normal thromboresistance phenotype and become thrombogenic, initiating microvascular thrombus formation."
    explanation: States the loss of thromboresistance and the shift to a thrombogenic phenotype that define this node.
  - reference: PMID:20424866
    reference_title: "Shiga toxin-associated hemolytic uremic syndrome: pathophysiology of endothelial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "trigger a cascade of signaling events, involving NF-κB activation, that induce expression of genes encoding for adhesion molecules and chemokines, and culminate in the adhesion of leukocytes to endothelial cells"
    explanation: Gives the NF-kappaB-dependent adhesion-molecule and chemokine programme that constitutes endothelial activation here.
- name: Alternative Complement Pathway Activation on Injured Endothelium
  conforms_to: "complement_dysregulation#Unrestrained Alternative Pathway Amplification"
  description: >
    Shiga toxin activates the alternative complement pathway locally on the
    glomerular endothelial surface. There is no inherited regulator lesion here,
    which is what distinguishes this disease from atypical HUS; instead the
    toxin reduces factor H binding at the endothelial surface, so local
    regulation fails where the toxin has acted. In a mouse model expressing the
    toxin receptor only in podocytes, toxin challenge reduced podocyte VEGF-A,
    stripped the glomerular endothelial glycocalyx, lowered inhibitory factor H
    binding and activated complement locally - and early C5 inhibition rescued
    the phenotype.
  biological_scale: CELLULAR
  downstream:
  - target: Glomerular Thrombotic Microangiopathy
    causal_link_type: DIRECT
    description: >-
      Local complement activation on the endothelial surface amplifies injury and
      platelet thrombus formation, producing the glomerular lesion.

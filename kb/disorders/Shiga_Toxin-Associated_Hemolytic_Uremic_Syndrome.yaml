environmental:
- name: Antibiotic administration during STEC colitis
  description: >-
    Giving antibiotics during the diarrhoeal prodrome is associated with
    progression to HUS, which is why antibiotics are not recommended in
    suspected or confirmed STEC infection. The association is significant in
    low-risk-of-bias studies but not in the pooled set as a whole, and the
    proposed mechanism - induction of the bacterial SOS response and
    phage-mediated toxin release - is not established by these clinical data.
  exposure_term:
    preferred_term: antibacterial drug given during STEC colitis
    term:
      id: ECTO:9001757
      label: exposure to antibacterial drug
  influences_mechanisms:
  - target: Shiga Toxin Translocation Across the Intestinal Epithelium
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Antibiotic exposure during colitis is thought to increase the toxin burden
      reaching the circulation. The link is indirect: the clinical studies
      measure progression to HUS, not toxin flux across the epithelium.
    evidence:
    - reference: PMID:10874060
      reference_title: The risk of the hemolytic-uremic syndrome after antibiotic treatment of Escherichia coli O157:H7 infections.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Antibiotic treatment of children with E. coli O157:H7 infection increases the risk of the hemolytic-uremic syndrome."
      explanation: >-
        A prospective cohort finds antibiotic treatment during infection raises
        the risk of the syndrome. Indirect evidence for this edge because the
        outcome measured is HUS, not toxin translocation.
  evidence:
  - reference: PMID:10874060
    reference_title: The risk of the hemolytic-uremic syndrome after antibiotic treatment of Escherichia coli O157:H7 infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "antibiotic administration remained a risk factor for the development of the hemolytic uremic syndrome (relative risk, 17.3; 95 percent confidence interval, 2.2 to 137)"
    explanation: >-
      Gives the adjusted effect estimate from the prospective cohort, with the
      very wide confidence interval that reflects its small size.
  - reference: PMID:26917812
    reference_title: "Shiga Toxin-Producing Escherichia coli Infection, Antibiotics, and Risk of Developing Hemolytic Uremic Syndrome: A Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after excluding studies at high risk of bias and those that did not employ an acceptable definition of HUS, there was a significant association. Consequently, the use of antibiotics in individuals with STEC infections is not recommended."
    explanation: >-
      The meta-analysis supports the recommendation against antibiotics on the
      basis of its low-risk-of-bias subset.
  - reference: PMID:26917812
    reference_title: "Shiga Toxin-Producing Escherichia coli Infection, Antibiotics, and Risk of Developing Hemolytic Uremic Syndrome: A Meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, use of antibiotics was not associated with an increased risk of developing HUS"
    explanation: >-
      The same meta-analysis found no association across all eligible studies.
      Recorded as a separate REFUTE item rather than folded into the supporting
      one, because the pooled and restricted analyses point in opposite
      directions and both belong in the record.
- name: Ingestion of STEC-contaminated food and water
  description: >-
    Consumption of food and drinking water contaminated from the ruminant
    reservoir is the principal route by which infection is acquired, and the
    exposure that public-health prevention targets.
  exposure_term:
    preferred_term: ingestion of food or water contaminated with Shiga toxin-producing E. coli
    term:
      id: ECTO:3000009
      label: exposure to Escherichia coli
  influences_mechanisms:
  - target: Colonic Colonisation and Attaching-and-Effacing Lesion Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingestion of the contaminated vehicle is the route by which the organism
      reaches the colon and establishes the colonisation that initiates disease.
    evidence:
    - reference: PMID:23955166
      reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The principal route of infection is consumption of contaminated food and drinking water"
      explanation: Names ingestion of contaminated food and water as the principal route of the infection that initiates this disease.
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The principal route of infection is consumption of contaminated food and drinking water, although infection may also occur via direct contact with animals, person-to-person contact, and environmental exposure."
    explanation: Establishes the exposure and places it ahead of the other recognised routes.
  review_notes: >-
    The binding is the organism-exposure class, not a route-qualified one.
    Searched against the ECTO build itself: `l~coli` returns ECTO:3000009
    exposure to Escherichia coli, which is a leaf under ECTO:3000000 exposure
    to organism, and `descendants ECTO:3000000` confirms it has no "via
    ingestion" child; `l~contaminated food` returns nothing. So ECTO carries the
    organism but not the foodborne route, and the route is carried in
    preferred_term instead, as the Ontology Term Contract permits. The broader
    candidates were rejected on positive grounds: ECTO:7000119 exposure to
    contaminated water and ECTO:9002126 exposure to environmental food
    contaminant both name a chemical-contaminant sense of contamination, and
    ECTO:0070135 exposure to water via ingestion asserts the route without the
    pathogen.
progression:
- phase: STEC colitis prodrome
  duration: Several days; HUS emerges about 5-13 days after diarrhoea onset, often as the diarrhoea is resolving.
  notes: >-
    Diarrhoea that becomes bloody over one to three days, with abdominal
    tenderness and pain around defecation and frequently no fever at
    presentation. This is the window in which intervention can alter the renal
    outcome, and in which antibiotics should be withheld. Most infections stop
    here: 6.3% of 3464 STEC O157 infections under US surveillance progressed to
    HUS, rising to 15.3% in children under five.
  evidence:
  - reference: PMID:19827953
    reference_title: "Hemolytic uremic syndrome and death in persons with Escherichia coli O157:H7 infection, foodborne diseases active surveillance network sites, 2000-2006."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 3464 STEC O157 infections were ascertained; 218 persons (6.3%) developed HUS. The highest proportion of HUS cases (15.3%) occurred among children aged <5 years."
    explanation: >-
      Quantifies how often this phase progresses to HUS, overall and in the
      highest-risk age group. It is recorded here rather than in prevalence
      because the denominator is infected persons, not a population.
  - reference: PMID:21784993
    reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the brief interval between first presentation with diarrhea and HUS onset could be exploited to maintain or improve renal perfusion, possibly averting renal shutdown"
    explanation: Identifies the prodrome as a distinct phase with its own therapeutic window ahead of HUS onset.
- phase: Acute thrombotic microangiopathy
  duration: Days to a few weeks; dialysis, when needed, usually for days to weeks.
  notes: >-
    The full triad with acute kidney injury, around half of patients requiring
    renal replacement therapy, and extrarenal involvement in a minority. Deaths
    occur in this phase and are mostly neurological.
  evidence:
  - reference: PMID:39518638
    reference_title: "Changing Epidemiology and Outcomes of Hemolytic Uremic Syndrome in Children: A Prospective National Cohort Study from the Polish Pediatric HUS Registry and the Polish Registry of Renal Replacement Therapy in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall mortality rate was 2% for STEC-HUS and 3.7% for aHUS, with no deaths reported in children on eculizumab and mortality mainly attributed to neurological damage."
    explanation: >-
      Gives the case fatality for this disease and attributes the deaths mainly
      to neurological damage, which is the claim this phase's notes make.
  - reference: PMID:37303085
    reference_title: "Efficacy and Safety of Eculizumab in Pediatric Patients Affected by Shiga Toxin-Related Hemolytic and Uremic Syndrome: A Randomized, Placebo-Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "characterized by multiorgan thrombotic microangiopathy, mainly affecting children. Renal involvement is severe, with approximately half of patients requiring dialysis."
    explanation: Characterises the acute phase and the proportion needing dialysis in it.
- phase: Recovery and renal sequelae
  duration: Years; sequelae assessed at five-year follow-up and beyond.
  notes: >-
    Most children recover kidney function - complete renal recovery in 57
    patients after a median four years in one national series - but about a
    third carry kidney sequelae at five years. The course is monophasic, unlike
    the relapsing course of atypical HUS.
  evidence:
  - reference: PMID:32323005
    reference_title: "Hemolytic uremic syndrome caused by Shiga toxin-producing Escherichia coli in children: incidence, risk factors, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete renal recovery was observed in 57 patients after a median 4.0 years of follow-up."
    explanation: Gives the recovery outcome over years of follow-up in a nationwide paediatric cohort.
  - reference: PMID:37303085
    reference_title: "Efficacy and Safety of Eculizumab in Pediatric Patients Affected by Shiga Toxin-Related Hemolytic and Uremic Syndrome: A Randomized, Placebo-Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "at least 30% of survivors experience kidney sequelae"
    explanation: Quantifies the burden of long-term kidney sequelae among survivors.

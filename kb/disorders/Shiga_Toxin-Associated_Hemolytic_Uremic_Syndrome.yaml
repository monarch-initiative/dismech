- name: Ultra-Large von Willebrand Factor Secretion and Platelet Capture
  conforms_to: "thrombogenesis#Platelet Adhesion, Activation, and Aggregation"
  description: >
    Toxin-stimulated glomerular and umbilical-vein endothelial cells secrete
    ultra-large von Willebrand factor multimeric strings, to which perfused
    platelets adhere immediately. The toxin additionally delays ADAMTS13 cleavage
    of those strings, so the platelet-decorated multimers persist. Note that
    plasma ADAMTS13 activity in this disease is within the normal range - the
    defect is local and toxin-imposed, not the systemic protease deficiency of
    thrombotic thrombocytopenic purpura.

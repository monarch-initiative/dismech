diagnosis:
- name: Stool stx1/stx2 nucleic acid amplification testing
  description: >-
    Detecting the toxin genes in stool is what identifies the agent, and it is
    the step that separates this disease from atypical HUS, where management
    differs. A multiplex real-time PCR for stx1 and stx2 detects both O157 and
    non-O157 STEC - which matters because the two occur at similar incidence -
    and outperformed culture-based reference testing. Sorbitol-MacConkey
    culture, which exploits O157's failure to ferment sorbitol, misses the
    non-O157 serogroups by construction.
  evidence:
  - reference: PMID:23843484
    reference_title: "A sensitive multiplex, real-time PCR assay for prospective detection of Shiga toxin-producing Escherichia coli from stool samples reveals similar incidences but variable severities of non-O157 and O157 infections in northern California."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we assessed the performance of a multiplex, real-time PCR assay targeting stx1 and stx2 for the detection of O157 and non-O157 STEC in diarrheal stool samples enriched in Gram-negative broth"
    explanation: Establishes stool stx1/stx2 PCR as the assay that detects the agent across serogroups.
  - reference: PMID:23843484
    reference_title: "A sensitive multiplex, real-time PCR assay for prospective detection of Shiga toxin-producing Escherichia coli from stool samples reveals similar incidences but variable severities of non-O157 and O157 infections in northern California."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the assay is 100% sensitive (95% confidence interval [CI], 89.1% to 100%) and 98.5% specific (95% CI, 90.6% to 99.9%)"
    explanation: Gives the test performance that makes PCR the preferred detection route.
  - reference: PMID:23843484
    reference_title: "A sensitive multiplex, real-time PCR assay for prospective detection of Shiga toxin-producing Escherichia coli from stool samples reveals similar incidences but variable severities of non-O157 and O157 infections in northern California."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the recommendations of the CDC for laboratories to test all diarrheal stool samples from patients with acute community-acquired diarrhea for non-O157 STEC in addition to the O157 serotype by using a sensitive assay"
    explanation: >-
      Records the recommendation to test for non-O157 STEC as well as O157,
      which is why an O157-only culture strategy is inadequate.
  notes: >-
    The research report also describes Shiga toxin immunoassay, anti-O157 LPS
    serology for stool-negative cases, and the point that a negative stool does
    not exclude STEC-HUS because the toxin may have cleared by the time HUS
    presents. Those are not recorded as claims here because no reference cached
    for this entry states them in quotable form; they are a curation gap, not a
    dismissal.
animal_models:
- name: Pod-Gb3 transgenic mouse (Gb3 restricted to podocytes)
  species: Mouse
  genotype: Transgenic expression of the Shiga toxin receptor Gb3 confined to kidney podocytes
  publication: PMID:37863058
  description: >-
    A mouse engineered to express the toxin receptor in podocytes alone, then
    challenged with systemic Shiga toxin. It was built to ask why the glomerulus
    is the target organ, and it is the experimental basis for the local
    complement arm of this entry's mechanism and for the C5-inhibition
    rationale.
  modeled_mechanisms:
  - target: Alternative Complement Pathway Activation on Injured Endothelium
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Toxin challenge reproduced the HUS phenotype through the VEGF-A,
      glycocalyx, factor-H and local complement chain this node asserts, and
      early C5 inhibition rescued it.
    limitations: >-
      Gb3 is confined to podocytes by construction, so the model deliberately
      removes the glomerular endothelial and extrarenal receptor distribution
      that shapes human disease. It also cannot speak to the toxin's direct
      effect on endothelium, which is the arm the human in-vitro work covers.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Receptor expression outside the podocyte - on glomerular microvascular
        endothelium, and on the cerebral and other beds that produce extrarenal
        disease - is outside the model by design. The complement claim holds in
        the narrower form the model supports.
    readouts:
    - name: Glomerular endothelial inhibitory complement factor H binding
      target: Alternative Complement Pathway Activation on Injured Endothelium
      direction: DECREASED
      interpretation: >-
        Reduced factor H binding at the endothelial surface is the regulatory
        failure this node turns on, measured here rather than inferred.
      evidence:
      - reference: PMID:37863058
        reference_title: Shiga toxin targets the podocyte causing hemolytic uremic syndrome through endothelial complement activation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a reduction in GEnC inhibitory complement factor H binding, and local activation of the complement pathway"
        explanation: Reports the measured fall in factor H binding alongside local complement activation.
    evidence:
    - reference: PMID:37863058
      reference_title: Shiga toxin targets the podocyte causing hemolytic uremic syndrome through endothelial complement activation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Stx-challenged Pod-Gb3 mice developed STEC-HUS."
      explanation: Establishes that the model reproduces the disease, which is what makes it informative for this node.
  evidence:
  - reference: PMID:37863058
    reference_title: Shiga toxin targets the podocyte causing hemolytic uremic syndrome through endothelial complement activation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic mice were engineered to express the Stx receptor (Gb3) exclusively in their kidney podocytes (Pod-Gb3) and challenged with systemic Stx."
    explanation: Describes the construction and challenge of the model this record represents.
  notes: >-
    Species differences in Gb3 tissue distribution are the standing caveat on
    animal models of this disease, and are the reason this model had to put the
    receptor where it wanted it. Note that the deep-research report's stronger
    claim - that animals do not reproduce the human renal phenotype - is not
    adopted here: this model does reproduce it, and PMID:25530917 records that
    the relative toxicity of Stx2a over Stx1a "is replicated in mice and
    baboons". The honest statement is that receptor distribution differs and has
    to be engineered around, not that animal models fail.
phenotypes:
- category: Clinical
  name: Bloody diarrhea
  description: >-
    The prodromal illness is diarrhoea that typically begins non-bloody and
    becomes bloody over one to three days, reflecting the haemorrhagic colitis
    produced by colonic colonisation. It precedes HUS by about a week and is what
    makes this the "diarrhoea-positive" form of the syndrome.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Bloody diarrhea
    term:
      id: HP:0025085

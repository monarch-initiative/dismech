      label: Schistocytosis
  evidence:
  - reference: PMID:21784993
    reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "smear evidence of intravascular erythrocyte destruction"
    explanation: >-
      The case definition rests on blood-film evidence of erythrocyte
      destruction, which is the schistocytosis this phenotype records.
- category: Clinical
  name: Thrombocytopenia
  description: >-
    Platelet consumption in microvascular thrombi gives a platelet count below
    150 x 10^3/mm3 in case definitions. It is the second element of the triad.

treatments:
- name: Supportive Care
  description: >-
    Supportive management is the mainstay: there is no approved antitoxin and no
    specific treatment of proven benefit in the acute phase. It comprises
    attention to volume status, electrolyte and acid-base management, blood
    pressure control, transfusion as needed, and renal replacement therapy when
    the kidney injury demands it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute kidney injury
    treatment_effect: MODULATES
    description: >-
      Supportive care moderates the consequences of the renal injury rather than
      acting on the toxin that causes it.
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients currently receive supportive care to manage symptoms, as no specific treatment exists for D+HUS."
    explanation: States that supportive care is the available management and that no specific therapy exists.
- name: Early Intravenous Volume Expansion
  description: >-
    Intravenous fluid given in the first four days of diarrhoea, before HUS is
    established, is associated with a lower rate of oligoanuric renal failure.
    Children who became oligoanuric had received less intravenous fluid and
    sodium in that window. This is an observational association from a
    prospective cohort, not a randomised result, and the authors describe the
    intervention as underused.
  treatment_term:
    preferred_term: intravenous volume expansion
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Oliguria
    treatment_effect: MODULATES
    description: >-
      Maintaining renal perfusion during the prodrome is associated with
      preservation of urine output once HUS develops.
    evidence:
    - reference: PMID:21784993
      reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The relative risk of oligoanuria when fluids were not given in this interval was 1.6 (95% confidence interval, 1.1-2.4; P = .02)."
      explanation: >-
        Gives the effect estimate for withholding early fluids. Indirect because
        the design is observational, so the association is not established as
        causal.
  evidence:
  - reference: PMID:21784993
    reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravenous volume expansion is an underused intervention that could decrease the frequency of oligoanuric renal failure in patients at risk of HUS."
    explanation: The authors' own conclusion about the role of early volume expansion in patients at risk.
- name: Renal Replacement Therapy
  description: >-
    Dialysis supports the patient through oligoanuric acute kidney injury. It is
    needed by a large share of children in the acute phase - 63% in the Finnish
    national series quoted below, about half in the French trial cohort - and is
    usually temporary.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Acute kidney injury
    treatment_effect: BYPASSES
    description: Renal replacement substitutes for excretory function while the glomerular lesion resolves.
  evidence:
  - reference: PMID:32323005
    reference_title: "Hemolytic uremic syndrome caused by Shiga toxin-producing Escherichia coli in children: incidence, risk factors, and clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-five patients (63%) needed dialysis."
    explanation: Quantifies the use of dialysis in a nationwide paediatric STEC-HUS cohort.
- name: Packed Red Blood Cell Transfusion
  description: >-
    Transfusion corrects the anaemia of the microangiopathic haemolysis.
  treatment_term:
    preferred_term: packed red blood cell transfusion
    term:
      id: NCIT:C15409
      label: Packed Red Blood Cell Transfusion
  target_mechanisms:
  - target: Microangiopathic hemolytic anemia
    treatment_effect: RESTORES
    description: Transfusion replaces the erythrocytes lost to mechanical haemolysis.
  notes: >-
    Carried on the strength of the entry-level supportive-care citation; no
    source quoted here states a transfusion threshold. The related practice of
    withholding platelet transfusion unless there is bleeding or a planned
    procedure comes from the deep-research report and is deliberately not
    asserted in the description, because no quoted source in this entry
    supports it.
- name: Eculizumab
  description: >-
    Terminal complement inhibition is supported mechanistically - toxin-driven
    complement activation is part of the lesion, and early C5 inhibition rescues
    a mouse model - but is not standard care. The phase 3 randomised
    placebo-controlled trial in 100 children found no effect on the acute phase
    and a lower proportion with renal sequelae at one year. The two results
    belong together: the acute primary endpoint was negative, and the one-year
    difference is a follow-up result the trial's own authors frame as needing
    larger studies. The abstract lists its secondary endpoints as haematologic
    and extrarenal involvement, so the one-year sequelae figure is not described
    there as one of them.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
  target_mechanisms:
  - target: Alternative Complement Pathway Activation on Injured Endothelium
    treatment_effect: INHIBITS
    description: >-
      Eculizumab blocks C5 cleavage and so the terminal pathway downstream of
      the complement activation this disease induces at the endothelial surface.
    evidence:
    - reference: PMID:37863058
      reference_title: Shiga toxin targets the podocyte causing hemolytic uremic syndrome through endothelial complement activation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Early therapeutic inhibition of the terminal complement pathway with a C5 inhibitor rescued this podocyte-driven, Stx-induced HUS phenotype."
      explanation: Model-organism evidence that inhibiting the terminal pathway reverses the toxin-driven phenotype.
  evidence:
  - reference: PMID:37303085
    reference_title: "Efficacy and Safety of Eculizumab in Pediatric Patients Affected by Shiga Toxin-Related Hemolytic and Uremic Syndrome: A Randomized, Placebo-Controlled Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of RRT <48 hours did not differ significantly between the two groups (48% in the placebo versus 38% in the eculizumab group; P = 0.31) or in the course of ARF."
    explanation: >-
      The trial's primary endpoint was negative, refuting an acute-phase benefit
      of eculizumab in this disease.
  - reference: PMID:37303085
    reference_title: "Efficacy and Safety of Eculizumab in Pediatric Patients Affected by Shiga Toxin-Related Hemolytic and Uremic Syndrome: A Randomized, Placebo-Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of patients experiencing renal sequelae at 1 year was lower in the eculizumab group than in the placebo group (43.48% and 64.44%, respectively, P = 0.04)."
    explanation: >-
      The same trial found fewer renal sequelae at one year. Recorded as a
      separate SUPPORT item because it bears on a different claim from the
      negative acute endpoint, and both are needed to state the evidence
      honestly.
  - reference: PMID:37303085
    reference_title: "Efficacy and Safety of Eculizumab in Pediatric Patients Affected by Shiga Toxin-Related Hemolytic and Uremic Syndrome: A Randomized, Placebo-Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Larger prospective studies would be needed to further explore eculizumab as a potential treatment."
    explanation: The investigators' own statement of how much weight the one-year result can carry.
- name: Therapeutic Plasma Exchange
  description: >-
    Plasma therapy is not established in this disease. A large prospective
    paediatric study found plasma therapy associated with poor long-term
    outcome, and its first-line use is described as controversial. Recorded here
    because it is still used in some settings, not because it is recommended.
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  evidence:
  - reference: PMID:23955166
    reference_title: New insights into Shiga toxin-mediated endothelial dysfunction in hemolytic uremic syndrome
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a recent prospective study of 619 children with HUS identified an association between plasma therapy and poor long-term outcome"
    explanation: >-
      Reports an association between plasma therapy and poor long-term outcome,
      which cuts against its use in this disease.
differential_diagnoses:
- name: Atypical hemolytic uremic syndrome
  description: >-
    Complement-mediated HUS arising from inherited or acquired defects in
    alternative-pathway regulation. It lacks the diarrhoeal prodrome, relapses,
    and is an approved indication for complement inhibition - so the distinction
    changes management. Genetic testing of complement genes belongs to this
    work-up.
  evidence:
  - reference: PMID:40255570
    reference_title: "Eculizumab is efficacious and safe in pediatric patients with various forms of hemolytic uremic syndrome: a retrospective clinical experience of a tertiary center"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atypical HUS (aHUS) is a syndrome caused by inherited or acquired defects in regulation of the complement system's alternative pathway"
    explanation: Defines the aetiology that distinguishes atypical HUS from the toxin-mediated disease.
  - reference: PMID:40255570
    reference_title: "Eculizumab is efficacious and safe in pediatric patients with various forms of hemolytic uremic syndrome: a retrospective clinical experience of a tertiary center"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The various types of HUS are caused by different primary triggers; yet, their clinical features overlap"
    explanation: States the clinical overlap that makes this a genuine differential rather than an obvious distinction.
- name: Thrombotic thrombocytopenic purpura
  description: >-
    TTP produces the same microangiopathic triad but through severe ADAMTS13
    deficiency. In STEC-HUS plasma ADAMTS13 activity lies within a broad normal
    range - the protease impairment is local and toxin-imposed - so ADAMTS13
    activity separates them, and plasma exchange is the treatment for TTP but
    not for this disease.
  evidence:
  - reference: PMID:16131569
    reference_title: Hemolytic uremic syndrome-associated Shiga toxins promote endothelial-cell secretion and impair ADAMTS13 cleavage of unusually large von Willebrand factor multimers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "plasma levels of von Willebrand factor (VWF)-cleaving protease (ADAMTS13) activity that are within a broad normal range"
    explanation: >-
      Establishes that plasma ADAMTS13 activity is normal in this disease, which
      is the laboratory basis for separating it from TTP.
notes: >-
  No GeneReviews chapter exists for this disease and none is expected: it is an
  acquired, toxin-mediated infectious disease with no human causal gene, no
  OMIM entry and no Mendelian inheritance pattern, so the GeneReviews phenotype
  baseline does not apply.

  The disease is lumped deliberately across STEC serogroups. O157:H7 is carried
  as an infectious_agent subtype because its progression risk is separately
  quantified, but the non-O157 serogroups (O26, O80, O104, O111, O145) get no
  subtype rows: the cited nationwide series found that neither serogroup nor stx
  type predicted renal outcome or major CNS symptoms, so there is no documented
  axis of difference to carry. Shigella dysenteriae type 1 is a second agent
  rather than a second disease, which is why MONDO scopes this concept to the
  toxin.

  Two mechanistic steps are weaker than the rest of the chain and are marked as
  such rather than smoothed over. The identity of the carrier of Shiga toxin in
  blood is unsettled - the cited review says the major carrier has yet to be
  unequivocally identified - so the systemic-delivery step is the least secure
  link. And the classical account of how thrombocytopenia and erythrocyte
  fragmentation arise is quoted together with the cited authors' own remark that
  newer evidence challenges it.

  The complement regulatory genes (CFH, CD46/MCP, CFI, C3) reported in some
  patients with a severe course are deliberately NOT recorded as a `genetic:`
  entry. No gene-disease relationship can be typed for them from anything cited
  here: the only quotable statement available is about atypical HUS, which is
  the differential diagnosis rather than this disease, and an unsourced typed
  relationship is worse than no record. The same applies to A4GALT, the Gb3
  synthase, which the deep-research report names as a host determinant. The aHUS
  contrast is carried in `differential_diagnoses` instead, where it is actually
  sourced.

  Stx2, and the stx2a subtype in particular, is a documented risk factor for
  progression from infection to HUS (odds ratios of 9.7 and 16.6 in the Finnish
  cohort). That is a property of the infecting organism rather than of the host,
  and the schema has no slot for a bacterial virulence genotype, so it is
  recorded here rather than in the genetic section, which is for host genetics.

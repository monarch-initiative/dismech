      label: Thrombocytopenia
  evidence:
  - reference: PMID:21784993
    reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thrombocytopenia (platelet count <150 × 10³/mm³)"
    explanation: Gives the platelet threshold used to define the thrombocytopenia of this syndrome in a prospective cohort.
- category: Clinical
  name: Acute kidney injury
  description: >-
    The renal element of the triad, and the reason this is the leading cause of

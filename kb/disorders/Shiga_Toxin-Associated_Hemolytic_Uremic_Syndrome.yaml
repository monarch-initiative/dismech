- category: Clinical
  name: Oliguria
  description: >-
    Oligoanuria - urine output at or below 0.5 mL/kg/h for more than a day - is
    the clinically decisive renal outcome: oligoanuric patients usually need
    dialysis, stay in hospital longer, and have more chronic sequelae. It
    occurred in 68% of a prospective multicentre paediatric cohort.

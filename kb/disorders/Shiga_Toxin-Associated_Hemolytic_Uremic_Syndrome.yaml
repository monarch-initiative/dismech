    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "diarrhea that is initially nonbloody but that becomes bloody 1 to 3 days later"
    explanation: Describes the characteristic evolution of the prodromal diarrhoea in children infected with E. coli O157:H7.
- category: Clinical
  name: Microangiopathic hemolytic anemia
  description: >-
    Haemolytic anaemia with schistocytes on the blood film, one of the three
    defining features. Case definitions have used a haematocrit below 30% with
    smear evidence of intravascular erythrocyte destruction. The haemolysis is
    conventionally Coombs-negative; that point is not quoted from any reference
    cached here.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Microangiopathic hemolytic anemia
    term:
      id: HP:0001937
      label: Microangiopathic hemolytic anemia
  evidence:
  - reference: PMID:21784993
    reference_title: Early volume expansion during diarrhea and relative nephroprotection during subsequent hemolytic uremic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anemia (hematocrit level <30% with smear evidence of intravascular erythrocyte destruction)"
    explanation: Gives the operational case definition of the microangiopathic anaemia used in a prospective multicentre cohort.
- category: Laboratory
  name: Schistocytosis
  description: >-
    Fragmented erythrocytes on the peripheral blood film are the morphological
    signature of the mechanical haemolysis and are part of how the syndrome is
    defined.
  phenotype_term:
    preferred_term: Schistocytosis
    term:

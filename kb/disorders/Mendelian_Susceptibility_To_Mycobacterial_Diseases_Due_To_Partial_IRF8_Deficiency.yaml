      Establishes both the size of the founding cohort for the dominant form and its
      benign long-term course.
inheritance:
- name: Autosomal dominant
  description: >-
    The T80A allele acts in the heterozygous state. This is the feature that
    separates the partial form from the recessive complete deficiency, and it is
    part of why the two are curated as distinct entities.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The T80A variant was associated with an autosomal dominant, milder immunodeficiency and a selective depletion of CD11c+CD1c+ circulating dendritic cells."
    explanation: >-
      States the inheritance mode, the severity relative to the recessive form, and
      the cellular lesion in one sentence.
genetic:
- name: IRF8
  gene_term:
    preferred_term: IRF8
    term:
      id: hgnc:5358
      label: IRF8
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    The reported dominant allele is the T80A missense substitution. Both T80A and the
    recessive K108E allele act by disrupting the IRF8-DNA interaction rather than by
    reducing IRF8 expression, which is why the two produce graded rather than
    qualitatively different transcriptional lesions even though the diseases differ.
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected two distinct disease-causing mutations affecting interferon regulatory factor 8 (IRF8)."
    explanation: Establishes IRF8 as the disease gene in the founding report.
  - reference: PMID:23468103
    reference_title: "Genetic determinants of susceptibility to Mycobacterial infections: IRF8, a new kid on the block."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation T80A causes autosomal dominant IRF8 deficiency and a milder form of the disease with selective loss of a subset of dendritic cells."
    explanation: >-
      An independent review naming the specific allele responsible for the dominant
      form and its cellular consequence.
pathophysiology:
- name: Heterozygous IRF8 T80A Impairs IRF8 DNA Binding
  biological_scale: MOLECULAR
  description: >-
    IRF8 is an interferon regulatory factor that directs mononuclear phagocyte
    development by binding composite Ets/IRF and interferon-stimulated response
    elements in target promoters. The T80A substitution lies in the DNA-binding
    domain and impairs the IRF8-DNA interaction, reducing transcriptional output at
    IRF8 target genes. The lesion is in DNA contact, not in expression level or
    protein stability, which is what makes a single mutant allele consequential.
  genes:
  - preferred_term: IRF8
    term:
      id: hgnc:5358
      label: IRF8
  molecular_functions:
  - preferred_term: sequence-specific DNA binding by IRF8
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: DECREASED
  biological_processes:

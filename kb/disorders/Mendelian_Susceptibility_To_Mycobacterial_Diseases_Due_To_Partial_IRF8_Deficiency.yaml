    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with inborn errors in the IL12/IFNγ circuit may develop disseminated mycobacterial infections following perinatal BCG vaccination"
    explanation: >-
      Places the disease within the IL-12/IFN-gamma circuit. Graded INDIRECT because
      the sentence describes the circuit generally, not IL-12 output measured in a
      T80A carrier.
  downstream:
  - target: Insufficient Interferon-Gamma-Dependent Macrophage Activation
    causal_link_type: DIRECT
- name: Insufficient Interferon-Gamma-Dependent Macrophage Activation
  biological_scale: TISSUE
  description: >-
    IFN-gamma from NK and T lymphocytes is what licenses macrophages to kill the
    mycobacteria they have taken up. When the IL-12 signal that drives IFN-gamma
    production is weakened, macrophage activation is insufficient and weakly virulent
    mycobacteria persist and disseminate. This is the convergence point shared by
    almost every MSMD etiology, and it is why this transcription-factor defect
    presents with the same clinical syndrome as a cytokine or receptor defect.
  cell_types:
  - preferred_term: macrophage

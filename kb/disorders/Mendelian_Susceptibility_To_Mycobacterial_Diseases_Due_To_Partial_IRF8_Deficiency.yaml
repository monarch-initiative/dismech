      explanation: >-
        Ties the specific allele to the specific cellular deficit, which is the edge
        rather than either node alone.
- name: Selective Depletion of CD1c-Positive Conventional Dendritic Cells
  biological_scale: CELLULAR
  description: >-
    The cellular signature of the dominant form. CD11c+CD1c+ circulating conventional
    dendritic cells are selectively depleted, while circulating monocytes and the
    other mononuclear phagocyte subsets are preserved. That selectivity is the whole
    difference from the recessive form, in which monocytes and every DC subset are
    absent, and it is why this disease is confined to mycobacterial susceptibility
    rather than being a general immunodeficiency.
  cell_types:
  - preferred_term: CD1c-positive myeloid dendritic cell
    term:
      id: CL:0002399
      label: CD1c-positive myeloid dendritic cell
  - preferred_term: conventional dendritic cell

    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both K108E and T80A mutations impair IRF8 transcriptional activity by disrupting the interaction between IRF8 and DNA."
    explanation: >-
      Names the molecular mechanism of the causal allele: loss of DNA binding rather
      than loss of protein.
  downstream:

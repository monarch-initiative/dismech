phenotypes:
- category: Infectious
  name: Disseminated BCG disease
  frequency: OBLIGATE
  description: >-
    Disseminated disease following BCG vaccination is the presenting and defining
    manifestation. In the two subjects carrying the dominant T80A allele it occurred
    in childhood and was curable, in contrast to the recessive form, in which BCG
    disease was early in onset and required haematopoietic stem-cell transplantation.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also studied two otherwise healthy subjects with a history of disseminated but curable BCG disease in childhood."
    explanation: >-
      Documents disseminated BCG disease as the presenting feature in both reported
      carriers of the dominant allele, and its curable course.
- category: Hematologic
  name: Abnormal dendritic cell count
  frequency: OBLIGATE
  description: >-
    The laboratory hallmark: circulating CD11c+CD1c+ conventional dendritic cells are
    selectively depleted. HPO codes dendritic cell counts only at the level of
    abnormality, with no directional or subset-specific child term, so the binding is
    less specific than the finding; the specificity is carried in preferred_term and
    in the description.
  phenotype_term:
    preferred_term: Selective depletion of CD11c+CD1c+ circulating dendritic cells
    term:
      id: HP:0020178
      label: Abnormal dendritic cell count
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The T80A variant was associated with an autosomal dominant, milder immunodeficiency and a selective depletion of CD11c+CD1c+ circulating dendritic cells."
    explanation: Reports the dendritic-cell abnormality in the carriers of the dominant allele.
- category: Infectious
  name: Lymphadenopathy
  frequency: VERY_FREQUENT
  description: >-
    Lymphadenopathy is the commonest presenting sign across MSMD as a whole, and is
    the HPO-annotated finding for this disorder. The frequency band is taken from
    the 830-patient MSMD systematic review rather than from the two reported T80A
    carriers, and so describes the syndrome class rather than this etiology
    specifically.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphadenopathy was the most frequent finding, reported in 195 patients (46.8% cases)."
    explanation: >-
      Establishes lymphadenopathy as the commonest MSMD manifestation. Graded
      INDIRECT because the cohort spans all MSMD genotypes, so the frequency is not
      an IRF8-specific figure.
- category: Infectious
  name: Fever
  frequency: OCCASIONAL
  description: >-
    Fever accompanies the mycobacterial disease and is the second most common
    presenting sign across MSMD. The band follows the 14.1% figure for isolated
    fever as the presenting complaint in the pooled cohort, which is the number the
    cited sentence actually reports; the higher 30.2% figure in the same paper
    counts fever, organomegaly and sepsis together and is not usable for a
    fever-specific band.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The next most frequent clinical presentation was isolated fever in 59 patients (14.1%), followed by BCG infection in the form of BCG-osis"
    explanation: >-
      Gives the pooled MSMD frequency for fever. INDIRECT for the same reason as
      lymphadenopathy: the denominator is all MSMD, not partial IRF8 deficiency.
- category: Immunologic
  name: Granuloma
  frequency: FREQUENT
  description: >-
    Granulomatous inflammation at sites of mycobacterial disease. Granulomas can
    make MSMD masquerade as sarcoidosis until cultures identify the organism, which
    is a practical diagnostic trap rather than a mechanistic detail.
  phenotype_term:
    preferred_term: Granuloma
    term:
      id: HP:0032252
      label: Granuloma
  evidence:
  - reference: PMID:42183200
    reference_title: "Mendelian susceptibility to mycobacterial disease: IFN-γ-driven immunity collapse underlies heterogeneous infections."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "22 genes have been implicated, all converging on the IL-12/23-IFN-γ circuit, underscoring its non-redundant role in controlling intracellular pathogens."
    explanation: >-
      Cited for the disease class rather than for granuloma formation itself, hence
      INDIRECT: granuloma is the tissue response to the uncontrolled intracellular
      infection this sentence describes.
- category: Immunologic
  name: Immunodeficiency
  frequency: OBLIGATE
  description: >-
    A narrow immunodeficiency: susceptibility is to weakly virulent mycobacteria
    rather than to infection in general, and the two reported carriers were otherwise
    healthy.
  phenotype_term:
    preferred_term: Immunodeficiency
    term:
      id: HP:0002721
      label: Immunodeficiency
  evidence:
  - reference: PMID:23468103
    reference_title: "Genetic determinants of susceptibility to Mycobacterial infections: IRF8, a new kid on the block."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, mutations in human IRF8 were discovered and shown to cause two distinct forms of a novel primary immunodeficiency and associated susceptibility to mycobacteria."
    explanation: Classifies the condition as a primary immunodeficiency.
diagnosis:
- name: Circulating dendritic cell and monocyte immunophenotyping
  description: >-
    Flow-cytometric enumeration of circulating mononuclear phagocyte subsets is what
    distinguishes the partial from the complete form, and what makes the diagnosis
    reachable at all in a patient whose routine immunology is normal. Monocytes
    preserved with selective loss of CD11c+CD1c+ conventional DCs indicates the
    dominant form; absence of monocytes and all DC subsets indicates the recessive
    one.
  presence: PRESENT
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We characterized the monocyte and dendritic-cell compartments in these three subjects and sequenced candidate genes in which mutations could plausibly confer susceptibility to BCG disease."
    explanation: >-
      Describes the diagnostic approach that separated the two forms in the founding
      report.
- name: IRF8 sequencing
  description: >-
    Molecular confirmation. In the founding report the gene was reached by candidate
    gene sequencing guided by the mononuclear phagocyte phenotype rather than by
    unbiased exome sequencing.
  presence: PRESENT
  evidence:
  - reference: PMID:32344243
    reference_title: "Insights from Patients with Dendritic Cell Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review will summarise the clinical phenotypes of mutations in GATA2, IRF8 and IKZF1 genes which result in global or subset specific dendritic cell deficiencies"
    explanation: >-
      Establishes that IRF8 belongs to a small set of genes whose mutation causes
      subset-specific dendritic cell deficiency, which is what makes targeted
      sequencing sensible.
treatments:
- name: Antimycobacterial Chemotherapy
  description: >-
    Multi-drug antimycobacterial therapy directed at the isolated organism. In the
    partial form the disease has been curable with treatment alone, which is the
    principal clinical difference from the complete deficiency.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:
  - reference: PMID:42183200
    reference_title: "Mendelian susceptibility to mycobacterial disease: IFN-γ-driven immunity collapse underlies heterogeneous infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotics and IFN-γ therapy are required for several years to contain and ultimately control the infection."
    explanation: >-
      States the treatment principle for MSMD: prolonged antimycobacterial therapy,
      with IFN-gamma as the adjunct.
- name: Adjunctive Recombinant Interferon Gamma
  description: >-
    Recombinant IFN-gamma is the mechanistically rational adjunct for an MSMD
    etiology on the production side of the circuit, which is where an IRF8 defect
    sits: the lesion reduces the IFN-gamma signal reaching macrophages rather than
    their ability to respond to it, so supplying the cytokine bypasses the block.
    The published experience is from other MSMD genotypes, not from an IRF8 patient.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant interferon gamma
      term:
        id: NCIT:C583
        label: Recombinant Interferon Gamma
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Insufficient Interferon-Gamma-Dependent Macrophage Activation
    description: >-
      Exogenous IFN-gamma acts directly on the node the disease chain fails at,
      downstream of the DC and IL-12 steps that the IRF8 lesion disables.
  evidence:
  - reference: PMID:42183200
    reference_title: "Mendelian susceptibility to mycobacterial disease: IFN-γ-driven immunity collapse underlies heterogeneous infections."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 30-month treatment regimen of antimycobacterial treatment combined with recombinant IFN-γ1b was tried for the first time in patients carrying the PF75S mutation, and the patients recovered well after treatment."
    explanation: >-
      Reports a good outcome with combined antimycobacterial and IFN-gamma therapy.
      Graded INDIRECT because the treated patients carried a different MSMD
      genotype, so the support for using it in IRF8 deficiency runs through the
      shared circuit rather than through direct experience.
- name: Genetic Counseling and Avoidance of Live BCG Vaccination
  description: >-
    Autosomal dominant transmission carries a 50% recurrence risk per pregnancy.
    Because the presenting illness in both reported carriers was BCG disease, the
    practical consequence for an identified relative is avoidance of live BCG
    vaccination. Note this recommendation follows from the disease mechanism and the
    reported presentations rather than from a trial.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disseminated infection caused by bacille Calmette-Guérin (BCG) vaccines is an early manifestation of primary immunodeficiencies, such as severe combined immunodeficiency."
    explanation: >-
      Establishes live BCG vaccine as the exposure that unmasks this class of
      immunodeficiency, which is what makes avoidance the counseling point. INDIRECT
      because no study has tested vaccine avoidance as an intervention.
differential_diagnoses:
- name: Complete IRF8 deficiency (autosomal recessive, K108E)
  description: >-
    The allelic recessive disorder. It is distinguished at the bench rather than the
    bedside: complete deficiency abolishes circulating monocytes as well as every
    dendritic cell subset, adds mucocutaneous fungal disease and granulocytic
    hyperplasia, and required haematopoietic stem-cell transplantation for cure.
  evidence:
  - reference: PMID:25122610
    reference_title: "Functional characterization of the human dendritic cell immunodeficiency associated with the IRF8(K108E) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient initially presented with severe disseminated mycobacterial and mucocutaneous fungal infections and was ultimately cured by cord blood transplant."
    explanation: >-
      Describes the recessive form's broader infectious phenotype and its
      transplant-dependent outcome, both of which distinguish it from the dominant
      form curated here.
- name: Biallelic IRF8 deficiency with immune dysregulation (R83C/R291Q)
  description: >-
    A third IRF8 phenotype, reported in a compound heterozygote, extending beyond
    mononuclear phagocyte deficiency to arrested NK cell maturation, impaired T and B
    cell differentiation, granuloproliferation and intracerebral calcification. It is
    listed here because it shows the IRF8 allelic series is wider than the
    partial/complete dichotomy, not because it is clinically confusable with the
    dominant form.
  evidence:
  - reference: PMID:29128673
    reference_title: "Biallelic interferon regulatory factor 8 mutation: A complex immunodeficiency syndrome with dendritic cell deficiency, monocytopenia, and immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis defines the clinical features of human biallelic IRF8 deficiency, revealing a complex immunodeficiency syndrome caused by DC and monocyte deficiency combined with widespread immune dysregulation."
    explanation: Establishes the third phenotype in the IRF8 allelic series.
- name: Dominant-negative IRF8 deficiency (c.1279dupT)
  description: >-
    A fourth IRF8 phenotype, and the one closest to this entry. A C-terminal
    extension variant acts dominant-negatively on IRF8 nuclear localization and also
    reduces cDC2, so it presents with mycobacterial susceptibility like the partial
    form. It is distinguishable in that plasmacytoid DCs and cDC1 are also reduced
    and the reported family had EBV viremia and an HPV-positive tumour, a viral
    susceptibility the T80A form does not carry.
  evidence:
  - reference: PMID:40072380
    reference_title: "A novel dominant-negative variant of IRF8 in a mother and son: Clinical, phenotypic and biological characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients had a decrease in plasmacytoid dendritic cells (pDCs) and in cDC1s, a mild neutrophilia and a mild monocytosis."
    explanation: >-
      Documents the cellular differences that separate the dominant-negative
      phenotype from the cDC2-selective partial form curated here.
- name: Other genetic etiologies of MSMD
  description: >-
    MSMD is genetically heterogeneous and the etiologies are clinically similar, so
    the differential is settled by genotype and immunophenotype rather than by
    presentation. Most other MSMD genes lie in the IL-12/IFN-gamma cytokine circuit
    itself; IRF8 is distinctive in lying upstream of it, in the specification of the
    IL-12-producing cell.
  evidence:
  - reference: PMID:23468103
    reference_title: "Genetic determinants of susceptibility to Mycobacterial infections: IRF8, a new kid on the block."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with inborn errors in the IL12/IFNγ circuit may develop disseminated mycobacterial infections following perinatal BCG vaccination"
    explanation: >-
      States the shared final pathway that makes the MSMD etiologies clinically
      similar to one another.
discussions:
- discussion_id: irf8_t80a_il12_output_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has reduced IL-12 production actually been measured in a carrier of the dominant
    IRF8 T80A allele, or is the IL-12 step inferred from the position of conventional
    dendritic cells in the IL-12/IFN-gamma circuit?
  attaches_to:
  - pathophysiology#Reduced IL-12 Production by Antigen-Presenting Cells
  rationale: >-
    The chain from selective DC depletion to mycobacterial susceptibility runs
    through IL-12, and the inference is a reasonable one: conventional DCs are the
    dominant IL-12 source and MSMD is an IL-12/IFN-gamma circuit disease. But none of
    the sources cited here reports an IL-12 or IFN-gamma measurement in a T80A
    carrier. The inference is also not trivially safe, because the depletion is
    partial and subset-selective, so whether it is quantitatively sufficient to
    produce a cytokine deficit is exactly the open question. The node is therefore
    curated with an INDIRECT incoming edge and this gap rather than with a
    manufactured measurement.
  proposed_experiments:
  - experiment_id: irf8_t80a_il12_ifng_whole_blood
    name: Whole-blood IL-12 and IFN-gamma induction assay in T80A carriers
    description: >-
      Stimulate whole blood from T80A heterozygotes and matched controls with BCG
      alone and with BCG plus IFN-gamma, and measure IL-12p40, IL-12p70 and
      IFN-gamma. This is the standard MSMD functional assay, and it would also place
      the defect on the production rather than the response side of the circuit.
    readouts:
    - name: BCG-induced whole-blood IL-12p70
      target: pathophysiology#Reduced IL-12 Production by Antigen-Presenting Cells
      direction: DECREASED
      interpretation: >-
        Reduced IL-12p70 in carriers would convert this node from inferred to
        measured and would justify retyping the incoming edge as direct.
- discussion_id: irf8_t80a_penetrance_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the penetrance of the dominant IRF8 T80A allele, and does it require BCG
    exposure to become clinically apparent?
  attaches_to:
  - inheritance#Autosomal dominant
  rationale: >-
    Both reported T80A carriers were ascertained through childhood BCG disease and
    were otherwise healthy adults when studied. That design cannot distinguish a
    fully penetrant allele whose only manifestation is BCG disease from a
    low-penetrance allele that happens to have been found in two symptomatic people.
    The distinction matters clinically, because it determines whether an
    asymptomatic relative carrying the allele should avoid live BCG vaccination.
    Neither a family segregation study nor a carrier survey has been reported.
notes: >-
  Curation decisions worth recording.

  Scope. This entry is the partial (autosomal dominant, T80A) form only, as the
  MONDO term specifies. Complete IRF8 deficiency and the biallelic R83C/R291Q
  phenotype are curated as differentials rather than subtypes, because the
  compartment lost differs (monocytes spared versus abolished), the inheritance
  differs, and the outcome differs. Both are candidates for their own entries.

  The IL-12 node is inferred, and is labelled as such. See the knowledge gap. The
  incoming edge is typed INDIRECT_UNKNOWN_INTERMEDIATES and its evidence carries
  directness: INDIRECT for the same reason.

  Phenotype binding is coarser than the finding. HPO has HP:0020178 (Abnormal
  dendritic cell count) with no directional or subset child term, so the selective
  CD11c+CD1c+ depletion cannot be bound at the specificity the literature reports it
  at. The specific finding is carried in preferred_term, which the ontology term
  contract permits.

  Deep research. An OpenScientist report is committed with the entry. It supplied
  the IRF8 dose-dependence argument, the HPO annotation set for OMIM:614893, the
  pooled MSMD cohort figures, and the dominant-negative allele as a fourth
  phenotype. Two of its identifiers were wrong and are not used here: it offered
  NCIT:C20495 for "Interferon Gamma" (that code is Interferon Beta; the entry uses
  NCIT:C583, Recombinant Interferon Gamma), and its own term-validation section did
  not check the NCIT terms, so nothing flagged it. Its term validation could not be
  run inside the research recipe at all until three non-ontology prefixes were
  skipped; see the notes on issue #10396.

  Frequency bands drawn from the pooled MSMD cohort are marked as such. The
  lymphadenopathy, fever and granuloma phenotypes carry directness: INDIRECT because
  their denominators are all 830 MSMD patients across 21 genes, not the two reported
  T80A carriers. They are included because they are the HPO-annotated findings for
  this OMIM entry, but a reader should not take those percentages as IRF8-specific.

  No GeneReviews chapter exists for this disorder. PubMed searches for
  "Mendelian susceptibility to mycobacterial disease GeneReviews" and
  "IRF8 GeneReviews" both returned zero records, so there is no expert-curated
  phenotype baseline to cross-reference and the phenotype list is drawn from the
  primary literature.

  The recessive K108E sentence is quoted on the DC-depletion node deliberately. It
  describes a different disease, and its explanation says so: it is cited as the
  contrast that establishes the dominant allele's loss is selective rather than
  globally milder. Reading it as evidence for this entry's own cellular phenotype
  would be wrong.

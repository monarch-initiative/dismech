      label: myeloid dendritic cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:23468103
    reference_title: "Genetic determinants of susceptibility to Mycobacterial infections: IRF8, a new kid on the block."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation T80A causes autosomal dominant IRF8 deficiency and a milder form of the disease with selective loss of a subset of dendritic cells."
    explanation: Independent statement of the selective DC loss.
  - reference: PMID:40680811
    reference_title: "Cis- and trans-regulation of Irf8 enhancers during dendritic cell development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "the cell fate within the myeloid lineages is determined in an IRF8 dose-dependent manner"
    explanation: >-
      Supplies the reason a heterozygous allele produces a subset-selective rather
      than a global defect. Graded INDIRECT because it states the general dose
      principle from murine DC development rather than measuring it in a T80A
      carrier.
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The K108E variant was associated with an autosomal recessive severe immunodeficiency with a complete lack of circulating monocytes and dendritic cells."
    explanation: >-
      Cited here for contrast: it describes the recessive allele's compartment loss,
      which is what establishes that the dominant allele's loss is selective rather
      than merely milder across the board.
  downstream:
  - target: Reduced IL-12 Production by Antigen-Presenting Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Conventional dendritic cells are the principal IL-12-producing
      antigen-presenting cells, so depleting them is expected to reduce the IL-12
      available to drive IFN-gamma. No source cited here measures IL-12 output in a
      T80A carrier, so the edge is typed as indirect and the downstream node
      carries a knowledge gap.
- name: Reduced IL-12 Production by Antigen-Presenting Cells
  biological_scale: CELLULAR
  description: >-
    The step that places this disease in the IL-12/IFN-gamma circuit. With fewer
    IL-12-competent conventional dendritic cells, less IL-12 reaches NK and T
    lymphocytes. This node is inferred from the position of IRF8 and of conventional
    DCs in that circuit rather than measured in a patient carrying the dominant
    allele; see the attached knowledge gap.
  biological_processes:
  - preferred_term: interleukin-12 production

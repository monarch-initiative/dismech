name: Mendelian Susceptibility To Mycobacterial Diseases Due To Partial IRF8 Deficiency
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
synonyms:
- MSMD due to partial IRF8 deficiency
- Autosomal dominant IRF8 deficiency
- IRF8 T80A deficiency
- Immunodeficiency 32A
- IMD32A
- Mycobacteriosis, autosomal dominant
description: >
  Mendelian susceptibility to mycobacterial disease (MSMD) due to partial IRF8
  deficiency is an autosomal dominant inborn error of immunity caused by a
  heterozygous variant in IRF8, the transcription factor that specifies the
  mononuclear phagocyte lineage. It presents as MSMD: disease caused by weakly
  virulent mycobacteria, in particular the Bacille Calmette-Guerin (BCG) vaccine
  strain, in an individual whose routine immunological testing is otherwise
  unremarkable.

  The distinguishing feature of this etiology is where in the IL-12/IFN-gamma
  circuit the lesion sits. Most MSMD genes encode the cytokines of that circuit or
  their receptors. IRF8 instead encodes the transcription factor that builds the
  cells which produce IL-12 in the first place, so the deficiency is cellular
  rather than humoral: the T80A substitution impairs IRF8 binding to DNA and
  selectively depletes one dendritic-cell compartment, the CD11c+CD1c+ conventional
  DCs, while leaving monocytes intact. Fewer IL-12-competent antigen-presenting
  cells means less IL-12, less IFN-gamma from NK and T lymphocytes, and macrophages
  that are not activated enough to contain intracellular mycobacteria.

  Partial and complete IRF8 deficiency are two diseases, not two severities, and the
  entry is scoped to the partial form. The autosomal recessive K108E allele abolishes
  circulating monocytes as well as every dendritic-cell subset and produced a
  fatal-course immunodeficiency requiring haematopoietic stem-cell
  transplantation; the dominant T80A allele spares monocytes, takes out one DC
  subset, and was found in two otherwise healthy adults whose childhood BCG
  disease had resolved with treatment. The dividing line is the monocyte
  compartment, and it maps onto a difference in outcome large enough that treating
  them as one entry would obscure both.

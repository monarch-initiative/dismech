      label: type II interferon-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:23468103
    reference_title: "Genetic determinants of susceptibility to Mycobacterial infections: IRF8, a new kid on the block."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study of such MSMD (Mendelian Susceptibility to Mycobacterial Diseases) patients has provided much insight into innate and acquired immune defenses against mycobacteria."
    explanation: >-
      Establishes MSMD as a disorder of antimycobacterial immune defense, the class

    explanation: >-
      All three halves of the dissociation in one sentence: no acoustic neural response,
      preserved electrical response, preserved emissions.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using auditory brainstem response and distortion product otoacoustic emissions, we
      showed progressive hearing loss with intact cochlear amplification in the
      VGLUT3A224V/A224V mouse.
    explanation: >-
      The same dissociation in the allele-matched model, and in progressive rather than
      congenital form.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Decent DPOAEs were recorded in the knock-in mutant mouse. In contrast, otoacoustic
      emissions were absent in patients harbouring the p.A211V allele
    explanation: >-
      Refutes this node as a human phenotype. The preserved-amplification half of the
      dissociation is a mouse result that the patients contradict, which is the single most
      important qualification on this entry. Graded HUMAN_CLINICAL because the quoted clause
      reports a patient audiological finding, even though the paper is otherwise a mouse study.

- name: Secondary Deafferentation of the Inner Hair Cell
  biological_scale: TISSUE
  description: >-
    In the null mouse the afferent synapses beneath the inner hair cells, the spiral ganglion
    neurons themselves and the lateral efferent endings all decline with time, and some
    cochlear ganglion neurons degenerate early enough that the glutamate released before
    hearing onset is inferred to have a developmental role rather than only a signalling one.
    Aged null cochleae show degeneration of inner hair cells, synapses and stereocilia
    together.

    This matters clinically because it is the part of the disease a therapy would have to
    outrun.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  downstream:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Loss of the afferent population adds an irreversible component to a deficit that began
      as a functional one.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Later, the number of afferent synapses, spiral ganglion neurons, and lateral efferent
      endings below sensory IHCs declined.
    explanation: >-
      The deafferentation itself, and its late timing relative to the functional deficit.
  - reference: PMID:18215623
    reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The early degeneration of some cochlear ganglion neurons in knockout mice also
      indicates an important developmental role for the glutamate released by hair cells
      before the onset of hearing.
    explanation: >-
      The developmental component, which is a different claim from use-dependent loss and is
      the reason a congenital null and an adult-onset human disease may diverge here.
  - reference: PMID:40841774
    reference_title: Gene therapy restores auditory function and rescues damaged inner hair cells in an aged Vglut3 knockout mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we analyzed the cochlear structure of aged Vglut3KO mice, revealing
      significant degeneration of inner hair cells, synapses, and stereocilia.
    explanation: >-
      The structural endpoint in the aged null animal.

phenotypes:

- category: Otologic
  name: Progressive High-Frequency Sensorineural Hearing Loss
  description: >-
    The defining phenotype: bilateral sensorineural loss that begins at high frequencies and
    worsens slowly over years. It was the phenotype the locus was mapped on, before the gene
    was known, in a large multigenerational United States family of Czech descent.

    No frequency band is asserted. The published human material is nine probands across
    eight variants, and no series has reported what proportion of carriers show a given
    audiometric feature, so any band here would be a number invented for the slot.
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:11115382
    reference_title: "DFNA25, a novel locus for dominant nonsyndromic hereditary hearing impairment, maps to 12q21-24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a novel dominant locus, DFNA25, for delayed-onset, progressive,
      high-frequency, nonsyndromic sensorineural hearing loss in a large, multigenerational
      United States family of Czech descent.
    explanation: >-
      The phenotype as defined at the locus, in the founding kindred.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified SLC17A8, which encodes the vesicular glutamate transporter-3
      (VGLUT3), as the gene responsible for DFNA25, an autosomal-dominant form of
      progressive, high-frequency nonsyndromic deafness.
    explanation: >-
      The same phenotype restated once the gene was in hand.

- category: Otologic
  name: Postlingual Delayed Onset
  description: >-
    Hearing is normal through speech acquisition and the loss declares itself later. In the
    original kindred the clinical study describes onset in the postlingual period, and the
    linkage report calls the phenotype delayed-onset. This is what separates DFNA25 from the
    prelingual recessive deafnesses and puts it outside the newborn screening window.
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals typically manifest a high-frequency, slowly progressive
      sensorineural hearing loss in the postlingual period.
    explanation: >-
      Onset timing, from the serial-audiogram study of the founding family.

- category: Otologic
  name: Age-Dependent Penetrance
  description: >-
    Carriers are not uniformly affected at any given age; the proportion affected rises with
    age. The founding clinical study additionally reports a parent-of-origin pattern in that
    single family - carriers who inherited the haplotype from an affected mother were
    invariably affected by the second decade, while those who inherited it from an affected
    father often had age-normal hearing into the seventh decade - and a sex difference in
    reported onset, males earlier than females.

    Both of those observations come from one kindred, were made before the gene was
    identified, and have not been replicated. They are recorded because they are the only
    published statements about penetrance in this disease, not because they are established.
    The same study screened four deafness-associated mitochondrial variants in the family and
    found none segregating, so a mitochondrial explanation for the maternal pattern was
    looked for and not found.

    No phenotype_term is bound. The obvious candidate, HP:0003829 Typified by incomplete
    penetrance, is an HPO clinical modifier rather than a phenotypic abnormality and is not
    a member of the PhenotypeTerm enum, so binding it would fail term validation; nothing in
    the phenotypic-abnormality branch expresses age-dependent penetrance.
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance is autosomal dominant with age-dependent penetrance.
    explanation: >-
      The penetrance statement itself.
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In those inheriting the DFNA25-associated haplotype from an affected mother, hearing
      loss invariably developed by the second decade of life, whereas those inheriting the
      DFNA25 haplotype from an affected father often maintained hearing levels comparable to
      those of age-matched control subjects, even into the seventh decade of life.
    explanation: >-
      The parent-of-origin observation, quoted in full so the size and source of the claim
      travel with it.
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of 4 deafness-associated mitochondrial mutations screened (1555A>G, 7445A>G,
      Cins7472, and 7511T>C) were found to segregate in the family.
    explanation: >-
      Records that the obvious maternal-transmission explanation was tested and excluded in
      this family.

- category: Otologic
  name: Absent Otoacoustic Emissions
  description: >-
    Otoacoustic emissions are reported absent in patients carrying the p.A211V allele. This is
    the single most consequential human finding in the entry, and it points away from the class
    the gene's function would predict: an auditory synaptopathy has preserved emissions with an
    absent or desynchronised brainstem response, and these patients do not. On that basis the
    knock-in study concludes DFNA25 is more likely a progressive hearing loss than an auditory
    neuropathy.

    Two readings are open, and the source raises both. Absent emissions may mean the outer hair
    cells are involved, which would place the lesion outside the synapse. Or they may reflect
    accumulated noise exposure over a lifetime in a middle-aged cohort, which would be an
    acquired overlay on a synaptopathic disease. Nobody has separated these, and the entry does
    not choose.

    No frequency band is given. The observation reaches this entry as a statement about "patients
    harbouring the p.A211V allele" in a later paper's discussion, without a numerator, and the
    primary audiological study it points to is a single family.
  phenotype_term:
    preferred_term: Absent otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, otoacoustic emissions were absent in patients harbouring the p.A211V allele
    explanation: >-
      The human audiological finding itself. Graded HUMAN_CLINICAL because the clause reports a
      patient measurement, although the paper it appears in is a mouse study.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, DFNA25 is more likely to be a progressive hearing loss in human rather than an
      auditory neuropathy
    explanation: >-
      The classification conclusion the authors draw from it, which is the reason this entry does
      not file DFNA25 under the auditory neuropathy spectrum.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of otoacoustic emissions in DFNA25 patients might be due to additional factors
      encountered during lifetime such as noise
    explanation: >-
      The competing explanation, offered by the same authors as a possibility they did not test.
      Graded NO_EVIDENCE because it reports a hypothesis rather than a result, and it is the
      reason the classification above is recorded as a conclusion rather than as settled.

- category: Otologic
  name: Absence of Syndromic Features
  description: >-
    No consistent extra-auditory finding has been reported. A three-generation Korean family
    with the splice-donor allele is explicitly described as having no accompanying symptoms.

    There is a mechanistic reason to expect the vestibular system in particular to be spared
    even though VGLUT3 is present in vestibular hair cells: in the null mouse, quantal
    transmission in the utricular calyx collapses by more than ninety-five per cent while
    vestibular nerve firing and balance behaviour stay normal, because non-quantal
    transmission carries the type I hair cell synapse. The cochlea has no such backup.
  evidence:
  - reference: PMID:28647561
    reference_title: Identification of a novel splicing mutation within SLC17A8 in a Korean family with hearing loss by whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the clinical information about this family revealed that there are no other symptoms
      accompanied with HL
    explanation: >-
      The nonsyndromic statement in a reported dominant family.
  - reference: PMID:41279968
    reference_title: Persistence of vestibular function in the absence of glutamatergic transmission from hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In behavioral studies, Vglut3 -/- mice did not exhibit considerable sensorimotor or
      balance deficits.
    explanation: >-
      Vestibular sparing in the model, which is why the human phenotype being purely cochlear
      is expected rather than surprising.
  - reference: PMID:41279968
    reference_title: Persistence of vestibular function in the absence of glutamatergic transmission from hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, these data support the view that non-quantal transmission is the
      predominant mode of neurotransmission between type I VHCs and vestibular calyceal
      afferent neurons.
    explanation: >-
      The mechanism of the sparing - a parallel transmission mode that the cochlear afferent
      synapse does not have.

genetic:

- name: SLC17A8
  gene_term:
    preferred_term: SLC17A8
    term:
      id: hgnc:20151
      label: SLC17A8
  relationship_type: CAUSATIVE
  notes: >-
    The single causal gene, encoding vesicular glutamate transporter 3. Eight unique variants
    across nine probands were on ClinGen's count at the 2023 reevaluation - missense,
    frameshift and splice site - with twenty-eight further segregating relatives in two
    families.

    The alleles are not obviously one mechanism. p.A211V is a conserved missense that leaves
    vesicular glutamate accumulation intact where it has been tested; p.M206Nfs*4 and
    c.763+1G>T predict a truncated or absent product. The entry keeps them together as one
    causative gene record and does not claim a shared molecular route.
  evidence:
  - reference: CGGV:assertion_8c399400-090a-4b2e-93ff-0c4915ce81c7-2023-06-01T160000.000Z
    reference_title: SLC17A8 / nonsyndromic genetic hearing loss (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in this gene segregated with disease in 28 additional members in two families
    explanation: >-
      The segregation evidence behind the Definitive classification.
  - reference: CGGV:assertion_8c399400-090a-4b2e-93ff-0c4915ce81c7-2023-06-01T160000.000Z
    reference_title: SLC17A8 / nonsyndromic genetic hearing loss (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, SCL17A8 is definitively associated with autosomal dominant nonsyndromic
      hearing loss.
    explanation: >-
      The panel's summary sentence. The gene symbol is transposed in the source record and is
      quoted as written.

inheritance:

- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Every reported proband is heterozygous and the trait segregates vertically through
    multiple generations. Penetrance is age-dependent, so an unaffected young carrier does
    not exclude the diagnosis and phenotype-based testing of relatives is unreliable.
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance is autosomal dominant with age-dependent penetrance.
    explanation: >-
      Inheritance mode and the penetrance qualifier together.

animal_models:

- name: Slc17a8 null mouse
  species: Mouse
  genotype: Slc17a8 (Vglut3) exon 2 targeted deletion, homozygous null
  publication: PMID:18674745
  description: >-
    The founding model and the source of the presynaptic mechanism. It establishes that the
    inner hair cell releases empty vesicles, that the cochlear amplifier and the ascending
    pathway are both intact, and that afferent synapses and spiral ganglion neurons are lost
    later. It also carries a phenotype the human disease does not have - a generalised
    epilepsy - reflecting VGLUT3's expression outside the ear.
  modeled_mechanisms:
  - target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The release failure and its localisation to vesicle content rather than fusion, both
      measured directly in the correct cell type.
    limitations: >-
      A homozygous constitutive null, whereas DFNA25 patients are heterozygous for a missense
      allele; heterozygous Slc17a8 knockout mice hear normally, so this animal does not model
      the dominant genetics of the human disease at all. It is congenitally and profoundly
      deaf where the patients are postlingual and progressive. The epilepsy is a mouse
      phenotype with no reported human counterpart.
    readouts:
    - name: Calcium-triggered synaptic vesicle turnover in inner hair cells
      target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
      direction: UNCHANGED
      interpretation: >-
        Exocytosis itself is normal. A deliberate negative result, and the one that makes the
        defect a cargo defect rather than a release-machinery defect.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ca(2+)-triggered synaptic-vesicle turnover was normal in IHCs of Slc17a8 null mice
          when probed by membrane capacitance measurements at 2 weeks of age.
        explanation: >-
          The capacitance measurement behind this readout.
    - name: Ribbon synapse ultrastructure at three months
      target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
      direction: UNCHANGED
      interpretation: >-
        The surviving ribbon synapses are structurally normal, so at this age the lesion is
        functional rather than morphological.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ribbon synapses remaining by 3 months of age had a normal ultrastructural
          appearance.
        explanation: >-
          The electron-microscopy observation behind this readout.
    evidence:
    - reference: PMID:18215623
      reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We now report that mice lacking VGLUT3 are profoundly deaf due to the absence of
        glutamate release from hair cells at the first synapse in the auditory pathway.
      explanation: >-
        Supports treating this model as informative for the release node.
  - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The three-way dissociation - no acoustic neural response, intact emissions, intact
      electrically evoked brainstem response - measured in one animal.
    limitations: >-
      The human audiology contradicts half of it. Otoacoustic emissions are reported absent in
      p.A211V carriers, so the preserved-amplification half of this dissociation is a mouse
      result the patients do not reproduce, and the entry curates that as a separate phenotype.
      No electrically evoked brainstem response has been published for any DFNA25 patient. The
      mouse is also completely unresponsive to sound, whereas patients retain useful
      low-frequency hearing for decades.
    readouts:
    - name: Otoacoustic emissions
      target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        Outer hair cell amplification is preserved, placing the lesion downstream of the
        cochlear amplifier. A negative result, and the load-bearing one.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          robust otoacoustic emissions were recorded
        explanation: >-
          The emissions measurement behind this readout.
    - name: Electrically evoked auditory brainstem response
      target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        The ascending auditory pathway can still be driven when the defective synapse is
        bypassed, which is the observation that makes cochlear implantation biologically
        plausible in this disease.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          although auditory brainstem responses could be elicited by electrical stimuli
        explanation: >-
          The electrical-stimulation measurement behind this readout.
    evidence:
    - reference: PMID:18674745
      reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses
        to acoustic stimuli, although auditory brainstem responses could be elicited by
        electrical stimuli, and robust otoacoustic emissions were recorded.
      explanation: >-
        Supports treating this model as informative for the dissociation node.
  - target: Secondary Deafferentation of the Inner Hair Cell
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      The afferent synapses, spiral ganglion neurons and lateral efferent endings decline
      after the functional deficit is established.
    limitations: >-
      Fidelity is LOW because the timing cannot transfer. This animal never hears, so its
      deafferentation follows a complete congenital absence of afferent drive; DFNA25 patients
      hear normally for decades first. Part of the loss is attributed to a developmental role
      for hair-cell glutamate before hearing onset, a window that has already closed by the
      time a human carrier becomes symptomatic. No human temporal-bone or synapse-count data
      exist for comparison.
    readouts:
    - name: Afferent synapse and spiral ganglion neuron counts
      target: Secondary Deafferentation of the Inner Hair Cell
      direction: DECREASED
      interpretation: >-
        The afferent population beneath the inner hair cell falls over time in the null
        animal.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Later, the number of afferent synapses, spiral ganglion neurons, and lateral
          efferent endings below sensory IHCs declined.
        explanation: >-
          The counting result behind this readout.
    evidence:
    - reference: PMID:18215623
      reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The early degeneration of some cochlear ganglion neurons in knockout mice also
        indicates an important developmental role for the glutamate released by hair cells
        before the onset of hearing.
      explanation: >-
        Supports the model for this node while naming the developmental confound that limits
        its fidelity.

- name: VGLUT3 A224V knock-in mouse
  species: Mouse
  genotype: Slc17a8 p.A224V knock-in (mouse equivalent of human p.A211V), homozygous
  publication: PMID:34783032
  description: >-
    The allele-matched model, and the reason this entry carries two hypothesis groups. A
    single point mutation was introduced into exon 5 of mouse Slc17a8, exchanging the codon
    for the alanine that corresponds to human A211. It reproduces the progressive course the
    null mouse does not, and it reaches a different conclusion about where the disease starts.
  modeled_mechanisms:
  - target: Inner Hair Cell Stereocilia Bundle Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Collapse and fusion of the inner hair cell stereocilia bundles, with outer hair cell
      bundles spared - the model's primary structural finding.
    limitations: >-
      Homozygous for an allele that patients carry heterozygously, so the model may be
      reporting a dose effect that heterozygous carriers never reach. Whether human DFNA25
      inner hair cells have disordered bundles is unknown and unknowable in life. The paper
      offers no mechanism connecting the transporter to bundle architecture, so this remains
      a correlation within the model.
    readouts:
    - name: Inner hair cell stereocilia bundle morphology by scanning electron microscopy
      target: Inner Hair Cell Stereocilia Bundle Disruption
      direction: ALTERED
      interpretation: >-
        Inner hair cell bundles collapse; outer hair cell bundles do not. The contrast within
        the same cochlea is what makes this a cell-type-specific lesion rather than general
        degeneration.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Scanning electron microscopy examinations demonstrated the collapse of stereocilia
          bundles in IHCs, leaving those from outer hair cells unaffected.
        explanation: >-
          The microscopy result behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results suggest that DFNA25 stems from a failure in the mechano-transduction
        followed by a change in synaptic transfer.
      explanation: >-
        The authors' claim that this model's structural finding is the disease's starting
        point, which is what makes the model informative for this node.
  - target: Reduced Inner Hair Cell Receptor Potential
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The functional counterpart of the bundle collapse, measured as a reduced summating
      potential in an animal whose cochlear amplifier is intact.
    limitations: >-
      The summating potential is a gross cochlear potential and an indirect index of the
      inner hair cell receptor potential rather than a recording from the cell. It is not
      measured clinically in DFNA25 patients, so there is no human comparison.
    readouts:
    - name: Summating potential
      target: Reduced Inner Hair Cell Receptor Potential
      direction: DECREASED
      interpretation: >-
        A smaller receptor-potential correlate from a mechanically normal input, consistent
        with a transduction rather than an amplification deficit.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The summating potential was reduced, indicating the alteration of inner hair cell
          (IHC) receptor potential.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The VGLUT3A224V/A224V mouse model opens the way to a deeper understanding and to a
        potential treatment for DFNA25.
      explanation: >-
        The authors' framing of the model as the system for studying this disease.
  - target: Synaptic Ribbon Enlargement and Altered Sustained Exocytosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Oversized ribbons and a faster sustained release rate, appearing later than the
      transduction findings.
    limitations: >-
      The direction is opposite to the null mouse, where ribbons are described as abnormally
      thin and elongated, so the two models disagree about ribbon morphology as well as about
      the order of events. Whether the change is compensatory or injurious is untested, and
      no human ribbon data exist.
    readouts:
    - name: Synaptic ribbon size by super-resolution microscopy
      target: Synaptic Ribbon Enlargement and Altered Sustained Exocytosis
      direction: INCREASED
      interpretation: >-
        Ribbons are larger than wild type in the knock-in animal.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using super-resolution microscopy, we observed oversized synaptic ribbons and
          patch-clamp membrane capacitance measurements showed an increase in the rate of the
          sustained releasable pool exocytosis.
        explanation: >-
          The imaging result behind this readout.
    - name: Sustained releasable pool exocytosis rate
      target: Synaptic Ribbon Enlargement and Altered Sustained Exocytosis
      direction: INCREASED
      interpretation: >-
        Sustained release is faster, not slower. This is the finding that makes the knock-in
        a model of altered rather than failed synaptic transfer.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          patch-clamp membrane capacitance measurements showed an increase in the rate of the
          sustained releasable pool exocytosis
        explanation: >-
          The capacitance measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, IHC ribbon synapses underwent structural and functional modifications at
        later stages.
      explanation: >-
        Supports the model for this node and fixes its position late in the sequence.
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Progressive hearing loss with intact cochlear amplification, which is the human course
      in outline.
    limitations: >-
      Progression is reproduced; the genetics and the audiology are not. The animal is
      homozygous where the patients are heterozygous, and the heterozygote - the matching
      genotype - shows only a small threshold shift with brainstem response amplitudes
      indistinguishable from wild type, which the authors say contrasts with the dominant
      transmission in the human families. The mouse also keeps its distortion-product emissions
      while the patients lose theirs. The authors' own verdict is that the model "might be
      arguable so far as to consider it as a faithful model of DFNA25". The frequency profile of
      the mouse loss is not matched to the human high-frequency-first pattern in any published
      comparison.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive High-Frequency Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        Thresholds rise progressively with age. The direction is INCREASED because the
        readout is a threshold - worse hearing means more sound is required to evoke a
        response.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mutant mice carrying the VGLUT3-p.A211V variant show progressive hearing loss.
        explanation: >-
          The progressive threshold shift behind this readout, stated in the paper's key
          points.
    - name: Distortion-product otoacoustic emissions
      target: Progressive High-Frequency Sensorineural Hearing Loss
      direction: UNCHANGED
      interpretation: >-
        Cochlear amplification is intact while brainstem responses deteriorate. A negative
        result that separates this from an outer-hair-cell hearing loss.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we showed progressive hearing loss with intact cochlear amplification in the
          VGLUT3A224V/A224V mouse
        explanation: >-
          The emissions measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data show that the VGLUT3A224V/A224V mice phenocopy human progressive hearing
        loss.
      explanation: >-
        The authors' own claim that this model matches the human course, which is what
        licenses using it for the clinical phenotype node.
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the mouse model harbouring the VGLUT3-p.A224V variant mimics a progressive hearing loss
        with auditory neuropathy features, but might be arguable so far as to consider it as a
        faithful model of DFNA25
      explanation: >-
        The same authors' qualification of the sentence above, in the discussion rather than the
        abstract. It is recorded as REFUTE against the link's claim of fidelity, and it is why
        this relationship is PARTIALLY_RECAPITULATES.
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the mild hearing impairment in the VGLUT3+/A224V heterozygotes contrasts with
        the dominant transmission in DFNA25
      explanation: >-
        The zygosity mismatch measured rather than assumed: the genotype that matches a patient
        is only mildly affected in this animal.

diagnosis:

- name: Molecular testing of SLC17A8
  description: >-
    The diagnosis is molecular and there is no audiometric finding that makes it without
    sequencing. SLC17A8 sits on comprehensive hereditary hearing-loss panels; in the reported
    families it has been reached by candidate-gene sequencing after linkage, by targeted
    screening of a dominant cohort, and by whole-exome sequencing. Because penetrance is
    age-dependent, testing an at-risk relative is more informative than audiometry.
  evidence:
  - reference: PMID:28647561
    reference_title: Identification of a novel splicing mutation within SLC17A8 in a Korean family with hearing loss by whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify a causative mutation of HL in this family, we performed whole-exome
      sequencing of 4 family members, 3 affected and an unaffected.
    explanation: >-
      The exome route, in a family where linkage was not available.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we performed a genetic analysis of 87 unrelated Korean patients with
      ADNSHL to determine whether the SLC17A8 gene affects hearing ability in the Korean
      population.
    explanation: >-
      The yield to expect from targeted screening: one novel frameshift across 87 unrelated
      dominant probands. SLC17A8 is a rare cause even within dominant nonsyndromic hearing
      loss.

- name: Variant interpretation as a distinct problem in this gene
  description: >-
    Several SLC17A8 variants reported as suspected causes have not been functionally
    confirmed, and a study set up to test two of them found they behave differently from each
    other: c.616dupA reduced both transcript and protein, while c.824C>A left transcript
    levels alone and produced an abnormal protein. Neither result is a segregation study, so
    the practical point is that an SLC17A8 variant list should not be read as a list of
    established mechanisms.
  evidence:
  - reference: PMID:34145196
    reference_title: "The c.824C>A and c.616dupA mutations in the SLC17a8 gene are associated with auditory neuropathy and lead to defective expression of VGluT3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although several suspected pathogenic mutations of the SLC17a8 gene have been
      identified in humans, few studies have confirmed their pathogenicity.
    explanation: >-
      The interpretation problem stated by the authors as their motivation.
  - reference: PMID:34145196
    reference_title: "The c.824C>A and c.616dupA mutations in the SLC17a8 gene are associated with auditory neuropathy and lead to defective expression of VGluT3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The c.616dupA mutation in the SLC17a8 gene resulted in a significant decrease in
      transcriptional activity of mRNA, and the expression of VGluT3 was also reduced. The
      c.824C>A mutation in the SLC17a8 gene resulted in abnormal VGluT3, although this
      mutation did not affect the transcriptional activity of mRNA.
    explanation: >-
      Two alleles in one gene with two different molecular consequences, measured in cell
      culture.

treatments:

- name: Hearing Aids
  therapeutic_modality: DEVICE
  description: >-
    Amplification is the first-line management of a progressive high-frequency sensorineural
    loss and is what DFNA25 patients receive in practice. No DFNA25-specific outcome has been
    published.

    Whether it should be expected to work well depends on which class this disease turns out to
    be in, which is unresolved. If the null mouse's synaptopathy account holds in humans there
    is a mechanistic reason to expect amplification to underperform its audiometric gain, since
    amplification addresses sensitivity and a failure of neural encoding is not a sensitivity
    problem. If instead the absent patient emissions mean outer hair cell function is involved,
    amplification is addressing the right deficit. Nothing here is asserted either way; the
    question is carried by the emissions knowledge gap.
  treatment_term:
    preferred_term: hearing aid fitting
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid

- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  description: >-
    Biologically plausible in this disease for a specific reason rather than a general one:
    in the null mouse the ascending auditory pathway can still be driven by electrical
    stimulation even though it cannot be driven by sound, so an implant that bypasses the
    inner hair cell synapse has an intact target. Whether that generalises to human carriers
    of a missense allele, in whom the synapse is altered rather than absent, is unknown, and
    no DFNA25 implant outcome has been published.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
    treatment_effect: BYPASSES
    description: >-
      Direct electrical stimulation of the spiral ganglion substitutes for the defective
      inner hair cell synapse.
    evidence:
    - reference: PMID:18674745
      reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        although auditory brainstem responses could be elicited by electrical stimuli
      explanation: >-
        The preserved electrical responsiveness that an implant would exploit. Model evidence
        for a human intervention, so the claim in the description is plausibility rather than
        efficacy.

- name: AAV-mediated VGLUT3 Gene Replacement
  therapeutic_modality: GENE_THERAPY
  description: >-
    Preclinical only, and preclinical in the null mouse rather than in an animal carrying a
    human allele. Cochlear delivery of AAV1-VGLUT3 normalises brainstem response thresholds
    within two weeks and partially reverses the ribbon synapse changes; delivery to
    five-week-old null mice with an AAV8 vector restored auditory function and recovered
    inner hair cells and stereocilia twenty-seven weeks later.

    Two things stand between this and DFNA25. The disease is dominant, so gene addition may
    not be the right strategy if the human allele acts by anything other than loss of
    function, and the mouse work is gene replacement into a null background. And no
    SLC17A8-specific human trial exists.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Altered VGLUT3 Function in the Inner Hair Cell
    treatment_effect: RESTORES
    description: >-
      Restoring VGLUT3 protein to the inner hair cell addresses the molecular lesion rather
      than its consequences - in an animal that has none of the protein to begin with.
    evidence:
    - reference: PMID:22841313
      reference_title: Restoration of hearing in the VGLUT3 knockout mouse using virally mediated gene therapy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Within 2 weeks of AAV1-VGLUT3 delivery, auditory brainstem response (ABR) thresholds
        normalize, along with partial rescue of the startle response.
      explanation: >-
        The functional rescue, in the null mouse.
    - reference: PMID:40841774
      reference_title: Gene therapy restores auditory function and rescues damaged inner hair cells in an aged Vglut3 knockout mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Auditory brainstem response (ABR) testing demonstrated restoration of auditory
        function following gene therapy.
      explanation: >-
        Rescue after the neonatal window, which is the version relevant to a postlingual
        human disease.
  evidence:
  - reference: PMID:22841313
    reference_title: Restoration of hearing in the VGLUT3 knockout mouse using virally mediated gene therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings represent a successful restoration of hearing by gene replacement in
      mice, which is a significant advance toward gene therapy of human deafness.
    explanation: >-
      The authors' own framing of how far the result reaches - toward human therapy, not to
      it.

differential_diagnoses:

- name: Presbycusis and noise-induced hearing loss
  description: >-
    The differential that matters, and the reason DFNA25 is probably underdiagnosed. A
    slowly progressive, bilateral, high-frequency sensorineural loss beginning in adult life
    is the audiometric signature of age-related and noise-related hearing loss, which are
    incomparably more common. The founding clinical study says separating them is difficult,
    and the gene paper opens by noting that dominant sensorineural hearing loss as a class
    closely resembles presbycusis. Family history across generations is the discriminator
    available without sequencing.
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is difficult to differentiate delayed-onset high-frequency sensorineural hearing
      loss inherited as a simple mendelian trait like DFNA25-associated hearing loss from
      that due to noise exposure or presbycusis, disorders that may also have a genetic
      component.
    explanation: >-
      The difficulty stated as the study's own conclusion.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal-dominant sensorineural hearing loss is genetically heterogeneous, with a
      phenotype closely resembling presbycusis, the most common sensory defect associated
      with aging in humans.
    explanation: >-
      The same resemblance stated for the dominant class DFNA25 belongs to.

- name: OTOF-related auditory neuropathy (DFNB9)
  description: >-
    The reference genetic auditory synaptopathy, and the disease DFNA25 would sit beside if
    the presynaptic hypothesis is the right one. Otoferlin and VGLUT3 both act presynaptically
    in the inner hair cell and both null mice show preserved emissions with absent neural
    responses. The clinical presentations separate them without difficulty: DFNB9 is
    recessive, prelingual and severe to profound, DFNA25 is dominant, postlingual and
    initially high-frequency. Separation is by inheritance pattern and sequencing, not by
    audiometry.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses to
      acoustic stimuli, although auditory brainstem responses could be elicited by electrical
      stimuli, and robust otoacoustic emissions were recorded.
    explanation: >-
      The physiological pattern DFNA25's null mouse shares with the OTOF synaptopathies, which
      is what makes DFNB9 the mechanistic differential.

- name: CABP2-related nonsyndromic hearing loss (DFNB93)
  description: >-
    The other synaptic-transmission deafness curated in this knowledge base, and a useful
    contrast rather than a diagnostic difficulty. DFNB93 is recessive, prelingual and
    moderate-to-severe, and its lesion is in the presynaptic calcium channel's regulation
    rather than in vesicle filling. It is included here because the two entries have to agree
    about what is established at the ribbon synapse, and the point is not that DFNA25 lacks
    the human evidence DFNB93 has - it is that the two have the same kind of evidence pointing
    opposite ways. DFNB93 has a human otoacoustic-emission observation showing emissions
    present, which supports its synaptopathy classification. DFNA25 has one showing emissions
    absent, which is why it is not classified that way here.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified SLC17A8, which encodes the vesicular glutamate transporter-3
      (VGLUT3), as the gene responsible for DFNA25, an autosomal-dominant form of
      progressive, high-frequency nonsyndromic deafness.
    explanation: >-
      The dominant, postlingual, high-frequency phenotype that distinguishes DFNA25 from the
      recessive prelingual DFNB93 at the bedside.

discussions:

- discussion_id: mismatch_zygosity_of_the_dfna25_mouse_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous SLC17A8 Variant
  - animal_models#Mouse
  prompt: >-
    Does either mouse model DFNA25, when both are homozygous and the heterozygote - the
    genotype a patient actually has - is only mildly affected?
  rationale: >-
    This is not a fidelity quibble; it is a mismatch about the genetic mechanism itself. Both
    published models are homozygous: the Slc17a8 null, which is congenitally and profoundly
    deaf, and the A224V knock-in, which is progressively deaf. The heterozygous knock-in has
    been phenotyped, and it is the genotype that corresponds to a DFNA25 carrier. It shows a
    small threshold shift that reaches statistical significance but leaves brainstem response
    amplitudes indistinguishable from wild-type littermates - which the authors themselves say
    contrasts with the dominant transmission seen in the human families.

    Their explanation is that the stereocilia change is slow relative to a mouse lifespan, so
    a mouse simply does not live long enough to reach the human phenotype from one allele.
    That is plausible and untested. The alternative is that the human allele does something in
    a human inner hair cell that it does not do in a mouse one, in which case the homozygous
    findings are a dose artefact.

    The stake is therapeutic. AAV gene addition rescues the null mouse, and gene addition is
    the obvious translation. But it is the right strategy only if the human allele acts by
    loss of function. If p.A211V is a dominant negative or a toxic gain of function, adding
    wild-type VGLUT3 to a cell that already has a working copy may not help, and an
    allele-selective knockdown would be the rational target instead. Nothing published
    distinguishes those, which is also why the trigger node leaves
    `functional_impact_category` empty. The authors' own summary is that the knock-in "might
    be arguable so far as to consider it as a faithful model of DFNA25".
  proposed_experiments:
  - experiment_id: dfna25_aged_heterozygous_knockin
    name: Lifespan-long auditory phenotyping of heterozygous VGLUT3 A224V mice
    description: >-
      Follow VGLUT3+/A224V mice to the end of their natural lifespan with serial brainstem
      responses, distortion-product emissions and inner hair cell bundle morphology, rather
      than stopping at six months. If the published mild phenotype is a matter of mouse
      lifespan, the deficit should continue to widen against age-matched wild-type
      littermates; if it plateaus, one allele is not sufficient in a mouse.
    would_support:
    - pathophysiology#Heterozygous SLC17A8 Variant
    supporting_outcome:
    - >-
      The heterozygous deficit keeps widening with age and the bundles progressively distort,
      which would make the mouse an under-aged version of the human disease rather than a
      different one, and would license reading the homozygous mechanism across to patients.
    refuting_outcome:
    - >-
      The heterozygous deficit plateaus and the bundles stabilise, which would mean one copy
      of the variant allele is tolerated in a mouse and is not in a human - leaving the
      dominant mechanism of DFNA25 unmodelled by either animal.

- discussion_id: gap_why_patient_emissions_are_absent
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Absent Otoacoustic Emissions
  - mechanistic_hypotheses#presynaptic_glutamate_loading_failure
  prompt: >-
    Are otoacoustic emissions absent in DFNA25 patients because of the disease, or because of a
    lifetime of noise exposure?
  rationale: >-
    This is the question that decides what class DFNA25 belongs to, and it is not a technicality
    about a test.

    Every model says emissions should be preserved. The Slc17a8 null has robust emissions, the
    A224V knock-in has decent distortion-product emissions, and VGLUT3-null data are taken as
    evidence that VGLUT3 has no role in cochlear amplification at all. In the patients, emissions
    are absent. If that is the disease, then outer hair cell function is involved, DFNA25 is not
    an auditory synaptopathy, and the knock-in study's conclusion - that this is a progressive
    hearing loss rather than an auditory neuropathy - stands.

    But DFNA25 is a postlingual disease of adults with a high-frequency audiogram, which is
    exactly the population and exactly the audiometric shape in which acquired noise damage is
    hardest to exclude. The same authors raise noise as the alternative explanation and do not
    test it. If noise is the answer, the underlying disease could still be a synaptopathy whose
    audiological signature has been erased by an acquired overlay - and the entry would be
    filing it in the wrong class on the strength of a confounded measurement.

    Nothing about DFNA25 makes noise exposure implausible; the disease is diagnostically
    confusable with noise-induced hearing loss in the first place, which is recorded as its main
    differential. The authors propose the discriminating experiment themselves.
  proposed_experiments:
  - experiment_id: dfna25_noise_vulnerability_by_allele_dose
    name: Noise vulnerability in mice carrying one or two VGLUT3-p.A224V alleles
    description: >-
      Expose wild-type, heterozygous and homozygous A224V mice to a controlled acoustic
      overexposure and compare distortion-product emission loss and threshold shift against
      unexposed littermates. This is the experiment the knock-in authors name as necessary to
      determine whether acoustic injury accounts for the discrepancy between mouse and patient
      emissions.
    would_support:
    - phenotypes#Absent Otoacoustic Emissions
    supporting_outcome:
    - >-
      Variant-carrying mice lose emissions disproportionately after noise, which would mean the
      absent emissions in patients are an acquired overlay on a genetic synaptopathy, would keep
      DFNA25 inside the auditory neuropathy spectrum, and would make hearing protection a
      disease-modifying intervention rather than general advice.
    refuting_outcome:
    - >-
      Variant-carrying mice are no more noise-vulnerable than wild type, which would leave the
      absent patient emissions as a feature of the disease itself, confirm that outer hair cell
      function is involved, and settle DFNA25 outside the synaptopathies.

- discussion_id: gap_where_the_dfna25_lesion_starts
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#presynaptic_glutamate_loading_failure
  - mechanistic_hypotheses#a211v_mechanotransduction_first
  prompt: >-
    How does a vesicular glutamate transporter variant collapse the inner hair cell stereocilia
    bundle?
  rationale: >-
    The knock-in mouse's primary finding is that inner hair cell bundles fuse and collapse while
    outer hair cell bundles are spared, and no proposed mechanism survives contact with what is
    already known about the protein. VGLUT3 is not present in inner hair cell stereocilia. Losing
    VGLUT3 entirely leaves the transducer working, with an intact hair cell receptor potential.
    So the variant is doing something the null does not.

    The paper's own candidate is a misfolding-and-aggregation model, in which variant protein
    accumulates near the nucleus and jams the traffic that maintains the stereocilia machinery -
    borrowing the mechanism established for DIAPH3 in the auditory neuropathy AUNA1. It then
    argues against its own candidate on two counts: the same point mutation reduces VGLUT3 in
    nerve terminals while leaving the soma unchanged, which is the opposite of somatic
    accumulation, and a structural model shows alanine-to-valine barely perturbs the protein.

    This matters beyond tidiness. The two hypothesis groups in this entry diverge at exactly this
    step, and a gene therapy designed against the synaptic account would not address a
    stereociliary lesion.
  proposed_experiments:
  - experiment_id: dfna25_vglut3_localisation_in_knockin_hair_cells
    name: Subcellular localisation and turnover of VGLUT3-p.A224V in inner hair cells
    description: >-
      Track variant VGLUT3 in knock-in inner hair cells by immunogold electron microscopy and
      pulse-chase, testing directly whether it accumulates in the soma or apical compartment,
      whether proteostasis markers are engaged, and whether the cuticular plate cytoskeleton is
      disturbed before the bundles collapse.
    would_support:
    - mechanistic_hypotheses#a211v_mechanotransduction_first
    supporting_outcome:
    - >-
      Variant protein accumulates with an engaged proteostasis response and cuticular-plate
      disturbance preceding bundle collapse, which would supply the missing mechanism and
      establish the transduction account as the primary one.
    refuting_outcome:
    - >-
      Variant protein localises normally and no proteostasis or cytoskeletal change precedes the
      bundle collapse, which would leave the stereocilia phenotype unexplained and raise the
      possibility that it is a strain or background effect of this particular mouse line rather
      than a consequence of the allele.

- discussion_id: gap_dfna25_allele_class_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#SLC17A8
  prompt: >-
    Do the truncating and splice SLC17A8 alleles cause the same disease as the missense
    founder allele?
  rationale: >-
    The entry treats SLC17A8 as one causative gene because that is how the gene-disease
    relationship is curated, but the alleles do not obviously share a mechanism. p.A211V is a
    conserved missense that leaves vesicular glutamate accumulation intact where it has been
    tested. p.M206Nfs*4 truncates at residue 209 and removes most of the transmembrane
    domains. c.763+1G>T abolishes a splice donor. In vitro work on two further suspected
    alleles found one reduced transcript and protein while the other left transcript alone
    and produced an abnormal protein.

    If the truncating alleles are simple loss of function, then a heterozygous truncating
    carrier is functionally a heterozygous null - and heterozygous null mice hear normally.
    Either mice and humans differ in their tolerance of half-dose VGLUT3, or the truncating
    alleles are doing something other than reducing dosage, or their pathogenicity rests on
    smaller families than the founder allele's. Each of those has a different consequence for
    variant interpretation in a diagnostic laboratory.
  proposed_experiments:
  - experiment_id: dfna25_allele_class_audiogram_comparison
    name: Audiometric comparison of missense against truncating SLC17A8 carriers
    description: >-
      Collect audiograms and ages at onset across all published SLC17A8 heterozygotes and
      compare the founder missense families against the frameshift and splice-donor families,
      testing whether onset, progression rate and audiometric shape differ by allele class.
    would_support:
    - genetic#SLC17A8
    supporting_outcome:
    - >-
      The allele classes are audiometrically indistinguishable, supporting a single gene-level
      disease entity and justifying the current single causative-gene record.
    refuting_outcome:
    - >-
      Truncating carriers are milder, later or less penetrant than missense carriers, which
      would mean DFNA25 as curated conflates two mechanisms and that a truncating SLC17A8
      variant should not be reported with the same prognosis as the founder allele.

notes: >-
  Named entity check. SLC17A8 causes one human disease, and nothing in the knowledge base
  mentioned SLC17A8 or VGLUT3 before this entry. The gene is not a homonym trap in the way
  some are, but two neighbouring confusions were checked and excluded. VGLUT3 has a large
  literature in the central nervous system - striatal cholinergic interneurons, hippocampal
  circuits, tinnitus, optic neuropathy - which is about the same protein in different cells
  and is not this disease; the deep-research run for this entry surfaced one such citation
  and it was not used. And the acronym ABR in the auditory literature is the auditory
  brainstem response, not the ABR gene; the Named Entity Confusion preflight flagged "ABR"
  as a rival gene at 39% of SLC17A8's mention count for exactly that reason, and it is a
  false positive.

  Relationship to Auditory Neuropathy and to DFNB93. This was the substantive question on the
  claim issue, and it has a positive answer rather than a cautious one: DFNA25 is not recorded
  as a subtype of the Auditory Neuropathy entry because the human audiology argues against the
  classification, not merely because it is missing.

  The signature that defines that class is preserved otoacoustic emissions with an absent or
  desynchronised brainstem response. Both mouse models have preserved emissions. The patients
  do not - emissions are reported absent in p.A211V carriers - and the knock-in study draws the
  conclusion explicitly: DFNA25 is more likely a progressive hearing loss in humans than an
  auditory neuropathy. Filing it under Auditory Neuropathy would contradict the only published
  human audiological measurement bearing on the question. The Auditory Neuropathy entry's
  has_subtypes list is populated by entities where the classification rests on a human clinical
  finding (OTOF, DIAPH3, ATP11A, AIFM1, TMEM43), and here the human clinical finding points the
  other way.

  That conclusion is recorded with the qualification its own authors attach to it. Absent
  emissions may instead reflect accumulated noise exposure across a lifetime, in a middle-aged
  cohort whose audiogram is already indistinguishable from noise damage. The alternative is
  curated as a NO_EVIDENCE evidence item and as an open knowledge gap carrying the
  discriminating experiment the authors themselves name - noise vulnerability in mice carrying
  one or two variant alleles.

  This is exactly where DFNB93 differs, and it is how the two entries end up agreeing about the
  ribbon synapse. DFNB93 has a human emissions observation showing emissions PRESENT, which is
  why that entry asserts its synaptopathy classification in its pathophysiology. DFNA25 has a
  human emissions observation showing emissions ABSENT, which is why this entry asserts the
  dissociation for the mouse only and curates the human finding as a phenotype that refutes it.
  Each entry states which species each half of its claim was measured in, and neither borrows
  the other's classification.

  The one human-facing hook to the auditory neuropathy literature that does exist is
  PMID:34145196, which characterises two suspected SLC17A8 alleles under the heading of
  auditory neuropathy. It is cited here for what it measured - two alleles with two different
  molecular consequences in cell culture - and not for the classification in its title, which
  it does not test.

  Why this is a Disease and not a subtype. MONDO:0011568 is bound nowhere in the knowledge
  base and DFNA25 has its own OMIM phenotype entry, its own DFNA locus number and a ClinGen
  Definitive gene-disease assertion of its own. The pathograph is gene-specific down to the
  vesicular transporter and the two competing models of where the lesion starts. There is no
  candidate parent entry that already binds SLC17A8, so no coverage exists to duplicate.

  Evidence grading. Every mechanistic step in this entry is mouse, and every one of those
  items is graded MODEL_ORGANISM. The human anchors are the audiometric phenotype, the
  inheritance pattern, the alleles and the penetrance observations - four papers, three
  families and one screening cohort. Human cochlear tissue is not obtainable, so this
  proportion is a permanent feature of the evidence base rather than an incomplete curation.
  The autaptic-neuron transport experiments and the cell-culture expression work are graded
  IN_VITRO even where they appear in clinical-genetics papers, because evidence_source
  describes the experiment.

  What is deliberately absent. No prevalence record: nine probands worldwide, no population
  study, and any prevalence_class here would be a guess rather than a band. No frequency
  band on any phenotype, for the same reason - there is no denominator that is DFNA25. No
  progression record, because no serial-audiogram data have been published since the 2003
  study of a single pre-gene family and that study reports onset rather than a rate. No
  clinical_trials, because none exist for this gene. No datasets, because a SLC17A8 or VGLUT3
  omics search returns the central-nervous-system literature rather than anything cochlear
  and disease-specific.

  One provenance caveat on the human otoacoustic-emission finding, which is load-bearing for
  the classification above. It reaches this entry through the discussion of the 2021 knock-in
  paper, which attributes it to the 2003 audiological study of the founding family. That 2003
  abstract does not mention emissions and only the abstract is cached, so the primary
  measurement could not be quoted directly. The entry therefore cites the 2021 paper for what
  it states, and the phenotype carries no frequency band because the underlying denominator is
  a single family described at second hand. A curator with full-text access to the 2003 paper
  should confirm the numbers.


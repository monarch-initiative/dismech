- name: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
  biological_scale: TISSUE
  description: >-
    The convergence point of both hypothesis groups, and the finding that puts DFNA25 in the
    same conversation as the auditory synaptopathies - in the models, at least. In the null
    mouse, sound-evoked
    auditory-nerve responses are absent while otoacoustic emissions are robust, and brainstem
    responses can still be evoked electrically - so the cochlear amplifier and the ascending
    pathway both work and the step between them does not. In the knock-in mouse the same
    dissociation appears in progressive form: brainstem responses deteriorate with age while
    distortion-product emissions stay intact.

    This is a mouse finding, and in the patients it does not hold. Otoacoustic emissions are
    reported absent in carriers of the p.A211V allele - the opposite of both mice - which is
    why the knock-in study concludes that DFNA25 in humans is more likely a progressive
    hearing loss than an auditory neuropathy. The node is therefore curated as what the models
    show, not as a human phenotype, and the absent-emissions finding is curated separately
    under phenotypes.

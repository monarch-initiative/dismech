mechanistic_hypotheses:
- hypothesis_group_id: presynaptic_glutamate_loading_failure
  hypothesis_label: Presynaptic vesicular glutamate loading failure
  status: CANONICAL
  description: >-
    The account that follows from what VGLUT3 does. Without the transporter the inner hair
    cell still fuses vesicles on schedule, but the vesicles are empty, so the auditory nerve
    is never driven while the outer hair cells keep amplifying. This is what the Slc17a8 null
    mouse shows and it is the reason DFNA25 is discussed alongside the auditory
    synaptopathies. It has two limitations. The null mouse is homozygous and congenitally
    deaf, whereas DFNA25 patients are heterozygous and lose hearing slowly in adult life. And
    the audiological prediction it makes - preserved otoacoustic emissions - is contradicted
    in the patients, whose emissions are absent. It is kept as the canonical group because it
    is what the transporter does and what the null animal shows, not because the human
    audiology supports it.
- hypothesis_group_id: a211v_mechanotransduction_first
  hypothesis_label: Stereociliary mechanotransduction failure preceding synaptic change
  status: EMERGING
  description: >-
    The account that follows from the mouse carrying the human allele rather than a deletion.
    In the VGLUT3 A224V knock-in the inner hair cell hair bundles collapse and the summating
    potential - the receptor potential of the inner hair cell - falls, while cochlear
    amplification stays intact; the ribbon changes come afterwards. On this reading the
    primary lesion in DFNA25 is the transduction apparatus and the synapse is a downstream
    casualty, which would place the disease outside the synaptopathies rather than inside
    them. It is one model, homozygous for an allele patients carry heterozygously, so this is
    recorded as emerging rather than established.

pathophysiology:

- name: Heterozygous SLC17A8 Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding and best-characterised allele is the missense c.632C>T, p.A211V, which
    segregated with deafness in two apparently unrelated families sharing a distant common
    ancestor and was absent from 267 controls. The alanine is conserved across species and
    across all three human VGLUT paralogues.

    Later reported dominant alleles are of a different kind: a frameshift, p.M206Nfs*4,
    predicted to truncate the protein at residue 209 and remove transmembrane domains 5 to
    12, and a canonical splice-donor variant, c.763+1G>T. Whether these act by the same
    route as the missense allele is not established, and the entry does not assume it.
  genetic_context:
    gene:
      preferred_term: SLC17A8
      term:
        id: hgnc:20151
        label: SLC17A8
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous in every reported family. `functional_impact_category` is deliberately
      left empty: heterozygous Slc17a8 knockout mice hear normally while heterozygous human
      p.A211V carriers do not, so the missense allele is not behaving as a simple
      loss-of-function, and no dominant-negative or gain-of-function experiment has been
      done to license one of the narrower values instead. The truncating and splice alleles
      may well be loss-of-function, but they sit in the same slot on the same node and the
      category is single-valued.
  downstream:
  - target: Altered VGLUT3 Function in the Inner Hair Cell
    causal_link_type: DIRECT
    description: >-
      Every proposed mechanism for this disease runs through the transporter that the
      variant sits in.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two unrelated families, a heterozygous missense mutation, c.632C-->T (p.A211V), was
      found to segregate with DFNA25 deafness and was not present in 267 controls.
    explanation: >-
      The founding allele, its zygosity, its segregation and its control screening.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The A211 residue is conserved in VGLUT3 across species and in all human VGLUT subtypes
      (VGLUT1-3), suggesting an important functional role.
    explanation: >-
      The conservation argument the founding paper rests the missense call on.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel frameshift mutation, p.M206Nfs*4, in which methionine is changed to

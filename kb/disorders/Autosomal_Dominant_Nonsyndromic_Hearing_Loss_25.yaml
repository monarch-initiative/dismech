name: Autosomal Dominant Nonsyndromic Hearing Loss 25
creation_date: "2026-09-01T20:30:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 25
  term:
    id: MONDO:0011568
    label: autosomal dominant nonsyndromic hearing loss 25
synonyms:
- DFNA25
- deafness, autosomal dominant 25
- autosomal dominant nonsyndromic deafness 25
- SLC17A8 autosomal dominant nonsyndromic deafness
- autosomal dominant nonsyndromic deafness caused by mutation in SLC17A8
description: >-
  SLC17A8-related autosomal dominant nonsyndromic hearing loss is usually progressive and predominantly
  high-frequency, with variable onset and age-dependent penetrance. VGLUT3 loads glutamate into inner
  hair cell synaptic vesicles. Human segregation establishes the gene-disease relationship, but the dominant
  molecular mechanism remains unresolved. Homozygous null mice lack sound-evoked afferent signaling; homozygous
  A224V knock-in mice, modeling human A211V, develop inner hair cell bundle disruption followed by ribbon
  and exocytosis changes. Heterozygous knock-in mice have a much milder phenotype. These models establish
  complementary experimental findings rather than interchangeable accounts of human disease. The limited
  human otoacoustic-emission data do not settle whether DFNA25 belongs within the auditory neuropathy
  spectrum.
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


  - target: Secondary Deafferentation of the Inner Hair Cell
    causal_link_type: DIRECT
    description: >-
      An afferent synapse that is never driven does not survive indefinitely, and in the null
      mouse the synapses, the neurons and the efferent endings all decline later.
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      The clinical phenotype is what an auditory nerve that is inadequately driven produces.
  evidence:

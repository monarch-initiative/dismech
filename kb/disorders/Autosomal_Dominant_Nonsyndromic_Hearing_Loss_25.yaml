mechanistic_hypotheses:
- hypothesis_group_id: presynaptic_glutamate_loading_failure
  hypothesis_label: Presynaptic vesicular glutamate loading failure
  status: CANONICAL
  description: >-
    VGLUT3 deficiency prevents vesicular glutamate loading and auditory afferent activation in homozygous
    null mice despite preserved vesicle fusion and cochlear amplification. This is an established null-model
    mechanism and a candidate contributor to human SLC17A8 disease. It does not establish haploinsufficiency
    or uniform transport loss for dominant variants: A211V retains transport in tested heterologous systems,
    and human onset and severity vary.
- hypothesis_group_id: a211v_mechanotransduction_first
  hypothesis_label: Stereociliary mechanotransduction failure preceding synaptic change
  status: EMERGING
  description: >-
    Homozygous A224V mice develop inner hair cell stereocilia disruption and reduced summating potentials
    before marked ribbon enlargement and increased sustained exocytosis. This supports a mechanotransduction-first
    hypothesis in that model. Temporal order does not establish that the bundle lesion causes the synaptic
    changes, and the dominant human mechanism remains unconfirmed.

pathophysiology:
- name: Heterozygous SLC17A8 Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding c.632C>T (p.A211V) variant segregated in two families with evidence of distant shared
    ancestry and was absent from 267 controls. Later reports include c.616dupA (p.M206Nfs*4) and c.763+1G>T.
    The 2016 frameshift report sequenced one proband from an affected pedigree; it did not demonstrate
    segregation across all eight affected relatives. Predicted truncation and splice disruption do not
    establish a shared dominant mechanism.
  genetic_context:
    gene:
      preferred_term: SLC17A8
      term:
        id: hgnc:20151
        label: SLC17A8
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Reported disease-associated alleles are heterozygous. The entry does not assign one functional-impact
      category across missense, frameshift and splice variants: human dominance and normal heterozygous-null
      mouse hearing do not by themselves distinguish dosage loss, dominant-negative effects or other mechanisms.
  downstream:
  - target: Altered VGLUT3 Function in the Inner Hair Cell
    causal_link_type: DIRECT
    description: >-
      Every proposed mechanism for this disease runs through the transporter that the
      variant sits in.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two unrelated families, a heterozygous missense mutation, c.632C-->T (p.A211V), was
      found to segregate with DFNA25 deafness and was not present in 267 controls.
    explanation: >-
      The founding allele, its zygosity, its segregation and its control screening.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The A211 residue is conserved in VGLUT3 across species and in all human VGLUT subtypes
      (VGLUT1-3), suggesting an important functional role.
    explanation: >-
      The conservation argument the founding paper rests the missense call on.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel frameshift mutation, p.M206Nfs*4, in which methionine is changed to
      asparagine at amino acid position 206, resulted in a termination codon at amino acid
      position 209.
    explanation: >-
      The 2016 report identified a frameshift in one sequenced proband and predicted truncation; it did
      not show cosegregation in all affected relatives.
  - reference: PMID:28647561
    reference_title: Identification of a novel splicing mutation within SLC17A8 in a Korean family with hearing loss by whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel splicing mutation, c.763+1G>T, in the solute carrier family 17, member 8
      (SLC17A8) gene was identified in the patients, and the genotypes of the mutation were
      co-segregated with the phenotype of HL.
    explanation: >-
      The splice-donor allele and its co-segregation in a three-generation dominant family.

- name: Altered VGLUT3 Function in the Inner Hair Cell
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    VGLUT3 supports glutamate loading into inner hair cell synaptic vesicles. Null mice lack functional
    auditory afferent transmission, but human A211V does not abolish uptake or quantal signaling in tested
    heterologous/autaptic preparations. Central-terminal protein reduction in the knock-in cannot be assumed
    in cochlear cells: the 2021 study found comparable inner hair cell VGLUT3 immunofluorescence and distribution
    between genotypes. Variant-specific effects therefore remain important.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: vesicular L-glutamate transport by VGLUT3
    term:
      id: GO:0005313
      label: L-glutamate transmembrane transporter activity
  biological_processes:
  - preferred_term: glutamate loading into inner hair cell synaptic vesicles
    term:
      id: GO:0098700
      label: neurotransmitter loading into synaptic vesicle
  cellular_components:
  - preferred_term: inner hair cell synaptic vesicle
    term:
      id: GO:0008021
      label: synaptic vesicle
  downstream:
  - target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    hypothesis_groups:
    - presynaptic_glutamate_loading_failure
    description: >-
      The direct consequence of an unfilled vesicle, and the route the null mouse takes.
  - target: Inner Hair Cell Stereocilia Bundle Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      The route the allele-matched knock-in mouse takes. It is marked INDIRECT because no
      mechanism connecting an altered vesicular transporter to hair-bundle architecture has
      been demonstrated; the knock-in shows the bundles collapse, not why.
  - target: Synaptic Ribbon Enlargement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      The A224V genotype is associated with this later synaptic alteration; the intermediates and relationship
      to the early bundle defect remain unresolved.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, IHC ribbon synapses underwent structural and functional modifications at later stages.
      explanation: >-
        The genotype-associated synaptic findings do not prove that reduced receptor potential caused
        them.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Increased Sustained Inner Hair Cell Exocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      The A224V genotype is associated with this later synaptic alteration; the intermediates and relationship
      to the early bundle defect remain unresolved.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        patch-clamp membrane capacitance measurements showed an increase in the rate of the sustained
        releasable pool exocytosis
      explanation: >-
        The genotype-associated synaptic findings do not prove that reduced receptor potential caused
        them.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cochlea, VGLUT3 accumulates glutamate in the synaptic vesicles of the sensory
      inner hair cells (IHCs) before releasing it onto receptors of auditory-nerve terminals.
    explanation: >-
      The normal function of the protein, which is what the disease removes or alters.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      among its isoforms (VGLUT1-3), only VGLUT3 is expressed selectively in the inner hair
      cells (IHCs)
    explanation: >-
      Inner hair cell expression provides a basis for nonredundant cochlear function. It does not explain
      the absence of extra-auditory findings in every carrier.
    quote_role: BACKGROUND
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This variation does not impair the glutamate vesicular accumulation, neither the
      quantal release nor the quantal content in hippocampal autaptic neurons
    explanation: >-
      A negative result at the level of transport itself, which is why this entry does not
      assert that the human missense allele simply stops glutamate loading. Graded IN_VITRO
      because the measurement is in cultured autaptic neurons.

    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the p.A224V variant does not disturb the VGLUT3 targeting within the hair cell cytoplasm.
    explanation: >-
      Semi-quantitative mouse cochlear immunofluorescence; this limits extrapolation from reduced central-terminal
      expression.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
  biological_scale: CELLULAR
  description: >-
    In the Ruel Slc17a8-null line, calcium-triggered vesicle turnover was preserved at two weeks and surviving
    ribbons had a normal ultrastructural appearance at three months, while auditory afferent signaling
    failed. Other null-model studies reported thin or elongated ribbons. The findings differ by study
    and preparation; they do not establish universally normal ribbon morphology or uniform transport loss
    in dominant human variants.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: glutamate secretion at the inner hair cell afferent synapse
    modifier: DECREASED
    term:
      id: GO:0014047
      label: glutamate secretion
  downstream:
  - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
    causal_link_type: DIRECT
    hypothesis_groups:
    - presynaptic_glutamate_loading_failure
    description: >-
      An afferent terminal that receives no transmitter does not fire, however well the
      cochlea in front of it is working.
  evidence:
  - reference: PMID:18215623
    reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We now report that mice lacking VGLUT3 are profoundly deaf due to the absence of
      glutamate release from hair cells at the first synapse in the auditory pathway.
    explanation: >-
      The release failure stated directly, and its location at the first auditory synapse.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ca(2+)-triggered synaptic-vesicle turnover was normal in IHCs of Slc17a8 null mice when
      probed by membrane capacitance measurements at 2 weeks of age.
    explanation: >-
      The deliberate negative result that localises the defect to vesicle content rather than
      to exocytosis. Without it the node would be indistinguishable from a fusion defect.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that deafness in Slc17a8-deficient mice is due to a specific defect of
      vesicular glutamate uptake and release and that VGLUT3 is essential for auditory coding
      at the IHC synapse.
    explanation: >-
      The founding paper's own conclusion about the null animal.

- name: Inner Hair Cell Stereocilia Bundle Disruption
  biological_scale: CELLULAR
  description: >-
    Homozygous A224V mice show progressive inner hair cell bundle fusion and collapse with relative preservation
    of outer hair cell bundles. VGLUT3 is not localized to stereocilia, and the molecular connection is
    unresolved. Protein misfolding/trafficking effects and interaction with the C57BL/6J Cdh23 background
    are hypotheses. Comparable inner hair cell immunofluorescence argues against gross protein accumulation
    but cannot exclude altered turnover or proteostasis.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: inner hair cell stereocilium bundle organization
    modifier: DECREASED
    term:
      id: GO:0060122
      label: inner ear receptor cell stereocilium organization
  downstream:
  - target: Reduced Inner Hair Cell Receptor Potential
    causal_link_type: DIRECT
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      Bundle disruption and reduced summating potential support a mechanotransduction defect in the same
      homozygous model; direct mechanotransducer-current impairment was not measured.
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Scanning electron microscopy examinations demonstrated the collapse of stereocilia
      bundles in IHCs, leaving those from outer hair cells unaffected.
    explanation: >-
      The bundle finding and its restriction to inner hair cells.

- name: Reduced Inner Hair Cell Receptor Potential
  biological_scale: CELLULAR
  description: >-
    The summating potential is the gross cochlear correlate of the inner hair cell receptor
    potential, and it is reduced in the knock-in mouse. Because cochlear amplification is
    intact in the same animals, a smaller receptor potential is being generated from a normal
    mechanical input - which is what a transduction defect in the inner hair cell looks like
    from outside.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: mechanotransduction in the inner hair cell hair bundle
    modifier: DECREASED
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
  downstream:
  - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
    causal_link_type: DIRECT
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      Reduced inner hair cell receptor potential is proposed to reduce afferent drive. The model shows
      reduced summating and compound action potentials, but does not directly quantify sound-evoked glutamate
      release.
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The summating potential was reduced, indicating the alteration of inner hair cell (IHC)
      receptor potential.
    explanation: >-
      The measurement and the authors' own interpretation of it.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that DFNA25 stems from a failure in the mechano-transduction
      followed by a change in synaptic transfer.
    explanation: >-
      The ordering claim that this hypothesis group is built on, stated by the authors as a
      suggestion rather than a demonstration - which is why the group is EMERGING.

- name: Synaptic Ribbon Enlargement
  biological_scale: CELLULAR
  description: >-
    Homozygous A224V inner hair cell ribbons enlarge markedly at four to six months, with preserved ribbon
    and synapse counts in the sampled region. This structural change follows early bundle abnormalities.
    Its causal contribution to hearing loss, including whether it is compensatory, remains unresolved.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, synaptic ribbons became abnormally elongated in knock‐in mice
    explanation: >-
      Mouse cochlear imaging supports ribbon enlargement, not a measured increase in glutamate secretion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Increased Sustained Inner Hair Cell Exocytosis
  biological_scale: CELLULAR
  description: >-
    At six months, freshly dissected homozygous A224V inner hair cells show increased sustained exocytic
    capacitance responses to long depolarizations, with preserved calcium currents and readily releasable
    pool responses. Capacitance measures membrane fusion rather than vesicular glutamate content or afferent
    neurotransmission. The change may reflect compensation or extrasynaptic release; it is not established
    as a cause of hearing loss.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      patch-clamp membrane capacitance measurements showed an increase in the rate of the sustained releasable
      pool exocytosis
    explanation: >-
      Ex-vivo patch-clamp measurements in isolated mouse organs of Corti; membrane fusion does not determine
      glutamate quantal content.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
  biological_scale: TISSUE
  description: >-
    Slc17a8-null mice lack sound-evoked auditory responses while retaining otoacoustic emissions and electrically
    evoked brainstem responses. Homozygous A224V mice show progressive auditory threshold elevation with
    preserved emissions. Human otoacoustic-emission data are sparse and differ from these model findings;
    this node records experimental physiology rather than a universal human diagnostic signature.
  cell_types:
  - preferred_term: type 1 spiral ganglion neuron
    term:
      id: CL:4023115
      label: type 1 spiral ganglion neuron
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:

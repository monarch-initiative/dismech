  downstream:
  - target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    hypothesis_groups:
    - presynaptic_glutamate_loading_failure
    description: >-
      The direct consequence of an unfilled vesicle, and the route the null mouse takes.
  - target: Inner Hair Cell Stereocilia Bundle Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      The route the allele-matched knock-in mouse takes. It is marked INDIRECT because no
      mechanism connecting an altered vesicular transporter to hair-bundle architecture has
      been demonstrated; the knock-in shows the bundles collapse, not why.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cochlea, VGLUT3 accumulates glutamate in the synaptic vesicles of the sensory
      inner hair cells (IHCs) before releasing it onto receptors of auditory-nerve terminals.
    explanation: >-
      The normal function of the protein, which is what the disease removes or alters.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      among its isoforms (VGLUT1-3), only VGLUT3 is expressed selectively in the inner hair
      cells (IHCs)
    explanation: >-
      Why there is no paralogue to compensate in the inner hair cell, and therefore why the
      phenotype is cochlear and nonsyndromic.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This variation does not impair the glutamate vesicular accumulation, neither the
      quantal release nor the quantal content in hippocampal autaptic neurons
    explanation: >-
      A negative result at the level of transport itself, which is why this entry does not
      assert that the human missense allele simply stops glutamate loading. Graded IN_VITRO
      because the measurement is in cultured autaptic neurons.

- name: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
  biological_scale: CELLULAR
  description: >-
    In the Slc17a8 null cochlea the machinery of release is intact and the cargo is not.
    Calcium-triggered vesicle turnover measured by membrane capacitance is normal at two
    weeks of age, and the ribbon synapses that survive to three months look normal under the
    electron microscope. What is missing is the glutamate, so the vesicles fuse and the
    afferent terminal is not driven.

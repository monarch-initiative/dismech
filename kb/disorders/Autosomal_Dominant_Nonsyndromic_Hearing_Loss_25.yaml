  downstream:
  - target: Synaptic Ribbon Enlargement and Altered Sustained Exocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      The knock-in paper orders these two findings in time - transduction first, synaptic

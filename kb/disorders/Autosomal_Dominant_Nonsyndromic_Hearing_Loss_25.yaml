    explanation: >-
      The founding paper's own conclusion about the null animal.

- name: Inner Hair Cell Stereocilia Bundle Disruption
  biological_scale: CELLULAR
  description: >-
    In the knock-in mouse carrying the human allele, scanning electron microscopy shows the
    inner hair cell stereocilia bundles collapsing and fusing while the outer hair cell
    bundles are left alone. That selectivity matters: it is the same cell-type restriction as
    the transporter's expression, and it means the finding is not general hair-cell
    degeneration.

    No mechanism links a vesicular glutamate transporter to hair-bundle architecture, and the
    finding is surprising on its own terms: VGLUT3 is not present in inner hair cell
    stereocilia, and losing VGLUT3 altogether leaves the transducer working, with an intact
    hair cell receptor potential. The paper's own candidate explanation - that the variant
    protein misfolds and aggregates, disrupting traffic towards the stereocilia machinery - is
    argued against by two earlier results it cites: the point mutation reduces VGLUT3 in nerve
    terminals while leaving the soma unchanged, and a structural model shows that swapping
    alanine for valine barely changes the protein. The node is curated because the
    allele-matched model reports it as the primary lesion, not because the connection is
    understood.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: inner hair cell stereocilium bundle organization
    modifier: DECREASED
    term:
      id: GO:0060122
      label: inner ear receptor cell stereocilium organization
  downstream:
  - target: Reduced Inner Hair Cell Receptor Potential
    causal_link_type: DIRECT
    hypothesis_groups:
    - a211v_mechanotransduction_first
    description: >-
      A collapsed bundle is a bundle that transduces less, and the summating potential falls
      in the same animals.
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Scanning electron microscopy examinations demonstrated the collapse of stereocilia
      bundles in IHCs, leaving those from outer hair cells unaffected.
    explanation: >-
      The bundle finding and its restriction to inner hair cells.

- name: Reduced Inner Hair Cell Receptor Potential
  biological_scale: CELLULAR
  description: >-
    The summating potential is the gross cochlear correlate of the inner hair cell receptor
    potential, and it is reduced in the knock-in mouse. Because cochlear amplification is
    intact in the same animals, a smaller receptor potential is being generated from a normal
    mechanical input - which is what a transduction defect in the inner hair cell looks like
    from outside.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: mechanotransduction in the inner hair cell hair bundle

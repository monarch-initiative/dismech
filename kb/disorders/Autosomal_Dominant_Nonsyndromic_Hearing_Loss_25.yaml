  therapeutic_modality: DEVICE
  description: >-
    Offer audiologist-fitted amplification and communication support according to hearing thresholds,
    speech testing and individual preferences. This follows general genetic hearing-loss care; genotype-specific
    benefit cannot be predicted from the null mouse or an isolated OAE finding.

differential_diagnoses:
- name: Presbycusis and noise-induced hearing loss
  description: >-
    Age-related and noise-related hearing loss can resemble DFNA25. Pedigree information and molecular
    testing help distinguish causes, while acquired exposures and genetic disease may coexist. Audiogram
    shape alone is insufficient.
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is difficult to differentiate delayed-onset high-frequency sensorineural hearing
      loss inherited as a simple mendelian trait like DFNA25-associated hearing loss from
      that due to noise exposure or presbycusis, disorders that may also have a genetic
      component.
    explanation: >-
      The difficulty stated as the study's own conclusion.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal-dominant sensorineural hearing loss is genetically heterogeneous, with a
      phenotype closely resembling presbycusis, the most common sensory defect associated
      with aging in humans.
    explanation: >-
      The same resemblance stated for the dominant class DFNA25 belongs to.

    quote_role: BACKGROUND
- name: OTOF-related auditory neuropathy (DFNB9)
  description: >-
    OTOF-related hearing loss is a presynaptic disorder with recessive inheritance, contrasting with dominant
    SLC17A8 disease. Typical clinical patterns can guide testing, but overlapping and atypical presentations
    require molecular interpretation. Null-mouse physiology and sparse human emission data do not reliably
    distinguish every patient.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses to
      acoustic stimuli, although auditory brainstem responses could be elicited by electrical
      stimuli, and robust otoacoustic emissions were recorded.
    explanation: >-
      The physiological pattern DFNA25's null mouse shares with the OTOF synaptopathies, which
      is what makes DFNB9 the mechanistic differential.

- name: CABP2-related nonsyndromic hearing loss (DFNB93)
  description: >-
    CABP2-related DFNB93 is recessive and involves regulation of presynaptic calcium channels. Preserved
    emissions in a reported CABP2 patient support a synaptopathy in that case; comprehensive emission
    phenotyping remains limited. The isolated absent-emission observation in DFNA25 is insufficient for
    a universal mechanistic contrast.
  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
      variant, indicating preservation of outer hair cell-mediated cochlear amplification.
    explanation: >-
      A review summarizes a human CABP2 observation; it does not establish uniform emissions across either
      disease.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified SLC17A8, which encodes the vesicular glutamate transporter-3
      (VGLUT3), as the gene responsible for DFNA25, an autosomal-dominant form of
      progressive, high-frequency nonsyndromic deafness.
    explanation: >-
      Dominant inheritance and the characteristic high-frequency pattern help frame the differential;
      the quote does not establish universal postlingual onset.

discussions:
- discussion_id: mismatch_zygosity_of_the_dfna25_mouse_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous SLC17A8 Variant
  - animal_models#VGLUT3 A224V knock-in mouse
  prompt: >-
    Does either mouse model DFNA25, when both are homozygous and the heterozygote - the
    genotype a patient actually has - is only mildly affected?
  rationale: >-
    Homozygous knock-in mice have progressive impairment but heterozygotes have only mild changes over
    six months. Lifespan, allele dose, genetic background and species-specific biology may contribute.
    Null rescue does not select the optimal strategy for dominant human alleles.
  proposed_experiments:
  - experiment_id: dfna25_aged_heterozygous_knockin
    name: Lifespan-long auditory phenotyping of heterozygous VGLUT3 A224V mice
    description: >-
      Follow heterozygous A224V and wild-type littermates across age with serial ABR, emissions and bundle
      morphology, accounting for background-related hearing loss.
    would_support:
    - pathophysiology#Heterozygous SLC17A8 Variant
    supporting_outcome:
    - A widening deficit would support age-dependent expression in this mouse model, without proving that homozygous pathology transfers to humans.
    refuting_outcome:
    - A plateau would argue against continued progression under the tested conditions; it would not establish universal tolerance of one allele.
- discussion_id: gap_why_patient_emissions_are_absent
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Absent Otoacoustic Emissions
  - mechanistic_hypotheses#presynaptic_glutamate_loading_failure
  prompt: >-
    How representative is the absent-emission finding in the original DFNA25 proband?
  rationale: >-
    The detailed primary human observation concerns one proband, while both main mouse models retain emissions.
    Broader human OAE, cochlear microphonic, ABR, age and exposure data are needed to separate cochlear
    and neural contributions. Controlled mouse noise experiments can test model susceptibility but cannot
    establish the cause of human findings.
  proposed_experiments:
  - experiment_id: dfna25_noise_vulnerability_by_allele_dose
    name: Noise vulnerability in mice carrying one or two VGLUT3-p.A224V alleles
    description: >-
      Expose wild-type, heterozygous and homozygous A224V mice to a controlled acoustic
      overexposure and compare distortion-product emission loss and threshold shift against
      unexposed littermates. This is the experiment the knock-in authors name as necessary to
      determine whether acoustic injury accounts for the discrepancy between mouse and patient
      emissions.
    would_support:
    - phenotypes#Absent Otoacoustic Emissions
    supporting_outcome:
    - Greater emission loss after controlled noise would support genotype-dependent susceptibility in mice and motivate human exposure studies.
    refuting_outcome:
    - No genotype difference would weaken this model-specific noise hypothesis under the tested exposure; it would not resolve human auditory-neuropathy classification.
- discussion_id: gap_where_the_dfna25_lesion_starts
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#presynaptic_glutamate_loading_failure
  - mechanistic_hypotheses#a211v_mechanotransduction_first
  prompt: >-
    How does a vesicular glutamate transporter variant collapse the inner hair cell stereocilia
    bundle?
  rationale: >-
    A224V mice show bundle collapse despite retained transport in heterologous systems and comparable
    cochlear VGLUT3 immunofluorescence. Proteostasis, trafficking and the Cdh23 background remain candidate
    contributors. Identifying the mechanism could guide therapy, but a gene-directed intervention might
    affect both bundle and synaptic consequences.
  proposed_experiments:
  - experiment_id: dfna25_vglut3_localisation_in_knockin_hair_cells
    name: Subcellular localisation and turnover of VGLUT3-p.A224V in inner hair cells
    description: >-
      Track variant VGLUT3 in knock-in inner hair cells by immunogold electron microscopy and
      pulse-chase, testing directly whether it accumulates in the soma or apical compartment,
      whether proteostasis markers are engaged, and whether the cuticular plate cytoskeleton is
      disturbed before the bundles collapse.
    would_support:
    - mechanistic_hypotheses#a211v_mechanotransduction_first
    supporting_outcome:
    - Accumulation and proteostasis changes preceding bundle collapse would support this candidate mechanism; perturbation and rescue would be needed to test causation.
    refuting_outcome:
    - Normal localization and turnover would weaken this mechanism without excluding other allele-dependent or background effects.
- discussion_id: gap_dfna25_allele_class_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#SLC17A8
  prompt: >-
    Do the truncating and splice SLC17A8 alleles cause the same disease as the missense
    founder allele?
  rationale: >-
    Missense, frameshift and splice alleles have unequal human and functional evidence. The frameshift
    and c.824C>A expression study retested reported alleles. Allelic heterogeneity does not by itself
    justify splitting a disease, and a normal heterozygous-null mouse does not resolve the human dominant
    mechanism.
  proposed_experiments:
  - experiment_id: dfna25_allele_class_audiogram_comparison
    name: Audiometric comparison of missense against truncating SLC17A8 carriers
    description: >-
      Collect audiograms and ages at onset across all published SLC17A8 heterozygotes and
      compare the founder missense families against the frameshift and splice-donor families,
      testing whether onset, progression rate and audiometric shape differ by allele class.
    would_support:
    - genetic#SLC17A8
    supporting_outcome:
    - Overlapping profiles would support shared clinical features without proving a shared molecular mechanism.
    refuting_outcome:
    - Reproducible differences would support allele-specific prognosis and further mechanistic work, without by themselves requiring separate disease entities.
notes: >-
  This is a genetic disease eligible for review despite noise exposure being a possible modifier and differential.
  SLC17A8 and the auditory brainstem response abbreviation ABR were distinguished in the research preflight;
  ABR is not a rival causal gene here. The matching research narrative, table, bibliography and citation
  sidecar were assessed. The report misidentifies PMID:22794260 as the 2012 rescue study; the correct
  PMID:22841313 is retained. Incorrect suggested HPO bindings were not imported. Normal-cell vesicle proteomics
  is background, not a disease biomarker. Adult CSF-mediated null-mouse rescue is now represented with
  the primary 2023 citation.

  The full GeneReviews Genetic Hearing Loss Overview supplies general clinical, diagnostic, management,
  surveillance and counseling context; it is not a DFNA25-specific chapter and does not establish gene-specific
  phenotype frequencies or follow-up intervals. Dated ClinGen counts are not worldwide prevalence. No
  quantitative progression rate is inferred from a single-family serial-audiogram report.

  The 2003 JAMA primary full text was inspected online. Automated cache retrieval returned 403 for HTML
  and PDF, so cached abstract quotations and the explicitly secondary OAE quotation are retained without
  inventing a full-text cache. The full text narrows the OAE/ABR denominator and documents an early-onset
  exception. Absence of emissions alone does not settle the disease classification.

  The PMID:41279968 cache combines a 2025 preprint abstract with the later published PDF. The published
  vestibular study is cited separately by DOI:10.1038/s41598-026-43836-7; its mouse findings are not human
  phenotype evidence. Full-text discussion limits apparently spared balance to the assays tested and proposes,
  rather than proves, nonquantal compensation.


  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ca(2+)-triggered synaptic-vesicle turnover was normal in IHCs of Slc17a8 null mice when
      probed by membrane capacitance measurements at 2 weeks of age.
    explanation: >-
      The deliberate negative result that localises the defect to vesicle content rather than

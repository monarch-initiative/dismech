name: Autosomal Dominant Nonsyndromic Hearing Loss 25
creation_date: "2026-09-01T20:30:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 25
  term:
    id: MONDO:0011568
    label: autosomal dominant nonsyndromic hearing loss 25
synonyms:
- DFNA25
- deafness, autosomal dominant 25
- autosomal dominant nonsyndromic deafness 25
- SLC17A8 autosomal dominant nonsyndromic deafness
- autosomal dominant nonsyndromic deafness caused by mutation in SLC17A8
description: >-
  Delayed-onset, progressive, predominantly high-frequency sensorineural hearing loss caused
  by heterozygous variants in SLC17A8, which encodes vesicular glutamate transporter 3
  (VGLUT3). VGLUT3 is the transporter that fills the synaptic vesicles of the cochlear inner
  hair cell with glutamate before they are released onto the auditory nerve terminal, so the
  gene sits at the very first synapse of hearing. Among the three vesicular glutamate
  transporters it is the only one expressed in inner hair cells, which is why a defect in it
  produces deafness and almost nothing else.

  Two things make this entry worth reading rather than filing as one more DFNA locus.

  The first is that the gene's function makes DFNA25 look like an auditory synaptopathy and
  the patients do not behave like one. The Slc17a8 null mouse is a textbook synaptopathy:
  otoacoustic emissions are robust, sound-evoked auditory-nerve responses are absent, and
  brainstem responses can still be driven electrically, so the cochlear amplifier is intact
  and the step after it is not. The knock-in mouse carrying the actual human allele has intact
  emissions too. But in the patients carrying that same allele, otoacoustic emissions are
  absent - the opposite result - and the knock-in study concludes on that basis that DFNA25 is
  more likely a progressive hearing loss than an auditory neuropathy. Whether those absent
  emissions are the disease or a lifetime of accumulated noise exposure is unresolved, and it
  is the question that decides which class this disease belongs to.

  The second is that the two mouse models disagree about where the lesion starts. The null
  points at vesicle filling. The knock-in points at the hair bundle: inner hair cell
  stereocilia collapse while outer hair cell bundles do not, the summating potential falls,
  and the synaptic changes - oversized ribbons, a faster sustained release rate - appear
  later. That is mechanistically surprising, because VGLUT3 is not present in inner hair cell
  stereocilia and its loss does not affect transducer activity, so no route from the
  transporter to the bundle is established. This entry curates both accounts as hypothesis
  groups rather than choosing between them.

  The third is that neither mouse has the genotype a patient has. Both are homozygous. The
  heterozygous knock-in - the genotype that matches a DFNA25 carrier - has only mild hearing
  impairment, which its authors note contrasts with the dominant transmission seen in the
  human families. Because truncating and splice alleles have since been reported in dominant
  families too, the allelic mechanism has to be argued case by case rather than assumed from
  the gene.

  Clinically the disease is easy to miss. It is postlingual, slowly progressive and
  high-frequency, which is the audiometric shape of presbycusis and of noise damage, and the
  founding clinical study says in as many words that separating it from those is difficult.
  Penetrance is age-dependent and, in the original kindred, appeared to depend on which
  parent transmitted the haplotype.
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


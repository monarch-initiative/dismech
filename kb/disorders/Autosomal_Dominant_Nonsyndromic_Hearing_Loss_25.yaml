    snippet: >-
      Habilitation for hearing loss includes improved access to sound through hearing aids or cochlear
      implants
    explanation: >-
      General habilitation options; no SLC17A8-specific outcome is asserted.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: AAV-mediated VGLUT3 Gene Replacement
  therapeutic_modality: GENE_THERAPY
  description: >-
    Preclinical gene replacement has restored auditory responses in homozygous null mice after neonatal
    cochlear AAV1 delivery, adult intracisternal delivery through the cochlear aqueduct, and AAV8 injection
    at five weeks with assessment 27 weeks later. The latter does not demonstrate reversal after treatment
    of already aged animals. These interventions have not established efficacy in dominant A211V disease;
    augmentation, suppression or combined strategies require variant-specific testing. No human SLC17A8
    interventional study was identified in the reviewed research; the registered NCT01802190 study is
    observational.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Altered VGLUT3 Function in the Inner Hair Cell
    treatment_effect: RESTORES
    description: >-
      Restoring VGLUT3 protein to the inner hair cell addresses the molecular lesion rather
      than its consequences - in an animal that has none of the protein to begin with.
    evidence:
    - reference: PMID:22841313
      reference_title: Restoration of hearing in the VGLUT3 knockout mouse using virally mediated gene therapy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Within 2 weeks of AAV1-VGLUT3 delivery, auditory brainstem response (ABR) thresholds
        normalize, along with partial rescue of the startle response.
      explanation: >-
        The functional rescue, in the null mouse.
    - reference: PMID:40841774
      reference_title: Gene therapy restores auditory function and rescues damaged inner hair cells in an aged Vglut3 knockout mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Auditory brainstem response (ABR) testing demonstrated restoration of auditory
        function following gene therapy.
      explanation: >-
        Mice were injected at five weeks and evaluated 27 weeks later, so the aged endpoint does not establish
        efficacy when treatment starts in aged animals.
  evidence:
  - reference: PMID:22841313
    reference_title: Restoration of hearing in the VGLUT3 knockout mouse using virally mediated gene therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings represent a successful restoration of hearing by gene replacement in
      mice, which is a significant advance toward gene therapy of human deafness.
    explanation: >-
      The authors' own framing of how far the result reaches - toward human therapy, not to

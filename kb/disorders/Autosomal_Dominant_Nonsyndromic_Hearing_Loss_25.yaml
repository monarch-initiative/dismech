    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Secondary Deafferentation of the Inner Hair Cell
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of afferent signaling and later deafferentation occur in null mice; glutamate also has developmental
      effects, so this is not established as a direct use-dependent degeneration mechanism in humans.
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Impaired afferent sound encoding provides a model-based explanation for hearing loss. The progressive
      human course is not reproduced by the congenitally deaf null model.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses to
      acoustic stimuli, although auditory brainstem responses could be elicited by electrical
      stimuli, and robust otoacoustic emissions were recorded.
    explanation: >-
      All three halves of the dissociation in one sentence: no acoustic neural response,
      preserved electrical response, preserved emissions.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using auditory brainstem response and distortion product otoacoustic emissions, we
      showed progressive hearing loss with intact cochlear amplification in the
      VGLUT3A224V/A224V mouse.
    explanation: >-
      The same dissociation in the allele-matched model, and in progressive rather than
      congenital form.
- name: Secondary Deafferentation of the Inner Hair Cell
  biological_scale: TISSUE
  description: >-
    Null mice show loss of afferent synapses, spiral ganglion neurons and lateral efferent endings; some
    neuronal loss precedes hearing onset. Older null cochleae also show inner hair cell and stereocilia
    degeneration. These observations raise questions about treatment timing, but do not define a human
    therapeutic window. Rescue studies in post-neonatal null mice remain distinct from dominant human
    disease.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  downstream:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Reduced afferent innervation may contribute to sustained hearing impairment in null models; its
      contribution and reversibility in human DFNA25 are unknown.
  evidence:
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Later, the number of afferent synapses, spiral ganglion neurons, and lateral efferent
      endings below sensory IHCs declined.
    explanation: >-
      The deafferentation itself, and its late timing relative to the functional deficit.
  - reference: PMID:18215623
    reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The early degeneration of some cochlear ganglion neurons in knockout mice also
      indicates an important developmental role for the glutamate released by hair cells
      before the onset of hearing.
    explanation: >-
      The developmental component, which is a different claim from use-dependent loss and is
      the reason a congenital null and an adult-onset human disease may diverge here.
  - reference: PMID:40841774
    reference_title: Gene therapy restores auditory function and rescues damaged inner hair cells in an aged Vglut3 knockout mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we analyzed the cochlear structure of aged Vglut3KO mice, revealing
      significant degeneration of inner hair cells, synapses, and stereocilia.
    explanation: >-
      The structural endpoint in the aged null animal.

phenotypes:
- category: Otologic
  name: Progressive High-Frequency Sensorineural Hearing Loss
  description: >-
    Progressive, predominantly high-frequency sensorineural hearing loss is the characteristic presentation
    in the founding families. Audiogram shape and severity vary. Family-based ascertainment and a dated
    ClinGen proband count do not support a population-wide phenotype frequency.
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:11115382
    reference_title: "DFNA25, a novel locus for dominant nonsyndromic hereditary hearing impairment, maps to 12q21-24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a novel dominant locus, DFNA25, for delayed-onset, progressive,
      high-frequency, nonsyndromic sensorineural hearing loss in a large, multigenerational
      United States family of Czech descent.
    explanation: >-
      The phenotype as defined at the locus, in the founding kindred.
  - reference: PMID:18674745
    reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified SLC17A8, which encodes the vesicular glutamate transporter-3
      (VGLUT3), as the gene responsible for DFNA25, an autosomal-dominant form of
      progressive, high-frequency nonsyndromic deafness.
    explanation: >-
      The same phenotype restated once the gene was in hand.

- category: Otologic
  name: Postlingual Delayed Onset
  description: >-
    Postlingual onset is typical, not universal. The 2003 full clinical report includes a child whose
    loss was suspected at birth and confirmed by diagnostic ABR at three months. A normal newborn screen
    cannot exclude later-onset genetic hearing loss.
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals typically manifest a high-frequency, slowly progressive
      sensorineural hearing loss in the postlingual period.
    explanation: >-
      The abstract explicitly says typically. The primary full text documents an early-onset exception;
      normal hearing through speech acquisition is not universal.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In general, autosomal dominant nonsyndromic hearing loss is postlingual, progressive, and high frequency.
    explanation: >-
      General clinical baseline, not a SLC17A8-specific age distribution or exclusion of congenital presentations.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- category: Otologic
  name: Absent Otoacoustic Emissions
  description: >-
    The 2003 family report documents absent transient-evoked emissions and no repeatable ABR in the proband
    III:14. The later knock-in discussion generalizes this to patients, but the primary detailed test
    report is not a cohort-wide denominator. No frequency or universal exclusion of auditory neuropathy
    is inferred. Acquired cochlear injury and mixed mechanisms remain possible explanations.
  phenotype_term:
    preferred_term: Absent otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  evidence:
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, otoacoustic emissions were absent in patients harbouring the p.A211V allele
    explanation: >-
      Secondary discussion of the 2003 human study. Inspection of that primary full text limits the detailed
      OAE/ABR observation to the proband; the plural wording is not evidence for prevalence or a universal
      classification.
    quote_role: BACKGROUND
    directness: INDIRECT
- category: Otologic
  name: Absence of Syndromic Features
  description: >-
    The reported Korean splice-variant family had hearing loss without accompanying symptoms. This supports
    a nonsyndromic human presentation. Vestibular sparing in null mice is a separate experimental observation
    and cannot establish normal vestibular function in every human carrier.
  evidence:
  - reference: PMID:28647561
    reference_title: Identification of a novel splicing mutation within SLC17A8 in a Korean family with hearing loss by whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the clinical information about this family revealed that there are no other symptoms
      accompanied with HL
    explanation: >-
      The nonsyndromic statement in a reported dominant family.
genetic:
- name: SLC17A8
  gene_term:
    preferred_term: SLC17A8
    term:
      id: hgnc:20151
      label: SLC17A8
  relationship_type: CAUSATIVE
  notes: >-
    SLC17A8 encodes VGLUT3. ClinGen classified its dominant nonsyndromic hearing loss relationship as
    Definitive in 2023; the counted probands and variants describe that assessment. A211V, c.616dupA and
    c.763+1G>T differ in their supporting segregation and functional evidence. The 2016 frameshift was
    found in one sequenced proband with an affected pedigree; the splice report demonstrated cosegregation,
    but did not establish transcript consequences in its abstract. The 2021 cell study tested the already
    reported c.616dupA alongside c.824C>A, rather than discovering two additional alleles.
  evidence:
  - reference: CGGV:assertion_8c399400-090a-4b2e-93ff-0c4915ce81c7-2023-06-01T160000.000Z
    reference_title: SLC17A8 / nonsyndromic genetic hearing loss (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in this gene segregated with disease in 28 additional members in two families
    explanation: >-
      The segregation evidence behind the Definitive classification.
  - reference: CGGV:assertion_8c399400-090a-4b2e-93ff-0c4915ce81c7-2023-06-01T160000.000Z
    reference_title: SLC17A8 / nonsyndromic genetic hearing loss (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, SCL17A8 is definitively associated with autosomal dominant nonsyndromic
      hearing loss.
    explanation: >-
      The panel's summary sentence. The gene symbol is transposed in the source record and is
      quoted as written.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission with age-dependent penetrance. Each child of a heterozygous affected
    individual has a 50% chance of inheriting the variant; this is not a 50% probability of hearing loss
    at a specified age. Earlier reported onset in males and a maternal-versus-paternal haplotype pattern
    arose in one pre-gene-mapping kindred and remain unreplicated modifier hypotheses. Normal hearing
    at one assessment does not exclude carrier status. Four tested mitochondrial variants were absent,
    which does not exclude all mitochondrial effects.
  evidence:
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance is autosomal dominant with age-dependent penetrance.
    explanation: >-
      Inheritance mode and the penetrance qualifier together.

  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In those inheriting the DFNA25-associated haplotype from an affected mother, hearing
      loss invariably developed by the second decade of life, whereas those inheriting the
      DFNA25 haplotype from an affected father often maintained hearing levels comparable to
      those of age-matched control subjects, even into the seventh decade of life.
    explanation: >-
      The parent-of-origin observation, quoted in full so the size and source of the claim
      travel with it.
  - reference: PMID:12925340
    reference_title: Phenotypic characterization of hereditary hearing impairment linked to DFNA25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of 4 deafness-associated mitochondrial mutations screened (1555A>G, 7445A>G,
      Cins7472, and 7511T>C) were found to segregate in the family.
    explanation: >-
      Only the four tested mitochondrial variants were excluded; the study did not sequence the mitochondrial
      genome or establish the cause of the parent-of-origin pattern.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with autosomal dominant hearing loss have a 50% chance of transmitting the pathogenic
      variant to each child.
    explanation: >-
      General autosomal dominant transmission probability, distinct from penetrance.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
animal_models:
- name: Slc17a8 null mouse
  species: Mouse
  genotype: Slc17a8 (Vglut3) exon 2 targeted deletion, homozygous null
  publication: PMID:18674745
  description: >-
    Homozygous Slc17a8 null mice model complete loss of vesicular glutamate transmission with profound
    hearing loss and extra-cochlear effects including seizures. The published vestibular study found strongly
    reduced quantal transmission but relatively preserved spontaneous vestibular nerve activity and most
    balance tests, with some assay differences. Nonquantal compensation is proposed; this is not proof
    of normal human vestibular function.
  modeled_mechanisms:
  - target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The release failure and its localisation to vesicle content rather than fusion, both
      measured directly in the correct cell type.
    limitations: >-
      Homozygous null mice model complete VGLUT3 loss, not the heterozygous human genotypes. Congenital
      profound deafness and mouse epilepsy do not reproduce the typical progressive nonsyndromic presentation.
    readouts:
    - name: Calcium-triggered synaptic vesicle turnover in inner hair cells
      target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
      direction: UNCHANGED
      interpretation: >-
        Exocytosis itself is normal. A deliberate negative result, and the one that makes the
        defect a cargo defect rather than a release-machinery defect.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Ca(2+)-triggered synaptic-vesicle turnover was normal in IHCs of Slc17a8 null mice
          when probed by membrane capacitance measurements at 2 weeks of age.
        explanation: >-
          The capacitance measurement behind this readout.
    - name: Ribbon synapse ultrastructure at three months
      target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
      direction: UNCHANGED
      interpretation: >-
        Surviving ribbons appeared normal in this line at three months despite reduced synapse numbers.
        Other null-model studies reported altered ribbon shape; this result is specific to this study.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ribbon synapses remaining by 3 months of age had a normal ultrastructural
          appearance.
        explanation: >-
          The electron-microscopy observation behind this readout.
    evidence:
    - reference: PMID:18215623
      reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We now report that mice lacking VGLUT3 are profoundly deaf due to the absence of
        glutamate release from hair cells at the first synapse in the auditory pathway.
      explanation: >-
        Supports treating this model as informative for the release node.
  - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The three-way dissociation - no acoustic neural response, intact emissions, intact
      electrically evoked brainstem response - measured in one animal.
    limitations: >-
      Detailed human OAE/ABR testing in the 2003 report concerns one proband. The mouse dissociation cannot
      establish the physiology of all carriers or clinical implant outcomes.
    readouts:
    - name: Otoacoustic emissions
      target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        Outer hair cell amplification is preserved, placing the lesion downstream of the
        cochlear amplifier. A negative result, and the load-bearing one.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          robust otoacoustic emissions were recorded
        explanation: >-
          The emissions measurement behind this readout.
    - name: Electrically evoked auditory brainstem response
      target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        The ascending auditory pathway can still be driven when the defective synapse is
        bypassed, which is the observation that makes cochlear implantation biologically
        plausible in this disease.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          although auditory brainstem responses could be elicited by electrical stimuli
        explanation: >-
          The electrical-stimulation measurement behind this readout.
    evidence:
    - reference: PMID:18674745
      reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses
        to acoustic stimuli, although auditory brainstem responses could be elicited by
        electrical stimuli, and robust otoacoustic emissions were recorded.
      explanation: >-
        Supports treating this model as informative for the dissociation node.
  - target: Secondary Deafferentation of the Inner Hair Cell
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      The afferent synapses, spiral ganglion neurons and lateral efferent endings decline
      after the functional deficit is established.
    limitations: >-
      The null model has complete congenital loss of signaling and developmental neuronal effects. Human
      onset is variable and usually later; human synapse-count evidence is lacking in the reviewed sources.
    readouts:
    - name: Afferent synapse and spiral ganglion neuron counts
      target: Secondary Deafferentation of the Inner Hair Cell
      direction: DECREASED
      interpretation: >-
        The afferent population beneath the inner hair cell falls over time in the null
        animal.
      evidence:
      - reference: PMID:18674745
        reference_title: "Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Later, the number of afferent synapses, spiral ganglion neurons, and lateral
          efferent endings below sensory IHCs declined.
        explanation: >-
          The counting result behind this readout.
    evidence:
    - reference: PMID:18215623
      reference_title: Sensorineural deafness and seizures in mice lacking vesicular glutamate transporter 3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The early degeneration of some cochlear ganglion neurons in knockout mice also
        indicates an important developmental role for the glutamate released by hair cells
        before the onset of hearing.
      explanation: >-
        Supports the model for this node while naming the developmental confound that limits
        its fidelity.

  evidence:
  - reference: DOI:10.1038/s41598-026-43836-7
    reference_title: Persistence of vestibular function in the absence of glutamatergic transmission from hair cells
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that non-quantal transmission is sufficient to support vestibular nerve physiology and
      behavioral function in Vglut3 −/− mice.
    explanation: >-
      The published study proposes a compensatory explanation from mouse physiology and behavioral tests;
      some assay differences and limited sampling preclude universal normality.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
- name: VGLUT3 A224V knock-in mouse
  species: Mouse
  genotype: Slc17a8 p.A224V knock-in (mouse equivalent of human p.A211V), homozygous
  publication: PMID:34783032
  description: >-
    The allele-matched model, and the reason this entry carries two hypothesis groups. A
    single point mutation was introduced into exon 5 of mouse Slc17a8, exchanging the codon
    for the alanine that corresponds to human A211. It reproduces the progressive course the
    null mouse does not, and it reaches a different conclusion about where the disease starts.
  modeled_mechanisms:
  - target: Inner Hair Cell Stereocilia Bundle Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Collapse and fusion of the inner hair cell stereocilia bundles, with outer hair cell
      bundles spared - the model's primary structural finding.
    limitations: >-
      Homozygosity differs from human dominant inheritance. The C57BL/6J Cdh23 background may modify the
      bundle phenotype; this has not been separated experimentally. No corresponding human cochlear morphology
      was demonstrated.
    readouts:
    - name: Inner hair cell stereocilia bundle morphology by scanning electron microscopy
      target: Inner Hair Cell Stereocilia Bundle Disruption
      direction: ALTERED
      interpretation: >-
        Inner hair cell bundles collapse; outer hair cell bundles do not. The contrast within
        the same cochlea is what makes this a cell-type-specific lesion rather than general
        degeneration.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Scanning electron microscopy examinations demonstrated the collapse of stereocilia
          bundles in IHCs, leaving those from outer hair cells unaffected.
        explanation: >-
          The microscopy result behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results suggest that DFNA25 stems from a failure in the mechano-transduction
        followed by a change in synaptic transfer.
      explanation: >-
        The authors' claim that this model's structural finding is the disease's starting
        point, which is what makes the model informative for this node.
  - target: Reduced Inner Hair Cell Receptor Potential
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The functional counterpart of the bundle collapse, measured as a reduced summating
      potential in an animal whose cochlear amplifier is intact.
    limitations: >-
      The summating potential is a gross cochlear potential and an indirect index of the
      inner hair cell receptor potential rather than a recording from the cell. It is not
      measured clinically in DFNA25 patients, so there is no human comparison.
    readouts:
    - name: Summating potential
      target: Reduced Inner Hair Cell Receptor Potential
      direction: DECREASED
      interpretation: >-
        A smaller receptor-potential correlate from a mechanically normal input, consistent
        with a transduction rather than an amplification deficit.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The summating potential was reduced, indicating the alteration of inner hair cell
          (IHC) receptor potential.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The summating potential was reduced, indicating the alteration of inner hair cell (IHC) receptor
        potential.
      explanation: >-
        Measured cochlear potential supports the model-to-mechanism link, with the indirect nature of
        the receptor-potential readout stated in its limitations.
  - target: Synaptic Ribbon Enlargement
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ribbon enlargement at four to six months in the homozygous knock-in.
    limitations: >-
      Elongated and enlarged ribbons are not necessarily opposite findings. Morphology differs between
      studies and models; compensation, pathogenic contribution and relevance to human heterozygotes remain
      unresolved.
    readouts:
    - name: Synaptic ribbon size by super-resolution microscopy
      target: Synaptic Ribbon Enlargement
      direction: INCREASED
      interpretation: >-
        Ribbons are larger than wild type in the knock-in animal.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using super-resolution microscopy, we observed oversized synaptic ribbons
        explanation: >-
          The imaging result behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, IHC ribbon synapses underwent structural and functional modifications at
        later stages.
      explanation: >-
        Supports the model for this node and fixes its position late in the sequence.
  - target: Increased Sustained Inner Hair Cell Exocytosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Increased sustained exocytic capacitance response at six months.
    limitations: >-
      An ex-vivo membrane-fusion readout, not a direct measure of glutamate release or evidence that increased
      secretion causes the hearing deficit.
    readouts:
    - name: Sustained releasable pool exocytosis rate
      target: Increased Sustained Inner Hair Cell Exocytosis
      direction: INCREASED
      interpretation: >-
        Sustained vesicle fusion is increased under imposed depolarization; glutamate quantal content
        was not measured.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          patch-clamp membrane capacitance measurements showed an increase in the rate of the
          sustained releasable pool exocytosis
        explanation: >-
          The capacitance measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        patch-clamp membrane capacitance measurements showed an increase in the rate of the sustained
        releasable pool exocytosis
      explanation: >-
        Ex-vivo patch-clamp measurements in isolated mouse organs of Corti; membrane fusion does not determine
        glutamate quantal content.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Progressive hearing loss with intact cochlear amplification, which is the human course
      in outline.
    limitations: >-
      Homozygotes progress, whereas heterozygotes have only mild impairment over the studied interval.
      Human dominant inheritance, audiogram configuration and limited human OAE findings are not fully
      reproduced. Lifespan and background effects remain hypotheses.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive High-Frequency Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        Thresholds rise progressively with age. The direction is INCREASED because the
        readout is a threshold - worse hearing means more sound is required to evoke a
        response.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mutant mice carrying the VGLUT3-p.A211V variant show progressive hearing loss.
        explanation: >-
          The progressive threshold shift behind this readout, stated in the paper's key
          points.
    - name: Distortion-product otoacoustic emissions
      target: Progressive High-Frequency Sensorineural Hearing Loss
      direction: UNCHANGED
      interpretation: >-
        Cochlear amplification is intact while brainstem responses deteriorate. A negative
        result that separates this from an outer-hair-cell hearing loss.
      evidence:
      - reference: PMID:34783032
        reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we showed progressive hearing loss with intact cochlear amplification in the
          VGLUT3A224V/A224V mouse
        explanation: >-
          The emissions measurement behind this readout.
    evidence:
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data show that the VGLUT3A224V/A224V mice phenocopy human progressive hearing
        loss.
      explanation: >-
        The authors' own claim that this model matches the human course, which is what
        licenses using it for the clinical phenotype node.
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the mouse model harbouring the VGLUT3-p.A224V variant mimics a progressive hearing loss
        with auditory neuropathy features, but might be arguable so far as to consider it as a
        faithful model of DFNA25
      explanation: >-
        The same authors' qualification of the sentence above, in the discussion rather than the
        abstract. It is recorded as REFUTE against the link's claim of fidelity, and it is why
        this relationship is PARTIALLY_RECAPITULATES.
    - reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the mild hearing impairment in the VGLUT3+/A224V heterozygotes contrasts with
        the dominant transmission in DFNA25
      explanation: >-
        The zygosity mismatch measured rather than assumed: the genotype that matches a patient
        is only mildly affected in this animal.

diagnosis:
- name: Molecular testing of SLC17A8
  description: >-
    Combine audiologic assessment, examination for syndromic findings, family history and molecular testing.
    A hearing-loss multigene panel or genomic testing can identify SLC17A8 alongside overlapping causes.
    Testing a known familial pathogenic variant clarifies carrier status; audiometry independently measures
    current hearing and progression.
  evidence:
  - reference: PMID:28647561
    reference_title: Identification of a novel splicing mutation within SLC17A8 in a Korean family with hearing loss by whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify a causative mutation of HL in this family, we performed whole-exome
      sequencing of 4 family members, 3 affected and an unaffected.
    explanation: >-
      Family exome sequencing identified the splice-site variant; the paper does not state that linkage
      was unavailable.
  - reference: PMID:26797701
    reference_title: Screening of the SLC17A8 gene as a causative factor for autosomal dominant non-syndromic hearing loss in Koreans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we performed a genetic analysis of 87 unrelated Korean patients with
      ADNSHL to determine whether the SLC17A8 gene affects hearing ability in the Korean
      population.
    explanation: >-
      The screened cohort comprised 87 unrelated dominant-hearing-loss probands; the single candidate
      frameshift does not provide a general diagnostic yield.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Single-gene testing (sequence analysis of a given gene, followed by gene-targeted deletion/duplication
      analysis) is rarely useful and typically NOT recommended.
    explanation: >-
      General initial diagnostic strategy; targeted testing for a known familial variant is a separate
      indication.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Variant interpretation as a distinct problem in this gene
  description: >-
    Evaluate each variant using segregation, population data, phenotype and functional evidence. A VUS
    does not confirm or exclude DFNA25. The 2016 full text found I78V did not cosegregate and A374S also
    occurred in normal-hearing controls, illustrating why conservation and predictions alone are insufficient.
    Cell-culture effects of c.616dupA and c.824C>A are functional support, not proof of a shared mechanism
    or clinical pathogenicity.
  evidence:
  - reference: PMID:34145196
    reference_title: "The c.824C>A and c.616dupA mutations in the SLC17a8 gene are associated with auditory neuropathy and lead to defective expression of VGluT3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although several suspected pathogenic mutations of the SLC17a8 gene have been
      identified in humans, few studies have confirmed their pathogenicity.
    explanation: >-
      The interpretation problem stated by the authors as their motivation.
  - reference: PMID:34145196
    reference_title: "The c.824C>A and c.616dupA mutations in the SLC17a8 gene are associated with auditory neuropathy and lead to defective expression of VGluT3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The c.616dupA mutation in the SLC17a8 gene resulted in a significant decrease in
      transcriptional activity of mRNA, and the expression of VGluT3 was also reduced. The
      c.824C>A mutation in the SLC17a8 gene resulted in abnormal VGluT3, although this
      mutation did not affect the transcriptional activity of mRNA.
    explanation: >-
      Two alleles in one gene with two different molecular consequences, measured in cell
      culture.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of uncertain significance cannot be used to confirm or rule out
      the diagnosis.
    explanation: >-
      General variant-interpretation guidance.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT

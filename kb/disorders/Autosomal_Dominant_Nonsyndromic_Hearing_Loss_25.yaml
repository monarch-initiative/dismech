    explanation: >-
      The splice-donor allele and its co-segregation in a three-generation dominant family.

- name: Altered VGLUT3 Function in the Inner Hair Cell
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    VGLUT3 is the vesicular glutamate transporter of the cochlear inner hair cell: it
    accumulates glutamate inside the synaptic vesicle so that the vesicle has something to
    release when it fuses. Of the three VGLUT paralogues it is the only one selectively
    expressed in inner hair cells, which is why the cochlear phenotype is not compensated by
    VGLUT1 or VGLUT2 and why an otherwise widely expressed transporter gives a nonsyndromic
    deafness.

    What the human p.A211V substitution does to that function is the open part. It does not
    impair vesicular glutamate accumulation, quantal release or quantal content when tested
    in hippocampal autaptic neurons, and in the knock-in mouse it lowers VGLUT3 protein in
    central terminals by roughly seventy per cent without changing VGLUT3-dependent
    behaviour. So the allele is not a straightforward transport-dead mutant, and the two
    hypothesis groups below diverge from this node rather than from the variant.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: vesicular L-glutamate transport by VGLUT3
    modifier: DECREASED
    term:
      id: GO:0005313
      label: L-glutamate transmembrane transporter activity
  biological_processes:

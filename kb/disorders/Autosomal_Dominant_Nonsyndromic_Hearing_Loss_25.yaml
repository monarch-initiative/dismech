    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel splicing mutation, c.763+1G>T, in the solute carrier family 17, member 8
      (SLC17A8) gene was identified in the patients, and the genotypes of the mutation were

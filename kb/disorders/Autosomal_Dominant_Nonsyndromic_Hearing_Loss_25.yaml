    explanation: >-
      The measurement and the authors' own interpretation of it.
  - reference: PMID:34783032
    reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that DFNA25 stems from a failure in the mechano-transduction

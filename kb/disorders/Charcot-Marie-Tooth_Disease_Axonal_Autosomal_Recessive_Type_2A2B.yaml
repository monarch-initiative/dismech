    causal_link_type: DIRECT
- name: Fragmented and Clumped Mitochondrial Network
  biological_scale: CELLULAR
  description: >-
    Without fusion the network disintegrates. In fibroblasts from a fetus homozygous for an MFN2
    deletion, three independent methods - fluorescence imaging, electron microscopy and time-lapse
    recording - showed a sharply altered network with clumped mitochondria and clusters that were
    tethered to one another but could not fuse. That last detail is mechanistically specific: the
    tethering step is preserved and the fusion step is not, which localises the defect within
    mitofusin-2's own reaction rather than to a failure of mitochondria to meet.
  cellular_components:
  - preferred_term: mitochondrion

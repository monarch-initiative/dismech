    snippet: "We report on a 7-month-old white female with hypotonia, motor delay, distal weakness, and motor/sensory axonal neuropathy in which next-generation sequencing analysis identified compound heterozygous pathogenic variants (c.2054_2069_1170del and c.392A>G) in MFN2."
    explanation: The neuropathy characterised as motor and sensory, with the patient's age and genotype.

      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:37804319
    reference_title: Homozygous MFN2 variants causing severe antenatal encephalopathy with clumped mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fetus fibroblasts, investigated by fluorescent cell imaging, electron microscopy and time-lapse recording, showed a sharp alteration of the mitochondrial network, with clumped mitochondria and clusters of tethered mitochondria unable to fuse."
    explanation: >-
      The cellular phenotype, with the three methods that established it and the tethered-but-not
      fused detail.

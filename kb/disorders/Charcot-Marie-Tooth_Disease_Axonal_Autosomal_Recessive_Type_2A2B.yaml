inheritance:
- name: Semidominant inheritance presenting as autosomal recessive
  description: >-
    The entity's name says autosomal recessive and its transmission pattern usually looks
    recessive - affected children of unaffected or nearly unaffected parents - but the mechanism
    reported in the primary literature is semidominant, and the entry records both rather than
    picking one.

    Three observations force that reading. First, in the founding series every parent carrying a
    single variant was asymptomatic *or mildly symptomatic with some signs of peripheral
    neuropathy*, which the authors read as a minimal phenotype indicating a semi-dominant
    mechanism. Second, in a later family the carrier mother of a missense allele had a very
    late-onset minimal axonal neuropathy while the carrier father of a nonsense allele had
    neither clinical nor electrophysiological neuropathy - so a null allele alone is silent and
    MFN2 haploinsufficiency is not disease-causing. Third, ClinGen's Charcot-Marie-Tooth Disease
    Gene Curation Expert Panel assigns the MFN2 gene-disease relationship a semidominant mode of
    inheritance rather than dominant or recessive.

    Together these say the determinant is the dose of dysfunctional protein, not the number of
    broken alleles: one dysfunctional allele gives subclinical-to-late-onset disease, two give the
    severe early-onset picture this entity describes, and a null allele contributes only by
    removing the wild-type protein that would otherwise dilute a dysfunctional one.
    The bound term is HP:0000007 because that is the transmission pattern the entity is named for
    and the one a clinician will observe in a family. HPO has no semidominant mode-of-inheritance
    term, so the mechanistic reading is carried in this description and in a dedicated
    pathophysiology node rather than in the binding. Consanguinity has been reported in at least
    one family, which is the ordinary recessive pattern; the semidominant mechanism does not
    change the recurrence arithmetic for counselling, but it does mean carrier parents should be
    examined rather than assumed unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

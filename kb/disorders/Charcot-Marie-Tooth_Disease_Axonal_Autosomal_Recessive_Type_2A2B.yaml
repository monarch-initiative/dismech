genetic:
- name: MFN2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MFN2
    term:
      id: hgnc:16877
      label: MFN2
  notes: >-
    MFN2 encodes mitofusin-2, an outer-mitochondrial-membrane GTPase. It is the commonest cause of
    axonal Charcot-Marie-Tooth disease, and the overwhelming majority of that is the dominant
    CMT2A2A (OMIM 609260, MONDO:0012231). This entity is OMIM 617087, the biallelic form.

    Expert classification. ClinGen's Charcot-Marie-Tooth Disease Gene Curation Expert Panel
    classifies the MFN2 gene-disease relationship for Charcot-Marie-Tooth disease type 2A2 as
    Definitive with a **semidominant** mode of inheritance - not autosomal dominant and not
    autosomal recessive. That single field is the most compact statement of this entity's
    mechanism available anywhere. It is not cited as an evidence item here: the current assertion
    is absent from the ClinGen gene-validity snapshot pinned in `data/clingen/MANIFEST.yaml`
    (`just clingen-refresh` fails on checksum drift), and the older assertion that is in the pin
    carries a disease label MONDO has since obsoleted. Building a cache file from an unpinned
    download would commit an artifact that cannot be reproduced from the pin, and repinning is a
    separate change from curating a disease. The claim was read directly from the ClinGen
    gene-validity download and is corroborated by the two primary papers cited in the inheritance
    block, which reach the same conclusion from patient data.

    Three traps for anyone extending this entry from the gene rather than from the disease.

    First and most important, **biallelic MFN2 does not mean this disease**. Recessive MFN2
    variants also cause a lipodystrophy/multiple-symmetric-lipomatosis phenotype that has nothing
    to do with neuropathy, and MFN2 appears as a rare cause in genetically confirmed familial
    partial lipodystrophy cohorts; dismech curates that association in
    `Familial_Partial_Lipodystrophy`. A search for "recessive MFN2" returns both diseases.

    Second, MFN2 causes several *dominant* entities beyond CMT2A2A - hereditary motor and sensory
    neuropathy VIA with optic atrophy (CMT6) and forms with upper motor neuron involvement (CMT5)
    - and dismech separately curates `Autosomal_Dominant_Optic_Atrophy_Plus`. A paper about MFN2
    and optic atrophy is usually not about this entity.

    Third, MFN2 is heavily studied as a general mitochondrial-dynamics and metabolism gene, in
    cardiac, hepatic, adipose and cancer biology. That literature is far larger than the
    neuropathy literature and is not about any disease curated here.
  evidence:
  - reference: PMID:32733278
    reference_title: Mitofusin 2 Dysfunction and Disease in Mice and Men.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A causal relationship between Mitofusin (MFN) 2 gene mutations and the hereditary axonal neuropathy Charcot-Marie-Tooth disease type 2A (CMT2A) was described over 15 years ago."
    explanation: >-
      The gene-disease relationship for MFN2 and axonal CMT, long established. Graded OTHER
      because a review's framing is an expert synthesis rather than a study.
  - reference: PMID:37804319
    reference_title: Homozygous MFN2 variants causing severe antenatal encephalopathy with clumped mitochondria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the MFN2 gene are commonly associated with autosomal dominant (CMT2A2A) or recessive (CMT2A2B) Charcot-Marie-Tooth disease, with possible involvement of the CNS."
    explanation: >-
      The dominant/recessive split named with both designations, which is the clearest published
      statement that CMT2A2A and CMT2A2B are the two allelic forms of one gene.
  - reference: PMID:26955893
    reference_title: "Autosomal recessive MFN2-related Charcot-Marie-Tooth disease with diaphragmatic weakness: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the mitofusin 2 gene (MFN2) are the most common cause of autosomal dominant Charcot-Marie-Tooth (CMT2) disease, which is typically characterized by axonal sensorimotor neuropathy."
    explanation: >-
      The scale of the dominant disease against which this biallelic form is rare, and the reason
      the gene's literature is dominated by CMT2A2A.
diagnosis:
- name: Sequencing, with the phasing question the diagnosis turns on
  description: >-
    There is no biomarker and no clinical feature that identifies this entity; the diagnosis is a
    sequencing result. What distinguishes it from the dominant form is not the variant list but
    the phase and the family study: two MFN2 variants must be shown to be in trans, and the
    parents should be examined rather than assumed unaffected, because a single-allele carrier of
    a semidominant missense variant may have a mild or subclinical neuropathy that changes the
    interpretation.

    A homozygous variant in a consanguineous family is the straightforward case. Compound
    heterozygosity is not, and the family in which a semidominant missense allele sat in trans
    with a phenotypically silent nonsense allele is the worked example of why: neither variant
    alone predicts the daughter's severe disease.
  evidence:
  - reference: PMID:29361379
    reference_title: A novel homozygous MFN2 mutation associated with severe and atypical CMT2 phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, it proposes the involvement of cerebellar peduncles observed at neuroimaging as a novel clue to suspect the diagnosis and address genetic testing."
    explanation: >-
      An imaging clue proposed for reaching the diagnosis, from the one report that suggested one.
      Recorded as a proposal from a single case rather than as an established diagnostic feature.
  - reference: PMID:26306937
    reference_title: "Mutational mechanisms in MFN2-related neuropathy: compound heterozygosity for recessive and semidominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her mother, carrying the p.R250W variant, had very late-onset minimal axonal neuropathy, whilst the father harboring the nonsense sequence change had neither clinical nor electrophysiological neuropathy."
    explanation: >-
      Why parental examination is part of the diagnosis rather than a formality - the two carrier
      parents were not equivalent, and only examination revealed it.
- name: Neuropathic pain is not a feature, and that is discriminating
  description: >-
    In a systematic clinical and laser-evoked-potential study of pain across CMT subtypes, the
    MFN2 patients - spanning CMT2A and CMT2A2B - were free of neuropathic pain and had entirely
    normal laser-evoked potentials, while neuropathic pain was significantly more frequent in
    CMT1A. Small-fibre involvement is what drives neuropathic pain in CMT, and MFN2 disease
    appears to spare it. A patient with an MFN2 genotype and prominent neuropathic pain is worth a
    second look.
  evidence:
  - reference: PMID:35129250
    reference_title: "Neuropathic pain in Charcot-Marie-Tooth disease: A clinical and laser-evoked potential study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MFN2-CMTs were NP free and LEPs recordings were all normal."
    explanation: The negative finding, in both its clinical and its neurophysiological form.
  - reference: PMID:35129250
    reference_title: "Neuropathic pain in Charcot-Marie-Tooth disease: A clinical and laser-evoked potential study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled 50 patients: 19 with duplication of PMP22 (CMT1A), 11 with mutation of MPZ (CMT1B, CMT2I/J, or CMTDID), 12 with mutation of GJB1 (CMTX1), and 8 with mutation of MFN2 (CMT2A and CMT2A2B)."
    explanation: >-
      The cohort behind that finding, including that the eight MFN2 patients span CMT2A and
      CMT2A2B without being separated - which is why the result is cited for MFN2 disease as a
      class rather than for this entity alone.
treatments:
- name: Supportive and rehabilitative care
  description: >-
    No disease-modifying therapy exists for CMT2A2B and none has been trialled. Management is the
    supportive care used across Charcot-Marie-Tooth disease and directed at what fails: physical
    and occupational therapy, orthoses and mobility aids, orthopaedic management of foot
    deformity, respiratory surveillance with ventilatory support where diaphragmatic or
    respiratory muscle weakness develops, and genetic counselling. None of that is specific to
    MFN2, and none of it is reported for these patients in the sources cited here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded with no evidence block and no target_mechanisms link, deliberately. There is no
    treatment publication for this entity, an evidence item requires an exact quote supporting the
    specific claim, and a mechanism link would assert an effect on the pathograph that nothing
    demonstrates. The one intervention actually reported in a biallelic patient - tracheostomy and
    mechanical ventilation for diaphragmatic paresis - is curated as part of that phenotype rather
    than as a treatment, because the source describes it as a consequence of the disease course
    rather than as a therapy with an assessed outcome.
- name: Pharmacological enhancement of mitochondrial fusion
  description: >-
    Mitofusin-activating peptides and small molecules have been developed, and a 2020 review
    discusses their potential for pharmacological enhancement of mitochondrial fusion and motility
    in CMT2A. This is the one therapeutic direction that targets the mechanism rather than the
    consequences.

    It is recorded here as a direction, not as a treatment. The review discusses potential
    applications; no trial in CMT2A of any inheritance pattern is cited in the sources available
    here, and nothing has been reported in a biallelic patient. There is also a mechanistic reason
    for caution specific to this entity: if the lesion is a dose of dysfunctional protein rather
    than a shortage of functional protein, a fusion-activating agent must act on the mutant
    protein to help, and whether it does is allele-dependent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mitofusin activation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No target_mechanisms link is declared. The agents act on the fusion step this entry curates as
    a node, so the link would be mechanistically natural, but declaring it would assert an effect
    on this disease's pathograph and the only source is a review discussing potential
    applications in CMT2A generally.
  evidence:
  - reference: PMID:32733278
    reference_title: Mitofusin 2 Dysfunction and Disease in Mice and Men.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Finally, in the context of recently described mitofusin activating peptides and small molecules, an overview is provided of potential therapeutic applications for pharmacological enhancement of mitochondrial fusion and motility in CMT2A and other neurodegenerative conditions."
    explanation: >-
      The therapeutic direction, described as potential applications. INDIRECT because it reports
      that such agents exist and are being discussed, not that they work in CMT2A, and it does not
      address the biallelic form at all.
differential_diagnoses:
- name: Charcot-Marie-Tooth disease type 2A2A (dominant MFN2)
  description: >-
    The same gene with one damaged allele instead of two: OMIM 609260, MONDO:0012231, and by far
    the commoner disease. It is not distinguished by its variant list, its nerve conduction
    pattern or its clinical features, which overlap completely - only by genotype, phase and
    family study. The practical separator is severity and age: the biallelic form is markedly
    more severe and earlier in onset. dismech curates the dominant form as a `has_subtypes` entry
    (`CMT2A`) on `Charcot-Marie-Tooth_Disease_Type_2` rather than as its own file.
  evidence:
  - reference: PMID:37804319
    reference_title: Homozygous MFN2 variants causing severe antenatal encephalopathy with clumped mitochondria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the MFN2 gene are commonly associated with autosomal dominant (CMT2A2A) or recessive (CMT2A2B) Charcot-Marie-Tooth disease, with possible involvement of the CNS."
    explanation: The two forms named side by side as the dominant and recessive faces of one gene.
- name: MFN2-related partial lipodystrophy and multiple symmetric lipomatosis
  description: >-
    The Named Entity Confusion trap for this gene. Recessive MFN2 variants also cause a partial
    lipodystrophy with multiple symmetric lipomatosis, a metabolic disease with no neuropathy, and
    MFN2 appears as a rare cause in genetically confirmed familial partial lipodystrophy cohorts.
    dismech curates that association in `Familial_Partial_Lipodystrophy`. It is listed here not
    because it is a clinical differential - the two diseases do not resemble each other - but
    because a literature or database search for biallelic MFN2 returns both, and a curator
    extending this entry from the gene will hit it.
  evidence:
  - reference: PMID:38887266
    reference_title: "Comprehensive analysis of morbidity and mortality patterns in familial partial lipodystrophy patients: insights from a population study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LMNA pathogenic variants were identified in 85.8% of patients, PPARG in 10.4%, PLIN1 in 2.8%, and MFN2 in 0.9%."
    explanation: >-
      MFN2 as a rare cause in a genetically confirmed familial partial lipodystrophy cohort, which
      is the other disease a gene-first search returns.
- name: Other severe early-onset axonal neuropathies
  description: >-
    Severe early-onset axonal neuropathy is a syndrome, not a gene: the founding paper describes
    it as a heterogeneous phenotype in which most cases are sporadic single cases and only some
    carry MFN2 variants, many of them de novo dominant. A child with this presentation therefore
    needs a panel rather than a single-gene test, and a de novo dominant MFN2 variant is at least
    as likely a priori as a biallelic one. GDAP1 is the other gene in the same clinical space and
    was found alongside MFN2 in the same consanguineous-family study cited in this entry.
  evidence:
  - reference: PMID:18458227
    reference_title: Severe early-onset axonal neuropathy with homozygous and compound heterozygous MFN2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases are sporadic single cases. Some have heterozygous mitofusin 2 (MFN2) mutations, many of which are de novo dominant mutations."
    explanation: >-
      The genetic heterogeneity of the presenting syndrome, and specifically that de novo dominant
      MFN2 is a competing explanation for an apparently sporadic severe case.
  - reference: PMID:37797217
    reference_title: Homozygous Mutations in GDAP1 and MFN2 Genes Resulted in Autosomal Recessive Forms of Charcot-Marie-Tooth Disease in Consanguineous Pakistani Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified that a novel nonsense mutation (c. 226 G>T) in GADP1 gene and a previously known missense mutation in MFN2 gene (c. 334 G>A) cause CMT4A (Charcot-Marie-Tooth disease type 4A) in the PAK-CMT1-DG KHAN family and CMT2A (Charcot-Marie-Tooth disease type 2A) in the PAK-CMT2-LAYYAH family, respectively."
    explanation: >-
      Two recessive CMT genes found side by side in one study of consanguineous families, which is
      the practical differential in that setting.
discussions:
- discussion_id: cmt2a2b_recessive_label_versus_semidominant_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Dysfunctional Mitofusin-2 Above the Semidominant Dosage Threshold
  - inheritance#Semidominant inheritance presenting as autosomal recessive
  prompt: >-
    If MFN2 disease is semidominant, is CMT2A2B a distinct entity or the severe end of one
    continuous dosage spectrum?
  rationale: >-
    Everything in this entry points at a continuum. A null allele alone is silent; a semidominant
    missense allele alone gives a mild or subclinical neuropathy; that missense allele opposite a
    null gives severe disease; two dysfunctional alleles give severe early-onset disease. There is
    no discontinuity anywhere in that series - only a rising dose of dysfunctional protein - and
    ClinGen's response has been to classify the gene-disease relationship as semidominant rather
    than splitting it by inheritance mode at all.

    Against that, OMIM and MONDO both assign separate identifiers (609260/MONDO:0012231 for
    CMT2A2A, 617087/MONDO:0014906 for this entity), the clinical severity difference is large
    enough to matter for counselling and prognosis, and the diagnostic reasoning genuinely differs
    - biallelic disease requires phasing and parental examination that dominant disease does not.

    This is not resolvable from the published data. What would move it is a systematic
    genotype-phenotype study of MFN2 carriers: examining and phenotyping single-allele carriers
    across many families to see whether their "minimal phenotypes" form a continuous distribution
    with the biallelic patients or a separate cluster.
- discussion_id: cmt2a2b_phenotypic_ceiling
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Fragmented and Clumped Mitochondrial Network
  - disease#Charcot-Marie-Tooth Disease, Axonal, Autosomal Recessive, Type 2A2B
  prompt: >-
    Where does CMT2A2B end and a distinct MFN2 developmental brain disorder begin?
  rationale: >-
    A fetus homozygous for an MFN2 in-frame deletion had severe antenatal encephalopathy with
    lissencephaly, polymicrogyria and cerebellar atrophy - a malformation of cortical development,
    not a neuropathy - and the authors describe it as the first reported severe developmental
    defect due to MFN2 deficiency. Separately, a homozygous child with an atypical severe CMT2
    phenotype had cerebellar peduncle abnormalities on neuroimaging, and the paper that names both
    CMT2A2A and CMT2A2B notes possible CNS involvement in MFN2 disease generally.

    So there is a gradient of central nervous system involvement in biallelic MFN2 disease that
    the CMT2A2B label does not describe, running from cerebellar imaging findings in a child with
    a neuropathy to a lethal fetal cortical malformation. Whether the antenatal case is the
    extreme of this entity or a separate MFN2 phenotype is unresolved, and the entry deliberately
    does not curate lissencephaly or polymicrogyria as CMT2A2B phenotypes. It uses that patient's
    fibroblast data for mechanism, where the observations are about MFN2 protein and mitochondria
    rather than about which disease label applies.

    This matters practically: it determines whether an MFN2 result should be considered in a fetus
    with a cortical malformation, which is a very different clinical context from a child with a
    neuropathy.
  proposed_experiments:
  - experiment_id: exp_cmt2a2b_cns_phenotype_survey
    name: Systematic CNS phenotyping of biallelic MFN2 patients
    description: >-
      Collect the reported biallelic MFN2 patients and prospectively image new ones with a common
      brain MRI protocol, and ask whether cerebellar and cortical findings correlate with residual
      mitofusin-2 function - by allele class and by fibroblast network phenotype - or occur
      independently of neuropathy severity.
    would_support:
    - pathophysiology#Fragmented and Clumped Mitochondrial Network
    supporting_outcome:
    - >-
      CNS findings scale with the severity of the fibroblast network defect, placing the antenatal
      case at the extreme of one continuum with the neuropathy patients.
    refuting_outcome:
    - >-
      CNS involvement segregates with particular alleles independently of network phenotype or
      neuropathy severity, which would argue for a separate MFN2 developmental entity rather than
      an extreme of this one.
notes: >-
  Scope and shape. entry_type DISEASE, standalone, with `parents` naming Charcot-Marie-Tooth
  Disease Type 2. The stub is deleted because MONDO:0014906 is now bound by this entry's
  disease_term.

  Why standalone rather than a has_subtypes on the CMT2 entry. Three things. dismech curates
  axonal CMT2 subtypes as separate files where they have their own MONDO term - 2C, 2JJ, 2P, 2S
  and 2T are all standalone, all with `parents: MONDO:0018993`. MONDO places MONDO:0014906
  directly under Charcot-Marie-Tooth disease rather than under CMT2A2 (MONDO:0012231, which has
  no children at all), so there is no ontology parent to attach it to as a subtype. And the
  biallelic form carries a distinct mechanistic claim - the semidominant dosage model - that the
  existing `CMT2A` subtype on `Charcot-Marie-Tooth_Disease_Type_2` does not make and could not
  carry, since a `Subtype` has no pathophysiology of its own.

  Overlap with the existing CMT2 entry, stated plainly. `Charcot-Marie-Tooth_Disease_Type_2`
  carries a `has_subtypes` entry named `CMT2A` described as MFN2-related, and it discusses MFN2 at
  length in prose framed around dominant missense variants. That subtype is CMT2A2A in substance
  though not in name, and it binds no MONDO term. This entry does not modify it. A reviewer may
  reasonably ask for a one-line cross-reference to be added there; that was left out to keep this
  PR to one file, and it is the obvious follow-up.

  The inheritance modelling is the part to look at hardest. The entity's name says autosomal
  recessive, the transmission pattern usually looks recessive, and HP:0000007 is bound - but the
  primary literature says the mechanism is semidominant, and ClinGen's expert panel assigns
  semidominant as the mode of inheritance. HPO has no semidominant term, so the mechanism is
  carried in the inheritance description, in a dedicated pathophysiology node, and in an
  OPEN_QUESTION discussion rather than in the binding. The `functional_impact_category` is
  DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION for the same reason, and its notes explain the
  observation that forces it - a carrier of an MFN2 nonsense allele had no neuropathy at all, so
  haploinsufficiency is not the mechanism.

  ClinGen is not cited as an evidence item. The current MFN2 / Charcot-Marie-Tooth disease type
  2A2 assertion (Definitive, semidominant, curated August 2026) is absent from the ClinGen
  snapshot pinned in `data/clingen/MANIFEST.yaml`; `just clingen-refresh` fails on checksum drift
  because upstream has published since the pin. The older assertion that *is* in the pinned
  snapshot carries the disease label "obsolete axonal hereditary motor and sensory neuropathy",
  which would be worse than not citing it. Building a cache file from an unpinned download would
  commit an artifact that cannot be reproduced from the pin, and a manifest repin is its own
  change. The classification is recorded in the `genetic` and `inheritance` prose with its source
  named, and the same conclusion is independently supported by two cited primary papers.

  What the antenatal case is used for, and what it is not. The homozygous fetus with
  lissencephaly, polymicrogyria and cerebellar atrophy supplies this entry's cell-biological
  mechanism - the clumped, tethered, unfusable mitochondria and the complex I deficiency without
  mtDNA instability. Its malformation phenotypes are deliberately *not* curated as CMT2A2B
  phenotypes; whether that patient belongs to this entity at all is the subject of a KNOWLEDGE_GAP
  discussion.

  What the deep-research report did and did not contribute. The falcon report committed alongside
  this entry passed preflight cleanly - MFN2 mentioned 85 times, dominating its gene counts,
  correct entity. It agrees with the entry on gene, protein, inheritance pattern and the
  requirement to demonstrate variants in trans, and it adds leads this entry could not verify
  against a cached reference: a 2017 Japanese MFN2 series with feature frequencies for the broader
  spectrum, and MFN1 as a strong experimental modifier. Neither is curated, because the quotes
  would have to come from full texts that could not be fetched.

  It is also worth recording what the report missed, because it is the entry's central claim: the
  report does not mention the semidominant literature at all, and at one point describes the
  entity as "recessive loss-of-function disease" in passing. That is the reading this entry argues
  against, on the strength of two primary papers the report did not surface. A reviewer weighing
  the DOMINANT_NEGATIVE choice should weigh the cited primary evidence rather than the report.

  What is not here. No animal model is curated: MFN2 mouse models exist in quantity but they model
  the gene and the dominant disease rather than this entity, and none was found that reproduces a
  biallelic human genotype. No dataset accession is recorded. No prevalence rate, no
  natural-history series, no treatment evidence, and no nerve pathology from a biallelic patient.
  Ages at onset for the three founding patients are not in the abstract, which is all that was
  retrievable for that paper - as it was for every reference in this entry.

name: Charcot-Marie-Tooth Disease, Axonal, Autosomal Recessive, Type 2A2B
category: Mendelian
creation_date: "2026-09-09T00:00:00Z"
synonyms:
- CMT2A2B
- Charcot-Marie-Tooth disease type 2A2B
- Charcot-Marie-Tooth disease, axonal, type 2A2B
- autosomal recessive MFN2-related Charcot-Marie-Tooth disease
- severe early-onset axonal neuropathy due to biallelic MFN2 variants
disease_term:
  preferred_term: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2A2B
  term:
    id: MONDO:0014906
    label: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2a2b;
description: >-
  CMT2A2B is the biallelic form of MFN2-related axonal Charcot-Marie-Tooth disease: the same
  gene as the far commoner dominant CMT2A2A, but two damaged alleles instead of one, and a
  markedly more severe, earlier-onset neuropathy as a result.

  The interesting thing about this entity is that "autosomal recessive" is a convenient label
  rather than an accurate mechanism, and the literature that defined it says so. The founding
  study examined the parents of three children with severe early-onset axonal neuropathy and
  homozygous or compound heterozygous MFN2 variants. Every parent carried one of the variants,
  and every parent was asymptomatic *or mildly symptomatic with signs of peripheral neuropathy* -
  a minimal phenotype rather than no phenotype. The authors' conclusion was that the disease can
  present as apparently recessive while the underlying mechanism is semi-dominant. A later family
  sharpened the point from the other direction: a compound heterozygote with a semidominant
  missense allele and a nonsense allele had severe disease, her mother carrying the missense
  allele alone had a very late-onset minimal neuropathy, and her father carrying the nonsense
  allele alone had no neuropathy at all clinically or electrophysiologically - so MFN2
  haploinsufficiency is not itself disease-causing. What matters is not how many alleles are
  broken but how much dysfunctional mitofusin-2 protein is present relative to functional
  protein. Expert curation reflects this: ClinGen assigns the MFN2 gene-disease relationship a
  semidominant mode of inheritance rather than either "autosomal dominant" or "autosomal
  recessive".

  Mitofusin-2 is a transmembrane GTPase of the mitochondrial outer membrane that mediates
  membrane fusion and shapes the mitochondrial network. When it fails, mitochondria fragment;
  in fibroblasts from one severely affected fetus they were seen clumped and tethered but unable
  to fuse. Fusion failure degrades mitochondrial quality control and the delivery of mitochondria
  down long axons, and the peripheral nerves of the arms and legs - the cells with the largest
  distance between soma and synapse - die back first. Why peripheral nerve in particular remains,
  in a 2020 review's words, largely unmet as a mechanistic question.

  Clinically the biallelic form is at the severe end of the MFN2 spectrum: onset in infancy or
  early childhood, progressive distal weakness with gait failure, loss of ambulation, and
  respiratory involvement later. Reported extensions include rapidly progressive diaphragmatic
  paresis requiring tracheostomy in a seven-month-old, cerebellar peduncle abnormalities on
  neuroimaging, and - at the extreme - a homozygous fetus with lissencephaly, polymicrogyria and
  cerebellar atrophy. There is no disease-modifying treatment. Mitofusin-activating peptides and
  small molecules exist and are discussed as a therapeutic direction for CMT2A generally; none
  has been tested in this entity.

phenotypes:
- name: Peripheral Axonal Neuropathy
  category: Nervous System
  description: >-
    A sensorimotor axonal neuropathy is the defining feature and is present in every reported
    patient. In the biallelic form it is severe and early: the founding series describes it as
    severe early-onset axonal neuropathy, and a seven-month-old with compound heterozygous
    variants had motor and sensory axonal neuropathy on nerve conduction study.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Sensorimotor axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  notes: >-
    Present in every reported patient, but by construction - the entity is defined as an axonal
    neuropathy, so the frequency describes the definition and not the penetrance of the genotype.
    VERY_FREQUENT rather than OBLIGATE for that reason, and because the reported patient set is
    small and scattered across single case reports rather than a cohort.
  evidence:
  - reference: PMID:18458227
    reference_title: Severe early-onset axonal neuropathy with homozygous and compound heterozygous MFN2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aim of this study was to investigate the mode of inheritance in three individuals with severe early-onset axonal neuropathy and homozygous or compound heterozygous MFN2 mutations."
    explanation: The neuropathy and its severity in the three founding patients.
  - reference: PMID:26955893
    reference_title: "Autosomal recessive MFN2-related Charcot-Marie-Tooth disease with diaphragmatic weakness: Case report and literature review."

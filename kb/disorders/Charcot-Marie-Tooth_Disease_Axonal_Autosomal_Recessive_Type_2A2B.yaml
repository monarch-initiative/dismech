    causal_link_type: DIRECT
- name: Length-Dependent Dying-Back Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    The clinical disease is a progressive dying-back degeneration of the longest peripheral motor
    and sensory axons - the arm and leg nerves - producing distal weakness and sensory loss that
    ascends over time. In the biallelic form the process starts in infancy or early childhood
    rather than in the second or third decade, progresses to gait failure and often to wheelchair
    dependence, and reaches respiratory muscle later.

    Why peripheral nerve is the tissue that fails is the standing unanswered question of MFN2
    biology, and this entry does not answer it. A 2020 review states directly that the challenge
    of defining the central mechanism linking mitochondrial abnormalities to progressive
    dying-back of peripheral arm and leg nerves is largely unmet.

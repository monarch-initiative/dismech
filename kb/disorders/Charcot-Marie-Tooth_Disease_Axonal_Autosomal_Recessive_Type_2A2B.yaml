    evidence_source: OTHER
    snippet: "Evidence for and against a regulatory role of mitofusins in mitochondrial transport is reviewed, nagging questions defined, and implications on mitochondrial fusion, quality control, and neuronal degeneration discussed."
    explanation: >-
      The explicit statement that the transport role is contested. INDIRECT because it establishes
      that the question is open rather than that the mechanism operates, and it is why this node's
      GO annotation carries a hedge in the description.
  downstream:

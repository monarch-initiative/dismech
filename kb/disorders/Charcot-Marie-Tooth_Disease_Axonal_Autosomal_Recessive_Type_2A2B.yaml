- name: Impaired Mitochondrial Quality Control and Axonal Delivery
  biological_scale: CELLULAR
  description: >-
    Fusion competence is how a cell decides which mitochondria to keep: organelles that can fuse
    are retained in the network, and those that cannot are sequestered and cleared by mitophagy.
    Losing mitofusin-2 therefore does more than fragment the network - it disrupts the sorting
    step, and it plausibly disrupts the delivery of mitochondria along axons to the distal
    terminals that depend on them.

    The delivery half of that is deliberately hedged. A 2020 review examines the evidence for and
    against a regulatory role of mitofusins in mitochondrial transport and treats it as an open
    question rather than settled, and the same review states that the central mechanism linking
    mitochondrial abnormalities to dying-back of peripheral nerves is largely unmet. This node
    names the candidate step; it does not claim it is proven.
  biological_processes:
  - preferred_term: mitochondrion transport along microtubule
    modifier: DECREASED
    term:
      id: GO:0047497
      label: mitochondrion transport along microtubule
  evidence:
  - reference: PMID:32733278
    reference_title: Mitofusin 2 Dysfunction and Disease in Mice and Men.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Here, a different perspective of why, in humans, MFN2 dysfunction preferentially impacts peripheral nerves is provided based on recent insights into its role in determining whether individual mitochondria will be fusion-competent and retained within the cell, or are fusion-impaired, sequestered, and eliminated by mitophagy."
    explanation: >-
      The quality-control mechanism this node names, and the reason it is proposed as the link to
      peripheral nerve. Graded OTHER because a review's proposal is an expert synthesis.
  - reference: PMID:32733278
    reference_title: Mitofusin 2 Dysfunction and Disease in Mice and Men.

pathophysiology:
- name: Biallelic MFN2 Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of MFN2, either homozygous or compound heterozygous. Reported
    configurations span the range: homozygosity for a missense allele in a consanguineous family,
    homozygosity for a novel allele in a sporadic child, compound heterozygosity for a deletion
    and a missense allele, and compound heterozygosity for a semidominant missense allele
    (p.R250W) with a nonsense allele (p.R476*). The last of these is the informative one, because
    the two alleles are known to behave differently on their own.
  genes:
  - preferred_term: MFN2
    term:
      id: hgnc:16877
      label: MFN2
  genetic_context:
    genes:
    - preferred_term: MFN2
      term:
        id: hgnc:16877
        label: MFN2
    allele_type: homozygous or compound heterozygous missense, nonsense and deletion alleles
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Zygosity varies between reported patients - homozygous in some families, compound
      heterozygous in others - so no single zygosity value describes the entity and the slot is
      left unset rather than asserting one family's configuration for all.
    notes: >-
      DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION, and the choice is deliberate. A pure
      loss-of-function reading predicts that a null allele in a heterozygote would be at least
      mildly deleterious; the observation is the opposite - a carrier father of a nonsense allele
      had neither clinical nor electrophysiological neuropathy, and the authors conclude MFN2
      haploinsufficiency is not disease causative. What is deleterious is the presence of
      dysfunctional protein, which is a dominant-negative behaviour, expressed at a dose that
      depends on how many alleles produce it. The value describes the disease-causing missense
      alleles; a nonsense allele in trans is not itself dominant-negative and contributes by
      removing the wild-type protein that would otherwise dilute the mutant.

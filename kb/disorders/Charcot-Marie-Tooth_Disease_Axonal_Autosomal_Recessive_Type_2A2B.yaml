    snippet: "This case highlights several clinical findings not typically associated with MFN2 pathogenic variants, including young age of onset and rapidly progressing diaphragmatic paresis that necessitated tracheostomy and mechanical ventilation, and adds to the growing list of features identified in autosomal recessive MFN2-related CMT2."

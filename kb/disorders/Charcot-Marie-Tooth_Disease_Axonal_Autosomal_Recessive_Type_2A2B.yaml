prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Rare enough that the literature is single case reports and small series rather than a cohort:
    the founding study of three individuals, a compound-heterozygous family, an infant case
    report, a homozygous child, a consanguineous Pakistani family, and a severe antenatal case.
    The 2016 case report describes biallelic MFN2 cases as infrequently described, which remains
    an accurate summary. A pain study that recruited MFN2 patients from a CMT clinic enrolled
    eight with MFN2 variants across CMT2A and CMT2A2B together without breaking down the two.

    No prevalence estimate exists for the biallelic form, and none can be derived - the numerator
    is a scattered case literature and there is no denominator at all. The prevalence_class is the
    numeric floor tier and no rate_per_100000 is given.
  evidence:
  - reference: PMID:26955893
    reference_title: "Autosomal recessive MFN2-related Charcot-Marie-Tooth disease with diaphragmatic weakness: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A review of the literature reveals that sporadic and familial cases of compound heterozygous or homozygous pathogenic MFN2 variants have been infrequently described, which indicates that MFN2 can also be inherited in a recessive manner."
    explanation: >-
      The size of the biallelic literature as assessed by a group that reviewed it - infrequent
      case reports, not a series.

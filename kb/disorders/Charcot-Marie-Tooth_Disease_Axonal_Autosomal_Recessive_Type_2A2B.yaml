- name: Respiratory Chain Deficiency in Patient Fibroblasts
  biological_scale: CELLULAR
  description: >-
    Fibroblasts from the homozygous fetus showed deficiencies of multiple respiratory chain
    complexes with complex I most severely affected - and, importantly, without mitochondrial DNA
    instability. The absence of an mtDNA lesion matters, because MFN2 sits in a group of genes
    (with OPA1 and POLG) where mtDNA depletion or deletion is a common downstream mechanism; here
    the bioenergetic defect follows from the disordered network directly rather than through
    genome damage.

    This is a single fibroblast study in the most severe reported genotype, so it is curated as a
    cellular observation rather than as an established feature of the entity.

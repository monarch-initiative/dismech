differential_diagnoses:
- name: Acute zonal occult outer retinopathy
  disease_term:
    preferred_term: acute zonal occult outer retinopathy
    term:
      id: MONDO:0017298
      label: acute zonal occult outer retinopathy
  description: >-
    AZOOR shares acute photopsia, scotoma, and outer retinal dysfunction with
    AAOR. Whether AAOR is a distinct disorder or a visible annular variant of
    AZOOR remains unresolved.
  distinguishing_features:
  - AAOR has a clinically visible gray-white annular or incomplete peripapillary border aligned with the field defect.
  - The broader AZOOR diagnosis includes occult or zonal disease without the classic annular lesion.
  evidence:
  - reference: PMID:11078842
    reference_title: "Acute annular outer retinopathy: report of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute annular outer retinopathy may be a distinct entity or it may
      represent a variant of acute zonal occult outer retinopathy retinopathy.
    explanation: >-
      The AAOR case series explicitly records the unresolved disease boundary.
- name: Autoimmune and paraneoplastic retinopathy
  disease_term:
    preferred_term: autoimmune retinopathy
    term:
      id: MONDO:0100014
      label: autoimmune retinopathy
  description: >-
    Autoimmune or paraneoplastic outer retinal disease is a relevant alternative
    when malignancy and a corresponding autoreactive-antibody profile are
    present. Antiretinal antibodies have also been reported in AAOR, so antibody
    positivity alone does not settle the distinction.
  distinguishing_features:
  - A characteristic advancing annular lesion supports AAOR morphology.
  - A cancer-associated syndrome with a corresponding autoantibody profile supports a paraneoplastic alternative.
  evidence:
  - reference: PMID:24428923
    reference_title: "A case of paraneoplastic optic neuropathy and outer retinitis positive for autoantibodies against collapsin response mediator protein-5, recoverin, and α-enolase."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific cross-reacting autoimmunity against recoverin or collapsin
      response mediator protein (CRMP)-5 is known to cause cancer-associated
      retinopathy or paraneoplastic optic neuropathy, respectively.
    explanation: >-
      This supports the existence of an antibody-associated paraneoplastic outer
      retinal alternative, but it is not a direct AAOR comparison study.
  - reference: PMID:18195232
    reference_title: Association of antiretinal antibodies in acute annular outer retinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Association of antiretinal antibodies in acute annular outer retinopathy.
    explanation: >-
      The title documents antibody association in AAOR, but the cached record has
      no abstract with which to assess specificity.
- name: Syphilitic outer retinitis
  description: >-
    Syphilitic outer retinitis can closely resemble an AZOOR-like outer retinal
    disorder on FAF and OCT and is important because antimicrobial treatment can
    improve the structural and visual abnormalities.
  distinguishing_features:
  - Positive syphilis testing and compatible inflammatory findings favor infection.
  - Ellipsoid-zone and FAF abnormalities can improve after parenteral penicillin.
  evidence:
  - reference: PMID:28297032
    reference_title: Ultra-Wide-Field Fundus Autofluorescence and Spectral-Domain Optical Coherence Tomography Findings in Syphilitic Outer Retinitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SOR can present similarly to AZOOR on UWFFAF and should be highly
      suspected in cases presenting like AZOOR.
    explanation: >-
      The series explicitly identifies syphilitic outer retinitis as an
      AZOOR-like mimic.
  - reference: PMID:28297032
    reference_title: Ultra-Wide-Field Fundus Autofluorescence and Spectral-Domain Optical Coherence Tomography Findings in Syphilitic Outer Retinitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with parenteral penicillin led to improvement of outer
      retinopathy, visual acuity, and symptoms.
    explanation: >-
      The same series directly supports clinical improvement after antimicrobial
      treatment.
- name: Optic neuritis
  disease_term:
    preferred_term: optic neuritis
    term:
      id: MONDO:0005885
      label: optic neuritis
  description: >-
    Sudden visual loss, subtle initial fundus findings, and field defects can
    lead to an erroneous optic-neuritis diagnosis when the primary lesion is in
    the outer retina.
  distinguishing_features:
  - AAOR shows photoreceptor-layer and FAF abnormalities aligned with the field defect.
  - Objective evidence localizing disease to the optic nerve favors optic neuritis.
  evidence:
  - reference: PMID:37685787
    reference_title: "Acute-Onset Retinal Conditions Mimicking Acute Optic Neuritis: Overview and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multimodal retinal imaging is essential in detecting these conditions and
      in their differential diagnosis.
    explanation: >-
      The review supports multimodal retinal imaging to distinguish acute
      retinal disorders from optic neuritis.
- name: Retinitis pigmentosa and other inherited retinal dystrophies
  disease_term:
    preferred_term: retinitis pigmentosa
    term:
      id: MONDO:0019200
      label: retinitis pigmentosa
  description: >-
    Inherited retinal dystrophies can produce field loss, photoreceptor atrophy,

discussions:
- discussion_id: aaor_aor_azoor_nosology
  prompt: >-
    Are classic annular AAOR, nonannular acute outer retinopathy, and AZOOR one
    disease spectrum or overlapping disorders with distinct causes?
  kind: CONTROVERSY
  status: UNDER_DISCUSSION
  attaches_to:
  - disease#Acute Annular Outer Retinopathy
  rationale: >-
    Collapsing the terms obscures differences in visible lesion morphology,
    cohort composition, frequency estimates, prognosis, and possible etiology.
  evidence:
  - reference: PMID:11078842
    reference_title: "Acute annular outer retinopathy: report of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute annular outer retinopathy may be a distinct entity or it may
      represent a variant of acute zonal occult outer retinopathy retinopathy.
    explanation: >-
      Classic AAOR literature explicitly leaves the AAOR-AZOOR boundary open.
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although distinct patterns of lesion distribution were observed, their
      consistent features on multimodal imaging support their inclusion within
      a unified disease spectrum termed AOR.
    explanation: >-
      The newer multicenter cohort proposes a broader unifying AOR spectrum.
- discussion_id: aaor_upstream_cause
  prompt: >-
    What initiates AAOR, and are antiretinal antibodies, viral associations,
    immune dysregulation, and malignancy causal, secondary, or coincidental?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Putative Immune Boundary Injury
  - pathophysiology#Putative Viral-Infection Initiation
  rationale: >-
    The founding report did not determine a cause, and the HIV-associated report
    did not determine the role of HIV infection or secondary immunosuppression.
    These observations leave the proposed upstream routes unresolved.
  evidence:
  - reference: PMID:7872395
    reference_title: Acute annular outer retinopathy as a variant of acute zonal occult outer retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cause of this disorder, which affects primarily the outer retina, was
      not determined.
    explanation: >-
      The founding report explicitly states that the cause was undetermined.
  - reference: PMID:30455116
    reference_title: Acute annular outer retinopathy associated with human immunodeficiency virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even so, the precise role played by HIV infection or secondary
      immunosuppression in the development of the AAOR is not known.
    explanation: >-
      The infection-associated report preserves causal uncertainty.
- discussion_id: aaor_disease_modifying_treatment
  prompt: >-
    Can any early intervention prevent lesion enlargement or outer retinal
    atrophy in AAOR, and which patients should be selected for treatment trials?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Acute Photoreceptor and Henle-Layer Injury
  - pathophysiology#Outer Retinal Atrophy
  - treatment#Serial multimodal retinal monitoring
  rationale: >-
    Treatment reports are uncontrolled, phenotypes and diagnostic labels vary,
    and the largest observational series found no intervention that appeared to
    halt lesion enlargement or complete atrophy.
  evidence:
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the therapeutic interventions appeared effective in halting the
      progression to complete outer retinal atrophy or preventing lesion
      enlargement.
    explanation: >-
      This directly defines the current therapeutic evidence gap.

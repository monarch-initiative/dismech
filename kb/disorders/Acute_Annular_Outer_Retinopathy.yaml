name: Acute Annular Outer Retinopathy
creation_date: '2026-05-04T19:32:38Z'
description: >-
  Acute annular outer retinopathy (AAOR) is a rare, acutely presenting outer
  retinal disorder defined by a visible gray-white annular or incomplete
  peripapillary lesion aligned with visual-field loss. Optical coherence
  tomography and fundus autofluorescence show injury at the photoreceptor,
  outer nuclear, Henle fiber, ellipsoid-zone, and retinal pigment epithelium
  levels. The lesion typically enlarges over the first weeks and then leaves
  outer retinal atrophy and pigmentary change. Its cause is unknown; immune,
  infection-associated, and paraneoplastic explanations remain hypotheses.
  AAOR has historically been placed within the acute zonal occult outer
  retinopathy (AZOOR) spectrum, while newer work uses acute outer retinopathy
  (AOR) for a broader range of lesion distributions. Those labels are related
  but should not be treated as interchangeable.
category: Complex
disease_term:
  preferred_term: acute annular outer retinopathy
  term:
    id: MONDO:0017299
    label: acute annular outer retinopathy
synonyms:
- AAOR
parents:
- Acute disease
- Eye disorder
progression:
- phase: Acutely progressive stage
  duration: 1 to 3 weeks
  notes: >-
    The peripapillary annular band advances during the early stage, with loss of
    the ellipsoid zone, thinning of the outer nuclear layer, and increased
    choroidal thickness within the affected region.
  evidence:
  - reference: PMID:40446848
    reference_title: "Acute annular outer retinopathy: initial insights into clinical course variations with multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical course was subdivided acutely progressive stage (APS),
      stationary stage (SS) and atrophic stage (AS) (1-3 weeks, 3 weeks to 3
      months and >3 months, respectively).
    explanation: >-
      The AAOR case series defines the early progressive interval and the two
      later stages.
  - reference: PMID:40446848
    reference_title: "Acute annular outer retinopathy: initial insights into clinical course variations with multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During APS, advancement of peripapillary annular band was noted in all eyes, accompanied by absent ellipsoid zone, increased choroidal thickness (ChT) and thinned outer nuclear layer (ONL) within the affected area."  # codespell:ignore-line
    explanation: >-
      This directly describes structural change while the annular lesion is
      advancing.
- phase: Stationary stage
  duration: Approximately 3 weeks to 3 months
  notes: >-
    Lesion size usually stabilizes after the initial weeks. The visible annular
    band can fade even though damaged retina remains abnormal and proceeds
    toward atrophy.
  evidence:
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lesion progression primarily occurred within the initial weeks after
      presentation and stabilized in size beyond this period in the majority of
      eyes.
    explanation: >-
      The multicenter AOR-spectrum cohort supports early enlargement followed
      by size stabilization in most eyes.
  - reference: PMID:40446848
    reference_title: "Acute annular outer retinopathy: initial insights into clinical course variations with multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During SS, annular band disappeared on fundus photograph with improved ONL with improved ONL."  # codespell:ignore-line
    explanation: >-
      The AAOR stage series directly supports fading of the visible annular band
      during the stationary interval.
- phase: Atrophic stage
  duration: More than 3 months after onset
  notes: >-
    Previously involved retina develops outer retinal atrophy, depigmentation,
    and scattered pigmentary change. Structural recovery can occur at the fovea
    in some eyes, but atrophy progresses in areas formerly occupied by the
    white ring.
  evidence:
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over time, affected areas progressed to outer retinal atrophy with
      pigmentary changes.
    explanation: >-
      This directly establishes the chronic structural outcome in the larger
      AOR-spectrum cohort.
  - reference: PMID:40446848
    reference_title: "Acute annular outer retinopathy: initial insights into clinical course variations with multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During AS, affected area became depigmented with scattered pigmentation,
      exhibiting hyper-AF or mixed AF.
    explanation: >-
      The AAOR stage series directly describes pigmentary and autofluorescence
      changes after three months.
  - reference: PMID:25383859
    reference_title: New insights into acute annular outer retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We documented restoration of foveal photoreceptors, which corresponded
      with visual recovery. We also noted progressive atrophy in areas where the
      white ring was previously visible.
    explanation: >-
      Longitudinal OCT in a classic AAOR case shows that focal foveal recovery
      and persistent regional atrophy can coexist.
- phase: Long-term visual outcome
  notes: >-
    Central acuity is strongly influenced by whether the macula is involved.
    Eyes with macular sparing can retain normal acuity, whereas macular
    involvement can leave severe persistent impairment.
  evidence:
  - reference: PMID:40446848
    reference_title: "Acute annular outer retinopathy: initial insights into clinical course variations with multimodal imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven eyes of 5 patients showed no macular involvement with best corrected
      visual acuity (BCVA) of 20/20, while 5 eyes of 5 patients showed macular
      involvement with poorer BCVA of HM-20/400 at the last visit.
    explanation: >-
      This case series directly links macular involvement to worse final visual
      acuity.
mechanistic_hypotheses:
- hypothesis_group_id: immune_boundary_injury
  hypothesis_label: Immune-mediated boundary-injury model
  status: EMERGING
  description: >-
    The visible gray annular border has been proposed to represent an advancing
    immune boundary between normal and abnormal outer retina. Antiretinal
    antibodies have also been reported in AAOR, but neither finding establishes
    a specific antigen, effector pathway, or causal autoimmune mechanism.
  evidence:
  - reference: PMID:7872395
    reference_title: Acute annular outer retinopathy as a variant of acute zonal occult outer retinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We speculate that this disorder is part of the spectrum of acute zonal
      occult outer retinopathy and that the gray border, which separates the
      normal from the abnormal retina, represents an immune ring phenomenon.
    explanation: >-
      The founding report explicitly labels the immune-ring interpretation as
      speculation, so it supports a hypothesis rather than an established
      mechanism.
  - reference: PMID:18195232
    reference_title: Association of antiretinal antibodies in acute annular outer retinopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Association of antiretinal antibodies in acute annular outer retinopathy.
    explanation: >-
      The publication documents an antibody association, but its cached record
      contains no abstract capable of establishing causality or specificity.
- hypothesis_group_id: infection_associated_initiation
  hypothesis_label: Viral-infection initiation model
  status: EMERGING
  description: >-
    An isolated HIV-associated report lists viral infection as one proposed
    explanation alongside an autoimmune mechanism. It does not determine whether
    HIV infection or secondary immunosuppression contributed to AAOR.
  evidence:
  - reference: PMID:30455116
    reference_title: Acute annular outer retinopathy associated with human immunodeficiency virus.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aetiology of AAOR remains unknown, although a viral infection or an
      autoimmune mechanism has been suggested.
    explanation: >-
      The case report describes the proposed routes while explicitly retaining
      etiologic uncertainty.
  - reference: PMID:30455116
    reference_title: Acute annular outer retinopathy associated with human immunodeficiency virus.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even so, the precise role played by HIV infection or secondary
      immunosuppression in the development of the AAOR is not known.
    explanation: >-
      The authors specifically warn that the HIV association does not establish
      a mechanism.

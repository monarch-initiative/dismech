  evidence:
  - reference: PMID:38454854
    reference_title: Current understanding of acute zonal occult outer retinopathy (AZOOR).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This condition, distinct from genetic disorders like retinitis pigmentosa,
      lacks a hereditary basis and exhibits unique fundus changes and imaging
      features indicative of outer retinal dysfunction.
    explanation: >-
      The source directly contrasts AZOOR with inherited retinitis pigmentosa;
      applying that distinction to AAOR is an AZOOR-spectrum extrapolation.
treatments:
- name: Serial multimodal retinal monitoring
  action_category: MONITORING
  description: >-
    In an expanded AOR cohort, the interventions used did not appear to prevent
    lesion enlargement or complete outer-retinal atrophy. Serial ophthalmologic
    examination and imaging can document the evolving retinal changes.
  treatment_term:
    preferred_term: ophthalmologist evaluation
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the therapeutic interventions appeared effective in halting the
      progression to complete outer retinal atrophy or preventing lesion
      enlargement.
    explanation: >-
      The broader AOR cohort found no apparent benefit from its observed
      interventions; this is not a controlled efficacy estimate for classic
      annular-only AAOR.
  - reference: PMID:25383859
    reference_title: New insights into acute annular outer retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used Spectralis OCT to image the transient intraretinal whitening that
      is initially seen in this disorder, and the OCT changes during follow-up.
    explanation: >-
      This AAOR case directly supports longitudinal OCT documentation of the
      evolving structural changes.

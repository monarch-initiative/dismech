diagnosis:
- name: Multimodal retinal evaluation
  description: >-
    Diagnosis is clinical and imaging-based. Ophthalmoscopy, OCT, FAF, visual
    field testing, and selected electrophysiology can be interpreted together
    with assessment for relevant mimics.
  diagnosis_term:
    preferred_term: ophthalmologist evaluation
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: >-
    Concordance among an acute outer retinal lesion, field defect, OCT layer
    disruption, and FAF abnormality supports AAOR.
  evidence:
  - reference: PMID:40436146
    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific multimodal imaging signatures of AOR were identified, including
      findings from ophthalmoscopy, fundus autofluorescence (FAF), fluorescein
      angiography, indocyanine green angiography (ICGA), and OCT.
    explanation: >-
      The largest longitudinal series supports a multimodal diagnostic
      approach.
- name: Optical coherence tomography
  description: >-
    OCT localizes reported AAOR abnormalities, including acute Henle-layer and
    outer-nuclear-layer hyperreflectivity, ellipsoid-zone or
    external-limiting-membrane disruption in affected lesions, and outer-retinal
    atrophy on follow-up. These observations do not establish one invariant
    structural sequence.
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  results: >-
    ASHH, ellipsoid-zone loss, external limiting membrane disruption, outer
    nuclear layer change, and later outer retinal atrophy support AAOR and map
    its extent.
  evidence:
  - reference: PMID:25383859
    reference_title: New insights into acute annular outer retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found hyperreflectivity in the outer nuclear layer and the Henle fiber
      layer along with marked atrophy of the outer retina within the white ring.
    explanation: >-
      The first acute-phase spectral-domain OCT report provides direct
      layer-level diagnostic evidence.
  - reference: PMID:30079710
    reference_title: "[Multimodal Imaging of a Case of Acute Annular Outer Retinopathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

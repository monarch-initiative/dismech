    reference_title: "Clinical and Multimodal Imaging of Acute Outer Retinopathy: Expanding the Spectrum of Acute Annular Outer Retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute outer retinopathy is characterized by early photoreceptor
      disruption, evidenced by ASHH on OCT, leading to rapid outer retinal
      atrophy and subsequent degeneration of the retinal pigment epithelium
      within the damaged zones.
    explanation: >-
      The multicenter longitudinal series identifies the earliest structural
      abnormality and its subsequent trajectory.
  downstream:
  - target: Ellipsoid Zone and Outer Nuclear Layer Disruption
    description: >-
      Acute photoreceptor-associated hyperreflectivity and disruption of the
      ellipsoid and external limiting membrane bands occur within annular outer
      retinal lesions. Their direct causal ordering is not established.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:30079710
      reference_title: "[Multimodal Imaging of a Case of Acute Annular Outer Retinopathy]."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        OCT demonstrated an indistinct ellipsoid zone, disruption of external
        limiting membrane, and bulging of the retinal pigment epithelium in the
        annular lesions.
      explanation: >-
        Cross-sectional multimodal imaging co-localizes outer retinal
        abnormalities but does not establish that one directly causes another.
  - target: Photopsia
    description: >-

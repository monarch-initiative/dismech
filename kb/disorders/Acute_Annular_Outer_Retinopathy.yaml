- name: Acute Photoreceptor and Henle-Layer Injury
  description: >-
    Acute yellow-gray outer retinal lesions correspond on OCT to early
    photoreceptor disruption and angular hyperreflectivity involving the Henle
    fiber layer. This structural injury is the best-supported early disease
    event.
  locations:

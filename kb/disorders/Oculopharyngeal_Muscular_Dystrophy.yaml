name: Oculopharyngeal Muscular Dystrophy
creation_date: "2026-09-21T00:00:00Z"
category: Mendelian
description: >-
  Oculopharyngeal muscular dystrophy (OPMD) is an adult-onset, usually autosomal
  dominant myopathy caused by a short GCN (GCG) trinucleotide repeat expansion in
  the first exon of PABPN1, which lengthens the N-terminal polyalanine tract of
  the nuclear poly(A)-binding protein. The expanded protein misfolds and
  self-associates into tubulofilamentous intranuclear inclusions in skeletal
  muscle fibres - the pathological hallmark of the disease - which also
  sequester poly(A) RNA, ubiquitin and proteasome subunits. Clinically OPMD
  presents in the fifth to sixth decade with progressive bilateral ptosis and
  dysphagia from selective involvement of eyelid and pharyngeal muscles,
  followed by proximal limb girdle weakness; dysphagia determines prognosis
  through aspiration and malnutrition. A rarer allelic autosomal recessive form
  arises from homozygosity for the common (GCG)7 allele or for other biallelic
  expansions. OPMD must be distinguished from oculopharyngodistal myopathy
  (OPDM), a clinicopathologically similar but genetically distinct disease
  caused by non-coding CGG repeat expansions in LRP12, GIPC1, NOTCH2NLC or
  RILPL1.
synonyms:
- OPMD
- muscular dystrophy, oculopharyngeal
- oculopharyngeal muscular dystrophy
disease_term:
  preferred_term: oculopharyngeal muscular dystrophy
  term:
    id: MONDO:0008116
    label: oculopharyngeal muscular dystrophy
parents:
- progressive muscular dystrophy
- myopathy of extraocular muscle
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The great majority of OPMD is transmitted as an age-dependent autosomal
    dominant trait, with a heterozygous GCN repeat expansion in the first exon
    of PABPN1 accounting for roughly 90% of affected individuals.
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      OPMD is inherited in an autosomal dominant manner.
    explanation: >-
      States the dominant mode of inheritance for OPMD. Evidence source is OTHER
      because GeneReviews is an expert-curated clinical synopsis rather than a
      primary study.
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a heterozygous GCN trinucleotide repeat expansion of 11 to 18 repeats in
      the first exon of PABPN1 (~90% of affected individuals)
    explanation: >-
      Quantifies the share of affected individuals carrying a single expanded
      PABPN1 allele, supporting dominant inheritance as the usual mechanism.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A rarer allelic recessive form occurs, classically through homozygosity for
    the (GCG)7 allele that is polymorphic in the general population, and also
    through other biallelic GCN expansions. Recessive OPMD has later onset and
    milder, more variable disease than the dominant form.
  evidence:
  - reference: PMID:9462747
    reference_title: "Short GCG expansions in the PABP2 gene cause oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More severe phenotypes were observed in compound heterozygotes for the
      (GCG)9 mutation and a (GCG)7 allele that is found in 2% of the population,
      whereas homozygosity for the (GCG)7 allele leads to autosomal recessive
      OPMD.
    explanation: >-
      Establishes both the recessive form arising from (GCG)7 homozygosity and
      the modifier role of the same allele in compound heterozygotes.
  - reference: PMID:26494409
    reference_title: "Dropped-head in recessive oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are a few reports of the recessive form, which has a later disease
      onset with milder symptoms and higher clinical variability than the
      typical dominantly inherited form.
    explanation: >-
      Contrasts the clinical course of recessive OPMD with the dominant form,
      supporting the description of this inheritance block.
pathophysiology:
- name: PABPN1 Polyalanine Tract Expansion
  description: >-
    A short GCN (GCG) trinucleotide repeat in the first exon of PABPN1 expands
    from the normal (GCG)6 to (GCG)8-13, lengthening the N-terminal polyalanine
    tract of the nuclear poly(A)-binding protein. PABPN1 normally binds nascent
    poly(A) tails with high affinity and controls their extension and length, so
    the lesion falls on a protein with a defined nuclear RNA-processing role.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PABPN1
    term:
      id: hgnc:8565
      label: PABPN1
  molecular_functions:
  - preferred_term: poly(A) binding
    term:
      id: GO:0008143
      label: poly(A) binding
  biological_processes:
  - preferred_term: mRNA 3'-end processing
    term:
      id: GO:0031124
      label: mRNA 3'-end processing
  evidence:
  - reference: PMID:9462747
    reference_title: "Short GCG expansions in the PABP2 gene cause oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A (GCG)6 repeat encoding a polyalanine tract located at the N terminus of
      the protein was expanded to (GCG)8-13 in the 144 OPMD families screened.
    explanation: >-
      The founding genetic study identifying the expanded polyalanine-encoding
      repeat in PABPN1 (then PABP2) across 144 OPMD families.
  - reference: PMID:14526187
    reference_title: "Oculopharyngeal muscular dystrophy: a late-onset polyalanine disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mutations cause the lengthening of an N-terminal polyalanine domain.
    explanation: >-
      States the protein-level consequence of the repeat expansion that defines
      this node. Evidence source is OTHER because this is a review.
  - reference: PMID:11001936
    reference_title: "Nuclear inclusions in oculopharyngeal muscular dystrophy consist of poly(A) binding protein 2 aggregates which sequester poly(A) RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This gene encodes the poly(A) binding protein 2 (PABP2), an abundant
      nuclear protein that binds with high affinity to nascent poly(A) tails,
      stimulating their extension and controlling their length.
    explanation: >-
      Establishes the normal nuclear poly(A)-binding and polyadenylation-control
      function of the mutated protein, grounding the molecular-function and
      biological-process bindings on this node.
  downstream:
  - target: PABPN1 Misfolding and Intranuclear Aggregation
    description: >-
      The lengthened polyalanine tract renders PABPN1 aggregation-prone, so the
      expanded protein misfolds and accumulates as insoluble oligomers rather
      than remaining dispersed in the nucleoplasm.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9462747
      reference_title: "Short GCG expansions in the PABP2 gene cause oculopharyngeal muscular dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathological expansions of the polyalanine tract may cause mutated PABP2
        oligomers to accumulate as filament inclusions in nuclei.
      explanation: >-
        Directly links the polyalanine expansion to nuclear accumulation of the
        mutated protein as filamentous inclusions.
- name: PABPN1 Misfolding and Intranuclear Aggregation
  description: >-
    Expanded PABPN1 misfolds and self-associates into insoluble, tubulofilamentous
    intranuclear inclusions roughly 8.5 nm in outer diameter within skeletal
    muscle fibre nuclei. These inclusions are the pathological hallmark of OPMD,
    are decorated by anti-PABPN1 antibodies, and contain a salt-extraction-resistant
    form of the protein. They appear in muscle biopsies of presymptomatic
    Ala-expanded PABPN1 carriers, placing aggregation upstream of clinical
    weakness.
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  cellular_components:
  - preferred_term: nuclear inclusion body
    term:
      id: GO:0042405
      label: nuclear inclusion body
  evidence:
  - reference: PMID:11001936
    reference_title: "Nuclear inclusions in oculopharyngeal muscular dystrophy consist of poly(A) binding protein 2 aggregates which sequester poly(A) RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggests that the polyalanine expansions in PABP2 induce a misfolding
      and aggregation of the protein into insoluble inclusions, similarly to
      events in neurodegenerative diseases caused by CAG/polyglutamine
      expansions.
    explanation: >-
      States the misfolding-and-aggregation mechanism this node models, and
      situates it alongside the polyglutamine proteotoxicity diseases.
  - reference: PMID:11001936
    reference_title: "Nuclear inclusions in oculopharyngeal muscular dystrophy consist of poly(A) binding protein 2 aggregates which sequester poly(A) RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this work we report that PABP2 is detected in filamentous nuclear
      inclusions, which are the pathological hallmark of OPMD.
    explanation: >-
      Identifies the aggregating species inside the hallmark inclusions as
      PABPN1 itself.
  - reference: PMID:8628475
    reference_title: "Intranuclear inclusions in oculopharyngeal muscular dystrophy among Bukhara Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical tubulofilamentous intranuclear inclusions (INI) of 8.5 nm outer
      diameter were present in all cases.
    explanation: >-
      Electron-microscopic characterisation of the inclusion ultrastructure and
      calibre quoted in this node's description.
  - reference: PMID:27854203
    reference_title: "Intranuclear Aggregates Precede Clinical Onset in Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This indicates that the expression of Ala-expanded-PABPN1 causes the
      formation of nuclear aggregates before the onset of muscle weakness.
    explanation: >-
      Places aggregation causally upstream of clinical weakness by demonstrating
      it in presymptomatic carriers.
  downstream:
  - target: Sequestration of Poly(A) RNA and Proteostasis Machinery
    description: >-
      The insoluble inclusions act as a sink, trapping poly(A) RNA together with
      ubiquitin, proteasome subunits and chaperones.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11001936
      reference_title: "Nuclear inclusions in oculopharyngeal muscular dystrophy consist of poly(A) binding protein 2 aggregates which sequester poly(A) RNA."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, the nuclear inclusions were shown to sequester poly(A) RNA.
      explanation: >-
        Directly demonstrates that the aggregates sequester poly(A) RNA, which
        is the downstream node.
  - target: Skeletal Muscle Fibre Degeneration
    description: >-
      Accumulating intranuclear aggregate burden in eyelid, pharyngeal and limb
      girdle muscle fibres accompanies the myopathic, rimmed-vacuolar changes of
      OPMD. Inclusion frequency correlates with the number of abnormal alleles.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:8628475
      reference_title: "Intranuclear inclusions in oculopharyngeal muscular dystrophy among Bukhara Jews."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results confirm that INI are pathognomonic for OPMD and suggest that
        their frequency may be quantitatively related to the number of abnormal
        DNA copies.
      explanation: >-
        Links inclusion burden to allele dosage, which parallels the more severe
        muscle disease seen in biallelic carriers. Marked INDIRECT because the
        quote establishes a dose-frequency relationship rather than directly
        demonstrating that inclusions cause fibre degeneration.
- name: Sequestration of Poly(A) RNA and Proteostasis Machinery
  description: >-
    The intranuclear inclusions trap poly(A) mRNA together with ubiquitin,
    proteasome subunits and the chaperones HSP40 and HSP70. Sequestering both the
    RNA cargo of PABPN1 and the machinery that would normally clear misfolded
    protein is the proposed route by which aggregation becomes toxic, potentially
    interfering with nuclear export of poly(A) RNA.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:11001936
    reference_title: "Nuclear inclusions in oculopharyngeal muscular dystrophy consist of poly(A) binding protein 2 aggregates which sequester poly(A) RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, the inclusions were labeled with antibodies directed against
      ubiquitin and the subunits of the proteasome and contained a form of PABP2
      that was more resistant to salt extraction than the protein dispersed in
      the nucleoplasm.
    explanation: >-
      Demonstrates co-sequestration of ubiquitin and proteasome subunits within
      the inclusions, and the insolubility of the trapped PABPN1.
  - reference: PMID:14526187
    reference_title: "Oculopharyngeal muscular dystrophy: a late-onset polyalanine disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The INIs also contain ubiquitin, proteasome subunits, HSP 40, HSP 70,
      SKIP, and abundant poly(A)-mRNA.
    explanation: >-
      Enumerates the sequestered proteostasis components and RNA cargo listed in
      this node. Evidence source is OTHER because this is a review.
  notes: >-
    The exact route from sequestration to muscle fibre loss remains unsettled.
    Brais 2003 (PMID:14526187) states that the mechanism responsible for
    polyalanine toxicity in OPMD is unknown and that both inclusion-dependent
    and inclusion-independent models have been proposed; this entry therefore
    does not assert a specific toxic effector downstream of sequestration.
  downstream:
  - target: Skeletal Muscle Fibre Degeneration
    description: >-
      Loss of normal nuclear poly(A) RNA handling and of proteostasis capacity in
      affected myonuclei accompanies the progressive myopathy.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Skeletal Muscle Fibre Degeneration
  description: >-
    Progressive degeneration of skeletal muscle fibres with rimmed vacuoles and
    myopathic change, selectively and earliest affecting the levator palpebrae
    and pharyngeal musculature and later the limb girdles, predominantly
    proximally and in the lower limbs. In OPMD roughly one in eight myonuclei
    carries a p62-positive intranuclear inclusion, a far higher burden than in
    other rimmed-vacuolar myopathies.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On immunohistochemistry for anti-PABPN1 in OPMD, PABPN1-positive
      aggregates were observed in the myonuclei, corresponding to the p62
      positive myo-INIs
    explanation: >-
      Confirms that the aggregates burdening OPMD myonuclei are PABPN1-positive,
      tying the tissue-level lesion to the upstream molecular node.
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the myo-INIs were found in all of the patients (100%, 15/15)
    explanation: >-
      Establishes that intranuclear inclusions are present in every OPMD muscle
      biopsy in this series, supporting the high myonuclear burden described.
  - reference: PMID:9462747
    reference_title: "Short GCG expansions in the PABP2 gene cause oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unique nuclear filament inclusions in skeletal muscle fibres are its
      pathological hallmark.
    explanation: >-
      Locates the defining lesion in skeletal muscle fibres, the cell type bound
      on this node.
  downstream:
  - target: Ptosis
    description: >-
      Degeneration of the levator palpebrae superioris produces the progressive
      bilateral eyelid droop that is usually the presenting sign.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301305
      reference_title: "Oculopharyngeal Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Oculopharyngeal muscular dystrophy (OPMD) is characterized by ptosis and
        dysphagia due to selective involvement of the muscles of the eyelids and
        pharynx, respectively.
      explanation: >-
        Attributes ptosis specifically to involvement of the eyelid musculature.
  - target: Dysphagia
    description: >-
      Degeneration of the pharyngeal musculature, with failure of cricopharyngeal
      relaxation, produces progressive oropharyngeal dysphagia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301305
      reference_title: "Oculopharyngeal Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Oculopharyngeal muscular dystrophy (OPMD) is characterized by ptosis and
        dysphagia due to selective involvement of the muscles of the eyelids and
        pharynx, respectively.
      explanation: >-
        Attributes dysphagia specifically to involvement of the pharyngeal
        musculature.
  - target: Proximal limb girdle weakness
    description: >-
      Later involvement of limb girdle musculature, predominantly proximal and
      lower limb, follows the oculopharyngeal onset.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301305
      reference_title: "Oculopharyngeal Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        proximal limb girdle weakness predominantly in lower limbs
      explanation: >-
        Names the distribution of the limb weakness modeled by this edge.
phenotypes:
- category: Clinical
  name: Ptosis
  description: >-
    Progressive, usually bilateral drooping of the eyelids from levator palpebrae
    involvement. It is the first reported symptom in about two-thirds of patients
    and has a mean age of onset around 48 years.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:11222452
    reference_title: "Oculopharyngeal muscular dystrophy: phenotypic and genotypic studies in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ptosis was the first reported symptom in two-thirds of the patients, and
      half of the subjects studied had evidence of ophthalmoplegia.
    explanation: >-
      Quantifies ptosis as the presenting symptom in a genotyped UK OPMD cohort.
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the mean age of onset of ptosis is usually 48 years and of dysphagia 50
      years
    explanation: >-
      Supports the adult age of onset stated in this phenotype's description.
- category: Clinical
  name: Dysphagia
  description: >-
    Progressive oropharyngeal swallowing difficulty with a mean onset around age
    50. Dysphagia determines prognosis in OPMD because it drives aspiration
    pneumonia and malnutrition.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Swallowing difficulties, which determine prognosis, increase the risk for
      potentially life-threatening aspiration pneumonia and poor nutrition.
    explanation: >-
      Establishes both the prognostic weight of dysphagia and its two principal
      complications.
  sequelae:
  - target: Aspiration pneumonia
    description: >-
      Impaired pharyngeal clearance allows food and secretions into the airway.
    evidence:
    - reference: PMID:20301305
      reference_title: "Oculopharyngeal Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Swallowing difficulties, which determine prognosis, increase the risk
        for potentially life-threatening aspiration pneumonia and poor
        nutrition.
      explanation: >-
        States that swallowing difficulty raises the risk of aspiration
        pneumonia, which is this sequela.
- category: Clinical
  name: Proximal limb girdle weakness
  description: >-
    Limb girdle weakness, predominantly proximal and affecting the lower limbs
    more than the upper, developing after the oculopharyngeal features. Some
    severely affected individuals eventually require a wheelchair. This proximal
    predominance is the clinical feature that most usefully separates OPMD from
    oculopharyngodistal myopathy.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:27854203
    reference_title: "Intranuclear Aggregates Precede Clinical Onset in Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the characteristic OPMD symptoms including ptosis and
      dysphagia, other symptoms such as limb girdle and axial weakness, and
      external ophthalmoplegia were frequently observed.
    explanation: >-
      Reports limb girdle weakness as a frequent finding in a nationwide Dutch
      OPMD cohort.
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is also clinically characterized by oculopharyngeal muscle involvement
      and rimmed vacuolar pathology, but the associated limb muscle weakness is
      typically proximal, rather than distal
    explanation: >-
      States the proximal predominance of limb weakness in OPMD and contrasts it
      with the distal predominance of OPDM.
- category: Clinical
  name: Ophthalmoplegia
  description: >-
    Limitation of eye movement, characteristically of upward gaze, found in about
    half of genotyped patients. Extraocular motility is typically less severely
    affected than the ptosis.
  phenotype_term:
    preferred_term: Ophthalmoplegia
    term:
      id: HP:0000602
      label: Ophthalmoplegia
  evidence:
  - reference: PMID:11222452
    reference_title: "Oculopharyngeal muscular dystrophy: phenotypic and genotypic studies in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ptosis was the first reported symptom in two-thirds of the patients, and
      half of the subjects studied had evidence of ophthalmoplegia.
    explanation: >-
      Gives the proportion of a genotyped OPMD cohort with ophthalmoplegia.
- category: Clinical
  name: Tongue atrophy
  description: >-
    Wasting and weakness of the tongue, one of the later bulbar manifestations,
    alongside chewing difficulty and a wet voice.
  phenotype_term:
    preferred_term: Tongue atrophy
    term:
      id: HP:0012473
      label: Tongue atrophy
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other manifestations as the disease progresses can include limitation of
      upward gaze, tongue atrophy and weakness, chewing difficulties, wet voice,
      facial muscle weakness, axial muscle weakness, and proximal limb girdle
      weakness predominantly in lower limbs.
    explanation: >-
      Lists tongue atrophy and weakness among the later manifestations of OPMD.
- category: Clinical
  name: Aspiration pneumonia
  description: >-
    Pneumonia following aspiration of food or secretions past an incompetent
    pharynx. It is the principal life-threatening complication of OPMD.
  phenotype_term:
    preferred_term: Aspiration pneumonia
    term:
      id: HP:0011951
      label: Aspiration pneumonia
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Swallowing difficulties, which determine prognosis, increase the risk for
      potentially life-threatening aspiration pneumonia and poor nutrition.
    explanation: >-
      Identifies aspiration pneumonia as the potentially fatal consequence of
      OPMD dysphagia.

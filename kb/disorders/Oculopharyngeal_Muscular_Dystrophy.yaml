  rate_per_100000: 167.0
  notes: >-
    117 patients identified in a population of 70,000, giving a calculated
    minimal prevalence of 1:600 - the highest reported anywhere, attributed to a
    founder effect. 1 in 600 normalizes to about 167 per 100,000.
  evidence:
  - reference: PMID:9392014

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hundred and seventeen OPMD patients were identified in a population of
      70,000 people of Bukharian descent, resulting in a calculated minimal
      prevalence of 1:600.
    explanation: >-
      Gives the numerator, denominator and derived rate for this population.
  - reference: PMID:9392014
    reference_title: "Epidemiology and inheritance of oculopharyngeal muscular dystrophy in Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 'founder effect' may explain the high prevalence of OPMD in this

  gene_term:
    preferred_term: PABPN1
    term:
      id: hgnc:8565
      label: PABPN1
  inheritance:
  - name: Autosomal dominant inheritance
  notes: >-
    PABPN1 was originally reported under the symbol PABP2. A GCN (GCG)
    trinucleotide repeat in exon 1 expands from the normal (GCG)6 to
    (GCG)8-13, lengthening the encoded N-terminal polyalanine tract.
  evidence:
  - reference: PMID:9462747
    reference_title: "Short GCG expansions in the PABP2 gene cause oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A (GCG)6 repeat encoding a polyalanine tract located at the N terminus of
      the protein was expanded to (GCG)8-13 in the 144 OPMD families screened.
    explanation: >-
      Establishes PABPN1 (PABP2) as the causative gene and gives the normal and
      expanded repeat ranges.
  - reference: PMID:14526187
    reference_title: "Oculopharyngeal muscular dystrophy: a late-onset polyalanine disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both forms are caused by short (GCG)8-13 expansions in the
      polyadenylate-binding protein nuclear 1 gene (PABPN1) located on
      chromosome 14q11.1.
    explanation: >-
      Names the gene under its current symbol and its chromosomal location, and
      confirms that both the dominant and recessive forms are allelic.
  - reference: PMID:11222452
    reference_title: "Oculopharyngeal muscular dystrophy: phenotypic and genotypic studies in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with longer repeat lengths, such as (GCG)(13), developed severe
      limb weakness early in the disease.
    explanation: >-
      Reports a repeat-length effect on limb weakness severity in a UK cohort.
      Note that Brais 2003 (PMID:14526187) states the size-severity correlation
      has not been conclusively established, so this is recorded as a cohort
      observation rather than a settled genotype-phenotype rule.

treatments:
- name: Cricopharyngeal myotomy
  description: >-
    Division of the cricopharyngeus to relieve oropharyngeal dysphagia. In a
    retrospective series of 39 patients, extramucosal myotomy achieved complete
    remission or marked improvement in 35, but about one third of those improved
    later relapsed, and revision by transmucosal endoscopic myotomy is an option.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cricopharyngeal myotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Dysphagia
    description: >-
      The myotomy relieves the pharyngo-oesophageal obstruction produced by the
      failing pharyngeal musculature; it is symptomatic and does not alter the
      underlying myopathy.
    evidence:
    - reference: PMID:16890071
      reference_title: "Long-term results of cricopharyngeal myotomy in oculopharyngeal muscular dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Extramucosal cricopharyngeal myotomy improves dysphagia in
        oculopharyngeal muscular dystrophy patients during the first few years
        but one third of the patients exhibited a recurrence of symptoms within
        3 years.
      explanation: >-
        Reports both the benefit of the myotomy for dysphagia and its limited
        durability.
  evidence:
  - reference: PMID:16890071
    reference_title: "Long-term results of cricopharyngeal myotomy in oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the short term, 25 patients showed a complete remission of symptoms, 10
      showed a marked improvement, and 4 exhibited no improvement at all
      (success rate of 90%).
    explanation: >-
      Gives the short-term outcome distribution quoted in the description.
- name: Ptosis surgery
  description: >-
    Blepharoplasty by levator aponeurosis resection, or frontalis suspension of
    the eyelids when levator function is poor. In a series of 92 OPMD patients,
    two polypropylene frontalis suspension techniques produced an equivalent
    gain in margin reflex distance.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: eyelid ptosis surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ptosis
    description: >-
      Surgery mechanically restores the lid position lost to levator palpebrae
      degeneration; it does not address the underlying myopathy.
    evidence:
    - reference: PMID:26866330
      reference_title: "Comparison of Two Polypropylene Frontalis Suspension Techniques in 92 Patients With Oculopharyngeal Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both polypropylene frontalis suspension techniques generated an
        equivalent increase in margin reflex distance.
      explanation: >-
        Reports the measured improvement in lid position, the readout for this
        treatment acting on ptosis.
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment for ptosis may include blepharoplasty by either resection of the
      levator palpebrea aponeurosis or frontal suspension of the eyelids.
    explanation: >-
      Names the two surgical approaches described in this treatment.
- name: Dietary modification for dysphagia
  description: >-
    Texture and consistency modification of the diet is the first-line
    management of OPMD dysphagia, with surgery reserved for symptomatic
    dysphagia that materially affects quality of life.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Dysphagia
    description: >-
      Adjusting food consistency compensates for the weakened pharyngeal
      musculature without altering it.
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The initial treatment for dysphagia is dietary modification; surgical
      intervention for dysphagia should be considered when symptomatic dysphagia
      has a significant impact on quality of life.
    explanation: >-
      Establishes dietary modification as first-line and places surgery second.
- name: Physical and occupational therapy
  description: >-
    Physiotherapy, occupational therapy and assistive devices for falls
    prevention and mobility as limb girdle weakness progresses.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Proximal limb girdle weakness
    description: >-
      Therapy and assistive devices address the functional consequences of limb
      girdle weakness; they are supportive rather than disease-modifying.
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Physical and occupational therapy are encouraged; assistive devices may be
      necessary to prevent falls and assist with walking and mobility.
    explanation: >-
      Recommends the therapies and assistive devices described here.
- name: Genetic counselling
  description: >-
    Counselling on the autosomal dominant transmission of OPMD, including the
    50% sib risk when one parent is heterozygous and the distinct risks that
    apply when both parents carry an expansion.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301305
    reference_title: "Oculopharyngeal Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents of the proband are heterozygous for a GCN repeat
      expansion, sibs have a 25% risk of inheriting two GCN repeat expansions
      and a 50% risk of inheriting one GCN repeat expansion.
    explanation: >-
      Gives the recurrence risks that genetic counselling for OPMD conveys.
differential_diagnoses:
- name: Oculopharyngodistal Myopathy
  disease_term:
    preferred_term: oculopharyngodistal myopathy
    term:
      id: MONDO:0025193
      label: oculopharyngodistal myopathy
  description: >-
    The closest mimic and the one most often confused with OPMD in the
    literature. OPDM is caused by non-coding CGG repeat expansions in LRP12,
    GIPC1, NOTCH2NLC or RILPL1 rather than by a coding polyalanine expansion in
    PABPN1, and both diseases produce adult-onset ptosis, ophthalmoplegia,
    bulbar involvement, rimmed vacuoles and intranuclear inclusions. Three
    features separate them. Limb weakness is predominantly proximal in OPMD and
    distal in OPDM, although both distributions overlap in individual patients.
    p62-positive intranuclear inclusions occupy a far higher fraction of
    myonuclei in OPMD, and are PABPN1-positive only in OPMD. Inclusions in
    non-muscle cells such as blood vessels, peripheral nerve and muscle spindles
    occur in OPDM but were absent from every OPMD sample studied. Genetic
    testing is definitive.
  evidence:
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that OPMD can be differentiated from OPDM and other
      RVMs by the frequent presence of myo-INIs; and in OPDM, the presence of
      non-muscle-INIs in muscle pathology should be a diagnostic hallmark.
    explanation: >-
      States the histopathological rule separating the two diseases.
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, this muscle disease is caused by an alanine expansion mutation in
      the poly-adenine-binding protein nuclear 1 (PABPN1) gene
    explanation: >-
      Contrasts the OPMD lesion with the non-coding CGG expansions of OPDM
      described immediately before it in the same paper.
  - reference: PMID:36476314
    reference_title: "Intranuclear inclusions in muscle biopsy can differentiate oculopharyngodistal myopathy and oculopharyngeal muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The samples from the patients with OPMD (n = 15), DES-related myopathy
      (n = 7), and control muscle samples (n = 6) did not show non-muscle-INIs
    explanation: >-
      Records the absence of non-muscle intranuclear inclusions in OPMD, which
      is the discriminating negative finding.
notes: >-
  OPMD and oculopharyngodistal myopathy (OPDM) are routinely confused in the
  literature and share an abbreviation-shaped similarity as well as a clinical
  one; this entry is OPMD, the PABPN1 polyalanine disease, and the separate
  dismech entry Oculopharyngodistal_Myopathy is OPDM. The deep-research report
  committed alongside this entry
  (research/Oculopharyngeal_Muscular_Dystrophy-deep-research-claude_code.md) had
  an unusable citation list - only 2 of its 24 cited PMIDs concern OPMD - so
  every reference here was located by an independent PubMed search and fetched
  into references_cache before being quoted.

name: Dioctophymiasis
creation_date: '2026-11-14T09:58:47Z'
synonyms:
- dioctophymatosis
- giant kidney worm infection
category: Infectious Disease
description: >-
  Dioctophymiasis is a rare zoonotic Enoplea nematode infection caused by the
  giant kidney worm Dioctophyme renale. Adult worms in definitive mammalian
  hosts shed eggs in urine; larvae develop in freshwater oligochaetes and then
  encyst in paratenic freshwater fish, frogs, or toads before infecting a
  mammalian host that eats the paratenic host. Humans are sporadic definitive or
  accidental hosts after ingesting raw or undercooked fish or frogs, or
  contaminated water containing infected oligochaetes. Adult worms most often
  live in the kidney and destroy renal parenchyma, producing loin or flank pain,
  hematuria, urinary abnormalities, renal masses, or renal insufficiency, while
  ectopic larvae or worms can present as subcutaneous nodules or gastric-wall
  masses. Diagnosis is by morphologic identification of eggs or worms in urine
  or tissue and, for unusual larvae, by molecular confirmation; management
  centers on removing worms or irreversibly damaged renal tissue.
disease_term:
  preferred_term: dioctophymiasis
  term:
    id: MONDO:0000298
    label: dioctophymiasis
parents:
- helminthiasis
infectious_agent:
- name: Dioctophyme renale
  infectious_agent_term:
    preferred_term: Dioctophyme renale
    term:
      id: NCBITaxon:513045
      label: Dioctophyme renale
  description: >-
    A giant dioctophymatid nematode whose adults normally inhabit mammalian
    kidneys, shed eggs in urine, and occasionally infect humans.
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The giant kidney worm (Dioctophyme renale) is the largest parasitic
      roundworm and infects the kidneys of carnivorous mammals such as mink
      (family Mustelidae) ( 1 ).
    explanation: >-
      Identifies D. renale as the giant kidney worm and places the adult worm in
      the kidney of carnivorous definitive hosts.
agent_life_cycle:
  description: >-
    Dioctophyme renale eggs leave a definitive host in urine and embryonate in
    freshwater. Oligochaete worms ingest the eggs and support development to
    infective third-stage larvae. Fish, frogs, and toads become paratenic hosts
    after eating infected oligochaetes. Humans acquire infection when they eat
    raw or undercooked paratenic hosts or ingest contaminated unboiled water,
    after which larvae penetrate the stomach wall, migrate through the liver,
    and preferentially mature in the kidney or erratically lodge in ectopic
    tissues.
  hosts:
  - preferred_term: Oligochaeta
    term:
      id: NCBITaxon:6381
      label: Oligochaeta <segmented worms>
    role: first intermediate host
  - preferred_term: ray-finned fish
    term:
      id: NCBITaxon:7898
      label: Actinopterygii
    role: paratenic host
  - preferred_term: amphibians
    term:
      id: NCBITaxon:8292
      label: Amphibia
    role: paratenic host
  - preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: sporadic definitive or accidental ectopic host
  life_cycle_stages:
  - name: Egg shed in urine into freshwater
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Adult male and female worms in a kidney produce eggs that exit in urine
      and develop in freshwater before oligochaete ingestion.
    evidence:
    - reference: PMID:40867017
      reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Adult male and female worms reside and sexually reproduce in the kidneys
        of the host. The eggs are excreted in the urine and, once reaching a
        freshwater environment, develop into first-stage larvae within ≈1 month.
      explanation: >-
        Supports urinary egg shedding from adult worms in the definitive-host
        kidney and freshwater embryonation.
  - name: Oligochaete third-stage larva
    description: >-
      Oligochaete worms ingest embryonated eggs and carry infective third-stage
      larvae.
    evidence:
    - reference: PMID:40867017
      reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Those larvae are ingested by oligochaete worms (phylum Annelida), the
        intermediate hosts, in which they develop to infective third-stage (L3)
        larvae.
      explanation: >-
        Supports the oligochaete intermediate host as the stage that produces
        infective L3 larvae.
  - name: Encysted larva in a fish or amphibian paratenic host
    description: >-
      Fish, frogs, and toads become paratenic hosts when they eat infected
      oligochaetes and harbor encysted third-stage larvae until a definitive
      host consumes them.
    evidence:
    - reference: PMID:40867017
      reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Paratenic hosts, such as fish, frogs, and toads, become infected by
        consuming the oligochaetes, which harbor encysted L3 larvae.
      explanation: >-
        Supports fish and amphibians as paratenic hosts containing the larvae
        that infect mammals.
  - name: Adult giant kidney worm
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      In a patent human renal infection, larvae mature into adult worms that
      occupy the kidney and may pass eggs or adult worms into urine.
    evidence:
    - reference: PMID:30963996
      reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Thirty-one (83.8%) out of 37 cases involved the kidneys, with three of
        them showing bilateral kidney invasion
      explanation: >-
        A global human-case review found renal infection to be the usual human
        manifestation.
transmission:
- name: Ingestion of infective larvae in raw fish, frogs, or oligochaete-contaminated water
  description: >-
    Humans acquire infection by ingesting infective third-stage larvae in raw or
    undercooked freshwater fish or frogs, or by drinking unboiled water that
    carries infected oligochaete intermediate hosts.
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Freshwater fish and frogs are considered the major sources for D. renale
      infections in humans and mammals
    explanation: >-
      Supports freshwater fish and frogs as the major human food vehicles.
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Six cases were considered to be related to ingestion of unboiled water
      contaminated by oligochaetes harboring third-stage larvae, with three of
      them having a history of eating fish or frogs
    explanation: >-
      Supports unboiled water containing infected oligochaetes as another
      suspected transmission route in the human case literature.
epidemiology:
- name: Rare human Dioctophyme renale infection
  description: >-
    Human cases are rare. A 2019 retrospective review found 37 published human
    cases worldwide, mostly adult renal infections, and a later Korean case
    report emphasized that patent adult-worm infection is rarer than
    third-stage-larval migrans.
  factors:
  - raw or undercooked freshwater fish
  - raw or undercooked frogs
  - unboiled freshwater
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the end, 32 papers describing 37 human cases of dioctophymiasis were
      assessed.
    explanation: >-
      Supports the cases-in-literature size of the human evidence base through
      October 2018.
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patent infections by D. renale roundworms in humans are rare; the
      infections more often manifest as larval migrans with L3 larvae
    explanation: >-
      Supports the distinction between rare patent renal infection and more
      frequent ectopic larval migrans in humans.
pathophysiology:
- name: Infective Dioctophyme Larva Ingestion
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Infection begins when a person ingests a Dioctophyme L3 larva in raw or
    undercooked fish or frog tissue, or in water containing an infected
    oligochaete worm.
  downstream:
  - target: Gastric-Wall Penetration and Hepatic Migration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Humans typically acquire D. renale infection from consuming raw or
      undercooked freshwater fish or frogs.
    explanation: >-
      Supports larva ingestion in paratenic hosts as the initiating exposure.
- name: Gastric-Wall Penetration and Hepatic Migration
  biological_scale: TISSUE
  description: >-
    The infective larva leaves the gut through the gastric wall, migrates to the
    liver, and then either reaches the kidney or lodges erratically in ectopic
    tissue.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Adult Renal Residence and Parenchymal Destruction
    causal_link_type: DIRECT
  - target: Ectopic Larval Tissue Residence
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      When a carnivorous mammal consumes an infected paratenic host, L3 larvae
      migrate from the gastric wall to the liver and preferentially infect the
      right kidney, where they mature into adult worms and complete their life
      cycle
    explanation: >-
      Supports the gastric-wall to liver to kidney migration route.
- name: Adult Renal Residence and Parenchymal Destruction
  biological_scale: TISSUE
  description: >-
    Adult worms inhabit the kidney, consume renal parenchyma, and can leave
    only a residual renal capsule, causing renal pain, bleeding into urine, and
    renal insufficiency when one or both kidneys are extensively damaged.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Hematuria
    causal_link_type: DIRECT
  - target: Flank Pain
    causal_link_type: DIRECT
  - target: Renal Insufficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26952087
    reference_title: Giant kidney worms in a patient with renal cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      D. renale causes destruction by consuming the renal parenchyma and sparing
      only the capsule
    explanation: >-
      Supports renal parenchymal destruction as the adult-worm injury mechanism.
  - reference: PMID:28299768
    reference_title: A Case Report of Human Infection with Dioctophyma Renale from Iran.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In operation, a parasitic helminth, 30 cm long and 1.2 cm in diameter
      consistent with D. renale was found in the right kidney.
    explanation: >-
      Supports adult-worm residence in the human kidney.
- name: Ectopic Larval Tissue Residence
  biological_scale: TISSUE
  description: >-
    In humans, D. renale larvae can lodge outside the kidney in ectopic tissues
    such as the liver, abdominal cavity, retroperitoneum, skin, or gastric wall.
  locations:
  - preferred_term: tissue
    term:
      id: UBERON:0000479
      label: tissue
  downstream:
  - target: Subcutaneous Nodule
    causal_link_type: DIRECT
  - target: Gastric Submucosal Mass
    causal_link_type: DIRECT
  - target: Abdominal Pain
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The larvae are found in the liver, abdominal cavity, and retroperitoneal
      space and as subcutaneous nodules
    explanation: >-
      Supports the ectopic larval-migrans distribution outside the kidney.
phenotypes:
- name: Hematuria
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  description: >-
    Blood in urine is one of the two most common manifestations of renal
    dioctophymiasis.
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The patients suffering from dioctophymiasis usually presented with loin
      pain (59.5%, 22/37) and hematuria (59.5%, 22/37)
    explanation: >-
      Supports hematuria as a major renal manifestation in reviewed human cases.
- name: Flank Pain
  phenotype_term:
    preferred_term: Flank pain
    term:
      id: HP:0030157
      label: Flank pain
  description: >-
    Loin or flank pain is common in renal dioctophymiasis.
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main clinical manifestations of human dioctophymiasis were loin pain
      (59.5%) and hematuria (59.5%).
    explanation: >-
      Supports loin pain as a common manifestation in human case literature.
- name: Renal Insufficiency
  phenotype_term:
    preferred_term: Renal insufficiency
    term:
      id: HP:0000083
      label: Renal insufficiency
  description: >-
    Extensive renal infection can culminate in kidney failure, especially with
    bilateral renal invasion.
  evidence:
  - reference: PMID:21158627
    reference_title: Fatal bilateral dioctophymatosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      She refused treatment and died of bilateral renal function failure.
    explanation: >-
      Supports fatal renal failure after untreated bilateral D. renale
      infection.
- name: Subcutaneous Nodule
  phenotype_term:
    preferred_term: Subcutaneous nodule
    term:
      id: HP:0001482
      label: Subcutaneous nodule
  description: >-
    Ectopic D. renale larvae can present as subcutaneous nodules.
  evidence:
  - reference: PMID:24095916
    reference_title: "The first genetically confirmed case of Dioctophyme renale (Nematoda: Dioctophymatida) in a patient with a subcutaneous nodule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We describe a nematode larva in a subcutaneous nodule excised from a
      44-year-old Chinese male who had been living in Japan for 15 years.
    explanation: >-
      Supports a dermal ectopic larval presentation with a subcutaneous nodule.
- name: Gastric Submucosal Mass
  description: >-
    Ectopic larval migration through the gastric wall can mimic a gastric
    submucosal tumor.
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Examination showed a 3 × 2 cm protruding mass in the stomach, accompanied
      by cheese-like exudates and edematous changes in the posterior wall of the
      proximal gastric antrum
    explanation: >-
      Supports the gastric-wall mass-like presentation of ectopic human
      infection.
- name: Abdominal Pain
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
  description: >-
    Abdominal or epigastric pain can accompany ectopic gastric infection.
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A 53-year-old woman sought care for epigastric pain that worsened on an
      empty stomach and improved with eating.
    explanation: >-
      Supports epigastric pain in a molecularly confirmed ectopic gastric-wall
      infection.
diagnosis:
- name: Morphologic Identification of Eggs or Worms in Urine or Tissue
  description: >-
    Renal cases are diagnosed by identifying D. renale adult worms or eggs in
    urine or affected kidney tissue, while ectopic nodules can be diagnosed by
    histopathologic identification of larval tissue sections.
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Current clinical diagnosis of dioctophymiasis is based on the
      morphological characteristics of D. renale eggs or worms in a patient’s
      urine or histopathological sections after exploratory surgery
    explanation: >-
      Supports morphology in urine or tissue as the core diagnostic approach.
- name: Molecular Sequencing for Ectopic Larvae
  description: >-
    For unusual ectopic larvae, sequencing of ribosomal or mitochondrial targets
    can distinguish D. renale from mimics such as Gnathostoma or Anisakis.
  evidence:
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additional nested PCR confirmed 100% (561/561 bp) homology with D.
      renale, further excluding Gnathostoma (83.83% identity ... with G.
      spinigerum
    explanation: >-
      Supports PCR and sequencing confirmation in a gastric larval infection
      with a differential diagnosis that included Gnathostoma.
- name: Renal Imaging for Mass-Like Kidney Infection
  description: >-
    Ultrasound, CT, or MRI can detect renal mass-like disease or kidney
    destruction, prompting surgical or tissue diagnosis.
  evidence:
  - reference: PMID:28299768
    reference_title: A Case Report of Human Infection with Dioctophyma Renale from Iran.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A 75-year-old man from Kurdistan province, western part of Iran was
      diagnosed with a mass in the right kidney by ultrasound and computed
      tomography.
    explanation: >-
      Supports ultrasound and CT detection of renal mass-like dioctophymiasis.
treatments:
- name: Surgical Removal of Giant Kidney Worms or Damaged Kidney Tissue
  description: >-
    Management generally removes the adult worm, ectopic larva, or destroyed
    renal tissue because a standardized effective anthelmintic regimen has not
    been established.
  target_mechanisms:
  - target: Adult Renal Residence and Parenchymal Destruction
  - target: Ectopic Larval Tissue Residence
  evidence:
  - reference: PMID:30963996
    reference_title: A human case of Dioctophyma renale (giant kidney worm) accompanied by renal cancer and a retrospective study of dioctophymiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Currently, there is no strictly defined therapeutic approach. The only
      known means is surgical removal of worms and the damaged portion of the
      kidneys
    explanation: >-
      Supports surgery rather than a standardized anthelmintic regimen as the
      central management approach for renal disease.
  - reference: PMID:28299768
    reference_title: A Case Report of Human Infection with Dioctophyma Renale from Iran.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Following removal of worm, the symptoms completely resolved within a few
      hours.
    explanation: >-
      Supports symptom resolution after worm removal in a renal case.
  - reference: PMID:40867017
    reference_title: Gastric Submucosal Tumor in Patient Infected with Dioctophyme renale Roundworm, South Korea, 2024.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The worm was successfully removed during endoscopic biopsy, and follow-up
      revealed no additional symptoms.
    explanation: >-
      Supports endoscopic removal of an ectopic gastric-wall larva.

progression:
- phase: Genotype-positive, phenotype-negative
  notes: >-
    A carrier of a pathogenic MYH7 variant with no left ventricular hypertrophy
    on imaging. This is not a benign state to be discharged from follow-up:
    penetrance is age-related, so surveillance must be longitudinal. Pooled
    penetrance in clinically ascertained non-proband MYH7 relatives is far higher
    than in carriers found incidentally in population cohorts, which is why a
    penetrance figure cannot be quoted without its ascertainment context.
  evidence:
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance varied from ≈32% for MYL3 (myosin light chain 3) to ≈55% for
      MYBPC3 (myosin-binding protein C3), ≈60% for TNNT2 (troponin T2) and TNNI3
      (troponin I3), and ≈65% for MYH7 (myosin heavy chain 7).
    explanation: >-
      Gives the MYH7-specific penetrance in non-proband relatives found by
      cascade screening, the highest of the sarcomere genes compared, which is
      what makes this phase a surveillance state rather than reassurance.
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The penetrance of HCM in incidentally identified P/LP variant carriers was
      also substantially lower at ≈11%
    explanation: >-
      The counterweight to the figure above: the same variant classes carry a far
      lower penetrance when found incidentally rather than through a family, so a
      penetrance number cannot be quoted without its ascertainment context.
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      short-term gene-specific phenotypic conversion varied between ≈12% for
      MYBPC3 and ≈23% for MYH7.
    explanation: >-
      Quantifies the rate at which carriers leave this phase, and separates MYH7
      from MYBPC3 on it — roughly twice the short-term conversion rate.
- phase: Overt hypertrophy, with or without outflow obstruction
  notes: >-
    Conversion to measurable left ventricular hypertrophy, defined in adults as
    maximal end-diastolic wall thickness of 15 mm or more unexplained by loading
    conditions. Obstruction may be present at rest, provocable, or absent.
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Left ventricular outflow tract obstruction is present at rest in about one
      third of the patients and can be provoked in another third.
    explanation: >-
      Quantifies how the overt phase divides between resting, provocable and
      absent obstruction, which is what determines management at this stage.
- phase: Complications
  notes: >-
    Atrial fibrillation with thromboembolic risk, progressive fibrosis,
    ventricular arrhythmia and heart failure. Most patients follow a relatively
    benign course; sudden cardiac death is the complication that drives risk
    stratification and is concentrated in adolescents and young adults.
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      In the majority of patients, HCM has a relatively benign course. However,
      HCM is also an important cause of sudden cardiac death, particularly in
      adolescents and young adults.
    explanation: >-
      Sets the base rate against which the arrhythmic complication of this phase
      is judged, and locates its peak in adolescence and young adulthood.
diagnosis:
- name: Echocardiographic Wall-Thickness Criterion
  description: >-
    The clinical diagnosis rests on a cardiac imaging measurement, not on
    genotype: an end-diastolic wall thickness of 15 mm or more anywhere in the
    left ventricle, not explained by loading conditions and with other causes of
    hypertrophy ruled out. A 13-14 mm threshold applies when there is a positive
    family history or a positive genetic test, which is the situation of a CMH1
    cascade-screened relative. Paediatric diagnosis uses body-size-adjusted
    z-scores instead of an absolute thickness.
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:38540296
    reference_title: "Role of Genetics in Diagnosis and Management of Hypertrophic Cardiomyopathy: A Glimpse into the Future."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of HCM in adult patients is typically established
      using any cardiac imaging technique that shows an end-diastolic wall
      thickness of ≥15 mm anywhere in the left ventricle, which cannot be
      explained solely by pressure overload states, and after ruling out any
      other conditions that may cause LV hypertrophy. A cutoff of 13-14 mm can be
      diagnostic with a positive family history or a positive genetic test
    explanation: >-
      States both thresholds and the exclusion requirement. Directness is INDIRECT
      because the criterion is for hypertrophic cardiomyopathy as a phenotype
      rather than for the MYH7 entity, which has no imaging signature of its own.
  notes: >-
    The lowered 13-14 mm threshold is what makes genetic testing consequential
    for relatives rather than merely informative: a confirmed familial variant
    changes the wall thickness at which a relative is called affected.
- name: Sarcomere Gene Panel Testing
  description: >-
    A phenotype-anchored next-generation sequencing panel covering the core
    sarcomere genes (MYH7, MYBPC3, TNNT2, TNNI3, MYL2, MYL3, TPM1, ACTC1) plus
    genes for clinically plausible phenocopies. This is what establishes the CMH1
    diagnosis specifically, since nothing on imaging distinguishes MYH7 disease
    from its sarcomeric siblings. Yield depends on how the patient was
    ascertained rather than on the test.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38540296
    reference_title: "Role of Genetics in Diagnosis and Management of Hypertrophic Cardiomyopathy: A Glimpse into the Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The yield of genetic testing for a disease-causing variant is 30% in
      sporadic cases and up to 60% in familial cases and in younger patients with
      typical asymmetrical septal hypertrophy.
    explanation: >-
      Quantifies the diagnostic yield and shows it doubles with familial
      ascertainment, which is the number a clinician needs before ordering the
      test.
  - reference: PMID:38540296
    reference_title: "Role of Genetics in Diagnosis and Management of Hypertrophic Cardiomyopathy: A Glimpse into the Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing using targeted disease-specific panels that utilize
      next-generation sequencing (NGS) and include sarcomeric genes with the
      strongest evidence of association and syndrome-associated genes is highly
      recommended for every HCM patient to confirm the diagnosis, identify the
      molecular etiology, and guide screening and management.
    explanation: >-
      Establishes the panel composition and that testing is recommended for every
      patient rather than only for selected ones.
  notes: >-
    A variant of uncertain significance is not actionable for predictive cascade
    testing: a relative who carries one still needs longitudinal surveillance
    rather than being called unaffected. That constraint is why this entry's
    progression section curates the genotype-positive/phenotype-negative state as
    a surveillance phase.
- name: Cascade Testing of First-Degree Relatives
  description: >-
    When a decisively pathogenic variant is identified in the proband, targeted
    testing is offered to phenotype-negative first-degree relatives regardless of
    age, and the result then determines whether that relative enters longitudinal
    clinical surveillance or leaves it. This is the pathway through which the
    penetrance figures curated in this entry's progression section are generated,
    and the reason they are ascertainment-dependent.
  diagnosis_term:
    preferred_term: cascade genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38540296
    reference_title: "Role of Genetics in Diagnosis and Management of Hypertrophic Cardiomyopathy: A Glimpse into the Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current guidelines recommend focused cascade genetic testing regardless
      of age in phenotype-negative first-degree relatives if a variant with
      decisive evidence of pathogenicity has been identified in the proband.
    explanation: >-
      States the cascade-testing recommendation and its precondition, a variant
      with decisive pathogenicity evidence in the proband.
differential_diagnoses:
- name: Storage and Infiltrative Phenocopies of Left Ventricular Hypertrophy
  description: >-
    Unexplained left ventricular hypertrophy is not specific to sarcomeric
    disease. Glycogen storage and lysosomal disorders (Danon disease, PRKAG2
    glycogenosis, Pompe disease, Fabry disease), extracellular deposition
    (transthyretin and AL amyloidosis) and mitochondrial disease all thicken the
    myocardium. Distinguishing them from CMH1 matters clinically because several
    have disease-specific therapy that sarcomeric HCM does not, and because a
    wrong call misdirects family screening. Low ECG voltage despite marked
    hypertrophy is the classic pointer away from a sarcomeric cause.
  evidence:
  - reference: PMID:29506729
    reference_title: "Common presentation of rare diseases: Left ventricular hypertrophy and diastolic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several metabolic diseases lead to myocardial thickening, either due to
      intracellular storage (glycogen storage and lysosomal diseases),
      extracellular deposition (TTR and AL amyloidosis) or due to abnormal energy
      metabolism (mitochondrial diseases).
    explanation: >-
      Names the classes of phenocopy that must be excluded before attributing
      unexplained hypertrophy to a sarcomeric cause.
  - reference: PMID:29506729
    reference_title: "Common presentation of rare diseases: Left ventricular hypertrophy and diastolic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as there are specific therapies for some forms of HCM including enzyme
      substitution and chaperone therapies and specific treatments for TTR
      amyloidosis, a differential diagnosis should be sought in all patients with
      unexplained left ventricular hypertrophy.
    explanation: >-
      States why this differential is actionable rather than academic: several
      phenocopies have disease-specific treatment.
  notes: >-
    Diastolic dysfunction does not discriminate here. The same source reports
    that diastolic dysfunction is a key feature of HCM and its phenocopies alike
    and that its value in differential diagnosis is limited, so it is curated as
    a shared phenotype rather than a distinguishing feature.
- name: Hypertrophic Cardiomyopathy due to other sarcomere genes
  description: >-
    MYBPC3, TNNT2, TNNI3, TPM1, ACTC1, MYL2 and MYL3 also carry definitive
    gene-disease validity for hypertrophic cardiomyopathy, and MYH7 and MYBPC3
    together account for roughly half of HCM families. The phenotypes overlap
    substantially, so only genetic testing separates CMH1 from its sarcomeric
    siblings. The mechanistic contrast is with MYBPC3 disease, which is
    predominantly truncating and acts by haploinsufficiency, where MYH7 disease
    is predominantly missense and acts through a stably expressed mutant motor.
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYH7 and MYBPC3, encoding β-myosin heavy chain and myosin-binding protein
      C, respectively, are the 2 most common genes involved, together accounting
      for ≈50% of the HCM families.
    explanation: >-
      Quantifies the sarcomeric differential that CMH1 sits inside and names its
      nearest neighbour.
treatments:
- name: Mavacamten (Cardiac Myosin Inhibitor)
  description: >-
    Mavacamten is a small-molecule allosteric inhibitor of cardiac myosin ATPase
    that reduces the number of force-generating actin-myosin cross-bridges,
    stabilizing myosin in the energy-sparing super-relaxed state. It directly
    counteracts the hypercontractility that is the central abnormality of HCM, and
    is approved for symptomatic obstructive hypertrophic cardiomyopathy; because
    beta-cardiac myosin is the MYH7 gene product, the drug acts on the same motor
    that carries the CMH1 lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
      term:
        id: CHEBI:756998
        label: mavacamten
  target_mechanisms:
  - target: Destabilization of the Autoinhibited Super-Relaxed State
    treatment_effect: INHIBITS
    description: >-
      Mavacamten stabilizes the super-relaxed state and reduces the number of
      heads available for force generation, directly opposing the SRX
      destabilization that drives hypercontractility.
    evidence:
    - reference: PMID:40118457
      reference_title: "Dynamics of β-cardiac myosin between the super-relaxed and disordered-relaxed states."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        cardiac myosin inhibitor mavacamten slows nucleotide release by an equal
        factor for both heavy meromyosin and subfragment 1, thus only indirectly
        influencing the occupancy time of the SRX state.
      explanation: >-
        Establishes mavacamten's biochemical action on beta-cardiac myosin
        nucleotide handling and its effect on SRX-state occupancy, the node it
        targets.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac muscle hypercontractility is a key pathophysiological abnormality
      in hypertrophic cardiomyopathy, and a major determinant of dynamic left
      ventricular outflow tract (LVOT) obstruction.
    explanation: >-
      The pivotal phase 3 trial establishing the rationale and use of a cardiac
      myosin inhibitor targeting hypercontractility in obstructive HCM.
- name: Septal Reduction (Surgical Myectomy)
  description: >-
    Surgical septal myectomy relieves severe drug-refractory left ventricular
    outflow tract obstruction by resecting hypertrophied basal septal muscle.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: septal myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
  target_mechanisms:
  - target: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
    treatment_effect: INHIBITS
    description: >-
      Resecting hypertrophied basal septal muscle removes the anatomical
      substrate of the dynamic outflow gradient, acting on the obstruction
      component of this node.
  evidence:
  - reference: PMID:16053960
    reference_title: "Long-term effects of surgical septal myectomy on survival in patients with obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical myectomy performed to relieve outflow obstruction and severe
      symptoms in HCM was associated with long-term survival equivalent to that
      of the general population, and superior to obstructive HCM without
      operation.
    explanation: >-
      The long-term survival result that establishes myectomy as more than
      symptomatic relief. Directness is INDIRECT because the cohort is obstructive
      HCM broadly rather than genotyped MYH7 carriers, and because the design is
      an observational comparison rather than a randomized one.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    An implantable cardioverter-defibrillator provides secondary or primary
    prevention of sudden cardiac death in patients judged to be at high arrhythmic
    risk, terminating malignant ventricular arrhythmia.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Sudden Cardiac Death
    treatment_effect: INHIBITS
    description: >-
      The device does not modify the arrhythmic substrate; it terminates the
      ventricular tachyarrhythmia that would otherwise cause death, so it acts on
      the outcome rather than on any upstream mechanism.
  evidence:
  - reference: PMID:17652294
    reference_title: "Implantable cardioverter-defibrillators and prevention of sudden cardiac death in hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a high-risk HCM cohort, ICD interventions for life-threatening
      ventricular tachyarrhythmias were frequent and highly effective in
      restoring normal rhythm.
    explanation: >-
      The multicenter registry result establishing device efficacy in high-risk
      HCM. Directness is INDIRECT because the 506-patient cohort is high-risk HCM
      broadly rather than genotyped MYH7 carriers.
  - reference: PMID:17652294
    reference_title: "Implantable cardioverter-defibrillators and prevention of sudden cardiac death in hypertrophic cardiomyopathy."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ICD complications included inappropriate shocks in 136 patients (27%).
    explanation: >-
      Recorded as REFUTE against an unqualified claim of net benefit: in the same
      registry that established efficacy, over a quarter of recipients received an
      inappropriate shock. Curated as a separate item with the opposite direction
      rather than hedged into the efficacy item, because the two sentences make
      opposite claims about the same intervention. Directness is INDIRECT for the
      same broad-HCM reason as its companion.
- name: Aficamten (Cardiac Myosin Inhibitor)
  description: >-
    Aficamten is an oral selective cardiac myosin inhibitor. Like mavacamten it
    acts directly on the beta-cardiac myosin
    motor that carries the CMH1 lesion, reducing left ventricular outflow tract
    gradients by mitigating hypercontractility. In the phase 3 SEQUOIA-HCM trial
    it improved peak oxygen uptake in symptomatic obstructive disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aficamten
      term:
        id: CHEBI:747213
        label: aficamten
  target_mechanisms:
  - target: Sarcomere Hypercontractility with Impaired Relaxation
    treatment_effect: INHIBITS
    description: >-
      Myosin inhibition reduces the number of force-generating cross-bridges,
      opposing the hypercontractile cellular state at the point where the MYH7
      lesion produces it.
    evidence:
    - reference: PMID:38739079
      reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Aficamten is an oral selective cardiac myosin inhibitor that reduces left
        ventricular outflow tract gradients by mitigating cardiac
        hypercontractility.
      explanation: >-
        Supports this edge specifically: names hypercontractility as the
        mechanism the drug acts through, rather than merely reporting that the
        drug works.
  evidence:
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 24 weeks, the mean change in the peak oxygen uptake was 1.8 ml per
      kilogram per minute (95% confidence interval [CI], 1.2 to 2.3) in the
      aficamten group and 0.0 ml per kilogram per minute (95% CI, -0.5 to 0.5) in
      the placebo group
    explanation: >-
      The pivotal phase 3 efficacy result for this drug, against a placebo
      comparator. Directness is INDIRECT because SEQUOIA-HCM enrolled
      symptomatic obstructive HCM broadly rather than genotyped MYH7 carriers.
- name: Disopyramide
  description: >-
    Disopyramide is a class Ia antiarrhythmic with strong negative inotropic
    action, used as add-on therapy to a beta-blocker for persistent left
    ventricular outflow tract obstruction. It reduces the subaortic gradient and
    can defer or avoid septal reduction therapy; its limits are vagolytic side
    effects and the need for QT monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: disopyramide
      term:
        id: CHEBI:4657
        label: disopyramide
  target_mechanisms:
  - target: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
    treatment_effect: INHIBITS
    description: >-
      The negative inotropic effect reduces the dynamic subaortic gradient, acting
      on the obstruction component of this node rather than on the underlying
      sarcomeric lesion.
    evidence:
    - reference: PMID:15837258
      reference_title: "Multicenter study of the efficacy and safety of disopyramide in obstructive hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Two-thirds of obstructed HCM patients treated with disopyramide could be
        managed medically with amelioration of symptoms and about 50% reduction
        in subaortic gradient over >/=3 years.
      explanation: >-
        Names the subaortic gradient as the quantity the drug moves and gives the
        size of the effect, which is the content of this edge rather than of the
        treatment record as a whole. Directness is INDIRECT because the series is
        obstructive HCM broadly rather than genotyped MYH7 carriers.
  evidence:
  - reference: PMID:15837258
    reference_title: "Multicenter study of the efficacy and safety of disopyramide in obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-eight patients (66%) were maintained with disopyramide without the
      necessity for major non-pharmacologic intervention with surgical myectomy,
      alcohol ablation, or pacing; outflow gradient at rest decreased from 75 +/-
      33 to 40 +/- 32 mm Hg (p < 0.0001)
    explanation: >-
      Quantifies gradient reduction and the proportion managed medically.
      Directness is INDIRECT because the cohort is obstructive HCM broadly rather
      than genotyped MYH7 carriers.
  - reference: PMID:15837258
    reference_title: "Multicenter study of the efficacy and safety of disopyramide in obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Disopyramide therapy does not appear to be proarrhythmic in HCM and should
      be considered before proceeding to surgical myectomy or alternate
      strategies.
    explanation: >-
      Records the safety finding that positions this drug ahead of septal
      reduction in the treatment sequence.
- name: Alcohol Septal Ablation
  description: >-
    Catheter-based infarction of the basal septum through a septal perforator
    branch, an alternative to surgical myectomy for drug-refractory obstruction
    in patients who are poor surgical candidates. It does not address concomitant
    mitral or subvalvular abnormalities, which is where myectomy is preferred.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: alcohol septal ablation
    term:
      id: NCIT:C80439
      label: Septal Ablation
  target_mechanisms:
  - target: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
    treatment_effect: INHIBITS
    description: >-
      Reduces basal septal muscle mass, relieving the mechanical obstruction
      component of this node.
    evidence:
    - reference: PMID:26746632
      reference_title: "Long-term clinical outcome after alcohol septal ablation for obstructive hypertrophic cardiomyopathy: results from the Euro-ASA registry."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Alcohol septal ablation reduced the LV outflow tract gradient from 67 ±
        36 to 16 ± 21 mmHg (P < 0.01) and NYHA class from 2.9 ± 0.5 to 1.6 ± 0.7
        (P < 0.01).
      explanation: >-
        Supports this edge specifically: names the outflow gradient as the
        quantity the procedure moves and gives the size of the reduction across
        1275 patients. Directness is INDIRECT because the registry is obstructive
        HCM broadly rather than genotyped MYH7 carriers.
  evidence:
  - reference: PMID:26746632
    reference_title: "Long-term clinical outcome after alcohol septal ablation for obstructive hypertrophic cardiomyopathy: results from the Euro-ASA registry."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Euro-ASA registry demonstrated low peri-procedural and long-term
      mortality after ASA. This intervention provided durable relief of symptoms
      and a reduction of LV outflow tract obstruction in selected and highly
      symptomatic patients with obstructive HCM.
    explanation: >-
      The largest multinational ablation registry (1275 patients, median 5.7
      years) establishing durability and peri-procedural safety. Directness is
      INDIRECT because the cohort is obstructive HCM broadly rather than
      genotyped MYH7 carriers.
  notes: >-
    The registry reports that residual post-procedural obstruction was associated
    with both worse functional status and worse prognosis, so the entry records
    ablation as gradient-directed therapy whose benefit tracks how completely the
    gradient is eliminated. No claim is made here about ablation versus myectomy:
    the comparative literature was not screened this round, and the preference for
    myectomy stated in this treatment's description is a statement of when the
    concomitant mitral and subvalvular pathology needs surgical correction, not a
    comparative-efficacy claim.

    therapeutic_modality is SURGERY because that is the coarse procedural bucket
    the enum offers. The procedure is catheter-based, and NCIT:C80439 sits under
    cardiac ablation rather than under surgery; there is no DEVICE-free
    interventional value in ModalityEnum to distinguish the two.
- name: MYH7 Allele-Directed Gene Editing (Preclinical)
  description: >-
    Two preclinical strategies target the MYH7 allele itself rather than its
    downstream consequences. Adenine base editing corrects the pathogenic base in
    patient-derived cardiomyocytes and in humanized mice; high-precision Cas13d
    instead degrades the mutant transcript while sparing the wild-type allele,
    which suits the dominant-negative biology of missense MYH7 disease. Neither is
    an approved therapy, and both face delivery, durability and off-target
    questions. They are curated here because they are the only interventions in
    this entry that act on the trigger node.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: MYH7 Missense Variant in Beta-Cardiac Myosin Heavy Chain
    treatment_effect: INHIBITS
    description: >-
      Base editing removes the causal substitution and RNA-targeting Cas13d
      suppresses the mutant transcript, so both act on the initiating lesion
      rather than on any downstream mechanism.
    evidence:
    - reference: PMID:36797478
      reference_title: "Base editing correction of hypertrophic cardiomyopathy in human cardiomyocytes and humanized mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that delivery of base editing components rescues pathological
        manifestations of HCM in induced pluripotent stem cell cardiomyocytes
        derived from patients with HCM and in a humanized mouse model of HCM.
      explanation: >-
        Supports the edge specifically: correcting the MYH7 base rescues the
        disease phenotype, which is what establishes the trigger node as the
        target being acted on.
  evidence:
  - reference: PMID:36797478
    reference_title: "Base editing correction of hypertrophic cardiomyopathy in human cardiomyocytes and humanized mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study we identify an adenine base editor and single-guide RNA
      system that can efficiently correct this human PV with minimal bystander
      editing and off-target editing at selected sites.
    explanation: >-
      Establishes correction of the archetypal CMH1 allele, R403Q, as technically
      achievable with acceptable editing specificity.
  - reference: PMID:38752340
    reference_title: "Allele-Specific Suppression of Variant MHC With High-Precision RNA Nuclease CRISPR-Cas13d Prevents Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo application of hpCas13d to 2 hypertrophic cardiomyopathy models
      caused by distinct human MYH7 analogous sequence variations specifically
      suppressed the altered allele and prevented cardiac hypertrophy.
    explanation: >-
      The alternative allele-directed strategy: silencing the mutant transcript
      rather than correcting the gene, which suits a dominant-negative missense
      mechanism.
  - reference: PMID:36797483
    reference_title: "Efficient in vivo genome editing prevents hypertrophic cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these data indicated that base editing of the mutant R403Q
      allele, delivered several months or only weeks in advance of the typical
      time for disease manifestations, resulted in durable prevention of
      ventricular remodeling and hypertrophy.
    explanation: >-
      The independent contemporaneous demonstration that a single in vivo editing
      dose durably prevents the remodeling phenotype in an R403Q mouse, curated
      alongside the correction and silencing strategies above so the treatment
      record does not rest on a single group.
  notes: >-
    Preclinical only. No gene, RNA or cell therapy is approved for CMH1, and the
    named clinical gene-replacement program in hypertrophic cardiomyopathy
    (TN-201) targets MYBPC3, not MYH7, so it is deliberately not recorded here.
- name: Beta-Adrenergic Blockade
  description: >-
    A non-vasodilating beta-blocker is the conventional first-line drug for
    symptomatic obstructive hypertrophic cardiomyopathy, reducing the dynamic
    outflow gradient through negative inotropy and chronotropy and lengthening
    diastolic filling time. The evidence base is weaker than its first-line
    position suggests: in the only randomized placebo-controlled crossover trial
    in mildly to moderately symptomatic patients, nadolol did not improve maximal
    oxygen consumption and reduced peak exercise work load in most patients,
    though a majority still preferred active drug to placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: nadolol
      term:
        id: CHEBI:7444
        label: nadolol
  target_mechanisms:
  - target: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
    treatment_effect: INHIBITS
    description: >-
      Negative inotropy reduces the dynamic subaortic gradient and slower heart
      rates lengthen diastolic filling, so the drug acts on the obstruction and
      filling components of this node rather than on the sarcomeric lesion.
  evidence:
  - reference: PMID:8496536
    reference_title: "A double-blind, placebo-controlled crossover trial of nadolol and verapamil in mild and moderately symptomatic hypertrophic cardiomyopathy."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with mild or moderately symptomatic hypertrophic
      cardiomyopathy, exercise capacity was not improved by nadolol or verapamil,
      and individuals were more often impaired by nadolol than with verapamil.
    explanation: >-
      Recorded as REFUTE against the claim that beta-blockade improves functional
      capacity: in this randomized crossover trial it did not, and nadolol
      impaired peak work load more often than verapamil did. Directness is
      INDIRECT because the trial enrolled broad HCM rather than genotyped MYH7
      carriers, and because it was restricted to mildly and moderately
      symptomatic patients.
  - reference: PMID:8496536
    reference_title: "A double-blind, placebo-controlled crossover trial of nadolol and verapamil in mild and moderately symptomatic hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the effects on exercise capacity, 13 patients (81%) preferred drug
      treatment (8 verapamil, 5 nadolol) over placebo (p = 0.001).
    explanation: >-
      The counterpart to the item above, and the reason both drugs remain in use:
      patients preferred active drug to placebo even where objective exercise
      capacity did not improve. Curated as a separate item because the sentence
      supports a different claim from the one the CONCLUSIONS sentence refutes.
  notes: >-
    Curated with an honest negative alongside the positive. The first-line
    position of beta-blockade in hypertrophic cardiomyopathy rests on
    guideline consensus and physiological reasoning, not on a trial showing
    improved exercise capacity; the one randomized placebo-controlled trial found
    the opposite. Both evidence items quote the same study, split so each carries
    a single direction, as the evidence policy requires.
- name: Verapamil
  description: >-
    A non-dihydropyridine calcium channel blocker used when beta-blockade is
    ineffective or not tolerated. It improves diastolic filling and reduces
    symptoms, and in direct comparison was better tolerated than nadolol.
    Guidelines caution against it in severe outflow obstruction with hypotension
    because its vasodilator effect can worsen the gradient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
    - preferred_term: calcium channel blocker
      term:
        id: NCIT:C333
        label: Calcium Channel Blocker
  target_mechanisms:
  - target: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
    treatment_effect: INHIBITS
    description: >-
      Acts on the diastolic-filling component of this node; unlike the myosin
      inhibitors it does not target the contractile lesion itself.
  evidence:
  - reference: PMID:8496536
    reference_title: "A double-blind, placebo-controlled crossover trial of nadolol and verapamil in mild and moderately symptomatic hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Verapamil improved reported performance at work compared with nadolol (p =
      0.01) and tended to improve other measures of health-related behavior and
      symptoms compared with nadolol and placebo.
    explanation: >-
      The head-to-head result placing verapamil ahead of a beta-blocker on
      patient-reported measures, which is why it is curated as a distinct
      treatment rather than a footnote to beta-blockade. Directness is INDIRECT
      because the trial enrolled broad HCM rather than genotyped MYH7 carriers.
- name: Oral Anticoagulation for Atrial Fibrillation
  description: >-
    Atrial fibrillation in hypertrophic cardiomyopathy carries a thromboembolic
    risk high enough that anticoagulation is recommended on the arrhythmia alone
    rather than gated on a general-population risk score. Roughly a fifth of
    patients develop atrial fibrillation and about a quarter of those experience
    thromboembolism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Atrial Fibrillation
    treatment_effect: INHIBITS
    description: >-
      Anticoagulation does not treat the arrhythmia; it acts on the
      thromboembolic consequence that makes atrial fibrillation dangerous in this
      disease.
  evidence:
  - reference: PMID:24014282
    reference_title: "Atrial fibrillation and thromboembolism in patients with hypertrophic cardiomyopathy: systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AF is common in HCM and associated with high thromboembolic risk. LA
      dimension and age are independently associated with AF but the literature
      is insufficient to create robust clinical tools to predict AF or
      thromboembolism. Most data suggest that AF patients should be
      anticoagulated.
    explanation: >-
      The pooled basis for anticoagulating on the arrhythmia alone, and an
      explicit statement that the evidence does not support a prediction tool.
      Directness is INDIRECT because the 7381-patient pooled population is broad
      HCM rather than genotyped MYH7 carriers.
  - reference: PMID:24014282
    reference_title: "Atrial fibrillation and thromboembolism in patients with hypertrophic cardiomyopathy: systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A population of 7381 patients (33 studies) revealed overall AF prevalence
      of 22.45% (95% CI 20.13% to 24.77%)
    explanation: >-
      Quantifies how often the indication for this treatment arises. Directness is
      INDIRECT for the same broad-HCM reason.
  notes: >-
    The same review records that there were no randomised controlled trials of
    therapy, and that data on interventions other than anticoagulation were
    limited and contradictory. The recommendation is therefore curated as
    consensus resting on observational association, not on trial evidence.
clinical_trials:
- name: NCT01912534
  phase: PHASE_II
  status: COMPLETED
  description: >-
    VANISH (Valsartan for Attenuating Disease Evolution in Early Sarcomeric
    Hypertrophic Cardiomyopathy) tested whether the angiotensin receptor blocker
    valsartan can modify disease progression in young carriers of sarcomeric gene
    mutations, including MYH7, with early-stage HCM.
  target_phenotypes:
  - preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:31813281
    reference_title: "Baseline Characteristics of the VANISH Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      targeted young sarcomeric gene mutation carriers with early-stage
      hypertrophic cardiomyopathy (HCM) to test whether valsartan can modify
      disease progression.
    explanation: >-
      Describes the VANISH trial's design and its enrollment of young sarcomeric
      (including MYH7) mutation carriers with early HCM.
- name: NCT05186818
  phase: PHASE_III
  status: COMPLETED
  description: >-
    SEQUOIA-HCM, the pivotal phase 3 trial of the cardiac myosin inhibitor
    aficamten in symptomatic obstructive hypertrophic
    cardiomyopathy. Relevant to CMH1 because the drug's target is the
    beta-cardiac myosin motor that MYH7 encodes.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: clinicaltrials:NCT05186818
    reference_title: "A Phase 3, Multi-Center, Randomized, Double-blind, Placebo-controlled Trial to Evaluate the Efficacy and Safety of CK-3773274 in Adults With Symptomatic Hypertrophic Cardiomyopathy and Left Ventricular Outflow Tract Obstruction"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to evaluate the efficacy and safety of
      aficamten (CK-3773274) versus placebo in adults with symptomatic
      hypertrophic cardiomyopathy (HCM) and left ventricular outflow tract
      obstruction.
    explanation: >-
      Establishes the trial's agent, comparator and target population.
- name: NCT04349072
  phase: PHASE_III
  status: COMPLETED
  description: >-
    VALOR-HCM, which tested whether mavacamten allows patients who already meet
    guideline criteria for septal reduction therapy to avoid the procedure. It is
    the trial that positioned myosin inhibition ahead of invasive septal
    reduction in the treatment sequence rather than alongside it.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:35798455
    reference_title: "Myosin Inhibition in Patients With Obstructive Hypertrophic Cardiomyopathy Referred for Septal Reduction Therapy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 16 weeks, 43 of 56 placebo patients (76.8%) and 10 of 56 mavacamten
      patients (17.9%) met guideline criteria or underwent SRT, difference
      (58.9%; 95% CI: 44.0%-73.9%; P < 0.001).
    explanation: >-
      The primary endpoint result. Directness is INDIRECT because the trial
      enrolled obstructive HCM broadly rather than genotyped MYH7 carriers.
experimental_models:
- name: MYH7 R403Q hiPSC-cardiomyocyte cardiac microtissue with wild-type fibroblasts
  description: >-
    Engineered three-dimensional cardiac microtissues built from isogenic MYH7
    R403Q heterozygous hiPSC-derived cardiomyocytes together with wild-type
    ventricular cardiac fibroblasts. The co-culture is the point: a
    cardiomyocyte-only model cannot show the cardiomyocyte-to-fibroblast
    cross-talk that produces the fibrotic component of the disease, and this
    system reproduces collagen deposition, tissue stiffening and the EGFR
    dependence of stromal activation.
  experimental_model_type: CO_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:39413182
  modeled_mechanisms:
  - target: Cardiomyocyte-to-Fibroblast EGFR Paracrine Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model was built to interrogate this node and demonstrates each of its
      claims — paracrine transfer, fibroblast proliferation dependence, and EGFR
      as the transducing receptor.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because the system omits the immune,
      vascular and haemodynamic-loading environments in which fibrosis develops
      in patients, and because hiPSC-derived cardiomyocytes remain immature
      relative to adult ventricular myocardium.
    evidence:
    - reference: PMID:39413182
      reference_title: "Hypertrophic cardiomyopathy-associated mutations drive stromal activation via EGFR-mediated paracrine signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together, these findings establish a paracrine-mediated cross-talk
        potentially responsible for fibrotic changes observed in HCM.
      explanation: >-
        The authors' own summary of what the model establishes, which is the
        content of the node it is linked to.
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduces the interstitial-fibrosis and stiffening component of the
      remodeling node.
    limitations: >-
      It reproduces only one of the node's three components. There is no
      ventricular hypertrophy and no myofibre disarray in a microtissue, and the
      model observes cellular-scale readouts while the node is a tissue-scale
      claim, so the tissue-level inference is an upward extrapolation.
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        Collagen content and elastic modulus are measured in a millimetre-scale
        engineered construct of two cell types; the node describes remodeling of
        an intact ventricular wall under haemodynamic load.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cardiomyocyte hypertrophy and myofibre disarray, two of the three
        components of the node, are not represented in the model at all.
- name: MYH7 G256E gene-edited hiPSC-cardiomyocyte multiscale platform
  description: >-
    An isogenic gene-edited MYH7 WT/G256E hiPSC line characterised in parallel at
    purified-protein, myofibril, single-cell and engineered-heart-tissue level.
    Its value for this entry is that it carries one allele through every scale of
    the mechanism chain at once, so the hypercontractility claim does not depend
    on any single assay — the failure mode the report itself flags for R403Q,
    where single-assay measurements have gone both ways.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38683993
  modeled_mechanisms:
  - target: Destabilization of the Autoinhibited Super-Relaxed State
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Quantifies the folded-back myosin fraction directly for a named MYH7
      allele, giving the node a measured effect size rather than a class claim.
  - target: Sarcomere Hypercontractility with Impaired Relaxation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Greater and faster tension development was reproduced in myofibrils, in
      single cells and in engineered heart tissue from the same edited line.
    limitations: >-
      G256E is an incompletely penetrant allele, so the cellular phenotype it
      produces is not automatically the phenotype of the more severe MYH7
      alleles; and hiPSC-cardiomyocyte immaturity limits extrapolation of
      absolute contractile parameters to adult myocardium.
    evidence:
    - reference: PMID:38683993
      reference_title: "Incomplete-penetrant hypertrophic cardiomyopathy MYH7 G256E mutation causes hypercontractility and elevated mitochondrial respiration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Myofibrils from gene-edited MYH7WT/G256E human induced pluripotent stem
        cell-derived cardiomyocytes (hiPSC-CMs) exhibited greater and faster
        tension development. This hypercontractile phenotype persisted in
        single-cell hiPSC-CMs and engineered heart tissues.
      explanation: >-
        Shows the hypercontractile phenotype holding across three scales in one
        isogenic system, which is what makes this model informative for the node
        rather than one more single-assay result.
- name: MYH7 R403Q and TNNT2 R92Q hiPSC-cardiomyocyte engineered heart tissue
  description: >-
    Two-dimensional hiPSC-cardiomyocyte cultures and three-dimensional engineered
    heart tissue carrying MYH7 R403Q, used to test whether the impaired-relaxation
    phenotype is pharmacologically correctable. Relaxation improved with SGLT2
    inhibitors, and the effect grew with culture duration as the tissue matured.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38240646
  modeled_mechanisms:
  - target: Sarcomere Hypercontractility with Impaired Relaxation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the impaired-relaxation and increased-force halves of the node
      in a human system carrying the archetypal CMH1 allele.
    limitations: >-
      hiPSC-cardiomyocyte immaturity is explicitly a variable in this study
      rather than a background caveat: the size of the drug effect depended on
      culture duration, so results at any single timepoint are maturation-state
      dependent.
    evidence:
    - reference: PMID:38240646
      reference_title: "Hypertrophic cardiomyopathy dysfunction mimicked in human engineered heart tissue and improved by sodium-glucose cotransporter 2 inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        HCM mutations in hiPSC-CMs impaired relaxation or increased force,
        mimicking early features observed in human HCM.
      explanation: >-
        States that the model reproduces the early cellular features this node
        describes.
animal_models:
- name: alpha-MHC 403/+ knock-in mouse
  species: Mouse
  genotype: Myh6 Arg403Gln (R403Q) heterozygous knock-in
  description: >-
    The founding animal model of the field, introducing the R403Q substitution
    into the mouse alpha-cardiac myosin heavy chain gene. Heterozygotes develop
    the histopathology of human familial hypertrophic cardiomyopathy with age;
    homozygotes die within a week of birth. Cardiac dysfunction preceded the
    histological changes, which is the model's principal contribution to the
    causal ordering curated in this entry's pathophysiology.
  publication: PMID:8614836
  modeled_mechanisms:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Myocyte disarray, hypertrophy and fibrosis develop and increase with age,
      reproducing the tissue-level remodeling node.
    limitations: >-
      The substitution is in Myh6 (alpha-cardiac myosin), not the Myh7 orthologue
      of the human disease gene, because the adult mouse ventricle expresses
      alpha- rather than beta-myosin. So the model reproduces the pathology of a
      403 substitution in the myosin that mouse hearts actually use, and its
      relevance to human MYH7 disease rests on the residue and the motor domain
      being conserved rather than on the gene being the same one. Mouse cardiac
      electrophysiology also differs substantially from human.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The lesion is carried by the alpha-myosin heavy chain gene Myh6, whereas
        human CMH1 is a disease of MYH7/beta-myosin. The two isoforms differ in
        their kinetics, so a 403 substitution is not necessarily equivalent in
        both.
    evidence:
    - reference: PMID:8614836
      reference_title: "A mouse model of familial hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac dysfunction preceded histopathologic changes, and myocyte
        disarray, hypertrophy, and fibrosis increased with age.
      explanation: >-
        Documents the tissue phenotype and, importantly for the causal ordering
        curated here, that functional impairment came first.
  notes: >-
    Retained despite its LOW fidelity because it is the model that established
    that a single myosin missense allele is sufficient to produce the disease,
    and because the species caveat it carries is exactly the reason the
    beta-myosin rabbit and pig models below exist.
- name: beta-MyHC-Q403 transgenic rabbit
  species: Rabbit
  genotype: Transgenic beta-myosin heavy chain Gln403 (Q403)
  description: >-
    A transgenic rabbit expressing the Q403 beta-myosin heavy chain, which
    matches the human disease in the myosin isoform as well as the residue: like
    humans and unlike mice, the adult rabbit ventricle runs on beta-myosin. Forty-seven
    animals were phenotyped at four age periods over four years, making this the
    natural-history model for the disease.
  publication: PMID:15135661
  modeled_mechanisms:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Disarray, hypertrophy and fibrosis all develop, and the longitudinal design
      separates them in time: disarray appears early and independently of
      hypertrophy and fibrosis, which emerge later around puberty.
    limitations: >-
      This is a transgenic overexpression model rather than a knock-in, so the
      mutant protein is not expressed from its own locus at its own dose. The
      allele is also a single one, Q403, so the age-ordering it reveals may not
      generalise to MYH7 alleles acting through different mechanisms.
    evidence:
    - reference: PMID:15135661
      reference_title: "Evolution of expression of cardiac phenotypes over a 4-year period in the beta-myosin heavy chain-Q403 transgenic rabbit model of human hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Myocyte disarray also occurred early, prior to, and independent of
        hypertrophy and fibrosis. The latter phenotypes evolved predominantly
        during puberty in conjunction with activation of stress-related signaling
        kinases.
      explanation: >-
        Separates the three components of the remodeling node in time and shows
        they are not one process, which is a claim only a longitudinal model can
        make.
  - target: Increased Motor Force and Energetic Cost
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Calcium sensitivity of myofibrillar ATPase activity was altered as the
      earliest detectable phenotype, before any histological or structural
      change.
    limitations: >-
      The direction is a reduction in calcium sensitivity of myofibrillar ATPase
      in this model, which is a different measurement from the raised intrinsic
      force and tension cost curated on the human node from R403Q myectomy
      tissue. It supports the node's claim that myofilament energetics are
      disturbed early, not that they are disturbed in the same direction.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's measured quantity is calcium sensitivity of myofibrillar
        ATPase activity, and it moves downward. The node's quantities are
        intrinsic motor force and the energetic cost of tension, both raised in
        human R403Q myectomy tissue. The model stands in for the node on the
        claim that myofilament energetics are perturbed at the head of the causal
        sequence, not on the direction or the identity of the perturbation.
    evidence:
    - reference: PMID:15135661
      reference_title: "Evolution of expression of cardiac phenotypes over a 4-year period in the beta-myosin heavy chain-Q403 transgenic rabbit model of human hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ca(+2) sensitivity of myofibrillar ATPase activity is a primary phenotype
        expressed early and independent of the ensuing phenotypes.
      explanation: >-
        Places a myofilament-energetics abnormality at the head of the causal
        sequence in a beta-myosin model.
- name: MYH7 R723G knock-in pig
  species: Pig
  genotype: MYH7 R723G heterozygous knock-in (TALEN-mediated, orthologous c.2167C>G)
  description: >-
    TALEN-mediated knock-in of the orthologous human HCM mutation R723G into the
    porcine MYH7 gene, followed by somatic cell nuclear transfer cloning. Unlike
    the mouse, the pig expresses beta-myosin as the predominant adult ventricular
    isoform and has human-like cardiac anatomy and electrophysiology. The
    piglets died within 24 hours of birth, and this severity is the model's
    limitation as much as its finding.
  publication: PMID:29555974
  modeled_mechanisms:
  - target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Neonatal animals showed mild myocyte disarray and malformed nuclei,
      establishing that the histological lesion can arise before birth from a
      knock-in MYH7 allele.
    limitations: >-
      The animals died within 24 hours post partem, so the model captures a
      perinatal phenotype far more severe than the adult-onset human disease and
      cannot report on natural history, hypertrophy development, or fibrosis at
      all. Only disarray and nuclear morphology were observed; hypertrophy and
      interstitial fibrosis, the node's other components, were not.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: INVALIDATING
      description: >-
        Perinatal lethality truncates the model at 24 hours of age, before the
        adult-onset remodeling this node describes could develop, so the node's
        hypertrophy and fibrosis components have no counterpart in the animal.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The node's hypertrophy component is not merely unobserved: the paper
        reports the hearts showed no obvious hypertrophy. Interstitial fibrosis
        is not reported either way. So of the node's three components the model
        shows one (disarray), contradicts one (hypertrophy), and is silent on the
        third.
    evidence:
    - reference: PMID:29555974
      reference_title: "Successful knock-in of Hypertrophic Cardiomyopathy-mutation R723G into the MYH7 gene mimics HCM pathology in pigs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, the animals died within 24 h post partem, probably due to
        heart failure as indicated by a shift in the a/ß-MyHC ratio in the left
        ventricle.
      explanation: >-
        Records the perinatal lethality that both defines what this model can
        show and limits it to the earliest phase of the disease.
  notes: >-
    Curated with an explicit note on why the species matters. The authors set the
    model up precisely because orthologous beta-myosin mutations in mice do not
    produce the human phenotype, the adult mouse ventricle running on
    alpha-myosin; a pig ventricle, like a human one, is predominantly beta-myosin.
    That is the same reasoning behind the rabbit model above.

    Spontaneous feline hypertrophic cardiomyopathy (PMID:36928240) was screened
    as a fourth model and deliberately not curated. It is a genuine spontaneous
    large-animal disease and the transcriptomic overlap with human HCM is real,
    but the established breed-associated variants are MYBPC3 (A31P in Maine
    Coon, R820W in Ragdoll) rather than MYH7, and most feline cases are
    genetically unresolved. It would belong in the parent Hypertrophic
    Cardiomyopathy entry, not in the MYH7 entity.

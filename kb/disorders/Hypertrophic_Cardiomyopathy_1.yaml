      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23674365
    reference_title: "A systematic review and meta-analysis of genotype-phenotype associations in patients with hypertrophic cardiomyopathy caused by sarcomeric protein mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no differences when the two most frequently affected genes,
      MYBPC3 and MYH7, were compared.
    explanation: >-
      Records the important nuance that, at the cohort level, MYH7 and MYBPC3 do
      not differ significantly across the pooled clinical features, so MYH7 is
      not simply a uniformly more severe genotype than MYBPC3; it is one of the
      two commonest sarcomeric causes.
  - reference: PMID:39681440
    reference_title: "[Correlation between genotype and clinical phenotype in hypertrophic cardiomyopathy families with MYH7-R453C mutation]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the five families with HCM carrying MYH7-R453C mutations, genotype is
      highly correlated with clinical phenotype, and patients have a high risk of
      sudden death and poor prognosis.
    explanation: >-
      A family study of a specific MYH7 variant documenting high sudden-death
      risk and poor prognosis, the arrhythmic endpoint of this node.
  downstream:
  - target: Left Ventricular Diastolic Dysfunction
    causal_link_type: DIRECT
    description: >-
      The impaired-relaxation and reduced-compliance component of this node
      presenting as the measured clinical phenotype.
  - target: Left Ventricular Outflow Tract Obstruction
    causal_link_type: DIRECT
    description: >-
      The obstruction component of this node presenting as the clinical
      phenotype targeted by myosin inhibitors and septal reduction.
  - target: Congestive Heart Failure
    causal_link_type: DIRECT
    description: >-
      Sustained diastolic dysfunction, and in a minority progression to systolic
      impairment, produce clinical heart failure.
  - target: Ventricular Arrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The arrhythmic component of this node presenting clinically. Curated with
      unknown intermediates because which of hypertrophy, disarray, fibrosis and
      ischaemia carries the arrhythmic substrate in any given patient is not
      resolved.
  - target: Atrial Fibrillation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Raised filling pressures enlarge the left atrium, and left atrial dimension
      is the intermediate that predicts atrial fibrillation in this disease.
  - target: Syncope
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Syncope may arise from the outflow obstruction, from an arrhythmic event,
      or from an abnormal vascular response to exertion; which applies in a given
      episode is usually not determined.
phenotypes:
- name: Hypertrophic Cardiomyopathy
  category: Cardiovascular
  description: >-
    Unexplained left ventricular hypertrophy, not accounted for by abnormal
    loading conditions, is the defining feature of CMH1.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  frequency: OBLIGATE
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertrophic cardiomyopathy (HCM) is a genetic disorder that is characterized by left ventricular hypertrophy unexplained by secondary causes and a nondilated left ventricle with preserved or increased ejection fraction."
    explanation: >-
      States the defining clinical feature — unexplained left ventricular
      hypertrophy with a nondilated ventricle — of the disease this MYH7 form
      manifests.
- name: Asymmetric Septal Hypertrophy
  category: Cardiovascular
  description: >-
    Asymmetric, septal-predominant left ventricular hypertrophy is the classic
    morphological pattern of MYH7-related hypertrophic cardiomyopathy.
  phenotype_term:
    preferred_term: Asymmetric septal hypertrophy
    term:
      id: HP:0001670
      label: Asymmetric septal hypertrophy
  evidence:
  - reference: PMID:23674365
    reference_title: "A systematic review and meta-analysis of genotype-phenotype associations in patients with hypertrophic cardiomyopathy caused by sarcomeric protein mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of any sarcomere gene mutation was associated with a younger
      age at presentation (38.4 vs 46.0 years, p<0.0005), a family history of HCM
      (50.6% vs 23.1%, p<0.0005), a family history of SCD (27.0% vs 14.9%,
      p<0.0005) and greater MLVWT (21.0 vs 19.3 mm, p=0.03).
    explanation: >-
      Sarcomere-positive HCM, of which MYH7 is a leading cause, shows greater
      maximum left ventricular wall thickness than sarcomere-negative disease,
      supporting the pronounced hypertrophy of this member.
- name: Left Ventricular Outflow Tract Obstruction
  category: Cardiovascular
  description: >-
    Dynamic obstruction of the left ventricular outflow tract arises from
    hypercontractility combined with septal hypertrophy and systolic anterior
    motion of the mitral valve, defining the obstructive phenotype targeted by
    myosin inhibitors and septal reduction therapy.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:

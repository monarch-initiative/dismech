treatments:
- name: Mavacamten (Cardiac Myosin Inhibitor)
  description: >-
    Mavacamten is a small-molecule allosteric inhibitor of cardiac myosin ATPase
    that reduces the number of force-generating actin-myosin cross-bridges,
    stabilizing myosin in the energy-sparing super-relaxed state. It directly
    counteracts the hypercontractility that is the central abnormality of HCM, and
    is approved for symptomatic obstructive hypertrophic cardiomyopathy; because
    beta-cardiac myosin is the MYH7 gene product, the drug acts on the same motor
    that carries the CMH1 lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mavacamten pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Destabilization of the Autoinhibited Super-Relaxed State
    treatment_effect: INHIBITS
    description: >-
      Mavacamten stabilizes the super-relaxed state and reduces the number of
      heads available for force generation, directly opposing the SRX
      destabilization that drives hypercontractility.
    evidence:
    - reference: PMID:40118457
      reference_title: "Dynamics of β-cardiac myosin between the super-relaxed and disordered-relaxed states."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        cardiac myosin inhibitor mavacamten slows nucleotide release by an equal
        factor for both heavy meromyosin and subfragment 1, thus only indirectly
        influencing the occupancy time of the SRX state.
      explanation: >-
        Establishes mavacamten's biochemical action on beta-cardiac myosin
        nucleotide handling and its effect on SRX-state occupancy, the node it
        targets.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac muscle hypercontractility is a key pathophysiological abnormality
      in hypertrophic cardiomyopathy, and a major determinant of dynamic left
      ventricular outflow tract (LVOT) obstruction.
    explanation: >-
      The pivotal phase 3 trial establishing the rationale and use of a cardiac
      myosin inhibitor targeting hypercontractility in obstructive HCM.
- name: Septal Reduction (Surgical Myectomy)
  description: >-
    Surgical septal myectomy relieves severe drug-refractory left ventricular
    outflow tract obstruction by resecting hypertrophied basal septal muscle.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: septal myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
- name: Implantable Cardioverter-Defibrillator
  description: >-
    An implantable cardioverter-defibrillator provides secondary or primary
    prevention of sudden cardiac death in patients judged to be at high arrhythmic
    risk, terminating malignant ventricular arrhythmia.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement

  - reference: PMID:40118457
    reference_title: "Dynamics of β-cardiac myosin between the super-relaxed and disordered-relaxed states."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Some mutations which cause hypertrophic or dilated cardiomyopathies alter
      the SRX-DRX equilibrium, but not all mutations.
    explanation: >-
      Important caveat curated with the node: SRX-DRX destabilization is a common
      but not universal consequence of cardiomyopathy myosin mutations, so this
      arm applies to the large subset of alleles that shift the equilibrium
      rather than to every MYH7 variant. PARTIAL for that reason.

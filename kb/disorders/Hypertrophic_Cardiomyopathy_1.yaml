    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Atrial fibrillation is also a common complication and is not well tolerated."
    explanation: >-
      Establishes atrial fibrillation as a common and clinically consequential
      complication of the disease.
- name: Syncope
  category: Cardiovascular
  description: >-
    Unexplained syncope in hypertrophic cardiomyopathy may reflect dynamic
    outflow obstruction, an arrhythmic event, or an abnormal vascular response to

- name: Cardiomyocyte-to-Fibroblast EGFR Paracrine Signaling
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Interstitial fibrosis in CMH1 is not solely a passive response to wall
    stress. In engineered cardiac microtissues built from MYH7 R403Q hiPSC-derived
    cardiomyocytes co-cultured with wild-type ventricular cardiac fibroblasts,
    the mutant cardiomyocytes release paracrine factors that drive fibroblast
    proliferation and collagen deposition. Collagen I content rose 40% over
    isogenic wild-type microtissues and the tissue stiffened, and the effect
    depended on fibroblast proliferation rather than on cardiomyocyte matrix
    output. Epidermal growth factor alone was sufficient to stimulate the
    stromal cells, and inhibiting EGFR tyrosine kinase with erlotinib attenuated
    the activation — identifying EGFR signalling as the transducing arm and, in
    principle, a druggable one. The same microtissue system shows that the
    tissue-level consequence is hypocontractility even while the individual
    mutant cardiomyocytes are hypercontractile, which is how a cell-autonomous
    gain of contractile function ends up producing a stiff, poorly contracting
    ventricle.

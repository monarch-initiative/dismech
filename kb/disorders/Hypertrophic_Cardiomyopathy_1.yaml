- name: Increased Motor Force and Energetic Cost
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Beyond releasing sequestered heads, individual MYH7 missense alleles alter
    the mechanochemistry of the motor stroke itself. Single-molecule and
    myofibril studies show mutation-specific changes — increased intrinsic force
    per cross-bridge, and faster cross-bridge detachment kinetics — that together
    raise the force generated by the ensemble of motors and increase the ATP
    consumed per unit tension (tension cost). The energetic penalty, measured
    directly in human myocardium carrying R403Q, is a distinctive feature of the
    beta-myosin motor lesion and links the molecular defect to the myocardial
    energy deficit seen in HCM.

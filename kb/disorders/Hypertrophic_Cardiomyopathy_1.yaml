name: Hypertrophic Cardiomyopathy 1
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMH1
- MYH7 hypertrophic cardiomyopathy
- beta-myosin heavy chain hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 1
- familial hypertrophic cardiomyopathy type 1
- hypertrophic cardiomyopathy caused by mutation in MYH7
description: >-
  Hypertrophic cardiomyopathy 1 (CMH1) is the MYH7-related form of familial
  hypertrophic cardiomyopathy and, with the MYBPC3 form (CMH4), one of the two
  commonest genetic causes of the disease. MYH7 encodes the beta-cardiac myosin
  heavy chain (beta-MyHC), the force-generating molecular motor of the cardiac
  thick filament. CMH1 is historically the founding molecular diagnosis of the
  entire field: the first mutation ever shown to cause familial hypertrophic
  cardiomyopathy was the MYH7 Arg403Gln (R403Q) missense change, identified in a
  large kindred in 1990.
  Unlike MYBPC3-related disease, where truncating alleles act through
  haploinsufficiency, the great majority of MYH7 disease alleles are missense
  variants that are stably expressed and incorporated into the sarcomere as a
  mutant motor. The operative mechanism is therefore not loss of protein but a
  gain of contractile function: the mutant myosin destabilizes the folded-back,
  autoinhibited super-relaxed state of the thick filament, freeing more heads to
  interact with actin, and often raises the intrinsic force and the energetic
  cost of each cross-bridge. The net cellular consequence is hypercontractility
  with impaired relaxation and raised tension cost, which drives the structural
  remodeling — cardiomyocyte hypertrophy, myofiber disarray, and interstitial
  fibrosis — that defines the clinical phenotype. Inheritance is autosomal
  dominant with incomplete, age-related penetrance; MYH7 variants carry a
  clinically important risk of malignant ventricular arrhythmia and sudden
  cardiac death, and beta-cardiac myosin is the direct molecular target of the
  cardiac myosin inhibitors (mavacamten, aficamten) now used to treat obstructive
  disease.

discussions:
- discussion_id: cmh1-srx-allele-heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Destabilization of the Autoinhibited Super-Relaxed State
  prompt: >-
    Which MYH7 alleles actually act by destabilizing the super-relaxed state, and
    what mechanism accounts for the rest?
  rationale: >-
    This entry curates the SRX-destabilization arm as the mechanism of a large
    subset of MYH7 alleles rather than all of them, because not every
    cardiomyopathy myosin mutation shifts the SRX-DRX equilibrium. Two of the
    alleles with the best multiscale data illustrate the spread: G256E reduces
    the folded-back fraction by 33% through the transducer region, while R403Q
    has produced context-dependent and sometimes opposing measurements across
    assays. Without an allele-level map, a clinician cannot reason from a
    specific variant to the mechanism, and the SRX arm cannot be used to predict
    who will respond to a myosin inhibitor.
- discussion_id: cmh1-myh7-specific-clinical-evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - prevalence#
  prompt: >-
    Do the clinical results curated in this entry hold specifically for MYH7
    carriers, or only for hypertrophic cardiomyopathy as a whole?
  rationale: >-
    Every clinical trial and outcome cohort cited in this entry enrolled
    hypertrophic cardiomyopathy broadly, not genotyped MYH7 carriers. That
    applies to both myosin inhibitors, to disopyramide, to beta-blockade and
    verapamil, to myectomy and alcohol septal ablation, to the ICD registry, to
    the anticoagulation review and to the LGE meta-analysis, and it is why no
    population prevalence exists for this entity.
    The gap is structural rather than incidental — genotype has not been a
    stratifying variable in HCM trial design — so it will not close through
    ordinary literature accumulation. Recorded so that a reader does not mistake
    the volume of clinical evidence here for evidence about MYH7.
- discussion_id: cmh1-mouse-isoform-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#alpha-MHC 403/+ knock-in mouse
  prompt: >-
    Does a 403 substitution in mouse alpha-cardiac myosin model a human MYH7
    beta-myosin disease?
  rationale: >-
    The founding animal model of this disease carries R403Q in Myh6, not Myh7,
    because the adult mouse ventricle expresses alpha- rather than beta-myosin.
    Evidence therefore exists in the model but its translational validity is the
    open question, which is what distinguishes this from an ordinary knowledge
    gap. The pig study makes the mismatch explicit, stating that orthologous
    beta-MyHC mutations in mice do not produce the phenotype found in patients —
    and that is the stated reason large-animal models were built. Any claim in
    this entry that rests on mouse data inherits this caveat.
  evidence:
  - reference: PMID:29555974
    reference_title: "Successful knock-in of Hypertrophic Cardiomyopathy-mutation R723G into the MYH7 gene mimics HCM pathology in pigs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice express the fast alpha-myosin in the heart, and orthologous ß-MyHC
      mutations do not lead to the phenotype typically found in HCM patients
    explanation: >-
      States the isoform mismatch directly and asserts its translational
      consequence, which is what makes this a model-fidelity question rather than
      a general species caveat.
references:
- reference: PMID:20301725
  title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  Scope and mechanism contrast with CMH4 (MYBPC3). CMH1 is curated as the
  MYH7/beta-cardiac myosin form because MYH7 is, with MYBPC3, one of the two
  commonest genetic causes of HCM and was the founding molecular diagnosis of the
  field (R403Q, 1990). It is deliberately contrasted with the MYBPC3 entry: MYBPC3
  disease is predominantly truncating and acts by haploinsufficiency (loss of the
  cMyBP-C brake), whereas MYH7 disease is predominantly missense and acts by a
  gain of contractile function in a stably expressed mutant motor (super-relaxed
  state destabilization, raised intrinsic force, increased tension cost). Both
  converge on the same maladaptive-remodeling module.

  Allele-heterogeneity caveat preserved on the pathograph: not every MYH7 mutation
  shifts the SRX-DRX equilibrium (PMID:40118457), so the super-relaxed-state arm
  is curated as the mechanism of a large subset of alleles rather than a universal
  one, and the motor-force arm (intrinsic force, tension cost) is curated
  separately. At the cohort level MYH7 and MYBPC3 do not differ significantly
  across pooled clinical features (PMID:23674365), so the entry does not assert
  MYH7 as a uniformly more severe genotype.

  Curating this entry deletes the stub stubs/Hypertrophic_Cardiomyopathy_1.yaml
  and closes the highest-value gap named in the Familial Hypertrophic
  Cardiomyopathy grouping notes. This entry is added as a member of that grouping.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  (PMID:20301725), tagged accordingly in `references`. Its indexed PubMed record
  is content_type abstract_only and carries only the chapter's purpose
  statement, not the Clinical Characteristics, Management, or Genetic Counseling
  sections, so section-by-section GeneReviews mining is not possible from the
  cache and no snippet is quoted from it. The clinical-characteristics baseline
  for this entry is therefore built from the primary MYH7 cohort and pedigree
  literature cited throughout, principally PMID:28912181, PMID:23674365,
  PMID:32871100, PMID:24928957, PMID:39681440.

  2026-09-06 augmentation round (falcon deep research, MONDO:0008647). This round
  added the sections the entry was missing rather than reworking what was there:
  histopathology, biochemical, imaging_findings, progression,
  differential_diagnoses, experimental_models, animal_models, datasets and
  discussions, plus four treatments, two trials and three phenotypes.

  One new mechanism arm was added to the pathograph. Cardiomyocyte-to-Fibroblast
  EGFR Paracrine Signaling (PMID:39413182) records that interstitial fibrosis in
  MYH7 disease is driven by a soluble signal from the mutant cardiomyocyte to the
  fibroblast, not only by wall stress, and that the receptor carrying it is EGFR.
  It sits between hypercontractility and the tissue remodeling node and is
  curated separately because it is a different claim from what the myocardium
  becomes. The same source reports the arm in MYBPC3-truncation microtissues too,
  so it is shared across sarcomeric HCM rather than MYH7-exclusive.

  Directness discipline. Every clinical evidence item added or revised in the
  2026-09-06 round whose source population is hypertrophic cardiomyopathy at
  large rather than genotyped MYH7 carriers carries directness: INDIRECT. That
  covers EXPLORER-HCM, SEQUOIA-HCM, VALOR-HCM, the disopyramide series, the
  nadolol/verapamil crossover trial, the myectomy cohort, the Euro-ASA registry,
  the ICD registry, the atrial-fibrillation systematic review, the LGE
  meta-analysis, the genetic-testing yield figure, the diagnostic wall-thickness
  criterion, and the broad-HCM review used for the atrial fibrillation, syncope,
  fibrosis, histopathology and progression records.

  Three qualifications. First, it is not applied file-wide: evidence items
  predating this round were left as their curator set them, so the file is
  internally mixed and the presence or absence of the slot elsewhere means
  nothing. Second, MYH7-specific sources carry no directness because none is
  needed — the penetrance meta-analysis reports MYH7 as its own stratum, and the
  biophysical, gene-editing and model literature is allele-specific throughout.
  Third, a few broad-source items were assessed and deliberately left unmarked
  because the source names MYH7 within the claim: the sarcomere-panel
  recommendation and the cascade-testing recommendation both apply to a MYH7
  family as stated, as does the statement that MYH7 and MYBPC3 account for about
  half of HCM families. Discussion cmh1-myh7-specific-clinical-evidence records
  the underlying gap as structural so the volume of clinical citation here is not
  read as evidence about MYH7 specifically.

  Scoping rule for preclinical work, applied consistently. A preclinical
  intervention is curated as a `treatments:` record when it acts on a node in
  this entry's pathograph and the disease phenotype was prevented or rescued in a
  disease model. MYH7 allele-directed gene editing meets that and is curated as a
  treatment; the SGLT2-inhibitor finding in MYH7 R403Q engineered heart tissue
  (PMID:38240646) does not — it improved a relaxation parameter in a
  cell-derived construct with no whole-organism arm — so it is curated only as an
  experimental model. The rule, not the preclinical/clinical line, is what
  separates them. The MYH7-specific evidence in this entry is the genetic,
  biophysical and model literature, plus the penetrance meta-analysis
  (PMID:37929589), which reports MYH7 separately at ~65% in non-proband
  relatives against ~11% in incidentally identified carriers, and ~23% versus
  ~12% short-term phenotypic conversion against MYBPC3.

  Retired-enum prose cleanup. Four explanation strings still argued for the
  retired supports: PARTIAL grade (#7439/#10061). They were rewritten to say what
  they meant, and the two that meant an inference step now carry
  directness: INDIRECT on the slot rather than only in prose.

  Report term validation caught six bad CURIEs before use. The falcon report's
  Term Validation section flagged NCIT:C29622 and NCIT:C151608 as nonexistent,
  and HP:0031604 (Agenesis of the carotid canal, offered for myocardial
  fibrosis), HP:0005117 (Elevated diastolic blood pressure, offered for diastolic
  dysfunction), HP:0031797 (Clinical course, offered for incomplete penetrance)
  and NCIT:C139785 (a TNM finding, offered for gene editing) as naming different
  concepts. None was bound. Myocardial fibrosis is bound to HP:0001685 instead,
  found with OAK. A seventh bad binding, HP:0031200 (Hyaline casts) for LVOT
  obstruction, was caught by the term validator during curation and corrected to
  HP:0032092.

  Model fidelity is recorded honestly rather than favourably. The founding
  alpha-MHC 403/+ mouse (PMID:8614836) is LOW fidelity with a SPECIES_MISMATCH
  divergence because its lesion is in Myh6, not the MYH7 orthologue — the adult
  mouse ventricle runs on alpha-myosin. That mismatch is curated as a
  HUMAN_MODEL_MISMATCH discussion rather than a footnote, because the pig study
  states it as the reason large-animal models exist. The beta-myosin rabbit and
  pig models are curated alongside it for that reason; the pig carries an
  INVALIDATING TEMPORAL_SCOPE divergence, since the animals died within 24 hours
  of birth and cannot report on adult natural history at all.

  Aficamten is bound to CHEBI:747213, reusing the binding already validated for
  the sibling CMH4 entry. No NCIT or CHEBI term was found for the drug in the
  local builds otherwise. Alcohol septal ablation is curated with positioning
  evidence only, from the disopyramide series; the ablation-versus-myectomy
  comparative literature was not screened this round and no comparative-efficacy
  claim is made.

- name: Cell-to-Cell Contractile Imbalance
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    A mechanism specific to the missense/poison-peptide biology of MYH7 disease.
    Because the mutant and wild-type MYH7 alleles are transcribed in a random,
    burst-like fashion and independently of one another, the fraction of mutant
    beta-myosin varies markedly from cardiomyocyte to cardiomyocyte within a
    single patient's myocardium. This produces much greater cell-to-cell
    variability of contractile function than in control hearts. The resulting
    mechanical mismatch between adjacent, differently loaded myocytes is proposed
    to drive the myofiber disarray and interstitial fibrosis that are hallmarks
    of HCM, providing a route from the molecular lesion to the tissue phenotype
    that does not depend on the average level of hypercontractility alone.

- name: Destabilization of the Autoinhibited Super-Relaxed State
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    In the resting sarcomere a large fraction of myosin heads occupy the
    super-relaxed (SRX) state — folded back against the thick-filament backbone
    in the interacting-heads motif (IHM), with very low ATPase activity, forming
    an energy-conserving reserve of motors withheld from force generation. Many
    MYH7 HCM mutations map to the interfaces that stabilize this folded-back
    state (the myosin mesa, the head-head and head-tail contacts), and they
    weaken those intramolecular interactions. The result is release of
    sequestered heads from the SRX/IHM into the disordered-relaxed state, so more
    heads become functionally accessible to actin — the molecular origin of
    hypercontractility shared across a large subset of MYH7 alleles.
  cell_types:

    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac muscle hypercontractility is a key pathophysiological abnormality
      in hypertrophic cardiomyopathy, and a major determinant of dynamic left
      ventricular outflow tract (LVOT) obstruction.
    explanation: >-
      Links hypercontractility to dynamic LVOT obstruction. Directness is
      INDIRECT because the trial population is obstructive HCM broadly rather
      than genotyped MYH7 carriers.
- name: Left Ventricular Diastolic Dysfunction
  category: Cardiovascular
  description: >-
    Impaired relaxation and increased chamber stiffness produce diastolic
    dysfunction, an early and characteristic functional consequence of the
    hypercontractile, poorly relaxing myocardium.

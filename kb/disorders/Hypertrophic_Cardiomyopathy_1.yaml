notes: >-
  Scope and mechanism contrast with CMH4 (MYBPC3). CMH1 is curated as the
  MYH7/beta-cardiac myosin form because MYH7 is, with MYBPC3, one of the two
  commonest genetic causes of HCM and was the founding molecular diagnosis of the
  field (R403Q, 1990). It is deliberately contrasted with the MYBPC3 entry: MYBPC3
  disease is predominantly truncating and acts by haploinsufficiency (loss of the
  cMyBP-C brake), whereas MYH7 disease is predominantly missense and acts by a
  gain of contractile function in a stably expressed mutant motor (super-relaxed
  state destabilization, raised intrinsic force, increased tension cost). Both
  converge on the same maladaptive-remodeling module.

  Allele-heterogeneity caveat preserved on the pathograph: not every MYH7 mutation
  shifts the SRX-DRX equilibrium (PMID:40118457), so the super-relaxed-state arm
  is curated as the mechanism of a large subset of alleles rather than a universal
  one, and the motor-force arm (intrinsic force, tension cost) is curated
  separately. At the cohort level MYH7 and MYBPC3 do not differ significantly
  across pooled clinical features (PMID:23674365), so the entry does not assert
  MYH7 as a uniformly more severe genotype.

  Curating this entry deletes the stub stubs/Hypertrophic_Cardiomyopathy_1.yaml
  and closes the highest-value gap named in the Familial Hypertrophic
  Cardiomyopathy grouping notes. This entry is added as a member of that grouping.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  (PMID:20301725), tagged accordingly in `references`. Its indexed PubMed record
  is content_type abstract_only and carries only the chapter's purpose
  statement, not the Clinical Characteristics, Management, or Genetic Counseling
  sections, so section-by-section GeneReviews mining is not possible from the
  cache and no snippet is quoted from it. The clinical-characteristics baseline
  for this entry is therefore built from the primary MYH7 cohort and pedigree
  literature cited throughout, principally PMID:28912181, PMID:23674365,
  PMID:32871100, PMID:24928957, PMID:39681440.

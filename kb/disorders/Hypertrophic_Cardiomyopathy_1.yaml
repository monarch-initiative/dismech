pathophysiology:
- name: MYH7 Missense Variant in Beta-Cardiac Myosin Heavy Chain
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMH1 is a heterozygous missense variant in MYH7,
    the gene encoding the beta-cardiac myosin heavy chain — the ATP-hydrolysing
    motor of the sarcomeric thick filament. The founding example, and still the
    archetype, is Arg403Gln (R403Q), the first mutation ever linked to familial
    hypertrophic cardiomyopathy; R403Q sits in the globular myosin head (S1),
    the region responsible for actin interaction and motor function. In contrast
    to the truncating, haploinsufficiency mechanism of MYBPC3 disease, most MYH7
    alleles are missense changes that are stably expressed and incorporated into
    the sarcomere as a mutant motor, so the mutant protein perturbs contraction
    directly rather than by its absence.

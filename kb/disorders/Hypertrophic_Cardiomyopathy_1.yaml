histopathology:
- name: Myocyte Hypertrophy, Disarray and Interstitial Fibrosis
  description: >-
    The histological triad of hypertrophic cardiomyopathy is cardiomyocyte
    hypertrophy, myofibre disarray (loss of the normal parallel alignment, with
    hypertrophied fibres running obliquely and in whorls) and interstitial
    fibrosis. In MYH7 disease the disarray component is reproduced by the
    orthologous R723G knock-in pig within 24 hours of birth, which places it very
    early in the causal sequence rather than as a late consequence of chronic
    load. Biopsy is not required for diagnosis in routine sarcomeric HCM; this
    section records the tissue phenotype that the pathophysiology chain converges
    on.
  finding_term:
    preferred_term: myocyte hypertrophy, disarray and interstitial fibrosis
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:28912181
    reference_title: "Hypertrophic Cardiomyopathy: Genetics, Pathogenesis, Clinical Manifestations, Diagnosis, and Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The histological features of HCM include myocyte hypertrophy and disarray, as well as interstitial fibrosis."
    explanation: >-
      States the histological triad that defines the tissue phenotype of this
      disease. Directness is INDIRECT because the review describes hypertrophic
      cardiomyopathy generally rather than genotyped MYH7 disease.
  - reference: PMID:29555974
    reference_title: "Successful knock-in of Hypertrophic Cardiomyopathy-mutation R723G into the MYH7 gene mimics HCM pathology in pigs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the neonatal pigs displayed features of HCM, including mild myocyte
      disarray, malformed nuclei, and MYH7-overexpression.
    explanation: >-
      Shows disarray arising in an orthologous MYH7 knock-in large animal within
      24 hours of birth, evidencing that the histological lesion is an early
      consequence of the MYH7 allele rather than only a late remodeling endpoint.
  notes: >-
    finding_term is bound only to the generic NCIT Morphologic Finding parent.
    NCIT has no myofibre-disarray term; this follows the binding already used for
    the same finding in the sibling CMH4 entry rather than manufacturing a
    narrower match.
biochemical:
- name: Circulating miR-499a-5p
  presence: Elevated
  context: Plasma, in carriers of pathogenic/likely pathogenic MYH7 variants
  evidence:
  - reference: PMID:35409153
    reference_title: "Circulating miR-499a-5p Is a Potential Biomarker of MYH7-Associated Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further investigation on enlarged groups of individuals showed that its
      level was higher in carriers of pathogenic/likely pathogenic (P/LP)
      variants in MYH7 gene compared to controls (fold change, FC = 8.9; p <
      0.0001).
    explanation: >-
      Quantifies the elevation specifically in MYH7 P/LP variant carriers against
      controls, which is what makes this readout genotype-specific.
  - reference: PMID:35409153
    reference_title: "Circulating miR-499a-5p Is a Potential Biomarker of MYH7-Associated Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      carriers of variants in MYH7 gene were defined with higher miRNA levels
      than carriers of variants in the MYBPC3 gene (FC = 14.1; p = 0.0003) and
      other patients (FC = 4.1; p = 0.0008).
    explanation: >-
      Separates MYH7 from MYBPC3 carriers and from the rest of the HCM
      population, so the signal tracks the gene rather than the phenotype.
  notes: >-
    The one biochemical readout in this entry that is specific to the MYH7
    genotype rather than to hypertrophic cardiomyopathy in general. Plasma
    miR-499a-5p is a cardiac-enriched microRNA whose circulating level separates
    MYH7 variant carriers from MYBPC3 carriers, from other HCM patients, and from
    controls.

    Curated as a research biomarker, not a validated clinical assay. The cohort
    is small (7 MYH7 carriers against 8 MYBPC3 carriers) and the qRT-PCR
    replication did not reproduce the direction of the original RNA-seq
    comparison between HCM patients and controls; the genotype-stratified
    difference is the finding that held.
- name: NT-proBNP
  presence: Elevated
  context: Serum, reflecting wall stress and heart-failure burden
  notes: >-
    N-terminal pro-brain natriuretic peptide is released in response to
    myocardial wall stress and is elevated in hypertrophic cardiomyopathy in
    proportion to heart-failure burden. It is prognostic rather than diagnostic:
    it does not distinguish hypertrophic cardiomyopathy from its phenocopies, and
    it carries no MYH7 specificity.
  evidence:
  - reference: PMID:34940836
    reference_title: "N-terminal pro-brain natriuretic peptide and adverse outcomes in Chinese patients with hypertrophic cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study indicated NT-proBNP was a novel biomarker suitable for
      predicting adverse prognosis in patients with HCM, which may be used for
      early recognition and risk stratification.
    explanation: >-
      Establishes NT-proBNP as a prognostic biomarker in hypertrophic
      cardiomyopathy. Directness is INDIRECT because the cohort is broad HCM
      rather than genotyped MYH7 carriers.

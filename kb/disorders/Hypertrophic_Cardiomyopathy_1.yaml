- name: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Chronic hypercontractility with raised energetic cost, amplified by
    cell-to-cell contractile imbalance, drives the structural remodeling that
    defines the clinical phenotype: cardiomyocyte hypertrophy — typically
    asymmetric and septal-predominant — together with myofiber disarray and
    interstitial and replacement fibrosis. Pro-hypertrophic growth signalling
    contributes: in an MYH7-mutant human iPSC-cardiomyocyte model, cellular
    hypertrophy was prevented by inhibition of ERK or Akt, implicating those
    pathways downstream of the mechanical stimulus. Fibrosis provides the
    substrate for both diastolic dysfunction and re-entrant arrhythmia.

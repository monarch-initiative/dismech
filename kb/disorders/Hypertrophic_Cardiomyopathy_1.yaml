- name: Diastolic Dysfunction, Outflow Obstruction, Heart Failure and Arrhythmic Risk
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The hypertrophied, disarrayed and fibrotic ventricle produces the clinical
    endpoints of CMH1. Hypercontractility with septal hypertrophy generates
    dynamic left ventricular outflow tract obstruction in a subset of patients;
    the stiff, poorly relaxing ventricle causes diastolic dysfunction; and the
    fibrotic, electrically heterogeneous substrate carries a risk of malignant
    ventricular arrhythmia and sudden cardiac death that is clinically important
    for MYH7 variants. Sarcomere-positive disease, of which MYH7 is a leading
    cause, presents younger and with a stronger family history of sudden death
    than sarcomere-negative HCM.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Heart Contraction
    term:

- name: Sarcomere Hypercontractility with Impaired Relaxation
  biological_scale: CELLULAR
  role: effector
  description: >-
    At the cell level the molecular changes converge on hypercontractility:
    CRISPR-edited human iPSC-derived cardiomyocytes carrying an MYH7 HCM mutation
    generate significantly greater contractile force than isogenic controls.
    Because the same lesion disturbs cross-bridge relaxation kinetics, systolic
    hypercontraction is accompanied by impaired diastolic relaxation. This
    hypercontractile, poorly relaxing cell state — a key pathophysiological
    abnormality of HCM and the determinant of dynamic outflow obstruction — is
    the cellular phenotype the cardiac myosin inhibitors were designed to
    normalize.

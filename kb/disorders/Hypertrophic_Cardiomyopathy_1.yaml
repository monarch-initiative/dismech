- name: Atrial Fibrillation
  category: Cardiovascular
  description: >-
    Atrial fibrillation is a common complication of hypertrophic cardiomyopathy,
    arising from the left atrial enlargement that follows chronically raised
    filling pressures. It is poorly tolerated because a hypertrophied,
    non-compliant ventricle depends on atrial contribution to filling, and it
    carries a substantial thromboembolic risk.
  phenotype_term:
    preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:

      CSF inflammation.
diagnosis:
- name: CSF or brain-tissue ameba microscopy
  description: >-
    Direct visualization of motile amebae in cerebrospinal fluid or brain
    tissue can provide a presumptive PAM diagnosis when compatible acute
    meningoencephalitis follows nasal water exposure.
  evidence:
  - reference: PMID:32369575
    reference_title: >-
      Epidemiology and Clinical Characteristics of Primary Amebic
      Meningoencephalitis Caused by Naegleria fowleri: A Global Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A presumptive diagnosis of N. fowleri infection can be made by microscopic
      examination of the cerebrospinal fluid (CSF) or brain tissue
    explanation: >-
      Supports microscopy of CSF or brain tissue as a presumptive diagnostic
      method.
- name: Naegleria confirmatory immunostaining or PCR detection
  description: >-
    Immunohistochemistry, indirect immunofluorescence, and PCR can confirm
    Naegleria fowleri infection in CSF or tissue.
  evidence:
  - reference: PMID:32369575
    reference_title: >-
      Epidemiology and Clinical Characteristics of Primary Amebic
      Meningoencephalitis Caused by Naegleria fowleri: A Global Review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a definitive diagnosis can be made by immunohistochemistry (IHC),
      indirect immunofluorescence (IIF)
    explanation: >-
      Supports immunostaining as a definitive diagnostic method for N. fowleri
      infection.
  - reference: PMID:32369575
    reference_title: >-
      Epidemiology and Clinical Characteristics of Primary Amebic
      Meningoencephalitis Caused by Naegleria fowleri: A Global Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of 85 cases diagnosed by PCR (61 antemortem diagnosis, 21 postmortem
      diagnosis, and 3 with unknown diagnostic timing), 72 (85%) used the CDC
      multiplex real-time PCR assay for simultaneous detection of Acanthamoeba
      spp., Balamuthia mandrillaris, and Naegleria fowleri
    explanation: >-
      Documents PCR-confirmed PAM diagnoses in the global case review and the
      multiplex assay used for most PCR-confirmed cases.
- name: CSF chemistry profile
  description: >-
    PAM CSF typically resembles bacterial meningitis, with high opening
    pressure, neutrophilic pleocytosis, elevated protein, and low glucose.
  markers: CSF opening pressure; CSF white blood cell count; CSF protein; CSF glucose
  evidence:
  - reference: PMID:26582886
    reference_title: >-
      Diagnosis, Clinical Course, and Treatment of Primary Amoebic
      Meningoencephalitis in the United States, 1937-2013.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cerebrospinal fluid analysis resembled bacterial meningitis with high
      opening pressures, elevated white blood cell counts with predominantly
      neutrophils (median, 2400 cells/μL ...), low glucose levels (median, 23
      mg/dL ...), and elevated protein levels (median, 365 mg/dL ...).
    explanation: >-
      Defines the characteristic CSF pressure and chemistry profile in US PAM
      cases.
- name: Amoeba culture and flagellation testing
  description: >-
    CSF-derived amebae can be cultured on non-nutrient agar or transformed in
    distilled water to demonstrate pear-shaped flagellated forms, helping
    distinguish N. fowleri from other free-living amebae.
  evidence:
  - reference: PMID:34572533
    reference_title: >-
      Primary Amoebic Meningoencephalitis by Naegleria fowleri: Pathogenesis
      and Treatments.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      solid non-nutrient agar is the standard method for growing N. fowleri
    explanation: >-
      Supports culture on non-nutrient agar for N. fowleri growth.
  - reference: PMID:35020127
    reference_title: >-
      Real-Time PCR Confirmation of a Fatal Case of Primary Amoebic
      Meningoencephalitis in Turkey Caused by Naegleria fowleri or Brain-Eating
      Amoeba.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The CSF sample collected was taken into distilled water considering the
      possibility of transformation of trophozoites to intermediate form and
      incubated at 37 °C for 1 to 2 h, and pear-shaped non-permanent flagellated
      forms were observed in the direct microscopic examination
    explanation: >-
      Documents a clinical flagellation test used to support N. fowleri
      diagnosis.
treatments:
- name: Multidrug PAM pharmacotherapy
  description: >-
    Reported survivors with confirmed PAM received early intravenous
    amphotericin B and commonly also intrathecal amphotericin B, an azole,
    rifampicin, azithromycin, miltefosine, and dexamethasone.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amphotericin B
      term:
        id: CHEBI:2682
        label: amphotericin B
    - preferred_term: miltefosine
      term:
        id: CHEBI:75283
        label: miltefosine
    - preferred_term: fluconazole
      term:
        id: CHEBI:46081
        label: fluconazole
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32369575
    reference_title: >-
      Epidemiology and Clinical Characteristics of Primary Amebic
      Meningoencephalitis Caused by Naegleria fowleri: A Global Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the following medications were used for treatment: intravenous
      amphotericin B (7/7), intrathecal amphotericin B (5/7), azoles (6/7),
      rifampin (6/7), azithromycin (4/7), miltefosine (4/7), and dexamethasone
      (5/7).
    explanation: >-
      Summarizes the multidrug regimens used among confirmed PAM survivors in
      the global review.
  - reference: PMID:34572533
    reference_title: >-
      Primary Amoebic Meningoencephalitis by Naegleria fowleri: Pathogenesis
      and Treatments.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PAM is a rare, acute, and fulminating infection characterized by very low
      morbidity and a very high mortality rate, two factors that complicate the
      development of a treatment
    explanation: >-
      Explains why PAM drug evidence comes from case reports and preclinical
      studies rather than randomized clinical trials.
- name: Neurocritical intracranial-pressure control
  description: >-
    Survivors have been managed with aggressive control of elevated intracranial
    pressure, including traumatic-brain-injury-style neurocritical care,
    cerebrospinal-fluid diversion by ventricular shunt, and therapeutic
    hypothermia alongside anti-amebic pharmacotherapy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Raised Intracranial Pressure and Herniation
    treatment_effect: INHIBITS
    description: >-
      ICP-directed neurocritical care attempts to prevent edema-driven
      herniation while anti-amebic drugs clear the trophozoite infection.
  evidence:
  - reference: PMID:25667249
    reference_title: >-
      Successful treatment of an adolescent with Naegleria fowleri primary
      amebic meningoencephalitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient's survival most likely resulted from a variety of factors:
      early identification and treatment, use of a combination of antimicrobial
      agents (including miltefosine), and management of elevated intracranial
      pressure based on the principles of traumatic brain injury.
    explanation: >-
      Supports aggressive elevated-intracranial-pressure management as part of
      a confirmed PAM survivor's regimen.
  - reference: PMID:27525348
    reference_title: >-
      Naegleria fowleri: Diagnosis, Pathophysiology of Brain Inflammation, and
      Antimicrobial Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Successful treatment of PAM started with a rapid diagnosis, extensive
      antimicrobial therapy including an investigational medication miltefosine,
      supportive care, an intraventricular shunt, and hypothermia.
    explanation: >-
      Identifies CSF diversion and hypothermia in the multimodal management of a
      North American survivor.

animal_models:
- name: Intranasal mouse olfactory-invasion model
  species: Mus musculus
  genotype: Wild type
  publication: PMID:10701563
  description: >-
    Intranasal N. fowleri inoculation in mice recapitulates the early olfactory
    route into the brain, with amebae and focal inflammation appearing in the
    nasal submucosal nerve plexus, olfactory nerves, and olfactory bulb within
    24 hours.
  associated_phenotypes:
  - Olfactory-nerve amebae
  - Olfactory-bulb inflammation
  modeled_mechanisms:
  - target: Nasal-Olfactory Amebic Neuroinvasion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Intranasal challenge directly reproduces the route from nasal mucosa,
      across cribriform olfactory nerves, and into the olfactory bulb.
    evidence:
    - reference: PMID:10701563
      reference_title: >-
        A light microscopy study of the migration of Naegleria fowleri from the
        nasal submucosa to the central nervous system during the early stage of
        primary amebic meningoencephalitis in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Focal inflammation and amebas were observed in the submucosal nerve
        plexus, olfactory nerves penetrating the cribriform plate, and the
        olfactory bulb of the brain as early as 24 hr postinoculation.
      explanation: >-
        Localizes the model's amebae along the same olfactory-cribriform route
        that defines human PAM entry into the CNS.
- name: BALB/c active-immunization intranasal-challenge model
  species: Mus musculus
  genotype: Wild type
  background: BALB/c
  publication: PMID:646016
  description: >-
    BALB/c mice immunized with live N. fowleri by intraperitoneal injection were
    challenged intranasally and tested for protection against experimental
    amebic meningoencephalitis.
  associated_phenotypes:
  - Intranasal N. fowleri challenge
  - Survival after immunization
  modeled_mechanisms:
  - target: Nasal-Olfactory Amebic Neuroinvasion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The challenge enters through the nasal route used in human PAM, while the
      prior intraperitoneal immunization is an experimental protective
      perturbation rather than natural human immunity.
    evidence:
    - reference: PMID:646016
      reference_title: >-
        Protective immunity to Naegleria fowleri in experimental amebic
        meningoencephalitis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Intranasal inoculation of N. fowleri in mice produces an infection
        similar to human disease.
      explanation: >-
        Supports intranasal mouse inoculation as an experimental PAM model.

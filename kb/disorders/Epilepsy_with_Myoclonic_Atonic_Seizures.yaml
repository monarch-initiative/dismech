        electrographic discharge this edge points at.
- name: Generalized Spike-Wave Discharges
  description: >-
    The hypersynchronous activity manifests on EEG as generalized, bilaterally
    synchronous spike-and-wave (and polyspike-wave) discharges on a
    characteristically normal or theta-rich background. This node captures the
    single concept of the generalized epileptiform discharge.
  role: mediator
  cell_types:

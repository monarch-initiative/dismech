name: Epilepsy with Myoclonic-Atonic Seizures
creation_date: "2026-07-18T00:00:00Z"
category: Complex
description: >-
  Epilepsy with myoclonic-atonic seizures (EMAtS; Doose syndrome, formerly
  myoclonic-astatic epilepsy) is a genetic generalized epilepsy of early
  childhood, typically beginning between ages 1 and 5 in a previously
  normally developing child. Its hallmark is the myoclonic-atonic seizure - a
  brief myoclonic jerk immediately followed by a loss of tone causing a drop -
  alongside myoclonic, atonic, absence, and generalized tonic-clonic seizures,
  with generalized spike-and-wave on EEG. The disorder is genetically
  heterogeneous; the best-established single gene is SLC6A1, encoding the GABA
  transporter GAT-1, and other contributors overlap the GEFS+ spectrum
  (SCN1A, SCN1B, GABRG2). Outcome is variable - many children remit with normal
  cognition, while others have drug-resistant seizures and intellectual
  disability. The ketogenic diet is notably effective, whereas drugs that block
  sodium channels can aggravate seizures.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- Doose syndrome
- EMAtS
- EMAS
- Myoclonic-astatic epilepsy
- MAE

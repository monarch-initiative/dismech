- name: SLC2A1 (GLUT1)
  gene_term:
    preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A clinically critical must-exclude subset (~4-5%) of children with an
    MAE phenotype have GLUT1 deficiency due to SLC2A1 variants. This is a
    metabolic (cerebral glucose-transport) rather than a channel/GABA
    mechanism, and it is why the ketogenic diet - supplying ketone bodies as an
    alternate brain fuel - is especially effective in this group.
  evidence:
  - reference: PMID:21555602
    reference_title: "Glucose transporter 1 deficiency as a treatable cause of myoclonic astatic epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

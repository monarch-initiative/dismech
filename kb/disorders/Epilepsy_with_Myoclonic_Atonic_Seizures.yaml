discussions:
- discussion_id: doose-gat1-lof-paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired GABA Transporter (GAT-1) Function"
  - "pathophysiology#Disrupted GABAergic Inhibitory Balance"
  prompt: >-
    GAT-1 clears GABA from the synapse, so loss of function would naively be
    expected to raise synaptic GABA and increase inhibition - yet SLC6A1
    loss-of-function causes epilepsy. By what mechanism does reduced GABA
    re-uptake produce seizures: chronic receptor desensitization, a shift in the
    balance of phasic versus tonic inhibition, impaired reverse (tonic-supplying)
    transport, or a developmental effect on circuit maturation?
  rationale: >-
    Resolving this paradox is central to rational therapy for SLC6A1 epilepsy,
    including whether GABAergic drugs help or harm and whether GAT-1-directed
    precision approaches are viable. The loss-of-function-yet-epileptogenic
    relationship is documented but its circuit-level explanation is unsettled.
  proposed_experiments:
  - experiment_id: doose-gat1-inhibition-balance
    name: Phasic/tonic inhibition study of GAT-1 loss of function
    description: >-
      Use human iPSC-derived neurons and Gat1-deficient models carrying EMAtS
      SLC6A1 variants to dissect how reduced GABA re-uptake alters phasic versus
      tonic inhibition and network excitability, and to test GABAergic and
      GAT-1-directed interventions.
    readouts:
    - name: Phasic versus tonic inhibition and network excitability
      target: "pathophysiology#Disrupted GABAergic Inhibitory Balance"
    would_support:
    - "pathophysiology#Impaired GABA Transporter (GAT-1) Function"
- discussion_id: doose-heterogeneity-prognosis
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Genetic Susceptibility to Doose Syndrome"
  - "pathophysiology#Myoclonic-Atonic and Generalized Seizures"
  prompt: >-
    Outcome in EMAtS ranges from complete remission with normal cognition to
    drug-resistant seizures with intellectual disability. Can genetic subtype
    (SLC6A1 versus GEFS+-spectrum versus unsolved) or early clinical/EEG features
    predict which children will remit and which will follow the severe
    trajectory?
  rationale: >-
    Because early prognosis drives treatment intensity and counseling, reliable
    predictors would be valuable, but the genotype- and phenotype-to-outcome
    relationship in this heterogeneous syndrome is not established.
  evidence:
  - reference: PMID:41523187
    reference_title: "Epilepsy with myoclonic-atonic seizures: genetic aetiologies, outcomes and prognostic indicators."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients (61.7%) achieved seizure freedom after 5.1 years on average"
    explanation: >-
      A genetically characterized outcomes cohort documents variable long-term
      outcomes (about 62% seizure-free), motivating the search for prognostic
      predictors.
  proposed_experiments:
  - experiment_id: doose-outcome-predictors
    name: Prospective outcome-predictor cohort
    description: >-
      Follow a genetically characterized EMAtS cohort from onset with serial EEG
      and neurodevelopmental assessment to identify genetic and early-clinical
      predictors of remission versus drug-resistant, ID-associated outcome.
    readouts:
    - name: Outcome versus genetic subtype and early features
      target: "pathophysiology#Myoclonic-Atonic and Generalized Seizures"
    would_support:
    - "pathophysiology#Genetic Susceptibility to Doose Syndrome"
- discussion_id: doose-ketogenic-diet-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Myoclonic-Atonic and Generalized Seizures"
  prompt: >-
    The ketogenic diet is notably effective in EMAtS, often more so than in many
    other epilepsies. Why is this syndrome particularly ketogenic-responsive, and
    does early dietary treatment improve long-term cognitive outcome rather than
    only seizure control?
  rationale: >-
    The unusually good ketogenic-diet response is clinically important but
    mechanistically unexplained; understanding it could refine when to start the
    diet and whether it is disease-modifying for cognition.
  proposed_experiments:
  - experiment_id: doose-ketogenic-mechanism-outcome
    name: Ketogenic diet mechanism and cognitive-outcome study
    description: >-
      Combine mechanistic work on ketone effects on GABAergic/thalamocortical
      excitability in EMAtS models with a prospective clinical study testing
      whether early ketogenic-diet initiation improves cognitive outcome beyond
      seizure control.
    readouts:
    - name: Seizure and cognitive outcome with early ketogenic diet
      target: "pathophysiology#Myoclonic-Atonic and Generalized Seizures"
    would_support:
    - "pathophysiology#Myoclonic-Atonic and Generalized Seizures"

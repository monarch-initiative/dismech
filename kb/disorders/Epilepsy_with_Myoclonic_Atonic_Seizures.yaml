    snippet: "GAT-1, encoded by SLC6A1, is one of the major gamma-aminobutyric acid (GABA) transporters in the brain and is responsible for re-uptake of GABA from the synapse"
    explanation: >-
      Identifies GAT-1 (SLC6A1) as a major synaptic GABA transporter whose

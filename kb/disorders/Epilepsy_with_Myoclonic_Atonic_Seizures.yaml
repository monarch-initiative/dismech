    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Inclusion criteria were seizure onset between 6 months and 8 years, generalized 2-6 Hz spike-wave discharges and video-EEG documented myoclonic-atonic, myoclonic seizures or both"
    explanation: >-
      Generalized 2-6 Hz spike-wave discharge is used as a defining EEG

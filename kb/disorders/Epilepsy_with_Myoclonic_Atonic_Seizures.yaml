classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:35503717
      reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(3) developmental and/or epileptic encephalopathies, comprising five syndromes: epilepsy with myoclonic-atonic seizures, Lennox-Gastaut syndrome, developmental and/or epileptic encephalopathy with spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy syndrome, and febrile infection-related epilepsy syndrome"
      explanation: >-
        The ILAE Task Force on Nosology and Definitions classifies epilepsy with
        myoclonic-atonic seizures as a childhood-onset developmental and/or
        epileptic encephalopathy, an epilepsy nosology whose clinical home is
        the neurologic Part.
    notes: >-
      Only Part assigned. EMAtS is genetically heterogeneous, with SLC6A1 the
      best-established single-gene cause but accounting for only about 4% of
      otherwise unsolved cases, so a GENETICS_ENVIRONMENT_DISEASE Part would
      overstate the genetic axis for the syndrome as a whole.
pathophysiology:
- name: Genetic Susceptibility to Doose Syndrome
  description: >-
    EMAtS has a strong but genetically heterogeneous basis. The best-established
    single gene is SLC6A1 (GABA transporter GAT-1); other contributors overlap
    the GEFS+ spectrum (SCN1A, SCN1B, GABRG2), and the overall architecture is
    usually complex/polygenic. This node captures the single concept of the
    predisposing genetic variation.
  role: trigger
  gene:
    preferred_term: SLC6A1
    term:
      id: hgnc:11042
      label: SLC6A1
  evidence:
  - reference: PMID:41523187
    reference_title: "Epilepsy with myoclonic-atonic seizures: genetic aetiologies, outcomes and prognostic indicators."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We found pathogenic variants in 15/39 (38.5%) patients undergoing next-generation sequencing, including four genes novel for this syndrome"
    explanation: >-
      A genetically characterized EMAtS cohort finds pathogenic variants in
      about two fifths of sequenced patients across several genes, documenting
      both the genetic basis and the heterogeneity this node describes.
  downstream:
  - target: Impaired GABA Transporter (GAT-1) Function
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      SLC6A1 loss-of-function variants impair the GAT-1 GABA transporter.
    evidence:
    - reference: PMID:25865495
      reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "lead to loss of function of GAT-1 and thus reduced GABA re-uptake from the"
      explanation: >-
        Functional testing of the patient SLC6A1 variants shows they abolish
        GAT-1 transport, which is the step from variant to transporter defect
        this edge asserts.
- name: Impaired GABA Transporter (GAT-1) Function
  description: >-
    Loss-of-function SLC6A1 variants impair GAT-1, the presynaptic/astrocytic
    GABA transporter that clears GABA from the synapse and shapes inhibitory
    signaling. This node captures the single concept of the transporter defect
    and conforms to the shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA import (GAT-1 transport)
    term:
      id: GO:0051939
      label: gamma-aminobutyric acid import
    modifier: DECREASED
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GAT-1, encoded by SLC6A1, is one of the major gamma-aminobutyric acid (GABA) transporters in the brain and is responsible for re-uptake of GABA from the synapse"
    explanation: >-
      Identifies GAT-1 (SLC6A1) as a major synaptic GABA transporter whose
      dysfunction underlies the inhibitory defect.
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "lead to loss of function of GAT-1 and thus reduced GABA re-uptake from the"
    explanation: >-
      SLC6A1 variants cause loss of GAT-1 function and reduced GABA re-uptake.
  downstream:
  - target: Disrupted GABAergic Inhibitory Balance
    causal_link_type: DIRECT
    description: >-
      Impaired GABA transport dysregulates phasic and tonic inhibitory
      signaling.
    evidence:
    - reference: PMID:19966779
      reference_title: "Enhanced tonic GABAA inhibition in typical absence epilepsy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Increased tonic inhibition is due to compromised GABA uptake by the GABA transporter GAT-1 in the genetic models tested"
      explanation: >-
        Across genetic absence-epilepsy models, compromised GAT-1 uptake is
        shown to be the cause of a shifted tonic inhibitory tone, which is the
        transporter-to-inhibitory-imbalance step this edge asserts.
- name: Disrupted GABAergic Inhibitory Balance
  description: >-
    Impaired GABA clearance and transporter cycling dysregulate the balance of
    phasic and tonic GABAergic inhibition, destabilizing cortical and
    thalamocortical circuits. This node captures the single concept of the
    inhibitory imbalance.
  role: mediator
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  evidence:
  - reference: PMID:19966779
    reference_title: "Enhanced tonic GABAA inhibition in typical absence epilepsy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "receptor-dependent 'tonic' inhibition is increased in thalamocortical neurons from diverse genetic and pharmacological models of absence seizures"
    explanation: >-
      The inhibitory imbalance this node describes is measured directly: tonic
      GABAergic inhibition is shifted, not simply reduced, across several
      absence-seizure models. This is also the resolution the entry's
      doose-gat1-lof-paradox discussion asks about.
  downstream:
  - target: Thalamocortical Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Inhibitory imbalance disinhibits thalamocortical networks.
    evidence:
    - reference: PMID:19966779
      reference_title: "Enhanced tonic GABAA inhibition in typical absence epilepsy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Extrasynaptic GABA(A) receptors are a requirement for seizures in two of the best characterized models of absence epilepsy"
      explanation: >-
        The altered extrasynaptic GABAergic signalling is necessary for seizure
        generation in these models, establishing the step from inhibitory
        imbalance to an epileptogenic thalamocortical network.
- name: Thalamocortical Network Hyperexcitability
  description: >-
    Cortical and thalamocortical networks become hyperexcitable and prone to
    generalized hypersynchronous discharge. This node captures the single
    concept of network hyperexcitability and conforms to the shared epilepsy
    final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:

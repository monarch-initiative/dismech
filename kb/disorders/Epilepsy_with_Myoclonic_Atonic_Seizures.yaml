      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "had increased 5-7 Hz spike-wave discharges and absence seizures"
      explanation: >-
        A knock-in mouse carrying a recurrent MAE SLC6A1 variant develops

diagnosis:
- name: Germline next-generation sequencing panel
  description: >-
    EGLN1 is one of the hereditary pheochromocytoma/paraganglioma susceptibility
    genes on targeted next-generation-sequencing panels, where it accounts for a
    small minority of positive cases; it is also on congenital-erythrocytosis
    gene panels reached from the erythroid presentation.
  diagnosis_term:
    preferred_term: germline gene-panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34309460
    reference_title: Cost-minimization analysis of sequential genetic testing versus targeted next-generation sequencing gene panels in patients with pheochromocytoma and paraganglioma.

treatments:
- name: Tumor surveillance
  description: >-
    Because EGLN1 carriers are at risk of pheochromocytoma/paraganglioma, expert
    reports stress ongoing medical monitoring for tumor development; biochemical
    (metanephrine) and imaging surveillance are filed under diagnosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: tumor surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37317877
    reference_title: Characterization of genetic variants in the EGLN1/PHD2 gene identified in a European collection of patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is essential to medically monitor the occurrence of a possible tumor"
    explanation: >-
      Expert recommendation to monitor EGLN1 carriers for tumor development.
- name: Therapeutic phlebotomy and low-dose aspirin
  description: >-
    There is no targeted therapy proven for the erythrocytosis. By analogy with
    polycythemia vera, phlebotomy and low-dose aspirin have been suggested for
    symptomatic hyperviscosity, but the benefit is unproven and the practice is
    debated; in the related Chuvash erythrocytosis, phlebotomy is associated with
    increased rather than decreased thrombotic risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Erythroid Progenitor Expansion
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy removes red cell mass to relieve hyperviscosity symptoms; it does
      not address the underlying HIF dysregulation.
  evidence:
  - reference: PMID:37317877
    reference_title: Characterization of genetic variants in the EGLN1/PHD2 gene identified in a European collection of patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by analogy with polycythemia vera, phlebotomies and the use of low-dose aspirin, have been suggested"
    explanation: >-
      The suggested, debated supportive management for the erythrocytosis.
- name: HIF-2-alpha inhibition (belzutifan)
  description: >-
    HIF-2-alpha is the effector of the pseudohypoxic program, so HIF-2-alpha
    inhibition is a mechanistically rational therapy for the PPGL arm. Belzutifan,
    a first-in-class HIF-2-alpha inhibitor, was FDA-approved in May 2025 for
    patients aged 12 or older with locally advanced, unresectable or metastatic
    pheochromocytoma/paraganglioma, on the LITESPARK-015 phase 2 trial (26%
    objective response). There is no EGLN1-specific efficacy data; its relevance
    here is an extrapolation from the shared HIF-2-alpha pathway.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

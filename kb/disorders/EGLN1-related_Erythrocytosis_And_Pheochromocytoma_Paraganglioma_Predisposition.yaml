    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "with PHD2 mutations there is moderate erythrocytosis and erythropoietin (Epo) levels are generally low to normal"
    explanation: >-
      Characterizes the magnitude of the erythrocytosis and the accompanying EPO
      range across reported cases.
- name: Increased hematocrit
  category: Hematologic
  phenotype_term:
    preferred_term: Increased hematocrit
    term:
      id: HP:0001899
      label: Increased hematocrit
  diagnostic: true
  evidence:
  - reference: PMID:37317877
    reference_title: Characterization of genetic variants in the EGLN1/PHD2 gene identified in a European collection of patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PHD2 mutations develop secondary hereditary erythrocytosis with high to normal EPO serum levels, a normal concentration being inappropriate in view of the high hematocrit"
    explanation: >-
      Explicitly ties the PHD2-mutation phenotype to a high hematocrit.
- name: Elevated circulating erythropoietin concentration
  category: Hematologic
  description: >-
    Erythropoietin is usually inappropriately normal for the hemoglobin and only
    occasionally frankly elevated; across one review series of reported carriers
    most had normal EPO, a minority elevated, and a few low. A normal EPO is the
    common finding and does not exclude the diagnosis. Frank elevation, bound by
    HP:0033644 here, is the minority presentation.
  phenotype_term:
    preferred_term: Elevated circulating erythropoietin concentration
    term:
      id: HP:0033644
      label: Elevated circulating erythropoietin concentration
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:27034858
    reference_title: "Erythrocytosis due to PHD2 Mutations: A Review of Clinical Presentation, Diagnosis, and Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "twenty-one patients had normal EPO levels, four patients had unexplained elevated levels, two had a low level"
    explanation: >-
      The actual EPO distribution across reported PHD2-mutation carriers: normal
      in most, elevated in a minority, low in a few — so elevated EPO is the
      occasional, not the usual, finding.
- name: Thromboembolism
  category: Vascular
  description: >-
    Thrombotic complications are documented but uncommon among EGLN1 carriers;
    reported events include cerebral venous (sagittal sinus) and portal vein
    thrombosis.
  phenotype_term:
    preferred_term: Thromboembolism
    term:
      id: HP:0001907
      label: Thromboembolism
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:27034858
    reference_title: "Erythrocytosis due to PHD2 Mutations: A Review of Clinical Presentation, Diagnosis, and Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "one mutation was associated with sagittal sinus thrombosis"
    explanation: >-
      Reports a thrombotic complication in a PHD2-mutation carrier.
- name: Pheochromocytoma
  category: Neoplastic
  description: >-
    Adrenal-medullary pseudohypoxic (cluster 1) tumor. A rare manifestation of
    the syndrome; among carriers ascertained through erythrocytosis, concurrent
    pheochromocytoma has been reported.
  phenotype_term:
    preferred_term: Pheochromocytoma
    term:
      id: HP:0002666
      label: Pheochromocytoma
  evidence:
  - reference: PMID:27034858
    reference_title: "Erythrocytosis due to PHD2 Mutations: A Review of Clinical Presentation, Diagnosis, and Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two patients with PHD2 substitution mutations were found to have paraganglioma and one of these patients had a concurrent pheochromocytoma"
    explanation: >-
      Documents pheochromocytoma in the spectrum of EGLN1/PHD2 carriers.
- name: Paraganglioma
  category: Neoplastic
  description: >-
    Extra-adrenal pseudohypoxic paraganglial tumor. The paraganglioma in the
    index tumor case was recurrent and showed somatic loss of the wild-type
    PHD2 allele.
  phenotype_term:
    preferred_term: Paraganglioma
    term:
      id: HP:0002668
      label: Paraganglioma
  evidence:
  - reference: PMID:19092153
    reference_title: PHD2 mutation and congenital erythrocytosis with paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with erythrocytosis and recurrent paraganglioma who carries a newly discovered PHD2 mutation"
    explanation: >-
      The sentinel case establishing paraganglioma in the EGLN1/PHD2 phenotype.
genetic:
- name: EGLN1 germline loss-of-function
  gene_term:
    preferred_term: EGLN1
    term:
      id: hgnc:1232
      label: EGLN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous germline EGLN1 (PHD2) variants, both missense and truncating
    (nonsense, frameshift); the mechanism of pathogenicity is loss of function.
    ClinGen included 23 missense and nonsense variants reported in 31 probands
    across 7 publications in its curation. Erythrocytosis follows from
    haploinsufficiency (a single allele is sufficient); the rare
    pheochromocytoma/paraganglioma follows a two-hit tumor-suppressor mechanism,
    with somatic loss of heterozygosity of the wild-type allele demonstrated in
    tumor tissue. Tumor development is a very rare event among carriers and the
    PPGL spectrum shows variable expressivity, so additional genetic events are
    likely contributory.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_647ffb08-3740-43a0-8601-258324e995ab-2025-09-09T160000.000Z
    evidence:
    - reference: CGGV:assertion_647ffb08-3740-43a0-8601-258324e995ab-2025-09-09T160000.000Z
      reference_title: "EGLN1 / EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EGLN1 | HGNC:1232 | EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition | MONDO:1060184 | AD | Definitive"
      explanation: >-
        ClinGen gene-disease validity row for this exact MONDO disease, classified
        Definitive under SOP11.
  evidence:
  - reference: CGGV:assertion_647ffb08-3740-43a0-8601-258324e995ab-2025-09-09T160000.000Z
    reference_title: "EGLN1 / EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "23 variants (missense and nonsense) that have been reported in 31 probands in 7 publications"
    explanation: >-
      The genetic evidence base ClinGen scored for this gene-disease curation.
  - reference: CGGV:assertion_647ffb08-3740-43a0-8601-258324e995ab-2025-09-09T160000.000Z
    reference_title: "EGLN1 / EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the following disease entities have been lumped into one disease entity: familial erythrocytosis 3 (OMIM:609820) and pheochromocytoma/paraganglioma (OMIM:171300)"
    explanation: >-
      Records ClinGen's lump decision that the single EGLN1 gene-disease entity
      spans both the erythrocytosis and the PPGL predisposition curated here.
  - reference: PMID:36013579
    reference_title: "Novel Germline PHD2 Variant in a Metastatic Pheochromocytoma and Chronic Myeloid Leukemia, but in the Absence of Polycythemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a novel germline PHD2 (EGLN1) gene variant, c.153G>A, p.W51*, in a patient affected by metastatic Pheo and chronic myeloid leukemia (CML) in the absence of polycythemia"
    explanation: >-
      Documents variable expressivity: a truncating germline EGLN1 variant
      presenting with metastatic pheochromocytoma and no erythrocytosis.
inheritance:

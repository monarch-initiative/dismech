mappings:
  mondo_mappings:
  - term:
      id: MONDO:0012353
      label: erythrocytosis, familial, 3
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO (OMIM:609820)
    mapping_justification: >-
      ECYT3 (OMIM:609820) is the erythrocytosis-only arm of this gene-disease
      association. ClinGen's Childhood, Adolescent, and Young Adult Cancer
      Predisposition GCEP lumped familial erythrocytosis 3 (OMIM:609820) and
      pheochromocytoma/paraganglioma (OMIM:171300) into the single MONDO:1060184
      entity this entry curates (CGGV assertion
      647ffb08-3740-43a0-8601-258324e995ab), so ECYT3 is a narrower
      (erythrocytosis-only) match rather than an equivalent concept.
description: >-
  EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition
  is an autosomal dominant disorder of oxygen sensing caused by heterozygous
  germline loss-of-function variants in EGLN1, which encodes prolyl hydroxylase
  domain protein 2 (PHD2), the principal HIF prolyl hydroxylase. In normoxia PHD2
  hydroxylates the alpha subunits of hypoxia-inducible factor, marking them for
  VHL-dependent proteasomal destruction; when PHD2 activity falls, HIF-alpha
  (predominantly HIF-2-alpha) accumulates despite adequate oxygen — pseudohypoxia.
  The systemic consequence is inappropriate erythropoietin output with
  erythrocytosis; the erythropoietin level is generally inappropriately normal
  for the hemoglobin, occasionally elevated, and rarely low, the arm that
  dominates the clinical picture and is driven by haploinsufficiency alone. The
  neoplastic consequence is a predisposition to pseudohypoxic (cluster 1)
  pheochromocytoma and paraganglioma; this is a two-hit tumor-suppressor
  mechanism in which somatic loss of the wild-type EGLN1 allele (loss of
  heterozygosity has been demonstrated in tumor tissue) completes biallelic
  inactivation in a chromaffin progenitor. ClinGen (SOP11, Childhood/Adolescent/
  Young Adult Cancer Predisposition GCEP) classifies the gene-disease
  relationship as Definitive and lumped familial erythrocytosis 3 (OMIM:609820)
  and the PPGL predisposition (OMIM:171300) into this single entity. Two points of
  granularity matter for a reader: tumor development is a very rare event among
  EGLN1 carriers and shows variable expressivity, so most carriers present with
  erythrocytosis only; and the PPGL predisposition shares its final common
  pathway (pseudohypoxic HIF-2-alpha stabilization) with VHL-, EPAS1-, and
  SDHx-driven PPGL while reaching it from the opposite direction — a direct
  genetic lesion of the hydroxylase rather than ligase loss or oncometabolite
  inhibition. This entry is the germline predisposition syndrome and is kept
  separate from the somatic pheochromocytoma/paraganglioma it predisposes to
  (design decisions section 3a).
pathophysiology:
- name: Germline EGLN1/PHD2 Loss-of-Function
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous germline loss-of-function variant in EGLN1 reduces the
    catalytic activity of PHD2, the principal HIF prolyl hydroxylase, in every
    cell. Reported alleles are missense and truncating (nonsense, frameshift) and
    the overall mechanism of pathogenicity is loss of function. For the erythroid
    phenotype this single allele is sufficient: haploinsufficiency and partial
    deregulation of PHD2 is enough to cause erythrocytosis, so no second hit is
    required. For the tumor phenotype the constitutional allele is the first hit
    of a two-hit tumor-suppressor mechanism.
  genes:
  - preferred_term: EGLN1
    term:
      id: hgnc:1232
      label: EGLN1
  molecular_functions:
  - preferred_term: HIF prolyl hydroxylase (PHD2) activity
    term:
      id: GO:0160082
      label: hypoxia-inducible factor-proline dioxygenase activity
    modifier: DECREASED
  downstream:
  - target: Pseudohypoxic HIF-2-alpha Stabilization
    description: >-
      Reduced PHD2 activity slows HIF-alpha hydroxylation, so HIF-alpha escapes
      VHL-dependent degradation and accumulates despite normal oxygen tension.
    causal_link_type: DIRECT
  - target: Somatic Loss of the Wild-Type EGLN1 Allele in Chromaffin Tissue
    description: >-
      The constitutional loss-of-function allele is present in every chromaffin
      progenitor, so a single somatic event inactivating the remaining
      wild-type allele is sufficient to initiate a pseudohypoxic tumor.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16407130
    reference_title: A family with erythrocytosis establishes a role for prolyl hydroxylase domain protein 2 in oxygen homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that this mutation in PHD2 results in a marked decrease in enzyme activity and is associated with familial erythrocytosis"
    explanation: >-
      The first reported human PHD2/EGLN1 variant, establishing that the
      erythrocytosis arises from decreased PHD2 enzyme activity.
  - reference: CGGV:assertion_647ffb08-3740-43a0-8601-258324e995ab-2025-09-09T160000.000Z
    reference_title: "EGLN1 / EGLN1-related erythrocytosis and pheochromocytoma/paraganglioma predisposition (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be loss of function"
    explanation: >-
      ClinGen's conclusion on the direction of effect for the EGLN1 variants in
      this gene-disease curation.
- name: Pseudohypoxic HIF-2-alpha Stabilization
  biological_scale: MOLECULAR
  description: >-
    HIF-alpha subunits accumulate and dimerize with HIF-1-beta at normal oxygen
    tension. HIF-2-alpha is the dominant effector isoform: in the knock-in mouse
    the PHD2-associated erythrocytosis is reversed by Hif2a heterozygosity but not
    Hif1a heterozygosity, and the mouse adrenal-medulla phenotype is likewise
    HIF-2-alpha- rather than HIF-1-alpha-dependent. The stabilized dimer drives
    the hypoxia transcriptional program while oxygen is adequate.
  biological_processes:
  - preferred_term: HIF-mediated hypoxia response in normoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Inappropriate Erythropoietin Drive
    description: >-
      Stabilized HIF-2-alpha transcribes the EPO gene, raising erythropoietin
      output for the prevailing hemoglobin.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19092153
    reference_title: PHD2 mutation and congenital erythrocytosis with paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation affects PHD2 function and stabilizes HIF-alpha proteins"
    explanation: >-
      Demonstrates in a patient that the PHD2 variant stabilizes HIF-alpha, the
      defining molecular step of this node.
  - reference: PMID:24121508
    reference_title: A knock-in mouse model of human PHD2 gene-associated erythrocytosis establishes a haploinsufficiency mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Phd2(P294R/+)-associated erythrocytosis is reversed in a Hif2a(+/-), but not a Hif1a(+/-) background"
    explanation: >-
      Genetic epistasis in the knock-in mouse establishing HIF-2-alpha as the
      dominant effector isoform for the erythroid arm.
- name: Inappropriate Erythropoietin Drive
  biological_scale: TISSUE
  description: >-
    HIF-2-alpha drives transcription of the EPO gene so that erythropoietin
    output is inappropriate for the prevailing hemoglobin. The level is generally
    inappropriately normal, occasionally frankly elevated, and rarely low; a
    normal EPO is the usual finding and does not exclude the diagnosis.
  cell_types:
  - preferred_term: EPO-producing kidney interstitial fibroblast
    term:
      id: CL:1000692
      label: kidney interstitial fibroblast
  biological_processes:
  - preferred_term: cellular response to hypoxia driving EPO transcription
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  downstream:
  - target: Erythroid Progenitor Expansion
    description: >-
      Raised erythropoietin signalling expands the erythroid compartment.
    causal_link_type: DIRECT
  - target: Elevated circulating erythropoietin concentration
    description: Erythropoietin is inappropriately normal to high for the hemoglobin.
  evidence:
  - reference: PMID:27774468
    reference_title: The role of PHD2 mutations in the pathogenesis of erythrocytosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "A knockin mouse model expressing the first reported PHD2-P317R mutation recapitulates the phenotype observed in humans (erythrocytosis with inappropriately normal serum EPO levels)"
    explanation: >-
      States the inappropriately-normal EPO signature of the erythroid phenotype,
      confirmed in the knock-in mouse.
- name: Erythroid Progenitor Expansion
  biological_scale: TISSUE
  description: >-
    Erythropoietin-driven expansion of the erythroid compartment raises the red
    cell mass. Unlike polycythemia vera, white cell and platelet lineages are not
    expanded.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: INCREASED
  downstream:
  - target: Polycythemia
    description: Erythroid expansion raises the red cell mass.
  - target: Increased circulating hemoglobin concentration
    description: Erythroid expansion raises hemoglobin.
  - target: Increased hematocrit
    description: Erythroid expansion raises hematocrit, the usual presenting abnormality.
  - target: Thromboembolism
    description: >-
      Erythrocytosis and hyperviscosity contribute to a prothrombotic tendency;
      thrombotic events are a documented, though uncommon, complication.
  evidence:
  - reference: PMID:24121508
    reference_title: A knock-in mouse model of human PHD2 gene-associated erythrocytosis establishes a haploinsufficiency mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies formally prove that a missense mutation in PHD2 is the cause of the erythrocytosis, show that this occurs through haploinsufficiency"
    explanation: >-
      The knock-in mouse establishes that PHD2 loss expands the red cell mass
      through haploinsufficiency.
- name: Somatic Loss of the Wild-Type EGLN1 Allele in Chromaffin Tissue
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    A somatic event inactivates the remaining wild-type EGLN1 allele in a
    chromaffin progenitor, completing biallelic PHD2 loss. Loss of heterozygosity
    of PHD2 has been demonstrated directly in paraganglioma tissue from a carrier,
    which is the observation that identified EGLN1/PHD2 as a tumor-suppressor
    gene in this setting.
  genes:
  - preferred_term: EGLN1
    term:
      id: hgnc:1232
      label: EGLN1
  molecular_functions:
  - preferred_term: HIF prolyl hydroxylase (PHD2) activity
    term:
      id: GO:0160082
      label: hypoxia-inducible factor-proline dioxygenase activity
    modifier: DECREASED
  downstream:
  - target: Pseudohypoxic Chromaffin Tumorigenesis
    description: >-
      Biallelic PHD2 loss stabilizes HIF-2-alpha in the adrenal medulla and
      sympathetic/parasympathetic paraganglia, driving a pseudohypoxic tumor.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19092153
    reference_title: PHD2 mutation and congenital erythrocytosis with paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate loss of heterozygosity of PHD2 in the tumor, suggesting that PHD2 could be a tumor-suppressor gene"
    explanation: >-
      Direct demonstration of somatic second-hit loss of heterozygosity in the
      paraganglioma, establishing the two-hit mechanism.
- name: Pseudohypoxic Chromaffin Tumorigenesis
  biological_scale: TISSUE
  description: >-
    Constitutive HIF-2-alpha activity in chromaffin tissue produces a cluster 1
    (pseudohypoxic) pheochromocytoma or paraganglioma. In the mouse, inactivating
    Phd2 in the adrenal medulla reproduces the gene-expression signature of
    pseudohypoxic PPGL, and the effect is HIF-2-alpha- rather than
    HIF-1-alpha-dependent. The tumor arm shows marked variable expressivity and
    low penetrance, and some tumors arise with little or no erythrocytosis.
  cell_types:
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  downstream:
  - target: Pheochromocytoma
    description: Adrenal-medullary pseudohypoxic tumor.
  - target: Paraganglioma
    description: Extra-adrenal pseudohypoxic paraganglial tumor.
  evidence:
  - reference: PMID:34658364
    reference_title: Developmental role of PHD2 in the pathogenesis of pseudohypoxic pheochromocytoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Investigation of these animals revealed a gene expression pattern closely mimicking that of pseudohypoxic PPGL"
    explanation: >-
      Adrenal-medulla Phd2 inactivation in mice reproduces the pseudohypoxic PPGL
      expression signature.
  - reference: PMID:34658364
    reference_title: Developmental role of PHD2 in the pathogenesis of pseudohypoxic pheochromocytoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These changes were ablated by combined inactivation of Phd2 with Hif-2α, but not Hif-1α"
    explanation: >-
      Establishes HIF-2-alpha as the effector isoform for the chromaffin tumor
      arm.
phenotypes:
- name: Polycythemia
  category: Hematologic
  description: >-
    Erythrocytosis is the dominant and near-constant feature. It is a secondary,
    EPO-driven erythrocytosis (congenital secondary erythrocytosis), not a
    pan-myeloproliferative state.
  phenotype_term:
    preferred_term: Erythrocytosis
    term:
      id: HP:0001901
      label: Polycythemia
  diagnostic: true
  evidence:
  - reference: PMID:37317877
    reference_title: Characterization of genetic variants in the EGLN1/PHD2 gene identified in a European collection of patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PHD2 mutations develop secondary hereditary erythrocytosis with high to normal EPO serum levels, a normal concentration being inappropriate in view of the high hematocrit"
    explanation: >-
      States that PHD2-mutation carriers develop secondary hereditary
      erythrocytosis, the defining phenotype. Frequency omitted: no source gives
      a percentage, and this cohort was ascertained through erythrocytosis.
- name: Increased circulating hemoglobin concentration
  category: Hematologic
  phenotype_term:
    preferred_term: Increased circulating hemoglobin concentration
    term:
      id: HP:0001900
      label: Increased circulating hemoglobin concentration
  diagnostic: true
  evidence:

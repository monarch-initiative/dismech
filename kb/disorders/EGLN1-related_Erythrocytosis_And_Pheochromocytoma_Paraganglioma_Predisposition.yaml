animal_models:
- name: Phd2 P294R knock-in mouse
  species: Mouse
  genotype: Phd2(P294R/+) knock-in (models human PHD2 P317R)
  publication: PMID:24121508
  modeled_mechanisms:
  - target: Erythroid Progenitor Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Knock-in of the P294R allele modeling the first human PHD2 variant produces
      erythrocytosis equivalent to Phd2 heterozygous null, reversed by Hif2a but
      not Hif1a heterozygosity, proving a haploinsufficiency mechanism acting
      through HIF-2-alpha.
    evidence:
    - reference: PMID:24121508
      reference_title: A knock-in mouse model of human PHD2 gene-associated erythrocytosis establishes a haploinsufficiency mechanism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These studies formally prove that a missense mutation in PHD2 is the cause of the erythrocytosis, show that this occurs through haploinsufficiency"
      explanation: >-
        Establishes this model as a faithful recapitulation of the human erythroid
        phenotype and its mechanism.
- name: Adrenal-medulla Phd2 conditional knockout mouse
  species: Mouse
  genotype: TH-Cre conditional Phd2 inactivation in adrenal medulla
  publication: PMID:34658364
  modeled_mechanisms:
  - target: Pseudohypoxic Chromaffin Tumorigenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Adrenal-medulla Phd2 inactivation reproduces the gene-expression signature
      of pseudohypoxic PPGL in a HIF-2-alpha-dependent manner, but the changes
      arise only when Phd2 is inactivated during adrenal development, not in adult
      life, and the model produces developmental abnormalities rather than frank
      tumors.
    limitations: >-
      The phenotype is a developmental gene-expression signature rather than a
      formed tumor, and it could not be reproduced by inactivating Phd2 in adult
      life, so the model captures the pseudohypoxic program but not the full
      tumorigenic process in a mature animal.
    evidence:
    - reference: PMID:34658364
      reference_title: Developmental role of PHD2 in the pathogenesis of pseudohypoxic pheochromocytoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "they could not be reproduced by inactivation of Phd2 in adult life, suggesting that they arise from dysregulation of this pathway during adrenal development"
      explanation: >-
        Documents the developmental-window limitation that bounds the fidelity of
        this model.
discussions:
- discussion_id: egln1_ppgl_penetrance_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pseudohypoxic Chromaffin Tumorigenesis
  prompt: >-
    Why is pheochromocytoma/paraganglioma such a rare event among EGLN1 carriers,
    and what additional factors determine which carriers develop a tumor?
  rationale: >-
    Erythrocytosis is near-universal in EGLN1 carriers, but tumor development is a
    very rare event with marked variable expressivity, and the mouse data suggest
    the pseudohypoxic chromaffin phenotype depends on dysregulation during adrenal
    development rather than on PHD2 loss per se. Whether a somatic second hit is
    necessary and sufficient, or whether additional genetic/developmental events
    are required, is unresolved.
  evidence:
  - reference: PMID:37317877
    reference_title: Characterization of genetic variants in the EGLN1/PHD2 gene identified in a European collection of patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed that tumor development can be considered a very rare event"
    explanation: >-
      Quantifies the rarity of tumor development among EGLN1 carriers, framing the
      penetrance gap.
notes: >-
  Lump/split: curated as a single DISEASE at the MONDO:1060184 level, following
  ClinGen's explicit lumping of familial erythrocytosis 3 (OMIM:609820) and the
  PPGL predisposition (OMIM:171300). The erythrocytosis-only concept ECYT3
  (MONDO:0012353) is covered here as a skos:narrowMatch mapping; its curation
  stub was deleted in the same change since this lumped entry subsumes it.
  Germline vs somatic: the germline allele drives
  erythrocytosis by haploinsufficiency; PPGL requires a somatic second hit (LOH
  demonstrated in tumor, PMID:19092153). No post-zygotic mosaic arm is sourced for
  EGLN1, so HP:0001442 is not bound. Onset/pediatric framing: erythrocytosis is
  congenital and can be detected from childhood, but the reviewed series do not
  report per-age onset distributions for EGLN1 specifically, so no onset ages are
  asserted. No GeneReviews chapter covers EGLN1-related erythrocytosis: a PubMed
  genereviews[book] search for EGLN1 returned nothing. The Primary Familial and
  Congenital Erythrocytosis GeneReviews chapter is the EPOR disease (primary
  erythrocytosis with below-normal erythropoietin), the mechanistic opposite of
  this HIF-pathway secondary erythrocytosis, and the Hereditary
  Paraganglioma-Pheochromocytoma Syndromes chapter is the SDHx syndrome and does
  not cover EGLN1 (both confirmed by reading their cached abstracts); neither is
  this disease's baseline. The falcon deep-research report was used only as a
  lead; all claims were verified against the primary sources and the ClinGen
  (CGGV) record.

name: Antisocial Personality Disorder
creation_date: "2026-09-07T15:00:00Z"
category: Psychiatric
description: >-
  Antisocial personality disorder (ASPD) is an adult personality disorder
  defined by a pervasive pattern of disregard for and violation of the rights
  of others since age 15, comprising repeated unlawful behavior,
  deceitfulness, impulsivity, irritability and aggressiveness, reckless
  disregard for safety, consistent irresponsibility and lack of remorse. The
  DSM-5 criteria uniquely require evidence of conduct disorder with onset
  before age 15, so ASPD is by definition the adult continuation of a
  childhood-onset disruptive behavior trajectory rather than a de novo adult
  condition. Its best-established etiologic finding is a gene-environment
  interaction in which MAOA genotype moderates the effect of childhood
  maltreatment on later antisocial outcomes.
disease_term:
  preferred_term: antisocial personality disorder
  term:
    id: MONDO:0001164
    label: antisocial personality disorder
parents:
- Personality Disorder
- Mental Health Disorder
prevalence:
- population: United States adult population
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4300.0
  rate_denominator: POPULATION
  notes: >-
    National Epidemiologic Survey on Alcohol and Related Conditions-III,
    face-to-face interviews with 36,309 respondents in 2012-2013, assessed
    against DSM-5 criteria. The same survey estimated 20.3% for adulthood
    antisocial behavioral syndrome without conduct disorder before age 15,
    which is a distinct construct and is not curated as this disease.
  evidence:
  - reference: PMID:27035627
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalences of ASPD and AABS were 4.3% and 20.3%, respectively, and were
      highest among male, white, Native American, younger, and unmarried
      respondents, those with high school or less education, lower incomes, and
      Western residence.
    explanation: >-
      Nationally representative DSM-5 survey supplies the ASPD prevalence
      estimate and its sociodemographic correlates.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    ASPD carries significant measured disability and broad psychiatric
    comorbidity across substance use, mood, trauma-related and other
    personality disorders, and most affected individuals in nationally
    representative data are untreated.
  evidence:
  - reference: PMID:27035627
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both were associated with significant disability (P < .001 to .01). Most
      antisocial survey respondents were untreated.
    explanation: >-
      Establishes both the disability burden and the treatment gap in a
      nationally representative sample.
pathophysiology:
- name: Polygenic Genetic Susceptibility
  description: >-
    Genome-wide association analysis of ASPD diagnostic criteria in 3217
    alcohol-dependent participants identified a chromosome 15 variant,
    rs9806493, an eQTL for SLCO3A1, a gene strongly expressed in anterior
    cingulate and frontal cortices. Polygenic risk for ASPD correlates
    positively with smoking, ADHD, depression traits and PTSD, indicating
    substantially shared rather than disorder-specific genetic risk.
  biological_scale: MOLECULAR
  downstream:
  - target: Persistent Antisocial Behavior Pattern
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Common variant risk is associated with the adult diagnostic criterion
      count; the intervening biology is not established.
  evidence:
  - reference: PMID:37756443
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rs9806493 is an eQTL for SLCO3A1 (Solute Carrier Organic Anion
      Transporter Family Member 3A1), a ubiquitously expressed gene with strong
      expression in brain regions that include the anterior cingulate and
      frontal cortices.
    explanation: >-
      Identifies the gene implicated by the genome-wide significant ASPD
      association and its regional brain expression.
  - reference: PMID:37756443
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polygenic risk score analysis identified positive correlations between
      ASPD and smoking, ADHD, depression traits, and posttraumatic stress
      disorder.
    explanation: >-
      Supports the shared, non-specific character of ASPD genetic risk.
  notes: >-
    The discovery sample consisted entirely of alcohol-dependent participants,
    so the finding is not established as generalizable to ASPD in the general
    population.
- name: MAOA-Moderated Sensitivity to Maltreatment
  description: >-
    A functional polymorphism in MAOA, encoding the monoamine-metabolizing
    enzyme monoamine oxidase A, moderates the effect of childhood maltreatment
    on later antisocial outcomes. Maltreated boys with the high-activity
    genotype were less likely to develop antisocial problems, so the genotype
    acts as a moderator of environmental sensitivity rather than as an
    independent cause.
  biological_scale: MOLECULAR
  downstream:
  - target: Childhood-Onset Conduct Disorder
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The genotype acts by conditioning the developmental impact of
      maltreatment, whose behavioral expression in childhood is conduct
      disorder.
    evidence:
    - reference: PMID:12161658
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Maltreated children with a genotype conferring high levels of MAOA
        expression were less likely to develop antisocial problems.
      explanation: >-
        States the genotype-conditioned developmental step from maltreatment to
        childhood antisocial problems, which is this edge.
  evidence:
  - reference: PMID:12161658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A functional polymorphism in the gene encoding the
      neurotransmitter-metabolizing enzyme monoamine oxidase A (MAOA) was found
      to moderate the effect of maltreatment.
    explanation: >-
      Prospective birth cohort establishes MAOA genotype as a moderator of the
      maltreatment effect.
- name: Childhood-Onset Conduct Disorder
  description: >-
    A childhood pattern of aggression, destruction, deceit and serious rule
    violation with onset before age 15. This node is not merely a risk factor
    but a diagnostic requirement: DSM-5 does not permit an ASPD diagnosis
    without it, which is what makes ASPD a developmental rather than an adult
    onset condition.
  biological_scale: ORGANISM
  downstream:
  - target: Persistent Antisocial Behavior Pattern
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27035627
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OBJECTIVE: To present current, nationally representative US findings on
      prevalence, correlates, psychiatric comorbidity, disability, and
      treatment of DSM-5 antisocial personality disorder (ASPD) and adulthood
      antisocial behavioral syndrome without conduct disorder before 15 years
      of age (AABS).
    explanation: >-
      The survey's own construct definitions show that conduct disorder before
      age 15 is the feature separating ASPD from the otherwise similar adult
      syndrome, establishing this node as diagnostically required.
- name: Persistent Antisocial Behavior Pattern
  description: >-
    The adult clinical syndrome: a pervasive and persistent pattern of
    disregard for and violation of the rights of others, expressed as
    aggression, deceit, impulsivity, irresponsibility and absence of remorse.
  biological_scale: ORGANISM
  downstream:
  - target: Aggressive behavior
  - target: Impulsivity
  - target: Abnormal social behavior
  - target: Violent behavior
environmental:
- name: Childhood maltreatment
  description: >-
    Physical and emotional maltreatment in childhood is the best-replicated
    environmental contributor to later antisocial behavior, and its effect is
    conditional on MAOA genotype rather than uniform across exposed children.
  exposure_term:
    preferred_term: childhood maltreatment
  influences_mechanisms:
  - target: Childhood-Onset Conduct Disorder
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Maltreatment raises the probability of childhood antisocial problems,
      with the magnitude of the effect conditioned by MAOA genotype.
    evidence:
    - reference: PMID:12161658
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings may partly explain why not all victims of maltreatment
        grow up to victimize others, and they provide epidemiological evidence
        that genotypes can moderate children's sensitivity to environmental
        insults.
      explanation: >-
        Supports maltreatment as an environmental insult acting on antisocial
        development, with genotype-dependent magnitude.
  evidence:
  - reference: PMID:12161658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied a large sample of male children from birth to adulthood to
      determine why some children who are maltreated grow up to develop
      antisocial behavior, whereas others do not.
    explanation: >-
      Establishes childhood maltreatment as the exposure under study in a
      prospective birth-to-adulthood cohort of antisocial outcomes.
  notes: >-
    ECTO was searched for a childhood-maltreatment or child-abuse exposure
    term and none was found, so exposure_term carries a free-text
    preferred_term with no binding rather than a poor-fitting substitute. The
    cohort was male-only, so the exposure effect is not established in girls by
    this study.
phenotypes:
- name: Aggressive behavior
  category: Behavioral
  description: >-
    Irritability and aggressiveness, including repeated physical fights or
    assaults, is a core DSM-5 criterion.
  phenotype_term:
    preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
  evidence:
  - reference: PMID:12161658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied a large sample of male children from birth to adulthood to
      determine why some children who are maltreated grow up to develop
      antisocial behavior, whereas others do not.
    explanation: >-
      Cohort study of the development of antisocial behavior, the phenotype
      class this entry records.
- name: Impulsivity
  category: Behavioral
  description: >-
    Impulsivity or failure to plan ahead is a DSM-5 criterion and is shared
    with the ADHD phenotypes that ASPD polygenic risk correlates with.
  phenotype_term:
    preferred_term: Impulsivity
    term:
      id: HP:0100710
      label: Impulsivity
  evidence:
  - reference: PMID:37756443
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polygenic risk score analysis identified positive correlations between
      ASPD and smoking, ADHD, depression traits, and posttraumatic stress
      disorder.
    explanation: >-
      The shared polygenic signal with ADHD supports an impulsivity dimension
      in ASPD only through an inference step from genetic correlation to
      phenotype, so it is graded indirect.
- name: Abnormal social behavior
  category: Behavioral
  description: >-
    The defining pervasive disregard for and violation of the rights of others,
    including deceitfulness and absence of remorse.
  phenotype_term:
    preferred_term: Abnormal social behavior
    term:
      id: HP:0012433
      label: Abnormal social behavior
  evidence:
  - reference: PMID:27035627
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One in 4 US adults exhibits syndromal antisocial behavior, with similar
      sociodemographic and psychiatric correlates and disability regardless of
      whether onset occurred before 15 years of age, illustrating the clinical
      and public health significance of both ASPD and AABS.
    explanation: >-
      Characterizes syndromal antisocial behavior as the clinical phenomenon
      this phenotype records.
- name: Violent behavior
  category: Behavioral
  description: >-
    A subset of affected individuals show serious violence; this is not
    required for diagnosis and is not present in all cases.
  phenotype_term:
    preferred_term: Violent behavior
    term:
      id: HP:0008760
      label: Violent behavior
  evidence:
  - reference: PMID:12161658
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings may partly explain why not all victims of maltreatment
      grow up to victimize others, and they provide epidemiological evidence
      that genotypes can moderate children's sensitivity to environmental
      insults.
    explanation: >-
      Framed in terms of victimizing others; supports the violence dimension
      through the study's framing rather than by direct measurement of a
      violence outcome in ASPD, so it is graded indirect.
genetic:
- name: MAOA
  notes: >-
    A functional promoter polymorphism moderating the effect of childhood
    maltreatment on antisocial outcomes. This is a moderator of environmental
    sensitivity, not an independent causal locus, and the original finding is
    from a male-only birth cohort.
  gene_term:
    preferred_term: MAOA
    term:
      id: hgnc:6833
      label: MAOA
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:12161658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A functional polymorphism in the gene encoding the
      neurotransmitter-metabolizing enzyme monoamine oxidase A (MAOA) was found
      to moderate the effect of maltreatment.
    explanation: >-
      Establishes MAOA as a moderating locus for antisocial outcomes after
      maltreatment.
- name: SLCO3A1
  notes: >-
    Implicated by the eQTL for rs9806493, the only genome-wide significant
    signal in a GWAS of ASPD diagnostic criteria. Discovery was in an
    alcohol-dependent sample and has not been replicated in a general
    population sample.
  gene_term:
    preferred_term: SLCO3A1
    term:
      id: hgnc:10952
      label: SLCO3A1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:37756443
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study provides evidence for an association between ASPD risk and
      SLCO3A1 and provides insight into the genetic architecture and
      pleiotropic associations of ASPD.
    explanation: >-
      The authors' own summary of the gene-level association with ASPD risk.
diagnosis:
- name: Clinical assessment against DSM-5 criteria
  presence: >-
    Diagnosis requires a pervasive pattern of disregard for and violation of
    the rights of others since age 15, the individual being at least 18 years
    old, and evidence of conduct disorder with onset before age 15, with the
    behavior not occurring exclusively during schizophrenia or bipolar
    disorder. Epidemiological assessment has used the Alcohol Use Disorder and
    Associated Disabilities Interview Schedule-5.
  evidence:
  - reference: PMID:27035627
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DSM-5 alcohol, nicotine, and specific drug use disorders and selected
      mood, anxiety, trauma-related, eating, and personality disorders were
      assessed using the Alcohol Use Disorder and Associated Disabilities
      Interview Schedule-5.
    explanation: >-
      Identifies the structured instrument used for DSM-5 ASPD ascertainment at
      population scale.
differential_diagnoses:
- name: Conduct disorder
  description: >-
    Conduct disorder is the childhood and adolescent condition that must
    precede ASPD; it is the appropriate diagnosis before age 18 and should not
    be replaced by ASPD in children.
  disease_term:
    preferred_term: conduct disorder
    term:
      id: MONDO:0005352
      label: conduct disorder
- name: Borderline personality disorder
  description: >-
    Borderline personality disorder shares impulsivity and interpersonal
    conflict but is defined by abandonment sensitivity, affective instability,
    self-harm and identity disturbance rather than by instrumental disregard
    for others' rights.
  disease_term:
    preferred_term: borderline personality disorder
    term:
      id: MONDO:0001156
      label: borderline personality disorder
- name: Intermittent explosive disorder
  description: >-
    Aggression in intermittent explosive disorder is impulsive and anger-based
    and occurs without the broader pattern of deceit, rule violation and
    disregard for others' rights that defines ASPD.
  disease_term:
    preferred_term: intermittent explosive disorder
    term:
      id: MONDO:0001521
      label: intermittent explosive disorder
- name: Substance use disorder
  description: >-
    Antisocial acts occurring only in the context of substance use do not
    establish ASPD, though the two are strongly comorbid.
  disease_term:
    preferred_term: substance abuse
    term:
      id: MONDO:0002491
      label: substance abuse
treatments:
- name: Psychological interventions
  description: >-
    A Cochrane review of 19 studies of psychological interventions in adults
    with ASPD found only three interventions with any signal of benefit over
    control, no compelling evidence of change in antisocial behaviour itself,
    and low or very low certainty throughout. This entry records that negative
    or inconclusive state of the evidence rather than an established treatment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychotherapy
    term:
      id: NCIT:C15308
      label: Psychotherapy
  target_mechanisms:
  - target: Persistent Antisocial Behavior Pattern
    description: >-
      Interventions target the adult behavioral syndrome rather than any
      upstream mechanism.
  evidence:
  - reference: PMID:32880104
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is very limited evidence available on psychological interventions
      for adults with AsPD.
    explanation: >-
      Systematic review establishes the sparse state of the intervention
      evidence base.
  - reference: PMID:32880104
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No intervention reported compelling evidence of change in antisocial
      behaviour.
    explanation: >-
      Directly contradicts a claim that psychological intervention changes the
      core antisocial behavior of ASPD, and is recorded as refuting evidence so
      the entry does not overstate efficacy.
- name: Early preventive intervention in high-risk children
  description: >-
    The Fast Track trial randomized 891 early-starting high-risk children to a
    ten-year multicomponent intervention addressing parent behavior management,
    child social-cognitive skills, reading, home visiting, mentoring and
    classroom curricula. It prevented lifetime externalizing diagnoses,
    including conduct disorder, but only among children at highest initial
    risk. Because childhood conduct disorder is a diagnostic prerequisite for
    ASPD, prevention at this stage acts upstream of the adult disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Childhood-Onset Conduct Disorder
    description: >-
      The intervention targets the childhood precursor node, which is the
      diagnostic gateway to adult ASPD.
  evidence:
  - reference: PMID:21291445
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant interaction effects between intervention and initial risk
      level indicated that intervention prevented the lifetime prevalence of
      all diagnoses, but only among those at highest initial risk, suggesting
      that targeted intervention can prevent externalizing disorders to promote
      the raising of healthy children.
    explanation: >-
      The trial's outcomes are childhood externalizing diagnoses, not adult
      ASPD, so this supports prevention of ASPD only through the inference that
      preventing the required childhood precursor prevents the adult disorder;
      graded indirect for that reason.
notes: >-
  Curated from primary literature located through PubMed, with candidate
  citations cross-checked against a claude_code deep-research report whose
  PMIDs were verified individually before use. Two deliberate omissions are
  worth recording. First, no pathophysiology node for prefrontal or amygdala
  structural or functional abnormality is included: the available imaging
  literature is conducted in psychopathy, conduct disorder or violent-offender
  samples, which are overlapping but distinct constructs, and importing those
  findings under an ASPD label would be exactly the entity confusion this
  knowledge base guards against. Second, psychopathy is not curated as a
  subtype. It appears among the MONDO synonyms for this term but is a
  dimensional construct with its own measurement tradition rather than a DSM-5
  ASPD specifier, and treating the two as equivalent is a recognized source of
  error in this literature. The treatment section deliberately records a
  negative result: the Cochrane evidence does not support an efficacious
  psychological treatment for the core antisocial behavior.

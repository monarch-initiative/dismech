diagnosis:
- name: Exome or genome sequencing for biallelic NAXE variants
  description: >-
    Diagnosis is molecular. Nearly all cases were found by exome sequencing,
    several within mitochondrial disease or Leigh syndrome cohorts. A
    promoter repeat expansion needed long-read sequencing, so a negative
    short-read exome does not exclude the diagnosis. Clinically, suspect it
    in a previously well toddler with febrile-illness-triggered subacute
    ataxia, cerebellar edema or myelopathy, with or without bullous skin
    lesions. CSF lactate may be normal and early MRI subtle. The early
    resemblance to autoimmune encephalitis is a recognised source of delay.
  evidence:
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In virtually all cases, diagnosis was made by exome sequencing (ES), including three cases in a cohort of patients suspected to have a general mitochondrial disorder or Leigh syndrome"
    explanation: >-
      Exome sequencing as the diagnostic route. Quoted to stop before the
      bracketed citation marker.
  - reference: PMID:39455596
    reference_title: "Biallelic GGGCC repeat expansion leading to NAXE-related mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a patient with NAXE-related mitochondrial encephalopathy and novel biallelic GGGCC repeat expansion as long as ~200 repeats in the NAXE promoter region using long-read sequencing."
    explanation: >-
      An allele class that needs long-read sequencing.
differential_diagnoses:
- name: NAD(P)HX dehydratase deficiency (PEBEL2)
  description: >-
    The sister disorder, caused by the other enzyme of the same repair system,
    with the same fever-triggered crisis pattern. The two are distinguished by
    gene. Curated separately as NAD_P_HX_Dehydratase_Deficiency.
  disease_term:
    preferred_term: NAD(P)HX dehydratase deficiency
    term:
      id: MONDO:0034121
      label: NAD(P)HX dehydratase deficiency
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, pathogenic variants in both the NAXD and NAXE genes were associated with rapid deterioration and death after an otherwise trivial fever, infection, or illness in young patients."
    explanation: >-
      The two genes give the same clinical pattern.
- name: Autoimmune encephalitis and acquired demyelinating syndromes
  description: >-
    Fever, acute neurological deterioration and inflammatory-looking MRI often
    lead to a first diagnosis of encephalitis or autoimmune inflammation.
    Some patients improve at first on steroids or IVIG, and others do not
    respond. Relapse with new deficits, absent CSF pleocytosis and raised CSF
    lactate should prompt genetic testing.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, because of the combination of high fever and acute neurological deterioration, encephalitis, meningitis, or autoimmune-mediated inflammation was initially suspected in the children."
    explanation: >-
      The founding-series children were first thought to have an
      inflammatory or infectious encephalopathy.
  - reference: PMID:36162141
    reference_title: "Mitochondrial diseases mimicking autoimmune diseases of the CNS and good response to steroids initially."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relapses in conjunction with new and progressive neurological symptoms, led to additional work-up which finally resulted in different genetic diagnosis of MD in all patients (MT-TL1, MT-ND5, APOA1-BP, HPDL, POLG)."
    explanation: >-
      An APOA1BP (NAXE) patient was among those first managed as autoimmune
      CNS disease.
  - reference: PMID:39937421
    reference_title: "Phenotypic diversity in NAXE mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentation of P1 and P3 initially suggested autoimmune neurological disease, but no response to immunotherapy was obtained."
    explanation: >-
      Two NAXE patients first suspected to have autoimmune disease, with no
      response to immunotherapy.
- name: Pellagra and Hartnup disease
  description: >-
    Acquired niacin deficiency and Hartnup disease share disturbed NAD
    metabolism, skin lesions and, in Hartnup, cerebellar ataxia. In NAXE
    deficiency the lesions are bullous and not photodistributed, and
    cerebellar signs dominate.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, skin lesions in our individuals were not typically located (e.g., not primarily affecting sun-exposed areas), appeared bullous/Lyell-like (e.g., not scaly or desquamating), and neurological (especially cerebellar) signs were dominating the clinical picture."
    explanation: >-
      The founding authors' distinction from pellagra.
- name: Leigh syndrome and other mitochondrial encephalopathies
  description: >-
    NAXE deficiency has been diagnosed in Leigh syndrome and mitochondrial
    disease cohorts, and it shares the febrile decompensation and lactate
    elevation.
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome

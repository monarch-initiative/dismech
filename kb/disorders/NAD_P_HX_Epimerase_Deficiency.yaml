inheritance:
- name: Autosomal Recessive
  description: >-
    Autosomal recessive; affected individuals carry homozygous or compound
    heterozygous NAXE variants. Homozygosity has also arisen through maternal
    uniparental disomy of chromosome 1 (PMID:39455596).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed pathogenic biallelic mutations in NAXE in children from four families with (sub-) acute-onset ataxia, cerebellar edema, spinal myelopathy, and skin lesions."
    explanation: >-
      The founding series reports biallelic NAXE variants in four families.
  - reference: PMID:34120322
    reference_title: "A novel homozygous missense variant in the NAXE gene in an Iranian family with progressive encephalopathy with brain edema and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous or compound heterozygous mutations in the NAD(P)HX epimerase (NAXE) gene, cause early-onset progressive encephalopathy with brain edema and/or leukoencephalopathy 1."
    explanation: >-
      States the recessive genotypes, homozygous and compound heterozygous,
      that cause PEBEL1.
pathophysiology:
- name: Biallelic NAXE Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NAXE variants abolish or reduce the epimerase. NAXE protein was
    undetectable in fibroblasts from affected children in two founding
    families and in fibroblasts carrying a splice-site variant. Missense,
    truncating and splice variants are reported, as is a biallelic GGGCC
    repeat expansion in the NAXE promoter that silences transcription.
  genes:
  - preferred_term: NAXE
    term:
      id: hgnc:18453
      label: NAXE
  genetic_context:
    gene:
      preferred_term: NAXE
      term:
        id: hgnc:18453
        label: NAXE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: NAD(P)HX epimerase activity
    term:
      id: GO:0052856
      label: NAD(P)HX epimerase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NAXE levels were undetectable in fibroblasts from affected individuals of two families."
    explanation: >-
      Absent protein in patient cells is the direct demonstration of loss of
      function.
  - reference: PMID:31745726
    reference_title: "Novel NAXE variants as a cause for neurometabolic disorder: implications for treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lastly, patients with the c.665-1G>A splicing variant showed a significant reduction of NAXE expression compared to control fibroblasts and undetectable NAXE protein levels compared to control fibroblasts."
    explanation: >-
      Independent confirmation in a second variant class (splice site):
      reduced transcript and absent protein in patient fibroblasts.
  - reference: PMID:39455596
    reference_title: "Biallelic GGGCC repeat expansion leading to NAXE-related mitochondrial encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition to a marked reduction in the RNA and protein, we found a marked reduction in nascent RNA in the promoter using native elongating transcript-cap analysis of gene expression (NET-CAGE), suggesting transcriptional suppression."
    explanation: >-
      A noncoding promoter expansion reaches the same loss of NAXE protein by
      suppressing transcription, so the disease follows loss of the protein
      rather than one variant class.
  downstream:
  - target: Failure of NAD(P)HX Epimerization
    description: >-
      Without NAXE the R and S epimers of NAD(P)HX are no longer interconverted.
- name: Failure of NAD(P)HX Epimerization
  biological_scale: MOLECULAR
  description: >-
    NAD(P)H hydration yields R- and S-NAD(P)HX. The dehydratase NAXD acts only
    on the S epimer, so the R epimer has to be converted to S by NAXE before it
    can be repaired. Loss of NAXE leaves the R form stranded outside the
    repair cycle.
  molecular_functions:
  - preferred_term: NAD(P)HX epimerase activity
    term:
      id: GO:0052856
      label: NAD(P)HX epimerase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: metabolite repair
    term:
      id: GO:0110051
      label: metabolite repair
    modifier: DECREASED
  evidence:
  - reference: PMID:27122014
    reference_title: "Homozygous mutation in the APOA1BP is associated with a lethal infantile leukoencephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "APOA1BP encodes for epimerase that catalyzes the R to S epimerization of NAD(P)XH, a crucial step in the dehydration of these toxic metabolites accumulating during cellular metabolism."
    explanation: >-
      States the R-to-S epimerization that NAXE performs and that dehydration
      depends on. The source's "NAD(P)XH" is its own spelling of NAD(P)HX and
      is quoted as written.
  - reference: PMID:39789421
    reference_title: "Failure to repair damaged NAD(P)H blocks de novo serine synthesis in human cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The NAXE epimerase accelerates interconversion between the S- and R-NAD(P)HX forms, whereas the NAXD dehydratase stereospecifically acts on S-NAD(P)HX in an ATP-dependent manner."
    explanation: >-
      Explains why the epimerase is required: the dehydratase is specific for
      the S epimer.
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The enzyme catalyzes the epimerization of NAD(P)HX, thereby avoiding the accumulation of toxic metabolites."
    explanation: >-
      Links the epimerase activity to preventing accumulation of damaged
      cofactor, the next node in the chain.
  downstream:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    description: >-
      Unrepaired hydrated cofactors build up.
- name: Accumulation of Damaged NAD(P)HX Cofactors
  biological_scale: MOLECULAR
  description: >-
    NAXE-deficient patient fibroblasts contain highly elevated cyclic-NADHX,
    and heat stress at 40 degrees C raises it further. naxe-knockout zebrafish
    larvae accumulate NADHX and have reduced NAD.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In these fibroblasts we measured highly elevated concentrations of the toxic metabolite cyclic-NADHX, confirming a deficiency of the mitochondrial NAD(P)HX repair system."
    explanation: >-
      Direct measurement of the accumulated damaged cofactor in patient cells.
  - reference: PMID:41621837
    reference_title: "Unveiling Immune System Perturbations in Early Development Through Zebrafish Models of NADHX Repair Deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant naxe and naxd larvae showed NADHX accumulation and decreased levels of the healthy NAD cofactor."
    explanation: >-
      Reproduces the accumulation in vivo in naxe-knockout zebrafish, with the
      accompanying fall in NAD.
  downstream:
  - target: NAD+ Depletion
    description: >-
      Damaged cofactor that is not repaired is lost from the usable NAD(P)
      pool.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Mitochondrial Energy Metabolism Dysfunction
    description: >-
      Damaged cofactors impair mitochondrial energy metabolism; the
      intermediate steps are not established for NAXE.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: NAD+ Depletion
  biological_scale: MOLECULAR
  description: >-
    Untargeted metabolomics in one NAXE-deficient child during a crisis showed
    reduced NAD+ catabolites, which returned toward normal on niacin. The
    authors read this as acute NAD+ depletion, and they say that whether
    depletion is also chronic between crises is unknown.
  biological_processes:
  - preferred_term: NAD+ metabolic process
    term:
      id: GO:0019674
      label: NAD+ metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, untargeted metabolomics data show that the depletion of NAD+ catabolic products was reverted with niacin supplementation, supporting a model of NAD+ depletion, contributing to the metabolic derangement."
    explanation: >-
      Patient metabolomics, at crisis and on treatment, behind the NAD+
      depletion node.
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it is not currently known if there is a chronic, low-grade depletion of intracellular NAD+ pool, limiting our data for niacin supplementation as a prophylactic measure (see below)."
    explanation: >-
      The same authors limit the claim to acute depletion during crisis.
  downstream:
  - target: Mitochondrial Energy Metabolism Dysfunction
    description: >-
      NADH is the electron donor for the respiratory chain, so a shrinking
      pool limits oxidative metabolism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mitochondrial Energy Metabolism Dysfunction
  biological_scale: CELLULAR
  description: >-
    CSF lactate was raised in every child of the founding series and in 10 of
    14 reported cases with CSF data, modestly, at two to three times the upper
    limit of normal. Crisis metabolomics show nonspecific markers of
    mitochondrial dysfunction. The disorder turns up in mitochondrial disease
    and Leigh syndrome exome cohorts.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated lactate levels in cerebrospinal fluid, as found in all NAXE-deficient individuals, are suggesting a deficiency/disturbance in mitochondrial energy metabolism."
    explanation: >-
      The founding series reads the CSF lactate rise as a disturbance of
      mitochondrial energy metabolism.
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, biochemical findings support a model of acute depletion of NAD+, signs of mitochondrial dysfunction, and altered lipidomics."
    explanation: >-
      Patient biochemistry during crisis shows signs of mitochondrial
      dysfunction.
  downstream:
  - target: Increased CSF lactate
    description: >-
      Impaired oxidative metabolism shifts the brain toward lactate.
  - target: Trigger-Precipitated Neurometabolic Crisis
    description: >-
      A compromised oxidative capacity fails when fever raises both metabolic
      demand and the rate of cofactor damage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Trigger-Precipitated Neurometabolic Crisis
  biological_scale: ORGANISM
  description: >-
    The defining clinical event. A febrile infection, most often
    gastroenteritis or an upper respiratory infection, precipitates subacute
    neurological deterioration. Crises can partly recover and recur, and a
    terminal crisis with brain edema and respiratory failure ends the course
    in most patients.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset was during the second year of life and clinical signs as well as episodes of deterioration were triggered by febrile infections."
    explanation: >-
      Establishes febrile infection as the trigger for onset and for each
      deterioration.
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The course of the disease fluctuates from initially mild myopathy to encephalomyopathic crises, including motor and cognitive regression, quadriparesis, and respiratory and visual symptoms at time of febrile illness, which can be followed by a recovery, yet eventually a terminal febrile crisis of progressive encephalopathy, brain edema, and respiratory failure ensues in the majority of patients."
    explanation: >-
      Describes the crisis-and-recovery course across 30 reported NAXE cases
      and its usual terminal crisis.
  downstream:
  - target: Progressive Cerebellar and Spinal Cord Neurodegeneration
  - target: Abnormal blistering of the skin
    description: >-
      In the founding series the skin lesions appeared two to three weeks
      after the neurological crisis began. How the repair defect produces them
      is not known.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Respiratory failure
  - target: Coma
  - target: Encephalopathy
- name: Progressive Cerebellar and Spinal Cord Neurodegeneration
  biological_scale: TISSUE
  description: >-
    The cerebellum and spinal cord carry the brunt of the injury: cerebellar
    edema and symmetrical cerebellar white matter signal change acutely,
    spinal myelopathy, and cerebellar and spinal cord atrophy in survivors.
    Leukoencephalopathy and global brain atrophy follow in progressive cases.
    Imaging can be normal or subtle early in a crisis.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease course was rapidly progressive, leading to coma, global brain atrophy, and finally to death in all affected individuals."
    explanation: >-
      The founding series' progressive course to global atrophy.
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, only minimal or subtle findings on brain imaging have been reported early in the course of the crisis, such as cerebral edema or atrophy"
    explanation: >-
      Records that imaging can be unrevealing early, which matters for
      diagnosis. Quoted to stop before the bracketed citation markers.
  downstream:

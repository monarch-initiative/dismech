genetic:
- name: NAXE
  gene_term:
    preferred_term: NAXE
    term:
      id: hgnc:18453
      label: NAXE
  relationship_type: CAUSATIVE
  notes: >-
    NAXE was formerly APOA1BP. Missense, truncating, splice-site and promoter
    repeat-expansion alleles are reported. ClinGen classifies NAXE as
    Definitive for MONDO:0044970 mitochondrial disease (AR) and Limited for
    MONDO:0009723 Leigh syndrome (AR). Neither is this entry's MONDO term, so
    no gene_disease_validity is recorded here.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed pathogenic biallelic mutations in NAXE in children from four families with (sub-) acute-onset ataxia, cerebellar edema, spinal myelopathy, and skin lesions."
    explanation: >-
      Founding gene-disease association across four families.
  - reference: PMID:27122014
    reference_title: "Homozygous mutation in the APOA1BP is associated with a lethal infantile leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping followed by whole exome sequencing, we identified a homozygous c. 281C>A mutation in the APOA1BP gene resulting in substitution of a highly conserved alanine residue with aspartic acid (p.Ala94Asp)."
    explanation: >-
      Independent, simultaneous report of a homozygous NAXE (APOA1BP) variant
      in a five-sibling family.
  variants:
  - name: NAXE promoter GGGCC repeat expansion
    description: >-
      A biallelic GGGCC expansion of about 200 repeats in the NAXE promoter,
      found by long-read sequencing. It is CpG-hypermethylated and suppresses
      transcription, and it was homozygous through maternal uniparental disomy
      of chromosome 1. Short-read exome sequencing does not detect it.
    evidence:
    - reference: PMID:39455596
      reference_title: "Biallelic GGGCC repeat expansion leading to NAXE-related mitochondrial encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a patient with NAXE-related mitochondrial encephalopathy and novel biallelic GGGCC repeat expansion as long as ~200 repeats in the NAXE promoter region using long-read sequencing."
      explanation: >-
        Identifies the expansion and the long-read method that found it.
    - reference: PMID:39455596
      reference_title: "Biallelic GGGCC repeat expansion leading to NAXE-related mitochondrial encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analyses determined that homozygosity in the patient was due to maternal chromosome 1 uniparental disomy (UPD)."
      explanation: >-
        Uniparental disomy is the route to homozygosity; one parent need not be
        a carrier, which matters for recurrence counselling.
environmental:
- name: Febrile infection
  description: >-
    Febrile infection, most often gastroenteritis or an upper respiratory
    infection, precipitates onset and each later deterioration. In one
    late-onset case alcohol and cannabis use were suspected triggers. Heat
    raises cyclic-NADHX in NAXE-deficient fibroblasts, which is the proposed
    link between fever and decompensation.
  exposure_term:
    preferred_term: febrile infection
  review_notes: >-
    Left unbound. The ECTO searches recorded on the sister entry
    NAD_P_HX_Dehydratase_Deficiency found no term for febrile illness,
    infection or endogenous hyperthermia, and ECTO:1000007 "exposure to high
    temperature environment" describes ambient heat rather than fever.
  influences_mechanisms:
  - target: Trigger-Precipitated Neurometabolic Crisis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Febrile infection precipitates onset and each episode of deterioration.
    evidence:
    - reference: PMID:27616477
      reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Disease onset was during the second year of life and clinical signs as well as episodes of deterioration were triggered by febrile infections."
      explanation: >-
        The founding series ties both onset and later deterioration to febrile
        infection.
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Heat increases cofactor damage in NAXE-deficient cells. This is shown in
      culture at 40 degrees C, not measured in febrile patients.
    evidence:
    - reference: PMID:27616477
      reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accordingly, in our cell studies, we also observed a gradual increase of cyclic-NADHX levels after NAXE-deficient cells were exposed to heat stress."
      explanation: >-
        Heat stress raises cyclic-NADHX in patient fibroblasts, the cellular
        counterpart of fever.
  evidence:
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triggers include febrile gastroenteritis and upper respiratory infection (URI) for the vast majority of cases, but alcohol and tetrahydrocannabinol consumption were suspected to trigger a crisis in one late-onset case"
    explanation: >-
      Names the common infectious triggers and the one non-infectious trigger
      suspected. Quoted to stop before the bracketed citation marker.

    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we summarize the clinical knowledge of NAXE deficiency from 30 cases and lessons learned about disease pathogenesis from cell cultures and model organisms"
    explanation: >-
      Thirty NAXE cases as of the 2022 review.
  - reference: PMID:41578284
    reference_title: "Deficiency of the NAD(P)HX metabolic repair system: a treatable mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined with previous studies, a total of 59 patients were included for analysis (14 cases of NAXD deficiency and 45 cases of NAXE deficiency), with an overall mortality rate of 66.7%."
    explanation: >-
      Forty-five NAXE cases in the 2026 pooled analysis; the NAXE count is
      given separately from the NAXD count.
progression:
- phase: Classic infantile course
  age_range: Normal development to 6-12 months; onset usually in the second year of life
  notes: >-
    Development is normal until a febrile infection precipitates subacute
    ataxia and encephalopathy. Crises can partly recover and then recur with
    later infections. In the founding series all affected children died within
    the first three years; across reported cases, death or ventilator
    dependence and bedridden status followed within five years of diagnosis in
    90%. Death is recorded here rather than as a phenotype because HPO's
    mortality branch is outside the schema's PhenotypeTerm closure.
  evidence:
  - reference: PMID:27122014
    reference_title: "Homozygous mutation in the APOA1BP is associated with a lethal infantile leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on five siblings of consanguineous family who developed normally for the first 6-12 months of life then presented with a severe leukoencephalopathy following a trivial febrile illness."
    explanation: >-
      Normal early development before onset.
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset was during the second year of life and clinical signs as well as episodes of deterioration were triggered by febrile infections."
    explanation: >-
      Onset in the second year of life.
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prognosis is dismal, with death or ventilator dependence and bedridden status ensuing within 5 years from diagnosis in 90% of reported cases"
    explanation: >-
      Outcome across reported NAXE cases. Quoted to stop before the clause
      about the exceptions, which the next phase records.
- phase: Attenuated and later-onset courses
  age_range: Infancy with long survival; or onset in adolescence or early adulthood
  notes: >-
    A minority survive. One man with infant-onset decompensations was stable
    with residual cerebellar signs after more than 20 years of follow-up. A
    girl presenting at 20 months walked and attended school at 5.5 years. Two
    sisters had onset in early adulthood with psychosis, seizures and a
    fluctuating course. These cases mean that NAXE deficiency belongs in the
    differential beyond infancy.
  evidence:
  - reference: PMID:38419707
    reference_title: "Long-term follow-up of an attenuated presentation of NAXE-related disease, a potentially actionable neurometabolic disease: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 24-year-old man first became symptomatic in infancy with frequent initial neurological decompensations in the setting of infections with subsequent clinical improvement followed by stability with residual cerebellar dysfunction."
    explanation: >-
      Infant onset with long survival and stabilization.
  - reference: PMID:34678889
    reference_title: "NAXE gene mutation-related progressive encephalopathy: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present (age of 5.5 years old), she can walk with an unsteady gait and go to school."
    explanation: >-
      Recovery after two fever-induced crises in a child presenting at 20
      months.
  - reference: PMID:31745726
    reference_title: "Novel NAXE variants as a cause for neurometabolic disorder: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the previously reported patients with biallelic NAXE variants, our patients showed a milder phenotype with disease onset in early adulthood with psychosis, cognitive impairment, seizures, cerebellar ataxia and spasticity."
    explanation: >-
      Adult-onset presentation.
treatments:
- name: Niacin or Nicotinamide (NAD+ Precursor) Supplementation
  description: >-
    Oral nicotinic acid or nicotinamide, intended to replenish NAD+ during and
    between crises. Reported doses span from tens of mg/day to 500 mg/day of
    nicotinamide in a Beijing series, titrated against flushing and perioral
    rash. The evidence is case reports and retrospective series without
    controls. In pooled NAXE and NAXD data, 17 of 21 treated patients survived,
    against two survivors among untreated patients. One NAXE patient died
    despite the highest niacin dose reported. Kremer et al. first raised the
    rationale, and trigger avoidance and fever control are usually given
    alongside.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nicotinic acid
      term:
        id: CHEBI:15940
        label: nicotinic acid
    - preferred_term: nicotinamide
      term:
        id: CHEBI:17154
        label: nicotinamide
  target_mechanisms:
  - target: NAD+ Depletion
    description: >-
      Raises flux into NAD+ synthesis. It does not restore epimerase activity.
  evidence:
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings are further substantiated by untargeted metabolomics six months post-crisis showing that niacin supplementation reverses primary metabolomic abnormalities concurrent with improved clinical status."
    explanation: >-
      In one patient, niacin reversed the metabolomic abnormalities alongside
      clinical improvement.
  - reference: PMID:31745726
    reference_title: "Novel NAXE variants as a cause for neurometabolic disorder: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This combination and avoidance of triggers was associated with continuous motor and cognitive improvement."
    explanation: >-
      Improvement on vitamin B3 with coenzyme Q and trigger avoidance in an
      adult-onset patient; the combination prevents attributing it to niacin
      alone.
  - reference: PMID:41578284
    reference_title: "Deficiency of the NAD(P)HX metabolic repair system: a treatable mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "All seven treated patients survived, three of whom were able to attend school normally, and no significant adverse reactions were observed during treatment."
    explanation: >-
      Seven nicotinamide-treated patients (six NAXE, one NAXD) in a single
      centre's retrospective series. INDIRECT because the treated group
      includes a NAXD patient.
  - reference: PMID:41578284
    reference_title: "Deficiency of the NAD(P)HX metabolic repair system: a treatable mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Among the 21 patients who received niacin/nicotinamide treatment, 17 survived (80.95%), whereas only two untreated patients survived, and 85.45% of the untreated patients died within 2 years of onset."
    explanation: >-
      The strongest outcome figure available. INDIRECT because it pools NAXE
      with NAXD patients, and the treated and untreated groups are a
      retrospective, uncontrolled comparison open to survivorship and era
      bias.
  - reference: PMID:38974613
    reference_title: "Transient response to high-dose niacin therapy in a patient with NAXE deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Niacin therapy failed to halt disease progression or attain stabilization of the disease in this patient."
    explanation: >-
      A PEBEL1 patient who died despite the highest niacin dose reported, so
      niacin does not reliably prevent a fatal outcome.
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Finally, NAD or nicotinic acid (vitamin B3) supplementation might have therapeutic implications for this fatal disorder."
    explanation: >-
      The founding authors' original proposal, stated as a possibility, not
      a result.
- name: Early Fever Control and Trigger Avoidance
  description: >-
    Prompt control of fever and avoiding known triggers. This follows from the
    heat sensitivity of NAD(P)HX formation. The founding authors suggest it,
    but it has never been tested.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Trigger-Precipitated Neurometabolic Crisis
    description: >-
      Aims to blunt the trigger that converts the chronic defect into a
      crisis.
  evidence:
  - reference: PMID:27616477
    reference_title: "NAXE Mutations Disrupt the Cellular NAD(P)HX Repair System and Cause a Lethal Neurometabolic Disorder of Early Childhood."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In general, early fever control might be beneficial in affected individuals."
    explanation: >-
      The founding authors' suggestion, in their own hedged wording; not an
      outcome.
animal_models:
- name: naxe knockout zebrafish
  species: Zebrafish
  genotype: naxe homozygous CRISPR/Cas9 deletion (naxe-/-)
  publication: PMID:41621837
  description: >-
    CRISPR/Cas9 naxe-null zebrafish are viable. They accumulate NADHX and show
    immune gene dysregulation and increased neutral red staining in the head,
    but no severe locomotor phenotype or early death, unlike naxd-null fish.
    The authors suggest a stress trigger may be needed, and they note that
    zebrafish are kept at 28 degrees C.
  modeled_mechanisms:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The biochemical lesion, NADHX accumulation with reduced NAD, is present
      in vivo.
    limitations: >-
      Zebrafish are poikilothermic and kept at 28 degrees C, well below human
      body temperature or fever, so the heat-driven component of cofactor
      damage is under-represented.
    evidence:
    - reference: PMID:41621837
      reference_title: "Unveiling Immune System Perturbations in Early Development Through Zebrafish Models of NADHX Repair Deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant naxe and naxd larvae showed NADHX accumulation and decreased levels of the healthy NAD cofactor."
      explanation: >-
        The accumulation the link asserts.
  - target: Progressive Cerebellar and Spinal Cord Neurodegeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Under standard conditions naxe-null larvae do not develop the severe
      phenotype that naxd-null larvae do.
    limitations: >-
      No stress trigger was applied. The authors propose heat stress as the
      untested next step, so the failure may reflect missing fever rather than
      a species difference in vulnerability.
    evidence:
    - reference: PMID:41621837
      reference_title: "Unveiling Immune System Perturbations in Early Development Through Zebrafish Models of NADHX Repair Deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While both models accumulated NADHX, only naxd-/- larvae developed a severe phenotype, showing reduced locomotion and early death, which was partially rescued by nicotinic acid supplementation."
      explanation: >-
        The negative result for naxe set against the positive result for naxd.
  evidence:
  - reference: PMID:41621837
    reference_title: "Unveiling Immune System Perturbations in Early Development Through Zebrafish Models of NADHX Repair Deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Approximately 30% of the F2 generation were homozygous for the naxe mutation, suggesting that naxe deficiency is viable in zebrafish under standard conditions."
    explanation: >-
      Viability of the knockout under standard conditions.
experimental_models:
- name: NAXE-deficient patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from NAXE-deficient children, in which absent NAXE
    protein, cyclic-NADHX accumulation and its increase under heat stress were
    shown.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:27616477
  modeled_mechanisms:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient-genotype cells show the accumulated damaged cofactor directly,
      and heat raises it.
    limitations: >-
      Fibroblasts are not an affected tissue, so they report the biochemical
      lesion but not why cerebellum and spinal cord are selectively injured.
      No genetic rescue of the NAXE fibroblasts is reported in the cited
      paper.

  - reference: PMID:32020600
    reference_title: "Genetic heterogeneity in Leigh syndrome: Highlighting treatable and novel genetic causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two treatable cases had biotin-thiamine responsive basal ganglia disease, and another three were identified as having defects in the newly recognized genes (VPS13D or NAXE)."
    explanation: >-
      NAXE defects among clinically diagnosed Leigh syndrome patients.
discussions:
- discussion_id: naxe_zebrafish_no_severe_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#naxe knockout zebrafish
  - pathophysiology#Progressive Cerebellar and Spinal Cord Neurodegeneration
  prompt: >-
    Why do naxe-null zebrafish accumulate NADHX without developing the
    neurodegeneration that NAXE loss causes in children?
  rationale: >-
    The zebrafish model reproduces the biochemical lesion but not the disease.
    That gap matters because the human disease is defined by fever-triggered
    crises, and zebrafish live at 28 degrees C with no febrile response, while
    NAD(P)HX formation rises with temperature. If heat stress unmasks a
    phenotype, the model becomes usable for preclinical testing of NAD+
    precursors, as the naxd model already is. If it does not, the human
    vulnerability likely depends on something the fish lack. The authors
    propose exactly this test and have not reported it.
  evidence:
  - reference: PMID:41621837
    reference_title: "Unveiling Immune System Perturbations in Early Development Through Zebrafish Models of NADHX Repair Deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While both models accumulated NADHX, only naxd-/- larvae developed a severe phenotype, showing reduced locomotion and early death, which was partially rescued by nicotinic acid supplementation."
    explanation: >-
      States the mismatch.
  proposed_experiments:
  - experiment_id: naxe_zebrafish_heat_stress
    name: Heat stress challenge in naxe-null zebrafish larvae
    description: >-
      Raise water temperature in naxe-null and wild-type larvae and compare
      NADHX accumulation, locomotion and survival, with and without nicotinic
      acid.
    readouts:
    - name: NADHX accumulation and survival under heat stress
      target: pathophysiology#Accumulation of Damaged NAD(P)HX Cofactors
      direction: INCREASED
      interpretation: >-
        A heat-dependent rise in NADHX with reduced survival would show the
        model's failure reflects the missing trigger.
- discussion_id: naxe_niacin_efficacy_uncontrolled
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Niacin or Nicotinamide (NAD+ Precursor) Supplementation
  prompt: >-
    Does NAD+ precursor treatment change survival in NAXE deficiency, and
    should it start before the first crisis?
  rationale: >-
    All outcome data are case reports and retrospective series. The largest
    comparison pools NAXE with NAXD and sets treated patients, mostly
    diagnosed recently and alive long enough to be treated, against an
    untreated historical group, which favours the treated arm. One patient
    deteriorated to death on the highest niacin dose reported. The authors
    who showed metabolomic correction also note that no one knows whether NAD+
    is chronically depleted between crises, which is the question that
    decides prophylactic use in a presymptomatic sibling.
  evidence:
  - reference: PMID:35637064
    reference_title: "NAXE deficiency: A neurometabolic disorder of NAD(P)HX repair amenable for metabolic correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it is not currently known if there is a chronic, low-grade depletion of intracellular NAD+ pool, limiting our data for niacin supplementation as a prophylactic measure (see below)."
    explanation: >-
      The open question on prophylaxis, stated by the authors.
notes: >-
  No GeneReviews chapter exists for this disorder (Bookshelf index check).

  ClinGen gene-disease validity records for NAXE exist only for broader or
  different MONDO concepts (mitochondrial disease, Definitive; Leigh syndrome,
  Limited), so none is recorded as a gene_disease_validity assertion for this
  entry.

  Evidence from studies that pool NAXE with NAXD deficiency is graded
  INDIRECT where the claim needs the NAXE half of the pool. The serine
  synthesis block shown in NAXD-deficient cells (PMID:39789421) is not
  curated as a NAXE mechanism. PMID:35637064 reports that the serine
  finding was not reproduced in its NAXE patient's metabolomics.

  Not curated: a ketogenic diet response (single adolescent case,
  PMID:42496170), mitochondrial cofactor combinations without niacin, and
  four NAXE-knockout iPSC lines (PMID:40752251), a resource report with no
  mechanistic result. PMID:31758406, a Turkish case report, was fetched with
  no quotable text.

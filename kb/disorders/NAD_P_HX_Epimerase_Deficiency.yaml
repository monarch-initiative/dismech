name: NAD(P)HX Epimerase Deficiency
creation_date: "2026-10-15T12:00:00Z"
category: Mendelian
description: >-
  NAD(P)HX epimerase (NAXE) deficiency, catalogued as PEBEL1, is an autosomal
  recessive metabolite repair disorder. NAD(P)H is hydrated, spontaneously and
  faster at higher temperature, into redox-inactive NAD(P)HX, which exists as R
  and S epimers. NAXD can repair only the S form, so NAXE, which interconverts
  the two, is needed to bring the R form back into the repair cycle. Without
  it, damaged cofactor accumulates, and patient metabolomics point to NAD+
  depletion and mitochondrial dysfunction.

  The typical child develops normally through the first year and presents in
  the second year of life, when a febrile infection precipitates subacute
  ataxia with cerebellar edema, spinal myelopathy, leukoencephalopathy and, in
  a minority, bullous skin lesions. Crises recur with later infections. In the
  founding series every affected child progressed to coma and died within the
  first three years. Later reports widened the spectrum to attenuated courses
  with long survival and to onset in adolescence or early adulthood. NAD+
  precursor treatment (niacin or nicotinamide) is reported to help in
  uncontrolled case series, and one patient died despite high-dose niacin.

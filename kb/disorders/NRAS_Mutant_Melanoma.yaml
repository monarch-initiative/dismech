    term:
      id: hgnc:7989
      label: NRAS
  association: Somatic Oncogenic Mutation
  relationship_type: SOMATIC_DRIVER
  notes: >-
    Most common NRAS mutation in cutaneous melanoma, substituting glutamine with
    arginine at codon 61. Decreases intrinsic GTPase activity, enhances nucleotide
    binding and BRAF-CRAF engagement, and drives high-penetrance melanoma
    initiation in vivo.
  evidence:
  - reference: DOI:10.1038/s41467-022-30881-9
    reference_title: Enhanced BRAF engagement by NRAS mutants capable of promoting melanoma initiation
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generate eight conditional, knock-in mouse models and show that rare melanoma mutants (NRAS G12D, G13D, G13R, Q61H, and Q61P) are poor drivers of spontaneous melanoma formation, whereas common melanoma mutants (NRAS Q61R, Q61K, or Q61L) induce rapid tumor onset with high penetrance."
    explanation: Conditional knock-in allelic series proves NRAS Q61R is a high-penetrance somatic driver of melanoma initiation.
  - reference: PMID:40023845
    reference_title: "The NF1 tumor suppressor regulates PD-L1 and immune evasion in melanoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hotspot BRAF, hotspot NRAS, and NF1 loss-of-function mutations are found in approximately 50%, 25%, and 15% of cutaneous melanomas, respectively."
    explanation: Confirms hotspot NRAS mutations are present in approximately 25% of cutaneous melanomas.

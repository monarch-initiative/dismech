diagnosis:
- name: Tumor Somatic NRAS Mutation Profiling
  description: >-
    Targeted next-generation DNA sequencing, pyrosequencing, or Sanger sequencing
    of primary or metastatic melanoma tissue covering NRAS exons 2 and 3 (codons
    12, 13, and 61) alongside BRAF and NF1 defines the NRAS-mutant molecular
    subtype, excludes BRAF V600 targetability, and informs clinical trial selection.
  diagnosis_term:
    preferred_term: Next Generation Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: DOI:10.3390/cancers16071347
    reference_title: Targeted DNA Sequencing of Cutaneous Melanoma Identifies Prognostic and Predictive Alterations
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 254 patients with CM who had a CLIA-certified targeted sequencing assay performed on their tumor tissue were included."
    explanation: Demonstrates routine clinical tumor targeted DNA sequencing to classify NRAS-mutant cutaneous melanoma.
  - reference: PMID:28797232
    reference_title: "Prognostic significance of BRAF and NRAS mutations in melanoma: a German study from routine care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutational status of BRAF (exon 15) and NRAS (exon 2 and 3) was determined in melanoma samples of 217 patients with pyrosequencing and Sanger sequencing."
    explanation: Documents routine diagnostic genotyping of NRAS exons 2 and 3 in clinical melanoma care.
- name: Dermoscopy and Histopathologic Confirmation
  description: >-
    Suspected primary cutaneous melanoma requires dermoscopic evaluation followed
    by excisional biopsy and histopathologic confirmation prior to molecular
    staging.
  diagnosis_term:
    preferred_term: Dermoscopy
    term:
      id: NCIT:C116478
      label: Dermoscopy
  evidence:
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of melanoma can be made clinically and must always be confirmed by dermoscopy. If melanoma is suspected, a histopathological examination is always required."
    explanation: European consensus guideline establishes dermoscopy and histopathologic examination as mandatory diagnostic steps for cutaneous melanoma.
- name: Breslow Thickness Measurement on Biopsy
  description: >-
    Breslow vertical tumor thickness measured on histopathologic examination of the
    primary cutaneous melanoma specimen guides AJCC T-category staging, sentinel
    lymph node biopsy, and imaging workup, and is enriched above 1 mm in
    NRAS-mutant cohorts.
  diagnosis_term:
    preferred_term: biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  measurements:
  - preferred_term: Breslow thickness
    term:
      id: LOINC:92839-0
      label: Breslow thickness [Length] of Skin melanoma
  notes: >-
    No reference_ranges band is recorded because the cited NRAS cohort studies
    compare tumor thickness across mutational groups (>1 mm proportion or cohort
    medians) rather than defining a disease-diagnostic cutoff band.
  evidence:
  - reference: PMID:28797232
    reference_title: "Prognostic significance of BRAF and NRAS mutations in melanoma: a German study from routine care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NRAS mutations had previously been associated with higher Breslow ’s thickness and fast growth of the primary tumor"
    explanation: Documents Breslow thickness assessment in routine melanoma pathology and notes prior associations with NRAS status that were not confirmed in this specific cohort.
treatments:
- name: Immune Checkpoint Inhibitors
  description: >-
    Anti-PD-1 monoclonal antibodies (nivolumab, pembrolizumab) alone or in
    combination with anti-CTLA-4 (ipilimumab) are the standard first-line systemic
    therapy for unresectable or metastatic NRAS-mutant melanoma. Pooled clinical
    data demonstrate higher objective response rates in NRAS-mutant than in
    NRAS-wildtype cutaneous melanoma and improved stage IV survival in routine care.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
    - preferred_term: ipilimumab
      term:
        id: CHEBI:231679
        label: ipilimumab
  target_mechanisms:
  - target: Invasive and Metastatic Melanoma Dissemination
    treatment_effect: INHIBITS
    description: Restores anti-tumor T-cell cytotoxicity against advanced and metastatic NRAS-mutant melanoma.
  evidence:
  - reference: PMID:36873887
    reference_title: "Objective response to immune checkpoint inhibitor therapy in NRAS-mutant melanoma: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this meta-analysis evaluating the impact of NRAS mutational status on objective response to ICIs in metastatic melanoma, NRAS-mutant cutaneous melanoma demonstrated an increased likelihood of partial or complete tumor response, relative to NRAS-wildtype cutaneous melanoma."
    explanation: Meta-analysis of 1,770 patients demonstrates higher objective tumor response rates to immune checkpoint inhibitors in NRAS-mutant versus NRAS-wildtype metastatic cutaneous melanoma.
  - reference: PMID:28587477
    reference_title: "A review of binimetinib for the treatment of mutant cutaneous melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In particular, patients with NRAS-mutated melanoma still face limited therapeutic options, with immunotherapy being the current treatment type of choice."
    explanation: Review confirms immunotherapy as the primary systemic treatment modality for NRAS-mutant melanoma.
  - reference: PMID:28851243
    reference_title: "Binimetinib for the treatment of NRAS-mutant melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is an unmet medical need for new targeted therapy opportunities in metastatic patients whose tumors harbor an NRAS mutation."
    explanation: Explains the reliance on immunotherapy in metastatic NRAS-mutant melanoma due to the lack of approved direct RAS targeted therapies.
- name: MEK Inhibitors
  description: >-
    Allosteric MEK1/2 inhibitors (binimetinib, trametinib) show modest single-agent
    clinical activity in advanced NRAS-mutant melanoma, typically after failure of
    immunotherapy. In the phase 3 NEMO trial, binimetinib improved median
    progression-free survival versus dacarbazine (2.8 vs 1.5 months) without an
    overall survival benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: binimetinib
      term:
        id: CHEBI:145371
        label: binimetinib
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  target_mechanisms:
  - target: Dual MAPK and PI3K Pathway Activation
    treatment_effect: INHIBITS
    description: Inhibits MEK1/2 kinase activity to attenuate ERK cascade signaling downstream of mutant NRAS.
  - target: Uncontrolled Melanocyte Proliferation
    treatment_effect: INHIBITS
    description: Suppresses MAPK-dependent proliferative signaling in NRAS-mutant melanoma cells.
  evidence:
  - reference: PMID:28284557
    reference_title: "Binimetinib versus dacarbazine in patients with advanced NRAS-mutant melanoma (NEMO): a multicentre, open-label, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Binimetinib improved progression-free survival compared with dacarbazine and was tolerable. Binimetinib might represent a new treatment option for patients with NRAS-mutant melanoma after failure of immunotherapy."
    explanation: Phase 3 NEMO randomized trial demonstrates improved PFS with binimetinib versus dacarbazine in advanced NRAS-mutant melanoma.
  - reference: PMID:32100585
    reference_title: "An overview of binimetinib for the treatment of melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Single-agent binimetinib almost doubled median progression-free survival when compared to dacarbazine in patients with NRAS-mutated melanoma."
    explanation: Review confirms single-agent binimetinib nearly doubled median PFS versus dacarbazine in NRAS-mutated melanoma.
  - reference: PMID:28587477
    reference_title: "A review of binimetinib for the treatment of mutant cutaneous melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The results of a recent Phase III trial rendered binimetinib the first targeted therapy agent to significantly improve progression-free survival in NRAS-mutated melanoma."
    explanation: Confirms binimetinib as the first targeted agent to significantly prolong PFS in NRAS-mutated melanoma.
  - reference: PMID:28851243
    reference_title: "Binimetinib for the treatment of NRAS-mutant melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Only a modest progression-free survival (PFS) benefit was observed in NRAS-mutated patients who received binimetinib compared with dacarbazine in a randomized phase 3 clinical trial, with no improvement in overall survival."
    explanation: Contextualizes the modest PFS benefit and absence of overall survival improvement with single-agent binimetinib.
- name: Combination Targeted Therapy
  description: >-
    Combined MEK1/2 and CDK4/6 inhibition addresses concurrent MAPK activation and
    G1/S checkpoint dysregulation in NRAS-mutant melanoma. In a phase Ib/II trial,
    ribociclib plus binimetinib achieved a 19.5% overall response rate (32.5% in
    tumors with concurrent CDKN2A, CDK4, or CCND1 alterations).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ribociclib
      term:
        id: CHEBI:230905
        label: Ribociclib
    - preferred_term: binimetinib
      term:
        id: CHEBI:145371
        label: binimetinib
  target_mechanisms:
  - target: Dual MAPK and PI3K Pathway Activation
    treatment_effect: INHIBITS
    description: Binimetinib inhibits MEK1/2 within the hyperactive MAPK arm.
  - target: Uncontrolled Melanocyte Proliferation
    treatment_effect: INHIBITS
    description: Ribociclib blocks CDK4/6-mediated cell-cycle entry alongside MEK inhibition.
  evidence:
  - reference: PMID:35294522
    reference_title: "Phase Ib/II Trial of Ribociclib in Combination with Binimetinib in Patients with NRAS-mutant Melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ribociclib + binimetinib can be safely administered and is clinically active in patients with NRAS-mutant melanoma. Co-mutations of cell-cycle genes may define a population with greater likelihood of treatment benefit."
    explanation: Phase Ib/II clinical trial demonstrates antitumor activity of combined CDK4/6 and MEK inhibition in NRAS-mutant melanoma, enriched in tumors with cell-cycle gene co-mutations.
- name: Naporafenib plus Trametinib
  description: >-
    Investigational vertical pan-RAF (BRAF/CRAF) plus MEK1/2 inhibition with
    naporafenib and trametinib blocks mutant NRAS-driven BRAF-CRAF dimer signaling,
    achieving a 46.7% objective response rate in one phase Ib expansion dosing
    cohort of advanced NRAS-mutant melanoma.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: naporafenib
      term:
        id: CHEBI:747299
        label: Naporafenib
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  target_mechanisms:
  - target: Dual MAPK and PI3K Pathway Activation
    treatment_effect: INHIBITS
    description: Simultaneously inhibits BRAF/CRAF dimers and downstream MEK1/2 to suppress mutant NRAS MAPK output.
  evidence:
  - reference: DOI:10.1200/jco.22.02018
    reference_title: "Initial Evidence for the Efficacy of Naporafenib in Combination With Trametinib in <i>NRAS</i>-Mutant Melanoma: Results From the Expansion Arm of a Phase Ib, Open-Label Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Naporafenib plus trametinib showed promising preliminary antitumor activity in patients with NRAS-mutant melanoma."
    explanation: Phase Ib expansion study supports combined pan-RAF and MEK inhibition in advanced NRAS-mutant melanoma.
animal_models:
- name: Conditional melanocyte-specific Nras Q61R/Q61K/Q61L knock-in mice
  species: Mouse
  genotype: Conditional melanocyte-targeted Nras Q61R, Q61K, or Q61L knock-in (including Cdkn2a/p16INK4a-null backgrounds)
  publication: DOI:10.1038/s41467-022-30881-9
  description: >-
    Allelic series of eight conditional knock-in mouse models comparing common
    human melanoma NRAS codon 61 alleles (Q61R, Q61K, Q61L) against rare codon
    12/13/61 variants in melanocytes.
  modeled_mechanisms:
  - target: NRAS Q61 Oncogenic Mutation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Endogenous conditional expression of Nras Q61R, Q61K, or Q61L in murine
      melanocytes drives rapid spontaneous melanoma onset with high penetrance,
      whereas G12D/G13D/G13R/Q61H/Q61P alleles are weak drivers.
    evidence:
    - reference: DOI:10.1038/s41467-022-30881-9
      reference_title: Enhanced BRAF engagement by NRAS mutants capable of promoting melanoma initiation
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generate eight conditional, knock-in mouse models and show that rare melanoma mutants (NRAS G12D, G13D, G13R, Q61H, and Q61P) are poor drivers of spontaneous melanoma formation, whereas common melanoma mutants (NRAS Q61R, Q61K, or Q61L) induce rapid tumor onset with high penetrance."
      explanation: Directly recapitulates codon 61 allele-specific melanoma initiation in vivo.
disease_term:
  preferred_term: cutaneous melanoma
  term:
    id: MONDO:0005012
    label: cutaneous melanoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005012
      label: cutaneous melanoma
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      NRAS-mutant melanoma is a molecularly defined stratum of MONDO's cutaneous
      melanoma class, not the class itself: MONDO has no term for the NRAS Q61
      hotspot mutation stratum, so `disease_term` anchors to the broader parent
      term while `skos:broadMatch` records (reading subject to object) that
      MONDO:0005012 is broader than this entry. Required by design decisions
      section 3a for a promoted L4 biomarker stratum, which must never present
      bare parent-term reuse as an exact match; the parent term itself is claimed
      as an exactMatch by Cutaneous_Melanoma. Filing a MONDO NTR for this stratum
      is a tracked follow-up.
notes: >-
  Direct RAS inhibition has historically been challenging due to NRAS picomolar
  affinity for GTP and lack of deep allosteric pockets, while paradoxical CRAF
  transactivation contraindicates selective BRAF V600 monomer inhibitors in
  NRAS-mutant tumors. Immunotherapy remains the first-line systemic standard,
  with pan-RAF/MEK, MEK/CDK4/6, and emerging pan-RAS(ON) inhibitors under active
  clinical evaluation. Co-mutation with BRAF V600 or NF1 occurs in a small
  minority (~2-8%) of cutaneous melanomas, creating non-disjoint overlap with
  sibling molecular strata.

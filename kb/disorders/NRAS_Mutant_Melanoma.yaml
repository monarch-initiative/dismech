    reference_title: Mutation-Specific RAS Oncogenicity Explains NRAS Codon 61 Selection in Melanoma
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead, NrasQ61R showed enhanced nucleotide binding, decreased intrinsic GTPase activity, and increased stability when compared with NrasG12D."
    explanation: Demonstrates the specific biochemical defect of melanomagenic codon 61 NRAS (impaired intrinsic GTPase activity and increased GTP-bound stability).
  - reference: PMID:40023845
    reference_title: "The NF1 tumor suppressor regulates PD-L1 and immune evasion in melanoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hotspot BRAF, hotspot NRAS, and NF1 loss-of-function mutations are found in approximately 50%, 25%, and 15% of cutaneous melanomas, respectively."
    explanation: Establishes hotspot NRAS mutations as one of the three major somatic driver classes in cutaneous melanoma.
  - reference: PMID:28851243
    reference_title: "Binimetinib for the treatment of NRAS-mutant melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Activating NRAS mutations occur in approximately 15-20% of melanomas and are the second most common oncogenic driver mutation in this disease, after BRAF mutations."
    explanation: Review confirms activating NRAS mutations as the second most common oncogenic driver in melanoma.

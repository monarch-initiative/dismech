name: NRAS Mutant Melanoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  NRAS-mutant melanoma is a molecular subtype of cutaneous melanoma characterized
  by activating mutations in the NRAS oncogene, occurring in approximately 15-25%
  of cutaneous melanomas. The most common mutations affect codon 61 (Q61R, Q61K,
  Q61L), with codons 12 and 13 affected less frequently. NRAS mutations impair
  intrinsic GTPase activity and GAP sensitivity, locking NRAS in a constitutively
  GTP-bound active state that persistently stimulates both MAPK (BRAF/CRAF-MEK-ERK)
  and PI3K-AKT-mTOR signaling pathways. NRAS-mutant melanomas are enriched for
  nodular histology, thicker primary tumors, higher mitotic rates, and earlier
  loco-regional nodal relapse and visceral metastasis compared with BRAF-mutant or
  wild-type disease. Unlike BRAF V600-mutant melanoma, no NRAS-specific targeted
  therapy is approved; immune checkpoint blockade is the first-line systemic
  mainstay, while MEK inhibition and rational RAF/MEK or MEK/CDK4/6 combinations
  provide modest or investigational activity.
categories:
- Skin Cancer
- Molecularly Defined Cancer
- Oncogene-Driven Cancer
parents:
- cutaneous melanoma
synonyms:
- NRAS-mutant cutaneous melanoma
- NRAS-mutated melanoma
- NRAS Q61-mutant melanoma
epidemiology:
- name: Cohort-dependent NRAS mutation frequency in cutaneous melanoma
  description: >-
    NRAS hotspot mutations represent the second most common oncogenic driver group
    in cutaneous melanoma after BRAF, accounting for roughly 15-25% of cases across
    general series, 24.4% (with an additional 2.3% BRAF/NRAS co-mutated) in a
    217-patient German routine-care cohort, and 30.3% in a 254-patient clinical
    targeted-sequencing cohort. These figures are within-melanoma genotype
    proportions rather than population prevalence rates.
  evidence:
  - reference: PMID:28797232
    reference_title: "Prognostic significance of BRAF and NRAS mutations in melanoma: a German study from routine care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in BRAF and NRAS were identified in 40.1 and 24.4% of cases, respectively."
    explanation: Routine-care German cohort of 217 cutaneous melanoma patients establishes a 24.4% NRAS mutation frequency.
  - reference: DOI:10.3390/cancers16071347
    reference_title: Targeted DNA Sequencing of Cutaneous Melanoma Identifies Prognostic and Predictive Alterations
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 254 patients with cutaneous melanoma, 77 were BRAF mutant (30.3%), 77 were NRAS mutant (30.3%), 47 were NF1 mutant (18.5%), 33 were TWT (13.0%) and the remaining 20 (7.9%) carried mutations in multiple driver genes (BRAF/NRAS/NF1 co-mutated)."
    explanation: Clinical targeted-sequencing cohort quantifies the NRAS-mutant proportion among localized and metastatic cutaneous melanomas.
- name: Nodular subtype, higher mitotic rate, and thicker primary tumor enrichment
  description: >-
    Prospective and routine-care cohorts associate NRAS-mutant cutaneous melanoma
    with nodular growth pattern, primary tumor thickness above 1 mm, higher dermal
    mitotic index (>1 mitosis/mm2), and shorter time to loco-regional nodal relapse
    compared with BRAF V600E or BRAF/NRAS wild-type tumors.
  evidence:
  - reference: DOI:10.1111/j.1755-148x.2011.00873.x
    reference_title: Clinical outcome and pathological features associated with NRAS mutation in cutaneous melanoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NRAS mutations were associated with thicker tumors and higher rates of mitosis when compared to BRAFV600E and WT melanoma and independently of this, with shorter MSS."
    explanation: Prospective 249-patient cohort demonstrates thicker primary tumors, higher mitotic rates, and worse melanoma-specific survival in NRAS-mutant cutaneous melanoma.
  - reference: PMID:28797232
    reference_title: "Prognostic significance of BRAF and NRAS mutations in melanoma: a German study from routine care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nodular subtype was most common in the NRAS cohort."
    explanation: Routine-care melanoma cohort shows enrichment of nodular melanoma histology in the NRAS-mutant subgroup.
pathophysiology:
- name: NRAS Q61 Oncogenic Mutation
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  description: >-
    Somatic missense mutations at NRAS codon 61 (predominantly Q61R, Q61K, and Q61L)
    in cutaneous melanocytes impair intrinsic GTPase hydrolysis, enhance nucleotide
    binding and protein stability, and lock NRAS in its active GTP-bound state.
    Unlike codon 12/13 NRAS variants, codon 61 mutants maintain high active-state
    abundance and intramolecular contacts that potently drive melanomagenesis.

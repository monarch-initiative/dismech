- name: Disordered Microtubule Marginal Band in Proplatelets and Platelets
  biological_scale: CELLULAR
  description: >-
    In megakaryocytes cultured from patient blood, proplatelet swellings with disordered microtubules rise from under
    10% in controls to 34 to 46%, at the expense of swellings with a thick cortical band. Circulating patient platelets
    show highly disordered beta-tubulin instead of a cortical marginal band. Proplatelet number, length and branching
    are not obviously changed.

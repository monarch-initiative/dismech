    basal sub-nuclear beta-actin bundles; the same proteins are recruited to cortical beta-actin filaments in patient
    platelets. Variants in the genes for each of these proteins cause inherited macrothrombocytopenia. In silico
    modelling places the mutated residues at their binding interfaces.

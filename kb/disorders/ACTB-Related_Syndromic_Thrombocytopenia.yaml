differential_diagnoses:
- name: Baraitser-Winter Cerebrofrontofacial Syndrome
  disease_term:
    preferred_term: Baraitser-Winter cerebrofrontofacial syndrome
    term:
      id: MONDO:0017579
      label: Baraitser-Winter cerebrofrontofacial syndrome
  description: >-
    The other dominant ACTB missense disorder, curated in this knowledge base as
    Baraitser-Winter_Cerebrofrontofacial_Syndrome. Its variants lie in exons 2 to 4 and are thought to act by
    gain of function or dominant-negative effects on filament dynamics.
  distinguishing_features:
  - >-
    BWCFF has a recognizable facial gestalt (hypertelorism, high-arched eyebrows, ptosis) and frontal-predominant
    pachygyria; ACTB-related syndromic thrombocytopenia has only minor non-specific facial anomalies and no pachygyria.
  - Thrombocytopenia with platelet anisocytosis is the hematological signature of the 3' variant disorder.
  evidence:
  - reference: PMID:41529692
    reference_title: Molecular genotype-phenotype correlation in ACTB- and ACTG1-related non-muscle actinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BWCFF can be diagnosed in an individual with a (likely) pathogenic MV in ACTB or ACTG1 if this individual presents
      with (1) the specific facial dysmorphism
    explanation: Diagnostic criteria for BWCFF.
  - reference: PMID:30315159
    reference_title: Variants in exons 5 and 6 of ACTB cause syndromic thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The minor facial anomalies observed in these patients show no overlap with the striking and recognizable facial
      features associated with BWCFF.
    explanation: Facial distinction from BWCFF.
- name: ACTB Loss-of-Function Disorder
  description: >-
    Developmental delay, intellectual disability, microcephaly, growth restriction, heart and renal tract malformations
    and a recognizable facial gestalt, caused by whole-gene deletions (including 7p22.1 microdeletions) or truncating
    ACTB variants. OMIM files it under Baraitser-Winter syndrome 1. A 2026 cohort study found that it overlaps
    substantially with this disorder and proposed merging the two.
  distinguishing_features:
  - >-
    The variant class: deletion of the whole gene or a truncating variant expected to undergo nonsense-mediated decay,
    rather than a 3' exon 5 or 6 variant that escapes it.
  evidence:
  - reference: PMID:29220674
    reference_title: ACTB Loss-of-Function Mutations Result in a Pleiotropic Developmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe heterozygous ACTB deletions and nonsense and frameshift mutations in 33 individuals with developmental
      delay, apparent intellectual disability, increased frequency of internal organ malformations
    explanation: Defining cohort of the loss-of-function disorder.
  - reference: PMID:41062261
    reference_title: 'ACTB deletions or single-nucleotide loss-of-function variants: expansion and further delineation of
      the phenotype and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletions including ACTB, and, more rarely, single-nucleotide loss-of-function variants in ACTB have been described
      in patients with a distinct phenotype
    explanation: Phenotype of ACTB haploinsufficiency.
discussions:
- discussion_id: actb_ast_versus_plof_disorder
  kind: OPEN_QUESTION
  prompt: >-
    Is ACTB-related syndromic thrombocytopenia a separate disorder, or part of a single ACTB loss-of-function spectrum?
  rationale: >-
    ClinGen and OMIM keep this disorder separate, restricted to exon 5 and 6 variants. A 2026 study of 290 individuals
    with non-muscle actinopathies found that deletion carriers, carriers of truncating variants and the syndromic
    thrombocytopenia patients share a facial gestalt and variable thrombocytopenia, and proposed one ACTB pLoF disorder
    with three molecular routes: deletion, nonsense-mediated decay, and unstable protein. The founding report instead
    detected the mutant peptide and argued that mutant actin is incorporated into filaments, which is not a simple loss
    of function. This entry follows the ClinGen and MONDO scope until the question is settled; if the merge is adopted,
    its disease_term, genetic scope and loss-of-function phenotypes will need revisiting.
  attaches_to:
  - pathophysiology#Heterozygous ACTB 3' Coding Region Variant
  - disease#
  evidence:
  - reference: PMID:41529692
    reference_title: Molecular genotype-phenotype correlation in ACTB- and ACTG1-related non-muscle actinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the expanded cohort, we observed a shared facial gestalt and confirmed thrombocytopenia in individuals with
      ACTB deletions, supporting that these entities represent a single clinical spectrum
    explanation: The case for merging.
  - reference: PMID:41529692
    reference_title: Molecular genotype-phenotype correlation in ACTB- and ACTG1-related non-muscle actinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we hypothesized that some ACTB MVs might result in protein instability and degradation.
    explanation: The proposed unstable-protein route for missense and in-frame variants.
  - reference: PMID:30315159
    reference_title: Variants in exons 5 and 6 of ACTB cause syndromic thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, our cellular and in silico ABP data provide indirect evidence that mutant β-CYAP4 and β-CYAP5 are
      incorporated into actin filaments.
    explanation: The founding view that mutant actin participates in filaments.
- discussion_id: actb_ast_neurodevelopmental_mechanism
  kind: KNOWLEDGE_GAP
  prompt: How do 3' ACTB variants cause microcephaly and developmental delay?
  rationale: >-
    The mechanistic work on this disorder addresses platelets. Patient fibroblasts are smaller and migrate with reduced
    speed and persistence, but no study has examined neural progenitors or brain development for these variants, so
    the neurodevelopmental and craniofacial phenotypes have no mechanism node in this entry.
  attaches_to:
  - phenotypes#Microcephaly
  - phenotypes#Developmental Delay
  evidence:
  - reference: PMID:30315159
    reference_title: Variants in exons 5 and 6 of ACTB cause syndromic thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These experiments additionally show that the trajectory, speed and persistence of ACTB-AST fibroblasts is
      significantly altered compared to healthy control fibroblasts (Fig. 3d).
    explanation: The only non-hematopoietic cellular phenotype studied.
references:
- reference: PMID:30315159
  title: Variants in exons 5 and 6 of ACTB cause syndromic thrombocytopenia.
notes: >-
  Named with the ClinGen-preferred dyadic form, an exact MONDO synonym of MONDO:0100433; the MONDO label is kept in
  synonyms. Renal anomalies are not reported in the founding cohort or the 1999 case and are not recorded here; heart
  and renal tract malformations are described in the ACTB loss-of-function disorder. Photosensitivity in the 1999
  patient is not recorded as a feature of the disorder because no later patient has it. The giant-platelet report with
  disorganized granules (PMID:36564926) has no abstract in PubMed and is not cited. No treatment specific to this
  disorder has been reported; platelet transfusion and antifibrinolytics are used by analogy with other inherited
  thrombocytopenias, but no source reports their use in this disorder. No GeneReviews chapter covers this disorder; the
  only ACTB chapter (Baraitser-Winter Cerebrofrontofacial Syndrome, PMID:26583190) describes the differential
  diagnosis, not this entity.

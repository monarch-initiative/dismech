pathophysiology:
- name: Heterozygous ACTB 3' Coding Region Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline ACTB variants clustered in exons 5 and 6: missense p.Met313Arg and p.Glu364Lys, the in-frame
    deletion p.Ser338_Ile341del, and the last-exon frameshifts p.Ala331Val_fs*27 and p.Ser368Leu_fs*13. The tested
    transcripts escape nonsense-mediated decay, and the p.Ala331Val_fs*27 frameshift peptide was detected in patient
    fibroblasts, so mutant beta-actin is made. The changes fall in subdomain 1 and the C-terminus, which form the
    interfaces for myosin, alpha-actinin, filamin and profilin. The functional class is not settled: total beta-actin is
    reduced in patient fibroblasts, but the 2026 cohort study argues the phenotype matches ACTB loss of function (see
    discussions), so no functional impact category is recorded, and the cytoskeletal structural activity is marked
    abnormal rather than decreased or increased.

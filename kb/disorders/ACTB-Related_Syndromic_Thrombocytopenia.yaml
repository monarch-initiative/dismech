genetic:
- name: ACTB
  gene_term:
    preferred_term: ACTB
    term:
      id: hgnc:132
      label: ACTB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Variants arise de novo or are inherited from an affected parent, with variable expressivity within families. The
    ClinGen curation scores only exon 5 and 6 variants; two exon 4 variants with a partly overlapping phenotype are
    listed but not scored. ACTB variants elsewhere in the gene cause other disorders: missense variants in exons 2 to 4
    cause Baraitser-Winter cerebrofrontofacial syndrome, and whole-gene deletions and truncating variants that undergo
    nonsense-mediated decay cause the ACTB loss-of-function (pleiotropic developmental) disorder. ACTB lies at 7p22.1;
    7p22.1 microdeletions spanning ACTB belong to the loss-of-function disorder, although thrombocytopenia has been
    confirmed in some deletion carriers (see discussions).

name: ACTB-Related Syndromic Thrombocytopenia
description: >-
  Autosomal dominant non-muscle actinopathy caused by heterozygous ACTB variants in the 3' coding region (exons 5 and
  6), defined in 2018 as a clinical entity distinct from Baraitser-Winter cerebrofrontofacial syndrome. Affected people
  have mild developmental delay, borderline to mild intellectual disability, microcephaly, minor non-specific facial
  anomalies, and thrombocytopenia with platelet anisocytosis and enlarged platelets; some have leukocytosis with
  eosinophilia. Thrombocytopenia is usually found on routine testing and has not been associated with spontaneous
  bleeding. The variants (missense, small in-frame deletions, and frameshifts in the last exon) do not trigger
  nonsense-mediated decay. In patient cells they lower the beta-actin to gamma-actin ratio, redistribute
  thrombocytopenia-associated actin-binding proteins onto beta-actin filaments, and disorder the microtubule marginal
  band of proplatelet swellings and platelets, impairing the final stage of platelet maturation. ClinGen classifies the
  gene-disease relationship as Moderate.

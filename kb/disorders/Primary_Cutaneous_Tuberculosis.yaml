treatments:
- name: Antituberculous chemotherapy
  description: >-
    Standard multidrug antituberculous therapy, as for pulmonary tuberculosis -
    an intensive phase of isoniazid, rifampicin, pyrazinamide and ethambutol
    followed by a continuation phase of isoniazid and rifampicin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  evidence:
  - reference: PMID:35853774
    reference_title: "Cutaneous tuberculosis chancre: case description in a child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment is similar to that of pulmonary forms of the disease."
    explanation: States that the tuberculous chancre is treated with the standard antituberculous regimen used for pulmonary TB.

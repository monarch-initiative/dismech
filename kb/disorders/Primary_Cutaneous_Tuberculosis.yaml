name: Primary Cutaneous Tuberculosis
creation_date: "2026-11-25T00:00:00Z"
synonyms:
- Tuberculous chancre
- Primary inoculation tuberculosis
- Primary tuberculous complex of the skin
description: >-
  Primary cutaneous tuberculosis (the tuberculous chancre, or primary
  inoculation tuberculosis) is the exogenous form of cutaneous tuberculosis that
  arises when Mycobacterium tuberculosis is inoculated directly into the skin of
  a host who has never been infected or sensitized to the mycobacterium. In the
  absence of pre-existing cell-mediated immunity the bacilli multiply locally as
  a multibacillary lesion, producing a firm painless papule that ulcerates, and
  then spread through the draining lymphatics to the regional nodes - a skin
  chancre plus regional lymphadenopathy that is the cutaneous equivalent of the
  Ghon (primary pulmonary) complex. As delayed-type hypersensitivity develops,
  the lesion becomes a caseating epithelioid-cell granuloma. It is distinct from
  the reactivation/endogenous forms of cutaneous tuberculosis (lupus vulgaris,
  tuberculosis verrucosa cutis) which occur in already-sensitized hosts. M.
  bovis and BCG are rarer causes of the same inoculation picture.
disease_term:
  preferred_term: Primary cutaneous tuberculosis
  term:
    id: MONDO:0957464
    label: primary cutaneous tuberculosis
review_notes: >-
  Scoped as a standalone named clinical entity rather than a has_subtypes row.
  Primary cutaneous tuberculosis (the tuberculous chancre) is the exogenous
  primary-inoculation form, defined by inoculation into a tuberculin-naive host
  and the formation of a cutaneous primary complex (chancre plus regional
  lymphadenopathy, the skin analogue of the Ghon complex). This is a different
  clinical entity from the reactivation/endogenous cutaneous tuberculoses that
  share the MONDO:0021948 cutaneous tuberculosis parent - lupus vulgaris and
  tuberculosis verrucosa cutis arise in already-sensitized hosts with moderate
  to high anti-mycobacterial immunity and are paucibacillary, whereas the
  chancre is multibacillary and sensitization-naive. Those siblings are curated
  (or stubbed) separately; a future cutaneous-tuberculosis Grouping would unite
  them.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The tubercle bacillus, inoculated directly into skin. M. bovis and BCG are
    less common causes of the same primary-inoculation picture but are not bound
    here as separate agents.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Exogenous inoculation of Mtb may originate tuberculous chancre and tuberculosis verrucosa cutis."
    explanation: Identifies M. tuberculosis inoculated exogenously as the cause of the tuberculous chancre.
transmission:
- name: Direct Cutaneous Inoculation
  description: >-
    Percutaneous inoculation of bacilli through broken skin after local trauma,
    including surgical procedures with unsterilized instruments, needlestick
    injuries in health-care and autopsy workers, and tattooing or piercing.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tuberculous chancre develops by direct Mtb inoculation in the skin after a local trauma, often unnoticed by the patient."
    explanation: Establishes direct cutaneous inoculation after local trauma as the route of infection.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "There are reports of injuries developing after surgical procedures performed with unsterilized materials, and even after tattoos."
    explanation: Documents specific inoculation routes (unsterile procedures, tattooing).
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Cutaneous tuberculosis overall comprises roughly 1-1.5% of extrapulmonary
    tuberculosis; the primary-inoculation chancre is among the rarest cutaneous
    forms, reported as individual cases and small series.
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cutaneous tuberculosis is a relatively uncommon, comprising 1-1.5% of all extrapulmonary tuberculosis manifestations"
    explanation: Gives the rarity of cutaneous tuberculosis overall; the chancre is a rare subset, so this bounds the entity indirectly.
progression:
- phase: Inoculation and chancre formation
  age_range: 2 to 4 weeks after inoculation
  notes: A firm painless papule or nodule appears at the inoculation site and may ulcerate.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After 2 to 4 weeks, a firm, painless, reddish-brown, slowgrowing papule or nodule arises, which may develop into an ulcer."
    explanation: Defines the first phase and its timing.
- phase: Regional lymphatic spread
  age_range: 3 to 8 weeks after onset of the chancre
  notes: Bacilli drain to the regional nodes, producing lymphadenopathy and completing the cutaneous primary complex.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After 3 to 8 weeks from the onset of TB chancre, there is often bacilli dissemination through the lymph and lymph nodes, analogous to what happens in the lungs with Gohn's complex."
    explanation: Defines the lymphatic-spread phase and its timing.
- phase: Healing with scarring
  age_range: 3 to 12 months
  notes: >-
    The lesion heals with atrophic scarring over months; untreated disease can
    occasionally progress to lupus vulgaris, scrofuloderma, or dissemination.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "healing may occur between three and 12 months, leaving atrophic scarring and calcification in regional lymph nodes."
    explanation: Defines the healing phase and its timing.
pathophysiology:
- name: Traumatic Inoculation into Non-Sensitized Skin
  role: trigger
  biological_scale: TISSUE
  description: >-
    Local trauma breaches the skin barrier and introduces M. tuberculosis into
    the dermis of a host with no prior TB sensitization. The absence of
    pre-existing immunity is the defining host condition of the chancre.
  biological_processes:
  - preferred_term: response to wounding
    modifier: INCREASED
    term:
      id: GO:0009611
      label: response to wounding
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Unchecked Multibacillary Dermal Proliferation
    description: Inoculated bacilli multiply locally in the non-immune dermis.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "it develops in individuals not previously sensitized to the mycobacterium, occurring most often in children in endemic areas of low vaccination coverage."
    explanation: Establishes the tuberculin-naive host as the defining condition for the chancre.
- name: Unchecked Multibacillary Dermal Proliferation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    With no adaptive immunity to contain them, inoculated bacilli are taken up
    by dermal macrophages and neutrophils and multiply locally as a
    multibacillary lesion (numerous acid-fast bacilli on early histology),
    producing a firm, painless papule or nodule about two to four weeks after
    inoculation.
  biological_processes:
  - preferred_term: phagocytosis
    modifier: INCREASED
    term:
      id: GO:0006909
      label: phagocytosis
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Caseating Granulomatous Response
    description: Developing cell-mediated immunity organizes the infiltrate into granulomas.
  - target: Lymphatic Spread Forming the Cutaneous Primary Complex
    description: Bacilli drain to the regional nodes.
  - target: Cutaneous papule or nodule
    description: Local proliferation produces the initial inoculation lesion.
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "in recent lesions there is the presence of necrotizing neutrophilic infiltrate with numerous AFB. At a later stage there is organization of granulomas"
    explanation: Documents the early multibacillary neutrophilic lesion (numerous AFB) that later organizes into granulomas, specifically for primary cutaneous tuberculosis.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After 2 to 4 weeks, a firm, painless, reddish-brown, slowgrowing papule or nodule arises, which may develop into an ulcer."
    explanation: Gives the incubation and the painless papule/nodule that is the clinical correlate of local proliferation.
- name: Caseating Granulomatous Response
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  description: >-
    As delayed-type hypersensitivity develops, the Th1 response drives macrophage
    differentiation into epithelioid and multinucleated (Langhans-type) giant
    cells that organize into granulomas with central caseous necrosis - the
    histopathologic hallmark that confirms the diagnosis. This is the
    disorder-specific instance of the conserved granuloma_formation central
    effector, with M. tuberculosis as the persistent stimulus.
  biological_processes:
  - preferred_term: syncytium formation by cell-cell fusion
    modifier: INCREASED
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
  - preferred_term: chronic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0002544
      label: chronic inflammatory response
  cell_types:
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  downstream:
  - target: Caseous Necrosis and Cutaneous Ulceration
    description: Central caseation breaks down the overlying skin.
  evidence:
  - reference: PMID:35853774
    reference_title: "Cutaneous tuberculosis chancre: case description in a child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A wedge biopsy of the larger lesion was performed, which showed a granulomatous inflammatory process with areas of caseous necrosis, lymphohistiocytic inflammatory infiltrate, and Langerhans-type giant cells, favoring the diagnosis of tuberculosis."
    explanation: A biopsy of a tuberculous chancre showing a caseating granuloma with Langhans giant cells - the central granulomatous effector in this disease.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The chronic presence of these interleukins stimulating macrophages will ultimately cause their differentiation into epithelioid and giant cells that will organized themselves, to greater or lesser extent, into granulomas according to individual host factors."
    explanation: Describes the macrophage-to-epithelioid/giant-cell transformation that assembles the granuloma, the conserved central effector.
- name: Lymphatic Spread Forming the Cutaneous Primary Complex
  role: effector
  biological_scale: ORGANISM
  description: >-
    Within weeks of the chancre, bacilli drain through the lymphatics to the
    regional lymph nodes, producing regional lymphadenopathy. The chancre plus
    the enlarged draining nodes constitute the cutaneous primary complex, the
    skin equivalent of the Ghon complex of primary pulmonary tuberculosis.
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  downstream:
  - target: Regional lymphadenopathy
    description: Lymphatic drainage of bacilli enlarges the regional nodes.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After 3 to 8 weeks from the onset of TB chancre, there is often bacilli dissemination through the lymph and lymph nodes, analogous to what happens in the lungs with Gohn's complex."
    explanation: Establishes lymphatic spread to regional nodes forming a primary complex analogous to the Ghon complex.
  - reference: PMID:35853774
    reference_title: "Cutaneous tuberculosis chancre: case description in a child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cutaneous tuberculosis chancre constitutes a rare form of CTB and is equivalent to the primary pulmonary complex."
    explanation: States that the chancre with its regional nodes is equivalent to the primary pulmonary (Ghon) complex.
- name: Caseous Necrosis and Cutaneous Ulceration
  role: consequence
  biological_scale: TISSUE
  description: >-
    Central caseous necrosis within the granulomatous lesion breaks down the
    overlying epidermis to produce a friable, painless ulcer. Over three to
    twelve months the lesion tends to heal with atrophic scarring; untreated, it
    can occasionally progress to lupus vulgaris, scrofuloderma, or miliary
    dissemination.
  biological_processes:
  - preferred_term: chronic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0002544
      label: chronic inflammatory response
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Painless cutaneous ulcer
    description: Caseation erodes the overlying skin into an ulcer.
  - target: Cutaneous scarring
    description: Healing leaves atrophic scarring.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "healing may occur between three and 12 months, leaving atrophic scarring and calcification in regional lymph nodes."
    explanation: Describes the ulcer healing with atrophic scarring, the outcome of this node.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "if anti-tuberculous medications are not implemented, there is potential risk of developing complications such as lupus vulgaris, scrofuloderma or dissemination (acute miliary TB)."
    explanation: Documents progression to other cutaneous tuberculoses or dissemination when untreated.

name: Encephalopathy Due To Defective Mitochondrial And Peroxisomal Fission 2
creation_date: "2026-09-16T21:55:00Z"
description: >
  EMPF2 is an autosomal recessive neurodevelopmental and neurodegenerative
  disorder caused by biallelic loss-of-function variants in MFF, which encodes
  mitochondrial fission factor. MFF is the outer-membrane receptor that recruits
  the dynamin-related GTPase DRP1 from the cytosol to execute organelle scission.
  Because DRP1 divides peroxisomes as well as mitochondria, and MFF serves both,
  a single adaptor defect elongates both organelles together - which is what
  distinguishes this group of disorders from the classical mitochondrial and
  peroxisomal diseases, where a metabolic function is lost rather than a division
  machine.
  Onset is in the first year of life with developmental delay and regression,
  acquired microcephaly, spasticity and hyperreflexia, seizures that are often
  infantile spasms with hypsarrhythmia, optic atrophy and peripheral neuropathy.
  Brain MRI shows a Leigh-like pattern of bilateral basal ganglia change, yet
  respiratory chain enzyme activities in skeletal muscle are typically normal.
  That dissociation - Leigh-like imaging with a normal respiratory chain - is the
  diagnostic signature, and it follows directly from the mechanism: the lesion is
  in organelle division, not in oxidative phosphorylation.
  There is no disease-specific therapy. The strongest mechanistic lead is mouse
  genetics: deleting the fusion gene Mfn1 completely rescues the Mff-null
  phenotype, which makes fission/fusion rebalancing rather than fission
  restoration the rational target.

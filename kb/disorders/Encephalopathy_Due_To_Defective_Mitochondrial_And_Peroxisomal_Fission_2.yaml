animal_models:
- name: Mff knockout mouse
  species: Mouse
  genotype: Mff homozygous null
  publication: PMID:26598616
  description: >-
    The germline Mff-null mouse. It is the source of the strongest therapeutic
    lead in this disease and simultaneously the clearest example of a model whose
    phenotype is in the wrong organ.
  modeled_mechanisms:
  - target: Failure of DRP1-Mediated Organelle Scission
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the fission defect and its cellular consequences - reduced
      mitochondrial density, reduced respiratory chain activity and increased
      mitophagy.
    evidence:
    - reference: PMID:26598616
      reference_title: "Titration of mitochondrial fusion rescues Mff-deficient cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant tissue showed reduced mitochondrial density and respiratory chain
        activity along with increased mitophagy.
      explanation: >-
        The cellular phenotype of the null mouse, matching the fission defect this
        node describes.
  - target: Regional Neuronal Dysfunction and Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse dies at 13 weeks of severe dilated cardiomyopathy and heart failure.
      It does not develop the Leigh-like encephalopathy, optic atrophy or peripheral
      neuropathy that define the human disease.
    limitations: >-
      The lethal phenotype is cardiac, not neurological, so the model has no face
      validity for the human encephalopathy and cannot be used to test a neurological
      endpoint. The paper itself reports that the precise balance point of fusion and
      fission is cell-type specific, which is the likely reason: mouse cardiomyocytes
      and human neurons sit at different points on that balance. Human EMPF2 patients
      are not reported with dilated cardiomyopathy.
    evidence:
    - reference: PMID:26598616
      reference_title: "Titration of mitochondrial fusion rescues Mff-deficient cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mff mutant mice die at 13 wk as a result of severe dilated cardiomyopathy
        leading to heart failure.
      explanation: >-
        Establishes that the lethal phenotype is cardiac, which is what makes this a
        FAILS_TO_RECAPITULATE link against the neurological node.
    - reference: PMID:26598616
      reference_title: "Titration of mitochondrial fusion rescues Mff-deficient cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Examination of liver, testis, and cerebellum suggest, however, that the
        precise balance point of fusion and fission is cell type specific.
      explanation: >-
        The authors' own cell-type-specificity caveat, which is the mechanistic
        reason the cardiac phenotype does not generalize.
  - target: Failure of DRP1-Mediated Organelle Scission
    relationship: RESCUES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Deleting the fusion gene Mfn1 completely rescues heart dysfunction, lifespan
      and respiratory chain function in the Mff-null mouse. The therapeutic target
      this identifies is rebalancing fission against fusion, not restoring fission.
    limitations: >-
      The rescue is genetic, not pharmacological, and is demonstrated in heart. No
      equivalent has been attempted in a neuronal model, so the lead is a hypothesis
      for the human disease rather than a preclinical result in it.
    readouts:
    - name: Lifespan and respiratory chain function after concomitant Mfn1 deletion
      target: Failure of DRP1-Mediated Organelle Scission
      direction: RESTORED
      interpretation: >-
        Full restoration of the organ-level phenotype by moving the fission/fusion
        balance rather than by repairing fission.
      evidence:
      - reference: PMID:26598616
        reference_title: "Titration of mitochondrial fusion rescues Mff-deficient cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Remarkably, concomitant deletion of the mitochondrial fusion gene Mfn1
          completely rescued heart dysfunction, life span, and respiratory chain
          function.
        explanation: >-
          Reports the rescue and the three endpoints it restored.
    evidence:
    - reference: PMID:26598616
      reference_title: "Titration of mitochondrial fusion rescues Mff-deficient cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results show for the first time that retuning the balance of
        mitochondrial fusion and fission can restore tissue integrity and
        mitochondrial physiology at the whole-organ level.
      explanation: >-
        The authors' statement of what the rescue establishes, which is the basis for
        treating fission/fusion rebalancing as the therapeutic direction.
- name: MFF frameshift Bullmastiff
  species: Dog
  genotype: "MFF c.471_475delinsCGCTCT, p.(Glu158Alafs*14), homozygous"
  publication: PMID:36085405
  description: >-
    A naturally occurring canine disease, described as familial cerebellar ataxia
    with hydrocephalus in Bullmastiffs almost 40 years before its cause was found.
    Whole-genome sequencing identified a private homozygous MFF frameshift variant
    truncating 55% of the open reading frame, and genotyping showed perfect
    segregation across four affected and 70 unaffected dogs. The authors propose
    renaming the canine disease mitochondrial fission encephalopathy by analogy
    with the human phenotype.
  modeled_mechanisms:
  - target: Regional Neuronal Dysfunction and Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Juvenile-onset progressive neurological disease with bilateral symmetrical
      focal brain lesions on MRI - the same kind of finding as the human Leigh-like
      pattern, and the closest organism-level match to the human encephalopathy that
      any model provides.
    limitations: >-
      The lesions localise to the cerebellar nuclei rather than to the basal ganglia
      and subthalamic nuclei affected in human patients, and the canine phenotype
      includes hydrocephalus, which is not part of the human disease. Onset at around
      6 months is juvenile rather than first-year-of-life. No peroxisomal biochemistry
      or neuropathology has been reported in the dogs.
    evidence:
    - reference: PMID:36085405
      reference_title: "Mitochondrial fission factor (MFF) frameshift variant in Bullmastiffs with mitochondrial fission encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Magnetic resonance imaging of the brain showed intra-axial bilateral
        symmetrical focal lesions localised to the cerebellar nuclei.
      explanation: >-
        The imaging phenotype, including the regional difference from the human
        pattern that the limitations record.
    - reference: PMID:36085405
      reference_title: "Mitochondrial fission factor (MFF) frameshift variant in Bullmastiffs with mitochondrial fission encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Genotypes in a cohort of four affected and 70 unaffected Bullmastiffs showed
        perfect segregation with the disease phenotype.
      explanation: >-
        Establishes causality of the canine variant, which is what makes this a model
        of MFF deficiency rather than a coincidental phenotype.
discussions:
- discussion_id: mouse_phenotype_is_cardiac
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Regional Neuronal Dysfunction and Loss
  prompt: >-
    Does the Mfn1 rescue of the Mff-null mouse, demonstrated in heart, translate to
    the neuronal pathology that defines the human disease?
  rationale: >-
    Evidence in the model exists and is strong - complete rescue of lifespan, heart
    function and respiratory chain activity - but its translational validity for
    EMPF2 is the open question, which is what distinguishes this from a plain
    knowledge gap. The mouse dies of dilated cardiomyopathy, a phenotype human EMPF2
    patients are not reported to have, while the human disease is an encephalopathy
    the mouse does not develop. The paper's own finding that the fission/fusion
    balance point is cell-type specific is the reason to doubt that a cardiac rescue
    predicts a neuronal one. Testing fusion knockdown in MFF-deficient iPSC-derived
    neurons would resolve it, and until that is done the rebalancing strategy is a
    hypothesis about this disease rather than a preclinical result in it.
- discussion_id: organelle_to_region_step_unmeasured
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Regional Neuronal Dysfunction and Loss
  prompt: >-
    Why does a ubiquitously expressed organelle-division defect injure the basal
    ganglia and subthalamic nuclei specifically?
  rationale: >-
    MFF is expressed everywhere and both organelles are elongated in fibroblasts,
    yet the disease is regionally selective in the brain. The entry marks the edge
    into this node as INDIRECT_UNKNOWN_INTERMEDIATES because no intermediate is
    established: there is no published neuropathology from a human MFF patient, and
    the two candidate mechanisms - calcium/ROS injury from the dopaminergic-neuron
    model, and the peroxisomal import defect - have been shown in cells but never
    localised to the affected nuclei. The canine model offers bilateral symmetrical
    lesions in a different region again, which deepens rather than resolves the
    question.
notes: >-
  Scope: one disease entry. EMPF1 (DNM1L) is a separate disease one step downstream
  in the same pathway and is not folded in here; if it is curated, the two are
  candidates for a shared fission-defect grouping rather than a merge.

  Two evidence weaknesses are flagged in place rather than hidden. The optic atrophy
  and peripheral neuropathy phenotypes are named in PMID:26783368's title but not in
  its abstract, and only the abstract is cached, so their snippets establish the
  source rather than the finding; both carry an explanation saying so and the
  neuropathy entry carries a `review_notes` asking for re-verification against full
  text. Secondary microcephaly is retained with no evidence at all and a
  `review_notes` recording which cached bodies were searched and with what terms.
  Curating those three as if they were well evidenced would have been the easier
  and worse option.

  Not curated: the AMPK-MFF-DRP1 signalling axis (PMID:30948787, PMID:36374514).
  It is real MFF biology and explains how fission is regulated by energy stress, but
  no reported EMPF2 variant acts through it and nothing links it to the disease
  phenotype.

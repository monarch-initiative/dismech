pathophysiology:
- name: MFF Loss of Function
  biological_scale: MOLECULAR
  description: >-
    MFF is an outer-membrane protein that recruits DRP1 to the sites where
    mitochondria and peroxisomes will divide. It does not do this as a monomer:
    MFF is a dynamic oligomer, most likely a trimer, associating and dissociating
    through its C-terminal coiled coil, and that oligomerization is required for
    DRP1 activation. Actin filaments do not bind MFF but lower the effective MFF
    concentration roughly tenfold, so the same machinery is assembled more
    efficiently at the cytoskeleton. Disease alleles are truncating - the canine
    variant removes 55% of the open reading frame - so the receptor is absent
    rather than misregulated.
  genetic_context:
    gene:
      preferred_term: MFF
      term:
        id: hgnc:24858
        label: MFF
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: DRP1 recruitment and activation at the organelle membrane
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005096
      label: GTPase activator activity
  downstream:
  - target: Failure of DRP1-Mediated Organelle Scission
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34347505
    reference_title: "Mff oligomerization is required for Drp1 activation and synergy with actin filaments during mitochondrial division."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that Mff is an oligomer (most likely a trimer) that dynamically
      associates and disassociates through its C-terminal coiled coil, with a Kd in
      the range of 10 µM. Dynamic Mff oligomerization is required for Drp1
      activation.
    explanation: >-
      Establishes the oligomeric requirement this node describes, with the measured
      dissociation constant.
  - reference: PMID:34347505
    reference_title: "Mff oligomerization is required for Drp1 activation and synergy with actin filaments during mitochondrial division."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While not binding Mff directly, actin filaments enhance Mff-mediated Drp1
      activation by lowering the effective Mff concentration 10-fold.
    explanation: >-
      Supports the actin contribution, and specifically that it is indirect.
- name: Failure of DRP1-Mediated Organelle Scission
  biological_scale: CELLULAR
  description: >-
    Without its receptor, DRP1 is not recruited, and neither organelle divides.
    Both become hyper-elongated in patient fibroblasts. This is the node that makes
    the disease a fission disorder rather than a metabolic one: the shared
    machinery means a single lesion produces a simultaneous mitochondrial and
    peroxisomal phenotype, which no single-organelle metabolic defect does.
  biological_processes:
  - preferred_term: mitochondrial fission
    modifier: DECREASED
    term:
      id: GO:0000266
      label: mitochondrial fission
  - preferred_term: peroxisome fission
    modifier: DECREASED
    term:
      id: GO:0016559
      label: peroxisome fission
  downstream:
  - target: Impaired Peroxisome Maturation and Redox Imbalance
    causal_link_type: DIRECT
  - target: Mitochondrial Calcium Overload and Oxidative Stress in Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Regional Neuronal Dysfunction and Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32224193
    reference_title: "Mitochondrial fission factor (MFF) is a critical regulator of peroxisome maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Peroxisomes (and mitochondria) in patient fibroblasts are highly elongated as
      a result of impaired organelle division.
    explanation: >-
      Documents the simultaneous elongation of both organelles in patient cells,
      which is the defining cellular phenotype.
  - reference: PMID:26783368
    reference_title: "Disturbed mitochondrial and peroxisomal dynamics due to loss of MFF causes Leigh-like encephalopathy, optic atrophy and peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Components of the fission machinery are partly shared between mitochondria
      and peroxisomes, and inherited defects in two such components
      (dynamin-related protein (DRP1) and ganglioside-induced
      differentiation-associated protein 1 (GDAP1)) have been associated with human
      disease.
    explanation: >-
      States the shared-machinery premise on which the dual-organelle claim rests,
      and names the two sibling disease genes.
- name: Impaired Peroxisome Maturation and Redox Imbalance
  biological_scale: CELLULAR
  description: >-
    The peroxisomal consequence is not what a peroxisomal disorder usually means.
    Overall peroxisomal biochemical function is preserved; what is lost is the
    compartment's import competence, so pre-peroxisomal membrane structures
    accumulate, and the intra-peroxisomal redox state and pH shift. Pexophagy is
    intact - the elongated peroxisomes are still cleared. This is a plasticity
    defect rather than an enzyme deficiency, and it is why a conventional
    peroxisomal biochemical screen would look normal.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  - preferred_term: peroxisomal redox homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  evidence:
  - reference: PMID:32224193
    reference_title: "Mitochondrial fission factor (MFF) is a critical regulator of peroxisome maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that MFF deficiency does not cause alterations to overall
      peroxisomal biochemical function. However, loss of MFF results in reduced
      import-competency of the peroxisomal compartment and leads to the
      accumulation of pre-peroxisomal membrane structures.
    explanation: >-
      Both halves of this node's claim: normal bulk biochemistry, lost import
      competence.
  - reference: PMID:32224193
    reference_title: "Mitochondrial fission factor (MFF) is a critical regulator of peroxisome maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that peroxisomes in MFF-deficient cells display alterations in
      peroxisomal redox state and intra-peroxisomal pH. Removal of elongated
      peroxisomes through induction of autophagic processes is not impaired.
    explanation: >-
      Supports the redox and pH shift, and the specific negative result that
      pexophagy is intact.
- name: Mitochondrial Calcium Overload and Oxidative Stress in Neurons
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In dopaminergic neurons differentiated from dental pulp stem cells, MFF
    silencing does more than elongate mitochondria. It accelerates calcium influx
    from the endoplasmic reticulum through the IP3 receptor, and MFF
    co-immunoprecipitates with VDAC1, a component of the ER-mitochondrial calcium
    transport system - suggesting MFF normally restrains that flux. The resulting
    mitochondrial calcium overload drives excessive reactive oxygen species and
    downregulates PGC-1alpha, so mitochondrial biogenesis falls as well. Neurite
    outgrowth is impaired. This is the best available cellular model of the
    neuronal phenotype, and it identifies ROS and biogenesis as separable
    downstream targets.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: mitochondrial calcium ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0051560
      label: mitochondrial calcium ion homeostasis
  - preferred_term: reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  downstream:
  - target: Regional Neuronal Dysfunction and Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35883852
    reference_title: "Mitochondrial Calcium-Triggered Oxidative Stress and Developmental Defects in Dopaminergic Neurons Differentiated from Deciduous Teeth-Derived Dental Pulp Stem Cells with MFF Insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MFF silencing also caused mitochondrial Ca2+ accumulation through accelerated
      Ca2+ influx from the endoplasmic reticulum (ER) via the inositol
      1,4,5-trisphosphate receptor. Mitochondrial Ca2+ overload led DNs to produce
      excessive reactive oxygen species (ROS), and downregulated peroxisome
      proliferator-activated receptor-gamma co-activator-1 alpha (PGC-1α).
    explanation: >-
      The measured calcium, ROS and PGC-1alpha chain this node describes.
  - reference: PMID:35883852
    reference_title: "Mitochondrial Calcium-Triggered Oxidative Stress and Developmental Defects in Dopaminergic Neurons Differentiated from Deciduous Teeth-Derived Dental Pulp Stem Cells with MFF Insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MFF was co-immunoprecipitated with voltage-dependent anion channel 1, an
      essential component of the ER-mitochondrial Ca2+ transport system.
    explanation: >-
      The physical interaction that makes the calcium effect plausibly direct rather
      than a consequence of elongation alone.

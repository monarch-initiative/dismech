  variant_origin: GERMLINE
  notes: >-
    Reported human alleles are truncating, for example homozygous c.433C>T
    (p.Arg145Ter). Most reported missense MFF variants remain of uncertain
    significance because no functional assay has been applied to them; the
    complementation readouts that would classify them - mitochondrial and
    peroxisomal morphology, DRP1 recruitment - already exist in the literature but
    have not been used for that purpose.

diagnosis:
- name: Molecular Diagnosis of EMPF2
  description: >-
    The diagnosis is genetic: biallelic MFF variants on exome or a mitochondrial
    gene panel. The finding that should prompt it is the dissociation between
    imaging and biochemistry - a Leigh-like MRI pattern with bilateral basal
    ganglia change, together with normal respiratory chain enzyme activities in
    muscle. A supportive cellular test exists and was used in one reported case:
    imaging mitochondrial morphology in a patient lymphoblastoid line shows the
    elongation directly.
  notes: >-
    Differential diagnosis: EMPF1 (DNM1L/DRP1), which disrupts the same pathway one
    step downstream and is the principal differential; GDAP1-related disease, the
    third fission-machinery gene; and classical Leigh syndrome, which the imaging
    resembles but which has a demonstrable respiratory chain defect.
  evidence:
  - reference: PMID:32181496
    reference_title: "Encephalopathy due to defective mitochondrial and peroxisomal fission 2 caused by a novel MFF gene mutation in a young child."

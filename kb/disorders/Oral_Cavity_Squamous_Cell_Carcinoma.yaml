treatments:
- name: Surgical Resection
  description: >-
    Wide local excision with neck dissection is the primary treatment for most
    resectable oral cavity SCC; adequate margins and management of cervical nodes
    are central to outcome.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Adjuvant Radiation Therapy
  description: >-
    Postoperative radiotherapy is used for adverse pathologic features such as
    positive margins, extranodal extension, or multiple involved nodes.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Concurrent Cisplatin Chemoradiation
  description: >-
    Cisplatin-based chemoradiation is used adjuvantly for high-risk features
    (positive margins, extranodal extension) and for selected unresectable disease.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
- name: Cetuximab
  description: >-
    The anti-EGFR monoclonal antibody cetuximab is used in combination with
    radiation or chemotherapy in recurrent/metastatic disease and as a platinum
    alternative.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cetuximab
      term:
        id: NCIT:C1723
        label: Cetuximab
- name: Immune Checkpoint Inhibitor Therapy
  description: >-
    PD-1 inhibitors (pembrolizumab, nivolumab) are approved for recurrent or
    metastatic head and neck SCC, including oral cavity primaries, as monotherapy
    or with chemotherapy.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Adaptive Immune Resistance
    treatment_effect: INHIBITS
    description: >-
      PD-1 blockade disrupts the PD-1/PD-L1 interaction underlying adaptive
      immune resistance, restoring T-cell-mediated anti-tumor immunity in
      recurrent/metastatic disease.
- name: Metformin (mTOR-Targeted Chemoprevention)
  description: >-
    Metformin is under investigation as a chemopreventive ("interception") agent
    for oral premalignant lesions (leukoplakia, erythroplakia, oral epithelial
    dysplasia) — the field-cancerization precursors of oral cavity SCC — in
    otherwise healthy, non-diabetic high-risk individuals. By activating AMPK and
    indirectly suppressing PI3K/AKT/mTOR signaling in the dysplastic basal
    epithelium, it aims to reverse dysplasia before invasive transformation. In a
    single-arm phase IIa trial, 12 weeks of metformin produced histological
    improvement in 60% of oral premalignant lesions (17% complete responses), and
    response correlated with reduced lesional mTOR activity (pS6). This is a
    prevention-setting repurposing distinct from metformin's antidiabetic use.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemoprevention
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: PI3K-AKT-mTOR Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Metformin activates AMPK and thereby suppresses PI3K/AKT/mTOR signaling; in
      oral premalignant lesions, decreased mTOR activity (pS6 staining) in the
      basal epithelial layer correlated with histological and clinical response,
      linking the chemopreventive effect to this pathway node.
    evidence:
    - reference: PMID:34255745
      reference_title: "Inhibition of mTOR signaling and clinical activity of metformin in oral premalignant lesions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Remarkably, a significant correlation existed between decreased mTOR activity (pS6 IHC staining) in the basal epithelial layers of OPLs and the histological (P = 0.04) and clinical (P = 0.01) responses."
      explanation: >-
        Ties metformin's chemopreventive effect on oral premalignant lesions to
        reduced mTOR pathway activity, supporting the INHIBITS edge on the
        PI3K-AKT-mTOR node.
  - target: Field Cancerization and Premalignant Progression
    treatment_effect: INHIBITS
    description: >-
      By reversing dysplasia in oral premalignant lesions, metformin acts at the
      earliest, precancer stage of the field-cancerization progression toward
      invasive oral SCC.
    evidence:
    - reference: PMID:34255745
      reference_title: "Inhibition of mTOR signaling and clinical activity of metformin in oral premalignant lesions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the histological response rate (improvement in histological grade) was 60%, including 17% complete responses and 43% partial responses"
      explanation: >-
        Documents histological regression of oral premalignant lesions under
        metformin, supporting interception at the premalignant-progression node.
  evidence:
  - reference: PMID:34255745
    reference_title: "Inhibition of mTOR signaling and clinical activity of metformin in oral premalignant lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we conducted a single-arm, open-label phase IIa clinical trial in individuals with oral premalignant lesions (OPLs) to explore the potential of metformin to target PI3K/mTOR signaling for HNSCC prevention."
    explanation: >-
      Establishes metformin as an investigational mTOR-targeted chemopreventive
      agent for oral premalignant lesions and HNSCC prevention.
datasets:
- accession: geo:GSE179730
  title: Response and recurrence correlates in patients treated with neoadjuvant anti-PD-1 therapy for resectable oral-cavity squamous cell carcinoma
  description: Neoadjuvant PD-1 blockade may be efficacious in patients with high-risk, resectable oral-cavity, head-and-neck cancer. To explore correlates of response patterns to neoadjuvant nivolumab treatment and post-surgical recurrences, we analyzed longitudinal tumor and blood samples in a cohort of 12 patients displaying 33% responsiveness. Pretreatment tumor-based detection of FLT4 mutations and PTEN signature enrichment favors response, and high tumor mutational burden improves recurrence-free survival. In contrast, preexisting and/or acquired mutations (in CDKN2A, YAP1, JAK2) correlate with innate resistance and/or tumor recurrence.

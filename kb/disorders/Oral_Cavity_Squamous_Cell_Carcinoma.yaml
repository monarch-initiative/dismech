- accession: geo:GSE234379
  title: DNA methylation profile in matched oral cavity squamous cell carcinoma and normal adjacent tissue samples
  description: Oral cavity squamous cell carcinoma (OSCC) is a complex and dynamic disease characterized by clinicopathological and molecular heterogeneity. Spatial and temporal heterogeneity of cell subpopulations has been associated with cancer progression and implicated in the prognosis and therapy response. Emerging evidence indicates that aberrant epigenetic profiles in OSCC may foster an immunosuppressive tumor microenvironment by modulating the expression of immune-related long non-coding RNAs (lncRNAs). DNA methylation analysis was performed in 46 matched OSCC and normal adjacent tissue samples using a genome-wide platform (Infinium HumanMethylation450 BeadChip).

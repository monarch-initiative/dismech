- accession: geo:GSE28217
  title: NID2 and HOXA9 promoter hypermethylation as biomarkers to prevent and detect Oral Cavity Squamous Cell Carcinoma
  description: Differentially methylated oral squamous cell carcinoma (OSCC) biomarkers, identified in-vitro and validated in well-characterized surgical specimens, have shown poor clinical correlation in cohorts with different risk profiles. To overcome this lack of relevance we used the HumanMethylation27 BeadChip, publicly available methylation and expression array data, and Quantitative Methylation Specific PCR to uncover differential methylation in OSCC clinical samples with heterogeneous risk profiles.

      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. The causal variant segregated with disease across a large
    multigenerational family, and a sporadic case consistent with a de novo event
    has been reported. Adermatoglyphia appears fully penetrant in reported families;
    expressivity of the extracutaneous features varies.
  evidence:
  - reference: PMID:34909722
    reference_title: Two SMARCAD1 Variants Causing Basan Syndrome in a Canadian and a Dutch Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Basan syndrome is an autosomal dominant genodermatosis characterized by congenital adermatoglyphia, transient congenital facial milia, neonatal acral bullae, and absent or reduced sweating."
    explanation: >-
      States autosomal dominant inheritance and the cardinal feature set.
  - reference: PMID:21820097
    reference_title: A mutation in a skin-specific isoform of SMARCAD1 causes autosomal-dominant adermatoglyphia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation segregated with the disease phenotype throughout the entire family."
    explanation: >-
      Co-segregation of the SMARCAD1 variant with disease in a large family,
      consistent with dominant inheritance.
pathophysiology:
- name: SMARCAD1 Skin-Specific Isoform Splice-Donor Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant affecting the skin-specific short isoform of SMARCAD1,
    which begins with an alternative, otherwise-noncoding first exon. In almost all
    reported families the variant is a point mutation in the donor splice site of
    that alternative exon 1; one family instead carries a large structural variant
    (a deletion with nontandem inverted duplication) that removes the first nine
    exons including the skin-isoform exon 1. SMARCAD1 is a SNF2-family chromatin
    remodeller.
  genes:
  - preferred_term: SMARCAD1
    term:
      id: hgnc:18398
      label: SMARCAD1
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
  evidence:
  - reference: PMID:21820097
    reference_title: A mutation in a skin-specific isoform of SMARCAD1 causes autosomal-dominant adermatoglyphia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of all SMARCAD1 coding and noncoding exons revealed a heterozygous transversion predicted to disrupt a conserved donor splice site adjacent to the 3' end of a noncoding exon uniquely present in the skin-specific short isoform of the gene."
    explanation: >-
      Identifies the founding variant as a donor-splice-site change in the
      noncoding exon unique to the skin-specific isoform.
  - reference: PMID:21820097
    reference_title: A mutation in a skin-specific isoform of SMARCAD1 causes autosomal-dominant adermatoglyphia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the genes located in this interval is SMARCAD1, a member of the SNF subfamily of the helicase protein superfamily."
    explanation: >-
      Grounds SMARCAD1 as a SNF2-family helicase / chromatin remodeller.
  - reference: PMID:34909722
    reference_title: Two SMARCAD1 Variants Causing Basan Syndrome in a Canadian and a Dutch Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All reported variants, except for one large deletion, are point mutations within the donor splice site of the alternative exon 1."
    explanation: >-
      Summarises the allelic spectrum as donor-splice-site point mutations plus
      one large deletion.
  downstream:
  - target: Reduced Skin-Specific SMARCAD1 Expression
    causal_link_type: DIRECT
    description: >-
      The splice-donor variant disrupts splicing of the skin-specific transcript.
- name: Reduced Skin-Specific SMARCAD1 Expression
  biological_scale: MOLECULAR
  description: >-
    A minigene assay of the founding variant showed aberrant splicing with reduced
    stability of the short RNA isoform, demonstrated by RT-PCR; the structural
    deletion family shows that one copy of full-length SMARCAD1 suffices, so it is
    the loss of the skin-specific isoform that is pathogenic. Reduced protein level
    is inferred from the RNA-level data.
  evidence:
  - reference: PMID:21820097
    reference_title: A mutation in a skin-specific isoform of SMARCAD1 causes autosomal-dominant adermatoglyphia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a minigene system, we found that this mutation causes aberrant splicing, resulting in decreased stability of the short RNA isoform as predicted by computational analysis and shown by RT-PCR."
    explanation: >-
      Minigene and RT-PCR evidence that the variant destabilises the short,
      skin-specific transcript.
  - reference: PMID:34909722
    reference_title: Two SMARCAD1 Variants Causing Basan Syndrome in a Canadian and a Dutch Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although this variant results in the removal of the first nine exons of SMARCAD1 and exon 1 of the skin-specific isoform, it manifested in the typical Basan phenotype. This suggests that unlike the skin-specific isoform, a single copy of full-length SMARCAD1 is sufficient for its respective function."
    explanation: >-
      The structural-deletion family localises pathogenicity to loss of the
      skin-specific isoform rather than of full-length SMARCAD1.
  downstream:
  - target: Impaired Epidermal Chromatin Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced skin-specific SMARCAD1, a chromatin remodeller, is presumed to impair
      chromatin remodelling in developing epidermis (inferred; the mechanism is
      described as unclear in the primary sources).
- name: Impaired Epidermal Chromatin Remodeling
  biological_scale: CELLULAR
  description: >-
    Loss of the skin-specific SMARCAD1 isoform is presumed to impair ATP-dependent
    chromatin remodelling in developing epidermal keratinocytes. This step is
    inferred: the reviewed sources state that the mechanism linking SMARCAD1 to
    dermatoglyph and ectodermal development is not established.

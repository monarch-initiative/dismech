differential_diagnoses:
- name: Isolated autosomal dominant adermatoglyphia
  description: >-
    Isolated autosomal dominant adermatoglyphia ("immigration delay disease";
    adermatoglyphia with hypohidrosis, OMIM 136000) presents with absence of
    fingerprints as an essentially isolated feature, without the congenital milia
    and neonatal acral bullae of Basan syndrome. It maps to the same skin-specific
    SMARCAD1 donor splice site - the recurrent c.378+1G>T variant was found in both -
    and has been proposed to be the same disorder on a phenotypic spectrum
    ("SMARCAD syndrome"). Whether Basan syndrome and isolated adermatoglyphia are one
    entity or distinct is unsettled; see notes.
  evidence:
  - reference: PMID:20619487
    reference_title: "The immigration delay disease: adermatoglyphia-inherited absence of epidermal ridges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absent fingerprints, or adermatoglyphia, were inherited over 4 generations of her family in an autosomal dominant fashion."
    explanation: >-
      Describes isolated autosomal dominant adermatoglyphia without the
      extracutaneous features of Basan syndrome.
  - reference: PMID:26932190
    reference_title: Genome-wide linkage analysis and whole-genome sequencing identify a recurrent SMARCAD1 variant in a unique Chinese family with Basan syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This indicates that ADG and Basan syndrome may be the phenotypic variants of the same disease."
    explanation: >-
      The shared recurrent variant argues that isolated ADG and Basan syndrome may
      be the same disease.
- name: Huriez syndrome
  description: >-
    Huriez syndrome (OMIM 181600) is an allelic SMARCAD1 skin-isoform disorder with
    scleroatrophy of the hands and feet, hypoplastic nails, palmoplantar keratoderma,
    and predisposition to cutaneous squamous cell carcinoma - features that are not
    part of Basan syndrome. Huriez patients also show adermatoglyphia and
    hypohidrosis, and the same skin-isoform donor splice site is involved, so Huriez
    has been proposed as part of the SMARCAD syndrome spectrum.
  evidence:
  - reference: PMID:35212137
    reference_title: "Huriez syndrome: Additional pathogenic variants supporting allelism to SMARCAD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Huriez syndrome (HRZ, OMIM181600) is a rare genodermatosis characterized by scleroatrophic hands and feet, hypoplastic nails, palmoplantar keratoderma, and predisposition to cutaneous squamous cell carcinoma (cSCC)."
    explanation: >-
      Distinguishing features of Huriez syndrome absent from Basan syndrome.
  - reference: PMID:35212137
    reference_title: "Huriez syndrome: Additional pathogenic variants supporting allelism to SMARCAD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the basis of phenotypic and genotypic convergence with Adermatoglyphia (OMIM136000) and Basan syndrome (OMIM129200), our results lend credence to the notion that these three Mendelian disorders are allelic."
    explanation: >-
      Places Huriez syndrome in the allelic SMARCAD1 skin-isoform spectrum.
notes: >-
  Lump/split: curated as a single-gene leaf DISEASE for Basan syndrome
  (MONDO:0007507). The entity is defined by congenital adermatoglyphia plus the
  extracutaneous ectodermal-dysplasia features (facial milia, neonatal acral bullae,
  reduced sweating). Isolated autosomal dominant adermatoglyphia (OMIM 136000) and
  Huriez syndrome (OMIM 181600) are allelic, map to the same skin-specific SMARCAD1
  donor splice site, and have been proposed to form one "SMARCAD syndrome" spectrum
  (PMID:30289605, PMID:35212137); the recurrent c.378+1G>T variant was found in both
  a Basan family and an isolated-adermatoglyphia family (PMID:26932190). They are kept
  as differential diagnoses here rather than merged or split into subtypes, because
  MONDO retains distinct concepts and the primary sources describe the unification as
  a proposal rather than settled nosology; a reviewer may wish to consider a Grouping
  for the SMARCAD1 skin-isoform spectrum. A 2022 report of cutaneous squamous cell
  carcinoma in a Basan family (PMID:35592705) was retracted (PMID:37387737) and is not
  cited; cSCC risk is a feature of the allelic Huriez syndrome, not of Basan syndrome.

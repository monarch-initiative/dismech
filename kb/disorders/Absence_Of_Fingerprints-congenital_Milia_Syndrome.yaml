name: absence of fingerprints-congenital milia syndrome
category: Mendelian
creation_date: "2026-10-12T15:45:00Z"
description: >-
  Absence of fingerprints-congenital milia syndrome (Basan syndrome) is a rare
  autosomal dominant ectodermal dysplasia. Its cardinal feature is congenital
  adermatoglyphia (absence of finger- and toeprints), accompanied by transient
  congenital facial milia, rapidly healing neonatal acral bullae, and absent or
  reduced sweating. Additional features reported in individual pedigrees include
  nail dystrophy, contractures, and (in one large Chinese family) hyperpigmentation
  and knuckle pads. It has been described in only about ten kindreds worldwide.
  The disorder is caused by heterozygous variants that disrupt a skin-specific
  short isoform of SMARCAD1, a SNF2-family chromatin-remodelling ATPase/helicase.
  The skin isoform starts with an alternative, otherwise-noncoding first exon; all
  reported variants except one large structural deletion are point mutations in the
  donor splice site of that exon, and a minigene assay shows the variant causes
  aberrant splicing and reduced stability of the short transcript. The implication
  is that the skin-specific isoform is required for normal dermatoglyph development;
  the downstream developmental steps linking its deficiency to the ectodermal
  features are not yet established. Basan syndrome, isolated autosomal dominant
  adermatoglyphia, and Huriez syndrome all map to the same skin-isoform donor splice
  site and have been proposed to be allelic ("SMARCAD syndrome").
synonyms:
- Basan syndrome
- SMARCAD syndrome

genetic:
- name: SMARCAD1
  gene_term:
    preferred_term: SMARCAD1
    term:
      id: hgnc:18398
      label: SMARCAD1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous loss-of-function variants disrupting the skin-specific short isoform
    of SMARCAD1, which starts with an alternative first exon. Reported disease alleles
    are point mutations in the donor splice site of that exon (for example
    NM_001254949.1:c.-10+2T>G and the recurrent c.378+1G>T) or, in one family, a large
    complex structural variant (deletion plus nontandem inverted duplication) removing
    the first nine exons. A 12-bp deletion spanning the exon-intron junction of the
    alternative exon 1 was found in a further family. The structural-deletion family
    indicates that loss of the skin-specific isoform, not of full-length SMARCAD1, is
    pathogenic. No ClinGen gene-disease validity record for SMARCAD1 and Basan syndrome
    was found in the local reference cache, so no gene_disease_validity assertion is
    recorded.
  evidence:
  - reference: PMID:21820097
    reference_title: A mutation in a skin-specific isoform of SMARCAD1 causes autosomal-dominant adermatoglyphia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated the existence of a short isoform of SMARCAD1 exclusively expressed in the skin."
    explanation: >-
      Establishes the skin-specific SMARCAD1 isoform that disease variants disrupt.
  - reference: PMID:26932190
    reference_title: Genome-wide linkage analysis and whole-genome sequencing identify a recurrent SMARCAD1 variant in a unique Chinese family with Basan syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WGS in one patient identified a splice variant (c.378+1G>T) in the SMARCAD1 gene (NG_031945.1) that was confirmed by Sanger sequencing."
    explanation: >-
      The recurrent donor-splice-site variant identified by WGS and confirmed by
      segregation in a large Chinese family.
  - reference: PMID:30289605
    reference_title: "Basan gets a new fingerprint: Mutations in the skin-specific isoform of SMARCAD1 cause ectodermal dysplasia syndromes with adermatoglyphia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant and the other five previously reported variants in Basan syndrome and ADG are all within the same donor splice site."
    explanation: >-
      All known Basan/ADG variants cluster in the single skin-isoform donor splice
      site.

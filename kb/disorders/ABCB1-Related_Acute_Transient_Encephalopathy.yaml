inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both reported families carry two inactivating ABCB1 alleles. In the index
    twins each allele segregated from one unaffected heterozygous parent, and
    the unaffected older sister carried neither, which is the pattern expected
    of a recessive trait rather than of a dominant one.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Segregation analysis confirmed that each variant is inherited from each parent and unaffected sister does not carry any of them"
    explanation: >-
      Reports the biparental segregation of the two loss-of-function alleles
      with unaffected carrier parents, which is what the recessive inheritance
      claim rests on.
genetic:
- name: ABCB1
  gene_term:
    preferred_term: ABCB1
    term:
      id: hgnc:40
      label: ABCB1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ABCB1 encodes P-glycoprotein, an ATP-dependent efflux transporter. Both
    reported genotypes are biallelic and inactivating: a nonsense allele with
    a splice-donor allele in the index twins, and two nonsense alleles in the
    ivermectin-exposed boy. No gene-disease validity classification has been
    published for this pair by ClinGen or another external body, so no
    assertion is recorded; the basis for calling it causative is two
    independent families with concordant genotypes plus the functional
    demonstration of lost brain efflux in the index patients. The index twins
    retained roughly a tenth of wild-type transcript rather than none, so the
    human disorder is a severe hypomorphic state rather than a demonstrated
    complete null. That matters for interpreting the episodic course: a
    residual transporter pool is consistent with a threshold being crossed
    only under an added load.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the two variants, one being nonsense (p.Pro1182X) and the other being a splicing regulating variant near exon 23 (c.2786 + 1G>T), were expected to pose damaging effect to protein synthesis"
    explanation: >-
      Names the two ABCB1 alleles in the index family and their predicted
      inactivating consequence, which is the causative claim made here.
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The variants were never seen in gnomAD or 1,020 Korean exome database."
    explanation: >-
      Supports the rarity of the two alleles, which is part of why they were
      accepted as causative rather than incidental.
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "the sisters are likely to express a small portion of wild-type protein (~10%)"
    explanation: >-
      Source of the residual-expression figure in this record's notes, which
      the authors read off amplicon sequencing of the variant transcripts.
  variants:
  - name: p.Pro1182X
    description: >-
      Nonsense allele in the index twin family, inherited from the father.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "the two variants, one being nonsense (p.Pro1182X) and the other being a splicing regulating variant near exon 23 (c.2786 + 1G>T), were expected to pose damaging effect to protein synthesis"
      explanation: Names this allele and its predicted loss-of-function effect.
  - name: c.2786+1G>T
    description: >-
      Splice-donor allele near exon 23 in the index twin family. Amplicon
      sequencing of patient-derived lymphocyte transcripts found the variant
      drove an 11-base-pair deletion, exon skipping and intron retention, all
      frameshifting or truncating.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "RT-PCR of ABCB1 mRNA using primers near the splice variant revealed multiple PCR products indicative of exon skipping or intron retention"
      explanation: >-
        Reports the transcript-level consequence measured in patient-derived
        immortalised B lymphocytes, which is what makes this allele a
        loss-of-function allele rather than a variant of unknown effect.
  - name: p.Arg794Ter
    description: >-
      Nonsense allele in the second reported family, carried in trans with
      p.Ile1018ThrfsTer8 by a boy who developed coma after a therapeutic dose
      of ivermectin.
    clinical_significance: PATHOGENIC
    evidence:

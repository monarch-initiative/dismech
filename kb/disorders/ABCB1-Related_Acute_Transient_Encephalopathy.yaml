name: ABCB1-Related Acute Transient Encephalopathy
creation_date: "2026-10-20T23:40:00Z"
category: Mendelian
description: >
  Acute transient encephalopathy (ENPAT, OMIM 620950) is an autosomal recessive
  disorder caused by biallelic loss-of-function variants in ABCB1, the gene
  encoding P-glycoprotein. P-glycoprotein sits in the luminal membrane of the
  blood-brain-barrier endothelium and effluxes a broad range of xenobiotic and
  endogenous substrates out of the brain. When both ABCB1 alleles are
  inactivated that efflux is lost, and the disorder presents as discrete,
  fully reversible episodes of encephalopathy separated by complete clinical
  normality.

  Two precipitants are documented, in the two families reported so far, and
  they are different in kind. In the index family, monozygotic Korean twin
  sisters with a nonsense and a splice-donor ABCB1 allele had recurrent
  episodes that each began during an acute febrile or afebrile illness, with
  no drug consistently implicated; verapamil positron emission tomography
  showed markedly increased and retained tracer in their brains, and
  Mdr1a/b-null mice cleared brain cytokines more slowly than wild-type
  animals after a lipopolysaccharide challenge, which the authors offered as a
  candidate molecular trigger. In the second family, a 13-year-old boy
  carrying two ABCB1 nonsense alleles developed coma and focal deficits after
  a single prophylactic dose of ivermectin inside the ordinary therapeutic
  range, and recovered fully on supportive care.

  The scope call this entry makes is that the two presentations are one
  disease rather than a disease and a pharmacogenetic trait. The lesion is a
  rare biallelic germline loss of function, not a common transporter
  polymorphism that modifies drug handling; the twins' episodes occurred
  without any drug exposure, so the phenotype does not require a substrate
  drug; and both presentations converge on the same mechanism, loss of
  P-glycoprotein efflux at the blood-brain barrier followed by accumulation of
  a substrate in the brain. The drug precipitant is therefore recorded here as
  an environmental trigger acting on that mechanism, not as the disease
  definition.

  Between episodes there is no constitutive abnormality. Brain magnetic
  resonance imaging, cerebrospinal fluid, electroencephalography and metabolic
  screening were all normal or non-specific in the index twins, who were
  reported as normal in growth and cognition at 14 years, so this entry
  records episodic dysfunction and no structural lesion.

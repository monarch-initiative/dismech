pathophysiology:
- name: Biallelic ABCB1 Loss of Function
  description: >-
    Two inactivating ABCB1 alleles in trans reduce production of functional
    P-glycoprotein. The reported alleles are nonsense, frameshift and
    splice-donor changes, all predicted or shown to truncate the protein
    before the nucleotide-binding domains that ATP-dependent efflux requires.
  biological_scale: MOLECULAR
  genetic_context:
    genes:
    - preferred_term: ABCB1
      term:
        id: hgnc:40
        label: ABCB1
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: P-glycoprotein ATP-dependent xenobiotic efflux
    term:
      id: GO:0008559
      label: ABC-type xenobiotic transporter activity
    modifier: DECREASED
  downstream:
  - target: Loss of P-glycoprotein Efflux at the Blood-Brain Barrier
    causal_link_type: DIRECT
    description: >-
      The transporter the two alleles inactivate is the one that performs
      efflux at the barrier, so loss of the protein is loss of the barrier
      function.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We demonstrate that the variants substantially inhibited the ability to export drugs out of the brains of the patients, causing aberrant homeostasis in brain physiology."
      explanation: >-
        States the step from the variants to lost export out of the brain in
        the patients who carry them, which is this edge.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "we identified biallelic loss of function (LoF) variants of ABCB1 in monozygotic twins presenting with recurrent reversible encephalopathy"
    explanation: >-
      Establishes the biallelic loss-of-function genotype as the lesion in
      affected individuals.
- name: Loss of P-glycoprotein Efflux at the Blood-Brain Barrier
  description: >-
    P-glycoprotein normally occupies the luminal membrane of brain capillary
    endothelium and pumps substrates back into blood. Without it the barrier
    remains structurally intact but loses this active export step, which
    verapamil positron emission tomography measures directly: tracer uptake
    across the whole cortex was markedly increased in the affected twins and
    low in their heterozygous parents and unaffected sister.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: brain capillary endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: xenobiotic efflux across the blood-brain barrier
    term:
      id: GO:1990962
      label: xenobiotic transport across blood-brain barrier
    modifier: DECREASED
  downstream:
  - target: Brain Accumulation of P-glycoprotein Substrates
    causal_link_type: DIRECT
    description: >-
      With the efflux step gone, a substrate that enters the brain is no
      longer returned to the circulation and its brain concentration rises.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "both the twin patients showed significantly increased uptake and retention of"
      explanation: >-
        Reports measured retention of a P-glycoprotein substrate tracer in the
        patients' brains, which is accumulation of a substrate following the
        lost efflux.
  - target: Delayed Clearance of Proinflammatory Cytokines from Brain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same transporter loss also slows removal of endogenous inflammatory
      mediators, shown in Mdr1a/b-null mice rather than in patients.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "This result demonstrates that the absence of Mdr1a/b caused delayed clearance of cytokines in the mouse brains"
      explanation: >-
        States the causal step from absent transporter to delayed brain
        cytokine clearance in the orthologous mouse knockout.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The twin patients showed markedly increased uptake in the whole cortex of the brain, whereas the parents and sister showed low uptake."
    explanation: >-
      Measures the lost efflux in affected brains against heterozygous and
      wild-type relatives in the same family.
  - reference: PMID:36326478
    reference_title: "Canine and feline P-glycoprotein deficiency: What we know and where we need to go."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "P-gp is expressed on the luminal surface of many mammalian tissues including brain capillary endothelial cells, biliary canaliculi, intestines, and renal tubular cells where it functions to actively efflux substrate drugs"
    explanation: >-
      Supports the cell type and membrane face bound on this node, and the
      efflux function assigned to it.
  - reference: PMID:7910522
    reference_title: "Disruption of the mouse mdr1a P-glycoprotein gene leads to a deficiency in the blood-brain barrier and to increased sensitivity to drugs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "we found that the mdr1a P-glycoprotein is the major P-glycoprotein in the blood-brain barrier and that its absence results in elevated drug levels in many tissues (especially in brain) and in decreased drug elimination"
    explanation: >-
      Establishes in the knockout mouse that this transporter is the principal
      barrier efflux pump and that losing it raises brain drug levels.
- name: Systemic Inflammatory Response to Acute Illness
  description: >-
    An intercurrent febrile or afebrile illness raises circulating
    inflammatory signalling. This is the precipitant in the index family,
    whose every episode began during such an illness, and it is modelled here
    as a node rather than as an exposure because the mediators are endogenous.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: systemic inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Delayed Clearance of Proinflammatory Cytokines from Brain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The illness supplies the cytokine load that the missing transporter then
      fails to clear. The step was tested by giving lipopolysaccharide to
      wild-type and Mdr1a/b-null mice, not in patients.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "whereas wild-type brains showed cytokines clearance, mutant brains still harbored some of the cytokine expressions"
      explanation: >-
        Reports that an inflammatory challenge left persisting brain cytokines
        only when the transporter was absent, which is the conjunction this
        edge asserts.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Every clinical episode began during acute illness, including fever, vomiting, and abdominal pain"
    explanation: >-
      Establishes intercurrent acute illness as the precipitant of every
      episode in the index family.
- name: Brain Accumulation of P-glycoprotein Substrates
  description: >-
    A substrate drug or endogenous compound that would normally be held out of
    the brain reaches neurotoxic concentrations there. The documented clinical
    instance is ivermectin at a therapeutic dose; the tracer experiment shows
    the same for verapamil at a microdose.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: xenobiotic transport
    term:
      id: GO:0042908
      label: xenobiotic transport
    modifier: DECREASED
  downstream:
  - target: Potentiation of GABAergic and Glutamate-Gated Chloride Conductance
    causal_link_type: DIRECT
    description: >-
      Once the drug reaches micromolar concentrations in the brain it acts on
      the inhibitory chloride channels that are its pharmacological target.
      This branch is specific to ivermectin and the other macrocyclic
      lactones; it is not the route for an endogenous substrate.
    evidence:
    - reference: PMID:41837342
      reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "micromolar ivermectin concentrations can directly activate or potentiate GABAergic currents"
      explanation: >-
        Reports the concentration-dependent action on vertebrate receptors,
        which is the step from a raised brain concentration to a receptor
        effect.
  evidence:
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Loss of transporter activity resulted in impaired drug extrusion from endothelial cells of the barrier and excessive CNS exposure, explaining the unexpected severity of toxicity despite therapeutic dosing."
    explanation: >-
      Attributes the excessive central nervous system exposure in the
      ABCB1-deficient patient to the lost efflux, which is what this node
      records.
  - reference: PMID:7910522
    reference_title: "Disruption of the mouse mdr1a P-glycoprotein gene leads to a deficiency in the blood-brain barrier and to increased sensitivity to drugs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "they displayed an increased sensitivity to the centrally neurotoxic pesticide ivermectin (100-fold)"
    explanation: >-
      Quantifies, in the knockout mouse, how far susceptibility to a
      P-glycoprotein substrate shifts when barrier efflux is absent.
  - reference: PMID:36326478
    reference_title: "Canine and feline P-glycoprotein deficiency: What we know and where we need to go."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "When treated with a P-gp substrate like ivermectin, these animals experience neurological toxicity at doses more than 10-fold lower than for animals with normal P-gp function."
    explanation: >-
      Supports the same dose shift across the transporter-deficient animals in
      which it has been characterised, including the canine and feline ABCB1
      variants.
- name: Potentiation of GABAergic and Glutamate-Gated Chloride Conductance
  description: >-
    Accumulated ivermectin acts on vertebrate inhibitory chloride channels,
    potentiating or directly activating them and so depressing central nervous
    system function. This is the drug branch's effector step. It is inferred
    in humans from receptor pharmacology and from animal and veterinary
    models rather than measured in a patient, and there is no antagonist that
    reverses it.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: GABA-gated chloride ion channel activity
    term:
      id: GO:0022851
      label: GABA-gated chloride ion channel activity
    modifier: INCREASED
  - preferred_term: glutamate-gated chloride channel activity
    term:
      id: GO:0008068
      label: extracellularly glutamate-gated chloride channel activity
    modifier: INCREASED
  downstream:
  - target: Acute Reversible Neuronal Dysfunction
    causal_link_type: DIRECT
    description: >-
      Sustained inhibitory chloride conductance depresses neuronal function
      and produces the clinical picture, which lifts as the drug is cleared.
    evidence:
    - reference: PMID:41837342
      reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "resulting in prolonged activation of GABAergic and glutamate-gated chloride channels and subsequent neurological toxicity"
      explanation: >-
        States the step from prolonged channel activation to neurological
        toxicity. The sentence it comes from is the review's synthesis across
        knockout models, pharmacological inhibition and naturally occurring
        loss-of-function mutations, which is why it is graded OTHER.
  evidence:
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "there is no approved antagonist capable of reversing ivermectin's potentiation of GABA-gated chloride channels in humans"
    explanation: >-
      Identifies this potentiation as the human-relevant toxic action of the
      drug, and records that nothing reverses it, which is why management is
      supportive.
- name: Delayed Clearance of Proinflammatory Cytokines from Brain
  description: >-
    Inflammatory mediators generated during an intercurrent illness persist in
    brain tissue instead of being cleared. This arm is the proposed trigger for
    the illness-associated episodes and rests on the mouse knockout, where
    brain Il1b, Tnf, Il6 and Ccl2 remained elevated 24 hours after a
    lipopolysaccharide challenge that wild-type brains had resolved. It has not
    been measured in patients.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: clearance of inflammatory mediators across the blood-brain barrier
    term:
      id: GO:0150104
      label: transport across blood-brain barrier
    modifier: DECREASED
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    This node was first bound to GO:0006954 inflammatory response, which names
    the response rather than the failure to clear it, so the binding said
    something the node does not claim. GO:0150104 transport across blood-brain
    barrier, decreased, is the process whose failure the node asserts, and is
    the parent of the GO:1990962 xenobiotic branch bound one node upstream.
    Nothing narrower exists for the mediators themselves: in GO,
    `l~cytokine transport` returns only GO:0010184 cytokinin transport (a plant
    hormone), `l~cytokine catabolic` only GO:0009823 cytokinin catabolic
    process, and `l~cytokine clearance` and `l~interleukin-1 beta transport`
    return nothing.
  downstream:
  - target: Acute Reversible Neuronal Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors offer persisting brain cytokines as a candidate cause of the
      episodes. The intermediate steps between a cytokine load and the
      clinical picture are not established.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "suggesting one of the physiological consequences possibly responsible for the encephalopathy seen in our patients"
      explanation: >-
        The authors state this link as a suggestion drawn from the mouse
        result, which is why the edge is recorded as indirect with unknown
        intermediates.
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "RT-PCR of selected cytokine genes revealed upregulation of Il1b, Tnf, Il6, and Ccl2 after 3 hours of LPS injection both in wild-type and mutant animals."
    explanation: >-
      Reports the measurement behind this node: the cytokines induced in both
      genotypes, which is the baseline against which the clearance difference
      at 24 hours was read.
- name: Acute Reversible Neuronal Dysfunction
  description: >-
    Central nervous system function is disturbed for hours to days and then
    returns fully to baseline. There is no recorded structural correlate:
    brain imaging, cerebrospinal fluid and metabolic screening were normal or
    non-specific during episodes in the index family, and no neuronal loss or
    demyelination has been reported in this disorder.
  biological_scale: ORGANISM
  downstream:
  - target: Acute encephalopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Acute encephalopathy event occurred first in the second twin at the age of 5 years and 6 months."
      explanation: >-
        Reports the episodic acute encephalopathy that this node produces.
  - target: Reduced consciousness
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Then, consciousness gradually decreased into a drowsy or obtunded status with generalized spasticity and hyperreflexia."

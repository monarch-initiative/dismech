animal_models:
- name: mdr1a knockout mouse
  species: Mouse
  genotype: mdr1a (Abcb1a) homozygous knockout
  publication: PMID:7910522
  description: >-
    The founding model of the human lesion. Homozygous disruption of mdr1a
    leaves the mouse viable and fertile but removes the principal
    blood-brain-barrier efflux pump, raising brain drug levels and shifting
    ivermectin sensitivity by two orders of magnitude.
  genes:
  - preferred_term: ABCB1
    term:
      id: hgnc:40
      label: ABCB1
  modeled_mechanisms:
  - target: Loss of P-glycoprotein Efflux at the Blood-Brain Barrier
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Removes the same transporter at the same barrier, and measures the
      consequence as brain drug concentration.
    limitations: >-
      The mouse splits the function across two genes, mdr1a and mdr1b, so a
      single mdr1a knockout is not the exact counterpart of a human biallelic
      ABCB1 loss. The readout is drug sensitivity and tissue drug level, not
      an episodic encephalopathy, so the model reports the transport defect
      rather than the clinical syndrome.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Human ABCB1 has a single ortholog pair in mouse (Abcb1a and Abcb1b)
        with partly different tissue distribution, so the degree of residual
        barrier efflux in this genotype is not the human genotype's.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's measured quantity is brain drug concentration and lethal
        or toxic dose. The node's quantity is the transport step itself, which
        is inferred from them.
    readouts:
    - name: Brain drug level in the knockout
      target: Loss of P-glycoprotein Efflux at the Blood-Brain Barrier
      direction: INCREASED
      interpretation: >-
        Raised brain drug concentration is the expected consequence of losing
        barrier efflux, and is how this model reports on the node.
      evidence:
      - reference: PMID:7910522
        reference_title: "Disruption of the mouse mdr1a P-glycoprotein gene leads to a deficiency in the blood-brain barrier and to increased sensitivity to drugs."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "its absence results in elevated drug levels in many tissues (especially in brain) and in decreased drug elimination"
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:7910522
      reference_title: "Disruption of the mouse mdr1a P-glycoprotein gene leads to a deficiency in the blood-brain barrier and to increased sensitivity to drugs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "we found that the mdr1a P-glycoprotein is the major P-glycoprotein in the blood-brain barrier"
      explanation: >-
        Supports treating this knockout as informative for the barrier efflux
        node: the gene it removes is the barrier's main pump.
  - target: Brain Accumulation of P-glycoprotein Substrates
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that losing the transporter converts an ordinarily tolerated
      ivermectin dose into a neurotoxic one.
    limitations: >-
      The dose shift is measured as whole-animal toxicity rather than as a
      described encephalopathy, and no human dose-response curve exists to
      compare the hundredfold figure against.
    readouts:
    - name: Ivermectin sensitivity
      target: Brain Accumulation of P-glycoprotein Substrates
      direction: INCREASED
      interpretation: >-
        A hundredfold leftward shift in the toxic dose is the model's measure
        of how much protection the transporter was providing.
      evidence:
      - reference: PMID:7910522
        reference_title: "Disruption of the mouse mdr1a P-glycoprotein gene leads to a deficiency in the blood-brain barrier and to increased sensitivity to drugs."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "they displayed an increased sensitivity to the centrally neurotoxic pesticide ivermectin (100-fold)"
        explanation: Reports the measured shift and its direction.
- name: Mdr1a/b double knockout mouse under lipopolysaccharide challenge
  species: Mouse
  genotype: Mdr1a/b homozygous double knockout
  publication: PMID:32627353
  description: >-
    The model behind the illness-triggered arm. Wild-type and double-knockout
    mice were given lipopolysaccharide and their brains examined for cytokine
    transcripts at 3 and 24 hours.
  modeled_mechanisms:
  - target: Delayed Clearance of Proinflammatory Cytokines from Brain
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Produces the clearance defect this node asserts, in the orthologous
      knockout and under a defined inflammatory challenge.
    limitations: >-
      Lipopolysaccharide is a standardised surrogate for the varied febrile
      and afebrile illnesses that precipitate human episodes, the readout is
      brain cytokine transcript rather than protein or a clinical state, and
      the mice were not reported to develop an encephalopathy.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human trigger is an intercurrent illness of unspecified cause. The
        model substitutes a single bacterial endotoxin given intraperitoneally
        at a fixed dose.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model measures cytokine transcript abundance in brain tissue. The
        node's quantity is clearance of the mediators themselves, which is
        inferred from the transcript time course.
    readouts:
    - name: Brain cytokine transcripts at 24 hours after challenge
      target: Delayed Clearance of Proinflammatory Cytokines from Brain
      direction: INCREASED
      interpretation: >-
        Persistence of the 3-hour cytokine peak at 24 hours in the knockout,
        where wild-type brains had cleared it, is the model's measure of the
        clearance defect.
      evidence:
      - reference: PMID:32627353
        reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "whereas wild-type brains showed cytokines clearance, mutant brains still harbored some of the cytokine expressions"
        explanation: Reports the measurement, its comparator and its direction.
    evidence:
    - reference: PMID:32627353
      reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "This result demonstrates that the absence of Mdr1a/b caused delayed clearance of cytokines in the mouse brains"
      explanation: >-
        Supports treating this model as informative for the cytokine-clearance
        node.
- name: P-glycoprotein-deficient CF-1 mouse

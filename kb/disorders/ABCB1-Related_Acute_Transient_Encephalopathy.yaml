treatments:
- name: Supportive Care During an Episode
  description: >-
    Hydration and symptomatic treatment, with no disease-specific therapy
    available. Both reported families recovered completely on supportive care
    alone, so the evidence is for the episode resolving under this management
    rather than for the management shortening it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_phenotypes:
  - preferred_term: Acute encephalopathy
    term:
      id: HP:0006846
      label: Acute encephalopathy
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "with hydration and symptomatic medications including antibiotics, anti-emetics, and antihistamines, they completely recovered from all episodes without any sequelae"
    explanation: >-
      Reports the supportive measures used and the complete recovery that
      followed them in the index family.
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The patient recovered fully with supportive care alone"
    explanation: >-
      Records the same outcome under supportive care in the second family,
      after a drug-triggered episode.
  notes: >-
    No evidence was found that any specific agent alters the course. The
    antibiotics, anti-emetics and antihistamines named in the index report
    were given for the precipitating illness, not as a treatment for the
    encephalopathy.
- name: Avoidance of P-glycoprotein Substrate Drugs
  description: >-
    Withholding P-glycoprotein substrate drugs, ivermectin in particular,
    removes the one precipitant shown to produce an episode in a patient with
    this genotype. This is an inference from the reported case and from the
    transporter's role, not a tested intervention: no study has measured
    episode frequency with and without substrate exposure.
  treatment_term:
    preferred_term: avoidance of P-glycoprotein substrate drugs
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Brain Accumulation of P-glycoprotein Substrates
    description: >-
      Removing the substrate removes the compound that would otherwise
      accumulate in the brain.
  evidence:
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Definitive human evidence has established that loss-of-function mutations in ABCB1 can precipitate profound ivermectin neurotoxicity even at standard doses"
    explanation: >-
      Supports avoidance by establishing that the exposure precipitates
      neurotoxicity in this genotype. The quote is about the hazard, not about
      the benefit of avoiding it, so the support is indirect.
  - reference: PMID:15500562
    reference_title: "Therapeutic implications of the MDR-1 gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A number of clinically relevant, structurally and functionally unrelated drugs are substrates for P-gp."
    explanation: >-
      Supports the scope of this treatment being a drug class rather than one
      agent: the substrates are many and are not recognisable from chemical
      class, so avoidance has to be checked drug by drug.
  notes: >-
    The index report raises the adjacent clinical point without testing it,
    noting that unexpected central nervous system drug effects could emerge in
    conditions such as severe infection, pregnancy or surgery. That is a
    caution about any substrate, recorded here rather than expanded into a
    drug list this disorder's literature does not contain.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling for the family, with a one-in-four
    recurrence risk for siblings and heterozygous carrier parents who are
    themselves unaffected.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:32627353
    reference_title: "Biallelic mutations in ABCB1 display recurrent reversible encephalopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Segregation analysis confirmed that each variant is inherited from each parent and unaffected sister does not carry any of them"
    explanation: >-
      Establishes the recessive segregation that the counselling claim rests
      on. The paper does not discuss counselling, so the support is indirect.
notes: >-
  Scope. This is curated as a Disease entry rather than as a pharmacogenetic
  gene-drug interaction. Three things decide it. The lesion is a rare
  biallelic germline loss of function, not a common ABCB1 polymorphism of the
  kind that modifies drug handling in the general population. The index family
  had recurrent episodes with no drug consistently implicated, so the
  phenotype occurs without a substrate exposure. And OMIM and MONDO both model
  it as a phenotype entry with a causal gene rather than as a drug response.
  The drug precipitant is carried where a precipitant belongs, as an
  environmental entry linked to the substrate-accumulation node.

  Why no module conformance. Two modules look close and neither fits.
  blood_brain_barrier_breakdown models loss of barrier function through
  tight-junction disassembly and rising paracellular permeability, and
  terminates in extravasation of plasma proteins and vasogenic cerebral
  oedema; here the barrier is structurally intact, imaging during episodes was
  normal, and the failure is of an active transport step rather than of the
  junctional seal. neuroinflammation_glial_activation begins with a danger
  signal already in the parenchyma and terminates in bystander neuronal and
  oligodendroglial injury; this disorder is fully reversible with no reported
  injury, and its cytokine arm is a clearance defect shown only in mice.
  Conforming to either would assert that module's terminal node.

  Not cited, and why. The second family's primary report, the Baudou et al.
  letter (PMID:32813957), is listed under the top-level references but is not
  cited by any evidence item: two fetches, the second with a forced refresh,
  returned a record with no abstract and no full text, so there is nothing in
  the cache to quote. The claims it is the source for are taken instead from
  the 2026 review that reproduces the case in detail (PMID:41837342), marked
  with quote_role REVIEW_SYNTHESIS. A curator with access to the letter should
  recheck those claims against it; one detail there already needs care, since
  the review renders the frameshift allele's coding change with a letter that
  cannot be a nucleotide, so this entry records that allele at protein level
  only.

  Prevalence is not recorded. Two families have been reported and neither
  paper gives a frequency estimate, so there is no figure to carry. The index
  report notes that gnomAD held 47 heterozygous loss-of-function alleles and
  none in the homozygous state, which bears on rarity but is not a prevalence
  measure.
review_notes: >-
  Phenotype set checked against the MedGen clinical-feature list for
  MONDO:0975801, which is OMIM-derived. Ataxia (HP:0001251), diplopia
  (HP:0000651) and abnormal pyramidal sign (HP:0007256) appear on that list
  and are deliberately absent from this entry: the clinical details behind
  them come from the second family's letter, whose cache has no quotable
  text, and the reviewed account of that case names coma and focal
  neurological deficits without specifying ataxia or diplopia. Adding them
  would mean writing a phenotype with no citable source. They are the first
  thing to add if the letter's full text becomes quotable. The two features
  that account does name are both recorded, the coma as HP:0001259 and the
  deficits as a coarse HP:0012638 binding whose basis is that the source says
  only that they were focal.

  No GeneReviews chapter exists for this disorder. The offline Bookshelf index
  (snapshot 2026-09-10) and a live PubMed title search over the entry's name,
  synonyms and disease term both return NO_CHAPTER, so there is no expert
  phenotype baseline to cross-reference and the phenotype set here rests on
  the two primary reports.

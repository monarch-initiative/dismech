      quote_role: REVIEW_SYNTHESIS
      snippet: "ABCB1 LoF mutations: p.Arg794Ter + p.Ile1018ThrfsTer8"
      explanation: >-
        The review's case table names both alleles of the second family. It is
        cited in place of the primary letter because no quotable text was
        retrieved for that letter.
  - name: p.Ile1018ThrfsTer8
    description: >-
      Frameshift allele in the second reported family, carried in trans with

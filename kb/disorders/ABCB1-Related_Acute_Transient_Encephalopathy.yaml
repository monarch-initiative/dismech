  - target: Coma
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41837342
      reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "developed severe neurotoxicity including coma and focal neurological deficits after a single oral prophylactic dose of ivermectin (0.23 mg/kg)"
      explanation: >-
        Names coma as the depth the episode reached in the ABCB1-deficient
        boy, and the dose that preceded it, which is the step this edge

environmental:
- name: Exposure to ivermectin at a therapeutic dose
  presence: PRESENT
  description: >-
    Ivermectin is a P-glycoprotein substrate whose entry into the brain is
    normally restrained by barrier efflux. In an individual with biallelic
    ABCB1 loss of function a single prophylactic dose inside the ordinary
    therapeutic range was followed by coma and focal deficits, with full
    recovery on supportive care. The exposure is recorded as a trigger of the
    substrate-accumulation step rather than as the disease itself.
  exposure_term:
    preferred_term: exposure to ivermectin
    term:
      id: ECTO:9002436
      label: exposure to ivermectin
  influences_mechanisms:
  - target: Brain Accumulation of P-glycoprotein Substrates
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Taking the drug supplies the substrate that the absent transporter can
      no longer keep out of the brain.
    evidence:
    - reference: PMID:41837342
      reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Definitive human evidence has established that loss-of-function mutations in ABCB1 can precipitate profound ivermectin neurotoxicity even at standard doses, underscoring the critical role of transporter-mediated neuroprotection"
      explanation: >-
        States that an ABCB1 loss-of-function genotype converts a standard
        ivermectin dose into a neurotoxic exposure, which is the trigger
        relationship this link asserts.
  evidence:
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Loss of transporter activity resulted in impaired drug extrusion from endothelial cells of the barrier and excessive CNS exposure, explaining the unexpected severity of toxicity despite therapeutic dosing."
    explanation: >-
      Attributes the severe reaction in the ABCB1-deficient patient to the
      drug reaching the brain once efflux is lost.
  - reference: PMID:41837342
    reference_title: "Ivermectin Toxicity in Humans and Animals: Clinical Spectrum, Mechanisms, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ivermectin penetration into the CNS is limited by the integrity of the BBB, where endothelial tight junctions and P-glycoprotein"
    explanation: >-
      Supports the premise of the exposure claim: that barrier efflux is what
      normally keeps this drug out of the brain.
  notes: >-
    The index family is the counter-case and is recorded as such: the authors
    reviewed those patients' medication histories and found no drug
    consistently associated with an episode, so a substrate exposure is one
    route to an episode and not a requirement for one. The wider list of
    P-glycoprotein substrates and inhibitors is not transcribed here, because
    only ivermectin has been reported to precipitate an episode in a patient
    with this genotype.

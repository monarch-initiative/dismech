- name: MDR1-mutant herding dog
  species: Dog
  genotype: MDR1 (ABCB1) 4-base-pair deletion, homozygous
  publication: PMID:15500562
  description: >-
    A naturally occurring large-animal counterpart in collies and Australian
    shepherds, and the setting in which P-glycoprotein deficiency was first
    recognised as a cause of drug neurotoxicity.
  modeled_mechanisms:
  - target: Brain Accumulation of P-glycoprotein Substrates
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the drug-triggered arm of the disorder in an outbred animal
      carrying its own loss-of-function allele.
    limitations: >-
      The canine allele is a different lesion from the human variants, the
      documented trigger is a substrate drug with no counterpart of the
      illness-triggered arm, and the clinical account is of drug sensitivity
      rather than of recurrent reversible encephalopathy.
    divergences:
    - divergence_type: SPECIES_MISMATCH

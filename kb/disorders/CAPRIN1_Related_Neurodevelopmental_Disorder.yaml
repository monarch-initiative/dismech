- name: Reduced Dendritic Sodium-Potassium Pump Activity
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: In cultured mouse null neurons, NKA subunit proteins were depleted from dendrites despite similar total abundance. K+-dependent Na+ efflux was reduced in dendrites while somatic activity was preserved. The corresponding pump defect has not been directly measured in human heterozygous neurons.
  evidence:
  - reference: PMID:20861386
    reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These results suggest that NKA activity was decreased in dendrites but not in the cell soma of Rng105−/− neurons
    explanation: Functional imaging localizes the deficit to dendrites.

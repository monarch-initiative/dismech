inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Autosomal dominant inheritance with variable expressivity and incomplete penetrance. De novo alleles and transmission from both affected and reportedly unaffected parents are documented. An affected father and son carried p.Arg458Ter, whereas a clinically unaffected mother carried c.279+1G>T. Observed case-series proportions cannot estimate population penetrance.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6650380
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6650380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Case 2 had ... variant inherited from his mother, reported healthy and without history of intellectual disability, speech delay, neurodevelopmental/behavioural concerns or other medical issues; she had a college education.
    explanation: 'Publisher full text of Pavinato et al., Brain 2023, PMID:35979925: CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD. Documents a reportedly unaffected transmitting parent.'
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_688d0e25-04f0-4160-a53a-00a6b423cafa-2026-02-02T110000.000Z

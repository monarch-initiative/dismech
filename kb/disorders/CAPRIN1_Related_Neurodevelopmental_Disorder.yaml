    model_scale: CELLULAR
    description: NKA-related reporter RNA localization and movement are reduced.
    limitations: Complete loss differs from human heterozygosity.
    evidence:
    - reference: PMID:20861386
      reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: their localization was limited to the cell soma and proximal dendrites and their motility was reduced in Rng105−/− neurons
      explanation: Cultured null neurons show altered movement and distribution of NKA-related reporter transcripts.
  - target: Reduced Dendritic Sodium-Potassium Pump Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Dendritic pump activity is reduced while somatic activity is preserved.
    limitations: The sodium-efflux proxy is compartment specific; it is not a human patient measurement.
    evidence:
    - reference: PMID:20861386
      reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: These results suggest that NKA activity was decreased in dendrites but not in the cell soma of Rng105−/− neurons
      explanation: Functional imaging localizes the deficit to dendrites.
  - target: Reduced Dendritic AMPA-Receptor Surface Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Dendritic surface GluR1 is significantly reduced.
    limitations: Receptor effects differ by subunit and dosage.
    evidence:
    - reference: PMID:26865403
      reference_title: 'Comprehensive behavioral analysis of RNG105 (Caprin1) heterozygous mice: Reduced social interaction and attenuated response to novelty.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: quantification revealed that the ratio of surface/total GluR1 puncta number in dendrites was significantly reduced in the Rng105−/− neurons
      explanation: Complete-loss cultures show a significant surface-receptor deficit.
  - target: Impaired Homeostatic AMPA-Receptor Scaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The TTX/APV-induced scaling response is impaired.
    limitations: A null culture does not establish impaired scaling in heterozygous human neurons.
    evidence:
    - reference: PMID:29157358
      reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: By contrast, the activity deprivation-dependent increase in surface GluR1 expression was not observed in Rng105−/− dendrites
      explanation: Direct activity-deprivation experiment in primary null neurons.
  - target: Impaired Neurite Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Dendritic length and arborization are reduced.
    limitations: Null primary neurons do not reproduce every aspect of human cortical development.
    evidence:
    - reference: PMID:20861386
      reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Sholl analysis revealed that the number of dendrites was significantly reduced in Rng105−/− neurons compared with wild-type neurons
      explanation: Direct morphometric result.
- name: Heterozygous Caprin1 primary cortical neurons
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Primary neurons from heterozygous mice were assayed for the ratio of dendritic surface to total GluR1, alongside wild-type and homozygous-null cultures.
  publication: PMID:26865403
  modeled_mechanisms:
  - target: Reduced Dendritic AMPA-Receptor Surface Expression
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The heterozygous surface-GluR1 difference was not statistically significant.
    limitations: A nonsignificant trend is not proof of equivalence; power and compensatory protein expression may matter.
    evidence:
    - reference: PMID:26865403
      reference_title: 'Comprehensive behavioral analysis of RNG105 (Caprin1) heterozygous mice: Reduced social interaction and attenuated response to novelty.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: GluR1 surface distribution in dendrites tended to be less in Rng105+/− mice than in wild-type mice, though statistically not significant
      explanation: Same-copy-number loss did not establish a significant receptor-surface deficit.
- name: CAPRIN1 knockout and missense add-back HeLa cells
  experimental_model_type: CELL_LINE
  description: CAPRIN1-null HeLa cells and add-back constructs were examined during arsenite stress. Candidate p.Ile373Lys abolished G3BP1/2 interaction and showed diffuse localization and reduced stress-granule assembly. The study’s main newly described clinical cohort concerns UBAP2L, not CAPRIN1.
  publication: PMID:35977029
  modeled_mechanisms:
  - target: Context-Dependent Impairment of Stress-Granule Assembly
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: CAPRIN1 loss and p.Ile373Lys perturb stress-granule assembly.
    limitations: Non-neuronal knockout/add-back experiments do not establish the effect of all heterozygous loss-of-function alleles; missense pathogenicity requires allele-specific interpretation.
    evidence:
    - reference: PMID:35977029
      reference_title: De novo variants in genes regulating stress granule assembly associate with neurodevelopmental disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We observed a significant reduction of SG numbers in KO cell lines
      explanation: CAPRIN1 knockout perturbs granule formation in HeLa cells.
    - reference: PMID:35977029
      reference_title: De novo variants in genes regulating stress granule assembly associate with neurodevelopmental disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: coimmunoprecipitation revealed a complete abolishment of interaction between CAPRIN1 p.I373K mutant proteins and G3BP1/2
      explanation: The binding result is specific to the tested missense variant.
- name: Caprin1 conditional-null cochlear explants
  experimental_model_type: OTHER
  description: Postnatal cochlear explants were exposed to 0.5 mM sodium arsenite for one hour. TIA1- and HuR-positive granules formed despite Caprin1 depletion; some cells escaped Cre recombination, but depleted cells also formed granules.
  publication: PMID:35165318
  modeled_mechanisms:
  - target: Context-Dependent Impairment of Stress-Granule Assembly
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Granule formation persisted in Caprin1-deficient cochlear cells.
    limitations: Granule counts and marker appearance do not establish normal granule composition, function or recovery kinetics.
    evidence:
    - reference: PMID:35165318
      reference_title: Targeted deletion of the RNA-binding protein Caprin1 leads to progressive hearing loss and impairs recovery from noise exposure in mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Stress granule formation in the cKO and Caprin1-expressing cells in the same explant was indistinguishable
      explanation: The within-explant comparison supports preserved granule formation.

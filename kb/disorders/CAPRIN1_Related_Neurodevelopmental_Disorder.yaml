diagnosis:
- name: Molecular genetic testing
  description: Exome or genome sequencing can identify coding and splice-region alleles; chromosomal microarray detected the multigene deletion. Interpretation should include segregation and variant-specific functional evidence where available, the Moderate gene–disease classification, and the distinct p.Pro512Leu mechanism.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

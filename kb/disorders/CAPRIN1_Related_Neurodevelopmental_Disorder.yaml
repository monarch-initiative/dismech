name: CAPRIN1 Related Neurodevelopmental Disorder
creation_date: "2026-08-28T21:45:00Z"
category: Mendelian
description: >-
  CAPRIN1-related neurodevelopmental disorder is an autosomal dominant condition
  caused by heterozygous loss-of-function variants in CAPRIN1, acting through
  haploinsufficiency. CAPRIN1 encodes Caprin-1 (also called RNG105), a
  cytoplasmic RNA-binding protein that is a core component of neuronal RNA
  transport granules.

  Its job is positional rather than quantitative: it carries specific mRNAs out
  into dendrites so they can be translated where they are needed. Losing half of
  it impairs the somatodendritic localisation of those transcripts, and among
  them are the mRNAs encoding regulators of AMPA-receptor surface expression - so
  the downstream failure is in homeostatic AMPAR scaling and synaptic strength
  rather than in protein supply overall.

  The clinical phenotype is language impairment in every reported patient, with
  intellectual disability, ADHD and autism in most, plus respiratory,
  skeletal, feeding, seizure and ophthalmologic involvement in a third to a half.
parents:
  - Neurodevelopmental Disorder
synonyms:
  - CAPRIN1-NDD
  - CAPRIN1 haploinsufficiency
  - RNG105-related neurodevelopmental disorder
disease_term:
  preferred_term: neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity disorder
  term:
    id: MONDO:0968945
    label: neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity disorder
notes: >-
  Frequencies, and why this entry has them when its four companions do not. The
  defining cohort reports a per-phenotype frequency for every feature it lists,
  in one sentence per group. Each frequency band below is therefore bound to a
  quote stating that figure for that named phenotype. This is the discipline the
  previous curation batch failed: a band taken from a number describing a
  neighbouring phenotype in the same sentence is wrong however exactly the quote
  verifies.

  Twelve patients is a small denominator and the percentages are correspondingly
  coarse - 33% is four patients. The bands are recorded because the source states
  them, not because they are precise.

  A misattributed quote, and the correction matters. The deep-research report
  committed alongside attributes to PMID:35979925 a sentence beginning "The
  majority of reported pathogenic mutations in the CAPRIN1 gene result in
  decreased protein levels and haploinsufficiency". The report's own reference
  validation flagged it as not found in that source, and it is not in that
  abstract - so an earlier revision of this entry recorded it as a confabulated
  quote, the only one across the five reports in this batch.

  That was wrong, and it is a more interesting failure than the one it replaced.
  The sentence is real and verbatim. It belongs to PMID:41859620, a 2026 case
  report now cited in this entry for the expanded phenotype. So the defect is
  misattribution, not fabrication: a true sentence pinned to the wrong paper.

  The two failures need different defences. A confabulated quote is caught by
  any substring check against the cited source, which is what happened here. A
  misattributed one is caught by that check only because the curator happened to
  cite the wrong paper - had the report named PMID:41859620, the quote would
  have verified exactly and nothing in the pipeline would have noticed anything,
  because nothing verifies that a sentence supports the claim it is attached to.
  Quarantining the quote was still right; the reason recorded for it was not.

  General terms where the source is general. Respiratory, skeletal and
  ophthalmologic involvement are bound to high-level HP terms because the cohort
  describes them only as "respiratory problems", "limb/skeletal anomalies" and
  "ophthalmologic problems". Binding a specific phenotype would assert more than
  the source carries.

  No treatments section. Management is symptomatic and no cited reference states
  a protocol quotable exactly.

diagnosis:
  - name: Molecular Diagnosis by Exome Sequencing
    description: >-
      Diagnosis is molecular; there is no biomarker and no imaging finding. The
      clinical picture - language impairment with intellectual disability, ADHD
      and autism - is shared with a large number of neurodevelopmental
      disorders, so the gene is reached by sequencing rather than by phenotype.
    diagnosis_term:
      preferred_term: whole exome sequencing
      term:
        id: NCIT:C101295
        label: Whole Exome Sequencing
    evidence:
      - reference: PMID:41859620
        reference_title: "CAPRIN1 (Cell Cycle-Associated Protein 1)-Related Neurodevelopmental Disorder: A Novel Mutation With Ataxia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Whole exome sequencing was significant for a likely pathogenic variant
          in the maternally inherited CAPRIN1 gene
        explanation: >-
          Exome sequencing as the diagnostic route in a reported case. Quoted
          only for the method: this abstract calls the same variant "maternally
          inherited" in one sentence and "de novo and heterozygous" in the next,
          so nothing about its inheritance is curated from it.

discussions:
  - discussion_id: caprin1_dose_gap
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Does heterozygous CAPRIN1 loss impair dendritic mRNA localisation in human
      neurons, or is the localisation defect a property of complete absence that
      half dosage does not reproduce?
    attaches_to:
      - pathophysiology#Impaired Dendritic mRNA Localisation
      - animal_models#Rng105/Caprin1 knockout mouse
      - animal_models#Rng105/Caprin1 heterozygous mouse
    rationale: >-
      The mechanism at the centre of this entry - mislocalisation of
      AMPAR-regulator transcripts - is established only at complete loss of
      Caprin-1, in a conditional forebrain knockout and constitutive null
      neurons. The human disease is haploinsufficiency.

      An earlier revision of this gap said no model at the right dose existed
      apart from the CRISPR-edited iPSC neurons. That was wrong: a heterozygous
      Rng105+/- mouse has been comprehensively characterised and is curated in
      this entry. The gap is therefore narrower than stated, and different in
      kind. It is not that half dosage has never been modelled - it has, and it
      produces a behavioural phenotype. It is that neither dose-matched model
      has been assayed for the molecular step this entry's causal chain runs
      through: the mouse work is behavioural throughout, and the CAPRIN1+/-
      neurons were characterised for morphology, translation, calcium,
      oxidative stress and electrical activity but not for dendritic mRNA
      localisation.

      So the chain passes through a step demonstrated only at a dose the disease
      does not have, while the models at the right dose report the phenotype
      without reporting the mechanism. That is not a reason to doubt the model -
      reduced spiking in CAPRIN1+/- neurons and reduced sociality in Rng105+/-
      mice are both consistent with it - but the specific link from half dosage
      to transport failure is inferred rather than shown, and one experiment
      would close it.
    proposed_experiments:
      - experiment_id: caprin1_het_localisation_assay
        name: Dendritic transcript localisation in CAPRIN1+/- iPSC-derived neurons
        description: >-
          Genome-wide profiling of somatodendritic mRNA distribution in the
          existing CRISPR-edited CAPRIN1+/- cortical neurons, compared with
          isogenic controls, focused on the AMPAR-regulator transcripts
          identified in the mouse.
        would_support:
          - pathophysiology#Impaired Dendritic mRNA Localisation
        supporting_outcome:
          - >-
            Reduced dendritic localisation of the same transcript class at
            heterozygous dose, matching the mouse in direction if not magnitude.
        refuting_outcome:
          - >-
            Normal transcript distribution at heterozygous dose, which would mean
            the reduced neuronal activity arises by a route other than transport
            failure and the entry's central node applies only to complete loss.

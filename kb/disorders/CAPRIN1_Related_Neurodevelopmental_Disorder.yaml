animal_models:
  - name: Rng105/Caprin1 knockout mouse
    species: Mouse
    genotype: RNG105 (Caprin1) deletion
    publication: PMID:29157358
    modeled_mechanisms:
      - target: Impaired Dendritic mRNA Localisation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          The mouse is where the mRNA-localisation mechanism was established,
          including the identity of the mislocalised transcript class.
        limitations: >-
          Fidelity is MODERATE and the reason is a dose mismatch that matters
          for this disease specifically. The mouse is a deletion; the human
          disorder is haploinsufficiency. A homozygous null establishes what
          Caprin-1 does, not what half of it fails to do, and the human disease
          is entirely a claim about half. The iPSC CAPRIN1+/- neurons are the
          model at the right dose, and they are what the reduced-activity
          evidence rests on.
        readouts:
          - name: Dendritic localisation of AMPAR-regulator mRNAs
            target: Impaired Dendritic mRNA Localisation
            direction: DECREASED
            interpretation: >-
              The transport failure, measured on the transcript class that
              connects it to synaptic scaling.
            evidence:
              - reference: PMID:29157358
                reference_title: "RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  RNG105 deficiency reduced the dendritic localization of mRNAs
                  encoding regulators of AMPAR surface expression
                explanation: >-
                  Reports the measurement and its direction.
        evidence:
          - reference: PMID:29157358
            reference_title: "RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              RNG105-deficient mice displayed unprecedentedly severe defects in
              long-term memory formation in spatial and contextual learning
              tasks
            explanation: >-
              Establishes the model as informative for the pathway. The severity
              language is the authors' and is quoted rather than softened.
discussions:
  - discussion_id: caprin1_dose_gap
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Does heterozygous CAPRIN1 loss impair dendritic mRNA localisation in human
      neurons, or is the localisation defect a property of complete absence that
      half dosage does not reproduce?
    attaches_to:
      - pathophysiology#Impaired Dendritic mRNA Localisation
      - animal_models#Mouse
    rationale: >-
      The mechanism at the centre of this entry - mislocalisation of
      AMPAR-regulator transcripts - is established only in a homozygous mouse
      deletion. The human disease is haploinsufficiency, and the patient-derived
      iPSC neurons, which are at the right dose, were characterised for
      morphology, translation, calcium, oxidative stress and electrical activity
      but are not reported to have been assayed for dendritic mRNA localisation.

      So the entry's causal chain passes through a step demonstrated at a dose
      the disease does not have. That is not a reason to doubt the model - the
      reduced spiking in CAPRIN1+/- neurons is consistent with it - but the
      specific link from half dosage to transport failure is inferred rather
      than shown, and closing it would need one experiment that has apparently
      not been done.
    proposed_experiments:
      - experiment_id: caprin1_het_localisation_assay
        name: Dendritic transcript localisation in CAPRIN1+/- iPSC-derived neurons
        description: >-
          Genome-wide profiling of somatodendritic mRNA distribution in the
          existing CRISPR-edited CAPRIN1+/- cortical neurons, compared with
          isogenic controls, focused on the AMPAR-regulator transcripts
          identified in the mouse.
        would_support:
          - pathophysiology#Impaired Dendritic mRNA Localisation
        supporting_outcome:
          - >-
            Reduced dendritic localisation of the same transcript class at
            heterozygous dose, matching the mouse in direction if not magnitude.
        refuting_outcome:
          - >-
            Normal transcript distribution at heterozygous dose, which would mean
            the reduced neuronal activity arises by a route other than transport
            failure and the entry's central node applies only to complete loss.

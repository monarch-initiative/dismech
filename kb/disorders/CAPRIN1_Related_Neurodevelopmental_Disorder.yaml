  - name: Rng105/Caprin1 heterozygous mouse
    species: Mouse
    genotype: Rng105 (Caprin1) heterozygous knockout, Rng105+/-
    publication: PMID:26865403
    description: >-
      The dose-matched model. A comprehensive behavioural battery on Rng105+/-
      mice - the same single-copy loss as the human disease - finds reduced
      sociality, a weak preference for social novelty, and reduced flexibility
      in reversal learning with intact memory acquisition.

      It is curated separately from the knockout rather than as another link on
      it, because the two make different claims: the null says what Caprin-1
      does, this one says that losing one copy is enough to produce a
      social-behaviour phenotype.
    modeled_mechanisms:
      - target: Autism
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: >-
          Reduced sociality and attenuated response to novelty at single-copy
          loss, which is the mouse analogue of the social-communication and
          restricted-interest domains.
        limitations: >-
          PARTIALLY_RECAPITULATES rather than RECAPITULATES, and the reservation
          is about what a mouse can be said to have. Reduced sociality in a home
          cage is a behavioural analogue of one ASD domain, not the human
          diagnosis; the authors themselves write "ASD-like behavior". The
          battery is also behavioural throughout, so it connects the dose to a
          phenotype without connecting either to the mRNA-localisation mechanism
          this entry proposes. And ASD is reported in 67 percent of patients,
          so the model addresses a frequent feature rather than a defining one.
        readouts:

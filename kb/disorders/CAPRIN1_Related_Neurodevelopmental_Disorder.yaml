genetic:
- name: CAPRIN1
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CAPRIN1
    term:
      id: hgnc:6743
      label: CAPRIN1
  notes: Heterozygous nonsense, frameshift, splice-altering and multigene deletion alleles have been reported. Functional support includes mutant RNA depletion and reduced protein in selected patient cells. Unaffected transmitting parents, siblings and population controls carrying protein-truncating variants limit assumptions of sufficiency or full penetrance. Specific missense alleles require separate interpretation; p.Pro512Leu belongs to a distinct aggregation-associated neurodegenerative disorder. The 2026 p.Gln349Ter case body repeatedly reports maternal inheritance although its abstract also says de novo; trio case details support maternal transmission. No quantified population penetrance or validated modifier is established.

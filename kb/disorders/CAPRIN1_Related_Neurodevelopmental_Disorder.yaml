discussions:
- discussion_id: caprin1_dose_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: Does human heterozygous CAPRIN1 loss reduce dendritic delivery of the same mRNAs affected in mouse null neurons?
  attaches_to:
  - pathophysiology#Impaired Dendritic mRNA Localisation
  - experimental_models#Isogenic CAPRIN1 heterozygous human cortical neurons
  - experimental_models#Heterozygous Caprin1 primary cortical neurons
  rationale: Dendritic transcript mislocalization is directly established in complete-loss mouse models. Human heterozygous neurons have altered local puromycin labeling, which measures translation rather than RNA transport. Heterozygous mouse neurons were assayed for surface GluR1, but the downward trend was not significant; their study was therefore not exclusively behavioral. Testing transcript localization and gene-dosage rescue in the same human background would distinguish a conserved transport defect from other routes to altered translation and network activity.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6650380
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6650380
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These data suggest that ... CAPRIN1 ... haploinsufficiency might also affect local protein synthesis.
    explanation: 'Publisher full text of Pavinato et al., Brain 2023, PMID:35979925: CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD. The authors interpret altered dendritic puromycin distribution as a local-translation effect.'
  - reference: PMID:26865403
    reference_title: 'Comprehensive behavioral analysis of RNG105 (Caprin1) heterozygous mice: Reduced social interaction and attenuated response to novelty.'
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: GluR1 surface distribution in dendrites tended to be less in Rng105+/− mice than in wild-type mice, though statistically not significant
    explanation: The heterozygous comparison limits claims of a proven same-dose effect.
  proposed_experiments:
  - experiment_id: caprin1_het_localisation_assay
    name: Dendritic RNA localization and dosage rescue in human heterozygous neurons
    description: Measure somatodendritic distributions of AMPA-regulator and NKA-subunit transcripts in heterozygous and isogenic control neurons, with physiological CAPRIN1 restoration. Pair RNA localization with local translation and electrophysiology.
    would_support:
    - pathophysiology#Impaired Dendritic mRNA Localisation
    supporting_outcome:
    - A concordant dendritic RNA deficit reversed by physiological CAPRIN1 restoration.
    refuting_outcome:
    - Preserved RNA distributions despite reproducible local-translation and network abnormalities.
- discussion_id: caprin1_stress_granule_context
  kind: HUMAN_MODEL_MISMATCH
  prompt: Which stress-granule abnormalities occur in human loss-of-function neurons at physiological dosage?
  attaches_to:
  - pathophysiology#Context-Dependent Impairment of Stress-Granule Assembly
  rationale: CAPRIN1-null HeLa cells and an Ile373Lys add-back assay show impaired granule assembly, whereas null cochlear explants retain marker-positive granules. Normal-protein biophysical studies show opposing domain effects and enhanced G3BP1-dependent mRNA recruitment; these establish molecular capabilities, not a proven universal disease mechanism. WDR45-associated granule disassembly and p.Pro512Leu aggregation belong to distinct disease contexts. Physiological-dose neuronal experiments should measure granule composition and recovery, not only granule number.
  evidence:
  - reference: PMID:35977029
    reference_title: De novo variants in genes regulating stress granule assembly associate with neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed a significant reduction of SG numbers in KO cell lines
    explanation: CAPRIN1 knockout perturbs granule formation in HeLa cells.
  - reference: PMID:35165318
    reference_title: Targeted deletion of the RNA-binding protein Caprin1 leads to progressive hearing loss and impairs recovery from noise exposure in mice.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These data suggest that stress granule formation in native cochlear cells is not dependent on Caprin1.
    explanation: Null cochlear explants retain stress-granule formation.
  - reference: PMID:36279435
    reference_title: Yin and yang regulation of stress granules by Caprin-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: The C-terminal domain of Caprin-1 underwent spontaneous LLPS, whereas the N-terminal domain and GIM of Caprin-1 suppressed LLPS of G3BP1.
    explanation: Domain biophysics provides context without establishing the effects of patient loss-of-function alleles.
  - reference: PMID:41131140
    reference_title: mRNA recruitment by G3BP1 condensates is regulated by Caprin1 but requires G3BP1 binding to mRNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: However, this function requires intact RNA binding domains of G3BP1.
    explanation: Normal-protein experiments constrain the mechanism of CAPRIN1-assisted recruitment.
- discussion_id: caprin1_penetrance
  kind: OPEN_QUESTION
  prompt: What determines whether a carrier of a CAPRIN1 protein-truncating variant develops neurodevelopmental impairment?
  attaches_to:
  - genetic#CAPRIN1
  rationale: ClinGen downgraded the relationship to Moderate because truncating alleles were also present in reportedly unaffected parents, siblings and controls. Ascertainment, depth of parental phenotyping, allele-specific consequences and additional genetic factors could contribute. Existing series do not support a numerical penetrance estimate or a validated modifier gene.
  evidence:
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_688d0e25-04f0-4160-a53a-00a6b423cafa-2026-02-02T110000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The classification was downgraded from strong to moderate due to multiple instances of truncating variants inherited from unaffected parents or present in unaffected siblings and controls.
    explanation: The expert panel explicitly qualifies the strength of the gene–disease relationship.

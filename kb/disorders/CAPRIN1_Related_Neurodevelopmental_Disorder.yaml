inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Dominant by haploinsufficiency. Patient cells express only the wild-type
      allele, with transcript and protein at about half the normal level - which
      is the direct demonstration that the mechanism is dose rather than a
      dominant-negative product.
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In patient-derived lymphoblasts and fibroblasts, we showed a
          monoallelic expression of the wild-type allele, and a reduction of the
          transcript and protein compatible with a half dose
        explanation: >-
          Establishes haploinsufficiency in patient material rather than
          inferring it from variant class - monoallelic expression plus half-dose
          protein is the observation that rules out a dominant-negative product.
pathophysiology:
  - name: CAPRIN1 Haploinsufficiency
    biological_scale: MOLECULAR
    description: >-
      Heterozygous loss-of-function variants leave one working allele, and
      patient cells carry transcript and protein at about half the normal level.
    genes:
      - preferred_term: CAPRIN1
        term:
          id: hgnc:6743
          label: CAPRIN1
    downstream:
      - target: Impaired Dendritic mRNA Localisation
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In patient-derived lymphoblasts and fibroblasts, we showed a
          monoallelic expression of the wild-type allele, and a reduction of the
          transcript and protein compatible with a half dose
        explanation: >-
          The half-dose state this node asserts, measured in patient cells.
  - name: Impaired Dendritic mRNA Localisation
    biological_scale: CELLULAR
    description: >-
      Caprin-1 carries specific transcripts into dendrites. Without enough of
      it, the asymmetric somatodendritic distribution of mRNAs is lost.

      The important detail is which transcripts: those encoding regulators of
      AMPA-receptor surface expression. That is what makes the consequence a
      synaptic-scaling failure rather than a general translation deficit, and it
      is why the entry does not model this as "less protein made".
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: intracellular protein localization
        term:
          id: GO:0008104
          label: intracellular protein localization
        modifier: DECREASED
    downstream:
      - target: Attenuated Homeostatic AMPAR Scaling and Reduced Synaptic Strength
    evidence:
      - reference: PMID:29157358
        reference_title: "RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          RNG105 deficiency impaired the asymmetric somato-dendritic
          localization of mRNAs
        explanation: >-
          The localisation defect this node asserts. Graded MODEL_ORGANISM: this
          is the mouse knockout, and the finding is not shown in patient
          neurons.
      - reference: PMID:29157358
        reference_title: "RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          RNG105 deficiency reduced the dendritic localization of mRNAs encoding
          regulators of AMPAR surface expression
        explanation: >-
          Names the transcript class, which is what connects a transport defect
          to a specific synaptic consequence rather than to translation in
          general.
  - name: Attenuated Homeostatic AMPAR Scaling and Reduced Synaptic Strength
    biological_scale: CELLULAR
    description: >-
      With the AMPAR-regulator transcripts not reaching dendrites, homeostatic
      AMPAR scaling is attenuated and synaptic strength falls. In the mouse this
      produces severe long-term memory deficits; in patient-derived neurons the
      corresponding readout is reduced spiking and bursting.
    downstream:
      - target: Disrupted Cortical Neuronal Development
      - target: Extraneural Consequences of Reduced Caprin-1
    evidence:
      - reference: PMID:29157358
        reference_title: "RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          attenuated homeostatic AMPAR scaling in dendrites and reduced synaptic
          strength
        explanation: >-
          Both halves of this node, in the model where they were measured.
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          measurements of activity in CAPRIN1+/- neurons via micro-electrode
          arrays indicated lower spike rates and bursts, with an overall reduced
          activity
        explanation: >-
          The human counterpart, in CRISPR-edited iPSC-derived neurons at the
          same heterozygous dose as patients - which is what stops this node
          resting on a homozygous mouse knockout alone.
  - name: Disrupted Cortical Neuronal Development
    biological_scale: CELLULAR
    description: >-
      In CAPRIN1+/- human cortical neurons the cells themselves are abnormal:
      fewer processes, disorganised architecture, and increased degeneration,
      alongside altered translation, impaired calcium signalling and increased
      oxidative stress.
    downstream:
      - target: phenotypes#Delayed Speech and Language Development
      - target: phenotypes#Intellectual Disability
      - target: phenotypes#Attention Deficit Hyperactivity Disorder
      - target: phenotypes#Autism
      - target: phenotypes#Global Developmental Delay
      - target: phenotypes#Seizure
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          CAPRIN1 loss caused reduced neuronal processes, overall disruption of
          the neuronal organization and an increased neuronal degeneration
        explanation: >-
          The morphological phenotype of this node, in human neurons carrying
          the patient-equivalent genotype.
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          CAPRIN1+/- neurons also showed an impaired calcium signalling and
          increased oxidative stress
        explanation: >-
          Two further cellular abnormalities the authors identify. They are
          recorded on this node rather than as separate mechanism nodes because
          nothing cited establishes their order relative to the morphological
          changes.
  - name: Extraneural Consequences of Reduced Caprin-1
    biological_scale: ORGANISM
    description: >-
      The respiratory, skeletal, feeding and ophthalmologic features, which
      occur in a third to a half of patients and which a neuronal mechanism does
      not account for.

      CAPRIN1 is ubiquitously expressed and also regulates mRNAs encoding
      proteins important for cell proliferation and migration in multiple cell
      types, so there is a plausible route to non-neural tissue. But no cited
      work shows that route operating in any of these organs, and the entry does
      not pretend otherwise: this node asserts that the features occur in a
      disease caused by CAPRIN1 haploinsufficiency, not that each follows from
      the mechanism above it. It is deliberately a sibling of the neuronal arm
      rather than downstream of it, because routing a limb anomaly through
      cortical neuron development would be false.
    downstream:
      - target: phenotypes#Abnormal Respiratory System Physiology
      - target: phenotypes#Abnormal Skeletal Morphology
      - target: phenotypes#Feeding Difficulties
      - target: phenotypes#Abnormality of the Eye
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CAPRIN1 encodes a ubiquitous protein that regulates the transport and
          translation of neuronal mRNAs critical for synaptic plasticity, as
          well as mRNAs encoding proteins important for cell proliferation and
          migration in multiple cell types
        explanation: >-
          Supplies the only mechanistic basis cited for extraneural
          involvement - ubiquitous expression and a second transcript class in
          other cell types. It licenses the node's existence, not any specific
          organ claim.
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Affected individuals also had respiratory problems (50%),
          limb/skeletal anomalies (50%), developmental delay (42%) feeding
          difficulties (33%), seizures (33%) and ophthalmologic problems (33%)
        explanation: >-
          Establishes that these features occur in the cohort, which is what the
          edges below assert.

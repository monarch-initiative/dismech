differential_diagnoses:
- name: CAPRIN1 p.Pro512Leu-associated neurodegeneration
  disease_term:
    preferred_term: neurodegeneration, childhood-onset, with cerebellar ataxia and cognitive decline
    term:
      id: MONDO:0957985
      label: neurodegeneration, childhood-onset, with cerebellar ataxia and cognitive decline
  description: The recurrent p.Pro512Leu allele is associated with progressive childhood ataxia, cognitive decline and protein aggregation, rather than the loss-of-function developmental syndrome. Later cases show progressive brain atrophy and axonal neuropathy. Ataxia can also occur with a nonsense allele, so clinical gait findings alone do not separate these entities.
  distinguishing_features:
  - 'Variant-specific mechanism: p.Pro512Leu aggregation-associated gain of function versus reduced dosage from loss-of-function alleles.'
  - Progressive cognitive and motor decline, brain atrophy and axonal neuropathy favor the neurodegenerative entity.
  evidence:
  - reference: PMID:36136249
    reference_title: CAPRIN1(P512L) causes aberrant protein aggregation and associates with early-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Trio exome sequencing unraveled the identical de novo c.1535C > T (p.Pro512Leu) missense variant in CAPRIN1
    explanation: The original neurodegenerative patients shared the recurrent missense allele.
  - reference: PMID:39878554
    reference_title: CAPRIN1 Pro512Leu Variant Causes Childhood Dementia, Myoclonus-Ataxia, and Sensorimotor Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Electroneurography confirmed sensorimotor axonal neuropathy in the lower and upper limbs.
    explanation: A subsequent patient had objective peripheral neuropathy.

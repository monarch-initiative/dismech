name: CAPRIN1 Related Neurodevelopmental Disorder
creation_date: '2026-08-28T21:45:00Z'
category: Mendelian
description: CAPRIN1-related neurodevelopmental disorder is associated with heterozygous loss-of-function variants and reduced Caprin-1 dosage. Language impairment, intellectual or learning disability, ADHD and autism dominate the reported spectrum; motor delay, seizures and variable respiratory, skeletal, ocular and auditory findings also occur. Expressivity varies and unaffected variant carriers are documented. ClinGen classified the gene–disease relationship as Moderate in February 2026. Human heterozygous neuronal models show altered global and local translation, calcium signaling, oxidative stress, neurite development and network activity. Dendritic mRNA transport and AMPA-receptor mechanisms are best established in mouse null models and cannot be assumed to operate identically at human heterozygous dosage. The recurrent p.Pro512Leu aggregation-associated neurodegenerative disorder is a distinct allelic condition.
parents:
- Neurodevelopmental Disorder
synonyms:
- CAPRIN1-NDD
- CAPRIN1 haploinsufficiency
- RNG105-related neurodevelopmental disorder
- Neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity disorder
- NEDLAAD
disease_term:
  preferred_term: neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity disorder
  term:
    id: MONDO:0968945
    label: neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity disorder
notes: Published cohorts are small and clinically ascertained. Frequencies describe the specified series, not penetrance among all CAPRIN1 variant carriers. The defining series includes a father and son and a multigene deletion carrier. Minor anomalies and common comorbidities do not individually establish a CAPRIN1-specific mechanism. Longitudinal outcome data remain limited; early language regression or stagnation has been reported, so a uniformly static course is not established. The publisher full text at https://oup.silverchair-cdn.com/article-minimal/6650380 is Pavinato et al., Brain 2023, PMID:35979925, DOI:10.1093/brain/awac278; both citation forms identify the same paper.

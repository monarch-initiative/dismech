animal_models:
- name: Rng105/Caprin1 heterozygous mouse
  species: Mouse
  genotype: Rng105+/−; heterozygous deletion of the exon containing the translation start site
  description: Constitutive heterozygous male mice were tested behaviorally. Brain transcript abundance was approximately 50–60% of wild type, whereas protein remained approximately 70–80%. The genotype matches single-copy loss more closely than the null, but protein depletion is less than in some patient fibroblast assays.
  publication: PMID:26865403
  modeled_mechanisms:
  - target: Autism
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced nighttime home-cage social interaction and novelty preference approximate selected behavioral domains.
    limitations: Initial sociability toward an unfamiliar mouse was preserved. Mouse social behavior does not establish the human autism diagnosis.
    evidence:
    - reference: PMID:26865403
      reference_title: 'Comprehensive behavioral analysis of RNG105 (Caprin1) heterozygous mice: Reduced social interaction and attenuated response to novelty.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Rng105(+/-) mice exhibited a reduced sociality in a home cage and a weak preference for social novelty
      explanation: Behavioral observations at heterozygous genotype.
  - target: Intellectual Disability
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reference, working and contextual memory were preserved in the tested tasks.
    limitations: Task performance cannot exclude all cognitive effects; relative reversal-learning difficulty was observed.
    evidence:
    - reference: PMID:26865403
      reference_title: 'Comprehensive behavioral analysis of RNG105 (Caprin1) heterozygous mice: Reduced social interaction and attenuated response to novelty.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Rng105+/− mice had normal reference memory, working memory and contextual memory.
      explanation: Negative memory findings limit broad cognitive extrapolation.
- name: Rng105/Caprin1 forebrain conditional knockout mouse
  species: Mouse
  genotype: Camk2a-Cre;Rng105f/f
  description: Forebrain deletion allowed postnatal behavioral testing. Hippocampal RNA profiling, spine imaging and electrophysiology characterized transport and synaptic phenotypes, alongside severe long-term-memory deficits and occasional provoked seizures.
  publication: PMID:29157358
  modeled_mechanisms:
  - target: Impaired Dendritic mRNA Localisation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Somatodendritic localization of selected regulator mRNAs is reduced.
    limitations: Regional complete loss differs from human systemic heterozygosity.
    evidence:
    - reference: PMID:29157358
      reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: These results indicated that various mRNAs, encoding AMPAR regulators involved in AMPAR surface expression and retention to postsynapses, were localized to dendrites in an RNG105-dependent manner.
      explanation: In vivo somatodendritic RNA profiling identifies affected regulator transcripts.
  - target: Reduced Excitatory Synaptic Strength
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Absolute excitatory responses are reduced while relative LTP gain is retained.
    limitations: The neuronal population and dosage differ from human heterozygous cortical cultures.
    evidence:
    - reference: PMID:29157358
      reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: RNG105 deficiency reduced both the amplitude and slope of fEPSP to about half of those of control mice
      explanation: Hippocampal physiology measures the lower absolute response.
    - reference: PMID:29157358
      reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Theta-burst-induced LTP in CA1 neurons revealed that fEPSP was increased from baseline by ~100%, which was comparable between Rng105f/f and Camk2a-Cre;Rng105f/f mice
      explanation: Supports the distinction between reduced absolute synaptic strength and preserved relative LTP gain.
  - target: Intellectual Disability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Spatial and contextual long-term-memory performance is impaired.
    limitations: Memory-task deficits are partial analogues of human cognitive impairment, not an intellectual-disability diagnosis.
    evidence:
    - reference: PMID:29157358
      reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: RNG105-deficient mice displayed unprecedentedly severe defects in long-term memory formation in spatial and contextual learning tasks
      explanation: The reported cognitive readouts are mouse memory tasks.
- name: Rng105/Caprin1 constitutive null mouse
  species: Mouse
  genotype: Rng105−/−; homozygous deletion of exon 1
  description: Null neonates failed to breathe and died within approximately 20 minutes. Fetal organs were formed and histologically normal; increased cell death was demonstrated in brain, without establishing a primary pulmonary mechanism.
  publication: PMID:20861386
  modeled_mechanisms:
  - target: Respiratory Distress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Neonatal failure to breathe provides a severe respiratory phenotype.
    limitations: Complete-loss neonatal lethality is a poor match to the variable respiratory concerns of surviving heterozygous patients; the anatomical cause was not resolved.
    evidence:
    - reference: PMID:20861386
      reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Rng105−/− neonates were born normally but failed to breathe, developed cyanosis, and died within 20 min after birth.

genetic:
  - name: CAPRIN1
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    gene_term:
      preferred_term: CAPRIN1
      term:
        id: hgnc:6743
        label: CAPRIN1
    notes: >-
      Heterozygous loss of function acting by haploinsufficiency, demonstrated
      rather than inferred: patient lymphoblasts and fibroblasts express only
      the wild-type allele and carry roughly half the normal transcript and
      protein.

      The report accompanying this entry attributes a sentence about "the
      majority of reported pathogenic mutations" to the cohort paper. It is not
      in that source - it is in PMID:41859620, which this entry now cites
      separately. See the top-level notes for why a misattributed quote is a
      different defect from a fabricated one.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 12 cases with loss-of-function CAPRIN1 variants
        explanation: >-
          The cohort and the variant class.
      - reference: PMID:35977029
        reference_title: "De novo variants in genes regulating stress granule assembly associate with neurodevelopmental disorders."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We validated that NDD-related de novo variants in newly implicated and
          known NDD genes, such as CAPRIN1, disrupt the interaction of the core
          SG network and interfere with SG formation
        explanation: >-
          Independent functional corroboration of CAPRIN1 as an NDD gene,
          reached from a different direction: this study ascertained through
          stress-granule assembly regulators rather than through CAPRIN1, and
          shows that NDD variants in it disrupt stress-granule formation.
          Graded PARTIAL because that is a functional result about the gene, not
          a clinical cohort - it corroborates the gene-disease link without
          replicating the phenotype profile.

          An earlier revision quoted this paper's opening sentence instead,
          which describes an NDD with language problems, intellectual disability
          and behavioural issues. That sentence is about UBAP2L, not CAPRIN1 -
          the quote stopped one word before the gene name that fixes its
          subject, and the resemblance to this entry's three most frequent
          phenotypes was a coincidence between two different disorders. It
          verified as an exact substring throughout.
      - reference: PMID:41859620
        reference_title: "CAPRIN1 (Cell Cycle-Associated Protein 1)-Related Neurodevelopmental Disorder: A Novel Mutation With Ataxia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mutations in the cell cycle-associated protein 1 (CAPRIN1) gene have
          been shown to present with language impairment, speech delay,
          intellectual disability, attention deficit hyperactivity disorder
          (ADHD), autism spectrum disorder (ASD), respiratory problems, limb and
          skeletal anomalies, developmental delay, feeding difficulties,
          seizures, ophthalmologic problems, cerebellar ataxia, dysmorphic
          features, and hearing loss
        explanation: >-
          Extends the reported spectrum by cerebellar ataxia, dysmorphic
          features and hearing loss beyond the twelve features in the defining
          cohort. Graded PARTIAL because this is a background sentence in a
          single case report summarising the literature, not a cohort
          observation with a denominator - which is also why the three added
          features carry no frequency and, for now, no phenotype record. The
          hearing loss is worth noting against the inner-ear Caprin1 deletion
          mouse cited on the extraneural node.
prevalence:
  - population: Published cases worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      Twelve cases in the defining cohort. No point prevalence has been
      estimated. Recorded as a case count rather than a rate; this is also the
      denominator behind every percentage in the phenotypes section, which is
      why those bands are coarse.
    evidence:
      - reference: PMID:35979925
        reference_title: "CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 12 cases with loss-of-function CAPRIN1 variants
        explanation: >-
          The cohort size, which is the denominator for the frequency bands.
animal_models:
  - name: Rng105/Caprin1 knockout mouse
    species: Mouse
    genotype: >-
      Camk2a-Cre;Rng105 conditional forebrain knockout, with constitutive
      Rng105-/- primary neurons for the AMPAR-scaling work
    publication: PMID:29157358
    modeled_mechanisms:
      - target: Impaired Dendritic mRNA Localisation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          The mouse is where the mRNA-localisation mechanism was established,
          including the identity of the mislocalised transcript class.
        limitations: >-
          Fidelity is MODERATE and the reason is a dose mismatch that matters
          for this disease specifically. This model is a complete loss - a
          conditional forebrain knockout, with constitutive nulls for the
          primary-neuron work - while the human disorder is haploinsufficiency.
          A null establishes what Caprin-1 does, not what half of it fails to
          do, and this disease is entirely a claim about half.

          An earlier revision of this entry said the iPSC CAPRIN1+/- neurons
          were the only model at the right dose. That was wrong: a heterozygous
          Rng105+/- mouse exists and is curated below. It does not close the gap
          this link records, because it was behaviourally rather than
          molecularly characterised and does not report dendritic mRNA
          localisation, but it does mean the correct statement is "no model at
          the right dose has been assayed for this readout" rather than "no
          model at the right dose exists".

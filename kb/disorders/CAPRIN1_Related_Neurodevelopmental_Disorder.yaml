- name: Impaired Dendritic mRNA Localisation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Mouse forebrain conditional deletion and constitutive null neurons show reduced dendritic localization of selected transcripts, including AMPA-receptor regulators and Na+/K+-ATPase subunits. AMPA-receptor subunit transcripts themselves were not generally depleted from dendrites. This transport step has not been directly measured in human heterozygous neurons.
  evidence:
  - reference: PMID:29157358
    reference_title: RNG105/caprin1, an RNA granule protein for dendritic mRNA localization, is essential for long-term memory formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These results indicated that various mRNAs, encoding AMPAR regulators involved in AMPAR surface expression and retention to postsynapses, were localized to dendrites in an RNG105-dependent manner.
    explanation: In vivo somatodendritic RNA profiling identifies affected regulator transcripts.
  - reference: PMID:20861386
    reference_title: RNG105 deficiency impairs the dendritic localization of mRNAs for Na+/K+ ATPase subunit isoforms and leads to the degeneration of neuronal networks.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: their localization was limited to the cell soma and proximal dendrites and their motility was reduced in Rng105−/− neurons
    explanation: Cultured null neurons show altered movement and distribution of NKA-related reporter transcripts.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: intracellular mRNA localization
    term:
      id: GO:0008298
      label: intracellular mRNA localization
    modifier: DECREASED
  downstream:
  - target: Reduced Dendritic Sodium-Potassium Pump Activity
    description: Mislocalization of NKA-related transcripts accompanies a compartment-specific pump deficit in null neurons.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced Dendritic AMPA-Receptor Surface Expression
    description: Loss of regulator-transcript localization is proposed to alter AMPA-receptor trafficking.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Homeostatic AMPA-Receptor Scaling
    description: The transport defect and impaired homeostatic scaling coexist in null models; a transcript-specific rescue was not shown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Increased Global Neuronal Translation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: In CRISPR-edited CAPRIN1+/− human cortical neurons, puromycin incorporation indicated increased global protein synthesis at 14 days after neuronal differentiation. The earlier four-day difference was not significant. The finding contradicts a purely positional defect with preserved global translation in all contexts.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6650380
    reference_title: https://oup.silverchair-cdn.com/article-minimal/6650380
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Treatment of hiPSCs-derived neurons with 1 µg/ml puromycin for 30 min resulted in a slightly increased global translation ... neurons 4 days post-ND ... which became significantly higher 14 days post-ND
    explanation: 'Publisher full text of Pavinato et al., Brain 2023, PMID:35979925: CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD. The SUnSET assay distinguishes a nonsignificant early trend from a later significant increase.'
  cell_types:

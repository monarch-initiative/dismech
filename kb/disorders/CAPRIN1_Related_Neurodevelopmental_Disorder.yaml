    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified by exome or genome sequencing 11 additional cases with nonsense or splicing variants affecting donor/acceptor sites
    explanation: 'Publisher full text of Pavinato et al., Brain 2023, PMID:35979925: CAPRIN1 haploinsufficiency causes a neurodevelopmental disorder with language impairment, ADHD and ASD. The clinical series identified heterozygous coding and splice variants.'
- name: RNA analysis of splice and truncating variants
  description: Patient RNA studies demonstrated exon skipping or decay-sensitive mutant transcripts in selected alleles. These are variant-interpretation assays, not a validated standalone diagnostic biomarker; absence of one particular readout would not exclude every CAPRIN1-associated mechanism.

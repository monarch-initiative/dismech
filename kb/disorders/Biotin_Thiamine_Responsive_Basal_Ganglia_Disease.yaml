animal_models:
- species: Mus musculus
  genotype: >-
    Homozygous total-body Slc19a3tm1Said knockout, with a
    Slc19a3-null intestine-specific human SLC19A3 transgenic rescue group
    (SLC19A3int) as a comparator
  background: >-
    JAX stock 017343 knockout embryos were crossed with B6D2F1 females to
    generate the transgenic line; wild-type, knockout, and transgenic
    littermates were compared.
  category: Knockout and tissue-specific rescue
  alleles:
  - Slc19a3tm1Said (The Jackson Laboratory stock 017343)
  - >-
    SLC19A3int (study designation for the intestinal epithelial VIL1-promoter
    human SLC19A3 transgene; integration site and registered allele symbol were
    not reported)
  description: >-
    Total-body loss of Slc19a3 lowered circulating and brain thiamine despite
    an 85 mg/kg thiamine diet and altered the brain metabolome. Intestinal
    human SLC19A3 expression produced circulating vitamers equivalent to
    wild-type animals but did not fully normalize brain thiamine. The study
    supports a tissue-specific requirement for transporter function but models
    thiamine distribution and metabolism rather than the complete human
    neurologic syndrome.
  associated_phenotypes:
  - Reduced plasma thiamine
  - Reduced brain thiamine
  - Altered brain metabolome
  evidence:
  - reference: PMID:37623829
    reference_title: The Impacts of Slc19a3 Deletion and Intestinal SLC19A3 Insertion on Thiamine Distribution and Brain Metabolism in the Mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To evaluate the impact of THTR2 on tissue thiamine status and metabolism,
      we expressed the human SLC19A3 transgene in the intestine of total body
      Slc19a3 knockout (KO) mice.
    explanation: >-
      The abstract directly supports the knockout and intestine-specific human
      transgene comparison; the full methods identify JAX stock 017343 and the
      intestinal epithelial VIL1 promoter but do not report a registered
      integration allele.
  - reference: PMID:37623829
    reference_title: The Impacts of Slc19a3 Deletion and Intestinal SLC19A3 Insertion on Thiamine Distribution and Brain Metabolism in the Mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      KO mice had ~two- and ~three-fold lower plasma and brain thiamine levels
      than WT on the 5× diet.
    explanation: >-
      The knockout directly demonstrates reduced systemic and cerebral thiamine
      despite the high-thiamine diet.
  - reference: PMID:37623829
    reference_title: The Impacts of Slc19a3 Deletion and Intestinal SLC19A3 Insertion on Thiamine Distribution and Brain Metabolism in the Mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The loss of THTR2 reduced levels of nucleic acid and amino acid
      derivatives in the brain.
    explanation: >-
      Untargeted metabolomics connects transporter loss to altered brain
      metabolism.

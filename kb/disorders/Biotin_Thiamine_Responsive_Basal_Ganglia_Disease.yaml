- phase: Outcome depends on treatment timing
  age_range: Any symptomatic age
  notes: >-
    Delay in recognition and vitamin treatment is associated with severe
    residual disability or death, while early treatment can stabilize or improve
    neurologic signs.
  evidence:
  - reference: PMID:27905264
    reference_title: "Biotin-thiamine-responsive basal ganglia disease: catastrophic consequences of delay in diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied six patients in this article in which three died before a diagnosis was established, one was diagnosed lately and is currently severely affected, and two were diagnosed early and are currently stable on treatment.
    explanation: Family data directly support the treatment-timing effect on clinical outcome.
  - reference: PMID:37670342
    reference_title: "Biotin-thiamine responsive basal ganglia disease: a retrospective review of the clinical, radiological and molecular findings of cases in Kuwait with novel variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms resolved completely within 2-week of treatment in two-thirds of
      the symptomatic cases but progressed in six of them to a variety of severe
      symptoms including severe cogwheel rigidity, dystonia and quadriparesis
      due to delayed presentation and management.
    explanation: >-
      The 21-person regional cohort supplies a quantitative treatment-response
      estimate and independently links delay with severe residual disease.

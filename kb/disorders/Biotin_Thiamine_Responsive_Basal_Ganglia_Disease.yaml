  - reference: PMID:27896110
    reference_title: "Whole exome sequencing reveals compound heterozygous mutations in SLC19A3 causing biotin-thiamine responsive basal ganglia disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) was performed at Baylor College of Medicine, Medical Genetics Laboratory and confirmed compound heterozygous frameshift mutations in the SLC19A3 gene in trans
    explanation: Patient sequencing identified biallelic SLC19A3 frameshift variants in trans.
  variants:
  - name: SLC19A3 c.1264A>G (p.Thr422Ala)
    description: >-
      Homozygous p.Thr422Ala is a Saudi founder variant and accounted for most
      cases in a 21-person Kuwait cohort. Structural work places Thr422 in the
      outer transporter region and supports impaired thiamine affinity and
      transport, but this regional enrichment should not be generalized to all
      ancestries.
    evidence:
    - reference: PMID:37670342
      reference_title: "Biotin-thiamine responsive basal ganglia disease: a retrospective review of the clinical, radiological and molecular findings of cases in Kuwait with novel variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two novel homozygous missense SLC19A3 variants were detected in a
        Kuwaiti and a Jordanian individuals, in addition to the previously
        reported Saudi founder homozygous variant, c.1264A > G; p.(Thr422Ala)
        in the remaining cases.
      explanation: >-
        The regional cohort identifies the founder allele and distinguishes it
        from two newly observed homozygous missense variants.
    - reference: PMID:39358356
      reference_title: Structural basis of thiamine transport and drug recognition by SLC19A3.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Structural changes in this region might explain the loss of afﬁnity and
        transport activity of the Thr422Ala mutant.
      explanation: >-
        Cryo-EM-guided interpretation supports a structural basis for impaired
        transport but does not by itself establish clinical severity.

    reference_title: Structural basis of thiamine transport and drug recognition by SLC19A3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report seven cryo-electron microscopy (cryo-EM) structures of the
      human thiamine transporter SLC19A3 in complex with various ligands.
      Conformation-specific nanobodies enable us to capture different states of
      SLC19A3's transport cycle, revealing the molecular details of thiamine
      recognition and transport.
    explanation: >-
      Structural and functional work directly establishes the molecular
      substrate-recognition and transport cycle represented by this node.
  downstream:

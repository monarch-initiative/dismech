discussions:
- discussion_id: gap_biotin_independent_contribution
  prompt: >-
    Does biotin independently improve BTBGD outcomes when added to high-dose
    thiamine, and if so through what mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#High-dose thiamine and biotin supplementation
  - pathophysiology#SLC19A3 thiamine transporter deficiency
  rationale: >-
    Clinical reports generally administer both vitamins without randomized
    component or dose comparisons. Structural and cellular uptake work does not
    detect biotin interaction with SLC19A3, so the historical combination
    regimen should not be interpreted as proof that both components act through
    the transporter.
  evidence:
  - reference: PMID:39358356
    reference_title: Structural basis of thiamine transport and drug recognition by SLC19A3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: biotin does not interact with the transporter
    explanation: >-
      This establishes the lack of observed SLC19A3 binding or uptake effect,
      but does not exclude an independent clinical benefit through another
      mechanism.
- discussion_id: gap_selective_brain_vulnerability
  prompt: >-
    Why does a broadly expressed thiamine-transporter defect preferentially
    injure basal ganglia and other cerebral gray matter during physiologic
    stress?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SLC19A3 thiamine transporter deficiency
  - pathophysiology#Stress-triggered cerebral thiamine-transport failure
  - pathophysiology#Basal ganglia and gray-matter injury
  - animal_models#Mus musculus
  rationale: >-
    Patient-cell studies support impaired stress-induced transporter
    upregulation, and the knockout model shows reduced brain thiamine and
    metabolic changes. Neither establishes why particular gray-matter regions
    are selectively vulnerable or which stress-dependent metabolic bottleneck
    causes the lesion pattern.
  evidence:
  - reference: PMID:24372704
    reference_title: "Stress-induced upregulation of SLC19A3 is impaired in biotin-thiamine-responsive basal ganglia disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      exposure of fibroblasts to stress factors such as acidosis or hypoxia
      markedly upregulated SLC19A3 in control cells, but failed to elevate
      SLC19A3 expression in the patient's fibroblasts.
    explanation: >-
      Patient fibroblasts demonstrate impaired stress adaptation but do not
      resolve regional brain vulnerability.
  - reference: PMID:37623829
    reference_title: The Impacts of Slc19a3 Deletion and Intestinal SLC19A3 Insertion on Thiamine Distribution and Brain Metabolism in the Mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mutation or inhibition of THTR2 may alter the brain metabolome and reduce
      the thiamine reservoir for TDP biosynthesis.
    explanation: >-
      The mouse study provides a metabolic hypothesis while leaving the
      region-selective human injury mechanism unresolved.
review_notes: >-
  This entry is scoped to biallelic SLC19A3-related thiamine metabolism
  dysfunction syndrome 2; SLC19A2-related Rogers syndrome and TPK1 deficiency
  are distinct disorders. Additional phenotypes surfaced by disease-to-phenotype
  auditing were not bulk-imported because many derive from small, founder, or
  age-specific series; age-related presentations are represented as subtypes
  instead. These presentations do not have distinct MONDO or OMIM identifiers,
  so their subtype_term fields are intentionally omitted. No reusable public
  omics or phenotype dataset accession was verified:
  the mouse metabolomics report stated that deposition would occur without
  providing an accession, and the iPSC characterization data were available on
  request. The datasets section is therefore intentionally omitted. Treatment
  evidence is observational, the independent role of biotin remains unresolved,
  and the stress-triggered mechanism is retained as provisional. The mouse
  study reports JAX stock 017343 for Slc19a3tm1Said but no registered integration
  allele for SLC19A3int. The unedited patient iPSC lines lack an isogenic control
  and a measured transport, metabolic, or injury phenotype, so they are retained
  as a model resource without a modeled_mechanisms link rather than as
  mechanistic validation.

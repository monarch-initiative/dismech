has_subtypes:
- name: Early-infantile BTBGD
  display_name: Early-infantile biotin-thiamine-responsive basal ganglia disease
  classification: age_at_presentation
  description: >-
    Presentation before age three months, with vomiting, feeding difficulty,
    encephalopathy, hypotonia, seizures, and respiratory failure. This form has
    a poorer prognosis than classic childhood and adult presentations, including
    despite vitamin treatment in some infants.
  evidence:
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early-infantile BTBGD presents before age three months with vomiting,
      feeding difficulties, encephalopathy, hypotonia, seizures, and respiratory
      failure.
    explanation: >-
      The current GeneReviews summary defines the early-infantile presentation
      and its core manifestations.
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prompt administration of biotin and thiamine early in the disease course
      results in partial or complete improvement within days in classic and
      adult BTBGD; however, most infants with early-infantile BTBGD have a poor
      outcome.
    explanation: >-
      GeneReviews directly supports the poorer prognosis of the early-infantile
      presentation despite the treatability of later presentations.
- name: Classic childhood BTBGD
  display_name: Classic childhood biotin-thiamine-responsive basal ganglia disease
  classification: age_at_presentation
  description: >-
    Usually presents between ages three and ten years with recurrent subacute
    encephalopathy, confusion, seizures, ataxia, cranial motor abnormalities,
    dysphagia, dystonia, and rigidity. Febrile illness, mild trauma, or other
    stress commonly precedes an episode.
  evidence:
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic BTBGD presents between ages three and ten years with recurrent
      subacute encephalopathy manifesting as confusion, seizures, ataxia,
      supranuclear facial palsy, external ophthalmoplegia, and/or dysphagia that,
      if left untreated, can eventually lead to coma and even death.
    explanation: >-
      The current GeneReviews summary defines the age range and clinical
      spectrum of classic BTBGD.
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dystonia and cogwheel rigidity are nearly always present; hyperreflexia,
      ankle clonus, and Babinski responses are common. Hemiparesis or
      quadriparesis may be seen. Episodes are often triggered by febrile illness
      or mild trauma or stress.
    explanation: >-
      GeneReviews supports the movement-disorder manifestations and common
      physiologic-stress triggers included in the classic presentation.
- name: Adult Wernicke-like BTBGD
  display_name: Adult Wernicke-like biotin-thiamine-responsive basal ganglia disease
  classification: age_at_presentation
  description: >-
    A rare presentation after age ten years with acute status epilepticus,
    ataxia, nystagmus, diplopia, or ophthalmoplegia. The published clinical base
    is much smaller than for childhood BTBGD.
  evidence:
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult Wernicke-like encephalopathy BTBGD, described in three individuals
      to date, presents after age ten years with acute onset of status
      epilepticus, ataxia, nystagmus, diplopia, and ophthalmoplegia.
    explanation: >-
      GeneReviews defines the adult presentation and explicitly conveys its
      limited case base.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    BTBGD is caused by biallelic pathogenic variants in SLC19A3. When both
    parents are heterozygous, each sibling has a 25% chance of being affected
    at conception.
  evidence:
  - reference: ORPHA:65284
    reference_title: "Biotin-thiamine-responsive basal ganglia disease (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet records autosomal recessive inheritance.
  - reference: PMID:36657988
    reference_title: "Child Neurology: Infantile Biotin Thiamine Responsive Basal Ganglia Disease: Case Report and Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biotin thiamine responsive basal ganglia disease (BTRBGD) is an inherited autosomal recessive disorder that results from the inability of thiamine to cross the blood-brain barrier.
    explanation: Clinical case report and review states the autosomal recessive inheritance and thiamine-transport basis.
  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an SLC19A3 pathogenic
      variant, each sib of an affected individual has at conception a 25%
      chance of being affected, a 50% chance of being an asymptomatic carrier,
      and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      GeneReviews provides the explicit autosomal-recessive recurrence risks
      requested in review.

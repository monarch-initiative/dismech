  - reference: PMID:24260777
    reference_title: "Biotin-Thiamine-Responsive Basal Ganglia Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biotin (5-10 mg/kg/day) and thiamine (up to 40 mg/kg/day with a maximum
      of 1,500 mg daily) are given orally as early in the disease course as
      possible and are continued lifelong.
    explanation: >-
      Current GeneReviews guidance supports early initiation and lifelong oral
      thiamine and biotin treatment.
  - reference: ORPHA:65284
    reference_title: "Biotin-thiamine-responsive basal ganglia disease (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The disease usually becomes symptomatic in childhood and is life-threatening if left untreated, but symptoms can be reversed and progression prevented by treatment with high doses of biotin and thiamine.
    explanation: Orphanet directly supports high-dose biotin and thiamine as disease-modifying treatment.
  - reference: PMID:35532649
    reference_title: "Biotin-Responsive Basal Ganglia Disease: Treatable Metabolic Disorder with SLC19A3 Mutation Presenting as Rapidly Progressive Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High doses of biotin and thiamine are the mainstay of the treatment to achieve a favorable outcome.
    explanation: Adult case report and review supports high-dose vitamin treatment.
  - reference: PMID:36657988
    reference_title: "Child Neurology: Infantile Biotin Thiamine Responsive Basal Ganglia Disease: Case Report and Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is considered a treatable condition if vitamin supplementation, most commonly with thiamine and biotin, is initiated early.
    explanation: Child neurology review emphasizes early thiamine/biotin supplementation.
  - reference: PMID:37670342
    reference_title: "Biotin-thiamine responsive basal ganglia disease: a retrospective review of the clinical, radiological and molecular findings of cases in Kuwait with novel variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms resolved completely within 2-week of treatment in two-thirds of
      the symptomatic cases but progressed in six of them to a variety of
      severe symptoms including severe cogwheel rigidity, dystonia and
      quadriparesis due to delayed presentation and management.
    explanation: >-
      The 21-person retrospective cohort links prompt management to recovery
      while documenting severe outcomes after delay.
  review_notes: >-
    No randomized component or dose-comparison trial separates the effects of
    thiamine and biotin. Structural and cellular uptake evidence indicates that
    biotin does not bind SLC19A3, but that finding does not exclude a clinical
    contribution through another mechanism.

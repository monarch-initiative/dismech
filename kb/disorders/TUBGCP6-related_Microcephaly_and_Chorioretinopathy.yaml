pathophysiology:
- name: Biallelic Loss of Tubulin Gamma Complex Associated Protein 6
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in TUBGCP6 remove or reduce a component
    of the gamma-tubulin ring complex, the machine that nucleates microtubules
    from the centrosome. The mechanism is the same class as TUBGCP4-related
    MCCRP3: insufficient nucleating capacity rather than a defective tubulin
    subunit. Reported alleles include compound heterozygous deletions, which makes
    the loss-of-function nature explicit rather than inferred.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    allele_type: loss-of-function, including deletions
    description: >-
      Biallelic loss-of-function alleles, described as such by the primary
      literature, and including compound heterozygous deletions. This contrasts
      with the dominant missense mechanisms of the tubulin isotype genes and
      matches the recessive loss-of-function pattern of the other
      gamma-tubulin-complex disorder, TUBGCP4-related MCCRP3.

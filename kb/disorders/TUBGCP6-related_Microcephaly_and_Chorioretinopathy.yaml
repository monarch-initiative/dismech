name: TUBGCP6-related Microcephaly and Chorioretinopathy
creation_date: "2026-08-20T17:45:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly and chorioretinopathy 1
  term:
    id: MONDO:0009624
    label: microcephaly and chorioretinopathy 1
description: >-
  TUBGCP6-related microcephaly and chorioretinopathy (MCCRP1) is a rare
  autosomal-recessive neuro-ophthalmic disorder caused by biallelic TUBGCP6
  variants. The reported phenotype combines congenital microcephaly and
  neurodevelopmental impairment with variable chorioretinal abnormalities and
  visual impairment. Short stature, pachygyria or abnormal sulcation,
  ventriculomegaly, cerebellar vermis hypoplasia, seizures, and retinal
  detachment have each been reported in source-specific cohorts or families.

  TUBGCP6 encodes a component of the gamma-tubulin ring complex. In DLD-1 cells,
  acute experimental degradation of endogenous TUBGCP6 causes parallel defects
  in centriole duplication and centrosome-driven microtubule nucleation, with
  monopolar-spindle mitotic arrest and reduced proliferation. These experiments
  establish cellular functions of TUBGCP6 but do not test patient alleles or
  neural or retinal developmental models, so the bridge from the cellular
  phenotype to the human brain and eye manifestations remains indirect.

  The combination of microcephaly and chorioretinopathy can resemble congenital
  toxoplasmosis or cytomegalovirus infection. Molecular confirmation is
  important because reported alleles include small sequence changes and a
  structural deletion detected by genome sequencing.

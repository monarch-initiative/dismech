name: TUBGCP6-related Microcephaly and Chorioretinopathy
creation_date: "2026-08-20T17:45:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly and chorioretinopathy 1
  term:
    id: MONDO:0009624
    label: microcephaly and chorioretinopathy 1
description: >-
  TUBGCP6-related microcephaly and chorioretinopathy (MCCRP1) is the second
  gamma-tubulin-complex disease, and the prototype of the microcephaly-with-
  chorioretinopathy group. Biallelic loss-of-function variants in TUBGCP6, which
  encodes tubulin gamma complex associated protein 6, produce microcephaly,
  cognitive impairment, dysmorphic features and variable ophthalmological
  anomalies including chorioretinopathy. Like its sibling disorder MCCRP3
  (TUBGCP4), the lesion is in the gamma-tubulin ring complex that nucleates
  microtubules rather than in a tubulin subunit itself.

  Two features make the entry clinically consequential out of proportion to its
  rarity. First, microcephaly can be recognized prenatally and visual impairment
  becomes evident during the first year of life, so the diagnosis is often in play
  before a child can report symptoms. Second, the clinical presentation resembles
  acquired congenital infections - toxoplasmosis and cytomegalovirus - which
  means the differential is between an untreatable inherited disorder with a 25%
  sibling recurrence risk and an acquired condition with neither implication.
  Getting that wrong misdirects both management and family planning.

  The disorder remains very rare. As of the most recent review, only seven
  molecularly confirmed patients from five unrelated families had been reported,
  with four further unrelated patients added including one prenatal diagnosis.

discussions:
- discussion_id: gap_tubgcp6_phenotype_range_from_a_dozen_patients
  prompt: >-
    Is the reported TUBGCP6 phenotype the true phenotype, or the severe tail of
    it, given that the entire literature rests on roughly a dozen patients
    ascertained by microcephaly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Brain and Retinal Development
  - phenotypes#Microcephaly
  rationale: >-
    Seven molecularly confirmed patients from five families, plus four more in
    the most recent report, is the whole evidence base. Every one of them was
    found because microcephaly was noticed - so microcephaly appears in 100% of
    reported cases by construction, and any milder presentation without
    microcephaly would be systematically invisible. The comparison case is
    instructive: the sibling disorder TUBGCP4-related MCCRP3 was ascertained the
    same way, and the closely related TUBG1 tubulinopathy turned out on wider
    sequencing to include a normocephalic individual with a normal MRI. Whether
    TUBGCP6 has an equivalent mild tail is untested. Unbiased sequencing in
    cohorts ascertained for isolated chorioretinopathy or for intellectual
    disability without microcephaly would answer it, and the answer changes who
    gets offered testing.
  evidence:
  - reference: PMID:37031378
    reference_title: "Biallelic variants in TUBGCP6 result in microcephaly and chorioretinopathy 1: Report of four cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only seven molecularly confirmed patients from five unrelated
      families have been reported.
    explanation: >-
      The size of the evidence base, which is what makes ascertainment bias the
      dominant concern.
  - reference: PMID:37031378
    reference_title: "Biallelic variants in TUBGCP6 result in microcephaly and chorioretinopathy 1: Report of four cases and a literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report expands the molecular and phenotypic spectrum of TUBGCP6 and
      includes additional prenatal findings associated with MCCRP1.
    explanation: >-
      Each new report has expanded the spectrum, which is itself evidence the
      spectrum is not yet closed.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

  Deliberately NOT a member of the Tubulinopathies grouping, for the same reason
  as TUBGCP4-related MCCRP3: TUBGCP6 encodes a gamma-tubulin COMPLEX associated
  protein rather than a tubulin isotype, and the disorder does not conform to the
  microtubule-dependent neuronal migration module.

  Curated alongside TUBGCP4-related Microcephaly and Chorioretinopathy as a pair.
  They are the two gamma-TuRC component disorders, share a mechanism class
  (recessive loss of function reducing nucleating capacity) and a phenotype
  (microcephaly plus chorioretinopathy), and differ mainly in which component is
  lost. If a Gamma-Tubulin Complex Disorders grouping is ever created, these two
  plus TUBG1 are its members.

  One evidence item is quoted from the TUBGCP4 paper (PMID:25817018) to establish
  the function of the gamma-TuRC, since the TUBGCP6 clinical papers state the
  gene's membership of the complex without describing what the complex does.

  All evidence snippets are quoted from cached abstracts.

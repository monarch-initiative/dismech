- name: Impaired Brain and Retinal Development
  biological_scale: TISSUE
  description: >-
    The developmental endpoint. Brain growth is reduced to the point of
    microcephaly recognizable prenatally, and the retina and choroid develop
    abnormally, with visual impairment evident during the first year of life.
    Dysmorphic features accompany both. The timing is informative: a prenatally
    detectable microcephaly and a first-year visual deficit place the critical
    period in fetal development rather than in postnatal maintenance.

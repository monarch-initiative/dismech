differential_diagnoses:
- name: Congenital toxoplasmosis or cytomegalovirus infection
  description: >-
    Acquired congenital infection can combine microcephaly with chorioretinal
    abnormalities. Infection testing and demonstration of biallelic TUBGCP6
    variants distinguish these acquired conditions from MCCRP1.
  distinguishing_features:
  - MCCRP1 is confirmed by biallelic TUBGCP6 variants.
  evidence:
  - reference: PMID:37031378
    reference_title: "Biallelic variants in TUBGCP6 result in microcephaly and chorioretinopathy 1: Report of four cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation resembles the findings in some acquired
      conditions such as congenital toxoplasmosis and cytomegalovirus infections;
      thus, it is important to recognize and diagnose this syndrome in view of
      its impact on patient health management and familial reproductive plans.
    explanation: Directly identifies the acquired-infection differential.
- name: KIF11-related microcephaly with chorioretinal dysplasia
  description: >-
    KIF11-related disease overlaps through microcephaly, chorioretinal dysplasia,
    retinal folds or detachment, and a FEVR-like presentation. Heterozygous KIF11
    variants and possible lymphedema distinguish it from recessive TUBGCP6 MCCRP1.
  distinguishing_features:
  - KIF11-related disease is associated with heterozygous KIF11 variants.
  - Lymphedema and FEVR-like peripheral avascularity favor KIF11-related disease.
  evidence:
  - reference: PMID:25124931
    reference_title: Phenotypic overlap between familial exudative vitreoretinopathy and microcephaly, lymphedema, and chorioretinal dysplasia caused by KIF11 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal detachment with avascularity of the peripheral retina, typically
      associated with familial exudative vitreoretinopathy (FEVR), can result
      from mutations in KIF11, a gene recently identified to cause microcephaly,
      lymphedema, and chorioretinal dysplasia (MLCRD) as well as chorioretinal
      dysplasia, microcephaly, and mental retardation (CDMMR).
    explanation: Defines the overlapping KIF11-associated neuro-ophthalmic phenotype.
  - reference: PMID:25124931
    reference_title: Phenotypic overlap between familial exudative vitreoretinopathy and microcephaly, lymphedema, and chorioretinal dysplasia caused by KIF11 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four novel heterozygous KIF11 mutations and 1 previously published mutation
      were identified in probands with FEVR: p.A218Gfs*15, p.E470X, p.R221G,
      c.790-1G>T, and the previously described heterozygous p.R47X. Documentation
      of peripheral avascular areas on intravenous fluorescein angiography was
      possible in 2 probands with fibrovascular proliferation demonstrating
      phenotypic overlap with FEVR.
    explanation: Supports the heterozygous KIF11 and peripheral-avascularity distinctions.
- name: TUBGCP4-related microcephaly and chorioretinopathy
  description: >-
    TUBGCP4-related disease is a distinct autosomal-recessive
    gamma-tubulin-complex disorder with overlapping microcephaly and
    chorioretinopathy. Molecular identification of TUBGCP4 rather than TUBGCP6
    variants distinguishes it.
  distinguishing_features:
  - Causative biallelic variants are in TUBGCP4 rather than TUBGCP6.
  - Patient-fibroblast functional findings reported for TUBGCP4 must not be transferred to TUBGCP6.
  evidence:
  - reference: PMID:25817018
    reference_title: Mutations in TUBGCP4 alter microtubule organization via the γ-tubulin ring complex in autosomal-recessive microcephaly with chorioretinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified TUBGCP4 variants in individuals with autosomal-recessive
      microcephaly and chorioretinopathy. Whole-exome sequencing performed on one
      family with two affected siblings and independently on another family with
      one affected child revealed compound-heterozygous mutations in TUBGCP4.
    explanation: Directly defines the overlapping but genetically distinct TUBGCP4 disorder.
- name: PLK4-related microcephalic primordial dwarfism
  description: >-
    PLK4-related disease overlaps through severe microcephaly, growth failure,
    retinopathy, and additional congenital anomalies. Molecular identification
    of PLK4 rather than TUBGCP6 variants establishes the distinct diagnosis; PLK4
    cell and zebrafish experiments do not provide TUBGCP6 functional evidence.
  distinguishing_features:
  - Causative variants are in PLK4 rather than TUBGCP6.
  evidence:
  - reference: PMID:25344692
    reference_title: Mutations in PLK4, encoding a master regulator of centriole biogenesis, cause microcephaly, growth failure and retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify mutations in the genes encoding PLK4 kinase, a master
      regulator of centriole duplication, and its substrate TUBGCP6 in
      individuals with microcephalic primordial dwarfism and additional
      congenital anomalies, including retinopathy, thereby extending the human
      phenotypic spectrum associated with centriole dysfunction.
    explanation: Establishes the overlapping PLK4 and TUBGCP6 clinical ascertainment.
discussions:
- discussion_id: gap_tubgcp6_patient_allele_and_developmental_models
  prompt: >-
    Do biallelic patient alleles reproduce the acute TUBGCP6-depletion phenotype
    in neural and retinal developmental systems, and which cellular defect
    drives each organ phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced TUBGCP6 Function
  - pathophysiology#Reduced Cell Proliferation
  - pathophysiology#Abnormal Cerebral Development
  - pathophysiology#Abnormal Chorioretinal Development
  rationale: >-
    Acute loss of endogenously tagged TUBGCP6 in DLD-1 cells has a specific,
    rescuable effect on centriole duplication and also reduces nucleation and
    proliferation. The model does not contain a disease allele and is neither
    neural nor retinal. Human reports establish the brain and eye endpoints but
    do not measure the intervening mechanism. Patient-derived cells, cerebral or
    retinal organoids, and allele-specific rescue experiments are needed to test
    the bridge and to distinguish effects of nucleation, centriole duplication,
    mitotic arrest, and other unknown intermediates.
  evidence:
  - reference: PMID:31874114
    reference_title: WBP11 is required for splicing the TUBGCP6 pre-mRNA to promote centriole duplication.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of a TUBGCP6 transgene fully rescued centriole duplication in
      auxin-treated TUBGCP6AID cells, demonstrating that this transgene was able
      to functionally compensate for the loss of the endogenous protein (Fig.
      S5, F and G).
    explanation: Establishes a specific rescuable cellular phenotype in the acute DLD-1 model.
  - reference: PMID:37031378
    reference_title: "Biallelic variants in TUBGCP6 result in microcephaly and chorioretinopathy 1: Report of four cases and a literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features of this disorder include microcephaly, cognitive
      impairment, dysmorphic features, and variable ophthalmological anomalies
      including chorioretinopathy.
    explanation: Establishes the human endpoints without testing the cellular bridge.
notes: >-
  Reviewed against the original 2012 clinical report, later TUBGCP6 case series,
  the 2024 deletion family, and a direct 2020 TUBGCP6-depletion study. MCCRP1 is
  maintained as the MONDO:0009624 TUBGCP6 disorder and is not collapsed into
  TUBGCP4-, TUBGCP2-, TUBG1-, KIF11-, PLK4-, or Seckel-spectrum diagnoses.

  PMID:31874114 provides direct in-vitro evidence from acute degradation of both
  endogenously tagged TUBGCP6 alleles in DLD-1 cells. It does not test germline
  patient alleles, neural progenitors, retinal cells, or an animal model.
  PMID:25344692 provides patient-level TUBGCP6 overlap in its abstract, but its
  PLK4 cellular and zebrafish experiments are not transferred to TUBGCP6.
  PMID:25817018 is used only to define the TUBGCP4 differential, not as evidence
  for a TUBGCP6 mechanism.

  The cached records for PMID:37031378 and PMID:39634241 expose abstract text for
  snippet validation. PMID:22279524 and PMID:31874114 expose cached full text.
  No disease-specific treatment outcome, clinical trial, animal model, dataset,
  or population prevalence was identified in the source-local review, so none is
  asserted here.

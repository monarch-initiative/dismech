pathophysiology:
- name: Reduced TUBGCP6 Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    The 2023 disease review describes biallelic TUBGCP6 variants as
    loss-of-function, and reported alleles include sequence changes and
    deletions. That disease-level assignment still requires allele-level
    calibration: the founding p.Ter1820Gly read-through allele was predicted to
    extend the protein or promote non-stop-mediated decay but was not
    functionally tested in the founding report. Acute depletion of TUBGCP6 in
    DLD-1 cells models reduced protein availability, not any specific patient
    genotype.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    allele_type: reported sequence and deletion alleles with predicted or asserted loss of function
    description: >-
      Biallelic variants are required, but the allelic configuration varies
      among families. The disease literature assigns loss of function broadly,
      but p.Ter1820Gly remains a predicted rather than experimentally
      demonstrated loss-of-function allele.

- name: NDUFS8-silenced and NDUFS8-knockout human endothelial cells
  description: >-
    Human umbilical vein and other endothelial cells with NDUFS8 silenced by
    shRNA or deleted by CRISPR/Cas9. This is the only NDUFS8-specific
    loss-of-function model in the cited literature, and its value here is that
    it isolates NDUFS8 from the other complex I genes that the patient-fibroblast
    panels unavoidably pool. It reproduces the bioenergetic lesion cleanly:
    reduced oxygen consumption and complex I activity, decreased ATP,
    mitochondrial depolarization, raised ROS and lipid oxidation.

    What it also reports - an NDUFS8-dependent ATP-Akt-mTOR-angiogenesis axis,
    with retinal angiogenesis inhibited in vivo by endothelial-specific
    knockdown - is deliberately NOT curated as a disease mechanism on this entry.
    Endothelial cells are not the tissue that fails in MC1DN2, vascular
    maldevelopment is not a reported patient phenotype, and the paper's own
    framing is about angiogenesis biology rather than about this disease. The
    open question is recorded as a HUMAN_MODEL_MISMATCH discussion instead.

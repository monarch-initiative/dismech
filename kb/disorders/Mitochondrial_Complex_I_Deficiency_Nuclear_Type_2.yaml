animal_models:
- name: Ndi1p-expressing Caenorhabditis elegans complex I bypass model
  species: Caenorhabditis elegans
  genotype: Transgenic expression of Saccharomyces cerevisiae NDI1 (alternative NADH dehydrogenase Ndi1p)
  publication: PMID:26124772
  description: >-
    A bypass rather than a disease model. Yeast Ndi1p is a single-subunit
    alternative NADH dehydrogenase that oxidizes NADH and reduces ubiquinone
    without pumping protons, so expressing it in a complex I-deficient nematode
    restores the electron path around the missing enzyme. It complements a complex
    I-deficient C. elegans strain with improvements in reproduction and
    whole-organism respiration, which is what makes it a tool for asking which
    complex I defects are bypassable - and, by extension, a proof of principle for
    gene-therapy-style bypass in NDUFS8-type core-subunit disease.
  modeled_mechanisms:
  - target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
    relationship: RESCUES
    fidelity: LOW
    description: >-
      Ndi1p functionally substitutes for the lost NADH-ubiquinone oxidoreductase
      step, restoring respiration at the whole-organism level.
    limitations: >-
      An invertebrate expressing a fungal enzyme, with no NDUFS8 allele involved:
      the model addresses the general bypassability of a complex I block, not this
      entity's specific lesion. Ndi1p also does not pump protons, so it restores
      electron flow and NAD+ regeneration without restoring the proton-motive
      contribution complex I normally makes - a partial rescue by construction.
    readouts:
    - name: Whole-organism respiration and reproduction
      target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
      direction: RESTORED
      interpretation: >-
        Improvement in both indicates the bypass integrates into the respiratory
        chain functionally, not merely biochemically.
      evidence:
      - reference: PMID:26124772
        reference_title: "Caenorhabditis elegans expressing the Saccharomyces cerevisiae NADH alternative dehydrogenase Ndi1p, as a tool to identify new genes involved in complex I related diseases."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The Saccharomyces cerevisiae NDI1 gene, encoding the mitochondrial
          internal NADH dehydrogenase was previously shown to complement a complex
          I deficient strain in Caenorhabditis elegans with notable improvements
          in reproduction and whole organism respiration.
        explanation: >-
          The rescue readout in the bypass model.
    evidence:
    - reference: PMID:26124772
      reference_title: "Caenorhabditis elegans expressing the Saccharomyces cerevisiae NADH alternative dehydrogenase Ndi1p, as a tool to identify new genes involved in complex I related diseases."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These features indicate that Ndi1p can functionally integrate the
        respiratory chain, allowing complex I deficiency complementation.
      explanation: >-
        States that the bypass integrates functionally, which is what makes the
        model informative for this node.
diagnosis:
- name: Respiratory Chain Enzymology Demonstrating Isolated Complex I Deficiency
  description: >-
    Measurement of respiratory chain enzyme activities establishes an isolated
    complex I deficiency before any gene is implicated, and it is what selects a
    patient for nuclear complex I gene analysis at all. Its limitation in this
    entity is the size of the deficit: a partial defect is compatible with the
    diagnosis, so a mildly reduced activity should not close the question.
  evidence:
  - reference: PMID:9837812
    reference_title: "The first nuclear-encoded complex I mutation in a patient with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cycle sequencing of amplified NDUFS8 cDNA of 20 patients with isolated
      enzymatic complex I deficiency revealed two compound heterozygous
      transitions in a patient with neuropathologically proven Leigh syndrome.
    explanation: >-
      Records the biochemical entry criterion for the cohort in which the gene
      was found.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the complex I NDUFS8 gene from Leigh syndrome patients with
      isolated complex I deficiency revealed that one patient with late-onset
      disease and partial complex I defect was a compound heterozygote for two
      novel mutations in NDUFS8 gene.
    explanation: >-
      Shows the biochemical defect may be partial, which limits the negative
      predictive value of a mild result.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurements of lactate and pyruvate concentrations in blood, urine, and
      CSF were also repeatedly normal.
    explanation: >-
      A high-value diagnostic negative that SUPPORTS this diagnostic entry rather
      than refuting it: routine metabolic screening was repeatedly normal in a
      patient who nonetheless had 31-43% residual complex I activity and
      Leigh-compatible putaminal lesions, which is precisely why the enzymology
      is worth doing. A normal lactate does not exclude the diagnosis and must
      not stop the workup. (The same snippet is REFUTE on the Lactic Acidosis
      phenotype, where the claim it bears on is different - that lactic acidosis
      is a feature of this entity.)
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex I was specifically reduced to 31% and 43% of control values after
      normalization by citrate synthase in muscle and lymphoblast cells.
    explanation: >-
      What the enzymology found in the same patient whose lactate was normal -
      the reason the assay is worth doing despite a reassuring metabolic screen.
- name: Diagnostic Negatives That Narrow the Differential
  description: >-
    A cluster of unremarkable results is curated deliberately, because in this
    entity the negatives do more diagnostic work than most of the positives. In
    the late-onset patient, electromyography and nerve conduction studies were
    normal at age 7; histochemistry and electron microscopy of skeletal muscle
    were unremarkable; and muscle mtDNA screening for rearrangements by Southern
    blot and for common point mutations was negative. The only abnormality on
    routine metabolic screening was a mild rise in plasma alanine, with organic
    acids, carnitines and repeated lactate and pyruvate all normal.

    Each of those narrows the field. Normal EMG and nerve conduction argue
    against a neuropathic or primary myopathic process; unremarkable muscle
    histochemistry and EM remove the findings a curator might expect of a
    mitochondrial disease - ragged red fibres, abnormal mitochondrial
    morphology - and show that neither is required; a negative muscle mtDNA screen is what redirects
    the search to the NUCLEAR genome, which is the whole reason this entity has a
    "nuclear type" in its name. The mild alanine elevation is the one positive
    among them and is the classic soft pointer to a respiratory chain defect,
    reflecting transamination of accumulated pyruvate.

    The practical warning is that a child with this disease can pass every
    first-line test. Respiratory chain enzymology on isolated mitochondria, and
    then nuclear sequencing, are what find it.
  evidence:
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electromyography and nerve conduction studies at age 7 did not reveal any
      abnormalities.
    explanation: >-
      Normal neurophysiology in a genetically confirmed patient, arguing against
      a neuropathic or primary myopathic process.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histochemistry and electron microscopy performed on the skeletal muscle
      were unremarkable.
    explanation: >-
      Shows that the muscle-biopsy findings often taken as hallmarks of
      mitochondrial disease are not required for this diagnosis.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The muscle mitochondrial DNA (mtDNA) screening for rearrangement mutations
      by Southern blotting and common point mutations was negative.
    explanation: >-
      The negative that redirects the search from the mitochondrial to the
      nuclear genome - the step that makes a "nuclear type" diagnosis reachable.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine organic acids and plasma amino acids were normal except for a mild
      increase in alanine.
    explanation: >-
      The single positive among the routine screens, and the classic soft
      pointer to a respiratory chain defect.
- name: Untargeted Exome Sequencing
  description: >-
    The decisive test in this entity, and for a specific reason. With over a
    thousand nuclear genes capable of causing mitochondrial disease, the
    conventional approach is targeted analysis guided by the clinical and
    biochemical picture - and that approach systematically fails whenever the
    presentation is atypical. NDUFS8 would not be on anyone's targeted panel for
    a child presenting with progressive external ophthalmoplegia. Exome
    sequencing found it there because it was not looking for it.
  evidence:
  - reference: PMID:23430795
    reference_title: "NDUFS8-related Complex I Deficiency Extends Phenotype from \"PEO Plus\" to Leigh Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With over 1,000 nuclear genes that could potentially cause a mitochondrial
      disorder, the current diagnostic approach requires targeted molecular
      analysis, guided by a combination of clinical and biochemical features.
    explanation: >-
      States the scale of the genetic search space that makes targeted analysis
      the default and untargeted sequencing necessary.
  - reference: PMID:23430795
    reference_title: "NDUFS8-related Complex I Deficiency Extends Phenotype from \"PEO Plus\" to Leigh Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Being untargeted to specific genes, whole exome analysis has the potential
      to re-write the phenotype and reveal an unexpected molecular aetiology, as
      illustrated by this family.
    explanation: >-
      The authors' own statement of why untargeted sequencing was what solved
      this family.
discussions:
- discussion_id: mc1dn2_genotype_phenotype_range
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a structural core subunit of complex I produce a range from
    death within months to a late-onset "PEO plus" phenotype, and what predicts
    where a given patient will fall in it?
  attaches_to:
  - "pathophysiology#NDUFS8 Loss of Function"
  - "pathophysiology#Reduced Complex I Amount and Intrinsic Catalytic Activity"
  - "pathophysiology#Leigh Syndrome and Mitochondrial Encephalomyopathy"
  rationale: >-
    The expectation is explicit in the literature and it is wrong: NDUFS8 is a
    structural core protein and mutations were expected to cause infantile onset
    and severe disease. The index patient met that expectation. A second patient
    had late-onset disease with a partial biochemical defect. Three siblings
    presented as progressive external ophthalmoplegia, a phenotype so far from
    expectation that the gene would not normally have been considered.

    Two candidate explanations are available in this entry's own data, and they
    are not the same kind of answer.

    The first is structural and allele-specific, and it is the closest thing to a
    partial answer that exists. The late-onset patient's two substitutions, P85L
    and R138H, both change highly conserved residues - but NEITHER disrupts the
    cysteine motifs that coordinate the [4Fe-4S] clusters, so the reporting
    authors argue that electron transport through the subunit should be partially
    preserved. That is a concrete, testable structural criterion: alleles that
    spare the cysteine motifs should be milder than alleles that do not. It has
    not been tested across an allelic series, and it does not obviously explain
    the PEO-plus family, whose variants are not characterised in this way.

    The second is quantitative and gene-agnostic: patients differ in how much of
    their complex I deficit is loss of enzyme versus loss of intrinsic catalytic
    competence, and that activity-to-amount ratio varies between individuals. If
    the ratio tracked clinical severity it would be both an explanation and a
    prognostic assay.

    A third observation sits between them and may be the most tractable. The
    late-onset patient differed from the infantile index patient in one specific
    respect at the protein level: a drastic reduction in the 39-kDa subunit,
    which is proposed to occupy the same membrane-peripheral domain boundary as
    TYKY and to interact with it. If which partner subunits an allele
    destabilises varies by allele, that is a measurable intermediate between
    "where the substitution sits" and "how severe the disease is" - and it is
    measurable by western blot on the fibroblasts these patients already have.

    None of the three has been tested across an NDUFS8 allelic series, and the
    series is tiny - roughly 17 patients described in the literature to date, all
    carrying missense alleles - so none can be powered from clinical data alone.
    The proposed experiment below is designed to test them together, since the
    structural hypothesis predicts which alleles should show which ratio.
  proposed_experiments:
  - experiment_id: mc1dn2_allelic_series_activity_amount
    name: Activity-to-amount ratio across an NDUFS8 allelic series
    description: >-
      Measure complex I amount and activity separately in fibroblasts from every
      available NDUFS8 patient across the full reported allelic series - eleven
      distinct missense alleles in homozygous and compound heterozygous
      combinations, not the two families the primary reports describe -
      computing the activity/amount ratio per allele,
      and test whether that ratio correlates with age of onset and survival -
      and, specifically, whether alleles that spare the cysteine motifs
      coordinating the iron-sulfur clusters show a higher ratio than those that
      do not, as the structural hypothesis predicts. If the reported alleles are
      too few, complement with a saturating set of NDUFS8 missense variants
      introduced into a common cell background, or into the Yarrowia lipolytica
      homologue already used to validate the patient alleles.
  evidence:
  - reference: PMID:23430795
    reference_title: "NDUFS8-related Complex I Deficiency Extends Phenotype from \"PEO Plus\" to Leigh Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NDUFS8 is a nuclear-encoded structural core protein of complex I, and
      mutations are expected to cause infantile onset and severe disease.
    explanation: >-
      States the expectation that the observed phenotypic range contradicts.
  - reference: PMID:23430795
    reference_title: "NDUFS8-related Complex I Deficiency Extends Phenotype from \"PEO Plus\" to Leigh Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients had a later onset, milder and a clinically distinct
      phenotype, and this gene would not normally be considered in this context.
    explanation: >-
      The observation refuting that expectation, in genetically confirmed
      patients.
  - reference: PMID:18435906
    reference_title: "Mitigation of NADH: ubiquinone oxidoreductase deficiency by chronic Trolox treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For control cells, the ratio between activity and amount was 1 whereas for
      the patients this ratio was below 1, indicating a defect in intrinsic
      catalytic activity of complex I in the latter cells.
    explanation: >-
      The candidate quantitative explanation the proposed experiment would test.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, electron transport through this subunit should be partially
      preserved.
    explanation: >-
      The structural partial answer, quoted as its conclusion: the authors argue
      that because neither substitution disrupts the cysteine motifs coordinating
      the iron-sulfur clusters, electron transport through the subunit should be
      partially preserved. That gives an allele-level criterion predicting milder
      disease. Recorded as PARTIAL because it is an inference from residue
      position, not a measurement. (The preceding clause naming the cysteine
      motifs is not quoted because it contains a bracketed "[4Fe-4S]" that the
      snippet matcher strips.)
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The reduced pathogenicity of our patient's complex I disease might be
      attributable to the nature of the two new missense mutations.
    explanation: >-
      States the authors' framing directly - that allele identity, not chance,
      is what they take to explain the milder course.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient differed from the previous NDUFS8 compound heterozygote patient
      in having a drastic reduction in the 39-kDa subunit.
    explanation: >-
      A directly measured protein-level difference between the two genotyped
      patients with different courses - the most tractable of the three candidate
      explanations, because it is a western blot rather than an inference.
  - reference: PMID:36557887
    reference_title: "Emerging Roles of NDUFS8 Located in Mitochondrial Complex I in Different Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, all identified mutations were missense mutations, and no patients
      were reported with nonsense mutations in NDUFS8, which suggested that a
      complete absence of this protein might lead to intrauterine lethality
    explanation: >-
      Bounds the allelic series that any genotype-phenotype study could use, and
      supplies a reason for the bound: complete loss of NDUFS8 may not be
      compatible with life, so every reported patient retains some protein.
- discussion_id: mc1dn2_ndufs8_angiogenesis_axis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the NDUFS8-dependent ATP-Akt-mTOR-angiogenesis axis demonstrated in
    endothelial cells contribute anything to the phenotype of patients with
    biallelic NDUFS8 variants?
  attaches_to:
  - "pathophysiology#Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit"
  - "pathophysiology#Leigh Syndrome and Mitochondrial Encephalomyopathy"
  rationale: >-
    A 2024 study did to NDUFS8 what the patient literature cannot: silenced and
    knocked it out on its own, in a single cell type, with rescue experiments. It
    found that NDUFS8 loss inhibits endothelial proliferation, migration and tube
    formation; that the mechanism runs through failure of Akt-mTOR activation;
    that exogenous ATP restores Akt-mTOR signalling and constitutively active
    Akt1 rescues the cellular phenotypes; and that endothelial-specific knockdown
    inhibits retinal angiogenesis in mice. That is a well-controlled causal chain
    from this entity's gene to a vascular phenotype.

    None of it has been observed in a patient. Vascular maldevelopment is not a
    reported feature of MC1DN2; the affected tissues are brain, muscle and heart;
    and the paper's own framing is angiogenesis biology, with its human tissue
    observation coming from proliferative diabetic retinopathy rather than from
    mitochondrial disease. The mismatch matters in a specific way rather than
    generically: if the ATP-Akt-mTOR link is real in patients it would predict
    vascular contributions to the brain lesions - the symmetric basal ganglia
    necrosis of Leigh syndrome has long been argued to have a perfusion
    component - and would make ATP-restoring or mTOR-directed intervention
    mechanistically motivated rather than empirical. If it is endothelium-specific
    biology, the axis belongs to angiogenesis research and not to this entry, and
    should stay out of the pathograph. It is currently kept out.
  proposed_experiments:
  - experiment_id: mc1dn2_vascular_phenotype_in_patients
    name: Vascular and Akt-mTOR assessment in NDUFS8 patients and patient-derived endothelium
    description: >-
      Differentiate endothelial cells from NDUFS8 patient iPSCs carrying the
      actual biallelic missense alleles rather than a knockout, and test whether
      Akt-mTOR activation and angiogenic capacity are impaired at
      patient-relevant residual complex I activity. In parallel, review retinal
      and cerebral vascular imaging in the existing NDUFS8 cases for any
      unreported vascular abnormality.
  evidence:
  - reference: PMID:38594244
    reference_title: "The requirement of the mitochondrial protein NDUFS8 for angiogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDUFS8 is pivotal for Akt-mTOR cascade activation in endothelial cells.
      Depleting NDUFS8 inhibited Akt-mTOR activation, reversible with exogenous
      ATP in HUVECs.
    explanation: >-
      The causal link from NDUFS8 through ATP to Akt-mTOR, with the rescue that
      establishes the direction.
  - reference: PMID:38594244
    reference_title: "The requirement of the mitochondrial protein NDUFS8 for angiogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      revealed that endothelial knockdown of NDUFS8 inhibited retinal
      angiogenesis
    explanation: >-
      The in vivo vascular phenotype, in mouse retina - the strongest form of the
      claim available, and still not a patient observation.
  - reference: PMID:38594244
    reference_title: "The requirement of the mitochondrial protein NDUFS8 for angiogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lastly, we observed an increase in NDUFS8 expression in retinal
      proliferative membrane tissues obtained from human patients with
      proliferative diabetic retinopathy.
    explanation: >-
      The only human tissue observation in the paper, and it is from diabetic
      retinopathy rather than from mitochondrial disease - which is precisely why
      this axis is not curated as an MC1DN2 mechanism.
- discussion_id: mc1dn2_antioxidant_therapy_ceiling
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Trolox-induced increase in complex I amount seen in patient
    fibroblasts translate into any functional benefit in patients - and is it
    bounded by the intrinsic catalytic defect that antioxidant treatment cannot
    touch?
  attaches_to:
  - "pathophysiology#Increased Reactive Oxygen Species Production"
  - "pathophysiology#Reduced Complex I Amount and Intrinsic Catalytic Activity"
  rationale: >-
    This is a model-to-human question with an unusually well-specified answer
    already sketched in the model. Chronic antioxidant treatment of complex
    I-deficient fibroblasts lowers ROS and substantially increases the amount of
    complex I, which reads as a therapeutic lead. But the same experiment
    measures the catch: in control cells the increase in activity matched the
    increase in amount exactly, whereas in patient cells the ratio ran between
    0.1 and 0.8. More enzyme does not reliably mean more function, because the
    enzyme that is restored still carries the intrinsic catalytic defect. The
    authors draw the conclusion themselves - such treatment may only benefit
    patients with a relatively small intrinsic defect.

    Two things make this a HUMAN_MODEL_MISMATCH rather than a plain knowledge
    gap. The evidence exists and is quantitative; what is unknown is whether it
    holds in an organism. And the mismatch is directional and predictable: the
    model says who should not be expected to respond, which is a testable
    stratification hypothesis rather than a generic call for more research. The
    fibroblast panel also pooled five genes, so no NDUFS8-specific ratio is
    available.
  proposed_experiments:
  - experiment_id: mc1dn2_antioxidant_stratified_by_ratio
    name: Antioxidant trial stratified by baseline activity-to-amount ratio
    description: >-
      In complex I deficiency including NDUFS8, measure the fibroblast
      activity-to-amount ratio at baseline, then treat with an antioxidant and
      test whether functional response is predicted by that ratio - with the
      model's prediction being benefit confined to patients whose ratio is close
      to one.
  evidence:
  - reference: PMID:18435906
    reference_title: "Mitigation of NADH: ubiquinone oxidoreductase deficiency by chronic Trolox treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The finding that Trolox treatment increased the amount of complex I might
      aid the future development of antioxidant treatment strategies for
      patients.
    explanation: >-
      The therapeutic lead the model generates.
  - reference: PMID:18435906
    reference_title: "Mitigation of NADH: ubiquinone oxidoreductase deficiency by chronic Trolox treatment."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      However, such treatment may only be beneficial to patients with a
      relatively small reduction in intrinsic catalytic defect of the complex.
    explanation: >-
      The authors' own bound on that lead, which is the stratification hypothesis
      the proposed experiment tests.
notes: >-
  Entry-type decision. MONDO:0032606 carries no `mondo_descendant_count` in the
  stub (a leaf) and is a defined intersection class - "mitochondrial complex I
  deficiency, nuclear type" AND `RO:0004003` NDUFS8 - so the gene is constitutive
  of the concept rather than merely associated with it. It is therefore curated
  as its own `kb/disorders/` Disease, exactly parallel to the existing
  `Mitochondrial_Complex_I_Deficiency_Nuclear_Type_12` (NDUFA1) entry, rather
  than as a subtype of a nuclear-complex-I umbrella. The numbered MC1DN series is
  a gene-per-entry series by construction.

  Relationship to the sibling entries. This is a core structural subunit defect
  where NDUFA1 (type 12) is an accessory subunit defect, and the two produce
  mechanistically different lesions worth keeping distinct: the accessory-subunit
  entity reduces the amount of assembled complex I, while this one reduces both
  the amount and the intrinsic catalytic competence of what remains. They also
  differ in inheritance - autosomal recessive here against X-linked there.

  On TAT-NDUFS8. A protein-transduction approach - NDUFS8 fused to the HIV TAT
  cell-penetrating peptide - has been reported to improve complex I assembly and
  partially restore complex I function in an NDUFS8-deficient cell line. It is
  deliberately NOT curated, because it has never been given to a patient and the
  source available here is a review's account of a cell-line experiment rather
  than the primary report. It is recorded so a future curator knows the lead
  exists and where to look; if the primary paper is fetched and its readouts
  verified, an `experimental_models` entry with a `RESCUES` link would be the
  right home for it, not a `treatments:` entry.

  Deliberately not curated: treatments. No treatment for this entity is
  established, and the two interventions with any evidence are curated where the
  evidence actually sits - Trolox as a perturbation under `experimental_models`
  with an explicit ceiling recorded in a HUMAN_MODEL_MISMATCH discussion, and the
  Ndi1p bypass under `animal_models` as an invertebrate proof of principle. Both
  are leads. Recording either as a `treatments:` entry would assert a therapy for
  patients that nothing in the cited literature supports.

  A note on cached full text, learned the hard way in this entry. PMID:15159508
  is cached as `content_type: full_text_html` and was initially consumed as
  though it were abstract-only, which cost the clinical examination, the named
  alleles, the residual-activity figures, the Yarrowia validation and the
  spared-cysteine-motif argument. Applying the same check to PMID:36557887 and
  PMID:39385390 - both `full_text_xml` - then turned up the missense-only
  allelic series and the exact NDUFS8 allele used in the galactose experiment.
  Check `content_type:` before treating any cached reference as abstract-only.
  Note the converse discipline still applies: PMID:9837812 and PMID:23430795 ARE
  abstract-only, and their full-text detail is correctly withheld.

  That lesson had to be learned three times, and the sharper version of it is
  worth stating separately. Knowing a cache is full text is not enough: on the
  second pass the clinical-examination paragraph sitting one above the
  biochemistry was still missed, and on the third the clinical-spectrum sentences
  sitting immediately after the genetic ones in the same paragraph of
  PMID:36557887 were still missed. The operative check is not "is this cache full
  text?" but "have I read to the end of the passage I am already quoting from?"
  Each of those misses cost phenotypes that were two sentences from material
  already in the entry.

  Deliberately not curated: datasets. `just discover-datasets` returned 8
  candidates and none survived relevance triage. The two best (geo:GSE65634,
  complex I-deficient patient fibroblasts across 32 perturbation conditions;
  geo:GSE27041, transcriptional changes in OXPHOS complex I deficiency) are real,
  human, patient-derived, and about complex I deficiency - but about the GROUP,
  with no NDUFS8 genotype specified. Attaching them here would be exactly the
  failure the dataset-curation guidance warns about: relaxing a precise entry
  name until sibling diseases collapse together. A separate GEO text search for
  "NDUFS8" returned 22 hits, of which the two series-level matches
  (geo:GSE119723, geo:GSE119699, cysteamine bitartrate in respiratory chain
  disease) mention the gene only in per-sample annotation and are not about this
  entity either. If an NDUFS8-genotyped dataset appears, it belongs here; a
  complex-I-deficiency-in-general dataset belongs on a grouping.

  On the deep-research report. `just preflight-dr ... MONDO:0032606` returned
  WARN: NDUFS8 dominates the report's gene mentions overwhelmingly (66, against
  NDUFS7=4 and NDUFS2=3), but the report cites OMIM 252010 and 256000 where MONDO
  xrefs OMIM 618222. Assessed as benign rather than as Named Entity Confusion:
  252010 is the generic "mitochondrial complex I deficiency" OMIM entry and
  256000 is Leigh syndrome, both of which are parent or sibling concepts of this
  entity rather than a rival disease. The gene signal is unambiguous. Nothing was
  excluded on that basis; separately, nothing was curated from the report's
  citations either, because it cites internal keys rather than identifiers - every
  PMID here was found by direct PubMed search and fetched with
  `just fetch-reference`.

  A correction to an earlier version of this note: it claimed the report cites
  only Edison-internal keys. That is wrong - the `.citations.md` sidecar does
  carry resolvable DOIs alongside the internal keys, and a curator should read
  the sidecar rather than skipping it. What remains true is that the report BODY
  cites internal keys, so a claim read from the narrative cannot be traced to a
  source without going to the sidecar first.

  Two things the report surfaced that are NOT curated, for stated reasons. It
  reports tissue-specific residual complex I activity in the index patient (39%
  of the lower reference limit in muscle, 69% in fibroblasts, approximately 0% in
  heart, 53% in liver, 3% in brain) - a striking illustration of why a
  generalised enzyme defect produces a focal brain lesion. Those numbers are in
  the full text of PMID:9837812, and the cached record for that reference is
  abstract-only, so they cannot be quoted as a verified snippet and are not
  asserted here. Note the contrast with PMID:15159508, which IS cached as full
  text and which this entry now mines accordingly - residual activities of 31%
  and 43% of control, the named P85L and R138H alleles, the cardiomyopathy and
  cardiorespiratory death of the index patient, the repeatedly normal lactate in
  the late-onset patient, the Yarrowia lipolytica allele validation, and the
  spared-cysteine-motif argument all come from that full text. Check the
  `content_type` of a cached reference before treating it as abstract-only.

  The NDUFS8-angiogenesis axis is likewise held out of the pathograph and
  recorded as a HUMAN_MODEL_MISMATCH discussion instead.

  On GeneReviews. PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum
  Overview") is the applicable GeneReviews chapter and is tagged in the top-level
  `references:` block. It is deliberately NOT cited as evidence anywhere: the
  cached PubMed record contains only the chapter's statement of purpose - "The
  purpose of this overview is to..." - and no clinical content, so any snippet
  from it would attest to the chapter's aims rather than to a fact about the
  disease. The phenotypes here are anchored on primary reports instead.

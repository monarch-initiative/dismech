    The clinical endpoint, and the striking thing about it in this entity is its
    range rather than its severity. The index patient had neuropathologically
    proven Leigh syndrome with a progressive course ending in death in the first
    months of life - the presentation a core-subunit defect predicts. But a
    second patient had late-onset disease with only a partial complex I defect,

phenotypes:
- category: Neurologic
  name: Leigh Syndrome
  description: >-
    Subacute necrotizing encephalomyelopathy, neuropathologically proven in the
    index patient and present in the late-onset and PEO-plus cases as well. It is
    the unifying clinical diagnosis across the whole reported range of this
    entity, even where the age of onset and severity differ sharply.
  phenotype_term:
    preferred_term: Progressive encephalopathy
    term:
      id: HP:0002448
      label: Progressive encephalopathy
  diagnostic: true
  evidence:
  - reference: PMID:9837812
    reference_title: "The first nuclear-encoded complex I mutation in a patient with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cycle sequencing of amplified NDUFS8 cDNA of 20 patients with isolated
      enzymatic complex I deficiency revealed two compound heterozygous
      transitions in a patient with neuropathologically proven Leigh syndrome.
    explanation: >-
      Documents neuropathologically confirmed Leigh syndrome in the index
      NDUFS8 patient.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leigh syndrome (LS) is one of the most common mitochondrial diseases with
      an early childhood onset of loss of motor and intellectual milestones,
      hypotonia, bilateral striatal necrosis, and early death.
    explanation: >-
      Defines the syndrome whose components the remaining phenotypes on this
      entry itemise.
- category: Neurologic
  name: Developmental Regression
  description: >-
    Loss of motor and intellectual milestones already attained - regression
    rather than delay, which is what distinguishes the Leigh syndrome course from
    a static encephalopathy and is often the observation that starts the
    metabolic workup.

    Scope caveat, because it matters for how this record should be read: the
    evidence here is the DEFINITION of Leigh syndrome, not an observation in a
    genotyped NDUFS8 patient. It applies to the infantile-onset form, whose index
    case followed the classical course. It explicitly does NOT hold across the
    entity - the late-onset patient in the same paper had dysarthria and gait
    failure with cognitive skills that "remained normal". Curated as a feature of
    the severe end rather than of the disease as a whole.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leigh syndrome (LS) is one of the most common mitochondrial diseases with
      an early childhood onset of loss of motor and intellectual milestones,
      hypotonia, bilateral striatal necrosis, and early death.
    explanation: >-
      Names loss of motor and intellectual milestones as a defining feature of
      Leigh syndrome. This is a definitional sentence, not an NDUFS8 patient
      observation, which is why it is PARTIAL.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysarthric speech was observed at this time, although her cognitive skills
      remained normal.
    explanation: >-
      The counterexample from the same paper: cognition was preserved in the
      late-onset patient, so intellectual regression is not a feature of the
      whole entity.
- category: Neurologic
  name: Hypotonia
  description: >-
    Reduced muscle tone, part of the core Leigh syndrome presentation and
    reported in the infantile form.

    Same scope caveat as developmental regression: the evidence is the definition
    of Leigh syndrome rather than an NDUFS8 patient observation, and the
    late-onset patient in the same paper had explicitly normal strength and tone
    at rest. Curated as a feature of the severe infantile end, not of the entity
    as a whole.

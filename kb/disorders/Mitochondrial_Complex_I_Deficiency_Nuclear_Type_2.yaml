name: Mitochondrial Complex I Deficiency, Nuclear Type 2
creation_date: "2026-08-25T00:00:00Z"
description: >-
  Mitochondrial complex I deficiency, nuclear type 2 is an autosomal recessive
  mitochondrial disease caused by biallelic variants in NDUFS8, which encodes
  the TYKY subunit of respiratory chain complex I. Complex I is the entry point
  of the respiratory chain, oxidizing NADH and passing electrons through a chain
  of iron-sulfur clusters to ubiquinone while pumping protons. NDUFS8 is not an
  accessory subunit: it is a structural core protein, highly conserved from
  bacteria to humans, carrying two 4Fe4S ferredoxin consensus patterns long
  thought to provide the binding site for cluster N2 - the terminal cluster that
  hands electrons to ubiquinone. Losing it therefore threatens both the assembly
  of the enzyme and the electron path through it.

  Patient cells bear that out on both counts, and the distinction matters. Loss
  of the NDUFS8 polypeptide reduces the amount of assembled complex I and drags
  down other nuclear subunits with it, so the subunit is required for assembly
  or stability. But in complex I-deficient fibroblasts the ratio of enzymatic
  activity to enzyme amount is also below one, where it is exactly one in
  controls - meaning the enzyme that does assemble is intrinsically less
  catalytically competent. The deficiency is therefore quantitative and
  qualitative at once.

  This entity has a historical place: the compound heterozygous NDUFS8 patient
  reported in 1998 was the first molecular genetic link between a
  nuclear-encoded complex I subunit and Leigh syndrome. Its clinical range has
  since turned out to be much wider than a core-subunit defect would predict -
  from a progressive infantile course ending in death within months, through
  late-onset Leigh syndrome with only a partial biochemical defect, to a
  "progressive external ophthalmoplegia plus" presentation in three siblings
  that would not ordinarily have prompted anyone to sequence this gene at all.

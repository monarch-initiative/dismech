    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:30429455
  modeled_mechanisms:
  - target: Glycolytic Compensation Masking the Bioenergetic Deficit
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The galactose switch is a direct assay of the compensation node: it removes
      the glycolytic route and measures what is left.
    limitations: >-
      Fibroblasts are not the affected tissue - the disease kills neurons and the
      striatum, not skin - and forced galactose metabolism is a supraphysiological
      stress with no in vivo counterpart. The lines pool three different genes,
      so an NDUFS8-specific effect cannot be separated from a general complex I
      one in this design. A modelling review identifies the NDUFS8 line in this
      experiment as carrying p.Arg94Cys, which at least anchors which allele was
      represented.
    readouts:
    - name: Survival in galactose medium
      target: Glycolytic Compensation Masking the Bioenergetic Deficit
      direction: DECREASED
      interpretation: >-
        Patient cells die where controls survive, showing the deficit is lethal
        once glycolysis cannot compensate.

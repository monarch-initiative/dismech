    explanation: >-
      The segregation and control-allele evidence for the late-onset pair.
  - reference: PMID:36557887
    reference_title: "Emerging Roles of NDUFS8 Located in Mitochondrial Complex I in Different Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic variants of the NDUFS8 can be responsible for LS, including
      homozygous (c.236C > T/p.Pro79Leu, c.460G > A/p.Gly154Ser, c.187G >
      C/p.Glu63Gln, c.160C > T/p.Arg54Trp, c.281C > T het/p.Arg94Cys) and

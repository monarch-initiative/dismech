        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Trolox treatment dramatically reduced ROS levels in both control and
          patient cells, which was paralleled by a substantial increase in the
          amount of complex I.
        explanation: >-
          The ROS measurement and the paired complex I response.

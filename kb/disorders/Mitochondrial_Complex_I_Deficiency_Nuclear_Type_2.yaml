  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each parent was heterozygous for one of the two missense mutations. These

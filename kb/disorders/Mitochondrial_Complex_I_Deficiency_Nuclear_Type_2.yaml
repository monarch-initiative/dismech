    The important qualifier is that it is not obligatory: in the late-onset
    patient, lactate and pyruvate in blood, urine and CSF were repeatedly normal
    while complex I activity was 31-43% of control and the MRI showed
    Leigh-compatible putaminal lesions. A normal lactate does not exclude this
    diagnosis, which is exactly the kind of negative that changes what a
    clinician does next.

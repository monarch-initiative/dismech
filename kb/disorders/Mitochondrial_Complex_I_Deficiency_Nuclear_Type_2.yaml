- name: Complex I Assembly and Stability Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Western blotting of patient material shows not only a deficiency of the
    NDUFS8 polypeptide itself - which a mutation in its own gene would produce
    trivially - but reductions in other nuclear-encoded subunits of complex I as
    well. That second observation is the informative one: the rest of the
    complex cannot be maintained without TYKY, so the subunit is required for
    assembly, for stability of the assembled enzyme, or for both. The available
    data do not distinguish those alternatives, and the reporting authors do not
    claim to.

    There is a structural proposal for what the subunit is doing. NDUFS8/TYKY is
    thought to connect the membrane and peripheral domains of complex I - the
    boundary between the arm embedded in the inner membrane and the arm that
    carries the electron relay. A subunit at that junction is exactly the kind
    whose loss would destabilise the whole assembly rather than remove one
    catalytic step. Consistent with that, the late-onset patient also showed a
    drastic reduction in the 39-kDa subunit, which is proposed to sit at the same
    domain boundary and may interact with TYKY directly.

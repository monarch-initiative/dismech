  publication: PMID:15159508
  description: >-
    An obligate aerobic yeast whose complex I is the standard genetic system for
    this enzyme, used here to test the actual patient alleles rather than a
    knockout. This is the most disease-specific model available for this entity:
    unlike the fibroblast panels, which pool NDUFS8 with four other genes, and
    unlike the C. elegans bypass, which addresses complex I deficiency in
    general, it asks directly whether P85L and R138H are pathogenic. The
    reporting authors introduced them into the Y. lipolytica homologue and
    treated the result as confirmation of biochemical significance.
  modeled_mechanisms:
  - target: NDUFS8 Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Introducing the human missense substitutions into the fungal homologue
      confirms that these specific alleles - not merely loss of the gene -
      compromise the subunit's function.
    limitations: >-
      A yeast, and one whose complex I differs from the human enzyme in subunit
      composition even though the core is conserved. It establishes allele
      pathogenicity, not clinical severity, and it cannot speak to the tissue
      selectivity that determines what the disease looks like in a patient. The
      cached record states the confirmation without reporting the quantitative
      result, so no readout magnitude is curated.

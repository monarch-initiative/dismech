pathophysiology:
- name: NDUFS8 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFS8 encodes TYKY, a structural core subunit of complex I rather than an
    accessory one. Two features make it a plausible point of failure. It is
    highly conserved across eukaryotes and prokaryotes, which is the signature of
    a subunit whose sequence is constrained by an essential function rather than
    tolerated as scaffolding. And it carries two 4Fe4S ferredoxin consensus
    patterns that have long been thought to provide the binding site for
    iron-sulfur cluster N-2 - the terminal cluster of the electron relay, the
    one that delivers electrons to ubiquinone.

    Reported pathogenic alleles are missense: C236T (p.Pro79Leu) and G305A
    (p.Arg102His) as compound heterozygotes in the index patient, two further
    novel missense changes in the late-onset patient, and homozygous variants in
    the consanguineous "PEO plus" family.

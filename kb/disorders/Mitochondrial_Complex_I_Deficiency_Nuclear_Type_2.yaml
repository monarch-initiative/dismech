  description: >-
    Biallelic NDUFS8 variants are required. The index patient was a compound
    heterozygote for two transitions that were absent from 70 control alleles
    and cosegregated within the family; the late-onset patient was likewise a
    compound heterozygote; and the "PEO plus" siblings came from a consanguineous
    family, the homozygous route to the same biallelic state. This places the
    entity within the largely autosomal recessive nuclear complex I series, in
    contrast with its X-linked sibling entities NDUFA1 (type 12) and NDUFB11.

biochemical:
- name: Isolated Enzymatic Complex I Deficiency
  presence: PRESENT
  notes: >-
    An isolated deficiency of complex I activity, with the other respiratory
    chain complexes intact, is the biochemical phenotype that defines the group
    this entity belongs to and the finding that selects patients for nuclear
    complex I gene sequencing. It is isolated rather than combined because the
    lesion is in a structural subunit of one complex, not in the machinery shared
    across the chain - which is what makes the biochemical result a useful
    pointer to which genes to sequence.
  evidence:
  - reference: PMID:9837812
    reference_title: "The first nuclear-encoded complex I mutation in a patient with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cycle sequencing of amplified NDUFS8 cDNA of 20 patients with isolated
      enzymatic complex I deficiency revealed two compound heterozygous
      transitions in a patient with neuropathologically proven Leigh syndrome.
    explanation: >-
      Records the isolated enzymatic complex I deficiency that defined the
      screened cohort.
- name: Partial Rather Than Complete Complex I Defect
  presence: PRESENT
  notes: >-
    The magnitude of the enzymatic deficit is not uniform. The late-onset patient
    had a partial complex I defect, and across a fibroblast panel including
    NDUFS8 the decrease in activity and amount was variable between patients.
    That variability is the biochemical correlate of the wide clinical range, and
    it is why a mildly reduced complex I activity does not exclude this diagnosis.
  evidence:
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the complex I NDUFS8 gene from Leigh syndrome patients with
      isolated complex I deficiency revealed that one patient with late-onset
      disease and partial complex I defect was a compound heterozygote for two
      novel mutations in NDUFS8 gene.
    explanation: >-
      Documents a partial biochemical defect in a genetically confirmed patient.
  - reference: PMID:15159508
    reference_title: "Late-onset Leigh syndrome in a patient with mitochondrial complex I NDUFS8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex I was specifically reduced to 31% and 43% of control values after

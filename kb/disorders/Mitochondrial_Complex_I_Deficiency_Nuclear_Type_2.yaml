    evidence:
    - reference: PMID:30429455
      reference_title: "Rescue from galactose-induced death of Leigh Syndrome patient cells by pyruvate and NAD()."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cell models of mitochondrial complex I (CI) deficiency display activation

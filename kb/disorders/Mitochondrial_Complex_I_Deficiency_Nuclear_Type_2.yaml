  modeled_mechanisms:
  - target: Increased Reactive Oxygen Species Production
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Chronic antioxidant treatment lowers ROS and raises the amount of complex I,
      which is the experimental basis for treating ROS as a feedback regulator of
      complex I expression rather than as a downstream by-product.
    limitations: >-
      The effect is inferred from a correlated response to a single antioxidant in
      cultured fibroblasts pooling five genes; no NDUFS8-specific result is
      reported, and the authors describe the evidence that ROS contributes to
      pathogenesis as circumstantial. The therapeutic implication is explicitly
      bounded by the authors to patients with a small intrinsic catalytic defect.

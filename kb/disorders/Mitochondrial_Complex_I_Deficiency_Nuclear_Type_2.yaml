- name: Galactose-stressed Leigh syndrome patient fibroblasts (NDUFS7/NDUFS8/NDUFV1)
  description: >-
    Primary skin fibroblasts from Leigh syndrome patients with isolated complex I
    deficiency, including NDUFS8-mutant lines, cultured in pyruvate-free medium
    with galactose replacing glucose. The medium is the model: it forbids
    glycolytic compensation, so the bioenergetic deficit that patient cells
    normally paper over becomes lethal to them and not to controls. It is a
    conditional model - in ordinary glucose medium the same cells survive.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:

  description: >-
    Fibroblasts from six children with isolated complex I deficiency caused by
    mutations in NDUFS1, NDUFS2, NDUFS7, NDUFS8 or NDUFV1, treated chronically
    with the water-soluble vitamin E derivative Trolox. Used here as a
    perturbation of the ROS node rather than as a disease model: it asks what
    happens to complex I when oxidative stress is removed.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human

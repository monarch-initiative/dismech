      label: desmosome
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is likely due to marked aggregation of desmosomes either via shedding
      or internalization seen in spinous layer keratinocytes (Fig. 5A).
    explanation: >-
      Electron microscopy of patient skin shows desmosome aggregation in
      spinous keratinocytes.
  downstream:
  - target: Loss of Suprabasal Keratinocyte Adhesion
    description: >-
      Removal of desmosomes from the cell surface widens the intercellular
      spaces between suprabasal keratinocytes.
    evidence:
    - reference: PMID:26604139
      reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loss of desmosomes leads to widening of intercellular spaces in
        suprabasal cells (Fig. 5B).
      explanation: >-
        Direct ultrastructural link from desmosome loss to impaired adhesion.
  - target: Reduced Connexin 43 Junctional Localization
    description: >-
      Mutant desmoplakin reduces the membrane localization of the gap junction
      protein connexin 43 in keratinocytes.
    evidence:
    - reference: PMID:26604139
      reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both constructs expressing a DSP mutation (H618P, L622P) demonstrate
        Cx43 membrane intensity reduced to <80% of that observed in cells
        expressing wild-type DSP
      explanation: >-
        Expression of the EKC variants in primary human keratinocytes reduces
        junctional connexin 43.
- name: Loss of Suprabasal Keratinocyte Adhesion
  conforms_to: "desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion"
  description: >-
    Suprabasal keratinocytes separate at widened intercellular spaces, and
    lamellar bodies are secreted prematurely with defective structure. The
    histological result in EKC syndrome is a psoriasiform, hyperkeratotic
    epidermis with a reduced granular layer. The same weakness of
    desmosome-dependent epithelia is the presumed basis of the keratoderma,
    hair and nail findings shared by both presentations.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marked deficits in lipid processing and secretion are also observed on
      ruthenium tetroxide staining, with premature secretion of lamellar bodies
      which have defective structure and supramolecular organization (Fig. 5D).
    explanation: >-
      Patient skin shows a lamellar body secretory defect accompanying the
      adhesion defect.
  downstream:
  - target: Erythrokeratodermia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Adhesion and lipid secretory failure in the suprabasal epidermis are the
      tissue abnormalities underlying the generalized erythrokeratodermia of
      EKC syndrome.
  - target: Palmoplantar Keratoderma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Desmosomal weakness in the mechanically loaded palmoplantar epidermis
      produces keratoderma, as in other desmoplakin disorders.
  - target: Woolly Hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Desmosome-dependent hair follicle epithelium yields an abnormally curled

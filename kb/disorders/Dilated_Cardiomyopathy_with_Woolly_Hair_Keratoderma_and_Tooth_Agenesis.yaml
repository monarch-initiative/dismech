has_subtypes:
- name: Dominant Carvajal
  display_name: Dominant Carvajal phenotype (woolly hair, keratoderma, tooth agenesis)
  description: >-
    The originally described presentation: woolly hair, palmoplantar
    keratoderma (often striate), nail changes, hypodontia or oligodontia, and
    dilated or arrhythmogenic cardiomyopathy, caused by heterozygous missense or
    in-frame variants between roughly residues 560 and 600 of desmoplakin.
  genes:
  - preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heterozygosity for an in-frame insertion or a missense mutation within SR6
      has been shown to cause dominant Carvajal syndrome, which features limited
      skin involvement (isolated PPK) with woolly hair and cardiomyopathy (OMIM
      #615821)
    explanation: >-
      The EKC syndrome report summarizes the earlier dominant Carvajal reports
      and places them in SR6 under OMIM 615821, the record MONDO:0014355 maps to.
- name: EKC
  display_name: Erythrokeratodermia-cardiomyopathy (EKC) syndrome
  description: >-
    Severe congenital or infantile generalized erythrokeratodermia with
    alopecia, absent eyebrows and eyelashes, nail dystrophy, enamel defects,
    absent secondary teeth and initially silent progressive dilated
    cardiomyopathy, caused by de novo proline substitutions (Q616P, H618P,
    L622P) clustered within seven residues near the end of SR6. The former
    MONDO term for EKC syndrome (MONDO:0018774) is obsolete and merged into
    MONDO:0014355, so the subtype carries no term of its own.
  genes:
  - preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that de novo missense mutations clustered tightly within a single
      spectrin repeat of DSP cause this novel cardio-cutaneous disorder, which
      we term erythrokeratodermia-cardiomyopathy (EKC) syndrome.
    explanation: >-
      Defines EKC syndrome as a dominant de novo SR6 DSP disorder.
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional differences compared to Carvajal syndrome, the dominant form of
      which is also caused by substitution mutations in DSP SR6, include a more
      mild PPK, more profound and consistent alopecia, itch, and variable
      features of failure to thrive, developmental delay, visual impairment, and
      hoarse voice observed in our EKC syndrome subjects.
    explanation: >-
      States what separates the EKC presentation from the dominant Carvajal
      presentation caused by the same SR6 region.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous DSP variants act dominantly. Most reported variants arose de
    novo in the proband (confirmed by parental testing and, in two cases,
    paternity testing), with subsequent vertical transmission in the
    p.Ser597Leu and p.Ile560Phe families.
  evidence:
  - reference: PMID:20940358
    reference_title: "A new hypo/oligodontia syndrome: Carvajal/Naxos syndrome secondary to desmoplakin-dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This familial case report and two other previous reports demonstrate that
      autosomal-dominant mutations in the DSP gene are associated with
      hypo/oligodontia in the setting of Carvajal/Naxos syndrome.
    explanation: >-
      The founding report establishes dominant DSP mutation as the cause of the
      tooth-agenesis cardiocutaneous phenotype.
  - reference: PMID:22949226
    reference_title: "De novo heterozygous desmoplakin mutations leading to Naxos-Carvajal disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore conclude that the probands both carried a de novo mutation in
      DSP.
    explanation: >-
      Parental and paternity testing confirmed de novo heterozygous DSP
      variants in two unrelated affected individuals.
  - reference: PMID:28649555
    reference_title: "Autosomal dominant Carvajal plus syndrome due to the novel desmoplakin mutation c.1678A > T (p.Ile560Phe)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the family tree a paternal autosomal dominant transmission is
      most likely.
    explanation: >-
      Father-to-child transmission of the p.Ile560Phe phenotype supports
      autosomal dominant inheritance.
pathophysiology:
- name: DSP Spectrin Repeat 6 Missense Variant
  description: >-
    A single heterozygous missense or in-frame variant alters a conserved
    residue in spectrin repeat 6 of the desmoplakin plakin domain, the
    N-terminal region that binds plakoglobin and the plakophilins. Structural
    modelling and the recurrent introduction of helix-breaking proline
    residues suggest that the variants destabilize the repeat. Whether the
    mutant protein acts through insufficient recruitment of desmoplakin to
    desmosomes or through a dominant-negative effect on other desmosomal
    proteins has not been tested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: desmoplakin structural linkage of the desmosomal plaque
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:22949226
    reference_title: "De novo heterozygous desmoplakin mutations leading to Naxos-Carvajal disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each patient we identified a single heterozygous de novo mutation in
      the desmoplakin gene DSP, p.Leu583Pro and p.Thr564Ile, leading to severe
      combined cardiac/dermatological and cardiac/dermatological/dental
      phenotypes. The DSP missense mutations are localised in the N terminal
      domain of desmoplakin.
    explanation: >-
      Two unrelated de novo cases place the causal variants in the N-terminal
      domain.
  - reference: PMID:22949226
    reference_title: "De novo heterozygous desmoplakin mutations leading to Naxos-Carvajal disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This observation suggests a key role for the desmoplakin region (564-597),
      which may be involved in the interactions with plakophilin or plakoglobin.
    explanation: >-
      Clustering of the dominant variants defines a critical region of the
      plakin domain implicated in binding the armadillo plaque proteins.
  - reference: PMID:28649555
    reference_title: "Autosomal dominant Carvajal plus syndrome due to the novel desmoplakin mutation c.1678A > T (p.Ile560Phe)."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Structural modelling indicated that the mutation changed one amino acid
      located in the repeat spectrin 4 of the plakin domain of the protein
      leading probably to loss of the structural integrity of this domain.
    explanation: >-
      In silico modelling of p.Ile560Phe predicts destabilization of the same
      spectrin repeat.
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three mutations substitute proline for the native amino acid, and are
      clustered in exon 14 within a span encoding seven amino acids, at sites
      completely conserved in orthologs
    explanation: >-
      The EKC variants are conserved-site proline substitutions tightly
      clustered in the same repeat.
  downstream:
  - target: Epidermal Desmosome Aggregation and Plaque Protein Mislocalization
    description: >-
      Mutant desmoplakin is still incorporated at keratinocyte junctions but
      forms focal aggregates and disturbs the localization of other desmosomal
      plaque proteins.
    evidence:
    - reference: PMID:26604139
      reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We demonstrate that DSP mutations in our EKC syndrome subjects affect
        localization of desmosomal proteins and connexin 43 in the skin, and
        result in desmosome aggregation, widening of intercellular spaces, and
        lipid secretory defects.
      explanation: >-
        Patient skin shows the junctional consequence of the SR6 variants.
  - target: Myocardial Desmosome Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same plaque defect is presumed to occur at cardiomyocyte intercalated
      discs, where desmoplakin is equally abundant; no myocardium from a
      patient with this syndrome has been studied at the molecular level.
  - target: Desmosome-Dependent Tooth Development Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dominant SR6 variants are associated with failure of permanent tooth
      formation, implicating desmosomal function in odontogenesis.
    evidence:
    - reference: PMID:20940358
      reference_title: "A new hypo/oligodontia syndrome: Carvajal/Naxos syndrome secondary to desmoplakin-dominant mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, this study reveals the role of desmosomes in the
        development of teeth
      explanation: >-
        The founding family links the dominant DSP variant to defective tooth
        development.
- name: Epidermal Desmosome Aggregation and Plaque Protein Mislocalization
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  description: >-
    In affected epidermis desmosomes are internalized or shed into large
    aggregates in the spinous layer, so fewer remain at suprabasal cell
    borders, and desmoplakin, desmoglein 1 and plakoglobin show weaker, more
    diffuse junctional staining. This has been studied only in EKC syndrome
    skin.
  biological_scale: CELLULAR
  cell_types:

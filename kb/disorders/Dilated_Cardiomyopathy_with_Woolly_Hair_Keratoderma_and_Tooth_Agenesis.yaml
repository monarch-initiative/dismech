- name: Desmosome-Dependent Tooth Development Defect
  description: >-
    Permanent teeth, most often the second premolars and the second and third
    molars, fail to form, and in EKC syndrome the enamel of the primary teeth
    is soft and poorly mineralized. The developmental step at which the dental
    epithelium depends on desmoplakin is not known.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: tooth
    term:
      id: UBERON:0001091
      label: calcareous tooth
  biological_processes:
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:20940358
    reference_title: "A new hypo/oligodontia syndrome: Carvajal/Naxos syndrome secondary to desmoplakin-dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all three affected family members had hypo/oligodontia ranging from
      absence of the lower left second molar to 15 missing teeth, the typical
      pattern of oligodontia being absent 2nd premolars and absent 2nd and 3rd
      molars
    explanation: >-
      Defines the tooth agenesis pattern produced by the dominant DSP variant.
  downstream:
  - target: Tooth Agenesis
    description: Failed odontogenesis leaves permanent teeth congenitally absent.
  - target: Abnormal Dental Enamel
    description: >-
      In EKC syndrome enamel formation of the primary teeth is also defective.

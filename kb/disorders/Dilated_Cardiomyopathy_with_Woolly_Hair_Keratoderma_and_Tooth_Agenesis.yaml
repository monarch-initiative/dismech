diagnosis:
- name: DSP genetic testing
  description: >-
    Sequencing of DSP (usually within a desmosomal or cardiomyopathy gene
    panel, or exome) identifies the heterozygous SR6 variant; parental testing
    establishes de novo origin.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior to our discovery of pathogenic DSP mutations, neither case 244 nor
      case 380 had been diagnosed with cardiomyopathy; case 380 had never
      previously received a cardiac workup.
    explanation: >-
      Genetic diagnosis led to detection of previously unrecognized
      cardiomyopathy.
- name: Cardiac evaluation in patients with the cutaneous or dental phenotype
  description: >-
    Because the cardiomyopathy is initially silent, echocardiography and
    rhythm monitoring are indicated when woolly hair or keratoderma occur with
    tooth agenesis, or when erythrokeratodermia is found.
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:20940358
    reference_title: "A new hypo/oligodontia syndrome: Carvajal/Naxos syndrome secondary to desmoplakin-dominant mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dentists discovering oligo/hypodontia should screen for woolly hair and
      palmoplantar keratoderma because of the probable cardiac involvement with
      an inherent high risk of severe cardiomyopathy
    explanation: >-
      Recommends looking for the cutaneous signs, and so the cardiac risk, in
      patients presenting with tooth agenesis.
treatments:
- name: Implantable Cardioverter-Defibrillator
  description: >-
    ICD implantation for prevention of sudden arrhythmic death; the
    p.Ile560Phe report recommends it as soon as the diagnosis is made, and one
    p.Leu583Pro patient received an appropriate shock for exercise-induced
    ventricular fibrillation. The recommendation rests on case reports only.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Ventricular Electrical Instability
    treatment_effect: MODULATES
    description: >-
      Terminates malignant ventricular arrhythmia without correcting the
      underlying substrate.
  target_phenotypes:
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  - preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:28649555
    reference_title: "Autosomal dominant Carvajal plus syndrome due to the novel desmoplakin mutation c.1678A > T (p.Ile560Phe)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients require implantation of an ICD as soon as their diagnosis
      is established
    explanation: Case-report authors recommend early ICD implantation.
  - reference: PMID:22949226
    reference_title: "De novo heterozygous desmoplakin mutations leading to Naxos-Carvajal disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      when ventricular fib-rillation occurring during exercise was terminated by
      ad-equate ICD shock
    explanation: >-
      An implanted ICD terminated exercise-induced ventricular fibrillation in
      the p.Leu583Pro patient.
- name: Oral Acitretin for Erythrokeratodermia
  description: >-
    Systemic retinoid therapy for the skin disease of EKC syndrome, with
    inconsistent results in the two treated patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_phenotypes:
  - preferred_term: Erythrokeratodermia
    term:
      id: HP:0001019
      label: Erythroderma
  evidence:
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral acitretin improved scaling, though she remains erythrodermic.
    explanation: Partial response of scaling in one EKC patient.
  - reference: PMID:26604139
    reference_title: "Dominant de novo DSP mutations cause erythrokeratodermia-cardiomyopathy syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with oral acitretin at doses ranging from 0.5 to 2 mg/kg
      throughout his life, a 2-month course of cyclosporine at 0.5 mg/kg, and
      multiple topical steroids failed to improve erythroderma or pruritus.
    explanation: No response to acitretin in a second EKC patient.

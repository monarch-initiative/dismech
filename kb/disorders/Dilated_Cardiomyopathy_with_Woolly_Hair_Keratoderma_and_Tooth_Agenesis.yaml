name: Dilated Cardiomyopathy with Woolly Hair, Keratoderma, and Tooth Agenesis
creation_date: "2026-10-12T14:48:06Z"
category: Mendelian
description: >-
  Autosomal dominant cardiocutaneous syndrome caused by heterozygous, often de
  novo, missense or in-frame variants in the spectrin repeat 6 (SR6) region of
  the N-terminal plakin domain of desmoplakin (DSP). Affected individuals
  combine a progressive, potentially fatal cardiomyopathy (biventricular
  dilated cardiomyopathy, or a right-dominant arrhythmogenic picture with
  ventricular arrhythmia and sudden death) with woolly or sparse hair,
  palmoplantar keratoderma, nail abnormalities and congenital tooth agenesis
  (hypodontia to oligodontia, typically premolars and molars). It is the
  dominant counterpart of recessive Carvajal syndrome (biallelic DSP
  truncation; entry Carvajal_Syndrome) and is distinct from the heterozygous
  DSP loss-of-function arrhythmogenic cardiomyopathy in DSP_Cardiomyopathy,
  whose carriers show at most curly hair and mild keratoderma and no tooth
  agenesis. MONDO and Orphanet treat erythrokeratodermia-cardiomyopathy (EKC)
  syndrome, caused by de novo proline substitutions slightly further along
  SR6, as the same disease; it is carried here as a subtype with generalized
  erythrokeratodermia, alopecia, enamel defects and absent secondary teeth.
notes: >-
  The evidence base is a handful of case reports and one three-patient series:
  a three-member family with p.Ser597Leu (PMID:20940358), two unrelated de novo
  cases with p.Leu583Pro and p.Thr564Ile (PMID:22949226), a family with
  p.Ile560Phe (PMID:28649555), a de novo case with oligodontia and nail
  fragility (PMID:35574671), and three de novo EKC syndrome cases with Q616P,
  H618P and L622P (PMID:26604139). Further letters without abstracts
  (PMID:22795705, PMID:26833927, PMID:16628197) report the same phenotype but
  are not quoted here. No phenotype frequencies are recorded because no source
  reports a denominator larger than three. Several features reported in single
  individuals are deliberately not curated as disease phenotypes: unilateral
  hearing loss, recurrent pharyngeal infection, recurrent diarrhoea and left
  ventricular hypertrabeculation in the p.Ile560Phe index patient (the authors
  judge the first three probably unlinked), a bicuspid aortic valve in the
  p.Leu583Pro case, and corneal opacities, transient spasticity and
  developmental delay in one EKC case. Tooth agenesis is not an obligate
  feature: the p.Leu583Pro patient had no dental abnormality. A clinically
  identical patient with woolly hair, keratoderma, missing molars and
  premolars and dilated cardiomyopathy but no detectable DSP or JUP variant
  (PMID:22350851) suggests either locus heterogeneity or a DSP variant missed
  by exon sequencing. The dominant SR6 variant H586P causes a different
  disorder (severe dermatitis, multiple allergies and metabolic wasting, SAM
  syndrome), so position within SR6 matters and this entry does not cover
  every SR6 missense variant. The plakin-domain repeat called spectrin repeat
  4 in PMID:28649555 is the same repeat called SR6 in PMID:26604139, which
  numbers repeats by homology to plectin. No GeneReviews chapter covers this
  syndrome.

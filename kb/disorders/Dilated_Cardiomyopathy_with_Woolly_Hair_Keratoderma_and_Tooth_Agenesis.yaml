genetic:
- name: DSP
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  features: >-
    Heterozygous missense or in-frame variants clustered in spectrin repeat 6
    of the desmoplakin plakin domain (about residues 560 to 625). Most arose de
    novo; two families show subsequent dominant transmission. Heterozygous
    truncating DSP variants instead cause arrhythmogenic cardiomyopathy
    (DSP_Cardiomyopathy), and biallelic truncations cause recessive Carvajal
    syndrome (Carvajal_Syndrome).
  inheritance:

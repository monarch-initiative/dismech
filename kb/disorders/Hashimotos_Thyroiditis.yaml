environmental:
- name: Iodine Excess
  exposure_term:
    preferred_term: excess iodine exposure
    modifier: INCREASED
    term:
      id: ECTO:9000084
      label: exposure to iodine
  influences_mechanisms:
  - target: Thyroglobulin Hyperiodination and Neoantigen Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Excess iodine directly raises the iodination of thyroglobulin, and the
      more heavily iodinated protein is the more immunogenic one. That is why
      iodine supplementation programmes are followed by a rise in autoimmune
      thyroiditis. The immunogenic hyperiodinated-Tg state is now the explicit
      intermediate node feeding the loss of tolerance.
    evidence:
    - reference: PMID:28290237
      reference_title: "Multiple Nutritional Factors and the Risk of Hashimoto's Thyroiditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Chronic exposure to excess iodine intake induces autoimmune thyroiditis, partly because highly iodinated thyroglobulin (Tg) is more immunogenic."
      explanation: >-
        States that chronic excess iodine intake induces autoimmune
        thyroiditis, partly because highly iodinated thyroglobulin is more
        immunogenic, naming the intervening step.
  notes: Can trigger or worsen disease
  evidence:

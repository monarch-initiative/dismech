name: Hashimoto's Thyroiditis
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Hashimoto's thyroiditis is a chronic autoimmune disease and the leading cause
  of primary hypothyroidism, in which loss of immune tolerance to thyroid
  antigens (thyroid peroxidase and thyroglobulin) drives lymphocytic
  infiltration and progressive destruction of thyroid follicular cells. CD4 and
  CD8 T cells together with anti-TPO and anti-thyroglobulin autoantibodies
  deplete the gland, producing thyroid hormone deficiency that manifests as
  fatigue, weight gain, cold intolerance, and goiter. Susceptibility is
  conferred by HLA and other immune-regulatory loci interacting with
  environmental triggers such as iodine excess and viral infection, and
  levothyroxine replacement reverses the hypothyroid syndrome.
category: Complex
parents:
- Autoimmune Disease
- Endocrine Disease
disease_term:
  preferred_term: Hashimoto thyroiditis
  term:
    id: MONDO:0007699
    label: Hashimoto thyroiditis
mechanistic_hypotheses:
- hypothesis_group_id: canonical_autoimmune_thyrocyte_destruction_model
  hypothesis_label: Canonical Autoimmune Thyrocyte Destruction Model
  status: CANONICAL
  description: >-
    Hashimoto's thyroiditis is a chronic autoimmune disease in which loss of immune tolerance to thyroid
    antigens — primarily thyroid peroxidase (TPO) and thyroglobulin (Tg) — drives lymphocytic
    infiltration of the thyroid gland, formation of intrathyroidal tertiary lymphoid structures, and
    progressive thyrocyte destruction. CD4 Th1 and Th17 cells, CD8 cytotoxic T cells, and autoantibody-
    mediated effects (anti-TPO, anti-Tg) act together to deplete follicular cells, producing primary
    hypothyroidism. Susceptibility is conferred by HLA-DR3/DR5, CTLA4, PTPN22, and other immune-
    regulation loci, with environmental triggers including iodine excess, viral infection, and selenium
    deficiency. Levothyroxine replacement reverses the hypothyroid syndrome by bypassing the destroyed
    gland, supporting glandular failure as the proximate clinical lesion in this canonical model.
  notes: >-
    Retained as CANONICAL. The 2026 openscientist
    hypothesis-search report
    (kb/hypotheses/Hashimotos_Thyroiditis/canonical_autoimmune_thyrocyte_destruction_model)
    confirms 12 of 13 mechanistic claims as established. Core
    effector mechanisms — Fas/FasL-mediated thyrocyte apoptosis
    (sensitized by IFN-γ + IL-1β, independent of perforin/granzyme),
    intrathyroidal tertiary lymphoid structures functioning as
    germinal centers with RAG1/RAG2 in situ receptor revision, and
    coordinated CD4 Th1/Th17 + CD8 + autoantibody (anti-TPO in
    >90%) responses — are validated by histopathology, single-cell
    transcriptomics, and immune-checkpoint-inhibitor-induced
    thyroiditis as a natural experiment. JAK inhibition has
    provided proof-of-concept reversal. Six refinements: (1) Th17/Treg
    imbalance is now established as an upstream initiator
    preceding Th1-mediated destruction, not captured by the seed
    description; (2) IgG4-related thyroiditis (~27%) and
    seronegative HT (~12%) are clinically significant subtypes the
    model does not address; (3) GWAS identifies 418 independent
    signals (vs ~5 canonical loci) explaining only ~5.4% of
    variance, indicating extensive polygenicity; (4) the gut-
    thyroid axis (molecular mimicry, SCFA depletion) provides a
    mechanistic bridge from environmental triggers to immune
    dysregulation; (5) thyrocyte HLA class II expression (Bottazzo
    hypothesis) and NETosis are increasingly implicated;
    (6) sex-specific intrathyroidal B-cell homing via CXCL13-CXCR5
    helps explain the female predominance. The initial
    tolerance-breaking event remains unknown and no disease-
    modifying RCT has yet been completed.
  evidence:
  - reference: PMID:38731922
    reference_title: "Autoimmunity, New Potential Biomarkers and the Thyroid Gland-The Perspective of Hashimoto's Thyroiditis and Its Treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Hashimoto's thyroiditis (HT) is generally characterized by the presence of thyroid peroxidase and thyroglobulin antibodies, with a concomitant infiltration of lymphocytes in the thyroid."
    explanation: >
      Canonical mechanism reference used as the seed for the hypothesis-search
      deep-research run. It supports the autoantibody plus lymphocytic-infiltration
      core of the model, but not the full CD4 Th1/Th17, CD8,
      tertiary-lymphoid-structure, or genetic-susceptibility claims in the
      hypothesis description.
pathophysiology:
- name: Thyroglobulin Hyperiodination and Neoantigen Formation
  description: >-
    Excess iodide drives heavier iodination of thyroglobulin during hormone
    synthesis, and the more heavily iodinated protein carries altered epitopes
    that are more immunogenic than lightly iodinated Tg. This iodine-dependent
    neoantigen state is the proximate biochemical step through which chronic
    iodine excess presents modified self-antigen to the immune system, and is the
    intermediate node inserted between the iodine-excess exposure and the loss of
    tolerance.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Thyroid Follicular Cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  biological_processes:
  - preferred_term: Thyroglobulin iodination
    term:
      id: GO:0006590
      label: thyroid hormone generation
    # The claim here is qualitative - thyroglobulin carries abnormal, more
    # immunogenic iodination - not that hormone generation runs above its normal
    # level. INCREASED would also contradict the DECREASED modifier this same GO
    # term carries downstream on the Thyroid Hormone Deficiency node.
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28290237
    reference_title: "Multiple Nutritional Factors and the Risk of Hashimoto's Thyroiditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic exposure to excess iodine intake induces autoimmune thyroiditis, partly because highly iodinated thyroglobulin (Tg) is more immunogenic."
    explanation: >-
      Names highly iodinated thyroglobulin as the more immunogenic species,
      identifying the intermediate biochemical state linking iodine excess to
      the autoimmune response.
  downstream:
  - target: Loss of Immune Tolerance to Thyroid Antigens
    causal_link_type: DIRECT
    description: >-
      Presentation of the more immunogenic hyperiodinated thyroglobulin promotes
      autoreactive recognition of thyroid self-antigen, contributing to the
      breakdown of tolerance.
- name: Thyroidal Oxidative Stress from Selenoprotein Insufficiency
  description: >-
    Thyroid hormone synthesis generates hydrogen peroxide at the apical thyrocyte
    surface, which selenoprotein glutathione peroxidases normally detoxify. When
    selenium supply is low these selenoenzymes are limiting, so peroxide
    accumulates and oxidatively injures thyroid follicular cells. This oxidative
    thyrocyte injury and antigen release is the mechanism node downstream of the
    "Selenium Deficiency" state and upstream of the loss of tolerance.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Thyroid Follicular Cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  biological_processes:
  - preferred_term: Peroxide detoxification by glutathione peroxidase
    term:
      id: GO:0042744
      label: hydrogen peroxide catabolic process
    modifier: DECREASED
  - preferred_term: Response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  chemical_entities:
  - preferred_term: hydrogen peroxide
    term:
      id: CHEBI:16240
      label: hydrogen peroxide
    modifier: INCREASED
  evidence:
  - reference: PMID:28290237
    reference_title: "Multiple Nutritional Factors and the Risk of Hashimoto's Thyroiditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the glutathione peroxidases protect the thyroid by removing excessive hydrogen peroxide produced for Tg iodination"
    explanation: >-
      Identifies selenoprotein glutathione peroxidases as the thyroid's defense
      against the hydrogen peroxide of hormone synthesis, so their insufficiency
      in selenium deficiency leaves the gland exposed to oxidative injury.
  - reference: PMID:35789269
    reference_title: "Increased Incidence of Hashimoto Thyroiditis in Selenium Deficiency: A Prospective 6-Year Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data indicate an increased incidence of TPO-Ab seroconversion with low Se supply and support the hypothesis that Se deficiency contributes to HT as a modifiable risk factor."
    explanation: >-
      Prospective cohort evidence that low selenium status raises the incidence
      of thyroid autoantibody seroconversion, linking this oxidative-stress state
      to onset of autoimmunity.
  downstream:
  - target: Loss of Immune Tolerance to Thyroid Antigens
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Peroxide-mediated thyrocyte oxidative injury and release of sequestered thyroid antigen
    description: >-
      Oxidative thyrocyte injury releases and modifies sequestered thyroid
      antigens, promoting autoreactive priming and loss of tolerance.
- name: Impaired Vitamin D-Dependent Immune Tolerance
  description: >-
    Vitamin D signaling supports tolerogenic dendritic cells and regulatory
    T-cell function, an immunomodulatory brake that favors self-tolerance. Low
    vitamin D status weakens this brake and is proposed to permit escape from
    immune regulation. The direction of this association is unsettled: the cited
    cross-sectional finding is that levels are lower in people who already have
    the disease, and part of the same nutritional-risk literature attributes the
    low levels to the autoimmune process itself (including vitamin D receptor
    dysfunction) rather than the reverse.
  role: trigger
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Immune tolerance induction
    term:
      id: GO:0002507
      label: tolerance induction
    modifier: DECREASED
  - preferred_term: Regulation of immune response
    term:
      id: GO:0050776
      label: regulation of immune response
    modifier: DECREASED
  evidence:
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin D carries out an immunomodulatory role that appears to promote immune tolerance."
    explanation: >-
      States vitamin D's immunomodulatory, tolerance-promoting role, the basis
      for treating its deficiency as a state of weakened immune regulation.
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Hashimoto's thyroiditis (HT) is marked by self-tissue destruction as a consequence of an alteration in the adaptive immune response that entails the evasion of immune regulation."
    explanation: >-
      Frames HT as evasion of immune regulation, the tolerance failure that
      impaired vitamin D-dependent immunomodulation is proposed to promote.
  notes: >-
    Direction of effect is uncertain (reverse causation): low vitamin D in HT
    patients is cross-sectional, and part of the nutritional-risk literature
    (PMID:28290237) argues low vitamin D is more likely a result of the
    autoimmune process, including vitamin D receptor dysfunction.
  downstream:
  - target: Loss of Immune Tolerance to Thyroid Antigens
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Weakened vitamin D-dependent immunoregulation is proposed to lower the
      threshold for loss of tolerance to thyroid antigens, though the causal
      direction is not established.
- name: Hepatitis C Virus-Associated Thyroid Immune Activation
  description: >-
    The specific virus with human evidence here is hepatitis C virus (HCV;
    chronic HCV infection, MONDO:0005354), which is associated with thyroid
    autoimmunity and hypothyroidism. Molecular mimicry between viral and thyroid
    antigens and bystander activation of autoreactive lymphocytes are the usual
    mechanistic proposals, but the cited evidence is an epidemiological
    association, and interferon-based antiviral therapy for HCV is itself
    thyrotoxic, which confounds it. This HCV-associated immune-activation state is
    the intermediate node between the HCV-infection exposure and the loss of
    tolerance.
  role: trigger
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  evidence:
  - reference: PMID:32107168
    reference_title: "Graves' disease: Epidemiology, genetic and environmental risk factors and viruses."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Many studies showed that HCV is associated with thyroid autoimmunity and hypothyroidism, in patients with chronic HCV hepatitis (CHC); a significant link has been shown also between HCV-related mixed cryoglobulinemia and risk for GD."
    explanation: >-
      Reports the epidemiological association of chronic HCV infection with
      thyroid autoimmunity and hypothyroidism, the observation behind this
      HCV-associated immune-activation state.
  notes: >-
    The evidence here is specific to hepatitis C virus. Other viruses (EBV,
    HTLV-1, parvovirus B19, enteroviruses, and SARS-CoV-2) have been proposed as
    thyroid-autoimmunity triggers but are not substantiated in the cited source
    and so are not asserted as nodes. IFN-alpha therapy for chronic HCV is itself
    associated with thyroid dysfunction, confounding the HCV-autoimmunity
    association.
  downstream:
  - target: Loss of Immune Tolerance to Thyroid Antigens
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Proposed molecular mimicry between viral and thyroid antigens and bystander lymphocyte activation
    description: >-
      Antiviral immune activation is proposed to break tolerance to thyroid
      antigens via molecular mimicry or bystander activation, a mechanism not
      established by the cited association.
- name: Loss of Immune Tolerance to Thyroid Antigens
  description: >
    Susceptibility variants in T-cell regulatory and immune-checkpoint genes
    (HLA class II, CTLA4, PTPN22, LAG3) act together with environmental triggers
    (iodine excess, selenium/vitamin D status, viral infection) to break
    self-tolerance to thyroid peroxidase and thyroglobulin, the initiating lesion
    that licenses autoreactive T- and B-cell responses against the thyroid. A
    rare LAG3 start-codon variant that lowers the inhibitory checkpoint LAG-3
    exemplifies how impaired T-cell down-regulation predisposes to autoimmune
    thyroid disease.
  role: trigger
  genes:
  - preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  - preferred_term: PTPN22
    term:
      id: hgnc:9652
      label: PTPN22
  - preferred_term: LAG3
    term:
      id: hgnc:6476
      label: LAG3
  evidence:
  - reference: PMID:38982041
    reference_title: "Start codon variant in LAG3 is associated with decreased LAG-3 expression and increased risk of autoimmune thyroid disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiomics analysis yields 235 candidate genes outside the MHC-region and the findings highlight the importance of genes involved in T-cell regulation."
    explanation: A large AITD GWAS meta-analysis localizes susceptibility to T-cell regulatory genes, supporting loss of T-cell tolerance as the initiating mechanism.
  downstream:
  - target: Thyrocyte Antigen Presentation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autoreactive T helper cell priming against TPO/Tg
    description: >
      Breakdown of tolerance permits autoreactive T cells and an interferon-rich
      milieu that drives thyroid follicular cells to present antigen.
  - target: Lymphocytic Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autoreactive lymphocyte activation and thyroid homing
    description: >
      Loss of tolerance licenses autoreactive T and B lymphocytes that traffic
      into and accumulate within the thyroid gland.
- name: Thyrocyte Antigen Presentation
  description: >
    Under interferon-gamma and TNF-alpha exposure, thyroid follicular cells
    aberrantly upregulate MHC class II together with the invariant chain CD74 and
    its ligand MIF, becoming non-professional antigen-presenting cells. This
    amplifies local antigen presentation and ligand-receptor cross-talk with
    infiltrating immune cells, sustaining and propagating the intrathyroidal
    autoimmune response.
  role: amplifier
  cell_types:
  - preferred_term: Thyroid Follicular Cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  biological_processes:

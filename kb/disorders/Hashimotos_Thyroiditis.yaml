      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Many studies showed that HCV is associated with thyroid autoimmunity and hypothyroidism, in patients with chronic HCV hepatitis (CHC); a significant link has been shown also between HCV-related mixed cryoglobulinemia and risk for GD."
      explanation: >-
        Reports that hepatitis C virus is associated with thyroid autoimmunity
        and hypothyroidism in patients with chronic infection, an association
        rather than a mechanism.
  notes: >-
    HCV is the specific virus with human evidence; other candidate viruses are
    unverified here (see the pathophysiology node notes).

- name: NF-κB-IL-6 Signaling Pathway Activation
  description: >
    Genetic regulation of NF-κB and IL-6 signaling modulates the autoimmune
    response in Hashimoto's thyroiditis. CCDC77 and SLC45A3 are novel genetic
    modifiers that regulate NF-κB pathway activation and IL-6 production. CCDC77
    acts as a protective regulator (knockdown exacerbates thyroid damage),
    while SLC45A3 acts as a disease-promoting factor (knockdown alleviates thyroiditis).
    The NF-κB-IL-6 axis modulates immune cell activation and thyroid-targeted autoimmunity.
  biological_processes:
  - preferred_term: NF-κB signaling pathway
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:42283571
    reference_title: "CCDC77 and SLC45A3 mediate the genetic mechanism of Hashimoto's thyroiditis through IL-6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR analysis identified CCDC77 and SLC45A3 as key genes associated with both IL-6 and HT."
    explanation: Two-sample Mendelian randomization using human eQTL/GWAS data identified CCDC77 and SLC45A3 as IL-6-linked genes associated with Hashimoto's thyroiditis.
  - reference: PMID:42283571
    reference_title: "CCDC77 and SLC45A3 mediate the genetic mechanism of Hashimoto's thyroiditis through IL-6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo experiments showed that knockdown of CCDC77 exacerbated thyroid damage, increased serum anti-thyroperoxidase antibody (TPOAb), anti-thyroglobulin antibody (TGAb), and IL-6 levels, while reduced free triiodothyronine (FT3) and free thyroxine (FT4). Conversely, SLC45A3 knockdown alleviated thyroiditis, reduced antibody levels, and improved thyroid function."
    explanation: In vivo validation in NOD mice demonstrates that CCDC77 and SLC45A3 regulate HT progression through the NF-κB-IL-6 signaling axis; CCDC77 is a protective modulator while SLC45A3 is disease-promoting.
  downstream:
  - target: Lymphocytic Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - IL-6-driven Th17 differentiation and immune-cell activation
    description: >
      Genetic modulation of the NF-κB-IL-6 axis tunes immune-cell activation and
      recruitment, amplifying the intrathyroidal lymphocytic infiltrate.
    evidence:
    - reference: PMID:42283571
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo experiments showed that knockdown of CCDC77 exacerbated thyroid damage, increased serum anti-thyroperoxidase antibody (TPOAb), anti-thyroglobulin antibody (TGAb), and IL-6 levels, while reduced free triiodothyronine (FT3) and free thyroxine (FT4). Conversely, SLC45A3 knockdown alleviated thyroiditis, reduced antibody levels, and improved thyroid function."
      explanation: NOD-mouse knockdown of NF-κB-IL-6 axis genes changes thyroid damage and antibody levels, linking this signaling node to the autoimmune infiltrate.

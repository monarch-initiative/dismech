- name: Vitamin D Deficiency
  category: Nutritional
  description: >-
    Decreased circulating vitamin D (HP:0100512) modeled here as an upstream,
    modifiable risk state rather than a manifestation of the thyroid disease. As
    a deficiency state it is a convergence point reachable by several routes -
    reduced dietary intake, reduced cutaneous (UVB) synthesis, or impaired
    intestinal absorption (relevant in HT given its comorbidity with autoimmune
    gastritis and celiac disease). Only the intake/synthesis route is currently
    wired in as an evidenced edge. It is consistently observed at lower levels in
    HT patients; the causal direction is uncertain (see notes).
  phenotype_term:
    preferred_term: Vitamin D deficiency
    term:
      id: HP:0100512
      label: Decreased circulating vitamin D concentration
  evidence:
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is extensive literature confirming that vitamin D levels are significantly lower in HT patients compared to healthy people."
    explanation: >-
      Grounds the vitamin D-deficiency state as a finding associated with HT.
  notes: >-
    HP:0100512 is bound here as an upstream risk state, not a manifestation:
    because this phenotype has a sequelae edge into a pathophysiology node, the
    KGX/HPOA exporters export it as a direction-neutral
    `MONDO:0007699 biolink:associated_with HP:0100512` rather than
    `has_phenotype`. (This supersedes the earlier workaround of binding
    MONDO:0100471 to dodge the has_phenotype inversion; the direction-aware
    exporter makes the HP binding correct.) The association is cross-sectional
    and may be bidirectional; part of the nutritional-risk literature
    (PMID:28290237) attributes low vitamin D to the autoimmune process itself,
    including vitamin D receptor dysfunction.
  sequelae:
  - target: Impaired Vitamin D-Dependent Immune Tolerance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vitamin D deficiency is proposed to weaken vitamin D-dependent
      immunoregulation; the causal direction is not established.
- name: Selenium Deficiency
  category: Nutritional
  description: >-
    Decreased circulating selenium (HP:0033192) modeled here as an upstream,
    modifiable risk state for HT. As a deficiency state it is a convergence point
    reachable by reduced dietary intake or impaired intestinal absorption
    (relevant in HT given its comorbidity with autoimmune gastritis and celiac
    disease); only the intake route is currently wired in as an evidenced edge.
    Low selenium status raises the incidence of thyroid autoantibody
    seroconversion.
  phenotype_term:
    preferred_term: Selenium deficiency
    term:
      id: HP:0033192
      label: Decreased circulating selenium concentration
  evidence:
  - reference: PMID:35789269
    reference_title: "Increased Incidence of Hashimoto Thyroiditis in Selenium Deficiency: A Prospective 6-Year Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data indicate an increased incidence of TPO-Ab seroconversion with low Se supply and support the hypothesis that Se deficiency contributes to HT as a modifiable risk factor."
    explanation: >-
      Prospective cohort evidence grounding selenium deficiency as a modifiable
      risk state associated with onset of thyroid autoimmunity.
  notes: >-
    HP:0033192 is bound here as an upstream risk state, not a manifestation. The
    KGX/HPOA exporters detect that (this phenotype has a sequelae edge into a
    pathophysiology node) and export it as a direction-neutral
    `MONDO:0007699 biolink:associated_with HP:0033192` rather than
    `has_phenotype`, so the export does not invert the cited prospective cohort
    in which low selenium supply *precedes* TPO-Ab seroconversion. MONDO has no
    human selenium-deficiency class (MONDO:1017720 is explicitly
    non-human-animal, MONDO:0000241 Keshan disease is a distinct cardiomyopathy),
    so HP is the only grounding available - and, with the direction-aware
    exporter, the correct one.
  sequelae:
  - target: Thyroidal Oxidative Stress from Selenoprotein Insufficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of selenoprotein glutathione-peroxidase antioxidant capacity
    description: >-
      Selenium deficiency limits selenoprotein glutathione peroxidases, driving
      thyroidal oxidative stress.

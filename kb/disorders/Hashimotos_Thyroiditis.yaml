- name: NF-κB-IL-6 Signaling Pathway Activation
  description: >
    Genetic regulation of NF-κB and IL-6 signaling modulates the autoimmune
    response in Hashimoto's thyroiditis. CCDC77 and SLC45A3 are novel genetic
    modifiers that regulate NF-κB pathway activation and IL-6 production. CCDC77
    acts as a protective regulator (knockdown exacerbates thyroid damage),
    while SLC45A3 acts as a disease-promoting factor (knockdown alleviates thyroiditis).
    The NF-κB-IL-6 axis modulates immune cell activation and thyroid-targeted autoimmunity.

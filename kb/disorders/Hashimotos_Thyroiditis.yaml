    reference_title: "Start codon variant in LAG3 is associated with decreased LAG-3 expression and increased risk of autoimmune thyroid disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rs781745126-T reduces mRNA and surface expression of the inhibitory immune checkpoint LAG-3 co-receptor on activated lymphocyte subsets and halves LAG-3 levels in plasma among heterozygotes."
    explanation: A rare LAG3 5'-UTR start-codon variant lowers the inhibitory checkpoint LAG-3, unleashing autoreactive lymphocytes and conferring the largest single-variant AITD risk (OR 3.42).
- name: CCDC77
  association: Protective
  evidence:
  - reference: PMID:42283571
    reference_title: "CCDC77 and SLC45A3 mediate the genetic mechanism of Hashimoto's thyroiditis through IL-6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR analysis identified CCDC77 and SLC45A3 as key genes associated with both IL-6 and HT."
    explanation: Mendelian randomization using eQTL/GWAS data identifies CCDC77 as genetically associated with HT through IL-6.
  - reference: PMID:42283571
    reference_title: "CCDC77 and SLC45A3 mediate the genetic mechanism of Hashimoto's thyroiditis through IL-6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "knockdown of CCDC77 exacerbated thyroid damage, increased serum anti-thyroperoxidase antibody (TPOAb), anti-thyroglobulin antibody (TGAb), and IL-6 levels, while reduced free triiodothyronine (FT3) and free thyroxine (FT4)."
    explanation: NOD mouse knockdown demonstrates that CCDC77 loss exacerbates thyroid autoimmunity, confirming CCDC77 as protective through NF-κB-IL-6 signaling.

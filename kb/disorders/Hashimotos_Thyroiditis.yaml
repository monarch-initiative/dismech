  exposure_term:
    preferred_term: low vitamin D exposure
    modifier: DECREASED
    term:
      id: ECTO:9000133
      label: exposure to vitamin D
  influences_mechanisms:
  - target: Vitamin D Deficiency
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Inadequate dietary vitamin D and reduced cutaneous synthesis are the
      exposure that produces the systemic vitamin D-deficiency state (the
      grounded "Vitamin D Deficiency" state, MONDO:0100471). This is the weakest
      of the risk factors and the most exposed to reverse causation: the cited
      finding is that levels are lower in people who already have the disease,
      which cross-sectional data cannot separate from chronic illness lowering
      vitamin D. Recorded as PREDISPOSES rather than TRIGGERS for that reason,
      matching how the HCV edge is qualified.
    evidence:
    - reference: PMID:38542128
      reference_title: "Autoimmune Thyroiditis and Vitamin D."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "There is extensive literature confirming that vitamin D levels are significantly lower in HT patients compared to healthy people."
      explanation: >-
        PARTIAL because the snippet supports only half of what this edge
        asserts: it establishes that the deficiency state is associated with HT,
        but says nothing about dietary intake or cutaneous synthesis as the
        route to that state. It is also a cross-sectional comparison, so it does
        not establish direction.
  notes: >
    Low vitamin D status is consistently associated with HT; vitamin D has an
    immunomodulatory role promoting immune tolerance, and its deficiency is a
    candidate modifiable risk factor.
  evidence:
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is extensive literature confirming that vitamin D levels are significantly lower in HT patients compared to healthy people."
    explanation: A 2024 review confirms vitamin D levels are significantly lower in HT patients, supporting deficiency as an associated environmental risk factor.
treatments:
- name: Levothyroxine
  description: >
    Thyroid hormone replacement therapy, the mainstay of treatment. It corrects
    the hormone deficiency by bypassing the destroyed gland but does not address
    the upstream autoimmunity or inflammation.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Thyroid Hormone Deficiency
    treatment_effect: BYPASSES
    description: >

mechanistic_hypotheses:
- hypothesis_group_id: canonical_autoimmune_thyrocyte_destruction_model
  hypothesis_label: Canonical Autoimmune Thyrocyte Destruction Model
  status: CANONICAL
  description: >-
    Hashimoto's thyroiditis is a chronic autoimmune disease in which loss of immune tolerance to thyroid
    antigens — primarily thyroid peroxidase (TPO) and thyroglobulin (Tg) — drives lymphocytic
    infiltration of the thyroid gland, formation of intrathyroidal tertiary lymphoid structures, and
    progressive thyrocyte destruction. CD4 Th1 and Th17 cells, CD8 cytotoxic T cells, and autoantibody-
    mediated effects (anti-TPO, anti-Tg) act together to deplete follicular cells, producing primary
    hypothyroidism. Susceptibility is conferred by HLA-DR3/DR5, CTLA4, PTPN22, and other immune-
    regulation loci, with environmental triggers including iodine excess, viral infection, and selenium
    deficiency. Levothyroxine replacement reverses the hypothyroid syndrome by bypassing the destroyed
    gland, supporting glandular failure as the proximate clinical lesion in this canonical model.
  notes: >-
    Retained as CANONICAL. The 2026 openscientist
    hypothesis-search report
    (kb/hypotheses/Hashimotos_Thyroiditis/canonical_autoimmune_thyrocyte_destruction_model)
    confirms 12 of 13 mechanistic claims as established. Core
    effector mechanisms — Fas/FasL-mediated thyrocyte apoptosis
    (sensitized by IFN-γ + IL-1β, independent of perforin/granzyme),
    intrathyroidal tertiary lymphoid structures functioning as
    germinal centers with RAG1/RAG2 in situ receptor revision, and
    coordinated CD4 Th1/Th17 + CD8 + autoantibody (anti-TPO in
    >90%) responses — are validated by histopathology, single-cell
    transcriptomics, and immune-checkpoint-inhibitor-induced
    thyroiditis as a natural experiment. JAK inhibition has
    provided proof-of-concept reversal. Six refinements: (1) Th17/Treg
    imbalance is now established as an upstream initiator
    preceding Th1-mediated destruction, not captured by the seed
    description; (2) IgG4-related thyroiditis (~27%) and
    seronegative HT (~12%) are clinically significant subtypes the
    model does not address; (3) GWAS identifies 418 independent
    signals (vs ~5 canonical loci) explaining only ~5.4% of
    variance, indicating extensive polygenicity; (4) the gut-
    thyroid axis (molecular mimicry, SCFA depletion) provides a
    mechanistic bridge from environmental triggers to immune
    dysregulation; (5) thyrocyte HLA class II expression (Bottazzo
    hypothesis) and NETosis are increasingly implicated;
    (6) sex-specific intrathyroidal B-cell homing via CXCL13-CXCR5
    helps explain the female predominance. The initial
    tolerance-breaking event remains unknown and no disease-
    modifying RCT has yet been completed.
  evidence:
  - reference: PMID:38731922
    reference_title: "Autoimmunity, New Potential Biomarkers and the Thyroid Gland-The Perspective of Hashimoto's Thyroiditis and Its Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hashimoto's thyroiditis (HT) is generally characterized by the presence"
    explanation: >
      Canonical mechanism reference used as the seed for the
      hypothesis-search deep-research run.
pathophysiology:
- name: Loss of Immune Tolerance to Thyroid Antigens
  description: >
    Susceptibility variants in T-cell regulatory and immune-checkpoint genes
    (HLA class II, CTLA4, PTPN22, LAG3) act together with environmental triggers
    (iodine excess, selenium/vitamin D status, viral infection) to break
    self-tolerance to thyroid peroxidase and thyroglobulin, the initiating lesion
    that licenses autoreactive T- and B-cell responses against the thyroid. A
    rare LAG3 start-codon variant that lowers the inhibitory checkpoint LAG-3
    exemplifies how impaired T-cell down-regulation predisposes to autoimmune
    thyroid disease.
  role: trigger
  genes:
  - preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  - preferred_term: PTPN22
    term:
      id: hgnc:9652
      label: PTPN22
  - preferred_term: LAG3
    term:
      id: hgnc:6476
      label: LAG3
  evidence:
  - reference: PMID:38982041
    reference_title: "Start codon variant in LAG3 is associated with decreased LAG-3 expression and increased risk of autoimmune thyroid disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiomics analysis yields 235 candidate genes outside the MHC-region and the findings highlight the importance of genes involved in T-cell regulation."
    explanation: A large AITD GWAS meta-analysis localizes susceptibility to T-cell regulatory genes, supporting loss of T-cell tolerance as the initiating mechanism.
  downstream:
  - target: Thyrocyte Antigen Presentation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autoreactive T helper cell priming against TPO/Tg
    description: >
      Breakdown of tolerance permits autoreactive T cells and an interferon-rich
      milieu that drives thyroid follicular cells to present antigen.
  - target: Lymphocytic Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Autoreactive lymphocyte activation and thyroid homing
    description: >
      Loss of tolerance licenses autoreactive T and B lymphocytes that traffic
      into and accumulate within the thyroid gland.
- name: Thyrocyte Antigen Presentation
  description: >
    Under interferon-gamma and TNF-alpha exposure, thyroid follicular cells
    aberrantly upregulate MHC class II together with the invariant chain CD74 and
    its ligand MIF, becoming non-professional antigen-presenting cells. This
    amplifies local antigen presentation and ligand-receptor cross-talk with
    infiltrating immune cells, sustaining and propagating the intrathyroidal
    autoimmune response.
  role: amplifier
  cell_types:
  - preferred_term: Thyroid Follicular Cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  biological_processes:
  - preferred_term: Antigen presentation via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
    modifier: INCREASED
  evidence:
  - reference: PMID:39003267
    reference_title: "Unraveling the molecular architecture of autoimmune thyroid diseases at spatial resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify damaged antigen-presenting TFCs with upregulated CD74 and MIF expression in thyroid samples from AITD patients."
    explanation: Spatial transcriptomics shows thyroid follicular cells act as antigen-presenting cells via CD74/MIF upregulation, driving local autoimmunity.
    images:
    - Hashimotos_Thyroiditis-deep-research-falcon_artifacts/image-1.png
  downstream:
  - target: Lymphocytic Infiltration
    causal_link_type: DIRECT
    description: >
      Thyrocyte antigen presentation and chemokine expression recruit and
      activate infiltrating lymphocytes within the gland.

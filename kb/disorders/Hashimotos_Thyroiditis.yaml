    snippet: "SLC45A3 knockdown alleviated thyroiditis, reduced antibody levels, and improved thyroid function."
    explanation: NOD mouse knockdown shows that SLC45A3 reduction ameliorates thyroid autoimmunity, confirming SLC45A3 as a risk factor via NF-κB-IL-6 axis.
environmental:
- name: Iodine Excess
  notes: Can trigger or worsen disease
  evidence:
  - reference: PMID:28290237
    reference_title: "Multiple Nutritional Factors and the Risk of Hashimoto's Thyroiditis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic exposure to excess iodine intake induces autoimmune thyroiditis, partly because highly iodinated thyroglobulin (Tg) is more immunogenic."
    explanation: Excess iodine exposure is associated with autoimmune thyroiditis in HT-focused nutritional risk literature.
- name: Selenium Deficiency
  notes: May increase risk
  evidence:
  - reference: PMID:35789269
    reference_title: "Increased Incidence of Hashimoto Thyroiditis in Selenium Deficiency: A Prospective 6-Year Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data indicate an increased incidence of TPO-Ab seroconversion with low Se supply and support the hypothesis that Se deficiency contributes to HT as a modifiable risk factor."
    explanation: Prospective cohort data support selenium deficiency as a modifiable risk factor for Hashimoto's thyroiditis.
- name: Viral Infections
  notes: Potential trigger
  evidence:
  - reference: PMID:32107168
    reference_title: "Graves' disease: Epidemiology, genetic and environmental risk factors and viruses."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Many studies showed that HCV is associated with thyroid autoimmunity and hypothyroidism, in patients with chronic HCV hepatitis (CHC); a significant link has been shown also between HCV-related mixed cryoglobulinemia and risk for GD."
    explanation: Viral infection (notably HCV) is associated with thyroid autoimmunity and hypothyroidism.
- name: Vitamin D Deficiency
  notes: >
    Low vitamin D status is consistently associated with HT; vitamin D has an
    immunomodulatory role promoting immune tolerance, and its deficiency is a
    candidate modifiable risk factor.
  evidence:
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is extensive literature confirming that vitamin D levels are significantly lower in HT patients compared to healthy people."
    explanation: A 2024 review confirms vitamin D levels are significantly lower in HT patients, supporting deficiency as an associated environmental risk factor.
treatments:
- name: Levothyroxine
  description: >
    Thyroid hormone replacement therapy, the mainstay of treatment. It corrects
    the hormone deficiency by bypassing the destroyed gland but does not address
    the upstream autoimmunity or inflammation.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Thyroid Hormone Deficiency
    treatment_effect: BYPASSES
    description: >
      Exogenous levothyroxine restores circulating T4/T3 and normalizes TSH,
      bypassing the hormone-synthesis capacity lost to glandular destruction.
    evidence:
    - reference: PMID:35235282
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Management includes thyroid hormone replacement, ideally levothyroxine."
      explanation: Levothyroxine replaces the deficient thyroid hormone output.
  evidence:
  - reference: PMID:35235282
    reference_title: "Thyroid and Parathyroid Conditions: Hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management includes thyroid hormone replacement, ideally levothyroxine."
    explanation: Levothyroxine is standard hormone replacement therapy in hypothyroidism due to HT.
- name: Selenium Supplementation
  description: >
    Adjunctive selenium can lower thyroid autoantibody titers, but a 2024
    multicenter double-blind RCT found no quality-of-life benefit over placebo in
    LT4-treated autoimmune thyroiditis, illustrating a biomarker-outcome
    dissociation.
  target_mechanisms:
  - target: Autoimmune Thyroid Destruction
    treatment_effect: MODULATES
    description: >
      Selenium lowers TPO antibody titers, a serologic readout of the autoimmune
      process, without clearly altering clinical outcome.
    evidence:
    - reference: PMID:38243784
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In people with HT without THRT, selenium was effective and safe in lowering TSH, TPOAb, and MDA levels."
      explanation: Selenium modulates the autoimmune biomarker profile (TPOAb) in HT.
  evidence:
  - reference: PMID:38243784
    reference_title: "Selenium Supplementation in Patients with Hashimoto Thyroiditis: A Systematic Review and Meta-Analysis of Randomized Clinical Trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In people with HT without THRT, selenium was effective and safe in lowering TSH, TPOAb, and MDA levels."
    explanation: Meta-analysis supports selenium as a potential adjunct in selected HT patients.
  - reference: PMID:38215286
    reference_title: "Selenium supplementation and placebo are equally effective in improving quality of life in patients with hypothyroidism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "no difference in any of the ThyPRO-39 scales was found between the selenium group and the placebo group after 12 months of intervention"
    explanation: A 412-patient double-blind RCT found selenium gave no quality-of-life benefit over placebo despite biochemical antibody effects, tempering enthusiasm for routine use.
- name: Vitamin D Supplementation
  description: >
    Cholecalciferol supplementation in vitamin D-deficient HT patients can lower
    thyroid autoantibody titers; evidence is preliminary and further randomized
    trials are needed.
  target_mechanisms:
  - target: Autoimmune Thyroid Destruction
    treatment_effect: MODULATES
    description: >
      Vitamin D's immunomodulatory action is associated with reduced thyroid
      autoantibody titers in deficient patients.
    evidence:
    - reference: PMID:38542128
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "after the supplementation with cholecalciferol in patients with HT and vitamin D deficiency, thyroid autoantibody titers decreased significantly."
      explanation: Cholecalciferol supplementation reduces thyroid autoantibody titers in vitamin D-deficient HT patients.
  evidence:
  - reference: PMID:38542128
    reference_title: "Autoimmune Thyroiditis and Vitamin D."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "after the supplementation with cholecalciferol in patients with HT and vitamin D deficiency, thyroid autoantibody titers decreased significantly."
    explanation: Supports vitamin D repletion as an adjunct that lowers autoantibody titers in deficient HT patients.
- name: Monitoring
  description: Regular TSH monitoring to adjust replacement dose.
  evidence:
  - reference: PMID:35235282
    reference_title: "Thyroid and Parathyroid Conditions: Hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thyroid hormone should be titrated based on goal TSH values, symptoms, and potential treatment adverse effects."
    explanation: Ongoing TSH-based monitoring is required to titrate thyroid hormone replacement.

  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These experiments suggest that the deleterious consequences of DPP9 deficiency were mostly driven by the aberrant activation of the canonical NLRP1 inflammasome and IL-1β signaling."
    explanation: >-
      The summary claim for this node in the two animal models. It is a model-organism

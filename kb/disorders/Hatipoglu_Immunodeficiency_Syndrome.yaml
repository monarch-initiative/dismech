name: Hatipoglu Immunodeficiency Syndrome
creation_date: "2026-09-23T19:41:29Z"
category: Mendelian
synonyms:
- HATIS
- Hatipoglu syndrome
- DPP9 deficiency
description: >-
  Hatipoglu immunodeficiency syndrome is an autosomal recessive inborn error of
  immunity caused by biallelic loss-of-function or hypomorphic variants in DPP9
  (OMIM 620331). DPP9 is a cytosolic dipeptidyl peptidase whose job in innate
  immunity is restraint: it holds the two FIIND-domain inflammasome sensors, NLRP1
  and CARD8, in a repressed ternary complex. When DPP9 is lost, that restraint is
  lifted and the sensors fire without any danger signal, so the disease is a
  derepression disorder rather than a sensor gain-of-function one.

  The clinical picture in the four children of the founding cohort was a triad of
  failure to thrive, skin manifestations and pancytopenia, together with
  susceptibility to bacterial and herpesviral infection. Three of the four needed
  haematopoietic stem cell transplantation for the marrow phenotype. Presentation
  is paediatric throughout - growth restriction from infancy, recurrent fever and
  transfusion-dependent anaemia - and the reported cohort is still small enough
  that patient counts, not frequencies, are the honest unit.

  Two things make the mechanism worth reading carefully. First, it splits by tissue
  and by species: NLRP1 drives the skin arm, demonstrated in patient keratinocytes,
  while the haematopoietic arm runs through CARD8, a gene that does not exist in
  the mouse - which is why Dpp9-mutant mice have normal haematopoiesis while the
  human disease is defined by marrow failure. Second, that split has a therapeutic
  consequence: IL-1 blockade addresses the NLRP1/IL-1 arm the animal models rescue,
  but the CARD8-driven pyroptosis of human stem cells was rescued by deleting CARD8
  or CASP1 and not by deleting NLRP1.

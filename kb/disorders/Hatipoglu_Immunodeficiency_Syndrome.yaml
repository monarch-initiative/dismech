genetic:
- name: DPP9
  gene_term:
    preferred_term: DPP9
    term:
      id: hgnc:18648
      label: DPP9
  relationship_type: CAUSATIVE
  notes: >-
    The only gene implicated in this disease. DPP9 encodes a cytosolic dipeptidyl
    peptidase; the reported disease alleles are private to each family, so there is no
    recurrent variant to test for and diagnosis has been by exome sequencing in every
    published case. DPP9 is constrained against loss of function in population data,
    which is consistent with a recessive disease in which no homozygous damaging
    variant had previously been observed. The gene reaches the pathograph through the
    genes descriptor on the Biallelic DPP9 Loss-of-Function Variants node.
  variants:
  - name: c.331C>T (p.R111*)
    description: >-
      Homozygous in both affected cousins of the consanguineous Bedouin family.
  - name: c.641C>G (p.S214*)
    description: >-
      Maternally inherited nonsense allele in the compound heterozygous proband.
  - name: c.449G>A (p.G167S)
    description: >-
      Paternally inherited missense allele in the same proband, affecting a residue in
      a flexible loop at the periphery of the DPP9 substrate binding site and predicted
      to diminish substrate binding or catalytic efficiency.
  - name: c.2551C>T (p.Q851*)
    description: >-
      Homozygous in the Turkish proband; no endogenous DPP9 protein was detectable in
      that patient's cells.
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identified three unrelated families with Hatipoğlu syndrome, an autosomal recessive DPP9 deficiency, which is characterized by immune-associated defects and dermatological anomalies."
    explanation: >-
      Names the gene, the inheritance and the disease together.
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No homozygous damaging variants have been reported for DPP9 which is significantly averse to loss-of-function mutations according to genomAD (12)."
    explanation: >-
      Population constraint on the gene, quoted as the source prints it, including its
      spelling of gnomAD.
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense mutation p.G167S found in proband F1: II.2 affected a residue in a flexible loop that was located at the periphery of the DPP9 substrate binding site (Fig. 1D)."
    explanation: >-
      The structural placement of the one missense allele in the series, which is the
      basis for calling it hypomorphic rather than null.

diagnosis:
- name: Exome sequencing identifying biallelic DPP9 variants
  description: >-
    The diagnosis has been made by exome sequencing in every published case. There is
    no recurrent allele and the reported variants are private to each family, so a
    targeted single-variant test has nothing to target; what matters clinically is
    that DPP9 is included on the bone-marrow-failure and inborn-error-of-immunity
    panels being run.
  evidence:
  - reference: PMID:41082409
    reference_title: "Recurrent Transfusions and Severe Infections: Unmasking Hatipoglu Immunodeficiency Syndrome: Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole exome sequencing displayed DPP9 mutation in both the twins"
    explanation: >-
      Exome sequencing making the diagnosis in the most recently reported patients.
- name: Dihydrorhodamine testing is not specific in this disease
  description: >-
    In the twin case the dihydrorhodamine test was positive and initially suggested
    chronic granulomatous disease, until exome sequencing redirected the diagnosis.
    This is one report rather than a characterised feature of the disease, but it is
    the kind of finding that can stop a workup at the wrong answer, so it is recorded
    as a differential-diagnosis caveat and not as a diagnostic criterion.
  evidence:
  - reference: PMID:41082409
    reference_title: "Recurrent Transfusions and Severe Infections: Unmasking Hatipoglu Immunodeficiency Syndrome: Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunodeficiency workup showed positive Dihydrorhodamine test suggestive of chronic granulomatous disease and whole exome sequencing displayed DPP9 mutation in both the twins."
    explanation: >-
      The misleading result and the test that resolved it, in one sentence.
treatments:
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only intervention reported to address the marrow failure. Three of the four
    children in the founding cohort required it, and the 2026 mechanistic study
    describes transplantation as what current treatment requires. Post-transplant
    outcome data are not available in the published cohort, and whether transplantation
    changes the cutaneous or neurodevelopmental features is unknown - it replaces the
    haematopoietic compartment, which is the compartment the CARD8 mechanism destroys,
    and says nothing about DPP9 function elsewhere.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Bone Marrow Stem and Progenitor Depletion
    description: >-
      Transplantation replaces the depleted DPP9-deficient stem cell pool with donor
      cells that retain DPP9 and so are not subject to CARD8-driven pyroptosis.
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These included failure to thrive (consisting of poor weight gain, growing below the 3rd percentile), skin manifestations, pancytopenia and susceptibility to infections, which in the case of F1: II.2, F3: II:11 and III:1 required hematopoietic stem cell transplant."
    explanation: >-
      Names the three of four patients who required transplantation and the features
      that drove it.
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Current treatment requires bone marrow transplantations (1)."
    explanation: >-
      A second group's statement of the current standard. It is an introductory sentence
      citing the founding cohort rather than a result of this paper, which is why it is
      graded HUMAN_CLINICAL for the evidence it describes and BACKGROUND for where it
      sits in this publication.
- name: Red cell transfusion support
  description: >-
    Supportive rather than disease-modifying. The twins needed repeated transfusions
    and repeated hospitalisation for the anaemia before the diagnosis was made, which
    is the practical shape of the disease for a family in the months before exome
    results return.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:41082409
    reference_title: "Recurrent Transfusions and Severe Infections: Unmasking Hatipoglu Immunodeficiency Syndrome: Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 8-month-old pair of twins born to a nonconsanguineous marriage with similar presentation showing severe anemia and recurrent sino-pulmonary infections requiring multiple hospitalizations and blood transfusions with investigations suggestive of macrocytic anemia unresponsive to B12 supplementation."
    explanation: >-
      The reported transfusion requirement. This is a two-patient observation, not a
      management guideline.
- name: IL-1 pathway blockade (proposed)
  description: >-
    Proposed, not established. The animal genetics are the argument: removing a single
    copy of Il-1r was enough to produce an almost normal adult mutant mouse, and the
    authors raise IL-1 receptor antagonism as a way to get part of that effect
    pharmacologically. No patient outcome on anakinra is reported in the sources cited
    in this entry. The 2026 humanized-mouse work also bounds what this could be
    expected to do: the haematopoietic arm runs through CARD8 and caspase-1 and was not
    rescued by removing NLRP1, so IL-1 blockade is a rationale for the inflammatory arm
    rather than for the marrow failure.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: interleukin-1 receptor antagonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: IL-1-Driven Cutaneous and Systemic Inflammation
    treatment_effect: INHIBITS
    description: >-
      Blocking the IL-1 receptor targets the effector node the animal rescues act on.
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "it raises the possibility that even partial inhibition of the NLRP1-inflammasome pathway, with IL-1Ra (anakinra) for example, would provide some therapeutic benefit for DPP9 deficient patients"
    explanation: >-
      The authors' proposal, quoted with its hedge intact. It is a mechanism-based
      rationale drawn from mouse genetics, not a reported patient response.
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of CARD8 or CASP1 rescued cytopenia and loss of DPP9-deficient bone marrow stem cells, whereas NLRP1 deficiency did not."
    explanation: >-
      Cuts against the NLRP1/IL-1 rationale for the haematological phenotype
      specifically: the arm that produces the cytopenia was not rescued by removing
      NLRP1. It does not bear on the cutaneous arm.
animal_models:
- name: Dpp9 S759A catalytically inactive knock-in mouse
  species: Mouse
  genotype: Dpp9 S759A homozygous knock-in (catalytically inactive DPP9)
  publication: PMID:36112693
  description: >-
    The model that established the inflammasome dependence of DPP9 deficiency in vivo.
    Homozygotes die within a day of birth, and that lethality is rescued by removing a
    single copy of Nlrp1a/b/c, Asc, Gsdmd or Il-1r - but not Il-18. It does not model
    the human blood phenotype: mutant mice have no significant haematological
    abnormality.
  modeled_mechanisms:
  - target: IL-1-Driven Cutaneous and Systemic Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The genetic rescue series is the strongest available evidence that IL-1 receptor
      signalling downstream of the NLRP1 inflammasome is the limiting effector of DPP9
      deficiency in a whole animal.
    limitations: >-
      Mouse Nlrp1 paralogues are not the human sensor, and the readout rescued is
      neonatal lethality rather than any feature of the human disease.
    evidence:
    - reference: PMID:36112693
      reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The removal of a single copy of Nlrp1a/b/c, Asc, Gsdmd, or Il-1r, but not Il-18, was sufficient to rescue the lethality of Dpp9 mutant neonates in mice."
      explanation: >-
        The rescue series that grounds this link, including the negative result for
        Il-18.
  - target: Bone Marrow Stem and Progenitor Depletion
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse does not develop the cytopenia that defines the human disease.
    limitations: >-
      Mice have no CARD8 gene at all, so the sensor that drives human HSPC pyroptosis is
      absent from the model by construction. No refinement of a conventional mouse model
      can recover this arm.
    evidence:
    - reference: PMID:36112693
      reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, we do not observe significant haematological abnormalities similar to those observed in patients with germline loss of DPP9 activity."
      explanation: >-
        The explicit negative result: the model does not reproduce the patients'
        haematological phenotype.
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Given that CARD8 is absent from the mouse genome yet highly enriched in human hematopoietic cell populations, we propose that the mouse-human discrepancy in DPP9 deficiency reflects a fundamentally distinct inflammasome logic governing human blood stem cell survival, one in which CARD8 serves as a sentinel whose unchecked activation is sufficient to collapse human hematopoiesis."
      explanation: >-
        The species difference that explains the failure, which is what makes this a
        structural limitation rather than a tuning problem.

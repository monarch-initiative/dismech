inheritance:
- name: Autosomal recessive
  description: >-
    Every reported affected individual carries two damaged DPP9 alleles - homozygous
    stop-gained variants in the two consanguineous families, and a compound
    heterozygous missense/nonsense pair in the third. Parents and unaffected siblings
    were heterozygous or non-carriers. The twins of the 2025 case report were born to
    a non-consanguineous couple, so consanguinity enriches for the disease without
    being required for it.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each propositus was shown to segregate a homozygous germline stop-gained variant (c.331C>T; p.R111*) while available parents and siblings were either heterozygous or non-carrier consistent with Mendelian recessive inheritance."
    explanation: >-
      Segregation in the Bedouin family, stated as establishing recessive inheritance.
  - reference: PMID:41082409
    reference_title: "Recurrent Transfusions and Severe Infections: Unmasking Hatipoglu Immunodeficiency Syndrome: Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hatipoglu immunodeficiency syndrome (HATIS) is an autosomal recessive immunologic disorder, characterized by cytopenias, recurrent infections, and failure to thrive associated with biallelic mutation in DPP9 gene."
    explanation: >-
      An independent group naming the inheritance mode and the biallelic requirement.
pathophysiology:
- name: Biallelic DPP9 Loss-of-Function Variants
  description: >-
    The initiating lesion. Germline nonsense variants (p.R111*, p.S214*, p.Q851*)
    and one missense variant (p.G167S) affecting the substrate-binding site behave
    as knockout or hypomorphic alleles. The catalytic domain sits at the C-terminus,
    so the stop-gained alleles are expected to abolish enzymatic activity outright;
    no DPP9 protein at all was detectable in the fibroblasts of the p.Q851*
    homozygote.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  genes:
  - preferred_term: DPP9
    term:
      id: hgnc:18648
      label: DPP9
  molecular_functions:
  - preferred_term: DPP9 dipeptidyl peptidase activity
    modifier: DECREASED
    term:
      id: GO:0008239
      label: dipeptidyl-peptidase activity
  downstream:
  - target: Proportionate short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn from the lesion rather than from the inflammasome node on purpose. In the
      mouse, runting persisted after NLRP1 deletion, so the growth phenotype is
      attributed to a DPP9 function that does not run through the inflammasome. Which
      function is not known, which is what the unknown-intermediates link type records.
    evidence:
    - reference: PMID:36112693
      reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, these results suggest inflammasome-independent roles of DPP9 relating to stature and lung inflammation, which is consistent with the broad range of processes regulated by DPP9."
      explanation: >-
        Assigns stature to an inflammasome-independent DPP9 role, which is what routes
        this edge from the lesion node rather than from the IL-1 effector node.
  - target: Loss of DPP9 Restraint on FIIND Inflammasome Sensors
    causal_link_type: DIRECT
    description: >-
      The patient alleles are less able to hold NLRP1 in its inactive state, which is
      the function the downstream node loses.
    evidence:
    - reference: PMID:36112693
      reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, these experiments suggest that these DPP9 patient variants are less able to maintain NLRP1 in the inactive state."
      explanation: >-
        Connects the specific patient alleles to the loss of repression, rather than
        citing loss of DPP9 function and NLRP1 derepression as two separate facts.
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these variants were shown to behave as hypomorphic or knockout alleles that failed to repress NLRP1"
    explanation: >-
      Classifies the allele series as hypomorphic or null, which is what the
      LOSS_OF_FUNCTION category on this node asserts.
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The stop-gain mutations found in these 3 probands from Families 2 and 3 were expected to completely abolish the enzymatic activity of DPP9, since its catalytic domain is situated at the C-terminus."
    explanation: >-
      The structural reason the nonsense alleles are nulls rather than partial-activity
      alleles.
- name: Loss of DPP9 Restraint on FIIND Inflammasome Sensors
  description: >-
    DPP9 normally sits in a ternary complex with full-length NLRP1 and the
    autoproteolytically released NLRP1 C-terminal UPA-CARD fragment, sequestering
    that fragment so it cannot oligomerise. CARD8 is held by an analogous, though
    not identical, DPP9 complex - the CARD8 C-terminus does not engage the DPP9
    active site the way NLRP1's does, and DPP9's catalytic activity rather than its
    binding is what restrains CARD8. Losing DPP9 removes both restraints at once,
    which is why one enzyme deficiency produces two tissue-specific arms of disease.
  biological_scale: MOLECULAR
  downstream:
  - target: NLRP1 Inflammasome Activation in Keratinocytes
    causal_link_type: DIRECT
  - target: CARD8 Inflammasome Activation in Hematopoietic Progenitors
    causal_link_type: DIRECT
    description: >-
      The human haematopoietic arm. Deleting DPP9 in human CD34+ cells activates
      CARD8, and it is this branch rather than the NLRP1 branch that kills the cells.
    evidence:
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, DPP9 deficiency led to activation of the CARD8 inflammasome, resulting in HSPC pyroptosis, whereas NLRP1 was dispensable for cell death."
      explanation: >-
        States the edge and, in the same sentence, that the NLRP1 branch does not
        account for it.
  evidence:
  - reference: PMID:33731932
    reference_title: "DPP9 sequesters the C terminus of NLRP1 to repress inflammasome activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The structures reveal a ternary complex that comprises DPP9, full-length NLRP1 and the NLRPT CT."
    explanation: >-
      The structural basis of the repression this node loses. Note the source's own
      typography: it prints "NLRPT CT" where it means the NLRP1 C-terminal fragment,
      and the quote is reproduced as printed.
  - reference: PMID:34019797
    reference_title: "Dipeptidyl peptidase 9 sets a threshold for CARD8 inflammasome formation by sequestering its active C-terminal fragment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report cryoelectron microscopy (cryo-EM) structures of CARD8 bound to DPP9, revealing a repressive ternary complex consisting of DPP9, full-length CARD8, and CARD8-CT."
    explanation: >-
      The same repressive architecture for CARD8, which is the sensor behind the
      haematopoietic arm of this disease.
  - reference: PMID:31525884
    reference_title: "DPP9's Enzymatic Activity and Not Its Binding to CARD8 Inhibits Inflammasome Activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, wild-type, but not catalytically inactive mutant, DPP9 rescues CARD8-mediated cell death in DPP9 knockout cells."
    explanation: >-
      Establishes that it is DPP9 catalytic activity that restrains CARD8, which is why
      hypomorphic missense alleles and nulls converge on the same downstream node.
- name: NLRP1 Inflammasome Activation in Keratinocytes
  description: >-
    In skin, the liberated NLRP1 C-terminal fragment oligomerises, recruits ASC and
    pro-caspase-1, and fires without any exogenous trigger. Patient keratinocytes do
    this spontaneously in culture. The release is real but modest compared with
    pharmacological DPP8/DPP9 inhibition of control cells, because DPP8 remains
    intact in these patients and partially covers for the missing DPP9.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  downstream:
  - target: IL-1-Driven Cutaneous and Systemic Inflammation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the proband keratinocytes, as do keratinocytes from patients with gain-of-function NLRP1 mutations (5), spontaneously secreted active IL-1β and IL-18 into the media without any exogenous stimulus."
    explanation: >-
      Direct human-cell demonstration of unprovoked inflammasome output, which is what
      this node claims.
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data indicate that loss of DPP9 function in patient-derived cells could indeed be partially compensated by DPP8, accounting for their modest yet significant IL-1β release and cell death."
    explanation: >-
      The DPP8 compensation that sets the magnitude of this node, and the reason the
      skin phenotype is milder than in NLRP1 gain-of-function disease.
- name: CARD8 Inflammasome Activation in Hematopoietic Progenitors
  description: >-
    The arm that defines the disease clinically, and the one no conventional mouse
    model could show. Human CD34+ haematopoietic stem and progenitor cells express
    CARD8 along with the full downstream apparatus. With DPP9 gone, CARD8 assembles
    and activates caspase-1. What triggers CARD8 in these cells is not established -
    the authors propose an as-yet-undefined cellular stress signal - so this node
    records de-repression, not a named trigger.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  - target: Caspase-1-Dependent Pyroptosis of Hematopoietic Stem and Progenitor Cells
    causal_link_type: DIRECT
    description: >-
      Deleting CASP1 rescues the cells, which is what makes the death caspase-1
      dependent rather than merely caspase-1 associated.
    evidence:
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pyroptosis was completely abrogated in HSPCs that lacked CARD8 or CASP1, suggesting that HSPCs undergo CARD8-dependent pyroptosis (Figure 5A)."
      explanation: >-
        The genetic epistasis behind this edge, in both the sensor and the protease.
  evidence:
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Downstream effectors including CASP1 and GSDMD were similarly expressed, indicating that human HSPCs possess the complete molecular apparatus required for inflammasome-driven pyroptosis (Figure 4D)."
    explanation: >-
      Establishes that the machinery this node needs is present in the cell type the
      node names.
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CARD8 may be triggered by a yet-to-be-defined cellular stress signal during transplantation of HSPCs and induce their pyroptosis in the absence of DPP9."
    explanation: >-
      Records that the proximal trigger is unknown, which is why this node is written
      as de-repression rather than as a response to a named danger signal.
- name: Caspase-1-Dependent Pyroptosis of Hematopoietic Stem and Progenitor Cells
  description: >-
    Active caspase-1 drives gasdermin-mediated membrane rupture and kills the cell.
    In the humanized-mouse system the loss is cell intrinsic: DPP9-deleted human
    HSPCs die whether or not unedited cells are present alongside them.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: pyroptotic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
  downstream:
  - target: Bone Marrow Stem and Progenitor Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "HSPC numbers were rescued by deletion of CARD8, suggesting that CARD8 mediated pyroptosis of DPP9–/– HSPCs in vivo, including HSCs and MPPs (Figure 5, B and C)."
      explanation: >-
        Rescuing the pyroptosis restores the progenitor pool, which is the edge from
        cell death to compartment depletion.
  evidence:
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The recapitulation of patient disease and the cell-intrinsic loss of stem cells suggest that the susceptibility to pyroptosis was a property of HSPCs rather than a consequence of transplantation models."
    explanation: >-
      Supports the death being a property of the DPP9-deficient cell itself rather than
      of its environment.
- name: Bone Marrow Stem and Progenitor Depletion
  description: >-
    Loss of the stem and progenitor pool is what turns a molecular derepression into
    the marrow failure that drives the clinical course. It is the point at which the
    disease becomes transplant-dependent.
  biological_scale: TISSUE
  downstream:
  - target: Pancytopenia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these results reveal that DPP9–/– HSPCs undergo CARD8-mediated pyroptosis after transplantation and that loss of bone marrow stem cells leads to peripheral cytopenia."
      explanation: >-
        States the marrow-to-peripheral-blood step directly.
  - target: Anemia
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The infectious susceptibility is read here as downstream of marrow failure, which
      is how the 2026 study frames it, rather than as an independent lesion of immune
      function.
    evidence:
    - reference: PMID:42741941
      reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "How human DPP9 mutations cause pancytopenia remains an important question, since pancytopenia probably causes recurrent infection due to the lack of immune cells and the need for bone marrow transplantation."
      explanation: >-
        The authors' own reading of the causal order. Their hedge ("probably") is worth
        keeping in view: this edge is an inference from the cytopenia, not a separately
        demonstrated result.
  evidence:
  - reference: PMID:42741941
    reference_title: "Reverse genetics in humanized mice reveals CARD8-mediated pyroptosis causing pancytopenia in human DPP9 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Human DPP9 deletion recapitulated cytopenia in peripheral blood and in the bone marrow, and cell loss was cell intrinsic."
    explanation: >-
      Both compartments lose cells, which is what this node asserts.
- name: IL-1-Driven Cutaneous and Systemic Inflammation
  description: >-
    Mature IL-1 beta released from unprovoked inflammasome activation is the
    effector of the non-haematological arm. The animal genetics point at IL-1 rather
    than IL-18: removing one copy of Il-1r rescued the mutant mouse, while removing
    Il-18 did not.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  downstream:
  - target: Periodic fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Atopic dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36112693
    reference_title: "DPP9 deficiency: An inflammasomopathy that can be rescued by lowering NLRP1/IL-1 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The removal of a single copy of Nlrp1a/b/c, Asc, Gsdmd, or Il-1r, but not Il-18, was sufficient to rescue the lethality of Dpp9 mutant neonates in mice."
    explanation: >-
      Identifies IL-1 receptor signalling, and not IL-18, as the limiting effector in

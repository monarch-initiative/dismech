- name: MISTRG6 humanized mice engrafted with CRISPR-edited human CD34+ HSPCs
  experimental_model_type: OTHER
  description: >-
    Not an animal model of the disease but a human-cell system read out in a mouse
    host: human CD34+ haematopoietic stem and progenitor cells are CRISPR-edited to
    delete DPP9 and engrafted into MISTRG6 mice. Because the cells under study are
    human, the CARD8 sensor that mice lack is present, and the arm no conventional
    mouse model can show becomes visible. Deleting CARD8 or CASP1 rescued the cells;
    deleting NLRP1 did not.

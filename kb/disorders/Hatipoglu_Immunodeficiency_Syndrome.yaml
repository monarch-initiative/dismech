discussions:
- discussion_id: hatis_model_coverage_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does any tractable model of this disease cover the skin and neurodevelopmental
    arms, given that the mouse lacks CARD8 and the humanized system contains only
    haematopoietic cells?
  attaches_to:
  - pathophysiology#CARD8 Inflammasome Activation in Hematopoietic Progenitors
  - phenotypes#Specific learning disability
  rationale: >-
    The two available in vivo models sit on opposite sides of the mechanism and
    neither spans it. Conventional Dpp9 mutant mice have the whole organism but no
    CARD8, so they cannot produce the marrow failure and cannot be used to ask what
    else the haematopoietic arm causes. The MISTRG6 system has human CARD8 but only in
    an engrafted haematopoietic compartment, so it cannot address skin, growth or
    neurodevelopment. The features with no model behind them are exactly the ones whose
    mechanism is unstated: learning disability and speech delay in three of four
    children, and hemivertebrae in both children assessed, none of which has a
    demonstrated inflammasome route. The mouse does reproduce runting and lung
    inflammation independently of NLRP1, which is a hint that DPP9 has
    inflammasome-independent roles - but it is a hint about stature, not about the
    neurodevelopmental findings.
- discussion_id: hatis_card8_trigger_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What triggers CARD8 in DPP9-deficient human haematopoietic stem and progenitor
    cells?
  attaches_to:
  - pathophysiology#CARD8 Inflammasome Activation in Hematopoietic Progenitors
  rationale: >-
    Loss of DPP9 removes a restraint; it does not by itself supply the signal a sensor
    responds to. The authors of the 2026 study say only that an undefined cellular
    stress during transplantation may be the trigger. Until that is identified it is
    not possible to say whether the disease is driven by chronic low-level firing or by
    episodic stress-driven bursts, and that distinction bears directly on whether a
    CARD8 or caspase-1 inhibitor would need to be given continuously or only around
    insults.
notes: >-
  Entry scope. This entry covers the autosomal recessive disease caused by biallelic
  DPP9 loss of function, which is what MONDO:0957229 and OMIM 620331 name. A
  separately reported patient with a de novo heterozygous DPP9 p.Arg252Pro variant and
  hemophagocytic-lymphohistiocytosis-like hyperinflammation (PMID:37544411) is
  deliberately not curated here. That variant acts by destabilising DPP9 in a
  dominant-negative manner, so it is monoallelic disease by a different genetic
  mechanism and with a different clinical picture; folding it in would put two
  inheritance modes under one recessive disease term and make the patient counts in
  this entry uninterpretable. It belongs in a separate entry if and when a disease term
  exists for it.

  Module conformance. No pathophysiology node declares conforms_to. The only
  inflammasome module in kb/modules is nlrp3_inflammasome_activation, whose own
  description scopes it to the two-signal NLRP3 pathway in which a priming signal
  licenses the cell and an activating danger signal triggers assembly. Neither half of
  that applies here: NLRP1 and CARD8 are FIIND-domain sensors held in a repressive DPP9
  complex, and disease follows from loss of the repressor rather than from arrival of a
  danger signal. All five current conformers to that module are genuine NLRP3 diseases.
  A FIIND-sensor inflammasome module covering the NLRP1/CARD8/DPP9 axis would be a new
  module rather than a widening of that one.

  Structured sources. No Orphanet record, no GeneReviews chapter and no ClinGen
  gene-disease validity assertion for DPP9 were found for this disease;
  just check-genereviews returns NO_CHAPTER for both GeneReviews and StatPearls. The
  absence is consistent with a disease first delineated in 2022 with six published
  patients.

  Counts, not frequencies. The frequency bands in this entry are derived from counts
  out of the four patients of the founding cohort, which is the only series with a
  per-patient clinical table. Read them as what they are: a band over four children.
  The hemivertebrae entry carries no frequency at all because the feature was assessed
  in only two of the four.

  Not curated for want of a source. Reported serum IL-1 beta and IL-18 concentrations,
  anakinra dosing and patient response, post-transplant outcomes, and gnomAD allele
  frequencies for the individual DPP9 variants are all absent from this entry. The
  deep-research report raised the first three, in each case flagging that the figure
  came from a secondary summary rather than a primary read; none was confirmable
  against a cached primary source here, and a weaker adjacent citation is not a
  substitute for the one that does not exist.

transmission:
- name: Triatomine fecal contamination during blood feeding
  description: >-
    The dominant route: infected triatomines release metacyclic trypomastigotes
    in feces during blood meals, which enter through the bite wound or mucosa. In
    a large chronic-CD cohort, vectorial transmission accounted for ~91% of cases.
  evidence:
  - reference: PMID:18512345
    reference_title: "Host cell actin remodeling in response to Trypanosoma cruzi: trypomastigote versus amastigote entry."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While feeding on host's blood, infected triatomines release in their feces highly motile and infective metacyclic trypomastigotes that may initiate infection."
    explanation: The abstract links transmission to triatomine blood feeding and fecal contamination.
  - reference: PMID:40531676
    reference_title: "Association between transmission modes and chronic Chagas disease clinical forms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vectorial in 1962 (90.8%) patients, followed by blood transfusion in 123 (5.7%), congenital in 59 (2.7%)"
    explanation: Cohort data quantifying the relative frequency of transmission modes in chronic Chagas disease.
- name: Congenital (vertical) transmission
  description: >-
    Trypanosoma cruzi can be transmitted from an infected mother to the fetus
    transplacentally, an increasingly important route in both endemic and
    non-endemic (migration-affected) settings.
  evidence:
  - reference: PMID:25993972
    reference_title: "The Epidemiology, Clinical Manifestations, and Management of Chagas Heart Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "T cruzi is most commonly transmitted through the feces of an infected triatomine, but can also be congenital, via contaminated blood transfusion or through direct oral contact."
    explanation: Review documenting congenital, transfusion, and oral routes in addition to the dominant vectorial route.
- name: Transfusion and organ-transplant transmission
  description: >-
    Blood transfusion and organ transplantation transmit T. cruzi; blood-donor
    screening has substantially reduced this route in endemic countries.
  evidence:
  - reference: PMID:40531676
    reference_title: "Association between transmission modes and chronic Chagas disease clinical forms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vectorial in 1962 (90.8%) patients, followed by blood transfusion in 123 (5.7%), congenital in 59 (2.7%)"
    explanation: Cohort data quantifying transfusion as a transmission mode in chronic Chagas disease.
- name: Oral transmission via contaminated food or drink
  description: >-
    Ingestion of food or beverages contaminated with infected triatomine feces
    (e.g., acai, sugarcane juice) causes oral outbreaks, notably in Amazonian
    regions.
  evidence:
  - reference: PMID:25993972
    reference_title: "The Epidemiology, Clinical Manifestations, and Management of Chagas Heart Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "T cruzi is most commonly transmitted through the feces of an infected triatomine, but can also be congenital, via contaminated blood transfusion or through direct oral contact."
    explanation: Review documenting oral transmission as an additional route.
progression:
- phase: Acute phase
  duration: Weeks to a few months after infection
  notes: >-
    Often mild or asymptomatic; can cause an acute febrile illness with
    myocarditis, conduction abnormalities, or pericarditis, and (rarely) severe
    acute myocarditis or meningoencephalitis. A chagoma or Romana sign may mark
    the inoculation site.
  evidence:
  - reference: PMID:25993972
    reference_title: "The Epidemiology, Clinical Manifestations, and Management of Chagas Heart Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the acute phase, the disease can cause cardiac derangements such as myocarditis, conduction system abnormalities, and/or pericarditis."
    explanation: Documents the acute-phase clinical manifestations.
- phase: Indeterminate (asymptomatic chronic) form
  duration: Years to lifelong
  notes: >-
    After the acute phase most infected people enter the indeterminate form —
    seropositive but without symptoms or detectable cardiac/digestive
    involvement. About 60% remain in this form indefinitely and never progress.
  evidence:
  - reference: DOI:10.1177/15353702231220658
    reference_title: "Inflammation and mitochondria in the pathogenesis of chronic Chagas disease cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while most infected patients (60%) remain asymptomatic in the so-called indeterminate form (IF)."
    explanation: Establishes the indeterminate form as the outcome for the majority of infected patients.
- phase: Chronic symptomatic phase (cardiac and/or digestive)
  duration: Decades after infection
  notes: >-
    In roughly 30-40% of infected people the disease advances, over decades, to
    chronic Chagas cardiomyopathy and/or the digestive megasyndromes
    (megaesophagus, megacolon).
  evidence:
  - reference: PMID:25993972
    reference_title: "The Epidemiology, Clinical Manifestations, and Management of Chagas Heart Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If left untreated, the disease advances to the chronic phase."
    explanation: Documents progression from acute/indeterminate to the chronic phase.
  - reference: PMID:20399979
    reference_title: "Chagas disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease affects about 8 million people in Latin America, of whom 30-40% either have or will develop cardiomyopathy, digestive megasyndromes, or both."
    explanation: Quantifies the ~30-40% who develop chronic cardiac and/or digestive disease.
pathophysiology:
- name: Intracellular amastigote replication in host cells
  biological_scale: CELLULAR
  description: Metacyclic trypomastigotes invade host cells and differentiate into amastigotes that proliferate intracellularly.
  evidence:
  - reference: PMID:18512345
    reference_title: "Host cell actin remodeling in response to Trypanosoma cruzi: trypomastigote versus amastigote entry."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Metacyclic trypomastigotes promptly invade host cells (including gastric mucosa) and once free in the cytoplasm, differentiate into amastigotes that replicate by binary fission."
    explanation: The abstract describes intracellular invasion and amastigote replication.
  downstream:
  - target: Chronic Th1 myocarditis and parasite persistence
    description: Persistent parasitism of cardiac tissue drives chronic inflammatory myocardial injury.
  - target: Enteric nervous system denervation
    description: Parasitism of the digestive tract drives destruction of enteric neurons.
- name: Chronic Th1 myocarditis and parasite persistence
  biological_scale: TISSUE
  description: >-
    Low-grade parasite persistence in the myocardium sustains a chronic
    interferon-gamma/TNF-alpha-rich Th1 myocarditis over decades. Persistence is
    supported by the BENEFIT trial, in which the majority of patients with
    established chronic cardiomyopathy were PCR-positive for the parasite at
    baseline; about 30% of infected patients eventually develop chronic Chagas
    cardiomyopathy.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: DOI:10.1177/15353702231220658
    reference_title: "Inflammation and mitochondria in the pathogenesis of chronic Chagas disease cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a Th1-T cell rich myocarditis with abundant interferon (IFN)-γ and tumor necrosis factor (TNF)-α"
    explanation: Identifies the chronic IFN-gamma/TNF-alpha-rich Th1 myocarditis that drives chronic Chagas cardiomyopathy.
  - reference: PMID:26323937
    reference_title: "Randomized Trial of Benznidazole for Chronic Chagas' Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "60.5% had positive results for Trypanosoma cruzi on PCR."
    explanation: Documents ongoing parasite persistence (PCR positivity) in the majority of patients with established chronic Chagas cardiomyopathy.
  downstream:
  - target: Cardiomyocyte mitochondrial dysfunction
    description: Sustained IFN-gamma/TNF-alpha signaling impairs cardiomyocyte mitochondrial energetics.
- name: Cardiomyocyte mitochondrial dysfunction
  biological_scale: CELLULAR
  description: >-
    The constitutively upregulated IFN-gamma and TNF-alpha signaling of chronic
    Chagas myocarditis suppresses mitochondrial energy metabolism in
    cardiomyocytes, lowering high-energy phosphate/ATP production and impairing
    contractile and electrical function.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: DECREASED
    term:
      id: GO:0007005
      label: mitochondrion organization
  evidence:
  - reference: DOI:10.1177/15353702231220658
    reference_title: "Inflammation and mitochondria in the pathogenesis of chronic Chagas disease cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IFN-γ and TNF-α signaling, which are constitutively upregulated in CD patients, negatively affect mitochondrial function in cardiomyocytes, recapitulating findings in CCC heart tissue."
    explanation: Documents cytokine-driven cardiomyocyte mitochondrial dysfunction as a distinct step in CCC pathogenesis.
  downstream:
  - target: Myocardial fibrosis and arrhythmogenic substrate
    description: Inflammatory and metabolic injury drives fibrotic remodeling and an arrhythmia substrate.
- name: Myocardial fibrosis and arrhythmogenic substrate
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Chronic inflammation, mitochondrial dysfunction, and cardiomyocyte loss
    produce myocardial fibrosis (excess extracellular matrix), which together with
    these injuries forms the substrate for re-entrant ventricular arrhythmias and
    progressive ventricular remodeling.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: DOI:10.1177/15353702231220658
    reference_title: "Inflammation and mitochondria in the pathogenesis of chronic Chagas disease cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myocardial fibrosis, inflammation, and mitochondrial dysfunction are involved in the arrhythmia substrate and triggering events."
    explanation: Identifies fibrosis (with inflammation and mitochondrial dysfunction) as the arrhythmogenic substrate.
  downstream:
  - target: Ventricular remodeling and dilated cardiomyopathy
    description: Fibrotic injury drives maladaptive ventricular remodeling.
  - target: Ventricular arrhythmia
    description: The fibrotic substrate underlies re-entrant ventricular arrhythmias.
- name: Ventricular remodeling and dilated cardiomyopathy
  biological_scale: TISSUE
  description: >-
    Cumulative fibrosis and cardiomyocyte loss produce maladaptive ventricular
    remodeling and dilated cardiomyopathy — the hallmark chronic manifestation —
    with heart failure and arrhythmia as the fatal endpoints.
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle tissue morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0055008
      label: cardiac muscle tissue morphogenesis
  evidence:
  - reference: DOI:10.1177/15353702231220658
    reference_title: "Inflammation and mitochondria in the pathogenesis of chronic Chagas disease cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Death results from heart failure or arrhythmia in a subset of CCC patients."
    explanation: Identifies heart failure and arrhythmia as the fatal endpoints of the remodeling cascade.
  downstream:
  - target: Cardiomyopathy
    description: The remodeling cascade manifests clinically as Chagas cardiomyopathy.
- name: Enteric nervous system denervation
  biological_scale: TISSUE
  description: >-
    Inflammatory invasion of the enteric plexuses causes progressive destruction
    of myenteric (Auerbach) neurons throughout the digestive tract. The resulting
    intrinsic denervation impairs peristalsis and, in a subset of patients,
    produces the digestive megasyndromes (megaesophagus and megacolon).
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  evidence:
  - reference: PMID:20004942
    reference_title: "Characterization of enteroglial cells and denervation process in chagasic patients with and without megaesophagus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal form of Chagas disease involves an inflammatory invasion of the enteric plexuses and degeneration of enteric neurons"
    explanation: Human pathology study documenting inflammatory enteric-plexus invasion and neuronal degeneration as the digestive-form mechanism.
  - reference: PMID:32338024
    reference_title: "Megacolon with infectious etiology that is infrequent in our country: Chagas disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the digestive form is characterized by megaesophagus and megacolon. There is altered peristalsis due to the destruction of the neurons of the enteric nervous system caused by the parasite."
    explanation: Links enteric-neuron destruction to impaired peristalsis and the megaesophagus/megacolon megasyndromes.
  downstream:
  - target: Megaesophagus
    description: Esophageal denervation produces megaesophagus.
  - target: Megacolon
    description: Colonic denervation produces megacolon.

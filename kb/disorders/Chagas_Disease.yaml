- accession: geo:GSE299582
  title: Transcriptome analysis of circulating microRNAs associated with Chagas disease susceptibility and chronic Chagas cardiomyopathy severity
  description: Chagas disease (CD), caused by infection with the protozoan parasite Trypanosoma cruzi, is a major public health concern in Latin America. Understanding the molecular mechanisms driving disease progression and identifying biomarkers are crucial. We investigated the association of circulating microRNAs (miRNAs) with CD susceptibility and heart disease progression. A multicentric prospective observational study was conducted with 150 CD patients (46 indeterminate, 104 CCC [chronic chagasic cardiomyopathy] staged A-D) and 42 healthy controls from CD endemic areas. Sequencing of circulating miRNAs was performed, and differential expression analyses were conducted.

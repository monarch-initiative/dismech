treatments:
- name: Benznidazole or nifurtimox antitrypanosomal therapy
  description: >-
    Antiparasitic therapy with benznidazole or nifurtimox, the only two
    WHO-recognized trypanocidal drugs. Efficacy is highest in the acute phase,
    congenital infection, and early chronic (indeterminate) infection; in
    established chronic cardiomyopathy the BENEFIT trial showed it clears
    parasitemia but does not halt cardiac deterioration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benznidazole
      term:

name: Chagas disease
creation_date: '2026-01-26T15:56:41Z'
category: Infectious Disease
description: >-
  Chagas disease (American trypanosomiasis) is a vector-borne protozoal infection
  caused by Trypanosoma cruzi, transmitted by triatomine insects, with an
  intracellular amastigote phase in human tissues and chronic cardiac morbidity.
disease_term:
  term:
    id: MONDO:0001444
    label: Chagas disease
  preferred_term: Chagas disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:20399979
      reference_title: "Chagas disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Chagas disease is a chronic, systemic, parasitic infection caused by the protozoan Trypanosoma cruzi, and was discovered in 1909."
      explanation: Authoritative review classifying Chagas disease as a systemic protozoal (parasitic infectious) disease.
prevalence:
- population: Latin America
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1212.0
  notes: >-
    Rassi et al. estimated ~8 million people infected in Latin America; other
    contemporary reviews cite 6-7 million. Endemic across 21 continental Latin
    American countries, with growing case numbers in non-endemic regions
    (USA/Europe) driven by migration. Rate derived as ~8,000,000 cases over a
    Latin American population of ~660 million (~1.2% = 1212/100,000).
  evidence:
  - reference: PMID:20399979
    reference_title: "Chagas disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease affects about 8 million people in Latin America, of whom 30-40% either have or will develop cardiomyopathy, digestive megasyndromes, or both."
    explanation: Provides the widely cited ~8 million Latin American burden estimate.

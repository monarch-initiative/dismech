diagnosis:
- name: Serologic diagnosis (anti-T. cruzi IgG)
  description: >-
    Chronic Chagas disease is confirmed serologically by detecting specific
    anti-Trypanosoma cruzi IgG antibodies, conventionally requiring two positive
    tests using different methods. The two-test convention exists because there
    is no gold-standard assay: commercial serological tests perform unevenly
    across the endemic range, so single-assay results are frequently discordant
    and cannot stand alone. Reported sensitivity of recombinant-antigen rapid
    tests varies several-fold between countries (e.g. 87.5-90.7% in Bolivian
    specimens versus 26.6-55.2% in Peruvian specimens with the same assays),
    which is why assays are recommended to be field-validated per geographic
    site rather than assumed transferable. Whether that geographic variation is
    driven mainly by local T. cruzi strain/antigenic diversity or by
    host-to-host variation in antibody repertoire is unsettled - see the
    `gap_chagas_serodiagnostic_parasite_vs_host_variation` discussion.
  evidence:
  - reference: PMID:25993972
    reference_title: "The Epidemiology, Clinical Manifestations, and Management of Chagas Heart Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is confirmed by serologic testing for specific immunoglobulin G antibodies."
    explanation: Review identifying IgG serology as the confirmatory diagnostic modality for chronic infection.
  - reference: PMID:38381980
    reference_title: "Identification of highly conserved Trypanosoma cruzi antigens for the development of a universal serological diagnostic assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no gold standard for diagnosis and commercial serological tests perform poorly in certain locations"
    explanation: States the absence of a gold-standard serological assay and the geographically uneven performance of commercial tests that motivates the two-test confirmation convention.
  - reference: PMID:19270291
    reference_title: "Geographic variation in the sensitivity of recombinant antigen-based rapid tests for chronic Trypanosoma cruzi infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chagas disease rapid tests should be field tested in each geographic site before widespread implementation for screening."
    explanation: Field evaluation in Bolivian and Peruvian specimens documenting several-fold between-country differences in rapid-test sensitivity and concluding that assays must be validated per site.
- name: Molecular diagnosis (T. cruzi PCR)
  description: >-
    PCR detects circulating parasite DNA and is most useful in the acute phase,
    congenital infection, reactivation, and for monitoring trypanocidal treatment
    response; sensitivity is lower in the chronic phase.
  evidence:
  - reference: PMID:26323937
    reference_title: "Randomized Trial of Benznidazole for Chronic Chagas' Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "60.5% had positive results for Trypanosoma cruzi on PCR."
    explanation: BENEFIT trial used blood PCR to detect parasite persistence, illustrating PCR's role in chronic-phase parasite monitoring.
discussions:
- discussion_id: gap_chagas_persistence_vs_autoimmunity
  prompt: >-
    In chronic Chagas cardiomyopathy, how much of the ongoing myocardial injury
    is driven by persistent parasitism versus a self-sustaining autoimmune/
    inflammatory process, and why does clearing parasitemia with benznidazole
    fail to halt cardiac deterioration once cardiomyopathy is established?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic myocardial inflammation and cardiomyopathy
  rationale: >-
    The relative contributions of direct parasite persistence and of an
    immune-mediated (partly autoimmune) response to chronic Chagas cardiomyopathy
    are long debated. The BENEFIT trial sharpened the question: benznidazole
    significantly reduced serum parasite detection but did not reduce cardiac
    clinical deterioration over 5 years, implying that parasite clearance alone
    is insufficient once remodeling is established — consistent with a
    self-sustaining inflammatory/fibrotic process, an irreversibility threshold,
    or treatment given too late in the disease course.
  evidence:
  - reference: PMID:26323937
    reference_title: "Randomized Trial of Benznidazole for Chronic Chagas' Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The role of trypanocidal therapy in patients with established Chagas' cardiomyopathy is unproven."
    explanation: The trial's premise and null clinical result frame the persistence-versus-autoimmunity and treatment-timing controversy.
  proposed_experiments:
  - experiment_id: exp_chagas_early_vs_late_trypanocidal
    name: Trypanocidal therapy timing versus myocardial fibrosis progression
    description: >-
      Compare benznidazole given in the indeterminate phase versus established
      cardiomyopathy, tracking cardiac MRI fibrosis, inflammatory biomarkers, and
      clinical outcomes to test whether an irreversibility threshold explains the
      BENEFIT null and to define the treatment window in which parasite clearance
      still alters cardiac trajectory.
    experiment_type:
      preferred_term: prospective cohort study
- discussion_id: gap_chagas_icd_rct
  prompt: >-
    Do implantable cardioverter-defibrillators and other novel therapies reduce
    mortality in Chagas cardiomyopathy, given the high burden of ventricular
    arrhythmias and sudden death?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Ventricular arrhythmia
  rationale: >-
    Ventricular arrhythmias are a leading cause of death in Chagas cardiomyopathy,
    and ICDs are used in practice, but the mortality benefit specific to Chagas
    disease has not been established in adequately powered randomized trials.
  evidence:
  - reference: PMID:20399979
    reference_title: "Chagas disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the potential benefits of novel therapies (eg, implantable cardioverter defibrillators) need assessment in prospective randomised trials."
    explanation: Authoritative review naming the ICD evidence gap for Chagas cardiomyopathy.
- discussion_id: gap_chagas_vector_chemosensory_domiciliation
  prompt: >-
    How does evolutionary remodeling of the chemosensory (odorant-receptor)
    repertoire in Rhodnius and other triatomine vectors drive adaptation from
    sylvatic to domestic (domiciliary) habitats, and can this be exploited for
    vector control to reduce human transmission?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - transmission#Triatomine fecal contamination during blood feeding
  rationale: >-
    Vectorial transmission dominates human Chagas disease, and the key driver of
    human exposure is vector domiciliation (triatomines colonizing dwellings). A
    comparative-genomics preprint reports lineage-specific odorant-receptor
    expansions and shifts in selective constraint between sylvatic and
    domiciliary Rhodnius species, suggesting host-seeking/habitat-selection
    chemosensory remodeling underlies domiciliation. Whether these molecular
    signatures translate to behavioral domiciliation and offer control targets
    (e.g., attractants/repellents) is an open, translationally important question.
    Note: this lead rests on a non-peer-reviewed preprint and vector-evolution
    data rather than direct disease mechanism, so it is recorded as a gap rather
    than an asserted mechanism.
  evidence:
  - reference: PPR:PPR1277623
    reference_title: "Evolutionary Dynamics of the Complete Chemosensory Repertoire in Kissing Bugs of the Genus Rhodnius: Divergent Odorant Receptors Contrast with Conserved Gene Families"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Several receptors, including Orco, also displayed shifts in selective constraints between sylvatic and domiciliary species, consistent with sensory remodeling associated with adaptation to domestic habitats."
    explanation: Non-peer-reviewed comparative-genomics preprint (in silico evolutionary analysis) reporting chemosensory remodeling linked to domiciliary adaptation; cited as a knowledge-gap lead, not as sole support for a disease-mechanism claim.
- discussion_id: gap_chagas_serodiagnostic_parasite_vs_host_variation
  prompt: >-
    Is the geographic variability and serodiscordance of anti-T. cruzi
    serological assays driven mainly by local parasite genetic/antigenic
    diversity (DTU composition and divergence of the antigens used in commercial
    tests), or mainly by host-to-host variation in the anti-T. cruzi antibody
    repertoire - and can a conserved multi-epitope antigen panel close the gap
    either way?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - diagnosis#Serologic diagnosis (anti-T. cruzi IgG)
  rationale: >-
    Serology is the confirmatory test for chronic Chagas disease, but there is no
    gold-standard assay and discordant results are common, so the question is
    operational as well as mechanistic: a case definition, a blood-bank screen,
    and a treatment-eligibility decision all rest on it. Two mechanistically
    different explanations are on the table and the same group has published on
    both sides. Comparative genomics across 52 strains shows that several
    antigens used in current commercial tests are poorly conserved across DTUs,
    making antigenic diversity a plausible driver of the Central/North American
    performance deficit. Against that, high-density peptide-microarray profiling
    of confirmed-positive versus serodiscordant plasma concluded that individual
    variation in antibody profiles, rather than parasite diversity, was the main
    factor. A 2026 preprint genotyping the parasite populations carried by 73
    patients ("cruziome") in Argentina, Honduras and Mexico then reported
    clustering of TcI, TcII and TcV haplotypes with discordant serology,
    reviving the parasite-diversity explanation. That preprint is not
    peer-reviewed and is recorded here as a lead, not as an asserted mechanism;
    the two peer-reviewed studies are what make this a live controversy rather
    than a settled question. The practical stake is whether an improved universal
    assay must broaden antigen coverage across parasite lineages, broaden epitope
    coverage across human antibody repertoires, or both.
  evidence:
  - reference: PMID:38381980
    reference_title: "Identification of highly conserved Trypanosoma cruzi antigens for the development of a universal serological diagnostic assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual variation in antibody profiles rather than T. cruzi diversity appears to be the main factor driving differences in serological diagnostic performance according to geography"
    explanation: Peptide-microarray and peptide-ELISA study of confirmed-positive versus serodiscordant human plasma arguing for the host-antibody-repertoire side of the controversy.
  - reference: PMID:33669197
    reference_title: "Assessing Trypanosoma cruzi Parasite Diversity through Comparative Genomics: Implications for Disease Epidemiology and Diagnostics."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "antigenic diversity is a likely explanation for limited diagnostic performance in Central and North America"
    explanation: Comparative-genomics analysis of 52 T. cruzi genomes finding that several antigens used in commercial serologic tests are poorly conserved across strains, arguing for the parasite-diversity side of the controversy.
  - reference: PMID:19270291
    reference_title: "Geographic variation in the sensitivity of recombinant antigen-based rapid tests for chronic Trypanosoma cruzi infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The low sensitivity in Peru may be related to parasite strain differences."
    explanation: Field study documenting the between-country sensitivity gap that the controversy seeks to explain, and naming parasite strain differences as a candidate cause.
  - reference: PPR:PPR1277891
    reference_title: "Trypanosoma cruzi genetic diversity associates with serological diagnostic assay performance"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These results point to the cruziome and genetic differentiation within TcI, TcII and TcV DTUs to explain a large part of geographic differences in diagnostic performance"
    explanation: Non-peer-reviewed preprint genotyping parasite populations in 73 patients from Argentina, Honduras and Mexico and reporting DTU-level clustering with discordant serology; cited as the lead that reopens this question, not as sole support - the peer-reviewed studies above carry the claim.
  proposed_experiments:
  - experiment_id: exp_chagas_paired_cruziome_and_epitope_profiling
    name: Paired parasite-genotype and host-epitope profiling in serodiscordant patients
    description: >-
      In a prospective multi-country cohort of PCR-confirmed T. cruzi infections
      spanning Southern Cone, Central American and North American transmission
      settings, genotype the infecting parasite population (deep mini-exon /
      whole-genome sequencing of the cruziome) and profile the host IgG epitope
      repertoire by high-density peptide microarray in the same individual, then
      test which of the two - parasite DTU/antigen-sequence divergence or host
      epitope-recognition breadth - better predicts discordance across a panel of
      commercial assays. Pairing the two measurements in the same patients is
      what distinguishes the competing explanations; prior studies measured one
      or the other.
    experiment_type:
      preferred_term: prospective cohort study
  - experiment_id: exp_chagas_lineage_matched_antigen_panel
    name: Lineage-matched versus conserved-epitope antigen panel head-to-head
    description: >-
      Build two candidate assays - one using antigen variants matched to the DTUs
      circulating locally, one using the conserved multi-epitope peptide
      combination - and evaluate both against the same well-characterized
      confirmed-positive and serodiscordant panels from multiple geographic
      sites. If lineage matching recovers sensitivity where the conserved panel
      does not, parasite antigenic diversity is the dominant factor at that site;
      if the conserved panel wins everywhere, host repertoire breadth dominates.
    experiment_type:
      preferred_term: diagnostic accuracy study

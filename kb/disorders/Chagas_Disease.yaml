- accession: geo:GSE191082
  title: Specific methylation marks in promoter regions are associated to the pathogenic process of Chronic Chagas disease Cardiomyopathy by modifying transcription factor binding patterns [methylation]
  description: Chagas disease, caused by Trypanosoma cruzi, is an endemic parasitical disease of Latin America, affecting 7 million people. Although most patients are asymptomatic, 30% develop complications, including Chronic Chagasic Cardiomyopathy (CCC), which ranges from moderate to severe stages depending on the cardiac ejection fraction. The pathogenic process remains poorly understood, although genetic and epigenetic factors have already been proposed. Based on bulk RNA-seq and EPIC methylation data, we investigated the genetic and epigenetic deregulations present in the moderate and severe stages of CCC.

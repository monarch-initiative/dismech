- accession: massive:MSV000094311
  title: Top-Down Proteomics Identifies Plasma Proteoform Signatures of Liver Cirrhosis Progression
  description: Cirrhosis, advanced liver disease, affects 2-5 million Americans. While most patients have compensated cirrhosis and may be fairly asymptomatic, many decompensate and experience life-threatening complications such as gastrointestinal bleeding, confusion (hepatic encephalopathy), and ascites, reducing life expectancy from 12 to less than 2 years. Among the patients with compensated cirrhosis, identifying patients at high risk of decompensation is critical to optimize care, reduce morbidity and mortality.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Liver Cirrhosis"). Retrieved 2026-08-02.

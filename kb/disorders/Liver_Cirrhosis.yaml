name: Liver Cirrhosis
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Liver cirrhosis is the end stage of chronic liver disease, characterized by diffuse
  fibrosis and regenerative nodules that replace the normal hepatic architecture.
  Sustained hepatocyte injury from causes such as alcohol, viral hepatitis, or
  steatohepatitis activates hepatic stellate cells through TGF-beta and inflammatory
  signaling, driving excessive extracellular matrix deposition. The resulting
  distortion of blood flow produces portal hypertension and its complications
  (ascites, variceal bleeding, hepatic encephalopathy), while progressive loss of
  functional hepatocytes causes synthetic dysfunction and predisposes to
  hepatocellular carcinoma.
category: Complex
parents:
- Hepatic Disease
disease_term:
  preferred_term: cirrhosis of liver
  term:
    id: MONDO:0005155
    label: cirrhosis of liver
has_subtypes:
- name: Alcoholic Cirrhosis
  description: Cirrhosis due to chronic alcohol abuse.
- name: Viral Cirrhosis
  description: Cirrhosis from chronic hepatitis B or C infection.
- name: Non-Alcoholic Steatohepatitis Cirrhosis
  description: Cirrhosis from metabolic-associated fatty liver disease.
- name: Primary Biliary Cholangitis
  description: Autoimmune destruction of intrahepatic bile ducts.
- name: Primary Sclerosing Cholangitis
  description: Chronic inflammation and fibrosis of bile ducts.
pathophysiology:
- name: Hepatocyte Injury and Death
  description: >
    Chronic liver injury from any cause leads to ongoing hepatocyte death,
    triggering inflammation and regenerative responses that promote fibrosis.
  locations:
  - preferred_term: Liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:39063116
    reference_title: "Liver Fibrosis: From Basic Science towards Clinical Progress, Focusing on the Central Role of Hepatic Stellate Cells."
    supports: SUPPORT
    snippet: "Chronic liver injury leads to liver inflammation and fibrosis (LF) as critical determinants of long-term outcomes such as cirrhosis, liver cancer, and mortality."
    explanation: This review establishes that chronic liver injury is the initiating event leading to inflammation and fibrosis in cirrhosis development.
- name: IL-11 Signalling in Hepatic Stellate Cells
  conforms_to: "il11_erk_ampk_mtor_aging#IL-11 Receptor Signalling Activation"
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Fibrogenic cytokine stimulation of hepatic stellate cells induces autocrine
    IL-11, which signals through IL11RA1 to activate ERK and drive the fibrotic
    stellate-cell programme. This IL-11 receptor-signalling arm is an
    organ-specific instance of the conserved IL-11 signalling module and feeds
    hepatic stellate cell activation; neutralizing anti-IL-11 (X203) or
    anti-IL11RA (X209) antibodies block it and reduce liver fibrosis.
  locations:
  - preferred_term: Liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: Hepatic Stellate Cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  biological_processes:
  - preferred_term: Interleukin-11-mediated signaling pathway
    term:
      id: GO:0038154
      label: interleukin-11-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:31078624
    reference_title: "Inhibiting Interleukin 11 Signaling Reduces Hepatocyte Death and Liver Fibrosis, Inflammation, and Steatosis in Mouse Models of Nonalcoholic Steatohepatitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HSCs incubated with cytokines produced IL11, resulting in activation
      (phosphorylation) of ERK and expression of markers of fibrosis.
    explanation: >-
      Directly evidences the IL-11 to ERK receptor-signalling arm in hepatic
      stellate cells that this node models. Evidence source is IN_VITRO (cultured
      hepatic stellate cells).
  - reference: PMID:31078624
    reference_title: "Inhibiting Interleukin 11 Signaling Reduces Hepatocyte Death and Liver Fibrosis, Inflammation, and Steatosis in Mouse Models of Nonalcoholic Steatohepatitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neutralizing antibodies that block IL11 signaling reduce fibrosis,
      steatosis, hepatocyte death, inflammation and hyperglycemia in mice with
      diet-induced steatohepatitis.
    explanation: >-
      Shows pharmacological IL-11 inhibition reverses liver fibrosis in vivo,
      validating the drug-target link on this node. Evidence source is
      MODEL_ORGANISM (mouse NASH models).
  - reference: PMID:29160304
    reference_title: "IL-11 is a crucial determinant of cardiovascular fibrosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-11 and its receptor (IL11RA) are expressed specifically in fibroblasts,
      in which they drive non-canonical, ERK-dependent autocrine signalling that
      is required for fibrogenic protein synthesis.
    explanation: >-
      Cross-organ support that IL-11 receptor engagement drives ERK-dependent
      autocrine fibroblast signalling, the conserved mechanism specialized here
      to hepatic stellate cells. Evidence source is IN_VITRO (primary human
      fibroblasts).
  downstream:
  - target: Hepatic Stellate Cell Activation

- name: Hepatic Stellate Cell Activation
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >
    Quiescent stellate cells transform into myofibroblasts, producing
    excessive collagen and extracellular matrix. This is the central
    event in liver fibrosis.
  locations:
  - preferred_term: Liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: Hepatic Stellate Cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  - preferred_term: Myofibroblast

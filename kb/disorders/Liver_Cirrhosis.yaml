environmental:
- name: Alcohol Consumption
  exposure_term:
    preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  notes: Major cause worldwide
  evidence:
  - reference: PMID:36926309
    reference_title: "Sex-specific association between alcohol consumption and liver cirrhosis: An updated systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "drinking 40 g/day showed RRs of 9.35 (95% CI 7.64-11.45) in females and 2.82 (95% CI 2.53-3.14) in males"
    explanation: "Dose-response meta-analysis over 3 million participants establishing a steep non-linear relationship, and a marked sex difference: women reach a given cirrhosis risk at substantially lower intake than men."
- name: Hepatitis B/C Virus
  exposure_term:
    preferred_term: viral exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  notes: Leading causes of viral cirrhosis
  evidence:
  - reference: PMID:35576953
    reference_title: "Worldwide prevalence of hepatitis B virus and hepatitis C virus among patients with cirrhosis at country, region, and global levels: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Globally, among patients with cirrhosis, 42% had HBV infection and 21% had HCV infection"
    explanation: "Systematic review of 520 publications covering 1,376,503 cirrhosis patients; the authors conclude HBV and HCV could account for almost two thirds of the global cirrhosis burden."
- name: Obesity/Metabolic Syndrome
  notes: Driving NASH cirrhosis epidemic
  evidence:
  - reference: PMID:29886156
    reference_title: "Modeling NAFLD disease burden in China, France, Germany, Italy, Japan, Spain, United Kingdom, and United States for the period 2016-2030."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This burden is expected to increase as epidemics of obesity, diabetes and metabolic syndrome continue to grow"
    explanation: "Markov modelling across eight countries projecting NASH prevalence up 15-56% and advanced liver disease more than doubling by 2030. COMPUTATIONAL because the forward projection is a model rather than an observed cohort."
- name: Hepatotoxic Drugs
  notes: Including acetaminophen overdose
  evidence:
  - reference: PMID:16317692
    reference_title: "Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "acetaminophen hepatotoxicity far exceeds other causes of acute liver failure in the United States"
    explanation: "PARTIAL, and the mismatch is worth preserving: this quantifies acetaminophen as the dominant cause of ACUTE liver failure (275 of 662 consecutive cases), a different endpoint from the chronic fibrotic cirrhosis this entry models. It evidences the hepatotoxicity, not a cirrhosis pathway."

- accession: geo:GSE246398
  title: BIOLOGICAL EFFECTS OF CORTICOSTEROIDS ON PNEUMOCOCCAL PNEUMONIA IN MICE AND HUMANS
  description: 'Rationale: Streptococcus pneumoniae is the most common bacterial cause of community acquired pneumonia. Some clinical trials have demonstrated a beneficial effect of corticosteroid therapy in community acquired pneumonia, but the mechanisms of this benefit remain unclear. Objectives: To investigate the biologic effects of corticosteroids in pneumococcal pneumonia in mice and in patients Methods: We studied lower respiratory tract transcriptomes from an observational cohort of mechanically ventilated patients and from a pneumonia model in mice. We also carried out comprehensive physiologic, biochemical, and histological analyses in mice to identify mechanisms of lung injury in S.'

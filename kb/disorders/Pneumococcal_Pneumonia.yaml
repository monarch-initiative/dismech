- accession: geo:GSE273805
  title: TNF Superfamily Member 14 Drives Post-Influenza Depletion of Alveolar  Macrophages Enabling Secondary Pneumococcal Pneumonia
  description: Secondary bacterial infection, often caused by Streptococcus pneumoniae (Spn), is one of the most frequent and severe complications of influenza A virus (IAV)-induced pneumonia. Phenotyping of the pulmonary innate immune landscape after IAV infection revealed a significant depletion of the tissue-resident alveolar macrophage (TR-AM) population at day 7, which was associated with increased susceptibility to Spn outgrowth. To elucidate the molecular mechanisms underlying TR-AM depletion, and to define putative targets for treatment, we combined single-cell transcriptomics and cell-specific PCR profiling in an unbiased manner, using in vivo models of IAV infection and IAV/Spn co-infection.

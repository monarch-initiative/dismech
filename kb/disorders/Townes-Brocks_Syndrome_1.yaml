pathophysiology:
- name: SALL1 Truncating Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous germline nonsense or frameshift SALL1 variant, clustering in
    an ~800 bp hotspot in exon 2 between the glutamine-rich domain and the first
    double zinc-finger domain. The predicted product is a truncated protein that
    retains the N-terminal repression and SALL-interaction regions but lacks the
    C-terminal DNA-binding double zinc fingers. The recurrent c.826C>T
    (p.Arg276Ter) accounts for roughly half of simplex cases and has been
    associated with a more complete phenotype, including congenital heart
    defects.
  genes:
  - preferred_term: SALL1
    term:
      id: hgnc:10524
      label: SALL1
  genetic_context:
    gene:
      preferred_term: SALL1
      term:
        id: hgnc:10524
        label: SALL1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Truncating alleles that escape nonsense-mediated decay and are thought to
      act through the truncated product rather than by loss of one allele. The
      dominant-negative assignment rests on mouse genetics and patient-cell
      work (see downstream nodes); ClinGen records the mechanism as either
      haploinsufficiency or dominant-negative.
  evidence:
  - reference: PMID:9425907
    reference_title: "Mutations in the SALL1 putative transcription factor gene cause Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that SALL1 mutations cause TBS in a family with vertical transmission of TBS and in an unrelated family with a sporadic case of TBS. Both mutations are predicted to result in a prematurely terminated SALL1 protein lacking all putative DNA binding domains."
    explanation: >-
      Original gene discovery, establishing truncating SALL1 variants as the
      cause of TBS.
  - reference: PMID:17221874
    reference_title: "Townes-Brocks syndrome: twenty novel SALL1 mutations in sporadic and familial cases and refinement of the SALL1 hot spot region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that 46 out of the now 56 SALL1 mutations are located between the coding regions for the glutamine-rich domain mediating SALL protein interactions and 65 bp 3' of the coding region for the first double zinc finger domain, narrowing the SALL1 mutational hotspot region to a stretch of 802 bp within exon 2."
    explanation: >-
      Defines the exon 2 truncating-variant hotspot.
  - reference: CGGV:assertion_5883adb4-8c1e-46f0-8b23-1dd060763166-2026-03-20T040000.000Z
    reference_title: "SALL1 / Townes-Brocks syndrome 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SALL1 | HGNC:10524 | Townes-Brocks syndrome 1 | MONDO:0054581 | AD | Definitive"
    explanation: >-
      ClinGen Syndromic Disorders GCEP classifies the SALL1-TBS1 relationship
      as Definitive for autosomal dominant inheritance.
  - reference: CGGV:assertion_5883adb4-8c1e-46f0-8b23-1dd060763166-2026-03-20T040000.000Z
    reference_title: "SALL1 / Townes-Brocks syndrome 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be either haploinsufficiency or dominant-negative."
    explanation: >-
      ClinGen's curation leaves the disease mechanism open between the two
      models represented in this pathograph.
  - reference: PMID:36833185
    reference_title: "Chromosomal Microarray Analysis Identifies a Novel SALL1 Deletion, Supporting the Association of Haploinsufficiency with a Mild Phenotype of Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arg276Ter) is detected in approximately half of simplex cases with TBS"
    explanation: >-
      Frequency of the recurrent hotspot variant among simplex cases.
  downstream:
  - target: Truncated SALL1 Protein Escaping Nonsense-Mediated Decay
    causal_link_type: DIRECT
- name: Truncated SALL1 Protein Escaping Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Despite carrying premature termination codons, the hotspot TBS alleles are
    transcribed and translated: mutant mRNA resists nonsense-mediated decay in
    patient fibroblasts, and truncated SALL1 protein is detectable in
    patient-derived cells, where it localizes to the cytoplasm. An allele that
    was NMD-susceptible was associated with a much milder phenotype, which is the
    human genetic basis for treating the stable truncated product, rather than
    reduced dosage, as the principal pathogenic species.
  genes:
  - preferred_term: SALL1
    term:
      id: hgnc:10524
      label: SALL1
  evidence:
  - reference: PMID:18000979
    reference_title: "Nonsense-mediated decay and the molecular pathogenesis of mutations in SALL1 and GLI3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In SALL1, a mutant allele causing Townes-Brocks syndrome was unexpectedly resistant to NMD, whereas a different mutation causing a much milder phenotype was susceptible to NMD."
    explanation: >-
      Allele-specific quantification in patient fibroblasts shows the TBS
      allele escapes NMD and correlates NMD susceptibility with milder disease.
  - reference: PMID:18470945
    reference_title: "SALL1 truncated protein expression in Townes-Brocks syndrome leads to ectopic expression of downstream genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We prove that the same pathogenetic mechanism elucidated in mice is occurring in humans by demonstrating that truncated SALL1 protein is expressed in cells derived from a TBS patient."
    explanation: >-
      Detects the truncated protein in patient-derived cells.
  downstream:
  - target: Dominant-Negative Interference with SALL-Family Repressors
    causal_link_type: DIRECT
  - target: Aberrant Primary Cilium Formation
    causal_link_type: DIRECT
    hypothesis_groups:
    - tbs_truncated_sall1_ciliary_dysfunction
    description: >-
      Cytoplasmic truncated SALL1 binds the ciliogenesis suppressors CCP110 and
      CEP97, a function independent of transcriptional repression.
    evidence:
    - reference: PMID:29395072
      reference_title: "Truncated SALL1 Impedes Primary Cilia Function in Townes-Brocks Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By using proximity proteomics, we show that truncated SALL1 interacts with factors related to cilia function, including the negative regulators of ciliogenesis CCP110 and CEP97."
      explanation: >-
        Proximity proteomics links the truncated protein to ciliogenesis
        regulators.
- name: Dominant-Negative Interference with SALL-Family Repressors
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Wild-type SALL1 is a zinc-finger transcriptional repressor that localizes to
    pericentromeric heterochromatin and recruits the NuRD corepressor complex
    through a conserved N-terminal motif. The truncated protein retains the
    SALL-interaction and repression regions but not the DNA-binding zinc
    fingers; it interacts with all SALL family members and is proposed to
    sequester them, reducing SALL-dependent repression of developmental target
    genes. The strongest support is the Sall1 allelic series in mouse: a
    truncating allele reproduces TBS features in heterozygotes whereas a null
    allele does not. Confidence is PROVISIONAL because the dominant-negative
    model does not account for the TBS phenotype of patients with whole-gene
    SALL1 deletions (see SALL1 Haploinsufficiency).
  genes:
  - preferred_term: SALL1
    term:
      id: hgnc:10524
      label: SALL1
  biological_processes:
  - preferred_term: SALL-dependent transcriptional repression
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  cellular_components:
  - preferred_term: NuRD complex
    term:
      id: GO:0016581
      label: NuRD complex
  evidence:
  - reference: PMID:12915476
    reference_title: "Expression of a truncated Sall1 transcriptional repressor is responsible for Townes-Brocks syndrome birth defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To test this hypothesis, we have created a mutant allele, sall1-DeltaZn2-10, that produces a truncated protein and recapitulates the abnormalities found in human TBS."
    explanation: >-
      A mouse allele expressing a truncated Sall1 reproduces TBS, where the
      null allele does not.
  - reference: PMID:12915476
    reference_title: "Expression of a truncated Sall1 transcriptional repressor is responsible for Townes-Brocks syndrome birth defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that truncated Sall1 mediates interaction with all Sall family members and could interfere with the normal function of all Sall proteins."
    explanation: >-
      Provides the sequestration mechanism underlying the dominant-negative
      model.
  - reference: PMID:18470945
    reference_title: "SALL1 truncated protein expression in Townes-Brocks syndrome leads to ectopic expression of downstream genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this report, we strengthen this hypothesis by showing that expression of the mutant protein alone in transgenic mice is sufficient to cause limb phenotypes that are characteristic of TBS patients."
    explanation: >-
      Transgenic expression of the truncated protein on a wild-type background

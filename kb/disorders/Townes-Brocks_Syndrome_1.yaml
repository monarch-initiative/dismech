inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: About 50% of individuals diagnosed with SALL1-TBS
  description: >-
    Heterozygous SALL1 pathogenic variants are transmitted in an autosomal
    dominant manner with a 50% risk to each child of an affected individual.
    About half of probands carry a de novo variant, and de novo variants arise
    predominantly on the paternally derived chromosome 16 without an obvious
    paternal age effect. Expressivity is highly variable within and between
    families; mildly affected parents are often recognized only after a more
    severely affected child, which is one reason for testing apparently
    unaffected at-risk relatives. Penetrance is usually described as complete,
    but a Chinese hearing-loss cohort reported apparently incomplete penetrance
    in the transmitting generation of several families.
  evidence:
  - reference: PMID:20301618
    reference_title: "SALL1-Related Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SALL1-TBS is inherited in an autosomal dominant manner. About 50% of individuals diagnosed with SALL1-TBS have the disorder as the result of a de novo pathogenic variant."
    explanation: >-
      GeneReviews states the inheritance pattern and the de novo fraction.
  - reference: PMID:20301618
    reference_title: "SALL1-Related Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with SALL1-TBS has a 50% chance of inheriting the pathogenic variant."
    explanation: >-
      GeneReviews states the 50% transmission risk to each child of an
      affected individual.
  - reference: PMID:16892410
    reference_title: "SALL1 mutations in sporadic Townes-Brocks syndrome are of predominantly paternal origin without obvious paternal age effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were of paternal origin in 14 of 16 cases (87.5%). Paternal origin was independent of the mutation type."
    explanation: >-
      Parent-of-origin analysis in 16 sporadic families shows de novo SALL1
      variants arise mostly on the paternal allele.
  - reference: PMID:20520617
    reference_title: "Phenotypic variability in a family with Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is wide clinical variation in TBS; however, most affected parents are usually mildly affected and may have similarly or more severely affected children."
    explanation: >-
      Documents intrafamilial variable expressivity and the pattern of a mildly
      affected transmitting parent.
  - reference: PMID:38296632
    reference_title: "Molecular diagnosis, clinical evaluation and phenotypic spectrum of Townes-Brocks syndrome: insights from a large Chinese hearing loss cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penetrance analysis within familial contexts revealed incomplete penetrance among first-generation patients with TBS and a higher disease burden among their affected offspring."
    explanation: >-
      Reports apparently reduced penetrance in the transmitting generation, a
      qualification of the usual statement that penetrance is complete.

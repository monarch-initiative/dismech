- name: Disrupted Autopod Digit Patterning
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  description: >-
    Abnormal specification of digit number and identity in the anterior
    (preaxial) autopod, producing thumb duplication and triphalangeal thumbs,
    with homologous foot anomalies (overlapping toes, flat feet). The radius is
    characteristically spared, which separates TBS from the radial-ray
    syndromes. The disorder-specific patterning input is the truncated SALL1
    protein; which patterning signal it perturbs is not settled, with target-gene
    derepression (Shox2) and ciliary Hedgehog transduction both proposed.
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
    modifier: ABNORMAL
  - preferred_term: embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18470945
    reference_title: "SALL1 truncated protein expression in Townes-Brocks syndrome leads to ectopic expression of downstream genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this report, we strengthen this hypothesis by showing that expression of the mutant protein alone in transgenic mice is sufficient to cause limb phenotypes that are characteristic of TBS patients."
    explanation: >-
      Truncated SALL1 is sufficient to produce TBS-like limb malformation.
  - reference: PMID:20301618
    reference_title: "SALL1-Related Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "triphalangeal thumbs, and, rarely, hypoplasia of the thumbs) without hypoplasia of the radius"
    explanation: >-
      GeneReviews describes the preaxial digit pattern and the sparing of the
      radius.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous nonsense variant was identified in dapper, antagonist of beta-catenin, 1 (DACT1) via whole-exome sequencing in family members with imperforate anus, structural renal abnormalities, genitourinary anomalies, and/or ear anomalies."
    explanation: The DACT1 family phenotype, which lists no thumb anomaly.
- name: EYA1-Related Branchiootorenal Spectrum
  disease_term:
    preferred_term: branchiootorenal syndrome 1
    term:
      id: MONDO:0007236
      label: branchiootorenal syndrome 1
  description: >-
    Ear anomalies, hearing loss and CAKUT overlap the TBS BOR-like presentation
    of SALL1 disease.
  distinguishing_features:
  - Branchial cleft cysts or fistulae and preauricular pits favor the branchiootorenal spectrum.
  - Anorectal and thumb malformations favor SALL1.
  evidence:
  - reference: PMID:40658219
    reference_title: "Clinical characteristics of patients with SALL1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some patients present only with dysplastic ears and hearing loss (HL) or with congenital anomalies of the kidney and urinary tract (CAKUT), resembling branchio-oto-renal syndrome (BORS), a presentation referred to as Townes-Brocks branchio-oto-renal-like (TBS BOR-like) syndrome."
    explanation: Describes the BOR-like SALL1 presentation that overlaps this differential.
- name: Craniofacial Microsomia
  disease_term:
    preferred_term: Goldenhar syndrome / oculoauriculovertebral spectrum
    term:
      id: MONDO:0015397
      label: craniofacial microsomia
  description: >-
    Ear anomalies and preauricular tags can make SALL1 disease resemble
    Goldenhar syndrome.
  distinguishing_features:
  - Anorectal malformation and triphalangeal or duplicated thumbs point to SALL1.
  evidence:
  - reference: PMID:9973281
    reference_title: "Molecular analysis of SALL1 mutations in Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also present evidence that in rare cases SALL1 mutations can lead to phenotypes similar to Goldenhar syndrome."
    explanation: SALL1 disease can mimic Goldenhar syndrome.
- name: VACTERL Association
  disease_term:
    preferred_term: VACTERL association
    term:
      id: MONDO:0008642
      label: VACTERL/vater association
  description: >-
    Anorectal, renal, limb and cardiac anomalies overlap VACTERL, and TBS is
    thought to be under-recognized among patients labelled as VACTERL.
  distinguishing_features:
  - Dysplastic ears and sensorineural hearing loss point to SALL1.
  - Radial hypoplasia and vertebral and tracheoesophageal anomalies favor VACTERL.
  evidence:
  - reference: PMID:23894113
    reference_title: "Endocrine abnormalities in Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "but is probably much higher due to common shared characteristics with VATER association and subtle variable phenotypes in many TBS patients"
    explanation: Introductory statement on overlap with VATER association.
- name: SALL4-Related Duane-Radial Ray Syndrome
  disease_term:
    preferred_term: Duane-radial ray syndrome (Okihiro syndrome)
    term:
      id: MONDO:0011812
      label: Duane-radial ray syndrome
  description: >-
    The paralogous SALL4 gene causes Duane anomaly with radial ray
    malformations that include triphalangeal and duplicated thumbs, and (as
    acro-renal-ocular syndrome) renal anomalies and coloboma, overlapping the
    thumb, kidney and ocular features of SALL1-TBS.
  distinguishing_features:
  - Hypoplasia or aplasia of the radius and forearm shortening favor SALL4; TBS thumb anomalies occur without radial hypoplasia.
  - Anorectal malformation and dysplastic ears with hearing loss point to SALL1.
  evidence:
  - reference: PMID:20301547
    reference_title: "SALL4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DRRS is characterized by uni- or bilateral Duane anomaly and radial ray malformation that can include thenar hypoplasia and/or hypoplasia or aplasia of the thumbs, hypoplasia or aplasia of the radii, shortening and radial deviation of the forearms, triphalangeal thumbs, and duplication of the thumb (preaxial polydactyly)."
    explanation: >-
      GeneReviews SALL4 chapter describes the overlapping thumb anomalies
      together with the radial involvement that separates DRRS from TBS.
  - reference: PMID:20301618
    reference_title: "SALL1-Related Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "triphalangeal thumbs, and, rarely, hypoplasia of the thumbs) without hypoplasia of the radius"
    explanation: GeneReviews SALL1 chapter states the radius is spared in TBS.
- name: Fanconi Anemia
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  description: >-
    Fanconi anemia can present with thumb anomalies and a TBS-like
    malformation pattern; a chromosome breakage test or FA gene testing
    separates them.
  distinguishing_features:
  - Radial hypoplasia, skin pigmentary changes, bone marrow failure and chromosome fragility favor Fanconi anemia.
  - TBS thumb anomalies occur without radial hypoplasia.
  evidence:
  - reference: PMID:19622403
    reference_title: "Fanconi anemia and its diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FA patients may also present with a phenotype characteristic of Seckel syndrome, Nijmegen breakage syndrome, Dubowitz syndrome, Holt-Oram syndrome, thrombocytopenia absent radius (TAR) syndrome, Townes-Brocks syndrome"
    explanation: A Fanconi anemia review naming TBS among FA phenocopies.

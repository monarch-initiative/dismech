genetic:
- name: SALL1
  gene_term:
    preferred_term: SALL1
    term:
      id: hgnc:10524
      label: SALL1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SALL1 at 16q12.1 is the only gene for TBS1. Pathogenic alleles are
    predominantly nonsense and frameshift variants in the exon 2 hotspot, with
    the recurrent c.826C>T (p.Arg276Ter) the most frequent single variant;
    whole- and partial-gene deletions are a minority and need a copy-number
    assay. Variants located downstream of the glutamine-rich region were
    associated in one analysis with more deafness, dysplastic ear and thumb
    malformation and less renal failure than upstream variants, though the
    downstream-variant group was significantly younger.
  evidence:
  - reference: CGGV:assertion_5883adb4-8c1e-46f0-8b23-1dd060763166-2026-03-20T040000.000Z
    reference_title: "SALL1 / Townes-Brocks syndrome 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SALL1 | HGNC:10524 | Townes-Brocks syndrome 1 | MONDO:0054581 | AD | Definitive"
    explanation: ClinGen Definitive gene-disease validity.
  - reference: PMID:9973281
    reference_title: "Molecular analysis of SALL1 mutations in Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the mutations are located 5' of the first double zinc finger (DZF) encoding region and are therefore predicted to result in putative prematurely terminated proteins lacking all DZF domains."
    explanation: Early mutation series establishing the truncating pattern.
  - reference: PMID:40348827
    reference_title: "Townes-Brocks syndrome: genotype-phenotype correlations of SALL1 variants in our series and the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant increase in deafness, dysplastic ear, and thumb malformations and a significant decrease in renal failure were observed in the individuals carrying a variant located downstream of the region, but the patients were significantly younger."
    explanation: >-
      Genotype-phenotype association by variant position, with the age
      confounder the authors note.
diagnosis:
- name: Clinical and molecular diagnosis of SALL1-TBS
  description: >-
    Suspected in a child with an anorectal malformation, dysplastic ears or
    hearing loss, and preaxial thumb anomalies with a normal radius, and
    increasingly in children and adults ascertained through hearing-loss or
    kidney-disease gene panels with incomplete or atypical features. Confirmed
    by a heterozygous pathogenic SALL1 variant. Because deletions are missed by
    sequencing, a sequencing-negative patient with a suggestive phenotype should
    have copy-number analysis.
  notes: >-
    Kidney-gene-panel cohorts identify SALL1 variants in patients whose
    presentation is non-syndromic CAKUT or a branchio-oto-renal-like
    combination of ear anomalies, hearing loss and CAKUT, sometimes first
    diagnosed in adolescence or adulthood.
  evidence:
  - reference: PMID:20301618
    reference_title: "SALL1-Related Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SALL1-TBS is established in a proband with characteristic clinical findings and a heterozygous pathogenic variant in SALL1 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:36833185
    reference_title: "Chromosomal Microarray Analysis Identifies a Novel SALL1 Deletion, Supporting the Association of Haploinsufficiency with a Mild Phenotype of Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal microarray analysis is still a valuable tool in the identification of atypical/mild TBS cases, which are likely underestimated."
    explanation: Supports copy-number testing for deletions.
  - reference: PMID:40658219
    reference_title: "Clinical characteristics of patients with SALL1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some cases present with atypical features overlapping with TBS BOR-like syndrome or isolated CAKUT, rather than with typical TBS1."
    explanation: Atypical presentations ascertained through a CKD cohort.
differential_diagnoses:
- name: Townes-Brocks Syndrome 2
  disease_term:
    preferred_term: Townes-Brocks syndrome 2
    term:
      id: MONDO:0054582
      label: Townes-Brocks syndrome 2
  description: >-
    DACT1-related autosomal dominant syndrome with imperforate anus, renal,
    genitourinary and ear anomalies overlapping TBS.
  distinguishing_features:
  - Heterozygous DACT1 rather than SALL1 variant.
  - Thumb malformations were not part of the phenotype in the first reported DACT1 family.
  evidence:
  - reference: PMID:28054444

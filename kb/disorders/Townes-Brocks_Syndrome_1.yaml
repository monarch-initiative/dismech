animal_models:
- name: Sall1 truncating-allele mouse (Sall1-DeltaZn2-10)
  species: Mouse
  genotype: Sall1 DeltaZn2-10 (heterozygous and homozygous)
  publication: PMID:12915476
  description: >-
    Knock-in allele expressing a truncated Sall1 that lacks zinc fingers 2-10,
    designed to mimic human TBS truncating alleles. Also used, as Sall1TBS, to
    study adult kidney injury.
  modeled_mechanisms:
  - target: Dominant-Negative Interference with SALL-Family Repressors
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygotes reproduce hearing loss, renal cystic hypoplasia and wrist
      bone anomalies, which the null allele does not.
    limitations: >-
      Heterozygotes do not show the anorectal or thumb anomalies that define
      human TBS; anal deformity appears only in homozygotes. The allele is a
      mouse-designed truncation rather than a human hotspot variant.
    readouts:
    - name: TBS-like phenotype in heterozygotes
      target: Dominant-Negative Interference with SALL-Family Repressors
      direction: ALTERED
      interpretation: Presence of hearing, renal and wrist phenotypes with one truncating allele.
      evidence:
      - reference: PMID:12915476
        reference_title: "Expression of a truncated Sall1 transcriptional repressor is responsible for Townes-Brocks syndrome birth defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Heterozygous mice mimic TBS patients by displaying high-frequency sensorineural hearing loss, renal cystic hypoplasia and wrist bone abnormalities."
        explanation: Reports the heterozygous phenotype.
    evidence:
    - reference: PMID:12915476
      reference_title: "Expression of a truncated Sall1 transcriptional repressor is responsible for Townes-Brocks syndrome birth defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To test this hypothesis, we have created a mutant allele, sall1-DeltaZn2-10, that produces a truncated protein and recapitulates the abnormalities found in human TBS."
      explanation: The model was built to test the dominant-negative hypothesis.
  - target: Chronic Kidney Disease
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Sall1TBS mice develop slowly progressive chronic kidney disease.
    limitations: >-
      The same mice are protected from acute kidney injury, which has no known
      human counterpart; the relation of the murine CKD to the human FSGS and
      hypodysplasia findings is not established.
    evidence:
    - reference: PMID:26311113
      reference_title: "A mouse model of Townes-Brocks syndrome expressing a truncated mutant Sall1 protein is protected from acute kidney injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This protection from acute injury is seen despite the presence of slowly progressive chronic kidney disease in Sall1TBS mice."
      explanation: Documents CKD in the truncating-allele model.
- name: Sall1 null mouse
  species: Mouse
  genotype: Sall1 null (heterozygous and homozygous)
  publication: PMID:11688560
  description: >-
    Targeted Sall1 deletion. Homozygotes die perinatally with kidney agenesis
    or severe dysgenesis; heterozygotes have no TBS-like phenotype.
  modeled_mechanisms:
  - target: Impaired Metanephric Kidney Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous loss identifies ureteric bud invasion as the Sall1-dependent
      step of metanephric development.
    limitations: >-
      Homozygous agenesis is far more severe than the human heterozygous
      hypodysplasia spectrum.
    evidence:
    - reference: PMID:11688560
      reference_title: "Murine homolog of SALL1 is essential for ureteric bud invasion in kidney development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have isolated a mouse homolog of SALL1 (Sall1) and found that mice deficient in Sall1 die in the perinatal period and that kidney agenesis or severe dysgenesis are present."
      explanation: Homozygous null kidney phenotype.
  - target: SALL1 Haploinsufficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Heterozygous Sall1-null mice lack a TBS-like phenotype, whereas humans
      with SALL1 deletions have TBS.
    limitations: >-
      Species difference in SALL1 dosage sensitivity; the mouse cannot be used
      to model the human deletion phenotype.
    evidence:
    - reference: PMID:16429401
      reference_title: "Detection of heterozygous SALL1 deletions by quantitative real time PCR proves the contribution of a SALL1 dosage effect in the pathogenesis of Townes-Brocks syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "This assumption was strongly contradicted by a Sall1 mouse knock-out, because neither hetero- nor homozygous knock-out mutants displayed a TBS-like phenotype."
      explanation: >-
        The heterozygous knockout has no TBS-like phenotype; quoted from the
        background of a human deletion study.
    - reference: PMID:16429401
      reference_title: "Detection of heterozygous SALL1 deletions by quantitative real time PCR proves the contribution of a SALL1 dosage effect in the pathogenesis of Townes-Brocks syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It therefore seems that there is a different contribution of SALL1 gene function to mouse and human embryonic development."
      explanation: The authors' interpretation of the human/mouse discordance.
mechanistic_hypotheses:
- hypothesis_group_id: tbs_truncated_sall1_ciliary_dysfunction
  hypothesis_label: Truncated SALL1 causes TBS malformations partly through primary cilium dysfunction
  status: EMERGING
  description: >-
    Cytoplasmic truncated SALL1 binds CCP110 and CEP97 and destabilizes LUZP1,
    increasing ciliogenesis and altering Sonic hedgehog transduction; the
    hypothesis is that this transcription-independent activity contributes to
    the limb and other malformations. Supported by patient fibroblasts and
    model cell lines; not tested in vivo.
  evidence:
  - reference: PMID:29395072
    reference_title: "Truncated SALL1 Impedes Primary Cilia Function in Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we provide evidence that SALL1 mutations might cause TBS by means beyond its transcriptional capacity."
    explanation: States the hypothesis tested in cellular models.
discussions:
- discussion_id: mismatch_sall1_null_heterozygote
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#SALL1 Haploinsufficiency
  - pathophysiology#Dominant-Negative Interference with SALL-Family Repressors
  prompt: >-
    Why do humans with a heterozygous SALL1 deletion have Townes-Brocks
    syndrome when heterozygous Sall1-null mice have no TBS-like phenotype?
  rationale: >-
    The dominant-negative model rests largely on the contrast between the mouse
    null allele (no phenotype in heterozygotes) and the mouse truncating allele
    (TBS-like heterozygotes). Human deletion carriers show that halving SALL1
    dosage is itself pathogenic in humans, so the mouse overstates how cleanly
    the two mechanisms separate. Whether human deletion carriers are genuinely
    milder is also disputed on few families. Until this is resolved the entry
    carries both mechanisms as PROVISIONAL.
  proposed_experiments:
  - experiment_id: exp_sall1_isogenic_ipsc_allelic_series
    name: Isogenic human iPSC SALL1 allelic series in kidney organoids
    description: >-
      Compare heterozygous SALL1 deletion, hotspot truncating (p.Arg276Ter)
      and wild-type isogenic iPSC lines differentiated into kidney organoids
      for nephron progenitor maintenance and nephron number, testing in human
      cells whether a truncating allele is more damaging than a null allele.
  - experiment_id: exp_sall1_deletion_phenotype_registry
    name: Standardized phenotyping of SALL1 deletion carriers
    description: >-
      Collect uniformly phenotyped deletion carriers (renal imaging, audiology,
      cardiac and developmental assessment) and compare against age-matched
      hotspot-variant carriers to settle the milder-phenotype question.
- discussion_id: gap_ckd_structurally_normal_kidneys
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Chronic Kidney Disease
  - pathophysiology#Impaired Metanephric Kidney Development
  prompt: >-
    What causes chronic kidney disease in TBS patients whose kidneys appear
    structurally normal on ultrasound?
  rationale: >-
    Most TBS kidney failure is attributed to congenital hypodysplasia, but
    kidney failure without an ultrasound abnormality is reported and FSGS has
    been found on biopsy. Reduced nephron endowment below the resolution of
    ultrasound, a role for SALL1 in the mature kidney (Sall1 is expressed in
    terminally differentiated renal epithelia in adult mouse), or both are
    possible. The answer determines whether kidney surveillance could be
    tailored by imaging or must remain universal.
  proposed_experiments:
  - experiment_id: exp_sall1_nephron_number_imaging
    name: Nephron number estimation in TBS patients with normal kidney ultrasound
    description: >-
      Estimate nephron number (e.g. MRI-based or biopsy-based methods) and
      follow eGFR and proteinuria longitudinally in molecularly confirmed
      patients without structural anomalies.
notes: >-
  LUMP/SPLIT DECISION. This entry is a Disease entry for SALL1-related
  Townes-Brocks syndrome (TBS1, MONDO:0054581) and not an entry for the parent
  concept Townes-Brocks syndrome (MONDO:0007142). The parent has two children in
  MONDO, TBS1 (SALL1) and TBS2 (DACT1, MONDO:0054582). They were not lumped
  because the causal lesion differs: SALL1 disease is driven by a truncated
  spalt-family transcriptional repressor (with a disputed haploinsufficiency
  contribution), whereas DACT1 encodes a Wnt-pathway antagonist, so one
  pathograph would need two unrelated trigger chains. The first reported DACT1
  family also lacked thumb anomalies. The GeneReviews chapter is itself scoped
  to SALL1 ("SALL1-Related Townes-Brocks Syndrome"), ClinGen curates SALL1
  against MONDO:0054581, and MONDO models the two as separate children. A
  has_subtypes entry on a parent Townes-Brocks Disease was not chosen because
  there is no shared mechanism for such a parent to carry. If TBS2 is curated
  later, a Grouping over both entries mapped to MONDO:0007142 would record the
  shared clinical definition. TBS BOR-like presentations and non-syndromic CAKUT
  caused by SALL1 are treated as part of this entry's phenotypic range, not as
  separate entries, because they arise from the same SALL1 alleles.

  STRUCTURED SOURCES. Orphanet ORPHA:857 is the parent Townes-Brocks syndrome
  record and lists both SALL1 and DACT1, so its phenotype annotations are cited
  only for presence, not as frequency evidence for SALL1-TBS. Frequency bands in
  this entry come from GeneReviews and from the 207-patient SALL1 literature
  review (PMID:40348827). The ClinGen gene-disease validity record is
  SALL1-specific and classifies the relationship as Definitive.

  MECHANISM. The pathograph carries two trigger chains for the two allele
  classes (truncating variants and deletions) because the literature has not
  settled the dominant-negative versus haploinsufficiency question; both
  central nodes are PROVISIONAL, and the human/mouse discordance is recorded as
  a HUMAN_MODEL_MISMATCH discussion. The ciliary mechanism is recorded as an
  EMERGING hypothesis. No mechanism for the congenital heart defects, the
  external ear dysplasia, or the endocrine and ocular features was found in the
  sources used, so those phenotypes are not connected to a mechanism node.

  PEDIATRIC SURVEILLANCE (GeneReviews, PMID:20301618). Constipation, growth and
  thyroid function at each visit; annual audiology; annual kidney function even
  with normal kidneys and normal initial function; annual developmental,
  educational and behavioral assessment; ophthalmology per ophthalmologist.
  Cardiac evaluation of every affected individual is recommended from a family
  series (PMID:11484202). Avoid nephrotoxic and ototoxic medications.

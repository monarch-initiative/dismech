  - reference: PMID:11751684
    reference_title: "SALL1, the gene mutated in Townes-Brocks syndrome, encodes a transcriptional repressor which interacts with TRF1/PIN2 and localizes to pericentromeric heterochromatin."
    supports: SUPPORT

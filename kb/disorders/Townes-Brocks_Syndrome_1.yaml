- category: Renal
  name: Chronic Kidney Disease
  description: >-
    Chronic kidney disease affects roughly a third of reported patients (29.3%
    in a 207-patient literature review, 39.6% in the authors' own 49-patient
    series, so no single frequency band is asserted) and can appear at any age,
    from the neonatal period to adulthood. Some patients have kidney failure
    without any structural abnormality on ultrasound, and focal segmental
    glomerulosclerosis has been found on biopsy. Kidney failure is sometimes the
    presenting feature that leads to the diagnosis in adults. This is why
    GeneReviews recommends annual monitoring of kidney function in every
    affected individual, including those with normal kidneys at first
    evaluation.

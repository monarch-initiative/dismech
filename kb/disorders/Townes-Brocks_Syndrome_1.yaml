name: Townes-Brocks Syndrome 1
creation_date: "2026-09-23T00:00:00Z"
description: >-
  An autosomal dominant multiple congenital anomaly syndrome caused by
  heterozygous germline pathogenic variants in SALL1, which encodes a
  zinc-finger transcriptional repressor of the spalt family. The classic triad
  is an anorectal malformation (imperforate anus or anal stenosis), dysplastic
  external ears (overfolded superior helices, preauricular tags) with
  sensorineural and/or conductive hearing impairment, and thumb malformations
  (preaxial polydactyly, triphalangeal thumb, rarely thumb hypoplasia) without
  radial hypoplasia. Congenital anomalies of the kidney and urinary tract,
  chronic kidney disease that can reach kidney failure from the neonatal period
  onwards, foot and genital malformations, congenital heart disease, and less
  often developmental delay, endocrine deficiencies and ocular anomalies complete
  the picture. The malformations are present at birth and most patients are
  recognized in infancy or childhood, but expressivity is highly variable within
  families and mildly affected adults are often diagnosed only after an affected
  child, or after presenting with kidney failure. Most pathogenic variants are
  truncating alleles in a hotspot of exon 2 whose products escape
  nonsense-mediated decay and are thought to act dominant-negatively on the SALL
  protein family; whole- or partial-gene deletions (haploinsufficiency) are rarer
  and have been associated with a milder phenotype, although this correlation is
  disputed.
category: Genetic
synonyms:
- TBS1
- SALL1-related Townes-Brocks syndrome

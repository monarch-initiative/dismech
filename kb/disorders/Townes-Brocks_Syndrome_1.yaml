- name: SALL1 Haploinsufficiency
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of one SALL1 allele without a truncated product. Human deletion
    carriers have TBS, which establishes that dosage reduction alone is
    pathogenic in humans even though heterozygous Sall1-null mice have no TBS
    phenotype. The phenotype of deletion carriers has been reported as milder
    than that of truncating-variant carriers, with fewer complete triads and no
    reported congenital heart disease, but a possibly higher rate of
    developmental delay; a later review of all reported deletions and truncating
    variants did not support the milder-phenotype correlation. The
    genotype-phenotype question remains open on a small number of deletion
    families.
  genes:
  - preferred_term: SALL1
    term:
      id: hgnc:10524
      label: SALL1
  evidence:
  - reference: PMID:16429401
    reference_title: "Detection of heterozygous SALL1 deletions by quantitative real time PCR proves the contribution of a SALL1 dosage effect in the pathogenesis of Townes-Brocks syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results confirm that SALL1 haploinsufficiency is sufficient to cause a mild TBS phenotype but suggest that it is not sufficient to cause the severe, classical form."
    explanation: >-
      Deletion carriers establish haploinsufficiency as pathogenic and are
      reported as milder than point-mutation carriers.
  - reference: PMID:36833185
    reference_title: "Chromosomal Microarray Analysis Identifies a Novel SALL1 Deletion, Supporting the Association of Haploinsufficiency with a Mild Phenotype of Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review the clinical findings of known individuals with SALL1 deletions and point out that the overall phenotype is milder, especially when compared with individuals who carry the recurrent p.Arg276Ter mutation, but with a possible higher risk of developmental delay."
    explanation: >-
      Literature comparison of deletion carriers against p.Arg276Ter carriers.
  - reference: PMID:22308078
    reference_title: "Implications for genotype-phenotype predictions in Townes-Brocks syndrome: case report of a novel SALL1 deletion and review of the literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, they do not support the correlation of SALL1 deletions with a milder TBS phenotype and highlight a need for more robust clinical phenotyping combined with investigation of mutational mechanism."
    explanation: >-

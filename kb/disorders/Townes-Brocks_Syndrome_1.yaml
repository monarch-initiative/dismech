- name: Aberrant Primary Cilium Formation
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Truncated SALL1 binds the ciliogenesis suppressors CCP110 and CEP97 and
    promotes the proteasomal degradation of LUZP1, reducing these negative
    regulators at the mother centriole. TBS patient fibroblasts, a CRISPR model
    cell line and TBS-modelled mouse embryonic fibroblasts form primary cilia
    more frequently, with altered cilium length and disassembly and aberrant
    Sonic hedgehog signal transduction. This places TBS in phenotypic overlap
    with the ciliopathies, but the evidence is cellular and the contribution of
    ciliary dysfunction to the malformations in vivo is untested.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: INCREASED
  - preferred_term: Sonic hedgehog signal transduction
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29395072
    reference_title: "Truncated SALL1 Impedes Primary Cilia Function in Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This most likely contributes to more frequent cilia formation in TBS-derived fibroblasts, as well as in a CRISPR/Cas9-generated model cell line and in TBS-modeled mouse embryonic fibroblasts, than in wild-type controls."
    explanation: >-
      Increased ciliogenesis in patient and model cells.
  - reference: PMID:29395072
    reference_title: "Truncated SALL1 Impedes Primary Cilia Function in Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, TBS-like cells show changes in cilia length and disassembly rates in combination with aberrant SHH signaling transduction."
    explanation: >-
      Altered cilium dynamics and Hedgehog transduction in TBS-like cells.
  - reference: PMID:32553112
    reference_title: "LUZP1, a novel regulator of primary cilia and the actin cytoskeleton, is a contributing factor in Townes-Brocks Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Truncated SALL1 increases the ubiquitin proteasome-mediated degradation of LUZP1."
    explanation: >-
      A second ciliary regulator depleted by the truncated protein.
  downstream:
  - target: Disrupted Autopod Digit Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tbs_truncated_sall1_ciliary_dysfunction
    description: >-
      Proposed rather than demonstrated: altered ciliary Hedgehog transduction
      would perturb limb patterning, which depends on Sonic hedgehog signalling.
    evidence:
    - reference: PMID:29395072
      reference_title: "Truncated SALL1 Impedes Primary Cilia Function in Townes-Brocks Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These findings support the hypothesis that aberrations in primary cilia and SHH signaling are contributing factors in TBS phenotypes, representing a paradigm shift in understanding TBS etiology."
      explanation: >-
        The authors' hypothesis linking the cellular finding to the TBS
        malformations; not tested in vivo.
- name: Impaired Metanephric Kidney Development
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Sall1 is expressed in the metanephric mesenchyme surrounding the ureteric
    bud and is required for ureteric bud invasion, the first inductive step of
    metanephric development; complete loss gives renal agenesis. In
    heterozygous truncating-allele mice kidney development is partial, giving
    cystic hypoplasia. The human counterpart is congenital renal
    hypoplasia/dysplasia, which is the usual substrate of the chronic kidney
    disease in TBS.
  cell_types:
  - preferred_term: metanephric mesenchyme stem cell
    term:
      id: CL:0000324
      label: metanephric mesenchyme stem cell
  biological_processes:
  - preferred_term: metanephros development
    term:
      id: GO:0001656
      label: metanephros development
    modifier: ABNORMAL
  - preferred_term: ureteric bud development
    term:
      id: GO:0001657
      label: ureteric bud development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11688560
    reference_title: "Murine homolog of SALL1 is essential for ureteric bud invasion in kidney development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sall1 is expressed in the metanephric mesenchyme surrounding ureteric bud; homozygous deletion of Sall1 results in an incomplete ureteric bud outgrowth, a failure of tubule formation in the mesenchyme and an apoptosis of the mesenchyme."
    explanation: >-
      Defines the developmental step that requires Sall1.
  - reference: PMID:11688560
    reference_title: "Murine homolog of SALL1 is essential for ureteric bud invasion in kidney development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sall1 is therefore essential for ureteric bud invasion, the initial key step for metanephros development."
    explanation: >-
      States the conclusion that Sall1 gates metanephric induction.
  downstream:

    reference_title: "ZDHHC9 X-linked intellectual disability: Clinical and molecular characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense, nonsense, frameshift, and splicing variants, in addition to
      large exonic deletions, have been described suggesting a loss of
      function mechanism.
    explanation: Review of the reported variant spectrum concludes loss of function.
  - reference: PMID:31747610
    reference_title: "The X-Linked Intellectual Disability Gene Zdhhc9 Is Essential for Dendrite Outgrowth and Inhibitory Synapse Formation."

    reference_title: "Expanding the clinical phenotype of patients with a ZDHHC9 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These manifestations are not specific enough to guide ZDHHC9 screening
      in patients with ID, and emphasize the value of next generation
      sequencing for making a molecular diagnosis

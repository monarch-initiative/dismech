name: ZDHHC9-Related X-Linked Intellectual Disability
creation_date: "2026-11-16T14:25:26Z"
category: Mendelian
description: >-
  X-linked intellectual disability in males caused by hemizygous
  loss-of-function variants in ZDHHC9 at Xq26.1, which encodes a Golgi
  palmitoyl acyltransferase that works with its accessory subunit GCP16
  (GOLGA7) and palmitoylates H-Ras and N-Ras among other substrates. Affected
  males have mild to moderate intellectual disability with marked speech and
  oromotor impairment. Many have childhood focal epilepsy resembling rolandic
  epilepsy, and brain MRI shows hypoplasia of the corpus callosum with reduced
  thalamic and striatal volume. A marfanoid habitus was described in the
  first families but is absent in many later ones. Mouse and cell studies
  point to two consequences of losing the enzyme: fewer inhibitory synapses
  and shorter dendrites in neurons, and abnormal myelination by
  oligodendrocytes, where ZDHHC9 is most highly expressed. About sixteen to
  twenty families have been reported.

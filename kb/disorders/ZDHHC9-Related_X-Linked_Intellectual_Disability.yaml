pathophysiology:
- name: ZDHHC9 Loss of Function
  description: >-
    Hemizygous frameshift, nonsense, splice-site, intragenic deletion and
    missense variants in ZDHHC9. Missense and nonsense changes cluster at
    arginine residues in the cytoplasmic domains. All reported classes are
    consistent with loss of function.
  biological_scale: MOLECULAR

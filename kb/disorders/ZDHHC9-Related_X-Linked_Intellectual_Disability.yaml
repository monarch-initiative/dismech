    Diagnosis is made by finding a hemizygous ZDHHC9 variant on exome,
    X-chromosome or intellectual disability panel sequencing. The clinical
    features are not specific enough to prompt single-gene testing.
  diagnosis_term:
    preferred_term: next-generation sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

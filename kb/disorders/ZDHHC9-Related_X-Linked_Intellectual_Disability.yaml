      reference_title: "ZDHHC9 / syndromic X-linked intellectual disability Raymond type (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ZDHHC9 | HGNC:18475 | syndromic X-linked intellectual disability Raymond type | MONDO:0010427 | XL | Definitive"
      explanation: ClinGen Intellectual Disability and Autism GCEP classifies ZDHHC9 in this disease as Definitive.
  evidence:
  - reference: PMID:17436253
    reference_title: "Mutations in ZDHHC9, which encodes a palmitoyltransferase of NRAS and HRAS, cause X-linked mental retardation associated with a Marfanoid habitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified one frameshift mutation, one splice-site mutation,
      and two missense mutations in highly conserved residues in ZDHHC9 at
      Xq26.1 in 4 of 250 families with X-linked mental retardation (XLMR).
    explanation: Discovery of ZDHHC9 as an XLID gene.
  variants:
  - name: p.Arg148Trp (R148W)
    description: Missense allele from the original families that lowers the autopalmitoylated enzyme intermediate.
    evidence:
    - reference: PMID:24811172
      reference_title: "Mutations in the X-linked intellectual disability gene, zDHHC9, alter autopalmitoylation activity by distinct mechanisms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        two naturally occurring variants of zDHHC9, encoding R148W and P150S,
        affect the autopalmitoylation step of the reaction
      explanation: Functional defect of the allele.
  - name: p.Pro150Ser (P150S)
    description: Missense allele that lowers the autopalmitoylated enzyme intermediate.
    evidence:
    - reference: PMID:24811172
      reference_title: "Mutations in the X-linked intellectual disability gene, zDHHC9, alter autopalmitoylation activity by distinct mechanisms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        two naturally occurring variants of zDHHC9, encoding R148W and P150S,
        affect the autopalmitoylation step of the reaction
      explanation: Functional defect of the allele.
  - name: c.286C>T (p.Arg96Trp)
    description: >-
      Missense variant first reported in a family with marfanoid features,
      later found de novo in a sporadic boy with global developmental delay
      and no marfanoid habitus, epilepsy or brain anomaly.
    evidence:
    - reference: PMID:28687527
      reference_title: "The first patient with sporadic X-linked intellectual disability with de novo ZDHHC9 mutation identified by targeted next-generation sequencing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This mutation has been reported previously in a family XLID with
        Marfanoid features.
      explanation: Recurrence of the allele in an unrelated, de novo case.
  - name: p.Arg298*
    description: Nonsense variant cosegregating with mild intellectual disability and dysplastic corpus callosum in a large family.
    evidence:
    - reference: PMID:24357419
      reference_title: "Expanding the clinical phenotype of patients with a ZDHHC9 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The mutation cosegregated with the clinical phenotype in this family.
      explanation: Segregation of the nonsense allele.
  - name: c.566T>C (p.Leu189Pro)
    description: Hemizygous missense variant in the DHHC domain in two brothers with severe intellectual disability.
    evidence:
    - reference: PMID:37821930
      reference_title: "Whole exome sequencing revealed variants in four genes underlying X-linked intellectual disability in four Iranian families: novel deleterious variants and clinical features with the review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a novel deleterious hemizygous missense variant in the ZDHHC9 gene
        (NM_016032.4: c.566T > C, p.Leu189Pro) in two brothers with severe ID,
        developmental delay, and speech disorder
      explanation: Shows the phenotype can be severe.

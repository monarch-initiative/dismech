differential_diagnoses:
- name: Marfan syndrome
  description: >-
    Considered when marfanoid habitus accompanies intellectual disability;
    ZDHHC9 patients with the habitus do not meet the Ghent criteria.
  distinguishing_features:
  - Ghent criteria for Marfan syndrome are not met.
  evidence:
  - reference: PMID:17436253
    reference_title: "Mutations in ZDHHC9, which encodes a palmitoyltransferase of NRAS and HRAS, cause X-linked mental retardation associated with a Marfanoid habitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: none of the affected individuals meets the Ghent criteria for Marfan syndrome
    explanation: Distinguishes the habitus from Marfan syndrome.
- name: Other causes of marfanoid habitus with intellectual disability
  description: >-
    Marfanoid habitus with intellectual disability is genetically
    heterogeneous; MED12, UPF3B, FBN1, TGFBR1/2 and chromosomal imbalances are
    tested alongside ZDHHC9.
  evidence:
  - reference: PMID:23506379
    reference_title: "Systematic molecular and cytogenetic screening of 100 patients with marfanoid syndromes and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MED12, ZDHHC9, UPF3B, FBN1, TGFBR1 and TGFBR2 sequencing analyses were performed.
    explanation: The genes tested in the differential for marfanoid habitus with ID.

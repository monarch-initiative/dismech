discussions:
- discussion_id: zdhhc9_neuronal_vs_glial_mechanism
  prompt: >-
    Which ZDHHC9 substrates and cell types explain the human phenotype:
    neuronal Ras and TC10 palmitoylation affecting dendrites and inhibitory
    synapses, or oligodendrocyte myelin-protein palmitoylation affecting white
    matter?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Neuronal Ras Palmitoylation
  - pathophysiology#Reduced Neuronal TC10 Palmitoylation
  - pathophysiology#Reduced Myelin Protein Palmitoylation in Oligodendrocytes
  - phenotypes#Epilepsy
  - phenotypes#Intellectual disability
  rationale: >-
    Both mechanisms rest on mouse and rodent culture data. Ras is the
    biochemically best-established substrate, yet H-Ras palmitoylation was not
    reduced in mutant mouse brain. ZDHHC9 is far more highly expressed in
    oligodendrocytes than in neurons, and patients have reduced white matter
    with largely normal grey matter, but no study has measured substrate
    palmitoylation or myelin structure in patient tissue or patient-derived
    cells, and neither mechanism has been linked to the rolandic-type
    epilepsy or the oromotor deficit.
  evidence:
  - reference: PMID:41031565
    reference_title: "Micro-scale control of oligodendrocyte morphology and myelination by the intellectual disability-linked protein acyltransferase ZDHHC9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      expression of human and mouse ZDHHC9 orthologs is far higher in
      myelinating oligodendrocytes (OLs) than in other CNS cell types
    explanation: Expression argues for a glial site of action.
  - reference: PMID:29944857
    reference_title: "Disruption of the Zdhhc9 intellectual disability gene leads to behavioural abnormalities in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      suggesting that other substrates of this enzyme are linked to the
      observed changes
    explanation: The best-known substrate does not explain the mouse phenotype.

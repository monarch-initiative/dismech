      explanation: Patient alleles destabilize the enzyme and its complex with GCP16.
- name: Impaired DHHC9-GCP16 Palmitoyltransferase Activity
  description: >-
    DHHC9 needs GCP16 for stability and acyltransferase activity; only the
    folded DHHC9-GCP16 complex is active. Disease alleles lower the
    autopalmitoylated enzyme intermediate and reduce complex formation, so
    less palmitate is transferred to substrate proteins.
  biological_scale: MOLECULAR

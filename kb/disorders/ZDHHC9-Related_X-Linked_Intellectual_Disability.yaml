    between Golgi and plasma membrane. In cultured hippocampal neurons Zdhhc9
    acts through Ras to promote dendrite growth. Whether Ras palmitoylation
    is reduced in the intact brain is uncertain: it was not disrupted in
    Zdhhc9 mutant mouse brain.

- name: Abnormal Oligodendrocyte Myelination
  description: >-
    Zdhhc9 knockout mice have grossly normal oligodendrocyte development but
    extensive morphological and structural myelin abnormalities. In the
    corpus callosum the balance of mature oligodendrocyte subtypes shifts
    away from myelination-associated MOL2/3 cells, myelinated axon density
    falls, myelin compaction is disrupted, and genes and proteins for lipid
    metabolism and cholesterol synthesis are reduced.

animal_models:
- name: Zdhhc9 mutant mouse (Kouskou 2018)
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Zdhhc9 mutant (C57BL/6), hemizygous males
  publication: PMID:29944857
  description: >-
    Male Zdhhc9 mutant mice show reduced anxiety-like behaviour, reduced hang
    time suggesting hypotonia, spatial learning and memory deficits in the
    Morris water maze, and a 36% smaller corpus callosum on MRI.
  modeled_mechanisms:
  - target: Reduced Corpus Callosum and White Matter Volume
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Reproduces the callosal volume loss seen in patients.
    evidence:
    - reference: PMID:29944857
      reference_title: "Disruption of the Zdhhc9 intellectual disability gene leads to behavioural abnormalities in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: a 36% reduction in corpus callosum volume revealed by MRI
      explanation: Callosal volume loss in the mutant mouse.
  - target: Reduced Neuronal Ras Palmitoylation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    description: H-Ras palmitoylation was preserved in mutant brain.
    limitations: >-
      Only H-Ras membrane association and S-acylation in whole brain and
      hippocampus were measured; N-Ras and cell-type-specific changes were
      not assessed, so a local reduction in neurons cannot be excluded.
    evidence:
    - reference: PMID:29944857
      reference_title: "Disruption of the Zdhhc9 intellectual disability gene leads to behavioural abnormalities in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, membrane association and S-acylation of H-Ras was not
        disrupted in either whole brain or hippocampus of Zdhhc9 mutant mice
      explanation: Negative result for the Ras node in vivo.
  evidence:
  - reference: PMID:29944857
    reference_title: "Disruption of the Zdhhc9 intellectual disability gene leads to behavioural abnormalities in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deficits in the Morris water maze test of hippocampal-dependent spatial

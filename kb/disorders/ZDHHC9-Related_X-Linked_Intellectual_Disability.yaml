genetic:
- name: ZDHHC9
  gene_term:
    preferred_term: ZDHHC9
    term:
      id: hgnc:18475
      label: ZDHHC9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Hemizygous loss-of-function variants (X-linked)
  notes: >-
    Most variants are inherited from unaffected carrier mothers; de novo
    variants are documented, including a recurrent p.Arg96Trp.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_2156b925-1ee6-4edb-a514-3650aa5b780e-2020-05-19T160000.000Z

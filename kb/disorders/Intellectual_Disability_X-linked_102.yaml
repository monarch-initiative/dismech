inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    DDX3X sits at Xp11.4 and the disorder is X-linked, but neither the dominant
    nor the recessive label alone describes it. Most recognised probands are
    females with a de novo heterozygous allele; a minority are hemizygous males
    with a missense or splice allele that is often maternally inherited from an
    unaffected or only mildly affected carrier.
  evidence:
  - reference: PMID:40164730
    reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data show that variants in DDX3X can cause an X-linked
      neurodevelopmental disorder in males, with unaffected or mildly affected
      carrier females.
    explanation: >-
      States the X-linked mode and the carrier-female pattern that distinguishes
      the male families from the de novo female majority.
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  de_novo_rate: >-
    Nearly all reported female probands carry a de novo allele; 22 of 22 female
    variants in a 2,317-proband Chinese exome cohort were de novo.
  description: >-
    The female presentation behaves dominantly: a single heterozygous allele is
    sufficient, and because DDX3X escapes X-inactivation the wild-type allele on
    the active X does not rescue dosage.
  evidence:
  - reference: PMID:26235985
    reference_title: Mutations in DDX3X Are a Common Cause of Unexplained Intellectual Disability with Gender-Specific Effects on Wnt Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present 35 unique deleterious de novo mutations in DDX3X identified by
      whole exome sequencing in 38 females with ID and various other features
      including hypotonia, movement disorders, behavior problems, corpus
      callosum hypoplasia, and epilepsy
    explanation: >-
      The founding cohort establishes de novo heterozygous alleles in females as
      the dominant-acting mechanism.
  - reference: PMID:35392274
    reference_title: Expansion of Clinical and Genetic Spectrum of DDX3X Neurodevelopmental Disorder in 23 Chinese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 17 DDX3X variants were novel and 22 were de novo.
    explanation: >-
      Quantifies the de novo rate in an independent diagnostic cohort of 23
      patients (22 female, 1 male).
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Families with an inherited hypomorphic missense allele segregate in an
    apparently X-linked recessive pattern: hemizygous males are affected while
    the transmitting heterozygous mother is unaffected or only mildly affected.
    This is not a separate disease but the same locus seen through a
    residual-function allele.
  evidence:
  - reference: PMID:26235985
    reference_title: Mutations in DDX3X Are a Common Cause of Unexplained Intellectual Disability with Gender-Specific Effects on Wnt Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present three families with segregating missense mutations in DDX3X,
      suggestive of an X-linked recessive inheritance pattern. In these families,
      all males with the DDX3X variant had ID, whereas carrier females were
      unaffected.
    explanation: >-
      Documents the segregating male families and the unaffected carrier
      mothers.
has_subtypes:
- name: Female heterozygous
  display_name: Female heterozygous DDX3X-related neurodevelopmental disorder
  description: >-
    The majority presentation. A de novo heterozygous allele of any class -
    nonsense, frameshift, canonical or non-canonical splice, missense, in-frame
    indel - in a female. Protein-truncating alleles act by haploinsufficiency;
    severe helicase-domain missense alleles behave differently and mark the
    polymicrogyria/severe-outcome group.
  genes:
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  evidence:

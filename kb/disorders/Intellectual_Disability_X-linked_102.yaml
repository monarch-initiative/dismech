    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, we use ribosome profiling in vivo to discover the repertoire of
      translated transcripts in neural progenitors, including those which are
      DDX3X-dependent and essential for neurogenesis.
    explanation: >-
      Identifies the DDX3X-dependent translated transcripts in progenitors and
      links them to neurogenesis.
  downstream:
  - target: Altered Neural Progenitor Cell Cycle and Neurogenic Division
    causal_link_type: DIRECT
    description: >-
      Translational control of the progenitor transcriptome is one of the two
      arms by which DDX3X sets cortical neuron output in the mouse model.
    evidence:
    - reference: PMID:35762573

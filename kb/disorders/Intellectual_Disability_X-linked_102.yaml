name: Intellectual Disability X-linked 102
creation_date: "2026-09-04T02:26:58Z"
description: >-
  Intellectual disability, X-linked 102 (MRX102) is the OMIM/MONDO label for the
  DDX3X-related neurodevelopmental disorder, also called DDX3X syndrome or
  syndromic X-linked intellectual developmental disorder of the Snijders Blok
  type. It is caused by germline variants in DDX3X, which encodes an
  ATP-dependent DEAD-box RNA helicase acting in translation initiation on
  structured transcripts and in ribonucleoprotein-granule dynamics. Germline
  DDX3X variants account for roughly 1-3% of otherwise unexplained intellectual
  disability in females, which makes an individually rare disorder one of the
  more frequent single-gene causes of female intellectual disability.

  Two features have to be modelled explicitly rather than averaged away. First,
  the presentation is not confined to intellectual disability: the founding
  cohort and every subsequent series report hypotonia, movement disorder,
  behavioural difficulty, epilepsy and structural brain malformation - corpus
  callosum hypoplasia, ventriculomegaly, delayed myelination and, in the severe
  missense group, polymicrogyria. The MONDO term's "non-syndromic" wording is a
  gene-series design-pattern label and is at odds with the published phenotype;
  the entry curates what the literature reports and records the discrepancy
  rather than adopting either reading silently.

  Second, the sex difference is mechanistic. DDX3X partially escapes
  X-chromosome inactivation, so a heterozygous female expresses the variant
  allele even when inactivation is skewed against it, and skewing is therefore
  not protective. Most affected females carry de novo heterozygous alleles of
  any class, including protein-truncating ones. Affected males are almost always
  hemizygous for a missense or splice allele - frequently inherited from an
  unaffected or mildly affected carrier mother - and no germline truncating male
  allele has been reported, consistent with hemizygous complete loss of function
  being poorly tolerated. Allele class matters independently of sex: severe
  helicase-domain missense proteins do more than reduce dosage, forming ectopic
  RNA-protein granules and disturbing translation, and it is that group that
  correlates with polymicrogyria and the worst outcomes.
category: Mendelian
parents:
- hereditary disease
synonyms:
- MRX102
- DDX3X syndrome
- DDX3X-related neurodevelopmental disorder
- mental retardation, X-linked 102
- intellectual developmental disorder, X-linked, syndrome, Snijders Blok type
- MRXSSB
disease_term:
  preferred_term: DDX3X-related neurodevelopmental disorder
  term:

genetic:
- name: DDX3X
  gene_term:
    preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    DDX3X (Xp11.4) encodes a DEAD-box ATP-dependent RNA helicase. The disorder is
    germline; somatic DDX3X variants occur in medulloblastoma and several
    lymphoid malignancies and must not be used as evidence for the constitutional
    disorder. Reported germline classes are nonsense, frameshift, canonical and
    non-canonical splice, missense and in-frame indels in females, and missense
    or splice only in males. Recurrent male substitutions are p.(Arg351Gln) and
    p.(Arg488Cys); the inherited p.Arg79Lys allele lies outside the core helicase
    domain and is a demonstrated hypomorph.
  evidence:
  - reference: PMID:26235985
    reference_title: Mutations in DDX3X Are a Common Cause of Unexplained Intellectual Disability with Gender-Specific Effects on Wnt Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present 35 unique deleterious de novo mutations in DDX3X identified by
      whole exome sequencing in 38 females with ID and various other features
      including hypotonia, movement disorders, behavior problems, corpus callosum
      hypoplasia, and epilepsy
    explanation: >-
      Establishes DDX3X as the causative gene in the founding cohort.
  - reference: PMID:32135084
    reference_title: Pathogenic DDX3X Mutations Impair RNA Metabolism and Neurogenesis during Fetal Cortical Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo germline mutations in the RNA helicase DDX3X account for 1%-3% of
      unexplained intellectual disability (ID) cases in females and are
      associated with autism, brain malformations, and epilepsy.
    explanation: >-
      Confirms the gene-disease relationship and its share of unexplained female
      intellectual disability.
  - reference: PMID:30349862
    reference_title: Phenotypic expansion in DDX3X - a common cause of intellectual disability in females.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare or novel phenotypes observed include respiratory problems, congenital
      heart disease, skeletal muscle mitochondrial DNA depletion, and late-onset
      neurologic decline.
    explanation: >-
      Documents the rarer systemic and late-onset features that widen the
      DDX3X-associated phenotype beyond the neurodevelopmental core.
  case_fractions:
  - population: Females with unexplained intellectual disability in diagnostic sequencing cohorts
    case_fraction_low: 1.0
    case_fraction_high: 3.0
    notes: >-
      This is a diagnostic yield within an ascertained cohort, not a population
      prevalence, and it is quoted consistently across independent series.
    evidence:
    - reference: PMID:32135084
      reference_title: Pathogenic DDX3X Mutations Impair RNA Metabolism and Neurogenesis during Fetal Cortical Development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        De novo germline mutations in the RNA helicase DDX3X account for 1%-3% of
        unexplained intellectual disability (ID) cases in females and are
        associated with autism, brain malformations, and epilepsy.
      explanation: >-
        States the 1-3% share of unexplained female intellectual disability.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    More than 1,000 diagnosed females worldwide as of 2025. This is an
    ascertainment count from diagnostic laboratories and registries, not an
    epidemiological estimate, and no population prevalence or incidence has been
    established. Ascertainment is strongly female-biased because hemizygous
    complete loss of function is not viable in males.
  evidence:
  - reference: PMID:40164730
    reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DDX3X-related neurodevelopmental disorder is one of the most common
      monogenic causes of intellectual disability in females, with currently
      >1000 females diagnosed worldwide.
    explanation: >-
      Gives the worldwide diagnosed-case count that this record reports.
- population: Females with unexplained intellectual disability in diagnostic sequencing cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Germline DDX3X variants explain roughly 1-3% of unexplained intellectual
    disability in females. Recorded here for completeness because it is the most
    quoted number for this disorder, but it is a diagnostic-cohort fraction
    rather than any of the standard occurrence measures, so measure_type and
    prevalence_class are left UNKNOWN rather than forced into a band. The
    structured version of this quantity is the case_fractions record on the
    DDX3X genetic entry.
  evidence:
  - reference: PMID:35392274
    reference_title: Expansion of Clinical and Genetic Spectrum of DDX3X Neurodevelopmental Disorder in 23 Chinese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 23 Chinese patients (i.e., 22 female and 1 male) with 22 de novo
      DDX3X deleterious variants were detected among 2,317 probands with
      unexplained intellectual disability (ID) undertaking whole exome sequencing
      (WES).
    explanation: >-
      Gives the denominator and numerator of one such diagnostic cohort, which is
      the kind of measurement the 1-3% figure comes from.

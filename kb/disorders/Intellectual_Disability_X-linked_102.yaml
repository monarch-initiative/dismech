    reference_title: Pathogenic DDX3X Mutations Impair RNA Metabolism and Neurogenesis during Fetal Cortical Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      demonstrating a striking correlation between recurrent dominant missense
      mutations, polymicrogyria, and the most severe clinical outcomes
    explanation: >-
      The 107-individual cohort separates the severe missense group from the
      rest of the female presentation.
- name: Male hemizygous
  display_name: Male hemizygous DDX3X-related neurodevelopmental disorder
  description: >-
    Hemizygous males carrying a missense or splice allele with retained partial
    function, either de novo or inherited from a carrier mother. No germline
    truncating allele has been reported in a male. Recurrent substitutions
    p.(Arg351Gln) and p.(Arg488Cys) account for part of the reported cohort.
  genes:
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
    description: >-
      Maternally inherited hypomorphic alleles segregate with disease in males
      and not in the carrier mother.
  evidence:
  - reference: PMID:40164730
    reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of males have missense variants, including two recurrent
      variants (p.(Arg351Gln) and p.(Arg488Cys)). No truncating variants have
      been reported, consistent with the presumed embryonic lethality of complete
      loss-of-function of DDX3X in males.
    explanation: >-
      Defines the male allelic architecture and the absence of truncating male
      alleles that motivates curating this stratum separately.
pathophysiology:
- name: Partial Escape from X-Chromosome Inactivation
  biological_scale: MOLECULAR
  description: >-
    DDX3X partially escapes X-chromosome inactivation, so both alleles are
    transcribed in a heterozygous female. The usual protection that functional
    mosaicism or wild-type-favouring skewing gives a female carrier of an
    X-linked allele therefore does not apply here, which is the structural reason
    the recognised patient population is female-biased rather than male-biased as
    it is for most X-linked intellectual disability genes.
  genes:
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  evidence:
  - reference: PMID:40164730
    reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DDX3X is an essential gene located on the X-chromosome (Xp11.4), that
      partially escapes X-inactivation
    explanation: >-
      States the escape-from-inactivation property that the sex-dependent
      architecture rests on.
  - reference: PMID:36299587
    reference_title: "Case Report: De novo DDX3X mutation caused intellectual disability in a female with skewed X-chromosome inactivation on the mutant allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was discovered that XCI in the mutant allele was insufficient to reverse
      the phenotype of DDX3X-related neurodevelopmental disorder.
    explanation: >-
      A symptomatic female with extreme inactivation of the mutant X shows
      directly that skewing does not rescue the phenotype.
  downstream:
  - target: DDX3X RNA Helicase Deficiency
    causal_link_type: DIRECT
    description: >-
      Because the variant allele continues to be expressed from the inactive X,
      a heterozygous female retains a substantial mutant transcript fraction and
      the functional deficiency is established despite skewing.
    evidence:
    - reference: PMID:36299587
      reference_title: "Case Report: De novo DDX3X mutation caused intellectual disability in a female with skewed X-chromosome inactivation on the mutant allele."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the normal and mutated DDX3X expression accounted for respectively 70%
        and 30% of total
      explanation: >-
        Allele-specific expression quantifies the residual mutant fraction that
        escape leaves in place even under extreme skewing.
- name: Hemizygous Partial Loss of DDX3X Function in Males
  biological_scale: MOLECULAR
  description: >-
    A male has one DDX3X allele and no functional somatic backup, so complete
    loss of function is not compatible with a liveborn phenotype; every reported
    germline male allele is missense or splice-altering and retains partial
    activity. This is the male entry point into the same downstream chain, and it
    is why the male allelic spectrum is narrower than the female one rather than
    simply rarer.
  genes:
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Hemizygous germline missense or splice-altering alleles with retained
      residual helicase function. The p.Arg79Lys allele, which lies outside the
      core helicase domain, was shown to be hypomorphic in a zebrafish
      functional assay.
  evidence:
  - reference: PMID:29490693
    reference_title: A hypomorphic inherited pathogenic variant in DDX3X causes male intellectual disability with additional neurodevelopmental and neurodegenerative features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      found that this allele causes a partial loss of DDX3X function and thus
      represents a hypomorphic variant
    explanation: >-
      A zebrafish rescue assay establishes partial rather than complete loss of
      function for the inherited male allele.
  - reference: PMID:29490693
    reference_title: A hypomorphic inherited pathogenic variant in DDX3X causes male intellectual disability with additional neurodevelopmental and neurodegenerative features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      consistent with the hypothesis that haploinsufficiency at this locus on the
      X-chromosome is likely to be lethal in males
    explanation: >-
      States the viability constraint that restricts the male allelic spectrum to
      residual-function alleles.
  downstream:
  - target: DDX3X RNA Helicase Deficiency
    causal_link_type: DIRECT
    description: >-
      A hemizygous hypomorphic allele produces the same helicase deficiency, at a
      severity set by how much activity the allele retains.
    evidence:
    - reference: PMID:40164730
      reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The phenotype in males is diverse, including intellectual disability,
        speech/language delays, behavioural challenges and structural brain
        abnormalities.
      explanation: >-
        Confirms that the hemizygous route reaches the same clinical territory as
        the female heterozygous route.
- name: DDX3X RNA Helicase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced ATP-dependent RNA-helicase activity of DDX3X, arising either from
    reduced dosage (protein-truncating alleles, haploinsufficiency) or from
    direct impairment of the catalytic machinery by helicase-domain missense
    alleles. This is the shared lesion that the female and male routes converge
    on.
  genes:
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  molecular_functions:
  - preferred_term: RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline alleles spanning nonsense, frameshift, canonical and
      non-canonical splice, missense and in-frame indel classes. Truncating
      female alleles are consistent with haploinsufficiency; severe
      helicase-domain missense alleles impair catalysis directly and additionally
      seed ectopic granules, so they are not simply stronger null alleles.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32135084
    reference_title: Pathogenic DDX3X Mutations Impair RNA Metabolism and Neurogenesis during Fetal Cortical Development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Severe DDX3X missense mutations profoundly disrupt RNA helicase activity,
      induce ectopic RNA-protein granules in neural progenitors and neurons, and
      impair translation.
    explanation: >-
      Biochemical and cell-based assays show the missense alleles reduce helicase
      activity itself rather than only protein amount.
  downstream:
  - target: Impaired Translation of Structured Transcripts
    causal_link_type: DIRECT
    description: >-
      Loss of unwinding activity leaves structured 5' untranslated regions
      unresolved, so the transcripts that depend on DDX3X for initiation are
      under-translated.
    evidence:
    - reference: PMID:33789733
      reference_title: "A novel de novo DDX3X missense variant in a female with brachycephaly and intellectual disability: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The identified mutation is located just upstream the helicase domain and
        is suggested to impair the protein activity, thus resulting in the
        altered translation of DDX3X-dependent mRNAs.
      explanation: >-
        Connects a patient allele's position relative to the helicase domain to
        the predicted translational consequence. The inference from position to
        translation is the authors' interpretation, not a functional assay in
        this patient.
  - target: Ectopic RNA-Protein Granule Formation
    causal_link_type: DIRECT
    description: >-
      Severe-missense branch. Mutant DDX3X protein nucleates ectopic
      ribonucleoprotein granules in neural progenitors and neurons, a behaviour
      the truncating alleles do not have.
    evidence:
    - reference: PMID:32135084
      reference_title: Pathogenic DDX3X Mutations Impair RNA Metabolism and Neurogenesis during Fetal Cortical Development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Severe DDX3X missense mutations profoundly disrupt RNA helicase activity,
        induce ectopic RNA-protein granules in neural progenitors and neurons,
        and impair translation.
      explanation: >-
        Names the granule phenotype as specific to the severe missense class.
  - target: Reduced CREBBP mRNA Stability and Notch Signalling
    causal_link_type: DIRECT
    description: >-
      DDX3X loss destabilises crebbp mRNA and thereby lowers Notch signalling.
      Shown in zebrafish; not yet demonstrated in human tissue.
    evidence:
    - reference: PMID:39471229
      reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistically, we reveal that the ddx3x deficiency attenuates the
        stability of the crebbp mRNA, which in turn causes downregulation of
        Notch signaling and defects in neurogenesis.
      explanation: >-
        Establishes the CREBBP-Notch arm downstream of helicase deficiency in a
        zebrafish loss-of-function allele.
  - target: Attenuated Canonical Wnt Signalling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Every de novo allele tested reduced canonical Wnt output in a zebrafish
      assay. The assay was used as a surrogate readout of DDX3X function rather
      than as a demonstration that Wnt is the route to the human brain
      phenotype, so the intermediates between this node and corticogenesis are
      not established.
    evidence:
    - reference: PMID:26235985
      reference_title: Mutations in DDX3X Are a Common Cause of Unexplained Intellectual Disability with Gender-Specific Effects on Wnt Signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate a consistent loss-of-function effect of all tested de novo
        mutations on the Wnt pathway, and we further show a differential effect
        by gender.
      explanation: >-
        Supports the Wnt arm and, separately, records that its magnitude differs
        by sex.
- name: Impaired Translation of Structured Transcripts
  biological_scale: MOLECULAR
  description: >-
    DDX3X is required for cap-dependent initiation on messages with structured
    5' untranslated regions. When helicase activity falls, that subset of the
    neural translatome is selectively under-produced; ribosome profiling in vivo
    identifies the DDX3X-dependent transcripts and shows several are required for
    neurogenesis.

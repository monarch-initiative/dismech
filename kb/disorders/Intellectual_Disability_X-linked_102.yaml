diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Diagnosis requires a compatible neurodevelopmental phenotype plus a
    pathogenic or likely pathogenic germline DDX3X variant. Trio sequencing is
    preferred because it establishes de novo status, which is central to
    interpreting a female heterozygote, and because the differential for
    unexplained developmental delay is broad. Chromosomal microarray detects
    DDX3X-containing deletions but misses the single-nucleotide and small indel
    variants that account for nearly all cases. There is no biochemical
    biomarker.
  evidence:
  - reference: PMID:32852922
    reference_title: DDX3X-Related Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DDX3X-NDD is established in a female proband with
      suggestive findings and a heterozygous de novo DDX3X pathogenic variant
      identified by molecular genetic testing and in a male proband with
      suggestive findings and a hemizygous DDX3X pathogenic variant.
    explanation: >-
      States the diagnostic criteria, including the different zygosity
      requirement by sex.
  - reference: PMID:35392274
    reference_title: Expansion of Clinical and Genetic Spectrum of DDX3X Neurodevelopmental Disorder in 23 Chinese Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 23 Chinese patients (i.e., 22 female and 1 male) with 22 de novo
      DDX3X deleterious variants were detected among 2,317 probands with
      unexplained intellectual disability (ID) undertaking whole exome sequencing
      (WES).
    explanation: >-
      Demonstrates exome sequencing as the diagnostic route in an unselected
      unexplained-intellectual-disability cohort.
animal_models:
- name: Ddx3x heterozygous null mouse
  species: Mus musculus
  genotype: Ddx3x+/- female
  background: Constitutive heterozygous null, construct validity for human loss-of-function alleles
  publication: PMID:34344536
  description: >-
    A constitutive Ddx3x haploinsufficient female mouse, built to match the human
    protein-truncating allele class. It reproduces developmental delay, adult
    hyperactivity and anxiety-like behaviour, motor deficits, reduced brain
    volume, cortical thinning and defective lamination.
  modeled_mechanisms:
  - target: Aberrant Cortical Neuron Output and Cortical Malformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cortical thinning with defective lamination and reduced regional brain
      volume, the mouse counterpart of the human structural phenotype.
    limitations: >-
      The mouse cortex is lissencephalic, so it cannot model polymicrogyria - the
      malformation most tightly linked to the severe human missense alleles.
      Construct validity is for haploinsufficiency only; this allele does not
      model the granule-forming missense class.
    readouts:
    - name: Cortical thickness and laminar organisation
      target: Aberrant Cortical Neuron Output and Cortical Malformation
      direction: DECREASED
      interpretation: >-
        Cortical thinning with disordered lamination is the structural readout of
        abnormal cortical neuron output in this model.
      evidence:
      - reference: PMID:34344536
        reference_title: Developmental and Behavioral Phenotypes in a Mouse Model of DDX3X Syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cortical thinning was accompanied by defective cortical lamination,
          indicating that Ddx3x regulates the balance of glutamatergic neurons in
          the developing cortex.
        explanation: >-
          Reports the cortical thickness and lamination measurement behind this
          readout.
    - name: Regional brain volume on MRI
      target: Aberrant Cortical Neuron Output and Cortical Malformation
      direction: DECREASED
      interpretation: >-
        Reduced total and regional brain volume, disproportionately cortex and
        amygdala.
      evidence:
      - reference: PMID:34344536
        reference_title: Developmental and Behavioral Phenotypes in a Mouse Model of DDX3X Syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Developmental and behavioral changes were associated with a reduction in
          brain volume, with some regions (e.g., cortex and amygdala)
          disproportionally affected.
        explanation: >-
          Reports the MRI volumetric measurement behind this readout.
    evidence:
    - reference: PMID:34344536
      reference_title: Developmental and Behavioral Phenotypes in a Mouse Model of DDX3X Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data shed new light on the developmental mechanisms driving DDX3X
        syndrome and support construct and face validity of this novel preclinical
        mouse model.
      explanation: >-
        The authors' own construct- and face-validity claim for this model.
- name: Ddx3x conditional neural progenitor knockout mouse
  species: Mus musculus
  genotype: Conditional Ddx3x loss from neural progenitors (female homozygous, female heterozygous, male hemizygous)
  publication: PMID:35762573
  description: >-
    A dosage series of Ddx3x loss restricted to neural progenitors, used with
    live imaging and in vivo ribosome profiling. It is the model that separates
    the cell-cycle and translational arms of the mechanism and that shows the
    male-specific Ddx3y contribution.
  modeled_mechanisms:
  - target: Altered Neural Progenitor Cell Cycle and Neurogenic Division
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Live imaging of progenitors demonstrates altered cell-cycle duration and a
      shifted balance of neurogenic divisions, and ribosome profiling identifies
      the DDX3X-dependent translated transcripts underlying it.
    limitations: >-
      Mouse corticogenesis lacks the expanded human outer subventricular zone and
      outer radial glia, so the quantitative relationship between progenitor
      behaviour and cortical output may not transfer. Conditional deletion also
      removes Ddx3x more completely than any human allele does.
    readouts:
    - name: Progenitor cell-cycle duration and neurogenic division fraction
      target: Altered Neural Progenitor Cell Cycle and Neurogenic Division
      direction: ALTERED
      interpretation: >-
        Both parameters shift on live imaging, and together they set neuronal
        output.
      evidence:
      - reference: PMID:35762573
        reference_title: Aberrant cortical development is driven by impaired cell cycle and translational control in a DDX3X syndrome model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we show that DDX3X promotes neuronal generation by regulating both cell
          cycle duration and neurogenic divisions
        explanation: >-
          Reports the live-imaging measurement behind this readout.
    evidence:
    - reference: PMID:35762573
      reference_title: Aberrant cortical development is driven by impaired cell cycle and translational control in a DDX3X syndrome model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, using a mouse model of Ddx3x loss-of-function we demonstrate that
        DDX3X directs translational and cell cycle control of neural progenitors,
        which underlies precise corticogenesis.
      explanation: >-
        Supports treating this model as informative for progenitor cell-cycle and
        division control.
  - target: Neural Stem and Progenitor Pool Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced neurogenesis across the dosage series, with frank microcephaly only
      at complete female progenitor loss.
    limitations: >-
      The genotype that produces microcephaly (complete progenitor loss in
      females) has no human counterpart; the human-equivalent genotypes give
      reduced neurogenesis without marked microcephaly, which is the honest match.
    readouts:
    - name: Neuron production and brain size across the Ddx3x dosage series
      target: Neural Stem and Progenitor Pool Depletion
      direction: DECREASED
      interpretation: >-
        Neurogenesis falls with reducing Ddx3x dosage; microcephaly appears only
        at the null extreme.
      evidence:
      - reference: PMID:35762573
        reference_title: Aberrant cortical development is driven by impaired cell cycle and translational control in a DDX3X syndrome model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          First, we show brain development is sensitive to Ddx3x dosage; complete
          Ddx3x loss from neural progenitors causes microcephaly in females,
          whereas hemizygous males and heterozygous females show reduced
          neurogenesis without marked microcephaly.
        explanation: >-
          Reports the dosage-graded neurogenesis and brain-size measurement behind
          this readout.
- name: ddx3x-deficient zebrafish
  species: Danio rerio
  genotype: ddx3x loss-of-function allele
  publication: PMID:39471229
  description: >-
    A ddx3x-deficient zebrafish with developmental delay, microcephaly, social
    and adaptation deficits and impaired spatial recognition memory, profiled by
    single-nucleus RNA sequencing. It is the system in which the CREBBP-Notch arm
    and the excitatory/inhibitory imbalance were established, and in which
    glutamatergic supplementation partly rescued the behavioural phenotype.
  modeled_mechanisms:
  - target: Reduced CREBBP mRNA Stability and Notch Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The molecular arm of the mechanism - crebbp mRNA destabilisation and
      reduced Notch signalling - was demonstrated in this model.
    limitations: >-
      Established only in zebrafish; there is no human tissue or human cellular
      confirmation of the CREBBP-Notch step, and zebrafish forebrain development
      differs substantially from mammalian corticogenesis.
    readouts:
    - name: crebbp mRNA stability and Notch pathway output
      target: Reduced CREBBP mRNA Stability and Notch Signalling
      direction: DECREASED
      interpretation: >-
        Reduced crebbp message stability with downstream loss of Notch signalling.
      evidence:
      - reference: PMID:39471229
        reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mechanistically, we reveal that the ddx3x deficiency attenuates the
          stability of the crebbp mRNA, which in turn causes downregulation of
          Notch signaling and defects in neurogenesis.
        explanation: >-
          Reports the mRNA-stability and Notch measurements behind this readout.
    evidence:
    - reference: PMID:39471229
      reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We generated a ddx3x deficient zebrafish allele, which exhibited reduced
        survival rate, DD, microcephaly, adaptation defects, anxiolytic behaviors,
        social interaction deficits, and impaired spatial recognitive memory.
      explanation: >-
        Establishes the model and its developmental and behavioural phenotype.
  - target: Excitatory-Inhibitory Neuronal Differentiation Imbalance
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Single-nucleus transcriptomics shows imbalanced excitatory and inhibitory
      neuron differentiation, and glutamatergic supplementation partly rescues
      the behavioural consequence.
    limitations: >-
      Fidelity is rated low because the human excitatory/inhibitory balance has
      not been measured in this disorder, and because the behavioural constructs
      rescued in zebrafish (adaptation, social interaction) map only loosely onto
      the human behavioural phenotype.
    readouts:
    - name: Excitatory and inhibitory neuron differentiation ratio
      target: Excitatory-Inhibitory Neuronal Differentiation Imbalance
      direction: ALTERED
      interpretation: >-
        The ratio of excitatory to inhibitory neuron production is shifted.
      evidence:
      - reference: PMID:39471229
        reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          ddx3x deficiency leads to reduced neural stem cell pool, decreased total
          neuron number, and imbalanced differentiation of excitatory and
          inhibitory neurons, which are responsible for the behavioral defects
        explanation: >-
          Reports the single-nucleus differentiation measurement behind this
          readout.
    - name: Behavioural rescue by glutamatergic supplementation
      target: Excitatory-Inhibitory Neuronal Differentiation Imbalance
      direction: RESTORED
      interpretation: >-
        Partial reversal of adaptation and social deficits by L-glutamate or an
        mGluR2/3 agonist, arguing the deficit is functional rather than purely
        structural.
      evidence:
      - reference: PMID:39471229
        reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the supplementation of L-glutamate or glutamate receptor agonist
          ly404039 could partly rescue the adaptation and social deficits
        explanation: >-
          Reports the pharmacological rescue behind this readout.
- name: p.Arg79Lys zebrafish rescue assay
  species: Danio rerio
  genotype: ddx3x morphant rescued with human DDX3X p.Arg79Lys mRNA
  publication: PMID:29490693
  description: >-
    An established zebrafish assay of DDX3X activity used to classify the
    inherited male p.Arg79Lys allele. It is a variant-interpretation assay rather
    than a disease model, and it is what turned a hemizygous missense variant of
    uncertain significance into a demonstrated hypomorph.
  modeled_mechanisms:
  - target: Hemizygous Partial Loss of DDX3X Function in Males
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies residual DDX3X activity for a specific male allele, which is the
      property this pathophysiology node asserts.
    limitations: >-
      A heterologous rescue readout in fish, not a measurement in human neural
      tissue; it establishes relative allele activity, not the absolute residual
      function in a patient's brain.
    readouts:
    - name: Rescue of the ddx3x-depletion phenotype by the p.Arg79Lys allele
      target: Hemizygous Partial Loss of DDX3X Function in Males
      direction: DECREASED
      interpretation: >-
        Partial rather than complete rescue, classifying the allele as
        hypomorphic.
      evidence:
      - reference: PMID:29490693
        reference_title: A hypomorphic inherited pathogenic variant in DDX3X causes male intellectual disability with additional neurodevelopmental and neurodegenerative features.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          found that this allele causes a partial loss of DDX3X function and thus
          represents a hypomorphic variant
        explanation: >-
          Reports the rescue result behind this readout.

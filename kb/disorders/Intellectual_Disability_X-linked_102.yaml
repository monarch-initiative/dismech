differential_diagnoses:
- name: Cerebral palsy
  description: >-
    A static motor phenotype with intellectual disability is readily labelled
    cerebral palsy, and DDX3X-related disorder has been diagnosed after such a
    label. Unexplained intellectual disability with a static motor picture should
    prompt genomic testing rather than closing the diagnosis clinically.
  distinguishing_features:
  - >-
    Cerebral palsy is a clinical description with a presumed acquired or
    perinatal cause, whereas DDX3X-related disorder is established by a
    pathogenic germline variant.
  - >-
    A cortical malformation on brain MRI points away from a purely clinical
    cerebral-palsy label and towards a genetic malformation syndrome.
  notes: >-
    Recorded from the clinical-course literature on this disorder rather than
    from a formal differential-diagnosis study.
- name: Tubulinopathies and other malformations of cortical development
  description: >-
    The DDX3X brain malformation pattern - malformations of cortical development
    with callosal dysgenesis, basal ganglia anomalies and midbrain-hindbrain
    involvement - closely resembles the tubulinopathies on imaging.
  distinguishing_features:
  - >-
    Resolution is molecular; the imaging pattern alone does not separate DDX3X
    from TUBA1A and the other tubulin genes.
  evidence:
  - reference: PMID:30936465
    reference_title: Three de novo DDX3X variants associated with distinctive brain developmental abnormalities and brain tumor in intellectually disabled females.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings expand the phenotypic spectrum of DDX3X-related disorders,
      demonstrating unique neuroradiological features resembling those of the
      tubulinopathies, and support a role for DDX3X in neuronal development.
    explanation: >-
      States the radiological resemblance to the tubulinopathies that makes them
      the imaging differential.
discussions:
- discussion_id: ddx3y_compensation_conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does the Y-linked paralog DDX3Y compensate for DDX3X in the developing male
    brain?
  attaches_to:
  - pathophysiology#Hemizygous Partial Loss of DDX3X Function in Males
  - pathophysiology#Partial Escape from X-Chromosome Inactivation
  rationale: >-
    Two mouse studies reach opposite conclusions. The conditional
    neural-progenitor knockout reports that Ddx3y compensates for Ddx3x in the
    developing male neocortex, making the phenotype sexually dimorphic. The
    haploinsufficient mouse paper argues DDX3Y cannot compensate because it is
    translated only in spermatocytes. The answer matters: if DDX3Y compensates in
    the developing brain, it is a second reason - alongside escape from
    X-inactivation - that hemizygous males tolerate an allele that a female does
    not, and it changes how a hemizygous variant of uncertain significance in a
    male should be interpreted.
  evidence:
  - reference: PMID:35762573
    reference_title: Aberrant cortical development is driven by impaired cell cycle and translational control in a DDX3X syndrome model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, Ddx3x loss is sexually dimorphic, as its paralog, Ddx3y,
      compensates for Ddx3x in the developing male neocortex.
    explanation: >-
      The position that Ddx3y does compensate, demonstrated in conditional
      knockout neocortex.
  - reference: PMID:34344536
    reference_title: Developmental and Behavioral Phenotypes in a Mouse Model of DDX3X Syndrome.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The DDX3X paralog on the Y chromosome (DDX3Y) does not appear to compensate
      for this dosage imbalance as it is translated only in spermatocytes
    explanation: >-
      The opposing position, on the grounds that DDX3Y translation is restricted
      to spermatocytes.
  notes: >-
    Both statements are about mouse. Neither has been tested in human fetal
    cortex, which is where the question would have to be settled.
- discussion_id: non_syndromic_label_mismatch
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Why does MONDO:0010497 classify this disorder as non-syndromic X-linked
    intellectual disability when the published phenotype is syndromic?
  attaches_to:
  - disease#Intellectual Disability X-linked 102
  - phenotypes#Corpus Callosum Hypoplasia
  - phenotypes#Polymicrogyria
  rationale: >-
    MONDO:0010497 is a child of MONDO:0019181, non-syndromic X-linked
    intellectual disability, and carries synonyms including "DDX3X non-syndromic
    X-linked intellectual disability" generated by the
    disease-series-by-gene design pattern. The same term also carries the synonym
    "intellectual developmental disorder, X-linked, syndrome, Snijders Blok
    type", which is the opposite claim. The literature is unambiguous: the
    founding cohort reported hypotonia, movement disorders, behaviour problems,
    corpus callosum hypoplasia and epilepsy alongside the intellectual
    disability, and later series added polymicrogyria, ventriculomegaly, delayed
    myelination, feeding difficulty, ophthalmologic problems and scoliosis. The
    "non-syndromic" placement is an artefact of an automated gene-series pattern,
    not a curatorial claim about the phenotype. This entry curates the syndromic
    phenotype and flags the term for upstream correction rather than trimming the
    phenotype to fit the label.
  evidence:
  - reference: PMID:30936465
    reference_title: Three de novo DDX3X variants associated with distinctive brain developmental abnormalities and brain tumor in intellectually disabled females.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo DDX3X variants account for 1-3% of syndromic intellectual
      disability (ID) in females and have been occasionally reported in males.
    explanation: >-
      Describes the same 1-3% population as syndromic intellectual disability,
      directly contradicting the non-syndromic placement.
  - reference: PMID:26235985
    reference_title: Mutations in DDX3X Are a Common Cause of Unexplained Intellectual Disability with Gender-Specific Effects on Wnt Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present 35 unique deleterious de novo mutations in DDX3X identified by
      whole exome sequencing in 38 females with ID and various other features
      including hypotonia, movement disorders, behavior problems, corpus callosum
      hypoplasia, and epilepsy
    explanation: >-
      The founding cohort itself reports extra-cognitive features, so the disorder
      was never described as non-syndromic.
- discussion_id: ei_imbalance_human_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the excitatory/inhibitory neuronal imbalance seen in ddx3x-deficient
    zebrafish present in human DDX3X-related neurodevelopmental disorder, and is
    the glutamatergic rescue translatable?
  attaches_to:
  - pathophysiology#Excitatory-Inhibitory Neuronal Differentiation Imbalance
  - pathophysiology#Reduced CREBBP mRNA Stability and Notch Signalling
  rationale: >-
    The zebrafish work supplies the only mechanistic route from DDX3X loss to a
    pharmacologically reversible phenotype: crebbp mRNA destabilisation, reduced
    Notch signalling, an excitatory/inhibitory differentiation imbalance, and
    partial behavioural rescue with L-glutamate or a glutamate receptor agonist.
    Every step of that chain is untested in human cells or tissue. The mismatch is
    substantive rather than routine because it is the only current candidate for
    a disease-modifying target, so the translational gap is what stands between a
    model result and a therapeutic hypothesis. Zebrafish forebrain development
    also lacks the mammalian cortical architecture in which the human phenotype
    arises.
  evidence:
  - reference: PMID:39471229
    reference_title: Deficiency of DDX3X results in neurogenesis defects and abnormal behaviors via dysfunction of the Notch signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the supplementation of L-glutamate or glutamate receptor agonist ly404039
      could partly rescue the adaptation and social deficits
    explanation: >-
      The rescue result whose human translatability is the open question.
- discussion_id: no_population_prevalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the population prevalence or birth incidence of DDX3X-related
    neurodevelopmental disorder?
  attaches_to:
  - prevalence#Worldwide
  rationale: >-
    Every quantitative statement about how common this disorder is comes from
    diagnostic sequencing cohorts of already-ascertained intellectual disability,
    or from counts of diagnosed individuals. Neither supports a population rate.
    Ascertainment is additionally sex-biased, so even the observed sex ratio among
    diagnosed individuals cannot be read as the true one: males with hypomorphic
    alleles are under-recognised, and the male cohort's median age at diagnosis
    was 8 years with a range extending to 47.
  evidence:
  - reference: PMID:40164730
    reference_title: DDX3X-related neurodevelopmental disorder in males - presenting a new cohort of 19 males and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DDX3X-related neurodevelopmental disorder is one of the most common
      monogenic causes of intellectual disability in females, with currently
      >1000 females diagnosed worldwide.
    explanation: >-
      A diagnosed-case count, which is the best available figure and is not a
      prevalence.
notes: >-
  Scope. This entry is about the DDX3X-related disorder itself. DDX3X appears as
  a comparator or gene-list member in several other dismech entries
  (Non-Syndromic_X-Linked_Intellectual_Disability,
  Neurodevelopmental_Disorder_with_Hypotonia_and_Speech_Delay and others); none
  of those is about this disease and none was edited here.

  MONDO label. MONDO:0010497 is placed under non-syndromic X-linked intellectual
  disability by the disease-series-by-gene design pattern, while its own synonym
  list also contains the Snijders Blok syndromic label. The syndromic phenotype
  is curated; see the non_syndromic_label_mismatch discussion. The MONDO term is
  retained as disease_term because it is the term the curation queue targets and
  its causal-gene edge (RO:0004003 to HGNC:2745) is correct.

  Somatic versus germline. Somatic DDX3X variants recur in medulloblastoma and
  in lymphoid malignancies, at some of the same residues. Those are a separate
  biological context; nothing in this entry is derived from a somatic DDX3X
  dataset.

  Deep-research provenance and corrected identifiers. Built from
  research/Intellectual_Disability_X-linked_102-deep-research-falcon.md, which
  passed the Named Entity Confusion preflight against MONDO:0010497 (DDX3X
  mentioned 68 times, OMIM 300958 matching). Three classes of defect in that
  report were corrected here. First, its frontmatter mondo_id is empty, so the
  preflight was run manually. Second, it cites only DOIs and no PMIDs; every
  reference used here was resolved to its PMID through a PubMed DOI search and
  cited as PMID. Third, two of its proposed HPO bindings name the wrong term:
  it offers HP:0007370 as "Abnormality of the corpus callosum" when HPO calls
  that term Aplasia/Hypoplasia of the corpus callosum, and it offers HP:0001344
  as "Severe expressive language delay" when HP:0001344 is Absent speech - a
  different clinical concept. Both were re-derived against OLS before binding.
  The report also proposes MONDO:0018709 as the disease term rather than the
  MONDO:0010497 this entry is keyed on, and it attributes the anxiety and
  self-injury comparative study to the wrong first author; the correct source is
  Ng-Cordell et al. (PMID:35536379), which is what is cited here.

  Claims deliberately not curated for want of a quotable source. The report's
  prospective-cohort figures of 60% autism and 53% ADHD are attributed to a
  reference whose abstract does not contain them, so autism and ADHD are curated
  without a frequency band. Its polymicrogyria prevalence of 7-12% and its
  pooled 53-patient series figures likewise have no traceable quotable source in
  the cached records, so polymicrogyria carries no frequency. The claim that
  DDX3X-related disorder is among the syndromes correctly ranked first by facial
  phenotyping tools was not curated: no citation was given for it.

  Modules. Three pathophysiology nodes conform to
  neural_progenitor_centrosome_spindle_dysfunction. The module's entry node,
  Centrosome and Mitotic Spindle Perturbation, is deliberately not claimed:
  DDX3X reaches the progenitor cell cycle through translational control, not
  through the centrosome or spindle, and the module's own description admits
  cell-cycle as well as centrosomal entry points. Conformance therefore starts
  at Abnormal Progenitor Division and Fate Choice.

  Gaps. No disease-modifying therapy, no biochemical or methylation biomarker
  (the episignature study NCT04436588 has not reported), no population
  prevalence, no validated prognostic marker, and no natural-history data on
  whether the reported late motor decline in some individuals is a real
  progressive component or ascertainment. Environmental factors are not curated
  because none is established: this is a de novo or inherited germline disorder
  with no reported environmental contribution, and an environmental block with no
  citable content would be worse than its absence.

- name: Impaired Thick Ascending Limb Salt Reabsorption
  description: >-
    Uromodulin supports apical trafficking of the NKCC2 cotransporter in the
    thick ascending limb. Loss of functional uromodulin causes salt and water
    wasting and a concentrating defect, and the proximal tubule compensates by
    reabsorbing more sodium together with urate, which lowers urate excretion.
    This step is shown in uromodulin knockout mice and in knock-in mice; how
    much it explains the human hyperuricemia is not measured directly.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: renal sodium ion absorption
    modifier: DECREASED
    term:
      id: GO:0070294
      label: renal sodium ion absorption
  cell_types:
  - preferred_term: thick ascending limb epithelial cell
    term:
      id: CL:1001106
      label: kidney loop of Henle thick ascending limb epithelial cell
  evidence:
  - reference: PMID:29357410
    reference_title: "Tamm-Horsfall protein/uromodulin deficiency elicits tubular compensatory responses leading to hypertension and hyperuricemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "young KO mice had significant salt and water wasting but were partially responsive to furosemide, due to decreased luminal translocation of Na-K-Cl cotransporter 2 (NKCC2) in the TAL."
    explanation: Uromodulin loss impairs NKCC2-dependent salt reabsorption.
  downstream:
  - target: Increased Proximal Tubular Urate Reabsorption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29357410
      reference_title: "Tamm-Horsfall protein/uromodulin deficiency elicits tubular compensatory responses leading to hypertension and hyperuricemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the aged THP KO mice had significant upregulation of Na-coupled urate transporters Slc5a8 and Slc22a12 as well as sodium-hydrogen exchanger 3 (NHE3) in the proximal tubule and elevated serum uric acid and allantoin."
      explanation: Compensatory proximal urate transporter upregulation follows thick ascending limb salt wasting.
  - target: Impaired renal concentrating ability
    causal_link_type: DIRECT
- name: Increased Proximal Tubular Urate Reabsorption
  description: >-
    Sodium-coupled urate transporters (URAT1/SLC22A12, SLC5A8) are
    upregulated in the proximal tubule, so the fractional excretion of urate
    falls and serum urate rises out of proportion to the reduction in kidney
    function.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: urate transport
    modifier: INCREASED
    term:
      id: GO:0015747
      label: urate transport
  cell_types:

    evidence_source: HUMAN_CLINICAL
    snippet: "hyperuricemia secondary to profound renal uric acid underexcretion, gout, and chronic renal disease"
    explanation: In patients, hyperuricemia reflects renal underexcretion of urate.
  downstream:

      reference_title: "Type of uromodulin mutation and allelic status influence onset and severity of uromodulin-associated kidney disease in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Umod mutant mice exhibit increased plasma urea and Cystatin levels, impaired urinary concentration ability, reduced fractional excretion of uric acid"
      explanation: >-
        Missense knock-in mice, which retain mutant uromodulin in the ER,
        develop the concentrating and urate phenotypes, so the salt-handling
        arm follows from the disease-type variant and not only from complete
        uromodulin loss.
- name: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
  description: >-
    Retained uromodulin induces ER chaperones and the IRE1-XBP1 branch of the
    unfolded protein response; ER stress alters protein and mitochondrial
    homeostasis and impairs autophagy, so mutant protein is not cleared and
    tubular cells are damaged.

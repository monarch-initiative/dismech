    validity record for UMOD is in the reference cache.
  evidence:
  - reference: PMID:12471200
    reference_title: "Mutations of the UMOD gene are responsible for medullary cystic kidney disease 2 and familial juvenile hyperuricaemic nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data provide the first direct evidence that MCKD2 and FJHN arise from mutation of the UMOD gene and are allelic disorders."
    explanation: First report of UMOD as the cause of FJHN and MCKD2.
  - reference: PMID:25738250
    reference_title: "Autosomal dominant tubulointerstitial kidney disease: diagnosis, classification, and management--A KDIGO consensus report."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple names have been proposed for these disorders, including 'Medullary Cystic Kidney Disease (MCKD) type 2', 'Familial Juvenile Hyperuricemic Nephropathy (FJHN)', or 'Uromodulin-Associated Kidney Disease (UAKD)' for UMOD-related diseases"
    explanation: KDIGO places FJHN, MCKD2 and UAKD under UMOD.
animal_models:
- name: Umod C93F and A227T knock-in mice
  species: Mus musculus
  genotype: Umod C93F or A227T (heterozygous and homozygous)
  description: >-
    ENU-derived and knock-in missense lines on the C3H background. Mutant
    uromodulin fails to mature and accumulates in the ER of thick ascending
    limb cells, with impaired concentration, low fractional urate excretion,
    interstitial fibrosis and tubular atrophy. Severity depends on the
    variant and on zygosity.
  publication: PMID:23748428
  modeled_mechanisms:
  - target: Mutant Uromodulin Retention in the Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Accumulation of immature uromodulin and ER hyperplasia in thick ascending limb cells.
    evidence:
    - reference: PMID:23748428
      reference_title: "Type of uromodulin mutation and allelic status influence onset and severity of uromodulin-associated kidney disease in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The maturation defect of mutant uromodulin leads to the accumulation of immature uromodulin in the endoplasmic reticulum (ER) and to ER hyperplasia."
      explanation: ER retention in vivo.
  - target: Tubulointerstitial Injury and Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Fibrosis, inflammatory infiltrates and tubular atrophy.
    limitations: >-
      Severity and tempo depend on the particular variant and on zygosity, and
      homozygous animals are more affected than heterozygous patients.
    evidence:
    - reference: PMID:23748428
      reference_title: "Type of uromodulin mutation and allelic status influence onset and severity of uromodulin-associated kidney disease in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "this study was able to demonstrate for the first time in vivo that the severity of the uromodulin maturation defect as well as onset and speed of progression of renal dysfunction and morphological alterations are strongly dependent on the particular Umod mutation itself and the zygosity status."
      explanation: Severity varies with variant and zygosity.
- name: Umod C125R knock-in mouse
  species: Mus musculus
  genotype: Umod C125R (heterozygous and homozygous)
  description: >-
    Knock-in of a cysteine-to-arginine disease-type variant. Mice develop low
    urate excretion, fibrosis, immune infiltration and progressive kidney
    failure with ER retention and ER stress, but no increase in apoptosis.
  publication: PMID:28325753
  modeled_mechanisms:
  - target: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Raised GRP78 and unfolded protein response activation in mutant cells.
    limitations: >-
      ER stress was not followed by increased apoptosis in vivo, so the step
      from ER stress to cell loss is not reproduced in this line.
    evidence:
    - reference: PMID:28325753
      reference_title: "A mouse model for inherited renal fibrosis associated with endoplasmic reticulum stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous and homozygous mutant mice developed reduced uric acid excretion, renal fibrosis, immune cell infiltration and progressive renal failure, with decreased maturation and excretion of uromodulin, due to its retention in the ER."
      explanation: Reproduces the human disease features.
- name: Tg-Umod C147W transgenic mouse
  species: Mus musculus
  genotype: Transgenic C147W uromodulin on a wild-type Umod background
  description: >-
    Mice expressing a disease-type cysteine variant develop ER retention of
    mutant uromodulin, thick ascending limb cell stress, inflammation and
    fibrosis. A 30% calorie restriction regimen restored autophagy, cleared
    mutant uromodulin from the ER and prevented or slowed kidney damage,
    the only mechanism-directed intervention tested in an ADTKD-UMOD model.
  publication: PMID:41632531
  modeled_mechanisms:
  - target: Mutant Uromodulin Retention in the Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: ER retention of C147W uromodulin in thick ascending limb cells.
    limitations: >-
      A transgene expressed on top of two normal endogenous Umod alleles,
      not a heterozygous knock-in, so the mutant-to-wild-type ratio differs
      from patients.
    evidence:
    - reference: PMID:41632531
      reference_title: "Calorie Restriction Leads to Degradation of Mutant Uromodulin and Ameliorates Inflammation and Fibrosis in UMOD -Related Kidney Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic mice expressing C147W uromodulin (Tg Umod C147W ) were subjected to a moderate (30%) calorie restriction regimen for 15 or 24 weeks, starting at different stages of disease progression."
      explanation: The transgenic model and intervention design.
  - target: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Calorie restriction restored autophagy and relieved epithelial cell stress.
    limitations: >-
      Calorie restriction acts on many pathways, including direct
      anti-inflammatory effects, and has not been tested in patients.
    readouts:
    - name: Epithelial cell stress after calorie restriction
      target: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
      direction: DECREASED
      interpretation: Clearing mutant uromodulin relieves the cell stress it causes.
      evidence:
      - reference: PMID:41632531
        reference_title: "Calorie Restriction Leads to Degradation of Mutant Uromodulin and Ameliorates Inflammation and Fibrosis in UMOD -Related Kidney Disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In presymptomatic Tg Umod C147W mice, calorie restriction alleviated epithelial cell stress."
        explanation: Readout of the rescue.
    evidence:
    - reference: PMID:41632531
      reference_title: "Calorie Restriction Leads to Degradation of Mutant Uromodulin and Ameliorates Inflammation and Fibrosis in UMOD -Related Kidney Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Calorie restriction stimulated autophagy and degradation of mutant uromodulin, leading to amelioration of cell stress and tubular damage."
      explanation: Mechanism of the rescue.
- name: Umod knockout mouse
  species: Mus musculus
  genotype: Umod-/- (Tamm-Horsfall protein knockout)
  description: >-
    Complete uromodulin deficiency, used to study the loss-of-function arm:
    NKCC2 mistrafficking, salt wasting, and later hypertension and
    hyperuricemia with compensatory proximal tubule urate transport.
  publication: PMID:29357410
  modeled_mechanisms:
  - target: Impaired Thick Ascending Limb Salt Reabsorption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Salt wasting through reduced apical NKCC2.
    limitations: >-
      A knockout has no misfolded protein, so it models only the loss of
      uromodulin function and not the ER proteinopathy that defines the human
      disease, in which patients are heterozygous.
    evidence:
    - reference: PMID:29357410
      reference_title: "Tamm-Horsfall protein/uromodulin deficiency elicits tubular compensatory responses leading to hypertension and hyperuricemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, our results suggest that THP deficiency can cause progressive disturbances in renal functions via initially NKCC2 dysfunction and later compensatory responses, resulting in prolonged activation of the renin-angiotensin-aldosterone axis and hyperuricemia."
      explanation: Loss-of-function arm leading to hyperuricemia.
experimental_models:
- name: Immortalized mouse thick ascending limb (mTAL) cells expressing mutant uromodulin
  experimental_model_type: CELL_LINE
  description: >-
    Immortalized epithelial cells from murine thick ascending limb expressing
    GFP-tagged wild-type or C150S uromodulin; the mutant is retained in the
    ER and activates the unfolded protein response.
  publication: PMID:28437467
  modeled_mechanisms:
  - target: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: UPR activation (IRE1-XBP1) and chaperone binding by mutant uromodulin.
    limitations: >-
      Overexpression of a tagged protein in a mouse cell line; tissue
      inflammation and fibrosis are not modeled.
    evidence:
    - reference: PMID:28437467
      reference_title: "Mutant uromodulin expression leads to altered homeostasis of the endoplasmic reticulum and activates the unfolded protein response."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, mutant uromodulin shows delayed trafficking to the plasma membrane and accumulation in the ER in mTAL cells"
      explanation: ER accumulation in the cell model.
diagnosis:
- name: UMOD genetic testing
  description: >-
    Diagnosis is confirmed by a heterozygous pathogenic UMOD variant in a
    patient with suggestive findings (family history, CKD with bland urine,
    early hyperuricemia or gout).
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ADTKD-UMOD is established in a proband with suggestive findings and a heterozygous pathogenic variant in UMOD identified by molecular genetic testing."
    explanation: Diagnostic standard.
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Any relative who is a potential kidney donor should be tested for the familial UMOD pathogenic variant so that only those without the variant are evaluated further for kidney donation."
    explanation: Testing of related living donors.
- name: Serum creatinine monitoring
  description: >-
    Serum creatinine at least annually in affected individuals, more often
    with severe disease.
  diagnosis_term:
    preferred_term: serum creatinine measurement
    term:
      id: NCIT:C61023
      label: Serum Creatinine Measurement
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Measurement of serum creatinine concentration at least annually in affected individuals, and more frequently in those with severe disease; measurement of serum uric acid concentration at least annually."
    explanation: GeneReviews surveillance.
- name: Serum uric acid monitoring
  description: Serum uric acid at least annually in affected individuals.
  diagnosis_term:
    preferred_term: serum urate measurement
    term:
      id: NCIT:C64814
      label: Urate Measurement
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Measurement of serum creatinine concentration at least annually in affected individuals, and more frequently in those with severe disease; measurement of serum uric acid concentration at least annually."
    explanation: GeneReviews surveillance.
- name: Kidney biopsy with uromodulin immunostaining
  description: >-
    Shows chronic tubulointerstitial nephropathy, intracytoplasmic uromodulin
    aggregates in distal tubular cells and bundled or cystic ER on electron
    microscopy. Not required when genetic testing is available.
  diagnosis_term:
    preferred_term: kidney biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  evidence:
  - reference: PMID:31422399
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease Due to UMOD Mutation: A Two-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since ADTKD-UMOD is an underdiagnosed disease, electron microscopy and immunohistochemical staining for uromodulin are helpful in the diagnosis of ADTKD-UMOD and genetic analysis is the gold standard."
    explanation: Role of biopsy versus genetics.
treatments:
- name: Allopurinol
  description: >-
    Lifelong allopurinol normalizes serum urate and prevents gout. Whether it
    slows kidney decline is unproven, since the evidence comes from small
    uncontrolled studies. Allopurinol should be avoided in pregnancy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: allopurinol
      term:
        id: CHEBI:40279
        label: allopurinol
  target_phenotypes:
  - preferred_term: Hyperuricemia
    term:
      id: HP:0002149
      label: Hyperuricemia
  - preferred_term: Gout
    term:
      id: HP:0001997
      label: Gout
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With allopurinol treatment, serum uric acid concentration returns to normal and gout attacks can be entirely prevented."
    explanation: Effect on urate and gout.
  - reference: PMID:26872483
    reference_title: "From juvenile hyperuricaemia to dysfunctional uromodulin: an ongoing metamorphosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Allopurinol has been suggested as a therapeutic agent, but unfortunately this was based on non-randomised uncontrolled trials with small patient numbers."
    explanation: Evidence for a renal benefit is weak.
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Use of allopurinol during pregnancy should be avoided."
    explanation: GeneReviews pregnancy caution for lifelong allopurinol.
- name: Kidney Transplantation
  description: >-
    Kidney transplantation is curative for the kidney disease, because the
    defect is in the native thick ascending limb cells. Dialysis is used as
    needed before transplantation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_phenotypes:
  - preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal replacement therapies such as hemodialysis and peritoneal dialysis replace kidney function but are associated with potential complications; kidney transplantation is curative."
    explanation: GeneReviews management.
- name: Avoidance of Nephrotoxins and Volume Depletion
  description: >-
    Nephrotoxic drugs, volume depletion and dehydration should be avoided;
    chronic daily NSAID use should be avoided, though short courses may be
    used for gout before stage 3 CKD. ACE inhibitors are contraindicated in
    pregnancy because of fetal harm. A single case report describes a
    reversible rise in creatinine on fenofibrate.
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Tubulointerstitial Injury and Fibrosis
  evidence:
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Drugs known to be nephrotoxic; volume depletion and dehydration."
    explanation: GeneReviews agents to avoid.
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonsteroidal anti-inflammatory drugs are generally discouraged but could be used for short-term administration for treatment of gout or similar painful conditions in early CKD (prior to Stage 3 CKD)."
    explanation: GeneReviews guidance on NSAIDs.
  - reference: PMID:20301530
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease – UMOD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of angiotensin-converting enzyme inhibitors even in early pregnancy can result in fetal damage and death."
    explanation: GeneReviews pregnancy caution.
  - reference: PMID:24940667
    reference_title: "Fenofibrate increases serum creatinine in a patient with familial nephropathy associated to hyperuricemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first patient with FJHN in whom fenofibrate administration was associated to a further impairment in renal function not attributable to rabdomyolysis."
    explanation: Single case of fenofibrate-associated decline.
differential_diagnoses:
- name: ADTKD-MUC1
  disease_term:
    preferred_term: tubulointerstitial kidney disease, autosomal dominant, 2
    term:
      id: MONDO:0020726
      label: tubulointerstitial kidney disease, autosomal dominant, 2
  description: >-
    MUC1 frameshift disease gives the same dominant CKD with bland urine but
    usually without early hyperuricemia or gout.
  distinguishing_features:
  - Early hyperuricemia and gout point to UMOD rather than MUC1
  - MUC1 frameshift variants are missed by standard sequencing
  evidence:
  - reference: PMID:25738250
    reference_title: "Autosomal dominant tubulointerstitial kidney disease: diagnosis, classification, and management--A KDIGO consensus report."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rare autosomal dominant tubulointerstitial kidney disease is caused by mutations in the genes encoding uromodulin (UMOD), hepatocyte nuclear factor-1β (HNF1B), renin (REN), and mucin-1 (MUC1)."
    explanation: MUC1 is one of the ADTKD genes that gives the same clinical picture.
- name: ADTKD-REN (familial juvenile hyperuricemic nephropathy type 2)
  disease_term:
    preferred_term: familial juvenile hyperuricemic nephropathy type 2
    term:
      id: MONDO:0013128
      label: familial juvenile hyperuricemic nephropathy type 2
  description: >-
    REN variants cause dominant CKD with hyperuricemia plus childhood anemia
    and low blood pressure.
  distinguishing_features:
  - Anemia in childhood and hypotension or hyperkalemia in ADTKD-REN
  evidence:
  - reference: PMID:21071970
    reference_title: "Uromodulin-associated kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A similar clinical syndrome causing the autosomal dominant inheritance of chronic kidney disease, hyperuricemia, and anemia has recently been attributed to mutations in the REN gene encoding renin."
    explanation: REN disease adds anemia.
- name: SEC61A1 deficiency
  disease_term:
    preferred_term: SEC61A1 deficiency
    term:
      id: MONDO:0100337
      label: SEC61A1 deficiency
  description: Rare ADTKD gene; often with anemia and other features.
  distinguishing_features:
  - Molecular testing separates the ADTKD genes
  evidence:
  - reference: PMID:31488840
    reference_title: "Autosomal dominant tubulointerstitial kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ADTKD is caused by mutations in at least five different genes, including UMOD, MUC1, REN, HNF1B and, more rarely, SEC61A1."
    explanation: The ADTKD gene set.
- name: Renal cysts and diabetes syndrome (HNF1B)
  disease_term:
    preferred_term: renal cysts and diabetes syndrome
    term:
      id: MONDO:0007669
      label: renal cysts and diabetes syndrome
  description: >-
    HNF1B disease can present as dominant tubulointerstitial CKD with
    hyperuricemia but adds diabetes, genital tract anomalies,
    hypomagnesemia or liver enzyme abnormalities.
  distinguishing_features:
  - Early-onset diabetes, hypomagnesemia or genital anomalies in HNF1B disease
  evidence:
  - reference: PMID:25738250
    reference_title: "Autosomal dominant tubulointerstitial kidney disease: diagnosis, classification, and management--A KDIGO consensus report."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rare autosomal dominant tubulointerstitial kidney disease is caused by mutations in the genes encoding uromodulin (UMOD), hepatocyte nuclear factor-1β (HNF1B), renin (REN), and mucin-1 (MUC1)."
    explanation: HNF1B is one of the ADTKD genes.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  GeneReviews (ADTKD-UMOD, PMID:20301530) is the phenotype baseline. KDIGO
  merged familial juvenile hyperuricemic nephropathy, medullary cystic kidney
  disease type 2 and uromodulin-associated kidney disease under ADTKD-UMOD;
  this entry uses the MONDO label for the disease term. The two arms of the
  mechanism (ER proteinopathy driving fibrosis, and lost uromodulin function
  driving salt wasting and urate retention) are both supported mainly by
  mouse models, and their relative weight in patients is not measured.

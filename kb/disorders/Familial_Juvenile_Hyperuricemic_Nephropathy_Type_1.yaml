      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The maturation defect of mutant uromodulin leads to the accumulation of immature uromodulin in the endoplasmic reticulum (ER) and to ER hyperplasia."
      explanation: Mutant uromodulin does not mature and accumulates in the ER.
- name: Mutant Uromodulin Retention in the Endoplasmic Reticulum
  description: >-
    Misfolded uromodulin cannot leave the ER of thick ascending limb cells;
    it binds ER chaperones (BiP, calnexin, PDI) and forms intracytoplasmic
    aggregates seen on kidney biopsy, with bundled and cystic ER on electron
    microscopy. Less uromodulin reaches the apical membrane and urine. Some
    mutant protein escapes, reaches the membrane and forms extracellular
    aggregates with a dominant-negative effect on co-expressed wild-type
    protein.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    modifier: DECREASED
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
  cell_types:
  - preferred_term: thick ascending limb epithelial cell
    term:
      id: CL:1001106
      label: kidney loop of Henle thick ascending limb epithelial cell
  evidence:
  - reference: PMID:41632531
    reference_title: "Calorie Restriction Leads to Degradation of Mutant Uromodulin and Ameliorates Inflammation and Fibrosis in UMOD -Related Kidney Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "UMOD mutations have a common gain-of-toxic-function effect, causing mutant uromodulin retention in the endoplasmic reticulum (ER)."
    explanation: ER retention is the shared consequence of disease variants.
  - reference: PMID:31422399
    reference_title: "Autosomal Dominant Tubulointerstitial Kidney Disease Due to UMOD Mutation: A Two-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistological analysis confirmed intracytoplasmic aggregates of uromodulin in the distal tubules."
    explanation: Retained uromodulin is visible in patient tubular cells.
  - reference: PMID:22237754
    reference_title: "Urinary secretion and extracellular aggregation of mutant uromodulin isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both in vitro and in vivo we found that mutant isoforms partially escaped retention in the endoplasmic reticulum and reached the plasma membrane where they formed large extracellular aggregates that have a dominant-negative effect on coexpressed wild-type protein."
    explanation: Escaped mutant protein also impairs wild-type uromodulin.
  downstream:
  - target: ER Stress and Unfolded Protein Response in Thick Ascending Limb Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28437467
      reference_title: "Mutant uromodulin expression leads to altered homeostasis of the endoplasmic reticulum and activates the unfolded protein response."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Interestingly, mutant uromodulin expression induces the Unfolded Protein Response (UPR), and specifically the IRE1 branch, as shown by an increased splicing of XBP1."
      explanation: Mutant uromodulin expression in thick ascending limb cells activates the UPR.
  - target: Impaired Thick Ascending Limb Salt Reabsorption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

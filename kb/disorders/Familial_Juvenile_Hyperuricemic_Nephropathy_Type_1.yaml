name: Familial Juvenile Hyperuricemic Nephropathy Type 1
creation_date: "2026-10-28T17:30:00Z"
category: Mendelian
synonyms:
- FJHN1
- ADTKD-UMOD
- autosomal dominant tubulointerstitial kidney disease due to UMOD
- uromodulin-associated kidney disease
- UAKD
- medullary cystic kidney disease type 2
- MCKD2
description: >-
  Autosomal dominant tubulointerstitial kidney disease caused by heterozygous,
  mostly missense UMOD variants, now named ADTKD-UMOD. Uromodulin is made only
  by epithelial cells of the thick ascending limb of the loop of Henle.
  Mutant uromodulin, usually missing a disulfide-bonded cysteine, misfolds and
  is retained in the endoplasmic reticulum, where it causes ER stress and the
  unfolded protein response and is not secreted. The retained protein damages
  thick ascending limb cells and leads to tubular atrophy, interstitial
  inflammation and fibrosis, while less functional uromodulin reaches the
  apical membrane. Patients have a bland urinalysis, impaired urinary
  concentration, hyperuricemia from low fractional excretion of urate (often
  in childhood), gout, and slowly progressive chronic kidney disease that
  reaches kidney failure between the third and seventh decades. Allopurinol
  controls hyperuricemia and prevents gout; kidney transplantation is curative
  for the kidney disease. Familial juvenile hyperuricemic nephropathy type 1,
  medullary cystic kidney disease type 2 and UMOD-related glomerulocystic
  kidney disease are names for the same disorder.

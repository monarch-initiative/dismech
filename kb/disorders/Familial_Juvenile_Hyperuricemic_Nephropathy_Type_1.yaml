    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Umod mutant mice exhibit increased plasma urea and Cystatin levels, impaired urinary concentration ability, reduced fractional excretion of uric acid"
    explanation: Disease-type knock-in mice have low fractional urate excretion.
  - reference: PMID:25417683
    reference_title: "Gout as a manifestation of familial juvenile hyperuricemic nephropathy."

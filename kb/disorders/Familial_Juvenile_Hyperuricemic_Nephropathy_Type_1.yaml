    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Most are missense mutations and small in-frame deletions within exon 3 and exon 4, where the EGF-like domains and D8C are encoded"
    explanation: Location and type of most pathogenic variants.
  - reference: PMID:23748428
    reference_title: "Type of uromodulin mutation and allelic status influence onset and severity of uromodulin-associated kidney disease in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we describe the new mutant mouse line Umod(C93F), leading to disruption of a putative disulfide bond which is also absent in a known human UMOD mutation"
    explanation: A mouse knock-in removing a disulfide bond, as in a human variant, reproduces the disease.

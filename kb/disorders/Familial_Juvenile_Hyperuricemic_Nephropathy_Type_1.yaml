    explanation: Relative frequency of ADTKD among monogenic CKD.
pathophysiology:
- name: Heterozygous UMOD Missense Variant
  description: >-
    Most pathogenic variants are missense changes or small in-frame deletions
    in exons 3 and 4, which encode the EGF-like domains and the eight-cysteine
    (D8C) domain; many replace or create cysteines and disrupt disulfide
    bonds, so the protein cannot fold. Uromodulin synthesis is markedly
    reduced in addition to the accumulation of abnormal protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: UMOD
    term:
      id: hgnc:12559
      label: UMOD
  genetic_context:
    gene:
      preferred_term: UMOD
      term:
        id: hgnc:12559
        label: UMOD

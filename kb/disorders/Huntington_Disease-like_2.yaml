biochemical:
- name: Neurofilament Light Chain (NfL)
  biomarker_term:
    preferred_term: neurofilament light polypeptide
    term:
      id: NCIT:C88043
      label: Neurofilament Light Polypeptide
  presence: Elevated
  context: Blood plasma biomarker of neuroaxonal injury in manifest HDL2
  notes: >-
    Plasma neurofilament light chain (NfL) concentrations are significantly
    elevated in individuals with HDL2 compared with matched healthy controls
    (AUC = 0.926) and reflect central nervous system axonal injury.
  readouts:
  - target: Frontostriatal neurodegeneration
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: >-
      Elevated plasma NfL reflects central nervous system axonal injury and
      discriminates manifest HDL2 from unaffected controls (AUC = 0.926).
    evidence:
    - reference: DOI:10.1177/18796397241300141
      reference_title: "Comparative analysis of neurofilament light chain in Huntington's disease like 2 and Huntington's disease"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        HDL2 is a neurodegenerative disease (20,21) and these findings likely
        represent axonal injury in the central nervous system of our HDL2
        cohort compared to the normal control group.
      explanation: >-
        Links elevated plasma NfL concentrations in HDL2 to central nervous
        system axonal injury from ongoing neurodegeneration.
  evidence:
  - reference: DOI:10.1177/18796397241300141
    reference_title: "Comparative analysis of neurofilament light chain in Huntington's disease like 2 and Huntington's disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Employing a cross-sectional design, NfL levels were assessed in blood
      plasma. Concentrations were notably elevated in both HD and HDL2 groups
      compared to controls.
    explanation: >-
      Cross-sectional human biomarker study demonstrating significantly
      elevated plasma NfL concentrations in HDL2 compared with unaffected
      controls.
  - reference: DOI:10.1177/18796397241300141
    reference_title: "Comparative analysis of neurofilament light chain in Huntington's disease like 2 and Huntington's disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The diagnostic power of NfL plasma (controlling for age at the time of
      sampling), as given by the Area Under the ROC curve data, demonstrated
      an excellent ability to differentiate HD and HDL2 from controls
      (AUC=0.988, 95% CI=0.953-1.000 for HD versus control; AUC=0.926, 95%
      CI=0.812-1.000 for HDL2 versus control, respectively).
    explanation: >-
      Quantifies the discriminative performance (AUC = 0.926) of plasma NfL
      in distinguishing manifest HDL2 from healthy controls.

name: Huntington disease-like 2
creation_date: "2026-04-11T00:31:29Z"
description: >-
  Huntington disease-like 2 (HDL2) is a rare autosomal dominant
  neurodegenerative HD phenocopy caused by a pathogenic CTG/CAG repeat
  expansion in JPH3. Reported cases have overwhelmingly involved people with
  definite or probable African ancestry and the disorder presents with
  progressive movement, cognitive, and psychiatric decline.
category: Genetic
parents:
- Neurodegenerative Disorder
- Movement Disorder
synonyms:
- HDL2
- Huntington disease-like type 2
- Huntington's disease-like 2
disease_term:
  preferred_term: Huntington disease-like 2
  term:
    id: MONDO:0011671
    label: Huntington disease-like 2
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:38114648
      reference_title: "Huntington disease-like 2: insight into neurodegeneration from an African disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Huntington disease (HD)-like 2 (HDL2) is a rare genetic disease
        caused by an expanded trinucleotide repeat in the JPH3 gene
        (encoding junctophilin 3) that shows remarkable clinical similarity
        to HD.
      explanation: >-
        HDL2 is a primary neurodegenerative disorder of the nervous system.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:20301701
      reference_title: "Huntington Disease-Like 2."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "HDL2 is inherited in an autosomal dominant manner."
      explanation: >-
        HDL2 is a Mendelian autosomal dominant hereditary disorder caused by
        a trinucleotide repeat expansion in JPH3.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      MechanisticCategoryEnum does not currently include an RNA-toxicity
      category; HDL2 pathogenesis is multifactorial and involves both
      CUG-repeat RNA foci that sequester MBNL1 and ubiquitin-positive
      intranuclear protein inclusions with partial loss of JPH3 expression.
    evidence:
    - reference: PMID:15835282
      reference_title: "Huntington's disease like-2: review and update."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Like HD, the neuropathology of HDL2 features prominent cortical and
        striatal atrophy and intranuclear inclusions.
      explanation: >-
        HDL2 neuropathology includes characteristic intranuclear protein
        inclusions alongside toxic repeat RNA and protein pathogenesis.
prevalence:
- population: Global outside South Africa
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Outside South Africa, HDL2 is ultra-rare, with fewer than 50 pedigrees
    described worldwide and reported almost exclusively in individuals of
    definite or probable African ancestry; JPH3 expansion mutations account
    for approximately 1% of clinically or pathologically defined HD
    phenocopies lacking an HTT expansion (a referral/phenocopy diagnostic
    yield rather than a general population prevalence).
  evidence:
  - reference: PMID:26079385
    reference_title: "Junctophilin 3 (JPH3) expansion mutations causing Huntington disease like 2 (HDL2) are common in South African patients with African ancestry and a Huntington disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      HDL2 is rare, with fewer than 50 pedigrees described worldwide (outside
      of South Africa). JPH3 expansion mutations are found in as few as 1% of
      individuals with clinically or pathologically defined HD without an HTT
      mutation.
    explanation: >-
      Establishes that fewer than 50 HDL2 pedigrees have been described
      worldwide outside South Africa and that JPH3 expansions account for
      about 1% of HTT-negative HD referrals.
- population: South Africa (Black and mixed-ancestry population groups)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 0.25
  rate_high: 2.1
  notes: >-
    In South Africa, minimum combined point prevalence estimates for the
    HD/HDL2 clinical phenotype from molecular diagnostic records are 0.25 per
    100,000 in the Black population and 2.1 per 100,000 in the mixed-ancestry
    population (versus 5.1 per 100,000 in the White population, where all
    genetically confirmed cases had HTT expansions). Among Black and
    mixed-ancestry South African patients referred for HD molecular testing,
    15% (and about 30% of those in whom a genetic diagnosis is established)
    carry a causative JPH3 expansion, making South Africa the highest-burden
    region for HDL2 worldwide.
  evidence:
  - reference: PMID:26079385
    reference_title: "Junctophilin 3 (JPH3) expansion mutations causing Huntington disease like 2 (HDL2) are common in South African patients with African ancestry and a Huntington disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      On the other hand, our findings demonstrate that in South Africa, 15% of
      individuals with black or mixed ancestry referred for HD testing have
      HDL2, by far the highest known rate in the world. JPH3 mutations are the
      cause of a Huntington disease phenotype in South Africa, in about 30% of
      cases in which a genetic diagnosis can be established.
    explanation: >-
      Documents that HDL2 accounts for 15% of all HD testing referrals and
      approximately 30% of genetically confirmed HD-phenotype cases among Black
      and mixed-ancestry South Africans.
  - reference: DOI:10.1159/000444020
    reference_title: "The Frequency of Huntington Disease and Huntington Disease-Like 2 in the South African Population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Based on molecular diagnostic records, minimum estimates of disease
      frequency are: 5.1, 2.1 and 0.25 (per 100,000 individuals) for the
      white, mixed ancestry and black population groups respectively.
    explanation: >-
      Provides minimum combined HD and HDL2 point prevalence estimates per
      100,000 individuals across South African population groups from national
      molecular diagnostic records.

differential_diagnoses:
- name: Huntington disease
  disease_term:
    preferred_term: Huntington disease
    term:
      id: MONDO:0007739
      label: Huntington disease
  description: >-
    Autosomal dominant neurodegenerative disorder caused by a CAG repeat
    expansion in HTT that is clinically indistinguishable from HDL2 in many
    patients, although HDL2 occurs almost exclusively in individuals of
    African ancestry and may show more prominent parkinsonism, smaller
    thalamic volumes on brain MRI volumetry, and occasional acanthocytosis.
  distinguishing_features:
  - Pathogenic CAG repeat expansion in HTT (chromosome 4p) rather than CTG/CAG expansion in JPH3 (chromosome 16q24.3)
  - Occurs across global populations rather than almost exclusively in individuals of African ancestry
  - Relative preservation of thalamic volume compared with HDL2 on brain MRI volumetry
  evidence:
  - reference: PMID:15835282
    reference_title: "Huntington's disease like-2: review and update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The phenotypic similarities between HD and HDL2 suggest that understanding
      the pathobiology of HDL2 may shed new light on the pathogenesis of HD and
      other disorders of striatal neurodegeneration.
    explanation: >-
      Establishes Huntington disease as the primary clinical differential
      diagnosis for HDL2 requiring molecular differentiation.

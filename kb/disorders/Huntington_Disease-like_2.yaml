- reference: PMID:26079385
  title: "Junctophilin 3 (JPH3) expansion mutations causing Huntington disease like 2 (HDL2) are common in South African patients with African ancestry and a Huntington disease phenotype."
  findings:
  - statement: JPH3 expansion mutations account for 15% of South African Black or mixed ancestry HD referrals and share a common African founder haplotype.
    supporting_text: On the other hand, our findings demonstrate that in South Africa, 15% of individuals with black or mixed ancestry referred for HD testing have HDL2, by far the highest known rate in the world.

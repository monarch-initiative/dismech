  biological_scale: ORGANISM
  description: >-
    CBG-bound cortisol is a circulating store that is protected from
    clearance. In people homozygous for a non-binding CBG variant, total
    cortisol given intravenously is cleared faster and distributes into a
    larger volume, while free-cortisol kinetics stay normal. The store that
    would normally buffer and prolong a cortisol pulse is missing.

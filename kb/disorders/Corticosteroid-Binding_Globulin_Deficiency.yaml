genetic:
- name: SERPINA6
  gene_term:
    preferred_term: SERPINA6
    term:
      id: hgnc:1540
      label: SERPINA6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Loss-of-function variants reduce plasma cortisol-binding capacity in a
    gene-dosage manner. The link to the laboratory phenotype is consistent in
    every family; the link to symptoms is incompletely penetrant.
  notes: >-
    Residue numbers in the older literature count from the first residue of
    the mature protein; add 22 for the precursor (HGVS p.) number on UniProt
    P08185. The PDB entries 2VDX, 2VDY, 4BB2,
    4C41 and 4C49 use mature numbering. Population figures are from gnomAD
    v4.1 (exomes and genomes combined), read on 2026-11-26. In gnomAD the gene
    tolerates loss of function (pLI below 0.001; observed/expected
    loss-of-function 0.72, 90% interval 0.50-1.06), which fits a trait with
    little effect on reproductive fitness. No external body has classified
    the gene-disease relationship: ClinGen has no gene-disease validity
    record for SERPINA6 in the export cached in this repository, so
    gene_disease_validity is left unset. AlphaMissense scores for the
    experimentally binding-defective variants are mostly in the likely-benign
    range (L115H 0.16, W393S 0.17, E124G 0.12, R282L 0.30), and only the
    buried secretion-defective I70N (0.72) and P268Q (0.86) are called likely
    pathogenic, so a benign in silico call does not exclude a binding defect
    for this protein.
  evidence:
  - reference: PMID:11502797
    reference_title: "Familial corticosteroid-binding globulin deficiency due to a novel null mutation: association with fatigue and relative hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a 39-member Italian-Australian family with a novel complete loss of function (null) mutation of the corticosteroid-binding globulin gene."
    explanation: Segregation of a null allele with the biochemical phenotype in a large kindred.
  - reference: PMID:25322275
    reference_title: "Naturally occurring mutations of human corticosteroid-binding globulin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Eight naturally occurring CBG mutants with abnormal production and/or function were identified."
    explanation: Among natural missense variants tested, every change in production or steroid binding was a loss; two variants also resisted protease cleavage.
  variants:
  - name: SERPINA6 c.32G>A (p.Trp11Ter)
    synonyms:
    - CBG null
    - CBG Adelaide
    - c.121G>A (original report numbering)
    type: nonsense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000016976
    description: >-
      Stop codon at residue 11 of the 22-residue signal peptide (residue -12
      of the mature protein). No CBG is detectable in homozygotes. gnomAD
      v4.1: 4 alleles in about 1.6 million. ClinVar lists it as pathogenic
      without assertion criteria.
    functional_effects:
    - function: CBG synthesis
      type: loss_of_function
      description: No protein product; half-normal plasma CBG in heterozygotes.
    evidence:
    - reference: PMID:11502797
      reference_title: "Familial corticosteroid-binding globulin deficiency due to a novel null mutation: association with fatigue and relative hypotension."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The novel exon 2 mutation led to a premature termination codon corresponding to residue -12 of the procorticosteroid-binding globulin molecule (c.121G-->A)."
      explanation: Original description of the allele.
  - name: SERPINA6 c.13del (p.Leu5CysfsTer26)
    synonyms:
    - CBG Santiago
    type: frameshift
    variant_type: deletion
    description: >-
      Frameshift at residue 5 of the signal peptide. gnomAD v4.1: 4 alleles,
      all in the Admixed American group.
    functional_effects:
    - function: CBG synthesis
      type: loss_of_function
      description: No protein product; half-normal plasma CBG in heterozygotes.
    evidence:
    - reference: PMID:22013108
      reference_title: "CBG Santiago: a novel CBG mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SERPIN A6 sequencing detected a novel exon 2 single base deletion (c.13delC) leading to a frameshift generating a stop codon within the signal peptide coding region (p.Leu5CysfsX26)"
      explanation: Original description of the allele.
  - name: SERPINA6 c.164_165del (p.Val55GlyfsTer44)
    synonyms:
    - CBG Montevideo
    type: frameshift
    variant_type: deletion
    clinical_significance: LIKELY_PATHOGENIC
    identifiers:
    - ClinVar:VCV001077111
    description: >-
      Two-base deletion in exon 2 that shifts the reading frame at precursor
      residue 55, 13% of the way into the protein. gnomAD v4.1: 21 alleles
      with one homozygote. ClinVar lists it as likely pathogenic without
      assertion criteria.
    functional_effects:
    - function: CBG synthesis
      type: loss_of_function
      description: Predicted complete loss of product; half-normal plasma CBG in heterozygotes.
    evidence:
    - reference: PMID:34308089
      reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A variant in SERPINA6 was found in heterozygous state: NM_001756.3, c.164_165del (p.V55fs, chr14: 94.780.821)"
      explanation: Original description of the allele.
    - reference: PMID:34308089
      reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma CBG levels were reduced approximately 50% in the proband and mother"
      explanation: Biochemical consequence in the two carriers.
  - name: SERPINA6 c.218C>T (p.Ala73Val)
    synonyms:
    - CBG A51V
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Ala51 of the mature protein is fully buried on helix B (relative
      accessibility 0.01 in PDB 2VDY) and packs against Ile48, Leu55, Leu175
      and the reactive-loop hinge. The larger valine side chain is expected
      to disturb this packing. The secreted protein binds cortisol normally.
      gnomAD v4.1: allele frequency 1.3% in East Asian samples, with 9
      homozygotes overall.
    functional_effects:
    - function: CBG secretion
      type: loss_of_function
      description: Severely impaired production or secretion in cell culture; normal steroid binding.
    population_effects:
    - population: Chinese adults (2287 anonymous workers screened in the source study)
      ancestry_basis: NOT_STATED
      comparator_stratum: populations in which SERPINA6 variants that disrupt CBG are considered rare
      effect_differences:
      - ALLELE_FREQUENCY
      cohort_size: 2287
      description: Heterozygous carriers were found at about 1 in 36, far more often than any other function-altering SERPINA6 allele.
      evidence:
      - reference: PMID:22337907
        reference_title: "High frequency of SERPINA6 polymorphisms that reduce plasma corticosteroid-binding globulin activity in Chinese subjects."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The surprisingly high frequency of heterozygous CBG A51V carriers was confirmed in 1011 Chinese men (1:35) and 1031 other women (1:37)."
        explanation: Carrier frequency in the screened Chinese population.
    evidence:
    - reference: PMID:22337907
      reference_title: "High frequency of SERPINA6 polymorphisms that reduce plasma corticosteroid-binding globulin activity in Chinese subjects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When expressed in Chinese hamster ovary cells, CBG A51V bound steroid normally, but its production/secretion was severely impaired"
      explanation: Functional characterization of the recombinant variant.
  - name: SERPINA6 c.344T>A (p.Leu115His)
    synonyms:
    - CBG Leuven
    - Transcortin Leuven
    - L93H
    type: missense
    variant_type: single nucleotide variant
    identifiers:
    - dbSNP:rs113418909
    - ClinVar:VCV000016974
    description: >-
      Leu93 of the mature protein lies on helix D, 13 angstroms from the bound
      steroid, and contacts His89, His91, Phe369 and Thr370. It lowers
      affinity about 3-fold by speeding dissociation. The residue does not
      touch the steroid, and the route by which it acts is not established.
      It is the most common function-altering
      allele in Europeans: gnomAD v4.1 allele frequency 0.25% overall, with 3
      homozygotes. ClinVar classifications conflict.
    functional_effects:
    - function: cortisol binding
      type: partial_loss_of_function
      description: About 3-fold lower affinity for cortisol; concentration not reduced.
    evidence:
    - reference: PMID:8212073
      reference_title: "Decreased cortisol-binding affinity of transcortin Leuven is associated with an amino acid substitution at residue-93."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation is located within exon 2 and alters the codon (CTC) normally associated with Leu-93 in the transcortin polypeptide to a codon (CAC) for histidine in the variant genes."
      explanation: Molecular identification of transcortin Leuven in homozygotes.
    - reference: PMID:7061486
      reference_title: "Transcortin Leuven: a variant of human corticosteroid-binding globulin with decreased cortisol-binding affinity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This lowered affinity is due to an enhanced dissociation rate of the transcortin-cortisol complex."
      explanation: Kinetic basis of the reduced affinity in the original protein-level description.
  - name: SERPINA6 c.371A>G (p.Glu124Gly)
    synonyms:
    - CBG E102G
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Glu102 of the mature protein is surface-exposed and 18 angstroms from
      the steroid in PDB 2VDY. The structural reason for the low binding
      capacity is not known. gnomAD v4.1: allele frequency 0.05% in East
      Asian samples.
    functional_effects:
    - function: cortisol binding
      type: partial_loss_of_function
      description: Produced normally, with abnormally low cortisol-binding capacity.
    evidence:
    - reference: PMID:22337907
      reference_title: "High frequency of SERPINA6 polymorphisms that reduce plasma corticosteroid-binding globulin activity in Chinese subjects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CBG E102G was produced normally, but its cortisol-binding capacity was abnormally low"
      explanation: Functional characterization of the recombinant variant.
  - name: SERPINA6 c.776G>T (p.Gly259Val)
    synonyms:
    - CBG G237V
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Gly237 of the mature protein is 10 angstroms from the steroid and
      immediately precedes Asn238, whose N-glycan is required for steroid
      binding and whose side chain contacts Asp367. A valine here is expected
      to shift the two strands that form part of the pocket. gnomAD v4.1: 12
      alleles, 9 of them South Asian.
    functional_effects:
    - function: cortisol binding
      type: loss_of_function
      description: Immunoreactive CBG present but no measurable cortisol-binding capacity in homozygotes.
    evidence:
    - reference: PMID:20610591
      reference_title: "Novel corticosteroid-binding globulin variant that lacks steroid binding activity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This results in a p.Gly237Val substitution that is predicted to influence the positioning of two β-sheets that constitute part of the CBG steroid-binding site."
      explanation: Original description and the authors' structural interpretation; the residue number is in mature-protein numbering.
  - name: SERPINA6 c.1165G>A (p.Asp389Asn)
    synonyms:
    - CBG Lyon
    - D367N
    type: missense
    variant_type: single nucleotide variant
    identifiers:
    - dbSNP:rs28929488
    - ClinVar:VCV000016975
    description: >-
      Asp367 of the mature protein is buried (relative accessibility 0.02) and
      5.0 angstroms from cortisol in PDB 2VDY. Its carboxylate sits among
      Phe94, Asn238, Phe369, Thr370, Trp371 and Ser372, on the strand that
      carries the pocket residues Phe366, His368 and Trp371. Replacing the
      charged group with an amide is expected to loosen this strand. Reports
      of the size of the defect differ: about 4-fold lower affinity in the
      original report, no measurable binding in a later report from the same
      group, and almost no binding with increased heat sensitivity in an
      independent study in human 293 cells. gnomAD v4.1: allele
      frequency 0.036% overall and 0.7% in Ashkenazi Jewish samples. ClinVar
      classifications conflict.
    functional_effects:
    - function: cortisol binding
      type: partial_loss_of_function
      description: Reduced to absent cortisol binding depending on the assay; plasma concentration low-normal.
    evidence:
    - reference: PMID:10634411
      reference_title: "Novel human corticosteroid-binding globulin variant with low cortisol-binding affinity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sequencing of PCR-amplified exons encoding CBG revealed that the proband was homozygous for a polymorphism (GAC-AAC) in the codon for residue 367, which results in a Asp367-->Asn substitution."
      explanation: Original description of the allele in a homozygote.
    - reference: PMID:20226861
      reference_title: "Effect of mutations of the human serpin protein corticosteroid-binding globulin on cortisol-binding, thermal and protease sensitivity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Certain mutants are almost devoid of cortisol binding activity (Q232R and CBG Lyon), some display higher sensitivity for heat inactivation (G335V, Q232R and CBG Lyon)"
      explanation: Independent recombinant study finding near-complete loss of binding and reduced thermal stability.
  - name: SERPINA6 c.1178G>C (p.Trp393Ser)
    synonyms:
    - CBG Athens
    - W371S
    - c.1282G>C (original report numbering)
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Trp371 of the mature protein is one of the 13 residues in direct contact
      with the steroid (3.6 angstroms from cortisol in PDB 2VDY chain A).
      Replacing the indole with a serine hydroxyl removes a wall of the
      pocket. Found in trans with CBG Lyon in the index patient, who had no
      plasma cortisol-binding activity. The source report gives the change as
      c.1282G>C; c.1178G>C is the same change counted from the start codon of
      Ensembl transcript ENST00000341584 (codon 393, TGG to TCG).
    functional_effects:
    - function: cortisol binding
      type: loss_of_function
      description: No measurable cortisol binding by the recombinant protein.
    evidence:
    - reference: PMID:22948765
      reference_title: "Two different corticosteroid-binding globulin variants that lack cortisol-binding activity in a greek woman."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel heterozygous c.1282G>C transversion in exon 5 of SERPINA6, resulting in a p.Trp393Ser (W371S) substitution, was identified in the proband"
      explanation: Original description of the allele.
  - name: SERPINA6 c.845G>T (p.Arg282Leu)
    synonyms:
    - CBG R260L
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Arg260 of the mature protein contacts the steroid directly (3.9
      angstroms from cortisol in PDB 2VDY, 3.2 angstroms from progesterone in
      4BB2) and lies next to Asp23. Identified from sequence databases and
      tested as recombinant protein; no affected family has been described.
      The source names only the protein change; c.845G>T is the single-base
      change that produces it in Ensembl transcript ENST00000341584 (codon
      282, CGG to CTG).
    functional_effects:
    - function: cortisol binding
      type: loss_of_function
      description: Undetectable cortisol-binding affinity.
    evidence:
    - reference: PMID:25322275
      reference_title: "Naturally occurring mutations of human corticosteroid-binding globulin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cortisol-binding affinity was markedly reduced for CBG H14Q and CBG H89Y, moderately decreased for CBG I279F, and undetectable for CBG R260L."
      explanation: Functional characterization of the recombinant variant.
diagnosis:
- name: Total and free cortisol measured together
  description: >-
    A low total cortisol with a normal free serum or salivary cortisol and a
    normal ACTH points to a binding-protein defect and away from adrenal or
    pituitary failure.
  measurements:
  - preferred_term: serum total cortisol
    term:
      id: LOINC:2143-6
      label: Cortisol [Mass/volume] in Serum or Plasma
  - preferred_term: salivary cortisol
    term:
      id: LOINC:2142-8
      label: Cortisol [Mass/volume] in Saliva (oral fluid)
  evidence:
  - reference: PMID:11502797
    reference_title: "Familial corticosteroid-binding globulin deficiency due to a novel null mutation: association with fatigue and relative hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal corticosteroid-binding globulin concentrations or binding affinity may lead to the misdiagnosis of isolated ACTH deficiency."
    explanation: States the diagnostic pitfall that paired measurement avoids.
  - reference: PMID:29194043
    reference_title: "The role of corticosteroid-binding globulin in the evaluation of adrenal insufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "total cortisol levels might not be the ideal way to assess adrenal function in all clinical circumstances"
    explanation: Review of why total cortisol misleads when CBG concentration or affinity is abnormal, including SERPINA6 variants.
- name: CBG concentration with cortisol-binding capacity
  description: >-
    An immunoassay gives the CBG concentration; a cortisol-binding capacity
    assay shows whether that CBG binds steroid. Both are needed, because
    binding-defective variants can have a normal immunoassay result.
  evidence:
  - reference: PMID:22948765
    reference_title: "Two different corticosteroid-binding globulin variants that lack cortisol-binding activity in a greek woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyses of CBG levels in this pedigree illustrate how immunoassays fail to accurately reflect cortisol-binding activity."
    explanation: A pedigree in which immunoassay and binding capacity disagree.
- name: SERPINA6 sequencing
  description: Sequencing of the SERPINA6 coding exons confirms the diagnosis and identifies the allele class.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40365551
    reference_title: "Corticosteroid-binding Globulin Dysfunction Due to Homozygous SERPINA6 Lyon Variant in a Pediatric Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CBG deficiency or dysfunction should be considered in patients with unexplained adrenal insufficiency."
    explanation: Gene-panel sequencing found homozygous CBG Lyon in a child first diagnosed with primary adrenal insufficiency; he stayed on hydrocortisone, and two homozygous siblings needed none.
differential_diagnoses:
- name: Secondary adrenal insufficiency (isolated ACTH deficiency)
  description: >-
    Also gives low total cortisol without raised ACTH. In CBG deficiency free
    and salivary cortisol are normal and CBG or cortisol-binding capacity is
    low.
  distinguishing_features:
  - Normal free serum or salivary cortisol in CBG deficiency
  - Low CBG concentration or cortisol-binding capacity in CBG deficiency
  evidence:
  - reference: PMID:22013108
    reference_title: "CBG Santiago: a novel CBG mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with low CBG levels may be misdiagnosed as having secondary hypocortisolism."
    explanation: Names the condition CBG deficiency is mistaken for.
treatments:
- name: Hydrocortisone Replacement
  description: >-
    Not an established treatment; three single-family reports disagree.
    Hydrocortisone did not relieve fatigue in the Santiago kindred. It was
    reported as effective, together with frequent meals, for the hypoglycemia
    of the Montevideo proband. A Lyon homozygote with a low stimulated
    salivary cortisol had symptoms when he stopped hydrocortisone that
    resolved on restarting, while his two homozygous siblings were not
    treated. Because total cortisol is low when free cortisol is normal,
    replacement started on a total cortisol result alone may be unnecessary.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  evidence:
  - reference: PMID:22013108
    reference_title: "CBG Santiago: a novel CBG mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Exogenous hydrocortisone had no effect on the fatigue."
    explanation: Hydrocortisone did not improve fatigue in a child with a truncating allele.
  - reference: PMID:34308089
    reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydrocortisone treatment and regular frequent meals in the proband were effective in this case."
    explanation: Reported benefit for hypoglycemic episodes in one child; hydrocortisone and frequent meals were given together, so their effects cannot be separated.
  - reference: PMID:40365551
    reference_title: "Corticosteroid-binding Globulin Dysfunction Due to Homozygous SERPINA6 Lyon Variant in a Pediatric Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "experienced symptoms of adrenal insufficiency (headache, decreased energy, nausea, abdominal pain), which resolved after restarting hydrocortisone"
    explanation: Symptoms returned off treatment and resolved on it in one Lyon homozygote; the authors could not separate the effect on growth from constitutional delay of growth and puberty.
animal_models:
- name: Cbg knockout mouse (Petersen 2006)
  species: Mouse
  genotype: Serpina6 -/-
  genes:
  - preferred_term: Serpina6
    term:
      id: MGI:88278
      label: Serpina6
  description: >-
    Targeted deletion of the mouse CBG gene. Serum has no corticosterone
    binding activity. The mice show reduced activity described as fatigue and
    an aggravated response to septic shock.
  publication: PMID:16980625
  modeled_mechanisms:
  - target: Reduced Plasma Cortisol-Binding Capacity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Complete loss of serum glucocorticoid binding, as in human null homozygotes.
    limitations: >-
      The mouse glucocorticoid is corticosterone. This study found free
      corticosterone about 10-fold raised at rest, whereas affected people
      and a second mouse line have normal resting free glucocorticoid.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mice circulate corticosterone, not cortisol, and the resting free
        corticosterone in this line was reported as about 10-fold raised,
        which is not seen in human CBG deficiency.
    evidence:
    - reference: PMID:16980625
      reference_title: "Hyporesponsiveness to glucocorticoids in mice genetically deficient for the corticosteroid binding globulin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The absence of CBG resulted in a lack of corticosterone binding activity in serum and in an approximately 10-fold increase in free corticosterone levels in CBG-null mice"
      explanation: Shows the loss of binding activity and the raised free corticosterone that differs from the human picture.
  - target: Loss of Targeted Cortisol Delivery to Tissues
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mice responded poorly to glucocorticoid although free corticosterone
      was raised, which the authors read as loss of a delivery function.
    limitations: >-
      Glucocorticoid hyporesponsiveness is an indirect readout of delivery,
      and the protease-triggered release step studied in human CBG may not
      operate the same way in rodents.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Rat CBG does not undergo the stressed-to-relaxed transition after
        cleavage of its reactive centre loop, so rodent CBG cannot be assumed
        to release steroid by the mechanism described for the human protein.
        The finding is for rat; mouse CBG has not been tested in this way.
      evidence:
      - reference: PMID:23300763
        reference_title: "Corticosteroid-binding globulin: structure-function implications from species differences."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "rat CBG fails to undergo an S-to-R transition upon proteolytic cleavage of the RCL hinting that the S-to-R transition observed in human CBG is not a prerequisite for CBG function in rat"
        explanation: Direct biophysical evidence for the species difference in the cleavage-triggered conformational change.
    evidence:
    - reference: PMID:16980625
      reference_title: "Hyporesponsiveness to glucocorticoids in mice genetically deficient for the corticosteroid binding globulin."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "our data suggest an active role for CBG in bioavailability, local delivery, and/or cellular signal transduction of glucocorticoids that extends beyond a function as a mere cargo transporter"
      explanation: The authors' interpretation of the hyporesponsive phenotype as a delivery function.
- name: Cbg knockout mouse (Richard 2010)
  species: Mouse
  genotype: Serpina6 -/- and Serpina6 +/-
  genes:
  - preferred_term: Serpina6
    term:
      id: MGI:88278
      label: Serpina6
  description: >-
    Independent transcortin-deficient line studied with partial and total
    deficiency. Total corticosterone is markedly reduced, free corticosterone
    is normal at rest, and the free corticosterone rise after stress is
    reduced, with increased immobility and learned helplessness.
  publication: PMID:20022933
  modeled_mechanisms:
  - target: Low Total Cortisol with Preserved Free Cortisol
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces low total with normal resting free glucocorticoid.
    limitations: Corticosterone in the mouse stands in for cortisol in humans.
    evidence:
    - reference: PMID:20022933
      reference_title: "Plasma transcortin influences endocrine and behavioral stress responses in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that CBG deficiency in mice results in markedly reduced total circulating corticosterone at rest and in response to stress."
      explanation: Low total glucocorticoid in the deficient mice.
  - target: Blunted Stress-Evoked Free Glucocorticoid Rise
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse is where this mechanism was observed; whether it occurs in
      affected people is the open question.
    limitations: >-
      Demonstrated in mice only. The few human reports that measured a stress
      or ACTH response found a low free cortisol rise in one patient and a
      normal or high one in others.
    evidence:
    - reference: PMID:20022933
      reference_title: "Plasma transcortin influences endocrine and behavioral stress responses in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "free corticosterone concentrations are normal at rest but present a reduced surge after stress in transcortin-deficient mice"
      explanation: The measurement that defines the mechanism.
discussions:
- discussion_id: cbg_symptoms_with_normal_free_cortisol
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If free cortisol and ACTH are normal in CBG deficiency, by what mechanism,
    if any, do SERPINA6 loss-of-function variants cause fatigue, pain and low
    blood pressure?
  rationale: >-
    The laboratory phenotype is fully explained by loss of binding capacity.
    The symptoms are not. Four explanations are on record (a lost reservoir
    with a blunted stress rise, lost tissue delivery, altered pulsatility,
    and ascertainment). Symptoms have been surveyed in carriers found by
    genotype, but the stress response of free cortisol has not: it has been
    measured only in individual patients, with a low rise in one and a normal
    or high rise in others. Alleles
    common enough to study exist: A51V in East Asia, Leuven in Europe, Lyon in
    Ashkenazi Jewish populations.
  attaches_to:
  - phenotypes#Chronic Fatigue
  - phenotypes#Chronic Pain
  - phenotypes#Relative Hypotension
  - pathophysiology#Blunted Stress-Evoked Free Glucocorticoid Rise
  - pathophysiology#Loss of Targeted Cortisol Delivery to Tissues
  proposed_experiments:
  - experiment_id: cbg_genotype_first_stress_response
    name: Genotype-first recall study of stress-evoked free cortisol in SERPINA6 carriers
    experiment_design: HUMAN_OBSERVATIONAL
    description: >-
      Recall carriers of A51V, Leuven or Lyon from a population cohort by
      genotype, with matched non-carriers, and measure salivary free cortisol
      before and after a standardised psychosocial or exercise stressor,
      together with validated fatigue and pain scales and ambulatory blood
      pressure, all assessed without knowledge of genotype.
    would_support:
    - mechanistic_hypotheses#cbg_reservoir_blunted_stress_surge
    would_refute:
    - mechanistic_hypotheses#cbg_reservoir_blunted_stress_surge
    supporting_outcome:
    - A smaller stress-evoked rise in salivary free cortisol in carriers, scaling with allele dose and with fatigue score.
    refuting_outcome:
    - A normal or larger stress-evoked rise in carriers, or no excess of fatigue, pain or low blood pressure in carriers found by genotype.
  evidence:
  - reference: PMID:17547679
    reference_title: "Corticosteroid-binding globulin gene polymorphisms: clinical implications and links to idiopathic chronic fatigue disorders."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A mechanism for the effect of CBG mutations on fatigue is not readily apparent because free cortisol levels are normal, although we speculate that CBG may have an effect on cortisol-brain transport."
    explanation: States the gap directly.
- discussion_id: cbg_lyon_binding_defect_magnitude
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does CBG Lyon (p.Asp389Asn) retain about a quarter of normal cortisol
    affinity, or does it not bind cortisol at all?
  rationale: >-
    Three recombinant studies disagree: about 4-fold lower affinity in
    Chinese hamster ovary cells in the original report, no measurable binding
    in a later study from the same group, and almost no binding with
    increased heat sensitivity in human 293 cells. The answer changes whether
    Lyon heterozygotes should be read as mildly or substantially deficient.
    The buried position of Asp367 next to the glycosylated Asn238 suggests
    the result may depend on temperature and on the glycoform made by the
    expression system, but this has not been tested.
  attaches_to:
  - pathophysiology#SERPINA6 Steroid-Binding-Defective Missense Alleles
  evidence:
  - reference: PMID:10634411
    reference_title: "Novel human corticosteroid-binding globulin variant with low cortisol-binding affinity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Scatchard analysis demonstrated that the Asn367 substitution reduced the affinity of human CBG for cortisol by approximately 4-fold"
    explanation: The partial-defect result.
  - reference: PMID:22948765
    reference_title: "Two different corticosteroid-binding globulin variants that lack cortisol-binding activity in a greek woman."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant CBG D367N and CBG W371S had no measureable cortisol-binding activity."
    explanation: The complete-defect result.
notes: >-
  No GeneReviews chapter covers corticosteroid-binding globulin deficiency or
  SERPINA6; phenotypes were taken from the primary family reports and one
  population survey. Structural statements in this entry (distances to the
  steroid, residue contacts, relative solvent accessibility) were computed
  for this entry with Biopython from chain A of the crystal structures of
  reactive-loop-cleaved human CBG named in each statement; no structure of
  intact human CBG without engineered substitutions is available, and the
  signal peptide and reactive centre loop are low-confidence regions of the
  AlphaFold model (mean pLDDT 32 and 50). The common coding polymorphism
  p.Ser246Ala (gnomAD v4.1 allele frequency 0.48), written A224S or Ala-Ser224
  in some papers with reference and alternate alleles swapped, does not change
  cortisol binding and is not a disease allele; R64Q and R64W (p.Arg86) were
  also produced and bound cortisol normally. Obesity was noted in early reports of complete deficiency but has not been
  examined systematically and is not listed as a phenotype.

- name: Loss of Targeted Cortisol Delivery to Tissues
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Proposed alternative link to symptoms. CBG releases cortisol where its
    reactive centre loop is cleaved by neutrophil elastase, and has been
    proposed to direct cortisol to particular tissues such as inflamed sites,
    liver and brain. If so, loss of CBG would lower local cortisol exposure
    without changing circulating free cortisol. The release mechanism is
    established in vitro; a resulting tissue deficit in people with CBG
    deficiency has not been measured.

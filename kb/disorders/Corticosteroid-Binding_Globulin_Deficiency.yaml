  evidence:
  - reference: PMID:20610591
    reference_title: "Novel corticosteroid-binding globulin variant that lacks steroid binding activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed very low baseline and stimulated total serum cortisol levels but normal free serum and salivary cortisol and plasma ACTH"

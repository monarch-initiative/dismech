    explanation: Source of the experimental structures on which the variant placement is based.
  - reference: PMID:18513745
    reference_title: "The S-to-R transition of corticosteroid-binding globulin and the mechanism of hormone release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A connecting loop of helix D, which is in a helix-like conformation in native CBG, unwinds and grossly perturbs the hormone binding site following beta-sheet expansion in the cCBG structure"
    explanation: Shows that the helix D region couples the reactive centre loop to the steroid site, which is the published role of this region in the normal protein; whether the helix D alleles Leuven and H89Y act through it is not shown.
  - reference: PMID:19643161

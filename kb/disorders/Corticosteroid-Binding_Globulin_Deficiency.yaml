  mechanism_confidence: HYPOTHETICAL
  description: >-
    Proposed link between the biochemical defect and symptoms: without a
    CBG-bound store, free glucocorticoid is normal at rest but rises less
    during stress, so tissues including the brain are under-exposed when
    demand is highest. The evidence is from Cbg knockout mice. Human data are
    limited to single patients and point both ways, and loss of the store
    alone would not be expected to lower the free rise (see the hypothesis
    record), so this node and the edges entering and leaving it are a
    hypothesis, not an established mechanism.

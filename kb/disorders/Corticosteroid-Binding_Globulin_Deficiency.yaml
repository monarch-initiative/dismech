mechanistic_hypotheses:
- hypothesis_group_id: cbg_reservoir_blunted_stress_surge
  hypothesis_label: Loss of the CBG-bound reservoir blunts the stress rise in free glucocorticoid
  status: ALTERNATIVE
  description: >-
    Resting free cortisol is normal, but without the CBG-bound store free
    hormone is proposed to rise less during stress, producing intermittent
    tissue under-exposure and symptoms such as fatigue. The lost store is
    shown in people, and two mouse knockout studies measured a smaller free
    corticosterone rise after stress. The link between the two is not
    established. In people without functional CBG only total cortisol is
    cleared faster; free-cortisol kinetics are normal. If free hormone alone
    is cleared, losing the buffer should make a stress pulse of free cortisol
    higher and shorter with the same total exposure, not smaller, so the mouse
    finding needs a further factor such as lower adrenal output. The one
    stress test in a human carrier showed a high salivary cortisol response.
  notes: >-
    The mass-balance argument was examined in a provider hypothesis run and
    re-derived in its assessment
    (kb/hypotheses/Corticosteroid-Binding_Globulin_Deficiency/cbg_reservoir_blunted_stress_surge/);
    that run is a simulation with assumed parameters and is not cited as
    evidence here.
  evidence:
  - reference: PMID:21054475
    reference_title: "Corticosteroid-binding globulin regulates cortisol pharmacokinetics."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "When CBG binding is disrupted, FreeF retains normal PK characteristics, although CBG null patients lack a CBG-bound pool of readily releasable cortisol."
    explanation: Human evidence for the first half of the hypothesis (the lost store), not for the blunted rise or for symptoms.
  - reference: PMID:21054475
    reference_title: "Corticosteroid-binding globulin regulates cortisol pharmacokinetics."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "PK parameters for FreeF and the salivary biomarkers were not different between the CBG null and HV"
    explanation: Free cortisol given as hydrocortisone was handled normally by people without functional CBG, which argues against faster clearance of free hormone as the cause of a blunted rise.
  - reference: PMID:31570737
    reference_title: "Corticosteroid-Binding Globulin is expressed in the adrenal gland and its absence impairs corticosterone synthesis and secretion in a sex-dependent manner."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "CBG-deficiency reduced the expression of ACTH receptor, SRB1 and the main genes involved in the adrenal hormones synthesis"
    explanation: Reduced adrenal steroidogenic gene expression in knockout mice is a candidate for the further factor a blunted free rise would need; secretion rate itself was not measured.
  - reference: PMID:22930537
    reference_title: "Critical role of plasma corticosteroid-binding-globulin during stress to promote glucocorticoid delivery to the brain: impact on memory retrieval."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, our data suggest that the impact of CBG genetic deficiency on various behavioral patterns reported previously stems from a smaller CORT reservoir in blood."
    explanation: The mouse study that states the reservoir hypothesis.
  - reference: PMID:30904918
    reference_title: "Corticosteroid-Binding Globulin Deficiency Specifically Impairs Contextual and Recognition Memory Consolidation in Male Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data indicate that circulating but not brain CBG influences contextual and recognition long-term memory in relation with glucocorticoid levels."
    explanation: Mice lacking CBG only in brain were unaffected, which places the relevant pool in the circulation as the reservoir hypothesis requires.
- hypothesis_group_id: cbg_targeted_tissue_delivery
  hypothesis_label: CBG delivers cortisol to specific tissues, and that delivery is lost
  status: ALTERNATIVE
  description: >-
    CBG is proposed to carry cortisol to sites of protease activity and to
    liver and brain, so that its loss causes local deficiency with normal
    circulating free cortisol.
  evidence:
  - reference: PMID:34308089
    reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "provides further evidence of a phenotype whose pathophysiology is not yet understood but may represent a selective tissue deficiency of cortisol"
    explanation: Statement of the tissue-deficiency hypothesis by the authors of the Montevideo report, who also say the pathophysiology is not understood.
- hypothesis_group_id: cbg_altered_cortisol_pulsatility
  hypothesis_label: Altered ultradian cortisol pulsatility
  status: ALTERNATIVE
  description: >-
    Without CBG buffering, the pattern of cortisol pulses reaching tissues
    changes, and pulse pattern rather than mean free cortisol determines
    glucocorticoid signalling. Rests on one symptomatic patient. A related
    proposal is that unbuffered pulses are taller and briefer, and that such
    pulses give less receptor occupancy for the same exposure; this has not
    been tested, and the available animal experiment compares constant with
    pulsatile delivery, not sharp with smooth pulses.
  evidence:
  - reference: PMID:20610591
    reference_title: "Novel corticosteroid-binding globulin variant that lacks steroid binding activity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only biochemical feature to distinguish the symptomatic subject was increased cortisol pulsatility, and we suggest that this may influence glucocorticoid signaling and contribute to symptoms previously associated with CBG deficiency."
    explanation: Of three G237V homozygotes only the symptomatic one had increased pulse frequency.
  - reference: PMID:34375333
    reference_title: "Corticosterone pattern-dependent glucocorticoid receptor binding and transcriptional regulation within the liver."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "despite the same overall amount of corticosterone infused, twice the number of transcripts were regulated by constant corticosterone infusion, when compared to pulsatile"
    explanation: In adrenalectomised rats the pattern of corticosterone delivery changed liver gene regulation at equal dose, so pattern can matter; it does not test the pattern change expected in CBG deficiency.
- hypothesis_group_id: cbg_symptoms_ascertainment
  hypothesis_label: Symptoms reflect ascertainment and CBG deficiency is clinically benign
  status: ALTERNATIVE
  description: >-
    Index cases were tested because they had fatigue or low cortisol, so the
    association with symptoms may be an artefact of how families were found.
    A screening study of pregnant carriers of the common A51V allele, and the
    first homozygotes described, reported no symptoms. Against this, the same
    screening study found a female-skewed sex ratio in newborns of carrier
    mothers, and a survey blind to genotype found more chronic pain in
    carriers.
  evidence:
  - reference: PMID:17547679
    reference_title: "Corticosteroid-binding globulin gene polymorphisms: clinical implications and links to idiopathic chronic fatigue disorders."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The limited numbers of reports raise the possibility of ascertainment bias as many cases presented with features suggesting cortisol deficiency."
    explanation: Reviewers close to the original families name ascertainment bias as an open possibility.
  - reference: PMID:19643166
    reference_title: "Corticosteroid-binding globulin: the clinical significance of altered levels and heritable mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "One community-based study revealed that severe CBG mutations are rare in idiopathic fatigue disorders."
    explanation: Looking from the symptom side, people with unexplained fatigue rarely carry severe SERPINA6 alleles.
  - reference: PMID:25695888
    reference_title: "Impact of corticosteroid-binding globulin deficiency on pregnancy and neonatal sex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A51V mothers did not differ from controls in body mass index, gestational age at delivery, duration of parturition, blood pressure, gravidity, infant birth weight and size, or placental weights, and reported no unusual clinical symptoms."
    explanation: Carriers found by genotype-first screening in pregnancy had normal blood pressure and no reported symptoms.
  - reference: PMID:25695888
    reference_title: "Impact of corticosteroid-binding globulin deficiency on pregnancy and neonatal sex."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The female-skewed SSR suggests that male fetal survival is compromised in CBG-deficient mothers."
    explanation: The same screening study found fewer male newborns to carrier mothers, an effect that would not be expected if the deficiency were entirely benign.
  - reference: PMID:21795453
    reference_title: "Clinical manifestations of highly prevalent corticosteroid-binding globulin mutations in a village in southern Italy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of either mutation conferred a propensity to chronic pain."
    explanation: In a village survey that examined residents before genotyping, the authors concluded carriers were prone to chronic pain; the abstract gives no pain rate for non-carriers, so this is weak evidence against ascertainment.

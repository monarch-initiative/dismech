inheritance:
- name: Semidominant inheritance
  description: >-
    The biochemical trait follows gene dosage. Heterozygotes for a null allele
    have about half the normal plasma CBG and intermediate total cortisol, and
    homozygotes or compound heterozygotes have undetectable CBG or
    cortisol-binding activity and very low total cortisol. The earliest family
    study already described this as codominant or recessive, and Orphanet
    lists the inheritance as semi-dominant. Clinical symptoms
    do not follow the genotype as closely: they are reported in heterozygotes
    and homozygotes alike and are absent in many carriers, so penetrance for
    symptoms is incomplete.
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:6499234
    reference_title: "Total deficiency of corticosteroid-binding globulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents and a brother were found to have half the normal levels. This study indicates that CBG deficiency, a benign condition, is compatible with a codominant or recessive autosomal trait inheritance."
    explanation: First family with complete CBG deficiency; obligate heterozygotes had half-normal CBG, which is the gene-dosage pattern.
  - reference: PMID:11502797
    reference_title: "Familial corticosteroid-binding globulin deficiency due to a novel null mutation: association with fatigue and relative hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma immunoreactive corticosteroid-binding globulin was undetectable in null homozygotes, and mean corticosteroid-binding globulin levels were reduced by approximately 50% at 18.7 +/- 1.3 microg/ml (reference range, 30-52 microg/ml) in null heterozygotes"
    explanation: In a 39-member kindred, null homozygotes had no CBG and heterozygotes about half, confirming semidominance of the biochemical trait.
  - reference: PMID:22013108
    reference_title: "CBG Santiago: a novel CBG mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only four mutations have been described, often in association with fatigue and chronic pain, albeit with incomplete penetrance"
    explanation: States that the clinical features are incompletely penetrant.

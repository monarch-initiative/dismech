pathophysiology:
- name: SERPINA6 Null and Truncating Alleles
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Stop and frameshift alleles that end translation in or shortly after the
    22-residue signal-peptide region, so that no CBG polypeptide is produced
    from the allele. Three are reported: p.Trp11Ter (CBG null, also called Adelaide),
    p.Leu5CysfsTer26 (Santiago) and p.Val55GlyfsTer44 (Montevideo).
    The first two stop within the signal peptide; Montevideo shifts the frame
    at codon 55 and terminates at codon 98. Heterozygotes have about half the
    normal plasma CBG, and homozygotes for p.Trp11Ter have none. Transcript
    levels have not been measured for any of the three.
  genes:
  - preferred_term: SERPINA6
    term:
      id: hgnc:1540
      label: SERPINA6
  genetic_context:
    gene:
      preferred_term: SERPINA6
      term:
        id: hgnc:1540
        label: SERPINA6
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Complete loss of product from the allele; semidominant effect on plasma
      CBG concentration.
  downstream:
  - target: Reduced Hepatic CBG Secretion
    causal_link_type: DIRECT
    description: An allele that makes no CBG polypeptide removes its share of hepatic output.
    evidence:
    - reference: PMID:34308089
      reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the present study, CBG concentration was reduced by approximately 50% in heterozygous family members, similar to that previously observed for other null SERPINA6 pathogenic genetic variants"
      explanation: Links a heterozygous null allele to a half-normal circulating CBG concentration across the reported null alleles.
  evidence:
  - reference: PMID:11502797
    reference_title: "Familial corticosteroid-binding globulin deficiency due to a novel null mutation: association with fatigue and relative hypotension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel exon 2 mutation led to a premature termination codon corresponding to residue -12 of the procorticosteroid-binding globulin molecule (c.121G-->A)."
    explanation: Defines the null allele as a stop codon inside the signal peptide (residue -12 of the precursor, p.Trp11Ter in current nomenclature).
  - reference: PMID:22013108
    reference_title: "CBG Santiago: a novel CBG mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a frameshift generating a stop codon within the signal peptide coding region (p.Leu5CysfsX26) and 50% reduced CBG levels in heterozygotes"
    explanation: Second truncating allele in the signal peptide, with the same half-normal CBG in heterozygotes.
  - reference: PMID:34308089
    reference_title: "CBG Montevideo: A Clinically Novel SERPINA6 Mutation Leading to Haploinsufficiency of Corticosteroid-binding Globulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 2 base-pair deletion leading to a frameshift and a premature stop codon with a 50% reduction in plasma CBG levels in heterozygotes"
    explanation: Third truncating allele (Montevideo), again with half-normal CBG in heterozygotes.
- name: SERPINA6 Secretion-Defective Missense Alleles
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Missense alleles whose product binds cortisol normally, or was not tested
    for binding, but is poorly produced or secreted by cells. A51V
    (p.Ala73Val), I48N (p.Ile70Asn) and P246Q (p.Pro268Gln) belong here. All
    three residues are fully buried in the crystal structures (relative
    side-chain accessibility 0.00 to 0.03 in PDB 2VDY chain A, computed for
    this entry). Ile48 and Ala51 lie on helix B and pack against the hinge of
    the reactive centre loop where it inserts into beta-sheet A, the region
    called the shutter in other serpins. In a global alignment with
    alpha-1-antitrypsin (44% identity) they correspond to antitrypsin Ile57
    and Ala60, on the same helix as the antitrypsin retention alleles Siiyama
    (Ser53Phe) and Mmalton (Phe52 deletion). A folding defect with retention
    in the hepatocyte is therefore the likely mechanism, but intracellular
    retention or polymer formation has not been shown for CBG itself.
  genes:
  - preferred_term: SERPINA6
    term:
      id: hgnc:1540
      label: SERPINA6
  genetic_context:
    gene:
      preferred_term: SERPINA6
      term:
        id: hgnc:1540
        label: SERPINA6
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of secreted protein from the allele; the secreted fraction of A51V
      retains normal steroid binding.
  downstream:
  - target: Reduced Hepatic CBG Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22337907
      reference_title: "High frequency of SERPINA6 polymorphisms that reduce plasma corticosteroid-binding globulin activity in Chinese subjects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Defects in CBG A51V production explain why plasma CBG levels in individuals heterozygous for this variant are approximately 50% lower than normal."
      explanation: Ties the cell-culture secretion defect to the half-normal plasma CBG of heterozygous carriers.
  evidence:
  - reference: PMID:22337907
    reference_title: "High frequency of SERPINA6 polymorphisms that reduce plasma corticosteroid-binding globulin activity in Chinese subjects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When expressed in Chinese hamster ovary cells, CBG A51V bound steroid normally, but its production/secretion was severely impaired"
    explanation: Recombinant A51V separates a secretion defect from intact steroid binding.
  - reference: PMID:25322275
    reference_title: "Naturally occurring mutations of human corticosteroid-binding globulin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Comparison of CBG levels in cell extracts and media by Western blotting revealed that CBG I48N and CBG P246Q have secretion defects."
    explanation: Two further naturally occurring missense variants with a secretion defect in cell culture.
- name: SERPINA6 Steroid-Binding-Defective Missense Alleles
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Missense alleles whose product is secreted but binds cortisol with reduced
    affinity or not at all. Residue numbers in this literature, and in the
    crystal structures, count from the first residue of the mature protein;
    the precursor (HGVS) number is 22 higher. Distances below were computed
    for this entry from PDB 2VDY chain A (cleaved human CBG with cortisol).
    Two alleles change residues that touch the steroid: W371S (p.Trp393Ser,
    Athens; 3.6 angstroms from cortisol) and R260L (p.Arg282Leu; 3.9
    angstroms), and both abolish binding. D367N (p.Asp389Asn, Lyon) replaces a
    buried aspartate (accessibility 0.02) 5.0 angstroms from the steroid that
    contacts Phe369, Thr370, Trp371 and Asn238, on the strand that carries the
    pocket residues Phe366, His368 and Trp371. G237V (p.Gly259Val) lies 10
    angstroms from the steroid, next to the glycosylated Asn238 whose glycan
    is needed for binding. L93H (p.Leu115His, Leuven) and H89Y (p.His111Tyr)
    lie on helix D, 13 angstroms from the steroid; Leu93 contacts Phe369 and
    Thr370 of the same pocket-bearing strand. In the normal protein the helix D
    region couples the reactive centre loop to the binding site, and that
    contact is a possible route for these two alleles, but how either lowers
    binding has not been shown. E102G (p.Glu124Gly) is surface-exposed and 18 angstroms
    away; why it lowers binding capacity is unexplained.
  genes:
  - preferred_term: SERPINA6
    term:
      id: hgnc:1540
      label: SERPINA6
  genetic_context:
    gene:
      preferred_term: SERPINA6
      term:
        id: hgnc:1540
        label: SERPINA6
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Ranges from partial loss (Leuven, about 3-fold lower affinity) to
      complete loss of steroid binding (G237V, W371S, R260L).
  downstream:
  - target: Loss of CBG Cortisol Binding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22948765
      reference_title: "Two different corticosteroid-binding globulin variants that lack cortisol-binding activity in a greek woman."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Recombinant CBG D367N and CBG W371S had no measureable cortisol-binding activity."
      explanation: Recombinant protein carrying either substitution alone lacks cortisol binding, so the substitution is sufficient for the defect.
  evidence:
  - reference: PMID:1504007
    reference_title: "A Leu----His substitution at residue 93 in human corticosteroid binding globulin results in reduced affinity for cortisol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the His93 mutation (Kd = 2.24 +/- 1.75 nM) reduced the cortisol binding affinity of CBG (mean +/- SD) significantly (P less than 0.024) when compared to normal CBG (Kd = 0.64 +/- 0.31 nM)"
    explanation: Recombinant Leuven (L93H) protein has roughly 3.5-fold lower affinity for cortisol.
  - reference: PMID:10634411
    reference_title: "Novel human corticosteroid-binding globulin variant with low cortisol-binding affinity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Scatchard analysis demonstrated that the Asn367 substitution reduced the affinity of human CBG for cortisol by approximately 4-fold"
    explanation: Recombinant Lyon (D367N) protein has reduced affinity in this expression system.
  - reference: PMID:20610591
    reference_title: "Novel corticosteroid-binding globulin variant that lacks steroid binding activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals homozygous for the variant had serum CBG levels below the reference range when measured by RIA, but CBG was unmeasurable in cortisol-binding capacity assays."
    explanation: G237V homozygotes have immunoreactive CBG that does not bind cortisol.
  - reference: PMID:25322275
    reference_title: "Naturally occurring mutations of human corticosteroid-binding globulin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cortisol-binding affinity was markedly reduced for CBG H14Q and CBG H89Y, moderately decreased for CBG I279F, and undetectable for CBG R260L."
    explanation: Systematic recombinant testing identifies further binding-defective natural variants.

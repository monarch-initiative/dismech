- name: Loss of CBG Cortisol Binding
  biological_scale: MOLECULAR
  description: >-
    The normal function of CBG is to bind one molecule of cortisol (or
    progesterone) with nanomolar affinity in a surface pocket formed by
    residues Ala18, Ser19, Val22, Gln232, Thr240, Phe242, Arg260, Ile263,
    Asn264, Ser267, Phe366, His368 and Trp371 of the mature protein (the 13
    residues within 4 angstroms of cortisol in both PDB 2VDY and 4C49,
    computed for this entry). CBG has the serpin fold but does not inhibit
    proteases. Its reactive centre loop is a substrate for neutrophil
    elastase, and loop cleavage or partial loop insertion into beta-sheet A
    lowers steroid affinity through helix D. Binding-defective alleles remove
    or weaken this high-affinity site in the secreted protein.
  molecular_functions:
  - preferred_term: cortisol binding
    term:
      id: GO:1903794
      label: cortisol binding
    modifier: DECREASED

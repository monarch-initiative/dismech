  - target: Ovarian tissue in an individual with a 46,XY karyotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      De-repression of the ovarian programme in an XY gonad is the proposed
      route to histologically normal ovarian tissue rather than a streak gonad.
      Recorded as indirect with unknown intermediates because no study has
      measured ovarian-determinant expression in the index patient's gonad.
    hypothesis_groups:
    - cbx2_ovarian_derepression_model
  evidence:
  - reference: PMID:31719618
    reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CBX2.1 directly inhibits WNT4 and PBX1 and indirectly inhibits the expression of FOXL2"
    explanation: >-
      Names the ovarian-pathway genes CBX2.1 represses and distinguishes the

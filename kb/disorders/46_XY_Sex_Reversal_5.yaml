discussions:
- discussion_id: cbx2_adrenal_splenic_mismatch
  prompt: >-
    Why do Cbx2-null mice have adrenal and splenic hypoplasia through reduced
    SF1, while human CBX2 patients have no reported adrenal or splenic disease,
    even though the human mutant protein's defining defect is failure to
    transactivate the same gene, NR5A1/SF1?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of CBX2 Transactivation of NR5A1 and SOX9
  rationale: >-
    The mouse work makes SF1 the mechanistic centre of the disorder: PRC1
    containing M33 binds the Ad4BP/SF1 locus directly, M33 nulls have
    significantly reduced SF1, and the resulting adrenal and splenic phenotypes
    are the ones SF1 haploinsufficiency itself produces. The human index
    patient's mutant CBX2.1 also fails to transactivate NR5A1/SF1 - that assay
    is the primary functional evidence for pathogenicity. Yet none of the three
    published human patients has reported adrenal insufficiency, and a review of
    the CBX2 transcriptional landscape notes explicitly that human mutants do
    not appear to recapitulate the murine splenic and adrenal defects. Either
    the human alleles are hypomorphic enough to spare a less
    dosage-sensitive human adrenal, or CBX2 is not rate-limiting for human SF1
    outside the gonad. The distinction matters clinically: if the first
    explanation is right, adrenal reserve should be tested in CBX2 patients, and
    it currently is not.
  proposed_experiments:
  - experiment_id: exp_cbx2_adrenal_reserve
    name: Adrenal reserve testing in CBX2 variant carriers
    description: >-
      Measure basal and ACTH-stimulated cortisol, along with electrolytes and
      plasma renin activity, in every ascertained individual with biallelic or
      isoform-specific CBX2 variants, to convert the current absence of reported
      adrenal disease into a tested negative.
    would_refute:
    - pathophysiology#Failure of CBX2 Transactivation of NR5A1 and SOX9
    refuting_outcome:
    - >-
      Normal ACTH-stimulated cortisol across all carriers would show that human
      CBX2 loss does not limit SF1-dependent adrenal function, restricting the
      transactivation defect to the gonadal compartment rather than being a
      general SF1 deficit.
  - experiment_id: exp_cbx2_sf1_dose_response
    name: Comparative SF1 dose-response between mouse and human adrenocortical cells
    description: >-
      Titrate CBX2 knockdown in human and murine adrenocortical cells in
      parallel and measure SF1 output, to test whether the human adrenal simply
      tolerates a lower CBX2 dose than the mouse adrenal does.
  evidence:
  - reference: PMID:31719618
    reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "although human mutants do not seem to recapitulate these defects"
    explanation: >-
      States the mismatch directly: the murine splenic, adrenal and skeletal
      phenotypes are not seen in human CBX2 patients.
  - reference: PMID:15899914
    reference_title: Mouse Polycomb M33 is required for splenic vascular and adrenal gland formation through regulating Ad4BP/SF1 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the adrenal glands of M33-KO and Ad4BP/SF1 heterozygous KO mice were smaller than those of the wild-type mice"
    explanation: >-
      Establishes the murine side of the mismatch, and that the adrenal
      phenotype phenocopies SF1 deficiency.
- discussion_id: cbx2_2_zygosity_and_gene_validity
  prompt: >-
    Is the CBX2.2 arm of this entry the same recessive disorder as the CBX2.1
    index case, given that each CBX2.2 patient is reported as carrying a single
    distinct variant and the phenotypes differ so markedly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#CBX2.2
  - inheritance#Autosomal recessive
  rationale: >-
    The SRXY5 entity is defined as autosomal recessive on the strength of one
    double-heterozygous CBX2.1 patient. The two CBX2.2 patients are each
    described as carrying one distinct variant, with no second allele reported,
    and one of the two alleles has a population frequency (ExAC minor allele
    frequency 0.001418) that is high for a fully penetrant recessive DSD allele.
    Functional data are supportive but functional data alone do not establish a
    mode of inheritance. Working against a common-cause interpretation, a
    dedicated screen of 47 patients with 46,XY or 46,XX gonadal DSD found no
    pathogenic CBX2 variant at all, so there is no independent cohort in which
    the CBX2.2 signal has been replicated. Until the second allele is reported
    or excluded, grouping this arm under SRXY5 is a curation convenience and
    should not be read as an assertion that the two arms share an inheritance
    mode.
  proposed_experiments:
  - experiment_id: exp_cbx2_2_second_allele
    name: Complete allelic characterization of the reported CBX2.2 patients
    description: >-
      Re-analyse the existing exome data with attention to deep intronic,
      regulatory and structural variation at CBX2, plus parental segregation, to
      determine whether a second CBX2 allele is present in either CBX2.2
      patient.
  - experiment_id: exp_cbx2_isoform_targeted_cohort_screen
    name: Isoform-resolved CBX2 screening in a large 46,XY DSD cohort
    description: >-
      Screen an unsolved 46,XY DSD cohort with coverage and annotation specific
      to both CBX2 isoforms, since the earlier negative screen predates the
      CBX2.2 report and may not have interrogated the short isoform adequately.
  evidence:
  - reference: PMID:23219007
    reference_title: "CBX2 gene analysis in patients with 46,XY and 46,XX gonadal disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No pathogenic CBX2 mutation was detected."
    explanation: >-
      The absence of any pathogenic CBX2 variant in a dedicated 47-patient
      gonadal-DSD cohort is what leaves the gene-disease relationship resting on
      three individuals and functional assays.
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both variants are rare, with a MAF on ExAC of 0.00001647 (p.Cys132Arg) and 0.001418 (p.Cys154fs)"
    explanation: >-
      Gives the allele frequencies quoted in the rationale, including the one
      that is high for a fully penetrant recessive allele.
- discussion_id: cbx2_gonadal_tumour_risk
  prompt: >-
    What is the gonadal germ-cell tumour risk in CBX2-related 46,XY DSD, and
    does the presence of apparently normal ovarian tissue rather than a streak
    gonad change it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Gonadectomy
  - phenotypes#Ovarian tissue in an individual with a 46,XY karyotype
  rationale: >-
    Gonadectomy was performed in both CBX2.2 patients, and prophylactic
    gonadectomy is standard practice in 46,XY gonadal dysgenesis generally
    because of germ-cell tumour risk. But no tumour has been reported in any
    CBX2 patient, the publications give no malignancy rationale for either
    operation, and with three published patients there is no denominator from
    which any risk estimate could be formed. Importing a percentage from generic
    46,XY gonadal dysgenesis series would be unsourced inference, and it is
    specifically unsafe here: those series describe streak or dysgenetic gonads,
    whereas the index CBX2.1 patient had histologically normal ovarian tissue,
    which is not the substrate those risk figures were measured on. This entry
    therefore records gonadectomy as reported management with no attached risk
    figure, and this gap is why.
  proposed_experiments:
  - experiment_id: exp_cbx2_gonadal_histology_registry
    name: Systematic gonadal histology and outcome reporting for CBX2 patients
    description: >-
      Record gonadal histology, germ-cell tumour markers and follow-up duration
      for every ascertained CBX2 patient in a shared DSD registry, so that a
      denominator exists before any risk-based management recommendation is
      made.
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including uterus and histologically normal ovaries"
    explanation: >-
      Establishes that the index gonad was histologically normal ovary, the
      observation that makes tumour-risk figures derived from streak gonads
      inapplicable here.
differential_diagnoses:
- name: 46,XY complete gonadal dysgenesis (Swyer syndrome)
  disease_term:
    preferred_term: 46,XY complete gonadal dysgenesis
    term:
      id: MONDO:0010765
      label: 46,XY complete gonadal dysgenesis
  description: >-
    The nonsyndromic form, in which a 46,XY individual has female external
    genitalia, Mullerian structures and bilateral fibrous streak gonads. This is
    the parent MONDO class of SRXY5 and the most important distinction to make.
    The dismech entry for 46,XY complete gonadal dysgenesis explicitly places
    CBX2 outside its scope on the grounds that the canonical CBX2 phenotype had
    ovarian-like rather than bilateral streak gonads, so the two entries
    partition rather than overlap.
  distinguishing_features:
  - Bilateral fibrous streak gonads rather than histologically normal ovarian tissue
  - Usually attributable to SRY, NR5A1, MAP3K1, DHX37 or SOX9-regulatory lesions rather than CBX2
  - The undervirilized CBX2.2 presentation with dysgenetic Sertoli-cell-only testes is partial rather than complete dysgenesis and does not belong to this class at all
- name: NR5A1-related 46,XY disorder of sex development
  disease_term:
    preferred_term: 46,XY sex reversal 3
    term:
      id: MONDO:0013066
      label: 46,XY sex reversal 3
  description: >-
    The immediate mechanistic differential, because NR5A1/SF1 is the gene CBX2
    transactivates. A patient with a CBX2 lesion and a patient with an NR5A1
    lesion converge on reduced SF1 activity in the gonad, so the gonadal
    phenotypes overlap; the discriminator is molecular rather than clinical.
  distinguishing_features:
  - Variants in NR5A1 itself rather than in its upstream regulator CBX2
  - Predominantly heterozygous, frequently de novo, rather than biallelic
  - Adrenal insufficiency is a described part of the NR5A1 spectrum but has not been reported in any CBX2 patient
- name: SRY-related 46,XY sex reversal
  disease_term:
    preferred_term: 46,XY sex reversal 1
    term:
      id: MONDO:0020712
      label: 46,XY sex reversal 1
  description: >-
    The other end of the same regulatory step. CBX2 is placed upstream of SRY in
    both the mouse and the human cascade, so SRY deletion or point mutation
    produces the downstream half of the CBX2 phenotype without the growth
    component.
  distinguishing_features:
  - SRY deletions or point mutations on the Y chromosome rather than an autosomal 17q25.3 lesion
  - Gonads are typically streaks, and gonadal size is not separately affected as it is when the upstream growth arm is lost
  - Y-linked rather than autosomal transmission
- name: PBX1-related 46,XY gonadal dysgenesis with radiocubital synostosis
  description: >-
    A de novo PBX1 TALE-homeodomain variant causes 46,XY gonadal dysgenesis and
    abolishes PBX1's physical interaction with CBX2 and EMX2 - the same two
    proteins this entry's CBX2.2 arm turns on. It is therefore both a
    differential and a mechanistic neighbour. Clinically it is separable by a
    skeletal feature that CBX2 disease does not have.
  distinguishing_features:
  - Radiocubital synostosis, absent in all reported CBX2 patients
  - De novo heterozygous PBX1 variant rather than a biallelic or isoform-specific CBX2 lesion
  - The lesion is in a CBX2 interaction partner rather than in CBX2 itself
  evidence:
  - reference: PMID:31058389
    reference_title: The TALE homeodomain of PBX1 is involved in human primary testis-determination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a de novo missense mutation, p.Arg235Gln in the highly conserved TALE homeodomain of the transcription factor Pre-B-Cell Leukemia Transcription Factor 1 (PBX1) in a child with 46,XY gonadal dysgenesis and radiocubital synostosis"
    explanation: >-
      Names the gene, the inheritance pattern and the distinguishing skeletal
      feature used to separate this disorder from CBX2 disease.
notes: >-
  Scope and evidence base. This entry covers CBX2-attributed 46,XY disorder of
  sex development (SRXY5, OMIM:613080, MONDO:0013120). The total published human
  caseload is three individuals, so almost every clinical statement in this
  entry is an n-of-1 or n-of-2 observation and is written as such: no frequency
  bands are asserted for the CBX2.2 features, no prevalence rate is given, and
  no gonadal tumour risk is attached to the gonadectomy record. The disorder is
  included because its mechanism is unusually well characterized despite the
  tiny caseload - the mouse orthologue is one of the best-studied models of
  pre-SRY testis determination - not because the clinical entity is well
  delineated.

  Boundary with 46,XY complete gonadal dysgenesis. The dismech entry for 46,XY
  complete gonadal dysgenesis (MONDO:0010765) deliberately restricts itself to
  classic nonsyndromic complete disease and states in its own scoping note that
  CBX2 is not promoted into it, because the canonical reported CBX2 phenotype
  had ovarian-like rather than bilateral streak gonads. This entry is the
  counterpart that carries CBX2, and no content is duplicated from that entry.
  MONDO nonetheless classifies MONDO:0013120 as a child of MONDO:0010765; that
  ontological placement is retained in the disease term and is not contradicted
  here, but it should not be read as agreement that the index phenotype was
  complete gonadal dysgenesis.

  Isoform split. The two subtypes are not two severities of one presentation.
  The CBX2.1 index patient had a complete female phenotype with normal ovarian
  tissue; the CBX2.2 patients had undervirilized male genitalia with dysgenetic
  or absent testes. In vitro the two isoforms regulate partly non-overlapping
  target sets, which is the proposed reason for the divergence, but with one and
  two patients respectively the phenotype-isoform correlation rests on three
  observations. The CBX2.2 arm additionally has an unresolved zygosity question
  recorded as a knowledge gap.

  What was deliberately not asserted. Mouse Cbx2 nulls have skeletal homeotic
  transformations, splenic vascular disorganization, adrenal hypoplasia, T-cell
  expansion failure, and germline meiotic defects. None of these has been
  reported in a human CBX2 patient, and none is curated here as a human
  phenotype; the adrenal and splenic divergence is recorded instead as a
  HUMAN_MODEL_MISMATCH discussion. The murine germ-cell and meiosis findings are
  cited only where they bear on gonadal size and histology, not as evidence for
  human fertility claims: no report addresses fertility in any of the three
  patients, and the index patient's ovarian tissue was described only as
  histologically normal, which is not a statement about germ cells.

  GeneReviews. There is no GeneReviews chapter for SRXY5 or for CBX2. The
  relevant overview is Nonsyndromic Disorders of Testicular Development
  (PMID:20301714), which is tagged in the references block; its PubMed record
  carries only the chapter's purpose statement rather than clinical
  characteristics, so it could not be used as a phenotype baseline and no
  phenotype in this entry is derived from it.
references:
- reference: PMID:20301714
  title: Nonsyndromic Disorders of Testicular Development Overview.
  tags:
  - GeneReviews

treatments:
- name: Androgen Replacement Therapy
  action_category: THERAPEUTIC
  description: >-
    Exogenous testosterone in individuals with a male gender identity and no
    functioning gonad, to induce and maintain secondary sexual characteristics.
    Both reported CBX2.2 patients received it: the first started testosterone
    esters at seventeen years, the second testosterone cypionate after
    gonadectomy and genitoplasty. This records what was done for two patients,
    not a dose-finding or outcome study, of which none exists for this disorder.
    The choice of androgen rather than estrogen replacement follows the sex of
    rearing, which in the first patient was changed to male at five years of age
    after psychological evaluation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: hormone replacement therapy

- name: Gonadectomy
  action_category: THERAPEUTIC
  description: >-
    Removal of the dysgenetic gonads, performed in both reported CBX2.2
    patients. In the first this was an exploratory laparotomy at ten years that
    disclosed and removed bilateral atrophic testes; in the second a gonadectomy
    found no gonadal tissue at all. The publication does not state a malignancy
    rationale for either operation, and no gonadal tumour has been reported in
    any CBX2 patient, so this entry records gonadectomy as reported management
    and deliberately attaches no tumour-risk figure to it. Timing and necessity
    of gonadectomy are actively contested in DSD care generally; see the
    tumour-risk discussion.

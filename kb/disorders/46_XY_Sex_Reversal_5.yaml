- name: Failure of CBX2 Transactivation of NR5A1 and SOX9
  biological_scale: MOLECULAR
  description: >-
    CBX2 does not merely silence chromatin; it positively drives the male
    programme, stimulating NR5A1 (SF1) and SOX9. In the mouse, PRC1 containing
    M33 binds the Ad4BP/SF1 locus directly and M33-null animals have markedly
    reduced Ad4BP/SF-1 protein and transcript, establishing CBX2 as an upstream
    activator rather than a repressor of this gene. The index patient's mutant
    CBX2.1 failed to transactivate NR5A1/SF1 in vitro, which is the specific
    molecular defect the human disorder is built on.
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Reduced SRY Expression in the Bipotential Gonad
    causal_link_type: DIRECT
    hypothesis_groups:
    - cbx2_sry_transactivation_model
    evidence:
    - reference: PMID:22186409
      reference_title: "Cbx2, a polycomb group gene, is required for Sry gene expression in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the expression of Sry, Sox9, Lhx9, Ad4BP/SF-1, Dax-1, Gata4, Arx, and Dmrt1, genes encoding transcription factors essential for gonadal development, is affected in Cbx2 KO gonads"
      explanation: >-
        Places reduced Sry expression downstream of Cbx2 loss in the same gonads
        in which Ad4BP/SF-1 is also affected, which is the step this edge makes.
  evidence:
  - reference: PMID:15899914
    reference_title: Mouse Polycomb M33 is required for splenic vascular and adrenal gland formation through regulating Ad4BP/SF1 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "chromatin immunoprecipitation assays with adrenocortical Y-1 cells revealed direct binding of the M33-containing PcG to the Ad4BP/SF1 gene locus"
    explanation: >-
      Direct chromatin occupancy of the SF1 locus by M33-containing PRC1
      supports this as a direct transactivation relationship rather than an
      indirect one.
  - reference: PMID:15899914
    reference_title: Mouse Polycomb M33 is required for splenic vascular and adrenal gland formation through regulating Ad4BP/SF1 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "indicated significantly low expression of adrenal 4 binding protein/steroidogenic factor-1 (Ad4BP/SF-1), indicating that M33 is an essential upstream regulator of Ad4BP/SF1"
    explanation: >-
      Loss of M33 lowers SF1 expression, establishing the direction of the
      relationship asserted by this node.
  - reference: PMID:31719618
    reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CBX2.1 is a stimulator of the male (through SOX9 and NR5A1 stimulation) and an inhibitor for the female pathway (through inhibition of FOXL2 expression)"
    explanation: >-
      Names SOX9 and NR5A1 as the male-pathway targets CBX2.1 stimulates, which
      is what this node says is lost.
- name: Loss of CBX2 Repression of the Ovarian Programme
  biological_scale: MOLECULAR
  description: >-
    The mirror image of the transactivation defect. CBX2.1 directly represses
    WNT4 and PBX1 and indirectly represses FOXL2; genome-wide target mapping in
    Sertoli-like cells identified close to 1600 direct CBX2 targets and
    concluded that the protein concurrently inhibits the female pathway. Loss of
    this repression allows ovarian determinants to run unopposed in an XY gonad,
    which is the most likely explanation for the index patient's histologically
    normal ovarian tissue — a finding that plain failure of testis determination
    would not by itself produce.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED

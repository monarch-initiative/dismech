- name: Multidisciplinary DSD Care and Sex Assignment
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Nothing disease-modifying exists for CBX2-related DSD, so care follows the
    general DSD framework: an individualized multidisciplinary assessment, a sex
    assignment decision made on the most likely adult gender identity together
    with diagnosis, genital appearance, fertility potential and psychosocial
    context, and full disclosure to family and patient. This is a class-level
    standard imported from DSD care generally, not a CBX2-specific protocol, and
    it is recorded as such. Its relevance here is concrete rather than
    decorative: the first CBX2.2 patient was initially raised female and changed
    to male social sex at five years of age after psychological evaluation,
    which is exactly the situation this framework governs.

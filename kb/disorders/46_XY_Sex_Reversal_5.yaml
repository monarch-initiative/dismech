    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that CBX2 directly binds the downstream Wnt signaler Lef1, an ovary-promoting gene that remains bivalent in Sertoli cells"
    explanation: >-
      Direct chromatin binding of an ovary-promoting gene establishes the
      repression as a direct CBX2 activity rather than a downstream consequence.
- name: Failure of CBX2.2-Dependent EMX2 Regulation
  biological_scale: MOLECULAR
  description: >-
    A separate molecular arm specific to the short CBX2.2 isoform. Both reported
    CBX2.2 variants failed to regulate their target genes in transactivation
    assays, with defective EMX2 expression proposed as the proximate cause of
    the severe 46,XY phenotype in those patients. EMX2 is required for
    urogenital ridge development, so this arm converges on the same gonadal
    endpoint as the CBX2.1 arm by a non-overlapping target route. Independent
    support for a CBX2-EMX2 axis comes from a different disease gene: a PBX1
    variant causing 46,XY gonadal dysgenesis was shown to abolish PBX1's
    physical interaction with both CBX2 and EMX2, placing the three proteins in
    one testis-determining module.
  biological_processes:
  - preferred_term: gonad development
    term:
      id: GO:0008406
      label: gonad development
    modifier: DECREASED
  downstream:
  - target: Failure of Sertoli Cell Differentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29998616
      reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "leading to a severe 46,XY DSD defect, likely because of a defective expression of EMX2 in the developing gonad"
      explanation: >-
        States the proposed route from defective EMX2 regulation to the gonadal
        phenotype, and its own hedging ("likely") is why this edge is recorded
        as indirect.
  evidence:
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that both CBX2.2 variants fail to regulate the expression of genes essential for sexual development"
    explanation: >-
      Both CBX2.2 alleles were shown in vitro to lose regulatory control of
      sex-development genes, which is the claim of this node.
  - reference: PMID:31058389
    reference_title: The TALE homeodomain of PBX1 is involved in human primary testis-determination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The mutation abolishes the physical interaction of PBX1 with two proteins known to be involved in testis-determination, CBX2 and EMX2."
    explanation: >-
      Independent evidence that CBX2 and EMX2 sit in one testis-determining
      protein module. Indirect: the experiment is about a PBX1 variant, and the
      inference to a CBX2-EMX2 axis is one step removed from what was measured.
- name: Reduced SRY Expression in the Bipotential Gonad
  biological_scale: CELLULAR
  description: >-

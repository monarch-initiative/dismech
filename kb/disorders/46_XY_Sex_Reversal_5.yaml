- name: Absent Fetal Testicular Androgen Output
  biological_scale: ORGANISM
  description: >-
    With no functional Leydig compartment, testosterone is not produced in the
    fetal window during which the external genitalia are masculinized, nor
    later. In one CBX2.2 patient an hCG stimulation test at two years produced
    neither a testosterone rise nor accumulation of steroid precursors,
    demonstrating that the block is absent steroidogenic tissue rather than an
    enzymatic step within the androgen synthesis pathway.

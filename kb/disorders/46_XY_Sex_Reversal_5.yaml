name: 46,XY Sex Reversal 5
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
synonyms:
- SRXY5
- 46,XY sex reversal type 5
- disorder of sex development, 46,XY, CBX2-related
- CBX2-related 46,XY disorder of sex development
- 46,XY gonadal dysgenesis, complete, CBX2-related
description: >-
  A very rare 46,XY disorder of sex development attributed to loss-of-function
  variants in CBX2, the human orthologue of Drosophila Polycomb (M33) and a
  chromodomain subunit of Polycomb repressive complex 1. CBX2 acts at the
  earliest, pre-SRY step of testis determination: rather than behaving purely as
  a repressive chromatin modifier, it transactivates the male programme
  (NR5A1/SF1, SOX9) while repressing ovarian determinants (WNT4, PBX1, and
  indirectly FOXL2), so its loss removes the male bias from the bipotential
  gonad. The disorder is defined by a single index patient reported in 2009 — a
  46,XY girl ascertained through a discrepancy between her prenatal karyotype
  and her phenotype at birth, who had entirely normal female external genitalia,
  a uterus and histologically normal ovaries, and carried double-heterozygous
  CBX2.1 variants. Two later 46,XY individuals carrying variants in the shorter
  CBX2.2 isoform presented very differently, with atypical external genitalia,
  perineal hypospadias, non-palpable gonads and dysgenetic Sertoli-cell-only
  testes; their variants impair regulation of a distinct target set including
  EMX2. Together these define an isoform-split phenotypic spectrum rather than a
  single stereotyped presentation. CBX2 is not a common cause of gonadal DSD: a
  dedicated screen of 47 patients with 46,XY or 46,XX gonadal DSD found no
  pathogenic CBX2 variant, so the total published caseload remains three
  individuals and the gene-disease relationship rests on functional rather than
  segregation evidence.
disease_term:
  preferred_term: 46,XY sex reversal 5
  term:
    id: MONDO:0013120
    label: 46,XY sex reversal 5
parents:
- Disorder of sex development

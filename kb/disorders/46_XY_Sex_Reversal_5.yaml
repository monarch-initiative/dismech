    de-repressed, the supporting-cell precursors of the XY gonad do not commit
    to the Sertoli lineage, or commit incompletely. In the CBX2.2 patient in
    whom gonadal tissue was recovered, the testes were dysgenetic with immature
    tubules containing Sertoli cells only and no identifiable Leydig cells; in
    the mouse, XY knockouts develop ovaries rather than testes.

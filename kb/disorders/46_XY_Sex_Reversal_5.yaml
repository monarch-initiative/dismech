- name: Incomplete Mullerian Duct Regression
  biological_scale: ORGANISM
  description: >-
    Anti-Mullerian hormone is a fetal Sertoli cell product, so a gonad that
    fails to make Sertoli cells does not regress the Mullerian ducts. Mullerian
    structures were present in two of the three reported patients — a normal
    uterus in the CBX2.1 index girl and a hypoplastic uterus found unexpectedly
    at gonadectomy in one CBX2.2 patient — while the other CBX2.2 patient had no
    Mullerian derivatives on imaging. The inconsistency tracks the gonadal
    findings: a partially functional fetal Sertoli compartment regresses the
    ducts partially.

histopathology:
- name: Dysgenetic testis with Sertoli-cell-only tubules and absent Leydig cells
  description: >-
    Gonadectomy material from the first CBX2.2 patient showed dysgenetic testes:
    immature seminiferous tubules lined by Sertoli cells only, containing a few
    atypical spermatogonia, with no Leydig cells identifiable in the
    interstitium. The absent Leydig compartment is the histological counterpart
    of the flat hCG stimulation test in the same patient.
  evidence:
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anatomopathological data showed dysgenetic testes characterized by immature tubules with Sertoli cells only and a few atypical spermatogonias. No Leydig cells were identified in the interstitium."
    explanation: >-
      The full histological description quoted from the report.
- name: Histologically normal ovarian tissue in a 46,XY individual
  description: >-
    The index CBX2.1 patient's gonads were histologically normal ovaries. This
    is the single most distinctive pathological finding of the disorder and the
    reason it is not simply an allelic form of complete gonadal dysgenesis,
    where fibrous streak gonads are the expected finding.
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including uterus and histologically normal ovaries"
    explanation: >-
      States the histological result directly.
animal_models:
- name: Cbx2 (M33) null mouse
  species: Mouse
  genotype: M33/Cbx2 homozygous null
  background: C57BL/6
  genes:
  - preferred_term: CBX2
    term:
      id: hgnc:1552
      label: CBX2
  publication: PMID:9641679
  description: >-
    Targeted disruption of M33/Cbx2 by insertion into the fifth exon. More than
    half of homozygous mutants die before weaning; survivors show male-to-female
    sex reversal, and genital ridge formation is retarded in both XX and XY
    embryos. This model is the origin of the entire CBX2 sex-development
    hypothesis: the human index case was investigated precisely because the
    girl's phenotype matched it. Later work in the same model established the
    Sry-expression mechanism and the Sry/Sox9 rescue. Its principal divergence
    from human disease is the extragonadal phenotype - skeletal, splenic and
    adrenal - which human CBX2 patients do not report.
  modeled_mechanisms:
  - target: Reduced SRY Expression in the Bipotential Gonad
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Cbx2-null gonads have reduced Sry expression, and forced Sry or Sox9
      expression rescues the sex reversal. This is the strongest evidence in
      either species for the node.
    limitations: >-
      The ordering is established in mouse; the human equivalent rests on in
      vitro transactivation assays with the patient's mutant protein rather than
      on measured SRY levels in a patient gonad.
    readouts:
    - name: Gonadal Sry transcript level
      target: Reduced SRY Expression in the Bipotential Gonad
      direction: DECREASED
      interpretation: >-
        Reduced Sry in the knockout gonad is the direct measurement behind this
        node.
      evidence:
      - reference: PMID:22186409
        reference_title: "Cbx2, a polycomb group gene, is required for Sry gene expression in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the expression of Sry, Sox9, Lhx9, Ad4BP/SF-1, Dax-1, Gata4, Arx, and Dmrt1, genes encoding transcription factors essential for gonadal development, is affected in Cbx2 KO gonads"
        explanation: >-
          Reports the measurement of altered Sry expression in Cbx2 knockout
          gonads by microarray, RT-PCR and immunohistochemistry.
    evidence:
    - reference: PMID:22186409
      reference_title: "Cbx2, a polycomb group gene, is required for Sry gene expression in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study implicates Cbx2 in testis differentiation through regulating Sry gene expression."
      explanation: >-
        The paper's own conclusion that this model is informative for the
        Cbx2-to-Sry step.
  - target: Impaired Genital Ridge Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Genital ridge formation is retarded in both XX and XY nulls, and rescued
      XY animals still have hypoplastic testes, isolating a growth defect from
      the sex-determination defect.
    limitations: >-
      No human CBX2 patient has had gonadal volume measured against a normative
      standard, so the human counterpart of this readout is inferred from
      non-visualized or atrophic gonads rather than measured.
    readouts:
    - name: Testis size after Sry/Sox9 rescue
      target: Impaired Genital Ridge Growth
      direction: DECREASED
      interpretation: >-
        Persisting hypoplasia after the sex reversal is rescued is what
        establishes gonadal size as a separately controlled output.
      evidence:
      - reference: PMID:22186409
        reference_title: "Cbx2, a polycomb group gene, is required for Sry gene expression in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, testes remained hypoplastic in these mice, indicating that the size and the sex of the gonad are determined by different sets of genes."
        explanation: >-
          Reports the measurement and the inference drawn from it.
  - target: Dysgenetic Gonad
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      XY nulls develop ovaries rather than testes, matching the CBX2.1 index
      patient's ovarian tissue but not the Sertoli-cell-only dysgenetic testes
      of the CBX2.2 patients.
    limitations: >-
      Penetrance in the model is partial and strain-dependent - one series found
      sex reversal in 28.6% of XY nulls, with the remainder having bilateral
      testicular hypoplasia - so the model does not reproduce a single
      consistent human gonadal outcome. The mouse also has no CBX2.2 equivalent
      arm, so the second human presentation is unmodelled.
    readouts:
    - name: Gonadal histology in XY nulls
      target: Dysgenetic Gonad
      direction: ALTERED
      interpretation: >-
        The XY gonad follows an ovarian or hypoplastic-testis route rather than
        forming a normal testis.
      evidence:
      - reference: PMID:22200029
        reference_title: "Role of polycomb group protein cbx2/m33 in meiosis onset and maintenance of chromosome stability in the Mammalian germline."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our analysis revealed sex reversal in 28.6% of XY(-/-) embryos, in which a hypoplastic testis and a contralateral ovary were observed in close proximity to the kidney"
        explanation: >-
          Quantifies the partial penetrance and describes the mixed gonadal
          outcome this readout records.
  evidence:
  - reference: PMID:9641679
    reference_title: Male-to-female sex reversal in M33 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "More than half of the resultant M33cterm/M33cterm mutant mice died before weaning, and survivors showed male-to-female sex reversal."
    explanation: >-
      Establishes the model's defining phenotype and its use as a model of
      CBX2-related sex reversal.
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In mice with a similar phenotype, the ablation of M33, an ortholog of Drosophila Polycomb, causes male-to-female sex reversal."
    explanation: >-
      The human report explicitly reasons from this model to the human gene,
      which is the sense in which the model is informative for this disorder.
- name: Cbx2/Wnt4 double-null rescue mouse
  species: Mouse
  genotype: Cbx2-/-;Wnt4-/- (XY)
  genes:
  - preferred_term: CBX2
    term:
      id: hgnc:1552
      label: CBX2
  publication: PMID:31116734
  description: >-
    An epistasis model rather than a disease model. Removing the ovary-promoting
    gene Wnt4 from a Cbx2-null XY animal restores both Sry expression and testis
    development, which is the decisive experiment behind the alternative
    ovarian-derepression hypothesis. Its value here is that it tests the
    direction of causation, not that it reproduces the human phenotype - which
    it deliberately does not.
  modeled_mechanisms:
  - target: Loss of CBX2 Repression of the Ovarian Programme
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Deleting Wnt4 removes the de-repressed ovarian signal and rescues the XY
      gonad, showing that the block to testis development in Cbx2 nulls runs
      through unopposed ovarian determinants.
    limitations: >-
      The rescue is genetic and murine. There is no human counterpart, and the
      experiment cannot say which mechanism dominates in a human gonad carrying
      hypomorphic rather than null CBX2 alleles.
    readouts:
    - name: Sry expression and testis development in XY double nulls
      target: Loss of CBX2 Repression of the Ovarian Programme
      direction: RESTORED
      interpretation: >-
        Restoration of both the Sry pulse and testis morphogenesis on removing a
        single ovarian determinant is what makes this an epistasis result rather
        than a modifier effect.
      evidence:
      - reference: PMID:31116734
        reference_title: CBX2 is required to stabilize the testis pathway by repressing Wnt signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We show that Sry expression and testis development were rescued in XY Cbx2-/-;Wnt4-/- mice."
        explanation: >-
          The measured rescue of both readouts in the double-null animals.
    evidence:
    - reference: PMID:31116734
      reference_title: CBX2 is required to stabilize the testis pathway by repressing Wnt signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results suggest that stabilization of the testis fate requires CBX2-mediated repression of bivalent ovary-determining genes, which would otherwise block testis development."
      explanation: >-
        The authors' conclusion that this model is informative for CBX2-mediated
        repression of the ovarian programme.
  evidence:
  - reference: PMID:31116734
    reference_title: CBX2 is required to stabilize the testis pathway by repressing Wnt signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of CBX2, the subunit of the Polycomb Repressive Complex 1 (PRC1) that binds H3K27me3 and mediates silencing, leads to ovary development in XY mice and humans"
    explanation: >-
      Establishes that the model system is CBX2 loss in an XY gonad, the same
      lesion as the human disorder.

has_subtypes:
- name: CBX2.1
  display_name: CBX2.1 (isoform 1) related, complete female phenotype
  description: >-
    The originally described and OMIM-defining presentation: a 46,XY individual
    with a completely female phenotype — normal female external genitalia, a
    uterus, and histologically normal ovarian tissue rather than streak gonads.
    Reported in one girl carrying double-heterozygous variants in the long
    CBX2.1 isoform, whose mutant protein failed to transactivate NR5A1/SF1.
    Because the external phenotype is unremarkable, ascertainment depended on a
    prenatal karyotype, which is why this presentation is expected to be
    systematically under-detected.
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A girl with a prenatal 46,XY karyotype was born with a completely normal female phenotype, including uterus and histologically normal ovaries."
    explanation: >-
      The single report defining this subtype, including the prenatal-karyotype
      route of ascertainment.
- name: CBX2.2
  display_name: CBX2.2 (isoform 2) related, undervirilized phenotype with dysgenetic testes
  description: >-
    Two unrelated 46,XY individuals carrying distinct variants in the shorter
    CBX2.2 isoform (p.Cys132Arg and p.Cys154fs) presented with atypical external
    genitalia, microphallus, perineal hypospadias and no palpable gonads, and
    were found to have dysgenetic Sertoli-cell-only testes or no residual
    gonadal tissue, with hypergonadotropic hypogonadism. In vitro these variants
    fail to regulate a target set distinct from that of CBX2.1, most notably
    EMX2. This arm is grouped under the same entry because the causal gene is
    the same, but note the caveats recorded in the entry notes: the zygosity of
    these variants is not reported as biallelic, so this subtype's relationship
    to the autosomal recessive CBX2.1 entity is not settled.
  evidence:
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two patients with features of DSD i.e. atypical external genitalia, perineal hypospadias and no palpable gonads, each patient carrying a distinct CBX2.2 variant, p.Cys132Arg (c.394T>C) and p.Cys154fs (c.460delT)."
    explanation: >-
      The single report defining this subtype: both patients, their external
      phenotype, and the two isoform-2 alleles.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence figure has been published. The entire
    published caseload is three individuals: one 46,XY girl with
    double-heterozygous CBX2.1 variants (2009) and two 46,XY individuals with
    CBX2.2 variants (2018). A dedicated screen of 47 patients with 46,XY or
    46,XX gonadal DSD found no pathogenic CBX2 variant, which bounds the
    contribution of CBX2 to ascertained gonadal DSD from above but yields no
    population rate. This is a case tally, not an occurrence estimate.
  evidence:
  - reference: PMID:23219007
    reference_title: "CBX2 gene analysis in patients with 46,XY and 46,XX gonadal disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study does not support CBX2 gene disruption as a common cause of gonadal DSD."
    explanation: >-
      A targeted CBX2 screen of a gonadal-DSD cohort concluded the gene is not a
      common cause, supporting the extreme rarity recorded here rather than a
      numeric rate.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The OMIM entity (SRXY5) is classified as autosomal recessive on the strength
    of the index patient, who carried two loss-of-function CBX2.1 variants in
    trans (a double heterozygote). CBX2 is at 17q25.3, so this is autosomal
    rather than sex-limited despite the phenotype being expressed only in 46,XY
    individuals. The recessive assignment rests on a single family; the two
    later CBX2.2 patients are each reported as carrying one variant, and their
    zygosity is not stated to be biallelic (see the CBX2.2 zygosity discussion).
  evidence:
  - reference: PMID:31719618
    reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified through a 46,XY girl with double heterozygous variants on CBX2.1, causing Differences of Sex Development (DSD)"
    explanation: >-
      States that the index patient carried two CBX2.1 variants, the observation
      the autosomal recessive assignment is based on.
genetic:
- name: CBX2
  gene_term:
    preferred_term: CBX2
    term:
      id: hgnc:1552
      label: CBX2
  relationship_type: CAUSATIVE
  notes: >-
    CBX2 (chromobox homolog 2, formerly M33) at 17q25.3 encodes a chromodomain
    subunit of Polycomb repressive complex 1. Two protein isoforms are produced:
    the long CBX2.1 and the short CBX2.2, which have partly non-overlapping
    target sets and are implicated in the two phenotypically distinct arms of
    this disorder. Reported disease alleles are the double-heterozygous CBX2.1
    variants of the index patient, and the CBX2.2 changes c.394T>C
    (p.Cys132Arg) and c.460delT (p.Cys154fs). The index alleles are reported as
    p.Pro98Leu and p.Arg443Pro; both are recorded in ClinVar as pathogenic for
    this condition, but no cached publication in this entry names them, so they
    are given here without an evidence item rather than attributed to a source
    that does not state them. On constraint: the 2018 CBX2.2 report quotes an
    ExAC pLI of 0.95 for CBX2. That is an ExAC-era figure quoted from that
    paper, not a current gnomAD value, and it sits awkwardly with a recessive
    mechanism in which heterozygous carriers are unaffected; it is recorded here
    as what that paper reported and should be re-derived from current
    population data before being used to argue anything.
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analysis of the human homolog of M33, Chromobox homolog 2 (CBX2), in this girl revealed loss-of-function mutations"
    explanation: >-
      Establishes CBX2 loss-of-function variants as the cause in the index
      patient, the basis for the gene-disease assignment.
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each patient carrying a distinct CBX2.2 variant, p.Cys132Arg (c.394T>C) and p.Cys154fs (c.460delT)"
    explanation: >-
      Names the two CBX2.2 alleles recorded in this entry's allele list.
  - reference: PMID:29998616
    reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ExAC predicts for CBX2 a pLI (probability of LOF intolerance) of 0.95"
    explanation: >-
      Source for the constraint metric quoted in the notes.
  - reference: PMID:35263754
    reference_title: "CBX2 in DSD: The Quirky Kid on the Block."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CBX2 was shown to be an essential factor for gonadal development in mammals, as genetic variants or loss-of-function of CBX2 can cause sex reversal in mice and humans."
    explanation: >-
      A review-level statement that CBX2 loss of function causes sex reversal in
      both species, cited here as the synthesis claim rather than as primary
      data.
mechanistic_hypotheses:
- hypothesis_group_id: cbx2_sry_transactivation_model
  hypothesis_label: CBX2 as a transactivator upstream of SRY
  status: CANONICAL
  description: >-
    The model the disorder was originally built on. CBX2 acts, unusually for a
    Polycomb protein, as a positive regulator: PRC1 containing CBX2/M33 binds
    the NR5A1/SF1 locus directly, CBX2-null mouse gonads have reduced Sry and
    Sox9, forced Sry or Sox9 expression rescues the sex reversal, and the human
    index patient's mutant CBX2.1 fails to transactivate NR5A1/SF1 in vitro.
    On this account the lesion is a failure to switch the male programme on.
  notes: >-
    Retained as CANONICAL because it is what the human functional diagnosis
    rests on: pathogenicity of the index patient's CBX2.1 variants was
    established by an NR5A1 transactivation assay, not by a repression assay.
  evidence:
  - reference: PMID:19361780
    reference_title: "Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the CBX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed loss-of-function mutations that allowed us, by placing CBX2 upstream of SRY"
    explanation: >-
      The original report's own framing of the mechanism as CBX2 acting
      upstream of SRY.
  - reference: PMID:22186409
    reference_title: "Cbx2, a polycomb group gene, is required for Sry gene expression in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Male-to-female sex reversal in Cbx2 KO mice was rescued by crossing them with transgenic mice displaying forced expression of Sry or Sox9."
    explanation: >-
      Rescue by supplying Sry or Sox9 is the central genetic argument that the
      defect is insufficient male-pathway activation.
- hypothesis_group_id: cbx2_ovarian_derepression_model
  hypothesis_label: CBX2 as a repressor of the ovary-promoting pathway
  status: ALTERNATIVE
  description: >-
    The competing account, and the one that fits CBX2's Polycomb identity. Here
    the primary lesion is loss of H3K27me3-mediated repression of ovary-promoting
    genes, which then block testis development; reduced Sry is a consequence
    rather than the cause. Sex-determining genes are bivalent in the bipotential
    gonad, CBX2 directly binds the Wnt effector Lef1, and deleting Wnt4 rescues
    both Sry expression and testis development in XY Cbx2-null mice.
  notes: >-
    This is not a refinement of the canonical model but a direct challenge to
    it: the authors explicitly investigated it as the alternative to CBX2 being
    an activator of Sry. The two models are not yet reconciled, and the human
    data cannot discriminate between them because no human CBX2 gonad has been
    profiled. Curated as ALTERNATIVE rather than CANONICAL because the decisive
    experiment is murine and the human diagnostic assay remains the
    transactivation one.
  evidence:
  - reference: PMID:31116734
    reference_title: CBX2 is required to stabilize the testis pathway by repressing Wnt signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that stabilization of the testis fate requires CBX2-mediated repression of bivalent ovary-determining genes, which would otherwise block testis development."
    explanation: >-
      States the alternative model in the authors' own terms.
  - reference: PMID:31116734
    reference_title: CBX2 is required to stabilize the testis pathway by repressing Wnt signaling.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "While it had been proposed that CBX2 is an activator of the testis-determining gene Sry, we investigated the alternative possibility that CBX2 has a direct role as a repressor of the antagonistic ovary-promoting pathway."
    explanation: >-
      Recorded as REFUTE against the canonical transactivation reading: the same
      sentence that motivates this hypothesis explicitly sets it against CBX2
      acting as an Sry activator.
pathophysiology:
- name: Biallelic CBX2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function variants remove the activity of CBX2, the chromodomain
    subunit through which Polycomb repressive complex 1 is recruited to its
    target loci. CBX2 is expressed in the human gonad from around week 7 of
    gestation, before testis determination, and continues to be detected in both
    male and female gonads from week 9 to week 25. Because the protein acts both
    as a chromatin modifier and as a direct transactivator, its loss removes two
    separable activities at once, which is why downstream male genes fall and
    female genes rise from the same lesion.
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of CBX2 Transactivation of NR5A1 and SOX9
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31719618
      reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutated CBX2.1 failed to adequately regulate downstream targets important for sex development in humans, specifically steroidogenic factor 1 (NR5A1/SF1)."
      explanation: >-
        Directly links the patient's mutant CBX2.1 protein to failed regulation
        of NR5A1/SF1, which is the step this edge asserts.
  - target: Loss of CBX2 Repression of the Ovarian Programme
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25569159
      reference_title: "Genome-wide identification of CBX2 targets: insights in the human sex development network."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overall, our findings suggest that CBX2 role in the sex development cascade is to stimulate the male pathway and concurrently inhibit the female pathway."
      explanation: >-
        Establishes that inhibition of the female pathway is a CBX2 function, so
        its loss is expected to de-repress that pathway.
  - target: Failure of CBX2.2-Dependent EMX2 Regulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29998616
      reference_title: "Assembling the jigsaw puzzle: CBX2 isoform 2 and its targets in disorders/differences of sex development."

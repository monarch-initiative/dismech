  - target: Impaired Genital Ridge Growth
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9641679
      reference_title: Male-to-female sex reversal in M33 mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Formation of genital ridges was retarded in both XX and XY M33cterm/M33cterm embryos."
      explanation: >-
        Shows that loss of the mouse orthologue retards genital ridge formation,
        the growth arm of this lesion, and that it does so independently of
        chromosomal sex.
  evidence:
  - reference: PMID:22200029
    reference_title: "Role of polycomb group protein cbx2/m33 in meiosis onset and maintenance of chromosome stability in the Mammalian germline."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mouse PcG family member M33/Cbx2 (Chromobox homolog protein 2) is a component of the Polycomb-Repressive Complex 1 (PRC1)."
    explanation: >-
      Identifies CBX2/M33 as a PRC1 component, the molecular identity this node
      asserts is lost.
  - reference: PMID:31719618
    reference_title: "CBX2-dependent transcriptional landscape: implications for human sex development and its defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CBX2 was shown to be expressed from week 9 to week 25 post-fertilization in both male and female gonads"
    explanation: >-
      Supplies the human gonadal expression window quoted in this node's

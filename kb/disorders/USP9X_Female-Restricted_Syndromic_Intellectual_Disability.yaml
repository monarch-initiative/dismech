- name: Tissue-Level Mosaicism of USP9X Dosage
  biological_scale: TISSUE
  description: >
    A branch that is specific to females and to escape genes. The degree to
    which an escape gene evades X-inactivation varies between cells and between
    tissues, so a heterozygous female is a patchwork of territories with
    differing residual USP9X dose. Clonal territories established early in
    development then follow the lines of Blaschko. This is the accepted
    explanation for the pigmentary streaking and body asymmetry that are
    characteristic of the syndrome, and it is a genuinely different mechanism
    from the cell-autonomous dosage reduction modelled upstream.
  biological_processes:
  - preferred_term: dosage compensation by inactivation of X chromosome
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In several females, pigment changes along Blaschko lines and body asymmetry were observed, which is probably related to differential (escape from) X-inactivation between tissues."
    explanation: Directly asserts the tissue-differential-escape mechanism for the mosaic features.
  - reference: PMID:29022598
    reference_title: Landscape of X chromosome inactivation across human tissues.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "XCI is, however, incomplete in humans: up to one-third of X-chromosomal genes are expressed from both the active and inactive X chromosomes (Xa and Xi, respectively) in female cells, with the degree of 'escape' from inactivation varying between genes and individuals."
    explanation: >
      The population-scale transcriptomic basis for the premise this node
      depends on - that escape is partial and varies between individuals (and,
      per the same survey, between tissues), which is what makes a heterozygous
      female a patchwork of residual-dosage territories. Classified COMPUTATIONAL
      because it is a large-scale integrative transcriptome/genome analysis.
  - reference: PMID:29022598
    reference_title: Landscape of X chromosome inactivation across human tissues.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "We show that XCI at 683 X-chromosomal genes is generally uniform across human tissues, but identify examples of heterogeneity between tissues, individuals and cells."
    explanation: >
      An important qualifier rather than plain support - escape is mostly
      uniform across tissues, with heterogeneity the exception. The mosaic
      features of this syndrome therefore require USP9X to be one of the
      heterogeneous cases, which this survey does not establish for USP9X
      specifically.
  downstream:
  - target: Blaschko-Linear Pigmentary Mosaicism and Body Asymmetry
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

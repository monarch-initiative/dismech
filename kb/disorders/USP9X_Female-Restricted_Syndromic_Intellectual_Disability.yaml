- name: Attenuated TGF-beta Signalling
  biological_scale: CELLULAR
  description: >
    The best-characterised signalling arm, and the one with a defined molecular
    lesion. USP9X is the deubiquitinase that reverses monoubiquitination of
    SMAD4 at lysine 519 - a modification that blocks SMAD4 from partnering
    phospho-SMAD2. With USP9X dose reduced, SMAD4 remains monoubiquitinated and
    TGF-beta/BMP transcriptional output falls. USP9X additionally stabilises
    SMURF1 and PJA1, further regulators of the pathway. In the mouse, Usp9x-null
    neurons show a failure of Tgf-beta signalling that accounts in part for
    their reduced axonal length. In USP9X-variant human fibroblasts, TGF-beta
    reporter induction, TGF-beta-stimulated nuclear SMAD4 translocation and
    TGF-beta-stimulated migration are all blunted. Note the scope limit: the
    biochemistry (Dupont) is non-neural cell systems, the in vivo work is mouse,
    and the human patient-cell work is from the MALE partial-loss-of-function
    cohort. The authors flag TGF-beta as the candidate convergent mechanism
    shared with the female dosage-loss syndrome; this node is annotated at that
    confidence level rather than as a demonstrated female mechanism.

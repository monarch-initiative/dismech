description: >
  USP9X female-restricted syndromic intellectual disability (MRXS99F; OMIM
  300968; MONDO:0010502) is a rare, clinically recognisable
  multiple-congenital-anomaly neurodevelopmental syndrome of heterozygous
  females caused by
  de novo loss-of-function variants in USP9X at Xp11.4. USP9X encodes a large,
  substrate-specific ubiquitin-specific protease (deubiquitinase) that rescues
  many of its substrates from proteasomal degradation, thereby setting their
  steady-state abundance. Many of those substrates are themselves
  neurodevelopmental-disorder proteins or components of the TGF-beta, Wnt,
  Notch and mTOR pathways.

  The core presentation combines developmental delay and intellectual
  disability of highly variable severity, near-universal speech and language
  impairment, hypotonia and motor delay, a recognisable facial gestalt, and a
  distinctive set of extra-neural congenital malformations - choanal atresia,
  anal anomalies, postaxial polydactyly, congenital heart defects, hypomastia,
  cleft palate or bifid uvula, progressive scoliosis and hip dysplasia -
  together with structural brain abnormalities, most often agenesis or
  hypoplasia of the corpus callosum and ventriculomegaly. Pigmentary changes
  along the lines of Blaschko and body asymmetry are characteristic and reflect
  tissue-level mosaicism of USP9X dosage.

  IMPORTANT SCOPE / NAMED-ENTITY NOTE - this entry is the FEMALE-RESTRICTED
  entity only (OMIM:300968, MONDO:0010502, MRXS99F). USP9X causes a second,
  distinct MONDO entity: intellectual disability, X-linked 99 (MRX99;
  OMIM:300919, MONDO:0010487), a non-syndromic-to-mildly-syndromic disorder of
  hemizygous MALES driven by partial loss-of-function missense variants, often
  maternally inherited from unaffected mothers. The two literatures are
  routinely co-published by the same groups and must not be blended. The
  entities are separated by allele class (complete LOF/null in females versus
  hypomorphic missense in males), by sex of the affected individual, and by
  phenotype: males share the core neurological features but are largely spared
  the skeletal, cardiac and other congenital malformations that define the
  female syndrome. Male-derived data are cited here only where the paper itself
  makes a female-relevant claim, and are labelled as such.

  The disorder is "female-restricted" for a mechanistic reason rather than a
  classical dominance reason. Complete loss of USP9X is incompatible with early
  embryonic development, so a hemizygous male null is not observed; the null
  allele is therefore only seen in heterozygous females. Because USP9X escapes
  X-inactivation, the second X allele is normally expressed and cannot be
  recruited to compensate, so heterozygosity produces a genuine ~50% dosage
  reduction rather than the all-or-none mosaic seen for X-inactivated genes.
  This entry therefore models the mechanism as female haploinsufficiency of an
  X-inactivation-escape gene and deliberately avoids labelling it a
  conventional X-linked dominant or X-linked recessive disorder; the HPO
  annotation used is the neutral `X-linked inheritance` term.

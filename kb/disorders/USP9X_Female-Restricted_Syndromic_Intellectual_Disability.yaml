- name: Reduced RAPTOR and mTORC1 Signalling in Neural Progenitors
  biological_scale: CELLULAR
  description: >
    A second, mechanistically distinct signalling arm with its own named
    substrate. RAPTOR, the defining component of mTORC1, is a USP9X
    deubiquitination substrate: RAPTOR abundance tracks USP9X dose in both
    loss- and gain-of-function experiments, and USP9X activity opposes RAPTOR's
    proteasomal degradation. Reducing USP9X in a human neural progenitor line
    arrests cells in G0 with a matching fall in mTORC1 signalling, reproduced in
    Usp9x-null mouse neurospheres and embryonic brain. The consequence is
    impaired neural progenitor proliferation - a plausible contributor to the
    reduced size of multiple brain regions. A counter-intuitive detail worth
    preserving: loss of Usp9x simultaneously INCREASED sphere-forming capacity,
    i.e. proliferation and self-renewal move in opposite directions, so this
    node should not be simplified to "fewer neural progenitors".

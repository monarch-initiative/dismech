- name: Postaxial Polydactyly Excision
  description: >
    Excision of the supernumerary postaxial digit is the usual management where
    the extra digit is functionless, performed for function and appearance. It
    is included here because postaxial polydactyly is one of the defining
    malformations and, together with the anal and choanal anomalies, is the part
    of the phenotype most likely to be surgically addressed in infancy before
    the syndrome is recognised. No disorder-specific surgical evidence exists.

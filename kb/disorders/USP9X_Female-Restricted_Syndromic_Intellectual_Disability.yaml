clinical_trials:
- name: NCT01238250
  status: RECRUITING
  description: >
    Simons Searchlight - an observational, online, international natural-history
    registry for families with rare genetic variants causing neurodevelopmental
    disorders, which includes USP9X. This is the ONLY prospective individual-level
    data collection covering this disorder, and it is observational: there is no
    interventional trial of any therapy for MRXS99F, so `phase` is not
    applicable. Its relevance to this entry is that essentially every open
    question recorded here - quantified per-feature frequencies, adult natural
    history, quality-of-life measurement, and the unquantified childhood-cancer
    signal - is answerable from a registry of this design and from no other
    currently existing resource.

    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals displayed problems with speech and language, the severity of which was also across a wide spectrum, ranging from somewhat innocuous delay through to complete absence."
    explanation: Documents the target impairment and its severity range; the intervention itself has no disorder-specific evidence base.
- name: Physical and Occupational Therapy
  description: >
    Physiotherapy and occupational therapy address the hypotonia-related motor
    disability, which in some individuals is severe enough to require standing
    supports or a wheelchair. Aims are gait preservation, contracture
    prevention and functional independence.
  treatment_term:
    preferred_term: Physical therapy

genetic:
- name: USP9X
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: USP9X
    term:
      id: hgnc:12632
      label: USP9X
  notes: >
    USP9X (Xp11.4; ubiquitin specific peptidase 9 X-linked; formerly FAM, DFFRX)
    encodes a 2570-amino-acid substrate-specific deubiquitinase with a central
    ubiquitin-C-hydrolase (UCH) catalytic domain flanked by long N- and
    C-terminal substrate-recognition extensions. Reference transcript
    NM_001039590.2 / NP_001034679.2.

    Allelic spectrum in FEMALES with this entity: predominantly de novo complete
    loss-of-function - whole and partial gene deletions, nonsense, and early
    frameshift alleles - with missense and single-amino-acid in-frame deletions
    also established as pathogenic. Five of the eleven missense/in-frame
    variants characterised by Jolly et al. lay in the UCH catalytic domain, with
    structural modelling predicting disrupted catalysis and/or ubiquitin
    binding; the remainder lay in the N-terminal extension of largely unknown
    function. Mechanism is haploinsufficiency (loss of dosage). No
    gain-of-function mechanism is established; whether N-terminal female
    missense alleles retain residual function or act as dominant negatives is
    explicitly unresolved.

    Inheritance is de novo in the large majority. Two exceptions are documented
    and matter for counselling: transmission from a germline-mosaic mother, and
    transmission of a catalytic-domain missense allele from a non-mosaic,
    clinically unaffected mother - implying an unidentified penetrance modifier.
    Maternal testing is therefore indicated for recurrence-risk estimation even
    when a variant appears de novo.

    ENTITY BOUNDARY: the SAME gene causes MONDO:0010487 / OMIM:300919 (MRX99) in
    hemizygous males via partial-loss-of-function missense alleles. That is a
    different disease entry and is not curated here.
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report 17 females with de novo loss-of-function mutations in USP9X, encoding a highly conserved deubiquitinating enzyme."
    explanation: Gene-discovery cohort establishing the gene-disease relationship for the female entity.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we provide evidence of the contribution of USP9X missense and small in-frame deletion variants in USP9X-female syndrome also."
    explanation: Extends the causal allelic spectrum beyond null alleles to missense and in-frame deletions.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Combined application of variant prediction algorithms, protein structure modelling, and assessment under clinically relevant guidelines universally support their pathogenicity."
    explanation: >
      In-silico and structural support for the missense allele class. Classified
      COMPUTATIONAL because the pathogenicity assessment reported here is
      predictive/structural modelling, not a functional assay.
  - reference: PMID:33638286
    reference_title: 'Novel USP9X variant associated with syndromic intellectual disability in a female: A case study and review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous variants in USP9X are associated with female-restricted X-linked mental retardation (MRXS99F), a rare syndrome characterized by neurodevelopmental delay, intellectual disability (ID), and a wide variety of additional congenital anomalies."
    explanation: Independent statement binding USP9X to the MRXS99F entity curated here.
  - reference: CGGV:assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z
    reference_title: ClinGen Gene-Disease Validity assertion, USP9X - X-linked syndromic intellectual disability (Definitive, 2021-11-17)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "USP9X | HGNC:12632 | X-linked syndromic intellectual disability | MONDO:0020119 | XL | Definitive | SOP8 | Intellectual Disability and Autism Gene Curation Expert Panel"
    explanation: >
      ClinGen classifies the USP9X gene-disease relationship as Definitive. Cited
      for the gene-disease relationship ONLY: the assertion's disease anchor is
      the broader MONDO:0020119, because ClinGen's Intellectual Disability and
      Autism GCEP deliberately lumps the male and female USP9X disorders into a
      single curation, whereas this entry follows the OMIM/MONDO split
      (MONDO:0010502 female / MONDO:0010487 male). Its "XL" MOI label is
      likewise not adopted here - see the inheritance block. evidence_source is
      OTHER because the record is an expert-panel synthesis, not a primary study.
  - reference: CGGV:assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z
    reference_title: ClinGen Gene-Disease Validity assertion, USP9X - X-linked syndromic intellectual disability (Definitive, 2021-11-17)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The USP9X variants in females are predominantly null alleles leading to haploinsufficiency and causing a recognizable syndrome with intellectual disability and characteristic brain and congenital abnormalities"
    explanation: >
      ClinGen's own evidence summary states the female allelic spectrum and
      mechanism curated here (null alleles, haploinsufficiency), and - in the
      sentence immediately following - contrasts it with the predominantly
      missense, partial-loss-of-function male spectrum. Even while lumping the
      two presentations administratively, ClinGen describes the same
      allele-class boundary this entry uses to separate the entities.

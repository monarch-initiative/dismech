discussions:
- discussion_id: usp9x_female_penetrance_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What modifies penetrance in a heterozygous USP9X female, given that skewed X-inactivation has been excluded as the explanation?
  attaches_to:
  - pathophysiology#Female USP9X Haploinsufficiency
  rationale: >
    Two transmitting mothers are documented with pathogenic USP9X alleles and
    little or no phenotype - one germline mosaic, one non-mosaic - and two
    non-twin female siblings share a truncating allele with incomplete
    penetrance. The default explanation for variable female expression in
    X-linked disease, skewed X-inactivation, is explicitly ruled out by the
    authors because USP9X escapes X-inactivation, and X-inactivation studies in
    the informative case showed no skewing. RNA-Seq and quad exome analysis in
    the sibling pair failed to identify a candidate modifier. Without a
    mechanism, a heterozygous female relative or fetus cannot be counselled
    beyond a population-level ~95% penetrance figure.
  proposed_experiments:
  - experiment_id: allele_specific_usp9x_expression
    name: Allele-specific USP9X expression versus phenotype in heterozygous females
    description: >
      Quantify allele-specific USP9X expression and total USP9X protein in
      accessible tissues from affected versus unaffected heterozygous females
      carrying the same or comparable alleles, paired with quantitative
      X-inactivation assay and with tissue-specific escape measurement, to test
      whether residual USP9X dose rather than XCI ratio predicts phenotype.
    decision_criterion: >
      Residual USP9X dose separates affected from unaffected heterozygotes more
      cleanly than the X-inactivation ratio does.
    supporting_outcome:
    - Female manifestation is governed by quantitative residual USP9X dose, with tissue-variable escape as the source of variability.
    refuting_outcome:
    - Penetrance is governed by an independent trans-acting modifier locus rather than by USP9X dose.
- discussion_id: usp9x_turner_dosage_paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: If USP9X-female syndrome is caused by a simple 50% reduction in USP9X dosage, why do individuals with 45,X (Turner syndrome), who also carry a single USP9X allele, generally lack neurological manifestations?
  attaches_to:
  - pathophysiology#Female USP9X Haploinsufficiency
  rationale: >
    This is the strongest published challenge to the haploinsufficiency model
    and it comes from the same authors who advance that model. A 45,X individual
    has one USP9X allele, which on a naive dosage account should reproduce the
    neurological phenotype; it does not. Candidate reconciliations, none tested:
    (i) 45,X individuals up-regulate the single allele in a way a
    heterozygous-null female cannot, (ii) the relevant lesion is not steady-state
    dosage but allelic imbalance or timing during a narrow developmental window,
    (iii) 45,X and heterozygous-null differ in the co-inherited X content, or
    (iv) some female alleles are not clean nulls and exert a dominant-negative
    effect. Resolving this determines whether "haploinsufficiency" is the right
    label for the entry at all, so it is recorded here rather than glossed over.
  proposed_experiments:
  - experiment_id: usp9x_dosage_45x_vs_heterozygous_null
    name: USP9X protein and transcript dosage in 45,X versus heterozygous-null females
    description: >
      Measure total USP9X transcript and protein in matched accessible tissues
      from 45,X individuals, USP9X heterozygous-null females, and 46,XX controls,
      to test whether 45,X individuals in fact sustain a smaller dosage
      reduction than heterozygous-null females do.
    decision_criterion: >
      45,X individuals show USP9X protein levels significantly closer to 46,XX
      controls than heterozygous-null females do.
    supporting_outcome:
    - The paradox is apparent only, and 45,X does not in fact produce the same USP9X dosage state as a heterozygous null.
    refuting_outcome:
    - USP9X dosage is equivalent in the two states, so steady-state dosage cannot be the operative variable and a dominant-negative or timing-based mechanism must be invoked.
- discussion_id: usp9x_childhood_malignancy_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do individuals with USP9X-female syndrome carry an increased risk of childhood malignancy, and if so does it warrant a surveillance protocol?
  attaches_to:
  - pathophysiology#Female USP9X Haploinsufficiency
  rationale: >
    Two females with USP9X-female syndrome have been reported with childhood
    malignancy, and the authors raise the possibility that this is part of the
    natural course. The biological prior is not weak: USP9X is an established
    tumour suppressor, loss-of-function USP9X variants are enriched in somatic
    cancer catalogues, and the female germline alleles cluster in the same
    catalytic-domain positions as predicted-deleterious cancer variants. Against
    that, two cases in a literature of roughly 35 individuals is not an incidence
    estimate, and no cohort has been followed for cancer outcomes. The clinical
    stakes are asymmetric: if a real excess exists it is actionable through
    surveillance, and if it does not, families are being exposed to avoidable
    anxiety. No surveillance protocol exists and the risk is unquantified.
  proposed_experiments:
  - experiment_id: usp9x_registry_cancer_incidence
    name: Registry-based cancer incidence in USP9X-related neurodevelopmental disorder
    description: >
      Use a prospective registry cohort (Simons Searchlight includes USP9X) with
      cancer-registry linkage to estimate observed-versus-expected childhood
      cancer incidence in individuals with pathogenic USP9X variants, stratified
      by sex and allele class.
    decision_criterion: >
      Observed childhood cancer incidence significantly exceeds age- and
      sex-matched population expectation.
    supporting_outcome:
    - A germline tumour-predisposition component justifying a formal surveillance recommendation.
    refuting_outcome:
    - The two reported malignancies are coincidental and no surveillance is warranted.
- discussion_id: usp9x_ciliary_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does loss of ciliary USP9X function contribute to the extra-neural congenital malformations of this syndrome?
  attaches_to:
  - pathophysiology#Disrupted Extra-Neural Organogenesis
  rationale: >
    Several defining malformations - postaxial polydactyly, structural brain
    malformation, congenital heart defect - are shared with recognised
    ciliopathies, and endogenous USP9X was shown to localise along the length of
    the ciliary axoneme. Yet ciliary parameters were not dysregulated in
    fibroblasts derived from affected females, and the authors attribute this to
    spatiotemporal specificity of ciliary USP9X function rather than to absence
    of a ciliary role. The question matters because it is currently the only
    proposed mechanism for the extra-neural malformation branch, which is
    otherwise modelled with HYPOTHETICAL mechanism confidence and no identified
    substrate.
  proposed_experiments:
  - experiment_id: usp9x_cilia_developmental_tissue
    name: Ciliary phenotyping of USP9X-deficient cells in developmentally relevant lineages
    description: >
      Assay ciliogenesis, ciliary length and Hedgehog signal transduction in
      USP9X-haploinsufficient cells of lineages relevant to the affected organs
      (limb bud mesenchyme, cardiac progenitors, cranial neural crest) rather
      than in dermal fibroblasts, and at developmental rather than adult
      timepoints.
    decision_criterion: >
      A ciliary or Hedgehog-signalling defect is detectable in a
      malformation-relevant lineage despite being absent in adult fibroblasts.
    supporting_outcome:
    - A spatiotemporally restricted ciliary role for USP9X underlies the ciliopathy-like malformations.
    refuting_outcome:
    - The extra-neural malformations arise from non-ciliary USP9X substrates and the ciliary localisation is incidental.
- discussion_id: usp9x_female_tgfbeta_direct_evidence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Is the TGF-beta signalling defect that has been demonstrated in male partial-loss-of-function USP9X cells and in Usp9x-null mice actually present in cells from females with this entity?
  attaches_to:
  - pathophysiology#Attenuated TGF-beta Signalling
  rationale: >
    The TGF-beta arm is the best-developed mechanistic account of the
    neurological phenotype, but its human functional evidence comes entirely
    from MALE partial-loss-of-function patient fibroblasts (MONDO:0010487) and
    its in vivo evidence from Usp9x-knockout mice. The authors state the
    convergence onto the female syndrome as an explicit speculation, not a
    measurement. This is precisely the named-entity risk this entry guards
    against: importing male functional data as if it were female mechanism.
    Female-derived cells exist - the founding cohort performed expression and
    ciliary studies on them - so the experiment is tractable.
  proposed_experiments:
  - experiment_id: tgfbeta_response_female_fibroblasts
    name: TGF-beta pathway response in fibroblasts from females with USP9X null alleles
    description: >
      Repeat the TGF-beta luciferase reporter, nuclear SMAD4 translocation and
      scratch-migration assays used in the male cohort, on fibroblasts from
      females carrying bona fide USP9X null alleles, with matched female
      controls.
    decision_criterion: >
      Female USP9X-haploinsufficient fibroblasts show blunted TGF-beta reporter
      induction and reduced nuclear SMAD4 translocation comparable to the male
      partial-loss-of-function lines.
    supporting_outcome:
    - TGF-beta attenuation is a shared convergent mechanism across both USP9X entities and can be asserted for the female entity directly.
    refuting_outcome:
    - TGF-beta attenuation is specific to particular missense alleles in males and is not the mechanism of the female dosage-loss syndrome.
review_notes: >-
  Review preserved the strict female-entity boundary and the existing frequency
  discipline. All 19 retained pathophysiology edges now carry edge-level
  evidence and explicit causal-link types; the unsupported substrate-loss to
  extra-neural-organogenesis shortcut and the co-occurrence-only structural-brain
  to neurodevelopmental-impairment arrow were removed. Clinical manifestations
  without a defensible mechanistic bridge remain observational rather than being
  forced into the graph. Three conditional Usp9x mouse models are now represented
  structurally with explicit fidelity limitations, and the bibliography now
  lists all 26 sources actually cited by the entry. Management remains
  supportive: several phenotype-directed actions are explicitly marked PARTIAL
  because the sources establish the clinical need rather than disorder-specific
  intervention efficacy or surveillance intervals.

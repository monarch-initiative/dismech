- name: Reduced Cortical Dendritic Spine Density
  biological_scale: CELLULAR
  description: >
    A synapse-level deficit that persists after the upstream substrate
    abundances have normalised. In forebrain-specific Usp9x knockout mice
    ankyrin-repeat-domain proteins fall transiently at 2 weeks and recover by 12
    weeks, yet cortical spine density remains reduced into adulthood and the
    animals are hyperactive. This dissociation is mechanistically important: it
    implies a critical developmental window during which USP9X dose must be
    adequate, after which restoring substrate levels does not restore the
    structural or behavioural phenotype - an argument against any simple
    substrate-replacement therapeutic strategy.
  biological_processes:

- name: Antiseizure Pharmacotherapy
  description: >
    Epilepsy is reported within the neurological spectrum of this syndrome, so
    seizures should be asked about at every review and investigated with EEG
    when suspected. Treatment is conventional antiseizure medication chosen on
    seizure type: there is no USP9X-specific pharmacological guidance, no
    reported drug of choice and no reported drug to avoid, and no specific agent
    is therefore named here. The mechanistic literature offers no basis for
    extrapolation either: the one report in which manipulating USP9X improves
    seizures used a small-molecule USP9X INHIBITOR in prickle-mutant flies -
    the opposite dosage direction from this haploinsufficiency disorder - so it
    must not be read as a therapeutic suggestion for MRXS99F.

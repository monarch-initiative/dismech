- name: Destabilization of Cytoskeletal and Ankyrin-Repeat Neuronal Substrates
  biological_scale: CELLULAR
  description: >
    A third substrate class is structural rather than signalling. Unbiased
    proteomics of Usp9x-knockout neurons identifies disruption of the
    cytoskeleton as the principal consequence of Usp9x loss, and doublecortin
    (DCX), a canonical neuronal migration protein, is a USP9X interactor.
    Separately, USP9X deubiquitinates and stabilises ankyrin-G and other
    ankyrin-repeat-domain proteins at the synapse; forebrain Usp9x knockout mice
    show transient loss of these proteins but a persistent reduction in cortical
    spine density into adulthood, and human USP9X variants found in intellectual
    disability and autism abolish either catalytic activity or the ankyrin-G
    interaction.

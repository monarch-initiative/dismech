  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "ranging from unreported to severe disability, which in two individuals required standing supports or wheel chairs"
    explanation: Documents the severity of the motor target; no disorder-specific intervention trial exists.
- name: Neonatal Airway Assessment and Choanal Atresia Repair
  description: >
    Bilateral choanal atresia is a neonatal airway emergency because newborns
    are obligate nasal breathers; it requires urgent recognition and surgical
    repair. Because choanal atresia heads the list of malformations in this
    syndrome, any neonate with the phenotype warrants explicit nasal patency
    assessment. This is the most time-critical intervention in the disorder.
  treatment_term:
    preferred_term: Surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:

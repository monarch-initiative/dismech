      explanation: The cohort proposes this tissue-mosaic route but does not experimentally establish it.
- name: Blaschko-Linear Pigmentary Mosaicism and Body Asymmetry
  biological_scale: ORGANISM
  description: >
    Streaky hyper- and hypopigmentation following the lines of Blaschko, and
    asymmetry of the body, brain, breasts and limbs. Clinically this is a useful
    handle: in a girl with developmental delay and congenital anomalies,
    Blaschko-linear pigmentation should raise USP9X specifically, and it was one
    of the features that allowed several probands in the founding cohort to be
    diagnosed by targeted testing rather than untargeted exome sequencing.

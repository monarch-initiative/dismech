- name: Disrupted Extra-Neural Organogenesis
  biological_scale: ORGANISM
  description: >
    The feature that most sharply separates this entity from the male USP9X
    disorder. Reduced USP9X dosage during organogenesis produces a
    characteristic constellation of structural birth defects outside the CNS:
    choanal atresia, anal anomalies, postaxial polydactyly, congenital heart
    defects, hypomastia, cleft palate or bifid uvula, progressive scoliosis, and
    hip dysplasia or dislocation. Males with partial-loss-of-function USP9X
    missense variants share the neurological features but are largely spared
    these congenital malformations, which is direct clinical evidence that this
    branch is dosage-threshold dependent. The specific substrate(s) mediating
    each malformation are not established; because several of the features
    overlap known ciliopathies, a ciliary contribution has been proposed but not
    demonstrated (see discussions).
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The females in our study have a specific phenotype that includes ID/developmental delay (DD), characteristic facial features, short stature, and distinct congenital malformations comprising choanal atresia, anal abnormalities, post-axial polydactyly, heart defects, hypomastia, cleft palate/bifid uvula, progressive scoliosis, and structural brain abnormalities."
    explanation: Defines the extra-neural malformation constellation modelled at this node.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were similar between males and females, males were unlikely to have congenital presentations including skeletal and heart defects, among others"
    explanation: The male-female contrast that establishes this branch as female-entity-defining rather than shared USP9X biology.

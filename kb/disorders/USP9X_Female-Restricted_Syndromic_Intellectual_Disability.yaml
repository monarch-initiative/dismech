notes: >
  GENEREVIEWS BASELINE: searched PubMed on 2026-07-31 with
  `USP9X GeneReviews[All Fields]`, `USP9X[All Fields] AND GeneReviews[Book]`,
  and `USP9X-related neurodevelopmental disorder GeneReviews`. All returned
  zero results. No GeneReviews chapter exists for USP9X or for MRXS99F, so
  there is no GeneReviews phenotype baseline to cross-check and none is
  tagged in `references:`. The phenotype list here is instead anchored on the
  two largest systematic aggregations of affected females - Reijnders et al.
  2016 (PMID:26833328, the 17-female founding cohort that defined the syndrome)
  and Jolly et al. 2020 (PMID:33298948, which aggregates 35 females across
  null and missense/in-frame-deletion allele classes) - supplemented by
  individual case reports.

  FREQUENCY DISCIPLINE: the aggregated per-feature frequencies in Jolly et al.
  2020 are presented only as Sankey-plot terminal nodes in Figure 5, whose
  numeric values are not recoverable from the cached text. Frequency bands are
  therefore asserted ONLY where a quotable sentence states a proportion
  qualitatively ("in all individuals", "in almost all individuals"), and the
  band is scoped in the evidence explanation to the cohort the sentence is
  about. Where no such sentence exists the `frequency:` slot is deliberately
  omitted rather than guessed. No population prevalence estimate exists.

  NOT CURATED FOR WANT OF SOURCING: quantitative per-feature frequencies for
  the full 35-female aggregate; genotype-phenotype correlation by variant
  position (asserted as absent of striking hotspots but not quantified for
  clinical severity); natural history and adult outcomes, for which no
  longitudinal cohort exists; and any disease-modifying therapy, of which there
  is none.

  DEEP RESEARCH PROVENANCE: `just research-disorder claude_code
  USP9X_Female-Restricted_Syndromic_Intellectual_Disability` (report at
  research/USP9X_Female-Restricted_Syndromic_Intellectual_Disability-deep-research-claude_code.md;
  24m49s, 106 turns, 24 citations). Every PMID and snippet taken from that
  report was independently re-fetched with `just fetch-reference` and
  re-verified as a byte-exact substring of the cached text before use; the
  report's own "[PARAPHRASE - DO NOT USE AS SNIPPET]" items were discarded
  rather than repaired.

  TWO UPSTREAM DATA ISSUES SURFACED BY THE RESEARCH RUN (recorded, not acted on
  here): (1) MONDO appears to carry a second, un-merged term for this entity,
  MONDO:0018821 ("X-linked female restricted facial dysmorphism-short
  stature-choanal atresia-intellectual disability"), derived from the Orphanet
  branch, alongside the OMIM-derived MONDO:0010502 used here. This entry uses
  MONDO:0010502 because that is the term carrying the OMIM:300968 xref and the
  RO:0004003 USP9X gene relation. A MONDO merge request is warranted. (2)
  ClinGen's Intellectual Disability and Autism GCEP deliberately LUMPS the male
  and female USP9X disorders into one gene-disease assertion
  (CGGV:assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z,
  Definitive, 2021-11-17, now cited in `genetic:` and `inheritance:`) anchored
  on the broader MONDO:0020119, and additionally labels the female mode of
  inheritance "X-linked recessive", whereas OMIM/MONDO/Orphanet split the two
  entities and HPO/OMIM annotate the female entity as X-linked dominant. dismech
  follows the OMIM/MONDO split. This entry additionally declines BOTH the
  "dominant" and "recessive" labels for the reasons set out in the
  `inheritance:` block, so it is neither ClinGen's position nor OMIM's verbatim.
  The disagreement is recorded rather than silently resolved. Note that the
  ClinGen record's own evidence summary nonetheless describes exactly the
  allele-class boundary this entry uses (female null alleles versus male
  partial-loss-of-function missense), so the disagreement is administrative
  (one disease anchor versus two) rather than biological. ClinGen's separate
  dosage curation (CGDS:HGNC_12632, haploinsufficiency score 3, 2024-11-27) is
  cited on the haploinsufficiency and male-lethality pathophysiology nodes.

  OMIM NUMBER DISCREPANCY IN A CITED SOURCE: the authoritative OMIM number for
  this entity is 300968, which is the `OMIM:` xref carried by MONDO:0010502 and
  is what this entry uses. PMID:35253988 writes "MIM 300969, also known as
  MRX99F" in its abstract; 300969 is a different OMIM entry and this is an error
  in that paper. The paper is nonetheless clearly about this entity (its title
  and subject are female-specific syndromic ID caused by a truncating USP9X
  variant), so it is retained, but the OMIM digit in its abstract should not be
  propagated.

  MALE-DERIVED EVIDENCE: PMID:31443933 (Johnson et al. 2020) and PMID:24607389
  (Homan et al. 2014) are studies of the MALE entity (MRX99, MONDO:0010487).
  They are cited here only for (a) statements those papers make explicitly
  about the female syndrome, and (b) the differential-diagnosis contrast. They
  are never used as the sole support for a female phenotype.
pathophysiology:
- name: USP9X Loss-of-Function Allele
  biological_scale: MOLECULAR
  description: >
    The single upstream lesion from which both arms of this entity's biology
    fan out. USP9X (Xp11.4) encodes a 2570-amino-acid substrate-specific
    ubiquitin-specific protease. The gene sits in the top 5% of evolutionarily
    constrained human genes and is highly intolerant to variation
    (pLI = 1.0). Female-associated alleles are predominantly complete
    loss-of-function - whole or partial gene deletions, nonsense and early
    frameshift variants - with missense and single-amino-acid deletion variants
    in the catalytic ubiquitin-C-hydrolase domain and the N-terminal extension
    now also established as causal. The two downstream branches modelled here
    are not a chain but a fork determined by zygosity: a hemizygous male null is
    not compatible with development, whereas a heterozygous female null produces
    a viable haploinsufficient state. That fork is why the entity is
    female-restricted.
  gene:
    preferred_term: USP9X
    term:
      id: hgnc:12632
      label: USP9X
  molecular_functions:
  - preferred_term: cysteine-type deubiquitinase activity
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report 17 females with de novo loss-of-function mutations in USP9X, encoding a highly conserved deubiquitinating enzyme."
    explanation: The founding cohort establishing de novo USP9X loss-of-function as the cause of this female entity.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is ranked among the top 5% of evolutionary constrained genes and is highly intolerant to variation"
    explanation: Quantifies the constraint that makes USP9X dosage-sensitive and supports a loss-of-function mechanism.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While males are impacted primarily by hemizygous partial loss-of-function missense variants, in females de novo heterozygous complete loss-of-function mutations predominate, and give rise to the clinically recognisable USP9X-female syndrome."
    explanation: States the allele-class fork - complete LOF in females versus partial LOF missense in males - that separates this entity from MRX99.
  downstream:
  - target: Hemizygous Male Lethality of Null Alleles
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33298948
      reference_title: Missense variant contribution to USP9X-female syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Such LOF alleles are likely to never be observed in a male as complete loss of USP9X, as would be the case of a hemizygous male, is known to result in early embryonic lethality in at least mouse"
      explanation: Supports the survivorship filter produced by a hemizygous null allele.
  - target: Female USP9X Haploinsufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26833328
      reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Expression studies on both mRNA and protein level in affected-female-derived fibroblasts showed significant reduction of USP9X level, confirming the loss-of-function effect of the identified mutations."
      explanation: Patient-derived cells directly demonstrate reduced USP9X dosage from the heterozygous loss-of-function alleles.
- name: Hemizygous Male Lethality of Null Alleles
  biological_scale: ORGANISM
  description: >
    A complete USP9X null allele in a hemizygous male leaves no functional
    protein at all. USP9X (formerly FAM) is required for the earliest stages of
    mammalian development: antisense depletion of FAM in two-cell mouse embryos
    prevents blastocyst formation, and the gene is essential for embryonic
    viability. Consequently the null alleles that define this syndrome are
    expected never to be ascertained in a liveborn male. This node is not a
    disease mechanism in an affected patient - it is the survivorship filter
    that makes the entity female-restricted, and it is the single most important
    reason this disorder must not be modelled as ordinary X-linked dominance.
  biological_processes:
  - preferred_term: blastocyst formation
    term:
      id: GO:0001825
      label: blastocyst formation
    modifier: DECREASED
  evidence:
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such LOF alleles are likely to never be observed in a male as complete loss of USP9X, as would be the case of a hemizygous male, is known to result in early embryonic lethality in at least mouse"
    explanation: States the survivorship argument explicitly and attributes it to the mouse embryonic-lethality data.
  - reference: PMID:11731229
    reference_title: FAM deubiquitylating enzyme is essential for preimplantation mouse embryo development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure of two-cell embryos to FAM-specific antisense, but not sense, oligodeoxynucleotides resulted in depletion of the FAM protein and failure of the embryos to develop to blastocysts."
    explanation: The primary experimental basis for USP9X/FAM being essential at the earliest developmental stages; mouse data, hence MODEL_ORGANISM.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is essential for embryonic viability"
    explanation: Independent restatement of USP9X essentiality in the female-syndrome paper.
  - reference: PMID:40751225
    reference_title: 'c.7156C > T p.(Gln2386*) variant causes loss-of-function of the USP9X gene in a female-restricted X-linked syndromic intellectual disability: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variants in male individuals have never been reported"
    explanation: >
      The key human observation underpinning this node - the complete absence of
      male LOF alleles in the reported literature, which is what a survivorship
      filter predicts.
  - reference: PMID:30997057
    reference_title: Whole-exome sequencing reveals novel USP9X variant in female fetus with isolated agenesis of the corpus callosum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, loss‐of‐function variants have not been reported in affected males nor in the population database Exome Aggregation Consortium (ExAC) suggesting hemizygous loss‐of‐function variants in USP9X in males cause prenatal or neonatal demise."
    explanation: >
      Independent statement of the same inference, adding the population-database
      argument (absence from ExAC) to the clinical-literature argument.
  - reference: PMID:30997057
    reference_title: Whole-exome sequencing reveals novel USP9X variant in female fetus with isolated agenesis of the corpus callosum.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "USP9X is required for neural development and in vivo studies reveal whole‐brain depletion of USP9X causes postnatal lethality in male mice."
    explanation: >
      Mouse corroboration of lethality on complete loss. Marked PARTIAL because
      whole-brain conditional depletion causing postnatal lethality is not the
      same claim as whole-organism embryonic lethality; it supports the direction
      but not the precise developmental stage.
  - reference: CGDS:HGNC_12632
    reference_title: ClinGen Dosage Sensitivity curation, USP9X (HGNC:12632)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Multiple studies note the lack of observed true loss-of-function variants in males with USP9X-related intellectual disability, suggesting the possibility that loss of USP9X is male-lethal"
    explanation: >
      ClinGen's dosage-curation narrative reaches the same survivorship
      inference from the same observation (no true male LOF alleles reported).
      Marked PARTIAL because ClinGen states it as a possibility rather than an
      established fact, which matches how this node is framed. evidence_source
      is OTHER (expert-panel synthesis).
- name: Female USP9X Haploinsufficiency
  biological_scale: MOLECULAR
  description: >
    In a heterozygous female one USP9X allele is null (or functionally null) and
    the other is intact. For a gene subject to X-inactivation this would produce
    a mosaic of wild-type and mutant cells. USP9X, however, escapes
    X-inactivation, so both alleles are normally expressed and the intact allele
    cannot be up-regulated to compensate. The result is a true, cell-autonomous
    dosage reduction rather than a mosaic. This has been confirmed directly:
    mRNA and protein studies in fibroblasts from affected females show
    significantly reduced USP9X levels. Female penetrance is high but not
    complete - approximately 95% - and at least two transmitting mothers with
    minimal or no features are documented, one germline mosaic and one not,
    implying an unidentified modifier.
  biological_processes:
  - preferred_term: dosage compensation by inactivation of X chromosome
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
    modifier: ABSENT
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USP9X is an X-chromosome gene that escapes X-inactivation."
    explanation: Establishes the escape-from-X-inactivation premise on which the haploinsufficiency model depends.
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression studies on both mRNA and protein level in affected-female-derived fibroblasts showed significant reduction of USP9X level, confirming the loss-of-function effect of the identified mutations."
    explanation: Direct measurement of reduced USP9X dosage in patient-derived cells, the core evidence for haploinsufficiency.
  - reference: CGDS:HGNC_12632
    reference_title: ClinGen Dosage Sensitivity curation, USP9X (HGNC:12632)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "USP9X | HGNC:12632 | 8239 | Xp11.4 | chrX:41085445-41236579 | 3 - Sufficient Evidence for Haploinsufficiency | 0 - No Evidence for Triplosensitivity | 2024-11-27"
    explanation: >
      ClinGen's expert-panel dosage curation scores USP9X haploinsufficiency 3
      ("Sufficient Evidence"), the strongest available structured attestation of
      the dosage mechanism this node asserts, and scores triplosensitivity 0
      (no evidence), which is why no gain-of-dosage arm is modelled.
      evidence_source is OTHER because the record is an expert-panel synthesis
      of published evidence, not a primary study.
  - reference: PMID:31443933
    reference_title: Partial Loss of USP9X Function Leads to a Male Neurodevelopmental and Behavioral Disorder Converging on Transforming Growth Factor beta Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USP9X escapes X inactivation, and in female subjects de novo heterozygous copy number loss or truncating mutations cause haploinsufficiency culminating in a recognizable syndrome with intellectual disability and signature brain and congenital abnormalities."
    explanation: >
      Although this paper's own subjects are male, this sentence is an explicit
      statement about the female entity and is used only for that claim.
  - reference: PMID:35253988
    reference_title: Exome and RNA-Seq analyses of an incomplete penetrance variant in USP9X in female-specific syndromic intellectual disability.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While the penetrance of pathogenic variants in USP9X in female appears to be high (95%) and the variants frequently occur de novo, incomplete penetrance should be considered."
    explanation: Qualifies the haploinsufficiency model - dosage reduction is necessary but not always sufficient; penetrance is ~95%, not complete.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "mechanism of USP9X-female NDD is not supported by e.g. phenotypes observed in Turner Syndrome with XO sex chromosome karyotype, which generally lack neurological manifestations"
    explanation: >
      A genuine counterargument, recorded rather than suppressed. Individuals
      with 45,X have a single USP9X allele - nominally the same dosage state as
      a heterozygous null - yet generally lack neurological manifestations. This
      is an argument against a simple, whole-body 50%-dosage model and is the
      reason this node is not asserted as a closed mechanism. See the
      corresponding entry under discussions.
  downstream:

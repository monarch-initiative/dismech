    evidence_source: HUMAN_CLINICAL
    snippet: "distinct congenital malformations comprising choanal atresia, anal abnormalities, post-axial polydactyly, heart defects"
    explanation: >
      Establishes choanal atresia as a defining feature requiring assessment.
      The surgical management itself is general paediatric-otolaryngology
      practice with no disorder-specific evidence, hence PARTIAL.
- name: Anorectal Malformation Repair
  description: >
    Anal anomaly is one of the six malformations named in every published
    definition of this syndrome, so the newborn examination must include
    inspection of the anus and assessment of patency and position. An
    imperforate or ectopic anus requires paediatric-surgical correction, with
    the operative approach (anoplasty, or staged repair with a covering
    stoma) determined by the specific anatomy. No USP9X-specific surgical
    series exists; this is standard paediatric-surgical practice applied to a
    malformation whose disorder-specific significance is that it is
    definitional rather than incidental. Note that the published sources say
    "anal abnormalities" without consistently specifying atresia, so this entry
    is scoped to the malformation set as reported rather than to anal atresia
    specifically.

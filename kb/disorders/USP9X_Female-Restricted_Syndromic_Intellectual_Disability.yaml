inheritance:
- name: X-linked inheritance with female-restricted expression
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    The neutral HPO X-linked term is used deliberately. OMIM annotates this
    entry as "X-linked dominant" and some case reports repeat that label, but
    neither classical X-linked dominant nor X-linked recessive describes the
    biology here.

    It is not conventional X-linked dominance because a hemizygous male is not
    a more severely affected patient but a non-viable conceptus - complete USP9X
    loss is incompatible with early development - so the disorder is restricted
    to heterozygous females by a survivorship filter rather than by a dominance
    relationship between alleles.

    It is not X-linked recessive with manifesting carriers either, because
    USP9X escapes X-inactivation: both alleles are normally expressed, so a
    heterozygous female sustains a true ~50% dosage reduction in every cell
    rather than a mosaic of wild-type and null cells. The residual mosaicism
    that IS observed (Blaschko-linear pigmentation, body asymmetry) reflects
    tissue-variable degree of escape, not classical Lyonisation.

    Penetrance in females is high but incomplete, estimated at approximately
    95%. Variants are de novo in the large majority; documented exceptions
    include a germline-mosaic mother and a non-mosaic clinically unaffected
    transmitting mother, so maternal testing is warranted for recurrence-risk
    counselling. Expressivity is wide, from a terminated fetus with multiple
    malformations to an individual largely meeting milestones, and is not
    predicted by allele class.
  evidence:
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USP9X is an X-chromosome gene that escapes X-inactivation."
    explanation: The escape-from-X-inactivation fact that rules out a standard X-linked recessive/manifesting-carrier framing.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One possible candidate is skewing of X-inactivation, but USP9X is known to escape X-inactivation."
    explanation: The authors themselves reject skewed X-inactivation as the explanation for variable female expression.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such LOF alleles are likely to never be observed in a male as complete loss of USP9X, as would be the case of a hemizygous male, is known to result in early embryonic lethality in at least mouse"
    explanation: The survivorship argument that makes the entity female-restricted rather than X-linked dominant.
  - reference: PMID:35253988
    reference_title: Exome and RNA-Seq analyses of an incomplete penetrance variant in USP9X in female-specific syndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the penetrance of pathogenic variants in USP9X in female appears to be high (95%) and the variants frequently occur de novo, incomplete penetrance should be considered"
    explanation: Sources both the ~95% penetrance estimate and the predominantly de novo origin.
  - reference: CGGV:assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z
    reference_title: ClinGen Gene-Disease Validity assertion, USP9X - X-linked syndromic intellectual disability (Definitive, 2021-11-17)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The gene is located on chromosome X, but it escapes X-chromosome inactivation. Therefore, pathogenic variants in USP9X have been associated with X-linked syndromic intellectual disability in both females and males."
    explanation: >
      Independent expert-panel statement of the escape-from-X-inactivation
      premise underlying this inheritance model. Marked PARTIAL because the same
      record labels the mode of inheritance simply "XL" and lumps the male and
      female presentations, which this entry does not adopt; only the
      XCI-escape clause is used.
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >
    A single quoted estimate of approximately 1 in 1,000,000 live births. This
    is an estimate stated in the introduction of a case report, not the output
    of a population study, and should be treated as an order-of-magnitude figure
    only. It is very likely an underestimate: the entity was delineated only in
    2016, ascertainment depends entirely on exome or genome sequencing, and the
    mild end of the spectrum (an individual largely meeting developmental
    milestones is documented) is systematically under-diagnosed.
  evidence:
  - reference: PMID:40751225
    reference_title: 'c.7156C > T p.(Gln2386*) variant causes loss-of-function of the USP9X gene in a female-restricted X-linked syndromic intellectual disability: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is an ultrarare neurodevelopmental disorder, with an estimated incidence of 1:1,000,000 live births"
    explanation: The only quantitative occurrence estimate available for this disorder.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >
    No population-based prevalence or incidence estimate exists. The literature
    quantifies the disorder only by cumulative case count: 17 females in the
    founding cohort (2016), rising to an aggregate of 35 females with predicted
    pathogenic USP9X variation by 2020, with individual case reports since from
    Thailand, Japan, Brazil, China and elsewhere. Reported cases show no founder
    effect or geographic clustering; the apparent distribution tracks access to
    trio exome sequencing. The 2025 case-report literature describes the
    disorder as ultrarare.
  evidence:
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggregate phenotypic information of 35 currently known females with predicted pathogenic variation in USP9X reaffirms the clinically recognisable USP9X-female syndrome"
    explanation: Gives the cumulative case count as of 2020, the only quantification available.
  - reference: PMID:40751225
    reference_title: 'c.7156C > T p.(Gln2386*) variant causes loss-of-function of the USP9X gene in a female-restricted X-linked syndromic intellectual disability: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Female-restricted X-linked syndromic intellectual developmental disorder-99 is an ultrarare neurodevelopmental disorder linked to X"
    explanation: Contemporary characterisation of the disorder as ultrarare.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >
    Molecular testing is definitive; there are no formal clinical diagnostic
    criteria. Trio-based exome or genome sequencing is the appropriate
    first-line test for a girl with unexplained developmental delay plus
    congenital anomalies, and the trio design matters because the large
    majority of variants are de novo. Chromosomal microarray covers the whole-
    and partial-gene deletion fraction, which sequencing may miss. Maternal
    testing should follow even an apparently de novo result, because germline
    mosaicism and non-penetrant maternal transmission are both documented.
  evidence:
  - reference: PMID:40751225
    reference_title: 'c.7156C > T p.(Gln2386*) variant causes loss-of-function of the USP9X gene in a female-restricted X-linked syndromic intellectual disability: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Various genetic tests were performed, but only whole exome sequencing revealed a pathogenic variant in the USP9X gene"
    explanation: Demonstrates that exome sequencing succeeded where other genetic tests failed in a real diagnostic pathway.
  - reference: PMID:40751225
    reference_title: 'c.7156C > T p.(Gln2386*) variant causes loss-of-function of the USP9X gene in a female-restricted X-linked syndromic intellectual disability: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the de novo nature of most loss-of-function variants, maternal testing is crucial for estimating recurrence risk."
    explanation: Sources the maternal-testing recommendation.
  - reference: PMID:41240171
    reference_title: A rare variant of USP9X associated with female-restricted X-linked syndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reinforces the utility of whole-genome sequencing in early diagnosis and genetic counseling"
    explanation: Supports genome sequencing as a diagnostic route, including in the neonatal period.
- name: Phenotype-Directed Targeted USP9X Testing
  description: >
    The gestalt is distinctive enough to be recognised prospectively. In the
    founding cohort four of seventeen females were ascertained by targeted USP9X
    testing because the clinician recognised the phenotype. The combination that
    should trigger this is a girl with developmental delay, the characteristic
    facial features, Blaschko-linear pigmentary change or body asymmetry, and
    one or more of choanal atresia, anal anomaly, postaxial polydactyly or
    hypomastia.
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four females from our cohort were identified by targeted genetic testing because their phenotype was suggestive for USP9X mutations."
    explanation: Direct evidence that the phenotype is recognisable enough to drive targeted testing.
- name: Prenatal Exome Sequencing After Anomalous Ultrasound
  description: >
    Prenatal diagnosis is achievable and has changed management. A USP9X variant
    was identified by whole-exome sequencing in a female fetus whose only
    ultrasound finding was isolated agenesis of the corpus callosum, following a
    normal chromosomal microarray. Because the callosal anomaly affects more
    than half of reported females and is detectable on fetal imaging, USP9X
    belongs on the gene list for prenatal exome sequencing performed for fetal
    corpus callosum anomalies, ventriculomegaly, polydactyly or a cardiac
    defect. Note the ascertainment caveat that follows from this: a fetus
    identified on an isolated imaging finding may lie anywhere on a very wide
    severity spectrum, and the finding does not predict outcome.
  evidence:
  - reference: PMID:30997057
    reference_title: Whole-exome sequencing reveals novel USP9X variant in female fetus with isolated agenesis of the corpus callosum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing in a female fetus detected a USP9X variant. This X-linked gene was recently associated with intellectual disability and distinct pattern of malformation in females."
    explanation: Documents prenatal molecular ascertainment of this entity.
  - reference: PMID:30997057
    reference_title: Whole-exome sequencing reveals novel USP9X variant in female fetus with isolated agenesis of the corpus callosum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated agenesis of the corpus callosum has not been reported in association with USP9X. Identifying this variant impacted management of the subsequent pregnancy."
    explanation: >
      Establishes both the expansion of the prenatal phenotype to isolated
      callosal agenesis and the clinical actionability of the prenatal result.
  - reference: PMID:30997057
    reference_title: Whole-exome sequencing reveals novel USP9X variant in female fetus with isolated agenesis of the corpus callosum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this report highlights an emerging role of whole‐exome sequencing in cases of ultrasound anomalies following normal chromosomal microarray"
    explanation: States the diagnostic-pathway position of prenatal exome sequencing relative to microarray.
differential_diagnoses:
- name: Intellectual disability, X-linked 99 (MRX99, USP9X male entity)
  disease_term:
    preferred_term: intellectual disability, X-linked 99
    term:
      id: MONDO:0010487
      label: intellectual disability, X-linked 99
  description: >
    THE critical distinction for this entry, and the reason the entry carries an
    explicit scope note. Same gene (USP9X), different MONDO entity, different
    OMIM number (300919 versus 300968), different sex, different allele class,
    and a materially different phenotype. Affected males carry hypomorphic
    partial-loss-of-function missense alleles, frequently inherited from
    unaffected mothers; affected females carry de novo complete
    loss-of-function alleles. The two share the core neurological picture -
    global delay, speech and language impairment, hypotonia, thin corpus
    callosum, widened ventricles - but males are largely spared the skeletal,
    cardiac and other congenital malformations that define the female syndrome.
    Because the two literatures are co-published by overlapping author groups
    and routinely cited together, a curation or a clinical summary that blends
    them will silently import male phenotype frequencies and male functional
    data into the female entity. They must be kept separate.
  distinguishing_features:
  - Affects hemizygous males; this entity affects heterozygous females
  - OMIM:300919 / MONDO:0010487 versus OMIM:300968 / MONDO:0010502
  - Hypomorphic missense (partial loss of function) versus complete loss of function
  - Frequently maternally inherited from an unaffected mother versus predominantly de novo
  - Congenital skeletal, cardiac, choanal and anal malformations are rare or absent in males but definitional in females
  - Blaschko-linear pigmentary mosaicism and body asymmetry are female-specific, being a consequence of tissue-variable X-inactivation escape
  evidence:
  - reference: PMID:31443933
    reference_title: Partial Loss of USP9X Function Leads to a Male Neurodevelopmental and Behavioral Disorder Converging on Transforming Growth Factor beta Signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data demonstrate the involvement of USP9X variants in a distinctive neurodevelopmental and behavioral syndrome in male subjects"
    explanation: Establishes the male disorder as a distinct entity in its own right.
  - reference: PMID:33298948
    reference_title: Missense variant contribution to USP9X-female syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were similar between males and females, males were unlikely to have congenital presentations including skeletal and heart defects, among others"
    explanation: The direct male-versus-female phenotype comparison that separates the two entities clinically.
  - reference: PMID:24607389
    reference_title: Mutations in USP9X are associated with X-linked intellectual disability and disrupt neuronal cell migration and growth.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, as part of a large systematic resequencing of the X chromosome in 208 unrelated families with nonsyndromic X-linked intellectual disability, we identified three unique variants (two missense and one protein truncating) in USP9X."
    explanation: The original MRX99 ascertainment - nonsyndromic X-linked ID families, i.e. an entirely different ascertainment frame from the female syndrome.
  - reference: CGGV:assertion_bd411e83-8373-44b7-8ad5-00894c873880-2021-11-17T110000.000Z
    reference_title: ClinGen Gene-Disease Validity assertion, USP9X - X-linked syndromic intellectual disability (Definitive, 2021-11-17)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, the majority of the reported variants in males are missense variants with partial loss of function, resulting in a distinctive neurodevelopmental and behavioral syndrome"
    explanation: >
      ClinGen states the same male-versus-female allele-class and phenotype
      contrast that this differential rests on, even though its own curation
      administratively lumps the two under one disease anchor
      (MONDO:0020119). Recording it here keeps the lump-versus-split
      disagreement visible at the point where it matters.
- name: CHARGE syndrome
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  description: >
    The most important non-USP9X differential, because choanal atresia plus
    congenital heart defect plus developmental delay is the classic CHARGE
    triad and is also a common presentation of this syndrome. CHD7 sequencing
    will typically have been sent first. Blaschko-linear pigmentation, body
    asymmetry, hypomastia and postaxial polydactyly point away from CHARGE and
    towards USP9X.
  distinguishing_features:
  - Caused by CHD7 variants, autosomal dominant, not X-linked
  - Coloboma and semicircular canal hypoplasia are cardinal in CHARGE and not features of this syndrome
  - Affects both sexes, unlike the female restriction of this entity
  - Lacks Blaschko-linear pigmentary mosaicism and body asymmetry
  evidence:
  - reference: PMID:20301296
    reference_title: CHD7 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mnemonic CHARGE syndrome, introduced in the premolecular era, stands for coloboma, heart defect, choanal atresia, retarded growth and development, genital hypoplasia, ear anomalies (including deafness)."
    explanation: >
      The GeneReviews CHD7 Disorder chapter establishes the CHARGE feature set.
      Choanal atresia, heart defect and growth/developmental delay are shared
      with this USP9X entity, which is why CHARGE is the leading non-USP9X
      differential; coloboma and genital hypoplasia are the discriminators.
  - reference: PMID:20301296
    reference_title: CHD7 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHD7 disorder is an autosomal dominant disorder typically caused by a de novo pathogenic variant."
    explanation: Confirms the autosomal dominant, both-sexes inheritance that separates CHARGE from this female-restricted X-linked entity.
- name: Ciliopathy spectrum disorders
  description: >
    Included as a differential precisely because the founding cohort raised it:
    postaxial polydactyly, structural brain malformation and congenital heart
    defect are shared with recognised ciliopathy syndromes, and USP9X was shown
    to localise along the ciliary axoneme. However, ciliary parameters were NOT
    dysregulated in affected-female fibroblasts, so a ciliary mechanism is
    unproven and this remains a phenotypic overlap rather than an established
    mechanistic relationship. Listed here so that a clinician who has excluded
    Bardet-Biedl or Joubert syndrome does not stop the differential there.
  distinguishing_features:
  - Retinal dystrophy and cystic kidney disease, cardinal in many ciliopathies, are not features of this syndrome
  - Ciliary parameters are not dysregulated in fibroblasts from affected females
  - Female restriction and Blaschko-linear pigmentation are not ciliopathy features
  evidence:
  - reference: PMID:26833328
    reference_title: De Novo Loss-of-Function Mutations in USP9X Cause a Female-Specific Recognizable Syndrome with Developmental Delay and Congenital Malformations.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Absence of dysregulated ciliary parameters in affected female-derived fibroblasts, however, points toward spatiotemporal specificity of ciliary USP9X (dys-)function."
    explanation: The negative functional result that keeps the ciliopathy relationship at the level of phenotypic overlap rather than shared mechanism.
animal_models:
- name: Neural-progenitor Usp9x conditional knockout mouse
  species: Mus musculus
  genotype: Nestin-Cre; Usp9x conditional knockout in neural progenitors and their progeny
  category: Conditional loss-of-function neurodevelopmental model
  publication: PMID:23861879
  modeled_mechanisms:
  - target: Attenuated TGF-beta Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Neural Usp9x loss impairs TGF-beta-dependent axon growth in vivo and in
      vitro.
    limitations: >-
      Complete lineage-restricted loss in male mice differs from the partial,
      heterozygous dosage reduction and X-inactivation mosaicism in affected
      females.
  - target: Disorganized Cortical and Hippocampal Neurogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Conditional loss disrupts ventricular-zone, subventricular-zone, cortical,
      and hippocampal organization.
    limitations: >-
      Complete lineage-restricted loss in male mice differs from the partial,
      heterozygous dosage reduction and X-inactivation mosaicism in affected
      females.
  notes: >-
    Whole-brain neural-progenitor deletion is a complete, lineage-restricted loss
    in male mice and causes early postnatal lethality; affected human females are
    heterozygous and retain partial USP9X dosage.
  evidence:
  - reference: PMID:23861879
    reference_title: "Loss of Usp9x disrupts cortical architecture, hippocampal development and TGFβ-mediated axonogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mating Usp9x(loxP/loxP) mice with mice expressing Cre recombinase from the
      Nestin promoter deleted Usp9x throughout the entire brain, and resulted in
      early postnatal lethality.
    explanation: Directly establishes the conditional knockout model and its principal limitation.
  - reference: PMID:23861879
    reference_title: "Loss of Usp9x disrupts cortical architecture, hippocampal development and TGFβ-mediated axonogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      loss of Usp9x disrupted the cellular organization of the ventricular and
      sub-ventricular zones, and cortical plate
    explanation: Supports the modeled neurodevelopmental tissue phenotype.
- name: Neural-progenitor Usp9x knockout Wnt-Notch model
  species: Mus musculus
  genotype: Nestin-Cre; Usp9x-/Y embryonic neural-progenitor knockout
  category: Conditional pathway and progenitor-fate model
  publication: PMID:28808228
  modeled_mechanisms:
  - target: Dysregulated Wnt and Notch Signalling in Neural Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces altered β-catenin/Wnt output, reduced Itch and Numb,
      increased Notch intracellular domain, and increased Hes5 expression.
    limitations: >-
      The complete male neural-progenitor knockout does not reproduce female
      heterozygous dosage, X-chromosome escape, or tissue mosaicism.
  notes: >-
    This is a complete male neural-lineage knockout, whereas the human disorder
    reflects heterozygous dosage reduction in females.
  evidence:
  - reference: PMID:28808228
    reference_title: "Loss of Usp9x disrupts cell adhesion, and components of the Wnt and Notch signaling pathways in neural progenitors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nestin-cre mediated ablation of Usp9x from embryonic neural progenitors in
      vivo resulted in a transient disruption of cell adhesion and apical-basal
      polarity and, an increased number and ectopic localisation of intermediate
      neural progenitors.
    explanation: Establishes the conditional model and its progenitor-level phenotype.
- name: Forebrain-specific Usp9x knockout dendritic-spine model
  species: Mus musculus
  genotype: Forebrain-specific Usp9X-/Y knockout
  category: Conditional synaptic-development model
  publication: PMID:31813652
  modeled_mechanisms:
  - target: Destabilization of Cytoskeletal and Ankyrin-Repeat Neuronal Substrates
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces transient ankyrin-repeat protein loss and increased
      ankyrin-G ubiquitination after Usp9x deletion.
    limitations: >-
      Complete forebrain-restricted loss in a male mouse differs in dosage,
      spatial scope, and X-inactivation context from the human female disorder.
  - target: Reduced Cortical Dendritic Spine Density
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cortical spine-density loss persists into adulthood despite recovery of
      the transient substrate deficit.
    limitations: >-
      Complete forebrain-restricted loss in a male mouse differs in dosage,
      spatial scope, and X-inactivation context from the human female disorder.
  notes: >-
    Complete forebrain loss in a male mouse is more severe and more spatially
    restricted than heterozygous female human haploinsufficiency.
  evidence:
  - reference: PMID:31813652
    reference_title: Usp9X Controls Ankyrin-Repeat Domain Protein Homeostasis during Dendritic Spine Development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In forebrain-specific Usp9X knockout mice (Usp9X-/Y), ankyrin-G as well as
      multiple ankyrin-repeat domain (ANKRD)-containing proteins are transiently
      reduced at 2 but recovered at 12 weeks postnatally.
    explanation: Establishes the conditional knockout and transient substrate phenotype.
  - reference: PMID:31813652
    reference_title: Usp9X Controls Ankyrin-Repeat Domain Protein Homeostasis during Dendritic Spine Development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, reduced cortical spine density in knockouts persists into adulthood."
    explanation: Supports the persistent synaptic structural phenotype.
treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >
    There is no disease-modifying therapy, no approved drug, no gene therapy and
    no interventional clinical trial for this disorder. Management is entirely
    symptomatic. A mechanistic caution applies to any future substrate- or
    dosage-restoration strategy: in the forebrain Usp9x knockout mouse the
    substrate deficit is transient and normalises by 12 weeks, yet the reduced
    spine density and behavioural phenotype persist into adulthood, implying a
    developmental critical window after which restoring USP9X-dependent
    substrate levels would not be expected to reverse the phenotype.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:31813652
    reference_title: Usp9X Controls Ankyrin-Repeat Domain Protein Homeostasis during Dendritic Spine Development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "the impairment of which only transiently affects ANKRD protein levels but leads to persistent neuronal, behavioral, and clinical abnormalities"
    explanation: >
      Supports the critical-window caution stated in the description. It does not
      evidence supportive care itself, for which no disorder-specific trial
      exists; hence PARTIAL.
- name: Speech and Language Therapy
  description: >
    Speech and language impairment is universal and can extend to complete
    absence of speech, so early speech therapy with augmentative and alternative
    communication where required is a core intervention. There is no
    disorder-specific trial evidence; the rationale is the near-universality and
    severity of the target impairment.
  treatment_term:
    preferred_term: Speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:

    explanation: Documents the mild end of the range within the same allele class.
- name: USP9X p.Arg215Ter
  description: >
    A maternally inherited nonsense allele identified on genetic autopsy of a
    terminated fetus with brain malformation and heart and skeletal defects. The
    transmitting mother had only a history of scoliosis and partial hearing
    impairment. This allele documents both the lethal-fetal end of the spectrum
    and reduced penetrance in a transmitting heterozygote.

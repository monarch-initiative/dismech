    snippet: "Female 30 had a de novo nonsense variant (p.Trp380Ter) and presented with severe ID, absent speech and severe motor disability."
    explanation: Documents the severe end of the phenotypic range for a bona fide null allele.
- name: USP9X p.Ile535Asnfs*11
  description: >
    A de novo frameshift allele - the same "complete loss-of-function" class as
    p.Trp380Ter - in an individual with only slight delays who is now largely
    meeting developmental milestones. The direct counterexample to any
    assumption that a null allele predicts a severe outcome.
  gene:
    preferred_term: USP9X
    term:
      id: hgnc:12632
      label: USP9X
  type: FRAMESHIFT
  evidence:
  - reference: PMID:33298948

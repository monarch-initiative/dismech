- name: Cleft Palate Repair
  description: >
    Cleft palate, and its submucous microform bifid uvula, is one of the
    defining malformations. Surgical repair follows standard cleft-team
    protocols and is relevant here beyond the palate itself because an unrepaired
    or late-repaired cleft compounds the speech and language impairment that is
    the principal functional disability of this syndrome. Palatal inspection
    including the uvula therefore belongs in the initial evaluation even when
    the cleft is not overt.

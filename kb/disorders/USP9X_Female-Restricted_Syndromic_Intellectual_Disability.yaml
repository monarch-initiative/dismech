- name: Loss of Substrate Deubiquitination and Proteasomal Substrate Destabilization
  biological_scale: MOLECULAR
  description: >
    USP9X removes ubiquitin from a large, context-dependent set of substrates,
    thereby antagonising their proteasomal degradation and raising their
    steady-state abundance. Halving USP9X dose therefore lowers the abundance of
    many substrates at once. Crucially, USP9X substrates are disproportionately
    proteins encoded by neurodevelopmental-disorder genes and regulators of the
    TGF-beta, Wnt, Notch and mTOR pathways, so a single quantitative lesion in a
    deubiquitinase produces a pleiotropic developmental phenotype. This node is
    the convergence point from which the three mechanistic sub-branches below
    diverge; they are modelled as siblings because different substrate classes
    are affected in parallel rather than sequentially.

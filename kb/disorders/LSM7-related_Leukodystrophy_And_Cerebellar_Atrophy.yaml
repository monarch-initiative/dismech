  variants:
  - name: p.Asp41Asn
    description: >-
      LSM7 c.121G>A (NM_016199.2), found homozygous in the first reported
      individual and in trans with p.Arg69Trp in the second. Asp41 is a
      conserved RNA-contacting residue in Sm motif I.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35047835
      reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These analyses revealed a homozygous variant in LSM7 (GenBank: NM_016199.2; GRCh37/hg19) at position c.121G>A (p.Asp41Asn)"
      explanation: Identifies the homozygous variant in the first affected individual.
  - name: p.Arg69Trp
    description: >-
      LSM7 c.205C>T, maternally inherited in the second reported individual.
      Arg69 makes polar contacts with LSM5 in both rings; tryptophan removes
      them in structural modelling. Not functionally tested.
    evidence:
    - reference: PMID:39420558
      reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The amino acid Arg69 of LSM7 establishes polar contacts with LSM5, at the level of Glu35 (Figure 2D) as detected in yeast, in both Lsm1-7 and Lsm2-8 complexes."
      explanation: Structural modelling places Arg69 at the LSM5 interface of both rings.
  - name: p.Arg69Pro
    description: >-
      LSM7 c.206G>C, carried heterozygously by both parents of a family with
      recurrent fetal deaths; no fetus was genotyped, so its homozygous effect
      is presumed. Impairs ring assembly in HEK293 cells.
    evidence:
    - reference: PMID:35047835
      reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The multiple fetal deaths are thereby presumed to be caused by the homozygous variant in LSM7."
      explanation: The fetal genotype is presumed rather than observed.
  evidence:
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we confirm that LSM7 disruption causes a neurodevelopmental disorder characterized by leukodystrophy and cerebellar atrophy"
    explanation: The second independent family confirms LSM7 as the disease gene.
mechanistic_hypotheses:
- hypothesis_group_id: lsm2_8_splicing_defect
  hypothesis_label: LSM2-8 / U6 snRNP splicing defect
  status: EMERGING
  description: >-
    Misassembly of the nuclear LSM2-8 ring impairs its chaperone role for U6
    snRNA and its association with U4/U6.U5 tri-snRNP factors, compromising
    spliceosome function in vulnerable neural and glial cells. Reduced
    tri-snRNP factor binding is shown in HEK293 pull-downs; no splicing
    readout, U6 snRNA level or RNA-seq has been reported in patient cells.
  evidence:
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These splicing factors are required for the formation of the U4/U6/U5 tri-snRNP complex, an important precursor in the major spliceosome reaction."
    explanation: The mutant LSM7 loses tri-snRNP interactors, which motivates a splicing model.
- hypothesis_group_id: lsm1_7_mrna_decay_defect
  hypothesis_label: LSM1-7 / PATL1 mRNA decapping and decay defect
  status: EMERGING
  description: >-
    Misassembly of the cytoplasmic LSM1-7 ring reduces its association with
    PATL1 and EDC4 and so impairs deadenylation-dependent decapping and 5'-3'
    mRNA decay, with downstream dysregulation of transcripts needed for
    oligodendrocyte and cerebellar development. Loss of the decay-factor
    interactions is shown in HEK293 pull-downs; no mRNA decay assay has been
    reported in patient cells.
  evidence:
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.Asp41Asn and p.Arg69Pro mutants showed reduced interaction with the mRNA decay factors PATL1 and EDC4"
    explanation: The mutant LSM7 loses the LSM1-7 decay partners, which motivates an mRNA decay model.
pathophysiology:
- name: Biallelic LSM7 Missense Variants
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense variants at Asp41 (an RNA-contacting Sm motif I
    residue) or Arg69 (an LSM5-contacting residue) reduce LSM7 abundance and
    its ability to bind its ring partners. LSM7 is a core subunit of LSM2-8,
    the U6 snRNP component of the spliceosome, which is the basis for
    conformance to the spliceosome module; LSM7 is equally a subunit of the
    non-spliceosomal LSM1-7 decay complex. Patient fibroblasts carrying
    homozygous p.Asp41Asn have reduced LSM7 mRNA and protein.
  genes:
  - preferred_term: LSM7
    term:
      id: hgnc:20470
      label: LSM7
  molecular_functions:
  - preferred_term: RNA binding
    term:
      id: GO:0003723
      label: RNA binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: Lsm2-8 complex
    term:
      id: GO:0120115
      label: Lsm2-8 complex
  - preferred_term: Lsm1-7-Pat1 complex
    term:
      id: GO:1990726
      label: Lsm1-7-Pat1 complex
  evidence:
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A decreased amount of LSM7 protein (p < 0.001) was seen in the affected individual as compared to control individuals"
    explanation: Patient fibroblasts show reduced LSM7 protein.
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Since the p.Asp41Asn variant is located on a conserved RNA contacting residue in the Sm motif-I of LSM7"
    explanation: Places Asp41 at an RNA-contacting residue by structural and conservation reasoning, grounding the RNA binding annotation indirectly.
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "LSM 2–8 act as a chaperone protein complex in the nucleus for U6 small nuclear RNA (U6 snRNA), a spliceosome component and contributes to its nuclear retention."
    explanation: Background establishing LSM2-8, which contains LSM7, as a U6 snRNP spliceosome component.
  downstream:
  - target: LSM1-7 and LSM2-8 Ring Misassembly
    causal_link_type: DIRECT
- name: LSM1-7 and LSM2-8 Ring Misassembly
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    In HEK293 affinity purification-mass spectrometry, FLAG-tagged LSM7
    p.Asp41Asn and p.Arg69Pro co-purify far less of the other LSM subunits of
    both rings than wild-type LSM7, and lose most known interactors of both
    complexes. This is the only molecular defect demonstrated so far; it does
    not distinguish which ring's loss is pathogenic.
  cellular_components:
  - preferred_term: Lsm2-8 complex
    term:
      id: GO:0120115
      label: Lsm2-8 complex
  - preferred_term: Lsm1-7-Pat1 complex
    term:
      id: GO:1990726
      label: Lsm1-7-Pat1 complex
  evidence:
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, pull-downs from lysates of HEK293 cells producing the p.Asp41Asn or p.Arg69Pro variants revealed dramatically reduced association of the mutated LSM7 protein with the other LSM proteins constituting the LSM1-7 and LSM2-8 complexes."
    explanation: Direct demonstration that both rings misassemble with the variant subunit.
  downstream:

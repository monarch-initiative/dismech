- name: Impaired Cerebellar Development
  role: tissue_consequence
  biological_scale: TISSUE
  description: >-
    Reduced cerebellar vermis and enlarged interfolial spaces in both
    individuals, called hypoplasia at 17-35 months in one and atrophy at 6
    years (after a normal MRI at 2 months) in the other. lsm7 knockdown
    zebrafish have a small cerebellum and brain.
  evidence:
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, both patients’ MRIs show a reduced size of the cerebellar vermis compared with an age-matched control and an enlargement of cerebellar interfolial spaces."
    explanation: Shared cerebellar imaging finding in both individuals.
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, the hypoplastic cerebellum in individual 1 corresponded to the small cerebellar phenotype observed in Lsm7-Crispants."
    explanation: The zebrafish knockdown reproduces a small cerebellum.
  downstream:

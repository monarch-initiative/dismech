animal_models:
- name: lsm7 CRISPR-Cas9 crispant zebrafish
  species: Zebrafish
  genotype: lsm7 exon 3 sgRNA plus Cas9 F0 crispant
  publication: PMID:35047835
  description: >-
    F0 zebrafish injected with lsm7 exon 3 sgRNA and Cas9 protein, with rescue
    by wild-type or variant human LSM7 cRNA.
  modeled_mechanisms:
  - target: Oligodendrocyte Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Increased oligodendrocyte-lineage apoptosis, rescued by wild-type but not variant human LSM7.
    limitations: >-
      Mosaic F0 knockdown rather than a germline missense model; olig2:dsRed
      also labels precursors and motor neurons; myelin itself and LSM ring
      assembly or splicing were not measured in the fish.
    evidence:
    - reference: PMID:35047835
      reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that apoptosis of oligodendrocytes was significantly increased in Lsm7-Crispants (p < 0.01) (Figures 5H and 5I) and could be rescued by concomitant injection of LSM7full-length cRNA but not by the LSM7Asp41Asn or LSM7Arg69Pro cRNAs"
      explanation: Supports the crispant as informative for the oligodendrocyte node.
  - target: Impaired Cerebellar Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Reduced brain and eye size and a small cerebellum, with reduced motor response to light.
    limitations: >-
      Reduction in overall brain size is not specific to the cerebellum, and
      the zebrafish phenotype is embryonic rather than the postnatal-onset
      atrophy seen in one patient.
    evidence:
    - reference: PMID:35047835
      reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a mild phenotype who displayed normal trunk morphology but brain and eye size reduction"
      explanation: Brain size reduction in the crispants.
    - reference: PMID:35047835
      reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that larvae response to light stimuli was significantly reduced in the Lsm7-Crispants (p < 0.001)"
      explanation: Motor behavior deficit in the crispants.
discussions:
- discussion_id: gap_lsm7_splicing_versus_mrna_decay
  prompt: >-
    Is LSM7-related leukodystrophy driven by loss of LSM2-8 / U6 snRNP
    splicing function, loss of LSM1-7 mRNA decapping and decay, or both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired U6 snRNP and Tri-snRNP Association
  - pathophysiology#Impaired LSM1-7 Mediated mRNA Decapping and Decay
  - mechanistic_hypotheses#lsm2_8_splicing_defect
  - mechanistic_hypotheses#lsm1_7_mrna_decay_defect
  rationale: >-
    The only molecular readout is HEK293 pull-down showing both rings
    misassemble and lose both decay (PATL1, EDC4) and tri-snRNP partners. No
    study has measured U6 snRNA levels, splicing, or mRNA decay in patient
    cells or in oligodendrocytes, so neither arm can yet be preferred.
  evidence:
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further investigation in patient-derived cells would be of high interest to better understand which aspects of RNA processing are mostly impaired and which genes are affected."
    explanation: The authors state that which RNA processing arm is impaired is unknown.
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The identification of more affected individuals is needed before the molecular mechanisms of mRNA decay and splicing regulation are added to the categories of biological dysfunctions implicated in leukodystrophies"
    explanation: Neither arm is established as the disease mechanism.
  proposed_experiments:
  - experiment_id: lsm7_patient_cell_rna_processing
    name: Splicing and mRNA decay profiling in LSM7 patient-derived glia
    description: >-
      Measure U6 snRNA abundance, transcriptome-wide splicing and mRNA
      half-lives in patient fibroblasts and iPSC-derived oligodendrocytes
      and neurons carrying biallelic LSM7 variants, against isogenic
      corrected controls.
    would_support:
    - pathophysiology#Impaired U6 snRNP and Tri-snRNP Association
    - pathophysiology#Impaired LSM1-7 Mediated mRNA Decapping and Decay
    supporting_outcome:
    - >-
      Reduced U6 snRNA with intron retention or exon skipping supports the
      splicing arm.
    - >-
      Stabilized oligoadenylated mRNAs with delayed decapping support the
      decay arm.

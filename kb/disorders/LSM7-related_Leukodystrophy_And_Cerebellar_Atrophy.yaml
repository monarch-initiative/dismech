      label: Autosomal recessive inheritance
  description: >-
    Homozygous and compound heterozygous LSM7 missense genotypes, each allele
    inherited from a heterozygous unaffected parent.
  evidence:
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted Sanger sequencing confirmed the presence of the variant as homozygous in the affected individual, with both parents being carriers"
    explanation: Homozygous affected child of two heterozygous carrier parents.
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing consistently detected the variants in the parents, the affected case, but not in the unaffected sibling"
    explanation: Compound heterozygous proband with one variant from each parent, consistent with recessive inheritance.
genetic:
- name: LSM7
  gene_term:

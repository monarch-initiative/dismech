name: LSM7-related Leukodystrophy and Cerebellar Atrophy
creation_date: "2026-10-28T06:00:00Z"
category: Mendelian
description: >-
  An ultra-rare autosomal recessive neurodevelopmental disorder caused by
  biallelic missense variants in LSM7, which encodes a subunit shared by the
  cytoplasmic LSM1-7 ring (mRNA decapping and decay) and the nuclear LSM2-8
  ring (U6 snRNA chaperone of the spliceosome). Two living, unrelated affected
  males have been reported, one homozygous for p.Asp41Asn and one compound
  heterozygous for p.Asp41Asn and p.Arg69Trp. Both have global developmental
  delay, spastic quadriparesis and MRI white matter signal abnormality
  indicative of a leukodystrophy together with cerebellar hypoplasia or
  atrophy; one also has progressive sensorineural hearing loss and hypospadias,
  the other ataxia, nystagmus, oculomotor apraxia and extrapyramidal
  dyskinesia. A consanguineous couple who were both heterozygous for
  p.Arg69Pro had recurrent fetal deaths, but no fetus was genotyped. The
  variants impair assembly of both LSM rings in human cells, and lsm7 loss in
  zebrafish increases oligodendrocyte apoptosis; whether the disease is driven
  by the splicing (LSM2-8) or the mRNA decay (LSM1-7) arm has not been tested.
disease_term:
  preferred_term: LSM7-related leukodystrophy and cerebellar atrophy
  term:
    id: MONDO:0978294
    label: LSM7-related leukodystrophy and cerebellar atrophy
synonyms: []
parents:
- Leukodystrophy
- Hereditary neurological disease
notes: >-
  Evidence base is two clinically characterized individuals (PMID:35047835 and
  PMID:39420558). The p.Arg69Pro fetal deaths are attributed to LSM7 only by
  parental carrier status, so the fetal findings (nuchal translucency,
  encephalocele, death at 32 weeks) are recorded here and not as phenotypes.
  No ClinGen gene-disease validity record exists for LSM7 in the committed
  ClinGen export, and no GeneReviews chapter covers the disorder.

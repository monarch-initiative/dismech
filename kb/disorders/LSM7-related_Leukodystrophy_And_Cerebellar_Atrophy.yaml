- name: Cerebral White Matter Disease
  role: tissue_consequence
  biological_scale: TISSUE
  description: >-
    Multifocal deep and periventricular T2/FLAIR white matter hyperintensity,
    progressive between 17 and 35 months in the first individual, read as a
    leukodystrophy. Whether this is hypomyelination or demyelination has not
    been established histologically.
  evidence:
  - reference: PMID:39420558
    reference_title: "LSM7 variants involving key amino acids for LSM complex function cause a neurodevelopmental disorder with leukodystrophy and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI conducted at the age of 6 years showed bilateral, asymmetrical, and multifocal T2/FLAIR hyperintensities in the deep white matter involving the semioval centers and periventricular regions"
    explanation: White matter signal abnormality in the second individual.
  - reference: PMID:35047835
    reference_title: "Variants in LSM7 impair LSM complexes assembly, neurodevelopment in zebrafish and may be associated with an ultra-rare neurological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His MRIs showed cerebellar hypoplasia and progressive white matter signal abnormalities between 17 and 35 months, indicative of a leukodystrophy"
    explanation: Progressive white matter disease in the first individual.
  downstream:

  role: cellular_consequence
  biological_scale: CELLULAR
  description: >-
    In lsm7 CRISPR-Cas9 knockdown zebrafish, apoptosis of olig2-positive
    oligodendrocyte-lineage cells is increased and is rescued by wild-type but
    not p.Asp41Asn or p.Arg69Pro human LSM7. Evidence is from zebrafish only;
    oligodendrocyte loss has not been shown in patient tissue.

name: Acquired Immunodeficiency Syndrome
creation_date: '2025-12-04T16:57:31Z'
synonyms:
- AIDS
- Acquired immune deficiency syndrome
description: >-
  Acquired immunodeficiency syndrome (AIDS) is the advanced clinical state of
  infection with human immunodeficiency virus type 1 (HIV-1) or type 2 (HIV-2),
  not a synonym for every HIV infection. In the U.S. CDC surveillance framework,
  AIDS is HIV infection stage 3; this numbering is framework-specific. Persistent
  viral replication, mucosal immune injury, chronic immune activation, and
  progressive failure of CD4 T-cell homeostasis produce severe cell-mediated
  immunodeficiency. Subject to the framework's stage-0 precedence rule, AIDS is
  classified by severe CD4 depletion or an AIDS-defining illness and is manifested
  by opportunistic infections, selected malignancies, and sometimes severe
  HIV-associated neurologic disease. Combination antiretroviral therapy suppresses
  viral replication and permits immune reconstitution but does not eradicate
  long-lived cellular reservoirs.
categories:
- Immunodeficiency Disorder
- Infectious Disease
disease_term:
  preferred_term: AIDS
  term:
    id: MONDO:0012268
    label: AIDS
definitions:
- name: CDC HIV stage-3 surveillance case definition
  definition_type: CASE_DEFINITION
  scope: United States public-health surveillance in people with confirmed HIV infection
  description: >-
    In the U.S. CDC framework, AIDS is HIV infection classified as stage 3. The
    surveillance framework uses severe CD4 depletion and AIDS-defining clinical
    conditions; it is intended for population surveillance and is not, by
    itself, a clinical decision rule for an individual patient.
  evidence:
  - reference: PMID:24717910
    reference_title: "Revised surveillance case definition for HIV infection--United States, 2014."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A confirmed case can be classified in one of five HIV infection stages
      (0, 1, 2, 3, or unknown); early infection, recognized by a negative HIV
      test within 6 months of HIV diagnosis, is classified as stage 0, and
      acquired immunodeficiency syndrome (AIDS) is classified as stage 3.
    explanation: The CDC surveillance definition explicitly identifies AIDS as HIV infection stage 3.
  - reference: PMID:24717910
    reference_title: "Revised surveillance case definition for HIV infection--United States, 2014."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The surveillance case definition is intended primarily for monitoring the
      HIV infection burden and planning for prevention and care on a population
      level, not as a basis for clinical decisions for individual patients.
    explanation: This states the intended population-surveillance scope and its clinical-use limitation.
- name: Historical adult and adolescent CD4-depletion threshold
  definition_type: CASE_DEFINITION
  scope: 1993 U.S. CDC expanded AIDS surveillance definition for adolescents and adults
  description: >-
    The 1993 expanded U.S. CDC surveillance definition for adolescents and
    adults included HIV infection with a CD4 T-cell count below 200 cells per
    microliter or a CD4 percentage below 14 percent.
  evidence:
  - reference: PMID:8093740
    reference_title: From the Centers for Disease Control and Prevention. 1993 revised classification system for HIV infection and expanded surveillance case definition for AIDS among adolescents and adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Consistent with the 1993 revised classification system, CDC has also
      expanded the AIDS surveillance case definition to include all HIV-infected
      persons who have less than 200 CD4+ T-lymphocytes/microL, or a CD4+
      T-lymphocyte percentage of total lymphocytes of less than 14.
    explanation: The CDC publication gives the exact count and percentage thresholds.
infectious_agent:
- name: Human immunodeficiency virus 1
  description: HIV-1 is one of the two human lentiviruses that can cause AIDS.
  infectious_agent_term:
    preferred_term: Human immunodeficiency virus 1
    term:
      id: NCBITaxon:11676
      label: Human immunodeficiency virus 1
  evidence:
  - reference: PMID:22229120
    reference_title: Origins of HIV and the AIDS pandemic.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acquired immunodeficiency syndrome (AIDS) of humans is caused by two
      lentiviruses, human immunodeficiency viruses types 1 and 2 (HIV-1 and HIV-2).
    explanation: This review identifies HIV-1 as one of the two human lentiviruses that cause AIDS.
- name: Human immunodeficiency virus 2
  description: >-
    HIV-2 can also progress to AIDS, but its natural history and antiretroviral
    susceptibility differ from HIV-1.
  infectious_agent_term:
    preferred_term: Human immunodeficiency virus 2
    term:
      id: NCBITaxon:11709
      label: Human immunodeficiency virus 2
  evidence:
  - reference: PMID:22229120
    reference_title: Origins of HIV and the AIDS pandemic.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acquired immunodeficiency syndrome (AIDS) of humans is caused by two
      lentiviruses, human immunodeficiency viruses types 1 and 2 (HIV-1 and HIV-2).
    explanation: This review identifies HIV-2 as one of the two human lentiviruses that cause AIDS.
  - reference: PMID:36982978
    reference_title: "Antiretroviral Treatment of HIV-2 Infection: Available Drugs, Resistance Pathways, and Promising New Compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The course of HIV-2 infection is longer compared to HIV-1 infection, but
      without effective antiretroviral therapy (ART), a substantial proportion
      of infected patients will progress to AIDS and die.
    explanation: This supports progression of untreated HIV-2 infection to AIDS.
progression:
- phase: Onset
  notes: >-
    Progression from untreated HIV infection to overt AIDS is variable and can
    take many years. Acute HIV illness occurs much earlier and is not the onset
    of AIDS.
  evidence:
  - reference: PMID:23772614
    reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disease progression in untreated human immunodeficiency virus (HIV)
      infection can take many years, and it was originally hypothesized to be a
      consequence of slow, viral-mediated CD4(+) T-cell destruction.
    explanation: This review supports a long and variable untreated interval before overt immunodeficiency.
pathophysiology:
- name: Persistent HIV Infection and Replication
  description: >-
    HIV establishes ongoing infection in susceptible immune cells. Viral
    replication drives pathogenesis, while the resulting immunodeficiency
    reflects both direct viral effects and dysregulated host immune homeostasis.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: viral process
    modifier: ABNORMAL
    term:
      id: GO:0016032
      label: viral process
  evidence:
  - reference: PMID:23772614
    reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thus, the onset of overt immune deficiency appears to be intimately linked
      with CD4(+) memory T-cell dynamics and reflects the complex interplay of
      direct viral cytopathogenicity and the indirect effects of persistent
      immune activation on CD4(+) memory T-cell proliferation, differentiation,
      and survival.
    explanation: This supports viral and host-homeostatic contributions to AIDS pathogenesis.
  downstream:
  - target: Early Mucosal CD4 T-Cell Loss and Gut Barrier Injury
    description: Early infection preferentially damages mucosal CD4 memory T-cell compartments.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15955686
      reference_title: Viral and host factors in the pathogenesis of HIV infection.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        During acute infection, massive depletion of CD4+CCR5+ memory T cells
        within the mucosal-associated lymphoid tissue leads to major and
        potentially irreversible damage to CD4+ T-cell-mediated immune functions.
      explanation: This directly links early HIV infection to mucosal CD4 memory T-cell loss.
  - target: Abortive HIV Infection and Caspase-1 Pyroptosis
    description: >-
      In ex vivo human lymphoid tissue, abortive infection of quiescent CD4
      T cells triggers inflammatory caspase-1-mediated death.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24356306
      reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The remaining over 95% of quiescent lymphoid CD4 T cells die by
        caspase-1-mediated pyroptosis triggered by abortive viral infection.
      explanation: The ex vivo study directly links abortive HIV infection to caspase-1 pyroptosis.
  - target: CNS HIV Infection and Neuroinflammation
    description: HIV can enter the CNS and initiate local inflammatory and neurotoxic processes.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Trafficking of infected immune cells into the central nervous system
    evidence:
    - reference: PMID:25604237
      reference_title: "Neuropathogenesis of HIV: from initial neuroinvasion to HIV-associated neurocognitive disorder (HAND)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The well-accepted “Trojan horse” hypothesis suggests that the virus
        enters mainly through CD4 T lymphocytes or possibly monocytes during
        routine surveillance, only to go on infecting local cells of the CNS
        (16, 17).
      explanation: This review specifically supports immune-cell trafficking as a route of HIV entry into the CNS.
  - target: Persistent Cellular HIV Reservoir
    description: >-
      Integrated, transcriptionally silent provirus establishes a cellular
      reservoir that is refractory to suppressive ART.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Proviral integration and establishment of latency in long-lived host cells
    evidence:
    - reference: PMID:29744964
      reference_title: Peering into the HIV reservoir.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The HIV cellular reservoir comprises cells with HIV-DNA integrated into
        their genome, but trancriptionally silent, making the virus refractory
        to cART and to the action of the immune system.
      explanation: This review directly supports an integrated, transcriptionally silent reservoir refractory to ART.
- name: Early Mucosal CD4 T-Cell Loss and Gut Barrier Injury
  description: >-
    Acute HIV infection causes marked depletion of mucosal CD4 memory T cells,
    persistent mucosal inflammation, and epithelial barrier injury.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:23297256
    reference_title: Microbial translocation in the pathogenesis of HIV infection and AIDS.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In vivo studies demonstrated that HIV/SIV-associated microbial
      translocation results from a series of immunopathological events occurring
      at the GI mucosa: (i) early and severe mucosal CD4(+) depletion, (ii)
      mucosal immune hyperactivation/persistent inflammation; (iii) damage to
      the integrity of the intestinal epithelium with enterocyte apoptosis and
      tight junction disruption; and (iv) subverted the gut microbiome, with a
      predominance of opportunistic bacteria.
    explanation: This review describes the linked mucosal CD4 loss, inflammation, and epithelial injury.
  downstream:
  - target: Microbial Translocation and Chronic Immune Activation
    description: Barrier disruption permits microbial products to reach the circulation and sustain innate immune activation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23297256
      reference_title: Microbial translocation in the pathogenesis of HIV infection and AIDS.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        In pathogenic simian immunodeficiency virus (SIV) and human
        immunodeficiency virus (HIV) infections, the translocation of microbial
        products from the gastrointestinal (GI) tract to portal and systemic
        circulation has been proposed as a major driver of the chronic immune
        activation that is associated with disease progression.
      explanation: The source supports the proposed link while explicitly retaining mechanistic uncertainty.
- name: Microbial Translocation and Chronic Immune Activation
  description: >-
    Microbial products crossing the damaged gut barrier contribute to persistent
    innate and adaptive immune activation during chronic HIV infection.
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:23297256
    reference_title: Microbial translocation in the pathogenesis of HIV infection and AIDS.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While the mechanisms by which microbial translocation causes immune
      activation remain controversial, a key pathogenic event appears to be
      innate immunity activation via Toll-like receptors and other pathogen
      recognition receptors.
    explanation: This supports a contributory innate-activation mechanism while preserving uncertainty.
  downstream:
  - target: Progressive CD4 T-Cell Depletion and Homeostatic Failure
    description: >-
      Persistent immune activation disrupts CD4 memory-cell proliferation,
      differentiation, survival, and regenerative homeostasis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Dysregulated CD4 memory T-cell turnover and regeneration
    evidence:
    - reference: PMID:23772614
      reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thus, the onset of overt immune deficiency appears to be intimately linked
        with CD4(+) memory T-cell dynamics and reflects the complex interplay of
        direct viral cytopathogenicity and the indirect effects of persistent
        immune activation on CD4(+) memory T-cell proliferation, differentiation,
        and survival.
      explanation: This review directly supports chronic activation as an indirect driver of CD4 homeostatic failure.
- name: Abortive HIV Infection and Caspase-1 Pyroptosis
  description: >-
    In ex vivo human lymphoid aggregates, abortive HIV-1 infection of quiescent
    CD4 T cells activates caspase-1, causing inflammatory pyroptotic cell death.
    This is a contributory experimental mechanism, not a universal quantitative
    estimate for every person with AIDS.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: pyroptotic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
  evidence:
  - reference: PMID:24356306
    reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pyroptosis corresponds to an intensely inflammatory form of programmed
      cell death in which cytoplasmic contents and pro-inflammatory cytokines,
      including IL-1β, are released.
    explanation: The ex vivo study characterizes the inflammatory cell-death mechanism.
  downstream:
  - target: Progressive CD4 T-Cell Depletion and Homeostatic Failure
    description: Pyroptotic death of abortively infected lymphoid CD4 T cells contributes to the depleted CD4 pool.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24356306
      reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The remaining over 95% of quiescent lymphoid CD4 T cells die by
        caspase-1-mediated pyroptosis triggered by abortive viral infection.
      explanation: This directly supports pyroptosis-mediated CD4 loss in the ex vivo lymphoid-tissue system.
- name: Progressive CD4 T-Cell Depletion and Homeostatic Failure
  description: >-
    Direct viral effects and chronic immune activation eventually overwhelm
    CD4 memory T-cell regeneration, lowering critical effector populations.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:23772614
    reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ultimately, CD4(+) memory T-cell homeostasis fails and critical effector
      populations decline below the level necessary to prevent OI.
    explanation: This supports progressive failure of CD4 homeostasis and loss of protective effector cells.
  downstream:
  - target: Severe Cell-Mediated Immunodeficiency
    description: Falling CD4 effector-cell numbers and function produce overt cellular immune failure.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23772614
      reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The hallmark of acquired immunodeficiency syndrome (AIDS) pathogenesis is
        a progressive depletion of CD4(+) T-cell populations in close association
        with progressive impairment of cellular immunity and increasing
        susceptibility to opportunistic infections (OI).
      explanation: This directly connects progressive CD4 depletion with impaired cellular immunity.
- name: Severe Cell-Mediated Immunodeficiency
  description: >-
    Profound loss of CD4 T-cell number and function marks overt AIDS and
    undermines immune control of opportunistic pathogens and oncogenic viruses.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:23772614
    reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overall, these observations provide strong evidence that a profoundly
      impaired cellular immune response due to depletion of CD4+T cells and loss
      of CD4+T-cell function was the underlying cause of immunodeficiency present
      in these patients.
    explanation: This supports CD4 loss and dysfunction as the basis of severe cellular immunodeficiency.
  downstream:
  - target: Opportunistic Infection Susceptibility
    description: Loss of CD4-dependent host defense permits opportunistic pathogens to cause severe disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23772614
      reference_title: "CD4(+) T-cell depletion in HIV infection: mechanisms of immunological failure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The hallmark of acquired immunodeficiency syndrome (AIDS) pathogenesis is
        a progressive depletion of CD4(+) T-cell populations in close association
        with progressive impairment of cellular immunity and increasing
        susceptibility to opportunistic infections (OI).
      explanation: This directly links severe cellular immune impairment to opportunistic-infection susceptibility.
  - target: Loss of Oncogenic-Virus Immune Control
    description: Immunodeficiency permits oncogenic coinfections to escape immune control and promote tumors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Failure of immune surveillance against HHV-8, Epstein-Barr virus, and oncogenic human papillomavirus
    evidence:
    - reference: PMID:12525676
      reference_title: AIDS-related malignancies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In acquired immunodeficiency due to the human immunodeficiency virus
        (HIV), HIV itself rarely directly causes cancer; rather, it provides the
        immunologic background against which other viruses can escape immune
        control and induce tumors.
      explanation: This review directly supports loss of immune control over oncogenic viruses as the cancer mechanism.
- name: Opportunistic Infection Susceptibility
  description: >-
    Severe cellular immunodeficiency permits AIDS-defining opportunistic
    infections; Pneumocystis pneumonia and esophageal candidiasis are
    representative manifestations rather than an exhaustive list.
  evidence:
  - reference: PMID:16182595
    reference_title: "Pneumocystis: immune recognition and evasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pulmonary infection caused by the opportunistic fungal organism
      Pneumocystis continues to be a leading AIDS defining illness.
    explanation: This identifies Pneumocystis pneumonia as a leading AIDS-defining opportunistic illness.
  downstream:
  - target: Pneumocystis jirovecii Pneumonia
    description: Severe T-cell immunodeficiency permits pulmonary Pneumocystis infection.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Failure of coordinated innate and immune-mediated pulmonary fungal clearance
    evidence:
    - reference: PMID:16182595
      reference_title: "Pneumocystis: immune recognition and evasion."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Host defense against Pneumocystis involves a delicate, concerted balance
        between the inflammatory response and immune-mediated clearance.
      explanation: This supports failure of immune-mediated clearance as the link from immunodeficiency to Pneumocystis pneumonia.
  - target: Esophageal Candidiasis
    description: Severe cellular immune dysfunction permits invasive Candida infection of the esophagus.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Failure of mucosal antifungal host defense
    evidence:
    - reference: PMID:17944709
      reference_title: Invasive fungal infections among inpatients with acquired immune deficiency syndrome at a Chinese university hospital.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IFIs included thrush, oesophageal candidiasis, fungal pneumonia,
        cryptococcosis, penicilliosis and fungaemia, 44.4% of IFIs occurred in
        the digestive tract, 71.8% of IFIs occurred in patients with
        CD4(+)T-lymphocyte counts <100 cells mm(-3).
      explanation: This cohort links esophageal candidiasis and other invasive fungal infections with severe CD4 depletion.
- name: Loss of Oncogenic-Virus Immune Control
  description: >-
    AIDS-associated immune dysfunction reduces surveillance of HHV-8,
    Epstein-Barr virus, and oncogenic human papillomavirus, enabling selected
    malignancies.
  evidence:
  - reference: PMID:12525676
    reference_title: AIDS-related malignancies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immunodeficiency alters the risk of cancer. Specific types of immune
      dysfunction are associated with different tumor risks, but most tumors are
      related to oncogenic viruses.
    explanation: This supports oncogenic-virus-associated malignancy in the immunodeficient state.
  downstream:
  - target: Kaposi Sarcoma
    description: Kaposi sarcoma-associated herpesvirus is implicated in Kaposi sarcoma development.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - HHV-8-associated Kaposi sarcoma development
    evidence:
    - reference: PMID:8876905
      reference_title: Oncological problems in AIDS--a review of the clinical features and management.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Kaposi's sarcoma-associated herpes virus is implicated in the

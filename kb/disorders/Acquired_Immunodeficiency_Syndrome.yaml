    evidence:
    - reference: PMID:8876905
      reference_title: Oncological problems in AIDS--a review of the clinical features and management.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Kaposi's sarcoma-associated herpes virus is implicated in the
        development of Kaposi's sarcoma, Epstein-Barr virus in systemic
        non-Hodgkin's lymphoma as well as primary central nervous system
        lymphoma and human papilloma virus in invasive cervical cancer.
      explanation: This directly supports the association between EBV and systemic or primary-CNS lymphoma.
  - target: Invasive Cervical Cancer
    description: Oncogenic human papillomavirus is implicated in invasive cervical cancer.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Human papillomavirus association with invasive cervical cancer
    evidence:
    - reference: PMID:8876905
      reference_title: Oncological problems in AIDS--a review of the clinical features and management.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Kaposi's sarcoma-associated herpes virus is implicated in the
        development of Kaposi's sarcoma, Epstein-Barr virus in systemic
        non-Hodgkin's lymphoma as well as primary central nervous system
        lymphoma and human papilloma virus in invasive cervical cancer.

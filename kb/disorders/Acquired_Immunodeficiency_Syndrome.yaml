    explanation: This provides representative clinical AIDS-defining illnesses.
treatments:
- name: Combination Antiretroviral Therapy
  action_category: THERAPEUTIC
  description: >-
    Individualized combination ART suppresses HIV replication. Contemporary
    initial regimens for most adults use an integrase strand-transfer inhibitor
    with nucleoside or nucleotide reverse-transcriptase inhibitor components;
    regimen selection must account for clinical context, resistance, interactions,
    and HIV type.
  treatment_term:
    preferred_term: Antiretroviral Therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  target_mechanisms:
  - target: Persistent HIV Infection and Replication
    treatment_effect: INHIBITS
    description: Combination ART suppresses active viral replication.
    evidence:
    - reference: PMID:36308326
      reference_title: "Mortality and immunovirological outcomes in patients with advanced HIV disease on their first antiretroviral treatment: differential impact of antiretroviral regimens."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients who started an InSTI achieved viral suppression and CD4+ T cell
        count above 350 cells/mm3significantly earlier.
      explanation: This advanced-HIV cohort directly supports antiretroviral-regimen suppression of active HIV replication.
  - target: Severe Cell-Mediated Immunodeficiency
    treatment_effect: RESTORES
    description: Viral suppression permits partial CD4 immune reconstitution and reduces opportunistic disease.
    evidence:
    - reference: PMID:11424971
      reference_title: Immune restoration and CD4+ T-cell function with antiretroviral therapies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Suppression of HIV-1 replication results in both laboratory and clinical
        evidence of immune restoration.
      explanation: This review supports immune restoration after suppressive ART.
  evidence:
  - reference: PMID:39616604
    reference_title: "Antiretroviral Drugs for Treatment and Prevention of HIV in Adults: 2024 Recommendations of the International Antiviral Society-USA Panel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For most people with HIV, initial regimens composed of an integrase strand
      transfer inhibitor (InSTI), specifically bictegravir or dolutegravir, with
      2 (and in some cases 1) nucleoside or nucleotide reverse transcriptase
      inhibitors are recommended.
    explanation: This provides current initial-regimen guidance for most adults with HIV.
  - reference: PMID:36308326
    reference_title: "Mortality and immunovirological outcomes in patients with advanced HIV disease on their first antiretroviral treatment: differential impact of antiretroviral regimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this large real-life prospective cohort study, a significant lower
      mortality, earlier viral suppression and earlier immune reconstitution
      were observed among patients with advanced HIV disease treated with InSTIs.
    explanation: This advanced-HIV cohort supports viral suppression, immune reconstitution, and clinical benefit.
  - reference: PMID:36982978
    reference_title: "Antiretroviral Treatment of HIV-2 Infection: Available Drugs, Resistance Pathways, and Promising New Compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antiretroviral drugs in clinical use were designed for HIV-1 and,
      unfortunately, some do not work as well, or do not work at all, for HIV-2.
    explanation: This supports HIV type-specific antiretroviral regimen selection.
  notes: >-
    Some antiretrovirals active against HIV-1 are ineffective against HIV-2;
    HIV-2 treatment requires type-appropriate expert regimen selection.
- name: Context-Specific Opportunistic-Infection Prophylaxis
  action_category: THERAPEUTIC
  description: >-
    Antimicrobial prophylaxis can reduce selected opportunistic infections in
    people with advanced immunosuppression. The agent, CD4 threshold, pathogen,
    geography, screening results, interactions, and concurrent ART determine the
    appropriate regimen; there is no single universal prophylaxis bundle.
  treatment_term:
    preferred_term: preventative therapy
    term:
      id: MAXO:0000017
      label: preventative therapy
  target_mechanisms:
  - target: Opportunistic Infection Susceptibility
    treatment_effect: BYPASSES
    description: >-
      Prophylactic antimicrobials reduce selected infections during advanced
      immunosuppression while ART is initiated.
    evidence:
    - reference: PMID:28723333
      reference_title: Enhanced Prophylaxis plus Antiretroviral Therapy for Advanced HIV Infection in Africa.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients in the enhanced-prophylaxis group had significantly lower rates
        of tuberculosis (P=0.02), cryptococcal infection (P=0.01), oral or
        esophageal candidiasis (P=0.02), death of unknown cause (P=0.03), and new
        hospitalization (P=0.03).
      explanation: The trial supports clinical prevention; BYPASSES denotes prevention despite, rather than correction of, the immune deficit.
  evidence:
  - reference: PMID:28723333
    reference_title: Enhanced Prophylaxis plus Antiretroviral Therapy for Advanced HIV Infection in Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients in the enhanced-prophylaxis group had significantly lower rates
      of tuberculosis (P=0.02), cryptococcal infection (P=0.01), oral or
      esophageal candidiasis (P=0.02), death of unknown cause (P=0.03), and new
      hospitalization (P=0.03).
    explanation: The trial documents condition-specific benefits of the evaluated prophylaxis bundle.
  context: >-
    The cited REALITY trial enrolled ART-naive participants in Uganda, Zimbabwe,
    Malawi, and Kenya with CD4 counts below 100 cells per cubic millimeter.
differential_diagnoses:
- name: HIV Infection Without AIDS
  description: >-
    Confirmed HIV infection is broader than AIDS. In U.S. CDC surveillance,
    early infection can be stage 0, other cases can be stage 1, 2, or unknown,
    and AIDS is stage 3.
  distinguishing_features:
  - Confirmed HIV infection alone does not establish AIDS.
  - Apply the surveillance framework's stage rules rather than inferring AIDS from HIV positivity alone.
  evidence:
  - reference: PMID:24717910
    reference_title: "Revised surveillance case definition for HIV infection--United States, 2014."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A confirmed case can be classified in one of five HIV infection stages
      (0, 1, 2, 3, or unknown); early infection, recognized by a negative HIV
      test within 6 months of HIV diagnosis, is classified as stage 0, and
      acquired immunodeficiency syndrome (AIDS) is classified as stage 3.
    explanation: This explicitly distinguishes AIDS/stage 3 from other stages of confirmed HIV infection.
- name: Idiopathic CD4 Lymphocytopenia
  description: Rare CD4 lymphocytopenia syndrome described in HIV-negative patients.
  distinguishing_features:
  - HIV testing is negative.
  - Other diseases and drugs remain differential considerations.
  evidence:
  - reference: PMID:16763460
    reference_title: Idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Idiopathic CD4 lymphocytopenia is very rare. The clinical significance of
      low CD4 cell counts in HIV negative patients still awaits its systematic
      analysis.
    explanation: This review describes the rarity of idiopathic CD4 lymphocytopenia in HIV-negative patients.
  - reference: PMID:16763460
    reference_title: Idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of this condition in adults comprises primarily
      HIV infection and less often other diseases or drugs.
    explanation: This supports HIV, other diseases, and drugs as differential considerations.
- name: Secondary Non-HIV CD4 Lymphocytopenia
  description: >-
    Infections, autoimmune disease, immunosuppressive treatment, and lymphoma
    can produce severe CD4 lymphocytopenia without HIV/AIDS.
  distinguishing_features:
  - HIV testing is negative.
  - A non-HIV disease, infection, or medication explains the immune abnormality.
  evidence:
  - reference: PMID:16763460
    reference_title: Idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In adults, HIV is certainly the most common cause of CD4 lymphocytopenia,
      but other causes, such as infections, autoimmune diseases,
      immunosuppressive therapy, lymphoma and idiopathic forms need to be
      considered.
    explanation: This review explicitly lists major non-HIV causes of CD4 lymphocytopenia.
notes: >-
  AIDS is an advanced state caused by HIV infection; it is not transmitted
  independently, so HIV transmission routes are not duplicated as AIDS
  transmission records. No global prevalence value is asserted because HIV
  prevalence is not interchangeable with the prevalence of AIDS.
  The listed AIDS-defining illnesses are representative rather than exhaustive,
  and treatment of each diagnosed infection or malignancy remains
  condition-specific. Tangential drug-design models and incorrectly annotated
  protein structures were removed because they did not model or depict the
  claimed AIDS-specific mechanisms.

      explanation: This directly supports the association between HHV-8 and Kaposi sarcoma.
  - target: AIDS-Related Non-Hodgkin Lymphoma
    description: Epstein-Barr virus is implicated in systemic and primary-CNS AIDS-related lymphomas.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

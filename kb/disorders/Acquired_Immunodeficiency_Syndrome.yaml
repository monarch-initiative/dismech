- name: CNS HIV Infection and Neuroinflammation
  description: >-
    HIV can establish compartmentalized infection in CNS macrophage-lineage
    cells. Local immune activation, neuroinflammation, and neurotoxicity can
    contribute to severe HIV-associated cognitive disease.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:25604237
    reference_title: "Neuropathogenesis of HIV: from initial neuroinvasion to HIV-associated neurocognitive disorder (HAND)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent work suggests that the stage for HIV neuropathogenesis may be set
      with initial viral entry into the CNS, followed by initiation of
      pathogenetic processes including neuroinflammation and neurotoxicity, and
      establishment of local, compartmentalized HIV replication that may reflect
      a tissue reservoir for HIV.
    explanation: This review supports CNS infection, neuroinflammation, and neurotoxicity.
  downstream:
  - target: AIDS Dementia Complex
    description: Severe CNS HIV disease can culminate in HIV-associated dementia/AIDS dementia complex.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Macrophage and microglial activation, inflammatory mediator release, and neuronal dysfunction
    evidence:
    - reference: PMID:25604237
      reference_title: "Neuropathogenesis of HIV: from initial neuroinvasion to HIV-associated neurocognitive disorder (HAND)."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Early in the HIV epidemic, a large proportion of the neurological
        manifestations of HIV presented as opportunistic CNS infections,
        including toxoplasmosis and progressive multifocal leukoencephalopathy
        (1). By 1987, the non-specific “subacute encephalitis” that widely
        affected patients with HIV was identified as the AIDS dementia complex
        (ADC, now termed HIV-associated dementia, or HAD), and was recognized as
        a manifestation of HIV itself rather than that of an alternate infection
        (2).
      explanation: This supports AIDS dementia as an HIV manifestation while the exact mechanistic route remains multifactorial.
- name: Persistent Cellular HIV Reservoir
  description: >-
    Resting CD4 memory T cells and other cellular compartments can retain
    integrated provirus during suppressive ART, preventing eradication and
    enabling renewed infection if therapy stops.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:29744964
    reference_title: Peering into the HIV reservoir.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The HIV cellular reservoir comprises cells with HIV-DNA integrated into
      their genome, but trancriptionally silent, making the virus refractory to
      cART and to the action of the immune system.
    explanation: This directly supports integrated, transcriptionally silent HIV persisting despite ART.
  - reference: PMID:29744964
    reference_title: Peering into the HIV reservoir.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Numerous reports have described that the main HIV cellular reservoir is
      composed of resting CD4+ T-cells16–18. Importantly, replication-competent
      provirus from the latent reservoir is capable of reigniting new rounds of
      infection if therapy is interrupted4,5.
    explanation: This supports resting CD4 T cells as a major reservoir and renewed infection after ART interruption.
  - reference: PMID:37317962
    reference_title: Brain microglia serve as a persistent HIV reservoir despite durable antiretroviral therapy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Outgrowth virus from parietal cortex MG in an individual with HIV
      productively infected both MG and PBMCs.
    explanation: Human rapid-autopsy tissue with ex vivo viral outgrowth supports replication-competent HIV in brain microglia.
phenotypes:
- name: Pneumocystis jirovecii Pneumonia
  category: Respiratory
  description: Pneumocystis jirovecii pneumonia is a representative AIDS-defining opportunistic infection.
  diagnostic: true
  phenotype_term:
    preferred_term: Pneumocystis jirovecii pneumonia
    term:
      id: HP:0020102
      label: Pneumocystis jirovecii pneumonia
  evidence:
  - reference: PMID:16182595
    reference_title: "Pneumocystis: immune recognition and evasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pulmonary infection caused by the opportunistic fungal organism
      Pneumocystis continues to be a leading AIDS defining illness.
    explanation: This identifies Pneumocystis pneumonia as an AIDS-defining illness.
- name: Esophageal Candidiasis
  category: Gastrointestinal
  description: Esophageal candidiasis is a representative AIDS-defining opportunistic infection.
  diagnostic: true
  evidence:
  - reference: PMID:18366449
    reference_title: Causes of the first AIDS-defining illness and subsequent survival before and after the advent of combined antiretroviral therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three most frequent initial ADIs were Pneumocystis carinii (jirovecii)
      pneumonia (PCP) (15.6%), oesophageal candidiasis (14.3%) and Kaposi's
      sarcoma (13.9%) in the pre-cART period.
    explanation: This cohort explicitly identifies esophageal candidiasis as an initial AIDS-defining illness.
- name: Kaposi Sarcoma
  category: Neoplasm
  description: Kaposi sarcoma is an HHV-8-associated AIDS-defining malignancy.
  diagnostic: true
  phenotype_term:
    preferred_term: Kaposi's sarcoma
    term:
      id: HP:0100726
      label: Kaposi's sarcoma
  evidence:
  - reference: PMID:18366449
    reference_title: Causes of the first AIDS-defining illness and subsequent survival before and after the advent of combined antiretroviral therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three most frequent initial ADIs were Pneumocystis carinii (jirovecii)
      pneumonia (PCP) (15.6%), oesophageal candidiasis (14.3%) and Kaposi's
      sarcoma (13.9%) in the pre-cART period.
    explanation: This cohort identifies Kaposi sarcoma as an initial AIDS-defining illness.
- name: AIDS-Related Non-Hodgkin Lymphoma
  category: Neoplasm
  description: >-
    Systemic and primary-CNS non-Hodgkin lymphomas are representative
    AIDS-associated malignancies.
  evidence:
  - reference: PMID:8876905
    reference_title: Oncological problems in AIDS--a review of the clinical features and management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They include Kaposi's sarcoma, systemic non-Hodgkin's lymphoma, primary
      central nervous system lymphoma and invasive cervical cancer.
    explanation: This review identifies systemic and CNS non-Hodgkin lymphomas among AIDS-associated malignancies.
- name: Invasive Cervical Cancer
  category: Neoplasm
  description: Invasive cervical cancer is an HPV-associated AIDS-defining condition.
  diagnostic: true
  evidence:
  - reference: PMID:8093740
    reference_title: From the Centers for Disease Control and Prevention. 1993 revised classification system for HIV infection and expanded surveillance case definition for AIDS among adolescents and adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This expansion includes the addition of three clinical
      conditions--pulmonary tuberculosis, recurrent pneumonia, and invasive
      cervical cancer--and retains the 23 clinical conditions in the AIDS
      surveillance case definition published in 1987; it is to be used by all
      states for AIDS case reporting effective immediately.
    explanation: The expanded CDC surveillance definition explicitly added invasive cervical cancer.
- name: AIDS Dementia Complex
  category: Neurologic
  description: >-
    AIDS dementia complex, now commonly called HIV-associated dementia, is the
    severe neurocognitive manifestation linked to advanced HIV disease.
  evidence:
  - reference: PMID:25604237
    reference_title: "Neuropathogenesis of HIV: from initial neuroinvasion to HIV-associated neurocognitive disorder (HAND)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      By 1987, the non-specific “subacute encephalitis” that widely affected
      patients with HIV was identified as the AIDS dementia complex (ADC, now
      termed HIV-associated dementia, or HAD), and was recognized as a
      manifestation of HIV itself rather than that of an alternate infection
      (2).
    explanation: This identifies AIDS dementia complex/HIV-associated dementia as a direct HIV manifestation.
biochemical:
- name: CD4 T-Cell Count
  biomarker_term:
    preferred_term: CD4 Expressing T Cell Count
    term:
      id: NCIT:C74608
      label: CD4 Expressing T Cell Count
  presence: Decreased
  context: >-
    Absolute count and percentage are U.S. CDC surveillance-stage measures with
    age-specific thresholds. The count takes precedence, and percentage is used
    only when the count is missing. Stage 0 and a qualifying opportunistic illness
    can take precedence over the CD4 table. Values can rise after ART and must be
    interpreted with clinical history.
  readouts:
  - target: Severe Cell-Mediated Immunodeficiency
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      For a person aged 6 years or older who does not meet stage-0 criteria, a
      CD4 count below 200 cells per microliter indicates U.S. CDC surveillance
      stage 3; a CD4 percentage below 14 percent is used only when the count is
      missing. Children younger than 6 years have age-specific stage-3 cutoffs.
    evidence:
    - reference: url:https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf
      reference_title: "https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TABLE. HIV infection stage* based on age-specific CD4+ T-lymphocyte
        count or CD4+ T-lymphocyte percentage of total lymphocytes
        Stage
        Age on date of CD4+ T-lymphocyte test
        <1 yr 1–5 yrs ≥6 yrs
        Cells/µL % Cells/µL % Cells/µL %
        1 ≥1,500 ≥34 ≥1,000 ≥30 ≥500 ≥26
        2 750–1,499 26–33 500–999 22–29 200–499 14–25
        3 <750 <26 <500 <22 <200 <14
      explanation: The official table supplies age-specific stage-3 CD4 count and percentage thresholds.
    - reference: url:https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf
      reference_title: "https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The stage is based primarily on the CD4+ T-lymphocyte count; the CD4+
        T-lymphocyte count takes precedence over the CD4 T-lymphocyte percentage,
        and the percentage is considered only if the count is missing.
      explanation: This establishes count precedence and percentage use only when the count is missing.
    - reference: url:https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf
      reference_title: "https://www.cdc.gov/mmwr/pdf/rr/rr6303.pdf"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        if the criteria for stage 0 are met, the stage is 0 regardless of
        criteria for other stages (CD4 T-lymphocyte test results and
        opportunistic illness diagnoses)
      explanation: This establishes stage-0 precedence over CD4 results and stage-3-defining illnesses.
  evidence:
  - reference: PMID:8093740
    reference_title: From the Centers for Disease Control and Prevention. 1993 revised classification system for HIV infection and expanded surveillance case definition for AIDS among adolescents and adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Centers for Disease Control and Prevention (CDC) has revised the
      classification system for HIV infection to emphasize the clinical
      importance of the CD4+ T-lymphocyte count in the categorization of
      HIV-related clinical conditions.
    explanation: This establishes CD4 count as a central HIV-stage classification biomarker.
- name: HIV Viral Load
  biomarker_term:
    preferred_term: HIV Viral Load Measurement
    term:
      id: NCIT:C92544
      label: HIV Viral Load Measurement
  presence: Variable
  context: >-
    Plasma HIV RNA monitors viral replication and treatment response; values can
    become suppressed with effective ART.
  readouts:
  - target: Persistent HIV Infection and Replication
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: Falling HIV RNA indicates pharmacodynamic suppression of viral replication by ART.
    evidence:
    - reference: PMID:36308326
      reference_title: "Mortality and immunovirological outcomes in patients with advanced HIV disease on their first antiretroviral treatment: differential impact of antiretroviral regimens."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients who started an InSTI achieved viral suppression and CD4+ T cell
        count above 350 cells/mm3significantly earlier.
      explanation: The advanced-HIV cohort uses viral suppression as a treatment-response readout.
  evidence:
  - reference: PMID:36308326
    reference_title: "Mortality and immunovirological outcomes in patients with advanced HIV disease on their first antiretroviral treatment: differential impact of antiretroviral regimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main outcomes were mortality, virological effectiveness (percentage of
      patients with viral load of ≤50 copies/mL) and immune restoration
      (percentage of patients with CD4+ T cell count above 350 cells/mm3).
    explanation: This supports viral load as a virologic-treatment outcome in advanced HIV disease.

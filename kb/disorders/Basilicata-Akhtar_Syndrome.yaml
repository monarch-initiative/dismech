diagnosis:
- name: Exome or genome sequencing
  description: Diagnosis is molecular. In the largest cohort, causative MSL3 variants were found by exome or genome sequencing at ten centres.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: A hemizygous or heterozygous pathogenic MSL3 variant, typically in exons 6-13, confirms the diagnosis.
  evidence:
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Twenty-five individuals (15 males, 10 females) with causative variants in MSL3 were ascertained through exome or genome sequencing at ten different sequencing centers.
    explanation: Exome or genome sequencing is the route to diagnosis.

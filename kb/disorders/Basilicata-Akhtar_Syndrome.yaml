genetic:
- name: MSL3
  gene_term:
    preferred_term: MSL3
    term:
      id: hgnc:7370
      label: MSL3
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    MSL3 lies at Xp22.2. Hemizygous (male) and heterozygous (female) variants
    cause the disorder. In the 25-individual cohort, variants were proven de
    novo in 21 of the 22 individuals with parental samples; the remaining one
    was transmitted from a phenotypically normal mother carrying the variant at
    about 8% in blood. All causative variants reported to date (n = 41,
    excluding multigene deletions) lie in exons 6-13 of NM_078629.4, which
    encode the MRG domain.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_f700593e-b7c1-4149-810d-7e71fbea61d0-2022-01-18T170000.000Z
    evidence:
    - reference: CGGV:assertion_f700593e-b7c1-4149-810d-7e71fbea61d0-2022-01-18T170000.000Z
      reference_title: "MSL3 / Basilicata-Akhtar syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: MSL3 | HGNC:7370 | Basilicata-Akhtar syndrome | MONDO:0026730 | XL | Definitive
      explanation: The ClinGen Intellectual Disability and Autism GCEP classifies MSL3 as definitively associated with Basilicata-Akhtar syndrome, X-linked.
  evidence:
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All variants were located within the last eight exons (exon 6–13) of MSL3 (NM_078629.4), encoding the MRG domain, whereas no variants were detected within the first six exons.
    explanation: Positional clustering of causative MSL3 variants.

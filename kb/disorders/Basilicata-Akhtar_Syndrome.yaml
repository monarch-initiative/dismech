- name: Multidisciplinary Surveillance and Supportive Care
  description: >-
    No disease-specific treatment exists. The cohort authors recommend referral
    after diagnosis to ophthalmology (visual impairment, amblyopia risk),
    otolaryngology (early hearing aids or cochlear implants), gastroenterology
    (feeding problems and reflux), nephrology with kidney ultrasound, skeletal
    assessment, and regular neurodevelopmental and neurological follow-up.
  treatment_term:

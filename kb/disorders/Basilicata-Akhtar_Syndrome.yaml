name: Basilicata-Akhtar Syndrome
creation_date: "2026-11-06T20:00:00Z"
category: Mendelian
synonyms:
- Basilicata-Akhtar syndrome
- Basilicata-Akhtar syndrome, X-linked dominant
- MRXSBA
- X-linked MSL3-related disorder
description: >-
  Basilicata-Akhtar syndrome (OMIM 301032) is an X-linked syndromic
  neurodevelopmental disorder caused by MSL3 variants, most of them de novo and
  loss-of-function, that affects males and females equally. MSL3 is a subunit
  of the male-specific lethal (MSL) complex, whose acetyltransferase MOF (KAT8)
  deposits bulk histone H4 lysine 16 acetylation (H4K16ac). Patient variants
  impair MSL complex assembly and reduce H4K16ac in patient cells, with
  transcriptome changes in morphogenesis and cell-migration pathways. The
  presentation begins in infancy with global developmental delay, speech delay,
  truncal hypotonia and early feeding difficulty; spasticity tends to emerge
  with age, and movement disorders (dystonia, hypokinesia, ataxia), autism
  spectrum disorder, secondary macrocephaly, gastrointestinal problems, hearing
  loss and visual abnormalities are common. Hypoplasia of the inferior
  cerebellar vermis is a consistent MRI finding. Pathogenic variants cluster in
  the exons encoding the MRG domain. Management is supportive and organ-system
  based; no disease-specific therapy exists.

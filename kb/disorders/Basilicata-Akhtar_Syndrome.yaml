    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strikingly, on HDACi treatment, we could restore the phenotype of MSL3 mutant cells, as they now adopted the migratory behavior of the Control cells
    explanation: The migration phenotype is reversed by HDAC inhibition, tying it to the acetylation defect.

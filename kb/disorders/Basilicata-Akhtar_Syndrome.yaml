notes: >-
  No GeneReviews chapter covers this disorder or MSL3 (Bookshelf index snapshot
  of 2026-09-10 plus a live PubMed title search, checked 2026-11-06), so the
  25-individual cohort serves as the phenotype baseline. Phenotype frequencies
  come mainly from that single cohort (PMID:33173220), with denominators that vary by feature because counts were
  given only where data were available. A 2025 report of two Chinese patients
  (PMID:41216464) states that hypotonia and macrocephaly were markedly more
  frequent in patients of other ethnicities than in Chinese patients; with so
  few Chinese patients this is not encoded as a population effect. No
  MSL3-specific animal model is described in the cited sources; the nearest in
  vivo data come from a nervous-system-specific Msl2 knockout mouse
  (PMID:42168661), which models a different subunit of the complex and is
  therefore not recorded as a model of this disease. Links from the
  transcriptional defect to individual clinical phenotypes are inferred and
  recorded as indirect.

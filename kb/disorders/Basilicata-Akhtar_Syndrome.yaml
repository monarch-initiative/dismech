    label: Basilicata-Akhtar syndrome
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    MSL3 lies on the X chromosome, and hemizygous males and heterozygous
    females are affected, with no significant difference in the frequency of
    clinical features between the sexes in the largest cohort. Nearly all
    variants arise de novo; one cohort individual inherited the variant from a
    phenotypically normal mother with low-level (about 8%) mosaicism in blood.
    MSL3 is reported to be a facultative escapee from X-chromosome
    inactivation, which the founding study offers as a possible explanation for
    variability among affected females. A MONDO synonym describes the disorder
    as X-linked dominant; the primary cohort papers describe it as X-linked and
    affecting both sexes, and do not themselves use the term dominant.
  evidence:
  - reference: PMID:30224647
    reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These variants cause an X-linked syndrome affecting both sexes.
    explanation: The founding report establishes an X-linked syndrome affecting both males and females.
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Females and males were equally affected.
    explanation: In the 25-individual cohort (15 males, 10 females), no sex difference in feature frequency was found.
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the healthy mother of individual 11, segregation study (Sanger sequencing) suggested the variant as low-level mosaic in blood cells.
    explanation: Documents the one transmission from a mosaic, unaffected parent; all other tested cases were de novo.
  - reference: PMID:30224647
    reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For MSL3, this can be presumably linked to its property of being a facultative escapee, where various degrees of X chromosome inactivation and escape might provide an explanation for the phenotypic and molecular differences among female patients.
    explanation: The authors propose, without testing it, that variable escape from X inactivation explains variability among affected females.
pathophysiology:
- name: MSL3 Loss of Function
  description: >-
    Pathogenic MSL3 alleles are predominantly loss-of-function (nonsense,
    frameshift, splice-site and multi-exon deletion), with a minority of
    missense and in-frame variants at conserved MRG-domain residues. All
    reported causative variants lie in exons 6-13, which encode the MRG domain;
    the cohort authors suggest that a shorter transcript may compensate for
    truncating variants in the first exons, a hypothesis that has not been
    tested experimentally.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MSL3
    term:
      id: hgnc:7370
      label: MSL3
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified multiple variant types in MSL3 (ten nonsense, six frameshift, four splice site, three missense, one in-frame-deletion, one multi-exon deletion), most proven to be de novo, and clustering in the terminal eight exons suggesting that truncating variants in the first five exons might be compensated by an alternative MSL3 transcript.
    explanation: Variant spectrum of the 25-individual cohort, dominated by loss-of-function alleles in the terminal exons.
  - reference: PMID:41216464
    reference_title: "Two Chinese patients with Basilicata-Akhtar syndrome caused by novel MSL3 variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data support the notion that the MRG domain of MSL3 is intolerant to loss-of-function variants and responsible for MSL3 function.
    explanation: Two further patients with MRG-domain variants support the domain-restricted loss-of-function mechanism.
  downstream:
  - target: MSL Complex Assembly Failure
    description: Mutant MSL3 loses its interactions with MOF and MSL1, so the MSL complex does not assemble normally.
    evidence:
    - reference: PMID:30224647
      reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: MSL3 mutations affect MSL complex assembly and activity, accompanied by a pronounced loss of H4K16ac levels in vivo.
      explanation: Patient MSL3 mutations were shown to disrupt complex assembly and activity.
- name: MSL Complex Assembly Failure
  description: >-
    The MRG domain of MSL3 mediates MSL complex formation through MSL1, and
    MSL3 enhances MOF activity toward H4K16. Patient variants expressed in
    HEK293 cells lose interaction with MOF and MSL1.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MSL3
    term:
      id: hgnc:7370
      label: MSL3
  evidence:
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: In transfected HEK293 cells, mutant proteins displayed loss of interaction with the histone acetyltransferase MOF and with MSL1.
    explanation: The cohort paper's introduction summarises the founding study's HEK293 interaction experiments; the experiment itself was performed in PMID:30224647.
  downstream:
  - target: Reduced Histone H4K16 Acetylation
    description: Without an intact MSL complex, MOF-dependent H4K16 acetylation falls.
    evidence:
    - reference: PMID:30224647
      reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Hence, loss of MSL3 in patients appears to primarily affect H4K16ac.
      explanation: In patient-derived cells, H4K16ac was the histone modification most affected by MSL3 loss.
- name: Reduced Histone H4K16 Acetylation
  description: >-
    Patient-derived cells show a bulk reduction of H4K16ac, including in
    heterozygous female patient samples, while MOF levels and other histone
    modifications are unchanged. HDAC inhibitor treatment restores H4K16ac in
    patient cells in vitro.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MSL3
    term:
      id: hgnc:7370
      label: MSL3
  molecular_functions:
  - preferred_term: histone H4K16 acetyltransferase activity
    term:
      id: GO:0046972
      label: histone H4K16 acetyltransferase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30224647
    reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Remarkably, quantification of these stainings showed a global reduction of H4K16ac in these heterozygous XMSL3-WT/XMSL3-MUT female patient samples
    explanation: The reduction is seen in heterozygous female patient samples as well as in hemizygous males.
  downstream:
  - target: Dysregulated Developmental Gene Expression
    description: Reduced H4K16ac is accompanied by transcriptome changes, mainly downregulation, of genes in developmental pathways.
    evidence:
    - reference: PMID:30224647
      reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Patient-derived cells display global transcriptome alterations of pathways involved in morphogenesis and cell migration.
      explanation: Transcriptome profiling of patient cells links the acetylation defect to altered developmental gene programmes.
- name: Dysregulated Developmental Gene Expression
  description: >-
    Patient-derived cells show global transcriptome alterations, predominantly
    downregulation, of genes in morphogenesis and cell-migration pathways.
    HDAC inhibitor treatment rescues selected downregulated targets. The
    steps linking these changes in peripheral cells to brain and other organ
    phenotypes have not been shown in human neural tissue, so the edges from
    this node to clinical phenotypes are recorded as indirect.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:33173220
    reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: Transcriptome analyses of patient cells showed dysregulation, mainly downregulation, of genes involved in developmental pathways.
    explanation: Summarises the direction of the transcriptional change reported in the founding study.
  downstream:
  - target: Altered Fibroblast Migration
    description: Patient fibroblasts migrate faster than controls, a cellular readout of the cell-migration pathway changes.
    evidence:
    - reference: PMID:30224647
      reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we had observed that MSL3 patient-derived fibroblasts migrate faster than Control cells.
      explanation: Direct cellular observation in patient fibroblasts.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The neurodevelopmental intermediates between reduced H4K16ac-dependent transcription and developmental delay are not characterised in human neural tissue.
    evidence:
    - reference: PMID:30224647
      reference_title: De novo mutations in MSL3 cause an X-linked syndrome marked by impaired histone H4 lysine 16 acetylation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Clinical features of the syndrome include global developmental delay, progressive gait disturbance, and recognizable facial dysmorphism.
      explanation: The founding study pairs the H4K16ac defect with the clinical syndrome; the intervening neural steps are not shown.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Intellectual disability follows from the same uncharacterised neurodevelopmental intermediates.
    evidence:
    - reference: PMID:33173220
      reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: The main clinical findings comprised developmental delay and intellectual disability ranging from mild to severe.
      explanation: Intellectual disability is a core feature of the MSL3 loss-of-function syndrome; the mechanistic intermediates are not resolved.
  - target: Inferior Cerebellar Vermis Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: How MSL complex dysfunction produces hypoplasia of the inferior cerebellar vermis has not been studied.
    evidence:
    - reference: PMID:33173220
      reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Hypoplasia of the cerebellar vermis emerged as a consistent magnetic resonance image (MRI) finding.
      explanation: The vermis finding is consistent across imaged MSL3 patients; the developmental mechanism is not described.
  - target: Axial Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Infantile truncal hypotonia is a near-constant feature; its mechanism downstream of MSL3 loss is uncharacterised.
    evidence:
    - reference: PMID:33173220
      reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Muscular hypotonia was predominantly evident in infancy, while spasticity appeared to evolve with increasing age.
      explanation: Hypotonia is a recurrent consequence of MSL3 loss of function in the cohort; intermediates are not resolved.
  - target: Autism Spectrum Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Autism spectrum disorder affects about half of assessed individuals; the neural intermediates are uncharacterised.
    evidence:
    - reference: PMID:33173220
      reference_title: Defining the genotypic and phenotypic spectrum of X-linked MSL3-related disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: ASD, found in 50% of all individuals, emerged as a new feature of X-linked, MSL3-related disorder.
      explanation: Autism spectrum disorder is a recurrent consequence of MSL3 loss of function; intermediates are not resolved.
- name: Altered Fibroblast Migration
  description: >-
    MSL3 patient-derived fibroblasts migrate faster than control fibroblasts in
    vitro, and HDAC inhibitor treatment restores control-like migratory
    behaviour. This is a cellular readout in peripheral cells, not a
    demonstrated cause of any clinical phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:

name: Hypertrophic Cardiomyopathy 30, Atrial
creation_date: "2026-08-19T00:00:00Z"
description: >-
  Cardiomyopathy, familial hypertrophic, 30, atrial (CMH30; OMIM 620734) is an
  autosomal recessive cardiomyopathy caused by biallelic loss-of-function
  variants in CORIN, the gene encoding the type II transmembrane cardiac serine
  protease that converts pro-atrial natriuretic peptide (pro-ANP) into mature,
  bioactive ANP. Despite its placement in the numbered familial hypertrophic
  cardiomyopathy series, CMH30 is not a sarcomeric, left-ventricular
  hypertrophic cardiomyopathy: its defining lesion is an **endocrine** one, and
  the phenotype is a left-atrial cardiomyopathy - an enlarged, thickened,
  fibrotic left atrium with atrial flutter and fibrillation, on a background of
  hypertension. The disease is delineated from a single sibship reported in 2023
  in whom a homozygous CORIN null variant was accompanied by undetectable
  circulating corin and undetectable N-terminal pro-ANP, while B-type
  natriuretic peptide was elevated - the observation on which the authors' core
  inference rests, namely that BNP cannot fully compensate for a dead ANP arm
  and that corin is critical to normal left atrial function. The mechanism is
  therefore a natriuretic-peptide-axis failure read out in the atrium: without
  ANP there is no NPR-A/cGMP tone to oppose sodium and volume retention,
  renin-angiotensin-aldosterone drive, cardiomyocyte hypertrophy, or fibroblast
  activation, and the left atrium - the tissue that both synthesises ANP and
  bears the earliest pressure and volume load - is where that loss is expressed
  first. Corin-knockout mice reproduce the endocrine and blood-pressure arms of
  this chain (abolished pro-ANP processing, salt-sensitive spontaneous
  hypertension, late hypertrophy and fibrosis, rescued by recombinant corin) but
  not the atrial selectivity of the human disease. The human evidence base is
  one family; penetrance, natural history, arrhythmic and stroke risk, and any
  genotype-specific therapy are all unmeasured.
category: Mendelian

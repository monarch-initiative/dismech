  downstream:
  - target: Left Atrial Fibrosis
    description: >-
      Activated fibroblasts are the source of the excess atrial matrix.
- name: Left Atrial Fibrosis
  biological_scale: TISSUE
  role: effector
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Excess extracellular matrix accumulates in the left atrial wall. In the
    index sibship this was reported as fibrosis of the left atrium, with one of
    two circulating fibrosis protein markers elevated. In corin-knockout mice,
    cardiac fibrosis develops with age and is reversed by recombinant corin
    protein, which also lowers the transcript signature associated with
    fibrosis - a rescue experiment that places the matrix accumulation causally
    downstream of corin loss rather than merely alongside it.

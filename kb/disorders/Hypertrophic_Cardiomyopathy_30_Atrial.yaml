    explanation: >-
      Supplies the zymogen-activation architecture of corin that a null allele
      removes entirely. IN_VITRO because the activation mechanism is established
      in cell-based and purified-protein assays.
  - reference: PMID:14559895
    reference_title: "Functional analysis of the transmembrane domain and activation cleavage of human corin: design and characterization of a soluble corin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a mutation at the conserved activation cleavage site, R801A, abolished the
      function of corin, demonstrating that the activation cleavage is essential
      for corin activity
    explanation: >-
      Shows the enzymatic activity is all-or-none at the activation step,
      supporting the treatment of a null allele as complete loss of the
      protease.
  downstream:
  - target: Failure of Pro-ANP Processing
    description: >-
      Absence of the protease removes the only established physiological route
      from pro-ANP to mature ANP.
- name: Failure of Pro-ANP Processing
  biological_scale: MOLECULAR
  role: effector
  description: >-
    ANP is synthesised in cardiac myocytes as the precursor pro-ANP, which must
    be cleaved to release the bioactive C-terminal peptide. Corin is that
    convertase, and its cleavage of pro-ANP is highly sequence specific. In the
    absence of corin the precursor is not processed: corin-knockout mice have
    elevated pro-ANP with no detectable ANP, and the affected human sibling had
    no detectable N-terminal pro-ANP alongside no detectable corin.
  cell_types:
  - preferred_term: regular atrial cardiac myocyte
    term:
      id: CL:0002129
      label: regular atrial cardiac myocyte
  biological_processes:
  - preferred_term: peptide hormone processing
    term:
      id: GO:0016486
      label: peptide hormone processing
    modifier: DECREASED
  evidence:
  - reference: PMID:10880574
    reference_title: "Corin, a transmembrane cardiac serine protease, acts as a pro-atrial natriuretic peptide-converting enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that recombinant human corin converts pro-ANP to ANP and
      that the cleavage in pro-ANP by corin is highly sequence specific.
    explanation: >-
      Establishes corin as the enzyme that performs the pro-ANP to ANP
      conversion step lost in this disease.
  - reference: PMID:15637153
    reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cor-/- mice have elevated levels of pro-ANP but no detectable levels of
      ANP as compared with WT littermates.
    explanation: >-
      In vivo demonstration that corin loss blocks the processing step, leaving
      precursor accumulation with no mature hormone.
  - reference: PMID:15637153
    reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, our data establish corin as the physiological pro-ANP convertase and
      indicate that corin deficiency may contribute to hypertensive heart
      disease.
    explanation: >-
      States that corin is the physiological, not merely a candidate,
      convertase - the reason no redundant pathway rescues the human null.
  downstream:
  - target: Deficient ANP-NPR-A-cGMP Signalling
    description: >-
      No mature ANP is released, so the receptor arm downstream of it is not
      engaged.
  - target: Incomplete BNP Compensation
    description: >-
      The intact BNP arm is left as the only natriuretic peptide signal.
- name: Deficient ANP-NPR-A-cGMP Signalling
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Mature ANP acts through the natriuretic peptide receptor A guanylyl cyclase
    to raise cGMP in vascular, renal, and cardiac target cells, producing
    natriuresis, vasodilation, and restraint of the
    renin-angiotensin-aldosterone system. With no mature ANP, this cGMP tone is
    absent. The pharmacological converse is directly demonstrated: giving
    recombinant corin protein back to corin-knockout mice raised plasma cGMP and
    lowered angiotensin II and aldosterone. This is the rate-limiting node of
    the disease - everything distal to it is a consequence of missing cGMP
    signalling rather than of any structural cardiac protein defect.
  biological_processes:
  - preferred_term: regulation of systemic arterial blood pressure by atrial natriuretic peptide
    term:
      id: GO:0003050
      label: regulation of systemic arterial blood pressure by atrial natriuretic peptide
    modifier: DECREASED
  - preferred_term: renal sodium excretion
    term:
      id: GO:0035812
      label: renal sodium excretion
    modifier: DECREASED
  molecular_functions:
  - preferred_term: natriuretic peptide receptor activity
    term:
      id: GO:0016941
      label: natriuretic peptide receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:37636304
    reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The corin treatment also decreased the gene expression associated with
      cardiac hypertrophy and fibrosis, increased plasma cGMP levels, lowered
      plasma levels of N-terminal pro-atrial natriuretic peptide, angiotensin
      II, and aldosterone, and lessened lung edema in the Corin KO mice
      subjected to TAC.
    explanation: >-
      Restoring corin restores the cGMP signal and suppresses RAAS mediators,
      establishing that corin deficiency is what removes cGMP tone and
      dis-inhibits RAAS.
  - reference: PMID:33125488
    reference_title: "Function and regulation of corin in physiology and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Corin deficiency prevents ANP generation and alters electrolyte and body
      fluid homeostasis.
    explanation: >-
      States the physiological consequence of corin loss for fluid and
      electrolyte handling. Evidence source is OTHER because this is a review
      synthesising in vitro, model-organism, and human genetic data.
  downstream:
  - target: Sodium and Volume Retention with Hypertension
    description: >-
      Loss of natriuresis, vasodilation, and RAAS restraint raises blood
      pressure.
  - target: Cardiac Fibroblast Activation
    description: >-
      Loss of the antifibrotic arm of natriuretic peptide signalling
      dis-inhibits fibroblast activation.
  - target: Left Atrial Myocardial Hypertrophy and Enlargement
    description: >-
      Loss of the antihypertrophic arm of natriuretic peptide signalling permits
      cardiomyocyte hypertrophy independently of afterload.
- name: Incomplete BNP Compensation
  biological_scale: ORGANISM
  role: modifier
  description: >-
    Corin also participates in processing of the B-type natriuretic peptide
    precursor, but in the affected sibling BNP was elevated rather than absent,
    so the BNP arm remained operational while the ANP arm was dead. That
    dissociation is the pivot of the primary report's argument: a raised BNP did
    not prevent the atrial cardiomyopathy, hypertension, arrhythmia, or fibrosis
    from developing, so BNP does not substitute for ANP at the atrium. Curators
    should not read the elevated BNP as evidence of preserved natriuretic
    signalling - it is evidence of a failed rescue.
  biological_processes:
  - preferred_term: sodium ion homeostasis
    term:
      id: GO:0055078
      label: sodium ion homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but had elevated levels of B-type natriuretic peptide (BNP) and one of the
      two protein markers of fibrosis that we tested
    explanation: >-
      Documents the dissociation - BNP up, ANP absent - on which the
      failed-compensation claim rests.
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These and other findings support the hypothesis that BNP cannot fully
      compensate for a lack of activation of the ANP pathway and that corin is
      critical to normal ANP activity, left atrial function, and cardiovascular
      homeostasis.
    explanation: >-
      The authors' own statement of the incomplete-compensation inference and of
      corin's specific criticality to left atrial function.
  downstream:
  - target: Sodium and Volume Retention with Hypertension
    description: >-
      Because BNP does not restore the missing ANP signal, the downstream volume
      and pressure phenotype proceeds.
- name: Sodium and Volume Retention with Hypertension
  biological_scale: ORGANISM
  role: amplifier
  description: >-
    Without ANP-driven natriuresis and vasodilation, and with the
    renin-angiotensin-aldosterone system no longer restrained, sodium and volume
    are retained and systemic blood pressure rises. Both affected siblings were
    hypertensive. Corin-knockout mice reproduce this arm precisely: they have
    spontaneous hypertension by radiotelemetry, worsened by dietary salt
    loading, and the same salt-sensitive pattern appears when corin activation
    is blocked upstream in Pcsk6-knockout mice. The resulting chronic pressure
    and volume load is the mechanical input to atrial remodelling.

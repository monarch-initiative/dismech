        cardiac-dysfunction nodes.
  - target: Atrial Arrhythmogenic Substrate
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No atrial arrhythmia phenotype has been reported in corin-knockout mice.
      The published characterisation is of blood pressure, chamber hypertrophy,
      fibrosis, contractile function, and lung oedema; rhythm is not among the
      reported endpoints, and the arrhythmia that dominates the human phenotype
      is therefore unmodelled.
    limitations: >-
      This is a negative claim about model coverage, and it should be read as
      such: the absence of a reported arrhythmia phenotype reflects endpoints
      that were not assessed as much as any demonstrated absence of arrhythmia.
      Either way the model cannot currently substantiate the arrhythmic arm of
      the human disease, which is the arm carrying the stroke and
      quality-of-life burden.
    evidence:
    - reference: PMID:37636304
      reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cardiac function was assessed by echocardiography and tissue analysis in
        Corin KO mice at different ages or subjected to transverse aortic
        constriction (TAC), which increased pressure overload.
      explanation: >-
        The stated assessment battery for this model is echocardiography and
        tissue analysis, with no rhythm monitoring - so no atrial arrhythmia
        endpoint exists to recapitulate the human phenotype.
  evidence:
  - reference: PMID:15637153
    reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, our data establish corin as the physiological pro-ANP convertase and
      indicate that corin deficiency may contribute to hypertensive heart
      disease.
    explanation: >-
      Establishes the model as the definitive in vivo system for the
      corin/pro-ANP axis this disease disrupts.
diagnosis:
- name: Transthoracic echocardiography with dedicated atrial assessment
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    First-line imaging, but it must be read against the atrial phenotype rather
    than the usual hypertrophic-cardiomyopathy checklist. The finding of
    interest is left atrial size, wall thickness, and function; a normal
    ventricular septal thickness and the absence of outflow-tract obstruction
    are not reassurance in this entity, because the disease is not a sarcomeric
    ventricular cardiomyopathy. Ventricular ejection fraction should also be
    recorded, since reduced systolic function is part of the reported synopsis
    and is plausibly a late consequence.
  results: >-
    Enlarged, thickened left atrium; ventricular ejection fraction may be
    reduced.
  notes: >-
    No echocardiographic criteria specific to CORIN-related atrial
    cardiomyopathy have been published; this is a rational work-up built from
    the reported phenotype rather than a validated diagnostic pathway.
- name: Ambulatory rhythm monitoring and 12-lead electrocardiography
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Atrial flutter and atrial fibrillation are core to the phenotype and may be
    paroxysmal, so a single resting ECG is insufficient. Detected atrial
    arrhythmia is what drives the anticoagulation and rate/rhythm-control
    decisions, which are the only interventions with any real leverage in this
    disease at present.
  results: >-
    Atrial fibrillation or atrial flutter.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings presented with cardiomyopathy, hypertension, arrhythmia, and
      fibrosis of the left atrium.
    explanation: >-
      Establishes arrhythmia as a presenting feature that rhythm monitoring
      would capture. PARTIAL because the report does not evaluate monitoring
      strategies.
- name: Cardiac magnetic resonance imaging with late gadolinium enhancement
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The modality that can show atrial fibrosis directly rather than by
    inference. Atrial wall thinness makes atrial late-gadolinium-enhancement
    imaging technically demanding and it is not a routinely validated
    measurement outside specialist centres, so a negative study should not be
    used to exclude the fibrotic phenotype.
  results: >-
    Left atrial wall fibrosis; atrial and ventricular morphology and function.
- name: Natriuretic peptide profiling (NT-pro-ANP with BNP)
  diagnosis_term:
    preferred_term: Atrial Natriuretic Peptide Measurement
    term:
      id: NCIT:C74886
      label: Atrial Natriuretic Peptide Measurement
  description: >-
    Mechanistically the most discriminating biochemistry available: the
    corin-null state produces undetectable circulating corin and undetectable
    N-terminal pro-ANP with an elevated BNP. That pattern - a dead ANP arm
    beside a live BNP arm - is not produced by ordinary heart failure, in which
    both rise together. It is nonetheless NOT a validated diagnostic assay for
    this disease, and NT-pro-ANP is not a routine clinical test; treat it as a
    mechanistic confirmation once CORIN is implicated, not as a screening test.
  results: >-
    Undetectable corin and N-terminal pro-ANP with elevated B-type natriuretic
    peptide.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A plasma sample obtained from one of the siblings had no detectable levels
      of corin or N-terminal pro-ANP but had elevated levels of B-type
      natriuretic peptide (BNP) and one of the two protein markers of fibrosis
      that we tested.
    explanation: >-
      Reports the full biochemical pattern this test is intended to detect.
- name: CORIN sequencing on a cardiomyopathy or arrhythmia gene panel
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular confirmation requires biallelic CORIN variants. CORIN is not on
    every legacy hypertrophic-cardiomyopathy panel, which are built around
    sarcomeric genes, so a "negative HCM panel" does not exclude this diagnosis;
    check gene content or move to exome/genome sequencing. Because inheritance
    is recessive, the informative family pattern is affected siblings with
    unaffected heterozygous parents, not a multigenerational dominant pedigree.
  results: >-
    Biallelic pathogenic CORIN variants.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each had a homozygous null variant in CORIN, the gene encoding atrial
      natriuretic peptide (ANP)-converting enzyme.
    explanation: >-
      Establishes the molecular finding that confirms the diagnosis.
treatments:
- name: Antihypertensive Therapy
  description: >-
    Blood-pressure control is the highest-value phenotype-directed intervention,
    because hypertension is both an early and a mechanistically upstream part of
    the chain: it is the mechanical load that drives atrial hypertrophy and
    fibrosis, and it is the arm of the phenotype most firmly established across
    human and model-organism evidence. No agent class has been tested in
    CORIN-null patients and no genotype-specific recommendation exists. The
    mouse rescue data showing that restoring corin lowers angiotensin II and
    aldosterone offer a mechanistic rationale for renin-angiotensin-aldosterone
    blockade specifically, but that is an inference, not a trial result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antihypertensive Therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
  target_mechanisms:
  - target: Sodium and Volume Retention with Hypertension
    treatment_effect: INHIBITS
    description: >-
      Pharmacological blood-pressure lowering substitutes for the missing
      ANP-mediated natriuretic and vasodilatory tone at the level of the
      systemic phenotype, without restoring the signal itself.
  notes: >-
    Extrapolated from general hypertension and cardiomyopathy management. No
    CORIN-specific outcome data exist.
- name: Anticoagulation for Atrial Arrhythmia
  description: >-
    Atrial fibrillation on a structurally remodelled, fibrotic left atrium is
    the stroke-risk pathway in this disease, and CORIN variation is separately
    associated with stroke. Contemporary hypertrophic-cardiomyopathy guidance
    favours anticoagulation once clinical atrial fibrillation is documented,
    largely irrespective of conventional risk-score thresholds; whether an
    isolated CORIN atrial phenotype should inherit that rule rather than a
    standard CHA2DS2-VASc assessment is a specialist judgement that has not
    been studied.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  notes: >-
    Deliberately carries no `target_mechanisms` link: anticoagulation does not
    act on any pathophysiology node curated here. It prevents thrombus
    formation in the fibrillating, dilated atrium - a complication of the
    arrhythmogenic substrate rather than a step in the mechanism chain - so
    asserting an edge to `Atrial Arrhythmogenic Substrate` would misstate what
    the drug does.
  evidence:
  - reference: PMID:40316193
    reference_title: "Corin in cardiovascular diseases and stroke."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      CORIN variants have been identified in patients with hypertension, heart
      failure, atrial fibrillation, and stroke.
    explanation: >-
      Supports the atrial-fibrillation-to-stroke concern that motivates
      anticoagulation. PARTIAL because it associates CORIN variation with these
      phenotypes generally and does not evaluate anticoagulation. Evidence
      source OTHER (review).
- name: Rate or Rhythm Control for Atrial Flutter and Fibrillation
  description: >-
    Standard antiarrhythmic pharmacotherapy or catheter ablation, applied on
    ordinary rhythm-management indications. There is no evidence that ablation
    outcomes in a genetically fibrotic atrium resemble those in ordinary atrial
    fibrillation, and the fibrotic substrate is a recognised predictor of
    recurrence generally, so expectations should be set accordingly. Genotype
    alone is not an indication for any procedure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antiarrhythmic agent
      term:
        id: NCIT:C47793
        label: Antiarrhythmic Agent
  notes: >-
    Fully extrapolated from general atrial-arrhythmia management; no
    CORIN-specific rhythm-control evidence exists.
- name: Catheter Ablation of Atrial Arrhythmia
  description: >-
    Considered on standard rhythm-control indications when drug therapy fails.
    Listed separately from pharmacological rhythm control because the
    substrate-dependence of its success is the specific concern in a disease
    defined by atrial fibrosis.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Cardiac Ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  notes: >-
    No published experience of catheter ablation in CORIN-related atrial
    cardiomyopathy.
- name: Genetic Counselling and Cascade Testing
  description: >-
    Autosomal recessive inheritance changes the counselling arithmetic relative
    to the rest of the hypertrophic-cardiomyopathy series: the recurrence risk
    is 25% for siblings of a proband, unaffected parents are obligate carriers,
    and offspring of a proband are obligate carriers rather than at 50% risk.
    Cascade testing should target siblings first. Whether heterozygous carriers
    warrant blood-pressure surveillance is unknown - the hypomorphic-allele
    literature associating reduced corin activity with hypertension makes it a
    reasonable question, not an established recommendation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each had a homozygous null variant in CORIN, the gene encoding atrial
      natriuretic peptide (ANP)-converting enzyme.
    explanation: >-
      The homozygous, recessive genotype is what determines the counselling
      arithmetic described here.
- name: Recombinant Corin Protein Replacement (experimental, preclinical only)
  description: >-
    The mechanistically obvious therapy: give back the missing enzyme. In
    corin-knockout mice, recombinant soluble corin restores pro-ANP conversion
    and releases bioactive ANP, and in pressure-overloaded knockout mice
    recombinant corin protein ameliorated cardiac dysfunction, hypertrophy and
    fibrosis while raising plasma cGMP and lowering angiotensin II and
    aldosterone. NOTHING about this has been tested in humans - no dose, no
    safety, no immunogenicity, no delivery route, no trial. It is listed here
    because it is the direct pharmacological converse of the disease lesion and
    therefore the natural target for future work, not as a treatment option.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Failure of Pro-ANP Processing
    treatment_effect: ACTIVATES
    description: >-
      Supplies the absent convertase activity, restoring pro-ANP to ANP
      conversion at the top of the chain rather than palliating its downstream
      consequences.
    evidence:
    - reference: PMID:15637153
      reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Infusion of an active recombinant soluble corin transiently restores
        pro-ANP conversion, resulting in the release of circulating biologically
        active ANP.
      explanation: >-
        Direct demonstration that the agent acts on this mechanism node.
  evidence:
  - reference: PMID:37636304
    reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When the TAC-operated Corin KO mice were treated with recombinant corin
      protein, cardiac dysfunction, hypertrophy, and fibrosis were ameliorated.
    explanation: >-
      Shows the structural and functional benefit of enzyme replacement in the
      model organism.
  - reference: PMID:37636304
    reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Corin protein may be used to reduce cardiac hypertrophy and fibrosis,
      suppress the renin-angiotensin-aldosterone system, and improve cardiac
      function in HF.
    explanation: >-
      The authors' own statement of the therapeutic hypothesis, which remains
      untested in humans.
  notes: >-
    Preclinical concept only. No human efficacy, dose, safety, immunogenicity,
    or delivery data exist, and no clinical trial in CORIN-related disease has
    been registered.
discussions:
- discussion_id: corin_atrial_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the cardiomyopathy of biallelic CORIN loss selectively LEFT ATRIAL in
    humans, when corin loss removes a systemic endocrine signal and the
    corin-knockout mouse shows generalised, hypertension-attributed cardiac
    hypertrophy and fibrosis?
  attaches_to:
  - pathophysiology#Left Atrial Myocardial Hypertrophy and Enlargement
  - pathophysiology#Left Atrial Fibrosis
  rationale: >-
    The atrial localisation is what makes this a distinct disease entity rather
    than "hypertensive heart disease due to an endocrine defect", and it is
    exactly the part with no mechanistic explanation. Three candidate accounts
    are on the table and no data currently separate them: (1) an autocrine or
    paracrine account, in which the left atrium suffers most because it is the
    tissue that synthesises pro-ANP, so the local concentration of mature ANP
    falls furthest there; (2) a mechanical account, in which the thin-walled
    atrium is simply the chamber least able to tolerate the chronic pressure and
    volume load created by systemic hypertension, making the atrial
    predominance a consequence of hypertension rather than of local signalling;
    and (3) an ascertainment account, in which the atrial phenotype is what
    brought a single sibship to attention and a larger cohort would show
    ventricular disease too - the OMIM/MedGen synopsis does already record
    reduced left ventricular ejection fraction. Distinguishing these matters
    clinically, because account (2) implies that aggressive blood-pressure
    control should largely prevent the atrial disease, while account (1) implies
    it should not.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These and other findings support the hypothesis that BNP cannot fully
      compensate for a lack of activation of the ANP pathway and that corin is
      critical to normal ANP activity, left atrial function, and cardiovascular
      homeostasis.
    explanation: >-
      The authors themselves frame corin's criticality as being to LEFT ATRIAL
      function specifically, which is the observation this gap asks the
      mechanism for.
  - reference: PMID:37636304
    reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Corin KO mice had progressive cardiac dysfunction with cardiac hypertrophy
      and fibrosis after 9 months of age, likely due to chronic hypertension.
    explanation: >-
      The competing mechanical account: in the model, cardiac remodelling from
      corin loss is attributed to chronic hypertension and is not
      chamber-selective. PARTIAL because it establishes the alternative rather
      than resolving between accounts.
  proposed_experiments:
  - experiment_id: chamber_resolved_anp_cgmp
    name: Chamber-resolved ANP and cGMP measurement in corin-null myocardium
    description: >-
      Measure mature ANP and cGMP separately in atrial and ventricular
      myocardium of corin-null models, with and without blood-pressure
      normalisation, to test whether the atrium sustains a distinct local
      signalling deficit beyond the systemic one.
  - experiment_id: bp_controlled_corin_null_cohort
    name: Blood-pressure-controlled corin-null cohort
    description: >-
      Follow atrial size and fibrosis in corin-deficient animals maintained
      normotensive by antihypertensive therapy from a young age. Persistent
      atrial remodelling under normal blood pressure would favour the autocrine
      account; its absence would favour the mechanical one.
- discussion_id: corin_null_mouse_atrial_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the constitutive corin-knockout mouse model the human CMH30 phenotype,
    given that it reproduces the endocrine and blood-pressure arms faithfully
    but neither the atrial selectivity nor the atrial arrhythmia that define the
    human disease?
  attaches_to:
  - pathophysiology#Left Atrial Myocardial Hypertrophy and Enlargement
  - pathophysiology#Atrial Arrhythmogenic Substrate
  rationale: >-
    Evidence in the model exists and is strong - abolished pro-ANP processing,
    salt-sensitive spontaneous hypertension, age-dependent hypertrophy and
    fibrosis, and rescue by recombinant corin - so this is a translational
    validity question rather than an absence of evidence. Two specific
    mismatches limit what may be inferred. First, the murine hypertrophy and
    fibrosis are not chamber-selective and are attributed by the authors to
    chronic hypertension, so the model cannot substantiate the left atrial
    localisation that names the human disease. Second, and more consequentially,
    the reported assessment battery is echocardiography and tissue histology
    with no rhythm monitoring, so the atrial flutter and fibrillation that carry
    the human stroke and symptom burden have no counterpart endpoint at all -
    the model is silent on them rather than negative. The
    transverse-aortic-constriction variant compounds this by imposing surgical
    VENTRICULAR afterload, a stimulus with no equivalent in the spontaneous
    human disease.
    Consequently the mouse should be cited for the corin/ANP/blood-pressure
    axis and for the corin-replacement rescue, and NOT as support for the
    atrial phenotype.
  evidence:
  - reference: PMID:37636304
    reference_title: "Corin deficiency impairs cardiac function in mouse models of heart failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac function was assessed by echocardiography and tissue analysis in
      Corin KO mice at different ages or subjected to transverse aortic
      constriction (TAC), which increased pressure overload.
    explanation: >-
      Documents the model's assessment battery - imaging and histology, with no
      rhythm monitoring - which is the specific reason the atrial arrhythmia arm
      of the human phenotype has no counterpart endpoint in the model.
  - reference: PMID:15637153
    reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, Cor-/- mice exhibit cardiac hypertrophy resulting in a mild
      decline in cardiac function later in life.
    explanation: >-
      The murine hypertrophy is reported at whole-heart level with no atrial
      localisation, establishing the chamber-selectivity mismatch this
      discussion records.
  proposed_experiments:
  - experiment_id: atrial_ep_aged_corin_null
    name: Atrial electrophysiology in aged corin-null mice
    description: >-
      Implanted telemetry or programmed atrial stimulation in aged corin-null
      mice to determine whether atrial arrhythmia occurs at all in the model,
      converting a silent endpoint into a positive or negative result.
  - experiment_id: atrium_restricted_corin_deletion
    name: Atrium-restricted conditional Corin deletion
    description: >-
      Delete Corin selectively in atrial cardiomyocytes to test whether atrial
      disease can be produced without systemic hypertension - the cleanest
      discriminator between the autocrine and mechanical accounts of atrial
      selectivity.
  - experiment_id: ipsc_atrial_cardiomyocytes
    name: Patient-derived iPSC atrial cardiomyocytes and engineered atrial tissue
    description: >-
      Isogenic CRISPR-corrected patient lines differentiated to atrial
      cardiomyocytes, with pro-ANP cleavage, cGMP, conduction, and matrix
      production as readouts, to establish the human atrial cell-autonomous
      consequence of the null genotype.
- discussion_id: corin_cmh30_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the penetrance, natural history, arrhythmic burden, stroke rate,
    and prognosis of biallelic CORIN loss of function?
  attaches_to:
  - pathophysiology#Biallelic CORIN Null Variant
  - phenotype#Atrial Cardiomyopathy
  rationale: >-
    Every quantitative dimension of this entity is unmeasured because the human
    evidence base is a single sibship of two. There is no second family, no
    cohort, no prevalence estimate, no age-of-onset distribution, no penetrance
    figure for biallelic carriers, no arrhythmia incidence, no stroke rate, and
    no survival data. Nothing in this entry's treatment section rests on
    CORIN-specific outcome evidence; all of it is extrapolated from general
    hypertension, atrial-fibrillation, and cardiomyopathy management. Curators
    should resist the temptation to borrow numbers from the sarcomeric
    hypertrophic cardiomyopathy series that shares the CMH naming - those
    figures describe a mechanistically unrelated ventricular disease. A second
    reported family with an independent CORIN null genotype would be the single
    most valuable addition to this entry.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings presented with cardiomyopathy, hypertension, arrhythmia, and
      fibrosis of the left atrium.
    explanation: >-
      The entire human evidence base for this entity is the two individuals
      named here, which is what makes every quantitative dimension unmeasured.
- discussion_id: corin_hypomorphic_allele_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should the common CORIN I555(P568) hypomorphic allele, and the CORIN-low
    fibrotic cardiomyopathy transcriptomic cluster, be curated as part of this
    disease entry?
  attaches_to:
  - genetic#CORIN
  - pathophysiology#Cardiac Fibroblast Activation
  rationale: >-
    Resolved as NO for the phenotype and prevalence sections, YES as
    mechanistic corroboration only. The I555(P568) allele (T555I + Q568P) is
    common in people of African ancestry, reduces rather than abolishes
    natriuretic peptide processing, and is associated with hypertension, an
    enhanced hypertrophic response to afterload, and impaired BNP processing in
    heart failure. Those are common complex traits attributable to a hypomorph
    in the heterozygous state, not the recessive null disease described here,
    and importing their frequencies or outcomes would inflate this entry with
    numbers that do not describe it. The same boundary applies to the
    transcriptomic finding that a low-CORIN, fibroblast-activated cluster of
    sporadic cardiomyopathy has worse ejection fraction and prognosis: that
    cohort is not CORIN-null. Both bodies of work are retained where they speak
    to MECHANISM - that reduced corin activity is sufficient to raise blood
    pressure and to dis-inhibit cardiac fibroblast activation - and the
    corresponding evidence items are marked PARTIAL to record exactly that
    distinction.
  evidence:
  - reference: PMID:16216958
    reference_title: "Corin gene minor allele defined by 2 missense mutations is common in blacks and associated with high blood pressure and hypertension."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The corin I555 (P568) allele is common in blacks and is associated with
      higher blood pressure and an increased risk for prevalent hypertension.
    explanation: >-
      Defines the hypomorphic-allele literature this boundary excludes from the
      phenotype and prevalence sections: a common allele producing a common
      complex trait, not the recessive null disease. PARTIAL because it
      concerns a different genotype from CMH30.
  - reference: PMID:17296875
    reference_title: "Corin I555(P568) allele is associated with enhanced cardiac hypertrophic response to increased systemic afterload."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that the corin I555(P568) allele represents a cardiac
      hypertrophy-sensitizing genetic locus in systemic hypertension.
    explanation: >-
      Retained as mechanistic corroboration that reduced corin activity
      sensitises the heart to hypertrophy under afterload. PARTIAL because the
      genotype is a common hypomorph in the heterozygous state, so neither its
      effect sizes nor its frequencies transfer to CMH30.
  - reference: PMID:39315128
    reference_title: "Progression from cardiomyopathy to heart failure with reduced ejection fraction: A CORIN deficient course."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      This cluster also exhibited lower left ventricular ejection fraction
      (LVEF) and worse prognostic outcomes, establishing the significance of
      this molecular subclassification.
    explanation: >-
      The transcriptomic prognostic association this boundary declines to
      import as prognosis for CMH30. PARTIAL because the cohort is sporadic
      cardiomyopathy stratified by CORIN expression, not CORIN-null patients.
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

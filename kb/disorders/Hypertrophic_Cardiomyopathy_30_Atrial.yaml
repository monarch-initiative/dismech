    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings presented with cardiomyopathy, hypertension, arrhythmia, and
      fibrosis of the left atrium.
    explanation: >-
      Documents hypertension as part of the human corin-null phenotype.
  - reference: PMID:15637153
    reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using radiotelemetry to assess blood pressure, we find that Cor-/- mice
      have spontaneous hypertension as compared with WT mice, and it is enhanced
      after dietary salt loading.
    explanation: >-
      Establishes causality and salt-dependence of the hypertension arm in a
      corin-null organism.
  - reference: PMID:26259032
    reference_title: "PCSK6-mediated corin activation is essential for normal blood pressure."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pcsk6-knockout mice developed salt-sensitive hypertension, and corin
      activation and pro-atrial natriuretic peptide processing activity were
      undetectable in these mice.
    explanation: >-
      Independent genetic route to the same endpoint - blocking corin activation
      rather than corin itself reproduces undetectable pro-ANP processing and
      salt-sensitive hypertension. PARTIAL because the lesion is in PCSK6, not
      CORIN, so it corroborates the pathway rather than the disease genotype.
  downstream:
  - target: Left Atrial Myocardial Hypertrophy and Enlargement
    description: >-
      Chronic pressure and volume load raises atrial wall stress and drives
      hypertrophic remodelling.
  - target: Cardiac Fibroblast Activation
    description: >-
      Sustained wall stress is a fibroblast-activating stimulus in its own
      right, additive to the loss of natriuretic-peptide restraint.
- name: Left Atrial Myocardial Hypertrophy and Enlargement
  biological_scale: TISSUE
  role: effector
  description: >-
    The left atrium becomes enlarged and thickened. Two inputs converge on it:
    the mechanical pressure and volume load created by hypertension, and the
    direct loss of the antihypertrophic restraint that natriuretic-peptide/cGMP
    signalling normally exerts on cardiomyocytes. The atrial predominance is the
    part that is specific to this disease and is not explained by either input
    alone - the left atrium is both the principal site of ANP synthesis and the
    thinnest-walled chamber bearing the load, but why the ventricle is
    comparatively spared in the human phenotype is unresolved (see the
    `corin_atrial_selectivity` discussion). In corin-knockout mice the
    hypertrophic response is not atrium-selective and appears only after about
    9 months.

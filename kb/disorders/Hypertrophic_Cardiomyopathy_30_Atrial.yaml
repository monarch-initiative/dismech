        PARTIAL because the murine hypertrophy is not chamber-selective.
  - target: Left Atrial Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cardiac fibrosis develops in aged corin-null mice and after pressure
      overload, and - the key point - is reversed by giving back recombinant
      corin protein, which establishes the fibrosis as a consequence of corin
      deficiency.
    limitations: >-
      As with hypertrophy, the murine fibrosis is not localised to the left

genetic:
- name: CORIN
  gene_term:
    preferred_term: CORIN
    term:
      id: hgnc:19012
      label: CORIN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  presence: Biallelic null variants in affected individuals
  notes: >-
    CORIN is at 4p12 and encodes a type II transmembrane serine protease
    expressed primarily in the heart. The variant reported in the index sibship
    is NM_006587.4(CORIN):c.684dup (p.Met229fs) - a 1-bp duplication, homozygous
    in both affected siblings, catalogued as ClinVar VCV002504113 and OMIM
    allelic variant 605236.0004 with a pathogenic classification. The exact
    HGVS notation is not stated in the cited abstract (it is in the full report
    and the ClinVar record), so it is recorded here as provenance rather than
    quoted as evidence.

    Do not conflate this biallelic-null genotype with the common hypomorphic
    CORIN I555(P568) allele (T555I + Q568P in near-complete linkage
    disequilibrium). That allele is frequent in people of African ancestry, is
    associated with hypertension and with an enhanced hypertrophic response to
    afterload, and reduces but does not abolish natriuretic peptide processing.
    It is a susceptibility factor for common cardiovascular traits, not a cause
    of CMH30, and its literature is deliberately not imported into this entry's
    phenotype or prevalence sections.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each had a homozygous null variant in CORIN, the gene encoding atrial
      natriuretic peptide (ANP)-converting enzyme.
    explanation: >-
      Establishes CORIN as the causal gene and the biallelic null genotype in
      both affected siblings.
  - reference: PMID:17485366
    reference_title: "The serine protease corin in cardiovascular biology and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Corin is a type II transmembrane serine protease expressed primarily in
      the heart.
    explanation: >-
      Establishes the gene product's class and tissue distribution. Evidence
      source OTHER because this is a review synthesising in vitro and
      model-organism work.
  variants:
  - name: NM_006587.4(CORIN):c.684dup (p.Met229fs)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      1-bp duplication producing a frameshift at Met229, well upstream of both
      the Arg801 activation cleavage site and the catalytic serine, so no
      functional protease can be produced. Homozygous in both affected
      siblings; circulating corin was undetectable. Catalogued as ClinVar
      VCV002504113 (dbSNP rs756399499) and OMIM allelic variant 605236.0004.
    gene:
      preferred_term: CORIN
      term:
        id: hgnc:19012
        label: CORIN

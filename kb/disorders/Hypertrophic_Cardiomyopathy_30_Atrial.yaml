animal_models:
- name: Constitutive Corin knockout mouse
  species: Mouse
  genotype: Corin-/- (constitutive whole-body knockout)
  publication: PMID:15637153
  description: >-
    The workhorse model for the corin/ANP axis. Corin-null mice develop
    normally, have elevated pro-ANP with no detectable mature ANP, and show
    spontaneous, salt-sensitive hypertension by radiotelemetry, plus cardiac
    hypertrophy and a late decline in cardiac function. A later study extended
    the phenotype: progressive cardiac dysfunction with hypertrophy and fibrosis
    after 9 months, faster deterioration than wild type after transverse aortic
    constriction, and amelioration of dysfunction, hypertrophy, and fibrosis by
    recombinant corin protein, which also raised plasma cGMP and lowered
    angiotensin II and aldosterone.
  modeled_mechanisms:
  - target: Failure of Pro-ANP Processing
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The processing block is complete and directly measured in this model,
      matching the human protein-null biochemistry.
    limitations: >-
      Murine plasma reports accumulating pro-ANP precursor whereas the human
      sibling was assayed for the N-terminal fragment, so the two measurements
      are not the same analyte even though both indicate an abolished
      conversion step.
    readouts:
    - name: Plasma pro-ANP and mature ANP
      target: Failure of Pro-ANP Processing
      direction: ABOLISHED
      interpretation: >-
        Mature ANP is abolished with precursor accumulation - the defining
        readout of the lost convertase step.
      evidence:
      - reference: PMID:15637153
        reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cor-/- mice have elevated levels of pro-ANP but no detectable levels
          of ANP as compared with WT littermates.
        explanation: >-
          Reports the measurement underlying this readout.
    - name: Restoration of pro-ANP conversion by recombinant soluble corin
      target: Failure of Pro-ANP Processing
      direction: RESTORED
      interpretation: >-
        Supplying the missing enzyme restores conversion, closing the causal
        loop on this node.
      evidence:
      - reference: PMID:15637153
        reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Infusion of an active recombinant soluble corin transiently restores
          pro-ANP conversion, resulting in the release of circulating
          biologically active ANP.
        explanation: >-
          Reports the rescue measurement underlying this readout.
    evidence:
    - reference: PMID:15637153
      reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, our data establish corin as the physiological pro-ANP convertase
        and indicate that corin deficiency may contribute to hypertensive heart
        disease.
      explanation: >-
        Supports treating this model as informative for the pro-ANP processing
        node.
  - target: Sodium and Volume Retention with Hypertension
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Spontaneous, salt-sensitive hypertension matching the hypertension seen in
      the affected siblings.
    limitations: >-
      Murine blood-pressure regulation is measured under controlled dietary salt
      that has no counterpart in the human report, so the salt-sensitivity
      dimension is untested in patients.
    readouts:
    - name: Radiotelemetric arterial blood pressure
      target: Sodium and Volume Retention with Hypertension
      direction: INCREASED
      interpretation: >-
        Direct demonstration that corin loss raises blood pressure, worsened by
        salt loading.
      evidence:
      - reference: PMID:15637153
        reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using radiotelemetry to assess blood pressure, we find that Cor-/-
          mice have spontaneous hypertension as compared with WT mice, and it is
          enhanced after dietary salt loading.
        explanation: >-
          Reports the measurement underlying this readout.
    evidence:
    - reference: PMID:15637153
      reference_title: "Hypertension in mice lacking the proatrial natriuretic peptide convertase corin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using radiotelemetry to assess blood pressure, we find that Cor-/- mice
        have spontaneous hypertension as compared with WT mice, and it is
        enhanced after dietary salt loading.
      explanation: >-
        Supports treating this model as informative for the hypertension node.
  - target: Left Atrial Myocardial Hypertrophy and Enlargement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Corin-null mice develop cardiac hypertrophy, but it is generalised rather
      than atrium-selective and is attributed by the authors to chronic

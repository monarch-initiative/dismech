notes: >-
  GeneReviews baseline: PubMed was searched for a GeneReviews chapter covering
  this entity (`CORIN GeneReviews[All Fields]`, `Hypertrophic Cardiomyopathy 30
  GeneReviews[TI]`) and none exists. CORIN is not a gene covered by the
  Nonsyndromic Hypertrophic Cardiomyopathy Overview, which is scoped to
  sarcomeric disease. There is therefore no expert-curated Clinical
  Characteristics list to cross-reference; the phenotype set here derives from
  the OMIM/MedGen clinical synopsis for OMIM:620734 and from the primary report
  (PMID:37913506).

  Entity-identity note (NEC preflight): `just preflight-dr` returned SKIP
  because MONDO records no causal gene (RO:0004003) for MONDO:0958241, so the
  manual preflight was applied. The MONDO term xrefs OMIM:620734 and
  MEDGEN:1858408; both name CORIN at 4p12 as the causal gene, and CORIN
  dominates the deep-research report's gene mentions (CORIN=49 versus 2 for the
  next symbol). The "atrial" qualifier is part of the entity identity - this is
  not generic ventricular hypertrophic cardiomyopathy, and literature on
  sarcomeric CMH1-CMH29 has deliberately not been imported.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Only a single sibship (two affected siblings) has been reported. No
    population prevalence, incidence, carrier frequency, or ethnic-enrichment
    estimate exists, and the general hypertrophic cardiomyopathy prevalence of
    roughly 1 in 500 must NOT be substituted - that figure describes sarcomeric
    ventricular disease, a mechanistically different entity. A numeric rate is
    deliberately omitted rather than derived.
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings presented with cardiomyopathy, hypertension, arrhythmia, and
      fibrosis of the left atrium.
    explanation: >-
      The report that delineates the entity describes two affected individuals,
      establishing the entire published case count at the time of curation.
inheritance:
- name: Autosomal Recessive
  description: >-
    Both affected siblings carried the CORIN null variant in the homozygous
    state, and the associated ClinVar record (VCV002504113, OMIM allelic variant
    605236.0004, NM_006587.4(CORIN):c.684dup p.Met229fs, a 1-bp duplication at
    4p12) is classified pathogenic. Heterozygous relatives were not reported as
    having the atrial cardiomyopathy phenotype. Note that this is a different
    dose-response regime from the common hypomorphic CORIN I555(P568) allele,
    which is a heterozygous-state susceptibility factor for hypertension and
    hypertrophy rather than a cause of CMH30.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37913506
    reference_title: "Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each had a homozygous null variant in CORIN, the gene encoding atrial
      natriuretic peptide (ANP)-converting enzyme.
    explanation: >-
      Homozygosity for a null allele in both affected siblings is the direct
      statement of biallelic, recessive causation.
pathophysiology:
- name: Biallelic CORIN Null Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is homozygosity for a null allele of CORIN, which
    encodes a type II transmembrane serine protease expressed primarily in the
    heart. In the index sibship the consequence was measurable at the protein
    level: circulating corin was undetectable. Corin is synthesised as a zymogen
    and activated by cleavage at Arg801 on the cell surface, and the catalytic
    machinery is a trypsin-like serine protease domain, so a frameshift null
    allele removes the enzyme rather than merely blunting it.
  genetic_context:

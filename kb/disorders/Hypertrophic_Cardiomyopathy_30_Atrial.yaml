    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      NM_006587.4(CORIN):c.684dup (p.Met229fs), a 1-bp duplication at 4p12,
      homozygous in both affected siblings; ClinVar VCV002504113 / OMIM allelic
      variant 605236.0004, classified pathogenic.

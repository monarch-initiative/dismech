  - reference: PMID:19919978
    reference_title: "Dysfunctional corin i555(p568) allele is associated with impaired brain natriuretic peptide processing and adverse outcomes in blacks with systolic heart failure: results from the Genetic Risk Assessment in Heart Failure substudy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corin, a transmembrane serine protease expressed in cardiomyocytes,

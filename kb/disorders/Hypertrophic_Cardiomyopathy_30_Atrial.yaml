- name: Atrial Arrhythmogenic Substrate
  biological_scale: TISSUE
  role: effector
  description: >-
    An enlarged, fibrotic left atrium is a structurally remodelled substrate in
    which conduction is slow and heterogeneous, sustaining macro-reentrant
    flutter and fibrillatory conduction. This is the node that converts the
    endocrine and structural lesion into the clinical arrhythmia burden -
    atrial flutter and atrial fibrillation - and, by extension, into
    thromboembolic risk. It is inferred here from the co-occurrence of atrial
    structural disease and atrial arrhythmia in the index sibship rather than

    reference_title: "Progression from cardiomyopathy to heart failure with reduced ejection fraction: A CORIN deficient course."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further found that overexpression of CORIN could mitigate TGFβ1-induced
      expression of col1a1 and α-SMA in neonatal rat cardiac fibroblasts.
    explanation: >-
      Direct experimental evidence that CORIN restrains cardiac fibroblast
      activation, so loss of CORIN dis-inhibits it.
  - reference: PMID:39315128
    reference_title: "Progression from cardiomyopathy to heart failure with reduced ejection fraction: A CORIN deficient course."
    supports: PARTIAL

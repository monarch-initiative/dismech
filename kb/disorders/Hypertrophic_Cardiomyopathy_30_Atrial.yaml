  description: >-
    The defining phenotype: a primary disease of the atrial myocardium rather
    than of the ventricle. In the index sibship this took the form of an
    enlarged, thickened, fibrotic left atrium. Note the entity's placement in
    the familial hypertrophic cardiomyopathy series is nosological, not
    morphological - the hypertrophy that names it is atrial.

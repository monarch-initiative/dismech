- name: B-Type Natriuretic Peptide
  biomarker_term:
    preferred_term: B-type natriuretic peptide
    term:
      id: NCIT:C88523
      label: Brain Natriuretic Peptide 32
  presence: Elevated in affected individuals
  notes: >-
    Elevated despite the abolished ANP arm. Read this as the failed-compensation

parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias". The revision lists the
      GDF5-related and BMPR1B-related forms of "Fibular hypoplasia and complex
      brachydactyly (Du Pan)" as two rows; this entry curates both under the
      single MONDO concept MONDO:0009231, so it carries one group value. Du Pan
      syndrome was in group 16 of the 2019 revision (PMID:31633310) as well.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        whereas pathogenic variants in BMPR1B can cause a Grebe dysplasia-like
        phenotype (OMIM #609441), as well as BMPR1B-related du Pan dysplasia
      explanation: >-
        A 2024 report enumerating the acromesomelic chondrodysplasia types of the
        2023 nosology revision records both a GDF5-related and a BMPR1B-related
        du Pan entity inside that group.
prevalence:
- population: Consanguineous kindreds, predominantly from Muslim-majority countries
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. The reported case base is a small number
    of consanguineous families, with the ancestral concentration explicitly noted
    in the literature and a Caucasian family reported as an exception.
  evidence:
  - reference: PMID:16222676
    reference_title: Du Pan syndrome phenotype caused by heterozygous pathogenic mutations in CDMP1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Du Pan syndrome is a rare acromesomelic dysplasia with characteristic
      clinical and radiographic findings. It is inherited as an autosomal
      recessive trait. Almost all the patients reported have been from Muslim
      countries.
    explanation: Characterises the rarity and the ancestral distribution of reported cases.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The usual mode is autosomal recessive, with homozygous hypomorphic GDF5 or
    BMPR1B variants in consanguineous families and phenotypically normal
    heterozygous parents.
  evidence:
  - reference: PMID:12121354
    reference_title: Mutation in the cartilage-derived morphogenetic protein-1 (CDMP1) gene in a kindred affected with fibular hypoplasia and complex brachydactyly (DuPan syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present authors have previously described a consanguineous Pakistani
      family with fibular hypoplasia and complex brachydactyly (DuPan syndrome)
      inherited as an autosomal recessive trait.
    explanation: Establishes recessive transmission in the founding molecularly characterised kindred.
  - reference: PMID:12121354
    reference_title: Mutation in the cartilage-derived morphogenetic protein-1 (CDMP1) gene in a kindred affected with fibular hypoplasia and complex brachydactyly (DuPan syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Obligate heterozygote parents were phenotypically normal.
    explanation: Carrier parents are unaffected, consistent with a recessive rather than dominant-negative allele.
- name: Autosomal Dominant (cis-allele exception)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    One Polish family transmits du Pan syndrome dominantly. The affected allele
    carries three GDF5 variants in cis within the mature active domain, and the
    proposed explanation is that their combined effect on one allele reaches the
    threshold that normally requires two hit alleles. This is a single reported
    exception and should not be generalised.
  evidence:
  - reference: PMID:16222676
    reference_title: Du Pan syndrome phenotype caused by heterozygous pathogenic mutations in CDMP1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three new heterozygous mutations clustered on one allele of the CDMP1 gene
      were identified in the affected individuals resulting in the first familial
      case with dominant Du Pan syndrome.
    explanation: Documents the only reported dominantly transmitted du Pan kindred and its cis-allele basis.
  - reference: PMID:16222676
    reference_title: Du Pan syndrome phenotype caused by heterozygous pathogenic mutations in CDMP1 gene.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A possible synergistic effect of the cis-acting mutations located in the
      active domain of the mature CDMP1 protein is likely to be responsible for
      the clinical expression of the disorder.
    explanation: >-
      The proposed synergy of cis variants is the authors' interpretation rather
      than a functionally demonstrated mechanism, so this is recorded as partial support.
genetic:
- name: Biallelic Hypomorphic GDF5 Variants
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    The founding kindred is homozygous for a missense variant in the mature
    domain, T1322C predicting p.Leu441Pro. The 2002 report inferred a
    conformational change; direct biosensor measurement three years later showed
    the specific defect, which is loss of binding to the type I BMP receptor
    ectodomains. The same allele in the heterozygous state causes brachydactyly
    type A2, so p.Leu441Pro is a dosage series in one variant rather than two
    separate alleles.
  evidence:
  - reference: PMID:12121354
    reference_title: Mutation in the cartilage-derived morphogenetic protein-1 (CDMP1) gene in a kindred affected with fibular hypoplasia and complex brachydactyly (DuPan syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals were homozygous for a missense mutation, T1322C, in
      the coding region of the CDMP1 gene.
    explanation: Establishes GDF5 as a cause of du Pan syndrome.
  - reference: PMID:12121354
    reference_title: Mutation in the cartilage-derived morphogenetic protein-1 (CDMP1) gene in a kindred affected with fibular hypoplasia and complex brachydactyly (DuPan syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The T1322C change predicts a leu441pro substitution in the mature domain
      of the CDMP1 protein.
    explanation: Localises the allele to the mature domain of the ligand.
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biosensor interaction analyses revealed loss of binding to BMPR1A and
      BMPR1B ectodomains for the L441P mutant
    explanation: >-
      Direct binding measurement identifies the molecular defect of the du Pan
      GDF5 allele as loss of type I receptor engagement rather than a
      non-specific conformational change.
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They cause brachydactyly type A2 (L441P) and symphalangism (R438L)
    explanation: >-
      The same p.Leu441Pro allele produces brachydactyly type A2 in the
      heterozygous state, establishing the dosage relationship with homozygous
      du Pan syndrome.
- name: Biallelic Hypomorphic BMPR1B Variants
  gene_term:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported alleles are homozygous missense variants that reduce but do not
    abolish receptor function: p.Arg31Cys, functionally characterised as
    hypomorphic relative to the Grebe-causing p.Cys53Arg, and p.Gln274Arg in the
    protein kinase domain.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the homozygous c.91C>T, p.(Arg31Cys) mutation causing du Pan
      dysplasia leads to a significant loss of BMPR1B function, but to a lesser
      extent than the previously reported p.Cys53Arg mutation that results in the
      more severe Grebe dysplasia.
    explanation: >-
      Functional assays quantify the du Pan allele as hypomorphic relative to the
      Grebe-causing allele in the same gene.
  - reference: PMID:39441036
    reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis identified the biallelic variant NM_001203.3:c.821A >
      G;p.(Gln274Arg) in BMPR1B, a gene encoding bone morphogenetic protein
      receptor 1B.
    explanation: Adds a second reported BMPR1B allele causing du Pan dysplasia.

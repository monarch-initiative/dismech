- name: Partially Reduced GDF5-BMPR1B Signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    GDF5 signals through BMPR1B, its preferred type I receptor. In du Pan
    syndrome this signalling is reduced but retained, which is the proposed
    explanation for why the same pathway lesion yields a mild rather than a
    devastating limb phenotype. This is a quantitative, dose-dependent claim
    about a normally regulated pathway, not a qualitative escape from regulation.

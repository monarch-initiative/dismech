name: Du Pan Syndrome
synonyms:
- Fibular hypoplasia and complex brachydactyly
- Acromesomelic dysplasia 2B
- du Pan dysplasia
- Du Pan acromesomelic dysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Du Pan syndrome is the mild end of the acromesomelic GDF5-BMPR1B spectrum: an
  autosomal recessive limb malformation combining fibular hypoplasia or aplasia
  with complex brachydactyly and short, ball-shaped toes, while stature and the
  major long bones are largely preserved. It is caused by biallelic hypomorphic
  variants in either partner of the same ligand-receptor pair, GDF5 (the ligand,
  formerly CDMP1) or BMPR1B (its high-affinity type I receptor. The disorder is
  therefore best understood not as a separate mechanism from Grebe dysplasia but
  as the same mechanism operating at a higher level of residual signalling:
  alleles that leave partial GDF5-BMPR1B function produce du Pan syndrome,
  whereas alleles that abolish it produce Grebe dysplasia. Postaxial polydactyly,
  long regarded as a GDF5-specific finding, has now also been reported in a
  BMPR1B-related case, further blurring the boundary between the two genes'
  phenotypes. A single Polish kindred with three GDF5 variants in cis on one
  allele shows dominant transmission, the only reported exception to the
  recessive rule.
disease_term:
  preferred_term: du Pan syndrome
  term:

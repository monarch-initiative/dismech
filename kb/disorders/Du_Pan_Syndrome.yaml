diagnosis:
- name: Gene Panel Covering the Acromesomelic Dysplasia Genes
  description: >-
    Only three genes account for the isolated acromesomelic dysplasias in the
    GDF5-BMPR1B and NPR2 families, so a small targeted panel resolves most
    presentations; PRKG2 was added to that list after the review below was
    written.
  evidence:
  - reference: PMID:26926249
    reference_title: Genetics of human isolated acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in three genes (GDF5, NPR2, BMPR1B) have been reported to cause
      different forms of acromesomelic dysplasia.
    explanation: Establishes the small gene set that a targeted panel needs to cover.
- name: Sequential GDF5 then BMPR1B Sequencing
  description: >-
    Because the two genes produce an overlapping phenotype, a du Pan-like
    presentation without a GDF5 variant should prompt BMPR1B sequencing. This is
    now explicitly recommended for cases that also show polydactyly, which was
    previously taken as evidence for a GDF5 aetiology.
  evidence:
  - reference: PMID:39441036
    reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with du Pan acromesomelic dysplasia and polydactyly who do not
      carry pathogenic variants in GDF5, should be taken into account for BMPR1B
      sequencing
    explanation: States the recommended diagnostic escalation.
differential_diagnoses:
- name: Acromesomelic Dysplasia, Grebe Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Grebe type
    term:
      id: MONDO:0008703
      label: acromesomelic dysplasia 2A
  description: >-
    The severe end of the same GDF5-BMPR1B spectrum, caused by alleles that
    abolish rather than reduce signalling.
  distinguishing_features:
  - Grebe dysplasia causes severe dwarfism with rudimentary fingers and toes; stature and the long bones are preserved in du Pan syndrome.
  - >-
    The two are separated by residual pathway activity rather than by which gene
    is mutated, so the distinction is clinical and radiographic rather than
    molecular.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While Grebe dysplasia is characterised by severe distal limb anomalies
      with rudimentary fingers and toes
    explanation: States the severe distal phenotype that separates Grebe dysplasia from du Pan syndrome.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      leads to a significant loss of BMPR1B function, but to a lesser extent
      than the previously reported p.Cys53Arg mutation that results in the more
      severe Grebe dysplasia
    explanation: Shows that the same gene gives either diagnosis according to residual receptor function.
- name: Acromesomelic Dysplasia, Demirhan Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Demirhan type
    term:
      id: MONDO:0012274
      label: acromesomelic dysplasia 3
  description: >-
    The BMPR1B-related Grebe-like disorder, which shares the receptor with
    BMPR1B-related du Pan syndrome but adds genital anomalies.
  distinguishing_features:
  - Genital anomalies with hypergonadotrophic hypogonadism are present in the Demirhan type and absent in du Pan syndrome.
  - The Demirhan-type allele is truncating whereas the du Pan BMPR1B alleles are hypomorphic missense changes.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, she presented with hypoplasia of the uterus and ovarian
      dysfunction resulting in hypergonadotrophic hypogonadism.
    explanation: Identifies the genital phenotype that separates the Demirhan type from du Pan syndrome.
- name: Brachydactyly Type A2
  description: >-
    The heterozygous manifestation of the same GDF5 allele. A carrier parent or
    sibling of a du Pan proband may present with isolated index-finger
    brachydactyly rather than being unaffected, and BMPR1B brachydactyly type A2
    is the dominant counterpart on the receptor side.
  distinguishing_features:
  - >-
    Brachydactyly type A2 is dominant and confined to the digits, without the
    fibular deficiency that defines du Pan syndrome.
  - >-
    On the receptor side the mechanisms differ as well: brachydactyly type A2
    arises from dominant-negative BMPR1B alleles, whereas du Pan syndrome arises
    from recessive hypomorphic ones.
  evidence:
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the brachydactyly type A2 phenotype (L441P) is caused by inhibition of the
      ligand-receptor interaction
    explanation: Identifies the heterozygous phenotype of the du Pan GDF5 allele and its mechanism.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings imply that both mutations identified in human BMPR1B affect
      cartilage formation in a dominant-negative manner.
    explanation: Establishes the dominant-negative mechanism that separates BDA2 from recessive BMPR1B du Pan syndrome.
- name: Isolated Fibular Hemimelia
  description: >-
    Longitudinal fibular deficiency without the hand and foot malformation
    bundle. Du Pan syndrome should be considered when fibular hypoplasia is
    accompanied by bilateral complex brachydactyly, which is not a feature of
    isolated fibular hemimelia.
  distinguishing_features:
  - >-
    Du Pan syndrome pairs the fibular deficiency with bilateral complex
    brachydactyly of hands and feet and is recessive with a molecular diagnosis
    in GDF5 or BMPR1B.
  evidence:
  - reference: PMID:12121354
    reference_title: Mutation in the cartilage-derived morphogenetic protein-1 (CDMP1) gene in a kindred affected with fibular hypoplasia and complex brachydactyly (DuPan syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a consanguineous Pakistani family with fibular hypoplasia and complex
      brachydactyly (DuPan syndrome) inherited as an autosomal recessive trait
    explanation: >-
      The defining pairing of fibular hypoplasia with complex brachydactyly in a
      recessive kindred is what separates du Pan syndrome from an isolated
      fibular deficiency.
discussions:
- discussion_id: du_pan_gene_indistinguishability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any clinical or radiographic feature that separates GDF5-related
    from BMPR1B-related du Pan syndrome?
  rationale: >-
    Polydactyly was the last candidate discriminator and it fell in 2024, when a
    BMPR1B case was reported with bilateral postaxial polydactyly. With so few
    published cases in either group, no feature is currently established as
    gene-specific, which is why this entry curates both aetiologies under one
    disease concept rather than splitting them.
  attaches_to:
  - genetic#Biallelic Hypomorphic GDF5 Variants
  - genetic#Biallelic Hypomorphic BMPR1B Variants
  evidence:
  - reference: PMID:39441036
    reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case expands the phenotypical overlap between the different ACD types,
      du Pan and Grebe.
    explanation: The authors frame their finding as widening, not narrowing, the phenotypic overlap.
- discussion_id: dominant_du_pan_cis_allele
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the three cis GDF5 variants in the reported dominant du Pan family act
    synergistically, and is the dominant transmission reproducible?
  rationale: >-
    A single Polish family transmits du Pan syndrome dominantly through one
    allele carrying three variants in the mature domain. The synergy is inferred
    from the pedigree, not measured, and no second dominant family has been
    reported in the twenty years since. Until it is functionally tested, this
    entry records the dominant inheritance block as an explicit exception rather
    than as an alternative mode of inheritance.
  attaches_to:
  - inheritance#Autosomal Dominant (cis-allele exception)
notes: >-
  Curated as part of a review of ISDS 2023 nosology group 16 (acromesomelic
  dysplasias). The 2023 revision lists GDF5-related and BMPR1B-related du Pan
  dysplasia as two rows, but MONDO carries a single concept (MONDO:0009231) and
  no published feature distinguishes them clinically, so they are curated as one
  entry with two causative genes. No Orphanet structured record was cited: the
  pinned Orphadata snapshot in data/orphadata/MANIFEST.yaml no longer matches
  upstream, and re-pinning it would rewrite every ORPHA cache file in the
  repository.

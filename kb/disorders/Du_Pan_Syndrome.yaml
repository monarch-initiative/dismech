    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients with these disorders have biallelic
      loss-of-function mutations of GDF5.
    explanation: Establishes biallelic GDF5 loss of function as the commonest route into the disorder.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.

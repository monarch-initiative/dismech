mechanistic_hypotheses:
- hypothesis_group_id: residual_signalling_dose_model
  hypothesis_label: Residual GDF5-BMPR1B Signalling Dose Model
  status: CANONICAL
  description: >-
    The acromesomelic GDF5-BMPR1B disorders are one mechanism read at different
    doses. How much signalling an allele leaves, rather than which of the two
    genes it hits, determines whether the result is du Pan syndrome, Grebe
    dysplasia, or in the heterozygous state a brachydactyly. The strongest test
    is within BMPR1B, where the du Pan allele p.Arg31Cys and the Grebe allele
    p.Cys53Arg were assayed side by side and ranked in the order the phenotypes
    predict. The same logic holds for GDF5 p.Leu441Pro, which gives
    brachydactyly type A2 heterozygous and du Pan syndrome homozygous.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      leads to a significant loss of BMPR1B function, but to a lesser extent
      than the previously reported p.Cys53Arg mutation that results in the more
      severe Grebe dysplasia
    explanation: Two alleles of one gene ranked by residual function match the severity order of the two diagnoses.
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They cause brachydactyly type A2 (L441P) and symphalangism (R438L)
    explanation: >-
      Supplies the allele-dose half of the model: the du Pan GDF5 allele in one
      copy gives an isolated brachydactyly.
- hypothesis_group_id: receptor_specificity_model
  hypothesis_label: Receptor-Binding-Specificity Model
  status: ALTERNATIVE
  description: >-
    A competing reading of the same interface data is that what matters is not
    only how much receptor binding an allele leaves, but which receptor it
    binds. GDF5 p.Arg438Leu, one residue away from the du Pan allele, keeps
    normal BMPR1B binding but gains BMPR1A binding and causes symphalangism, a
    joint-fusion phenotype rather than a hypoplasia. On this view the du Pan and
    Grebe alleles sit at the loss end of a two-dimensional space whose other
    axis is receptor choice, and a purely quantitative dose model cannot predict
    the phenotype of an allele that redistributes binding rather than reducing
    it. This has not been tested against any acromesomelic allele.
  evidence:
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas the R438L mutant showed normal binding to BMPR1B but increased
      binding to BMPR1A, the receptor normally activated by BMP2
    explanation: Documents an allele that changes receptor preference rather than overall binding strength.
  - reference: PMID:16127465
    reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the symphalangism phenotype (R438L) is caused by a loss of receptor-binding
      specificity, resulting in a gain of function by the acquisition of
      BMP2-like properties
    explanation: >-
      States the specificity mechanism explicitly, as an alternative to a purely
      quantitative account of GDF5 allele effects.

    snippet: "The prevalence of heart defects (HDs) in individuals with Sotos syndrome is estimated to be around 15-40%. Septal defects and patent ductus arteriosus are the most commonly diagnosed malformations, but complex defects have also been reported."
    explanation: Gives the literature frequency range and the commonest anatomic types.
  - reference: PMID:38535015
    reference_title: "Congenital Heart Defects in Patients with Molecularly Confirmed Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 27/45 (60.0%) of the patients had heart defects, isolated or combined with other defects, including septal defects (12 patients), aortic anomalies (9 patients), mitral valve and/or tricuspid valve dysplasia/insufficiency (1 patient), patent ductus arteriosus (3 patients), left ventricular non-compaction/hypertrabeculated left ventricle (LV) (4 patients), aortic coarctation (1 patient), aortopulmonary window (1 patient), and pulmonary valve anomalies (3 patients)."
    explanation: The single-centre figure and the anatomic breakdown quoted in the description.
  - reference: PMID:38535015
    reference_title: "Congenital Heart Defects in Patients with Molecularly Confirmed Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

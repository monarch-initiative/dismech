- category: Cardiovascular
  name: Congenital Heart Defects
  description: >-
    Structural cardiac malformations are common. Literature estimates run at
    15-40%, and a single-centre series of 45 molecularly confirmed patients found
    60% - septal defects most often, then aortic anomalies, patent ductus
    arteriosus, left ventricular non-compaction and pulmonary valve anomalies. That
    higher figure comes from a referral cohort and should not be read as a
    population estimate. Prevalence did not differ meaningfully between the
    deletion and intragenic groups, so this is not a subtype-discriminating
    feature. The finding motivates echocardiography at diagnosis.
  phenotype_term:
    preferred_term: Congenital heart defect

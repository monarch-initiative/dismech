- category: Growth
  name: Childhood Overgrowth
  description: >-
    Childhood overgrowth is defined by height and/or head circumference at least two standard deviations above age- and sex-matched norms. The combined endpoint occurs in about 90% of NSD1-positive individuals; it does not establish the frequency of tall stature alone. Height may approach the normal range in adulthood, but the adult distribution is broad and macrocephaly often persists.
  phenotype_term:
    preferred_term: Childhood overgrowth
    term:
      id: HP:0001548
      label: Overgrowth
  frequency: VERY_FREQUENT
  diagnostic: true
  subtypes:
  - Intragenic NSD1 Variant
  - 5q35 Microdeletion
  evidence:
  - reference: PMID:20301652
    reference_title: Sotos Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sotos syndrome is characterized by a distinctive facial appearance (broad, prominent forehead with a dolichocephalic head shape, sparse frontotemporal hair, downslanting palpebral fissures, malar flushing, long and narrow face, tall chin); learning disability (early developmental delay, mild-to-severe intellectual impairment); and overgrowth (height and/or head circumference ≥2 SD above the mean).
    explanation: >-
      Defines the combined height and/or head-circumference overgrowth endpoint; this is not a frequency estimate for tall stature alone.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, both the height and head circumference of 10% of the individuals were within the normal range, indicating that overgrowth is not obligatory for the diagnosis of Sotos syndrome."
    explanation: >-
      Bounds the claim: a cardinal feature that is nonetheless absent in a tenth of
      molecularly confirmed cases.
  - reference: PMID:31479583
    reference_title: 'The phenotype of Sotos syndrome in adulthood: A review of 44 individuals.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort, median height in adult women is +1.9 SD and men +0.5 SD.
    explanation: >-
      Median adult heights in the 44-person NSD1 cohort do not establish that all adults have normal height.
- category: Growth
  name: Macrocephaly
  description: >-
    Increased head circumference is a cardinal growth feature and often persists after height excess attenuates. The VERY_FREQUENT band is based on 51/57 (89%) molecularly confirmed Korean children at their last visit (mean age 8.1 years), rather than the combined height/head-size overgrowth endpoint; age and referral ascertainment limit generalization.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  evidence:
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome is an overgrowth condition characterized by cardinal features including excessive growth during childhood, macrocephaly, distinctive facial gestalt and various degrees of learning difficulty, and associated with variable minor features."
    explanation: Names macrocephaly among the cardinal features in a clinical review.
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Females with SS displayed higher height before 17.0, greater weight before 10.5, and larger head circumference before 12.0 compared to controls."
    explanation: Anthropometric confirmation of increased head circumference against matched controls.

  - reference: PMID:39494594
    reference_title: Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At their last visit (8.1 ± 5.6 years), tall stature and macrocephaly were observed in 23 (40%), and 51 (89%) patients, respectively.
    explanation: >-
      Macrocephaly in 51/57 patients (89%) supports VERY_FREQUENT (80–99%) in this molecularly confirmed Korean cohort at last visit (8.1 ± 5.6 years). The 57 patients, not the 339 repeated anthropometric measurements, form the denominator. Tertiary-center ascertainment and age limit generalization.
  frequency: VERY_FREQUENT
- category: Skeletal
  name: Advanced Bone Age
  description: >-
    Accelerated skeletal maturation is commonly identified before puberty. GeneReviews summarizes 75–80% of prepubertal children, while the Korean study found advancement of more than two years in 8/20 males and 1/13 females assessed at their last visit. Age, assessment threshold and ascertainment differ, so a single lifetime frequency band is not assigned.
  phenotype_term:
    preferred_term: Advanced bone age
    term:
      id: HP:0005616
      label: Accelerated skeletal maturation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone age often reflects the accelerated growth velocity and is advanced in 75%-80% of prepubertal children.
    explanation: >-
      This estimate is explicitly restricted to prepubertal children.
  - reference: PMID:39494594
    reference_title: Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 33 children (20 males and 13 females) for whom BA was evaluated at their last visit, BA was advanced than CA in eight (40%) males (13.0 ± 2.6 years vs. 10.5 ± 2.5 years, p = 0.011) and one (8%) female (9.0 years vs. 5.6 years).
    explanation: >-
      The source supplies the evaluated denominators and timing. Its two-year threshold differs from some historical definitions.
- category: Neurologic
  name: Intellectual Disability
  description: >-
    Intellectual impairment ranges widely; some individuals have average intellectual functioning. Developmental delay in young children and broader learning difficulties are assessed separately. Microdeletions are associated with greater severity at group level, but intellectual disability also occurs with intragenic variants.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  diagnostic: true
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals with Sotos syndrome have some degree of intellectual impairment. The spectrum is broad and ranges from a mild learning disability (affected individuals would be expected to live independently and have their own families) to a severe learning disability (affected individuals would be unlikely to live independently as adults).
    explanation: >-
      Supports the broad clinical range, without using a mixed Sotos–Malan developmental-delay/intellectual-disability percentage to quantify intellectual disability alone.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with microdeletions had less-prominent overgrowth (P = .0003) and more-severe learning disability (P = 3 x 10(-9)) than patients with mutations."
    explanation: The primary genotype-phenotype contrast justifying curation of the two molecular classes as subtypes.
- category: Behavioral
  name: Autism Spectrum Behaviour
  description: >-
    Autistic symptoms are common. In a convenience sample of 33 children, 72.7% had mild-to-moderate ADOS-2 symptoms; this is neither a population prevalence nor the proportion meeting a clinical ASD diagnosis. A nonsignificant difference in SRS scores against an ASD comparison group does not establish equivalence.
  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:38150933
    reference_title: "Short report: Autistic symptoms in Sotos syndrome, preliminary results from a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "72.7% of SoS children presented mild to moderate levels of ASD symptoms as measured by the ADOS-2."
    explanation: >-
      In the convenience sample of 33 Sotos children, 72.7% had mild-to-moderate ADOS-2 symptoms. This measures symptom severity in the sample, not population prevalence or the proportion with a clinical ASD diagnosis.
  - reference: PMID:38150933
    reference_title: "Short report: Autistic symptoms in Sotos syndrome, preliminary results from a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No statistically significant differences emerged between the SoS and ASD groups within the SRS total score domain (p = 0.95)."
    explanation: >-
      The SRS total-score comparison detected no difference between the matched Sotos and idiopathic-ASD groups (p = 0.95). A nonsignificant difference neither proves equivalent symptom burden nor estimates ASD prevalence.
  - reference: PMID:38150933
    reference_title: "Short report: Autistic symptoms in Sotos syndrome, preliminary results from a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oneway ANOVA analysis showed that SoS individuals presenting lower IQ demonstrated higher ASD symptom's level (p = 0.01)."
    explanation: >-
      Within the Sotos sample, lower IQ was associated with higher ASD symptom levels (ANOVA p = 0.01). This is a cognitive-severity association, not evidence that lower IQ causes autistic behavior.
  - reference: PMID:38673476
    reference_title: "Neuropsychiatric Aspects of Sotos Syndrome: Explorative Review Building Multidisciplinary Bridges in Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children express autistic behavior, ADHD, anxiety based on phobias, and early bedtime-wake times."
    explanation: >-
      This narrative review synthesizes reported autistic behavior among the neuropsychiatric features of Sotos syndrome. It contributes clinical context rather than a new cohort count or prevalence estimate.



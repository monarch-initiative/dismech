classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian multisystem malformation/overgrowth syndrome; Harrison's covers
      this class of disorder under the genetics Part rather than under a single
      organ system.
  - classification_value: NEUROLOGIC
    notes: >-
      Intellectual disability, autism spectrum behaviour and seizures are core and
      drive most of the long-term clinical burden.
  isds_skeletal_category:
  - classification_value: overgrowth_syndromes_with_skeletal_involvement
    notes: >-
      Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,

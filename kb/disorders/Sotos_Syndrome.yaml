    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The head is dolichocephalic and the forehead broad and prominent. Often the hair in the frontotemporal region is sparse. The palpebral fissures are usually downslanting.
    explanation: >-

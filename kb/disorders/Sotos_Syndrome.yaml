phenotypes:
- category: Craniofacial
  name: Distinctive Facial Appearance
  description: >-
    The characteristic facial gestalt includes a broad prominent forehead, dolichocephaly, sparse frontotemporal hair, downslanted palpebral fissures, malar flushing, a long narrow face and tall chin. The gestalt is especially recognizable in early childhood and changes with age. The reported frequency of at least 90% applies to the overall gestalt, not to each component.
  phenotype_term:
    preferred_term: Characteristic Sotos facial gestalt
    term:
      id: HP:0001999
      label: Abnormal facial shape
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:20301652
    reference_title: Sotos Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sotos syndrome is characterized by a distinctive facial appearance (broad, prominent forehead with a dolichocephalic head shape, sparse frontotemporal hair, downslanting palpebral fissures, malar flushing, long and narrow face, tall chin); learning disability (early developmental delay, mild-to-severe intellectual impairment); and overgrowth (height and/or head circumference ≥2 SD above the mean).
    explanation: >-
      The complete clinical-characteristics sentence identifies the facial finding in Sotos syndrome without transferring the overall gestalt frequency to an individual component.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial dysmorphism, learning disability, and childhood overgrowth were present in 90% of the individuals."
    explanation: >-
      Supports the VERY_FREQUENT band with a cohort figure for the cardinal triad
      taken together.
  - reference: PMID:31479583
    reference_title: "The phenotype of Sotos syndrome in adulthood: A review of 44 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a distinctive facial appearance in adults with a tall, square, prominent chin."
    explanation: Establishes that the gestalt persists into adulthood in a recognisable, altered form.

- category: Craniofacial
  name: Sparse Frontotemporal Hair
  description: >-
    Sparse scalp hair is especially apparent in the frontotemporal region.
  phenotype_term:
    preferred_term: Sparse frontotemporal scalp hair

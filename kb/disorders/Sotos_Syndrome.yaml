- name: Dysregulated FGF-MAPK-ERK Signaling
  description: >-
    Patient-derived fibroblasts show altered FGF-MAPK/ERK-related expression and phosphorylation. Reduced kinase activation became significant after excluding one outlier; RASIP1 overexpression in HEK293 cells instead increased a reporter response. The net effect is therefore not represented as a universal RASIP1-driven decrease across tissues.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:23155469
    reference_title: Sotos syndrome is associated with deregulation of the MAPK/ERK-signaling pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In order to elucidate biological pathways explaining how NSD1 haploinsufficiency results in phenotypic features such as overgrowth in SoS a comprehensive study of dermal fibroblasts from SoS patients was performed. We obtained evidence that SoS syndrome is associated with a deregulation of the MAPK/ERK signaling pathway.
    explanation: >-
      The study used fibroblasts from nine NSD1-confirmed patients and nine matched controls, with pathway, knockdown and phosphorylation experiments. The net signaling effect is tissue-dependent.
    directness: INDIRECT
  downstream:
  - target: Altered Growth-Plate Chondrocyte Maturation
    description: >-
      The authors propose that altered MAPK/ERK signaling changes hypertrophic chondrocyte differentiation. This extrapolation from fibroblasts and established growth-plate biology remains provisional.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23155469
      reference_title: Sotos syndrome is associated with deregulation of the MAPK/ERK-signaling pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In analogy, we propose that deregulation of the MAPK/ERK pathway in SoS results in altered hypertrophic differentiation of NSD1 expressing chondrocytes and may be a determining factor in statural overgrowth and accelerated skeletal maturation in SoS.
      explanation: >-
        An explicit causal hypothesis links altered signaling to growth-plate differentiation and the two clinical outcomes. Patient growth plates were not studied; normal human growth plates established NSD1 localization.
      directness: INDIRECT

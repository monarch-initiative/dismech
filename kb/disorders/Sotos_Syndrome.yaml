      reference_title: Sleep disturbances and behavioral symptoms in pediatric Sotos syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The most commonly identified sleep problems were SBD and SWTD, both occurring in 26.3%, possibly linked to the high incidence of congenital malformations of the neck and head in this population, such as general hypotonia, including weakness in the muscles of swallowing, macroglossia, high arched palates, alveolar cleft and cleft lip, and palate, which could contribute to respiratory and feeding difficulties (34).
      explanation: Frattale and colleagues explicitly propose head/neck anatomy, including high palate, as a contributor to sleep breathing problems. Sleep abnormalities were questionnaire based, and the study lacked a comprehensive physical examination to correlate anatomy with sleep scores; this is a provisional clinical hypothesis.

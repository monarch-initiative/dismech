- name: Sleep Disturbance
  category: Neurologic
  description: Disturbed sleep includes altered sleep timing and sleep-related breathing or transition problems. Early bed and rise times do not by themselves establish insomnia or an advanced sleep-phase disorder. In a pediatric survey, 27/38 had a positive SDSC screen, while only two had a prior sleep-disorder diagnosis. The sleep-breathing subscale was positive in 10/38 (26.3%), which does not establish polysomnography-confirmed obstructive sleep apnea. The 60% questionnaire response rate and referral ascertainment preclude treating 71.1% as population prevalence; no frequency band is assigned.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK1479/pdf/Bookshelf_NBK1479.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Behavioral findings. A wide range of behavioral findings are common at all ages. Autism spectrum disorder, phobias, sleep disturbances, hyperactivity, and aggression have been described
    explanation: The clinical-description section establishes occurrence of sleep disturbance; the broad behavioral-feature frequency is not a sleep-specific estimate.
  - reference: PMID:33893755
    reference_title: Characterization of sleep habits of children with Sotos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Subjects with SS showed more sleep disturbance than typically developing individuals (TD), although their sleep onset was less likely to be delayed and their sleep duration was longer.
    explanation: The cross-sectional questionnaire study included definite, probable and possible Sotos diagnoses and used historical comparators. It supports disturbed sleep without equating early waking with reduced sleep duration.
  - reference: PMID:33893755
    reference_title: Characterization of sleep habits of children with Sotos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with SS exhibited early bed and rise times, frequently used transitional objects, displayed repetitive motion at sleep onset, and did not show a decrease in sleep duration with age.
    explanation: This identifies the sleep-timing pattern. It does not establish terminal insomnia or a diagnosed circadian-rhythm disorder; the broader sleep-disturbance binding retains that distinction.
  - reference: PMID:38434199
    reference_title: Sleep disturbances and behavioral symptoms in pediatric Sotos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although only two had a prior SD diagnosis, 71.1% (N = 27) exhibited pathological scores on SDSC.
    explanation: Among 38 respondents (mean age 11.1 years), 27 had positive screening scores. The source reports 12 NSD1 deletions, 24 intragenic variants and two with unavailable genetic data; 38 of 64 invited families responded. Questionnaire positivity is distinct from a prior clinical diagnosis and may be enriched by response bias.
  - reference: PMID:38434199
    reference_title: Sleep disturbances and behavioral symptoms in pediatric Sotos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for the subscales, 6 (15.8%) patients in the DIMS scale, 10 (26.3%) in SBD, 4 (10.5%) in DA, 10 (26.3%) in SWTD, 2 (5.2%) in DOES, and 7 (18.4%) in SHY obtained a score above the cutoff (Supplementary Figure 1).
    explanation: >-
      Ten of 38 respondents screened positive for sleep breathing disorders (SBD). This anchors the respiratory component addressed by the provisional palatal-anatomy hypothesis; subscale positivity does not establish obstructive sleep apnea or that anatomy explains all positive total SDSC screens.

    explanation: Supports the specific claim about mathematics as an area of near-universal difficulty.

- category: Behavioral
  name: Autism Spectrum Behaviour
  description: >-
    Autism spectrum disorder is singled out by GeneReviews as the most notable
    behavioural finding. In a controlled study nearly three quarters of children
    with Sotos syndrome showed mild-to-moderate autistic symptoms on the ADOS-2,
    and their social-responsiveness scores did not differ from a matched
    idiopathic-autism group - so the autistic presentation is not a mild
    approximation of autism but is quantitatively comparable on that measure.
    Symptom level scales inversely with IQ. The wider neuropsychiatric picture also
    includes ADHD, anxiety with phobias, aggressive outbursts and disturbed sleep.
  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
  frequency: FREQUENT

genetic:
- name: NSD1
  gene_term:
    preferred_term: NSD1
    term:
      id: hgnc:14234
      label: NSD1
  association: Haploinsufficiency (loss-of-function variants and whole-gene deletion)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: identified in about 93% of individuals with a clinical diagnosis of Sotos syndrome
  notes: >-
    NSD1 (5q35) encodes a SET-domain lysine methyltransferase that writes H3K36
    mono- and dimethylation. Two lesion classes account for the disease: intragenic
    loss-of-function variants (truncating throughout the gene, missense only within
    functional domains) and the recurrent whole-gene 5q35 microdeletion. Detection
    rates differ by ancestry because the deletion class does. Confirmed pathogenic
    NSD1 variants generate a specific blood DNA-methylation episignature, which is
    used to reclassify variants of uncertain significance. Note also that molecular
    yield is cohort-dependent: a Brazilian series identified NSD1 abnormalities in
    only 32% of clinically diagnosed patients, which the authors read as evidence
    for genetic heterogeneity in that population rather than as contradicting the
    higher published yields.
  evidence:
  - reference: PMID:11896389
    reference_title: "Haploinsufficiency of NSD1 causes Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We isolated NSD1 from the 5q35 breakpoint in an individual with Sotos syndrome harboring a chromosomal translocation."
    explanation: Records how the gene was mapped to the disease, via a translocation breakpoint.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, our data suggest that 93% of patients who have been clinically diagnosed with Sotos syndrome have identifiable NSD1 abnormalities, of which 83% are intragenic mutations and 10% are 5q35 microdeletions."
    explanation: Supports the detection rate quoted in `frequency` and the split between lesion classes.
  - reference: PMID:23190751
    reference_title: "Clinical and genetic spectrum of 18 unrelated Korean patients with Sotos syndrome: frequent 5q35 microdeletion and identification of four novel NSD1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NSD1 abnormalities were identified in 15 (83%) patients. Among them, eight patients (53%) had 5q35 microdeletions and the other seven patients (47%) had seven different NSD1 intragenic mutations including four novel mutations."
    explanation: >-
      An East Asian cohort showing the inverted lesion-class ratio relative to
      European series - independent replication of the ancestry effect.
  - reference: PMID:27834868
    reference_title: "Steric Clash in the SET Domain of Histone Methyltransferase NSD1 as a Cause of Sotos Syndrome and Its Genetic Heterogeneity in a Brazilian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NSD1 mutations were identified in only 32% of the Brazilian Sotos patients in our study cohort suggesting other genes (including unknown disease genes) underlie the molecular etiology for the majority of these patients."
    explanation: >-
      The cohort-dependent yield noted above, quoted with the authors' own
      heterogeneity interpretation.
  - reference: PMID:34575025
    reference_title: "NSD1: A Lysine Methyltransferase between Developmental Disorders and Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several studies have shown that NSD1 controls gene expression by methylation of lysine 36 of histone 3 (H3K36me1/2) in a complex crosstalk with de novo DNA methylation."
    explanation: >-
      Review-level statement of the gene's molecular function and its coupling to
      DNA methylation, which is the basis of the mechanism curated above.

diagnosis:
- name: Molecular Genetic Confirmation
  description: >-
    The diagnosis is established by identifying a heterozygous NSD1 pathogenic
    variant or a deletion encompassing NSD1. Because the two lesion classes need
    different assays, testing has to cover both sequence variants and copy number -
    sequencing alone will miss the deletion class, which is the majority class in
    Japanese and Korean patients.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Detection of a heterozygous NSD1 pathogenic variant, or of a 5q35 deletion
    encompassing NSD1, establishes the diagnosis.
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Sotos syndrome is established in a proband with a heterozygous NSD1 pathogenic variant or a deletion encompassing NSD1 identified by molecular genetic testing."
    explanation: The GeneReviews diagnostic criterion, naming both lesion classes.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH analysis, MLPA or multiplex quantitative PCR allow the detection of total/partial NSD1 deletions, and direct sequencing allows detection of NSD1 mutations."
    explanation: >-
      Spells out the two assay classes, which is the point the description makes
      about sequencing alone being insufficient.
  - reference: PMID:42618064
    reference_title: "Sotos and Malan Syndromes in Childhood: Molecular and Clinical Findings From a Nationwide Cohort of 48 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analyses included whole-exome sequencing, clinical exome sequencing, targeted gene panels, multiplex ligation-dependent probe amplification, and chromosomal microarray analysis."
    explanation: Shows the contemporary assay combination used to cover both lesion classes.

- name: NSD1 DNA Methylation Episignature Analysis
  description: >-
    Genome-wide DNA methylation profiling of peripheral blood detects a
    NSD1-specific signature of 7,085 CpG sites, almost all hypomethylated. In the
    defining study the signature classified every sample in independent validation
    cohorts correctly, distinguished Sotos syndrome from benign NSD1 variants and
    from the clinically overlapping Weaver syndrome, and reclassified NSD1 missense
    variants of uncertain significance in agreement with blinded expert clinical
    review. It remains an adjunct to variant interpretation, not a replacement for
    the molecular diagnostic criterion above. Long-read nanopore sequencing has
    since been shown to recover an equivalent signature, and even a single-locus
    mark at the NSD1 CpG island, which would let genotype and methylation be
    assessed in one assay.
  diagnosis_term:
    preferred_term: DNA methylation episignature analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    A positive Sotos score supports pathogenicity of an NSD1 sequence variant and
    argues against clinically overlapping overgrowth syndromes.
  evidence:
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By interrogating DNAm in SS patients, we identify a genome-wide, highly significant NSD1(+/-)-specific signature that differentiates pathogenic NSD1 mutations from controls, benign NSD1 variants and the clinically overlapping Weaver syndrome."
    explanation: States exactly what the signature discriminates, which is the diagnostic claim here.
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Validation studies of independent cohorts of SS and controls assigned 100% of these samples correctly."
    explanation: The validation performance quoted in the description.
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As shown in Fig. 2, the NSD1+/−-specific signature allowed clear classification of VOUS as pathogenic or benign; 9/16 samples received positive SS scores clustering with the NSD1+/− pathogenic variants; these mutations were classified as pathogenic."
    explanation: Supports the variant-reclassification use, with the actual counts.
  - reference: PMID:39966947
    reference_title: "Diagnostic utility of single-locus DNA methylation mark in Sotos syndrome developed by nanopore sequencing-based episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-read sequencing enabled the successful extraction of two sets of differential methylation marks unique to each of Sotos syndrome and ATR-X syndrome, referred to as long-read-based DNA methylation signatures (LR-DNAm signatures), as alternatives to reported DNA methylation signatures"
    explanation: Supports the nanopore alternative described at the end of this entry.
  - reference: PMID:37889307
    reference_title: "Comprehensive evaluation of the implementation of episignatures for diagnosis of neurodevelopmental disorders (NDDs)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this setting, we show that Illumina, Noob or Funnorm normalization methods achieved higher classification performances on the testing sets compared to Quantile, Raw and Swan normalization methods."
    explanation: >-
      A caution rather than a capability claim: episignature performance for Sotos
      syndrome depends on preprocessing choices, so a negative result is
      interpretable only in the context of the pipeline that produced it.

definitions:
- name: Cardinal Clinical Triad of Sotos Syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    GeneReviews treats three features together as cardinal: the distinctive facial
    appearance, learning disability, and overgrowth of height and/or head
    circumference at or above 2 SD. The triad is a clinical-recognition construct
    that prompts molecular testing; it is not the diagnostic criterion, which is
    molecular. It is also not fully sensitive - a tenth of NSD1-positive
    individuals have normal height and head circumference.
  scope: Clinical recognition prompting NSD1 molecular testing
  inclusion_criteria:
  - preferred_term: Distinctive facial appearance
    description: >-
      Broad prominent forehead with dolichocephaly, sparse frontotemporal hair,
      downslanting palpebral fissures, malar flushing, long narrow face, tall chin.
    term:
      id: HP:0000337
      label: Broad forehead
  - preferred_term: Learning disability
    description: From early developmental delay to mild-to-severe intellectual impairment.
    term:
      id: HP:0001249
      label: Intellectual disability
  - preferred_term: Overgrowth
    description: Height and/or head circumference at or above 2 SD above the mean.
    term:
      id: HP:0000098
      label: Tall stature
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These three clinical features (distinctive facial features, learning disability, and overgrowth) are considered the cardinal features of Sotos syndrome."
    explanation: States the triad exactly as this definition records it.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial dysmorphism, learning disability, and childhood overgrowth were present in 90% of the individuals."
    explanation: >-
      Quantifies the triad's sensitivity in molecularly confirmed cases, which is
      the basis for the caveat in the description.

progression:
- phase: Childhood
  age_range: Early childhood through mid adolescence
  notes: >-
    Overgrowth is at its most marked in early and mid childhood and then attenuates
    - height and head circumference exceed matched controls only up to roughly age
    12-17 depending on sex and measure.
  evidence:
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males with SS demonstrated higher height before the age of 12.0, greater weight before 10.0, and larger head circumference before 15.5 compared to age- and sex-matched controls."
    explanation: Provides the age boundaries at which the growth excess ceases to distinguish patients from controls.
- phase: Adulthood
  age_range: Adults
  notes: >-
    Adults are generally healthy with few new medical problems, and the height
    excess is modest by adulthood (median +1.9 SD in women, +0.5 SD in men).
    Reproductive rates are low. A minority develop new problems - lymphoedema, poor
    dentition, hearing loss, contractures, tremor.
  evidence:
  - reference: PMID:31479583
    reference_title: "The phenotype of Sotos syndrome in adulthood: A review of 44 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort, median height in adult women is +1.9 SD and men +0.5 SD."
    explanation: The adult stature figures quoted here.
  - reference: PMID:31479583
    reference_title: "The phenotype of Sotos syndrome in adulthood: A review of 44 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reassuringly, adults with Sotos syndrome are generally healthy with few new medical issues; however, lymphedema, poor dentition, hearing loss, contractures and tremor have developed in a small number of individuals."
    explanation: Supports both the reassuring general statement and the specific minority complications.

epidemiology:
- name: Ancestry-Dependent Lesion-Class Distribution
  description: >-
    The proportion of Sotos syndrome caused by the 5q35 microdeletion rather than
    an intragenic variant differs markedly by population. In the Japanese referral
    series 52% of patients had a microdeletion against 6% of non-Japanese patients,
    and a Korean series found 53% of NSD1-positive patients had a deletion. This
    matters operationally: a diagnostic strategy that sequences NSD1 without a
    copy-number assay will miss most cases in these populations. The authors of the
    Japanese series were careful to note that patient-selection bias may contribute,
    since the flanking low-copy repeats mediating the deletion are present in
    different populations.
  evidence:
  - reference: PMID:14517949
    reference_title: "Fifty microdeletions among 112 cases of Sotos syndrome: low copy repeats possibly mediate the common deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large difference in the frequency of microdeletions between Japanese and non-Japanese patients was noted: 49 (52%) of the 95 Japanese patients and only one (6%) of the 17 non-Japanese had microdeletions."
    explanation: The primary observation of the population difference.
  - reference: PMID:14517949
    reference_title: "Fifty microdeletions among 112 cases of Sotos syndrome: low copy repeats possibly mediate the common deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such LCRs seem to be present in different populations. Thus the different frequency of microdeletions between Japanese and non-Japanese cases in our study may have been caused by patient-selection bias."
    explanation: >-
      The authors' own caveat, quoted so the entry does not overstate the effect as
      a settled population-genetic fact.
  - reference: PMID:23190751
    reference_title: "Clinical and genetic spectrum of 18 unrelated Korean patients with Sotos syndrome: frequent 5q35 microdeletion and identification of four novel NSD1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation spectrum of Korean patients with Sotos syndrome was similar to that of previous studies for Japanese patients."
    explanation: Independent East Asian replication of the deletion-predominant pattern.

differential_diagnoses:
- name: Malan Syndrome (NFIX-related, "Sotos syndrome 2")
  description: >-
    NFIX haploinsufficiency produces an overgrowth-intellectual disability
    phenotype historically labelled "Sotos syndrome 2" and often described as
    Sotos-like. It is a distinct MONDO concept and is curated separately in dismech
    as Malan_Syndrome; it is cross-referenced here rather than folded into this
    entry. NFIX and NSD1 lesions are routinely tested for together, and a recent
    nationwide cohort recruited both under one protocol.
  disease_term:
    preferred_term: Malan syndrome
    term:
      id: MONDO:0013885
      label: Malan overgrowth syndrome
  distinguishing_features:
  - Caused by NFIX loss of function at 19p13, not NSD1 loss at 5q35
  - The NSD1 blood episignature is Sotos-specific and does not classify NFIX cases as Sotos
  evidence:
  - reference: PMID:42618064
    reference_title: "Sotos and Malan Syndromes in Childhood: Molecular and Clinical Findings From a Nationwide Cohort of 48 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malan syndrome, a phenotypically overlapping condition, results from haploinsufficiency of the NFIX gene due to either heterozygous chromosomal microdeletions involving the 19p13.2 region or heterozygous loss-of-function variants."
    explanation: >-
      Establishes both the phenotypic overlap that makes this a differential and
      the distinct gene and locus that separate it.

- name: Weaver Syndrome (EZH2-related overgrowth)
  description: >-
    EZH2-related overgrowth shares childhood overgrowth, advanced bone age,
    macrocephaly and a distinctive facial gestalt with Sotos syndrome, and the two
    were long distinguished clinically with difficulty. The NSD1 methylation
    episignature separates them objectively: Weaver patients with confirmed EZH2
    variants all received strongly negative Sotos scores.
  disease_term:
    preferred_term: Weaver syndrome
    term:
      id: MONDO:0010193
      label: Weaver syndrome
  distinguishing_features:
  - EZH2/PRC2 H3K27 methyltransferase lesion rather than NSD1 H3K36 methyltransferase
  - The two disorders carry different, mutually exclusive DNA methylation episignatures
  evidence:
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All Weaver syndrome patients with EZH2+/− mutations received a strongly negative SS score (between −0.151 and −0.105) and were therefore classified confidently as ‘not SS' (Fig. 2)."
    explanation: Direct demonstration that the episignature discriminates the two overlapping overgrowth syndromes.
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Constitutional mutations in two different genes involved in regulating histone modifications, NSD1 and EZH2, have been shown to cause clinically overlapping overgrowth disorders, Sotos syndrome (SS) and Weaver syndrome, respectively."
    explanation: States the clinical overlap and the molecular distinction that motivates this differential.

- name: Tatton-Brown-Rahman Syndrome (DNMT3A-related overgrowth)
  description: >-
    DNMT3A-related overgrowth shares clinical features with Sotos syndrome, and the
    resemblance is now known to be mechanistic rather than coincidental: NSD1
    deposits the H3K36me2 mark that recruits DNMT3A, so the two genes act at
    consecutive steps of one pathway. Tatton-Brown-Rahman-derived DNMT3A missense
    mutations abolish PWWP recognition of that mark.
  disease_term:
    preferred_term: Tatton-Brown-Rahman syndrome
    term:
      id: MONDO:0014382
      label: Tatton-Brown-Rahman overgrowth syndrome
  distinguishing_features:
  - Germline DNMT3A variants rather than NSD1 loss of function
  - The shared pathway means clinical overlap is expected, so molecular testing rather than phenotyping is the discriminator
  evidence:
  - reference: PMID:31485078
    reference_title: "The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TBRS shares clinical features with Sotos syndrome (which is caused by haploinsufficiency of NSD1, a histone methyltransferase that catalyses the dimethylation of histone H3 at K36 (H3K36me2)8,12,13), which suggests that there is a mechanistic link between these two diseases."
    explanation: States the clinical overlap and the pathway relationship that explains it.

- name: Beckwith-Wiedemann Syndrome and Other Overgrowth Differentials
  description: >-
    Beyond the chromatin overgrowth syndromes, the Orphanet review lists
    Beckwith-Wiedemann syndrome, fragile X syndrome, Simpson-Golabi-Behmel syndrome
    and 22q terminal deletion syndrome as the main differentials. These are
    mechanistically unrelated to NSD1 and are separated by targeted molecular
    testing rather than by phenotype.
  distinguishing_features:
  - Distinct molecular aetiologies - 11p15 imprinting, FMR1 repeat expansion, GPC3, 22q13 deletion
  - None carries the NSD1 blood methylation episignature
  evidence:
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main differential diagnoses are Weaver syndrome, Beckwith-Wiedeman syndrome, Fragile X syndrome, Simpson-Golabi-Behmel syndrome and 22qter deletion syndrome."
    explanation: The review's own list of differentials, recorded here without adding conditions it does not name.

treatments:
- name: Genetic Counseling
  description: >-
    Counselling covers the autosomal dominant inheritance, the roughly 95% de novo
    rate, and the 50% transmission risk for the offspring of an affected person. An
    important limitation to convey is that the phenotype cannot be predicted from
    the genotype - expression varies between generations, so a prenatally identified
    alteration does not predict severity. Once the familial alteration is known,
    prenatal and preimplantation testing are possible, and the recurrence risk for
    unaffected parents of a de novo case is under 1%.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with Sotos syndrome has a 50% chance of inheriting the causative genetic alteration. Once the Sotos syndrome-related genetic alteration has been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: Supports both the recurrence-risk figure and the reproductive-testing options counselled about.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mosaicism has never been reported and the recurrence risk for normal parents is very low (<1%)."
    explanation: Supports the sibling recurrence-risk figure quoted to parents of a de novo case.

- name: Developmental and Educational Intervention
  description: >-
    Referral to appropriate specialists for learning disability and speech delay is
    the mainstay of management. There is no disease-modifying therapy; care is
    supportive, multidisciplinary and organised around the affected domains. The
    neuropsychological profile argues for targeting language, visuospatial ability
    and mathematics specifically rather than delivering generic support.
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Referral to appropriate specialists for management of learning disability / speech delays, behavioral findings, cardiac abnormalities, renal anomalies, scoliosis, and seizures"
    explanation: The GeneReviews management recommendation from which this treatment entry derives.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An adequate psychological and educational program with speech therapy and motor stimulation plays an important role in the global development of the patients."
    explanation: >-
      States that speech therapy, as part of a structured educational and psychological
      program, materially affects global developmental outcome — which is the claim this
      treatment entry makes. Replaces an earlier three-word quote from the same review
      ("Management is multidisciplinary.") that named no intervention and so could not
      support the entry on its own.
  - reference: PMID:38673476
    reference_title: "Neuropsychiatric Aspects of Sotos Syndrome: Explorative Review Building Multidisciplinary Bridges in Clinical Practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive assistance is needed for Sotos syndrome patients in responding to areas of difficulty."
    explanation: Supports targeting intervention at identified areas of difficulty rather than generically.

- name: Multisystem Surveillance and Supportive Care
  description: >-
    Regular general paediatric review, more frequent for younger children, those
    with many medical complications and families needing more support, and less
    frequent for older children and those with fewer complications. Two specific
    points sharpen this generic recommendation: echocardiography at diagnosis with
    cardiological follow-up, given the high heart-defect rate; and spinal
    surveillance weighted towards the deletion subtype, in which progressive
    scoliosis concentrates. GeneReviews also gives an explicit non-intervention
    rule - ventricular dilatation on brain MRI without raised intracranial pressure
    should not be treated.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Regular review by a general pediatrician for younger children, individuals with many medical complications, and families requiring more support than average; less frequent review of older children / teenagers and those individuals without many medical complications."
    explanation: The GeneReviews surveillance schedule this entry records.
  - reference: PMID:38535015
    reference_title: "Congenital Heart Defects in Patients with Molecularly Confirmed Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An accurate and detailed echocardiogram should be performed in patients with Sotos syndrome at diagnosis, and a specific cardiological follow-up program is needed."
    explanation: The cardiac-surveillance recommendation, from the cohort that found a 60% heart-defect rate.
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intervention is not recommended if the brain MRI shows ventricular dilatation without increased intracranial pressure"
    explanation: >-
      An explicit do-not-treat rule, curated because avoiding an unnecessary shunt
      is a management action in its own right.

discussions:
- discussion_id: sotos_overgrowth_mechanism_unexplained
  prompt: >-
    By what mechanism does NSD1 haploinsufficiency produce childhood overgrowth and
    advanced skeletal maturation, as opposed to the neurodevelopmental features?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Developmental Transcriptional Program
  - phenotypes#Childhood Overgrowth
  - phenotypes#Advanced Bone Age
  rationale: >-
    The chain curated here reaches intellectual disability through a specific,
    rescue-validated effector (APC2 and cortical migration) and reaches congenital
    heart defects through a lineage-differentiation defect. Neither route explains
    the overgrowth, which is the feature the syndrome is named for. No node in this
    entry connects the chromatin lesion to a growth-plate, growth-hormone-axis or
    somatic-growth mechanism, because no cited source establishes one: the
    DNA-methylation signature is enriched for morphogenesis and neuronal
    differentiation genes rather than for growth regulators, and the
    mesendodermal-differentiation result names the skeletal lineage without
    measuring skeletal growth. Leaving the gap explicit is preferable to drawing an
    unsourced edge from the transcriptional node to the growth phenotypes.
  proposed_experiments:
  - experiment_id: sotos-growth-plate-chondrocyte-model
    name: NSD1-haploinsufficient human chondrocyte and growth-plate model
    description: >-
      Differentiate isogenic NSD1+/- and corrected human iPSC lines into
      chondrocytes and cartilage organoids, and compare proliferation, hypertrophic
      transition timing, H3K36me2 distribution and intergenic DNA methylation across
      matched differentiation stages.
    readouts:
    - name: Chondrocyte proliferative and hypertrophic-transition kinetics by NSD1 genotype
      target: "phenotypes#Advanced Bone Age"
    - name: H3K36me2 and CpG-methylation state at growth-regulatory loci in chondrocytes
      target: "pathophysiology#Dysregulated Developmental Transcriptional Program"
    decision_criterion: >-
      A reproducible genotype-dependent acceleration of hypertrophic transition,
      reversed by isogenic correction and accompanied by a chromatin change at
      identifiable growth-regulatory loci, would establish a candidate skeletal
      overgrowth mechanism. Normal chondrocyte behaviour despite the expected
      chromatin defect would push the explanation towards an endocrine or systemic
      route.
  evidence:
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This enrichment in neural and cellular development pathways reflects the cardinal features of SS (that is, overgrowth and developmental delay) and validates the utility of the DNAm signature to elucidate the functional, biological and molecular impact of NSD1 pathogenic variants."
    explanation: >-
      The authors read the neural and cellular-development enrichment as reflecting
      both cardinal features, but the enriched categories they report are
      morphogenesis, differentiation, neuronal differentiation and adhesion - none
      of them growth-regulatory. That gap between the interpretation and the
      categories is what this discussion records.
  - reference: PMID:35094088
    reference_title: "NSD1 mutations deregulate transcription and DNA methylation of bivalent developmental genes in Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most abnormally expressed genes displayed reduced expression in SS; these downregulated genes consisted mostly of bivalent genes and were enriched for regulators of development and neural synapse function."
    explanation: >-
      The most direct human transcriptomic characterisation available, and it too
      resolves onto development and neural synapse function rather than onto a
      growth pathway - reinforcing that the growth arm is unexplained rather than
      merely uncurated.

- discussion_id: sotos_episignature_causal_status
  prompt: >-
    Is the peripheral-blood DNA methylation episignature a step in the causal chain
    that produces the Sotos phenotype, or a robust biomarker of NSD1 loss measured
    in the wrong tissue?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Intergenic DNA Hypomethylation from Loss of DNMT3A Recruitment
  rationale: >-
    The intergenic hypomethylation node is curated as mechanism because the
    H3K36me2-DNMT3A dependency was established experimentally and the same
    hypomethylation is observed in patient tissue. But the diagnostic episignature
    is measured in peripheral blood, and the phenotype is generated in developing
    brain, heart and skeleton. Whether the methylation change in the relevant
    developing tissues is a cause of the transcriptional dysregulation or a parallel
    consequence of the same histone lesion is not settled by any cited study. The
    same open question is recorded at module level for the chromatinopathies
    generally; this entry inherits it rather than resolving it, and the episignature
    is therefore curated under `diagnosis` as a classifier rather than as a
    downstream pathophysiology node.
  evidence:
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As DNAm can be tissue and cell-type specific, we tested fibroblast-derived DNA from three SS patients with truncating mutations in NSD1 in comparison to four control fibroblast samples."
    explanation: >-
      The authors themselves treat tissue specificity as the live question and
      address it only with three fibroblast samples - no developing brain, cardiac
      or skeletal tissue is examined.

notes: >-
  Scope and boundaries. This entry covers NSD1-related Sotos syndrome
  (MONDO:0019349, "Sotos syndrome 1"). Two neighbouring concepts are deliberately
  excluded. NFIX-related "Sotos syndrome 2" is a separate MONDO concept already
  curated as kb/disorders/Malan_Syndrome.yaml and appears here only as a
  differential diagnosis. Biallelic APC2 loss ("Sotos syndrome 3") is not curated
  as a disease entry here either; APC2 appears in this entry only in its
  established role as a transcriptional target of NSD1, which is what the cited
  work actually demonstrates.

  The subtype axis. The intragenic-variant and 5q35-microdeletion classes are
  curated as `has_subtypes` rather than as separate entries. The reason is explicit
  in the largest cohort: every feature seen in deletion patients is also seen in
  intragenic-variant patients, and deletion size does not correlate with phenotype
  - so the deletion is a more severe dose of the same disease, not a
  contiguous-gene syndrome with its own features. The differences that do exist
  (less overgrowth, more severe learning disability, more progressive scoliosis)
  are quantitative and are recorded on the subtype and phenotype records.

  Module conformance. Five nodes declare conformance to
  `epigenetic_machinery_neurodevelopmental_dysregulation`, including its key target
  node "Dysregulated Neurodevelopmental Transcriptional Program". NSD1 is named in
  that module's own notes as a writer-class component, so the fit is the intended
  one rather than a stretch. The two nodes not conformed - the 5q35 NAHR node and
  the tumour-suppressor node - are outside the module's scope: one is a
  structural-variant mechanism, the other is cancer biology the module explicitly
  assigns to the cancer hallmark modules.

  Grouping coverage. There is currently no overgrowth-syndrome grouping in
  kb/groupings/, although the KB already holds several members of that family
  (Weaver, Malan, Tatton-Brown-Rahman, Luscan-Lumish, Marshall-Smith, CHD8-related
  overgrowth). An "Overgrowth-Intellectual Disability Syndromes" grouping would
  have a natural anchor here. No grouping file was edited as part of creating this
  entry.

  Deep research. Both asta and falcon were run. The asta run returned almost
  entirely off-topic papers (Bartter syndrome, nasopharyngeal carcinoma, pregnancy
  toxaemia in goats) and contributed nothing beyond confirming the NSD1/H3K36 and
  APC2 links. The falcon run was substantive and its causal chain agrees with the
  one curated here, including its explicit statement that the growth-effector
  pathway is unresolved; two of its references (Brennan 2022 human transcriptomics,
  Baujat 2007 Orphanet review) were located by DOI and are cited throughout. See
  the history record for the full account, including the ontology terms the falcon
  report suggested that name different concepts.

review_notes: >-
  Frequency bands are conservative. Where GeneReviews or the Orphanet review lists
  a feature without a number, no `frequency:` is set rather than guessing a band -
  seizures, joint hyperlaxity, renal anomalies, cranial imaging abnormalities,
  neonatal hypotonia and neonatal jaundice are all in that position. Where a number
  exists it is quoted and the band derived from it (feeding difficulties 29%,
  otologic conditions 14%, advanced bone age 40%/8% by sex, autistic symptoms
  72.7%, scoliosis 41%, heart defects 60%).

  Advanced bone age carries a real frequency conflict. The falcon deep-research
  report gives 75-80% of prepubertal children with historical estimates of 74-100%,
  while the Korean longitudinal cohort measured 40% of males and 8% of females at
  last visit. These are not necessarily contradictory - the timing of the
  radiograph differs - but the entry follows the measured cohort because that is
  the figure with a citable exact quote. A reviewer with access to a prepubertal
  series may want to raise the band and record both.

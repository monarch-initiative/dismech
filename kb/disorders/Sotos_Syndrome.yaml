classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian multisystem malformation/overgrowth syndrome; Harrison's covers
      this class of disorder under the genetics Part rather than under a single
      organ system.
  - classification_value: NEUROLOGIC
    notes: >-
      Intellectual disability, autism spectrum behaviour and seizures are core and
      drive most of the long-term clinical burden.
  isds_skeletal_category:
  - classification_value: overgrowth_syndromes_with_skeletal_involvement
    notes: >-
      Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 31 "Overgrowth (tall stature) syndromes and segmental
      overgrowth"; listed as "Sotos (NSD1)". This was group 30 in the 2019
      revision (PMID:31633310).

prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 7.1
  notes: >-
    The widely quoted figure is approximately 1 in 14,000 live births, which
    normalises to about 7.1 per 100,000. Several sources are cited, but they are
    not independent measurements: the Choufani source attributes the estimate to
    unpublished data and the later papers cite the same lineage of figures. An
    earlier Orphanet review stated plainly that the exact prevalence is unknown.
    Treat this as the field's conventional estimate rather than a
    population-based ascertainment study.
  evidence:
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome (OMIM 117550) is an autosomal dominant condition with an estimated prevalence of 1:14,000 live births (Rahman, unpublished data)."
    explanation: >-
      Gives the quoted birth-prevalence figure and, in the same sentence, its
      provenance as unpublished data - which is why this record is not presented
      as a measured population rate.
  - reference: PMID:37384309
    reference_title: "Beyond the known phenotype of sotos syndrome: a 31-individuals cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SS is the most frequent genetic cause of overgrowth, with an estimated incidence of 1/14.000 live births"
    explanation: >-
      A second clinical source repeating the same estimate and situating Sotos
      syndrome as the commonest genetic overgrowth diagnosis.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exact prevalence remains unknown but hundreds of cases have been reported."
    explanation: >-
      Cited deliberately as a counterweight: the Orphanet review declined to give
      a prevalence at all, which is why this record is banded rather than reported
      as a measured rate.

inheritance:
- name: Autosomal Dominant
  description: >-
    Sotos syndrome is inherited in an autosomal dominant manner, but the great
    majority of cases are de novo: roughly 95% of affected individuals have a new
    genetic alteration and only about 5% have an affected parent. Each child of an
    affected individual has a 50% chance of inheriting the alteration, and the
    phenotype cannot be predicted from the alteration alone because expression
    varies between generations. Germline mosaicism has not been reported, so the
    recurrence risk for unaffected parents of a de novo case is very low. The low
    observed vertical transmission rate is itself notable and has been attributed
    to reduced reproductive fitness.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: "~95%"
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome is inherited in an autosomal dominant manner. About 5% of individuals diagnosed with Sotos syndrome have an affected parent; approximately 95% of individuals have the disorder as the result of a de novo genetic alteration."
    explanation: GeneReviews establishes both the inheritance mode and the de novo proportion.
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic expression can vary from one generation to the next; thus, it is not possible to accurately predict phenotype based on the prenatal finding of a Sotos syndrome-related genetic alteration."
    explanation: Supports the variable-expressivity assignment and the counselling limitation that follows from it.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mosaicism has never been reported and the recurrence risk for normal parents is very low (<1%)."
    explanation: Supports the germline-mosaicism and recurrence-risk statements used in counselling.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified only 13 familial cases. The reasons for the low vertical transmission rate are unclear, although familial cases were more likely than nonfamilial cases (P = .005) to carry missense mutations, suggesting that the underlying NSD1 mutational mechanism in Sotos syndrome may influence reproductive fitness."
    explanation: >-
      Quantifies how rare familial transmission is in the largest curated cohort
      and records the authors' reproductive-fitness interpretation without
      asserting it as established.

has_subtypes:
- name: Intragenic NSD1 Variant
  display_name: Intragenic NSD1 loss-of-function variant
  description: >-
    Sotos syndrome caused by a heterozygous intragenic NSD1 variant - truncating
    variants distributed throughout the gene, or missense variants confined to
    the functional domains. This is the majority class in European-ancestry
    cohorts, where it accounts for roughly 83% of NSD1-positive individuals, and
    is associated with more prominent overgrowth and less severe learning
    disability than the microdeletion class.
  genes:
  - preferred_term: NSD1
    term:
      id: hgnc:14234
      label: NSD1
  subtype_frequency: "~83% of NSD1-positive individuals in a predominantly non-Japanese cohort"
  evidence:
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, our data suggest that 93% of patients who have been clinically diagnosed with Sotos syndrome have identifiable NSD1 abnormalities, of which 83% are intragenic mutations and 10% are 5q35 microdeletions."
    explanation: Establishes the intragenic-variant share of NSD1-positive Sotos syndrome in this cohort.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating NSD1 mutations occurred throughout the gene, but pathogenic missense mutations occurred only in functional domains (P < 2 x 10(-16))."
    explanation: Supports the described distribution of intragenic variant classes across the gene.
- name: 5q35 Microdeletion
  display_name: Recurrent 5q35 microdeletion encompassing NSD1
  description: >-
    Sotos syndrome caused by a contiguous 5q35 deletion that removes the whole
    NSD1 gene. The common deletion arises by non-allelic homologous recombination
    between the directly oriented C and C' subunits of the flanking Sos-PREP and
    Sos-DREP low-copy repeats. Its frequency differs sharply by population - about
    half of Japanese and Korean cases versus a small minority of European ones -
    and the class carries less prominent overgrowth, more severe learning
    disability and a higher rate of progressive scoliosis. Deletion size does not
    correlate with phenotype, so the additional deleted genes appear to contribute
    little beyond NSD1 loss itself.
  genes:
  - preferred_term: NSD1
    term:
      id: hgnc:14234
      label: NSD1
  subtype_frequency: "~10% of NSD1-positive individuals in a predominantly non-Japanese cohort; ~52% of Japanese patients in the referral series"
  evidence:
  - reference: PMID:14517949
    reference_title: "Fifty microdeletions among 112 cases of Sotos syndrome: low copy repeats possibly mediate the common deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large difference in the frequency of microdeletions between Japanese and non-Japanese patients was noted: 49 (52%) of the 95 Japanese patients and only one (6%) of the 17 non-Japanese had microdeletions."
    explanation: Directly quantifies the population skew that defines the clinical relevance of this subtype.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with microdeletions had less-prominent overgrowth (P = .0003) and more-severe learning disability (P = 3 x 10(-9)) than patients with mutations."
    explanation: The primary genotype-phenotype contrast justifying curation of the two molecular classes as subtypes.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, all features present in patients with microdeletions were also observed in patients with mutations, and there was no correlation between deletion size and the clinical phenotype, suggesting that the deletion of additional genes in patients with 5q35 microdeletions has little specific effect on phenotype."
    explanation: >-
      The key reason these are subtypes of one disease rather than a separate
      contiguous-gene entity: the deleted flanking genes add no distinct features.

pathophysiology:
- name: Non-Allelic Homologous Recombination at 5q35 Sos-REP Low-Copy Repeats
  description: >-
    The recurrent Sotos deletion is generated by a structural-variant mechanism
    rather than by a point mutational process. Two complex mosaic low-copy repeat
    blocks flank NSD1 - proximal Sos-PREP (~390 kb) and distal Sos-DREP (~429 kb),
    each built from six subunits, most in inverted orientation. Only the C and C'
    subunits are directly oriented with respect to each other and they are more
    than 99% identical; recombination between them yields the common deletion and
    a patient-specific junction fragment absent from controls. This mechanism
    explains why the deletion recurs at the same breakpoints across unrelated
    individuals.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: NSD1
      term:
        id: hgnc:14234
        label: NSD1
    variant_origin: DE_NOVO
    allelic_events:
    - DELETION
    - COPY_NUMBER_LOSS
    zygosity: HETEROZYGOUS
    description: >-
      A heterozygous contiguous deletion of the 5q35 interval containing NSD1,
      almost always arising de novo.
  subtypes:
  - 5q35 Microdeletion
  evidence:
  - reference: PMID:15640245
    reference_title: "Sotos syndrome common deletion is mediated by directly oriented subunits within inverted Sos-REP low-copy repeats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that Sos-PREP and Sos-DREP are composed of six subunits termed A-F. Each of the homologous subunits, with the exception of one, is located in an inverted orientation and the order of subunits is different between the two Sos-REPs. Only the subunit C' in Sos-DREP is oriented directly with respect to the subunit C in Sos-PREP. These latter C' and C subunits are greater than 99% identical."
    explanation: Establishes the repeat architecture that makes only one recombination substrate available.
  - reference: PMID:15640245
    reference_title: "Sotos syndrome common deletion is mediated by directly oriented subunits within inverted Sos-REP low-copy repeats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using pulsed-field gel electrophoresis analysis in eight Sos patients with a common deletion, we detected an approximately 550 kb junction fragment that we predicted according to the non-allelic homologous recombination (NAHR) mechanism using directly oriented Sos-PREP C and Sos-DREP C' subunits as substrates."
    explanation: Direct patient-derived evidence that the predicted NAHR product is what the deletion actually is.
  downstream:
  - target: NSD1 Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      The recombination product removes one entire NSD1 allele, so the structural
      event and the dosage lesion are the same event viewed at two levels.
    evidence:
    - reference: PMID:14517949
      reference_title: "Fifty microdeletions among 112 cases of Sotos syndrome: low copy repeats possibly mediate the common deletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We previously showed that haploinsufficiency of the NSD1 gene is the major cause of SoS, and submicroscopic deletions at 5q35, including NSD1, were found in about a half (20/42) of our patients examined."
      explanation: States that the 5q35 submicroscopic deletions act by including - and thereby deleting - NSD1.

- name: NSD1 Haploinsufficiency
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  description: >-
    The initiating lesion in essentially all Sotos syndrome is loss of one
    functional copy of NSD1, reached either by an intragenic loss-of-function
    variant or by the 5q35 microdeletion above. NSD1 is a writer in the four-class
    scheme of the epigenetic machinery, so this node is the disease-specific
    instance of the module's dosage-sensitive component loss. Haploinsufficiency -
    rather than a dominant-negative or gain-of-function mechanism - is established
    both by the mutational spectrum (nonsense, frameshift and whole-gene deletion
    all producing the same syndrome) and by the near-exclusive association of NSD1
    aberrations with the Sotos phenotype across a large diagnostic series.
  biological_scale: MOLECULAR
  gene:
    preferred_term: NSD1
    term:
      id: hgnc:14234
      label: NSD1
  genetic_context:
    gene:
      preferred_term: NSD1
      term:
        id: hgnc:14234
        label: NSD1
    variant_origin: GERMLINE
    allelic_events:
    - PATHOGENIC_VARIANT
    - NONSENSE_VARIANT
    - FRAMESHIFT_VARIANT
    - DELETION
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline NSD1 loss of function, usually de novo. The allelic
      events listed span the two curated subtypes; missense variants also occur
      but only within the functional domains.
  evidence:
  - reference: PMID:11896389
    reference_title: "Haploinsufficiency of NSD1 causes Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 1 nonsense, 3 frameshift and 20 submicroscopic deletion mutations of NSD1 among 42 individuals with sporadic cases of Sotos syndrome. The results indicate that haploinsufficiency of NSD1 is the major cause of Sotos syndrome."
    explanation: >-
      The original demonstration, and the reason the mechanism is read as dosage
      loss: three distinct classes of loss-of-function lesion produce one syndrome.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome was clinically diagnosed in 99% of NSD1-positive individuals, independent of the molecular analyses, indicating that NSD1 aberrations are essentially specific to this condition."
    explanation: Establishes the specificity of the gene-disease relationship on which this node rests.
  downstream:
  - target: Genome-Wide H3K36me2 Depletion
    causal_link_type: DIRECT
    description: >-
      Reduced NSD1 dosage lowers deposition of the H3K36me2 mark NSD1 principally
      writes.
    evidence:
    - reference: PMID:31485078
      reference_title: "The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Genetic ablation of Nsd1 and its paralogue Nsd2 in mouse cells results in a redistribution of DNMT3A to H3K36me3-modified gene bodies and a reduction in the methylation of intergenic DNA."
      explanation: >-
        Demonstrates in a genetic loss-of-function system that removing Nsd1
        changes the H3K36me2-dependent chromatin state; the human parallel is the
        intergenic hypomethylation reported in the same paper.
    - reference: PMID:42157059
      reference_title: "NSD1 governs H3K36me2-mediated DNA methylation and drives endo-mesodermal differentiation of human iPSCs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NSD1-KO cells exhibit a substrate-specific decrease in proliferation, reduced H3K36me2 levels, and extensive DNA hypomethylation."
      explanation: Human iPSC knockout confirms that loss of NSD1 function reduces H3K36me2 in human cells.

- name: Genome-Wide H3K36me2 Depletion
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    NSD1 is a SET-domain methyltransferase that primarily dimethylates nucleosomal
    histone H3 lysine 36, and its catalytic domain carries an autoregulatory loop
    that normally occludes the substrate until the nucleosome stabilises the
    active conformation. Reduced NSD1 dosage therefore lowers H3K36me2 across the
    large intergenic euchromatic domains where this mark predominates. Because
    H3K36me2 is one arm of the permissive-repressive balance, its depletion is not
    simply a subtraction: at developmental enhancers the same loss permits
    excessive H3K27me3 and lowers H3K27ac. Catalysis depends on several NSD1
    modules together (PHD1-4, PWWP2 and SET), which is why missense variants
    restricted to those domains behave like truncating alleles - molecular
    modelling of SET-domain substitutions shows loss of structural stability or
    steric clash near the S-adenosylmethionine binding site.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NSD1 H3K36 dimethyltransferase activity
    term:
      id: GO:0140954
      label: histone H3K36 dimethyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:21196496
    reference_title: "The structure of NSD1 reveals an autoregulatory mechanism underlying histone H3K36 methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Sotos syndrome gene product, NSD1, is a SET domain histone methyltransferase that primarily dimethylates nucleosomal histone H3 lysine 36 (H3K36)."
    explanation: Establishes the enzymatic identity and product specificity that this node depletes.
  - reference: PMID:21196496
    reference_title: "The structure of NSD1 reveals an autoregulatory mechanism underlying histone H3K36 methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 1.7 Å structure of the catalytic domain of NSD1 presented here shows that a regulatory loop adopts a conformation that prevents free access of H3K36 to the bound S-adenosyl-L-methionine."
    explanation: Structural basis for the autoregulated catalysis described in this node.
  - reference: PMID:40118455
    reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disruption of either one of these Nsd1 modules severely abrogated H3K36me2 in mESCs and significantly impaired appropriate induction of developmental genes upon mESC differentiation."
    explanation: >-
      Supports the multi-module catalytic requirement, which is the mechanistic
      reason domain-restricted missense variants are pathogenic.
  - reference: PMID:27834868
    reference_title: "Steric Clash in the SET Domain of Histone Methyltransferase NSD1 as a Cause of Sotos Syndrome and Its Genetic Heterogeneity in a Brazilian Cohort."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "For six mutations near the ligand-binding site we observed in simulations steric clashes with neighboring side chains near the substrate S-Adenosyl methionine (SAM) binding site, which may disrupt the enzymatic activity of NSD1."
    explanation: >-
      Supplies the structural rationale for SET-domain missense pathogenicity. This
      is molecular-dynamics simulation, not an enzyme assay, hence COMPUTATIONAL.
  downstream:
  - target: Intergenic DNA Hypomethylation from Loss of DNMT3A Recruitment
    causal_link_type: DIRECT
    description: >-
      H3K36me2 is the chromatin signal that positions DNMT3A over intergenic DNA,
      so depleting the mark relocates the enzyme and the methylation it deposits.
    evidence:
    - reference: PMID:31485078
      reference_title: "The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that NSD1-mediated H3K36me2 is required for the recruitment of DNMT3A and maintenance of DNA methylation at intergenic regions."
      explanation: States the causal dependency of intergenic DNA methylation on NSD1-deposited H3K36me2.
  - target: Loss of Developmental Enhancer Priming
    causal_link_type: DIRECT
    description: >-
      At distal enhancers of lineage transcription-factor genes, NSD1-deposited
      H3K36me2 holds off H3K27me3 and sustains basal H3K27ac; losing the mark
      collapses that primed state.
    evidence:
    - reference: PMID:40118455
      reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mechanistically, Nsd1 directly occupies putative distal enhancers of the lineage transcription factor genes under the pluripotent cell state, where it deposits H3K36me2 to antagonize the excessive H3K27me3 and maintains the basal H3K27ac level, thereby safeguarding these gene enhancers at a primed state that responds readily to differentiation cues."
      explanation: >-
        The single sentence that carries this whole edge - it names the mark, the
        antagonism, and the enhancer state that fails when the mark is lost.

- name: Intergenic DNA Hypomethylation from Loss of DNMT3A Recruitment
  description: >-
    DNMT3A reads H3K36me2 through its PWWP domain and is thereby concentrated in
    intergenic euchromatin. When NSD1 dosage falls, DNMT3A redistributes to
    H3K36me3-marked gene bodies and intergenic CpG methylation is lost. This is
    the mechanistic bridge between a histone-modifier disorder and a
    DNA-methylation phenotype, and it is the reason Sotos syndrome and
    Tatton-Brown-Rahman syndrome (germline DNMT3A) overlap clinically: the two
    genes act in one pathway, at consecutive steps. Peripheral blood from Sotos
    patients shows this intergenic hypomethylation directly, and it is the
    substrate of the diagnostic episignature - 99.3% of the signature's CpG sites
    lose rather than gain methylation. In patient tissue the hypomethylation is
    concentrated at the promoters of the transcriptionally deregulated genes
    themselves. Note that dismech does not treat the blood episignature as a step
    in the brain's causal chain; see the knowledge-gap discussion on this entry.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNMT3A de novo CpG methyltransferase activity at intergenic euchromatin
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31485078
    reference_title: "The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood samples from patients with Sotos syndrome and NSD1-mutant tumours also exhibit hypomethylation of intergenic DNA."
    explanation: >-
      Shows the predicted DNA-methylation consequence in human Sotos tissue, not
      only in the mouse system in which the mechanism was worked out.
  - reference: PMID:31485078
    reference_title: "The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The PWWP domain of DNMT3A shows dual recognition of H3K36me2 and H3K36me3 in vitro, with a higher binding affinity towards H3K36me2 that is abrogated by TBRS-derived missense mutations."
    explanation: >-
      Identifies the reader module that couples the two marks and explains why
      DNMT3A-mutant overgrowth phenocopies NSD1-mutant overgrowth.
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 7,085 CpG sites distributed across the genome that we refer to as the NSD1+/−-specific signature; 7,038 CpG sites (99.3%) demonstrated loss of DNAm"
    explanation: >-
      Quantifies the directionality of the human methylation change as
      overwhelmingly loss, matching the hypomethylation mechanism of this node.
  - reference: PMID:35094088
    reference_title: "NSD1 mutations deregulate transcription and DNA methylation of bivalent developmental genes in Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA hypomethylation was strongly enriched within promoters of transcriptionally deregulated genes: overexpressed genes displayed hypomethylation at their transcription start sites while underexpressed genes featured hypomethylation at polycomb binding sites within their promoter CpG island shores."
    explanation: >-
      Ties the methylation loss in patient samples to the specific genes whose
      transcription changes, which is what makes this node mechanistic rather than
      merely correlative.
  downstream:
  - target: Dysregulated Developmental Transcriptional Program
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Paired transcriptomic and methylomic profiling of Sotos patients shows the
      hypomethylation concentrated at the promoters of the deregulated genes, and
      the authors interpret this as H3K36 methylation directing promoter DNA
      methylation partly by opposing PRC2.
    evidence:
    - reference: PMID:35094088
      reference_title: "NSD1 mutations deregulate transcription and DNA methylation of bivalent developmental genes in Sotos syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, these findings indicate that NSD1-deposited H3K36 methylation regulates transcription by directing promoter DNA methylation, partially by repressing polycomb repressive complex 2 (PRC2) activity."
      explanation: >-
        The authors' own mechanistic reading of paired human transcriptome and
        methylome data. Graded as having known intermediates because PRC2
        opposition is the named intervening step rather than a black box.

- name: Loss of Developmental Enhancer Priming
  description: >-
    Independently of the DNA-methylation arm, NSD1 occupies the distal enhancers
    of lineage-specifying transcription-factor genes while cells are still
    pluripotent and holds them in a primed state that can respond rapidly to
    differentiation cues. Losing NSD1 leaves those enhancers unable to support the
    rapid induction of their genes, so the defect is one of responsiveness at the
    moment of lineage commitment rather than of steady-state expression alone.
    This is a distinct claim from intergenic hypomethylation and is evidenced in a
    different system, which is why it is a separate node.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression at developmental enhancers
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40118455
    reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Time-course transcriptomic profiling following the mESC differentiation revealed that Nsd1 not only facilitates the basal expression but also permits the differentiation-accompanied rapid induction of a suite of meso-endoderm lineage-specifying transcription factor genes such as T and Gata4."
    explanation: >-
      Separates the two things Nsd1 does at these loci - basal expression and
      inducibility - which is the specific content of this node.
  downstream:
  - target: Dysregulated Developmental Transcriptional Program
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40118455
      reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Disruption of either one of these Nsd1 modules severely abrogated H3K36me2 in mESCs and significantly impaired appropriate induction of developmental genes upon mESC differentiation."
      explanation: Connects failure of the primed enhancer state to failed induction of the developmental gene program.

- name: Dysregulated Developmental Transcriptional Program
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  description: >-
    The convergence point of both chromatin arms, and the node this entry shares
    with every other chromatinopathy. Transcriptomic profiling of Sotos patients
    identifies a signature that separates them from controls; most deregulated
    genes are underexpressed, and they are predominantly bivalent genes enriched
    for regulators of development and neural synapse function. The methylation
    signature points the same way: its CpG sites sit near genes for cellular
    morphogenesis, differentiation, neuronal differentiation and axonogenesis, and
    cell adhesion. One downstream target has been identified specifically - Nsd1
    knockdown downregulates Apc2, a cytoskeletal regulator in neurons, and
    biallelic APC2 loss independently produces Sotos-like features in humans.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DYSREGULATED
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: DECREASED
  evidence:
  - reference: PMID:35094088
    reference_title: "NSD1 mutations deregulate transcription and DNA methylation of bivalent developmental genes in Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most abnormally expressed genes displayed reduced expression in SS; these downregulated genes consisted mostly of bivalent genes and were enriched for regulators of development and neural synapse function."
    explanation: >-
      Direct human transcriptomic evidence naming both the direction of change and
      the gene classes affected - the strongest support for this node.
  - reference: PMID:26690673
    reference_title: "NSD1 mutations generate a genome-wide DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results demonstrate enrichment for genes with roles in cellular morphogenesis and differentiation, as well as neuronal differentiation/axonogenesis and cell adhesion/cell signalling"
    explanation: >-
      An independent human data type (methylation rather than expression)
      converging on the same functional categories.
  - reference: PMID:25753423
    reference_title: "Loss-of-Function Mutation in APC2 Causes Sotos Syndrome Features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Endogenous Apc2 expression was downregulated by the knockdown of Nsd1, indicating that APC2 is a downstream effector of NSD1 in neurons."
    explanation: Identifies a specific transcriptional target of NSD1 in the relevant cell type.
  downstream:
  - target: Impaired Cortical Neuronal Migration and Laminar Positioning
    causal_link_type: DIRECT
    description: >-
      The APC2 arm of the transcriptional program is the one with a demonstrated
      cellular readout, established by rescue rather than by correlation.
    evidence:
    - reference: PMID:25753423
      reference_title: "Loss-of-Function Mutation in APC2 Causes Sotos Syndrome Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nsd1 knockdown in embryonic mouse brains impaired the migration and laminar positioning of cortical neurons, as observed in Apc2-/- mice, and this defect was rescued by the forced expression of Apc2."
      explanation: >-
        The rescue is what makes this a causal edge rather than a co-occurrence:
        restoring the transcriptional target restores the cellular phenotype.
  - target: Impaired Mesendodermal Lineage Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40118455
      reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found Nsd1 to be indispensable for the faithful differentiation of mESCs into three primary germ layers, particularly, meso-endodermal cell lineages related to the development of the heart and the skeletal system."
      explanation: Links the failed developmental gene induction to a specific lineage-differentiation failure.

- name: Impaired Cortical Neuronal Migration and Laminar Positioning
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis"
  description: >-
    Reduced APC2 downstream of NSD1 disrupts cytoskeletal regulation in cortical
    neurons, so migration and laminar positioning fail. Two independent human
    observations converge on the same effector: a homozygous APC2 frameshift
    variant produces Sotos features in siblings without NSD1 mutations, and
    Apc2-null mice show impaired learning and memory alongside an abnormal head
    shape. This is currently the best-supported mechanistic route from the
    chromatin lesion to the intellectual disability, but it is a mouse and
    knockdown result: it has not been demonstrated in human Sotos cortex.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical projection neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cerebral cortex cell migration
    term:
      id: GO:0021795
      label: cerebral cortex cell migration
    modifier: DECREASED
  evidence:
  - reference: PMID:25753423
    reference_title: "Loss-of-Function Mutation in APC2 Causes Sotos Syndrome Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted an etiological study on two siblings with Sotos features without mutations in NSD1 and detected a homozygous frameshift mutation in the APC2 gene by whole-exome sequencing, which resulted in the loss of function of cytoskeletal regulation in neurons."
    explanation: >-
      Human genetic support that this effector, not merely this pathway, is
      sufficient to generate the phenotype when lost.
  - reference: PMID:25753423
    reference_title: "Loss-of-Function Mutation in APC2 Causes Sotos Syndrome Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Apc2-deficient (Apc2-/-) mice exhibited impaired learning and memory abilities along with an abnormal head shape."
    explanation: Provides the organism-level cognitive readout of the cellular defect in an animal model.
  downstream:
  - target: Intellectual Disability and Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a cortical migration defect to the human learning disability
      is inferred. The authors advance APC2 as the explanation for Sotos
      intellectual disability, but no study links measured cortical
      cytoarchitecture to cognitive outcome in affected people.
    evidence:
    - reference: PMID:25753423
      reference_title: "Loss-of-Function Mutation in APC2 Causes Sotos Syndrome Features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, APC2 is a crucial target of NSD1, which provides an explanation for the intellectual disability associated with Sotos syndrome."
      explanation: >-
        The authors' own causal claim, graded INDIRECT because it is an
        interpretation drawn from mouse and knockdown data rather than a
        measurement in affected humans.

- name: Impaired Mesendodermal Lineage Differentiation
  description: >-
    Beyond the nervous system, NSD1 loss derails commitment to mesodermal and
    endodermal lineages. Mouse embryonic stem cells lacking Nsd1 fail to
    differentiate faithfully into the three germ layers, with the mesendodermal
    lineages that build heart and skeleton the most affected; human NSD1-knockout
    iPSCs show the same aberrant endodermal and mesodermal commitment. This node
    provides a developmental route to the congenital cardiac anomalies seen in
    Sotos syndrome, and is a plausible but not yet demonstrated route to the
    skeletal features.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mesodermal cell differentiation
    term:
      id: GO:0048333
      label: mesodermal cell differentiation
    modifier: DECREASED
  - preferred_term: endodermal cell differentiation
    term:
      id: GO:0035987
      label: endodermal cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:42157059
    reference_title: "NSD1 governs H3K36me2-mediated DNA methylation and drives endo-mesodermal differentiation of human iPSCs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, the loss of functional NSD1 altered the differentiation potential of iPSCs, with aberrant endodermal and mesodermal lineage commitment."
    explanation: Human cell-based evidence for the lineage-commitment defect claimed by this node.
  - reference: PMID:40118455
    reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found Nsd1 to be indispensable for the faithful differentiation of mESCs into three primary germ layers, particularly, meso-endodermal cell lineages related to the development of the heart and the skeletal system."
    explanation: Names the affected lineages and the organs they build, which is what makes this node relevant to the cardiac phenotype.
  downstream:
  - target: Congenital Heart Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A developmental-biology inference: the lineage most impaired in NSD1-null
      stem cells is the one that builds the heart, and congenital heart defects
      are common in Sotos syndrome. No study has traced a specific cardiac
      malformation in an affected person back to this differentiation defect.
    evidence:
    - reference: PMID:40118455
      reference_title: "The sotos syndrome gene Nsd1 safeguards developmental gene enhancers poised for transcription by maintaining the precise deposition of histone methylation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Time-course transcriptomic profiling following the mESC differentiation revealed that Nsd1 not only facilitates the basal expression but also permits the differentiation-accompanied rapid induction of a suite of meso-endoderm lineage-specifying transcription factor genes such as T and Gata4."
      explanation: >-
        Gata4 is a core cardiac lineage transcription factor, so failed induction
        of this suite is the specific reason the cardiac edge is drawn - but it is
        a cell-culture result, hence INDIRECT.

- name: Reduced NSD1 Tumor-Suppressor Function
  description: >-
    NSD1 behaves as a tumour suppressor in at least some lineages. In sporadic
    neuroblastoma and glioma cells NSD1 is silenced by CpG-island promoter
    hypermethylation; the silenced cells lose H3K36 and H4K20 methylation, and
    restoring NSD1 expression suppresses colony formation and growth. The same
    histone-methylation phenotype is seen in Sotos patients with germline NSD1
    disruption, which is the observation that links the somatic tumour biology to
    the germline syndrome. This node is included because Sotos syndrome carries an
    increased tumour risk, but the connection is a lineage inference: the tumour
    work is in sporadic cancers with somatic silencing, not in Sotos-derived
    tissue, and no study establishes the transformation mechanism in a germline
    heterozygote.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20018718
    reference_title: "Epigenetic inactivation of the Sotos overgrowth syndrome gene histone methyltransferase NSD1 in human neuroblastoma and glioma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also demonstrate that the epigenetic inactivation of NSD1 in transformed cells leads to the specifically diminished methylation of the histone lysine residues H4-K20 and H3-K36. The described phenotype is also observed in Sotos syndrome patients with NSD1 genetic disruption."
    explanation: >-
      Establishes both the chromatin consequence in tumour cells and the explicit
      statement that Sotos patients share it - the bridge this node depends on.
  - reference: PMID:20018718
    reference_title: "Epigenetic inactivation of the Sotos overgrowth syndrome gene histone methyltransferase NSD1 in human neuroblastoma and glioma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we show that the restoration of NSD1 expression induces tumor suppressor-like features, such as reduced colony formation density and inhibition of cellular growth."
    explanation: Functional demonstration that NSD1 acts as a growth suppressor in these lineages.
  downstream:
  - target: Neoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn deliberately as an indirect edge. The tumour-suppressor evidence is
      from somatically silenced sporadic tumours; the human Sotos tumour risk is
      an epidemiological observation. The intervening steps in a germline
      heterozygote are unknown.
    evidence:
    - reference: PMID:17825104
      reference_title: "Sotos syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The syndrome may also be associated with an increased risk of tumors."
      explanation: >-
        Records the tumour-risk association from a clinical review. Graded INDIRECT
        because it establishes the association at the level of the syndrome, not
        the mechanism by which reduced NSD1 dosage produces it.

phenotypes:
- category: Craniofacial
  name: Distinctive Facial Appearance
  description: >-
    The facial gestalt is one of the three cardinal features and is often what
    prompts testing. It combines a broad prominent forehead with a dolichocephalic
    head shape, sparse frontotemporal hair, downslanting palpebral fissures, malar
    flushing, and a long narrow face with a tall chin. In adults the chin becomes
    tall, square and prominent, and the overall gestalt shifts with age rather
    than disappearing.
  phenotype_term:
    preferred_term: Broad, prominent forehead with dolichocephalic head shape
    term:
      id: HP:0000337
      label: Broad forehead
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome is characterized by a distinctive facial appearance (broad, prominent forehead with a dolichocephalic head shape, sparse frontotemporal hair, downslanting palpebral fissures, malar flushing, long and narrow face, tall chin)"
    explanation: The GeneReviews definition of the facial gestalt, component by component.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial dysmorphism, learning disability, and childhood overgrowth were present in 90% of the individuals."
    explanation: >-
      Supports the VERY_FREQUENT band with a cohort figure for the cardinal triad
      taken together.
  - reference: PMID:31479583
    reference_title: "The phenotype of Sotos syndrome in adulthood: A review of 44 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a distinctive facial appearance in adults with a tall, square, prominent chin."
    explanation: Establishes that the gestalt persists into adulthood in a recognisable, altered form.

- category: Craniofacial
  name: Sparse Frontotemporal Hair
  description: >-
    Thinning of the scalp hair over the frontal and temporal regions, contributing
    to the impression of a broad high forehead. HPO has no term for the
    frontotemporal distribution specifically, so the binding is to the more general
    sparse-scalp-hair term and the regional detail is carried in `preferred_term`.
  phenotype_term:
    preferred_term: Sparse frontotemporal scalp hair
    term:
      id: HP:0002209
      label: Sparse scalp hair
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sparse frontotemporal hair, downslanting palpebral fissures"
    explanation: >-
      GeneReviews lists this among the components of the cardinal facial
      appearance; the full sentence is quoted on the facial-gestalt phenotype above.

- category: Craniofacial
  name: Downslanting Palpebral Fissures
  phenotype_term:
    preferred_term: Downslanting palpebral fissures
    term:
      id: HP:0000494
      label: Downslanted palpebral fissures
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "downslanting palpebral fissures, malar flushing, long and narrow face, tall chin"
    explanation: GeneReviews lists downslanting palpebral fissures as a component of the cardinal facial appearance.

- category: Growth
  name: Childhood Overgrowth
  description: >-
    Height and/or head circumference at or above 2 SD from the mean, most marked in
    early and mid childhood. Overgrowth is a cardinal feature but is explicitly not
    obligatory - in the largest curated cohort 10% of NSD1-positive individuals had
    both height and head circumference within the normal range, so a normal growth
    chart does not exclude the diagnosis. Growth-chart data from a Korean cohort
    show the excess resolving with age (height above controls to about age 12 in
    males and 17 in females) and predicted adult height not differing from target
    height, so this is childhood overgrowth rather than lifelong gigantism.
  phenotype_term:
    preferred_term: Tall stature
    term:
      id: HP:0000098
      label: Tall stature
  frequency: VERY_FREQUENT
  diagnostic: true
  subtypes:
  - Intragenic NSD1 Variant
  - 5q35 Microdeletion
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and overgrowth (height and/or head circumference ≥2 SD above the mean). These three clinical features (distinctive facial features, learning disability, and overgrowth) are considered the cardinal features of Sotos syndrome."
    explanation: Defines overgrowth quantitatively and establishes it as cardinal.
  - reference: PMID:15942875
    reference_title: "Genotype-phenotype associations in Sotos syndrome: an analysis of 266 individuals with NSD1 aberrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, both the height and head circumference of 10% of the individuals were within the normal range, indicating that overgrowth is not obligatory for the diagnosis of Sotos syndrome."
    explanation: >-
      Bounds the claim: a cardinal feature that is nonetheless absent in a tenth of
      molecularly confirmed cases.
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Males with SS demonstrated higher height before the age of 12.0, greater weight before 10.0, and larger head circumference before 15.5 compared to age- and sex-matched controls."
    explanation: Supports the age-limited course of the overgrowth described here.
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted and target adult heights were not significantly different between groups."
    explanation: Supports the statement that childhood overgrowth does not translate into abnormal adult height.

- category: Growth
  name: Macrocephaly
  description: >-
    Head circumference at or above 2 SD, one of the two axes by which overgrowth is
    defined in Sotos syndrome and often more persistent than the height excess.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sotos syndrome is an overgrowth condition characterized by cardinal features including excessive growth during childhood, macrocephaly, distinctive facial gestalt and various degrees of learning difficulty, and associated with variable minor features."
    explanation: Names macrocephaly among the cardinal features in a clinical review.
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Females with SS displayed higher height before 17.0, greater weight before 10.5, and larger head circumference before 12.0 compared to controls."
    explanation: Anthropometric confirmation of increased head circumference against matched controls.

- category: Skeletal
  name: Advanced Bone Age
  description: >-
    Skeletal maturation ahead of chronological age, listed by GeneReviews among the
    major features and one of the findings that prompts diagnostic suspicion after
    birth. Reported frequencies vary widely with when the radiograph is taken: a
    longitudinal Korean cohort found bone age advanced in only 40% of males and 8%
    of females at their last visit, while clinical reviews describe it as a typical
    early finding. The frequency band here follows the measured cohort rather than
    the narrative reviews, and the discrepancy is itself informative - this is not
    a stable lifelong feature.
  phenotype_term:
    preferred_term: Advanced bone age
    term:
      id: HP:0005616
      label: Accelerated skeletal maturation
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major features of Sotos syndrome include behavioral findings (most notably autism spectrum disorder), advanced bone age, cardiac anomalies, cranial MRI/CT abnormalities, joint hyperlaxity with or without pes planus, maternal preeclampsia, neonatal complications, renal anomalies, scoliosis, and seizures."
    explanation: GeneReviews lists advanced bone age among the major features.
  - reference: PMID:39494594
    reference_title: "Deciphering Growth Patterns in Korean Children With Sotos Syndrome Through the Development of a Disease-Specific Growth Chart."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone age was advanced compared to chronological age in 40% of males and 8% of females at their last visit."
    explanation: >-
      The quantitative basis for the OCCASIONAL band; the sex difference and the
      timing qualifier are the reason a higher band would misstate the finding.
  - reference: PMID:17825104
    reference_title: "Sotos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is usually suspected after birth because of excessive height and occipitofrontal circumference (OFC), advanced bone age, neonatal complications including hypotonia and feeding difficulties, and facial gestalt."
    explanation: Supports the diagnostic role of advanced bone age as an early finding.

- category: Neurologic
  name: Intellectual Disability and Developmental Delay
  description: >-
    Learning disability is the second cardinal feature, spanning early
    developmental delay through mild to severe intellectual impairment. The
    functional range in adults is very wide, from fully independent to fully
    dependent. Neuropsychological profiling shows relative weakness in language and
    visuospatial ability with relative strength in memory for faces, and
    mathematics is a near-universal area of difficulty.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: VERY_FREQUENT
  diagnostic: true
  subtypes:
  - 5q35 Microdeletion
  evidence:
  - reference: PMID:20301652
    reference_title: "Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "learning disability (early developmental delay, mild-to-severe intellectual impairment)"
    explanation: The GeneReviews definition of the learning-disability component of the cardinal triad.
  - reference: PMID:42618064
    reference_title: "Sotos and Malan Syndromes in Childhood: Molecular and Clinical Findings From a Nationwide Cohort of 48 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All exhibited characteristic facial features, and 97.9% had developmental delay or intellectual disability."
    explanation: >-
      A recent multicentre cohort figure supporting the VERY_FREQUENT band. Note
      that the cohort includes six Malan syndrome patients alongside 42 with Sotos
      syndrome.
  - reference: PMID:31479583
    reference_title: "The phenotype of Sotos syndrome in adulthood: A review of 44 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have shown that adults with Sotos syndrome display a wide spectrum of intellectual ability with functioning ranging from fully independent to fully dependent."
    explanation: Establishes the severity range in adults, which is what the description claims.
  - reference: PMID:40375465
    reference_title: "A Further Characterisation of the Neuropsychological Profile, Social Perception, and Academic Skills in Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neuropsychological profile was characterised by lowest scores in both language and visuospatial abilities and highest scores in memory for faces."
    explanation: Supports the described profile of relative weaknesses and strengths.
  - reference: PMID:40375465
    reference_title: "A Further Characterisation of the Neuropsychological Profile, Social Perception, and Academic Skills in Sotos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

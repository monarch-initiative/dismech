name: Sotos Syndrome
synonyms:
- Sotos syndrome 1
- SOTOS1
- cerebral gigantism
- NSD1-related Sotos syndrome
- chromosome 5q35 deletion syndrome
creation_date: "2026-09-05T18:00:00Z"
category: Mendelian
description: >-
  Sotos syndrome (MONDO:0019349; OMIM 117550) is an autosomal dominant
  overgrowth-intellectual disability syndrome caused by haploinsufficiency of
  NSD1, the nuclear receptor binding SET domain protein 1 at 5q35. NSD1 is the
  principal writer of histone H3 lysine 36 dimethylation (H3K36me2), a mark
  deposited predominantly across intergenic euchromatin. Three features are
  treated as cardinal: a distinctive facial appearance (broad prominent forehead
  with dolichocephaly, sparse frontotemporal hair, downslanting palpebral
  fissures, malar flushing, long narrow face and a tall chin), learning
  disability ranging from early developmental delay to severe intellectual
  impairment, and childhood overgrowth of height and/or head circumference. A
  broad set of associated features occurs: advanced bone age, autism spectrum
  behaviours, seizures, scoliosis, joint hyperlaxity, congenital cardiac
  anomalies, renal anomalies, cranial imaging abnormalities and neonatal
  complications. Two molecular classes account for essentially all cases -
  intragenic NSD1 loss-of-function variants and a recurrent 5q35 microdeletion
  encompassing NSD1 that arises by non-allelic homologous recombination between
  flanking low-copy repeats. The deletion class is much commoner in Japanese and
  Korean cohorts than in European ones and is associated with more severe
  learning disability, less prominent overgrowth and more progressive scoliosis;
  this is a within-disease genotype axis, curated here as `has_subtypes`, not two
  diseases. NSD1 loss produces a highly specific genome-wide DNA-methylation
  episignature in peripheral blood that is now used diagnostically, including to
  reclassify NSD1 variants of uncertain significance and to separate Sotos
  syndrome from the clinically overlapping Weaver syndrome. The NFIX-related
  "Sotos syndrome 2" phenotype is a separate MONDO concept curated in dismech as
  Malan_Syndrome and is cross-referenced here as a differential diagnosis rather
  than absorbed into this entry.

      id: HP:0000668
      label: Hypodontia
  evidence:
  - reference: PMID:19876911
    reference_title: Premolar hypodontia is a common feature in Sotos syndrome with a mutation in the NSD1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We investigated the dental manifestations of this disorder and found one or several premolar teeth were absent in 9 out of 13 (69%) affected children and adolescents. A heterozygous mutation in the NSD1 gene was identified in 12 patients, including all patients with hypodontia.

- category: Neoplastic
  name: Neoplasia
  description: >-
    Sotos syndrome carries an increased tumour risk, though it is not high enough to
    have produced a consensus surveillance protocol, and the tumour spectrum is
    broad rather than dominated by one histology. A recent 31-patient cohort added

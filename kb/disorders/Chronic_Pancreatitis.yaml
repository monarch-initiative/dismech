name: Chronic Pancreatitis
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Chronic pancreatitis is a progressive fibroinflammatory disease of the pancreas in
  which recurrent acinar cell injury drives irreversible parenchymal destruction and
  fibrosis. Persistent injury activates pancreatic stellate cells to deposit collagen,
  replacing functional tissue and producing the hallmark loss of exocrine and
  endocrine function. Clinically it manifests as chronic abdominal pain, steatorrhea
  and weight loss from exocrine insufficiency, and diabetes mellitus from progressive
  islet destruction; major causes include chronic alcohol use, smoking, and genetic
  predisposition.
category: Complex
parents:
- Gastrointestinal Disease
disease_term:
  preferred_term: chronic pancreatitis
  term:
    id: MONDO:0005003
    label: chronic pancreatitis
pathophysiology:
- name: Recurrent Acinar Cell Injury
  conforms_to: "pancreatitis_acinar_autodigestion#Acinar Cell Autodigestion and Necrosis"
  description: >
    Repeated episodes of pancreatic inflammation cause progressive
    acinar cell damage. Alcohol, smoking, and genetic factors are
    major causes. Premature trypsin activation injures cells.
  cell_types:
  - preferred_term: Pancreatic Acinar Cell
    term:
      id: CL:0002064
      label: pancreatic acinar cell
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:39534420
    reference_title: "Trypsin in pancreatitis: The culprit, a mediator, or epiphenomenon?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pancreatitis is believed to be initiated by injured acinar cells (the main
      exocrine pancreas cell type), leading to parenchymal necrosis and local and
      systemic inflammation.
    explanation: >-
      Establishes injured acinar cells as the initiating lesion driving parenchymal
      necrosis and inflammation, matching the conformance target
      pancreatitis_acinar_autodigestion#Acinar Cell Autodigestion and Necrosis.
      Evidence source is OTHER because the paper is a review.
  - reference: PMID:19322914
    reference_title: "Acute pancreatitis: etiology and common pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Enzyme activation within the pancreas leads to auto-digestion of the gland
      and local inflammation.
    explanation: >-
      Supports premature intrapancreatic enzyme activation as the mechanism of
      acinar autodigestion asserted in this node. Evidence source is OTHER
      because this is a review article.
- name: Pancreatic Fibrosis
  description: >
    Activated pancreatic stellate cells produce excessive collagen,
    leading to progressive fibrosis. Fibrosis replaces functional
    parenchyma and causes ductal strictures.
  cell_types:
  - preferred_term: Pancreatic Stellate Cell
    term:
      id: CL:0002410
      label: pancreatic stellate cell
  biological_processes:
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:15753610
    reference_title: "Mechanisms of pancreatic fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pancreatic fibrosis, a characteristic histopathological feature of chronic
      pancreatitis, is no longer considered an epiphenomenon of chronic injury,
      but an active process that may be reversible in the early stages.
    explanation: >-
      Establishes fibrosis as an active pathological process in chronic
      pancreatitis specifically, rather than an incidental consequence of injury.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:15753610
    reference_title: "Mechanisms of pancreatic fibrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulating evidence from both in vivo studies (using human pancreatic
      sections and experimental models of pancreatic fibrosis) and in vitro
      studies (using cultured pancreatic stellate cells) indicates a key role for
      activated PSCs in the fibrotic process.
    explanation: >-
      Directly attributes chronic-pancreatitis fibrogenesis to activated
      pancreatic stellate cells, the cell type asserted by this node.
- name: Exocrine Insufficiency
  description: >
    Loss of acinar cell mass leads to insufficient digestive enzyme
    production. Steatorrhea and malabsorption occur when >90% of
    exocrine function is lost.
  biological_processes:
  - preferred_term: Digestive System Process
    term:
      id: GO:0022600
      label: digestive system process
    modifier: DECREASED
  evidence:
  - reference: PMID:30074926
    reference_title: "Exocrine Pancreatic Insufficiency and Malnutrition in Chronic Pancreatitis: Identification, Treatment, and Consequences."
    supports: SUPPORT
    snippet: "Exocrine pancreatic insufficiency was diagnosed in 84.6% (77/91) of
      patients based on symptoms of bloating, steatorrhea, or weight loss."
    explanation: High prevalence of exocrine pancreatic insufficiency (84.6%) in
      chronic pancreatitis patients, manifesting as bloating, steatorrhea, or
      weight loss.
  - reference: PMID:30074926
    reference_title: "Exocrine Pancreatic Insufficiency and Malnutrition in Chronic Pancreatitis: Identification, Treatment, and Consequences."
    supports: SUPPORT
    snippet: "There is a high prevalence of fat-soluble vitamin deficiencies, osteopathy,
      and malnutrition in CP patients, which is underestimated due to a lack of effective
      diagnosis and suboptimal therapies for EPI."
    explanation: EPI is accompanied by a high prevalence of fat-soluble vitamin
      deficiencies, osteopathy, and malnutrition.
  downstream:
  - target: Steatorrhea
    causal_link_type: DIRECT
    description: Exocrine pancreatic insufficiency causes fat malabsorption, manifesting
      as steatorrhea.
    evidence:
    - reference: PMID:30074926
      reference_title: "Exocrine Pancreatic Insufficiency and Malnutrition in Chronic Pancreatitis: Identification, Treatment, and Consequences."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exocrine pancreatic insufficiency was diagnosed in 84.6% (77/91) of
        patients based on symptoms of bloating, steatorrhea, or weight loss."
      explanation: The cohort diagnosed exocrine pancreatic insufficiency in chronic
        pancreatitis patients based in part on steatorrhea.
  - target: Weight Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Exocrine pancreatic insufficiency causes maldigestion and malnutrition.
    description: Exocrine pancreatic insufficiency and malnutrition contribute to
      weight loss.
    evidence:
    - reference: PMID:30074926
      reference_title: "Exocrine Pancreatic Insufficiency and Malnutrition in Chronic Pancreatitis: Identification, Treatment, and Consequences."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exocrine pancreatic insufficiency was diagnosed in 84.6% (77/91) of
        patients based on symptoms of bloating, steatorrhea, or weight loss."
      explanation: The cohort diagnosed exocrine pancreatic insufficiency in chronic
        pancreatitis patients based in part on weight loss.
- name: Endocrine Insufficiency
  description: >
    Progressive loss of islet cells leads to diabetes mellitus
    (type 3c). Often occurs later in disease course.
  cell_types:
  - preferred_term: Pancreatic Beta Cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:28404095
    reference_title: "Type 3c (pancreatogenic) diabetes mellitus secondary to chronic pancreatitis and pancreatic cancer."
    supports: SUPPORT
    snippet: "The most commonly identified causes of type 3c diabetes are chronic
      pancreatitis, pancreatic ductal adenocarcinoma, haemochromatosis, cystic fibrosis,
      and previous pancreatic surgery."
    explanation: Chronic pancreatitis is the leading cause of type 3c diabetes,
      confirming that endocrine insufficiency develops as a consequence of
      pancreatic damage.
  downstream:
  - target: Diabetes Mellitus
    causal_link_type: DIRECT
    description: Chronic pancreatitis-associated endocrine pancreatic damage manifests
      as pancreatogenic diabetes mellitus.
    evidence:
    - reference: PMID:28404095
      reference_title: "Type 3c (pancreatogenic) diabetes mellitus secondary to chronic pancreatitis and pancreatic cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetes can also develop as a direct consequence of other diseases,
        including diseases of the exocrine pancreas."
      explanation: The review directly supports diabetes as a consequence of exocrine
        pancreatic disease, including chronic pancreatitis.

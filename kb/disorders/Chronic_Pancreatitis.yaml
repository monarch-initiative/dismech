- accession: massive:MSV000082883
  title: Chronic pancreatitis vs pancreatic cancer LC-MS
  description: Age-standardized incidence rates for pancreatic cancer (PC) in men have increased by 25% from 1957 to 2011 in Finland. The average age of diagnosis for PC is 69 years in Nordic males, whereas the average age of diagnosis of chronic pancreatitis (CP) is 40-50 years, but the cases overlap in age. By radiology the evaluation of a pancreatic mass, i.e. the differential diagnosis between CP and PC is often difficult. Preoperative needle biopsies are difficult to obtain and are demanding to interpret. New blood based biomarkers are needed.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Chronic Pancreatitis"). Retrieved 2026-08-02.
- accession: massive:MSV000090255
  title: Profiling of Kallikrein Proteases and Global Proteome Biology of PDAC, Chronic Pancreatitis and Normal Pancreas
  description: Cell conditioned medium from human pancreatic cancer cell lines MiaPaCa-2, AsPC-1, primary pancreatic cell lines as well as human FFPE tissue samples from pancreatic ductal adenocarcinoma (PDAC), chronic pancreatitis (CP), ampullary cancer, non-malignant adjacent pancreas and normal pancreas were analyzed via targeted (SRM, PRM) and/or explorative (DIA) mass spectrometry.

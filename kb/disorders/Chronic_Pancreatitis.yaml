  title: 'Gene Expression Analysis of CD4 T Cells in Autoimmune Pancreatitis: Treatment-Correlated Expression Profiles'
  description: 'Introduction: Autoimmune pancreatitis (AIP) is a rare inflammatory disease characterized by elevated serum IgG4, pancreatic fibrosis, and immune cell infiltration. Prednisolone (PSL) effectively induces remission; however, high relapse rates after treatment cessation highlight the need for reliable biomarkers to predict long-term outcomes. While T cells, particularly regulatory T cells (Tregs) and Th2 cells, are implicated in AIP pathogenesis, comprehensive immune profiling has been limited. Methods: Peripheral blood CD4+ T cells were isolated from AIP patients in the active phase (aAIP, n = 8), remission phase (tAIP, n = 14), and healthy controls (HC, n = 23).'

pathophysiology:
- name: Heterozygous SNRPE Variant
  description: >-
    A heterozygous germline SNRPE variant alters SmE, a core Sm protein of the
    spliceosomal U snRNPs. The start-codon variant c.1A>G and the Sm-motif
    missense variant p.Gly45Ser are the variants with functional data. Evidence
    is from human genetics (linkage, segregation, de novo occurrence).
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"

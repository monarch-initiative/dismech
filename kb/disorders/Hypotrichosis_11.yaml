    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two mutations identified here appear to affect the solubility of SNRPE and therefore may be pathogenic because they reduce the soluble fraction that can be incorporated into U snRNPs."
    explanation: States the proposed molecular consequence of both variants.
  - reference: PMID:23246290
    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, in the case of p.Gly45Ser, the reduction in the incorporation efficiency is more substantial"
    explanation: The missense variant is incorporated into U snRNPs less efficiently in transfected cells.
  - reference: PMID:23246290
    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "only full-length protein is produced and incorporated into the Sm core with almost equal efficiency to the wild-type"
    explanation: >-
      In patient lymphocytes carrying c.1A>G, Sm core incorporation was near
      normal, so reduced incorporation is not demonstrated in patient cells.
  downstream:
  - target: Impaired Hair Follicle Hair Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Hair Follicle Hair Production
  description: >-
    Hair follicles produce too little or no hair, most consistently at the
    eyebrows and eyelashes, while skin, nails, teeth and sweating are spared.
    SmE is present in the nuclei of all hair follicle, epidermal and dermal cells
    of human scalp, so the restriction is not explained by expression. Whether
    the follicle defect is a subtle splicing change, reduced SmE dosage, or a
    U7 snRNP (histone mRNA 3' end processing) defect has not been tested in
    hair follicle cells. Evidence is human clinical phenotype plus human scalp
    immunohistochemistry.
  role: effector
  biological_scale: TISSUE

notes: >-
  Scope. MONDO:0014027 is the isolated hair phenotype. Two further SNRPE reports
  describe different phenotypes and are not curated under this term: a de novo
  missense variant (c.65T>C, p.Phe22Ser) in a patient with nonsyndromic primary
  microcephaly and intellectual disability (PMID:31671093), and a de novo intronic
  deletion causing exon skipping in a patient with microcephaly, congenital
  atrichia and multiple congenital anomalies, which the authors proposed naming
  SNRPE-related syndromic microcephaly and hypotrichosis (PMID:36814386). An OLS
  search of MONDO for "SNRPE microcephaly" returned no term for either. A 2021 letter reporting additional SNRPE
  variants in hypotrichosis simplex (PMID:33792916) has no abstract in PubMed and
  is not cited.

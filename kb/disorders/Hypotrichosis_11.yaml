name: Hypotrichosis 11
creation_date: "2026-10-28T05:45:00Z"
category: Mendelian
description: >-
  Hypotrichosis 11 (HYPT11) is an autosomal dominant form of hypotrichosis
  simplex, a nonsyndromic isolated hair loss, caused by heterozygous variants in
  SNRPE. SNRPE encodes SmE, one of the seven Sm proteins that form the ring-shaped
  core of the spliceosomal U snRNPs. In the founding report, affected members of a
  Spanish family, and simplex cases from the UK and Tunisia, had scanty or absent
  eyebrows and eyelashes and a degree of scalp and body hair loss present from
  birth that varied widely within the family, from slight thinning to complete
  loss of scalp and body hair, with skin, nails, teeth and sweating normal. The
  start-codon variant c.1A>G (p.Met1?) segregated in the family and arose de novo
  in the UK case; the Tunisian case carried the Sm-motif missense variant
  c.133G>A (p.Gly45Ser). In transfected cells both variants reduced the soluble,
  snRNP-incorporable fraction of SmE, but splicing of minigene reporters and in
  patient lymphocytes appeared normal. How a defect in a ubiquitous core splicing
  protein produces a hair-restricted phenotype is unknown.

    explanation: The trigger is a heterozygous germline variant in this spliceosome component.
  downstream:
  - target: Reduced Soluble SmE for U snRNP Incorporation
    causal_link_type: DIRECT
- name: Reduced Soluble SmE for U snRNP Incorporation
  description: >-
    In transfected HEK293T cells both disease variants lowered the amount of
    soluble SmE: c.1A>G gave full-length protein from the GTG codon at lower
    levels plus a mostly insoluble N-terminally truncated form, and p.Gly45Ser
    was incorporated into the Sm core less efficiently. The authors proposed
    that the variants act by reducing the soluble fraction available to U snRNPs.
    In lymphocytes from a c.1A>G carrier, full-length SmE was incorporated into
    the Sm core with near-normal efficiency, so the reduction has not been shown
    in patient cells. Evidence is in vitro (HEK293T overexpression, patient
    lymphoblastoid cells).
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: spliceosomal snRNP assembly
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
    modifier: DECREASED
  evidence:

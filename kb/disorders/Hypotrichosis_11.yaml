discussions:
- discussion_id: snrpe_hair_restriction
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Hair Follicle Hair Production
  - pathophysiology#Reduced Soluble SmE for U snRNP Incorporation
  prompt: >-
    Why does a heterozygous variant in SmE, a core protein of every spliceosomal
    U snRNP and of the U7 snRNP, affect only hair, and does it change splicing in
    the hair follicle?
  rationale: >-
    SmE is expressed in all scalp cell types, yet the disease spares skin, nails,
    teeth and sweating. Minigene reporters and patient lymphocytes showed no major
    splicing abnormality, so the mis-splicing step that the spliceosomopathy
    module places downstream of the variant has not been observed for this
    disease, and the authors also raised a U7 snRNP (histone mRNA processing)
    contribution. A dominant Snrpe mouse mutant has no obvious hair phenotype, so
    no animal model exists. Other SNRPE variants cause microcephaly, which shows
    that different alleles reach different tissues. Transcriptome profiling of
    patient hair follicle cells, which the founding report proposed, has not been
    reported.
  evidence:
  - reference: PMID:23246290
    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When analyzing these model substrates, no major splicing abnormalities were observed"
    explanation: No splicing defect was detected in the systems tested.
  - reference: PMID:23246290
    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we cannot exclude the possibility that SNRPE mutations cause subtle changes in the splicing pattern of the target organ"
    explanation: The authors leave a hair-follicle-specific splicing change open.
  - reference: PMID:23246290
    reference_title: "Mutations in SNRPE, which encodes a core protein of the spliceosome, cause autosomal-dominant hypotrichosis simplex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "these mice show no obvious skin or hair phenotype"
    explanation: The dominant Snrpe mouse mutant does not model the hair phenotype.
  - reference: PMID:31671093
    reference_title: "A missense mutation in SNRPE linked to non-syndromal microcephaly interferes with U snRNP assembly and pre-mRNA splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identify the EMX2 mRNA, which encodes a protein required for proper brain development, as a major mis-spliced down stream target."
    explanation: >-
      A different SNRPE allele, linked to microcephaly rather than hair loss,
      produces a defined mis-splicing target, a contrast with the hair disease.

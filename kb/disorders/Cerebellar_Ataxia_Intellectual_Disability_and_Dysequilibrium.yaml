    snippet: Cerebellar ataxia, mental retardation, and disequilibrium syndrome (CAMRQ)-related disorders are rare, nonprogressive, autosomal recessive conditions
    explanation: The paper summarizes recessive inheritance in its background; its blanket nonprogressive wording does not describe every CA8-related case.
    quote_role: BACKGROUND

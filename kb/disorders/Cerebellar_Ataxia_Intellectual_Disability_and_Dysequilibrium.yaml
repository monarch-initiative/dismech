    reference_title: Carbonic anhydrase-related protein is a novel binding protein for inositol 1,4,5-trisphosphate receptor type 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CARP inhibits IP(3) binding to IP(3)R1 by reducing the affinity of the receptor for IP(3).
    explanation: Biochemical ligand-binding experiments establish a regulatory function, not carbonic anhydrase catalytic activity.
  - reference: PMID:12611586

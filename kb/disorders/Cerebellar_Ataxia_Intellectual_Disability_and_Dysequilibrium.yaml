    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There has been no formal study of life span in this disorder, but experience from the Hutterite population suggests that life span is not significantly reduced.
    explanation: Separates limited observational experience from a formal survival estimate.
- phase: Variable progressive ataxia
  subtype: CAMRQ3
  notes: CA8-related clinical ataxia is frequently progressive, but improvement was also recorded. The retrospective series reported progression in 10 of 15 patients with course information and improvement in five; this is not a prospective natural-history prediction.
  evidence:
  - reference: url:https://scientiasalut.gencat.cat/bitstream/handle/11351/11654/clinical_molecular_spectrum_autosomal_recessive_ca8_related_cerebellar_ataxia_2024.pdf?sequence=1
    reference_title: https://scientiasalut.gencat.cat/bitstream/handle/11351/11654/clinical_molecular_spectrum_autosomal_recessive_ca8_related_cerebellar_ataxia_2024.pdf?sequence=1
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In terms of disease progression, ataxia was progressive in 10/15 patients and improved in 5/15 patients.
    explanation: Denominators are limited to patients with course information.
- phase: Early motor impairment with later sensory manifestations
  subtype: CAMRQ4
  notes: Early motor impairment can appear nonprogressive and resemble dyskinetic cerebral palsy, whereas optic or auditory abnormalities may become more evident over time.
  evidence:
  - reference: PMID:35321980
    reference_title: Two Siblings with Cerebellar Ataxia, Mental Retardation, and Disequilibrium Syndrome 4 and a Novel Variant of ATP8A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The symptoms did not progress in the early period of development, which makes it difficult to distinguish from dyskinetic cerebral palsy, particularly in solitary cases.
    explanation: A stable early motor presentation does not establish lifelong absence of progression.
  - reference: PMID:30012219
    reference_title: Recessive mutations in ATP8A2 cause severe hypotonia, cognitive impairment, hyperkinetic movement disorders and progressive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Optic atrophy is common and may only become apparent in the first few years of life, necessitating repeat ophthalmologic evaluation in older children.
    explanation: Supports later detection of visual involvement.
animal_models:
- name: Brain-specific Wdr81 conditional knockout mouse
  species: Mus musculus
  genotype: Wdr81 floxed exons 2-4; Nestin-Cre
  description: Brain-specific Wdr81 deletion causes p62-positive aggregates in cortical neurons; surviving adults also have striatal aggregates. Most animals die around birth. The study did not observe gross brain developmental abnormalities comparable to human CAMRQ2.
  evidence:
  - &id002
    reference: PMID:28404643
    reference_title: The BEACH-containing protein WDR81 coordinates p62 and LC3C to promote aggrephagy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, p62 foci strongly accumulated in the cortex of both dead and surviving WDR81f/f cKO mice at postnatal day 0 (P0)
    explanation: The conditional deletion model accumulates an aggregate-associated autophagy substrate.
  - reference: PMID:28404643
    reference_title: The BEACH-containing protein WDR81 coordinates p62 and LC3C to promote aggrephagy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Intriguingly, no obvious brain abnormalities were observed in WDR81f/f cKO mice, unlike the defective development of the corpus callosum, third ventricle, fourth ventricle, and cerebellum in human CAMRQ2 patients carrying a WDR81 mutation
    explanation: The model does not recapitulate the gross human developmental phenotype.
  modeled_mechanisms:
  - target: Impaired selective aggregate clearance (CAMRQ2)
    relationship: PARTIALLY_RECAPITULATES
    description: Neuronal substrate accumulation supports impaired clearance.
    evidence:
    - *id002
    limitations: The null model is not a CAMRQ2 missense knock-in. Gross developmental malformations are absent, and the mouse LC3C-like protein was not molecularly identified.
- name: Wdr81 nur5 mouse
  species: Mus musculus
  genotype: Homozygous Wdr81 p.Leu1349Pro
  description: The ENU-derived nur5 allele produces progressive patterned Purkinje cell loss and early photoreceptor degeneration. Wild-type Wdr81 transgene expression rescues the phenotype. Aberrant mitochondria precede Purkinje cell loss, but the study does not establish whether this is caused by impaired aggrephagy or endosomal maturation.
  evidence:
  - reference: PMID:23595742
    reference_title: WDR81 is necessary for purkinje and photoreceptor cell survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Adult mice from the N-ethyl-N-nitrosourea-induced mutant mouse line nur5 display tremor and an abnormal gait, as well as Purkinje cell degeneration and photoreceptor cell loss.
    explanation: The ENU allele reproduces motor and regional neuronal degeneration phenotypes.
  - reference: PMID:23595742
    reference_title: WDR81 is necessary for purkinje and photoreceptor cell survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Moreover, homozygous nur5 mice that carry a wild-type Wdr81 transgene are rescued from the abnormal phenotype, indicating that Wdr81 is the causative gene in nur5.
    explanation: Transgenic rescue establishes the causal mouse locus.
  - reference: PMID:23595742
    reference_title: WDR81 is necessary for purkinje and photoreceptor cell survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Electron microscopy analysis revealed that a subset of mitochondria in Purkinje cell dendrites of the mutant animals displayed an aberrant, large spheroid-like structure.
    explanation: Ultrastructural findings support a model-specific mitochondrial abnormality without proving a human mitochondrial disease mechanism.
  notes: The mouse L1349P allele differs from human P856L. No modeled-mechanism link to aggrephagy or endosome maturation is asserted because those processes were not tested in this model.
- name: ca8 F0 crispant zebrafish
  species: Danio rerio
  genotype: F0 CRISPR/Cas9 ca8 knockout targeting the first two exons
  description: The ca8 F0 model has early brain-patterning and ventricular abnormalities with reduced spontaneous coiling and touch-evoked motor responses. Gross morphology is largely preserved and motor-neuron axons appear normal. It is not a patient-variant model and does not establish adult progressive atrophy or Purkinje-cell-autonomous calcium dysregulation.
  evidence:
  - reference: PMID:38581205
    reference_title: Clinical and Molecular Spectrum of Autosomal Recessive CA8-Related Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Zebrafish models demonstrated impaired early neurodevelopment and motor behavior on ca8 knockout.
    explanation: Whole-embryo F0 CRISPR perturbation supports developmental and motor consequences of ca8 loss.
  notes: Whole-embryo early developmental readouts do not measure the ITPR1-binding mechanism or the adult regional atrophy node directly.
experimental_models:
- name: WDR81-knockout endosomal trafficking cells
  experimental_model_type: CELL_LINE
  cell_source: HeLa knockout cells and HEK293 interaction assays
  description: WDR81/WDR91 deletion and Beclin1 perturbation test endosomal PtdIns3P, endosome size and EGFR degradation.
  evidence:
  - &id003
    reference: PMID:26783301
    reference_title: Negative regulation of phosphatidylinositol 3-phosphate levels in early-to-late endosome conversion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In mammalian cells, inactivation of WDR91 and WDR81, the homologs of SORF-1 and SORF-2, induces Beclin1-dependent enlargement of PtdIns3P-enriched endosomes and defective degradation of epidermal growth factor receptor.
    explanation: The knockout system supports an endosomal cargo-transport defect.
  modeled_mechanisms:
  - target: Impaired endosome maturation (CAMRQ2)
    relationship: RECAPITULATES
    description: Measures the cellular endosomal defect defined in this mechanism.
    evidence:
    - *id003
    limitations: Cultured-cell knockout does not establish the effect of human P856L or cerebellar malformation.
- name: WDR81 selective aggrephagy cell models
  experimental_model_type: CELL_LINE
  cell_source: HeLa and SH-SY5Y cells with WDR81 loss; HEK293 interaction assays
  description: WDR81 loss, p62 and LC3C interactions, and LIR-mutant rescue distinguish selective aggregate clearance from general autophagy.
  evidence:
  - &id004
    reference: PMID:28404643
    reference_title: The BEACH-containing protein WDR81 coordinates p62 and LC3C to promote aggrephagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings collectively suggest that WDR81 coordinates p62-dependent recognition of Ub proteins with LC3C-mediated assembly of autophagosomes, thereby facilitating Ub protein clearance through autophagy.
    explanation: Knockout, binding and rescue experiments support a selective aggregate-clearance function.
  modeled_mechanisms:
  - target: Impaired selective aggregate clearance (CAMRQ2)
    relationship: RECAPITULATES
    description: Demonstrates the selective cellular clearance function.
    evidence:
    - *id004
    limitations: Engineered loss or LIR mutations are not direct functional assays of the CAMRQ2 P856L allele.
- name: VLDLR p.P565Q trafficking assay
  experimental_model_type: CELL_LINE
  cell_source: Transfected HeLa, HEK293T and HRD1-knockout HEK293 cells
  description: Imaging, Endo H susceptibility and HRD1 knockout assess surface delivery, maturation and degradation of the variant receptor.
  evidence:
  - &id005
    reference: PMID:42051465
    reference_title: 'Identification of a Novel VLDLR Variant in the First Report of CAMRQ1 From Africa: Expanding the Spectrum of Cerebellar Ataxia Syndromes.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, only the immature band was observed for p.(P565Q), confirming its retention in the ER
    explanation: The transfected variant fails to acquire mature glycosylation.
  modeled_mechanisms:
  - target: Impaired VLDLR surface delivery (CAMRQ1)
    relationship: RECAPITULATES
    description: Models the variant-specific trafficking defect.
    evidence:
    - *id005
    limitations: Overexpression experiments do not directly measure Reelin signaling or neuroblast migration.
- name: ATP8A2 expression and ATPase assays
  experimental_model_type: CELL_LINE
  cell_source: HEK293T and HeLa cells cotransfected with ATP8A2 variants and CDC50A
  description: Protein abundance and localization are evaluated separately from PS-activated ATPase activity. R1147W has reduced abundance with retained specific activity; E459Q behaves similarly to wild type.
  evidence:
  - &id006
    reference: PMID:38436085
    reference_title: Functional and in silico analysis of ATP8A2 and other P4-ATPase variants associated with human genetic diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The activities of the G447R and A772P variants were not determined owing to their low expression.
    explanation: Expression limitations constrain interpretation of the activity experiments.
  - reference: PMID:38436085
    reference_title: Functional and in silico analysis of ATP8A2 and other P4-ATPase variants associated with human genetic diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The R1147W variant was present at about 50% of WT ATP8A2 levels
    explanation: Quantifies reduced abundance rather than a measured reduction in specific catalytic activity.
  modeled_mechanisms:
  - target: Impaired Phospholipid Translocation in Neuronal Membranes (CAMRQ4)
    relationship: MEASURES
    description: Separately assesses expression, localization and catalytic readouts.
    evidence:
    - *id006
    limitations: Very low expression prevented intrinsic activity measurement for G447R and A772P. Assay results alone are not a clinical severity predictor.
- name: Patient-derived ATP8A2 foregut endoderm
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Patient fibroblasts reprogrammed to iPSCs and differentiated toward foregut endoderm
  description: Cells from one patient with ATP8A2 splice and intragenic deletion variants show reduced ATP8A2 RNA and protein. Endoderm was used because fibroblasts had little detectable ATP8A2; these are not patient-derived neurons.
  evidence:
  - &id007
    reference: PMID:30012219
    reference_title: Recessive mutations in ATP8A2 cause severe hypotonia, cognitive impairment, hyperkinetic movement disorders and progressive optic atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ATP8A2 mRNA expression was significantly lower in the patient compared to control cells and there was diminished ATP8A2 protein in the patient cells, confirming the deleterious effect of the mutations
    explanation: Patient-derived endoderm cells show reduced RNA and protein abundance.
  - reference: PMID:30012219
    reference_title: Recessive mutations in ATP8A2 cause severe hypotonia, cognitive impairment, hyperkinetic movement disorders and progressive optic atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that early endoderm derivatives expressed high levels of ATP8A2 and allowed analyses of RNA expression and ATP8A2 protein expression.
    explanation: Defines the tissue lineage of the experimental system.
  modeled_mechanisms:
  - target: Impaired Phospholipid Translocation in Neuronal Membranes (CAMRQ4)
    relationship: MEASURES
    description: Measures a reduction in ATP8A2 abundance in patient-derived cells.
    evidence:
    - *id007
    limitations: One patient-derived non-neuronal lineage; no direct lipid-flipping, neuronal or clinical severity readout.

- name: CAMRQ4
  display_name: CAMRQ Type 4 (ATP8A2)
  description: CAMRQ4 is caused by biallelic pathogenic variants in ATP8A2, encoding a P4-type phosphatidylserine flippase. Reported presentations range from severe developmental impairment with hypotonia, hyperkinetic movements and optic atrophy to cerebellar ataxia without encephalopathy. A consistent clinical severity relationship with residual ATPase activity has not been established.

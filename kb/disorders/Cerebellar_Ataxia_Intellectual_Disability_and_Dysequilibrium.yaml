- name: Impaired endosome maturation (CAMRQ2)
  subtypes:
  - CAMRQ2
  description: WDR81 and WDR91 form a complex that restrains Beclin1-associated endosomal PI3K activity. WDR81 knockout in human cultured cells increases endosomal PtdIns3P, enlarges early endosomes and impairs lysosomal EGFR degradation. These experiments establish a cellular function of WDR81; they do not directly establish the effect of the CAMRQ2 p.P856L allele or the intervening steps leading to human cerebellar malformation.

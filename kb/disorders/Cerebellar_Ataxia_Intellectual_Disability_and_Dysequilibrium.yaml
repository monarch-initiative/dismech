- name: CAMRQ3
  display_name: CAMRQ Type 3 (CA8)
  description: 'CAMRQ3 is caused by biallelic variants in CA8, encoding carbonic anhydrase 8, an enzymatically inactive isoform highly expressed in cerebellar Purkinje cells that modulates IP3-receptor calcium signaling. Recent series have refined the phenotype: progressive cerebellar atrophy (especially superior vermis) and variable pyramidal signs distinguish CA8-related disease from other CAMRQ subtypes. A reported p.Asn84Ser case had severe ataxia with normal serial brain MRI, so cerebellar atrophy is not obligatory.'
  subtype_term:
    preferred_term: cerebellar ataxia, intellectual disability, and dysequilibrium syndrome 3
    term:
      id: MONDO:0013188
      label: cerebellar ataxia, intellectual disability, and dysequilibrium syndrome 3

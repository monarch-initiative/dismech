    term:
      id: NCIT:C85857
      label: Evoked Response Audiometry
  description: In ATP8A2-related disease with suspected sensory impairment, audiological assessment and auditory brainstem responses help characterize hearing involvement. Abnormal responses are supportive findings, not a substitute for molecular diagnosis.
  evidence:
  - reference: PMID:35321980
    reference_title: Two Siblings with Cerebellar Ataxia, Mental Retardation, and Disequilibrium Syndrome 4 and a Novel Variant of ATP8A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Flattening of the auditory brainstem responses and areflexia developed. ... However, visual and hearing impairments associated with involuntary movements and severe developmental delay may be a clue to suspect CAMRQ4.
    explanation: The sibling report documents evolving auditory pathway abnormalities.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: WDR91 and WDR81 interact with Beclin1 and inhibit PI3K complex activity.
    explanation: Coimmunoprecipitation and kinase assays support negative regulation of the endosomal PI3K complex.
- name: Impaired selective aggregate clearance (CAMRQ2)
  subtypes:
  - CAMRQ2
  description: WDR81 coordinates p62-dependent recognition of ubiquitinated protein aggregates with recruitment of LC3C through its LC3-interacting regions. WDR81 loss impairs this selective aggrephagy function in cultured cells. This function is separable from the WDR91-dependent endosomal role and does not imply failure of general autophagy. Brain-specific Wdr81 knockout causes neuronal p62 accumulation in mice but does not reproduce the gross developmental brain abnormalities of human CAMRQ2; a patient-variant-specific aggrephagy defect remains unestablished.

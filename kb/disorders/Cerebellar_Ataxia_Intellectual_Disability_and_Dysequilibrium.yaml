  evidence:
  - reference: PMID:42051465
    reference_title: 'Identification of a Novel VLDLR Variant in the First Report of CAMRQ1 From Africa: Expanding the Spectrum of Cerebellar Ataxia Syndromes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: primarily characterized by cerebellar ataxia, hypotonia, intellectual disability, delayed ambulation
    explanation: Supports cerebellar ataxia as a cardinal feature of CAMRQ-related disorders.
  - reference: PMID:38581205
    reference_title: Clinical and Molecular Spectrum of Autosomal Recessive CA8-Related Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients exhibited varying degrees of neurodevelopmental disorders (NDD), along with predominantly progressive cerebellar ataxia and pyramidal signs and variable bradykinesia, dystonia, and sensory impairment.
    explanation: The combined CA8 cohort included 27 individuals from 14 families; the clinical ataxia was predominantly progressive, so a non-progressive course cannot be generalized across CAMRQ subtypes.
- name: Intellectual Disability
  category: Neurological
  description: Intellectual disability is common and ranges in severity, but normal intelligence has been documented in some CA8-related cases. Its absence does not exclude the broader genetically defined CAMRQ spectrum. A WDR81 case with age-appropriate speech and grade-level academic work with tutoring further illustrates milder development, although this is not a formal IQ measurement.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:42051465
    reference_title: 'Identification of a Novel VLDLR Variant in the First Report of CAMRQ1 From Africa: Expanding the Spectrum of Cerebellar Ataxia Syndromes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: primarily characterized by cerebellar ataxia, hypotonia, intellectual disability, delayed ambulation
    explanation: Supports intellectual disability as a common feature of CAMRQ-related disorders.

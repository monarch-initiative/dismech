- name: Dysregulated Purkinje Cell Calcium Signaling (CAMRQ3)
  description: CA8 encodes an enzymatically inactive carbonic-anhydrase-related protein, also called CARP, enriched in cerebellar Purkinje cells. Biochemical experiments show that CARP binds the modulatory region of ITPR1 and reduces its affinity for IP3. Loss of this regulation is a proposed link between CA8 dysfunction and disturbed calcium signaling. Human imaging and whole-embryo zebrafish knockout experiments do not by themselves establish Purkinje-cell-autonomous pathology or the functional effect of each human missense allele.
  subtypes:
  - CAMRQ3
  cell_types:

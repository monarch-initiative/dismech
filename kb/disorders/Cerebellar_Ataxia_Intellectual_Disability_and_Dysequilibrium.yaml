    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using deletion mutagenesis, we established that amino acids 45-291 of CARP are essential for its association with IP(3)R1, and that the CARP-binding site is located within the modulatory domain of IP(3)R1 amino acids 1387-1647.

diagnosis:
- name: Molecular diagnosis
  description: The phenotype and imaging guide testing, but the genetic subtype requires molecular confirmation. For VLDLR-related disease, biallelic pathogenic or likely pathogenic variants establish the diagnosis; biallelic VUS, or a pathogenic variant with a VUS, are insufficient. Panels or exome/genome testing can address overlap among genetic ataxias. Reanalysis of initially nondiagnostic exome data can be useful, as illustrated by a WDR81 case diagnosed after re-evaluation at age five.
  evidence:
  - reference: PMID:20301729
    reference_title: VLDLR Cerebellar Hypoplasia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The diagnosis of VLDLR cerebellar hypoplasia is established in a proband with suggestive clinical and brain MRI findings by identification of biallelic pathogenic variants in VLDLR on molecular genetic testing.
    explanation: Establishes molecular diagnostic criteria for the VLDLR subtype.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1874/
    reference_title: VLDLR Cerebellar Hypoplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Identification of ... biallelic ... variants of ... uncertain significance ... does not establish or rule out the diagnosis.
    explanation: GeneReviews explicitly states that biallelic VUS, or a pathogenic variant paired with a VUS, do not establish or exclude VLDLR-related disease.
  - reference: PMID:40013199
    reference_title: 'Cerebellar Ataxia, Impaired Intellectual Development, and Disequilibrium Syndrome-2: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Re-analysis of the data from the previous whole exome trio resulted in a homozygous pathogenic variant in WDR81.
    explanation: A case-specific example of successful reanalysis, not a universal diagnostic yield.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Deletion and duplication analysis
  description: VLDLR testing must account for intragenic and whole-gene deletions as well as sequence variants. GeneReviews recommends deletion/duplication analysis when sequencing is unrevealing. The Hutterite founder whole-gene deletion is a population-specific reason to consider targeted analysis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1874/
    reference_title: VLDLR Cerebellar Hypoplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Depending on the sequencing method used, single- ... exon ... multiexon, or whole-gene deletions/duplications may not be detected.
    explanation: Sequence-only methods can miss structural variants.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1874/
    reference_title: VLDLR Cerebellar Hypoplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If no variant is detected by the sequencing method used, the next step is to perform gene-targeted ... deletion/duplication analysis ... to detect exon and whole-gene deletions or duplications.
    explanation: Specifies complementary testing for VLDLR-related disease.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Brain MRI and differential diagnosis
  description: VLDLR-related disease typically shows inferior cerebellar hypoplasia, simplified cortical gyration and a small pons. Developmental hypoplasia and acquired atrophy can be difficult to distinguish on early imaging, so imaging course and the molecular findings must be considered together. The pattern is not universal across CAMRQ subtypes. Normal brain MRI does not exclude ATP8A2-related disease. A CA8-related case also had normal serial structural MRI; the reported FDG-PET abnormalities are a case observation, not a validated routine diagnostic biomarker.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1874/
    reference_title: VLDLR Cerebellar Hypoplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Because cerebellar hypoplasia can be difficult to distinguish from cerebellar atrophy on early imaging, conditions characterized by the latter should also be considered
    explanation: Early imaging alone may not distinguish developmental hypoplasia from progressive atrophy.
  - reference: PMID:30012219
    reference_title: Recessive mutations in ATP8A2 cause severe hypotonia, cognitive impairment, hyperkinetic movement disorders and progressive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MRI of the brain was normal in 50% of the patients.
    explanation: Substantial clinical impairment can occur with normal MRI.
  - reference: PMID:32808436
    reference_title: Novel homozygous variant of carbonic anhydrase 8 gene expanding the phenotype of cerebellar ataxia, mental retardation, and disequilibrium syndrome subtype 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Strikingly, three consecutive MRIs did not show any sign of cerebellar abnormalities
    explanation: A CA8 case with p.Asn84Ser had severe clinical ataxia despite normal serial structural imaging; atrophy is not obligatory in every reported case.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
- name: Ophthalmological assessment
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: Assess ocular alignment and visual function. In ATP8A2-related disease, repeat examinations can identify optic atrophy emerging after an initially normal examination.
  evidence:
  - reference: PMID:30012219
    reference_title: Recessive mutations in ATP8A2 cause severe hypotonia, cognitive impairment, hyperkinetic movement disorders and progressive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Optic atrophy is common and may only become apparent in the first few years of life, necessitating repeat ophthalmologic evaluation in older children.
    explanation: Supports repeat assessment in the ATP8A2 subtype.
- name: Audiological assessment
  diagnosis_term:

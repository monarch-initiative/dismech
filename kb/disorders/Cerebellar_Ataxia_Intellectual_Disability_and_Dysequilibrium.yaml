    snippet: Japanese siblings presented with athetotic movements at 1 and 2 months of age. ... Whole exome sequencing revealed compound heterozygous variants of ATP8A2
    explanation: Compound heterozygosity in the Japanese siblings complements the homozygous variants reported in consanguineous families.
has_subtypes:
- name: CAMRQ1
  display_name: CAMRQ Type 1 (VLDLR)
  description: CAMRQ1 (OMIM 224050) is caused by biallelic loss-of-function variants in VLDLR (very-low-density lipoprotein receptor), a co-receptor in the Reelin signaling pathway that guides neuronal migration during cerebellar and cortical development. First described in a Hutterite kindred with a homozygous deletion of the entire VLDLR gene. A much milder presentation has also been reported with homozygous p.C419Y; the proposed relationship to domain location has not been established as a general genotype-phenotype rule.
  subtype_term:
    preferred_term: cerebellar ataxia, intellectual disability, and dysequilibrium syndrome 1
    term:
      id: MONDO:0024542
      label: cerebellar ataxia, intellectual disability, and dysequilibrium syndrome 1

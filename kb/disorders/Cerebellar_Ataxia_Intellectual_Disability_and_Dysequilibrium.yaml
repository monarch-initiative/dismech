- name: Impaired Phospholipid Translocation in Neuronal Membranes (CAMRQ4)
  description: 'ATP8A2 is a P4 ATPase that translocates phosphatidylserine from the exoplasmic to the cytosolic membrane leaflet. Disease-associated variants can impair protein folding and abundance or intrinsic phospholipid-activated ATPase activity. These mechanisms require separate assessment: some catalytically inactive variants retain normal abundance, whereas R1147W has reduced abundance with preserved specific ATPase activity. Functional results alone do not establish a monotonic relationship between residual activity and clinical severity.'
  subtypes:
  - CAMRQ4
  biological_processes:
  - preferred_term: phospholipid translocation
    term:
      id: GO:0045332
      label: phospholipid translocation
    modifier: DECREASED
  evidence:
  - reference: PMID:31612321
    reference_title: ATP8A2-related disorders as recessive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Expression and functional studies of the missense mutations demonstrated that protein levels of four of the five missense variants were very low and lacked phosphatidylserine-activated ATPase activity.
    explanation: Four tested variants had very low abundance and lacked PS-activated ATPase activity; this result is not generalized to all missense variants.
  - reference: PMID:38436085
    reference_title: Functional and in silico analysis of ATP8A2 and other P4-ATPase variants associated with human genetic diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The activities of the G447R and A772P variants were not determined owing to their low expression.
    explanation: Low expression prevented measurement of intrinsic activity for these two variants; absent protein is not an activity measurement.
  - reference: PMID:38436085
    reference_title: Functional and in silico analysis of ATP8A2 and other P4-ATPase variants associated with human genetic diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: However, functional studies indicate that both variants are devoid of ATPase activity, in line with the key role of K429 within the conserved Asp-Lys-Thr-Gly-Thr (DKTGT) motif required for transient phosphorylation as part of the reaction cycle.
    explanation: 'The discussion contrasts previously characterized K429N and K429M: different protein abundance but loss of catalytic activity for both.'
    quote_role: REVIEW_SYNTHESIS
  genes:
  - preferred_term: ATP8A2
    term:
      id: hgnc:13533
      label: ATP8A2
  molecular_functions:
  - preferred_term: phosphatidylserine flippase activity
    term:
      id: GO:0140346
      label: phosphatidylserine flippase activity
    modifier: DECREASED
phenotypes:
- name: Cerebellar Ataxia
  category: Neurological
  description: Cerebellar ataxia is a major motor manifestation across the CAMRQ spectrum. VLDLR-related ataxia is characteristically congenital and non-progressive; CA8-related disease frequently has progressive clinical ataxia as well as progressive cerebellar atrophy.
  phenotype_term:
    preferred_term: Ataxia

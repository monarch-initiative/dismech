- name: CAMRQ2
  display_name: CAMRQ Type 2 (WDR81)
  description: CAMRQ2 (OMIM 610185) is caused by biallelic variants in WDR81, encoding a BEACH/WD40-repeat protein implicated in endolysosomal trafficking and selective autophagy. Patients show congenital cerebellar ataxia, intellectual disability and, in some, quadrupedal gait. A nonconsanguineous family report documents milder disease with bipedal gait and age-appropriate speech despite the same P856L variant found in the original severely affected kindred.
  subtype_term:

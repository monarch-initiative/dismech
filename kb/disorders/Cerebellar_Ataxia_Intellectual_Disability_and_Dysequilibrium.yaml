genetic:
- name: VLDLR mutations (CAMRQ1)
  association: Causative
  relationship_type: CAUSATIVE
  notes: Biallelic loss-of-function variants in VLDLR (very-low-density lipoprotein receptor) cause CAMRQ1. The originally described Hutterite kindred carried a 199-kb homozygous deletion encompassing the entire VLDLR gene. Missense variants that retain mutant VLDLR protein in the endoplasmic reticulum (impairing plasma-membrane trafficking and Reelin signaling) have subsequently been reported worldwide. In a later frameshift family report, nine affected individuals were homozygous and one was heterozygous with possible prior polio; the latter individual is not evidence for dominant VLDLR cerebellar disease.
  gene_term:
    preferred_term: VLDLR
    term:
      id: hgnc:12698
      label: VLDLR
  subtype: CAMRQ1
  evidence:
  - reference: PMID:16080122
    reference_title: Homozygous deletion of the very low density lipoprotein receptor gene causes autosomal recessive cerebellar hypoplasia with cerebral gyral simplification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 199-kb homozygous deletion encompassing the entire very low density lipoprotein receptor (VLDLR) gene was present in all affected individuals.
    explanation: Identifies VLDLR loss as the cause of CAMRQ1 in the original Hutterite cohort.
  - reference: PMID:33981800
    reference_title: Broadening the Clinical Spectrum of Very Low Density Lipoprotein Receptor Associated Dysequilibrium Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genotype–phenotype correlation in case III‐7 remains controversial.
    explanation: The authors explicitly qualify the heterozygous individual, whose gait was also potentially confounded by a history suggestive of polio.
- name: WDR81 mutations (CAMRQ2)
  association: Causative
  relationship_type: CAUSATIVE
  notes: Biallelic variants in WDR81, encoding a BEACH-domain WD40-repeat protein, cause CAMRQ2. WDR81 is implicated in endolysosomal trafficking and selective autophagy. The gene was originally mapped in a consanguineous Turkish family with quadrupedal locomotion and cerebro-cerebellar hypoplasia. The same P856L allele was reported in a later, more mildly affected child from a reportedly nonconsanguineous family. This case does not establish a causal benefit of early therapy or environmental modifiers.
  gene_term:
    preferred_term: WDR81
    term:
      id: hgnc:26600
      label: WDR81
  subtype: CAMRQ2
  evidence:
  - reference: PMID:21885617
    reference_title: Homozygosity mapping and targeted genomic sequencing reveal the gene responsible for cerebellar hypoplasia and quadrupedal locomotion in a consanguineous kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Targeted sequencing of the entire homozygous region in three affected individuals and two obligate carriers uncovered a private missense mutation, WDR81 p.P856L, which cosegregated with the condition in the extended family.
    explanation: The human family study establishes genotype-phenotype segregation.
  - reference: PMID:40013199
    reference_title: 'Cerebellar Ataxia, Impaired Intellectual Development, and Disequilibrium Syndrome-2: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Interestingly, she has the same variant in the WDR81 gene (P856L) as in the Turkish family studied
    explanation: Demonstrates variable clinical severity associated with the same reported allele.
  - reference: url:https://genome.cshlp.org/content/21/12/1995.full
    reference_title: Homozygosity mapping and targeted genomic sequencing reveal the gene responsible for cerebellar hypoplasia and quadrupedal locomotion in a consanguineous kindred | Genome Research
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: None of the 172 unaffected individuals in the kindred is homozygous for WDR81 p.P856L.
    explanation: 'Full text of PMID:21885617: extended-kindred segregation supports the recessive association without establishing a cellular effect of the allele.'
- name: CA8 mutations (CAMRQ3)
  association: Causative
  relationship_type: CAUSATIVE
  notes: Biallelic variants in CA8 (carbonic anhydrase 8), an enzymatically inactive isoform enriched in cerebellar Purkinje cells that modulates IP3-receptor calcium signaling, cause CAMRQ3. The CA8-related phenotype is distinguished by progressive selective cerebellar atrophy (predominantly superior vermis) and frequent pyramidal signs. Reported variant classes include missense, nonsense and splice-site variants. Splicing consequences in the 2024 series were predicted rather than experimentally established for each allele.
  gene_term:
    preferred_term: CA8
    term:
      id: hgnc:1382
      label: CA8
  subtype: CAMRQ3
  evidence:
  - reference: PMID:38581205
    reference_title: Clinical and Molecular Spectrum of Autosomal Recessive CA8-Related Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: biallelic CA8 variants have currently been associated with a recessive neurological disorder named, cerebellar ataxia, mental retardation, and dysequilibrium syndrome 3 (CAMRQ-3).
    explanation: Confirms biallelic CA8 variants as causative for CAMRQ3.
  - reference: url:https://scientiasalut.gencat.cat/bitstream/handle/11351/11654/clinical_molecular_spectrum_autosomal_recessive_ca8_related_cerebellar_ataxia_2024.pdf?sequence=1
    reference_title: https://scientiasalut.gencat.cat/bitstream/handle/11351/11654/clinical_molecular_spectrum_autosomal_recessive_ca8_related_cerebellar_ataxia_2024.pdf?sequence=1
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The observed variants included two missense: ... two nonsense ... and three splicing'
    explanation: The CA8 series includes missense, nonsense and splice-site variants; functional effects of individual splice variants were predicted.
- name: ATP8A2 mutations (CAMRQ4)
  association: Causative
  relationship_type: CAUSATIVE
  notes: 'Biallelic pathogenic ATP8A2 variants cause CAMRQ4. Reported variant classes include missense and splice variants. Expression, localization and ATPase assays have different interpretations: preserved activity was reported for p.Ile215Leu, and p.Gly585Val was associated with milder ataxia without encephalopathy despite belonging to a series in which four of five tested missense proteins had very low levels and lacked activity. Normal assay results require cautious variant interpretation rather than a blanket assignment of loss of function. A later patient blood RNA study confirmed exon 18 skipping for c.1580-3C>G, which the authors classified as likely pathogenic. Protein abundance assays for p.Leu538Pro show near-complete loss of expression, including in siblings able to walk with support; this further cautions against a simple severity gradient.'
  gene_term:
    preferred_term: ATP8A2
    term:
      id: hgnc:13533
      label: ATP8A2
  subtype: CAMRQ4
  evidence:
  - reference: PMID:31612321
    reference_title: ATP8A2-related disorders as recessive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified six point mutations (one splice site and five missense mutations) involving ATP8A2 in six individuals from five families.
    explanation: Confirms ATP8A2 variants as causative for CAMRQ4 in a multi-family cohort.
  - reference: PMID:31612321
    reference_title: ATP8A2-related disorders as recessive cerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: One variant p.Ile215Leu, however, expressed at normal levels and displayed phospholipid-activated ATPase activity similar to the non-mutated protein.
    explanation: Not every reported missense variant has demonstrated functional loss.
  - reference: PMID:40312603
    reference_title: 'Expanding the spectrum of ATP8A2 mutations: a new splicing variant and systematic review of CAMRQ4 syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Experimental validation revealed skipping of exon 18, confirming a significant impact on splicing and supporting the reclassification of the variant as "likely pathogenic" based on ACMG criteria (PM2, PP3, and now PS3).
    explanation: Patient blood RNA confirmed an exon-skipping effect of c.1580-3C>G; the classification is attributed to the authors.
  - reference: PMID:39066872
    reference_title: A novel missense variant in the ATPase domain of ATP8A2 and review of phenotypic variability of ATP8A2-related disorders caused by missense changes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our in vitro studies supported this prediction, as the p.Leu538Pro variant resulted in a severe reduction in protein expression
    explanation: Transfected-cell immunoblots establish reduced abundance, not a direct catalytic activity measurement.

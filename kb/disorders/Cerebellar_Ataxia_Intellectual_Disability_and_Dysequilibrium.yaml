- name: Impaired VLDLR surface delivery (CAMRQ1)
  subtypes:
  - CAMRQ1
  description: Selected VLDLR missense variants impair receptor maturation and trafficking. In transfected HeLa and HEK293T cells, p.P565Q is retained in the endoplasmic reticulum and fails to acquire the mature glycosylation pattern. Accumulation in HRD1-deficient cells implicates ER-associated degradation. Reduced downstream Reelin signaling is inferred from the loss of surface receptor; the study did not directly measure neuronal migration or Reelin responses.

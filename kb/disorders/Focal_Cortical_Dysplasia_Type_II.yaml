name: Focal Cortical Dysplasia Type II
creation_date: "2026-08-04T00:00:00Z"
category: Complex
description: >-
  Focal cortical dysplasia type II, historically Taylor-type cortical dysplasia,
  is a localized malformation of cortical development and the most common cause
  of neocortical epilepsy in children. It is a mosaic mTORopathy: a somatic
  gain-of-function variant in an mTOR pathway activator, or a two-hit loss of
  function in one of the GATOR1 or TSC repressors, arises in a progenitor cell
  during corticogenesis and produces a clonal patch of cortex with constitutive
  mTORC1 signalling. That patch contains cytomegalic dysmorphic neurons and, in
  subtype IIb, balloon cells, and it is intrinsically epileptogenic. The
  resulting focal epilepsy is characteristically drug-resistant, and complete
  resection of the dysplastic tissue is the treatment that most reliably
  produces seizure freedom.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - FCD type II
  - cortical dysplasia, Taylor type
  - focal cortical dysplasia of Taylor
  - FCD IIa
  - FCD IIb
disease_term:
  preferred_term: isolated focal cortical dysplasia type II
  term:
    id: MONDO:0011818
    label: isolated focal cortical dysplasia type II
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0011818
        label: isolated focal cortical dysplasia type II
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0011818 is the isolated focal cortical dysplasia type II concept,
        a child of MONDO:0019009 isolated focal cortical dysplasia.
references:
  - reference: PMID:28135561
    title: >-
      Focal Cortical Dysplasia: Gene Mutations, Cell Signaling, and Therapeutic
      Implications.
  - reference: PMID:31444548
    title: >-
      Dissecting the genetic basis of focal cortical dysplasia: a large cohort
      study.
  - reference: PMID:35706131
    title: >-
      The ILAE consensus classification of focal cortical dysplasia: An update
      proposed by an ad hoc task force of the ILAE diagnostic methods
      commission.
notes: >-
  Scope note. This entry covers FCD type II (both IIa and IIb) as a single
  genetically coherent entity, because the large surgical cohort work shows the
  IIa/IIb split is a histological distinction within one mTORopathy rather than
  two genetic diseases. FCD type I and mild malformations of cortical
  development are deliberately excluded: the same cohort work found they are not
  caused by mTOR-pathway-hyperactivating variants and are instead enriched for
  SLC35A2 glycosylation defects, so lumping them here would assert a shared
  mechanism the evidence contradicts. Hemimegalencephaly shares the mTOR
  mechanism modelled here but differs in scale and is not covered.
has_subtypes:
  - name: FCD IIa
    display_name: FCD type IIa (dysmorphic neurons without balloon cells)
    description: >-
      Cortical dyslamination with cytomegalic dysmorphic neurons but no balloon
      cells. Shares the mTOR pathway genetics of IIb.
  - name: FCD IIb
    display_name: FCD type IIb (dysmorphic neurons with balloon cells)
    description: >-
      Cortical dyslamination with both dysmorphic neurons and balloon cells, the
      large cells with abundant opalescent cytoplasm that may co-express neuronal
      and glial markers. On MRI this subtype more often shows the transmantle
      sign.
pathophysiology:
  - name: Somatic mTOR Pathway Variant in a Cortical Progenitor
    biological_scale: MOLECULAR
    description: >-
      A post-zygotic variant arises in a neural progenitor during corticogenesis,
      either a gain-of-function change in an mTORC1 activator (MTOR itself, or
      AKT3, PIK3CA, RHEB) or loss of function in an mTORC1 repressor (DEPDC5,
      NPRL2, NPRL3 of the GATOR1 complex, or TSC1/TSC2). Because the variant is
      confined to the descendants of that one progenitor, it is present only in
      the affected patch of brain and is typically undetectable in blood.
      Repressor cases frequently require a germline first hit plus a somatic
      second hit in the lesion.
    biological_processes:
      - preferred_term: positive regulation of TOR signaling
        term:
          id: GO:0032008
          label: positive regulation of TOR signaling
        modifier: INCREASED
    downstream:
      - target: Constitutive mTORC1 Signalling in a Clonal Cortical Patch
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Somatic gain-of-function variants in MTOR and its activators (AKT3,
          PIK3CA, RHEB), as well as germline, somatic and two-hit loss-of-function
          variants in its repressors (DEPDC5, TSC1, TSC2) were found exclusively
          in FCD2/HME cases.
        explanation: >-
          Names both arms of the genetic mechanism, activator gain-of-function and
          repressor loss-of-function, and establishes that they are specific to
          FCD type II rather than shared with FCD type I.
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Single-cell microdissection followed by sequencing of enriched pools of
          DNs unveiled a somatic second-hit loss-of-heterozygosity in a DEPDC5
          germline case.
        explanation: >-
          Direct demonstration of the two-hit mechanism in the repressor arm, with
          the second hit localized to the dysmorphic neurons themselves.
  - name: Constitutive mTORC1 Signalling in a Clonal Cortical Patch
    biological_scale: CELLULAR
    description: >-
      Whichever gene is hit, the convergent consequence is unrestrained mTORC1
      activity in the mutant clone, read out histologically as strong
      phospho-S6 ribosomal protein immunostaining. This convergence is why FCD
      type II behaves as one disease despite a heterogeneous gene list, and why
      cases in which no variant is found are still classified as mTORopathies.
    biological_processes:
      - preferred_term: TORC1 signaling
        term:
          id: GO:0038202
          label: TORC1 signaling
        modifier: INCREASED
    downstream:
      - target: Dysmorphic Neuron and Balloon Cell Formation
        causal_link_type: DIRECT
      - target: Disrupted Neuronal Migration and Cortical Lamination
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We show that panel-negative FCD2 cases display strong pS6-immunostaining,
          stressing that all FCD2 are mTORopathies.
        explanation: >-
          Establishes mTORC1 activation as the convergent node, present even when
          sequencing fails to identify the causative variant, which is exactly the
          claim this node makes.
  - name: Dysmorphic Neuron and Balloon Cell Formation
    biological_scale: CELLULAR
    description: >-
      mTORC1 drives cell growth, so mutant cells become cytomegalic. Dysmorphic
      neurons are enlarged, abnormally oriented neurons with aberrant
      neurofilament accumulation. Balloon cells, which define subtype IIb, are
      large cells with opalescent cytoplasm that can co-express neuronal and glial
      progenitor markers. Both cell populations carry the pathogenic variant.
      Whether balloon cells actually generate seizures is contested and is
      recorded as a discussion.
    cell_types:
      - preferred_term: dysmorphic neuron
        term:
          id: CL:0000540
          label: neuron
        modifier: ABNORMAL
      - preferred_term: balloon cell
        term:
          id: CL:0000125
          label: glial cell
        modifier: ABNORMAL
    downstream:
      - target: Intrinsically Epileptogenic Dysplastic Cortex
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          The presence of dysmorphic cells is tightly associated with
          epileptogenicity, but which cell population is the actual seizure
          generator, and by what membrane or synaptic mechanism, is not resolved.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Analysis of microdissected cells demonstrated that DNs and BCs carry the
          pathogenic variants.
        explanation: >-
          Places the causative variant physically inside both the dysmorphic
          neurons and the balloon cells, establishing them as the mutant clone
          rather than bystanders.
      - reference: PMID:39835291
        reference_title: >-
          Iconography of abnormal non-neuronal cells in pediatric focal cortical
          dysplasia type IIb and tuberous sclerosis complex.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          These abnormal cells emerge during early brain development as a result
          of a hyperactive mTOR pathway and may express both neuronal and glial
          markers.
        explanation: >-
          Ties balloon and giant cell formation to the upstream mTOR node and
          records their mixed lineage marker expression.
  - name: Disrupted Neuronal Migration and Cortical Lamination
    biological_scale: TISSUE
    description: >-
      The mTOR pathway governs neuronal growth and migration, so the mutant clone
      fails to laminate normally. The result is loss of the normal six-layer
      cortical architecture with abnormal cellular polarity, the histological
      substrate of the radiological blurring of the grey-white junction.
    biological_processes:
      - preferred_term: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        modifier: ABNORMAL
    downstream:
      - target: Intrinsically Epileptogenic Dysplastic Cortex
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
      - reference: PMID:28135561
        reference_title: >-
          Focal Cortical Dysplasia: Gene Mutations, Cell Signaling, and
          Therapeutic Implications.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          FCDs are characterized by abnormal cortical lamination, cell morphology
          (e.g., cytomegaly), and cellular polarity.
        explanation: >-
          States the lamination, cytomegaly, and polarity abnormalities that this
          node asserts.
      - reference: PMID:28135561
        reference_title: >-
          Focal Cortical Dysplasia: Gene Mutations, Cell Signaling, and
          Therapeutic Implications.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          genes regulating the PI3K/Akt/mTOR pathway-a key pathway in neuronal
          growth and migration
        explanation: >-
          Establishes the mechanistic link from the mTOR pathway to neuronal
          migration, which is the causal content of this node.
  - name: Intrinsically Epileptogenic Dysplastic Cortex
    biological_scale: TISSUE
    description: >-
      The dysplastic patch generates epileptiform activity intrinsically rather
      than merely irritating adjacent normal cortex. Mouse work titrating the
      mosaic burden shows a remarkably low threshold: a few thousand
      mutation-bearing neurons, well under a tenth of a percent of cells, suffice
      to produce spontaneous seizures, and the burden scales with seizure
      frequency and onset.
    downstream:
      - target: Drug-Resistant Focal Epilepsy
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:38916065
        reference_title: >-
          Threshold of somatic mosaicism leading to brain dysfunction with focal
          epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          approximately 8000-9000 neurons expressing the MTOR mutant, extrapolated
          to constitute 0.08%-0.09% of total cells or roughly 0.04% of variant
          allele frequency in the mouse hemicortex, were sufficient to trigger
          epileptic seizures
        explanation: >-
          Quantifies the mosaic threshold for seizure generation, supporting the
          claim that a very small mutant clone is sufficient to make cortex
          epileptogenic.
      - reference: PMID:38916065
        reference_title: >-
          Threshold of somatic mosaicism leading to brain dysfunction with focal
          epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The mutational burden was correlated with seizure frequency and onset
        explanation: >-
          Establishes a dose-response relationship between mutant burden and
          seizure phenotype, which strengthens the causal reading of this node.
  - name: Drug-Resistant Focal Epilepsy
    biological_scale: ORGANISM
    description: >-
      Focal seizures arising from the dysplastic cortex, usually beginning in
      childhood and characteristically failing to respond to antiseizure
      medication. FCD is the leading cause of medically intractable focal
      epilepsy in children.
    evidence:
      - reference: PMID:28135561
        reference_title: >-
          Focal Cortical Dysplasia: Gene Mutations, Cell Signaling, and
          Therapeutic Implications.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Focal cortical dysplasias (FCDs) are malformations of cortical
          development (MCDs) that are highly associated with medication-resistant
          epilepsy and are the most common cause of neocortical epilepsy in
          children.
        explanation: >-
          States both the drug resistance and the epidemiological prominence that
          this terminal node asserts.
phenotypes:
  - name: Drug-Resistant Focal Epilepsy
    category: Neurologic
    description: >-
      Focal-onset seizures arising from the dysplastic cortex, typically with
      childhood onset and refractory to antiseizure medication. Drug resistance
      is close to definitional in surgical series, since these are the patients
      who reach a surgical centre.
    phenotype_term:
      preferred_term: Focal-onset seizure
      term:
        id: HP:0007359
        label: Focal-onset seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:30296740
        reference_title: >-
          Long-term seizure outcome in pediatric patients with focal cortical
          dysplasia undergoing tailored and standard surgical resections.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Focal cortical dysplasia (FCD) is the major cause of focal intractable
          epilepsy in childhood.
        explanation: >-
          Establishes intractable focal epilepsy as the defining clinical
          presentation. VERY_FREQUENT is used because epilepsy is the presenting
          feature in essentially all ascertained cases.
  - name: Focal Cortical Dysplasia Type II on Histopathology and MRI
    category: Neurologic
    description: >-
      The defining structural lesion: cortical dyslamination with cytomegalic
      dysmorphic neurons, with balloon cells in subtype IIb. On MRI it appears as
      cortical thickening, blurring of the grey-white junction, and in IIb often
      a transmantle sign, though a substantial minority of lesions are MRI
      occult.
    phenotype_term:
      preferred_term: Focal cortical dysplasia type II
      term:
        id: HP:0032051
        label: Focal cortical dysplasia type II
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          FCD2 are characterized by neuropathological hallmarks that include
          enlarged dysmorphic neurons (DNs) and balloon cells (BCs).
        explanation: >-
          States the defining neuropathological hallmarks that this phenotype
          records.
  - name: Global Developmental Delay
    category: Neurologic
    description: >-
      Developmental impairment occurs in a subset, driven by the combination of
      the malformation itself, seizure burden, and the extent of cortex involved.
      It is not universal: many patients with a small, well-localized dysplasia
      have normal development before seizure onset.
    phenotype_term:
      preferred_term: Global developmental delay
      term:
        id: HP:0001263
        label: Global developmental delay
    evidence:
      - reference: PMID:36700525
        reference_title: >-
          Ultra-Low Level Somatic Mutations and Structural Variations in Focal
          Cortical Dysplasia Type II.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain somatic mutations in mTOR pathway genes are a major genetic
          etiology of focal cortical dysplasia type II (FCDII).
        explanation: >-
          Marked PARTIAL. This citation anchors the disease identity but does not
          itself quantify developmental delay; no frequency band is asserted for
          this phenotype because the surgical-cohort literature reports
          developmental outcome too heterogeneously to support one.
genetic:
  - name: MTOR
    gene_term:
      preferred_term: MTOR
      term:
        id: hgnc:3942
        label: MTOR
    relationship_type: CAUSATIVE
    variant_origin: SOMATIC
    notes: >-
      Brain-restricted somatic gain-of-function variants in MTOR are the single
      most frequent identified cause of FCD type II. Variant allele fractions in
      resected tissue are often only a few percent or less, so detection requires
      deep sequencing of lesional tissue; blood testing is uninformative.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Somatic gain-of-function variants in MTOR and its activators (AKT3,
          PIK3CA, RHEB)
        explanation: >-
          Identifies MTOR somatic gain-of-function as a cause of FCD type II.
  - name: DEPDC5
    gene_term:
      preferred_term: DEPDC5
      term:
        id: hgnc:18423
        label: DEPDC5
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    notes: >-
      DEPDC5 is part of the GATOR1 complex, which restrains mTORC1. Loss of
      function therefore de-represses the pathway. In FCD type II the typical
      architecture is a germline first hit inherited or de novo, plus a somatic
      second hit confined to the lesion, which explains why carriers can be
      unaffected and why the malformation is focal rather than diffuse. dismech
      also carries a separate DEPDC5-Related_Epilepsy entry covering the broader
      GATOR1 phenotypic spectrum.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          germline, somatic and two-hit loss-of-function variants in its
          repressors (DEPDC5, TSC1, TSC2) were found exclusively in FCD2/HME cases
        explanation: >-
          Establishes the repressor loss-of-function arm, including the two-hit
          architecture, as specific to FCD type II.
  - name: AKT3
    gene_term:
      preferred_term: AKT3
      term:
        id: hgnc:393
        label: AKT3
    relationship_type: CAUSATIVE
    variant_origin: SOMATIC
    notes: >-
      Somatic gain-of-function variants in AKT3, an activator upstream of mTORC1,
      are a less common cause of FCD type II and of the related, larger-scale
      malformation hemimegalencephaly.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Somatic gain-of-function variants in MTOR and its activators (AKT3,
          PIK3CA, RHEB)
        explanation: >-
          Names AKT3 among the mTORC1 activators carrying somatic gain-of-function
          variants in FCD type II.
  - name: PIK3CA
    gene_term:
      preferred_term: PIK3CA
      term:
        id: hgnc:8975
        label: PIK3CA
    relationship_type: CAUSATIVE
    variant_origin: SOMATIC
    notes: >-
      Somatic PIK3CA gain-of-function variants activate the PI3K arm upstream of
      AKT and mTORC1. The same gene, mutated in other lineages, causes the
      PIK3CA-related overgrowth spectrum, illustrating how the tissue in which
      the mosaic variant lands determines the phenotype.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Somatic gain-of-function variants in MTOR and its activators (AKT3,
          PIK3CA, RHEB)
        explanation: >-
          Names PIK3CA among the mTORC1 activators carrying somatic
          gain-of-function variants in FCD type II.
progression:
  - phase: Prenatal origin with postnatal seizure onset
    age_range: Fetal development to childhood
    notes: >-
      The causative variant arises during corticogenesis, so the lesion is
      congenital, but seizures typically declare in childhood. This temporal gap
      between the molecular event and the clinical onset is a defining feature of
      mosaic mTORopathies and is why the disorder is developmental in origin but
      epileptic in presentation.
    evidence:
      - reference: PMID:39835291
        reference_title: >-
          Iconography of abnormal non-neuronal cells in pediatric focal cortical
          dysplasia type IIb and tuberous sclerosis complex.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          These abnormal cells emerge during early brain development as a result
          of a hyperactive mTOR pathway
        explanation: >-
          Places the cellular abnormality in early brain development, supporting
          the prenatal origin of the lesion.
treatments:
  - name: Resective Epilepsy Surgery
    description: >-
      Surgical removal of the dysplastic cortex is the definitive treatment and
      the only intervention that reliably produces seizure freedom. Outcome is
      driven by completeness of resection, which is why the practical difficulty
      is delineating lesion boundaries, particularly in the substantial minority
      of MRI-occult lesions. In a large pediatric FCD surgical cohort complete
      seizure control was achieved in roughly half of patients and was durable
      over years.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: Neurosurgical Procedure
      term:
        id: NCIT:C15656
        label: Neurosurgical Procedure
    target_mechanisms:
      - target: Intrinsically Epileptogenic Dysplastic Cortex
        treatment_effect: INHIBITS
        description: >-
          Surgery does not modulate the mechanism; it physically removes the
          tissue in which the mechanism operates, which is why completeness of
          resection is the dominant outcome predictor.
    evidence:
      - reference: PMID:30296740
        reference_title: >-
          Long-term seizure outcome in pediatric patients with focal cortical
          dysplasia undergoing tailored and standard surgical resections.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Complete seizure control (Engel Ia) was achieved in 56% after two years,
          52% at five years, and 50% at last follow-up
        explanation: >-
          Quantifies surgical outcome in a pediatric FCD cohort and shows it is
          durable rather than transient.
  - name: Everolimus
    description: >-
      An mTORC1 inhibitor, mechanistically the obvious targeted therapy for a
      mosaic mTORopathy. A randomized crossover placebo-controlled trial in FCD
      type 2 did not show overall superiority over placebo, although the small
      number of patients who did become seizure-free carried MTOR variants or had
      no identified variant. Mucositis and skin ulceration were common. The gap
      between the mechanistic rationale and the trial result is recorded as a
      discussion.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: everolimus
          term:
            id: CHEBI:68478
            label: everolimus
    target_mechanisms:
      - target: Constitutive mTORC1 Signalling in a Clonal Cortical Patch
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:39607729
        reference_title: >-
          Efficacy and safety of everolimus for patients with focal cortical
          dysplasia type 2.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There was no significant difference in the primary outcome between
          everolimus and placebo groups (24% vs. 19%, p = 0.66).
        explanation: >-
          The controlled trial did not meet its primary endpoint. Recorded as
          REFUTE so the entry states the negative result plainly rather than
          implying targeted therapy is established.
      - reference: PMID:39607729
        reference_title: >-
          Efficacy and safety of everolimus for patients with focal cortical
          dysplasia type 2.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Three patients with a pathogenic variant in the MTOR gene or no genetic
          abnormalities achieved seizure freedom with everolimus in the last month
          of the core phase, while none of the patients with variants in other
          genes did.
        explanation: >-
          Preserves the genotype-stratified signal that survives the negative
          primary endpoint, which is the substance of the associated discussion.
      - reference: PMID:39607729
        reference_title: >-
          Efficacy and safety of everolimus for patients with focal cortical
          dysplasia type 2.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Adverse events, such as mucositis or skin ulceration, were more common
          with everolimus
        explanation: >-
          Records the toxicity that has to be weighed against the modest and
          unproven benefit.
differential_diagnoses:
  - name: Tuberous Sclerosis Complex
    description: >-
      The closest mechanistic neighbour. Cortical tubers are histologically very
      similar to FCD IIb, and both are mTORopathies with balloon or giant cells.
      The distinction is germline versus mosaic and systemic versus focal.
    distinguishing_features:
      - Germline TSC1 or TSC2 variant present in blood, not confined to brain.
      - Multiple cortical tubers rather than a single dysplastic patch.
      - Systemic features such as skin, renal, cardiac, and retinal lesions.
    evidence:
      - reference: PMID:39835291
        reference_title: >-
          Iconography of abnormal non-neuronal cells in pediatric focal cortical
          dysplasia type IIb and tuberous sclerosis complex.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          commonly found in some malformations of cortical development including
          focal cortical dysplasia type IIb (FCDIIb) and tuberous sclerosis
          complex (TSC)
        explanation: >-
          Documents that the same abnormal cell types occur in both conditions,
          which is precisely why they must be differentiated.
  - name: Focal Cortical Dysplasia Type I
    description: >-
      Shares the name and the clinical presentation of drug-resistant focal
      epilepsy but is a genetically distinct entity, not an mTORopathy. This is
      the differential that most affects curation, because it determines whether
      the mechanism modelled in this entry applies at all.
    distinguishing_features:
      - Abnormal radial or tangential lamination without dysmorphic neurons or balloon cells.
      - Not caused by mTOR-pathway-hyperactivating variants.
      - Enriched for somatic SLC35A2 glycosylation-pathway variants instead.
    evidence:
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          this study indicates that mMCD/FCD1 and FCD2/HME are two distinct
          genetic entities: while all FCD2/HME are mosaic mTORopathies, mMCD/FCD1
          are not caused by mTOR-pathway-hyperactivating variants
        explanation: >-
          States directly that FCD type I and type II are distinct genetic
          entities, justifying their separation rather than a single lumped entry.
discussions:
  - discussion_id: fcd2_balloon_cell_epileptogenicity
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Are balloon cells the seizure generators in FCD type IIb, or are they
      electrically inert passengers whose presence merely marks the mutant clone,
      with the dysmorphic neurons doing the actual epileptogenic work?
    attaches_to:
      - pathophysiology#Dysmorphic Neuron and Balloon Cell Formation
      - pathophysiology#Intrinsically Epileptogenic Dysplastic Cortex
    rationale: >-
      Balloon cells are the histological signature of FCD IIb and were for
      decades assumed to be the culprits of epileptogenic activity, on the
      reasonable grounds that they are the most conspicuously abnormal thing in
      the specimen. Patch-clamp work overturned that: balloon and giant cells in
      pediatric FCD IIb and tuberous sclerosis are unable to generate action
      potentials and lack synaptic inputs. A cell that cannot fire and receives no
      synapses is a poor candidate for a seizure generator. Two facts make this
      more than a technicality. First, FCD IIa has no balloon cells at all yet is
      just as epileptogenic, which on its own argues the balloon cell is not
      necessary. Second, both dysmorphic neurons and balloon cells carry the
      pathogenic variant, so their presence is genuinely informative about where
      the mutant clone is even if they are not what discharges. The unresolved
      question is whether balloon cells contribute indirectly, for example by
      distorting the local extracellular or metabolic environment or by
      supporting a pro-inflammatory milieu, or whether they are epileptogenically
      inert. This entry therefore models the cell-formation node as upstream of
      epileptogenic cortex via an indirect edge with unknown intermediates rather
      than asserting that balloon cells generate seizures.
    proposed_experiments:
      - experiment_id: exp_fcd2_iia_versus_iib_epileptogenicity_matched
        name: Matched comparison of intrinsic epileptogenicity in FCD IIa versus IIb
        description: >-
          Compare intracranial-EEG measures of intrinsic epileptogenicity, such as
          interictal spike rate and high-frequency oscillation density, between
          FCD IIa and FCD IIb lesions matched for lesion volume, location, and
          genotype.
        decision_criterion: >-
          Equivalent epileptogenicity in balloon-cell-free IIa lesions would
          establish that balloon cells are not necessary for seizure generation;
          consistently higher epileptogenicity in IIb would indicate they add
          something.
      - experiment_id: exp_balloon_cell_indirect_contribution
        name: Test for indirect balloon-cell contribution to network excitability
        description: >-
          Combined electrophysiology and spatial transcriptomic or metabolic
          profiling of human FCD IIb tissue, testing whether proximity to balloon
          cells alters the firing behaviour, extracellular potassium handling, or
          inflammatory signature of neighbouring neurons.
        decision_criterion: >-
          A measurable change in neighbouring neuronal excitability as a function
          of balloon-cell proximity would support an indirect contribution;
          absence of any local effect would support epileptogenic inertness.
    evidence:
      - reference: PMID:39835291
        reference_title: >-
          Iconography of abnormal non-neuronal cells in pediatric focal cortical
          dysplasia type IIb and tuberous sclerosis complex.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A paradigm shift occurred when our group demonstrated that BC/GC in
          pediatric cases of FCDIIb and TSC are unable to generate action
          potentials and lack synaptic inputs.
        explanation: >-
          The electrophysiological finding that overturned the original assumption,
          and the core of the current position that balloon cells are not the
          seizure generators.
      - reference: PMID:39835291
        reference_title: >-
          Iconography of abnormal non-neuronal cells in pediatric focal cortical
          dysplasia type IIb and tuberous sclerosis complex.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Once believed to be the culprits of epileptogenic activity, the
          functional properties of balloon/giant cells (BC/GC), commonly found in
          some malformations of cortical development including focal cortical
          dysplasia type IIb (FCDIIb) and tuberous sclerosis complex (TSC), are
          beginning to be unraveled.
        explanation: >-
          Documents the historical position that has been overturned, establishing
          that this is a genuine reversal rather than a settled question.
      - reference: PMID:31444548
        reference_title: >-
          Dissecting the genetic basis of focal cortical dysplasia: a large
          cohort study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Analysis of microdissected cells demonstrated that DNs and BCs carry the
          pathogenic variants.
        explanation: >-
          Supports the residual role of balloon cells as genuine members of the
          mutant clone. PARTIAL because carrying the variant does not establish
          electrical contribution, which is the point at issue.
  - discussion_id: fcd2_mutation_negative_cases
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Roughly 40 percent of FCD type II cases have no identifiable causative
      variant despite deep sequencing. Is that a detection-sensitivity floor, a
      set of variant classes the assays do not look for, or genuinely different
      biology?
    attaches_to:
      - pathophysiology#Somatic mTOR Pathway Variant in a Cortical Progenitor
      - pathophysiology#Constitutive mTORC1 Signalling in a Clonal Cortical Patch
    rationale: >-
      This gap has direct consequences for how the entry should be read. All FCD
      type II lesions, including sequencing-negative ones, show strong phospho-S6
      staining, so the mTORC1 node is present even when the genetic node is not
      demonstrated. Three explanations compete. The first is sensitivity: mouse
      work shows that a variant allele fraction around 0.04 percent is enough to
      cause seizures, which is below what routine bulk deep sequencing of resected
      tissue can resolve, and enriching for phospho-S6-positive cells by
      fluorescence-activated sorting before sequencing recovers variants that bulk
      sequencing missed. The second is variant class: structural variants and
      non-coding regulatory changes are not well covered by targeted gene panels.
      The third, least likely given the uniform phospho-S6 signal, is a
      non-genetic route to mTORC1 activation. The distinction matters clinically
      because a negative panel currently cannot be interpreted as excluding an
      mTORopathy, and because genotype appears to predict response to mTOR
      inhibition.
    proposed_experiments:
      - experiment_id: exp_fcd2_single_cell_wgs_mutation_negative
        name: Single-cell whole-genome sequencing of sequencing-negative FCD II
        description: >-
          Single-cell or phospho-S6-enriched whole-genome sequencing of lesional
          tissue from panel-negative FCD type II cases, with explicit calling of
          structural and non-coding variants rather than coding single-nucleotide
          variants alone.
        decision_criterion: >-
          Recovery of causative variants in most previously negative cases would
          establish the gap as a detection artefact; persistent negativity with
          preserved phospho-S6 staining would point to an unrecognized activation
          route.
      - experiment_id: exp_fcd2_genotype_stratified_pathway_readout
        name: Pathway-level readout as a genotype-independent classifier
        description: >-
          Test whether a quantitative mTORC1 activity readout from lesional tissue,
          such as phospho-S6 level or a downstream transcriptional signature,
          predicts clinical features and mTOR-inhibitor response as well as or
          better than genotype.
        decision_criterion: >-
          If a pathway readout performs as well as genotype, the mutation-negative
          gap ceases to be an obstacle to targeted treatment decisions even if it
          remains genetically unexplained.
    evidence:
      - reference: PMID:36700525
        reference_title: >-
          Ultra-Low Level Somatic Mutations and Structural Variations in Focal
          Cortical Dysplasia Type II.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Despite a greater ability to detect low-level somatic mutations in the
          brain by deep sequencing and analytics, about 40% of cases remain
          genetically unexplained.
        explanation: >-
          Quantifies the gap this discussion is about, and attributes it to
          detection limits rather than to absence of a genetic cause.
      - reference: PMID:36700525
        reference_title: >-
          Ultra-Low Level Somatic Mutations and Structural Variations in Focal
          Cortical Dysplasia Type II.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          we isolated cells exhibiting phosphorylation of the S6 ribosomal protein
          (p-S6) in frozen brain tissues using fluorescence-activated cell sorting
          (FACS)
        explanation: >-
          Describes the cell-enrichment strategy that is the leading candidate
          resolution to the detection-sensitivity explanation.
      - reference: PMID:38916065
        reference_title: >-
          Threshold of somatic mosaicism leading to brain dysfunction with focal
          epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The mosaic burdens ranged from approximately 1000 to 40 000 neurons
          expressing the mTOR mutant in the somatosensory or medial prefrontal
          cortex.
        explanation: >-
          Establishes the very small mutant-clone sizes at issue, which is why the
          gap is plausibly a sensitivity floor rather than absent genetics.
  - discussion_id: fcd2_mtor_inhibition_negative_trial
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      The everolimus trial in FCD type 2 missed its primary endpoint. Does that
      refute mTOR inhibition as a therapeutic strategy for this disorder, or does
      it refute the trial design, given that the responders were concentrated in
      one genotype stratum?
    attaches_to:
      - pathophysiology#Constitutive mTORC1 Signalling in a Clonal Cortical Patch
    rationale: >-
      The mechanistic case for mTOR inhibition in FCD type II is about as clean
      as targeted therapy rationales get: the disease is defined by constitutive
      mTORC1 activity, and everolimus inhibits mTORC1. Yet the randomized
      crossover trial found no significant difference from placebo on the primary
      endpoint, with adverse events substantially more common on drug. Three
      readings are live. The first is that the trial is right and the strategy
      fails, plausibly because a systemically administered drug cannot reach a
      small deep clone at sufficient concentration, or because the dysplastic
      cortex is a fixed developmental structure whose epileptogenicity no longer
      depends on ongoing mTORC1 signalling. The second is that the trial was
      underpowered and unstratified: the patients who did become seizure-free
      carried MTOR variants or had no identified variant, and none of those with
      variants in other genes responded, which is what one expects if the
      effective population is a genotype subset. The third is that twelve weeks is
      too short. The practical stake is whether a patient who is not a surgical
      candidate should be offered a drug with real mucocutaneous toxicity. This
      entry records everolimus with REFUTE evidence for the primary endpoint and
      PARTIAL evidence for the genotype-restricted signal rather than presenting
      it as established therapy.
    proposed_experiments:
      - experiment_id: exp_fcd2_genotype_stratified_mtor_trial
        name: Genotype-stratified mTOR inhibitor trial in FCD type II
        description: >-
          A trial of mTOR inhibition prospectively stratified by lesional
          genotype, powered within the activator-variant stratum, with a treatment
          period long enough to detect a delayed effect and with lesional drug
          exposure measured where tissue becomes available at subsequent surgery.
        decision_criterion: >-
          A significant effect confined to the activator-variant stratum would
          establish the negative overall trial as a stratification failure rather
          than a mechanism failure.
      - experiment_id: exp_fcd2_lesional_drug_exposure
        name: Lesional drug exposure and target engagement measurement
        description: >-
          Measure everolimus concentration and phospho-S6 suppression directly in
          resected dysplastic tissue from patients treated before surgery, to test
          whether the drug reaches and engages its target in the lesion.
        decision_criterion: >-
          Absent target engagement in lesional tissue would attribute the negative
          trial to pharmacokinetics rather than to the mechanistic hypothesis, and
          would redirect effort toward delivery rather than abandoning the target.
    evidence:
      - reference: PMID:39607729
        reference_title: >-
          Efficacy and safety of everolimus for patients with focal cortical
          dysplasia type 2.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Everolimus treatment for 12 weeks did not show overall superiority in
          reducing seizures compared to placebo.
        explanation: >-
          States the negative primary result that this controversy is about.
      - reference: PMID:39607729
        reference_title: >-
          Efficacy and safety of everolimus for patients with focal cortical
          dysplasia type 2.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          it showed promise, mostly in patients with a pathogenic variant in the
          MTOR gene, highlighting the need for further research into
          patient-specific factors influencing treatment response
        explanation: >-
          The trial authors' own reading, that the signal is genotype-dependent,
          which is the stratification-failure position in this controversy.

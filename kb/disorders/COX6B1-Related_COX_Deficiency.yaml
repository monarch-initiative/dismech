    reference_title: Mitochondrial translation is the primary determinant of secondary mitochondrial complex I deficiencies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Evaluation of the “bioenergetic phenotype,” i.e., the cellular oxygen consumption rate (OCR) vs. extracellular
      acidification rate (ECAR), showed null OCR in cIV-deficient cells (4dKO, 6BKO) and significantly decreased
      OCR in βKO (cV) cells (Figures 2A and 2C).
    explanation: >-
      The 6BKO cells have no measurable oxygen-consumption flux in this assay; the other knockout models in
      the sentence are distinct genes.

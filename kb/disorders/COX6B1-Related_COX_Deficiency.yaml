experimental_models:
- name: Patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Arg20His patient fibroblasts, including immortalized derivatives, show impaired stable holoenzyme incorporation
    despite preserved total COX6B1. Arg20Cys fibroblasts show severe enzymatic deficiency and low ATP under
    galactose challenge, with rescue by wild-type COX6B1 cDNA. Lentiviral complementation is an experimental
    pathogenicity test, not demonstrated clinical gene therapy.
  publication: PMID:18499082
  evidence:
  - reference: PMID:18499082
    reference_title: >-
      Severe infantile encephalomyopathy caused by a mutation in COX6B1, a nucleus-encoded subunit of cytochrome
      c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, these results suggest that mutant COX6B1R19H was normally expressed in fibroblasts, but
      failed to be, or to remain, stably incorporated in the COX holocomplex.
    explanation: >-
      Patient fibroblasts retain total mutant protein but have impaired stable incorporation; R19H is mature-protein
      numbering for p.Arg20His.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4297913/
    reference_title: >-
      Mitochondrial complex IV deficiency, caused by mutated COX6B1, is associated with encephalomyopathy,
      hydrocephalus and cardiomyopathy - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mitochondrial dysfunction was evident in the patient's fibroblasts where defective growth and ATP
      content were clearly observed in GAL medium as compared with glucose-containing (GLU) medium.
    explanation: >-
      ATP depletion is demonstrated under galactose challenge in Arg20Cys fibroblasts; it is not a direct measurement
      in brain or heart.
  - reference: PMID:24781756
    reference_title: >-
      Mitochondrial complex IV deficiency, caused by mutated COX6B1, is associated with encephalomyopathy,
      hydrocephalus and cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation with the wild-type cDNA by a lentiviral construct restored COX activity, and mitochondrial
      function was improved by 5-aminoimidazole-4-carboxamide ribonucleotide, resveratrol and ascorbate in
      the patient's fibroblasts.
    explanation: >-
      Wild-type complementation establishes functional rescue in patient cells; the small-molecule results
      are also cell based.
  modeled_mechanisms:
  - target: Impaired stable COX6B1 incorporation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      The system resolves cellular biochemical consequences and does not reproduce the full neurological and
      cardiac phenotype.
  - target: Reduced complex IV activity
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      The system resolves cellular biochemical consequences and does not reproduce the full neurological and
      cardiac phenotype.
  - target: ATP depletion under respiratory dependence
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      The system resolves cellular biochemical consequences and does not reproduce the full neurological and
      cardiac phenotype.
- name: HeLa COX6B1 knockdown
  experimental_model_type: CELL_LINE
  description: >-
    Stable shRNA knockdown lowered COX6B1 transcript and protein and reduced complex IV activity. This partial
    depletion model complements the complete knockout studies.
  publication: PMID:18499082
  evidence:
  - reference: PMID:18499082
    reference_title: >-
      Severe infantile encephalomyopathy caused by a mutation in COX6B1, a nucleus-encoded subunit of cytochrome
      c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Accordingly, the COX/CS activities were significantly reduced, to around 70%, in either shRNA1- or shRNA14-versus
      mock-transfected HeLa cells (p < 0.0026 and p < 0.0009 respectively, Figure 3B).
    explanation: Two independent knockdown constructs reduce measured complex IV activity.
  modeled_mechanisms:
  - target: Reduced complex IV activity
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      The system resolves cellular biochemical consequences and does not reproduce the full neurological and
      cardiac phenotype.
- name: HEK293 COX6B1 knockout and complementation
  experimental_model_type: CELL_LINE
  description: >-
    Three CRISPR knockout clones reveal early MT-CO2 assembly failure as well as late holoenzyme instability.
    Wild-type COX6B1 restores respiration; Arg20His and Arg20Cys partially rescue with a more severe residual
    defect for Arg20Cys. Tagged COX6B2 does not rescue in this cell context. AOX restores redox balance and
    permits partial complex IV modules to join respirasomes, but intact-cell respiration flows through AOX
    and native complex IV activity remains negligible. ISR inhibition does not restore secondary complex I
    loss.
  publication: PMID:41419202
  evidence:
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, these results suggest a block in cIV assembly at the stage of MT-CO2 maturation and/or incorporation.
    explanation: >-
      Knockout cells retain MT-CO1/COX4/COX5A intermediates but lose MT-CO2 and mature complex IV; direct copper
      transfer by COX6B1 remains unproven.
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These experiments showed the total loss of fully assembled monomeric cIV (IV), cIV dimer (IV2), as well
      as SC III2IV in 6B1KO.
    explanation: >-
      Complete absence of these native forms is a result of engineered knockout; patient missense alleles can
      retain holoenzyme.
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Even though the AOX-expressing cells displayed robust rates of routine respiration, titration of the
      AOX inhibitor (salicylhydroxamic acid) completely abolished oxygen consumption, indicating that in intact
      cells, oxygen consumption was exclusively happening through AOX (Fig. S3, C and D).
    explanation: Respiratory bypass restores flux through AOX, not normal native complex IV respiration.
  - reference: PMID:39184436
    reference_title: Mitochondrial translation is the primary determinant of secondary mitochondrial complex I deficiencies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite efficient inhibition of ISR in cIV- (4dKO, 6BKO) and cV- (βKO) lacking cells, documented by (i)
      a significant decrease of ATF4 and its targets to wt levels (Figures 5E and 5F) and (ii) decreased eIF4EBP1
      levels (Figures 5G and 5H), the level of cI subunits was not increased (Figures 5E–5H and S5D–S5F).
    explanation: >-
      ISRIB and eIF4EBP1 silencing fail to restore complex I; ISR activation is not established as the mediator
      of secondary complex I loss.
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the other hand, the expression of either a C-terminal or an N-terminal FLAG-tagged COX6B2 isoform
      failed to even marginally rescue either MT-CO2 levels (Figs. 1F, S1D) or mitochondrial respiration (Fig.
      1G).
    explanation: >-
      Non-rescue applies to the tested HEK293 expression context and does not establish behavior in all tissues.
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The abundance of both MT-CO1 and all the other tested cIV subunits in SC I III2IVsub was also substantially
      augmented after AOX expression compared with 6B1KO, whereas IV2 and III2IV SCs remained absent (Figs.
      4, C and D, S3B).
    explanation: AOX permits partial assembly and an incomplete respirasome while mature dimer and III2IV remain absent.
  - reference: PMID:41419202
    reference_title: >-
      The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
      of complex IV.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, the introduction of the R20C variant disrupted cIV native forms and respiration to a greater extent
      than R20H, similar to the observations in patient-derived fibroblasts (30, 31).
    explanation: >-
      Direct comparison of human allele-expression models shows a more severe Arg20Cys defect without establishing
      a population genotype–prognosis rule.

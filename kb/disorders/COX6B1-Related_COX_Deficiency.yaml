name: COX6B1-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-15T00:00:00Z'
synonyms:
- COX6B1 deficiency
- Mitochondrial complex IV deficiency, nuclear type 7
- MC4DN7
- COX6B1-related cytochrome c oxidase deficiency
disease_term:
  preferred_term: COX6B1-related COX deficiency (MC4DN7)
  term:
    id: MONDO:0033637
    label: mitochondrial complex IV deficiency, nuclear type 7
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
description: >-
  Autosomal recessive COX6B1-related mitochondrial complex IV deficiency spans neonatal encephalomyopathy with
  hydrocephalus and cardiomyopathy and childhood-onset progressive cavitating leukodystrophy. Biallelic missense
  variants impair a nuclear-encoded structural subunit of cytochrome c oxidase. Protein abundance and residual
  enzyme activity vary by allele and tissue: loss of stable incorporation can occur despite preserved total
  protein. Human cell models identify both an early role in MT-CO2 maturation or incorporation and a later
  role in holoenzyme stability. ATP depletion is context dependent, and secondary respiratory-chain defects
  in complete knockout cells should not be assumed in patients.
inheritance:
- name: Autosomal recessive
  evidence:
  - reference: PMID:38842388
    reference_title: 'A novel homozygous pathogenic missense variant in COX6B1: Further delineation of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic pathogenic variants in COX6B1 have been described in four patients to date with varying disease
      manifestations.
    explanation: >-
      The four previously reported patients precede the new fifth patient in this report; this is not a population
      frequency.
notes: >-
  The small number of reported families does not establish phenotype frequencies or penetrance. The neonatal
  cardiac presentation and childhood neurological presentations are retained within one COX6B1 disease spectrum.
  Infection-associated deterioration is a precipitating circumstance of this inherited disorder. Mechanisms
  observed only in engineered null cells are distinguished from patient missense phenotypes.
pathophysiology:
- name: Biallelic COX6B1 dysfunction
  description: >-
    Homozygous disease-associated missense variants impair COX6B1 function. The consequences include reduced
    protein abundance for some alleles and tissues, or impaired holoenzyme incorporation despite stable abundance
    for Arg20His fibroblasts.

- name: Reduced complex IV activity
  description: >-
    Patient tissues show reduced or undetectable complex IV activity, with other respiratory complexes preserved
    in the reported clinical assays. Complete knockout abolishes detectable respiratory flux under the tested
    HEK293 conditions. This node represents terminal respiratory impairment without asserting universal ATP
    collapse.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4297913/

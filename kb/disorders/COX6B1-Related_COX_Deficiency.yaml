    snippet: >-
      The novel p.Trp31Arg variant was predicted to be pathogenic in silico, and further functional analyses
      with biochemical analysis of mitochondrial function showed isolated COX deficiency.
    explanation: The clinical report identifies p.Trp31Arg and a specific biochemical complex IV defect.

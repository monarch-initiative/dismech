- name: Yeast cox12 deletion and allele complementation
  experimental_model_type: OTHER
  description: >-
    Saccharomyces cerevisiae lacking the COX6B1 ortholog Cox12 has impaired respiratory growth. Human Arg20His
    retains partial complementation in the 2008 human-protein experiment, whereas the analogous yeast-protein
    R17H and R17C constructs failed complementation in 2021. Galactose-grown null yeast retain bulk III2IV
    supercomplexes but have reduced Cox2/Rcf2 association and severe complex IV activity loss. This differs
    from complete holoenzyme loss in human knockout cells. Coa6/Cox12 double-deletion epistasis additionally
    supports overlapping roles in Cox2 biogenesis.
  publication: PMID:34937540
  evidence:
  - reference: PMID:34937540
    reference_title: Mutations in the Yeast Cox12 Subunit Severely Compromise the Activity of the Mitochondrial Complex IV.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cox12 with arginine 17 residue substituted by histidine (R17H) or cysteine (R17C) (mutations analogous
      to those observed in human patients) failed to complement the loss of Cox12 function.
    explanation: These are yeast ortholog substitutions, not the human-protein constructs used in 2008.
  - reference: PMID:34937540
    reference_title: Mutations in the Yeast Cox12 Subunit Severely Compromise the Activity of the Mitochondrial Complex IV.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, the association of the respiratory SC factor 2 (Rcf2) and Cox2 subunit within the SCs of cox12Δ
      cells was reduced, while the specific activity of CIV was downregulated by 90%.
    explanation: Yeast retain bulk supercomplexes despite a marked activity defect.
  - reference: PMID:18499082
    reference_title: >-
      Severe infantile encephalomyopathy caused by a mutation in COX6B1, a nucleus-encoded subunit of cytochrome
      c oxidase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Likewise, the activity of COX/CS in COX6B1R19H transformants was 67% to that of the COX6B1wild-type transformants
      (Figure 5A and Table 3).
    explanation: Human Arg20His expressed in yeast retains partial activity relative to wild-type complementation.
  - reference: PMID:26669719
    reference_title: Mitochondrial disease genes COA6, COX6B and SCO2 have overlapping roles in COX2 biogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In order to place Coa6 in the Cox2 copper delivery pathway, we performed a comprehensive genetic epistasis
      analysis in the yeast Saccharomyces cerevisiae and found that simultaneous deletion of Coa6 and Sco2,
      a mitochondrial copper metallochaperone, or Coa6 and Cox12/COX6B, a structural subunit of CcO, completely
      abrogates Cox2 biogenesis.
    explanation: >-
      The double-deletion experiment supports overlapping Cox12/Coa6 functions without establishing direct
      human COX6B1 copper transfer.
  modeled_mechanisms:
  - target: Defective MT-CO2 maturation or incorporation
    relationship: PARTIALLY_RECAPITULATES

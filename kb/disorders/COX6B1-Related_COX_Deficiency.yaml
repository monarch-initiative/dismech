      explanation: >-
        The Arg20Cys muscle sample retains about 11% of control COX6B1; this is severe reduction, not complete
        absence.
  - target: Impaired stable COX6B1 incorporation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Arg20His alters stable incorporation despite retained total protein.
    evidence:
    - reference: PMID:18499082
      reference_title: >-
        Severe infantile encephalomyopathy caused by a mutation in COX6B1, a nucleus-encoded subunit of cytochrome
        c oxidase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Taken together, these results suggest that mutant COX6B1R19H was normally expressed in fibroblasts,
        but failed to be, or to remain, stably incorporated in the COX holocomplex.
      explanation: >-
        Patient fibroblasts retain total mutant protein but have impaired stable incorporation; R19H is mature-protein
        numbering for p.Arg20His.
  - target: Defective MT-CO2 maturation or incorporation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Engineered complete loss blocks MT-CO2-dependent assembly.
    evidence:
    - reference: PMID:41419202
      reference_title: >-
        The cytochrome c oxidase subunit COX6B1 is required for redox-sensitive early assembly and late stabilization
        of complex IV.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Altogether, these results suggest a block in cIV assembly at the stage of MT-CO2 maturation and/or
        incorporation.
      explanation: >-
        Knockout cells retain MT-CO1/COX4/COX5A intermediates but lose MT-CO2 and mature complex IV; direct
        copper transfer by COX6B1 remains unproven.

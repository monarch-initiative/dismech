    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we describe a novel combined immunodeficiency due to an IKZF3 mutation in a family presenting with T and B cell involvement"
    explanation: Names the entity as a combined immunodeficiency in the family that defines the N160S allele.

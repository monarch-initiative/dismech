    combined.
  phenotype_term:
    preferred_term: Increased naive T cell proportion
    term:
      id: HP:0031398
      label: Increased naive T cell proportion
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Naive T cells were increased, T cell differentiation was abnormal, and CD40L expression was dysregulated."
    explanation: The measurement behind this phenotype.
- name: Chronic lymphatic leukemia
  category: Neoplastic
  description: >-
    Chronic lymphocytic leukaemia, reported in the N160S family. The denominator is a single
    family, so the magnitude of the predisposition is unknown; the authors describe the
    association as likely rather than established.
  phenotype_term:
    preferred_term: chronic lymphocytic leukemia
    term:
      id: HP:0005550
      label: Chronic lymphatic leukemia
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the particular gene variant described is strongly associated with immunodeficiency and likely malignancy"
    explanation: The authors' own calibration of the malignancy association, which is why this entry does not state it as established.
diagnosis:
- name: Exome or genome sequencing
  description: >-
    Definitive diagnosis is molecular. IKZF3 should be included in inborn-error-of-immunity,
    common-variable-immunodeficiency and combined-immunodeficiency gene panels; the founding
    family was identified by whole-exome sequencing.
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We performed whole-exome sequencing (WES) and identified a novel heterozygous AIOLOS/IKZF3 N160S mutation."
    explanation: The route by which this entity's second allele was identified.
- name: Lymphocyte immunophenotyping
  description: >-
    Flow cytometry showing a high proportion of CD21-low B cells, absent CD23, abrogated CD40
    responses and increased naive T cells. This is the pattern that distinguishes the entity from a
    generic antibody deficiency and points at the IKAROS family.
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "abnormal B cell development (high percentage of CD21low B cells and negative CD23 expression), and abrogated CD40 responses"
    explanation: The immunophenotypic signature this test looks for.
- name: Functional assay of DNA binding and pericentromeric targeting
  description: >-
    Because the pathogenic mechanism is a dominant-negative one acting through retained
    dimerization, a variant of uncertain significance in the DNA-binding domain can be adjudicated
    functionally by testing DNA binding and pericentromeric localization. A variant that binds DNA
    and localizes normally is not acting by this mechanism.
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In vitro studies demonstrated that the mutant protein failed DNA binding and pericentromeric targeting."
    explanation: The two readouts this assay uses, as applied to a known pathogenic allele.
treatments:
- name: Immunoglobulin replacement therapy
  description: >-
    Replacement immunoglobulin for the antibody deficiency. Supportive and lifelong; no
    IMD84-specific disease-modifying therapy exists.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Decreased circulating immunoglobulin concentration
    treatment_effect: BYPASSES
    description: >-
      Supplies antibody the patient cannot make; it bypasses the B-cell differentiation arrest
      rather than correcting it.
- name: Pneumocystis prophylaxis
  description: >-
    Antimicrobial prophylaxis against Pneumocystis jirovecii, warranted by the opportunistic
    infection risk that accompanies the T-cell arm of the defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Pneumocystis jirovecii pneumonia
    description: Prevents the characteristic opportunistic infection.
- name: Hematopoietic cell transplantation
  description: >-
    Considered in severe combined immunodeficiency. No transplant outcome data specific to this
    entity appear in the sources used here, so this is recorded as the management option the
    combined phenotype raises rather than as an evidenced intervention for it.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
- name: Genetic counseling and cascade testing
  description: >-
    Autosomal dominant inheritance with full penetrance for the reported alleles, so cascade
    testing of relatives has a high yield and the counselling is correspondingly definite.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
differential_diagnoses:
- name: Immune dysregulation with immunodeficiency due to AIOLOS haploinsufficiency
  description: >-
    The other IKZF3 disease, caused by the E82K, M77L and Q402X alleles, which reduce AIOLOS
    dosage instead of corrupting IKAROS. It is a milder, incompletely penetrant, more
    CVID-like entity with autoimmunity and allergy, and low switched memory B cells as its most
    consistent finding. Curated in dismech as
    Immune_Dysregulation_With_Immunodeficiency_Due_To_AIOLOS_Haploinsufficiency (MONDO:0979328).
    Distinguishing the two matters clinically, because the dominant-negative alleles are fully
    penetrant and carry the Pneumocystis and leukaemia risk.
  evidence:
  - reference: PMID:38773004
    reference_title: AIOLOS-Associated Inborn Errors of Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additionally, a missense and a truncating variant (E82K and Q402X) leading to the AIOLOS haploinsufficiency have been documented"
    explanation: Names the haploinsufficiency alleles that belong to the sibling entity rather than to this one.
- name: IKAROS (IKZF1)-associated inborn errors of immunity
  description: >-
    The paralogous disease family, where the same haploinsufficiency versus dominant-negative split
    produces a CVID-like phenotype and a combined immunodeficiency with Pneumocystis respectively.
    AIOLOS residue N160 is the structural homolog of IKAROS N159, so the two dominant-negative
    diseases are mechanistically parallel rather than merely similar. Curated in dismech as
    Early-onset_Combined_Immunodeficiency_With_Low_Ig_Due_To_Dominant_Negative_IKAROS_Mutation.
  evidence:
  - reference: PMID:32654692
    reference_title: IKAROS Family Zinc Finger 1-Associated Diseases in Primary Immunodeficiency Patients.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations acting by haploinsufficiency present with a common variable immune deficiency-like phenotype mainly characterized by increased susceptibility to infections."
    explanation: States the haploinsufficiency half of the IKZF1 split that this entity's gene mirrors.
- name: Common variable immunodeficiency of other genetic cause
  description: >-
    The clinical category most of these patients first enter. The pointers away from it and toward
    IKZF3 are the combined T- and B-cell involvement, the CD21-low and CD23-negative B-cell
    pattern, Pneumocystis infection and full penetrance in the family.
animal_models:
- name: Aiolos N160S knock-in mouse
  species: Mouse
  genotype: Ikzf3 N160S knock-in (orthologous to human AIOLOS N160S)
  publication: PMID:34694366
  description: >-
    Knock-in mouse carrying the orthologous human mutation. The human immunophenotype was
    recapitulated in this model, which makes it the strongest evidence that the human allele is
    sufficient for the phenotype.
  genes:
  - preferred_term: Ikzf3
    term:
      id: MGI:1342542
      label: Ikzf3
  modeled_mechanisms:
  - target: Abnormal T Cell Differentiation and Impaired T Cell Help
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model reproduces the human B- and T-cell phenotypes of this allele.
    limitations: >-
      The cited report states recapitulation of the immunophenotype without reporting whether the
      mice develop the infectious or neoplastic complications that dominate the human course, so
      the model is evidenced for the cellular phenotype and not for the clinical outcome.
    evidence:
    - reference: PMID:34694366
      reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The human immunophenotype was recapitulated in a murine model carrying the corresponding human mutation."
      explanation: The recapitulation claim, scoped to the immunophenotype.
- name: Aiolos G159R knock-in mouse
  species: Mouse
  genotype: Ikzf3 G159R knock-in (orthologous to human AIOLOS G159R)
  publication: PMID:34155405
  description: >-
    Knock-in mouse bearing the variant corresponding to human G159R, used to establish the
    heterodimeric-interference mechanism in vivo as well as in vitro.
  genes:
  - preferred_term: Ikzf3
    term:
      id: MGI:1342542
      label: Ikzf3
  modeled_mechanisms:
  - target: B Cell Differentiation Arrest and Antibody Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The mice bear the corresponding variant and reproduce the B- and T-cell phenotypes, which is
      what licensed the mechanistic experiments done alongside them.
    limitations: >-
      The report uses the model to establish mechanism rather than to characterise clinical
      course, so infection and malignancy outcomes in the model are not reported in the cited
      text.
    evidence:
    - reference: PMID:34155405
      reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Using mice that bear the corresponding variant and recapitulate the B and T cell phenotypes"
      explanation: States that the model reproduces the human cellular phenotypes.

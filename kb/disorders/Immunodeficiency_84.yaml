    A combined B- and T-cell immunodeficiency. The B-cell arm dominates the laboratory picture,
    but T-cell differentiation is abnormal in the same patients, which is what separates this
    entity from the AIOLOS haploinsufficiency arm and from a pure antibody deficiency.
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:

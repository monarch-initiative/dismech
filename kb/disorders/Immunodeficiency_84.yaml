    causal_link_type: DIRECT
  - target: Abnormal T Cell Differentiation and Impaired T Cell Help
    description: >-
      The same loss skews T cells toward a naive phenotype and dysregulates CD40 ligand, removing
      the T-cell help B cells need.
    causal_link_type: DIRECT
- name: B Cell Differentiation Arrest and Antibody Failure
  description: >-
    Abnormal B-cell development with a high proportion of CD21-low B cells, absent CD23
    expression, abrogated CD40 responses and impaired humoral responses. This is the dominant
    arm of the phenotype and the reason the disease is detected as an antibody deficiency before
    its combined nature is apparent.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients carrying the AIOLOS p.N160S heterozygous variant displayed impaired humoral responses, abnormal B cell development (high percentage of CD21low B cells and negative CD23 expression), and abrogated CD40 responses."
    explanation: The patient immunophenotype behind this node, including the surface markers that define it.
  cell_types:

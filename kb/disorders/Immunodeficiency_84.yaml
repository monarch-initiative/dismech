name: Immunodeficiency 84
category: Mendelian
creation_date: "2026-11-12T23:30:00Z"
synonyms:
- IMD84
- immunodeficiency due to IKZF3 deficiency
description: >-
  An autosomal dominant inborn error of immunity caused by heterozygous missense variants in the
  DNA-binding zinc-finger region of IKZF3, which encodes the IKAROS-family transcription factor
  AIOLOS. The reported alleles - G159R, N160S and G191R - leave the C-terminal dimerization
  fingers intact, so mutant AIOLOS still forms homodimers and heterodimers with its partner
  IKAROS, and those mutant-containing complexes neither bind the canonical AIOLOS-IKAROS DNA motif
  nor reach pericentromeric heterochromatin; they are instead redirected to genomic regions
  lacking the motif. The mutant therefore corrupts IKAROS as well as AIOLOS, a mechanism the
  founding report named heterodimeric interference and proposed as a new route to autosomal
  dominance in inborn errors of immunity. That removing the mutant's dimerization capacity
  restores B-cell development is the experiment that establishes it. The clinical phenotype is a
  fully penetrant combined immunodeficiency with profound B-cell differentiation failure,
  hypogammaglobulinaemia, Pneumocystis jirovecii pneumonia, abnormal T-cell differentiation,
  autoimmunity and chronic lymphocytic leukaemia. Knock-in mice carrying the corresponding human
  alleles reproduce the B- and T-cell phenotypes.
disease_term:
  preferred_term: immunodeficiency 84
  term:
    id: MONDO:0030333
    label: immunodeficiency 84
parents:
- Inborn error of immunity
- Disease of immune dysregulation
notes: >-
  Entry scope, and the split this entry sits on. IKZF3 produces two distinct diseases by two
  distinct mechanisms, and this entry is only the dominant-negative one. ClinGen's curation of
  immunodeficiency 84 covers the DNA-binding-domain alleles - its evidence summary names G159R and
  N160S in seven patients across two publications - and dismech already curates the other arm as
  Immune_Dysregulation_With_Immunodeficiency_Due_To_AIOLOS_Haploinsufficiency (MONDO:0979328),
  whose own entry states that G159R, N160S and G191R "cause the separate disease immunodeficiency
  84 (MONDO:0030333)", with complete penetrance and a more prominent B-cell deficiency. The
  haploinsufficiency alleles E82K, M77L and Q402X belong to that entry, not this one. The
  deep-research report used here treats both allele classes as two branches of a single
  "two-mechanism paradigm" under the IMD84 name; that framing was not followed, because it would
  merge two MONDO diseases that the KB and ClinGen both keep apart. The same split is already
  recorded in this KB for the paralog IKZF1/IKAROS, where haploinsufficiency gives a
  CVID-like picture and dominant-negative alleles give combined immunodeficiency with
  Pneumocystis; AIOLOS residue N160 is the structural homolog of IKAROS N159.
  MONDO records no causal gene (RO:0004003) for MONDO:0030333, so `just preflight-dr` returned
  SKIP and disease identity was confirmed manually instead: the term's OMIM xref is OMIM:619437,
  which matches the report, and "immunodeficiency due to IKZF3 deficiency" is one of its exact
  synonyms. ClinGen independently records IKZF3 against this MONDO identifier. The missing MONDO
  gene association is an upstream gap, not a curation problem here.
  Two ontology identifiers offered by the report were wrong and are not used: HP:0410330, offered
  for an abnormal T-cell count or subset, is Meat allergen allergy, and HP:0005405 does not
  resolve at all. Every term here was taken from the committed caches, several of them from the
  sibling IKZF1 dominant-negative entry so that the two entries describe the same immunological
  findings with the same terms.
  No GeneReviews chapter exists. Searched cache/bookshelf/genereviews.csv (index snapshot
  2026-09-10, 958 chapters) for IKZF3, AIOLOS and immunodeficiency; the index carries X-Linked
  Severe Combined Immunodeficiency and Hepatic Veno-Occlusive Disease with Immunodeficiency but
  nothing for this entity, and `just check-genereviews` reports NO_CHAPTER.
  The ClinGen cache file committed here is stamped from a current ClinGen export (2026-11-12)
  rather than the release pinned in data/clingen/MANIFEST.yaml (2026-10-04). Note also that the
  assertion identifier differs from the one in the older committed cache/clingen/gene_validity.csv
  fallback: ClinGen re-rendered the same classification date as T040000.000Z rather than
  T170000.000Z, so the identifier built from the older export no longer resolves.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous DNA-binding-domain allele causes disease, and does so by corrupting the
    product of the wild-type partner gene rather than by reducing AIOLOS dosage. The reported
    alleles are fully penetrant.
  evidence:
  - reference: PMID:34155405
    reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Heterodimeric interference is a new mechanism of autosomal dominance that causes inborn errors of immunity by impairing protein function via the mutation of its heterodimeric partner."
    explanation: States the mode of inheritance and the mechanism that produces it, in the founding report's own words.
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The mutant was fully penetrant and had a dominant-negative effect over WT AIOLOS but not WT IKAROS."
    explanation: Establishes full penetrance and the dominant-negative action, and its asymmetry between the two partners.

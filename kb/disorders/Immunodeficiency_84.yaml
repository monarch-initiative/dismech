genetic:
- name: IKZF3
  variant_origin: GERMLINE
  gene_term:
    preferred_term: IKZF3
    term:
      id: hgnc:13178
      label: IKZF3
  relationship_type: CAUSATIVE
  notes: >-
    On relationship_type, which `just check-gene-validity` reports as `overstated` for this
    record. The schema defines CAUSATIVE as corresponding to a ClinGen Definitive or Strong tier,
    and ClinGen rates this pair Moderate, so the two do not line up and the audit is right to say
    so. CAUSATIVE is nonetheless recorded, because the Moderate tier reflects the volume of
    evidence - seven patients in two publications - rather than a weaker causal claim: the
    reported alleles are fully penetrant, act by a demonstrated dominant-negative mechanism, and
    knock-in mice carrying the orthologous variants reproduce the phenotype. None of the
    alternative enum values fits: RISK_FACTOR and SUSCEPTIBILITY both assert the variant is
    neither necessary nor sufficient, DISPUTED and REFUTED misstate the evidence, and UNKNOWN
    would claim the relationship is unclassified when ClinGen has classified it. The enum has no
    value for a Mendelian relationship with moderate evidence, which is the gap this record sits
    in; a maintainer may prefer a different value, and the ClinGen tier itself is recorded
    verbatim in gene_disease_validity either way.
    Pathogenic alleles for this entity are missense variants in the N-terminal DNA-binding
    zinc-finger region. The haploinsufficiency alleles E82K and Q402X cause a different disease
    and are not listed here. ClinGen rates this gene-disease relationship Moderate on seven
    patients in two publications; that tier is copied from the CGGV record and is not a curator
    judgement. A later SCID-CID GCEP note appended to the same record describes germline IKZF3
    variants as associated primarily with defects in B-cell development and function, with
    combined immunodeficiency and immune dysregulation also critical features.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e9112f2c-325e-4363-8a37-e7a8862bf55b-2023-03-21T040000.000Z
    evidence:
    - reference: CGGV:assertion_e9112f2c-325e-4363-8a37-e7a8862bf55b-2023-03-21T040000.000Z
      reference_title: IKZF3 / immunodeficiency 84 (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IKZF3 | HGNC:13178 | immunodeficiency 84 | MONDO:0030333 | AD | Moderate"
      explanation: ClinGen Antibody Deficiencies Gene Curation Expert Panel classification for this MONDO entity.
  evidence:
  - reference: PMID:38773004
    reference_title: AIOLOS-Associated Inborn Errors of Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "heterozygous missense loss-of-function variants within the DNA-binding domain of the IKZF3 gene (G159R, N160S, and G191R) have been identified in patients with inborn errors of immunity"
    explanation: Names the three DNA-binding-domain alleles of this entity and, in the same sentence, separates them from the haploinsufficiency variants; a review synthesis of the reported cases.
  variants:
  - name: G159R
    description: >-
      DNA-binding-domain missense allele, the founding IMD84 variant. Mutant AIOLOS homodimers and
      AIOLOS-IKAROS heterodimers fail to bind the canonical motif and are redirected to genomic
      regions lacking it.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34155405
      reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "caused by a heterozygous IKZF3 missense variant, resulting in a glycine-to-arginine replacement within the DNA-binding domain of the encoded AIOLOS protein"
      explanation: Identifies the allele and locates it in the DNA-binding domain, which is what separates this entity from the haploinsufficiency arm.
  - name: N160S
    description: >-
      DNA-binding-domain missense allele, fully penetrant, dominant-negative over wild-type AIOLOS
      but not over wild-type IKAROS. The structural homolog of IKAROS N159.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34694366
      reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "In vitro studies demonstrated that the mutant protein failed DNA binding and pericentromeric targeting."
      explanation: The functional characterisation of this allele, covering both lost activities.
  - name: G191R
    description: >-
      Third reported DNA-binding-domain missense allele of this entity. It is named by the
      AIOLOS-associated inborn-error review alongside G159R and N160S, and is not part of the
      ClinGen curation's two-variant count.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38773004
      reference_title: AIOLOS-Associated Inborn Errors of Immunity.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "heterozygous missense loss-of-function variants within the DNA-binding domain of the IKZF3 gene (G159R, N160S, and G191R) have been identified in patients with inborn errors of immunity"
      explanation: The source naming G191R as a DNA-binding-domain allele of this entity.
pathophysiology:
- name: IKZF3 DNA-Binding-Domain Variant with Intact Dimerization
  description: >-
    A heterozygous missense variant in the N-terminal DNA-binding zinc-finger region of IKZF3
    alters the AIOLOS DNA-binding surface while leaving the C-terminal dimerization fingers
    intact. That combination is the whole mechanism: the protein retains the ability to assemble
    complexes and loses the ability to put them in the right place.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  evidence:
  - reference: PMID:34155405
    reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "caused by a heterozygous IKZF3 missense variant, resulting in a glycine-to-arginine replacement within the DNA-binding domain of the encoded AIOLOS protein"
    explanation: Locates the lesion in the DNA-binding domain of AIOLOS.
  gene:
    preferred_term: IKZF3
    term:
      id: hgnc:13178
      label: IKZF3
  molecular_functions:
  - preferred_term: AIOLOS sequence-specific DNA binding
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  - preferred_term: AIOLOS dimerization, retained
    term:

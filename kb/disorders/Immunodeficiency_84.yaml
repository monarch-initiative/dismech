    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous DNA-binding-domain missense allele acting dominant-negatively; dimerization is
      preserved, which is what makes it dominant rather than haploinsufficient.
  downstream:
  - target: Heterodimeric Interference and Mislocalized AIOLOS-IKAROS Complexes
    description: >-
      Because dimerization survives, the mutant is incorporated into homodimers and into
      heterodimers with IKAROS, and takes both off their targets.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34155405
      reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "the mutant AIOLOS homodimers and AIOLOS-IKAROS heterodimers did not bind the canonical AIOLOS-IKAROS DNA sequence"
      explanation: Shows both complex types losing DNA binding, which is the step that makes the lesion dominant.
- name: Heterodimeric Interference and Mislocalized AIOLOS-IKAROS Complexes
  description: >-
    Mutant-containing homodimers and AIOLOS-IKAROS heterodimers fail to bind the canonical motif,
    fail pericentromeric heterochromatin targeting, and are redirected to genomic regions lacking
    both canonical motifs. Wild-type IKAROS is therefore sequestered into non-functional
    complexes, so one mutant allele of IKZF3 disables the product of a second, unmutated gene.
    The decisive experiment is a negative one made positive: removing the mutant's dimerization
    capacity restored B-cell development, which shows the damage is done through dimerization
    rather than through loss of AIOLOS dosage.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: MOLECULAR_ACTIVITY_EFFECT
  evidence:
  - reference: PMID:34155405
    reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "homodimers and heterodimers containing one mutant AIOLOS bound to genomic regions lacking both canonical motifs"
    explanation: The redirection to non-canonical sites, which is more than a simple loss of binding.
  - reference: PMID:34155405
    reference_title: A variant in human AIOLOS impairs adaptive immunity by interfering with IKAROS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "the removal of the dimerization capacity from mutant AIOLOS restored B cell development"
    explanation: The rescue experiment establishing that the mechanism runs through dimerization, not dosage.
  - reference: PMID:34694366
    reference_title: "T and B cell abnormalities, pneumocystis pneumonia, and chronic lymphocytic leukemia associated with an AIOLOS defect in patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In vitro studies demonstrated that the mutant protein failed DNA binding and pericentromeric targeting."
    explanation: Independent confirmation in the second allele, covering the heterochromatin-targeting failure.
  cellular_components:
  - preferred_term: pericentric heterochromatin
    term:
      id: GO:0005721
      label: pericentric heterochromatin
  biological_processes:

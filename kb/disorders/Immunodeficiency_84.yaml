- name: Loss of IKAROS-Family Transcriptional Control of Lymphocyte Development
  description: >-
    AIOLOS and IKAROS jointly regulate lymphocyte differentiation, B-cell maturation and
    plasma-cell generation. Corrupting both arms of the pair removes that control across B- and
    T-cell development simultaneously, which is why the phenotype is combined rather than purely
    humoral.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  evidence:
  - reference: PMID:34155405

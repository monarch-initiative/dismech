      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "a novel combined immunodeficiency due to an IKZF3 mutation in a family presenting with T and B cell involvement, Pneumocystis jirovecii pneumonia, and/or chronic lymphocytic leukemia"

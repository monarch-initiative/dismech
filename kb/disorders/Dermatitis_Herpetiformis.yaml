name: Dermatitis Herpetiformis
creation_date: "2026-09-30T23:45:00Z"
category: Autoimmune
description: >-
  Dermatitis herpetiformis (DH) is the cutaneous manifestation of gluten
  sensitivity and a specific extraintestinal expression of celiac disease. In
  genetically predisposed (HLA-DQ2/DQ8) individuals, gluten-driven small-bowel
  autoimmunity generates IgA autoantibodies that, in DH, are of markedly higher
  avidity for epidermal transglutaminase (TG3) than for tissue transglutaminase.
  High-avidity IgA anti-TG3, together with the TG3 enzyme, forms granular immune
  deposits in the papillary dermis, recruits neutrophils into the dermal
  papillae, and produces an intensely pruritic, symmetrical papulovesicular
  eruption on extensor surfaces. Diagnosis rests on pathognomonic granular IgA
  deposits by direct immunofluorescence; a lifelong gluten-free diet is the
  treatment of choice, with dapsone for rapid symptom control.
disease_term:
  preferred_term: dermatitis herpetiformis
  term:
    id: MONDO:0015614
    label: dermatitis herpetiformis
synonyms:
- Duhring's disease
- Duhring-Brocq disease
- dermatosis herpetiformis
parents:
- Autoimmune Disease
- Skin Disease
notes: >-
  DH and celiac disease (curated separately in Celiac_Disease) are two cutaneous
  and intestinal expressions of the same gluten-sensitive autoimmunity; this
  entry models the skin disease and the gut origin that drives it, not the full
  enteropathy. The distinguishing molecular feature is the higher-avidity IgA
  response to epidermal transglutaminase (TG3, gene TGM3) versus the tissue
  transglutaminase (TG2, gene TGM2) response shared with celiac disease. No
  GeneReviews chapter exists (complex HLA-associated autoimmune disease, not
  Mendelian). Gluten is recorded as an environmental trigger without an ECTO
  exposure_term: ECTO was searched (l~gluten, l~wheat) and has no gluten or
  wheat dietary-exposure class.

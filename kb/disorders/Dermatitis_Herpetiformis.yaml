      explanation: >-
        The papillary-dermis IgA deposits contain epidermal transglutaminase.
  evidence:
  - reference: PMID:11901200
    reference_title: Epidermal transglutaminase (TGase 3) is the autoantigen of dermatitis herpetiformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      antibodies in patients having dermatitis herpetiformis show a markedly

  name: Pruritic papulovesicular eruption
  description: >-
    Symmetrical grouped papules and vesicles on extensor surfaces (elbows,
    knees, buttocks, sacral region); the clinical hallmark of DH.
  phenotype_term:
    preferred_term: papulovesicular eruption
    term:
      id: HP:0033700
      label: Papulovesicular eruption
    onset:
      onset_category: ADULT
      mean_age_years: 50
      notes: >-
        DH presents mainly in adults; the mean age at onset is about 50 years
        (PMID:33432477).
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinically, DH presents with polymorphic lesions, including papules,
      vesicles, and small blisters, symmetrically distributed in typical
      anatomical sites including the extensor aspects of the limbs, the elbows,
      the sacral regions, and the buttocks.
    explanation: >-
      Describes the symmetrical papulovesicular eruption on extensor surfaces.
  - reference: PMID:33432477
    reference_title: 'Dermatitis Herpetiformis: An Update on Diagnosis and Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The mean age at onset is about 50 years.
    explanation: >-
      Supports the adult onset (mean ~50 years) recorded on this phenotype.
- category: Cutaneous
  name: Pruritus
  description: >-
    Intense itch, often so severe that scratching destroys the primary lesions
    and leaves excoriations.
  phenotype_term:
    preferred_term: intense pruritus
    term:
      id: HP:0000989
      label: Pruritus
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:21571167
    reference_title: Dermatitis herpetiformis. Part I. Epidemiology, pathogenesis, and clinical presentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      young adults present with excoriations only, as the severe pruritus
      effectively destroys any primary lesions
    explanation: >-
      Documents the severe pruritus characteristic of DH.
- category: Gastrointestinal
  name: Small-bowel villous atrophy
  description: >-
    Most DH patients have celiac-type small-bowel changes, ranging from villous
    atrophy to increased intraepithelial lymphocytes, usually without overt
    gastrointestinal symptoms.
  phenotype_term:
    preferred_term: villous atrophy
    term:
      id: HP:0011473
      label: Villous atrophy
  frequency: FREQUENT
  evidence:
  - reference: PMID:33432477
    reference_title: 'Dermatitis Herpetiformis: An Update on Diagnosis and Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      three-fourths of patients with DH have villous atrophy in the small bowel,
      and the rest have celiac-type inflammatory changes
    explanation: >-
      Quantifies the subclinical small-bowel enteropathy in DH.
- category: Neoplasm
  name: Lymphoma
  description: >-
    Like celiac disease, DH carries a six- to tenfold increased risk of lymphoma
    (enteropathy-associated T-cell and B-cell types / non-Hodgkin lymphoma). The
    excess risk is concentrated in the first years after diagnosis and is reduced
    by strict gluten-free-diet adherence; overall DH mortality is not elevated.
  phenotype_term:
    preferred_term: increased lymphoma risk
    term:
      id: HP:0002665
      label: Lymphoma
  evidence:
  - reference: PMID:33432477
    reference_title: 'Dermatitis Herpetiformis: An Update on Diagnosis and Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The risk in DH is increased six to tenfold.
    explanation: >-
      Quantifies the increased lymphoma risk in DH.
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mortality due to non-Hodgkin lymphomas was increased only during the first
      5 years following the diagnosis but not thereafter
    explanation: >-
      The lymphoma-related mortality excess is confined to the first 5 years
      after diagnosis.

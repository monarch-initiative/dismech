diagnosis:
- name: Direct immunofluorescence of perilesional skin
  description: >-
    Direct immunofluorescence of perilesional skin showing pathognomonic granular
    IgA deposits in the papillary dermis confirms the diagnosis.
  evidence:
  - reference: PMID:29757210
    reference_title: 'Dermatitis Herpetiformis: A Common Extraintestinal Manifestation of Coeliac Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis of DH is easily confirmed by immunofluorescence biopsy showing
      pathognomonic granular immunoglobulin A (IgA) deposits in the papillary
      dermis.
    explanation: >-
      Granular papillary-dermis IgA on DIF is the diagnostic gold standard.
- name: Serum anti-transglutaminase IgA
  description: >-
    Circulating IgA autoantibodies against epidermal transglutaminase (TG3),
    and against tissue transglutaminase, support the diagnosis, though their
    absence does not exclude DH.
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      assessing serum titers of autoantibodies against epidermal transglutaminase
      (eTG), the supposed autoantigen of DH, may also serve as a clue for the
      diagnosis
    explanation: >-
      Serum anti-epidermal-transglutaminase IgA is a supporting diagnostic
      marker.

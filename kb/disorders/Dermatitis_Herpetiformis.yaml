clinical_burden:
  burden_level: MODERATE
  rationale: >-
    DH causes intense pruritus and a chronic relapsing eruption, but responds
    well to a gluten-free diet and dapsone, and diet-adherent patients have an
    excellent long-term prognosis with mortality no higher than the general
    population. Untreated gluten sensitivity carries an elevated lymphoma risk
    that the diet reduces.
  evidence:
  - reference: PMID:31093998
    reference_title: Dermatitis herpetiformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a GFD increases the quality of life for patients, and decreases the risk
      for lymphoma in DH
    explanation: >-
      Identifies the lymphoma risk and its reduction by the gluten-free diet.
inheritance:
- name: HLA-associated polygenic susceptibility
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    DH is a complex, HLA-associated autoimmune trait, not Mendelian. It shares
    the celiac-disease HLA-DQ2 and HLA-DQ8 haplotypes and gluten dependence.
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      share the same Human Leukocyte Antigen (HLA) haplotypes (DQ2 and DQ8)
    explanation: >-
      DH shares the celiac HLA-DQ2/DQ8 susceptibility haplotypes.
pathophysiology:
- name: HLA-DQ2/DQ8-Restricted Gluten Presentation
  biological_scale: MOLECULAR
  description: >-
    Permissive HLA-DQ2 and HLA-DQ8 class II molecules present deamidated gluten
    peptides to CD4+ T cells, the shared genetic basis of gluten sensitivity in
    both DH and celiac disease.
  genes:
  - preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  - preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  molecular_functions:
  - preferred_term: MHC class II peptide antigen binding
    term:
      id: GO:0042605
      label: peptide antigen binding
  downstream:
  - target: Gluten-Driven Small-Bowel Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Presentation of gluten peptides on the permissive haplotype licenses the
      gluten-sensitive autoimmune response.
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      share the same Human Leukocyte Antigen (HLA) haplotypes (DQ2 and DQ8)
    explanation: >-
      Establishes the HLA-DQ2/DQ8 restriction shared with celiac disease.
- name: Gluten-Driven Small-Bowel Autoimmunity
  biological_scale: ORGANISM
  description: >-
    DH arises from latent or manifest celiac disease in the gut: gluten exposure
    drives an IgA autoantibody response against tissue transglutaminase, with
    small-bowel villous atrophy or celiac-type inflammation in most patients.
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  downstream:
  - target: Small-bowel villous atrophy
    causal_link_type: DIRECT
    description: >-
      The gut autoimmune response produces celiac-type villous atrophy in most
      DH patients.
  - target: Anti-TG3 IgA Autoantibody Response
    causal_link_type: DIRECT
    description: >-
      The gut autoimmune response evolves into a high-avidity IgA response
      against epidermal transglutaminase.
    evidence:
    - reference: PMID:29757210
      reference_title: 'Dermatitis Herpetiformis: A Common Extraintestinal Manifestation of Coeliac Disease.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        it starts from latent or manifest coeliac disease in the gut and evolves
        into an immune complex deposition of high avidity IgA epidermal
        transglutaminase (TG3) antibodies, together with the TG3 enzyme, in the
        papillary dermis
      explanation: >-
        States the gut-origin-to-skin causal sequence.
  - target: Lymphoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The chronic gluten-driven enteropathy carries a six- to tenfold increased
      risk of enteropathy-associated lymphoma, concentrated in the years before
      a gluten-free diet is established.
    evidence:
    - reference: PMID:33432477
      reference_title: 'Dermatitis Herpetiformis: An Update on Diagnosis and Management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Lymphomas are of enteropathy-associated T-cell or B-cell origin, and
        patients not adhering to a GFD are at special risk
      explanation: >-
        Ties the lymphoma risk to the enteropathy and to continued gluten
        exposure.
  evidence:
  - reference: PMID:31093998
    reference_title: Dermatitis herpetiformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      DH and CD share a similar genetic background, small bowel mucosal
      alterations, and an autoimmune response against tissue transglutaminase in
      the serum and small bowel
    explanation: >-
      Locates the initiating anti-tissue-transglutaminase autoimmunity in the
      small bowel.
- name: Anti-TG3 IgA Autoantibody Response
  biological_scale: CELLULAR
  description: >-
    In DH the IgA response acquires markedly higher avidity for epidermal
    transglutaminase (TG3) than for tissue transglutaminase, and a TG3-specific
    antibody population appears. This is the molecular feature that distinguishes
    DH from celiac disease without skin involvement.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: Granular IgA-TG3 Deposition in the Papillary Dermis
    causal_link_type: DIRECT
    description: >-
      High-avidity IgA anti-TG3 complexes with the TG3 enzyme and deposits in the
      papillary dermis.
    evidence:
    - reference: PMID:11901200
      reference_title: Epidermal transglutaminase (TGase 3) is the autoantigen of dermatitis herpetiformis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the IgA precipitates in the papillary dermis of patients with dermatitis
        herpetiformis, the defining signs of the disease, contain epidermal

environmental:
- name: Dietary gluten exposure
  description: >-
    Dietary gluten is the necessary environmental trigger. It drives the
    small-bowel autoimmunity that underlies DH, and its removal (a gluten-free
    diet) heals both the rash and the enteropathy.
  effect: Necessary dietary trigger; removal is disease-modifying
  chemicals:
  - gluten
  influences_mechanisms:
  - target: Gluten-Driven Small-Bowel Autoimmunity
    environmental_effect: TRIGGERS

    explanation: >-
      The higher-avidity anti-TG3 response defines DH.
- name: Granular IgA-TG3 Deposition in the Papillary Dermis
  biological_scale: TISSUE
  description: >-
    IgA anti-TG3 and the TG3 enzyme form tightly bound immune complexes that
    precipitate as pathognomonic granular IgA deposits in the papillary dermis.
    Passive transfer of anti-TG3 reproduces these deposits, establishing them as
    directly antibody-driven.
  genes:
  - preferred_term: TGM3
    term:
      id: hgnc:11779
      label: TGM3
  molecular_functions:
  - preferred_term: protein-glutamine gamma-glutamyltransferase activity
    term:
      id: GO:0003810
      label: protein-glutamine gamma-glutamyltransferase activity
  locations:
  - preferred_term: papillary layer of dermis
    term:
      id: UBERON:0001992
      label: papillary layer of dermis
  downstream:
  - target: Neutrophil Recruitment and Papillary Microabscess Formation
    causal_link_type: DIRECT
    description: >-
      The dermal immune deposits recruit neutrophils into the dermal papillae.
  evidence:
  - reference: PMID:11901200
    reference_title: Epidermal transglutaminase (TGase 3) is the autoantigen of dermatitis herpetiformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a blistering skin disease characterized by granular IgA deposits in the
      papillary dermis
    explanation: >-
      Granular papillary-dermis IgA deposits are the defining lesion.
  - reference: PMID:21335491
    reference_title: Dermatitis herpetiformis sera or goat anti-transglutaminase-3 transferred to human skin-grafted mice mimics dermatitis herpetiformis immunopathology.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All mice that received goat anti-TG3 produced papillary dermal immune
      deposits, and these deposits reacted with both rabbit anti-TG3 and DH
      patient sera.
    explanation: >-
      Passive transfer of anti-TG3 reproduces the deposits, showing they are
      antibody-driven (a human-skin-grafted mouse model).
- name: Neutrophil Recruitment and Papillary Microabscess Formation
  biological_scale: TISSUE
  description: >-
    The dermal immune deposits drive a predominant neutrophilic infiltrate into
    the dermal papillae, forming the papillary microabscesses characteristic of
    DH histopathology. Gut-derived IL-8 primes neutrophils, which bind the
    deposited IgA directly through their Fc-alpha receptor (CD89, FCAR).
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  genes:
  - preferred_term: FCAR
    term:
      id: hgnc:3608
      label: FCAR
  biological_processes:
  - preferred_term: neutrophil migration
    term:
      id: GO:1990266
      label: neutrophil migration
    modifier: INCREASED
  molecular_functions:
  - preferred_term: Fc-alpha (IgA) receptor activity
    term:
      id: GO:0019766
      label: IgA receptor activity
  locations:
  - preferred_term: papillary layer of dermis
    term:
      id: UBERON:0001992
      label: papillary layer of dermis
  downstream:
  - target: Subepidermal Vesicle Formation
    causal_link_type: DIRECT
    description: >-
      Neutrophil accumulation and enzyme release at the dermal papillae detach
      the epidermis, forming subepidermal vesicles.
    evidence:
    - reference: PMID:33432477
      reference_title: 'Dermatitis Herpetiformis: An Update on Diagnosis and Management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        neutrophilic micro-abscesses in the dermal papillae with or without
        subepidermal blistering
      explanation: >-
        Links the papillary neutrophilic microabscesses to the subepidermal
        blister.
  - target: Pruritus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dermal inflammation drives the intense itch. Its mechanism (neurogenic
      inflammation, IL-31) is unresolved, and pruritus can precede the visible
      lesions by hours to months, so it is not simply a consequence of the
      vesicles.
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a predominant neutrophilic infiltrate at the dermal papillae at
      histopathology
    explanation: >-
      The neutrophilic papillary infiltrate is a defining histopathologic
      feature.
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Circulating and skin resident neutrophils express Fc IgA receptor (CD89),
      suggesting a direct interaction between neutrophils and IgA.
    explanation: >-
      Neutrophils bind the deposited IgA through the CD89 Fc-alpha receptor
      (FCAR).
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Activation of innate immunity in the gut leads to increased release of
      IL-8, which is thought to be responsible for the initial priming of
      neutrophils
    explanation: >-
      Gut-derived IL-8 primes the neutrophils recruited to the dermal papillae.
- name: Subepidermal Vesicle Formation
  biological_scale: TISSUE
  description: >-
    Neutrophil-mediated damage at the dermal papillae produces subepidermal
    vesicles that present clinically as grouped papules and small blisters,
    though intense scratching often destroys the primary lesions.
  locations:
  - preferred_term: epidermal-dermal junction
    term:
      id: UBERON:0008877
      label: epidermal-dermal junction
  downstream:
  - target: Pruritic papulovesicular eruption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11901200
      reference_title: Epidermal transglutaminase (TGase 3) is the autoantigen of dermatitis herpetiformis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is a bullous skin disease with polymorphic papules and blisters
        typically located over the extensor surfaces of the major joints
      explanation: >-
        The blistering eruption on extensor surfaces is the clinical outcome.
  evidence:
  - reference: PMID:31244841
    reference_title: 'Dermatitis Herpetiformis: Novel Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Activated neutrophils release neutrophil elastase and granzyme B, which
      induce subepidermal split by cleaving adhesion molecules of the BMZ, such
      as collagen VII
    explanation: >-
      Neutrophil elastase and granzyme B cleave basement-membrane-zone adhesion
      molecules to produce the subepidermal split — the node's own mechanism.
phenotypes:

name: Cribriform Neuroepithelial Tumor
creation_date: '2026-11-20T20:12:00Z'
category: Cancer
synonyms:
- CRINET
description: >-
  Cribriform neuroepithelial tumour (CRINET) is a rare SMARCB1-deficient tumour in and around the
  ventricles of young children, defined by cribriform strands and ribbons without the rhabdoid cells
  of atypical teratoid/rhabdoid tumour (AT/RT). Whether it is a distinct entity or a variant of
  AT/RT is open. In the largest cited series, of ten children and published in 2017, and the
  only cited study to compare the tumours' methylation with the AT/RT groups, all eight tumours with
  methylation data clustered inside the TYR group of AT/RT, all ten stained for tyrosinase as that
  group does, and, like that group, most had a large deletion of one SMARCB1 copy and a mutation of
  the other. But the children did far better: one of the ten died, a month after surgery, and the
  mean overall survival was 125 months against 53 months in 27 children with AT/RT of the TYR group.
  A summary of the WHO classification of paediatric tumours says it was introduced as a provisional
  entity, biologically distinct from AT/RT.
categories:
- Pediatric Cancer
- Central Nervous System Neoplasm
- SWI/SNF-Deficient Tumor
- Rare Cancer
parents:

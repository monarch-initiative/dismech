differential_diagnoses:
- name: Atypical teratoid/rhabdoid tumour
  disease_term:
    preferred_term: atypical teratoid rhabdoid tumor
    term:
      id: MONDO:0020560
      label: atypical teratoid rhabdoid tumor
  description: >-
    Its closest molecular match in the 2017 series. CRINET is a SMARCB1-deficient tumour that
    shares a highly similar genetic and epigenetic profile with the AT/RT TYR group, and
    tyrosinase staining with that group (10 of 10 CRINETs, against 9 of 10 AT/RT TYR and 1 of 10
    each of the other two groups in the 2017 series). It differs in its histology, cribriform
    strands and ribbons without rhabdoid tumour cells, whereas most, though not all, malignant
    rhabdoid tumours, AT/RT among them, contain rhabdoid cells, and in outcome: in the 2017 series
    its patients did much better than those with AT/RT TYR (mean overall survival 125 months in 10
    children against 53 months in 27 children with that tumour), while most malignant rhabdoid
    tumours, AT/RT among them, follow an aggressive and ultimately lethal course.
  distinguishing_features:
  - Cribriform strands and ribbons without rhabdoid tumour cells (all 10 tumours of the 2017 series); most, though not all, malignant rhabdoid tumours, AT/RT among them, contain rhabdoid cells.
  notes: >-
    Tyrosinase staining and the genetic and epigenetic profile are shared with the AT/RT TYR
    group, and SMARCB1 loss with malignant rhabdoid tumours, so they do not separate the two. The
    review's statement on rhabdoid cells covers malignant rhabdoid tumours at all sites; read for
    AT/RT, the absence of rhabdoid cells alone may not exclude it. The outcome difference comes
    from one series (10 children with CRINET against 27 with AT/RT TYR; the Outcome phase gives
    the figures) and is not listed as a distinguishing feature, since it cannot be used at
    diagnosis.
  evidence:
  - reference: PMID:27380723
    reference_title: >-

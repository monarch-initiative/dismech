histopathology:
- name: Cribriform strands without rhabdoid cells
  finding_term:
    preferred_term: cribriform pattern
    term:
      id: NCIT:C35920
      label: Cribriform Pattern
  diagnostic: true
  description: >-
    The defining histology: cribriform strands, ribbons and trabeculae with small lumina, and no
    rhabdoid cells. The 2017 series counts these features as distinct from atypical
    teratoid/rhabdoid tumour; a review notes that most, but not all, rhabdoid tumours, AT/RT among
    them, contain rhabdoid cells, so their absence alone does not settle the question. A summary of
    the WHO classification of paediatric tumours says the tumour was introduced as a provisional
    entity, biologically distinct from AT/RT.
  evidence:
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On histopathological examination, all CRINETs were characterized by the presence of cribriform
      strands and ribbons. In more compact areas, small lumina were also present, but rhabdoid tumor
      cells showing eosinophilic cytoplasms and eccentric nuclei with prominent nucleoli were absent
    explanation: >-
      The histology of all ten tumours of the 2017 series.
  - reference: PMID:23495723
    reference_title: >-
      Cribriform neuroepithelial tumor arising in the lateral ventricle.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor cells were small, primitive appearing, and arranged in cribriform and trabecular
      patterns with interspersed solid cellular areas. Rhabdoid cells were absent.
    explanation: >-
      The same pattern in a single case.
  - reference: PMID:34921008
    reference_title: >-
      A Summary of the Inaugural WHO Classification of Pediatric Tumors: Transitioning from the
      Optical into the Molecular Era.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cribriform neuroepithelial tumor (CRINET), typically associated with SMARCB1 mutations yet
      biologically distinct from atypical teratoid/rhabdoid tumor (AT/RT), was introduced as a
      provisional entity
    explanation: >-
      Supports the row's sentence on the tumour's WHO standing. INDIRECT for the histology itself,
      which the summary does not describe.
  - reference: PMID:29280680
    reference_title: >-
      SMARCB1-deficient Tumors of Childhood: A Practical Guide.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prototypical SMARCB1-deficient tumor is the malignant rhabdoid tumor (MRT) which was first
      described in the kidney but also occurs in soft tissue, viscera, and the brain (where it is
      referred to as atypical teratoid rhabdoid tumor or AT/RT). ... Morphologically, most but not
      all contain a population of "rhabdoid" cells, which are large cells with abundant cytoplasm,
      perinuclear spherical inclusions, and eccentric vesicular nuclei with large inclusion-like
      nucleoli.
    explanation: >-
      The review's caveat on malignant rhabdoid tumour, which in the brain is AT/RT: most, not all,
      contain rhabdoid cells. INDIRECT for this row: it qualifies the diagnostic reading rather than
      describing this tumour.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, CRINET represents a SMARCB1-deficient non-rhabdoid tumor, which shares
      molecular similarities with the ATRT-TYR subgroup but has distinct histopathological features
      and favorable long-term outcome.
    explanation: >-
      The series' conclusion: molecular similarity to the AT/RT TYR group with distinct
      histopathological features.
- name: Loss of nuclear SMARCB1 (INI1)
  finding_term:
    preferred_term: loss of nuclear SMARCB1 (INI1) expression
  diagnostic: true
  description: >-
    Nuclear SMARCB1 (INI1) is absent from the tumour cells and kept in the normal cells around them.

discussions:
- discussion_id: crinet_entity_or_variant
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the cribriform neuroepithelial tumour a distinct entity, or a variant of atypical
    teratoid/rhabdoid tumour, specifically of the TYR group that the eight profiled tumours of the
    2017 series clustered with by methylation?
  attaches_to:
  - disease#Cribriform Neuroepithelial Tumor
  - progression#Outcome
  - diagnosis#DNA methylation profiling
  - histopathology#Cribriform strands without rhabdoid cells
  - histopathology#Tyrosinase staining
  - pathophysiology#Biallelic SMARCB1 Inactivation
  rationale: >-
    No cited source settles the question, though the classification leans to the distinct reading,
    provisionally, and a review places the tumour, by inference, outside the spectrum of malignant
    rhabdoid tumour and AT/RT. A 2022 summary of the inaugural WHO classification of paediatric
    tumours, which shares an author with the 2017 series, says the tumour was introduced as a
    provisional entity, biologically distinct from AT/RT; a 2018 review, after noting
    SMARCB1-deficient tumours described outside the spectrum of malignant rhabdoid tumour and AT/RT,
    names this tumour, in addition to those two, among paediatric tumours with complete SMARCB1
    loss. A 2022 letter lists it in passing as benign, beside malignant AT/RT. A 2023 case report
    and literature review still calls it a provisional category, sharing similarities with AT/RT,
    with little data on its pathology and prognosis. The 2017 series poses the question and reports
    data that bear both ways: distinct histology (cribriform strands and ribbons without rhabdoid
    cells, though the same review notes that most, not all, malignant rhabdoid tumours contain
    rhabdoid cells, so their absence alone does not settle it) and a much better outcome than AT/RT
    TYR (mean overall survival 125 against 53 months, in a small, retrospective series, as the
    Outcome phase records, the Chemotherapy row also noting that the series is retrospective;
    separately, the authors note that the prognostic role of AT/RT's molecular groups has still to
    be determined in large registries), but methylation profiles that clustered within the AT/RT TYR
    group, tyrosinase staining as in that group, and SMARCB1 mutations distributed much as in it
    (ten AT/RTs of each group in the tyrosinase and mutation comparisons; the text hedges the
    mutation distribution as 'seems to be quite similar', and the legend of the figure, which plots
    only second-allele hits, does not). Its conclusion keeps both sides and calls the tumour neither
    a distinct entity nor a variant. The series compares the situation with desmoplastic
    medulloblastoma, which, citing earlier work, it describes as genetically and epigenetically
    indistinguishable from classic SHH medulloblastoma but different in outcome, and concludes that
    histology and molecular profiling are complementary. It found neither exon 1 mutations nor the
    mosaic SMARCB1 staining typical of schwannomatosis-associated schwannomas, but, as its antibody
    binds a relatively C-terminal part of the protein, it cannot entirely exclude that a truncated
    SMARCB1 protein with some residual function underlies the tumour's less aggressive behaviour.
    The question rests largely on that one series of ten children, eight of them with methylation
    data.
  evidence:
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the long-term outcome is unclear and it remains uncertain whether CRINET represents a
      distinct entity or a variant of ATRT.
    explanation: >-
      The question as the 2017 series poses it in its abstract, in general terms: a distinct entity
      or a variant of AT/RT. The prompt's TYR group comes from the series' methylation clustering.
  - reference: PMID:34921008
    reference_title: >-
      A Summary of the Inaugural WHO Classification of Pediatric Tumors: Transitioning from the
      Optical into the Molecular Era.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cribriform neuroepithelial tumor (CRINET), typically associated with SMARCB1 mutations yet
      biologically distinct from atypical teratoid/rhabdoid tumor (AT/RT), was introduced as a
      provisional entity
    explanation: >-
      The distinct reading: a 2022 summary of the inaugural WHO classification of paediatric tumours
      says the tumour was introduced as a provisional entity, biologically distinct from AT/RT.
  - reference: PMID:35195707
    reference_title: >-
      Clinical management of desmoplastic myxoid tumor, SMARCB1-mutant.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intracranial SMARCB1-deficient tumors primarily arise in children and include malignant
      atypical teratoid/rhabdoid tumor (ATRT), benign cribriform neuroepithelial tumor, and poorly
      differentiated chordoma.
    explanation: >-
      A 2022 letter about another SMARCB1-deficient tumour lists this one as benign beside malignant
      AT/RT, in passing and citing earlier work.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, CRINET represents a SMARCB1-deficient non-rhabdoid tumor, which shares
      molecular similarities with the ATRT-TYR subgroup but has distinct histopathological features
      and favorable long-term outcome.
    explanation: >-
      The 2017 series' conclusion: molecular similarities with AT/RT TYR, but distinct histology and
      a favourable long-term outcome. It does not call the tumour either a distinct entity or a
      variant.
  - reference: PMID:29280680
    reference_title: >-
      SMARCB1-deficient Tumors of Childhood: A Practical Guide.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prototypical SMARCB1-deficient tumor is the malignant rhabdoid tumor (MRT) which was first
      described in the kidney but also occurs in soft tissue, viscera, and the brain (where it is
      referred to as atypical teratoid rhabdoid tumor or AT/RT). ... Morphologically, most but not
      all contain a population of "rhabdoid" cells, which are large cells with abundant cytoplasm,
      perinuclear spherical inclusions, and eccentric vesicular nuclei with large inclusion-like
      nucleoli.
    explanation: >-
      A review's caveat on malignant rhabdoid tumour, which in the brain is AT/RT: most, not all,
      contain rhabdoid cells. INDIRECT: it qualifies the histological argument for a distinct
      entity; the quoted sentences do not speak of this tumour.
  - reference: PMID:29280680
    reference_title: >-
      SMARCB1-deficient Tumors of Childhood: A Practical Guide.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the widespread adoption of SMARCB1 immunohistochemistry, an increasing number of
      SMARCB1-deficient tumors outside of the MRT-AT/RT spectrum have been described. In addition
      to MRT and AT/RT, pediatric tumors with complete loss of SMARCB1 expression include
      cribriform neuroepithelial tumor, renal medullary carcinoma, and epithelioid sarcoma.
    explanation: >-
      For the distinct reading: after noting SMARCB1-deficient tumours described outside the
      spectrum of malignant rhabdoid tumour (MRT) and AT/RT, the same review names this tumour, in
      addition to those two, among paediatric tumours with complete SMARCB1 loss. INDIRECT: that
      this tumour is one of those outside the spectrum is an inference across the two sentences.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, despite the highly similar (epi)genetic profiles of CRINETs and ATRT‐TYR tumors,
      patients harboring CRINETs experience relatively favorable long‐term outcomes and do much
      better than patients with ATRT‐TYR tumors.
    explanation: >-
      Data bearing both ways in one sentence: highly similar genetic and epigenetic profiles to
      AT/RT TYR, but a much better outcome.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, the potential prognostic role of molecular subgrouping in ATRT will need to be
      determined in the carefully characterized patient cohorts of large international registries.
    explanation: >-
      The series adds, as a call for future work, that the prognostic role of AT/RT's molecular
      groups is still to be determined in large registries; read here as bearing on the TYR
      benchmark that the outcome comparison uses. INDIRECT: it does not speak of this tumour.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On unsupervised cluster analysis of methylation profiles using the 5000 most differentially
      methylated CpG sites across all samples, all eight CRINETs for which sufficient DNA was
      available for examination, exclusively clustered within the ATRT‐TYR molecular subgroup
      (Figure 2A).
    explanation: >-
      Data for the variant reading: all eight profiled tumours clustered within the AT/RT TYR group.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, 10/10 CRINETs exhibited staining for tyrosinase (Figure 1C), which was also
      observed in 9/10 ATRTs of the ATRT‐TYR subgroup, but only in 1/10 tumors of the ATRT‐SHH and
      ATRT‐MYC subgroup, respectively, (Chi‐square: 29.2, df:3; P < 0.00001). Tyrosinase staining in
      CRINETs was cytoplasmic and heterogeneous as observed in ATRTs of the ATRT‐TYR subgroup.
    explanation: >-
      Data for the variant reading: tyrosinase staining in all ten tumours, as in AT/RT TYR and
      unlike the other two groups (ten tumours each).
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution of mutations across the SMARCB1 gene encountered in CRINET seems to be quite
      similar to that of ATRT‐TYR, but distinct from those seen in ATRT‐SHH or ATRT‐MYC.
    explanation: >-
      Data for the variant reading, hedged by the series: the SMARCB1 mutations seem to be
      distributed across the gene much as in AT/RT TYR, and unlike the other two groups (ten
      AT/RTs per group; the series' figure plots only the hits on the second allele).
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMARCB1 mutations encountered on FISH, MLPA and sequencing in CRINETs as compared to ATRTs of
      the molecular subgroups TYR, SHH and MYC (n = 10 each). Note similar distribution of mutations
      across the SMARCB1 gene in CRINET and ATRT‐TYR. Plotted are only hits affecting the second
      SMARCB1 allele.
    explanation: >-
      The legend of the series' Figure 3, which compares the tumours with ten AT/RTs of each
      group: the hits on the second SMARCB1 allele are distributed much as in AT/RT TYR. The
      legend states it without the text's hedge.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This situation is reminiscent of desmoplastic medulloblastomas, which are also genetically and
      epigenetically indistinguishable from classic medulloblastomas of the SHH subtype, but still
      show a difference in outcome 15, 16 and provides another example that information obtained on
      histopathologic analysis and molecular profiling is not redundant, but rather complementary.
    explanation: >-
      The 2017 series' own reading: like desmoplastic medulloblastoma, a tumour can match a
      molecular group and still differ in outcome, so histology and molecular profiling are
      complementary. INDIRECT: it bears on the question by analogy with desmoplastic
      medulloblastoma, for whose genetics and outcome it cites earlier work.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither exon 1 mutations nor the mosaic SMARCB1 staining pattern typical for
      schwannomatosis‐associated schwannomas 20 were encountered in CRINET patients. Nevertheless,
      as the BAF47 antibody is directed against a relatively C‐terminal epitope (amino acids
      257‐359), the possibility that a truncated SMARCB1 protein with some residual function could
      be responsible for the less aggressive biological behavior of CRINET cannot be entirely
      excluded and warrants attention in future studies.
    explanation: >-
      The series found neither exon 1 mutations nor the mosaic staining of
      schwannomatosis-associated schwannomas, but, as its antibody binds a relatively C-terminal
      epitope, it cannot entirely exclude that a truncated SMARCB1 protein with some residual
      function underlies the milder behaviour. INDIRECT: it bears on the question only by inference
      about mechanism, and does not name AT/RT.
  - reference: PMID:36884098
    reference_title: >-
      Transcallosal and endoscopic hybrid approach to a rare entity of pediatric intraventricular
      tumors-cribriform neuroepithelial tumor: a case report and literature review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cribriform neuroepithelial tumor (CRINET) is a provisional category of intraventricular
      tumors, sharing similarities with AT/RTs, and there is a lack of data about its pathology,
      prognosis, and surgical approaches in the literature.
    explanation: >-
      A 2023 case report and literature review: a provisional category sharing similarities with
      AT/RT, with little data on its pathology and prognosis.
notes: >-
  The entry treats the tumour as its own disease, as MONDO does (MONDO:1060254, under central
  nervous system cancer rather than under atypical teratoid rhabdoid tumor) and as the
  Atypical_Teratoid_Rhabdoid_Tumor entry does by listing it as a differential diagnosis. The
  evidence for the other reading, a variant of AT/RT (its TYR group), is recorded on the methylation
  and tyrosinase rows and on the SMARCB1 node (the same large deletion and second hit); the evidence
  for a distinct entity on the histology and outcome rows; the discussion crinet_entity_or_variant
  sets the two readings side by side. The 2017 series is the only cited one to
  compare the tumours' methylation and outcome with AT/RT; a three-tumour genomic study may share
  cases with it, and its ten children include several earlier case reports, so these sources are not
  independent. Each presenting sign is quoted from a single child, so no phenotype row carries a
  frequency.

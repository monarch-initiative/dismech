progression:
- phase: Outcome
  description: >-
    Much better than atypical teratoid/rhabdoid tumour of the TYR group, the group the tumour
    resembles molecularly: mean overall survival 125 months in the ten children of the 2017 series
    against 53 months in 27 children with that tumour. To the authors' knowledge nine of the ten
    were alive and well; one died of respiratory failure a month after surgery. The numbers are
    small and the series retrospective.
  evidence:
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated mean overall survival in patients with CRINETs was 125 months (95% confidence
      interval 100-151 months) as compared to only 53 (33-74) months in patients with ATRTs of the
      ATRT-TYR subgroup (Log-Rank P < 0.05).
    explanation: >-
      The survival comparison, which bears on treating the tumour as its own disease.
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, except for one child, who died one month postoperatively from respiratory
      failure, to our knowledge all patients with CRINET of the present series are alive and well.
    explanation: >-
      Nine of ten alive and well, to the authors' knowledge.
pathophysiology:
- name: Biallelic SMARCB1 Inactivation
  description: >-
    SMARCB1 protein is lost in every tumour, and a hit on each copy was found in most of those
    studied. In the 2017 series a large deletion takes one copy in nine of the ten tumours, mainly
    with a mutation of the other copy, and the one tumour without the deletion had a truncating
    mutation on both copies through loss of heterozygosity; in two children the mutation was also
    present in the germline.

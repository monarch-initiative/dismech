    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, despite the highly similar (epi)genetic profiles of CRINETs and ATRT‐TYR
      tumors, patients harboring CRINETs experience relatively favorable long‐term outcomes and do
      much better than patients with ATRT‐TYR tumors.
    explanation: >-
      The 2017 series' comparison: despite highly similar genetic and epigenetic profiles,
      children with CRINET did much better than those with AT/RT TYR.

- name: Tyrosinase staining
  finding_term:
    preferred_term: cytoplasmic tyrosinase staining
  description: >-
    All ten tumours of the 2017 series stained for tyrosinase, as nine of ten atypical
    teratoid/rhabdoid tumours of the TYR group did and one of ten of each of the other two groups.
    It is one of the findings that tie the tumour to that group.
  notes: >-
    Unbound. NCIT has NCIT:C128846 Tyrosinase Positive, but it sits under Expression Positive, a
    laboratory test result outside the roots this slot accepts.
  evidence:
  - reference: PMID:27380723
    reference_title: >-
      Cribriform neuroepithelial tumor: molecular characterization of a SMARCB1-deficient
      non-rhabdoid tumor with favorable long-term outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, 10/10 CRINETs exhibited staining for tyrosinase (Figure 1C), which was also
      observed in 9/10 ATRTs of the ATRT‐TYR subgroup, but only in 1/10 tumors of the ATRT‐SHH and
      ATRT‐MYC subgroup, respectively, (Chi‐square: 29.2, df:3; P < 0.00001). Tyrosinase staining in
      CRINETs was cytoplasmic and heterogeneous as observed in ATRTs of the ATRT‐TYR subgroup.
    explanation: >-
      Tyrosinase in all ten, compared with the three AT/RT groups.

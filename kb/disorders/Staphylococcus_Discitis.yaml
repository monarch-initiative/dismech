name: Staphylococcus Discitis
creation_date: "2026-09-30T09:32:58Z"
description: >-
  Staphylococcus discitis is a pyogenic bacterial infection of the
  intervertebral disc and adjacent vertebral endplates in which Staphylococcus
  aureus or another staphylococcus seeds the discovertebral unit, expands across
  poorly vascularized disc-endplate tissue, activates osteoblast inflammatory
  and resorptive signaling, and can extend into vertebral bone, paraspinal soft
  tissue, or the epidural space.
category: Infectious Disease
disease_term:
  preferred_term: staphylococcus discitis
  term:
    id: MONDO:8000001
    label: staphylococcus discitis
parents:
- Bacterial arthritis
- Staphylococcus aureus infection
synonyms:
- Staphylococcal discitis
- Staphylococcus aureus discitis
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Staphylococcus aureus, including methicillin-susceptible and
    methicillin-resistant isolates, is the leading organism recovered from
    pyogenic infectious spondylodiscitis cohorts.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Staphylococcus aureus was the most common pathogen, with 34 cases,
      representing 64% of pyogenic spondylodiscitis.
    explanation: >-
      A 14-year infectious-spondylodiscitis cohort found S. aureus as the
      dominant pyogenic isolate.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
prevalence:
- population: Infectious spondylodiscitis cohort
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    A 14-year retrospective Trieste cohort reported all-cause infectious
    spondylodiscitis incidence, not Staphylococcus-only discitis incidence.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The incidence of IS was 3 cases per 100,000 inhabitants per year.
    explanation: >-
      Reports the annual incidence for all-cause infectious spondylodiscitis in
      the cohort catchment population.
transmission:
- name: Hematogenous or iatrogenic discovertebral seeding
  description: >-
    Staphylococci seed the intervertebral disc and adjacent endplates through
    bloodstream spread or direct inoculation during spinal instrumentation.
pathophysiology:
- name: Hematogenous Staphylococcal Discovertebral Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    S. aureus reaches the sterile disc-endplate complex, most often after
    bloodstream spread from a distant focus or after direct inoculation around
    spinal instrumentation.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  downstream:
  - target: Disc-Endplate Bacterial Expansion
    causal_link_type: DIRECT
    description: >-
      Seeded organisms proliferate within the contiguous intervertebral disc and
      vertebral-endplate niche.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Blood cultures were positive in 47% of pyogenic cases, 25% of all cases.
    explanation: >-
      Supports bloodstream detection of the causal organism in nearly half of
      pyogenic spondylodiscitis cases in a human cohort.
- name: Disc-Endplate Bacterial Expansion
  biological_scale: TISSUE
  description: >-
    Staphylococci proliferate across intervertebral disc and adjacent vertebral
    bone, converting local seeding into infectious spondylodiscitis.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: bony vertebral centrum
    term:
      id: UBERON:0001075
      label: bony vertebral centrum
  downstream:
  - target: Protein A-TNFR1 Osteoblast Inflammatory Signaling
    causal_link_type: DIRECT
    description: >-
      S. aureus adhesins and cell-wall factors contact osteoblast-lineage cells
      and stimulate JNK, TLR2, cytokine, and RANKL responses.
  evidence:
  - reference: PMID:18485785
    reference_title: "Percutaneous inoculated rabbit model of intervertebral disc space infection: magnetic resonance imaging features with pathological correlation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Disc space infections were present in all animals. MRI detected vertebral
      and discal abnormalities as soon as, respectively, 5 and 10 days after
      inoculation.
    explanation: >-
      Shows that bacterial inoculation can establish disc-space infection that
      expands to produce discal and vertebral abnormalities in vivo.
- name: Protein A-TNFR1 Osteoblast Inflammatory Signaling
  biological_scale: CELLULAR
  description: >-
    S. aureus protein A binds TNFR1 on preosteoblast-lineage cells and activates
    JNK and TLR2-linked inflammatory signaling.
  cell_types:
  - preferred_term: preosteoblast
    term:
      id: CL:0007010
      label: preosteoblast
  biological_processes:
  - preferred_term: toll-like receptor 2 signaling pathway
    term:
      id: GO:0034134
      label: toll-like receptor 2 signaling pathway
  downstream:
  - target: Staphylococcal RANKL Induction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TNFR1-dependent JNK signaling contributes to TLR2 expression and RANKL
      induction in S. aureus-infected osteoblast-lineage cells.
  evidence:
  - reference: PMID:26846887
    reference_title: Knockdown of TNFR1 Suppresses Expression of TLR2 in the Cellular Response to Staphylococcus aureus Infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Previous studies have demonstrated that the S. aureus protein SpA binds
      directly to pre-osteoblastic cells via tumor necrosis factor receptor-1
      (TNFR-1).
    explanation: >-
      Supports direct interaction between S. aureus protein A and
      osteoblast-lineage host cells.
- name: Staphylococcal RANKL Induction
  biological_scale: CELLULAR
  description: >-
    TNFR1-dependent JNK and TLR2 responses in S. aureus-infected
    osteoblast-lineage cells increase RANKL, a pro-osteoclastogenic signal that
    can couple local infection to bone resorption.
  cell_types:
  - preferred_term: preosteoblast
    term:
      id: CL:0007010
      label: preosteoblast
  biological_processes:
  - preferred_term: positive regulation of osteoclast differentiation
    term:
      id: GO:0045672
      label: positive regulation of osteoclast differentiation
  downstream:
  - target: Vertebral Endplate Destruction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Osteoclastogenic signaling contributes to inflammatory bone loss adjacent
      to the infected disc-endplate niche.
  evidence:
  - reference: PMID:26846887
    reference_title: Knockdown of TNFR1 Suppresses Expression of TLR2 in the Cellular Response to Staphylococcus aureus Infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Knockdown of TNFR1 not only inhibited the JNK pathway but also reduced
      TLR2 protein and RANKL levels in S. aureus-infected cells.
    explanation: >-
      Links TNFR1 to JNK, TLR2, and RANKL responses in S. aureus-infected
      osteoblast cultures.
- name: Vertebral Endplate Destruction
  biological_scale: TISSUE
  description: >-
    Disc-endplate infection can erode adjacent vertebral bone and impair the
    structural disc-vertebra interface.
  locations:
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  downstream:
  - target: Epidural or Paravertebral Extension
    causal_link_type: DIRECT
    description: >-
      Local destruction allows contiguous spread into paraspinal and epidural
      compartments.
  - target: Back Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Local vertebral and discal infection produces the focal spinal pain that
      dominates clinical presentation.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The disease can lead to significant complications such as abscess
      formation and vertebral destruction, which may result in neurological
      impairments
    explanation: >-
      Supports vertebral destruction as part of the infectious
      spondylodiscitis complication spectrum.
- name: Epidural or Paravertebral Extension
  biological_scale: TISSUE
  description: >-
    Infection extends contiguously into paravertebral muscles or the epidural
    space, producing abscesses that can injure nerve roots.
  locations:
  - preferred_term: vertebral canal
    term:
      id: UBERON:0006692
      label: vertebral canal
  downstream:
  - target: Epidural or Paravertebral Abscess
    causal_link_type: DIRECT
    description: >-
      Contiguous extension from the infected discovertebral unit forms epidural
      or paravertebral abscesses.
  - target: Radicular Nerve Damage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Epidural or paravertebral extension can compress or inflame nerve roots.
  evidence:
  - reference: PMID:40204566
    reference_title: Pyogenic Vertebral Osteomyelitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These infections can often spread contiguously to adjacent paraspinal
      structures, including paravertebral muscles and the epidural space
    explanation: >-
      Supports local extension from infected disc and vertebral bone into
      adjacent paraspinal and epidural spaces.
phenotypes:
- name: Back Pain
  phenotype_term:
    preferred_term: Back pain
    term:
      id: HP:0003418
      label: Back pain
  description: >-
    Local disc-endplate infection presents with focal spinal pain in most
    infectious spondylodiscitis cohorts.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Back pain (79%) and fever (72%) were the most common symptoms.
    explanation: >-
      Reports back pain as the most common symptom in a human
      infectious-spondylodiscitis cohort.
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  description: >-
    Fever is a frequent systemic inflammatory manifestation of pyogenic
    spondylodiscitis.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Back pain (79%) and fever (72%) were the most common symptoms.
    explanation: >-
      Reports fever as one of the two most common symptoms in a human
      infectious-spondylodiscitis cohort.
- name: Bacteremia
  phenotype_term:
    preferred_term: Bacteremia
    term:
      id: HP:0031864
      label: Bacteremia
  description: >-
    Staphylococcal discitis can be accompanied by positive blood cultures that
    identify the bloodstream source organism.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Blood cultures were positive in 47% of pyogenic cases, 25% of all cases.
    explanation: >-
      Supports bacteremia or blood-culture positivity as a common diagnostic
      finding in pyogenic spondylodiscitis.
- name: Radicular Nerve Damage
  description: >-
    Epidural or paravertebral extension can involve nerve roots and cause
    radicular neurologic injury in infectious spondylodiscitis.
  notes: >-
    HP search `runoak -i ols:hp search radicul` returned radiculomegaly,
    dermatomal and nerve-root-neurofibroma terms, but no radiculopathy or
    radicular-nerve-damage phenotype term.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Major complications included radicular nerve damage (51%),
      epidural/paravertebral abscesses (45%), endocarditis (14%), and a need for
      surgical intervention in 8%, with persistent neurological sequelae in 3%.
    explanation: >-
      Reports radicular nerve damage as a major complication in a human
      infectious-spondylodiscitis cohort.
- name: Epidural or Paravertebral Abscess
  phenotype_term:
    preferred_term: Spinal epidural abscess
    term:
      id: HP:0033181
      label: Spinal epidural abscess
  description: >-
    Local spread from the infected discovertebral unit commonly forms spinal
    epidural abscesses; the cited cohort groups epidural and paravertebral
    abscesses together.
  notes: >-
    HP search `runoak -i ols:hp search epidural` returned `HP:0033181` Spinal
    epidural abscess. The broader abscess search also returned the fallback
    `HP:0025615` Abscess, but no paravertebral-abscess term.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Major complications included radicular nerve damage (51%),
      epidural/paravertebral abscesses (45%), endocarditis (14%), and a need for
      surgical intervention in 8%, with persistent neurological sequelae in 3%.
    explanation: >-
      Reports epidural or paravertebral abscesses among major complications of
      infectious spondylodiscitis.
- name: Endocarditis
  phenotype_term:
    preferred_term: Endocarditis
    term:
      id: HP:0100584
      label: Endocarditis
  description: >-
    Endocarditis can coexist with infectious spondylodiscitis as another focus
    of invasive bacterial infection.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Major complications included radicular nerve damage (51%),
      epidural/paravertebral abscesses (45%), endocarditis (14%), and a need for
      surgical intervention in 8%, with persistent neurological sequelae in 3%.
    explanation: >-
      Reports endocarditis as a clinically recognized complication or companion
      infection in the spondylodiscitis cohort.
- name: Elevated C-reactive protein
  phenotype_term:
    preferred_term: Elevated circulating C-reactive protein concentration
    term:
      id: HP:0011227
      label: Elevated circulating C-reactive protein concentration
  description: >-
    Pyogenic vertebral osteomyelitis usually has elevated circulating CRP,
    reflecting systemic inflammation.
  evidence:
  - reference: PMID:34091001
    reference_title: "Clinical characteristics of pyogenic vertebral osteomyelitis, and factors associated with inadequate treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of 106 patients included, 87% presented with pain in the spine, 97%
      elevated CRP, 14% severe sepsis, and 13% with a history of previous spinal
      surgery.
    explanation: >-
      Reports elevated CRP in nearly all patients in a pyogenic vertebral
      osteomyelitis cohort.
progression:
- phase: Complicated or relapsing infectious spondylodiscitis
  notes: >-
    Infectious spondylodiscitis can require surgical debridement, recur during
    or after appropriate therapy, or cause infection-related death.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the analyzed cohort of IS patients, the following unfavorable outcomes
      were observed: infection-related deaths occurred in 6 cases (6.1%),
      including 5 cases of PS and 1 case of IS of unknown origin; recurrences
      were reported in 7 cases (7.1%), with 5 occurring in PS and 2 in IS of
      unknown etiology; and 8 (8.2%) patients required surgical debridement,
      including 3 with PS and 5 with IS of unknown etiology.
    explanation: >-
      Quantifies death, recurrence and surgical debridement as clinically
      important outcomes in a human infectious-spondylodiscitis cohort.
diagnosis:
- name: MRI and PET/CT imaging
  description: >-
    MRI, PET/CT, or scintigraphy confirms vertebral and intervertebral-disc
    abnormalities when clinical features raise suspicion for infectious
    spondylodiscitis.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Diagnosis of IS was performed through imaging studies, such as MRI,
      positron emission tomography/computed tomography (PET/CT) or scintigraphy
      scan, which confirmed the clinical suspicion of vertebral and
      intervertebral disc abnormalities.
    explanation: >-
      Describes imaging confirmation with MRI, PET/CT, or scintigraphy in a
      retrospective infectious-spondylodiscitis cohort.
- name: Blood culture or vertebral biopsy microbiology
  description: >-
    Blood cultures and CT-guided or open biopsy establish the etiologic organism
    and guide pathogen-directed antimicrobial treatment.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The etiological diagnosis of spondylodiscitis was established by (i)
      culture of CT-guided percutaneous needle aspiration/biopsy, or (ii) open
      neurosurgical vertebral or paravertebral and vertebral biopsy, or (iii)
      blood cultures
    explanation: >-
      Describes the culture sources used for etiologic diagnosis in infectious
      spondylodiscitis.
treatments:
- name: Six-Week Pathogen-Directed Antibiotic Therapy
  description: >-
    Microbiologically confirmed pyogenic vertebral osteomyelitis can be treated
    with a six-week course of pathogen-directed antibiotics when source control
    and host factors are appropriate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Disc-Endplate Bacterial Expansion
    treatment_effect: INHIBITS
    description: >-
      Antibiotics active against the isolate reduce staphylococcal viability
      within the infected disc-endplate complex.
  evidence:
  - reference: PMID:25468170
    reference_title: "Antibiotic treatment for 6 weeks versus 12 weeks in patients with pyogenic vertebral osteomyelitis: an open-label, non-inferiority, randomised, controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      6 weeks of antibiotic treatment is not inferior to 12 weeks of antibiotic
      treatment with respect to the proportion of patients with pyogenic
      vertebral osteomyelitis cured at 1 year
    explanation: >-
      A randomized noninferiority trial supports six weeks of antibiotic therapy
      as sufficient for many microbiologically confirmed pyogenic vertebral
      osteomyelitis cases.
- name: Spinal Surgical Source Control
  description: >-
    Surgical debridement, decompression, or stabilization is reserved for
    selected spinal infection cases with neurologic compromise, instability,
    abscess burden, persistent bacteremia, or failure of medical therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Epidural or Paravertebral Extension
    treatment_effect: INHIBITS
    description: >-
      Surgery removes infected tissue, drains epidural or paraspinal extension,
      decompresses neural elements, or stabilizes a destructed spine.
  - target: Vertebral Endplate Destruction
    treatment_effect: INHIBITS
    description: >-
      Stabilization or debridement can address destructive vertebral disease
      when infection has caused instability or deformity.
  evidence:
  - reference: PMID:41023355
    reference_title: "Infectious spondylodiscitis: Epidemiology, diagnosis, microbiological findings, clinical features and outcomes in a 14-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Surgical intervention is indicated in cases involving spinal cord or nerve
      root compression, instability, vertebral deformities, pathological
      fractures, or abscess drainage
    explanation: >-
      States the anatomic and neurologic indications for surgery in infectious
      spondylodiscitis.
animal_models:
- name: Percutaneous rabbit disc-space infection
  species: Rabbit
  description: >-
    Fluoroscopy-guided inoculation of S. aureus into the lumbar disc of New
    Zealand White rabbits produces reproducible disc-space infection that can
    be followed by MRI and pathology.
  modeled_mechanisms:
  - target: Disc-Endplate Bacterial Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Direct inoculation establishes local S. aureus infection within the disc
      space.
  - target: Vertebral Endplate Destruction
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The rabbit model develops vertebral and discal abnormalities after
      intradiscal inoculation.
  - target: Epidural or Paravertebral Extension
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Direct inoculation bypasses hematogenous seeding but can develop epidural
      involvement downstream of local disc-space infection.
  evidence:
  - reference: PMID:18485785
    reference_title: "Percutaneous inoculated rabbit model of intervertebral disc space infection: magnetic resonance imaging features with pathological correlation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Disc space infections were present in all animals. MRI detected vertebral
      and discal abnormalities as soon as, respectively, 5 and 10 days after
      inoculation.
    explanation: >-
      Shows that percutaneous S. aureus inoculation reproducibly creates a
      rabbit disc-space infection with vertebral and disc abnormalities.
review_notes: >-
  Duplicate preflight found no exact MONDO:8000001 or exact-label local entry in
  ignored-inclusive searches and no all-state GitHub PR or issue carrying the
  same MONDO identifier before this entry was seeded. Curation used the
  OpenScientist fallback report as a lead list but avoided generated term
  suggestions for UBERON:0002103 intervertebral disc, HP:0500152 radicular pain,
  HP:0012062 epidural abscess, and NCIT:C1338/NCIT:C61735/NCIT:C157866
  anti-staphylococcal drugs because all resolved to unrelated cached labels.

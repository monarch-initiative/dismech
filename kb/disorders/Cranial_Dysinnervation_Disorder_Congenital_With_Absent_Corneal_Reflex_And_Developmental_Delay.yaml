      label: neuron fate commitment
  - preferred_term: cranial ganglion development
    modifier: ABNORMAL
    term:
      id: GO:0061550
      label: cranial ganglion development
  evidence:
  - reference: PMID:9539122
    reference_title: neurogenin1 is essential for the determination of neuronal precursors for proximal cranial sensory ganglia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ngn1 is expressed by placodal ectodermal cells and acts prior to neuroblast delamination."
    explanation: Places the requirement in the placodal ectoderm and before delamination, which is what makes this a determination step.
  - reference: PMID:9539122
    reference_title: neurogenin1 is essential for the determination of neuronal precursors for proximal cranial sensory ganglia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ngn1 is required for the activation of a cascade of downstream bHLH factors, including NeuroD, MATH3, and NSCL1."
    explanation: Names the downstream cascade that fails to be activated, which is the transcriptional content of this node.
  - reference: PMID:23419067

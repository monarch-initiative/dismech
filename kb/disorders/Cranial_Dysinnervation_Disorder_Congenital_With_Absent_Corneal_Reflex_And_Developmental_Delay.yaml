    The cornea loses both its sensory supply and the trophic support that supply
    provides. Corneal nerves do two things: they carry sensation, and they
    release neuropeptides that keep the epithelium metabolically and mitotically
    active. Losing them therefore costs both the reflex and the tissue, which is
    why this node branches to an absent reflex on one side and to epithelial
    breakdown on the other.

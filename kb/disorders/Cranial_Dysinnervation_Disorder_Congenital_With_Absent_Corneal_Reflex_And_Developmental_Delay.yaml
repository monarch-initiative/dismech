animal_models:
- name: Neurog1-null mouse
  species: Mouse
  genotype: Neurog1 homozygous null
  publication: PMID:9539122
  description: >-
    The constitutive Neurog1 knockout is the model that carried the mechanism
    before any human case was reported, and the model each of the four human
    reports argues from. It fails to generate the proximal cranial sensory
    neurons, loses all inner-ear innervation, and develops a small cochlea with
    structurally normal hair cells.
  modeled_mechanisms:
  - target: Vestibulocochlear Ganglion and Nerve Agenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Inner-ear sensory neurons are completely absent and no afferent fibre
      reaches the ear, which is the mouse counterpart of the imaged eighth-nerve
      agenesis in patients.
    limitations: >-
      The mouse lesion is complete absence, whereas human imaging describes a
      range from agenesis to severe hypoplasia or truncation, so the human
      deficit is at least sometimes partial. The mouse null also dies within
      about 12 hours of birth, so the model cannot report the natural history
      that patients live through.
    readouts:
    - name: Afferent, efferent and autonomic innervation of the inner ear
      target: Vestibulocochlear Ganglion and Nerve Agenesis
      direction: ABOLISHED
      interpretation: >-
        No nerve fibre of any class reaches the ear, and the efferent and
        autonomic losses follow the afferent one.
      evidence:
      - reference: PMID:11545141
        reference_title: "Neurogenin 1 null mutant ears develop fewer, morphologically normal hair cells in smaller sensory epithelia devoid of innervation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Neither afferent, efferent, nor autonomic nerve fibers were detected in the ears of ngn1 null mutants."
        explanation: The tracing readout behind this link.
  - target: Stunted Growth of the Inner Ear Sensory Epithelia
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Smaller sensory epithelia with structurally normal hair cells, and a
      cochlea with too few turns - the finding that separates a denervation
      effect from a primary hair-cell defect.
    limitations: >-
      The mouse phenotype is assessed at birth, whereas the human cochlear
      malformation is imaged years later, so any postnatal component of the
      human malformation is outside what the model reports.
    readouts:
    - name: Sensory epithelium size and hair cell ultrastructure in newborn mutants
      target: Stunted Growth of the Inner Ear Sensory Epithelia
      direction: DECREASED
      interpretation: >-
        Epithelia are smaller while the hair cells within them are structurally
        normal, so the growth deficit is secondary to the missing afferents.
      evidence:
      - reference: PMID:11545141
        reference_title: "Neurogenin 1 null mutant ears develop fewer, morphologically normal hair cells in smaller sensory epithelia devoid of innervation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hair cells of newborn ngn1 null mutants show no structural abnormalities, suggesting that embryonic development of hair cells is independent of innervation."
        explanation: The histological readout behind this link.
  - target: Trigeminal Sensory Ganglion and Nerve Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The mouse shows truncation of the fifth nerve as part of the loss of
      proximal cranial sensory neurons.
    limitations: >-
      Human fifth-nerve involvement is functional and inconsistent: an absent
      corneal reflex is near-universal, but a structural fifth-nerve
      abnormality has been reported in only one patient, and the fourth report
      states its two patients had none. The mouse therefore over-represents the
      anatomical severity of the human lesion, and the human node is carried by
      the clinical sign rather than by imaging.
    readouts:
    - name: Generation of proximal cranial sensory neurons
      target: Trigeminal Sensory Ganglion and Nerve Deficiency
      direction: ABOLISHED
      interpretation: >-
        The proximal subset, which includes the trigeminal neurons, is not
        generated at all.
      evidence:
      - reference: PMID:9539122
        reference_title: neurogenin1 is essential for the determination of neuronal precursors for proximal cranial sensory ganglia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mouse embryos lacking ngn1 fail to generate the proximal subset of cranial sensory neurons."
        explanation: The readout behind this link.
  evidence:
  - reference: PMID:33439489
    reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the knockout mouse model phenotype which highly resembles the disorder observed in humans"
    explanation: The human-to-mouse correspondence is one of the three arguments the authors give for NEUROG1 causation, and is what licenses treating this model as informative.
treatments:
- name: Ocular Surface Protection and Lubrication
  description: >-
    The mainstay of care for the anaesthetic cornea: frequent topical
    lubrication and bandage corneal or scleral contact lenses, with surgery held
    in reserve for refractory disease. It protects the ocular surface; it does
    nothing to the missing innervation.
  treatment_term:
    preferred_term: ocular surface protection and lubrication
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    therapeutic_modality is deliberately left unset. The intervention bundles a
    topical agent, a device (bandage or scleral lens) and lid-protection
    measures, and the slot is single-valued, so any one value would misdescribe
    the other two.
  evidence:
  - reference: PMID:26451380
    reference_title: "Congenital Corneal Anesthesia and Neurotrophic Keratitis: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment should include frequent topical lubrication and bandage corneal or scleral contact lenses. Surgery may be needed in refractory cases."
    explanation: States the recommended management of congenital corneal anaesthesia, which is the ocular problem these patients have.
  target_mechanisms:
  - target: Neurotrophic Corneal Epitheliopathy
    description: >-
      Lubrication and surface protection substitute for the lost reflex tear
      film and blink, addressing the epitheliopathy rather than its cause.
- name: Cochlear Implantation
  description: >-
    Attempted bilaterally in the first reported patient and ineffective. He was
    implanted on the left at 12 months and on the right at 4 years, with no
    improvement in hearing or speech either time. This is the expected result
    when the cochlear nerve is absent: an implant stimulates the nerve, and
    there is no nerve to stimulate. The failure is recorded here because it is
    the single most consequential management fact in the disorder and rests on
    one patient.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 8 months the boy was fitted with hearing aids and at age 12 months with a cochlear implant (CI) on the left, but without any improvement in hearing or speech acquisition."
    explanation: Documents the first implantation and its lack of benefit.
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 4 years, he was fitted with a cochlear implant on the right, but again without improving hearing or speech."
    explanation: The contralateral implant failed in the same way, which is what makes this more than a single device or surgical failure.
  target_mechanisms:
  - target: Sensorineural Hearing Impairment
    description: >-
      Directed at the hearing loss, and ineffective against it in the one
      patient in whom it was tried, because the lesion is proximal to the
      structure the device stimulates.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence counselling for a consanguineous or
    endogamous family, and carrier testing for parents and sibs. Two of the four
    reported families had two affected children, so recurrence is not
    theoretical here.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a consistent inheritance pattern encompassing all variants in the form of homozygosity affecting both males and females further supports an autosomal recessive inheritance that can be linked to the NEUROG1 gene"
    explanation: The inheritance conclusion the counselling rests on.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five affected individuals in four unrelated families (Turkish, Middle
    Eastern, Portuguese, Indian) had been reported as of the 2023 review. No
    population prevalence, birth prevalence or carrier frequency has been
    estimated for this disorder in any source cited here, so no rate is
    recorded; ULTRA_RARE is a qualitative classification from the published case
    count and is not a measured figure.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the fourth report across the globe with a variant identified in the NEUROG1 gene to be associated with cranial dysinnervation phenotype."
    explanation: Establishes the published case count, which is the only occurrence measure available.
progression:
- phase: Congenital and non-progressive neurological deficit
  notes: >-
    The cranial nerve deficit is present from birth and does not progress,
    because the neurons were never generated rather than lost. The ocular
    surface is the exception: corneal damage accumulates over years on an
    anaesthetic cornea, which is why corneal opacity is described in older
    patients and why surveillance is lifelong.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The congenital cranial dysinnervation disorder (CCDD) is an umbrella term that groups heterogeneous, congenital, non-progressive neurogenic disorders caused by abnormal development of cranial nerves with dysinnervation."
    explanation: States that the CCDD deficit is congenital and non-progressive by definition of the class this disorder belongs to.
  - reference: PMID:26451380
    reference_title: "Congenital Corneal Anesthesia and Neurotrophic Keratitis: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, the early diagnosis and prompt treatment of this rare condition are mandatory to prevent corneal complications such as scarring and perforation."
    explanation: The ocular complications accrue over time and are preventable, which is why the ocular surface is the part of this otherwise static picture that changes and needs surveillance.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Profound congenital deafness that did not respond to bilateral cochlear
    implantation, combined with an anaesthetic cornea that opacifies and
    ulcerates, an inability to chew requiring a modified diet, and global
    developmental delay. Two of the deficits are sensory channels that normally
    substitute for each other, so their combined loss bears on language
    acquisition in a way neither would alone: the first reported patient had no
    speech acquisition after bilateral implantation.

    The burden level is graded from the reported clinical features alone,
    because nothing else exists to grade it from. None of the three published
    clinical reports of this disorder - all single-family case descriptions,
    between them covering four families - carries a mortality, life-expectancy,
    quality-of-life or care-cost measure. A PubMed search pairing the gene with
    mortality, survival, life-expectancy, quality-of-life and cost terms
    returned no study of this disorder - the hits are cancer-methylation
    biomarker work, avian genomics and zebrafish toxicology, none of which
    concerns the human phenotype.
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 4 years, he was fitted with a cochlear implant on the right, but again without improving hearing or speech."
    explanation: The failure of the standard intervention for profound congenital deafness is the central component of the burden.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her ophthalmic evaluation reported congenital corneal anesthesia syndrome with bilateral neurotrophic ulcer."
    explanation: Sight-threatening ocular surface disease in childhood, the second major component.
diagnosis:
- name: Exome sequencing for biallelic NEUROG1 variants
  description: >-
    Molecular confirmation is by exome or genome sequencing showing biallelic
    NEUROG1 variants, with parental segregation. Note that a whole-gene deletion
    was the first reported allele and is not detected by standard exome variant
    calling, so copy-number analysis belongs in the workup alongside sequence
    variants.
  evidence:
  - reference: PMID:33439489
    reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-exome sequencing identified a homozygous loss of function variant in the NEUROG1 gene (NM_006161.2: c.202G > T, p.Glu68*)."
    explanation: Trio exome sequencing as the route to diagnosis in one family.
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microarray analysis and next generation sequencing showed a homozygous deletion of chromosome 5q31.1 spanning 115.3 kb and including three genes: NEUROG1 (encoding neurogenin 1), DCNP1 (dendritic cell nuclear protein 1, C5ORF20) and TIFAB (TIFA-related protein)."
    explanation: The copy-number route, which is why microarray or equivalent is needed and sequence analysis alone is not sufficient.
- name: Temporal bone MRI and CT
  description: >-
    Imaging of the eighth nerve, internal auditory canal and cochlea is what
    turns a child with deafness and developmental delay into a recognisable
    CCDD. The combination sought is an absent or hypoplastic eighth nerve with a
    narrow internal auditory canal and a cochlea with too few turns, and it
    should be obtained before a cochlear implant is considered.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the temporal bones showed bilateral cochlear hypoplasia (Fig. 2A) with the presence of only half basal turns, bilateral hypoplastic eighth nerve (Fig. 2B) and absent modiolus."
    explanation: The imaging combination that establishes the eighth-nerve lesion.
- name: Corneal sensation testing
  description: >-
    Testing the corneal reflex identifies the trigeminal afferent deficit, which
    is the feature that distinguishes this disorder from the CCDDs confined to
    the ocular motor or facial nerves. It also identifies the eye as at risk
    before the cornea is damaged.
  evidence:
  - reference: PMID:33439489
    reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a 12-year-old boy with hypotonia, developmental delay, sensorineural hearing loss, and keratoconjunctivitis due to lack of corneal reflex."
    explanation: The absent corneal reflex is the sign, and the keratoconjunctivitis is what it costs when it is missed.
differential_diagnoses:
- name: Moebius syndrome and its variants
  description: >-
    The first report frames this disorder as a Moebius syndrome variant, and the
    two overlap in feeding difficulty, deafness and motor delay. Classical
    Moebius is defined by sixth- and seventh-nerve involvement - facial palsy
    with limited ocular abduction - which is not what these patients have. The
    NEUROG1 disorder affects the fifth and eighth nerves instead, which is why
    it is a variant rather than the syndrome.
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some authors also include Moebius syndrome, which is defined by affection of cranial nerves VI and VII, and the Moebius syndrome variants (predominant affection of cranial nerves other than VI and VII) in the entity of CCDD"
    explanation: Gives the nerve-based definition that separates classical Moebius from the variant category this disorder falls into.
- name: HOXA1-related congenital cranial dysinnervation disorder
  description: >-
    The closest phenocopy on imaging: HOXA1-spectrum patients also have profound
    bilateral sensorineural deafness with absence of the cochlear and vestibular
    apparatus and frequently an absent eighth nerve. HOXA1 disease additionally
    involves horizontal gaze abnormality and, variably, cardiovascular
    malformation and cerebrovascular anomalies, which are not features here.
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "especially of the HOXA1 spectrum: among other symptoms, these patients show severe bilateral sensory-neural hearing loss due to absence of the cochlear and vestibular apparatus, often accompanied by absence of the eighth cranial nerve"
    explanation: States the imaging overlap that makes HOXA1 the main differential for the eighth-nerve finding.
- name: Hereditary congenital facial paresis 3 (HOXB1)
  description: >-
    Another recessive transcription-factor CCDD with congenital deafness, but
    the affected nerve is the seventh - bilateral facial palsy with an
    expressionless face - and the eighth nerve is preserved on imaging. The
    discriminating observation is the state of the vestibulocochlear nerve.
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to our case, the vestibulocochlear nerve was preserved on both sides."
    explanation: The imaging finding that separates HOXB1-related HCFP3 from this disorder.
discussions:
- discussion_id: cdcrdd_mouse_null_neonatal_lethality_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The Neurog1-null mouse dies within about 12 hours of birth from suckling
    failure, while patients with biallelic NEUROG1 loss survive into childhood
    and beyond with a modified diet. What accounts for the difference, and what
    does it mean for reading mouse data onto the human disorder?
  attaches_to:
  - pathophysiology#Trigeminal Sensory Ganglion and Nerve Deficiency
  - animal_models#Neurog1-null mouse
  rationale: >-
    This is the central translational question for the entry, because the mouse
    null is where the mechanism comes from - it long predates the first human
    case and every human report argues from it.

    The mouse dies as a neonate, unable to suckle and with no milk in the
    stomach, and the lethality has been attributed to the absent trigeminal
    ganglia depriving suckling of sensory innervation. Human patients have the
    corresponding deficit - they cannot chew and need mashed food - and it is
    not lethal. Two explanations are open and are not distinguished by any
    source cited here. Either the human lesion is quantitatively milder, which
    is consistent with human fifth-nerve involvement being functional rather
    than anatomical in most patients and with the mouse showing outright
    truncation of nerve V; or the mouse and the human differ in how much a
    neonate depends on trigeminal sensation to feed, in which case the human
    survives a lesion of the same depth.

    The distinction matters for every inference this entry draws from the
    model. The eighth-nerve and inner-ear links are on firm ground because the
    human imaging matches the mouse anatomy directly. The fifth-nerve link is
    not: it is carried in humans by a clinical sign, and the one place the mouse
    gives a hard anatomical endpoint is the place the human phenotype most
    clearly diverges.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "These mice showed absence of milk in their stomach, suggesting a suckling defect and died as neonates within 12 h of birth"
    explanation: States the mouse outcome that the human phenotype does not reproduce.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the dysinnervation of the cranial nerve V has only been reported in one patient"
    explanation: The human fifth-nerve evidence is thin and inconsistent, which is one of the two candidate explanations for the survival difference.
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological findings included muscular hypotonia, increased salivation and a severe gulp and mouth motor disorder. He could not chew and needed mashed food."
    explanation: The human counterpart of the mouse feeding failure, survivable with a modified diet.
- discussion_id: cdcrdd_central_neurodevelopmental_features_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the developmental delay, autism and hypotonia direct consequences of
    NEUROG1 loss in the central nervous system, or downstream of combined
    deafness, corneal disease and feeding difficulty?
  attaches_to:
  - phenotypes#Global Developmental Delay
  - phenotypes#Autism
  - phenotypes#Hypotonia
  rationale: >-
    Developmental delay is reported in every family and is in the disorder's
    name, yet nothing in this entry's pathograph reaches it. That is deliberate.

    A direct central mechanism is plausible - NEUROG1 and NEUROG2 have
    overlapping expression in the developing brain - but the argument offered
    for the autism phenotype is a chain of predictions: a frameshift allele
    predicted to escape nonsense-mediated decay, producing an abnormal protein
    predicted to act on downstream targets, some of which are autism-associated
    in a database. No protein was assayed, and the authors themselves record
    that they could not obtain a sample to test it.

    The competing explanation is not excluded either. These children are
    profoundly deaf with no benefit from implantation, have an unstable ocular
    surface, and cannot chew; severe delay in language and adaptive milestones
    is what combined sensory deprivation produces on its own. Distinguishing the
    two would need either a functional assay of the mutant protein or
    developmental outcomes in a patient whose sensory deficits were mitigated
    early, and neither exists.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whilst analysis of the NEUROG1 protein expression using Western blot could have helped to test this hypothesis, the patient’s guardians were lost to follow-up and re-sampling could not been carried out for this analysis."
    explanation: The authors state that the assay which would test their proposed mechanism was not performed, which is the gap this discussion records.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, it is plausible that a disrupted function of the NEUROG1 protein could lead to an ASD phenotype, however, this would require further studies."
    explanation: The proposed central mechanism is framed by its own authors as requiring further study.
- discussion_id: cdcrdd_facial_and_bony_findings_unconnected
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does a proneural bHLH lesion in the cranial sensory placodes
    produce an expressionless face and a narrow internal auditory canal?
  attaches_to:
  - phenotypes#Mask-like Facies
  - phenotypes#Narrow Internal Auditory Canal
  rationale: >-
    Both findings are present in every reported family and neither is connected
    in the pathograph.

    For the face, the only proposed route is that trigeminal dysinnervation
    produces the atypical facial appearance, and it is offered speculatively.
    Facial expression is a seventh-nerve function, the seventh nerve is not
    reported as affected in any of these patients, and the geniculate ganglion
    is epibranchial and therefore NEUROG2-dependent rather than
    NEUROG1-dependent - so the obvious edge is probably the wrong one. An
    alternative that no source addresses is that an expressionless face in a
    child who does not blink, does not hear, and cannot move the mouth normally
    is a composite observation rather than a single sign.

    For the canal, the expected explanation is that the bony conduit fails to
    develop around an absent nerve. This is standard otology and is very likely
    right, but no source cited here states it for these patients; the reports
    record the narrow canal and the absent nerve as two findings on one scan.
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysinnervation of this nerve may likely result in atypical facial features."
    explanation: The only proposed route to the facial phenotype, and the hedging in its own wording is why it is recorded as a gap rather than as an edge.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "During neurogenesis, NGN1 and NGN2 determine the fate of proximal and distal cranial sensory ganglia, respectively"
    explanation: Places the geniculate ganglion outside the NEUROG1-dependent set, which is the argument against routing a facial finding through this lesion.

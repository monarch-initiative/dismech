- name: Stunted Growth of the Inner Ear Sensory Epithelia
  biological_scale: TISSUE
  description: >-
    Reduced growth of the cochlear and vestibular sensory epithelia in the
    absence of afferent innervation, producing a small cochlea with too few
    turns. The hair cells themselves are made and are structurally normal in the
    mouse null, so this is not a hair-cell disease - which matters, because it
    is the reason a device that stimulates a cochlear nerve cannot help.

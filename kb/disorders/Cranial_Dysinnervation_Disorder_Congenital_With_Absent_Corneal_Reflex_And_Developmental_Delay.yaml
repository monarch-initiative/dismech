    snippet: "The neurog1 protein was found to be essential for the development of proximal sensory ganglia and for neurons forming from the trigeminal and otic placodes"
    explanation: States the placodal origins that connect one transcription-factor lesion to both the Vth and VIIIth nerve deficits. The quote sits in this case report's introduction and restates mouse work, so it is graded as the model-organism evidence it describes.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND

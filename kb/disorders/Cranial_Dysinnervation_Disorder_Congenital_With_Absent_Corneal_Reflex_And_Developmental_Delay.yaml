notes: >-
  Entry type. Curated as a standalone DISEASE. The stub was UNDECIDED, and the
  alternatives were checked rather than assumed. It has its own MONDO term
  (MONDO:0957563) and OMIM number (620469, verified against the MONDO record's
  own database_cross_reference), MONDO records no descendants, and one causal
  gene. NEUROG1 appears nowhere else in kb/. The CCDD entries already in the
  knowledge base - Hereditary_Congenital_Facial_Paresis_3,
  Duane_Retraction_Syndrome, Duane_Retraction_Syndrome_3_With_Or_Without_Deafness,
  Duane_Radial_Ray_Syndrome, Congenital_Fibrosis_of_the_Extraocular_Muscles,
  Oculomotor_Nerve_Palsy, TUBB3-related_Tubulinopathy - are each standalone
  disorder entries with different genes and different affected nerves, so none
  of them is a parent this could be a has_subtypes row of. There is no CCDD
  grouping in kb/groupings/ for it to join. A CCDD grouping collecting those
  entries with this one looks worth creating, but it is a separate change and
  is not attached to this PR.

  No conforms_to. Two modules were considered and both rejected on their own
  scope statements. sensorineural_hair_cell_loss runs from a cochlear sensory
  epithelium insult through hair-cell mechanotransduction failure and death to
  secondary spiral ganglion degeneration, which is this disorder's mechanism
  backwards: here the afferent neurons are never generated and the hair cells
  that do form are structurally normal (PMID:11545141). Conforming would assert
  a hair-cell lesion the cited evidence denies.
  pharyngeal_arch_patterning_serial_homology covers cranial-neural-crest
  skeletogenesis and the EDN1-DLX arch-identity code producing bundled
  craniofacial skeletal malformation, which is a different tissue and a
  different program from placodal sensory neurogenesis. No module in kb/modules/
  covers proneural bHLH specification of cranial sensory ganglia; if a second
  disorder with this mechanism is curated, that is the module to write.

  Allelic spectrum. Four alleles in four families: a homozygous 115 kb deletion
  of 5q31.1 removing the whole gene (PMID:23419067), a homozygous missense
  c.347G>T p.(Arg116Leu) inside the bHLH domain reported in 2015, a homozygous
  nonsense c.202G>T p.(Glu68*) (PMID:33439489), and a homozygous frameshift
  c.228_231dup p.(Thr78ProfsTer122) (PMID:36647078). The 2015 missense case is
  cited here through the 2023 review that describes it rather than through its
  primary report, which is a 143-family exome-screening paper whose abstract
  does not name NEUROG1 or the variant; quoting that paper for this allele would
  mean quoting a sentence that does not contain it.

  Named entity check. NEUROG1 is one of three neurogenins and sits beside two
  similarly named bHLH factors that cause different phenotypes. The binding was
  taken from a lookup: runoak -i sqlite:obo:hgnc search "NEUROG1" returns
  hgnc:7764, and the same search for NEUROG2 and NEUROD1 returns hgnc:13805 and
  hgnc:7762 respectively, so the three are distinguishable and this entry binds
  the first. The gene's alias NGN1 is used throughout the 2023 report and is the
  protein name, not a separate gene.

  GeneReviews. No GeneReviews chapter exists for this disorder. This was checked
  offline with just check-genereviews against the committed Bookshelf index of
  PubMed-indexed chapters, not asserted from memory. Its absence is expected for
  an entity with four published families and is not a curation gap.

  Frequency bands. The VERY_FREQUENT bands on the corneal, auditory, facial and
  developmental phenotypes all rest on one sentence in the 2023 review listing
  the findings common to all reported patients at that time. That is five
  patients, so the band reflects consistency across a very small series rather
  than a measured frequency. Phenotypes reported in a single family - corneal
  ulceration, autism - carry no band or a lower one.

  Deep research. None used. This entry was built from primary literature located
  by PubMed search on NEUROG1 (276 title/abstract hits, of which three are human
  CCDD case reports: PMID:23419067, PMID:33439489, PMID:36647078; the fourth
  family is described only inside the third of those) plus the mouse
  determination literature those reports argue from, and two ophthalmology
  reviews for the corneal arm.

  What is not here. No biochemical, histopathology, imaging_findings, datasets,
  clinical_trials, environmental or computational_models blocks. A
  ClinicalTrials.gov search of the gene returns only colorectal and biliary
  methylation-marker studies and one unrelated behavioural trial, so there is no
  trial to curate; and the three clinical reports contain no biochemical marker,
  no tissue pathology and no dataset accession. Those sections are absent
  because the literature has none, not because they were skipped.

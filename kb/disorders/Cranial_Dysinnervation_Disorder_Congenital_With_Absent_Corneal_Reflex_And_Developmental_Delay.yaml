name: Congenital Cranial Dysinnervation Disorder with Absent Corneal Reflex and Developmental Delay
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- CDCRDD
- NEUROG1-related congenital cranial dysinnervation disorder
- cranial dysinnervation disorder, congenital, with absent corneal reflex and developmental delay
description: >-
  A congenital cranial dysinnervation disorder (CCDD) caused by biallelic
  loss-of-function variants in NEUROG1, which encodes the proneural basic
  helix-loop-helix transcription factor neurogenin 1. Reported individuals have
  an absent corneal reflex with corneal opacity and neurotrophic ulceration,
  sensorineural hearing loss with agenesis or severe hypoplasia of the eighth
  cranial nerve and a malformed cochlea, an expressionless face, oromotor
  dysfunction, and developmental delay.

  The lesion is developmental and is upstream of neuron production rather than
  of axon guidance. NEUROG1 acts in the placodal ectoderm before neuroblasts
  delaminate, and it switches on the downstream bHLH cascade that commits those
  cells to a neuronal fate. The cranial sensory ganglia that depend on it are
  the proximal ones - the trigeminal and the vestibulocochlear - so a single
  transcription-factor lesion removes the afferent limb of two nerves at once.
  That is why the corneal reflex and hearing are affected together, and why the
  deficit is fixed from birth: the neurons were never made rather than lost
  later.

  Two consequences follow that are easy to mis-attribute. The cochlear
  malformation and the small sensory epithelia are downstream of the missing
  afferents, not a primary hair-cell defect - in the mouse null the hair cells
  that do form are structurally normal. And cochlear implantation cannot work
  when the cochlear nerve is absent, which is what was observed in the one
  reported patient who received bilateral implants.

  SCOPE. This entry covers the NEUROG1-related entity (MONDO:0957563,
  OMIM:620469) only. Other CCDDs curated separately in this knowledge base -
  HCFP3 (HOXB1), Duane retraction syndrome, congenital fibrosis of the
  extraocular muscles - share the CCDD umbrella but not the gene or the
  mechanism.

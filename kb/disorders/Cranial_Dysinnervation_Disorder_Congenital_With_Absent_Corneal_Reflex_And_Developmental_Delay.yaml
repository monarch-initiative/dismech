      Corneal opacity follows repeated epithelial breakdown and ulceration on an
      anaesthetic cornea. The intermediate is named rather than unknown - an
      ulcer that heals leaves stromal scarring, and the scarring is what
      opacifies - so this is an indirect step through a stated intermediate.
    evidence:
    - reference: PMID:26451380
      reference_title: "Congenital Corneal Anesthesia and Neurotrophic Keratitis: Diagnosis and Management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "even when corneal perforation is avoided, once a corneal ulcer develops a permanent decrease in visual acuity from corneal scarring and astigmatism can still be the final outcome of the disease"
      explanation: Names the intermediate this edge runs through - an ulcer on an insensate cornea resolves into permanent scarring rather than healing clear.
    - reference: PMID:26451380
      reference_title: "Congenital Corneal Anesthesia and Neurotrophic Keratitis: Diagnosis and Management."
      supports: SUPPORT
      evidence_source: OTHER

      snippet: "the rare congenital corneal anesthesia could be a cause of corneal ulceration and scarring in children"
      explanation: Applies that ulceration-to-scarring sequence specifically to congenital corneal anaesthesia in children, which is the setting of this disorder.
- name: Vestibulocochlear Ganglion and Nerve Agenesis
  biological_scale: TISSUE
  description: >-
    Absence or severe hypoplasia of the eighth cranial nerve and of the
    vestibulocochlear ganglion that supplies it. This is the most consistently
    demonstrated lesion in the disorder: it has been imaged in every reported
    family, as agenesis, truncation, or severe hypoplasia. In the mouse null no
    afferent, efferent or autonomic fibre reaches the ear at all, and the
    efferent and autonomic losses are secondary to the missing afferents.

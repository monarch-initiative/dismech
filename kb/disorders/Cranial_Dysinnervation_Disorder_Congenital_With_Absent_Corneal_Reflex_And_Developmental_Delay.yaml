- name: Trigeminal Sensory Ganglion and Nerve Deficiency
  biological_scale: TISSUE
  description: >-
    Loss of the trigeminal sensory neurons, removing the afferent limb of the
    fifth cranial nerve.

    In humans this node is inferred functionally rather than demonstrated
    anatomically in most patients. Corneal anaesthesia with an absent corneal
    reflex is present across the reported series, and oromotor dysfunction is
    too, but a structural abnormality of the fifth nerve has been described in
    only one reported patient, and the authors of the fourth report state
    explicitly that their two patients had no fifth-nerve abnormality on
    imaging. The functional deficit and the imaging finding therefore do not
    track each other, and this entry records the functional claim.

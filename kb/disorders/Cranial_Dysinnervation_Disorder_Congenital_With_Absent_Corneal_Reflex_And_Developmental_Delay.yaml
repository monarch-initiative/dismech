inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported individual is homozygous for a NEUROG1 allele and every
    reported parent is a heterozygous carrier with no phenotype. Both sexes are
    affected. No compound heterozygous or dominant case has been reported.
  evidence:
  - reference: PMID:23419067
    reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient`s parents were phenotypically normal and carried the deletion in a heterozygous state, indicating autosomal recessive inheritance."
    explanation: Recessive segregation in the first reported family, with unaffected heterozygous parents.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis by Sanger sequencing showed the proband and her younger sister to be homozygotes and their parents to be heterozygous carriers."
    explanation: Segregation in a second, independent family with two affected siblings.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a consistent inheritance pattern encompassing all variants in the form of homozygosity affecting both males and females further supports an autosomal recessive inheritance that can be linked to the NEUROG1 gene"
    explanation: Synthesis across all reported families, and the basis for counselling both sexes as equally at risk.
genetic:
- name: NEUROG1
  gene_term:
    preferred_term: NEUROG1
    term:
      id: hgnc:7764
      label: NEUROG1
  association: >-
    NEUROG1 (5q31.1) encodes neurogenin 1, a proneural class II basic
    helix-loop-helix transcription factor. It is a single-exon gene encoding a
    237-residue protein whose bHLH domain spans residues 92-144. It is the only
    gene associated with this disorder, and the disorder is the only human
    phenotype associated with the gene.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33439489
    reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the growing compelling evidence that loss of NEUROG1 leads to a very distinctive disorder of cranial nerves development."
    explanation: States the gene-disease conclusion drawn from the third reported family together with the two preceding ones.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the fourth report across the globe with a variant identified in the NEUROG1 gene to be associated with cranial dysinnervation phenotype."
    explanation: Independent recurrence across four unrelated families is the argument for causation in a gene with no other reported human phenotype.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a single exon gene, encoding a 237 amino acid long protein. The amino acids 92–144 code for the helix-loop-helix DNA-binding domain of the protein and is suggested to be highly intolerant to variants"
    explanation: Gives the gene structure and the coordinates of the bHLH domain that every reported allele disrupts.
  variants:
  - name: NEUROG1 whole-gene deletion (5q31.1, 115 kb)
    description: >-
      Homozygous 115 kb deletion of 5q31.1 removing NEUROG1 together with DCNP1
      and TIFAB, in a consanguineous Turkish family. The two co-deleted genes
      were argued against as candidates on expression and function grounds.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23419067
      reference_title: "A boy with homozygous microdeletion of NEUROG1 presents with a congenital cranial dysinnervation disorder [Moebius syndrome variant]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Microarray analysis and next generation sequencing showed a homozygous deletion of chromosome 5q31.1 spanning 115.3 kb and including three genes: NEUROG1 (encoding neurogenin 1), DCNP1 (dendritic cell nuclear protein 1, C5ORF20) and TIFAB (TIFA-related protein)."
      explanation: Defines the deletion and its gene content, which is why this allele is a nullisomy rather than a point lesion.
  - name: NEUROG1 c.347G>T p.(Arg116Leu)
    description: >-
      Homozygous missense substitution inside the bHLH domain, reported in 2015
      in a Middle Eastern child with corneal opacity, absent corneal reflex and
      mild intellectual disability. This entry cites the 2023 review of the
      series rather than the primary report, which is a large exome-screening
      paper that does not name the variant in its abstract.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36647078
      reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "a 12 year old male child of Middle Eastern origin with clinical findings of corneal opacity, mild intellectual disability and absent corneal reflex was identified with a homozygous missense variant c.347G > T (p.Arg116Leu) in the NEUROG1 gene using clinical exome sequencing"
      explanation: Records the allele and the phenotype of the second family; the quote restates a report the citing authors did not perform.
  - name: NEUROG1 c.202G>T p.(Glu68*)
    description: >-
      Homozygous nonsense allele identified by trio-exome sequencing in a
      Portuguese boy. A premature stop upstream of the bHLH domain is what
      establishes the mechanism as loss of function rather than a
      dominant-negative or neomorphic effect.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33439489
      reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Trio-exome sequencing identified a homozygous loss of function variant in the NEUROG1 gene (NM_006161.2: c.202G > T, p.Glu68*)."
      explanation: Identifies the nonsense allele and the sequencing approach that found it.
  - name: NEUROG1 c.228_231dup p.(Thr78ProfsTer122)
    description: >-
      Homozygous four-base-pair duplication causing a frameshift, in two Indian
      sisters. The authors note that this allele is predicted to escape
      nonsense-mediated decay, and build their proposed explanation of the
      autism phenotype on that prediction; the prediction is in silico and the
      protein was never assayed.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:36647078
      reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WES identified a novel, homozygous four base pair duplication c.228_231dup in exon 1 of the NEUROG1 gene that results in a frameshift and premature truncation of the protein 122 amino acids downstream to codon 78"
      explanation: Defines the frameshift allele and its predicted protein consequence.
    - reference: PMID:36647078
      reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The NMD detector model developed by Lindeboom et al., predicts that the pLOF variant detected in our case would most likely lead to evasion of NMD (NMD score = 0.07)"
      explanation: The NMD-escape claim is a model prediction, graded computational so it is not read as a measured result.
pathophysiology:
- name: NEUROG1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NEUROG1 variants abolish or degrade the transcriptional activity
    of neurogenin 1. The four reported alleles are a whole-gene deletion, a
    nonsense allele, a frameshift allele and a missense substitution, and they
    converge on the same target: all disrupt the bHLH domain, which carries both
    the basic region that binds the E-box and the helix-loop-helix region that
    mediates dimerization. A whole-gene deletion and a point lesion producing the
    same disorder is what identifies the mechanism as loss of function.
  gene:
    preferred_term: NEUROG1
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:7764
      label: NEUROG1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Despite the variant type, all were found to disrupt the bHLH domain of the NGN1 protein."
    explanation: All four reported alleles converge on the bHLH domain, which is the argument that they share one molecular consequence.
  - reference: PMID:33439489
    reference_title: Adding evidence to the role of NEUROG1 in congenital cranial dysinnervation disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-exome sequencing identified a homozygous loss of function variant in the NEUROG1 gene (NM_006161.2: c.202G > T, p.Glu68*)."
    explanation: A homozygous nonsense allele producing the full phenotype places the mechanism at loss of function.
  - reference: PMID:36647078
    reference_title: "A novel case of two siblings harbouring homozygous variant in the NEUROG1 gene with autism as an additional phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Binding of the NGN protein to the E-box domain of genes involved in the neurogenesis pathway is critical for regulating their spatio-temporal expression and neuronal differentiation."
    explanation: Identifies the molecular activity lost - sequence-specific DNA binding at the E-box of neurogenesis target genes.
  downstream:
  - target: Failure of Proneural Commitment in the Cranial Sensory Placodes
    causal_link_type: DIRECT
    description: >-
      Neurogenin 1 is a neuronal determination factor: without it the placodal
      ectoderm does not commit to a neuronal fate, so the proximal cranial
      sensory neurons are never generated.
    evidence:
    - reference: PMID:9539122
      reference_title: neurogenin1 is essential for the determination of neuronal precursors for proximal cranial sensory ganglia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mouse embryos lacking ngn1 fail to generate the proximal subset of cranial sensory neurons."
      explanation: The loss-of-function phenotype in the mouse states the causal step from absent neurogenin 1 to absent proximal cranial sensory neurons.
- name: Failure of Proneural Commitment in the Cranial Sensory Placodes
  biological_scale: CELLULAR
  description: >-
    Neurogenin 1 is expressed by placodal ectodermal cells and acts before
    neuroblast delamination, switching on a cascade of downstream bHLH factors
    (NeuroD, MATH3, NSCL1) that carries the commitment forward. The step it
    controls is determination, not migration or axon guidance, which is what
    separates this disorder from the CCDDs caused by axon-pathfinding genes.

    The division of labour between the two neurogenins is what makes the
    phenotype selective: NEUROG1 specifies the proximal ganglia, which arise
    from the trigeminal and otic placodes and the neural crest, while NEUROG2
    specifies the distal, epibranchial-placode-derived ganglia. Only the
    proximal set is lost.
  cell_types:
  - preferred_term: cranial sensory placodal cell
    term:
      id: CL:0000032
      label: neuroplacodal cell
  locations:
  - preferred_term: trigeminal placode
    term:

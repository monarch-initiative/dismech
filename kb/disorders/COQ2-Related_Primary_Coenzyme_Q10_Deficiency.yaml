    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Coenzyme Q (CoQ) is a key component of the mitochondrial respiratory chain
      and is essential for cellular energy production and metabolic homeostasis.
    explanation: >-
      States the bioenergetic role whose loss defines this node. Background
      framing rather than this paper's own result.
- name: Loss of Membrane Antioxidant Capacity
  biological_scale: CELLULAR
  description: >-
    Reduced coenzyme Q (ubiquinol) is the main lipid-soluble antioxidant of
    mitochondrial membranes, so primary CoQ deficiency removes antioxidant
    protection at the same time and in the same compartment as it removes
    electron transfer. This node is curated separately from the bioenergetic one
    because the two are distinct claims and a therapy could in principle restore
    one without the other; no study in COQ2 patients has separated them.
  downstream:
  - target: Podocyte Energetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neuronal Bioenergetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Podocyte Energetic Failure
  biological_scale: TISSUE
  description: >-
    The glomerular podocyte is the kidney cell that fails. It is terminally
    differentiated, mitochondria-rich and cannot be replaced, which is the
    standard explanation for why CoQ biosynthesis defects present as
    steroid-resistant nephrotic syndrome rather than as a tubulopathy. Kidney
    involvement is the hallmark manifestation of the nephropathic CoQ
    deficiencies, and in COQ2 it is often the presenting problem.
  cell_types:

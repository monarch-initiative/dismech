      label: Autosomal recessive inheritance
  description: >-
    Biallelic COQ2 variants are required. The founding family was consanguineous
    with two homozygous affected siblings; later families include homozygous and
    compound heterozygous genotypes.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two siblings of consanguineous parents with the infantile form of
      CoQ(10) deficiency, we identified a homozygous missense mutation in the
      COQ2 gene, which encodes para-hydroxybenzoate-polyprenyl transferase.
    explanation: >-
      The founding genotype: homozygosity in affected siblings of consanguineous
      parents.
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CoQ(10) deficiency is inherited as an autosomal recessive trait and has been
      associated with three main clinical phenotypes
    explanation: >-
      States the inheritance mode for primary CoQ10 deficiency as established
      background at the time this gene was found.
prevalence:
- population: Multi-registry cohort of CoQ10 deficiency-associated glomerulopathy (COQ2, COQ6, COQ8B)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A systematic review plus PodoNet, mitoNET and CCGKDD registry queries and a
    survey assembled 251 patients across the three main nephropathic CoQ10
    deficiency genes — 173 published and 78 new. The COQ2 share is a fraction of
    that total, and the cohort is ascertained through kidney disease, so it
    under-represents the purely neurological presentations.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a systematic literature review, PodoNet, mitoNET, and CCGKDD
      registries queries and an online survey, collecting comprehensive clinical
      and genetic data of 251 patients spanning 173 published (47 updated) and 78
      new cases.
    explanation: >-
      The cohort's size and construction, quoted so the denominator is visible.
progression:
- phase: Infantile onset with kidney disease
  notes: >-
    In the registry cohort, kidney disease was first diagnosed at a median age of
    1.0 year in COQ2 patients — the earliest of the three nephropathic CoQ
    genes. About a third present with isolated kidney involvement.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kidney disease was first diagnosed at median age 1.0, 1.2 and 9.8 years in
      individuals with disease-causing variants in COQ2, COQ6 and COQ8B,
      respectively.
    explanation: >-
      Age at renal diagnosis, with the sibling genes alongside for calibration.
- phase: Neurological involvement
  notes: >-
    Almost half of COQ2 patients in the renal cohort developed neurological
    symptoms, at a median age of 2.7 years — that is, typically after the kidney
    disease has declared itself. A fifth had the classic infantile multiorgan
    presentation from the start.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic infantile multiorgan involvement comprised 22% of the COQ2 variant
      cohort while 47% of them developed neurological symptoms at median age 2.7
      years.
    explanation: >-
      The split between multiorgan-at-onset and later neurological involvement.
- phase: Progression to kidney failure
  notes: >-
    Half of COQ2 patients progressed to kidney failure by age five in the
    untreated registry cohort, and adult kidney survival was 20-25% across all
    three genes. This is the outcome that CoQ10 supplementation changes.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the patients with COQ8B variants, but 50% of patients with COQ2 and
      COQ6 variants progressed to kidney failure by age five.
    explanation: >-
      Renal survival to age five, with the contrast against COQ8B that makes the
      gene identity matter prognostically.
pathophysiology:
- name: COQ2 Polyprenyltransferase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic COQ2 variants reduce the activity of the mitochondrial
    polyprenyltransferase that condenses 4-hydroxybenzoate with the
    polyisoprenoid tail. The protein localises to mitochondria with its
    C-terminus facing the intermembrane space. Residual activity is not
    all-or-nothing: yeast complementation across the reported allelic series
    grades each mutant, and that grade predicts the patient's phenotype.
  molecular_functions:
  - preferred_term: prenyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0004659
      label: prenyltransferase activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  downstream:
  - target: Coenzyme Q10 Biosynthetic Failure
    causal_link_type: DIRECT
    description: >-
      COQ2 catalyses an obligate step, so reduced activity reduces CoQ10 output.
    evidence:
    - reference: PMID:16400613
      reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Radioisotope assays confirmed a severe defect of CoQ(10) biosynthesis in
        the fibroblasts of one patient.
      explanation: >-
        Direct biosynthetic measurement in patient cells, which is what turns the
        genotype into a demonstrated enzymatic block.
  evidence:
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings show that the main functional transcript of COQ2 is shorter
      than what was previously reported and that its protein product localizes to
      mitochondria with the C-terminus facing the intermembrane space.
    explanation: >-
      Establishes the protein's topology and, importantly for variant
      interpretation, that the functional transcript is shorter than had been
      assumed.
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation experiments in yeast showed that the residual activity of
      the mutant proteins correlates with the clinical phenotypes observed in
      patients.
    explanation: >-
      The residual-activity-to-severity correlation, measured across the whole
      reported allelic series.
- name: Coenzyme Q10 Biosynthetic Failure
  biological_scale: MOLECULAR
  description: >-
    Endogenous CoQ10 falls. Coenzyme Q is a lipid-soluble mobile carrier present
    in virtually all cell membranes, so the deficit is systemic rather than
    tissue-restricted; what varies between tissues is how much they mind.
  biological_processes:
  - preferred_term: ubiquinone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
  downstream:
  - target: Respiratory Chain Electron Transfer Failure
    causal_link_type: DIRECT
    description: >-
      Coenzyme Q is the carrier between complexes I/II and complex III, so its
      depletion interrupts the chain at that point.
  - target: Loss of Membrane Antioxidant Capacity
    causal_link_type: DIRECT
    description: >-
      Reduced ubiquinol is the principal lipid-phase antioxidant of the inner
      mitochondrial membrane, and is lost along with the carrier function.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Ubiquinone (coenzyme Q(10) or CoQ(10)) is a lipid-soluble component of
      virtually all cell membranes, where it functions as a mobile electron and
      proton carrier.
    explanation: >-
      Defines the molecule's role and its ubiquity, which is why the deficiency
      is multisystem. Stated as established background in this paper's opening.
- name: Respiratory Chain Electron Transfer Failure
  biological_scale: CELLULAR
  description: >-
    Without sufficient coenzyme Q, electrons cannot pass from complexes I and II
    to complex III, so oxidative phosphorylation is impaired and lactate
    accumulates. This is the node that the two therapeutic strategies —
    exogenous CoQ10 and 4-HBA substrate enhancement — both aim at, by different
    routes.
  biological_processes:
  - preferred_term: respiratory electron transport chain
    modifier: DECREASED
    term:
      id: GO:0022904
      label: respiratory electron transport chain
  downstream:

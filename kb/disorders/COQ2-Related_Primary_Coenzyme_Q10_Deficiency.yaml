    evidence_source: HUMAN_CLINICAL
    snippet: Overall, 70 surviving patients were on dialysis at last observation (7 in the COQ2 cohort, 8 in the COQ6 cohort, and 55 in the COQ8B cohort), and 68 had received a kidney transplant. Disease recurrence in the allograft was never observed.

discussions:
- discussion_id: gap_coq2_neuro_nonresponse_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neurological non-response to oral CoQ10 purely a delivery problem, or
    is established neuronal damage irreversible once it has occurred?
  attaches_to:
  - "pathophysiology#Neuronal Bioenergetic Failure"
  rationale: >-
    The delivery explanation is the one the literature offers — CoQ10 is very
    lipophilic and crosses the blood-brain barrier poorly, and the brain's CoQ9
    proportion is higher than other tissues. But the sibling case that treated
    from the first day of life and still saw refractory seizures by three months
    is hard to explain by delivery alone if any drug reaches the brain at all,
    and it is equally compatible with a developmental window that closes. The two
    have opposite implications for 4-HBA: if delivery is the whole story, a
    compound that restores endogenous synthesis should work at any age; if
    neuronal loss is fixed once established, it must be started before symptoms.
    The first-in-human 4-HBA patient was already symptomatic and improved, which
    is a point for the delivery explanation, but it is one patient over six
    months.
  proposed_experiments:
  - experiment_id: exp_coq2_brain_coq_pk
    name: Brain CoQ measurement under CoQ10 versus 4-HBA in the Coq2 model
    description: >-
      Measure brain tissue CoQ9 and CoQ10 concentrations in the Coq2A252V mouse
      under oral CoQ10 and under 4-HBA, to establish whether the difference in
      neurological outcome tracks a difference in brain CoQ delivery.
    would_support:
    - "pathophysiology#Neuronal Bioenergetic Failure"
  - experiment_id: exp_coq2_late_rescue
    name: Delayed-start 4-HBA in the Coq2 model
    description: >-
      Begin 4-HBA after encephalopathy has become established in the mouse model
      and measure whether the deficit reverses, stabilises, or continues, to
      separate a delivery limitation from irreversible damage.
- discussion_id: gap_coq2_organ_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some biallelic COQ2 patients present with isolated kidney disease
    while others have multiorgan disease from birth, given the same enzymatic
    block in every tissue?
  attaches_to:
  - "pathophysiology#COQ2 Polyprenyltransferase Deficiency"
  - "pathophysiology#Podocyte Energetic Failure"
  rationale: >-
    A third of COQ2 patients have isolated kidney involvement at diagnosis and a
    fifth have classic infantile multiorgan disease, yet the deficient enzyme is
    the same one in every cell. Residual activity is the leading explanation and
    has real support — the yeast series grades alleles and the grades track
    severity. But the same registry analysis reports substantial intra-familial
    variability, which residual activity cannot explain, since siblings share
    both alleles. The authors invoke genetic and non-genetic modifiers without
    naming any. Resolving this would change what a family is told when a second
    child is found to carry the same genotype.

    The sharpest single observation is a COQ2 patient with fatal infantile
    multisystem disease in whom the kidney was spared outright, in a disease whose
    hallmark manifestation is nephrotic syndrome. Organ selectivity is therefore
    not a severity gradient with the kidney always first; the kidney can be absent
    from a lethal presentation. The ocular tissue poses the same question from the
    other direction, since retinopathy is reported only with this gene and only in
    a handful of its patients.
  evidence:
  - reference: PMID:23343605
    reference_title: A novel mutation in COQ2 leading to fatal infantile multisystem disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no evidence for renal involvement.
    explanation: >-
      A COQ2 patient with fatal infantile multisystem disease and no kidney
      disease, which is what makes organ selectivity a genuine gap rather than a
      severity gradient. The hallmark organ was spared in a lethal presentation.
  - reference: PMID:23343605
    reference_title: A novel mutation in COQ2 leading to fatal infantile multisystem disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Interestingly, four of these patients showed a distinctive renal involvement
      (focal segmental glomerular sclerosis, crescentic glomerulonephritis,
      nephrotic syndrome), which is only very rarely seen in correlation with
      mitochondrial disorders.
    explanation: >-
      The contrast case for the same gap: renal involvement in four of the five
      previously reported COQ2 patients, which is the expectation this paper's own
      patient departs from. Restated from the prior literature.
  proposed_experiments:
  - experiment_id: exp_coq2_tissue_residual_activity
    name: Tissue-resolved CoQ measurement across affected and spared organs
    description: >-
      Measure CoQ9 and CoQ10 concentrations and respiratory chain function across
      kidney, brain, heart and muscle in a COQ2 model carrying an intermediate
      allele, testing whether organ involvement tracks tissue CoQ level or
      whether some tissues tolerate the same deficit better.
  - experiment_id: exp_coq2_sibling_modifier_search
    name: Modifier search in discordant sibling pairs
    description: >-
      Perform genome and transcriptome comparison on the reported sibling pairs
      with the same COQ2 genotype and discordant severity, looking for modifier
      variants in CoQ biosynthesis, transport or antioxidant pathways.
notes: >-
  Scope and lump/split. This entry covers biallelic COQ2 primary CoQ10
  deficiency. Per-gene entries are the established shape beneath the
  Primary_Coenzyme_Q10_Deficiency umbrella, which already has
  COQ4-Related_Neonatal_Encephalomyopathy and
  COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome; MONDO:0011829 was bound
  nowhere in kb/. The name follows those siblings' gene-prefixed convention
  rather than MONDO's numbered label, so the three sort together.

  The three COQ2 phenotypes — neonatal multisystem, intermediate childhood, and
  late-onset adult — are curated as a severity gradient within one entry rather
  than as has_subtypes, because the literature attributes them to residual
  enzyme activity along a continuum and the yeast allelic series supports that
  reading. Splitting them would assert a discreteness the evidence does not show.

  The multiple system atrophy question is deliberately kept out. Heterozygous
  COQ2 variants have been reported as an MSA susceptibility factor with a mixed
  replication record; that is a different zygosity and a different disease, it
  belongs to this repository's Multiple_System_Atrophy entry, and nothing here
  asserts it. The genetic notes say so explicitly so that a reader who arrives
  from the MSA literature is not left to infer it.

  A REFUTE item sits beside SUPPORT items on the CoQ10 treatment. That is
  deliberate and is the pattern CLAUDE.md prescribes for a source that supports
  one part of a claim and contradicts another: the renal cohort supports
  "CoQ10 treats this disease" for the kidney, and the sibling series refutes it
  for the brain. Collapsing them into one graded item would lose the fact that
  the disagreement is compartmental rather than a difference of opinion.

  What is deliberately absent. No datasets: block — a COQ2 search is dominated by
  the multiple system atrophy association studies, which are the wrong zygosity
  and the wrong disease, and no COQ10D1-specific dataset was identified. No
  clinical_trials: block — the 4-HBA work is described as a first-in-human
  individual therapeutic trial, which is an n-of-1 compassionate-use
  administration rather than a registered interventional trial, and no
  registration identifier is given in the source. Recording it as a
  clinical_trials entry would assert a registration that may not exist. It is
  curated under treatments with its evidence instead. No environmental: block.

  Phenotypes left unwired, deliberately. Hypertrophic cardiomyopathy, muscle
  weakness and sensorineural hearing impairment carry no causal inlink. The
  argument for wiring the first two to Respiratory Chain Electron Transfer Failure
  is real — cardiac and skeletal muscle are the classic high-oxidative-demand
  tissues of mitochondrial disease — but it is an argument from the general
  physiology of the disease group, not a claim any located source makes about COQ2.
  The retinal node is wired because a COQ2-specific ophthalmological workup exists
  and the gene-specificity of retinopathy is stated in the literature; no
  equivalent cardiac or muscle study in COQ2 patients was found, only a single
  echocardiographic finding and a single muscle histology in one neonate. Drawing
  the edges anyway would assert tissue-level mechanisms on the strength of
  plausibility, which is what the retinal node's own description is careful not to
  do. Recorded here rather than left as an unexplained gap.

  Cached but uncited. Three of the seven references fetched during screening are
  now cited: PMID:36420660 for the ocular phenotypes and the diagnostic
  contrast, PMID:25564041 for the cardiac and muscle findings in a
  yeast-validated COQ2 neonate, and PMID:23343605 and PMID:42410653 for the
  organ-selectivity gap and the high-dose renal response respectively. The ones
  that remain uncited are PMID:25091424 and PMID:25126048, general reviews whose
  content is carried by better sources here, and PMID:25373618, which is a
  multiple system atrophy study and out of scope for the reason given under
  genetic: — heterozygous COQ2 as an MSA susceptibility factor is a different
  zygosity and a different disease. They are left in place rather than pruned,
  because pruning caches against a cited-reference list is how a file the entry
  still needs gets deleted.

  GeneReviews. PMID:28125198, Primary Coenzyme Q(10) Deficiency Overview, is the
  baseline chapter and is tagged in references:. It is an overview of the gene
  group rather than a COQ2-specific chapter. Verified by PubMed genereviews[book]
  search; the other chapter that search returns, the Hereditary Ataxia Overview,
  covers CoQ deficiency only as one cause of ataxia and is not cited here. That
  chapter is named by title with no identifier on purpose. check-genereviews
  matches chapter identifiers anywhere in the file, so writing either its PMID or
  its NBK number here makes the checker report CITED_UNTAGGED against a chapter
  this very sentence is explaining is not cited — the check cannot tell a citation
  from a mention that denies citing. Searching the title finds it.

  Why the GeneReviews chapter carries no evidence item. It is tagged and cached
  but quoted nowhere, and that is deliberate rather than an oversight. The cached
  record is content_type abstract_only and its body is the chapter's purpose
  statement — "The purpose of this overview is to: 1.. Briefly describe the
  clinical characteristics…" — a table of contents, with no clinical finding in
  it. The only sentence that could be quoted is the one announcing that the
  chapter reviews management including high-dose oral CoQ10, which states what the
  chapter covers and not what is true of the disease. Quoting it would put a
  non-propositional snippet behind a treatment claim that two primary sources
  already support properly. The chapter's clinical content is in the full text,
  which the cache does not hold.

  This is worth flagging as a tooling matter, not just a curation one: a cache
  record whose body is a purpose statement and a cache record with a real findings
  abstract both report content_type abstract_only with full_text_attempted true.
  Nothing distinguishes an unquotable source from an unquoted one without opening
  the file, so a reviewer cannot tell this decision from laziness. Issue #9825
  tracks it.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Decaprenyl-pyrophosphate (PP) accumulation reflected a deficiency in COQ2, which conjugates decaprenyl-PP with the benzoquinone ring.
    explanation: The preceding experiment identifies patient 3 as the COQ2 case; the PDSS1 cases have a different biochemical defect.
diagnosis:
- name: Molecular genetic testing including COQ2
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Diagnosis usually rests on biallelic pathogenic or likely pathogenic COQ2 variants, interpreted with phenotype and segregation. A suitable multigene panel, exome or genome sequencing can be used; panel content varies by laboratory. The reported ocular case illustrates one nondiagnostic 285-gene retinal panel followed by exome detection of two likely-in-trans variants, one classified as a VUS, rather than proving that all retinal panels omit COQ2.
  evidence:

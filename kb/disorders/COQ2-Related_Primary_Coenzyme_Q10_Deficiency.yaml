  - target: Oxidative Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Coq2-deficient fly nephrocytes accumulate ROS; the balance between antioxidant loss and respiratory dysfunction remains unresolved.

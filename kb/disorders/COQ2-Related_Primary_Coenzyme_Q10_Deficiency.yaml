    snippet: The diagnosis of primary CoQ ... deficiency is usually established by ... molecular genetic testing ... ; however, ... biochemical testing ... can be helpful in some circumstances.
    explanation: GeneReviews establishes molecular testing as the usual diagnostic route.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/

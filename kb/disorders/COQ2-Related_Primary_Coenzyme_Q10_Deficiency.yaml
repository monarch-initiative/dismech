  description: Enalapril was used with high-dose CoQ10 in one infant reported as having COQ2 disease. The detailed molecular assessment included one likely pathogenic allele and one VUS. UPCR decreased from 10.46 to 1.60 mg/mg by three months; the abstract’s complete-remission claim is not supported by that numerical endpoint. The contribution of each drug cannot be separated.

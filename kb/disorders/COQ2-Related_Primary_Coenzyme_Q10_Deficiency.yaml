- name: Combined respiratory-chain complex I+III and II+III activities
  notes: Combined CoQ-dependent activities may be reduced despite preserved isolated complexes. Normal muscle assays do not exclude renal CoQ-dependent dysfunction, as shown in the infant with hypertrophic cardiomyopathy.

treatments:
- name: Multisystem evaluation and surveillance
  action_category: MONITORING
  therapeutic_modality: OTHER
  description: Baseline evaluation includes renal function and proteinuria, neurological and developmental assessment, hearing, ophthalmology with electroretinography, and echocardiography. Follow-up tracks existing and newly emerging manifestations. GeneReviews recommends assessment for autonomic and movement disorders every one to two years in individuals with adult-onset neurological findings or apparently isolated SRNS; cardiac reassessment is guided by documented involvement.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/
    reference_title: Primary Coenzyme Q10 Deficiency Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In individuals with adult-onset neurologic findings and individuals with apparently isolated SRNS: assessment for evidence of autonomic dysfunction and movement disorders (parkinsonism, cerebellar ataxia, pyramidal signs) every one to two years'
    explanation: The interval applies to the specified clinical groups.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/
    reference_title: Primary Coenzyme Q10 Deficiency Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Urine analysis for proteinuria and assessment of kidney function ... Ophthalmologic evaluation and electroretinogram for evidence of retinopathy and to determine need for low vison services ... Hearing evaluation with attention to possible sensorineural hearing loss
    explanation: GeneReviews specifies periodic renal, visual and hearing surveillance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/
    reference_title: Primary Coenzyme Q10 Deficiency Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: cardiac evaluation should be performed at the time of diagnosis but not periodically unless cardiac involvement has been documented.
    explanation: GeneReviews gives a specific cardiac follow-up limitation.
- name: Oral coenzyme Q10 supplementation
  description: 'High-dose oral CoQ10 is the established replacement treatment. Response varies with presentation and organ damage: renal improvement is common, some patients improve neurologically, and severe infantile encephalopathy can progress despite treatment from birth. In the retrospective renal study, the pooled COQ2/COQ6/COQ8B analysis associated treatment with better kidney survival. The COQ2-only matched comparison showed a nominal two-year survival difference of 78% versus 33%, without statistical significance. Among informative COQ2 patients treated before end-stage kidney disease, 14/21 had greater than 50% proteinuria reduction, while 1/16 achieved complete remission. These observational findings do not define a uniform dose or guarantee response.'
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Respiratory Chain Electron Transfer Failure
    description: Exogenous CoQ10 supplies the deficient electron carrier; rescue of combined respiratory activities is demonstrated in patient fibroblasts.
    evidence:
    - reference: PMID:17374725
      reference_title: Missense mutation of the COQ2 gene causes defects of bioenergetics and de novo pyrimidine synthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: CoQ-dependent mitochondrial complexes activities were restored in deficient fibroblasts by CoQ(10) supplementation, and growth rate was restored in these cells by either CoQ(10) or uridine supplementation.
      explanation: Cellular respiratory rescue supports the mechanistic treatment target; it is not a clinical response measurement.
  evidence:
  - &id008
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/
    reference_title: Primary Coenzyme Q10 Deficiency Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Response was poor in individuals with severe forms with onset in the first months of life, while both neurologic manifestations and SRNS responded well to CoQ ... supplementation in individuals with later-onset disease.
    explanation: GeneReviews explicitly distinguishes severe infantile nonresponse from later-onset neurological and renal response.
  - reference: url:https://dirros.openscience.si/Dokument.php?id=36087&lang=eng  # codespell:ignore dokument
    reference_title: https://dirros.openscience.si/Dokument.php?id=36087&lang=eng  # codespell:ignore dokument
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Survival analysis showed a nominal improvement of kidney survival with CoQ 10 supplementation (2-year survival, 78% vs. 33%) without statistical signi ﬁcance ( P ¼ 0.282).
    explanation: The COQ2-specific kidney-survival comparison was not statistically significant.
  - reference: url:https://dirros.openscience.si/Dokument.php?id=36087&lang=eng  # codespell:ignore dokument

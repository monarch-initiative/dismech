- name: Reactive Astrogliosis
  biological_scale: CELLULAR
  description: 'Astrocyte activation develops in brainstem and cerebellum after withdrawal of 4-HBA from rescued Coq2 A252V mice. The accompanying response differs by treatment condition: withdrawal caused astrogliosis without detectable microglial activation, whereas CoQ10-treated young mutants showed both astroglial and microglial activation.'
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We observed strong astrocyte activation in the brainstem of animals in which 4-HBA treatment was discontinued (Fig. 1P–R and AK), compared to mice that continued receiving the treatment (Fig. 1I–K and AK).
    explanation: Astrocyte activation followed 4-HBA withdrawal in Coq2 A252V mice.
  mechanism_confidence: PROVISIONAL
  notes: Astrogliosis and brainstem/cerebellar vacuolation coexist after 4-HBA withdrawal in this mouse model. The study does not establish that astrocyte activation causes the vacuolation or encephalopathy, so this node has no causal edge to the human clinical phenotype.
  downstream: []

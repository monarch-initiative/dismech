genetic:
- name: COQ2
  gene_term:
    preferred_term: COQ2
    term:
      id: hgnc:25223
      label: COQ2
  relationship_type: CAUSATIVE
  notes: >-
    COQ2 (4q21.23) encodes para-hydroxybenzoate-polyprenyl transferase. It is a
    frequent cause of primary CoQ deficiency and carries the widest clinical
    spectrum of the group. Unusually among the CoQ genes, the genotype is
    informative: yeast complementation of the reported allelic series grades
    residual activity, and that grade tracks the patient's severity — the paper
    contrasts this explicitly with ADCK3, where no such correlation holds.

    A separate and unsettled claim concerns heterozygous COQ2 variants as a
    susceptibility factor for multiple system atrophy. That is a different
    zygosity, a different phenotype and a contested replication record; it is not
    curated as part of this recessive disease, and this repository's
    Multiple_System_Atrophy entry is where it belongs. The late-onset adult
    COQ2-related presentation reported as an MSA subtype is described in the
    biallelic literature as one of the three COQ2 phenotypes, which is a
    different claim again.
  variants:
  - name: c.890A>G (p.Tyr297Cys)
    description: >-
      The founding allele, homozygous in two siblings with the infantile form. It
      changes a highly conserved tyrosine within a predicted transmembrane
      domain.
  - name: c.437G>A (p.Ser146Asn)
    description: >-
      Reported in four patients from two families presenting with neonatal
      diabetes and nephrotic-range proteinuria; the renal and endocrine features
      responded to CoQ10 and the neurological course did not.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The A-->G transition at nucleotide 890 changes a highly conserved tyrosine
      to cysteine at amino acid 297 within a predicted transmembrane domain.
    explanation: The founding allele and its structural context.
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation in COQ2 is the first molecular cause of primary CoQ(10)
      deficiency.
    explanation: >-
      Establishes COQ2 as the founding gene of the primary CoQ10 deficiencies.
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We defined the structure of COQ2 with relevant implications for mutation
      screening in patients and demonstrated that, contrary to other COQ gene
      defects such as ADCK3, there is a correlation between COQ2 genotype and
      patient's phenotype.
    explanation: >-
      The genotype-phenotype correlation, stated with the explicit contrast that
      makes it specific to this gene.
  case_fractions:
  - population: Multi-registry CoQ10 deficiency glomerulopathy cohort
    notes: >-
      COQ2 is one of the three genes that account for CoQ10 deficiency-associated
      steroid-resistant nephrotic syndrome. No per-gene share of the 251-patient
      cohort is reported in a form that can be quoted as a fraction, so the
      numeric slots are left empty rather than derived.
    evidence:
    - reference: PMID:35483523
      reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        including steroid-resistant nephrotic syndrome mainly associated with
        disease-causing variants in the genes COQ2, COQ6 or COQ8B
      explanation: Names the three genes responsible for the nephropathic presentation.
biochemical:
- name: Coenzyme Q10 concentration in skeletal muscle
  biomarker_term:
    preferred_term: coenzyme Q10 concentration in skeletal muscle
    term:
      id: NCIT:C147321
      label: Ubiquinone 10 Measurement
  notes: >-
    Reduced tissue CoQ10 is the direct biochemical consequence of the
    biosynthetic block. The clinically important point is the contrast with the
    serum measurement: serum CoQ10 does not reflect intracellular concentration
    and a normal serum value does not exclude the diagnosis, which is why the
    assay has to be done on tissue. Sensitivity and specificity of the tissue
    assay are themselves described as uncertain, particularly in patients without
    systemic features of severe mitochondrial dysfunction, so a negative result
    does not exclude the diagnosis either. Genetic testing has largely displaced
    it.
  evidence:
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The diagnosis of primary CoQ10 deficiency was historically established by
      enzymatic assessment of tissue: a reduction in CoQ10 concentration and
      mitochondrial respiratory chain activity levels have been documented.
    explanation: >-
      Names the two tissue measurements that constitute the biochemical diagnosis.
      It is the citing paper's account of established practice.
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum CoQ10 levels are not reflective of intracellular concentrations and
      thus have very limited utility in diagnosing primary CoQ10 deficiency
    explanation: >-
      Establishes why this marker has to be measured in tissue rather than in
      serum, which is exactly what this record asserts. The authors' own patient
      had a normal serum value alongside the disease, so the sentence supports the
      tissue requirement rather than contradicting the marker.
diagnosis:
- name: Whole-exome or whole-genome sequencing
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The diagnosis rests on finding biallelic COQ2 variants. This is not a
    preference for molecular over biochemical testing in the abstract: COQ2 is
    absent from targeted retinal-dystrophy panels, and in the reported ocular case
    a 285-gene panel was non-diagnostic while exome sequencing found the two
    variants. Where the presentation is retinal rather than renal, a panel result
    is therefore uninformative rather than reassuring.
  evidence:
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had negative results on a targeted next-generation sequencing
      retinal dystrophy panel but whole-exome sequencing revealed two variants in
      COQ2 (likely biallelic), consistent with a diagnosis of primary coenzyme Q10
      deficiency.
    explanation: >-
      The panel-negative, exome-positive sequence in a real patient, which is the
      practical reason to go to exome sequencing in this disease.
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genetic testing aids in the diagnosis of this condition, and variants in the
      COQ2 and PDSS1 genes appear to have the strongest association with ocular
      manifestations.
    explanation: >-
      The authors' conclusion, which both recommends genetic testing and names the
      two genes carrying the ocular association.
treatments:
- name: Oral coenzyme Q10 supplementation
  description: >-
    High-dose oral CoQ10 is the standard treatment. In a 116-patient
    international series with a median two years of follow-up it reduced
    proteinuria by 88% at 12 months and improved five-year kidney failure-free
    survival from 19% to 62%, with uncommon and mild side effects. The authors
    conclude that every patient diagnosed with primary CoQ10 deficiency should
    receive early lifelong supplementation.

    The limitation is as well established as the benefit: it does not rescue
    established neurological disease, even when started on the first day of life.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Respiratory Chain Electron Transfer Failure
    description: >-
      Supplies the missing carrier exogenously, bypassing the biosynthetic block
      rather than correcting it. Tissue penetration is the limiting factor, which
      is why the effect is organ-selective.
    evidence:
    - reference: PMID:35643375
      reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CoQ10 supplementation was associated with a substantial and significant
        sustained reduction of proteinuria by 88% at 12 months.
      explanation: The primary efficacy result, in the renal compartment.
  evidence:
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CoQ10 supplementation led to significantly better preservation of kidney
      function (5-year kidney failure-free survival 62% vs. 19%) with an
      improvement in general condition and neurological manifestations.
    explanation: >-
      The renal survival benefit against a genotype-, age- and function-matched
      untreated cohort.
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our findings indicate that all patients diagnosed with primary CoQ10
      deficiency should receive early and life-long CoQ10 supplementation to
      decelerate the progression of kidney disease and prevent further damage to
      other organs.
    explanation: The authors' treatment recommendation.
  - reference: PMID:30337132
    reference_title: Response to Early Coenzyme Q10 Supplementation Is not Sustained in CoQ10 Deficiency Caused by CoQ2 Mutation.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort with CoQ10 deficiency, neurological involvement did not
      improve with oral coenzyme Q10 treatment despite the initial recovery from
      the diabetes and nephrotic syndrome.
    explanation: >-
      Refutes the treatment as sufficient, specifically for the neurological
      compartment. It is curated as REFUTE beside the SUPPORT items rather than
      merged into them, because the claim it contradicts — that CoQ10 treats this
      disease — is a different claim from the one the renal cohort supports.
  - reference: PMID:42410653
    reference_title: "COQ2-Associated Primary Coenzyme Q10 Deficiency Presenting With Proteinuria: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After oral administration of high-dose CoQ10 (85 mg/kg/d) combined with
      enalapril maleate (0.80 mL/kg/d), the patient achieved complete remission of
      proteinuria and maintained stable renal function.
    explanation: >-
      A recent single-patient outcome that gives the dose, the co-medication and
      the renal response, which the cohort study does not. It reinforces the renal
      arm of the split rather than resolving the neurological one — this patient
      also had developmental delay and neurological lesions, not reported as
      improved.
  - reference: PMID:42410653
    reference_title: "COQ2-Associated Primary Coenzyme Q10 Deficiency Presenting With Proteinuria: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the therapeutic outcomes suggest that all diagnosed patients require
      long-term supplementation with adequate doses of CoQ10, which is of great
      significance for delaying disease progression
    explanation: >-
      An independent restatement of the treat-everyone-early recommendation, from a
      literature review rather than from the registry cohort.
- name: 4-hydroxybenzoic acid substrate enhancement
  description: >-
    An experimental substrate-enhancement strategy. 4-HBA is the natural
    substrate of COQ2, and raising its availability is proposed to compensate for
    defective substrate delivery and drive residual enzyme activity, restoring
    endogenous rather than supplying exogenous CoQ. In a mouse carrying the
    Coq2A252V variant, lifelong 4-HBA prevented mitochondrial encephalopathy
    where conventional CoQ10 did not, and withdrawal caused progressive
    neurological decline.

    On the strength of that, a first-in-human individual therapeutic trial was
    started in a 3-year-old boy with biallelic COQ2 variants and a Leigh-like
    syndrome who had responded minimally to high-dose CoQ10. Over six months he
    had sustained remission of proteinuria, rising serum CoQ10, and gains in
    motor, language and cognitive development, with no adverse effects. This is
    one patient over six months and the authors say further clinical
    investigation is needed; it is curated because it is the first therapy
    directed at the arm of the disease CoQ10 cannot reach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-hydroxybenzoic acid
      term:
        id: CHEBI:30763
        label: 4-hydroxybenzoic acid
  target_mechanisms:
  - target: COQ2 Polyprenyltransferase Deficiency
    description: >-
      Acts on the deficient enzyme itself by saturating its substrate channel,
      rather than bypassing it. This is why it is expected to reach tissues that
      exogenous CoQ10 does not — the CoQ is then made in situ.
    evidence:
    - reference: PMID:40929079
      reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Prior to clinical application, patient-derived fibroblasts were treated in
        vitro with 4-HBA, resulting in a marked increase in endogenous CoQ10
        levels.
      explanation: >-
        Demonstrates the mechanism in the patient's own cells before the drug was
        given, which is what licenses the target claim.
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that lifelong 4-HBA supplementation in a murine model
      carrying the pathogenic Coq2A252V variant is well tolerated and prevents
      the onset of mitochondrial encephalopathy.
    explanation: The preclinical result on the neurological endpoint.
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following the initiation of oral 4-HBA treatment, the patient experienced
      rapid and sustained remission of proteinuria, improved renal
      hyperfiltration and a gradual increase in serum CoQ10 concentrations.
    explanation: >-
      The first-in-human result. A single patient over six months, which is what
      the description says it is.
- name: Supportive nephrological and neurological care
  description: >-
    Management of nephrotic syndrome and progressive kidney failure, antiseizure
    medication, and developmental support. Immunosuppression is not indicated —
    the nephrotic syndrome is steroid- and multidrug-resistant by mechanism, and
    recognising the genetic cause is what stops it being given.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      leading to multidrug-resistant nephrotic syndrome as the hallmark kidney
      manifestation
    explanation: >-
      Supports withholding immunosuppression, by establishing that the nephrotic
      syndrome is resistant to it. The inference from "multidrug-resistant" to
      "do not immunosuppress" is one step, hence INDIRECT.
experimental_models:
- name: Yeast complementation assay for COQ2 allelic series
  experimental_model_type: OTHER
  description: >-
    A yeast model developed to score every COQ2 mutant allele reported at the
    time. Its purpose was not to model the disease but to measure residual
    activity per allele, and it is what established that COQ2 has a
    genotype-phenotype correlation where other CoQ genes do not.
  publication: PMID:27493029
  modeled_mechanisms:
  - target: COQ2 Polyprenyltransferase Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reads out residual catalytic activity of a human allele in a null yeast
      background, as a quantitative surrogate for enzyme function.
    limitations: >-
      Yeast CoQ biosynthesis and membrane composition differ from human, and the
      readout is growth-based complementation rather than direct measurement of
      human tissue CoQ. It cannot capture tissue-specific residual activity,
      which is precisely what would explain why one organ is affected and another
      is spared in the same patient.
    readouts:
    - name: Residual activity of mutant COQ2 allele
      target: COQ2 Polyprenyltransferase Deficiency
      direction: DECREASED
      interpretation: >-
        Graded loss of function per allele, which correlated with the clinical
        severity of patients carrying it.
      evidence:
      - reference: PMID:27493029
        reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Complementation experiments in yeast showed that the residual activity
          of the mutant proteins correlates with the clinical phenotypes observed
          in patients.
        explanation: The correlation between the assay readout and patient severity.
  evidence:

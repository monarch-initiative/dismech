inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic pathogenic COQ2 variants may be homozygous or compound heterozygous. When both parents carry a disease-causing allele, each pregnancy has a 25% affected, 50% carrier and 25% unaffected noncarrier probability. Parental testing establishes segregation and informs recurrence counseling.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In two siblings of consanguineous parents with the infantile form of CoQ(10) deficiency, we identified a homozygous missense mutation in the COQ2 gene, which encodes para-hydroxybenzoate-polyprenyl transferase.
    explanation: 'The founding genotype: homozygosity in affected siblings of consanguineous parents.'
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK410087/
    reference_title: Primary Coenzyme Q10 Deficiency Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If both parents are known to be heterozygous for a primary CoQ ... deficiency-related pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews gives the conditional autosomal recessive recurrence risks for primary CoQ deficiency.
prevalence:
- population: International CoQ10-deficiency-associated glomerulopathy cohort
  measure_type: CASES_IN_LITERATURE
  notes: The combined literature, registry and survey cohort included 63 COQ2 cases among 251 participants with COQ2, COQ6 or COQ8B disease. This renal-enriched sample is not a population prevalence estimate or an exhaustive count of COQ2 cases.
  evidence: &id003
  - &id010
    reference: url:https://dirros.openscience.si/Dokument.php?id=36089&lang=eng  # codespell:ignore dokument
    reference_title: https://dirros.openscience.si/Dokument.php?id=36089&lang=eng  # codespell:ignore dokument
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical data were available for 63, 48, and 140 patients with disease-causing variants in COQ2, COQ6, and COQ8B, respectively.
    explanation: The glomerulopathy cohort contains 63 COQ2 cases among 251 participants across three genes.
progression:
- phase: Variable organ involvement at presentation
  notes: 'In the renal-enriched cohort, COQ2 kidney manifestations began at a median age of one year. Renal and neurological onset vary independently: some infants have neurological disease before nephropathy, and lethal multisystem disease without identified renal involvement has been reported.'
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Kidney disease was first diagnosed at median age 1.0, 1.2 and 9.8 years in individuals with disease-causing variants in COQ2, COQ6 and COQ8B, respectively.
    explanation: Gene-specific median kidney-diagnosis ages in the ascertainment cohort.
  - reference: PMID:23816342
    reference_title: Early myoclonic epilepsy, hypertrophic cardiomyopathy and subsequently a nephrotic syndrome in a patient with CoQ10 deficiency caused by mutations in para-hydroxybenzoate-polyprenyl transferase (COQ2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast to previously reported patients with CoQ2 the proband presented with early myoclonic epilepsy, hypertrophic cardiomyopathy and only in a later stage developed a nephrotic syndrome.
    explanation: Direct patient chronology disproves an obligatory renal-first sequence.
- phase: Extrarenal disease after initially isolated nephropathy
  notes: Nine of 22 COQ2 patients initially described as having isolated kidney disease subsequently developed extrarenal manifestations, including three with follow-up extending to 20 years.
  evidence:
  - reference: url:https://dirros.openscience.si/Dokument.php?id=36089&lang=eng  # codespell:ignore dokument
    reference_title: https://dirros.openscience.si/Dokument.php?id=36089&lang=eng  # codespell:ignore dokument
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, extrarenal symptoms developed in 9 of 22 patients with initially isolated kidney disease — speciﬁcally, in 6 pa- tients within 3 years, and in a further 3 patients after up to 20 years of follow-up.
    explanation: The cohort documents individual transitions rather than inferring them from separate onset medians.
- phase: Progression to kidney failure
  notes: The cohort estimated approximately 48% probability of kidney failure by age five in COQ2 disease. Participants had mixed treatment histories; this is not an untreated natural-history estimate.
  evidence:
  - &id001
    reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: None of the patients with COQ8B variants, but 50% of patients with COQ2 and COQ6 variants progressed to kidney failure by age five.
    explanation: The abstract rounds the COQ2 estimate to 50%; Table 1 reports 47.6% at age five. The cohort includes treated and untreated patients.
pathophysiology:
- name: COQ2 Polyprenyltransferase Deficiency
  biological_scale: MOLECULAR
  description: COQ2 variants reduce the activity of the mitochondrial enzyme that attaches the hydroxybenzoate head-group precursor to the polyprenyl tail. Residual function varies by allele. Yeast complementation correlates with clinical severity in the studied series but does not establish a deterministic prognosis for every genotype.
  evidence:
  - reference: PMID:17374725
    reference_title: Missense mutation of the COQ2 gene causes defects of bioenergetics and de novo pyrimidine synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Polyprenyl-pHB transferase activity was 33-45% of controls in COQ2 mutant fibroblasts.
    explanation: Direct enzyme assay in fibroblasts carrying the founding COQ2 allele.
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our findings show that the main functional transcript of COQ2 is shorter than what was previously reported and that its protein product localizes to mitochondria with the C-terminus facing the intermembrane space.
    explanation: Establishes the protein's topology and, importantly for variant interpretation, that the functional transcript is shorter than had been assumed.

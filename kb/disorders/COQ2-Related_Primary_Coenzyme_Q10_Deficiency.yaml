name: COQ2-Related Primary Coenzyme Q10 Deficiency
creation_date: "2026-09-16T20:30:00Z"
description: >-
  COQ2-related primary coenzyme Q10 deficiency (COQ10D1) is an autosomal
  recessive mitochondrial disorder caused by biallelic variants in COQ2, which
  encodes para-hydroxybenzoate-polyprenyl transferase. COQ2 performs the
  condensation step of coenzyme Q biosynthesis, joining the benzoquinone head
  group to the polyisoprenoid tail, so its loss depletes the one molecule that
  ferries electrons from complexes I and II to complex III — and simultaneously
  removes the principal lipid-soluble antioxidant of the inner mitochondrial
  membrane. It was the first molecular cause of primary CoQ10 deficiency to be
  identified.

  Three phenotypes are recognised and appear to be graded by residual enzyme
  activity: a neonatal multisystem form with encephalopathy, renal dysfunction
  and early death; an intermediate childhood form with developmental delay,
  ataxia, hypotonia and steroid-resistant nephrotic syndrome; and a late-onset
  adult form reported as a subtype of multiple system atrophy. Unlike most CoQ
  biosynthesis genes, COQ2 shows a demonstrated genotype-phenotype correlation:
  residual activity of each mutant allele in a yeast complementation assay tracks
  the clinical severity observed in the patient carrying it.

  The disease is partially treatable, and the shape of that treatability is the
  most important thing about it. Oral CoQ10 substantially reduces proteinuria and
  preserves kidney function, but it does not rescue established neurological
  disease — a very lipophilic quinone crosses the blood-brain barrier poorly. A
  substrate-enhancement strategy using 4-hydroxybenzoic acid, the natural COQ2
  substrate, has now moved from a mouse model into a first-in-human individual
  therapeutic trial precisely to address that gap.

- name: Biochemical evaluation of unresolved molecular findings
  description: Selected tissue CoQ measurements and combined respiratory-chain assays can support diagnosis when genetic findings are unresolved. Such measurements do not distinguish primary from secondary CoQ deficiency by themselves.

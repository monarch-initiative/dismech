    explanation: Normal muscle enzyme results occurred in a subsequently diagnosed COQ2 infant.
- name: Decaprenyl-pyrophosphate accumulation in patient fibroblasts
  notes: A research assay in the COQ2 frameshift case identified accumulation of the prenyl substrate alongside absent detectable radiolabeled CoQ10 synthesis. This supports the biosynthetic block but is not presented as a routine clinical biomarker.
  evidence:

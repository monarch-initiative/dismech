- name: Kidney transplantation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  description: Transplantation is an option for end-stage kidney disease. The international cohort included 17 transplanted COQ2 patients; no disease recurrence in the allograft was observed across the 68 transplanted participants spanning three genes. Transplantation does not address ongoing extrarenal disease.

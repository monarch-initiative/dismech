- name: 4-hydroxybenzoic acid substrate enhancement
  description: Experimental supplementation with the natural COQ2 substrate 4-hydroxybenzoic acid aims to increase residual CoQ biosynthesis. In one child with p.Val141Leu/p.Ser181Ile variants, patient-fibroblast response preceded a compassionate-use treatment attempt. CoQ10 was stopped before 4-HBA; ramipril was discontinued after proteinuria improved. The report describes renal, motor, language and growth improvements, six months without observed adverse effects, and treatment ongoing at nine months. The uncontrolled observation cannot establish general efficacy, durable safety or superiority to CoQ10 in humans. In mice, preventive treatment beginning during pregnancy differs from treatment of an already symptomatic child.

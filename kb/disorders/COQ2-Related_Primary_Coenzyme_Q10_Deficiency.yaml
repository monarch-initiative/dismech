inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic COQ2 variants are required. The founding family was consanguineous
    with two homozygous affected siblings; later families include homozygous and
    compound heterozygous genotypes.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two siblings of consanguineous parents with the infantile form of
      CoQ(10) deficiency, we identified a homozygous missense mutation in the
      COQ2 gene, which encodes para-hydroxybenzoate-polyprenyl transferase.
    explanation: >-
      The founding genotype: homozygosity in affected siblings of consanguineous
      parents.
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      CoQ(10) deficiency is inherited as an autosomal recessive trait and has been
      associated with three main clinical phenotypes
    explanation: >-
      States the inheritance mode for primary CoQ10 deficiency as established
      background at the time this gene was found.
prevalence:
- population: Multi-registry cohort of CoQ10 deficiency-associated glomerulopathy (COQ2, COQ6, COQ8B)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A systematic review plus PodoNet, mitoNET and CCGKDD registry queries and a
    survey assembled 251 patients across the three main nephropathic CoQ10
    deficiency genes — 173 published and 78 new. The COQ2 share is a fraction of
    that total, and the cohort is ascertained through kidney disease, so it
    under-represents the purely neurological presentations.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a systematic literature review, PodoNet, mitoNET, and CCGKDD
      registries queries and an online survey, collecting comprehensive clinical
      and genetic data of 251 patients spanning 173 published (47 updated) and 78
      new cases.
    explanation: >-
      The cohort's size and construction, quoted so the denominator is visible.
progression:
- phase: Infantile onset with kidney disease
  notes: >-
    In the registry cohort, kidney disease was first diagnosed at a median age of
    1.0 year in COQ2 patients — the earliest of the three nephropathic CoQ
    genes. About a third present with isolated kidney involvement.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kidney disease was first diagnosed at median age 1.0, 1.2 and 9.8 years in
      individuals with disease-causing variants in COQ2, COQ6 and COQ8B,
      respectively.
    explanation: >-
      Age at renal diagnosis, with the sibling genes alongside for calibration.
- phase: Neurological involvement
  notes: >-
    Almost half of COQ2 patients in the renal cohort developed neurological
    symptoms, at a median age of 2.7 years — that is, typically after the kidney
    disease has declared itself. A fifth had the classic infantile multiorgan
    presentation from the start.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic infantile multiorgan involvement comprised 22% of the COQ2 variant
      cohort while 47% of them developed neurological symptoms at median age 2.7
      years.
    explanation: >-
      The split between multiorgan-at-onset and later neurological involvement.
- phase: Progression to kidney failure
  notes: >-
    Half of COQ2 patients progressed to kidney failure by age five in the
    untreated registry cohort, and adult kidney survival was 20-25% across all
    three genes. This is the outcome that CoQ10 supplementation changes.
  evidence:
  - reference: PMID:35483523
    reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the patients with COQ8B variants, but 50% of patients with COQ2 and
      COQ6 variants progressed to kidney failure by age five.
    explanation: >-
      Renal survival to age five, with the contrast against COQ8B that makes the
      gene identity matter prognostically.
pathophysiology:
- name: COQ2 Polyprenyltransferase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic COQ2 variants reduce the activity of the mitochondrial
    polyprenyltransferase that condenses 4-hydroxybenzoate with the
    polyisoprenoid tail. The protein localises to mitochondria with its
    C-terminus facing the intermembrane space. Residual activity is not
    all-or-nothing: yeast complementation across the reported allelic series
    grades each mutant, and that grade predicts the patient's phenotype.
  molecular_functions:
  - preferred_term: prenyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0004659
      label: prenyltransferase activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  downstream:
  - target: Coenzyme Q10 Biosynthetic Failure
    causal_link_type: DIRECT
    description: >-
      COQ2 catalyses an obligate step, so reduced activity reduces CoQ10 output.
    evidence:
    - reference: PMID:16400613
      reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Radioisotope assays confirmed a severe defect of CoQ(10) biosynthesis in
        the fibroblasts of one patient.
      explanation: >-
        Direct biosynthetic measurement in patient cells, which is what turns the
        genotype into a demonstrated enzymatic block.
  evidence:
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings show that the main functional transcript of COQ2 is shorter
      than what was previously reported and that its protein product localizes to
      mitochondria with the C-terminus facing the intermembrane space.
    explanation: >-
      Establishes the protein's topology and, importantly for variant
      interpretation, that the functional transcript is shorter than had been
      assumed.
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation experiments in yeast showed that the residual activity of
      the mutant proteins correlates with the clinical phenotypes observed in
      patients.
    explanation: >-
      The residual-activity-to-severity correlation, measured across the whole
      reported allelic series.
- name: Coenzyme Q10 Biosynthetic Failure
  biological_scale: MOLECULAR
  description: >-
    Endogenous CoQ10 falls. Coenzyme Q is a lipid-soluble mobile carrier present
    in virtually all cell membranes, so the deficit is systemic rather than
    tissue-restricted; what varies between tissues is how much they mind.
  biological_processes:
  - preferred_term: ubiquinone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
  downstream:
  - target: Respiratory Chain Electron Transfer Failure
    causal_link_type: DIRECT
    description: >-
      Coenzyme Q is the carrier between complexes I/II and complex III, so its
      depletion interrupts the chain at that point.
  - target: Loss of Membrane Antioxidant Capacity
    causal_link_type: DIRECT
    description: >-
      Reduced ubiquinol is the principal lipid-phase antioxidant of the inner
      mitochondrial membrane, and is lost along with the carrier function.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Ubiquinone (coenzyme Q(10) or CoQ(10)) is a lipid-soluble component of
      virtually all cell membranes, where it functions as a mobile electron and
      proton carrier.
    explanation: >-
      Defines the molecule's role and its ubiquity, which is why the deficiency
      is multisystem. Stated as established background in this paper's opening.
- name: Respiratory Chain Electron Transfer Failure
  biological_scale: CELLULAR
  description: >-
    Without sufficient coenzyme Q, electrons cannot pass from complexes I and II
    to complex III, so oxidative phosphorylation is impaired and lactate
    accumulates. This is the node that the two therapeutic strategies —
    exogenous CoQ10 and 4-HBA substrate enhancement — both aim at, by different
    routes.
  biological_processes:
  - preferred_term: respiratory electron transport chain
    modifier: DECREASED
    term:
      id: GO:0022904
      label: respiratory electron transport chain
  downstream:
  - target: Podocyte Energetic Failure
    causal_link_type: DIRECT
  - target: Neuronal Bioenergetic Failure
    causal_link_type: DIRECT
  - target: Retinal and Optic Nerve Bioenergetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptors and retinal ganglion cells are high-oxidative-demand tissues,
      so the retinal branch is placed downstream of the same upstream failures as
      the podocyte and neuronal branches. The intermediates are unknown because no
      retinal-tissue study exists in this disease; the link is inferred rather than
      measured, which is why it is drawn as an indirect edge with unknown
      intermediates rather than a direct one.
  - target: Lactic acidosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Coenzyme Q (CoQ) is a key component of the mitochondrial respiratory chain
      and is essential for cellular energy production and metabolic homeostasis.
    explanation: >-
      States the bioenergetic role whose loss defines this node. Background
      framing rather than this paper's own result.
- name: Loss of Membrane Antioxidant Capacity
  biological_scale: CELLULAR
  description: >-
    Reduced coenzyme Q (ubiquinol) is the main lipid-soluble antioxidant of
    mitochondrial membranes, so primary CoQ deficiency removes antioxidant
    protection at the same time and in the same compartment as it removes
    electron transfer. This node is curated separately from the bioenergetic one
    because the two are distinct claims and a therapy could in principle restore
    one without the other; no study in COQ2 patients has separated them.
  downstream:
  - target: Podocyte Energetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neuronal Bioenergetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal and Optic Nerve Bioenergetic Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptors and retinal ganglion cells are high-oxidative-demand tissues,
      so the retinal branch is placed downstream of the same upstream failures as
      the podocyte and neuronal branches. The intermediates are unknown because no
      retinal-tissue study exists in this disease; the link is inferred rather than
      measured, which is why it is drawn as an indirect edge with unknown
      intermediates rather than a direct one.
- name: Podocyte Energetic Failure
  biological_scale: TISSUE
  description: >-
    The glomerular podocyte is the kidney cell that fails. It is terminally
    differentiated, mitochondria-rich and cannot be replaced, which is the
    standard explanation for why CoQ biosynthesis defects present as
    steroid-resistant nephrotic syndrome rather than as a tubulopathy. Kidney
    involvement is the hallmark manifestation of the nephropathic CoQ
    deficiencies, and in COQ2 it is often the presenting problem.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  downstream:
  - target: Steroid-resistant nephrotic syndrome
    causal_link_type: DIRECT
  - target: Proteinuria
    causal_link_type: DIRECT
  - target: Renal insufficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Primary Coenzyme Q10 (CoQ10) deficiency is an ultra-rare disorder caused by
      defects in genes involved in CoQ10 biosynthesis leading to
      multidrug-resistant nephrotic syndrome as the hallmark kidney
      manifestation.
    explanation: >-
      Names nephrotic syndrome as the hallmark renal manifestation of this group
      of disorders.
- name: Neuronal Bioenergetic Failure
  biological_scale: TISSUE
  description: >-
    Encephalopathy, developmental delay, ataxia, hypotonia and intractable
    seizures. The critical property of this node is that it does not respond to
    oral CoQ10: the neurological arm of the disease continues to progress in
    patients whose renal and metabolic manifestations have remitted on treatment.
    The proposed reason is pharmacokinetic rather than mechanistic — CoQ10 is
    very lipophilic and crosses the blood-brain barrier poorly.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Encephalopathy
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Generalized hypotonia
    causal_link_type: DIRECT
  - target: Ataxia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30337132
    reference_title: Response to Early Coenzyme Q10 Supplementation Is not Sustained in CoQ10 Deficiency Caused by CoQ2 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The siblings responded dramatically to coenzyme Q10 treatment with
      normalized glucose and proteinuria levels, but they developed refractory
      focal clonic seizures beginning at three months of life that progressed to
      encephalopathy.
    explanation: >-
      The dissociation in its sharpest form: the same patients, treated from day
      one of life, with the renal and metabolic arms rescued and the neurological
      arm not.
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      This limitation is particularly critical in patients with neurological
      involvement, as CoQ10 has limited ability to cross the blood–brain barrier
      and reach neuronal tissue
    explanation: >-
      The pharmacokinetic explanation offered for the neurological
      non-response. It is the authors' framing of established knowledge, and it
      is a proposed reason rather than a demonstrated one.
- name: Retinal and Optic Nerve Bioenergetic Failure
  biological_scale: TISSUE
  description: >-
    Photoreceptors and retinal ganglion cell axons are among the most
    energy-demanding tissues in the body, and they fail in COQ2 disease with a
    cone-greater-than-rod pattern on electroretinography plus optic nerve
    atrophy. This node matters out of proportion to its frequency because
    retinopathy in primary CoQ10 deficiency has been reported only with COQ2
    variants, which makes it the most gene-discriminating feature of the entry.

    Unlike the podocyte and neuronal nodes, no retinal-tissue study exists. The
    mechanism here is inferred from the shared respiratory-chain lesion upstream
    and from the ophthalmological phenotyping of genotyped patients, not
    demonstrated in retina, so the node asserts the site of failure and not a
    retina-specific pathway.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Cone-rod dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases of retinopathy in primary CoQ10 deficiency have been reported in
      the setting of mutations in the COQ2 gene
    explanation: >-
      Establishes that the retinal phenotype is specific to this gene among the
      primary CoQ10 deficiencies, which is why it is curated as its own node
      rather than folded into the neuronal one.
  - reference: PMID:36420660
    reference_title: Retinopathy and optic atrophy in a case of COQ2-related primary coenzyme Q(10) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An eight-year-old female with nephropathy requiring renal transplantation
      subsequently developed progressive cone-rod dystrophy and optic atrophy.
    explanation: >-
      The index observation in a patient with biallelic COQ2 variants, giving both
      phenotypes this node feeds.

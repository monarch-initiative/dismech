genetic:
- name: COQ2
  gene_term:
    preferred_term: COQ2
    term:
      id: hgnc:25223
      label: COQ2
  relationship_type: CAUSATIVE
  notes: Biallelic COQ2 disease includes homozygous and compound heterozygous missense alleles and reported C-terminal frameshift alleles. Assayed variants retain differing degrees of function. Yeast complementation supports an allele-function/phenotype association, but clinical variability and ascertainment limit individual prognostication. Older publications use longer COQ2 transcripts and protein numbering; variant names below preserve source nomenclature unless an explicit transcript is supplied. Heterozygous COQ2 susceptibility findings in sporadic multiple system atrophy are a separate association and are outside this recessive disease entry.
  variants:
  - name: c.890A>G (p.Tyr297Cys)
    description: Founding homozygous missense allele in two siblings; the name preserves the 2006 paper’s nucleotide and protein numbering. Patient fibroblasts show residual enzyme activity and impaired CoQ synthesis.
  - name: c.437G>A (p.Ser146Asn)
    description: Source-named p.Ser146Asn allele in four patients from two families. The two siblings treated from the first day of life had renal and endocrine improvement but developed refractory seizures and encephalopathy.
  - name: c.1198delT (N401fsX415; source nomenclature)
    type: frameshift
    variant_type: deletion
    description: Homozygous C-terminal frameshift in the neonatal COQ2 patient in Mollet et al.; the abnormal transcript persisted, and mutant protein production was inferred rather than measured.
    evidence:
    - reference: PMID:17332895
      reference_title: Prenyldiphosphate synthase, subunit 1 (PDSS1) and OH-benzoate polyprenyltransferase (COQ2) mutations in ubiquinone deficiency and oxidative phosphorylation disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Finally, direct sequencing of the genes known to be involved in ubiquinone biosynthesis was systematically performed in patient 3 and identified a homozygous base pair deletion in exon 7 of the OH-benzoate polyprenyltransferase gene (COQ2, c.1198delT, N401fsX415; Figure 5A) resulting in a premature stop codon.
      explanation: COQ2 family, distinct from the PDSS1 family in the same report.
  - name: NM_001358921.2:c.421G>C (p.Val141Leu)
    type: missense
    variant_type: single nucleotide variant
    description: Maternally inherited allele classified as likely pathogenic in the 4-HBA-treated child, in trans with p.Ser181Ile. Older transcript alias NM_015697.9:c.571G>C (p.Val191Leu).
    evidence:
    - reference: PMID:40929079
      reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Genetic analysis revealed compound-heterozygous variants in the COQ2 gene [NM_001358921.2:c.421G>C, p.(Val141Leu),24 old nomenclature: NM_015697.9: c.571G>C, p.(Val191Leu), maternal; NM_001358921.2:c.542G>T, p.(Ser181Ile), old nomenclature: NM_015697.9:c.692G>T, p.(Ser231Ile), paternal].'
      explanation: The source explicitly supplies current and older transcript-specific names and parental origin.
    - reference: PMID:40929079
      reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Together with the clinical phenotype of the patient and biochemical evidence of CoQ deficiency, the variant was considered as likely pathogenic.
      explanation: The authors classify Val141Leu as likely pathogenic, not definitively pathogenic.
  - name: NM_001358921.2:c.542G>T (p.Ser181Ile)
    type: missense
    variant_type: single nucleotide variant
    description: Paternally inherited allele described as pathogenic in the 4-HBA-treated child, in trans with p.Val141Leu. Older transcript alias NM_015697.9:c.692G>T (p.Ser231Ile).
    evidence:
    - reference: PMID:40929079
      reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Genetic analysis revealed compound-heterozygous variants in the COQ2 gene [NM_001358921.2:c.421G>C, p.(Val141Leu),24 old nomenclature: NM_015697.9: c.571G>C, p.(Val191Leu), maternal; NM_001358921.2:c.542G>T, p.(Ser181Ile), old nomenclature: NM_015697.9:c.692G>T, p.(Ser231Ile), paternal].'

      label: Ubiquinone 10 Measurement
  notes: CoQ10 can be reduced in muscle, renal cortex and patient fibroblasts. Plasma or serum CoQ10 does not reliably reflect endogenous tissue synthesis and is not a stand-alone diagnostic test. Molecular testing usually establishes the diagnosis; invasive tissue testing is selected for unresolved cases rather than required universally.

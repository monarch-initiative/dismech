- name: Neuronal Bioenergetic Failure
  biological_scale: TISSUE
  description: >-
    Encephalopathy, developmental delay, ataxia, hypotonia and intractable
    seizures. The critical property of this node is that it does not respond to
    oral CoQ10: the neurological arm of the disease continues to progress in
    patients whose renal and metabolic manifestations have remitted on treatment.

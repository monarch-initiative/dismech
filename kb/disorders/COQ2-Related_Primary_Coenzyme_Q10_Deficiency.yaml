genetic:
- name: COQ2
  gene_term:
    preferred_term: COQ2
    term:
      id: hgnc:25223
      label: COQ2
  relationship_type: CAUSATIVE
  notes: >-
    COQ2 (4q21.23) encodes para-hydroxybenzoate-polyprenyl transferase. It is a
    frequent cause of primary CoQ deficiency and carries the widest clinical
    spectrum of the group. Unusually among the CoQ genes, the genotype is
    informative: yeast complementation of the reported allelic series grades
    residual activity, and that grade tracks the patient's severity — the paper
    contrasts this explicitly with ADCK3, where no such correlation holds.

    A separate and unsettled claim concerns heterozygous COQ2 variants as a
    susceptibility factor for multiple system atrophy. That is a different
    zygosity, a different phenotype and a contested replication record; it is not
    curated as part of this recessive disease, and this repository's
    Multiple_System_Atrophy entry is where it belongs. The late-onset adult
    COQ2-related presentation reported as an MSA subtype is described in the
    biallelic literature as one of the three COQ2 phenotypes, which is a
    different claim again.
  variants:
  - name: c.890A>G (p.Tyr297Cys)
    description: >-
      The founding allele, homozygous in two siblings with the infantile form. It
      changes a highly conserved tyrosine within a predicted transmembrane
      domain.
  - name: c.437G>A (p.Ser146Asn)
    description: >-
      Reported in four patients from two families presenting with neonatal
      diabetes and nephrotic-range proteinuria; the renal and endocrine features
      responded to CoQ10 and the neurological course did not.
  evidence:
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The A-->G transition at nucleotide 890 changes a highly conserved tyrosine
      to cysteine at amino acid 297 within a predicted transmembrane domain.
    explanation: The founding allele and its structural context.
  - reference: PMID:16400613
    reference_title: A mutation in para-hydroxybenzoate-polyprenyl transferase (COQ2) causes primary coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation in COQ2 is the first molecular cause of primary CoQ(10)
      deficiency.
    explanation: >-
      Establishes COQ2 as the founding gene of the primary CoQ10 deficiencies.
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We defined the structure of COQ2 with relevant implications for mutation
      screening in patients and demonstrated that, contrary to other COQ gene
      defects such as ADCK3, there is a correlation between COQ2 genotype and
      patient's phenotype.
    explanation: >-
      The genotype-phenotype correlation, stated with the explicit contrast that
      makes it specific to this gene.
  case_fractions:
  - population: Multi-registry CoQ10 deficiency glomerulopathy cohort
    notes: >-
      COQ2 is one of the three genes that account for CoQ10 deficiency-associated
      steroid-resistant nephrotic syndrome. No per-gene share of the 251-patient
      cohort is reported in a form that can be quoted as a fraction, so the
      numeric slots are left empty rather than derived.
    evidence:
    - reference: PMID:35483523
      reference_title: Variation of the clinical spectrum and genotype-phenotype associations in Coenzyme Q10 deficiency associated glomerulopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        including steroid-resistant nephrotic syndrome mainly associated with
        disease-causing variants in the genes COQ2, COQ6 or COQ8B
      explanation: Names the three genes responsible for the nephropathic presentation.
treatments:
- name: Oral coenzyme Q10 supplementation
  description: >-
    High-dose oral CoQ10 is the standard treatment. In a 116-patient
    international series with a median two years of follow-up it reduced
    proteinuria by 88% at 12 months and improved five-year kidney failure-free
    survival from 19% to 62%, with uncommon and mild side effects. The authors
    conclude that every patient diagnosed with primary CoQ10 deficiency should
    receive early lifelong supplementation.

    The limitation is as well established as the benefit: it does not rescue
    established neurological disease, even when started on the first day of life.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Respiratory Chain Electron Transfer Failure
    description: >-
      Supplies the missing carrier exogenously, bypassing the biosynthetic block
      rather than correcting it. Tissue penetration is the limiting factor, which
      is why the effect is organ-selective.
    evidence:
    - reference: PMID:35643375
      reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CoQ10 supplementation was associated with a substantial and significant
        sustained reduction of proteinuria by 88% at 12 months.
      explanation: The primary efficacy result, in the renal compartment.
  evidence:
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CoQ10 supplementation led to significantly better preservation of kidney
      function (5-year kidney failure-free survival 62% vs. 19%) with an
      improvement in general condition and neurological manifestations.
    explanation: >-
      The renal survival benefit against a genotype-, age- and function-matched
      untreated cohort.
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our findings indicate that all patients diagnosed with primary CoQ10
      deficiency should receive early and life-long CoQ10 supplementation to
      decelerate the progression of kidney disease and prevent further damage to
      other organs.
    explanation: The authors' treatment recommendation.
  - reference: PMID:30337132
    reference_title: Response to Early Coenzyme Q10 Supplementation Is not Sustained in CoQ10 Deficiency Caused by CoQ2 Mutation.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort with CoQ10 deficiency, neurological involvement did not
      improve with oral coenzyme Q10 treatment despite the initial recovery from
      the diabetes and nephrotic syndrome.
    explanation: >-
      Refutes the treatment as sufficient, specifically for the neurological
      compartment. It is curated as REFUTE beside the SUPPORT items rather than
      merged into them, because the claim it contradicts — that CoQ10 treats this
      disease — is a different claim from the one the renal cohort supports.
- name: 4-hydroxybenzoic acid substrate enhancement
  description: >-
    An experimental substrate-enhancement strategy. 4-HBA is the natural
    substrate of COQ2, and raising its availability is proposed to compensate for
    defective substrate delivery and drive residual enzyme activity, restoring
    endogenous rather than supplying exogenous CoQ. In a mouse carrying the
    Coq2A252V variant, lifelong 4-HBA prevented mitochondrial encephalopathy
    where conventional CoQ10 did not, and withdrawal caused progressive
    neurological decline.

    On the strength of that, a first-in-human individual therapeutic trial was
    started in a 3-year-old boy with biallelic COQ2 variants and a Leigh-like
    syndrome who had responded minimally to high-dose CoQ10. Over six months he
    had sustained remission of proteinuria, rising serum CoQ10, and gains in
    motor, language and cognitive development, with no adverse effects. This is
    one patient over six months and the authors say further clinical
    investigation is needed; it is curated because it is the first therapy
    directed at the arm of the disease CoQ10 cannot reach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-hydroxybenzoic acid
      term:
        id: CHEBI:30763
        label: 4-hydroxybenzoic acid
  target_mechanisms:
  - target: COQ2 Polyprenyltransferase Deficiency
    description: >-
      Acts on the deficient enzyme itself by saturating its substrate channel,
      rather than bypassing it. This is why it is expected to reach tissues that
      exogenous CoQ10 does not — the CoQ is then made in situ.
    evidence:
    - reference: PMID:40929079
      reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Prior to clinical application, patient-derived fibroblasts were treated in
        vitro with 4-HBA, resulting in a marked increase in endogenous CoQ10
        levels.
      explanation: >-
        Demonstrates the mechanism in the patient's own cells before the drug was
        given, which is what licenses the target claim.
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that lifelong 4-HBA supplementation in a murine model
      carrying the pathogenic Coq2A252V variant is well tolerated and prevents
      the onset of mitochondrial encephalopathy.
    explanation: The preclinical result on the neurological endpoint.
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following the initiation of oral 4-HBA treatment, the patient experienced
      rapid and sustained remission of proteinuria, improved renal
      hyperfiltration and a gradual increase in serum CoQ10 concentrations.
    explanation: >-
      The first-in-human result. A single patient over six months, which is what
      the description says it is.
- name: Supportive nephrological and neurological care
  description: >-
    Management of nephrotic syndrome and progressive kidney failure, antiseizure
    medication, and developmental support. Immunosuppression is not indicated —
    the nephrotic syndrome is steroid- and multidrug-resistant by mechanism, and
    recognising the genetic cause is what stops it being given.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35643375
    reference_title: Oral Coenzyme Q10 supplementation leads to better preservation of kidney function in steroid-resistant nephrotic syndrome due to primary Coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      leading to multidrug-resistant nephrotic syndrome as the hallmark kidney
      manifestation
    explanation: >-
      Supports withholding immunosuppression, by establishing that the nephrotic
      syndrome is resistant to it. The inference from "multidrug-resistant" to
      "do not immunosuppress" is one step, hence INDIRECT.
experimental_models:
- name: Yeast complementation assay for COQ2 allelic series
  experimental_model_type: OTHER
  description: >-
    A yeast model developed to score every COQ2 mutant allele reported at the
    time. Its purpose was not to model the disease but to measure residual
    activity per allele, and it is what established that COQ2 has a
    genotype-phenotype correlation where other CoQ genes do not.
  publication: PMID:27493029
  modeled_mechanisms:
  - target: COQ2 Polyprenyltransferase Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reads out residual catalytic activity of a human allele in a null yeast
      background, as a quantitative surrogate for enzyme function.
    limitations: >-
      Yeast CoQ biosynthesis and membrane composition differ from human, and the
      readout is growth-based complementation rather than direct measurement of
      human tissue CoQ. It cannot capture tissue-specific residual activity,
      which is precisely what would explain why one organ is affected and another
      is spared in the same patient.
    readouts:
    - name: Residual activity of mutant COQ2 allele
      target: COQ2 Polyprenyltransferase Deficiency
      direction: DECREASED
      interpretation: >-
        Graded loss of function per allele, which correlated with the clinical
        severity of patients carrying it.
      evidence:
      - reference: PMID:27493029
        reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Complementation experiments in yeast showed that the residual activity
          of the mutant proteins correlates with the clinical phenotypes observed
          in patients.
        explanation: The correlation between the assay readout and patient severity.
  evidence:
  - reference: PMID:27493029
    reference_title: The COQ2 genotype predicts the severity of coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have characterized the structure of human COQ2, defined its subcellular
      localization and developed a yeast model to validate all the mutant alleles
      reported so far.
    explanation: Describes the model and its intended scope.
- name: COQ2 patient fibroblasts treated with 4-hydroxybenzoic acid
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from the trial patient, treated with 4-HBA before the drug was
    given clinically. This is an n-of-1 preclinical step inside a single-patient
    therapeutic trial.
  publication: PMID:40929079
  modeled_mechanisms:
  - target: Coenzyme Q10 Biosynthetic Failure
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      4-HBA raised endogenous CoQ10 in the patient's own cells, which is the
      pharmacodynamic claim the treatment rests on.
    limitations: >-
      Fibroblasts are not brain or podocyte, and an increase in cellular CoQ10 is
      a biomarker rather than a clinical outcome. The cells came from one
      patient with one genotype.
    readouts:
    - name: Endogenous cellular CoQ10 level
      target: Coenzyme Q10 Biosynthetic Failure
      direction: INCREASED
      interpretation: >-
        Confirms the substrate-enhancement mechanism operates on this patient's
        alleles.
      evidence:
      - reference: PMID:40929079
        reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          patient-derived fibroblasts were treated in vitro with 4-HBA, resulting
          in a marked increase in endogenous CoQ10 levels
        explanation: The measured rescue in patient cells.
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Prior to clinical application, patient-derived fibroblasts were treated in
      vitro with 4-HBA, resulting in a marked increase in endogenous CoQ10
      levels.
    explanation: >-
      Establishes the cell model and its role in the decision to treat.
animal_models:
- name: Coq2 A252V knock-in mouse
  species: Mouse
  genotype: Coq2 p.A252V
  publication: PMID:40929079
  modeled_mechanisms:
  - target: Neuronal Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Develops mitochondrial encephalopathy, which is the human manifestation
      that CoQ10 fails to treat — so the model reproduces precisely the arm of
      the disease that needed a model.
    limitations: >-
      The modelled allele is a mouse Coq2 variant, not one of the human alleles
      catalogued in the yeast series, and mouse CoQ9/CoQ10 proportions differ
      from human, which is one of the stated reasons exogenous CoQ10 behaves
      differently across species. Renal phenotype is not the focus.
    readouts:
    - name: Onset of mitochondrial encephalopathy
      target: Neuronal Bioenergetic Failure
      direction: ABOLISHED
      interpretation: >-
        Lifelong 4-HBA prevented encephalopathy onset; withdrawing it produced
        progressive neurological decline, so the effect is maintenance-dependent.
      evidence:
      - reference: PMID:40929079
        reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, withdrawal of 4-HBA leads to progressive neurological
          decline.
        explanation: >-
          The withdrawal arm, which is what shows the rescue depends on continued
          treatment rather than on a developmental window.
  evidence:
  - reference: PMID:40929079
    reference_title: Preclinical and first-in-human evidence of 4-hydroxybenzoic acid for mitochondrial COQ2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, while conventional CoQ10 supplementation transiently ameliorated
      cardiac dysfunction, it failed to prevent fatal neurological deterioration.
    explanation: >-
      The model reproduces the organ-selective failure of CoQ10 seen in patients,
      which is the property that makes it informative for this disease.
discussions:
- discussion_id: gap_coq2_neuro_nonresponse_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neurological non-response to oral CoQ10 purely a delivery problem, or
    is established neuronal damage irreversible once it has occurred?
  attaches_to:
  - "pathophysiology#Neuronal Bioenergetic Failure"
  rationale: >-
    The delivery explanation is the one the literature offers — CoQ10 is very
    lipophilic and crosses the blood-brain barrier poorly, and the brain's CoQ9
    proportion is higher than other tissues. But the sibling case that treated
    from the first day of life and still saw refractory seizures by three months
    is hard to explain by delivery alone if any drug reaches the brain at all,
    and it is equally compatible with a developmental window that closes. The two
    have opposite implications for 4-HBA: if delivery is the whole story, a
    compound that restores endogenous synthesis should work at any age; if
    neuronal loss is fixed once established, it must be started before symptoms.
    The first-in-human 4-HBA patient was already symptomatic and improved, which
    is a point for the delivery explanation, but it is one patient over six
    months.
  proposed_experiments:
  - experiment_id: exp_coq2_brain_coq_pk
    name: Brain CoQ measurement under CoQ10 versus 4-HBA in the Coq2 model
    description: >-
      Measure brain tissue CoQ9 and CoQ10 concentrations in the Coq2A252V mouse
      under oral CoQ10 and under 4-HBA, to establish whether the difference in
      neurological outcome tracks a difference in brain CoQ delivery.
    would_support:
    - "pathophysiology#Neuronal Bioenergetic Failure"
  - experiment_id: exp_coq2_late_rescue
    name: Delayed-start 4-HBA in the Coq2 model
    description: >-
      Begin 4-HBA after encephalopathy has become established in the mouse model
      and measure whether the deficit reverses, stabilises, or continues, to
      separate a delivery limitation from irreversible damage.
- discussion_id: gap_coq2_organ_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some biallelic COQ2 patients present with isolated kidney disease
    while others have multiorgan disease from birth, given the same enzymatic
    block in every tissue?
  attaches_to:
  - "pathophysiology#COQ2 Polyprenyltransferase Deficiency"
  - "pathophysiology#Podocyte Energetic Failure"
  rationale: >-
    A third of COQ2 patients have isolated kidney involvement at diagnosis and a
    fifth have classic infantile multiorgan disease, yet the deficient enzyme is
    the same one in every cell. Residual activity is the leading explanation and
    has real support — the yeast series grades alleles and the grades track
    severity. But the same registry analysis reports substantial intra-familial
    variability, which residual activity cannot explain, since siblings share
    both alleles. The authors invoke genetic and non-genetic modifiers without
    naming any. Resolving this would change what a family is told when a second
    child is found to carry the same genotype.
  proposed_experiments:
  - experiment_id: exp_coq2_tissue_residual_activity
    name: Tissue-resolved CoQ measurement across affected and spared organs
    description: >-
      Measure CoQ9 and CoQ10 concentrations and respiratory chain function across
      kidney, brain, heart and muscle in a COQ2 model carrying an intermediate
      allele, testing whether organ involvement tracks tissue CoQ level or
      whether some tissues tolerate the same deficit better.
  - experiment_id: exp_coq2_sibling_modifier_search
    name: Modifier search in discordant sibling pairs
    description: >-
      Perform genome and transcriptome comparison on the reported sibling pairs
      with the same COQ2 genotype and discordant severity, looking for modifier
      variants in CoQ biosynthesis, transport or antioxidant pathways.
notes: >-
  Scope and lump/split. This entry covers biallelic COQ2 primary CoQ10
  deficiency. Per-gene entries are the established shape beneath the
  Primary_Coenzyme_Q10_Deficiency umbrella, which already has
  COQ4-Related_Neonatal_Encephalomyopathy and
  COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome; MONDO:0011829 was bound
  nowhere in kb/. The name follows those siblings' gene-prefixed convention
  rather than MONDO's numbered label, so the three sort together.

  The three COQ2 phenotypes — neonatal multisystem, intermediate childhood, and
  late-onset adult — are curated as a severity gradient within one entry rather
  than as has_subtypes, because the literature attributes them to residual
  enzyme activity along a continuum and the yeast allelic series supports that
  reading. Splitting them would assert a discreteness the evidence does not show.

  The multiple system atrophy question is deliberately kept out. Heterozygous
  COQ2 variants have been reported as an MSA susceptibility factor with a mixed
  replication record; that is a different zygosity and a different disease, it
  belongs to this repository's Multiple_System_Atrophy entry, and nothing here
  asserts it. The genetic notes say so explicitly so that a reader who arrives
  from the MSA literature is not left to infer it.

  A REFUTE item sits beside SUPPORT items on the CoQ10 treatment. That is
  deliberate and is the pattern CLAUDE.md prescribes for a source that supports
  one part of a claim and contradicts another: the renal cohort supports
  "CoQ10 treats this disease" for the kidney, and the sibling series refutes it
  for the brain. Collapsing them into one graded item would lose the fact that
  the disagreement is compartmental rather than a difference of opinion.

  What is deliberately absent. No datasets: block — a COQ2 search is dominated by
  the multiple system atrophy association studies, which are the wrong zygosity
  and the wrong disease, and no COQ10D1-specific dataset was identified. No
  clinical_trials: block — the 4-HBA work is described as a first-in-human
  individual therapeutic trial, which is an n-of-1 compassionate-use
  administration rather than a registered interventional trial, and no
  registration identifier is given in the source. Recording it as a
  clinical_trials entry would assert a registration that may not exist. It is
  curated under treatments with its evidence instead. No environmental: block.

  GeneReviews. PMID:28125198, Primary Coenzyme Q(10) Deficiency Overview, is the
  baseline chapter and is tagged in references:. It is an overview of the gene
  group rather than a COQ2-specific chapter. Verified by PubMed genereviews[book]
  search; the other chapter that search returns, Hereditary Ataxia Overview
  (PMID:20301317), covers CoQ deficiency only as one cause of ataxia and is not
  cited here.

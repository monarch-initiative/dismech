discussions:
- discussion_id: gap_coq2_neuro_response
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which determinants explain variable neurological response to CoQ10 and the reversibility of established disease with 4-HBA?
  attaches_to:
  - pathophysiology#Cerebral Bioenergetic Impairment
  rationale: Some COQ2 patients improve neurologically with CoQ10 whereas severe infantile disease can progress despite early treatment. The mouse study already measured brain CoQ and respiration under CoQ10 and 4-HBA; those endpoints are not missing. Cell-specific exposure, delayed-start rescue and durable human efficacy remain unresolved.
  evidence:
  - *id008
  - *id009
  proposed_experiments:
  - experiment_id: exp_coq2_late_rescue
    name: Delayed-start 4-HBA after established neurological disease
    description: Reintroduce 4-HBA after withdrawal-induced neurological pathology is established and distinguish reversal, stabilization and progression using prespecified functional and pathological outcomes.
    would_support:
    - pathophysiology#Cerebral Bioenergetic Impairment
  - experiment_id: exp_coq2_cell_compartment_pk
    name: Cell-type and mitochondrial-compartment pharmacodynamics
    description: Compare neuronal and glial intracellular CoQ pools and respiratory function during treatment, beyond the already reported whole-brain measurements.
- discussion_id: gap_coq2_organ_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Why do some COQ2 genotypes cause isolated renal disease while others spare the kidney despite severe multisystem disease?
  attaches_to:
  - pathophysiology#COQ2 Polyprenyltransferase Deficiency
  - pathophysiology#Glomerular Filtration Barrier Injury
  rationale: Residual function contributes to phenotype, but a simple renal-first severity gradient does not explain the spectrum. The contribution of tissue-specific CoQ requirements and additional genetic or nongenetic modifiers remains unresolved.
  evidence:
  - reference: PMID:23343605
    reference_title: A novel mutation in COQ2 leading to fatal infantile multisystem disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The children were born prematurely and died at the age of five and six months, respectively, after an undulating disease course involving apneas, seizures, feeding problems and generalized edema, alternating with relative stable periods without the need of artificial ventilation. There was no evidence for renal involvement.
    explanation: The COQ2 twins demonstrate a fatal multisystem course without identified renal involvement.
  - *id010
  proposed_experiments:
  - experiment_id: exp_coq2_tissue_response
    name: Matched-genotype comparisons across patient-derived cell types
    description: Compare respiratory, redox and pyrimidine phenotypes across differentiated renal and neural cells carrying matched COQ2 genotypes, while testing candidate modifiers.
notes: This entry covers biallelic COQ2 primary coenzyme Q10 deficiency, including severe neonatal, childhood renal or neurological, and later-onset presentations. These overlapping presentations are not treated as discrete molecular subtypes. GeneReviews also describes adult retinitis pigmentosa associated with late-onset multiple system atrophy in the COQ2 disease spectrum. That biallelic presentation is within scope; individual autonomic or parkinsonian manifestations are not inferred from the syndrome name alone. Heterozygous susceptibility associations with sporadic multiple system atrophy belong to the separate multiple-system-atrophy entry. Cohort frequencies are restricted to their stated ascertainment and informative denominators. The 4-HBA human evidence is an individual compassionate-use treatment attempt; no trial-registration identifier is supplied in that publication.

    snippet: The infant was started on oral enalapril maleate (0.80 mL/kg/d) to reduce proteinuria, and CoQ10 (85 mg/kg/d) was administered after the gene sequencing results came out.
    explanation: Combined treatment in the reported infant; the volume dose is not converted to a mass dose without a stated concentration.

name: DEPDC5-Related Epilepsy
creation_date: "2026-07-25T00:00:00Z"
category: Mendelian
description: >-
  DEPDC5-related epilepsy is the gene-anchored spectrum of focal epilepsies caused
  by loss-of-function variants in DEPDC5, which encodes a subunit of the GATOR1
  complex (with NPRL2 and NPRL3) that inhibits the amino-acid-sensing branch of
  mTORC1. Loss of GATOR1 restraint releases mTORC1 into constitutive
  hyperactivation, defining a focal "mTORopathy." Mechanistically the disorder is
  distinguished by a germline-plus-brain-somatic two-hit model: a heterozygous
  germline loss-of-function allele is inherited with incomplete penetrance, and a
  focal brain-somatic second hit produces biallelic DEPDC5 loss in a neuronal
  clone, driving focal cortical dysplasia. Clinically it spans familial focal
  epilepsy with variable foci, sleep-related (frontal-lobe/hypermotor) focal
  epilepsy, familial mesial temporal lobe epilepsy, focal epilepsy with focal
  cortical dysplasia, and severe early-onset developmental and epileptic
  encephalopathy, and it carries a notably elevated risk of sudden unexpected
  death in epilepsy (SUDEP). This entry is scoped to the DEPDC5/GATOR1-to-mTORC1
  mechanism, the two-hit lesion model, and the resulting precision-therapy
  rationale (mTOR inhibitors); the familial variable-foci clinical syndrome as
  such is curated separately in Familial Focal Epilepsy With Variable Foci.

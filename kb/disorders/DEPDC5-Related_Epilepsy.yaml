discussions:
- discussion_id: gap_depdc5_incomplete_penetrance
  prompt: >-
    Why do only some heterozygous DEPDC5 germline loss-of-function carriers develop
    epilepsy, given that up to 64% of pathogenic variants are inherited from
    clinically unaffected parents? What genetic, somatic, or environmental modifiers
    determine penetrance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#DEPDC5 Germline Loss of Function and GATOR1 Complex Dysfunction
  rationale: >-
    The germline DEPDC5 allele is necessary but frequently insufficient for
    disease: a large cohort found dominant inheritance from an asymptomatic parent
    in 64% of probands, illustrating markedly reduced penetrance. The determinants
    of who among carriers becomes affected (a focal somatic second hit, additional
    modifier variants, or environmental triggers) are not established, and this
    directly limits genetic counseling.
  evidence:
  - reference: PMID:30093711
    reference_title: The landscape of epilepsy-related GATOR1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were dominantly inherited from an asymptomatic parent in 64%
      (29/45) of the probands, illustrating the reduced penetrance of GATOR1
      variants.
    explanation: >-
      Quantifies the incomplete penetrance that this knowledge gap seeks to
      explain.
  proposed_experiments:
  - experiment_id: exp_depdc5_penetrance_somatic_screen
    name: Deep-sequencing screen for brain-somatic second hits across affected vs unaffected carriers
    description: >-
      In carriers with epilepsy versus unaffected relatives carrying the same
      germline DEPDC5 variant, use high-depth sequencing of resected/biopsy brain
      tissue (or surrogate tissues) to test whether a focal brain-somatic second
      hit, additional modifier variants, or mTORC1-pathway polygenic background
      distinguishes affected from unaffected carriers.
    experiment_type:
      preferred_term: genetic modifier and somatic-variant association study
    model_systems:
    - name: Carrier cohort with paired germline and brain-tissue sequencing
      description: >-
        Families segregating a DEPDC5 germline variant with both affected and
        unaffected carriers, with access to resected epileptogenic tissue where
        available.
      experimental_model_type: OTHER
- discussion_id: gap_depdc5_two_hit_universality
  prompt: >-
    Does the germline-plus-brain-somatic two-hit model account for all DEPDC5
    focal cortical dysplasia (and nonlesional focal epilepsy), or do some lesions
    arise from germline haploinsufficiency alone or other second-hit routes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Brain-Somatic Second-Hit Biallelic DEPDC5 Loss
  - pathophysiology#Dysmorphic Neurons and Focal Cortical Dysplasia
  rationale: >-
    The two-hit model is proven as a proof of concept in resected human tissue,
    with a mosaic gradient peaking at the seizure-onset zone, but somatic second
    hits are not detected in every DEPDC5 FCD case and nonlesional carriers have
    seizures without visible dysplasia. Whether biallelic loss is universally
    required for the lesion, or whether haploinsufficiency alone (or an
    undetected/undetectable somatic event) suffices, remains unresolved.
  evidence:
  - reference: PMID:29708508
    reference_title: Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a biallelic 2-hit - brain somatic and germline - mutational mechanism in
      DEPDC5 causes focal epilepsy with FCD
    explanation: >-
      Establishes the two-hit model as proof of concept while leaving its
      universality across DEPDC5 cases open.
  proposed_experiments:
  - experiment_id: exp_depdc5_two_hit_prevalence
    name: Systematic somatic second-hit detection across DEPDC5 FCD and nonlesional cortex
    description: >-
      Apply ultra-deep and single-nucleus sequencing to a large series of resected
      DEPDC5 epileptogenic specimens (both FCD-positive and MRI-normal) to quantify
      the fraction harboring a detectable brain-somatic second hit and correlate
      mutant allele fraction with histopathology severity.
    experiment_type:
      preferred_term: somatic variant prevalence study
    model_systems:
    - name: DEPDC5 surgical tissue biobank
      description: >-
        Resected epileptogenic cortex from germline DEPDC5 carriers spanning FCD
        and nonlesional phenotypes.
      experimental_model_type: OTHER
- discussion_id: hmm_depdc5_mtor_inhibitor_human_efficacy
  prompt: >-
    Does mTORC1 inhibition (sirolimus/everolimus) modify seizures or epileptogenesis
    in humans with DEPDC5-related epilepsy, as it does in Depdc5-loss mouse models,
    or is the preclinical rescue not translatable?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive mTORC1 Hyperactivation
  rationale: >-
    Chronic mTORC1 inhibition rescues behavioral and biochemical deficits in
    neuronal Depdc5-knockout mice, providing strong model-organism support for a
    precision-therapy rationale. However, controlled human evidence that mTOR
    inhibitors reduce seizures or SUDEP risk in DEPDC5 carriers is lacking, and
    focal biallelic-loss lesions may respond differently from a global germline
    knockout; translational validity is therefore the open question.
  evidence:
  - reference: PMID:31174205
    reference_title: Chronic mTORC1 inhibition rescues behavioral and biochemical deficits resulting from neuronal Depdc5 loss in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, our data provide the first evidence of behavioral alterations
      in mice with Depdc5 loss and support mTOR inhibition as a rational therapeutic
      strategy for DEPDC5-related epilepsy in humans
    explanation: >-
      Model-organism evidence for mTOR-inhibitor rescue whose human translational
      validity is the mismatch to be resolved.
  proposed_experiments:
  - experiment_id: exp_depdc5_mtor_inhibitor_trial
    name: Controlled trial of mTOR inhibition in DEPDC5/GATOR1 drug-resistant focal epilepsy
    description: >-
      Conduct a controlled clinical trial (or well-powered n-of-1 series) of
      sirolimus or everolimus in genetically confirmed DEPDC5 drug-resistant focal
      epilepsy, with seizure frequency, EEG, and pharmacodynamic mTORC1 (pS6)
      readouts as endpoints, to test whether the mouse rescue translates to humans.
    experiment_type:
      preferred_term: interventional clinical trial
    model_systems:
    - name: DEPDC5 drug-resistant focal epilepsy cohort
      description: >-
        Genetically confirmed DEPDC5 carriers with drug-resistant focal epilepsy
        who are not immediate surgical candidates.
      experimental_model_type: OTHER

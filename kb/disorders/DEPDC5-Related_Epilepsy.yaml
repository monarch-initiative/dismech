  downstream:
  - target: Brain-Somatic Second-Hit Biallelic DEPDC5 Loss
    causal_link_type: DIRECT
    description: >-
      The germline haploinsufficient allele sets the stage for a focal somatic
      second hit that completes biallelic DEPDC5 inactivation in a neuronal clone.
  - target: Constitutive mTORC1 Hyperactivation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced GATOR1 GTPase-activating restraint of the Rag GTPases
    description: >-
      Even at the germline haploinsufficient baseline, weakened GATOR1 restraint
      biases mTORC1 toward hyperactivation.
- name: Brain-Somatic Second-Hit Biallelic DEPDC5 Loss
  description: >-
    In the subset of DEPDC5 carriers who develop a focal cortical lesion, a
    post-zygotic brain-somatic DEPDC5 variant arising during cortical development
    inactivates the second allele in trans within a focal neuronal clone. Deep
    sequencing of resected human epileptogenic cortex reveals a mosaic gradient,
    with the highest mutant fraction in the seizure-onset zone, providing proof of
    concept for a biallelic germline-plus-somatic two-hit mechanism that explains
    the focal nature of the dysplasia.

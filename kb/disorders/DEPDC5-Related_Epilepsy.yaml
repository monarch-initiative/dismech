diagnosis:
- name: DEPDC5 molecular genetic testing
  description: >-
    Epilepsy gene panels or exome/genome sequencing identify a heterozygous
    germline pathogenic DEPDC5 variant. When a resected epileptogenic lesion is
    available, deep (high-depth) sequencing of brain tissue can detect a
    brain-somatic second-hit variant not present in blood.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    A heterozygous pathogenic/likely pathogenic DEPDC5 loss-of-function variant
    supports the diagnosis; a brain-somatic DEPDC5 variant in resected tissue
    supports the two-hit FCD mechanism.
  evidence:
  - reference: PMID:29708508
    reference_title: Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discovered a mutation gradient with a higher rate of mosaicism in the
      seizure-onset zone than in the surrounding epileptogenic zone
    explanation: >-
      Supports deep sequencing of resected epileptogenic cortex to detect the
      brain-somatic second hit.
differential_diagnoses:
- name: Familial Focal Epilepsy With Variable Foci
  description: >-
    FFEVF is one clinical presentation within the DEPDC5/GATOR1 spectrum and can
    be caused by DEPDC5, NPRL2, or NPRL3. This gene-anchored entry is scoped to
    the DEPDC5-to-mTORC1 mechanism and its two-hit lesion biology across the whole
    DEPDC5 spectrum; the FFEVF familial syndrome as such is curated separately.
  evidence:
  - reference: PMID:27066565
    reference_title: Two definite cases of sudden unexpected death in epilepsy in a family with a DEPDC5 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DEPDC5 has been associated with a variety of familial epilepsies, including
      familial focal epilepsy with variable foci, autosomal dominant nocturnal
      frontal lobe epilepsy, familial temporal lobe epilepsy, epileptic spasms,
      and cortical dysplasia
    explanation: >-
      Places FFEVF as one of several DEPDC5-associated familial epilepsy
      presentations, distinguishing the gene-anchored spectrum.
- name: Tuberous Sclerosis Complex and other mTORopathies
  description: >-
    TSC (TSC1/TSC2) and MTOR/AKT3/PIK3CA-related focal cortical dysplasia/
    hemimegalencephaly share mTORC1 hyperactivation but differ in gene, systemic
    features, and lesion distribution; DEPDC5 acts upstream through GATOR1.
  evidence:
  - reference: PMID:30093711
    reference_title: The landscape of epilepsy-related GATOR1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic molecular mechanism linked to GATOR1 haploinsufficiency is a
      hyperactivation of mTORC1 pathway
    explanation: >-
      Situates DEPDC5 within the mTORopathies, whose shared effector is mTORC1
      hyperactivation.
treatments:
- name: Antiseizure Medication Therapy
  description: >-
    First-line management uses antiseizure medications for focal epilepsy.
    Response is variable and drug resistance is common (about half of carriers,
    higher in sleep-related/FCD cases).
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:30093711
    reference_title: The landscape of epilepsy-related GATOR1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GATOR1 seizure phenotype consisted mostly in focal seizures (e.g.,
      hypermotor or frontal lobe seizures in 50%), with a mean age at onset of 4.4
      years, often sleep-related and drug-resistant (54%), and associated with
      focal cortical dysplasia (20%)
    explanation: >-
      Establishes focal epilepsy treated with antiseizure medications and its
      frequent drug resistance.
- name: mTOR Inhibitor Precision Therapy (Sirolimus/Everolimus)
  description: >-
    Because DEPDC5 epilepsy is a focal mTORopathy, mTORC1 inhibitors (rapamycin/
    sirolimus, everolimus) are a mechanism-directed precision-therapy strategy.
    Preclinical evidence shows chronic mTORC1 inhibition rescues deficits from
    neuronal Depdc5 loss; human use remains investigational rather than
    established care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  target_phenotypes:
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  target_mechanisms:
  - target: Constitutive mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibitors directly counteract the constitutive mTORC1 hyperactivation
      that results from loss of GATOR1 restraint.
    evidence:
    - reference: PMID:31174205
      reference_title: Chronic mTORC1 inhibition rescues behavioral and biochemical deficits resulting from neuronal Depdc5 loss in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Collectively, our data provide the first evidence of behavioral
        alterations in mice with Depdc5 loss and support mTOR inhibition as a
        rational therapeutic strategy for DEPDC5-related epilepsy in humans
      explanation: >-
        Depdc5 knockout mouse data support mTORC1 inhibition as a mechanistically
        rational therapy targeting the hyperactivated pathway.
  evidence:
  - reference: PMID:29708508
    reference_title: Second-hit mosaic mutation in mTORC1 repressor DEPDC5 causes focal cortical dysplasia-associated epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study reveals promising therapeutic avenues for treating drug-resistant
      focal epilepsies with mTORC1-targeting molecules
    explanation: >-
      Supports mTORC1-targeting molecules as a therapeutic avenue for DEPDC5 focal
      epilepsy.
  - reference: PMID:30093711
    reference_title: The landscape of epilepsy-related GATOR1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently available mTORC1 inhibitors, such as rapamycin, represent promising
      drugs in the treatment of focal epilepsies
    explanation: >-
      Frames mTORC1 inhibitors as promising drugs for GATOR1/DEPDC5 focal
      epilepsies.
- name: Epilepsy Surgery for Drug-Resistant Focal Cortical Dysplasia
  description: >-
    Focal resection of the epileptogenic dysplastic cortex can achieve seizure
    freedom in drug-resistant DEPDC5-associated FCD, including cases with subtle
    MRI; a germline GATOR1 variant is not a contraindication to surgery.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Focal cortical dysplasia
    term:
      id: HP:0032046
      label: Focal cortical dysplasia
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  target_mechanisms:
  - target: Dysmorphic Neurons and Focal Cortical Dysplasia
    treatment_effect: MODULATES
    description: Focal resection removes the epileptogenic dysplastic cortex when localizable.
    evidence:

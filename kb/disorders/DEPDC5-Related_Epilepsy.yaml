- name: Constitutive mTORC1 Hyperactivation
  description: >-
    Loss of GATOR1 inhibition releases mTORC1 into constitutive,
    amino-acid-independent hyperactivation. In human resected DEPDC5 cortex this is detected
    as increased phosphorylation of ribosomal protein S6, a canonical readout of
    mTORC1 activity. mTORC1 hyperactivation is the shared central effector of the
    focal DEPDC5 mTORopathy.

  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    DEPDC5-related epilepsy is inherited as an autosomal dominant trait through a
    heterozygous germline loss-of-function allele, but penetrance is markedly
    incomplete: variants are frequently transmitted from clinically unaffected
    parents. The germline defect provides the "first hit"; a focal brain-somatic
    "second hit" is required for the focal cortical dysplasia lesion in a subset
    of carriers, which helps explain the variable expressivity.

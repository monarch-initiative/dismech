- name: Dysmorphic Neurons and Focal Cortical Dysplasia
  description: >-
    Neuronal mTORC1 hyperactivation produces enlarged (cytomegalic/dysmorphic)
    neurons with altered dendrite and spine morphology and disturbs cortical
    lamination, yielding focal cortical dysplasia (predominantly FCD type II).
    This is the structural lesion of the two-hit arm of DEPDC5 epilepsy.

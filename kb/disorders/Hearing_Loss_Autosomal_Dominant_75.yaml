inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous TRRAP missense and frameshift alleles segregating with hearing loss in
    two reported families. In the Chinese pedigree the variant co-segregated across three
    generations; in the Hungarian family it was present in the affected mother and
    daughter and in none of the three unaffected relatives tested. No homozygote and no
    biallelic case has been reported.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31231791
    reference_title: "Novel TRRAP mutation causes autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing, bioinformatic analysis, and Sanger sequencing were used to verify the co-segregation of a novel pathogenic variant"
    explanation: >-
      The co-segregation analysis in the founding pedigree, which is what establishes the
      dominant mode of inheritance for this phenotype.
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is present in a heterozygous form in the affected mother and daughter but not carried by any unaffected family members."
    explanation: >-
      Independent replication of dominant segregation in a second family, with unaffected
      relatives shown to be non-carriers.
mechanistic_hypotheses:
- hypothesis_group_id: hat_complex_recruitment_model
  hypothesis_label: Impaired HAT complex recruitment as the DFNA75 mechanism
  status: EMERGING
  description: >-
    The proposed mechanism is that DFNA75 missense alleles degrade TRRAP's function as the
    scaffold that recruits SAGA and NuA4/TIP60 histone acetyltransferase complexes to
    chromatin, and that the cochlea is unusually sensitive to the resulting transcriptional
    change. The model is coherent and is what both reporting groups propose, but no step of
    it has been measured for a DFNA75 allele: nobody has shown reduced complex recruitment,
    reduced histone acetylation, or an altered cochlear transcriptional program for any of
    the five variants. The supporting observations are TRRAP's established biochemical role
    and the localisation of most DFNA75 alleles to the Tra1 HEAT repeat domains that mediate
    those interactions.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assume that similarly to this, the novel variant may also affect this function. Further studies are needed to examine this putative mechanism and other unidentified mechanism(s), which may also explain how the ADNSHL-causing variants of the TRRAP gene contribute to disease development."
    explanation: >-
      The reporting authors state the recruitment model as an assumption requiring further
      study, which is why it is curated as an EMERGING hypothesis rather than as an
      established mechanism.
pathophysiology:
- name: Heterozygous TRRAP Missense Variants in the Tra1 HEAT Repeat Domains
  description: >-
    Five DFNA75 alleles are reported: p.Arg171Cys, p.Asp394Asn and p.Pro509fs, all in the
    Tra1 HEAT repeat central region spanning residues 18-531; p.Glu2750Asp, which lies in
    no annotated domain; and p.Lys1787Arg in the Tra1 HEAT repeat ring region spanning
    residues 541-2011. The clustering in HEAT repeat regions is the main structural
    argument for the mechanism proposed below, and it is an argument from position rather
    than from a functional assay.

    The allelic spectrum is not uniform in consequence: p.Pro509fs is a frameshift while
    the rest are missense, and no study has established whether any DFNA75 allele acts by
    loss of function, dominant negative effect, or something else. This entry therefore
    records no functional impact category for them.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRRAP
    term:
      id: hgnc:12347
      label: TRRAP
  downstream:
  - target: Reduced Recruitment of SAGA and NuA4 Histone Acetyltransferase Complexes to Chromatin
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - hat_complex_recruitment_model
    description: >-
      Inferred from the position of the alleles within the protein-interaction HEAT repeat
      domains and from TRRAP's known scaffolding role. Not measured for any DFNA75 allele.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly all previously reported variants affect the same functional domain of the TRRAP protein, including the p.Arg171Cys, p.Asp394Asn, and p.Pro509fs variants, which all affect the Tra1 HEAT repeat central region domain (position from 18 to 531 amino acids), whereas the p.Glu2750Asp variant does not affect any known functional domains of the protein"
    explanation: >-
      The reported allelic spectrum and its domain distribution, including the one allele
      that does not fit the clustering argument.
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the detected missense variant affects the Tra1 HEAT repeat ring region"
    explanation: The domain assignment of the fifth and most recently reported allele.
- name: Reduced Recruitment of SAGA and NuA4 Histone Acetyltransferase Complexes to Chromatin
  mechanism_confidence: HYPOTHETICAL
  description: >-
    TRRAP is a pseudokinase member of the phosphoinositide 3-kinase-related kinase family
    and the scaffolding subunit shared by the SAGA and NuA4/TIP60 histone acetyltransferase
    complexes; its HEAT repeat solenoids are the surfaces through which those complexes are
    assembled and delivered to chromatin. The node states the hypothesised consequence of a
    DFNA75 allele on that function.

    It is included as a node because the biochemistry of TRRAP is well established and
    because both reporting groups build their interpretation on it. It carries no direct
    evidence for DFNA75 alleles, which is why its incoming and outgoing edges are typed as
    hypothesised.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone acetyltransferase activity
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Disrupted Transcriptional Program in the Developing Inner Ear
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - hat_complex_recruitment_model
  evidence:
  - reference: PMID:30827496
    reference_title: "Missense Variants in the Histone Acetyltransferase Complex Component Gene TRRAP Cause Autism and Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This process is controlled by histone acetyltransferases (HATs/KATs) found in multiprotein complexes that are recruited to chromatin by the scaffolding subunit transformation/transcription domain-associated protein (TRRAP)."
    explanation: >-
      Establishes TRRAP's scaffolding role, which is the biochemical premise of this node.
      The citing paper is about the neurodevelopmental phenotype, not DFNA75, so it
      supports the protein's function and nothing about this disease.
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRRAP is a component of many histone acetyltransferase (HAT) complexes and plays a role in transcription and DNA repair by recruiting HAT complexes to chromatin"
    explanation: The same scaffolding role stated in the DFNA75 literature itself.
  - reference: PMID:34830324
    reference_title: "Beyond HAT Adaptor: TRRAP Liaisons with Sp1-Mediated Transcription."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRRAP, as the only member lacking the enzymatic activity in this family, is an adaptor protein for several histone acetyltransferase (HAT) complexes and a scaffold protein for multiple transcription factors."
    explanation: >-
      Why the mechanism has to run through recruitment rather than through catalysis: TRRAP
      is the one PIKK family member with no enzymatic activity of its own, so a DFNA75
      allele cannot act by changing an enzyme rate. Evidence source is OTHER because this
      is a review of TRRAP biology rather than a study of this disease.
- name: Disrupted Transcriptional Program in the Developing Inner Ear
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The step at which a general chromatin defect becomes an ear-specific one. It is the
    weakest link in the chain and is labelled as such: no cochlear or otic transcriptomic
    data exist for any DFNA75 allele, in any species. What supports placing the lesion in
    the ear at all is the zebrafish result below, where depleting trrap produces a
    quantifiable sensory-epithelial deficit, and the human audiometric pattern, which is
    cochlear rather than middle-ear.

    Why a ubiquitously expressed chromatin scaffold should give isolated deafness for one
    allele series and a multi-system neurodevelopmental syndrome for another is not
    explained by anything in this node, and is recorded as a knowledge gap.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: inner ear development
    term:
      id: GO:0048839
      label: inner ear development
    modifier: DECREASED
  downstream:
  - target: Cochlear Hair Cell Deficit and Stereocilia Abnormality
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - hat_complex_recruitment_model
  evidence:
  - reference: PMID:31231791
    reference_title: "Novel TRRAP mutation causes autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockdown or knockout of TRRAP resulted in significant defects in the inner ear of zebrafish, indicating that TRRAP plays an important role in inner ear development."
    explanation: >-
      The only experimental evidence that TRRAP is required for inner ear development. It
      is a depletion experiment in fish, so it supports the requirement rather than the
      consequence of a human missense allele.
- name: Cochlear Hair Cell Deficit and Stereocilia Abnormality
  mechanism_confidence: PROVISIONAL
  description: >-
    The structural lesion, observed only in zebrafish. Depleting trrap reduces the number
    of lateral line neuromasts, reduces hair cells per neuromast, and leaves the surviving
    hair cells with abnormal stereocilia. The mammalian cochlea has never been examined for
    a TRRAP allele, and human cochlear histology is not obtainable, so this node is carried
    on cross-species inference from a mechanosensory organ that is not the cochlea.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: inner ear receptor cell stereocilium organization
    term:
      id: GO:0060122
      label: inner ear receptor cell stereocilium organization
    modifier: DECREASED
  downstream:
  - target: Progressive High-Frequency Cochlear Hearing Loss
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - hat_complex_recruitment_model
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In trrap knockdown and knockout, zebrafish had reduced lateral line neuromasts, decreased number of hair cells per neuromast, and abnormal stereocilia on the hair cells compared with WT zebrafish"
    explanation: >-
      The specific structural findings behind this node, restated in the second report from
      the zebrafish work in the first.
- name: Progressive High-Frequency Cochlear Hearing Loss
  description: >-
    The clinical lesion. Both reported families show sensorineural loss that begins at high
    frequencies and extends downward, with normal middle ear function on tympanometry and
    normal inner ear anatomy on MRI. Distortion product otoacoustic emissions were absent
    or nearly absent in the Hungarian family, which points at the cochlea rather than the
    auditory nerve, though the reporting authors were careful to say the audiology does not
    exclude a retrocochlear component.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Progressive high-frequency sensorineural hearing loss
    causal_link_type: DIRECT
  - target: Absent distortion product otoacoustic emissions
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the audiological findings partially support (on the contrary, do not exclude) the cochlear origin of hearing loss, and the cochlea may be the site of the lesion"
    explanation: >-
      The authors' own hedged localisation of the lesion, quoted rather than firmed up
      because the hedge is the finding.
phenotypes:
- name: Progressive high-frequency sensorineural hearing loss
  category: Auditory
  description: >-
    Bilateral sensorineural loss that starts in the 2-8 kHz range and later involves speech
    and lower frequencies, producing a ski-slope audiogram. Progression is slow: in the
    Hungarian mother the threshold deteriorated only slightly over years of follow-up.
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the affected individuals exhibited sensorineural hearing loss with similar clinical symptoms, including initial impaired high frequencies that subsequently affected speech and lower frequencies"
    explanation: The audiometric configuration and its direction of progression.
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the hearing threshold of the II/2 mother deteriorated only slightly over time, this slow progression may continue for decades."
    explanation: The rate of progression, which bears directly on rehabilitation planning.
- name: Bilateral sensorineural hearing impairment
  category: Auditory
  description: >-
    The loss is sensorineural and bilateral in both reported families, with normal middle
    ear ventilation on tympanometry and no structural inner ear abnormality on MRI.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI did not reveal any abnormalities in the inner ears of the affected mother and daughter"
    explanation: >-
      Excludes a structural inner ear malformation, which is part of what makes this a
      sensorineural rather than anatomical phenotype.
- name: Absent distortion product otoacoustic emissions
  category: Auditory
  description: >-
    DPOAEs were absent in the affected mother and nearly absent in the daughter, and the
    acoustic reflex threshold was absent at the tested frequencies in the mother. Loss of
    otoacoustic emissions indicates outer hair cell dysfunction and is what places the
    lesion in the cochlea rather than in the auditory nerve. Note that this is the opposite
    finding to DFNA83, the other recently defined dominant deafness locus in this knowledge
    base's neighbourhood, where preserved DPOAEs point at spiral ganglion neurons.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "at 70/60 dB SPL stimulus intensity, the DP-grams showed absent otoacoustic emissions in both ears"
    explanation: >-
      The DPOAE result in the affected mother. HPO has no term for absent otoacoustic
      emissions specifically, so the binding is the broader abnormal auditory evoked
      potential term and the specific finding is carried in preferred_term and description.
- name: Absence of vestibular and neurological involvement
  category: Neurological
  description: >-
    Neither reported family had vestibular dysfunction or neurological abnormality on
    examination. This is what makes DFNA75 nonsyndromic and is also the observation that
    separates it clinically from the TRRAP neurodevelopmental phenotype. It is a negative
    finding from clinical examination in two families, not from systematic phenotyping.
  phenotype_term:
    preferred_term: Vertigo
    term:
      id: HP:0002321
      label: Vertigo
    severity: absent
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "On examination, vestibular dysfunction and neurological abnormalities were not observed in the patients."
    explanation: >-
      Graded REFUTE because the claim the phenotype names is vestibular involvement, and
      the cited observation contradicts it. The entry records the absence explicitly
      because it is the discriminating feature against the syndromic TRRAP phenotype.
genetic:
- name: TRRAP
  notes: >-
    The only gene reported for DFNA75. TRRAP is among the genes most intolerant to missense
    variation in the human genome, which is relevant to interpreting any missense allele in
    it: intolerance raises prior suspicion but does not by itself establish that a
    particular variant is causal.
  gene_term:
    preferred_term: TRRAP
    term:
      id: hgnc:12347
      label: TRRAP
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:31231791
    reference_title: "Novel TRRAP mutation causes autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, three more novel variants of transformation/transcription domain associated protein (TRRAP) were detected in 66 sporadic cases of hearing loss."
    explanation: >-
      The additional alleles from the sporadic screen in the founding report. Note this is
      a variant screen without segregation data, so it widens the allelic series without
      independently establishing causality for those alleles.
  - reference: PMID:30827496
    reference_title: "Missense Variants in the Histone Acetyltransferase Complex Component Gene TRRAP Cause Autism and Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRRAP is evolutionarily conserved and is among the top five genes intolerant to missense variation."
    explanation: >-
      Constraint context for interpreting DFNA75 missense alleles. Cited from the
      neurodevelopmental paper because that is where the constraint statement appears.
animal_models:
- name: trrap-depleted zebrafish (morpholino knockdown and CRISPR/Cas9 knockout)
  species: Zebrafish
  genotype: trrap morpholino knockdown; trrap CRISPR/Cas9 knockout
  publication: PMID:31231791
  description: >-
    The only animal work on this gene-disease relationship, produced in the founding report
    to support the genetic finding. Both morpholino knockdown and CRISPR knockout produce
    inner ear defects: fewer lateral line neuromasts, fewer hair cells per neuromast, and
    abnormal stereocilia on the hair cells that remain.
  genes:
  - preferred_term: TRRAP
    term:
      id: hgnc:12347
      label: TRRAP
  modeled_mechanisms:
  - target: Cochlear Hair Cell Deficit and Stereocilia Abnormality
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The model establishes that trrap is required for hair cell development and stereocilia
      integrity, which is the only experimental support anywhere for placing the DFNA75
      lesion in the sensory epithelium.
    limitations: >-
      Three separate gaps between this model and the human disease. First, allele: the
      model is a knockdown and a knockout, whereas every human DFNA75 allele except one
      frameshift is a heterozygous missense change of unestablished functional consequence,
      so the experiment tests gene requirement rather than variant effect. Second, organ:
      the readout is the lateral line neuromast, a mechanosensory organ zebrafish have and
      humans do not, rather than the cochlea. Third, timing: the fish phenotype is
      developmental, whereas the human phenotype is post-lingual or mid-childhood onset and
      progressive, so a developmental deficit is being used to explain a progressive
      degeneration.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The quantified structure is the zebrafish lateral line neuromast. Humans have no
        lateral line, and the cochlear organ of Corti that DFNA75 affects has a different
        cellular architecture, tonotopy and regenerative capacity from a neuromast.
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The model's manipulated quantity is trrap gene dosage, reduced to near zero. The
        disease's quantity is the activity of a heterozygous missense TRRAP protein whose
        functional consequence has never been measured. Complete depletion is not a proxy
        for a missense allele unless loss of function has been demonstrated, and it has
        not.
    readouts:
    - name: Hair cells per lateral line neuromast
      target: Cochlear Hair Cell Deficit and Stereocilia Abnormality
      direction: DECREASED
      interpretation: >-
        The quantitative sensory-cell deficit on which the developmental interpretation
        rests.
      evidence:
      - reference: PMID:40004049
        reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In trrap knockdown and knockout, zebrafish had reduced lateral line neuromasts, decreased number of hair cells per neuromast, and abnormal stereocilia on the hair cells compared with WT zebrafish"
        explanation: >-
          The measurement behind this readout. Quoted from the second report because it
          states the specific findings more precisely than the founding abstract does.
    evidence:
    - reference: PMID:31231791
      reference_title: "Novel TRRAP mutation causes autosomal dominant non-syndromic hearing loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown or knockout of TRRAP resulted in significant defects in the inner ear of zebrafish, indicating that TRRAP plays an important role in inner ear development."
      explanation: >-
        The model's own auditory conclusion, which is what licenses linking it to this node
        at all.
treatments:
- name: Conventional Hearing Amplification
  description: >-
    Both reported families were managed with conventional hearing assistive devices. In the
    Hungarian family the reporting clinicians judged the progression slow enough that
    amplification was expected to remain adequate long term, and explicitly did not support
    an indication for cochlear implantation on the available data. That is a two-patient
    judgement, not a guideline, and it should not be generalised to a patient whose loss
    progresses faster.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing rehabilitation with an amplification device
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Progressive High-Frequency Cochlear Hearing Loss
    description: >-
      Amplification compensates for the raised thresholds. It does not act on the molecular
      lesion, and nothing reported for DFNA75 does.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "conventional hearing assistive solutions appear to provide stable and good rehabilitative effects over the long term. Based on the available data, an indication for cochlear implantation was not supported."
    explanation: >-
      The reported management decision and its stated basis, including the negative
      recommendation on implantation.
discussions:
- discussion_id: trrap_deafness_versus_neurodevelopmental_allele_series
  kind: KNOWLEDGE_GAP
  prompt: >-
    TRRAP causes both DFNA75 and a syndromic neurodevelopmental disorder with autism and
    intellectual disability. No DFNA75 family has been reported with the neurodevelopmental
    phenotype and no neurodevelopmental cohort has been reported with the DFNA75 audiogram.
    What distinguishes an allele that gives isolated deafness from one that gives a
    multi-system developmental syndrome?
  attaches_to:
  - pathophysiology#Heterozygous TRRAP Missense Variants in the Tra1 HEAT Repeat Domains
  - genetic#TRRAP
  rationale: >-
    The neurodevelopmental series is much better powered: 17 distinct de novo variants in
    24 individuals from an international collaboration, with an internal genotype-phenotype
    correlation splitting those 24 into two clinical spectra by variant position. The
    deafness series is five variants from two families plus a sporadic screen. So the
    asymmetry in what has been reported may simply reflect the asymmetry in how hard anyone
    has looked, and the honest reading is that the two phenotypes have never been
    systematically sought in each other's cohorts.

    Two things would settle it cheaply and neither has been done. Audiometry in the
    published TRRAP neurodevelopmental cohort would say whether the deafness allele series
    is genuinely distinct or whether high-frequency loss is simply unmeasured in patients
    ascertained for developmental delay. Developmental assessment in the deafness families
    would say the converse. Until then, the domain-clustering argument, that DFNA75 alleles
    sit in the Tra1 HEAT repeat regions, is the only thing separating the two, and one of
    the five DFNA75 alleles does not sit in any annotated domain at all.

    This matters for counselling, not just for the model. A family told that their TRRAP
    variant causes isolated deafness is being given a prognosis that rests on two published
    pedigrees.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, two rare diseases with autosomal dominant inheritance have been associated with TRRAP: the ADNSHL (OMIM 618778) and the developmental delay with or without dysmorphic facies and autism (OMIM 618454)."
    explanation: The two-phenotype situation stated in the DFNA75 literature.
  - reference: PMID:30827496
    reference_title: "Missense Variants in the Histone Acetyltransferase Complex Component Gene TRRAP Cause Autism and Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through an international collaboration, 17 distinct de novo or apparently de novo variants were identified in TRRAP in 24 individuals."
    explanation: >-
      The size of the neurodevelopmental series, which is the asymmetry the gap turns on.
  - reference: PMID:30827496
    reference_title: "Missense Variants in the Histone Acetyltransferase Complex Component Gene TRRAP Cause Autism and Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A strong genotype-phenotype correlation was observed with two distinct clinical spectra."
    explanation: >-
      That the neurodevelopmental series itself already splits by variant position,
      which is the precedent for expecting position to matter for the deafness alleles too.
  - reference: PMID:41952423
    reference_title: "Long-Term Follow Up of Two Patients With Variants in the Cluster 1031-1159 of TRRAP Gene: Expanding the Phenotype of Developmental Delay With or Without Dysmorphic Facies and Autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strong genotype-phenotype correlation has been observed in DEDDFA, where missense variants located in the clustering between residues 1031-1159 result in more pronounced facial anomalies associated with a variable degree of intellectual disability."
    explanation: >-
      Names the residue window that drives the severe neurodevelopmental phenotype. This
      sharpens rather than closes the gap: no DFNA75 allele falls in 1031-1159, which is
      consistent with a positional split, but four of the five DFNA75 alleles lie in the
      Tra1 HEAT repeat central region and one lies in no annotated domain at all, so
      position does not yet predict which phenotype a novel TRRAP missense allele will give.
- discussion_id: dfna75_gene_disease_validity
  kind: KNOWLEDGE_GAP
  prompt: >-
    How strong is the TRRAP-DFNA75 gene-disease relationship? Two families, five alleles,
    one zebrafish depletion experiment, and the second reporting group classified its own
    variant as a variant of uncertain significance.
  attaches_to:
  - genetic#TRRAP
  - mechanistic_hypotheses#hat_complex_recruitment_model
  rationale: >-
    Every claim in this entry inherits the strength of this relationship, so it is recorded
    explicitly rather than left for a reader to reconstruct from the citation count.

    What supports it: co-segregation across three generations in the founding pedigree, an
    independent second family in a different population with segregation in the affected
    pair and absence in three unaffected relatives, and a functional experiment showing the
    gene is required for hair cell development.

    What weakens it: the Hungarian variant is formally a VUS under ACMG rules, and its in
    silico predictions are split, with SIFT, MutationTaster and CADD suggesting a damaging
    effect while PolyPhen-2, EVE, REVEL and AlphaMissense suggest benign. The three
    additional alleles from the founding report came from a screen of 66 sporadic cases
    with no segregation data. No functional assay has been run on any DFNA75 allele. And
    the zebrafish experiment tests gene requirement, not allele effect.

    There is no ClinGen Gene-Disease Validity assertion for TRRAP and hearing loss to cite,
    which is why this is recorded as prose here rather than as a CGGV evidence item. A
    ClinGen curation would be the single most useful external addition to this entry.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the ACMG variant classification guideline, this variant is classified as a VUS."
    explanation: >-
      The reporting authors' own classification of the allele in the second family, which
      is the clearest single statement of how provisional this relationship remains.
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second study confirming an association between TRRAP and ADNSHL."
    explanation: The total size of the replicated evidence base, in the authors' own words.
- discussion_id: dfna75_cochlear_versus_retrocochlear_localisation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the DFNA75 lesion in the cochlear hair cells, in the spiral ganglion, or both? The
    otoacoustic emission data say outer hair cell, but that is one family and the reporting
    authors declined to exclude a retrocochlear component.
  attaches_to:
  - pathophysiology#Progressive High-Frequency Cochlear Hearing Loss
  - pathophysiology#Cochlear Hair Cell Deficit and Stereocilia Abnormality
  rationale: >-
    The question is not academic for this gene. TRRAP is a general chromatin scaffold
    expressed everywhere, so nothing about the gene predicts which cochlear cell type it
    acts in, and the zebrafish evidence points at hair cells only because hair cells are
    what the lateral line assay measures. If the spiral ganglion were also involved, the
    fish experiment would not have detected it.

    The single relevant human measurement is the absent DPOAE in the Hungarian mother and
    nearly absent DPOAE in the daughter, which does indicate outer hair cell dysfunction.
    Against that, the authors note that distinguishing cochlear from retrocochlear origin
    at this severity requires more than audiometry, and their MRI was normal without
    resolving the question. Auditory brainstem response morphology in more affected
    individuals, or electrocochleography, would separate the possibilities.
  evidence:
  - reference: PMID:40004049
    reference_title: "Novel Pathogenic Variant of the TRRAP Gene Detected in a Hungarian Family with Autosomal Dominant Non-Syndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the severe grade of high-frequency sensorineural hearing impairment in the 2-4 kHz range, a differential diagnosis between the cochlear vs. retrocochlear origin requires more complex diagnostic procedures, such as MRI."
    explanation: >-
      The authors' statement that the localisation is not settled by audiometry alone,
      which is the substance of this gap.

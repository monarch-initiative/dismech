name: Hearing Loss Autosomal Dominant 75
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNA75
- deafness, autosomal dominant 75
- TRRAP-related autosomal dominant nonsyndromic hearing loss
description: >-
  DFNA75 is autosomal dominant nonsyndromic sensorineural hearing loss attributed to
  heterozygous missense variants in TRRAP, the scaffolding subunit that recruits histone
  acetyltransferase complexes to chromatin. High frequencies are affected first and the
  loss extends downward over years, giving a ski-slope audiogram; onset has been reported
  both post-lingually in adulthood and in mid-childhood, and progression is slow.

  The entry is built on two families and should be read that way. The gene was proposed
  in 2019 from a single three-generation Chinese pedigree carrying p.Arg171Cys, supported
  by zebrafish knockdown and knockout showing inner ear defects; a Hungarian mother and
  daughter carrying p.Lys1787Arg were reported in 2025 as the second family, and the
  authors of that report classified their own variant as a variant of uncertain
  significance under ACMG rules. Five DFNA75 alleles are described in total. That is a
  thin gene-disease relationship by the standards of most entries in this knowledge base,
  and nothing here should be read as settled.

  The mechanistic claim is thinner still, and the entry separates it deliberately. What is
  observed is a hair cell and stereocilia deficit in trrap-depleted zebrafish and a
  cochlear-pattern audiogram in humans. What is inferred is everything in between: that
  the human missense alleles act by impairing TRRAP-dependent recruitment of the SAGA and
  NuA4/TIP60 acetyltransferase complexes, and that the resulting transcriptional change is
  what the cochlea cannot tolerate. The second report states that inference explicitly as
  an assumption requiring further study, so it is carried here as a labelled mechanistic
  hypothesis rather than as a curated causal chain.

  TRRAP also causes a syndromic neurodevelopmental disorder with autism and intellectual
  disability, from a separate and much larger allele series. No deafness family has been
  reported with the neurodevelopmental phenotype and no neurodevelopmental cohort has been
  reported with this audiogram. Why one gene splits this way is unresolved and is recorded
  as a knowledge gap rather than smoothed over.

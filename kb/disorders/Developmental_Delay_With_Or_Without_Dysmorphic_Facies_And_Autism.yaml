  molecular_functions:
  - preferred_term: histone acetyltransferase regulator activity
    modifier: ABNORMAL
    term:
      id: GO:0035034
      label: histone acetyltransferase regulator activity
  evidence:
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      This process is controlled by histone acetyltransferases (HATs/KATs) found
      in multiprotein complexes that are recruited to chromatin by the scaffolding
      subunit transformation/transcription domain-associated protein (TRRAP).
    explanation: >-
      Establishes TRRAP as the scaffolding subunit that recruits HAT complexes to
      chromatin, the activity disrupted by the variant.
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through an international collaboration, 17 distinct de novo or apparently de
      novo variants were identified in TRRAP in 24 individuals.
    explanation: >-
      Identifies the recurrent TRRAP missense variants as the initiating lesion in
      affected individuals.
  downstream:
  - target: Dysregulated histone acetylation and transcription
    description: >-
      Altered TRRAP perturbs HAT-complex-mediated histone acetylation and
      downstream transcriptional regulation.
- name: Dysregulated histone acetylation and transcription
  description: >-
    Perturbed TRRAP-dependent recruitment of HAT complexes alters histone lysine
    acetylation and RNA polymerase II-dependent transcription, the chromatin-level
    consequence of the variant.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: internal peptidyl-lysine (histone) acetylation

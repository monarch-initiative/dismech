animal_models:
- name: trrap-knockout zebrafish
  species: Zebrafish
  genotype: trrap gene-knockout (loss-of-function)
  category: knockout
  description: >-
    A trrap gene-knockout zebrafish line recapitulates craniofacial and head/eye
    size reductions, providing a loss-of-function model of a TRRAP-associated human
    disorder.
  genes:
  - preferred_term: trrap
    term:
      id: hgnc:12347
      label: TRRAP
  publication: PMID:34934055
  modeled_mechanisms:
  - target: Disrupted embryonic organ and craniofacial morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The knockout reproduces reduced head/eye size and ventral pharyngeal arch
      and tooth-mineralization defects, modeling disrupted craniofacial
      morphogenesis.
    limitations: >-
      The model is a complete loss-of-function knockout, whereas the human disorder
      is caused by heterozygous missense variants proposed to act by
      gain-of-function or dominant-negative mechanisms rather than haploinsufficiency;
      the knockout therefore tests loss of function rather than the human disease
      allele mechanism.
    readouts:
    - name: Ventral pharyngeal arch size
      target: Disrupted embryonic organ and craniofacial morphogenesis
      direction: DECREASED
      interpretation: Structural correlate of disrupted craniofacial morphogenesis in the model.
      evidence:
      - reference: PMID:34934055
        reference_title: Involvement of the zebrafish trrap gene in craniofacial development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The size of the ventral pharyngeal arches was reduced and the
          mineralization of teeth was impaired in the trrap mutants.
        explanation: Reports the reduced pharyngeal arch size and impaired tooth mineralization measured in the mutants.
    evidence:
    - reference: PMID:34934055
      reference_title: Involvement of the zebrafish trrap gene in craniofacial development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The trrap zebrafish mutants exhibited smaller eyes and heads than the wild-type zebrafish.
      explanation: The knockout reproduces reduced head and eye size, a craniofacial/growth correlate of the human phenotype.
  evidence:
  - reference: PMID:34934055
    reference_title: Involvement of the zebrafish trrap gene in craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To investigate the physiological functions of Trrap, we established trrap
      gene-knockout zebrafish and examined loss-of-function phenotypes in the
      mutants.
    explanation: Establishes the trrap-knockout zebrafish as the model system.

    Cause Autism and Syndromic Intellectual Disability.
  findings: []
- reference: PMID:34934055
  title: Involvement of the zebrafish trrap gene in craniofacial development.
  findings: []
notes: >-
  Curated from the defining TRRAP cohort (Cogne et al., Am J Hum Genet 2019,
  PMID:30827496, full text) and a zebrafish trrap-knockout study (PMID:34934055).
  Per-phenotype frequencies and the specific malformations (cleft lip and palate,
  cerebellar vermis hypoplasia, renal and genital anomalies, hypotonia,
  microcephaly) are taken from the full-text results and Table 2. The two
  genotype-correlated clinical spectra (multisystem malformations clustering
  around p.Ala1043Thr vs ASD/ID with epilepsy) are represented as branches of one
  pathograph rather than as separate has_subtypes; the entry is a single
  gene-defined leaf disorder. MONDO models the ClinGen curation entity
  (MONDO:0100465) and this OMIM-derived term (MONDO:0032760, OMIM:618454) as
  separate concepts for the same TRRAP disorder; MONDO:0100465 is recorded under
  mappings.mondo_mappings as a broadMatch, and genetic.notes records why the
  ClinGen validity tier is not copied here.

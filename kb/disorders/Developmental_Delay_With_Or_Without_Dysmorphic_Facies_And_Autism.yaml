name: developmental delay with or without dysmorphic facies and autism
creation_date: "2026-10-12T13:10:00Z"
description: >-
  Developmental delay with or without dysmorphic facies and autism (DEDDFA) is a
  rare autosomal dominant, de novo neurodevelopmental disorder caused by
  heterozygous missense variants in TRRAP, the scaffolding subunit that recruits
  histone acetyltransferase (HAT) complexes to chromatin. Core features are
  global developmental delay and a wide range of intellectual functioning,
  frequently reaching intellectual disability. The published cohort resolves into
  two genotype-correlated clinical spectra: a complex multisystem malformation
  syndrome (brain, heart, kidney and genitourinary anomalies) associated with
  missense variants clustering around p.Ala1043Thr, and a spectrum manifesting
  with autism spectrum disorder and/or intellectual disability with epilepsy.
  Facial dysmorphism is seen across both spectra.
category: Mendelian
parents:
- Mendelian neurodevelopmental disorder
- hereditary disease
synonyms:
- DEDDFA
- TRRAP-related neurodevelopmental disorder
disease_term:
  preferred_term: developmental delay with or without dysmorphic facies and autism
  term:
    id: MONDO:0032760
    label: developmental delay with or without dysmorphic facies and autism
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The disorder is caused by heterozygous TRRAP variants that are de novo or
    apparently de novo in affected individuals; low-level maternal mosaicism was
    documented in the mother of two affected sisters, a recurrence-risk
    consideration.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through an international collaboration, 17 distinct de novo or apparently de
      novo variants were identified in TRRAP in 24 individuals.
    explanation: >-
      De novo heterozygous variants in affected individuals establish an
      autosomal dominant mode of inheritance arising mainly from new mutation.
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two sisters who had inherited a variant from a mother with low-level
      mosaicism
    explanation: >-
      Documents low-level maternal mosaicism as a recurrence-risk consideration
      for an otherwise de novo disorder.
genetic:
- name: TRRAP
  association: >-
    Causative heterozygous de novo or apparently de novo TRRAP missense variants;
    variants of the first clinical spectrum cluster around c.3127G>A p.(Ala1043Thr).
  gene_term:
    preferred_term: TRRAP
    term:
      id: hgnc:12347
      label: TRRAP
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    All reported pathogenic variants are missense; no loss-of-function variants
    were reported in the defining cohort, and the authors argue haploinsufficiency
    is unlikely for the clustered variants. They propose gain-of-function or
    dominant-negative effects, but a definite functional-impact category is not
    established, so none is bound here.
    ClinGen's Intellectual Disability and Autism Gene Curation Expert Panel rates
    the TRRAP gene-disease relationship Definitive (autosomal dominant), but
    records that assertion against the ClinGen disease-entity term
    MONDO:0100465 (complex neurodevelopmental disorder with or without congenital
    anomalies) rather than against this entry's OMIM-derived term MONDO:0032760.
    Because the ClinGen MONDO term is neither this entry's disease_term, a
    has_subtypes term, nor an exactMatch mapping, the validity assertion is not
    copied into gene_disease_validity.
  evidence:
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with this phenotype had missense variants clustering around the
      c.3127G>A p.(Ala1043Thr) variant identified in five individuals.
    explanation: >-
      Identifies the recurrent clustered missense variant defining the first
      clinical spectrum.
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      TRRAP is evolutionarily conserved and is among the top five genes intolerant
      to missense variation.
    explanation: >-
      Extreme missense constraint supports the pathogenicity of recurrent missense
      variants in this gene.
  - reference: PMID:30827496
    reference_title: >-
      Missense Variants in the Histone Acetyltransferase Complex Component Gene
      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting a model in which specific domains are affected and
      haploinsufficiency is unlikely, at least for clustering variants.
    explanation: >-
      Supports a dominant mechanism in which clustered domain-affecting missense
      variants act other than by haploinsufficiency.
pathophysiology:
- name: TRRAP missense variant disrupting HAT-complex scaffold function
  description: >-
    A heterozygous de novo missense variant alters TRRAP, the scaffolding subunit
    that recruits histone acetyltransferase (HAT) complexes to chromatin,
    perturbing its role in regulating HAT activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRRAP
    term:
      id: hgnc:12347
      label: TRRAP
  genetic_context:

      TRRAP Cause Autism and Syndromic Intellectual Disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Acetylation of the lysine residues in histones and other DNA-binding
      proteins plays a major role in regulation of eukaryotic gene expression.
    explanation: >-
      Supports histone lysine acetylation as a key regulator of gene expression,
      the process disrupted downstream of altered TRRAP.
  downstream:
  - target: Altered neurodevelopmental gene expression
    description: >-
      Dysregulated chromatin acetylation changes the expression of genes governing
      neuronal function.
  - target: Disrupted embryonic organ and craniofacial morphogenesis
    description: >-
      Altered chromatin regulation during development disrupts morphogenesis of
      multiple organ systems and the face.
- name: Altered neurodevelopmental gene expression
  description: >-
    RNA sequencing of patient-derived skin fibroblasts shows altered expression of
    genes implicated in neuronal function and ion transport, linking the chromatin
    defect to a dysregulated neurodevelopmental gene-expression program. The
    fibroblast finding is a surrogate tissue; the inference to neural cells is not
    directly demonstrated.
  biological_scale: CELLULAR

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100465
      label: complex neurodevelopmental disorder with or without congenital anomalies
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0100465 is the broad ClinGen disease-entity term under which the
      TRRAP gene-disease validity assertion is curated. It denotes the same
      TRRAP-related phenotype at a broader, clinically defined level than this
      OMIM-anchored term (MONDO:0032760, OMIM:618454), so the relation is
      broadMatch rather than exactMatch. broadMatch does not retire the mapped
      concept from the curation queue and does not license copying the ClinGen
      validity tier onto this entry; see genetic.notes.
discussions:
- discussion_id: gap_trrap_functional_impact
  prompt: >-
    Do the clustered TRRAP missense variants act by gain-of-function or
    dominant-negative mechanisms, and what accounts for the genotype-phenotype
    branch between the multisystem malformation spectrum and the ASD/epilepsy
    spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TRRAP missense variant disrupting HAT-complex scaffold function
  - pathophysiology#Altered neurodevelopmental gene expression
  - pathophysiology#Disrupted embryonic organ and craniofacial morphogenesis
  rationale: >-
    The defining report proposes gain-of-function or dominant-negative effects for
    the clustered variants and notes the absence of loss-of-function variants, but
    the functional consequence is not demonstrated, and the only direct molecular
    data are patient-fibroblast RNA-seq changes. The mechanistic basis for the
    genotype-correlated split into two clinical spectra is unexplained.

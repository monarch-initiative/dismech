- category: Cardiovascular
  name: Myofiber Disarray
  description: >-
    Recorded as a REFUTED feature, not an observed one. The OMIM clinical
    synopsis for CMH21 lists myofiber disarray among the entity's features, but
    the anchoring publication states the opposite: histopathology from the two
    family members examined did not demonstrate myocyte disarray or fibrosis,
    and the authors treated that absence as their basis for concluding the
    kindred does not have typical sarcomere-mutation HCM. This entry follows the
    primary source. The phenotype is curated with refuting evidence so that the
    conflict between the OMIM synopsis and the primary literature is resolvable
    by a downstream consumer rather than only by a human reading prose.
  phenotype_term:
    preferred_term: Myofiber disarray
    term:
      id: HP:0031318
      label: Myofiber disarray
  notes: >-
    Do not convert this to a SUPPORT phenotype on the strength of the OMIM
    synopsis. The only primary observation available for this entity is negative,
    and it is what distinguishes CMH21 from sarcomeric HCM in the differential.
    The negative finding is also carried in histopathology, where it belongs as
    a tissue observation; this phenotype entry exists to make the source conflict
    machine-queryable. Note the sample is two individuals, so the correct reading
    is "refuted in the only individuals examined", not "established as absent
    across the entity" - see the cmh21_omim_synopsis_features_unquotable
    discussion.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      Direct refutation of myofiber disarray in the only CMH21 individuals whose
      myocardium has been examined, contradicting the OMIM clinical synopsis.
histopathology:
- name: Absence of Myocyte Disarray and Interstitial Fibrosis
  description: >-
    Myocardial histopathology available from two affected family members did NOT
    show myocyte disarray or fibrosis. This is a discriminating negative
    finding: myocyte disarray with interstitial fibrosis is the expected
    histological signature of sarcomere-mutation HCM, and its absence was the
    authors' basis for concluding that this kindred's phenotype is not typical
    sarcomeric HCM. Only two individuals were examined, so the finding is not
    established as a general feature of the entity.
  diagnostic: false
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      Exact statement of the negative histological finding and the authors'
      interpretation of it.
diagnosis:
- name: Transthoracic echocardiography for diagnosis and lifelong family surveillance
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography carries more weight in this entity than in gene-solved
    cardiomyopathies, because it is not one arm of surveillance but the whole of
    it. In a family with an identified pathogenic variant, a relative who tests
    negative can be discharged. No such test exists for CMH21: the disease allele
    has never been found anywhere in the 27.2 Mb interval, so no relative can be
    genetically excluded, and serial clinical imaging must therefore continue
    indefinitely in every first-degree relative rather than stopping at a single
    normal study or a negative genetic result. The kindred's own phenotype
    dictates what to look for - predominant left ventricular hypertrophy, but
    also ventricular dilation and falling systolic function, since affected
    members progressed to end-stage heart failure.
  results: >-
    Left ventricular hypertrophy; in later disease, ventricular dilation and
    systolic impairment. A normal study in a relative excludes nothing
    permanently and does not end surveillance.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one kindred (4 generations, 32 individuals) with predominant clinical
      features of left ventricular hypertrophy
    explanation: >-
      Establishes the imaging phenotype that clinical surveillance is looking
      for, across a four-generation pedigree.
  notes: >-
    The imaging modality and the finding are evidenced; the surveillance
    interval is not. Screening cadence is guideline-generic (2024 AHA/ACC,
    PMID:38718139; 2023 ESC, PMID:37622657, both carried in the top-level
    references) and no CMH21-specific screening study exists. Neither guideline
    record carries quotable recommendation text in its cached PubMed abstract,
    so no snippet is claimed for the cadence.
- name: Cardiac magnetic resonance imaging
  diagnosis_term:
    preferred_term: Cardiac magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    CMR adds tissue characterisation that echocardiography cannot provide, and
    in this entity it addresses a specific question rather than a generic one.
    The two family members whose myocardium was examined showed neither myocyte
    disarray nor fibrosis - the histological signature that would be expected in
    sarcomeric disease - so late gadolinium enhancement is the non-invasive way
    to ask whether that negative finding generalises beyond those two
    individuals. It also discriminates several of the phenocopies that a
    sarcomere-negative, disarray-negative family should be screened for.
  results: >-
    Wall-thickness quantification and late gadolinium enhancement pattern;
    infiltrative and storage phenocopies produce characteristic enhancement
    distributions distinct from sarcomeric hypertrophy.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      Supplies the tissue question CMR is being asked to answer at scale.
      PARTIAL because the source reports histology in two individuals and makes
      no statement about imaging - the inference that CMR is the way to
      generalise the finding is this entry's, not the paper's.
- name: Cardiomyopathy gene panel, with a negative result that does not exclude
  diagnosis_term:
    preferred_term: Cardiomyopathy gene panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Panel testing is indicated, and its most important property in this entity is
    what it cannot do. Sequencing serves two purposes here - excluding sarcomeric
    HCM and DCM, which was done in the index kindred and was negative, and
    excluding the phenocopy genes below. What it cannot do is confirm or exclude
    CMH21 itself, because CMH21 has no gene: a completely negative panel is the
    expected result in a genuinely affected CMH21 patient. Reporting such a
    result as "no pathogenic variant identified" without that context invites
    the reader to conclude the family is unaffected.
  results: >-
    Negative for sarcomere and known cardiomyopathy genes. This is consistent
    with - not evidence against - CMH21, and cannot be used to discharge
    relatives.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct DNA sequencing was performed on sarcomere genes known to cause HCM
      and dilated cardiomyopathy, and no mutations were identified.
    explanation: >-
      Documents the negative sequencing result in the defining kindred, which is
      simultaneously the exclusion of the main differential and the demonstration
      that a negative panel is the expected CMH21 finding.
- name: Phenocopy exclusion testing
  diagnosis_term:
    preferred_term: Phenocopy exclusion testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    For a family that is sarcomere-negative and disarray-negative, the
    non-sarcomeric causes of unexplained left ventricular hypertrophy become the
    highest-yield remaining workup - several are treatable, which is what makes
    the distinction actionable rather than academic. The relevant set is Fabry
    disease (alpha-galactosidase A activity and GLA sequencing), cardiac
    amyloidosis (serum free light chains with immunofixation, and bone
    scintigraphy), Danon disease (LAMP2), and PRKAG2 glycogen storage
    cardiomyopathy, which is suggested by pre-excitation on the ECG.
  results: >-
    A positive result reclassifies the family out of CMH21 entirely and into a
    disease with its own management; a negative result strengthens, without
    confirming, the locus-defined diagnosis.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      The authors' own conclusion that this is not typical sarcomeric HCM is what
      raises the prior probability of a non-sarcomeric cause and motivates this
      workup. PARTIAL because the paper draws no conclusion about phenocopies and
      names none of these tests - the workup is standard practice for
      unexplained hypertrophy, applied here because of the paper's finding.
  notes: >-
    No CMH21-specific diagnostic-yield data exist for any of these tests; the
    panel composition is standard practice for unexplained left ventricular
    hypertrophy and is guideline-derived rather than entity-derived.
treatments:
- name: Genetic Counseling and Lifelong Cascade Clinical Screening
  description: >-
    The highest-value intervention in this entity, and the one most shaped by its
    gene-less status. Three things must be conveyed and are easy to get wrong.
    First, inheritance is autosomal dominant across four generations, so
    first-degree relatives carry a 50% prior risk and all require evaluation.
    Second, a negative cardiomyopathy panel does not exclude a relative -
    because no CMH21 allele has ever been identified, there is nothing to test
    for, and cascade *genetic* testing is simply unavailable; surveillance is
    therefore clinical, and lifelong. Third, and following from the same fact,
    preimplantation genetic testing and prenatal diagnosis are not options for
    this family, which is a material difference from every gene-solved
    cardiomyopathy and should be stated plainly rather than discovered later.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct DNA sequencing was performed on sarcomere genes known to cause HCM
      and dilated cardiomyopathy, and no mutations were identified.
    explanation: >-
      The absence of an identifiable variant in the defining kindred is precisely
      what makes genetic cascade testing unavailable and clinical surveillance
      unending.
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one kindred (4 generations, 32 individuals) with predominant clinical
      features of left ventricular hypertrophy
    explanation: >-
      Four-generation transmission establishes the dominant pattern underlying
      the 50% recurrence risk counseling is built on.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Sudden death is a documented feature of the defining kindred, which puts
    arrhythmic risk stratification squarely in scope for this entity. What CMH21
    cannot supply is the stratification itself: the established sudden-death risk
    models for hypertrophic cardiomyopathy are built on sarcomeric cohorts, and
    this entity has one published family, no event rates, and a histology that
    the authors said is not typical sarcomeric HCM - so it is not clear those
    models transfer. Decisions are therefore made on generic criteria and family
    history, and the gap is recorded rather than papered over.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_phenotypes:
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      left ventricular hypertrophy in addition to cardiac dilation, end-stage
      heart failure, and sudden death.
    explanation: >-
      Establishes sudden death in the kindred, which is the indication for
      considering an ICD. PARTIAL because the source records the events and does
      not evaluate device therapy, report an event rate, or adjudicate mechanism.
  notes: >-
    No CMH21-specific risk calculator, event rate, or ICD outcome data exist.
    Practice is guideline-generic (2024 AHA/ACC, PMID:38718139; 2023 ESC,
    PMID:37622657), and neither guideline's cached abstract carries quotable
    recommendation text, so no snippet is claimed for the indication threshold.
- name: Heart Transplantation and Advanced Heart Failure Management
  description: >-
    Affected members of the kindred progressed to end-stage heart failure, so
    advanced therapy is a documented endpoint of this disease rather than a
    theoretical one. The trajectory is also the reason the drug class most
    associated with hypertrophic cardiomyopathy is absent from this entry: this
    family moved from hypertrophy toward dilation and end-stage failure, and
    cardiac myosin inhibitors are indicated for obstructive disease and are
    inappropriate once systolic function falls.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation

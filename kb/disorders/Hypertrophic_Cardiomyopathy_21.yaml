histopathology:
- name: Absence of Myocyte Disarray and Interstitial Fibrosis
  description: >-
    Myocardial histopathology available from two affected family members did NOT
    show myocyte disarray or fibrosis. This is a discriminating negative
    finding: myocyte disarray with interstitial fibrosis is the expected
    histological signature of sarcomere-mutation HCM, and its absence was the
    authors' basis for concluding that this kindred's phenotype is not typical
    sarcomeric HCM. Only two individuals were examined, so the finding is not
    established as a general feature of the entity.
  diagnostic: false
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      Exact statement of the negative histological finding and the authors'
      interpretation of it.
differential_diagnoses:
- name: Sarcomeric Hypertrophic Cardiomyopathy
  disease_term:
    preferred_term: familial hypertrophic cardiomyopathy
    term:
      id: MONDO:0024573
      label: familial hypertrophic cardiomyopathy
  description: >-
    Autosomal dominant HCM caused by mutations in sarcomere-protein genes is the
    principal alternative in any kindred with inherited left ventricular
    hypertrophy, and must be excluded by sequencing before a novel locus is
    invoked. In the CMH21 kindred, sarcomere-gene sequencing was negative and
    the myocardial histology lacked disarray and fibrosis.
  distinguishing_features:
  - 'Sarcomeric HCM: a pathogenic variant in a sarcomere-protein gene is
    identifiable. CMH21: sarcomere genes were sequenced in the index kindred and
    no mutations were found.'
  - 'Sarcomeric HCM: myocyte disarray with interstitial fibrosis on myocardial
    histology. CMH21: neither disarray nor fibrosis in the two family members
    examined.'
  - 'CMH21 is defined only by linkage to 7p12.1-q21, with no gene identified
    anywhere in the 27.2 Mb interval.'
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct DNA sequencing was performed on sarcomere genes known to cause HCM
      and dilated cardiomyopathy, and no mutations were identified.
    explanation: >-
      Documents the exclusion of the main differential (sarcomeric HCM/DCM) in
      the defining kindred.
- name: GATAD1-Related Autosomal Recessive Dilated Cardiomyopathy
  description: >-
    A separate autosomal recessive dilated cardiomyopathy maps to chromosome arm
    7q21 and is caused by a homozygous GATAD1 missense mutation. Its linkage
    region overlaps the distal part of the CMH21 interval, which makes it a
    tempting but incorrect candidate assignment for CMH21. The two entities
    differ in mode of inheritance (recessive vs. the dominant four-generation
    CMH21 pedigree), in primary phenotype, and in cohort; no study has linked
    GATAD1 to CMH21.
  distinguishing_features:
  - 'GATAD1 DCM is autosomal recessive (homozygous GATAD1 missense variant in
    descendants of first cousins, with unaffected heterozygous carriers); the
    CMH21 kindred shows dominant transmission across four generations.'
  - 'GATAD1 DCM presents as dilated cardiomyopathy; CMH21 presents with
    predominant left ventricular hypertrophy, with dilation as an additional
    feature.'
  - 'GATAD1 is an identified gene; CMH21 has no gene identified anywhere in its
    27.2 Mb interval, and GATAD1 has never been tested in the CMH21 kindred.'
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotyping and linkage analysis mapped an AR DCM locus to chromosome arm
      7q21, which was validated and refined by high-density homozygosity
      mapping.
    explanation: >-
      Confirms that a distinct, autosomal recessive cardiomyopathy locus lies on
      7q21, overlapping the CMH21 interval — the basis for flagging it as a
      differential rather than a candidate gene for CMH21.
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed genome-wide mapping and exome sequencing in a unique family
      wherein DCM segregated as an autosomal recessive (AR) trait.
    explanation: >-
      Establishes the recessive inheritance of the GATAD1 entity, distinguishing
      it from the dominant CMH21 kindred.
discussions:
- discussion_id: cmh21_causal_gene_unidentified
  prompt: >-
    Which gene within the 27.2 Mb 7p12.1-q21 interval carries the CMH21 disease
    allele?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
  - genetic#CMH21 linkage locus (7p12.1-q21)
  rationale: >-
    CMH21 is one of the few members of the CMH numbered series that remains
    defined by a chromosomal region rather than a gene. The MONDO definition
    ("material basis in region 7p12.1-q21 variation") and the OMIM entry both
    stop at the interval. The anchoring linkage study identified the interval
    but explicitly left the causal mutation for future work, and no subsequent
    publication has reported a gene for this entity. Until a gene is
    established, every downstream mechanistic node in this entry is an
    observation about a phenotype, not a molecular pathway. Assigning a
    plausible-looking gene from the interval (for example on the basis of
    cardiac expression or of a neighbouring cardiomyopathy locus) would be an
    unsupported inference.
  proposed_experiments:
  - experiment_id: cmh21_wgs_reanalysis
    name: Whole-genome sequencing and re-analysis of the index kindred
    description: >-
      Perform whole-genome (not exome-only) sequencing on the surviving affected
      and unaffected members of the original 4-generation kindred and filter for
      variants segregating with disease within the D7S506-D7S3314 interval.
      Genome-wide coverage is required because the 2006 study excluded only
      coding sarcomere genes, leaving non-coding, regulatory, and structural
      variation within the interval untested.
    decision_criterion: >-
      A rare variant segregating with the phenotype inside the
      D7S506-D7S3314 interval and absent from population databases would
      nominate the causal gene; finding none on whole-genome coverage would
      raise the possibility that the original single-family linkage signal was
      a false positive.
    would_support:
    - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of the causal gene mutation and additional
      genotype-phenotype correlation studies will provide fundamental insight
      into mechanisms of cardiac remodeling.
    explanation: >-
      The authors state that the causal gene mutation had not been identified
      and frame its identification as future work — the gap this discussion
      records.
- discussion_id: cmh21_gatad1_regional_overlap_not_causation
  prompt: >-
    Should GATAD1 (7q21.2), the gene for an autosomal recessive dilated
    cardiomyopathy that maps inside the CMH21 interval, be treated as a
    candidate gene for CMH21?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#CMH21 linkage locus (7p12.1-q21)
  rationale: >-
    A curator or automated tool searching the 7p12.1-q21 interval for
    cardiomyopathy genes will find GATAD1, whose autosomal recessive DCM locus
    at 7q21 overlaps the distal end of the CMH21 interval. Regional overlap is
    not evidence of shared causation. The GATAD1 entity is recessive, was
    ascertained in descendants of first cousins, presents as dilated
    cardiomyopathy, and has unaffected heterozygous carriers — none of which
    matches the dominant, hypertrophy-predominant, four-generation CMH21
    kindred. No study has tested GATAD1 in the CMH21 family or otherwise linked
    the two. This discussion is recorded so the coincidence is documented and
    explicitly rejected rather than silently re-discovered and mis-asserted.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation, absent in HapMap, 1000 Genomes, and 474 ethnically matched
      controls, altered a conserved residue of GATAD1, encoding GATA zinc finger
      domain-containing protein 1.
    explanation: >-
      Identifies GATAD1 as the gene for the recessive 7q21 DCM entity, i.e. for
      a different disease that happens to map inside the CMH21 interval.
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen relatives were heterozygous mutation carriers with no evidence of
      myocardial disease, even at advanced ages.
    explanation: >-
      Heterozygous GATAD1 carriers are unaffected, which is incompatible with
      the dominant transmission pattern of the CMH21 kindred and argues against
      transferring this gene to CMH21.
- discussion_id: cmh21_entity_rests_on_a_single_kindred
  prompt: >-
    Is CMH21 a replicable disease entity, or a single-family linkage result that
    has not been independently confirmed?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
  rationale: >-
    The entire evidence base for CMH21 is one kindred reported in 2006 with a
    two-point LOD of 4.11. No second family, no gene, and no genotype-phenotype
    series have been published since. The clinical description (hypertrophy plus
    dilation plus end-stage heart failure, without myocyte disarray) also does
    not match the typical sarcomeric HCM phenotype that the CMH series name
    implies, so the entity's placement under hypertrophic cardiomyopathy in
    MONDO is itself a nosological question. Curators should treat this entry as
    a faithful record of a single well-conducted linkage study rather than as an
    established disease mechanism.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genome-wide linkage analysis was used to study one kindred (4 generations,
      32 individuals)
    explanation: >-
      Confirms that the entity derives from a single kindred.
- discussion_id: cmh21_omim_synopsis_features_unquotable
  prompt: >-
    Should the OMIM/MedGen clinical-synopsis features for CMH21 that cannot be
    quoted from the paywalled full text (atrial fibrillation, mitral valve
    prolapse) be curated as phenotypes, and how should the synopsis's listing of
    myofiber disarray be reconciled with the primary paper's report that
    disarray was absent?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - histopathology#Absence of Myocyte Disarray and Interstitial Fibrosis
  rationale: >-
    The OMIM/MedGen clinical synopsis for CMH21 (OMIM:614676, MedGen CUI
    C3553442) lists six HPO-mapped features: Hypertrophic cardiomyopathy
    (HP:0001639), Left ventricular hypertrophy (HP:0001712), Sudden death
    (HP:0001699), Atrial fibrillation (HP:0005110), Mitral valve prolapse
    (HP:0001634), and Myofiber disarray (HP:0031318). Two problems block direct
    curation. First, atrial fibrillation and mitral valve prolapse presumably
    derive from the Circulation full text, which is not open access and is not
    in the abstract, so no exact snippet can be verified for them; per dismech
    evidence policy they are recorded here rather than asserted as unevidenced
    phenotypes. Second, the synopsis's inclusion of myofiber disarray directly
    contradicts the paper's abstract, which states that histopathology in two
    family members "did not demonstrate myocyte disarray and fibrosis". The most
    plausible explanation is that the OMIM synopsis inherits the generic CMH
    template rather than this family's actual pathology. Resolving this requires
    the Circulation full text (institutional access), after which the two
    unquotable phenotypes can be added with real evidence and the disarray
    conflict can be settled.
notes: >-
  Curation guardrail: this entry deliberately contains NO causal gene. MONDO
  (MONDO:0013852) and OMIM (614676) both define CMH21 by the 7p12.1-q21 region,
  and the anchoring publication (PMID:16651466) is a linkage study that
  explicitly did not identify the gene. Any future edit that adds a gene_term to
  the `genetic` block must cite primary literature establishing that gene for
  THIS entity and must reconcile the assignment with the MONDO and OMIM records.
  Regional overlap with GATAD1 (7q21.2, autosomal recessive DCM) is not
  sufficient — see the `cmh21_gatad1_regional_overlap_not_causation` discussion.
  GeneReviews baseline: there is no CMH21-specific GeneReviews chapter. The
  parent-disease overview (PMID:20301725, "Nonsyndromic Hypertrophic
  Cardiomyopathy Overview") is tagged in the top-level `references` block for
  completeness, but its PubMed record carries only a scope statement rather than
  quotable Clinical Characteristics text, so it contributes no phenotype
  baseline for this entity. Deep research: the falcon/Edison provider was
  unavailable in this environment (no EDISON_API_KEY/FUTUREHOUSE_API_KEY), so
  the `claude_code` provider was used instead; its report is in
  `research/Hypertrophic_Cardiomyopathy_21-deep-research-claude_code.md`. That

name: Hypertrophic Cardiomyopathy 21
creation_date: '2026-08-01T00:00:00Z'
synonyms:
- CMH21
- cardiomyopathy, hypertrophic, 21
- cardiomyopathy, familial hypertrophic, 21
- hypertrophic cardiomyopathy type 21
description: >-
  Hypertrophic cardiomyopathy 21 (CMH21) is a locus-defined inherited
  cardiomyopathy entity with no established causal gene. It was delineated
  in a single large kindred by genome-wide linkage to a 27.2-Mb interval on
  chromosome 7 (7p12.1-7q21), after direct sequencing of the known HCM and
  dilated-cardiomyopathy sarcomere genes was negative. The affected family
  members showed left ventricular hypertrophy together with cardiac dilation,
  end-stage heart failure, and sudden death; myocardial histopathology in two
  members lacked the myocyte disarray and fibrosis typical of sarcomeric HCM.
  MONDO and OMIM therefore define this entity by chromosomal region rather than
  by gene, and the molecular lesion within 7p12.1-q21 remains unidentified.
  Because the anchoring report describes a mixed hypertrophic-and-dilated,
  non-disarray phenotype, the "hypertrophic cardiomyopathy" label inherited from
  the CMH numbered series should be read as a nosological placeholder rather
  than as a claim of typical sarcomeric HCM biology.
category: Mendelian
disease_term:
  preferred_term: hypertrophic cardiomyopathy 21
  term:
    id: MONDO:0013852
    label: hypertrophic cardiomyopathy 21
parents:

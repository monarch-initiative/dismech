  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The published evidence base for
    CMH21 is a single four-generation kindred of 32 individuals reported in
    2006; no additional family has been described since, and no gene test
    exists that would allow the entity to be ascertained in unrelated
    populations.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genome-wide linkage analysis was used to study one kindred (4 generations,
      32 individuals)
    explanation: >-
      Establishes that the entity's entire published case base is a single
      kindred of 32 individuals.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CMH21 is catalogued as an autosomal dominant trait (OMIM:614676). The single
    reported kindred spans four generations with vertical transmission, which is
    consistent with dominant inheritance, but the anchoring abstract does not
    state the mode of inheritance explicitly, so this assignment rests on the
    pedigree structure and the OMIM/MONDO classification rather than on a stated
    segregation model.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genome-wide linkage analysis was used to study one kindred (4 generations,
      32 individuals) with predominant clinical features of left ventricular
      hypertrophy in addition to cardiac dilation, end-stage heart failure, and
      sudden death.
    explanation: >-
      Documents a four-generation kindred with disease transmitted across
      generations, consistent with (but not explicitly stated as) autosomal
      dominant inheritance.
genetic:
- name: CMH21 linkage locus (7p12.1-q21)
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    CMH21 is defined by a linkage interval, not by a gene. Two-point linkage in
    the index kindred reached a maximum LOD score of 4.11 on chromosome 7, and
    recombinants narrowed the disease interval to the 27.2 Mb between markers
    D7S506 and D7S3314 (7p12.1-7q21). No causal gene or variant within this
    interval has been reported. Sarcomere genes known to cause hypertrophic and
    dilated cardiomyopathy were sequenced in this family and were negative.
    This block is deliberately curated WITHOUT a gene_term. Do not populate a
    gene here unless a causal gene inside 7p12.1-q21 is established for this
    entity in primary literature and reconciled with the MONDO/OMIM record.
    GATAD1 (7q21.2) is a gene for a DIFFERENT entity (autosomal recessive
    dilated cardiomyopathy, PMID:21965549) and must not be assigned to CMH21 on
    the basis of regional overlap alone.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage was then established to a novel locus on chromosome 7
      (7p12.1-7q21). A maximum 2-point logarithm of odds score of 4.11 was
      obtained. Recombination events refine the disease interval between D7S506
      and D7S3314, corresponding to a distance of 27.2 megabases.
    explanation: >-
      Establishes the locus, its boundaries, and its statistical support, which
      is the entire genetic basis on which this MONDO/OMIM entity rests.
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct DNA sequencing was performed on sarcomere genes known to cause HCM
      and dilated cardiomyopathy, and no mutations were identified.
    explanation: >-
      Excludes the known sarcomeric causes in this kindred, supporting a
      non-sarcomeric, still-unidentified molecular lesion.
pathophysiology:
- name: Unidentified 7p12.1-q21 Disease Allele
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proximal lesion is a germline variant segregating with disease within a
    27.2 Mb interval on chromosome 7 (7p12.1-7q21). Neither the gene nor the
    variant class (coding, regulatory, structural) has been identified, so no
    molecular function, protein complex, or biological process can be assigned
    to this node. It is modelled explicitly as an unresolved trigger so that the
    downstream chain is not attributed to a fabricated molecular cause.
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recombination events refine the disease interval between D7S506 and
      D7S3314, corresponding to a distance of 27.2 megabases.
    explanation: >-
      Defines the physical interval containing the disease allele while leaving
      the gene unspecified.
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of the causal gene mutation and additional
      genotype-phenotype correlation studies will provide fundamental insight
      into mechanisms of cardiac remodeling.
    explanation: >-
      The authors state the causal gene mutation was not identified and remains
      to be found.
  downstream:
  - target: Non-Sarcomeric Left Ventricular Hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate steps between the 7p12.1-q21 allele and the hypertrophic
      phenotype are entirely unknown; the edge records co-segregation, not a
      characterized mechanism.
- name: Non-Sarcomeric Left Ventricular Hypertrophy
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Affected individuals develop left ventricular hypertrophy that is not
    attributable to a sarcomere-protein mutation. Myocardial histopathology in
    two family members lacked myocyte disarray and interstitial fibrosis, the
    histological signature of sarcomeric HCM, indicating that the hypertrophy in
    this kindred arises through a pathway distinct from the canonical sarcomere
    mechanism. The authors interpret this as evidence that pathways to inherited
    cardiac hypertrophy extend beyond the sarcomere.
  locations:
  - preferred_term: left ventricle myocardium
    term:
      id: UBERON:0006566
      label: left ventricle myocardium
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, histopathology from 2 family members did not demonstrate myocyte
      disarray and fibrosis, indicating that this phenotype is not typical
      sarcomere mutation HCM.
    explanation: >-
      Directly documents hypertrophy without the sarcomeric-HCM histological
      signature in this kindred.
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The discovery of a novel genetic locus in this family provides more
      evidence that molecular pathways leading to inherited cardiac hypertrophy
      extend beyond the sarcomere.
    explanation: >-
      The authors' own framing that this hypertrophy is mechanistically
      non-sarcomeric.
  downstream:
  - target: Ventricular Dilation and End-Stage Heart Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Within the index kindred, hypertrophy coexisted with cardiac dilation and
      progression to end-stage heart failure; whether dilation is a sequela of
      the hypertrophic phase or an independent expression of the same allele is
      not resolved by the available data.
- name: Ventricular Dilation and End-Stage Heart Failure
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  conforms_to: cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure
  description: >-
    Beyond left ventricular hypertrophy, the reported kindred manifested cardiac
    dilation, end-stage heart failure, and sudden death — a mixed
    hypertrophic-to-dilated remodeling course rather than the pure obstructive
    hypertrophic phenotype implied by the CMH series name. This node is curated
    at the level of the observed clinical/structural outcome; the neurohormonal
    and cellular remodeling steps described in the
    `cardiomyopathy_maladaptive_remodeling` module are the generic umbrella
    account and have not been demonstrated for this specific entity.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:16651466
    reference_title: Novel locus for an inherited cardiomyopathy maps to chromosome 7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      predominant clinical features of left ventricular hypertrophy in addition
      to cardiac dilation, end-stage heart failure, and sudden death.
    explanation: >-
      Documents the dilated/heart-failure arm of the phenotype in the index
      kindred.

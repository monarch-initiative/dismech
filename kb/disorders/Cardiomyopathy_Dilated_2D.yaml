- name: Hotspot RPL3L Toxic Gain of Function
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Recurrent hotspot proteins (G27D, D308N) are retained almost exclusively in
    the nucleus, aggregate with nucleolar proteins and bind the RPL3 chaperone
    GRWD1 and the biogenesis factor C7orf50 more strongly. They also keep
    RPL3L's ability to repress RPL3 through unproductive splicing. These data
    come from engineered AC16 cardiomyocyte-like cells, and only G27D and D308N
    were tested, so the same behaviour for D308V is inferred. The hotspot
    proteins have not been imaged in patient myocardium.

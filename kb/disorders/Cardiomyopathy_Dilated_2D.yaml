genetic:
- name: RPL3L
  gene_term:
    preferred_term: RPL3L
    term:
      id: hgnc:10351
      label: RPL3L
  variant_origin: GERMLINE
  presence: PRESENT
  association: >-
    Biallelic RPL3L variants are reported in CMD2D. The evidence rests on about
    13 published families (16-17 patients), with segregation in several
    multiplex sibships, recurrent hotspot alleles across unrelated families,
    and functional data from one explanted heart and engineered AC16 cells.
    ClinGen rates the recessive pair Moderate under the broader dilated
    cardiomyopathy term (MONDO:0005021). The 2026 expert-panel "high evidence"
    category includes Moderate, so it does not imply Definitive or Strong.
  notes: >-
    Reported alleles (NM_005061.3) include p.Gly27Asp (recurrent), p.Asp308Asn
    and p.Asp308Val (recurrent codon), p.Thr189Met, p.Arg161Trp, p.Arg343Trp,
    p.Ala51Thr, p.Val231Phe, p.Arg116Cys, p.Arg116His (homozygous, consanguineous
    family), p.Arg58Gln, p.Glu202Gly, p.Glu108Lys, homozygous p.Asp308Val
    (segmental uniparental disomy), frameshifts p.Ala359Glyfs*4, p.Ala359fs*6
    and p.Thr340Asnfs*25, the splice-donor c.1167+1G>A (exon 9 skipping), and
    the synonymous c.501G>A (p.Gln167=), whose pathogenic mechanism is
    unexplained. ClinGen's cached gene-validity
    record (CGGV, 2025-05-30) classifies RPL3L with the broader dilated
    cardiomyopathy term (MONDO:0005021), autosomal recessive, as Moderate; that
    is not this entry's MONDO term, so no gene_disease_validity tier is copied.
    No relationship_type is asserted, because CAUSATIVE corresponds to ClinGen
    Definitive or Strong and the only ClinGen rating is Moderate.
  evidence:
  - reference: PMID:32514796
    reference_title: Bi-allelic missense disease-causing variants in RPL3L associate neonatal dilated cardiomyopathy with muscle-specific ribosome biogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In conclusion, we report that bi-allelic pathogenic variants in RPL3L are causative of an early-onset, severe neonatal form of dilated cardiomyopathy, and we show for the first time that cytoplasmic ribosomal proteins are involved in the pathogenesis of non-syndromic cardiomyopathies.
    explanation: The founding gene-disease claim.
  - reference: PMID:35323613
    reference_title: Further Evidence of Autosomal Recessive Inheritance of RPL3L Pathogenic Variants with Rapidly Progressive Neonatal Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In the present brief report, we identified two pathogenic RPL3L variants, each harbored in unaffected heterozygous parents: mother (RPL3L c.1076_1080delCCGTG (p.Ala359Glyfs*4)) and father (RPL3L c.80G > A (p.Gly27Asp))."
    explanation: Independent family replicating the gene-disease link.
  - reference: PMID:37308880
    reference_title: "Novel compound heterozygous variants in the RPL3L gene causing dilated cardiomyopathy type-2D: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Whole-exome sequencing (WES) revealed compound heterozygous variants (c.80G > A (p.Gly27Asp) and c.1074dupA (p.Ala359fs*6)) in RPL3L (NM_005061.3).
    explanation: A further family with the recurrent Gly27Asp allele.
  - reference: PMID:42156347
    reference_title: "Infantile dilated cardiomyopathy caused by RPL3L gene mutation: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Whole-exome sequencing identified two RPL3L mutations: c.501G>A (p.Q167=) inherited from the father and c.322G>A (p.E108K) from the mother."
    explanation: A case carrying a synonymous allele, whose effect was not functionally tested.
  - reference: PMID:40820268

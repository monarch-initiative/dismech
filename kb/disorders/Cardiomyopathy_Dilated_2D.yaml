    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: The non-hotspot (private) allele of a compound heterozygous genotype.
  evidence:
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Whereas non-hotspot variants phenocopy knockout and allow RPL3 compensation, hotspot variants induce nucleolar protein aggregation, disrupt rRNA processing and block compensation by preserving the role of RPL3L in repressing RPL3 via unproductive splicing.
    explanation: Summary of the allele-class distinction measured in isogenic cells.
  - reference: PMID:36733907
    reference_title: Rpl3l gene deletion in mice reduces heart weight over time.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: Thus, deletion of Rpl3l forces maintenance of RPL3 expression within the heart that appears to fully compensate for the loss of RPL3L, although older Rpl3l -/- mice showed a mild but significant reduction in heart weight.
    explanation: In mice, complete Rpl3l loss is compensated by RPL3.
  downstream:

name: Cardiomyopathy Dilated 2D
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cardiomyopathy, dilated, 2D
  term:
    id: MONDO:0030300
    label: cardiomyopathy, dilated, 2D
synonyms:
- CMD2D
- dilated cardiomyopathy type 2D
- RPL3L-related dilated cardiomyopathy
- RPL3L-related neonatal dilated cardiomyopathy
description: >-
  Cardiomyopathy, dilated, 2D (CMD2D; OMIM 619371) is an autosomal recessive,
  neonatal- to early-infantile-onset dilated cardiomyopathy caused by biallelic
  germline variants in RPL3L, the heart- and skeletal-muscle-specific paralog of
  the core 60S ribosomal protein RPL3. Affected infants present between the first
  day of life and about 2.5 months with left ventricular dilatation, severely
  reduced systolic function, atrioventricular-valve regurgitation and rapidly
  progressive heart failure or cardiogenic shock. Many die in infancy; survivors
  have mostly required ventricular assist and heart transplantation, and one
  infant recovered on drug therapy. No skeletal myopathy has been reported. The
  disorder is known from about 13 families and 16-17 published patients. Most
  carry one recurrent hotspot missense allele (Gly27Asp or Asp308Asn/Val) with a
  private second allele. ClinGen rates the recessive RPL3L relationship Moderate
  under the broader dilated cardiomyopathy term (MONDO:0005021); the 2026 expert
  panel's "high evidence" category includes Moderate. A 2026 study using one explanted patient heart and AC16
  cardiomyocyte-like cells proposes combined mechanisms: non-hotspot alleles
  behave like loss of function and allow RPL3 compensation, while hotspot alleles
  aggregate in the nucleolus, disrupt rRNA processing and keep RPL3 repressed,
  producing cardiac ribosome deficiency. Rpl3l knockout mice and population
  RPL3L-null homozygotes lack this severe disease, so simple loss of function does
  not explain it.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR

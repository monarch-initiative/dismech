animal_models:
- name: Rpl3l knockout mouse (Grimes et al.)
  species: Mouse
  genotype: Rpl3l -/- germline deletion
  publication: PMID:36733907
  description: >-
    Knockout mice show no change in cardiac structure or function at baseline
    or after pressure overload, because RPL3 stays up-regulated; by 18 months
    their hearts are smaller. The model does not reproduce dilated
    cardiomyopathy.
  modeled_mechanisms:
  - target: Loss of RPL3L Function from Non-hotspot Alleles
    model_scale: MOLECULAR
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Complete Rpl3l loss with compensatory RPL3 maintenance, matching the proposed behaviour of non-hotspot alleles.
    limitations: Models complete loss on both alleles, not the human hotspot-plus-private genotype.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: No hotspot allele is present, so the gain-of-function arm that blocks RPL3 compensation is absent.
    evidence:
    - reference: PMID:36733907
      reference_title: Rpl3l gene deletion in mice reduces heart weight over time.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Thus, deletion of Rpl3l forces maintenance of RPL3 expression within the heart that appears to fully compensate for the loss of RPL3L, although older Rpl3l -/- mice showed a mild but significant reduction in heart weight.
      explanation: Knockout with RPL3 compensation.
  - target: Impaired Left Ventricular Systolic Function and Dilatation
    model_scale: TISSUE
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: No cardiac structural or functional abnormality at baseline or after pressure overload.
    limitations: Adult-focused phenotyping; neonatal cardiac function was not the main readout.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: INVALIDATING
      description: RPL3 compensation, which hotspot alleles block in humans, is intact in the knockout.
    evidence:
    - reference: PMID:36733907
      reference_title: Rpl3l gene deletion in mice reduces heart weight over time.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Rpl3l gene-deleted mice were generated to examine the role of this gene in the heart, although Rpl3l -/- mice showed no overt changes in cardiac structure or function at baseline or after pressure overload hypertrophy, likely because RPL3 expression was upregulated and maintained in adulthood.
      explanation: No DCM phenotype in the knockout.
- name: Rpl3l knockout mouse (Shiraishi et al.)
  species: Mouse
  genotype: Rpl3l -/- (male mice studied)
  publication: PMID:37080962
  description: Male knockout mice have impaired cardiac contractility and altered ribosome elongation dynamics, most marked for contraction- and DCM-related transcripts.
  modeled_mechanisms:
  - target: Altered Translation Elongation Dynamics
    model_scale: CELLULAR
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Ribosome profiling of knockout hearts shows altered codon occupancy.
    limitations: Not confirmed in patient tissue, and a second knockout study found no translational-efficiency change.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Measured in adult mouse heart, not in neonatal human myocardium with hotspot alleles.
    evidence:
    - reference: PMID:37080962
      reference_title: RPL3L-containing ribosomes determine translation elongation dynamics required for cardiac function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Ribosome occupancy at mRNA codons was found to be altered in the RPL3L-deficient heart, and the changes were negatively correlated with those observed in myoblasts overexpressing RPL3L.
      explanation: The elongation readout in knockout hearts.
  - target: Impaired Left Ventricular Systolic Function and Dilatation
    model_scale: TISSUE
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Reduced contractility without the fulminant neonatal dilated cardiomyopathy of patients.
    limitations: A mild adult phenotype in contrast to fatal neonatal disease.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mild contractile impairment in adult male mice, versus fulminant neonatal failure in humans.
    evidence:
    - reference: PMID:37080962
      reference_title: RPL3L-containing ribosomes determine translation elongation dynamics required for cardiac function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: Deficiency of RPL3L-containing ribosomes in RPL3L knockout male mice resulted in impaired cardiac contractility.
      explanation: Contractile impairment in knockout mice.
- name: Rpl3l knockout mouse (Milenkovic et al.)
  species: Mouse
  genotype: Rpl3l -/- viable homozygous knockout
  publication: PMID:36882085
  description: Viable knockout in which RPL3 replaces RPL3L in cardiomyocyte ribosomes; ribosome-mitochondria contacts and ATP increase.
  modeled_mechanisms:
  - target: Increased Ribosome-Mitochondria Association
    model_scale: CELLULAR
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: The knockout shows the ribosome-mitochondria change that defines this node.
    limitations: Not observed in a second knockout line and not measured in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mouse cardiomyocytes lacking RPL3L entirely, not human hotspot-plus-private genotypes.
    evidence:
    - reference: PMID:36882085
      reference_title: Dynamic interplay between RPL3- and RPL3L-containing ribosomes modulates mitochondrial activity in the mammalian heart.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: In contrast, we show that depletion of RPL3L leads to increased ribosome-mitochondria interactions in cardiomyocytes, which is accompanied by a significant increase in ATP levels, potentially as a result of fine-tuning of mitochondrial activity.
      explanation: The defining measurement.

discussions:
- discussion_id: cmd2d_knockout_does_not_model_disease
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why do recessive human RPL3L genotypes cause fatal neonatal DCM when Rpl3l knockout mice, and humans homozygous for population RPL3L null alleles, lack severe cardiac disease?
  attaches_to:
  - pathophysiology#Loss of RPL3L Function from Non-hotspot Alleles
  - pathophysiology#Persistent RPL3 Repression
  rationale: >-
    Knockout mice compensate with RPL3. In gnomAD, All of Us and UK Biobank, one
    person is homozygous for R226X and 17 are homozygous for the c.1167+1G>A
    splice-donor allele without reported severe early DCM. The proposed answer
    is that hotspot alleles block RPL3 compensation, but that rests on AC16
    cells and one explanted heart. No hotspot knock-in animal or patient iPSC
    cardiomyocyte model has been reported.
  evidence:
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The lack of severe cardiac dysfunction in both putative RPL3L-knockout humans and Rpl3l-knockout mice strongly suggests that RPL3L-linked DCM is unlikely to be caused by simple RPL3L deficiency, despite the autosomal recessive inheritance pattern in affected families.
    explanation: Population and mouse evidence against simple loss of function.
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In addition, 17 individuals are homozygous for the splice donor variant (c.1167+1G>A).
    explanation: Homozygous putative null humans in population databases.
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Despite the recessive inheritance pattern in humans, Rpl3l knockout mice show no overt cardiac phenotype, probably because of compensatory RPL3 upregulation through unknown mechanisms.
    explanation: The mouse-human discrepancy, summarised from other groups' knockout studies.
    quote_role: BACKGROUND
  proposed_experiments:
  - experiment_id: exp_cmd2d_hotspot_knockin
    name: Hotspot knock-in mouse or patient iPSC cardiomyocytes
    description: Generate a mouse carrying Gly27Asp or Asp308Asn in trans with a null allele, or patient-derived iPSC cardiomyocytes with isogenic correction of each allele, and test whether RPL3 compensation fails, 28S rRNA falls and contractile failure appears in the neonatal period.
- discussion_id: cmd2d_contested_knockout_mechanisms
  kind: CONTROVERSY
  status: OPEN
  prompt: Does loss of RPL3L-containing ribosomes alter translation elongation, mitochondrial coupling, or neither?
  attaches_to:
  - pathophysiology#Altered Translation Elongation Dynamics
  - pathophysiology#Increased Ribosome-Mitochondria Association
  rationale: >-
    Three knockout mouse lines disagree. One shows impaired contractility and
    altered elongation; one shows no translational-efficiency change but more
    ribosome-mitochondria contact; one shows neither and no mitochondrial
    change. None models the hotspot genotype, so the human relevance of all
    three is uncertain.
  evidence:
  - reference: PMID:36733907
    reference_title: Rpl3l gene deletion in mice reduces heart weight over time.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: mRNA expression analysis and ribosome profiling failed to show differences between the hearts of Rpl3l null and wild type mice in adulthood.
    explanation: A null ribosome-profiling result contrasting with the elongation study.
- discussion_id: cmd2d_small_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How representative are the roughly 13 published families, and what explains the milder course and synonymous allele in the one medically recovered infant?
  attaches_to:
  - pathophysiology#Biallelic RPL3L Variants
  rationale: >-
    Phenotype, prognosis and the allele-class model all rest on fewer than 20
    patients. Most were ascertained through severe neonatal presentation and
    exome sequencing, which may bias toward severe disease. The synonymous
    c.501G>A allele has no splicing or expression study, and the
    gain-of-function model was tested only for G27D and D308N.
  evidence:
  - reference: PMID:36291431
    reference_title: "Compound Heterozygous Missense Variants in RPL3L Genes Associated with Severe Forms of Dilated Cardiomyopathy: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Bi-allelic variants in RPL3L have been reported in only seven patients from four unrelated families in the literature.
    explanation: The patient pool was very small as of 2022.
- discussion_id: cmd2d_neonatal_paralog_switch
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: Does the perinatal switch from RPL3 to RPL3L explain why disease begins in the neonatal period?
  attaches_to:
  - pathophysiology#Persistent RPL3 Repression
  rationale: >-
    In mouse ventricle, RPL3 dominates at birth and RPL3L gradually replaces it.
    Onset might coincide with the switch, when hotspot RPL3L represses RPL3
    before functional RPL3L-containing ribosomes are available. This timing
    link has not been tested in humans.
  evidence:
  - reference: PMID:36733907
    reference_title: Rpl3l gene deletion in mice reduces heart weight over time.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Methods and Results: Here, we observed that mouse cardiac ventricles express RPL3 at birth, where it is gradually replaced by RPL3L in adulthood but re-expressed with induction of hypertrophy in adults."
    explanation: Mouse developmental timing of the paralog switch.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: To date, only 13 patients with RPL3L-related CMD2D have been reported, with nearly all of whom are attributed to compound missense mutations.
    explanation: The small size of the published patient pool.

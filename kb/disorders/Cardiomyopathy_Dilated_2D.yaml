notes: >-
  Evidence base: three families (five patients) in the founding 2020 report, a
  further US sibship of two, single Chinese and US cases (2022-2023), four
  additional cases in the 2026 mechanistic study (which counted 11 families
  known to it), and two further Chinese families (R116C/E202G and E108K/Q167=)
  not included in that count, giving about 13 families and 16-17 patients.
  Counts across reports overlap and are not independent cohorts. RPL3L also
  appeared as one of seven homozygous novel candidate genes in a Saudi
  consanguineous childhood cardiomyopathy cohort, without functional follow-up.
  ClinGen has a cached gene-validity record for RPL3L with the broader term
  dilated cardiomyopathy (MONDO:0005021, autosomal recessive, Moderate,
  2025-05-30), which is not this entry's MONDO term, so no
  gene_disease_validity tier is recorded and no relationship_type is asserted;
  the 2026 ClinGen DCM expert-panel reassessment (Jordan et al.) lists RPL3L
  among genes newly classified as high evidence, a category that includes
  Moderate. In a genome-wide study (PMID:30271950), heterozygous RPL3L missense
  and splice-donor variants were associated with atrial fibrillation; that is a
  separate susceptibility phenotype, not CMD2D. The same splice-donor allele
  (c.1167+1G>A, exon 9 skipping) has also been reported among CMD2D patient
  alleles (PMID:41495453). Some reports cite the
  general dilated cardiomyopathy OMIM series (115200) rather than 619371.
  RPL3L must not be confused with its ubiquitous paralog RPL3. GeneReviews check
  (just check-genereviews --online, 2026-10-08) found no CMD2D- or
  RPL3L-specific GeneReviews chapter.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants co-segregate with disease in each reported family, and
    heterozygous carrier parents are unaffected. Most patients are compound
    heterozygous; two homozygous cases are reported, one in a consanguineous
    population and one through segmental uniparental disomy.
  evidence:
  - reference: PMID:32514796
    reference_title: Bi-allelic missense disease-causing variants in RPL3L associate neonatal dilated cardiomyopathy with muscle-specific ribosome biogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The identified variants co-segregated with the disease in each of the three families and were absent or very rare in the human population, in line with an autosomal recessive inheritance pattern.
    explanation: Segregation in three families supports recessive inheritance.
  - reference: PMID:35323613
    reference_title: Further Evidence of Autosomal Recessive Inheritance of RPL3L Pathogenic Variants with Rapidly Progressive Neonatal Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Pathogenic variants were segregated as autosomal recessive to two offspring born with compound heterozygous RPL3L variants and affected by neonatal DCM.
    explanation: An independent family with two affected compound heterozygous siblings.
  - reference: PMID:35323613
    reference_title: Further Evidence of Autosomal Recessive Inheritance of RPL3L Pathogenic Variants with Rapidly Progressive Neonatal Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Both carrier parents were unaffected and had normal echocardiograms.
    explanation: Heterozygous carriers were clinically unaffected.
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The two exceptions are a homozygous R116H case identified in a consanguineous population12 and a homozygous D308V case reported in this study (because of segmental uniparental disomy; Supplementary Note).
    explanation: Homozygous cases exist alongside the compound heterozygous majority.
pathophysiology:
- name: Biallelic RPL3L Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline biallelic RPL3L variants, mostly missense in the conserved RPL3
    domain, plus three frameshifts, the splice-donor allele c.1167+1G>A (exon 9
    skipping) and one synonymous allele. In the 2026 meta-analysis of the 11
    families known to that study, nine were compound heterozygous, and most
    patients combined a recurrent hotspot allele (Asp308Asn/Val in six families,
    Gly27Asp in three) with a private second allele. RPL3L is expressed only in
    cardiac and skeletal muscle and becomes the dominant RPL3-family protein in
    adult human left ventricular cardiomyocytes.
  genes:
  - preferred_term: RPL3L
    term:
      id: hgnc:10351
      label: RPL3L
  molecular_functions:
  - preferred_term: structural constituent of ribosome
    term:
      id: GO:0003735
      label: structural constituent of ribosome
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    allele_type: missense, frameshift and synonymous
    description: Compound heterozygosity is the usual genotype; two homozygous cases (R116H in a consanguineous family; D308V through segmental uniparental disomy) are reported.
  evidence:
  - reference: PMID:32514796
    reference_title: Bi-allelic missense disease-causing variants in RPL3L associate neonatal dilated cardiomyopathy with muscle-specific ribosome biogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Using whole-exome sequencing (WES), we identified causative, compound heterozygous missense variants in RPL3L (ribosomal protein L3-like) in all the affected individuals.
    explanation: Founding report of biallelic RPL3L variants in five affected individuals.
  - reference: PMID:32514796
    reference_title: Bi-allelic missense disease-causing variants in RPL3L associate neonatal dilated cardiomyopathy with muscle-specific ribosome biogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: RPL3L is one of the four non-canonical riboprotein genes and it encodes the 60S ribosomal protein L3-like protein that is highly expressed only in cardiac and skeletal muscle.
    explanation: Muscle-restricted expression of the 60S ribosomal paralog.
    quote_role: BACKGROUND
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Affected individuals typically carry one of two recurrent hotspot missense variants paired with a private allele.
    explanation: The hotspot-plus-private-allele genotype structure across reported families.
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The four remaining variants are putative LOF, including three truncating frameshift variants (T340Nfs*25 previously unreported, threonine to asparagine followed by 25 amino acids) and a splice donor variant (c.1167+1G>A) that causes exon 9 skipping
    explanation: Truncating and splice alleles in patients, including the splice-donor allele also associated with atrial fibrillation.
  - reference: PMID:41495453
    reference_title: Pathogenetic mechanisms of muscle-specific ribosomes in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Meta-analyses of all 11 cases highlight two prominent features: compound heterozygosity and hotspot missense variants."
    explanation: Pooled analysis of the 11 families known to that study; two later Chinese families (PMID:40820268, PMID:42156347) are not included.
  - reference: PMID:37308880
    reference_title: "Novel compound heterozygous variants in the RPL3L gene causing dilated cardiomyopathy type-2D: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The latter novel variant may result in the absence of protein production with a significant decrease in mRNA level, suggesting it is a loss-of-function mutation.
    explanation: A frameshift allele with reduced mRNA, consistent with a null second allele.
  downstream:

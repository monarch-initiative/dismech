- name: Loss of RPL3L Function from Non-hotspot Alleles
  biological_scale: MOLECULAR
  role: mechanism
  mechanism_confidence: PROVISIONAL
  description: >-
    Non-hotspot missense and truncating alleles appear to remove RPL3L function.
    In AC16 cells these alleles behave like knockout and allow compensatory RPL3
    up-regulation; in mice, Rpl3l deletion likewise leads to retained RPL3
    expression. Loss of function alone does not cause severe disease in mice or
    in humans homozygous for population null alleles.

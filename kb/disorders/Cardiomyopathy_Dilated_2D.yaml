      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: The difference in RPL3 compensation again suggests that the non-hotspot variants R161W and T189M, but not hotspot variants G27D and D308N, are functionally equivalent to RPL3L knockout.
      explanation: In isogenic AC16 cells, the non-hotspot alleles behave as loss of function.
  - target: Hotspot RPL3L Toxic Gain of Function

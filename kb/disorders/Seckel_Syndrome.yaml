name: Seckel syndrome
creation_date: "2026-05-09T14:41:38Z"
description: >-
  Seckel syndrome is a rare autosomal recessive microcephalic primordial
  dwarfism syndrome characterized by prenatal and postnatal growth restriction,
  microcephaly, intellectual disability, and distinctive bird-headed
  craniofacial appearance.
category: Mendelian
parents:
- syndromic disease
- autosomal recessive disease
synonyms:
- SCKL
- Seckel-type dwarfism
- bird-headed dwarfism
disease_term:
  preferred_term: Seckel syndrome
  term:
    id: MONDO:0019342
    label: Seckel syndrome
classifications:
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias". Searching the 2023 table for "Seckel" returns nothing, which
      is a naming artefact rather than an omission: dyadic naming rewrote every
      Seckel row as "Microcephalic osteodysplastic primordial dwarfism,
      <GENE>-related", so the entities are identifiable only by gene and OMIM
      number. Six rows are Seckel syndrome - NOS 21-0110 (ATR, OMIM 210600 =
      Seckel syndrome 1), NOS 21-0120 (RBBP8, 606744 = SCKL2), NOS 21-0130
      (CEP152, 613823 = SCKL5), NOS 21-0140 (DNA2, 615807 = SCKL8), NOS 21-0150
      (TRAIP, 616777 = SCKL9) and NOS 21-0160 (NSMCE2, 617253 = SCKL10). This
      entry is the Seckel umbrella and so is broader than any single row; it is
      also broader than the group, because two of the genes curated here -
      CENPJ (SCKL4, OMIM 613676) and RTTN - appear nowhere in the 2023 table.
      Those two are not evidence of a second group: they are simply entities
      the committee did not list.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Seckel syndrome is genetically heterogeneous but classically follows
    autosomal recessive inheritance due to biallelic pathogenic variants in DNA
    damage response or centrosome-associated genes.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36685824
    reference_title: Two novel variants in CEP152 caused Seckel syndrome 5 in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Background: Seckel syndrome (SCKL) is a rare autosomal recessive inherited disorder, which is mainly characterized by intrauterine and postnatal growth restrictions, microcephaly, intellectual disability, and a typical "bird-head" facial appearance.
    explanation: >-
      This recent family study directly supports autosomal recessive inheritance
      and the major clinical features of Seckel syndrome.
  - reference: PMID:37371259
    reference_title: "Microcephaly, Short Stature, Intellectual Disability, Speech Absence and Cataract Are Associated with Novel Bi-Allelic Missense Variant in RTTN Gene: A Seckel Syndrome Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This novel variant, to the best of our knowledge, is pathogenic and with autosomal recessive inheritance expressed as Seckel syndrome in the affected members of the family.
    explanation: >-
      This case report supports recessive inheritance in another molecularly
      solved Seckel-spectrum family.
pathophysiology:
- name: ATR-related DNA damage checkpoint disruption
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A subset of Seckel syndrome genes affect ATR-dependent DNA damage response
    and replication-stress checkpoint signaling, linking genome-maintenance
    defects to impaired embryonic growth and neurodevelopment. RBBP8/CtIP is
    placed here rather than on the centrosomal arm because it generates the
    single-stranded DNA that ATR activation requires, so its loss disables the
    same checkpoint from one step upstream.
  genes:
  - preferred_term: ATR
    term:
      id: hgnc:882
      label: ATR
  - preferred_term: RBBP8
    term:
      id: hgnc:9891
      label: RBBP8
  biological_processes:
  - preferred_term: DNA damage response
    modifier: ABNORMAL
    term:
      id: GO:0006974
      label: DNA damage response
  - preferred_term: DNA damage checkpoint signaling
    modifier: ABNORMAL
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
  evidence:
  - reference: PMID:37371259
    reference_title: "Microcephaly, Short Stature, Intellectual Disability, Speech Absence and Cataract Are Associated with Novel Bi-Allelic Missense Variant in RTTN Gene: A Seckel Syndrome Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty cases of Seckel syndrome have been reported to date in the literature due to mutations in the ATR, TRAIP, RBBP8, NSMCE2, NIN, CENPJ, DNA2, CEP152 and CEP63 genes.
    explanation: >-
      This supports ATR and other genome-maintenance genes as part of the
      heterogeneous Seckel syndrome gene set.
  - reference: PMID:23166506
    reference_title: "Disruption of mouse Cenpj, a regulator of centriole biogenesis, phenocopies Seckel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, however, genomic instability was not the result of defective ATR-dependent DNA damage signaling, as is the case for the majority of genes associated with Seckel syndrome.
    explanation: >-
      This mouse-model abstract contrasts CENPJ disease with the usual
      ATR-dependent DNA damage signaling mechanism in many Seckel genes, so it
      partially supports this pathway as a recognized Seckel mechanism.
  - reference: PMID:12640452
    reference_title: A splicing mutation affecting expression of ataxia-telangiectasia and Rad3-related protein (ATR) results in Seckel syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A fibroblast cell line derived from an affected individual displays a defective DNA damage response caused by impaired ATR function.
    explanation: >-
      Patient-derived cells with a defective DNA damage response attributable to
      impaired ATR function, which is the direct human evidence for this node.
  - reference: PMID:21998596
    reference_title: CtIP Mutations Cause Seckel and Jawad Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further characterization of cell lines derived from the SCKL2 family revealed defective DNA damage induced formation of single-stranded DNA, a critical co-factor for ATR activation.
    explanation: >-
      Places RBBP8/CtIP loss on this node: SCKL2 cells fail to generate the
      single-stranded DNA that ATR activation depends on.
  downstream:
  - target: Intrauterine growth retardation
    description: Genome-maintenance defects can impair embryonic growth.
  - target: Microcephaly
    description: Checkpoint and replication-stress defects can impair neurodevelopment.
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lens fibre cells are long-lived and replication-stress sensitive;
      reported in the RTTN case, and grouped here with no established route.
  - target: Ischemic stroke
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in this disorder. Grouped here provisionally: a cerebrovascular
      arm is well established in the related PCNT disorder MOPD II, but no
      vasculopathy mechanism has been demonstrated for the Seckel genes.
- name: Centrosome-dependent neural progenitor division impairment
  biological_scale: CELLULAR
  description: >-
    Centrosome and centriole gene defects impair neural progenitor division,
    linking microtubule-organizing center dysfunction to reduced brain and body
    size.

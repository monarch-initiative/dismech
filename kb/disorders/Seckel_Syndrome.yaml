  evidence:
  - reference: PMID:37443841
    reference_title: "Genetic Primary Microcephalies: When Centrosome Dysfunction Dictates Brain and Body Size."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most are caused by biallelic or, more rarely, dominant mutations in one of the likely hundreds of genes encoding PM proteins, i.e., ubiquitous centrosome or microtubule-associated proteins required for the division of neural progenitor cells in the embryonic brain.
    explanation: >-
      This review links primary microcephaly and microcephalic dwarfism to
      centrosome or microtubule proteins needed for neural progenitor division.
  - reference: PMID:37371259
    reference_title: "Microcephaly, Short Stature, Intellectual Disability, Speech Absence and Cataract Are Associated with Novel Bi-Allelic Missense Variant in RTTN Gene: A Seckel Syndrome Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RTTN gene encodes centriole biogenesis, replication, symmetry and cohesion, basal body organization and has recently been associated with the appearance of microcephaly syndromes.
    explanation: >-
      This supports RTTN as a centriole-associated gene relevant to
      microcephaly-spectrum Seckel disease.
  - reference: PMID:22933543
    reference_title: Novel microcephalic primordial dwarfism disorder associated with variants in the centrosomal protein ninein.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the zebrafish, ninein knockdown led to specific and novel defects in the specification and morphogenesis of the anterior neuroectoderm, resulting in a deformity of the developing cranium with a small, squared skull highly reminiscent of the human phenotype.
    explanation: >-
      Places NIN on this node: loss of ninein disrupts anterior neuroectoderm
      specification and cranial growth in vivo.
  - reference: PMID:38154379
    reference_title: "Bi-allelic variants in CEP295 cause Seckel-like syndrome presenting with primary microcephaly, developmental delay, intellectual disability, short stature, craniofacial and digital abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, depletion of CEP295 resulted in a decrease in the numbers of centrioles and centrosomes and triggered p53-dependent G1 cell cycle arrest.
    explanation: >-
      Places CEP295 on this node: its depletion lowers centriole and centrosome
      number and arrests proliferation.
  - reference: PMID:37017437
    reference_title: Expanding the phenotype of Seckel syndrome associated with biallelic loss-of-function variants in CEP63.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to now, 40 patients with molecularly confirmed Seckel syndrome have been reported with biallelic variants in nine genes: ATR, CENPJ, CEP63, CEP152, DNA2, NIN, NSMCE2, RBBP8, and TRAIP.
    explanation: >-
      Confirms CEP63 and NIN as Seckel genes. CEP63 is placed on this node on
      the strength of this confirmation plus its name - HGNC calls it
      "centrosomal protein 63" - rather than on a cited mechanism; no source in
      this entry describes what CEP63 does at the centrosome.
  downstream:
  - target: Intrauterine growth retardation
    description: Impaired developmental cell proliferation contributes to prenatal growth restriction.
  - target: Microcephaly
    description: Impaired neural progenitor division contributes to reduced brain growth.
  - target: Short stature
    description: Global developmental proliferation defects contribute to severe postnatal growth restriction.
  - target: Intellectual disability
    description: >-
      Functional consequence of the reduced cortical neuron output that
      follows progenitor division failure.
  - target: Absent speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the intellectual disability as a neurodevelopmental
      consequence; reported in the RTTN case and not a universal feature.
  - target: Narrow Face
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Craniofacial consequence of the generalized growth deficit; the
      bird-headed profile is the syndrome's defining gestalt but has no established
      mechanism.
  - target: Prominent Nose
    description: >-
      Part of the same craniofacial gestalt, with the same caveat.
- name: CENPJ-associated centriole and mitotic failure
  biological_scale: CELLULAR
  description: >-
    CENPJ disruption impairs centriole and centrosome number control, causes
    abnormal mitotic spindles, DNA damage, apoptosis, and mitotic failure in a
    mouse model that recapitulates Seckel syndrome features.
  genes:
  - preferred_term: CENPJ
    term:
      id: hgnc:17272
      label: CENPJ
  cell_types:
  - preferred_term: embryonic fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: centriole replication
    modifier: ABNORMAL
    term:
      id: GO:0007099
      label: centriole replication
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  - preferred_term: cell division
    modifier: ABNORMAL
    term:
      id: GO:0051301
      label: cell division
  evidence:
  - reference: PMID:23166506
    reference_title: "Disruption of mouse Cenpj, a regulator of centriole biogenesis, phenocopies Seckel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By generating a hypomorphic allele of Cenpj, we have developed a mouse (Cenpj(tm/tm)) that recapitulates many of the clinical features of Seckel syndrome, including intrauterine dwarfism, microcephaly with memory impairment, ossification defects, and ocular and skeletal abnormalities, thus providing clear confirmation that specific mutations of CENPJ can cause Seckel syndrome.
    explanation: >-
      This mouse model supports CENPJ disruption as a causal Seckel syndrome
      mechanism that reproduces key growth and neurologic phenotypes.
  - reference: PMID:23166506
    reference_title: "Disruption of mouse Cenpj, a regulator of centriole biogenesis, phenocopies Seckel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead, Cenpj(tm/tm) embryonic fibroblasts exhibited irregular centriole and centrosome numbers and mono- and multipolar spindles, and many were near-tetraploid with numerical and structural chromosomal abnormalities when compared to passage-matched wild-type cells.
    explanation: >-
      This directly supports abnormal centriole/centrosome control, spindle
      formation, and chromosomal instability as mechanistic consequences of
      Cenpj deficiency.
  - reference: PMID:23166506
    reference_title: "Disruption of mouse Cenpj, a regulator of centriole biogenesis, phenocopies Seckel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Increased cell death due to mitotic failure during embryonic development is likely to contribute to the proportionate dwarfism that is associated with CENPJ-Seckel syndrome.
    explanation: >-
      This supports mitotic failure and increased developmental cell death as a
      downstream route from CENPJ dysfunction to proportionate dwarfism.
  downstream:
  - target: Intrauterine growth retardation
    description: Embryonic mitotic failure contributes to prenatal growth restriction.
  - target: Microcephaly
    description: CENPJ-associated developmental mitotic failure contributes to reduced brain growth.
  - target: Short stature
    description: Persistent growth impairment follows disrupted embryonic cell division.
- name: Replication-stress intolerance in Seckel-spectrum genome maintenance genes
  biological_scale: MOLECULAR
  description: >-
    Three of the Seckel genes act on the replication fork itself rather than on
    the ATR checkpoint that reads it or on the centrosome that divides the cell.
    TRAIP is an E3 ubiquitin ligase recruited to damage during S phase, NSMCE2
    is the SUMO ligase of the SMC5/6 complex, and DNA2 is a
    replication-associated nuclease-helicase. In each, patient or knockdown
    cells tolerate replicative stress poorly, and the resulting limit on
    developmental cell proliferation is the proposed route to the growth and
    brain-size phenotype. The node is kept separate from the ATR node because
    each of the three reports describes its gene acting at the fork itself
    rather than through ATR checkpoint signalling; that is a statement about
    what those reports show, not a claim that no such link exists.
  genes:
  - preferred_term: TRAIP
    term:
      id: hgnc:30764
      label: TRAIP
  - preferred_term: NSMCE2
    term:
      id: hgnc:26513
      label: NSMCE2
  - preferred_term: DNA2
    term:
      id: hgnc:2939
      label: DNA2
  biological_processes:
  - preferred_term: DNA repair
    modifier: ABNORMAL
    term:
      id: GO:0006281
      label: DNA repair
  - preferred_term: replication fork processing
    modifier: ABNORMAL
    term:
      id: GO:0031297
      label: replication fork processing
  evidence:
  - reference: PMID:26595769
    reference_title: TRAIP promotes DNA damage response during genome replication and is mutated in primordial dwarfism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We establish that TRAIP relocalizes to sites of DNA damage, where it is required for optimal phosphorylation of H2AX and RPA2 during S-phase in response to ultraviolet (UV) irradiation, as well as fork progression through UV-induced DNA lesions.
    explanation: >-
      Supports both bound processes for TRAIP: recruitment to DNA damage (DNA
      repair) and the requirement for replication fork progression past lesions
      (replication fork processing).
  - reference: PMID:26595769
    reference_title: TRAIP promotes DNA damage response during genome replication and is mutated in primordial dwarfism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TRAIP is necessary for efficient cell cycle progression and mutations in TRAIP therefore limit cellular proliferation, providing a potential mechanism for microcephaly and dwarfism phenotypes.
    explanation: >-
      States the proposed route from this node to the growth and brain-size
      phenotypes, and is the basis for the downstream edges below.
  - reference: PMID:25105364
    reference_title: Hypomorphism in human NSMCE2 linked to primordial dwarfism and insulin resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, these findings support a role for NSMCE2 in recovery from DNA damage and raise the possibility that loss of its function produces dwarfism through reduced tolerance of replicative stress.
    explanation: >-
      Supports NSMCE2 on this node: a DNA damage recovery role whose loss the
      authors link to dwarfism through poor tolerance of replicative stress.
      Note the authors state this as a possibility rather than a demonstrated
      route.
  - reference: PMID:24389050
    reference_title: Genomic analysis of primordial dwarfism reveals novel disease genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results are highly suggestive that Seckel disease in this family is caused by marked DNA damage sensitivity due to DNA2 mutation.
    explanation: >-
      Supports DNA2 on this node: the authors attribute the family's Seckel
      disease to DNA damage sensitivity produced by the DNA2 variant, which they
      rescued by re-expressing wild-type DNA2 in patient cells.
  downstream:
  - target: Intrauterine growth retardation
    description: >-
      Limited proliferative capacity under replicative stress restricts
      embryonic growth.
  - target: Microcephaly
    description: >-
      The cited mechanism proposed for TRAIP: a limit on cellular proliferation
      reduces brain growth.
  - target: Short stature
    description: >-
      The same proliferative limit persists postnatally as severe growth
      restriction.

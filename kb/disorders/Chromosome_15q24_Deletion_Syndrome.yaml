diagnosis:
- name: Chromosomal microarray analysis
  description: >-
    The karyotype is typically normal; the diagnosis is established by detecting
    a heterozygous copy-number loss at 15q24 by array comparative genomic
    hybridization or SNP array.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Karyotypes are typically normal, and the deletions were detected in these individuals by array comparative genomic hybridization (aCGH)."
    explanation: Chromosomal microarray, not karyotype, detects the deletion.
  - reference: PMID:22359776
    reference_title: "15q24 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis is established by demonstration of a heterozygous deletion at chromosome 15q24, most often involving a 1.1-Mb region between 72.2 and 73.3 Mb of the reference genome (NCBI Build 36 / hg18) using whole-genome and targeted molecular methods that determine the copy number of sequences within the deleted region."
    explanation: GeneReviews diagnostic criterion for establishing the 15q24 deletion.
- name: Brain MRI
  description: >-
    Structural brain anomalies occur in about half of cases, so brain MRI is
    indicated in any individual with an abnormal neurological examination.
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As structural brain anomalies have been reported in approximately half of all of cases of 15q24 deletion, brain magnetic resonance imaging (MRI) studies are indicated in any individual with 15q24 deletion and abnormal neurological examination."
    explanation: Brain MRI is recommended given the frequency of structural brain anomalies.
differential_diagnoses:
- name: Witteveen-Kolk syndrome (SIN3A haploinsufficiency)
  description: >-
    Isolated SIN3A haploinsufficiency causes a neurodevelopmental disorder that
    overlaps the 15q24 deletion phenotype but is a distinct entity with milder,
    gene-specific features and a DNA methylation episignature.
  distinguishing_features:
  - Intragenic SIN3A variant or SIN3A-only deletion rather than a multi-gene 15q24 deletion
  - A SIN3A-specific DNA methylation episignature
  evidence:
  - reference: PMID:36399132
    reference_title: "DNA methylation episignature for Witteveen-Kolk syndrome due to SIN3A haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Witteveen-Kolk syndrome (WITKOS) is a rare, autosomal dominant neurodevelopmental disorder caused by heterozygous loss-of-function alterations in the SIN3A gene."
    explanation: Defines Witteveen-Kolk syndrome as SIN3A haploinsufficiency, distinct from the contiguous-gene deletion.
- name: Other recurrent microdeletion syndromes
  description: >-
    Other submicroscopic recurrent deletions (for example 1q21 and 15q13)
    present with overlapping developmental delay and dysmorphism and are
    distinguished by the chromosomal location of the copy-number change.
  distinguishing_features:
  - The specific deleted interval identified on chromosomal microarray
  evidence:
  - reference: PMID:22180641
    reference_title: "Further clinical and molecular delineation of the 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which occur 8-10 times less frequently than 1q21 or 15q13 microdeletions in our series."
    explanation: Places 15q24 among the recurrent microdeletion syndromes distinguished by locus.

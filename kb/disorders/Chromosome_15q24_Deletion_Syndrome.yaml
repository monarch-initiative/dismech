name: Chromosome 15q24 Deletion Syndrome
category: Chromosomal
creation_date: "2026-10-30T11:04:41Z"
synonyms:
- 15q24 microdeletion syndrome
- 15q24 recurrent microdeletion syndrome
- Chromosome 15q24 microdeletion syndrome
- Del(15)(q24)
- Monosomy 15q24
description: >-
  Chromosome 15q24 deletion syndrome is a rare recurrent contiguous-gene
  microdeletion disorder. The deletions, typically 1.7-6.1 Mb, arise mostly by
  non-allelic homologous recombination (NAHR) between paralogous low-copy
  repeats (segmental duplications) clustered across the 15q24 region, labelled
  LCR15q24A to LCR15q24E; the smallest region of overlap spans roughly 1.1-1.2
  Mb between LCR15q24B and LCR15q24C. Haploinsufficiency of one or more
  dosage-sensitive genes in the deleted interval produces a recognizable
  syndrome of global developmental delay and intellectual disability, growth
  retardation, a distinctive facial appearance (high anterior hairline, broad
  medial eyebrows, hypertelorism, downslanted palpebral fissures, long smooth
  philtrum, full lower lip), digital anomalies, genital anomalies in males,
  joint laxity and hypotonia. Less consistent features include recurrent
  infections, hearing loss, autism spectrum disorder and, rarely, severe
  congenital malformations such as congenital diaphragmatic hernia. Karyotype
  is usually normal and the diagnosis is made by chromosomal microarray. No
  single gene accounts for the phenotype; candidate dosage-sensitive genes in
  the critical region include SIN3A, CSK, STRA6, ARID3B, SEMA7A, CPLX3 and
  CYP11A1. SIN3A haploinsufficiency alone causes the clinically overlapping but
  distinct Witteveen-Kolk syndrome.
disease_term:
  preferred_term: chromosome 15q24 deletion syndrome
  term:
    id: MONDO:0013256
    label: chromosome 15q24 deletion syndrome
parents:
- Contiguous gene deletion syndrome
- Chromosomal deletion syndrome
notes: >-
  The MONDO term for this syndrome is anchored to SIN3A as its causal gene, but
  the recurrent 15q24 deletion is a contiguous-gene disorder spanning many
  genes, and the phenotype is not attributed to any single one; SIN3A is one of
  several candidate dosage-sensitive genes in the critical region. SIN3A
  haploinsufficiency on its own causes Witteveen-Kolk syndrome, a separate MONDO
  concept. The only GeneReviews chapter for this syndrome (PMID:22359776) has
  been retired by its authors and is cited here as the historical expert
  phenotype baseline alongside the primary case series; no current GeneReviews
  chapter exists.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The recurrent 15q24 deletion is heterozygous and acts dominantly through
    haploinsufficiency; most cases are de novo, consistent with origin by NAHR
    between the flanking low-copy repeats.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17360722
    reference_title: "Characterization of a recurrent 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe multiple individuals with mental retardation and overlapping de novo submicroscopic deletions of 15q24 (1.7-3.9 Mb in size)."
    explanation: The 15q24 deletions reported in the original series were de novo heterozygous deletions.
  - reference: PMID:22359776
    reference_title: "15q24 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The 15q24 microdeletion syndrome is inherited in an autosomal dominant manner; however, all known cases have resulted from a de novo deletion."
    explanation: GeneReviews genetic-counseling statement that the syndrome is autosomal dominant but arises de novo.
prevalence:
- population: General population (extrapolated)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.4
  notes: >-
    The incidence is formally unknown; PMID:22216833 extrapolates an approximate
    population figure of 1 in 42,000 from the 15q13/1q21 microdeletion rates. In
    an intellectual-disability/congenital-defect array-CGH referral population a
    rate of about 1 in 1751 was observed.
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the overall incidence of 15q24 microdeletion in the general population may approach approximately 1 in 42,000."
    explanation: Extrapolated population incidence of the 15q24 microdeletion.
  - reference: PMID:22180641
    reference_title: "Further clinical and molecular delineation of the 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which occur 8-10 times less frequently than 1q21 or 15q13 microdeletions in our series."
    explanation: 15q24 deletions are 8-10 times rarer than the 1q21 and 15q13 microdeletions.
genetic:
- name: Recurrent 15q24 contiguous-gene deletion
  association: Causative (heterozygous contiguous-gene deletion)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Breakpoints lie within segmental-duplication (low-copy-repeat) clusters
    LCR15q24A-E, so most deletions arise by NAHR; deletion sizes and exact
    breakpoints vary between patients. The smallest region of overlap
    (~1.1-1.2 Mb between LCR15q24B and LCR15q24C) carries the core cognitive
    phenotype. There is no single causal gene; candidate dosage-sensitive genes
    in the interval include SIN3A, CSK, STRA6, ARID3B, SEMA7A, CPLX3 and
    CYP11A1.
  evidence:
  - reference: PMID:17360722
    reference_title: "Characterization of a recurrent 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-resolution analysis showed that in three patients both proximal and distal breakpoints co-localized to highly identical segmental duplications (>51 kb in length, > 94% identity), suggesting non-allelic homologous recombination as the likely mechanism of origin."
    explanation: Establishes NAHR between segmental duplications as the mechanism generating the recurrent deletion.
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The smallest region of overlap (SRO) spans a 1.2 Mb region between LCR15q24B to LCR15q24C. There are several candidate genes within the SRO, including CYP11A1, SEMA7A, CPLX3, ARID3B, STRA6, SIN3A and CSK, that may predispose to many of the clinical features observed in individuals with 15q24 deletion syndrome."
    explanation: Defines the smallest region of overlap and lists the candidate dosage-sensitive genes.
- name: SIN3A
  association: Candidate dosage-sensitive gene in the critical region
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SIN3A
    term:
      id: hgnc:19353
      label: SIN3A
  notes: >-
    SIN3A lies within the 15q24 critical region and is a transcriptional
    corepressor scaffold. Its isolated haploinsufficiency causes Witteveen-Kolk
    syndrome, which overlaps clinically with the 15q24 deletion but is a
    distinct entity; SIN3A is therefore a candidate contributor to, not the
    sole cause of, the contiguous-gene phenotype.
  evidence:
  - reference: PMID:33437032
    reference_title: "Comprehensive study of 28 individuals with SIN3A-related disorder underscoring the associated mild cognitive and distinctive facial phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Witteveen-Kolk syndrome (OMIM 613406) is a recently defined neurodevelopmental syndrome caused by heterozygous loss-of-function variants in SIN3A."
    explanation: Defines Witteveen-Kolk syndrome as caused by SIN3A loss-of-function, a distinct disorder overlapping the 15q24 deletion phenotype.
- name: CSK
  association: Candidate dosage-sensitive gene in the critical region
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CSK
    term:
      id: hgnc:2444
      label: CSK
  notes: >-
    CSK lies within the smallest region of overlap and is one of the candidate
    dosage-sensitive genes proposed to contribute to the core phenotype.
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are several candidate genes within the SRO, including CYP11A1, SEMA7A, CPLX3, ARID3B, STRA6, SIN3A and CSK, that may predispose to many of the clinical features observed in individuals with 15q24 deletion syndrome."
    explanation: CSK is listed among the candidate genes in the critical region.
- name: STRA6
  association: Candidate dosage-sensitive gene in the critical region
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  gene_term:
    preferred_term: STRA6
    term:
      id: hgnc:30650
      label: STRA6
  notes: >-
    STRA6 (the retinol-binding-protein receptor) lies in the interval; biallelic
    STRA6 mutations cause a separate anophthalmia syndrome, and its presence in
    the deletion is of interest for the eye findings, though a dosage effect is
    not established.
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are several candidate genes within the SRO, including CYP11A1, SEMA7A, CPLX3, ARID3B, STRA6, SIN3A and CSK, that may predispose to many of the clinical features observed in individuals with 15q24 deletion syndrome."
    explanation: STRA6 is listed among the candidate genes in the critical region.
pathophysiology:
- name: Recurrent 15q24 heterozygous deletion
  description: >-
    Non-allelic homologous recombination between the paralogous low-copy repeat
    clusters flanking 15q24 generates a recurrent interstitial deletion of
    1.7-6.1 Mb, removing one copy of every gene in the interval.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletions range in size from 1.7-6.1 Mb and usually result from nonallelic homologous recombination (NAHR) between paralogous low-copy repeats (LCRs)."
    explanation: Describes the recurrent deletion and its NAHR origin.
  downstream:
  - target: Haploinsufficiency of dosage-sensitive genes in the critical region
    causal_link_type: DIRECT
- name: Haploinsufficiency of dosage-sensitive genes in the critical region
  description: >-
    Loss of one copy of the genes in the smallest region of overlap reduces
    their dosage below the threshold needed for normal development. The core
    cognitive phenotype maps to a ~1.1 Mb critical region, with genes just
    distal contributing to facial features, implicating more than one
    dosage-sensitive gene.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: reduced gene expression from hemizygous loci
    modifier: DECREASED
    term:
      id: GO:0010467
      label: gene expression
  evidence:
  - reference: PMID:17360722
    reference_title: "Characterization of a recurrent 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating that this represents a novel syndrome caused by haploinsufficiency of one or more dosage-sensitive genes in the minimal deletion region."
    explanation: Attributes the syndrome to haploinsufficiency of dosage-sensitive genes in the deleted region.
  - reference: PMID:22180641
    reference_title: "Further clinical and molecular delineation of the 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the core cognitive features of the 15q24 microdeletion syndrome, including developmental delays and severe speech problems, are largely due to deletion of genes in a 1.1-Mb critical region."
    explanation: Localizes the core cognitive phenotype to a 1.1 Mb critical region.
  downstream:
  - target: Abnormal neurodevelopment
    causal_link_type: DIRECT
  - target: Abnormal craniofacial morphogenesis
    causal_link_type: DIRECT
  - target: Connective-tissue and skeletal abnormality
    causal_link_type: DIRECT
  - target: Abnormal male genital development
    causal_link_type: DIRECT
  - target: Abnormal growth regulation
    causal_link_type: DIRECT
  - target: Congenital heart defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Abnormal neurodevelopment
  description: >-
    Reduced dosage of critical-region genes disturbs brain development,
    producing developmental delay, intellectual disability, hypotonia and, in a
    subset, autism spectrum disorder.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by growth retardation, intellectual disability, and distinct facial features"
    explanation: Intellectual disability is a core feature of the syndrome.
  - reference: PMID:20678247
    reference_title: "A large-scale survey of the novel 15q24 microdeletion syndrome in autism spectrum disorders identifies an atypical deletion that narrows the critical region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 15q24 microdeletion syndrome has been recently described as a recurrent, submicroscopic genomic imbalance found in individuals with intellectual disability, typical facial appearance, hypotonia, and digital and genital abnormalities."
    explanation: Links the deletion to intellectual disability and hypotonia.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Intellectual disability
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Autistic behavior
    causal_link_type: DIRECT
  - target: Behavioral abnormality
    causal_link_type: DIRECT
  - target: Abnormal corpus callosum morphology
    causal_link_type: DIRECT
  - target: Microcephaly
    causal_link_type: DIRECT
- name: Abnormal craniofacial morphogenesis
  description: >-
    Dosage reduction of critical-region genes disturbs craniofacial
    morphogenesis, giving the recognizable facial gestalt.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinct facial features, including long face with high anterior hairline, epicanthal folds, hypertelorism, downslanting palpebral fissures, sparse and broad medial eyebrows, broad and/or depressed nasal bridge, long smooth philtrum, and small mouth with full lower lip were common in all individuals."
    explanation: Describes the characteristic facial gestalt arising from abnormal craniofacial development.
  downstream:
  - target: Hypertelorism
    causal_link_type: DIRECT
  - target: Downslanted palpebral fissures
    causal_link_type: DIRECT
  - target: High anterior hairline
    causal_link_type: DIRECT
  - target: Broad eyebrow
    causal_link_type: DIRECT
  - target: Long philtrum
    causal_link_type: DIRECT
  - target: Thick lower lip vermilion
    causal_link_type: DIRECT
  - target: Epicanthus
    causal_link_type: DIRECT
  - target: Protruding ear
    causal_link_type: DIRECT
- name: Connective-tissue and skeletal abnormality
  description: >-
    The review proposes an underlying connective-tissue abnormality, manifesting
    as joint laxity, hernias and scoliosis, alongside the skeletal and digital
    anomalies that are the most frequent feature of the syndrome after the
    neurodevelopmental findings.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17360722
    reference_title: "Characterization of a recurrent 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all four individuals share several major features (growth retardation, microcephaly, digital abnormalities, hypospadias and loose connective tissue) and resemble one another facially"
    explanation: Loose connective tissue and digital abnormalities are shared features.
  downstream:
  - target: Joint hypermobility
    causal_link_type: DIRECT
  - target: Digit abnormalities
    causal_link_type: DIRECT
  - target: Clinodactyly
    causal_link_type: DIRECT
  - target: Toe syndactyly
    causal_link_type: DIRECT
  - target: Scoliosis
    causal_link_type: DIRECT
- name: Abnormal male genital development
  description: >-
    Genital anomalies affect a majority of affected males and include
    hypospadias, micropenis and cryptorchidism.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genital abnormalities are reported in a majority of individuals (60%) and include hypospadias, microphallus, and cryptorchidism."
    explanation: Defines the male genital anomalies of the syndrome.
  downstream:
  - target: Hypospadias
    causal_link_type: DIRECT
  - target: Micropenis
    causal_link_type: DIRECT
  - target: Cryptorchidism
    causal_link_type: DIRECT
- name: Abnormal growth regulation
  description: >-
    Prenatal and postnatal growth retardation with short stature and feeding
    difficulties is common, while a subset develop childhood obesity, so growth
    parameters are variable.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22216833
    reference_title: "Chromosome 15q24 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in later childhood, growth parameters were extremely variable with nearly 30% of individuals still exhibiting postnatal growth retardation and short stature, while 17% had obesity."
    explanation: Describes the variable growth phenotype including short stature and obesity.
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: DIRECT
  - target: Obesity
    causal_link_type: DIRECT

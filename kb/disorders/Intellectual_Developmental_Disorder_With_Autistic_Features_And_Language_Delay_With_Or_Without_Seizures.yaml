  - target: mTORC1 and mTORC2 Hyperactivity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The hyperactivity is measured in the heterozygous animal, which is the
      human genotype, and the pharmacological reversal closes the loop.
    limitations: >-
      Measured in mouse brain. No study has measured mTORC1 or mTORC2 activity
      in tissue or cells from a patient with a TANC2 variant, so the signalling
      state of the human disorder is inferred from this model rather than
      observed.
    readouts:
    - name: mTORC1 and mTORC2 activity in developing brain
      target: mTORC1 and mTORC2 Hyperactivity
      direction: INCREASED
      interpretation: >-

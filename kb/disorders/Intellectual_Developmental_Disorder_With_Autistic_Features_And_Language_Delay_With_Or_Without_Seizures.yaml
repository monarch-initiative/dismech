      - reference: PMID:33976205
        reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tanc2-haploinsufficient mice survive but display mTORC1/2
          hyperactivity accompanying synaptic and behavioral deficits reversed
          by mTOR-inhibiting rapamycin
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:33976205
      reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While Tanc2-null mice show embryonic lethality, Tanc2-haploinsufficient
        mice survive but display mTORC1/2 hyperactivity accompanying synaptic

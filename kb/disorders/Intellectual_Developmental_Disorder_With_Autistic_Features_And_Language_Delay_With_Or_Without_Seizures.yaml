- name: tanc2 knockout zebrafish
  species: Zebrafish
  genotype: tanc2 homozygous knockout
  publication: PMID:36534563
  description: >-
    A complete knockout that expands the glutamatergic population selectively
    and shows impaired social preference, increased sleep, anxiolytic behaviour
    and reduced aggression as an adult.
  genes:
  - preferred_term: tanc2
    term:
      id: ZFIN:ZDB-GENE-060130-180
      label: tanc2a
  notes: >-
    The paper calls the gene tanc2; ZFIN's official symbol for it is tanc2a, the
    paralogue-suffixed form, so the paper's name is carried in preferred_term
    and ZFIN's in label. Resolved via the NCBI Gene record for Danio rerio
    tanc2a (NCBIGene:568810) and confirmed against the Alliance on 2026-11-20.
  modeled_mechanisms:
  - target: Glutamatergic Expansion and Excitatory-Inhibitory Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The selective expansion of glutamatergic neurons with GABAergic and
      glycinergic populations unaffected is measured directly in this model.
    limitations: >-
      A homozygous knockout, where the human disease is heterozygous, so the
      dose is not the disease's. The behavioural readouts are also fish
      analogues of social and sleep phenotypes rather than the human cognitive
      and language features.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a complete loss of function and the human disorder is
        haploinsufficiency, so the genotype studied is not the genotype of the
        patients. The direction of the finding is still informative, but its
        magnitude cannot be carried across.
    readouts:
    - name: Glutamatergic, GABAergic and glycinergic neuron population size
      target: Glutamatergic Expansion and Excitatory-Inhibitory Imbalance
      direction: INCREASED
      interpretation: >-
        The selective expansion that defines the imbalance this node asserts.
      evidence:
      - reference: PMID:36534563
        reference_title: Knockout of tanc2 causes autism-like behavior and sleep disturbance in zebrafish.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We observed that the glutamatergic neuron population is significantly
          increased in tanc2 mutants while the GABAergic and the glycinergic
          neurons are not affected, suggesting that an excitatory/inhibitory
          (E/I) imbalance.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:36534563
      reference_title: Knockout of tanc2 causes autism-like behavior and sleep disturbance in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The alterations in these behaviors are phenotypically similar to the ASD
        patients carrying tanc2 mutations.
      explanation: >-
        The authors' own case for the model's relevance to the human phenotype.

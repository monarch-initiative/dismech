- name: TANC2
  gene_term:
    preferred_term: TANC2
    term:
      id: hgnc:30212
      label: TANC2
  relationship_type: CAUSATIVE
  association: Causal variant
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
    evidence:
    - reference: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
      reference_title: "TANC2 / intellectual developmental disorder with autistic features and language delay, with or without seizures (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TANC2 | HGNC:30212 | intellectual developmental disorder with autistic features and language delay, with or without seizures | MONDO:0030051 | AD | Definitive | SOP12 | Intellectual Disability and Autism Gene Curation Expert Panel | 2026-06-22T10:00:00.000Z"
      explanation: >-
        The current ClinGen assertion, re-evaluated under SOP12 on 2026-06-22.
    - reference: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
      reference_title: "TANC2 / intellectual developmental disorder with autistic features and language delay, with or without seizures (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TANC2 is highly constrained for truncating variants (pLI = 1, LOEUF =
        0.17, gnomAD v4.1.1) and also exhibits constraint for missense variants
        (Z score = 4.01).
      explanation: >-
        The population-constraint evidence ClinGen cites, quoted from the source
        rather than re-derived here.
  notes: >-
    De novo missense variants have been reported in neurodevelopmental disorders
    but were not scored by ClinGen for want of experimental evidence of gene
    impact, so this entry treats the disorder as a loss-of-function
    haploinsufficiency condition and does not model a missense mechanism.
    That is a statement about what is scored, not a claim that missense variants
    do nothing. PMID:40110879 reports six de novo variants, four null and two
    missense, and finds the split along severity: the null carriers had the
    severe neurodevelopmental presentations, including developmental and
    epileptic encephalopathy, while the two missense carriers presented with
    epilepsy alone. If that correlation replicates, a missense arm would be a
    separate mechanistic claim from the haploinsufficiency modelled here, and it
    is recorded on the Seizure phenotype rather than built into the pathograph.
    Individual alleles are not transcribed beyond those appearing in quoted
    evidence.

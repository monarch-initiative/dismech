discussions:
- discussion_id: iddalds_mtor_as_a_therapeutic_target
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#mTORC1 and mTORC2 Hyperactivity
  - treatments#
  prompt: >-
    Rapamycin reverses the synaptic and behavioural deficits of the
    Tanc2-haploinsufficient mouse. Is mTOR inhibition a plausible therapy in
    human TANC2 haploinsufficiency, and what would have to be shown first?
  rationale: >-
    This is the only mechanism-directed lead the disorder has, and it is
    unusually well-posed for a scaffold-protein condition: the brake is direct,
    the hyperactivity is demonstrated in the matching genotype, the reversal is
    demonstrated in the same animal, and the inhibition has been shown in human
    neural progenitor cells and neurons rather than mouse alone. What is absent
    is any human data. No interventional trial targets TANC2; the only
    registered study is an observational registry. The gap between a reversible
    mouse phenotype and a developmental disorder diagnosed after the affected
    period is the substantive problem, since the mouse was treated in a
    developing brain.
  evidence:
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tanc2-haploinsufficient mice survive but display mTORC1/2 hyperactivity
      accompanying synaptic and behavioral deficits reversed by mTOR-inhibiting
      rapamycin
    explanation: >-
      The reversal result that makes mTOR inhibition a lead, in the genotype
      that matches the human disease.
- discussion_id: iddalds_last_exon_alleles
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced TANC2 Protein at the Postsynaptic Density
  - pathophysiology#Loss of Direct mTOR Inhibition
  prompt: >-
    Do truncating alleles in TANC2's large last coding exon, which escape
    nonsense-mediated decay and produce a stable protein lacking the C-terminal
    PDZ-binding motif, act through the same mTOR disinhibition as the
    decay-triggering alleles, or by a separate route?
  rationale: >-
    The entry models one mechanism - reduced protein, lost mTOR brake - because
    that is what has been measured. The deep-research report argues that a
    substantial minority of pathogenic truncating alleles fall in the last
    coding exon and so would yield a stable protein retaining the ankyrin and
    TPR repeats but missing the terminal motif that docks TANC2 at the
    postsynaptic density. If that is right, those patients lose the scaffold's
    position rather than its abundance, and the two routes need not converge.
    Nothing in the literature read measures mTOR activity in cells carrying such
    an allele, so the question is open; the report's own analysis is
    computational and is recorded in notes as deep-research output rather than
    as evidence. The experiment is well defined: measure mTORC1/2 activity in
    neurons carrying a last-exon allele against a decay-triggering one.
  evidence:
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Here, we show a direct, regulated inhibition of mTOR by Tanc2, an
      adaptor/scaffolding protein with strong neurodevelopmental and psychiatric
      implications.
    explanation: >-
      Establishes the mTOR route for the disorder as a whole. It says nothing
      about last-exon alleles specifically, which is precisely the gap.
- discussion_id: iddalds_single_cohort_denominator
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Intellectual disability
  - phenotypes#Seizure
  prompt: >-
    Every reported frequency for this disorder traces to one 20-patient cohort.
    What is the phenotype spectrum in an independently ascertained series?
  rationale: >-
    The phenotype rows here give proportions out of 20, and all of the HPO
    annotations for the OMIM entry derive from the same cohort, so the apparent
    frequencies carry no independent replication and wide uncertainty. The
    cohort was also assembled partly by prioritising autism candidate genes and
    by matchmaking on a neurodevelopmental diagnosis, so the ascertainment
    favours exactly the features that define the entity. Subsequent reports are
    single cases that extend the spectrum rather than sample it. No prevalence
    record is written in this entry for that reason.
  evidence:
  - reference: PMID:31616000
    reference_title: Disruptive mutations in TANC2 define a neurodevelopmental syndrome associated with psychiatric disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present detailed clinical and genetic data for 20 patients with
      likely gene-disrupting mutations in TANC2-whose protein product interacts
      with multiple PSD proteins.
    explanation: >-
      Establishes the size of the single series every frequency rests on.

name: Intellectual Developmental Disorder With Autistic Features And Language Delay With Or Without Seizures
creation_date: "2026-11-20T14:20:00Z"
category: Mendelian
synonyms:
- IDDALDS
- TANC2-related neurodevelopmental disorder
- TANC2 haploinsufficiency
description: >-
  An autosomal dominant neurodevelopmental disorder (IDDALDS) caused by
  heterozygous loss-of-function variants in TANC2, which encodes a large
  postsynaptic density scaffolding protein. The clinical core is intellectual
  disability, delayed speech and language development and autistic behaviour,
  with epilepsy in about half of reported patients - which is what the "with or
  without seizures" clause in the disease name records. Adult probands and
  carrier parents more often show complex psychiatric or behavioural problems
  than the childhood presentation suggests.
  The mechanism is haploinsufficiency acting through mTOR. TANC2 binds mTOR
  directly and inhibits both mTORC1 and mTORC2; complete loss is embryonic
  lethal in mouse, while the haploinsufficient mouse survives and shows
  mTORC1/2 hyperactivity with synaptic and behavioural deficits that rapamycin
  reverses. Downstream, the zebrafish knockout selectively expands the
  glutamatergic neuron population while leaving GABAergic and glycinergic
  populations intact, which is an excitatory/inhibitory imbalance, and
  Drosophila knockdown has been reported to raise seizure susceptibility,
  though an earlier knockdown in the same organism found no seizure-like
  behaviour and the entry records both. TANC2 also recruits
  KIF1A-transported dense core vesicles to postsynaptic sites, a second
  synaptic function lost with the protein.
  Two things about the evidence base shape how this entry is written. The human
  arm rests almost entirely on a single 20-patient cohort, so every reported
  frequency has a denominator between 9 and 20; and the steps from
  excitatory/inhibitory imbalance to the cognitive, language and social
  phenotype are inferred from parallel animal behaviour rather than from human
  neurophysiology, so they are not drawn as causal edges.
notes: >-
  Name. The entry keeps the MONDO and OMIM descriptive title rather than a
  gene-related dyad, and the decision was made by checking rather than by
  preference. The entry-naming skill's scope test is arguably failed by this
  label, since a patient can have intellectual disability, autistic features
  and language delay without a TANC2 variant. But rule 2 only allows a
  `<GENE>-Related <Phenotype>` name where one is established, and none is:
  MONDO:0030051's only exact synonyms are "IDDALDS" and casing variants of the
  descriptive label (checked against OLS on 2026-11-20); there is no
  GeneReviews chapter; ClinGen's own disease name for the pair is the
  descriptive label; and OMIM 618906 carries it too. The primary literature
  describes rather than names the entity - "Disruptive mutations in TANC2
  define a neurodevelopmental syndrome associated with psychiatric disorders".
  Rule 7 then applies: where nothing is established, keep a clear existing name
  and do not coin a dyad. "TANC2-related neurodevelopmental disorder" is kept in
  `synonyms` so the search works, but it is dismech's phrasing, not a
  established name, and it is not used as the entry name.
  No GeneReviews chapter. Checked offline against the committed Bookshelf index
  (cache/bookshelf/genereviews.csv, snapshot 2026-09-10, 958 chapters) for
  "TANC2", "autistic" and "language delay": no current or retired chapter
  matches, and there is no gene-scoped TANC2 chapter. Phenotype content comes
  from the primary cohort instead.
  Frequencies are not recorded as prevalence figures. The cohort reports
  intellectual disability in 19 of 20 patients, language delay in 18 of 20,
  autistic behaviour in 15 of 20 and seizures in 11 of 20. Those are
  proportions within one ascertained series, not population frequencies, and
  all 19 HPO annotations for OMIM:618906 trace to that single cohort. They are
  described in the phenotype rows rather than written into `prevalence`, which
  would imply a population denominator this disease does not have.
  Only one phenotype has an inbound causal edge, and adding the cohort features
  made that ratio worse rather than better. Seizure is wired from the
  excitatory-inhibitory imbalance. Nothing else is: the cohort counts ataxia,
  strabismus, scoliosis, hypotonia, foot and chest deformities,
  craniosynostosis, joint hypermobility and constipation without proposing a
  mechanism for any of them, and the route from the imbalance to the cognitive,
  language and social phenotype is inferred from animal behaviour rather than
  measured in humans. Wiring those rows to the imbalance node would put an
  inference in the graph that no cited source makes, which is worse than leaving
  them unexplained. So this entry's phenotype connectivity is low by
  construction, and it fell when the required rows were added - an entry that
  records more of what was observed scores worse on that metric than one that
  records less. The rows are still right to have: a reader looking for whether
  scoliosis belongs to this syndrome should find the answer and its denominator.
  The gene is grounded on a scaffold's molecular function, not an enzymatic one.
  just check-gene-activity-grounding asks that a gene be grounded on the node it
  lands on, and TANC2 has no catalytic activity to name. GO:0060090 molecular
  adaptor activity is bound rather than a baseline exemption taken, because the
  sources name the function in those words: PMID:33976205 calls Tanc2 "an
  adaptor/scaffolding protein" and "a large (~200 kDa) multi-domain
  adaptor/scaffolding protein". The postsynaptic specificity is in
  preferred_term. GO:0140378 protein complex scaffold activity was the
  alternative and was not chosen, because the adaptor wording is the one the
  cited papers use.
  Two reported features are deliberately absent. Sleep disturbance appears in
  the cohort only as plus and minus marks in a per-patient table, with no prose
  sentence stating a count, so there is nothing to quote; the deep-research
  report's figure of 38% is its own reading of that table and is not used.
  Stereotypies, altered gait and autonomic dysfunction are named in the cohort's
  discussion without counts. Each would need a quotable sentence that gives a
  numerator, and none exists in the cached text.
  Terms not taken from the deep-research report. Its term validation recorded 8
  of 84 checked labels as mismatched, and as with the FARIMPD report in this
  same batch, every NCIT term it proposed was wrong: NCIT:C29236 offered as
  "Oxcarbazepine" is Murine Monoclonal Antibody (LYM-1), NCIT:C938 as "Sodium
  valproate" is Vitamin A Compound, NCIT:C28995 as "Felbamate monotherapy" is
  Diphenoxylate Hydrochloride, NCIT:C94628 as "Ketogenic diet" is Third-Line
  Therapy, NCIT:C15277 as "Behavioural intervention for autism" is Mastectomy,
  NCIT:C15313 as "Constipation management" is Radiation Therapy, and NCIT:C15346
  as "Occupational therapy" and "Physical therapy" is Vaccination - the same
  wrong identifier the FARIMPD report offered for "Physical therapy". None was
  used. Every CURIE here was read from the committed term caches or resolved
  against OLS in the step it was written.
  Deep-research provenance. The OpenScientist report contributed the gnomAD v4
  constraint figures (26 observed loss-of-function alleles against 210.5
  expected, o/e 0.124, LOEUF 0.17, pLI 1.00), the ClinVar allele breakdown, the
  observation that 29% of pathogenic truncating alleles fall in the unusually
  large last coding exon and so escape nonsense-mediated decay while deleting
  the C-terminal class I PDZ-binding motif, and a penetrance argument from the
  gap between a predicted de novo rate and the frequency of
  decay-triggering alleles in gnomAD adults. Those are database-derived or
  computed in the report rather than claims from a citable publication, and were
  not independently re-derived in this session, so they are recorded here as
  deep-research output and are not used as evidence items. The last-exon
  argument is a genuinely interesting lead and is carried as a knowledge gap
  rather than as a second mechanism branch, because no study has measured mTOR
  activity in cells carrying such an allele.

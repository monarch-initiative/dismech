pathophysiology:
- name: Heterozygous TANC2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  description: >-
    One TANC2 allele lost to a frameshift, nonsense, canonical splice or
    exon-deletion variant, or to a 17q23.3 copy-number deletion that removes the
    gene. ClinGen's curation counts twenty-one such variants across twenty-two
    probands.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TANC2
    term:
      id: hgnc:30212
      label: TANC2
  evidence:
  - reference: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
    reference_title: "TANC2 / intellectual developmental disorder with autistic features and language delay, with or without seizures (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Twenty-one loss-of-function variants (frameshift, nonsense, splice, and
      exon deletion) that have been reported in 22 probands in 4 publications
    explanation: >-
      ClinGen's allele and proband census for this gene-disease pair.
  - reference: PMID:33160097
    reference_title: "17q23.3 de novo microdeletion involving only TANC2 gene: A new case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a new case of TANC2 gene disruption in a 17q23.3 de novo
      microdeletion identified by array-CGH.
    explanation: >-
      A whole-gene deletion case, which is what establishes that losing the gene
      outright is sufficient rather than requiring a specific truncated product.
  downstream:
  - target: Reduced TANC2 Protein at the Postsynaptic Density
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Nonsense-mediated decay of the mutant transcript for premature stops outside the last coding exon
    description: >-
      Haploinsufficiency: one functional allele remains, and the mutant
      transcript is largely degraded, so less TANC2 protein reaches the
      postsynaptic density.
    evidence:
    - reference: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
      reference_title: "TANC2 / intellectual developmental disorder with autistic features and language delay, with or without seizures (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mechanism of pathogenicity is haploinsufficiency.
      explanation: ClinGen states the mechanism directly.
- name: Reduced TANC2 Protein at the Postsynaptic Density
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  description: >-
    Less of the TANC2 scaffold at excitatory postsynaptic sites. TANC2 is a
    large multi-domain adaptor expressed mainly in brain, present at synaptic
    and non-synaptic sites, and interacting directly with PSD-95.
  cellular_components:
  - preferred_term: postsynaptic density
    term:
      id: GO:0014069
      label: postsynaptic density
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:31616000
    reference_title: Disruptive mutations in TANC2 define a neurodevelopmental syndrome associated with psychiatric disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report genetic and clinical data for 20 individuals with disruptive
      mutations in TANC2, a gene encoding a synaptic scaffold protein
      interacting with multiple ASD and other neuropsychiatric disorder-related
      postsynaptic density (PSD) proteins in dendrites
    explanation: >-
      Identifies TANC2 as a postsynaptic density scaffold and names the
      interaction partners the node depends on.
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Synaptic Tanc2 directly interacts with PSD-95
    explanation: >-
      States the PSD-95 interaction that places the protein at the postsynaptic
      density. Quoted from the paper's introduction, where it restates earlier
      work rather than a result of this study.
  downstream:
  - target: Loss of Direct mTOR Inhibition
    causal_link_type: DIRECT
    description: >-
      TANC2 binds mTOR and inhibits it, so less TANC2 means less inhibition.
    evidence:
    - reference: PMID:33976205
      reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show a direct, regulated inhibition of mTOR by Tanc2, an
        adaptor/scaffolding protein with strong neurodevelopmental and
        psychiatric implications.
      explanation: >-
        Establishes the direct inhibition that this edge removes.
  - target: Loss of KIF1A Dense Core Vesicle Capture at Spines
    causal_link_type: DIRECT
    description: >-
      TANC2, with liprin-alpha, recruits KIF1A-transported dense core vesicles
      to postsynaptic sites; losing the scaffold removes that capture.
    evidence:
    - reference: PMID:30021165
      reference_title: "Regulation of KIF1A-Driven Dense Core Vesicle Transport: Ca(2+)/CaM Controls DCV Binding and Liprin-α/TANC2 Recruits DCVs to Postsynaptic Sites."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast, liprin-α and TANC2 are not part of the KIF1A-cargo complex
        but capture DCVs at dendritic spines.
      explanation: >-
        Establishes the capture function that is lost, and places it at the
        spine rather than on the cargo.
- name: Loss of Direct mTOR Inhibition
  biological_scale: MOLECULAR
  node_class: SIGNALLING_INCREASED
  description: >-
    The TANC2 brake on mTOR is released. TANC2 inhibits both mTORC1 and mTORC2,
    in mouse brain and in human neural progenitor cells and neurons, so the loss
    is not a mouse-only phenomenon.
  biological_processes:
  - preferred_term: negative regulation of TOR signaling
    modifier: DECREASED
    term:
      id: GO:0032007
      label: negative regulation of TOR signaling
  evidence:
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lastly, Tanc2 inhibits mTORC1/2 in human neural progenitor cells and
      neurons.
    explanation: >-
      Establishes the inhibition in human cells, which is what makes the mouse
      result translatable.
  downstream:
  - target: mTORC1 and mTORC2 Hyperactivity
    causal_link_type: DIRECT
    description: >-
      With the brake gone, both complexes are hyperactive in the
      haploinsufficient animal.
    evidence:
    - reference: PMID:33976205
      reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While Tanc2-null mice show embryonic lethality, Tanc2-haploinsufficient
        mice survive but display mTORC1/2 hyperactivity accompanying synaptic
        and behavioral deficits reversed by mTOR-inhibiting rapamycin.
      explanation: >-
        Demonstrates the hyperactivity in the genotype that matches the human
        disease, and its reversal by rapamycin.
- name: mTORC1 and mTORC2 Hyperactivity
  biological_scale: CELLULAR
  node_class: SIGNALLING_INCREASED
  description: >-
    Both mTOR complexes run above their normal level in the haploinsufficient
    brain. This is the node a therapy would target, and the one rapamycin acts
    on in the mouse.
  biological_processes:
  - preferred_term: TORC1 signaling
    modifier: INCREASED
    term:
      id: GO:0038202
      label: TORC1 signaling
  - preferred_term: TORC2 signaling
    modifier: INCREASED
    term:
      id: GO:0038203
      label: TORC2 signaling
  evidence:
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tanc2-haploinsufficient mice survive but display mTORC1/2 hyperactivity
      accompanying synaptic and behavioral deficits reversed by
      mTOR-inhibiting rapamycin
    explanation: Demonstrates the hyperactivity and its reversibility.
  downstream:
  - target: Altered Dendritic Spine and Excitatory Synapse Development
    causal_link_type: DIRECT
    description: >-
      Synaptic deficits accompany the hyperactivity and are reversed with it.
    evidence:
    - reference: PMID:33976205
      reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mTORC1/2 hyperactivity accompanying synaptic and behavioral deficits
        reversed by mTOR-inhibiting rapamycin
      explanation: >-
        Links the synaptic deficits to the hyperactivity by their shared
        reversal, which is the strongest form the cited evidence takes.
- name: Altered Dendritic Spine and Excitatory Synapse Development
  biological_scale: CELLULAR
  node_class: MORPHOGENESIS_MIGRATION_AND_POSITIONING
  description: >-
    Dendritic spine and excitatory synapse development is disturbed. The TANC
    family's PDZ-binding C terminus is required for these proteins to increase
    spine and synapse density, so both the reduced-protein route and the
    motif-deleting route converge here.
  biological_processes:
  - preferred_term: dendritic spine development
    modifier: DECREASED
    term:
      id: GO:0060996
      label: dendritic spine development
  - preferred_term: synapse organization
    modifier: DECREASED
    term:
      id: GO:0050808
      label: synapse organization
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:33976205
    reference_title: Tanc2-mediated mTOR inhibition balances mTORC1/2 signaling in the developing mouse brain and human neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      also promotes synaptic capture of motor protein-transported vesicles
    explanation: >-
      States the synaptic role of the protein alongside its scaffolding
      function. Quoted from the paper's introduction, restating earlier work.
  downstream:
  - target: Glutamatergic Expansion and Excitatory-Inhibitory Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The zebrafish knockout expands the glutamatergic population selectively.
      The step from altered spine and synapse development to a change in
      population size is not established, and the intermediates are not known.
    evidence:
    - reference: PMID:36534563
      reference_title: Knockout of tanc2 causes autism-like behavior and sleep disturbance in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        We observed that the glutamatergic neuron population is significantly
        increased in tanc2 mutants while the GABAergic and the glycinergic
        neurons are not affected, suggesting that an excitatory/inhibitory (E/I)
        imbalance.
      explanation: >-
        Demonstrates the selective expansion in a complete knockout. The route
        from the spine phenotype to it is inferred, so the edge is graded
        indirect with unknown intermediates.
- name: Glutamatergic Expansion and Excitatory-Inhibitory Imbalance
  biological_scale: TISSUE
  node_class: NEURAL_CIRCUIT_AND_NETWORK_DYSFUNCTION
  description: >-
    More glutamatergic neurons with GABAergic and glycinergic populations
    unchanged, shifting the balance of the circuit toward excitation. Shown in
    the zebrafish knockout, which is a complete loss rather than the human
    heterozygous state.
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  evidence:
  - reference: PMID:36534563
    reference_title: Knockout of tanc2 causes autism-like behavior and sleep disturbance in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of tanc2 increases the larval brain size and body length by promoting
      proliferation and inhibiting apoptosis.
    explanation: >-
      The proliferative change that underlies the population expansion in this
      model.
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased network excitability from the shifted excitatory-inhibitory balance
    description: >-
      Raised seizure susceptibility, demonstrated by TANC2 knockdown in
      Drosophila and manifesting clinically as epilepsy in about half of
      reported patients.
    evidence:
    - reference: CGGV:assertion_b3d3d067-5a78-44b4-9c57-25cc784123bf-2026-06-22T100000.000Z
      reference_title: "TANC2 / intellectual developmental disorder with autistic features and language delay, with or without seizures (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pediatric patients present with delayed language and motor development,
        intellectual disability, autism, and variable epilepsy and facial
        dysmorphic features.
      explanation: >-
        Records epilepsy as a variable feature of the clinical picture, which is
        the human end of this edge.
- name: Loss of KIF1A Dense Core Vesicle Capture at Spines
  biological_scale: CELLULAR
  node_class: PROTEIN_TRAFFICKING_AND_LOCALIZATION
  description: >-
    Dense core vesicles carried by the KIF1A motor are no longer captured at
    postsynaptic sites. A second synaptic function of TANC2, parallel to the
    mTOR brake, and one that specific patient mutations abolish.
  cellular_components:
  - preferred_term: postsynaptic density
    term:
      id: GO:0014069
      label: postsynaptic density
  evidence:
  - reference: PMID:30021165
    reference_title: "Regulation of KIF1A-Driven Dense Core Vesicle Transport: Ca(2+)/CaM Controls DCV Binding and Liprin-α/TANC2 Recruits DCVs to Postsynaptic Sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we found that specific TANC2 mutations-reported in patients
      with different neuropsychiatric disorders-abolish the interaction with
      KIF1A.
    explanation: >-
      The strongest form of this claim: patient-derived TANC2 mutations abolish
      the KIF1A interaction, which ties the capture defect to the disease rather
      than leaving it a property of the wild-type protein.
  notes: >-
    No causal edge leaves this node. The function is established and its loss
    follows from losing the scaffold, but nothing in the sources read connects
    it to a specific clinical feature of this disorder, so it is left as a
    terminal mechanistic branch rather than wired to a phenotype on inference.

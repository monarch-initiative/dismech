animal_models:
- name: Setx knockout mouse
  species: Mouse
  genotype: Setx knockout (Setx-/-, Cre-LoxP deletion of exon 4)
  publication: PMID:23593030
  description: >-
    The only published constitutive Setx-null mouse. It is a good model of the meiotic arm
    of senataxin function and not a model of the disease: the animals are male-infertile
    with a pachytene-stage block, and they have no ataxia, no cerebellar degeneration and no
    Purkinje cell loss.
  modeled_mechanisms:
  - target: Failure of Meiotic Recombination and Sex Chromosome Inactivation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the meiotic phenotype in full, and it is where the mechanism was
      originally worked out; the human testicular histology was subsequently matched to it.
    evidence:
    - reference: PMID:23593030
      reference_title: Senataxin plays an essential role with DNA damage response proteins in meiotic recombination and gene silencing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate that senataxin is essential for spermatogenesis and that it
        functions at two stages in meiosis during crossing-over in homologous recombination
        and in meiotic sex chromosome inactivation (MSCI).
      explanation: >-
        States the meiotic functions the model establishes.
  - target: Purkinje Cell Degeneration in the Cerebellar Cortex
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete loss of Setx in the mouse produces no cerebellar degeneration and no ataxia,
      so the model cannot be used to study the neurodegenerative arm of AOA2.
    limitations: >-
      The negative result is not a matter of degree or of age at assessment: neither
      structural cerebellar change nor Purkinje cell loss was detectable, and behavioural
      scoring found no difference from wild type. Any inference about AOA2
      neurodegeneration made in this model is therefore unsupported, which is why
      patient-derived iPSC neural progenitors were developed instead.
    evidence:
    - reference: PMID:26231220
      reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Recent disruption of the Setx gene in mice did not lead to neurobehavioral defects
        or neurodegeneration, making it difficult to study the etiology of AOA2.
      explanation: >-
        States the negative neurological result and its consequence for modelling.
    - reference: PMID:30778901
      reference_title: Disruption of Spermatogenesis and Infertility in Ataxia with Oculomotor Apraxia Type 2 (AOA2).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Disruption of the SETX gene in mice failed to recapitulate the neurological
        phenotype seen in human patients
      explanation: >-
        Independent restatement of the same negative result.
  - target: Defective R-Loop Resolution at Transcription Pause Sites
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      R-loops accumulate in Setx-null tissue, but only where cells are proliferating. The
      brain of the same animals shows none.
    limitations: >-
      The tissue restriction is the whole point: R-loop accumulation was demonstrated in
      testis and in proliferating cells in vitro and in vivo, and was absent from the brains
      of Setx-null mice. A model of R-loop accumulation in this system is a model of a
      proliferating-cell phenomenon, and cannot be transferred to post-mitotic neurons.
    evidence:
    - reference: PMID:24637776
      reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Depletion of Setx led to high basal levels of R-loops and these were enhanced
        further by DNA damage both in vitro and in vivo in tissues with proliferating cells.
      explanation: >-
        The positive half of the result, in proliferating tissue.
    - reference: PMID:24637776
      reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There was no evidence for accumulation of R-loops in the brains of mice where Setx,
        Atm, Tdp1 or Aptx genes were disrupted.
      explanation: >-
        The negative half, in brain, which is why the link is partial rather than full.
  evidence:
  - reference: PMID:23593030
    reference_title: Senataxin plays an essential role with DNA damage response proteins in meiotic recombination and gene silencing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Senataxin, mutated in the human genetic disorder ataxia with oculomotor apraxia type
      2 (AOA2), plays an important role in maintaining genome integrity by coordination of
      transcription, DNA replication, and the DNA damage response.
    explanation: >-
      Establishes what the model was built to test and the function it reports on.

experimental_models:
- name: AOA2 patient iPSC-derived neural progenitors
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: patient-derived iPSC
  publication: PMID:26231220
  description: >-
    Neural progenitors differentiated from iPSCs reprogrammed from an AOA2 patient's
    fibroblasts, with a control line. Built specifically because the knockout mouse does not
    degenerate, this is currently the only neuronal system in which the AOA2 cellular
    phenotype has been shown.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Accumulation of Unrepaired DNA Double-Strand Breaks
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the oxidative damage, double-strand break burden, R-loop accumulation and
      damage-induced cell death of AOA2 in a human neural cell type.
    limitations: >-
      Neural progenitors are proliferating cells, so they do not answer the question the
      mouse data raised about whether the same phenotype occurs in post-mitotic neurons; and
      the system rests on a single patient line and a single control.
    evidence:
    - reference: PMID:26231220
      reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        AOA2 iPSC and neural progenitors exhibit increased levels of oxidative damage, DNA
        double-strand breaks, increased DNA damage-induced cell death and R-loop
        accumulation.
      explanation: >-
        Lists the cellular phenotypes the model reproduces, including the one this link
        targets.
  evidence:
  - reference: PMID:26231220
    reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To develop a more relevant neuronal model to study neurodegeneration in AOA2, we
      derived neural progenitors from a patient with AOA2 and a control by induced
      pluripotent stem cell (iPSC) reprogramming of fibroblasts.
    explanation: >-
      Describes the model system and why it was built.

differential_diagnoses:
- name: Ataxia-telangiectasia
  description: >-
    The closest mimic and the one that must be excluded first, because it shares the raised
    AFP, the recessive inheritance, the cerebellar ataxia and the oculomotor apraxia. It
    differs in what matters clinically: telangiectasia, immunodeficiency, chromosomal
    instability, radiosensitivity and a large cancer risk, none of which occurs in AOA2.
    AFP concentration helps — above 65 microg/L points to ataxia-telangiectasia — as does
    the finding that AOA2 patients have normal liver enzymes and imaging where
    ataxia-telangiectasia patients frequently do not.
  distinguishing_features:
  - Oculocutaneous telangiectasia, absent in AOA2
  - Immunodeficiency and cancer predisposition, absent in AOA2
  - Cellular radiosensitivity; AOA2 cells are sensitive to oxidative agents but not to ionizing radiation
  - Higher AFP concentrations, typically above 65 microg/L
  disease_term:
    preferred_term: ataxia telangiectasia
    term:
      id: MONDO:0008840
      label: ataxia telangiectasia
  evidence:
  - reference: PMID:29127364
    reference_title: "Comparing ataxias with oculomotor apraxia: a multimodal study of AOA1, AOA2 and AT focusing on video-oculography and alpha-fetoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific distinctive alpha-fetoprotein thresholds were determined for AOA1 (7-15
      µg/L), AOA2 (15-65 µg/L) and AT (>65 µg/L).
    explanation: >-
      Gives the biochemical thresholds that separate the three conditions.
  - reference: PMID:40255955
    reference_title: "Is high AFP associated with liver diseases in ataxia-telangiectasia and ataxia-oculomotor apraxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While 69% (9/13) of AT patients had elevated liver enzymes and 56% (5/9) had abnormal
      liver imaging, both were normal in all AOA2 patients.
    explanation: >-
      A laboratory discriminator between the two AFP-raising ataxias.
- name: Ataxia with oculomotor apraxia type 1
  disease_term:
    preferred_term: ataxia with oculomotor apraxia type 1
    term:
      id: MONDO:0008842
      label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
  description: >-
    The other AOA at the same clinical crossroads, caused by biallelic APTX variants. It
    starts earlier, its biochemical markers are hypoalbuminaemia and hypercholesterolaemia
    rather than AFP, and where AFP is raised at all it sits in a lower band. dismech curates
    it separately.
  distinguishing_features:
  - Earlier onset than AOA2
  - Hypoalbuminaemia and hypercholesterolaemia as the characteristic markers
  - AFP normal or only modestly raised, in the 7-15 microg/L band
  - Caused by APTX, a single-strand break repair protein, not by SETX
  evidence:
  - reference: PMID:23941260
    reference_title: SETX mutations are a frequent genetic cause of juvenile and adult onset cerebellar ataxia with neuropathy and elevated serum alpha-fetoprotein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOA1 (MIM 208920) is characterized by early onset cerebellar ataxia, neuropathy,
      mental retardation, hypoalbuminemia and hypercholesterolemia.
    explanation: >-
      Gives the AOA1 features that separate it from AOA2.
- name: Ataxia with oculomotor apraxia type 4
  disease_term:
    preferred_term: ataxia with oculomotor apraxia type 4
    term:
      id: MONDO:0014557
      label: ataxia - oculomotor apraxia type 4
  description: >-
    Recessive AOA caused by PNKP variants, described in a Portuguese population survey and
    named as an explicit exclusion in the GeneReviews diagnostic pathway. Like AOA1 and
    AOA2 it is a DNA-repair ataxia, so the mechanistic family does not distinguish it; the
    gene does.
  distinguishing_features:
  - Caused by biallelic PNKP variants
  - Allelic with a microcephaly-seizures-developmental delay syndrome (MCSZ)
  evidence:
  - reference: PMID:25728773
    reference_title: Mutations in PNKP cause recessive ataxia with oculomotor apraxia type 4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of PNKP mutations associated with recessive AOA extends the phenotype
      associated with this gene and identifies a fourth locus that causes AOA.
    explanation: >-
      Establishes AOA4 as a distinct locus in the same clinical group.
- name: Juvenile amyotrophic lateral sclerosis type 4
  disease_term:
    preferred_term: amyotrophic lateral sclerosis type 4
    term:
      id: MONDO:0011223
      label: amyotrophic lateral sclerosis type 4
  description: >-
    The dominant allelic disorder at SETX, curated separately in dismech as juvenile
    amyotrophic lateral sclerosis. It is a motor neuron disease with pyramidal signs and
    distal weakness, not a cerebellar ataxia, and it has no AFP elevation. The distinction
    is not only clinical: the AOA2 alleles abolish senataxin sumoylation and its exosome
    interaction while the ALS4 alleles do not, and the two allele classes perturb different
    gene sets. Families combining features of both have been described, so the boundary is
    not absolute.
  distinguishing_features:
  - Autosomal dominant, not recessive
  - Motor neuron disease phenotype rather than cerebellar ataxia
  - Serum alpha-fetoprotein not elevated
  - Disease alleles retain senataxin sumoylation and Rrp45 binding
  evidence:
  - reference: PMID:25054092
    reference_title: "SETX sumoylation: A link between DNA damage and RNA surveillance disrupted in AOA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, we showed that AOA2 but not ALS4 mutations prevented both SETX
      sumoylation and the Rrp45 interaction.
    explanation: >-
      The molecular discriminator between the two allelic diseases.
  - reference: PMID:18350359
    reference_title: "\"Pseudodominant inheritance\" of ataxia with ocular apraxia type 2 (AOA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically this family presented with a phenotype combining typical features of AOA2
      and ALS4; thus extending the phenotypic spectrum of SETX mutations.
    explanation: >-
      Records a family in which the clinical boundary between the two was blurred.
- name: Friedreich ataxia
  disease_term:
    preferred_term: Friedreich ataxia
    term:
      id: MONDO:0100339
      label: Friedreich ataxia
  description: >-
    The commonest recessive ataxia and the first alternative considered in any young patient
    with ataxia and areflexia. It is excluded before AFP is even measured in the standard
    diagnostic scheme; cerebellar atrophy is much less prominent than in AOA2 and AFP is
    normal.
  distinguishing_features:
  - Caused by an FXN repeat expansion
  - Extensor plantar reflexes and prominent proprioceptive loss without marked cerebellar atrophy
  - Serum alpha-fetoprotein normal
  - Cardiomyopathy and diabetes, which do not occur in AOA2
  evidence:
  - reference: PMID:19440741
    reference_title: "Epidemiological, clinical, paraclinical and molecular study of a cohort of 102 patients affected with autosomal recessive progressive cerebellar ataxia from Alsace, Eastern France: implications for clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensor plantar reflexes were rarer and cerebellar atrophy was more frequent in the
      group of patients with a known non-Friedreich ARCA compared to all other patients (p
      < 0.0001 and p = 0.0003, respectively).
    explanation: >-
      Gives the two examination findings that separate Friedreich ataxia from the
      non-Friedreich recessive ataxias including AOA2.

discussions:
- discussion_id: setx_null_mouse_lacks_the_neurodegeneration
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can a Setx knockout mouse be used to study AOA2 neurodegeneration, when complete loss
    of Setx in the mouse produces no ataxia, no cerebellar degeneration and no Purkinje cell
    loss?
  attaches_to:
  - pathophysiology#Purkinje Cell Degeneration in the Cerebellar Cortex
  - pathophysiology#Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
  - animal_models#Setx knockout mouse
  rationale: >-
    This is the central translational problem of the disease. The mouse reproduces the
    meiotic and fertility phenotype cleanly and the neurological phenotype not at all, and
    the failure is complete rather than partial: no structural cerebellar change, no
    Purkinje cell loss, no behavioural difference. Two facts make the mismatch mechanistic
    rather than incidental. First, R-loops accumulate in Setx-null proliferating tissue but
    are undetectable in Setx-null brain, and the same is true for Atm-, Tdp1- and
    Aptx-null brains — so the R-loop mechanism, which is the best-supported molecular
    account of AOA2, has never been demonstrated in the tissue that degenerates. Second,
    the AOA2 transcriptional signature is preserved in the cerebellum of the same knockout
    mice, so the molecular consequence of losing senataxin does reach the mouse cerebellum
    without producing degeneration there.

    Taken together these constrain what the mouse can be used for. It is the right system
    for the meiotic arm and for asking what senataxin does to transcription in vivo. It is
    not a system in which a candidate neuroprotective intervention can be tested, and a
    negative neurological result in it says nothing about the human disease. Patient
    iPSC-derived neural progenitors were built for exactly this reason, and they are
    proliferating cells, so the post-mitotic question remains open in every available
    model.
  evidence:
  - reference: PMID:26231220
    reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Recent disruption of the Setx gene in mice did not lead to neurobehavioral defects or
      neurodegeneration, making it difficult to study the etiology of AOA2.
    explanation: >-
      States the mismatch and the modelling problem it creates.
  - reference: PMID:24637776
    reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      There was no evidence for accumulation of R-loops in the brains of mice where Setx,
      Atm, Tdp1 or Aptx genes were disrupted.
    explanation: >-
      Supplies the tissue-level reason the mechanism may not transfer to brain.
  - reference: PMID:24760770
    reference_title: Mutation of senataxin alters disease-specific transcriptional networks in patients with ataxia with oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These modules were disease-specific and preserved in patient fibroblasts and in the
      cerebellum of Setx knockout mice demonstrating conservation across species and cell
      types, including neurons.
    explanation: >-
      Shows the molecular consequence does reach the mouse cerebellum, which sharpens the
      mismatch rather than explaining it away.
- discussion_id: r_loop_direction_and_relevance_to_neurodegeneration
  kind: CONTROVERSY
  prompt: >-
    Does R-loop accumulation cause the neurodegeneration in AOA2, and do senataxin-deficient
    human cells accumulate or lose R-loops?
  attaches_to:
  - pathophysiology#Defective R-Loop Resolution at Transcription Pause Sites
  - pathophysiology#Accumulation of Unrepaired DNA Double-Strand Breaks
  rationale: >-
    The R-loop account is the standard mechanistic story for AOA2 and two independent lines
    of evidence complicate it. The first is directional: a genome-wide study of
    SETX-depleted human cells reported decreased, not increased, R-loop accumulation, with
    a strong trend toward R-loop loss at around 1,500 loci. That is compatible with
    senataxin both resolving and promoting R-loops depending on genomic context, but it
    means "R-loops accumulate in AOA2" is not a safe blanket statement. The second is
    anatomical: R-loops are demonstrable in Setx-null proliferating tissue and absent from
    Setx-null brain, which led those authors to conclude explicitly that R-loop accumulation
    does not contribute to the neurodegenerative phenotype in these recessive ataxias.

    The entry keeps the R-loop nodes because the biochemistry of senataxin at pause sites is
    not in dispute and the patient-derived neural progenitors do show R-loop accumulation.
    What is unresolved is whether that is the step that kills cerebellar neurons, and the
    honest position is that no experiment in post-mitotic human neurons has been done.
  evidence:
  - reference: PMID:32686621
    reference_title: "SETX (senataxin), the helicase mutated in AOA2 and ALS4, functions in autophagy regulation."
    supports: SUPPORT

name: Ataxia With Oculomotor Apraxia Type 2
creation_date: "2026-09-09T13:20:42Z"
category: Mendelian
synonyms:
- AOA2
- SCAN2
- SCAR1
- Spinocerebellar ataxia with axonal neuropathy type 2
- Ataxia-oculomotor apraxia 2
description: >-
  An autosomal recessive cerebellar ataxia caused by biallelic loss of function at SETX,
  the gene for senataxin. Senataxin is a large DNA/RNA helicase that sits where
  transcription meets genome maintenance: it unwinds the RNA:DNA hybrids (R-loops) that
  form behind RNA polymerase II at G-rich pause sites, and by removing them it lets the
  exonuclease Xrn2 reach the nascent transcript and terminate the polymerase. The same
  activity is needed where a transcription complex collides with a replication fork, which
  is why senataxin is also a DNA-damage-response protein. Losing it leaves patient cells
  constitutively oxidatively damaged, slow to rejoin double-strand breaks, and
  transcriptionally abnormal at a reproducible set of genes.

  Clinically the disease is unusually homogeneous for a recessive ataxia. Onset is in the
  second decade, gait ataxia is almost always the first sign, and a severe axonal
  sensorimotor neuropathy accumulates alongside the cerebellar syndrome until walking is
  lost roughly fifteen years later. Cerebellar atrophy is near-universal on imaging. The
  eponymous oculomotor apraxia is the least reliable feature of the four in the name — it
  is absent in half to two thirds of patients, and whole cohorts have been described
  without it — while elevated serum alpha-fetoprotein is present in almost everyone and is
  what actually drives the diagnosis to a SETX test.

  Two things the name does not say are worth stating. First, despite sharing the raised
  AFP and the DNA-repair theme with ataxia-telangiectasia, AOA2 carries neither cancer
  predisposition nor immunodeficiency, and this entry deliberately does not model one.
  Second, SETX is allelic with autosomal dominant juvenile amyotrophic lateral sclerosis
  (ALS4); the recessive loss-of-function alleles curated here and the dominant ALS4 alleles
  produce different diseases from the same gene, and are separated experimentally as well
  as clinically — AOA2 alleles abolish senataxin sumoylation and its exosome interaction,
  ALS4 alleles do not.

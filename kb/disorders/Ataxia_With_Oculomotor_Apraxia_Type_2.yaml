    snippet: >-
      Taken together, these findings are suggestive of a progressive sensory neuronopathy.
    explanation: >-
      Records the ganglionopathy pattern seen in a subset, which localises part of the
      lesion to the sensory neuron body rather than the distal axon.

- name: Failure of Meiotic Recombination and Sex Chromosome Inactivation
  biological_scale: CELLULAR
  description: >-
    A second, non-neurological consequence of losing senataxin, worked out in the knockout
    mouse: programmed meiotic double-strand breaks persist, Rad51 filaments fail to
    disassemble, R-loops accumulate, crossing-over fails, and meiotic sex chromosome
    inactivation is incomplete.
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  downstream:
  - target: Germ Cell Arrest in Spermatogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23593030
    reference_title: Senataxin plays an essential role with DNA damage response proteins in meiotic recombination and gene silencing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disruption of the Setx gene caused persistence of DNA double-strand breaks, a defect
      in disassembly of Rad51 filaments, accumulation of DNA:RNA hybrids (R-loops), and
      ultimately a failure of crossing-over.
    explanation: >-
      States the meiotic defect and its molecular components in the Setx knockout mouse.

- name: Germ Cell Arrest in Spermatogenesis
  biological_scale: TISSUE
  description: >-
    In the one AOA2 patient whose testis has been examined histologically, seminiferous
    tubules contained spermatogonia and primary spermatocytes but no spermatids — the same
    pachytene-stage arrest described in the mouse. Sperm production was impaired in all
    three patients in whom it was assessed.
  locations:
  - preferred_term: seminiferous tubule of testis
    term:
      id: UBERON:0001343
      label: seminiferous tubule of testis
  downstream:
  - target: Male infertility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30642639
    reference_title: Germ cell arrest associated with aSETX mutation in ataxia oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In accordance with the murine phenotype, testis histology revealed disrupted
      seminiferous tubules with spermatogonia and primary spermatocytes, but absent
      spermatids.
    explanation: >-
      The human histological observation of the arrest, matched to the mouse stage.
  - reference: PMID:30778901
    reference_title: Disruption of Spermatogenesis and Infertility in Ataxia with Oculomotor Apraxia Type 2 (AOA2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses of testicular biopsies from an AOA2 patient recapitulate features of the
      histology seen in Setx-knockout mice, strongly suggesting an underlying mechanism
      centering on DNA-damage-mediated germ cell apoptosis.
    explanation: >-
      Connects the human histology to the mouse mechanism, which is the basis for placing
      this node downstream of the meiotic failure.


      alpha-fetoprotein and creatine-kinase were found.
    explanation: >-
      A genetically confirmed patient with raised creatine kinase; a single case, which is
      why no frequency is asserted.

- category: Laboratory
  name: Hypercholesterolemia
  description: >-
    Raised total cholesterol is reported in individual patients and is the reason
    GeneReviews advises a low-cholesterol diet. Unlike AOA1, where hypercholesterolaemia
    and hypoalbuminaemia are near-constant markers, in AOA2 it is inconsistent — one
    reviewed patient had normal albumin, total cholesterol and immunoglobulins.

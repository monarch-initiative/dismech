    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main clinical features were cerebellar ataxia (100%), peripheral neuropathy
      (94.6%), cerebellar atrophy (95.3%) and elevated AFP concentration (92.0%).
    explanation: >-
      An independent literature review of 229 cases reporting the same frequency.
  sequelae:
  - target: Loss of ambulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The cerebellar syndrome progresses to loss of independent walking, with the axonal
      neuropathy adding to the same disability.
    evidence:
    - reference: PMID:19141356
      reference_title: "Ataxia with oculomotor apraxia type 2: a clinical and genetic study of 19 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cerebellar ataxia was progressive, slowly leading to disability which was
        aggravated by axonal polyneuropathy present in almost all the patients.
      explanation: >-
        States that the ataxia is what progresses to disability, and that the neuropathy
        compounds it.


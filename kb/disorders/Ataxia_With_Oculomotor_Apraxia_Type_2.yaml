    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key clinical features included ataxia (100%), dysarthria (99.2%), cerebellar atrophy
      (99.4%), and elevated AFP (97.6%).
    explanation: >-
      Gives the frequency of ataxia across a 216-patient literature review.
  - reference: PMID:36438189

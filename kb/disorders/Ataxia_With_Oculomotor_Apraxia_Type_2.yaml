- discussion_id: unexplained_alpha_fetoprotein_elevation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of senataxin raise serum alpha-fetoprotein, when AOA2 patients have no
    liver disease and AFP does not track disease activity?
  attaches_to:
  - biochemical#Serum alpha-fetoprotein
  - pathophysiology#Loss of Senataxin RNA/DNA Helicase Activity
  rationale: >-
    AFP is the most useful test in the disease and the least understood finding in it.
    Nothing in the curated literature connects senataxin loss to AFP production. The obvious
    hepatic explanation has been examined and does not hold: liver enzymes and liver imaging
    were normal in every AOA2 patient in a series where the majority of
    ataxia-telangiectasia patients had abnormalities of both. The behaviour of the marker is
    also unusual for a disease biomarker — it is set at or before symptom onset and then
    stays flat while the patient deteriorates over two decades, which is why it is a
    diagnostic and not a monitoring test.

    The gap matters practically as well as mechanistically. Three genetically distinct
    ataxias raise AFP into three different concentration bands, which suggests the level is
    reporting something quantitative about the underlying defect rather than being an
    incidental association; nobody has explained what. Until that is known, the readout link
    in this entry is deliberately recorded as a correlation with the genetic lesion rather
    than as a readout of any modelled mechanism node.
  evidence:
  - reference: PMID:40255955
    reference_title: "Is high AFP associated with liver diseases in ataxia-telangiectasia and ataxia-oculomotor apraxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the source and clinical implications of this increase, as well as its
      relationship with liver diseases are unknown.
    explanation: >-
      States the gap directly, from a study designed to test the hepatic explanation.
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increased AFP level as well as cerebellar atrophy seem to be stable in the course
      of the disease and to occur mostly at or before the onset of the disease.
    explanation: >-
      Documents the marker's flat time course, which any mechanistic account has to
      explain.

notes: >-
  Lump/split. This is a leaf disease entry: one gene, one recessive mechanism, one
  pathograph. AOA2 is not split by allele or by ancestry — the French-Canadian L1976R
  cluster and the Algerian and Italian series describe the same disease, and the only
  reproducible genotype-phenotype effect (helicase-domain missense alleles run milder) is
  recorded as a genetic-section observation rather than as a subtype. The dominant allelic
  disorder ALS4 is a separate dismech entry (Juvenile Amyotrophic Lateral Sclerosis) and is
  cross-referenced in differential_diagnoses rather than duplicated here; the two are
  separated by inheritance, phenotype, and an experimental difference in senataxin
  sumoylation, so folding them together would lose real information.

  Deliberately not modelled. There is no cancer predisposition and no immunodeficiency in
  AOA2, so no such nodes or surveillance recommendations appear, and the entry does not
  conform to the genome_instability_mutation module, whose chain runs through clonal
  evolution to neoplasia. Senataxin's role in restraining the antiviral transcriptional
  response is real and interesting but no clinical infection phenotype has been reported in
  AOA2, so it is left out rather than speculated into the pathograph. Elevated serum IgG
  was considered as a phenotype and dropped: no cached source supports it, and the one
  reviewed patient whose immunoglobulins were measured had normal levels. Cognitive
  impairment is likewise not curated as a phenotype: the one dedicated neuropsychological
  study found substantially preserved profiles and attributed the measured reading deficit
  to the oculomotor disorder, which is recorded on the assistive-technology treatment
  instead.

  Where the mechanism is weak. The molecular arm is well evidenced in patient cells,
  knockdown lines and biochemistry; the step from cellular stress to cerebellar neuron
  death is not, and the entry says so in three places rather than papering over it — a
  HUMAN_MODEL_MISMATCH discussion for the non-degenerating knockout mouse, a CONTROVERSY
  discussion for the R-loop account, and an explicit statement in the description of the
  convergence node. Human neuropathology in AOA2 rests on a very small number of autopsies.

  Corrections to the deep-research report. The Perplexity sonar-deep-research report for
  this entry is thin on primary literature: it cites four PMIDs in total and leans on
  MedlinePlus, OMIM, an ataxia-charity PDF and Genomics England PanelApp pages, none of
  which is citable here, so essentially all evidence in this entry was taken from primary
  papers read directly from the reference cache. One of its four identifiers, PMID:795872,
  did not resolve and is flagged in the report's own Reference Validation section; it is
  not a PMID at all but the article number in a JAMA Neurology URL the report mistook for
  one, and it is not cited anywhere in this entry. The report's Term Validation section
  flags MONDO:0018996 as named "if available" — that is an artefact of the report echoing
  the query template rather than a wrong binding, and the MONDO term itself is correct. The
  preflight check returned WARN because AFP is mentioned 49 times against SETX's 167; that
  is the diagnostic biomarker, not a second disease entity, and the report's OMIM
  references (606002 for the disease, 608465 for the gene) both match. Two of the report's
  substantive claims were not carried across: its step 4 presents impaired autophagy as an
  established parallel arm of the neuronal mechanism, which overstates a single 2021 study
  whose own R-loop result contradicts the report's step 2, and its step 8 asserts that
  elevated AFP, hypercholesterolaemia and raised CK arise from "altered hepatic gene
  expression", for which no evidence was found and against which the AOA2 liver data
  argue.

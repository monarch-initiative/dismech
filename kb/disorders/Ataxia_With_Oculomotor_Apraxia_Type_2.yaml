inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Two SETX loss-of-function alleles are required; heterozygous parents and sibs are
    clinically well. Both homozygous and compound heterozygous states are seen, the former
    concentrated in consanguineous and founder populations. One caveat for pedigree
    reading: a family segregating a common allele can present as pseudodominant across two
    generations and be misclassified as a dominant ataxia until SETX is sequenced.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301333
    reference_title: "Ataxia with Oculomotor Apraxia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AOA2 is inherited in an autosomal recessive manner. Each sib of an affected
      individual has a 25% chance of being affected, a 50% chance of being an
      asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      GeneReviews states the transmission pattern and the sib recurrence risks directly.
  - reference: PMID:18350359
    reference_title: "\"Pseudodominant inheritance\" of ataxia with ocular apraxia type 2 (AOA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pseudodominant occurrence in two generations has not been described before in AOA2
      and led, in this family, to false categorization as dominant ataxia before SETX
      mutations were detected.
    explanation: >-
      Documents the pedigree pattern that can make a recessive AOA2 family look dominant.

pathophysiology:

- name: Biallelic SETX Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Two loss-of-function SETX alleles, homozygous or compound heterozygous. The reported
    spectrum is dominated by missense, frameshift and nonsense changes, with a large
    minority causing premature termination of the 2,677-residue protein; whole-exon
    deletions and duplications also occur and are missed by sequencing alone, so a
    convincing phenotype with a single point mutation should prompt dosage analysis.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of Senataxin RNA/DNA Helicase Activity
    causal_link_type: DIRECT
    description: >-
      Premature-termination alleles remove the helicase domain outright; missense alleles
      in and outside that domain reduce or abolish its function.
    evidence:
    - reference: PMID:14770181
      reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ten of the fifteen mutations cause premature termination of a large DEAxQ-box
        helicase, the human ortholog of yeast Sen1p, involved in RNA maturation and
        termination.
      explanation: >-
        States that the disease alleles truncate the helicase, which is the step from
        genotype to lost enzyme activity.
  evidence:
  - reference: PMID:14770181
    reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have now identified causative mutations in 15 families, which allows us to
      clinically define this entity by onset between 10 and 22 years, cerebellar atrophy,
      axonal sensorimotor neuropathy, oculomotor apraxia and elevated alpha-fetoprotein
      (AFP).
    explanation: >-
      The founding gene-disease report, establishing SETX mutation as the cause of AOA2.
  - reference: PMID:18663494
    reference_title: Identification and characterisation of a large senataxin (SETX) gene duplication in ataxia with ocular apraxia type 2 (AOA2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analysis revealed a large out-of-frame tandem duplication, encompassing
      exons 7, 8, 9 and 10.
    explanation: >-
      Documents the exon-level structural allele class that sequencing alone does not see.

- name: Loss of Senataxin RNA/DNA Helicase Activity
  biological_scale: MOLECULAR
  description: >-
    Senataxin is a nucleoplasmic superfamily-I DNA/RNA helicase homologous to yeast Sen1p,
    with a C-terminal helicase domain and an N-terminal protein-interaction domain. With
    the protein truncated or inactive, the cell loses a single enzyme that is used in
    several places at once: unwinding R-loops behind paused polymerase, unwinding them
    again where transcription meets replication, and docking the transcription machinery
    to RNA-processing and damage-response partners.
  molecular_functions:
  - preferred_term: senataxin RNA/DNA helicase activity
    modifier: DECREASED
    term:
      id: GO:0004386
      label: helicase activity
  cellular_components:
  - preferred_term: nucleoplasm
    term:
      id: GO:0005654
      label: nucleoplasm
  downstream:
  - target: Defective R-Loop Resolution at Transcription Pause Sites
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21700224
      reference_title: Human senataxin resolves RNA/DNA hybrids formed at transcriptional pause sites to promote Xrn2-dependent termination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Senataxin, a helicase protein associated with AOA2/ALS4 neurodegenerative
        disorders, acts to resolve these R-loop structures and by so doing allows access
        of the 5'-3' exonuclease Xrn2 at 3' cleavage poly(A) sites.
      explanation: >-
        Assigns R-loop resolution at pause sites to senataxin specifically, so losing the
        enzyme is what fails at this step.
  - target: Impaired Transcriptional Control of Autophagy Genes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32686621
      reference_title: "SETX (senataxin), the helicase mutated in AOA2 and ALS4, functions in autophagy regulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, we discovered a strong connection between SETX and the
        macroautophagy/autophagy pathway, reflecting a direct effect on transcription of
        autophagy genes.
      explanation: >-
        Attributes the autophagy-gene transcription defect directly to loss of SETX.
  - target: Disrupted Senataxin-Exosome RNA Surveillance Coupling
    causal_link_type: DIRECT
  - target: Hypersensitivity to Oxidative DNA Damage
    causal_link_type: DIRECT
  - target: Failure of Meiotic Recombination and Sex Chromosome Inactivation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report that senataxin, defective in ataxia oculomotor apraxia (AOA) type 2, is a
      nuclear protein involved in the DNA damage response.
    explanation: >-
      Establishes the protein's compartment and its role in the damage response, the
      activity that is lost.
  - reference: PMID:23149945
    reference_title: "Senataxin, defective in the neurodegenerative disorder ataxia with oculomotor apraxia 2, lies at the interface of transcription and the DNA damage response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that senataxin localizes to sites of collision between
      components of the replisome and the transcription apparatus and that it is targeted
      to R loops, where it plays an important role at the interface of transcription and
      the DNA damage response.
    explanation: >-
      Locates the normal activity at transcription-replication collisions, which is the
      function the disease alleles remove.

- name: Defective R-Loop Resolution at Transcription Pause Sites
  biological_scale: MOLECULAR
  description: >-
    R-loops form behind elongating RNA polymerase II, especially over G-rich pause sites
    downstream of poly(A) signals, and must be unwound for the transcript to be degraded
    and the polymerase released. Without senataxin the hybrids persist at these sites and
    at transcription-replication collision points. Note that the direction of the R-loop
    change in senataxin-depleted human cells is not uniform across studies, which is
    recorded as a discussion on this entry rather than smoothed over here.
  biological_processes:
  - preferred_term: R-loop resolution
    modifier: DECREASED
    term:
      id: GO:0062176
      label: R-loop processing
  downstream:
  - target: Defective RNA Polymerase II Transcription Termination
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21700224
      reference_title: Human senataxin resolves RNA/DNA hybrids formed at transcriptional pause sites to promote Xrn2-dependent termination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In effect, R-loops formed over G-rich pause sites, followed by their resolution by
        senataxin, are key steps in the termination process.
      explanation: >-
        Places R-loop resolution upstream of termination in the same mechanism, which is
        the edge asserted here.
  - target: Accumulation of Unrepaired DNA Double-Strand Breaks
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21700224
    reference_title: Human senataxin resolves RNA/DNA hybrids formed at transcriptional pause sites to promote Xrn2-dependent termination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that nascent transcripts form RNA/DNA hybrid structures (R-loops) behind
      elongating Pol II and are especially prevalent over G-rich pause sites positioned
      downstream of gene poly(A) signals.
    explanation: >-
      Describes where the substrate forms, which is the site at which resolution fails.

- name: Defective RNA Polymerase II Transcription Termination
  biological_scale: MOLECULAR
  description: >-
    Senataxin-depleted cells show read-through past the poly(A) site, reduced polymerase
    occupancy at affected genes, and altered splice-site selection, consistent with a
    protein that couples termination to RNA processing through poly(A)-binding proteins.
  biological_processes:
  - preferred_term: termination of RNA polymerase II transcription
    modifier: DECREASED
    term:
      id: GO:0006369
      label: termination of RNA polymerase II transcription
  downstream:
  - target: Disease-Specific Transcriptional Network Dysregulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19515850
    reference_title: "Functional role for senataxin, defective in ataxia oculomotor apraxia type 2, in transcriptional regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNA polymerase II-dependent transcription termination was defective in cells
      depleted of senataxin in keeping with the observed interaction of senataxin with
      poly(A) binding proteins 1 and 2.
    explanation: >-
      Reports the termination defect itself in senataxin-depleted cells.
  - reference: PMID:19515850
    reference_title: "Functional role for senataxin, defective in ataxia oculomotor apraxia type 2, in transcriptional regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Binding of RNA polymerase II to candidate genes was significantly reduced in
      senataxin deficient cells and this was accompanied by decreased transcription of
      these genes, suggesting a role for senataxin in the regulation/modulation of
      transcription.
    explanation: >-
      Adds the polymerase-occupancy and output consequence at the same step.

- name: Disrupted Senataxin-Exosome RNA Surveillance Coupling
  biological_scale: MOLECULAR
  description: >-
    Sumoylated senataxin binds Rrp45, a core subunit of the nuclear RNA exosome, and the
    two proteins co-localise in nuclear foci at R-loops generated by transcription-replication
    collisions. This is the one step in the chain that has been shown to separate AOA2 from
    ALS4 at the molecular level: AOA2 alleles abolish both the sumoylation and the Rrp45
    interaction, while ALS4 alleles leave them intact.
  downstream:
  - target: Accumulation of Unrepaired DNA Double-Strand Breaks
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25054092
    reference_title: "SETX sumoylation: A link between DNA damage and RNA surveillance disrupted in AOA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, we showed that AOA2 but not ALS4 mutations prevented both SETX
      sumoylation and the Rrp45 interaction.
    explanation: >-
      Shows the coupling is lost specifically by AOA2 alleles, which is what makes this a
      disease step rather than a general property of the protein.
  - reference: PMID:25054092
    reference_title: "SETX sumoylation: A link between DNA damage and RNA surveillance disrupted in AOA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We suggest that SETX links transcription, DNA damage and RNA surveillance, and
      discuss here how this link can be relevant to AOA2 disease.
    explanation: >-
      The authors' own statement of what the lost interaction connects.

- name: Impaired Transcriptional Control of Autophagy Genes
  biological_scale: MOLECULAR
  description: >-
    Senataxin depletion changes the transcription of autophagy and lysosomal-degradation
    genes, apparently through direct recruitment of RNA polymerase II to those genes rather
    than through a downstream signalling route.
  biological_processes:
  - preferred_term: transcriptional regulation of macroautophagy genes
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  downstream:
  - target: Blocked Autophagic Clearance of Damaged Proteins and Organelles
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32686621
      reference_title: "SETX (senataxin), the helicase mutated in AOA2 and ALS4, functions in autophagy regulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that SETX depletion inhibits the progression of autophagy, leading to an
        accumulation of ubiquitinated proteins, decreased ability to clear protein
        aggregates, as well as mitochondrial defects.
      explanation: >-
        States the functional consequence of the transcriptional change, which is this
        edge.

- name: Blocked Autophagic Clearance of Damaged Proteins and Organelles
  biological_scale: CELLULAR
  description: >-
    Autophagic flux stalls, ubiquitinated proteins and aggregates accumulate, and
    mitochondrial defects appear. The same perturbation is present in AOA2 patient
    fibroblasts, not only in knockdown lines, which is what makes it a disease mechanism
    rather than an artefact of depletion.
  biological_processes:
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  downstream:
  - target: Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32686621
    reference_title: "SETX (senataxin), the helicase mutated in AOA2 and ALS4, functions in autophagy regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of AOA2 patient fibroblasts also revealed a perturbation of the autophagy
      pathway.
    explanation: >-
      Confirms the autophagy defect in patient-derived cells rather than only in
      knockdown.

- name: Hypersensitivity to Oxidative DNA Damage
  biological_scale: CELLULAR
  description: >-
    AOA2 patient fibroblasts and lymphoblasts carry constitutive oxidative DNA damage and
    are hypersensitive to hydrogen peroxide, camptothecin and mitomycin C but not to
    ionizing radiation. The selectivity matters: it separates AOA2 from ataxia-telangiectasia,
    whose cells are radiosensitive, and it points at lesions arising during transcription and
    replication rather than at a general break-repair failure. Complementation with
    full-length SETX cDNA rescues the sensitivity, so the defect is senataxin's.
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    modifier: DECREASED
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  downstream:
  - target: Accumulation of Unrepaired DNA Double-Strand Breaks
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17562789
      reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Rejoining of H2O2-induced DNA double-strand breaks (DSBs) was significantly
        reduced in AOA2 cells compared to controls, and there was no evidence for a defect
        in DNA single-strand break repair.
      explanation: >-
        Ties the oxidative insult in AOA2 cells specifically to failed double-strand break
        rejoining, which is the next node.
  evidence:
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AOA2 cells are sensitive to H2O2, camptothecin, and mitomycin C, but not to ionizing
      radiation, and sensitivity was rescued with full-length SETX cDNA.
    explanation: >-
      Gives both the agent selectivity and the cDNA rescue that assigns it to senataxin.
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AOA2 cells exhibited constitutive oxidative DNA damage and enhanced chromosomal
      instability in response to H2O2.
    explanation: >-
      Records the baseline oxidative damage burden, not only the induced sensitivity.

- name: Accumulation of Unrepaired DNA Double-Strand Breaks
  biological_scale: CELLULAR
  description: >-
    Double-strand breaks arising at transcription-replication collisions and after
    oxidative insult are rejoined slowly, and the burden is measurable in patient-derived
    cells including iPSC-derived neural progenitors.
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: DECREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  downstream:
  - target: Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26231220
    reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AOA2 iPSC and neural progenitors exhibit increased levels of oxidative damage, DNA
      double-strand breaks, increased DNA damage-induced cell death and R-loop
      accumulation.
    explanation: >-
      Demonstrates the break burden and R-loop accumulation in a neural, patient-derived
      system rather than in fibroblasts alone.

- name: Disease-Specific Transcriptional Network Dysregulation
  biological_scale: CELLULAR
  description: >-
    A reproducible set of genes is mis-expressed in AOA2. The signature is detectable in
    patient fibroblasts, in peripheral blood from members of twelve AOA2 families, and in
    the cerebellum of Setx knockout mice, and the gene sets affected by AOA2 alleles differ
    from those affected by ALS4 alleles — which is the strongest available evidence that
    the two allelic diseases diverge through what senataxin transcribes.
  downstream:
  - target: Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24760770
    reference_title: Mutation of senataxin alters disease-specific transcriptional networks in patients with ataxia with oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To assess this in vivo, we performed gene expression analysis on peripheral blood
      from members of 12 different AOA2 families and identified an AOA2-specific
      transcriptional signature.
    explanation: >-
      Establishes the signature in patients rather than only in cell lines.
  - reference: PMID:24760770
    reference_title: Mutation of senataxin alters disease-specific transcriptional networks in patients with ataxia with oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These modules were disease-specific and preserved in patient fibroblasts and in the
      cerebellum of Setx knockout mice demonstrating conservation across species and cell
      types, including neurons.
    explanation: >-
      Extends the signature to cerebellar tissue and across species, which is what makes
      it plausible as a neuronal mechanism.

- name: Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    The convergence point of the molecular arms: unrepaired breaks, stalled autophagic
    clearance and a mis-set transcriptional program in cells that cannot dilute damage by
    dividing. This node is where the mechanism is weakest in human evidence, and the entry
    says so rather than asserting a clean handover — the neuronal read-out comes from
    patient iPSC-derived progenitors and from the clinical and neuropathological endpoint,
    not from affected human brain.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  downstream:
  - target: Purkinje Cell Degeneration in the Cerebellar Cortex
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Degeneration of Sensory and Motor Peripheral Axons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26231220
    reference_title: A new model to study neurodegeneration in ataxia oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recent evidence suggests that the protein defective in this syndrome, senataxin
      (SETX), functions in RNA processing to protect the integrity of the genome.
    explanation: >-
      States the genome-protection framing under which the accumulated stress is read as
      the neurodegenerative mechanism.

- name: Purkinje Cell Degeneration in the Cerebellar Cortex
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    Loss of Purkinje cells from the cerebellar cortex is the neuropathological endpoint of
    the cerebellar arm. Post-mortem material in AOA2 is scarce; the claim rests on a small
    number of autopsied patients and on the imaging correlate.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Cerebellar Cortical Atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30778901
    reference_title: Disruption of Spermatogenesis and Infertility in Ataxia with Oculomotor Apraxia Type 2 (AOA2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major clinical features of AOA2 include onset in the second decade, progressive
      cerebellar ataxia with axonal sensorimotor peripheral neuropathy, diffuse cerebellar
      atrophy, frequent oculomotor apraxia, early loss of reflexes, loss of Purkinje cells
      in the cerebellar cortex, and elevated alpha-fetoprotein (AFP) serum level
    explanation: >-
      Names Purkinje cell loss in the cerebellar cortex among the established features of
      the disease.
  - reference: PMID:16636238
    reference_title: "Ataxia with oculomotor apraxia type 2: a clinical, pathologic, and genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postmortem findings are also reported in one of the patients.
    explanation: >-
      Records that the neuropathological description in this cohort rests on a single
      autopsy, which is the size of the human evidence base for this node.

- name: Cerebellar Cortical Atrophy
  biological_scale: TISSUE
  description: >-
    Volume loss in the cerebellum, visible on MRI in essentially every patient. It is not a
    late marker of severity: it is present in the youngest and most mildly affected
    patients, and appears to be established at or before symptom onset rather than tracking
    with disease duration.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Progressive cerebellar ataxia
    causal_link_type: DIRECT
  - target: Gait ataxia
    causal_link_type: DIRECT
  - target: Dysarthria
    causal_link_type: DIRECT
  - target: Saccadic ocular pursuit
    causal_link_type: DIRECT
  - target: Oculomotor apraxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypometric saccades
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increased AFP level as well as cerebellar atrophy seem to be stable in the course
      of the disease and to occur mostly at or before the onset of the disease.
    explanation: >-
      Establishes that the atrophy is early and stable rather than a progressive imaging
      marker.
  - reference: PMID:19141356
    reference_title: "Ataxia with oculomotor apraxia type 2: a clinical and genetic study of 19 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar atrophy was more severe in the eldest patients; however it may also be an
      early sign since it was present in the youngest and paucisymptomatic patients.
    explanation: >-
      The complementary observation from a second cohort: severity increases with age but
      the finding is present from the start.

- name: Degeneration of Sensory and Motor Peripheral Axons
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    A length-dependent axonal degeneration affecting both sensory and motor fibres. Sural
    nerve biopsy shows severe depletion of large myelinated fibres, and in at least one
    patient of small fibres as well. In some patients the sensory component behaves as a
    ganglionopathy rather than a distal axonopathy, with sensory action potentials lost
    across all limbs and normal motor conduction.
  cell_types:
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  - preferred_term: motor neuron
    term:

    snippet: >-
      In two studies, two AOA2 females patients were reported to have entered menopause in
      their mid-twenties providing evidence of premature ovarian failure
    explanation: >-
      Summarises the two published cases of premature menopause in AOA2. The quote is this
      paper's account of earlier reports rather than its own observation.
  - reference: PMID:36438189
    reference_title: "Ataxia with oculomotor apraxia type 2 caused by a novel homozygous mutation in SETX gene, and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She had elevated AFP, increased serum follicle-stimulating hormone (FSH) and
      luteinizing hormone (LH) and decreased anti-Müllerian hormone (AMH) levels.
    explanation: >-
      The biochemical profile of ovarian insufficiency in a genetically confirmed patient.

biochemical:
- name: Serum alpha-fetoprotein
  notes: >-
    The diagnostic biomarker of AOA2 and the reason most patients reach a SETX test. It is
    elevated in 92-100% of patients, is established at or before symptom onset, and stays
    flat thereafter, so it discriminates but does not monitor. Threshold work matters here:
    selecting non-Friedreich, non-ataxia-telangiectasia ataxic patients with AFP at or
    above 7 microg/l for sequencing gives a 46% yield of AOA2 while missing about 0.2% of
    cases, and video-oculography adds nothing to the discrimination that AFP does not
    already provide. Why senataxin loss raises AFP is not known; it is not explained by
    liver disease, which is absent in AOA2 patients even where present in
    ataxia-telangiectasia.
  biomarker_term:
    preferred_term: alpha-fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  specificity: >-
    Shared with ataxia-telangiectasia and, at lower levels, AOA1; the concentration bands
    differ between the three.
  readouts:
  - target: Biallelic SETX Loss-of-Function Variant
    relationship: CORRELATES_WITH
    direction: THRESHOLD_DEPENDENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      An AFP above the 7 microg/l threshold in an ataxic patient is what selects SETX for
      sequencing. The link is empirical: no mechanism connecting senataxin loss to AFP
      production has been established, so this is recorded as a correlation with the
      genetic lesion rather than as a readout of any modelled mechanism node.
    evidence:
    - reference: PMID:19696032
      reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Therefore, selection of patients with an AFP level above 7 microg/l for senataxin
        gene sequencing is a good strategy for AOA2 diagnosis.
      explanation: >-
        States the diagnostic use of the threshold, which is what this readout link
        records.
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The probability of missing AOA2 diagnosis, in case of sequencing senataxin gene only
      in non-Friedreich ataxia non-ataxia-telangiectasia ataxic patients with AFP level >
      or =7 microg/l, is 0.23% and the probability for a non-Friedreich ataxia
      non-ataxia-telangiectasia ataxic patient to be affected with AOA2 with AFP levels >
      or =7 microg/l is 46%.
    explanation: >-
      Gives both operating characteristics of the 7 microg/l threshold.
  - reference: PMID:29127364
    reference_title: "Comparing ataxias with oculomotor apraxia: a multimodal study of AOA1, AOA2 and AT focusing on video-oculography and alpha-fetoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific distinctive alpha-fetoprotein thresholds were determined for AOA1 (7-15
      µg/L), AOA2 (15-65 µg/L) and AT (>65 µg/L).
    explanation: >-
      Gives the concentration bands that separate the three oculomotor-apraxia ataxias.
  - reference: PMID:40255955
    reference_title: "Is high AFP associated with liver diseases in ataxia-telangiectasia and ataxia-oculomotor apraxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While 69% (9/13) of AT patients had elevated liver enzymes and 56% (5/9) had abnormal
      liver imaging, both were normal in all AOA2 patients.
    explanation: >-
      Excludes hepatic disease as the source of the AFP elevation in AOA2, which is why
      the mechanism is recorded as unexplained.

genetic:
- name: SETX
  notes: >-
    SETX at 9q34 encodes senataxin, a 2,677-residue DNA/RNA helicase with a C-terminal
    superfamily-I helicase domain and an N-terminal protein-interaction domain. Reported
    AOA2 alleles are missense, frameshift and nonsense changes distributed across the gene,
    with whole-exon deletions and duplications making up an under-recognised minority.
    L1976R is a founder allele in the French-Canadian population, carried on 85% of
    Quebec-cluster chromosomes. Missense alleles inside the helicase domain are associated
    with a milder course and with more pyramidal signs and dystonia than out-of-domain
    missense, deletion and nonsense alleles.

    SETX is allelic with autosomal dominant juvenile ALS (ALS4, OMIM 602433). That is a
    separate dismech entry; the recessive loss-of-function alleles here and the dominant
    ALS4 alleles are not interchangeable, and the p.K992R change is a population
    polymorphism at 1-2% rather than a disease allele.
  gene_term:
    preferred_term: SETX
    term:
      id: hgnc:445
      label: SETX
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:14770181
    reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of the fifteen mutations cause premature termination of a large DEAxQ-box
      helicase, the human ortholog of yeast Sen1p, involved in RNA maturation and
      termination.
    explanation: >-
      The gene identification and the dominant allele class in the founding series.
  - reference: PMID:36438189
    reference_title: "Ataxia with oculomotor apraxia type 2 caused by a novel homozygous mutation in SETX gene, and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most reported SETX mutations in AOA2 patients were missense, frameshift and nonsense
      mutations.
    explanation: >-
      Summarises the variant-class distribution across 229 reviewed cases.
  - reference: PMID:15732101
    reference_title: Mutations in senataxin responsible for Quebec cluster of ataxia with neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common L1976R mutation is shared by 17 of 20 (85%) carrier chromosomes.
    explanation: >-
      Establishes L1976R as the French-Canadian founder allele.
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyramidal signs and dystonia were more frequent and disease was less severe with
      missense mutations in the helicase domain of senataxin gene than with missense
      mutations out of helicase domain and deletion and nonsense mutations (P = 0.001, P =
      0.008 and P = 0.01, respectively).
    explanation: >-
      The genotype-phenotype correlation by allele class and domain.
  - reference: PMID:23941260
    reference_title: SETX mutations are a frequent genetic cause of juvenile and adult onset cerebellar ataxia with neuropathy and elevated serum alpha-fetoprotein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our survey ~60% of juvenile-to-adult cases with cerebellar ataxia, sensorimotor
      neuropathy and increased AFP are due to mutations in the SETX gene, and a smaller
      percentage to APTX and ATM gene mutations.
    explanation: >-
      Gives the diagnostic yield of SETX among patients selected on the AOA2 triad.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.11
  notes: >-
    Reported as approximately 1 in 900,000 in a review of the oculomotor-apraxia ataxias;
    this is a literature estimate, not a population survey, and no incidence figure was
    found. Relative frequency is better characterised than absolute prevalence: AOA2 is
    about 8% of non-Friedreich autosomal recessive cerebellar ataxia in a French series and
    was the third most frequent recessive ataxia in an Algerian series, and a prospective
    Alsace survey found it comparable in frequency to ataxia-telangiectasia.
  evidence:
  - reference: PMID:23941260
    reference_title: SETX mutations are a frequent genetic cause of juvenile and adult onset cerebellar ataxia with neuropathy and elevated serum alpha-fetoprotein.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AOA2 (MIM 606002) has a worldwide distribution, and its prevalence is estimated
      around 1 in 900,000
    explanation: >-
      The prevalence estimate the rate here is converted from.
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      its relative frequency represents approximately 8% of non-Friedreich ARCA, which is
      more frequent than ataxia telangiectasia and ataxia with oculomotor apraxia type 1
      (AOA1), in our series of adult patients
    explanation: >-
      Supports the relative-frequency statement in the notes.
  - reference: PMID:19440741
    reference_title: "Epidemiological, clinical, paraclinical and molecular study of a cohort of 102 patients affected with autosomal recessive progressive cerebellar ataxia from Alsace, Eastern France: implications for clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several of the recently identified ARCAs, such as AVED, ARSACS, AOA1, AOA2 and MSS,
      have a prevalence close to AT and should be searched for extensively irrespective of
      ethnic origins.
    explanation: >-
      The prospective regional survey's comparison of AOA2 with ataxia-telangiectasia.

progression:
- phase: Onset
  notes: >-
    Onset is in the second decade in most patients: pooled median 15 years, with 77% of
    patients starting between 10 and 20. The full reported range is wider than the classic
    10-22 years — GeneReviews gives 3 to 30, and single patients have started after 40.
  evidence:
  - reference: PMID:41026212
    reference_title: "Ataxia with oculomotor apraxia type 2: two pedigree studies and a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Literature review of 216 patients revealed median onset age of 15 years old
      (interquartile range: 13-18), with 77.1% developing symptoms between 10 and 20 years.
    explanation: >-
      Gives the pooled median and the modal decade.
  - reference: PMID:20301333
    reference_title: "Ataxia with Oculomotor Apraxia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ataxia with oculomotor apraxia type 2 (AOA2) is characterized by onset of ataxia
      between age three and 30 years after initial normal development, axonal sensorimotor
      neuropathy, oculomotor apraxia, cerebellar atrophy, and elevated serum concentration
      of alpha-fetoprotein (AFP).
    explanation: >-
      The GeneReviews onset range, which is wider than the founding series' 10-22 years.
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age at onset was 15.1 +/- 3.8 years.
    explanation: >-
      An independent cohort mean, consistent with the pooled median.
- phase: Progression to disability
  notes: >-
    Steady progression over one to two decades, driven jointly by the cerebellar syndrome
    and the accumulating axonal neuropathy, ending in wheelchair dependence roughly fifteen
    years after onset. Rate of progression is not predicted by sex or by juvenile versus
    adult onset in pooled review; within the largest single cohort, later onset and the
    presence of oculomotor apraxia were associated with slower progression, and strabismus
    with faster.
  evidence:
  - reference: PMID:41026212
    reference_title: "Ataxia with oculomotor apraxia type 2: two pedigree studies and a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease progression to wheelchair dependence averaged 15.9 ± 8.6 years, with no
      significant differences observed in gender or adult onset and juvenile onset.
    explanation: >-
      Gives the interval to wheelchair dependence and the two variables that did not
      predict it.
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age at onset and presence of occasional oculomotor apraxia were negatively
      correlated to the progression rate of the disease (P = 0.03 and P = 0.009,
      respectively), whereas strabismus was positively correlated to the progression rate
      (P = 0.03).
    explanation: >-
      The clinical predictors of progression rate within the 90-patient cohort.
- phase: Neuropathy course
  notes: >-
    The neuropathy is not static. Serial electrophysiology in a single patient showed
    sensory action potentials fall in amplitude and then disappear in the lower limbs, with
    motor conduction velocities preserved — an evolving axonal, and in part ganglionopathic,
    process rather than a fixed deficit.
  evidence:
  - reference: PMID:20869730
    reference_title: Sensory neuronopathy in ataxia with oculomotor apraxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two electrophysiological studies were performed, in which decreased amplitudes of the
      sensory action potentials were followed some years later by an absence of sensory
      action potentials in the lower limbs, and increased latencies in the somatosensory
      evoked potentials.
    explanation: >-
      Documents the longitudinal change in the sensory nerve studies.

diagnosis:
- name: Serum alpha-fetoprotein measurement
  description: >-
    The gateway test. In an ataxic patient without Friedreich ataxia or
    ataxia-telangiectasia, an AFP at or above 7 microg/l is the trigger for SETX
    sequencing; concentration bands help place the patient among the three
    oculomotor-apraxia ataxias.
  diagnosis_term:
    preferred_term: Alpha-fetoprotein measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, selection of patients with an AFP level above 7 microg/l for senataxin
      gene sequencing is a good strategy for AOA2 diagnosis.
    explanation: >-
      States the testing strategy this diagnostic step implements.
- name: Molecular genetic testing of SETX
  description: >-
    Identification of biallelic pathogenic SETX variants confirms the diagnosis. Sequencing
    alone is not sufficient in a convincing case with a single variant: exon-level
    deletions and duplications occur and need dosage analysis such as MLPA.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301333
    reference_title: "Ataxia with Oculomotor Apraxia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of AOA2 is based on clinical, laboratory, and radiographic features;
      family history; and exclusion of the diagnosis of ataxia-telangiectasia, AOA1, and
      AOA4. Identification of biallelic pathogenic variants in SETX by molecular genetic
      testing confirms the diagnosis.
    explanation: >-
      The GeneReviews statement of the confirmatory test and the differentials to exclude
      first.
  - reference: PMID:18663494
    reference_title: Identification and characterisation of a large senataxin (SETX) gene duplication in ataxia with ocular apraxia type 2 (AOA2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gross SETX deletions or duplications might be an underestimated cause of AOA2.
    explanation: >-
      Supports adding dosage analysis when sequencing finds only one variant.
- name: Brain MRI
  description: >-
    Shows diffuse cerebellar atrophy in almost every patient, including young and mildly
    affected ones, so a normal cerebellum on MRI argues against the diagnosis.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:16636238
    reference_title: "Ataxia with oculomotor apraxia type 2: a clinical, pathologic, and genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High serum AFP levels, motor and sensory axonal neuropathy, and marked cerebellar
      atrophy on MRI were detected in all the patients who underwent these examinations.
    explanation: >-
      Records the MRI finding in every examined patient of the cohort.
- name: Nerve conduction studies
  description: >-
    Establish the axonal, sensorimotor character of the neuropathy and separate it from
    demyelinating causes of ataxia with neuropathy.
  diagnosis_term:
    preferred_term: Nerve Conduction Velocity Test
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:20301333
    reference_title: "Ataxia with Oculomotor Apraxia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ataxia with oculomotor apraxia type 2 (AOA2) is characterized by onset of ataxia
      between age three and 30 years after initial normal development, axonal sensorimotor
      neuropathy, oculomotor apraxia, cerebellar atrophy, and elevated serum concentration
      of alpha-fetoprotein (AFP).
    explanation: >-
      Names axonal sensorimotor neuropathy as a defining feature, which is what nerve
      conduction studies establish.
- name: Video-oculography
  description: >-
    Quantifies saccade latency and hypometria and can detect subclinical oculomotor apraxia
    in patients without head thrusts. It is useful for characterisation but does not
    discriminate AOA2 from AOA1 or ataxia-telangiectasia, so it is not required for
    diagnosis where AFP is available.
  evidence:
  - reference: PMID:29127364
    reference_title: "Comparing ataxias with oculomotor apraxia: a multimodal study of AOA1, AOA2 and AT focusing on video-oculography and alpha-fetoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, alpha-fetoprotein level seems to permit a distinction while
      video-oculography does not and therefore is not mandatory, even if an appropriate
      oculomotor examination remains crucial.
    explanation: >-
      States the limited discriminative value of oculography relative to AFP.
  - reference: PMID:30363866
    reference_title: The Clinical Spectrum of Ataxia with Oculomotor Apraxia Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oculography might be a useful tool to detect subclinical oculomotor apraxia in this
      disorder.
    explanation: >-
      Supports the characterisation use of the technique.

treatments:
- name: Physical therapy
  description: >-
    Rehabilitation aimed at the disability produced by the peripheral neuropathy. It is
    symptomatic and compensatory; there is no disease-modifying treatment for AOA2.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:

      We present 3 video cases illustrating and expanding the clinical spectrum of AOA2,
      with 1 case bearing a novel mutation with cervical dystonia as the first symptom, the
      absence of neuropathy, and a disease onset beyond the age of 40.
    explanation: >-
      Documents dystonia as a presenting feature, and with it the widest reported
      departure from the typical picture.


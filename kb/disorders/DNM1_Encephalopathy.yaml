        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: DNM1
        term:
          id: hgnc:2972
          label: DNM1
  results: A heterozygous pathogenic DNM1 variant establishes the diagnosis.
  evidence:
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients (33.3%) carried the recurrent p.Arg237Trp mutation.
    explanation: >-
      Molecular identification of DNM1 variants, including the recurrent
      p.Arg237Trp, establishes the diagnosis.
- name: EEG and Seizure Phenotyping
  description: >-
    EEG documents the epileptic encephalopathy, including hypsarrhythmia with
    infantile spasms and later the slow spike-wave of Lennox-Gastaut syndrome.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: MAXO:0000932
      label: electroencephalography
  results: An epileptic encephalopathy pattern (hypsarrhythmia, slow spike-wave) supports the diagnosis.
differential_diagnoses:
- name: Other synaptic vesicle cycle disorders and DEEs
  description: >-
    Other synaptic vesicle cycle disorders (STXBP1, UNC13A, SYT1, SNAP25) and other
    infantile-onset developmental and epileptic encephalopathies overlap through
    infantile spasms, hypotonia, and profound developmental impairment, and are
    distinguished by molecular testing.
  distinguishing_features:
  - A de novo GTPase/middle-domain DNM1 variant favors this disorder.
  - A variant in a different vesicle-cycle or DEE gene favors that diagnosis.
  evidence:
  - reference: PMID:25262651
    reference_title: "De novo mutations in synaptic transmission genes including DNM1 cause epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, 75% of mutations in these probands are predicted to disrupt a
      protein involved in regulating synaptic transmission
    explanation: >-
      Places DNM1 within the broader set of synaptic-transmission genes that cause
      epileptic encephalopathy, the molecular differential.
progression:
- phase: Infancy to Childhood
  notes: >-
    Onset is in infancy with infantile spasms, frequently evolving into
    Lennox-Gastaut syndrome, on a background of severe-to-profound developmental
    impairment; the phenotype is relatively homogeneous across patients.
  evidence:
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum of DNM1-related encephalopathy is relatively
      homogeneous, in contrast to many other genetic epilepsies.
    explanation: >-
      Documents the relatively homogeneous clinical course of DNM1 encephalopathy.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures, including infantile spasms and Lennox-Gastaut syndrome, are managed
    with antiseizure medications and spasm-directed therapies; response is often
    incomplete. No agent corrects the underlying dynamin-1 fission defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

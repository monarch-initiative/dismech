    term:
      id: UBERON:0001950
      label: neocortex
  evidence:
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A common phenotype emerged that included severe to profound intellectual
      disability and muscular hypotonia in all patients and an epilepsy

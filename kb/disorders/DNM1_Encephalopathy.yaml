diagnosis:
- name: DNM1 Molecular Diagnosis
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic DNM1 variant,
    typically de novo and clustering in the GTPase or middle domain, in a child
    with early-onset epileptic encephalopathy, hypotonia, and profound
    developmental impairment.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
    qualifiers:

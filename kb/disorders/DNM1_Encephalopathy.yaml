  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations cluster within the GTPase or middle domains, and structural
      modeling and existing functional data suggest a dominant-negative effect on
      DMN1 function.
    explanation: >-
      Establishes the GTPase/middle-domain clustering and dominant-negative
      mechanism of DNM1 variants.
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients (33.3%) carried the recurrent p.Arg237Trp mutation.
    explanation: >-
      Documents the recurrent p.Arg237Trp variant as the most common DNM1 allele.
  downstream:
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    causal_link_type: DIRECT
- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  conforms_to: "synaptic_vesicle_cycle#Impaired Synaptic Vesicle Endocytosis and Recycling"
  description: >-
    Dynamin-1 is the fission GTPase that pinches off endocytosing synaptic vesicles
    from the presynaptic plasma membrane to regenerate the recycling vesicle pool.
    Dominant-negative impairment of dynamin-1 slows vesicle fission and retrieval,
    depleting release-ready vesicles during sustained neuronal firing and causing
    activity-dependent synaptic transmission failure — the "vesicle fission"
    disease.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle endocytosis
    term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:15217342
    reference_title: "The synaptic vesicle cycle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focal point of the vesicle cycle is Ca2+-triggered exocytosis that is
      followed by different routes of endocytosis and recycling.
    explanation: >-
      Establishes endocytosis/recycling as the vesicle-cycle arm mediated by
      dynamin-1 and disrupted in this disorder.
  - reference: PMID:25262651
    reference_title: "De novo mutations in synaptic transmission genes including DNM1 cause epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We bring statistical evidence that mutations in DNM1 cause epileptic
      encephalopathy
    explanation: >-
      Establishes DNM1 (dynamin-1) loss as a cause of epileptic encephalopathy via
      disrupted synaptic transmission.
  downstream:
  - target: Reduced Neurotransmission and Cortical Hyperexcitability
    causal_link_type: DIRECT
- name: Reduced Neurotransmission and Cortical Hyperexcitability
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Activity-dependent failure of vesicle recycling disturbs the balance of
    cortical synaptic transmission, producing neuronal hyperexcitability and a
    severe early-onset epilepsy that characteristically begins with infantile
    spasms and often evolves into Lennox-Gastaut syndrome, alongside impaired
    activity-dependent neurodevelopment.
  role: effector
  cell_types:
  - preferred_term: neuron
    term:

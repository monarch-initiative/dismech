      label: Autosomal dominant inheritance
  description: >-
    Nearly all cases are de novo; a dominant-negative mechanism means a single
    heterozygous variant impairs the dynamin-1 oligomer. A rare inherited sibling
    pair from a mosaic parent has been reported.
  evidence:
  - reference: PMID:28667181
    reference_title: "DNM1 encephalopathy: A new disease of vesicle fission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 19 patients with de novo mutations in DNM1 and a sibling pair
      who had an inherited mutation from a mosaic parent.
    explanation: >-
      Establishes the predominantly de novo dominant genetic basis, with a rare
      mosaic-inherited exception.
pathophysiology:
- name: Dominant-Negative Dynamin-1 Dysfunction
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    De novo missense variants in DNM1 cluster in the GTPase and middle domains of
    dynamin-1 and act by a dominant-negative mechanism: mutant subunits incorporate
    into the dynamin oligomer that assembles around the neck of an endocytosing
    vesicle and poison its GTP-dependent fission activity. The recurrent
    p.Arg237Trp variant accounts for about one-third of cases.
  role: trigger
  cell_types:

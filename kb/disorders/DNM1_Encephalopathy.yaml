name: DNM1 Encephalopathy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A developmental and epileptic encephalopathy caused by de novo variants in DNM1,
  which encodes the presynaptic large GTPase dynamin-1 that mediates the fission
  step of synaptic vesicle endocytosis — the retrieval and recycling arm of the
  synaptic vesicle cycle. Pathogenic variants cluster in the GTPase and middle
  domains and act by a dominant-negative mechanism (impairing the function of
  wild-type dynamin-1 in the oligomer), producing a relatively homogeneous
  phenotype of severe-to-profound intellectual disability, muscular hypotonia, and
  an epilepsy that typically begins with infantile spasms and frequently evolves
  into Lennox-Gastaut syndrome. It is one of the synaptic vesicle cycle disorders
  and represents the endocytic/recycling arm of that mechanism, complementary to
  the docking/priming (STXBP1, UNC13A) and fusion (SYT1, SNAREs) disorders.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy

differential_diagnoses:
- name: Other progressive myoclonus epilepsies
  description: >-
    Unverricht-Lundborg disease, Lafora disease, the neuronal ceroid lipofuscinoses, MERRF
    and sialidosis all present with the same triad of myoclonus, seizures and cognitive
    decline. CERS1 is not distinguishable from them clinically, and the group is genetically
    heterogeneous enough that testing is gene-agnostic.
  distinguishing_features:
  - >-
    Distinguished by molecular genetic testing rather than by clinical features; over 70
    percent of progressive myoclonus epilepsy cases are now molecularly solved.
  - >-
    Age at onset between 6 and 16 years overlaps with Unverricht-Lundborg and Lafora disease
    and does not discriminate.
  evidence:
  - reference: PMID:33798445
    reference_title: "Progressive myoclonus epilepsies-Residual unsolved cases have marked genetic heterogeneity including dolichol-dependent protein glycosylation pathway genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive myoclonus epilepsies (PMEs) comprise a group of clinically and
      genetically heterogeneous rare diseases"
    explanation: >-
      Establishes the clinical and genetic heterogeneity that makes this a molecular rather
      than a clinical differential.

- name: SMA-PME (ASAH1-related)
  description: >-
    Spinal muscular atrophy with progressive myoclonic epilepsy, caused by ASAH1 variants.
    It is the closest mechanistic neighbour rather than merely another entry on the list:
    ASAH1 encodes acid ceramidase, which degrades ceramide, while CERS1 synthesizes it.
    Two opposite lesions in the same lipid produce overlapping progressive myoclonus
    epilepsy - which is an argument that ceramide homeostasis rather than ceramide abundance
    is what neurons require.
  distinguishing_features:
  - >-
    Lower motor neuron disease with muscle weakness and denervation is a defining feature of
    SMA-PME and is not described in CERS1-related disease.
  evidence:
  - reference: PMID:27647482
    reference_title: "Spinal muscular atrophy associated with progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A rare syndrome characterized by lower motor neuron disease associated with
      progressive myoclonic epilepsy, referred to as \"spinal muscular atrophy associated
      with progressive myoclonic epilepsy\" (SMA-PME)"
    explanation: >-
      Defines the syndrome and names the lower motor neuron involvement that distinguishes
      it.

discussions:

- discussion_id: mismatch_er_stress_rests_on_a_neuroblastoma_knockdown
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Endoplasmic Reticulum Stress Response
  prompt: >-
    Does ER stress and proapoptotic signalling after CerS1 knockdown in a neuroblastoma line
    report what happens in a CERS1-deficient human neuron?
  rationale: >-
    This is the entry's weakest link and it sits in the middle of the canonical mechanism.
    The claim that loss of CerS1 causes ER stress and apoptosis comes from acute
    downregulation in a tumour-derived cell line. Three gaps separate that from the disease.
    Neuroblastoma cells are proliferating and transformed, with a lipid metabolism unlike a
    post-mitotic neuron's. Acute knockdown is not the same as lifelong reduced activity, and
    an acute drop is far more likely to provoke a stress response than a chronic set-point
    change. And the human variant reduces C18-ceramide rather than abolishing the enzyme,
    while the knockdown removes it. The mouse work, which is the better model, measures
    lipids and storage material but does not report an unfolded protein response - so the ER
    stress account is not independently corroborated.
  proposed_experiments:
  - experiment_id: exp_upr_markers_in_patient_neurons
    name: Unfolded protein response markers in patient-derived neurons at endogenous CerS1
    description: >-
      Differentiate neurons from CERS1 patient iPSCs and isogenic controls, and measure UPR
      branch activation, C18-ceramide, and apoptotic markers over extended culture without
      any knockdown. If chronic partial CerS1 deficiency in a post-mitotic human neuron does
      not engage the UPR, the canonical mechanism needs replacing with the sphingolipid
      homeostasis account rather than supplementing.

- discussion_id: gap_human_and_mouse_regional_patterns_disagree
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Degeneration
  - pathophysiology#Progressive Myoclonus Epilepsy Syndrome
  prompt: >-
    Why does CerS1 loss produce cerebellar Purkinje cell degeneration in mice and a
    cortical-type myoclonic epilepsy with dementia in humans?
  rationale: >-
    Both species lose the same enzyme, and in the mouse the loss is complete. Yet the mice
    are ataxic with Purkinje cell death and the patients have myoclonus, generalized seizures
    and dementia with variable ataxia. No source available to this entry reports seizures in
    the mutant mice at all, which means the defining feature of the human disease has no
    model. Several readings are open: CerS1 expression or the ceramide requirement may differ
    regionally between species; the human hypomorphic allele may spare cell types a null
    would kill; or the lipofuscin accumulation, which the mouse shows across many brain
    regions rather than only the cerebellum, may be the better correlate of the human
    phenotype than the Purkinje cell death is. Which of these holds determines whether the
    mouse can be used to test therapy for the human disease.
  proposed_experiments:
  - experiment_id: exp_eeg_and_regional_lipidomics_in_cers1_mutants
    name: EEG phenotyping and region-resolved lipidomics in Cers1 mutant mice
    description: >-
      Record chronic EEG in flincher and toppler mice to establish whether epileptiform
      activity is present but unreported, and pair this with region-resolved C18-ceramide
      measurement across cerebellum, cortex and hippocampus in both species where tissue
      permits. A mouse with subclinical cortical epileptiform activity would reconcile the
      two phenotypes; a mouse with none would mean the model cannot serve the epilepsy arm.

- discussion_id: gap_why_ceramide_loss_and_ceramide_excess_converge
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced C18-Ceramide
  prompt: >-
    Failing to make ceramide (CERS1) and failing to degrade it (ASAH1) both cause progressive
    myoclonus epilepsy. What does that convergence mean?
  rationale: >-
    CERS1 disease and SMA-PME are opposite lesions in the same lipid, and they produce
    overlapping syndromes. The naive reading - that neurons need a particular ceramide
    abundance and suffer on either side of it - is possible but not obviously right, because
    the two enzymes act on different pools and different acyl chain lengths, and acid
    ceramidase failure causes lysosomal storage while ceramide synthase failure does not.
    An alternative reading is that both diseases converge on flux rather than abundance:
    what neurons require is turnover through the sphingolipid pathway, and blocking it at
    either end is equivalent. The founding mouse paper's own caution is relevant here - it
    states that whether sphingolipid changes in neurodegenerative disease are pathological
    events or homeostatic responses remains largely unclear, which is exactly the question
    this convergence poses.
  proposed_experiments:
  - experiment_id: exp_flux_versus_abundance_in_paired_models
    name: Sphingolipid flux versus steady-state abundance in paired CERS1 and ASAH1 models
    description: >-
      Apply stable-isotope tracing to measure sphingolipid pathway flux, alongside
      steady-state lipidomics, in neurons from CERS1-deficient and ASAH1-deficient models
      side by side. If the two share a flux signature while their abundance profiles diverge,
      flux is the neuronal requirement and the convergence is explained; if abundance of a
      shared species is what they share, the naive reading holds.

notes: >-
  Scope and evidence base. This entry curates progressive myoclonic epilepsy type 8, the
  CERS1 disorder. The human literature is genuinely thin - the founding report of four
  affected siblings in one Algerian family, a review restating that family, one further
  family recovered by a systematic exome study of unsolved PME cases, and an isolated later
  case whose record caches as metadata without an abstract, so nothing in it is
  quotable. As a result no frequency bands are asserted anywhere in this entry, and much of
  the mechanistic weight is carried by the two spontaneous mouse mutants. That imbalance is
  the honest state of the disease and is recorded rather than disguised.
  Gene naming. The mouse literature calls the gene Lass1 and the human literature calls it
  CERS1. They are the same gene; LASS1 is a previous HGNC symbol. This is noted in the
  genetic section so a curator does not treat the older name as a separate locus.
  Module conformance attaches at
  epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures, the clinical
  endpoint, and deliberately not at the excitation-inhibition or hyperexcitability nodes. No
  source available to this entry measures excitability, synaptic function or network
  synchrony in CerS1-deficient neurons; the established mechanism is neurodegenerative and
  the epilepsy is observed rather than explained. Attaching upstream would let the module
  supply a claim the evidence does not make.
  No GeneReviews chapter exists for CERS1 or EPM8. This was checked directly against PubMed
  (CERS1[TIAB] AND GeneReviews[BOOK] returns zero results); the chapters that surface for
  "progressive myoclonic epilepsy GeneReviews" cover Lafora disease and AFG3L2-related
  disorders, not this gene.
  Deep research provenance. The claude_code report carried needs_review true with 5 of 5
  references resolved and confabulation_rate 0.0, but quotes_valid 0 of 1: the single quoted
  claim, attributed to PMID:21625621, was a paraphrase that elided part of the sentence. The
  validator printed the true sentence, and this entry quotes that sentence rather than the
  report's version. The report cited only three PMIDs, which is too thin for an entry; six
  further references were found by direct PubMed search and fetched independently.

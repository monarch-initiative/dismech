name: Progressive Myoclonic Epilepsy Type 8
creation_date: "2026-08-20T19:00:00Z"
category: Mendelian
synonyms:
- EPM8
- Progressive myoclonus epilepsy type 8
- CERS1-related progressive myoclonic epilepsy
- Progressive myoclonus epilepsy due to impaired ceramide synthesis
description: >-
  Progressive myoclonic epilepsy type 8 is an autosomal recessive progressive myoclonus
  epilepsy caused by biallelic variants in CERS1, which encodes ceramide synthase 1. CerS1
  is an endoplasmic reticulum transmembrane enzyme that makes C18-ceramide, and it is the
  ceramide synthase of neurons. Losing it lowers C18-ceramide, triggers an ER stress
  response and induces proapoptotic signalling, producing myoclonus, generalized
  tonic-clonic seizures and progressive cognitive decline from school age. It is the
  disorder that established impaired ceramide biosynthesis as a cause of human
  neurodegeneration, and it remains among the rarest of the progressive myoclonus
  epilepsies - the human evidence rests on very few families, and much of the mechanistic
  weight is carried by two spontaneous mouse mutants.
disease_term:
  preferred_term: progressive myoclonic epilepsy type 8
  term:
    id: MONDO:0014545
    label: progressive myoclonic epilepsy type 8
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CERS1 variants. The founding report described four affected siblings
    homozygous for a nonsynonymous variant in a consanguineous family.
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous nonsynonymous mutation in CERS1, the gene encoding
      ceramide synthase 1, in 4 siblings affected by a progressive disorder with myoclonic
      epilepsy and dementia"
    explanation: >-
      Establishes the recessive architecture and the size of the founding pedigree.

pathophysiology:

- name: CERS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. CerS1 is a transmembrane protein of the endoplasmic reticulum
    that catalyzes the biosynthesis of C18-ceramides. Of the six mammalian ceramide
    synthases, CerS1 is the neuronal one, and its acyl-chain specificity is what makes the
    disorder neurological rather than systemic: the enzyme is not making ceramide in general,
    it is making one chain length that neurons depend on.
  genes:
  - preferred_term: CERS1
    term:
      id: hgnc:14253
      label: CERS1
  molecular_functions:
  - preferred_term: sphingosine N-acyltransferase activity
    term:
      id: GO:0050291
      label: sphingosine N-acyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CerS1, a transmembrane protein of the endoplasmic reticulum (ER), catalyzes
      the biosynthesis of C18-ceramides"
    explanation: >-
      The enzyme's localization and its specific product, both of which the downstream
      mechanism depends on.
  downstream:
  - target: Reduced C18-Ceramide
    causal_link_type: DIRECT
    description: >-
      Loss of catalytic activity lowers the product.

- name: Reduced C18-Ceramide
  biological_scale: MOLECULAR
  description: >-
    The measured biochemical consequence. The patient variant decreases C18-ceramide levels,
    and in the mouse the equivalent lesion abolishes CerS1 catalytic activity outright,
    reducing sphingolipid biosynthesis across the brain and shifting steady-state levels of
    sphingolipids and sphingoid bases. Ceramide is not only a membrane building block but a
    signalling lipid, which is why a change in its abundance has consequences beyond
    structure.
  chemical_entities:
  - preferred_term: ceramide
    term:
      id: CHEBI:17761
      label: ceramide
    modifier: DECREASED
  biological_processes:
  - preferred_term: ceramide biosynthetic process
    term:
      id: GO:0046513
      label: ceramide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated that the mutation decreases C18-ceramide levels"
    explanation: >-
      The direct biochemical measurement in the human variant.
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both fln and to mutations caused complete loss of CerS1 catalytic activity,
      which resulted in a reduction in sphingolipid biosynthesis in the brain and dramatic
      changes in steady-state levels of sphingolipids and sphingoid bases"
    explanation: >-
      The mouse equivalent, showing the brain-wide lipid consequence that the human study
      could not measure in tissue.
  downstream:
  - target: Endoplasmic Reticulum Stress Response
    causal_link_type: DIRECT
    description: >-
      Established by knockdown rather than in patient neurons - see the discussion.
  - target: Lipofuscin Accumulation with Ubiquitylated Proteins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A mouse finding whose route from the lipid defect is not established.

- name: Endoplasmic Reticulum Stress Response
  biological_scale: CELLULAR
  description: >-
    Downregulating CerS1 in a neuroblastoma cell line triggers an ER stress response and
    induces proapoptotic pathways. That CerS1 sits in the ER membrane makes this the
    expected place for the consequence to appear. The node is curated from a knockdown in a
    tumour-derived cell line, which is the entry's principal evidential limitation and is
    recorded as its own discussion rather than glossed.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we showed that downregulation of CerS1 in a neuroblastoma cell line triggers
      ER stress response and induces proapoptotic pathways"
    explanation: >-
      The cellular mechanism, with the model system named in the quote itself so the
      limitation travels with the claim.
  downstream:
  - target: Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proapoptotic signalling in a cell line is not the same as neuronal loss in a brain,
      and no source available to this entry bridges them in human tissue.

- name: Lipofuscin Accumulation with Ubiquitylated Proteins
  biological_scale: CELLULAR
  description: >-
    In CerS1-deficient mice, lipofuscin accumulates together with ubiquitylated proteins
    across many brain regions - a storage-disease-like picture in what is otherwise a
    biosynthetic defect. This matters for the differential: lipofuscin accumulation is the
    defining feature of the neuronal ceroid lipofuscinoses, several of which also present as
    progressive myoclonus epilepsy. Whether the same accumulation occurs in human CERS1
    disease is not established.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition to Purkinje cell death, deficiency of CerS1 function also induced
      accumulation of lipofuscin with ubiquitylated proteins in many brain regions"
    explanation: >-
      The storage phenotype in the mouse, and its distribution beyond the cerebellum.

- name: Neuronal Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive neuronal loss. In the mouse the degeneration is strikingly regional - the
    two independent Lass1 mutants both present as cerebellar ataxia with Purkinje cell
    degeneration - whereas the human disorder leads with myoclonic epilepsy and dementia and
    ataxia is variable. The entry curates the human and mouse regional patterns as
    different, because they are, and does not smooth one into the other.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identified two mouse strains, flincher (fln) and toppler (to), with
      spontaneous recessive mutations that cause cerebellar ataxia and Purkinje cell
      degeneration"
    explanation: >-
      The neurodegenerative phenotype in two independently arising mutants, which is what
      makes the mouse evidence more than a single-allele observation.
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study demonstrates that impairment of ceramide biosynthesis underlies
      neurodegeneration in humans"
    explanation: >-
      The study's own conclusion, and the claim that gives this disorder its significance
      beyond its rarity.
  downstream:
  - target: Progressive Myoclonus Epilepsy Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No source available to this entry measures excitability, synaptic function or network
      synchrony in CerS1-deficient neurons, so the step from degeneration to seizures is
      inferential.

- name: Progressive Myoclonus Epilepsy Syndrome
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    The clinical endpoint: action myoclonus, generalized tonic-clonic seizures and
    progressive cognitive decline, with onset between 6 and 16 years. Conformance attaches
    at the module's Recurrent Unprovoked Seizures node rather than at the
    excitation-inhibition or hyperexcitability nodes, because nothing in the available
    evidence measures excitability in this disorder - the mechanism is established as
    neurodegenerative, and the epileptic consequence is observed rather than explained.
  evidence:
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an unusual, severe form of progressive myoclonus epilepsy characterized by
      myoclonus, generalized tonic-clonic seizures and moderate to severe cognitive
      impairment, with probable autosomal recessive inheritance. Disease onset was between 6
      and 16 years of age"
    explanation: >-
      The clinical syndrome and its age range, in the one described family.

mechanistic_hypotheses:
- hypothesis_group_id: er_stress_apoptosis_model
  status: CANONICAL
  description: >-
    Loss of C18-ceramide destabilizes ER homeostasis in neurons, the unfolded protein
    response is engaged, and sustained ER stress drives apoptotic neuronal loss. This is the
    account the founding study advanced and it fits the enzyme's ER localization. Its
    evidential base is a knockdown in a neuroblastoma line rather than patient or model
    neurons.
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "downregulation of CerS1 in a neuroblastoma cell line triggers ER stress
      response and induces proapoptotic pathways"
    explanation: >-
      The experimental basis for the model.

- hypothesis_group_id: sphingolipid_membrane_homeostasis_model
  status: ALTERNATIVE
  description: >-
    The primary defect is a broader failure of neuronal sphingolipid homeostasis rather than
    an ER stress response specifically: brain sphingolipid biosynthesis falls and
    steady-state sphingolipid and sphingoid base levels shift dramatically, and it is that
    altered membrane and signalling lipid composition - evidenced by the lipofuscin and
    ubiquitylated protein accumulation - that degrades neurons over time. The mouse data
    speak more directly to this account than to the ER stress one, since they measure
    brain lipids and show a storage phenotype rather than showing an unfolded protein
    response. The two are not exclusive and may be sequential.
  evidence:
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a reduction in sphingolipid biosynthesis in the brain and dramatic changes in
      steady-state levels of sphingolipids and sphingoid bases"
    explanation: >-
      The brain-wide lipid disturbance this account is built on.
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "it remains largely unclear whether sphingolipid changes in these diseases are
      pathological events or homeostatic responses"
    explanation: >-
      Curated PARTIAL, and quoted deliberately against the hypothesis it belongs to: the
      same paper states that the causal direction of sphingolipid changes in
      neurodegeneration is unresolved in general.

phenotypes:

- category: Neurological
  name: Myoclonus
  description: >-
    Progressively worsening myoclonus, the defining feature of the progressive myoclonus
    epilepsy syndrome.
  phenotype_term:
    preferred_term: Myoclonus
    term:
      id: HP:0001336
      label: Myoclonus
  evidence:
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by myoclonus, generalized tonic-clonic seizures and moderate to
      severe cognitive impairment"
    explanation: >-
      Names myoclonus as a defining feature. The reported cohort is a single family, so no
      frequency band is asserted anywhere in this entry.

- category: Neurological
  name: Generalized Tonic-Clonic Seizures
  description: >-
    Generalized tonic-clonic seizures accompanying the myoclonus.
  phenotype_term:
    preferred_term: Bilateral tonic-clonic seizure
    term:
      id: HP:0002069
      label: Bilateral tonic-clonic seizure
  evidence:
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "myoclonus, generalized tonic-clonic seizures and moderate to severe cognitive
      impairment"
    explanation: >-
      Names the seizure type in the reported family.

- category: Neurological
  name: Progressive Cognitive Decline
  description: >-
    Moderate to severe cognitive impairment that worsens over time. The founding report
    described the affected siblings as having myoclonic epilepsy and dementia, which is the
    combination that places this disorder in the progressive myoclonus epilepsy group rather
    than among the static epilepsies.
  phenotype_term:
    preferred_term: Mental deterioration
    term:
      id: HP:0001268
      label: Mental deterioration
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "4 siblings affected by a progressive disorder with myoclonic epilepsy and
      dementia"
    explanation: >-
      Establishes the progressive cognitive component alongside the epilepsy.
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate to severe cognitive impairment"
    explanation: >-
      Records the severity range as reported.

- category: Neurological
  name: Ataxia
  description: >-
    Ataxia is variable in the human disorder but is the dominant feature of the mouse model,
    where both independent mutants present with cerebellar ataxia. One reported human case
    was described as having prominent ataxia, which is why it is curated - but the
    human-mouse difference in prominence is real and is recorded in the discussion rather
    than averaged away.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "spontaneous recessive mutations that cause cerebellar ataxia and Purkinje cell
      degeneration"
    explanation: >-
      Curated PARTIAL and MODEL_ORGANISM deliberately. This is mouse evidence supporting a
      human phenotype, which the evidence policy warns against relying on alone. The human
      case report describing prominent ataxia (PMID:30800706) caches as metadata without an
      abstract, so no quotable human sentence is available to pair with it.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Extremely rare even among the progressive myoclonus epilepsies. As of the cited review
    the disorder had been reported in a single family of Algerian origin; a further isolated
    case has since been described, and a systematic exome study of 78 unsolved PME-affected
    individuals returned CERS1 in one further family. Progressive myoclonus epilepsies as a
    group are rare, and CERS1 is among the rarest causes within them.
  evidence:
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide
      synthesis is an extremely rare condition, so far reported in a single family of
      Algerian origin"
    explanation: >-
      The reported case count at the time of this review, and the source's own
      characterization of the rarity.
  - reference: PMID:33798445
    reference_title: "Progressive myoclonus epilepsies-Residual unsolved cases have marked genetic heterogeneity including dolichol-dependent protein glycosylation pathway genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in five families, we identified variants in established PME genes; three with
      intronic or copy-number changes (CLN6, GBA, NEU1) and two very rare causes (ASAH1,
      CERS1)"
    explanation: >-
      An additional CERS1-solved family, found by systematically exome-sequencing 78 unsolved
      PME cases. This is the quantitative anchor for the rarity claim: across a cohort
      assembled specifically to find residual PME causes, CERS1 accounted for one family, and
      the authors class it among the very rare causes.

genetic:
- name: CERS1
  gene_term:
    preferred_term: CERS1
    term:
      id: hgnc:14253
      label: CERS1
  relationship_type: CAUSATIVE
  association: >-
    Biallelic CERS1 variants cause progressive myoclonic epilepsy type 8. The founding
    variant is a homozygous nonsynonymous change identified in four affected siblings, shown
    to decrease C18-ceramide levels. CERS1 is one of six mammalian ceramide synthases, each
    with a distinct fatty acyl-CoA chain-length preference; CerS1 is the neuronal enzyme and
    makes C18-ceramide, which is what confines the disease to the nervous system.
  evidence:
  - reference: PMID:24782409
    reference_title: "Impairment of ceramide synthesis causes a novel progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous nonsynonymous mutation in CERS1, the gene encoding
      ceramide synthase 1"
    explanation: >-
      The gene-disease assertion.
  - reference: PMID:21625621
    reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Positional cloning demonstrated that these mutations reside in the Lass1 gene.
      Lass1 encodes (dihydro)ceramide synthase 1 (CerS1), which is highly expressed in
      neurons"
    explanation: >-
      Independent genetic evidence from the mouse, and the neuronal expression pattern that
      explains the tissue restriction. Lass1 is the former name of the gene now called Cers1.
  notes: >-
    The gene has been known under two names and both appear in the literature cited here.
    The mouse study calls it Lass1, for longevity assurance homolog 1; the human study calls
    it CERS1. They are the same gene, and a curator meeting the older name in a search
    should not treat it as a separate locus. The HGNC record carries LASS1 as a previous
    symbol.

diagnosis:
- name: Molecular Genetic Testing
  description: >-
    The diagnosis is molecular. Progressive myoclonus epilepsy is a syndromic diagnosis with
    many genetic causes, and the yield of genetic testing across the group is now high, so
    CERS1 is reached through a panel or exome rather than suspected on clinical grounds -
    nothing in the phenotype points to ceramide synthase specifically.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41817056
    reference_title: "Progressive Myoclonic Epilepsies - A Pragmatic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features and genetic underpinnings of PME are diverse, with
      approximately 80% of individuals now able to receive a molecular diagnosis"
    explanation: >-
      Establishes that molecular diagnosis is achievable for most patients with this
      syndrome, which is what makes gene-agnostic testing the route to a CERS1 diagnosis.
  - reference: PMID:33798445
    reference_title: "Progressive myoclonus epilepsies-Residual unsolved cases have marked genetic heterogeneity including dolichol-dependent protein glycosylation pathway genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive myoclonus epilepsies (PMEs) comprise a group of clinically and
      genetically heterogeneous rare diseases. Over 70% of PME cases can now be molecularly
      solved"
    explanation: >-
      The genetic heterogeneity that makes broad testing necessary, with a second yield
      estimate from an independent review.

treatments:
- name: Antiseizure Medication
  description: >-
    Management is symptomatic. No disease-modifying therapy exists and no agent has efficacy
    evidence specific to CERS1-related disease. Treatment follows general progressive
    myoclonus epilepsy practice: valproic acid is the usual first-line antiseizure medication,
    while sodium channel blockers and GABAergic drugs are conventionally avoided because they
    can exacerbate myoclonus. Both claims are curated from evidence about the progressive
    myoclonus epilepsy group; no source states either for this disorder specifically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  evidence:
  - reference: PMID:41817056
    reference_title: "Progressive Myoclonic Epilepsies - A Pragmatic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproic acid is often the first-line ASM in treating PME due to its high
      effectiveness on myoclonus, seizures, and photosensitivity, except in MERRF."
    explanation: >-
      Names the first-line agent and the reason for choosing it. Curated PARTIAL because the
      recommendation is made for the progressive myoclonus epilepsy group as a whole; no
      study has tested valproate in CERS1-related disease.
  - reference: PMID:41817056
    reference_title: "Progressive Myoclonic Epilepsies - A Pragmatic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Sodium channel blockers (phenytoin, carbamazepine, and oxcarbazepine) and
      GABAergic drugs (gabapentin, pregabalin, and vigabatrin) are to be avoided, as these
      drugs may exacerbate myoclonus and myoclonic seizures."
    explanation: >-
      Supports the agents-to-avoid caveat asserted in this entry's description, named to the
      individual drug and with the mechanism of harm. Curated PARTIAL for the same reason: it
      is a group-level recommendation, not a CERS1-specific one.
  notes: >-
    Everything curated here is progressive myoclonus epilepsy practice applied to a disorder
    in which no drug has actually been studied - the reported literature is essentially one
    family plus isolated cases. The mechanism suggests ceramide supplementation or ER stress
    modulation as rational targets, but neither has been tested and neither is curated as a
    treatment.

- name: Genetic Counseling
  description: >-
    Autosomal recessive counseling with a 25 percent recurrence risk per pregnancy. Relevant
    in practice because the reported families are consanguineous, where carrier frequency
    within the kindred is elevated.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27618929
    reference_title: "Autosomal recessive progressive myoclonus epilepsy due to impaired ceramide synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with probable autosomal recessive inheritance"
    explanation: >-
      The inheritance mode on which the recurrence risk depends.

animal_models:
- name: Lass1/Cers1 flincher and toppler mice
  species: Mouse
  genotype: spontaneous recessive Lass1 (Cers1) mutations, flincher (fln) and toppler (to)
  publication: PMID:21625621
  description: >-
    Two independently arising spontaneous mouse mutants mapping to the same gene, both
    abolishing CerS1 catalytic activity. Their independence is what makes them evidentially
    strong: two separate mutational events producing the same phenotype in the same gene is
    much harder to attribute to background than a single engineered allele would be.
  modeled_mechanisms:
  - target: Reduced C18-Ceramide
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      The mouse alleles abolish catalytic activity completely, whereas the human founding
      variant is a nonsynonymous change that decreases C18-ceramide rather than eliminating
      the enzyme. The model therefore tests the null state, not the patient allele, and may
      overstate severity.
    description: >-
      Complete loss of CerS1 activity with brain-wide sphingolipid consequences.
    readouts:
    - name: Brain sphingolipid and sphingoid base levels
      target: Reduced C18-Ceramide
      direction: ALTERED
      interpretation: >-
        Sphingolipid biosynthesis falls and steady-state sphingolipid and sphingoid base
        levels shift substantially. ALTERED rather than DECREASED because the source reports
        a change in the profile, not a uniform fall.
      evidence:
      - reference: PMID:21625621
        reference_title: "A deficiency of ceramide biosynthesis causes cerebellar purkinje cell neurodegeneration and lipofuscin accumulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a reduction in sphingolipid biosynthesis in the brain and dramatic changes

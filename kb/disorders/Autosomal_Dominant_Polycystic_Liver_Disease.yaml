pathophysiology:
- name: Somatic inactivation in biliary cyst epithelium
  description: >-
    Acquired loss of the remaining functional PRKCSH or SEC63 allele can deepen a germline defect
    in focal cyst epithelium. Detection is gene-, tissue- and assay-dependent; human data do
    not demonstrate a detected second hit in every cyst or directly establish its time of initiation.
  genes:
  - preferred_term: PRKCSH
    term:
      id: hgnc:9411
      label: PRKCSH
  - preferred_term: SEC63

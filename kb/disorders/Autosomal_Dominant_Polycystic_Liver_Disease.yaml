    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21856269
    reference_title: >-
      Secondary, somatic mutations might promote cyst formation in patients with autosomal dominant
      polycystic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The wild-type allele of PRKCSH was lost (LOH) in 76% of cysts (54/71).
    explanation: >-
      Laser-microdissected cyst epithelia from eight surgical patients; this is a cyst-level
      result, not penetrance in carriers.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23209713
    reference_title: Loss of heterozygosity is present in SEC63 germline carriers with polycystic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found LOH in one of the 14 cysts of patient  # 3, while somatic mutations were conspicuously
      absent from samples from the other 2 patients (38 cysts).
    explanation: >-
      Only the patient with 14 cysts carried a convincing truncating allele. The other two shared
      a variant not enriched in cases; formalin fixation prevented complete somatic sequencing
      in the truncating-allele patient.
    quote_role: PRIMARY_RESULT

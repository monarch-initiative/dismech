diagnosis:
- name: Abdominal ultrasonography
  description: >-
    Ultrasound establishes cyst distribution in liver and kidneys. EASL uses more than ten hepatic
    cysts as a general PLD criterion; family-based criteria may recognize younger at-risk relatives
    with fewer cysts. Liver cysts alone do not distinguish ADPLD from liver-predominant ADPKD.
    Cyst morphology and communication with the biliary tree guide alternative diagnoses.
  diagnosis_term:
    preferred_term: ultrasonography procedure
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:23296249
    reference_title: Diagnosis and management of polycystic liver disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ultrasonography is very useful for achieving a correct diagnosis of a polycystic liver
      and to differentiate between ADPKD and PCLD.
    explanation: This review directly supports ultrasonography for diagnosis and differential separation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Ultrasonography is the first instrument to assess liver phenotype.
    explanation: This review identifies ultrasonography as the first imaging instrument for liver phenotype assessment.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Current diagnosis of PLD is made in the presence of >10 hepatic cysts.
    explanation: General guideline criterion; clinical family context remains important.
    quote_role: REVIEW_SYNTHESIS
- name: CT or MRI liver volume assessment
  description: >-
    CT or MRI defines cyst distribution, vascular compression, residual parenchyma and height-adjusted
    liver volume for treatment planning. Volume and symptom burden are separate measures. Age-adjusted
    progression estimates are promising but the 80-patient tertiary-center derivation cohort
    was retrospective, often relied on single imaging, included VUS in some analyses and requires
    external validation.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Total liver and kidney volumes can be measured and correlated with clinical endpoints.
  evidence:
  - reference: PMID:36246085
    reference_title: Modelling polycystic liver disease progression using age-adjusted liver volumes and targeted mutational analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified genotypes were correlated with total liver and kidney volume (assessed by CT
      or MRI), organ function, co-morbidities, and clinical endpoints.
    explanation: The cohort used CT or MRI liver-volume assessment for genotype-phenotype and outcome correlation.
  - reference: PMID:36246085
    reference_title: Modelling polycystic liver disease progression using age-adjusted liver volumes and targeted mutational analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, most patients had single imaging only but no longitudinal imaging data,
      impeding intra-individual liver growth assessment.
    explanation: 'Full-text limitation: estimated growth from age and volume is not directly measured longitudinal growth.'
    quote_role: PRIMARY_RESULT
- name: Molecular genetic testing
  description: >-
    Use genetic counseling and an appropriate cystic kidney/liver panel when the phenotype,
    family history or reproductive question warrants clarification. Include deletion/duplication
    assessment and consider splice-region or other variants missed by routine coding analysis.
    A negative panel does not exclude ADPLD, and a VUS does not confirm it. Genetic testing
    is not routine screening for asymptomatic relatives solely to find liver cysts.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Ambiguous imaging or screening may be assisted by genetic counseling and molecular diagnostics.
    explanation: The review supports molecular diagnostics when imaging or screening is ambiguous.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38097330
    reference_title: Genetic Spectrum of Polycystic Kidney and Liver Diseases and the Resulting Phenotypes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      employing a next-generation sequencing panel containing all known PKD and ciliopathy genes
      is recommended for clinical testing.
    explanation: The genetics review supports broad NGS-panel clinical testing because of gene and phenotype overlap.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Genetic testing should not be used to screen for PLD
    explanation: EASL distinguishes screening from diagnostic or reproductive use.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29243290
    reference_title: A noncoding variant in GANAB explains isolated polycystic liver disease (PCLD) in a large family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The family T90 variant was initially filtered out by our standard whole exome sequence
      analysis pipeline due to its intronic annotation.
    explanation: Full text demonstrates a specific coding-filter blind spot, not universal failure of exome sequencing.
    quote_role: PRIMARY_RESULT
- name: PLD symptom and nutritional assessment
  description: >-
    Assess PLD-Q or POLCA scores alongside imaging to attribute symptoms and monitor response.
    Evaluate intake, functional muscle loss and sarcopenia; a heavy cystic liver can mask weight
    loss. The 2026 suggested PROM and volume thresholds are consensus aids, not validated predictors
    of individual drug response.
  evidence:
  - reference: PMID:41328663
    reference_title: >-
      Medical Management of Polycystic Liver Disease: A Position Statement From the European
      Reference Network on Hepatological Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: However, so far there is no robust cut‐off level, that predicts response to SSA therapy in both scoring systems.
    explanation: Full-text caveat limits numerical PLD-Q/POLCA threshold interpretation.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Somatostatin analogue therapy
  description: >-
    Long-acting octreotide or lanreotide can modestly reduce or stabilize liver volume in symptomatic
    diffuse PLD. These uses remain off-label as described in the 2026 ERN statement. Assess
    symptoms and consistent volumetry over 6–12 months; response can include symptom relief
    with volume stabilization. Benefit can persist during ongoing treatment for several years,
    while withdrawal can cause rebound. Monitor gastrointestinal intolerance, glucose disturbance,
    gallstones, injection reactions and cyst infection. Advanced kidney disease requires individualized
    dosing and caution; avoid during pregnancy or breastfeeding. Pasireotide has more glucose
    toxicity and is not first-line. Volume reduction does not establish prevention of transplantation
    or renal functional decline.
  treatment_term:
    preferred_term: Somatostatin analogue therapy
    term:
      id: NCIT:C15449
      label: Somatostatin Analog Therapy
    therapeutic_agent:
    - preferred_term: Somatostatin Receptor Agonist
      term:
        id: NCIT:C62799
        label: Somatostatin Receptor Agonist
  evidence:
  - reference: PMID:41328663
    reference_title: >-
      Medical Management of Polycystic Liver Disease: A Position Statement From the European
      Reference Network on Hepatological Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with liver volume‐related symptoms who have non‐localised disease should be considered for treatment.
    explanation: >-
      ERN 2026 consensus supports symptom- and distribution-based selection, not routine treatment
      of incidental asymptomatic cysts.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20431041
    reference_title: Randomized clinical trial of long-acting somatostatin for autosomal dominant polycystic kidney and liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver volume decreased by 4.95%+/-6.77% in the octreotide group but remained practically
      unchanged (+0.92%+/-8.33%) in the placebo group (P=0.048).
    explanation: >-
      One-year 42-patient randomized trial: 34 ADPKD and eight ADPLD. The overall volume effect
      is not an independently powered ADPLD subgroup estimate. Two SF-36 subdomains improved
      within the treated group; broad quality-of-life benefit was not uniform.
    quote_role: PRIMARY_RESULT
  - reference: PMID:19646443
    reference_title: 'Lanreotide reduces the volume of polycystic liver: a randomized, double-blind, placebo-controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mean liver volume decreased 2.9%, from 4606 mL
    explanation: >-
      Six-month randomized trial of 54 mixed ADPKD/ADPLD participants versus a 1.6% volume increase
      with placebo; genotype stratification was post hoc.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2900957/
    reference_title: >-
      Randomized Clinical Trial of Long-Acting Somatostatin for Autosomal Dominant Polycystic
      Kidney and Liver Disease - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dose was reduced to 30 mg in seven and 20 mg in four patients receiving octreotide,
      mostly because of diarrhea/loose stools, especially in the first 2 weeks after an injection
    explanation: >-
      Full-text tolerability results limit the abstract statement that treatment was well tolerated;
      one participant also had persistent steatorrhea and weight loss.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41328663
    reference_title: >-
      Medical Management of Polycystic Liver Disease: A Position Statement From the European
      Reference Network on Hepatological Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: There is currently no robust evidence suggesting that SSA mitigates progression to liver‐related endpoints in PLD.
    explanation: >-
      The clinical goal is symptom relief, with liver volume as a response measure; hard-outcome
      benefit remains unproved.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:41328663
    reference_title: >-
      Medical Management of Polycystic Liver Disease: A Position Statement From the European
      Reference Network on Hepatological Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early discontinuation can lead to rebound in both liver volume and disease‐related symptom
      burden within 3–4 months after withdrawal.
    explanation: >-
      Durability depends on ongoing treatment and natural history; the older blanket short-lived
      description is insufficient.
    quote_role: REVIEW_SYNTHESIS
  target_mechanisms:
  - target: Increased cholangiocyte cAMP signaling
    treatment_effect: INHIBITS
    description: Somatostatin signaling lowers cAMP-dependent secretion and growth.
  - target: Hepatic cyst expansion
    treatment_effect: INHIBITS
    description: Medical therapy can reduce or stabilize cyst-associated liver volume.
- name: Aspiration sclerotherapy
  description: >-
    A dominant large or strategically located accessible cyst causing symptoms may be treated
    by image-guided aspiration with sclerosis. This is a targeted approach rather than a treatment
    for all diffuse small cysts; recurrence of symptoms is more frequent in PLD than in a solitary
    simple cyst.
  treatment_term:
    preferred_term: Aspiration sclerotherapy
    term:
      id: NCIT:C62732
      label: Sclerotherapy
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When a large or strategically located cyst is the main cause of symptoms, percutaneous
      aspiration sclerotherapy can also be performed in the context of PLD.
    explanation: Guideline selection is based on the symptomatic dominant cyst.
    quote_role: REVIEW_SYNTHESIS
  target_mechanisms:
  - target: Hepatic mass effect
    treatment_effect: INHIBITS
    description: Targeted cyst decompression can relieve compression symptoms.
- name: Cyst fenestration or selected hepatic resection
  description: >-
    Fenestration is considered for accessible superficial large cysts; segmental resection can
    help severe disease clustered in selected segments with sufficient spared parenchyma and
    patent vasculature. These procedures carry morbidity, recurrence and possible difficulty
    at later transplantation. In the 186-patient combined resection/fenestration series, 170
    had ADPKD and only 16 ADPLD; major complications occurred in 21% and 90-day mortality was
    2.7%. Its durable median 61% volume reduction comes from selected patients at a single expert
    center, not a randomized comparison with transplantation.
  treatment_term:
    preferred_term: Cyst fenestration or selected hepatic resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:27016902
    reference_title: >-
      Outcomes and Durability of Hepatic Reduction after Combined Partial Hepatectomy and Cyst
      Fenestration for Massive Polycystic Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sustained long-term reductions in LV after PHCF can be achieved in selected patients with
      severe, highly symptomatic PLD.
    explanation: >-
      Retrospective single-center series, predominantly ADPKD; selection and missing follow-up
      imaging limit generalization.
    quote_role: PRIMARY_RESULT
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since surgical resection in PLD is associated with high morbidity, especially in the presence
      of vascular abnormalities and biliary dilatation
    explanation: Guideline cautions against treating resection as a universally appropriate option.
    quote_role: REVIEW_SYNTHESIS
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Hepatic mass effect
    treatment_effect: INHIBITS
    description: Reducing cyst burden can relieve mechanical symptoms.
- name: Liver transplantation
  description: >-
    Refer selected patients with massive symptomatic PLD, severe malnutrition, refractory vascular
    complications or recurrent complications when other approaches fail or are unsuitable. Preserved
    synthetic function can make conventional MELD underestimate burden, requiring local exception
    pathways. Combined liver-kidney transplantation is considered only for substantial independent
    renal disease, not automatically for isolated ADPLD.
  treatment_term:
    preferred_term: Liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Liver transplantation is the only curative treatment for PLD and only the most severe
      cases with massive PLD are eligible.
    explanation: EASL limits transplantation to selected severe disease and discusses allocation despite preserved liver function.
    quote_role: REVIEW_SYNTHESIS
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Hepatic mass effect
    treatment_effect: INHIBITS
    description: Removing the cystic liver eliminates the source of compression.
- name: Estrogen exposure counseling
  description: >-
    Review estrogen-containing contraception and hormone replacement; EASL recommends stopping
    exogenous estrogen in female patients with PLD. Choose alternatives through individualized
    reproductive counseling. Evidence for pregnancy as an independent progression factor is
    inconsistent, and patients should not be counseled against pregnancy solely because of PLD.
  treatment_term:
    preferred_term: Estrogen exposure counseling
    term:
      id: NCIT:C61547
      label: Counseling
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Stopping exogenous oestrogen administration is recom- mended in female patients with PLD
    explanation: >-
      EASL recommendation based on observational and experimental evidence; prevention benefit
      from withdrawal has not been proven in a definitive trial.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with PLD should not be counselled against preg- nancy
    explanation: The recommendation distinguishes exogenous estrogen use from pregnancy counseling.
    quote_role: REVIEW_SYNTHESIS
- name: Nutritional and exercise rehabilitation
  description: >-
    For severe PLD with early satiety, malnutrition or sarcopenia, provide dietitian-supervised
    nutrition and physical rehabilitation. Small frequent meals can help intake. Avoid interpreting
    liver-related body weight as preserved muscle mass; no specific diet is established to prevent
    cyst formation.
  treatment_term:
    preferred_term: Nutritional and exercise rehabilitation
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with PLD and sarcopenia should receive intensive nutrition and exercise rehabilitation
    explanation: Guideline supports multidisciplinary nutritional and functional care.
    quote_role: REVIEW_SYNTHESIS
  target_mechanisms:
  - target: Reduced nutritional intake
    treatment_effect: INHIBITS
    description: Individualized nutrition can mitigate inadequate intake and its consequences.
- name: Genetic and reproductive counseling
  description: >-
    Explain variable expression, the 50% transmission risk for a heterozygous pathogenic allele,
    limits of negative testing and uncertainty from VUS. Offer preconception counseling and
    discuss reproductive testing when a familial variant is known. Do not convert a candidate
    LRP5 variant into a definitive diagnosis without reassessment.
  treatment_term:
    preferred_term: Genetic and reproductive counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with PLD should receive preconception counsel- ling concerning the risk of passing on PLD to the newborn
    explanation: EASL recommends preconception counseling.
    quote_role: REVIEW_SYNTHESIS
- name: Pain and complication management
  description: >-
    Evaluate new severe pain for hemorrhage, infection, rupture or obstruction rather than attributing
    it automatically to stable liver size. Provide individualized analgesia and targeted management
    of confirmed complications; avoid unnecessary cyst intervention for mild asymptomatic disease.
  treatment_term:
    preferred_term: Pain and complication management
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive management with analgesics is the first-line treatment in patients with acute
      or chronic abdominal pain and tenderness.
    explanation: Clinical review supports symptom care alongside evaluation for acute complications.
    quote_role: REVIEW_SYNTHESIS

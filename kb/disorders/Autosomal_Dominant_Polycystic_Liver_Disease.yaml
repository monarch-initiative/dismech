name: Autosomal dominant polycystic liver disease
creation_date: '2026-05-09T06:38:39Z'
category: Mendelian
description: >-
  Autosomal dominant polycystic liver disease (ADPLD), also called isolated polycystic liver
  disease, is an inherited disorder characterized by multiple biliary epithelial cysts with
  absent or limited kidney involvement. Expression is age-dependent and variably penetrant;
  many individuals remain asymptomatic, while extensive cyst growth causes hepatomegaly and
  compression symptoms despite preserved liver synthetic function. PRKCSH, SEC63, GANAB, ALG8
  and SEC61B connect endoplasmic-reticulum protein biogenesis to reduced functional polycystin-1
  dosage. Monoallelic PKHD1 variants can produce an overlapping liver-predominant phenotype
  through a less resolved mechanism. The reported LRP5 association remains contested. Treatment
  is guided by symptoms and cyst distribution, with medical volume control, targeted procedures
  and transplantation reserved for selected symptomatic disease.
synonyms:
- ADPLD
- ADPCLD
- Isolated polycystic liver disease
- PCLD
- Polycystic liver disease

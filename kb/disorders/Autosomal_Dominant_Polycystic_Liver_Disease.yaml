    supports: SUPPORT
    evidence_source: OTHER
    snippet: '- Autosomal dominant'
    explanation: Orphanet records autosomal dominant inheritance for isolated polycystic liver disease.
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Both PCLD and ADPKD have an autosomal dominant inheritance pattern and the recurrence risk is 50%.
    explanation: Transmission risk is distinct from age-dependent clinical severity.
    quote_role: REVIEW_SYNTHESIS

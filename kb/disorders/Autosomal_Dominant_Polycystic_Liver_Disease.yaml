discussions:
- discussion_id: adpld_lrp5_validity
  kind: KNOWLEDGE_GAP
  prompt: Does LRP5 independently cause ADPLD after excluding linked GANAB variation?
  attaches_to:
  - genetic#Reported LRP5 association
  rationale: >-
    The initial linked family and Wnt assays support an association, but linked noncoding GANAB
    variants and incomplete functional validation leave causal attribution contested.
  status: OPEN
  evidence:
  - reference: PMID:29243290
    reference_title: A noncoding variant in GANAB explains isolated polycystic liver disease (PCLD) in a large family.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the close proximity of LRP5 and GANAB on chromosome 11 precludes the use of linkage or
      segregation analyses alone to distinguish the disease genes in this region.
    explanation: >-
      Authors question causal attribution in the earlier LRP5 pedigree. Their own GANAB family
      is distinct; the original LRP5 family was not shown to carry a GANAB mutation.
notes: >-
  Reviewed the manual source-curation fallback report; it is not a completed external provider
  report. Most catalog frequencies lack age and ascertainment denominators. ADPLD must be distinguished
  from ADPKD before transferring renal prognosis or vascular-screening advice. Limited renal
  cysts can occur without progressive polycystic kidney disease. Some catalog associations remain
  unconnected because their mechanism is not established. LRP5 remains represented as disputed
  rather than erased or treated as definitively refuted. Mouse PC1 rescue and cell knockout
  evidence are not human therapeutic efficacy; proteasome inhibition is experimental and is
  not a clinical treatment recommendation.
clinical_trials:
- name: NCT00426153
  status: COMPLETED
  description: >-
    Registry phase 2/3 trial of octreotide LAR in severe PLD. The published first-year randomized
    comparison enrolled 42 participants, including eight with ADPLD, assigned 28 to octreotide
    and 14 to placebo. Liver volume was the primary endpoint; renal endpoints excluded ADPLD
    and do not establish kidney protection.
  target_phenotypes:
  - preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: clinicaltrials:NCT00426153
    reference_title: >-
      Pilot Study Of Long-Acting Octreotide (Octreotide LAR® Depot) In The Treatment Of Patients
      With Severe Polycystic Liver Disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A total of 42 patients will be recruited -14 who will receive placebo and 28 the study drug.
    explanation: Registry purpose statement; current status and phase were independently verified through the live registry.
  - reference: PMID:20431041
    reference_title: Randomized clinical trial of long-acting somatostatin for autosomal dominant polycystic kidney and liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver volume decreased by 4.95%+/-6.77% in the octreotide group but remained practically
      unchanged (+0.92%+/-8.33%) in the placebo group (P=0.048).
    explanation: >-
      One-year 42-patient randomized trial: 34 ADPKD and eight ADPLD. The overall volume effect
      is not an independently powered ADPLD subgroup estimate. Two SF-36 subdomains improved
      within the treated group; broad quality-of-life benefit was not uniform.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2900957/
    reference_title: >-
      Randomized Clinical Trial of Long-Acting Somatostatin for Autosomal Dominant Polycystic
      Kidney and Liver Disease - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dose was reduced to 30 mg in seven and 20 mg in four patients receiving octreotide,
      mostly because of diarrhea/loose stools, especially in the first 2 weeks after an injection
    explanation: >-
      Full-text tolerability results limit the abstract statement that treatment was well tolerated;
      one participant also had persistent steatorrhea and weight loss.
    quote_role: PRIMARY_RESULT
- name: NCT05281328
  status: ACTIVE_NOT_RECRUITING
  description: >-
    POSITANO phase 2/3 trial compares weekly or fortnightly CAM2029 octreotide depot with placebo
    in symptomatic PLD. The 53-week randomized period is complete and registry results were
    posted June 2026; the open-label extension remains active, with estimated study completion
    in August 2027. Seventy-one participants were randomized, and the posted primary volume
    analysis includes 67 with baseline MRI. Registry-reported mean changes were -0.7% for combined
    CAM2029 arms and +3.9% for placebo, with estimated relative difference -4.3% (95% CI -8.4
    to -0.1; P=0.0443). These mixed-etiology registry results do not establish an ADPLD-specific
    effect or a licensed indication.
  target_phenotypes:
  - preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: clinicaltrials:NCT05281328
    reference_title: >-
      A Randomized, Placebo-controlled, Double-blind, Multi-center Trial to Assess Efficacy
      and Safety of Octreotide Subcutaneous Depot (CAM2029) in Patients With Symptomatic Polycystic
      Liver Disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of the trial is to compare the effectiveness and safety of 2 treatment regimens
      of CAM2029 (given weekly or every 2 weeks) to placebo in participants with symptomatic
      PLD, either isolated as in autosomal dominant PLD (ADPLD) or associated with autosomal
      dominant polycystic kidney disease (ADPKD).
    explanation: Registry summary defines the population and randomized comparison.
  - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT05281328
    reference_title: https://clinicaltrials.gov/api/v2/studies/NCT05281328
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The baseline MRI scan was missing for 4 participants (1 in each CAM2029 separate group and 2 in the placebo group).
    explanation: >-
      Posted primary-results population statement; 71 randomized and 67 in the displayed volume
      denominators. The live registry includes both results and continuing extension status.
    quote_role: PRIMARY_RESULT
differential_diagnoses:
- name: ADPKD with liver-predominant disease
  description: >-
    Substantial bilateral renal cysts, kidney enlargement or impaired renal function suggest
    ADPKD. GANAB and ALG8 can span the kidney/liver spectrum, so liver morphology alone is insufficient.
  evidence:
  - reference: PMID:29038287
    reference_title: Genetic Complexity of Autosomal Dominant Polycystic Kidney and Liver Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ADPLD is defined as dominantly inherited disease with significant PLD without significant PKD.
    explanation: Review defines the clinical distinction while recognizing genic overlap.
    quote_role: REVIEW_SYNTHESIS
- name: Caroli disease or syndrome and ARPKD
  description: >-
    Communicating intrahepatic duct ectasia, recurrent cholangitis and congenital hepatic fibrosis
    favor Caroli syndrome or ARPKD rather than isolated noncommunicating hepatic cysts.
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In CS large and small intrahepatic bile duct ecstasies are accompanied with CHF.
    explanation: Review distinguishes communicating duct disease with congenital hepatic fibrosis.
    quote_role: REVIEW_SYNTHESIS
- name: Simple hepatic cysts and biliary hamartomas
  description: >-
    A few incidental cysts or small von Meyenburg complexes do not by themselves establish inherited
    ADPLD; age, family history, morphology and kidney findings matter.
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: VMC are frequently an incidental finding at radiological imaging, surgery or autopsy studies.
    explanation: Review differentiates incidental biliary hamartomas from severe inherited polycystic disease.
    quote_role: REVIEW_SYNTHESIS
- name: Cystic neoplasm or infection
  description: >-
    Complex walls, nodules, septations, enhancement or acute systemic features require evaluation
    for another cystic lesion or a superimposed complication rather than assuming uncomplicated
    ADPLD.
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PLD is a non-communicating biliary tree disorder and should be differentiated from other
      neoplastic, infectious and traumatic conditions
    explanation: The differential includes distinct diseases; listing them does not classify ADPLD as infectious.
    quote_role: REVIEW_SYNTHESIS

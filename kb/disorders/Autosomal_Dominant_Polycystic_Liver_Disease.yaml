inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission with age-dependent, incomplete penetrance and variable expression.
    A heterozygous pathogenic variant has a 50% transmission probability; this is not a 50%
    probability of severe symptomatic disease. Some monoallelic PKHD1 carriers have liver cysts,
    distinct from biallelic ARPKD.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: ORPHA:2924

  - target: Reduced nutritional intake
    description: Gastric compression and early satiety reduce intake.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35487607
    reference_title: Polycystic Kidney/Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Though isolated PCLD and PCLD due to ADPKD are genetically distinct, they follow a similar
      clinical course of hepatomegaly from multiple cysts with preserved liver function.
    explanation: The review supports the core clinical course of hepatomegaly with preserved liver function.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Major complaints include abdominal pain, abdominal distension and atypical symptoms because
      of voluminous cysts resulting in compression of adjacent tissue or failure of the affected
      organ.
    explanation: The review supports mass-effect symptoms from voluminous cysts.
    quote_role: REVIEW_SYNTHESIS
- name: Hepatic vascular compression
  description: >-
    Cysts can compress hepatic veins, the portal circulation or the inferior vena cava. Venous
    obstruction can produce portal hypertension, ascites and peripheral edema without primary
    cirrhosis.
  downstream:
  - target: Portal hypertension
    description: Hepatic venous or portal obstruction increases portal pressure.
    causal_link_type: DIRECT
  - target: Ascites
    description: Venous obstruction can promote ascites.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pedal edema
    description: Vena-caval or venous compression impedes lower-extremity drainage.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In advanced stages there are 2 processes that may lead up to portal hypertension. First,
      there is reduction of hepatic vein outflow. Secondly, portal vein inflow may be compressed
      in advanced disease due to the volume effect of cysts.
    explanation: Clinical synthesis supports compression mechanisms in advanced PLD.
    quote_role: REVIEW_SYNTHESIS
- name: Biliary compression
  description: >-
    Strategically located cysts can obstruct bile ducts, producing jaundice or cholestatic abnormalities;
    this is an uncommon complication rather than universal loss of synthetic function.
  downstream:
  - target: Jaundice
    description: Biliary obstruction can cause jaundice.
    causal_link_type: DIRECT
  - target: Hyperbilirubinemia
    description: Impaired bile drainage can elevate bilirubin.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24886261
    reference_title: 'Polycystic liver disease: an overview of pathogenesis, clinical manifestations and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: An uncommon cause of jaundice is obstruction of the intrahepatic or extrahepatic bile ducts by hepatic cysts
    explanation: Review specifically supports the obstructive route to jaundice.
    quote_role: REVIEW_SYNTHESIS
- name: Reduced nutritional intake
  description: >-
    Gastric compression and early satiety limit food intake in severe disease, causing malnutrition
    and loss of muscle mass. Liver weight can obscure body-weight loss.
  downstream:
  - target: Malnutrition
    description: Insufficient intake causes malnutrition.
    causal_link_type: DIRECT
  - target: Skeletal muscle atrophy
    description: Prolonged nutritional compromise contributes to muscle wasting.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf

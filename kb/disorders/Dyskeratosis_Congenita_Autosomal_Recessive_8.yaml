name: Dyskeratosis Congenita Autosomal Recessive 8
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: dyskeratosis congenita, autosomal recessive 8
  term:
    id: MONDO:0859319
    label: dyskeratosis congenita, autosomal recessive 8
synonyms:
- DKCB8
- TYMS-ENOSF1 dyskeratosis congenita
- digenic dyskeratosis congenita
- germline thymidylate synthase deficiency
description: >-
  A telomere biology disorder in which dyskeratosis congenita is produced not by a defect
  in telomere machinery but by a defect in nucleotide supply. Patients have the classic
  mucocutaneous triad and progressive bone marrow failure, and the cause is severe
  germline thymidylate synthase deficiency.

  Its genetic architecture is the reason this entry exists as its own record rather than
  as a row under the parent dyskeratosis congenita entry. It is **digenic**, and in an
  unusual configuration. An affected child inherits a loss-of-function coding variant in
  TYMS from one parent, and from the other a specific haplotype carrying rare variants in
  ENOSF1 - the naturally occurring antisense regulator transcribed from the opposite
  strand of the same locus. Elevated ENOSF1 silences the remaining wild-type TYMS allele
  post-transcriptionally. So the disease presents as recessive, and both parents are
  unaffected, yet one of them has an entirely wild-type TYMS coding sequence. Standard
  recessive segregation is not observed and a single-gene panel will not find it.

  Two things follow that shaped how this was curated.

  The mechanism runs through nucleotide metabolism rather than through the telomere. TYMS
  catalyses the only de novo route to dTMP; losing it depletes the thymidine nucleotide
  pool, distorts the dNTP balance, and produces genotoxic stress and defective
  transcription, from which abnormal telomere maintenance follows. The entry orders the
  chain that way, because the order is what makes this disease mechanistically different
  from the shelterin and telomerase forms of dyskeratosis congenita that it is clinically
  indistinguishable from.

  And there is a directly actionable pharmacogenomic consequence. Thymidylate synthase is
  the target of fluoropyrimidines, and patient cells are hypersensitive to
  5-fluorouracil. Given that dyskeratosis congenita carries a raised risk of squamous cell
  carcinoma, a patient with this genotype may well be offered exactly the drug class their
  cells cannot tolerate.

  **A note on this entry's identifier.** MONDO asserts a causal-gene relationship from
  MONDO:0859319 to DCLRE1B (`MONDO:0859319 RO:0004003 HGNC:17641`). That assertion is
  wrong. OMIM 620133, to which MONDO:0859319 is mapped `equivalentTo`, is the
  TYMS-ENOSF1 entity defined by Tummala et al. DCLRE1B/Apollo is a real telomere gene with
  a real human phenotype, but it is a different one. This entry curates the disease OMIM
  620133 describes; see the discussion below.

parents:
- Dyskeratosis Congenita

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Eight independent families in the defining cohort, plus at least one subsequent
    unrelated case. No prevalence estimate exists. Eight families is a substantial base
    for an ultra-rare entity and is what makes the digenic mechanism credible rather than
    anecdotal.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a cohort of eight independent DC-affected families, we have identified a
      remarkable series of heterozygous germline variants in the gene encoding thymidylate
      synthase (TYMS).
    explanation: >-
      Gives the size and structure of the defining cohort.

pathophysiology:

- name: Digenic TYMS-ENOSF1 Genotype
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a genotype rather than a variant: a TYMS loss-of-function
    coding allele from one parent, and in trans a specific ENOSF1 haplotype with rare
    variants from the other.

    Neither allele alone causes disease - the parents carrying one each are unaffected -
    and one parent's TYMS coding sequence is entirely wild type. This is what distinguishes
    the disease from every single-gene recessive form of dyskeratosis congenita, and it is
    why the inheritance only appears recessive.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the inheritance appeared to be autosomal recessive, one parent in each
      family had a wild-type TYMS coding sequence. Targeted genomic sequencing identified a
      specific haplotype and rare variants in the naturally occurring TYMS antisense
      regulator ENOSF1 (enolase super family 1) inherited from the other parent.
    explanation: >-
      The single sentence that establishes the digenic architecture and why it was missed
      by a conventional recessive analysis.
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygosity for loss of function variants in TYMS and a specific
      haplotype of its antisense regulator ENOSFI (enolase super family 1) causes digenic
      DC
    explanation: >-
      Independent confirmation of the digenic requirement in an unrelated patient, three
      years after the defining cohort.
  downstream:
  - target: ENOSF1-Mediated Silencing of the Wild-Type TYMS Allele
    causal_link_type: DIRECT
    description: >-
      The ENOSF1 haplotype acts on the TYMS allele the other parent contributed.

- name: ENOSF1-Mediated Silencing of the Wild-Type TYMS Allele
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    The epistatic step, and the part of this disease that is genuinely novel. ENOSF1 is
    transcribed antisense to TYMS at the same locus. When it is elevated, it silences TYMS
    post-transcriptionally - so the coding-intact allele is present, transcribed, and then
    prevented from producing enzyme.

    This was not inferred from the pedigree structure. It was demonstrated by gene rescue
    in cells from affected probands, which is what turns "these two variants co-occur" into
    a mechanism.
  biological_processes:
  - preferred_term: antisense silencing of TYMS by ENOSF1
    term:
      id: GO:0042868
      label: antisense RNA metabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene-rescue studies in cells from affected probands revealed that post-transcriptional
      epistatic silencing of TYMS is occurring via elevated ENOSF1.
    explanation: >-
      The experimental demonstration of the epistasis, in patient cells. Graded IN_VITRO
      because it is a cell-based rescue experiment, notwithstanding that the cells are of
      human patient origin.
  downstream:
  - target: Severe Thymidylate Synthase Deficiency
    causal_link_type: DIRECT
    description: >-
      One allele lost to coding variant, the other to silencing, leaves almost no enzyme.

- name: Severe Thymidylate Synthase Deficiency
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    The convergence point of the two alleles, and a severe deficiency rather than a partial
    one - which is the reason a disease results at all from a genotype in which one coding
    allele is intact.
  molecular_functions:
  - preferred_term: thymidylate synthase activity
    term:
      id: GO:0004799
      label: thymidylate synthase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lymphoblastoid cells from affected probands have severe TYMS deficiency, altered
      cellular deoxyribonucleotide triphosphate pools, and hypersensitivity to the
      TYMS-specific inhibitor 5-fluorouracil.
    explanation: >-
      Measures the enzyme deficiency, the nucleotide-pool consequence and the drug
      sensitivity in one experiment on patient cells.
  downstream:
  - target: Deoxyribonucleotide Pool Imbalance
    causal_link_type: DIRECT
    description: >-
      TYMS makes dTMP; without it the thymidine nucleotide pool falls and the balance
      between the four dNTPs is distorted.
  - target: Antimetabolite Hypersensitivity
    causal_link_type: DIRECT
    description: >-
      A cell with almost no thymidylate synthase has no reserve against a drug that
      inhibits thymidylate synthase.

- name: Deoxyribonucleotide Pool Imbalance
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    Altered dNTP pools, which is the classical route by which a nucleotide-metabolism
    defect becomes a DNA-integrity defect: a replication fork supplied with the wrong
    nucleotide ratios misincorporates, stalls and breaks.
  biological_processes:
  - preferred_term: de novo dTMP biosynthesis
    term:
      id: GO:0006231
      label: dTMP biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lymphoblastoid cells from affected probands have severe TYMS deficiency, altered
      cellular deoxyribonucleotide triphosphate pools
    explanation: >-
      The measured pool abnormality.
  downstream:
  - target: Genotoxic Stress and Defective Transcription
    causal_link_type: DIRECT
    description: >-
      Distorted pools damage DNA and impair transcription.

- name: Genotoxic Stress and Defective Transcription
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    The cellular injury the pool imbalance produces. Notably the source reports defective
    transcription alongside the DNA damage, which is a broader consequence than replication
    stress alone and is curated as the authors stated it rather than narrowed to the
    replication story that would be easier to tell.
  biological_processes:
  - preferred_term: DNA damage response to nucleotide misincorporation
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These defects in the nucleotide metabolism pathway resulted in genotoxic stress,
      defective transcription, and abnormal telomere maintenance.
    explanation: >-
      Names all three downstream consequences in the order the authors put them, which is
      the order this entry's causal chain follows.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      an increase in the phosphorylation levels of proteins ATM, CHK1, CHK2, p53, p21 in the
      DNA-damage-response pathway
    explanation: >-
      The measurement behind the GO binding. This node was previously bound to
      base-excision repair, which described a plausible mechanism rather than the one the
      authors measured; the pathway they assayed is the DNA damage response, so that is
      what the node now binds.
  downstream:
  - target: Abnormal Telomere Maintenance
    causal_link_type: DIRECT
    description: >-
      Telomere dysfunction here is downstream of genotoxic stress, not the initiating
      lesion.

- name: Abnormal Telomere Maintenance
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    What makes this a telomere biology disorder clinically, and the finding that places it
    alongside the telomerase and shelterin forms of dyskeratosis congenita in diagnosis and
    management.

    The mechanistic point is the direction of causation, and it has to be stated
    precisely. In DKC1, TERT, TERC or TINF2 disease the primary lesion is in the telomere
    machinery. Here the primary lesion is in nucleotide supply and the telomere defect
    follows from it. That is not the same as the machinery being untouched: in proband
    cells telomerase activity is reduced, immature oligoadenylated TERC accumulates, and
    DKC1, TERT and SMUG1 are all reduced. What is preserved is shelterin. The authors'
    own reading is that impaired telomerase regulation is a consequence of altered
    nucleotide metabolism rather than an independent lesion.

    An earlier draft of this entry said the telomere machinery was intact. That was too
    strong and is corrected here.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These defects in the nucleotide metabolism pathway resulted in genotoxic stress,
      defective transcription, and abnormal telomere maintenance.
    explanation: >-
      States that the telomere abnormality is a consequence of the nucleotide defect, which
      is the ordering claim this node depends on.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas the amount of shelterin protein components (TIN2, TPP1, TRF1 and POT1; Figure
      2J), which protect telomeres, remained unchanged, indicating that defects in telomere
      length maintenance are a consequence of impaired telomerase regulation in these TYMS
      deficient probands as a result of altered nucleotide metabolism
    explanation: >-
      The sentence that fixes what is and is not preserved. Shelterin is unchanged;
      telomerase regulation is impaired, and the authors place that impairment downstream
      of the nucleotide defect. This is the evidence for the corrected framing above.
  downstream:
  - target: Dyskeratosis Congenita Phenotype
    causal_link_type: DIRECT
    description: >-
      Telomere dysfunction in renewing tissues gives the clinical syndrome.

- name: Antimetabolite Hypersensitivity
  role: modifier
  biological_scale: CELLULAR
  description: >-
    A branch of the mechanism with direct clinical consequence rather than a downstream
    step of the disease process. Thymidylate synthase is the pharmacological target of
    5-fluorouracil and capecitabine; a cell that has almost none of it has no margin. The
    same cells are separately hypersensitive to hydroxyurea, which inhibits ribonucleotide
    reductase rather than thymidylate synthase, so the vulnerability is to antimetabolites
    that squeeze dNTP supply generally and not to one drug class alone.

    This matters because dyskeratosis congenita carries an elevated risk of squamous cell
    carcinoma, for which fluoropyrimidines are a standard option. The genotype that causes
    the cancer risk also removes the tolerance for a common treatment of it.

    It is not only a prediction. One proband in the defining cohort was treated with
    topical 5-fluorouracil for squamous carcinoma and melanoma of the leg and had a severe
    adverse response. That is a single topical exposure rather than systemic dosing data,
    but it is a clinical observation and this entry previously stated, wrongly, that no
    such observation existed.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has shown a severe adverse response to topical 5-FU when undergoing treatment for her
      squamous carcinoma and melanoma in her leg
    explanation: >-
      A patient with a confirmed TYMS variant who received a fluoropyrimidine and reacted
      severely to it. This is the clinical counterpart of the cellular hypersensitivity
      below, and it is why the node is not graded as a cell-only finding.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral ptosis, tooth discolouration, intermediate increased response to
      mitomycin-C, basal carcinoma on the chest, squamous carcinoma and melanoma on the
      leg, severe response to topical 5-FU treatment.
    explanation: >-
      The Table 1 footnote for the same proband, which corroborates the 5-FU reaction and
      places it alongside her three cutaneous malignancies.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      hypersensitivity to the TYMS-specific inhibitor 5-fluorouracil
    explanation: >-
      The measured drug sensitivity in patient-derived cells. Kept as a separate item from
      the clinical observation above because it is a different kind of claim: it
      establishes the mechanism of the reaction rather than the reaction itself.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      hypersensitivity to ribonucleotide reductase inhibitors such as hydroxyurea
    explanation: >-
      Extends the hypersensitivity beyond thymidylate synthase inhibitors, which is why
      this node is named for antimetabolites rather than for fluoropyrimidines. INDIRECT
      and IN_VITRO: hydroxyurea sensitivity was measured in cells and no patient exposure
      to it has been reported.

- name: Dyskeratosis Congenita Phenotype
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: the mucocutaneous triad with progressive bone marrow failure,
    clinically indistinguishable from other forms of dyskeratosis congenita.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dyskeratosis congenita (DC) is an inherited bone-marrow-failure disorder
      characterized by a triad of mucocutaneous features that include abnormal skin
      pigmentation, nail dystrophy, and oral leucoplakia.
    explanation: >-
      Defines the syndrome these patients present with. Note this sentence describes
      dyskeratosis congenita in general rather than DKCB8 specifically, which is why the
      individual phenotype rows below that need a DKCB8-specific source use the case
      report instead.

phenotypes:

- category: Dermatologic
  name: Abnormal Skin Pigmentation
  frequency: VERY_FREQUENT
  description: >-
    Part of the mucocutaneous triad. In the confirmed DKCB8 case report it was diffuse
    hyperpigmentation with numerous punctate hypopigmented macules, appearing in early
    infancy.
  phenotype_term:
    preferred_term: Reticulated skin pigmentation
    term:
      id: HP:0007427
      label: Reticulated skin pigmentation
  evidence:
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In early infancy, he developed diffuse hyperpigmentation as well as numerous punctate
      hypopigmented macules, sparse hair, and nail dystrophy
    explanation: >-
      The pigmentary findings in a genetically confirmed DKCB8 patient, with their onset.

- category: Dermatologic
  name: Nail Dystrophy
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Nail dystrophy
    term:
      id: HP:0008404
      label: Nail dystrophy
  description: >-
    Part of the triad, and documented in the genetically confirmed case.
  evidence:
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diffuse hyperpigmentation as well as numerous punctate hypopigmented macules, sparse
      hair, and nail dystrophy
    explanation: >-

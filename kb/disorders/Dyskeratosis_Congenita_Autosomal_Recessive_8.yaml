genetic:

- name: TYMS
  gene_term:
    preferred_term: TYMS
    term:
      id: hgnc:12441
      label: TYMS
  relationship_type: CAUSATIVE
  notes: >-
    Thymidylate synthase, which catalyses the sole de novo route to dTMP by methylating
    dUMP using 5,10-methylenetetrahydrofolate. Patients carry a heterozygous
    loss-of-function coding variant; on its own this is not sufficient, and the transmitting
    parent is unaffected.

    TYMS is also the pharmacological target of the fluoropyrimidines, which is where the
    clinical hypersensitivity comes from.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have identified a remarkable series of heterozygous germline variants in the gene
      encoding thymidylate synthase (TYMS)
    explanation: >-
      Establishes TYMS as the coding-variant locus and the variants as heterozygous.

- name: ENOSF1
  gene_term:
    preferred_term: ENOSF1
    term:
      id: hgnc:30365
      label: ENOSF1
  relationship_type: COOPERATING
  notes: >-
    The antisense regulator transcribed from the opposite strand at the TYMS locus.
    Recorded as COOPERATING rather than CAUSATIVE because that is precisely its role: the
    ENOSF1 haplotype causes nothing by itself, and is pathogenic only in trans to a TYMS
    loss-of-function allele.

    The contributing lesion is a haplotype carrying rare variants rather than a single
    variant, which is worth noting for anyone trying to interpret a laboratory report -
    there is no one ENOSF1 variant to look up.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted genomic sequencing identified a specific haplotype and rare variants in the
      naturally occurring TYMS antisense regulator ENOSF1 (enolase super family 1)
      inherited from the other parent.
    explanation: >-
      Establishes ENOSF1's contribution, that it is a haplotype rather than a single
      variant, and that it comes from the other parent.

inheritance:

- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    Two loci, both required, one contributed by each parent: a TYMS loss-of-function coding
    allele and, in trans, an ENOSF1 antisense haplotype with rare variants. Carriers of
    either alone are unaffected.

    The presentation mimics autosomal recessive inheritance closely enough that the defining
    study initially read it that way, and only targeted sequencing of the antisense
    regulator revealed otherwise. That is worth recording as a diagnostic caution rather
    than as a historical note: a pedigree that looks recessive with an apparently
    non-carrier parent is the signal.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cell and molecular abnormalities generated by the combination of germline
      digenic variants at the TYMS-ENOSF1 locus represent a unique pathogenetic pathway for
      DC causation in these affected individuals, whereas the parents who are carriers of
      either of these variants in a singular fashion remain unaffected.
    explanation: >-
      States the digenic requirement and, in the same sentence, that single carriers are
      unaffected - which is the definition of digenic rather than modifier inheritance.
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygosity for loss of function variants in TYMS and a specific haplotype
      of its antisense regulator ENOSFI (enolase super family 1) causes digenic DC
    explanation: >-
      Independent statement of the digenic mode in a second report.

diagnosis:

- name: Telomere Length Assay
  description: >-
    Very short telomeres are the screening test for the telomere biology disorders and were
    what confirmed the diagnosis in the reported DKCB8 case. It does not identify the gene,
    only the disease class.
  evidence:
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis of DC was confirmed with a telomere length assay
    explanation: >-
      The confirmatory test in a genetically established case.

- name: Targeted Sequencing of the TYMS-ENOSF1 Locus
  description: >-
    The genetic diagnosis needs the antisense regulator, not just the coding gene. A
    standard dyskeratosis congenita panel returns a single heterozygous TYMS variant, which
    in isolation looks like carrier status rather than a diagnosis, and the ENOSF1
    contribution is a haplotype rather than a reportable variant.

    This is why the defining cohort needed targeted genomic sequencing over the locus after
    conventional analysis had failed.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted genomic sequencing identified a specific haplotype and rare variants in the
      naturally occurring TYMS antisense regulator ENOSF1 (enolase super family 1)
      inherited from the other parent.
    explanation: >-
      Names the assay that made the diagnosis possible.

- name: Consider DKCB8 in 18p Deletions Encompassing TYMS
  description: >-
    A specific ascertainment route. The reported case had ring chromosome 18 with partial
    18p monosomy that deleted TYMS, providing the loss-of-function allele structurally
    rather than by point mutation.

    The generalisable point is that a patient with an 18p deletion spanning TYMS has one of
    the two required lesions already, and should be evaluated for the dyskeratosis congenita
    features that would otherwise be attributed to the chromosomal syndrome.
  evidence:
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case highlights that individuals with deletions at 18p encompassing TYMS should be
      evaluated for features of digenic dyskeratosis congenita.
    explanation: >-
      The authors' own recommendation, which is the diagnostic point of their report.

treatments:

- name: Avoidance of Fluoropyrimidines and Hydroxyurea
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: avoidance of thymidylate synthase inhibitors
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    The one management point specific to this genotype rather than shared with dyskeratosis
    congenita generally. Patient cells are hypersensitive to 5-fluorouracil, which acts on
    the enzyme these patients already lack, and separately to hydroxyurea.

    This is not a hypothetical. A proband in the defining cohort developed squamous
    carcinoma and melanoma of the leg - the cancer risk dyskeratosis congenita carries -
    was treated with topical 5-fluorouracil, and had a severe adverse response. The
    situation the recommendation covers is therefore one that has already occurred once.

    What remains unestablished is the systemic case: that exposure was topical, in a single
    patient, with no dose data and no information on how a systemic fluoropyrimidine would
    behave. The recommendation to avoid is accordingly firmer than a pure cell-culture
    inference and weaker than a dose-adjustment guideline.
  target_mechanisms:
  - target: Antimetabolite Hypersensitivity
    treatment_effect: MODULATES
    description: >-
      Avoidance does not act on the disease mechanism. It removes an exposure the genotype
      cannot tolerate.
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has shown a severe adverse response to topical 5-FU when undergoing treatment for her
      squamous carcinoma and melanoma in her leg
    explanation: >-
      The observed clinical reaction that the avoidance recommendation rests on. One
      patient, topical route.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      hypersensitivity to the TYMS-specific inhibitor 5-fluorouracil
    explanation: >-
      The cellular hypersensitivity that explains the reaction and generalises it beyond
      the one patient in whom it was seen. INDIRECT because a cell-culture dose response
      does not by itself fix a clinical threshold.
  notes: >-
    Corrected after review. An earlier version of this entry stated in four places that no
    DKCB8 patient had ever received a fluoropyrimidine, and built a knowledge gap and a
    proposed experiment on that premise. It is not true: the cached full text of
    PMID:35931051 reports a proband with a severe adverse response to topical 5-FU during
    treatment for squamous carcinoma and melanoma. The claim came from reading the
    abstract and the deep-research report, which makes the same omission, rather than the
    full text that was already in this pull request.

    What the evidence now supports: one observed topical reaction, plus cellular
    hypersensitivity to both 5-fluorouracil and hydroxyurea in proband lymphoblastoid
    cells. What it does not support: any statement about systemic dosing, about severity
    grading, or about whether DPYD-based pharmacogenomic screening would flag such a
    patient.

- name: Malignancy Surveillance
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    Shared with dyskeratosis congenita generally rather than specific to this genotype, but
    it is the piece of class-level management this entry cannot omit: the cohort contains a
    proband with basal cell carcinoma, squamous carcinoma and melanoma, and this entry's
    one genotype-specific recommendation is about what not to treat such a cancer with.
  evidence:
  - reference: PMID:20301779
    reference_title: "Dyskeratosis Congenita and Related Telomere Biology Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      For cancer risk: monthly self-examination for oral, head, and neck cancer; annual
      cancer screening by an otolaryngologist and dermatologist; annual gynecologic
      examination.
    explanation: >-
      The GeneReviews surveillance schedule for dyskeratosis congenita and the telomere
      biology disorders. INDIRECT: GeneReviews predates the TYMS-ENOSF1 entity and does not
      mention TYMS, so this applies to DKCB8 by virtue of its being a telomere biology
      disorder rather than by having been studied in it.
  notes: >-
    Recorded here rather than left to the parent entry because the interaction with the
    antimetabolite hypersensitivity above is genotype-specific: surveillance finds the
    cancer, and the genotype constrains how it can be treated.

- name: Androgen Therapy and Hematopoietic Cell Transplantation
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: management of bone marrow failure in a telomere biology disorder
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  description: >-
    Class-level management of the marrow failure that defines dyskeratosis congenita.
    Recorded for completeness, and with an explicit caveat: the eight-family TYMS cohort
    was largely young at sampling and showed little haematological abnormality, so how
    often DKCB8 patients reach a transplant decision is not established.
  evidence:
  - reference: PMID:20301779
    reference_title: "Dyskeratosis Congenita and Related Telomere Biology Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Hematopoietic cell transplantation (HCT) is the only curative
      treatment for BMF and leukemia, but long-term outcome has historically been poor
      due to treatment toxicity; if a suitable donor is not available, androgen
      therapy may be considered for BMF.
    explanation: >-
      The GeneReviews statement of the two options for marrow failure. INDIRECT for the
      same reason as the surveillance row: it is class-level guidance, not DKCB8 data.
  - reference: PMID:20301779
    reference_title: "Dyskeratosis Congenita and Related Telomere Biology Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Of note, cancer therapy may pose an increased risk for prolonged
      cytopenias as well as pulmonary and hepatic toxicity.
    explanation: >-
      Worth carrying because it compounds the genotype-specific problem above: cancer
      therapy is already hazardous in a telomere biology disorder before the thymidylate
      synthase deficiency is taken into account.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Harder than for a recessive disease, and the difficulty is worth stating. Recurrence
    risk is not the standard 25%: it depends on transmission of both the TYMS
    loss-of-function allele and the ENOSF1 haplotype, which segregate independently. Testing
    a relative for the TYMS variant alone gives an incomplete answer, and no published
    recurrence figure exists.

differential_diagnoses:

- name: Telomerase and shelterin forms of dyskeratosis congenita
  description: >-
    Clinically indistinguishable - same triad, same marrow failure, same short telomeres -
    and separable only genetically. The practical consequence is that a negative standard
    dyskeratosis congenita panel does not exclude a telomere biology disorder, because this
    one is not on it in a form the panel can call.

- name: Ring chromosome 18 and 18p deletion syndromes
  description: >-
    Works in both directions. A patient ascertained for an 18p deletion may have DKCB8
    hiding inside the chromosomal diagnosis if the deletion spans TYMS and an ENOSF1
    haplotype is present in trans; and features of the chromosomal syndrome may be
    misattributed to dyskeratosis congenita. The single confirmed case report is exactly
    this situation.
  evidence:
  - reference: PMID:40207375
    reference_title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had physical and developmental features of 18p monosomy, including poor
      growth, feeding issues, distinctive facial features, and strabismus.
    explanation: >-
      Shows the two diagnoses co-occurring, with features attributable to the chromosomal
      abnormality rather than to DKCB8 - which is why this entry does not curate those
      features as DKCB8 phenotypes.

discussions:

- discussion_id: dkcb8_mondo_gene_association_is_wrong
  kind: KNOWLEDGE_GAP
  prompt: >-
    MONDO asserts DCLRE1B as the causal gene of MONDO:0859319, but OMIM 620133 - to which
    MONDO maps this term equivalentTo - is the TYMS-ENOSF1 entity. Which is right, and what
    should downstream consumers of the MONDO axiom do?
  rationale: >-
    This is a data-quality problem rather than a biological one, and it is recorded here
    because it actively misled this curation.

    MONDO contains the edge `MONDO:0859319 RO:0004003 HGNC:17641`, naming DCLRE1B. The
    dismech curation stub for this disease was generated by `just enrich-stubs`, which reads
    exactly that edge, so the stub carried DCLRE1B; the claim issue written from the stub
    repeated it; and the curation began by assembling DCLRE1B literature. The error was
    caught only when the deep-research report came back about TYMS.

    The evidence that TYMS-ENOSF1 is correct is direct: OMIM 620133 is mapped equivalentTo
    MONDO:0859319, and the entity OMIM 620133 describes is the one Tummala et al. defined
    across eight families, confirmed independently in 2025. DCLRE1B is a genuine telomere
    gene with a genuine human phenotype - Apollo is the nuclease that processes leading-end
    telomeres, and a dominant-negative splice variant was reported in a Hoyeraal-Hreidarsson
    patient - but that is a different entity from DKCB8.

    Two things follow. Upstream, the MONDO axiom should be corrected. Downstream, nothing in
    the dismech stub records that `genes:` is a machine-copied single ontology assertion
    rather than a curated fact, so it reads with the same authority as the rest of the file.
    That is the generalisable gap: a provenance or confidence marker on the enriched fields
    would have made this checkable without a deep-research run.
  attaches_to:
  - genetic#TYMS
  - genetic#ENOSF1

- discussion_id: dkcb8_fluoropyrimidine_toxicity_beyond_the_index_case
  kind: KNOWLEDGE_GAP
  prompt: >-
    One DKCB8 proband had a severe adverse response to topical 5-fluorouracil. Does that
    extend to systemic fluoropyrimidines, at what dose, and would standard DPYD-based
    pharmacogenomic screening identify such a patient?
  rationale: >-
    Re-scoped after review. This discussion previously asked whether the cellular
    hypersensitivity translates to patients at all, and asserted that no DKCB8 patient had
    ever received a fluoropyrimidine. That assertion was false: the defining cohort reports
    a proband with a severe adverse response to topical 5-fluorouracil during treatment for
    squamous carcinoma and melanoma of the leg. The error came from working off the
    abstract and the deep-research report rather than the cached full text.

    What is actually open is narrower and more useful. The reported exposure was topical
    and in one patient, so there is no systemic dosing experience, no severity grading
    against a standard toxicity scale, and no attenuated-dose protocol. Separately, nothing
    is known about whether DPYD-based screening would flag such a patient; on mechanism it
    should not, because the lesion is in the drug's target rather than in its catabolic
    pathway, and that prediction has never been tested.

    The asymmetry that made this worth recording is unchanged and is now better supported:
    the patient who most needs a fluoropyrimidine is the one whose dyskeratosis congenita
    gave her the squamous cell carcinoma, and she is the patient least able to tolerate
    it.
  attaches_to:
  - pathophysiology#Antimetabolite Hypersensitivity
  - treatments#Avoidance of Fluoropyrimidines and Hydroxyurea
  proposed_experiments:
  - experiment_id: dkcb8_dpd_screening_adequacy
    name: Retrospective review of fluoropyrimidine exposure in telomere biology disorder patients with TYMS variants
    description: >-
      Starting from the one reported topical exposure, identify further patients with
      dyskeratosis congenita and a TYMS loss-of-function allele who have received a
      fluoropyrimidine by any route, and review toxicity against matched dyskeratosis
      congenita patients without one. Systemic exposures are the ones that matter, since
      the reported case is topical. In parallel, test whether standard DPYD genotype-based
      screening would have identified any of them as at risk.
    readouts:
    - name: Grade 3-4 fluoropyrimidine toxicity rate
      target: pathophysiology#Antimetabolite Hypersensitivity
      direction: INCREASED
      interpretation: >-
        Excess toxicity in TYMS-variant carriers would convert the cell-based prediction into
        a clinical contraindication.
    would_support:
    - pathophysiology#Antimetabolite Hypersensitivity
    supporting_outcome:
    - >-
      Severe toxicity at standard systemic doses in TYMS-variant patients who passed DPYD
      screening, extending the reported topical reaction to systemic exposure and
      establishing the inadequacy of current screening for it.
    would_refute:
    - pathophysiology#Antimetabolite Hypersensitivity
    refuting_outcome:
    - >-
      Systemic fluoropyrimidine tolerance comparable to other dyskeratosis congenita
      patients, which would confine the hazard to topical high-local-concentration exposure
      rather than establishing a systemic contraindication.

references:

- reference: PMID:35931051
  title: Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita.
  findings:
  - statement: >-
      Heterozygous germline TYMS loss-of-function variants, inherited in trans with a
      specific ENOSF1 haplotype from an unaffected parent with a wild-type TYMS coding
      sequence, cause dyskeratosis congenita across eight independent families.
    supporting_text: >-
      In a cohort of eight independent DC-affected families, we have identified a remarkable
      series of heterozygous germline variants in the gene encoding thymidylate synthase
      (TYMS).
  - statement: >-
      The telomere defect is downstream of nucleotide metabolism: shelterin is unchanged
      while telomerase regulation is impaired.
    supporting_text: >-
      whereas the amount of shelterin protein components (TIN2, TPP1, TRF1 and POT1; Figure
      2J), which protect telomeres, remained unchanged, indicating that defects in telomere
      length maintenance are a consequence of impaired telomerase regulation in these TYMS
      deficient probands as a result of altered nucleotide metabolism
  - statement: >-
      A proband treated with topical 5-fluorouracil for cutaneous malignancy had a severe
      adverse response, which is the only reported clinical drug exposure in this disease.
    supporting_text: >-
      has shown a severe adverse response to topical 5-FU when undergoing treatment for her
      squamous carcinoma and melanoma in her leg

- reference: PMID:40207375
  title: "TYMS-ENOSF1 Dyskeratosis Congenita in a Patient With Ring Chromosome 18: A Case Report."
  findings:
  - statement: >-
      Independent confirmation of the TYMS-ENOSF1 entity in a patient whose ring chromosome
      18 supplied the TYMS deletion, with the classical mucocutaneous triad and a confirmed
      short telomere length.
    supporting_text: >-
      In early infancy, he developed diffuse hyperpigmentation as well as numerous punctate
      hypopigmented macules, sparse hair, and nail dystrophy

- reference: PMID:20301779
  title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Class-level management of the telomere biology disorders: transplantation or androgens
      for marrow failure, and a defined cancer-surveillance schedule. This GeneReviews
      chapter predates the TYMS-ENOSF1 entity and does not mention TYMS, so it is cited here
      only for management shared across the telomere biology disorders and never for a
      DKCB8-specific claim.
    supporting_text: >-
      Hematopoietic cell transplantation (HCT) is the only curative
      treatment for BMF and leukemia, but long-term outcome has historically been poor
      due to treatment toxicity; if a suitable donor is not available, androgen
      therapy may be considered for BMF.

notes: >-
  Identity. This entry curates the disease OMIM 620133 describes: digenic TYMS-ENOSF1
  dyskeratosis congenita. MONDO's causal-gene axiom for MONDO:0859319 names DCLRE1B and is
  wrong; the discussion above records the evidence and how the error propagated into this
  repository's curation stub. The entry's filename and `name` retain the MONDO label so the
  identifier and the record stay aligned.

  Evidence base. Two clinical references: the eight-family defining cohort and one
  independent confirmatory case report. Eight families is unusually strong for an ultra-rare
  entity and is what makes the digenic claim credible; but the individual phenotype detail
  comes largely from the single case report, and two phenotype rows are graded INDIRECT
  because their support is a statement about dyskeratosis congenita as a class rather than
  about these patients.

  What is graded IN_VITRO and why it matters. The epistatic silencing, the enzyme
  deficiency, the nucleotide pool imbalance, the genotoxic stress and the drug
  hypersensitivities were all measured in proband-derived lymphoblastoid cells. That is
  strong evidence about mechanism and it is not, by itself, evidence about patients.

  The fluoropyrimidine correction. An earlier version of this entry said in four places
  that no DKCB8 patient had ever received a fluoropyrimidine and that the avoidance
  recommendation was purely this entry's inference from cell data. That was wrong. The
  cached full text of PMID:35931051 reports a proband with a severe adverse response to
  topical 5-FU during treatment for her squamous carcinoma and melanoma, and the Table 1
  footnote for that proband records the same. The claim was written from the abstract and
  from a deep-research report that makes the same omission, while the full text sat in the
  same pull request. The entry now carries that observation as HUMAN_CLINICAL evidence on
  the pathophysiology node and on the treatment, and the associated discussion asks the
  narrower question that is genuinely open: whether a topical reaction in one patient
  extends to systemic dosing.

  Phenotype frequencies are graded from Table 1 of the defining cohort, not from the
  disease class. That matters most for bone marrow failure, which is definitional for
  dyskeratosis congenita and appears in only 1 of 10 probands here; see that row for the
  two readings the data cannot separate. Leukoplakia is likewise 4 of 10 rather than
  near-universal, while hair loss is 9 of 10, and immunoglobulin deficiency is present in 6
  of 10 despite not being part of the classical triad.

  One confounder worth carrying forward. The only individually described patient also has
  ring chromosome 18 with partial 18p and 18q monosomy. His poor growth, feeding
  difficulties, facial features and strabismus are attributed by his own authors to the 18p
  monosomy and are deliberately not curated here as DKCB8 phenotypes.

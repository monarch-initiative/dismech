- category: Oral
  name: Oral Leukoplakia
  frequency: FREQUENT
  description: >-
    The third element of the triad, and the one element of it that is not near-universal in
    this cohort: Table 1 records leukoplakia in 4 of the 10 probands, against 10 of 10 for
    skin pigmentation and nail dystrophy. Graded from the cohort rather than from the
    class-level description of dyskeratosis congenita.
  phenotype_term:
    preferred_term: Oral leukoplakia
    term:
      id: HP:0002745
      label: Oral leukoplakia
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a triad of mucocutaneous features that include abnormal skin pigmentation, nail
      dystrophy, and oral leucoplakia
    explanation: >-
      Names oral leukoplakia as part of the dyskeratosis congenita triad. Graded INDIRECT
      because the sentence characterises dyskeratosis congenita as a class; that these
      particular patients had leukoplakia follows from their diagnosis rather than being
      separately reported in the abstract.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leukoplakia | Y | N | N | N | N | N | Y | N | Y | Y
    explanation: >-
      The Table 1 row, 4 of 10 probands, which is what the FREQUENT band is graded from.

- category: Hematologic
  name: Bone Marrow Failure
  frequency: OCCASIONAL
  description: >-
    Graded from the cohort, not from the disease class, and the two disagree sharply. Marrow
    failure is definitional for dyskeratosis congenita and dominates its prognosis; in the
    eight-family TYMS cohort Table 1 records a haematological abnormality in 1 of 10
    probands (anemia at 98 g/L with otherwise normal counts), with three further probands
    having normal counts but raised HbF. An earlier version of this entry graded this
    VERY_FREQUENT with severity SEVERE on the class-level statement alone.

    Two readings are open and the data do not separate them. Most of these probands were
    sampled young - six were four years old or less - and marrow failure in dyskeratosis
    congenita is progressive, so the cohort may simply be too young. Alternatively the
    TYMS-ENOSF1 form may genuinely spare the marrow relative to the telomerase forms, which
    would be a real distinction worth knowing. Raised HbF in three probands is a hint of
    early marrow stress in either reading. The `severity` qualifier has been dropped because
    nothing in either source supports a severity grading for this cohort.
  phenotype_term:
    preferred_term: Bone marrow failure
    term:
      id: HP:0005528
      label: Bone marrow hypocellularity
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hematological abnormalities | N a | N | N b | Y c | N | N | N d | N | N | N
    explanation: >-
      The Table 1 row the OCCASIONAL band is graded from. One affected proband out of ten;
      footnotes a, b and d are raised HbF on otherwise normal counts and footnote c is the
      anemia.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone-marrow failure, predisposition to cancer, and pulmonary abnormalities are
      reported to be major causes of death in DC-affected individuals.
    explanation: >-
      The class-level expectation, retained because it is what makes the cohort figure
      surprising. INDIRECT: it is a statement about dyskeratosis congenita, not about these
      patients.

- category: Immunologic
  name: Decreased Circulating Immunoglobulin
  frequency: FREQUENT
  description: >-
    The most under-recognised finding in this cohort and absent from an earlier version of
    this entry. Table 1 records immune defects in 6 of 10 probands, with one negative and
    three unknown; the footnotes specify the defect as low IgM, low IgA, or low IgA with
    low IgG. Three probands additionally had recurrent infections in the first year of
    life. Hypogammaglobulinemia is not part of the classical dyskeratosis congenita triad,
    so it is worth checking for in a patient with this genotype.
  phenotype_term:
    preferred_term: Low IgA, IgM or IgG
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune defects | Y e | Y f | Y g | Y h | Y i | ? | N | Y j | ? | ?
    explanation: >-
      The Table 1 row the FREQUENT band is graded from: six affected, one unaffected, three
      unknown.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      eLow IgM.fLow IgA and IgG.gLow IgM.hLow IgA.iLow IgA.jLow IgA.
    explanation: >-
      The footnotes behind that row, which is what fixes the binding to decreased
      immunoglobulin concentration rather than to immunodeficiency generally.

- category: Neoplastic
  name: Cutaneous Malignancy
  frequency: OCCASIONAL
  description: >-
    One proband, aged 26 at sampling, had basal cell carcinoma of the chest plus squamous
    carcinoma and melanoma of the leg. That is 1 of 10 in a cohort most of whom were
    children, so the figure is a floor rather than a lifetime risk; cancer predisposition
    is a recognised feature of dyskeratosis congenita generally.

    This row exists because it is load-bearing for the rest of the entry rather than
    because one case is much evidence: it is the same proband whose squamous carcinoma was
    treated with topical 5-fluorouracil, and the reaction to that treatment is this entry's
    one genotype-specific management point.
  phenotype_term:
    preferred_term: Basal cell carcinoma, squamous carcinoma and melanoma of the skin
    term:
      id: HP:0008069
      label: Neoplasm of the skin
  evidence:
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      basal carcinoma on the chest, squamous carcinoma and melanoma on the leg
    explanation: >-
      The three cutaneous malignancies in that proband, from her Table 1 footnote.
  - reference: PMID:35931051
    reference_title: "Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes dyskeratosis congenita."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone-marrow failure, predisposition to cancer, and pulmonary abnormalities are
      reported to be major causes of death in DC-affected individuals.
    explanation: >-
      The class-level cancer predisposition this sits within. INDIRECT: about dyskeratosis
      congenita rather than about TYMS probands.

- category: Dental
  name: Abnormal Dentition

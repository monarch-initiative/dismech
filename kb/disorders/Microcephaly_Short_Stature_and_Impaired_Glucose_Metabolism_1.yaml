name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Microcephaly, short stature, and impaired glucose metabolism 1 (MSSGM1, OMIM
  616033), also called TRMT10A syndrome, is a rare autosomal recessive disorder
  caused by biallelic loss-of-function variants in TRMT10A. The gene encodes the
  cytoplasmic tRNA methyltransferase that installs N1-methylguanosine at position
  9 (m1G9) on a subset of tRNAs.

  It is a tRNA modopathy: nothing is wrong with any protein-coding gene product
  downstream: what fails is a chemical modification of the translation apparatus
  itself. The interesting question a housekeeping defect like this raises is why
  only two tissues suffer. The founding study's answer is expression - TRMT10A is
  ubiquitous but enriched in brain and pancreatic islets, precisely the two organs
  the syndrome damages.

  The clinical core is primary microcephaly with intellectual disability, short
  stature, epilepsy, and disordered glucose handling. That last feature is not
  simply diabetes: some patients present instead with hyperinsulinaemic
  hypoglycaemia, and the syndrome has now been reported in a patient with no
  metabolic abnormality at all, so glucose dysregulation is neither uniform in
  direction nor obligate at diagnosis.

  This entry is the sibling of the knowledge base's existing
  Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism_2 (PPP1R15B/CReP).
  The two share a clinical picture and arrive at it through different failures of
  translational control - a missing tRNA modification here, dysregulated
  eIF2-alpha dephosphorylation there.
disease_term:
  preferred_term: microcephaly, short stature, and impaired glucose metabolism 1
  term:
    id: MONDO:0000208
    label: microcephaly, short stature, and impaired glucose metabolism 1
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive. The syndrome was delineated in a large consanguineous
    family with three affected children, and subsequent reports are predominantly
    homozygous cases from consanguineous unions, with compound heterozygotes also
    described.
  evidence:
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new syndrome of young onset diabetes, short stature and
      microcephaly with intellectual disability in a large consanguineous family with
      three affected children."
    explanation: Establishes recessive segregation in the founding consanguineous kindred.
  - reference: PMID:42181738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was confirmed by Sanger sequencing and showed segregation consistent
      with autosomal recessive inheritance"
    explanation: Independent confirmation of autosomal recessive segregation.

pathophysiology:
- name: Biallelic TRMT10A Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous TRMT10A variants. The founding allele is the
    nonsense change R127*, which leaves neither mRNA nor protein detectable in patient
    lymphoblasts. Missense alleles behave differently at the molecular level but
    converge on the same functional outcome - see the catalytic node below.
  downstream:
  - target: Loss of tRNA m1G9 Methyltransferase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis and whole exome sequencing were used to identify the causal
      nonsense mutation, which changed an arginine codon into a stop at position 127 of the
      tRNA methyltransferase homolog gene TRMT10A (also called RG9MTD2)."
    explanation: Identifies the founding causal allele.
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A mRNA and protein were absent in lymphoblasts from the affected
      siblings."
    explanation: Confirms the nonsense allele produces a true null at the protein level.

- name: Loss of tRNA m1G9 Methyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    TRMT10A is the mammalian orthologue of yeast Trm10 and methylates guanine 9 of
    several cytoplasmic tRNAs. The enzyme works in the nucleolus, where tRNA
    modification occurs. A point worth preserving about the missense alleles: the
    G206R variant retains normal tRNA binding affinity while losing more than 99.9% of
    catalytic activity, so the defect is in catalysis rather than in substrate
    recognition - which matters for any strategy that would try to stabilise the enzyme
    rather than replace it.
  molecular_functions:
  - preferred_term: tRNA methyltransferase activity
    term:
      id: GO:0008175
      label: tRNA methyltransferase activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  downstream:
  - target: Destabilization of Specific Cytoplasmic tRNAs
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25053765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed a striking defect (<0.1% of WT activity) for the variant enzyme"
    explanation: Quantifies the catalytic loss produced by a missense allele.
  - reference: PMID:25053765
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The binding affinity of the G206R variant enzyme to tRNA, determined by
      fluorescence anisotropy, was similar to that of the WT enzyme."
    explanation: >-
      Localises the defect to catalysis rather than substrate binding, distinguishing this
      from a loss of tRNA recognition.
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A localizes to the nucleolus of β- and non-β-cells, where tRNA
      modifications occur."
    explanation: Establishes the subcellular compartment in which the enzyme acts.

- name: Destabilization of Specific Cytoplasmic tRNAs
  biological_scale: CELLULAR
  description: >-
    Without m1G9 the affected tRNAs are less stable and their levels fall. The loss is
    selective rather than global: tRNA-Gln and initiator methionine tRNA were identified as
    TRMT10A targets in 2018, and their depletion was later confirmed across tissues in
    Trmt10a-null mice and in a human cell line lacking the enzyme.
  biological_processes:
  - preferred_term: tRNA methylation
    term:
      id: GO:0030488
      label: tRNA methylation
    modifier: DECREASED
  downstream:
  - target: Perturbed Codon-Specific Translation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38950903
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we generated Trmt10a null mice and showed that tRNAGln(CUG) and
      initiator methionine tRNA levels were universally decreased in various tissues; the
      same was true in a human cell line lacking TRMT10A."
    explanation: >-
      Confirms depletion of the target tRNA species across tissues, in both a mouse model and
      a human cell line lacking the enzyme.
  - reference: PMID:30247717
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we confirm the role of TRMT10A as a guanosine 9 tRNA methyltransferase,
      and identify tRNAGln and tRNAiMeth as two of its targets."
    explanation: >-
      The original identification of the affected tRNA species, six years before the mouse
      work confirmed their depletion in vivo.

- name: Perturbed Codon-Specific Translation
  biological_scale: CELLULAR
  description: >-
    Depleting particular tRNAs does not slow translation uniformly - it stalls ribosomes
    at the codons those tRNAs read. Ribosome profiling of mutant mouse brain shows
    slowdown at the Gln(CAG) codon, and a consequent rise in Atf4 translation through
    leaky scanning of its upstream open reading frames. Translation of a subset of
    mRNAs, particularly those encoding neuronal structures, is disproportionately
    affected. This is how a housekeeping modification produces a tissue-selective
    disease at the level of mechanism rather than only of expression.
  biological_processes:
  - preferred_term: cytoplasmic translational elongation
    term:
      id: GO:0002182
      label: cytoplasmic translational elongation
    modifier: DECREASED
  downstream:
  - target: tRNA Fragmentation and 5-prime tRNA-Gln Fragment Generation
    causal_link_type: DIRECT
  - target: Reduced Neuronal Pool in the Developing Brain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38950903
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ribosome profiling of mouse brain revealed that dysfunction of TRMT10A causes
      ribosome slowdown at the Gln(CAG) codon and increases translation of Atf4 due to
      higher frequency of leaky scanning of its upstream open reading frames."
    explanation: Establishes the codon-specific translational consequence and the ATF4 response.
  - reference: PMID:38950903
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Broadly speaking, translation of a subset of mRNAs, especially those for
      neuronal structures, is perturbed in the mutant brain."
    explanation: Shows the translational defect falls disproportionately on neuronal transcripts.

- name: tRNA Fragmentation and 5-prime tRNA-Gln Fragment Generation
  biological_scale: MOLECULAR
  description: >-
    Undermethylated tRNAs are not merely scarce - they are cleaved. Loss of guanosine 9
    methylation leads to fragmentation of tRNA-Gln, and the resulting 5-prime fragments are
    not inert debris: they are the species that mediates beta-cell death. This converts the
    endocrine arm from a story about how much tRNA is left into one about a gain of a toxic
    product, which is a different kind of mechanism and a different kind of therapeutic
    target.
  biological_processes:
  - preferred_term: tRNA catabolic process
    term:
      id: GO:0016078
      label: tRNA decay
    modifier: INCREASED
  downstream:
  - target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30247717
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that tRNA guanosine 9 hypomethylation leads to tRNAGln fragmentation
      and that 5'-tRNAGln fragments mediate TRMT10A deficiency-induced β-cell death."
    explanation: >-
      Establishes fragmentation as the step between hypomethylation and beta-cell death, and
      identifies the fragment species as the mediator rather than a by-product.

- name: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
  biological_scale: CELLULAR
  description: >-
    Beta cells die by the intrinsic apoptotic pathway, downstream of oxidative stress
    driven by the tRNA fragments. Critically this has been shown not only by silencing but
    in induced pluripotent stem cell-derived pancreatic beta-like cells carrying patients'
    own TRMT10A genotypes - so the endocrine mechanism rests on human patient-derived
    cells, not on knockdown alone.
  cell_types:
  - preferred_term: type B pancreatic cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    modifier: INCREASED
  downstream:
  - target: Reduced Beta-Cell Mass
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30247717
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using RNA interference and induced pluripotent stem cell-derived pancreatic
      β-like cells from healthy controls and TRMT10A-deficient patients we demonstrate that
      TRMT10A deficiency induces oxidative stress and triggers the intrinsic pathway of
      apoptosis in β-cells."
    explanation: >-
      Demonstrates the death mechanism in patient-derived beta-like cells, which is stronger
      evidence than the silencing experiments alone.
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A silencing induces rat and human β-cell apoptosis."
    explanation: The earlier knockdown result, consistent with the patient-cell finding.

- name: Reduced Beta-Cell Mass
  biological_scale: TISSUE
  description: >-
    The tissue-level consequence proposed to link beta-cell death to the diabetes. This is
    the claim that remains unmeasured: apoptosis has been demonstrated in patient-derived
    cells, but nobody has quantified beta-cell mass in a patient, and the mouse model shows
    no pancreatic defect at all. It is separated from the apoptosis node above precisely so
    that the model mismatch and its discussion attach to the unmeasured claim rather than to
    the demonstrated one.
  downstream:
  - target: Disordered Glucose Homeostasis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24204302
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Taken together, we propose that TRMT10A deficiency negatively affects β-cell
      mass and the pool of neurons in the developing brain."
    explanation: >-
      Curated as PARTIAL because the authors state reduced mass as a proposal, and no
      measurement of beta-cell mass in a patient has been reported.

- name: Reduced Neuronal Pool in the Developing Brain
  biological_scale: TISSUE
  description: >-
    The neurodevelopmental arm. TRMT10A is expressed in human embryonic and fetal brain,
    and the proposed consequence of its loss is a reduced pool of neurons during
    development - which is what primary microcephaly, present from birth, requires.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  downstream:
  - target: Neurodevelopmental Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In situ hybridization studies showed that TRMT10A is expressed in human
      embryonic and fetal brain."
    explanation: >-
      Establishes expression at the developmental stage and in the tissue required for a
      primary microcephaly mechanism.

- name: Disordered Glucose Homeostasis
  biological_scale: ORGANISM
  description: >-
    The metabolic endpoint, and it is bidirectional. Young-onset diabetes is the
    classical presentation, but a separate kindred presented predominantly with
    hyperinsulinaemic hypoglycaemia, and at least one reported patient has the full
    neurodevelopmental syndrome with no metabolic abnormality documented at all. A further
    patient shows that the two directions can be phases of one course rather than
    alternatives - hypoglycaemia in early childhood followed by diabetes in late childhood.
    The node is therefore named for disordered handling rather than for diabetes.
  evidence:
  - reference: PMID:25053765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects were three patients who suffered from microcephaly, intellectual
      disability, short stature, delayed puberty, seizures and disturbed glucose metabolism,
      mainly hyperinsulinaemic hypoglycaemia."
    explanation: >-
      Documents the hypoglycaemic direction of the metabolic phenotype, which is why this
      node is not simply a diabetes node.
  - reference: PMID:34541035
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed an unusual form of impaired glucose metabolism which presented in
      early childhood with hypoglycemia followed by diabetes in late childhood"
    explanation: >-
      Shows the two directions of dysregulation occurring sequentially in one patient, which
      reframes them as phases of a single course rather than as alternative presentations.

- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    Primary microcephaly with intellectual disability and, in many patients, epilepsy.
    The reported neurological spectrum has widened to include cerebellar and brainstem
    involvement - spastic-ataxic paraparesis with a Dandy-Walker variant in one case.
  evidence:
  - reference: PMID:42181738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 15-year-old male presenting with microcephaly, intellectual
      disability, epilepsy, and short stature, without evidence of diabetes or other
      metabolic abnormalities at the time of evaluation."
    explanation: >-
      Establishes the neurodevelopmental core and, importantly, that it can occur without
      any metabolic abnormality.
  - reference: PMID:39440920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands the clinical spectrum of TRMT10A syndrome highlighting the
      importance of considering this gene in the evaluation of patients with brain/cerebellar
      malformations and spastic-ataxic paraparesis."
    explanation: >-
      The source of the cerebellar and brainstem extension of the phenotype described above.


pathophysiology:
- name: Biallelic TRMT10A Loss-of-Function Variants
  description: >-
    The initiating lesion is biallelic inactivation of TRMT10A (4q23). Reported
    alleles span nonsense variants subject to nonsense-mediated decay
    (p.Arg127Ter in the index Moroccan family, p.Glu27Ter, p.Arg43Ter,
    p.Arg93Ter/p.Arg133Ter in compound heterozygosity), canonical splice-acceptor
    variants (c.496-1G>A, c.421-1G>A), a catalytically dead missense allele
    (p.Gly206Arg), and a homozygous contiguous gene deletion removing the locus.
    In the index family neither TRMT10A mRNA nor protein was detectable in
    patient lymphoblasts, establishing complete loss of the gene product rather
    than a dominant-negative or hypomorphic effect. Heterozygous parents are
    unaffected.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRMT10A
    term:
      id: hgnc:28403
      label: TRMT10A
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  downstream:
  - target: Loss of tRNA m1G9 Methyltransferase Activity
    causal_link_type: DIRECT
    description: >-
      Absence of TRMT10A protein, or expression of a catalytically inert variant,
      directly removes the cell's m1G9 methyltransferase activity.
    evidence:
    - reference: PMID:25053765
      reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Determination of the methylation activity of the expressed wild-type (WT) and variant TRMT10A enzymes with transcripts of (32)P -tRNA(Gly) GCC as a substrate revealed a striking defect (<0.1% of WT activity) for the variant enzyme."
      explanation: >-
        Direct enzymatic demonstration that a disease allele abolishes
        methyltransferase activity, establishing this causal edge.
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis and whole exome sequencing were used to identify the causal nonsense mutation, which changed an arginine codon into a stop at position 127 of the tRNA methyltransferase homolog gene TRMT10A (also called RG9MTD2)."
    explanation: Identifies TRMT10A and the first disease-causing nonsense allele.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMT10A mRNA and protein were absent in lymphoblasts from the affected siblings."
    explanation: >-
      Establishes complete loss of the gene product in patient cells, defining
      the mechanism as loss of function.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A localizes to the nucleolus of β- and non-β-cells, where tRNA modifications occur."
    explanation: Localizes the affected enzyme to the nucleolar site of tRNA modification.

- name: Loss of tRNA m1G9 Methyltransferase Activity
  description: >-
    TRMT10A is the principal — and in human cells apparently non-redundant —
    enzyme installing N1-methylguanosine at position 9 of cytoplasmic tRNAs, the
    mammalian orthologue of yeast Trm10. Its activity is lost outright by
    nonsense and splice alleles, and reduced below 0.1% of wild type by the
    p.Gly206Arg missense variant, which retains normal tRNA binding but cannot
    use the S-adenosylmethionine methyl donor. This separates substrate
    recognition from catalysis and shows the disease mechanism is loss of
    methyl transfer rather than loss of tRNA engagement.
  role: intermediate
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: tRNA (guanosine(9)-N1)-methyltransferase activity
    term:
      id: GO:0052905
      label: tRNA (guanosine(9)-N1)-methyltransferase activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: tRNA methylation
    term:
      id: GO:0030488
      label: tRNA methylation
    modifier: DECREASED
  downstream:
  - target: tRNA Hypomethylation, Destabilization and Fragmentation
    causal_link_type: DIRECT
    description: >-
      Absent m1G9 leaves target tRNAs hypomodified in the D-loop, reducing their
      steady-state stability and exposing them to endonucleolytic cleavage.
    evidence:
    - reference: PMID:30247717
      reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that tRNA guanosine 9 hypomethylation leads to tRNAGln fragmentation and that 5'-tRNAGln fragments mediate TRMT10A deficiency-induced β-cell death."
      explanation: >-
        Directly links loss of guanosine-9 methylation to tRNA fragmentation,
        establishing this edge.
  evidence:
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The completely abolished m(1)G9 methyltransferase activity of the mutant enzyme is likely due to significant defects in its ability to bind the methyl donor S-adenosyl methionine."
    explanation: >-
      Attributes the catalytic failure of the p.Gly206Arg allele to loss of
      methyl-donor binding.
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The binding affinity of the G206R variant enzyme to tRNA, determined by fluorescence anisotropy, was similar to that of the WT enzyme."
    explanation: >-
      Shows tRNA binding is preserved, isolating the defect to catalysis rather
      than substrate recognition.
  - reference: PMID:30247717
    reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we confirm the role of TRMT10A as a guanosine 9 tRNA methyltransferase, and identify tRNAGln and tRNAiMeth as two of its targets."
    explanation: >-
      Confirms the enzymatic assignment in human cells and names the two
      physiologically critical substrate tRNAs.

- name: tRNA Hypomethylation, Destabilization and Fragmentation
  description: >-
    Hypomodified tRNAs are degraded or cleaved rather than simply carried in an
    unmethylated state. In Trmt10a null mice and in a TRMT10A-null human cell
    line the steady-state levels of tRNA-Gln(CUG) and initiator methionine tRNA
    fall across tissues, and in patient-derived beta-like cells tRNA-Gln is
    cleaved into 5' fragments. The fragments are not inert by-products: purified
    5'-tRNA-Gln fragments are themselves sufficient to kill beta cells, making
    this node both a loss of translational capacity and a gain of a cytotoxic
    species.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tRNA decay
    term:
      id: GO:0016078
      label: tRNA decay
    modifier: INCREASED
  downstream:
  - target: Codon-Specific Translational Impairment
    causal_link_type: DIRECT
    description: >-
      Depletion of tRNA-Gln and initiator methionine tRNA restricts decoding of
      the corresponding codons and initiation of translation.
    evidence:
    - reference: PMID:38950903
      reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ribosome profiling of mouse brain revealed that dysfunction of TRMT10A causes ribosome slowdown at the Gln(CAG) codon and increases translation of Atf4 due to higher frequency of leaky scanning of its upstream open reading frames."
      explanation: >-
        Demonstrates directly that the tRNA deficit translates into
        codon-specific ribosome stalling and altered uORF-controlled translation.
  - target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
    causal_link_type: DIRECT
    description: >-
      5'-tRNA-Gln fragments generated by hypomethylation are the proximate
      mediators of beta-cell death in TRMT10A deficiency.
    evidence:
    - reference: PMID:30247717
      reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that tRNA guanosine 9 hypomethylation leads to tRNAGln fragmentation and that 5'-tRNAGln fragments mediate TRMT10A deficiency-induced β-cell death."
      explanation: >-
        Establishes the tRNA fragments as the causal mediators between
        hypomethylation and beta-cell death.
  evidence:
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we generated Trmt10a null mice and showed that tRNAGln(CUG) and initiator methionine tRNA levels were universally decreased in various tissues; the same was true in a human cell line lacking TRMT10A."
    explanation: >-
      Documents the loss of the two key tRNA species in vivo and, importantly,
      confirms the same effect in a human cell line.
  - reference: PMID:30247717
    reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study unmasks tRNA hypomethylation and fragmentation as a hitherto unknown mechanism of pancreatic β-cell demise relevant to monogenic and polygenic forms of diabetes."
    explanation: Frames hypomethylation-plus-fragmentation as the disease mechanism.

- name: Coordinated mRNA m6A Dysregulation via the FTO Axis
  description: >-
    Beyond its catalytic role on tRNA, TRMT10A physically interacts with the
    mRNA demethylase FTO. Ablating TRMT10A therefore raises m6A on a shared set
    of mRNAs, which are then destabilized through the m6A reader YTHDF2. The
    affected transcripts are enriched for codons read by the very tRNAs that
    carry m1G9 (tRNA-Gln(TTG), tRNA-Arg(CCG), tRNA-Thr(CGT)), coupling the tRNA
    and mRNA arms of the lesion. This is a parallel, non-catalytic route by
    which TRMT10A loss perturbs gene expression, and it is why the disorder is
    not fully explained by tRNA methylation alone.
  role: modifier
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FTO
    term:
      id: hgnc:24678
      label: FTO
  biological_processes:
  - preferred_term: mRNA catabolic process
    term:
      id: GO:0006402
      label: mRNA catabolic process
    modifier: INCREASED
  downstream:
  - target: Codon-Specific Translational Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Accelerated decay of m6A-marked transcripts compounds the codon-level
      translational deficit arising from tRNA loss, acting on an overlapping set
      of messages.
    evidence:
    - reference: PMID:32213595
      reference_title: "Coordination of mRNA and tRNA methylations by TRMT10A."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Furthermore, transcripts with increased m6A upon TRMT10A ablation contain an overrepresentation of m1G9-containing tRNAs codons read by tRNAGln(TTG), tRNAArg(CCG), and tRNAThr(CGT)"
      explanation: >-
        Shows the mRNA and tRNA arms converge on the same codons, supporting a
        compounding effect; the functional consequence for the disease phenotype
        is inferred rather than directly measured, hence PARTIAL.
  evidence:
  - reference: PMID:32213595
    reference_title: "Coordination of mRNA and tRNA methylations by TRMT10A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that a tRNA methyltransferase, TRMT10A, interacts with an mRNA demethylase FTO (ALKBH9), both in vitro and inside cells."
    explanation: Establishes the physical TRMT10A-FTO interaction underlying this node.
  - reference: PMID:32213595
    reference_title: "Coordination of mRNA and tRNA methylations by TRMT10A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that TRMT10A ablation not only leads to decreased m1G in tRNA but also significantly increases m6A levels in mRNA."
    explanation: >-
      Demonstrates that TRMT10A loss raises mRNA m6A in addition to lowering
      tRNA m1G.

- name: Codon-Specific Translational Impairment
  description: >-
    Loss of initiator methionine tRNA and tRNA-Gln does not shut down protein
    synthesis globally; it biases it. Ribosome profiling of Trmt10a null mouse
    brain shows slowing at Gln(CAG) codons and, because initiator tRNA is
    limiting, more frequent leaky scanning past the upstream open reading frames
    of Atf4 — the canonical integrated-stress-response sensor — so ATF4 is
    translationally derepressed without an upstream eIF2-alpha kinase signal.
    Transcripts encoding neuronal structural proteins are among those most
    perturbed, which is the proposed link between a housekeeping RNA-modification
    enzyme and a specifically neurodevelopmental phenotype.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: translational initiation
    term:
      id: GO:0006413
      label: translational initiation
    modifier: DECREASED
  - preferred_term: integrated stress response signaling
    term:
      id: GO:0140467
      label: integrated stress response signaling
    modifier: INCREASED
  downstream:
  - target: Reduced Neural Progenitor Pool in the Developing Brain
    causal_link_type: DIRECT
    description: >-
      Perturbed translation of neuronal transcripts in a tissue enriched for
      TRMT10A expression restricts the neuronal pool generated during
      development.
    evidence:
    - reference: PMID:24204302
      reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Taken together, we propose that TRMT10A deficiency negatively affects β-cell mass and the pool of neurons in the developing brain."
      explanation: >-
        The authors advance this as a proposal grounded in the expression
        pattern and the beta-cell apoptosis data rather than a direct
        measurement of neural progenitors, so the edge is PARTIAL.
  - target: Impaired Synaptic Structure and Plasticity
    causal_link_type: DIRECT
    description: >-
      Reduced synthesis of neuronal structural proteins translates into smaller
      postsynaptic densities and impaired plasticity in the null mouse.
    evidence:
    - reference: PMID:38950903
      reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Broadly speaking, translation of a subset of mRNAs, especially those for neuronal structures, is perturbed in the mutant brain."
      explanation: >-
        Identifies neuronal structural transcripts as the selectively affected
        class, linking this node to the synaptic phenotype.
  evidence:
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ribosome profiling of mouse brain revealed that dysfunction of TRMT10A causes ribosome slowdown at the Gln(CAG) codon and increases translation of Atf4 due to higher frequency of leaky scanning of its upstream open reading frames."
    explanation: >-
      Provides the mechanistic content of this node: codon-specific stalling
      plus translational derepression of ATF4.
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, our study provides mechanistic insight into the roles of TRMT10A in the brain, and exemplifies the importance of universal tRNA modification during translation of specific codons."
    explanation: >-
      States the general principle that a universal tRNA modification acts
      through specific-codon translation.

- name: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
  description: >-
    Pancreatic beta cells are among the tissues with the highest TRMT10A
    expression and the highest secretory protein-synthetic load, and they are the
    cell type in which the consequences of tRNA hypomethylation have been worked
    out directly. Silencing TRMT10A kills rat and human beta cells. In
    iPSC-derived beta-like cells from TRMT10A-deficient patients the deficiency
    raises reactive oxygen species and engages the intrinsic (mitochondrial)
    apoptotic pathway, and sensitizes the cells to ER-stress-induced apoptosis on
    top of that baseline.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  locations:
  - preferred_term: pancreatic islet
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  - preferred_term: intrinsic apoptotic signaling pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    modifier: INCREASED
  downstream:
  - target: Progressive Beta-Cell Mass Loss
    causal_link_type: DIRECT
    description: >-
      Cumulative apoptotic attrition of beta cells over years erodes functional
      beta-cell mass.
    evidence:
    - reference: PMID:25053765
      reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that TRMT10A deficiency accounts for abnormalities in glucose homeostasis initially manifesting both ketotic and non-ketotic hypoglycaemic events with transition to diabetes in adolescence, perhaps as a consequence of accelerated β cell apoptosis."
      explanation: >-
        The authors explicitly frame accelerated beta-cell apoptosis as the
        proposed driver ("perhaps as a consequence"), so this edge is PARTIAL.
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A silencing induces rat and human β-cell apoptosis."
    explanation: >-
      Direct experimental demonstration that loss of TRMT10A is sufficient to
      kill beta cells in both species.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A is ubiquitously expressed but enriched in brain and pancreatic islets, consistent with the tissues affected in this syndrome."
    explanation: >-
      Explains the tissue selectivity of a lesion in an otherwise housekeeping
      enzyme.
  - reference: PMID:30247717
    reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that TRMT10A deficiency induces oxidative stress and triggers the intrinsic pathway of apoptosis in β-cells"
    explanation: >-
      Identifies oxidative stress and the intrinsic apoptotic pathway as the
      effector mechanism, using patient-derived iPSC beta-like cells.
  - reference: PMID:30247717
    reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A deficiency induces oxidative stress and sensitizes iPSC-derived β-like cells to endoplasmic reticulum stress-induced apoptosis."
    explanation: >-
      Documents the additional sensitization to ER stress layered on the
      baseline oxidative insult.

- name: Progressive Beta-Cell Mass Loss
  description: >-
    Cumulative apoptotic attrition of beta cells, the cellular state that links
    the apoptosis node to the whole-organism glucose phenotype. Loss is partial
    rather than complete at the time patients present: C-peptide remains
    detectable, endogenous insulin secretion persisted 22 months after diabetes
    onset in one patient, and near-normal glucose was maintained for three days
    entirely off insulin. Because attrition is gradual, the reserve available to
    an individual is a function of age, which is what makes the downstream
    glucose phenotype evolve rather than present fully formed.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  downstream:
  - target: Biphasic Glucose Dysregulation
    causal_link_type: DIRECT
    description: >-
      Falling beta-cell reserve is the proposed basis of the shift from
      hypoglycaemia in childhood to overt diabetes in adolescence or young
      adulthood.
    evidence:
    - reference: PMID:25053765
      reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that TRMT10A deficiency accounts for abnormalities in glucose homeostasis initially manifesting both ketotic and non-ketotic hypoglycaemic events with transition to diabetes in adolescence, perhaps as a consequence of accelerated β cell apoptosis."
      explanation: >-
        The authors frame the transition as a proposal ("perhaps as a
        consequence"), so this edge is PARTIAL.
  evidence:
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endogenous insulin secretion still persisted 22 months after onset of diabetes and relatively normal glucose levels were kept over 3 days without insulin treatment."
    explanation: >-
      Shows the loss is partial rather than complete, unlike autoimmune type 1
      diabetes.
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fluctuating course of puberty and diabetes may reflect intermittent apoptotic damages due to sensitization of the relevant cells to various stress agents in the absence of functional TRMT10A."
    explanation: >-
      Proposes intermittent stress-triggered apoptosis as the basis of the
      fluctuating endocrine course.

- name: Biphasic Glucose Dysregulation
  description: >-
    The whole-organism glucose phenotype, which evolves rather than presenting
    fully formed. In several kindreds the first metabolic manifestation in
    infancy or childhood is hypoglycaemia — ketotic and non-ketotic events, in
    some patients frankly hyperinsulinaemic — followed years later by overt
    diabetes. Onset ranges from childhood to the third decade, and in at least
    one adolescent with a confirmed biallelic nonsense genotype no metabolic
    abnormality had appeared by age 15.
  role: consequence
  biological_scale: ORGANISM
  downstream:
  - target: Peripheral Insulin Resistance
    causal_link_type: UNKNOWN
    description: >-
      Marked insulin resistance is documented in several patients, but whether it
      is a consequence of the beta-cell lesion, an independent effect of TRMT10A
      loss in insulin-target tissues, or secondary to body composition is not
      established. The link type is recorded as UNKNOWN rather than asserted.
    evidence:
    - reference: PMID:33067246
      reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "It adds to current knowledge of TRMT10A related with young-onset non-insulin-dependent diabetes and confirms the a single previous report of insulin resistance in this syndrome."
      explanation: >-
        Confirms insulin resistance occurs in the syndrome but offers no
        mechanism connecting it to beta-cell loss, hence PARTIAL and an UNKNOWN
        link type.
  evidence:
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects were three patients who suffered from microcephaly, intellectual disability, short stature, delayed puberty, seizures and disturbed glucose metabolism, mainly hyperinsulinaemic hypoglycaemia."
    explanation: >-
      Documents the early hypoglycaemic phase of the biphasic glucose
      phenotype.
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes was diagnosed while the subjects were in their 20s and was characterized by insulin resistance."
    explanation: >-
      Documents the late end of the onset range and the insulin-resistant
      presentation.

- name: Peripheral Insulin Resistance
  description: >-
    A distinct metabolic arm, present in a subset of patients and clinically
    consequential because it dictates a different treatment. Formal testing in
    the Scottish kindred showed a Matsuda index of 1.46 against a control value
    around 14, and a Chinese patient with marked insulin resistance responded to
    metformin with HbA1c falling from 14.4% to 6.8% in three months. Neither the
    tRNA-fragment mechanism nor beta-cell apoptosis explains peripheral insulin
    resistance, so this node is recorded as an evidenced but mechanistically
    unexplained arm rather than as a downstream consequence of beta-cell loss.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cellular response to insulin stimulus
    term:
      id: GO:0032869
      label: cellular response to insulin stimulus
    modifier: DECREASED
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings were suggestive of insulin resistance"
    explanation: >-
      Reports the formal insulin-sensitivity testing that established this arm
      of the metabolic phenotype.
  - reference: PMID:33067246
    reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diabetes was due to marked insulin resistance and responded very well to metformin treatment."
    explanation: >-
      Independent confirmation of the insulin-resistant arm and its therapeutic
      implication.

- name: Reduced Neural Progenitor Pool in the Developing Brain
  description: >-
    TRMT10A is expressed in human embryonic and fetal brain, and the microcephaly
    is congenital and primary — brain architecture is typically normal on
    imaging, with a small brain rather than a malformed one. The proposed
    mechanism is a reduced pool of neurons generated during development, in
    parallel with (not downstream of) the beta-cell lesion. This remains the
    weakest-evidenced node in the chain: it rests on the expression pattern, the
    beta-cell apoptosis data, and the clinical phenotype, not on a direct
    measurement of human neural progenitors.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: DECREASED
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Taken together, we propose that TRMT10A deficiency negatively affects β-cell mass and the pool of neurons in the developing brain."
    explanation: >-
      The neural arm is explicitly a proposal by the authors, not a measured
      result, so the evidence is PARTIAL.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In situ hybridization studies showed that TRMT10A is expressed in human embryonic and fetal brain."
    explanation: >-
      Establishes that the enzyme is present in the developing human brain at
      the relevant time, the basis for the neurodevelopmental arm.

- name: Impaired Synaptic Structure and Plasticity
  description: >-
    A second, non-proliferative neural mechanism demonstrated in the Trmt10a null
    mouse: hippocampal postsynaptic densities are smaller and synaptic plasticity
    and memory are defective, without gross brain malformation. This offers a
    route to intellectual disability that does not require neuronal loss, and it
    is the arm best supported by direct in vivo measurement — though only in
    mouse.
  role: consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DECREASED
  evidence:
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite not showing discernable defects in the pancreas, liver, or kidney, Trmt10a null mice showed lower body weight and smaller hippocampal postsynaptic densities, which is associated with defective synaptic plasticity and memory."
    explanation: >-
      Direct in vivo demonstration of the synaptic and memory phenotype; the
      same sentence records the absence of a pancreatic phenotype in the mouse.

phenotypes:
- category: Neurologic
  name: Primary Microcephaly
  description: >-
    Congenital primary microcephaly is a core diagnostic feature, present in
    every reported kindred. Head circumference is typically -3 to -5 SD; brain
    MRI shows a small but structurally normal brain rather than a malformation.
    Severity tracks genotype: in the milder p.Glu27Ter Scottish kindred
    microcephaly was mild at birth and head circumference normalized by
    adulthood, so a normal adult head circumference does not exclude the
    diagnosis.
  phenotype_term:
    preferred_term: Primary microcephaly
    term:
      id: HP:0011451
      label: Primary microcephaly
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new syndrome of young onset diabetes, short stature and microcephaly with intellectual disability in a large consanguineous family with three affected children."
    explanation: Establishes microcephaly as a defining feature of the syndrome.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging of the head showed a\nsmall brain with no malformation or other abnormality"
    explanation: >-
      Documents that the microcephaly is a reduction in brain size without
      structural malformation, consistent with primary microcephaly.
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild microcephaly was present at birth but their final head circumferences were normal."
    explanation: >-
      Documents the milder end of the spectrum, in which head circumference
      normalizes with growth.

- category: Neurologic
  name: Intellectual Disability
  description: >-
    Intellectual disability is present in essentially all reported patients and
    is typically mild — the Orphanet designation for this disorder names it
    explicitly. Measured IQ in the index family was 69 and 52 in two siblings.
    Global developmental delay with disproportionate speech delay is the usual
    presentation in childhood.
  phenotype_term:
    preferred_term: Mild intellectual disability
    term:
      id: HP:0001256
      label: Mild intellectual disability
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy and intellectual disability were features in common."
    explanation: Documents intellectual disability as a shared feature across affected siblings.
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychometric testing led to the diagnosis of mild intellectual disability."
    explanation: >-
      Formal psychometric confirmation of the mild severity band in a
      molecularly confirmed patient.

- category: Neurologic
  name: Global Developmental Delay
  description: >-
    Developmental delay is evident from early childhood, with speech delay
    typically more prominent than motor delay; affected children often reach
    early motor milestones at normal ages before language and behavioural
    problems emerge. Infantile hypotonia is described. The course is static
    rather than regressive.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:42181738
    reference_title: "TRMT10A-Related Neurodevelopmental Disorder Without Metabolic Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopmental delay was evident from early childhood, and electroencephalography revealed generalized epileptiform activity requiring treatment, whereas brain magnetic resonance imaging was normal."
    explanation: Documents early-childhood developmental delay in a confirmed patient.
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech delay and behavioral problems were noted by 4 years of age."
    explanation: Documents the speech-predominant delay pattern.

- category: Neurologic
  name: Epilepsy
  description: >-
    Seizures occur in a substantial subset but are not universal. Reported
    semiologies span childhood-onset generalized epilepsy with frontally
    dominant polyspike-and-wave on EEG, febrile status epilepticus, and petit
    mal (absence) epilepsy in adolescence. Seizures have been controlled with
    standard antiseizure medication.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy and intellectual disability were features in common."
    explanation: Documents epilepsy in both affected siblings of this family.
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recent EEG showed symmetric, bilateral, frontally dominant polyspike and wave discharges, consistent with generalized epilepsy."
    explanation: Characterizes the electroclinical phenotype in a confirmed patient.
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects were three patients who suffered from microcephaly, intellectual disability, short stature, delayed puberty, seizures and disturbed glucose metabolism, mainly hyperinsulinaemic hypoglycaemia."
    explanation: Independent family with seizures in all three affected siblings.

- category: Neuroimaging
  name: Periventricular and Subcortical White Matter Hyperintensities
  description: >-
    T2/FLAIR hyperintensity in periventricular and subcortical white matter,
    without white matter volume loss and without parenchymal calcification, was
    the imaging finding in compound heterozygous siblings and is interpreted as
    delayed or abnormal myelination rather than a destructive leukoencephalopathy.
    Brain architecture — corpus callosum, cerebellum, cortical gyration — was
    normal. This finding is inconstant: MRI is reported as entirely normal in
    other molecularly confirmed patients.
  phenotype_term:
    preferred_term: Periventricular white matter hyperintensities
    term:
      id: HP:0030891
      label: Periventricular white matter hyperintensities
  evidence:
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children had brain MRI studies that showed periventricular and subcortical T2/FLAIR hyperintensities, without signs of white matter volume loss, and no parenchymal calcifications by CT scan."
    explanation: Primary description of the white matter imaging phenotype.
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report adds to current knowledge of TRMT10A related neurodevelopmental disorders and demonstrates imaging findings suggestive of delayed or abnormal myelination of the white matter in this disorder."
    explanation: Interprets the finding as dysmyelination rather than white matter destruction.
  - reference: PMID:42181738
    reference_title: "TRMT10A-Related Neurodevelopmental Disorder Without Metabolic Findings."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas brain magnetic resonance imaging was normal"
    explanation: >-
      Counterpoint establishing that white matter change is not obligatory — MRI
      was normal in this confirmed patient.

- category: Growth
  name: Short Stature
  description: >-
    Proportionate short stature is a core feature, present from infancy and
    persisting into adult life (final heights of 141-157 cm in the index
    family). It may be severe and, in at least one patient, was associated with
    growth hormone deficiency on stimulation testing, indicating that the
    growth failure is not always a purely intrinsic cellular effect.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects were three patients who suffered from microcephaly, intellectual disability, short stature, delayed puberty, seizures and disturbed glucose metabolism, mainly hyperinsulinaemic hypoglycaemia."
    explanation: Documents short stature in all three affected siblings of this family.
  - reference: PMID:33448213
    reference_title: "TRMT10A Mutation in a Child with Diabetes, Short Stature, Microcephaly and Hypoplastic Kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional clinical features included intellectual disability, hypoplastic kidneys and short stature."
    explanation: Independent confirmation of short stature in a further patient.

- category: Growth
  name: Failure to Thrive
  description: >-
    Poor postnatal growth with failure to thrive from infancy was the presenting
    problem in the patient with a homozygous contiguous gene deletion, the most
    severe reported genotype.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From infancy, she presented with failure to thrive and microcephaly."
    explanation: Documents failure to thrive as the infantile presentation in this patient.

- category: Endocrine
  name: Young-Onset Diabetes Mellitus
  description: >-
    Non-autoimmune, insulin-independent-onset diabetes is the defining metabolic
    endpoint, with reported diagnosis ages from 11 years to the late twenties.
    It is typically autoantibody-negative with persistent C-peptide, though
    islet cell autoantibodies and ketoacidosis at onset have each been reported
    once, so autoantibody positivity does not exclude the diagnosis in a patient
    with the neurodevelopmental phenotype. Diabetes is age-dependent and may not
    yet be present when a child is diagnosed molecularly.
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes was diagnosed while the subjects were in their 20s and was characterized by insulin resistance."
    explanation: Documents the late end of the onset range.
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had an incidental diagnosis of diabetes at age 11.4 years which was negative for diabetes antibodies with persistent C-peptide level and she was treated with metformin."
    explanation: >-
      Documents the early end of the onset range together with the
      autoantibody-negative, C-peptide-positive profile.
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the previous reports, the patient had ketoacidosis at onset of diabetes and islet cell autoantibodies."
    explanation: >-
      Documents the exceptional autoantibody-positive, ketoacidotic presentation
      that departs from the usual non-autoimmune pattern.

- category: Endocrine
  name: Hypoglycemia Preceding Diabetes
  description: >-
    In several kindreds the first metabolic abnormality is hypoglycaemia in
    infancy or childhood, frequently hyperinsulinaemic, with both ketotic and
    non-ketotic events described. It precedes diabetes by years and is the
    single most easily missed feature of the syndrome, because the disorder is
    remembered as a diabetes syndrome.
  phenotype_term:
    preferred_term: Hyperinsulinemic hypoglycemia
    term:
      id: HP:0000825
      label: Hyperinsulinemic hypoglycemia
  evidence:
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects were three patients who suffered from microcephaly, intellectual disability, short stature, delayed puberty, seizures and disturbed glucose metabolism, mainly hyperinsulinaemic hypoglycaemia."
    explanation: Primary description of hyperinsulinaemic hypoglycaemia as the dominant glucose abnormality in this family.
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed an unusual form of impaired glucose metabolism which presented in early childhood with hypoglycemia followed by diabetes in late childhood"
    explanation: Documents the hypoglycaemia-then-diabetes temporal sequence in a single patient.

- category: Endocrine
  name: Insulin Resistance
  description: >-
    Marked peripheral insulin resistance is documented in a subset, established
    by formal oral glucose tolerance testing with Matsuda index calculation in
    one kindred and independently confirmed in another patient whose diabetes
    responded to metformin. It matters clinically because it selects an
    insulin-sensitizer rather than insulin replacement as first-line therapy.
  phenotype_term:
    preferred_term: Insulin resistance
    term:
      id: HP:0000855
      label: Insulin resistance
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings were suggestive of insulin resistance"
    explanation: Reports the formal insulin-sensitivity testing establishing this feature.
  - reference: PMID:33067246
    reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diabetes was due to marked insulin resistance and responded very well to metformin treatment."
    explanation: Independent confirmation with a therapeutic corollary.

- category: Endocrine
  name: Delayed Puberty and Gonadal Failure
  description: >-
    Delayed and inconsistent pubertal progression is reported across kindreds.
    In the contiguous-deletion patient gonadotropins fluctuated between low and
    high, compatible with gonadal failure; in another patient spontaneous
    puberty did not begin until 15.7 years and primary ovarian failure was
    diagnosed. As with the glucose phenotype, the fluctuating course has been
    attributed to intermittent stress-triggered apoptotic damage rather than a
    fixed developmental deficit.
  phenotype_term:
    preferred_term: Delayed puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  evidence:
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Puberty was characterized by a slow and an inconsistent course of progression."
    explanation: Documents the delayed and erratic pubertal course.
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concomitantly, gonadotropin levels fluctuated between low and high levels which were compatible with gonadal failure."
    explanation: Provides the endocrine basis of the pubertal delay.

- category: Endocrine
  name: Premature Ovarian Insufficiency
  description: >-
    Primary ovarian failure with small ovaries, elevated gonadotropins and low
    anti-Mullerian hormone was documented in one patient and proposed by the
    reporting authors as an additional feature of the syndrome. Currently a
    single-patient observation, so it should be watched for rather than assumed.
  phenotype_term:
    preferred_term: Premature ovarian insufficiency
    term:
      id: HP:0008209
      label: Premature ovarian insufficiency
  evidence:
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous puberty did not begin until 15.7 years of age and she was found to have primary ovarian failure."
    explanation: Primary report of ovarian failure in a molecularly confirmed patient.
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "GH deficiency and primary ovarian failure may also be additional findings of this syndrome."
    explanation: >-
      The authors propose this as a possible extension of the phenotype
      ("may also be"), so the generalization beyond this patient is PARTIAL.

- category: Endocrine
  name: Growth Hormone Deficiency
  description: >-
    Severe short stature attributable to growth hormone deficiency on
    stimulation testing was detected at 3.6 years in one patient, and an
    inadequate response to growth hormone stimulation testing was separately
    reported. This is a single-report-level feature that nonetheless changes
    management, since it raises the question of GH replacement.
  phenotype_term:
    preferred_term: Decreased response to growth hormone stimulation test
    term:
      id: HP:0000824
      label: Decreased response to growth hormone stimulation test
  evidence:
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 3.6 years of age, severe short stature related to growth hormone (GH) deficiency was detected."
    explanation: Documents GH deficiency as the basis of the growth failure in this patient.
  - reference: PMID:33448213
    reference_title: "TRMT10A Mutation in a Child with Diabetes, Short Stature, Microcephaly and Hypoplastic Kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time hypoplastic kidneys and inadequate response to growth hormone stimulation tests in a girl with this syndrome."
    explanation: Independent report of an inadequate growth hormone stimulation response.

- category: Renal
  name: Renal Hypoplasia
  description: >-
    Hypoplastic kidneys were reported for the first time in a girl homozygous
    for p.Gly206Arg. A single observation to date, and the reporting authors
    present it as a phenotype expansion rather than an established feature.
  phenotype_term:
    preferred_term: Renal hypoplasia
    term:
      id: HP:0000089
      label: Renal hypoplasia
  evidence:
  - reference: PMID:33448213
    reference_title: "TRMT10A Mutation in a Child with Diabetes, Short Stature, Microcephaly and Hypoplastic Kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time hypoplastic kidneys and inadequate response to growth hormone stimulation tests in a girl with this syndrome."
    explanation: Primary and, to date, only report of renal hypoplasia in this syndrome.

- category: Skeletal
  name: Osteoporosis
  description: >-
    The index proband had osteoporosis with DXA T-scores of -2.7 (lumbar spine)
    and -3.5 (femoral neck), while a skeletal survey showed no epiphyseal
    dysplasia. The osteoporosis is therefore a reduction in bone mass without a
    recognizable skeletal dysplasia, and is one of the features that can bring a
    young adult to genetic attention.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She also had osteoporosis, with dual-\nenergy X-ray absorptiometry T-scores of -2.7 and -3.5 at the\nlumbar spine and femoral neck, respectively."
    explanation: Quantifies the osteoporosis in the index proband.
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A skeletal survey\nrevealed no epiphyseal dysplasia or other bone abnormality"
    explanation: >-
      Establishes that the skeletal involvement is not a bone dysplasia, an
      important negative for differential diagnosis.
  - reference: PMID:35137278
    reference_title: "Looking for the skeleton in the closet-rare genetic diagnoses in patients with diabetes and skeletal manifestations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous mutation in TRMT10A, a tRNA methyltransferase, was identified in a 15-year-old boy with new-onset diabetes, developmental delay, microcephaly, dysmorphism, short stature and central obesity."
    explanation: >-
      Cited in a series on diabetes with skeletal manifestations; the quoted
      case description supports the syndromic-diabetes context rather than
      osteoporosis specifically, hence PARTIAL.

- category: Skeletal
  name: Scoliosis
  description: >-
    Scoliosis was recorded in the index proband alongside joint laxity and
    osteoporosis, in the absence of any epiphyseal dysplasia on skeletal survey.
    Curated as its own entry rather than bundled with the osteoporosis, since
    the two are separate skeletal findings sharing one source sentence.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."

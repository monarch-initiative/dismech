genetic:
- name: TRMT10A
  gene_term:
    preferred_term: TRMT10A
    term:
      id: hgnc:28403
      label: TRMT10A
  relationship_type: CAUSATIVE
  notes: >-
    Every reported pathogenic allele is private or population-specific; no
    recurrent global founder variant exists, and nearly all published kindreds
    are consanguineous. Alleles span the full loss-of-function spectrum —
    nonsense, canonical splice-acceptor, whole-locus deletion — plus one
    catalytically dead missense variant. Because a contiguous gene deletion has
    caused the syndrome, copy-number analysis is warranted when sequencing is
    negative in a compatible phenotype.

    Population constraint corroborates the recessive mechanism rather than
    merely being consistent with it: TRMT10A (ENSG00000145331) is entirely
    tolerant of heterozygous loss of function in gnomAD — pLI 3.2e-12,
    observed/expected LoF 0.917 with a 90% upper bound (LOEUF) of 1.21, i.e. the
    observed rate of LoF variation in the population is what you would expect if
    there were no selection against it at all. So haploinsufficiency is not a
    disease mechanism here, which is why the unaffected heterozygous parents in
    every reported pedigree are the expected result and not a puzzle. Retrieved
    from the gnomAD API and recorded as a database observation; it carries no
    evidence block because it is not a literature claim with a quotable
    sentence.
  variants:
  - name: "p.Arg127Ter"
    description: >-
      The first-reported disease allele, homozygous in a large consanguineous
      Moroccan family with three affected siblings. Neither TRMT10A mRNA nor
      protein was detectable in patient lymphoblasts, indicating
      nonsense-mediated decay and complete loss of the gene product. Also
      reported homozygously in a patient with GH deficiency and primary ovarian
      failure.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24204302
      reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Linkage analysis and whole exome sequencing were used to identify the causal nonsense mutation, which changed an arginine codon into a stop at position 127 of the tRNA methyltransferase homolog gene TRMT10A (also called RG9MTD2)."
      explanation: Identifies the allele and the method by which it was found.
    - reference: PMID:34541035
      reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous p.Arg127* mutation in TRMT10A was detected."
      explanation: Independent recurrence of the same allele in an unrelated patient.
  - name: "p.Gly206Arg (c.616G>A)"
    description: >-
      Homozygous missense allele in a consanguineous Uzbek Jewish family with
      three affected siblings, and independently in a girl with hypoplastic
      kidneys. Uniquely informative mechanistically: the variant enzyme binds
      tRNA normally but retains under 0.1% of wild-type methylation activity,
      attributed to defective S-adenosylmethionine binding. It is therefore a
      catalytically dead allele rather than a folding or substrate-recognition
      defect.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25053765
      reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous Gly206Arg (G206R) mutation in the TRMT10A gene was identified using whole exome sequencing."
      explanation: Identifies the allele in the index family for this variant.
    - reference: PMID:25053765
      reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation segregated in the family and was absent from large control cohorts."
      explanation: Segregation and population-frequency evidence supporting pathogenicity.
    - reference: PMID:33448213
      reference_title: "TRMT10A Mutation in a Child with Diabetes, Short Stature, Microcephaly and Hypoplastic Kidneys."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealing a homozygous mutation in the TRMT10A gene (c.616G>A, p.G206R)"
      explanation: Independent recurrence of the allele in an unrelated patient.
  - name: "p.Glu27Ter (c.79G>T)"
    description: >-
      Homozygous nonsense allele in two siblings who represent the mild end of
      the spectrum: diabetes diagnosed in their twenties, mild microcephaly at
      birth with normal final head circumference, and mild learning disability
      with epilepsy as the only other features. Notable that a truncating allele
      this proximal produces a milder clinical course than p.Gly206Arg, arguing
      against a simple allele-severity gradient.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26526202
      reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous nonsense mutation p.Glu27Ter in TRMT10A was identified using targeted next-generation sequencing and confirmed by PCR/Sanger sequencing."
      explanation: Identifies the allele and its orthogonal confirmation.
  - name: "p.Arg93Ter (c.277C>T) / p.Arg133Ter (c.397C>T)"
    description: >-
      Compound heterozygous nonsense alleles in non-consanguineous siblings with
      microcephaly, developmental delay and periventricular white matter
      hyperintensities but no documented dysglycaemia at ages 10 and 12 — the
      first indication that the neurodevelopmental phenotype can present without
      the metabolic one.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26535115
      reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Analysis of variants determined that the children were compound heterozygotes for nonsense mutations, c.277C>T (p.Arg93*) and c.397C>T (p.Arg133*), in the TRMT10A gene."
      explanation: Identifies the compound heterozygous allele pair.
  - name: "c.496-1G>A"
    description: >-
      Homozygous canonical splice-acceptor variant in the first reported Chinese
      patient, whose diabetes was driven by marked insulin resistance and
      responded to metformin.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33067246
      reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous mutation c.496-1G>A in TRMT10A was identified using targeted next-generation sequencing and confirmed by PCR/Sanger sequencing."
      explanation: Identifies the splice-acceptor allele and its confirmation.
  - name: "c.421-1G>A"
    description: >-
      Homozygous canonical splice-acceptor variant disrupting the SAM-dependent
      methyltransferase TRM10-type domain, reported in the patient with
      spastic-ataxic paraparesis and a Dandy-Walker variant.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39440920
      reference_title: "New Insights Into TRMT10A Syndrome: Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation disrupts the \"SAM-dependent methyltransferase TRM10-type domain\", which is implicated in methylation and S-adenosylmethionine metabolic biological processes, crucial for mitochondrial and glucose metabolism."
      explanation: Describes the domain consequence of this splice allele.
  - name: "p.Arg43Ter (c.127C>T)"
    description: >-
      Homozygous stop-gained variant classified pathogenic on PVS1, PM2 and PM3
      criteria in a 15-year-old with microcephaly, intellectual disability,
      epilepsy and short stature but no metabolic abnormality at evaluation.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:42181738
      reference_title: "TRMT10A-Related Neurodevelopmental Disorder Without Metabolic Findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing identified a homozygous stop-gained pathogenic (PVS1, PM2, and PM3) variant in TRMT10A (c.127C>T; p.Arg43Ter), which was confirmed by Sanger sequencing and showed segregation consistent with autosomal recessive inheritance."
      explanation: >-
        Identifies the allele with its ACMG classification and segregation
        evidence.
  - name: "Contiguous gene deletion encompassing TRMT10A"
    description: >-
      Homozygous contiguous gene deletion removing the whole TRMT10A locus in a
      17-year-old female, with RT-PCR and Western blot confirming complete
      absence of transcript and protein. The most severe reported genotype, with
      failure to thrive from infancy and gonadal failure; establishes that
      copy-number variation is a route to this syndrome.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26297882
      reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We investigated the clinical spectrum presented by a 17-year-old female with a homozygous contiguous gene deletion involving the TRMT10A gene."
      explanation: Identifies the structural-variant route to the syndrome.
    - reference: PMID:26297882
      reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RT-PCR and Western blot analysis demonstrated a complete abolishment of TRMT10A mRNA and its translated protein."
      explanation: Confirms complete loss of the gene product at RNA and protein level.
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first study describing the impact of TRMT10A deficiency in mammals, highlighting a role in the pathogenesis of microcephaly and early onset diabetes."
    explanation: Establishes TRMT10A as the causal gene for the syndrome.
  - reference: PMID:26526202

diagnosis:
- name: Molecular Confirmation of Biallelic TRMT10A Variants
  description: >-
    Diagnosis is molecular. The original families were solved by linkage plus
    whole exome sequencing; later patients were increasingly identified by
    targeted monogenic-diabetes next-generation sequencing panels containing
    TRMT10A, with Sanger confirmation and parental segregation to establish
    biallelic status. Because one patient carried a homozygous contiguous gene
    deletion, copy-number analysis should follow a negative sequencing result
    when the phenotype fits. Making the diagnosis before the metabolic phase
    begins is the practical goal, since it enables anticipatory glucose
    monitoring.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25053765
    reference_title: "TRMT10A dysfunction is associated with abnormalities in glucose homeostasis, short stature and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous Gly206Arg (G206R) mutation in the TRMT10A gene was identified using whole exome sequencing."
    explanation: Documents exome sequencing as the diagnostic route in an index family.
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A targeted panel may be useful to identify previously unsuspected monogenic diabetes among individuals with young‐onset diabetes."
    explanation: Documents the targeted-panel diagnostic route.
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accurate diagnosis through genomic testing, as in the children described here, allows for early detection and management of medical complications, such as diabetes mellitus."
    explanation: >-
      States the clinical value of pre-symptomatic molecular diagnosis for
      anticipating the metabolic phase.

- name: Recognizing the Syndrome in a Young Person with Diabetes
  description: >-
    The referral trigger that matters: young-onset, non-insulin-dependent,
    autoantibody-negative diabetes in a person without obesity who also has
    intellectual disability, microcephaly or epilepsy. Both the Scottish and the
    Chinese reports make this recommendation explicitly, and both patients had
    been carrying an unrecognized monogenic diagnosis. Extra-pancreatic features
    plus slow-onset autoantibody-negative diabetes should prompt a full
    monogenic-diabetes work-up.
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMT10A sequencing should be considered in children or adults with young-onset diabetes who have a history of intellectual disability, microcephaly and epilepsy."
    explanation: The explicit clinical referral criterion from the reporting authors.
  - reference: PMID:33067246
    reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic testing should be considered in children with non-insulin-dependent diabetes with intellectual disability and microcephaly."
    explanation: Independent statement of the same referral criterion.
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with slow onset diabetes who are negative for auto-antibodies and have extra-pancreatic features should be tested for all known subtypes of monogenic diabetes."
    explanation: Broadens the criterion to the full monogenic-diabetes differential.

- name: Distinguishing the Diabetes from Type 1 Diabetes
  description: >-
    The diabetes is usually autoantibody-negative with persistent C-peptide,
    which separates it from autoimmune type 1 diabetes. This discriminator is
    imperfect and should not be applied mechanically: one reported patient had
    both ketoacidosis at onset and islet cell autoantibodies, yet retained
    endogenous insulin secretion 22 months later and maintained near-normal
    glucose for three days off insulin. Autoantibody positivity therefore does
    not exclude the syndrome when the neurodevelopmental phenotype is present.
  diagnosis_term:
    preferred_term: autoantibody measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  evidence:
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had an incidental diagnosis of diabetes at age 11.4 years which was negative for diabetes antibodies with persistent C-peptide level and she was treated with metformin."
    explanation: The typical autoantibody-negative, C-peptide-positive profile.
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the previous reports, the patient had ketoacidosis at onset of diabetes and islet cell autoantibodies."
    explanation: >-
      Refutes autoantibody negativity as an absolute discriminator; recorded as
      REFUTE against the general rule rather than hidden in prose.

biochemical:
- name: Detectable and Persistent C-Peptide
  presence: Detectable
  notes: >-
    Endogenous insulin secretion persists well after diabetes onset. In the
    contiguous-deletion patient, glucagon-stimulated C-peptide and continuous
    glucose monitoring showed insulin secretion still present 22 months after
    diagnosis, and near-normal glucose was maintained for three days entirely
    off insulin. Another patient had persistent C-peptide at diagnosis. This is
    the biochemical signature of partial rather than complete beta-cell failure.
  evidence:
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endogenous insulin secretion still persisted 22 months after onset of diabetes and relatively normal glucose levels were kept over 3 days without insulin treatment."
    explanation: Quantifies the persistence of endogenous insulin secretion after diagnosis.
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In order to elucidate the nature of diabetes in this patient, endogenous insulin secretion and glycemic control were evaluated by a glucagon stimulation test and continuous glucose monitoring both during insulin treatment and off therapy."
    explanation: Documents the assays used to establish residual beta-cell function.

- name: Glycated Hemoglobin (HbA1c)
  presence: Variable
  notes: >-
    HbA1c at presentation spans the full range and is not a diagnostic
    discriminator. The index siblings presented in overt decompensation
    (11.1-13.2%), a Chinese patient at 14.4%, while the contiguous-deletion
    patient maintained excellent control at 5.0-6.2%. HbA1c is most useful here
    as a treatment-response measure — it fell from 14.4% to 6.8% within three
    months of starting metformin in the insulin-resistant patient.
  evidence:
  - reference: PMID:26297882
    reference_title: "Homozygous deletion of TRMT10A as part of a contiguous gene deletion in a syndrome of failure to thrive, delayed puberty, intellectual disability and diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, glycemic control was excellent (HbA1C 5.0%-6.2%)."
    explanation: Documents the well-controlled end of the glycaemic range.
  - reference: PMID:33067246
    reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the subsequent visit 3 months after diagnosis, the patient’s HbA1c decreased to 6."
    explanation: >-
      Documents the HbA1c response to metformin; the quote is truncated at the
      decimal point as the sentence is split in the cached source.

treatments:
- name: Metformin
  description: >-
    First-line where peripheral insulin resistance predominates. A Chinese
    patient with marked insulin resistance responded very well, with HbA1c
    falling from 14.4% to 6.8% within three months, and metformin was also used
    in an autoantibody-negative, C-peptide-positive patient diagnosed at 11.4
    years. Because the metabolic phenotype has both an insulin-deficient and an
    insulin-resistant arm, establishing which predominates before committing to
    therapy is the practical point — this is a treatable form of syndromic
    diabetes that can be mismanaged as type 1.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
  target_mechanisms:
  - target: Peripheral Insulin Resistance
    treatment_effect: INHIBITS
    description: >-
      Metformin acts on the peripheral insulin-resistance arm, not on the
      TRMT10A lesion or the beta-cell loss; it is symptomatic therapy targeted
      at the arm of the metabolic phenotype it can reach.
    evidence:
    - reference: PMID:33067246
      reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The diabetes was due to marked insulin resistance and responded very well to metformin treatment."
      explanation: >-
        Links the drug directly to the insulin-resistance node it targets, with
        a documented clinical response.
  evidence:
  - reference: PMID:33067246
    reference_title: "tRNA methyltransferase 10 homologue A (TRMT10A) mutation in a Chinese patient with diabetes, insulin resistance, intellectual deficiency and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clear genetic diagnosis is helpful for early detection and treatment addressing insulin resistance."
    explanation: >-
      States the therapeutic corollary of the molecular diagnosis in this
      patient.
  - reference: PMID:34541035
    reference_title: "Expanding the Phenotype of TRMT10A Mutations: Case Report and a Review of the Existing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had an incidental diagnosis of diabetes at age 11.4 years which was negative for diabetes antibodies with persistent C-peptide level and she was treated with metformin."
    explanation: Independent use of metformin in a paediatric patient with retained C-peptide.

- name: Insulin Replacement
  description: >-
    Used where insulin deficiency from progressive beta-cell loss predominates,
    including the case in which progressive beta-cell apoptosis required insulin
    replacement with increased demand driven by unfavourable body composition.
    Not universally required: the contiguous-deletion patient maintained
    near-normal glucose for three days entirely off insulin, so insulin need
    should be re-assessed rather than assumed permanent.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  target_mechanisms:
  - target: Biphasic Glucose Dysregulation
    treatment_effect: BYPASSES
    description: >-
      Exogenous insulin substitutes for the hormone the attenuated beta-cell
      mass can no longer secrete; it does not address tRNA hypomethylation or
      beta-cell apoptosis.
    evidence:
    - reference: PMID:35137278
      reference_title: "Looking for the skeleton in the closet-rare genetic diagnoses in patients with diabetes and skeletal manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The progressive apoptosis of pancreatic beta cells required insulin replacement therapy, with increased demand due to an unfavorable body composition."
      explanation: >-
        Documents insulin replacement applied to the beta-cell-loss node, with
        the body-composition modifier of insulin requirement.
  evidence:
  - reference: PMID:35137278
    reference_title: "Looking for the skeleton in the closet-rare genetic diagnoses in patients with diabetes and skeletal manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progressive apoptosis of pancreatic beta cells required insulin replacement therapy, with increased demand due to an unfavorable body composition."
    explanation: Documents insulin replacement as the treatment used in an insulin-deficient patient.

- name: Antiseizure Medication
  description: >-
    Seizures in this syndrome have responded to standard antiseizure medication;
    levetiracetam monotherapy at 50 mg/kg/day controlled generalized epilepsy in
    a molecularly confirmed patient. No syndrome-specific antiseizure strategy
    or contraindication has been reported, and no agent has been shown to modify
    the underlying mechanism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures have been controlled with levetiracetam (50 mg/kg/day, corresponding to 500 mg twice daily)."
    explanation: Documents the agent, dose and response in a confirmed patient.

- name: Developmental and Educational Support
  description: >-
    Speech, occupational and physical therapy provided through school, with
    steady developmental progress reported. Standard practice for a static
    neurodevelopmental disorder rather than a syndrome-specific validated
    protocol.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:26535115
    reference_title: "Case Report: Compound heterozygous nonsense mutations in TRMT10A are associated with microcephaly, delayed development, and periventricular white matter hyperintensities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech and occupational therapy were provided through school and she has continued to make steady developmental progress."
    explanation: Documents the supportive interventions used and the outcome.

- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance carries a 25% sibling recurrence risk, and
    the recurrence is documented rather than theoretical — three of the reported
    kindreds had three affected siblings each. Nearly all families were
    consanguineous, so counseling covers recurrence risk, carrier testing for
    at-risk relatives, and reproductive options. Framed as standard practice for
    a confirmed autosomal recessive disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new syndrome of young onset diabetes, short stature and microcephaly with intellectual disability in a large consanguineous family with three affected children."
    explanation: >-
      Documents the consanguineous pedigree with three affected siblings that
      grounds the recurrence-risk counseling.

animal_models:
- name: Trmt10a null mouse (E29Stop)
  species: Mouse
  genotype: Trmt10a c.85G>T (p.Glu29Ter) homozygous null
  publication: PMID:38950903
  description: >-
    Constitutive null mouse engineered to mimic the human p.Glu27Ter allele.
    Reproduces the reduced body weight and the neurological arm of the human
    syndrome — smaller hippocampal postsynaptic densities with impaired synaptic
    plasticity and memory — and provides the only in vivo demonstration of the
    translational mechanism (codon-specific ribosome slowdown, ATF4
    derepression). Critically, it does NOT reproduce the pancreatic phenotype.
  modeled_mechanisms:
  - target: Codon-Specific Translational Impairment
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Ribosome profiling in null-mouse brain establishes the codon-level
      translational lesion, and the same tRNA depletion was confirmed in a human
      TRMT10A-null cell line.
    limitations: >-
      Ribosome profiling was performed in mouse brain; the corresponding
      measurement has not been made in human neural tissue, though the
      underlying tRNA depletion was replicated in a human cell line.
    readouts:
    - name: tRNA-Gln(CUG) and initiator methionine tRNA steady-state levels
      target: Codon-Specific Translational Impairment
      direction: DECREASED
      interpretation: >-
        Depletion of the two m1G9-dependent tRNAs is the proximate cause of the
        codon-specific translational deficit.
      evidence:
      - reference: PMID:38950903
        reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here, we generated Trmt10a null mice and showed that tRNAGln(CUG) and initiator methionine tRNA levels were universally decreased in various tissues; the same was true in a human cell line lacking TRMT10A."
        explanation: Reports the measurement grounding this readout, in both mouse and human cells.
    - name: Ribosome occupancy at the Gln(CAG) codon
      target: Codon-Specific Translational Impairment
      direction: INCREASED
      interpretation: >-
        Increased ribosome dwell time at Gln codons is the direct functional
        consequence of tRNA-Gln depletion.
      evidence:
      - reference: PMID:38950903
        reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ribosome profiling of mouse brain revealed that dysfunction of TRMT10A causes ribosome slowdown at the Gln(CAG) codon and increases translation of Atf4 due to higher frequency of leaky scanning of its upstream open reading frames."
        explanation: Reports the ribosome-profiling measurement behind this readout.
    evidence:
    - reference: PMID:38950903
      reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, our study provides mechanistic insight into the roles of TRMT10A in the brain, and exemplifies the importance of universal tRNA modification during translation of specific codons."
      explanation: Establishes the model as informative for the translational mechanism node.
  - target: Impaired Synaptic Structure and Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The null mouse shows smaller hippocampal postsynaptic densities with
      defective synaptic plasticity and memory, offering a structural correlate
      for the intellectual disability that does not require neuronal loss.
    limitations: >-
      Synaptic and memory measures in mouse are not directly equivalent to human
      intellectual disability, and no corresponding human synaptic pathology has
      been demonstrated.
    readouts:
    - name: Hippocampal postsynaptic density size
      target: Impaired Synaptic Structure and Plasticity
      direction: DECREASED
      interpretation: Structural correlate of the impaired-plasticity node in this model.
      evidence:
      - reference: PMID:38950903
        reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Despite not showing discernable defects in the pancreas, liver, or kidney, Trmt10a null mice showed lower body weight and smaller hippocampal postsynaptic densities, which is associated with defective synaptic plasticity and memory."
        explanation: Reports the postsynaptic-density measurement behind this readout.
    evidence:
    - reference: PMID:38950903
      reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Broadly speaking, translation of a subset of mRNAs, especially those for neuronal structures, is perturbed in the mutant brain."
      explanation: >-
        Connects the translational lesion to neuronal structural proteins,
        supporting this model as informative for the synaptic node.
  - target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Trmt10a null mice show no discernible pancreatic defect, in direct contrast
      to the diabetes that defines the human syndrome. This negative result is
      the reason the beta-cell mechanism rests on human cellular models rather
      than on a mouse.
    limitations: >-
      The published phenotyping reports no discernible pancreatic defect but
      does not establish over what age range or under what metabolic challenge
      the pancreas was assessed, so an unstressed-condition ceiling effect
      cannot be excluded. Species differences in beta-cell tRNA biology and in
      lifespan-scaled cumulative apoptosis are plausible explanations.
    evidence:
    - reference: PMID:38950903
      reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Despite not showing discernable defects in the pancreas, liver, or kidney, Trmt10a null mice showed lower body weight and smaller hippocampal postsynaptic densities, which is associated with defective synaptic plasticity and memory."
      explanation: >-
        Explicitly records the absence of a pancreatic phenotype in the null
        mouse, refuting recapitulation of the beta-cell node.

experimental_models:
- name: Patient-derived iPSC beta-like cells (TRMT10A-deficient)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells reprogrammed from TRMT10A-deficient patient
    fibroblasts and differentiated to pancreatic beta-like cells, alongside
    control lines. This is the model that carries the beta-cell mechanism, and
    it does so precisely where the mouse fails: it demonstrates oxidative
    stress, intrinsic-pathway apoptosis, and sensitization to ER stress in cells
    of human patient genotype.
  modeled_mechanisms:
  - target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient-genotype human beta-like cells reproduce the oxidative stress and
      intrinsic apoptotic signalling proposed to underlie beta-cell loss.
    limitations: >-
      iPSC-derived beta-like cells are immature relative to adult islet beta
      cells and are studied over days rather than the decades over which the
      human phenotype accumulates, so the model shows the mechanism is available
      but cannot demonstrate the cumulative mass loss.
    readouts:
    - name: Intrinsic apoptotic pathway activation
      target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
      direction: INCREASED
      interpretation: Direct measure of the apoptotic mechanism in patient-genotype cells.
      evidence:
      - reference: PMID:30247717
        reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we demonstrate that TRMT10A deficiency induces oxidative stress and triggers the intrinsic pathway of apoptosis in β-cells"
        explanation: Reports the apoptosis measurement grounding this readout.
    evidence:
    - reference: PMID:30247717
      reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using RNA interference and induced pluripotent stem cell-derived pancreatic β-like cells from healthy controls and TRMT10A-deficient patients we demonstrate that TRMT10A deficiency induces oxidative stress and triggers the intrinsic pathway of apoptosis in β-cells."
      explanation: >-
        Establishes the model system and its use for the beta-cell mechanism
        node.
  - target: tRNA Hypomethylation, Destabilization and Fragmentation
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The same system was used to show that 5'-tRNA-Gln fragments are not merely
      correlated with beta-cell death but are sufficient to cause it.
    limitations: >-
      Fragment sufficiency was established by transfecting synthetic fragments,
      which does not establish the intracellular concentrations reached in
      patient tissue in vivo.
    readouts:
    - name: 5'-tRNA-Gln fragment abundance
      target: tRNA Hypomethylation, Destabilization and Fragmentation
      direction: INCREASED
      interpretation: >-
        The cytotoxic species linking hypomethylation to beta-cell death.
      evidence:
      - reference: PMID:30247717
        reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We show that tRNA guanosine 9 hypomethylation leads to tRNAGln fragmentation and that 5'-tRNAGln fragments mediate TRMT10A deficiency-induced β-cell death."
        explanation: Reports the fragmentation measurement and its causal test.
    evidence:
    - reference: PMID:30247717
      reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This study unmasks tRNA hypomethylation and fragmentation as a hitherto unknown mechanism of pancreatic β-cell demise relevant to monogenic and polygenic forms of diabetes."
      explanation: Establishes the system as the one that defined this mechanism.

- name: TRMT10A silencing in rat INS-1E and human EndoC-betaH1 beta cells
  experimental_model_type: CELL_LINE
  description: >-
    siRNA knockdown of TRMT10A in rat and human clonal beta-cell lines and in
    dispersed human islets. The original demonstration that loss of TRMT10A is
    sufficient to kill beta cells, and the experiment that first connected a
    housekeeping tRNA-modification enzyme to a diabetes phenotype.
  modeled_mechanisms:
  - target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Acute silencing establishes sufficiency of TRMT10A loss for beta-cell
      death in two species.
    limitations: >-
      Acute siRNA knockdown in clonal lines models neither the constitutive
      germline null state nor the decades-long time course of the human disease,
      and residual protein after knockdown is not equivalent to the complete
      absence seen in patients.
    readouts:
    - name: Beta-cell apoptosis after TRMT10A silencing
      target: Beta-Cell Oxidative Stress and Intrinsic Apoptosis
      direction: INCREASED
      interpretation: >-
        Establishes that removing TRMT10A is by itself enough to trigger
        beta-cell death.
      evidence:
      - reference: PMID:24204302
        reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "TRMT10A silencing induces rat and human β-cell apoptosis."
        explanation: Reports the apoptosis measurement behind this readout.
    evidence:
    - reference: PMID:24204302
      reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TRMT10A silencing induces rat and human β-cell apoptosis."
      explanation: >-
        Establishes the knockdown system as informative for the beta-cell death
        node.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No epidemiological study exists. The disorder is known from a small number
    of published kindreds — the 2016 Scottish report described itself as the
    fourth family with diabetes reported, and the case-based literature has
    grown only incrementally since. Reported families span Moroccan, Uzbek
    Jewish, Israeli, Scottish, Chinese and Turkish ancestry, with parental
    consanguinity in nearly all. No numeric rate is recorded here because none
    has been published.
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two siblings from the fourth family reported to have diabetes mellitus as a result of a TRMT10A mutation."
    explanation: >-
      Anchors the scale of the reported literature at the time — a fourth family
      with the diabetes phenotype.

differential_diagnoses:
- name: Microcephaly, short stature, and impaired glucose metabolism 2 (PPP1R15B)
  description: >-
    The nearest mimic and the reason this pair of entries exists. MSSGM2 shares
    congenital microcephaly, severe short stature, intellectual disability and
    autoantibody-negative young-onset diabetes, and both disorders converge on
    dysregulated protein synthesis — MSSGM1 through tRNA hypomethylation, MSSGM2
    through chronically raised phospho-eIF2-alpha from a defective CReP-PP1
    holophosphatase. They are distinguished only molecularly. Note that the two
    are grouped together under a single Orphanet concept (ORPHA:391408 /
    MONDO:0018320) even though OMIM and MONDO split them by gene.
  disease_term:
    preferred_term: microcephaly, short stature, and impaired glucose metabolism 2
    term:
      id: MONDO:0014785
      label: microcephaly, short stature, and impaired glucose metabolism 2
  distinguishing_features:
  - >-
      Causal gene (PPP1R15B vs TRMT10A); MSSGM2 features skeletal, dental, hair
      and white-matter involvement and, in one family, infantile cirrhosis
      requiring liver transplantation; MSSGM1 features hypoglycaemia preceding
      diabetes, documented peripheral insulin resistance, and epilepsy as a
      prominent feature.
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new syndrome of young onset diabetes, short stature and microcephaly with intellectual disability in a large consanguineous family with three affected children."
    explanation: >-
      Establishes the MSSGM1 clinical description that must be distinguished
      from the near-identical MSSGM2 presentation.

- name: Type 1 diabetes mellitus
  description: >-
    The commonest misdiagnosis, because the diabetes begins in youth and can
    present with hyperglycaemia or even ketoacidosis. Distinguished by
    autoantibody negativity with persistent C-peptide, absence of insulin
    dependence, and — decisively — the accompanying microcephaly, intellectual
    disability and epilepsy, which are not features of type 1 diabetes. The
    discriminator is imperfect: one TRMT10A patient had both ketoacidosis and
    islet cell autoantibodies, so the neurodevelopmental phenotype rather than
    the antibody result should drive the referral.
  distinguishing_features:
  - >-
      Autoantibody-negative with persistent C-peptide in most patients; frequently
      non-insulin-dependent and sometimes insulin-resistant and metformin
      responsive; obligatory neurodevelopmental features absent in type 1 diabetes.
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report also shows the advantages of using a targeted panel to identify previously unsuspected monogenic diabetes among young-onset non-insulin-dependent diabetes in the absence of obesity and autoimmunity."
    explanation: >-
      Frames the exact clinical situation — young-onset diabetes without obesity
      or autoimmunity — in which type 1 diabetes is wrongly assumed.
  - reference: PMID:33832649
    reference_title: "Molecular mechanisms of β-cell dysfunction and death in monogenic forms of diabetes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most patients with monogenic diabetes are very commonly misdiagnosed as having type 1 or type 2 diabetes."
    explanation: >-
      Establishes that this misdiagnosis is the rule rather than the exception
      across monogenic diabetes, which is why the syndromic features must drive
      the referral.

- name: Wolcott-Rallison syndrome (EIF2AK3)
  description: >-
    The canonical differential for syndromic young-onset diabetes with growth
    failure, and mechanistically the far end of the same axis: EIF2AK3/PERK loss
    LOWERS eIF2-alpha phosphorylation, MSSGM2/PPP1R15B raises it, and MSSGM1
    perturbs translation a step earlier at tRNA modification — yet all three
    converge on beta-cell failure plus microcephaly and growth retardation. The
    discriminators against MSSGM1 are clean: Wolcott-Rallison diabetes is
    neonatal with undetectable C-peptide from beta-cell loss, and it carries
    epiphyseal dysplasia and hepatic dysfunction, whereas MSSGM1 presents from
    late childhood to the third decade with persistent C-peptide and an
    explicitly normal skeletal survey.
  disease_term:
    preferred_term: Wolcott-Rallison syndrome
    term:
      id: MONDO:0009192
      label: Wolcott-Rallison syndrome
  distinguishing_features:
  - >-
    Wolcott-Rallison: biallelic EIF2AK3 variants, neonatal diabetes with
    undetectable C-peptide, epiphyseal dysplasia, hepatic dysfunction. MSSGM1:
    biallelic TRMT10A variants, diabetes from late childhood to the third decade
    with persistent C-peptide, hypoglycaemia often preceding it, and a skeletal
    survey showing no epiphyseal dysplasia.
  evidence:
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations in EIF2AK3 cause Wolcott-Rallison syndrome, a syndromic form of neonatal diabetes with epiphyseal dysplasia, growth retardation, and variable other manifestations including microcephaly"
    explanation: >-
      Establishes the overlapping phenotype that makes this the primary
      differential for syndromic diabetes with microcephaly.
  - reference: PMID:26159176
    reference_title: "A Missense Mutation in PPP1R15B Causes a Syndrome Including Diabetes, Short Stature, and Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Wolcott-Rallison syndrome (with decreased eIF2α phosphorylation), neonatal diabetes is due to β-cell loss and C-peptide is undetectable (13), while DNAJC3, IER3IP1, and PPP1R15B mutations (with increased eIF2α phosphorylation) lead to permanent neonatal or young-onset diabetes with residual C-peptide levels"
    explanation: >-
      Gives the C-peptide discriminator (undetectable in Wolcott-Rallison vs
      residual in the translation-stress syndromes, MSSGM1 included) and places
      the disorders on a shared eIF2-alpha axis.

- name: Microcephaly, epilepsy, and diabetes syndrome 1 (IER3IP1)
  description: >-
    MEDS1 shares the microcephaly + epilepsy + diabetes triad and, like TRMT10A
    deficiency, involves a protein enriched in cerebral cortex and beta cells.
    It is separated by timing and severity, not by which organs are involved:
    MEDS diabetes is permanent NEONATAL diabetes, the microcephaly is severe
    with a simplified gyral pattern, and the epilepsy is an infantile epileptic
    encephalopathy with cortical blindness and early death. TRMT10A patients
    present decades later with mild intellectual disability and a normally
    gyrated small brain.
  disease_term:
    preferred_term: microcephaly, epilepsy, and diabetes syndrome 1
    term:
      id: MONDO:0031481
      label: microcephaly, epilepsy, and diabetes syndrome 1
  distinguishing_features:
  - >-
    MEDS1: biallelic IER3IP1 variants, permanent neonatal diabetes, primary
    microcephaly with simplified gyral pattern, infantile epileptic
    encephalopathy, cortical blindness, death in childhood. MSSGM1: biallelic
    TRMT10A variants, diabetes from late childhood to the third decade,
    structurally normal small brain, mild intellectual disability, normal
    lifespan reported to date.
  evidence:
  - reference: PMID:24138066
    reference_title: "Microcephaly, epilepsy, and neonatal diabetes due to compound heterozygous mutations in IER3IP1: insights into the natural history of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A syndrome of permanent neonatal diabetes along with primary microcephaly with simplified gyral pattern associated with severe infantile epileptic encephalopathy was recently described in two independent reports in which disease-causing homozygous mutations were identified in the immediate early response-3 interacting protein-1 (IER3IP1) gene."
    explanation: >-
      Defines the MEDS1 phenotype whose neonatal timing and gyral simplification
      distinguish it from TRMT10A deficiency.
  - reference: PMID:24138066
    reference_title: "Microcephaly, epilepsy, and neonatal diabetes due to compound heterozygous mutations in IER3IP1: insights into the natural history of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The triad of microcephaly, generalized seizures, and permanent neonatal diabetes should prompt screening for mutations in IER3IP1."
    explanation: >-
      States the referral rule for MEDS1, which is anchored on the neonatal
      onset that TRMT10A deficiency lacks.

- name: Wolfram syndrome
  description: >-
    Another syndromic juvenile diabetes with which TRMT10A syndrome has been
    explicitly compared. Both present as non-autoimmune diabetes in childhood
    with neurological features; Wolfram adds optic atrophy, diabetes insipidus
    and deafness, which are not features of TRMT10A syndrome, and lacks the
    congenital microcephaly.
  distinguishing_features:
  - >-
      Wolfram: optic atrophy, diabetes insipidus, sensorineural deafness, WFS1 or
      CISD2 variants, no congenital microcephaly. TRMT10A: primary microcephaly,
      short stature, epilepsy, biallelic TRMT10A variants.
  evidence:
  - reference: PMID:39243962
    reference_title: "Discovery of a TRMT10A mutation in a case of atypical diabetes: Case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMT10A gene mutation has been linked to syndromic juvenile diabetes in a manner analogous to Wolfram's syndrome."
    explanation: >-
      Records the explicit comparison drawn in the literature between the two
      syndromic juvenile-diabetes entities.

discussions:
- discussion_id: mouse_pancreas_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do Trmt10a null mice show no discernible pancreatic defect when
    autoantibody-negative diabetes is the defining metabolic feature of human
    TRMT10A deficiency?
  attaches_to:
  - "pathophysiology#Beta-Cell Oxidative Stress and Intrinsic Apoptosis"
  - "pathophysiology#Progressive Beta-Cell Mass Loss"
  rationale: >-
    This is the sharpest translational gap in the disorder. The constitutive
    Trmt10a null mouse faithfully reproduces the neurological arm — reduced body
    weight, smaller hippocampal postsynaptic densities, defective synaptic
    plasticity and memory, and the underlying codon-specific translational
    lesion — while explicitly showing no discernible defect in the pancreas.
    The entire beta-cell mechanism therefore rests on human material: siRNA
    knockdown in rat and human beta-cell lines, and patient-derived iPSC
    beta-like cells. Several explanations are compatible with the data and are
    not distinguished by current evidence: species differences in beta-cell
    tRNA-Gln dependence or angiogenin-mediated fragmentation; a cumulative,
    lifespan-scaled apoptotic burden that a two-year mouse cannot accrue; or a
    ceiling effect from assessing an unstressed mouse pancreas, given that
    TRMT10A deficiency in human cells acts partly by sensitizing beta cells to
    ER stress rather than killing them outright. Distinguishing these matters
    because it determines whether the mouse can be used at all to test
    beta-cell-protective interventions.
  proposed_experiments:
  - experiment_id: mouse_pancreas_stress_challenge
    name: Metabolic stress challenge of the Trmt10a null mouse pancreas
    description: >-
      Phenotype Trmt10a null mice under conditions that stress the beta cell —
      high-fat diet, prolonged glucose challenge, aged cohorts, or pharmacological
      ER stress — with glucose tolerance testing, insulin secretion, and
      beta-cell mass histomorphometry, rather than under standard housing alone.
      A null mouse that becomes diabetic only under stress would support the
      sensitization model demonstrated in patient iPSC beta-like cells and
      reconcile the species discrepancy.
  - experiment_id: cross_species_trna_fragmentation
    name: Cross-species comparison of beta-cell tRNA fragmentation
    description: >-
      Measure m1G9 occupancy, tRNA-Gln steady-state levels and 5'-tRNA-Gln
      fragment abundance side by side in TRMT10A/Trmt10a-null mouse islets,
      human islets and patient iPSC beta-like cells. If mouse beta cells do not
      generate the cytotoxic fragment at comparable levels, the mismatch is
      mechanistic rather than a matter of duration or stress.
  evidence:
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite not showing discernable defects in the pancreas, liver, or kidney, Trmt10a null mice showed lower body weight and smaller hippocampal postsynaptic densities, which is associated with defective synaptic plasticity and memory."
    explanation: Documents the absent pancreatic phenotype that constitutes the mismatch.
  - reference: PMID:30247717
    reference_title: "Pancreatic β-cell tRNA hypomethylation and fragmentation link TRMT10A deficiency with diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A deficiency induces oxidative stress and sensitizes iPSC-derived β-like cells to endoplasmic reticulum stress-induced apoptosis."
    explanation: >-
      Supports the sensitization hypothesis — an unstressed mouse pancreas may
      not reveal a stress-conditional phenotype.

- discussion_id: insulin_resistance_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes the peripheral insulin resistance in TRMT10A deficiency, and is
    it a distinct mechanism from beta-cell loss?
  attaches_to:
  - "pathophysiology#Peripheral Insulin Resistance"
  rationale: >-
    The established mechanism — tRNA hypomethylation, tRNA-Gln fragmentation,
    beta-cell apoptosis — predicts insulin deficiency, not insulin resistance.
    Yet marked insulin resistance is documented in at least two independent
    reports, one by formal oral glucose tolerance testing with Matsuda index and
    one clinically with a striking metformin response. Neither report offers a
    mechanism. Candidate explanations include a direct effect of TRMT10A loss on
    translation in insulin-target tissues (muscle, liver, adipose), a
    consequence of the body-composition phenotype suggested by the dorsocervical
    fat pad and central obesity, or the mRNA m6A/FTO arm of TRMT10A function —
    FTO being itself a well-known obesity and insulin-sensitivity locus, which
    makes this the most testable of the three. The gap is clinically live
    because it determines whether metformin should be tried before insulin.
  proposed_experiments:
  - experiment_id: tissue_specific_trmt10a_deletion
    name: Tissue-specific Trmt10a deletion in insulin-target tissues
    description: >-
      Generate muscle-, liver- and adipose-specific Trmt10a knockouts and measure
      insulin sensitivity by hyperinsulinaemic-euglycaemic clamp. A tissue in
      which deletion alone produces resistance would establish a cell-autonomous
      route independent of beta-cell loss.
  - experiment_id: fto_m6a_insulin_signalling_test
    name: Test whether the FTO-m6A arm mediates the resistance
    description: >-
      In TRMT10A-null human myotubes and adipocytes, map m6A changes and
      transcript stability for insulin-signalling components, and test whether
      restoring FTO activity or a catalytically dead TRMT10A that retains FTO
      binding rescues insulin signalling. This separates the catalytic tRNA arm
      from the non-catalytic FTO arm of TRMT10A function.
  evidence:
  - reference: PMID:26526202
    reference_title: "tRNA methyltransferase homologue gene TRMT10A mutation in young adult-onset diabetes with intellectual disability, microcephaly and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes was diagnosed while the subjects were in their 20s and was characterized by insulin resistance."
    explanation: Documents the insulin-resistant phenotype that the current mechanism does not explain.
  - reference: PMID:32213595
    reference_title: "Coordination of mRNA and tRNA methylations by TRMT10A."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here, we show that a tRNA methyltransferase, TRMT10A, interacts with an mRNA demethylase FTO (ALKBH9), both in vitro and inside cells."
    explanation: >-
      Provides the mechanistic candidate — the TRMT10A-FTO interaction — but
      makes no claim about insulin sensitivity, hence PARTIAL.

- discussion_id: metabolic_penetrance_and_onset
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the metabolic phenotype fully penetrant with age, or is there a genuine
    neurodevelopment-only form of TRMT10A deficiency?
  attaches_to:
  - "pathophysiology#Biphasic Glucose Dysregulation"
  rationale: >-
    Several molecularly confirmed patients have no dysglycaemia at the time of
    report: compound heterozygous siblings aged 10 and 12 with neither
    documented hypoglycaemia nor hyperglycaemia, and a 15-year-old homozygous
    for p.Arg43Ter with no metabolic abnormality. Because diabetes has been
    diagnosed as late as the late twenties in other patients, these observations
    are equally consistent with (a) age-dependent but eventually complete
    penetrance and (b) a genuinely distinct neurodevelopment-only phenotype
    determined by allele or modifier. The distinction is not academic: it
    determines whether lifelong glucose surveillance is mandatory for every
    biallelic carrier or can be stratified. Only longitudinal follow-up of the
    published cohort can settle it, and the 2026 report calls for exactly that.
  proposed_experiments:
  - experiment_id: longitudinal_metabolic_followup
    name: Longitudinal metabolic follow-up of the published TRMT10A cohort
    description: >-
      Prospectively follow all molecularly confirmed individuals with annual
      HbA1c, oral glucose tolerance testing with Matsuda index, and C-peptide,
      recording age at first dysglycaemia against genotype. Age-stratified
      penetrance curves would distinguish delayed onset from true
      non-penetrance and would set the evidence-based surveillance interval.
  evidence:
  - reference: PMID:42181738
    reference_title: "TRMT10A-Related Neurodevelopmental Disorder Without Metabolic Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case represents one of the rare reported TRMT10A-related syndrome patients in whom diabetes has not yet been documented."
    explanation: Documents a confirmed patient without the metabolic phenotype.
  - reference: PMID:42181738
    reference_title: "TRMT10A-Related Neurodevelopmental Disorder Without Metabolic Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings underscore the importance of considering TRMT10A in the differential diagnosis of patients with microcephaly, intellectual disability, epilepsy, and growth abnormalities, and emphasize the need for longitudinal follow-up to monitor for the possible later development of endocrine and metabolic manifestations."
    explanation: >-
      The reporting authors explicitly frame longitudinal follow-up as the
      unresolved question.

- discussion_id: neural_arm_direct_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the primary microcephaly caused by a reduced neural progenitor pool, and
    has this ever been measured directly in a human system?
  attaches_to:
  - "pathophysiology#Reduced Neural Progenitor Pool in the Developing Brain"
  rationale: >-
    The neural-progenitor account of the microcephaly is a proposal, not a
    measurement. It rests on three indirect observations: TRMT10A is expressed
    in human embryonic and fetal brain; TRMT10A silencing kills beta cells; and
    the patients have small, structurally normal brains. No study has measured
    proliferation or apoptosis in human TRMT10A-deficient neural progenitors.
    The competing account is that the phenotype arises from impaired synthesis
    of neuronal structural proteins with preserved cell number — the mechanism
    actually demonstrated in the null mouse, which has smaller postsynaptic
    densities and no reported reduction in neuron number. These predict
    different things about whether the deficit is fixed prenatally, and
    therefore about any therapeutic window.
  proposed_experiments:
  - experiment_id: patient_cerebral_organoid_progenitors
    name: Patient-derived cerebral organoid growth and progenitor dynamics
    description: >-
      Differentiate cerebral organoids from the existing TRMT10A-deficient iPSC
      lines and isogenic controls, and quantify organoid size, ventricular-zone
      thickness, radial glial proliferation index and apoptosis over the
      neurogenic window. Reduced progenitor proliferation would support the
      pool-depletion model; normal progenitor dynamics with altered neurite or
      synaptic protein content would support the translational model.
  evidence:
  - reference: PMID:24204302
    reference_title: "tRNA methyltransferase homolog gene TRMT10A mutation in young onset diabetes and primary microcephaly in humans."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Taken together, we propose that TRMT10A deficiency negatively affects β-cell mass and the pool of neurons in the developing brain."
    explanation: The proposal is stated as such by its authors, which is the gap.
  - reference: PMID:38950903
    reference_title: "TRMT10A dysfunction perturbs codon translation of initiator methionine and glutamine and impairs brain functions in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Broadly speaking, translation of a subset of mRNAs, especially those for neuronal structures, is perturbed in the mutant brain."
    explanation: >-
      Supports the competing translational account of the neural phenotype
      rather than progenitor pool depletion.

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018320
      label: primary microcephaly-mild intellectual disability-young-onset diabetes syndrome
    mapping_predicate: skos:broadMatch
    mapping_source: Orphanet
    mapping_justification: >
      MONDO:0018320 is the Orphanet concept (ORPHA:391408, exact MONDO mapping
      per Orphadata) whose clinical description matches this entry. It is
      recorded as broadMatch rather than exactMatch because Orphanet's own
      cross-references place ORPHA:391408 as BTNT (broader than) BOTH
      OMIM:616033 (MSSGM1/TRMT10A, the anchor of this entry) and OMIM:616817
      (MSSGM2/PPP1R15B), and Orphadata lists both TRMT10A and PPP1R15B as its
      assessed disease-causing genes. The Orphanet concept is therefore a union
      of two gene-defined diseases that OMIM and MONDO split, and that dismech
      curates as two entries. The union is modelled explicitly as the
      Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism grouping, which
      carries the exactMatch to this term.
  - term:
      id: MONDO:0800450
      label: microcephaly, short stature, and impaired glucose metabolism
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      The OMIM phenotypic series grouping (OMIMPS:616033) of which MONDO:0000208
      is a direct is_a child. Broader than this entry because it also subsumes
      MSSGM2 (MONDO:0014785, PPP1R15B).


- accession: geo:GSE146207
  title: Coordination of mRNA and tRNA methylations by TRMT10A
  description: >-
    The dataset underlying the TRMT10A-FTO study, profiling m6A changes and
    transcript-level consequences of TRMT10A ablation. Supports the
    "Coordinated mRNA m6A Dysregulation via the FTO Axis" node and is the most
    directly testable resource for the open question of what drives peripheral
    insulin resistance in this disorder.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  sample_count: 12
  genes:
  - preferred_term: TRMT10A
    term:
      id: hgnc:28403
      label: TRMT10A
  publication: PMID:32213595
  notes: >-
    Surfaced by `just discover-datasets` as a GENE_ONLY candidate; retained
    because its linked publication (PMID:32213595) is already cited in this
    entry for the FTO/m6A mechanism, so the disease relevance is established
    rather than assumed. GEO does not assign a single gdstype to this series,

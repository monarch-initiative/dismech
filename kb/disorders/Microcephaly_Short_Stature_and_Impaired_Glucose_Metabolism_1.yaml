genetic:
- name: TRMT10A
  gene_term:
    preferred_term: TRMT10A
    term:
      id: hgnc:28403
      label: TRMT10A
  relationship_type: CAUSATIVE
  association: >-
    Biallelic TRMT10A variants cause MSSGM1. The gene, on 4q23 and formerly called
    RG9MTD2, encodes the cytoplasmic m1G9 tRNA methyltransferase. Reported alleles
    include nonsense (R127*, R43*), missense (G206R) and canonical splice-site changes.
    Its expression pattern is the founding study's explanation for the syndrome's tissue
    selectivity.
  evidence:
  - reference: PMID:24204302
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRMT10A is ubiquitously expressed but enriched in brain and pancreatic islets,
      consistent with the tissues affected in this syndrome."
    explanation: >-
      Links the gene's expression pattern to the two organ systems the disease affects,
      which is the proposed answer to why a housekeeping enzyme produces a selective
      phenotype.
  - reference: PMID:42181738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a homozygous stop-gained pathogenic (PVS1, PM2,
      and PM3) variant in TRMT10A (c.127C>T; p.Arg43Ter)"
    explanation: Documents a further nonsense allele with ACMG classification.

diagnosis:
- name: Molecular Genetic Testing of TRMT10A
  description: >-
    Sequencing of TRMT10A. The practical point is timing rather than technique: because
    the neurodevelopmental features are congenital and the metabolic ones may appear
    years later or not at all, the diagnosis can and should be made before diabetes
    develops, which converts the metabolic phenotype into something that can be
    monitored for rather than discovered.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42181738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observation highlights the clinical importance of establishing the
      diagnosis prior to the onset of diabetes, enabling anticipatory monitoring and timely
      intervention for potential metabolic complications."
    explanation: The authors' statement of why pre-metabolic diagnosis matters.

treatments:
- name: Metabolic Surveillance and Management
  description: >-
    No disease-modifying therapy exists. Management is anticipatory monitoring of glucose
    handling with treatment of diabetes or hypoglycaemia as it appears, antiepileptic
    treatment for seizures, and developmental support. No target_mechanisms link is
    asserted: none of these acts on the translational lesion, and recording a supportive
    measure as engaging the pathway would misrepresent it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42181738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "enabling anticipatory monitoring and timely intervention for potential
      metabolic complications"
    explanation: Supports anticipatory metabolic surveillance as the management approach.

- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling with a 25% recurrence risk. Relevant to the
    consanguineous families in which the syndrome is most often ascertained.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

differential_diagnoses:
- name: Microcephaly, short stature, and impaired glucose metabolism 2 (PPP1R15B)
  description: >-
    The immediate sibling disease, already curated in this knowledge base. MSSGM2 arises
    from PPP1R15B/CReP variants that raise basal eIF2-alpha phosphorylation and
    chronically attenuate cap-dependent translation initiation. Both diseases produce
    congenital microcephaly with short stature and beta-cell failure by breaking
    translational control - one at the level of tRNA modification, the other at
    initiation.
  distinguishing_features:
  - Different genes - TRMT10A on 4q23 versus PPP1R15B
  - MSSGM1 disrupts tRNA m1G9 modification; MSSGM2 disrupts eIF2-alpha dephosphorylation and translation initiation
  - MSSGM2 is reported with skeletal, dental, hair and white-matter involvement not characteristic of MSSGM1
  evidence:
  - reference: PMID:38950903
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In higher eukaryotes, tRNA methyltransferase 10A (TRMT10A) is responsible for
      N1-methylguanosine modification at position nine of various cytoplasmic tRNAs."
    explanation: >-
      States the molecular function that distinguishes MSSGM1's lesion from the initiation
      defect of MSSGM2.

- name: Other tRNA modopathies
  description: >-
    A broader class rather than a single mimic. More than fifty human tRNA-modifying
    enzymes carry pathogenic mutations, and the resulting diseases converge repeatedly on
    brain dysfunction, diabetes and mitochondrial phenotypes. A patient with microcephaly
    and unexplained young-onset diabetes may have a defect in a different enzyme of the
    same class.
  distinguishing_features:
  - Distinguished by gene rather than by clinical features, which overlap substantially across the class
  - The shared convergence on brain and endocrine phenotypes is a property of the class, not evidence for TRMT10A specifically
  - The knowledge base already curates PUS7-Related_Neurodevelopmental_Disorder, a second tRNA modopathy - PUS7 installs pseudouridine where TRMT10A installs 1-methylguanosine
  evidence:
  - reference: PMID:38950903
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Such ‘RNA modopathies’ or ‘tRNA modopathies’ frequently manifest as brain
      dysfunction, cancer, diabetes, or mitochondrial diseases"
    explanation: Establishes the class and its characteristic convergent phenotypes.

animal_models:
- name: Trmt10a null mouse
  species: Mouse
  genotype: Trmt10a null
  publication: PMID:38950903
  description: >-
    The Trmt10a-null mouse reproduces the molecular lesion in detail - selective tRNA
    depletion, codon-specific ribosome slowdown, altered ATF4 translation - and the
    neurological arm of the disease, with smaller hippocampal postsynaptic densities,
    defective synaptic plasticity and impaired memory. It does not reproduce the
    pancreatic phenotype.
  modeled_mechanisms:
  - target: Perturbed Codon-Specific Translation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model establishes the codon-level mechanism directly, by ribosome profiling, and
      the same tRNA depletion was confirmed in a human cell line lacking TRMT10A.
    limitations: >-
      Ribosome profiling was performed on brain; whether the same codon-specific slowdown
      occurs in islets, where the human disease also manifests, was not established.
    readouts:
    - name: Ribosome occupancy at the Gln(CAG) codon
      target: Perturbed Codon-Specific Translation
      direction: INCREASED
      interpretation: >-
        Increased ribosome dwell time at Gln(CAG) is the direct signature of the depleted
        tRNA-Gln species.
      evidence:
      - reference: PMID:38950903
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ribosome profiling of mouse brain revealed that dysfunction of TRMT10A
          causes ribosome slowdown at the Gln(CAG) codon"
        explanation: Reports the ribosome profiling measurement grounding this readout.
    evidence:
    - reference: PMID:38950903
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we generated Trmt10a null mice and showed that tRNAGln(CUG) and
        initiator methionine tRNA levels were universally decreased in various tissues; the
        same was true in a human cell line lacking TRMT10A."
      explanation: >-
        Establishes that the model reproduces the molecular lesion, corroborated in human
        cells.
  - target: Reduced Beta-Cell Mass
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Trmt10a-null mice show no discernible pancreatic defect, despite the human syndrome
      being named for and originally ascertained through its glucose phenotype.
    limitations: >-
      The endocrine arm of the human disease has no counterpart in this model, so it cannot
      be used to test interventions aimed at preserving beta-cell mass, and a negative
      metabolic result in this mouse says nothing about the human pancreas. Note the
      absence is reported as an observation of no discernible defect rather than as a
      systematic metabolic characterisation, so the strength of the negative is limited by
      how hard the authors looked.
    evidence:
    - reference: PMID:38950903
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite not showing discernable defects in the pancreas, liver, or kidney,
        Trmt10a null mice showed lower body weight and smaller hippocampal postsynaptic
        densities, which is associated with defective synaptic plasticity and memory."
      explanation: >-
        Reports the absence of a pancreatic phenotype alongside the present neurological
        one, in the same animals.

discussions:
- discussion_id: mismatch_mouse_lacks_pancreatic_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Reduced Beta-Cell Mass
  prompt: >-
    Why does the Trmt10a-null mouse reproduce the neurological arm of this syndrome but
    show no discernible pancreatic defect, when the human disease was delineated through
    its young-onset diabetes?
  rationale: >-
    The model is otherwise a good one - it reproduces the tRNA depletion, the
    codon-specific ribosome slowdown, and a neurological phenotype with a measurable
    synaptic correlate. The pancreas is the exception, and it is the organ the human
    syndrome is named for.

    The human side of this contrast is stronger than a culture artefact. Beta-cell death
    has been demonstrated in induced pluripotent stem cell-derived beta-like cells carrying
    patients' own genotypes, with a specific mechanism - guanosine 9 hypomethylation causing
    tRNA-Gln fragmentation, and the 5-prime fragments mediating the death. So the
    disagreement is between a human patient-derived cell system that dies by an identified
    route and a whole mouse whose pancreas looks untouched.

    What is still missing from the human side is the tissue-level step: no one has measured
    beta-cell mass in a patient, which is why this discussion attaches to the mass node
    rather than the apoptosis node. Candidate explanations for the species difference
    include differences in beta-cell tRNA pools or proliferative reserve, a requirement for
    a stressor that laboratory housing does not supply, or the mouse simply not having been
    examined with a metabolic challenge. Which it is determines whether this mouse can serve
    as a preclinical model for the metabolic arm at all.
  proposed_experiments:
  - experiment_id: exp_trmt10a_mouse_metabolic_challenge
    name: Metabolic challenge and beta-cell mass quantification in Trmt10a-null mice
    description: >-
      Subject Trmt10a-null mice to glucose tolerance testing, high-fat feeding and
      pregnancy as beta-cell stressors, with morphometric quantification of beta-cell mass
      and islet apoptosis. A phenotype that appears only under challenge would reconcile
      the culture and whole-animal results and would identify the conditions any
      preclinical study must use.
  - experiment_id: exp_trmt10a_fragment_rescue_in_mouse
    name: Test whether the murine pancreas is spared because it does not generate the toxic fragment
    description: >-
      Measure 5-prime tRNA-Gln fragment levels in Trmt10a-null mouse islets and compare them
      against patient-derived beta-like cells, in which the fragments mediate death. If the
      mouse islet does not accumulate the fragment, the species difference is explained at
      the level of the mechanism rather than by how hard anyone looked - and conversely, if
      it does accumulate it without dying, the protection lies downstream and is worth
      identifying as a therapeutic lead.

- discussion_id: gap_glucose_phenotype_is_bidirectional_and_non_obligate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disordered Glucose Homeostasis
  prompt: >-
    What determines whether a TRMT10A patient develops diabetes, hyperinsulinaemic
    hypoglycaemia, or no metabolic abnormality at all?
  rationale: >-
    The metabolic phenotype of this syndrome is not one thing. The founding family had
    young-onset diabetes; a separate kindred had predominantly hyperinsulinaemic
    hypoglycaemia, which is the opposite direction of glucose dysregulation; and a patient
    reported in 2026 had the full neurodevelopmental picture with no metabolic abnormality
    documented at fifteen. A single mechanism of beta-cell loss does not obviously produce
    both hyperglycaemia and hyperinsulinism, so either the mechanism is more complex than
    beta-cell attrition, or the direction depends on age, genotype or modifiers not yet
    identified. This is not a nuance: it determines what to screen for, and screening a
    child for diabetes alone would miss the hypoglycaemic presentation entirely. It also
    means the age-related question is unresolved - whether the patient without metabolic
    findings is genuinely spared or simply has not yet reached the age of onset, which the
    reporting authors are careful to leave open by writing that diabetes has not yet been
    documented.
  proposed_experiments:
  - experiment_id: exp_trmt10a_longitudinal_metabolic_phenotyping
    name: Longitudinal metabolic phenotyping of a TRMT10A cohort by genotype
    description: >-
      Follow reported TRMT10A patients prospectively with periodic oral glucose tolerance
      testing and insulin measurement, recording direction of dysregulation against age and
      allele class. This is the only way to distinguish a genuinely spared patient from one
      who has not yet converted, and to test whether nonsense and missense alleles differ in
      metabolic direction.

notes: >-
  MONDO identity, and a decision deliberately left open. Two MONDO terms describe what
  appears to be this disease. MONDO:0000208 (MSSGM1) carries the causal gene TRMT10A as an
  RO:0004003 relationship and the OMIM xref 616033, and is bound here as the disease_term
  on that basis. MONDO:0018320, "primary microcephaly-mild intellectual disability-young-onset
  diabetes syndrome" (Orphanet:391408), carries no causal gene and no OMIM xref in MONDO,
  and the two terms are not in any subsumption relation to each other. The names describe
  the same clinical triad, so they are probably the same disease - but "probably" is not a
  mapping. Verifying it needs the Orphanet record for 391408, and the Orphadata bulk XML is
  not present in this checkout, so the check could not be run. No mondo_mappings entry is
  asserted rather than recording an equivalence that was assumed, and the stub keyed on
  MONDO:0018320 is deliberately left in place rather than retired on that assumption; an
  overlapping stub is explicitly tolerated in this repository, whereas a wrong exactMatch
  would silently retire a concept. This differs from what the claim issue proposed, because
  the Orphanet data turned out to be unavailable.

  No GeneReviews chapter exists for this disease or gene. Verified by search: both
  "TRMT10A GeneReviews[All Fields]" and a search on the OMIM disease name return zero
  results.

  No frequency bands are assigned to any phenotype. The literature is a few dozen patients
  across case reports and small kindreds, and the one feature where a band would matter most
  - how often glucose dysregulation occurs and in which direction - is precisely the one the
  KNOWLEDGE_GAP above records as unresolved.

  The 2026 report of a moonlighting role for TRMT10A in lipid homeostasis independent of its
  methyltransferase activity is noted here as a lead but is not curated, since nothing in
  this entry's phenotype set depends on it and it has not been connected to patient disease.


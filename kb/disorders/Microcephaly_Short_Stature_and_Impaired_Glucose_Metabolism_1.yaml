name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
creation_date: "2026-08-20T07:00:00Z"
category: Mendelian
description: >-
  Microcephaly, short stature, and impaired glucose metabolism 1 (MSSGM1;
  TRMT10A deficiency) is an ultra-rare autosomal recessive syndrome caused by
  biallelic loss-of-function variants in TRMT10A, the nucleolar tRNA
  methyltransferase that installs N1-methylguanosine at position 9 (m1G9) in
  the D-loop of many cytoplasmic tRNAs. TRMT10A is ubiquitously expressed but
  enriched in brain and pancreatic islets — precisely the two tissues that
  fail. Loss of m1G9 destabilizes and fragments specific tRNAs (tRNA-Gln and
  initiator methionine tRNA are established targets); the resulting 5'-tRNA-Gln
  fragments are themselves cytotoxic and, together with oxidative stress,
  trigger the intrinsic apoptotic pathway in beta cells, while codon-specific
  ribosome slowdown and derepressed ATF4 translation perturb synthesis of
  neuronal proteins. Clinically this produces congenital primary microcephaly
  with intellectual disability and epilepsy, proportionate short stature, and a
  characteristically biphasic glucose phenotype: hypoglycaemia (often
  hyperinsulinaemic) in infancy or childhood transitioning to young-onset,
  autoantibody-negative diabetes in the second to third decade. The diabetes is
  not a single mechanism — reported cases span beta-cell insulin deficiency and
  marked peripheral insulin resistance responsive to metformin, and treatment
  should follow whichever arm predominates. The metabolic phenotype is
  age-dependent and may be entirely absent at the time a child is diagnosed, so
  a normal glucose profile does not exclude the diagnosis.
parents:
- Microcephaly
- Monogenic diabetes
synonyms:
- MSSGM1
- TRMT10A deficiency
- TRMT10A-related syndrome
- Primary microcephaly-mild intellectual disability-young-onset diabetes syndrome

    dataset, not patient material.

notes: >-
  Curation notes.

  (1) Entity identity. The curation request named this disorder by its Orphanet
  label, "primary microcephaly-mild intellectual disability-young-onset diabetes
  syndrome" (ORPHA:391408 / MONDO:0018320). That concept resolves to TWO
  gene-defined diseases, not one: Orphadata lists both TRMT10A and PPP1R15B as
  assessed disease-causing genes and cross-references ORPHA:391408 as broader
  than both OMIM:616033 and OMIM:616817. This entry curates the TRMT10A disease
  (MSSGM1, MONDO:0000208); the PPP1R15B disease (MSSGM2, MONDO:0014785) was
  already curated. The Orphanet-level union is modelled as a Grouping rather
  than being blended into either Disease entry.

  (2) Deep-research provenance and a caught error. Two providers returned:
  claude_code (10/10 references resolved, 0 unresolved, 0 off-topic;
  `just preflight-dr` PASS against MONDO:0000208, TRMT10A mentioned 62 times
  against 4 for the nearest rival gene) and openscientist (12/12 resolved,
  0 unresolved, 0 off-topic; preflight WARN because it discusses PPP1R15B
  alongside TRMT10A — the expected consequence of the lump/split situation in
  point 1, not a wrong-entity report). falcon was attempted first per the
  default and failed with HTTP 402 Payment Required; the Edison key carries no
  credit.

  The claude_code report asserted that MSSGM2 is caused by biallelic IGF2BP1
  variants. That is wrong — MSSGM2 (OMIM:616817, MONDO:0014785) is caused by
  PPP1R15B, verified against the MONDO record, against the existing dismech
  MSSGM2 entry, and independently against the openscientist report, which
  states the correct gene assignment and flags the conflation risk explicitly.
  The claim was discarded and is recorded here so it is not reintroduced. Two
  ontology suggestions from the same report were also rejected on verification:
  HP:0009806 for dorsocervical fat pad (the correct term is HP:0025383) and
  HP:0040270 for insulin resistance (HP:0000855). A report can pass every
  automated check and still be wrong about an adjacent entity.

  (3) Frequency qualifiers are deliberately omitted throughout. With on the
  order of twenty published probands and no cohort study, any FrequencyEnum
  value would be a manufactured justification for a band. The descriptions state
  what was observed in which report instead.

  (4) Review round 1 (PR #9162). Four phenotypes that were named in an entry
  title or description but carried no bound term were split out and bound:
  Scoliosis (HP:0002650), Joint hypermobility (HP:0001382), and the individual
  craniofacial features (deep-set eyes, hypotelorism, wide nose, short neck).
  The bundled "Progressive Beta-Cell Loss and Biphasic Glucose Dysregulation"
  node was split into a CELLULAR node (beta-cell mass loss) and an ORGANISM node
  (biphasic glucose dysregulation), per the single-value `biological_scale`
  discipline. Wolcott-Rallison syndrome was added as a differential.

  The Dandy-Walker finding is bound to HP:0001320 (Cerebellar vermis
  hypoplasia), NOT to HP:0001305 (Dandy-Walker malformation), and the reasoning
  is on that phenotype entry: HPO's definition of the malformation requires
  posterior-fossa enlargement, which is exactly what a Dandy-Walker *variant*
  lacks. Binding the variant to the malformation term would assert a finding the
  source does not report.

  Hypoglycaemia-phase management is deliberately absent from `treatments`: no
  cached abstract contains a quotable management sentence for the hypoglycaemic
  phase, and manufacturing one would be the failure mode the evidence SOP
  warns about.

  (5) Orphanet HPO annotations were not cited. `just refresh-orphadata` failed on
  a sha256 mismatch against the pinned manifest (the upstream bulk files have
  moved on), and updating the manifest would have required rebuilding all 8,823
  ORPHA cache files — an unrelated diff far larger than this curation. All
  phenotype evidence here therefore comes from primary literature.

  description: >-
    Human high-throughput sequencing profiling of the RNA species bound by
    TRMT10A, undertaken to define the enzyme's substrate repertoire in human
    cells rather than yeast. Directly informative for the "Loss of tRNA m1G9
    Methyltransferase Activity" node, since which tRNAs TRMT10A actually
    services in human cells determines which codons are affected when it is
    lost.
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  sample_count: 6
  genes:
  - preferred_term: TRMT10A
    term:
      id: hgnc:28403
      label: TRMT10A
  notes: >-
    Surfaced by `just discover-datasets` as a GENE_ONLY candidate and retained
    after manual relevance triage: the GEO summary is explicitly about defining
    the human tRNA substrate repertoire of TRMT10A, so it bears on the disease
    mechanism rather than merely mentioning the gene. It is a gene-function

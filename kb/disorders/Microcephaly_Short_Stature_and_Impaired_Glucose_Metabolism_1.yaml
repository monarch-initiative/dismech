  description: >-
    Autosomal recessive, confirmed across every reported kindred: biallelic
    variants in affected individuals, clinically unaffected heterozygous
    parents, and parental consanguinity in nearly all families. Segregation was
    formally demonstrated in multiple independent reports.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:

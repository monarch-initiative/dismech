- name: Zoledronic acid
  description: >-
    A single 5 mg infusion of zoledronic acid in SQSTM1 carriers identified by
    family screening was well tolerated, reduced bone turnover markers and
    prevented progression of early pagetic lesions in a randomised
    placebo-controlled trial (ZiPP); it was underpowered to show prevention of
    new lesions. No disease-modifying treatment exists for the neurological or
    muscle presentations.

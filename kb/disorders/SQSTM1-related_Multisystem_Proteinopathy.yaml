genetic:
- name: SQSTM1
  gene_term:
    preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  variant_origin: GERMLINE
  features: >-
    Heterozygous missense, truncating and splice variants. PDB variants
    cluster in and around the UBA domain; ALS/FTD variants are spread across
    the protein. p.Pro392Leu is the commonest allele in PDB, recurs in ALS and
    FTD, and is the usual SQSTM1 allele in the digenic myopathy. The
    c.1165+1G>A splice variant has been reported in PDB, ALS with PDB, and
    isolated distal myopathy.
  examples:
  - p.Pro392Leu
  - c.1165+1G>A
  - p.Pro387Leu
  - p.Ala381Val
  - p.Leu341Val
  - p.Gly427Arg
  variants:
  - name: p.Pro392Leu
    description: >-
      Recurrent UBA-flanking missense variant; the most frequent SQSTM1 allele
      in PDB, also found in FTD, ALS and the digenic myopathy.
    evidence:
    - reference: PMID:11992264
      reference_title: "Recurrent mutation of the gene encoding sequestosome 1 (SQSTM1/p62) in Paget disease of bone."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        led to the identification of a recurrent nonconservative change
        (P392L) flanking the ubiquitin-associated domain (UBA) (position
        394-440) of the protein that was not present in 291 control
        individuals.
      explanation: >-
        Identification of the recurrent PDB allele.
    - reference: PMID:23942205
      reference_title: "Sequestosome-1 (SQSTM1) sequence variants in ALS cases in the UK: prevalence and coexistence of SQSTM1 mutations in ALS kindred with PDB."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The occurrence of the same mutation in ALS and PDB is indicative of a
        common pathogenic pathway that converges on protein homeostasis.
      explanation: >-
        The same allele in ALS and PDB.
  - name: c.1165+1G>A
    description: >-
      Splice-donor variant in intron 7 producing UBA-truncated and
      PEST2-deleted p62; reported in PDB, ALS with PDB, and distal myopathy.
    evidence:

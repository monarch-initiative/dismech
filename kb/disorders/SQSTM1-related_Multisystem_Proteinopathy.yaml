has_subtypes:
- name: PDB3
  display_name: Paget disease of bone 3 (SQSTM1)
  description: >-
    Focal, often polyostotic Paget disease of bone caused by heterozygous
    SQSTM1 variants that cluster in and around the C-terminal ubiquitin-associated
    (UBA) domain, recurrently p.Pro392Leu. It is the commonest and best-penetrant
    presentation; carriers are diagnosed earlier and with more affected bones
    than patients without a variant. Also carried as a subtype row of the
    Paget_Disease_of_Bone entry.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  subtype_term:
    preferred_term: Paget disease of bone 3
    term:
      id: MONDO:0008176
      label: Paget disease of bone 3
  evidence:
  - reference: PMID:12374763
    reference_title: "Domain-specific mutations in sequestosome 1 (SQSTM1) cause familial and sporadic Paget's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These studies confirm that mutations affecting the ubiquitin-binding
      domain of SQSTM1 are a common cause of familial and sporadic Paget's
      disease of bone.
    explanation: >-
      Mutation screening of familial and sporadic PDB establishes UBA-domain
      SQSTM1 variants as the cause of this subtype.
  - reference: PMID:11992264
    reference_title: "Recurrent mutation of the gene encoding sequestosome 1 (SQSTM1/p62) in Paget disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that two independent mutational events at the same
      position in SQSTM1/p62 caused PDB in a high proportion of French Canadian
      patients.
    explanation: >-
      The original identification of the recurrent P392L allele in PDB families
      mapped to the PDB3 locus.
- name: FTDALS3
  display_name: Frontotemporal dementia and/or amyotrophic lateral sclerosis 3
  description: >-
    Behavioural-variant frontotemporal dementia, amyotrophic lateral sclerosis,
    or both, in carriers of heterozygous SQSTM1 variants. ALS/FTD-associated
    variants are spread across the whole protein, not only the UBA domain, and
    some (p.Pro392Leu, p.Pro387Leu, p.Ala381Val) are shared with PDB. Many
    patients are sporadic, which is attributed to reduced penetrance.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  subtype_term:
    preferred_term: frontotemporal dementia and/or amyotrophic lateral sclerosis 3
    term:
      id: MONDO:0014640
      label: frontotemporal dementia and/or amyotrophic lateral sclerosis 3
  evidence:
  - reference: PMID:22084127
    reference_title: "SQSTM1 mutations in familial and sporadic amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 10 novel SQSTM1 mutations (9 heterozygous missense and 1
      deletion) in 15 patients (6 with familial ALS and 9 with sporadic ALS).
    explanation: >-
      First case-control screen linking heterozygous SQSTM1 variants to
      familial and sporadic ALS.
  - reference: PMID:24042580
    reference_title: "SQSTM1 mutations in French patients with frontotemporal dementia or frontotemporal dementia with amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, this is the first study that clearly demonstrates a
      segregation of a SQSTM1 mutation with dementia in 2 families, F297 and
      FR1324.
    explanation: >-
      Family segregation of SQSTM1 variants with frontotemporal dementia.
  - reference: PMID:22972638
    reference_title: "SQSTM1 mutations in frontotemporal lobar degeneration and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 6 missense mutations in the coding region of SQSTM1 in
      patients with either FTLD or ALS, none of which were found in healthy
      controls or patients with PDB.
    explanation: >-
      Independent cohort showing SQSTM1 missense variants in FTLD and ALS.
- name: DMRV
  display_name: Distal myopathy with rimmed vacuoles (SQSTM1)
  description: >-
    Late-onset, often asymmetric distal myopathy with ankle dorsiflexion and
    finger extensor weakness, mildly raised creatine kinase and rimmed vacuoles
    containing p62 and TDP-43. First described with the SQSTM1 c.1165+1G>A
    splice variant, which can cause myopathy without bone or brain involvement.
    Most subsequently reported patients also carry TIA1 p.Asn357Ser, and the
    myopathy is then considered digenic. A frameshift variant has also been
    reported with a proximal, limb-girdle myopathy with rimmed vacuoles.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  - preferred_term: TIA1
    description: >-
      The p.Asn357Ser variant is co-inherited with the SQSTM1 variant in most
      reported patients with the myopathy.
    term:
      id: hgnc:11802
      label: TIA1
  subtype_term:
    preferred_term: myopathy, distal, with rimmed vacuoles
    term:
      id: MONDO:0014945
      label: myopathy, distal, with rimmed vacuoles
  inheritance:
  - name: Digenic inheritance
    inheritance_term:
      preferred_term: Digenic inheritance
      term:
        id: HP:0010984
        label: Digenic inheritance
    description: >-
      Most patients with SQSTM1-related distal myopathy carry a heterozygous
      UBA-domain SQSTM1 variant (most often p.Pro392Leu) together with the TIA1
      p.Asn357Ser variant; the TIA1 variant is proposed to determine the
      myodegenerative presentation of the SQSTM1 variant.
    evidence:
    - reference: PMID:39142003
      reference_title: "Defining the landscape of TIA1 and SQSTM1 digenic myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The TIA1 p.Asn357Ser variant was present in all patients and the SQSTM1
        p.Pro392Leu was the most frequent (71%) of the four reported SQSTM1
        variants.
      explanation: >-
        A 24-patient series and literature review finds both variants in every
        patient with the digenic myopathy.
    - reference: PMID:38016875
      reference_title: "Distal myopathy due to digenic inheritance of TIA1 and SQSTM1 variants in two unrelated Spanish patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Digenic inheritance is supported by evidence from unrelated pedigrees
        and a plausible biological interaction between both proteins in protein
        quality control processes.
      explanation: >-
        States the basis for treating the myopathy as digenic.
  evidence:
  - reference: PMID:26208961
    reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected patients had late-onset distal lower extremity weakness,
      myopathic features on EMG, and muscle pathology demonstrating rimmed
      vacuoles with both TAR DNA-binding protein 43 and SQSTM1 inclusions.
    explanation: >-
      The founding description of SQSTM1 distal myopathy with rimmed vacuoles.
  - reference: PMID:26208961
    reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the patients described in this study did not have evidence of
      PDB, ALS, or FTD, suggesting that myopathy can occur in isolation with
      c.1165+1 G>A SQSTM1 variant.
    explanation: >-
      Shows the myopathy can be the sole manifestation.
  - reference: PMID:36998782
    reference_title: "Frameshift mutation in SQSTM1 causes proximal myopathy with rimmed vacuoles: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we report a new phenotype of SQSTM1-associated proteinopathy, a
      novel frameshift mutation in SQSTM1 causing proximal MRV.
    explanation: >-
      Extends the muscle presentation to proximal weakness.
  - reference: PMID:29457785
    reference_title: "TIA1 variant drives myodegeneration in multisystem proteinopathy with SQSTM1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we provide evidence that a TIA1 (p.N357S) variant dictates a
      myodegenerative phenotype when inherited, along with a pathogenic SQSTM1
      mutation.
    explanation: >-
      Genetic evidence that co-inheritance of TIA1 p.N357S with an SQSTM1
      variant determines the myopathic presentation.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous SQSTM1 variants segregate dominantly with disease, but
    penetrance of each presentation is incomplete and age-dependent, so many
    carriers present as sporadic cases and relatives with the same variant may
    show different presentations.
  evidence:
  - reference: PMID:26208961
    reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to mutations in VCP, dominantly inherited mutations in SQSTM1 are
      now associated with rimmed vacuolar myopathy, Paget disease of bone,
      amyotrophic lateral sclerosis, and frontotemporal dementia.
    explanation: >-
      States dominant inheritance across all four presentations.
  - reference: PMID:26208961
    reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of SQSTM1 mutations in sporadic disease is likely due
      to its reduced penetrance.
    explanation: >-
      Supports incomplete penetrance.
  - reference: PMID:17229007
    reference_title: "Sequestosome 1: mutation frequencies, haplotypes, and phenotypes in familial Paget's disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the P392L mutation is transmitted as an autosomal dominant trait
      in the Quebecois families, with a high but incomplete penetrance peaking
      after age 60.
    explanation: >-
      Age-dependent, incomplete penetrance of P392L for PDB.
  - reference: PMID:24042580
    reference_title: "SQSTM1 mutations in French patients with frontotemporal dementia or frontotemporal dementia with amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 4 heterozygous missense mutations in 4 unrelated families
      with FTD; only 1 family had clinical symptoms of Paget disease of bone,
      and only 1 family had clinical symptoms of FTD-ALS, possibly owing to the
      low penetrance of some of the clinical manifestations.
    explanation: >-
      Heterozygous variants in FTD families with variable, low-penetrance
      expression of the other presentations.
progression:
- phase: Adult-onset presentation
  notes: >-
    All three presentations begin in adulthood. In SQSTM1 carriers screened
    from PDB families, asymptomatic pagetic lesions are already present in
    about 9% by the fifth decade; dementia and myopathy typically begin in the
    sixth decade or later.
  evidence:
  - reference: PMID:32176830
    reference_title: "Characteristics of Early Paget's Disease in SQSTM1 Mutation Carriers: Baseline Analysis of the ZiPP Study Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic PDB is present in about 9% of SQSTM1 mutation carriers by
      the fifth decade.
    explanation: >-
      Bone-scan screening of carriers in the ZiPP cohort dates the onset of
      bone disease.
  - reference: PMID:39142003
    reference_title: "Defining the landscape of TIA1 and SQSTM1 digenic myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These twenty-four patients (75% males) had late-onset (52,6 ± 10,1 years),
      mainly asymmetric, distal ankle and hand finger extension weakness (75%),
      mild CK elevation (82.4%) and myopathic EMG.
    explanation: >-
      Gives the late age of onset of the digenic myopathy.
- phase: Progressive neurodegeneration
  notes: >-
    The bone presentation is focal and treatable, whereas ALS, FTD and the
    myopathy progress. In one ALS cohort, SQSTM1 variant carriers progressed
    faster to death or tracheostomy than non-carriers.
  evidence:
  - reference: PMID:25708934
    reference_title: "Six SQSTM1 mutations in a Chinese amyotrophic lateral sclerosis cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the ΔFS analysis revealed that the risk of death or tracheostomy
      was significantly increased in SQSTM1 mutation carriers (p < 0.05).
    explanation: >-
      Faster progression of SQSTM1-related ALS.
pathophysiology:
- name: Heterozygous SQSTM1 Variant Alters p62 Domains
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    p62 is a multidomain scaffold: an N-terminal PB1 oligomerisation domain, a
    TRAF6-binding region, an LC3-interacting region (LIR) that docks it to the
    forming autophagosome, a KEAP1-interacting region (KIR), and a C-terminal
    UBA domain that binds ubiquitinated cargo. PDB-associated variants cluster
    in and around the UBA domain, whereas ALS/FTD-associated variants are
    distributed across the protein, including the LIR and KIR. Several
    alleles, p.Pro392Leu above all, occur in both groups. Which presentation an
    allele produces is therefore only partly predicted by where it lies.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  genetic_context:
    gene:
      preferred_term: SQSTM1
      term:
        id: hgnc:11280
        label: SQSTM1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:27554286
    reference_title: "ALS-FTLD associated mutations of SQSTM1 impact on Keap1-Nrf2 signalling."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SQSTM1 encodes the SQSTM1/p62 protein and the overwhelming majority of
      mutations associated with PDB cluster within and around the C-terminal
      ubiquitin-associated (UBA) domain, whereas mutations associated with
      ALS-FTLD occur more widely throughout the protein sequence
    explanation: >-
      Introduction of a functional study summarising the domain distribution of
      bone-associated and neurodegeneration-associated variants.
  - reference: PMID:17229007
    reference_title: "Sequestosome 1: mutation frequencies, haplotypes, and phenotypes in familial Paget's disease of bone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 14 mutations reported in SQSTM1/p62 all affect the
      ubiquitin-associated domain of the protein.
    explanation: >-
      The PDB-associated alleles known at the time all lie in the UBA domain.
  - reference: PMID:24486447
    reference_title: "SQSTM1 mutations--bridging Paget disease of bone and ALS/FTLD."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although several SQSTM1 mutations are common to both ALS/FTLD and PDB,
      many are ALS/FTLD-specific.
    explanation: >-
      Review stating that some alleles are shared between the bone and
      neurodegenerative presentations and others are not.
  - reference: PMID:23942205
    reference_title: "Sequestosome-1 (SQSTM1) sequence variants in ALS cases in the UK: prevalence and coexistence of SQSTM1 mutations in ALS kindred with PDB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one p.(Pro392Leu) kindred, the carrier developed both ALS and Paget's
      disease of bone (PDB)
    explanation: >-
      The same allele can produce both the bone and the motor neuron
      presentation in one person.
  downstream:
  - target: Impaired p62-Mediated Selective Autophagy
    causal_link_type: DIRECT
    description: >-
      Variants in the UBA domain and LIR reduce binding of ubiquitinated cargo
      or of LC3, weakening p62's cargo-receptor function.
  - target: Impaired KEAP1-NRF2 Antioxidant Response
    causal_link_type: DIRECT
    description: >-
      Variants in or near the KIR reduce KEAP1 binding and NRF2 activation.
  - target: Enhanced RANKL-NF-kB Signalling in Osteoclast Precursors
    causal_link_type: DIRECT
    description: >-
      UBA-domain variants lose ubiquitin binding and increase NF-kB activation
      downstream of RANK in osteoclast precursors.
- name: Impaired p62-Mediated Selective Autophagy
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    p62 links ubiquitinated proteins to LC3 on the forming autophagosome so
    they can be degraded. Disease variants reduce LC3B recognition (LIR
    variants such as p.Leu341Val), reduce TBK1/ULK1-dependent phosphorylation
    of the UBA domain that activates cargo binding, or remove the UBA domain
    (the c.1165+1G>A splice product). The shared result is slower autophagic
    clearance of ubiquitinated proteins, the lesion the neurodegenerative and
    myopathic presentations are thought to share with VCP-, OPTN- and
    TBK1-related disease.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  molecular_functions:
  - preferred_term: autophagy cargo adaptor activity
    modifier: DECREASED
    term:
      id: GO:0160247
      label: autophagy cargo adaptor activity
  - preferred_term: ubiquitin binding
    modifier: DECREASED
    term:
      id: GO:0043130
      label: ubiquitin binding
  biological_processes:
  - preferred_term: aggrephagy
    modifier: DECREASED
    term:
      id: GO:0035973
      label: aggrephagy
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:26208961
    reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      SQSTM1 is an autophagic adaptor that shuttles aggregated and ubiquitinated
      proteins to the autophagosome for degradation via its C-terminal UBA
      domain.
    explanation: >-
      States the normal cargo-receptor function that disease variants impair.
  - reference: PMID:27158844
    reference_title: "Defective recognition of LC3B by mutant SQSTM1/p62 implicates impairment of autophagy as a pathogenic mechanism in ALS-FTLD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that although representing a conservative substitution and
      predicted to be benign, the ALS-associated L341V mutation of SQSTM1 is
      defective in recognition of LC3B.
    explanation: >-
      An ALS-associated LIR variant directly impairs docking of p62 to LC3B.
  - reference: PMID:27158844
    reference_title: "Defective recognition of LC3B by mutant SQSTM1/p62 implicates impairment of autophagy as a pathogenic mechanism in ALS-FTLD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data supports a model in which the L341V mutation limits the critical
      step of SQSTM1 recruitment to the phagophore.
    explanation: >-
      Functional consequence of the LIR variant in motor neuron-like cells.
  - reference: PMID:31362587
    reference_title: "ALS-FTLD-linked mutations of SQSTM1/p62 disrupt selective autophagy and NFE2L2/NRF2 anti-oxidative stress pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, ALS-FTLD-linked mutations of TBK1 or SQSTM1 reduce SQSTM1
      phosphorylation and compromise ubiquitinated cargo binding and clearance.
    explanation: >-
      ALS/FTD-linked SQSTM1 variants impair ubiquitinated cargo clearance in
      cells.
  downstream:
  - target: p62- and TDP-43-Positive Ubiquitinated Inclusions
    causal_link_type: DIRECT
    description: >-
      Uncleared ubiquitinated proteins accumulate with p62 and TDP-43 in
      neurons and myofibres.
  - target: Persistent Stress Granules
    causal_link_type: DIRECT
    description: >-
      p62 participates in stress granule clearance; mutant or depleted p62
      slows it.
- name: Impaired KEAP1-NRF2 Antioxidant Response
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  subtypes:
  - FTDALS3
  description: >-
    p62 binds KEAP1 through its KIR and so releases NRF2 to activate
    antioxidant genes. ALS/FTD variants in or next to the KIR (p.Pro348Leu,
    p.Gly351Ala, p.Gly427Arg through loss of Ser351 phosphorylation) reduce
    KEAP1 binding and NRF2 target-gene expression, and p.Gly427Arg increases
    TDP-43-associated stress granule formation under oxidative stress. Shown in
    cell models for a subset of neurodegeneration-associated alleles only.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    modifier: DECREASED
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  evidence:
  - reference: PMID:27554286
    reference_title: "ALS-FTLD associated mutations of SQSTM1 impact on Keap1-Nrf2 signalling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with impaired Keap1 binding, the P348L and G351A KIR mutants
      showed reduced ability to activate Nrf2 signalling compared to wild-type
      SQSTM1/p62 in antioxidant response element (ARE)-luciferase reporter
      assays.
    explanation: >-
      KIR variants found in ALS/FTD reduce NRF2 activation in reporter assays.
  - reference: PMID:31362587
    reference_title: "ALS-FTLD-linked mutations of SQSTM1/p62 disrupt selective autophagy and NFE2L2/NRF2 anti-oxidative stress pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, disease mutation SQSTM1G427R abolishes phosphorylation of
      Ser351 and impairs KEAP1-SQSTM1 interaction, thus diminishing
      NFE2L2/Nrf2-targeted gene expression and increasing TARDBP/TDP-43
      associated stress granule formation under oxidative stress.
    explanation: >-
      A UBA-domain ALS/FTD variant disrupts KEAP1 binding and NRF2 signalling.
  downstream:
  - target: Persistent Stress Granules
    causal_link_type: DIRECT
    description: >-
      Under oxidative stress the G427R variant increases TDP-43-associated
      stress granule formation.
- name: Persistent Stress Granules
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Stress granules are transient ribonucleoprotein condensates that must be
    disassembled, partly by autophagy, once stress resolves. Mutant or depleted
    p62 slows their clearance. The TIA1 p.Asn357Ser variant enhances TIA1 phase
    separation, and granules made with it persist, bind more p62 and accumulate
    ubiquitinated and aggregated proteins. Co-expression of mutant TIA1 and
    mutant SQSTM1 in myoblasts is synergistically toxic, which is the proposed
    basis of the digenic myopathy.
  genes:
  - preferred_term: SQSTM1
    term:
      id: hgnc:11280
      label: SQSTM1
  - preferred_term: TIA1
    term:
      id: hgnc:11802
      label: TIA1
  biological_processes:
  - preferred_term: cytoplasmic stress granule disassembly
    modifier: DECREASED
    term:
      id: GO:0035617
      label: cytoplasmic stress granule disassembly

      reference_title: "SQSTM1 splice site mutation in distal myopathy with rimmed vacuoles."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequencing identified a likely pathogenic c.1165+1 G>A splice donor
        variant in SQSTM1 in the affected members of 1 family and in an
        unrelated patient with sporadic distal myopathy.
      explanation: >-
        The splice variant in SQSTM1 distal myopathy.
  evidence:

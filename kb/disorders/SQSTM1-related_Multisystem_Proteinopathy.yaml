name: SQSTM1-related Multisystem Proteinopathy
creation_date: "2026-10-12T14:48:06Z"
category: Mendelian
description: >-
  SQSTM1-related multisystem proteinopathy (MSP4) is an adult-onset, autosomal
  dominant disorder caused by heterozygous variants in SQSTM1, which encodes
  the ubiquitin-binding selective-autophagy receptor and signalling scaffold
  p62/sequestosome-1. The same gene, and in some families the same allele
  (most often p.Pro392Leu), produces three clinical presentations with strongly
  variable penetrance: Paget disease of bone (PDB3), frontotemporal dementia
  and/or amyotrophic lateral sclerosis (FTDALS3), and a late-onset distal
  myopathy with rimmed vacuoles (DMRV). They occur alone or together within a
  family or an individual. The brain, spinal cord and muscle presentations
  share a pathology of p62- and TDP-43-positive ubiquitinated inclusions,
  consistent with failed p62-mediated clearance of ubiquitinated cargo. The
  bone presentation is driven by osteoclast precursors that are hypersensitive
  to RANKL with enhanced NF-kB signalling, and the extent to which it shares
  the autophagy lesion of the neuromuscular presentations is not settled. The
  myopathy is frequently digenic, with the TIA1 p.Asn357Ser variant co-inherited
  alongside the SQSTM1 variant. This entry covers the dominant, heterozygous
  disease only. Biallelic loss-of-function SQSTM1 variants cause a different,
  recessive childhood-onset neurodegeneration with ataxia, dystonia and gaze
  palsy, curated separately as SQSTM1-Related_Childhood-Onset_Neurodegeneration.
notes: >-
  Lumped at the gene level with the three MONDO descendants of MONDO:0800464
  (PDB3, FTDALS3 and DMRV) as subtypes, because they are allelic presentations
  of one dominant disorder that co-occur in families and in individuals; the
  ClinGen ALS gene curation expert panel made the same lumping decision for
  SQSTM1, while splitting off the recessive childhood-onset disease. The PDB3
  subtype is also a subtype row of the Paget_Disease_of_Bone entry, which
  models the bone arm in more detail (osteoclast biology, focal lesion
  evolution, environmental triggers) and remains the place to curate PDB
  itself; the row here is kept as an ordinary subtype rather than a curated_in
  pointer, because a pointer would claim that PDB3 is curated in full as its
  own entry, and it is not. The GeneReviews chapter "Multisystem Proteinopathy"
  (PMID:20301649) lists SQSTM1 among its genes only from its September 2026
  revision; earlier versions cover VCP, HNRNPA1 and HNRNPA2B1. It is tagged as
  the GeneReviews baseline but not quoted.

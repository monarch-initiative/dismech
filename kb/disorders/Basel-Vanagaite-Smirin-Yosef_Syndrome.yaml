genetic:
- name: Biallelic MED25 variants
  association: Causative
  gene_term:
    preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:25792360
      reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we have been able to identify homozygous mutation p.(Tyr39Cys) in MED25 as the cause of a syndrome characterized by eye, brain, cardiac and palatal abnormalities as well as growth retardation, microcephaly and severe intellectual disability in seven patients from four unrelated families
      explanation: Homozygous MED25 variants in affected individuals support autosomal recessive inheritance. Consanguinity is not required in every family.
  features: Homozygous and compound heterozygous missense, frameshift, nonsense, and splice-region variants have been reported. Tyr39Cys has functional evidence of impaired Mediator association. The recurrent Ile173Thr allele was initially reported with a COQ8A variant and subsequently in two affected siblings; haplotype analysis did not support a shared founder origin for those Lebanese families. Some recently reported missense alleles remain uncertain or have only computational functional support.
  evidence:
  - reference: PMID:25792360
    reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Using exome sequencing, we have been able to identify homozygous mutation p.(Tyr39Cys) in MED25 as the cause of a syndrome characterized by eye, brain, cardiac and palatal abnormalities as well as growth retardation, microcephaly and severe intellectual disability in seven patients from four unrelated families, all originating from the same village.
    explanation: The defining clinical series establishes the association between biallelic MED25 variation and a multisystem developmental syndrome; it does not measure the cellular pathway to each manifestation.
  - reference: PMID:32816121
    reference_title: 'Improving the phenotype description of Basel-Vanagaite-Smirin-Yosef syndrome, MED25-related: polymicrogyria as a distinctive neuroradiological finding.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Whole exome sequencing detected a homozygous frameshift variant in the MED25 gene: NM_030973.3:c.1778_1779delAG, p.(Gln593Argfs).'
    explanation: The reported homozygous frameshift extends the allelic spectrum beyond VWA-domain missense variants.
  - reference: PMID:31602195
    reference_title: 'Report of a Second Lebanese Family with Basel-Vanagaite-Smirin-Yosef Syndrome: Possible Founder Mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'In addition, haplotype analysis around the variant in both the families revealed that although the variant occurs within a run of homozygosity in the previously reported patients from the consanguineous family, this is not so in the case of the probands reported here: the variant seems to have an independent origin in the 2 alleles, ruling out the presence of a founder mutation.'
    explanation: The full-text haplotype result argues against treating Ile173Thr as an established shared founder allele in these families.
  - reference: PMID:30039206
    reference_title: The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In conclusion, we provide evidence that PNKP is the main gene related to CMT2B2 instead of MED25, and that it should be considered as a gene involved in an axonal peripheral neuropathy with late age onset, cerebellar atrophy, and with or without oculomotor apraxia.
    explanation: The reassessment prevents importing the superseded MED25 neuropathy attribution into this developmental syndrome.

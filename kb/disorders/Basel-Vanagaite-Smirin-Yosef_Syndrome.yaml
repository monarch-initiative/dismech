diagnosis:
- name: Molecular diagnosis and parental segregation
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Exome or genome sequencing can identify biallelic MED25 candidates, followed by confirmation and parental segregation. Variant interpretation must distinguish uncertain missense alleles from functionally supported variants; a VUS is not independently diagnostic.
  evidence:
  - reference: PMID:31602195
    reference_title: 'Report of a Second Lebanese Family with Basel-Vanagaite-Smirin-Yosef Syndrome: Possible Founder Mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Direct sequencing of the MED25 gene in both affected sibs confirmed the presence of the variant in a homozygous state (Fig. 2).
    explanation: Molecular confirmation was used in the affected siblings.
  - reference: PMID:42663018
    reference_title: '[Clinical phenotype and genetic analysis of a child with Basel-Vanagaite-Smirin-Yosef syndrome due to variant of MED25 gene].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The c.394C>G (p.Arg132Gly) variant resulted in an amino acid substitution and was predicted to be deleterious by in silico analysis. Based on the ACMG criteria (PM2_Supporting+PMS+PP3), it was classified as a variant of uncertain significance.
    explanation: The abstract explicitly retains VUS status. The printed criterion string is quoted as reported, not endorsed as an independent ACMG reassessment.
- name: EEG characterization of suspected seizures
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  description: EEG can characterize focal, generalized, and photosensitive discharges and help distinguish epileptic events from behavioral episodes. Laughter or staring alone does not establish a seizure diagnosis.
  evidence:
  - reference: PMID:40990994
    reference_title: Epilepsy due to a MED25 Homozygous Pathogenic Founder Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Other event types included staring spells and laughing spells that were deemed nonepileptic (behavioral) because of lack of ictal correlate on the EEG.
    explanation: The N1 evaluation explicitly distinguishes nonepileptic spells from seizures.
- name: Brain MRI assessment
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Brain MRI documents variable cortical, callosal, ventricular, and white matter findings. A normal scan does not exclude the disorder.
  evidence:
  - reference: PMID:40990994
    reference_title: Epilepsy due to a MED25 Homozygous Pathogenic Founder Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Magnetic response imaging (MRI) of the brain performed at 2 months of age was normal.
    explanation: Patient N1 had a normal early brain MRI despite the clinical and molecular diagnosis.
  - reference: PMID:40909439
    reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Additionally, there was bilateral hippocampal volume loss with widening of the temporal horns, and the cavum septum pellucidum was present (Figure 1C).
    explanation: The later case illustrates an abnormal MRI phenotype.
- name: Ophthalmological assessment
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: Assessment characterizes cataracts and other ocular findings. Normal ophthalmological examination has been documented in affected individuals.
  evidence:
  - reference: PMID:31602195
    reference_title: 'Report of a Second Lebanese Family with Basel-Vanagaite-Smirin-Yosef Syndrome: Possible Founder Mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Ophthalmological examination, brainstem auditory evoked response, and brain MRI were normal (Table 1).
    explanation: The affected boy had a normal eye examination, illustrating variable ocular involvement.

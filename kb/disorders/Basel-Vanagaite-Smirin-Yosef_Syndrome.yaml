name: Basel-Vanagaite-Smirin-Yosef Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- BVSYS
- MED25-related intellectual disability syndrome
- Eye-intellectual disability syndrome
- MED25-related multiple congenital anomalies-intellectual disability syndrome
description: >
  Basel-Vanagaite-Smirin-Yosef syndrome (BVSYS) is a rare autosomal recessive
  neurodevelopmental disorder caused by biallelic variants in MED25, which encodes a subunit
  of the tail module of the Mediator transcriptional coactivator complex. Founder missense
  alleles (p.Tyr39Cys; p.Ile173Thr) located in the von Willebrand factor type A (VWA) domain
  impair MED25 incorporation into the Mediator complex. The syndrome is characterized by severe
  intellectual disability with eye anomalies (cataract, microcornea, coloboma), brain anomalies
  (including polymicrogyria), cardiac and palatal anomalies, microcephaly, growth retardation,
  hypotonia, and seizures. Because MED25 acts in the constitutive tail module rather than the
  dissociable kinase module, BVSYS is one of the recessive "core-module" MEDopathies. Note: the
  historical MED25-CMT2B2 (axonal Charcot-Marie-Tooth) association has been formally reassigned
  to PNKP and is not part of this entry.

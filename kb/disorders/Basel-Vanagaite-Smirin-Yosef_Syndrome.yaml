prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: Population prevalence is unknown. Published reports describe small, sometimes overlapping families and case series. Their patient counts should not be treated as population prevalence estimates or pooled without checking overlap.
  evidence:
  - reference: PMID:25792360
    reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Using exome sequencing, we have been able to identify homozygous mutation p.(Tyr39Cys) in MED25 as the cause of a syndrome characterized by eye, brain, cardiac and palatal abnormalities as well as growth retardation, microcephaly and severe intellectual disability in seven patients from four unrelated families, all originating from the same village.
    explanation: The defining clinical series establishes the association between biallelic MED25 variation and a multisystem developmental syndrome; it does not measure the cellular pathway to each manifestation.
pathophysiology:
- name: Biallelic MED25 dysfunction
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  description: Homozygous and compound heterozygous MED25 variants are associated with a variable developmental syndrome. Both missense and truncating alleles have been described, and splice defects have been demonstrated for particular intronic variants. Functional consequences and the strength of pathogenicity evidence differ between alleles.
  evidence:
  - reference: PMID:25792360
    reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Using exome sequencing, we have been able to identify homozygous mutation p.(Tyr39Cys) in MED25 as the cause of a syndrome characterized by eye, brain, cardiac and palatal abnormalities as well as growth retardation, microcephaly and severe intellectual disability in seven patients from four unrelated families, all originating from the same village.
    explanation: The defining clinical series establishes the association between biallelic MED25 variation and a multisystem developmental syndrome; it does not measure the cellular pathway to each manifestation.
  - reference: PMID:32816121
    reference_title: 'Improving the phenotype description of Basel-Vanagaite-Smirin-Yosef syndrome, MED25-related: polymicrogyria as a distinctive neuroradiological finding.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Whole exome sequencing detected a homozygous frameshift variant in the MED25 gene: NM_030973.3:c.1778_1779delAG, p.(Gln593Argfs).'
    explanation: The reported homozygous frameshift extends the allelic spectrum beyond VWA-domain missense variants.
  downstream:
  - target: MED25 Mediator incorporation failure
    causal_link_type: DIRECT
    description: The Tyr39Cys allele reduces association with Mediator in the tested overexpression system.
    evidence:
    - reference: PMID:25792360
      reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The MED25 point mutation is located in the von Willebrand factor type A (MED25 VWA) domain which is responsible for MED25 recruitment into the Mediator complex; co-immunoprecipitation experiment demonstrated that this mutation dramatically impairs MED25 interaction with the Mediator complex in mammalian cells.
      explanation: The recruitment defect was demonstrated for Tyr39Cys; it has not been established experimentally for every reported MED25 allele.
  - target: Abnormal MED25 pre-mRNA splicing
    causal_link_type: DIRECT
    description: Specific splice-region alleles alter MED25 RNA processing; this is not a demonstrated consequence of all missense alleles.
    evidence:
    - reference: PMID:40909439
      reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: 'In vitro MSA results indicated that the variant c.670C > G (p.R224G) did not disrupt the normal splicing of the MED25 gene (Supplementary Figure S3). In contrast, the variant c.1965 + 1dup affected normal splicing, resulting in two abnormal transcripts: retention of 1 bp in intron 16; skipping of exon 16 (Figure 2).'
      explanation: Minigenes in HEK293T and HeLa cells distinguish an experimentally demonstrated splice defect from the normal splicing of the missense allele.

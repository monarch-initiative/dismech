prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. The defining cohort comprised seven patients from four unrelated families;
    additional Lebanese and other families have since been reported (~22 patients total).
    No population-based prevalence estimate is available.
  evidence:
  - reference: PMID:25792360
    reference_title: "Homozygous MED25 mutation implicated in eye-intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in seven patients from four unrelated families, all originating from the same village."
    explanation: Documents the founder-population defining cohort size establishing BVSYS as ultra-rare.
pathophysiology:
- name: MED25 Mediator incorporation failure
  description: >
    MED25 is a subunit of the tail module of the Mediator complex. The disease-causing
    missense variants sit in the von Willebrand factor type A (VWA) domain responsible for
    MED25 recruitment into Mediator; co-immunoprecipitation shows the founder allele
    dramatically impairs MED25 interaction with the complex, disrupting Mediator-dependent
    transcription of developmental gene-expression programs.
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:25792360
    reference_title: "Homozygous MED25 mutation implicated in eye-intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "co-immunoprecipitation experiment demonstrated that this mutation dramatically impairs MED25 interaction with the Mediator complex in mammalian cells."
    explanation: Functional evidence that the MED25 founder allele impairs incorporation into Mediator.
  - reference: PMID:25792360
    reference_title: "Homozygous MED25 mutation implicated in eye-intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The MED25 point mutation is located in the von Willebrand factor type A (MED25 VWA) domain which is responsible for MED25 recruitment into the Mediator complex"
    explanation: Localizes the pathogenic variant to the domain mediating MED25 assembly into the complex.
  downstream:
  - target: Neurodevelopmental and multisystem developmental dysregulation
    description: >-
      Impaired MED25 incorporation disrupts Mediator-dependent transcription across
      neurodevelopmental, ocular, cardiac, and craniofacial developmental programs.
- name: Neurodevelopmental and multisystem developmental dysregulation
  description: >
    Downstream of MED25 Mediator-incorporation failure, developmental gene-expression programs
    are dysregulated across multiple systems, producing severe intellectual disability,
    microcephaly, eye anomalies (cataract, microcornea, coloboma), brain anomalies (including
    polymicrogyria), cardiac and palatal anomalies, and growth retardation.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: DYSREGULATED
  - preferred_term: eye development
    term:
      id: GO:0001654
      label: eye development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:25792360
    reference_title: "Homozygous MED25 mutation implicated in eye-intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a syndrome characterized by eye, brain, cardiac and palatal abnormalities as well as growth retardation, microcephaly and severe intellectual disability"
    explanation: Documents the multisystem developmental phenotype downstream of MED25 dysfunction.
  downstream:
  - target: Severe intellectual disability
    description: Disrupted neuronal developmental programs contribute to severe intellectual disability.
  - target: Microcephaly
    description: Disrupted brain-growth programs contribute to microcephaly.
  - target: Eye abnormalities
    description: Disrupted ocular developmental programs contribute to cataract, microcornea, and coloboma.
  - target: Congenital heart defects
    description: Disrupted cardiac developmental programs contribute to congenital heart defects.
  - target: Growth retardation
    description: Disrupted growth-related transcriptional programs contribute to growth retardation.

- name: MED25 minigene splice assays in HEK293T and HeLa cells
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Established HEK293T and HeLa cell lines
  culture_system: Wild-type and mutant minigene transfection followed by RT-PCR and sequencing
  publication: PMID:40909439
  description: The c.1965+1dup construct produces intron retention and exon skipping, whereas c.670C>G does not disrupt splicing in the tested constructs.
  evidence:
  - reference: PMID:40909439
    reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: 'In vitro MSA results indicated that the variant c.670C > G (p.R224G) did not disrupt the normal splicing of the MED25 gene (Supplementary Figure S3). In contrast, the variant c.1965 + 1dup affected normal splicing, resulting in two abnormal transcripts: retention of 1 bp in intron 16; skipping of exon 16 (Figure 2).'
    explanation: Minigenes in HEK293T and HeLa cells distinguish an experimentally demonstrated splice defect from the normal splicing of the missense allele.
  - reference: PMID:40909439
    reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The successfully constructed wild-type/mutant recombinant minigene were transfected into Hela or HEK293T cells.
    explanation: The assay uses transfected cell lines rather than patient-derived neurons.

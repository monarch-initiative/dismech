- name: MED25 Mediator incorporation failure
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  description: The VWA-domain Tyr39Cys substitution impairs association of MED25 with Mediator. The experiment compared tagged wild-type and mutant MED25 expressed in 293-HEK cells, with comparable production and immunoprecipitation efficiency. It does not demonstrate loss of the entire Mediator complex or a shared incorporation defect for all disease-associated alleles.
  evidence:
  - reference: PMID:25792360
    reference_title: Homozygous MED25 mutation implicated in eye-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The MED25 point mutation is located in the von Willebrand factor type A (MED25 VWA) domain which is responsible for MED25 recruitment into the Mediator complex; co-immunoprecipitation experiment demonstrated that this mutation dramatically impairs MED25 interaction with the Mediator complex in mammalian cells.
    explanation: The recruitment defect was demonstrated for Tyr39Cys; it has not been established experimentally for every reported MED25 allele.
  - reference: url:https://link.springer.com/article/10.1007/s00439-015-1541-x/figures/4
    reference_title: Figure 4 | Homozygous MED25 mutation implicated in eye–intellectual disability syndrome | Human Genetics | Springer Nature Link
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: mutation impaired Mediator recruitment. WT or YC mutated Flag-NLS-MED25 was expressed in 293-HEK cells.
    explanation: The figure caption identifies this as the Y39C MED25 experiment and specifies the tested cell system.
  - reference: url:https://link.springer.com/article/10.1007/s00439-015-1541-x/figures/4
    reference_title: Figure 4 | Homozygous MED25 mutation implicated in eye–intellectual disability syndrome | Human Genetics | Springer Nature Link
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Anti-Flag detection was also performed to assess precipitation efficiency and comparable WT and YC MED25 production levels
    explanation: Comparable tagged-protein production and precipitation controls support an incorporation defect rather than simply absent expression.
- name: Abnormal MED25 pre-mRNA splicing
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  description: The c.1965+1dup allele generates intron-16 one-base retention and exon-16 skipping in minigene assays. Carrier-mother blood RNA contains the one-base-retention product alongside normally spliced transcript; exon skipping was not demonstrated in that blood experiment. Altered protein products are predicted consequences, whereas neuronal protein abundance and Mediator assembly were not measured. Arg224Gly did not alter splicing in the tested constructs. A separate 2026 report describes intron-2 retention associated with c.180+5G>C.
  evidence:
  - reference: PMID:40909439
    reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: 'In vitro MSA results indicated that the variant c.670C > G (p.R224G) did not disrupt the normal splicing of the MED25 gene (Supplementary Figure S3). In contrast, the variant c.1965 + 1dup affected normal splicing, resulting in two abnormal transcripts: retention of 1 bp in intron 16; skipping of exon 16 (Figure 2).'
    explanation: Minigenes in HEK293T and HeLa cells distinguish an experimentally demonstrated splice defect from the normal splicing of the missense allele.
  - reference: PMID:40909439
    reference_title: Unraveling the pathogenicity role of the novel compound heterozygous mutations of MED25 gene in a Chinese patient with BVSYS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Using the proband’s father’s sample as a control, we assessed the impact of the mutation on MED25 mRNA splicing in the mother’s blood sample. The results indicated that the mutation c.1965 + 1dup affects the splicing of the MED25 gene in vivo, producing only one abnormal splicing product, a 1 bp retention at the left side of intron 16.
    explanation: Carrier-parent blood RNA supports intron retention, but not the exon-skipping product observed in minigenes. These are blood assays, not neuronal or whole-animal experiments.
  - reference: PMID:42663018
    reference_title: '[Clinical phenotype and genetic analysis of a child with Basel-Vanagaite-Smirin-Yosef syndrome due to variant of MED25 gene].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Transcriptome sequencing confirmed that the c.180+5G>C variant may cause aberrant splicing with retention of intron 2.
    explanation: The abstract reports RNA evidence of intron retention; the tissue and detailed assay performance cannot be established from this abstract.
- name: Reduced SOX9-dependent cartilage matrix transcription
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  description: Med25 supports Sox9-dependent cartilage matrix transcription in mouse cell systems. Wwp2 facilitates Sox9–Med25 association, and Med25 depletion reduces Col2a1 expression. Together with zebrafish palatal abnormalities after med25 knockdown, these experiments suggest a possible route to human palatal anomalies. A defect in this pathway has not been demonstrated for BVSYS patient variants or patient palatal tissue.
  evidence:
  - reference: PMID:21427722
    reference_title: Wwp2 is essential for palatogenesis mediated by the interaction between Sox9 and mediator subunit 25.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Knockdown of either Wwp2 or Med25 in C3H10T1/2 cells resulted in significant downregulation of Col2a1 transcripts (Fig. 5b,c).
    explanation: Med25 depletion reduces a cartilage matrix transcript in mouse mesenchymal cells; this is not a patient-allele experiment.
  - reference: PMID:21427722
    reference_title: Wwp2 is essential for palatogenesis mediated by the interaction between Sox9 and mediator subunit 25.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Importantly, knockdown of Wwp2 in ATDC5 cells attenuated the physical interaction between endogenous Sox9 and HA-tagged Med25 (Fig. 5g).
    explanation: The chondrogenic cell assay supports Wwp2-dependent Sox9–Med25 association.
  - reference: PMID:21427722
    reference_title: Wwp2 is essential for palatogenesis mediated by the interaction between Sox9 and mediator subunit 25.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Intriguingly, morpholino-mediated knockdown of med25 in zebrafish resulted in palatal malformation (Fig. 4d), which closely resembled the palatal phenotype of wwp2 or sox9 mutants23 (Fig. 2f).
    explanation: Transient zebrafish med25 depletion affects palatal cartilage; neither a stable mutation nor a human disease allele was tested.
  downstream:

- name: Med25-null mouse
  species: Mus musculus
  genotype: Med25−/−
  background: C57BL/6N
  genes:
  - preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  category: Knockout
  publication: PMID:36551904
  description: Homozygous Med25-null embryos show variable craniofacial and brain abnormalities at E12.5–E15.5, including anophthalmia, telencephalon hypoplasia, facial clefts, cyclopia, and exencephaly. Perinatal lethality was observed in the E18.5 viability assessment.
  evidence:
  - reference: PMID:36551904
    reference_title: Large-Scale Functional Assessment of Genes Involved in Rare Diseases with Intellectual Disabilities Unravels Unique Developmental and Behaviour Profiles in Mouse Models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Gross morphological analysis of Med25−/− mutants at E12.5 and E15.5 revealed different ranges of abnormalities including anophthalmia
    explanation: The Med25-null embryos underwent direct anatomical assessment; the study’s adult behavioral findings from other lines cannot be assigned to Med25.
  - reference: PMID:36551904
    reference_title: Large-Scale Functional Assessment of Genes Involved in Rare Diseases with Intellectual Disabilities Unravels Unique Developmental and Behaviour Profiles in Mouse Models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: hypoplasia of the telencephalon (three out of twelve mice) (Figure S4, panel D), rhinocephaly with cyclopia (one out of twelve mice) (Figure S4, panels K, H), proboscis (one out of twelve mice) (Figure S4, panel G), facial clefts (two out of twelve mice) (Figure S4, panel E) and exencephaly (three out of twelve mice) (Figure S4, panels G, J).
    explanation: The reported abnormalities are variable within the 12 Med25-null embryos; these proportions are model observations, not human phenotype frequencies.

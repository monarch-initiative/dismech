    (fourth-ventricular) tumors additionally produce cerebellar signs.
  evidence:
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with choroid plexus papillomas often present with communicating hydrocephalus secondary to cerebrospinal fluid overproduction."
    explanation: Establishes hydrocephalus as the dominant clinical presentation of
      choroid plexus tumors.
  downstream:

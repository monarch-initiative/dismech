      choroid plexus carcinoma development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to MCCs in the CP epithelia, CPCs in humans are characterized by solitary cilia, frequent TP53 mutations, and disturbances to multiciliogenesis program directed by the GMNC-MCIDAS transcriptional network."
    explanation: Human tumor observation of the loss of multiciliation and the associated
      transcriptional program.

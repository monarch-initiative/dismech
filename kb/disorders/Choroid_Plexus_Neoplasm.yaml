phenotypes:
- category: Clinical
  name: Hydrocephalus
  phenotype_term:
    preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  frequency: FREQUENT
  diagnostic: true
  description: >-
    The dominant presenting feature across the family. It arises by two distinct routes
    - cerebrospinal fluid overproduction by the secretory tumor epithelium (classically
    communicating) and obstruction of the cerebrospinal fluid pathways by mass effect -
    and both may operate in the same patient.
  evidence:
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with choroid plexus papillomas often present with communicating hydrocephalus secondary to cerebrospinal fluid overproduction."
    explanation: Supports hydrocephalus as the characteristic presentation and names the
      overproduction route.
  - reference: PMID:7414480
    reference_title: "Choroid plexus papilloma: hydrocephalus and cerebrospinal fluid dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hydrocephalus was due solely to obstruction of the fourth ventricle."
    explanation: Supports the obstructive route as an independent cause of the same
      phenotype.
  - reference: PMID:34754533
    reference_title: "Persistence of communicating hydrocephalus post choroid plexus tumor resection: Case reports and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydrocephalus is the most common presentation of choroid plexus tumors; it is thought to be caused either by mass effect obstructing the cerebrospinal fluid pathways or secretory properties of the tumor."
    explanation: States the dual mechanism explicitly - obstruction by mass effect OR
      secretory overproduction - which is why this entry models them as two nodes.
- category: Clinical
  name: Increased intracranial pressure
  phenotype_term:
    preferred_term: Increased intracranial pressure
    term:
      id: HP:0002516
      label: Increased intracranial pressure
  frequency: FREQUENT
  description: >-
    Expansion of the cerebrospinal fluid compartment raises intracranial pressure, which
    drives the headache, vomiting, papilledema and (in infants) fontanelle and
    head-circumference signs.
  evidence:
  - reference: PMID:1022421
    reference_title: "Choroid plexus papilloma. I. Proof of cerebrospinal fluid overproduction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas these data are regarded as conclusive evidence of CSF overproduction by a choroid plexus papilloma, the pathogenesis of generalized ventricular enlargement in this case was due to part to obstruction of the subarachnoid pathways."
    explanation: Documents the generalized ventricular enlargement from which raised
      intracranial pressure follows; the abstract does not report a pressure measurement,
      so support is partial.
  - reference: PMID:21121734
    reference_title: Treatment of third ventricular choroid plexus papilloma in an
      infant with embolization alone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was found to have an enlarged head circumference, a full and tense fontanel, splayed sutures, and forced downward gaze."
    explanation: The classical infant sign cluster of raised intracranial pressure -
      head expansion, tense fontanelle, sutural diastasis and the setting-sun sign - in a
      child with a choroid plexus papilloma.
- category: Clinical
  name: Macrocephaly
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  frequency: FREQUENT
  description: >-
    In infants with unfused cranial sutures, chronic hydrocephalus expands the calvarium
    and produces an abnormally large head circumference. Because the incidence peak is
    in the first year of life, this is a common mode of presentation.
  evidence:
  - reference: PMID:21121734
    reference_title: Treatment of third ventricular choroid plexus papilloma in an

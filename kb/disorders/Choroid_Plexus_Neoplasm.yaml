genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  association: >-
    Germline pathogenic TP53 variants cause Li-Fraumeni syndrome / heritable
    TP53-related cancer syndrome, of which choroid plexus carcinoma is a sentinel tumor.
    In the landmark multi-institutional series, every patient with a germline TP53
    mutation fulfilled Li-Fraumeni criteria and every patient not meeting those criteria
    had wild-type TP53. Roughly a third of choroid plexus carcinomas occur in the
    setting of Li-Fraumeni syndrome. Cross-reference
    kb/disorders/Li-Fraumeni_Syndrome.yaml.
  frequency: >-
    Reported estimates range widely with cohort and ascertainment: approximately 36% in
    a 10-study narrative review, and 4 of 13 patients in the prospective SJYC07 cohort
    were germline carriers. Li-Fraumeni guideline sources quote higher fractions in
    children. Treat any single point estimate as cohort-dependent.
  notes: >-
    Because a tumor-only TP53 result cannot distinguish germline from somatic origin,
    paired germline testing with genetic counselling is indicated in essentially every
    choroid plexus carcinoma, irrespective of family history, and must precede treatment
    planning because it changes radiotherapy and genotoxic-chemotherapy decisions.
  evidence:
  - reference: PMID:20308654
    reference_title: TP53 alterations determine clinical subgroups and survival of
      patients with choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals with germline TP53 mutations fulfilled LFS criteria, whereas all patients not meeting these criteria harbored wild-type TP53 (P < .001)."
    explanation: Establishes the tight correspondence between germline TP53 mutation and
      Li-Fraumeni syndrome in this tumor.
  - reference: PMID:20308654
    reference_title: TP53 alterations determine clinical subgroups and survival of
      patients with choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroid plexus carcinomas are pediatric tumors with poor survival rates and a strong, but poorly understood, association with Li-Fraumeni syndrome (LFS)."
    explanation: States the sentinel-cancer relationship between choroid plexus carcinoma
      and Li-Fraumeni syndrome.
  - reference: PMID:38316675
    reference_title: "Correlation between choroid plexus carcinoma and Li-Fraumeni syndrome: implications of TP53 mutations and management strategies-a case-based narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The review highlighted the strong association (36%) between CPCs and LFS, primarily due to TP53 germline mutations."
    explanation: Quantifies the proportion of choroid plexus carcinomas arising in
      Li-Fraumeni syndrome.
  - reference: PMID:33506206
    reference_title: "Outcome and molecular analysis of young children with choroid plexus carcinoma treated with non-myeloablative therapy: results from the SJYC07 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients had TP53-mutant tumors, including 4 who were germline carriers."
    explanation: Prospective-trial evidence for the germline carrier fraction.
  - reference: PMID:36963804
    reference_title: Genomic profile of two Brazilian choroid plexus tumors by whole-exome
      sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CPC tumor had only a pathogenic germline TP53 variant, based on American College of Medical Genetics (ACMG) criteria, with a clinical and familiar history of Li-Fraumeni syndrome."
    explanation: Worked case demonstrating germline TP53 as the sole pathogenic finding
      in a Li-Fraumeni-associated carcinoma.
- name: TP53 (somatic)
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: PRESENT
  association: >-
    Somatic TP53 mutation is the only recurrent somatic driver in pediatric choroid
    plexus tumors and is the dominant prognostic axis in carcinoma - TP53-wild-type
    carcinomas have markedly better survival than TP53-mutant carcinomas, and a greater
    number of mutant TP53 copies confers worse outcome still.
  frequency: >-
    About 50% of choroid plexus carcinomas by immunohistochemistry/sequencing; 15% of
    the whole choroid plexus tumor family (7/47) in an unselected molecular series.
  subtype: CPC
  evidence:
  - reference: PMID:33506206
    reference_title: "Outcome and molecular analysis of young children with choroid plexus carcinoma treated with non-myeloablative therapy: results from the SJYC07 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with TP53-wild-type tumors had a 5-year PFS of 100% as compared to 28.6 ± 17.1% for TP53-mutant tumors (P = .012)."
    explanation: The strongest prospective statement of the TP53 prognostic axis, and of
      the markedly better survival of TP53-wild-type carcinoma.
  - reference: PMID:33506206
    reference_title: "Outcome and molecular analysis of young children with choroid plexus carcinoma treated with non-myeloablative therapy: results from the SJYC07 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53-mutational status was the only significant prognostic variable and should form the basis of risk-stratification in future trials."
    explanation: Establishes TP53 status as the dominant prognostic variable.
  - reference: PMID:20308654
    reference_title: TP53 alterations determine clinical subgroups and survival of
      patients with choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five-year survival rates for patients with TP53-immunopositive and -immunonegative CPCs were 0% and 82 (+/- 9%), respectively (P < .001)."
    explanation: Independent, earlier demonstration of the same survival split by TP53
      status.
  - reference: PMID:25336695
    reference_title: Molecular characterization of choroid plexus tumors reveals novel
      clinically relevant subgroups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigating the number of mutated copies of p53 per sample revealed a high-risk group of patients with CPC carrying two copies of mutant p53, who exhibited poor 5-year event-free (EFS) and overall survival (OS) compared with patients with CPC carrying one copy of mutant p53"
    explanation: Refines the prognostic axis to mutant-allele dosage.
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES and targeted sequencing showed TP53 mutations in 7/47 CPTs (15%), five of which were children."
    explanation: Frequency of TP53 mutation across the unselected choroid plexus tumor
      family.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: PRESENT
  association: >-
    TERT promoter mutation is an adult-specific somatic alteration in choroid plexus
    tumors, found in a quarter of adult patients and associated with shorter
    progression-free survival. It is not a germline predisposition and is not seen in
    the pediatric-dominant subgroups.
  frequency: 7 of 28 adult patients (25%)
  evidence:
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the contrary, TERT promoter mutations were encountered in 7/28 adult patients (25%) and associated with shorter progression-free survival (log-rank test, p=0.015)."
    explanation: Establishes the frequency and prognostic significance of TERT promoter
      mutation in adult choroid plexus tumors.
inheritance:
- name: Autosomal dominant (Li-Fraumeni-associated cases)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Sporadic choroid plexus tumors are not inherited. The predisposition that matters
    clinically is autosomal dominant heritable TP53-related cancer (Li-Fraumeni)
    syndrome, with variable, age-dependent penetrance. De novo germline TP53 variants
    occur, so absence of a family history does not exclude the syndrome.
  evidence:
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "germline TP53 alterations are often identified among children with cancers, in particular soft-tissue sarcomas, adrenocortical carcinomas, central nervous system tumours, or among adult females with early breast cancers, without familial history"
    explanation: Supports that germline TP53 predisposition is frequently found in
      children with central nervous system tumors even absent a family history.
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the penetrance of germline disease-causing TP53 variants is variable, depending both on the type of variant (dominant-negative variants being associated with a higher cancer risk) and on modifying factors"
    explanation: Supports the variable penetrance qualifier.
environmental:
- name: Simian virus 40 (SV40) exposure
  exposure_term:
    preferred_term: viral exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  presence: ABSENT
  description: >-
    An aetiological role for SV40 in choroid plexus tumors was proposed historically on
    the basis of SV40 DNA sequences detected in tumor tissue and of SV40 large T antigen
    driving choroid plexus tumors in transgenic mice, and was linked to the accidental
    SV40 contamination of early poliovirus vaccine. This entry treats the claim as
    contested and, on current evidence, largely discounted rather than established: a
    nationwide Danish cohort of 69.5 million person-years found no excess of choroid
    plexus tumor in the vaccine-exposed birth cohorts, and immunohistochemistry for SV40
    large T antigen was negative in all of 82 central nervous system tumors including
    choroid plexus lesions. The entry therefore asserts neither causation nor definitive
    exclusion; it records that the epidemiological and protein-level evidence does not
    support SV40 as a cause.
  notes: >-
    `presence: ABSENT` is the closest available schema value for "exposure examined and
    found not to be associated"; the enum has no NOT_ASSOCIATED value, and `effect:` is
    deliberately left unset because neither a causal nor a protective label is correct.
    Read the description and the REFUTE-tagged evidence, not the enum, for the intended
    claim. The residual uncertainty is that the negative studies address vaccine-era
    population exposure and large T antigen protein detection, not every proposed SV40
    mechanism.
  evidence:
  - reference: PMID:12671021
    reference_title: Cancer incidence in Denmark following exposure to poliovirus vaccine
      contaminated with simian virus 40.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, SV40 exposure was not associated with increased incidence of mesothelioma, ependymoma, choroid plexus tumor, or non-Hodgkin's lymphoma."
    explanation: Population-level refutation of an SV40 contribution to choroid plexus
      tumor incidence.
  - reference: PMID:12671021
    reference_title: Cancer incidence in Denmark following exposure to poliovirus vaccine
      contaminated with simian virus 40.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SV40 DNA sequences have been detected in several human malignancies, including mesothelioma, ependymoma, choroid plexus tumors, and non-Hodgkin's lymphoma."
    explanation: Records the historical basis of the SV40 hypothesis that the same study
      set out to test.
  - reference: PMID:15790713
    reference_title: Immunodetection of SV40 large T antigen in human central nervous
      system tumours.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the tumours (20 ependymomas, 20 glioblastomas, 12 oligodendrogliomas, three plexus choroid adenomas, two plexus choroid carcinomas, 15 meningiomas, and 10 medulloblastomas) contained SV40 Tag positive cells."
    explanation: Protein-level failure to detect the SV40 oncoprotein in choroid plexus
      tumors.
  - reference: PMID:15790713
    reference_title: Immunodetection of SV40 large T antigen in human central nervous
      system tumours.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of SV40 Tag in 82 CNS tumours of various types is at variance with previous studies from different countries, and suggests that the virus may not be an important factor in CNS tumorigenesis, at least in French cases."
    explanation: The authors' own framing of the result as contradicting the earlier
      positive reports, which is why this entry treats the question as contested rather
      than settled in either direction.
treatments:
- name: Maximal Safe Surgical Resection
  action_category: THERAPEUTIC
  description: >-
    Gross total resection is the cornerstone of treatment for every grade and, in
    carcinoma, the strongest modifiable prognostic factor; in papilloma and atypical
    papilloma the same population data show no overall survival difference between
    gross total and subtotal resection. In grade 1 papilloma it is frequently
    curative and needs no adjuvant therapy; in carcinoma it is independently associated
    with improved overall survival. Planning must account for the extreme vascularity of
    these tumors and the small circulating blood volume of infants, and staged or
    second-look surgery is often used.
  treatment_term:
    preferred_term: Gross Total Resection
    term:
      id: NCIT:C131672
      label: Gross Total Resection
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Cerebrospinal Fluid Overproduction by Secretory Tumour Epithelium
    treatment_effect: INHIBITS
    description: >-
      Removing the secretory tumor epithelium directly abolishes the excess
      cerebrospinal fluid production, as demonstrated by the fivefold fall in formation
      rate after resection.
    evidence:
    - reference: PMID:1022421
      reference_title: "Choroid plexus papilloma. I. Proof of cerebrospinal fluid overproduction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Postoperatively, the CSF formation rate was reduced fivefold to 0.20 +/- SD 0.01 ml/min (288 ml/day)."
      explanation: Measured fall in cerebrospinal fluid formation rate after tumor
        resection, directly evidencing the treatment-mechanism link.
  evidence:
  - reference: PMID:28939225
    reference_title: "Effect of Surgery, Adjuvant Therapy, and Other Prognostic Factors on Choroid Plexus Carcinoma: A Systematic Review and Individual Patient Data Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients should undergo maximal safe resection, because GTR is associated with improved survival."
    explanation: Pooled individual-patient-data recommendation establishing gross total
      resection as the key modifiable prognostic factor.
  - reference: PMID:38339361
    reference_title: "Prognostic Factors and Nomogram for Choroid Plexus Tumors: A Population-Based Retrospective Surveillance, Epidemiology, and End Results Database Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meanwhile, in patients with CPC, gross total resection (GTR) was associated with significantly better OS than subtotal resection (STR) only."
    explanation: Population-level confirmation for carcinoma.
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prognosis of these benign neoplasms is favorable, and gross total resection is frequently curative."
    explanation: Establishes the curative role of resection alone in grade 1 disease.
  - reference: PMID:1022421
    reference_title: "Choroid plexus papilloma. I. Proof of cerebrospinal fluid overproduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postoperatively, the CSF formation rate was reduced fivefold to 0.20 +/- SD 0.01 ml/min (288 ml/day)."
    explanation: Direct measurement showing that resection reverses the overproduction
      mechanism.
- name: Observation After Complete Resection
  action_category: MONITORING
  description: >-
    Following complete resection of a grade 1 papilloma - and, in most protocols, of a
    completely resected atypical papilloma - patients are observed with serial MRI
    rather than treated with adjuvant therapy. Population data show no overall survival
    difference between gross total and subtotal resection in papilloma or atypical
    papilloma, supporting a conservative posture in these grades.
  treatment_term:
    preferred_term: Follow-up Examination After Treatment for Malignant Neoplasm
    term:
      id: NCIT:C171209
      label: Follow-up Examination After Treatment for Malignant Neoplasm
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:19543851
    reference_title: "Atypical choroid plexus papilloma: clinical experience in the CPT-SIOP-2000 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After surgery, patients who had undergone complete resection were observed, whereas patients with incompletely resected or metastasized APP were treated with six chemotherapy courses"
    explanation: Protocol evidence for observation after complete resection in atypical
      papilloma.
  - reference: PMID:38339361
    reference_title: "Prognostic Factors and Nomogram for Choroid Plexus Tumors: A Population-Based Retrospective Surveillance, Epidemiology, and End Results Database Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, there is no difference in OS with GTR vs. STR in CPP or aCPP."
    explanation: Supports a less aggressive posture in the two lower grades.
- name: Carboplatin-Etoposide-Vincristine (CarbEV) Chemotherapy
  action_category: THERAPEUTIC
  description: >-
    Multi-agent chemotherapy for high-risk disease - carcinoma, incompletely resected
    atypical papilloma, and any metastatic choroid plexus tumor. In the randomised
    high-risk arm of CPT-SIOP-2000, carboplatin/etoposide/vincristine was superior to
    cyclophosphamide/etoposide/vincristine for progression-free survival.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Choroid Plexus Epithelial Neoplastic Proliferation
    treatment_effect: INHIBITS
    description: Cytotoxic chemotherapy targets the proliferating tumor epithelium.
    evidence:
    - reference: PMID:19543851
      reference_title: "Atypical choroid plexus papilloma: clinical experience in the CPT-SIOP-2000 study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All nine APP patients who received postoperative chemotherapy showed an early response after two cycles: two had complete remission, four had partial response, and three had stable disease."
      explanation: Radiographic tumor response to the chemotherapy backbone evidences
        that it acts on the proliferating tumor mass.
  evidence:
  - reference: PMID:34997889
    reference_title: Final results of the Choroid Plexus Tumor study CPT-SIOP-2000.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For randomized CPC, the 5/10 year progression free survival (PFS) of patients on CarbEV (n = 20) were 62%/47%, respectively, compared to 27%/18%, on CycEV (n = 15), (intention-to-treat, HR 2.6, p = 0.032)."
    explanation: Randomised evidence that the carboplatin-containing backbone is superior
      in high-risk disease.
  - reference: PMID:19543851
    reference_title: "Atypical choroid plexus papilloma: clinical experience in the CPT-SIOP-2000 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nine APP patients who received postoperative chemotherapy showed an early response after two cycles: two had complete remission, four had partial response, and three had stable disease."
    explanation: Demonstrates chemosensitivity of atypical papilloma treated on the same
      protocol.
- name: Neoadjuvant ICE Chemotherapy Before Second-Look Surgery
  action_category: THERAPEUTIC
  description: >-
    Ifosfamide/carboplatin/etoposide given before a planned second operation
    devascularises the tumor and reduces intraoperative blood loss, raising the rate of
    complete or near-complete resection in carcinoma - a strategy that directly
    addresses the vascularity that limits primary resection in infants.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: ifosfamide
      term:
        id: CHEBI:5864
        label: ifosfamide
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:20515336
    reference_title: "Use of ifosfamide, carboplatin, and etoposide chemotherapy in choroid plexus carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this experience, second surgery following neoadjuvant ICE chemotherapy led to a high rate of complete or near-complete resection."
    explanation: Supports the neoadjuvant-then-resect strategy and its surgical benefit.
  - reference: PMID:20515336
    reference_title: "Use of ifosfamide, carboplatin, and etoposide chemotherapy in choroid plexus carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chemotherapy appears to facilitate second-look surgery, in particular through a reduction of intraoperative blood loss."
    explanation: Names the mechanism by which neoadjuvant chemotherapy improves
      resectability.
- name: Risk-Adapted Radiotherapy
  action_category: THERAPEUTIC
  description: >-
    Radiotherapy is used selectively and is generally withheld in children under three
    years. Focal fields are used for non-metastatic carcinoma and incompletely resected
    atypical papilloma; craniospinal fields are reserved for metastatic or
    non-responsive disease. Radiotherapy must be avoided or minimised where feasible in
    germline TP53 carriers because it contributes to subsequent primary tumours - which
    is why germline testing precedes treatment planning.
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  evidence:
  - reference: PMID:34997889
    reference_title: Final results of the Choroid Plexus Tumor study CPT-SIOP-2000.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients older than three years were recommended to receive irradiation: focal fields for non-metastatic CPC, incompletely resected atypical choroid plexus papilloma (APP) or metastatic choroid plexus papilloma (CPP); craniospinal fields for metastatic CPC/APP and non-responsive CPC."
    explanation: The protocolised risk-adapted radiotherapy policy for the whole family.
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in cancer patients with germline disease-causing TP53 variants, radiotherapy, and conventional genotoxic chemotherapy contribute to the development of subsequent primary tumours"
    explanation: The basis for radiation avoidance in germline TP53 carriers.
  - reference: PMID:38316675
    reference_title: "Correlation between choroid plexus carcinoma and Li-Fraumeni syndrome: implications of TP53 mutations and management strategies-a case-based narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Irradiation-sparing therapies are recommended for LFS-associated CPCs to mitigate the risk of secondary malignancies."
    explanation: Disease-specific recommendation to spare irradiation in
      Li-Fraumeni-associated carcinoma.
- name: Germline TP53 Testing and Genetic Counselling
  action_category: DIAGNOSTIC
  description: >-
    Paired germline TP53 testing with genetic counselling is indicated in essentially
    every child with choroid plexus carcinoma, irrespective of family history, and must
    be performed before treatment starts. It is the highest-value single action in the
    entry because it changes three things at once: the treatment plan (avoiding
    radiotherapy and genotoxic chemotherapy in carriers), lifelong surveillance for the
    patient, and cascade testing for relatives.
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is critical to perform TP53 testing before the initiation of treatment in order to avoid in carriers, if possible, radiotherapy and genotoxic chemotherapies."
    explanation: The guideline statement that testing must precede treatment.
  - reference: PMID:38316675
    reference_title: "Correlation between choroid plexus carcinoma and Li-Fraumeni syndrome: implications of TP53 mutations and management strategies-a case-based narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies emphasized the need for genetic testing in patients with CPCs, especially in pediatric cases, to identify LFS implications."
    explanation: Disease-specific recommendation for germline testing in choroid plexus
      carcinoma.
- name: Li-Fraumeni Surveillance in Confirmed Carriers
  action_category: SCREENING
  description: >-
    Confirmed germline TP53 carriers enter lifelong surveillance: in children, clinical
    examination and abdominal ultrasound every six months plus annual whole-body and
    brain MRI from the first year of life. This targets the whole Li-Fraumeni tumour
    spectrum, not merely recurrent choroid plexus disease.
  treatment_term:
    preferred_term: Disease Screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children, the recommendations are to perform clinical examination and abdominal ultrasound every 6 months, annual WBMRI and brain MRI from the first year of life, if the TP53 variant is known to be associated with childhood cancers."
    explanation: The paediatric surveillance protocol for germline TP53 carriers.
- name: Cerebrospinal Fluid Diversion
  action_category: THERAPEUTIC
  description: >-
    Shunt placement or other cerebrospinal fluid diversion is used when hydrocephalus
    does not resolve after tumor removal. Because the obstruction and outflow-resistance
    arm of the mechanism can persist once the secretory tumor is gone, a subset of
    patients remain shunt-dependent despite radical resection and no residual tumour.
  treatment_term:
    preferred_term: Ventriculoperitoneal Shunt Placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Ventricular Enlargement and Raised Intracranial Pressure
    treatment_effect: INHIBITS
    description: >-
      Diversion bypasses the obstructed pathway and normalises intracranial pressure
      irrespective of which mechanism produced the hydrocephalus.
    evidence:
    - reference: PMID:6738779
      reference_title: Persistent hydrocephalus following removal of choroid plexus
        papilloma of the lateral ventricle.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To control the hydrocephalus, a bilateral shunt with low pressure valve was necessary."
      explanation: Documents shunt diversion being used, and required, to control the
        hydrocephalus.
  evidence:
  - reference: PMID:6738779
    reference_title: Persistent hydrocephalus following removal of choroid plexus
      papilloma of the lateral ventricle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To control the hydrocephalus, a bilateral shunt with low pressure valve was necessary."
    explanation: Documents the need for cerebrospinal fluid diversion when hydrocephalus
      persists after resection.
diagnosis:
- name: Contrast-enhanced brain MRI
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    MRI identifies the intraventricular mass, the degree of hydrocephalus,
    transependymal oedema, haemorrhage and invasion, and defines residual disease after
    surgery. Spine MRI is added when higher-grade disease is suspected.
  results: >-
    An enhancing, lobulated intraventricular mass with ventricular dilatation in a young
    child is the characteristic finding.
  evidence:
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroid plexus tumors (CPTs) are intraventricular brain tumors predominantly arising in children but also affecting adults."
    explanation: Supports the intraventricular target of the imaging study; the
      enhancement pattern is not described in this abstract.
- name: Histopathologic examination with lineage immunohistochemistry
  description: >-
    Definitive diagnosis and grading rest on histology - papillary architecture, mitotic
    count, cellularity, pleomorphism, necrosis and invasion - supplemented by Kir7.1 and
    stanniocalcin-1 immunohistochemistry to confirm choroid plexus lineage against
    ependymoma, meningioma and metastatic papillary carcinoma.
  results: >-
    Kir7.1- and stanniocalcin-1-positive papillary epithelial tumor; mitotic count of at
    least 2 per 10 high-power fields upgrades papilloma to atypical papilloma; frank
    anaplasia and brain invasion define carcinoma.
  evidence:
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that antibodies directed against Kir7.1 and stanniocalcin-1 might serve as sensitive and specific diagnostic markers for choroid plexus tumors."
    explanation: Establishes the immunohistochemical panel used to confirm lineage.
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose to define atypical choroid plexus papilloma by mitotic activity (> or =2 mitoses per 10 high-power fields) corresponding to World Health Organization grade II"
    explanation: Establishes the histologic grading threshold applied at diagnosis.
- name: DNA methylation profiling
  description: >-
    Methylation classification resolves choroid plexus tumors into three clinically
    relevant subgroups - pediatric A, pediatric B and adult - that complement rather
    than replace histology, and that can reassign histologically low-grade tumors to a
    high-risk molecular class.
  results: >-
    Assignment to pediatric A, pediatric B or adult methylation subgroup, with pediatric
    B carrying the highest recurrence risk.
  evidence:
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumors comprised the molecular subgroups \"pediatric A\" (N=11), \"pediatric B\" (N=12) and \"adult\" (N=27)."
    explanation: Names the three methylation subgroups asserted in the description.
  - reference: PMID:39482394
    reference_title: Single-nucleus RNA-seq dissection of choroid plexus tumor cell
      heterogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all CPC, but also a considerable number of pediatric CPP and aCPP, are assigned to high-risk methylation cluster 3"
    explanation: Sources the claim that the pediatric-B cluster is the high-risk class
      and can capture histologically lower-grade tumors.
  - reference: PMID:25336695
    reference_title: Molecular characterization of choroid plexus tumors reveals novel
      clinically relevant subgroups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data demonstrate that differences in CN, gene expression, and DNA methylation signatures distinguish CPCs from CPPs and aCPPs"
    explanation: Supports the diagnostic discriminating power of methylation and
      copy-number profiling.
- name: Germline TP53 sequencing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Paired germline TP53 testing in every choroid plexus carcinoma, performed before
    treatment planning. Tumor-only sequencing cannot distinguish germline from somatic
    origin and therefore cannot substitute.
  results: >-
    Identification of a germline pathogenic TP53 variant establishes heritable
    TP53-related cancer (Li-Fraumeni) syndrome and changes treatment and surveillance.
  evidence:
  - reference: PMID:32457520
    reference_title: Guidelines for the Li-Fraumeni and heritable TP53-related cancer
      syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is critical to perform TP53 testing before the initiation of treatment in order to avoid in carriers, if possible, radiotherapy and genotoxic chemotherapies."
    explanation: Establishes germline TP53 testing as a pre-treatment diagnostic step.
differential_diagnoses:
- name: Ependymoma
  disease_term:
    preferred_term: ependymoma
    term:
      id: MONDO:0016698
      label: ependymoma
  description: >-
    Papillary intraventricular ependymoma is the closest radiological and histological
    mimic. It shares the intraventricular location and papillary appearance but lacks
    choroid plexus lineage markers.
  distinguishing_features:
  - Ependymoma is negative for the choroid plexus lineage markers Kir7.1 and
    stanniocalcin-1.
  - Ependymoma typically shows GFAP positivity with perivascular pseudorosettes and
    ependymal rosettes rather than true fibrovascular papillae.
  evidence:
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gene expression profiles of choroid plexus epithelial cells (n = 8) and ependymal cells (n = 6) microdissected from human autopsy brains as well as choroid plexus papilloma tissue were investigated using DNA microarrays"
    explanation: The marker study was explicitly designed against ependymal cells,
      confirming ependymoma as the principal lineage differential.
- name: Papillary meningioma
  disease_term:
    preferred_term: meningioma
    term:
      id: MONDO:0016642
      label: meningioma
  description: >-
    Intraventricular and papillary meningiomas can present as an enhancing
    intraventricular mass and mimic choroid plexus papilloma both radiologically and
    histologically.
  distinguishing_features:
  - Meningioma is EMA-positive and negative for the choroid plexus lineage markers
    Kir7.1 and stanniocalcin-1.
  - Stanniocalcin-1 stained only 2 of 100 non-choroid-plexus primary brain tumors and
    cerebral metastases in the defining marker series.
  evidence:
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, stanniocalcin-1 stained normal choroid plexus (32 of 35), choroid plexus papilloma (16 of 18), and choroid plexus carcinoma (3 of 5), whereas staining was seen in only 2 of 100 other primary brain tumors and cerebral metastases."
    explanation: Supports the marker-based exclusion of other primary brain tumors, the
      category that includes meningioma.
- name: Metastatic papillary carcinoma
  disease_term:
    preferred_term: metastatic carcinoma
    term:
      id: MONDO:0024879
      label: metastatic carcinoma
  description: >-
    Metastatic papillary adenocarcinoma to the brain (thyroid, lung, renal, ovarian) can
    be histologically indistinguishable from choroid plexus carcinoma on morphology
    alone, particularly in adults.
  distinguishing_features:
  - Kir7.1 was absent from all 100 non-choroid-plexus primary brain tumors and cerebral
    metastases tested, making it the discriminating marker.
  - A known extracranial primary and a non-intraventricular or multifocal distribution
    favour metastasis.
  evidence:
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of inward rectifier potassium channel Kir7.1 was confirmed in normal choroid plexus (34 of 35), choroid plexus papilloma (12 of 18), and choroid plexus carcinoma (5 of 5) but was not found in 100 other primary brain tumors and cerebral metastases."
    explanation: Establishes the marker that separates choroid plexus tumors from
      cerebral metastases.
- name: Atypical teratoid/rhabdoid tumor
  disease_term:
    preferred_term: atypical teratoid rhabdoid tumor
    term:
      id: MONDO:0020560
      label: atypical teratoid rhabdoid tumor
  description: >-
    AT/RT of infancy can occupy the same intraventricular compartment and the same age
    group as choroid plexus carcinoma, and is the most dangerous confusion because
    treatment differs substantially.
  distinguishing_features:
  - Loss of nuclear INI1/SMARCB1 staining defines AT/RT and must be tested for.
  - A minority of AT/RTs express Kir7.1, so choroid plexus lineage markers alone cannot
    exclude AT/RT.
  evidence:
  - reference: PMID:21276081
    reference_title: Atypical teratoid/rhabdoid tumors may show morphological and
      immunohistochemical features seen in choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two AT/RT cases exhibited membranous staining of Kir7.1, indicating a plexus epithelial differentiation of these tumors."
    explanation: Documents the overlap that makes AT/RT a critical differential and
      limits reliance on Kir7.1 alone.
  - reference: PMID:21276081
    reference_title: Atypical teratoid/rhabdoid tumors may show morphological and
      immunohistochemical features seen in choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnosis includes choroid plexus carcinoma which has occasionally been attributed as showing an inactivation of INI1/SMARCB1 nuclear staining in immunohistochemistry."
    explanation: Names choroid plexus carcinoma explicitly as the AT/RT differential and
      identifies the INI1/SMARCB1 discriminator.
- name: Choroid plexus cyst
  description: >-
    A benign, usually incidental fluid-filled cyst of the choroid plexus stroma, most
    often detected on second-trimester fetal ultrasound and associated with trisomy 18
    when other markers are present. Despite the shared anatomical name it is not a
    neoplasm, has no relationship to the choroid plexus tumor family, and is included
    here explicitly because the name similarity is a recognised source of literature and
    curation confusion.
  distinguishing_features:
  - A choroid plexus cyst is a non-enhancing, non-solid cystic structure that typically
    resolves spontaneously, produces no mass effect and no hydrocephalus, and requires
    no oncological management.
  - Choroid plexus neoplasms are solid, intensely enhancing intraventricular masses that
    present with hydrocephalus.
  notes: >-
    The HPO term HP:0002190 Choroid plexus cyst records this distinct, non-neoplastic
    concept; it is not bound as `disease_term` here because the descriptor takes a
    disease rather than a phenotype term.
  evidence:
  - reference: PMID:42143260
    reference_title: "Natural history and prognostic significance of fetal choroid plexus cysts: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroid plexus cysts (CPCs) are fluid-filled structures within the choroid plexus of the lateral ventricles, most frequently identified during routine second-trimester ultrasound examinations."
    explanation: Establishes the choroid plexus cyst as a distinct, non-neoplastic
      fluid-filled lesion of the same anatomical structure, detected prenatally.
  - reference: PMID:42143260
    reference_title: "Natural history and prognostic significance of fetal choroid plexus cysts: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They are reported in approximately 1-2% of second-trimester fetuses and are generally regarded as benign and transient findings, particularly when not accompanied by other abnormalities"
    explanation: Supports the benign, transient, non-oncological character that separates
      the cyst from every member of the choroid plexus tumor family.
- name: Choroid plexus hyperplasia (villous hypertrophy)
  description: >-
    Diffuse enlargement of the choroid plexus without a discrete neoplastic mass. It
    causes hydrocephalus by the same cerebrospinal fluid overproduction mechanism as a
    papilloma, so the mechanistic overlap is genuine even though the lesion is not a
    tumor - which makes it the one differential that shares this entry's core
    pathophysiology.
  distinguishing_features:
  - Imaging shows bilateral diffuse plexus enlargement rather than a solitary lobulated
    mass.
  - Hydrocephalus is communicating and purely overproduction-driven, with no obstructive
    component from mass effect.
  evidence:
  - reference: PMID:1022421
    reference_title: "Choroid plexus papilloma. I. Proof of cerebrospinal fluid overproduction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas these data are regarded as conclusive evidence of CSF overproduction by a choroid plexus papilloma"
    explanation: Establishes the overproduction mechanism that choroid plexus hyperplasia
      shares with papilloma; the hyperplasia entity itself is not described in this
      abstract, hence partial support.
discussions:
- discussion_id: sv40_aetiology
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does simian virus 40 contribute to human choroid plexus tumorigenesis, or is the
    historical SV40 association entirely an artefact of PCR contamination and
    transgenic-mouse extrapolation?
  attaches_to:
  - environmental#Simian virus 40 (SV40) exposure
  rationale: >-
    SV40 large T antigen reliably produces choroid plexus tumors in transgenic mice,
    and SV40 DNA sequences were reported in human choroid plexus tumors, which
    generated a long-lived aetiological hypothesis. The two strongest human tests
    point the other way: a nationwide Danish cohort found no excess of choroid plexus
    tumor after SV40-contaminated poliovirus vaccine exposure, and SV40 large T
    antigen was undetectable by immunohistochemistry in 82 central nervous system
    tumors. The residual gap is that these are negative studies of population exposure
    and protein detection respectively; neither formally excludes a hit-and-run or
    low-prevalence mechanism, and the discordance with earlier PCR-positive series has
    never been fully resolved. This entry therefore records the question as contested
    and currently unsupported rather than settled.
  proposed_experiments:
  - experiment_id: sv40_contamination_controlled_sequencing
    name: Contamination-controlled deep sequencing for SV40 in a contemporary cohort
    description: >-
      Deep sequencing of a contemporary, well-powered choroid plexus tumor cohort with
      rigorous contamination controls, reporting SV40 read counts against matched
      normal tissue from the same patients.
    supporting_outcome:
    - Reproducible SV40 reads above matched-normal background in a meaningful fraction
      of tumors.
    refuting_outcome:
    - Absence of SV40 reads above background across an adequately powered cohort.
  - experiment_id: sv40_harmonised_pcr_reanalysis
    name: Harmonised reanalysis of discordant PCR series
    description: >-
      Pooled reanalysis of the discordant PCR-positive and PCR-negative series using
      harmonised assay controls, to determine whether laboratory contamination explains
      the geographic pattern of positivity.
    supporting_outcome:
    - Persistence of geographic positivity after assay harmonisation.
    refuting_outcome:
    - Disappearance of positivity under common contamination controls.
  evidence:
  - reference: PMID:12671021
    reference_title: Cancer incidence in Denmark following exposure to poliovirus vaccine
      contaminated with simian virus 40.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to SV40-contaminated poliovirus vaccine in Denmark was not associated with increased cancer incidence."
    explanation: The strongest population-level negative test of the SV40 hypothesis.
- discussion_id: acpp_molecular_identity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is atypical choroid plexus papilloma a distinct biological entity, or a histologic
    risk stratum within choroid plexus papilloma?
  attaches_to:
  - pathophysiology#Malignant Progression to High-Grade Carcinoma
  rationale: >-
    WHO grade 2 atypical choroid plexus papilloma is defined purely by a mitotic-count
    threshold, and that threshold is genuinely prognostic for recurrence. But
    genome-wide copy-number, expression and methylation profiling has repeatedly failed
    to separate atypical papilloma from ordinary papilloma, and the authors of the
    largest such study concluded the two histologic subgroups are a single molecular
    entity. Whether the mitotic threshold captures a distinct biology or simply samples
    the upper tail of a continuous proliferative distribution within one entity is
    unresolved, and it matters for whether adjuvant decisions should be driven by grade
    or by molecular class.
  proposed_experiments:
  - experiment_id: acpp_mitotically_stratified_profiling
    name: Mitotically stratified molecular profiling of papilloma
    description: >-
      Prospective single-cell and methylation profiling of a papilloma cohort stratified
      by mitotic count, testing whether a molecular discontinuity exists at the
      2-mitoses-per-10-HPF threshold.
    supporting_outcome:
    - A step change in molecular profile at the 2-mitoses-per-10-HPF threshold.
    refuting_outcome:
    - A continuous molecular gradient across mitotic counts with no discontinuity.
  - experiment_id: acpp_grade_versus_methylation_prognosis
    name: Head-to-head prognostic comparison of grade versus methylation class
    description: >-
      Correlate methylation subgroup (pediatric A / pediatric B / adult) against mitotic
      count and recurrence in a pooled registry to determine which better predicts
      outcome.
    supporting_outcome:
    - Mitotic count outperforming methylation class as a predictor of recurrence.
    refuting_outcome:
    - Methylation class outperforming mitotic count as a predictor of recurrence.
  evidence:
  - reference: PMID:25336695
    reference_title: Molecular characterization of choroid plexus tumors reveals novel
      clinically relevant subgroups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "molecular similarities among the papillomas suggest that these two histologic subgroups are indeed a single molecular entity"
    explanation: The authors' explicit statement that atypical papilloma and papilloma
      are molecularly one entity.
clinical_trials:
- name: NCT04994977
  phase: PHASE_I
  status: TERMINATED
  description: >-
    Intra-arterial chemotherapy delivered before a planned second-look operation in newly
    diagnosed, residual or recurrent atypical choroid plexus papilloma and choroid plexus
    carcinoma - a locoregional extension of the neoadjuvant-then-resect strategy already
    used systemically. The study terminated for low accrual after enrolling a single
    patient, so no efficacy inference is possible; it is recorded here because it is the
    only interventional trial specific to this disease family rather than a broad CNS
    basket.
  target_phenotypes:
  - preferred_term: Neoplasm of the central nervous system
    term:
      id: HP:0100006
      label: Neoplasm of the central nervous system
  evidence:
  - reference: clinicaltrials:NCT04994977
    reference_title: "Intra-Arterial (IA) Chemotherapy for Newly Diagnosed, Residual, or Recurrent Atypical Choroid Plexus Papilloma (ACPP) and Choroid Plexus Carcinoma (CPC) Prior to Second-Look Surgery"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study will test the safety and efficacy of intra-arterial chemotherapy in subjects with newly diagnosed, residual, or recurrent atypical choroid plexus papilloma and choroid plexus carcinoma prior to a second surgery."
    explanation: Defines the trial population and intervention, both specific to this
      disease family.
  - reference: clinicaltrials:NCT04994977
    reference_title: "Intra-Arterial (IA) Chemotherapy for Newly Diagnosed, Residual, or Recurrent Atypical Choroid Plexus Papilloma (ACPP) and Choroid Plexus Carcinoma (CPC) Prior to Second-Look Surgery"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is believed that intra-arterial chemotherapy will be safe and feasible for this population and will result in decreased tumor size, which may further improve the goals of a second-look surgery."
    explanation: States the trial hypothesis; marked PARTIAL because the trial terminated
      for low accrual and did not test it.
animal_models:
- species: Mus musculus
  genotype: Otx2-lineage conditional MycT58A expression with Trp53 inactivation
  category: GENETICALLY_ENGINEERED
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  description: >-
    Conditional expression of a stabilised c-Myc together with Trp53 inactivation in the
    choroid plexus of newborn mice produces choroid plexus carcinoma with complete
    penetrance across all brain ventricles, with a lateral- and fourth-ventricular
    predominance matching the human site distribution, and death from hydrocephalus within
    150 days. The tumours recapitulate human carcinoma histology and show dysregulated
    cell-cycle and DNA-damage-response programs. Translational caveat: MYC stabilisation is
    an engineered lesion, not a recurrent human alteration, so the model demonstrates
    sufficiency of the p53-loss-plus-oncogene combination rather than fidelity to the
    human genotype.
  evidence:
  - reference: PMID:29339161
    reference_title: A new genetically engineered mouse model of choroid plexus carcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Choroid plexus tumours occurred with a complete penetrance in all brain ventricles, with prevalence in the lateral and fourth ventricles."
    explanation: Penetrance and site distribution of the model, both matching the human
      disease.
  - reference: PMID:29339161
    reference_title: A new genetically engineered mouse model of choroid plexus carcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Comparison of gene expression profiles of CPCs and non-neoplastic tissues revealed profound alterations in cell cycle regulation and DNA damage responses, suggesting that dysregulation of cell division and DNA checkpoint pathways may represent key vulnerabilities."
    explanation: Identifies the cell-cycle and DNA-damage-response programs that the model
      shares with the human chromosomal-instability node.
- species: Mus musculus
  genotype: Combined NOTCH and Sonic Hedgehog pathway perturbation in choroid plexus
  category: GENETICALLY_ENGINEERED
  description: >-
    Mice with combined NOTCH and Sonic Hedgehog signalling defects develop tumours
    resembling human choroid plexus carcinoma. The tumours are monociliated, and
    disrupting the NOTCH complex restores multiciliation and reduces tumour growth,
    which is the experimental basis for the GMNC-MCIDAS multiciliogenesis arm of the
    pathograph.
  evidence:
  - reference: PMID:35322202
    reference_title: Disruption of GMNC-MCIDAS multiciliogenesis program is critical in
      choroid plexus carcinoma development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that combined defects in NOTCH and Sonic Hedgehog signaling in mice generates tumors that are similar to CPC in humans."
    explanation: Establishes the model and its resemblance to human carcinoma.

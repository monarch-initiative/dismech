epidemiology:
- name: Rarity among brain tumors
  description: >-
    Choroid plexus tumors are rare, comprising roughly 1% of all brain tumors, but are
    heavily concentrated in early childhood and are over-represented among tumors
    presenting in the first year of life.
  evidence:
  - reference: PMID:38339361
    reference_title: "Prognostic Factors and Nomogram for Choroid Plexus Tumors: A Population-Based Retrospective Surveillance, Epidemiology, and End Results Database Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choroid plexus tumors (CPTs) are rare neoplasms found in the central nervous system, comprising 1% of all brain tumors."
    explanation: SEER-based population analysis quantifying the rarity of the choroid
      plexus tumor family among brain tumors.
  - reference: PMID:41198335
    reference_title: "An overview of the diagnosis and management of Choroid Plexus tumors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Choroid Plexus Tumors (CPT) are rare (2-4% of all pediatric CNS tumors), predominantly early childhood brain neoplasms."
    explanation: Review establishing the share of pediatric CNS tumors accounted for by
      choroid plexus tumors and their early-childhood concentration.
- name: Infantile incidence peak
  description: >-
    Age-adjusted incidence of every choroid plexus tumor subtype is highest in children
    under one year of age and declines steadily thereafter.
  evidence:
  - reference: PMID:36659972
    reference_title: Incidence and survival of choroid plexus tumors in the United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence was highest among children less than one year old among all subtypes (CPP AAIR: 0.278; aCPP AAIR: 0.140; CPC AAIR: 0.195), reducing as patients aged."
    explanation: CBTRUS registry data showing the infantile incidence peak across all
      three histologic subtypes.
- name: Subtype survival gradient
  description: >-
    Histologic grade is the dominant determinant of survival across the family, with a
    stepwise decline from papilloma through atypical papilloma to carcinoma.
  evidence:
  - reference: PMID:38339361
    reference_title: "Prognostic Factors and Nomogram for Choroid Plexus Tumors: A Population-Based Retrospective Surveillance, Epidemiology, and End Results Database Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology was a significant predictor of OS, with 5-year OS rates of 90, 79, and 61% for CPP, aCPP, and CPC, respectively."
    explanation: Directly quantifies the grade-stratified 5-year overall survival
      gradient across the three subtypes.
  - reference: PMID:36659972
    reference_title: Incidence and survival of choroid plexus tumors in the United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall survival was worse among patients with CPC, being five times more likely to die compared to patients with CPP (HR: 5.23, 95% CI: 4.05-7.54, P < .001)."
    explanation: Independent registry confirmation of the carcinoma-versus-papilloma
      survival gap.

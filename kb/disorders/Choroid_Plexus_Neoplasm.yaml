- name: Cerebrospinal Fluid Overproduction by Secretory Tumour Epithelium
  biological_scale: TISSUE
  role: effector
  description: >-
    The first of the two hydrocephalus mechanisms. Neoplastic choroid plexus epithelium
    continues to secrete cerebrospinal fluid, and a large tumor can raise the formation
    rate several-fold above normal. Ventricular perfusion measurement in a child with a
    74 g lateral-ventricular papilloma showed a preoperative formation rate of 1.05
    ml/min falling fivefold to 0.20 ml/min after resection. Because production outstrips
    absorptive capacity while the pathways themselves remain patent, this route
    classically produces a communicating hydrocephalus.

notes: >-
  Scope and relationship to the standalone carcinoma entry: this is the umbrella entry
  for MONDO:0016717, covering the mechanism shared by all three graded entities. Choroid
  plexus carcinoma additionally has its own dismech entry at
  kb/disorders/Choroid_Plexus_Carcinoma.yaml (MONDO:0016718), which carries the
  carcinoma-specific molecular risk strata, chemotherapy detail and subtype structure;
  carcinoma-specific depth belongs there rather than being duplicated here. A small
  number of carcinoma findings (the SJYC07 TP53 progression-free-survival split, the
  CarbEV randomised result, the mutant-p53 dosage risk group and the SEER
  gross-total-resection finding) are deliberately restated here, because they are the
  family-level prognostic and treatment backbone and the umbrella would be misleading
  without them; everything else carcinoma-specific is left to the standalone entry.


  Why a Disease rather than a Grouping: MONDO:0016717 carries the `disease_grouping`
  and `ordo_group_of_disorders` subsets, and dismech's convention is that curated unions
  over already-distinct entries belong in `kb/groupings/` as the `Grouping` class. This
  is modelled as a Disease instead because two of its three members - choroid plexus
  papilloma and atypical choroid plexus papilloma - have no standalone dismech entries,
  so there is no union to point at; the shared hydrocephalus mechanism is genuinely
  family-level and needs a pathograph of its own. If CPP and aCPP are later curated
  separately, converting this to a Grouping over the three entries would be the right
  refactor.

  ICD-O morphology is deliberately omitted. The closed ICDOMorphologyEnum offers only
  Carcinoma, Adenocarcinoma, Squamous Cell Carcinoma, Sarcoma, Leukemia, Lymphoma,
  Multiple Myeloma, Melanoma, Glioma and Embryonal Neoplasm. This umbrella spans ICD-O
  9390/0 (papilloma, benign), 9390/1 (atypical, uncertain behaviour) and 9390/3
  (carcinoma, malignant); tagging the family "Carcinoma" would misclassify the two
  non-malignant members, and no papilloma or mixed-behaviour value exists. The correct
  value is absent from the enum rather than merely hard to choose.

  Module conformance is claimed only for the TP53 arm, and only where the module node
  semantics actually match - `evading_growth_suppressors#Tumor Suppressor Inactivation`
  for the p53-axis lesion, and `genome_instability_mutation#Mutator Phenotype and
  Chromosomal Instability` for the whole-chromosome copy-number instability that follows
  it. Conformance is NOT claimed for papilloma, which carries no recurrent
  tumour-suppressor lesion, nor for the downstream hallmark nodes of either module, for
  which there is no choroid-plexus-specific evidence in the curated sources.

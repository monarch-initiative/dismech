      tumor deposits.
histopathology:
- name: Papillary Architecture
  finding_term:
    preferred_term: Papillary Growth Pattern
    term:
      id: NCIT:C35911
      label: Papillary Growth Pattern
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Orderly papillary fronds of fibrovascular cores lined by a single layer of
    relatively uniform cuboidal-to-columnar epithelium define choroid plexus papilloma.
    Blurring or loss of this architecture is one of the atypical features that shifts a
    tumor toward higher grade.
  evidence:
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a series of 164 choroid plexus tumors was evaluated for the presence of atypical histologic features, including mitotic activity, increased cellularity, nuclear pleomorphism, blurring of papillary growth pattern, and necrosis"
    explanation: Lists the papillary growth pattern and its blurring among the graded
      histologic features of the family.
- name: Increased Mitotic Activity
  finding_term:
    preferred_term: Two to 10 Mitoses per 10HPF
    term:
      id: NCIT:C60306
      label: Two to 10 Mitoses per 10HPF
  frequency: OCCASIONAL
  diagnostic: true
  description: >-
    Mitotic activity of at least 2 mitoses per 10 high-power fields is the sole grading
    criterion for atypical choroid plexus papilloma (WHO grade 2). It was present in 15%
    of otherwise untreated papillomas in the defining series (a figure reported in the
    abstract's bracketed per-feature breakdown, which cannot be quoted inside a snippet
    because the reference validator strips bracketed spans) and was the only atypical
    feature independently associated with recurrence on multivariate analysis. The bound NCIT term used here (Two to 10 Mitoses per 10HPF) is the closest available closed-enum value; the actual WHO criterion is at least 2 mitoses per 10 high-power fields with no upper bound.
  evidence:
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose to define atypical choroid plexus papilloma by mitotic activity (> or =2 mitoses per 10 high-power fields) corresponding to World Health Organization grade II"
    explanation: The defining histologic criterion and its threshold.
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a multivariate model, an independent effect of mitotic activity on the probability of recurrence could be confirmed (p = 0.001)."
    explanation: Establishes the prognostic independence of mitotic count.
- name: Hypercellularity and Nuclear Pleomorphism
  finding_term:
    preferred_term: Hypercellularity
    term:
      id: NCIT:C177116
      label: Hypercellularity
  frequency: OCCASIONAL
  description: >-
    Increased cellularity and nuclear pleomorphism are recognised atypical features of
    choroid plexus tumors, present in 20% and 13% respectively of papillomas in the
    defining series, but neither was independently associated with recurrence and
    neither is used for grading in isolation. Together with necrosis and loss of
    papillary architecture they contribute to the diagnosis of frank carcinoma.
  evidence:
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 124 choroid plexus papillomas that had not received adjuvant treatment, 46 tumors (37%) displayed at least one atypical feature, including increased cellularity"
    explanation: Establishes that a substantial minority of choroid plexus papillomas
      display at least one atypical histologic feature, increased cellularity among them.
      The per-feature percentages quoted in the description come from the continuation of
      this same sentence; that continuation is not quoted verbatim because the reference
      validator strips square-bracketed spans from snippets before matching, so the
      abstract's bracketed percentages cannot be used inside a snippet.
- name: Kir7.1 and Stanniocalcin-1 Immunoreactivity
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Immunohistochemical expression of the inward rectifier potassium channel Kir7.1 and
    of stanniocalcin-1 is highly sensitive and specific for choroid plexus lineage,
    distinguishing choroid plexus tumors from other primary brain tumors and from
    metastatic carcinoma. Transthyretin is also expressed but is significantly less
    specific.
  evidence:
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that antibodies directed against Kir7.1 and stanniocalcin-1 might serve as sensitive and specific diagnostic markers for choroid plexus tumors."
    explanation: Establishes Kir7.1 and stanniocalcin-1 as the discriminating lineage
      markers.
  - reference: PMID:16330944
    reference_title: "Identification of novel diagnostic markers for choroid plexus tumors: a microarray-based approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transthyretin stained choroid plexus (33 of 35), choroid plexus papilloma (14 of 18), and plexus carcinoma (2 of 5), but its specificity was significantly lower."
    explanation: Supports the lower diagnostic specificity of transthyretin relative to
      Kir7.1 and stanniocalcin-1.
imaging_findings:
- name: Enhancing Intraventricular Mass with Hydrocephalus
  modality: MRI
  imaging_finding_term:

- name: Adult-Specific TERT Promoter Activation
  biological_scale: MOLECULAR
  role: driver
  description: >-
    A separate, adult-restricted route into the same tumor. TERT promoter mutations
    occur in a quarter of adult choroid plexus tumor patients, reactivating telomerase
    and conferring replicative capacity; they are essentially absent from the
    pediatric-dominant subgroups, where TP53 is the recurrent lesion instead. TERT
    promoter mutation is prognostic in adults, associating with shorter
    progression-free survival, and a rare CCDC47-PRKCA fusion is a further
    adult-specific alteration reported in an aggressive papilloma. The pediatric
    counterpart of this telomere-maintenance requirement is telomerase-independent:
    alternative lengthening of telomeres is enriched in choroid plexus carcinoma (23% of
    cases) and is tied to somatic, not germline, TP53 mutation.

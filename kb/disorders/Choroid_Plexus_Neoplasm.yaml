name: Choroid Plexus Neoplasm
creation_date: '2026-08-01T07:30:00Z'
description: >-
  Choroid plexus neoplasms (choroid plexus tumors, CPT) are rare intraventricular
  papillary neoplasms arising from the cerebrospinal-fluid-secreting choroid plexus
  epithelium. The WHO CNS classification recognises three graded entities that this
  umbrella entry spans: choroid plexus papilloma (CPP, grade 1), atypical choroid
  plexus papilloma (aCPP, grade 2, defined by mitotic activity of at least 2 mitoses
  per 10 high-power fields), and choroid plexus carcinoma (CPC, grade 3). Incidence
  peaks in the first year of life; tumors are typically lateral-ventricular
  (supratentorial) in children and fourth-ventricular (infratentorial) in adults.
  The dominant clinical presentation is hydrocephalus, produced by two mechanistically
  distinct and frequently co-occurring routes - cerebrospinal fluid overproduction by
  the secretory tumour epithelium, and obstruction of cerebrospinal fluid pathways by
  intraventricular mass effect - which is why hydrocephalus may persist after
  otherwise complete tumour removal. Pediatric choroid plexus tumors lack a recurrent
  driver mutation apart from TP53; TP53 status is the dominant prognostic axis in
  carcinoma, and choroid plexus carcinoma is a sentinel cancer for Li-Fraumeni
  syndrome, so germline TP53 testing with genetic counselling is indicated in
  essentially every case. Gross total resection is the strongest modifiable
  prognostic factor in carcinoma; in papilloma and atypical papilloma, population data
  show no overall survival difference between gross total and subtotal resection.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Intraventricular Neoplasm
parents:
- brain neoplasm
synonyms:
- choroid plexus tumor
- choroid plexus tumour
- CPT
- neoplasm of the choroid plexus
- tumor of the choroid plexus

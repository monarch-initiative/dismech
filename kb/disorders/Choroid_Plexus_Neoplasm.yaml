has_subtypes:
- name: CPP
  display_name: Choroid Plexus Papilloma (WHO grade 1)
  subtype_term:
    preferred_term: choroid plexus papilloma
    term:
      id: MONDO:0009837
      label: choroid plexus papilloma
  description: >-
    WHO grade 1 papillary neoplasm of choroid plexus epithelium with orderly fronds
    lined by relatively uniform cuboidal-to-columnar epithelium and minimal mitotic
    activity. The commonest member of the family. Gross total resection is frequently
    curative and adjuvant therapy is usually unnecessary; 5-year overall survival is
    approximately 90%.
  evidence:
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Choroid plexus papillomas are neuroepithelial tumors that are World Health Organization grade I or II. In contrast, the rarely encountered choroid plexus carcinoma is classified as World Health Organization grade III."
    explanation: Establishes the WHO grade assignment separating papilloma from carcinoma.
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prognosis of these benign neoplasms is favorable, and gross total resection is frequently curative."
    explanation: Supports the favourable prognosis and curative role of complete
      resection in grade 1 disease.
  - reference: PMID:34997889
    reference_title: Final results of the Choroid Plexus Tumor study CPT-SIOP-2000.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the registry, histological grading was the most influential prognostic factor: for CPP (n = 55) the 5/10 year overall survival (OS) and the event free survival (EFS) probabilities were 100%/97% and 92%/92%, respectively; for APP (n = 49) 96%/96% and 76%/76%, respectively; and for CPC (n = 54) 65%/51% and 41%/39%, respectively."
    explanation: Prospective registry survival figures separating the three graded
      entities.
- name: aCPP
  display_name: Atypical Choroid Plexus Papilloma (WHO grade 2)
  subtype_term:
    preferred_term: atypical choroid plexus papilloma
    term:
      id: MONDO:0002684
      label: atypical choroid plexus papilloma
  description: >-
    WHO grade 2 intermediate entity defined operationally by increased mitotic activity
    - at least 2 mitoses per 10 high-power fields - which was the only atypical
    histologic feature independently associated with recurrence in the series that
    established the definition. Ancillary features (hypercellularity, nuclear
    pleomorphism, blurring of the papillary architecture, necrosis) may be present but
    are not required. Recurrence risk is intermediate between papilloma and carcinoma.
    Notably, DNA-methylation and copy-number profiling has not separated aCPP from CPP,
    so the entity is currently histologic rather than molecular.
  evidence:
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose to define atypical choroid plexus papilloma by mitotic activity (> or =2 mitoses per 10 high-power fields) corresponding to World Health Organization grade II"
    explanation: The defining mitotic-count criterion for WHO grade 2 atypical choroid
      plexus papilloma.
  - reference: PMID:17086103
    reference_title: Prognostic implications of atypical histologic features in choroid
      plexus papilloma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because mitotic activity is the sole atypical histologic feature independently associated with recurrence"
    explanation: Explains why mitotic count, and not the other atypical features, was
      selected as the grading criterion.
  - reference: PMID:17918524
    reference_title: Malignant progression in choroid plexus papillomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of recurring tumors was higher in cases of atypical choroid plexus papilloma than in cases of choroid plexus papilloma"
    explanation: Quantifies the elevated recurrence risk that justifies the intermediate
      grade.
  - reference: PMID:25336695
    reference_title: Molecular characterization of choroid plexus tumors reveals novel
      clinically relevant subgroups.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unique molecular signatures distinguished choroid plexus carcinomas (CPC) from choroid plexus papillomas (CPP) and atypical choroid plexus papillomas (aCPP); however, no significantly distinct molecular alterations between CPPs and aCPPs were observed."
    explanation: Supports the caveat that aCPP is a histologic rather than a molecularly
      separable entity.
- name: CPC
  display_name: Choroid Plexus Carcinoma (WHO grade 3)
  subtype_term:
    preferred_term: choroid plexus carcinoma
    term:
      id: MONDO:0016718
      label: choroid plexus carcinoma
  description: >-
    WHO grade 3 malignant choroid plexus tumor showing frank anaplasia - high
    cellularity, loss of papillary architecture, brisk mitoses, pleomorphism, necrosis
    and brain invasion - with a strong propensity for cerebrospinal fluid dissemination.
    Concentrated in infancy and early childhood. TP53 alteration is the dominant
    prognostic axis and germline TP53 (Li-Fraumeni syndrome) accounts for a substantial
    minority of cases. A dedicated dismech entry exists at
    kb/disorders/Choroid_Plexus_Carcinoma.yaml; this umbrella entry models the
    family-level mechanism only.
  evidence:
  - reference: PMID:35322202
    reference_title: Disruption of GMNC-MCIDAS multiciliogenesis program is critical in
      choroid plexus carcinoma development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Though CPP and atypical CPP are generally benign and can be resolved by surgery, CPC is a particularly aggressive and little understood cancer with a poor survival rate and a tendency for recurrence and metastasis."
    explanation: Contrasts the malignant behaviour of carcinoma with the two papilloma
      grades.
  - reference: PMID:34997889
    reference_title: Final results of the Choroid Plexus Tumor study CPT-SIOP-2000.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the registry, histological grading was the most influential prognostic factor: for CPP (n = 55) the 5/10 year overall survival (OS) and the event free survival (EFS) probabilities were 100%/97% and 92%/92%, respectively; for APP (n = 49) 96%/96% and 76%/76%, respectively; and for CPC (n = 54) 65%/51% and 41%/39%, respectively."
    explanation: Prospective registry survival figures for carcinoma relative to the
      lower grades.
progression:
- phase: Presentation
  subtype: CPP
  age_range: Peak in the first two years of life
  notes: >-
    Choroid plexus papilloma presents at any age but with a strong infantile
    predominance; site differs with age, being supratentorial in children and
    infratentorial in adults.
  evidence:
  - reference: PMID:30969571
    reference_title: Choroid Plexus Papilloma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although choroid plexus papillomas may occur at any age, 70% of patients with this neoplasm are less than 2 years of age."
    explanation: Establishes the age distribution at presentation for papilloma.
- phase: Presentation
  subtype: CPC
  age_range: Infancy and early childhood (median about 2 years)
  notes: >-
    Choroid plexus carcinoma is concentrated in infancy; roughly a quarter of patients
    are diagnosed in the first year of life.
  evidence:
  - reference: PMID:28939225
    reference_title: "Effect of Surgery, Adjuvant Therapy, and Other Prognostic Factors on Choroid Plexus Carcinoma: A Systematic Review and Individual Patient Data Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median patient age was 2 years, with 26% patients diagnosed in the first year of their life."
    explanation: Individual-patient-data pooled analysis quantifying age at diagnosis
      for carcinoma.
- phase: Recurrence and malignant progression
  notes: >-
    Recurrence after gross total resection is uncommon in grade 1 papilloma and
    substantially more frequent in atypical papilloma. Transition from a lower-grade
    papilloma to frank carcinoma is documented but rare.
  evidence:
  - reference: PMID:17918524
    reference_title: Malignant progression in choroid plexus papillomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent tumor growth after gross-total resection is rare in choroid plexus papillomas, but malignant progression to choroid plexus carcinoma does occur in a small percentage of tumors."
    explanation: Establishes the rate and existence of malignant progression within the
      family.
  - reference: PMID:17918524
    reference_title: Malignant progression in choroid plexus papillomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, two patients experienced a transition from a choroid plexus papilloma (WHO Grade I) and an atypical choroid plexus papilloma (WHO Grade II) to choroid plexus carcinomas (WHO Grade III)."
    explanation: Documents individual grade-to-grade progression events.
- phase: Dissemination
  notes: >-
    Cerebrospinal fluid seeding occurs across the family but is concentrated in higher
    grades; metastases are present at diagnosis in a substantial minority of atypical
    papilloma and carcinoma cases.
  evidence:
  - reference: PMID:19543851
    reference_title: "Atypical choroid plexus papilloma: clinical experience in the CPT-SIOP-2000 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metastases were present at diagnosis in 17% of APP patients, 5% of CPP patients, and 21% of CPC patients."
    explanation: Grade-stratified frequency of metastatic disease at presentation.
pathophysiology:
- name: TP53 Pathway Inactivation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: evading_growth_suppressors#Tumor Suppressor Inactivation
  description: >-
    Loss of p53 tumor-suppressor function - by germline pathogenic TP53 variant
    (Li-Fraumeni syndrome) with somatic loss of the remaining allele, by somatic TP53
    mutation, or by the combination of TP53 codon 72 and MDM2 SNP309 variants that
    confer p53 dysfunction in the absence of a mutation - is the only recurrent driver
    lesion in pediatric choroid plexus tumors. It is concentrated in carcinoma, where
    roughly half of tumors carry a TP53 mutation, and is absent or rare in papilloma.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: DECREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  evidence:
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pediatric CPTs lack recurrent driver alterations except for TP53, whereas CPTs in adults show TERT promoter mutations or a novel CCDC47-PRKCA gene fusion, being associated with a more unfavorable clinical course."
    explanation: Establishes TP53 as the only recurrent driver lesion in pediatric
      choroid plexus tumors.
  - reference: PMID:20308654
    reference_title: TP53 alterations determine clinical subgroups and survival of
      patients with choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 mutations were found in 50% of choroid plexus carcinomas (CPCs)."
    explanation: Quantifies the frequency of somatic TP53 mutation in carcinoma.
  - reference: PMID:20308654
    reference_title: TP53 alterations determine clinical subgroups and survival of
      patients with choroid plexus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, two sequence variants known to confer TP53 dysfunction, TP53 codon72 and MDM2 SNP309, coexisted in the majority of TP53 wild-type CPCs (92%) and not in TP53 mutated CPC (P = .04), which suggests a complementary mechanism of TP53 dysfunction in the absence of a TP53 mutation."
    explanation: Supports p53 dysfunction arising without a TP53 mutation via modifier
      variants.
  downstream:
  - target: Disruption of the GMNC-MCIDAS Multiciliogenesis Program
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the p53/RB tumour-suppressor axis is itself sufficient to derange the
      multiciliogenesis program: mouse carcinoma driven by combined Trp53 and Rb1
      deletion shows multiciliation defects attributable to GMNC-MCIDAS deficiency. This
      places the differentiation block downstream of the tumour-suppressor lesion rather
      than as an independent trigger.
    evidence:
    - reference: PMID:35322202
      reference_title: Disruption of GMNC-MCIDAS multiciliogenesis program is critical in
        choroid plexus carcinoma development.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "CPC driven by deletion of Trp53 and Rb1 in mice exhibits multiciliation defects consequent to deficiencies in the GMNC-MCIDAS program."
      explanation: Mouse evidence placing the multiciliogenesis defect downstream of
        combined Trp53/Rb1 loss. Marked PARTIAL because the human lesion is TP53 alone and
        the RB1 co-requirement has not been shown in human choroid plexus tumours.
  - target: Chromosomal Instability and Aneuploidy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of p53-dependent DNA-damage checkpoint control permits accumulation of
      whole-chromosome copy-number changes; TP53-mutated carcinomas show markedly higher
      total structural variation than TP53 wild-type tumors and papillomas.
    evidence:
    - reference: PMID:20308654
      reference_title: TP53 alterations determine clinical subgroups and survival of
        patients with choroid plexus tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "High-resolution single nucleotide polymorphism (SNP) array analysis revealed extremely high total structural variation (TSV) in TP53-mutated CPC tumor genomes compared with TP53 wild-type tumors and choroid plexus papillomas (CPPs; P = .006 and .004, respectively)."
      explanation: Directly links TP53 mutation status to the magnitude of structural
        genomic variation.
  - target: Choroid Plexus Epithelial Neoplastic Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Combined p53 inactivation and oncogenic drive in choroid plexus epithelium is
      sufficient to initiate tumor formation in mouse models.
    evidence:
    - reference: PMID:29339161
      reference_title: A new genetically engineered mouse model of choroid plexus carcinoma.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Here we have created a novel mouse CPC model by expressing a stabilised form of c-Myc (MycT58A) and inactivating Trp53 in the choroid plexus of newborn mice. This induced aberrant proliferation of choroid plexus epithelial cells, leading to aggressive tumour development and death within 150 days."
      explanation: Mouse model evidence that Trp53 inactivation plus Myc drives choroid
        plexus epithelial proliferation and carcinoma. Marked PARTIAL because the
        sufficiency claim is demonstrated only in mouse; the human data establish
        association, not sufficiency.
- name: Chromosomal Instability and Aneuploidy
  biological_scale: MOLECULAR
  role: amplifier
  conforms_to: genome_instability_mutation#Mutator Phenotype and Chromosomal Instability
  description: >-
    Choroid plexus tumors are characterised by whole-chromosome copy-number alterations
    rather than focal driver events. Recurrent gains and losses partition the family
    into methylation/copy-number subgroups and vary with patient age; carcinomas show
    complex, hyperdiploid or hypodiploid genomes, and a greater burden of mutant TP53
    copies tracks with a more aggressive course.
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  - preferred_term: DNA damage response
    modifier: DECREASED
    term:
      id: GO:0006974
      label: DNA damage response
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  evidence:
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Copy-number alterations mainly represented whole-chromosomal alterations with subgroup-specific enrichments"
    explanation: Establishes whole-chromosome copy-number change as the dominant genomic
      alteration class and its subgroup specificity.
  - reference: PMID:24478045
    reference_title: Choroid plexus carcinomas are characterized by complex chromosomal
      alterations related to patient age and prognosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent copy number losses of chromosomes 5, 6, 16, 18, 19, and 22 as well as gains of chromosomes 1, 2, 4, 12, and 20 were identified."
    explanation: Enumerates the recurrent whole-chromosome imbalances in carcinoma.
  - reference: PMID:25336695
    reference_title: Molecular characterization of choroid plexus tumors reveals novel
      clinically relevant subgroups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allele-specific CN analysis of CPCs revealed two novel subgroups according to DNA content: hypodiploid and hyperdiploid CPCs."
    explanation: Supports genome-wide ploidy disturbance as a defining feature of
      carcinoma.
  - reference: PMID:38867333
    reference_title: Comprehensive multiomics analysis reveals distinct differences
      between pediatric choroid plexus papilloma and carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutually exclusive TP53 and EPHA7 point mutations, coupled with the amplification of chromosome 1, were exclusively identified in CPC. In contrast, amplification of chromosome 9 was specific to CPP."
    explanation: Identifies the copy-number and point-mutation events that discriminate
      carcinoma from papilloma, including the mutually exclusive TP53/EPHA7 pattern.
  - reference: PMID:33249490
    reference_title: The genetic landscape of choroid plexus tumors in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gains of Chr1, 2 and 21q in \"pediatric B\" and gains of Chr5 and 9 and loss of Chr21q in \"adult\""
    explanation: The subgroup-specific whole-chromosome enrichments that define the
      copy-number classes.
  - reference: PMID:38867333
    reference_title: Comprehensive multiomics analysis reveals distinct differences
      between pediatric choroid plexus papilloma and carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "methylation profiling unveiled hypomethylation in major repeat regions, including long interspersed nuclear elements, short interspersed nuclear elements, long terminal repeats, and retrotransposons in CPC compared to CPP, implying that the loss of epigenetic silencing of transposable elements may play a role in tumorigenesis of CPC"
    explanation: Adds the epigenetic arm - loss of transposable-element silencing - as a
      candidate contributor to the carcinoma genomic state.
  downstream:
  - target: Choroid Plexus Epithelial Neoplastic Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Disruption of the GMNC-MCIDAS Multiciliogenesis Program
  biological_scale: CELLULAR
  role: mediator
  description: >-
    Normal choroid plexus epithelium is multiciliated. Human choroid plexus carcinomas
    instead carry solitary cilia, reflecting failure of the GMNC-MCIDAS transcriptional
    program that specifies multiciliated cell fate. In mice, NOTCH activation suppresses
    GMNC/MCIDAS and generates monociliated choroid plexus tumors, while disrupting the
    NOTCH complex restores multiciliation and reduces tumor growth - identifying loss of
    terminal multiciliated differentiation as a permissive step rather than a bystander
    finding. In mice the defect is itself downstream of tumour-suppressor loss -
    carcinoma driven by combined Trp53 and Rb1 deletion shows GMNC-MCIDAS-attributable
    multiciliation defects - so this node is modelled as a consequence of the TP53 arm
    rather than an independent trigger. This arm rests principally on model-system
    evidence.
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:

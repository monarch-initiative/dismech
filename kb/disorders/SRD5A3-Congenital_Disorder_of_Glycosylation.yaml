        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Using this model, we conducted a high-throughput motility-based drug repurposing
          screen and identified atorvastatin, an FDA-approved HMG-CoA reductase inhibitor, as
          a repurposing candidate.
        explanation: >-
          Names the readout and what it was used for. Graded OTHER because C. elegans is
          neither a model organism in the MODEL_ORGANISM sense used here for vertebrates nor

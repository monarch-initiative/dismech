mechanistic_hypotheses:
- hypothesis_group_id: polyprenol_competition_model
  hypothesis_label: Raised Polyprenol-to-Dolichol Ratio Model
  status: CANONICAL
  description: >-
    The operative lesion is not the absence of dolichol but the accumulation of its
    unreduced precursor. Fibroblasts from a patient homozygous for an exon 1 stop
    codon, with no functional polyprenol reductase, contained normal amounts of
    dolichol together with elevated polyprenol, yet still hypoglycosylated
    transferrin. On this model the excess polyprenol competes with dolichol at the
    initiation of N-glycan assembly without being able to support glycosylation, so
    the pathogenic quantity is the ratio rather than the dolichol level. It also
    accounts for why complete dolichol loss is not seen: an alternative dolichol
    biosynthetic route persists, and its absence would be expected to be lethal.
  evidence:
  - reference: PMID:22304929
    reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantification of dolichol and unreduced polyprenol in the patient's
      fibroblasts demonstrated a high polyprenol/dolichol ratio with normal amounts
      of dolichol, indicating that high polyprenol levels might compete with dolichol
      for the initiation of N-glycan assembly but without supporting normal
      glycosylation
    explanation: >-
      The measurement and the interpretation this hypothesis is built on, stated by
      the authors who made it.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypothesized that one explanation may be not the absence of dolichol (which
      would be lethal) but the increased ratio of polyprenol to dolichol leading to
      the phenotype associated with SRD5A3-CDG
    explanation: >-
      An independent restatement of the model, including the argument that dolichol
      absence would not be survivable.
  notes: >-
    Recorded as CANONICAL because it is the only mechanism proposed in this
    literature and is consistent with the fibroblast measurements, not because it has
    been tested against an alternative. The competition step itself is inferred from
    the lipid ratio; no assay of polyprenol-linked glycan initiation is cited.
pathophysiology:
- name: SRD5A3 Polyprenol Reductase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic SRD5A3 variants abolish or reduce polyprenol reductase, the enzyme
    that reduces the alpha-isoprene unit of polyprenol to yield dolichol. Reported
    alleles are predominantly nonsense and frameshift changes; a missense allele
    modelled onto the predicted protein structure falls in a potential active site
    and is predicted to reduce catalytic efficiency rather than abolish it, which
    fits the milder phenotype seen in compound heterozygotes.

    What that enzymatic step is has been revised since SRD5A3 was identified. Finding the
    gene, together with its yeast counterpart, established the view that dolichol is made
    from polyprenol in one step; the later discovery of DHRSX in CDG patients replaced
    that with a three-step detour pathway, now shown to be conserved in yeast. The
    revision matters for this entry in a specific way: the yeast DHRSX counterpart cannot
    be substituted for by SRD5A3, so the two are separate, non-redundant steps rather
    than alternative routes to the same product. Whatever preserves dolichol levels in
    SRD5A3-null patient fibroblasts, it is not DHRSX standing in for the missing enzyme.
  genes:
  - preferred_term: SRD5A3
    term:
      id: hgnc:25812
      label: SRD5A3
  molecular_functions:
  - preferred_term: polyprenol reductase activity
    term:
      id: GO:0102389
      label: polyprenol reductase activity
    modifier: DECREASED
  downstream:
  - target: Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
    causal_link_type: DIRECT
    description: >-
      Loss of the reductase leaves its substrate unconsumed, which is what raises the
      polyprenol-to-dolichol ratio.
    evidence:
    - reference: PMID:22304929
      reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Quantification of dolichol and unreduced polyprenol in the patient's
        fibroblasts demonstrated a high polyprenol/dolichol ratio with normal amounts
        of dolichol
      explanation: >-
        The direct measurement of substrate accumulation in patient cells.
  evidence:
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a new type of CDG caused by mutations in the steroid 5alpha-reductase
      type 3 (SRD5A3) gene.
    explanation: >-
      The report establishing SRD5A3 as the causal gene for this CDG.
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that SRD5A3 is necessary for the reduction of the alpha-isoprene unit
      of polyprenols to form dolichols, required for synthesis of dolichol-linked
      monosaccharides, and the oligosaccharide precursor used for N-glycosylation.
    explanation: >-
      Identifies the exact enzymatic step lost, and why losing it reaches
      N-glycosylation.
  - reference: PMID:33403770
    reference_title: "SRD5A3-CDG: 3D structure modeling, clinical spectrum, and computer-based dysmorphic facial recognition."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      predicted that the p.(Ser154Pro) variant is located in a potential active site
      and is capable of reducing its catalytic efficiency
    explanation: >-
      Structural modelling of a missense allele. This is an in silico prediction, not
      a measured enzyme activity, and is graded accordingly.
  - reference: PMID:42201967
    reference_title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a recent discovery of DHRSX in CDG patients revised this view and led to the
      proposal of a three-step detour pathway for dolichol biosynthesis
    explanation: >-
      Records that the one-step model this entry's enzymatic description was originally
      written against has been superseded, which is why the node describes the pathway
      context rather than only the reaction.
  - reference: PMID:42201967
    reference_title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All these phenotypes were rescued by expression of DHRSX, but not by DFG10 or
      SRD5A3.
    explanation: >-
      A rescue experiment showing the two enzymes are not interchangeable. This is the
      basis for the node's statement that DHRSX is not the route that preserves dolichol
      in SRD5A3-null cells, and it constrains the entry's canonical hypothesis, which
      leaves that route unidentified.
- name: Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
  biological_scale: MOLECULAR
  description: >-
    Unreduced polyprenol accumulates while dolichol levels remain near normal,
    because an alternative dolichol biosynthetic route persists. The resulting shift
    in the ratio, rather than a shortage of dolichol, is the proposed proximate cause
    of hypoglycosylation: excess polyprenol is thought to compete with dolichol at
    the initiation of glycan assembly without being able to carry the glycan.
  downstream:
  - target: Impaired Dolichol-Linked Oligosaccharide Assembly
    causal_link_type: DIRECT
    hypothesis_groups:
    - polyprenol_competition_model
    description: >-
      Competition by the accumulated precursor at the initiation step is the proposed
      route from the lipid imbalance to defective oligosaccharide assembly.
    evidence:
    - reference: PMID:22304929
      reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        high polyprenol levels might compete with dolichol for the initiation of
        N-glycan assembly but without supporting normal glycosylation
      explanation: >-
        The proposed competition step. The authors' hedge is preserved: this is a
        mechanism inferred from the lipid ratio, not a measured competition.
      directness: INDIRECT
  evidence:
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The presence of residual dolichol in cells depleted for this enzyme suggests the
      existence of an unexpected alternative pathway for dolichol de novo biosynthesis.
    explanation: >-
      Explains why dolichol is not simply absent, which is what forces the mechanism
      onto the ratio rather than onto depletion.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SRD5A3 is not the sole producer of dolichol since evaluation of fibroblasts from
      a child with a homozygous stop codon in exon one at p.Trp19X in SRD5A3 found
      normal levels of dolichol but elevated polyprenol levels
    explanation: >-
      Independent statement that a complete null allele still leaves normal dolichol,
      with elevated polyprenol.

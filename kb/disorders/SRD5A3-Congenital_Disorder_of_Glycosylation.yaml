differential_diagnoses:
- name: DOLK-congenital disorder of glycosylation
  description: >-
    The disorder of the immediately adjacent step, in which dolichol is converted to
    dolichol phosphate. It shares the ichthyosiform skin change, seizures and
    hypotonia but characteristically causes cardiomyopathy and does not produce the
    prominent eye involvement that defines SRD5A3-CDG. The contrast is mechanistically
    informative: it is what makes the ocular phenotype look like a consequence of
    polyprenol accumulation rather than of downstream hypoglycosylation alone.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the conversion of dolichol to dolichol phosphate by DOLK leads to cardiomyopathy,
      seizures, hypotonia, and ichthyosiform skin changes, but significant eye
      abnormalities have not been reported
    explanation: >-
      The direct comparison between the two adjacent pathway defects, including the
      absence of eye involvement in the downstream one.
discussions:
- discussion_id: tissue_selectivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the cerebellum and optic pathway bear the brunt of a defect in a
    biosynthetic step that is required by every cell?
  attaches_to:
  - pathophysiology#Cerebellar and Optic Pathway Vulnerability
  - pathophysiology#Systemic Protein Hypoglycosylation
  rationale: >-
    Serum glycoproteomics shows hypoglycosylation is broad, affecting most measured
    glycopeptides, yet the clinical phenotype is dominated by two tissues. One
    hypothesis has been offered - particular sensitivity of the optic nerve to
    accumulated polyprenol, supported by the contrast with DOLK-CDG, which sits one
    step downstream, shares the skin and seizure phenotype and lacks the eye
    involvement. That contrast is suggestive but is a comparison between two small
    case literatures, not an experiment. Nothing in the cited work measures polyprenol
    in neural or retinal tissue, so the edge from hypoglycosylation to tissue
    selectivity is left with unknown intermediates in this pathograph.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The optic nerve may be more sensitive to accumulation of polyprenol and this
      could explain why optic nerve atrophy/hypoplasia are ubiquitous in SRD5A3-CDG but
      not as frequent in other N-linked CDG.
    explanation: >-
      The single proposed explanation for the selectivity, stated as a hypothesis by
      its authors.
  - reference: PMID:41732066
    reference_title: Extensive Hypoglycosylation of Serum N-Glycoproteins in SRD5A3 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with 245 of 291 altered glycopeptides decreased in SRD5A3-CDG
    explanation: >-
      Establishes that the biochemical defect is broad, which is what makes the narrow
      clinical selectivity require an explanation.
- discussion_id: no_mouse_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is there still no isolated Srd5a3 mouse model of this disease, and does the one
    published mouse deletion covering the locus tell us anything about it?
  attaches_to:
  - pathophysiology#SRD5A3 Polyprenol Reductase Deficiency
  rationale: >-
    The absence is documentable rather than merely apparent, which is unusual for a
    negative. A spontaneous mouse mutant carrying a megabase-scale 5qC3.3 deletion does
    remove Srd5a3, and homozygotes die at peri-implantation - but that lethality was traced
    to Exoc1, one of the other eight genes in the interval, and confirmed by making an
    Exoc1 knockout separately and by showing that a CRISPR-engineered deletion of the same
    interval lacking the Exoc1 defect does not kill the embryo. So the only mouse in this
    literature that lacks Srd5a3 tells us nothing about Srd5a3, and it would be a mistake to
    read peri-implantation lethality as this gene's phenotype. The gap that leaves is
    consequential: the disorder's defining features are ocular malformation and cerebellar
    hypoplasia, and neither the patient fibroblasts nor the C. elegans model can address
    them. Every tissue-selectivity question in this entry is unanswerable without a
    vertebrate model.
  evidence:
  - reference: PMID:26346620
    reference_title: Peri-implantation lethality in mice carrying megabase-scale deletion on 5qc3.3 is caused by Exoc1 null mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic investigation revealed deletion of a > 1.2-Mb genomic region containing nine
      genes (Kit, Kdr, Srd5a3, Tmeme165, Clock, Pdcl2, Nmu, Exoc1, and Cep135).
    explanation: >-
      Establishes that the only published mouse lacking Srd5a3 lacks eight other genes too.
  - reference: PMID:26346620
    reference_title: Peri-implantation lethality in mice carrying megabase-scale deletion on 5qc3.3 is caused by Exoc1 null mutation.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We concluded that peri-implantation lethality in Kit(WS/WS) was caused by a monogenic
      defect of Exoc1.
    explanation: >-
      Graded REFUTE because it contradicts the reading this mouse would otherwise invite -
      that deleting Srd5a3 is embryonic lethal in mouse. The lethality is Exoc1's.
- discussion_id: alternative_dolichol_pathway
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What is the alternative route to dolichol that maintains near-normal dolichol
    levels in cells with no functional polyprenol reductase, and does variation in it
    contribute to the phenotypic variability between siblings with identical alleles?
  attaches_to:
  - pathophysiology#Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
  - mechanistic_hypotheses#polyprenol_competition_model
  rationale: >-
    Two independent groups found residual or normal dolichol in cells lacking the
    enzyme and concluded that another biosynthetic route must exist; neither
    identified it. This is not a loose end but the load-bearing assumption of the
    ratio model, since that model requires dolichol to be present in order for
    polyprenol to compete with it. It also offers a candidate explanation for the
    within-family variability seen on identical homozygous alleles, if tissues differ
    in how far they rely on the alternative route.
  evidence:
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The presence of residual dolichol in cells depleted for this enzyme suggests the
      existence of an unexpected alternative pathway for dolichol de novo biosynthesis.
    explanation: >-
      The original observation and its interpretation, from the paper that identified
      the gene.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different cell lines may also variably rely on the de novo pathway versus
      potential alternate pathways or salvage from turnover.
    explanation: >-
      Raises the tissue-variable reliance that this question asks about.
notes: >-
  Naming. Current CDG nomenclature is gene-first, so this entry is SRD5A3-CDG. The
  older designation CDG-Iq (and "CDG1q") is retained as a synonym because much of the
  primary literature uses it.

  Frequency bands. The largest phenotype review grades features qualitatively -
  "nearly every affected individual", "ubiquitous", "multiple individuals have been
  reported" - and no source gives per-feature percentages. Bands here follow that
  ordering, and each phenotype's evidence explanation says which wording it rests on.
  Where a feature is documented only in individual case descriptions, OCCASIONAL is
  used as the conservative default rather than a band inferred from case counts in a
  literature of about 43 patients.

  Mechanism, and what is not asserted. The pathograph deliberately routes the
  phenotype through the polyprenol-to-dolichol ratio rather than through dolichol
  depletion, because two independent groups measured normal dolichol in enzyme-null
  cells. The competition step itself is inferred from that ratio and is recorded as a
  hypothesis with its authors' hedging preserved. The edge from systemic
  hypoglycosylation to the cerebellar and optic phenotype is marked
  INDIRECT_UNKNOWN_INTERMEDIATES rather than being filled in with a plausible route.

  Models, and a documented absence. There is no `animal_models:` section because there is
  no vertebrate model of this disease, and that is now a cited finding rather than an
  assertion: the one published mouse lacking Srd5a3 lacks eight neighbouring genes as well,
  and its peri-implantation lethality was traced to Exoc1 rather than to Srd5a3. That is
  recorded as a knowledge gap with REFUTE-graded evidence against the obvious
  misinterpretation. The models that do exist - patient fibroblasts and a C. elegans W19X
  line - are curated under `experimental_models:`.

  Therapy. Atorvastatin is recorded as an explicitly experimental entry, not as treatment
  in use. No patient has received it for this indication and no trial is reported; what
  exists is a rescue in the worm model and correction of the polyprenol-to-dolichol ratio in
  patient fibroblasts. It is included because the reasoning is mechanistically informative -
  an HMG-CoA reductase inhibitor helps only if the pathogenic quantity is the ratio rather
  than the dolichol level, so the result is also evidence for this entry's central model.
  No clinical trials are recorded, because none is reported.

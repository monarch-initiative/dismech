- name: Progressive Ocular and Skeletal Degeneration
  biological_scale: TISSUE
  description: >-
    A second arm of the phenotype: features that worsen with time rather than being
    fixed at birth. Adults with SRD5A3-CDG develop cataracts, retinal degeneration and
    kyphosis that were not present in childhood, so the disorder is progressive rather
    than purely static. This is the basis for the recommendation that children diagnosed
    with SRD5A3-CDG be monitored for these complications as they age.

    The retinal component needs a distinction the sources do not always make. It is
    progressive, but it is not late-onset: cohorts ascertained through eye clinics find
    visual loss by age three and a rod-cone dystrophy on imaging in patients whose
    retinas were never examined that way before. What arrives late is the diagnosis, not
    the disease. Cataract and kyphosis, by contrast, are documented as genuinely absent
    in childhood and present in the same patients as adults.

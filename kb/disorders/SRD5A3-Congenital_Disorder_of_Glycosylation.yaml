- name: Retinal dystrophy
  category: Clinical
  description: >-
    Progressive retinal degeneration. The age at which it is recognised spans the whole
    reported range and appears to depend on how hard it is looked for rather than on when
    it begins: one patient was found to have it in her twenties, whereas a series
    ascertained through eye clinics rather than through metabolic medicine found visual
    loss by age three in every affected individual, with rod and cone dysfunction on
    electrodiagnostic testing. In a third case, imaging showed retinal dystrophy that had
    not been recognised at all until the study that reported it. Onset is therefore
    curated as childhood, not adult.

    On the binding: only one cited source names the specific entity retinitis pigmentosa,
    in one adult patient. The others report "retinal dystrophy" or "early-onset retinal
    dystrophy" without establishing the rod-before-cone sequence that rod-cone dystrophy
    asserts, and the one electrodiagnostic result describes rod and cone dysfunction
    together. So this is bound to the more general HP:0000556 rather than to HP:0000510,
    which would claim more than the sources carry.
  phenotype_term:
    preferred_term: Retinal dystrophy
    term:
      id: HP:0000556
      label: Retinal dystrophy
    onset:
      onset_category: CHILDHOOD
  frequency: FREQUENT
  evidence:
  - reference: PMID:28253385
    reference_title: Association of Steroid 5α-Reductase Type 3 Congenital Disorder of Glycosylation With Early-Onset Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the SRD5A3 gene may cause early-onset retinal dystrophy, a previously
      underdescribed feature of the SRD5A3-CDG disorder that is progressive and may lead
      to serious visual impairment.
    explanation: >-
      Seven affected individuals from four unrelated families, all homozygous for the
      same allele, ascertained as retinal dystrophy rather than as a glycosylation
      disorder. This is the basis for raising the frequency band and moving onset
      earlier.
  - reference: PMID:28253385
    reference_title: Association of Steroid 5α-Reductase Type 3 Congenital Disorder of Glycosylation With Early-Onset Retinal Dystrophy.

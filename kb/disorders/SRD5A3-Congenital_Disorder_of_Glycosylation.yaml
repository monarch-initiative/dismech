- name: Systemic Protein Hypoglycosylation
  biological_scale: ORGANISM
  description: >-
    Secreted and membrane glycoproteins carry fewer or truncated N-glycans. Serum
    glycoproteomics in patients shows the change is broad rather than selective, and
    the affected proteins include several whose deficiency has recognised clinical
    consequences - haptoglobin, plasma serine protease inhibitor, alpha-1-B
    glycoprotein, alpha-2-macroglobulin and ceruloplasmin. Hypoglycosylation is
    partial rather than complete: a patient with no functional enzyme still
    glycosylated most of their transferrin correctly.

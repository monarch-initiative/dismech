        dysfunction, and mevalonate pathway dysregulation.
      explanation: >-
        The model, its genotype, and the phenotypes it reproduces.
diagnosis:
- name: Transferrin screening followed by SRD5A3 sequencing
  diagnosis_term:
    preferred_term: carbohydrate-deficient transferrin measurement
    term:
      id: NCIT:C101016
      label: Carbohydrate-Deficient Transferrin Measurement
  description: >-
    Suspicion is raised by the combination of developmental delay, nystagmus with an
    optic nerve abnormality and ataxia. Carbohydrate-deficient transferrin testing
    showing a type 1 pattern places the disorder among the CDG type I group, and
    sequencing of SRD5A3 confirms it. The screening step is imperfect, because
    hypoglycosylation is partial even in patients with no functional enzyme, so a
    normal or near-normal transferrin profile does not exclude the diagnosis.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the normal levels of dolichol, there was hypoglycosylation with only 70%
      of transferrin in serum correctly glycosylated.
    explanation: >-
      Quantifies how mild the screening abnormality can be in a patient with a complete
      enzyme null, which is why the screen is not a rule-out.
  - reference: PMID:41732066
    reference_title: Extensive Hypoglycosylation of Serum N-Glycoproteins in SRD5A3 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some of these alterations could be further pursued to develop glycopeptide-based
      biomarkers as the current diagnosis of SRD5A3-CDG by screening assays remains
      challenging.
    explanation: >-
      States the diagnostic gap and the proposed direction for closing it.
- name: Dysmorphology-assisted recognition
  description: >-
    Recurrent facial features have been catalogued and used to build an automated
    2D facial-image classifier for SRD5A3-CDG. The reported accuracy is from the
    developers' own validation on published and in-house cases; it has not been
    independently replicated, so it is recorded here as a proposed adjunct rather
    than an established diagnostic test.
  evidence:
  - reference: PMID:33403770
    reference_title: "SRD5A3-CDG: 3D structure modeling, clinical spectrum, and computer-based dysmorphic facial recognition."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Based on facial digital 2D images, we successfully designed and validated a
      SRD5A3-CDG computer based dysmorphic facial analysis, which achieved 92.5%
      accuracy.
    explanation: >-
      The reported performance of the classifier, from the group that built it.
  - reference: PMID:33403770
    reference_title: "SRD5A3-CDG: 3D structure modeling, clinical spectrum, and computer-based dysmorphic facial recognition."
    supports: SUPPORT

biochemical:
- name: Elevated polyprenol-to-dolichol ratio
  presence: INCREASED
  biomarker_term:
    preferred_term: polyprenol-to-dolichol ratio
  context: >-
    Measured by lipid quantification in cultured patient fibroblasts. NCIT has no term for
    either lipid - searching it returns the reductase protein and the SRD5A3 allele, not
    the analytes - so this biomarker is deliberately left with a free-text preferred_term
    rather than bound to an unrelated code.
  notes: >-
    This is the biochemical signature that defines the disorder and the measurement the
    whole mechanism of this entry rests on. Its diagnostic value is unusual in shape: the
    abnormality is the ratio, not either quantity on its own, because dolichol itself is
    normal in cells with no functional enzyme. A laboratory measuring dolichol alone would
    report a normal result in a patient with a null allele.

    It is also the one readout shown to be pharmacologically movable, which is why it
    appears again as the target of the atorvastatin entry.
  evidence:
  - reference: PMID:22304929
    reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantification of dolichol and unreduced polyprenol in the patient's
      fibroblasts demonstrated a high polyprenol/dolichol ratio with normal amounts
      of dolichol
    explanation: >-
      The measurement itself, including the normal dolichol level that makes the ratio
      rather than the level the informative quantity.
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The presence of residual dolichol in cells depleted for this enzyme suggests the
      existence of an unexpected alternative pathway for dolichol de novo biosynthesis.
    explanation: >-
      Independent confirmation from the gene-discovery paper that dolichol is not depleted,
      which is what a laboratory interpreting a dolichol level alone would misread.
  readouts:
  - target: Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The ratio is the direct measurement of the node it reports on, in the tissue the
      measurement was made in.
    evidence:
    - reference: PMID:22304929
      reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        demonstrated a high polyprenol/dolichol ratio with normal amounts of dolichol
      explanation: >-
        The raised ratio in patient cells, which is the node's own defining quantity.
  - target: SRD5A3 Polyprenol Reductase Deficiency
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Correction of the ratio in patient fibroblasts is the readout the one candidate
      therapy was assessed against, so it doubles as a pharmacodynamic marker for any
      future attempt to treat the enzymatic lesion.
    evidence:
    - reference: PMID:41648237
      reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        restored polyprenol-to-dolichol ratios in patient fibroblasts
      explanation: >-
        The ratio used as the drug-response endpoint in patient cells.
animal_models:
- name: C. elegans SRD5A3 W19X model
  species: Caenorhabditis elegans
  genotype: srd-5a3 W19X homozygous (patient nonsense allele knock-in)
  publication: PMID:41648237
  description: >-
    The first disease model for SRD5A3-CDG, and the reason a therapeutic candidate exists
    at all. Worms homozygous for the W19X nonsense allele - the same allele carried by the
    patient whose fibroblast lipid measurements underpin this entry's mechanism - reproduce
    developmental delay, neurological dysfunction and mevalonate pathway dysregulation. It
    was built specifically to be screenable, which a mouse model would not be even if one
    existed.

    The choice of allele matters more than "commonly observed in patients" conveys. W19X is
    the most frequently reported allele in this disorder: it is the homozygous genotype of
    all seven patients in the four-family retinal-dystrophy series and of the reported twin
    pair, as well as of the fibroblast donor. So the model is built on the allele that the
    largest share of published patients actually carry, rather than on a convenient null.
  modeled_mechanisms:
  - target: SRD5A3 Polyprenol Reductase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Carries a patient allele and reproduces disease-relevant phenotypes at the organismal
      level, including a mevalonate-pathway readout that connects the lesion to the isoprenoid
      supply upstream of polyprenol.
    limitations: >-
      An invertebrate. It cannot model the features that define the human disease clinically
      - the ocular malformations, the cerebellar vermis hypoplasia, the skin phenotype - so
      its value is as a screening system and a mechanism probe, not as a phenocopy.
    readouts:
    - name: Motility in a high-throughput screen
      target: SRD5A3 Polyprenol Reductase Deficiency
      direction: DECREASED
      interpretation: >-
        The screenable phenotype the drug repurposing screen was run against.
      evidence:
      - reference: PMID:41648237
        reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using this model, we conducted a high-throughput motility-based drug repurposing
          screen and identified atorvastatin, an FDA-approved HMG-CoA reductase inhibitor, as
          a repurposing candidate.
        explanation: >-
          Names the readout and what it was used for.
    evidence:
    - reference: PMID:41648237
      reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we developed the first C. elegans model of SRD5A3-CDG, harboring the homozygous W19X
        nonsense mutation commonly observed in patients. This model recapitulates

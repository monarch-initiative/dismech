genetic:
- name: SRD5A3 pathogenic variants
  gene_term:
    preferred_term: SRD5A3
    term:
      id: hgnc:25812
      label: SRD5A3
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    All reported alleles act by loss of function. Most are nonsense or frameshift changes in the homozygous state,
    arising in consanguineous families; documented examples include c.57G>A
    (p.Trp19X) and c.603G>A (p.Trp201X). Compound heterozygosity with a missense
    allele is less common and was first described in adults whose cognitive phenotype
    was milder, consistent with residual catalytic activity. Genotype does not
    determine the full phenotype: siblings homozygous for the same nonsense allele
    differ in whether they have structural eye anomalies or skin involvement.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing of SRD5A3 was performed and confirmed a novel homozygous
      nonsense mutation
    explanation: >-
      A documented homozygous null allele in affected siblings.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These two are of interest because they are among the first individuals reported
      with SRD5A3-CDG due to compound heterozygous mutations with one of the mutations
      being a missense mutation.
    explanation: >-
      Establishes compound heterozygosity with a missense allele as the less common
      genotype, in the two patients with the mildest cognitive phenotype.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 has more severe skin findings and marked short stature while her
      brother has an average stature and more severe structural eye abnormalities with
      retinal and iris colobomas.
    explanation: >-
      Within-family divergence on an identical genotype, which is the evidence that
      genotype does not fix the phenotype here.
  - reference: PMID:35339718
    reference_title: "SRD5A3-CDG: Twins with an intragenic tandem duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only when applying exome-based copy number analysis, we identified as a second
      compound heterozygous variant a previously not reported tandem duplication of exons
      2-4 in SRD5A3.
    explanation: >-
      A structural allele that standard exome analysis missed, in patients who were
      clinically typical. It is the reason this entry's diagnosis section should not be read
      as saying sequencing alone settles the question.
  - reference: PMID:30019980
    reference_title: Early-onset retinal dystrophy and chronic dermatitis in a girl with an undiagnosed congenital disorder of glycosylation (SRD5A3-CDG).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early-onset retinal dystrophy is usually isolated but can also be the presenting
      manifestation of an undiagnosed systemic disease.
    explanation: >-
      Records the presentation route that most often delays diagnosis here: an isolated-looking
      retinal dystrophy in a child who in fact has a multisystem glycosylation disorder.
  - reference: PMID:22304929
    reference_title: "Life with too much polyprenol: polyprenol reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with no functional protein was found in the patient, about 70% of transferrin
    explanation: >-
      Establishes that the patient whose fibroblast lipid measurements underpin the
      mechanistic model carried an allele leaving no functional protein, and that most
      of their transferrin was nonetheless glycosylated normally.
  variants:
  - name: SRD5A3 c.57G>A (p.Trp19X)
    description: >-
      An exon 1 nonsense allele leaving no functional protein. It is the genotype behind
      the entry's central mechanistic observation: fibroblasts from this homozygous patient
      still contained normal dolichol while accumulating polyprenol, which is what forces
      the mechanism onto the polyprenol-to-dolichol ratio rather than onto dolichol
      depletion.
    gene:
      preferred_term: SRD5A3
      term:
        id: hgnc:25812
        label: SRD5A3
    type: NONSENSE
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: polyprenol reductase activity
      description: >-
        Abolishes the enzyme. Despite that, dolichol levels are preserved, implying an
        alternative biosynthetic route.
    evidence:
    - reference: PMID:27480077
      reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        evaluation of fibroblasts from a child with a homozygous stop codon in exon one at
        p.Trp19X in SRD5A3 found normal levels of dolichol but elevated polyprenol levels
      explanation: >-
        Names the allele and reports the lipid measurements made in cells carrying it.
  - name: SRD5A3 c.603G>A (p.Trp201X)

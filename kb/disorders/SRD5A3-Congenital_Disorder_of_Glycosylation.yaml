differential_diagnoses:
- name: DOLK-congenital disorder of glycosylation
  description: >-
    The disorder of the immediately adjacent step, in which dolichol is converted to
    dolichol phosphate. It shares the ichthyosiform skin change, seizures and
    hypotonia but characteristically causes cardiomyopathy and does not produce the
    prominent eye involvement that defines SRD5A3-CDG. The contrast is mechanistically
    informative: it is what makes the ocular phenotype look like a consequence of
    polyprenol accumulation rather than of downstream hypoglycosylation alone.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the conversion of dolichol to dolichol phosphate by DOLK leads to cardiomyopathy,
      seizures, hypotonia, and ichthyosiform skin changes, but significant eye
      abnormalities have not been reported
    explanation: >-
      The direct comparison between the two adjacent pathway defects, including the
      absence of eye involvement in the downstream one.
discussions:
- discussion_id: tissue_selectivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the cerebellum and optic pathway bear the brunt of a defect in a
    biosynthetic step that is required by every cell?
  attaches_to:
  - pathophysiology#Cerebellar and Optic Pathway Vulnerability
  - pathophysiology#Systemic Protein Hypoglycosylation
  rationale: >-
    Serum glycoproteomics shows hypoglycosylation is broad, affecting most measured
    glycopeptides, yet the clinical phenotype is dominated by two tissues. One
    hypothesis has been offered - particular sensitivity of the optic nerve to
    accumulated polyprenol, supported by the contrast with DOLK-CDG, which sits one
    step downstream, shares the skin and seizure phenotype and lacks the eye
    involvement. That contrast is suggestive but is a comparison between two small
    case literatures, not an experiment. Nothing in the cited work measures polyprenol
    in neural or retinal tissue, so the edge from hypoglycosylation to tissue
    selectivity is left with unknown intermediates in this pathograph.

    The obvious rival explanation has been checked and does not work. If affected tissues
    were simply the ones that need the most SRD5A3, baseline expression would track the
    phenotype; across twelve CDG genes in healthy human tissue it does not. What that
    survey does find for SRD5A3 is among the strongest tissue-specific departures from
    balanced biallelic expression of any gene it examined, which is a different kind of
    candidate and an untested one. So the gap is not that nobody has looked - it is that
    the cheapest explanation has been ruled out and the remaining ones are unmeasured in
    the tissues that matter.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The optic nerve may be more sensitive to accumulation of polyprenol and this
      could explain why optic nerve atrophy/hypoplasia are ubiquitous in SRD5A3-CDG but
      not as frequent in other N-linked CDG.
    explanation: >-
      The single proposed explanation for the selectivity, stated as a hypothesis by
      its authors.
  - reference: PMID:41732066
    reference_title: Extensive Hypoglycosylation of Serum N-Glycoproteins in SRD5A3 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with 245 of 291 altered glycopeptides decreased in SRD5A3-CDG
    explanation: >-
      Establishes that the biochemical defect is broad, which is what makes the narrow
      clinical selectivity require an explanation.
  - reference: PMID:42472049
    reference_title: "Tissue-specific expression and regulation of congenital disorders of glycosylation genes: A GTEx-based in silico study."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      the molecular basis for their tissue-specific manifestations remains poorly
      understood
    explanation: >-
      Confirms that this gap is recognised across the CDGs rather than being specific to
      how this entry is curated.
- discussion_id: no_mouse_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is there still no isolated Srd5a3 mouse model of this disease, and does the one
    published mouse deletion covering the locus tell us anything about it?
  attaches_to:
  - pathophysiology#SRD5A3 Polyprenol Reductase Deficiency
  rationale: >-
    The absence is documentable rather than merely apparent, which is unusual for a
    negative. A spontaneous mouse mutant carrying a megabase-scale 5qC3.3 deletion does
    remove Srd5a3, and homozygotes die at peri-implantation - but that lethality was traced
    to Exoc1, one of the other eight genes in the interval, and confirmed by making an
    Exoc1 knockout separately and by showing that a CRISPR-engineered deletion of the same
    interval lacking the Exoc1 defect does not kill the embryo. So the only mouse in this
    literature that lacks Srd5a3 tells us nothing about Srd5a3, and it would be a mistake to
    read peri-implantation lethality as this gene's phenotype. The gap that leaves is
    consequential: the disorder's defining features are ocular malformation and cerebellar
    hypoplasia, and neither the patient fibroblasts nor the C. elegans model can address
    them. Every tissue-selectivity question in this entry is unanswerable without a
    vertebrate model.
  evidence:
  - reference: PMID:26346620
    reference_title: Peri-implantation lethality in mice carrying megabase-scale deletion on 5qc3.3 is caused by Exoc1 null mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic investigation revealed deletion of a > 1.2-Mb genomic region containing nine
      genes (Kit, Kdr, Srd5a3, Tmeme165, Clock, Pdcl2, Nmu, Exoc1, and Cep135).
    explanation: >-
      Establishes that the only published mouse lacking Srd5a3 lacks eight other genes too.
  - reference: PMID:26346620
    reference_title: Peri-implantation lethality in mice carrying megabase-scale deletion on 5qc3.3 is caused by Exoc1 null mutation.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We concluded that peri-implantation lethality in Kit(WS/WS) was caused by a monogenic
      defect of Exoc1.
    explanation: >-
      Graded REFUTE because it contradicts the reading this mouse would otherwise invite -
      that deleting Srd5a3 is embryonic lethal in mouse. The lethality is Exoc1's.
- discussion_id: alternative_dolichol_pathway
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What is the alternative route to dolichol that maintains near-normal dolichol
    levels in cells with no functional polyprenol reductase, and does variation in it
    contribute to the phenotypic variability between siblings with identical alleles?
  attaches_to:
  - pathophysiology#Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
  - mechanistic_hypotheses#polyprenol_competition_model
  rationale: >-
    Two independent groups found residual or normal dolichol in cells lacking the
    enzyme and concluded that another biosynthetic route must exist; neither
    identified it. This is not a loose end but the load-bearing assumption of the
    ratio model, since that model requires dolichol to be present in order for
    polyprenol to compete with it. It also offers a candidate explanation for the
    within-family variability seen on identical homozygous alleles, if tissues differ
    in how far they rely on the alternative route.

    One candidate can now be excluded. Dolichol biosynthesis is no longer thought to be
    the single step SRD5A3 was originally assigned: DHRSX, found in CDG patients after
    SRD5A3 was, defines a three-step detour pathway that has since been shown to be
    conserved in yeast. That makes DHRSX the obvious suspect for the compensating route.
    It is not: in the yeast system, deleting the DHRSX counterpart produces glycosylation
    defects, low dolichol and polyprenol accumulation - the same picture as this disease -
    and expressing DHRSX rescues it while expressing SRD5A3 does not. The two enzymes are
    non-redundant steps in one pathway, so DHRSX cannot substitute for a missing SRD5A3.
    The question stands, with one fewer answer available.
  evidence:
  - reference: PMID:20637498
    reference_title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The presence of residual dolichol in cells depleted for this enzyme suggests the
      existence of an unexpected alternative pathway for dolichol de novo biosynthesis.
    explanation: >-
      The original observation and its interpretation, from the paper that identified
      the gene.
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different cell lines may also variably rely on the de novo pathway versus
      potential alternate pathways or salvage from turnover.
    explanation: >-
      Raises the tissue-variable reliance that this question asks about.
  - reference: PMID:42201967
    reference_title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Deletion of TDA5 caused glycosylation defects, reduced dolichol levels, and
      accumulated polyprenol.
    explanation: >-
      Shows that losing the DHRSX step reproduces this disease's biochemistry in yeast,
      which is what makes it a plausible candidate for the compensating route before the
      rescue experiment rules it out.
  - reference: PMID:42201967
    reference_title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      All these phenotypes were rescued by expression of DHRSX, but not by DFG10 or
      SRD5A3.
    explanation: >-
      Cited as REFUTE against DHRSX being the alternative route that preserves dolichol
      when SRD5A3 is absent. The two enzymes cannot substitute for each other in either
      direction, which is what excludes the candidate.
- discussion_id: corticospinal_involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a corticospinal or neuromuscular component to SRD5A3-CDG beyond the
    cerebellar and ocular involvement that defines it?
  attaches_to:
  - pathophysiology#Cerebellar and Optic Pathway Vulnerability
  - genetic#SRD5A3 pathogenic variants
  rationale: >-
    One patient has been reported with a proximal limb-girdle pattern of weakness,
    diffusely brisk reflexes and bilateral extensor plantar responses alongside the usual
    retinal dystrophy, ataxia and ichthyosiform skin change, and the authors propose this
    as an expansion of the neurological phenotype.

    This entry records the allele but does not curate limb-girdle weakness, hyperreflexia
    or extensor plantar responses as phenotypes. That is a deliberate line rather than an
    omission. It is a single patient; upper and lower motor neuron signs in a child with
    a multisystem disorder and marked hypotonia have several possible readings; and the
    features that would distinguish a genuine corticospinal component from an incidental
    one - imaging of the tracts, nerve conduction, muscle histology - are not reported.
    Curating three new phenotypes off one case would put them on the same footing as
    findings established across cohorts.

    Resolving it needs targeted neurological examination in an existing SRD5A3-CDG
    cohort, not another case report.
  evidence:
  - reference: PMID:41667393
    reference_title: "Clinical, biochemical and genetic characterization of an Egyptian patient with SRD5A3-congenital glycosylation disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      neurological assessment revealed proximal limb-girdle pattern of weakness,
      hyperactive reflexes, extensor plantar responses with evidence of cerebellar
      dysfunction
    explanation: >-
      The findings themselves, in the one patient they are reported in.
  - reference: PMID:41667393
    reference_title: "Clinical, biochemical and genetic characterization of an Egyptian patient with SRD5A3-congenital glycosylation disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We are expanding the neurophenotypic spectrum by reporting proximal limb-girdle
      pattern of weakness combined with diffusely brisk reflexes and bilateral extensor
      plantar responses suggestive of corticospinal or neuromuscular axis involvement
    explanation: >-
      The authors' own framing of the claim as a proposed spectrum expansion, which is
      what this discussion holds open rather than adopting.
- discussion_id: dolichol_supplementation
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Could supplying dolichol itself bypass the enzymatic block, and is there any
    experimental support for that outside human cells?
  attaches_to:
  - pathophysiology#SRD5A3 Polyprenol Reductase Deficiency
  - treatments#Atorvastatin (experimental, not established therapy)
  rationale: >-
    The one therapeutic candidate this entry carries, atorvastatin, works upstream: it
    was found in a motility screen and acts on the isoprenoid supply, not on the missing
    reduction step. A more direct idea is to replace the product. There is no human
    evidence for it, but there is a plant result that bears on whether the logic holds at
    all: in Arabidopsis, the orthologue of SRD5A3 is essential, its loss impairs protein
    glycosylation, and the resulting dolichol shortage is partially corrected by feeding
    dolichol.

    Two things stop that from being a treatment proposal. The rescue is partial and in a
    plant, whose dolichol requirements and uptake are not those of a human; and this
    entry's own mechanism argues the target may be wrong, since patient cells have normal
    dolichol already and the proposed lesion is the polyprenol-to-dolichol ratio. Adding
    dolichol would lower that ratio, so the idea is not incoherent - but it is untested,
    and the paper proposing it does so as a general suggestion for glycosylation
    disorders rather than for this one.
  evidence:
  - reference: PMID:26628744
    reference_title: POLYPRENOL REDUCTASE2 Deficiency Is Lethal in Arabidopsis Due to Male Sterility.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Shortage of dolichol in PPRD2-deficient cells is partially rescued by PPRD1
      overexpression or by supplementation with dolichol.
    explanation: >-
      The rescue result the idea rests on. Graded OTHER because the system is a plant,
      which is neither a model organism in the vertebrate sense used elsewhere in this
      entry nor an in vitro human system.
  - reference: PMID:26628744
    reference_title: POLYPRENOL REDUCTASE2 Deficiency Is Lethal in Arabidopsis Due to Male Sterility.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impaired protein glycosylation seems to be the major factor underlying these
      defects
    explanation: >-
      Establishes that the plant orthologue's loss acts through the same downstream
      consequence as the human disease, which is what makes the rescue relevant at all.
notes: >-
  Naming. Current CDG nomenclature is gene-first, so this entry is SRD5A3-CDG. The
  older designation CDG-Iq (and "CDG1q") is retained as a synonym because much of the
  primary literature uses it.

  GeneReviews. There is no GeneReviews chapter for this disorder, so there is no
  `references:` block and nothing to tag. Searched PubMed for `SRD5A3[TI]
  GeneReviews[TI]` (0 hits) and for `SRD5A3 AND GeneReviews[book]`, which returns one
  record: PMID:20301507, "Congenital Disorders of N-Linked Glycosylation and Multiple
  Pathway Overview", whose own title marks it RETIRED CHAPTER, FOR HISTORICAL REFERENCE
  ONLY. Recorded here so the search is not repeated.

  Frequency bands. The largest phenotype review grades features qualitatively -
  "nearly every affected individual", "ubiquitous", "multiple individuals have been
  reported" - and bands here follow that ordering, with each phenotype's evidence
  explanation saying which wording it rests on. Where a feature is documented only in
  individual case descriptions, OCCASIONAL is used as the conservative default rather
  than a band inferred from case counts in a literature of about 43 patients.

  Counted denominators do exist in one place and are not used as frequency bands. The
  four-family retinal-dystrophy series reports 7 of 7 with abnormal retinal imaging, 5 of
  5 tested with rod and cone dysfunction, and 6 of 7 with learning difficulties. Those are
  real numerators, but every patient in that series is homozygous for the same allele and
  every one was ascertained through an eye clinic, so the proportions describe that
  ascertainment rather than the disease. They are quoted in the relevant evidence
  explanations and were the reason the retinal phenotype's band was raised, but no band in
  this entry is set from them arithmetically.

  Mechanism, and what is not asserted. The pathograph deliberately routes the
  phenotype through the polyprenol-to-dolichol ratio rather than through dolichol
  depletion, because two independent groups measured normal dolichol in enzyme-null
  cells. The competition step itself is inferred from that ratio and is recorded as a
  hypothesis with its authors' hedging preserved. The edge from systemic
  hypoglycosylation to the cerebellar and optic phenotype is marked
  INDIRECT_UNKNOWN_INTERMEDIATES rather than being filled in with a plausible route.

  Models, and a documented absence. There is no vertebrate model of this disease, and that
  is a cited finding rather than an assertion: the one published mouse lacking Srd5a3 lacks
  eight neighbouring genes as well, and its peri-implantation lethality was traced to Exoc1
  rather than to Srd5a3. That is recorded as a knowledge gap with REFUTE-graded evidence
  against the obvious misinterpretation. The models that do exist are a C. elegans W19X
  line, curated under `animal_models:` because a worm is an animal, and patient fibroblasts,
  which appear as the setting of in vitro evidence rather than as a model entry.

  Therapy. Atorvastatin is recorded as an explicitly experimental entry, not as treatment
  in use. No patient has received it for this indication and no trial is reported; what
  exists is a rescue in the worm model and correction of the polyprenol-to-dolichol ratio in
  patient fibroblasts, reported in one sentence that this entry splits into a
  MODEL_ORGANISM item and an IN_VITRO one because it carries both. It is included because
  the reasoning is mechanistically informative -
  an HMG-CoA reductase inhibitor helps only if the pathogenic quantity is the ratio rather
  than the dolichol level, so the result is also evidence for this entry's central model.
  No clinical trials are recorded, because none is reported.

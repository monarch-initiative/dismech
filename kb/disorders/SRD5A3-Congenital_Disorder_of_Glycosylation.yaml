- name: Cerebellar and Optic Pathway Vulnerability
  biological_scale: TISSUE
  description: >-
    The cerebellum and the optic pathway are the tissues most consistently affected.
    Nearly every reported patient has cognitive delay, an optic nerve abnormality with
    nystagmus, and ataxia, frequently with cerebellar vermis hypoplasia. The optic
    involvement is not purely a developmental malformation: it also progresses,
    implicating long-term maintenance of the nerve as well as its formation. One
    proposed explanation for the selectivity is particular sensitivity of the optic
    nerve to polyprenol accumulation, which would distinguish this CDG from
    N-glycosylation defects further downstream.
  downstream:

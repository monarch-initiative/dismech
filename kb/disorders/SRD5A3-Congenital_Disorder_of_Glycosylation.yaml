name: SRD5A3-Congenital Disorder of Glycosylation
creation_date: "2026-09-01T14:07:00Z"
description: >-
  SRD5A3-CDG (formerly CDG-Iq) is an autosomal recessive congenital disorder of
  glycosylation caused by biallelic loss of SRD5A3, which encodes polyprenol
  reductase. The enzyme reduces the alpha-isoprene unit of polyprenol to form
  dolichol, the lipid carrier on which the oligosaccharide precursor for N-linked
  glycosylation is assembled and which is also required for O-mannosylation,
  C-mannosylation and GPI anchor synthesis. Because the block sits at the very
  start of the pathway, one enzymatic lesion produces hypoglycosylation of a wide
  range of secreted and membrane proteins. The clinical picture is dominated by a
  strikingly consistent neuro-ophthalmological core - cognitive delay, nystagmus
  with optic nerve hypoplasia or atrophy, and ataxia, often with cerebellar vermis
  hypoplasia - on which more variable ocular structural defects (iris and optic
  nerve coloboma), ichthyosiform skin change with palmoplantar keratoderma,
  coagulation factor deficiencies and, in adults, cataract, retinitis pigmentosa
  and kyphosis are superimposed. The mechanism is not a simple loss of dolichol:
  patient fibroblasts carrying a null allele retain normal dolichol levels while
  accumulating unreduced polyprenol, so the operative lesion is most likely the
  raised polyprenol-to-dolichol ratio rather than dolichol depletion.
synonyms:
- SRD5A3-CDG
- congenital disorder of glycosylation type Iq
- CDG1Q
- congenital disorder of glycosylation due to steroid 5alpha-reductase type 3 deficiency
- polyprenol reductase deficiency
- Kahrizi syndrome

diagnosis:
- name: Transferrin screening followed by SRD5A3 sequencing
  description: >-
    Suspicion is raised by the combination of developmental delay, nystagmus with an
    optic nerve abnormality and ataxia. Carbohydrate-deficient transferrin testing
    showing a type 1 pattern places the disorder among the CDG type I group, and
    sequencing of SRD5A3 confirms it. The screening step is imperfect, because
    hypoglycosylation is partial even in patients with no functional enzyme, so a
    normal or near-normal transferrin profile does not exclude the diagnosis.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the normal levels of dolichol, there was hypoglycosylation with only 70%
      of transferrin in serum correctly glycosylated.
    explanation: >-
      Quantifies how mild the screening abnormality can be in a patient with a complete
      enzyme null, which is why the screen is not a rule-out.
  - reference: PMID:41732066
    reference_title: Extensive Hypoglycosylation of Serum N-Glycoproteins in SRD5A3 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some of these alterations could be further pursued to develop glycopeptide-based
      biomarkers as the current diagnosis of SRD5A3-CDG by screening assays remains
      challenging.
    explanation: >-
      States the diagnostic gap and the proposed direction for closing it.
- name: Dysmorphology-assisted recognition
  description: >-
    Recurrent facial features have been catalogued and used to build an automated
    2D facial-image classifier for SRD5A3-CDG. The reported accuracy is from the
    developers' own validation on published and in-house cases; it has not been
    independently replicated, so it is recorded here as a proposed adjunct rather
    than an established diagnostic test.
  evidence:
  - reference: PMID:33403770
    reference_title: "SRD5A3-CDG: 3D structure modeling, clinical spectrum, and computer-based dysmorphic facial recognition."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Based on facial digital 2D images, we successfully designed and validated a
      SRD5A3-CDG computer based dysmorphic facial analysis, which achieved 92.5%
      accuracy.
    explanation: >-
      The reported performance of the classifier, from the group that built it.
  - reference: PMID:33403770
    reference_title: "SRD5A3-CDG: 3D structure modeling, clinical spectrum, and computer-based dysmorphic facial recognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some recurrent dysmorphic features such as arched eyebrows, wide eyes, shallow
      nasal bridge, short nose, and large mouth
    explanation: >-
      The dysmorphic features the classifier and clinical recognition both rest on.
treatments:
- name: Atorvastatin (experimental, not established therapy)
  description: >-
    The only candidate disease-modifying therapy proposed for this disorder, and it is at
    the preclinical stage. An HMG-CoA reductase inhibitor is a counter-intuitive choice
    here - it restricts the isoprenoid supply upstream of polyprenol - but the logic
    follows from this entry's mechanism: if the pathogenic quantity is the
    polyprenol-to-dolichol ratio rather than the dolichol level, then reducing polyprenol
    production should help even though it reduces flux into the pathway overall. In patient
    fibroblasts it did restore the ratio, and in the worm model it rescued the phenotype.
    Recorded here so the reasoning is visible, explicitly NOT as a treatment in clinical
    use: no patient has been treated, and no trial is reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
  target_mechanisms:
  - target: Polyprenol Accumulation with Raised Polyprenol-to-Dolichol Ratio
    description: >-
      The drug acts on the node this entry treats as the operative lesion, and the reported
      readout is that node's own measurement: the polyprenol-to-dolichol ratio in patient
      fibroblasts.
    evidence:
    - reference: PMID:41648237
      reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Atorvastatin rescued disease-relevant phenotypes in the worm model and restored
        polyprenol-to-dolichol ratios in patient fibroblasts.
      explanation: >-
        The correction of the ratio in patient cells. This is the strongest independent
        support for the ratio model in this entry, because it shows the ratio is
        pharmacologically movable and that moving it changes phenotype in the worm.
  evidence:
  - reference: PMID:41648237
    reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Atorvastatin rescued disease-relevant phenotypes in the worm model and restored

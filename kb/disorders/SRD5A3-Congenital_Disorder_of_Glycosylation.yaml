      readout is that node's own measurement: the polyprenol-to-dolichol ratio in patient
      fibroblasts.
    evidence:
    - reference: PMID:41648237
      reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        restored polyprenol-to-dolichol ratios in patient fibroblasts
      explanation: >-
        The correction of the ratio in patient cells, which is what makes the drug act on
        this node. The strongest independent support for the ratio model in this entry,
        because it shows the ratio is pharmacologically movable.
    - reference: PMID:41648237
      reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Atorvastatin rescued disease-relevant phenotypes in the worm model
      explanation: >-
        The organismal half of the same result: moving the ratio changes phenotype. Split
        from the fibroblast clause because the two halves of that sentence report
        different kinds of study.
  evidence:
  - reference: PMID:41648237
    reference_title: Repurposing the HMG-CoA Reductase Inhibitor Atorvastatin for SRD5A3-CDG.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

  description: >-
    Affected individuals carry biallelic SRD5A3 variants. Most reported patients
    are homozygous for nonsense or frameshift alleles and come from consanguineous
    families; compound heterozygosity including a missense allele is less common
    and was among the first observed in adults with a milder cognitive phenotype.
  evidence:
  - reference: PMID:27480077
    reference_title: "SRD5A3-CDG: Expanding the phenotype of a congenital disorder of glycosylation with emphasis on adult onset features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of individuals with SRD5A3-CDG reported in the literature have
      homozygote or compound heterozygote nonsense or frame shift mutations, most
      with documented consanguinity
    explanation: >-
      States the biallelic requirement and the predominance of homozygous
      loss-of-function alleles arising through consanguinity.

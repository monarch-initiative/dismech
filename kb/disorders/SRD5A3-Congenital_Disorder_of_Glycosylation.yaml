    snippet: >-
      some recurrent dysmorphic features such as arched eyebrows, wide eyes, shallow
      nasal bridge, short nose, and large mouth
    explanation: >-
      The dysmorphic features the classifier and clinical recognition both rest on.
- name: Retinal electrophysiology and imaging
  diagnosis_term:
    preferred_term: fundus autofluorescence imaging with electroretinography
    term:
      id: NCIT:C162465
      label: Fundus Autofluorescence Imaging
  description: >-
    The route by which this diagnosis is actually reached in a substantial share of
    patients, and the one the transferrin screen above does not cover. Fundus
    autofluorescence and optical coherence tomography detect the retinal dystrophy, and
    electroretinography characterises it as combined rod and cone dysfunction.

    Two things make this more than a supporting investigation. It has found retinal
    dystrophy in a patient followed for years under a different ophthalmic diagnosis, so a
    normal-looking fundus is not a rule-out; and in one series every patient came to
    attention this way rather than through metabolic medicine. NCIT has no
    electroretinography term reachable from Clinical Intervention or Procedure, so the
    binding names the imaging half and the preferred term carries both.
  evidence:
  - reference: PMID:28253385
    reference_title: Association of Steroid 5α-Reductase Type 3 Congenital Disorder of Glycosylation With Early-Onset Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fundus autofluorescence imaging and optical coherence tomographic scans were
      abnormal in all patients, and electrodiagnostic testing revealed rod and cone
      dysfunction in the 5 patients tested.
    explanation: >-
      The yield of this workup in the series where it was applied systematically.
  - reference: PMID:31638560
    reference_title: "Review of SRD5A3 Disease-Causing Sequence Variants and Ocular Findings in Steroid 5α-Reductase Type 3 Congenital Disorder of Glycosylation, and a Detailed New Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examination by spectral domain optical coherence tomography and fundus
      autofluorescence imaging showed clear signs of retinal dystrophy not recognized
      until our investigation
    explanation: >-
      A retinal dystrophy missed for years and found only when this workup was done,
      which is why it is curated as a diagnostic step rather than as characterisation.
- name: Intragenic copy-number analysis when sequencing is uninformative
  diagnosis_term:
    preferred_term: exome-based copy number analysis
  description: >-
    Sequencing does not always find the second allele. In one reported sibship the second
    variant was an intragenic tandem duplication of exons 2 to 4, invisible to the
    standard exome pipeline and found only when copy-number analysis was applied to the
    exome data. The patients were clinically typical, so nothing about the presentation
    signalled that the first result was incomplete.

    This is recorded as a diagnostic step so that a single heterozygous pathogenic variant
    in a clinically compatible patient is not read as excluding the diagnosis. NCIT has no
    term for this analysis under Clinical Intervention or Procedure, so it is left with a
    free-text preferred term.
  evidence:
  - reference: PMID:35339718
    reference_title: "SRD5A3-CDG: Twins with an intragenic tandem duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only when applying exome-based copy number analysis, we identified as a second
      compound heterozygous variant a previously not reported tandem duplication of exons
      2-4 in SRD5A3.
    explanation: >-
      The allele and the method that found it, in patients whose sequencing had been
      uninformative.
treatments:
- name: Atorvastatin (experimental, not established therapy)
  description: >-
    The only candidate disease-modifying therapy proposed for this disorder, and it is at
    the preclinical stage. An HMG-CoA reductase inhibitor is a counter-intuitive choice
    here - it restricts the isoprenoid supply upstream of polyprenol - but the logic
    follows from this entry's mechanism: if the pathogenic quantity is the
    polyprenol-to-dolichol ratio rather than the dolichol level, then reducing polyprenol
    production should help even though it reduces flux into the pathway overall. In patient
    fibroblasts it did restore the ratio, and in the worm model it rescued the phenotype.
    Recorded here so the reasoning is visible, explicitly NOT as a treatment in clinical
    use: no patient has been treated, and no trial is reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

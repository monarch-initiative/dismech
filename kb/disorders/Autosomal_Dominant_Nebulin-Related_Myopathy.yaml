    reference_title: Congenital asymmetric distal myopathy with hemifacial weakness caused by a heterozygous large de novo mosaic deletion in nebulin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expression of the truncated allele, less than half the size of
      full-length nebulin, was confirmed by Western blotting.
    explanation: Western blot of patient muscle confirms translation of the internally deleted nebulin protein.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling on dominant transmission, and on recurrence risk after a de novo or mosaic deletion. No disease-specific
    therapy has been reported.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40517164
    reference_title: "Structural variation in nebulin and its impact on phenotype and inheritance: establishing a dominant distal phenotype caused by large deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In eight families, the pathogenic deletion is seen in more than one family member, segregating with the disease in
      a dominant fashion.
    explanation: Dominant transmission is the information counseling conveys.
notes: >-
  Recessive nemaline myopathy 2 (biallelic NEB variants) is curated as the NEM2
  subtype of Nemaline_Myopathy. Autosomal dominant nebulin-related myopathy is
  curated separately because ClinGen split it from recessive nemaline myopathy
  on inheritance and molecular mechanism, and because the defining 12-family
  series shows that dominant NEB deletions are larger (51 to 97 exons), always
  in frame, expressed as a shortened nebulin protein, and associated with a
  milder, predominantly distal phenotype without neonatal hypotonia, bulbar
  feeding failure, or respiratory insufficiency. Direct thin-filament length or
  single-fiber force measurements in muscle carrying a dominant NEB deletion
  have not yet been published, nor has an animal model or disease-specific
  therapy trial. No dedicated GeneReviews chapter covers autosomal dominant
  nebulin-related myopathy. HP has no specific term for asymmetric muscle
  weakness, so that phenotype is bound to HP:0001324 (Muscle weakness) with
  coarse_binding_basis NO_HPO_TERM.

name: Autosomal Dominant Nebulin-Related Myopathy
description: >-
  Mild, predominantly distal skeletal myopathy caused by a single large heterozygous in-frame deletion in NEB, the gene
  for the thin-filament protein nebulin. The deletions span roughly 51 to 97 exons, all include exons 55-77, and are
  inherited dominantly or arise de novo, sometimes in mosaic form. The deleted allele is expressed as a shorter nebulin
  protein, which is thought to disturb sarcomere assembly and function in a dominant-negative manner. Foot drop and
  distal leg and hand weakness predominate; some patients have facial, neck flexor or proximal weakness and scapular
  winging, all reported patients remain ambulant, and respiratory function has not been reduced. Biopsies show type 1
  fibre predominance, fibre atrophy and size variation, cores, or nemaline bodies and cap-like structures. The disease is
  distinct from recessive nemaline myopathy 2, which is caused by biallelic NEB variants. ClinGen classifies the
  gene-disease relationship as Moderate.
category: Mendelian

      id: GO:0003779
      label: actin binding
  evidence:
  - reference: PMID:40517164
    reference_title: "Structural variation in nebulin and its impact on phenotype and inheritance: establishing a dominant distal phenotype caused by large deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dominant deletions in our cohort vary in size between 51 and 97 exons, and all include the NEB exons 55–77.
    explanation: Defines the size range and shared deleted segment.
  - reference: PMID:40517164
    reference_title: "Structural variation in nebulin and its impact on phenotype and inheritance: establishing a dominant distal phenotype caused by large deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The full-length protein consists of 29 actin-binding super repeats, each composed of seven simple actin-binding
      motifs (SDxxYK), allowing the protein to potentially bind to more than 200 actin monomers.
    explanation: >-
      Background for the molecular function annotation: the dominant deletions remove many of these actin-binding super
      repeats from the expressed protein.
  downstream:
  - target: Expression of Shortened Mini-Nebulin
    description: The in-frame deleted allele is transcribed and translated.
    evidence:
    - reference: PMID:30679003
      reference_title: Dominantly inherited distal nemaline/cap myopathy caused by a large deletion in the nebulin gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutated allele was shown to be expressed at the mRNA level and furthermore, for the first time, a deletion was
        shown to cause the production of a smaller mutant nebulin protein.
      explanation: The deleted allele yields mRNA and a smaller protein in patient muscle.

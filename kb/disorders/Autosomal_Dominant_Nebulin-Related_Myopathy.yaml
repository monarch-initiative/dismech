  downstream:
  - target: Dominant-Negative Sarcomere Disruption
    description: The shorter nebulin is proposed to interfere with the thin filament built with full-length nebulin.
    evidence:
    - reference: PMID:40517164
      reference_title: "Structural variation in nebulin and its impact on phenotype and inheritance: establishing a dominant distal phenotype caused by large deletions."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        As all large, disease-causing heterozygous deletions are in-frame, the most likely pathogenetic mechanism is that
        sufficiently large deletions disrupt sarcomere assembly and function through a dominant-negative effect due to the
        expression of a shorter protein product.
      explanation: >-
        The authors infer a dominant-negative mechanism from the in-frame structure and expression of every dominant
        deletion; it has not been tested directly.
- name: Dominant-Negative Sarcomere Disruption
  description: >-
    Nebulin normally spans the thin filament, stiffens it and is needed for normal force. The proposed lesion is a
    thin filament carrying an internally deleted nebulin that no longer fulfils these roles. This node is a hypothesis:
    no thin-filament or force measurement has been reported in muscle carrying a dominant deletion.
  biological_scale: CELLULAR
  cell_types:

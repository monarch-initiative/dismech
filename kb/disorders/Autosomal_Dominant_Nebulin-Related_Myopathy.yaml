pathophysiology:
- name: Large In-Frame NEB Deletion
  description: >-
    A single heterozygous or mosaic deletion of roughly 51 to 97 exons, always in frame and always including exons 55-77.
    Recessive NEB deletions are smaller (1 to 24 exons) or frameshifting, which the authors use to place the threshold for
    a dominant effect between 24 and 51 exons.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: NEB
      term:
        id: hgnc:7720
        label: NEB
    variant_origin: GERMLINE_AND_SOMATIC

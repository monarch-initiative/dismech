    is not an incidental normal finding but the diagnostic core of the syndrome:
    it is what separates PMDS from gonadal dysgenesis and from androgen-pathway
    disorders of sex development, and it is why no phenotype prompts
    investigation in infancy. No HPO term is bound because HPO codes abnormal
    findings and this phenotype is defined by the absence of one.

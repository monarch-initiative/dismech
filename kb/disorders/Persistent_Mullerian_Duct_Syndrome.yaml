inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic (homozygous or compound heterozygous)
    loss-of-function variants in AMH or AMHR2. Heterozygous carriers are
    unaffected.
  evidence:
  - reference: PMID:8872466
    reference_title: "A 27 base-pair deletion of the anti-müllerian type II receptor gene is the most common cause of the persistent müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All AMH and AMH receptor mutations were consistent with an autosomal recessive mode of transmission."
    explanation: >-
      A 38-family molecular series states the inheritance mode directly for both
      the ligand and the receptor gene.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persistent Müllerian duct syndrome (PMDS) is a rare autosomal recessive disorder of sexual development in males, defined by the presence of Müllerian remnants with otherwise normal sexual differentiation."
    explanation: >-
      An exome-sequencing case series restates autosomal recessive inheritance
      alongside the defining internal/external discordance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population-based prevalence estimate exists. Case counts are the only
    figure reported, and they are a lower bound: PMDS is frequently found
    incidentally at surgery and is presumed under-ascertained.
  evidence:
  - reference: PMID:39682529
    reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of writing, fewer than 300 cases have been reported in the literature."
    explanation: >-
      A 2024 case report with literature review gives the cumulative reported
      case count, the only occurrence figure available.
has_subtypes:
- name: PMDS type I
  display_name: PMDS type I (AMH ligand deficiency)
  subtype_term:
    preferred_term: Persistent Mullerian Duct Syndrome Type I
    term:
      id: NCIT:C120189
      label: Persistent Mullerian Duct Syndrome Type I
  description: >-
    PMDS caused by biallelic loss-of-function variants in AMH, the gene encoding
    the anti-Mullerian hormone ligand. Because the ligand itself is absent or
    non-functional, serum AMH is low or undetectable, which distinguishes type I
    from type II biochemically. The clinical picture is otherwise
    indistinguishable from type II.
  genes:
  - preferred_term: AMH
    term:
      id: hgnc:464
      label: AMH
  evidence:
  - reference: PMID:8872466
    reference_title: "A 27 base-pair deletion of the anti-müllerian type II receptor gene is the most common cause of the persistent müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The type of genetic defect could be predicted from the level of serum AMH which is very low or undetectable in patients with AMH mutations and at the upper limit of normal in receptor mutations."
    explanation: >-
      Establishes the ligand-versus-receptor split and the serum AMH measurement
      that separates the two subtypes.
- name: PMDS type II
  display_name: PMDS type II (AMHR2 receptor defect)
  subtype_term:
    preferred_term: Persistent Mullerian Duct Syndrome Type II
    term:
      id: NCIT:C120190
      label: Persistent Mullerian Duct Syndrome Type II
  description: >-
    PMDS caused by biallelic loss-of-function variants in AMHR2, the gene
    encoding the AMH type II receptor. The ligand is made normally but the
    target tissue cannot respond, so serum AMH is normal or elevated for age. A
    27-bp deletion in the kinase domain is the single most common allele,
    concentrated in individuals of northern European ancestry.
  genes:
  - preferred_term: AMHR2
    term:
      id: hgnc:465
      label: AMHR2
  evidence:
  - reference: PMID:17161334
    reference_title: "Anti-Müllerian hormone receptor defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum AMH is normal for age in patients with AMH type II mutations and low or undetectable in those with AMH mutations."
    explanation: >-
      States the receptor-subtype serum AMH pattern that defines type II against
      type I. ("AMH type II mutations" here means AMH receptor type II
      mutations.)
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common mutation, a 27-bp deletion in the kinase domain, was found in 30 patients of mostly Northern European origin."
    explanation: >-
      Documents the recurrent AMHR2 kinase-domain deletion and its ancestry
      distribution.
pathophysiology:
- name: AMH Ligand or AMHR2 Receptor Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish either the anti-Mullerian
    hormone ligand secreted by fetal Sertoli cells (type I) or the type II
    serine/threonine kinase receptor AMHR2 that receives it (type II). About
    12 percent of clinically diagnosed cases carry no identified variant in
    either gene, implying at least one further pathway component.
  genes:
  - preferred_term: AMH
    term:
      id: hgnc:464
      label: AMH
  - preferred_term: AMHR2
    term:
      id: hgnc:465
      label: AMHR2
  cell_types:
  - preferred_term: fetal Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  molecular_functions:
  - preferred_term: anti-Mullerian hormone receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:1990272
      label: anti-Mullerian hormone receptor activity
  downstream:
  - target: Failed AMH Receptor Signaling in Mullerian Duct Mesenchyme
    causal_link_type: DIRECT
    description: >-
      Absent ligand or a non-functional receptor removes the input to the
      AMH signaling cascade in the target mesenchyme.
    evidence:
    - reference: PMID:32172781
      reference_title: "Persistent Müllerian duct syndrome: an update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations inactivating AMH or AMH receptor type 2 (AMHR2) are responsible for persistent Müllerian duct syndrome (PMDS) in otherwise normally virilised 46,XY males."
      explanation: >-
        Attributes the syndrome to inactivation of either the ligand or its
        type II receptor, which is the step this edge asserts.
  evidence:
  - reference: PMID:31301298
    reference_title: "AMH and AMHR2 mutations: A spectrum of reproductive phenotypes across vertebrate species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMH is expressed in Sertoli cells of the fetal and adult testes and granulosa cells of the postnatal ovary."
    explanation: >-
      Locates AMH production in fetal Sertoli cells, the cell type annotated on
      this node.
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 12% of cases, no mutation of AMH or AMHR2 has been detected, suggesting a disruption of other pathways involved in Müllerian regression."
    explanation: >-
      Supports the statement that a minority of cases have variants in neither
      gene.
- name: Failed AMH Receptor Signaling in Mullerian Duct Mesenchyme
  biological_scale: MOLECULAR
  description: >-
    AMHR2 is expressed on the mesenchyme surrounding the Mullerian duct
    epithelium. Ligand binding to AMHR2 recruits a shared type I BMP receptor
    (BMPR1A/ALK3, with ACVR1 also implicated) and activates receptor-regulated
    SMADs. Loss of ligand or receptor collapses the whole cascade at its first
    step, so the downstream SMAD-dependent transcriptional program that
    dismantles the duct is never run.
  cell_types:
  - preferred_term: Mullerian duct mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: anti-Mullerian hormone receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:1990262
      label: anti-Mullerian hormone receptor signaling pathway
  - preferred_term: SMAD protein signal transduction
    modifier: DECREASED
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  downstream:
  - target: Failure of Mullerian Duct Regression
    causal_link_type: DIRECT
    description: >-
      Without receptor-complex activation and SMAD signaling in the periductal
      mesenchyme, the duct is not induced to regress.
    evidence:
    - reference: PMID:12368913
      reference_title: "Requirement of Bmpr1a for Müllerian duct regression during male sexual development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that targeted disruption of the widely expressed type I bone morphogenetic protein (BMP) receptor Bmpr1a (also known as Alk3) in the mesenchymal cells of the Müllerian ducts leads to retention of oviducts and uteri in males."
      explanation: >-
        A conditional mouse knockout shows that breaking the receptor complex
        specifically in Mullerian duct mesenchyme is sufficient to leave the
        ducts in place, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:31301298
    reference_title: "AMH and AMHR2 mutations: A spectrum of reproductive phenotypes across vertebrate species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMHR2 is expressed in mesenchyme adjacent to the Müllerian ducts, and in Sertoli, Leydig, and granulosa cells."
    explanation: >-
      Places the receptor on the periductal mesenchyme, the cell type annotated
      on this node.
  - reference: PMID:17161334
    reference_title: "Anti-Müllerian hormone receptor defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Like other members of the transforming growth factor beta (TGF-beta) family, AMH signals through two serine/threonine kinase receptors, of which type II is specific, and type I is shared with the bone morphogenetic protein family."
    explanation: >-
      Supports the two-receptor architecture, with a ligand-specific type II
      receptor recruiting a shared type I receptor.
  - reference: PMID:18391537
    reference_title: "The Müllerian duct: recent insights into its development and regression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Besides AMH and its specific type II receptor AMHR2 two different type I receptors as well as different SMAD family members have been shown to be involved in the AMH signaling cascade."
    explanation: >-
      Supports SMAD family involvement downstream of AMHR2, the second process
      annotated on this node.
- name: Failure of Mullerian Duct Regression
  biological_scale: TISSUE
  description: >-
    Mullerian duct regression is a developmentally scheduled event confined to a
    narrow window of male fetal differentiation; AMH signaling is required
    during that window and cannot act later. When the signal fails, the ducts
    are not dismantled and differentiate along their default path into uterus,
    Fallopian tubes, and upper vagina.
  biological_processes:
  - preferred_term: Mullerian duct regression
    modifier: ABSENT
    term:
      id: GO:0001880
      label: Mullerian duct regression
  locations:
  - preferred_term: Mullerian duct
    term:
      id: UBERON:0003890
      label: Mullerian duct
  downstream:
  - target: Presence of Uterus in 46,XY Individual
    causal_link_type: DIRECT
    description: >-
      The unregressed ducts differentiate into uterus, Fallopian tubes and upper
      vagina.
    evidence:
    - reference: PMID:35052499
      reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Müllerian structures completely vanish as a result of the effects of AMH during the tenth week of fetal development, which mediates normal sexual differentiation in males"
      explanation: >-
        Dates the normal AMH-driven disappearance of the Mullerian structures to
        a narrow fetal window, so failure of that signal leaves them in place.
  - target: Mechanical Tethering of the Testis by Retained Mullerian Structures
    causal_link_type: DIRECT
    description: >-
      The persisting duct derivatives are physically continuous with the
      testis and its cord structures.
    evidence:
    - reference: PMID:35052499
      reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The Müllerian duct is attached to the testicles and prevents them from descending to the scrotum from the inguinal rings."
      explanation: >-
        States the anatomical attachment between the retained duct and the
        testis that produces the tether.
  - target: Neoplastic Transformation of Retained Mullerian Epithelium
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Retained Mullerian epithelium persists lifelong and is at risk of
      malignant change, though far less often than the malpositioned testes.
    evidence:
    - reference: PMID:12218580
      reference_title: "A case of clear cell adenocarcinoma of the müllerian duct in persistent müllerian duct syndrome: the first reported case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This represents the first reported case of malignant change of the persistent Müllerian duct structures in persistent Müllerian duct syndrome."
      explanation: >-
        Documents that the retained Mullerian tissue itself can undergo
        malignant transformation, which is the claim of this edge.
  evidence:
  - reference: PMID:17161334
    reference_title: "Anti-Müllerian hormone receptor defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-Müllerian hormone (AMH), produced by gonadal somatic cells, is mainly responsible for the regression of Müllerian ducts--the anlagen of uterus and Fallopian tubes--during male sex differentiation."
    explanation: >-
      Identifies Mullerian duct regression as the AMH-dependent process, and the
      uterus and Fallopian tubes as the structures at stake.
- name: Preserved Leydig Cell Androgen Production and Signaling
  biological_scale: MOLECULAR
  description: >-
    AMH and testosterone are two independent arms of male differentiation with
    different sources and different targets. PMDS breaks only the AMH arm.
    Leydig cells, testosterone biosynthesis, and androgen receptor signaling are
    all intact, which is why this is a dissociation and not a global failure of
    masculinization.
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  biological_processes:
  - preferred_term: testosterone biosynthetic process
    term:
      id: GO:0061370
      label: testosterone biosynthetic process
  - preferred_term: androgen receptor signaling pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
  downstream:
  - target: Normal Wolffian Duct Development and Male External Virilization
    causal_link_type: DIRECT
    description: >-
      Intact fetal testosterone maintains the Wolffian ducts and drives external
      genital masculinization.
    evidence:
    - reference: PMID:35386545
      reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The defect results in the coexistence of both Wolffian and Müllerian duct structures in a phenotypic male, as external virilisation is complete due to the presence of testosterone."
      explanation: >-
        Attributes the complete external virilization specifically to preserved
        testosterone, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Male sex differentiation is driven by two hormones, testosterone and anti-Müllerian hormone (AMH), responsible for regression of Müllerian ducts in male fetuses."
    explanation: >-
      Establishes the two-hormone architecture in which only the AMH arm is
      broken in PMDS.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the presence of Leydig cells results in the secretion of testosterone, which directs localised differentiation of Wolffian duct structures including the epididymis, vas deferens, seminal vesicles, and ejaculatory ducts."
    explanation: >-
      Names Leydig-cell testosterone as the driver of Wolffian development, the
      preserved arm annotated on this node.
- name: Normal Wolffian Duct Development and Male External Virilization
  biological_scale: ORGANISM
  description: >-
    Epididymis, vas deferens, seminal vesicles and ejaculatory ducts form
    normally, the external genitalia are unambiguously male, and pubertal
    virilization proceeds. This is the feature that distinguishes PMDS from
    gonadal dysgenesis and from androgen-pathway disorders of sex development,
    in which external masculinization is incomplete.
  biological_processes:
  - preferred_term: male genitalia development
    term:
      id: GO:0030539
      label: male genitalia development
  - preferred_term: mesonephric duct development
    term:
      id: GO:0072177
      label: mesonephric duct development
  downstream:
  - target: Delayed and Incidental Diagnosis
    causal_link_type: DIRECT
    description: >-
      Because nothing about the external phenotype is atypical, there is no
      prompt to look for internal Mullerian structures.
    evidence:
    - reference: PMID:35052499
      reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PMDS in cryptorchidism patients are easily ignored as most previous cases were diagnosed incidentally when Müllerian remnants were detected during ultrasonographic evaluation of undescended testes or inguinal hernia."
      explanation: >-
        Links the absence of an external cue to incidental, delayed recognition,
        which is the step this edge asserts.
  evidence:
  - reference: PMID:31301298
    reference_title: "AMH and AMHR2 mutations: A spectrum of reproductive phenotypes across vertebrate species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMH or AMHR2 mutations in mammals lead to the development of Persistent Müllerian Duct Syndrome (PMDS), a recessive condition in which affected males are fully virilized but retain Müllerian duct-derived tissues, including a uterus and oviducts, and in human and dog, undescended testes."
    explanation: >-
      States the dissociation directly: full virilization alongside retained
      Mullerian derivatives.
  - reference: PMID:27329391
    reference_title: "Persistent mullerian duct syndrome: A 24-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were genotypically male."
    explanation: >-
      Confirms the 46,XY genotype across a 27-patient surgical series, so the
      retained structures are not a chromosomal sex discordance.
- name: Mechanical Tethering of the Testis by Retained Mullerian Structures
  biological_scale: TISSUE
  description: >-
    The retained uterus and Fallopian tubes are anatomically continuous with the
    testis and its cord, and the vasa deferentia run in the wall of the retained
    structures. This attachment physically restrains testicular descent, which is
    why cryptorchidism, hernia uteri inguinale and transverse testicular ectopia
    are the presenting findings rather than incidental co-occurrences.
  locations:
  - preferred_term: Mullerian duct
    term:
      id: UBERON:0003890
      label: Mullerian duct
  downstream:
  - target: Cryptorchidism
    causal_link_type: DIRECT
    description: >-
      The tethered testis cannot complete its descent into the scrotum.
    evidence:
    - reference: PMID:33532339
      reference_title: "Transverse testicular ectopia associated with persistent Mullerian duct syndrome in infertile male: two case reports and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is likely that the mechanical effect of the persistent Mullerian duct structure produces cryptorchidism by preventing normal testicular descent."
      explanation: >-
        States the mechanical causal claim from retained structure to
        cryptorchidism, which is exactly this edge.
  - target: Ectopic Testis
    causal_link_type: DIRECT
    description: >-
      The same tether can carry a testis across the midline into the
      contralateral inguinal canal or hemiscrotum.
    evidence:
    - reference: PMID:33532339
      reference_title: "Transverse testicular ectopia associated with persistent Mullerian duct syndrome in infertile male: two case reports and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mechanical effect may also lead to the transvers ectopia of testis across the midline."
      explanation: >-
        Extends the same mechanical mechanism to transverse testicular ectopia.
        (The source's spelling of "transvers" is reproduced verbatim.)
  - target: Inguinal Hernia
    causal_link_type: DIRECT
    description: >-
      Mullerian structures and the tethered testis herniate through the inguinal
      canal, the classic hernia uteri inguinale presentation.
    evidence:
    - reference: PMID:35386545
      reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HUI usually presents with an ipsilateral hernia with ipsilateral descended testis and Müllerian structures within the hernia."
      explanation: >-
        Describes the Mullerian structures occupying the hernia sac, linking the
        retained tissue to the hernia presentation.
  - target: Germ Cell Neoplasia Risk in the Malpositioned Testis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic intra-abdominal or ectopic testicular position is the intermediate
      that raises germ cell tumour risk.
    evidence:
    - reference: PMID:9187705
      reference_title: "Surgical management of persistent müllerian duct syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The risk of testicular neoplasia in persistent müllerian duct syndrome approximates the risk of neoplasia in other intra-abdominal gonads."
      explanation: >-
        Equates the PMDS tumour risk with that of intra-abdominal gonads
        generally, supporting malposition as the operative intermediate.
  - target: Impaired Spermatogenesis and Excurrent Duct Compromise
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Malposition, distortion of the excurrent ducts, and surgical injury during
      repair together degrade spermatogenesis and sperm transport.
    evidence:
    - reference: PMID:32172781
      reference_title: "Persistent Müllerian duct syndrome: an update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fertility is rare but possible if at least one testis is scrotal and its excretory ducts are intact."
      explanation: >-
        Makes fertility conditional on scrotal position and intact excurrent
        ducts, the two things this edge says the tether compromises.
  evidence:
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Müllerian duct is attached to the testicles and prevents them from descending to the scrotum from the inguinal rings."
    explanation: >-
      States the attachment and its mechanical consequence, which is the claim
      of this node.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vasa deferentia were clearly identified in close association with the fallopian-tube like structures"
    explanation: >-
      Records the operative finding that the vasa run in intimate association
      with the retained Mullerian structures.
- name: Germ Cell Neoplasia Risk in the Malpositioned Testis
  biological_scale: TISSUE
  description: >-
    Undescended and ectopic testes in PMDS carry the elevated germ cell tumour
    risk of cryptorchid gonads generally. Reported rates vary widely with
    ascertainment, from roughly 5-18 percent in surgical series to 33 percent
    among adults in a large referral review; seminoma is the commonest histology.
    Early orchidopexy is the intervention that addresses it.
  downstream:
  - target: Testicular Neoplasm
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32172781
      reference_title: "Persistent Müllerian duct syndrome: an update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Testicular malignant degeneration occurs in 33% of adults with PMDS."
      explanation: >-
        Quantifies the realized malignancy outcome in adults, the phenotype this
        edge points at.
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reported incidence of malignant change in the testes in PMDS generally ranges from 5 to 18%, a rate which is similar to abdominal undescended testes in men without PMDS."
    explanation: >-
      Gives the lower published range and, importantly, attributes the risk to
      testicular malposition rather than to PMDS-specific biology.
- name: Neoplastic Transformation of Retained Mullerian Epithelium
  biological_scale: TISSUE
  description: >-
    The retained uterus and Fallopian tubes remain in situ for life if not
    excised, and their epithelium can undergo malignant transformation.
    Adenocarcinoma (including clear-cell and endocervical-type) and adenosarcoma
    have been reported. This is substantially rarer than testicular malignancy
    and is the argument for either excision or lifelong imaging surveillance of
    a preserved remnant.
  downstream:
  - target: Uterine Neoplasm
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16009404
      reference_title: "Adenocarcinoma of persistent müllerian duct remnants: case report and differential diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the case of a 39-year-old man with this syndrome in association with adenocarcinoma from the retained müllerian remnants of probable endocervical origin."
      explanation: >-
        A realized carcinoma arising in the retained remnant, which is the
        outcome this edge points at.
  evidence:

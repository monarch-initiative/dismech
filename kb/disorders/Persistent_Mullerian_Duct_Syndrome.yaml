- category: Genitourinary
  name: Testicular Atrophy
  description: >-
    Loss of testicular volume in the malpositioned gonad. The ectopic testis sits
    outside the scrotum for as long as it remains undescended, and repeated
    attempts at fixation add ischaemic insult to that exposure, so a testis that
    is viable at first presentation can be atrophic by the time of a later
    operation. This is the finding that converts the management decision from
    orchidopexy to orchidectomy, and it is the mechanism by which delayed
    diagnosis translates into permanent loss of gonadal tissue.

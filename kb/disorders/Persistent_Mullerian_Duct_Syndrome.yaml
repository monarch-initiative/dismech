name: Persistent Mullerian Duct Syndrome
creation_date: "2026-09-05T20:30:00Z"
category: Mendelian
description: >-
  Persistent Mullerian duct syndrome (PMDS) is a rare autosomal recessive 46,XY
  difference of sex development in which a uterus and Fallopian tubes persist in
  an individual who has histologically normal testes and normally virilized male
  external genitalia. Fetal Sertoli cells normally secrete anti-Mullerian hormone
  (AMH), a TGF-beta family ligand that signals through the type II receptor
  AMHR2 on the mesenchyme surrounding the Mullerian ducts and drives their
  regression during a narrow window of male sex differentiation. Biallelic
  loss-of-function variants in AMH (PMDS type I) or AMHR2 (PMDS type II) break
  that single arm of male differentiation while leaving the Leydig-cell
  testosterone arm intact, so Wolffian derivatives develop and external
  virilization proceeds normally. The retained Mullerian structures tether the
  testes and prevent normal descent, so most individuals present with
  cryptorchidism, inguinal hernia, or transverse testicular ectopia, and the
  diagnosis is usually made incidentally at hernia repair or orchidopexy. PMDS is
  emphatically not a gonadal dysgenesis: the gonads are testes and produce
  testosterone normally.

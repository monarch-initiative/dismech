  evidence:
  - reference: PMID:39682529
    reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On clinical examination, the external genital organs had a male phenotype, with a stretched penile length within age-appropriate limits and a normally located external urethral meatus."
    explanation: >-
      Records the examination finding of normal male external genitalia in a
      genetically confirmed AMHR2 case.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

      explanation: >-
        A compound heterozygous AMHR2 genotype in an affected patient,
        consistent with recessive inheritance at this locus.
  notes: >-
    AMHR2 encodes the AMH type II serine/threonine kinase receptor expressed on
    the mesenchyme surrounding the Mullerian ducts. Biallelic loss-of-function
    variants cause PMDS type II. A recurrent 27-bp deletion in the kinase domain
    is the single commonest allele. Whole-gene and multi-exon deletions occur and
    can be missed by Sanger sequencing alone, which can make a hemizygous
    deletion look homozygous.
  evidence:
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMHR2 gene mutations comprising 64 different alleles have been discovered in 79 families."
    explanation: >-
      Documents the AMHR2 allelic spectrum across reported families.
  - reference: PMID:8872466
    reference_title: "A 27 base-pair deletion of the anti-müllerian type II receptor gene is the most common cause of the persistent müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas AMH mutations are extremely diverse, patients from 10 out of 16 families with receptor mutations had a 27 bp deletion in exon 10 on at least one allele."
    explanation: >-
      Establishes the recurrent 27-bp kinase-domain deletion as the commonest
      receptor allele.
  - reference: PMID:32187366
    reference_title: "Persistent Müllerian duct syndrome due to anti-Müllerian hormone receptor 2 microdeletions: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's paternal allele carried a stop mutation, which was initially thought to be homozygous by Sanger sequencing."
    explanation: >-
      Documents the specific diagnostic pitfall in which an AMHR2 whole-gene
      deletion in trans makes a point variant appear homozygous.
- name: Unexplained PMDS (no AMH or AMHR2 variant identified)
  relationship_type: UNKNOWN
  notes: >-
    Roughly one case in eight has no identified variant in either AMH or AMHR2
    despite a clinically unambiguous phenotype. These cases are labelled
    idiopathic; the implication is that at least one further component of the
    Mullerian regression pathway remains to be identified in humans.

    Two kinds of candidate should be kept apart. PPP1R12A is the only one with a
    reported human PMDS finding - truncating variants in five of twenty-four
    patients screened after AMH and AMHR2 were excluded - and it has its own
    record in this section, typed UNKNOWN because the finding is unvalidated.
    The shared type I receptors and the SMADs are a different class of
    candidate: established in mouse, biologically obvious, and not yet reported
    as a human PMDS cause at all. Before this entry carried the PPP1R12A record,
    only the second class was named here, which understated where the field
    actually is.
  evidence:
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 12% of cases, no mutation of AMH or AMHR2 has been detected, suggesting a disruption of other pathways involved in Müllerian regression."
    explanation: >-
      Quantifies the molecularly unexplained fraction and draws the same
      inference about additional pathway components.
- name: PPP1R12A
  gene_term:
    preferred_term: PPP1R12A
    term:
      id: hgnc:7618
      label: PPP1R12A
  relationship_type: UNKNOWN
  association: >-
    Reported candidate gene for molecularly unexplained PMDS; truncating variants
    found in patients but not yet functionally validated or classified for
    gene-disease validity.
  notes: >-
    PPP1R12A encodes the regulatory subunit of myosin phosphatase. Exome
    sequencing of 24 PMDS patients in whom biallelic AMH and AMHR2 variants had
    been excluded found deleterious truncating PPP1R12A variants in five, four of
    whom also had an intestinal or oesophageal atresia - a co-occurrence never
    reported with AMH or AMHR2 variants, and the argument the authors make
    against chance. This is the only gene beyond AMH and AMHR2 with a reported
    human PMDS finding, so it is recorded here rather than left out of the
    unexplained fraction.

    The claim is deliberately typed UNKNOWN rather than CAUSATIVE, and the hedge
    should be carried wherever this record is reused. There is no experimental
    validation of a role for myosin phosphatase in Mullerian regression; the
    mechanistic argument is circumstantial (myosin phosphatase is required for
    cell motility, which regression depends on) and an alternative reading, that
    the variants act on AMH signal transduction rather than beside it, is not
    excluded. PPP1R12A should not displace AMH and AMHR2 as first-line testing.
  evidence:
  - reference: PMID:36331510
    reference_title: "Persistent Müllerian duct syndrome associated with genetic defects in the regulatory subunit of myosin phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients out of 24 (21%) harbored deleterious truncation mutations of PP1R12A, the gene coding for the regulatory subunit of myosin phosphatase, were detected."
    explanation: >-
      The primary human finding: truncating variants in five of twenty-four
      patients screened after AMH and AMHR2 had been excluded. (The source's
      typographical "PP1R12A" and its non-agreeing sentence are reproduced
      verbatim.)
  - reference: PMID:36331510
    reference_title: "Persistent Müllerian duct syndrome associated with genetic defects in the regulatory subunit of myosin phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to PMDS, three of these patients presented with ileal and one with esophageal atresia."
    explanation: >-
      The associated malformations that the authors use to argue the finding is
      not chance, since they are not seen with AMH or AMHR2 variants.
  - reference: PMID:36331510
    reference_title: "Persistent Müllerian duct syndrome associated with genetic defects in the regulatory subunit of myosin phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main limitation of the study is the lack of experimental validation of the role of PPP1R12A in Müllerian regression."
    explanation: >-
      The authors' own statement of the limitation, which is why this record is
      typed UNKNOWN rather than CAUSATIVE.
  - reference: PMID:36331510
    reference_title: "Persistent Müllerian duct syndrome associated with genetic defects in the regulatory subunit of myosin phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA samples from 39 PMDS patients collected from 1990 to present, in which Sanger sequencing had failed to detect biallelic AMH or AMHR2 mutations, were screened by massive parallel sequencing."
    explanation: >-
      Establishes that the cohort was ascertained as AMH/AMHR2-negative, so this
      is a finding within the unexplained fraction rather than a competing
      explanation for typical PMDS.
  - reference: PMID:39682529
    reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detection of PPP1R12A truncation mutations coding myosin phosphatase in five cases of PMDS suggests that myosin phosphatase is involved in Müllerian regression, independently of the AMH signaling cascade"
    explanation: >-
      An independent review restating the finding, and preserving the same
      hedge - "suggests" - rather than asserting causation.
diagnosis:
- name: Diagnostic Laparoscopy
  description: >-
    Laparoscopy for impalpable or bilaterally undescended testes is the point at
    which most cases are recognized, because it is the only investigation that
    directly visualizes the retained uterus and tubes alongside the gonads. It is
    therefore both the commonest route to diagnosis and, when the finding is not
    recognized for what it is, the commonest route to a reflexive excision.
    Finding Mullerian and Wolffian derivatives together should stop the operation
    and prompt gonadal biopsy and karyotype, since other 46,XY differences of sex
    development can present the same way.
  diagnosis_term:
    preferred_term: diagnostic laparoscopy for impalpable testes
    term:
      id: NCIT:C16969
      label: Laparoscopy
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic laparoscopy for impalpable testes at age 6 months revealed bilateral intra-abdominal testes, with normal and expected testicular structure and appearance."
    explanation: >-
      A worked case in which laparoscopy for impalpable testes was the
      investigation that established the internal anatomy.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With investigative laparoscopy for impalpable testes now commonplace, the recognition of FT PMDS in infancy has increased"
    explanation: >-
      Attributes the rise in infant diagnosis to routine laparoscopy, which is
      why this is the primary diagnostic route rather than an adjunct.
- name: Inguinoscrotal and Pelvic Ultrasound
  description: >-
    First-line imaging for the undescended or impalpable testis, and the study
    that most often raises the question. Its negative predictive value for the
    Mullerian remnant is poor: an ultrasound that locates neither testis and
    reports no pelvic abnormality does not exclude PMDS, and the diagnosis is
    still made at laparoscopy. Ultrasound is more useful afterwards, as the
    routine modality for annual surveillance of a preserved remnant.
  diagnosis_term:
    preferred_term: inguinoscrotal and pelvic ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial ultrasound scan of the scrotum and pelvis did not identify the testes and did not detect any pelvic abnormality."
    explanation: >-
      A negative ultrasound in a patient subsequently shown at laparoscopy to
      have intra-abdominal testes and a Mullerian remnant, which is the
      limitation this record records.
- name: Pelvic Magnetic Resonance Imaging
  description: >-
    Cross-sectional imaging to map the retained uterus, tubes and upper vagina
    and to locate the testes before an operation is planned. The reported failure
    mode is not the scan but the request: in a series in which pelvic MRI was
    performed before surgery, the uterus went unreported in two of three
    patients, and the recommendation that follows is to tell the reporting
    radiologist that Mullerian remnants are suspected.
  diagnosis_term:
    preferred_term: pelvic magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were furtherly diagnosed with PMDS, as pelvic magnetic resonance imaging revealed the presence of Müllerian remnants."
    explanation: >-
      Pelvic MRI is the study that confirmed the Mullerian remnants in all three
      molecularly diagnosed patients in this series.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, two of the three patients (cases 1 and 2) underwent pelvic MRI before surgery in a local hospital, but the presence of a uterus was not reported in either of them."
    explanation: >-
      Documents the reporting failure that motivates naming the suspicion on the
      request form, rather than treating a normal MRI report as exclusion.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For patients with suspected PMDS, preoperative AMH hormone examination, genetic analysis, and MRI after informing the imaging physician of possible uterine remnants can improve the diagnosis rate of PMDS."
    explanation: >-
      States the combined preoperative pathway - hormone measurement, genetics
      and a forewarned MRI - that this diagnosis section models.
- name: Karyotype
  description: >-
    Chromosome analysis, expected to show 46,XY. It does not diagnose PMDS, and a
    normal male karyotype is compatible with several other 46,XY differences of
    sex development. Its role is to place the patient in the right diagnostic
    frame before an irreversible operation, and to give the family an answer at
    the point where an unexpected uterus has been found.
  diagnosis_term:
    preferred_term: karyotype analysis
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gonadal biopsy and karyotype before proceeding to orchidopexy will help to give the family time to understand the condition, to get reassurance about the karyotype, and to get objective reassurance about the presence of normal testicular tissue."
    explanation: >-
      States the sequencing rationale curated here: karyotype before the
      definitive operation rather than after it.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had the normal 46, XY karyotype."
    explanation: >-
      The expected result in a molecularly confirmed patient, establishing the
      karyotype as normal rather than diagnostic.
- name: Serum Anti-Mullerian Hormone with Gonadotropin and Androgen Panel
  description: >-
    Serum AMH, measured alongside inhibin B, testosterone, LH and FSH. AMH
    partitions the two genetic subtypes rather than establishing the diagnosis: a
    low or undetectable value points to the ligand gene and a normal or elevated
    value to the receptor gene. A normal AMH therefore does not exclude PMDS, and
    reading it that way is one of the routes to a missed diagnosis. Tumour
    markers are added when a mass is present.
  diagnosis_term:
    preferred_term: serum anti-Mullerian hormone measurement
    term:
      id: NCIT:C120625
      label: Anti-Mullerian Hormone Measurement
  results: >-
    Low or undetectable serum AMH in PMDS type I; normal or elevated serum AMH in
    PMDS type II.
  notes: >-
    The two directions are curated as separate subtype-attributed records in the
    biochemical section, where the discrepancy between them is the informative
    content.
  evidence:
  - reference: PMID:39682529
    reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum AMH and inhibin B were normal."
    explanation: >-
      A normal AMH and inhibin B in a patient subsequently shown to carry a
      biallelic AMHR2 variant, which is the receptor-subtype pattern.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was diagnosed with azoospermia after hormone analysis"
    explanation: >-
      Places the gonadotropin and androgen panel in the workup of the adult
      infertility presentation, which is where PMDS is often first suspected.
- name: AMH and AMHR2 Sequencing with Copy-Number Analysis
  description: >-
    Sequence and deletion/duplication analysis of both genes. Copy-number
    detection is specified rather than assumed because AMHR2 microdeletions
    occur, and a whole-gene deletion in trans with a point variant makes that
    variant look homozygous on Sanger sequencing alone - so a sequencing-only
    result can be both wrong about zygosity and wrong about which parent is a
    carrier. A wider disorder-of-sex-development panel or exome is appropriate
    when first-line testing is negative, and a negative result does not exclude
    the pathway. After a molecular diagnosis, cascade testing is offered to
    siblings.
  diagnosis_term:
    preferred_term: AMH and AMHR2 sequencing with deletion/duplication analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the 11 patients had biallelic mutations in AMH or AMHR2."
    explanation: >-
      The diagnostic yield of sequencing in an unselected cryptorchidism cohort,
      which is the basis for testing in selected cryptorchidism.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Copy number variants were identified using the DNA copy R package, filtered and classified by ACMG guidelines, and manually checked using the Integrative Genomics Viewer."
    explanation: >-
      Records copy-number calling as part of the analysis rather than an
      optional add-on.
  - reference: PMID:32187366
    reference_title: "Persistent Müllerian duct syndrome due to anti-Müllerian hormone receptor 2 microdeletions: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first cases of PMDS resulting from a microdeletion of the chromosomal region 12q13.13, the locus of the gene for AMHR2."
    explanation: >-
      Establishes that AMHR2 copy-number variants cause PMDS, so an assay blind
      to them can miss the diagnosis outright.
  - reference: PMID:32187366
    reference_title: "Persistent Müllerian duct syndrome due to anti-Müllerian hormone receptor 2 microdeletions: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic methods are discussed, with an emphasis on comparative genomic hybridization and targeted massive parallel sequencing."
    explanation: >-
      The authors' own methodological conclusion, which is why copy-number
      analysis is written into this record rather than left implicit.
- name: Histopathological Examination of Gonadal and Mullerian Tissue
  description: >-
    Histology of the gonadal biopsy and of any excised remnant. The biopsy
    confirms normal testicular tissue, which is what separates PMDS from the
    gonadal dysgenesis differentials; examination of the remnant confirms
    Mullerian epithelium and smooth muscle and is the point at which
    unsuspected malignancy would be found.
  diagnosis_term:
    preferred_term: histopathological examination of gonadal and Mullerian tissue
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology of bilateral gonadal biopsy showed normal testicular tissue."
    explanation: >-
      The expected gonadal result, which is the finding that excludes gonadal
      dysgenesis.
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was histologically confirmed to have PMDS"
    explanation: >-
      Histology of the excised remnant as the confirmatory step in a
      molecularly diagnosed patient.
treatments:
- name: Orchidopexy
  description: >-
    Placement of the malpositioned testes into the scrotum, staged
    (Fowler-Stephens) when the gonadal vessels are too short. Performed early in
    childhood, this is the intervention that addresses both fertility potential
    and germ cell tumour risk, and it takes priority over management of the
    Mullerian remnant.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Orchiopexy
    term:
      id: NCIT:C111066
      label: Orchiopexy
  target_mechanisms:
  - target: Mechanical Tethering of the Testis by Retained Mullerian Structures
    description: >-
      Surgical mobilization overcomes the mechanical restraint the retained
      structures impose on descent.
    evidence:
    - reference: PMID:35386545
      reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both intra-abdominal testes were successfully moved to an intrascrotal position with the vasa and vasal blood supply intact."
      explanation: >-
        Shows the operation achieving intrascrotal placement despite the tether,
        which is the mechanism this treatment targets.
  - target: Germ Cell Neoplasia Risk in the Malpositioned Testis
    description: >-
      Bringing the testis to a palpable scrotal position reduces malignancy risk
      and makes surveillance by examination possible.
    evidence:
    - reference: PMID:35386545
      reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Early orchidopexy should be offered to children with PMDS."
      explanation: >-
        Recommends early orchidopexy for PMDS specifically, on the malignancy
        risk-reduction rationale this mechanism link asserts.
  evidence:
  - reference: PMID:9187705
    reference_title: "Surgical management of persistent müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optimal surgical management is orchiopexy leaving the uterus and fallopian tubes in situ."
    explanation: >-
      Names orchidopexy as the primary operation in a comprehensive review of
      PMDS surgical management.
- name: Preservation of Mullerian Remnants and the Vas Deferens
  description: >-
    The vasa deferentia and their blood supply run in the wall of the retained
    Mullerian structures, so aggressive excision of the remnant risks
    sterilizing the patient and devascularizing the testis. The recommended
    default is therefore to leave the uterus and tubes in situ, or to split the
    remnant sagittally to gain length for descent, rather than to excise it. This
    trades a small ongoing malignancy risk in the remnant, managed by
    surveillance, against a large and immediate iatrogenic fertility risk. Where
    excision is unavoidable, subtotal hysterectomy with deliberate preservation
    of the vasa is the compromise.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Mullerian-remnant-sparing surgical technique
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Impaired Spermatogenesis and Excurrent Duct Compromise
    description: >-
      Sparing the remnant avoids the iatrogenic component of excurrent duct and
      testicular vascular injury.
    evidence:
    - reference: PMID:9187705
      reference_title: "Surgical management of persistent müllerian duct syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgical excision of persistent müllerian duct structure may result in ischemic and/or traumatic damage to the vasa deferentia and testes."
      explanation: >-
        States the specific harm the sparing technique is designed to avoid,
        which is the mechanism this treatment targets.
  evidence:
  - reference: PMID:9187705
    reference_title: "Surgical management of persistent müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meticulous proximal salpingectomy and hysterectomy is indicated only in patients whose müllerian structures limit intrascrotal placement of the tests."
    explanation: >-
      Restricts excision to the case where the remnant blocks descent,
      establishing preservation as the default. (The source's typographical
      "tests" for "testes" is reproduced verbatim.)
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Müllerian remnant was preserved to maintain testicular vascularity."
    explanation: >-
      A worked case in which the remnant was deliberately left in situ for
      vascular preservation.
  - reference: PMID:26246705
    reference_title: "Persistent Müllerian Duct Syndrome (PMDS): a Rare Anomaly the General Surgeon Must Know About."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients intraoperatively had uterus with fallopian tubes and underwent subtotal hysterectomy with preservation of vas."
    explanation: >-
      Illustrates the subtotal-excision compromise, in which the vas is
      deliberately spared.
- name: Excision of Mullerian Remnants
  description: >-
    Hysterectomy with proximal salpingectomy, removing the retained structures.
    Reserved for cases where the remnant prevents intrascrotal placement of the
    testis, or is symptomatic, and used more often in adults, where the
    remaining fertility to protect is smaller and cumulative malignancy exposure
    is longer. It is not the default in children.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hysterectomy with proximal salpingectomy of Mullerian remnants
    term:
      id: NCIT:C15256
      label: Hysterectomy
  target_mechanisms:
  - target: Neoplastic Transformation of Retained Mullerian Epithelium
    description: >-
      Removing the epithelium removes the tissue at risk of malignant change.
    evidence:
    - reference: PMID:26246705
      reference_title: "Persistent Müllerian Duct Syndrome (PMDS): a Rare Anomaly the General Surgeon Must Know About."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Early treatment is needed to maintain fertility and to prevent the occurrence of malignancy in remnant müllerian structures."
      explanation: >-
        States prevention of remnant malignancy as the goal of removing the
        structures, which is the mechanism this treatment targets.
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in other reports, the Mullerian structures are excised, especially in adults"
    explanation: >-
      Records excision as a used option and its skew toward adult patients.
- name: Inguinal Hernia Repair
  description: >-
    Repair of the associated inguinal hernia, frequently the operation at which
    PMDS is first recognized. Recognizing Mullerian structures in the sac should
    stop reflexive excision and prompt karyotype, gonadal biopsy and endocrine
    assessment before further surgery.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Herniorrhaphy
    term:
      id: NCIT:C168249
      label: Herniorrhaphy
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main surgical considerations are repairing associated inguinal hernias; preserving gonadal function and fertility and minimising the risk of malignant change by early orchidopexy and careful preservation of gonadal vasculature and vasal and ductal structures; and long-term surveillance for potential malignancy in pexed testes and retained Müllerian structures."
    explanation: >-
      Lists hernia repair first among the surgical considerations in PMDS.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gonadal biopsy and karyotype before proceeding to orchidopexy will help to give the family time to understand the condition, to get reassurance about the karyotype, and to get objective reassurance about the presence of normal testicular tissue."
    explanation: >-
      Supports pausing for karyotype and biopsy once Mullerian structures are
      found intraoperatively.
- name: Long-term Surveillance of Preserved Mullerian Remnants and Pexed Testes
  description: >-
    Where the remnant is left in situ, annual ultrasound with periodic MRI is
    used to watch for growth or a new mass, alongside examination of the pexed
    testes. There is no evidence base establishing either the optimal modality
    or the interval; the practice follows from the malignancy risk rather than
    from trial data, and that uncertainty should be stated to families.
  action_category: MONITORING
  treatment_term:
    preferred_term: Imaging surveillance of retained Mullerian structures
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the Müllerian remnant is left in situ, the literature advocates regular ultrasound surveillance, such as annually, to assess for change in size or new mass lesions"
    explanation: >-
      States the surveillance practice for a preserved remnant.
  - reference: PMID:35386545
    reference_title: "Persistent Müllerian Duct Syndrome: Understanding the Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, there is no data to suggest whether one modality is superior for surveillance purposes, and there is no data to guide the frequency of surveillance should it be undertaken."
    explanation: >-
      Records the absence of an evidence base for modality or interval, which is
      the caveat curated in this treatment's description.
- name: Semen Analysis and Sperm Cryopreservation
  description: >-
    Assessment of ejaculated semen and banking of any sperm recovered. Where the
    excurrent ducts are intact and at least one testis is scrotal, spontaneous
    paternity is possible, so a semen analysis is the first step in the fertility
    arm rather than an afterthought. Banking before any further Mullerian or
    inguinal surgery matters because the vasa run in the wall of the remnant and
    each operation carries its own risk of obstructing them.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: sperm cryopreservation
    term:
      id: NCIT:C16475
      label: Cryopreservation
  target_mechanisms:
  - target: Impaired Spermatogenesis and Excurrent Duct Compromise
    description: >-
      Banking sperm while they are still obtainable preserves reproductive
      options against the progressive and iatrogenic components of this
      mechanism, without altering the mechanism itself.
    evidence:
    - reference: PMID:39682529
      reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mechanisms involved are cryptorchidism and late orchidopexy, male excretory duct anomalies, and iatrogenic lesions."
      explanation: >-
        Names the iatrogenic and progressive components of the infertility that
        banking before further surgery is intended to outrun.
  evidence:
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "came to our medical center for routine semen analysis"
    explanation: >-
      Semen analysis as the entry point to the reproductive workup in an adult
      later diagnosed with PMDS.
  notes: >-
    NCIT has no term labelled "sperm cryopreservation" or "semen analysis"
    reachable from Clinical Intervention or Procedure (NCIT:C25218), so the
    generic Cryopreservation action is bound and the specificity is carried in
    preferred_term.
- name: Testicular Sperm Extraction
  description: >-
    Microdissection testicular sperm extraction (micro-TESE) in men with
    azoospermia, to recover spermatozoa directly from the testis when none reach
    the ejaculate. This is the intervention that addresses the excurrent-duct
    limb of the infertility, since sperm may be produced but unable to leave.
    Reported success is roughly one man in two, comparable to non-obstructive
    azoospermia without PMDS, so a negative result is common and should be
    anticipated in counselling.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: microdissection testicular sperm extraction
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  target_mechanisms:
  - target: Impaired Spermatogenesis and Excurrent Duct Compromise
    description: >-
      Retrieving sperm from the testis bypasses the obstructed or injured
      excurrent duct that this mechanism describes.
    evidence:
    - reference: PMID:35052499
      reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Micro-TESE was performed and sperms were observed; Müllerian remnants were removed laparoscopically."
      explanation: >-
        Sperm recovered directly from the testis in a PMDS patient who was
        azoospermic on semen analysis, which is what this treatment targets.
  evidence:
  - reference: PMID:35052499
    reference_title: "Identification of AMH and AMHR2 Variants Led to the Diagnosis of Persistent Müllerian Duct Syndrome in Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No sperms in semen was observed in cases 1 and 2 of this study, and the micro-TESE success rate was 50%"
    explanation: >-
      The reported retrieval rate in this series, and the comparison with
      non-PMDS azoospermia that sets the counselling expectation.
  notes: >-
    NCIT has no term labelled "testicular sperm extraction" reachable from
    Clinical Intervention or Procedure (NCIT:C25218); the action term bound here
    is Sperm Retrieval and the technique is carried in preferred_term.
- name: Intracytoplasmic Sperm Injection
  description: >-
    Assisted fertilization using surgically retrieved sperm. It is the step that
    converts a successful extraction into a chance of biological paternity, and
    it is the only route available once the excurrent ducts are congenitally
    abnormal or have been injured during Mullerian or inguinal surgery.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Impaired Spermatogenesis and Excurrent Duct Compromise
    description: >-
      Fertilization in vitro removes the requirement for sperm transit through
      the compromised excurrent duct entirely.
    evidence:
    - reference: PMID:39682529
      reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "If spermatogenesis is present, testicular sperm extraction followed by ICSI may be used to facilitate conception in cases of congenital or iatrogenic lesions of the male excretory ducts"
      explanation: >-
        Names both the indication - congenital or iatrogenic excretory duct
        lesions - and the extraction-plus-injection sequence this treatment
        completes.
  evidence:
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fertility is rare but possible if at least one testis is scrotal and its excretory ducts are intact."
    explanation: >-
      Sets the baseline this treatment is meant to improve on: unassisted
      paternity depends on an intact excretory duct, which assisted
      fertilization does not require.
- name: Orchidectomy for a Nonviable or Malignancy-Suspicious Testis
  description: >-
    Removal of a testis that is atrophic, unsalvageable after repeated attempts
    at fixation, or carries a mass suspicious for malignancy. It is the
    counterpart to orchidopexy and not an alternative to it: the aim throughout
    is to place a viable testis in the scrotum, and orchidectomy is what remains
    once that testis has been lost. Because the malignancy risk in PMDS is
    carried by the malpositioned gonad, an intra-abdominal testis that cannot be
    brought down and cannot be examined is the situation in which the decision
    arises.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orchidectomy of a nonviable or malignancy-suspicious testis
    term:
      id: NCIT:C15288
      label: Orchiectomy
  target_mechanisms:
  - target: Germ Cell Neoplasia Risk in the Malpositioned Testis
    description: >-
      Removing a testis that cannot be placed in the scrotum or examined
      removes the tissue that carries the germ cell tumour risk.
    evidence:
    - reference: PMID:39682529
      reference_title: "Persistent Müllerian Duct Syndrome with Supernumerary Testicles Due to a Novel Homozygous Variant in the AMHR2 Gene and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In September 2021, at the age of 12, surgery was repeated on the left hemiscrotum, and a small atrophic left testicle was discovered, for which an orchidectomy was performed, taking into account the risk of malignancy."
      explanation: >-
        A worked case giving both indications together: an atrophic testis
        removed explicitly on the malignancy-risk rationale this link asserts.
  evidence:
  - reference: PMID:32172781
    reference_title: "Persistent Müllerian duct syndrome: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testicular malignant degeneration occurs in 33% of adults with PMDS."
    explanation: >-
      The malignancy burden that makes removal of an unsalvageable, unexaminable
      testis a considered option rather than an abandonment of fertility.
animal_models:
- name: Amhr2 (MIS type II receptor) mutant mouse
  species: Mouse
  genotype: Amhr2 null (MIS type II receptor mutant)
  publication: PMID:8895659
  description: >-
    Receptor-null male mice retain a uterus and oviducts alongside a complete
    male reproductive tract, phenocopying the ligand-null mouse. They produce
    sperm but are largely infertile because the retained female structures
    obstruct sperm transfer. The model reproduces the PMDS dissociation and shows
    that ligand and receptor loss converge on the same phenotype.
  modeled_mechanisms:
  - target: Failure of Mullerian Duct Regression
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Genetic ablation of the AMH type II receptor in the mouse reproduces
      retention of uterus and oviducts in an otherwise male animal.
    limitations: >-
      Mouse testes descend on a different anatomical schedule from human testes,
      so the model does not reproduce the cryptorchidism and inguinal
      presentations that dominate the human clinical picture. Infertility in the
      mouse arises mechanically from obstructed sperm transfer rather than from
      the malpositioned-testis and surgical-injury routes that operate in humans.
    evidence:
    - reference: PMID:8895659
      reference_title: "Genetic analysis of the Müllerian-inhibiting substance signal transduction pathway in mammalian sexual differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MIS receptor mutant males develop as internal pseudohermaphrodites, possessing a complete male reproductive tract and also a uterus and oviducts, a phenocopy of MIS ligand-deficient male mice."
      explanation: >-
        Reports the retained Mullerian derivatives alongside an intact male
        tract, the node this model is linked to.
  evidence:
  - reference: PMID:8895659
    reference_title: "Genetic analysis of the Müllerian-inhibiting substance signal transduction pathway in mammalian sexual differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All produce sperm, but the majority were infertile because the presence of their female reproductive organs blocks sperm transfer into females."
    explanation: >-
      Establishes the model's reproductive phenotype and the mechanical route by
      which it arises in the mouse.
- name: Mullerian-mesenchyme-specific Bmpr1a conditional knockout mouse
  species: Mouse
  genotype: Bmpr1a (Alk3) conditional knockout in Mullerian duct mesenchyme
  publication: PMID:12368913
  description: >-
    Deleting the shared type I BMP receptor Bmpr1a specifically in Mullerian duct
    mesenchyme leaves oviducts and uteri in male mice, identifying Bmpr1a as the
    type I receptor for AMH-induced regression. This is the model that
    establishes the receptor-complex step downstream of AMHR2.
  evidence:
  - reference: PMID:12368913
    reference_title: "Requirement of Bmpr1a for Müllerian duct regression during male sexual development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Amh induces regression by binding to a specific type II receptor (Amhr2) expressed in the mesenchyme surrounding the ductal epithelium."
    explanation: >-
      Establishes that the mesenchyme this model manipulates is the AMH-receiving
      compartment, which is what makes the conditional knockout informative for
      the human receptor step.
  modeled_mechanisms:
  - target: Failed AMH Receptor Signaling in Mullerian Duct Mesenchyme
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Tissue-specific deletion isolates the type I receptor requirement within
      the periductal mesenchyme.
    limitations: >-
      BMPR1A variants have not been reported as a cause of human PMDS, so the
      model establishes the pathway architecture rather than a human disease
      gene. Type I receptor usage is partly redundant in mouse, so a single
      conditional knockout may not map cleanly onto the human requirement.
    evidence:
    - reference: PMID:12368913
      reference_title: "Requirement of Bmpr1a for Müllerian duct regression during male sexual development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results identify Bmpr1a as a type I receptor for Amh-induced regression of Müllerian ducts."
      explanation: >-
        States the conclusion the model supports about the receptor complex
        annotated on this node.
- name: Canine AMHR2 p.Arg81Ter Miniature Schnauzer (naturally occurring PMDS)
  species: Dog
  genotype: AMHR2 c.241C>T (p.Arg81Ter) homozygous, sex-limited autosomal recessive
  background: Miniature Schnauzer (Canis lupus familiaris, NCBITaxon:9615)
  publication: PMID:29194807
  description: >-
    Naturally occurring, breed-enriched PMDS in the Miniature Schnauzer, caused by
    a nonsense variant in the third exon of AMHR2 that abolishes receptor
    expression. Affected males retain oviducts, uterus, uterine body, cervix and
    a cranial vagina, and about half are unilaterally or bilaterally cryptorchid.
    This is the point of the model: it reproduces the retained Mullerian
    derivatives that the mouse also reproduces, and in addition the failure of
    testicular descent that the mouse does not, so it is the only available
    whole-organism system in which the tethering step can be observed rather than
    inferred. It is a spontaneous, outbred, population-level model rather than an
    engineered one - the variant was found at an allele frequency of 0.16 among
    216 North American Miniature Schnauzers, with 27 percent carriers.
  notes: >-
    Curated in response to the HUMAN_MODEL_MISMATCH discussion in this entry,
    which argues that the dog is the better model for the mechanical-tethering
    step and proposes canine descent phenotyping as the resolving experiment.
    Sertoli-cell tumours are reported in canine PMDS in the wider veterinary
    literature, but no exactly quotable statement of that was found in the
    references cached for this entry, so the tumour claim here is kept at the
    level the sources support - increased risk of testicular tumours.
  modeled_mechanisms:
  - target: Mechanical Tethering of the Testis by Retained Mullerian Structures
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Affected dogs carry the retained Mullerian derivatives and, unlike the
      Amh-null and Amhr2-null mouse, present with cryptorchidism, so retention
      and failed descent co-occur in one animal as they do in human PMDS.
    limitations: >-
      Cryptorchidism is reported in roughly half of affected dogs rather than in
      all of them, and canine testicular descent is not on the human schedule, so
      the co-occurrence establishes that retention and failed descent travel
      together in this species without demonstrating the tether itself. The
      allele is breed-restricted: the same study sequenced AMH and AMHR2 in a
      PMDS-affected Belgian Malinois and found no causal variant, so canine PMDS
      is not one genetic entity. The cohort is a genotyping survey, not a
      gubernacular or cord-anatomy study, and no measurement of the attachment
      between remnant and testis was made.
    readouts:
    - name: Proportion of PMDS-affected dogs that are cryptorchid
      target: Mechanical Tethering of the Testis by Retained Mullerian Structures
      direction: INCREASED
      interpretation: >-
        Failure of descent in about half of affected animals, against a low
        breed background rate, is the observation that distinguishes this model
        from the rodent models of the same pathway.
      evidence:
      - reference: PMID:29194807
        reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "An estimated 50% of male dogs affected by PMDS are cryptorchid"
        explanation: >-
          Reports the measurement behind this readout.
    - name: Mullerian derivatives retained in affected males
      target: Mechanical Tethering of the Testis by Retained Mullerian Structures
      direction: INCREASED
      interpretation: >-
        The retained structures are present and anatomically continuous with the
        male tract, which is the substrate the tether requires.
      evidence:
      - reference: PMID:29194807
        reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Affected males can have oviducts, a uterus, uterine body, cervix, and even a cranial vagina that enters into the prostate"
        explanation: >-
          Records the retained derivatives in affected dogs, the anatomical
          finding this readout measures.
    evidence:
    - reference: PMID:29194807
      reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "An important consequence of this syndrome is bilateral or unilateral cryptorchidism, which often occurs in PMDS-affected dogs and causes infertility as well as increased risk for testicular tumors"
      explanation: >-
        Establishes that in the dog the retained Mullerian structures and failed
        descent occur together and carry the same downstream consequences as in
        human PMDS, which is what makes this model informative for the tethering
        node.
  evidence:
  - reference: PMID:29194807
    reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The genetic basis for PMDS in Miniature Schnauzers is a sex-limited autosomal recessive C to T transition (c.241C>T; p.R81*) nonsense mutation in the third exon of the AMHR2 gene"
    explanation: >-
      Names the causal allele and its inheritance, establishing that the canine
      lesion is in the same gene as human PMDS type II.
  - reference: PMID:29194807
    reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As a result, AMHR2 is not expressed, and the Müllerian ducts fail to regress in affected males."
    explanation: >-
      States the molecular consequence, matching the receptor-loss step curated
      at the head of this entry's pathograph.
  - reference: PMID:29194807
    reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Miniature Schnauzer cohort had an AMHR2 mutation allele frequency of 0.16 and a carrier genotypic frequency of 0.27."
    explanation: >-
      Quantifies how common the allele is in the breed, which is what makes the
      model practically available rather than a single case report.
  - reference: PMID:29194807
    reference_title: "Prevalence of the AMHR2 mutation in Miniature Schnauzers and genetic investigation of a Belgian Malinois with persistent Müllerian duct syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The genetic basis for PMDS in the Belgian Malinois was not determined, as no coding or splicing mutations were identified in either AMH or AMHR2."
    explanation: >-
      A negative result in a second breed, recording that canine PMDS is not a
      single genetic entity and bounding what this model generalizes to.
discussions:
- discussion_id: pmds_mouse_model_lacks_descent_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Mechanical Tethering of the Testis by Retained Mullerian Structures
  prompt: >-
    Does the mouse AMH-pathway knockout, which retains Mullerian derivatives
    without the cryptorchidism that dominates human PMDS, model the mechanical
    tethering step at all?
  rationale: >-
    The Amh-null and Amhr2-null mouse faithfully reproduces the retained uterus
    and oviducts, but mouse testes are not scrotal on the human schedule and the
    knockouts are not reported as cryptorchid. The single most clinically
    consequential step in human PMDS - the retained structures physically
    preventing testicular descent, and thereby generating the cryptorchidism,
    hernia, ectopia, malignancy risk and infertility that bring patients to
    surgery - is therefore not observable in the standard rodent model. The
    human evidence for it is inference from operative anatomy rather than
    experiment. The dog, in which spontaneous AMHR2-related PMDS does present
    with undescended testes, is the better model for this specific step.
  proposed_experiments:
  - experiment_id: canine_amhr2_descent_phenotyping
    name: Comparative gubernacular and descent phenotyping in canine AMHR2-related PMDS
    description: >-
      Characterize gubernacular attachment, cord anatomy and testicular position
      in dogs with naturally occurring AMHR2-related PMDS against unaffected
      littermates, to test whether the retained Mullerian structures are the
      physical constraint on descent rather than a co-occurring finding.
    readouts:
    - name: Testicular position relative to the inguinal ring
      target: pathophysiology#Mechanical Tethering of the Testis by Retained Mullerian Structures
      direction: ALTERED
      interpretation: >-
        A tether-dependent constraint predicts that testicular position tracks
        the extent and attachment of the retained structures.
notes: >-
  Positioning against the other disorders of sex development already in the
  knowledge base. PMDS is not a gonadal dysgenesis and should not be grouped with
  the 46,XY gonadal dysgenesis entries: the gonads are histologically normal
  testes, they secrete testosterone normally, and external virilization is
  complete. Nor is it an androgen-pathway disorder like androgen insensitivity or
  5-alpha-reductase 2 deficiency, in which the testis is normal but the
  testosterone or dihydrotestosterone arm fails and external masculinization is
  incomplete. PMDS is the mirror image of those conditions: the androgen arm is
  intact and the AMH arm alone is broken. This one-arm lesion is what makes the
  entry mechanistically distinctive and is the reason the preserved Leydig-cell
  node is curated explicitly rather than left implicit.

  No mechanism module in kb/modules/ was a genuine fit for the AMH ligand-receptor
  failure, so no conforms_to is declared. The nearest candidates were checked and
  rejected: aortopathy_tgfbeta_dysregulation concerns excess TGF-beta signaling
  in the aortic wall rather than loss of a TGF-beta family ligand-receptor pair,
  and the serial-homology modules cover repeated developmental elements rather
  than a single hormone-dependent regression event.

  Two findings from the deep-research report were deliberately not curated. A
  series in which three of eight patients developed cysts in a preserved
  Mullerian remnant would pair naturally with the remnant-preservation treatment
  modelled here, but no exactly quotable statement of it exists in any reference
  cached for this entry, and the report attributes it to a page range of a review
  whose cached full text does not contain the word. Sertoli-cell tumours in
  canine PMDS are likewise reported in the wider veterinary literature but not
  quotable from the cached canine reference, so the animal-model record states
  increased testicular tumour risk instead. Both are recorded here so a later
  curator can fetch a primary source rather than rediscover the gap.

  The remnant-preservation treatment is bound to the generic NCIT Surgical
  Procedure term (NCIT:C15329) on purpose. The intervention is defined by what it
  leaves behind rather than by what it removes, and NCIT was searched without
  finding a clinical-action term for operating around a structure while
  preserving it; a more specific term naming an excision would misstate the
  treatment.

  Retained Fallopian tubes are curated inside the "Presence of Uterus in 46,XY
  Individual" phenotype rather than as a separate phenotype, because HPO has no
  term for the presence of Fallopian tubes in a 46,XY individual and the
  available fallopian-tube terms all code morphological abnormality, which is not
  what is being asserted.

  Serum AMH is curated as two subtype-attributed biochemical records rather than
  one, because the informative content is the discrepancy between them: a low
  value points to the ligand gene and a normal value to the receptor gene, and a
  single record could not carry both. Note that a normal serum AMH does not
  exclude PMDS.

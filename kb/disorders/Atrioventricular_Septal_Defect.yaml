    explanation: Monitor residual shunts, AV valve dysfunction, ventricular function, outflow obstruction and rhythm/conduction disease. Frequency and imaging depend on residual lesions and physiology; transition to adult congenital care is needed. A reassuring early repair does not remove late risks.
- name: Pulmonary hypertension specialist care
  description: Adults with repaired or unrepaired AVSD and PAH should be managed jointly with pulmonary-hypertension expertise (Class I, C-LD). Disease-specific drug selection and shunt decisions depend on hemodynamics and overall congenital anatomy.

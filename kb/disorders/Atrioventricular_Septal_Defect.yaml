pathophysiology:
- name: Increased HMGN1 Dosage
  biological_scale: MOLECULAR
  description: An experimentally supported contributor to trisomy 21-associated cardiac development. Increasing HMGN1 expression in disomic human cell models and reducing its copy number in trisomic cells test dosage dependence; the study does not show that HMGN1 alone causes every human AVSD.
  evidence:
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy 21.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: A CRISPR-activation single-cell RNA droplet sequencing (CROP-seq) screen of chromosome 21 genes expressed during heart development revealed that HMGN1 upregulation mimics this shift
    explanation: HMGN1 activation in human pluripotent-cell-derived cardiomyocytes reproduces a transcriptional shift.
  genes:

discussions:
- discussion_id: gap_developmental_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: Which developmental route accounts for each AVSD genotype and anatomical subtype?
  rationale: Human AVSD is etiologically heterogeneous. Endocardial growth, distinct mesenchymal components, myocardial identity and laterality can contribute in different models. Modifier crosses that produce VSD or secundum ASD cannot be assumed to reproduce the human common-junction defect. No single obligatory EndoMT or two-hit pathway is established.
  attaches_to:
  - pathophysiology#Deficient Atrioventricular Septation
  evidence:
  - reference: PMID:38884733
    reference_title: Molecular Pathways and Animal Models of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: The role of the dorsal mesenchymal protrusion (DMP) in AVSD pathogenesis has been well-documented in studies using animal models for AVSDs
    explanation: Multiple developmental components require distinction.
- discussion_id: gap_diet_specificity
  kind: KNOWLEDGE_GAP
  prompt: Do maternal dietary associations in pooled congenital heart disease apply specifically to AVSD?
  rationale: The Baby Hearts Study pooled 242 non-genetic CHD cases and 966 controls; only 11 cases were in the broad AV-junction/valve category, and no subtype-specific effect estimates were published. Frequent intake of the listed folate-rich fruits was associated with lower pooled CHD odds, but no causal dietary constituent was established. Its diabetes estimate was crude; the four exposed cases were VSD, transposition or double-inlet left ventricle, not AVSD. Do not use this source for an AVSD-specific protective diet, a diabetes mechanism, or a fruit/folate-to-septation edge.
  evidence:
  - reference: PMID:32092068
    reference_title: 'Risk factors for congenital heart disease: The Baby Hearts Study, a population-based case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We do not give results specific to CHD type in this paper due to lack of sta- tistical power but they are available on request.
    explanation: The source explicitly limits subtype inference.
  - reference: PMID:32092068
    reference_title: 'Risk factors for congenital heart disease: The Baby Hearts Study, a population-based case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: This type of study cannot identify which dietary components are causally associated, and the possibility of unmeasured confounding cannot be excluded
    explanation: Limits nutrient mediation and causal interpretation.
- discussion_id: gap_model_assay_lineage
  kind: KNOWLEDGE_GAP
  prompt: Which cells generate the outgrowth measured in an AVC explant?
  rationale: Cell morphology alone can misclassify epicardial outgrowth as endocardial transition. Lineage and stage controls are essential before assigning an AVSD mechanism to an intervention in this mixed-cell assay.
  attaches_to:
  - pathophysiology#Impaired Endocardial Cushion Growth
  evidence:
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal transition in the mouse atrioventricular canal explant assay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The presence of epicardium thus confounds interpretations of EndoMT signalling pathways in this assay.
    explanation: Direct assay limitation.

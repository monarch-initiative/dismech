- name: Euploid Creld1 and Hey2 double heterozygotes
  species: Mouse
  genotype: Creld1+/−; Hey2+/−
  publication: PMID:22523272
  description: Combined heterozygosity produced ostium secundum ASD in three of 31 newborns, whereas neither single-heterozygous group showed a septal defect at P0. This tests interaction on a euploid background, separately from trisomy.
  notes: The lesion is secundum ASD, not AVSD. Small, background-dependent penetrance does not establish a universal human oligogenic requirement.
  evidence:
  - reference: PMID:22523272
    reference_title: Genetic modifiers predisposing to congenital heart disease in the sensitized Down syndrome population.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: No septal defects were detected at P0 in 90 pups that were either Creld1+/− (n=45) or Hey2+/− (n=45)
    explanation: Single-heterozygous controls in the combined-modifier experiment.
- name: Dp1Tyb Hmgn1 dosage correction
  species: Mouse
  genotype: Dp1Tyb with one Hmgn1 allele removed
  publication: PMID:41125893
  description: E11.5 single-cell profiling tests AVC myocardial state after Hmgn1 dose correction; E15.5 micro-CT measures ventricular and outflow septal defects. The trisomic group had such defects in eight of 33 embryos. Correction attenuated these structural defects and neonatal lethality.
  notes: The structural endpoint is not a validated count of human-type common-junction AVSD. Small atrial defects were difficult to distinguish from patent foramen ovale. Transcriptomic sample counts were small, and corrected AVC cell proportions did not establish lineage replacement. Survival benefit is not shown to be mediated exclusively by cardiac rescue; HMGN1-alone anatomical sufficiency remains untested.
  evidence:

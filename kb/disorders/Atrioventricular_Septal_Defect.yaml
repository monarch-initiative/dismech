- name: Altered NR2F2 Transcriptional Regulation
  biological_scale: MOLECULAR
  description: AVSD-associated coding variants change activation of NGFI-A or APOB reporters in a promoter-dependent manner; some increase and others decrease or preserve output. APOB repression in HepG2 cells remains intact. This is not a uniform loss-of-function mechanism or a patient endocardial measurement.

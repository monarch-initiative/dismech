- name: Human NFATC1 variant RNA in zebrafish
  species: Zebrafish
  genotype: One-cell-stage ectopic human NFATC1 Val210Met, Ala367Val or Ala696Thr mRNA
  publication: url:https://www.hubrecht.eu/app/uploads/2017/11/Den-Hertog-publicatie-Human-Mutation-2018.pdf
  description: Human variant mRNA injection alters 24–48-hour cardiac morphology, looping and AVC marker domains relative to wild-type NFATC1 or GFP controls. Val210Met/Ala367Val accelerated and Ala696Thr retarded looping; chamber-marker specification remained broadly preserved. Histology examined six embryos per construct.
  notes: This is ectopic overexpression rather than an endogenous heterozygous knock-in. Edema, abnormal looping and AVC patterning are not a demonstration of the complete human AVSD anatomy or patient rescue. Other undiscovered human variants and one co-occurring TBX1 variant limit patient attribution.
  evidence:
  - reference: url:https://www.hubrecht.eu/app/uploads/2017/11/Den-Hertog-publicatie-Human-Mutation-2018.pdf

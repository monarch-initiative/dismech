name: Atrioventricular Septal Defect
creation_date: '2026-08-27T20:00:00Z'
updated_date: '2026-08-27T20:00:00Z'
description: >-
  Atrioventricular septal defect (AVSD), also called atrioventricular canal defect
  or endocardial cushion defect, is a congenital cardiac malformation defined by a
  common atrioventricular junction with deficient atrioventricular septation. The
  lesion comprises an ostium primum atrial communication and/or an inlet
  ventricular septal defect together with an abnormal atrioventricular valve —
  either a single common valve (complete AVSD) or two orifices with a cleft left
  atrioventricular valve (partial AVSD). AVSD accounts for 4-7% of congenital
  cardiac malformations and has the tightest association of any congenital heart
  defect with trisomy 21: it is the commonest heart defect in Down syndrome, and a
  large share of all AVSD occurs in that context. Developmentally it arises from
  failure of the atrioventricular mesenchymal complex — historically attributed to
  the endocardial cushions alone, but now understood to involve the dorsal
  mesenchymal protrusion and the mesenchymal cap of the primary atrial septum as
  well. Haemodynamically the common junction produces a large left-to-right shunt
  with atrioventricular valve regurgitation, causing infantile congestive heart
  failure and, if unrepaired, irreversible pulmonary vascular obstructive disease.
  Diagnosis is echocardiographic and treatment is surgical repair in infancy, with
  long-term survival now approaching 80-88% at 10-25 years and left
  atrioventricular valve regurgitation the principal driver of reoperation.
categories:
- Congenital Heart Defect
- Structural Birth Defect
- Endocardial Cushion Defect
parents:
- congenital heart disease
epidemiology:
- name: Proportion of congenital cardiac malformations
  description: >-
    AVSD accounts for 4-7% of all congenital cardiac malformations, making it a
    major lesion class rather than a rare anomaly.
  evidence:
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Atrioventricular septal defects (AVSD) represent 4-7% of congenital cardiac
      malformations.
    explanation: Gives the proportion of congenital cardiac malformations represented by
      AVSD.
- name: Association with Down syndrome
  description: >-
    Congenital heart defects affect roughly 40% of individuals with Down syndrome,
    and AVSD is the commonest of those defects. Trisomy 21 confers an approximately
    1000-fold enrichment of atrioventricular canal defects specifically.
  evidence:
  - reference: PMID:29054759
    reference_title: CRELD1 gene variants and atrioventricular septal defects in Down
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Congenital heart defects (CHD) are seen in around 40% of the Down syndrome
      patients. Atrioventricular Septal Defect (AVSD) or endocardial cushion defect is
      commonest form of CHD in these children.
    explanation: Establishes the frequency of CHD in Down syndrome and AVSD as the
      predominant lesion.
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy
      21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CHDs occur in around 50% of cases of Down syndrome, with an approximately
      1,000-fold enrichment of atrioventricular canal (AVC) defects that disrupt the
      junction between the atria and ventricles
    explanation: Quantifies the magnitude of AVC-defect enrichment attributable to trisomy
      21.
has_subtypes:
- name: Complete
  display_name: Complete AVSD (common atrioventricular valve)
  description: >-
    A single common atrioventricular valve with both an ostium primum atrial
    communication and an inlet ventricular septal defect. Presents earliest with
    heart failure and carries the highest risk of early pulmonary vascular disease.
  evidence:
  - reference: PMID:32965865
    reference_title: Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: complete AVSD features a common AVV, an ostium primum atrial septal defect,
      and an
    explanation: Defines the anatomic components of the complete form.
- name: Partial
  display_name: Partial AVSD (ostium primum ASD with cleft left AV valve)
  description: >-
    Two separate atrioventricular valve orifices sharing a common junction, with an
    ostium primum atrial septal defect and a cleft in the left atrioventricular
    valve. Presents later than the complete form.
  evidence:
  - reference: PMID:32965865
    reference_title: Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Partial AVSD typically presents with an ostium primum atrial septal defect,
      separate AVVs with a common junction, an inlet ventricular septal defect, and a
      cleft mitral valve.
    explanation: Defines the anatomic components of the partial form.
- name: Transitional
  display_name: Transitional AVSD
  description: >-
    Intermediate form with two atrioventricular valve orifices and a restrictive
    inlet ventricular septal defect, behaving haemodynamically between the partial
    and complete forms.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 208 (83.9%) patients had complete (cAVSD), 29 (11.7%) partial
      (pAVSD), and 11 (4.4%) transitional AVSD (tAVSD).
    explanation: Documents transitional AVSD as a recognised third anatomic category in a
      large surgical series.
pathophysiology:
- name: Atrioventricular Mesenchymal Complex Failure
  description: >-
    AVSD originates in failed development of the atrioventricular mesenchymal
    complex during cardiac septation. Historically this was attributed solely to
    the endocardial atrioventricular cushions, but animal-model work has since
    shown that failure of other components — notably the dorsal mesenchymal
    protrusion, and probably the mesenchymal cap on the leading edge of the primary
    atrial septum — can produce AVSD in its own right.
  biological_processes:
  - preferred_term: endocardial cushion development
    modifier: ABNORMAL
    term:
      id: GO:0003197
      label: endocardial cushion development
  - preferred_term: cardiac septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:38884733
    reference_title: Molecular Pathways and Animal Models of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While AVSD were historically considered to result from failure of the endocardial
      atrioventricular cushions to properly develop and fuse, more recent studies have
      determined that inhibition of the development of other components of the atrioventricular
      mesenchymal complex can lead to AVSDs as well.
    explanation: Establishes that AVSD pathogenesis extends beyond endocardial cushion
      fusion to the wider atrioventricular mesenchymal complex.
  - reference: PMID:38884733
    reference_title: Molecular Pathways and Animal Models of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The role of the dorsal mesenchymal protrusion (DMP) in AVSD pathogenesis has
      been well-documented in studies using animal models for AVSDs
    explanation: Identifies the dorsal mesenchymal protrusion as a documented contributor
      to AVSD in animal models.
  downstream:
  - target: Endothelial-to-Mesenchymal Transition Failure
    description: Defective cushion development reflects impaired EndoMT in the atrioventricular
      canal.
    evidence:
    - reference: PMID:29549339
      reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
        transition in the mouse atrioventricular canal explant assay.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Atrioventricular septal defects often result from impaired endocardial cushion
        development.
      explanation: Links impaired endocardial cushion development to AVSD.
  - target: Common Atrioventricular Junction
    description: Failure of the mesenchymal complex leaves a single common atrioventricular
      junction instead of separate mitral and tricuspid orifices.
    evidence:
    - reference: PMID:38884731
      reference_title: Clinical Presentation and Therapy of Atrioventricular Septal Defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Atrioventricular septal defects (AVSDs) consist of a number of cardiac malformations
        that result from abnormal development of the endocardial cushions.
      explanation: Links abnormal endocardial cushion development to the resulting AVSD
        malformations.
- name: Endothelial-to-Mesenchymal Transition Failure
  description: >-
    Endothelial-to-mesenchymal transition (EndoMT) in the atrioventricular canal
    generates the mesenchyme that populates the endocardial cushions. Impaired
    EndoMT is a core cellular lesion in AVSD. Attribution of specific signalling
    pathways to this step should be treated cautiously: the standard explant assay
    used to assign pathway roles has been shown to be confounded by epicardial
    cells misidentified as endothelium.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion
      formation
    modifier: DECREASED
    term:
      id: GO:0003198
      label: epithelial to mesenchymal transition involved in endocardial cushion formation
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
      transition in the mouse atrioventricular canal explant assay.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Endothelial-to-mesenchymal transition (EndoMT) is a critical event in endocardial
      cushion development that initiates in the atrioventricular canal (AVC).
    explanation: Establishes EndoMT in the atrioventricular canal as the critical cellular
      event in cushion development.
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
      transition in the mouse atrioventricular canal explant assay.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: monolayers of cobblestone-shaped cells are predominantly of epicardial rather
      than endothelial origin
    explanation: Cautions that pathway roles assigned to EndoMT via the standard explant
      assay are confounded by epicardial contamination, so specific pathway attributions
      are held loosely here.
  downstream:

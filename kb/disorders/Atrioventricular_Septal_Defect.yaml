    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy 21.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Removal of one allele of Hmgn1 in the Dp1Tyb (Tg) trisomic mouse rescued the increased incidence of VSDs and outflow tract defects
    explanation: Dose correction with structural mouse endpoint.

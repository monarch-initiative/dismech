    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: For patients with a significant ventricular-level shunt, surgical repair is typically performed in the first 3-6 months of life, with optimal timing based on the ability to medically manage symptoms of pulmonary overcirculation and maintain adequate growth.
    explanation: For balanced lesions with significant ventricular shunting, repair is generally planned at 3–6 months, modified by symptom control, growth, valve regurgitation and associated anatomy. Earlier intervention may be needed for uncontrolled failure; primarily atrial-shunt partial/transitional lesions are commonly repaired in the toddler years. These pediatric ACC pathways exclude unbalanced and complex associated lesions. Patch techniques and valve reconstruction are individualized; residual shunts or regurgitation can remain.
  treatment_term:

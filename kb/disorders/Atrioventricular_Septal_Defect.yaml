    explanation: Even partial AVSD has a common junction; separate orifices do not imply normal separate junctions.
- category: Cardiovascular
  name: Congestive Heart Failure
  description: Heart failure can emerge in infancy with significant shunting or valve regurgitation; partial and restrictive transitional lesions may remain less symptomatic.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Individuals with complete AVSDs usually start to exhibit congestive heart failure (CHF) symptoms at 4 to 6 weeks of life as the pulmonary vascular resistance (PVR) drops to its nadir.
    explanation: Clinical timing in complete AVSD, not a universal onset across subtypes.
- category: Cardiovascular
  name: Atrioventricular Valve Regurgitation
  description: Common or left AV valve incompetence may occur before repair or remain/recur afterward. The quoted 18/104 postoperative observations concern one partial/transitional surgical series, not a general frequency.
  phenotype_term:
    preferred_term: Atrioventricular valve regurgitation
    term:
      id: HP:0034376
      label: Atrioventricular valve regurgitation
  evidence:
  - reference: PMID:35757952
    reference_title: Surgical Outcomes in Children With Partial and Transitional Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After initial repair, there were 18 cases of moderate-to-severe left atrioventricular valve regurgitation (17.3%).
    explanation: Quantifies moderate-to-severe left atrioventricular valve regurgitation after primary repair, the dominant residual lesion.
    quote_role: PRIMARY_RESULT
- category: Cardiovascular
  name: Pulmonary Arterial Hypertension
  description: Pulmonary arterial pressure may rise with substantial unrepaired shunting. Some patients develop increased pulmonary vascular resistance and advanced pulmonary vascular disease; progression is not inevitable in every AVSD subtype or after timely repair.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Pulmonary hypertension develops early and can progress rapidly, typically within the first 6 to 12 months of life if surgical intervention is not performed.
    explanation: Clinical synthesis concerning substantial unrepaired shunting; not proof all AVSD follows this timetable.
- category: Cardiovascular
  name: Left Axis Deviation
  description: A superior/leftward QRS axis on the electrocardiogram is the characteristic electrocardiographic signature of AVSD, reflecting the abnormal position of the conduction system around the common atrioventricular junction.
  phenotype_term:
    preferred_term: Left axis deviation
    term:
      id: HP:0033568
      label: Left axis deviation
  evidence:
  - reference: PMID:10605520
    reference_title: Neonatal ECG screening for congenital heart disease in Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: only the five infants with complete AVSD had a superior QRS axis
    explanation: In a neonatal ECG screening cohort, a superior QRS axis was specific to complete AVSD among the congenital heart defects detected.
    quote_role: PRIMARY_RESULT
- category: Cardiovascular
  name: Left Ventricular Outflow Tract Obstruction
  description: Left ventricular outflow tract obstruction arises from the abnormal ("goose-neck") geometry of the left ventricular outflow in AVSD and is a recognised complication after surgical repair.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: left ventricular outflow tract obstruction (LVOTO) has been described as a common complication following surgical repair of AVSD occurring in 2–7% of the patients
    explanation: Quantifies LVOTO as a post-repair complication of AVSD.
    quote_role: BACKGROUND
- category: Cardiovascular
  name: Postoperative Atrioventricular Block
  description: Complete heart block requiring permanent pacemaker implantation is a recognised complication of AVSD repair, reflecting the abnormal course of the conduction system around the common atrioventricular junction. This is a post-repair complication; intrinsic preoperative conduction block is not asserted here.
  phenotype_term:
    preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  evidence:
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The indication for pacemaker implantation was third-degree atrioventricular block in 4 (2.0%) patients, second-degree atrioventricular block in 1 (0.6%) patient, and sinus node dysfunction in 1 (0.5%) patient.
    explanation: Documents postoperative atrioventricular block as the leading pacemaker indication after AVSD repair.
    quote_role: PRIMARY_RESULT
- name: Tachypnea

      label: Homo sapiens
  cell_source: Isogenic disomic/trisomic hiPSCs from two genetically unrelated mosaic donors; principal perturbations in the main donor pair
  publication: PMID:41125893
  description: Day-10 precursors and day-20 cardiomyocytes were profiled. A CROP-seq screen of 66 selected chromosome 21 genes nominated HMGN1; activation in disomic cells shifted AVC myocardial expression, and three-to-two allele correction in trisomic cells partially restored it. CUT&RUN/scATAC characterized chromatin context.
  notes: Short-term differentiation and relative recovered-cell states do not establish in-vivo human lineage conversion. CLDN8 was ineffectively upregulated. Chromatin occupancy/motif overlap does not prove direct HMGN1–TBX2 binding or one necessary mediator; HMGN1-alone human anatomical sufficiency and therapy are untested.

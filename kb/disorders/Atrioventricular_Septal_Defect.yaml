treatments:
- name: Surgical Repair of Atrioventricular Septal Defect
  description: For balanced lesions with significant ventricular shunting, repair is generally planned at 3–6 months, modified by symptom control, growth, valve regurgitation and associated anatomy. Earlier intervention may be needed for uncontrolled failure; primarily atrial-shunt partial/transitional lesions are commonly repaired in the toddler years. These pediatric ACC pathways exclude unbalanced and complex associated lesions. Patch techniques and valve reconstruction are individualized; residual shunts or regurgitation can remain.
  evidence:
  - reference: url:https://www.acc.org/Latest-in-Cardiology/Articles/2025/02/03/12/17/Clinical-Practice-Algorithm-For-the-Follow-Up-of-Repaired-and-Unrepaired-Atrioventricular-Septal-Defects

  description: In repaired adults, symptomatic LV outflow obstruction or LVEF <50% is a Class I indication for repair; asymptomatic obstruction with progressive greater-than-mild aortic regurgitation may justify repair (Class IIb). Pediatric decisions depend on anatomy and progression.

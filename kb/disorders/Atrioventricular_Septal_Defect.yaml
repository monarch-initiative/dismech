- name: Left Atrioventricular Valve Repair
  description: Valve reconstruction at initial repair or reoperation addresses clinically significant incompetence; replacement may be necessary if repair is unsuitable. For repaired adults, surgery is recommended for symptomatic severe left AV valve regurgitation or asymptomatic severe regurgitation with LV end-systolic diameter ≥40 mm or LVEF <60% (Class I, B-NR). Observed associations of incomplete cleft closure with outcomes do not prove one operation is best for every valve.

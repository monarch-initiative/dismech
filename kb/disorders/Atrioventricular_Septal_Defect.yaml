- Endocardial Cushion Defect
parents:
- congenital heart disease
disease_term:
  preferred_term: atrioventricular septal defect
  term:
    id: MONDO:0859565
    label: atrioventricular septal defect
description: Atrioventricular septal defect (AVSD) is a spectrum of congenital malformations with a common atrioventricular junction, deficient septation and abnormal atrioventricular valve morphology. Complete forms have atrial and unrestricted ventricular communications; partial forms have an ostium primum atrial communication without a ventricular component, and transitional forms have a restrictive ventricular communication. Valve orifices, ventricular balance and associated lesions modify physiology and surgical options. Significant shunting or valve regurgitation can cause pulmonary overcirculation and early heart failure, whereas less severe forms may present later. Trisomy 21 is strongly associated, but genetic causes and developmental routes are heterogeneous. Echocardiography defines anatomy; repair timing and lifelong surveillance are individualized, including assessment of pulmonary vascular disease and residual valve, outflow and conduction abnormalities.
notes: This entry covers the general AVSD spectrum, including sporadic, familial and trisomy 21-associated disease; it is not limited to familial AVSD. A common atrioventricular junction does not require a single valve orifice. The current StatPearls chapter (NBK557511; PMID:32491443) is used for clinical baseline; its introductory partial-AVSD sentence incorrectly includes an inlet VSD, so the explicit body definition without VSD is used. GeneReviews lookup found no dedicated chapter. The ACC pediatric algorithm was updated in August 2026 and applies to isolated balanced lesions under age 18, excluding associated defects, pregnancy and genetic syndromes other than trisomy 21. Adult care is cited to the ACC/AHA-participating Guideline Central summary of the 2025 adult congenital guideline (PMID:41411375; copublication PMID:41411480), because primary full-text retrieval failed. The author-hosted NFATC1 full paper is PMID:30007050; its full-text URL is used where the canonical abstract does not contain the quoted results. Experimental defects in mice or fish are not equated with the complete human AVSD anatomy. Observational cohort proportions are not exported as disease-wide phenotype
  frequencies.
has_subtypes:
- name: Complete AVSD
  description: A common valve orifice, primum atrial communication and unrestricted inlet ventricular communication; substantial shunting commonly causes symptoms in infancy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Complete AVSD comprises a primum ASD, an inlet VSD, and a common AV valve with 4 to 5 leaflets
    explanation: A common valve orifice, primum atrial communication and unrestricted inlet ventricular communication; substantial shunting commonly causes symptoms in infancy.
- name: Partial AVSD
  description: Primum atrial communication without VSD, with separate right and left valve orifices within a common junction. Left valve regurgitation can materially alter otherwise atrial-shunt physiology.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Partial AVSD includes a primum ASD without a VSD. The right and left AV valves are separated by tissue, but they share a common junction.
    explanation: Primum atrial communication without VSD, with separate right and left valve orifices within a common junction. Left valve regurgitation can materially alter otherwise atrial-shunt physiology.
- name: Transitional AVSD
  description: A primum atrial communication and restrictive ventricular communication. Terminology overlaps with intermediate AVSD in some sources; classify the actual ventricular shunt and valve anatomy rather than assume equivalent physiology.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: An interatrial communication above the AV valve and a restrictive interventricular communication below it characterize a transitional AVSD.
    explanation: A primum atrial communication and restrictive ventricular communication. Terminology overlaps with intermediate AVSD in some sources; classify the actual ventricular shunt and valve anatomy rather than assume equivalent physiology.
- name: Unbalanced AVSD
  description: Unequal valve commitment and ventricular development constitute an additional anatomic dimension across AVSD classifications. Ventricular adequacy determines suitability for biventricular repair, staged recruitment or single-ventricle palliation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In these lesions, the AV valve is more committed to one ventricle. Thus, an unbalanced AVSD can be either right- or left-dominant.
    explanation: Unequal valve commitment and ventricular development constitute an additional anatomic dimension across AVSD classifications. Ventricular adequacy determines suitability for biventricular repair, staged recruitment or single-ventricle palliation.
prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 19.0
  notes: The 2024 clinical review reports 0.19 per 1000 live births, without an explicit population denominator in the available abstract. Other reviews report different estimates; this is a cited birth-prevalence estimate, not a universal contemporary registry rate.
  evidence:
  - reference: PMID:38884731
    reference_title: Clinical Presentation and Therapy of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AVSDs occur in 0.19 of 1000 live births and constitute 4-5 % of congenital heart defects.
    explanation: Gives the birth prevalence and the proportion of congenital heart defects represented by AVSD.
    quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Heterogeneous inheritance
  description: AVSD occurs with aneuploidy, defined syndromes, rare familial Mendelian disease and sporadic multifactorial susceptibility. A threshold model is useful for some susceptibility alleles, but is not a demonstrated requirement for an additional hit in every patient.
  evidence:
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Atrioventricular septal defects (AVSDs) occur as a clinical feature of several different syndromes, as autosomal dominant defects, and as sporadically occurring malformations.
    explanation: Review of etiologic heterogeneity.
phenotypes:
- category: Cardiovascular
  name: Atrioventricular Canal Defect
  description: 'The defining structural phenotype: deficient atrioventricular septation with a common atrioventricular junction.'
  phenotype_term:
    preferred_term: Atrioventricular canal defect
    term:

  notes: HMGN1 dosage modifies AVC myocardial transcription in human isogenic culture and septal-defect incidence in Dp1Tyb mice. This is experimental support for a trisomy-associated contributor, not proof of HMGN1-alone human AVSD sufficiency or a clinically validated gene therapy.

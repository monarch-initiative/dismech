    snippet: Cross-sectional imaging, including cardiac computed tomography and cardiac magnetic resonance imaging, is usually not required in uncomplicated AVSDs; however, it can be beneficial in a subset of patients, such as those with unbalanced AVSDs, to assess ventricular volumes and guide decision-making.

progression:
- phase: Anatomy-dependent presentation
  notes: Complete AVSD commonly becomes symptomatic as neonatal pulmonary vascular resistance falls, while partial or restrictive transitional lesions may present later. Valve regurgitation and associated defects modify this pattern.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In patients with a partial AVSD, symptoms might not be detected in the first few years of life and might manifest later in childhood.
    explanation: Contrasts later presentation with complete-AVSD infancy.
- phase: Repair and long-term residual lesions
  notes: Repair improves hemodynamics but does not ensure normal valve function or abolish all residual shunts, outflow obstruction or rhythm risk. Lifelong review is needed. In the 248-patient biventricular single-center cohort spanning 1995–2022, survival was 88.3% at 10 and 79.6% at 25 years; these estimates mix eras and selected operable anatomy, with few patients beyond 20 years. Patients dying after palliation before definitive repair were excluded.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Survival of the entire cohort was 88.3% at 10, 83.8% at 15, and 79.6% at 25 years.
    explanation: Selected surgical series; not a universal prognosis.
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: patients receiving PAB that did not survive until AVSD repair are not considered.
    explanation: Explicit survivorship limit.
diagnosis:
- name: Fetal and postnatal echocardiography
  description: Fetal echocardiography follows a suspected lesion on obstetric ultrasound. Postnatal echo defines atrial/ventricular communications, valve morphology and commitment, regurgitation, ventricular adequacy and associated outflow/arch lesions. Three-dimensional imaging can refine valve assessment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: When an AVSD is suspected during an obstetric ultrasound, referral to fetal cardiology for a comprehensive fetal echocardiogram is recommended
    explanation: Fetal echocardiography follows a suspected lesion on obstetric ultrasound. Postnatal echo defines atrial/ventricular communications, valve morphology and commitment, regurgitation, ventricular adequacy and associated outflow/arch lesions. Three-dimensional imaging can refine valve assessment.
  - reference: PMID:34196822
    reference_title: 'Atrioventricular Septal Defects: Pathology, Imaging, and Treatment Options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The understanding of functional morphology of AVSDs has improved significantly with detailed 3D echocardiographic evaluation of the atrioventricular junction and valve morphology.
    explanation: Clinical imaging synthesis.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
- name: Electrocardiography
  description: ECG assesses the characteristic superior/leftward axis and rhythm/conduction abnormalities; it complements rather than replaces echocardiography. A 37-neonate Down-syndrome screening study found a superior axis in five complete AVSD cases but missed seven other congenital heart defects.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The characteristic electrocardiogram in AVSDs has a leftward counterclockwise superior axis
    explanation: ECG assesses the characteristic superior/leftward axis and rhythm/conduction abnormalities; it complements rather than replaces echocardiography. A 37-neonate Down-syndrome screening study found a superior axis in five complete AVSD cases but missed seven other congenital heart defects.
  - reference: PMID:10605520
    reference_title: Neonatal ECG screening for congenital heart disease in Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: only the five infants with complete AVSD had a superior QRS axis
    explanation: Small neonatal screening cohort; no general sensitivity estimate for all AVSD.
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
- name: Clinical genetics and testing
  description: Offer genetic counseling and testing appropriate to prenatal/postnatal findings, including aneuploidy/chromosomal assessment and selected sequencing. Yield depends on ascertainment and syndromic context. One referred fetal-CHD series reported 36.8% in its AVSD subgroup; its available abstract does not provide that subgroup denominator.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Genetic testing should be offered to all families, given the higher incidence of genetic syndromes associated with this CHD.
    explanation: Offer genetic counseling and testing appropriate to prenatal/postnatal findings, including aneuploidy/chromosomal assessment and selected sequencing. Yield depends on ascertainment and syndromic context. One referred fetal-CHD series reported 36.8% in its AVSD subgroup; its available abstract does not provide that subgroup denominator.
  - reference: PMID:33142350
    reference_title: Comprehensive evaluation of genetic variants using chromosomal microarray analysis and exome sequencing in fetuses with congenital heart defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The prevalence of a genetic defect was highest in fetuses with an atrioventricular septal defect (36.8%)
    explanation: Selected fetal referral cohort, not a universal clinical diagnostic yield.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Hemodynamic assessment and cardiac catheterization
  description: Routine catheterization is unnecessary in uncomplicated infants repaired on time. Assess pulmonary arterial hypertension and pulmonary vascular resistance when late presentation, residual shunting or comorbidity makes operability uncertain; adult unrepaired or residual-shunt AVSD warrants PAH assessment (Class I, C-LD).
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiac catheterization is not a part of routine preoperative evaluation for uncomplicated AVSDs who undergo surgical repair at the appropriate timing based on the AVSD subtype.
    explanation: Routine catheterization is unnecessary in uncomplicated infants repaired on time. Assess pulmonary arterial hypertension and pulmonary vascular resistance when late presentation, residual shunting or comorbidity makes operability uncertain; adult unrepaired or residual-shunt AVSD warrants PAH assessment (Class I, C-LD).

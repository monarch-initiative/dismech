  description: >-
    A superior/leftward QRS axis on the electrocardiogram is the characteristic
    electrocardiographic signature of AVSD, reflecting the abnormal position of the
    conduction system around the common atrioventricular junction.
  phenotype_term:
    preferred_term: Left axis deviation
    term:
      id: HP:0033568
      label: Left axis deviation
  evidence:
  - reference: PMID:10605520
    reference_title: Neonatal ECG screening for congenital heart disease in Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: only the five infants with complete AVSD had a superior QRS axis
    explanation: In a neonatal ECG screening cohort, a superior QRS axis was specific to
      complete AVSD among the congenital heart defects detected.
- category: Cardiovascular
  name: Left Ventricular Outflow Tract Obstruction
  description: >-
    Left ventricular outflow tract obstruction arises from the abnormal
    ("goose-neck") geometry of the left ventricular outflow in AVSD and is a
    recognised complication after surgical repair.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: left ventricular outflow tract obstruction (LVOTO) has been described as a
      common complication following surgical repair of AVSD occurring in 2–7% of the patients
    explanation: Quantifies LVOTO as a post-repair complication of AVSD.
genetic:
- name: CRELD1
  association: Susceptibility Variant
  gene_term:
    preferred_term: CRELD1
    term:
      id: hgnc:14630
      label: CRELD1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The first identified non-syndromic AVSD susceptibility gene. CRELD1 regulates
    calcineurin/NFAT signalling. Variants raise risk without being sufficient to
    cause the defect, which is the basis of the multigenic threshold model.
  evidence:
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient
      to cause the defect, indicating that AVSD is multigenic
    explanation: Establishes CRELD1 as a susceptibility allele within a multigenic model.
- name: NFATC1
  association: Missense Variant
  gene_term:
    preferred_term: NFATC1
    term:
      id: hgnc:7775
      label: NFATC1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Calcineurin/NFAT signalling is implicated in AVSD, and CRELD1 acts as a
    regulator of that pathway. Heterozygous NFATC1 missense variants have been
    identified in isolated AVSD and in AVSD with heterotaxy, placing the pathway
    itself rather than any single gene at the centre of susceptibility.
  evidence:
  - reference: PMID:30007050
    reference_title: Heterozygous missense mutations in NFATC1 are associated with atrioventricular
      septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Multiple lines of evidence support a role of calcineurin/NFAT signaling in
      AVSD, and mutations in CRELD1, a protein functioning as a regulator of calcineurin/NFAT
      signaling have been reported in a small fraction of affected subjects.
    explanation: Links NFATC1 and CRELD1 through the shared calcineurin/NFAT axis.
- name: HMGN1
  association: Chromosome 21 Dosage
  gene_term:
    preferred_term: HMGN1
    term:
      id: hgnc:4984
      label: HMGN1
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    Chromosome 21 gene whose overexpression drives myocardial reprogramming
    implicated in trisomy 21-associated heart defects, offering a mechanism for the
    approximately 1000-fold enrichment of atrioventricular canal defects in Down
    syndrome.
  evidence:
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy
      21.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: CHDs occur in around 50% of cases of Down syndrome, with an approximately
      1,000-fold enrichment of atrioventricular canal (AVC) defects that disrupt the
      junction between the atria and ventricles
    explanation: Frames the trisomy 21 dosage problem that HMGN1 reprogramming addresses.
- name: Multigene Burden
  association: Rare Variant Enrichment
  notes: >-
    Whole-exome sequencing of non-syndromic AVSD probands shows enrichment of rare
    damaging variants across a set of 112 genes with strong biological relevance to
    AVSD, with the enrichment specific to AVSD rather than to congenital heart
    disease generally.
  evidence:
  - reference: PMID:25996639
    reference_title: Exome sequencing identifies rare variants in multiple genes in atrioventricular
      septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing was performed in 81 unrelated probands with AVSD to
      identify potentially causal variants in a comprehensive set of 112 genes with strong
      biological relevance to AVSD.
    explanation: Documents the multigene burden architecture of non-syndromic AVSD.
environmental:
- name: Maternal pregestational diabetes
  description: >-
    Maternal pregestational diabetes is the strongest established modifiable risk
    factor for non-syndromic complete atrioventricular canal defect, identified in
    a large population-based birth defects registry analysis.
  presence: PRESENT
  evidence:
  - reference: PMID:23061687
    reference_title: Descriptive epidemiology of non-syndromic complete atrioventricular
      canal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Significant associations were observed between non-syndromic CAVC in offspring
      and maternal pregestational diabetes (adjusted prevalence ratio (aPR) 6.74; 95% confidence
      interval (CI) 3.67, 12.37), gestational diabetes (aPR 1.69; 95% CI 1.03, 2.79) and obesity
      (aPR 1.69; 95% CI 1.24, 2.30).
    explanation: Quantifies maternal pregestational diabetes as the strongest environmental
      risk factor for non-syndromic complete AV canal defect.
  influences_mechanisms:
  - target: Atrioventricular Mesenchymal Complex Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal pregestational hyperglycaemia acts on the embryo during the window of
      atrioventricular septation, raising the probability that the mesenchymal complex
      fails. The intermediate steps are not established.
    evidence:
    - reference: PMID:23061687
      reference_title: Descriptive epidemiology of non-syndromic complete atrioventricular
        canal defects.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Significant associations were observed between non-syndromic CAVC in offspring
        and maternal pregestational diabetes
      explanation: Supports the predisposing effect of maternal pregestational diabetes on
        the septation defect.
- name: Folate-rich diet
  description: >-
    Frequent periconceptional consumption of folate-rich fruits was protective for
    congenital heart disease in a population-based case-control study, whereas
    folic acid supplementation alone did not show strong support.
  presence: ABSENT
  evidence:
  - reference: PMID:32092068
    reference_title: 'Risk factors for congenital heart disease: The Baby Hearts Study, a
      population-based case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there was a protective effect of frequent consumption of folate rich fruits
      (adjOR 0.64, 95%CI 0.47-0.89)
    explanation: Quantifies dietary folate as a protective factor for congenital heart disease.
  influences_mechanisms:
  - target: Atrioventricular Mesenchymal Complex Failure
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Adequate periconceptional folate lowers congenital heart disease risk overall; the
      mechanism by which it protects atrioventricular septation is not established.
    evidence:
    - reference: PMID:32092068
      reference_title: 'Risk factors for congenital heart disease: The Baby Hearts Study, a
        population-based case-control study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: there was a protective effect of frequent consumption of folate rich fruits
        (adjOR 0.64, 95%CI 0.47-0.89)
      explanation: Supports the protective direction of the effect asserted on this link.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Ts65Dn trisomic background crossed with Creld1 or Hey2 loss-of-function alleles
  category: Transgenic
  description: >-
    The Ts65Dn mouse models Down syndrome gene dosage. Crossing loss-of-function
    alleles of Creld1 or Hey2 onto this sensitised background raises congenital
    heart defect frequency, providing direct in vivo support for the
    dosage-sensitised multigenic threshold model of AVSD.
  genes:
  - preferred_term: CRELD1
    term:
      id: hgnc:14630
      label: CRELD1
  associated_phenotypes:
  - Congenital heart defect
  evidence:
  - reference: PMID:22523272
    reference_title: Genetic modifiers predisposing to congenital heart disease in the sensitized
      Down syndrome population.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Crossing loss-of-function alleles of either Creld1 or Hey2 onto the trisomic
      background caused a significant increase in the frequency of CHD
    explanation: Demonstrates in vivo that additional genetic hits on a trisomic background
      raise congenital heart defect frequency.
diagnosis:
- name: Echocardiography
  description: >-
    Echocardiography is the diagnostic modality for AVSD, defining the common
    atrioventricular junction, the atrial and ventricular components of the defect,
    valve morphology and the degree of regurgitation. AVSD is frequently detected
    on fetal echocardiography.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:34196822
    reference_title: 'Atrioventricular Septal Defects: Pathology, Imaging, and Treatment Options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical presentation and timing of intervention differ by morphological subset
      and functional anatomy.
    explanation: Establishes that the morphological assessment echocardiography provides is
      what determines presentation and intervention timing.
- name: Genetic testing
  description: >-
    Chromosomal microarray and exome sequencing are applied to fetuses and infants
    with AVSD detected on echocardiography. AVSD carries one of the higher genetic
    diagnostic yields among congenital heart defects, reflecting its strong
    aneuploidy association.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33142350
    reference_title: Comprehensive evaluation of genetic variants using chromosomal microarray
      analysis and exome sequencing in fetuses with congenital heart defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This was a study of 360 unselected singleton fetuses with CHD detected by echocardiography,
      referred to our department for genetic testing
    explanation: Documents the echocardiography-then-genetic-testing diagnostic pathway for
      congenital heart defects.
treatments:
- name: Surgical Repair of Atrioventricular Septal Defect
  description: >-
    Biventricular surgical repair, by single-patch, modified single-patch or
    double-patch technique, closing the atrial and ventricular components and
    reconstructing the atrioventricular valves. Performed in infancy to pre-empt
    irreversible pulmonary vascular disease. Long-term survival is now
    approximately 88% at 10 years and 80% at 25 years.
  treatment_term:
    preferred_term: atrioventricular septal defect repair
    term:
      id: NCIT:C217463
      label: Atrioventricular Septal Defect Repair
  target_mechanisms:
  - target: Common Atrioventricular Junction
    treatment_effect: BYPASSES
    description: >-
      Patch closure of the atrial and ventricular components and septation of the common
      valve reconstitute separate right and left atrioventricular junctions.
    evidence:
    - reference: PMID:37612667
      reference_title: Long-term results following atrioventricular septal defect repair.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Definitive early repair is favored over prior pulmonary artery banding and
        delayed definitive repair in many centers.
      explanation: Establishes definitive repair as the intervention acting on the anatomic
        lesion.
  - target: Left-to-Right Shunt and Valve Regurgitation
    treatment_effect: BYPASSES
    description: >-
      Eliminating the communications abolishes the shunt and the volume load that drives
      heart failure and pulmonary vascular disease.
    evidence:
    - reference: PMID:40179148
      reference_title: Complete Atrioventricular Septal Defect Repair in Patients With Down
        Syndrome Presenting Beyond Six Months- A Single Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In DS, cAVSD repair is ideally performed before six months of age to prevent
        irreversible pulmonary artery hypertension (PAH).
      explanation: Repair abolishes the shunt specifically to pre-empt the pulmonary vascular
        consequence.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Survival of the entire cohort was 88.3% at 10, 83.8% at 15, and 79.6% at 25
      years.
    explanation: Provides long-term survival after biventricular repair across a 27-year
      single-centre series.
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Definitive early repair is favored over prior pulmonary artery banding and
      delayed definitive repair in many centers.
    explanation: Documents the shift to primary early repair rather than staged palliation.
- name: Left Atrioventricular Valve Repair
  description: >-
    Cleft closure and valvuloplasty of the left atrioventricular valve at the time
    of primary repair, with reoperation for significant residual or recurrent
    regurgitation. Left atrioventricular valve regurgitation is the dominant
    reoperation indication.
  treatment_term:
    preferred_term: heart valve repair
    term:
      id: NCIT:C50818
      label: Heart Valve Repair
  target_mechanisms:
  - target: Left-to-Right Shunt and Valve Regurgitation
    treatment_effect: RESTORES
    description: >-
      Cleft closure and valvuloplasty restore competence of the left atrioventricular valve,
      removing the regurgitant component of the volume load.
    evidence:
    - reference: PMID:35757952
      reference_title: Surgical Outcomes in Children With Partial and Transitional Atrioventricular
        Septal Defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All but eight patients (92.3%) underwent left atrioventricular valve cleft
        closure.
      explanation: Documents cleft closure as the standard manoeuvre restoring valve competence.
  evidence:
  - reference: PMID:35757952
    reference_title: Surgical Outcomes in Children With Partial and Transitional Atrioventricular
      Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All but eight patients (92.3%) underwent left atrioventricular valve cleft
      closure.
    explanation: Documents cleft closure as near-universal practice at primary repair.
progression:
- phase: Infantile presentation and repair
  age_range: First year of life for the complete form
  notes: >-
    The complete form presents in early infancy with congestive heart failure and
    is repaired within the first months of life; partial and transitional forms
    present and are repaired later. Early definitive repair has displaced staged
    pulmonary artery banding in most centres.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median age at repair was 7.1 for cAVSD, 23.7 for pAVSD, and 13 months for
      tAVSD.
    explanation: Documents the age at repair differing by anatomic subtype.
- phase: Long-term follow-up
  notes: >-
    Survival after repair is good and has improved across surgical eras, but left
    atrioventricular valve regurgitation continues to drive reoperation, so
    lifelong cardiology follow-up is required.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall survival or reoperation incidence did not differ significantly between
      AVSD types and improved significantly over surgical eras.
    explanation: Documents improving long-term outcome across eras and the persistence of
      reoperation as an endpoint.
disease_term:
  preferred_term: atrioventricular septal defect
  term:
    id: MONDO:0859565
    label: atrioventricular septal defect
notes: >-
  Relationship to Congenital_Heart_Disease.yaml: AVSD is present there as a
  has_subtypes stub (name, description, subtype_term MONDO:0859565) anchored on
  that entry's endocardial cushion / EndMT pathophysiology arm. This entry is the
  standalone lesion entry, following the pattern already used for Tetralogy of
  Fallot, atrial septal defect, hypoplastic left heart syndrome, double outlet
  right ventricle and persistent truncus arteriosus, each of which coexists with
  the CHD root. The endocardial cushion mechanism is therefore stated in both
  places. A shared kb/modules/ module for atrioventricular septation would be the
  cleaner long-term factoring; none exists today and the CHD root uses no
  conforms_to at all.

  MONDO hierarchy defect: MONDO places the general term used here
  (MONDO:0859565 atrioventricular septal defect) as a child of MONDO:0020290
  familial atrioventricular septal defect, which inverts the expected direction —
  the general concept should not be subsumed by the familial one. The priority
  dashboard targets MONDO:0020290. This entry binds the general term because it
  covers sporadic and trisomy 21-associated AVSD, which the familial term
  excludes. Worth reporting upstream, in the same spirit as issue #7543.

  Mechanism attribution held loosely: the report underpinning this entry
  attributed EndoMT control to TGF-beta, BMP, Notch and Wnt signalling on the
  strength of PMID:29549339. That paper does not establish those roles — it is a
  methodological caution showing that cells scored as endothelial in the standard
  atrioventricular canal explant assay are largely epicardial, which undercuts
  pathway attributions made with that assay. Only the framing statements from it
  are cited here, and the caveat is recorded as PARTIAL evidence on the EndoMT
  node.

  Three phenotypes remain unasserted for want of a citable source, after targeted
  PubMed searches rather than as a standing scoping decision: failure to thrive,
  tachypnoea, and arrhythmia/atrioventricular conduction block. All three are
  recognised features of infantile AVSD; none is stated in any reference cached
  for this entry. Frequency qualifiers are likewise omitted throughout - the
  stratified figures available (congestive heart failure 62% vs 84%, pulmonary
  arterial hypertension 38% vs 16%, Down versus non-Down) could not be traced to a
  quotable cached source, and a frequency band asserted without its own evidence is
  worse than none.

  Known extension points: subtype_term bindings for the complete and partial
  forms (MONDO:0015273 complete atrioventricular canal, MONDO:0015275 partial
  atrioventricular canal) were not added pending the DiseaseOrSubtypeTerm enum
  cache limitation tracked in issue #6989; a datasets section; and clinical_trials.

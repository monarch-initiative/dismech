- name: Ts65Dn modifier crosses
  species: Mouse
  genotype: Ts65Dn with heterozygous Creld1 or Hey2 loss
  background: Mixed C57BL/6 and C3H trisomic background
  publication: PMID:22523272
  description: Newborn histology tests sensitization by trisomy and reduced modifier dosage. The observed lesions were membranous or muscular VSDs and ostium secundum ASDs. These crosses did not reproduce the common-junction human AVSD lesion.
  notes: Ts65Dn duplicates a subset of human chromosome 21 orthologues. Blinded P0 structural scoring measures CHD incidence on this background, not a necessary two-hit rule in every human case. The mechanistic route between gene dosage and a specific septum is unresolved.
  evidence:
  - reference: PMID:22523272
    reference_title: Genetic modifiers predisposing to congenital heart disease in the sensitized Down syndrome population.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Crossing loss-of-function alleles of either Creld1 or Hey2 onto the trisomic background caused a significant increase in the frequency of CHD
    explanation: Mouse modifier experiment; congenital heart defects rather than specific AVSD.
  modeled_mechanisms:
  - target: Deficient Atrioventricular Septation
    relationship: PARTIALLY_RECAPITULATES
    description: The crosses support dosage-sensitive cardiac septation, but the observed lesions are adjacent septal phenotypes rather than exact human AVSD.

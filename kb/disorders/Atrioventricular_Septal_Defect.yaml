    label: atrioventricular septal defect
notes: >-
  Relationship to Congenital_Heart_Disease.yaml: AVSD is present there as a
  has_subtypes stub (name, description, subtype_term MONDO:0859565) anchored on
  that entry's endocardial cushion / EndMT pathophysiology arm. This entry is the
  standalone lesion entry, following the pattern already used for Tetralogy of
  Fallot, atrial septal defect, hypoplastic left heart syndrome, double outlet
  right ventricle and persistent truncus arteriosus, each of which coexists with
  the CHD root. The endocardial cushion mechanism is therefore stated in both
  places. A shared kb/modules/ module for atrioventricular septation would be the
  cleaner long-term factoring; none exists today and the CHD root uses no
  conforms_to at all.

  MONDO hierarchy defect: MONDO places the general term used here
  (MONDO:0859565 atrioventricular septal defect) as a child of MONDO:0020290
  familial atrioventricular septal defect, which inverts the expected direction —
  the general concept should not be subsumed by the familial one. The priority
  dashboard targets MONDO:0020290. This entry binds the general term because it
  covers sporadic and trisomy 21-associated AVSD, which the familial term
  excludes. Worth reporting upstream, in the same spirit as issue #7543.

  Mechanism attribution held loosely: the report underpinning this entry
  attributed EndoMT control to TGF-beta, BMP, Notch and Wnt signalling on the
  strength of PMID:29549339. That paper does not establish those roles — it is a
  methodological caution showing that cells scored as endothelial in the standard
  atrioventricular canal explant assay are largely epicardial, which undercuts
  pathway attributions made with that assay. Only the framing statements from it
  are cited here, and the caveat is recorded as PARTIAL evidence on the EndoMT
  node.

  Failure to thrive is a recognised clinical feature of infantile AVSD but is not
  asserted here: none of the references cached for this entry states it, and the
  entry does not assert phenotypes that its own evidence base does not support.
  Add it once a citable source is available.

  Known extension points: subtype_term bindings for the complete and partial
  forms (MONDO:0015273 complete atrioventricular canal, MONDO:0015275 partial
  atrioventricular canal) were not added pending the DiseaseOrSubtypeTerm enum
  cache limitation tracked in issue #6989; a datasets section; and clinical_trials.

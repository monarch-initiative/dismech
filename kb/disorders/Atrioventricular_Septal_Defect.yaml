- name: Lineage-resolved mouse AVC collagen explant assay
  experimental_model_type: OTHER
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_source: Somite-staged embryonic mouse atrioventricular canal explants, including Tie2-Cre lineage tracing
  publication: PMID:29549339
  description: Lineage tracing and GFP, CD31, alpha-SMA and WT1 markers separate endocardial mesenchymal invasion from epicardial outgrowth in 48-hour collagen cultures. Epicardial contribution increases with somite stage; SD208 reduces TGF-beta signaling and alters mixed outgrowth.
  notes: This is an assay-interpretation study, not proof that every human AVSD has failed EndoMT or a therapeutic rescue. Cobblestone morphology alone cannot identify endothelium, and early staging minimizes rather than universally eliminates epicardial contribution. No causal patient-phenotype link is assigned to the mixed-cell assay.
  evidence:
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal transition in the mouse atrioventricular canal explant assay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: monolayers of cobblestone-shaped cells are predominantly of epicardial rather than endothelial origin.
    explanation: Primary lineage evidence correcting a common interpretation of this assay.

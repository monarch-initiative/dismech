- name: Lifelong congenital cardiology surveillance
  description: Monitor residual shunts, AV valve dysfunction, ventricular function, outflow obstruction and rhythm/conduction disease. Frequency and imaging depend on residual lesions and physiology; transition to adult congenital care is needed. A reassuring early repair does not remove late risks.
  evidence:
  - reference: url:https://www.acc.org/Latest-in-Cardiology/Articles/2025/02/03/12/17/Clinical-Practice-Algorithm-For-the-Follow-Up-of-Repaired-and-Unrepaired-Atrioventricular-Septal-Defects

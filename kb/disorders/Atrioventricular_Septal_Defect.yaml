      canal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Significant associations were observed between non-syndromic CAVC in offspring
      and maternal pregestational diabetes
    explanation: Establishes maternal pregestational diabetes as a risk factor for
      non-syndromic complete AV canal defect.
diagnosis:
- name: Echocardiography
  description: >-
    Echocardiography is the diagnostic modality for AVSD, defining the common
    atrioventricular junction, the atrial and ventricular components of the defect,
    valve morphology and the degree of regurgitation. AVSD is frequently detected
    on fetal echocardiography.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:32965865
    reference_title: Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AVSD encompasses a spectrum of defects, ranging from partial to complete forms.
    explanation: The anatomic spectrum that echocardiographic assessment must distinguish
      to guide management.
treatments:
- name: Surgical Repair of Atrioventricular Septal Defect
  description: >-
    Biventricular surgical repair, by single-patch, modified single-patch or
    double-patch technique, closing the atrial and ventricular components and
    reconstructing the atrioventricular valves. Performed in infancy to pre-empt
    irreversible pulmonary vascular disease. Long-term survival is now
    approximately 88% at 10 years and 80% at 25 years.
  treatment_term:
    preferred_term: atrioventricular septal defect repair
    term:
      id: NCIT:C217463
      label: Atrioventricular Septal Defect Repair
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Survival of the entire cohort was 88.3% at 10, 83.8% at 15, and 79.6% at 25
      years.
    explanation: Provides long-term survival after biventricular repair across a 27-year
      single-centre series.
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Definitive early repair is favored over prior pulmonary artery banding and
      delayed definitive repair in many centers.
    explanation: Documents the shift to primary early repair rather than staged palliation.
- name: Left Atrioventricular Valve Repair
  description: >-
    Cleft closure and valvuloplasty of the left atrioventricular valve at the time
    of primary repair, with reoperation for significant residual or recurrent
    regurgitation. Left atrioventricular valve regurgitation is the dominant
    reoperation indication.
  treatment_term:
    preferred_term: heart valve repair
    term:
      id: NCIT:C50818
      label: Heart Valve Repair
  evidence:
  - reference: PMID:35757952
    reference_title: Surgical Outcomes in Children With Partial and Transitional Atrioventricular
      Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All but eight patients (92.3%) underwent left atrioventricular valve cleft
      closure.
    explanation: Documents cleft closure as near-universal practice at primary repair.
progression:
- phase: Infantile presentation and repair
  age_range: First year of life for the complete form
  notes: >-
    The complete form presents in early infancy with congestive heart failure and
    is repaired within the first months of life; partial and transitional forms
    present and are repaired later. Early definitive repair has displaced staged
    pulmonary artery banding in most centres.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median age at repair was 7.1 for cAVSD, 23.7 for pAVSD, and 13 months for
      tAVSD.
    explanation: Documents the age at repair differing by anatomic subtype.
- phase: Long-term follow-up
  notes: >-
    Survival after repair is good and has improved across surgical eras, but left
    atrioventricular valve regurgitation continues to drive reoperation, so
    lifelong cardiology follow-up is required.
  evidence:
  - reference: PMID:40154545
    reference_title: A 27-Year Experience with Atrioventricular Septal Defect Correction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall survival or reoperation incidence did not differ significantly between
      AVSD types and improved significantly over surgical eras.
    explanation: Documents improving long-term outcome across eras and the persistence of
      reoperation as an endpoint.
disease_term:
  preferred_term: atrioventricular septal defect
  term:

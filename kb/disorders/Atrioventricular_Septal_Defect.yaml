inheritance:
- name: Multifactorial
  description: >-
    Most AVSD is multifactorial rather than Mendelian. Trisomy 21 is the single
    largest contributor, and non-syndromic disease behaves as an oligogenic or
    polygenic threshold trait in which susceptibility alleles such as CRELD1 raise
    risk without being sufficient on their own.
  inheritance_term:
    preferred_term: oligogenic inheritance
    term:
      id: HP:0010983
      label: Oligogenic inheritance
  evidence:
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient
      to cause the defect, indicating that AVSD is multigenic
    explanation: Establishes the multigenic rather than Mendelian inheritance model.
pathophysiology:
- name: Atrioventricular Mesenchymal Complex Failure
  description: >-
    AVSD originates in failed development of the atrioventricular mesenchymal
    complex during cardiac septation. Historically this was attributed solely to
    the endocardial atrioventricular cushions, but animal-model work has since
    shown that failure of other components — notably the dorsal mesenchymal
    protrusion, and probably the mesenchymal cap on the leading edge of the primary
    atrial septum — can produce AVSD in its own right.
  biological_processes:
  - preferred_term: endocardial cushion development
    modifier: ABNORMAL
    term:
      id: GO:0003197
      label: endocardial cushion development
  - preferred_term: cardiac septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:38884733
    reference_title: Molecular Pathways and Animal Models of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While AVSD were historically considered to result from failure of the endocardial
      atrioventricular cushions to properly develop and fuse, more recent studies have
      determined that inhibition of the development of other components of the atrioventricular
      mesenchymal complex can lead to AVSDs as well.
    explanation: Establishes that AVSD pathogenesis extends beyond endocardial cushion
      fusion to the wider atrioventricular mesenchymal complex.
  - reference: PMID:38884733
    reference_title: Molecular Pathways and Animal Models of Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The role of the dorsal mesenchymal protrusion (DMP) in AVSD pathogenesis has
      been well-documented in studies using animal models for AVSDs
    explanation: Identifies the dorsal mesenchymal protrusion as a documented contributor
      to AVSD in animal models.
  downstream:
  - target: Endothelial-to-Mesenchymal Transition Failure
    description: Defective cushion development reflects impaired EndoMT in the atrioventricular
      canal.
    evidence:
    - reference: PMID:29549339
      reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
        transition in the mouse atrioventricular canal explant assay.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Atrioventricular septal defects often result from impaired endocardial cushion
        development.
      explanation: Links impaired endocardial cushion development to AVSD.
  - target: Common Atrioventricular Junction
    description: Failure of the mesenchymal complex leaves a single common atrioventricular
      junction instead of separate mitral and tricuspid orifices.
    evidence:
    - reference: PMID:38884731
      reference_title: Clinical Presentation and Therapy of Atrioventricular Septal Defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Atrioventricular septal defects (AVSDs) consist of a number of cardiac malformations
        that result from abnormal development of the endocardial cushions.
      explanation: Links abnormal endocardial cushion development to the resulting AVSD
        malformations.
- name: Endothelial-to-Mesenchymal Transition Failure
  description: >-
    Endothelial-to-mesenchymal transition (EndoMT) in the atrioventricular canal
    generates the mesenchyme that populates the endocardial cushions. Impaired
    EndoMT is a core cellular lesion in AVSD. Attribution of specific signalling
    pathways to this step should be treated cautiously: the standard explant assay
    used to assign pathway roles has been shown to be confounded by epicardial
    cells misidentified as endothelium.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion
      formation
    modifier: DECREASED
    term:
      id: GO:0003198
      label: epithelial to mesenchymal transition involved in endocardial cushion formation
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
      transition in the mouse atrioventricular canal explant assay.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Endothelial-to-mesenchymal transition (EndoMT) is a critical event in endocardial
      cushion development that initiates in the atrioventricular canal (AVC).
    explanation: Establishes EndoMT in the atrioventricular canal as the critical cellular
      event in cushion development.
  - reference: PMID:29549339
    reference_title: The epicardium obscures interpretations on endothelial-to-mesenchymal
      transition in the mouse atrioventricular canal explant assay.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: monolayers of cobblestone-shaped cells are predominantly of epicardial rather
      than endothelial origin
    explanation: Cautions that pathway roles assigned to EndoMT via the standard explant
      assay are confounded by epicardial contamination, so specific pathway attributions
      are held loosely here.
  downstream:
  - target: Common Atrioventricular Junction
    description: Deficient cushion mesenchyme fails to septate the atrioventricular canal.
    evidence:
    - reference: PMID:38884731
      reference_title: Clinical Presentation and Therapy of Atrioventricular Septal Defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Atrioventricular septal defects (AVSDs) consist of a number of cardiac malformations
        that result from abnormal development of the endocardial cushions.
      explanation: Links abnormal endocardial cushion development to the resulting AVSD
        malformations.
- name: Trisomy 21 Gene Dosage Effect
  description: >-
    Trisomy 21 sensitises the atrioventricular canal to septation failure through
    dosage of chromosome 21 genes. The atrioventricular canal contains a distinct
    myocardial population essential for valvuloseptal development, and HMGN1-driven
    myocardial reprogramming has been implicated in the trisomy 21 phenotype.
    Dosage alone is not deterministic: additional genetic hits are required to
    cross the defect threshold.
  biological_processes:
  - preferred_term: cardiac septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy
      21.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The AVC contains unique myocardial cells that are essential for valvuloseptal
      development; however, the specific combination of dosage-sensitive genes on chromosome
      21 that are responsible for Down syndrome-associated CHDs have remained unknown.
    explanation: Establishes the atrioventricular canal myocardium as the dosage-sensitive
      target in trisomy 21.
  downstream:
  - target: Atrioventricular Mesenchymal Complex Failure
    description: Chromosome 21 dosage sensitises the atrioventricular canal so that septation
      fails.
    evidence:
    - reference: PMID:22523272
      reference_title: Genetic modifiers predisposing to congenital heart disease in the
        sensitized Down syndrome population.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Crossing loss-of-function alleles of either Creld1 or Hey2 onto the trisomic
        background caused a significant increase in the frequency of CHD
      explanation: Additional loss-of-function alleles on a trisomic background raise CHD
        frequency, supporting a dosage-sensitised threshold model.
- name: Multigenic Susceptibility
  description: >-
    Non-syndromic AVSD is genetically heterogeneous and behaves as a multigenic
    threshold trait rather than a monogenic disorder. CRELD1 was the first
    identified susceptibility gene, and rare damaging variants are enriched across
    a broad set of biologically relevant cardiac development genes.
  evidence:
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient
      to cause the defect, indicating that AVSD is multigenic
    explanation: Establishes the multigenic threshold model and CRELD1's role as a
      susceptibility rather than causative allele.
  - reference: PMID:25996639
    reference_title: Exome sequencing identifies rare variants in multiple genes in atrioventricular
      septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A significant enrichment of rare and rare damaging variants was identified
      in the gene set, compared with controls
    explanation: Demonstrates burden of rare damaging variants across many genes rather
      than a single causal locus.
  downstream:
  - target: CRELD1-Calcineurin/NFATc1-VEGF Axis
    description: CRELD1 and NFATC1 susceptibility alleles converge on the calcineurin/NFAT
      axis regulating endocardial proliferation.
    evidence:
    - reference: PMID:24697899
      reference_title: Creld1 function is required for the VEGF-dependent proliferation of
        endocardial cells by promoting the expression of NFATc1 target-genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Creld1 function is required for the VEGF-dependent proliferation of endocardial
        cells by promoting the expression of NFATc1 target-genes
      explanation: Establishes the CRELD1-NFATc1-VEGF dependency in endocardial cells that
        this edge asserts.
  - target: Atrioventricular Mesenchymal Complex Failure
    description: Accumulated variant burden in cardiac developmental genes crosses the
      threshold for septation failure.
    evidence:
    - reference: PMID:15096951
      reference_title: Molecular genetics of atrioventricular septal defects.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient
        to cause the defect, indicating that AVSD is multigenic
      explanation: Supports a threshold model in which combined variant burden, not a single
        allele, produces the septation defect.
- name: CRELD1-Calcineurin/NFATc1-VEGF Axis
  description: >-
    The convergent molecular module linking AVSD susceptibility genes to the
    cellular lesion. CRELD1 regulates calcineurin/NFAT signalling, and Creld1
    function is required for VEGF-dependent proliferation of endocardial cells via
    NFATc1 target genes. Susceptibility alleles in CRELD1 and NFATC1 therefore act
    on the same axis that drives endocardial cell expansion in the cushions.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  locations:
  - preferred_term: atrioventricular canal
    term:
      id: UBERON:0002087
      label: atrioventricular canal
  evidence:
  - reference: PMID:24697899
    reference_title: Creld1 function is required for the VEGF-dependent proliferation of
      endocardial cells by promoting the expression of NFATc1 target-genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Creld1 function is required for the VEGF-dependent proliferation of endocardial
      cells by promoting the expression of NFATc1 target-genes
    explanation: Establishes the mechanistic link from CRELD1 through NFATc1 to
      VEGF-dependent endocardial cell proliferation.
  downstream:
  - target: Endothelial-to-Mesenchymal Transition Failure
    description: Loss of VEGF-dependent endocardial proliferation reduces the cell population
      available to undergo EndoMT and populate the cushions.
    evidence:
    - reference: PMID:24697899
      reference_title: Creld1 function is required for the VEGF-dependent proliferation of
        endocardial cells by promoting the expression of NFATc1 target-genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Creld1 function is required for the VEGF-dependent proliferation of endocardial
        cells by promoting the expression of NFATc1 target-genes
      explanation: Establishes the CRELD1-NFATc1-VEGF dependency in endocardial cells that
        this edge asserts.
- name: Common Atrioventricular Junction
  description: >-
    The defining anatomic lesion: a single common atrioventricular junction with
    deficient atrioventricular septation, producing an ostium primum atrial
    communication and/or inlet ventricular septal defect together with an abnormal
    common or cleft atrioventricular valve.
  locations:
  - preferred_term: cardiac septum
    term:
      id: UBERON:0002099
      label: cardiac septum
  evidence:
  - reference: PMID:32965865
    reference_title: Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Atrioventricular septal defect (AVSD) is a congenital cardiac malformation
      characterized by incomplete atrial and ventricular septa development and abnormalities
      of the atrioventricular valves (AVVs), resulting in a common or partially separate
      atrioventricular (AV) orifice.
    explanation: Defines the anatomic lesion that results from failed septation.
  downstream:
  - target: Left-to-Right Shunt and Valve Regurgitation
    description: The septal deficiency permits shunting and the abnormal valve leaks.
    evidence:
    - reference: PMID:10812553
      reference_title: '[Circulatory failure in children with left-to-right shunt in the framework
        of congenital heart defects: pathophysiology and therapeutic results].'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: With increasing shunt ratio the pulmonary perfusion raised (r = 0.84), but the
        systemic output dropped significantly (r = -0.77)
      explanation: The septal deficiency establishes the shunt whose magnitude drives pulmonary
        overperfusion and falling systemic output.
- name: Left-to-Right Shunt and Valve Regurgitation
  description: >-
    The common junction allows a large left-to-right shunt at atrial and
    ventricular level, compounded by regurgitation through the abnormal
    atrioventricular valve. The resulting volume load drives pulmonary
    overcirculation and infantile congestive heart failure.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:10812553
    reference_title: '[Circulatory failure in children with left-to-right shunt in the framework
      of congenital heart defects: pathophysiology and therapeutic results].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: With increasing shunt ratio the pulmonary perfusion raised (r = 0.84), but the
      systemic output dropped significantly (r = -0.77)
    explanation: >-
      Quantifies the haemodynamic consequence of an increasing left-to-right shunt
      ratio - rising pulmonary perfusion at the cost of systemic output.
  downstream:
  - target: Pulmonary Vascular Obstructive Disease
    description: Sustained pulmonary overcirculation remodels the pulmonary vasculature.
    evidence:
    - reference: PMID:1943197
      reference_title: Preoperative prediction of postoperative pulmonary arteriolar resistance
        after surgical repair of complete atrioventricular canal defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The natural history of patients with complete atrioventricular canal defect
        is one of unrelenting development of pulmonary vascular obstructive disease.
      explanation: States the natural history linking the unrepaired lesion to progressive
        pulmonary vascular obstructive disease.
  - target: Infantile Congestive Heart Failure
    description: Volume overload exceeds the infant myocardium's reserve.
    evidence:
    - reference: PMID:32965865
      reference_title: Atrioventricular Septal Defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The condition is a leading cause of early heart failure in infants.
      explanation: Links the AVSD lesion directly to early infantile heart failure.
- name: Infantile Congestive Heart Failure
  description: >-
    Clinical consequence of the volume load: failure to thrive, tachypnoea and
    feeding difficulty in the first months of life, and the usual trigger for
    surgical referral.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:32965865
    reference_title: Atrioventricular Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The condition is a leading cause of early heart failure in infants.
    explanation: Establishes early infantile heart failure as the dominant clinical
      consequence of the lesion.
- name: Pulmonary Vascular Obstructive Disease
  description: >-
    If the shunt is left uncorrected, pulmonary arteriolar remodelling becomes
    irreversible and shunt reversal (Eisenmenger physiology) supervenes. This is
    the reason repair is undertaken in infancy rather than deferred, and it occurs
    earlier in children with Down syndrome.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: PMID:40179148
    reference_title: Complete Atrioventricular Septal Defect Repair in Patients With Down
      Syndrome Presenting Beyond Six Months- A Single Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In DS, cAVSD repair is ideally performed before six months of age to prevent
      irreversible pulmonary artery hypertension (PAH).
    explanation: Establishes irreversibility of the pulmonary vascular lesion and the
      timing rationale for early repair.

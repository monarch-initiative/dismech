- name: Maternal gestational diabetes
  description: Gestational diabetes was associated with nonsyndromic complete atrioventricular canal in the same Texas subset (adjusted prevalence ratio 1.69, 95% CI 1.03–2.79; 15 exposed cases). The authors note that a diagnosis made after the first trimester may include previously unrecognized pregestational diabetes; the study does not establish that later hyperglycemia caused early abnormal septation.

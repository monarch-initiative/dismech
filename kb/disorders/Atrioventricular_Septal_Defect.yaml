- name: Individualized repair or palliation for unbalanced AVSD
  description: Assess ventricular and valve adequacy in a congenital surgical team. Some lesions permit biventricular repair, whereas severe imbalance requires single-ventricle palliation; the isolated-balanced pediatric algorithm does not decide this boundary.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557511/
    reference_title: Atrioventricular Septal Defects - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The degree of AV valve commitment is the primary determinant of candidacy for full biventricular surgical repair versus single ventricle palliation.
    explanation: Assess ventricular and valve adequacy in a congenital surgical team. Some lesions permit biventricular repair, whereas severe imbalance requires single-ventricle palliation; the isolated-balanced pediatric algorithm does not decide this boundary.
- name: Adult unrepaired or residual-shunt assessment for closure
  description: In adults with Qp:Qs ≥1.5 and/or significant or progressive chamber dilation, closure is recommended when PVR ≤2 Wood units (Class I, C-LD), and reasonable with PVR >2 to <5 (Class IIa, C-EO). Advanced pulmonary vascular disease requires expert assessment; these recommendations do not supply a blanket closure indication at intermediate higher PVR.
  evidence:
  - reference: url:https://www.guidelinecentral.com/guideline/6958/
    reference_title: ACC/AHA Management of Adults With Congenital Heart Disease Guideline Summary - Guideline Central
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: ≥1.5), and/or significant or progressive atrial/ ventricular dilatation with no ... ≤2 Wood units), closure of the ... or residual shunt is recommended to improve functional class and clinical outcomes.
    explanation: In adults with Qp:Qs ≥1.5 and/or significant or progressive chamber dilation, closure is recommended when PVR ≤2 Wood units (Class I, C-LD), and reasonable with PVR >2 to <5 (Class IIa, C-EO). Advanced pulmonary vascular disease requires expert assessment; these recommendations do not supply a blanket closure indication at intermediate higher PVR.
- name: Avoid closure with Eisenmenger physiology or very high PVR
  description: Shunt closure should not be performed in adults with Eisenmenger physiology or PVR >10 Wood units (Class III harm, C-LD). Referral for specialist congenital and pulmonary-hypertension care is required; late presentation alone is not a substitute for hemodynamic assessment.
  evidence:
  - reference: url:https://www.guidelinecentral.com/guideline/6958/

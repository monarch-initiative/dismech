  description: Prepregnancy BMI of at least 30 was associated with nonsyndromic complete atrioventricular canal in the Texas 2005–2008 subset (adjusted prevalence ratio 1.69, 95% CI 1.24–2.30; 75 exposed cases). After exclusion of heterotaxy, the estimate was 1.5 with a 95% CI of 0.9–2.4. Definitions, residual confounding and subgroup imprecision constrain generalization; no specific mesenchymal mechanism was measured.

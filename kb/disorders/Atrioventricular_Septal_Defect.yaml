epidemiology:
- name: Proportion of congenital cardiac malformations
  description: Published clinical reviews cite AVSD as several percent of congenital cardiac malformations; the 4–7% figure in this source is background synthesis, not the proportion measured by its surgical cohort.
  evidence:
  - reference: PMID:37612667
    reference_title: Long-term results following atrioventricular septal defect repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Atrioventricular septal defects (AVSD) represent 4-7% of congenital cardiac malformations.
    explanation: Gives the proportion of congenital cardiac malformations represented by AVSD.
    quote_role: BACKGROUND
- name: Association with Down syndrome
  description: AVSD is strongly associated with trisomy 21. Estimates of any congenital heart defect and relative AVSD enrichment describe different denominators; the approximately 1000-fold figure is prior human epidemiology summarized in the 2025 mechanistic paper, not a result measured in its cell or mouse experiments.
  evidence:
  - reference: PMID:29054759
    reference_title: CRELD1 gene variants and atrioventricular septal defects in Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Congenital heart defects (CHD) are seen in around 40% of the Down syndrome patients. Atrioventricular Septal Defect (AVSD) or endocardial cushion defect is commonest form of CHD in these children.
    explanation: Establishes the frequency of CHD in Down syndrome and AVSD as the predominant lesion.
    quote_role: BACKGROUND
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy 21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CHDs occur in around 50% of cases of Down syndrome, with an approximately 1,000-fold enrichment of atrioventricular canal (AVC) defects that disrupt the junction between the atria and ventricles
    explanation: Quantifies the magnitude of AVC-defect enrichment attributable to trisomy 21.
    quote_role: BACKGROUND
- name: Scope of the Texas complete-canal maternal-risk cohort
  description: The 1999–2008 Texas registry analysis included 563 complete atrioventricular canal cases classified as nonsyndromic, among 1,335 total complete-canal cases. Heterotaxy was included in the nonsyndromic group; only 47 cases were isolated. Diabetes subtype and prepregnancy BMI analyses cover 2005–2008 only. Cases included fetal deaths and terminations while prevalence denominators used live births. These definitions do not represent every partial or complete AVSD population.
  evidence:
  - reference: PMID:23061687
    reference_title: Descriptive epidemiology of non-syndromic complete atrioventricular canal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Patients with visceral heterotaxy were included in the nonsyndromic group.
    explanation: Defines an important inclusion within the source-specific nonsyndromic label.
  - reference: PMID:23061687
    reference_title: Descriptive epidemiology of non-syndromic complete atrioventricular canal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Specific information on maternal pregestational diabetes, gestational diabetes, and prepregnancy body mass index (BMI) was only available for deliveries in 2005–2008.
    explanation: Restricts the exposure-specific estimates to the relevant years.
environmental:
- name: Maternal pregestational diabetes
  description: Maternal pregestational diabetes was associated with nonsyndromic complete atrioventricular canal in the Texas 2005–2008 subset (adjusted prevalence ratio 6.74, 95% CI 3.67–12.37). The table includes 12 exposed cases. Diabetes type, severity and glycemic control were unavailable; this is an adjusted observational association, not a ranking against all modifiable risk factors or a measured embryonic mediator.
  evidence:
  - reference: PMID:23061687
    reference_title: Descriptive epidemiology of non-syndromic complete atrioventricular canal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Significant associations were observed between non-syndromic CAVC in offspring and maternal pregestational diabetes (adjusted prevalence ratio (aPR) 6.74; 95% confidence interval (CI) 3.67, 12.37), gestational diabetes (aPR 1.69; 95% CI 1.03, 2.79) and obesity (aPR 1.69; 95% CI 1.24, 2.30).
    explanation: Reports the exposure associations in the source-defined nonsyndromic complete-canal cohort; not a causal mediator experiment.

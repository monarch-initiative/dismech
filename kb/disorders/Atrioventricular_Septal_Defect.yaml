- name: Rare-variant candidate enrichment
  association: Rare Variant Enrichment
  notes: A 112-candidate-gene study included 81 discovery and 81 replication nonsyndromic, non-trisomy-21, non-heterotaxy AVSD probands of European ancestry. Public exome controls and limited segregation constrain inference. Several nominally enriched genes were nominated, but only MDM4 survived correction across all tested genes. This is not a validated diagnostic panel, proof of multiple hits in every patient or functional validation of each variant.
  evidence:
  - reference: PMID:25996639
    reference_title: Exome sequencing identifies rare variants in multiple genes in atrioventricular septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Whole-exome sequencing was performed in 81 unrelated probands with AVSD to identify potentially causal variants in a comprehensive set of 112 genes with strong biological relevance to AVSD.
    explanation: Discovery design, not a count of causal genes.
- name: NR2F2
  gene_term:
    preferred_term: NR2F2
    term:
      id: hgnc:7976
      label: NR2F2
  association: Rare variant association with functional evidence
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: The 2014 study identified five rare missense variants in 125 discovery AVSD cases, including 13 trio probands; two were de novo and two were inherited from apparently unaffected parents. An additional 245-case screen did not identify further rare functional variants. Additional splice, translocation and duplication families had varied CHD phenotypes. Evidence differs by allele; not every variant is equivalently pathogenic or fully penetrant. Reporter effects depend on promoter and cell context, rather than universal loss of function. The source contains inconsistent HGVS/protein nomenclature, so detailed allele coordinates are not reproduced. The author-hosted full PDF is PMID:24702954; the 2016 correction concerns an author surname.

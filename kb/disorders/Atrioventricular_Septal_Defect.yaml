genetic:
- name: CRELD1
  association: Susceptibility Variant
  notes: >-
    The first identified non-syndromic AVSD susceptibility gene. CRELD1 regulates
    calcineurin/NFAT signalling. Variants raise risk without being sufficient to
    cause the defect, which is the basis of the multigenic threshold model.
  evidence:
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient
      to cause the defect, indicating that AVSD is multigenic
    explanation: Establishes CRELD1 as a susceptibility allele within a multigenic model.
- name: NFATC1
  association: Missense Variant
  notes: >-
    Calcineurin/NFAT signalling is implicated in AVSD, and CRELD1 acts as a
    regulator of that pathway. Heterozygous NFATC1 missense variants have been
    identified in isolated AVSD and in AVSD with heterotaxy, placing the pathway
    itself rather than any single gene at the centre of susceptibility.
  evidence:
  - reference: PMID:30007050
    reference_title: Heterozygous missense mutations in NFATC1 are associated with atrioventricular
      septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Multiple lines of evidence support a role of calcineurin/NFAT signaling in
      AVSD, and mutations in CRELD1, a protein functioning as a regulator of calcineurin/NFAT
      signaling have been reported in a small fraction of affected subjects.
    explanation: Links NFATC1 and CRELD1 through the shared calcineurin/NFAT axis.
- name: HMGN1
  association: Chromosome 21 Dosage
  notes: >-
    Chromosome 21 gene whose overexpression drives myocardial reprogramming
    implicated in trisomy 21-associated heart defects, offering a mechanism for the
    approximately 1000-fold enrichment of atrioventricular canal defects in Down
    syndrome.
  evidence:
  - reference: PMID:41125893
    reference_title: Myocardial reprogramming by HMGN1 underlies heart defects in trisomy
      21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CHDs occur in around 50% of cases of Down syndrome, with an approximately
      1,000-fold enrichment of atrioventricular canal (AVC) defects that disrupt the
      junction between the atria and ventricles
    explanation: Frames the trisomy 21 dosage problem that HMGN1 reprogramming addresses.
- name: Multigene Burden
  association: Rare Variant Enrichment
  notes: >-
    Whole-exome sequencing of non-syndromic AVSD probands shows enrichment of rare
    damaging variants across a set of 112 genes with strong biological relevance to
    AVSD, with the enrichment specific to AVSD rather than to congenital heart
    disease generally.
  evidence:
  - reference: PMID:25996639
    reference_title: Exome sequencing identifies rare variants in multiple genes in atrioventricular
      septal defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing was performed in 81 unrelated probands with AVSD to
      identify potentially causal variants in a comprehensive set of 112 genes with strong
      biological relevance to AVSD.
    explanation: Documents the multigene burden architecture of non-syndromic AVSD.
environmental:
- name: Maternal pregestational diabetes
  description: >-
    Maternal pregestational diabetes is the strongest established modifiable risk
    factor for non-syndromic complete atrioventricular canal defect, identified in
    a large population-based birth defects registry analysis.
  presence: PRESENT
  evidence:
  - reference: PMID:23061687

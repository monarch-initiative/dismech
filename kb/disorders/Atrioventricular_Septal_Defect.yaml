  description: Ciliary motility disruption can produce laterality abnormalities associated with AVSD. In Dnah11avc4 mice, AVSD occurred only with heterotaxy while second-heart-field Hedgehog signaling was preserved. This is not a claim that all AVSD or all heterotaxy has one ciliary cause.
  evidence: &id001
  - reference: PMID:27340223
    reference_title: Cilia gene mutations cause atrioventricular septal defects by multiple mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Dnah11avc4 did not disrupt SHF Hh signaling and caused AVSDs only concurrently with heterotaxy, a left/right axis abnormality.
    explanation: Recessive mouse Dnah11 mutation with laterality-associated AVSD; SHF Hedgehog was preserved.
  downstream:
  - target: Deficient Atrioventricular Septation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The mouse association supports a developmental laterality route; the intervening cardiac morphogenetic steps are unresolved.
    evidence:
    - reference: PMID:27340223
      reference_title: Cilia gene mutations cause atrioventricular septal defects by multiple mechanisms.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Dnah11avc4 did not disrupt SHF Hh signaling and caused AVSDs only concurrently with heterotaxy, a left/right axis abnormality.
      explanation: Recessive mouse Dnah11 mutation with laterality-associated AVSD; SHF Hedgehog was preserved.
      directness: INDIRECT
- name: Reduced Second Heart Field Hedgehog Signaling
  biological_scale: CELLULAR
  description: A separate structural/signaling cilia mutation, Mks1avc6, impaired second-heart-field Hedgehog signaling and produced AVSD without heterotaxy. This experimentally separates a signaling route from motility-dependent laterality.
  evidence: &id002
  - reference: PMID:27340223
    reference_title: Cilia gene mutations cause atrioventricular septal defects by multiple mechanisms.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: In contrast, Mks1avc6 disrupted SHF Hh signaling and caused AVSDs without heterotaxy.
    explanation: A distinct recessive mouse route through second-heart-field signaling, without heterotaxy.
  downstream:
  - target: Deficient Atrioventricular Septation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The Mks1 mouse results support involvement of this signaling compartment in AV septation, without proving an equivalent mechanism for every human MKS1 variant.

genetic:
- name: CRELD1
  association: Susceptibility Variant
  gene_term:
    preferred_term: CRELD1
    term:
      id: hgnc:14630
      label: CRELD1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: CRELD1 is a susceptibility gene in some isolated or syndromic AVSD. Unaffected-parent transmission and mouse-background dependence argue against treating every heterozygous variant as fully penetrant. The E325K calcium-binding effect in PMID:29054759 is a bioinformatic prediction, not a measured patient-protein assay.
  evidence:
  - reference: PMID:22523272
    reference_title: Genetic modifiers predisposing to congenital heart disease in the sensitized Down syndrome population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In each case the p.R329C mutation was inherited from an unaffected parent.
    explanation: Incomplete penetrance or susceptibility context.
  - reference: PMID:15096951
    reference_title: Molecular genetics of atrioventricular septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Mutation of CRELD1 increases susceptibility to AVSD but is not alone sufficient to cause the defect
    explanation: Historical susceptibility interpretation, not a universal inheritance law.
- name: NFATC1
  association: Missense Variant
  gene_term:
    preferred_term: NFATC1
    term:
      id: hgnc:7775
      label: NFATC1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: Three rare heterozygous missense variants were reported among 60 screened AVSD patients (22 isolated and 38 with heterotaxy), with no parental specimens for segregation. COS-7 and zebrafish experiments support functional effects of differing severity; one patient also carried TBX1 Pro86Leu. The study does not establish that all three variants independently explain every cardiac and extracardiac feature, or that all rare NFATC1 variants are pathogenic.

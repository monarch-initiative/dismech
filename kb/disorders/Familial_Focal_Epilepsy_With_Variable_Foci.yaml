  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat EEG as appropriate when seizure frequency increases or when seizures
      of new symptomatology occur.
    explanation: GeneReviews guidance on EEG evaluation and follow-up in DEPDC5-related focal epilepsy.
- name: Brain Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Structural brain MRI is normal in most nonlesional FFEVF families but
    identifies focal cortical dysplasia or hemimegalencephaly in lesion-associated
    DEPDC5/GATOR1 disease; higher-resolution repeat MRI is recommended in
    treatment-resistant patients whose initial scan was unremarkable.
  results: Normal brain MRI in most individuals, or focal cortical dysplasia / hemimegalencephaly in lesional cases.
  evidence:
  - reference: DOI:10.1002/ana.24368
    reference_title: "Familial focal epilepsy with focal cortical dysplasia due to <scp><i>DEPDC</i></scp><i>5</i> mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electroclinical phenotypes were compatible with FCD II, although magnetic
      resonance imaging (MRI) was typical in only 4 cases.
    explanation: MRI may be typical in some but not all DEPDC5-associated FCD cases.
  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat brain MRI with a higher-resolution technique in individuals with
      treatment-resistant seizures whose first brain MRI was normal to rule out
      subtle cortical dysplasia.
    explanation: GeneReviews recommendation for high-resolution brain MRI to detect subtle cortical dysplasia in refractory cases.
treatments:
- name: Antiseizure Medication Therapy
  description: >-
    Management begins with standard antiseizure medications (ASMs) used for
    focal epilepsy. Response is variable — some individuals respond well to
    first-line ASMs while others (particularly lesion-associated DEPDC5/GATOR1
    cases) are pharmacoresistant — and no single specific ASM has been shown to
    be superior.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The response to anti-seizure medication (ASM) is variable. While some
      individuals respond well to first-line ASMs, others are more refractory to
      treatment. There is currently no evidence that seizures respond better to
      one specific ASM.
    explanation: GeneReviews management summary documenting variable ASM responsiveness and absence of superiority of any single specific ASM in DEPDC5-related epilepsy.
  - reference: PMID:38888005
    reference_title: "Efficacy and safety of add-on antiseizure medications for focal epilepsy: A network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All approved ASMs were effective as add-on treatment for focal epilepsy.
    explanation: This focal epilepsy meta-analysis supports antiseizure medication therapy for focal-onset seizures, including FFEVF by disease class.
  - reference: DOI:10.1371/journal.pone.0284924
    reference_title: The clinical features of familial focal epilepsy with variable foci and NPRL3 gene variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      different therapeutic effects (refractory epilepsy/almost seizure free)
    explanation: This FFEVF family study shows variable medication-era outcomes rather than a specific drug recommendation.

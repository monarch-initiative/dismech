  description: >-
    Familial focal epilepsy with variable foci is inherited in an autosomal
    dominant pattern, but penetrance is incomplete and expressivity varies
    across relatives.
  evidence:
  - reference: PMID:23542697
    reference_title: Mutations in DEPDC5 cause familial focal epilepsy with variable foci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant familial focal epilepsy with variable foci (FFEVF) is
      notable because family members have seizures originating from different
      cortical regions.
    explanation: The DEPDC5 discovery paper describes the autosomal dominant familial syndrome and its variable cortical foci.
  - reference: DOI:10.1046/j.1528-1157.2003.62302.x
    reference_title: "Familial partial epilepsy with variable foci in a Dutch family: clinical characteristics and confirmation of linkage to chromosome 22q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical characteristics and results of EEG, computed tomography (CT), and
      magnetic resonance imaging (MRI) were evaluated in a family with autosomal
      dominantly inherited partial epilepsy with apparent incomplete penetrance.
    explanation: The Dutch family study explicitly supports autosomal dominant inheritance with incomplete penetrance.
  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If one parent of the proband has a DEPDC5 pathogenic variant, the risk to
      the sibs of inheriting the pathogenic variant is 50%.
    explanation: GeneReviews confirms autosomal dominant inheritance with 50% sibling transmission risk from a heterozygous parent.
has_subtypes:
- name: FFEVF1
  display_name: "FFEVF1 (DEPDC5)"
  description: >-
    FFEVF caused by heterozygous loss-of-function variants in DEPDC5, the
    largest GATOR1 subunit. This is the form in which the variable-foci family
    phenotype was first resolved to a gene, and the one in which focal cortical
    dysplasia and epilepsy surgery are best documented.
  subtype_term:
    preferred_term: epilepsy, familial focal, with variable foci 1
    term:
      id: MONDO:0024556
      label: epilepsy, familial focal, with variable foci 1
  genes:
  - preferred_term: DEPDC5
    term:
      id: hgnc:18423
      label: DEPDC5
  evidence:
  - reference: PMID:23542697
    reference_title: Mutations in DEPDC5 cause familial focal epilepsy with variable foci.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing, we detected DEPDC5 mutations in two affected
      families. We subsequently identified mutations in five of six additional
      published large families with FFEVF.
    explanation: >-
      DEPDC5 variants in eight families with the variable-foci phenotype define
      the DEPDC5 form of the syndrome.
- name: FFEVF2
  display_name: "FFEVF2 (NPRL2)"
  description: >-
    FFEVF caused by heterozygous loss-of-function variants in NPRL2, a second
    GATOR1 subunit. It shares the GATOR1/mTORC1 mechanism node with FFEVF1 and
    FFEVF3; the entry does not split that node by gene.
  subtype_term:
    preferred_term: epilepsy, familial focal, with variable foci 2
    term:
      id: MONDO:0014924
      label: epilepsy, familial focal, with variable foci 2
  genes:
  - preferred_term: NPRL2
    term:
      id: hgnc:24969
      label: NPRL2
  evidence:
  - reference: DOI:10.1038/s10038-021-00969-z
    reference_title: "A splicing variation in NPRL2 causing familial focal epilepsy with variable foci: additional cases and literature review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a variant, 339+2T>C, inNPRL2identified by trio
      whole-exome sequencing (WES) in a family.
    explanation: >-
      A family with the FFEVF phenotype carrying an NPRL2 splice variant
      exemplifies the NPRL2 form.
- name: FFEVF3
  display_name: "FFEVF3 (NPRL3)"
  description: >-
    FFEVF caused by heterozygous loss-of-function variants in NPRL3, the third
    GATOR1 subunit. Published families show the same wide onset range, variable
    foci and frequently normal MRI as the other GATOR1 forms.
  subtype_term:
    preferred_term: epilepsy, familial focal, with variable foci 3
    term:
      id: MONDO:0014925
      label: epilepsy, familial focal, with variable foci 3
  genes:
  - preferred_term: NPRL3

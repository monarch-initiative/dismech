    explanation: Systematic review evidence supports epilepsy surgery benefit in DEPDC5-variant patients with pharmacoresistant epilepsy.
  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In individuals with hemimegalencephaly or focal cortical dysplasia and
      refractory epilepsy, resective epilepsy surgery should be explored early in
      the disease course.
    explanation: GeneReviews recommends early evaluation for resective epilepsy surgery in refractory malformation-associated DEPDC5 epilepsy.
- name: Genetic Counseling
  description: >-
    Autosomal dominant recurrence-risk counseling (50% transmission risk from a
    heterozygous parent, with incomplete penetrance and variable cortical seizure
    foci among carriers) and targeted cascade molecular testing of at-risk
    relatives.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27683934
    reference_title: "DEPDC5-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If one parent of the proband has a DEPDC5 pathogenic variant, the risk to
      the sibs of inheriting the pathogenic variant is 50%.
    explanation: GeneReviews genetic counseling guidance establishing 50% autosomal dominant transmission risk for siblings.
notes: >-
  GeneReviews DEPDC5-Related Epilepsy (PMID:27683934) covers the predominant
  DEPDC5/GATOR1 spectrum of familial focal epilepsy with variable foci, noting
  routine clinical surveillance for changes in seizure semiology, developmental
  progress, and predictive factors for sudden unexpected death in epilepsy
  (SUDEP) at each visit; no separate NPRL2- or NPRL3-specific GeneReviews
  chapters exist. The separate GeneReviews chapter on SCN3A-Related
  Neurodevelopmental Disorder covers the severe de novo SCN3A developmental and
  epileptic encephalopathy / polymicrogyria spectrum rather than the milder
  cryptogenic pediatric focal epilepsy series on which OMIM and MONDO base
  FFEVF4.

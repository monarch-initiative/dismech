- name: Nav1.3 Ramp and Persistent Sodium Current Gain
  description: >-
    Epilepsy-associated SCN3A missense variants alter Nav1.3 gating. Their
    individual defects differ, but every variant tested increases current
    activated by slow depolarizing ramps, and K354Q also increases persistent
    current, lowers current threshold and drives spontaneous firing in
    hippocampal neurons. This is the proposed mechanism for the SCN3A-defined
    FFEVF4 form; it acts on neuronal excitability directly rather than through
    GATOR1/mTORC1.

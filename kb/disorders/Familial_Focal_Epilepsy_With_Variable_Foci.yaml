      explanation: This family study supports variable motor seizure semiology as part of the FFEVF phenotype.
  - target: EEG Abnormality
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered cortical network excitability
    - interictal epileptiform discharge
    description: The same focal network hyperexcitability can be detected as focal epileptiform EEG abnormalities.
    evidence:
    - reference: DOI:10.1046/j.1528-1157.2003.62302.x
      reference_title: "Familial partial epilepsy with variable foci in a Dutch family: clinical characteristics and confirmation of linkage to chromosome 22q."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most interictal EEGs showed no abnormalities, but some showed frontal,
        central, and/or temporal spikes and spike-wave complexes.
      explanation: This supports focal epileptiform EEG abnormalities in a subset of affected relatives.
  - target: Nocturnal Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical network hyperexcitability from GATOR1/mTORC1 dysregulation frequently manifests with sleep-related nocturnal seizures.
    evidence:
    - reference: ORPHA:98820
      reference_title: "Familial focal epilepsy with variable foci"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "HP:0031951 | Nocturnal seizures | Frequent (79-30%)"
      explanation: Orphanet HPO annotation documenting nocturnal seizures as a frequent manifestation of GATOR1-related FFEVF.
    - reference: ORPHA:98820
      reference_title: "Familial focal epilepsy with variable foci"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Many patients have an aura and show automatisms during diurnal seizures whereas others have nocturnal seizures."
      explanation: Orphanet clinical description noting nocturnal focal seizures within the FFEVF seizure spectrum.
  - target: Infantile Spasms
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Early-life mTORC1 hyperactivation in DEPDC5/GATOR1 disease occasionally presents with infantile spasms.
    evidence:
    - reference: PMID:27683934
      reference_title: "DEPDC5-Related Epilepsy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seizure syndromes include familial focal epilepsy with variable foci
        (FFEVF), autosomal dominant sleep-related hypermotor epilepsy (ADSHE),
        familial mesial temporal lobe epilepsies (FMTLE), autosomal dominant
        epilepsy with auditory features (ADEAF), infantile spasms, and severe
        developmental encephalopathy.
      explanation: GeneReviews includes infantile spasms within the DEPDC5-related GATOR1 epilepsy spectrum.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Disrupted GATOR1/mTORC1 signaling is associated with impaired cognitive neurodevelopment in a minority of affected individuals.
    evidence:
    - reference: PMID:27683934
      reference_title: "DEPDC5-Related Epilepsy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although psychomotor development is usually normal, developmental delays,

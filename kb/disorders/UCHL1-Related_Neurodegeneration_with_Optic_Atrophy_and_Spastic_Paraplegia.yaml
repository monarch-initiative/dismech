- name: Cerebellar Degeneration
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >
    Degeneration of the cerebellar cortex and its output pathways produces progressive
    cerebellar ataxia and nystagmus. Purkinje cells, which carry the sole output of the
    cerebellar cortex and are exceptionally dependent on proteostasis across a very large
    dendritic and axonal compartment, are the presumed principal target, by analogy with
    the conserved cerebellar-degeneration module; UCHL1-specific histopathological
    confirmation in humans is not available (see `discussions`).

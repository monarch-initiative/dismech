  downstream:
  - target: Retinal Ganglion Cell and Optic Nerve Degeneration
    description: >
      Retinal ganglion cell axons are among the longest, thinnest and most
      transport-dependent CNS projections and degenerate first in this disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cerebellar Degeneration
    description: >
      Cerebellar neurons and their projections degenerate, producing the cerebellar
      syndrome. The intermediate steps between impaired proteostasis and Purkinje-cell
      loss are not established in UCHL1 disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Dorsal Column and Sensory Axon Degeneration
    description: >
      Ascending dorsal-column sensory axons and peripheral sensory axons undergo
      length-dependent dying-back degeneration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Corticospinal Tract Degeneration
    description: >
      The long descending corticospinal motor axons degenerate distally, producing
      upper motor neuron dysfunction.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES


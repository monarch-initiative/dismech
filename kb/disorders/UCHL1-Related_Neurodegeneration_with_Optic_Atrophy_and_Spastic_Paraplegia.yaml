- name: UCHL1 p.Glu7Ala
  description: >
    The index homozygous missense allele (consanguineous family). Glu7 lies within the
    ubiquitin-binding region; the substitution reduces ubiquitin affinity at least
    sevenfold, near-completely abolishes hydrolase activity, and is predicted to obstruct
    correct positioning of the substrate for tunnelling beneath the cross-over loop
    spanning the catalytic cleft, giving a >100-fold loss of catalytic efficiency.
  gene:
    preferred_term: UCHL1

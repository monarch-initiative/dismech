- name: Cardiac Surveillance and Management
  description: >
    Given the report of hypertrophic cardiomyopathy causing sudden cardiac death in both
    affected siblings of one family, cardiac follow-up and treatment are recommended in
    UCHL1-related neurodegeneration.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT

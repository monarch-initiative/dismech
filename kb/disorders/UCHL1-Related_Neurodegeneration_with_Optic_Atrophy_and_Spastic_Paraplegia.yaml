classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  mechanistic_category:
  - classification_value: proteotoxic disease

mechanistic_hypotheses:
- hypothesis_group_id: uchl1_activity_window
  hypothesis_label: >
    Neurodegeneration results from departure from an optimal window of UCH-L1 activity in
    either direction, not simply from reduced hydrolase activity
  status: EMERGING
  description: >
    The p.Glu7Ala, p.Ala216Asp, splice-site and in-frame-deletion alleles all reduce
    UCH-L1 function, which supports a straightforward loss-of-function model. The
    p.Arg178Gln allele, however, has roughly four-fold increased hydrolytic activity in
    vitro, and later biophysical work confirmed a genuine kcat gain with a more reactive
    catalytic cysteine. Two non-exclusive reconciliations are on the table: (i) that the
    unifying lesion is reduced steady-state UCH-L1 protein rather than specific activity,
    consistent with the roughly four-fold lower total UCHL1 measured in patient
    fibroblasts; and (ii) that both hypoactive and hyperactive enzyme perturb ubiquitin
    homeostasis, implying an optimal activity window. The original authors additionally
    propose that the increased activity of p.Arg178Gln may be protective for cognition,
    which is remarkably preserved in those patients. A third, independent line of evidence
    pushes in the same direction: a catalytically dead UCHL1 C90A knock-in mouse does NOT
    reproduce the sensory/motor deficits, gracile-tract degeneration or premature death of
    UCHL1-deficient mice, implying that loss of hydrolase activity alone is not sufficient
    for the neurodegenerative phenotype and that non-hydrolase UCH-L1 functions (ubiquitin
    stabilisation, ubiquitin ligation, cytoskeletal interaction) matter. Which model is
    correct is unresolved.
  evidence:
  - reference: PMID:28007905
    reference_title: Novel UCHL1 mutations reveal new insights into ubiquitin processing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified missense variants reveal surprisingly different functional "
    explanation: >
      States directly that the two disease alleles in one patient have opposite functional
      consequences — the observation the hypothesis is built on.
  - reference: PMID:28007905
    reference_title: Novel UCHL1 mutations reveal new insights into ubiquitin processing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "activity of the Arg178Gln variant offers a protective effect on cognitive "
    explanation: The authors' own proposed reconciliation — increased activity as cognitively protective.
  - reference: PMID:38185323
    reference_title: Altered Protein Dynamics and a More Reactive Catalytic Cysteine in a Neurodegeneration-associated UCHL1 Mutant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed higher catalytic activity than "
    explanation: Independently confirms and structurally explains the gain of catalytic activity in the p.Arg178Gln disease allele.
  - reference: PMID:33159930
    reference_title: Abolishing UCHL1's hydrolase activity exacerbates TBI-induced axonal injury and neuronal death in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The C90A mouse did not develop the sensory and motor deficits, degeneration of the "
    explanation: >
      A catalytically dead knock-in mouse does not phenocopy UCHL1 deficiency, arguing
      that loss of hydrolase activity per se is not the whole mechanism — direct support
      for the view that the disease is not simply "less catalysis". Model-organism
      evidence.
  - reference: PMID:33159930
    reference_title: Abolishing UCHL1's hydrolase activity exacerbates TBI-induced axonal injury and neuronal death in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "that the hydrolase activity of UCHL1 does not "
    explanation: >
      The authors' explicit conclusion that hydrolase activity does not account for the
      progressive neurodegeneration seen in mice lacking full-length UCHL1.

discussions:
- discussion_id: uchl1_human_neuropathology_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dying-Back Axonal Degeneration
  - pathophysiology#Cerebellar Degeneration
  prompt: >
    Does the dying-back axonal degeneration with terminal spheroid formation documented in
    the Uchl1-mutant gad mouse actually describe the neuropathology of human biallelic
    UCHL1 disease, and are Purkinje cells the principal cerebellar target in patients?
  rationale: >
    The cellular mechanism curated here — dying-back axonopathy, terminal spheroids,
    retrograde ubiquitin-positive deposits, monoubiquitin depletion — rests almost entirely
    on the gad mouse. No human post-mortem neuropathological series of biallelic UCHL1
    disease is available, and the very small number of reported families means the
    cellular lesion in patients is inferred rather than observed. The cerebellar node is
    additionally inferred from the conserved Purkinje-degeneration module rather than from
    UCHL1-specific human tissue. The mismatch matters because it is the mechanistic link
    from a proteostasis defect to selective long-tract vulnerability, and because mouse
    Uchl1 loss is partly compensated by Uch-L3, a redundancy whose human equivalence is
    unknown.
  proposed_experiments:
  - experiment_id: exp_uchl1_human_neuropathology
    name: Human neuropathological characterisation of biallelic UCHL1 disease
    description: >
      Post-mortem examination of optic nerve, cerebellum, dorsal columns and corticospinal
      tracts in biallelic UCHL1 patients, assessing axonal spheroids, ubiquitin-conjugate
      accumulation, free-monoubiquitin levels and Purkinje-cell counts against
      age-matched controls.
  - experiment_id: exp_uchl1_ipsc_neurons
    name: Patient iPSC-derived neuron modelling
    description: >
      Generate iPSC-derived retinal ganglion cells, cortical projection neurons and
      cerebellar neurons from patients carrying each allele class (p.Glu7Ala hypoactive,
      p.Arg178Gln hyperactive, null), and measure free-ubiquitin pool, ubiquitin-conjugate
      accumulation, axonal transport and distal-axon integrity to test the
      activity-window hypothesis in human cells.
  evidence:
  - reference: PMID:10471497
    reference_title: Intragenic deletion in the gene encoding ubiquitin carboxy-terminal hydrolase in gad mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the mutant is characterized by 'dying-back' type axonal "
    explanation: The mouse-only cellular pathology that is the basis of the open translational question.
  - reference: PMID:11555633
    reference_title: Loss of Uch-L1 and Uch-L3 leads to neurodegeneration, posterior paralysis and dysphagia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To assess whether the two hydrolases have redundant function, we generated mice "
    explanation: >
      The Uch-L1/Uch-L3 double-mutant experiment probes functional redundancy among UCH
      isozymes in mouse, a confounder for translating the model to human disease.

notes: >
  Named-entity-confusion preflight. The MONDO label for this entity
  ("early-onset progressive neurodegeneration-blindness-ataxia-spasticity syndrome") is
  purely descriptive and names a phenotype cluster shared by many genetically distinct
  diseases, so this entry was built only after independently establishing the causal gene.
  MONDO:0014209 asserts `RO:0004003 HGNC:12513 ! UCHL1`, xrefs OMIM:615491 and
  Orphanet:352654, and carries the synonyms SPG79 and NDGOA; NCBI MedGen (concept
  C3809665) independently defines OMIM 615491 as "Spastic paraplegia-79B (SPG79B) ... an
  autosomal recessive progressive neurologic disorder". The MONDO definition text is
  drawn essentially verbatim from the index UCHL1 report (PMID:23359680). The gene is
  therefore UCHL1 on three independent anchors — the MONDO relationship, the MedGen/OMIM
  definition, and the primary literature. Confusable entities deliberately kept out: Behr
  syndrome (OPA1 and friends), autosomal dominant optic atrophy (OPA1), Friedreich
  ataxia, PLA2G6-related neurodegeneration, and the other hereditary spastic paraplegias.

  Recessive/dominant split. UCHL1 causes two allelic but nosologically separate
  disorders: the severe childhood-onset biallelic disease curated here (SPG79B, OMIM
  615491, MONDO:0014209) and a later-onset autosomal dominant spastic ataxia caused by
  heterozygous loss of function (SPG79A). Reports of the dominant disorder (PMID:35986737,
  PMID:39030458, PMID:41402561, PMID:42375238) are cited here only to characterise the
  allelic spectrum, to distinguish the two entities, to support a general UCH-L1 function
  statement, and — with an explicit PARTIAL/cross-arm caveat — for the neuropathy
  phenotype; they are not used as evidence for the recessive phenotype itself. A separate
  dismech entry for SPG79A would be a reasonable follow-up.

  PARK5 / UCHL1 parkinsonism kept out. A third, older UCHL1 literature — the
  p.Ile93Met (PARK5) dominant-parkinsonism allele and the p.Ser18Tyr protective
  polymorphism — concerns a proposed toxic gain-of-function mechanism and a susceptibility
  association, not the loss-of-function optic-atrophy/spastic-paraplegia spectrum. It is
  deliberately excluded from this entry so that the three UCHL1 disease concepts
  (recessive SPG79B, dominant SPG79A, PARK5) are not merged.

  Behr syndrome boundary. dismech already curates `Behr_Syndrome` (MONDO:0008858) as the
  clinically defined, genetically heterogeneous mitochondrial optic-atrophy-plus entity
  (OPA1 core, plus OPA3, C12orf65/MTRFR, C19orf12). The clinical overlap with UCHL1
  disease is near-complete, and PMID:32656641 in fact reported a UCHL1 family as a novel
  genetic form of Behr syndrome. The two are kept as separate dismech entries because
  their pathophysiology graphs are disjoint — mitochondrial fusion/cristae/OXPHOS failure
  versus ubiquitin-proteasome failure — and because MONDO gives them distinct identifiers.
  UCHL1 is deliberately not added to the `Behr_Syndrome` gene list; the relationship is
  recorded here as a differential diagnosis instead.

  GeneReviews. PubMed searches for a GeneReviews chapter covering UCHL1 or SPG79 returned
  no results (searched 2026-08-01), so no GeneReviews phenotype baseline was available for
  this entry. The phenotype set is therefore built from the four published recessive
  families, principally Table 1 of PMID:32656641, which pools all ten reported patients.
  The class-level chapter PMID:20301682 (Uncomplicated (Pure) Hereditary Spastic
  Paraplegia Overview) is tagged in `references:` as the nearest GeneReviews anchor, but
  with an explicit scope caveat: it covers *pure* HSP, while SPG79B is a complicated HSP,
  so no clinical claim in this entry is drawn from it.

  Deep research provenance. An Edison (falcon) deep-research run was performed and read
  (`research/UCHL1-Related_Neurodegeneration_with_Optic_Atrophy_and_Spastic_Paraplegia-deep-research-falcon.md`,
  33 citations, 12.5 min). Its NEC check was clean — the report is UCHL1-centred
  throughout, names MONDO:0014209 and Orphanet:352654 correctly, and mentions OPA1 only
  as a differential diagnosis. It was used as leads, not ground truth: every PMID it
  suggested was re-fetched with `just fetch-reference` and every snippet verified against
  the cached abstract. Its citation keys are author-year strings rather than PMIDs, so
  each source was independently resolved via PubMed/DOI before use. Two of its leads
  could not be used for evidence: the Genc 2019 mouse-model review (PMID:31394733), whose
  UCHL1(nm3419) corticospinal-neuron claims live in the full text and are absent from the
  cached abstract, and the Drosophila dUCH knockdown work, which models dopaminergic
  rather than optic/spastic degeneration. Its Open Targets-derived claim that the
  dominant paper is `10.1016/j.gim.2023.100961` was not adopted; the verified record used
  here is PMID:35986737 (`10.1016/j.gim.2022.07.006`).

  Evidence discipline: frequency bands. Every `frequency:` value in this entry is derived
  from one source and one source only — Table 1 of PMID:32656641, which pools all ten
  patients reported across the four published SPG79B families and scores each feature
  per patient. Five phenotypes carry a band, and in each case the cited snippet is the
  Table 1 row for *that specific feature*, so the denominator counts the feature the band
  is attached to rather than an aggregate category containing it:

  - Peripheral neuropathy, VERY_FREQUENT — "Peripheral motor neuropathy" row, 10/10.
  - Loss of ambulation, VERY_FREQUENT — "Lost ambulation" row, 10/10.
  - Cognitive impairment, FREQUENT — "Cognitive impairment" row, 4 of 9 assessable (44%),
    one patient not assessed. Counter-evidence (normal cognition in both index siblings)
    is recorded as a REFUTE item on the same phenotype.
  - Seizures, OCCASIONAL — "Seizures" row, 2/10 (20%).
  - Ophthalmoparesis, OCCASIONAL — "Ophthalmoparesis" row, 2 of 7 assessable (29%).

  Bands are deliberately NOT assigned to any other phenotype. Where the only available
  statement is an aggregate one (for example "less consistently described features
  include epilepsy, cognitive impairment, facial myokymia..."), it is retained as
  association evidence with an explicit note that it does not carry the band. The one
  quantified series elsewhere in the literature (optic atrophy 9/17, neuropathy 11/21)
  belongs to the *dominant* SPG79A cohort, is marked PARTIAL and cross-arm, and is never
  used to set a band here. Two Table 1 snippets reproduce a row rendered from the source
  HTML table, so the row label runs into its first cells ("Cognitive impairmentNA...",
  "OphthalmoparesisNANANA...") — that is the source text, not a transcription error.

  `Tetraparesis` is recorded from the Orphanet/MONDO definition with an explanatory
  `notes` field and no evidence item, rather than with an unverifiable snippet.

references:
- reference: PMID:23359680
  title: Recessive loss of function of the neuronal ubiquitin hydrolase UCHL1 leads to early-onset progressive neurodegeneration.
  findings:
  - statement: >-
      The index report defines the entity: three siblings of a consanguineous union with
      childhood-onset blindness, cerebellar ataxia, nystagmus, dorsal column dysfunction
      and spasticity with upper motor neuron dysfunction, homozygous for UCHL1 p.Glu7Ala.
    supporting_text: "progressive neurodegenerative syndrome featuring childhood onset blindness, "
  - statement: >-
      The disease allele combines loss of ubiquitin binding with loss of catalysis, giving
      a >100-fold reduction in enzymatic efficiency and establishing a broad requirement
      for UCHL1 in maintaining the nervous system.
    supporting_text: "resulted in a >100-fold reduction in the efficiency of UCHL1(GLU7ALA) relative "

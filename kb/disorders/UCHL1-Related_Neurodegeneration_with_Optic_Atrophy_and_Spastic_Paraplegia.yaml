    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL

- name: Antispasticity Pharmacotherapy
  description: >
    Symptomatic spasticity management is extrapolated from general hereditary spastic
    paraplegia practice rather than from any UCHL1-specific study: oral baclofen or
    tizanidine, focal botulinum toxin, and intrathecal baclofen in severe generalised
    spasticity. No UCHL1-specific response rate or adverse-event estimate exists, and
    symptomatic measures in hereditary spastic paraplegia as a class remain
    unsatisfactory.
  treatment_term:

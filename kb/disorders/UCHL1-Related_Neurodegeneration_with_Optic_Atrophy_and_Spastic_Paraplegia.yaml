name: UCHL1-Related Neurodegeneration with Optic Atrophy and Spastic Paraplegia
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- early-onset progressive neurodegeneration-blindness-ataxia-spasticity syndrome
- SPG79B
- spastic paraplegia 79, autosomal recessive
- childhood-onset neurodegeneration with optic atrophy
- NDGOA
description: >
  An autosomal recessive, early-onset progressive neurodegenerative disease caused by
  biallelic loss-of-function variants in UCHL1, which encodes ubiquitin C-terminal
  hydrolase L1 (UCH-L1 / PGP 9.5) — a neuron-specific deubiquitinating enzyme and one of
  the most abundant proteins in the brain. Early development is normal; affected children
  then develop optic atrophy with progressive visual loss beginning in the first decade
  and proceeding to blindness, followed by a progressive neurological decline comprising cerebellar
  ataxia, nystagmus, dorsal column dysfunction (loss of vibration and position sense) and
  spastic paraplegia with upper motor neuron signs, ultimately progressing to
  tetraparesis. The entity is designated SPG79B (OMIM 615491) in the hereditary spastic
  paraplegia nomenclature and was originally reported as childhood-onset neurodegeneration
  with optic atrophy (NDGOA). Mechanistically it is a disorder of the neuronal
  ubiquitin-proteasome system: loss of UCH-L1 hydrolase/ubiquitin-binding function
  compromises ubiquitin recycling and the free monoubiquitin pool, impairing
  ubiquitin-dependent protein turnover and producing a dying-back axonal degeneration that
  preferentially affects the long, highly transport-dependent projections of the optic
  nerve, corticospinal tracts, dorsal columns and cerebellar circuitry. It is therefore
  mechanistically distinct from — although clinically overlapping with — the mitochondrial
  optic-atrophy-plus disorders such as Behr syndrome (see `differential_diagnoses` and
  `notes`).

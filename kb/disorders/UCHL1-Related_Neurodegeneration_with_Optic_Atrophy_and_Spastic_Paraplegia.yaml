animal_models:
- species: Mus musculus
  genotype: Uchl1(gad) - spontaneous in-frame deletion of Uchl1 exons 7-8
  description: >
    The gracile axonal dystrophy (gad) mouse is the reference animal model. It is an
    autosomal recessive spontaneous mutant carrying an in-frame deletion of Uchl1 exons 7
    and 8 that removes a 42-amino-acid segment containing a catalytic residue. gad mice
    show early sensory ataxia followed by motor ataxia and posterior paralysis, with
    dying-back axonal degeneration, terminal spheroid bodies, and retrograde accumulation
    of ubiquitin-positive deposits along sensory and motor pathways — closely paralleling
    the human dorsal-column-plus-corticospinal phenotype.
  genes:

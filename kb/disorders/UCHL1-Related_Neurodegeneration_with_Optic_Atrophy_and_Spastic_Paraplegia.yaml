    explanation: >
      Independently characterises the gad phenotype and shows that concurrent Uch-L3 loss
      worsens it, indicating partial functional redundancy among UCH isozymes.

differential_diagnoses:
- name: Behr syndrome
  description: >
    Behr syndrome is the closest clinical mimic and the most important
    named-entity-confusion hazard for this disorder: it is defined by essentially the same
    constellation of early-onset optic atrophy, ataxia, pyramidal signs, posterior-column
    sensory loss and peripheral neuropathy. It is, however, a clinically defined,
    genetically heterogeneous mitochondrial entity, with biallelic OPA1 as its core
    molecularly resolved cause and OPA3, C12orf65/MTRFR and C19orf12 as additional causes,
    all converging on impaired mitochondrial bioenergetics. UCHL1 disease reaches the same
    clinical picture by an entirely different route — failure of the neuronal
    ubiquitin-proteasome system. Indeed one UCHL1 family was published under the Behr
    syndrome label as a novel genetic form of Behr syndrome, so the two entities are
    curated separately in dismech (`Behr_Syndrome`) and the boundary is molecular, not
    clinical.
  disease_term:
    preferred_term: Behr syndrome
    term:
      id: MONDO:0008858
      label: Behr syndrome
  distinguishing_features:
  - Mitochondrial bioenergetic mechanism (OPA1, OPA3, C12orf65/MTRFR, C19orf12) rather than ubiquitin-proteasome failure
  - Elevated blood or CSF lactate and a lactate peak on MR spectroscopy
  - Leigh-like basal-ganglia signal abnormality on MRI
  - Cytochrome-c-oxidase-deficient fibres on muscle biopsy
  - Multiple mitochondrial DNA deletions in skeletal muscle
  - Molecular testing is the definitive discriminator
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is a clinically distinct, but genetically "
    explanation: >
      States that Behr syndrome is clinically distinct but genetically heterogeneous — the
      reason a UCHL1 family could be reported under that label, and the reason the
      boundary between the two dismech entries must be drawn molecularly.

- name: SPG79A - autosomal dominant UCHL1-related spastic ataxia
  disease_term:
    preferred_term: spastic paraplegia 79A, autosomal dominant, with ataxia
    term:
      id: MONDO:0859363
      label: spastic paraplegia 79A, autosomal dominant, with ataxia
  description: >
    The allelic autosomal dominant disorder caused by heterozygous UCHL1 loss of function,
    established by gene-burden analysis across 3169 ataxia and spastic-paraplegia patients
    and 33,141 controls, with 34 cases from 18 families. It presents later (adult or
    late-onset), is milder, and shows spasticity, ataxia, neuropathy and optic atrophy in
    varying combinations; the mechanism is UCHL1 haploinsufficiency (approximately 50%
    protein reduction in patient fibroblasts) rather than the near-complete loss seen in
    the recessive disease. It is a distinct OMIM and MONDO entity and is not curated here.
  distinguishing_features:
  - Monoallelic (heterozygous) UCHL1 loss-of-function variant
  - Autosomal dominant family history across generations
  - Adult or late-onset course rather than childhood onset
  - Milder and more variable phenotype, with optic atrophy sometimes asymptomatic
  - Approximately 50% UCHL1 protein reduction rather than near-complete loss of function
  evidence:
  - reference: PMID:35986737
    reference_title: Heterozygous UCHL1 loss-of-function variants cause a neurodegenerative disorder with spasticity, ataxia, neuropathy, and optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and functional studies established haploinsufficiency of UCHL1 as a novel "
    explanation: Establishes heterozygous UCHL1 haploinsufficiency as a separate, dominant disease mechanism.
  - reference: PMID:39030458
    reference_title: "Phenotypic variability related to dominant UCHL1 mutations: about three families with optic atrophy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a severe, complex autosomal recessive spastic paraplegia (HSP79) [1] [2] "
    explanation: >
      Explicitly contrasts the severe complex autosomal recessive UCHL1 disorder (this
      entry) with the more recently described dominant UCHL1 disease.

- name: Hereditary spastic paraplegia - other genetic forms
  description: >
    Because spastic paraplegia is a defining feature, the broader hereditary spastic
    paraplegia group — in particular the complex/complicated forms that combine pyramidal
    signs with optic atrophy, ataxia or neuropathy, such as SPG7 (paraplegin),
    AFG3L2, SPG11 (spatacsin) and MFN2 — must be considered. Most of those combine
    spasticity or neuropathy with optic atrophy through mitochondrial mechanisms, whereas
    UCHL1 disease is a neuronal ubiquitin/proteostasis disorder. Other frequently listed
    phenocopies include OPA1, WFS1, SACS, KIF1A, CAPN1, FDXR, PNPT1, Friedreich ataxia,
    and the treatable metabolic spastic paraplegias. dismech curates the group entry
    `Hereditary_Spastic_Paraplegia`; this disorder is SPG79B within that nomenclature but
    is curated as a separate entity because its ubiquitin-proteasome mechanism and its
    optic-atrophy-first natural history are distinctive.
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  distinguishing_features:
  - Optic atrophy preceding the motor syndrome
  - Prominent dorsal-column sensory loss with impaired vibration and position sense
  - Biallelic UCHL1 variants on sequencing
  evidence:
  - reference: PMID:29735986
    reference_title: Novel splice-site variant of UCHL1 in an Indian family with autosomal recessive spastic paraplegia-79.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spastic Paraplegia-79 (SPG79) is an autosomal recessive type of childhood onset "
    explanation: Places this disorder within the hereditary spastic paraplegia nomenclature as SPG79.


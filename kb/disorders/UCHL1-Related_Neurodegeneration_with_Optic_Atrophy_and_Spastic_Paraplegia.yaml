diagnosis:
- name: Molecular Genetic Testing
  description: >
    Diagnosis rests on identifying biallelic pathogenic UCHL1 variants. Because the
    clinical picture (optic atrophy plus spastic ataxia) is shared by many genetically
    distinct disorders, exome/genome sequencing or a broad hereditary-spastic-paraplegia,
    hereditary-ataxia or inherited-optic-neuropathy gene panel — rather than single-gene
    testing — is the appropriate first-line approach.
  evidence:
  - reference: PMID:23359680
    reference_title: Recessive loss of function of the neuronal ubiquitin hydrolase UCHL1 leads to early-onset progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals followed by whole-exome sequencing of the index case, we identified "
    explanation: The disease gene was, and continues to be, identified by exome sequencing.
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosis is based on gene panel testing or whole-exome/genome sequencing."
    explanation: States that molecular diagnosis in this clinically defined group rests on panel or exome/genome sequencing.

- name: Ophthalmological assessment
  description: >
    Fundoscopy, visual acuity and visual-field testing, optical coherence tomography and
    visual evoked potentials document the optic neuropathy. Because optic atrophy can be
    asymptomatic and under-recognised, the optic nerves should be assessed deliberately in
    anyone presenting with ataxia and spasticity.
  results: Bilateral optic disc pallor with reduced acuity.
  evidence:
  - reference: PMID:42375238
    reference_title: "UCHL1-Related Dominant Optic Atrophy: Report of Two New Families."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should carefully assess the optic nerves in individuals "
    explanation: >
      Explicit clinical recommendation to examine the optic nerves in patients presenting
      with ataxia and spasticity, since optic atrophy can be asymptomatic and
      under-reported yet is decisive for directing genomic testing in UCHL1 disease.
      (Reported for the allelic dominant disorder; the assessment recommendation applies
      across UCHL1-related disease.)

- name: Metabolic and CSF workup (exclusion)
  description: >
    There is no diagnostic biochemical test for this disease; metabolic and CSF studies
    serve to exclude the treatable and mitochondrial mimics that the optic-atrophy-plus
    presentation raises. In the recessive UCHL1 family a detailed panel — acylcarnitines,
    urinary organic acids, very long chain fatty acids, pristanic and phytanic acids,
    lysosomal enzymes, copper, caeruloplasmin and acanthocytes — was entirely normal, as
    were CSF constituents. A normal workup of this kind therefore supports, rather than
    argues against, a UCHL1 diagnosis.
  results: Normal metabolic panel and normal CSF constituents.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed laboratory work-up (including acylcarnitines, urinary organic acids, very long chain fatty acids, pristanic and phytanic acids, lysosomal enzymes, copper, caeruloplasmin, and acanthocytes) was normal. CSF constituents were normal in both cases."
    explanation: >
      Documents the exclusion panel and its normal result in molecularly confirmed
      recessive UCHL1 disease.

- name: Nerve conduction studies and electrophysiology
  description: >
    Nerve conduction studies and EMG are used to characterise the peripheral neuropathy.
    A practical caveat is recorded in the literature: in advanced disease the foot
    deformity and swelling may make neurophysiological testing technically impossible, so
    a negative or absent study should not be read as excluding neuropathy.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, neurophysiological testing was not technically possible due to the degree of foot deformity and swelling."
    explanation: >
      Scored PARTIAL: this documents a limitation of electrophysiology in advanced
      disease rather than a positive diagnostic yield. It is curated because the
      practical caveat matters when interpreting a missing study.

- name: Cardiac surveillance
  description: >
    Echocardiographic and rhythm surveillance is recommended in UCHL1-related
    neurodegeneration because hypertrophic cardiomyopathy with sudden cardiac death has
    been reported.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "highlights the importance of cardiac follow-up and treatment in "
    explanation: Directly recommends cardiac follow-up in UCHL1-associated neurodegeneration.

treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    No disease-modifying therapy exists. Management is supportive and multidisciplinary:
    low-vision rehabilitation, physiotherapy and spasticity management, mobility aids,
    orthopaedic assessment of scoliosis, respiratory monitoring, cardiac surveillance and
    genetic counselling.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >
    `therapeutic_modality` is deliberately omitted: this bundle spans behavioural,
    procedural (cardiac and orthopaedic surveillance) and pharmacological components, so
    no single platform value applies. Per CLAUDE.md, generic action terms such as
    NCIT:C15747 are excluded from mechanical modality backfill.

- name: Low-Vision Rehabilitation
  description: >
    Visual aids, educational support and low-vision rehabilitation for the early, severe
    and ultimately profound visual impairment.
  treatment_term:

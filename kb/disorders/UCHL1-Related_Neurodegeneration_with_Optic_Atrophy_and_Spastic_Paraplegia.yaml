genetic:
- name: UCHL1
  notes: >
    Biallelic pathogenic variants in UCHL1 (chromosome 4p13) are the sole established
    cause of this entity. UCHL1 encodes ubiquitin C-terminal hydrolase L1 (UCH-L1, also
    known as PGP 9.5), a neuron-specific deubiquitinating enzyme. Only a small number of
    families have been reported. Heterozygous UCHL1 loss-of-function causes a distinct,
    later-onset autosomal dominant disorder (SPG79A) — see `notes` and
    `differential_diagnoses`.
  gene_term:
    preferred_term: UCHL1
    term:

progression:
- phase: Early
  age_range: Onset 2-10 years across the ten published patients
  notes: >
    Childhood-onset visual loss from optic atrophy is the first symptom in almost every
    reported patient, accompanied by gait imbalance and subtle pyramidal or neuropathic
    signs. Two patients instead presented with developmental delay and one with seizures.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases described to date, the first symptom was of childhood-onset visual loss due to optic atrophy."
    explanation: Establishes childhood visual loss as the near-invariant first stage of the disease course.
- phase: Intermediate
  notes: >
    A definite spastic-ataxic gait emerges with established optic atrophy, distal wasting
    and foot deformity from the motor neuropathy, and falls. The tempo is slow and the
    course chronic and progressive rather than episodic or relapsing.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subsequent disease course was characterized by varying degrees of spasticity and cerebellar ataxia."
    explanation: Establishes the spastic-ataxic stage that follows the visual presentation.
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients had a childhood-onset, slowly progressive disease "
    explanation: Characterises the tempo as childhood-onset and slowly progressive.
- phase: Advanced
  age_range: Reported ages at last examination 7-65 years, so the course can extend over decades
  notes: >
    Severe visual disability or blindness, loss of independent ambulation (recorded in
    all ten published patients), progressive four-limb involvement and contractures. In
    one family scoliosis produced restrictive respiratory compromise, and both siblings
    died suddenly of hypertrophic cardiomyopathy at 40 and 43 years. No validated
    progression scale, median disease duration or intervention window exists.
  evidence:
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "also developed scoliosis, leading to respiratory problems. In their late 30's, "
    explanation: >
      Documents the late-stage complications — scoliosis with respiratory compromise,
      then adult-onset hypertrophic cardiomyopathy — in the longest-followed family.

inheritance:
- name: Autosomal recessive
  description: >
    The disease is inherited in an autosomal recessive manner. Reported families carry
    homozygous variants (consanguineous unions) or compound heterozygous variants in
    UCHL1, cosegregating with the phenotype. Heterozygous UCHL1 loss-of-function is a
    distinct, later-onset autosomal dominant disorder (SPG79A) rather than a carrier
    state for this entity — see `notes`.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23359680
    reference_title: Recessive loss of function of the neuronal ubiquitin hydrolase UCHL1 leads to early-onset progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a previously undescribed homozygous missense mutation within the ubiquitin "
    explanation: >
      The index family comprised three affected siblings from a consanguineous union
      sharing a homozygous UCHL1 missense variant — the classic recessive architecture.
  - reference: PMID:29735986
    reference_title: Novel splice-site variant of UCHL1 in an Indian family with autosomal recessive spastic paraplegia-79.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spastic Paraplegia-79 (SPG79) is an autosomal recessive type of childhood onset "
    explanation: Independently states the autosomal recessive, childhood-onset nature of SPG79.

pathophysiology:
- name: Biallelic UCHL1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    UCHL1 encodes ubiquitin C-terminal hydrolase L1, a neuron-specific
    (and testis/ovary-expressed) cysteine-protease deubiquitinating enzyme that is among
    the most abundant proteins in the brain. Reported disease alleles compromise the
    enzyme in several distinct ways: the index p.Glu7Ala allele lies in the
    ubiquitin-binding region and causes a >7-fold loss of ubiquitin affinity with near
    complete loss of hydrolase activity (>100-fold reduction in catalytic efficiency);
    p.Ala216Asp renders the protein insoluble (loss of function); a canonical splice-site
    variant (c.459+2T>C) and an in-frame deletion (p.Gly210del) have also been reported.
    Notably one allele, p.Arg178Gln, paradoxically increases hydrolytic turnover, so the
    unifying lesion is loss of normal UCH-L1 function/steady-state protein rather than
    strictly reduced catalysis (see `mechanistic_hypotheses`).
  gene:
    preferred_term: UCHL1
    term:
      id: hgnc:12513
      label: UCHL1
  molecular_functions:
  - preferred_term: cysteine-type deubiquitinase activity
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
    modifier: DECREASED
  - preferred_term: ubiquitin binding
    term:
      id: GO:0043130
      label: ubiquitin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:23359680
    reference_title: Recessive loss of function of the neuronal ubiquitin hydrolase UCHL1 leads to early-onset progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro, the mutation led to a near complete loss of UCHL1 hydrolase activity. "
    explanation: Directly demonstrates that the disease allele abolishes UCH-L1 hydrolase activity.
  - reference: PMID:27515257
    reference_title: "Ubiquitin C-terminal hydrolase L1 (UCH-L1): structure, distribution and roles in brain function and dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UCH-L1 is not essential for neuronal development but it is absolutely required for the maintenance of axonal integrity"
    explanation: >
      Explains the natural history: UCH-L1 is dispensable for neuronal development —
      hence the normal early development of affected children — but is absolutely
      required for maintenance of axonal integrity thereafter, which is why the disease
      is degenerative rather than malformative.
  - reference: PMID:27515257
    reference_title: "Ubiquitin C-terminal hydrolase L1 (UCH-L1): structure, distribution and roles in brain function and dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it is estimated to make up 1-5% of total neuronal protein"
    explanation: >
      Quantifies the extraordinary neuronal abundance of UCH-L1, which underlies why its
      loss is tolerated poorly and specifically by neurons.
  - reference: PMID:23359680
    reference_title: Recessive loss of function of the neuronal ubiquitin hydrolase UCHL1 leads to early-onset progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "compared with WT, exhibited at least sevenfold reduced affinity for ubiquitin. "
    explanation: Isothermal titration calorimetry quantifies the loss of ubiquitin binding by the p.Glu7Ala protein.
  - reference: PMID:28007905
    reference_title: Novel UCHL1 mutations reveal new insights into ubiquitin processing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UCHL1 protein levels in fibroblasts measured "
    explanation: >
      Targeted mass spectrometry in patient fibroblasts showed roughly four-fold lower
      total UCHL1 than controls, establishing reduced steady-state UCH-L1 protein as the
      shared consequence in a second family.
  downstream:
  - target: Failure of Neuronal Ubiquitin Recycling
    description: >
      Loss of UCH-L1 hydrolase and ubiquitin-binding function directly impairs the
      processing and recycling of ubiquitin in neurons.
    causal_link_type: DIRECT

- name: Failure of Neuronal Ubiquitin Recycling
  biological_scale: MOLECULAR
  description: >
    UCH-L1 binds monoubiquitin with high avidity, prolongs its half-life and generates
    free monomeric ubiquitin from adducts and precursors. Loss of UCH-L1 function
    therefore depletes the neuronal free-monoubiquitin pool on which all downstream
    ubiquitin conjugation depends. This was shown in vivo in the gad mouse, in which
    UCH-L1 function is lost and neuronal monoubiquitin is reduced.
  biological_processes:
  - preferred_term: ubiquitin recycling
    term:
      id: GO:0010992
      label: ubiquitin recycling
    modifier: DECREASED
  - preferred_term: protein deubiquitination
    term:
      id: GO:0016579
      label: protein deubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:12913066
    reference_title: Ubiquitin carboxy-terminal hydrolase L1 binds to and stabilizes monoubiquitin in neuron.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The gad mouse, in which the function of UCH L1 is lost, exhibited a reduced "
    explanation: >
      Establishes in vivo that loss of UCH-L1 function reduces the neuronal monoubiquitin
      level. Model-organism evidence for the molecular step, not for the human phenotype.
  - reference: PMID:12913066
    reference_title: Ubiquitin carboxy-terminal hydrolase L1 binds to and stabilizes monoubiquitin in neuron.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "associates and colocalizes with monoubiquitin and elongates ubiquitin half-life. "
    explanation: Defines the biochemical function — ubiquitin stabilisation — that is lost in disease.
  downstream:
  - target: Impaired Ubiquitin-Dependent Protein Turnover
    description: >
      A depleted free-ubiquitin pool limits substrate ubiquitination and hence flux
      through the ubiquitin-proteasome degradation system.
    causal_link_type: DIRECT

- name: Impaired Ubiquitin-Dependent Protein Turnover
  biological_scale: CELLULAR
  description: >
    Reduced ubiquitin availability and deubiquitinase activity slow proteasome-mediated
    protein catabolism in neurons, so misfolded and damaged proteins are cleared less
    efficiently and ubiquitinated conjugates accumulate. In the Uchl1-mutant gad mouse
    this is seen directly as progressive accumulation of ubiquitin-positive deposits
    along sensory and motor pathways.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:10471497
    reference_title: Intragenic deletion in the gene encoding ubiquitin carboxy-terminal hydrolase in gad mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As Uch-l1 is thought to stimulate protein degradation by generating free monomeric ubiquitin, the gad mutation appears to affect protein turnover."
    explanation: >
      States the mechanistic inference directly: loss of Uch-l1, which generates the free
      monomeric ubiquitin that drives protein degradation, impairs protein turnover.
      Model-organism evidence.
  - reference: PMID:10471497
    reference_title: Intragenic deletion in the gene encoding ubiquitin carboxy-terminal hydrolase in gad mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "occur retrogradely along the sensory and motor nervous systems. "
    explanation: >
      Documents retrograde accumulation of amyloid-beta and ubiquitin-positive deposits
      along the affected sensory and motor systems in the Uchl1-mutant mouse.
  - reference: PMID:32656641
    reference_title: Behr syndrome and hypertrophic cardiomyopathy in a family with a novel UCHL1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is critically important in maintaining free ubiquitin levels through the addition or removal of ubiquitin to poly-ubiquitin chains, and thus has a central role in cytoplasmic protein degradation"
    explanation: >
      A report of an affected recessive UCHL1 family states the mechanistic link
      explicitly: UCH-L1 maintains free ubiquitin levels and thereby has a central role
      in cytoplasmic protein degradation.
  - reference: PMID:33159930
    reference_title: Abolishing UCHL1's hydrolase activity exacerbates TBI-induced axonal injury and neuronal death in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "contributes to the function of the ubiquitin proteasome pathway (UPP), "
    explanation: >
      A catalytically dead (C90A) knock-in mouse establishes that UCH-L1 hydrolase
      activity contributes to ubiquitin-proteasome pathway function and restrains
      autophagy activation. Model-organism evidence.
  downstream:
  - target: Dying-Back Axonal Degeneration
    description: >
      Failure of ubiquitin-dependent proteostasis is most damaging to the distal ends of
      long axons, where proteins must be maintained far from the soma, producing a
      dying-back pattern of degeneration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Dying-Back Axonal Degeneration
  biological_scale: CELLULAR
  description: >
    The cardinal cellular lesion is a distal-to-proximal ("dying-back") axonal
    degeneration with formation of axonal spheroids at nerve terminals, established in the
    Uchl1-mutant gad mouse and matching the length-dependent clinical pattern in patients.
    Long, thin, highly transport-dependent projections — retinal ganglion cell axons in
    the optic nerve, corticospinal tract axons, and the ascending dorsal-column sensory
    axons — are selectively vulnerable.
  biological_processes:
  - preferred_term: axonal transport
    term:
      id: GO:0098930
      label: axonal transport
    modifier: ABNORMAL
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:10471497
    reference_title: Intragenic deletion in the gene encoding ubiquitin carboxy-terminal hydrolase in gad mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the mutant is characterized by 'dying-back' type axonal "
    explanation: >
      Establishes dying-back axonal degeneration with terminal spheroid bodies as the
      pathological signature of Uchl1 loss of function. Model-organism evidence.
  - reference: PMID:11555633
    reference_title: Loss of Uch-L1 and Uch-L3 leads to neurodegeneration, posterior paralysis and dysphagia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "display sensory ataxia followed by posterior paralysis and "
    explanation: >
      The gad mouse recapitulates the human sequence — sensory (dorsal column) involvement

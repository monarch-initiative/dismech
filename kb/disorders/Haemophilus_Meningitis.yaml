name: Haemophilus meningitis
creation_date: "2026-09-30T02:18:19Z"
description: >-
  Haemophilus meningitis is bacterial meningitis caused by invasive
  Haemophilus influenzae, classically type b strains, after the organism
  colonizes the upper airway, invades blood, and reaches the meninges to
  replicate in cerebrospinal fluid and trigger acute meningeal inflammation.
category: Infectious Disease
disease_term:
  preferred_term: haemophilus meningitis
  term:
    id: MONDO:0000889
    label: haemophilus meningitis
parents:
- Bacterial meningitis
synonyms:
- Haemophilus influenzae meningitis
- Hib meningitis
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 49 reported
  references resolved and none were judged off-topic, but four generated
  epidemiology/vaccine quotes were not exact (PMID:33247582, PMID:34590133,
  PMID:33668442, PMID:41911930) and were not curated. The report's HPO table
  also used otherwise valid phenotype identifiers as labels for phenotype-type
  columns; HP:0012595, which the report attached to subdural effusion, is Mild
  proteinuria and was avoided. preflight-dr skipped automated gene-identity
  checks because MONDO:0000889 records no causal gene; manual review confirmed
  that the report covered H. influenzae meningitis.
infectious_agent:
- name: Haemophilus influenzae
  infectious_agent_term:
    preferred_term: Haemophilus influenzae
    term:
      id: NCBITaxon:727
      label: Haemophilus influenzae
  description: >-
    Gram-negative nasopharyngeal bacterium whose invasive encapsulated type b
    lineage historically caused pediatric bacterial meningitis.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Background in a blood-CSF-barrier invasion study identifies H.
      influenzae as an upper-respiratory colonizer that can cause meningitis.
agent_life_cycle:
  description: >-
    H. influenzae is a human upper-respiratory organism; invasive encapsulated
    lineages colonize human hosts without an arthropod or animal vector and can
    spill from the nasopharynx into blood and cerebrospinal-fluid disease.
  hosts:
  - preferred_term: Homo sapiens
    role: nasopharyngeal host and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Supports the human upper-airway phase that precedes invasive H.
      influenzae disease.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Respiratory Haemophilus acquisition
  description: >-
    H. influenzae reaches a new host through respiratory secretions, colonizes
    the nasopharynx, and can invade blood before meningeal infection develops.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Places H. influenzae in the upper respiratory tract before invasive
      meningitis.
pathophysiology:
- name: Nasopharyngeal Haemophilus Acquisition
  role: trigger
  description: >-
    Respiratory exposure seeds the nasopharynx with an invasive H. influenzae
    lineage.
  biological_scale: ORGANISM
  downstream:
  - target: Invasive Haemophilus Bacteremia
    causal_link_type: DIRECT
    description: >-
      Colonizing bacteria that escape mucosal containment enter the bloodstream.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Supports upper-respiratory colonization as the early host phase for H.
      influenzae strains that go on to cause invasive disease.
- name: Invasive Haemophilus Bacteremia
  description: >-
    Bloodstream H. influenzae survives host clearance and disseminates to the
    central nervous system.
  biological_scale: ORGANISM
  downstream:
  - target: PRP Capsule Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Encapsulated Hib uses its PRP capsule to resist phagocytic and
      opsonic-complement clearance.
  - target: Meningeal Haemophilus Seeding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bacteria that survive the bloodstream interact with the blood-CSF and
      blood-brain barriers before entering the cerebrospinal-fluid compartment.
  evidence:
  - reference: PMID:34076491
    reference_title: Invasive Haemophilus influenzae Infections after 3 Decades of Hib Protein Conjugate Vaccine Use.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Its major virulence factor is the polyribosyl ribitol phosphate (PRP)
      polysaccharide capsule.
    explanation: >-
      Review synthesis identifies the Hib PRP capsule as the major virulence
      factor in invasive H. influenzae disease.
- name: PRP Capsule Immune Evasion
  description: >-
    The Hib polyribosyl ribitol phosphate capsule is the major virulence factor
    and protects H. influenzae from phagocytosis and opsonization, favoring
    bloodstream survival.
  biological_scale: CELLULAR
  downstream:
  - target: Meningeal Haemophilus Seeding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Capsule-supported bacteremia lets invasive H. influenzae persist long
      enough to reach neurovascular barriers.
  evidence:
  - reference: PMID:34076491
    reference_title: Invasive Haemophilus influenzae Infections after 3 Decades of Hib Protein Conjugate Vaccine Use.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Its major virulence factor is the polyribosyl ribitol phosphate (PRP)
      polysaccharide capsule.
    explanation: >-
      Identifies the PRP capsule as the defining Hib virulence structure.
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The H. influenzae capsule protects the bacteria against both phagocytosis
      and opsonization.
    explanation: >-
      Supports the bloodstream immune-evasion function assigned to the capsule.
- name: Meningeal Haemophilus Seeding
  description: >-
    Hib and related encapsulated H. influenzae strains cross the
    blood-cerebrospinal-fluid barrier through choroid plexus epithelial cells
    and enter the cerebrospinal-fluid compartment.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  locations:
  - preferred_term: choroid plexus
    term:
      id: UBERON:0001886
      label: choroid plexus
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: LOS-TNF Meningeal Inflammation
    causal_link_type: DIRECT
    description: >-
      Once bacteria seed cerebrospinal fluid, bacterial lipooligosaccharide
      elicits the local cytokine cascade that drives purulent meningitis.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To enter the central nervous system (CNS) the bacteria generally have to
      cross either the blood-brain barrier (BBB) or the blood-cerebrospinal
      fluid barrier (BSCFB).
    explanation: >-
      Establishes the blood-CSF barrier and blood-brain barrier as candidate
      CNS-entry routes for H. influenzae.
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that Hib can adhere to and invade into HIBCPP cells.
    explanation: >-
      Directly supports Hib adhesion to and invasion of the human choroid
      plexus papilloma blood-CSF-barrier cell model.
- name: LOS-TNF Meningeal Inflammation
  description: >-
    Hib lipooligosaccharide in cerebrospinal fluid induces early TNF-alpha and
    interleukin-1 beta production, followed by neutrophilic inflammation of the
    meningeal compartment.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
  locations:
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Blood-Brain Barrier Breakdown
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      CSF cytokines and leukocyte influx amplify permeability injury at the
      blood-brain barrier.
  evidence:
  - reference: PMID:2794062
    reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF activity was first detected 45 min after intracisternal (IC) injection
      of 20 ng Hib LOS and white blood cells (WBC) first appeared 75 min later.
    explanation: >-
      The rabbit Hib-LOS model places CSF TNF production upstream of leukocyte
      influx.
  - reference: PMID:2373990
    reference_title: Tumor necrosis factor alpha/cachectin and interleukin 1 beta initiate meningeal inflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data provide evidence for a seminal role of TNF-alpha and IL-1 beta
      in the initial events of meningeal inflammation.
    explanation: >-
      Homologous rabbit-cytokine experiments identify TNF-alpha and IL-1 beta as
      initiating mediators in bacterial meningeal inflammation.
- name: Blood-Brain Barrier Breakdown
  description: >-
    H. influenzae type b hematogenous meningitis increases blood-brain-barrier
    permeability, allowing serum proteins and inflammatory mediators to enter
    cerebrospinal fluid and drive edema-producing CNS injury.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  evidence:
  - reference: PMID:9184127
    reference_title: Blood-brain barrier permeability during the development of experimental bacterial meningitis in the rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the model of hematogenous meningitis, the mean CSF penetration was
      significantly greater in animals with H. influenzae type b meningitis than
      in those with meningitis due to K1 E. coli or type III group B
      streptococcus.
    explanation: >-
      Supports blood-brain-barrier permeability as a downstream tissue injury in
      hematogenous Hib meningitis.
phenotypes:
- name: Fever
  description: Fever is a common presenting sign in pediatric bacterial meningitis cohorts dominated by H. influenzae.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:9570646
    reference_title: Childhood bacterial meningitis in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presenting symptoms in decreasing order of frequency were fever 86%,
      vomiting 29%, poor feeding 19%, seizure 14% and lethargy 14%.
    explanation: >-
      Fever was the most common presenting symptom in a pediatric bacterial
      meningitis cohort in which H. influenzae caused 66% of cases.
- name: Seizure
  description: Seizures can occur during acute Haemophilus-predominant pediatric bacterial meningitis and can persist as a post-meningitic seizure disorder.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:9570646
    reference_title: Childhood bacterial meningitis in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presenting symptoms in decreasing order of frequency were fever 86%,
      vomiting 29%, poor feeding 19%, seizure 14% and lethargy 14%.
    explanation: >-
      Seizure was present at presentation in 14% of children in this
      Haemophilus-predominant bacterial meningitis cohort.
- name: Sensorineural hearing impairment
  description: Hearing loss is a clinically important neurologic sequela of Hib-predominant childhood bacterial meningitis.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:9570646
    reference_title: Childhood bacterial meningitis in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications occurred in 26% of the patients and included subdural
      effusion 23%, hearing loss 14%, seizure disorder 10%, developmental delay
      9%, hydrocephalus 6% and motor deficit 30%.
    explanation: >-
      Hearing loss occurred in 14% of patients in a pediatric bacterial
      meningitis series dominated by H. influenzae cases.
- name: Hydrocephalus
  description: Hydrocephalus is an occasional sequela of Haemophilus-predominant pediatric bacterial meningitis.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:9570646
    reference_title: Childhood bacterial meningitis in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications occurred in 26% of the patients and included subdural
      effusion 23%, hearing loss 14%, seizure disorder 10%, developmental delay
      9%, hydrocephalus 6% and motor deficit 30%.
    explanation: >-
      Hydrocephalus occurred in 6% of patients in a pediatric bacterial
      meningitis series dominated by H. influenzae cases.
treatments:
- name: Adjunctive dexamethasone
  description: >-
    Anti-inflammatory corticosteroid given before or with antibiotics to reduce
    cytokine-driven neurologic injury, with the clearest hearing-loss reduction
    signal in Haemophilus influenzae meningitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: LOS-TNF Meningeal Inflammation
    treatment_effect: INHIBITS
    description: >-
      Dexamethasone suppresses Hib-LOS-induced TNF production and meningeal
      inflammation, dampening the inflammatory burst that follows antibiotic
      killing.
    evidence:
    - reference: PMID:2794062
      reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dexamethasone (DXM) (1 mg/kg per i.v.) given 1 h before or
        simultaneously with IC Hib LOS reduced significantly TNF activity and
        meningeal inflammation.
      explanation: >-
        The rabbit Hib-LOS model demonstrates dexamethasone suppression of the
        TNF-linked meningeal inflammatory response.
  evidence:
  - reference: PMID:20824838
    reference_title: Corticosteroids for acute bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corticosteroids were associated with lower rates of severe hearing loss
      (RR 0.67, 95% CI 0.51 to 0.88), any hearing loss (RR 0.76, 95% CI 0.64 to
      0.89) and neurological sequelae (RR 0.83, 95% CI 0.69 to 1.00).
    explanation: >-
      The Cochrane meta-analysis supports adjunctive corticosteroids as a way to
      reduce post-meningitic hearing loss and neurologic sequelae.
  - reference: PMID:20824838
    reference_title: Corticosteroids for acute bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subgroup analyses for causative organisms showed that corticosteroids
      reduced severe hearing loss in Haemophilus influenzae meningitis (RR 0.34,
      95% CI 0.20 to 0.59)
    explanation: >-
      The organism-specific subgroup showed a severe-hearing-loss reduction for
      H. influenzae meningitis.
animal_models:
- name: Infant rat hematogenous Hib meningitis
  species: Rat
  publication: PMID:9184127
  description: >-
    Infant rats develop hematogenous H. influenzae type b meningitis with
    measurable blood-brain-barrier permeability after peripheral inoculation.
  modeled_mechanisms:
  - target: Blood-Brain Barrier Breakdown
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The infant-rat hematogenous model measures albumin leakage into
      cerebrospinal fluid during H. influenzae type b meningitis.
    limitations: >-
      The model uses infant rats and experimentally delivered bacteria, so it
      does not recapitulate natural human nasopharyngeal acquisition.
    evidence:
    - reference: PMID:9184127
      reference_title: Blood-brain barrier permeability during the development of experimental bacterial meningitis in the rat.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the model of hematogenous meningitis, the mean CSF penetration was
        significantly greater in animals with H. influenzae type b meningitis
        than in those with meningitis due to K1 E. coli or type III group B
        streptococcus.
      explanation: >-
        Directly supports the infant rat as a hematogenous Hib meningitis model
        with quantifiable blood-brain-barrier permeability.
    - reference: PMID:10470555
      reference_title: Models of experimental bacterial meningitis. Role and limitations.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        because adult animals will not reliably develop meningitis after
        intranasal or intraperitoneal challenge, infant animals are used.
      explanation: >-
        Review synthesis explains the age limitation that motivates infant
        animals in hematogenous experimental meningitis models.

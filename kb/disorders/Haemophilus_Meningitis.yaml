treatments:
- name: Adjunctive dexamethasone
  description: >-
    Anti-inflammatory corticosteroid given before or with antibiotics to reduce
    cytokine-driven neurologic injury, with the clearest hearing-loss reduction
    signal in Haemophilus influenzae meningitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: Hib LOS-Induced Cytokine Release
    treatment_effect: INHIBITS
    description: >-
      Dexamethasone suppresses Hib-LOS-induced TNF production and meningeal
      inflammation, dampening the inflammatory burst that follows antibiotic
      killing.
    evidence:
    - reference: PMID:2794062
      reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dexamethasone (DXM) (1 mg/kg per i.v.) given 1 h before or
        simultaneously with IC Hib LOS reduced significantly TNF activity and
        meningeal inflammation.
      explanation: >-
        The rabbit Hib-LOS model demonstrates dexamethasone suppression of the
        TNF-linked meningeal inflammatory response.
  evidence:
  - reference: PMID:20824838
    reference_title: Corticosteroids for acute bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corticosteroids were associated with lower rates of severe hearing loss
      (RR 0.67, 95% CI 0.51 to 0.88), any hearing loss (RR 0.76, 95% CI 0.64 to
      0.89) and neurological sequelae (RR 0.83, 95% CI 0.69 to 1.00).
    explanation: >-
      The Cochrane meta-analysis supports adjunctive corticosteroids as a way to
      reduce post-meningitic hearing loss and neurologic sequelae.
  - reference: PMID:20824838
    reference_title: Corticosteroids for acute bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subgroup analyses for causative organisms showed that corticosteroids
      reduced severe hearing loss in Haemophilus influenzae meningitis (RR 0.34,
      95% CI 0.20 to 0.59)
    explanation: >-
      The organism-specific subgroup showed a severe-hearing-loss reduction for
      H. influenzae meningitis.
- name: Third-generation cephalosporin therapy
  description: >-
    Empiric third-generation cephalosporins (ceftriaxone or cefotaxime) are
    first-line antimicrobial therapy; ampicillin-chloramphenicol is an
    alternative where cephalosporins are unavailable, and cephalosporins are
    required for strains that produce beta-lactamase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: cefotaxime
      term:
        id: CHEBI:204928
        label: cefotaxime
  target_mechanisms:
  - target: Meningeal Haemophilus Seeding
    treatment_effect: INHIBITS
    description: >-
      Bactericidal cephalosporins clear H. influenzae from blood and CSF,
      halting meningeal seeding.
  - target: Invasive Haemophilus Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Systemic cephalosporin therapy clears the invasive bloodstream infection.
  evidence:
  - reference: PMID:19375903
    reference_title: "Treatment of bacterial meningitis: an overview of Cochrane systematic reviews."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When third generation cephalosporins are not available,
      ampicillin-chloramphenicol combination may be used as an alternative
      empiric treatment, however both resistance pattern as well as
      availability should be considered while prescribing empiric therapy of
      community acquired ABM.
    explanation: >-
      A Cochrane overview establishes third-generation cephalosporins as the
      primary empiric therapy, with ampicillin-chloramphenicol as the
      alternative.
- name: Hib PRP-protein conjugate vaccination
  description: >-
    PRP-protein conjugate vaccines induce protective anti-PRP antibody and have
    sharply reduced invasive Hib disease including meningitis; anti-PRP antibody
    opsonizes the capsule, acting at the immune-evasion step.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: PRP Capsule Immune Evasion
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced anti-PRP antibody opsonizes the capsule, neutralizing the
      immune-evasion function that enables invasive disease.
  evidence:
  - reference: PMID:33247582
    reference_title: "Changing Epidemiology of Bacterial Meningitis Since Introduction of Conjugate Vaccines: 3 Decades of National Meningitis Surveillance in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Conjugate vaccines effectively reduced the incidence of Haemophilus
      influenzae type b, Neisseria meningitidis serogroup C, and 10 pneumococcal
      serotypes
    explanation: >-
      National surveillance shows conjugate vaccination sharply reduced invasive
      Hib disease incidence.
- name: Rifampin chemoprophylaxis for close contacts
  description: >-
    Rifampin prophylaxis of close and household contacts eliminates
    nasopharyngeal carriage and controls secondary Hib cases and outbreaks.

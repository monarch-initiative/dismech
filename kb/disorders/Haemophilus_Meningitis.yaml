name: Haemophilus meningitis
creation_date: "2026-09-30T02:18:19Z"
description: >-
  Haemophilus meningitis is bacterial meningitis caused by invasive
  Haemophilus influenzae, classically type b strains, after the organism
  colonizes the upper airway, invades blood, and reaches the meninges to
  replicate in cerebrospinal fluid and trigger acute meningeal inflammation.
category: Infectious Disease
disease_term:
  preferred_term: haemophilus meningitis
  term:
    id: MONDO:0000889
    label: haemophilus meningitis
parents:
- Bacterial meningitis
synonyms:
- Haemophilus influenzae meningitis
- Hib meningitis
infectious_agent:
- name: Haemophilus influenzae
  infectious_agent_term:
    preferred_term: Haemophilus influenzae
    term:
      id: NCBITaxon:727
      label: Haemophilus influenzae
  description: >-
    Gram-negative nasopharyngeal bacterium whose invasive encapsulated type b
    lineage historically caused pediatric bacterial meningitis.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Background in a blood-CSF-barrier invasion study identifies H.
      influenzae as an upper-respiratory colonizer that can cause meningitis.
agent_life_cycle:
  description: >-
    H. influenzae is a human upper-respiratory organism; invasive encapsulated
    lineages colonize human hosts without an arthropod or animal vector and can
    spill from the nasopharynx into blood and cerebrospinal-fluid disease.
  hosts:
  - preferred_term: Homo sapiens
    role: nasopharyngeal host and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Supports the human upper-airway phase that precedes invasive H.
      influenzae disease.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Respiratory Haemophilus acquisition
  description: >-
    H. influenzae reaches a new host through respiratory secretions, colonizes
    the nasopharynx, and can invade blood before meningeal infection develops.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Places H. influenzae in the upper respiratory tract before invasive
      meningitis.
pathophysiology:
- name: Nasopharyngeal Haemophilus Acquisition
  role: trigger
  description: >-
    Respiratory exposure seeds the nasopharynx with an invasive H. influenzae
    lineage.
  biological_scale: ORGANISM
  downstream:
  - target: Invasive Haemophilus Bacteremia
    causal_link_type: DIRECT
    description: >-
      Colonizing bacteria that escape mucosal containment enter the bloodstream.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Supports upper-respiratory colonization as the early host phase for H.
      influenzae strains that go on to cause invasive disease.
- name: Invasive Haemophilus Bacteremia
  description: >-
    Bloodstream H. influenzae survives host clearance and disseminates to the
    central nervous system.
  biological_scale: ORGANISM
  downstream:
  - target: PRP Capsule Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Encapsulated Hib uses its PRP capsule to resist phagocytic and
      opsonic-complement clearance.
  - target: Meningeal Haemophilus Seeding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bacteria that survive the bloodstream interact with the blood-CSF and
      blood-brain barriers before entering the cerebrospinal-fluid compartment.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Sustained invasive bacteremia produces systemic fever.
  evidence:
  - reference: PMID:10470555
    reference_title: Models of experimental bacterial meningitis. Role and limitations.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      using intranasal, intravenous, subcutaneous, or intraperitoneal
      inoculation, it is the bacterial and host factors that determine the
      development of bacteremia and the potential for a pathogen to invade the
      central nervous system that primarily are studied.
    explanation: >-
      A review of experimental meningitis models frames bacteremia and
      subsequent central-nervous-system invasion as the pathogenic sequence this
      node represents.
- name: PRP Capsule Immune Evasion
  conforms_to: "polysaccharide_conjugate_t_dependent_switching#Polysaccharide Capsule-Mediated Mucosal Colonization and Complement Evasion"
  description: >-
    The Hib polyribosyl ribitol phosphate capsule is the major virulence factor
    and protects H. influenzae from phagocytosis and opsonization, favoring
    bloodstream survival.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Meningeal Haemophilus Seeding
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Capsule-supported bacteremia lets invasive H. influenzae persist long
      enough to reach neurovascular barriers.
  evidence:
  - reference: PMID:34076491
    reference_title: Invasive Haemophilus influenzae Infections after 3 Decades of Hib Protein Conjugate Vaccine Use.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Its major virulence factor is the polyribosyl ribitol phosphate (PRP)
      polysaccharide capsule.
    explanation: >-
      Identifies the PRP capsule as the defining Hib virulence structure.
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The H. influenzae capsule protects the bacteria against both phagocytosis
      and opsonization.
    explanation: >-
      Supports the bloodstream immune-evasion function assigned to the capsule.
- name: Meningeal Haemophilus Seeding
  description: >-
    Hib and related encapsulated H. influenzae strains cross the
    blood-cerebrospinal-fluid barrier through choroid plexus epithelial cells
    and enter the cerebrospinal-fluid compartment.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  locations:
  - preferred_term: choroid plexus
    term:
      id: UBERON:0001886
      label: choroid plexus
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Hib LOS-Induced Cytokine Release
    causal_link_type: DIRECT
    description: >-
      Once bacteria seed cerebrospinal fluid, bacterial lipooligosaccharide
      elicits the local cytokine cascade that drives purulent meningitis.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      To enter the central nervous system (CNS) the bacteria generally have to
      cross either the blood-brain barrier (BBB) or the blood-cerebrospinal
      fluid barrier (BSCFB).
    explanation: >-
      Establishes the blood-CSF barrier and blood-brain barrier as candidate
      CNS-entry routes for H. influenzae.
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that Hib can adhere to and invade into HIBCPP cells.
    explanation: >-
      Directly supports Hib adhesion to and invasion of the human choroid
      plexus papilloma blood-CSF-barrier cell model.
- name: Hib LOS-Induced Cytokine Release
  description: >-
    Hib lipooligosaccharide shed in cerebrospinal fluid induces early TNF-alpha
    and interleukin-1 beta production, the initiating cytokine signal of
    meningeal inflammation.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  locations:
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Meningeal Neutrophilic Inflammation
    causal_link_type: DIRECT
    description: >-
      Early CSF cytokine release precedes and drives the neutrophilic
      inflammatory influx.
  evidence:
  - reference: PMID:2794062
    reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF activity was first detected 45 min after intracisternal (IC) injection
      of 20 ng Hib LOS and white blood cells (WBC) first appeared 75 min later.
    explanation: >-
      The rabbit Hib-LOS model places CSF TNF production 45 min after LOS, ahead
      of the leukocyte influx at 75 min.
  - reference: PMID:2373990
    reference_title: Tumor necrosis factor alpha/cachectin and interleukin 1 beta initiate meningeal inflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data provide evidence for a seminal role of TNF-alpha and IL-1 beta
      in the initial events of meningeal inflammation.
    explanation: >-
      Homologous rabbit-cytokine experiments identify TNF-alpha and IL-1 beta as
      the initiating mediators of meningeal inflammation.
- name: Meningeal Neutrophilic Inflammation
  description: >-
    LOS-driven cytokines recruit neutrophils into the subarachnoid space,
    producing the neutrophilic meningeal inflammation that generates the acute
    clinical meningitis syndrome.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
  locations:
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Blood-Brain Barrier Breakdown
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Leukocyte influx and cytokines amplify permeability injury at the
      blood-brain barrier.
  - target: Vomiting
    description: >-
      Acute meningeal inflammation produces vomiting.
  - target: Poor feeding
    description: >-
      Acute meningeal illness produces poor feeding in infants.
  - target: Lethargy
    description: >-
      Meningeal inflammation produces lethargy.
  - target: Seizure
    description: >-
      Cortical irritation from meningeal inflammation produces seizures.
  - target: Subdural effusion
    description: >-
      Meningeal inflammation can produce a subdural effusion.
  evidence:
  - reference: PMID:2794062
    reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF activity was first detected 45 min after intracisternal (IC) injection
      of 20 ng Hib LOS and white blood cells (WBC) first appeared 75 min later.
    explanation: >-
      The same rabbit model places the white-blood-cell influx 75 min after LOS,
      the neutrophilic inflammation this node represents.
- name: Blood-Brain Barrier Breakdown
  description: >-
    H. influenzae type b hematogenous meningitis increases blood-brain-barrier
    permeability, allowing serum proteins and inflammatory mediators to enter
    cerebrospinal fluid and drive edema-producing CNS injury.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Sensorineural hearing impairment
    description: >-
      Inflammatory injury to the cochlear nerve produces sensorineural hearing
      loss.
  - target: Hydrocephalus
    description: >-
      Barrier breakdown and impaired CSF dynamics produce hydrocephalus.
  - target: Motor deficit
    description: >-
      Cortical and subcortical injury produces focal motor deficits.
  - target: Developmental delay
    description: >-
      Neonatal and infant brain injury produces neurodevelopmental delay as a
      long-term sequela.
  evidence:
  - reference: PMID:9184127
    reference_title: Blood-brain barrier permeability during the development of experimental bacterial meningitis in the rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the model of hematogenous meningitis, the mean CSF penetration was
      significantly greater in animals with H. influenzae type b meningitis than
      in those with meningitis due to K1 E. coli or type III group B
      streptococcus.
    explanation: >-
      Supports blood-brain-barrier permeability as a downstream tissue injury in
      hematogenous Hib meningitis.
phenotypes:
- name: Fever
  description: Fever is a common presenting sign in pediatric bacterial meningitis cohorts dominated by H. influenzae.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:9570646
    reference_title: Childhood bacterial meningitis in Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presenting symptoms in decreasing order of frequency were fever 86%,
      vomiting 29%, poor feeding 19%, seizure 14% and lethargy 14%.
    explanation: >-
      Fever was the most common presenting symptom in a pediatric bacterial
      meningitis cohort in which H. influenzae caused 66% of cases.

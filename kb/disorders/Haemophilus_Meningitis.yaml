progression:
- phase: Nasopharyngeal colonization
  notes: H. influenzae colonizes the upper respiratory tract, usually asymptomatically.
- phase: Invasive bacteremia
  notes: The organism breaches the mucosa and establishes high-grade bacteremia.
- phase: Meningitis
  notes: >-
    Bloodborne organisms seed the meninges, producing acute bacterial meningitis
    with fever, vomiting, lethargy and seizures.
- phase: Neurological sequelae
  notes: >-
    Survivors may develop hearing loss, hydrocephalus, motor deficits and
    developmental delay.
animal_models:
- name: Infant rat hematogenous Hib meningitis
  species: Rat
  publication: PMID:9184127
  description: >-
    Infant rats develop hematogenous H. influenzae type b meningitis with
    measurable blood-brain-barrier permeability after peripheral inoculation.
  modeled_mechanisms:
  - target: Blood-Brain Barrier Breakdown
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The infant-rat hematogenous model measures albumin leakage into
      cerebrospinal fluid during H. influenzae type b meningitis.
    limitations: >-
      The model uses infant rats and experimentally delivered bacteria, so it
      does not recapitulate natural human nasopharyngeal acquisition.
    evidence:
    - reference: PMID:9184127
      reference_title: Blood-brain barrier permeability during the development of experimental bacterial meningitis in the rat.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the model of hematogenous meningitis, the mean CSF penetration was
        significantly greater in animals with H. influenzae type b meningitis
        than in those with meningitis due to K1 E. coli or type III group B
        streptococcus.
      explanation: >-
        Directly supports the infant rat as a hematogenous Hib meningitis model
        with quantifiable blood-brain-barrier permeability.
    - reference: PMID:10470555
      reference_title: Models of experimental bacterial meningitis. Role and limitations.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        because adult animals will not reliably develop meningitis after
        intranasal or intraperitoneal challenge, infant animals are used.
      explanation: >-
        Review synthesis explains the age limitation that motivates infant
        animals in hematogenous experimental meningitis models.

name: Arterial Dissection-Lentiginosis Syndrome
creation_date: "2026-05-05T15:37:54Z"
description: >-
  Arterial dissection-lentiginosis syndrome is an ultra-rare familial
  association syndrome reported in several members of two families. It is
  characterized by arterial dissection at an early age, multiple brown or
  black lentigines on the trunk and extremities, and cystic medial necrosis of
  affected arteries. Clinical manifestations vary with the arterial territory
  involved and can include headache, dysphasia, and hemiparesis. The mode of
  inheritance and causal gene remain unknown. A shared neural-crest or
  mesenchymal developmental defect has been proposed, but it is not an
  established mechanism.

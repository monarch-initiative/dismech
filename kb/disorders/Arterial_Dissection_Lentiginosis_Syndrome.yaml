    A neurocristopathy-like developmental defect has been proposed to connect
    the vascular and pigmentary components. Available evidence is indirect and
    comes from a review of familial lentiginosis syndromes rather than an
    ADL-specific molecular or experimental study.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell

differential_diagnoses:
- name: Vascular Ehlers-Danlos syndrome
  description: >-
    Vascular Ehlers-Danlos syndrome can cause early arterial rupture or
    dissection and therefore overlaps with the vascular presentation.
  distinguishing_features:
  - Pathogenic COL3A1 variants or abnormal type III procollagen support vascular Ehlers-Danlos syndrome.
  - Thin translucent skin, easy bruising, characteristic facial appearance, and intestinal or uterine rupture favor vascular Ehlers-Danlos syndrome rather than ADL.
  - Multiple lentigines are defining for ADL but are not a defining vascular Ehlers-Danlos feature.
  evidence:
  - reference: PMID:28607545
    reference_title: The Genetics of Aortopathies in Clinical Cardiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of vEDS, as per revised nosology of Villefranche,
      requires the presence of 2 of the following: (1) thin, translucent skin;
      (2) arterial, intestinal, or uterine rupture; (3) easy bruising
    explanation: The review provides vascular and extra-vascular features that distinguish vEDS from ADL.
- name: Loeys-Dietz syndrome
  description: Loeys-Dietz syndrome is a syndromic arteriopathy with early, widespread aneurysm and dissection risk.
  distinguishing_features:
  - A pathogenic variant in an established Loeys-Dietz pathway gene supports the diagnosis.
  - Bifid uvula or cleft palate, hypertelorism, craniosynostosis, and arterial tortuosity favor Loeys-Dietz syndrome.
  - Multiple lentigines and cystic medial necrosis as the named association favor ADL.
  evidence:
  - reference: PMID:28607545
    reference_title: The Genetics of Aortopathies in Clinical Cardiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loeys-Dietz syndrome type 1 is associated with craniofacial defects
      (bifid uvula, cleft palate, orbital hypertelorism, and craniosynostosis)
    explanation: The review describes discriminating craniofacial and molecular features of Loeys-Dietz syndrome.
- name: Noonan syndrome with multiple lentigines
  description: >-
    Noonan syndrome with multiple lentigines overlaps through childhood-onset
    lentigines and cardiovascular disease but has a distinct RASopathy phenotype.
  distinguishing_features:
  - Hypertrophic cardiomyopathy, characteristic facial features, conduction abnormalities, short stature, or deafness favor Noonan syndrome with multiple lentigines.
  - PTPN11 or another established RASopathy-gene variant supports the alternative diagnosis.
  - Early arterial dissection with cystic medial necrosis favors ADL.
  evidence:
  - reference: PMID:16523510
    reference_title: "LEOPARD syndrome: clinical diagnosis in the first year of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LEOPARD syndrome (LS) is an autosomal dominant syndrome characterized by
      multiple lentigines and café-au-lait spots, electrocardiographic-conduction
      abnormalities, ocular hypertelorism/obstructive cardiomyopathy
    explanation: The clinical series identifies pigmentary and cardiac features that distinguish this RASopathy from ADL.
- name: Peutz-Jeghers syndrome
  description: Peutz-Jeghers syndrome is a hereditary lentiginosis and multiple-neoplasia syndrome that can mimic the pigmentary component.
  distinguishing_features:
  - Mucocutaneous pigmentation, hamartomatous gastrointestinal polyps, and an STK11 pathogenic variant favor Peutz-Jeghers syndrome.
  - Early arterial dissection and cystic medial necrosis favor ADL.
  evidence:
  - reference: DOI:10.1159/000053283
    reference_title: Genetics of Peutz-Jeghers Syndrome, Carney Complex and Other Familial Lentiginoses
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are the two most common multiple neoplasia syndromes associated with
      lentiginosis.
    explanation: The review establishes PJS as a major neoplasia-associated lentiginosis and identifies STK11 as its causal gene.
- name: Carney complex
  description: Carney complex is a hereditary lentiginosis and multiple-neoplasia syndrome that can mimic the pigmentary component.
  distinguishing_features:
  - Myxomas, endocrine overactivity or tumors, and a PRKAR1A pathogenic variant favor Carney complex.
  - Early arterial dissection with cystic medial necrosis favors ADL.
  evidence:
  - reference: DOI:10.1159/000053283
    reference_title: Genetics of Peutz-Jeghers Syndrome, Carney Complex and Other Familial Lentiginoses
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are the two most common multiple neoplasia syndromes associated with
      lentiginosis.
    explanation: The review establishes Carney complex as a major neoplasia-associated lentiginosis and describes its protein-kinase-A regulatory-subunit defect.
treatments:
- name: Individualized antithrombotic therapy for cervical artery dissection
  action_category: THERAPEUTIC
  description: >-
    When ADL manifests as cervical artery dissection, antiplatelet or
    anticoagulant therapy may be considered using general cervical-dissection
    practice. Evidence does not establish a single preferred strategy, and
    ischemic benefit must be balanced against bleeding risk. This is
    territory-specific supportive management, not an ADL-specific or
    disease-modifying treatment.
  target_phenotypes:
  - preferred_term: Arterial dissection
    term:
      id: HP:0005294
      label: Arterial dissection
  evidence:
  - reference: PMID:38739383
    reference_title: "Antithrombotic Treatment for Cervical Artery Dissection: A Systematic Review and Individual Patient Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      found no significant difference between anticoagulants and antiplatelets
      in preventing early recurrent events
    explanation: Randomized-trial patient-level evidence does not establish superiority for the composite outcome.
  - reference: PMID:38847098
    reference_title: "Anticoagulation Versus Antiplatelets in Spontaneous Cervical Artery Dissection: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This argues for an individualized therapeutic approach incorporating the
      net clinical benefit of ischemic stroke reduction and bleeding risks.
    explanation: The broader meta-analysis supports individualized selection because anticoagulation reduced ischemic stroke but increased major bleeding.
  notes: >-
    No syndrome-specific treatment trial, prophylactic regimen, or surveillance
    interval was identified. Aortic, intracranial, and visceral dissections
    require urgent management according to their own vascular territory and are
    not covered by the cervical-dissection antithrombotic evidence above.
review_notes: >-
  Reviewed against Orphadata records dated 2026-06-23 and the locally cached
  literature. Current Orphanet data explicitly classify inheritance as unknown;
  autosomal recessive inheritance is therefore not asserted. No causal gene or
  ADL-specific molecular test was identified, so the former placeholder
  "Unknown causal gene" genetic record was removed rather than modeled as a
  negative gene association. The original report cache (PMID:7838191) contains
  title and MEDLINE metadata but no abstract or full text; aortic dissection and
  intracranial aneurysm are consequently not promoted to curated phenotypes.
  The neural-crest/mesenchymal and melanocyte model remains HYPOTHETICAL, while
  cystic medial degeneration is modeled as a PROVISIONAL causal substrate despite
  its established clinical association. The 2016 Orphadata HPO export also lists
  melanocytic nevus and arteriovenous malformation; neither was promoted because
  those mappings are not corroborated by the current definition or accessible
  primary text; they remain source leads rather than curated phenotype records.
  Imaging and antithrombotic entries are explicitly extrapolated
  from general cervical arterial-dissection evidence; there are no validated
  ADL-specific diagnostic criteria, surveillance schedule, or disease-modifying
  treatment data.

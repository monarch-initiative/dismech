  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  evidence:
  - reference: DOI:10.1046/j.1365-2796.1998.00341.x
    reference_title: "Carney complex and the familial lentiginosis syndromes: link to inherited neoplasias and developmental disorders, and genetic loci"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are involved in the function, growth and proliferation of neural crest
      and mesenchymal cells
    explanation: The review supplies biological plausibility across familial lentiginoses but does not establish this mechanism in ADL.
  downstream:

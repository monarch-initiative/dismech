animal_models:
- name: Khk knockout mouse (Miller 2018)
  species: Mouse
  genotype: Khk-/- (both KHK isoforms ablated)
  publication: PMID:29870677
  description: >-
    A constitutive Khk knockout characterized with an oral [6-13C] fructose
    tracer. The authors propose it as a model for essential fructosuria; on a
    standard chow diet the mice show no metabolic abnormality.
  modeled_mechanisms:
  - target: Accumulation of Unmetabolized Fructose in the Circulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the elevated plasma and urinary fructose and the reduced
      conversion of fructose to glucose and lactate after an oral load.
    limitations: >-
      The knockout removes both KHK-C and KHK-A, whereas recombinant-enzyme
      data suggest that at least one human genotype spares KHK-A. Mouse
      fructose handling, including intestinal fructose metabolism, may differ
      from human.
    readouts:
    - name: Plasma and urinary 13C-fructose after oral fructose
      target: Accumulation of Unmetabolized Fructose in the Circulation
      direction: INCREASED
      interpretation: The knockout leaves ingested fructose unmetabolized in plasma and urine.
      evidence:
      - reference: PMID:29870677
        reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Significantly elevated urine and plasma 13C-fructose levels were observed in Khk KO vs. wild-type (WT) control mice, as was reduced conversion of 13C-fructose into plasma 13C-glucose and 13C-lactate."
        explanation: Measured plasma and urine fructose in knockout and wild-type mice.
    evidence:
    - reference: PMID:29870677
      reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, these results suggest that Khk KO mice may serve as a good model for essential fructosuria in humans"
      explanation: The authors propose the knockout as a model of the human disorder.
  - target: Extrahepatic Hexokinase-Mediated Fructose Phosphorylation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: >-
      Shows fructose 6-phosphate in skeletal muscle of knockout but not
      wild-type mice, consistent with hexokinase disposal of fructose.
    limitations: >-
      Fructose 6-phosphate in muscle is a correlate; hexokinase flux was not
      measured directly, and the corresponding human measurement has not been
      reported.
    readouts:
    - name: Skeletal muscle fructose 6-phosphate
      target: Extrahepatic Hexokinase-Mediated Fructose Phosphorylation
      direction: INCREASED
      interpretation: Fructose 6-phosphate appears in muscle only when KHK is absent.
      evidence:
      - reference: PMID:29870677
        reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, the observation of significant levels of fructose-6-phosphate in skeletal muscle tissue of Khk KO, but not WT, mice suggests a potential mechanism, whereby fructose is metabolized via muscle hexokinase in the absence of KHK."
        explanation: Measured muscle fructose 6-phosphate in knockout versus wild-type mice.
- name: KHK knockout mouse on fructose diets (Patel 2015)
  species: Mouse
  genotype: KHK-/-
  publication: PMID:26316589
  description: >-
    KHK-/- mice fed 20 or 40 percent fructose diets, with portal and systemic
    blood fructose measured by HPLC. The authors state that the findings
    explain the hyperfructosemia of human essential fructosuria.
  modeled_mechanisms:
  - target: Accumulation of Unmetabolized Fructose in the Circulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      KHK deletion converts dietary fructose into marked hyperfructosemia
      without fructose-induced hyperglycemia.
    limitations: >-
      Measured under sustained high-fructose feeding in mice rather than a
      single oral load, and the knockout removes both KHK isoforms.
    readouts:
    - name: Systemic blood fructose on a fructose diet
      target: Accumulation of Unmetabolized Fructose in the Circulation
      direction: INCREASED
      interpretation: Without KHK, dietary fructose accumulates in the circulation.
      evidence:
      - reference: PMID:26316589
        reference_title: "Effect of dietary fructose on portal and systemic serum fructose levels in rats and in KHK-/- and GLUT5-/- mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Deletion of KHK prevented fructose-induced hyperglycemia, but caused dramatic hyperfructosemia (>1 mM) with reversed portal to systemic gradients."
        explanation: Measured blood fructose and glucose in KHK-/- versus wild-type mice.
    evidence:
    - reference: PMID:26316589
      reference_title: "Effect of dietary fructose on portal and systemic serum fructose levels in rats and in KHK-/- and GLUT5-/- mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings explain the hyperfructosemia of human hereditary fructosuria as well as the hyperglycemia of fructose-induced metabolic syndrome."
      explanation: The authors relate the knockout phenotype to the human disorder.
- name: Khk isoform-selective and complete knockout mice (Diggle 2010)
  species: Mouse
  genotype: Khk(delta/delta) (both isoforms) and Khk(3a/3a) (KHK-A only)
  publication: PMID:20841500
  description: >-
    Two targeted alleles, one ablating both KHK isoforms and one ablating only
    the minor KHK-A isoform. Both homozygous lines are healthy and fertile, so
    neither isoform is needed for normal growth and development, consistent
    with the benign human phenotype.
  modeled_mechanisms:
  - target: Hepatic Ketohexokinase-C Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The complete knockout removes hepatic KHK, and the mice have only minimal
      biochemical abnormalities on a basal diet.
    limitations: >-
      The complete knockout also removes KHK-A, which the human
      Ala43Thr-containing genotype may spare. Fructose challenge readouts are
      not reported in the abstract.
    evidence:
    - reference: PMID:20841500
      reference_title: "Both isoforms of ketohexokinase are dispensable for normal growth and development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both Khk(3a/3a) and Khk(Δ/Δ) homozygous mice were healthy and fertile and displayed minimal biochemical abnormalities under basal dietary conditions."
      explanation: Absence of KHK is compatible with health in the mouse, as in the human disorder.
computational_models:
- name: Whole-body fructose metabolism model of essential fructosuria (Allen and Musante 2018)
  description: >-
    A mathematical model of oral and intravenous fructose disposition,
    calibrated to healthy subjects and then adapted to reproduce published
    essential fructosuria data. To fit those data the model needed
    adaptations beyond hepatic KHK loss: altered portal absorption, slower
    peripheral metabolism, near-absent renal fructose reabsorption, and
    upregulated alternative hepatic pathways. These are model predictions, not
    measurements.
  model_type: PHYSIOLOGICAL
  publication: PMID:29664676
  modeled_mechanisms:
  - target: Renal Excretion of Unmetabolized Fructose
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Reproduces urinary fructose loss in essential fructosuria and predicts
      that renal fructose reabsorption is mostly abolished.
    limitations: >-
      Calibrated to small, historical essential fructosuria datasets; the
      predicted adaptations have not been tested experimentally.
    divergences:
    - divergence_type: CALIBRATION_PROVENANCE
      materiality: QUALIFYING
      description: >-
        The parameters for the fructosuria state were fitted to the few
        published fructose-load studies in affected people, so the predicted
        loss of renal reabsorption is constrained only by those data.
    evidence:
    - reference: PMID:29664676
      reference_title: "A mathematical analysis of adaptations to the metabolic fate of fructose in essential fructosuria subjects."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Specifically, we predict that fructose absorption into the portal vein is altered, peripheral metabolism is slowed, renal reabsorption of fructose is mostly ablated, and alternate pathways for hepatic metabolism of fructose are upregulated."
      explanation: The model's predictions for how the fructosuria state differs from normal.
discussions:
- discussion_id: khk_a_preservation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Hepatic Ketohexokinase-C Deficiency
  - genetic#KHK
  prompt: >-
    Is essential fructosuria a hepatic-selective KHK-C deficiency with KHK-A
    preserved, and does it matter whether KHK-A is lost too?
  rationale: >-
    The only molecularly characterized family is compound heterozygous for a
    null allele and a thermolabile allele that, in recombinant enzyme, loses
    KHK-C activity at body temperature while KHK-A survives. Whether patients
    really retain peripheral KHK-A, and whether a genotype that removes both
    isoforms would still be benign, has not been examined in humans. Mouse
    knockouts lacking both isoforms are healthy, but mouse and human fructose
    handling are not interchangeable.
  evidence:
  - reference: PMID:12941785
    reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further mutation analysis in this rare disorder could illuminate the question of whether ketohexokinase-A activity is, unlike that of ketohexokinase-C, physiologically indispensable."
    explanation: The authors pose the question explicitly.
- discussion_id: long_term_outcome
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Essential Fructosuria
  prompt: >-
    Does lifelong KHK deficiency carry any long-term cardiometabolic
    consequence in humans?
  rationale: >-
    Essential fructosuria is regarded as benign mostly from case reports and
    one family. A UK Biobank study found no participant with the known disease
    genotype, so it could not test long-term outcomes in affected people. This
    matters beyond the disease itself because KHK inhibition is proposed as a
    treatment for fatty liver disease on the premise that KHK loss is
    harmless.
  evidence:
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No participants with the compound heterozygous genotype present in subjects exhibiting the EF phenotype in the literature (Gly40Arg/Ala43Thr) were identified."
    explanation: The largest population study could not assess affected genotypes.
  - reference: PMID:29870677
    reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "inhibition of KHK offers the potential to protect from diet-induced hepatic steatosis and insulin resistance."
    explanation: States the therapeutic premise that draws on essential fructosuria being benign.
notes: >-
  Scope: this entry covers inherited ketohexokinase deficiency only.
  Pharmacological KHK inhibitors under development for fatty liver disease and
  type 2 diabetes are not treatments for this disorder and are not curated
  here. No GeneReviews chapter exists for essential fructosuria in the
  Bookshelf index (snapshot 2026-09-10) or in a live PubMed title search.
  Laron's 1961 paper "Essential benign fructosuria" (PMID:13759156) is the
  classic clinical description, but no quotable text was retrieved for it from
  PubMed, so it is not cited as evidence.

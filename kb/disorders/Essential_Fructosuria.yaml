      snippet: "Affected persons are usually discovered on routine urinalysis by the presence of reducing sugars with a negative reaction with glucose oxidase."
      explanation: Urinary fructose is detected as a reducing sugar that is not glucose.
- name: Extrahepatic Hexokinase-Mediated Fructose Phosphorylation
  description: >-
    The fructose that is neither metabolized in liver nor excreted is
    phosphorylated at C6 by hexokinase in skeletal muscle and adipose tissue,
    entering glycolysis as fructose 6-phosphate. This route is slow, which is
    consistent with the slow clearance of blood fructose. It is an alternative
    pathway rather than a disease mechanism, and no clinical consequence of it
    is known.
  biological_scale: CELLULAR
  role: alternative metabolic route
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  molecular_functions:
  - preferred_term: hexokinase activity
    term:
      id: GO:0004396
      label: hexokinase activity
  chemical_entities:
  - preferred_term: fructose 6-phosphate
    term:
      id: CHEBI:88003
      label: fructose 6-phosphate
    modifier: INCREASED
  evidence:
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ingested fructose is partly excreted unchanged in the urine and the rest is metabolised by an alternative pathway, namely, conversion to fructose-6-phosphate by hexokinase in adipose tissue and muscle"
    explanation: Names hexokinase in muscle and adipose tissue as the alternative route.
  - reference: PMID:29870677
    reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, the observation of significant levels of fructose-6-phosphate in skeletal muscle tissue of Khk KO, but not WT, mice suggests a potential mechanism, whereby fructose is metabolized via muscle hexokinase in the absence of KHK."
    explanation: Khk knockout mice accumulate fructose 6-phosphate in skeletal muscle, consistent with hexokinase-mediated disposal.
phenotypes:
- name: Fructosuria
  category: Metabolic
  description: >-
    Fructose appears in the urine after intake of fructose, sucrose or
    sorbitol. It is intermittent, follows dietary intake, and is the only
    consistent manifestation of the disorder.
  phenotype_term:
    preferred_term: Fructosuria
    term:
      id: HP:6000804
      label: Elevated urine fructose level
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Essential fructosuria (EF) is a benign, asymptomatic, autosomal recessive condition caused by loss-of-function variants in the ketohexokinase gene and characterized by intermittent appearance of fructose in the urine."
    explanation: Fructosuria, intermittent, is the defining feature.
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0031979 | Abnormal urine carbohydrate level | Very frequent (99-80%)"
    explanation: >-
      Orphanet annotates the parent term, abnormal urine carbohydrate level, as
      very frequent. Urinary fructose is the urine carbohydrate abnormality in
      this disease, and this row is the source of the frequency band.
- name: Non-glucose reducing substance in urine
  category: Metabolic
  diagnostic: true
  description: >-
    Routine urinalysis shows a reducing sugar with a negative glucose-oxidase
    reaction. This is how most cases are found, and it is the finding that can
    be misread as diabetic glycosuria.
  phenotype_term:
    preferred_term: Non-glucose reducing substance in urine
    term:
      id: HP:6000389
      label: Non-glucose reducing substance in urine
  evidence:
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Affected persons are usually discovered on routine urinalysis by the presence of reducing sugars with a negative reaction with glucose oxidase."
    explanation: Describes the urinalysis finding through which cases are ascertained.
- name: Impairment of fructose metabolism
  category: Metabolic
  description: >-
    Abnormal handling of a fructose load: blood fructose rises far above
    control levels and declines slowly, with increased urinary loss.
  phenotype_term:
    preferred_term: Impaired fructose tolerance
    term:
      id: HP:0011033
      label: Impairment of fructose metabolism
  frequency: OBLIGATE
  evidence:
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0011033 | Impairment of fructose metabolism | Obligate (100%)"
    explanation: Orphanet annotates impaired fructose metabolism as obligate.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "After an oral or IV load of fructose (1 g/kg body weight), blood fructose increases rapidly, far the level seen in controls and declines slowly."
    explanation: Describes the abnormal fructose-load response.
- name: Increased erythrocyte fructose 3-phosphate
  category: Metabolic
  description: >-
    Erythrocyte fructose 3-phosphate is 3 to 15 times the control
    concentration in affected adults, with a smaller rise in sorbitol
    3-phosphate. Red-cell formation of fructose 3-phosphate is normal in vitro,
    HbA1 and HbA1c are normal, and neither cataract nor diabetes has been
    reported.
  phenotype_term:
    preferred_term: Increased erythrocyte fructose 3-phosphate
    term:
      id: HP:0034737
      label: Abnormal erythrocyte metabolite concentration
  evidence:
  - reference: PMID:1308858
    reference_title: "Essential fructosuria: increased levels of fructose 3-phosphate in erythrocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocytes of 3 adult siblings with essential fructosuria contained 45-200 mumol/l fructose 3-phosphate (Fru-3-P), i.e. 3-15 times the concentration in normal controls."
    explanation: Measured erythrocyte fructose 3-phosphate in three affected siblings.
  - reference: PMID:1308858
    reference_title: "Essential fructosuria: increased levels of fructose 3-phosphate in erythrocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HbA1 and HbA1c were normal."
    explanation: Glycated hemoglobin is unaffected despite the raised fructose 3-phosphate.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nevertheless, neither cataracts nor diabetes have been reported in subjects with essential fructosuria and is likely of a benign nature."
    explanation: >-
      The elevation has no reported clinical consequence, despite the earlier
      hypothesis that fructose 3-phosphate is diabetogenic.
diagnosis:
- name: Urinalysis for reducing substances
  description: >-
    A positive reducing-substance test with a negative glucose-oxidase strip
    prompts identification of the urinary sugar as fructose. Recognizing that
    the sugar is not glucose is what prevents a misdiagnosis of diabetes
    mellitus.
  diagnosis_term:
    preferred_term: Urinalysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Affected persons are usually discovered on routine urinalysis by the presence of reducing sugars with a negative reaction with glucose oxidase."
    explanation: Urinalysis is the usual route to diagnosis.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The misdiagnosis of diabetes is avoided only when the non-glucose nature of the sugar is recognized."
    explanation: Identifying the sugar is what separates the disorder from diabetes mellitus.
differential_diagnoses:
- name: Hereditary fructose intolerance
  description: >-
    Aldolase B (ALDOB) deficiency blocks the step after ketohexokinase, so
    fructose 1-phosphate accumulates and traps phosphate, causing
    hypoglycemia, vomiting and liver and kidney injury after fructose intake.
    Fructosuria can occur in both disorders, but only hereditary fructose
    intolerance is symptomatic and needs lifelong dietary restriction. See
    the Hereditary_Fructose_Intolerance entry.
  disease_term:
    preferred_term: hereditary fructose intolerance
    term:
      id: MONDO:0009249
      label: hereditary fructose intolerance
  evidence:
  - reference: PMID:30675358
    reference_title: "Fructosuria and recurrent hypoglycemia in a patient with a novel c.1693T>A variant in the 3' untranslated region of the aldolase B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeated measurements of urinary fructose revealed pathologic fructosuria, but genetic testing for the three most common mutations in ALDOB resulted negative."
    explanation: >-
      Fructosuria also occurs in hereditary fructose intolerance, here
      accompanied by hypoglycemia, so fructosuria alone does not distinguish
      the two.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "indicating that unmetabolized fructose is innocuous, while fast partial metabolism in the liver seems to be the genesis of fructose toxicity."
    explanation: >-
      States the mechanistic distinction: a block at the first step leaves
      fructose unmetabolized and harmless, while a block after fructose
      1-phosphate formation is toxic.
- name: Fructose-1,6-bisphosphatase deficiency
  description: >-
    The third inherited disorder of the fructose pathway. It is a defect of
    gluconeogenesis and, unlike essential fructosuria, is symptomatic. See the
    Fructose-1,6-Bisphosphatase_Deficiency entry.
  disease_term:
    preferred_term: fructose-1,6-bisphosphatase deficiency
    term:
      id: MONDO:0009251
      label: fructose-1,6-bisphosphatase deficiency
  evidence:
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Three inborn errors are known in the pathway of fructose metabolism; (1) essential or benign fructosuria due to fructokinase deficiency; (2) hereditary fructose intolerance; and (3) fructose-1,6-bisphosphatase deficiency."
    explanation: Places the three inherited fructose-pathway disorders side by side.
- name: Diabetes mellitus
  description: >-
    A positive urine sugar test is easily attributed to diabetic glycosuria.
    In essential fructosuria the glucose-oxidase reaction is negative and
    hyperglycemia is absent.
  disease_term:
    preferred_term: diabetes mellitus
    term:
      id: MONDO:0005015
      label: diabetes mellitus
  evidence:
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The misdiagnosis of diabetes is avoided only when the non-glucose nature of the sugar is recognized."
    explanation: Names diabetes as the misdiagnosis to avoid.
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0003074 | Hyperglycemia | Excluded (0%)"
    explanation: Orphanet records hyperglycemia as excluded in essential fructosuria.
- name: Renal tubular hexose reabsorption defect
  description: >-
    Fructosuria can also arise in the kidney, from a proximal tubular defect
    in hexose reabsorption. There fructosuria comes with glucosuria and
    galactosuria and without fructosemia, the reverse of essential
    fructosuria, in which blood fructose is high.
  evidence:
  - reference: PMID:40428357
    reference_title: "The Metabolic Consequences of Pathogenic Variant in FXYD2 Gene Encoding the Gamma Subunit of Sodium/Potassium-Transporting ATPase in Two Siblings with Sodium-Dependent Defect of Fructose, Galactose and Glucose Renal Reabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We examined two sisters, aged 6 and 8 years, who presented with hypercalciuria, glucosuria, fructosuria, galactosuria, and atypical proteinuria."
    explanation: Fructosuria together with glucosuria and galactosuria in a renal tubular disorder.
  - reference: PMID:40428357
    reference_title: "The Metabolic Consequences of Pathogenic Variant in FXYD2 Gene Encoding the Gamma Subunit of Sodium/Potassium-Transporting ATPase in Two Siblings with Sodium-Dependent Defect of Fructose, Galactose and Glucose Renal Reabsorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary diabetes, galactosemia, and fructosemia were excluded, suggesting a defect in cellular hexose transport in the proximal tubule."
    explanation: >-
      A renal cause of fructosuria is distinguished from a metabolic one by
      excluding fructosemia.

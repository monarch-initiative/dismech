name: Essential Fructosuria
creation_date: "2026-10-14T20:49:40Z"
category: Mendelian
synonyms:
- fructokinase deficiency
- ketohexokinase deficiency
- hepatic fructokinase deficiency
- benign fructosuria
description: >-
  Essential fructosuria is a rare, clinically benign autosomal recessive
  disorder of fructose metabolism caused by biallelic loss-of-function variants
  in KHK, which encodes ketohexokinase (fructokinase), the enzyme that
  phosphorylates dietary fructose to fructose 1-phosphate as the first step of
  hepatic fructose catabolism. Without hepatic phosphorylation, ingested
  fructose (free, or released from sucrose or sorbitol) escapes first-pass
  liver metabolism, so blood fructose rises higher and falls more slowly than
  normal after a fructose load, and part of it is excreted unchanged in the
  urine. The rest is phosphorylated slowly by hexokinase in muscle and adipose
  tissue. Because fructose 1-phosphate is never formed, there is none of the
  phosphate trapping and ATP depletion that make fructose toxic in hereditary
  fructose intolerance. The condition causes no symptoms and is usually found
  incidentally, when a reducing sugar that is not glucose is detected on
  urinalysis; its practical importance is avoiding a misdiagnosis of diabetes
  mellitus or of a harmful disorder of fructose metabolism. No treatment or
  dietary restriction is needed.

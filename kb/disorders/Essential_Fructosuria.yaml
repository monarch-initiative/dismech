  downstream:
  - target: Renal Excretion of Unmetabolized Fructose
    causal_link_type: DIRECT
    description: >-
      Fructose that remains in the blood is filtered and partly excreted
      unchanged in the urine.
    evidence:
    - reference: PMID:28368361
      reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The loss of fructose into the urine in this condition illustrates well the fact that fructose, having escaped hepatic metabolism, is poorly metabolized in extrahepatic tissues."
      explanation: Links urinary fructose loss to fructose escaping hepatic metabolism.
  - target: Extrahepatic Hexokinase-Mediated Fructose Phosphorylation
    causal_link_type: DIRECT
    description: >-
      Circulating fructose that is not excreted is taken up and phosphorylated
      to fructose 6-phosphate by hexokinase in muscle and adipose tissue.
    evidence:
    - reference: PMID:28368361
      reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ingested fructose is partly excreted unchanged in the urine and the rest is metabolised by an alternative pathway, namely, conversion to fructose-6-phosphate by hexokinase in adipose tissue and muscle"
      explanation: Describes the alternative extrahepatic route taken by the fructose that is not excreted.
  - target: Increased erythrocyte fructose 3-phosphate
    causal_link_type: DIRECT
    description: >-
      Erythrocytes exposed to more fructose form more fructose 3-phosphate; the
      red-cell formation rate itself is normal, so the increase follows from

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two deficient KHK alleles. In the one family
    characterized at the molecular level, three affected siblings were compound
    heterozygotes for p.Gly40Arg and p.Ala43Thr. Heterozygous carriers excrete
    no more fructose after an oral load than unaffected people.
  evidence:
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Essential fructosuria (EF) is a benign, asymptomatic, autosomal recessive condition caused by loss-of-function variants in the ketohexokinase gene and characterized by intermittent appearance of fructose in the urine."
    explanation: >-
      States autosomal recessive inheritance and the loss-of-function KHK
      mechanism. The sentence opens the abstract of a UK Biobank genotype study,
      so it restates the established picture rather than reporting a new
      finding.
  - reference: PMID:7833921
    reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a well-characterized family, in which three of eight siblings have fructosuria, all affected individuals are compound heterozygotes for two mutations Gly40Arg and Ala43Thr."
    explanation: >-
      Affected siblings carry two different KHK variants, one on each allele,
      the genotype expected under autosomal recessive inheritance.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Heterozygotes appear to excrete no more fructose after an oral load than normal subjects"
    explanation: >-
      Carriers of one deficient allele have no biochemical phenotype, which is
      consistent with recessive inheritance.
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Essential fructosuria is a rare autosomal recessive disorder of fructose metabolism caused by a deficiency of fructokinaseenzyme activity."
    explanation: >-
      The Orphanet definition records autosomal recessive inheritance. The
      run-together "fructokinaseenzyme" is Orphanet's own text.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.77
  notes: >-
    Published estimate of 1 in 130,000 (about 0.77 per 100,000), quoted by
    Johnston et al. 2021 from an earlier source; the measure type is not stated.
    The condition is asymptomatic and found only incidentally, so the figure is
    expected to underestimate true occurrence; Orphanet and the 2017 review by
    Tran record the prevalence as unknown.
  evidence:
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Its prevalence has been estimated to be 1:130,000 [2]."
    explanation: >-
      Source of the 1 in 130,000 estimate, cited by the authors from earlier
      work rather than measured in the UK Biobank cohort.
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, given that EF is asymptomatic, presumed benign, and does not require treatment, it may be more prevalent than reported."
    explanation: Explains why the published estimate is likely an undercount.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since the disorder is asymptomatic and harmless, many cases may remain undetected and the detected ones unpublished. Prevalence is, therefore, unknown."
    explanation: >-
      A review that declines to give a prevalence figure for the same reason,
      supporting the caveat on the numeric estimate.

    snippet: "Between 10% and 20% of the administered dose is excreted in the urine as compared with 1%-2% in normal subjects"
    explanation: Quantifies urinary fructose loss after a load relative to controls.
  downstream:
  - target: Fructosuria
    causal_link_type: DIRECT
    description: Fructose excreted unchanged appears in the urine.
    evidence:
    - reference: PMID:29664676
      reference_title: "A mathematical analysis of adaptations to the metabolic fate of fructose in essential fructosuria subjects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The only reported symptom of EF is the appearance of fructose in the urine following either oral or intravenous fructose administration."
      explanation: >-
        Urinary fructose after a fructose load is the defining finding. Quoted
        from the background of a modelling study.
  - target: Non-glucose reducing substance in urine
    causal_link_type: DIRECT
    description: >-
      Fructose is a reducing sugar, so urinary fructose gives a positive

- population: Published case reports to the 1960s, by ancestry
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Laron's survey of the literature in the 1960s found 50 published cases, 18
    of them in people of Jewish descent. This is an ascertainment count from
    historical case reports, not a population frequency.
  evidence:
  - reference: PMID:33621267
    reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Laron identified 50 published cases of EF and noted that 18 of those were of Jewish decent [3]"
    explanation: >-
      Reports the historical case count and its ancestry distribution as
      summarized from Laron's work. The misspelling "decent" is in the source.
genetic:
- name: KHK
  gene_term:
    preferred_term: KHK
    term:
      id: hgnc:6315
      label: KHK
  relationship_type: CAUSATIVE
  notes: >-
    KHK is alternatively spliced into KHK-C (exon 3c), the high-affinity
    isoform of liver, kidney and small intestine, and KHK-A (exon 3a), a
    low-affinity isoform expressed at low levels in other tissues. Only one
    family has been characterized at the molecular level (compound
    heterozygosity for p.Gly40Arg and p.Ala43Thr), so genotype-phenotype
    correlation beyond that family is undefined. No ClinGen gene-disease
    validity record for KHK is cached in references_cache.
  evidence:
  - reference: PMID:7833921
    reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct evidence that mutation of the KHK structural gene is the cause of essential fructosuria was also obtained."
    explanation: First molecular demonstration that KHK variants cause essential fructosuria.
  - reference: PMID:7833921
    reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alternative mRNA species and alternative KHK isozymes are produced by alternative polyadenylation and splicing of the KHK gene."
    explanation: Supports the existence of alternatively spliced KHK isoforms.
  - reference: PMID:9799106
    reference_title: "Structure and alternative splicing of the ketohexokinase gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tissues expressing high levels of KHK (liver, kidney and duodenum) utilise exclusively the 3c exon, while other tissues use only 3a."
    explanation: >-
      RNA analysis of human and rat tissues showing that the high-activity
      fructose-metabolizing tissues use exon 3c (KHK-C) and other tissues use
      exon 3a (KHK-A).
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KHK | ketohexokinase | hgnc:6315 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records KHK as the disease-causing gene.
  variants:
  - name: p.Gly40Arg
    description: >-
      Missense variant in a conserved region of KHK, found in trans with
      p.Ala43Thr in the affected siblings of the index family and absent from
      52 unrelated controls. Recombinant KHK-A and KHK-C carrying Gly40Arg are
      inactive and largely insoluble, so the allele behaves as a null.
    gene:
      preferred_term: KHK
      term:
        id: hgnc:6315
        label: KHK
    type: missense_variant
    evidence:
    - reference: PMID:7833921
      reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neither mutation was seen in a sample of 52 unrelated control individuals."
      explanation: Gly40Arg and Ala43Thr were absent from the control sample.
    - reference: PMID:12941785
      reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Gly40Arg mutation seems null, rendering both ketohexokinase-A and ketohexokinase-C inactive and largely insoluble."
      explanation: Recombinant-enzyme study showing Gly40Arg abolishes activity of both isoforms.
  - name: p.Ala43Thr
    description: >-
      Missense variant in the same conserved region, on the allele that also
      carries the common p.Val49Ile change in the index family. The mutant
      enzyme retains activity but is thermolabile; at physiological temperature
      KHK-C activity is substantially lost while KHK-A activity is not.
    gene:
      preferred_term: KHK
      term:
        id: hgnc:6315
        label: KHK
    type: missense_variant
    evidence:
    - reference: PMID:7833921
      reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An additional conservative amino acid change (Val49IIe) was present on the KHK allele bearing Ala43Thr."
      explanation: >-
        Places Val49Ile in cis with Ala43Thr in the index family. "Val49IIe" is
        the abstract's own spelling.
    - reference: PMID:12941785
      reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Ala43Thr mutant retains activity, but this mutation decreases the thermal stability of both ketohexokinase-A and ketohexokinase-C. At physiologic temperature, this results in significant loss of ketohexokinase-C activity but not of ketohexokinase-A."
      explanation: Recombinant-enzyme data defining Ala43Thr as a thermolabile, isoform-selective deficiency.
  - name: p.Val49Ile
    description: >-
      Common KHK missense variant (rs2304681), present on more than a third of
      chromosomes in UK Biobank participants. It does not produce fructosuria in
      the homozygous state and is not a disease allele on its own.
    gene:
      preferred_term: KHK
      term:
        id: hgnc:6315
        label: KHK
    type: missense_variant
    evidence:
    - reference: PMID:33621267
      reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The rs2304681:G>A (p.Val49Ile) variant was present on more than one-third (36.8%) of chromosomes; other variant alleles were rare (<1%)."
      explanation: Population frequency of Val49Ile in UK Biobank.
    - reference: PMID:33621267
      reference_title: "Prevalence and cardiometabolic correlates of ketohexokinase gene variants among UK Biobank participants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "In contrast, Val49Ile, another common variant in normal Europeans, does not produce fructosuria when present in homozygous state [1]."
      explanation: Homozygosity for Val49Ile alone does not cause the disease.
pathophysiology:
- name: Biallelic KHK Loss-of-Function Variants
  description: >-
    Both KHK alleles carry deficient variants. In the index family one allele is
    effectively null (p.Gly40Arg) and the other encodes a thermolabile enzyme
    (p.Ala43Thr).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KHK
    term:
      id: hgnc:6315
      label: KHK
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:7833921
    reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a well-characterized family, in which three of eight siblings have fructosuria, all affected individuals are compound heterozygotes for two mutations Gly40Arg and Ala43Thr."
    explanation: Establishes the biallelic KHK genotype in affected individuals.
  downstream:
  - target: Hepatic Ketohexokinase-C Deficiency
    causal_link_type: DIRECT
    description: >-
      The null and thermolabile alleles together leave too little active
      KHK-C, the hepatic isoform, at body temperature.
    evidence:
    - reference: PMID:12941785
      reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Affected individuals who carry both mutations therefore probably have a selective deficiency of hepatic ketohexokinase, with peripheral ketohexokinase-A being preserved."
      explanation: >-
        Infers from recombinant-enzyme properties that the compound
        heterozygous genotype produces hepatic KHK deficiency. The authors
        state it as probable rather than measured in patient tissue.
- name: Hepatic Ketohexokinase-C Deficiency
  description: >-
    Ketohexokinase activity, which phosphorylates fructose at C1 to fructose
    1-phosphate, is deficient in liver. KHK-C is the isoform expressed in
    hepatocytes and in the proximal renal tubule. Recombinant-enzyme data
    suggest that the low-affinity KHK-A isoform of other tissues may be spared
    in at least one genotype, so the deficiency may be hepatic-selective rather
    than complete.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KHK
    term:
      id: hgnc:6315
      label: KHK
  molecular_functions:
  - preferred_term: ketohexokinase activity
    term:
      id: GO:0004454
      label: ketohexokinase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:12941785
    reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hepatic ketohexokinase deficiency causes the benign disorder essential fructosuria."
    explanation: Identifies hepatic ketohexokinase deficiency as the disease lesion.
  - reference: PMID:12941785
    reference_title: "Properties of normal and mutant recombinant human ketohexokinases and implications for the pathogenesis of essential fructosuria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ketohexokinase-A has much poorer substrate affinity than ketohexokinase-C for fructose but is considerably more thermostable."
    explanation: >-
      KHK-C is the high-affinity fructose kinase, which is why its loss rather
      than that of KHK-A governs fructose clearance.
  - reference: PMID:19365088
    reference_title: "Ketohexokinase: expression and localization of the principal fructose-metabolizing enzyme."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The highly expressed KHK-C isoform localized to hepatocytes in the liver and to the straight segment of the proximal renal tubule."
    explanation: >-
      Localizes KHK-C to hepatocytes and proximal tubule in rodent tissue,
      including knockout controls. The human localization is inferred from the
      conserved splicing pattern, not shown here.
  downstream:
  - target: Failure of Hepatic Fructose Phosphorylation
    causal_link_type: DIRECT
    description: >-
      Without ketohexokinase, the liver cannot carry out the first step of
      fructose catabolism, so no fructose 1-phosphate is formed after a
      fructose load.
    evidence:
    - reference: PMID:7816517
      reference_title: "Changes of liver metabolite concentrations in adults with disorders of fructose metabolism after intravenous fructose by 31P magnetic resonance spectroscopy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the patient with essential fructosuria, the concentrations of F-1-P, ATP, and Pi remained unchanged, confirming that fructokinase was indeed inactive."
      explanation: >-
        In vivo liver 31P MRS after intravenous fructose shows no fructose
        1-phosphate formation, the direct consequence of absent hepatic
        fructokinase activity.
- name: Failure of Hepatic Fructose Phosphorylation
  description: >-
    Hepatocytes cannot convert fructose to fructose 1-phosphate, so the normal
    rapid first-pass hepatic uptake and catabolism of dietary fructose does not
    occur. Because fructose 1-phosphate does not accumulate, hepatic ATP and
    inorganic phosphate are not depleted after a fructose load, unlike the
    transient depletion in healthy people and the persistent depletion in
    hereditary fructose intolerance.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: fructose catabolic process
    term:
      id: GO:0006001
      label: fructose catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: fructose 1-phosphate
    term:
      id: CHEBI:78737
      label: fructose 1-phosphate
    modifier: DECREASED
  evidence:
  - reference: PMID:7833921
    reference_title: "Molecular basis of essential fructosuria: molecular cloning and mutational analysis of human ketohexokinase (fructokinase)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This enzyme catalyses the first step of metabolism of dietary fructose, conversion of fructose to fructose-1-phosphate."
    explanation: Defines the metabolic step that is lost.
  - reference: PMID:7816517
    reference_title: "Changes of liver metabolite concentrations in adults with disorders of fructose metabolism after intravenous fructose by 31P magnetic resonance spectroscopy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the three healthy controls after fructose (200 mg/kg, 20% solution, 2.5 min), the fructokinase-mediated increase of F-1-P was rapid, reaching 4.9 mmol/L within 3 min"
    explanation: >-
      The normal response that is absent in essential fructosuria: rapid
      hepatic fructose 1-phosphate formation after intravenous fructose.
  - reference: PMID:28368361
    reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "indicating that unmetabolized fructose is innocuous, while fast partial metabolism in the liver seems to be the genesis of fructose toxicity."
    explanation: >-
      Explains why loss of the first, rather than the second, enzymatic step is
      harmless: unphosphorylated fructose is not toxic.
  downstream:
  - target: Accumulation of Unmetabolized Fructose in the Circulation
    causal_link_type: DIRECT
    description: >-
      Fructose that escapes hepatic phosphorylation stays in the blood, so
      blood fructose rises higher and clears more slowly after a load.
    evidence:
    - reference: PMID:28368361
      reference_title: "Inborn Errors of Fructose Metabolism. What Can We Learn from Them?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "After an oral or IV load of fructose (1 g/kg body weight), blood fructose increases rapidly, far the level seen in controls and declines slowly."
      explanation: >-
        Describes the exaggerated and prolonged rise in blood fructose after a
        load. The missing word after "far" is in the source.
  - target: Impairment of fructose metabolism
    causal_link_type: DIRECT
    description: >-
      Loss of hepatic fructose phosphorylation is the impaired fructose
      metabolism that defines the disorder.
    evidence:
    - reference: ORPHA:2056
      reference_title: "Essential fructosuria"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It is characterized by elevated fructosemia and presence of fructosuria following ingestion of fructose and related sugars (sucrose, sorbitol)."
      explanation: >-
        Orphanet characterizes the disorder by fructose that is not metabolized
        normally after ingestion of fructose, sucrose or sorbitol.
- name: Accumulation of Unmetabolized Fructose in the Circulation
  description: >-
    After ingestion of fructose, sucrose or sorbitol, unphosphorylated fructose
    accumulates in the blood (hyperfructosemia) and is cleared slowly. The
    fructose load is distributed to the kidney and to extrahepatic tissues,
    which metabolize it poorly.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: fructose
    term:
      id: CHEBI:28757
      label: fructose
    modifier: INCREASED
  evidence:
  - reference: ORPHA:2056
    reference_title: "Essential fructosuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is characterized by elevated fructosemia and presence of fructosuria following ingestion of fructose and related sugars (sucrose, sorbitol)."
    explanation: Orphanet names elevated blood fructose after fructose-containing sugars.
  - reference: PMID:29870677
    reference_title: "Ketohexokinase knockout mice, a model for essential fructosuria, exhibit altered fructose metabolism and are protected from diet-induced metabolic defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary deficiency of ketohexokinase (KHK), the first enzymatic step in fructose metabolism, leads to essential fructosuria in humans, characterized by elevated levels of blood and urinary fructose following fructose ingestion but is otherwise clinically benign."
    explanation: >-
      Summarizes the human phenotype in the introduction of a mouse study, so
      it is graded as human clinical background rather than as the study's own

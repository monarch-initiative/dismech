discussions:
- discussion_id: hht_genetically_unexplained_suspected_disease
  prompt: >-
    What accounts for clinically suspected HHT in which no pathogenic variant is
    found in ENG, ACVRL1, SMAD4, or GDF2, and how should such patients be
    modeled relative to genotype-confirmed HHT?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired BMP/TGF-beta Signaling in Vascular Endothelium
  - pathophysiology#Vascular Shunting Through Visceral AVMs
  rationale: >-
    Molecular confirmation exceeds 90% among patients meeting three or more
    Curaçao criteria, but roughly 4-10% of clinically definite cases and up to
    15% of the broader tested population have no identifiable variant. Two
    non-exclusive explanations are on the table: lower pretest probability in
    patients who do not meet full clinical criteria, so that some negatives are
    true negatives; and pathogenic variants in as-yet-unidentified genes acting
    in the same BMP/TGF-beta pathway. The KB currently models HHT entirely
    through the four known genes, so a genotype-negative but phenotype-typical
    patient has no representation. Note that the HHT4 locus at 7p14, curated in
    the separate Hereditary_Hemorrhagic_Telangiectasia_4 entry, is a worked
    example of exactly such an unidentified-gene entity.
  evidence:
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this high diagnostic yield, approximately 4%-10% of patients with clinically definite disease remain without an identifiable mutation"
    explanation: Establishes that a residual fraction of clinically definite HHT is genetically unexplained.
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, emerging evidence suggests that a subset of genetically unexplained cases may be attributable to as-yet-unidentified genes involved in the HHT pathway"
    explanation: States the unidentified-gene hypothesis for genetically unexplained HHT.
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This reduction in yield is likely related to the lower pretest probability of true HHT in patients who do not meet full clinical criteria"
    explanation: Gives the competing explanation that lowered yield reflects pretest probability rather than missing genes.
  proposed_experiments:
  - experiment_id: exp_hht_genotype_negative_cohort_sequencing
    name: Genome sequencing of a genotype-negative suspected-HHT cohort
    description: >-
      Recruit patients meeting two or more Curaçao criteria whose ENG, ACVRL1,
      SMAD4, and GDF2 panel is negative, and apply exome or genome sequencing
      with structural-variant and non-coding analysis, stratifying probands by
      Curaçao score. Linkage or association at 7p14 would additionally test
      whether these patients share the HHT4 locus.
    decision_criterion: >-
      Stratification by Curaçao score discriminates the two explanations. A
      novel-gene explanation predicts that candidate variants concentrate in the
      clinically definite stratum and recur across unrelated probands; a
      pretest-probability explanation predicts no such enrichment and no
      recurrent locus.
    supporting_outcome:
    - >-
      Recurrent rare variants in one or more novel BMP/TGF-beta pathway genes,
      enriched in the clinically definite stratum relative to the possible
      stratum, supporting the unidentified-gene explanation for genetically
      unexplained HHT.
    refuting_outcome:
    - >-
      A flat distribution of private, non-recurrent variants with no enrichment
      in the clinically definite stratum, favoring lower pretest probability
      instead: many of these negatives would be true negatives rather than
      missed diagnoses.
  notes: >
    Raised from a single case report, which is adequate to record the open
    question but not to settle it.
- discussion_id: hht_large_artery_involvement_spectrum
  prompt: >-
    Do large-artery lesions such as aortic dissection and mesenteric arterial
    occlusion belong to the HHT phenotypic spectrum, or do they indicate a
    separate vasculopathy co-occurring with, or mimicking, HHT?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Vascular Shunting Through Visceral AVMs
  - phenotypes#Hepatic Arteriovenous Malformation
  rationale: >-
    HHT is modeled here as a disease of telangiectases and arteriovenous
    malformations, not of large conduit arteries. A reported patient with
    pulmonary and intrahepatic AVMs also had a chronic type B aortic dissection
    and occlusion of two proximal superior mesenteric artery branches, with
    negative HHT and connective-tissue-disorder panels including vascular
    Ehlers-Danlos syndrome. Whether such large-artery disease reflects an
    unrecognized arm of BMP/TGF-beta vascular dysplasia or an independent
    process is unresolved, and the KB deliberately does not curate aortic
    dissection or mesenteric arterial occlusion as HHT phenotypes on this
    evidence.
  evidence:
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This case is notable for the coexistence of extensive arterial anomalies, including chronic type B aortic dissection and large mesenteric arterial occlusions, features not typically associated with HHT"
    explanation: The authors themselves flag the large-artery findings as atypical for HHT, which is the open question rather than an established association.
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the absence of typical clinical features (e.g., thin, translucent skin, easy bruising, characteristic facial features, and small-joint hypermobility) and the negative genetic panel results argue against vEDS"
    explanation: Records the differential-diagnosis reasoning that excluded the leading alternative large-artery vasculopathy.
  notes: >
    Single-case evidence. This is recorded as an open question, not as a
    phenotype extension; one case cannot establish a disease-phenotype
    association, and the same patient had no molecular confirmation of HHT.

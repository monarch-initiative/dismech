    explanation: Identifies ischemic cholangiopathy and biloma as recognized hepatic AVM complications in HHT.
  - reference: PMID:42375883
    reference_title: "When Phenotype Outspeaks Genotype: Uncommon Vascular Anomalies in Suspected Hereditary Hemorrhagic Telangiectasia Despite Negative Genetic Testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI and MR cholangiopancreatography demonstrated mild intrahepatic biliary dilatation with beading and strictures, consistent with ischemic cholangiopathy, as well as a 6 cm biloma involving segments VII and VIII"
    explanation: Documents the imaging phenotype of ischemic cholangiopathy and biloma in the reported patient.
  notes: >
    No frequency is asserted. The supporting citation is a single case report
    that cites the hepatology literature for the mechanism; a cohort estimate of
    how often HHT liver vascular malformations progress to ischemic
    cholangiopathy is not curated here.

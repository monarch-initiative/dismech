- name: Mitochondrial dsRNA Release and Innate Immune Activation
  biological_scale: CELLULAR
  description: >-
    In patient fibroblasts, RNASEH1 mutations lead to accumulation and cytosolic release of
    mitochondrial double-stranded RNA and induction of interferon-stimulated genes, which a
    POLRMT inhibitor reduces. Paracrine signalling activated bystander microglia. This rests on
    a single preprint, and its contribution to the clinical disease, including the proposed link
    to neurological progression, is not shown.
  biological_processes:
  - preferred_term: cellular response to dsRNA
    modifier: INCREASED
    term:
      id: GO:0071359
      label: cellular response to dsRNA
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:42244575
    reference_title: "Mutations Causative of CPEO Differentially Engage Innate Immunity Sensors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Supporting this notion, the POLRMT inhibitor IMT-1, and the STING inhibitor H-151, reduced interferon stimulated genes expression downstream of RNASEH1 and Twinkle mutations, respectively."
    explanation: >-
      Interferon-stimulated gene induction downstream of RNASEH1 mutations, reversed by
      blocking mitochondrial transcription. Preprint; not peer reviewed.
animal_models:
- name: Rnaseh1 null mouse
  species: Mouse
  genotype: Rnaseh1-/- (constitutive knockout of the catalytic-domain exons)
  publication: PMID:12667461
  description: >-
    Constitutive Rnaseh1 knockout mice arrest at embryonic day 8.5 with reduced mtDNA content
    and apoptosis. This established RNase H1 as required for mtDNA generation, but a null
    embryonic lethal cannot model an adult-onset disease caused by hypomorphic or
    dysregulating alleles.
  modeled_mechanisms:
  - target: Stalled and Incomplete mtDNA Replication
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Loss of mtDNA content in vivo when RNase H1 is absent.
    limitations: >-
      A complete null that is lethal at E8.5 shows mtDNA depletion in embryos, not the multiple
      deletions in adult post-mitotic muscle that define the human disease, and human alleles
      are not nulls.
    evidence:
    - reference: PMID:12667461
      reference_title: "Failure to produce mitochondrial DNA results in embryonic lethality in Rnaseh1 null mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated Rnaseh1(-/-) mice to investigate the role of RNase H1 in mammals and observed developmental arrest at E8.5 in null embryos."
      explanation: Documents the lethal null phenotype that limits this model.
  evidence:
  - reference: PMID:12667461
    reference_title: "Failure to produce mitochondrial DNA results in embryonic lethality in Rnaseh1 null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A fraction of the mainly nuclear RNase H1 was targeted to mitochondria, and its absence in embryos resulted in a significant decrease in mitochondrial DNA content, leading to apoptotic cell death."
    explanation: Establishes the mtDNA consequence of RNase H1 loss in vivo.
- name: Heart-specific conditional Rnaseh1 knockout mouse
  species: Mouse
  genotype: Rnaseh1 conditional knockout in heart
  publication: PMID:35947649
  description: >-
    Tissue-specific deletion bypasses embryonic lethality and shows, in a post-mitotic tissue,
    unprocessed RNA:DNA hybrids at the origins, replication initiation at non-canonical sites,
    and linear deleted mtDNA molecules with depletion.
  modeled_mechanisms:
  - target: Impaired RNA Primer Processing at mtDNA Replication Origins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Unprocessed origin hybrids and non-canonical initiation in vivo.
    limitations: >-
      Heart rather than skeletal or extraocular muscle, and a complete tissue null rather than
      a patient allele; the phenotype of the mouse heart is not the clinical phenotype of the
      human disease.
    evidence:
    - reference: PMID:35947649
      reference_title: "Mammalian RNase H1 directs RNA primer formation for mtDNA replication initiation and is also necessary for mtDNA replication completion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Without RNase H1, the RNA:DNA hybrids at the replication origins are not processed and mtDNA replication is initiated at non-canonical sites and becomes impaired."
      explanation: The model's primary finding.
  - target: Stalled and Incomplete mtDNA Replication
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Failure of replication completion producing deleted molecules and depletion.
    limitations: >-
      The linear deleted molecules spanning the two origins are a specific product of this
      model and have not been shown to be the same species as the multiple deletions detected
      in patient muscle.
    evidence:
    - reference: PMID:35947649
      reference_title: "Mammalian RNase H1 directs RNA primer formation for mtDNA replication initiation and is also necessary for mtDNA replication completion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Importantly, RNase H1 is also needed for replication completion and in its absence linear deleted mtDNA molecules extending between the two origins of mtDNA replication are formed accompanied by mtDNA depletion."
      explanation: The replication-completion finding.
  evidence:
  - reference: PMID:35947649
    reference_title: "Mammalian RNase H1 directs RNA primer formation for mtDNA replication initiation and is also necessary for mtDNA replication completion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of RNase H1 is embryonic lethal and to further study its role in mtDNA expression we characterized a conditional knockout of Rnaseh1 in mouse heart."
    explanation: Describes the model and why a conditional design was needed.

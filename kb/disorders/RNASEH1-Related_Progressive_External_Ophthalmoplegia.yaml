- name: Stalled and Incomplete mtDNA Replication
  biological_scale: MOLECULAR
  description: >-
    mtDNA replication slows, replication intermediates accumulate, and replication fails to
    complete. Patient fibroblasts cannot restore mtDNA copy number after induced depletion. In
    the mouse, RNase H1 is required for replication completion; its absence produces linear
    deleted mtDNA molecules spanning the two origins together with mtDNA depletion.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264

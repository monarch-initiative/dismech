diagnosis:
- name: Muscle biopsy with mtDNA deletion analysis
  description: >-
    Muscle histochemistry shows ragged-red and COX-negative fibres, and molecular analysis of
    muscle mtDNA shows multiple deletions. These findings place the patient among the
    mtDNA-maintenance disorders but do not distinguish RNASEH1 from POLG, RRM2B or TWNK.
  evidence:
  - reference: PMID:35711919
    reference_title: "Case Report: Rare Homozygous RNASEH1 Mutations Associated With Adult-Onset Mitochondrial Encephalomyopathy and Multiple Mitochondrial DNA Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both cases, muscle biopsy revealed diffuse mitochondrial abnormalities and multiple mtDNA deletions."
    explanation: The biopsy findings that prompt nuclear gene testing.
- name: Nuclear gene sequencing for mtDNA maintenance genes
  description: >-
    Diagnosis is confirmed by biallelic RNASEH1 variants on targeted panel or exome sequencing.
    RNASEH1 should be included when POLG is negative, including in the ataxia neuropathy
    spectrum presentation.
  evidence:
  - reference: PMID:35711919
    reference_title: "Case Report: Rare Homozygous RNASEH1 Mutations Associated With Adult-Onset Mitochondrial Encephalomyopathy and Multiple Mitochondrial DNA Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, we recommend implementing the use of high-throughput sequencing approaches in the clinical setting to reach genetic diagnosis in case of suspected presentations with impaired mtDNA homeostasis."
    explanation: Recommendation for high-throughput sequencing in suspected mtDNA-maintenance disease.
  - reference: PMID:28508084
    reference_title: "Clinicopathologic and molecular spectrum of RNASEH1-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNASEH1 genetic analysis should also be considered in all patients with POLG-negative ataxia neuropathy spectrum."
    explanation: Extends testing to POLG-negative ataxia neuropathy spectrum.
differential_diagnoses:
- name: Other nuclear causes of adult PEO with multiple mtDNA deletions (POLG, RRM2B, TWNK)
  description: >-
    The more common genetic causes of the same muscle and ocular picture. They are separated by
    gene testing, not by clinical features.
  evidence:
  - reference: PMID:28508084
    reference_title: "Clinicopathologic and molecular spectrum of RNASEH1-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort, RNASEH1 mutations represent the fourth most common cause of adult mendelian PEO associated with multiple mtDNA deletions, following mutations in POLG, RRM2B, and TWNK."
    explanation: Names the principal genetic differentials.
discussions:
- discussion_id: rnaseh1_innate_immunity_relevance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does mitochondrial dsRNA release and innate immune activation contribute to the clinical
    disease, in particular to the progression from isolated PEO to cerebellar involvement?
  attaches_to:
  - pathophysiology#Mitochondrial dsRNA Release and Innate Immune Activation
  rationale: >-
    The only evidence is a 2026 preprint using patient fibroblasts, which also shows microglial
    activation by paracrine signalling and proposes relevance to neurological progression. No
    patient tissue, biomarker or clinical correlation is available, so the node is left without
    a downstream edge to any phenotype.
- discussion_id: rnaseh1_cerebellar_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does the mtDNA replication defect produce the cerebellar syndrome, and is the
    cerebellum affected by the same multiple-deletion mechanism as muscle?
  attaches_to:
  - pathophysiology#Cerebellar Dysfunction
  rationale: >-
    Cerebellar ataxia is present in over half of reported patients and cerebellar atrophy is
    described, but no cited study examines cerebellar tissue or neuronal mtDNA, so the edge into
    this node is drawn with unknown intermediates.
treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists. Management is supportive: ptosis surgery where
    indicated, assessment and management of dysphagia including enteral feeding when needed,
    physiotherapy for weakness and ataxia, and surveillance for bulbar involvement.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. No trial, cohort or case series of any intervention
    in RNASEH1-related disease was identified. The listed measures are standard for adult
    mitochondrial PEO and are inferred from the phenotype rather than cited for this disorder.
notes: >-
  GeneReviews: no RNASEH1-specific chapter exists in the Bookshelf index (checked with
  just check-genereviews). PMID:36813323 is a Handbook of Clinical Neurology review of PEO in
  general, cited only for class-level statements.

  Allelic mechanism: most RNASEH1 variants reduce hybrid-cleaving activity, but p.Tyr29Cys in
  the hybrid-binding domain increases it while impairing primer formation (PMID:35947649). The
  RNA-DNA hybrid ribonuclease activity binding on the first pathophysiology node is marked
  DECREASED because that is the majority finding; the node description records the exception.

  Mouse models: the constitutive Rnaseh1 null is embryonic lethal at E8.5 and the heart-specific
  conditional knockout is a complete tissue null. Neither carries a patient allele, and there
  is no model of the adult ocular and skeletal-muscle phenotype. Liver-specific knockouts
  (PMID:27131367) exist but address liver function and antisense-oligonucleotide activity
  rather than this disease, and are not included.

  The Mitochondrial dsRNA node rests on one preprint (PMID:42244575, bioRxiv) and should be
  revisited when a peer-reviewed version appears.

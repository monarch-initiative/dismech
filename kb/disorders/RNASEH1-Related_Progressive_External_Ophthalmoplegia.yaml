name: RNASEH1-Related Progressive External Ophthalmoplegia
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >-
  RNASEH1-related progressive external ophthalmoplegia (PEOB2) is an autosomal recessive
  mitochondrial DNA maintenance disorder caused by biallelic pathogenic variants in RNASEH1,
  which encodes ribonuclease H1. RNase H1 degrades the RNA strand of RNA:DNA hybrids and is
  present in both the nucleus and mitochondria; the nucleus has a second enzyme (RNase H2),
  mitochondria do not, so the disease is expressed as a mitochondrial one.

  In mtDNA replication RNase H1 processes the RNA primers laid down at the replication origins.
  Without it, primers are retained or mis-processed, replication initiates at non-canonical
  sites and slows, and deleted and depleted mtDNA accumulates. Patient fibroblasts carrying the
  recurrent p.Val142Ile variant also show enlarged, aggregated nucleoids, pointing to a defect
  in the physical segregation of mtDNA. In skeletal muscle the result is multiple mtDNA
  deletions with ragged-red and COX-negative fibres.

  Clinically the phenotype is homogeneous: onset in the twenties with chronic progressive
  external ophthalmoplegia, ptosis and exercise intolerance, followed by limb weakness,
  dysphagia and cerebellar signs (gait ataxia, dysmetria, dysarthria). In one UK-based cohort
  RNASEH1 was the fourth most common cause of adult Mendelian PEO with multiple mtDNA deletions,
  after POLG, RRM2B and TWNK. There is no disease-modifying treatment.
synonyms:
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 2
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive type 2
- progressive external ophthalmoplegia, autosomal recessive 2
- PEOB2
- RNASEH1 progressive external ophthalmoplegia with mitochondrial DNA deletions
- progressive external ophthalmoplegia with mitochondrial DNA deletions caused by mutation in RNASEH1
- RNASEH1-related mitochondrial disease

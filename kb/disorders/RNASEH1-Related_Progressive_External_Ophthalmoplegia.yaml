pathophysiology:
- name: Pathogenic RNASEH1 Variants Disrupt RNase H1 Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic RNASEH1 variants disrupt ribonuclease H1. For most alleles this is loss of
    function: RNase H1 protein is virtually absent from mutant fibroblasts, and the altered
    enzymes remove RNA from RNA:DNA hybrids less efficiently. One hybrid-binding-domain allele
    (p.Tyr29Cys) instead increases hybrid-cleaving activity while impairing primer formation, so
    the shared lesion is loss of correctly regulated RNase H1 function rather than uniformly
    reduced activity.

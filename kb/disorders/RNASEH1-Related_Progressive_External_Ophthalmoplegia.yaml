inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic RNASEH1 variants, homozygous or compound heterozygous. The founding report
    described compound heterozygotes in two singleton subjects and a homozygous variant in four
    affected siblings. The recurrent c.424G>A p.Val142Ile allele has been found homozygous in
    families of Indian and Italian ancestry; haplotype analysis in the Indian families favoured
    independent origins over a founder event.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26094573
    reference_title: "RNASEH1 Mutations Impair mtDNA Replication and Cause Adult-Onset Mitochondrial Encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation sequencing led to the identification of compound-heterozygous RNASEH1 mutations in two singleton subjects and a homozygous mutation in four siblings."
    explanation: >-
      Biallelic genotypes, including a homozygous variant segregating in an affected sibship,
      establish recessive inheritance.
  - reference: PMID:35711919
    reference_title: "Case Report: Rare Homozygous RNASEH1 Mutations Associated With Adult-Onset Mitochondrial Encephalomyopathy and Multiple Mitochondrial DNA Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A targeted next-generation sequencing analysis revealed the homozygous RNASEH1 mutations c.129-3C>G and c.424G>A in patients 1 and 2, respectively."
    explanation: Two further unrelated probands with homozygous RNASEH1 genotypes.
  - reference: PMID:28508084
    reference_title: "Clinicopathologic and molecular spectrum of RNASEH1-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the c.424G>A p.Val142Ile mutation underpins all reported RNASEH1-related mitochondrial disease, haplotype analysis suggested an independent origin, rather than a founder event, for the variant in our families."
    explanation: Supports the independent-origin statement for the recurrent allele.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. The cited reports describe roughly a dozen families: three
    in the founding report (PMID:26094573), three Indian-ancestry pedigrees (PMID:28508084), one
    Spanish patient (PMID:31258551), one Polish sibship (PMID:33396418), two Italian probands
    (PMID:35711919), and a Swedish patient and an Italian sibship studied in PMID:35947649. This
    tally is a count of cited families, not a quoted figure, and is the basis for the ULTRA_RARE
    class. Among 74 UK probands with multiple mtDNA deletions or Mendelian PEO, three pedigrees
    carried RNASEH1 variants.
  evidence:
  - reference: PMID:28508084
    reference_title: "Clinicopathologic and molecular spectrum of RNASEH1-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic c.424G>A p.Val142Ile RNASEH1 mutations were detected in 3 pedigrees among the 74 probands screened."
    explanation: >-
      The only screening-yield figure available: 3 of 74 probands in a cohort selected for
      mtDNA deletions or Mendelian PEO. It is a diagnostic-yield figure in an enriched cohort,
      not a population prevalence.
  - reference: PMID:33396418
    reference_title: "Progressive External Ophthalmoplegia in Polish Patients-From Clinical Evaluation to Genetic Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of nDNA genes revealed the presence of pathogenic or possibly pathogenic variants in the POLG gene in nine patients, the TWNK gene in five patients and the RNASEH1 gene in two patients."
    explanation: >-
      A second PEO cohort, from Poland, where RNASEH1 accounted for two patients (one sibship)
      against nine POLG and five TWNK.
genetic:
- name: RNASEH1
  notes: >-
    RNASEH1 (2p25.3) encodes ribonuclease H1, whose longer isoform carries a mitochondrial
    targeting sequence. Reported pathogenic variants include the recurrent catalytic-domain
    missense c.424G>A p.Val142Ile, c.487T>C, the in-frame c.258_260del in the connection domain,
    the splice variant c.129-3C>G (exon 2 skipping in muscle RNA), and c.86A>G p.Tyr29Cys in the
    hybrid-binding domain. Most tested variants reduce enzyme activity; p.Tyr29Cys is the
    documented exception, increasing hybrid-cleaving activity while impairing primer formation.
  gene_term:
    preferred_term: RNASEH1
    term:
      id: hgnc:18466
      label: RNASEH1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE

- name: Impaired RNA Primer Processing at mtDNA Replication Origins
  biological_scale: MOLECULAR
  description: >-
    Without functional RNase H1 the RNA:DNA hybrids at the mtDNA replication origins are not
    processed. In null mouse cells primers are retained in the non-coding region and at Ori-L
    and obstruct polymerase gamma in later rounds; in the conditional heart knockout replication
    initiates at non-canonical sites. The control-region R-loop is also depleted in cells with
    the pathogenic p.Val142Ile variant.
  biological_processes:

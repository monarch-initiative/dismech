  description: >-
    Several cases were detected through elevated BCAAs on newborn mass
    spectrometry screening or cascade testing; diagnosis is confirmed by
    biallelic BCAT2 variants after BCKDH-complex genes are excluded.
  evidence:
  - reference: PMID:30626930
    reference_title: "Value of genetic analysis for confirming inborn errors of metabolism detected through the Spanish neonatal screening program."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In five cases in which the biochemical pattern was persistently altered, further genetic analysis allowed the detection of two variants affecting the function of BCAT2, ACSF3, and DNAJC12, as well as a second, deep intronic variant in ETFDH or PTS."
    explanation: Newborn screening followed by genetic analysis identified biallelic BCAT2 variants.
  - reference: PMID:25653144
    reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maple syrup urine disease (MSUD) diagnosis was not supported since all genes for the branched-chain α-keto acid dehydrogenase complex (BCKD) gene were normal."
    explanation: Exclusion of BCKDH-complex genes preceded the BCAT2 diagnosis.

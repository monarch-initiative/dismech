treatments:
- name: Pyridoxine Supplementation
  description: >-
    High-dose pyridoxine (vitamin B6; e.g. 200 mg/day) supplies the
    pyridoxal 5'-phosphate cofactor of BCAT2 and lowered plasma BCAAs in all
    treated patients, but clinical improvement was seen in only about half.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  evidence:
  - reference: PMID:41623317
    reference_title: "Branched-chain amino acid transferase 2 (BCAT2) deficiency: A case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCAA levels decreased in all patients receiving pyridoxine supplementation; however, only 50% showed clinical improvement."
    explanation: Pooled response to pyridoxine across reported cases, biochemical more than clinical.
  - reference: PMID:40248769
    reference_title: "Branched-chain amino acid transferase type 2 (BCAT2) deficiency: Report of an eighth case and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After oral pyridoxine supplementation (200 mg/day), a decrease in BCAA concentrations was observed (valine = 984 μmol/L, leucine = 462 μmol/L, isoleucine = 302 μmol/L)."
    explanation: Biochemical response to pyridoxine in a single case.
  target_mechanisms:
  - target: Impaired Mitochondrial BCAA Transamination
    treatment_effect: RESTORES
    description: Cofactor supplementation is thought to boost residual BCAT2 transamination; plasma BCAAs fall on treatment.
    evidence:
    - reference: PMID:25653144
      reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "After treatment with vitamin B6, the levels of BCAA, especially valine were remarkably decreased and brain MRI lesions were improved."
      explanation: Biochemical response to the BCAT cofactor in a patient with missense variants implies partial restoration of transamination; the mechanism was not measured directly.
- name: Protein-Restricted Diet
  description: >-
    Dietary protein restriction lowers BCAA intake; plasma BCAAs appear
    responsive, and early treatment has been suggested to improve outcome,
    though evidence is limited to a few patients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: protein-restricted diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:31177572
    reference_title: "Expanding the genetic and phenotypic spectrum of branched-chain amino acid transferase 2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the biochemical characteristics of BCAT2 deficiency may be amenable to protein-restricted diet and that early treatment may improve outcome in affected individuals."
    explanation: Small-series observation that protein restriction lowers BCAAs; outcome benefit is tentative.
  target_mechanisms:
  - target: Systemic BCAA Accumulation Without Ketoacid Excess
    treatment_effect: INHIBITS
    description: Reducing dietary BCAA load lowers plasma BCAA concentrations.
animal_models:
- name: BCATm knockout mouse
  species: Mouse
  genotype: Bcat2 (BCATm) -/- targeted disruption
  publication: PMID:17767905
  description: >-
    Mitochondrial branched-chain aminotransferase knockout mice reproduce the
    biochemical hallmark of the human disorder (elevated plasma BCAAs) but show
    a lean, insulin-sensitive phenotype and exercise intolerance, not the
    neurological features variably reported in patients.
  modeled_mechanisms:
  - target: Systemic BCAA Accumulation Without Ketoacid Excess
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Loss of Bcat2 raises plasma BCAAs, as in patients.
    limitations: >-
      Mouse BCAA handling and diet differ from human; cerebral white matter
      and neurodevelopmental outcomes were not assessed in these reports, and
      the metabolic phenotype (improved insulin tolerance) diverges from the
      insulin resistance reported in one patient.
    evidence:
    - reference: PMID:17767905
      reference_title: "Disruption of BCATm in mice leads to increased energy expenditure associated with the activation of a futile protein turnover cycle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BCATm(-/-) mice exhibited elevated plasma BCAAs and decreased adiposity and body weight"
      explanation: Knockout recapitulates the BCAA elevation.
  evidence:
  - reference: PMID:20133434
    reference_title: "Disruption of BCAA metabolism in mice impairs exercise metabolism and endurance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that BCATm KO mice were exercise intolerant with markedly decreased endurance to exhaustion."
    explanation: Additional phenotype of the knockout, not yet described in patients.
discussions:
- discussion_id: pathogenicity_of_clinical_features
  kind: CONTROVERSY
  attaches_to:
  - phenotypes#Intellectual Disability
  - phenotypes#Global Developmental Delay
  - phenotypes#Autistic Features
  - phenotypes#Seizure
  prompt: >-
    Are the neurological and neurodevelopmental features reported in BCAT2
    deficiency consequences of the disorder, or coincidental findings in a
    small, ascertainment-biased series?
  rationale: >-
    The biochemical phenotype is constant, but clinical findings range from
    asymptomatic adults and screened newborns to intellectual disability, and
    most symptomatic patients were found because they were investigated for
    neurological problems. ClinGen curated the gene for the biochemical
    phenotype only, and recent reviews call the clinical pathogenicity
    uncertain. Longitudinal follow-up of newborn-screened cases would resolve
    this.
  evidence:
  - reference: PMID:41623317
    reference_title: "Branched-chain amino acid transferase 2 (BCAT2) deficiency: A case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCAT2 deficiency displays marked interindividual heterogeneity, ranging from asymptomatic cases to severe neurological impairment, which renders its pathogenicity uncertain."
    explanation: Systematic review concludes clinical pathogenicity is uncertain.
  - reference: CGGV:assertion_b5e16ee6-88c9-4872-8681-dd7fd0156b0f-2020-07-24T172325.905Z
    reference_title: "BCAT2 / hypervalinemia and hyperleucine-isoleucinemia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This could be due to ascertainment bias, and further studies are needed to assess the clinical features associated with this condition."
    explanation: ClinGen flags ascertainment bias as a possible explanation for the neurological findings.

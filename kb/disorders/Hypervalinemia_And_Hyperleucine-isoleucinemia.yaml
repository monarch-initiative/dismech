inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25653144
    reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, c.509G > A (p.Arg170Gln) and c.790G > A (p.Glu264Lys) were found in his father and mother, respectively, suggesting an autosomal recessive disorder."
    explanation: Parental segregation of the two compound heterozygous BCAT2 variants in the index family supports recessive inheritance.
  - reference: CGGV:assertion_b5e16ee6-88c9-4872-8681-dd7fd0156b0f-2020-07-24T172325.905Z
    reference_title: "BCAT2 / hypervalinemia and hyperleucine-isoleucinemia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BCAT2 | HGNC:977 | hypervalinemia and hyperleucine-isoleucinemia | MONDO:0100058 | AR | Definitive"
    explanation: ClinGen classifies the BCAT2 relationship for this disease with autosomal recessive mode of inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: bcaa_excess_neurotoxicity
  hypothesis_label: >-
    Chronic BCAA excess without ketoacid accumulation injures cerebral white
    matter and contributes to neurodevelopmental features
  status: EMERGING
  description: >-
    Cerebral white matter signal abnormalities have been found in every imaged
    patient and improved in the index case as BCAAs fell on pyridoxine, which
    suggests that sustained BCAA elevation acts on white matter. Whether the
    developmental delay, intellectual disability, autistic features and
    headaches reported in some patients follow from the same process, or are
    coincidental findings in a small, ascertainment-biased series, has not been
    established; several affected individuals are asymptomatic.
  evidence:
  - reference: PMID:25653144
    reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCAT2 gene mutations can cause hypervalinemia and hyperleucine-isoleucinemia, which are associated with brain white matter lesions."
    explanation: The index report links the biochemical phenotype to white matter lesions, stated as an association.
  - reference: PMID:31177572
    reference_title: "Expanding the genetic and phenotypic spectrum of branched-chain amino acid transferase 2 deficiency."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, it is unclear whether developmental delay and autism are parts of the variable phenotypic spectrum of this condition or coincidental."
    explanation: The largest early series states that it cannot tell whether the neurodevelopmental features belong to the disorder or are coincidental; it neither supports nor contradicts the hypothesis, which is why its status is EMERGING.
pathophysiology:
- name: Biallelic BCAT2 Loss of Function
  description: >-
    Biallelic missense, in-frame, frameshift and nonsense BCAT2 variants reduce
    activity of mitochondrial branched-chain aminotransferase, the
    pyridoxal 5'-phosphate-dependent enzyme that transfers the amino group of
    valine, leucine and isoleucine to alpha-ketoglutarate.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BCAT2
    term:
      id: hgnc:977
      label: BCAT2
  molecular_functions:
  - preferred_term: branched-chain amino acid transaminase activity
    modifier: DECREASED
    term:
      id: GO:0004084
      label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  evidence:
  - reference: PMID:25653144
    reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BCAT2 functional studies demonstrated that the two BCAT2 gene mutations resulted in decreased BCAT2 enzyme activity."
    explanation: Functional assay of the index patient's variants shows reduced BCAT2 enzyme activity.
  downstream:
  - target: Impaired Mitochondrial BCAA Transamination
    causal_link_type: DIRECT
    description: Loss of BCAT2 activity removes the first step of BCAA catabolism in most tissues.
    evidence:
    - reference: CGGV:assertion_b5e16ee6-88c9-4872-8681-dd7fd0156b0f-2020-07-24T172325.905Z
      reference_title: "BCAT2 / hypervalinemia and hyperleucine-isoleucinemia (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "BCAT2 (also known as BCATm) is mitochondrial and expressed in most tissues"
      explanation: ClinGen describes BCAT2 as the widely expressed mitochondrial isoform performing the first step of BCAA metabolism.
- name: Impaired Mitochondrial BCAA Transamination
  description: >-
    With BCAT2 deficient, valine, leucine and isoleucine are not efficiently
    transaminated to their branched-chain alpha-ketoacids. Because this block
    sits upstream of the branched-chain alpha-ketoacid dehydrogenase complex,
    ketoacids are not produced in excess, distinguishing the disorder from
    maple syrup urine disease.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: branched-chain amino acid catabolic process
    modifier: DECREASED
    term:
      id: GO:0009083
      label: branched-chain amino acid catabolic process
  evidence:
  - reference: CGGV:assertion_b5e16ee6-88c9-4872-8681-dd7fd0156b0f-2020-07-24T172325.905Z
    reference_title: "BCAT2 / hypervalinemia and hyperleucine-isoleucinemia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "functional alteration studies showing altered branched chain amino acid metabolism in cells from patients with BCAT2 variants (Knerr et al, 2019)"
    explanation: ClinGen summarises patient-cell studies showing altered BCAA metabolism with BCAT2 variants.
  downstream:
  - target: Systemic BCAA Accumulation Without Ketoacid Excess
    causal_link_type: DIRECT
    description: Untransaminated BCAAs accumulate in plasma while their ketoacids remain low-normal.
    evidence:
    - reference: PMID:31177572
      reference_title: "Expanding the genetic and phenotypic spectrum of branched-chain amino acid transferase 2 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We demonstrate that BCAT2 deficiency has a recognizable biochemical profile with raised plasma BCAAs and, in contrast with MSUD, low-normal branched-chain keto acids (BCKAs) with undetectable l-allo-isoleucine."
      explanation: The biochemical profile of five patients shows BCAA accumulation without ketoacid excess, as expected for a block upstream of BCKDH.
- name: Systemic BCAA Accumulation Without Ketoacid Excess
  description: >-
    Plasma valine, leucine and isoleucine are elevated, valine most markedly
    (reported presentation values roughly 800-2600 micromol/L), with normal
    plasma L-alloisoleucine and urinary branched-chain alpha-ketoacids. Unlike
    MSUD, even very high BCAA concentrations have not produced acute
    encephalopathy.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:40248769
    reference_title: "Branched-chain amino acid transferase type 2 (BCAT2) deficiency: Report of an eighth case and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It results in an elevation of branched-chain amino acid (BCAA) plasma concentrations, predominantly on valine, with normal concentration of plasma allo-isoleucine and urine branched-chain α-keto acids (BCKA)."
    explanation: Literature review summarising the constant biochemical feature of the disorder.
  - reference: PMID:31177572
    reference_title: "Expanding the genetic and phenotypic spectrum of branched-chain amino acid transferase 2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, unlike in MSUD, none of the individuals with BCAT2 deficiency developed acute encephalopathy even with exceptionally high BCAA levels."
    explanation: Distinguishes the clinical consequence of BCAA excess here from the ketoacid-associated encephalopathy of MSUD.
  downstream:
  - target: Hypervalinemia
    causal_link_type: DIRECT
  - target: Hyperleucinemia
    causal_link_type: DIRECT
  - target: Hyperisoleucinemia
    causal_link_type: DIRECT
  - target: Cerebral White Matter Abnormality
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: >-
      White matter lesions are consistently seen in imaged patients and
      improved in the index case as BCAAs fell, but the mechanism linking BCAA
      excess to white matter change is not characterised.
    evidence:
    - reference: PMID:25653144
      reference_title: "Hypervalinemia and hyperleucine-isoleucinemia caused by mutations in the branched-chain-amino-acid aminotransferase gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "After treatment with vitamin B6, the levels of BCAA, especially valine were remarkably decreased and brain MRI lesions were improved."
      explanation: Co-improvement of BCAA levels and MRI lesions in one patient suggests, but does not prove, that BCAA excess drives the lesions.
  - target: Intellectual Disability
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; the causal contribution of BCAA excess to intellectual disability is unresolved.
  - target: Global Developmental Delay
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; developmental delay may be part of the spectrum or coincidental.
  - target: Autistic Features
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; autistic features may be part of the spectrum or coincidental.
  - target: Headache
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; headache was the presenting complaint of the index adult case.
  - target: Memory Impairment
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; reported in the index adult case alongside white matter lesions.
  - target: Seizure
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bcaa_excess_neurotoxicity
    description: Proposed; a single reported episode whose relation to BCAT2 deficiency was considered atypical by its authors.
  - target: Insulin Resistance
    causal_link_type: UNKNOWN
    description: >-
      Proposed by the reporting authors in one patient; the Bcat2 knockout
      mouse shows the opposite (improved insulin sensitivity), so the link is
      contested.

name: Hypervalinemia and Hyperleucine-Isoleucinemia
creation_date: "2026-10-15T12:00:00Z"
description: >-
  Hypervalinemia and hyperleucine-isoleucinemia (branched-chain amino acid
  transaminase 2 deficiency, BCAT2 deficiency) is an ultra-rare autosomal
  recessive inborn error of branched-chain amino acid (BCAA) catabolism caused
  by biallelic BCAT2 variants. BCAT2 is the mitochondrial, pyridoxal
  5'-phosphate-dependent aminotransferase that catalyses the first, reversible
  step of BCAA breakdown, converting valine, leucine and isoleucine to their
  branched-chain alpha-ketoacids. Loss of this step raises plasma BCAAs,
  predominantly valine, but, unlike maple syrup urine disease (where the
  downstream branched-chain alpha-ketoacid dehydrogenase step is blocked),
  branched-chain ketoacids are low-normal and L-alloisoleucine is undetectable,
  and no patient has developed acute encephalopathy. About a dozen affected
  individuals have been reported. Their clinical picture ranges from
  asymptomatic adults and newborn-screening cases to headache, developmental
  delay, intellectual disability and autistic features, with cerebral white
  matter signal abnormalities on MRI in those imaged; whether the neurological
  features are caused by the disorder or reflect ascertainment bias is
  unresolved. Plasma BCAAs fall with pyridoxine supplementation and appear
  responsive to protein restriction.
category: Genetic
parents:
- Inborn Error of Metabolism
- Disorder of Branched-Chain Amino Acid Metabolism
synonyms:
- BCAT2 deficiency
- branched-chain amino acid transaminase 2 deficiency
- branched-chain aminotransferase deficiency
- HVLI

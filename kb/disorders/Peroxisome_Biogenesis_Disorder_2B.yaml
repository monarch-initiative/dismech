name: Peroxisome Biogenesis Disorder 2B
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: peroxisome biogenesis disorder 2B
  term:
    id: MONDO:0008736
    label: peroxisome biogenesis disorder 2B
description: >-
  Peroxisome biogenesis disorder 2B (PBD2B, OMIM 202370) is the non-classic
  ("B", milder) end of the PEX5-related Zellweger spectrum, corresponding to the
  historical entities neonatal adrenoleukodystrophy and infantile Refsum
  disease. PEX5 defines complementation group 2 of the peroxisome biogenesis
  disorders and encodes the cytosolic receptor that recognises the type-1
  peroxisomal targeting signal (PTS1) on matrix enzymes and delivers them to the
  organelle.

  What distinguishes PBD2B from classic Zellweger syndrome (PBD2A) is not a
  different pathway but a different degree - and, unusually for this spectrum, a
  different *kind* - of residual function. The three PEX5 patients characterised
  together in 1999 make the point cleanly, because their phenotypes track their
  import defects: the nonsense allele R390X gave Zellweger syndrome and lost
  both PTS1 and PTS2 import; the missense allele N489K gave neonatal
  adrenoleukodystrophy with a severe PTS1 defect but preserved PTS2 import; and
  the missense allele S563W gave infantile Refsum disease, the mildest
  phenotype, with residual function on both arms.

  The S563W receptor is the informative one, because its residual function is
  *cargo-selective* rather than simply reduced. It still handles the canonical
  -SKL signal of acyl-CoA oxidase but has little or no function for the weaker
  PTS1 variants -AKL (D-bifunctional protein, sterol carrier protein 2) and
  -KANL (catalase). So a mildly damaged PTS1 receptor does not import less of
  everything; it imports a subset, chosen by how good a match each cargo's
  targeting signal is. That is a mechanism for graded severity that has no
  equivalent in the receptor-export-module disorders PBD1B and PBD4B, where the
  gradient is set by how much peroxin protein survives.

  PEX5 is also the gene of rhizomelic chondrodysplasia punctata type 5, an
  entirely different disease produced by an allele that removes only the long
  isoform and so knocks out the PTS2 arm while sparing PTS1. RCDP5 is curated
  separately in this knowledge base. One gene, two diseases, decided by which
  isoform and which cargo arm an allele hits - and PBD2B is the Zellweger-side
  half of that split.
parents:
- Zellweger Spectrum Disorders
- peroxisome biogenesis disorder
- inborn errors of metabolism
synonyms:
- PBD2B
- peroxisome biogenesis disorder type 2B
- Neonatal adrenoleukodystrophy, PEX5-related

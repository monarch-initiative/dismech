genetic:
- name: PEX5
  gene_term:
    preferred_term: PEX5
    term:
      id: hgnc:9719
      label: PEX5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    PEX5 encodes the cytosolic PTS1 receptor and defines complementation group 2
    of the peroxisome biogenesis disorders. ClinGen classifies the gene-disease
    relationship as definitive with autosomal recessive inheritance.

    Three alleles anchor the severity range and are quoted on the evidence items
    in this entry: R390X (nonsense) in classic Zellweger syndrome, N489K
    (missense) in neonatal adrenoleukodystrophy, and S563W (missense) in
    infantile Refsum disease. The two missense alleles are the PBD2B end.

    Two things a curator adding PEX5 variants here needs to know. First, the
    isoform matters: an allele in the long-isoform-specific exon 9 does not give
    Zellweger spectrum disease at all - it gives rhizomelic chondrodysplasia
    punctata type 5, curated separately, by knocking out the PTS2 arm while
    sparing PTS1. Second, residue numbering in the PEX5 literature is reported
    against both isoforms, and the older Chinese hamster work states its
    positions in both (for example Gly485Glu of the short isoform is G522E of
    the long one). Check which isoform a paper is numbering against before
    matching an allele.

    PEX5 is a rare cause within the peroxisome biogenesis disorders. In a
    14-patient Iranian series, PEX1 accounted for five patients and PEX5 for
    one - a proportion consistent with the older complementation-group data, in
    which group 1 (PEX1) dominates.
  evidence:
  - reference: CGGV:assertion_b49d9cfd-0e51-4219-84bb-76b4c9b99fa9-2020-01-17T170000.000Z
    reference_title: "PEX5 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "PEX5 | HGNC:9719 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: >-
      ClinGen's definitive gene-disease validity assertion for PEX5.
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mutations in the peroxisome targeting signal (PTS) 1 receptor gene, PEX5 ,
      are responsible for complementation group (CG) 2 of the peroxisome
      biogenesis disorders (PBD).
    explanation: >-
      States the gene-to-complementation-group assignment that this entry's
      identity rests on.
  - reference: PMID:40205409
    reference_title: "Spectrum of genetic alterations in patients with peroxisome biogenesis defects in the Iranian population: a case series study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      PEX1 variants were detected in five patients. PEX2, PEX5, PEX6 and PEX7
      variants were detected in three, one, one, and two cases, respectively.
    explanation: >-
      Shows PEX5 as an uncommon cause relative to PEX1 in a contemporary
      peroxisomal-disorder series. Indirect: a 14-patient single-country series
      spanning the whole Zellweger spectrum, not a PBD2B denominator.
biochemical:
- name: Peroxisomal Matrix Protein Import in Patient Fibroblasts
  notes: >-
    The assay that defines this entity at the cellular level, and the one that
    distinguishes PBD2B from PBD2A. Import of PTS1 and PTS2 reporters is scored
    separately in cultured fibroblasts, and complementation with wild-type PEX5
    is what establishes that a candidate variant is causal.

    Two refinements specific to PEX5 disease. First, the PTS1 arm should not be
    scored with a single reporter: the cargo-selectivity result means a receptor
    can import a -SKL protein normally while failing -AKL and -KANL proteins, so
    a normal acyl-CoA oxidase import does not exclude the disorder. Second, PTS2
    import status is informative rather than redundant - in the three
    characterised patients it separated the Zellweger allele, which lost both
    arms, from the non-classic alleles.

    Temperature is the third variable. Culturing mild-phenotype PBD fibroblasts
    at 30 degrees C restores peroxisomal biogenesis and metabolic function,
    which is both a severity predictor and a way of demonstrating that residual
    peroxin function exists. It has not been reported in a PEX5 patient's cells;
    see the pathophysiology node of that name.
  evidence:
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      we analyzed peroxisome matrix protein import in fibroblasts from three
      patients with peroxisome biogenesis disorders, all with different
      mutations in the PEX5 gene
    explanation: >-
      Describes the assay and the material - patient fibroblasts - on which this
      entity's cellular characterisation rests.
diagnosis:
- name: Biochemical Screening Followed by ZSD-PEX Gene Sequencing
  description: >-
    The diagnosis is established by biallelic pathogenic variants in one of the
    thirteen ZSD-PEX genes in a proband with suggestive clinical and biochemical
    findings. In practice a raised very-long-chain fatty acid profile brings the
    patient to genetic testing, and a panel or exome then identifies the gene;
    PEX5 is one of the rarer answers, so it is found by broad sequencing rather
    than by being suspected.

    The non-classic phenotype is the one that gets missed. These children have
    no congenital malformations, so a child with progressive hearing and vision
    loss, ataxia and abnormal enamel may be carried for years under another
    label before a peroxisomal screen is sent.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive
      clinical and biochemical findings above by identification of biallelic
      pathogenic variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews' diagnostic criterion, which applies to PBD2B as a ZSD-PEX
      gene disorder.
- name: Import-Arm Phenotyping to Interpret a Novel PEX5 Variant
  description: >-
    Because so few pathogenic PEX5 alleles have been reported, a new PEX5
    variant found in a patient with a peroxisomal phenotype will usually be one
    of uncertain significance. Fibroblast import phenotyping is the assay with
    the most PEX5-specific precedent: scoring PTS1 and PTS2 import separately,
    and scoring PTS1 import with more than one cargo, distinguishes the classic
    from the non-classic pattern and would separate a Zellweger-spectrum allele
    from an RCDP5-type isoform allele.
  evidence:
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Fibroblasts from 2-03 (S563W) were detected in both PTS1 and PTS2 imports
      despite the PEX5 defect, findings in contrast with fibroblasts from 2-05
      (N489K) severely defective in PTS1 import and those from 2-01 (R390X)
      severely defective in both PTS1 and PTS2.
    explanation: >-
      The worked example of import-arm phenotyping separating three PEX5
      genotypes.
treatments:
- name: Symptomatic and Supportive Management
  description: >-
    There is no treatment that restores peroxisomal import. Management of the
    non-classic Zellweger spectrum is symptomatic and organ-directed, and
    several of its components matter because the manifestations they address are
    themselves treatable: hearing aids, cataract removal and refractive
    correction, fat-soluble vitamin supplementation, cholic acid, gastrostomy
    for caloric intake, and adrenal replacement.

    Curated as one treatment rather than split into a dozen, because the source
    presents it as one management approach and splitting it would create
    treatment entries with no evidence of their own.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide
      adequate calories, hearing aids, cataract removal, glasses to correct
      refractive errors, supplementation of fat-soluble vitamins, and cholic
      acid supplementation
    explanation: >-
      GeneReviews' management recommendation for Zellweger spectrum disorder.
  target_mechanisms:
  - target: Progressive Degenerative Multisystem Disease
    description: >-
      Supportive management acts on the clinical consequences and not on any
      step upstream of them. The edge is drawn to the clinical node deliberately:
      nothing in this treatment touches the import defect, and drawing it to a
      molecular node would assert a disease-modifying effect that does not exist.
prevalence:
- population: Reported patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    PEX5 is one of the rarest causes of Zellweger spectrum disease. The
    complementation-group literature describes group 2 with a handful of
    patients, three of whom carry the characterised alleles cited in this entry,
    and a contemporary 14-patient Iranian peroxisomal series found one PEX5
    patient against five with PEX1.

    No population estimate exists for PBD2B, and none should be constructed from
    those numbers: both are ascertainment series, not denominators, and neither
    separates the "A" from the "B" end. Zellweger spectrum disorder as a whole
    is the denominator a reader will want, and it is curated on that entry.
  evidence:
  - reference: PMID:40205409
    reference_title: "Spectrum of genetic alterations in patients with peroxisome biogenesis defects in the Iranian population: a case series study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      PEX1 variants were detected in five patients. PEX2, PEX5, PEX6 and PEX7
      variants were detected in three, one, one, and two cases, respectively.
    explanation: >-
      The relative rarity of PEX5 within a peroxisomal-disorder series.
      Indirect: 14 patients in one country, spanning the whole spectrum.
differential_diagnoses:
- name: Peroxisome biogenesis disorder 2A (classic PEX5 Zellweger syndrome)
  description: >-
    The same gene and the severe end of the same allelic series. The distinction
    is not clinical in the first instance but developmental: classic Zellweger
    syndrome has congenital malformations - neuronal migration defects, renal
    cysts, bony stippling - and death usually in the first year, whereas the
    non-classic phenotype has none of those and is degenerative over years. At
    the cellular level the R390X Zellweger allele lost both import arms while
    the non-classic alleles did not.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die
      during the first year of life, usually having made no developmental
      progress.
    explanation: >-
      The severe-end outcome that separates PBD2A from PBD2B.
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      There is clinical, biochemical, and genetic overlap among the three
      phenotypes, also known as Zellweger spectrum disorders. Clinical
      distinctions between the phenotypes are not sharply defined.
    explanation: >-
      The caution that goes with this differential: the A/B boundary is a
      convention on a continuum, not a sharp line.
- name: Rhizomelic chondrodysplasia punctata type 5
  description: >-
    The other PEX5 disease, and the reason a PEX5 variant cannot be interpreted
    without knowing which isoform it hits. RCDP5 is caused by an allele in the
    long-isoform-specific exon, which removes the PTS2 co-receptor function
    while leaving PTS1 import intact - the mirror image of the lesion in this
    entry. It is curated separately in this knowledge base and presents as
    rhizomelic chondrodysplasia punctata, not as Zellweger spectrum disease.
  evidence:
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Taken together, these data provide an explanation for the different
      protein import defects in CG2 patients and show that the long isoform of
      the Pex5 protein is required for peroxisomal import of PTS2 proteins.
    explanation: >-
      Establishes the isoform architecture that makes an isolated PTS2 defect
      possible from a PEX5 allele. Indirect for the differential itself: this
      paper predates RCDP5 and is cited for the mechanism, not the entity.
- name: Peroxisome biogenesis disorders of other complementation groups
  description: >-
    PBD2B cannot be separated from PBD1B, PBD4B or the other non-classic PEX
    disorders on clinical or biochemical grounds - only by genotype. This
    matters more than it usually does, because the largest natural-history
    cohort available for the non-classic phenotype is PEX1-dominated, so the
    clinical expectations attached to this entry are in substance PEX1-derived.
  evidence:
  - reference: PMID:15098231
    reference_title: "Peroxisome biogenesis disorders with prolonged survival: phenotypic expression in a cohort of 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At the molecular level, 21 patients had mutations in the PEX1 gene.
    explanation: >-
      Quantifies the PEX1 dominance of the cohort that supplies most of the
      non-classic natural-history data.
discussions:
- discussion_id: pbd2b_no_pex5_specific_phenotype_series
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does PEX5 non-classic disease differ clinically from PEX1 non-classic
    disease, or is the Zellweger spectrum phenotype genuinely gene-independent
    at the mild end?
  attaches_to:
  - "pathophysiology#Progressive Degenerative Multisystem Disease"
  - "phenotypes#"
  rationale: >-
    Every phenotype in this entry is imported from gene-agnostic sources, and
    each is marked INDIRECT for that reason. The nosology invites this -
    GeneReviews says the term ZSD now covers any ZSD-PEX gene defect regardless
    of phenotype - but "the clinical categories do not track genes" is a claim
    that was made when almost all the genotyped patients were PEX1, and it has
    not been re-tested gene by gene.

    There is a specific reason to think PEX5 might differ, and it comes from
    this entry's own mechanism. In the export-module disorders PBD1B and PBD4B
    the residual function is a reduced *amount* of peroxin, so every cargo is
    imported less. In PEX5 disease the residual function is *cargo-selective*:
    a mildly damaged receptor imports strong-PTS1 enzymes and not weak-PTS1
    ones. Those two lesions should produce different biochemical profiles even
    at matched severity, and a different biochemical profile is a plausible
    route to a different clinical emphasis.

    The gap is narrow and cheap to close: it needs the PEX5 patients in existing
    peroxisomal-disease registries pulled out and described together.
  proposed_experiments:
  - experiment_id: exp_pbd2b_pex5_case_series
    name: Assemble a PEX5-specific Zellweger spectrum case series
    description: >-
      Query peroxisomal-disease registries and diagnostic laboratories for
      patients with biallelic PEX5 variants, and describe their phenotypes,
      biochemistry and survival alongside genotype, separating the classic from
      the non-classic end. Compare against the PEX1 non-classic phenotype from
      the existing cohorts.
  - experiment_id: exp_pbd2b_cargo_resolved_biochemistry
    name: Cargo-resolved peroxisomal biochemistry in PEX5 versus PEX1 patients
    description: >-
      Measure import and activity of enzymes carrying strong (-SKL) and weak
      (-AKL, -KANL) PTS1 signals side by side in fibroblasts from non-classic
      PEX5 and non-classic PEX1 patients matched for overall severity. The
      prediction from the cargo-selectivity result is an uneven profile in the
      PEX5 cells and a uniform one in the PEX1 cells.
- discussion_id: pbd2b_temperature_sensitivity_untested_in_pex5
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do PEX5 non-classic patient fibroblasts show the temperature-sensitive
    rescue that defines residual peroxin function at the mild end of the other
    complementation groups?
  attaches_to:
  - "pathophysiology#Temperature-Sensitive Residual Peroxisome Function"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence is not absent - it is good evidence from a system whose applicability
    to PEX5 is untested. Temperature-sensitive restoration of peroxisomal
    biogenesis at 30 degrees C is established for mild-phenotype PBD cells, and
    this knowledge base's PEX1 entry carries it for the G843D allele directly.
    No source cited here shows it in a PEX5 patient's cells.

    It is not a foregone conclusion either way, and that is the point. Thermal
    rescue is a folding-stability phenomenon; the PEX5 non-classic lesion, as
    characterised, is a *recognition* defect at the cargo interface. A receptor
    that misreads a weak targeting signal need not be rescued by lowering the
    temperature, so a negative result here would be informative rather than
    merely absent.
  proposed_experiments:
  - experiment_id: exp_pbd2b_thermal_rescue
    name: Test 30-degree rescue in PEX5 non-classic fibroblasts
    description: >-
      Culture fibroblasts carrying the N489K and S563W PEX5 alleles at 30 versus
      37 degrees C and score PTS1 import with strong- and weak-signal cargoes,
      PTS2 import, and peroxisomal metabolite profiles. Compare against a PEX1
      G843D line as the positive control for thermal rescue.

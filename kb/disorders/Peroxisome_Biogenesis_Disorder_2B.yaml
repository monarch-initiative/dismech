- Peroxisome biogenesis disorder, complementation group 2, non-classic
notes: >-
  Curation level. PBD2B is curated as a distinct entry rather than folded into
  Zellweger Spectrum Disorders, in parallel with Peroxisome Biogenesis Disorder
  1B (PEX1) and 4B (PEX6), because the "A"/"B" split within a PEX
  complementation group is a mechanistic statement about residual peroxin
  function rather than a bare severity label, and because the causal gene
  differs. The gene-agnostic downstream cascade shared by the whole spectrum -
  loss of peroxisomal beta-oxidation, ether-lipid synthesis and bile acid
  side-chain shortening, and the resulting multisystem disease - is curated once
  on the Zellweger Spectrum Disorders entry rather than duplicated here. This
  entry carries what is PEX5- and non-classic-specific: the receptor rather than
  the export module as the lesion, and the cargo-selectivity of the residual
  function.

  Where the phenotype block comes from, stated plainly because it matters. There
  is no PEX5-specific clinical series. The three PEX5 patients whose import
  defects define this entity are labelled with their clinical diagnoses and
  nothing more; the only PEX5 case in a recent 14-patient Iranian peroxisomal
  cohort is one row in a table. So the phenotypes here are curated at the level
  of *intermediate/milder Zellweger spectrum disorder*, from GeneReviews and
  from a 31-patient prolonged-survival cohort, and every one of them carries
  `directness: INDIRECT` for that reason.

  That import is licensed by the sources themselves rather than assumed:
  GeneReviews states that the term ZSD now refers to all individuals with a
  defect in one of the ZSD-PEX genes *regardless of phenotype*, and the
  prolonged-survival cohort states that clinical distinctions between ZS, NALD
  and IRD are not sharply defined. The nosology is deliberately gene-agnostic on
  the clinical side. But note the countervailing fact and do not lose it: 21 of
  the 31 patients in that cohort had PEX1 mutations, so the cohort describes the
  non-classic ZSD phenotype as PEX1 disease mostly draws it. Nothing here
  establishes that a PEX5 patient's phenotype is identical to a PEX1 patient's,
  and if a PEX5-specific series is ever published these annotations should be
  re-derived from it rather than left in place.

  Rhizomelic chondrodysplasia punctata type 5 is the same gene and is
  intentionally not modelled as a subtype of this entry. It has separate
  OMIM/MONDO identity, an isoform-specific allele, and a PTS2-selective import
  defect that is the mirror image of the PTS1-selective lesion here. It is
  curated as its own entry and referenced below as a differential.

  PBD2A - classic PEX5 Zellweger syndrome - has no entry in this knowledge base
  at the time of writing. It is referenced here as the severe counterpart, and
  the R390X patient who anchors that end appears in this entry's evidence,
  because the contrast between the two is what defines "2B". Creating the PBD2A
  entry is a reasonable follow-on.

  On the deep-research report committed with this entry. A falcon report was run
  with a disambiguating query naming PEX5, the OMIM number and the
  complementation group. `just preflight-dr` returned SKIP rather than PASS,
  because MONDO records no causal gene for MONDO:0008736 and so its
  gene-identity check has nothing to discriminate on - SKIP means unchecked, not
  passed. The manual fallback settles it: the report mentions PEX5 120 times
  against 21 for PEX1 and 9 for PEX2, states in its own scope paragraph that it
  concerns PEX5-related complementation group 2 and not PEX1- or PEX2-related
  disease, and carries OMIM 202370, which matches MONDO's cross-reference. It is
  about the right entity.

  It independently reached the same framing as this entry - hypomorphic PEX5
  alleles with residual import, a severity continuum rather than discrete NALD
  and IRD entities, and clinical expectations drawn from general ZSD because
  PEX5-isolated data do not exist. It also carries leads this entry does not
  curate, recorded here so the next curator does not have to re-derive them: an
  early review reporting only two US complementation-group-2 patients, which
  corroborates the rarity claim above from a second direction; a 2025 homozygous
  PEX5 stop-loss allele that remained an ACMG variant of uncertain significance
  for want of functional validation; and Pex5-null mouse and pex5 zebrafish
  models that reproduce absent matrix import but resemble severe Zellweger
  syndrome rather than this entity - which is why no `animal_models:` block is
  curated here. None of these is curated as evidence, because a deep-research
  report is a lead.

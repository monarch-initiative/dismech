pathophysiology:
- name: Hypomorphic PEX5 Variants with Residual PTS1 Receptor Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion, and the point at which PBD2B separates from classic
    PEX5 Zellweger syndrome. PEX5 mutations define complementation group 2 of
    the peroxisome biogenesis disorders, and expressing wild-type PEX5 rescues
    the PTS1 import defect in patient fibroblasts - which is what makes the
    variants causal rather than incidental.

    The three PEX5 patients analysed together in 1999 span the group's whole
    severity range and correlate it with allele type: a nonsense allele (R390X)
    in the Zellweger patient, and missense alleles in the two non-classic
    patients (N489K in neonatal adrenoleukodystrophy, S563W in infantile Refsum
    disease). PBD2B is the missense, residual-function half of that picture.
  genes:
  - preferred_term: PEX5
    term:
      id: hgnc:9719
      label: PEX5
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as partial rather than complete loss of function on the strength
      of the measured import phenotypes: the non-classic alleles retain
      demonstrable PTS1 or PTS2 receptor activity in patient fibroblasts, where
      the nonsense allele associated with classic Zellweger syndrome does not.
      This is the slot's intended use - the claim is about the consequence of a
      variant, not about the activity level of a pathway.
  evidence:
  - reference: PMID:7719337
    reference_title: "Mutations in the PTS1 receptor gene, PXR1, define complementation group 2 of the peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Mutations in PXR1 define complementation group 2 of PBDs and expression of
      PXR1 rescues the PTS1 import defect of fibroblasts from these patients.
    explanation: >-
      Assigns PEX5 (then PXR1) to complementation group 2 and establishes
      causality by complementation in patient cells. Graded IN_VITRO because the
      quoted finding is a rescue experiment in cultured fibroblasts, and the
      same sentence is graded that way wherever it is cited in this file.
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The patients 2-01 (Zellweger syndrome) and 2-05 (neonatal
      adrenoleukodystrophy) have the reported mutations, R390X and N489K, and
      patient 2-03 (infantile Refsum disease) has a newly identified mutation,
      S563W.
    explanation: >-
      Gives the alleles and the clinical diagnosis of each PEX5 patient,
      including the two non-classic patients this entry is about.
  downstream:
  - target: Cargo-Selective Failure of PTS1 Recognition
    causal_link_type: DIRECT
  - target: Partial Loss of the PEX5L-Dependent PTS2 Arm
    causal_link_type: DIRECT
    description: >-
      Drawn as a separate edge because the two import arms are separably
      affected in this disorder - which is the observation that makes the PEX5
      gradient interpretable at all.
  - target: Temperature-Sensitive Residual Peroxisome Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cargo-Selective Failure of PTS1 Recognition
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The mechanism that is specific to this entity rather than borrowed from the
    spectrum. PEX5 recognises matrix enzymes by their C-terminal PTS1 tripeptide,
    but real PTS1 signals are not equally good matches. The canonical -SKL of
    acyl-CoA oxidase is a strong signal; -AKL (D-bifunctional protein, sterol
    carrier protein 2) and -KANL (catalase) are weaker variants.

    A mildly damaged receptor therefore fails asymmetrically. In the infantile
    Refsum patient's fibroblasts the S563W receptor still imported the -SKL
    cargo and had little or no function for -AKL and -KANL. The authors draw the
    general conclusion: the poorer PTS1 variants are the ones most susceptible
    to a receptor mutation.

    Two consequences worth holding on to. First, this predicts that the
    biochemical profile of a PBD2B patient should be uneven across peroxisomal
    pathways rather than uniformly depressed, because which enzymes reach the
    organelle depends on their targeting signals. Second, it means "residual
    receptor function" in this disorder is not a single number - two patients
    with the same residual import of one reporter could differ in which enzymes
    they actually import.
  biological_processes:
  - preferred_term: protein targeting to peroxisome
    modifier: DECREASED
    term:
      id: GO:0006625
      label: protein targeting to peroxisome
  evidence:
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The PTS1 receptor in 2-03 is functional for only the C-terminal -SKL
      sequence (acyl-CoA oxidase) and had little or no function for C-terminal
      -AKL (D-bifunctional protein and sterol carrier protein 2) and -KANL
      (catalase) sequences, respectively.
    explanation: >-
      The cargo-selectivity measurement itself, in fibroblasts from the mildest
      of the three PEX5 patients.
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      It seems apparent that -AKL and -KANL are poorer variants of PTS1 and are
      likely to be more susceptible to effects of mutation of its receptor,
      Pex5p.
    explanation: >-
      The authors' generalisation, which is what turns a single-patient
      observation into a mechanism for graded severity in PEX5 disease.
  downstream:
  - target: Partial Peroxisomal Matrix Protein Import Failure
    causal_link_type: DIRECT
- name: Partial Loss of the PEX5L-Dependent PTS2 Arm
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX5 is transcribed as two isoforms. The long one, PEX5L, carries an extra
    internal exon and additionally acts as the co-receptor through which PEX7
    delivers PTS2-tagged cargo; the short one does PTS1 import only.
    Transfection experiments separate the two arms cleanly: PEX5S restores PTS1
    import but not PTS2 import, PEX5L restores both.

    That architecture is why a PEX5 patient's PTS2 arm may or may not be
    involved, and the involvement tracks severity. The Zellweger patient's
    nonsense allele lost both arms; the neonatal adrenoleukodystrophy patient's
    N489K receptor was severely defective in PTS1 import with PTS2 import
    preserved; the infantile Refsum patient retained function on both. So in
    PBD2B the PTS2 arm is *relatively* spared, and that sparing is part of why
    the disease is milder.

    A caution against over-reading this. It rests on three patients, one per
    phenotype, and the alleles differ in kind as well as in position - so the
    correlation between "how many arms fail" and "how severe the disease" is a
    pattern across three points, not a demonstrated dose-response.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  evidence:
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Transfection of PBD005 cells with PEX5S cDNA restores PTS1 but not PTS2
      import; transfection with PXR5L cDNA restores both PTS1 and PTS2 protein
      import.
    explanation: >-
      The isoform-swap experiment that assigns the PTS2 arm specifically to
      PEX5L.
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Taken together, these data provide an explanation for the different
      protein import defects in CG2 patients and show that the long isoform of
      the Pex5 protein is required for peroxisomal import of PTS2 proteins.
    explanation: >-
      States the point exactly: the isoform architecture is what explains why
      complementation group 2 patients differ in which arms fail.
  - reference: PMID:10462504
    reference_title: Functional heterogeneity of C-terminal peroxisome targeting signal 1 in PEX5-defective patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Fibroblasts from 2-03 (S563W) were detected in both PTS1 and PTS2 imports
      despite the PEX5 defect, findings in contrast with fibroblasts from 2-05
      (N489K) severely defective in PTS1 import and those from 2-01 (R390X)
      severely defective in both PTS1 and PTS2.
    explanation: >-
      The per-patient import phenotypes, which is what lets the two non-classic
      patients be distinguished from the Zellweger one at the cellular level.
  downstream:
  - target: Partial Peroxisomal Matrix Protein Import Failure
    causal_link_type: DIRECT
- name: Temperature-Sensitive Residual Peroxisome Function
  biological_scale: CELLULAR
  role: modulator
  mechanism_confidence: PROVISIONAL
  description: >-
    A property of the mild end of the peroxisome biogenesis disorders generally,
    recorded here because it is the clearest available demonstration that a
    non-classic phenotype reflects a conformationally marginal peroxin rather
    than a missing one: in cells from patients with mild phenotypes, peroxisomal
    biogenesis and metabolic function are restored by culturing at 30 degrees C.

    Marked PROVISIONAL, and the reason is specific rather than generic. The
    source states the phenomenon for PBD mild phenotypes as a class, and this
    knowledge base's PEX1 entry carries the equivalent observation for the
    G843D allele directly. Nothing cited here shows temperature rescue in a
    PEX5 patient's cells. The node is curated because it is the mechanistic
    basis on which "residual function" is claimed for non-classic alleles across
    this spectrum, and because it is a directly testable prediction for PBD2B
    fibroblasts, not because it has been tested in them.
  evidence:
  - reference: PMID:11405337
    reference_title: "Clinical, biochemical and genetic aspects and neuronal migration in peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Temperature-sensitivity, whereby peroxisomal biogenesis and metabolic
      dysfunctions are restored at 30 degrees C in cells from mild phenotypes,
      is a useful event for predicting the clinical severity and for elucidation
      of peroxisome biogenesis.
    explanation: >-
      Establishes temperature-sensitive residual function as the cellular
      signature of the mild PBD phenotypes. Indirect: a statement about the PBD
      class, with no PEX5 cell line named.
  downstream:
  - target: Partial Peroxisomal Matrix Protein Import Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A modulating rather than a causal edge: residual thermolabile function is
      what leaves the import defect partial instead of complete.
- name: Partial Peroxisomal Matrix Protein Import Failure
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The cellular endpoint of the receptor lesion: peroxisomes are present but
    incompletely loaded, because a subset of matrix enzymes never reaches them.
    This is the step at which PBD2B rejoins the rest of the Zellweger spectrum -
    PBD1B and PBD4B arrive at the same place by failing to recycle the receptor
    rather than by failing to recognise the cargo.

    Its partial character is what the entry turns on. Complementation restores
    the import defect, which fixes causality; the residual import that remains
    in the untreated cells is what separates a non-classic phenotype from
    classic Zellweger syndrome.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  evidence:
  - reference: PMID:7719337
    reference_title: "Mutations in the PTS1 receptor gene, PXR1, define complementation group 2 of the peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Mutations in PXR1 define complementation group 2 of PBDs and expression of
      PXR1 rescues the PTS1 import defect of fibroblasts from these patients.
    explanation: >-
      Documents the import defect in patient fibroblasts and its correction by
      the wild-type receptor.
  - reference: PMID:7719337
    reference_title: "Mutations in the PTS1 receptor gene, PXR1, define complementation group 2 of the peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      PXR1, like PAS8, encodes a receptor for proteins with the type-1
      peroxisomal targeting signal (PTS1).
    explanation: >-
      Establishes what the gene product does, which is what makes an import
      failure the expected consequence of losing it. Indirect: it states the
      normal function rather than the disease state.
  downstream:
  - target: Attenuated Peroxisomal Metabolic Block
    causal_link_type: DIRECT
- name: Attenuated Peroxisomal Metabolic Block
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Peroxisomes are essential for beta-oxidation of fatty acids, for ether-lipid
    (plasmalogen) synthesis and for redox homeostasis, so incompletely loaded
    peroxisomes produce a metabolic block across all of these. In the
    non-classic phenotypes that block is attenuated rather than complete, which
    is why the disease is degenerative over years instead of lethal in infancy.

    Marked PROVISIONAL for this entity specifically. The metabolic consequences
    of peroxisomal import failure are not in doubt, and they are curated in
    detail on the Zellweger Spectrum Disorders entry; what is not established
    here is the *quantitative* profile in a PEX5 non-classic patient. The
    cargo-selectivity result upstream predicts that the profile should be
    uneven - catalase and D-bifunctional protein import failing before acyl-CoA
    oxidase import does - and no one has measured that in a PBD2B patient.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  - preferred_term: ether lipid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
  evidence:
  - reference: PMID:35917894
    reference_title: Molecular insights into peroxisome homeostasis and peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Peroxisomes are single-membrane organelles essential for cell metabolism
      including the β-oxidation of fatty acids, synthesis of etherlipid
      plasmalogens, and redox homeostasis.
    explanation: >-
      States the metabolic functions lost when matrix enzymes fail to reach the
      organelle. Indirect: a statement of normal peroxisome biology, not a
      measurement in a PBD2B patient.
  downstream:
  - target: Progressive Degenerative Multisystem Disease
    causal_link_type: DIRECT
- name: Progressive Degenerative Multisystem Disease
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinical endpoint, and the node at which this entry is at its most
    borrowed. The non-classic Zellweger spectrum phenotype is degenerative
    rather than malformative: these patients do not have the congenital
    malformations of classic Zellweger syndrome, and instead accumulate sensory
    loss, neurological involvement, liver dysfunction, adrenal insufficiency and
    renal oxalate stones over years.

    PROVISIONAL because the evidence for it is gene-agnostic. GeneReviews
    describes intermediate/milder ZSD across all thirteen ZSD-PEX genes, and the
    prolonged-survival cohort that supplies the "common to all patients"
    findings was 21/31 PEX1. No PEX5-specific clinical series exists. The
    phenotypes below inherit that limitation and each is marked INDIRECT.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital
      malformations, but rather progressive peroxisome dysfunction variably
      manifest as sensory loss (secondary to retinal dystrophy and sensorineural
      hearing loss), neurologic involvement (ataxia, polyneuropathy, and
      leukodystrophy), liver dysfunction, adrenal insufficiency, and renal
      oxalate stones.
    explanation: >-
      The non-classic ZSD phenotype in one sentence. Indirect for PBD2B: it
      describes the intermediate/milder end of the spectrum across all ZSD-PEX
      genes, not PEX5 patients specifically.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      the term "ZSD" is now used to refer to all individuals with a defect in
      one of the ZSD-PEX genes regardless of phenotype
    explanation: >-
      The sources' own licence for describing this entity's clinical picture at
      spectrum level: the clinical nosology is deliberately gene-agnostic. It
      justifies the import; it does not make it PEX5-specific.
  downstream:

genetic:
- name: BFSP1
  gene_term:
    preferred_term: BFSP1
    term:
      id: hgnc:1040
      label: BFSP1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported alleles (NM_001195): recessive c.736-1384_c.957-66del (exon 6
    deletion), a homozygous 15.4 kb exons 3-5 deletion, and compound
    heterozygous c.1492del p.(Ser498Leufs*24) with c.812T>C p.(Ile271Thr);
    dominant c.1042G>A p.(Asp348Asn), c.1804G>C p.(Gly602Arg), c.625+3A>G and
    c.1124del p.(Glu375Glyfs*2). Two Chinese families linked to 20p12.2-p11.23
    were sequenced for BFSP1 without a mutation being found, so linkage to this
    region is not by itself evidence of BFSP1 cataract.
  evidence:
  - reference: PMID:17225135
    reference_title: "Autosomal recessive juvenile onset cataract associated with mutation in BFSP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of a mutation in the BFSP1 gene associated with human inherited cataracts."
    explanation: First BFSP1 cataract family.
  - reference: PMID:41553577
    reference_title: "Novel mega-deletion in BFSP1 causing autosomal recessive juvenile cataract in a Pakistani consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing (WES) in an affected family member revealed a homozygous, intragenic 15.40 kb mega-deletion NG_012423.2; g.17485448_17500744del (chr20: 17,485,448-17,500,744-GRCh37/hg19) including three consecutive exons 3, 4, and 5, encompassing two domains of beaded filament structural protein 1 (BFSP1)."
    explanation: Homozygous exon 3-5 deletion in a recessive family.
  - reference: PMID:26694549
    reference_title: "Sporadic and Familial Congenital Cataracts: Mutational Spectrum and New Diagnoses Using Next-Generation Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband was found to be compound heterozygous for mutations in BFSP1 (c.1492del p.(Ser498Leufs*24) and c.812T>C p.(Ile271Thr))."
    explanation: Compound heterozygous recessive proband.
  - reference: PMID:24379646
    reference_title: "A novel beaded filament structural protein 1 (BFSP1) gene mutation associated with autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing revealed a heterozygous G>A transversion at c.1042 of the coding sequence in exon 7 of BFSP1 (c.1042G>A) in all affected members, which resulted in the substitution of a wild-type aspartate to an asparagine (D348N)."
    explanation: Heterozygous missense segregating in a dominant family.
  - reference: PMID:31842807
    reference_title: "Novel mutations identified in Chinese families with autosomal dominant congenital cataracts by targeted next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigree of Family 3, all patients carried the heterozygous mutation c.1804G > C in BFSP1."
    explanation: Heterozygous G602R segregating in a dominant family.
  - reference: PMID:28450710
    reference_title: "Targeted Exome Sequencing of Congenital Cataracts Related Genes: Broadening the Mutation Spectrum and Genotype-Phenotype Correlations in 27 Chinese Han Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(G) Reverse sequencing showed c.625 + 3A > G mutation of BFSP1gene in patients from family 19."
    explanation: Heterozygous splice-site variant in family 19.
  - reference: PMID:36161833
    reference_title: "Pathogenic genetic variants identified in Australian families with paediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel BFSP1 c.1124delA p.(Glu375GlyfsTer2) frameshift variant segregated in an autosomal dominant manner in family CSA182 (figure 1G)."
    explanation: Heterozygous frameshift in a dominant family.
animal_models:
- name: Bfsp1 (filensin) knockout mouse
  species: Mouse
  genotype: Bfsp1 exon 1 targeted deletion, homozygous and heterozygous, on wild-type Bfsp2 background
  publication: PMID:14638724
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Null and heterozygous mice develop age-dependent lens light scattering after normal fetal lens development.
    limitations: >-
      Mice develop scattering postnatally and progressively, whereas some human
      families have congenital cataract; human missense and splice alleles are
      not modelled.
    evidence:
    - reference: PMID:14638724
      reference_title: "Targeted deletion of the lens fiber cell-specific intermediate filament protein filensin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Filensin knockouts began to show evidence of light-scattering by 2 months and worsened with age."
      explanation: Knockout reproduces lens opacity.
diagnosis:
- name: Targeted cataract gene panel sequencing
  description: >-
    Clinical appearance does not distinguish BFSP1 cataract from other inherited
    cataracts; every reported BFSP1 allele after the first was found by
    sequencing panels of known cataract genes with Sanger confirmation and
    family segregation.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28450710
    reference_title: "Targeted Exome Sequencing of Congenital Cataracts Related Genes: Broadening the Mutation Spectrum and Genotype-Phenotype Correlations in 27 Chinese Han Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted next-generation sequencing in inherited congenital cataract patients provided significant diagnostic information."
    explanation: Panel sequencing study that identified the BFSP1 c.625+3A>G family.
  - reference: PMID:31842807
    reference_title: "Novel mutations identified in Chinese families with autosomal dominant congenital cataracts by targeted next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-eight genes associated with cataract were captured and sequenced in 5 typical nonsyndromic congenital cataract probands by targeted next-generation sequencing (NGS), and the results were confirmed by Sanger sequencing."
    explanation: Panel sequencing with Sanger confirmation identified the BFSP1 G602R family.
treatments:
- name: Cataract Surgery
  description: >-
    Removal of the opacified lens with optical correction is the standard
    management of visually significant congenital and juvenile cataract; no
    BFSP1-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
notes: >-
  No GeneReviews chapter covers BFSP1-related cataract. Two other Chinese
  families linked to chromosome 20p12.2-p11.23 (PMID:17167408, PMID:18958302)
  had no BFSP1 mutation and are not part of this entry. A review has raised the
  possibility that heterozygous carriers of recessive alleles are predisposed
  to early age-related nuclear cataract (PMID:17490642); this has not been
  tested.

name: Cataract 33
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms:
- CTRCT33
- BFSP1-related cataract
- filensin-related cataract
description: >-
  Non-syndromic early-onset cataract caused by pathogenic variants in BFSP1,
  which encodes filensin, one of the two lens-specific intermediate filament
  proteins that co-assemble with BFSP2 (CP49) into the beaded filament of lens
  fiber cells. Both biallelic (autosomal recessive) and heterozygous (autosomal
  dominant) families are reported. Recessive families carry frameshifting exon
  deletions or compound heterozygous alleles and present with juvenile or
  developmental cataract, in one family with microcornea; dominant families
  carry missense, splice-site or frameshift alleles and present with congenital
  nuclear, total, lamellar punctate or posterior sutural pulverulent cataract. Mouse
  filensin knockouts show that the beaded filament is dispensable for initial
  fiber cell differentiation but required to maintain fiber cell architecture
  and optical clarity with age.
disease_term:
  preferred_term: cataract 33
  term:
    id: MONDO:0012665
    label: cataract 33
parents:
- Early-onset non-syndromic cataract
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic BFSP1 loss-of-function alleles segregate with cataract in
    consanguineous Indian and Pakistani families (exon 6 and exons 3-5
    deletions) and in a compound heterozygous proband.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17225135
    reference_title: "Autosomal recessive juvenile onset cataract associated with mutation in BFSP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genome wide scan in a consanguineous family of Indian origin with autosomal recessive developmental cataracts was performed by two-point linkage analysis with 382 microsatellite markers."
    explanation: First BFSP1 family, segregating recessive developmental cataract.
  - reference: PMID:41553577
    reference_title: "Novel mega-deletion in BFSP1 causing autosomal recessive juvenile cataract in a Pakistani consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing and PCR were performed for all participants of the family which revealed the absence of the exons (3, 4, 5) in affected individuals and their presence in unaffected parents and siblings confirming the segregation of the mutation as autosomal recessive in the family under study."
    explanation: Second consanguineous family confirming recessive segregation.
- name: Autosomal Dominant
  description: >-
    Heterozygous BFSP1 missense, splice-site and frameshift variants segregate
    with congenital cataract in several Chinese and Australian families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24379646
    reference_title: "A novel beaded filament structural protein 1 (BFSP1) gene mutation associated with autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of autosomal dominant congenital cataract being associated with a mutation in BFSP1, highlighting the important role of BFSP1 for physiological lens function and optical properties."
    explanation: Five-generation family with heterozygous D348N establishes dominant inheritance.
  - reference: PMID:36161833
    reference_title: "Pathogenic genetic variants identified in Australian families with paediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel BFSP1 c.1124delA p.(Glu375GlyfsTer2) frameshift variant segregated in an autosomal dominant manner in family CSA182 (figure 1G)."
    explanation: Independent dominant family with a heterozygous frameshift allele.
pathophysiology:
- name: BFSP1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Recessive alleles are exon deletions predicted to shift the reading frame
    (exon 6; exons 3-5) or truncate the tail domain; dominant alleles include
    tail-domain missense (D348N, G602R), a splice-site variant and a tail-domain
    frameshift. In HEK293T cells the D348N mutant was expressed at lower levels
    than wild type. Whether dominant alleles act by haploinsufficiency or by
    interfering with filament co-assembly has not been resolved; mouse
    heterozygotes for a null allele do develop mild light scattering.
  genes:
  - preferred_term: BFSP1
    term:
      id: hgnc:1040
      label: BFSP1
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: DECREASED
  evidence:
  - reference: PMID:17225135
    reference_title: "Autosomal recessive juvenile onset cataract associated with mutation in BFSP1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing revealed a 3343 bp deletion including exon 6 (c.736-1384_c.957-66 del) predicted to result in a shift of the open reading frame."
    explanation: Recessive frameshifting deletion predicted to abolish normal filensin.
  - reference: PMID:41553577
    reference_title: "Novel mega-deletion in BFSP1 causing autosomal recessive juvenile cataract in a Pakistani consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The large deletion potentially forced the junction of exon 2 with exon 6 at mRNA level and resulting in the shift of open reading frame."
    explanation: Second recessive frameshifting deletion of BFSP1.
  - reference: PMID:26694549
    reference_title: "Sporadic and Familial Congenital Cataracts: Mutational Spectrum and New Diagnoses Using Next-Generation Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our patient (Family 46), the missense mutation affects the rod domain and the frameshift is predicted to lead to loss of part of the tail domain, highlighting the critical nature of these regions in the functions of BFSP1 required for lens clarity"
    explanation: Compound heterozygous rod-domain missense and tail-truncating alleles.
  - reference: PMID:37667037
    reference_title: "D348N Mutation of BFSP1 Gene in Congenital Cataract: it Does Matter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BFSP1 mutation significantly decreases the expression of BFSP1 protein, weakened the ability of cell proliferation and increased apoptosis."
    explanation: >-
      Reduced D348N protein expression in transfected HEK293T cells; a non-lens
      overexpression system, so the proliferation and apoptosis readouts are not
      taken as lens mechanism.
  downstream:
  - target: Beaded Filament Assembly Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14638724
      reference_title: "Targeted deletion of the lens fiber cell-specific intermediate filament protein filensin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Disruption of the filensin gene successfully blocked production of filensin mRNA, reduced levels of filensin's assembly partner CP49, and prevented the assembly of beaded filaments."
      explanation: Filensin loss in mouse directly prevents beaded filament assembly.
      directness: INDIRECT
- name: Beaded Filament Assembly Failure
  biological_scale: CELLULAR
  description: >-
    Filensin and CP49 do not form filaments alone; they co-assemble into the
    lens-specific beaded filament. Without filensin, CP49 levels fall and no
    beaded filaments form in fiber cells.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: DECREASED
  evidence:
  - reference: PMID:15777782
    reference_title: "Seeing is believing! The optical properties of the eye lens are dependent upon a functional intermediate filament cytoskeleton."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whilst CP49 self-assembles into thick bundles of filaments, filensin only forms short fibrils, but when combined together they form filaments."
    explanation: Review summarizing that filensin and CP49 must co-assemble to form filaments.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:14638724
    reference_title: "Targeted deletion of the lens fiber cell-specific intermediate filament protein filensin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The lens fiber cell-specific intermediate filament protein filensin is essential for beaded filament assembly."
    explanation: Knockout mouse conclusion that filensin is required for beaded filament assembly.
  downstream:
  - target: Loss of Fiber Cell Architecture and Long-Range Order
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18326727
      reference_title: "Resisting the effects of aging: a function for the fiber cell beaded filament."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The beaded filament is not required for the generation of the differentiated fiber cell phenotype but is required to maintain that differentiated state and the long range order that characterizes the lens at the tissue level."
      explanation: Filensin and phakosin knockout lenses lose fiber cell order after differentiation.
- name: Loss of Fiber Cell Architecture and Long-Range Order
  biological_scale: TISSUE
  description: >-
    In filensin-null mouse lenses, fiber cells elongate and lose organelles
    normally but later lose their differentiated phenotype and the long-range
    stacking needed for clarity. Beaded filament loss also alters lens size,
    shape, stiffness and the refractive index gradient.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:18326727
    reference_title: "Resisting the effects of aging: a function for the fiber cell beaded filament."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subsequent to those stages, however, fiber cells undergo loss of the differentiated fiber cell phenotype and loss of the long-range stacking that characterizes fiber cells and that has been considered essential for clarity."
    explanation: Direct morphological observation in filensin and phakosin knockout mice.
  - reference: PMID:15777782
    reference_title: "Seeing is believing! The optical properties of the eye lens are dependent upon a functional intermediate filament cytoskeleton."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Our results suggest that the lens-specific beaded filaments are the key cytoskeletal element in organising and maintaining lens fibre cell architecture and are a key factor in determining the optical properties of the lens."
    explanation: Review of Bfsp1 and Bfsp2 knockout work.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34087204
      reference_title: "Deletion of beaded filament proteins or the C-terminal end of Aquaporin 0 causes analogous abnormal distortion aberrations in mouse lens."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study reveals that loss of single or both beaded filament proteins significantly affect lens refractive index gradient, transparency and focusing ability in an age-dependent manner"
      explanation: Filensin knockout lenses lose transparency and focusing ability with age.
- name: Lens Light Scattering and Loss of Transparency
  biological_scale: TISSUE
  conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
  description: >-
    Light scattering begins after fetal development and worsens with age in
    filensin-null mice; heterozygous mice show a milder, later scattering. In
    patients this corresponds to congenital, infantile or juvenile lens
    opacity.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: maintenance of lens transparency
    term:
      id: GO:0036438
      label: maintenance of lens transparency
    modifier: DECREASED
  evidence:
  - reference: PMID:14638724
    reference_title: "Targeted deletion of the lens fiber cell-specific intermediate filament protein filensin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Filensin knockouts began to show evidence of light-scattering by 2 months and worsened with age."
    explanation: Progressive light scattering in homozygous filensin knockout mice.
  - reference: PMID:14638724
    reference_title: "Targeted deletion of the lens fiber cell-specific intermediate filament protein filensin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous animals exhibited an intermediate phenotype, showing a reduction in filensin transcript and moderate light-scattering at 5 months."
    explanation: Single-allele loss suffices for milder light scattering, relevant to dominant human alleles.
  - reference: PMID:19587458
    reference_title: "Functions of the intermediate filament cytoskeleton in the eye lens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Evidence generated in studies in both mice and humans suggests a critical role for these proteins and their filamentous polymers in establishing the optical properties of the eye lens and in maintaining its transparency."
    explanation: Review linking beaded filament proteins to lens transparency in mice and humans.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Developmental cataract
    causal_link_type: DIRECT
  - target: Juvenile cataract
    causal_link_type: DIRECT
  - target: Nuclear cataract
    causal_link_type: DIRECT
  - target: Lamellar cataract
    causal_link_type: DIRECT

name: MSH3-Related Attenuated Familial Adenomatous Polyposis
category: Mendelian
creation_date: "2026-11-26T18:30:00Z"
synonyms:
- familial adenomatous polyposis 4
- FAP4
- familial adenomatous polyposis type 4
- MSH3-related attenuated familial adenomatous polyposis
- MSH3-related AFAP
- MSH3-related attenuated FAP
- MSH3-related attenuated familial polyposis coli
description: >-
  An autosomal recessive, attenuated adenomatous polyposis caused by biallelic germline
  loss of function in MSH3. MSH3 is the partner subunit of MutS-beta (MSH2-MSH3), the
  mismatch-repair recognition complex for insertion-deletion loops; MutS-alpha
  (MSH2-MSH6), which handles base-base mismatches, is left intact. The resulting
  molecular phenotype is therefore not the MSI-high, mismatch-repair-deficient picture of
  Lynch syndrome but EMAST, instability at selected tetranucleotide repeats, on a
  background that reads microsatellite-stable on the standard five-marker panel with
  mismatch-repair protein immunohistochemistry retained. Unrepaired slippage products in
  short repeat tracts inside the APC coding sequence give somatic frameshift inactivation
  of APC, which releases beta-catenin and drives Wnt target transcription in colonic
  crypt stem cells. Clinically it presents in the fifth decade with a modest adenoma
  burden rather than the carpeting of classic APC polyposis, and colorectal and duodenal
  adenomas are the features reported consistently across the published families.
disease_term:
  preferred_term: familial adenomatous polyposis 4
  term:
    id: MONDO:0044300
    label: familial adenomatous polyposis 4
parents:
- Hereditary neoplastic syndrome
notes: >-
  Entry name. MONDO's label for this term is the opaque series name "familial
  adenomatous polyposis 4", but MONDO also carries "MSH3-related attenuated familial
  adenomatous polyposis" as a synonym, so an established gene-related name exists and
  the entry takes it; the series name and FAP4 are kept in synonyms. GeneReviews has no
  chapter for this disease from either the disease name or MSH3, so there is no
  mandatory phenotype baseline to mine and the entry is written from primary literature.
  Entry scope, and why it stops where it does. This covers the biallelic recessive
  polyposis only. ClinGen curated MSH3 against Lynch syndrome separately from MSH3
  against autosomal recessive FAP4, on the grounds of differing inheritance pattern and
  phenotypic variability, and dismech follows that split: Lynch_Syndrome covers the
  dominant mismatch-repair syndrome and Constitutional_Mismatch_Repair_Deficiency the
  biallelic mismatch-repair disease of childhood. Monoallelic MSH3 carriers are not
  covered here and have no established cancer risk.
  Why no phenotype frequencies are recorded. The reported patient set is small and
  spread across single-family reports, and no individual publication states a frequency
  for any feature. A pooled proportion across those reports would be a figure this entry
  originated rather than cited, so each phenotype row carries the per-report observation
  and its citation instead, and the extracolonic features are marked as resting on one
  or two families where that is what the source shows.
  Mouse gene identifiers are absent from the animal-model records deliberately. The
  Alliance of Genome Resources API was unreachable from the curation environment
  (`/api/gene/MGI:...` returned an empty record and `/api/search` returned zero results
  for every query), and this repository's term validator does not check MGI labels, so a
  binding written from memory would pass every gate unverified. The models are identified
  by species, genotype and publication instead.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both MSH3 alleles must be inactivated. Reported patients are compound heterozygous
    for two loss-of-function alleles, with affected siblings of the same genotype and
    unaffected heterozygous parents.
  evidence:
  - reference: PMID:27476653
    reference_title: "Exome Sequencing Identifies Biallelic MSH3 Germline Mutations as a Recessive Subtype of Colorectal Adenomatous Polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pedigrees, genotypes, and frequency of MSH3 mutations in the general population are consistent with an autosomal-recessive mode of inheritance."
    explanation: >-
      The index report states the inheritance conclusion directly, from pedigree
      structure and population allele frequency together.
genetic:
- name: MSH3
  gene_term:
    preferred_term: MSH3
    term:
      id: hgnc:7326
      label: MSH3
  relationship_type: CAUSATIVE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_3ec777aa-af6a-4cc6-ace1-b22e4b493457-2024-08-29T170000.000Z
    evidence:
    - reference: CGGV:assertion_3ec777aa-af6a-4cc6-ace1-b22e4b493457-2024-08-29T170000.000Z
      reference_title: "MSH3 / familial adenomatous polyposis 4 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MSH3 | HGNC:7326 | familial adenomatous polyposis 4 | MONDO:0044300 | AR | Definitive"
      explanation: >-
        The ClinGen Hereditary Cancer GCEP gene-disease validity row for this exact
        gene-disease pair and inheritance mode.
  evidence:
  - reference: PMID:27476653
    reference_title: "Exome Sequencing Identifies Biallelic MSH3 Germline Mutations as a Recessive Subtype of Colorectal Adenomatous Polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two unrelated individuals with differing compound-heterozygous loss-of-function (LoF) germline mutations in the mismatch-repair gene MSH3."
    explanation: >-
      The founding observation: biallelic MSH3 loss of function in previously
      unexplained adenomatous polyposis.
  - reference: PMID:37402566
    reference_title: "MSH3: a confirmed predisposing gene for adenomatous polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The negative EMAST phenotype ruled out the diagnosis of germline MSH3 deficiency for two patients: one homozygous for a benign variant and one with a monoallelic large deletion."
    explanation: >-
      Independent confirmation series, and the sentence showing that a monoallelic
      deletion does not produce the disease phenotype.
  - reference: PMID:31243857
    reference_title: "Contribution to colonic polyposis of recently proposed predisposing genes and assessment of the prevalence of NTHL1- and MSH3-associated polyposes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "highly infrequent"
    explanation: >-
      A screen of unrelated polyposis patients found biallelic MSH3 variants highly
      infrequent, which is why the disease is rare even within polyposis clinics.
  - reference: PMID:40237887
    reference_title: "Genetics, genomics and clinical features of adenomatous polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Available evidence for MSH3, although limited, suggests no increased risk of cancer in MSH3 heterozygotes."
    explanation: >-
      Sources the scope boundary this entry draws at the single-allele carrier: a
      current review of adenomatous polyposis genetics finds no established cancer risk
      in MSH3 heterozygotes, and says the evidence for it is limited.
  notes: >-
    Biallelic loss-of-function variants, reported as frameshift, nonsense and canonical
    splice-site alleles. MSH3 encodes the MutS-beta partner of MSH2; its loss removes
    insertion-deletion loop recognition while leaving MutS-alpha intact.
    The gene identifier is hgnc:7326, read from HGNC and from the ClinGen validity row
    quoted above. The deep-research report behind this entry wrote HGNC:7329 beside MSH3
    in its header, which `just preflight-dr` flagged as naming a different gene; that
    identifier was not used.
pathophysiology:
- name: Biallelic MSH3 Loss of Function
  description: >-
    Two inactivating MSH3 alleles leave no functional MSH3 protein in any nucleated
    cell, shown as complete loss of nuclear MSH3 staining in both normal and tumour
    tissue from affected individuals.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: MSH3
    term:
      id: hgnc:7326
      label: MSH3
  downstream:
  - target: MutS-beta Complex Failure
    causal_link_type: DIRECT
    description: >-
      MSH3 is the obligate partner subunit of MutS-beta, so its absence prevents the
      complex from assembling.
  evidence:
  - reference: PMID:27476653
    reference_title: "Exome Sequencing Identifies Biallelic MSH3 Germline Mutations as a Recessive Subtype of Colorectal Adenomatous Polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a complete loss of nuclear MSH3 in normal and tumor tissue"
    explanation: >-
      Immunohistochemistry establishes that the germline alleles abolish the protein in
      vivo, rather than only being predicted to.
- name: MutS-beta Complex Failure
  description: >-
    Without MSH3 the MSH2-MSH3 heterodimer cannot form. MutS-alpha (MSH2-MSH6) is
    unaffected, which is what separates this disease from the Lynch-syndrome
    mismatch-repair defects and leaves mismatch-repair protein immunohistochemistry
    retained.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: MutS-beta complex
    term:
      id: GO:0032302
      label: MutSbeta complex
    modifier: DECREASED
  downstream:
  - target: Insertion-Deletion Loop Repair Failure
    causal_link_type: DIRECT
    description: >-
      MutS-beta is the complex that recognises insertion-deletion loops, so losing it
      removes that recognition step.
  - target: Impaired Homologous Recombination at Structured Break Ends
    causal_link_type: DIRECT
    description: >-
      MutS-beta carries a second, separate function in homologous recombination, which
      is lost at the same time.
- name: Insertion-Deletion Loop Repair Failure
  description: >-
    Loss of MutS-beta removes recognition of the insertion-deletion loops that
    polymerase slippage generates at di- and tetranucleotide repeats. Base-base mismatch
    repair is preserved, so the repair defect is specific to this lesion class.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mismatch repair
    term:
      id: GO:0006298
      label: mismatch repair
    modifier: DECREASED
  molecular_functions:
  - preferred_term: DNA insertion or deletion binding
    term:
      id: GO:0032135
      label: DNA insertion or deletion binding
    modifier: DECREASED
  downstream:
  - target: EMAST Tetranucleotide Repeat Instability
    causal_link_type: DIRECT
    description: >-
      Slippage products left unrepaired accumulate as length changes at repeat tracts.
  evidence:
  - reference: PMID:10706084
    reference_title: The DNA mismatch repair genes Msh3 and Msh6 cooperate in intestinal tumor suppression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Cells from Msh3-/- mice are defective in repair of insertion/ deletion mismatches but can repair base-base mismatches."
    explanation: >-
      Establishes the specificity of the repair defect — indels impaired, base-base
      mismatches intact — which is the mechanistic basis for EMAST without MSI-high.
- name: EMAST Tetranucleotide Repeat Instability
  description: >-
    Elevated microsatellite alterations at selected tetranucleotide repeats, present in
    normal as well as tumour tissue, on a background that is microsatellite-stable by
    the standard five-marker panel.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: maintenance of DNA repeat elements
    term:
      id: GO:0043570
      label: maintenance of DNA repeat elements
    modifier: DECREASED
  downstream:
  - target: Somatic APC Frameshift Inactivation
    causal_link_type: DIRECT
    description: >-
      The same slippage that destabilises repeat tracts genome-wide inactivates APC
      where those tracts fall inside its coding sequence.
  evidence:
  - reference: PMID:27476653
    reference_title: "Exome Sequencing Identifies Biallelic MSH3 Germline Mutations as a Recessive Subtype of Colorectal Adenomatous Polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "high microsatellite instability of di- and tetranucleotides (EMAST), and immunohistochemical staining illustrated a complete loss of nuclear MSH3 in normal and tumor tissue, confirming the LoF effect and causal relevance of the mutations."
    explanation: >-
      Reports the EMAST phenotype in patient tissue together with the MSH3 protein loss
      that causes it.
  - reference: PMID:18922920
    reference_title: Genetic instability caused by loss of MutS homologue 3 in human colorectal cancer.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "MSH3) knockdown or MSH3-deficient cells exhibit the EMAST phenotype and low levels of mutations at dinucleotide repeats."
    explanation: >-
      Shows the EMAST phenotype follows from loss of MSH3 in colorectal cells,
      independent of the germline context.
- name: Somatic APC Frameshift Inactivation
  description: >-
    Insertions and deletions in short repetitive tracts within the APC coding sequence
    inactivate the gene somatically in colonic crypt stem cells. In adenomas from
    affected individuals the APC variants are predominantly small deletions, and their
    enrichment in repetitive sequence context exceeds that seen in APC-driven polyposis.
    This is the transforming event, and the colonic crypt stem cell is where it happens.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: colonic crypt base columnar stem cell
    term:
      id: CL:0009043
      label: intestinal crypt stem cell of colon
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  downstream:
  - target: Constitutive Wnt Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Loss of APC removes the scaffold of the beta-catenin destruction complex.
  evidence:
  - reference: PMID:34843512
    reference_title: Variant profiling of colorectal adenomas from three patients of two families with MSH3-related adenomatous polyposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In MSH3-deficient adenomas, the occurrence of APC indels in a repetitive sequence context was significantly higher than in FAP patients (p < 0.01)."
    explanation: >-
      Exome sequencing of adenomas from affected patients shows the APC hits are indels
      in repeat context, which is the signature the MutS-beta defect predicts.
- name: Constitutive Wnt Pathway Activation
  description: >-
    APC inactivation stabilises beta-catenin and drives TCF/LEF-dependent Wnt target
    transcription in the crypt stem cell compartment.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: INCREASED
  cell_types:
  - preferred_term: colonic crypt base columnar stem cell
    term:
      id: CL:0009043
      label: intestinal crypt stem cell of colon
  downstream:
  - target: Dysplastic Colonic Crypt Expansion
    causal_link_type: DIRECT
    description: >-
      Unrestrained Wnt signalling in the crypt stem cell compartment produces clonal
      expansion and dysplastic crypts.
  mechanism_confidence: PROVISIONAL
  notes: >-
    No evidence item is attached because beta-catenin stabilisation has not been measured
    in adenomas from MSH3-deficient patients; the step is general colorectal adenoma
    biology applied to this disease. It is kept as a node because the chain from somatic
    APC loss to adenoma is not interpretable without it, and `mechanism_confidence:
    PROVISIONAL` records that it is inferred here rather than demonstrated.
- name: Dysplastic Colonic Crypt Expansion
  description: >-
    Clonal expansion of crypts carrying somatic APC inactivation, growing into tubular
    and tubulovillous adenomas. Continued indel accumulation in the expanded clones,
    striking further early-carcinogenesis drivers, carries a subset through to invasive
    carcinoma.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: colonic crypt base columnar stem cell
    term:
      id: CL:0009043
      label: intestinal crypt stem cell of colon
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  downstream:
  - target: Adenomatous colonic polyposis
    causal_link_type: DIRECT
    description: >-
      The accumulated dysplastic crypts are the adenomas counted at colonoscopy.
  - target: Colorectal carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A subset of adenomas progresses to invasive carcinoma as further drivers are hit.
  evidence:
  - reference: PMID:34843512
    reference_title: Variant profiling of colorectal adenomas from three patients of two families with MSH3-related adenomatous polyposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the MSH3-deficient adenomas harboured one to five (recurrent) somatic variants in 13 established or candidate driver genes for early colorectal carcinogenesis, including ACVR2A and ARID genes."
    explanation: >-
      The adenomas profiled here are the lesions this node describes, and they carry
      recurrent somatic variants in further early-carcinogenesis drivers besides APC,
      which is what carries a subset on toward carcinoma.
- name: Impaired Homologous Recombination at Structured Break Ends
  description: >-
    Beyond indel mismatch repair, MutS-beta is required for homologous recombination
    when double-strand-break ends carry secondary structures, and is recruited to common
    fragile sites under replication stress. Loss of MSH3 therefore adds a
    double-strand-break repair deficit to the indel mutator phenotype. Whether this
    contributes to the extracolonic lesions reported in affected individuals has not
    been measured.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  evidence:
  - reference: PMID:38038265
    reference_title: "MutSβ protects common fragile sites by facilitating homology-directed repair at DNA double-strand breaks with secondary structures."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, MutSβ is required for homologous recombination (HR) especially when DNA double-strand break (DSB) ends contain secondary structures."
    explanation: >-
      Establishes the second MutS-beta function, independent of the indel
      mismatch-repair role carried by the nodes above.
  - reference: PMID:24013230
    reference_title: "The MutSβ complex is a modulator of p53-driven tumorigenesis through its functions in both DNA double-strand break repair and mismatch repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MutSβ"
    explanation: >-
      Independent work placing MutS-beta in double-strand-break repair as well as
      mismatch repair, which is the dual role this node asserts.
phenotypes:
- category: Neoplastic
  name: Adenomatous colonic polyposis
  description: >-
    Multiple colorectal adenomas, reported as a modest burden rather than the carpeting
    of classic APC polyposis, and identified in the fifth decade. It is the feature
    present in every reported family.
  phenotype_term:
    preferred_term: Adenomatous colonic polyposis
    term:
      id: HP:0005227
      label: Adenomatous colonic polyposis
  evidence:
  - reference: PMID:35675019
    reference_title: A large family with MSH3-related polyposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "of a third family, the largest thus far, with adenomatous polyposis related to compound heterozygous MSH3 pathogenic variants. The index patient was a 55-years old male diagnosed with rectal cancer and adenomatous polyposis"
    explanation: >-
      The largest reported family, establishing adenomatous polyposis as the presenting
      feature alongside rectal cancer in the index case.
- category: Neoplastic
  name: Colorectal carcinoma
  description: >-
    Colorectal or rectal adenocarcinoma arising in the adenomatous field, reported in
    several of the published families.
  phenotype_term:
    preferred_term: Neoplasm of the colon
    term:
      id: HP:0100273
      label: Neoplasm of the colon
    coarse_binding_basis: SOURCE_UNSPECIFIED
  evidence:
  - reference: PMID:35675019
    reference_title: A large family with MSH3-related polyposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index patient was a 55-years old male diagnosed with rectal cancer and adenomatous polyposis"
    explanation: >-
      Rectal carcinoma in the index patient of the largest reported family.
  notes: >-
    Bound to the coarse HP:0100273 because the reported cases span colonic and rectal
    primaries and the sources do not consistently separate them, so a more specific term
    would assert a site distribution the reports do not establish.
- category: Neoplastic
  name: Duodenal polyposis
  description: >-
    Duodenal adenomas or frank duodenal polyposis, the most consistently reported
    extracolonic gastrointestinal feature.
  phenotype_term:
    preferred_term: Duodenal polyposis
    term:
      id: HP:0004783
      label: Duodenal polyposis
  evidence:
  - reference: PMID:37402566
    reference_title: "MSH3: a confirmed predisposing gene for adenomatous polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had attenuated colorectal adenomatous polyposis, with duodenal polyposis in two cases."
    explanation: >-
      States the duodenal involvement and its denominator within the confirmation
      series, alongside the colorectal polyposis every patient had.
- category: Other
  name: Hepatic and renal cysts
  description: >-
    Simple liver and kidney cysts, reported in a single patient alongside two basal cell
    carcinomas. Recorded because the reporting author raises extraintestinal lesions as
    a possible part of the phenotype, not because a risk has been established.
  phenotype_term:
    preferred_term: Renal cyst
    term:
      id: HP:0000107
      label: Renal cyst
  evidence:
  - reference: PMID:37597744
    reference_title: MSH3-related adenomatous polyposis in a patient with the negative family history of colorectal polyps.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "benign and malignant extraintestinal lesions may be common as our patient had simple liver and kidney cysts and two basal cell skin carcinomas."
    explanation: >-
      The single-patient observation, quoted with the author's own hedge that these
      lesions "may be" common rather than are.
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Breast carcinoma has been reported in affected women. Biologically this is plausible
    through the homologous-recombination arm of MutS-beta function rather than the indel
    mutator phenotype, but the observation rests on a single small series and should be
    read as hypothesis-generating rather than as an established tumour risk.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:37402566
    reference_title: "MSH3: a confirmed predisposing gene for adenomatous polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both women had breast carcinomas"
    explanation: >-
      The only direct statement of breast carcinoma in affected individuals; both women
      in a five-patient series were affected.
diagnosis:
- name: EMAST testing with microsatellite-stable five-marker panel
  description: >-
    The discriminating result is instability at tetranucleotide repeats together with
    microsatellite stability on the standard five-marker panel and retained MLH1, MSH2,
    MSH6 and PMS2 immunohistochemistry, because MutS-alpha remains intact. Adenoma count
    alone does not separate this disease from its differential diagnoses, whose ranges
    overlap it.
  evidence:
  - reference: PMID:37402566
    reference_title: "MSH3: a confirmed predisposing gene for adenomatous polyposis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The negative EMAST phenotype ruled out the diagnosis of germline MSH3 deficiency for two patients: one homozygous for a benign variant and one with a monoallelic large deletion."
    explanation: >-
      Demonstrates the test being used to exclude the diagnosis in variant carriers,
      which is the clinical use this row describes.
  - reference: PMID:34537247
    reference_title: "Lack of correlation between MSH3 immunohistochemistry and microsatellite analysis for the detection of elevated microsatellite alterations at selected tetranucleotide repeats (EMAST) in colorectal cancers."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSH3 immunostaining was compromised in areas of tissue crush and autolysis, which are common in biopsy and surgical samples, potentially mitigating against its routine use."
    explanation: >-
      Supports the caveat below that MSH3 immunohistochemistry is not a substitute for
      the microsatellite analysis, by naming the specific preanalytical failure mode.
  notes: >-
    MSH3 immunohistochemistry on its own is not a substitute for the microsatellite
    analysis: in unselected colorectal cancers the two methods agree poorly and staining
    is degraded by tissue crush and autolysis, so in a patient already carrying two MSH3
    variants the EMAST result is the confirmatory test rather than the stain.
differential_diagnoses:
- name: Classic and attenuated APC-associated polyposis
  description: >-
    Dominantly inherited, with no repeat-instability signature. Classic APC polyposis
    carries far more adenomas and presents two to three decades earlier; the attenuated
    form overlaps MSH3 disease in both count and decade, so inheritance pattern and the
    EMAST result are what separate them.
- name: MUTYH-associated polyposis
  description: >-
    Also autosomal recessive with an overlapping adenoma count and decade, so
    inheritance does not discriminate. The somatic signature does: base excision repair
    loss gives C:G to A:T transversions rather than repeat-tract indels.
- name: NTHL1-related tumour predisposition
  description: >-
    Recessive, overlapping adenoma burden, and a distinct base-excision-repair somatic
    signature. Reported alongside MSH3 in the same polyposis-cohort screens.
- name: Lynch syndrome
  description: >-
    The mismatch-repair differential most easily conflated with this disease, because
    both involve MMR genes. Lynch syndrome is dominant, carries few or no adenomas, and
    gives MSI-high tumours with loss of a mismatch-repair protein on immunohistochemistry
    — the opposite of the microsatellite-stable, IHC-retained picture here.
  evidence:
  - reference: CGGV:assertion_3ec777aa-af6a-4cc6-ace1-b22e4b493457-2024-08-29T170000.000Z
    reference_title: "MSH3 / familial adenomatous polyposis 4 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found differences in inheritance pattern and phenotypic variability."
    explanation: >-
      ClinGen's stated basis for curating MSH3-Lynch syndrome separately from MSH3-FAP4,
      which is the same distinction this row draws.
- name: Constitutional mismatch repair deficiency
  description: >-
    Biallelic loss of a MutS-alpha or MutL pathway gene, presenting in childhood with
    brain tumours and haematological malignancy. Shares the recessive mismatch-repair
    architecture but not the age of onset or the tumour spectrum.

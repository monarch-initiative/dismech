discussions:
- discussion_id: msh3_mouse_apc_spectrum_without_polyposis
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does removing Msh3 shift the somatic Apc mutation spectrum in mice without
    producing any increase in intestinal tumour burden, when biallelic MSH3 loss in
    people causes an adenomatous polyposis?
  rationale: >-
    The Apc1638N cross establishes the mechanistic step this entry's pathograph depends
    on — Msh3 suppresses frameshift mutation of Apc — and in the same experiment fails to
    reproduce the disease that step is supposed to cause. That is not simply a weak
    model: it is informative at the molecular scale and contradictory at the organism
    scale, so the human pathograph's final link has no animal support. Two explanations
    fit and neither has been tested. Murine Msh6 may cover enough short-indel repair in
    vivo to hold the residual mutation burden below the adenoma-initiation threshold
    across a murine lifespan, or the human APC coding sequence may carry repeat tracts
    more slippage-prone than the mouse orthologue.
  attaches_to:
  - pathophysiology#Dysplastic Colonic Crypt Expansion
  - pathophysiology#Somatic APC Frameshift Inactivation

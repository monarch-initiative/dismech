notes: >-
  Seven things about this entry are deliberate.

  First, **it is a standalone entry and not a `has_subtypes` row on
  `Severe_Combined_Immunodeficiency`.** MONDO:0010730 resolves through its
  cross-references to OMIM 312863, the moderate X-linked combined immunodeficiency
  of Brooks et al., which is a different OMIM entity from SCIDX1 (300400). The
  1990 report says in its own abstract that the disorder is "distinct from
  previously reported disorders", and the 1995 report that found the gene concludes
  the allele gives "a less severe degree of deficiency in cellular and humoral
  immunity than that seen in XSCID". Filing it as a subtype of severe combined
  immunodeficiency would assert the opposite of what both defining papers say.
  `Severe_Combined_Immunodeficiency.yaml` already carries an `X-linked SCID`
  subtype bound to `MONDO:0010315`, which is the X-SCID concept, so this entry does
  not duplicate it.

  Second, **MONDO's placement of this term disagrees with that reading and is worth
  flagging.** MONDO:0010730's only parent is `MONDO:0044200` T-B+ severe combined
  immunodeficiency, which would make XCID a kind of SCID. The stub for this
  concept carries that parent. This entry follows the primary literature instead;
  anyone who thinks MONDO is right should reopen the lump/split call rather than
  assume it was overlooked.

  Third, **no phenotype carries a `frequency` band.** The literature specific to
  this entity is one American family of five affected males, one German family of
  three brothers, and two follow-up immunology papers on the first family. Several
  phenotypes here rest on one family and say so in their `explanation`.

  Fourth, **the `Somatic Reversion in the T Cell Lineage` node is not part of the
  causal chain and should not be read as one.** It has no `downstream` edges
  because it does not cause anything in this pathograph: it is a partially
  compensating event that the authors of the German family's report hold jointly
  responsible, with the hypomorphic allele, for how mild the phenotype was. It is
  curated because it is why genotype does not predict phenotype here - the three
  brothers carried the same variant and differed markedly.

  Fifth, **the coding-DNA notation for p.Leu271Gln is a reconstruction and is
  labelled as such.** The 1995 paper reports the allele by amino acid position and
  codon change (CTG to CAG in exon 7), not by a c. identifier. The `genetic`
  record's `notes` says so rather than presenting c.812T>A as if it were quoted.

  Sixth, **one claim in `diagnosis` is a curator inference and is marked.** No
  cited source says this disorder escapes X-SCID newborn screening; that is a
  reading of the reported low-normal lymphocyte counts and the diagnosis at age 19.
  The record's own `notes` flags it.

  Seventh, **the deep-research run used a disambiguated query and that was
  necessary.** "X-linked combined immunodeficiency" and "X-linked severe combined
  immunodeficiency" differ by one word and share a gene, and a provider asked for
  the former will happily return the latter. The `falcon` run behind
  `research/X-Linked_Combined_Immunodeficiency-deep-research-falcon.md` was given
  a `disease_name` naming XCID, CIDX, OMIM 312863, the hypomorphic IL2RG common
  gamma chain, Brooks 1990, and an explicit "not SCIDX1 OMIM 300400". It came
  back on target - `just preflight-dr` PASSes with IL2RG mentioned 48 times, and
  the report carries both OMIM numbers because the contrast was asked for. Two
  cautions for anyone mining it: its term validation flags `HP:0005351` as
  unresolvable, so that CURIE must not be bound, and only 7 of its 13 verified
  references were judged on topic. Nothing in this entry is bound from the report;
  every evidence item traces to one of the five cached primary sources.

  Two things left out. `PMID:1348030` and `PMID:1606754`, the T-cell receptor
  repertoire and postnatal T-cell development studies on the index family, are
  listed in `references` but carry no evidence item: both are cached as
  abstract-only records under a thousand characters, and neither abstract contains
  a sentence that adds a claim this entry does not already support from the 1990
  paper. And no treatment record covers haematopoietic stem cell transplantation or
  gene therapy: transplantation is the definitive therapy for X-SCID, but no cited
  source reports it in a patient with this entity, and the one source that
  discusses gene correction here raises it as a future option should the patient's
  condition deteriorate.

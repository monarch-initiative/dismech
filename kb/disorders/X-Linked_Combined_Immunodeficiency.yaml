genetic:
- name: IL2RG
  gene_term:
    preferred_term: IL2RG
    term:
      id: hgnc:6010
      label: IL2RG
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  notes: >-
    The same gene as X-linked severe combined immunodeficiency; what differs is the
    allele. Two variants are documented in this phenotype, both missense and both
    hypomorphic rather than null: c.812T>A p.Leu271Gln in exon 7, in the
    SH2-subdomain homology region of the cytoplasmic tail, in the index American
    family, and c.458T>C p.Ile153Thr in a German family. Note that the exon-7
    substitution is reported by amino acid position and codon change (CTG to CAG)
    rather than by a coding-DNA identifier in the source, so the c. notation above
    is a reconstruction and should be treated as such. The hypomorphic
    classification is supported functionally for p.Ile153Thr, where surface CD132
    expression is normal and STAT5 phosphorylation only partially impaired; for
    p.Leu271Gln it rests on the clinical and immunologic comparison with X-SCID
    rather than on a signalling assay.
  evidence:
  - reference: PMID:7883965
    reference_title: "Missense mutation in exon 7 of the common gamma chain gene causes a moderate form of X-linked combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and immunologic features of a recently recognized X-linked combined immunodeficiency disease (XCID) suggested that XCID and X-linked severe combined immunodeficiency (XSCID) might arise from different genetic defects.
    explanation: >-
      Records that the two entities were initially expected to have different genes,
      which is the background to the finding that they share one.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lately, hypomorphic mutations of the IL2RG gene have been described causing atypical SCID with a milder phenotype.
    explanation: >-
      The allele class this entry is about, and the reason it is separated from
      X-linked severe combined immunodeficiency.
diagnosis:
- name: Molecular testing of IL2RG
  description: >-
    The diagnosis is molecular. Both documented families were resolved by
    sequencing IL2RG, in the German family by next-generation sequencing after a
    combined immunodeficiency had been suspected clinically. Because the phenotype
    is mild and lymphocyte counts may be only low-normal, the disorder is not caught
    by the newborn screening logic built for X-SCID and was recognised in the German
    proband only at age 19.
  evidence:
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation combined with dysgammaglobulinemia suspected an inherited immunity disorder, which has been proven by Next Generation Sequencing as a novel c.458T > C; p.Ile153Thr IL2RG missense-mutation.
    explanation: The diagnostic route in the German family.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, some form of cellular immunodeficiency was firstly suspected in P1 at the age of 19 years.
    explanation: >-
      The age at which the diagnosis was first suspected, supporting the diagnostic
      delay this record describes.
  notes: >-
    The statement that the disorder escapes X-SCID newborn screening is a reading of
    the reported diagnostic delay and low-normal counts, not something any cited
    source asserts about screening programmes. Treat it as a curator inference.

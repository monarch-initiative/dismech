inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected males, carrier females. X-chromosome inactivation in obligate carriers
    is non-random in T and B lymphocytes, as it is in X-linked severe combined
    immunodeficiency, which is what first pointed the index family's investigators
    at the same locus.
  evidence:
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, affected males in this family carry an abnormal gene on their X chromosome that results in a combined immunodeficiency that is distinct from previously reported disorders.
    explanation: >-
      X-linked transmission in the family that defines the entity, and the claim of
      distinctness from the previously described X-linked immunodeficiencies.
  - reference: PMID:7883965
    reference_title: "Missense mutation in exon 7 of the common gamma chain gene causes a moderate form of X-linked combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As in XSCID, X-chromosome inactivation in obligate carriers of XCID was nonrandom in T and B lymphocytes.
    explanation: >-
      Non-random X inactivation in carriers, the observation that localised the
      defect and is characteristic of X-linked lymphocyte-intrinsic disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population estimate exists for this entity. What is quantified is the share
    of IL2RG alleles that behave hypomorphically rather than as nulls: roughly one
    in ten of the reported IL2RG mutations has been associated with an atypical,
    highly variable immune phenotype. That is a proportion of alleles, not a
    disease rate, and it is recorded here because it is the only number available.
  evidence:
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 10% of the reported IL2RG mutations have been associated with atypical and highly variable immune phenotypes that are described as hypomorphic mutations, which impair but do not abrogate protein function, obscure and mitigate clinical presentation of the disease
    explanation: >-
      The share of IL2RG alleles that produce the attenuated phenotype this entry
      curates, which is the closest available proxy for how common it is.
pathophysiology:
- name: Hypomorphic IL2RG Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A hemizygous missense change in IL2RG that impairs, without abolishing, common
    gamma chain function. Two are documented in this phenotype: p.Leu271Gln, in the
    SH2-subdomain homology region of the cytoplasmic tail encoded by exon 7, in the
    index American family; and p.Ile153Thr in a German family.
  genes:
  - preferred_term: IL2RG
    term:
      id: hgnc:6010
      label: IL2RG
  downstream:
  - target: Partial Loss of Common Gamma Chain Signalling
    causal_link_type: DIRECT
    description: >-
      The variant reduces signal transduction through the receptors that share the
      chain without eliminating it.
  - target: Somatic Reversion in the T Cell Lineage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The point mutation is the substrate on which spontaneous reversion acts.
      Nothing in the cited work explains why reversion occurred, and the authors
      note that the same reversion arising independently in three brothers is
      statistically improbable, so the edge records that the reversion is of this
      allele, not a mechanism by which the allele causes it.
  evidence:
  - reference: PMID:7883965
    reference_title: "Missense mutation in exon 7 of the common gamma chain gene causes a moderate form of X-linked combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense mutation in the region coding for the cytoplasmic portion of the gamma c gene was found in three affected males but not in a normal brother.
    explanation: >-
      Identifies the causal allele in the index family and its segregation with
      disease.
  - reference: PMID:7883965
    reference_title: "Missense mutation in exon 7 of the common gamma chain gene causes a moderate form of X-linked combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the replacement of leucine 271 by a glutamine"
    explanation: The specific substitution, from the figure describing the sequencing result.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation combined with dysgammaglobulinemia suspected an inherited immunity disorder, which has been proven by Next Generation Sequencing as a novel c.458T > C; p.Ile153Thr IL2RG missense-mutation.
    explanation: The second documented hypomorphic allele, in an independent family.
- name: Partial Loss of Common Gamma Chain Signalling
  biological_scale: MOLECULAR
  description: >-
    The common gamma chain is the shared subunit of the IL-2, IL-4, IL-7, IL-9,
    IL-15 and IL-21 receptors and signals through JAK3 and STAT5. In this disorder
    the chain is still expressed at the cell surface at normal levels, and it is
    downstream STAT5 phosphorylation that is partially impaired. That residual
    signalling is what separates this entity from X-linked severe combined
    immunodeficiency, where the pathway is abolished.
  biological_processes:
  - preferred_term: cytokine receptor signaling via JAK-STAT
    modifier: DECREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  downstream:
  - target: Reduced Peripheral T Cell Pool
    causal_link_type: DIRECT
    description: >-
      IL-7 receptor signalling through the common gamma chain drives thymic T cell
      development and peripheral T cell survival.
  - target: Impaired T Cell Activation and Proliferation
    causal_link_type: DIRECT
    description: >-
      IL-2 receptor signalling through the same chain drives the proliferative
      response of activated T cells.
  evidence:
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, investigation of various subpopulations showed normal expression of CD132 but with partially impaired STAT5 phosphorylation compared to healthy controls.
    explanation: >-
      The measurement behind this node: surface expression preserved, downstream
      signalling only partially lost. Graded in vitro because it is a stimulation
      assay on isolated patient cell subsets.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it encodes for the common gamma chain (γC) which is a subunit of various interleukin receptors, such as IL-2, IL-4, IL-7, IL-9, IL-15, and IL-21
    explanation: >-
      The receptors that share the chain, which is why a single subunit defect
      produces a combined rather than a selective immunodeficiency.
  - reference: PMID:7883965
    reference_title: "Missense mutation in exon 7 of the common gamma chain gene causes a moderate form of X-linked combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, this point mutation in the gamma c gene leads to a less severe degree of deficiency in cellular and humoral immunity than that seen in XSCID.
    explanation: >-
      States the partial rather than complete loss that this node asserts, and the
      contrast with X-SCID on which this entry's separation from that entity rests.
- name: Reduced Peripheral T Cell Pool
  biological_scale: CELLULAR
  description: >-
    A partly populated T cell compartment. CD4+ and CD8+ counts are reduced, with
    the naive CD45RA+ subsets disproportionately affected; T-cell receptor excision
    circles are low and the T-cell receptor repertoire is skewed, both indicating
    reduced thymic output rather than peripheral loss alone. B cell and NK cell
    numbers are normal, which is why the disorder is T-cell-led despite the
    receptor being shared across lineages.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030217
      label: T cell differentiation
  downstream:
  - target: Decreased CD4+ T Cell Count
    causal_link_type: DIRECT
  - target: Decreased CD8+ T Cell Count
    causal_link_type: DIRECT
  - target: Decreased Naive T Cell Proportion
    causal_link_type: DIRECT
  - target: Paucity of Lymphoid Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Persistent Sinopulmonary and Cutaneous Viral Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal immunologic features of the disorder were normal concentrations of serum immunoglobulins but restricted formation of IgG antibodies to immunogens; normal numbers of B cells and NK cells but decreased numbers of CD4+ and CD8+ T lymphocytes, particularly the CD45RA+ subpopulations; diminished proliferative responses of blood T cells to allogeneic cells, mitogens and antigens; and decreased production of IL-2 by mitogen stimulated blood lymphocytes.
    explanation: >-
      The immunologic profile of the index family, which is the source for the cell
      counts, the naive-subset loss and the preserved B and NK compartments.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent functional characterization revealed impaired T-cell proliferation, low TREC levels and a skewed TCR Vβ repertoire in all three patients.
    explanation: >-
      Low excision circles and a skewed repertoire in an independent family, which
      is what makes this a thymic-output defect rather than peripheral depletion.
- name: Impaired T Cell Activation and Proliferation
  biological_scale: CELLULAR
  description: >-
    The T cells that are present respond poorly. Proliferative responses to
    allogeneic cells, mitogens and antigens are diminished, and IL-2 production by
    mitogen-stimulated blood lymphocytes is reduced, so the defect is qualitative as
    well as quantitative.
  biological_processes:
  - preferred_term: T cell activation
    modifier: DECREASED
    term:
      id: GO:0042110
      label: T cell activation
  downstream:
  - target: Abnormal T Cell Proliferation
    causal_link_type: DIRECT
  - target: Defective T Cell Help for Antibody Production
    causal_link_type: DIRECT
    description: >-
      Antibody responses to protein immunogens depend on activated helper T cells.
  - target: Persistent Sinopulmonary and Cutaneous Viral Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal immunologic features of the disorder were normal concentrations of serum immunoglobulins but restricted formation of IgG antibodies to immunogens; normal numbers of B cells and NK cells but decreased numbers of CD4+ and CD8+ T lymphocytes, particularly the CD45RA+ subpopulations; diminished proliferative responses of blood T cells to allogeneic cells, mitogens and antigens; and decreased production of IL-2 by mitogen stimulated blood lymphocytes.
    explanation: >-
      Source for the diminished proliferative responses and the reduced IL-2
      production this node asserts.
- name: Defective T Cell Help for Antibody Production
  biological_scale: CELLULAR
  description: >-
    Serum immunoglobulin concentrations are normal but the specific IgG response to
    immunogens is restricted. The B cells are numerically intact, so the humoral
    defect is best read as a failure of T cell help rather than a B cell defect,
    which is what makes this a combined rather than a purely cellular
    immunodeficiency.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: DECREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Impaired Specific Antibody Response
    causal_link_type: DIRECT
  - target: Persistent Sinopulmonary and Cutaneous Viral Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal immunologic features of the disorder were normal concentrations of serum immunoglobulins but restricted formation of IgG antibodies to immunogens; normal numbers of B cells and NK cells but decreased numbers of CD4+ and CD8+ T lymphocytes, particularly the CD45RA+ subpopulations; diminished proliferative responses of blood T cells to allogeneic cells, mitogens and antigens; and decreased production of IL-2 by mitogen stimulated blood lymphocytes.
    explanation: >-
      Normal immunoglobulin concentrations with restricted specific IgG formation,
      alongside normal B cell numbers, is the observation this node interprets.
- name: Somatic Reversion in the T Cell Lineage
  biological_scale: CELLULAR
  description: >-
    Spontaneous back-mutation of the pathogenic allele in T cell progenitors,
    producing somatic mosaicism restricted to the T cell compartment. In the German
    family, wild-type alleles were recovered from CD3+, CD4+, CD8+, alpha-beta and
    gamma-delta T cells but not from monocytes, B cells or NK cells, and short
    tandem repeat analysis excluded maternal engraftment as the source. This is a
    partially compensating event, not a step by which the disease progresses, and it
    is curated here because it is the reason genotype does not predict phenotype in
    this disorder.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we performed precise genetic analysis of subpopulations revealing spontaneous somatic reversion, predominately in lymphoid derived CD3+, CD4+ and CD8+ T cells.
    explanation: The lineage-restricted reversion this node records.
  - reference: PMID:35052377
    reference_title: "Somatic Reversion of a Novel IL2RG Mutation Resulting in Atypical X-Linked Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that the atypical SCID phenotype noticed in these three brothers is due to the combination of hypomorphic IL-2RG function and somatic reversion.
    explanation: >-
      The authors' own conclusion that the attenuated phenotype required both the
      hypomorphic allele and the reversion, which is why this node exists.
- name: Persistent Sinopulmonary and Cutaneous Viral Susceptibility
  biological_scale: ORGANISM
  description: >-
    The clinical consequence: a lifelong susceptibility to sinopulmonary bacterial
    infection and to cutaneous and systemic viral infection, rather than the
    fulminant early-infancy opportunistic infection of X-linked severe combined
    immunodeficiency. Affected males in the index family ranged from 2.5 to 34 years
    of age.
  downstream:
  - target: Recurrent Sinusitis
    causal_link_type: DIRECT
  - target: Recurrent Otitis Media
    causal_link_type: DIRECT
  - target: Recurrent Bronchitis
    causal_link_type: DIRECT
  - target: Recurrent Pneumonia
    causal_link_type: DIRECT
  - target: Severe Varicella
    causal_link_type: DIRECT
  - target: Verrucae
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prominent clinical abnormalities were a paucity of lymphoid tissue; recurrent sinusitis, otitis media, bronchitis, and pneumonia; severe varicella; and chronic papillomavirus infections.
    explanation: The clinical phenotype of the index family.
  - reference: PMID:2243135
    reference_title: "A novel X-linked combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of the affected males ranged from 2.5 to 34 yr."
    explanation: >-
      Survival into adulthood, the single observation that most clearly separates
      this entity from X-linked severe combined immunodeficiency.

name: X-Linked Combined Immunodeficiency
creation_date: "2026-09-09T00:00:00Z"
category: Mendelian
description: >-
  X-linked combined immunodeficiency (XCID, also written CIDX, and in the modern
  literature usually "atypical" or "leaky" X-linked SCID) is the moderate,
  survivable end of IL2RG disease. It is allelic with X-linked severe combined
  immunodeficiency but is not the same clinical entity, and the difference is
  mechanistic rather than one of degree of luck: the alleles are hypomorphic, so
  the common gamma chain retains partial function instead of losing it.

  IL2RG encodes the common gamma chain, the shared signalling subunit of the
  receptors for IL-2, IL-4, IL-7, IL-9, IL-15 and IL-21, which transduces through
  JAK3 and STAT5. Null alleles abolish that signalling and give the classic
  T-B+NK- severe phenotype, fatal in infancy without transplantation. The XCID alleles
  described so far leave the chain on the cell surface at normal levels and impair
  STAT5 phosphorylation only partially. The consequence is a partly populated but
  qualitatively defective T cell compartment: reduced CD4+ and CD8+ counts with a
  disproportionate loss of the naive CD45RA+ subset, low T-cell receptor excision
  circles, a skewed T-cell receptor repertoire, poor proliferative responses, and
  loss of T-cell help for antibody production, so that serum immunoglobulin
  concentrations are normal while specific IgG responses to immunogens are not. B
  cell and NK cell numbers are normal.

  Clinically this presents not as an infant dying of opportunistic infection but as
  a lifelong sinopulmonary and cutaneous viral susceptibility: recurrent sinusitis,
  otitis media, bronchitis and pneumonia, severe varicella, and chronic
  papillomavirus infection with persistent warts. The five affected males of the
  index American family ranged from 2.5 to 34 years old at report, which is the
  single fact that most clearly separates this entity from X-SCID.

  A second mechanism complicates the picture and is curated here explicitly:
  spontaneous somatic reversion of the mutant allele in the T cell lineage. In the
  German family carrying p.Ile153Thr, wild-type alleles were recoverable from
  CD3+, CD4+ and CD8+ T cells but not from monocytes, B cells or NK cells, and the
  authors attribute the attenuated phenotype to the combination of hypomorphic
  function and reversion rather than to the allele alone. Genotype therefore does
  not fully predict phenotype in this disorder, and it varied markedly even between
  brothers carrying the same variant.

name: Premature Ovarian Failure 19
creation_date: "2026-10-20T23:40:00Z"
category: Mendelian
synonyms:
- POF19
- HSF2BP-related primary ovarian insufficiency
- HSF2BP-related premature ovarian insufficiency
description: >-
  Premature ovarian failure 19 (POF19) is an autosomal recessive form of
  primary ovarian insufficiency caused by biallelic variants in HSF2BP (heat
  shock transcription factor 2 binding protein, also called MEILB2). HSF2BP is
  a germline protein that binds BRCA2 and, with its partner BRME1, is needed to
  load the recombinases RAD51 and DMC1 onto programmed DNA double-strand breaks
  in meiotic prophase I. Three homozygous missense alleles have been reported:
  p.Ser167Leu in a consanguineous family with three affected sisters, and
  p.Cys128Arg and p.Leu186Pro in two unrelated women from a cohort of 1,030
  sporadic POI cases. Affected women have a spontaneous menarche, irregular
  menses, and loss of menses between their late teens and mid-twenties, with
  high FSH and LH; the two sporadic patients had atrophic ovaries without
  follicles on ultrasound. In mice, loss of Hsf2bp reduces
  recombinase loading and crossovers in oocytes and depletes the follicle pool;
  the p.Ser167Leu allele behaves as a hypomorph. No affected men have been
  reported, although Hsf2bp loss blocks spermatogenesis in mice.
disease_term:
  preferred_term: premature ovarian failure 19
  term:
    id: MONDO:0030985
    label: premature ovarian failure 19
parents:
- Primary Ovarian Insufficiency
- Meiotic Disorder
notes: >-
  Scope: this entry covers the 46,XX ovarian phenotype of biallelic HSF2BP
  variants, matching MONDO:0030985. Human evidence comes from three families
  (PMID:32845237, PMID:35174157). No man homozygous for a disease-causing
  HSF2BP allele has been studied; the founding family had no homozygous male,
  and the Felipe-Medina paper cites an Icelandic report of two healthy
  siblings homozygous for HSF2BP p.Gly224Ter who had no children, which is
  not enough to add a male phenotype here. One affected sister in the founding
  family had short stature, cubitus valgus and short fourth and fifth
  metacarpals, which her sisters did not share; it is not recorded as a
  disease feature. No GeneReviews chapter and no POF19-specific prevalence
  figure were found.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected women are homozygous for HSF2BP missense variants; in the founding
    consanguineous family both parents and the fertile siblings are
    heterozygous carriers.
  evidence:
  - reference: PMID:32845237
    reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected family members are homozygous for the variant, and the
      healthy relatives are heterozygous carriers.
    explanation: >-
      Recessive segregation of HSF2BP p.Ser167Leu in the founding family.
  - reference: PMID:35174157
    reference_title: "Pathogenic Variations of Homologous Recombination Gene HSF2BP Identified in Sporadic Patients With Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only two homozygous missense variations (following recessive inheritance
      pattern) were found, c.382T > C (p.C128R) and c.557T > C (p.L186P)
    explanation: >-
      Two further homozygous patients in a sporadic POI cohort, consistent
      with recessive inheritance.
genetic:
- name: HSF2BP
  gene_term:
    preferred_term: HSF2BP
    term:
      id: hgnc:5226
      label: HSF2BP
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Three homozygous missense variants are reported (NM_007031.2):
    c.500C>T p.Ser167Leu, c.382T>C p.Cys128Arg and c.557T>C p.Leu186Pro. Six
    other HSF2BP variants found in the same sporadic cohort were not
    biallelic and were not reported as causal.
  evidence:
  - reference: PMID:32845237
    reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing in a family with three cases of POI, we
      identified the candidate missense variant S167L in HSF2BP, an essential
      meiotic gene.
    explanation: >-
      First report linking HSF2BP to POI.
  - reference: PMID:35174157
    reference_title: "Pathogenic Variations of Homologous Recombination Gene HSF2BP Identified in Sporadic Patients With Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, through the largest in-house WES database of 1,030
      patients with sporadic POI, we identified two novel homozygous
      variations in HSF2BP (c.382T>C, p.C128R; c.557T>C, p.L186P).
    explanation: >-
      Independent patients with different homozygous HSF2BP alleles.
  variants:
  - name: p.Ser167Leu
    description: >-
      c.500C>T (rs200655253), homozygous in three sisters of Israeli Arab
      origin born to first-cousin parents. Very rare in gnomAD and never seen
      homozygous in public databases. A knock-in mouse shows it is a
      hypomorphic allele that lowers HSF2BP and BRME1 protein levels.
    evidence:
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Functional analysis of the HSF2BP-S167L variant in mouse showed that
        it behaves as a hypomorphic allele compared to a new loss-of-function
        (knock-out) mouse model.
      explanation: >-
        The human allele, knocked into the mouse, partially reduces HSF2BP
        function.
  - name: p.Cys128Arg
    description: >-
      c.382T>C, homozygous in a sporadic Chinese patient (POI-1) with
      amenorrhea at 24. The source is internally inconsistent on ACMG class:
      its text calls both of its variants VUS, while its Table 1 lists them as
      likely pathogenic. The mutant protein is less nuclear in transfected
      cells.
    evidence:
    - reference: PMID:35174157
      reference_title: "Pathogenic Variations of Homologous Recombination Gene HSF2BP Identified in Sporadic Patients With Premature Ovarian Insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        An in vitro functional study revealed that both variations impaired
        the nuclear location of HSF2BP and affected its DNA repair capacity.
      explanation: >-
        Functional assay of p.Cys128Arg and p.Leu186Pro in cultured cells.
  - name: p.Leu186Pro
    description: >-
      c.557T>C, homozygous in a second sporadic Chinese patient (POI-2) whose
      irregular menses stopped in her late teens (at 18 in the text, 16 in
      Table 1). ACMG class is given as VUS in the text and likely pathogenic
      in Table 1. The mutant protein is less nuclear in transfected cells.
    evidence:
    - reference: PMID:35174157
      reference_title: "Pathogenic Variations of Homologous Recombination Gene HSF2BP Identified in Sporadic Patients With Premature Ovarian Insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, the signals of two mutant proteins (C128R and L186P)
        localizing in the nucleus were significantly lower than those of the
        wild-type protein
      explanation: >-
        Reduced nuclear localization of the mutant protein in HeLa and KGN
        cells.
pathophysiology:
- name: HSF2BP Partial Loss of Function
  description: >-
    The disease alleles reduce HSF2BP function without abolishing it.
    p.Ser167Leu lowers the protein level of HSF2BP and of its stabilizing
    partner BRME1, and p.Cys128Arg and p.Leu186Pro reduce its nuclear localization.
    HSF2BP binds a conserved region of BRCA2 between the BRC repeats and the
    DNA-binding domain, and the HSF2BP-BRME1 complex brings BRCA2 to meiotic
    double-strand breaks.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HSF2BP
    term:
      id: hgnc:5226
      label: HSF2BP
  molecular_functions:
  - preferred_term: BRCA2 binding
    term:
      id: GO:0005515
      label: protein binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  notes: >-
    Protein binding is the only molecular function GO annotates HSF2BP with
    (IPI, including PMID:31242413); GO has no BRCA2-binding term, so the
    partner is named in preferred_term. The modifier reflects less HSF2BP
    protein available to bind, not a measured loss of binding affinity.
  evidence:
  - reference: PMID:32845237
    reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The S167L human recessive POI variant behave as a hypomorphic allele in
      mice, which results in a reduction of the protein expression/stability
      of itself and of its partner BRME1 in vivo and in transfected cells.
    explanation: >-
      The founding allele reduces HSF2BP and BRME1 protein in mouse meiocytes
      and transfected cells.
  - reference: PMID:35174157
    reference_title: "Pathogenic Variations of Homologous Recombination Gene HSF2BP Identified in Sporadic Patients With Premature Ovarian Insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies revealed the variations adversely affected the DNA
      repair capacity of HSF2BP due to disturbed nuclear localization
    explanation: >-
      The two sporadic-case alleles impair HSF2BP in cultured cells.
  - reference: PMID:31242413
    reference_title: "HSF2BP Interacts with a Conserved Domain of BRCA2 and Is Required for Mouse Spermatogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The BRCA2-HSF2BP interaction is highly evolutionarily conserved and maps
      to armadillo repeats in HSF2BP and a 68-amino acid region between the
      BRC repeats and the DNA binding domain of human BRCA2 (Gly2270-Thr2337)
      encoded by exons 12 and 13.
    explanation: >-
      Defines the BRCA2 interaction that the HSF2BP complex provides.
  - reference: PMID:30760716
    reference_title: "A meiosis-specific BRCA2 binding protein recruits recombinases to DNA double-strand breaks to ensure homologous recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that localization of BRCA2 to meiotic DSBs is mediated by
      MEILB2, which is an integral mechanism to repair abundant meiotic DSBs.
    explanation: >-
      Normal function: HSF2BP brings BRCA2 to meiotic breaks (shown mainly
      in spermatocytes).
  downstream:
  - target: Impaired Recombinase Loading and Crossover Formation in Oocytes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Meiocytes bearing the HSF2BP-S167L variant showed a strongly decreased
        staining of both HSF2BP and BRME1 at the recombination nodules and a
        reduced number of the foci formed by the recombinases RAD51/DMC1, thus
        leading to a lower frequency of crossovers.
      explanation: >-
        In knock-in mice, the human allele lowers HSF2BP-BRME1 at
        recombination sites, and with it recombinase foci and crossovers.
- name: Impaired Recombinase Loading and Crossover Formation in Oocytes
  conforms_to: "meiotic_prophase_failure#Homologous Recombination Repair of Meiotic DNA Breaks"
  description: >-
    Without enough HSF2BP-BRME1, BRCA2 does not efficiently load RAD51 and
    DMC1 onto resected meiotic double-strand breaks. In knockout oocytes break formation and resection
    look normal (RPA2 foci), recombinase foci fall by about half, homolog
    synapsis is delayed, and fewer crossovers form. The defect is milder in
    oocytes than in spermatocytes, and Hsf2bp-null females remain fertile.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: DNA recombinase assembly
    term:
      id: GO:0000730
      label: DNA recombinase assembly
    modifier: DECREASED
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  - preferred_term: reciprocal meiotic recombination
    term:
      id: GO:0007131
      label: reciprocal meiotic recombination
    modifier: DECREASED
  evidence:
  - reference: PMID:30760716
    reference_title: "A meiosis-specific BRCA2 binding protein recruits recombinases to DNA double-strand breaks to ensure homologous recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, there were significant reductions in the numbers of DMC1 and
      RAD51 foci in Meilb2−⁄− oocytes compared to WT oocytes
    explanation: >-
      Hsf2bp (Meilb2) knockout oocytes load fewer recombinase foci in
      zygotene, while break formation and resection (RPA2 foci) are normal.
  - reference: PMID:32845237
    reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In agreement with the lower presence of recombinases, the number of COs
      (measured as interstitial CDK2 foci) was also reduced in
      Hsf2bpS167L/S167L oocytes, and a stronger reduction was observed in
      Hsf2bp-/- oocytes
    explanation: >-
      Crossovers are reduced in oocytes carrying the human allele, and more
      so in null oocytes.
  downstream:
  - target: Oocyte Elimination in Meiotic Prophase
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30760716
      reference_title: "A meiosis-specific BRCA2 binding protein recruits recombinases to DNA double-strand breaks to ensure homologous recombination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        suggesting that a large portion of oocytes were eliminated during
        early development prior to the formation of primordial follicles
      explanation: >-
        The authors attribute the follicle deficit in knockout ovaries to

animal_models:
- name: Hsf2bp knockout mouse
  species: Mouse
  genotype: Hsf2bp-/-
  publication: PMID:30760716
  description: >-
    Independent Hsf2bp (Meilb2) knockout lines are male-sterile with
    spermatocyte arrest; females are subfertile with fewer RAD51/DMC1 foci in
    oocytes and a large loss of follicles.
  modeled_mechanisms:
  - target: Impaired Recombinase Loading and Crossover Formation in Oocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Knockout oocytes form breaks normally but load fewer recombinase foci.
    evidence:
    - reference: PMID:30760716
      reference_title: "A meiosis-specific BRCA2 binding protein recruits recombinases to DNA double-strand breaks to ensure homologous recombination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we concluded that MEILB2 is also required for recombinase recruitment
        in female meiosis
      explanation: >-
        Recombinase recruitment defect in knockout oocytes.
  - target: Ovarian Follicle Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockout females have fewer follicles of every stage and smaller
      litters, but remain fertile.
    limitations: >-
      The null mouse keeps enough follicles to breed, whereas homozygous women
      with partial loss-of-function alleles lose ovarian function in early
      adulthood. The knockout is also a complete loss of function, which no
      patient carries.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse oocytes tolerate the recombinase-loading defect better than
        human oocytes, so a null mouse ovary is less affected than the ovary
        of a woman with a hypomorphic allele.
    evidence:
    - reference: PMID:30760716
      reference_title: "A meiosis-specific BRCA2 binding protein recruits recombinases to DNA double-strand breaks to ensure homologous recombination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Meilb2−⁄− females exhibited reduced follicle formation and a subfertile
        phenotype
      explanation: >-
        Reduced follicles and subfertility, short of ovarian failure.
- name: Hsf2bp S167L knock-in mouse
  species: Mouse
  genotype: Hsf2bp S167L/S167L
  publication: PMID:32845237
  description: >-
    Mice homozygous for the human founding allele have fewer RAD51/DMC1 foci
    and crossovers in oocytes and a significant reduction in litters, but a
    normal follicle count.
  modeled_mechanisms:
  - target: HSF2BP Partial Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Carries the patient allele, which lowers HSF2BP and BRME1 protein.
    evidence:
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Functional analysis of the HSF2BP-S167L variant in mouse showed that
        it behaves as a hypomorphic allele
      explanation: >-
        The human allele is hypomorphic in mouse.
  - target: Impaired Recombinase Loading and Crossover Formation in Oocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Knock-in oocytes have fewer RAD51/DMC1 foci and fewer crossovers.
    evidence:
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the number of COs (measured as interstitial CDK2 foci) was also
        reduced in Hsf2bpS167L/S167L oocytes
      explanation: >-
        Crossover reduction in oocytes carrying the patient allele.
  - target: Ovarian Follicle Depletion
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Follicle numbers are normal at 13 months; female fertility is only
      mildly reduced.
    limitations: >-
      The mouse does not develop ovarian insufficiency with the allele that
      causes it in women, which the authors attribute to lower sensitivity of
      mice to hypomorphic alleles and to more error-prone human female meiosis.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The S167L knock-in shows the recombination defect but not the
        follicle depletion, so it cannot model the ovarian outcome of the
        human disease.
    evidence:
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histological analysis of Hsf2bpS167L/S167L ovaries revealed no apparent
        differences in the number of follicles in comparison to wild-type (WT)
        animals
      explanation: >-
        No follicle loss in knock-in females.
    - reference: PMID:32845237
      reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the sub-fertility observed in HSF2BP-S167L females appears to be
        milder in comparison to the phenotype of the human patients
      explanation: >-
        The authors state the mouse phenotype is milder than the human one.

      Only one of the patients affected by POI could have a child with the
      help of a fertility treatment
    explanation: >-
      Two of the three affected sisters had no children; the third conceived
      only with treatment.
diagnosis:
- name: Exome sequencing
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    All reported cases were found by exome sequencing of POI patients. There is
    no biochemical test specific to the cause.
  evidence:
  - reference: PMID:32845237
    reference_title: "A missense in HSF2BP causing primary ovarian insufficiency affects meiotic recombination by its novel interactor C19ORF57/BRME1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing in a family with three cases of POI, we
      identified the candidate missense variant S167L in HSF2BP
    explanation: >-
      The founding family was solved by exome sequencing.
treatments:
- name: Hormone replacement therapy
  description: >-
    There is no HSF2BP-directed therapy. As for other causes of POI, estrogen
    with progestogen replaces ovarian hormones to limit the bone,
    cardiovascular and other consequences of early estrogen loss; it does not
    restore fertility, for which donor oocytes are the usual option. The
    progestogen is bound as progesterone because the ChEBI progestogen class
    is a role term that the agent slot does not admit; other progestogens are
    equally used.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for TRIT1 variants, and in the
    founding family both parents and an unaffected sibling were heterozygous carriers. TRIT1 is a
    nuclear gene on 1p34, so despite the mitochondrial phenotype there is no maternal transmission.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

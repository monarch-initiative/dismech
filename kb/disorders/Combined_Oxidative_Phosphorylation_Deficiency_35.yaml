- name: Mitochondrial tRNA i6A37 Hypomodification
  biological_scale: MOLECULAR
  description: >-
    The mitochondrial tRNAs that normally carry i6A37 (mt-tRNA-Ser(UCN) and mt-tRNA-Trp), and its
    methylthiolated derivative ms2i6A37, lack the modification. The modified purine at position 37 stabilises the weak A-U pairing at
    the first codon position, so its absence lowers decoding efficiency of the affected tRNAs. The
    deficit is measurable in patient blood and urine as reduced i6A and ms2i6A nucleosides.

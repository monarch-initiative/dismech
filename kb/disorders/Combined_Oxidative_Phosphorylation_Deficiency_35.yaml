pathophysiology:
- name: Biallelic TRIT1 Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of TRIT1. Missense, splice-site, frameshift and nonsense alleles have been
    reported, homozygous in consanguineous families and compound heterozygous otherwise. The
    founding allele, p.Arg323Gln, alters one of a series of basic residues that contact the
    anticodon-stem backbone of the substrate tRNA rather than the catalytic centre.
  genes:
  - preferred_term: TRIT1
    term:
      id: hgnc:20286
      label: TRIT1
  genetic_context:
    genes:
    - preferred_term: TRIT1
      term:
        id: hgnc:20286
        label: TRIT1
    allele_type: missense, splice-site, frameshift and nonsense variants
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in some families and compound heterozygous in others, so no single zygosity
      value describes the entity and the slot is left unset.
    notes: >-
      LOSS_OF_FUNCTION rests on the founding p.Arg323Gln allele, whose recombinant protein had
      negligible activity in a standard in vitro assay, on the absence of TRIT1 isoform 1 protein
      in fibroblasts from two compound heterozygous patients, and on markedly reduced i6A and
      ms2i6A in blood and urine of a third. Many later alleles were classified on in-silico
      prediction without a functional assay.

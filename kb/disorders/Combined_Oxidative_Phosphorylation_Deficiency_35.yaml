  notes: >-
    TRIT1 (tRNA isopentenyltransferase 1, 1p34.2) is the causal gene MONDO records for
    MONDO:0054742 (OMIM:617873). Many published alleles have no functional study, and several are
    classified as variants of uncertain significance in ClinVar. TRIT1 also has an unrelated
    oncology literature (lung, liver and breast cancer expression studies) that does not concern
    this disease.

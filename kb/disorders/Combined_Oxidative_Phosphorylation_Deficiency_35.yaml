- name: Impaired Oxidative Phosphorylation
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    With complexes I and IV deficient, oxygen consumption and oxidative ATP production fall.
    Patient fibroblasts show reduced basal and maximal respiration and spare respiratory capacity.
    This is the bioenergetic endpoint the TRIT1 lesion converges on, and the node conforms to the
    shared mitochondrial_dysfunction module at that point. Only the oxidative phosphorylation half
    of that module node is claimed; no reactive oxygen species measurement has been reported in
    TRIT1 patients. Lactate is usually normal, so the systemic glycolytic overflow typical of
    many mitochondrial diseases is not a feature here. The brain is the organ in which the energy
    deficit is expressed clinically.

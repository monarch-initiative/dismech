discussions:
- discussion_id: coxpd35_cytosolic_trna_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cytosolic tRNA i6A37 Hypomodification
  prompt: >-
    Does hypomodification of cytosolic TRIT1 substrates contribute to the human disease, or is the
    phenotype explained entirely by mitochondrial tRNA dysfunction?
  rationale: >-
    TRIT1 modifies tRNAs in both compartments and patient cells lose i6A37 in both. In fission
    yeast the respiratory phenotype of IPTase deletion comes from cytosolic tRNA-Tyr, not from
    mitochondrial tRNAs, while in humans the defect is attributed to mitochondrial tRNAs. No
    compartment-specific rescue has been done in human cells or a mammalian model, and
    selenoprotein output, the best-studied cytosolic readout, is only modestly affected.
  evidence:
  - reference: PMID:26857223
    reference_title: Lack of tRNA-i6A modification causes mitochondrial-like metabolic deficiency in S. pombe by limiting activity of cytosolic tRNATyr, not mito-tRNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, S. pombe i6A37 hypomodification-associated metabolic deficiency results from hypoactivity of cy-tRNA, mostly tRNA(Tyr), and unlike human TRIT1-deficiency does not impair mitochondrial translation due to mt-tRNA hypomodification."
    explanation: Shows the compartment question has different answers in yeast and humans.

- name: Combined Respiratory Chain Complex I and IV Deficiency
  biological_scale: CELLULAR
  description: >-
    Complexes I and IV, which contain the most mtDNA-encoded subunits, are the activities most
    affected; complex II, which has none, is spared. In the founding proband, skeletal muscle
    complex I activity was 10 percent and complex IV 60 percent of control, with a mosaic of
    COX-deficient fibres. Complex III involvement was reported in another family. In a 2022
    review, respiratory chain abnormalities were found in most of the patients in whom they were
    measured, although measurements may be near normal in mild cases.

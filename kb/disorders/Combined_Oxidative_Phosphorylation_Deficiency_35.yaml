- name: Cytosolic tRNA i6A37 Hypomodification
  biological_scale: MOLECULAR
  description: >-
    The cytosolic TRIT1 substrates, three tRNA-Ser isoacceptors and the selenocysteine tRNA, also
    lose i6A37 in patient cells. Its contribution to the human disease is not established. In
    fission yeast the respiratory phenotype of IPTase deletion is rescued by a cytosol-only enzyme,
    but that study found yeast differs from human TRIT1 deficiency, and selenoprotein levels were
    not generally reduced in p.Arg323Gln patient fibroblasts. The node is recorded without a
    downstream edge for that reason.

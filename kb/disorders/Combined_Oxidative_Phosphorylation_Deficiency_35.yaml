diagnosis:
- name: Exome sequencing with tRNA modification or respiratory chain studies
  description: >-
    Diagnosis rests on finding biallelic TRIT1 variants by exome sequencing, often through
    international matchmaking given the rarity of the disease. Pathogenicity of novel variants
    can be supported by reduced i6A and ms2i6A in blood or urine, by absent TRIT1 protein on
    western blot, or by respiratory chain enzyme or expression measurements in fibroblasts, which
    have been recommended for all newly diagnosed patients.
  evidence:
  - reference: PMID:31140736
    reference_title: Noninvasive diagnosis of TRIT1-related mitochondrial disorder by measuring i(6) A37 and ms(2) i(6) A37 modifications in tRNAs from blood and urine samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the present observations suggest that noninvasive biochemical analysis using peripheral blood and urine samples are sufficient for the diagnosis of TRIT1-related disorders, making muscle biopsy for the direct measurement of oxidative phosphorylation unnecessary."
    explanation: Non-invasive biochemical confirmation of the diagnosis.
  - reference: PMID:28185376
    reference_title: Matchmaking facilitates the diagnosis of an autosomal-recessive mitochondrial disease caused by biallelic mutation of the tRNA isopentenyltransferase (TRIT1) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe four individuals from three unrelated families \"matched\" by GeneMatcher and MatchMakerExchange."
    explanation: Genomic matchmaking as a route to diagnosis.

name: Combined Oxidative Phosphorylation Deficiency 35
category: Mendelian
creation_date: "2026-10-01T20:11:47Z"
synonyms:
- COXPD35
- combined oxidative phosphorylation deficiency type 35
- TRIT1 deficiency
- TRIT1 defect
- TRIT1-related mitochondrial disorder
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 35
  term:
    id: MONDO:0054742
    label: combined oxidative phosphorylation deficiency 35
description: >-
  COXPD35 is an autosomal recessive mitochondrial disease caused by biallelic variants in TRIT1,
  the nuclear gene encoding tRNA isopentenyltransferase. TRIT1 transfers a dimethylallyl group
  from dimethylallyl diphosphate onto N6 of adenosine 37 (i6A37), immediately 3' of the anticodon,
  in a small subset of cytosolic and mitochondrial tRNAs that carry the A36-A37-A38 recognition
  sequence. In mitochondria, i6A37 is the first step towards the hypermodified ms2i6A37 base. The
  enzyme is imported into mitochondria through an amino-terminal targeting sequence, so a single
  gene supplies both compartments.

  The disease was defined in 2014 in two siblings of a consanguineous family, homozygous for
  p.Arg323Gln, who had encephalopathy and myoclonic epilepsy with combined respiratory chain
  deficiency (complexes I and IV) and mosaic cytochrome c oxidase deficiency in skeletal muscle.
  Their fibroblasts were severely deficient in i6A37 on both cytosolic and mitochondrial tRNAs,
  showed a generalised decrease in mitochondrial protein synthesis and reduced oxygen consumption,
  and wild-type TRIT1 restored the modification. The causal chain is therefore loss of
  isopentenyltransferase activity, hypomodification of mitochondrial tRNAs, impaired translation
  of the thirteen mtDNA-encoded respiratory chain subunits, and a combined oxidative
  phosphorylation defect. Whether hypomodification of the cytosolic tRNA substrates also
  contributes in humans is unresolved.

  Clinically the entity is a neurodevelopmental epilepsy syndrome. In a 2022 review of the 15
  patients then reported, every patient had seizures, most had myoclonic jerks, cognitive delay
  and microcephaly, and the authors described a recognisable pattern of myoclonic epilepsy, speech
  delay, strabismus, progressive spasticity and variable microcephaly with normal lactate. Brain
  MRI is abnormal in about half of patients (atrophy, delayed myelination, corpus callosum
  anomalies), and optic disc hypoplasia, atrial septal defect and diabetes are reported in a
  minority. Truncating genotypes have been linked to a more severe presentation. Severity ranges
  from pharmacoresistant seizures to milder forms whose seizures respond to antiseizure
  medication or a ketogenic diet. Fewer than twenty patients have been published, and there is no
  disease-specific therapy.

pathophysiology:
- name: PRKCG Missense Variant
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    A heterozygous germline missense variant, or rarely a small in-frame
    deletion, in PRKCG. The original variants (H101Y, S119P, G128D) lie in the
    cysteine-rich C1 domain that binds diacylglycerol and holds the kinase in
    its autoinhibited state; later families carry variants in the C2 and
    catalytic domains, such as F643L. Because variants in different domains
    appear to act through different routes, no single functional impact
    category is recorded for the gene.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Inherited from an affected parent in most families. Gain and loss of
      PKCgamma function have both been reported, depending on the variant and
      assay, so functional_impact_category is left unset.
  genes:
  - preferred_term: PRKCG
    term:
      id: hgnc:9402
      label: PRKCG
  downstream:
  - target: Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
    causal_link_type: DIRECT
    description: >-
      For C1-domain variants, the substitution weakens the intramolecular
      clamp that keeps the kinase off in the absence of second messengers.
    evidence:
    - reference: PMID:36166510
      reference_title: "Mutations in protein kinase Cγ promote spinocerebellar ataxia type 14 by impairing kinase autoinhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we found with a FRET-based activity reporter that SCA14-associated PKCγ mutations, including a previously undescribed variant, D115Y, enhanced the basal activity of the kinase by compromising its autoinhibition."
      explanation: Cell-based reporter shows SCA14 variants raise basal PKCgamma activity.
  - target: Mutant PKCgamma Mislocalization and Aggregation
    causal_link_type: DIRECT
    description: >-
      Mutant PKCgamma is prone to forming insoluble cytoplasmic aggregates and
      fails to reside at the plasma membrane after activation.
    evidence:
    - reference: PMID:15964845
      reference_title: "Mutant protein kinase Cgamma found in spinocerebellar ataxia type 14 is susceptible to aggregation and causes cell death."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Wild-type gammaPKC-GFP was expressed ubiquitously in the cytoplasm of CHO cells, whereas mutant gammaPKC-GFP tended to aggregate in the cytoplasm."
      explanation: Seven SCA14 variants increase PKCgamma aggregation in cultured cells.
  - target: Dominant-Negative Disruption of Purkinje Cell Synapse Refinement
    causal_link_type: DIRECT
    description: >-
      Mutant PKCgamma expressed in developing Purkinje cells colocalizes with
      and interferes with wild-type PKCgamma and shortens PKCalpha membrane
      residence.
    evidence:
    - reference: PMID:21976518
      reference_title: "Mutant PKCγ in spinocerebellar ataxia type 14 disrupts synapse elimination and long-term depression in Purkinje cells in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also found that mutant PKCγ colocalized with wild-type PKCγ, which suggests that mutant PKCγ acts in a dominant-negative manner on wild-type PKCγ."
      explanation: In vivo mouse Purkinje-cell expression suggests a dominant-negative action.
  evidence:
  - reference: PMID:12644968
    reference_title: "Missense mutations in the regulatory domain of PKC gamma: a new mechanism for dominant nonepisodic cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three different nonconservative missense mutations in highly conserved residues in C1, the cysteine-rich region of the protein, were found in family AT08, another familial case, and a sporadic case."
    explanation: Discovery of PRKCG C1-domain missense variants as the SCA14 lesion.
  - reference: PMID:15313841
    reference_title: "Mutation in the catalytic domain of protein kinase C gamma and extension of the phenotype associated with spinocerebellar ataxia type 14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a new SCA14 family with the first mutation (F643L) located in the catalytic domain of the enzyme."
    explanation: Extends the variant spectrum beyond the regulatory domain.
- name: Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Many SCA14 variants, especially in the C1 domain, raise the basal activity
    of PKCgamma by compromising autoinhibition. Unlike other autoinhibition
    defects in PKC, which lead to degradation of the open enzyme, the C1
    variants protect PKCgamma from that down-regulation, so the active enzyme
    persists. Knock-in and Purkinje-cell-targeted mice carrying activating
    alleles develop ataxia with Purkinje cell pathology. This is not a complete
    account of the disease: in living Purkinje cells, raised biological
    activity was found for two of three catalytic-domain variants but for none
    of five C1 or C2 variants tested, and the H101Q variant reduces PKCgamma
    levels.

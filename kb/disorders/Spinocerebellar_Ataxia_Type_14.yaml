discussions:
- discussion_id: gap_sca14_gain_vs_loss
  prompt: >-
    Does SCA14 arise from raised PKCgamma activity, loss of membrane PKCgamma
    function, toxic aggregation, or interference with wild-type PKC, and does
    the answer differ by the domain the variant lies in?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
  - pathophysiology#Mutant PKCgamma Mislocalization and Aggregation
  - pathophysiology#Dominant-Negative Disruption of Purkinje Cell Synapse Refinement
  rationale: >-
    Cell-based reporters and knock-in mice support raised basal activity for
    several variants, but in living Purkinje cells regulatory-domain variants
    did not raise activity, H101Q lowers PKCgamma levels, and patient iPSCs and
    autopsy tissue show loss of membrane PKCgamma together with aggregation.
    Whether a kinase inhibitor or a proteostasis approach would be the right
    therapeutic direction depends on which route dominates for a given
    variant.
  evidence:
  - reference: PMID:28738819
    reference_title: "Increased biological activity of protein Kinase C gamma is not required in Spinocerebellar ataxia 14."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings indicate that SCA14 mutations located in different domains of the PRKCG gene cause SCA14 by different mechanisms and that an increased constitutive activity of PKCγ may be one, but cannot be the only mechanism to cause disease in SCA14."
    explanation: States the domain-dependent open question directly.
notes: >-
  Promoted from the SCA14 has_subtypes row of
  Autosomal_Dominant_Cerebellar_Ataxia_Type_I, which now points here with
  curated_in. That entry's Purkinje-Cell Calcium Signaling Dysfunction node
  still holds PRKCG together with ITPR1 as one calcium-signalling claim; this
  entry carries the PKCgamma-specific chain instead.

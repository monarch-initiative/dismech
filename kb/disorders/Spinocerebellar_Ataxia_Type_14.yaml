      evidence_source: MODEL_ORGANISM
      snippet: "Data from this clinically relevant mutation suggested that enhanced basal activity of PKCγ is sufficient to cause ataxia and that treatment strategies to modulate aberrant PKCγ may be particularly beneficial in males."
      explanation: A knock-in of a patient allele with raised basal activity is sufficient for ataxia.
  evidence:
  - reference: PMID:36166510
    reference_title: "Mutations in protein kinase Cγ promote spinocerebellar ataxia type 14 by impairing kinase autoinhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike other mutations in PKC that impair its autoinhibition but lead to its degradation, the C1 domain mutations protected PKCγ from such down-regulation."
    explanation: C1 variants keep the disinhibited enzyme from being degraded.
  - reference: PMID:36166510
    reference_title: "Mutations in protein kinase Cγ promote spinocerebellar ataxia type 14 by impairing kinase autoinhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

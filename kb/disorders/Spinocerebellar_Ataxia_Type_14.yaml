diagnosis:
- name: PRKCG molecular genetic testing
  description: >-
    Diagnosis rests on a heterozygous pathogenic PRKCG variant. Because many
    variants are novel missense changes, protein modeling has been proposed to
    help classify them, and symmetric T2 hyperintensity of the dentate nuclei,
    seen in all genetically confirmed patients and no controls in one German
    cohort, has been proposed as a supportive MRI marker.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301573
    reference_title: "Spinocerebellar Ataxia Type 14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of SCA14 is established in a proband with a pathogenic variant in PRKCG identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:33739604
    reference_title: "Spinocerebellar ataxia type 14: refining clinicogenetic diagnosis in a rare adult-onset disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein modeling emerged as a valuable diagnostic tool for variant classification and the newly described T2 hyperintense dentate sign could serve as a supportive diagnostic marker of SCA-PRKCG."
    explanation: Proposed supportive MRI sign and variant classification aid.
  notes: >-
    No HPO term for T2 hyperintensity of the dentate nucleus was found (ols:hp
    search l~dentate returned only HP:0100321 Abnormal dentate nucleus
    morphology, HP:0007047 Atrophy of the dentate nucleus and HP:0002461
    Cerebellar dentate nucleus calcification, none of which describes a signal
    change), so the sign is recorded here rather than as a phenotype.
animal_models:
- name: Purkinje-cell-specific mutant PKCgamma transgenic mouse
  species: Mouse
  genotype: Purkinje-cell-restricted transgene expressing an SCA14 mutant PKCgamma
  publication: PMID:24937631
  description: >-
    Transgenic mice expressing an SCA14 mutant PKCgamma only in cerebellar
    Purkinje cells. Purkinje cell dendrites in slice culture resemble those
    after pharmacological PKC activation; adults show localized Purkinje cell
    loss without overall cerebellar atrophy and a mild ataxia.
  modeled_mechanisms:
  - target: Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Purkinje cells show evidence of increased PKCgamma activity in vivo.
    limitations: >-
      Transgenic overexpression on top of two wild-type alleles, so the
      dosage of mutant to wild-type protein differs from heterozygous
      patients.
    evidence:
    - reference: PMID:24937631
      reference_title: "Increased protein kinase C gamma activity induces Purkinje cell pathology in a mouse model of spinocerebellar ataxia 14."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings provide evidence for both an increased PKCγ activity in Purkinje cells in vivo and for pathological changes typical for cerebellar disease"
      explanation: Model shows raised PKCgamma activity with cerebellar pathology.
  - target: Purkinje Cell Dysfunction and Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Localized Purkinje cell loss and mild ataxia.
    limitations: >-
      No overall cerebellar atrophy, whereas all patients imaged show
      cerebellar atrophy.
    evidence:
    - reference: PMID:24937631
      reference_title: "Increased protein kinase C gamma activity induces Purkinje cell pathology in a mouse model of spinocerebellar ataxia 14."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In adult transgenic mice there is evidence for some localized loss of Purkinje cells but there is no overall cerebellar atrophy."
      explanation: Purkinje cell loss without global atrophy.
- name: PKCgamma A24E pseudosubstrate knock-in mouse
  species: Mouse
  genotype: Prkcg A24E knock-in
  publication: PMID:33478986
  description: >-
    Knock-in of a pseudosubstrate-domain mutation known to activate PKCgamma
    constitutively. A24E is related to SCA14 rather than a patient allele.
    PKCgamma protein is strongly reduced, yet PKC activity in Purkinje cells
    is raised, Purkinje cell maturation is perturbed and mice are ataxic.
  modeled_mechanisms:
  - target: Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Raised PKC activity in Purkinje cells despite reduced PKCgamma protein.
    limitations: >-
      A24E is an engineered activating allele in the pseudosubstrate, not a
      variant found in SCA14 patients.
    evidence:
    - reference: PMID:33478986
      reference_title: "A New Mouse Model Related to SCA14 Carrying a Pseudosubstrate Domain Mutation in PKCγ Shows Perturbed Purkinje Cell Maturation and Ataxic Motor Behavior."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite this reduction, there is clear evidence for an increased PKC activity in Purkinje cells from PKCγ-A24E mice."
      explanation: Raised PKC activity in Purkinje cells.
- name: PKCgamma deltaF48 knock-in mouse
  species: Mouse
  genotype: Prkcg deltaF48 knock-in (patient in-frame deletion)
  publication: PMID:41926327
  description: >-
    Knock-in of a patient deletion that raises basal PKCgamma activity. Mice
    develop ataxia-related phenotypes and a cerebellar phosphoproteome driven
    mainly by enhanced CaMKII signaling, more severe in males; human data in
    the same study show earlier onset in men.
  modeled_mechanisms:
  - target: Impaired PKCgamma Autoinhibition with Raised Basal Kinase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      A patient allele at the endogenous locus with raised basal activity is
      sufficient for ataxia.
    evidence:
    - reference: PMID:41926327
      reference_title: "Sex-specific disruptions in PKCγ signaling in a mouse model of spinocerebellar ataxia type 14."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Genetic, behavioral, and molecular testing revealed that ΔF48 PKCγ mice have ataxia-related phenotypes and an altered cerebellar phosphoproteome driven primarily by enhanced Ca2+/calmodulin-dependent kinase 2 signaling, effects that were more severe in male mice."
      explanation: Ataxia and altered cerebellar signaling in the knock-in.
- name: Lentiviral mutant PKCgamma Purkinje cell mouse
  species: Mouse
  genotype: Lentiviral expression of SCA14 mutant PKCgamma-GFP in cerebellar Purkinje cells
  publication: PMID:21976518
  description: >-
    Lentiviral vectors expressing mutant PKCgamma-GFP injected into the
    developing mouse cerebellum. Purkinje cells retain multiple climbing fiber
    inputs, long-term depression fails, and mice treated at one week of age
    perform worse on the rotarod without overt gait ataxia.
  modeled_mechanisms:
  - target: Dominant-Negative Disruption of Purkinje Cell Synapse Refinement
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Disrupted climbing fiber pruning and long-term depression in vivo.
    limitations: >-
      Viral overexpression in a subset of Purkinje cells; the node exists only
      in this model and has not been examined in patients.
    evidence:
    - reference: PMID:21976518
      reference_title: "Mutant PKCγ in spinocerebellar ataxia type 14 disrupts synapse elimination and long-term depression in Purkinje cells in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This result strongly suggests that mutant PKCγ-GFP disrupts endogenous PKCγ function by coaggregation, which could account for the disruption of CF pruning in developing PCs."
      explanation: Disrupted climbing fiber pruning.

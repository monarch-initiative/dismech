name: Spinocerebellar Ataxia Type 14
creation_date: "2026-11-03T00:00:00Z"
category: Mendelian
synonyms:
- SCA14
- spinocerebellar ataxia 14
- SCA-PRKCG
- PRKCG-related spinocerebellar ataxia
description: >-
  Spinocerebellar ataxia type 14 (SCA14) is an autosomal dominant, slowly
  progressive cerebellar ataxia caused by heterozygous missense variants, and
  rarely in-frame deletions, in PRKCG, which encodes protein kinase C gamma
  (PKCgamma), a calcium- and diacylglycerol-activated serine/threonine kinase
  that is highly expressed in cerebellar Purkinje cells. It was the first
  dominant, nonepisodic spinocerebellar ataxia shown to be caused by a
  conventional coding variant rather than a nucleotide repeat expansion. Most
  variants cluster in the regulatory C1 domain; a minority lie in the C2 and
  catalytic domains. The clinical picture is mainly pure ataxia with dysarthria
  and nystagmus, with onset from childhood to the seventh decade, often
  accompanied by action or axial myoclonus, dystonia, tremor or mild
  cognitive-affective disturbance; about a third of patients have a complex
  phenotype. Cerebellar atrophy is most pronounced in the upper vermis and
  anterior lobe, and symmetric T2 hyperintensity of the dentate nuclei has been
  proposed as a supportive MRI sign. Life span is not shortened. The mechanism
  is unsettled: several C1-domain variants raise basal kinase activity by
  impairing autoinhibition, but variants in other domains act differently, and
  mutant PKCgamma also mislocalizes, aggregates and interferes with wild-type
  PKC in Purkinje cells. Treatment is supportive.

    evidence_source: IN_VITRO
    snippet: "In conclusion, the H101Q mutation causes slowly progressive uncomplicated ataxia by interfering with PKCgamma stability or solubility, which consequently may cause in either case a decrease in the overall PKCgamma-dependent phosphorylation."
    explanation: For H101Q, reduced PKCgamma levels point toward loss rather than gain of activity.
- name: Mutant PKCgamma Mislocalization and Aggregation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Mutant PKCgamma forms detergent-insoluble cytoplasmic aggregates in
    overexpression systems and causes more cell death than wild type. At
    endogenous expression levels, patient iPSCs carrying the H36R or H101Q
    variants and post-mortem SCA14 cerebellum both show less PKCgamma at the
    plasma membrane after activation and more PKCgamma in cytoplasmic
    aggregates, which are not ubiquitin-positive. Loss of membrane-localized
    PKCgamma and gain of aggregated protein may contribute together.
  genes:
  - preferred_term: PRKCG
    term:
      id: hgnc:9402
      label: PRKCG
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Purkinje Cell Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aggregation is cytotoxic in cultured cells; how it contributes to
      Purkinje cell loss in patients has not been shown directly.
    evidence:
    - reference: PMID:15964845
      reference_title: "Mutant protein kinase Cgamma found in spinocerebellar ataxia type 14 is susceptible to aggregation and causes cell death."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "These results indicate that SCA14 mutations make gammaPKC form cytoplasmic aggregates, suggesting the involvement of this property in the etiology of SCA14."
      explanation: The authors infer a role for aggregation in disease from cell culture.
  evidence:
  - reference: PMID:30249303
    reference_title: "Neurodegeneration in SCA14 is associated with increased PKCγ kinase activity, mislocalization and aggregation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, as described above, PKCγ immunostaining at the plasma membrane of Purkinje cells was markedly reduced in SCA14 post-mortem cerebellar tissue"
    explanation: Loss of membrane PKCgamma in patient Purkinje cells.
  - reference: PMID:30249303
    reference_title: "Neurodegeneration in SCA14 is associated with increased PKCγ kinase activity, mislocalization and aggregation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, mutant PKCγ formed large aggregates in the cytoplasm"
    explanation: >-
      In patient iPSCs carrying H36R or H101Q, mutant PKCgamma forms large
      cytoplasmic aggregates, in contrast to the small puncta formed by
      wild-type PKCgamma.
  - reference: PMID:30249303
    reference_title: "Neurodegeneration in SCA14 is associated with increased PKCγ kinase activity, mislocalization and aggregation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our findings demonstrate that a combination of both, loss-of-function and gain-of-function mechanisms are likely to underlie the pathogenesis of SCA14, caused by mutations in the C1 domain of PKCγ."
    explanation: The authors conclude that gain and loss of function both contribute.
- name: Dominant-Negative Disruption of Purkinje Cell Synapse Refinement
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PKCgamma is needed for elimination of surplus climbing fiber synapses on
    developing Purkinje cells, and PKCalpha for long-term depression at
    parallel fiber synapses. Lentiviral expression of a mutant PKCgamma in
    mouse Purkinje cells left about a third of cells innervated by multiple
    climbing fibers, impaired long-term depression, and impaired rotarod
    performance. This has been shown only in mice overexpressing the mutant.

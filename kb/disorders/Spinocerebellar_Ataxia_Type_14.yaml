    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Persistent multiple climbing fiber innervation and failed long-term
      depression disturb Purkinje cell function; mice show a motor
      coordination deficit without overt gait ataxia.
    evidence:
    - reference: PMID:21976518

classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      A class of inborn errors of metabolism (lysosomal storage disorders)
      arising from deficiency of a lysosomal glycosidase.
    evidence:
    - reference: PMID:41614773
      reference_title: "Mapping Lysosomal Storage Disorders with Neurological Features by Cellular Pathways: Towards Precision Medicine."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Lysosomal storage disorders (LSDs) represent a diverse group of inherited metabolic diseases in which impaired lysosomal function leads to progressive accumulation of undegraded substrates and widespread cellular dysfunction."
      explanation: >-
        Supports classifying lysosomal storage disorders, including the
        glycoproteinoses, as inherited metabolic diseases.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      The entry models an autosomal recessive Mendelian disease class spanning
      several genes (FUCA1, MAN2B1, MANBA, AGA, NEU1, CTSA, NAGA) rather than
      one disorder.
  icimd_category:
  - classification_value: glycoprotein_degradation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glycoprotein degradation" under category "Disorders of complex molecule
      degradation". This entry is the class-level parent of that ICIMD group,
      so the group is assigned at the class level rather than to any one member
      disorder. Note the deliberate contrast with the ICIMD category
      "Congenital disorders of glycosylation", which covers failures to *build*
      glycans; the oligosaccharidoses are failures to *degrade* them.
    evidence:
    - reference: PMID:27906067
      reference_title: "Aspartylglycosaminuria: a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Aspartylglucosaminuria (AGU), a recessively inherited lysosomal storage disease, is the most common disorder of glycoprotein degradation"
      explanation: >-
        Directly attests the disorder-of-glycoprotein-degradation metabolic
        classification for the class's most prevalent member disorder.
  lysosomal_storage_category:
    classification_value: glycoproteinosis
    notes: >-
      The oligosaccharidoses/glycoproteinoses are the biochemical class defined
      by lysosomal accumulation of undegraded glycoprotein-derived
      oligosaccharides and glycopeptides.
    evidence:
    - reference: PMID:39796208
      reference_title: "Fucosidosis: A Review of a Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This enzyme is responsible for breaking down fucose-containing glycoproteins, glycolipids, and oligosaccharides within the lysosome"
      explanation: >-
        Fucosidosis, a member disorder, illustrates the class-defining lesion -
        a lysosomal glycosidase failing to degrade glycoprotein-derived glycans
        - which is what separates the glycoproteinoses from the
        sphingolipidoses and mucopolysaccharidoses.

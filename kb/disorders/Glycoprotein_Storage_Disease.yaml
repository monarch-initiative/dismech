    quote_role: REVIEW_SYNTHESIS
    snippet: "Schindler disease type II (also known as Kanzaki disease) is characterised by lymphoedema, angiokeratoma corporis diffusum, neurological involvement, peripheral neuropathy, sensorineural hearing loss and recurrent vertigo attacks (with doubtful association with Ménière’s disease)."
    explanation: Independently confirms angiokeratoma corporis diffusum as a hallmark feature of Kanzaki disease (adult-onset NAGA deficiency).

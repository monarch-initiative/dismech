    reference_title: "Aspartylglycosaminuria: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aspartylglucosaminuria (AGU), a recessively inherited lysosomal storage disease, is the most common disorder of glycoprotein degradation"
    explanation: Establishes autosomal recessive inheritance in aspartylglucosaminuria, a representative glycoproteinosis.
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Alpha-mannosidosis is inherited in an autosomal recessive fashion and is caused by mutations in the MAN2B1 gene"
    explanation: Confirms autosomal recessive inheritance in alpha-mannosidosis, a second member disorder.

  description: >-
    All classic glycoprotein storage diseases (fucosidosis, alpha- and
    beta-mannosidosis, aspartylglucosaminuria, sialidosis, galactosialidosis,
    and NAGA deficiency) are inherited in an autosomal recessive manner.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

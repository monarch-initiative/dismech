      snippet: "Elevated neuroinflammatory markers can increase neuronal excitability, leading to the frequent occurrence of epilepsy in affected individuals."
      explanation: Connects CNS neuroinflammation directly to neuronal hyperexcitability and epilepsy in glycoprotein storage disease.

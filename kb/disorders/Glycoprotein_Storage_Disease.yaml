- name: Lysosomal Oligosaccharide Accumulation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Undegraded oligosaccharides and glycopeptides accumulate in lysosomes across
    visceral, mesenchymal, and neural tissues, engorging the organelle and
    causing secondary metabolic and cellular dysfunction as well as spillover of
    undegraded glycans into body fluids and urine.

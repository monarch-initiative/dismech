diagnosis:
- name: Urinary oligosaccharide and glycopeptide screening
  description: >-
    Chromatographic or mass-spectrometric detection of undegraded urinary
    oligosaccharides and glycopeptides provides biochemical screening for the
    oligosaccharidoses, guiding confirmatory enzyme and molecular testing.
  diagnosis_term:
    preferred_term: urinary oligosaccharide screening
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:38831911
    reference_title: "A 37-Year-Old Man With Intellectual Disability Discovered to Have Aspartylglucosaminuria: Implications for the Diagnosis of Genetic Causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed the pathogenicity of the variant by detecting the splicing defect in cDNA from the patient's blood and accumulation of aberrant metabolites in the patient's urine."
    explanation: Detection of aberrant urinary glycan metabolites is central to biochemical screening for the oligosaccharidoses.
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Elevated urinary secretion of mannose-rich oligosaccharides is suggestive, but not diagnostic."
    explanation: Clarifies that urinary oligosaccharide elevation is a screening clue requiring enzymatic or genetic confirmation.
- name: Lysosomal glycosidase enzyme activity assay
  description: >-
    Definitive biochemical diagnosis measures deficient activity of the specific
    lysosomal glycosidase or glycosylasparaginase in peripheral blood leukocytes,
    cultured fibroblasts, or serum.
  diagnosis_term:
    preferred_term: lysosomal glycosidase enzyme assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made by measuring acid alpha-mannosidase activity in leukocytes or other nucleated cells and can be confirmed by genetic testing."
    explanation: Illustrates definitive enzymatic diagnosis in nucleated cells across the glycoproteinoses.
- name: Molecular genetic testing
  description: >-
    Targeted gene sequencing or exome sequencing identifies biallelic pathogenic
    variants in the causative glycoproteinosis gene (FUCA1, MAN2B1, MANBA, AGA,
    NEU1, CTSA, or NAGA), confirming the diagnosis and enabling carrier testing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38831911
    reference_title: "A 37-Year-Old Man With Intellectual Disability Discovered to Have Aspartylglucosaminuria: Implications for the Diagnosis of Genetic Causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given our results, we consider trio-WES to be a powerful method for identifying the causative genes in cases of ID with genetic causes."
    explanation: Demonstrates exome sequencing establishing molecular diagnosis of an undiagnosed glycoprotein storage disorder.
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is made by measuring acid alpha-mannosidase activity in leukocytes or other nucleated cells and can be confirmed by genetic testing."
    explanation: Supports molecular genetic confirmation alongside enzymatic testing.
treatments:
- name: Supportive Care
  action_category: THERAPEUTIC
  description: >-
    Management of most oligosaccharidoses is proactive, supportive, and
    multidisciplinary—addressing recurrent infections, otolaryngological and
    hearing needs, seizures, orthopedic deformities, and developmental support;
    severe infantile forms carry high early mortality.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39796208
    reference_title: "Fucosidosis: A Review of a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients usually die at an early age. Treatment of fucosidosis is a great challenge, and there is currently no definitive effective treatment."
    explanation: Severe forms lack curative therapy and are managed supportively, with early mortality in classic presentations.
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The management should be pro-active, preventing complications and treating manifestations."
    explanation: Summarizes proactive multidisciplinary supportive management across glycoprotein storage disorders.
- name: Enzyme Replacement Therapy
  action_category: THERAPEUTIC
  description: >-
    Intravenous enzyme replacement therapy is approved for non-neurological
    manifestations of alpha-mannosidosis (velmanase alfa) and under preclinical
    investigation for other oligosaccharidoses such as fucosidosis and
    aspartylglucosaminuria; limited blood-brain barrier penetration restricts
    CNS efficacy.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: velmanase alfa
      term:
        id: NCIT:C152849
        label: Velmanase Alfa
  target_mechanisms:
  - target: Lysosomal Glycosidase Deficiency and Impaired Glycoprotein Catabolism
    treatment_effect: RESTORES
    description: Recombinant lysosomal glycosidase replacement (exemplified by velmanase alfa in alpha-mannosidosis) restores deficient peripheral enzyme activity.
    evidence:
    - reference: PMID:29846843
      reference_title: "Efficacy and safety of Velmanase alfa in the treatment of patients with alpha-mannosidosis: results from the core and extension phase analysis of a phase III multicentre, double-blind, randomised, placebo-controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings support the utility of VA for the treatment of AM, with more evident benefit over time and when treatment is started in the paediatric age."
      explanation: Phase III clinical trial supports clinical utility of enzyme replacement therapy in alpha-mannosidosis.
  - target: Lysosomal Oligosaccharide Accumulation
    treatment_effect: RESTORES
    description: Peripheral enzyme replacement clears accumulated circulating and visceral oligosaccharides.
    evidence:
    - reference: PMID:29846843
      reference_title: "Efficacy and safety of Velmanase alfa in the treatment of patients with alpha-mannosidosis: results from the core and extension phase analysis of a phase III multicentre, double-blind, randomised, placebo-controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mean relative change in S-oligo in the VA arm was -77.6% [95% confidence interval (CI) -81.6 to -72.8] at week 52"
      explanation: Demonstrates substantial reduction in accumulated oligosaccharide burden with velmanase alfa.
  evidence:
  - reference: PMID:29846843
    reference_title: "Efficacy and safety of Velmanase alfa in the treatment of patients with alpha-mannosidosis: results from the core and extension phase analysis of a phase III multicentre, double-blind, randomised, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings support the utility of VA for the treatment of AM, with more evident benefit over time and when treatment is started in the paediatric age."
    explanation: Phase III core and extension trial results support clinical efficacy of velmanase alfa enzyme replacement therapy in alpha-mannosidosis, particularly when initiated in childhood.
  - reference: PMID:39796208
    reference_title: "Fucosidosis: A Review of a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In another treatment approach, enzyme replacement therapy, preclinical studies are ongoing for fucosidosis, but the blood-brain barrier is a major obstacle in lysosomal storage diseases affecting the central nervous system."
    explanation: Notes ongoing preclinical ERT development in fucosidosis and the shared blood-brain barrier limitation across neuronopathic oligosaccharidoses.
- name: Hematopoietic Cell Transplantation
  action_category: THERAPEUTIC
  description: >-
    Allogeneic hematopoietic stem cell transplantation supplies donor-derived
    enzyme-competent cells and can normalize leukocyte enzyme activity and
    stabilize neurocognitive decline when performed early in selected members
    (such as alpha-mannosidosis and fucosidosis), whereas it has not proved
    effective in aspartylglucosaminuria and carries substantial transplant-related
    morbidity.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Lysosomal Glycosidase Deficiency and Impaired Glycoprotein Catabolism
    treatment_effect: RESTORES
    description: Engrafted donor hematopoietic cells restore leukocyte lysosomal glycosidase activity and cross-correct recipient tissues in responsive glycoproteinoses.
    evidence:
    - reference: PMID:15126988
      reference_title: Effective treatment of alpha-mannosidosis by allogeneic hematopoietic stem cell transplantation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients are alive, with normalization of leukocyte enzyme activity after HCT."
      explanation: Demonstrates restoration of leukocyte enzyme activity after allogeneic HCT in alpha-mannosidosis.
  evidence:
  - reference: PMID:15126988
    reference_title: Effective treatment of alpha-mannosidosis by allogeneic hematopoietic stem cell transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCT can halt the progressive cognitive loss in patients with alpha-mannosidosis. Early diagnosis and treatment with HCT is critical for optimal results."
    explanation: Supports disease-modifying stabilization in early-transplanted alpha-mannosidosis patients.
  - reference: PMID:27906067
    reference_title: "Aspartylglycosaminuria: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Allogenic stem cell transplantation has not proved effective in curing AGU."
    explanation: Documents member-specific limitation of HCT efficacy within the glycoproteinosis class.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Genetic counseling is indicated for affected families to explain autosomal
    recessive inheritance, 25% recurrence risk, carrier testing, and prenatal or
    preimplantation diagnostic options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18651971
    reference_title: Alpha-mannosidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genetic counseling should be given to explain the nature of the disease and to detect carriers."
    explanation: Supports genetic counseling to explain disease inheritance and identify carriers.

  evidence:
  - reference: PMID:39796208
    reference_title: "Fucosidosis: A Review of a Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in FUCA1 result in either reduced enzyme activity or complete loss of function, leading to the accumulation of fucose-rich substrates in lysosomes. Lysosomes become engorged with undigested substrates, which leads to secondary storage defects affecting other metabolic pathways."
    explanation: Substrate accumulation engorging lysosomes is the shared storage lesion of the oligosaccharidoses.
  - reference: PMID:27906067
    reference_title: "Aspartylglycosaminuria: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease is caused by the deficient activity of the lysosomal enzyme glycosylasparaginase (aspartylglucosaminidase, AGA), which leads to a disorder in the degradation of glycoasparagines - aspartylglucosamine or other glycoconjugates with an aspartylglucosamine moiety at their reducing end - and accumulation of these undegraded glycoasparagines in tissues and body fluids."
    explanation: Demonstrates widespread tissue and body-fluid accumulation of undegraded glycoprotein-derived substrates.
  downstream:
  - target: Neuroinflammation and Neurodegeneration
    description: Lysosomal storage drives CNS glial activation and neuronal loss.
  - target: Oligosacchariduria
    description: Undegraded oligosaccharide and glycopeptide substrates spill over into urine.
  - target: Coarse facial features
    description: Somatic glycoprotein storage in craniofacial connective tissues contributes to coarse facial features.
  - target: Hepatosplenomegaly
    description: Visceral glycoconjugate storage produces hepatosplenomegaly.
  - target: Dysostosis multiplex
    description: Skeletal storage pathology produces dysostosis multiplex.
  - target: Growth delay
    description: Multisystem somatic glycan storage impairs postnatal physical growth.
  - target: Hearing impairment
    description: Storage pathology in auditory neural and middle-ear structures causes sensorineural and mixed hearing loss.
  - target: Recurrent infections
    description: Glycan storage and circulating oligosaccharides impair host mucosal clearance and immune function, predisposing to recurrent infections.
  - target: Angiokeratoma
    description: Endothelial lysosomal glycoconjugate storage causes dermal capillary ectasia and angiokeratomas in several glycoproteinoses.
- name: Neuroinflammation and Neurodegeneration
  conforms_to: "lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation"
  biological_scale: TISSUE
  description: >-
    CNS lysosomal dysfunction causes microglial activation, neuroinflammation,
    neuronal apoptosis, axonal degeneration, and synaptic dysfunction, producing
    the progressive neurodegenerative features of the oligosaccharidoses.

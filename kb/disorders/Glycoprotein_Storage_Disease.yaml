notes: >-
  This entry models the class (MONDO:0009296) and its shared final common
  pathway. The member disorders each have their own Disease entry
  (Fucosidosis, Alpha_Mannosidosis, Beta_Mannosidosis, Aspartylglucosaminuria,
  Sialidosis_Type_1, Juvenile_Sialidosis_Type_2, Congenital_Sialidosis_Type_2,
  Galactosialidosis, Schindler_Disease, Kanzaki_Disease,
  NAGA_Deficiency_Type_3); their explicit union is the Grouping
  kb/groupings/Glycoproteinoses.yaml, which is the place to record membership
  and per-member differences.

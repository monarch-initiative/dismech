      Establishes vesicoureteral reflux as a distinct recognized subtype of
      megaureter, alongside the obstructive and non-obstructive
      non-refluxing forms.
- category: Clinical
  name: Recurrent Urinary Tract Infections
  description: >
    Urinary stasis from chronic dilation, with or without superimposed
    reflux, predisposes to recurrent febrile urinary tract infection, the
    most common clinical complication and indication for surgical
    correction in higher-grade disease.
  phenotype_term:
    preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indications for surgical intervention include symptoms such as febrile UTIs or pain, and in the asymptomatic patient, a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms."
    explanation: >-
      A national consensus statement lists febrile urinary tract infection as
      a recognized clinical complication and indication for surgery in
      primary megaureter.
- category: Structural
  name: Renal Parenchymal Thinning
  subtypes:
  - Obstructed
  - Combined Obstructed and Refluxing
  description: >
    Thinning of the renal cortex/parenchyma from sustained back-pressure and
    stasis, an indication for surgical correction rather than continued
    observation; reported predominantly in operated cohorts of the
    obstructed and combined forms. No `frequency:` is assigned here because
    the only quantitative estimates available are drawn from a selected
    surgical (operated) cohort rather than the general primary-megaureter
    population.
  phenotype_term:
    preferred_term: Renal cortical thinning
    term:
      id: HP:0025327
      label: Decreased renal parenchymal thickness
  evidence:
  - reference: PMID:29937413
    reference_title: "Outcome of end cutaneous ureterostomy (ECU) as a non conservative option in the management of primary obstructive megaureters (POM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one had incidentally diagnosed renal cortical thinning"
    explanation: >-
      Reports renal cortical thinning as an observed finding in a surgical
      series of primary obstructive megaureter.
- category: Clinical
  name: Impaired Differential Renal Function
  subtypes:
  - Obstructed
  - Combined Obstructed and Refluxing
  description: >
    A fall in the affected kidney's differential renal function (DRF) on
    diuretic renography, an indication for surgical correction rather than
    continued observation; reported predominantly in the obstructed and
    combined forms. No `frequency:` is assigned here because the only
    quantitative estimates available are drawn from a selected surgical
    (operated) cohort rather than the general primary-megaureter population.
  phenotype_term:
    preferred_term: Impaired differential renal function
    term:
      id: HP:0000083
      label: Renal insufficiency
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms"
    explanation: >-
      A national consensus statement uses a differential-renal-function
      threshold and its serial decline as a criterion for surgical
      intervention, establishing impaired differential renal function as a
      recognized clinical finding in this condition.
progression:
- phase: Non-obstructed non-refluxing form — stabilization or spontaneous resolution
  subtype: Non-obstructed Non-refluxing
  age_range: Infancy through early childhood (typically resolves within several years of diagnosis)
  notes: >-
    The commonest form usually stabilizes or resolves without surgery as the
    ureter grows and the relative caliber mismatch across the aperistaltic
    segment lessens.
  evidence:
  - reference: PMID:22397575
    reference_title: "Long-term follow-up of neonatally diagnosed primary megaureter: rate and predictors of spontaneous resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 72 PM were identified in this series. At the end of the follow-up period, 38 PM (52.8%) had resolved, in 18 PM (25%) ureteral dilatation persisted and 16 PM (22.2%) required a surgical procedure."
    explanation: >-
      Quantifies the spontaneous-resolution, persistence, and eventual
      surgical-requirement rates in long-term follow-up of primary
      megaureter.
- phase: Obstructed and combined forms — persistent or progressive dilation with risk of surgical need
  age_range: Infancy through childhood
  notes: >-
    A minority of cases, concentrated in the obstructed and combined forms,
    show progressive hydroureteronephrosis or declining differential renal
    function and require surgical correction rather than resolving
    spontaneously.
  evidence:
  - reference: PMID:22397575
    reference_title: "Long-term follow-up of neonatally diagnosed primary megaureter: rate and predictors of spontaneous resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor drainage on (99m)Tc-DTPA scan, grade IV-V hydronephrosis and ureteric diameter more than 15.0 mm were statistically significant and independent predictive factors for surgery."
    explanation: >-
      Identifies high-grade hydronephrosis, poor drainage, and larger
      ureteral diameter as predictors of progression to surgery rather than
      spontaneous resolution.
diagnosis:
- name: Renal and Bladder Ultrasonography
  description: >
    Prenatal or postnatal ultrasound is the first-line imaging study; it
    establishes ureteral and collecting-system dilation and provides the
    measured ureteric diameter (>7 mm is considered abnormal) used to define
    a megaureter in the first place.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BAPU defined a ureteric diameter over 7 mm as abnormal."
    explanation: >-
      Establishes the ultrasound-measured diameter threshold used to define
      pathological ureteral dilation.
- name: Voiding Cystourethrography to Exclude Reflux and Bladder Outlet Obstruction
  description: >
    A micturating cystourethrogram (MCUG/VCUG) is performed to exclude
    vesicoureteral reflux and bladder outlet obstruction (e.g., posterior
    urethral valves). This step is what makes the diagnosis "primary" rather
    than secondary: a positive reflux finding does not exclude the disease,
    but instead reclassifies the case into the refluxing or combined form,
    while a mechanical bladder-outlet lesion reclassifies it as secondary
    megaureter, out of scope for this entry.
  diagnosis_term:
    preferred_term: cystography
    term:
      id: NCIT:C38049
      label: Cystography
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "be investigated with an ultrasound scan and micturating cystourethrogram, followed by a diuretic renogram once VUR and bladder outlet obstruction had been excluded"
    explanation: >-
      A national consensus statement specifies the diagnostic sequence used
      to exclude vesicoureteral reflux and bladder outlet obstruction before
      a case is confirmed as (or subtyped within) primary megaureter.
- name: Diuretic Renography for Differential Renal Function and Drainage
  description: >
    A diuretic (MAG-3) renogram is obtained once reflux and bladder outlet
    obstruction have been excluded, to quantify differential renal function
    (DRF) and drainage; a DRF below 40%, or a drop in differential function
    on serial studies, is an indication for surgical intervention rather than
    continued observation.
  diagnosis_term:
    preferred_term: renography
    term:
      id: NCIT:C38086
      label: Renography
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms"
    explanation: >-
      Establishes the diuretic-renogram-derived differential-renal-function
      threshold used to decide between continued observation and surgery.
treatments:
- name: Surveillance and Expectant Management
  description: >
    Conservative management with serial ultrasound (and, when indicated,
    functional renal scintigraphy) to monitor for spontaneous resolution or
    stabilization of ureteral dilation, the standard approach for the
    non-obstructed, non-refluxing form, which most often improves or resolves
    without intervention as the child grows.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial management of primary megaureters is conservative."
    explanation: >-
      A national consensus statement establishes conservative management as
      the standard initial approach.
  - reference: PMID:38441661
    reference_title: "Primary non-refluxing megaureter: Natural history, follow-up and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most often PMU remains asymptomatic with spontaneous resolution allowing for non-operative management."
    explanation: >-
      Supports non-operative management as appropriate given the frequency of
      spontaneous resolution, particularly in the non-obstructed
      non-refluxing form.
- name: Continuous Antibiotic Prophylaxis
  description: >
    Low-dose prophylactic antibiotics to reduce the risk of febrile urinary
    tract infection while reflux or high-grade dilation is present or being
    monitored.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommendation was for newborns with prenatally diagnosed hydroureteronephrosis to receive antibiotic prophylaxis"
    explanation: >-
      A national consensus statement recommends antibiotic prophylaxis in
      newborns with prenatally diagnosed hydroureteronephrosis pending
      diagnostic work-up.
- name: Ureteral Reimplantation with Tailoring
  description: >
    Surgical excision of the aperistaltic segment with tapering or folding
    (tailoring) of the dilated distal ureter and reimplantation into the
    bladder using an antireflux technique, indicated for progressive
    obstruction, high-grade reflux, deteriorating renal function, or
    breakthrough infection despite prophylaxis — most often required in the
    obstructed and combined forms.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Aperistaltic Juxtavesical Ureteric Segment
    treatment_effect: BYPASSES
    description: >-
      The diseased, aperistaltic segment is excised outright and replaced
      with a tapered, reimplanted ureter using an antireflux tunnel — the
      defective segment is removed rather than restored to normal
      peristaltic function.
    evidence:
    - reference: PMID:24206785
      reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The BAPU recommended a ureteral reimplantation in patients over 1 year of age but recognized that the procedure may be challenging in infancy."
      explanation: >-
        A national consensus statement recommends ureteral reimplantation,
        which excises the aperistaltic segment, as the definitive procedure
        for progressive disease.
  evidence:
  - reference: PMID:24206785
    reference_title: "British Association of Paediatric Urologists consensus statement on the management of the primary obstructive megaureter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BAPU recommended a ureteral reimplantation in patients over 1 year of age but recognized that the procedure may be challenging in infancy."
    explanation: >-
      A national consensus statement recommends ureteral reimplantation as
      the definitive surgical procedure for progressive disease.
  - reference: PMID:11387761
    reference_title: "Megaureter: classification, pathophysiology, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Operative intervention is indicated only in these cases: significant impairment to urine flow; worsening renal function during the observation time; recurrent UTI in spite of adequate antibiotic prophylaxis."
    explanation: >-
      Establishes the accepted indications for surgical correction of
      primary megaureter.
- name: Endoscopic High-Pressure Balloon Dilation
  description: >
    Endoscopic dilation of the aperistaltic ureterovesical junction segment
    with a high-pressure balloon catheter, followed by temporary double-J
    stenting, increasingly used as a less invasive alternative to open
    ureteral reimplantation for the obstructed form.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Balloon Dilation
    term:
      id: NCIT:C113728
      label: Balloon Dilation
  target_mechanisms:
  - target: Aperistaltic Juxtavesical Ureteric Segment
    treatment_effect: MODULATES
    description: >-
      Mechanical dilation of the aperistaltic segment widens its lumen so
      that urine can pass by relatively passive flow despite the segment's
      persistent failure to generate an active peristaltic wave; the
      segment's contractile deficit itself is not corrected.
    evidence:
    - reference: PMID:30345263
      reference_title: "Long-Term Outcomes in Primary Obstructive Megaureter Treated by Endoscopic Balloon Dilation. Experience After 100 Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "EBD of the vesicoureteral junction was performed with semicompliant high-pressure balloon catheters (2.7FG) with minimum balloon diameter of 5 mm, followed by temporary Double-J stent placement."
      explanation: >-
        Describes the endoscopic balloon dilation procedure as mechanically
        widening the ureterovesical junction segment rather than restoring
        its contractile activity.
  evidence:
  - reference: PMID:30345263
    reference_title: "Long-Term Outcomes in Primary Obstructive Megaureter Treated by Endoscopic Balloon Dilation. Experience After 100 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopic approach of POM had a long-term success rate of 87.3%, with a mean follow-up of 6.4 ± 3.8 years."
    explanation: >-
      A large single-center series reports a high long-term success rate for
      endoscopic balloon dilation in obstructed primary megaureter.
  - reference: PMID:38954357
    reference_title: "Advancements in Surgical Management of Megaureters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopic balloon dilation has been on the rise as a major treatment option for obstructive megaureter, while refluxing megaureters can also be treated by laparoscopic and robotic techniques, whether extravesically or transvesicoscopically."
    explanation: >-
      A 2024 review confirms endoscopic balloon dilation as an increasingly
      used surgical option specifically for the obstructed form.
- name: Temporizing Urinary Diversion
  description: >
    Cutaneous ureterostomy or nephrostomy drainage used as a temporizing
    measure in severe neonatal or infantile disease (e.g., with sepsis, poor
    renal function, or a very small infant) prior to definitive
    reimplantation.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:31968361
    reference_title: "[Primary megaureter in the newborn period: making the case for a temporary splint-free cutaneous ureterostomy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a first step, we place a temporary splint-free ureterocutaneostomy for early disobstruction"
    explanation: >-
      Supports a temporary cutaneous ureterostomy as a first-stage
      temporizing measure in severely dilated neonatal megaureter, prior to
      definitive corrective surgery.

discussions:
- discussion_id: megaureter_no_validated_animal_model
  prompt: >-
    Does a validated animal model of isolated (non-syndromic) primary
    megaureter exist that reproduces the aperistaltic-segment mechanism, so
    the developmental origin of the abnormal circular:longitudinal muscle
    ratio and collagen deposition can be tested experimentally?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - animal_models#
  - pathophysiology#Aperistaltic Juxtavesical Ureteric Segment
  rationale: >-
    No mouse, rat, zebrafish, or organoid model of isolated primary
    obstructive megaureter is established in the literature reviewed for
    this entry, so the developmental origin of the aperistaltic segment
    (a smooth-muscle differentiation or maturation defect versus a
    structural anomaly of the ureteric bud) has not been tested causally
    in a model system. Resolving this would let the "delayed smooth-muscle
    maturation" hypothesis for spontaneous resolution be tested directly.
  proposed_experiments:
  - experiment_id: megaureter_mouse_smooth_muscle_perturbation
    name: Conditional ureteric smooth-muscle differentiation perturbation in mouse
    description: >-
      A conditional or hypomorphic perturbation of ureteric smooth-muscle
      differentiation genes in mouse, timed to the equivalent of the
      third-trimester ureteric bud/metanephric mesenchyme interaction window,
      scored for a juxtavesical aperistaltic segment and collagen deposition
      by whole-mount contractility imaging and histology.
- discussion_id: megaureter_no_clingen_gene_disease_relationship
  prompt: >-
    Is there a single-gene or oligogenic cause of isolated primary
    megaureter distinct from the broader CAKUT gene set (PAX2, TBX18, SIX2,
    BMP4, NRIP1, and others), which explain CAKUT generally but have not
    been shown to cause isolated megaureter specifically?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#
  rationale: >-
    No ClinGen-level gene-disease validity relationship, recurrent
    pathogenic variant, inheritance pattern, or carrier frequency has been
    established for isolated congenital primary megaureter. This is why
    `genetic:` is deliberately absent from this entry: the broader CAKUT
    gene set is well documented for CAKUT as a whole, but attributing it to
    isolated primary megaureter specifically would be unsupported
    extrapolation.
  evidence:
  - reference: PMID:39076761
    reference_title: "Congenital anomalies of the kidney and urinary tract."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in specific genes such as PAX2, TBX18, NRIP1, REX, SIX2, BMP4, and chromosome 17 cause CAKUT."
    explanation: >-
      Establishes the genes documented for CAKUT as a whole; the entry does
      not address primary megaureter specifically, which is the gap this
      discussion records — the general CAKUT gene set should not be
      mechanically re-attributed to this specific, largely idiopathic
      lesion.
- discussion_id: megaureter_no_replicated_omics_signature
  prompt: >-
    Would a transcriptomic, proteomic, or single-cell profile of the
    aperistaltic segment versus the adjacent normally peristaltic ureter
    identify the molecular drivers of the abnormal circular:longitudinal
    muscle ratio and collagen deposition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aperistaltic Juxtavesical Ureteric Segment
  rationale: >-
    No replicated transcriptomic, proteomic, single-cell, or spatial
    profiling study of the aperistaltic segment has been identified in the
    literature reviewed for this entry. TGF-beta signaling and collagen
    remodeling have been proposed as candidate pathways, but no molecular
    profile has been generated to test them directly against the adjacent,
    normally peristaltic ureter from the same patients.
  proposed_experiments:
  - experiment_id: megaureter_paired_segment_transcriptomics
    name: Paired transcriptomic profiling of aperistaltic versus dilated ureteric segments
    description: >-
      Paired single-cell or bulk RNA-seq of the excised aperistaltic segment
      and the adjacent dilated (normally muscularized) ureter obtained at the
      same reimplantation surgery, contrasting smooth-muscle differentiation,
      extracellular-matrix, and TGF-beta pathway gene expression between the
      two regions.

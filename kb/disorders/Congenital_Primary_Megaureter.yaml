name: Congenital Primary Megaureter
creation_date: "2026-08-26T00:00:00Z"
category: Congenital
disease_term:
  preferred_term: congenital primary megaureter
  term:
    id: MONDO:0018960
    label: congenital primary megaureter
synonyms:
- congenital giant megaureter
- congenital megalo-ureter
- congenital primary megalo-ureter
- CGM
parents:
- kidney disorder
- disorder of development or morphogenesis
- congenital anomaly of the kidney and urinary tract (CAKUT)
description: >
  Congenital primary megaureter is a developmental anomaly of the distal ureter
  in which a short, non-dilated segment immediately above the ureterovesical
  junction (the juxtavesical/intramural segment) is intrinsically aperistaltic:
  an abnormal circular-to-longitudinal smooth muscle fiber ratio and excess
  interposed collagen disrupt the muscular continuity required to propagate a
  peristaltic wave, so the segment fails to actively transport the urine bolus
  across the ureterovesical junction. The bladder and bladder outlet are
  normal. Because this is an intrinsic lesion of the ureteric wall itself
  rather than a fixed anatomic stricture or a bladder-outlet problem, primary
  megaureter is defined by exclusion of secondary causes of ureteral dilation
  (posterior urethral valves, neurogenic bladder, extrinsic compression, or
  high-grade reflux from an unrelated cause). Within primary megaureter, the
  same aperistaltic segment can differentially produce a functional (dynamic)
  impediment to antegrade urine transport and/or coincide with a separate,
  shortened intravesical ureteric tunnel that renders the ureterovesical
  junction incompetent to reflux — so the Smith/King classification divides
  primary megaureter into four forms according to whether obstruction and/or
  reflux accompany the aperistaltic segment: obstructed, refluxing,
  non-obstructed and non-refluxing (the commonest form, usually detected
  antenatally or incidentally and managed conservatively because most resolve
  or stabilize with growth), and combined obstructed-and-refluxing. Chronic
  impaired antegrade bolus transport, with or without reflux, produces
  progressive proximal ureteral dilation and elongation (megaureter) that can
  transmit back-pressure and stasis to the collecting system, causing
  hydroureteronephrosis; sustained high-grade cases risk recurrent urinary
  tract infection and, uncommonly, progressive renal impairment. Primary
  megaureter sits within the broader congenital anomalies of the kidney and
  urinary tract (CAKUT) spectrum alongside vesicoureteral reflux and
  ureteropelvic junction obstruction.
notes: >
  Scope: this entry models the four congenital ("infantile-onset") Smith/King
  forms of PRIMARY megaureter — obstructed, refluxing, non-obstructed and
  non-refluxing, and combined obstructed-and-refluxing — corresponding to
  MONDO:0016550, MONDO:0016551, MONDO:0016552, and MONDO:0035295 respectively.
  A distinct, separately MONDO-coded adult-onset form (primary megaureter,
  adult-onset form, MONDO:0016549) is out of scope here. SECONDARY megaureter
  (posterior urethral valves, neurogenic/non-neurogenic voiding dysfunction,
  prune-belly syndrome, or high-grade reflux from a defined syndromic cause) is
  likewise out of scope and belongs on the respective causative entry; the
  defining feature of "primary" megaureter is that the ureteral wall lesion is
  intrinsic and the bladder/bladder outlet are normal. This entry is
  cross-referenced to Familial_Vesicoureteral_Reflux.yaml, which models
  primary VUR arising from an isolated incompetent ureterovesical junction
  without an aperistaltic segment or ureteral dilation as its defining lesion —
  the "refluxing" and "combined" forms of primary megaureter here additionally
  require the aperistaltic segment plus ureteral dilation, distinguishing them
  from familial VUR.
has_subtypes:
- name: Obstructed
  display_name: Obstructed primary megaureter
  description: >
    The aperistaltic juxtavesical segment functionally impedes antegrade urine
    bolus transport (a dynamic, not a fixed anatomic, obstruction) without
    reflux, producing progressive proximal ureteral dilation and, in more
    severe or bilateral cases, hydroureteronephrosis and risk of impaired
    differential renal function.
  subtype_term:
    preferred_term: congenital primary megaureter, obstructed form
    term:
      id: MONDO:0016550
      label: congenital primary megaureter, obstructed form
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indications for surgical intervention include symptoms such as febrile UTIs or pain, and in the asymptomatic patient, a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms."
    explanation: >-
      Supports that the obstructed form risks progressive hydronephrosis and
      impaired differential renal function that may require surgical
      correction.
- name: Refluxing
  display_name: Refluxing primary megaureter
  description: >
    The aperistaltic segment coincides with a separate, shortened intravesical
    (submucosal) ureteric tunnel that renders the ureterovesical junction
    incompetent, producing vesicoureteral reflux in addition to the primary
    ureteral dilation from impaired antegrade transport.
  subtype_term:
    preferred_term: congenital primary megaureter, refluxing form
    term:
      id: MONDO:0016551
      label: congenital primary megaureter, refluxing form
  evidence:
  - reference: PMID:9610598
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Refluxing megaureters contained only 55% +/- 15% type I collagen. However, there was an increase in type III collagen (16% +/- 4%) versus (4.5% +/- 2%) in controls (P <0.05)."
    explanation: >-
      Quantitative histology shows the refluxing form has a distinct collagen
      subtype composition (relatively more type III collagen) compared with
      the obstructed form, a stiffer, less distensible fiber associated with
      lower surgical reimplantation success in the source study.
- name: Non-obstructed Non-refluxing
  display_name: Non-obstructed, non-refluxing primary megaureter
  description: >
    The commonest form: the aperistaltic segment produces ureteral dilation
    without a demonstrable functional obstruction or reflux. Most cases are
    detected antenatally or incidentally, remain stable or improve with growth
    of the ureter and resolution of the relative caliber mismatch across the
    segment, and are managed with observation rather than surgery.
  subtype_term:
    preferred_term: congenital primary megaureter, nonrefluxing and unobstructed form
    term:
      id: MONDO:0016552
      label: congenital primary megaureter, nonrefluxing and unobstructed form
  evidence:
  - reference: PMID:38441661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PMU is the result of an atonic or stenotic segment of the distal ureter, resulting in congenital dilation of the ureter, and is frequently diagnosed on routine antenatal ultrasound."
    explanation: >-
      Supports the atonic (aperistaltic) distal ureteric segment mechanism
      and typical antenatal detection of the non-obstructed non-refluxing
      form.
  - reference: PMID:22397575
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 72 PM were identified in this series. At the end of the follow-up period, 38 PM (52.8%) had resolved, in 18 PM (25%) ureteral dilatation persisted and 16 PM (22.2%) required a surgical procedure."
    explanation: >-
      Long-term follow-up of neonatally diagnosed primary megaureter shows
      that more than half resolve spontaneously, supporting the conservative
      management approach for this commonest form.
- name: Combined Obstructed and Refluxing
  display_name: Combined obstructed-and-refluxing primary megaureter
  description: >
    The aperistaltic segment both functionally impedes antegrade transport and
    coincides with an incompetent ureterovesical junction, so obstruction and
    reflux co-occur; this form carries the greatest risk of progressive
    hydroureteronephrosis, recurrent urinary tract infection, and renal injury,
    and most often requires surgical correction.
  subtype_term:
    preferred_term: congenital primary megaureter, refluxing and obstructed form
    term:
      id: MONDO:0035295
      label: congenital primary megaureter, refluxing and obstructed form
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indications for surgical intervention include symptoms such as febrile UTIs or pain, and in the asymptomatic patient, a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms."
    explanation: >-
      Supports that combined obstruction and reflux carries risk of
      progressive hydronephrosis and impaired differential renal function
      requiring surgical correction.
pathophysiology:
- name: Aperistaltic Juxtavesical Ureteric Segment
  description: >
    A short segment of ureter immediately proximal to the ureterovesical
    junction shows an abnormal circular-to-longitudinal smooth muscle fiber
    ratio together with excess interposed collagen deposition between and
    around the muscle bundles. This disrupted muscular architecture prevents
    the coordinated, wavelike smooth muscle contraction required to propagate
    a peristaltic wave, so the segment cannot actively transport the urine
    bolus across the ureterovesical junction even though it is not narrowed
    (not a fixed anatomic stricture). This lesion is common to all four
    Smith/King forms of primary megaureter.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ureter smooth muscle cell
    term:
      id: CL:1000979
      label: ureter smooth muscle cell
  biological_processes:
  - preferred_term: ureteric peristalsis
    modifier: ABSENT
    term:
      id: GO:0072105
      label: ureteric peristalsis
  - preferred_term: collagen fibril organization
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  locations:
  - preferred_term: ureterovesical junction
    term:
      id: UBERON:0009973
      label: ureterovesical junction
  evidence:
  - reference: PMID:17301719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked muscle hypoplasia and sparse or no ICCs occurred in the longitudinal muscle layer of the restricted ureteral segments."
    explanation: >-
      Surgical specimens of primary obstructive megaureter show the muscular
      abnormality is confined to the longitudinal muscle layer of the
      restricted (aperistaltic) segment, supporting an abnormal
      circular-to-longitudinal muscle architecture at this site.
  - reference: PMID:34315317
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obstructed segment showed excess collagen intervening between smooth muscles, excess c-Kit positive cells, and presence of telocytes."
    explanation: >-
      Histology of the aperistaltic (obstructed) segment demonstrates excess
      collagen deposited between smooth muscle bundles, directly supporting
      the excess collagen component of the mechanism.
  - reference: PMID:34315317
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the obstructed segment had no muscle conductivity due to excess collagen irrespective of presence of telocytes"
    explanation: >-
      Links the excess interposed collagen directly to loss of muscular
      conductivity, the mechanism by which the segment fails to propagate a
      peristaltic wave.
  - reference: PMID:9610598
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical studies demonstrated increases in collagen types I and III for both obstructed and refluxing megaureters compared with controls (P <0.05)."
    explanation: >-
      A quantitative immunohistochemical study confirms increased collagen
      content in the ureteral wall of both obstructed and refluxing primary
      megaureter compared with normal control ureters.
  downstream:
  - target: Impaired Antegrade Ureteral Bolus Transport
    causal_link_type: DIRECT
    description: >
      Because the aperistaltic segment cannot generate a propagating
      contraction, urine boluses delivered from the normally peristaltic
      proximal ureter are not actively propelled across the segment,
      producing a functional (dynamic) impediment to antegrade urine flow
      distinct from a fixed anatomic narrowing.
  - target: Ureterovesical Junction Incompetence
    causal_link_type: DIRECT
    description: >
      In the refluxing and combined obstructed-and-refluxing forms only, the
      same distal ureteric region also carries a separate, shortened
      intravesical (submucosal) ureteric tunnel, analogous to the lesion of
      isolated primary vesicoureteral reflux, rendering the ureterovesical
      valve mechanism incompetent. This edge does not apply to the obstructed
      or non-obstructed non-refluxing forms.
- name: Impaired Antegrade Ureteral Bolus Transport
  description: >
    The functional (dynamic) impediment to antegrade urine transport across
    the aperistaltic segment, present to some degree whenever the segment
    fails to propagate a peristaltic wave. In the obstructed and combined
    forms this impediment is clinically significant enough to be classified
    as (functional) obstruction; in the non-obstructed non-refluxing form the
    impediment is mild and does not meet criteria for obstruction.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:15665928
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The rhythmic and tonic contractions were suppressed in the megaureters with organic obstruction in comparison with megaureters caused by reflux."
    explanation: >-
      Ex vivo organ-bath contractility testing of excised ureteral wall shows
      suppressed rhythmic and tonic contractile activity in obstructed
      megaureter, supporting impaired muscular transport of the urine bolus.
  downstream:
  - target: Ureteral Dilation (Megaureter)
    causal_link_type: DIRECT
    description: >
      Urine accumulating proximal to the poorly transporting segment
      progressively dilates and elongates the ureter above it.
    evidence:
    - reference: PMID:37961019
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We theorize that this retrograde flow can lead to urinary stasis and urine accumulation in the ureters, resulting in ureteral dilation seen on imaging studies and elevated infection risk."
      explanation: >-
        A mathematical model of ureteral peristalsis supports that abnormal
        (insufficient-amplitude or non-propagating) peristalsis leads to
        urine stasis and accumulation, producing the ureteral dilation seen
        on imaging.
- name: Ureterovesical Junction Incompetence
  description: >
    In the refluxing and combined obstructed-and-refluxing forms, a
    shortened, poorly supported intravesical (submucosal) ureteric tunnel at
    the ureterovesical junction fails to compress against the detrusor during
    bladder filling and voiding, so the normal flap-valve mechanism that
    prevents retrograde urine flow is incompetent. Not present in the
    obstructed or non-obstructed non-refluxing forms.
  biological_scale: TISSUE
  locations:
  - preferred_term: ureterovesical junction
    term:
      id: UBERON:0009973
      label: ureterovesical junction
  downstream:
  - target: Vesicoureteral Reflux
    causal_link_type: DIRECT
    description: >
      An incompetent ureterovesical valve mechanism allows retrograde flow of
      urine from the bladder into the dilated ureter during filling and
      voiding.
- name: Vesicoureteral Reflux
  description: >
    Retrograde flow of urine from the bladder into the ureter (and, in
    higher-grade cases, into the renal pelvis and collecting ducts) through
    the incompetent ureterovesical junction, compounding the dilation already
    produced by impaired antegrade transport. Present only in the refluxing
    and combined obstructed-and-refluxing forms.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:11387761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refluxing megaureter, associated with vesicoureteral reflux (VUR)"
    explanation: >-
      Establishes vesicoureteral reflux as the defining additional feature of
      the refluxing form of primary megaureter within the accepted
      classification scheme.
  downstream:
  - target: Hydroureteronephrosis
    causal_link_type: DIRECT
    description: >
      Reflux superimposed on impaired antegrade transport increases the
      volume and back-pressure of retained urine transmitted to the upper
      tract.
- name: Ureteral Dilation (Megaureter)
  description: >
    Progressive proximal dilation, elongation, and tortuosity of the ureter
    above the aperistaltic segment, the defining structural lesion
    ("megaureter") common to all four forms, differing in degree according to
    whether functional obstruction and/or reflux accompany it.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BAPU defined a ureteric diameter over 7 mm as abnormal."
    explanation: >-
      A national consensus statement establishes the clinical threshold used
      to define pathological ureteral dilation (megaureter).
  downstream:
  - target: Hydroureteronephrosis
    causal_link_type: DIRECT
    description: >
      Chronic dilation and stasis in the ureter transmit back-pressure to the
      renal pelvis and calyces, producing hydronephrosis in addition to
      hydroureter.
- name: Hydroureteronephrosis
  description: >
    Dilation of the ureter (hydroureter) together with dilation of the renal
    pelvis and calyces (hydronephrosis) resulting from chronic impaired
    urinary drainage. Severity ranges from mild and stable (most common in the
    non-obstructed non-refluxing form) to progressive, with risk of recurrent
    urinary tract infection and, in severe or bilateral high-grade disease,
    impaired differential renal function.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22397575
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor drainage on (99m)Tc-DTPA scan, grade IV-V hydronephrosis and ureteric diameter more than 15.0 mm were statistically significant and independent predictive factors for surgery."
    explanation: >-
      Long-term follow-up of neonatally diagnosed primary megaureter shows
      that high-grade hydronephrosis and poor drainage predict progression
      requiring surgical correction, supporting the described severity
      spectrum.
phenotypes:
- category: Structural
  name: Congenital Megaureter
  description: >
    Congenital dilation of the ureter, the defining structural finding of this
    condition, seen to varying degrees across all four Smith/King forms.
  phenotype_term:
    preferred_term: Congenital megaureter
    term:
      id: HP:0008676
      label: Congenital megaureter
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38441661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary non-refluxing megaureter (PMU) is a congenital dilation of the ureter which is not related to vesicoureteral reflux, duplicated collecting systems, ureterocele, ectopic ureter, or posterior urethral valves and accounts for 5 to 10% of all prenatal hydronephrosis (HN) cases."
    explanation: >-
      Confirms congenital ureteral dilation as the defining finding and
      quantifies its share of prenatally detected hydronephrosis cases.
- category: Structural
  name: Hydroureter
  description: >
    Dilation of the ureter proximal to the aperistaltic segment, present to
    some degree in all forms and pronounced in the obstructed and combined
    forms.
  phenotype_term:
    preferred_term: Hydroureter
    term:
      id: HP:0000072
      label: Hydroureter
- category: Structural
  name: Hydronephrosis
  description: >
    Dilation of the renal pelvis and calyces secondary to chronically impaired
    ureteral drainage; frequently the presenting antenatal ultrasound finding.
  phenotype_term:
    preferred_term: Hydronephrosis
    term:
      id: HP:0000126
      label: Hydronephrosis
  evidence:
  - reference: PMID:22397575
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary megaureter (PM) represents 6-10% of all antenatal displaced urinary malformations."
    explanation: >-
      Supports that primary megaureter is frequently detected via antenatal
      hydronephrosis screening.
- category: Structural
  name: Primary Obstructive Megaureter
  subtypes:
  - Obstructed
  - Combined Obstructed and Refluxing
  description: >
    Megaureter with functional obstruction at the aperistaltic juxtavesical
    segment, without reflux, in the obstructed form (and together with reflux
    in the combined form).
  phenotype_term:
    preferred_term: Primary obstructive megaureter
    term:
      id: HP:4000035
      label: Primary obstructive megaureter
  evidence:
  - reference: PMID:11387761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "obstructive megaureter, associated with urine flow impairment at the vesicoureteral junction"
    explanation: >-
      Establishes obstructive megaureter, with urine flow impairment at the
      ureterovesical junction, as a distinct recognized subtype.
- category: Structural
  name: Vesicoureteral Reflux
  subtypes:
  - Refluxing
  - Combined Obstructed and Refluxing
  description: >
    Retrograde flow of urine into the ureter through the incompetent
    ureterovesical junction, present in the refluxing and combined forms.
  phenotype_term:
    preferred_term: Vesicoureteral reflux
    term:
      id: HP:0000076
      label: Vesicoureteral reflux
  evidence:
  - reference: PMID:11387761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refluxing megaureter, associated with vesicoureteral reflux (VUR)"
    explanation: >-
      Establishes vesicoureteral reflux as a distinct recognized subtype of
      megaureter, alongside the obstructive and non-obstructive
      non-refluxing forms.
- category: Clinical
  name: Recurrent Urinary Tract Infections
  description: >
    Urinary stasis from chronic dilation, with or without superimposed
    reflux, predisposes to recurrent febrile urinary tract infection, the
    most common clinical complication and indication for surgical
    correction in higher-grade disease.
  phenotype_term:
    preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indications for surgical intervention include symptoms such as febrile UTIs or pain, and in the asymptomatic patient, a DRF below 40% associated with massive or progressive hydronephrosis, or a drop in differential function on serial renograms."
    explanation: >-
      A national consensus statement lists febrile urinary tract infection as
      a recognized clinical complication and indication for surgery in
      primary megaureter.
treatments:
- name: Surveillance and Expectant Management
  description: >
    Conservative management with serial ultrasound (and, when indicated,
    functional renal scintigraphy) to monitor for spontaneous resolution or
    stabilization of ureteral dilation, the standard approach for the
    non-obstructed, non-refluxing form, which most often improves or resolves
    without intervention as the child grows.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial management of primary megaureters is conservative."
    explanation: >-
      A national consensus statement establishes conservative management as
      the standard initial approach.
  - reference: PMID:38441661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most often PMU remains asymptomatic with spontaneous resolution allowing for non-operative management."
    explanation: >-
      Supports non-operative management as appropriate given the frequency of
      spontaneous resolution, particularly in the non-obstructed
      non-refluxing form.
- name: Continuous Antibiotic Prophylaxis
  description: >
    Low-dose prophylactic antibiotics to reduce the risk of febrile urinary
    tract infection while reflux or high-grade dilation is present or being
    monitored.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommendation was for newborns with prenatally diagnosed hydroureteronephrosis to receive antibiotic prophylaxis and be investigated with an ultrasound scan and micturating cystourethrogram, followed by a diuretic renogram once VUR and bladder outlet obstruction had been excluded."
    explanation: >-
      A national consensus statement recommends antibiotic prophylaxis in
      newborns with prenatally diagnosed hydroureteronephrosis pending
      diagnostic work-up.
- name: Ureteral Reimplantation with Tailoring
  description: >
    Surgical excision of the aperistaltic segment with tapering or folding
    (tailoring) of the dilated distal ureter and reimplantation into the
    bladder using an antireflux technique, indicated for progressive
    obstruction, high-grade reflux, deteriorating renal function, or
    breakthrough infection despite prophylaxis — most often required in the
    obstructed and combined forms.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:24206785
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BAPU recommended a ureteral reimplantation in patients over 1 year of age but recognized that the procedure may be challenging in infancy."
    explanation: >-
      A national consensus statement recommends ureteral reimplantation as
      the definitive surgical procedure for progressive disease.
  - reference: PMID:11387761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Operative intervention is indicated only in these cases: significant impairment to urine flow; worsening renal function during the observation time; recurrent UTI in spite of adequate antibiotic prophylaxis."
    explanation: >-
      Establishes the accepted indications for surgical correction of
      primary megaureter.
- name: Endoscopic High-Pressure Balloon Dilation
  description: >
    Endoscopic dilation of the aperistaltic ureterovesical junction segment
    with a high-pressure balloon catheter, followed by temporary double-J
    stenting, increasingly used as a less invasive alternative to open
    ureteral reimplantation for the obstructed form.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Balloon Dilation
    term:
      id: NCIT:C113728
      label: Balloon Dilation
  evidence:
  - reference: PMID:30345263
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopic approach of POM had a long-term success rate of 87.3%, with a mean follow-up of 6.4 ± 3.8 years."
    explanation: >-
      A large single-center series reports a high long-term success rate for
      endoscopic balloon dilation in obstructed primary megaureter.
  - reference: PMID:38954357
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopic balloon dilation has been on the rise as a major treatment option for obstructive megaureter, while refluxing megaureters can also be treated by laparoscopic and robotic techniques, whether extravesically or transvesicoscopically."
    explanation: >-
      A 2024 review confirms endoscopic balloon dilation as an increasingly
      used surgical option specifically for the obstructed form.
- name: Temporizing Urinary Diversion
  description: >
    Cutaneous ureterostomy or nephrostomy drainage used as a temporizing
    measure in severe neonatal or infantile disease (e.g., with sepsis, poor
    renal function, or a very small infant) prior to definitive
    reimplantation.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:31968361
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a first step, we place a temporary splint-free ureterocutaneostomy for early disobstruction"
    explanation: >-
      Supports a temporary cutaneous ureterostomy as a first-stage
      temporizing measure in severely dilated neonatal megaureter, prior to
      definitive corrective surgery.

name: Verruga Peruana
creation_date: "2026-09-28T17:23:37Z"
category: Infectious Disease
parents:
- Oroya fever
- Bartonellosis
- Bacterial infectious disease
synonyms:
- Peruvian wart
- eruptive-phase bartonellosis
- chronic-phase Carrion disease
description: >-
  Verruga peruana is the chronic eruptive phase of Carrion disease, a
  sand-fly-transmitted Bartonella bacilliformis infection in which endothelial
  infection and BafA-driven VEGF receptor signaling produce bleeding,
  angioproliferative cutaneous papules and nodules with arthralgia and very low
  phase-specific mortality.
disease_term:
  preferred_term: verruga peruana
  term:
    id: MONDO:0971058
    label: verruga peruana
references:
- reference: PMID:1693472
  title: Bartonella bacilliformis stimulates endothelial cells in vitro and is angiogenic in vivo.
  findings:
  - statement: >-
      B. bacilliformis produces the tissue-phase verruga peruana eruption
      through endothelial-cell proliferation; bacterial extracts stimulate human
      endothelial proliferation and angiogenesis in an in-vivo assay.
    supporting_text: "Bartonellosis, a biphasic disease caused by motile intracellular bacteria, produces in its tissue phase a characteristic dermal eruption (Verruga peruana) resulting from a pronounced endothelial cell proliferation."
- reference: PMID:35379004
  title: The Passenger Domain of Bartonella bacilliformis BafA Promotes Endothelial Cell Angiogenesis via the VEGF Receptor Signaling Pathway.
  findings:
  - statement: >-
      The B. bacilliformis autotransporter BafA passenger domain activates
      VEGFR2/ERK signaling in human endothelial cells, directly supporting BafA
      as a proangiogenic virulence factor in verruga peruana.
    supporting_text: "The identification of a proangiogenic factor produced by B. bacilliformis that directly stimulates endothelial cells provides an important insight into the pathophysiology of verruga peruana."
- reference: PMID:10077844
  title: Involvement of host cell tyrosine phosphorylation in the invasion of HEp-2 cells by Bartonella bacilliformis.
  findings:
  - statement: >-
      Protein-kinase inhibitors reduce B. bacilliformis internalization into
      human cells, and anti-alpha 5/anti-beta 1 integrin antibodies moderately
      reduce Bartonella uptake into nucleated cells.
    supporting_text: "Exposure of HEp-2 cell monolayers to anti-alpha 5 and anti-beta 1 chain integrin monoclonal antibodies resulted in a moderate decrease in the invasion of these cells"
- reference: PMID:15798808
  title: "Bartonelosis (Carrion's Disease) in the pediatric population of Peru: an overview and update."
  findings:
  - statement: >-
      The eruptive phase of Carrion disease, also called Peruvian wart, is
      characterized by bleeding eruptive nodes and arthralgia, has extremely low
      mortality, is diagnosed with biopsy or serologic assays, and is treated
      with rifampin or alternative azithromycin/erythromycin.
    supporting_text: "The eruptive phase, also known as Peruvian Wart, is characterized by eruptive nodes (which commonly bleed) and arthralgias."
- reference: PMID:26824740
  title: "Multi-Locus Sequence Typing of Bartonella bacilliformis DNA Performed Directly from Blood of Patients with Oroya's Fever During a Peruvian Outbreak."
  findings:
  - statement: >-
      B. bacilliformis is the etiologic agent of Carrion disease, the infection
      is endemic in Andean regions, and an estimated 1.7 million South Americans
      are at risk.
    supporting_text: "Bartonella bacilliformis is the etiological agent of Carrion's disease, a neglected tropical poverty-linked illness."
- reference: PMID:25032975
  title: "Oroya fever and verruga peruana: bartonelloses unique to South America."
  findings:
  - statement: >-
      The Bartonella bacilliformis infection that causes Carrion disease is
      presumed to be transmitted between people by phlebotomine sand flies.
    supporting_text: "presumed to be transmitted between humans by phlebotomine sand flies."
- reference: PMID:31780437
  title: Cutaneous manifestations of bartonellosis.
  findings:
  - statement: >-
      Peruvian wart caused by B. bacilliformis can be clinically
      indistinguishable from bacillary angiomatosis caused by other Bartonella
      species.
    supporting_text: "Peruvian wart, caused by B. bacilliformis, may be indistinguishable from bacillary angiomatosis caused by the other two species."

treatments:
- name: Rifampicin or Macrolide Therapy for Verruga Peruana
  description: >-
    Rifampicin is the recommended antibacterial treatment for the eruptive phase,
    with azithromycin or erythromycin as alternatives that retain intracellular
    activity against Bartonella.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bartonella bacilliformis Endothelial Invasion
    description: >-
      Antibacterial therapy clears the intracellular bacterium that drives
      chronic endothelial infection.
  - target: Bartonella BafA-VEGFR2 Angiogenic Signaling
    description: >-
      Eradicating B. bacilliformis removes the bacterial BafA stimulus for VEGFR2
      signaling and angioproliferation.
  evidence:
  - reference: PMID:15798808
    reference_title: "Bartonelosis (Carrion's Disease) in the pediatric population of Peru: an overview and update."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During the eruptive phase the recommended treatment is rifampin, and
      alternatively, azithromycin or erythromycin.
    explanation: >-
      The review identifies rifampin as the recommended eruptive-phase therapy
      and azithromycin/erythromycin as alternatives.
notes: >-
  This entry models the chronic endothelial eruptive phase. The sibling
  Oroya_Fever entry models the acute erythrocytic hemolysis phase of Carrion
  disease. MONDO currently asserts verruga peruana as an is_a child of Oroya
  fever; the parent is retained here for ontology consistency even though the
  two records are clinically phase-specific manifestations of Bartonella
  bacilliformis infection.

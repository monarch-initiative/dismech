- phase: Chronic endothelial angioproliferative phase
  notes: >-
    Verruga peruana is the tissue phase of Carrion disease: after the shared
    sand-fly-acquired infection, bacterial tropism for endothelial cells replaces
    the erythrocyte tropism that dominates acute Oroya fever.
  evidence:
  - reference: PMID:1693472

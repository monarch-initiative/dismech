animal_models:
- name: Harlequin (Hq) mouse
  species: Mouse
  genotype: Aifm1 Hq proviral insertion (hypomorph, about 80% reduction in AIF)
  publication: PMID:12353028
  description: >-
    A spontaneous X-linked hypomorph with a retroviral insertion in Aifm1.
    Hemizygous males have complex I deficiency in brain and retina and
    progressive degeneration of cerebellar and retinal neurons that later
    involves thalamus, striatum and cortex.
  evidence:
  - reference: PMID:12353028
    reference_title: "The harlequin mouse mutation downregulates apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have identified the Hq mutation as a proviral insertion in the apoptosis-inducing factor (Aif) gene, causing about an 80% reduction in AIF expression."
    explanation: Defines the model's genetic lesion.
  modeled_mechanisms:
  - target: Combined Oxidative Phosphorylation Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced AIF lowers OXPHOS and complex I subunits in brain and retina.
    limitations: >-
      A global hypomorph rather than a knock-in of a patient allele, so it
      models loss of AIF amount but not the altered DNA binding of p.Arg201del.
      The biochemical pattern is complex I-predominant, whereas several patients
      show complex III or IV deficiency.
    evidence:
    - reference: PMID:15526035
      reference_title: "AIF deficiency compromises oxidative phosphorylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Harlequin mice with reduced AIF expression due to a retroviral insertion into the AIF gene also manifest a reduced oxidative phosphorylation (OXPHOS) in the retina and in the brain, correlating with reduced expression of complex I subunits, retinal degeneration, and neuronal defects."
      explanation: The model reproduces the OXPHOS defect in nervous tissue.
  - target: Progressive Neuronal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Progressive, multifocal neurodegeneration preceded by mitochondrial
      degeneration.
    limitations: >-
      Onset is in adulthood (months) and cerebellar and retinal predominant,
      while the human disease is neonatal or infantile and dominated by
      encephalopathy, basal ganglia injury and neuropathy.
    evidence:
    - reference: PMID:12353028
      reference_title: "The harlequin mouse mutation downregulates apoptosis-inducing factor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Harlequin (Hq) mutant mice have progressive degeneration of terminally differentiated cerebellar and retinal neurons."
      explanation: Progressive neurodegeneration in the AIF hypomorph.
- name: Muscle- and heart-specific Aif knockout mouse
  species: Mouse
  genotype: Conditional Aif deletion in cardiac and skeletal muscle
  publication: PMID:16287843
  description: >-
    Tissue-restricted deletion of Aif in striated muscle, isolating the muscle
    and heart consequences of AIF loss from its neuronal effects.
  evidence:
  - reference: PMID:16287843
    reference_title: "Muscle-specific loss of apoptosis-inducing factor leads to mitochondrial dysfunction, skeletal muscle atrophy, and dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice in which Aif has been inactivated specifically in cardiac and skeletal muscle exhibit impaired activity and protein expression of respiratory chain complex I."
    explanation: Defines the model and its respiratory chain defect.
  modeled_mechanisms:
  - target: Mitochondrial Myopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Muscle atrophy with lactic acidemia after muscle-specific AIF loss.
    limitations: >-
      Complete tissue-specific knockout rather than a hypomorphic patient
      allele, and without the neurogenic component present in patients.
    evidence:
    - reference: PMID:16287843
      reference_title: "Muscle-specific loss of apoptosis-inducing factor leads to mitochondrial dysfunction, skeletal muscle atrophy, and dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant animals develop severe dilated cardiomyopathy, heart failure, and skeletal muscle atrophy accompanied by lactic acidemia consistent with defects in the mitochondrial respiratory chain."
      explanation: Reproduces skeletal muscle atrophy with lactic acidemia.
  - target: Cardiomyocyte Energy Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Dilated cardiomyopathy and heart failure after cardiac AIF loss.
    limitations: >-
      The mice develop dilated cardiomyopathy, whereas patients more often
      present first with ventricular hypertrophy.
    evidence:
    - reference: PMID:16287843
      reference_title: "Muscle-specific loss of apoptosis-inducing factor leads to mitochondrial dysfunction, skeletal muscle atrophy, and dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant animals develop severe dilated cardiomyopathy, heart failure, and skeletal muscle atrophy accompanied by lactic acidemia consistent with defects in the mitochondrial respiratory chain."
      explanation: Cardiac AIF loss causes cardiomyopathy.
diagnosis:
- name: Respiratory chain enzymology and AIF immunoblot
  description: >-
    Spectrophotometric respiratory chain assays in muscle or fibroblasts show
    combined deficiency of complexes I, III and/or IV, and immunoblot shows
    reduced AIF protein in patient fibroblasts. The pattern differs between
    tissues and alleles, and lactate can be normal.
  evidence:
  - reference: PMID:37644805
    reference_title: "Expanding the spectrum of neonatal-onset AIFM1-associated disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies on cultured fibroblast showed a clear reduction in AIFM1 protein amount and defective activities of respiratory chain complexes I, III and IV."
    explanation: Fibroblast studies support the diagnosis and the pathogenicity of a new variant.
- name: Exome sequencing
  description: >-
    Diagnosis rests on a hemizygous pathogenic AIFM1 variant, usually found by
    exome sequencing. Intronic splice variants have been confirmed by RNA
    analysis.
  evidence:
  - reference: PMID:37644805
    reference_title: "Expanding the spectrum of neonatal-onset AIFM1-associated disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CES analysis revealed the likely pathogenic variant c.5T>C; p.(Phe2Ser) in the AIFM1 gene."
    explanation: Clinical exome sequencing identified the causal variant.
  - reference: PMID:35712626
    reference_title: "Case Report: A Novel Intronic Mutation in AIFM1 Associated With Fatal Encephalomyopathy and Mitochondrial Disease in Infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings expand the mutation spectrum of AIFM1 and point out the necessity of intronic sequence analysis and the importance for integrative functional studies in the interpretation of sequence variants."
    explanation: Intronic variants need specific analysis and functional confirmation.
treatments:
- name: Mitochondrial cofactor supplementation
  description: >-
    Riboflavin, the precursor of FAD, has been given on the rationale that it
    stabilizes the flavin-bound AIF protein, alone or with coenzyme Q10 and
    thiamine. Results are mixed. One founding patient had prolonged
    neurological improvement, with correction of respiratory chain defects in
    his fibroblasts. A neonatal-onset patient on riboflavin, coenzyme Q10 and
    thiamine did not deteriorate further over six months. A slowly progressive
    patient had no change in clinical course on coenzyme Q10 and riboflavin, and
    riboflavin did not stabilize AIF in p.Pro169Leu fibroblasts. In the allelic
    childhood ataxia phenotype, riboflavin up to 200 mg per day partially
    improved ataxia scores. There are no controlled data.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Unstable AIF Protein
    treatment_effect: RESTORES
    description: >-
      Proposed to stabilize FAD binding in mitochondrial AIF; supported in
      fibroblasts of one allele and not of another.
    evidence:
    - reference: PMID:20362274
      reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "correction of RC defects in mutant fibroblasts, suggesting that stabilization of the FAD binding in AIF(mit) is beneficial"
      explanation: Riboflavin corrected respiratory-chain defects in patient fibroblasts, supporting FAD-binding stabilization of AIF.
    - reference: PMID:34117073
      reference_title: "Severe multisystem pathology, metabolic acidosis, mitochondrial dysfunction, and early death associated with an X-linked AIFM1 variant."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "The reduced abundance of AIFM1 in the patient cells could not be stabilized with riboflavin or protease inhibitor treatment."
      explanation: Riboflavin did not restore AIF levels in p.Pro169Leu fibroblasts.
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "riboflavin supplementation was associated with prolonged improvement of patient #1's neurological conditions"
    explanation: Prolonged neurological improvement on riboflavin in the founding family (uncontrolled single-patient observation).
  - reference: PMID:37644805
    reference_title: "Expanding the spectrum of neonatal-onset AIFM1-associated disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Riboflavin, Coenzyme Q10 and thiamine supplementation was therefore given. At 6 months of age, the patient exhibited microcephaly but did not experience any further deterioration."
    explanation: Combined cofactor supplementation in a neonatal-onset patient, followed by clinical stability (uncontrolled).
  - reference: PMID:25934856
    reference_title: "A slowly progressive mitochondrial encephalomyopathy widens the spectrum of AIFM1 disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Coenzyme Q10 and riboflavin supplementation did not modify clinical course."
    explanation: No clinical benefit in a patient with the slowly progressive form.
  - reference: PMID:28967629
    reference_title: "Mutations in AIFM1 cause an X-linked childhood cerebellar ataxia partially responsive to riboflavin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ataxia score, decreased by 39% in patient 1 and 20% in patient 2 following 12 months of treatment."
    explanation: >-
      Partial response to riboflavin in two boys with an allelic AIFM1 ataxia
      phenotype; indirect for the encephalomyopathy.
- name: Antiseizure pharmacotherapy
  description: >-
    Seizures are treated with standard antiseizure drugs; phenobarbital was

- name: Cardiomyocyte Energy Failure
  biological_scale: CELLULAR
  description: >-
    Cardiac involvement is reported in a minority of patients, usually as
    ventricular hypertrophy beginning before or soon after birth that can
    progress to dilation and heart failure. Heart- and muscle-specific Aif
    deletion in the mouse causes complex I deficiency and dilated
    cardiomyopathy, supporting a direct bioenergetic mechanism in
    cardiomyocytes.

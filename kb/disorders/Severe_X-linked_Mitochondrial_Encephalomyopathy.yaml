- name: Mitochondrial Myopathy
  biological_scale: TISSUE
  description: >-
    Skeletal muscle shows mitochondrial myopathy: ragged-red or COX-hyporeactive
    fibers, abnormal mitochondria and atrophic fibers, on top of neurogenic
    (denervation) change. Deleting Aif in mouse muscle and heart alone causes
    complex I deficiency, skeletal muscle atrophy and lactic acidemia, so the
    myopathy is a primary consequence of AIF loss in muscle and not only
    secondary to denervation.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber

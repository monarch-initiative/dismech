prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Known only from case reports and small families. A 2015 review counted 11
    affected males in three families across the AIFM1 phenotypes then known,
    before adding a twelfth patient; no population prevalence or incidence has
    been estimated.
  evidence:
  - reference: PMID:25583628
    reference_title: "From ventriculomegaly to severe muscular atrophy: expansion of the clinical spectrum related to mutations in AIFM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far mutations in AIFM1, a X-chromosomal gene coding for AIF, have been described in three families with 11 affected males."
    explanation: Gives the case count at the time, before the authors added a further patient.
progression:
- phase: Prenatal to neonatal onset
  age_range: prenatal to first month
  notes: >-
    The severe end presents before or at birth, with prenatal ventriculomegaly,
    neonatal lactic acidosis or seizures within hours of birth.
  evidence:
  - reference: PMID:37644805
    reference_title: "Expanding the spectrum of neonatal-onset AIFM1-associated disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with drug-resistant, electro-clinical, multifocal seizures 6 h after birth."
    explanation: Onset within hours of birth.
- phase: Variable progression
  age_range: infancy to adulthood
  notes: >-
    Severity varies even within a family. Some children die before age 5
    years; others progress in steps over decades, becoming chair-bound in early
    adulthood.
  evidence:
  - reference: PMID:25583628
    reference_title: "From ventriculomegaly to severe muscular atrophy: expansion of the clinical spectrum related to mutations in AIFM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severity varies greatly even within one family with onset of symptoms between birth and adolescence."
    explanation: Documents the variable onset and severity.
  - reference: PMID:25934856
    reference_title: "A slowly progressive mitochondrial encephalomyopathy widens the spectrum of AIFM1 disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He became chair-bound at age 20 years, needed acoustic aids at age 22 years, and developed progressive sleep apnea syndrome since age 23 years."
    explanation: Slow progression into adulthood in one patient.
- phase: Early death in the severe form
  age_range: first days to early childhood
  notes: >-
    The most severe cases die in the first months of life (day 8 and 4 months
    in two reports). In a 2015 review 3 of 12 patients died before age 5
    years. Death in infancy is recorded here rather than as a phenotype
    because the HPO term HP:0001522 sits under clinical course (mortality),
    outside the phenotypic-abnormality branch the phenotype slot accepts.
  evidence:
  - reference: PMID:28299359
    reference_title: "AIFM1 mutation presenting with fatal encephalomyopathy and mitochondrial disease in an infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given his poor neurologic prognosis, care was redirected, and he died at the age of 4 mo."
    explanation: Death at 4 months of age.
  - reference: PMID:34117073
    reference_title: "Severe multisystem pathology, metabolic acidosis, mitochondrial dysfunction, and early death associated with an X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband, his brother, and their maternal uncle all exhibited severe multisystem pathology, metabolic acidosis, and early demise."
    explanation: Early death in three affected males of one family.
  - reference: PMID:25583628
    reference_title: "From ventriculomegaly to severe muscular atrophy: expansion of the clinical spectrum related to mutations in AIFM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 of 12 patients died before age 5 years while others were still able to walk during young adulthood."
    explanation: Gives the proportion dying in early childhood and the survival of others into adulthood.
notes: >-
  Scope. This entry covers the encephalomyopathic, combined-OXPHOS-deficient
  end of the AIFM1 phenotypic continuum (COXPD6, OMIM 300816). The allelic
  entities are curated separately: Charcot-Marie-Tooth Disease X-linked
  Recessive 4 (Cowchock syndrome), the AUNX1 subtype of Auditory Neuropathy,
  and Spondyloepimetaphyseal Dysplasia Bieganski Type. The boundary is not
  sharp. The slowly progressive encephalomyopathy (p.Gly262Ser) and the boy
  with ataxia, hearing loss and later muscle wasting (p.Val243Leu) are
  included here because both were reported as mitochondrial encephalomyopathy
  with respiratory chain deficiency; the riboflavin-responsive childhood
  ataxia patients (p.Met340Thr, p.Thr141Ile) are cited only for treatment,
  marked indirect. The 11-year-old reported as COXPD6 for anesthetic care was
  first diagnosed with a CMTX4-associated variant, which illustrates the
  overlap.

  Phenotype frequencies are omitted: published cases are too few for a
  reliable band. Lactate is normal in some families, so a normal lactate does
  not exclude the disease.

  No GeneReviews or StatPearls chapter names this disease (just
  check-genereviews --online, Bookshelf index snapshot 2026-09-10 plus a live
  PubMed title search, returned NO_CHAPTER for both).

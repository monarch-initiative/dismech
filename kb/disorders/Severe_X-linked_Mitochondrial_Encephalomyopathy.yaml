name: Severe X-linked Mitochondrial Encephalomyopathy
creation_date: "2026-10-01T21:34:26Z"
category: Mendelian
disease_term:
  preferred_term: severe X-linked mitochondrial encephalomyopathy
  term:
    id: MONDO:0010437
    label: severe X-linked mitochondrial encephalomyopathy
parents:
- Mitochondrial Disease
synonyms:
- COXPD6
- combined oxidative phosphorylation deficiency 6
- combined oxidative phosphorylation deficiency type 6
- combined oxidative phosphorylation deficiency 6, X-linked recessive
- encephalomyopathy, mitochondrial, X-linked
- mitochondrial encephalomyopathy due to COXPD6
- AIFM1-related mitochondrial encephalomyopathy
description: >-
  Severe X-linked mitochondrial encephalomyopathy, also called combined
  oxidative phosphorylation deficiency 6 (COXPD6, OMIM 300816), is an
  ultra-rare primary mitochondrial disease of hemizygous males caused by
  pathogenic variants in AIFM1 (Xq26.1). AIFM1 encodes apoptosis-inducing
  factor (AIF), an FAD-dependent NADH oxidoreductase anchored in the
  mitochondrial intermembrane space. AIF has two functions that both matter
  here. Its vital function is to support biogenesis of the respiratory chain:
  AIF imports and partners CHCHD4 (MIA40), the receptor of the intermembrane
  space disulfide relay, which in turn imports complex I subunits such as
  NDUFS5. Its lethal function is exercised when a soluble AIF fragment is
  released and moves to the nucleus to drive caspase-independent chromatin
  fragmentation (parthanatos).

  The founding allele, an in-frame deletion of arginine 201, destabilizes AIF,
  reduces respiratory chain activities in patient fibroblasts and muscle, and
  increases the DNA-binding affinity of soluble AIF, so that patient cells show
  both an oxidative phosphorylation (OXPHOS) defect and exaggerated
  parthanatos. Later alleles (missense, splice and targeting-sequence variants)
  likewise reduce steady-state AIF and produce combined complex I, III and/or IV
  deficiency with tissue-dependent biochemical patterns.

  Clinically the disease is an infantile- or neonatal-onset progressive
  encephalomyopathy: severe psychomotor delay or regression, seizures that can
  be intractable, hypotonia, extrapyramidal signs, axonal sensorimotor
  neuropathy with denervation, myopathy, lactic acidosis, and basal ganglia
  (striatal) involvement on imaging or pathology in many cases; a neonatal
  presentation with diffuse cortical and white-matter injury that relatively
  spares the basal ganglia is also reported, so the imaging pattern is not
  uniform. Prenatal ventriculomegaly,
  cardiac hypertrophy and death in infancy are reported in the severe end; a
  slower course with ataxia, cerebellar atrophy, hearing loss,
  ophthalmoplegia and respiratory failure is reported in other males. Treatment is supportive; riboflavin, the FAD precursor, has
  been given with mixed results.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      An infantile mitochondrial encephalomyopathy with central nervous system,
      peripheral nerve and muscle involvement.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      A combined respiratory chain (oxidative phosphorylation) deficiency, one
      of the inborn errors of mitochondrial energy metabolism.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Caused by loss of the AIF-dependent CHCHD4 import and respiratory chain
      assembly function, with an added increase in AIF-mediated parthanatos.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:E88.49
      label: Other mitochondrial metabolism disorders
    mapping_predicate: skos:broadMatch
    mapping_source: ICD-10-CM
    mapping_justification: >-
      ICD-10-CM has no code specific to AIFM1-related disease or to combined
      oxidative phosphorylation deficiency. E88.49 is the residual code in the
      E88.4 mitochondrial metabolism block and is therefore a broad match.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are hemizygous males. In the founding family the two
    affected boys were born to monozygotic twin sisters by unrelated fathers,
    and later variants were shown to be inherited from asymptomatic carrier
    mothers or to arise de novo. A heterozygous female can be affected when X
    inactivation is extremely skewed: a girl carrying p.Pro169Leu with 98:2
    skewing had infantile encephalomyopathy and cardiomyopathy, the same allele
    that killed three males of another family.
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients were born from monozygotic twin sisters and unrelated fathers, suggesting an X-linked trait."
    explanation: The founding pedigree pattern points to X-linked transmission through the twin mothers.
  - reference: PMID:25934856
    reference_title: "A slowly progressive mitochondrial encephalomyopathy widens the spectrum of AIFM1 disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother, heterozygous for the mutation, was asymptomatic"
    explanation: An asymptomatic heterozygous carrier mother transmitted the variant to an affected son, as expected for X-linked recessive inheritance.
  - reference: PMID:42329587
    reference_title: "Cardiomyopathy and mitochondrial encephalomyopathy in a female child associated with a heterozygous X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified a heterozygous AIFM1 variant, c.506C > T (p.Pro169Leu), with extremely skewed X-inactivation (98:2) in a female."
    explanation: Documents a manifesting heterozygous female with extreme X-inactivation skewing, the exception to male-only expression.
genetic:
- name: AIFM1
  gene_term:
    preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    AIFM1 (Xq26.1) encodes apoptosis-inducing factor, a 613-residue
    mitochondrial flavoprotein with FAD- and NADH-binding domains. Reported
    COXPD6 alleles are in-frame deletions, missense, splice and
    mitochondrial-targeting-sequence variants; no truncating allele has been
    reported, and the gene is highly intolerant of loss of function in
    population data. The alleles studied functionally lower steady-state AIF
    protein in patient cells.

    The same gene carries a phenotypic continuum that dismech curates as
    separate allelic entries: X-linked recessive Charcot-Marie-Tooth disease 4
    (Cowchock syndrome), the X-linked auditory neuropathy subtype AUNX1 within
    the Auditory Neuropathy entry, and spondyloepimetaphyseal dysplasia
    (Bieganski type, hypomyelination with spondylometaphyseal dysplasia). This
    entry covers the encephalomyopathic, combined-OXPHOS-deficient end.
  variants:
  - name: "AIFM1 c.601_603del (p.Arg201del)"
    description: >-
      The founding allele, segregating in two male infants with progressive
      encephalomyopathy. It destabilizes both the mitochondrial and the soluble
      forms of AIF and increases the DNA-binding affinity of the soluble form.
    clinical_significance: PATHOGENIC
  - name: "AIFM1 c.506C>T (p.Pro169Leu)"
    description: >-
      Found in a family with three affected males with severe multisystem
      disease, metabolic acidosis and early death, and separately in a
      manifesting heterozygous girl with extreme X-inactivation skewing.
      Patient fibroblasts show reduced AIF and complex I subunits.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a disease-segregating mutation in the X-linked AIFM1 gene, encoding the Apoptosis-Inducing Factor (AIF) mitochondrion-associated 1 precursor that deletes arginine 201 (R201 del)."
    explanation: Identifies AIFM1 as the disease gene by segregation of the p.Arg201del allele.
  - reference: PMID:22019070
    reference_title: "Early prenatal ventriculomegaly due to an AIFM1 mutation identified by linkage analysis and whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a pathogenic mutation in the AIFM1 gene which segregated with the disease state and was absent in 86 anonymous controls."
    explanation: A second, independent family confirms AIFM1 as the causal gene.
  - reference: PMID:34117073
    reference_title: "Severe multisystem pathology, metabolic acidosis, mitochondrial dysfunction, and early death associated with an X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No frameshift or nonsense variants have been reported in the Human Gene Mutation Database (HGMD), and the gene is highly intolerant to loss of function (pLI = 1 in gnomAD)."
    explanation: Records the allele classes reported and the constraint on loss-of-function alleles.
pathophysiology:
- name: Unstable AIF Protein
  biological_scale: MOLECULAR
  description: >-
    Disease alleles lower the amount of functional AIF in mitochondria. The
    founding p.Arg201del allele decreases the stability of both mitochondrial
    and soluble AIF; missense and targeting-sequence alleles (p.Gly262Ser,
    p.Phe2Ser, p.Pro169Leu) give a marked reduction of AIF on immunoblot of
    patient fibroblasts. The variants sit in or near the FAD- and NADH-binding
    domains, which is the rationale for trying riboflavin to stabilize the
    flavin-bound protein.
  genetic_context:
    genes:
    - preferred_term: AIFM1
      term:
        id: hgnc:8768
        label: AIFM1
    variant_origin: GERMLINE
    description: >-
      Hemizygous germline AIFM1 variants, inherited from a carrier mother or
      arising de novo.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  molecular_functions:
  - preferred_term: FAD binding
    term:
      id: GO:0050660
      label: flavin adenine dinucleotide binding
  - preferred_term: inner-membrane anchoring of the CHCHD4 import receptor
    term:
      id: GO:0043495
      label: protein-membrane adaptor activity
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  downstream:
  - target: Impaired CHCHD4 Mitochondrial Import
    description: >-
      Reduced AIF lowers mitochondrial import of CHCHD4, the intermembrane
      space import receptor.
    evidence:
    - reference: PMID:26004228
      reference_title: "Interaction between AIF and CHCHD4 Regulates Respiratory Chain Biogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Depletion or hypomorphic mutation of AIF caused a downregulation of CHCHD4 protein by diminishing its mitochondrial import."
      explanation: Shows that loss or hypomorphic mutation of AIF reduces CHCHD4 import, the edge from AIF loss to the import defect.
  - target: Enhanced AIF-Dependent Parthanatos
    description: >-
      The founding allele also increases the DNA-binding affinity of soluble
      AIF, the prerequisite for its nuclear pro-death action.
    evidence:
    - reference: PMID:20362274
      reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro, the AIF(R201 del) mutation decreases stability of both AIF(mit) and AIF(sol) and increases the AIF(sol) DNA binding affinity, a prerequisite for nuclear apoptosis."
      explanation: Links the variant's effect on soluble AIF to the nuclear cell-death branch.
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that AIF(R201 del) is an unstable mutant variant associated with increased parthanatos-linked cell death."
    explanation: The founding allele produces an unstable AIF protein.
  - reference: PMID:39806100
    reference_title: "NADH-bound AIF activates the mitochondrial CHCHD4/MIA40 chaperone by a substrate-mimicry mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NADH allosterically configures AIF to anchor CHCHD4's β-hairpin and histidine-helix motifs to the inner mitochondrial membrane."
    explanation: >-
      Establishes AIF's normal molecular role as the inner-membrane anchor for the
      CHCHD4 import receptor, the activity bound here as DECREASED when disease
      alleles lower the amount of functional AIF.
  - reference: PMID:25934856
    reference_title: "A slowly progressive mitochondrial encephalomyopathy widens the spectrum of AIFM1 disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis on patient fibroblasts showed strong reduction in AIF amount (figure, G), indicating instability of the mutant protein"
    explanation: A missense allele (p.Gly262Ser) also lowers AIF protein in patient fibroblasts.
  - reference: PMID:37644805
    reference_title: "Expanding the spectrum of neonatal-onset AIFM1-associated disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies on cultured fibroblast showed a clear reduction in AIFM1 protein amount and defective activities of respiratory chain complexes I, III and IV."
    explanation: A targeting-sequence allele (p.Phe2Ser) reduces AIF protein in patient fibroblasts.

- name: Impaired CHCHD4 Mitochondrial Import
  biological_scale: MOLECULAR
  description: >-
    AIF binds CHCHD4 (MIA40) and is needed both to import it and to keep it in
    a form that engages its substrates in the intermembrane space disulfide
    relay. AIF deficiency lowers CHCHD4 protein in patient fibroblasts and in
    harlequin mouse tissue, without lowering its mRNA, and forcing CHCHD4 back
    into mitochondria restores respiration in AIF-deficient cells.
  biological_processes:
  - preferred_term: protein import into mitochondrial intermembrane space
    term:
      id: GO:0045041
      label: protein import into mitochondrial intermembrane space
    modifier: DECREASED
  - preferred_term: mitochondrial disulfide relay import
    term:
      id: GO:0160203
      label: protein import into the intermembrane space via the disulfide relay system
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  downstream:
  - target: Defective Respiratory Chain Complex Assembly
    description: >-
      Without functional CHCHD4, intermembrane space import of complex I
      subunits such as NDUFS5 fails and respiratory complexes are lost.
    evidence:
    - reference: PMID:35859387
      reference_title: "AIFM1 is a component of the mitochondrial disulfide relay that drives complex I assembly through efficient import of NDUFS5."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The import defect is especially severe for NDUFS5, a subunit of complex I of the respiratory chain."
      explanation: Identifies the complex I subunit whose import depends on the AIF-CHCHD4 relay.
    - reference: PMID:26158520
      reference_title: "Loss of apoptosis-inducing factor critically affects MIA40 function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, MIA40 overexpression counteracts loss of respiratory subunits in Hq cells."
      explanation: Restoring MIA40 rescues respiratory subunits in AIF-deficient cells, so the MIA40 defect is upstream of their loss.
  evidence:
  - reference: PMID:26004228
    reference_title: "Interaction between AIF and CHCHD4 Regulates Respiratory Chain Biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHCHD4 depletion sufficed to induce a respiratory defect that mimicked that observed in AIF-deficient cells."
    explanation: Loss of CHCHD4 alone reproduces the AIF-deficient respiratory defect.
  - reference: PMID:26158520
    reference_title: "Loss of apoptosis-inducing factor critically affects MIA40 function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that AIF physically interacts with the oxidoreductase CHCHD4/MIA40."
    explanation: Establishes the physical AIF-CHCHD4 interaction.
  - reference: PMID:35859387
    reference_title: "AIFM1 is a component of the mitochondrial disulfide relay that drives complex I assembly through efficient import of NDUFS5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, we demonstrate that AIFM1 serves two overlapping functions: importing MIA40/CHCHD4 and constituting an integral part of the disulfide relay that ensures efficient interaction of MIA40/CHCHD4 with specific substrates."
    explanation: >-
      AIFM1 is itself part of the disulfide relay, so its loss decreases relay-dependent
      import as well as CHCHD4 import, supporting the disulfide-relay process term.

- name: Defective Respiratory Chain Complex Assembly
  biological_scale: MOLECULAR
  description: >-
    Complex I assembly stalls when NDUFS5 is not imported, and AIF-deficient
    human and mouse cells contain less assembled complex I and fewer of its
    subunits. Other complexes (III and IV) are also reduced in patient cells,
    with a pattern that varies by allele and tissue.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  downstream:
  - target: Combined Oxidative Phosphorylation Deficiency
    description: >-
      Fewer assembled respiratory complexes lower electron transport and ATP
      synthesis.
    evidence:
    - reference: PMID:15526035
      reference_title: "AIF deficiency compromises oxidative phosphorylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "human or mouse cells lacking AIF as a result of homologous recombination or small interfering RNA exhibit high lactate production and enhanced dependency on glycolytic ATP generation, due to severe reduction of respiratory chain complex I activity."
      explanation: Ties the complex I loss to reduced respiration and a glycolytic, lactate-producing state.
  evidence:
  - reference: PMID:35859387
    reference_title: "AIFM1 is a component of the mitochondrial disulfide relay that drives complex I assembly through efficient import of NDUFS5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lack of mitochondrial NDUFS5 in turn results in stalling of complex I assembly."
    explanation: Mechanism by which AIF loss stalls complex I assembly.
  - reference: PMID:15526035
    reference_title: "AIF deficiency compromises oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although AIF itself is not a part of complex I, AIF-deficient cells exhibit a reduced content of complex I and of its components"
    explanation: AIF is required for normal complex I content.

- name: Combined Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts and muscle show reduced activities of respiratory
    chain complexes. The pattern varies: complexes III and IV with preserved
    complex I in the founding fibroblasts; complexes I and IV in muscle of a
    fatal infantile case and in the ventriculomegaly family; complexes I, III
    and IV in neonatal-onset fibroblasts; profound complex IV loss in muscle of
    the p.Pro169Leu family. Re-expressing wild-type AIF restores the
    activities, so the deficiency is a direct consequence of the variant. The
    downstream cost is an energy deficit with lactate accumulation.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Decreased activity of mitochondrial complex IV
  - target: Decreased activity of mitochondrial complex III
  - target: Decreased activity of mitochondrial complex I
  - target: Lactic acidosis
    description: >-
      Impaired respiration forces glycolytic ATP generation with lactate
      overproduction.
  - target: Increased CSF lactate
  - target: Elevated brain lactate level by MRS
  - target: Progressive Neuronal Degeneration
    description: >-
      Energy failure in neurons, the tissue most dependent on oxidative
      phosphorylation, precedes neuronal loss in the AIF-deficient mouse.
  - target: Mitochondrial Myopathy
  - target: Cardiomyocyte Energy Failure
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from both showed reduction of respiratory chain (RC) cIII and cIV, but not of cI activities."
    explanation: Combined respiratory chain deficiency in the founding patients' fibroblasts.
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In AIF(R201 del) fibroblasts, staurosporine-induced parthanatos was markedly increased, whereas re-expression of AIF(wt) induced recovery of RC activities."
    explanation: Wild-type AIF rescues the respiratory chain defect, placing it downstream of the variant.
  - reference: PMID:22019070
    reference_title: "Early prenatal ventriculomegaly due to an AIFM1 mutation identified by linkage analysis and whole exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma and CSF lactate levels were normal, but the activities of mitochondrial complex I and IV were markedly decreased."
    explanation: Complex I and IV deficiency in a second family, notable for normal lactate.
  - reference: PMID:28299359
    reference_title: "AIFM1 mutation presenting with fatal encephalomyopathy and mitochondrial disease in an infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy during this admission demonstrated decreased activity of electron transport chain complex I and IV, with normal activity of complexes II and III."
    explanation: Combined complex I and IV deficiency in muscle of a fatal infantile case.

- name: Enhanced AIF-Dependent Parthanatos
  biological_scale: CELLULAR
  description: >-
    Separately from the OXPHOS defect, patient cells are primed for
    caspase-independent, AIF-mediated cell death (parthanatos). Staurosporine
    induces more parthanatos in p.Arg201del fibroblasts, patient muscle shows
    many TUNEL-positive, caspase 3-negative nuclei, and p.Pro169Leu fibroblasts
    are more sensitive to staurosporine and show more nuclear condensation under
    galactose. How much this branch contributes to neuronal loss in patients,
    as opposed to muscle, has not been measured.
  notes: >-
    GO has no parthanatos term, so the process is bound to the generic
    GO:0012501 programmed cell death with the specificity carried in
    preferred_term. Do not "correct" this to GO:0097300 programmed necrotic
    cell death: parthanatos is caspase-independent but not necroptotic.
  biological_processes:
  - preferred_term: parthanatos (caspase-independent AIF-mediated programmed cell death)
    term:
      id: GO:0012501
      label: programmed cell death
    modifier: INCREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Mitochondrial Myopathy
    description: >-
      Parthanatos-type nuclei are seen in patient muscle, the tissue where
      this branch has been observed directly.
    evidence:
    - reference: PMID:20362274
      reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Numerous TUNEL-positive, caspase 3-negative nuclei were visualized in patient #1's muscle, again indicating markedly increased parthanatos in the AIF(R201 del) critical tissues."
      explanation: Direct observation of parthanatos-type cell death in patient muscle.
  - target: Progressive Neuronal Degeneration
    description: >-
      Inferred by extension from muscle and fibroblasts; parthanatos has not
      been demonstrated in patient brain.
  evidence:
  - reference: PMID:20362274
    reference_title: "Severe X-linked mitochondrial encephalomyopathy associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In AIF(R201 del) fibroblasts, staurosporine-induced parthanatos was markedly increased"
    explanation: Patient fibroblasts show increased parthanatos.
  - reference: PMID:34117073
    reference_title: "Severe multisystem pathology, metabolic acidosis, mitochondrial dysfunction, and early death associated with an X-linked AIFM1 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies carried out on fibroblasts from the proband demonstrated reduced steady state levels of the AIFM1 protein, decreased Complex I subunit abundance, elevated sensitivity to the apoptosis inducer staurosporine, and increased nuclear condensation when grown in galactose-containing media."
    explanation: A second allele also increases cell-death sensitivity in patient fibroblasts.

- name: Progressive Neuronal Degeneration
  biological_scale: TISSUE
  description: >-
    Neurons of the cortex, basal ganglia, thalamus, cerebellum, brainstem,
    lower motor neurons and peripheral axons degenerate. Autopsy of a fatal
    infantile case showed mitochondrial encephalopathy with profound occipital
    cortical neuronal loss, gliosis and axonal degeneration in peripheral
    nerve; denervation in muscle reflects motor neuron and axonal loss. In the
    harlequin mouse, which keeps about 20% of normal AIF, mitochondria
    degenerate before neurons do, and neurodegeneration spreads from the
    cerebellum to the thalamus, striatum and cortex.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Encephalopathy
  - target: Global developmental delay
  - target: Developmental regression
  - target: Seizure
  - target: Abnormality of extrapyramidal motor function
  - target: Bilateral striatal necrosis
  - target: Abnormal basal ganglia MRI signal intensity
  - target: Cerebral atrophy
  - target: Cerebral edema
  - target: Diffuse white matter abnormality
  - target: Multicystic encephalomalacia
  - target: EEG burst suppression
  - target: Ventriculomegaly
  - target: Microcephaly
  - target: Peripheral axonal neuropathy
  - target: EMG and muscle biopsy denervation
  - target: Hypotonia
  - target: Sensorineural hearing impairment
  - target: Ataxia
  - target: Cerebellar atrophy
  - target: External ophthalmoplegia
  - target: Dysphagia
  evidence:
  - reference: PMID:28299359
    reference_title: "AIFM1 mutation presenting with fatal encephalomyopathy and mitochondrial disease in an infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy, at the age of 4 mo, revealed features of mitochondrial encephalopathy, myopathy, and involvement of peripheral nerves with axonal degeneration."
    explanation: Human autopsy evidence of central and peripheral neurodegeneration.
  - reference: PMID:28299359
    reference_title: "AIFM1 mutation presenting with fatal encephalomyopathy and mitochondrial disease in an infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the occipital cortex showed profound neuronal loss"
    explanation: Documents cortical neuronal loss at autopsy.
  - reference: PMID:26173962
    reference_title: "A novel AIFM1 mutation expands the phenotype to an infantile motor neuron disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patients manifested a phenotype that included signs of both cortical and motor neuron involvement."
    explanation: Cortical and lower motor neuron involvement in two cousins with early-onset encephalopathy.
  - reference: PMID:17805014

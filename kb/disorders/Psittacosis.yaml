    explanation: States the same attribution under the former genus name, and identifies the disease as a bird-borne zoonotic pneumonia.
agent_life_cycle:
  description: >-
    Chlamydia psittaci is maintained in a broad avian reservoir (documented in
    467 bird species across 30 avian orders, prominently psittacine pet birds,
    pigeons, and domestic poultry) and undergoes an obligate intracellular
    biphasic developmental cycle alternating between the extracellular
    infectious elementary body (EB) and the intracellular replicative reticulate
    body (RB). Under host immune or antimicrobial stress (such as IFN-gamma or
    beta-lactam exposure), C. psittaci can enter a viable non-cultivable
    persistent state capable of reactivation and prolonged avian shedding;
    humans are infected predominantly as incidental zoonotic hosts via aerosol
    inhalation.
  life_cycle_stages:
  - name: Infectious elementary body (EB)
    description: Metabolically quiescent extracellular form transmitted in avian aerosols that attaches to and enters host cells.
  - name: Intracellular replicative reticulate body (RB)
    description: Metabolically active intracellular form that replicates within a host-cell inclusion before redifferentiating into elementary bodies.
  - name: Stress-induced persistent chlamydial form
    description: Viable non-cultivable state induced by IFN-gamma, beta-lactam exposure, or nutrient limitation that permits prolonged carriage and later reactivation.
  hosts:
  - preferred_term: birds
    term:
      id: NCBITaxon:8782
      label: Aves
    role: primary reservoir host
  - preferred_term: psittacine birds (parrots and parakeets)
    term:
      id: NCBITaxon:9223
      label: Psittaciformes
    role: major ornamental bird reservoir
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental zoonotic host
  evidence:
  - reference: PMID:30855889
    reference_title: "Psittacosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Birds serve as the major epidemiological reservoir, and psittacosis can occur after exposure to any bird species and has been documented in 467 species across 30 bird orders."
    explanation: Establishes the broad avian reservoir across 30 bird orders.
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A biphasic developmental cycle alternating between the infectious elementary body (EB) and replicative reticulate body (RB) defines its pathobiology. Under stressors such as interferon-γ (IFN-γ) exposure, β-lactam pressure, nutrient limitation, heat shock, or co-infections, C. psittaci can enter a viable but non-cultivable persistent state that may contribute to prolonged carriage and later recrudescence"
    explanation: Characterizes the obligate intracellular EB-RB developmental cycle and stress-induced persistent state of C. psittaci.
  - reference: PMID:42255501
    reference_title: "The re-emergence of psittacosis in China: a scoping review of epidemiology, diagnostics, and One Health priorities."
    supports: SUPPORT
